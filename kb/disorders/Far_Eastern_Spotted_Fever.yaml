diagnosis:
- name: Eschar or blood PCR with sequencing
  description: >-
    Nested PCR of rickettsial genes from an eschar biopsy or buffy-coat blood
    sample, followed by sequencing, can identify R. heilongjiangensis DNA during
    acute Far Eastern spotted fever.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    R. heilongjiangensis gltA, ompA, or ompB sequences in an eschar or blood
    specimen establish the infecting spotted-fever-group Rickettsia.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten of 17 samples of DNA extracted from skin eschars and seven of 64
      samples of DNA extracted from buffy coats were positive in the nested PCR
      for the gltA gene.
    explanation: >-
      The Russian case series demonstrates rickettsial nested-PCR detection from
      skin eschar biopsies and buffy coats in FESF patients.

- name: Paired rickettsial serology
  description: >-
    Paired acute and convalescent serology can document a rising
    spotted-fever-group antibody response, but cross-reactivity within the
    spotted-fever group limits species-level discrimination without molecular
    confirmation.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  results: >-
    Seroconversion, IgM, or rising IgG against R. heilongjiangensis antigen
    supports a recent spotted-fever-group rickettsial infection.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 9 of 11 available paired sera from PCR-positive patients, we found
      serologic evidence for acute rickettsial infection, e.g., the presence of
      IgM antibodies, seroconversion, or a fourfold rise in antibody titer
      against rickettsial antigens.
    explanation: >-
      Paired sera in PCR-positive patients confirmed acute rickettsial infection
      in most tested FESF cases.

progression:
- phase: Mild doxycycline-responsive acute illness
  notes: >-
    The initial Russian Far East cohort had an abrupt febrile illness after a
    short incubation period and improved quickly after oral doxycycline, with no
    serious complications or deaths recorded.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They received oral doxycycline for 14 days and antihistamine therapy, and
      clinical symptoms resolved within 2 to 3 days.
    explanation: >-
      The original cohort improved promptly after doxycycline treatment,
      supporting a mild, treatment-responsive acute course.
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Generally, the disease is mild, with no serious complications or death recorded.
    explanation: >-
      The authors summarize the observed prognosis in their molecularly
      confirmed Russian Far East cases.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is the empiric treatment for Far Eastern spotted fever because
    it penetrates cells and blocks bacterial ribosomal translation in the
    intracytosolic Rickettsia compartment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: Doxycycline targets bacterial ribosomal protein synthesis.
  - target: Intracytosolic Rickettsia heilongjiangensis Niche
    treatment_effect: BYPASSES
    description: Doxycycline reaches intracellular rickettsiae in host cells.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Doxycycline treatment, 100 mg twice daily for 14 d | 13 |"
    explanation: >-
      All 13 analyzed Russian Far East cases received doxycycline, with rapid
      clinical resolution reported in the cohort narrative.

- name: Personal protection against tick bites
  description: >-
    Avoiding tick bites, using effective skin repellents, wearing
    permethrin-treated outer clothing, and removing attached ticks promptly
    reduce the tick exposure that triggers Far Eastern spotted fever.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: personal tick-bite protection
  target_mechanisms:
  - target: Tick-Borne Rickettsia heilongjiangensis Inoculation
    treatment_effect: INHIBITS
    description: Personal protection measures prevent infectious tick attachment and inoculation.
  evidence:
  - reference: PMID:17338947
    reference_title: Rickettsial and other tick-borne infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The best method to avoid tick bites is twofold: application of a topical
      deet (N,N-diethyl-m-toluamide) repellent to exposed skin, and treatment of
      clothing with permethrin.
    explanation: >-
      Review evidence supports DEET plus permethrin-treated clothing as the core
      behavioral prevention approach for a tick-borne rickettsiosis.

notes: >-
  The MONDO term uses the modern NCBI taxonomy placement Rickettsia conorii
  subsp. heilongjiangensis, while the clinical and vector literature usually
  refers to the agent as Rickettsia heilongjiangensis.

      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After an incubation period of 4 to 7 days, the patient had a sudden onset
      with fever, but no specific symptoms appeared during the first several
      days.
    explanation: >-
      The Russian cohort describes abrupt fever after tick exposure in patients
      with molecularly confirmed R. heilongjiangensis infection.


name: Far Eastern Spotted Fever
creation_date: "2026-09-28T08:01:19Z"
updated_date: "2026-09-28T08:01:19Z"
category: Infectious Disease
description: >-
  Far Eastern spotted fever is an acute tick-borne spotted-fever-group
  rickettsiosis caused by the obligately intracellular bacterium Rickettsia
  conorii subsp. heilongjiangensis. Infected Haemaphysalis ticks inoculate the
  organism into skin, where local infection can produce an eschar and regional
  lymphadenopathy; systemic endothelial infection and small-vessel vasculitis
  drive an acute fever, headache, myalgia or arthralgia, and rash syndrome.
disease_term:
  preferred_term: Far eastern spotted fever
  term:
    id: MONDO:0000231
    label: Far eastern spotted fever
parents:
- Spotted fever rickettsiosis
synonyms:
- Far Eastern tick-borne rickettsiosis
- Rickettsia heilongjiangensis infection

classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:15200813
      reference_title: >-
        Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis
        in Russian Far East.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis
        was diagnosed in 13 patients from the Russian Far East in 2002.
      explanation: >-
        The patient series identifies Far Eastern spotted fever as a bacterial,
        tick-borne rickettsial infection, placing it in Harrison's Infectious
        Diseases Part.

infectious_agent:
- name: Rickettsia conorii subsp. heilongjiangensis
  infectious_agent_term:
    preferred_term: Rickettsia conorii subsp. heilongjiangensis
    term:
      id: NCBITaxon:226665
      label: Rickettsia conorii subsp. heilongjiangensis
  description: >-
    Obligate intracellular spotted-fever-group rickettsial bacterium,
    historically described as Rickettsia heilongjiangensis, that causes Far
    Eastern spotted fever after transmission by infected ticks.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 17 nested PCR amplicons of amplified gltA gene were directly sequenced
      and showed 100% homology. Six amplicons of ompA and ompB genes of
      corresponding samples were also identical with each other.
    explanation: >-
      PCR and sequencing from confirmed Russian Far East cases identified the
      same R. heilongjiangensis agent in patient blood or skin specimens.
  - reference: PMID:20678332
    reference_title: "Human Rickettsia heilongjiangensis infection, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A case of Rickettsia heilongjiangensis infection in Japan was identified
      in a 35-year-old man who had rash, fever, and eschars.
    explanation: >-
      The Japanese case report names R. heilongjiangensis as the pathogen
      detected in a human spotted-fever presentation.

transmission:
- name: Haemaphysalis tick bite transmission
  description: >-
    Humans acquire Far Eastern spotted fever when infected Haemaphysalis ticks
    inoculate R. conorii subsp. heilongjiangensis during blood feeding.
  evidence:
  - reference: PMID:17114683
    reference_title: >-
      Far eastern tick-borne rickettsiosis: identification of two new cases and
      tick vector.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been concluded that H. concinnae may serve as the main vector for
      the transmission of R. heilongjiangensis.
    explanation: >-
      Tick screening and PCR from an acutely ill patient's skin biopsy and
      removed Haemaphysalis tick support H. concinna as the principal vector.
  - reference: PMID:20678332
    reference_title: "Human Rickettsia heilongjiangensis infection, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 72 tick samples, 3 H. concinna nymphs yielded Rickettsia isolates
      and a DNA fragment of Rickettsia, which was detected by PCR.
    explanation: >-
      The first Japanese case was paired with isolation of matching
      R. heilongjiangensis from local H. concinna nymphs in the suspected
      exposure area.

epidemiology:
- name: Northeast Asian Haemaphysalis exposure
  description: >-
    Reported human Far Eastern spotted fever cases cluster in tick-exposed
    residents of the Russian Far East and northern Japan, where H. concinna or
    related Haemaphysalis ticks can carry R. conorii subsp. heilongjiangensis.
  factors:
  - Russian Far East tick exposure
  - Haemaphysalis concinna tick exposure
  - summer outdoor activity in endemic areas
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before the onset of the disease in the summer 2002 (from June to August),
      all patients had a history of tick bite, tick exposure, or a stay in an
      epidemiologically suspected location.
    explanation: >-
      The Russian cohort ties disease onset to summer tick exposure in endemic
      Far East locations.
  - reference: PMID:20678332
    reference_title: "Human Rickettsia heilongjiangensis infection, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also isolated R. heilongjiangensis from H. concinna ticks, a probable
      transmission vector, in the suspected geographic area of infection.
    explanation: >-
      The Japanese report links a local human case to H. concinna ticks in the
      likely exposure zone.

pathophysiology:
- name: Tick-Borne Rickettsia heilongjiangensis Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infected Haemaphysalis ticks inject R. conorii subsp. heilongjiangensis into
    skin while feeding, seeding local rickettsial infection at the bite site.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Dermal Mononuclear Phagocyte Infection
    causal_link_type: DIRECT
    description: Tick inoculation exposes local dermal macrophages and dendritic cells to rickettsiae.
  - target: Inoculation Eschar
    causal_link_type: DIRECT
    description: Local infection at the tick attachment site produces a necrotic eschar.
  evidence:
  - reference: PMID:15200813
    reference_title: >-
      Acute tick-borne rickettsiosis caused by Rickettsia heilongjiangensis in
      Russian Far East.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five to 20 days before onset of the disease, most patients reported tick
      bites or tick exposure.
    explanation: >-
      The case series establishes tick exposure as the initiating event before
      molecularly confirmed R. heilongjiangensis illness.

- name: Dermal Mononuclear Phagocyte Infection
  role: primary_infection
  biological_scale: CELLULAR
  description: >-
    After cutaneous inoculation, spotted-fever-group rickettsiae first infect
    CD68-positive macrophage or dendritic cells in the skin before reaching
    draining nodes and systemic endothelial targets.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  downstream:
  - target: Lymphatic Dissemination to Regional Nodes
    causal_link_type: DIRECT
    description: Dermal infection spreads through lymphatic vessels to draining lymph nodes.
  - target: Intracytosolic Rickettsia heilongjiangensis Niche
    causal_link_type: DIRECT
    description: Rickettsiae occupy the host-cell cytosol after entry.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The initial target cells of infection are CD68+ cells (macrophages and/or
      dendritic cells)
    explanation: >-
      The rickettsial pathogenesis review identifies dermal mononuclear
      phagocytes as the first cells infected after vector-borne inoculation.

- name: Lymphatic Dissemination to Regional Nodes
  role: primary_infection
  biological_scale: TISSUE
  description: >-
    Rickettsiae leave the inoculation site through dermal lymphatic vessels and
    reach the regional draining lymph nodes.
  downstream:
  - target: Regional Lymphadenopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Infection of draining nodes contributes to regional lymphadenopathy near the eschar.
  - target: Small-Vessel Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Lymphatic and hematogenous spread seeds systemic endothelial infection.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The rickettsiae then spread via lymphatic vessels to the regional lymph
      nodes
    explanation: >-
      The review supports lymphatic spread from the inoculation site to
      regional lymph nodes in arthropod-borne rickettsioses.

- name: Intracytosolic Rickettsia heilongjiangensis Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  biological_scale: CELLULAR
  description: >-
    Rickettsia organisms escape into the host-cell cytosol and exploit
    intracellular metabolites, so effective treatment must reach a cytosolic
    bacterial compartment in endothelial and mononuclear phagocyte targets.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Rickettsial Ribosomal Translation
    causal_link_type: DIRECT
    description: Cytosolic R. heilongjiangensis remains dependent on bacterial ribosomal translation.
  - target: Small-Vessel Vasculitis
    causal_link_type: DIRECT
    description: Disseminated rickettsiae infect endothelial cells and trigger vasculitic injury.
  - target: Endothelial Tim-3-Mediated Rickettsial Killing
    causal_link_type: DIRECT
    description: R. heilongjiangensis infection elicits endothelial Tim-3 responses that promote nitric-oxide-mediated killing.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining genes
      for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche as a conserved lifestyle
      feature of Rickettsia species.
  - reference: PMID:26401029
    reference_title: >-
      Enhanced Expression of T-Cell Immunoglobulin and Mucin Domain Protein 3 in
      Endothelial Cells Facilitates Intracellular Killing of Rickettsia
      heilongjiangensis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      T-cell immunoglobulin and mucin domain protein 3 (Tim-3) is expressed in
      human vascular endothelial cells, the major target cells of rickettsiae.
    explanation: >-
      The R. heilongjiangensis Tim-3 study anchors the vascular endothelium as a
      host target cell type for rickettsial infection.

- name: Small-Vessel Vasculitis
  role: vascular_response
  biological_scale: TISSUE
  description: >-
    Disseminated rickettsial infection injures vascular endothelium, increases
    vascular permeability, and produces the rash and edema-centered tissue
    injury characteristic of spotted-fever-group rickettsioses.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: ABNORMAL
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic endothelial infection and inflammation drive the acute febrile syndrome.
  - target: Maculopapular Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous small-vessel inflammation produces a macular or maculopapular eruption.
  evidence:
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is now well established that a majority of sequelae associated with
      human rickettsioses are the outcome of the pathogen's affinity for
      endothelium lining the blood vessels, the consequences of which are
      vascular inflammation, insult to vascular integrity and compromised
      vascular permeability, collectively termed 'Rickettsial vasculitis'.
    explanation: >-
      Review evidence supports endothelial infection, vascular inflammation, and
      permeability loss as the shared vasculitic basis of pathogenic
      rickettsioses.

- name: Endothelial Tim-3-Mediated Rickettsial Killing
  role: host_response
  biological_scale: CELLULAR
  description: >-
    In R. heilongjiangensis infection, Tim-3 expression in endothelial cells
    promotes inducible nitric oxide synthase and nitric-oxide-dependent
    intracellular killing during early infection.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: positive regulation of nitric oxide biosynthetic process
    term:
      id: GO:0045429
      label: positive regulation of nitric oxide biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:26401029
    reference_title: >-
      Enhanced Expression of T-Cell Immunoglobulin and Mucin Domain Protein 3 in
      Endothelial Cells Facilitates Intracellular Killing of Rickettsia
      heilongjiangensis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results reveal that enhanced Tim-3 expression facilitates
      intracellular rickettsial killing in a nitric oxide-dependent manner in
      endothelial cells during the early phase of rickettsial infection.
    explanation: >-
      Human endothelial-cell and mouse perturbation experiments link Tim-3 to
      nitric-oxide-dependent control of intracellular R. heilongjiangensis.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_scale: MOLECULAR
  description: >-
    R. heilongjiangensis depends on bacterial ribosomal translation; doxycycline
    exploits this conserved bacterial vulnerability to arrest rickettsial
    protein synthesis.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the target class for
      protein-synthesis inhibitors; the FESF treatment evidence below
      establishes clinical doxycycline response.

phenotypes:

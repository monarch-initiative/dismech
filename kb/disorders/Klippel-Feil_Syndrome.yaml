    reported individual carried heterozygous alterations in both GDF3 and GDF6.
    Inhibiting the zebrafish co-orthologue of GDF3 reproduces the patient
    phenotypes.
  evidence:
  - reference: PMID:19864492
    reference_title: Mutation of the bone morphogenetic protein GDF3 causes ocular and skeletal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT

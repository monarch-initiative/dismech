genetic:
- name: MEOX1
  gene_term:
    preferred_term: MEOX1
    term:
      id: hgnc:7013
      label: MEOX1
  association: Biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  subtype: KFS2
  notes: >-
    Both reported families are consanguineous and both alleles destroy the
    transcript, one by frameshift and one by nonsense, so the recessive mechanism
    is complete loss of MEOX1 function. The locus maps to 17q21.31.
  evidence:
  - reference: PMID:23290072
    reference_title: "Mutations in MEOX1, encoding mesenchyme homeobox 1, cause Klippel-Feil anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We describe a multiplex consanguineous family in which isolated KFS maps to
      a single 17q21.31 locus that harbors a homozygous frameshift deletion in
      MEOX1; this deletion results in complete instability of the transcript.
    explanation: >-
      Establishes MEOX1 at 17q21.31 as the isolated-KFS locus and the frameshift
      allele as transcript-destroying, the loss-of-function mechanism recorded here.
  - reference: PMID:24073994
    reference_title: Mutation in MEOX1 gene causes a recessive Klippel-Feil syndrome subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Exome sequencing identified the G > A p.Q84X mutation in the MEOX1 gene,
      which is segregated based on pedigree status.
    explanation: >-
      Second consanguineous family with a segregating nonsense MEOX1 allele,
      independent confirmation of the recessive gene-disease relationship.
- name: GDF6
  gene_term:
    preferred_term: GDF6
    term:
      id: hgnc:4221
      label: GDF6
  association: Heterozygous variants and a downstream inversion breakpoint
  relationship_type: CAUSATIVE
  subtype: KFS1
  notes: >-
    Reported in both familial and sporadic Klippel-Feil syndrome, with a recurrent
    missense allele at a highly conserved residue and, separately, an inversion
    breakpoint downstream of the gene. Diagnostic yield is low: a whole-exome
    study of 37 consecutively recruited Chinese patients with Klippel-Feil
    syndrome found no pathogenic variant in GDF6, MEOX1, GDF3 or RIPPLY2 and only
    variants of uncertain significance in MYO18B.
  evidence:
  - reference: PMID:18425797
    reference_title: Mutations in GDF6 are associated with vertebral segmentation defects in Klippel-Feil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here we report mutations at the GDF6 gene locus in familial and sporadic
      cases of KFS
    explanation: >-
      Original report of GDF6 variants in familial and sporadic Klippel-Feil
      syndrome.
  - reference: PMID:32278351
    reference_title: The mutational burden and oligogenic inheritance in Klippel-Feil syndrome.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We primarily examined rare variants in five reported genes (GDF6, MEOX1,
      GDF3, MYO18B and RIPPLY2) associated with KFS and detected three variants of
      uncertain significance in MYO18B.
    explanation: >-
      A 37-patient exome cohort in which none of the four reported dominant or
      recessive KFS genes carried a pathogenic variant. It bears on diagnostic
      yield, which is the caveat in this note, and not on GDF6 causality, so it is
      graded NO_EVIDENCE for the causal claim this record makes.
- name: GDF3
  gene_term:
    preferred_term: GDF3
    term:
      id: hgnc:4218
      label: GDF3
  association: Heterozygous missense variants
  relationship_type: CAUSATIVE
  subtype: KFS3
  notes: >-
    A paralogue of GDF6 in the same BMP family. Reported variants are pleiotropic
    across ocular and skeletal phenotypes, and one reported individual carried
    heterozygous alterations in GDF3 and GDF6 together, so a multi-allelic
    contribution of BMP variants has been raised for this form.
  evidence:
  - reference: PMID:19864492
    reference_title: Mutation of the bone morphogenetic protein GDF3 causes ocular and skeletal anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Multiple mis-sense variants were identified in patients with ocular and/or
      skeletal (Klippel-Feil) anomalies including one individual with
      heterozygous alterations in GDF3 and GDF6.
    explanation: >-
      Original report of GDF3 variants in Klippel-Feil anomaly and the source of
      the co-occurring GDF6 allele noted here.
  - reference: PMID:19864492
    reference_title: Mutation of the bone morphogenetic protein GDF3 causes ocular and skeletal anomalies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      By demonstrating the pleiotropic effects of GDF3 mutation, these results
      extend the contribution of perturbed BMP signaling to human disease and
      potentially implicate multi-allelic inheritance of BMP variants in
      developmental disorders.
    explanation: >-
      The study's own concluding synthesis over its biochemical and zebrafish
      analyses, which is why no single study type is graded here; it is the source
      of the multi-allelic possibility recorded in this note.
- name: MYO18B
  gene_term:
    preferred_term: MYO18B
    term:
      id: hgnc:18150
      label: MYO18B
  association: Biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  subtype: KFS4
  notes: >-
    The one Klippel-Feil gene with a ClinGen gene-disease validity assertion:
    Definitive, autosomal recessive, curated against MONDO:0014689 by the
    Congenital Myopathies expert panel in 2025. ClinGen's summary attributes the
    disease mechanism to homozygous loss of function and notes that heterozygous
    missense variants have also been reported in Klippel-Feil syndrome. MEOX1,
    GDF6 and GDF3 have no ClinGen gene-disease validity row for Klippel-Feil
    syndrome in the committed 2026-08-13 snapshot, so their support here rests on
    primary literature.
  evidence:
  - reference: PMID:25748484
    reference_title: "A novel syndrome of Klippel-Feil anomaly, myopathy, and characteristic facies is linked to a null mutation in MYO18B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      They shared a single founder autozygous interval in which whole exome
      sequencing revealed a truncating mutation in MYO18B. There was virtually
      complete loss of the transcript in peripheral blood, indicative of
      nonsense-mediated decay.
    explanation: >-
      Original report linking a truncating MYO18B allele, subject to
      nonsense-mediated decay, to this syndrome in two consanguineous families.
  - reference: CGGV:assertion_00998e50-dd3f-4bfa-8500-34d34980d5c8-2025-04-28T160000.000Z
    reference_title: "MYO18B / Klippel-Feil anomaly-myopathy-facial dysmorphism syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYO18B | HGNC:18150 | Klippel-Feil anomaly-myopathy-facial dysmorphism syndrome | MONDO:0014689 | AR | Definitive"
    explanation: >-
      ClinGen classifies the MYO18B relationship as definitive with autosomal
      recessive inheritance.
  - reference: CGGV:assertion_00998e50-dd3f-4bfa-8500-34d34980d5c8-2025-04-28T160000.000Z
    reference_title: "MYO18B / Klippel-Feil anomaly-myopathy-facial dysmorphism syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although heterozygous MYO18B missense variants were reported in patients
      affected by Klippel-Feil syndrome (PMID: 32278351), the overall mechanism for
      disease is postulated to be homozygous loss of function
    explanation: >-
      ClinGen's statement of the disease mechanism and of the heterozygous
      missense reports, both recorded in this note.

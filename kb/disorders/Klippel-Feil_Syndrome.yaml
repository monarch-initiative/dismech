    universal and follows a slowly progressive or non-progressive course,
    affecting mainly the proximal lower-limb musculature. ClinGen's Congenital
    Myopathies expert panel reads the muscle phenotype as congenital myopathy
    rather than nemaline myopathy, with nemaline rods a secondary consequence,
    which is why this row binds a generic myopathy phenotype rather than a
    nemaline one.
  evidence:

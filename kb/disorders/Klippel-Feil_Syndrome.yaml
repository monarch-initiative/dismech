inheritance:
- name: Autosomal Recessive
  description: >-
    Autosomal recessive KFS is caused by biallelic truncating variants in MEOX1.
    Autosomal dominant forms caused by GDF6 and GDF3 variants also occur.
  evidence:
  - reference: PMID:24073994
    reference_title: Mutation in MEOX1 gene causes a recessive Klippel-Feil syndrome subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we report a truncating mutation in the MEOX1 gene in a KFS family with an autosomal recessive trait.
    explanation: >-
      Documents autosomal recessive inheritance via a truncating MEOX1 variant in
      a consanguineous KFS family.
- name: Autosomal Dominant
  description: >-
    Two autosomal dominant KFS subtypes are recognized: KFS1 (OMIM 118100),
    caused by GDF6 mutations, and KFS3 (OMIM 613702), caused by GDF3 mutations.
    The MEOX1-related form (KFS2, OMIM 214300) is the autosomal recessive
    subtype.
  evidence:
  - reference: PMID:24073994
    reference_title: Mutation in MEOX1 gene causes a recessive Klippel-Feil syndrome subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetically, KFS has two subtypes with an autosomal dominant trait: KFS1 (OMIM #118100) is caused by mutations in the GDF6 gene, while KFS3 (OMIM #613702) harbors mutations in the GDF3 gene."
    explanation: >-
      Documents the two autosomal dominant KFS subtypes and their causative
      genes (GDF6 in KFS1, GDF3 in KFS3).

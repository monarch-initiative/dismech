- name: MYO18B Loss of Function
  description: >-
    Biallelic loss-of-function MYO18B alleles are degraded by nonsense-mediated
    decay, leaving no functional myosin XVIIIB. ClinGen's expert-panel summary
    reads the disease mechanism as homozygous loss of function. The deficiency
    yields the Klippel-Feil anomaly together with a myopathy, facial dysmorphism
    and short stature, so it is the one Klippel-Feil lesion whose consequences
    reach outside the axial skeleton.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: MYO18B
    term:
      id: hgnc:18150
      label: MYO18B
  evidence:

        label: Autosomal recessive inheritance
  description: >-
    The MEOX1-related recessive form, and the mechanism this entry's pathograph is
    built on. Biallelic truncating and frameshift MEOX1 alleles destabilise the
    transcript completely, and both reported families are consanguineous.
  evidence:
  - reference: PMID:23290072
    reference_title: "Mutations in MEOX1, encoding mesenchyme homeobox 1, cause Klippel-Feil anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We describe a multiplex consanguineous family in which isolated KFS maps to
      a single 17q21.31 locus that harbors a homozygous frameshift deletion in
      MEOX1; this deletion results in complete instability of the transcript.
    explanation: >-
      Maps isolated Klippel-Feil syndrome to MEOX1 at 17q21.31 and shows the
      frameshift allele destroys the transcript.
  - reference: PMID:24073994
    reference_title: Mutation in MEOX1 gene causes a recessive Klippel-Feil syndrome subtype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Here, we report a truncating mutation in the MEOX1 gene in a KFS family with an autosomal recessive trait.
    explanation: >-
      Independent consanguineous family confirming biallelic MEOX1 truncation as a
      recessive cause, establishing this as a distinct subtype.

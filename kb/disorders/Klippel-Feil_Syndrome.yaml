        label: Autosomal dominant inheritance
  description: >-
    The GDF6-related dominant form. Reported alleles include a recurrent missense
    change at a highly conserved residue, found with mirror movements, and an
    inversion breakpoint downstream of the gene, found with carpal, tarsal and
    vertebral fusions. GDF6 is expressed at the boundaries of the developing
    vertebrae, carpals and tarsals, which is why the fusion phenotype of this form
    extends beyond the cervical spine.
  evidence:
  - reference: PMID:18425797
    reference_title: Mutations in GDF6 are associated with vertebral segmentation defects in Klippel-Feil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Here we report mutations at the GDF6 gene locus in familial and sporadic
      cases of KFS including the recurrent missense mutation of an extremely
      conserved residue c.866T>C (p.Leu289Pro) in association with mirror movements
      and an inversion breakpoint downstream of the gene in association with
      carpal, tarsal, and vertebral fusions.
    explanation: >-
      Original report of GDF6 variants in familial and sporadic Klippel-Feil
      syndrome, and the source of the recurrent missense allele, the mirror
      movements and the downstream inversion breakpoint described in this row.
  - reference: PMID:18425797
    reference_title: Mutations in GDF6 are associated with vertebral segmentation defects in Klippel-Feil syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      GDF6 is expressed at the boundaries of the developing carpals, tarsals, and
      vertebrae and within the adult vertebral disc.
    explanation: >-
      Expression at developing skeletal boundaries is why the GDF6-related form
      also produces carpal and tarsal fusions. The sentence names no organism or
      cohort, so no study type is graded.

- name: BMP Ligand Signaling Defect at Developing Vertebral Boundaries
  description: >-
    The two dominant Klippel-Feil forms act through GDF6 and GDF3 rather than
    through the MEOX1 transcription factor. GDF6 is expressed at the boundaries of
    the developing vertebrae, carpals and tarsals, and losing it in mouse and
    Xenopus reproduces fusion at those boundaries together with anterior axial
    defects, so this node is a defect of skeletal boundary patterning rather than
    of the cervical spine alone. GDF3 is a paralogue investigated for the same
    reason, and its mutation perturbs BMP signalling.
  biological_scale: MOLECULAR
  role: trigger

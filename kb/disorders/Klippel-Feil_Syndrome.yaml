  - reference: PMID:18425797
    reference_title: Mutations in GDF6 are associated with vertebral segmentation defects in Klippel-Feil syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      GDF6 knockout mice are best distinguished by fusion of carpals and tarsals
      and GDF6 knockdown in Xenopus results in a high incidence of anterior axial
      defects consistent with a role for GDF6 in the etiology, diversity, and
      variability of KFS.
    explanation: >-
      Mouse knockout and Xenopus knockdown both produce the fusion and anterior
      axial phenotypes, which is the functional support for GDF6 acting at this
      node.
  - reference: PMID:19864492
    reference_title: Mutation of the bone morphogenetic protein GDF3 causes ocular and skeletal anomalies.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-

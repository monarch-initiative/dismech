    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There was virtually complete loss of the transcript in peripheral blood,
      indicative of nonsense-mediated decay.
    explanation: >-

      snippet: >-
        A missense mutation (c.977C>T, p.L326P) located in an evolutionary
        conserved domain was perfectly associated with the OI phenotype.
      explanation: >-
        Establishes spontaneous recessive canine OI from a conserved-domain
        SERPINH1 missense variant.
- name: Serpinh1 (Hsp47) knockout mouse
  species: Mouse
  genotype: Serpinh1-/-
  publication: PMID:30541925
  description: >-
    Complete disruption of Serpinh1 in mice causes embryonic lethality due to
    defective basement membrane and collagen fibril formation.
  modeled_mechanisms:
  - target: Defective Bone Collagen Matrix, Undermineralization, and Fragility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates the essential requirement for HSP47 in vertebrate collagen
      fibril formation, though complete null mice die in mid-gestation before
      postnatal skeletal development.
    evidence:
    - reference: PMID:30541925
      reference_title: "Roles of the endoplasmic reticulum-resident, collagen-specific molecular chaperone Hsp47 in vertebrate cells and human disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Constitutive expression of Hsp47 is always correlated with expression of
        various collagen types, and disruption of the Hsp47 gene in mice causes
        embryonic lethality due to impaired basement membrane and collagen
        fibril formation.
      explanation: >-
        Confirms impaired collagen fibril formation upon Hsp47 disruption in
        mice.

- name: SERPINH1 p.Leu326Pro Dachshund osteogenesis imperfecta model
  species: Dog
  genotype: SERPINH1 c.977C>T (p.L326P) homozygous
  publication: PMID:19629171
  description: >-
    Naturally occurring autosomal recessive SERPINH1 missense mutation in
    Dachshunds causing congenital generalized osteopenia and severe bone and
    tooth fragility.
  modeled_mechanisms:

phenotypes:
- name: Recurrent Fractures
  description: >-
    Severe bone fragility with recurrent fractures, frequently congenital, the
    cardinal feature of OI type X.
  phenotype_term:
    preferred_term: Recurrent fractures
    term:
      id: HP:0002757
      label: Recurrent fractures
  evidence:
  - reference: PMID:20188343
    reference_title: "Homozygosity for a missense mutation in SERPINH1, which encodes the collagen chaperone protein HSP47, results in severe recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Osteogenesis imperfecta (OI) is characterized by bone fragility and
      fractures that may be accompanied by bone deformity, dentinogenesis
      imperfecta, short stature, and shortened life span.
    explanation: >-
      Documents bone fragility and fractures as the cardinal feature of the OI
      phenotype caused by the SERPINH1 mutation.
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified novel compound heterozygous mutations in SERPINH1 in a
      Chinese boy suffering from recurrent fractures, femoral deformities, and
      growth retardation, which resulted in extremely rare autosomal recessive OI
      type X.
    explanation: >-
      A second, independent human OI type X patient presented with recurrent
      fractures, confirming this as the cardinal feature of SERPINH1-related OI
      (patient-specific rather than a generic OI characterization).
- name: Reduced Bone Mineral Density
  description: >-
    Low bone mineral density and skeletal undermineralization reflecting the
    defective collagen matrix and impaired mineralization.
  phenotype_term:
    preferred_term: Reduced bone mineral density
    term:
      id: HP:0004349
      label: Reduced bone mineral density
  evidence:
  - reference: PMID:23508630
    reference_title: "Bone collagen: new clues to its mineralization mechanism from recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All cause fragile bone in infancy, which can include overmineralization or
      undermineralization defects as well as abnormal collagen posttranslational
      modifications.
    explanation: >-
      Documents the undermineralization/abnormal collagen matrix that underlies
      the reduced bone mineral density of SERPINH1-related recessive OI.
- name: Growth Deficiency
  description: >-
    Growth deficiency with short stature, part of the severe OI phenotype caused
    by SERPINH1 deficiency.
  phenotype_term:
    preferred_term: Growth delay
    term:
      id: HP:0001510
      label: Growth delay
  evidence:
  - reference: PMID:20188343
    reference_title: "Homozygosity for a missense mutation in SERPINH1, which encodes the collagen chaperone protein HSP47, results in severe recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Osteogenesis imperfecta (OI) is characterized by bone fragility and
      fractures that may be accompanied by bone deformity, dentinogenesis
      imperfecta, short stature, and shortened life span.
    explanation: >-
      Documents short stature (growth deficiency) as part of the OI phenotype
      caused by the SERPINH1 mutation.
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified novel compound heterozygous mutations in SERPINH1 in a
      Chinese boy suffering from recurrent fractures, femoral deformities, and
      growth retardation, which resulted in extremely rare autosomal recessive OI
      type X.
    explanation: >-
      Documents growth retardation in a second, independent human OI type X
      patient, corroborating growth deficiency as a SERPINH1-related feature.
- name: Bone Deformity
  description: >-
    Bone deformity, including bowing of the long bones, accompanies the fragility
    and recurrent fractures in OI type X, reflecting the structurally defective,
    mechanically weak bone.
  phenotype_term:
    preferred_term: Bone deformity (bowing of the long bones)
    term:
      id: HP:0006487
      label: Bowing of the long bones
  evidence:
  - reference: PMID:20188343
    reference_title: "Homozygosity for a missense mutation in SERPINH1, which encodes the collagen chaperone protein HSP47, results in severe recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Osteogenesis imperfecta (OI) is characterized by bone fragility and
      fractures that may be accompanied by bone deformity, dentinogenesis
      imperfecta, short stature, and shortened life span.
    explanation: >-
      Documents bone deformity (manifesting as long-bone bowing) as part of the
      OI phenotype caused by the SERPINH1 mutation.
- name: Vertebral Compression Fractures
  description: >-
    Vertebral compression is part of the severe skeletal fragility of OI type X.
    A second, independent SERPINH1 patient had compressed vertebral bodies that
    were reshaped by long-term bisphosphonate therapy, documenting vertebral
    compression fracture as a feature of the disorder.
  phenotype_term:
    preferred_term: Vertebral compression fracture
    term:
      id: HP:0002953
      label: Vertebral compression fracture
  evidence:
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bisphosphonates could be helpful in increasing BMD Z-score, reducing bone
      fracture risk and reshaping the compressed vertebral bodies of this
      patient.
    explanation: >-
      Documents compressed vertebral bodies (vertebral compression fracture) in
      a human OI type X patient, later reshaped under bisphosphonate therapy.
- name: Dentinogenesis Imperfecta (Variable — Absent in the Compound-Heterozygous Patient)
  description: >-
    Dental involvement is variable in OI type X rather than an obligate feature.
    Dentinogenesis imperfecta is a general OI hallmark and is described in the
    founding SERPINH1 kindred, but the second, independent human patient was
    explicitly reported to lack dentinogenesis imperfecta (and hearing loss).
    Recorded here as an explicitly documented-absent instance to flag the
    inconsistent reporting of dental involvement across the two characterized
    human cases; it is deliberately not asserted as a disease-level absent
    phenotype given the variability.
  phenotype_term:
    preferred_term: Dentinogenesis imperfecta
    modifier: ABSENT
    term:
      id: HP:0000703
      label: Dentinogenesis imperfecta
  evidence:
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient suffered from multiple fractures, low bone mass, and bone
      deformities in the femur, without dentinogenesis imperfecta or hearing
      loss.
    explanation: >-
      Documents absence of dentinogenesis imperfecta (and hearing loss) in the
      second, compound-heterozygous SERPINH1 patient, establishing dental
      involvement as variable rather than obligate in OI type X.
diagnosis:
- name: Molecular Genetic Diagnosis
  description: >-
    OI type X is suspected in an infant with severe recessive OI (recurrent
    congenital fractures, low bone mineral density, deformity) when COL1A1/COL1A2
    and the recessive 3-hydroxylation-complex genes (CRTAP, P3H1/LEPRE1, PPIB)
    are negative. Diagnosis is confirmed by identifying a biallelic SERPINH1
    (HSP47) loss-of-function variant by gene-panel or exome sequencing.
    Supportive cellular findings include proteasomal loss of HSP47 with abnormal
    Golgi accumulation of type I procollagen.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20188343
    reference_title: "Homozygosity for a missense mutation in SERPINH1, which encodes the collagen chaperone protein HSP47, results in severe recessive osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified an autosomal-recessive missense mutation (c.233T>C,
      p.Leu78Pro) in SERPINH1, which encodes the collagen chaperone-like protein
      HSP47, that leads to a severe OI phenotype.
    explanation: >-
      Molecular identification of a biallelic SERPINH1 variant establishes the
      diagnosis of OI type X.
- name: Dual X-ray Absorptiometry and Skeletal Radiography
  description: >-
    Bone mineral density testing by dual-energy X-ray absorptiometry (DXA)
    quantifies low bone mass and longitudinal BMD Z-score response to therapy,
    while skeletal radiographs detect long-bone bowing, fractures, and
    compressed vertebral bodies.
  diagnosis_term:
    preferred_term: Dual X-ray Absorptiometry
    term:
      id: NCIT:C48789
      label: Dual X-ray Absorptiometry
  evidence:
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term treatment of BPs was effective in increasing BMD Z-score,
      reducing fracture incidence and reshaping vertebrae compression.
    explanation: >-
      Documents BMD Z-score assessment and radiographic monitoring of vertebral
      compression in an OI type X patient.
treatments:
- name: Bisphosphonate Therapy
  description: >-
    Intravenous bisphosphonates (e.g., pamidronate, zoledronic acid) are the
    pharmacological mainstay of severe OI, increasing bone mineral density and
    reducing fracture frequency. They are antiresorptive and do not correct the
    underlying collagen-chaperone defect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bisphosphonate Therapy
    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
    therapeutic_agent:
    - preferred_term: bisphosphonate
      term:
        id: NCIT:C443
        label: Biphosphonate
  target_mechanisms:
  - target: Defective Bone Collagen Matrix, Undermineralization, and Fragility
    description: >-
      Antiresorptive inhibition of bone turnover increases bone mineral density,
      reshapes compressed vertebral bodies, and reduces fracture incidence
      without restoring HSP47 chaperone activity.
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bisphosphonates continue to be used most extensively in those with
      vertebral fractures, frequent long bone fractures, or more severe OI.
    explanation: >-
      GeneReviews documents bisphosphonates as the mainstay pharmacotherapy for
      severe OI, the management category that applies to OI type X.
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term treatment of BPs was effective in increasing BMD Z-score,
      reducing fracture incidence and reshaping vertebrae compression.
    explanation: >-
      Provides SERPINH1-specific longitudinal evidence that long-term
      bisphosphonate therapy raised BMD, reduced fractures, and reshaped
      compressed vertebrae in an OI type X patient.
- name: Orthopedic Surgery and Intramedullary Rodding
  description: >-
    Intramedullary (telescoping) rod fixation and corrective osteotomy stabilize
    fracture-prone, deformed long bones; spinal surgery addresses progressive
    scoliosis.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      intramedullary rodding when
      indicated to provide anatomic positioning of limbs
    explanation: >-
      GeneReviews documents intramedullary rodding as standard orthopedic
      management for OI long-bone fractures and deformity.
- name: Physical Therapy and Rehabilitation
  description: >-
    Physical and occupational therapy increase bone stability, improve mobility
    and muscle strength, and prevent contractures and deformity; early physical
    therapy follows brief post-fracture immobilization.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:20301472
    reference_title: "COL1A1- and COL1A2-Related Osteogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fractures are treated with as
      short a period of immobility as is practical, small and lightweight casts, and
      physical therapy as soon as casts are removed
    explanation: >-
      GeneReviews documents early physical therapy and brief immobilization as
      part of standard OI fracture rehabilitation.

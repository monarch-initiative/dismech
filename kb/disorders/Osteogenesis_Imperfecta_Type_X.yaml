prevalence:
- population: Published cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    OI type X is an extremely rare autosomal recessive subtype of osteogenesis
    imperfecta described in isolated families worldwide, including the founding
    consanguineous kindred (PMID:20188343) and a non-consanguineous Chinese
    patient (PMID:29520608); no population-level prevalence estimate exists.
  evidence:
  - reference: PMID:29520608
    reference_title: "Novel compound heterozygous mutations in SERPINH1 cause rare autosomal recessive osteogenesis imperfecta type X."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We reported novel compound heterozygous mutations in SERPINH1 in a Chinese
      OI patient for the first time, which expanded the spectrum of phenotype
      and genotype of extremely rare OI type X.
    explanation: >-
      Confirms that autosomal recessive SERPINH1-related OI type X is extremely
      rare and known only from isolated case reports.

    explanation: Structural modelling of the known alleles predicts loss of assembled protein or catalytic function.
  downstream:
  - target: Disrupted Mitochondrial Nucleotide Supply
    description: >-
      A-SUCL is found in a complex with mitochondrial nucleoside diphosphate kinase
      (NDPK), the last step of mitochondrial dNTP salvage; loss of the subunit is
      proposed to compromise that step. This is the discovery paper's hypothesis
      and has not been shown by direct dNTP pool measurement in patient tissue.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:15877282
      reference_title: "Deficiency of the ADP-forming succinyl-CoA synthase activity is associated with encephalomyopathy and mitochondrial DNA depletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Succinyl-CoA synthetase is invariably in a complex with mitochondrial nucleotide diphosphate kinase; hence, we propose that a defect in the last step of mitochondrial dNTP salvage is a novel cause of the mtDNA depletion syndrome."
      explanation: States the proposed link from A-SUCL loss to dNTP salvage failure.
  - target: Succinyl-CoA Accumulation
    description: The enzyme's substrate accumulates behind the block.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33230181
      reference_title: "SUCLA2 mutations cause global protein succinylation contributing to the pathomechanism of a hereditary mitochondrial disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that succinyl-CoA accumulates in cells derived from patients with recessive mutations in the tricarboxylic acid cycle (TCA) gene succinyl-CoA ligase subunit-β (SUCLA2), causing global protein hyper-succinylation."
      explanation: Succinyl-CoA accumulation measured in patient-derived cells.
  - target: Impaired Krebs Cycle Substrate-Level Phosphorylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33231368
      reference_title: "SUCLA2 Arg407Trp mutation can cause a nonprogressive movement disorder - deafness syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Its absence results in Krebs cycle failure, mitochondrial DNA depletion, and a childhood-fatal encephalomyopathy."
      explanation: States the direct Krebs cycle consequence of SUCLA2 loss.
- name: Impaired Krebs Cycle Substrate-Level Phosphorylation
  biological_scale: MOLECULAR
  description: >-
    Loss of A-SUCL removes the succinyl-CoA to succinate step with its coupled ATP
    formation. This is a direct metabolic consequence, independent of mtDNA copy
    number, and is the step that succinate supplementation was designed to bypass.
    In patient cells carrying p.Met329Val, mitochondrial ATP production was
    impaired and reactive oxygen species production enhanced.
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:24659738
    reference_title: "A novel SUCLA2 mutation in a Portuguese child associated with \"mild\" methylmalonic aciduria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cultured cells, the p.M329V resulted in a reduced amount of the SUCLA2 protein, impaired production of mitochondrial ATP, and enhanced production of reactive oxygen species"
    explanation: Reduced mitochondrial ATP production in cells carrying a patient allele.
  downstream:
  - target: Neuronal Energy Failure in the Basal Ganglia
    description: >-
      Neurons in human cortex express SUCLA2 and not the GTP-forming SUCLG2, so the
      Krebs cycle block cannot be complemented by the other isoform in neurons.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24085565
      reference_title: "Exclusive neuronal expression of SUCLA2 in the human brain."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Immunoreactivity of the GTP-forming β subunit (G-SUCL-β) encoded by SUCLG2, or in situ hybridization histochemistry for SUCLG2 mRNA could not be demonstrated in either neurons or astrocytes."
      explanation: Absence of the complementing isoform in human cortical neurons, in surgical tissue.
- name: Disrupted Mitochondrial Nucleotide Supply
  biological_scale: MOLECULAR
  description: >-
    A-SUCL physically associates with mitochondrial NDPK, which forms the
    nucleoside triphosphates used for mtDNA synthesis; SUCLA2 is described as
    stabilising NDPK. Loss of the association is the favoured explanation for mtDNA
    depletion. The evidence is indirect: NDPK activity and mtDNA content were
    normal in SUCLA2-deficient patient fibroblasts, whereas knockdown of the
    GTP-forming partner SUCLG2 in the same cells lowered both, suggesting that
    SUCLG2 complements SUCLA2 loss in cells that express it. In SUCLA2-knockdown
    mouse neurons, deregulated NDPK was among the changes accompanying mtDNA loss.
  biological_processes:
  - preferred_term: deoxyribonucleoside triphosphate biosynthetic process
    term:
      id: GO:0009202
      label: deoxyribonucleoside triphosphate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:18392745
    reference_title: "Disorders caused by deficiency of succinate-CoA ligase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The mtDNA depletion may be explained by the interaction of succinate-CoA ligase with nucleoside diphosphate kinase, which is involved in mitochondrial nucleotide metabolism."
    explanation: Review synthesis of the NDPK hypothesis.
  - reference: PMID:28769029
    reference_title: "Loss of succinyl-CoA synthase ADP-forming β subunit disrupts mtDNA stability and mitochondrial dynamics in neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our data also suggest that the deregulation of mitochondrial nucleoside diphosphate kinase (NDPK) together with defects in mitochondrial transcription factors including mitochondrial DNA pol γ and Twinkle contribute to SCS A-β deficiency-mediated mtDNA instability."
    explanation: In cultured mouse neurons with SUCLA2 knockdown, NDPK deregulation accompanies mtDNA instability.
  - reference: PMID:21295139
    reference_title: "The interplay between SUCLA2, SUCLG2, and mitochondrial DNA depletion."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We have investigated this relationship by studying SUCLA2 deficient fibroblasts derived from patients and detected normal mtDNA content and normal NDPK activity."
    explanation: >-
      In patient fibroblasts, SUCLA2 loss does not reduce NDPK activity or mtDNA,
      so the mechanism is not cell-autonomous in every cell type.
  - reference: PMID:21295139
    reference_title: "The interplay between SUCLA2, SUCLG2, and mitochondrial DNA depletion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, knockdown of SUCLG2 by shRNA in both patient and control fibroblasts resulted in a significant decrease in mtDNA amount, decreased NDPK and cytochrome c oxidase activities, and a marked growth impairment."
    explanation: Removing the complementing SUCLG2 isoform unmasks NDPK and mtDNA loss, consistent with isoform complementation explaining tissue specificity.
  downstream:
  - target: Neuronal and Muscle mtDNA Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

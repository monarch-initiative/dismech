      explanation: Structural prediction for the milder allele.
progression:
- phase: Infantile onset
  notes: >-
    Median onset at two months (at birth for SUCLG1). Hypotonia, developmental
    delay and feeding difficulty come first; dystonia and hearing loss become
    evident and progress over infancy and early childhood.
  evidence:
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median onset of symptoms was two months for patients with SUCLA2 mutations and at birth for SUCLG1 patients."
    explanation: Age of onset.
- phase: Survival
  notes: >-
    Median survival about 20 years, far longer than SUCLG1 deficiency (20
    months); about 30% die in childhood; about 12% reported to reach 20 years or
    older. Missense alleles showed a trend toward longer survival than
    loss-of-function alleles.
  evidence:
  - reference: PMID:20301762
    reference_title: "SUCLA2-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median survival is age 20 years; approximately 30% of affected individuals succumb during childhood."
    explanation: GeneReviews survival figures.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median survival was 20 years for SUCLA2 and 20 months for SUCLG1."
    explanation: Survival by gene.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long survival, to age 20 years or older, was reported in 12% of SUCLA2 and in 10% of SUCLG1 patients."
    explanation: Proportion reaching adulthood.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most important findings were a significantly longer survival in patients with SUCLA2 mutations compared to SUCLG1 mutations and a trend towards longer survival in patients with missense mutations compared to loss-of-function mutations."
    explanation: Genotype and survival.
diagnosis:
- name: SUCLA2 molecular testing
  description: >-
    Biallelic SUCLA2 pathogenic variants establish the diagnosis. Sequencing is
    preferred to muscle biopsy once the metabolite pattern is recognised. Whole-gene
    and intragenic deletions are reported, so deletion analysis is needed when
    sequencing finds one or no variant.
  evidence:
  - reference: PMID:20301762
    reference_title: "SUCLA2-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SUCLA2-related mtDNA depletion syndrome is established in a proband with suggestive findings and biallelic pathogenic variants in SUCLA2 identified by molecular genetic testing."
    explanation: Diagnostic criterion.
  - reference: PMID:19666145
    reference_title: "Dystonia and deafness due to SUCLA2 defect; Clinical course and biochemical markers in 16 children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct SUCLA2 sequence analysis is suggested instead of an invasive muscle biopsy to obtain the diagnosis."
    explanation: Sequencing before biopsy.
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation analysis revealed a number of novel mutations, including a homozygous deletion of the entire SUCLA2 gene, and we found evidence of two founder mutations in the Scandinavian population, in addition to the known SUCLA2 founder mutation in the Faroe Islands."
    explanation: Whole-gene deletions and additional Scandinavian founder alleles.
- name: Metabolite screen
  description: >-
    Plasma and urine methylmalonic acid, blood acylcarnitines (C4-dicarboxylic
    carnitine), urine organic acids and lactate. The combination is characteristic
    even when lactate is only intermittently raised.
  evidence:
  - reference: PMID:19666145
    reference_title: "Dystonia and deafness due to SUCLA2 defect; Clinical course and biochemical markers in 16 children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive hearing loss, in combination with a characteristic metabolite profile (increased lactate, methylmalonic acid, C4-dicarboxylic carnitine, 3-hydroxyisovaleric acid) should lead the clinician to the correct diagnosis even in patients with only intermittent lactic acidemia."
    explanation: Diagnostic metabolite profile.
- name: Surveillance
  description: >-
    GeneReviews recommends routine monitoring of development, growth and hearing,
    periodic ophthalmologic evaluation, and skeletal evaluation for kyphoscoliosis
    and joint contractures. Intervals are expert recommendation.
  evidence:
  - reference: PMID:20301762
    reference_title: "SUCLA2-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Routine monitoring of development, growth, and hearing; periodic ophthalmologic evaluations; routine skeletal evaluations for kyphoscoliosis and joint contractures."
    explanation: GeneReviews surveillance recommendations.
differential_diagnoses:
- name: SUCLG1-related mitochondrial DNA depletion syndrome
  disease_term:
    preferred_term: mitochondrial DNA depletion syndrome 9
    term:
      id: MONDO:0009504
      label: mitochondrial DNA depletion syndrome 9
  description: >-
    Deficiency of the alpha subunit shared by both isoforms of the enzyme. Same
    methylmalonic aciduria, lactic acidosis and mtDNA depletion, but earlier onset
    (at birth), median survival 20 months, and hepatopathy and hypertrophic
    cardiomyopathy that are not reported with SUCLA2. Separated by gene testing.
  distinguishing_features:
  - Hepatopathy in 38% of SUCLG1 patients and none with SUCLA2.
  - Hypertrophic cardiomyopathy in 14% of SUCLG1 patients and none with SUCLA2.
  - Median survival 20 months versus 20 years.
  evidence:
  - reference: PMID:26475597
    reference_title: "Succinate-CoA ligase deficiency due to mutations in SUCLA2 and SUCLG1: phenotype and genotype correlations in 71 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notable clinical differences between the two groups were hepatopathy, found in 38% of SUCLG1 cases but not in SUCLA2 cases, and hypertrophic cardiomyopathy which was not reported in SUCLA2 patients, but documented in 14% of cases with SUCLG1 mutations."
    explanation: Direct comparison in the same review.
  - reference: PMID:28358460
    reference_title: "SUCLG1-Related Mitochondrial DNA Depletion Syndrome, Encephalomyopathic Form with Methylmalonic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Life span is shortened, with median survival of 20 months."
    explanation: GeneReviews survival for the SUCLG1 disorder.
- name: Methylmalonic acidemia (isolated)
  disease_term:
    preferred_term: methylmalonic acidemia
    term:
      id: MONDO:0002012
      label: methylmalonic acidemia
  description: >-
    The mild methylmalonic aciduria of SUCLA2 deficiency can be mistaken for an
    isolated methylmalonic acidemia; SUCLA2 deficiency was found among patients
    referred with mild, unexplained methylmalonic aciduria, and the accompanying
    deafness, dystonia and basal ganglia lesions point to it.
  evidence:
  - reference: PMID:17301081
    reference_title: "SUCLA2 mutations are associated with mild methylmalonic aciduria, Leigh-like encephalomyopathy, dystonia and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have studied 14 patients with mild 'unlabelled' methylmalonic aciduria (MMA) from 11 families."
    explanation: SUCLA2 deficiency was identified among patients with mild unexplained methylmalonic aciduria.

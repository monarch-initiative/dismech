discussions:
- discussion_id: sucla2-hearing-loss-lesion
  kind: KNOWLEDGE_GAP
  prompt: Where in the auditory pathway does SUCLA2 deficiency cause hearing loss?
  attaches_to:
  - phenotypes#Progressive sensorineural hearing impairment
  rationale: >-
    Hearing loss is a defining feature, yet none of the cited clinical, cellular or
    animal studies localises the lesion to hair cells, spiral ganglion or central
    auditory pathways, and no cited model reproduces the hearing loss; the causal
    edge from the respiratory chain defect is therefore left as UNKNOWN.
- discussion_id: sucla2-mtdna-depletion-necessity
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the disease is due to mtDNA depletion, and how much to the Krebs
    cycle block and succinyl-CoA excess directly?
  attaches_to:
  - pathophysiology#Neuronal and Muscle mtDNA Depletion
  - pathophysiology#Protein Hypersuccinylation
  rationale: >-
    Typical disease occurs without muscle mtDNA depletion in some patients, patient
    fibroblasts are not depleted, and hypersuccinylation reduces complex I activity
    in mouse brain. The relative weight of these branches in patient brain is not
    established.

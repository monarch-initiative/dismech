      reference_title: "SUCLA2 / mitochondrial disease (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "one splice site, c.534+1G>A, that is a founder variant in Faroe Islands, Denmark"
      explanation: ClinGen names the founder allele in HGVS form.
  - name: p.Arg407Trp
    description: >-
      Missense allele in the ligase domain associated with a milder course,
      including a non-progressive movement disorder with deafness into adulthood.
    evidence:
    - reference: PMID:33231368
      reference_title: "SUCLA2 Arg407Trp mutation can cause a nonprogressive movement disorder - deafness syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We describe a purely neurologic allelic form of the disease consisting of deafness, putamenal hyperintensity on MRI and a myoclonic-dystonic movement disorder unchanging from childhood into, so far, the late fourth decade."
      explanation: Milder allelic phenotype.
  - name: p.Asp333Gly

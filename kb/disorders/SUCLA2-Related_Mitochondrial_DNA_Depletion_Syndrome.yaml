      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Disruption of SCS-A could thereby lead to impaired mtDNA synthesis and thus mtDNA depletion"
      explanation: Introduction of a case report restating the NDPK-to-mtDNA link as a hypothesis.
- name: Neuronal and Muscle mtDNA Depletion
  biological_scale: CELLULAR
  description: >-
    Reduced mtDNA copy number in skeletal muscle (and, in the mouse model, brain),
    with normal copy number in fibroblasts and in liver, where SUCLA2 is not the
    dominant isoform. In the discovery family muscle mtDNA was 32% of control and
    fibroblast mtDNA 95%. Depletion is not obligatory: siblings with normal muscle
    mtDNA and a family with a slowly progressive course without depletion have been
    reported, so the respiratory chain defect can arise without measurable
    depletion. The GTP-forming SUCLG2 isoform, expressed in liver and anabolic
    tissues, is thought to protect tissues that express it.

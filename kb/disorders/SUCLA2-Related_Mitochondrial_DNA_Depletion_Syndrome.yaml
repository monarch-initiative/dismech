- name: Deoxycytidine and Deoxythymidine
  description: >-
    Oral pyrimidine deoxynucleosides, investigational. In an interim analysis of a
    phase 2 open-label trial (NCT04802707) in eight children with FBXL4, SUCLG1,
    SUCLA2 or RRM2B variants, Newcastle Mitochondrial Disease Scale scores improved
    at group level and raised GDF15 improved in four of five. SUCLA2-specific
    results are not reported separately, the study is uncontrolled, and the
    mechanistic rationale for bypassing an NDPK-associated defect with nucleosides
    has not been tested for SUCLA2 specifically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxycytidine

pathophysiology:
- name: SUCLA2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SUCLA2 variants remove or inactivate the beta subunit of the
    ADP-forming succinyl-CoA synthetase (A-SUCL). Splice, nonsense, frameshift,
    whole-gene and intragenic deletions and missense alleles are reported. Missense
    alleles such as p.Arg407Trp and p.Asp333Gly are associated with milder or
    slowly progressive disease.

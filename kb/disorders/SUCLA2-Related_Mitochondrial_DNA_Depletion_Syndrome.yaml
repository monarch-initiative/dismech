name: SUCLA2-Related Mitochondrial DNA Depletion Syndrome
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
  term:
    id: MONDO:0012791
    label: mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
synonyms:
- MTDPS5
- mitochondrial DNA depletion syndrome 5
- mitochondrial DNA depletion syndrome 5 (encephalomyopathic with or without methylmalonic aciduria)
- SUCLA2 deficiency
- succinyl-CoA ligase (ADP-forming) deficiency
- SUCLA2-related mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
- mitochondrial DNA depletion syndrome, encephalomyopathic form with methylmalonic aciduria
description: >-
  Autosomal recessive mitochondrial encephalomyopathy caused by biallelic SUCLA2
  variants. SUCLA2 encodes the beta subunit of the ADP-forming (ATP-producing)
  isoform of succinyl-CoA synthetase (succinate-CoA ligase), the Krebs cycle enzyme
  that converts succinyl-CoA to succinate. Onset is in infancy (median two months)
  with hypotonia, developmental delay, muscle atrophy, feeding difficulty and growth
  failure, followed by a progressive hyperkinetic-dystonic movement disorder and
  progressive sensorineural hearing loss; brain MRI typically shows Leigh-like
  involvement of the putamen and caudate. The biochemical signature is a mild
  methylmalonic aciduria with raised C4-dicarboxylic carnitine and variable lactic
  acidosis. Muscle shows mtDNA depletion with a combined deficiency of the
  respiratory chain complexes that contain mtDNA-encoded subunits, although
  depletion is not found in every patient. Unlike the SUCLG1 (alpha subunit)
  disorder, liver disease and hypertrophic cardiomyopathy are not features, and
  survival is much longer (median about 20 years), although about 30% of affected
  children die in childhood. A founder splice variant makes the disorder unusually
  frequent in the Faroe Islands.
parents:
- mitochondrial DNA depletion syndrome, encephalomyopathic form
- disorder of the tricarboxylic acid cycle
- mitochondrial DNA maintenance defect
notes: >-
  Lump/split: this entry is the SUCLA2 disorder only (MONDO:0012791, OMIM 612073,
  ORPHA:1933, all exact cross-references of one another). The SUCLG1 disorder
  (alpha subunit of the same enzyme; mitochondrial DNA depletion syndrome 9,
  MONDO:0009504, OMIM 245400, ORPHA:17) shares the methylmalonic aciduria and mtDNA
  depletion but is a separate MONDO, OMIM and Orphanet entity with its own
  GeneReviews chapter, earlier onset, much shorter survival, and hepatopathy and
  hypertrophic cardiomyopathy that are not reported with SUCLA2; it is treated here
  as a differential diagnosis, not a subtype. The MONDO parent MONDO:0016796
  (mitochondrial DNA depletion syndrome, encephalomyopathic form) is a
  multi-gene grouping (SUCLA2, SUCLG1, RRM2B and others) and is not this entry.
  ClinGen has curated SUCLA2 twice, both Definitive: against Leigh syndrome
  spectrum (2019) and, superseding it under the ClinGen lumping framework, against
  "SUCLA2-related primary mitochondrial disease" (MONDO:0044970, 2024), which it
  states is the same single disease entity as OMIM 612073. The MONDO text
  definition of MONDO:0012791 (imported from an older Orphanet definition)
  describes a maternally transmitted encephalomyopathy-aminoacidopathy in two
  brothers; that text does not match the SUCLA2 disease that MONDO's causal-gene
  axiom (SUCLA2) and the current Orphanet definition describe, and the entry follows
  the gene axiom and the current Orphanet definition.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Encephalomyopathy with a progressive dystonic movement disorder dominates
      the course.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Inborn error of the Krebs cycle with a methylmalonic aciduria.
  icimd_category:
  - classification_value: nucleotide_pool_maintenance
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nucleotide pool
      maintenance" under "Mitochondrial DNA maintenance and replication". The
      mtDNA depletion is attributed to a failure of mitochondrial nucleotide
      supply through the SUCLA2-NDPK association.
  - classification_value: krebs_cycle
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Krebs cycle". SUCLA2 is a
      subunit of a Krebs cycle enzyme, so the disorder genuinely spans both groups.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:15877282
      reference_title: "Deficiency of the ADP-forming succinyl-CoA synthase activity is associated with encephalomyopathy and mitochondrial DNA depletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Markedly decreased succinyl-CoA synthetase activity due to a deleterious mutation in SUCLA2, the gene encoding the beta subunit of the ADP-forming succinyl-CoA synthetase ligase, was found in muscle mitochondria of patients with encephalomyopathy and mtDNA depletion."
      explanation: A nuclear-gene defect of a mitochondrial matrix enzyme causing mtDNA depletion places this among the primary mitochondrial diseases.

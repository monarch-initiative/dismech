genetic:
- name: SUCLA2
  gene_term:
    preferred_term: SUCLA2
    term:
      id: hgnc:11448
      label: SUCLA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ClinGen Definitive (2024) for "SUCLA2-related primary mitochondrial disease",
    which ClinGen equates with OMIM 612073. A contiguous 13q14 deletion that
    removes SUCLA2 has been found in trans with a SUCLA2 point variant in a child
    with both this disorder and bilateral retinoblastoma, because the deletion also
    removes RB1. It follows (an inference, not a published recommendation) that a
    child whose SUCLA2 deletion allele extends to RB1 carries a germline RB1
    deletion and falls under retinoblastoma surveillance; conversely the authors
    suggest SUCLA2 testing when a child with retinoblastoma has an encephalomyopathy.
  evidence:
  - reference: CGGV:assertion_cec21e34-6f67-4733-bf7e-f0d1b1632cf1-2024-06-17T040000.000Z
    reference_title: "SUCLA2 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SUCLA2 | HGNC:11448 | mitochondrial disease | MONDO:0044970 | AR | Definitive"
    explanation: ClinGen gene-disease validity row.
  - reference: CGGV:assertion_cec21e34-6f67-4733-bf7e-f0d1b1632cf1-2024-06-17T040000.000Z
    reference_title: "SUCLA2 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SUCLA2 has been associated with one disease entity to date; mitochondrial DNA depletion syndrome 5 (encephalomyopathic with or without methylmalonic aciduria) [OMIM# 612073]."
    explanation: ClinGen treats OMIM 612073 as the single SUCLA2 disease entity.
  - reference: PMID:24986829
    reference_title: "Mitochondrial encephalomyopathy and retinoblastoma explained by compound heterozygosity of SUCLA2 point mutation and 13q14 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion spanned both SUCLA2 and RB1 gene regions, leading to manifestation of both mitochondrial disease and retinoblastoma."
    explanation: Contiguous 13q14 deletion producing both diseases.
  - reference: PMID:24986829
    reference_title: "Mitochondrial encephalomyopathy and retinoblastoma explained by compound heterozygosity of SUCLA2 point mutation and 13q14 deletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, an encephalomyopathy in a patient with retinoblastoma suggests mutations affecting SUCLA2."
    explanation: The authors' diagnostic suggestion.
  variants:
  - name: c.534+1G>A (Faroese founder)
    description: >-
      Splice-donor variant (reported as IVS4+1G>A) causing exon 4 skipping; founder
      allele in the Faroe Islands.
    evidence:
    - reference: PMID:17287286
      reference_title: "Mitochondrial encephalomyopathy with elevated methylmalonic acid is caused by SUCLA2 mutations."
      supports: SUPPORT

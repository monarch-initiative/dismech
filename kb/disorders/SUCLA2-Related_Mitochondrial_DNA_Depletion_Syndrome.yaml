- name: Succinyl-CoA Accumulation
  biological_scale: MOLECULAR
  description: >-
    Succinyl-CoA builds up behind the block. Two consequences follow: backflow
    through the propionate pathway, and non-enzymatic succinylation of lysine
    residues across the proteome.
  biological_processes:
  - preferred_term: succinyl-CoA metabolic process
    term:
      id: GO:0006104
      label: succinyl-CoA metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:33230181
    reference_title: "SUCLA2 mutations cause global protein succinylation contributing to the pathomechanism of a hereditary mitochondrial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that succinyl-CoA accumulates in cells derived from patients with recessive mutations in the tricarboxylic acid cycle (TCA) gene succinyl-CoA ligase subunit-β (SUCLA2), causing global protein hyper-succinylation."
    explanation: Measured in patient fibroblasts and myotubes.
  downstream:
  - target: Secondary Methylmalonyl-CoA Accumulation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17287286
      reference_title: "Mitochondrial encephalomyopathy with elevated methylmalonic acid is caused by SUCLA2 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The hallmark of the condition, elevated methylmalonic acid, can be explained by an accumulation of the substrate of the enzyme, succinyl-CoA, which in turn leads to elevated methylmalonic acid, because the conversion of methylmalonyl-CoA to succinyl-CoA is inhibited."
      explanation: States the mechanism of the methylmalonic aciduria.
  - target: Protein Hypersuccinylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37819759
      reference_title: "Loss of succinyl-CoA synthetase in mouse forebrain results in hypersuccinylation with perturbed neuronal transcription and metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Results demonstrate that accumulation of succinyl-CoA in the absence of SCS leads to hypersuccinylation within the murine cerebral cortex."
      explanation: Forebrain Sucla2 knockout shows the step in vivo.
- name: Secondary Methylmalonyl-CoA Accumulation
  biological_scale: MOLECULAR
  description: >-
    Succinyl-CoA excess inhibits methylmalonyl-CoA conversion, so methylmalonic acid
    and C4-dicarboxylic (methylmalonyl- and succinyl-) carnitine rise in body fluids.
    The elevation is mild compared with classical methylmalonic acidemia and may be
    marginal or absent in urine; plasma methylmalonic acid is more consistently
    raised. Methylcitrate is also raised.
  biological_processes:
  - preferred_term: propionate catabolic process
    term:
      id: GO:0019543
      label: propionate catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:17301081
    reference_title: "SUCLA2 mutations are associated with mild methylmalonic aciduria, Leigh-like encephalomyopathy, dystonia and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in SUCLA2 can be found at the metabolite level and are defined by mildly elevated methylmalonic acid and C4-dicarboxylic carnitine concentrations in body fluids in association with variable lactic acidosis."
    explanation: Defines the metabolite signature.
  - reference: PMID:24271779
    reference_title: "Screen for abnormal mitochondrial phenotypes in mouse embryonic stem cells identifies a model for succinyl-CoA ligase deficiency and mtDNA depletion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Elevated levels of MMA were observed in embryonic brain."
    explanation: The mouse model reproduces the methylmalonic acid elevation in brain.
  downstream:
  - target: Methylmalonic aciduria
    causal_link_type: DIRECT
- name: Protein Hypersuccinylation
  biological_scale: CELLULAR
  description: >-
    Excess succinyl-CoA succinylates lysines on nearly a thousand sites in patient
    cells, many of them targets of the NAD+-dependent desuccinylase SIRT5. In the
    forebrain knockout mouse, hypersuccinylation is associated with reduced complex I
    activity and altered chromatin and neuronal gene expression; in sucla2 mutant
    zebrafish it consumes NAD+ and propagates respiratory defects. This is an
    emerging mechanism, established in patient cells and animal models but not yet
    in patient tissue.
  biological_processes:
  - preferred_term: protein succinylation
    term:
      id: GO:0018335
      label: protein succinylation
    modifier: INCREASED
  evidence:
  - reference: PMID:33230181
    reference_title: "SUCLA2 mutations cause global protein succinylation contributing to the pathomechanism of a hereditary mitochondrial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using mass spectrometry, we quantify nearly 1,000 protein succinylation sites on 366 proteins from patient-derived fibroblasts and myotubes."
    explanation: Proteome-wide hypersuccinylation in patient cells.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37819759
      reference_title: "Loss of succinyl-CoA synthetase in mouse forebrain results in hypersuccinylation with perturbed neuronal transcription and metabolism."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Specifically, increased succinylation is associated with functionally significant reduced activity of respiratory chain complex I and widescale alterations in chromatin landscape and gene expression."
      explanation: In vivo association of hypersuccinylation with complex I deficiency.
    - reference: PMID:41574612
      reference_title: "NAD+ and Sirt5 restore mitochondrial bioenergetics failure and improve locomotor defects caused by sucla2 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we demonstrate that bulk succinylation from succinyl-CoA excess consumes the enzymatic cofactor NAD+ and propagates mitochondrial respiratory defects in a zebrafish model of succinyl-CoA ligase deficiency, a childhood-onset encephalomyopathy."
      explanation: Zebrafish evidence that hypersuccinylation worsens respiratory function via NAD+ depletion.

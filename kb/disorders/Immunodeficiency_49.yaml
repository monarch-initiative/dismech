    evidence_source: HUMAN_CLINICAL
    snippet: "Unsupervised analysis of 102 T lymphocyte subpopulations showed that the patients clearly cluster apart from healthy children, further supporting the common aetiology of the disorder."
    explanation: Patient T-cell compartments are systematically abnormal despite no overt immunodeficiency.
  - reference: PMID:37860968

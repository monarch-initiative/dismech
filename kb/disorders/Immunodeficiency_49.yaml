        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The infant had \"leaky\" SCID (i.e., a form of SCID in which a minimal degree of immune function is preserved)"
        explanation: >
          IMD49 is classified as a combined immunodeficiency (severe combined
          immunodeficiency, "leaky" subtype) in the IUIS framework.

inheritance:
  - name: Autosomal dominant (de novo)
    description: >
      IMD49 arises from a heterozygous de novo missense variant in BCL11B;
      the founding patient's variant was confirmed absent from both parents'
      DNA, establishing autosomal dominant inheritance via a de novo dominant
      negative allele rather than classic X-linked or autosomal recessive
      SCID inheritance. Transmission from an affected parent is documented
      in the broader BCL11B-related disease spectrum — but, in the reported
      instances, for gene-disruptive (frameshift) alleles of the milder
      IDDSFTA class, not for the specificity-residue missense alleles that
      cause IMD49. All reported IMD49-class variants to date are de novo,
      so recurrence risk counselling should distinguish the two arms.
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The patient’s BCL11B variant was confirmed by Sanger sequencing of DNA from blood and buccal brushings and was found to be a de novo mutation (it was not present in the DNA of either parent)."
        explanation: Establishes the de novo, autosomal dominant origin of the causative BCL11B variant.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "SCID is recognized as being inherited in either an X-linked or an autosomal recessive form, rather than as a de novo autosomal dominant form, as seen in this case."
        explanation: Explicitly contrasts IMD49's de novo autosomal dominant inheritance with classic SCID inheritance patterns.
      - reference: PMID:29985992
        reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: "A further frameshift mutation was transmitted from a similarly affected mother."
        explanation: >
          Documents that vertical transmission occurs in the broader
          BCL11B-related disease spectrum, but for a gene-disruptive
          frameshift allele (IDDSFTA class) rather than an IMD49-class
          specificity-residue missense allele — hence PARTIAL.

prevalence:
  - population: Worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >
      Ultra-rare. The founding case was a single male infant identified by
      newborn TREC screening (Punwani et al. 2016). A second individual
      harboring the identical de novo p.Asn441Lys variant, with a somewhat
      milder immunodeficiency course, was subsequently reported (Alfei et al.
      2022). A 2025 systematic review pooling all published BCL11B-variant
      individuals identified a total cohort of 51 individuals across the
      full BCL11B-related disease spectrum (IMD49/SCID, IDDSFTA, and the
      atopic/immune-dysregulation phenotype combined); overt immunodeficiency
      (SCID or idiopathic CD4 lymphocytopenia) within that spectrum was
      observed exclusively among individuals harboring a missense variant
      affecting one of four DNA-binding "specificity residues" (p.Asn441Lys,
      p.Lys469Asn, p.Asn810His, p.Lys838Thr). No population
      prevalence/incidence estimate has been established.
    evidence:
      - reference: PMID:40033098
        reference_title: "BCL11B-related disease: a single phenotypic entity?"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "cohort was 51\nindividuals (48 case reports from 20 papers and 3 individuals from\nour case series)"
        explanation: >
          Establishes the total pooled literature cohort size (51 individuals)
          across the BCL11B-related disease spectrum to which IMD49 belongs.
      - reference: PMID:39798569
        reference_title: "DNA-binding affinity and specificity determine the phenotypic diversity in BCL11B-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "an individual harboring\np.Asn441Lys identical to the initially described BCL11B"
        explanation: >
          Documents a second individual with the identical founding IMD49
          variant, establishing the ultra-rare, cases-in-literature occurrence.
      - reference: PMID:39798569
        reference_title: "DNA-binding affinity and specificity determine the phenotypic diversity in BCL11B-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "we suggest that the phenotypic severity and variability is largely dependent on the DNA-binding affinity and specificity of altered BCL11B proteins"
        explanation: >
          Establishes that clinical severity across BCL11B-variant
          individuals, including the overt immunodeficiency of the class to
          which the IMD49 founding variant belongs, is dependent on the
          DNA-binding affinity/specificity impact of the specific variant.

genetic:
  - name: BCL11B
    gene_term:
      preferred_term: BCL11B
      term:
        id: hgnc:13222
        label: BCL11B
    relationship_type: CAUSATIVE
    notes: >
      A heterozygous de novo missense variant, c.1323T>G (p.Asn441Lys;
      N441K; NM_138576.3), located in the DNA-contacting alpha helix of
      BCL11B zinc-finger 2 at a DNA-binding "specificity residue," causes
      IMD49. The variant is dominant negative: it forms heterodimers with
      wild-type BCL11B that fail to bind canonical target DNA sites, while
      also redirecting binding to a novel noncanonical site (in TACC1) not
      recognized by wild-type BCL11B. A subsequent genotype-phenotype study
      of the BCL11B-related disorder spectrum found that overt
      immunodeficiency (SCID or idiopathic CD4 lymphocytopenia) is observed
      exclusively among individuals harboring missense variants at one of
      four DNA-binding "specificity residues" (p.Asn441Lys, p.Lys469Asn,
      p.Asn810His, p.Lys838Thr), distinguishing this severe subtype from the
      milder neurodevelopmental phenotype (IDDSFTA) caused by likely
      gene-disruptive or other zinc-finger BCL11B variants.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Exome sequencing revealed a heterozygous de novo missense mutation, p.N441K, in BCL11B. The resulting BCL11B protein had dominant negative activity, which abrogated the ability of wild-type BCL11B to bind DNA, thereby arresting development of the T-cell lineage and disrupting hematopoietic stem-cell migration"
        explanation: >
          Establishes the causative de novo BCL11B p.N441K variant and its
          dominant negative mechanism.
      - reference: PMID:39798569
        reference_title: "DNA-binding affinity and specificity determine the phenotypic diversity in BCL11B-related disorders."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "missense variants affecting C2H2-ZnFs, DNA binding, and \"specificity residues\" impair BCL11B transcriptional activity in a target-specific, dominant-negative manner along with aberrant regulation of alternative DNA targets, resulting in more severe and unpredictable clinical outcomes"
        explanation: >
          Places the IMD49 founding variant within the "specificity residue"
          mechanistic class. The transcriptional-impairment and
          dominant-negative claims quoted here derive from the study's
          dual-luciferase reporter assays; the coupling to clinical severity
          comes from its companion cohort analysis, cited separately under
          prevalence.

pathophysiology:
  - name: BCL11B Zinc-Finger Specificity-Residue Mutation
    biological_scale: MOLECULAR
    description: >
      The de novo p.Asn441Lys substitution alters a DNA-binding "specificity
      residue" within the DNA-contacting alpha helix of BCL11B zinc-finger 2.
      Chromatin immunoprecipitation shows that stimulation-induced binding of
      wild-type BCL11B to the consensus site in the IL2 promoter is markedly
      increased, but binding by the N441K mutant is not; the mutant retains
      the ability to associate with the p300 cofactor.
    molecular_functions:
      - preferred_term: DNA-binding transcription factor activity
        term:
          id: GO:0003700
          label: DNA-binding transcription factor activity
        modifier: ABNORMAL
    downstream:
      - target: Dominant-Negative Heterodimerization and Aberrant DNA Binding
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: "This site, located in a region of BCL11B that encodes the DNA-binding zinc-finger domain of BCL11B (Figs. S2 and S3 in the Supplementary Appendix), is conserved in mammals, zebrafish (bcl11ba), drosophila (DmeI), and yeast (AZF1)."
        explanation: Localizes the N441K variant to the conserved DNA-binding zinc-finger domain.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "stimulation of Jurkat cells with phorbol myristate acetate and ionomycin markedly increased the binding of wild-type BCL11B but not of p.N441K BCL11B"
        explanation: Chromatin immunoprecipitation shows loss of stimulation-induced canonical DNA binding by the mutant protein.

  - name: Dominant-Negative Heterodimerization and Aberrant DNA Binding
    biological_scale: MOLECULAR
    description: >
      Mitogenic stimulation induces formation of wild-type-mutant BCL11B
      heterodimers, which are unable to bind canonical promoter targets in
      DNA, giving the N441K allele dominant negative activity over the
      remaining wild-type allele. Genome-wide ChIP-seq shows reduced N441K
      binding to canonical BCL11B target sites in the BCL11B locus itself,
      together with acquisition of a novel, noncanonical binding site in
      exon 1 of TACC1 that is not recognized by wild-type BCL11B, indicating
      the mutation both blocks canonical binding and redirects binding to
      new sites. A later refinement of this model shows the interference is
      not confined to wild-type BCL11B homodimers: the mutant protein also
      heterodimerizes with the paralogous factor BCL11A and interferes with
      BCL11A function, and dampens the BCL11B-TCF1 interaction in
      thymocytes, weakening antagonism of TCF1-driven innate-lymphoid
      differentiation. The corresponding knock-in mouse therefore phenocopies
      loss of Bcl11a rather than simple loss of Bcl11b.
    downstream:
      - target: Arrested T-Cell Lineage Commitment
      - target: Disrupted Hematopoietic Progenitor Migration
      - target: Multisystem Developmental Anomalies
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "heterodimers, which suggested that the p.N441K BCL11B in the patient caused the disease by heterodimerization with wild-type BCL11B, producing complexes that were unable to bind to promoter targets in DNA."
        explanation: Documents the dominant-negative heterodimerization mechanism.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the p.N441K substitution also induced BCL11B binding to a unique site in exon 1 of the TACC1"
        explanation: Documents acquisition of a novel noncanonical DNA-binding site by the mutant protein.
      - reference: PMID:39798569
        reference_title: "DNA-binding affinity and specificity determine the phenotypic diversity in BCL11B-related disorders."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "p.Lys469Asn and\np.Lys838Thr inhibited WT activation for all three targets,\nalbeit to a different degree."
        explanation: >
          Independent dual-luciferase reporter assays confirm that
          "specificity residue" BCL11B missense variants (the class of the
          IMD49 founding variant) exert target-dependent dominant-negative
          effects on wild-type BCL11B transcriptional activity.
      - reference: PMID:39487351
        reference_title: "A mutant BCL11B-N440K protein interferes with BCL11A function during T lymphocyte and neuronal development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Thus, the mutant BCL11B-N440K protein interferes with BCL11A function upon heterodimerization."
        explanation: >
          Establishes that the dominant-negative interference extends to the
          paralogous factor BCL11A via heterodimerization, refining the
          original wild-type-BCL11B-only model.
      - reference: PMID:39487351
        reference_title: "A mutant BCL11B-N440K protein interferes with BCL11A function during T lymphocyte and neuronal development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the Bcl11bN440K mutation dampens the interaction of BCL11B with T cell factor 1 (TCF1) in thymocytes, resulting in weakened antagonism against TCF1 activity that supports the differentiation of NK/ILC1-like cells"
        explanation: >
          Provides the molecular route by which the mutant allele
          deregulates lineage choice in thymocytes.

  - name: Arrested T-Cell Lineage Commitment
    biological_scale: CELLULAR
    description: >
      BCL11B is induced by Notch signaling as hematopoietic stem cells
      commit to the T lineage and is required for human T-cell progenitor
      development in vitro; knockdown of BCL11B impairs T-cell but not
      B-cell development from human hematopoietic stem cells, and ectopic
      expression of the patient's N441K mutant construct likewise abrogates
      T-cell development, consistent with a dominant negative effect. In
      zebrafish, knockdown of the BCL11B orthologue bcl11ba, and separately
      ectopic expression of human N441K BCL11B, both block development of
      lck-marked T-cell progenitors; re-expression of wild-type human BCL11B
      rescues bcl11ba-knockdown embryos, but N441K BCL11B does not.
    cell_types:
      - preferred_term: T cell
        term:
          id: CL:0000084
          label: T cell
      - preferred_term: hematopoietic stem cell
        term:
          id: CL:0000037
          label: hematopoietic stem cell
    biological_processes:
      - preferred_term: T cell lineage commitment
        term:
          id: GO:0002360
          label: T cell lineage commitment
        modifier: DECREASED
    downstream:
      - target: Leaky Severe Combined Immunodeficiency
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "BCL11B played a critical role in the development of human T-cell progenitors, in that their development, but not that of B cells, was impaired by knockdown of BCL11B with the use of siRNA"
        explanation: >
          Demonstrates that BCL11B is specifically required for human T-cell
          (not B-cell) progenitor development.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "re-expression of wild-type human BCL11B protein restored T-cell development and corrected the craniofacial abnormalities associated with its loss, human p.N441K BCL11B failed to do so"
        explanation: >
          Zebrafish rescue experiments confirm the N441K variant is
          functionally null/dominant-negative for T-cell development in vivo.
      - reference: PMID:28951542
        reference_title: "Priming of lineage-specifying genes by Bcl11b is required for lineage choice in post-selection thymocytes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Priming of lineage-specifying genes by Bcl11b is required for lineage choice in post-selection thymocytes"
        explanation: >
          Mouse mechanistic study establishing BCL11B's broader requirement
          for T-lineage commitment and lineage choice in thymocyte development.

  - name: Disrupted Hematopoietic Progenitor Migration
    biological_scale: CELLULAR
    description: >
      Beyond its established role in thymocyte development, BCL11B
      regulates the responsiveness of prethymic hematopoietic progenitors to
      chemotactic signals. Knockdown of the zebrafish orthologue bcl11ba
      causes lateral and dorsoventral displacement of c-myb-marked
      hematopoietic progenitors without affecting stem cell emergence, and
      induces overexpression of the chemokine receptor ccr9b at the stage
      when progenitors normally emerge; combined bcl11ba/ccr9b knockdown
      partially rescues thymic seeding. In human CD34+ progenitors, siRNA
      knockdown of BCL11B similarly increases CCR7 and CCR9 expression and
      increases progenitor migration toward their ligands CCL19 and CCL25.
    biological_processes:
      - preferred_term: hematopoietic stem cell migration
        term:
          id: GO:0035701
          label: hematopoietic stem cell migration
        modifier: ABNORMAL
    downstream:
      - target: Leaky Severe Combined Immunodeficiency
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we found substantial lateral as well as dorsoventral displacement of progenitors, which suggests that bcl11ba contributes to the control of progenitor migration"
        explanation: Zebrafish knockdown data establishing BCL11B's novel prethymic role in hematopoietic progenitor migration/positioning.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In human CD34 progenitors, siRNA-mediated repression of BCL11B also increased the expression of CCR9 as well as CCR7"
        explanation: Human progenitor data confirming BCL11B regulates chemokine-receptor-driven progenitor migration.

  - name: Leaky Severe Combined Immunodeficiency
    biological_scale: ORGANISM
    description: >
      Arrested T-lineage commitment together with disrupted prethymic
      progenitor migration produces "leaky" SCID: profound T-cell
      lymphopenia with no detectable T-cell-receptor excision circles
      (TRECs), a T-B+NK+ immunophenotype, absence of naive CD4+ helper T
      cells, and impaired proliferative response to phytohemagglutinin, with
      a minimal degree of residual immune function preserved. This is the
      hematopoietic-lineage branch of the disease and is correctable by
      allogeneic HSCT; the parallel developmental branch is not.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immunologic studies revealed a T-B+NK+ phenotype, with no naive CD4+ helper T cells, an impaired proliferative response to phytohe-magglutinin"
        explanation: Documents the leaky-SCID immunophenotype directly in the founding patient.

  - name: Multisystem Developmental Anomalies
    biological_scale: ORGANISM
    description: >
      Beyond the immune system, BCL11B is required for normal development
      of the craniofacial skeleton, skin, teeth, and corpus callosum. Loss
      of normal BCL11B function via the dominant-negative N441K allele
      produces craniofacial dysmorphism, neonatal teeth, erythematous
      psoriasiform dermatitis, wormian skull bones, mild pulmonary artery
      stenosis, and agenesis of the corpus callosum with associated
      structural brain anomalies and severe neurodevelopmental impairment.
      Zebrafish bcl11ba knockdown reproduces the craniofacial phenotype,
      including increased interorbital distance and disrupted cartilaginous
      cranial structures. Critically, these anomalies are a tissue-autonomous
      branch arising in parallel with the hematopoietic branch from the same
      BCL11B lesion — they are NOT a consequence of the immunodeficiency.
      Allogeneic HSCT fully corrected the immune defect in the founding
      patient while the neurodevelopmental phenotype persisted unchanged,
      demonstrating that the two branches are causally independent.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "were accompanied by neonatal teeth, hypotonia, an umbilical hernia, and erythematous psoriaform dermatitis"
        explanation: Documents the multisystem developmental anomalies in the founding patient.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Knockdown of bcl11ba in zebrafish also reproduced other developmental abnormalities that were present in the patient, including craniofacial abnormalities and perturbation of the cartilagenous structures in the head"
        explanation: Zebrafish model recapitulates the craniofacial developmental anomalies seen in the patient.

phenotypes:
  - name: Severe combined immunodeficiency
    description: >
      "Leaky" SCID with profound T-cell lymphopenia and no detectable
      T-cell-receptor excision circles at newborn screening.
    phenotype_term:
      preferred_term: Severe combined immunodeficiency
      term:
        id: HP:0004430
        label: Severe combined immunodeficiency
      onset:
        onset_category: NEONATAL
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Screening revealed profound T-cell lymphopenia and no detectable TRECs"
        explanation: Directly documents the founding phenotype detected by newborn screening.

  - name: Decreased circulating total T cell count
    description: >
      Profound T-cell lymphopenia with a T-B+NK+ immunophenotype and no
      naive CD4+ helper T cells.
    phenotype_term:
      preferred_term: T lymphocytopenia
      term:
        id: HP:0005403
        label: Decreased total T cell count
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immunologic studies revealed a T-B+NK+ phenotype, with no naive CD4+ helper T cells, an impaired proliferative response to phytohe-magglutinin"
        explanation: Documents profound T-cell lymphopenia with absent naive CD4+ T cells.

  - name: Craniofacial dysmorphism
    description: >
      Craniofacial dysmorphic features noted at birth, part of the
      multisystem developmental phenotype.
    phenotype_term:
      preferred_term: Abnormal facial shape
      term:
        id: HP:0001999
        label: Abnormal facial shape
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "as well as craniofacial and dermal abnormalities and the absence of a corpus callosum"
        explanation: Directly documents craniofacial abnormalities in the founding patient.

  - name: Wormian bones
    description: >
      Extra ossification centers within the cranial sutures, demonstrated on
      skull imaging — a calvarial ossification defect distinct from the
      facial dysmorphism.
    phenotype_term:
      preferred_term: Wormian bones
      term:
        id: HP:0002645
        label: Wormian bones
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Imaging (not shown) revealed wormian skull bones, mild pulmonary artery stenosis, and the absence of a corpus callosum."
        explanation: Documents wormian bones on skull imaging in the founding patient.

  - name: Erythematous psoriasiform dermatitis
    description: >
      Erythematous psoriasiform dermatitis responsive to topical

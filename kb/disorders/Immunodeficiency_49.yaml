inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Heterozygous germline BCL11B variants. Almost all reported variants arose de novo;
    a frameshift allele transmitted from an affected mother to her daughter shows
    that the disorder can be inherited as an autosomal dominant trait, and a mosaic
    de novo variant has been reported in one proband.
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient’s BCL11B variant was confirmed by Sanger sequencing of DNA from blood and buccal brushings and was found to be a de novo mutation (it was not present in the DNA of either parent)."
    explanation: De novo heterozygous origin of the variant in the index IMD49 patient.
  - reference: PMID:29985992
    reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A further frameshift mutation was transmitted from a similarly affected mother."
    explanation: Parent-to-child transmission of a heterozygous allele, consistent with autosomal dominant inheritance.
genetic:
- name: BCL11B
  gene_term:
    preferred_term: BCL11B
    term:
      id: hgnc:13222
      label: BCL11B
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Heterozygous germline variants. The SCID presentation is associated with a
    missense variant (p.N441K) at a DNA-contacting residue of zinc finger 2 that
    acts as a dominant negative; a second zinc-finger DNA-recognition missense
    (p.N807K, zinc finger 4) gave the most severe phenotype of the first IDDSFTA
    cohort. Frameshift and nonsense variants (most in the last exon, predicted to
    escape nonsense-mediated decay and to delete the C-terminal zinc fingers),
    balanced translocations that separate BCL11B from its enhancers and halve its
    expression, and 14q32.2 deletions give the neurodevelopmental presentation. An
    N-terminal missense (p.R3S) that weakens binding to the NuRD and PRC2
    complexes was found in isolated coronal craniosynostosis.
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed a heterozygous de novo missense mutation, p.N441K, in BCL11B."
    explanation: Identification of the causal BCL11B variant in the index IMD49 patient.
  - reference: PMID:29985992
    reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using massively parallel sequencing we identified 13 patients bearing heterozygous germline alterations in BCL11B."
    explanation: Independent cohort establishing heterozygous BCL11B variants as a cause of the neurodevelopmental presentation.
  - reference: PMID:29985992
    reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the most severely affected patient harbours a missense mutation within a zinc-finger domain of BCL11B, probably affecting the DNA-binding structural interface, similar to the recently published patient."
    explanation: Supports the genotype-severity relationship between zinc-finger missense variants and severe disease.
pathophysiology:
- name: Dominant-Negative BCL11B Zinc-Finger Missense Variant
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  description: >
    A missense substitution at a DNA-contacting residue of a BCL11B zinc finger
    (p.N441K in the index IMD49 patient). The mutant protein heterodimerizes with
    wild-type BCL11B on stimulation, the heterodimer fails to bind canonical target
    sites, and the mutant also binds a novel site in TACC1, so the allele both
    removes wild-type function and redirects binding.
  genes:
  - preferred_term: BCL11B
    term:
      id: hgnc:13222
      label: BCL11B
  molecular_functions:
  - preferred_term: sequence-specific DNA binding
    term:
      id: GO:0043565
      label: sequence-specific DNA binding
    modifier: DECREASED
  downstream:
  - target: Impaired BCL11B Transcriptional Regulation
  - target: Arrest of T-Lineage Commitment and Development
  - target: Dysregulated Hematopoietic Progenitor Migration
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The resulting BCL11B protein had dominant negative activity, which abrogated the ability of wild-type BCL11B to bind DNA, thereby arresting development of the T-cell lineage and disrupting hematopoietic stem-cell migration; this revealed a previously unknown function of BCL11B."
    explanation: >-
      Functional studies in human hematopoietic stem cells and cell lines showing the
      dominant negative mechanism and its two cellular consequences.
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, the p.N441K mutation altered BCL11B function in two ways, by blocking binding to canonical sites while also redirecting binding to novel sites."
    explanation: ChIP-seq in human hematopoietic stem cells showing loss of canonical binding and gain of novel binding.
- name: BCL11B Haploinsufficiency or Truncation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    Frameshift and nonsense variants, balanced translocations that remove BCL11B
    from its regulatory landscape, and 14q32.2 deletions reduce BCL11B dosage or
    produce a protein lacking the C-terminal DNA-binding zinc fingers. A C-terminal
    frameshift allele behaves as a functional null in mouse hippocampal slice
    cultures.
  genes:
  - preferred_term: BCL11B
    term:
      id: hgnc:13222
      label: BCL11B
  downstream:
  - target: Impaired BCL11B Transcriptional Regulation
  evidence:
  - reference: PMID:29985992
    reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, we show here that mutations leading either to BCL11B haploinsufficiency or to a truncated BCL11B protein clinically cause a non-syndromic neurodevelopmental delay."
    explanation: States the loss-of-function mechanism class and its clinical consequence.
  - reference: PMID:29985992
    reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data suggest that these premature termination codon mutations in BCL11B result in a functional null allele and recapitulate the hippocampal phenotype observed in Bcl11b mutant mice (Simon et al., 2012)."
    explanation: Mouse hippocampal slice rescue assay showing a patient truncating allele is a functional null.
- name: Reduced BCL11B-NuRD Interaction
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  description: >
    An N-terminal missense substitution (p.R3S) in the conserved RRKQxxP motif
    weakens BCL11B binding to the RBBP4-MTA1 subassembly of the NuRD complex and to
    PRC2, lowering affinity by nearly an order of magnitude. Reported in isolated
    coronal craniosynostosis.
  genes:
  - preferred_term: BCL11B
    term:
      id: hgnc:13222
      label: BCL11B
  downstream:
  - target: Abnormal Cranial Suture and Craniofacial Development
  evidence:
  - reference: PMID:31067316
    reference_title: "A de novo substitution in BCL11B leads to loss of interaction with transcriptional complexes and craniosynostosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The p.R3S substitution occurs within a conserved amino-terminal motif (RRKQxxP) of BCL11B and reduces interaction with both transcriptional complexes."
    explanation: Biochemical demonstration that the craniosynostosis variant weakens NuRD/PRC2 binding.
- name: Impaired BCL11B Transcriptional Regulation
  biological_scale: MOLECULAR
  description: >
    Shared consequence of the variant classes: reduced BCL11B-dependent regulation
    of target genes in the tissues where BCL11B specifies cell fate (T-lineage and
    ILC2 progenitors, cortical and hippocampal neurons, cranial mesenchyme,
    epidermis and dental epithelium). The critical target genes for morphogenesis
    and hematopoiesis are not identified.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:

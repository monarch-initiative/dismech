animal_models:
- name: bcl11ba morphant zebrafish
  species: Zebrafish
  genotype: bcl11ba antisense morpholino knockdown, with or without ectopic human BCL11B p.N441K
  publication: PMID:27959755
  description: >
    Morpholino knockdown of the zebrafish BCL11B orthologue bcl11ba, and ectopic
    expression of the patient's p.N441K allele, block lck:GFP T-progenitor
    development, perturb head cartilage, widen interorbital distance and displace
    hematopoietic progenitors; wild-type but not mutant human BCL11B rescues.
  modeled_mechanisms:
  - target: Arrest of T-Lineage Commitment and Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Knockdown or mutant expression blocks T-progenitor development, rescued by wild-type human BCL11B.
    limitations: >-
      Transient morpholino knockdown in embryos rather than a stable heterozygous
      allele; embryonic thymus seeding rather than postnatal human thymopoiesis.
    evidence:
    - reference: PMID:27959755
      reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Indeed, although re-expression of wild-type human BCL11B protein restored T-cell development and corrected the craniofacial abnormalities associated with its loss, human p.N441K BCL11B failed to do so (Fig. 3D)."
      explanation: Rescue experiment establishing the model's specificity for the T-lineage defect.
  - target: Abnormal Cranial Suture and Craniofacial Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Head cartilage patterning and interorbital distance are altered.
    limitations: >-
      Zebrafish embryonic cartilage patterning is not cranial suture biology; the
      model does not address craniosynostosis.
    evidence:
    - reference: PMID:27959755
      reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of bcl11ba in zebrafish also reproduced other developmental abnormalities that were present in the patient, including craniofacial abnormalities and perturbation of the cartilagenous structures in the head (Fig. 2F)."
      explanation: Craniofacial phenotype in the morphants.
- name: Bcl11b p.R3S knock-in mouse
  species: Mouse
  genotype: Bcl11b p.R3S (CRISPR-Cas9 knock-in)
  publication: PMID:31067316
  description: >
    Mouse carrying the human craniosynostosis BCL11B p.R3S substitution, which
    weakens binding to NuRD and PRC2; it develops coronal and other suture
    synostoses.
  modeled_mechanisms:
  - target: Abnormal Cranial Suture and Craniofacial Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: The knock-in reproduces coronal craniosynostosis seen in the patient.
    evidence:
    - reference: PMID:31067316
      reference_title: "A de novo substitution in BCL11B leads to loss of interaction with transcriptional complexes and craniosynostosis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated a mouse model of the BCL11B p.R3S substitution using a CRISPR-Cas9-based approach, and we report herein that these mice exhibit craniosynostosis of the coronal suture, as well as other cranial sutures."
      explanation: Knock-in mouse craniosynostosis.

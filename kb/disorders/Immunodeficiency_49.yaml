animal_models:
  - species: Mouse (Mus musculus)
    genotype: Bcl11b constitutive knockout (Bcl11b-/-)
    category: Knockout
    description: >
      The foundational Bcl11b mouse model. Bcl11b-deficient mice show a
      block at the CD4-CD8- double-negative stage of thymocyte development,
      with unsuccessful Vbeta-to-Dbeta TCR recombination, absent
      pre-T-cell-receptor surface expression, and profound neonatal thymic
      apoptosis, without impairment of B- or gammadelta-T-cell lineages.
      Homozygous null mice establish that complete Bcl11b loss is a
      T-lineage-specific, cell-autonomous differentiation/survival
      requirement, though (unlike the human dominant-negative missense
      alleles) simple heterozygous loss alone does not reproduce human
      disease.
    genes:
      - preferred_term: Bcl11b
        term:
          id: hgnc:13222
          label: BCL11B
    associated_phenotypes:
      - Thymocyte developmental block at the double-negative stage
      - Neonatal thymic apoptosis
    evidence:
      - reference: PMID:12717433
        reference_title: "Bcl11b is required for differentiation and survival of alphabeta T lymphocytes."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We have generated Bcl11b-deficient mice that show a block at the CD4-CD8- double-negative stage of thymocyte development without any impairment in cells of B- or gammadelta T cell lineages."
        explanation: >
          Establishes the foundational requirement of Bcl11b for T-lineage
          thymocyte development, the mechanistic basis for the human disease.

  - species: Zebrafish (Danio rerio)
    genotype: bcl11ba knockdown (antisense morpholino) and ectopic human p.N441K BCL11B expression
    category: Knockdown/Transgenic
    description: >
      Morpholino knockdown of the zebrafish BCL11B orthologue bcl11ba
      blocks development of lck-marked T-cell progenitors and reproduces
      craniofacial abnormalities (increased interorbital distance,
      disrupted cartilaginous cranial structures) seen in the patient.
      Ectopic expression of the patient's human p.N441K BCL11B similarly
      abrogates T-cell development and craniofacial morphogenesis, and
      fails to rescue bcl11ba-knockdown embryos, whereas wild-type human
      BCL11B does rescue them.
    genes:
      - preferred_term: bcl11ba
        term:
          id: hgnc:13222
          label: BCL11B
    associated_phenotypes:
      - Blocked T-cell progenitor development
      - Craniofacial abnormalities
      - Disrupted hematopoietic progenitor migration
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Knockdown of bcl11ba expression"
        explanation: >
          Establishes the zebrafish knockdown and ectopic-expression models
          that functionally confirmed the pathogenicity of the N441K allele.

  - species: Mouse (Mus musculus)
    genotype: Heterozygous Bcl11b(N440K) knock-in (corresponding to human p.N441K)
    category: Knock-in
    description: >
      A mouse model of the human founding IMD49 variant shows emergence of
      aberrant NK/ILC1-like NKp46+ cells in the thymus and reduction of
      TBR1+ neurons in the neocortex, phenotypes otherwise seen with loss of
      the paralogous factor Bcl11a rather than Bcl11b itself. Mechanistically,
      the mutant protein interferes with Bcl11a function upon
      heterodimerization by dampening the Bcl11b-TCF1 interaction in
      thymocytes.
    genes:
      - preferred_term: Bcl11b
        term:
          id: hgnc:13222
          label: BCL11B
    associated_phenotypes:
      - Aberrant thymic NK/ILC1-like cell emergence
      - Reduced cortical TBR1+ neurons
    evidence:
      - reference: PMID:39487351
        reference_title: "A mutant BCL11B-N440K protein interferes with BCL11A function during T lymphocyte and neuronal development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice harboring the corresponding Bcl11bN440K mutation show the emergence of natural killer (NK)/group 1 innate lymphoid cell (ILC1)-like NKp46+ cells in the thymus and reduction in TBR1+ neurons in the neocortex, which are observed with loss of Bcl11a but not Bcl11b"
        explanation: >
          Mouse knock-in model of the IMD49 founding variant reveals a
          heterodimerization-dependent interference mechanism with the
          paralogous factor BCL11A in both immune and neuronal development.

  - species: Mouse (Mus musculus)
    genotype: Heterozygous and homozygous Bcl11b(N797K) knock-in (corresponding to human p.N807K, a distinct "specificity residue" variant from a separate immunodeficient patient)
    category: Knock-in
    description: >
      A knock-in mouse model of a second patient-derived "specificity
      residue" BCL11B variant (distinct from the IMD49 founding N441K
      allele) shows increased proportions of immature CD4-CD8+
      single-positive thymocytes, severely inhibited invariant NK T-cell
      development, and outcompeted gammadelta T-cell development.
      Homozygous mutant mice die within one day of birth, and fetal liver
      progenitors nearly fail to generate CD4+CD8+ double-positive
      thymocytes, illustrating that distinct BCL11B "specificity residue"
      variants converge on a shared T-cell developmental arrest mechanism.
    genes:
      - preferred_term: Bcl11b
        term:
          id: hgnc:13222
          label: BCL11B
    associated_phenotypes:
      - Impaired CD4-CD8 thymocyte transition
      - Inhibited invariant NK T-cell development
    evidence:
      - reference: PMID:38495886
        reference_title: "A Bcl11b(N797K) variant isolated from an immunodeficient patient inhibits early thymocyte development in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Bcl11b+/N797K mice, the proportion of immature CD4-CD8+ single-positive thymocytes was increased, and the development of invariant natural killer cells was severely inhibited in a T-cell-intrinsic manner."
        explanation: >
          Mouse model of an independent BCL11B "specificity residue"
          immunodeficiency variant demonstrates convergent impairment of
          early thymocyte development, supporting the general mechanistic
          class to which the IMD49 founding variant belongs.

treatments:
  - name: Immunoglobulin Replacement Therapy
    description: >
      Intravenous immune globulin given while awaiting definitive
      hematopoietic stem-cell transplantation.
    therapeutic_modality: PROTEIN_REPLACEMENT
    treatment_term:
      preferred_term: immunoglobulin replacement therapy
      term:
        id: MAXO:0001480
        label: immunoglobulin infusion therapy
    target_mechanisms:
      - target: Leaky Severe Combined Immunodeficiency
        treatment_effect: BYPASSES
        description: >
          Exogenous immunoglobulin supplies humoral protection the patient
          cannot mount, bridging to curative HSCT without correcting the
          underlying T-cell developmental defect.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The infant received antiinfective prophylaxis and intravenous immune globulin."
        explanation: Documents IVIG as bridging therapy in the founding patient.

  - name: Antiinfective Prophylaxis
    description: >
      Antimicrobial prophylaxis against opportunistic infection given while
      awaiting definitive hematopoietic stem-cell transplantation.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: antimicrobial prophylaxis
      term:
        id: MAXO:0001021
        label: antimicrobial agent therapy
    target_mechanisms:
      - target: Leaky Severe Combined Immunodeficiency
        treatment_effect: BYPASSES
        description: >
          Chemoprophylaxis reduces opportunistic infection risk while the
          T-cell defect remains uncorrected.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The infant received antiinfective prophylaxis and intravenous immune globulin."
        explanation: Documents antiinfective prophylaxis as bridging therapy in the founding patient.

  - name: Allogeneic Hematopoietic Stem Cell Transplantation
    description: >
      Allogeneic hematopoietic stem-cell transplantation from an
      HLA-matched unrelated donor, following anti-CD52 serotherapy and
      busulfan/fludarabine/rabbit antithymocyte globulin conditioning, with
      cyclosporine/methotrexate graft-versus-host-disease prophylaxis. A
      first transplant failed to engraft; a second transplant from the same
      donor achieved full T-cell engraftment, normal T-cell-receptor
      repertoire diversity, and protective vaccine responses, correcting
      the immune defect. The germline neurodevelopmental phenotype
      (intellectual impairment, spastic quadriplegia, seizures) persisted
      after successful hematopoietic reconstitution.
    therapeutic_modality: CELL_THERAPY
    treatment_term:
      preferred_term: allogeneic hematopoietic stem cell transplantation
      term:
        id: MAXO:0001479
        label: allogeneic hematopoietic stem cell transplantation
    target_mechanisms:
      - target: Arrested T-Cell Lineage Commitment
        treatment_effect: BYPASSES
        description: >
          Donor-derived hematopoiesis supplies BCL11B-sufficient progenitors
          that undergo normal T-lineage commitment, bypassing the
          cell-intrinsic dominant-negative defect of the patient's own
          hematopoietic stem cells.
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "By 2 years of age, the patient no longer required any medication and had protective vaccine responses; engraftment has remained stable."
        explanation: Documents successful, durable immune reconstitution after allogeneic HSCT.
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "his immune deficit was fully corrected by hematopoietic stem-cell transplantation"
        explanation: Documents that HSCT fully corrects the immune (but not neurodevelopmental) component of the disease.

  - name: Anticonvulsant Therapy
    description: >
      Antiseizure medication for the seizures that form part of the
      neurodevelopmental phenotype. This branch of the disease is not
      addressed by hematopoietic stem-cell transplantation.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: anticonvulsant agent therapy
      term:
        id: MAXO:0000167
        label: anticonvulsant agent therapy
    notes: >
      Standard-of-care symptomatic management extrapolated from general
      epilepsy practice; no IMD49-specific antiseizure regimen or trial has
      been reported.

  - name: Developmental and Rehabilitative Therapy
    description: >
      Physical, occupational, and speech therapy for the spastic
      quadriplegia, motor impairment, and absent language that persist after
      immune reconstitution.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: physical therapy
      term:
        id: MAXO:0000011
        label: physical therapy
    notes: >
      Supportive, non-curative management of the tissue-autonomous
      developmental branch of the disease, which allogeneic HSCT does not
      correct. Not specifically trialed in IMD49.

  - name: Genetic Counseling
    description: >
      Counseling on the de novo autosomal dominant mechanism and recurrence
      risk. Recurrence risk for unaffected parents is low but non-zero given
      the theoretical possibility of germline mosaicism.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: genetic counseling
      term:
        id: MAXO:0000079
        label: genetic counseling
    notes: >
      Counselling should distinguish the IMD49 arm (all reported variants de
      novo) from the broader BCL11B spectrum, where transmission from an
      affected parent has been documented for gene-disruptive alleles.

diagnosis:
  - name: Newborn TREC screening
    description: >
      Quantification of T-cell-receptor excision circles on newborn
      screening detects the profound T-cell lymphopenia of IMD49 before
      infections occur.
    diagnosis_term:
      preferred_term: newborn screening
      term:
        id: NCIT:C81178
        label: Newborn Screening
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "SCID was detected in a newborn before the onset of infections by means of screening of T-cell-receptor excision circles, a biomarker for thymic output."
        explanation: Establishes TREC-based newborn screening as the initial diagnostic trigger.

  - name: Exome sequencing
    description: >
      Whole-exome sequencing in the patient and both parents, prioritized
      against known SCID genes, identifies the causative heterozygous de
      novo BCL11B missense variant.
    diagnosis_term:
      preferred_term: molecular genetic testing
      term:
        id: MAXO:0000533
        label: molecular genetic testing
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Exome sequencing in the patient and parents was followed by functional analysis of a prioritized candidate gene"
        explanation: Establishes trio exome sequencing as the diagnostic route to the causative BCL11B variant.

  - name: Lymphocyte immunophenotyping
    description: >
      Flow-cytometric immunophenotyping demonstrates the characteristic
      T-B+NK+ pattern with absent naive CD4+ T cells and impaired
      mitogen-induced proliferation.
    diagnosis_term:
      preferred_term: lymphocyte immunophenotyping
      term:
        id: MAXO:0035055
        label: flow cytometry procedure
    evidence:
      - reference: PMID:27959755
        reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Immunologic studies revealed a T-B+NK+ phenotype, with no naive CD4+ helper T cells, an impaired proliferative response to phytohe-magglutinin"
        explanation: Documents the immunophenotyping findings supporting the SCID diagnosis.

differential_diagnoses:
  - name: Intellectual developmental disorder with speech delay, dysmorphic facies, and T-cell abnormalities (IDDSFTA)
    description: >
      A distinct, milder clinical subtype on the BCL11B-related disorder
      spectrum (MONDO:0060763; OMIM:618092), typically caused by likely
      gene-disruptive (haploinsufficiency/truncating) BCL11B variants or
      missense variants affecting zinc-binding cysteine/histidine residues,
      rather than the DNA-binding "specificity residue" missense variants
      that cause IMD49. IDDSFTA presents with mild-to-moderate
      neurodevelopmental delay, dental and behavioral anomalies, allergy/
      asthma, and reduced type 2 innate lymphoid cells, but without overt
      clinical immunodeficiency.
    distinguishing_features:
      - IMD49 is caused by missense variants at one of four DNA-binding "specificity residues" within C2H2 zinc fingers (e.g. p.Asn441Lys); IDDSFTA is typically caused by likely gene-disruptive variants or zinc-binding-residue missense variants.
      - IMD49 presents with overt SCID/leaky SCID and profound T-cell lymphopenia; IDDSFTA individuals show impaired T-cell development and reduced ILC2s without overt clinical immunodeficiency.
      - IMD49's founding case included agenesis of the corpus callosum, severe intellectual impairment, spastic quadriplegia, and seizures; IDDSFTA is typically mild-to-moderate intellectual disability with speech delay and behavioral issues (ADHD, autism spectrum features).
    evidence:
      - reference: PMID:29985992
        reference_title: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "BCL11B mutations in patients affected by a neurodevelopmental disorder with reduced type 2 innate lymphoid cells"
        explanation: Establishes the defining IDDSFTA cohort/phenotype as distinct from IMD49.
      - reference: PMID:39798569
        reference_title: "DNA-binding affinity and specificity determine the phenotypic diversity in BCL11B-related disorders."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "gene-disruptive BCL11B variants and missense variants affecting zinc-binding \n      cysteine and histidine residues cause mild to moderate neurodevelopmental delay"
        explanation: >
          Documents the milder neurodevelopmental phenotype associated with
          gene-disruptive/zinc-binding-residue BCL11B variants (the IDDSFTA
          mechanistic class), in contrast to the "specificity residue" class
          that causes IMD49.
    notes: >
      A 2025 systematic review (PMID:40033098) argues IMD49 and IDDSFTA,
      together with the atopic/immune-dysregulation phenotype below, lack
      reliable genotype-phenotype separation and should be regarded as one
      BCL11B-related disease spectrum rather than distinct diseases; see the
      open nosological discussion recorded below. dismech retains IMD49 and
      IDDSFTA as separate entries (per their separate MONDO/OMIM identifiers)
      pending a project-level lump/split decision.

  - name: BCL11B-related severe atopic disease and immune dysregulation
    description: >
      A third recognized presentation on the BCL11B-related disorder
      spectrum, in which a heterozygous germline BCL11B variant (e.g.
      p.Cys826Tyr in zinc-finger 5) produces severe multi-system allergic
      disease (food allergy, atopic dermatitis, asthma, alopecia, prurigo
      nodularis) with markedly elevated IgE and eosinophilia, but
      relatively preserved T-cell numbers and thymic output rather than
      overt SCID.
    distinguishing_features:
      - IMD49 presents with overt leaky SCID and profound T-cell lymphopenia; the atopic phenotype shows relatively preserved T-cell numbers and thymic output with immune dysregulation manifesting as severe allergic disease instead.
      - IMD49's founding variant (p.Asn441Lys) is a DNA-binding "specificity residue" missense variant; the reported atopic-phenotype variant (p.Cys826Tyr) affects a zinc-binding residue in a different zinc finger (ZnF5).
    evidence:
      - reference: PMID:34887873
        reference_title: "A Novel Germline Heterozygous BCL11B Variant Causing Severe Atopic Disease and Immune Dysregulation."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "A Novel Germline Heterozygous BCL11B Variant Causing Severe Atopic Disease and Immune Dysregulation"
        explanation: Establishes the distinct severe-atopic-disease presentation of BCL11B-related disease.

discussions:
  - discussion_id: gap_imd49_brd_nosology
    prompt: >-
      Should IMD49 (SCID-dominant), IDDSFTA (neurodevelopmental-dominant),
      and the BCL11B-related severe atopic/immune-dysregulation phenotype be
      modeled as a single, variably expressive BCL11B-related disease
      spectrum rather than as separate diseases?
    kind: KNOWLEDGE_GAP
    status: OPEN
    attaches_to:
      - differential_diagnoses#Intellectual developmental disorder with speech delay, dysmorphic facies, and T-cell abnormalities (IDDSFTA)
      - differential_diagnoses#BCL11B-related severe atopic disease and immune dysregulation
      - genetic#BCL11B
    rationale: >-
      A 2025 systematic review pooling all 51 reported BCL11B-variant
      individuals in the literature found no reliable genotype-phenotype
      correlation predicting which of the SCID-, neurodevelopmental-, or
      atopic-dominant presentations a given variant produces, and explicitly
      proposed that BCL11B-related disease be regarded as a single
      phenotypic entity rather than the two (or three) separately
      OMIM-cataloged phenotypes. MONDO and OMIM currently retain IMD49
      (MONDO:0014981; OMIM:617237) and IDDSFTA (MONDO:0060763; OMIM:618092)
      as distinct disease identifiers, and the atopic phenotype has no
      dedicated identifier at all, so resolving this is a project-level
      lump/split decision beyond the scope of a single disease entry.
    evidence:
      - reference: PMID:40033098
        reference_title: "BCL11B-related disease: a single phenotypic entity?"
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "review of literature, providing evidence that BCL11B-related disease (BRD) should be regarded as a single phenotypic entity"
        explanation: >
          The 2025 systematic review's central thesis, posed as an open
          question in its own title, that BCL11B-related disease should be
          unified into one phenotypic entity.
    posed_date: "2026-07-30T00:00:00Z"


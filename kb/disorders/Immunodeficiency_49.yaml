treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >
    Allogeneic HSCT (a second transplant after conditioning with busulfan,
    fludarabine and antithymocyte globulin, following failed engraftment of the
    first) gave full T-cell engraftment, normal PHA proliferation, a normal
    T-cell-receptor repertoire and protective vaccine responses in the index IMD49
    patient. It does not correct the neurodevelopmental disability.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Arrest of T-Lineage Commitment and Development
    description: Donor-derived hematopoiesis supplies BCL11B-sufficient T-lineage progenitors.
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By 2 years of age, the patient no longer required any medication and had protective vaccine responses; engraftment has remained stable."
    explanation: Durable immune reconstitution after HSCT.
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was critical for our patient, who, despite having substantial developmental abnormalities outside the hematopoietic system, had full hematopoietic reconstitution after stem-cell transplantation."
    explanation: Immune correction despite persistent non-hematopoietic abnormalities.

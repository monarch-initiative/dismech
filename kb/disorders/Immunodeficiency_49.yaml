name: Immunodeficiency 49
creation_date: "2026-07-30T23:42:36Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 49
  term:
    id: MONDO:0014981
    label: immunodeficiency 49
description: >
  Immunodeficiency 49 (IMD49; OMIM:617237) is an autosomal dominant, de novo
  "leaky" severe combined immunodeficiency (SCID) caused by heterozygous
  missense variants affecting a DNA-binding "specificity residue" within a
  C2H2 zinc-finger domain of BCL11B, a transcription factor required for
  T-lineage commitment and thymocyte development. The founding case,
  identified by newborn TREC screening, harbored a de novo p.Asn441Lys
  (N441K) variant that acts as a dominant negative, forming nonfunctional
  heterodimers with wild-type BCL11B, abolishing binding at canonical target
  sites, and redirecting binding to novel, noncanonical DNA sequences.
  That founding patient presented with profound T-cell lymphopenia and a
  T-B+NK+ immunophenotype, together with a multisystem syndrome reflecting
  BCL11B's additional developmental roles: craniofacial dysmorphism, dermal
  abnormalities, agenesis of the corpus callosum, and severe
  neurodevelopmental impairment. As of the 2025 pooled review that patient
  remains the only individual reported with SCID, so the immunological
  phenotype here is described from n=1 and should not be read as an
  established frequency across BCL11B variant carriers. Allogeneic hematopoietic stem-cell
  transplantation corrects the immune defect but does not address the
  germline neurodevelopmental phenotype. IMD49 is one of at least three
  clinical subtypes on the BCL11B-related disorder spectrum: missense
  variants affecting DNA-binding "specificity residues" (as in IMD49) produce
  the most severe and heterogeneous outcomes, in contrast to likely
  gene-disruptive (LGD) variants and other zinc-finger missense variants,
  which typically cause a milder neurodevelopmental disorder without overt
  immunodeficiency (IDDSFTA; OMIM:618092). A 2025 systematic review pooling
  51 reported BCL11B-variant individuals found no reliable genotype-phenotype
  correlation and proposed that IMD49, IDDSFTA, and a distinct
  BCL11B-associated severe atopic/immune-dysregulation phenotype are better
  regarded as a single, variably expressive BCL11B-related disease spectrum
  than as separate diseases; this nosological question remains open (see
  Discussion below).

synonyms:
  - IMD49
  - BCL11B primary immunodeficiency disease
  - BCL11B-related severe combined immunodeficiency
  - Multisystem anomalies in severe combined immunodeficiency with mutant BCL11B

parents:
  - BCL11B-related disorder
  - Severe combined immunodeficiency


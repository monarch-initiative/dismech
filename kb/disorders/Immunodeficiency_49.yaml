  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BCL11B is a Cys2His2 zinc finger transcription factor, and therefore the observed defects may result from perturbed expression of BCL11B target genes."
    explanation: >-
      The authors' interpretation linking the multisystem phenotype to perturbed
      BCL11B target-gene expression.
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, the critical target genes required for BCL11B to facilitate morphogenesis and hematopoiesis remain to be identified."
    explanation: Records that the downstream target genes are unknown.
- name: Arrest of T-Lineage Commitment and Development
  biological_scale: CELLULAR
  description: >
    BCL11B is induced by Notch signalling and commits progenitors to the T lineage.
    Knockdown of BCL11B, or expression of the dominant-negative p.N441K allele,
    abrogates T-cell development from human hematopoietic stem cells without
    affecting B-cell development, and bcl11ba knockdown blocks T-progenitor
    development in zebrafish; this is the basis of the T-B+NK+ SCID phenotype.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: double negative thymocyte
    term:
      id: CL:0002489
      label: double negative thymocyte
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
    modifier: DECREASED
  downstream:
  - target: Severe combined immunodeficiency
  - target: Absent T cell receptor excision circles
  - target: T lymphopenia
  - target: Absent naive CD4+ T cells
  - target: Impaired T-cell proliferation to phytohemagglutinin
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, BCL11B played a critical role in the development of human T-cell progenitors, in that their development, but not that of B cells, was impaired by knockdown of BCL11B with the use of siRNA (Fig. 2C and 2D); moreover, ectopic expression of the patient’s mutant construct also abrogated T-cell development, which suggested a dominant negative effect."
    explanation: Human hematopoietic stem cells differentiated on OP9-DL1 show a T-lineage-specific block with the patient allele.
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ectopic expression of the p.N441K BCL11B human protein indeed reproduced the abnormalities that were observed on knockdown of bcl11ba; development of T cells marked by lck:GFP was abrogated (Fig. 3A), as was the development of human T-cell progenitors in vitro (Fig. 2D)."
    explanation: Zebrafish in vivo confirmation that the patient allele blocks T-cell development.
- name: Dysregulated Hematopoietic Progenitor Migration
  biological_scale: CELLULAR
  description: >
    Reduced BCL11B function raises CCR7 and CCR9 expression on hematopoietic
    progenitors and increases their chemotactic migration; in zebrafish, bcl11ba
    knockdown displaces progenitors and impairs thymic seeding, which is partially
    rescued by co-knockdown of ccr9b. This prethymic defect adds to the T-lineage
    arrest.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: hematopoietic stem cell migration
    term:
      id: GO:0035701
      label: hematopoietic stem cell migration
    modifier: INCREASED
  downstream:
  - target: Arrest of T-Lineage Commitment and Development
  evidence:
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In human CD34 progenitors, siRNA-mediated repression of BCL11B also increased the expression of CCR9 as well as CCR7 (Fig. 4D) and increased migration of these progenitors both in response to CCR7 and CCR9 ligands (CCL19 and CCL25, respectively) (Fig. 4E) and in the absence of exogenous chemokines."
    explanation: Human progenitor transwell assay showing increased chemokine-receptor expression and migration after BCL11B knockdown.
  - reference: PMID:27959755
    reference_title: "Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although the knockdown of ccr9b alone did not prevent thymic seeding, when ccr9b was knocked down in combination with bcl11ba, it did produce a partial rescue of thymic seeding in the bcl11ba morphants at 3.5 and 5 days after fertilization (Fig. 4C, and Fig. S10D in the Supplementary Appendix)."
    explanation: Zebrafish genetic interaction linking the migration defect to impaired thymic seeding.
- name: Impaired Thymopoiesis with Skewed T-Cell Compartment
  biological_scale: CELLULAR
  description: >
    In patients without overt immunodeficiency, thymic output is reduced (few CD4+
    recent thymic emigrants and naive CD4+ T cells), gamma-delta T cells with a
    V-delta-1 bias are overrepresented, and effector-memory CD8+ T cells
    re-expressing CD45RA are expanded, so that patients cluster apart from healthy
    children on T-cell subset profiling.
  cell_types:
  - preferred_term: T cell

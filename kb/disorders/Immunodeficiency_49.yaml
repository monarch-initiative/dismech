notes: >-
  Lump/split: MONDO keeps immunodeficiency 49 (MONDO:0014981, OMIM:617237) and
  intellectual developmental disorder with speech delay, dysmorphic facies, and
  t-cell abnormalities (MONDO:0060763, OMIM:618092) as separate classes. The second
  is recorded here as a has_subtypes row rather than a separate entry because both
  are heterozygous BCL11B disorders sharing the same T-cell, ILC2, neurodevelopmental
  and craniofacial mechanisms; a systematic review (PMID:40033098) found no
  significant clinical or molecular distinction between them, and the IDDSFTA cohort
  that defined OMIM:618092 (PMID:29985992) already carries the subclinical T-cell
  defect. The proposed genotype split (a zinc-finger DNA-contact missense acting as
  a dominant negative gives the severe SCID presentation; truncation or reduced
  expression gives the neurodevelopmental presentation) is recorded as two root
  pathophysiology nodes. IUIS 2022 lists BCL11B deficiency with the combined
  immunodeficiencies with associated or syndromic features, which is why the SCID
  genetics entry (Severe_Combined_Immunodeficiency) does not carry BCL11B.

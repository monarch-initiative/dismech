    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We refine the intricacies of T cell compartment alterations of BCL11B-RD, revealing decreased levels naive CD4+ T cells and recent thymic emigrants while concurrently observing an elevated proportion of effector-memory expressing CD45RA CD8+ T cells (TEMRA)."
    explanation: Independent 20-patient series replicating the reduced thymic output.

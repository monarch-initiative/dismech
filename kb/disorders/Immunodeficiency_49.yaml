name: Immunodeficiency 49
creation_date: "2026-09-28T12:46:47Z"
category: Mendelian
synonyms:
- IMD49
- BCL11B deficiency
- Severe combined immunodeficiency, T cell-negative, B cell-positive, NK cell-positive, with intellectual disability, spasticity, and craniofacial abnormalities
- BCL11B primary immunodeficiency disease
description: >
  Immunodeficiency 49 (IMD49, BCL11B deficiency) is an autosomal dominant inborn
  error of immunity caused by heterozygous, usually de novo, germline variants in
  BCL11B, which encodes a C2H2 zinc-finger transcription factor required for
  commitment of early progenitors to the T-cell lineage and for development of the
  cortex, hippocampus, craniofacial skeleton, skin and teeth. The index patient was
  detected by newborn screening for T-cell receptor excision circles (TRECs) and had
  leaky T-B+NK+ severe combined immunodeficiency together with neonatal teeth,
  psoriasiform dermatitis, wormian bones, agenesis of the corpus callosum,
  hypotonia, and later intellectual impairment with spastic quadriplegia and
  seizures. His heterozygous missense variant (p.N441K) lies in a DNA-contacting
  zinc finger and acts as a dominant negative: mutant BCL11B heterodimerizes with
  the wild-type protein, the complex fails to bind canonical target sites and binds
  at least one novel site, T-lineage development arrests, and hematopoietic
  progenitor chemokine-receptor expression and migration are disturbed.
  Hematopoietic stem-cell transplantation fully corrected the immune defect but not
  the neurodevelopmental disability.

  Heterozygous truncating variants, whole-gene loss of expression, and most other
  BCL11B variants cause a related neurodevelopmental disorder (intellectual
  developmental disorder with speech delay, dysmorphic facies, and T-cell
  abnormalities, IDDSFTA) with global developmental delay, speech impairment,
  facial dysmorphism, dental anomalies, refractive errors, craniosynostosis in a
  subset, movement disorders including dystonia and spasticity, and exaggerated
  type 2 (atopic) responses. These patients have no overt immunodeficiency but carry
  a measurable thymopoiesis defect (few recent thymic emigrants and naive CD4+ T
  cells, an expanded gamma-delta T-cell compartment) and lack peripheral type 2
  innate lymphoid cells. The two MONDO/OMIM classes are modelled here as one
  BCL11B-related disorder spectrum, with IDDSFTA as a subtype.

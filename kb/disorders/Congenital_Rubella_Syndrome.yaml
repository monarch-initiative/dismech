name: Congenital Rubella Syndrome
creation_date: "2026-11-01T00:00:00Z"
category: Infectious Disease
synonyms:
- CRS
- Fetal rubella syndrome
- Gregg syndrome
description: >
  Congenital rubella syndrome (CRS) is a severe teratogenic disorder resulting from
  maternal primary infection with rubella virus during early pregnancy, with the
  highest risk of congenital anomalies occurring during the first trimester.
  Transplacental viral transmission leads to placental chorionic villus endothelial
  infection with interferon-driven angiogenic impairment, persistent fetal infection,
  and capsid-p32-mediated mitochondrial disruption, apoptosis, and mitotic arrest
  during organogenesis. Classically described by Norman Gregg in 1941 as a triad of
  sensorineural deafness, congenital cataracts, and congenital heart disease (most
  commonly branch pulmonary artery stenosis and patent ductus arteriosus), CRS also
  presents with intrauterine growth restriction, microcephaly, intellectual
  disability, hepatosplenomegaly, neonatal jaundice, thrombocytopenic purpura,
  "blueberry muffin" lesions of dermal extramedullary hematopoiesis, and delayed-onset
  manifestations including diabetes mellitus and glaucoma. Universal immunization with
  live-attenuated rubella-containing vaccines (RA 27/3 strain in MMR) prevents
  maternal rubella viremia and transplacental transmission.

infectious_agent:
- name: Rubella virus
  infectious_agent_term:
    preferred_term: Rubella virus
    term:
      id: NCBITaxon:11041
      label: Rubella virus
  description: >
    Rubella virus (Rubivirus rubellae; family Matonaviridae) is an enveloped,
    single-stranded positive-sense RNA virus whose E1 and E2 envelope glycoproteins
    mediate host cell entry and serve as the targets of neutralizing maternal and
    vaccine-induced antibodies, while the viral capsid protein interacts with host
    mitochondrial protein p32 to perturb mitochondrial distribution and trigger
    cytopathic apoptosis in developing fetal tissues.
  evidence:
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Rubella virus (RV) is the causative agent of the disease known as rubella or German measles in humans."
    explanation: Establishes rubella virus as the causative agent of rubella in humans.
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rubella is an acute illness caused by rubella virus and characterised by fever and rash."
    explanation: Establishes rubella virus as the etiologic pathogen.
transmission:
- name: Transplacental (vertical) transmission
  description: >
    Following maternal respiratory acquisition and systemic viremia during early
    gestation, rubella virus infects the placental chorionic villous endothelium and
    crosses the placental barrier to establish chronic infection in the developing
    fetus, which lacks mature adaptive immune defenses during the first trimester.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary rubella virus infection in early pregnancy can result in congenital rubella syndrome, which has serious medical and public health consequences"
    explanation: Establishes early-pregnancy maternal rubella infection as the route to congenital rubella syndrome.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy, due to the lack of immune defense in the developing fetus"
    explanation: Documents first-trimester fetal vulnerability to transplacental rubella infection.
pathophysiology:
- name: Maternal Rubella Viremia and Transplacental Viral Entry
  description: >
    Primary maternal rubella infection in a non-immune pregnant host produces systemic
    viremia that seeds the placenta, allowing rubella virus to cross the placental
    barrier and enter fetal tissues during critical first-trimester windows of
    embryogenesis.
  conforms_to: "vaccine_induced_humoral_neutralization#Extracellular Pathogen Entry and Dissemination"
  locations:
  - preferred_term: Placenta
    term:
      id: UBERON:0001987
      label: placenta
  biological_processes:
  - preferred_term: Viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Placental Chorionic Villus Endothelial Infection and Angiogenic Impairment
    description: Maternal rubella viremia infects placental chorionic villus endothelial cells.
  - target: Fetal Cytopathic Apoptosis and Mitotic Inhibition During Organogenesis
    description: Transplacental viral dissemination establishes persistent infection in developing fetal organs, triggering capsid-mediated mitochondrial injury, apoptosis, and reduced cell proliferation.
  - target: Disseminated Fetal Reticuloendothelial Infection and Extramedullary Hematopoiesis
    description: Transplacental viral spread seeds the fetal liver, spleen, and bone marrow, driving hepatosplenic inflammation, thrombocytopenia, and compensatory dermal erythropoiesis.
  evidence:
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Some pathogens can be extremely harmfull during pregnancy as they can cross the placenta, infect the fetus, and go on to cause congenital birth defects, miscarriages and stillbirths (Pereira, 2018)."
    explanation: Establishes transplacental pathogen crossing and fetal infection as the upstream mechanism of congenital defects.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy, due to the lack of immune defense in the developing fetus"
    explanation: Supports transplacental fetal infection during the first trimester.
- name: Placental Chorionic Villus Endothelial Infection and Angiogenic Impairment
  description: >
    Rubella virus infects placental endothelial cells and induces a strong type I and
    type III interferon response with secretion of angiostatic chemokines such as
    CXCL10, reducing endothelial migratory and angiogenic capacity and impairing
    placental vascular development and fetal growth.
  locations:
  - preferred_term: Placenta
    term:
      id: UBERON:0001987
      label: placenta
  cell_types:
  - preferred_term: Endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:

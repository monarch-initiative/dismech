datasets:
- accession: geo:GSE225949
  title: Rubella virus infection in endothelial cells reduces angiogenesis via interferon betainduced CXCL10
  description: Rubella virus infection during pregnancy can result in abortion, stillbirth and severe defects in embryogenesis resulting in congenital rubella syndrome (CRS). Low vaccination coverage in developing regions results in estimated 100,000 CRS cases in infants per year with a mortality rate over 30%. The molecular pathomechanisms and potential treatments remain largely unexplored. Endothelial cells (EC) of the placenta are infected by rubella virus (RuV). RuV reduced angiogenic and migratory capacity of primary human EC whereas cell cycle and apoptosis rate were not affected.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 19
  notes: Identified by GEO DataSets index search for Rubella; directly profiles placental endothelial cell infection relevant to congenital rubella syndrome.

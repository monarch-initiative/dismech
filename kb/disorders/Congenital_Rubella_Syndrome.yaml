name: Congenital Rubella Syndrome
creation_date: "2026-11-01T00:00:00Z"
category: Infectious Disease
synonyms:
- CRS
- Fetal rubella syndrome
- Gregg syndrome
description: >
  Congenital rubella syndrome (CRS) is a severe teratogenic disorder resulting from
  maternal primary infection with rubella virus during early pregnancy, with the
  highest risk of congenital anomalies occurring during the first trimester.
  Transplacental viral transmission leads to persistent fetal infection, endothelial
  injury, and capsid-p32-mediated mitochondrial disruption, apoptosis, and mitotic
  arrest during organogenesis. Classically described by Norman Gregg in 1941 as a
  triad of sensorineural deafness, congenital cataracts, and congenital heart disease
  (most commonly branch pulmonary artery stenosis and patent ductus arteriosus), CRS
  also presents with microcephaly, hepatosplenomegaly, neonatal purpuric "blueberry
  muffin" lesions of dermal extramedullary hematopoiesis, and delayed-onset
  manifestations including diabetes mellitus and glaucoma. Universal immunization with
  live-attenuated rubella-containing vaccines (RA 27/3 strain in MMR) prevents
  maternal rubella viremia and transplacental transmission.
disease_term:
  preferred_term: congenital rubella syndrome
  term:
    id: MONDO:0017361
    label: congenital rubella syndrome
parents:
- Congenital infection
- Teratogenic syndrome
infectious_agent:
- name: Rubella virus
  infectious_agent_term:
    preferred_term: Rubella virus
    term:
      id: NCBITaxon:11041
      label: Rubella virus
  description: >
    Rubella virus (Rubivirus rubellae; family Matonaviridae) is an enveloped,
    single-stranded positive-sense RNA virus whose E1 and E2 envelope glycoproteins
    mediate host cell entry and serve as the targets of neutralizing maternal and
    vaccine-induced antibodies, while the viral capsid protein interacts with host
    mitochondrial protein p32 to perturb mitochondrial distribution and trigger
    cytopathic apoptosis in developing fetal tissues.
  evidence:
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rubella virus (RV) is the causative agent of the disease known as rubella or German measles in humans."
    explanation: Establishes rubella virus as the causative agent.
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary rubella virus infection in early pregnancy can result in congenital rubella syndrome, which has serious medical and public health consequences"
    explanation: Establishes primary maternal rubella virus infection in early pregnancy as the cause of congenital rubella syndrome.
transmission:
- name: Transplacental (vertical) transmission
  description: >
    Following maternal respiratory acquisition and systemic viremia during early
    gestation, rubella virus infects the placental chorionic villous endothelium and
    crosses the placental barrier to establish chronic infection in the developing
    fetus, which lacks mature adaptive immune defenses during the first trimester.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary rubella virus infection in early pregnancy can result in congenital rubella syndrome, which has serious medical and public health consequences"
    explanation: Establishes early-pregnancy maternal rubella infection as the route to congenital rubella syndrome.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy, due to the lack of immune defense in the developing fetus"
    explanation: Documents first-trimester fetal vulnerability to transplacental rubella infection.
pathophysiology:
- name: Maternal Rubella Viremia and Transplacental Viral Entry
  description: >
    Primary maternal rubella infection in a non-immune pregnant host produces systemic
    viremia that seeds the placenta, allowing rubella virus to enter placental and
    fetal tissues during critical first-trimester windows of embryogenesis.
  conforms_to: "vaccine_induced_humoral_neutralization#Extracellular Pathogen Entry and Dissemination"
  locations:
  - preferred_term: Placenta
    term:
      id: UBERON:0001987
      label: placenta
  biological_processes:
  - preferred_term: Viral entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  downstream:
  - target: Fetal Cytopathic Apoptosis and Mitotic Inhibition During Organogenesis
    description: Transplacental viral dissemination establishes persistent infection in developing fetal organs, triggering capsid-mediated mitochondrial injury, apoptosis, and reduced cell proliferation.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "primary rubella virus infection in early pregnancy can result in congenital rubella syndrome, which has serious medical and public health consequences"
    explanation: Establishes early-pregnancy maternal rubella infection and transplacental spread as the upstream driver of CRS.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy, due to the lack of immune defense in the developing fetus"
    explanation: Supports transplacental fetal infection during the first trimester.
- name: Fetal Cytopathic Apoptosis and Mitotic Inhibition During Organogenesis
  description: >
    Within infected fetal tissues (developing lens, cochlear organ of Corti, cardiac
    outflow tract, and brain), rubella virus capsid protein binds host protein p32,
    disrupting mitochondrial distribution and morphology, inducing apoptosis, and
    inhibiting cell population proliferation. This arrest of organogenesis produces
    the classical Gregg triad of congenital cataracts, sensorineural deafness, and
    congenital heart defects as well as microcephaly and delayed endocrinopathies.
  locations:
  - preferred_term: Placenta
    term:
      id: UBERON:0001987
      label: placenta
  biological_processes:
  - preferred_term: Apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: Cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "capsid expression has been reported to cause apoptosis in certain cell types, suggesting that this protein may play a role in the cytopathic effect of the virus"
    explanation: Demonstrates that rubella capsid expression induces apoptosis, explaining cytopathic fetal tissue injury.
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The distribution and morphology of mitochondria are dramatically affected during infection with rubella virus (RV)."
    explanation: Demonstrates rubella virus-induced mitochondrial disruption via capsid-p32 interaction.
phenotypes:
- name: Congenital Cataract
  description: >
    Congenital nuclear or total cataract resulting from rubella viral invasion of the
    developing embryonic lens vesicle; one of the three classical manifestations of
    Gregg's triad.
  category: Ophthalmologic
  diagnostic: true
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:12463994
    reference_title: "Gregg's congenital rubella patients 60 years later."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1941, a Sydney ophthalmologist, Norman McAlister Gregg, correctly identified the link between congenital cataracts in infants and maternal rubella early in pregnancy."
    explanation: Historic cohort study establishing congenital cataract as the founding hallmark of CRS.
  - reference: PMID:19249974
    reference_title: "Congenital rubella syndrome: progress and future challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gregg first described the triad of deafness, cataracts and cardiac disease as the classical clinical manifestations of congenital rubella syndrome (CRS)"
    explanation: Confirms cataract as part of the classical CRS triad.
- name: Sensorineural Hearing Impairment
  description: >
    Bilateral or unilateral sensorineural deafness caused by viral cytopathic damage
    to the cochlear stria vascularis and organ of Corti; the single most common and
    frequently isolated manifestation of congenital rubella syndrome.
  category: Otologic
  diagnostic: true
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital rubella syndrome include cataracts, sensorineural hearing impairment, congenital heart disease, jaundice, purpura, hepatosplenomegaly, and microcephaly"
    explanation: Lancet seminar identifying sensorineural hearing impairment as a core CRS manifestation.
  - reference: PMID:19249974
    reference_title: "Congenital rubella syndrome: progress and future challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gregg first described the triad of deafness, cataracts and cardiac disease as the classical clinical manifestations of congenital rubella syndrome (CRS)"
    explanation: Documents deafness as a primary component of the classical CRS triad.
- name: Branch Pulmonary Artery Stenosis
  description: >
    Stenosis of the main or branch pulmonary arteries, the most frequent
    cardiovascular malformation documented by cardiac catheterization in patients
    with congenital rubella syndrome.
  category: Cardiovascular
  phenotype_term:
    preferred_term: Pulmonary artery stenosis
    term:
      id: HP:0004415
      label: Pulmonary artery stenosis
  evidence:
  - reference: PMID:19697432
    reference_title: "An update on cardiovascular malformations in congenital rubella syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 121 patients in the 10 studies with catheterization data, 78% had branch pulmonary artery stenosis, and 62% had a PDA."
    explanation: Quantifies branch pulmonary artery stenosis as the most common cardiac malformation in CRS (78%).
- name: Patent Ductus Arteriosus
  description: >
    Persistence of the fetal ductus arteriosus due to rubella-induced disruption of
    ductal arterial wall elastogenesis and smooth muscle closure; one of the two
    signature cardiac lesions of CRS.
  category: Cardiovascular
  diagnostic: true
  phenotype_term:
    preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus
  evidence:
  - reference: PMID:19697432
    reference_title: "An update on cardiovascular malformations in congenital rubella syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 121 patients in the 10 studies with catheterization data, 78% had branch pulmonary artery stenosis, and 62% had a PDA."
    explanation: Quantifies patent ductus arteriosus in 62% of catheterized CRS patients.
- name: Microcephaly
  description: >
    Congenital microcephaly resulting from viral inhibition of neural progenitor
    proliferation and microvascular injury in the developing fetal brain.
  category: Neurological
  phenotype_term:
    preferred_term: Microcephaly
    term:
      id: HP:0000252
      label: Microcephaly
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital rubella syndrome include cataracts, sensorineural hearing impairment, congenital heart disease, jaundice, purpura, hepatosplenomegaly, and microcephaly"
    explanation: Lists microcephaly among the core clinical features of CRS.
- name: Hepatosplenomegaly
  description: >
    Neonatal enlargement of the liver and spleen reflecting disseminated congenital
    viral infection and extramedullary hematopoiesis.
  category: Hepatic
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital rubella syndrome include cataracts, sensorineural hearing impairment, congenital heart disease, jaundice, purpura, hepatosplenomegaly, and microcephaly"
    explanation: Lists hepatosplenomegaly as a classic neonatal CRS sign.
- name: Dermal Extramedullary Hematopoiesis (Blueberry Muffin Lesions)
  description: >
    Neonatal blue-red infiltrative macules and papules ("blueberry muffin" rash)
    representing persistent dermal erythropoiesis in response to congenital rubella
    infection.
  category: Dermatologic
  phenotype_term:
    preferred_term: Extramedullary hematopoiesis
    term:
      id: HP:0001978
      label: Extramedullary hematopoiesis
  evidence:
  - reference: PMID:25654000
    reference_title: "Congenital rubella syndrome with blueberry muffin lesions and extensive metaphysitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The baby had blueberry muffin skin lesions, long bone metaphysitis and congenital heart defects."
    explanation: Documents neonatal blueberry muffin skin lesions in congenital rubella syndrome.
- name: Delayed-Onset Diabetes Mellitus
  description: >
    Autoimmune or insulin-deficient diabetes mellitus emerging in late childhood or
    adulthood as a delayed endocrine sequela of congenital rubella infection.
  category: Endocrine
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delayed manifestations are not present in early life and include the following: endocrinopathies: diabetes, thyroid disease, and growth hormone deficiency"
    explanation: Establishes diabetes as a delayed-onset endocrine manifestation of congenital rubella syndrome.
- name: Congenital or Delayed-Onset Glaucoma
  description: >
    Ocular hypertension and glaucoma developing either in infancy or as a late
    ophthalmologic manifestation of congenital rubella syndrome.
  category: Ophthalmologic
  phenotype_term:
    preferred_term: Glaucoma
    term:
      id: HP:0000501
      label: Glaucoma
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ocular damage: glaucoma, keratic precipitates, keratoconus, corneal hydrops, and absorption of the cataractous lens"
    explanation: Documents glaucoma as a delayed ocular manifestation of congenital rubella.
treatments:
- name: Pre-Conception and Childhood Live-Attenuated Rubella Vaccination (MMR)
  description: >
    Immunization of children and non-pregnant women of childbearing age with
    live-attenuated rubella-containing vaccine (RA 27/3 strain, typically delivered
    as MMR) induces durable anti-E1 neutralizing IgG antibodies that prevent maternal
    rubella viremia and transplacental transmission, eliminating congenital rubella
    syndrome.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Maternal Rubella Viremia and Transplacental Viral Entry
    treatment_effect: INHIBITS
    description: >-
      Pre-existing vaccine-induced neutralizing antibodies block maternal rubella
      viremia and prevent transplacental viral seeding of the placenta and fetus.
    evidence:
    - reference: PMID:35367004
      reference_title: "Rubella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Rubella and congenital rubella syndrome can be prevented by rubella-containing vaccines, which are commonly administered in combination with measles vaccine."
      explanation: Establishes that rubella-containing vaccines prevent primary maternal rubella and congenital rubella syndrome.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rubella and congenital rubella syndrome can be prevented by rubella-containing vaccines, which are commonly administered in combination with measles vaccine."
    explanation: Lancet seminar establishing rubella-containing vaccines as the primary means of preventing congenital rubella syndrome.
- name: Multidisciplinary Supportive, Surgical, and Rehabilitative Care
  description: >
    Management of affected infants requires early cataract surgery, cochlear
    implantation or hearing amplification, surgical or catheter-based repair of
    congenital heart defects (PDA closure, pulmonary artery angioplasty), and
    long-term surveillance for delayed endocrine and ophthalmologic sequelae.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delayed manifestations are not present in early life and include the following: endocrinopathies: diabetes, thyroid disease, and growth hormone deficiency"
    explanation: Supports long-term multidisciplinary surveillance and supportive care for both congenital and delayed CRS manifestations.

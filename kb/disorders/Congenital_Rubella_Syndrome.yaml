    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ocular damage: glaucoma, keratic precipitates, keratoconus, corneal hydrops, and absorption of the cataractous lens"
    explanation: Documents glaucoma as a delayed ocular manifestation of congenital rubella.
progression:
- phase: Congenital and Neonatal Presentation
  age_range: First-trimester fetal onset with neonatal presentation
  notes: >
    Fetal vulnerability is highest during first-trimester maternal primary rubella
    infection, producing structural embryopathy (cataracts, sensorineural hearing
    impairment, branch pulmonary artery stenosis, patent ductus arteriosus,
    microcephaly) and extended newborn signs (intrauterine growth restriction,
    hepatosplenomegaly, jaundice, thrombocytopenic purpura, and dermal extramedullary
    hematopoiesis).
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The manifestations of congenital rubella syndrome (CRS) can be grouped according to time of onset into newborn, extended, and delayed CRS."
    explanation: Defines the temporal progression of CRS into newborn, extended, and delayed phases.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the fetus is most vulnerable to the rubella virus during the first trimester of pregnancy, due to the lack of immune defense in the developing fetus"
    explanation: Establishes the first trimester as the critical window for congenital onset.
- phase: Delayed-Onset Childhood and Adult Sequelae
  age_range: Late childhood through adulthood
  notes: >
    Years to decades after congenital infection, survivors develop delayed
    manifestations driven by chronic viral persistence, vascular stenosis, and
    autoimmunity, including diabetes mellitus, thyroid disease, growth hormone
    deficiency, late-onset glaucoma, corneal hydrops, and progressive rubella
    panencephalitis.
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delayed manifestations are not present in early life and include the following: endocrinopathies: diabetes, thyroid disease, and growth hormone deficiency"
    explanation: Documents delayed-onset endocrine manifestations emerging after early life.
  - reference: PMID:12463994
    reference_title: "Gregg's congenital rubella patients 60 years later."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of diabetes (22%), thyroid disorders (19%), early menopause (73%) and osteoporosis (12.5%) was increased compared with the Australian population"
    explanation: Demonstrates adult-onset endocrine and metabolic sequelae 60 years after congenital rubella infection.
diagnosis:
- name: Rubella-Specific IgM Serology
  description: >
    Detection of rubella-specific IgM antibody in neonatal or maternal serum is the
    primary serological test for confirming congenital rubella infection or maternal
    primary rubella in pregnancy; because IgM does not cross the placenta, neonatal
    rubella IgM indicates fetal infection, while maternal IgM reactivity in
    low-prevalence settings requires confirmatory testing.
  measurements:
  - preferred_term: Rubella IgM
    term:
      id: LOINC:31616-6
      label: Rubella virus IgM Ab [Presence] in Serum
  notes: >
    The qualitative serum presence code is bound; no numerical reference_ranges apply
    to a qualitative presence assay.
  evidence:
  - reference: PMID:28412379
    reference_title: "Challenges of measles and rubella laboratory diagnostic in the era of elimination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Laboratory investigation heavily relies on specific IgM serology and increasingly on virus detection by reverse transcription (RT)-PCR, but other methods such as IgG avidity testing and genetic characterization of virus strains have gained in importance."
    explanation: Establishes rubella-specific IgM serology as the core laboratory diagnostic method alongside RT-PCR and IgG avidity.
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In case of seroconversion for RV-IgG and/or positive RVIgM during pregnancy, laboratories usually send serum samples to the French National Reference Laboratory (FNRL) for Rubella in order to perform complementary investigations and confirm or exclude rubella infection during pregnancy."
    explanation: Documents maternal rubella IgM and IgG seroconversion testing as the diagnostic trigger for prenatal rubella evaluation.
- name: Maternal Rubella IgG Avidity Testing
  description: >
    Measurement of rubella-specific IgG avidity in maternal serum distinguishes acute
    primary rubella infection (low avidity) from pre-existing immunity or reinfection
    (high avidity) when evaluating congenital rubella risk during pregnancy.
  measurements:
  - preferred_term: Rubella IgG avidity
    term:
      id: LOINC:34421-8
      label: Rubella virus IgG Ab avidity [Ratio] in Serum
  notes: >
    Assay-specific low/high avidity cutoffs vary by commercial kit and eluting agent,
    so no universal reference_ranges are recorded.
  evidence:
  - reference: PMID:33316569
    reference_title: "Positive predictive value of seroconversion or positive rubella IgM in diagnosis of maternal rubella infection: Seven-years review of French National Reference Laboratory for Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional serological tests were performed, mainly immunoblot (to look for the presence of anti-E1 protective antibody) and RV-IgG avidity (to exclude or confirm primary infection)."
    explanation: Confirms the role of rubella IgG avidity testing in confirming or excluding maternal primary infection during pregnancy.
- name: Rubella Virus Reverse Transcription PCR (RT-PCR)
  description: >
    Direct detection of rubella viral RNA by reverse transcription polymerase chain
    reaction (RT-PCR) in clinical specimens provides molecular confirmation of
    infection and enables viral genotyping for epidemiological tracking.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: PMID:21116802
    reference_title: "Detection of measles, mumps, and rubella viruses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Direct detection of viral genomic material using reverse transcription polymerase chain reaction (RT-PCR) methodologies can play an important role for laboratory confirmation of acute infections."
    explanation: Establishes RT-PCR detection of rubella viral RNA for laboratory confirmation.
  - reference: PMID:28412379
    reference_title: "Challenges of measles and rubella laboratory diagnostic in the era of elimination."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Laboratory investigation heavily relies on specific IgM serology and increasingly on virus detection by reverse transcription (RT)-PCR, but other methods such as IgG avidity testing and genetic characterization of virus strains have gained in importance."
    explanation: Confirms the increasing diagnostic role of RT-PCR virus detection and genetic characterization.
treatments:
- name: Pre-Conception and Childhood Live-Attenuated Rubella Vaccination (MMR)
  description: >
    Immunization of children and non-pregnant women of childbearing age with
    live-attenuated rubella-containing vaccine (RA 27/3 strain, typically delivered
    as MMR) induces durable anti-E1 neutralizing IgG antibodies that prevent maternal
    rubella viremia and transplacental transmission, eliminating congenital rubella
    syndrome.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Maternal Rubella Viremia and Transplacental Viral Entry
    treatment_effect: INHIBITS
    description: >-
      Pre-existing vaccine-induced neutralizing antibodies block maternal rubella
      viremia and prevent transplacental viral seeding of the placenta and fetus.
    evidence:
    - reference: PMID:35367004
      reference_title: "Rubella."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Rubella and congenital rubella syndrome can be prevented by rubella-containing vaccines, which are commonly administered in combination with measles vaccine."
      explanation: Establishes that rubella-containing vaccines prevent primary maternal rubella and congenital rubella syndrome.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rubella and congenital rubella syndrome can be prevented by rubella-containing vaccines, which are commonly administered in combination with measles vaccine."
    explanation: Lancet seminar establishing rubella-containing vaccines as the primary means of preventing congenital rubella syndrome.
- name: Multidisciplinary Supportive, Surgical, and Rehabilitative Care
  description: >
    Management of affected infants requires early cataract surgery, cochlear
    implantation or hearing amplification, surgical or catheter-based repair of
    congenital heart defects (transcatheter PDA occlusion, pulmonary artery
    angioplasty), and long-term surveillance for delayed endocrine and
    ophthalmologic sequelae.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:31745134
    reference_title: "Characteristics of Patent Ductus Arteriosus in Congenital Rubella Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reviewed the medical records of patients with CRS who were admitted to the Children's Hospital 1 in Vietnam between December 2010 and December 2012, and patients with CRS who underwent PDA transcatheter occlusion therapy at the cardiology department between December 2009 and December 2015."
    explanation: Documents transcatheter occlusion therapy for patent ductus arteriosus in children with congenital rubella syndrome.
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delayed manifestations are not present in early life and include the following: endocrinopathies: diabetes, thyroid disease, and growth hormone deficiency"
    explanation: Supports long-term multidisciplinary surveillance and supportive care for both congenital and delayed CRS manifestations.

      id: GO:0001525
      label: angiogenesis
  - preferred_term: Defense response to virus
    modifier: INCREASED
    term:
      id: GO:0051607
      label: defense response to virus
  downstream:
  - target: Intrauterine Growth Restriction
    description: Impaired placental endothelial angiogenesis and villous vascular insufficiency restrict fetal nutrient and oxygen delivery, causing low birth weight and intrauterine growth restriction.
  - target: Fetal Cytopathic Apoptosis and Mitotic Inhibition During Organogenesis
    description: Infected placental endothelium facilitates viral shedding into the fetal circulation and systemic fetal organ seeding.
  evidence:
  - reference: GEO:GSE225949
    reference_title: "Rubella virus infection in endothelial cells reduces angiogenesis via interferon betainduced CXCL10"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Endothelial cells (EC) of the placenta are infected by rubella virus (RuV). RuV reduced angiogenic and migratory capacity of primary human EC whereas cell cycle and apoptosis rate were not affected. Next generation sequencing analysis revealed an induction of antiviral type I and III interferons (IFN) that induced angiogenesis-inhibiting cytokines such as CXCL10."
    explanation: Demonstrates that rubella virus infects placental endothelial cells and impairs angiogenesis via type I/III interferon-induced CXCL10.
- name: Fetal Cytopathic Apoptosis and Mitotic Inhibition During Organogenesis
  description: >
    Within infected fetal tissues (developing lens, cochlear organ of Corti, cardiac
    outflow tract, and brain), rubella virus capsid protein binds host protein p32,
    disrupting mitochondrial distribution and morphology, inducing apoptosis, and
    inhibiting cell population proliferation. In the developing brain, rubella virus
    infects microglia within heterogeneous neural environments and provokes a profound
    interferon response in surrounding neurons and neural progenitor cells. This
    arrest of organogenesis produces the classical Gregg triad of congenital
    cataracts, sensorineural deafness, and congenital heart defects as well as
    microcephaly and intellectual disability.
  locations:
  - preferred_term: Lens
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  - preferred_term: Cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  - preferred_term: Heart
    term:
      id: UBERON:0000948
      label: heart
  - preferred_term: Brain
    term:
      id: UBERON:0000955
      label: brain
  cell_types:
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  - preferred_term: Cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Congenital Cataract
    description: Viral invasion and cytopathic apoptosis of embryonic lens fibers arrest lens development and cause congenital nuclear cataract.
  - target: Sensorineural Hearing Impairment
    description: Cytopathic injury to the developing cochlear stria vascularis and organ of Corti causes bilateral or unilateral sensorineural deafness.
  - target: Branch Pulmonary Artery Stenosis
    description: Viral inhibition of arterial wall elastogenesis and endothelial proliferation produces branch pulmonary artery stenosis.
  - target: Patent Ductus Arteriosus
    description: Disruption of ductal arterial smooth muscle and elastic lamina development prevents postnatal closure of the ductus arteriosus.
  - target: Microcephaly
    description: Microglial infection, interferon-mediated neural progenitor perturbation, and mitotic arrest reduce cerebral cortical growth.
  - target: Intellectual Disability
    description: Fetal neurodevelopmental disruption and microglial-neuronal inflammatory signaling cause lifelong cognitive impairment.
  - target: Persistent Viral Persistence and Delayed Autoimmune Endocrinopathy
    description: Chronic viral persistence in fetal tissues seeds long-term tissue injury and delayed autoimmune and ocular sequelae.
  evidence:
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "capsid expression has been reported to cause apoptosis in certain cell types, suggesting that this protein may play a role in the cytopathic effect of the virus"
    explanation: Demonstrates that rubella capsid expression induces apoptosis, explaining cytopathic fetal tissue injury.
  - reference: PMID:16051872
    reference_title: "Interactions between rubella virus capsid and host protein p32 are important for virus replication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The distribution and morphology of mitochondria are dramatically affected during infection with rubella virus (RV)."
    explanation: Demonstrates rubella virus-induced mitochondrial disruption via capsid-p32 interaction.
  - reference: PMID:37327049
    reference_title: "The dangers of rubella virus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that in human brain slices, rubella virus predominantly infects microglia. This infection occurs in a heterogeneous population but not in a highly microglia-enriched monoculture in the absence of other cell types. By using an organoid-microglia model, we further demonstrate that rubella virus infection leads to a profound interferon response in non-microglial cells, including neurons and neural progenitor cells"
    explanation: Demonstrates microglial tropism of rubella virus in human fetal brain models and downstream interferon-driven perturbation of neurons and neural progenitor cells.
- name: Disseminated Fetal Reticuloendothelial Infection and Extramedullary Hematopoiesis
  description: >
    Systemic fetal viremia involves the liver, spleen, bone marrow, and dermis,
    causing reticuloendothelial hyperplasia, cholestatic/hemolytic jaundice,
    megakaryocyte suppression with neonatal thrombocytopenic purpura, and
    compensatory dermal erythropoiesis presenting as "blueberry muffin" skin lesions.
  locations:
  - preferred_term: Liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: Spleen
    term:
      id: UBERON:0002106
      label: spleen
  - preferred_term: Skin
    term:
      id: UBERON:0002097
      label: skin of body
  downstream:
  - target: Hepatosplenomegaly
    description: Disseminated viral replication and reticuloendothelial hyperplasia enlarge the neonatal liver and spleen.
  - target: Dermal Extramedullary Hematopoiesis (Blueberry Muffin Lesions)
    description: Persistent compensatory dermal erythropoiesis produces infiltrative blue-red macules and papules.
  - target: Neonatal Thrombocytopenic Purpura
    description: Viral bone marrow suppression and peripheral platelet consumption cause neonatal purpura.
  - target: Neonatal Jaundice
    description: Hepatic viral involvement and hemolysis produce early neonatal hyperbilirubinemia and jaundice.
  evidence:
  - reference: PMID:35367004
    reference_title: "Rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "congenital rubella syndrome include cataracts, sensorineural hearing impairment, congenital heart disease, jaundice, purpura, hepatosplenomegaly, and microcephaly"
    explanation: Documents the disseminated neonatal manifestations of jaundice, purpura, and hepatosplenomegaly in CRS.
  - reference: PMID:25654000
    reference_title: "Congenital rubella syndrome with blueberry muffin lesions and extensive metaphysitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The baby had blueberry muffin skin lesions, long bone metaphysitis and congenital heart defects."
    explanation: Documents cutaneous extramedullary hematopoiesis (blueberry muffin lesions) in neonatal CRS.
- name: Persistent Viral Persistence and Delayed Autoimmune Endocrinopathy
  description: >
    Chronic persistence of rubella virus in tissues after birth, shortened cellular
    lifespan, progressive vascular damage, and virus-triggered autoimmune responses
    against endocrine organs and ocular structures lead to delayed-onset CRS
    manifestations years to decades later, notably insulin-dependent diabetes
    mellitus, thyroid disorders, and late-onset glaucoma.
  locations:
  - preferred_term: Pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  - preferred_term: Lens
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  biological_processes:
  - preferred_term: Cell population proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Delayed-Onset Diabetes Mellitus
    description: Chronic viral persistence and autoimmune pancreatic islet injury cause delayed-onset diabetes mellitus in childhood or adulthood.
  - target: Congenital or Delayed-Onset Glaucoma
    description: Persistent ocular viral damage and trabecular meshwork injury lead to congenital or delayed-onset glaucoma.
  evidence:
  - reference: PMID:4001724
    reference_title: "Delayed manifestations of congenital rubella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several mechanisms of pathogenesis of the damage have to be considered for the delayed manifestations, including growth of the virus in tissues, resulting in a reduced growth rate and shortened life-span of the cells; autoimmune responses, initially stimulated by the infection; genetic susceptibility; vascular damage by the viral infection with further stenosis or occlusion of the vessels later; reactive hypervascularization; and chronic persistence of the virus in the tissue with subsequent extension of the infection to other areas."
    explanation: Details the mechanisms driving delayed CRS manifestations, including chronic tissue viral persistence, reduced cellular growth rate, vascular damage, and infection-stimulated autoimmunity.
  - reference: PMID:12463994
    reference_title: "Gregg's congenital rubella patients 60 years later."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of diabetes (22%), thyroid disorders (19%), early menopause (73%) and osteoporosis (12.5%) was increased compared with the Australian population"
    explanation: 60-year longitudinal follow-up confirming markedly elevated prevalence of late-onset diabetes and endocrine disorders in CRS survivors.
phenotypes:
- name: Congenital Cataract

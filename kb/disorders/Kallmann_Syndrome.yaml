name: Kallmann Syndrome
creation_date: '2026-06-17T12:00:00Z'
category: Mendelian
description: >-
  Kallmann syndrome is the anosmic form of congenital isolated gonadotropin-releasing
  hormone (GnRH) deficiency, characterized by hypogonadotropic hypogonadism (absent or
  incomplete puberty, low sex steroids, infertility) combined with an impaired sense of
  smell (anosmia or hyposmia). It arises from defective embryonic co-migration of GnRH
  neurons and olfactory axons from the olfactory placode to the forebrain, with associated
  failure of olfactory bulb morphogenesis. Kallmann syndrome is genetically heterogeneous
  and can be inherited in X-linked recessive, autosomal dominant, autosomal recessive, or
  oligogenic patterns. Causal genes include ANOS1/KAL1 (X-linked), FGFR1/KAL2, FGF8,
  PROKR2, PROK2, and CHD7, among others. Anosmia distinguishes Kallmann syndrome from
  normosmic isolated GnRH deficiency, with which it shares a reproductive phenotype.
disease_term:
  preferred_term: Kallmann syndrome
  term:
    id: MONDO:0018800
    label: Kallmann syndrome
parents:
- Hypogonadotropic hypogonadism
- Disorders of puberty
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0009482
      label: hypogonadotropic hypogonadism 3 with or without anosmia
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO splits the prokineticin form of Kallmann syndrome by gene - HH3
      (OMIM:244200, PROKR2) and HH4 (OMIM:610628, PROK2) - while this entry
      curates them as the single `PROKR2_PROK2` subtype, because receptor and
      ligand loss converge on the same insufficient prokineticin signal.
      `subtype_term` is single-valued, so the two MONDO leaves are declared here
      at the disease level instead. Declared narrowMatch rather than exactMatch
      because each MONDO class is narrower than the dismech subtype.
  - term:
      id: MONDO:0012528
      label: hypogonadotropic hypogonadism 4 with or without anosmia
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      The PROK2 (ligand) half of the same split; see the MONDO:0009482
      justification above.
has_subtypes:
- name: ANOS1
  display_name: Kallmann syndrome 1 (X-linked, ANOS1/KAL1)
  subtype_term:
    preferred_term: hypogonadotropic hypogonadism 1 with or without anosmia
    term:
      id: MONDO:0010635
      label: hypogonadotropic hypogonadism 1 with or without anosmia
  description: >-
    X-linked recessive Kallmann syndrome caused by loss-of-function variants in ANOS1
    (formerly KAL1), encoding the extracellular matrix adhesion protein anosmin-1. KAL1
    mutations tend to cause a more severe reproductive phenotype and are distinctively
    associated with unilateral renal agenesis and bimanual synkinesia (mirror movements).
  evidence:
  - reference: PMID:15605412
    reference_title: "Kallmann syndrome: 14 novel mutations in KAL1 and FGFR1 (KAL2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, unilateral renal agenesis and bimanual synkinesia were exclusively found\nassociated with KAL1mutations, cleft palate and dental agenesia with\nFGFR1mutations."
    explanation: A KAL1/FGFR1 cohort distinguishes the KAL1 subtype by renal agenesis and bimanual synkinesia.
- name: FGFR1
  display_name: Kallmann syndrome 2 (FGFR1, KAL2)
  subtype_term:
    preferred_term: hypogonadotropic hypogonadism 2 with or without anosmia
    term:
      id: MONDO:0007844
      label: hypogonadotropic hypogonadism 2 with or without anosmia
  description: >-
    Autosomal dominant Kallmann syndrome caused by loss-of-function variants in FGFR1
    (KAL2), with incomplete penetrance and variable expressivity. May include cleft
    lip/palate and dental agenesis.
  evidence:
  - reference: PMID:12627230
    reference_title: "Loss-of-function mutations in FGFR1 cause autosomal dominant Kallmann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We establish here that loss-of-function mutations in FGFR1 underlie KAL2 whereas a\ngain-of-function mutation in FGFR1 has been shown to cause a form of\ncraniosynostosis."
    explanation: The discovery paper establishes FGFR1 loss-of-function as the cause of KAL2.
- name: PROKR2_PROK2
  display_name: Kallmann syndrome 3/4 (PROKR2 / PROK2)
  review_notes: >-
    Intentionally has no `subtype_term`. This one dismech subtype spans two MONDO
    classes - MONDO:0009482 (HH3, PROKR2) and MONDO:0012528 (HH4, PROK2) - and
    `subtype_term` is single-valued, so binding either alone would silently drop
    the other. Both are declared as disease-level `skos:narrowMatch` mappings
    instead. The advisory `test_subtypes_have_disease_term` warning on this
    subtype is therefore expected, not an omission.
  description: >-
    Kallmann syndrome caused by variants in the prokineticin receptor PROKR2 (KAL3) or its
    ligand prokineticin-2, PROK2 (KAL4). PROKR2 variants occur in heterozygous, homozygous,
    or compound heterozygous states and frequently contribute to oligogenic inheritance.
  evidence:
  - reference: PMID:17054399
    reference_title: "Kallmann syndrome: mutations in the genes encoding prokineticin-2 and prokineticin receptor-2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we took a \ncandidate gene strategy and identified ten and four different point mutations in \nthe genes encoding the G protein-coupled prokineticin receptor-2 (PROKR2) and \none of its ligands, prokineticin-2 (PROK2), respectively."
    explanation: Establishes PROKR2 and PROK2 as Kallmann syndrome genes.
- name: FGF8
  display_name: Kallmann syndrome 6 (FGF8)
  subtype_term:
    preferred_term: hypogonadotropic hypogonadism 6 with or without anosmia
    term:
      id: MONDO:0012988
      label: hypogonadotropic hypogonadism 6 with or without anosmia
  description: >-
    Kallmann syndrome / GnRH deficiency caused by variants in FGF8, the principal ligand for
    FGFR1 in GnRH neuron ontogeny; reduced FGF8 signaling impairs GnRH neuron development.
  evidence:
  - reference: PMID:18596921
    reference_title: "Decreased FGF8 signaling causes deficiency of gonadotropin-releasing hormone in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While loss-of-function mutations in FGF receptor 1 (FGFR1) cause human GnRH deficiency, to date no specific ligand for FGFR1 has been identified in GnRH neuron ontogeny."
    explanation: Establishes the FGF8-FGFR1 ligand-receptor axis underlying this subtype.
- name: CHD7
  display_name: Kallmann syndrome 5 (CHD7)
  subtype_term:
    preferred_term: hypogonadotropic hypogonadism 5 with or without anosmia
    term:
      id: MONDO:0012880
      label: hypogonadotropic hypogonadism 5 with or without anosmia
  description: >-
    Kallmann syndrome caused by heterozygous CHD7 variants, overlapping mechanistically with
    CHARGE syndrome. Isolated Kallmann syndrome / IHH can represent a milder allelic variant
    of CHARGE syndrome.
  evidence:
  - reference: PMID:18834967
    reference_title: "Mutations in CHD7, encoding a chromatin-remodeling protein, cause idiopathic hypogonadotropic hypogonadism and Kallmann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hypothesized that CHD7 would be \ninvolved in the pathogenesis of IHH and KS (IHH/KS) without the CHARGE phenotype \nand that IHH/KS represents a milder allelic variant of CHARGE syndrome."
    explanation: Establishes CHD7 as a Kallmann syndrome gene and its allelic relationship to CHARGE.
- name: SPRY4
  display_name: Hypogonadotropic hypogonadism 17 (SPRY4)
  subtype_term:
    preferred_term: hypogonadotropic hypogonadism 17 with or without anosmia
    term:
      id: MONDO:0014102
      label: hypogonadotropic hypogonadism 17 with or without anosmia
  description: >-
    GnRH deficiency associated with heterozygous variants in SPRY4, which encodes
    Sprouty4, an intracellular antagonist of FGF/RAS-ERK signalling and therefore a
    negative modulator of the same FGF8-FGFR1 axis that the ANOS1, FGFR1 and FGF8
    subtypes act on. Unlike those three, SPRY4 is not established as a
    self-sufficient cause: it was identified in an FGF-pathway candidate screen,
    its variants are usually reported alongside a second or third locus, and no
    ClinGen gene-disease validity assertion exists. GenCC submitters classify the
    SPRY4-HH17 relationship as Limited to Moderate and Genomics England PanelApp
    lists SPRY4 as amber (not green-listed for routine diagnostic reporting) on
    both its hypogonadotropic hypogonadism panels. Curated here as a contributory
    subtype rather than as an independent disease entry for that reason.

    Two scope caveats. First, the MONDO label is "with or without anosmia" and a
    minority of reported carriers are normosmic, so the concept is slightly wider
    than the anosmic form this entry is scoped to; MONDO nonetheless classifies
    all eighteen numbered "HHn with or without anosmia" terms as children of
    Kallmann syndrome, and this binding follows that classification rather than
    inventing a different one. Second, apparently isolated SPRY4 findings do
    occur - one reported case carried a single heterozygous SPRY4 variant with no
    second hit across a 28-gene panel - so the oligogenic framing describes the
    typical reported architecture, not an established requirement.
  genes:
  - preferred_term: SPRY4
    term:
      id: hgnc:15533
      label: SPRY4
  inheritance:
  - name: Oligogenic inheritance (SPRY4)
    inheritance_term:
      preferred_term: Oligogenic inheritance
      term:
        id: HP:0010983
        label: Oligogenic inheritance
    description: >-
      SPRY4 variants are typically reported as one contributing locus among two or
      three rather than as a self-sufficient cause. Oligogenic rather than digenic
      is the right term because the published combinations include trigenic ones
      (PROKR2/SPRY4/NSMF) as well as two-locus ones, and because the founding
      cohort frames the FGF-pathway genes as contributors to an architecture
      rather than as a defined two-locus requirement.
    evidence:
    - reference: PMID:23643382
      reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mutations in genes encoding components of the FGF pathway are associated with complex modes of CHH inheritance and act primarily as contributors to an oligogenic genetic architecture underlying CHH."
      explanation: The cohort that first reported SPRY4 in CHH concludes that FGF-pathway genes act primarily as contributors to an oligogenic architecture.
    - reference: PMID:35316923
      reference_title: New findings in oligogenic inheritance of congenital hypogonadotropic hypogonadism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here we report the identification of new oligogenic variants in SPRY4/SEMA3A, SRA1/SEMA7A, CHD7/SEMA7A, CCDC141/POLR3B/POLR3B, and PROKR2/SPRY4/NSMF."
      explanation: Names the specific two-locus (SPRY4/SEMA3A) and three-locus (PROKR2/SPRY4/NSMF) combinations that make oligogenic, not digenic, the correct term here.
    - reference: PMID:31781046
      reference_title: A Rare SPRY4 Gene Mutation Is Associated With Anosmia and Adult-Onset Isolated Hypogonadotropic Hypogonadism.
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "No other variants in the 27 remaining loci were identified by NGS."
      explanation: >-
        Counter-evidence to obligate oligogenicity, kept on the block it argues against
        rather than only in prose. In this case the SPRY4 variant was the sole finding, so
        a second locus is not required for the phenotype to appear. It weakens rather than
        overturns the oligogenic reading, because the panel covered 28 loci and a second
        hit outside them would not have been seen.
  evidence:
  - reference: PMID:23643382
    reference_title: "Mutations in FGF17, IL17RD, DUSP6, SPRY4, and FLRT3 are identified in individuals with congenital hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Except for FGF18 and SPRY2, all other genes were found to be mutated in CHH individuals: FGF17 (n = 3 individuals), IL17RD (n = 8), DUSP6 (n = 5), SPRY4 (n = 14), and FLRT3 (n = 3)."
    explanation: The report that established SPRY4 as a CHH gene, finding variants in 14 individuals in a screen of FGF-pathway modulators.
  - reference: PMID:32389901
    reference_title: "Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DUSP6 alone seem sufficient to cause IHH in an autosomal dominant manner, whereas IL17RD or SPRY4 mutations may cause IHH phenotypes in synergy with variants in other IHH-associated genes."
    explanation: An independent cohort separates SPRY4 from DUSP6 on exactly the point at issue, concluding SPRY4 acts in synergy with other loci rather than alone.
  - reference: PMID:40034250
    reference_title: "PROKR2 mutations and SPRY4 variants with uncertain significance in a Kallmann syndrome family: Incomplete penetrance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genotyping results indicated PROKR2 mutations and SPRY4 variants of uncertain significance, which might be incompletely penetrant in this family."
    explanation: A family in which the SPRY4 variant was carried by two unaffected relatives, supporting the contributory-and-incompletely-penetrant reading rather than a causal one.
  - reference: PMID:31781046
    reference_title: A Rare SPRY4 Gene Mutation Is Associated With Anosmia and Adult-Onset Isolated Hypogonadotropic Hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No other variants in the 27 remaining loci were identified by NGS."
    explanation: The counterweight, recorded so the oligogenic framing is not overstated - in this case the SPRY4 variant was the only finding across the panel tested.
inheritance:

- name: SPRY4 variants
  association: Susceptibility
  relationship_type: SUSCEPTIBILITY
  subtype: SPRY4
  gene_term:
    preferred_term: SPRY4
    term:
      id: hgnc:15533
      label: SPRY4
  notes: >-
    SPRY4 encodes Sprouty4, an intracellular antagonist of receptor tyrosine kinase
    signalling that restrains FGFR1-driven MAPK/ERK activation. The naive reading -
    that losing an antagonist raises FGF signalling - points the wrong way for this
    disease, because Kallmann syndrome is a DECREASED-FGFR1-signalling disorder. The
    published functional work points the other way. Two Kallmann-reported Sprouty4
    substitutions - S241Y and K177R - have each been characterised as HYPERACTIVE
    inhibitors, suppressing migration, proliferation and serum- or FGF-induced ERK
    activation where wild-type Sprouty4 does not, and S241Y does so selectively for
    FGF rather than EGF signalling. Gain of inhibitory function in the antagonist
    therefore converges on the same decreased FGFR1 signalling node as FGFR1 and FGF8
    loss of function, which is why this subtype needs no separate pathograph.

    `relationship_type: SUSCEPTIBILITY` rather than `CAUSATIVE` is deliberate. There
    is no ClinGen gene-disease validity assertion for SPRY4; GenCC submitters
    classify it Limited to Moderate, and Genomics England PanelApp lists it amber on
    both hypogonadotropic hypogonadism panels. The reported architecture is
    contributory - usually a second or third locus alongside - which is what the
    SUSCEPTIBILITY value describes.
  evidence:
  - reference: PMID:33670044
    reference_title: A Sprouty4 Mutation Identified in Kallmann Syndrome Increases the Inhibitory Potency of the Protein towards FGF and Connected Processes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "these data emphasize that like the other mutations associated with Kallmann syndrome the described Spry4 mutation creates a hyperactive version of a selective inhibitory molecule and can thereby contribute to a weakened FGF signaling."
    explanation: States the gain-of-inhibition reading directly for the S241Y allele, and is the reason this subtype is modelled as converging on decreased FGFR1 signalling rather than as a loss of FGF restraint.
  - reference: PMID:33670044
    reference_title: A Sprouty4 Mutation Identified in Kallmann Syndrome Increases the Inhibitory Potency of the Protein towards FGF and Connected Processes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Spry4 gains the capability of inhibiting FGF, but not epithelial growth factor (EGF)-induced signaling as a consequence of the tyrosine substitution."
    explanation: The inhibition gained by the variant is FGF-selective rather than a general dampening of receptor tyrosine kinase signalling, which is what makes it disease-relevant here.
  - reference: PMID:40806483
    reference_title: The Lysine at Position 177 Is Essential to Limit the Inhibitory Capacities of Sprouty4 Protein in Normal and Cancer-Derived Cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "The inhibition of these processes was accompanied by lower relative phospho-extracellular-signal-regulated kinases (pERK) levels in response to serum induction, indicating that activation of MAPK was less efficient."
    explanation: Shows the Kallmann-associated Sprouty4 K177R protein reduces ERK activation, the gain-of-inhibition step that reconciles an antagonist variant with a decreased-FGFR1-signalling disease.
  - reference: PMID:40806483
    reference_title: The Lysine at Position 177 Is Essential to Limit the Inhibitory Capacities of Sprouty4 Protein in Normal and Cancer-Derived Cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "This mutation was found in two independent studies, and in both cases associated with the Kallmann syndrome"
    explanation: Establishes that the variant tested in that functional work is one reported in Kallmann syndrome patients, not an arbitrary substitution.
  - reference: PMID:40806483
    reference_title: The Lysine at Position 177 Is Essential to Limit the Inhibitory Capacities of Sprouty4 Protein in Normal and Cancer-Derived Cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockout mice of Spry1, Spry2 and Spry4 show characteristic phenotypes often similar to the one observed with FGF overdose"
    explanation: >-
      The independent argument that simple SPRY4 loss of function is the wrong reading for
      this disease. Deleting the antagonist in mouse produces an FGF-EXCESS phenotype, the
      opposite direction from the decreased FGFR1 signalling Kallmann syndrome requires, so
      the human variants have to be doing something other than abolishing Sprouty4.
  - reference: PMID:32389901
    reference_title: "Prevalence and associated phenotypes of DUSP6, IL17RD and SPRY4 variants in a large Chinese cohort with isolated hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One rare SPRY4 variant (p.T68S) was found in a female patient with Kallmann syndrome who also carried a PLXNA1 mutation."
    explanation: A worked instance of the contributory pattern - the SPRY4 carrier in this cohort also carried a variant at a second IHH locus.

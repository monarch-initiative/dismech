discussions:
- discussion_id: spry4_gain_of_inhibition_not_shown_in_gnrh_neurons
  prompt: >-
    Does the gain-of-inhibition behaviour of Kallmann-associated Sprouty4 variants
    hold in GnRH neurons and olfactory placode-derived cells, or only in the
    mesenchymal and cancer-derived lines it has been tested in?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - has_subtypes#SPRY4
  - genetic#SPRY4 variants
  - pathophysiology#Defective GnRH neuron and olfactory axon migration
  rationale: >-
    The mechanism that makes SPRY4 coherent as a Kallmann gene - a variant antagonist
    that inhibits FGFR1/ERK output more strongly than wild-type - rests on ectopic
    expression in lung fibroblasts, osteosarcoma cells and lung cancer lines. The
    same paper reports that the direction of effect is cell-type dependent: in the
    lung cancer lines both wild-type and variant Sprouty4 inhibited proliferation,
    and the variant's advantage appeared only where FGFR1 was highly expressed. The
    disease-relevant cell, the migrating GnRH neuron, has not been tested, so
    whether the effect size or even the sign carries over is unknown. This is a
    model-fidelity question rather than an absence of evidence, which is why it is
    recorded as HUMAN_MODEL_MISMATCH and not KNOWLEDGE_GAP.
  evidence:
  - reference: PMID:40806483
    reference_title: The Lysine at Position 177 Is Essential to Limit the Inhibitory Capacities of Sprouty4 Protein in Normal and Cancer-Derived Cells.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "In contrast to the situation in these cells of mesenchymal origin, in lung cancer-derived cell lines both variants of Spry4 were able to interfere with proliferation of tested cells"
    explanation: The authors' own cell-type contrast is the mismatch - the variant-specific effect is not reproduced across the lines tested, and no GnRH-neuron model was used.

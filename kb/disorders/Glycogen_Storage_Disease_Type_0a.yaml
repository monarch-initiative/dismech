  phenotype_term:
    preferred_term: Hyperlipidemia
    term:
      id: HP:0003077
      label: Hyperlipidemia
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucose and other sugars taken up by the liver in GSD0 are shunted into
      the glycolytic pathway leading to postprandial hyperlactatemia and
      hyperlipidemia
    explanation: >-
      Names hyperlipidemia as a downstream consequence of the glycolytic shunt,
      alongside the lactate rise.
- category: Constitutional
  name: Fatigue and Early-Morning Symptoms
  description: >-
    Early-morning drowsiness, pallor, vomiting and fatigue - the symptomatic

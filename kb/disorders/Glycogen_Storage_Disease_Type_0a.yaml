- name: Postprandial Hyperglycemia with Lactic Acidemia
  biological_scale: ORGANISM
  description: >-
    After a carbohydrate meal, blood glucose rises abnormally and lactate rises
    with it. Both directions of the day are thus abnormal in opposite ways,
    which is why single fasting or single random measurements mislead: a fed
    sample looks like early diabetes mellitus, a fasted sample looks like
    idiopathic ketotic hypoglycemia, and only the pair identifies the disease.
  evidence:
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although feeding relieves symptoms, it often results in postprandial
      hyperglycemia and hyperlactatemia.
    explanation: >-
      Records the paradox at the centre of this node - the treatment for the
      fasted state produces the fed-state abnormality.
  - reference: PMID:23426827
    reference_title: >-
      Mutational analysis of the GYS2 gene in patients diagnosed with ketotic
      hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient presented with fasting ketotic hypoglycaemia associated with
      postprandial hyperglycaemia and elevated lactate level.
    explanation: >-
      A genetically confirmed patient in whom the fed and fasted abnormalities
      were documented together.
  downstream:
  - target: Diurnal Glycemic Oscillation
    causal_link_type: DIRECT
    description: The fed peak of the daily swing.
  - target: Renal Glucose Spillover
    causal_link_type: DIRECT
    description: >-
      Postprandial glucose exceeding the renal threshold appears in the urine.
  - target: Postprandial Hyperglycemia
    causal_link_type: DIRECT
    description: The clinical manifestation of the fed state.
  - target: Postprandial Hyperlactatemia
    causal_link_type: DIRECT
    description: The lactate arm of the same fed-state abnormality.
- name: Renal Glucose Spillover
  biological_scale: ORGANISM
  description: >-
    Postprandial glucose high enough to exceed the renal tubular reabsorption
    threshold produces glucosuria with normal kidneys. This is the step that
    makes GSD 0a reachable from a dipstick abnormality rather than from a
    hypoglycemia workup, and it is why the disease has been picked up during
    evaluation of apparent early diabetes.
  evidence:
  - reference: PMID:12072888
    reference_title: >-
      Glycogen synthase deficiency (glycogen storage disease type 0) presenting
      with hyperglycemia and glucosuria: report of three new mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two children with GSD0, confirmed by mutation analysis, who
      had glucosuria and hyperglycemia.
    explanation: >-
      Documents glucosuria co-occurring with hyperglycemia in molecularly
      confirmed patients, which is the observation this node explains.
  downstream:
  - target: Glycosuria
    causal_link_type: DIRECT
    description: Glucose above the renal threshold appears in the urine.
- name: Diurnal Glycemic Oscillation
  biological_scale: ORGANISM
  description: >-
    The integrating node, and the diagnostic signature of the disease. Because
    the liver can neither store glucose when fed nor release it when fasted,
    glycemia swings across the day between postprandial hyperglycemia with
    lactic acidemia and fasting ketotic hypoglycemia, instead of being buffered
    flat. Continuous or serial glucose monitoring shows daily fluctuation
    between the two poles; neither pole alone is specific, and it is the
    oscillation that is.
  evidence:
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucose monitoring in both patients revealed daily fluctuations from
      fasting hypoglycemia to postprandial hyperglycemia and lactic acidemia.
    explanation: >-
      Directly documents the daily oscillation, including its lactate component,
      by serial monitoring in two siblings.
  - reference: PMID:18341095
    reference_title: The variable clinical phenotype of liver glycogen synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glucose monitoring in both patients revealed daily fluctuations from
      fasting hypoglycemia to postprandial hyperglycemia.
    explanation: >-
      An independent pair of patients showing the same daily swing, from the
      earlier report by the same group.
  - reference: PMID:33473338
    reference_title: >-
      Three successful pregnancies in a patient with glycogen storage disease
      type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is clinically characterized by ketotic fasting hypoglycemia
      in combination with postprandial hyperglycemia and hyperlactatemia.
    explanation: >-
      States the combination as the defining clinical characterisation, not as a
      coincidence of two findings.
phenotypes:
- category: Metabolic
  name: Ketotic Hypoglycemia
  description: >-
    Fasting hypoglycemia accompanied by ketosis, emerging on the overnight fast
    once night feeds are dropped. The accompanying lactate is low, not high,
    which is the feature that separates it from the hypoglycemia of GSD I.
    Fasting tolerance generally improves with age.
  phenotype_term:
    preferred_term: Ketotic hypoglycemia
    term:
      id: HP:0012734
      label: Ketotic hypoglycemia
    temporality: NOCTURNAL
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fasting hypoglycemia and ketonuria are universal in children less than 5
      years of age
    explanation: >-
      A universal finding in the under-fives supports a VERY_FREQUENT band; the
      qualifier is set to NOCTURNAL because the episodes are described as
      overnight, appearing when night feeds stop.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most children over 7 years of age tolerate a typical overnight fast
      without development of hypoglycemia, and fasting for up to 18 hours has
      been reported in teenagers.
    explanation: >-
      Records the age-dependence, which qualifies the frequency band: it applies
      to young children, not to the whole lifespan.
- category: Metabolic
  name: Postprandial Hyperglycemia
  description: >-
    Blood glucose rises abnormally after a carbohydrate meal because the liver
    cannot clear the load into glycogen. The finding is easily read as early
    diabetes mellitus, and children have been referred for exactly that.
  phenotype_term:
    preferred_term: Postprandial hyperglycemia
    term:
      id: HP:0011998
      label: Postprandial hyperglycemia
    temporality: DIURNAL
  frequency: FREQUENT
  evidence:
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen storage disease type 0 (GSD 0) is an autosomal recessive disorder
      of glycogen metabolism caused by mutations in the GYS2 gene manifesting in
      infancy or early childhood and characterized by ketotic hypoglycemia after
      prolonged fasting, and postprandial hyperglycemia and hyperlactatemia.
    explanation: >-
      Lists postprandial hyperglycemia among the characterising features, in the
      same sentence that pairs it with the fasting abnormality.
  - reference: PMID:18341095
    reference_title: The variable clinical phenotype of liver glycogen synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second patient presented at 14 months with asymptomatic incidental
      hyperglycemia.
    explanation: >-
      A patient whose presenting abnormality was the fed-state one, showing that
      hyperglycemia can be the entry point rather than a secondary detail.
- category: Metabolic
  name: Postprandial Hyperlactatemia
  description: >-
    Lactate rises AFTER meals, not during fasting. The temporal direction is the
    whole discriminating value: GSD I produces fasting lactic acidosis from a
    gluconeogenic block, while here fasting lactate is low and the rise is
    confined to the fed state.
  phenotype_term:
    preferred_term: Postprandial hyperlactatemia
    term:
      id: HP:0011997
      label: Postprandial hyperlactemia
    temporality: DIURNAL
  frequency: FREQUENT
  evidence:
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although feeding relieves symptoms, it often results in postprandial
      hyperglycemia and hyperlactatemia.
    explanation: >-
      Ties the lactate rise specifically to feeding, which is what the
      postprandial qualifier encodes.
  - reference: PMID:23426827
    reference_title: >-
      Mutational analysis of the GYS2 gene in patients diagnosed with ketotic
      hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of the GYS2 gene is more likely to be positive in patients with
      fasting ketotic hypoglycaemia and concomitant postprandial hyperglycaemia
      with hyperlactataemia.
    explanation: >-
      Gives the finding diagnostic weight: postprandial hyperlactataemia is what
      raises the pre-test probability of a GYS2 result.
- category: Renal
  name: Glycosuria
  description: >-
    Glucose in the urine when postprandial glycemia exceeds the renal threshold,
    with structurally normal kidneys. Reported as a presenting abnormality, and
    the reason the disease belongs in the differential of unexplained glucosuria
    as well as of ketotic hypoglycemia.
  phenotype_term:
    preferred_term: Glycosuria
    term:
      id: HP:0003076
      label: Glycosuria
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:12072888
    reference_title: >-
      Glycogen synthase deficiency (glycogen storage disease type 0) presenting
      with hyperglycemia and glucosuria: report of three new mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two children with GSD0, confirmed by mutation analysis, who
      had glucosuria and hyperglycemia.
    explanation: >-
      Two molecularly confirmed children with glucosuria; the band is set
      OCCASIONAL because these are reported as an unusual presentation within a
      literature of fewer than thirty cases.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD0 should be considered in any child with asymptomatic hyperglycemia or
      glucosuria.
    explanation: >-
      Independently endorses glucosuria as an entry point to the diagnosis.
- category: Metabolic
  name: Ketonuria
  description: >-
    Ketone bodies in the urine during fasting, described as universal in
    children under five and the basis for home urine-ketone screening.
  phenotype_term:
    preferred_term: Ketonuria
    term:
      id: HP:0002919
      label: Ketonuria
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fasting hypoglycemia and ketonuria are universal in children less than 5
      years of age
    explanation: >-
      A universal finding in the under-fives supports the VERY_FREQUENT band for
      that age group.
- category: Neurologic
  name: Hypoglycemic Seizures
  description: >-
    Seizures during a severe hypoglycemic episode. Explicitly described as rare,
    but they have been the presenting event in reported children, so the low
    frequency does not make them clinically unimportant.
  phenotype_term:
    preferred_term: Hypoglycemic seizures
    term:
      id: HP:0002173
      label: Hypoglycemic seizures
  frequency: VERY_RARE
  evidence:
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seizures associated with low blood glucose may also occur, but they are
      rare.
    explanation: >-
      States both the occurrence and the rarity, which is the basis for the
      VERY_RARE band.
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first patient presented at the 4 years of age with recurrent

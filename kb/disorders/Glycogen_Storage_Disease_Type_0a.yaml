- name: Gluconeogenic Substrate Limitation on Prolonged Fasting
  biological_scale: ORGANISM
  description: >-
    An amplifying loop that explains why a fast that is tolerated for hours can
    decompensate abruptly. Severe hyperketonemia and elevated free fatty acids
    suppress alanine release from skeletal muscle; alanine is the principal
    gluconeogenic precursor, and gluconeogenesis is the only remaining route to
    hepatic glucose output. The compensation that keeps this disease mild is
    therefore self-limiting.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With more prolonged fasting, however, severe hyperketonemia and free fatty
      acid elevation inhibit release of alanine from skeletal muscle leading to
      decreased gluconeogenic precursors and worsening hypoglycemia.
    explanation: >-
      Describes the loop end to end - ketones and fatty acids suppressing
      alanine release, precursor supply falling, hypoglycemia worsening.
- name: Postprandial Shunting of Ingested Glucose into Glycolysis
  biological_scale: CELLULAR
  description: >-
    The fed half of the disease, and the part that is most often misread. A
    substantial fraction of dietary carbohydrate is normally parked in hepatic
    glycogen; with that sink removed, glucose and other sugars taken up by the
    liver are diverted into glycolysis. The liver therefore converts a meal into
    lactate instead of into stored polymer.

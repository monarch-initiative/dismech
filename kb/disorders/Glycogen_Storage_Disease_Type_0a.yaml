name: Glycogen Storage Disease Type 0a
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
synonyms:
- GSD 0a
- GSD type 0a
- hepatic glycogen synthase deficiency
- liver glycogen synthase deficiency
- glycogen storage disease type 0, liver
- glycogen storage disease due to hepatic glycogen synthase deficiency
- glycogenosis type 0a
- aglycogenosis
description: >-
  Glycogen storage disease type 0a is an autosomal recessive disorder of hepatic
  glycogen metabolism caused by biallelic GYS2 variants that abolish liver
  glycogen synthase, the enzyme that elongates the glycogen chain. It is the
  inverse of every other glycogenosis and is only conventionally counted among
  them: the lesion is on the synthesis side, so the liver cannot lay glycogen
  down in the first place and hepatic glycogen content is markedly DECREASED
  rather than increased. Two clinical consequences follow directly, and neither
  matches the classical hepatic-GSD picture. There is no hepatomegaly - the one
  GSD in which the liver is not enlarged, because there is no stored material to
  enlarge it. And the metabolic abnormality is not a single fasting derangement
  but a swing across the day: fasting produces ketotic hypoglycemia with LOW
  lactate and low alanine, because gluconeogenesis and fatty-acid oxidation are
  intact and are doing all the work, while feeding produces postprandial
  HYPERglycemia with lactic acidemia and sometimes glucosuria, because ingested
  glucose that cannot be stored as glycogen is shunted into glycolysis instead.
  That diurnal fed/fasted oscillation, in a child with a normal-sized liver, is
  the diagnostic signature; the pattern is easily mistaken for early diabetes
  mellitus in the fed state and for idiopathic ketotic hypoglycemia in the
  fasted state, which is the mechanism of the disease's documented
  underdiagnosis. Fasting tolerance generally improves with age and the
  long-term prognosis is comparatively good, with none of the hepatic adenoma,
  cirrhosis or renal disease seen in the storage-side glycogenoses; short
  stature and osteopenia are the recognised chronic features. Management is
  entirely dietary - frequent protein-rich feeds by day and uncooked cornstarch
  at bedtime - and works precisely because gluconeogenesis is intact.

    explanation: >-
      A reported child in whom recurrent hypoglycemic seizures were the
      presenting problem, showing the rare event can still be the entry point.
- category: Growth
  name: Short Stature
  description: >-
    One of the two recognised chronic features of the disease, alongside
    osteopenia. Notably, the storage-side long-term complications - hepatic
    adenoma, cirrhosis, renal disease - are not reported here.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: FREQUENT
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short stature and osteopenia are common features, but other long-term
      complications, common in other types of GSD, have not been reported in
      GSD0.
    explanation: >-
      Grades short stature as common, which maps to the FREQUENT band, and in
      the same sentence records the absence of the other GSD complications.
- category: Musculoskeletal
  name: Osteopenia
  phenotype_term:
    preferred_term: Osteopenia
    term:
      id: HP:0000938
      label: Osteopenia
  frequency: FREQUENT
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of

      label: Autosomal recessive inheritance
  description: >-
    Biallelic GYS2 variants. Reported alleles span nonsense, frameshift, splice
    and missense changes, and affected children are homozygous or compound
    heterozygous; heterozygous carriers are clinically unaffected.
  evidence:

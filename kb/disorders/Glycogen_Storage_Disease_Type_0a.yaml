    snippet: >-
      Glucose and other sugars taken up by the liver in GSD0 are shunted into
      the glycolytic pathway leading to postprandial hyperlactatemia and
      hyperlipidemia
    explanation: >-
      Names the shunt itself and both of its measurable consequences, lactate
      and lipid.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT

      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen synthase deficiency, also known as glycogenosis (GSD) type 0 is
      an inborn error of glycogen metabolism caused by mutations in the GYS2
      gene, which is transmitted in an autosomal recessive trait.
    explanation: States the causal gene and the autosomal recessive transmission.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD0 is caused by mutations in the GYS2 gene located on chromosome 12p12.2
      and is inherited in an autosomal recessive manner.
    explanation: >-
      Independently states the inheritance mode together with the gene's
      chromosomal location.
genetic:
- name: GYS2
  gene_term:
    preferred_term: GYS2
    term:
      id: hgnc:4707
      label: GYS2
  association: >-
    Biallelic loss-of-function variants in GYS2, which encodes the liver isoform
    of glycogen synthase, cause GSD 0a. Linkage to the GYS2 locus was
    established in five families and confirmed by expression of the mutant
    enzymes, and the allelic spectrum has widened steadily since - from sixteen
    reported mutations in 2010 to a further seven novel variants in a single
    2020 next-generation-sequencing cohort. GYS1, the muscle isoform, causes a
    separate disease (GSD 0b) and is not involved here.
  evidence:
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, the results demonstrate that GSD-0 is caused by different
      mutations in the GYS2 gene.
    explanation: >-
      The gene-discovery study's own conclusion, establishing GYS2 as the causal
      gene through linkage plus mutation screening in nine affected children.
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of the mutated enzymes in COS7 cells indicated severely
      impaired GS activity.
    explanation: >-
      Functional confirmation in a heterologous expression system that the
      identified alleles are loss-of-function, separate from the genetic
      association itself.
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hepatic glycogen synthase is encoded by GYS2 (MIM 138571) located on
      12p12.2 and contains 16 exons spanning over 30 kb of genomic DNA.
    explanation: Gene structure and locus for the hepatic isoform specifically.
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current results expand the spectrum of known mutations in GYS2 and
      suggest that phenotypes of GSD 0 are more variable and less specific than
      the reported ones.
    explanation: >-
      A caveat worth curating alongside the allelic spectrum: the phenotype
      attached to a GYS2 genotype is less specific than the early case reports
      implied, so genotype does not predict presentation.
pathophysiology:
- name: Hepatic Glycogen Synthase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic GYS2 loss of function removes the liver isoform of glycogen
    synthase, the enzyme that transfers glucose from UDP-glucose onto the
    growing alpha-1,4 chain. This is the synthesis-side counterpart of the
    phosphorylase lesion in GSD VI: the same polymer, the opposite direction of
    the reaction, and therefore the opposite tissue consequence. Liver enzyme
    activity in affected children is extremely low or unmeasurable.
  genes:
  - preferred_term: GYS2
    term:
      id: hgnc:4707
      label: GYS2
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss-of-function alleles, confirmed functionally by
      severely impaired activity of the mutant enzymes expressed in COS7 cells.
  molecular_functions:
  - preferred_term: liver glycogen synthase activity
    term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    modifier: LOSS_OF_FUNCTION
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Type 0 glycogen storage disease (GSD0) is caused by deficiency of the
      hepatic isoform of glycogen synthase.
    explanation: >-
      Names the enzymatic lesion and, importantly, its isoform - the hepatic
      one, not the muscle isoform whose deficiency is a different disease.
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GS activity in the liver of the affected children was extremely low or
      nil, resulting in subnormal glycogen content.
    explanation: >-
      Measures the enzyme deficiency directly in liver tissue and states its
      immediate consequence for glycogen content.
  downstream:
  - target: Failure of Hepatic Glycogen Synthesis
    causal_link_type: DIRECT
    description: >-
      Loss of the elongating enzyme blocks the glycogen biosynthetic pathway in
      hepatocytes.
    evidence:
    - reference: PMID:26937415
      reference_title: >-
        Pediatric patient with hyperketotic hypoglycemia diagnosed with glycogen
        synthase deficiency due to the novel homozygous mutation in GYS2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glycogen synthase deficiency (glycogen storage disease 0 - GSD 0) caused
        by mutations in the GYS2 gene is characterized by a lack of glycogen
        synthesis in the liver.
      explanation: >-
        States the edge itself: the GYS2 lesion is what produces absent hepatic
        glycogen synthesis.
- name: Failure of Hepatic Glycogen Synthesis
  biological_scale: CELLULAR
  description: >-
    Hepatocytes cannot polymerise incoming glucose into glycogen. Two
    consequences branch from this one node, and holding both in view is what
    makes the disease legible: the liver has no glycogen reserve to draw on when
    fasting, and it has nowhere to put dietary glucose when fed. Everything
    downstream is one of those two branches.
  biological_processes:
  - preferred_term: hepatic glycogen biosynthetic process
    term:
      id: GO:0005978
      label: glycogen biosynthetic process
    modifier: DECREASED
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the other GSDs that are associated with glycogen
      accumulation, GSD 0 is characterized by an extremely low amount of
      glycogen in hepatocytes.
    explanation: >-
      States the cellular consequence and, in the same sentence, its inversion
      of the rest of the glycogenoses.
  downstream:
  - target: Depleted Hepatic Glycogen Reserve
    causal_link_type: DIRECT
    description: >-
      With synthesis blocked and degradation intact, hepatocyte glycogen content
      falls below normal instead of accumulating.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to all other types of glycogenoses, which are characterized
        by increased glycogen storage, deficiency of glycogen synthase causes a
        marked decrease in liver glycogen content.
      explanation: >-
        Directly evidences this edge - the enzyme deficiency causing decreased,
        not increased, liver glycogen.
  - target: Postprandial Shunting of Ingested Glucose into Glycolysis
    causal_link_type: DIRECT
    description: >-
      Dietary glucose taken up by the liver cannot be routed to glycogen, so it
      enters the glycolytic pathway instead.
    evidence:
    - reference: PMID:32395408
      reference_title: >-
        Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
        seven novel variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Postprandial hyperglycemia and hyperlactatemia develop due to the
        conversion of meal-derived carbohydrates to lactate, as glucose cannot
        be converted to glycogen.
      explanation: >-
        States the causal step explicitly: because glycogen synthesis is
        unavailable, meal-derived carbohydrate goes to lactate.
- name: Depleted Hepatic Glycogen Reserve
  biological_scale: TISSUE
  description: >-
    The liver holds subnormal glycogen. Note the calibration: the classic
    descriptions say markedly decreased rather than absent, and the original
    linkage study reported the content as only moderately decreased despite
    enzyme activity being nil - residual glycogen presumably reflects other
    minor routes of glucosyl transfer, so "no glycogen at all" would overstate
    it. The functional point is that the reserve is too small to buffer a fast,
    and too small to enlarge the organ.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:9691087
    reference_title: >-
      Mutations in the liver glycogen synthase gene in children with
      hypoglycemia due to glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The glycogen synthase (GS) activity has been low or immeasurable in liver
      biopsies, whereas the liver glycogen content has been only moderately
      decreased.
    explanation: >-
      The calibrating observation for this node: enzyme activity is essentially
      absent while glycogen content is only moderately reduced, which is why
      this entry does not claim zero hepatic glycogen.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to all other types of glycogenoses, which are characterized by
      increased glycogen storage, deficiency of glycogen synthase causes a marked
      decrease in liver glycogen content.
    explanation: >-
      Grades the depletion as marked and states the contrast with the rest of
      the group.
  downstream:
  - target: Absence of Hepatomegaly
    causal_link_type: DIRECT
    description: >-
      There is no stored material to expand the hepatocyte mass, so the liver
      stays a normal size.
    evidence:
    - reference: PMID:28245189
      reference_title: >-
        The variable clinical phenotype of three patients with hepatic glycogen
        synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is a glycogenosis with lack of liver glycogen synthesis, therefore
        hepatomegaly is not observed in patients with glycogen synthase
        deficiency.
      explanation: >-
        States the causal link from absent synthesis to absent hepatomegaly,
        which is exactly this edge.
  - target: Loss of the Fasting Hepatic Glucose Buffer
    causal_link_type: DIRECT
    description: >-
      A subnormal reserve cannot sustain glycogenolytic glucose output through a
      fast.
- name: Absence of Hepatomegaly
  biological_scale: ORGANISM
  description: >-
    A negative finding curated as a node because it is load-bearing rather than
    incidental. Every other hepatic glycogenosis presents with an enlarged
    liver, and it is the absence of hepatomegaly that keeps GSD 0a out of the
    differential in a child with fasting hypoglycemia. This node is the reason
    the disease is missed.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD0 is the only GSD not associated with hepatomegaly, and hypoglycemia
      typically is milder than in the other types of GSD.
    explanation: >-
      States both halves of what makes this node discriminating - uniquely no
      hepatomegaly, and milder hypoglycemia than the storage-side diseases.
  - reference: PMID:30968641
    reference_title: >-
      Glycogen storage disease type 0 due to a novel frameshift mutation in
      glycogen synthase 2 (GYS2) gene in a child presenting with fasting
      hypoglycemia and postprandial hyperglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of GSD0 should be considered in a child with ketotic fasting
      hypoglycemia with postprandial hyperglycemia but without hepatomegaly.
    explanation: >-
      Frames absent hepatomegaly as a positive part of the diagnostic triad
      rather than merely a missing feature.
- name: Loss of the Fasting Hepatic Glucose Buffer
  biological_scale: ORGANISM
  description: >-
    In the postabsorptive state the liver has almost no glycogen to mobilise, so
    hepatic glucose output rests entirely on gluconeogenesis. Both
    gluconeogenesis and fatty-acid oxidation are intact here - the lesion is
    confined to the synthetic step - and their preservation is what keeps the
    hypoglycemia milder than in GSD I while simultaneously making it ketotic.
  biological_processes:
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  - preferred_term: ketone body biosynthetic process
    term:
      id: GO:0046951
      label: ketone body biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intact gluconeogenesis and fatty acid oxidation blunt the decrease in
      blood glucose levels in the postabsorptive period and explains why this
      disorder is typically milder than the other hepatic glycogenoses.
    explanation: >-
      Establishes both preserved pathways and ties their preservation to the
      comparative mildness of the fasting phenotype.
  downstream:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    causal_link_type: DIRECT
    description: >-
      Once gluconeogenesis alone can no longer meet glucose demand, blood
      glucose falls while ketones - the alternative fuel - rise.
    evidence:
    - reference: PMID:9691087
      reference_title: >-
        Mutations in the liver glycogen synthase gene in children with
        hypoglycemia due to glycogen storage disease type 0.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glycogen storage disease type 0 (GSD-0) is a rare form of fasting
        hypoglycemia presenting in infancy or early childhood and accompanied by
        high blood ketones and low alanine and lactate concentrations.
      explanation: >-
        Names the full fasting signature this edge produces, including the low
        lactate that separates it from GSD I.
- name: Fasting Ketotic Hypoglycemia with Low Lactate
  biological_scale: ORGANISM
  description: >-
    The fasted half of the disease. Glucose falls, ketones rise, and - this is
    the discriminating detail - lactate and alanine are LOW rather than high.
    Low lactate follows from gluconeogenesis running at full tilt and consuming
    lactate as substrate, and low alanine from its consumption as a gluconeogenic
    precursor; both are the mirror image of GSD I, where the gluconeogenic block
    dams lactate up and produces fasting lactic acidosis. Symptoms typically
    surface in late infancy, when overnight feeds are dropped.
  evidence:
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is characterized by hyperketotic hypoglycemia without
      hyperlactatemia after fasting.
    explanation: >-
      States the fasting combination with the explicit negative - hyperketosis
      WITHOUT hyperlactatemia.
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is characterized by fasting hyperketotic hypoglycemia without
      hyperalaninemia or hyperlactacidemia.
    explanation: >-
      Independently states the same fasting signature and adds the absent
      hyperalaninemia.
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fasting hypoglycemia usually manifests in late infancy when overnight
      feedings are stopped.
    explanation: >-
      Supplies the timing: the fast only becomes long enough to unmask the
      defect when night feeds stop.
  downstream:
  - target: Diurnal Glycemic Oscillation
    causal_link_type: DIRECT
    description: The fasted trough of the daily swing.
  - target: Gluconeogenic Substrate Limitation on Prolonged Fasting
    causal_link_type: DIRECT
    description: >-
      Sustained hyperketonemia and free fatty acid elevation feed back on
      substrate supply.
  - target: Ketotic Hypoglycemia
    causal_link_type: DIRECT
    description: The clinical manifestation of the fasted state.
  - target: Ketonuria
    causal_link_type: DIRECT
    description: Ketone bodies produced in excess spill into the urine.
  - target: Hypoglycemic Seizures
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Neuroglycopenia during a severe episode can provoke a seizure; this is an

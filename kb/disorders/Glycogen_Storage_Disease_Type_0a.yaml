    snippet: >-
      Children may exhibit early morning drowsiness, pallor, vomiting and
      fatigue.
    explanation: >-
      Lists the symptom cluster of the fasting trough, with its early-morning
      timing.
biochemical:
- name: Fasting blood glucose
  presence: Decreased
  context: >-
    Low after an overnight or prolonged fast; documented at 34 mg/dL after an
    eight-hour fast in an asymptomatic child, which is part of why the disease
    is missed.
  readouts:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low fasting glucose reports the failure of hepatic glucose output once the
      glycogen reserve is exhausted.
    evidence:
    - reference: PMID:26937415
      reference_title: >-
        Pediatric patient with hyperketotic hypoglycemia diagnosed with glycogen
        synthase deficiency due to the novel homozygous mutation in GYS2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Eight-hour fasting plasma glucose test, revealed glucose blood level of
        34 mg/dl with no clinical symptoms.
      explanation: >-
        A measured fasting value in a molecularly confirmed patient, and one
        that was asymptomatic - the reason a provoked fast rather than symptoms
        is what finds this.
- name: Postprandial blood glucose
  presence: Elevated
  context: >-
    High after a carbohydrate meal or an oral glucose load; the fed-state half
    of the diagnostic pair.
  readouts:
  - target: Postprandial Hyperglycemia with Lactic Acidemia
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A high postprandial value reports the liver's inability to clear a glucose
      load into glycogen.
    evidence:
    - reference: PMID:26937415
      reference_title: >-
        Pediatric patient with hyperketotic hypoglycemia diagnosed with glycogen
        synthase deficiency due to the novel homozygous mutation in GYS2.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Oral glucose tolerance test showed normal baseline blood levels of
        glucose, insulin and lactate, and their increase following glucose
        intake.
      explanation: >-
        An oral glucose tolerance test showing normal fasting values that rise
        after the load - the provocation that exposes the fed-state defect.
- name: Fasting blood lactate
  presence: Low or normal
  context: >-
    Low or normal during fasting, because gluconeogenesis consumes lactate
    rather than being blocked. The negative finding that separates GSD 0a from
    GSD I.
  readouts:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A low fasting lactate reports intact gluconeogenic flux, and rules against
      the gluconeogenic-block glycogenoses.
    evidence:
    - reference: PMID:9691087
      reference_title: >-
        Mutations in the liver glycogen synthase gene in children with
        hypoglycemia due to glycogen storage disease type 0.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Glycogen storage disease type 0 (GSD-0) is a rare form of fasting
        hypoglycemia presenting in infancy or early childhood and accompanied by
        high blood ketones and low alanine and lactate concentrations.
      explanation: >-
        States the low fasting lactate and alanine explicitly, alongside the
        raised ketones.
- name: Postprandial blood lactate
  presence: Elevated
  context: >-
    Rises after a meal or glucose load. Can be checked at home with a portable
    lactate meter or formally by oral glucose tolerance test.
  readouts:
  - target: Postprandial Hyperglycemia with Lactic Acidemia
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A postprandial lactate rise reports the diversion of meal-derived glucose
      into glycolysis.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        If fasting ketotic hypoglycemia is demonstrated, testing for
        post-prandial hyperlactatemia can be performed either using a portable
        lactate meter at home or by means of an oral glucose tolerance test
      explanation: >-
        Establishes postprandial lactate as the confirmatory second step of the
        biochemical workup, and names how it is measured.
- name: Blood and urine ketone bodies
  presence: Elevated
  context: Raised during fasting; universal in children under five years.
  readouts:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Raised ketones report the shift to fatty-acid oxidation that intact
      beta-oxidation makes available, and are the practical home monitoring
      readout.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        fasting hypoglycemia and ketonuria are universal in children less than 5
        years of age
      explanation: >-
        Ketonuria is universal in young children, which is what makes it usable
        as a screening and monitoring readout.
- name: Plasma alanine
  presence: Low or normal
  context: >-
    Low or normal rather than raised, because alanine is being consumed as a
    gluconeogenic precursor. Absence of hyperalaninemia is part of the
    discriminating profile.
  readouts:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Low alanine reports gluconeogenesis running at capacity on available
      substrate.
    evidence:
    - reference: PMID:28245189
      reference_title: >-
        The variable clinical phenotype of three patients with hepatic glycogen
        synthase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The disorder is characterized by fasting hyperketotic hypoglycemia
        without hyperalaninemia or hyperlactacidemia.
      explanation: >-
        Records the absence of hyperalaninemia as a defining part of the fasting
        biochemical profile.
- name: Hepatic glycogen synthase enzyme activity
  presence: Decreased
  context: >-
    Measured on liver biopsy tissue; extremely low or unmeasurable. Superseded
    by GYS2 sequencing as the routine diagnostic route.
  readouts:
  - target: Hepatic Glycogen Synthase Deficiency
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Direct measurement of the deficient enzyme, the historical gold standard
      for the diagnosis.
    evidence:
    - reference: PMID:9691087
      reference_title: >-
        Mutations in the liver glycogen synthase gene in children with
        hypoglycemia due to glycogen storage disease type 0.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        GS activity in the liver of the affected children was extremely low or
        nil, resulting in subnormal glycogen content.
      explanation: >-
        Reports the enzyme activity measured on liver biopsy in affected
        children.
- name: Hepatic glycogen content
  presence: Decreased
  context: >-
    Measured on liver biopsy; decreased, which is the opposite of every other
    glycogenosis and was the historical basis of the diagnosis.
  readouts:
  - target: Depleted Hepatic Glycogen Reserve
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Direct tissue measurement of the depleted reserve; the sign of this
      readout is inverted relative to every other GSD.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Until recently, the definitive diagnosis of GSD0 depended on the
        demonstration of decreased hepatic glycogen on a liver biopsy.
      explanation: >-
        Establishes decreased hepatic glycogen as the definitive historical
        diagnostic finding.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence study exists. The only quantitative statement
    available is a count of published cases - fewer than thirty as of 2020 -
    together with the estimate that GSD 0 represents less than 1% of all
    glycogen storage diseases. The count is curated as CASES_IN_LITERATURE
    rather than converted to a rate, because the denominator is the literature
    and not a population, and because several independent sources argue the
    condition is underdiagnosed (see the KNOWLEDGE_GAP discussion). ULTRA_RARE
    is the honest qualitative band for a disease with a two-digit case
    literature; a numeric Orphanet-style band is deliberately not asserted.
  evidence:
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD 0 is a rare form of hepatic glycogen storage disease with less than 30
      reported patients in the literature so far.
    explanation: >-
      The published-case count as of 2020, which is what the CASES_IN_LITERATURE
      measure records.
  - reference: PMID:32395408
    reference_title: >-
      Hepatic glycogen synthase (GYS2) deficiency: seven novel patients and
      seven novel variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD 0 is an extremely rare form, representing less than 1% of all GSDs
    explanation: >-
      Places the disease as under one percent of the glycogenoses, which is the
      basis for the ULTRA_RARE qualitative band.
treatments:
- name: Frequent High-Protein Feeds with Uncooked Cornstarch
  description: >-
    The mainstay, and entirely dietary. Frequent daytime meals high in protein
    supply gluconeogenic precursors, which works here precisely because
    gluconeogenesis is intact - the same logic as in GSD VI, and the opposite of
    GSD I where the gluconeogenic step is itself blocked. Uncooked cornstarch at
    bedtime, dosed at roughly 1-1.5 g/kg and repeated six-hourly during illness,
    provides slow-release glucose across the overnight fast. Preventing
    hyperketonemia is not just symptom relief: it lifts the feedback inhibition
    of alanine release from muscle, so the diet also protects the gluconeogenic
    substrate supply it depends on.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    treatment_effect: BYPASSES
    description: >-
      Supplies exogenous slow-release glucose and gluconeogenic substrate,
      bypassing the absent glycogen reserve rather than restoring it.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Since gluconeogenesis is intact, protein supplementation provides
        gluconeogenic precursors that can be used for endogenous glucose
        production.
      explanation: >-
        States the mechanism claimed on this link, and the reason it works in
        this disease specifically: the pathway the protein feeds is preserved.
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In young children, hypoglycemia may still occur on a high protein diet,
        and uncooked cornstarch (1-1.5 grams/kg) administered at bedtime, and
        every 6 hours during illness, prevents morning hypoglycemia and ketosis.
      explanation: >-
        Gives the cornstarch dose and schedule and the outcome it achieves on
        this node - prevention of morning hypoglycemia and ketosis.
  - target: Gluconeogenic Substrate Limitation on Prolonged Fasting
    treatment_effect: INHIBITS
    description: >-
      Preventing hyperketonemia removes the inhibitory signal on alanine release
      from skeletal muscle, protecting the gluconeogenic precursor supply.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In turn, there is also less dependence upon fatty acid oxidation, and
        accumulation of free fatty acids and ketones is prevented.
      explanation: >-
        Evidences the specific action claimed on this link - the diet suppresses
        the free fatty acid and ketone accumulation that drives the loop.
  evidence:
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical management is therefore based on frequent meals composed of high
      protein intake during the day and addition of uncooked cornstarch in the
      evening.
    explanation: >-
      States the regimen and its day/night structure, which mirrors the diurnal
      structure of the disease.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Daytime hypoglycemia tends to be mild and frequent snacks, given every 2-4
      hours, usually prevents hypoglycemia.
    explanation: >-
      Specifies the daytime snack interval that complements the bedtime
      cornstarch dose.
- name: Low Glycemic Index Carbohydrate Restriction
  description: >-
    The other half of the diet, and the half that is specific to this disease
    rather than shared with the hepatic glycogenoses generally. Because ingested
    glucose is shunted to lactate, a rapidly absorbed carbohydrate load produces
    postprandial lactic acidosis; complex low-glycemic-index carbohydrate blunts
    that. The stated therapeutic goal is explicitly two-sided - prevent the
    fasting hyperketonemia AND the post-prandial lactic acidosis - which is the
    diurnal swing restated as a treatment target.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Postprandial Shunting of Ingested Glucose into Glycolysis
    treatment_effect: INHIBITS
    description: >-
      Slowing carbohydrate absorption reduces the glucose flux presented to the
      liver at any moment, limiting how much is diverted into glycolysis.
    evidence:
    - reference: PMID:16337419
      reference_title: >-
        Hepatic glycogen synthase deficiency: an infrequently recognized cause
        of ketotic hypoglycemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The goal of treatment is to prevent hypoglycemia and to minimize the
        systemic acidosis by preventing post-prandial lactic acidosis and
        fasting hyperketonemia.
      explanation: >-
        Names prevention of post-prandial lactic acidosis as an explicit
        treatment goal, which is the effect claimed on this link.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients are treated with a diet high in protein with complex, low
      glycemic index carbohydrates
    explanation: States the carbohydrate composition of the prescribed diet.
- name: Perioperative and Peripartum Glucose Infusion
  description: >-
    Whenever enteral intake is interrupted - surgery, labour, intercurrent
    illness - the dietary strategy is unavailable and intravenous glucose
    substitutes for it. Reported for elective surgery under total intravenous
    anaesthesia with glucose-containing fluids, and peripartum in a woman with
    three pregnancies. The neonate in that report also needed a glucose infusion
    postnatally, which is a consequence of maternal hyperglycemia rather than of
    inherited disease in the infant.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Fasting Ketotic Hypoglycemia with Low Lactate
    treatment_effect: BYPASSES
    description: >-
      Parenteral glucose replaces the hepatic output the disease cannot supply
      during periods when feeding is not possible.
    evidence:
    - reference: PMID:33393605
      reference_title: Anesthetic Management for an Adult With Glycogen Storage Disease Type 0.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        To reduce the risk of complications attributed to GSD-0, general
        anesthesia was administered using a total intravenous anesthesia (TIVA)
        technique with propofol and remifentanil, along with supplemental
        glucose-containing intravenous fluids.
      explanation: >-
        A worked perioperative case in which supplemental intravenous glucose
        was used for exactly this purpose, with stable intraoperative glycemia.
  evidence:
  - reference: PMID:33473338
    reference_title: Three successful pregnancies in a patient with glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perinatally, the mother received a high glucose infusion to stabilize
      blood glucose levels.
    explanation: >-
      The peripartum use of the same intervention, in the only multi-pregnancy
      report of this disease.
  - reference: PMID:33473338
    reference_title: Three successful pregnancies in a patient with glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Careful monitoring during pregnancy and delivery is, however, necessary to
      minimize the risk of recurrent hypoglycemia for both mother and child.
    explanation: >-
      States the surveillance requirement that accompanies the infusion strategy.
diagnosis:
- name: Biallelic GYS2 molecular genetic testing
  presence: Positive
  description: >-
    Sequencing GYS2 is the routine diagnostic route and replaced liver biopsy.
    The switch matters epidemiologically as well as clinically: dependence on an
    invasive test is one of the stated reasons the disease was diagnosed so
    rarely.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation analysis of the GYS2 gene (12p12.2) is a non-invasive method for
      making this diagnosis in patients suspected to have this disorder.
    explanation: Establishes GYS2 sequencing as the non-invasive diagnostic method.
  - reference: PMID:28245189
    reference_title: >-
      The variable clinical phenotype of three patients with hepatic glycogen
      synthase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of the variable phenotypic spectrum of GSD0 and routine
      analysis of GYS2 are essential for the correct diagnosis.
    explanation: >-
      Argues for routine rather than selective GYS2 analysis, on the grounds of
      phenotypic variability.
- name: Paired fasting and postprandial biochemical profile
  description: >-
    The biochemical diagnosis is a PAIR of measurements, not one. A provoked or
    observed fast should show ketotic hypoglycemia with lactate that is low or
    normal; a meal or oral glucose load should then show hyperglycemia with a
    lactate rise. Either half alone is unrevealing - the fasted half looks like
    idiopathic ketotic hypoglycemia and the fed half like early diabetes - and
    it is the combination that raises the pre-test probability of a positive
    GYS2 result.
  evidence:
  - reference: PMID:23426827
    reference_title: >-
      Mutational analysis of the GYS2 gene in patients diagnosed with ketotic
      hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of the GYS2 gene is more likely to be positive in patients with
      fasting ketotic hypoglycaemia and concomitant postprandial hyperglycaemia
      with hyperlactataemia.
    explanation: >-
      States the diagnostic yield argument for the paired profile directly, from
      a study that sequenced GYS2 in fifty ketotic-hypoglycemia patients.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If fasting ketotic hypoglycemia is demonstrated, testing for post-prandial
      hyperlactatemia can be performed either using a portable lactate meter at
      home or by means of an oral glucose tolerance test
    explanation: >-
      Sets out the two-step sequence and the practical means of doing the second
      step.
- name: Absent hepatomegaly as a discriminating finding
  description: >-
    A normal-sized liver in a child with fasting ketotic hypoglycemia should
    point TOWARD this diagnosis, not away from it. Curated as a diagnostic step
    because the intuition runs the other way: hepatomegaly is what makes a
    clinician think "glycogen storage disease" at all.
  evidence:
  - reference: PMID:30968641
    reference_title: >-
      Glycogen storage disease type 0 due to a novel frameshift mutation in
      glycogen synthase 2 (GYS2) gene in a child presenting with fasting
      hypoglycemia and postprandial hyperglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of GSD0 should be considered in a child with ketotic fasting
      hypoglycemia with postprandial hyperglycemia but without hepatomegaly.
    explanation: >-
      States the full diagnostic triad including the negative hepatomegaly
      finding.
- name: Hepatic glycogen quantification on liver biopsy
  presence: Decreased
  description: >-
    The historical definitive test, showing decreased rather than increased
    hepatic glycogen. Retained here because it defines what the disease IS at
    tissue level, and because the invasiveness of this test is the stated reason
    the disease was under-recognised before GYS2 sequencing.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until recently, the definitive diagnosis of GSD0 depended on the
      demonstration of decreased hepatic glycogen on a liver biopsy.
    explanation: Names the historical definitive criterion and its direction.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The need for an invasive procedure may be one reason that this condition
      has been infrequently diagnosed.
    explanation: >-
      Links the invasiveness of the historical test to the disease's apparent
      rarity, which is the ascertainment argument this entry curates as a
      knowledge gap.
- name: Long-term surveillance
  description: >-
    There are no formal surveillance guidelines. What is described is an
    interim, explicitly provisional practice of annual abdominal ultrasound and
    nephropathy screening - notable because the complications those tests look
    for are the ones that have NOT been reported in this disease, so the
    surveillance is precautionary rather than yield-driven.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the absence of formal guidelines for long-term surveillance of patients
      with GSD0, we have, for the present time, undertaken to perform annual
      abdominal ultrasonographic examinations and screening for nephropathy.
    explanation: >-
      The authors' own provisional surveillance practice, with their hedge about
      the absence of guidelines preserved.
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hepatic adenomas, cirrhosis, kidney dysfunction, and muscular
      abnormalities, have not been reported in adolescents or adults with GSD0
    explanation: >-
      The negative result that makes the surveillance precautionary: none of the
      complications screened for has actually been observed in this disease.
discussions:
- discussion_id: gap_gsd0a_true_prevalence_underdiagnosis
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Worldwide (published cases)
  - pathophysiology#Absence of Hepatomegaly
  prompt: >-
    What is the true population prevalence of GSD 0a, as opposed to its
    published case count?
  rationale: >-
    Every quantitative statement about how common this disease is comes from
    counting papers, and multiple independent sources argue that the count is an
    undercount rather than a prevalence. The proposed mechanisms of
    ascertainment failure are specific and testable: the diagnosis historically
    required a liver biopsy; the fasted presentation is indistinguishable from
    idiopathic ketotic hypoglycemia, which is common in childhood; the fed
    presentation is mistaken for early diabetes; and there is no hepatomegaly to
    prompt the glycogen-storage workup in the first place. Against that,
    targeted sequencing gives a concrete negative bound - one of fifty children
    with ketotic hypoglycemia and an otherwise normal profile carried a GYS2
    variant - so the disease is not a large hidden fraction of that presentation
    either. Both bounds are curated here rather than averaged, because they
    answer different questions: the case count says how many have been found,
    the sequencing study says how enriched one plausible screening population
    is.
  evidence:
  - reference: PMID:12072888
    reference_title: >-
      Glycogen synthase deficiency (glycogen storage disease type 0) presenting
      with hyperglycemia and glucosuria: report of three new mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of the variable presentation of this disorder and previous
      dependence on liver biopsy to confirm diagnosis, it is likely that GSD0 is
      underdiagnosed.
    explanation: States the underdiagnosis claim and names both of its proposed causes.
  - reference: PMID:30968641
    reference_title: >-
      Glycogen storage disease type 0 due to a novel frameshift mutation in
      glycogen synthase 2 (GYS2) gene in a child presenting with fasting
      hypoglycemia and postprandial hyperglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with GSD0 may have a mild phenotype and GSD0 may be underdiagnosed
      due to subclinical or asymptomatic hypoglycemia.
    explanation: >-
      Adds a third ascertainment mechanism - the hypoglycemia can be entirely
      asymptomatic, so nothing prompts testing.
  - reference: PMID:23426827
    reference_title: >-
      Mutational analysis of the GYS2 gene in patients diagnosed with ketotic
      hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutations in GYS2 were found in 49 patients.
    explanation: >-
      The negative bound: sequencing GYS2 in fifty children with ketotic
      hypoglycaemia found one positive, so this presentation is not largely
      unrecognised GSD 0a.
  - reference: PMID:23426827
    reference_title: >-
      Mutational analysis of the GYS2 gene in patients diagnosed with ketotic
      hypoglycaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD0 is relatively rare in patients presenting with ketotic hypoglycaemia
      and a normal biochemical profile.
    explanation: >-
      The authors' own reading of that negative result, which is the appropriate
      counterweight to the underdiagnosis claims above.
  proposed_experiments:
  - experiment_id: exp_gsd0a_paired_profile_enriched_sequencing
    name: >-
      GYS2 sequencing in children selected on the paired fed/fasted profile
      rather than on ketotic hypoglycaemia alone
    description: >-
      The one sequencing study available selected on ketotic hypoglycaemia with
      an otherwise normal biochemical profile and found a 1-in-50 yield. The
      hypothesis this entry's mechanism generates is that selecting instead on
      the diurnal signature - documented fasting ketotic hypoglycemia together
      with documented postprandial hyperglycemia and hyperlactatemia, in a child
      with a normal-sized liver - would enrich the yield substantially, since
      that pairing is what the pathophysiology uniquely predicts. Continuous
      glucose monitoring makes the fed-state half cheap to capture, which it was
      not when the earlier cohort was assembled.
    would_support:
    - pathophysiology#Diurnal Glycemic Oscillation
    supporting_outcome:
    - >-
      A materially higher proportion of biallelic GYS2 findings in the
      paired-profile-selected cohort than in selection on fasting ketotic
      hypoglycaemia alone.
    refuting_outcome:
    - >-
      No enrichment over selection on fasting ketotic hypoglycaemia alone, which
      would mean the postprandial arm adds no discriminating information in
      practice despite its mechanistic specificity.
- discussion_id: open_gsd0a_benign_framing_long_term
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - phenotypes#Short Stature
  - phenotypes#Osteopenia
  prompt: >-
    Is the good long-term prognosis of GSD 0a established, or is it an artefact
    of a small and young reported cohort?
  rationale: >-
    The disease is repeatedly described as comparatively benign, and the
    supporting observations are real - fasting tolerance improves with age, four
    reported pregnancies all produced healthy offspring, and the hepatic and
    renal complications of the storage-side glycogenoses have not been reported.
    But "have not been reported" in a literature of fewer than thirty patients,
    most of them children, is a weak negative. Short stature and osteopenia are
    already acknowledged as common, and both are the kind of finding that
    accumulates with duration of poor metabolic control rather than appearing
    early. The question is whether adult follow-up would leave the benign
    framing intact or add chronic morbidity to it.
  evidence:
  - reference: PMID:16337419
    reference_title: >-
      Hepatic glycogen synthase deficiency: an infrequently recognized cause of
      ketotic hypoglycemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short stature and osteopenia are common features, but other long-term
      complications, common in other types of GSD, have not been reported in
      GSD0.
    explanation: >-
      Both halves of the tension in one sentence: two chronic features are
      common, and the rest are absent from the literature.
  - reference: PMID:33473338
    reference_title: Three successful pregnancies in a patient with glycogen storage disease type 0.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four pregnancies in women with GSD 0 described to date occurred with
      minor complications and resulted in healthy offspring, which underpins the
      good prognosis and rather benign character of this rare metabolic disease.
    explanation: >-
      The strongest available argument for the benign framing, quoted with its
      own denominator visible - four pregnancies in total.
notes: >-
  Scope and naming. This entry covers the HEPATIC form only, GSD 0a, caused by
  GYS2. The muscle form GSD 0b, caused by GYS1, is a genuinely different disease
  - cardiomyopathy, exercise intolerance and sudden cardiac death rather than
  hypoglycemia - and is a separate curation target. The two share the "GSD 0"
  label and the phrase "glycogen synthase deficiency", which is a live Named
  Entity Confusion risk when searching the literature: several recent papers
  titled around muscle glycogen synthase deficiency (GSD0B) surface on a search
  for glycogen synthase deficiency and were deliberately excluded from this
  entry. Every reference cited here was checked to be about the hepatic, GYS2
  disease.

  Why this is in the glycogen storage diseases grouping despite not being a
  storage disease. Both MONDO's definition of MONDO:0009414 ("This is not a
  glycogenosis, strictly speaking, as the enzyme deficiency decreases glycogen
  reserves") and the clinical literature ("Although GSD0 has been classified as
  a glycogen storage disease (GSD), this is a misnomer") say plainly that the
  name is wrong. It is nonetheless included as a member of
  Glycogen_Storage_Diseases, because that grouping is explicitly based on both
  SHARED_MECHANISM (a lesion in the glycogen synthesis/degradation pathway) and
  CLINICAL_CONVENTION (the Roman-numeral nosology), and GSD 0a satisfies both:
  the lesion is squarely in glycogen biosynthesis, and the number 0 is part of
  the convention. The grouping's necessary criterion is worded to cover
  synthesis as well as degradation and asks for abnormal glycogen quantity
  without specifying a direction, so a marked decrease qualifies. GSD XV
  (glycogenin-1 deficiency) is the existing precedent - also a synthesis-side
  member, also with glycogen-depleted tissue.

  Calibration of the central claim. It is tempting to say the liver stores no
  glycogen at all. The sources do not support that: enzyme activity is
  "extremely low or nil" while glycogen content is "only moderately decreased"
  in the original linkage series and "markedly" decreased in the later review.
  This entry says subnormal and depleted, never absent.

  What could not be curated. There is no GeneReviews chapter for GSD 0 - PubMed
  returns GeneReviews articles for GSD I, III, IV, V, VI, Pompe disease and
  phosphorylase kinase deficiency, but none for type 0 - so the GeneReviews
  phenotype baseline does not apply here, and the Weinstein mini-review
  (PMID:16337419) is used as the nearest equivalent expert synthesis. No
  Orphanet cache entry exists for ORPHA:2089 and the fetcher does not retrieve
  arbitrary ORPHA codes on demand, so the Orphanet prevalence class was not
  cited; the prevalence record is built from the published case count instead.
  No animal model of Gys2 deficiency was cited: none characterised for this
  disease was found in the sources reviewed, and an uncited model block would be
  worse than none.

  Curation provenance. No deep-research provider report was generated for this
  entry; the reference set was assembled directly from PubMed searches on GYS2,
  glycogen storage disease type 0 and hepatic glycogen synthase deficiency, and
  every snippet was verified as an exact substring of its cached reference
  before commit.

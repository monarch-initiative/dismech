    the conserved ETS DNA-binding domain — p.Arg337Trp and p.Tyr343Cys in the
    dominant series, p.Arg324Trp homozygously in the recessive family — and were
    shown directly to abolish FLI1 transcriptional activity rather than merely
    predicted to.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The dominant presentation arises from heterozygous FLI1 alterations,
    identified in patients ascertained for excessive bleeding with reduced dense
    granule secretion and impaired aggregation. Two of these, p.Arg337Trp and
    p.Tyr343Cys, sit in the DNA-binding domain and were shown to abolish FLI1
    transcriptional activity; a four-base-pair deletion predicted
    haploinsufficiency instead. Both routes are consistent with a dosage-sensitive
    transcription factor, which is also why hemizygous FLI1 loss in the 11q23
    deletion produces a platelet phenotype.
  evidence:
  - reference: PMID:24100448
    reference_title: "Enrichment of FLI1 and RUNX1 mutations in families with excessive bleeding and platelet dense granule secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous alterations in FLI1 and RUNX1, encoding Friend leukemia
      integration 1 and RUNT-related transcription factor 1, respectively, which
      have a fundamental role in megakaryocytopoeisis, were identified in 6
      patients, 4 of whom had mild thrombocytopenia.
    explanation: >-
      Establishes disease from heterozygous FLI1 alterations, i.e. dominant
      inheritance.
  - reference: PMID:28432223
    reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, heterozygote human FLI1 mutations have been ascribed to cause
      thrombocytopenia.
    explanation: >-
      Independent statement that heterozygous FLI1 variants are accepted as
      causing thrombocytopenia.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A consanguineous family segregates a homozygous FLI1 ETS-domain missense
    allele (c.970C>T) producing a bleeding disorder that phenocopies
    Paris-Trousseau thrombocytopenia without any other feature of the 11q23
    deletion syndrome. Whether the dominant and recessive presentations are one
    disease entity or two is not settled; see the discussion in this entry.
  evidence:
  - reference: PMID:26316623
    reference_title: "Paris-Trousseau thrombocytopenia is phenocopied by the autosomal recessive inheritance of a DNA-binding domain mutation in FLI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a consanguineous family with autosomal recessive
      inheritance of a bleeding disorder that mimics Paris-Trousseau
      thrombocytopenia but has no other features of the 11q23 deletion syndrome.
    explanation: >-
      Direct demonstration of recessive inheritance of an isolated FLI1 platelet
      phenotype.

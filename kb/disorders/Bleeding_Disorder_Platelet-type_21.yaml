genetic:
- name: FLI1
  gene_term:
    preferred_term: FLI1
    term:
      id: hgnc:3749
      label: FLI1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    FLI1 (11q24.3) encodes an ETS-family transcription factor central to
    megakaryopoiesis. Reported disease alleles are concentrated in the ETS
    DNA-binding domain — p.Arg337Trp and p.Tyr343Cys heterozygously,
    p.Arg324Trp homozygously — with a frameshift deletion representing the
    haploinsufficiency route. FLI1 dosage matters in both directions: hemizygous
    loss within the 11q23 deletion produces Paris-Trousseau thrombocytopenia,
    while FLI1 overexpression in induced megakaryocytes improved platelet yield,
    half-life and function.
  evidence:
  - reference: PMID:24100448
    reference_title: "Enrichment of FLI1 and RUNX1 mutations in families with excessive bleeding and platelet dense granule secretion defects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two FLI1 alterations predicting p.Arg337Trp and p.Tyr343Cys substitutions in
      the FLI1 DNA-binding domain abolished transcriptional activity of FLI1.
    explanation: >-
      Names the dominant DNA-binding-domain alleles and demonstrates their
      functional consequence.
  - reference: PMID:28432223
    reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PTSx and FLI1+/- iMegs replicate many of the described megakaryocyte/platelet
      features, including a decrease in iMeg yield and fewer platelets released per
      iMeg.
    explanation: >-

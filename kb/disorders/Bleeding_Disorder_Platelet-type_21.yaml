- name: Impaired Megakaryocyte Maturation and Thrombopoiesis
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    With the terminal transcriptional programme disabled, megakaryocyte output
    falls at two points: fewer megakaryocytes are produced, and each releases
    fewer platelets. This was shown directly in induced pluripotent stem
    cell-derived megakaryocytes from a Paris-Trousseau patient and from a
    targeted heterozygous FLI1 knockout line, which reproduced the described
    megakaryocyte and platelet features. It is the quantitative arm of the
    disorder, producing the mild-to-moderate thrombocytopenia.
  biological_processes:
  - preferred_term: megakaryocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0030219
      label: megakaryocyte differentiation
  - preferred_term: platelet formation
    modifier: DECREASED
    term:
      id: GO:0030220
      label: platelet formation
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:28432223
    reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PTSx and FLI1+/- iMegs replicate many of the described megakaryocyte/platelet
      features, including a decrease in iMeg yield and fewer platelets released per
      iMeg.
    explanation: >-
      Shows both arms of the output defect in a human cell model of FLI1
      deficiency.
  - reference: PMID:28432223
    reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Platelets released in vivo from infusion of these iMegs had poor half-lives
      and functionality.
    explanation: >-
      Establishes that the platelets produced are themselves defective and
      short-lived, not merely fewer.
  downstream:
  - target: Mucocutaneous Bleeding Diathesis
- name: Platelet Granule and Secretion Defect
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The qualitative arm. Circulating platelets show a dense granule secretion
    defect with impaired aggregation to a panel of agonists, and in the recessive
    family a striking alpha-granule abnormality: large, fused alpha-granules in a
    minority of platelets, the same morphological hallmark seen in
    Paris-Trousseau thrombocytopenia. Collagen-induced aggregation was absent in
    that family, which fits the demonstrated loss of the FLI1 target GP6, the
    collagen receptor.

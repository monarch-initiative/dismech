name: Bleeding disorder, platelet-type, 21
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Bleeding disorder, platelet-type, 21 (BDPLT21) is an inherited platelet
  disorder caused by pathogenic variants in FLI1, an ETS-family transcription
  factor with a fundamental role in megakaryopoiesis. FLI1 drives the terminal
  transcriptional programme of the maturing megakaryocyte, directly
  transactivating platelet genes including GP6, GP9 and ITGA2B. Variants in its
  ETS DNA-binding domain abolish that transactivation, so megakaryocytes mature
  poorly, release fewer and abnormal platelets, and those platelets carry
  defective granules and secrete poorly on activation. The clinical result is a
  mucocutaneous bleeding diathesis with mild-to-moderate thrombocytopenia and
  impaired agonist-induced aggregation — bleeding that is disproportionate to
  the platelet count, because the defect is qualitative as well as quantitative.
  BDPLT21 is the monogenic counterpart of Paris-Trousseau thrombocytopenia,
  where FLI1 is lost as part of the contiguous 11q23 (Jacobsen) deletion.
category: Mendelian
parents:
- hereditary disease
synonyms:
- BDPLT21
- FLI1-related platelet disorder
- FLI1-related thrombocytopenia
- FLI1 deficiency

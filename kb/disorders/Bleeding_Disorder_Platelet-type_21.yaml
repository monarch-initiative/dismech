  downstream:
  - target: Mucocutaneous Bleeding Diathesis
- name: Mucocutaneous Bleeding Diathesis
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced platelet number combined with defective platelet function produces
    excessive mucocutaneous bleeding — the presenting complaint through which
    these patients are ascertained. Because the defect is qualitative as well as
    quantitative, bleeding severity is not predicted by the platelet count alone,
    and thrombocytopenia is characteristically only mild to moderate.
  evidence:
  - reference: PMID:24100448
    reference_title: "Enrichment of FLI1 and RUNX1 mutations in families with excessive bleeding and platelet dense granule secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that alterations in FLI1 and RUNX1 may be common in
      patients with platelet dense granule secretion defects and mild
      thrombocytopenia.
    explanation: >-
      Pairs the bleeding presentation with the secretion defect and mild
      thrombocytopenia.
- name: ETS1 Derepression
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    In FLI1-deficient induced megakaryocytes the physically linked ETS-family
    factor ETS1 is overexpressed, suggesting FLI1 normally represses ETS1 during
    megakaryopoiesis. Whether this derepression contributes to the disease
    phenotype or is an incidental consequence of losing FLI1 has not been
    established, so it is carried as a PROVISIONAL modifier rather than a step in
    the causal chain.
  genes:
  - preferred_term: ETS1
    term:
      id: hgnc:3488
      label: ETS1
  cell_types:
  - preferred_term: Megakaryocyte
    term:
      id: CL:0000556
      label: megakaryocyte
  evidence:
  - reference: PMID:28432223
    reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We noted that the closely linked E26 transformation-specific proto-oncogene
      1 (ETS1) is overexpressed in these FLI1-deficient iMegs, suggesting FLI1
      negatively regulates ETS1 in megakaryopoiesis.
    explanation: >-
      The sole evidence for the derepression, and its own framing is a suggestion
      rather than a demonstrated disease mechanism.
  downstream:
  - target: Impaired Megakaryocyte Maturation and Thrombopoiesis

experimental_models:
- name: PTSx and FLI1+/- iPSC-derived megakaryocytes (iMegs)
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:28432223
  description: >-
    iPSC-derived megakaryocytes from a Paris-Trousseau patient and from a control
    line carrying a targeted heterozygous FLI1 knockout. The FLI1+/- line is the
    one that bears on this entry: it isolates FLI1 haploinsufficiency from the
    contiguous 11q deletion that confounds Paris-Trousseau.
  modeled_mechanisms:
  - target: Impaired Megakaryocyte Maturation and Thrombopoiesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the quantitative arm - reduced megakaryocyte yield and fewer
      platelets released per megakaryocyte.
    limitations: >-
      iPSC-derived megakaryocytes mature in culture rather than in a marrow niche,
      so the yield deficit is measured without the stromal and cytokine context
      that shapes thrombopoiesis in vivo. The patient line also carries the whole
      11q deletion, so only the FLI1+/- line isolates the gene.
    readouts:
    - name: iMeg yield and platelets released per iMeg
      target: Impaired Megakaryocyte Maturation and Thrombopoiesis
      direction: DECREASED
      interpretation: >-
        Quantitative megakaryocyte and platelet-output deficit.
      evidence:
      - reference: PMID:28432223
        reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          PTSx and FLI1+/- iMegs replicate many of the described
          megakaryocyte/platelet features, including a decrease in iMeg yield and
          fewer platelets released per iMeg.
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:28432223
      reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We studied induced-pluripotent stem cell (iPSC)-derived megakaryocytes
        (iMegs) to better understand these clinical disorders, beginning with iPSCs
        generated from a patient with PTSx and iPSCs from a control line with a
        targeted heterozygous FLI1 knockout (FLI1+/-).
      explanation: >-
        Establishes the model system and its two arms.
animal_models:
- name: NSG mouse iMeg infusion assay
  species: Mouse
  genotype: NOD/SCID/IL2Rgamma-null (NSG), wild type for Fli1
  publication: PMID:28432223
  description: >-
    A xenotransplantation readout rather than a genetic disease model: NSG mice
    are infused with human iMegs and the platelets those cells release are
    tracked. The mouse contributes the circulation, not the lesion.
  modeled_mechanisms:
  - target: Impaired Megakaryocyte Maturation and Thrombopoiesis
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the in vivo half-life and functionality readout for platelets
      released by FLI1-deficient megakaryocytes, which cannot be obtained in
      culture.
    limitations: >-
      The mouse is not FLI1-deficient and does not model the disease; it is a host
      for human cells. Platelet survival in a xenogeneic circulation is not
      equivalent to survival in a patient, so the half-life figure is comparative
      between arms rather than clinically calibrated.
    readouts:
    - name: Platelet half-life and functionality in vivo
      target: Impaired Megakaryocyte Maturation and Thrombopoiesis
      direction: DECREASED
      interpretation: >-
        Platelets released from FLI1-deficient iMegs survive and function poorly.
      evidence:
      - reference: PMID:28432223
        reference_title: "FLI1 level during megakaryopoiesis affects thrombopoiesis and platelet biology."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Platelets released in vivo from infusion of these iMegs had poor
          half-lives and functionality.
        explanation: >-
          The in vivo measurement behind this readout.
diagnosis:
- name: Platelet Function Testing with Dense Granule Secretion Assay
  description: >-
    Light transmission aggregometry with a panel of agonists plus dense granule
    secretion measurement is the phenotypic assay that identifies candidates.
    This matters diagnostically because the qualitative defect is present
    regardless of platelet count, and a third of the reported dominant cohort had
    a normal count.
  evidence:
  - reference: PMID:24100448
    reference_title: "Enrichment of FLI1 and RUNX1 mutations in families with excessive bleeding and platelet dense granule secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed candidate platelet function disorder genes in 13 index cases
      with a history of excessive bleeding in association with a significant
      reduction in dense granule secretion and impaired aggregation to a panel of
      platelet agonists.
    explanation: >-
      Describes the phenotypic testing strategy used to select patients for
      sequencing.
differential_diagnoses:
- name: Paris-Trousseau thrombocytopenia / Jacobsen syndrome
  description: >-
    The key differential, and a near-phenocopy. Both arise from reduced FLI1, but
    Paris-Trousseau results from hemizygous deletion of a variable 11q region
    containing FLI1, so it comes with the rest of the contiguous-gene syndrome:
    congenital heart anomalies, dysmorphic facial features and intellectual
    disability. Isolated FLI1 disease has the platelet phenotype without those
    features, which is precisely how the recessive family was distinguished.
  evidence:
  - reference: PMID:26316623
    reference_title: "Paris-Trousseau thrombocytopenia is phenocopied by the autosomal recessive inheritance of a DNA-binding domain mutation in FLI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hemizygous deletion of a variable region on chromosome 11q containing FLI1
      causes an inherited platelet-related bleeding disorder in Paris-Trousseau
      thrombocytopenia and Jacobsen syndrome.
    explanation: >-
      Establishes the contiguous-deletion basis of the differential.
  - reference: PMID:26316623
    reference_title: "Paris-Trousseau thrombocytopenia is phenocopied by the autosomal recessive inheritance of a DNA-binding domain mutation in FLI1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a consanguineous family with autosomal recessive
      inheritance of a bleeding disorder that mimics Paris-Trousseau
      thrombocytopenia but has no other features of the 11q23 deletion syndrome.
    explanation: >-
      States the discriminating point: isolated platelet phenotype without the
      syndromic features.
- name: RUNX1-related familial platelet disorder
  description: >-
    RUNX1 alterations were found alongside FLI1 in the same sequencing study of
    bleeding patients with dense granule secretion defects, and produce a
    clinically overlapping picture. The distinction is not academic: RUNX1
    haploinsufficiency carries a well-recognized risk of myeloid malignancy that
    FLI1 disease is not established to share, so the genes must be separated
    before counselling.
  evidence:
  - reference: PMID:24100448
    reference_title: "Enrichment of FLI1 and RUNX1 mutations in families with excessive bleeding and platelet dense granule secretion defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous alterations in FLI1 and RUNX1, encoding Friend leukemia
      integration 1 and RUNT-related transcription factor 1, respectively, which
      have a fundamental role in megakaryocytopoeisis, were identified in 6
      patients, 4 of whom had mild thrombocytopenia.
    explanation: >-
      Shows the two genes were found in the same phenotypically selected cohort,
      which is why they are a differential pair.
discussions:
- discussion_id: bdplt21_dominant_versus_recessive_entity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the heterozygous and homozygous FLI1 platelet phenotypes one disease
    entity with variable expressivity, or two entities that happen to share a
    gene?
  attaches_to:
  - "pathophysiology#FLI1 DNA-Binding Domain Dysfunction"
  rationale: >-
    Both presentations are curated in this entry because both are FLI1
    ETS-domain loss of function acting on the same target genes, and separating
    them would duplicate the entire pathograph. But the case for one entity is
    not closed. The dominant series was ascertained from a bleeding cohort and
    shows mild thrombocytopenia in only some patients; the recessive family shows
    moderate thrombocytopenia, absent collagen-induced aggregation and fused
    alpha-granules, i.e. a fuller Paris-Trousseau phenocopy. That is consistent
    with a simple dosage series — one damaged allele giving a partial phenotype,
    two giving the full one — but nobody has tested that directly, and the two
    reports used different assays on different populations, so the apparent
    severity gradient could be an artefact of ascertainment. This matters for
    counselling, since it determines what a heterozygous relative should be told.
  proposed_experiments:
  - experiment_id: exp_bdplt21_uniform_phenotyping_by_genotype
    name: Uniform phenotyping of heterozygous and homozygous FLI1 carriers
    description: >-
      Apply one platelet function and morphology protocol across heterozygous and
      homozygous FLI1 carriers from reported families, to test whether severity
      tracks allele dosage once assay and ascertainment are held constant.
  - experiment_id: exp_bdplt21_allelic_series_in_imegs
    name: Allelic series in induced megakaryocytes
    description: >-
      Generate isogenic induced pluripotent stem cell lines carrying each reported
      FLI1 allele heterozygously and homozygously, and compare megakaryocyte
      yield, platelet release, granule content and target gene expression against
      a common wild-type background.
- discussion_id: bdplt21_ets1_derepression_significance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does ETS1 derepression contribute to the FLI1-deficient platelet phenotype,
    or is it an incidental consequence of FLI1 loss?
  attaches_to:
  - "pathophysiology#ETS1 Derepression"
  rationale: >-
    ETS1 is physically linked to FLI1 and is overexpressed in FLI1-deficient
    induced megakaryocytes, which the reporting authors read as FLI1 negatively
    regulating ETS1 during megakaryopoiesis. Nothing has tested whether that
    derepression is pathogenic. It is mechanistically interesting because ETS1 is
    itself a megakaryocytic transcription factor, so its excess could either
    partially compensate for missing FLI1 or actively distort the differentiation
    programme — opposite predictions that no published experiment separates. The
    node is curated as a PROVISIONAL modifier for that reason.
  proposed_experiments:
  - experiment_id: exp_bdplt21_ets1_knockdown_rescue
    name: ETS1 knockdown in FLI1-deficient induced megakaryocytes
    description: >-
      Reduce ETS1 back to wild-type levels in FLI1-deficient induced
      megakaryocytes and ask whether megakaryocyte yield, platelet release and
      granule phenotype improve, worsen, or are unchanged.
notes: >-
  Scope and boundaries. This entry covers FLI1-anchored inherited platelet
  disease (MONDO:0054577, BDPLT21) and deliberately includes both the
  heterozygous and homozygous presentations, since both are ETS-domain loss of
  function converging on the same target genes and the same pathograph. Whether
  that is one entity is genuinely unsettled and is recorded as an open
  discussion rather than decided silently here.

  Not curated here: Paris-Trousseau thrombocytopenia and Jacobsen syndrome. Those
  arise from a contiguous 11q23 deletion and carry cardiac, craniofacial and
  neurodevelopmental features from the other deleted genes, so they are a
  different entity that happens to include FLI1 loss. They are curated as a
  differential diagnosis instead, which is also the clinically operative
  relationship — distinguishing them is what a molecular diagnosis achieves.

  A point curators should preserve. The bleeding in this disorder is
  disproportionate to the platelet count, because FLI1 loss degrades platelet
  quality as well as quantity: a third of the reported dominant cohort had a
  normal count. Do not curate this as a thrombocytopenia whose bleeding follows
  from the low count; the pathograph separates the quantitative arm (impaired
  thrombopoiesis) from the qualitative arm (granule and secretion defect) on
  purpose.

  Evidence base. Small and heterogeneous: one sequencing study of a
  phenotypically selected bleeding cohort, one consanguineous family, and one
  induced pluripotent stem cell model. No treatment evidence specific to FLI1
  disease exists, so no treatments block is curated; management follows general
  inherited platelet disorder principles.

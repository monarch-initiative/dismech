  evidence:
  - reference: PMID:26316623
    reference_title: "Paris-Trousseau thrombocytopenia is phenocopied by the autosomal recessive inheritance of a DNA-binding domain mutation in FLI1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutation caused a transcription defect at the promoter of known FLI1
      target genes GP6, GP9, and ITGA2B, as measured by luciferase assay in HEK293
      cells, and decreased the expression of these target proteins in affected
      members of the family as measured by Western blotting of platelet lysates.
    explanation: >-
      Demonstrates the transactivation failure at named target promoters and
      confirms reduced target protein in patient platelets.
  downstream:

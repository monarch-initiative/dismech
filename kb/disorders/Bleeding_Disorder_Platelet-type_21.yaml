- name: Loss of FLI1 Target Gene Transactivation
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    FLI1 directly transactivates the promoters of platelet genes required for
    adhesion, aggregation and granule biology — GP6 (the collagen receptor
    glycoprotein VI), GP9 (part of the von Willebrand factor receptor complex)
    and ITGA2B (integrin alpha-IIb). The recessive allele was shown to cause a
    transcription defect at all three promoters by luciferase assay, and, more
    tellingly, to reduce the corresponding proteins in platelets taken from
    affected family members. The promoter assay and the patient Western blot are
    what make this a demonstrated mechanism rather than an inferred one.

genetic:
- name: NHP2
  gene_term:
    preferred_term: NHP2
    term:
      id: hgnc:14377
      label: NHP2
  relationship_type: CAUSATIVE
  notes: >-
    NHP2 (5q35.3), formerly NOLA2, encodes a small basic protein of the box H/ACA
    ribonucleoprotein. It has no catalytic activity; its contribution is
    structural, docking through NOP10 and contacting the telomerase RNA directly
    in the resolved holoenzyme structures. ClinGen's Interstitial Lung Disease
    expert panel classifies the NHP2 - dyskeratosis congenita autosomal recessive
    2 relationship as Limited, reaffirmed in August 2025 after the additional
    case and functional data of PMID:37440454 and PMID:31985013 did not change
    it. Limited is a statement about the quantity of evidence, not a doubt about
    the mechanism, and it is the honest headline for a gene with four curated
    probands.
  variants:
  - name: c.376G>A (p.Val126Met) in trans with c.460T>A (p.Ter154Arg)
    description: >-
      Compound heterozygous genotype of a long-followed patient. V126M is one of
      the two alleles shown to impair NOP10 association; the second is a
      stop-loss extension.
  - name: c.415T>C (p.Tyr139His), homozygous
    description: >-
      Homozygous genotype in two siblings of a consanguineous family, with both
      parents heterozygous. Y139H is the other allele shown to impair NOP10
      association and H/ACA pre-ribonucleoprotein assembly.
  - name: p.Ala39Thr in trans with p.Thr44Met
    description: >-
      Compound heterozygous genotype of an adult with myelodysplastic syndrome
      and gastric cancer. Both variants sit in the N-terminal region and are
      mis-incorporated into the H/ACA complex, then degraded by the proteasome.
  evidence:
  - reference: PMID:18523010
    reference_title: Mutations in the telomerase component NHP2 cause the premature ageing syndrome dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified previously uncharacterized NHP2 mutations that can cause
      autosomal recessive dyskeratosis congenita but have not found any GAR1
      mutations.
    explanation: >-
      The gene-disease claim as first made, with the negative result for the
      fourth core protein in the same sentence.
  - reference: PMID:30472699
    reference_title: "Long-Term Follow-Up of a Case with Dyskeratosis Congenita Caused by NHP2-V126M/X154R Mutation: Genotype-Phenotype Association."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient with NHP2 gene mutation (compound heterozygote for the NHP2
      mutations c.376G>A/c.460T>A; amino acid substitutions: p.Val126Met and
      p.X154Arg) that occurred as a compound heterozygous state
    explanation: The compound heterozygous genotype of the long-followed patient.
  - reference: PMID:40352450
    reference_title: "Siblings with a Homozygous Variant in the NHP2 Gene: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome sequencing revealed a c.415T>C (p.Tyr139His) disease-causing variant
      in the NHP2 gene
    explanation: The homozygous allele in the consanguineous sibship.
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      | NHP2 | HGNC:14377 | dyskeratosis congenita, autosomal recessive 2 |
      MONDO:0013519 | AR | Limited | SOP11 | Interstitial Lung Disease Gene
      Curation Expert Panel | 2025-08-01T16:00:00.000Z |
    explanation: >-
      The ClinGen gene-disease validity row, which is also what ties this gene to
      this MONDO identifier.
biochemical:
- name: Telomerase RNA component (TERC) level in peripheral blood
  notes: >-
    Low TERC in peripheral blood was the measurement that placed NHP2 in the
    telomerase pathway in humans. It is a research assay; the clinical test is
    leukocyte telomere length.
  evidence:
  - reference: PMID:18523010
    reference_title: Mutations in the telomerase component NHP2 cause the premature ageing syndrome dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      have all been shown to have low levels of telomerase RNA in their
      peripheral blood, providing direct evidence of their role in telomere
      maintenance in humans
    explanation: The patient-level TERC measurement.
- name: Leukocyte telomere length by flow-FISH
  notes: >-
    Multicolour flow-FISH on lymphocyte subsets is the diagnostic assay across
    the telomere biology disorders, with results below the first percentile for
    age supporting the diagnosis. In a child presenting with developmental delay,
    cataracts and cytopenias it is the test that reframes the differential.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A majority of individuals with DC/TBD have abnormally short telomeres for
      their age, as determined by multicolor flow cytometry fluorescence in situ
      hybridization (flow-FISH) on lymphocyte subsets.
    explanation: The GeneReviews diagnostic-testing statement.
treatments:
- name: Hematopoietic cell transplantation
  description: >-
    The only curative option for marrow failure and leukaemia in the telomere
    biology disorders. The toxicity caveat is not generic: the same telomere
    defect is present in every tissue the conditioning regimen exposes. The one
    reported NHP2 patient to be transplanted rejected the first graft and died of
    Epstein-Barr virus infection after the second.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Hematopoietic Stem Cell Exhaustion
    description: >-
      Replaces the exhausted stem cell compartment. It does nothing for the
      hepatic, neurological, ocular or solid-tumour risk arising in tissues the
      graft does not reach.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hematopoietic cell transplantation (HCT) is the only curative treatment for
      BMF and leukemia, but long-term outcome has historically been poor due to
      treatment toxicity; if a suitable donor is not available, androgen therapy
      may be considered for BMF.
    explanation: The GeneReviews management statement with its toxicity caveat.
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient underwent allogeneic bone marrow transplantations but rejected
      the graft and, after a second transplantation, unfortunately died of
      Epstein–Barr virus infection.
    explanation: The transplant outcome in the only reported NHP2 recipient.
- name: Androgen therapy
  description: >-
    Considered for marrow failure when no suitable donor is available. It
    requires monitoring of blood count, liver function, liver ultrasound and
    endocrine status — the liver items matter more than usual in a disorder that
    carries its own hepatic risk. Androgens must not be combined with granulocyte
    colony-stimulating factor.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Androgen Therapy
    term:
      id: NCIT:C15482
      label: Androgen Therapy
  target_mechanisms:
  - target: Hematopoietic Stem Cell Exhaustion
    description: >-
      Improves counts in marrow failure. No NHP2 patient has been reported on
      androgen therapy, so this is genotype-level management inherited from the
      disorder family.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the combination of androgens and granulocyte colony-stimulating factor in
      treatment of BMF (has been associated with splenic rupture)
    explanation: The drug-safety warning from the GeneReviews avoidance list.
- name: Marrow failure surveillance
  description: >-
    Complete blood count annually if normal and more often if abnormal, with
    annual bone marrow aspirate and biopsy. In this genotype the schedule should
    start at diagnosis and not wait for the mucocutaneous triad, which the
    reported patients developed years after their cytopenias.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For BMF: complete blood count (CBC) annually if normal and more often if
      abnormal; annual bone marrow aspirate and biopsy.
    explanation: The GeneReviews marrow surveillance schedule.
- name: Cancer surveillance
  description: >-
    Monthly self-examination for oral, head and neck cancer, annual screening by
    an otolaryngologist and a dermatologist, and annual gynaecological
    examination, with six-monthly dental review and avoidance of smoking and
    excessive sun exposure. This is the reason cancer predisposition is carried on
    this entry rather than deferred to the parent: surveillance is recommended on
    the basis of genotype, and a family given an NHP2 result needs the schedule
    whether or not a malignancy has yet been reported in that genotype.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For cancer risk: monthly self-examination for oral, head, and neck cancer;
      annual cancer screening by an otolaryngologist and dermatologist; annual
      gynecologic examination.
    explanation: The GeneReviews cancer surveillance schedule.
- name: Pulmonary function surveillance
  description: >-
    Annual pulmonary function testing from diagnosis or from about age eight,
    when a child can perform the test. Worth noting that interstitial lung
    disease has not been observed in the biallelic NHP2 entity, so this is
    disorder-family surveillance rather than a genotype-specific expectation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

name: Dyskeratosis Congenita Autosomal Recessive 2
creation_date: "2026-09-24T18:00:00Z"
category: Mendelian
description: >-
  Dyskeratosis congenita autosomal recessive 2 (DKCB2) is the telomere biology
  disorder caused by biallelic variants in NHP2. NHP2 is one of the four core
  proteins — with dyskerin, NOP10 and GAR1 — that assemble co-transcriptionally
  on box H/ACA RNAs. The telomerase RNA component TERC carries an H/ACA domain,
  so the same complex that matures small nucleolar RNAs also binds and stabilises
  TERC. The disease-associated NHP2 variants do not abolish the protein's
  catalytic role, because it has none; they compromise its incorporation into the
  H/ACA ribonucleoprotein, and NHP2 that fails to be incorporated is degraded by
  the proteasome. TERC steady-state levels fall, telomerase activity falls, and
  telomeres shorten faster than division can be sustained in the
  highest-turnover tissues — marrow, mucosa, skin appendages. The clinical
  picture is that of the dyskeratosis congenita spectrum: bone marrow failure,
  the mucocutaneous triad of nail dystrophy, reticulate skin pigmentation and
  oral leukoplakia, and in the reported patients intellectual disability, liver
  disease, cataracts and intracranial calcification, with malignancy reported in
  adulthood. Because the H/ACA complex is also required for ribosomal RNA
  maturation, NHP2 deficiency measurably impairs rRNA biogenesis, which is a
  candidate explanation for the features that short telomeres alone do not
  predict. Fewer than ten families have been reported and ClinGen classifies the
  gene-disease relationship as Limited.
synonyms:
- DKCB2
- dyskeratosis congenita, autosomal recessive 2
- NHP2-related dyskeratosis congenita
- NOLA2-related dyskeratosis congenita

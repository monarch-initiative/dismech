- name: Genetic counseling
  description: >-
    Parents of an affected child are obligate carriers with a 25% recurrence risk
    in each pregnancy. Relatives being considered as transplant donors must be
    tested — for the familial variants where known, or by telomere length — before
    donating, because a heterozygous sibling donor may have a telomere defect of
    their own. Family members should not donate blood if transplantation is
    contemplated.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

      evaluated as a potential HCT donor, telomere length testing – or, if the
      pathogenic variant(s) in the family are known, molecular genetic testing –
      is warranted.
    explanation: The GeneReviews evaluation-of-relatives-at-risk statement.
discussions:
- discussion_id: gap_dkcb2_rrna_versus_telomere
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the extra-haematopoietic features of DKCB2 follow from telomere
    attrition, and which from the ribosomal RNA biogenesis defect?
  attaches_to:
  - "pathophysiology#Ribosomal RNA Biogenesis Impairment"
  - "pathophysiology#Extra-Hematopoietic Tissue Dysfunction"
  rationale: >-
    Intellectual disability, infantile cataract and intracranial calcification
    are not what a pure short-telomere phenotype predicts, and most people with
    dyskeratosis congenita have normal neurological function. NHP2 deficiency
    demonstrably impairs rRNA biogenesis, which makes a ribosomopathy-like arm
    the obvious candidate, and the authors of the H/ACA assembly study argued in
    exactly that direction — that some of the disorders in dyskeratosis congenita
    may come from alteration of H/ACA ribonucleoproteins generally rather than
    from the telomerase arm alone. Nothing separates the two: no NHP2 patient has
    had ribosome biogenesis and telomere length measured against the presence or
    absence of the neurological features, and with four curated probands the
    cohort to do it in does not exist. The distinction is not academic. A
    telomere-directed therapy that restored TERC would be expected to help the
    marrow and leave a ribosomal arm untouched.
  proposed_experiments:
  - experiment_id: exp_dkcb2_rrna_in_patient_cells
    name: rRNA processing profiling across NHP2 genotypes
    description: >-
      Measure pre-rRNA processing intermediates and telomere length in primary
      cells from each reported NHP2 genotype, and test whether the magnitude of
      the rRNA defect tracks the neurological and ocular features rather than the
      haematological ones.
    would_support:
    - "pathophysiology#Ribosomal RNA Biogenesis Impairment"
- discussion_id: gap_dkcb2_cancer_risk_unquantified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the cancer risk in biallelic NHP2 disease, and does it differ from
    the telomere biology disorders generally?
  attaches_to:
  - "pathophysiology#Clonal Evolution in the Failing Marrow"
  - "phenotypes#Gastric carcinoma"
  rationale: >-
    One myelodysplastic syndrome and one gastric carcinoma have been reported in
    a single NHP2 patient. That is enough to say the risk is not obviously absent
    and nowhere near enough to quantify it, or to say whether the tumour spectrum
    differs from the head-and-neck and anogenital squamous cancers that dominate
    the disorder family. Cohort studies that produce cumulative cancer incidence
    for inherited bone marrow failure syndromes are powered on the common
    genotypes; four probands will not appear in them separately. The practical
    consequence is that surveillance in DKCB2 has to be prescribed on the
    disorder-family schedule, which is what this entry does, and that a family
    asking for a number cannot be given one.
  proposed_experiments:
  - experiment_id: exp_dkcb2_registry_pooling
    name: Pooled telomere biology disorder registry analysis by gene
    description: >-
      Pool the international inherited bone marrow failure and telomere biology
      registries and report cancer incidence stratified by causal gene, so that
      the rare H/ACA-complex genotypes are reported as a group with their own
      confidence intervals rather than absorbed into an all-genotype figure.
- discussion_id: gap_dkcb2_heterozygote_risk
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do heterozygous NHP2 carriers — including the parents of an affected child —
    have a telomere-related disease risk of their own?
  attaches_to:
  - "genetic#NHP2"
  rationale: >-
    Heterozygous NHP2 variants have been reported in adults with pulmonary
    fibrosis, and in one of those patients a somatic TERT promoter mutation
    appeared to give a subset of blood cells a selective advantage, which is the
    behaviour of a compartment under telomere stress rather than of a neutral
    carrier state. Against that, ClinGen excluded the heterozygous cases from its
    curation on the grounds of population frequency and insufficient genotyping
    detail. Both readings are defensible on the published evidence. It matters at
    the point of counselling — obligate-carrier parents of a DKCB2 child would be
    told something different under each — and again when a parent or sibling is
    considered as a transplant donor.
  proposed_experiments:
  - experiment_id: exp_dkcb2_carrier_telomere_lengths
    name: Telomere length and pulmonary phenotyping of obligate NHP2 carriers
    description: >-
      Measure leukocyte telomere length and pulmonary function in the obligate
      heterozygous parents of reported biallelic NHP2 patients, against
      age-matched controls, and follow them prospectively for interstitial lung
      disease.
    would_support:
    - "genetic#NHP2"
notes: >-
  Scope and lump/split. This entry is biallelic NHP2 telomere biology disease.
  It is a standalone file rather than content added to Dyskeratosis_Congenita,
  following the precedent already set on main by
  Dyskeratosis_Congenita_Autosomal_Recessive_6 (PARN) and
  Dyskeratosis_Congenita_Autosomal_Recessive_8. Those two entries and the parent
  divide the material in a particular way and this one keeps to it: the parent
  carries the disorder-family pathograph — impaired telomere maintenance,
  critically short telomeres, stem cell exhaustion — plus a short gene-keyed
  has_subtypes row for each causal gene, including NHP2, and the numbered entries
  carry the gene-specific upstream mechanism that the family-level chain cannot
  express. Here that is the H/ACA ribonucleoprotein assembly step: NHP2 reaches
  the telomere only because the telomerase RNA happens to be an H/ACA RNA, which
  is also why the same lesion hits ribosomal RNA. The parent's NHP2 has_subtypes
  row is deliberately left in place, exactly as the parent's PARN row was left in
  place when the PARN entry was written; it is a pointer, not a duplicate.

  Cancer predisposition is carried here, not deferred to the parent. Two reasons.
  A genetically confirmed NHP2 patient has been reported with myelodysplastic
  syndrome and gastric carcinoma, so the claim is not purely inherited from the
  disorder family; and the surveillance that follows is prescribed on genotype,
  which means the family holding an NHP2 result needs it on the page that
  describes their result. What is deliberately not here is a number. No
  NHP2-specific cancer incidence, cumulative risk or standardised incidence ratio
  has been published, the whole curated literature is four probands, and a figure
  borrowed from an all-genotype dyskeratosis congenita cohort would be presented
  as something it is not. The gap is recorded as a discussion rather than filled.

  Relationship to the marrow failure records. Bone_Marrow_Failure_IEIs already
  accounts for NHP2 in its rationale, as one of the telomerase-ribonucleoprotein
  genes of IUIS Table 9, and does not list it as missing, so no grouping change
  follows from this entry. Inherited_Aplastic_Anemia is a Disease entry rather
  than a grouping and is not a member list, so there is nothing there to update
  either.

  Module conformance. Two nodes declare conforms_to against telomere_attrition,
  at the attrition and the senescence steps. The upstream nodes deliberately do
  not: H/ACA assembly failure and rRNA biogenesis impairment are not steps in
  that module and conforming them would assert a correspondence that does not
  exist.

  What is deliberately absent. No datasets: block — searching NHP2 retrieves the
  ribosome-biogenesis and cancer-expression literature far more readily than the
  handful of telomere patients, and no DKCB2-specific dataset was identified. No
  clinical_trials: block — no interventional trial keyed to biallelic NHP2
  disease was found, and listing a general dyskeratosis congenita trial would
  misattribute it. No animal_models: block — no NHP2 animal model of the human
  biallelic disease has been reported; the functional work is in human cells. No
  environmental: block. Frequency values are given only where more than one
  patient supports them, which is why several features that are certainly real in
  the reported patients carry no frequency at all.

  Evidence provenance. Several quoted items carry quote_role: BACKGROUND or
  REVIEW_SYNTHESIS. With four curated probands, most general statements about
  this disease appear in the introductions of molecular papers or in a
  GeneReviews chapter about the disorder family rather than in a cohort study of
  DKCB2. Recording where in the citing document each quote sits is what keeps
  those claims honest.

  Two reports were read and deliberately not cited. PMID:36943377 (idiopathic
  non-cirrhotic portal hypertension with a rare NHP2 variant) and PMID:40073202
  (expanding the clinical spectrum of NHP2-related dyskeratosis congenita) are
  both directly on topic, and neither has any retrievable text beyond its title —
  the publishers release no abstract. Quoting a title is not quoting a finding,
  so the features they report are absent from this entry. A curator with
  institutional access to either should expect to add phenotypes.

  Features recorded only in OMIM's clinical synopsis. The homozygous p.Tyr139His
  proband of the founding report is described in secondary sources as having
  testicular atrophy, growth retardation, recurrent opportunistic infection and
  intracranial calcification, and those features populate the Monarch phenotype
  list for this MONDO term. The Vulliamy abstract does not enumerate them and the
  full text was not retrievable here, so they are not curated as phenotypes:
  every phenotype in this entry is quoted from a source in the reference cache.
  Cerebral calcification is present because the 2025 sibling report states it
  independently. Anyone with access to the PNAS full text should expect to add
  the remainder.

  GeneReviews. PMID:20301779, Dyskeratosis Congenita and Related Telomere Biology
  Disorders, is the baseline chapter and is tagged in references:. It covers the
  disorder family; there is no NHP2-specific chapter, exactly as for the PARN and
  AR8 entries. Its clinical-characteristics list was cross-checked against the
  phenotypes here. Features it names that no NHP2 patient has been reported to
  have — taurodontism, gastrointestinal telangiectasia, the ocular-surface and
  lid findings, avascular necrosis, pulmonary fibrosis, squamous cell carcinoma —
  are not curated as phenotypes of this entry. The surveillance those features
  drive is curated under treatments, where it belongs, because surveillance is
  recommended on genotype rather than on manifestation.

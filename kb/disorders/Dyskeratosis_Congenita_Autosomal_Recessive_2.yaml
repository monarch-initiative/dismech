inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    DKCB2 requires two defective NHP2 alleles; reported genotypes are compound
    heterozygous and, in a consanguineous family, homozygous. Parents of an
    affected child are obligate heterozygotes and each future sibling has a 25%
    recurrence risk. The zygosity line is not purely academic here: heterozygous
    NHP2 variants have been reported in adults with pulmonary fibrosis and in
    families with other telomere-biology features, but ClinGen's Interstitial
    Lung Disease expert panel excluded those heterozygous cases from the
    gene-disease curation because of population frequencies and incomplete
    genotyping detail, so an autosomal dominant NHP2 entity is not established.
  evidence:
  - reference: PMID:20301779
    reference_title: Dyskeratosis Congenita and Related Telomere Biology Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Autosomal recessive: CTC1, NHP2, NOP10, POT1, STN1, and WRAP53.
    explanation: >-
      GeneReviews assigns NHP2 to the autosomal recessive group of the telomere
      biology disorders.
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ClinGen Interstitial Lung Disease GCEP has decided to exclude
      heterozygous cases from this curation due to high population frequencies
      and/or lack of sufficient detail regarding genotyping.
    explanation: >-
      The reason the curated entity is recessive-only, stated by the panel that
      made the call.
  - reference: PMID:40352450
    reference_title: "Siblings with a Homozygous Variant in the NHP2 Gene: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome sequencing revealed a c.415T>C (p.Tyr139His) disease-causing variant
      in the NHP2 gene in the index case that was heterozygous in the parents and
      homozygous in the index case and her older brother.
    explanation: >-
      Segregation in a consanguineous family: unaffected heterozygous parents,
      two homozygous affected siblings, which is the recessive pattern.
prevalence:
- population: Unrelated telomere biology disorder patients reported worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven pathogenic NHP2 variants had been reported in unrelated patients as of
    the 2023 review, and ClinGen counted four probands across three publications
    with case-level data at its 2025 reappraisal. No population prevalence has
    been published, and no denominator exists from which one could be derived.
  evidence:
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In particular, seven different pathogenic NHP2 (OMIM #613987) variants have
      been identified in unrelated TBDs patients
    explanation: >-
      The published variant count. The sentence is this paper's introduction
      summarising the prior literature rather than its own result.
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evidence supporting this gene-disease relationship includes case-level data
      from 3 different publications describing a total of 4 probands
    explanation: >-
      The proband count ClinGen was able to use, which is the best available
      statement of how much of this disease has been observed.
progression:
- phase: Early childhood presentation
  notes: >-
    The reported paediatric presentations are not the classic triad. In the
    consanguineous sibship the index patient came to attention at two years with
    inability to walk, decreased vision from cataracts and developmental delay,
    and the nails, mucosa and skin were unremarkable at that point. ClinGen
    records ages of onset in both childhood and adulthood for this gene-disease
    entity, so a normal mucocutaneous examination in a young child does not argue
    against the diagnosis.
  evidence:
  - reference: PMID:40352450
    reference_title: "Siblings with a Homozygous Variant in the NHP2 Gene: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A two-year-old girl (index patient) was admitted to our hospital with
      complaints of inability to walk and decreased vision, as well as
      developmental delay and cataracts.
    explanation: >-
      The presenting picture at two years, which is neurological and ophthalmic
      rather than haematological or mucocutaneous.
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      4 probands with ages of onset being reported in both childhood and
      adulthood
    explanation: The age-of-onset range across the curated probands.
- phase: Mucocutaneous triad emerging after the systemic features
  notes: >-
    The triad is a late sign in this genotype rather than the entry point.
    Followed for eight years, the index child accumulated intellectual
    disability, liver disease, pancytopenia, nail dystrophy and multiple foci of
    intracranial calcification; her brother, already eighteen at presentation
    with cataracts, intellectual disability, cirrhosis, pancytopenia and
    hypersplenism, developed nail dystrophy, oral leukoplakia, greying hair and
    reticulate neck pigmentation only in the two years before the report. For a
    paediatrician this is the practical point of the entry: waiting for the triad
    postpones the diagnosis past the onset of marrow failure and liver disease.
  evidence:
  - reference: PMID:40352450
    reference_title: "Siblings with a Homozygous Variant in the NHP2 Gene: A Case Report and Review of Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 8 years of follow-up, the index patient was identified with
      additional findings that included intellectual disability, liver disease,
      pancytopenia, nail dystrophy, multiple foci of calcification on magnetic
      resonance imaging of the brain, while over the past 2 years, her brother
      developed nail dystrophy, oral leucoplakia, graying hair, and reticular
      pigmentation on his neck.
    explanation: >-
      Dates the appearance of the mucocutaneous features relative to the systemic
      ones within a single family.
- phase: Adult-onset marrow failure and malignancy
  notes: >-
    At the other end of the reported range, one compound heterozygote was
    diagnosed at 38 with gastric cancer and low-risk myelodysplastic syndrome and
    only later, as the cytopenia worsened, showed nail dystrophy, grey hair,
    tooth loss and oral leukoplakia with falling marrow cellularity. He died of
    Epstein-Barr virus infection after a second allogeneic transplant.
  evidence:
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index patient with no family history of MDS was diagnosed at age 38
      with gastric cancer and low-risk MDS, with normal karyotype (46,XY[20]).
    explanation: The adult end of the reported onset range, in a confirmed NHP2 patient.
- phase: Hoyeraal-Hreidarsson severity
  notes: >-
    Biallelic NHP2 missense variants have also produced Hoyeraal-Hreidarsson
    syndrome, the severe end of the dyskeratosis congenita spectrum, in one
    reported case. The individual Hoyeraal-Hreidarsson features in that patient
    are not curated as phenotypes of this entry because the abstract available
    for that report does not enumerate them.
  evidence:
  - reference: PMID:31985013
    reference_title: NHP2 deficiency impairs rRNA biogenesis and causes pulmonary fibrosis and Høyeraal-Hreidarsson syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the first case of Høyeraal-Hreidarsson syndrome, the severe
      form of DC, caused by biallelic missense mutations in NHP2.
    explanation: >-
      Establishes that the genotype can reach the severe end of the spectrum,
      without importing features the source does not list.
pathophysiology:
- name: NHP2 Loss and Failed Incorporation into the H/ACA Complex
  biological_scale: MOLECULAR
  description: >-
    Biallelic NHP2 variants are missense changes or a stop-loss extension rather
    than clean nulls, and the lesion they cause is one of assembly rather than of
    catalysis: NHP2 has no enzymatic activity of its own. Variant NHP2 that
    cannot compete with wild-type protein for a place in the H/ACA complex is
    degraded by the proteasome, so the measurable defect in cells is reduced NHP2
    protein. The mechanism is understood as loss of function, although ClinGen
    records that it has not been formally established.
  genes:
  - preferred_term: NHP2
    term:
      id: hgnc:14377
      label: NHP2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: H/ACA Ribonucleoprotein Assembly Failure
    causal_link_type: DIRECT
    description: >-
      NHP2 enters the H/ACA complex through NOP10; variants that cannot dock are
      lost, so the complex assembles less efficiently on its RNA substrates.
    evidence:
    - reference: PMID:37440454
      reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Furthermore, both variants fail to be incorporated in the H/ACA RNA
        binding complex when in competition with wild-type endogenous NHP2, and
        the lack of incorporation causes their drastic proteasomal degradation.
      explanation: >-
        The two steps of this edge measured in the same experiment: failure of
        incorporation, then destruction of what was not incorporated.
  evidence:
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Seven variants (6 missense, and 1 stop-loss extension) have been reported
      in humans.
    explanation: >-
      The allelic spectrum, which is what makes an assembly defect rather than a
      null the right description of the lesion.
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism is unclear but thought to be LOF.
    explanation: >-
      ClinGen's own hedge on the mechanism, recorded rather than smoothed over.
- name: H/ACA Ribonucleoprotein Assembly Failure
  biological_scale: MOLECULAR
  description: >-
    The dyskerin-NOP10-NHP2-NAF1 tetramer assembles on nascent box H/ACA RNAs.
    Two of the dyskeratosis congenita NHP2 variants, V126M and Y139H, impair the
    association with NOP10, and the consequence measured in cells is a major
    defect in pre-ribonucleoprotein assembly on every H/ACA RNA tested, including
    the H/ACA domain of the telomerase RNA. This is the step that couples a
    housekeeping RNA-modification complex to telomere biology: the telomerase RNA
    is an H/ACA RNA, so it fails with the others rather than through a separate
    telomere-specific route.
  biological_processes:
  - preferred_term: box H/ACA snoRNP assembly
    modifier: DECREASED
    term:
      id: GO:0000493
      label: box H/ACA snoRNP assembly
  downstream:
  - target: TERC Depletion and Telomerase Insufficiency
    causal_link_type: DIRECT
    description: >-
      The H/ACA proteins stabilise TERC; when the complex does not assemble on
      it, steady-state TERC falls.
    evidence:
    - reference: PMID:18523010
      reference_title: Mutations in the telomerase component NHP2 cause the premature ageing syndrome dyskeratosis congenita.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SiRNA-mediated knockdown of NHP2 in human cells led to low TERC levels,
        but this reduction was not observed after GAR1 knockdown.
      explanation: >-
        Isolates NHP2 as the component whose loss lowers TERC, with GAR1
        knockdown as the internal negative control.
  - target: Ribosomal RNA Biogenesis Impairment
    causal_link_type: DIRECT
    description: >-
      The same complex matures ribosomal RNA, so the assembly defect is not
      confined to the telomerase arm.
  evidence:
  - reference: PMID:20008900
    reference_title: "Effects of dyskeratosis congenita mutations in dyskerin, NHP2 and NOP10 on assembly of H/ACA pre-RNPs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, NHP2 mutations V126M and Y139H impaired association with
      NOP10, leading to major pre-RNP assembly defects with all H/ACA RNAs
      tested, including the H/ACA domain of hTR.
    explanation: >-
      The assembly defect measured directly for patient NHP2 alleles, with the
      telomerase RNA named among the affected substrates.
  - reference: PMID:20008900
    reference_title: "Effects of dyskeratosis congenita mutations in dyskerin, NHP2 and NOP10 on assembly of H/ACA pre-RNPs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Altogether, our results suggest that, in addition to major defects in the
      telomere/telomerase pathways, some of the disorders occurring in DC may be
      caused by alteration of most H/ACA RNPs, or by only a subset of them.
    explanation: >-
      The authors' own argument that this node has consequences beyond the
      telomere arm, which is why the second downstream edge is drawn.
- name: TERC Depletion and Telomerase Insufficiency
  biological_scale: MOLECULAR
  description: >-
    TERC is the telomerase template and is rate-limiting. Patients with NHP2
    variants have low TERC in peripheral blood, as do patients with dyskerin and
    NOP10 variants, and the novel variants reduce telomerase activity in
    cell-based assays. The measurement in patient blood is what makes this a
    human claim rather than an inference from cell lines.
  biological_processes:
  - preferred_term: telomerase RNA stabilization
    modifier: DECREASED
    term:
      id: GO:0090669
      label: telomerase RNA stabilization
  molecular_functions:
  - preferred_term: telomerase activity
    modifier: DECREASED
    term:
      id: GO:0003720
      label: telomerase activity
  downstream:
  - target: Progressive Telomere Attrition
    causal_link_type: DIRECT
    description: >-
      Less telomerase means less repeat addition against the end-replication
      problem, so telomeres shorten with division.
  evidence:
  - reference: PMID:18523010
    reference_title: Mutations in the telomerase component NHP2 cause the premature ageing syndrome dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with dyskerin, NOP10, and now NHP2 mutations have all been shown
      to have low levels of telomerase RNA in their peripheral blood, providing
      direct evidence of their role in telomere maintenance in humans
    explanation: >-
      The TERC deficit measured in patients rather than in a model system, which
      the authors themselves offer as the human evidence for the mechanism.
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although still able to support cell viability, both variants reduce the
      levels of hTR, the telomerase RNA component, and telomerase activity,
      expanding the panel of NHP2 pathological variants.
    explanation: >-
      Confirms both arms — template level and enzyme activity — for two further
      patient alleles.
- name: Progressive Telomere Attrition
  biological_scale: CELLULAR
  conforms_to: "telomere_attrition#Progressive Telomere Attrition"
  description: >-
    Without adequate telomerase the end-replication problem is uncompensated and
    telomeres shorten with every division. In NHP2 patients leukocyte telomeres
    are short for age, which is the measurement the diagnosis rests on across the
    telomere biology disorders.
  cell_types:
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  biological_processes:
  - preferred_term: telomere maintenance
    modifier: DECREASED
    term:
      id: GO:0000723
      label: telomere maintenance
  downstream:
  - target: Telomere-Initiated Replicative Senescence
    causal_link_type: DIRECT
  - target: Short telomere length
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18523010
    reference_title: Mutations in the telomerase component NHP2 cause the premature ageing syndrome dyskeratosis congenita.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with NHP2 mutations, in common with patients bearing dyskerin and
      NOP10 mutations had short telomeres and low TERC levels.
    explanation: >-
      Pairs the telomere length and the template deficit in the same patients,
      which is the observation this node records.
- name: Telomere-Initiated Replicative Senescence
  biological_scale: CELLULAR
  conforms_to: "telomere_attrition#Telomere-Initiated DNA Damage and Replicative Senescence"
  description: >-
    Critically short telomeres are no longer protected and are sensed as DNA
    double-strand breaks; the resulting persistent damage response enforces
    replicative senescence or apoptosis. This is the conserved effector the
    telomere biology disorders converge on, and it is why tissue-level failure in
    DKCB2 falls first on the compartments with the highest replicative demand
    rather than on those where NHP2 is most expressed.
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  - preferred_term: replicative senescence
    modifier: INCREASED
    term:
      id: GO:0090399
      label: replicative senescence
  downstream:
  - target: Hematopoietic Stem Cell Exhaustion
    causal_link_type: DIRECT
  - target: Mucocutaneous Epithelial Renewal Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      telomeres progressively shorten during each cycle of cell division until
      they reach a critically short length, and cells enter into replicative
      senescence and/or apoptosis
    explanation: >-
      States the conserved step this node conforms to. The sentence is the citing
      paper's review of established telomere biology, not its own result.
- name: Ribosomal RNA Biogenesis Impairment
  biological_scale: MOLECULAR
  description: >-
    Box H/ACA ribonucleoproteins pseudouridylate ribosomal RNA, so an assembly
    defect reaches ribosome biogenesis as well as telomerase. A functional
    deficiency of human NHP2 demonstrably impairs rRNA biogenesis. This is the
    branch that makes DKCB2 more than a short-telomere phenotype, and it is the
    obvious candidate explanation for the features that telomere attrition alone
    does not predict — the cataracts, the intellectual disability, the
    intracranial calcification. That link is a hypothesis and not a demonstrated
    route, which is why the edge below is drawn with unknown intermediates.
  biological_processes:
  - preferred_term: ribosome biogenesis
    modifier: DECREASED
    term:
      id: GO:0042254
      label: ribosome biogenesis
  downstream:
  - target: Extra-Hematopoietic Tissue Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No experiment has connected the rRNA defect to the neurological, ocular or
      hepatic features in an NHP2 patient. The edge is drawn because the
      alternative — leaving the node unattached — would present the rRNA defect
      as having no consequence at all, which the severity of the reported
      phenotypes argues against.
  evidence:
  - reference: PMID:31985013
    reference_title: NHP2 deficiency impairs rRNA biogenesis and causes pulmonary fibrosis and Høyeraal-Hreidarsson syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, we demonstrate that a functional deficit of human NHP2 affects
      ribosomal RNA biogenesis.
    explanation: The measurement of the rRNA arm in human cells.
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      It is essential for the maturation of ribosomal RNA (rRNA) and small
      nuclear RNAs (snoRNAs)
    explanation: >-
      States the housekeeping role of the complex that makes this branch
      expected. Background framing in the citing paper, not its own result.
- name: Hematopoietic Stem Cell Exhaustion
  biological_scale: TISSUE
  description: >-
    The marrow fails first because it has the highest replicative demand and
    depends on telomerase to meet it. In the reported NHP2 patients this runs
    from pancytopenia through falling marrow cellularity to transfusion
    dependence, and in one adult to myelodysplastic syndrome.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  downstream:
  - target: Bone marrow failure
    causal_link_type: DIRECT
  - target: Pancytopenia
    causal_link_type: DIRECT
  - target: Clonal Evolution in the Failing Marrow
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: CGGV:assertion_a8fa9dcb-1cc6-43a2-8f86-e6cea0e6fce2-2025-08-01T160000.000Z
    reference_title: NHP2 / dyskeratosis congenita, autosomal recessive 2 (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NHP2 biallelic variant carriers present with features common to other
      monogenic telomere biology disorders (TBD) like: oral leukoplakia,
      reticular skin pigmentation, nail dystrophy, bone marrow failure,
      intellectual disability, and short telomeres.
    explanation: >-
      ClinGen's summary of what biallelic NHP2 carriers show, marrow failure
      among it.
- name: Mucocutaneous Epithelial Renewal Failure
  biological_scale: TISSUE
  description: >-
    Nails, oral mucosa and skin are renewed continuously and fail for the same
    reason the marrow does. In this genotype the triad is characteristically late
    — appearing in a child after eight years of systemic disease, and in an adult
    only as his cytopenia worsened — which is a diagnostic trap rather than a
    mechanistic difference.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  downstream:
  - target: Nail dystrophy
    causal_link_type: DIRECT
  - target: Oral leukoplakia
    causal_link_type: DIRECT
  - target: Reticulated skin pigmentation
    causal_link_type: DIRECT
  - target: Premature graying of hair
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37440454
    reference_title: "Novel pathological variants of NHP2 affect N-terminal domain flexibility, protein stability, H/ACA Ribonucleoprotein (RNP) complex formation and telomerase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further clinical investigation revealed nail dystrophies, gray hair, tooth
      loss and oral leukoplakia with a bone marrow cellularity between 30 and 40%
    explanation: >-
      The mucocutaneous features appearing alongside declining marrow
      cellularity in a genetically confirmed NHP2 patient.
- name: Clonal Evolution in the Failing Marrow
  biological_scale: CELLULAR
  description: >-
    A marrow under replicative stress with unprotected chromosome ends selects
    for clones that tolerate it, and the telomere biology disorders carry a
    recognised risk of myelodysplastic syndrome and acute myeloid leukaemia. In
    NHP2 specifically this is a single reported patient with low-risk
    myelodysplastic syndrome and a gastric carcinoma, so the risk is asserted
    here at the strength of one case plus the disorder-family literature, not as
    a quantified genotype-specific figure.

  neural invasion, and stromal exclusion of antitumor immunity. Liver and peritoneal
  spread
  are common terminal patterns.
mechanistic_hypotheses:
- hypothesis_group_id: ras_on_inhibitor_acquired_resistance
  hypothesis_label: Acquired Resistance to RAS(ON) Multiselective Inhibition
  status: EMERGING
  description: >-
    In RASolute 302 essentially all patients eventually progressed on
    daraxonrasib (median progression-free survival 7.3 months in the RAS G12
    population), implying that metastatic PDAC reliably acquires resistance to
    RAS(ON) multiselective, tri-complex inhibition. The molecular basis of that
    escape is unresolved for this drug class. Candidate mechanisms to evaluate
    include reactivation of RAS-MAPK signaling through receptor tyrosine kinase
    and feedback loops (e.g., EGFR, FGFR, SHP2/PTPN11) that restore downstream
    ERK activity despite RAS(ON) engagement; secondary or on-target RAS
    alterations and KRAS amplification that raise the inhibition threshold;
    bypass through PI3K-AKT-mTOR signaling; adaptive transcriptional or
    lineage plasticity (including mTOR/JUN-AP1 hyperactivation); a
    drug-class-specific loss of the cyclophilin A chaperone required for
    tri-complex
    formation; and RAS-independent proliferation in which the cell cycle
    uncouples from RAS signaling. Distinguishing which routes dominate, and
    whether they are pre-existing or selected under treatment, would define
    rational combination and sequencing strategies.
  evidence:
  - reference: PMID:42223072
    reference_title: Daraxonrasib or Chemotherapy in Previously Treated Metastatic Pancreatic Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median progression-free survival in the RAS G12 population was 7.3 months with daraxonrasib and 3.5 months with chemotherapy, and that in the overall population was 7.2 months and 3.6 months, respectively; the hazard ratios were 0.45 and 0.49, respectively (P<0.001 for both comparisons).
    explanation: >-
      The finite progression-free survival on daraxonrasib establishes that
      acquired resistance to RAS(ON) inhibition emerges in previously treated
      metastatic PDAC; the responsible mechanism is the open question this
      hypothesis frames.
  - reference: PMID:42465401
    reference_title: 'Overcoming Daraxonrasib Resistance: Allele-Specific Mechanisms Guide Salvage Therapy in Pancreatic Cancer.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, KRAS G12D resistance arose through retained KRAS G12D -GTP signaling, with a decrease of cyclophilin A (CypA) protein, the binding partner required for daraxonrasib activity.
    explanation: >-
      Direct daraxonrasib-specific, allele-stratified PDAC evidence for two
      resistance routes: retained RAS-GTP with loss of the cyclophilin A
      chaperone required for tri-complex activity (KRAS G12D) and
      EGFR/wild-type-RAS reliance (KRAS G12R) - the CypA route is a
      drug-class-specific
      mechanism absent from the original seed.
  - reference: PMID:41959066
    reference_title: Targeting Distinct Cell Cycle Nodes Overcomes KRAS/RAS Inhibitor Resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While these pathways can be broadly inhibited using the pan-RAS-ON inhibitor RMC-6236, cells remained capable of developing acquired resistance where cell proliferation is uncoupled from RAS signaling.
    explanation: >-
      Establishes RAS-independent cell-cycle continuation as a route of acquired
      resistance to daraxonrasib (RMC-6236) itself, restorable by co-targeting
      CDK4/6 and CDK2 - the hardest, RAS-independent resistance class.
  - reference: PMID:41572361
    reference_title: CRISPR knockout screens reveal JUN as the master mediator of resistance to MAPK inhibition in KRAS-mutant pancreatic cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Through unbiased CRISPR-based screenings, we identified mTOR and JUN hyperactivation as interconnected mechanisms that overcome MAPK suppression.
    explanation: >-
      CRISPR screens in KRAS-mutant PDAC (explicitly anticipating resistance to
      RAS(ON) multi-selective inhibitors) identify mTOR/JUN-AP1 hyperactivation
      as a convergent adaptive-transcriptional escape, with JUN targetable via
      MAP2K4 - supporting the seed's PI3K-mTOR and transcriptional-plasticity arms.
  - reference: PMID:41165456
    reference_title: RAS-GTP Inhibition Overcomes Acquired Resistance to KRASG12C Inhibitors Mediated by Oncogenic and Wild-Type RAS Activation in Non-Small Cell Lung Cancer.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Two models, which lacked any discernable genomic alteration, acquired resistance associated with increased receptor tyrosine kinase activity and downstream persistent RAS activity and were sensitive to RAS-GTP inhibition by RMC-7977.
    explanation: >-
      In NSCLC models (tool analog RMC-7977), both RAS-reactivating (amplification/
      secondary mutation) and RTK-feedback routes to G12C-inhibitor resistance
      remained sensitive to multiselective RAS(ON) inhibition - an important
      qualifier that the seed's on-target and RTK-bypass arms may often stay
      drug-targetable by deeper RAS(ON) engagement; PARTIAL because the context
      is NSCLC, not PDAC.
  notes: >-
    OpenScientist deep-research (2026-07-24) verdict: SUPPORTED that acquired
    resistance occurs (clinical anchor: finite PFS in RASolute 302), UNRESOLVED
    as to which route dominates in patients. All seed-named routes (RTK/feedback,
    on-target RAS reactivation/amplification, PI3K-AKT-mTOR, transcriptional/
    lineage plasticity) have direct or strong-analog support, and the search
    surfaced two mechanisms beyond the seed: drug-class-specific cyclophilin A
    (PPIA) downregulation (PMID:42465401) and RAS-independent cell-cycle
    uncoupling (PMID:41959066). Key caveat: RAS-reactivation and RTK-bypass often
    remain targetable by deeper multiselective RAS(ON) engagement, so the
    RAS-independent transcriptional/cell-cycle states (MYC, JUN/AP-1, CDK) are
    the hardest class. The dominant clinical mechanism is unresolved: no
    longitudinal ctDNA/rebiopsy dataset for daraxonrasib-treated PDAC exists yet.
    Full report and citations:
    kb/hypotheses/Metastatic_Pancreatic_Adenocarcinoma/ras_on_inhibitor_acquired_resistance/openscientist.md.
- hypothesis_group_id: ras_on_inhibition_immune_tme_remodeling
  hypothesis_label: RAS(ON) Inhibition Remodels the Immunosuppressive Microenvironment
  status: EMERGING
  description: >-
    Oncogenic RAS-MAPK signaling helps establish the immunosuppressive,
    T-cell-excluded microenvironment that renders metastatic PDAC refractory to
    immune checkpoint blockade. This hypothesis proposes that sustained RAS(ON)
    multiselective inhibition with daraxonrasib partially reverses that state -
    increasing tumor antigen presentation, relieving myeloid-derived suppressor
    and regulatory-T-cell dominance, and promoting effector T-cell infiltration
    - thereby opening a therapeutic window for combination with checkpoint
    inhibitors or other immunotherapies that single-agent approaches have not
    achieved in PDAC. The testable prediction is that daraxonrasib plus
    checkpoint blockade yields deeper and more durable responses than either
    alone, with the on-treatment tumor immune contexture as the pharmacodynamic
    readout.
  evidence:
  - reference: PMID:41670434
    reference_title: Abrogation of Oncogenic RAS Signaling by a RAS(ON) Inhibitor Doublet Primes Immune-Refractory KRASG12C-Mutant NSCLC for Immune Checkpoint Blockade.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: in immune-competent preclinical models, the RAS(ON) inhibitor doublet enhances tumor immune recognition by boosting antigen presentation and remodeling the suppressive tumor microenvironment, thus promoting immune-dependent complete regressions and sensitization of an immunorefractory model to checkpoint blockade.
    explanation: >-
      Direct demonstration of the hypothesis's causal chain using daraxonrasib
      (as part of a RAS(ON) inhibitor doublet) - immune remodeling plus
      checkpoint-blockade sensitization - but in KRAS-G12C NSCLC rather than
      PDAC, so it is the strongest daraxonrasib-specific support with an
      agent-in-wrong-disease caveat.
  - reference: PMID:37782788
    reference_title: Oncogenic dependency plays a dominant role in the immune response to cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Lowering KRAS activity in established tumors promotes immune infiltration, but with a limited antitumor effect, whereas combining KRAS/MEK inhibition with immune checkpoint blockade achieves durable regression in preclinical models.
    explanation: >-
      In PDAC models, RAS-pathway inhibition remodels immune infiltration but
      requires checkpoint-blockade combination for durable regression - the core
      testable prediction of this hypothesis.
  - reference: PMID:36824971
    reference_title: Oncogenic Kras(G12D) specific non-covalent inhibitor reprograms tumor microenvironment to prevent and reverse early pre-neoplastic pancreatic lesions and in combination with immunotherapy regresses advanced PDAC in a CD8(+) T cells dependent manner.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Regression of advanced PDAC requires CD8 + T cells and immune checkpoint blockade therapy (iCBT) synergizes with MRTX1133 to eradicate PDAC and prolong overall survival.
    explanation: >-
      Strongest PDAC-specific support for the full chain (myeloid relief, CD8
      effector infiltration, CAF reprogramming, CD8-dependent ICB synergy), but
      achieved with the G12D-selective MRTX1133 rather than multiselective
      daraxonrasib.
  - reference: PMID:42436354
    reference_title: CDK8 remodels the tumor microenvironment and promotes resistance to KRAS(G12D) inhibitors and daraxonrasib in PDAC.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: long-term treatment results in reversal of the immune responses leading to resistance promoted by multiprotein mediator complex associated kinase CDK8.
    explanation: >-
      Durability qualifier: the immune-remodeling window opened by KRAS-G12D
      inhibitors and daraxonrasib is transient and self-reverses via a
      CDK8-driven adaptive program, bounding the therapeutic window this
      hypothesis proposes.
  notes: >-
    OpenScientist deep-research (2026-07-24) verdict: PARTIALLY SUPPORTED. The
    core spine (oncogenic KRAS output -> immunosuppressive/T-cell-excluded TME ->
    reversal by RAS-pathway inhibition -> CD8-dependent checkpoint-blockade
    synergy) is well supported preclinically, but three caveats temper the seed
    claim: (1) daraxonrasib-specific immune-remodeling data are in NSCLC, while
    the PDAC immune data come from the G12D-selective MRTX1133, not daraxonrasib;
    (2) the antigen-presentation arm is largely autophagy(NBR1)/FAK-driven and
    only weakly RAS-owned, and no primary evidence was found that RAS/daraxonrasib
    inhibition relieves regulatory-T-cell dominance in PDAC (a source absence);
    (3) the daraxonrasib + checkpoint-blockade combination with an on-treatment
    immune-contexture readout is clinically untested. Full report and citations:
    kb/hypotheses/Metastatic_Pancreatic_Adenocarcinoma/ras_on_inhibition_immune_tme_remodeling/openscientist.md.

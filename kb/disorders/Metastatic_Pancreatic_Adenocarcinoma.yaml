name: Metastatic Pancreatic Adenocarcinoma
creation_date: '2026-03-28T21:15:00Z'
description: >-
  Metastatic pancreatic adenocarcinoma is pancreatic ductal adenocarcinoma that has
  disseminated to distant sites, most often liver, peritoneum, and lung. The disease
  is
  characterized by near-universal KRAS pathway activation, early cellular plasticity,
  dense desmoplastic stroma, neural invasion, profound immune suppression, and rapid
  systemic progression.
categories:
- Gastrointestinal Cancer
- Metastatic Cancer
- Solid Tumor
parents:
- pancreatic adenocarcinoma
disease_term:
  preferred_term: metastatic pancreatic adenocarcinoma
  term:
    id: MONDO:0006047
    label: pancreatic adenocarcinoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0006047
      label: pancreatic adenocarcinoma
    mapping_predicate: skos:closeMatch
    mapping_source: MONDO
    mapping_justification: Closest MONDO parent term available for metastatic pancreatic adenocarcinoma.
prevalence:
- population: Metastatic pancreatic ductal adenocarcinoma
  notes: The 5-year survival rate remains persistently low in PDAC, especially once metastatic dissemination is established.
  evidence:
  - reference: PMID:41814069
    reference_title: Early cellular plasticity promotes progression and dissemination in pancreatic adenocarcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Pancreatic ductal adenocarcinoma (PDAC) remains one of the most lethal malignancies, with limited therapeutic success and a persistently low 5-year survival rate.
    explanation: This supports the extremely poor long-term prognosis of metastatic pancreatic adenocarcinoma.
pathophysiology:
- name: KRAS-Centered Oncogenic Signaling
  description: >-
    KRAS signaling is the dominant oncogenic engine in pancreatic adenocarcinoma and
    drives
    proliferation, stress adaptation, invasion, and metastatic competence. Even KRAS-wildtype
    tumors often remain dependent on parallel kinase and fusion pathways.
  evidence:
  - reference: PMID:35302596
    reference_title: Molecular Characterization of KRAS Wild-type Tumors in Patients with Pancreatic Adenocarcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: KRAS mutation (MT) is a major oncogenic driver in pancreatic ductal adenocarcinoma (PDAC).
    explanation: This directly supports KRAS as the central driver pathway in PDAC.
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
- name: Early Dissemination and EMT
  description: >-
    Metastatic spread can begin early, before the primary tumor becomes clinically
    dominant.
    Cellular plasticity, EMT-like transitions, and squamous or mesenchymal programs
    enable
    escape from precursor and invasive lesions.
  evidence:
  - reference: PMID:41814069
    reference_title: Early cellular plasticity promotes progression and dissemination in pancreatic adenocarcinoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: We explore the biological and spatial-temporal evolution of precancerous lesions, such as PanINs and IPMNs, and examine how phenotypic plasticity and overlapping cellular programs-including squamous transdifferentiation, epithelial-to-mesenchymal transition (EMT), and acquisition of mesenchymal features-contribute to early dissemination, treatment resistance, and surgical failure.
    explanation: This directly supports EMT-linked early dissemination in pancreatic adenocarcinoma.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
- name: Perineural Invasion
  description: >-
    Pancreatic adenocarcinoma has marked neurotropism. Tumor cells track along nerves,
    exploit neurotrophic cues, and use neural routes as low-resistance corridors for
    local
    spread and distant metastatic behavior.
  evidence:
  - reference: PMID:35449152
    reference_title: HGF/c-Met pathway facilitates the perineural invasion of pancreatic cancer by activating the mTOR/NGF axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Perineural invasion (PNI) is a pathologic feature of pancreatic cancer and is associated with poor outcomes, metastasis, and recurrence in pancreatic cancer patients.
    explanation: This supports perineural invasion as a metastasis-associated feature of pancreatic cancer.
  biological_processes:
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
- name: Desmoplastic Stromal Remodeling
  description: >-
    A fibrotic, CAF-rich, immune-excluding stroma compresses vessels, impairs drug
    delivery,
    and creates a mechanically and metabolically favorable niche for metastatic progression.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: INCREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  - preferred_term: angiogenesis
    modifier: ABNORMAL
    term:
      id: GO:0001525
      label: angiogenesis
- name: Immune Evasion and Metastatic Selection
  description: >-
    Pancreatic adenocarcinoma develops profound immune suppression with myeloid dominance,
    T-cell exclusion, and checkpoint-indifferent metastatic outgrowth. These programs
    help
    disseminated clones survive in liver and peritoneal sites.
  biological_processes:
  - preferred_term: negative regulation of immune response
    modifier: INCREASED
    term:
      id: GO:0050777
      label: negative regulation of immune response
- name: Cyclophilin A Loss and Reduced Tri-Complex Engagement
  biological_scale: MOLECULAR
  description: >-
    Under daraxonrasib (RMC-6236) pressure, downregulation of cyclophilin A
    (PPIA) - the intracellular chaperone the drug must bind to assemble the
    RAS(ON)-engaging tri-complex - reduces on-target drug engagement while
    RAS-GTP signaling is retained. This is a drug-class-specific,
    KRAS-G12D-associated route of acquired resistance to tri-complex RAS(ON)
    inhibitors.
  genes:
  - preferred_term: PPIA
    term:
      id: hgnc:9253
      label: PPIA
  molecular_functions:
  - preferred_term: peptidyl-prolyl cis-trans isomerase activity
    modifier: DECREASED
    term:
      id: GO:0003755
      label: peptidyl-prolyl cis-trans isomerase activity
  evidence:
  - reference: PMID:42465401
    reference_title: 'Overcoming Daraxonrasib Resistance: Allele-Specific Mechanisms Guide Salvage Therapy in Pancreatic Cancer.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In contrast, KRAS G12D resistance arose through retained KRAS G12D -GTP signaling, with a decrease of cyclophilin A (CypA) protein, the binding partner required for daraxonrasib activity.
    explanation: >-
      Identifies CypA (PPIA) downregulation as a daraxonrasib-specific resistance
      route in KRAS-G12D PDAC, reducing tri-complex formation while RAS-GTP
      signaling persists.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: Reduced tri-complex engagement lets RAS-GTP signaling and proliferation resume despite continued dosing.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: RAS-Independent Cell-Cycle Uncoupling
  biological_scale: CELLULAR
  description: >-
    A RAS-independent escape in which cell-cycle progression becomes uncoupled
    from RAS-MAPK output, so tumor cells continue proliferating despite
    multiselective RAS(ON) inhibition. Co-targeting the cell-cycle kinases
    CDK4/6 and CDK2 restores sensitivity; this transcriptional/cell-cycle class
    of resistance is not reversed by deeper RAS inhibition alone.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:41959066
    reference_title: Targeting Distinct Cell Cycle Nodes Overcomes KRAS/RAS Inhibitor Resistance.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While these pathways can be broadly inhibited using the pan-RAS-ON inhibitor RMC-6236, cells remained capable of developing acquired resistance where cell proliferation is uncoupled from RAS signaling.
    explanation: >-
      Establishes RAS-independent cell-cycle continuation under daraxonrasib
      (RMC-6236) as a resistance route restorable by CDK4/6 and CDK2 co-targeting.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: Proliferation decoupled from RAS sustains tumor growth under continued RAS(ON) inhibition.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: Acquired RAS(ON) Inhibitor Resistance
  biological_scale: CELLULAR
  description: >-
    Convergent outcome node: tumor regrowth under daraxonrasib after an initial
    response, reflected clinically in the finite progression-free survival
    observed in RASolute 302. Multiple upstream routes converge here - cyclophilin
    A loss, RAS-independent cell-cycle uncoupling, RTK/feedback and on-target RAS
    reactivation, and mTOR/JUN-AP1 hyperactivation; which route dominates in
    patients is unresolved (no longitudinal daraxonrasib resistance dataset yet).
  evidence:
  - reference: PMID:42223072
    reference_title: Daraxonrasib or Chemotherapy in Previously Treated Metastatic Pancreatic Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median progression-free survival in the RAS G12 population was 7.3 months with daraxonrasib and 3.5 months with chemotherapy, and that in the overall population was 7.2 months and 3.6 months, respectively; the hazard ratios were 0.45 and 0.49, respectively (P<0.001 for both comparisons).
    explanation: >-
      The finite progression-free survival on daraxonrasib is the clinical
      readout of the acquired resistance that the upstream routes converge on.
- name: On-Target RAS Reactivation and KRAS Amplification
  biological_scale: MOLECULAR
  description: >-
    Restoration of RAS-GTP above the inhibition threshold via KRAS amplification
    or a secondary/second-site RAS mutation. Because multiselective RAS(ON)
    inhibitors suppress mutant and wild-type RAS, many such routes often remain
    targetable by deeper engagement, so amplification must raise the threshold
    substantially to drive durable escape.
  evidence:
  - reference: PMID:41165456
    reference_title: RAS-GTP Inhibition Overcomes Acquired Resistance to KRASG12C Inhibitors Mediated by Oncogenic and Wild-Type RAS Activation in Non-Small Cell Lung Cancer.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Two models reactivated RAS signaling, either via KRASG12C gene amplification or NRASG13R mutation, and were vulnerable to dual inhibition by RAS(ON) G12C-selective and RAS(ON) multiselective inhibitors, RMC-4998 and RMC-7977.
    explanation: >-
      Supported in NSCLC models (tool analog RMC-7977) and inferred for
      PDAC/daraxonrasib; PARTIAL because these RAS-reactivating routes often
      remained sensitive to multiselective RAS(ON) inhibition.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: Raised RAS-GTP restores mitogenic signaling despite continued dosing.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: RTK and Feedback Pathway Reactivation
  biological_scale: MOLECULAR
  description: >-
    Relief of ERK-mediated negative feedback reactivates receptor tyrosine
    kinases and adaptors (EGFR/ERBB, AXL/PDGFR, SHP2, FAK, YAP-SDC1), restoring
    RAS-GTP/ERK output or providing RAS-parallel survival signaling. Best
    demonstrated against partial (MEK/G12C) blockade; its sufficiency against
    complete RAS(ON) suppression is uncertain.
  evidence:
  - reference: PMID:41165456
    reference_title: RAS-GTP Inhibition Overcomes Acquired Resistance to KRASG12C Inhibitors Mediated by Oncogenic and Wild-Type RAS Activation in Non-Small Cell Lung Cancer.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Two models, which lacked any discernable genomic alteration, acquired resistance associated with increased receptor tyrosine kinase activity and downstream persistent RAS activity and were sensitive to RAS-GTP inhibition by RMC-7977.
    explanation: >-
      RTK-driven persistent RAS activity mediated G12C-inhibitor resistance but
      remained sensitive to multiselective RAS(ON) inhibition; PARTIAL and
      context is NSCLC, so sufficiency against complete RAS(ON) block in PDAC is
      an open question.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: RTK-driven signaling restores proliferation or parallel survival under inhibition.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: Adaptive mTOR and JUN-AP1 Transcriptional Program
  biological_scale: CELLULAR
  description: >-
    Convergent adaptive-transcriptional escape in which mTOR and JUN/AP-1
    hyperactivation overcome MAPK suppression; JUN is the most downstream
    mediator and is indirectly targetable via MAP2K4 inhibition.
  evidence:
  - reference: PMID:41572361
    reference_title: CRISPR knockout screens reveal JUN as the master mediator of resistance to MAPK inhibition in KRAS-mutant pancreatic cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Through unbiased CRISPR-based screenings, we identified mTOR and JUN hyperactivation as interconnected mechanisms that overcome MAPK suppression.
    explanation: >-
      PDAC CRISPR screens (explicitly anticipating RAS(ON) multi-selective
      inhibitor resistance) identify the mTOR/JUN-AP1 hub as an adaptive
      transcriptional escape.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: mTOR/JUN-AP1 output restores proliferation independent of restored RAS-GTP.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: Mitochondrial Remodeling and Ferroptosis Vulnerability
  biological_scale: CELLULAR
  description: >-
    Profound RAS-MAPK suppression drives persistent mitochondrial remodeling and
    a lipid-peroxidase/ROS dependency, creating a subtype-independent ferroptosis
    (GPX4) vulnerability in the resistant state - a salvage target rather than a
    growth-restoring route.
  biological_processes:
  - preferred_term: ferroptosis
    modifier: INCREASED
    term:
      id: GO:0097707
      label: ferroptosis
  evidence:
  - reference: PMID:41545339
    reference_title: Vertical RAS pathway inhibition in pancreatic cancer drives therapeutically exploitable mitochondrial alterations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that dual SHP2/mitogen-activated protein kinase kinase (MEK1/2) inhibition induces major alterations in mitochondrial mass and function, impacts reactive oxygen species (ROS) homeostasis and triggers lipid peroxidase dependency.
    explanation: >-
      Vertical/direct RAS-pathway inhibition in PDAC induces a persistent
      mitochondrial-remodeled, ferroptosis-vulnerable resistant state - an
      actionable metabolic dependency of the resistant tumor.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: The mitochondrial-remodeled state accompanies therapy resistance and defines a ferroptosis salvage vulnerability.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: MYC Amplification-Driven RAS-Independent Proliferation
  biological_scale: MOLECULAR
  description: >-
    Amplification of the downstream transcriptional effector MYC is proposed to
    restore proliferation independent of RAS engagement, a RAS-independent route
    not reversed by deeper RAS inhibition. Evidence is currently review-level and
    needs primary, drug-matched confirmation.
  evidence:
  - reference: PMID:39586491
    reference_title: Breakthrough in RAS targeting with pan-RAS(ON) inhibitors RMC-7977 and RMC-6236.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: MYC amplification was reported to be a main contributor to the development of resistance.
    explanation: >-
      WEAK / review-level: a focused review synthesizing preclinical studies
      names MYC amplification as a main resistance contributor to multiselective
      tri-complex RAS(ON) inhibitors; primary drug-matched PDAC data are needed.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: MYC-driven proliferation bypasses RAS dependence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibitor_acquired_resistance
- name: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
  biological_scale: TISSUE
  description: >-
    Mechanism node for the immune-remodeling hypothesis: the immunosuppressive,
    T-cell-excluded microenvironment of PDAC is substantially
    RAS-activity-dependent and partially reversible by RAS-pathway inhibition,
    which promotes
    effector immune infiltration but requires checkpoint-blockade combination for
    durable regression. Daraxonrasib-specific PDAC immune data are still limited
    (strongest data use the G12D-selective MRTX1133).
  evidence:
  - reference: PMID:37782788
    reference_title: Oncogenic dependency plays a dominant role in the immune response to cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Lowering KRAS activity in established tumors promotes immune infiltration, but with a limited antitumor effect, whereas combining KRAS/MEK inhibition with immune checkpoint blockade achieves durable regression in preclinical models.
    explanation: >-
      Establishes that the tumor immune composition tracks RAS activity and that
      RAS-pathway inhibition remodels it but needs checkpoint-blockade
      combination for durable benefit.
- name: Myeloid Suppression Relief and CD8 Effector Infiltration
  biological_scale: TISSUE
  description: >-
    RAS-pathway inhibition decreases intratumoral myeloid infiltration, increases
    CD8+ effector T cells, and reprograms cancer-associated fibroblasts.
    Demonstrated with the G12D-selective MRTX1133 rather than daraxonrasib.
  cell_types:
  - preferred_term: CD8-positive effector T cell
    modifier: INCREASED
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  evidence:
  - reference: PMID:37625401
    reference_title: KRAS(G12D) inhibition reprograms the microenvironment of early and advanced pancreatic cancer to promote FAS-mediated killing by CD8(+) T cells.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Employing 16 different models of KRASG12D-driven PDAC, we demonstrate that MRTX1133 reverses early PDAC growth, increases intratumoral CD8+ effector T cells, decreases myeloid infiltration, and reprograms cancer-associated fibroblasts.
    explanation: >-
      Strong PDAC-model support for myeloid relief and CD8 effector infiltration;
      PARTIAL because it is achieved with the G12D-selective MRTX1133, not
      multiselective daraxonrasib.
  downstream:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    description: Relief of myeloid suppression and CD8 infiltration are components of the RAS-dependent immune reversal.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
- name: Tumor-Cell FAS Induction and CD8-Mediated Killing
  biological_scale: CELLULAR
  description: >-
    RAS/KRAS-G12D inhibition induces tumor-cell FAS, enabling CD8+ T-cell-mediated
    killing; regression of advanced PDAC requires CD8+ T cells and synergizes with
    checkpoint blockade (preclinical, MRTX1133).
  evidence:
  - reference: PMID:36824971
    reference_title: Oncogenic Kras(G12D) specific non-covalent inhibitor reprograms tumor microenvironment to prevent and reverse early pre-neoplastic pancreatic lesions and in combination with immunotherapy regresses advanced PDAC in a CD8(+) T cells dependent manner.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: Regression of advanced PDAC requires CD8 + T cells and immune checkpoint blockade therapy (iCBT) synergizes with MRTX1133 to eradicate PDAC and prolong overall survival.
    explanation: >-
      CD8-dependent, checkpoint-synergistic regression on RAS-G12D inhibition;
      PARTIAL because the agent is the G12D-selective MRTX1133, not daraxonrasib.
  downstream:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    description: FAS-enabled CD8 killing is an effector arm of the RAS-dependent immune reversal.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
- name: Antigen Presentation Restoration
  biological_scale: CELLULAR
  description: >-
    Proposed increase in tumor antigen presentation on RAS(ON) inhibition. WEAK
    and competing for PDAC: MHC-I/antigen presentation in PDAC is largely
    autophagy(NBR1)- and FAK-controlled and only weakly RAS-owned; the direct
    daraxonrasib evidence is in NSCLC, not PDAC.
  biological_processes:
  - preferred_term: antigen processing and presentation
    modifier: INCREASED
    term:
      id: GO:0019882
      label: antigen processing and presentation
  evidence:
  - reference: PMID:41670434
    reference_title: Abrogation of Oncogenic RAS Signaling by a RAS(ON) Inhibitor Doublet Primes Immune-Refractory KRASG12C-Mutant NSCLC for Immune Checkpoint Blockade.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: in immune-competent preclinical models, the RAS(ON) inhibitor doublet enhances tumor immune recognition by boosting antigen presentation and remodeling the suppressive tumor microenvironment, thus promoting immune-dependent complete regressions and sensitization of an immunorefractory model to checkpoint blockade.
    explanation: >-
      WEAK / competing for PDAC: the daraxonrasib-containing evidence for boosted
      antigen presentation is in KRAS-G12C NSCLC; in PDAC, MHC-I is dominantly
      autophagy(NBR1)/FAK-controlled and largely RAS-independent.
  downstream:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    description: A weakly RAS-owned, competing contribution to immune reversal.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
- name: Regulatory T-Cell Relief
  biological_scale: TISSUE
  description: >-
    Proposed relief of regulatory-T-cell dominance on RAS/daraxonrasib
    inhibition. UNSUPPORTED source absence: a targeted literature search found no
    primary evidence that RAS or daraxonrasib inhibition depletes or disarms
    Tregs in PDAC. Retained here as an explicitly unverified edge for the
    immune-remodeling hypothesis, pending direct Treg profiling.
  cell_types:
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  downstream:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    description: Proposed but currently unsupported contribution (source absence); no primary PDAC evidence found.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
- name: USP20 Cholesterol-Metabolism CD8 Exhaustion Checkpoint
  biological_scale: CELLULAR
  description: >-
    KRAS-G12D upregulates USP20 (via EGR1) to drive cholesterol metabolism and
    CD8+ T-cell exhaustion; RAS inhibition reverses this exhaustion axis but
    triggers compensatory ULK1 autophagy, so co-targeting cholesterol metabolism
    and autophagy potentiates KRAS-inhibitor efficacy. Human-tissue-anchored.
  evidence:
  - reference: PMID:42392864
    reference_title: USP20 promotes CD8(+) T cell exhaustion and impairs KRAS(G12D) inhibitor efficacy by orchestrating cholesterol metabolism and autophagy in pancreatic cancer.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We found that KRASG12D enhanced cholesterol metabolism and promoted CD8+ T cell exhaustion, whereas KRASG12D inhibition or cholesterol synthesis blockade induced compensatory ULK1-associated autophagy.
    explanation: >-
      Adds a human-anchored metabolic-immune layer: KRAS drives a cholesterol/
      USP20-mediated CD8-exhaustion program reversed by RAS inhibition, with a
      compensatory autophagy escape that gates KRAS-inhibitor immune efficacy.
  downstream:
  - target: Immunosuppressive TME Reversibility under RAS(ON) Inhibition
    description: Reversal of the cholesterol-driven CD8-exhaustion program contributes to RAS-dependent immune reversal.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
- name: CDK8-CXCL2 Adaptive Immune Reversal
  biological_scale: CELLULAR
  description: >-
    Durability-limiting counter-program: with long-term KRAS-G12D-inhibitor or
    daraxonrasib treatment, CDK8 remodels the microenvironment (CXCL2 chemokine
    secretion, FAS suppression) and reverses the initial immune gains, driving
    resistance. Bridges the immune-remodeling and resistance hypotheses.
  evidence:
  - reference: PMID:42436354
    reference_title: CDK8 remodels the tumor microenvironment and promotes resistance to KRAS(G12D) inhibitors and daraxonrasib in PDAC.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: long-term treatment results in reversal of the immune responses leading to resistance promoted by multiprotein mediator complex associated kinase CDK8.
    explanation: >-
      CDK8-driven reversal of the immune-remodeling window is a durability limit
      that converts the therapeutic immune response into a resistance driver;
      names daraxonrasib explicitly.
  downstream:
  - target: Acquired RAS(ON) Inhibitor Resistance
    description: CDK8-mediated reversal of immune remodeling drives adaptive resistance.
    causal_link_type: DIRECT
    hypothesis_groups:
    - ras_on_inhibition_immune_tme_remodeling
    - ras_on_inhibitor_acquired_resistance

    comparing oral daraxonrasib (300 mg once daily) with investigator's choice of
    chemotherapy in 500 patients with previously treated metastatic PDAC (91.8%
    with RAS G12 mutations). Daraxonrasib significantly prolonged overall survival
    (median 13.2 vs. 6.6 months in the RAS G12 population; hazard ratio for death
    0.40, P<0.001) and progression-free survival (7.3 vs. 3.5 months; hazard ratio
    0.45, P<0.001), roughly doubled the objective response rate (33.2% vs. 11.8%),
    and lengthened the time to deterioration in pain and global quality of life.

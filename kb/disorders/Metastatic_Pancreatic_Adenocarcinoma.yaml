- name: Daraxonrasib (RAS(ON) Multiselective Inhibitor)
  description: >-
    Daraxonrasib (RMC-6236) is an oral RAS(ON) multiselective, tri-complex
    inhibitor that binds cyclophilin A intracellularly to form a binary complex
    engaging the active, GTP-bound state of mutant and wild-type RAS (KRAS, NRAS,
    HRAS), including variants at glycine 12 (G12), glycine 13 (G13), and glutamine
    61 (Q61), thereby suppressing downstream RAS-MAPK signaling. In the phase 3
    RASolute 302 trial of previously treated metastatic PDAC (91.8% RAS G12),
    daraxonrasib 300 mg orally once daily significantly prolonged overall survival
    (median 13.2 vs. 6.6 months in the RAS G12 population; hazard ratio for death
    0.40) and progression-free survival (7.3 vs. 3.5 months; hazard ratio 0.45)
    versus investigator's choice of chemotherapy, roughly doubling the objective
    response rate (33.2% vs. 11.8%). The most common adverse events were rash,
    diarrhea, and stomatitis, and treatment-related discontinuation was uncommon
    (1.2% vs. 11.2% with chemotherapy).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: daraxonrasib
      term:
        id: CHEBI:746946
        label: daraxonrasib
  target_mechanisms:
  - target: KRAS-Centered Oncogenic Signaling
    treatment_effect: INHIBITS
    description: >-
      Daraxonrasib engages the active GTP-bound RAS(ON) state of mutant and
      wild-type KRAS/NRAS/HRAS through a cyclophilin A tri-complex, suppressing the
      RAS-MAPK proliferative signaling that is the dominant oncogenic engine of
      pancreatic adenocarcinoma.
  evidence:
  - reference: clinicaltrials:NCT06625320
    reference_title: >-
      RASolute 302: A Phase 3 Multicenter, Open-label, Randomized Study of
      Daraxonrasib (RMC-6236) Versus Investigator's Choice of Standard of Care
      Therapy in Patients With Previously Treated Metastatic Pancreatic Ductal
      Adenocarcinoma (PDAC)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The purpose of this study is to evaluate the safety and efficacy of a novel RAS(ON) inhibitor compared to standard(s) of care (SOC) treatment.
    explanation: >-
      ClinicalTrials.gov documents RASolute 302 as a phase 3 evaluation of the
      RAS(ON) inhibitor daraxonrasib versus standard-of-care chemotherapy in
      previously treated metastatic PDAC.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 20 individuals with a LEP mutation had been identified in the
    15 years after the founding 1997 report. Later bioinactive-leptin variants
    have added cases, and because those present with normal or high measured
    leptin the true count is likely an undercount of the disease rather than of
    the classical hormone-deficient form.
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 1997, less than 20 individuals carrying a LEP gene mutation have been identified."
    explanation: >-
      Gives the reported case count, establishing the ultra-rare band.
diagnosis:
- name: Circulating leptin measurement with LEP sequencing
  description: >-
    Serum leptin is the discriminating first-line test, and it separates this
    disease from its closest mimic: it is undetectable in LEP mutation carriers
    but extremely elevated in LEPR (receptor) mutation carriers, whose clinical
    picture is otherwise similar and who do not respond to leptin replacement.

    The important caveat is that a normal or high leptin level does not exclude
    the diagnosis. The bioinactive and antagonistic variant classes secrete
    immunoreactive hormone, so leptin sequencing should be considered in a
    severely obese, hyperphagic child even when circulating leptin is
    detectable.
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of circulating leptin may help for the diagnosis of such obesity: it is undetectable in LEP mutation carriers or extremely elevated in LEPR mutation carriers."
    explanation: >-
      Establishes serum leptin as the diagnostic discriminator between LEP and
      LEPR deficiency.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the leptin gene may need to be considered in hyperphagic, severely obese children with detectable levels of circulating leptin."
    explanation: >-
      Records the caveat that detectable leptin does not exclude the diagnosis,
      because bioinactive variants are secreted.

genetic:
- name: LEP loss of function
  gene_term:
    preferred_term: LEP
    term:
      id: hgnc:6553
      label: LEP
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic LEP variants cause the disease. The founding lesion was a
    homozygous single-guanine deletion in codon 133 producing no secreted
    hormone; later missense variants (for example p.D100Y, p.N103K) are secreted
    but biologically inactive, so circulating leptin is detectable. Fewer than
    20 LEP-mutation carriers had been reported by 2012, and the condition
    remains very rare.
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide in codon 133 of the gene for leptin was found"
    explanation: >-
      Identifies the causative homozygous LEP frameshift in the founding
      pedigree.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 1997, less than 20 individuals carrying a LEP gene mutation have been identified."
    explanation: >-
      Quantifies the rarity of causative LEP variants in the reported
      literature.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both homozygous for a c.309C>A substitution in the leptin gene leading to a p.N103K amino acid exchange in the protein and detectable circulating levels of leptin"
    explanation: >-
      Documents a homozygous missense LEP variant producing detectable but
      inactive hormone, extending the causative allelic spectrum.
treatments:
- name: Metreleptin
  description: >-
    Daily subcutaneous recombinant human leptin, which replaces the missing
    hormone and restores hypothalamic leptin signalling. It is uniquely
    effective here because the receptor and all downstream circuitry are intact
    — the defect is the ligand alone. Response covers every arm of the disease:
    appetite and fat mass fall, thyroid hormone rises, gonadotropin secretion
    and puberty are induced, and the T cell defect corrects.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metreleptin
      term:
        id: NCIT:C170171
        label: Metreleptin
  target_mechanisms:
  - target: Failure of Hypothalamic Leptin Signaling
    description: >-
      Exogenous leptin supplies the absent ligand for intact hypothalamic leptin
      receptors, restoring the signal at the point where the disease begins.
    evidence:
    - reference: PMID:12393845
      reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The subcutaneous administration of recombinant human leptin has major and sustained beneficial effects on the multiple phenotypic abnormalities associated with congenital human leptin deficiency."
      explanation: >-
        Correction of the full multi-system phenotype by replacing the ligand
        supports the treatment acting at the leptin signalling node.
  - target: Unopposed Orexigenic Drive
    description: >-
      Restored leptin signalling re-establishes satiety, and reduced food intake
      is the principal driver of the weight loss observed on therapy.
    evidence:
    - reference: PMID:22627381
      reference_title: "Leptin and leptin receptor-related monogenic obesity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It results in weight loss, mainly of fat mass, with a major effect on reducing food intake"
      explanation: >-
        Identifies reduced food intake as the mechanism of the therapeutic
        weight loss, which is the orexigenic node being corrected.
  - target: Impaired T Cell Number and Function
    description: >-
      Leptin replacement restores CD4-positive T cell numbers and T cell
      proliferative and cytokine responses.
    evidence:
    - reference: PMID:12393845
      reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "impaired T cell proliferation and cytokine release, all of which were reversed by recombinant human leptin administration"
      explanation: >-
        Direct evidence that leptin administration reverses the T cell defect.
  - target: Starvation-Pattern Neuroendocrine Suppression
    description: >-
      Leptin substitution induces pulsatile gonadotropin secretion and permits
      pubertal progression, and raises thyroid hormone levels.

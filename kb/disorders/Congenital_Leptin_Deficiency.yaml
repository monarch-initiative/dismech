inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) LEP variants are required.
    The original kindred was highly consanguineous and the affected children
    were homozygous for a codon 133 frameshift.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have examined two severely obese children who are members of the same highly consanguineous pedigree."
    explanation: >-
      The founding report identifies affected children within a single highly
      consanguineous pedigree, the pattern expected of a recessive trait.
has_subtypes:
- name: Classical
  display_name: Classical hormone deficiency
  description: >-
    No secreted hormone, so circulating leptin is low or undetectable. The
    largest class by far, and the one the disease was originally defined by.
    Leptin is low or undetectable on both the regular and bioLEP assays, and
    treatment starts at the standard metreleptin dose of 0.03 mg/kg lean body
    weight -- the reference point the other two subtypes are measured against.
  evidence:
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "classical hormone deficiency (21 variants in 128 patients)"
    explanation: >-
      Defines the class and gives its variant and patient counts.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can receive treatment at a regular metreleptin starting dose of 0.03 mg/kg lean body weight."
    explanation: >-
      Gives the standard metreleptin starting dose for this subtype, which is
      the baseline the antagonistic subtype departs from.
- name: Bioinactive
  display_name: Biologically inactive hormone
  description: >-
    Hormone is secreted and immunoreactive but cannot signal, so a regular ELISA
    reads normal or high. Diagnosis requires the bioLEP assay alongside the
    regular one. Takes the same metreleptin starting dose as the classical class.

    Carries a genotype-phenotype signal worth noting: recurrent or severe
    infection is significantly more common in this subtype than in classical
    deficiency (45% vs 16%). That is the one comorbidity reported to differ
    significantly between subtypes, so the entry-level infection frequency
    understates the risk for these patients specifically.
  evidence:
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biologically inactive hormone (3 variants in 12 patients)"
    explanation: >-
      Defines the class and gives its variant and patient counts.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the rate of recurrent or severe infections was signicantly higher in patients living with biological inactive leptin compared to patients with classical hormone deficiency (45% vs 16%, P < .05; Table 4)."
    explanation: >-
      Reports the significantly higher infection rate in this subtype relative to
      classical deficiency. Quoted verbatim including the source's "signicantly"
      typo, as the snippet must be an exact substring.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined measurements using a regular ELISA and the more recently developed bioLEP ELISA allow for the robust diagnosis of biological inactive leptin."
    explanation: >-
      Gives the two-assay algorithm that identifies this class.
- name: Antagonistic
  display_name: Antagonistic hormone
  description: >-
    The mutant hormone antagonises non-variant leptin at the receptor. This is
    the class that breaks both halves of the usual approach: both assays read
    normal, so leptin measurement does not identify it at all, and because the
    variant also antagonises metreleptin, these patients need higher initial
    doses and variant-tailored tapering rather than the standard regimen.
  evidence:
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "antagonistic hormone (3 variants in 7 patients)"
    explanation: >-
      Defines the class and gives its variant and patient counts.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular and bioLEP ELISA will measure inconspicuous leptin levels in patients with antagonistic leptin and thus will not help to identify CLD in these patients."
    explanation: >-
      Records that neither assay identifies this class, which is why the
      diagnosis block cannot present leptin measurement as universally
      discriminating.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients living with antagonistic leptin cannot receive the same dose of metreleptin as patients living with classical hormone deficiency but require higher initial doses and appropriate dose tapering"
    explanation: >-
      Establishes that metreleptin dosing is subtype-dependent, which is why the
      treatment block cannot assert a uniform response.

pathophysiology:
- name: Absent or Bioinactive Leptin
  biological_scale: MOLECULAR
  description: >-
    Biallelic LEP variants remove the circulating leptin signal. The classical
    lesion is a frameshift or nonsense variant producing no secreted hormone, so
    serum leptin is low or undetectable despite a greatly expanded fat mass.
    A second, later-recognised class of missense variants yields a hormone that
    is secreted and immunoreactive — so measured leptin is normal or high — but
    biologically inactive or antagonistic at the receptor. Both classes cripple
    leptin signalling while leaving the assay result normal or high, which is why
    a normal leptin level does not exclude the diagnosis. "Cripple" rather than
    "abolish" is deliberate: antagonistic variants trigger no or only little
    downstream signalling rather than none at all, and p.Gly59Ser retains partial
    agonist activity.
  gene:
    preferred_term: LEP
    term:
      id: hgnc:6553
      label: LEP
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  molecular_functions:
  - preferred_term: leptin hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide in codon 133 of the gene for leptin was found"
    explanation: >-
      Identifies the founding loss-of-function LEP lesion in the two affected
      children.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, variants have been described resulting in secreted mutant forms of the hormone leptin with either biologically inactive or antagonistic properties."
    explanation: >-
      Establishes the second variant class, in which mutant leptin is secreted
      rather than absent, so the molecular lesion is signal failure rather than
      simply low hormone concentration.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro experiments in a heterologous cell system demonstrated that the mutated protein was biologically inactive."
    explanation: >-
      Functional confirmation that a secreted missense LEP product is inactive,
      supporting bioinactivity as a distinct molecular route to the same disease.
  downstream:
  - target: Failure of Hypothalamic Leptin Signaling
    causal_link_type: DIRECT
- name: Failure of Hypothalamic Leptin Signaling
  biological_scale: CELLULAR
  description: >-
    Without a functional ligand, leptin receptors on arcuate nucleus neurons
    are never engaged, so the JAK2/STAT3 cascade downstream of LEPR is not
    activated. Anorexigenic POMC/CART neurons lose their principal excitatory
    drive and orexigenic AgRP/NPY neurons lose their principal inhibition. The
    hypothalamus therefore reports depleted energy stores irrespective of the
    actual, greatly expanded, adipose mass — the central pathogenic inversion of
    this disease.
  cell_types:
  - preferred_term: pro-opiomelanocortin neuron of the arcuate nucleus
    term:
      id: CL:4042033
      label: pro-opiomelanocortin neuron
  - preferred_term: arcuate AgRP/NPY neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: arcuate nucleus of hypothalamus
    term:
      id: UBERON:0001932
      label: arcuate nucleus of hypothalamus
  biological_processes:
  - preferred_term: leptin-mediated signaling pathway
    term:
      id: GO:0033210
      label: leptin-mediated signaling pathway
    modifier: DECREASED
  - preferred_term: energy homeostasis
    term:
      id: GO:0097009
      label: energy homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe obesity found in these congenitally leptin-deficient subjects provides the first genetic evidence that leptin is an important regulator of energy balance in humans."
    explanation: >-
      The founding report frames the human phenotype as genetic proof that
      leptin regulates energy balance, which is the signalling failure this node
      describes.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients are mostly characterized by severe early-onset obesity with severe hyperphagia"
    explanation: >-
      Summarises the clinical consequence of absent hypothalamic leptin
      signalling across the reported LEP-deficient cohort.
  downstream:
  - target: Unopposed Orexigenic Drive
    causal_link_type: DIRECT
  - target: Starvation-Pattern Neuroendocrine Suppression
    causal_link_type: DIRECT
  - target: Impaired T Cell Number and Function
    causal_link_type: DIRECT
- name: Unopposed Orexigenic Drive
  biological_scale: ORGANISM
  description: >-
    With the satiety limb silent, appetite runs without its physiological brake.
    Affected children show intense, food-seeking hyperphagia from the first
    months of life, and energy expenditure is not raised to compensate, so fat
    mass accumulates rapidly and continuously. This node is the immediate
    generator of the obesity phenotype and is the arm most visibly and rapidly
    reversed by leptin replacement.
  biological_processes:
  - preferred_term: regulation of appetite
    term:
      id: GO:0032098
      label: regulation of appetite
    modifier: DECREASED
  - preferred_term: feeding behavior
    term:
      id: GO:0007631
      label: feeding behavior
    modifier: INCREASED
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It results in weight loss, mainly of fat mass, with a major effect on reducing food intake"
    explanation: >-
      Leptin replacement acting principally by reducing food intake supports
      unopposed appetite drive as the mechanism generating the obesity.
    directness: INDIRECT
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sustained, beneficial effects on appetite, fat mass, hyperinsulinemia, and hyperlipidemia"
    explanation: >-
      Sustained reversal of appetite and fat mass on leptin supports these as
      leptin-dependent, and therefore as consequences of the missing signal.
    directness: INDIRECT
  downstream:
  - target: Severe Early-Onset Obesity
    causal_link_type: DIRECT
  - target: Hyperphagia
    causal_link_type: DIRECT
- name: Starvation-Pattern Neuroendocrine Suppression
  biological_scale: ORGANISM
  description: >-
    Leptin is also the permissive signal that tells the hypothalamus there is
    enough stored energy to run reproduction and full metabolic activity. Read
    as starvation, the hypothalamus suppresses GnRH-driven gonadotropin
    secretion, so LH and FSH remain prepubertal and are not pulsatile, and it
    blunts the thyroid and growth hormone axes. Puberty therefore does not
    begin, despite obesity — the combination that distinguishes this disease
    from common obesity, where puberty is typically early.
  biological_processes:
  - preferred_term: gonadotropin secretion
    term:
      id: GO:0032274
      label: gonadotropin secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:22343341
    reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, the patient had prepubertal basal and stimulated luteinizing hormone (LH) and follicle-stimulating hormone (FSH) levels, low growth hormone and insulin-like growth factor 1 (IGF1) levels and no pulsatile secretion of LH and FSH."
    explanation: >-
      Directly documents suppressed, non-pulsatile gonadotropin secretion plus a
      blunted GH/IGF1 axis in an untreated leptin-deficient adolescent.
  - reference: PMID:22343341
    reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data are further proof of the concept that leptin is needed for a timely maturation of the hypothalamic/pituitary/gonadal axis."
    explanation: >-
      States the causal dependence of HPG axis maturation on leptin, which is
      the mechanism this node asserts.
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leptin therapy resulted in a rapid and sustained increase in plasma thyroid hormone levels and, through its age-dependent effects on gonadotropin secretion, facilitated appropriately timed pubertal development."
    explanation: >-
      Reversal of both the thyroid and gonadotropin arms by leptin supports
      their suppression being caused by the missing signal.
    directness: INDIRECT
  downstream:
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: DIRECT
  - target: Delayed Puberty
    causal_link_type: DIRECT
- name: Impaired T Cell Number and Function
  biological_scale: CELLULAR
  description: >-
    Leptin is also an immunomodulatory cytokine acting on lymphocytes, and its
    absence reduces circulating CD4-positive T cell numbers and impairs T cell
    proliferation and cytokine release. Clinically this presents as a high rate
    of childhood infection, which historically accounted for deaths in
    leptin-deficient kindreds. Like the endocrine arm, it is reversed by leptin
    replacement, establishing it as a direct consequence of the deficiency
    rather than a secondary effect of obesity.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: positive regulation of T cell proliferation
    term:
      id: GO:0042102
      label: positive regulation of T cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leptin deficiency was associated with reduced numbers of circulating CD4(+) T cells and impaired T cell proliferation and cytokine release, all of which were reversed by recombinant human leptin administration."
    explanation: >-
      Directly documents the cellular immune defect and its reversal by leptin,
      supporting both the mechanism and its leptin dependence.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high rate of infection associated with a deficiency in T cell"
    explanation: >-
      Confirms the clinical infection burden accompanying the T cell defect
      across reported LEP-deficient patients.
  downstream:
  - target: Recurrent Infections
    causal_link_type: DIRECT

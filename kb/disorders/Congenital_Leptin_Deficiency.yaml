name: Congenital Leptin Deficiency
creation_date: "2026-09-04T02:15:00Z"
category: Metabolic Disorder
description: >-
  Congenital leptin deficiency is a rare autosomal recessive form of severe
  early-onset obesity caused by biallelic pathogenic variants in LEP, the gene
  encoding the adipocyte hormone leptin. Leptin is the afferent limb of the
  adipostat: it is secreted in proportion to fat mass and acts on leptin
  receptors in the hypothalamic arcuate nucleus to activate anorexigenic
  POMC/CART neurons and inhibit orexigenic AgRP/NPY neurons. When leptin is
  absent, or is secreted in a biologically inactive or antagonistic form, the
  hypothalamus reads a state of permanent starvation regardless of adipose
  stores. The result is intense hyperphagia and severe obesity from the first
  months of life, together with the wider starvation-like neuroendocrine
  program: hypogonadotropic hypogonadism with failure of pubertal onset,
  blunted thyroid and growth hormone axes, and impaired T cell number and
  function with recurrent infection. It is distinguished from every other
  monogenic obesity by being pharmacologically correctable — daily recombinant
  leptin (metreleptin) replaces the missing signal and reverses the whole
  phenotype, including the immune and reproductive arms.
disease_term:
  preferred_term: obesity due to congenital leptin deficiency
  term:
    id: MONDO:0013991
    label: obesity due to congenital leptin deficiency
synonyms:
- congenital leptin deficiency
- obesity, morbid, due to leptin deficiency
- leptin deficiency or dysfunction
- obesity, morbid, nonsyndromic 1
- LEPD
parents:
- Obesity Due to MC4R Pathway Disruption
- Inherited Obesity
notes: >-
  Curated as a distinct Disease rather than folded into
  Obesity_Due_to_MC4R_Pathway_Disruption. That entry is an explicitly
  mechanism-based umbrella whose disease_term is the broad MONDO:0011122
  (obesity disorder) and whose pathophysiology is the three generic nodes shared
  by every leptin-melanocortin lesion; its LEP subtype records that this entity
  exists but binds no MONDO term and carries no pathograph. This entry supplies
  the LEP-specific chain, the reproductive and immune arms, and the
  metreleptin mechanism, none of which are properties of the umbrella.

  Deliberately distinct from leptin *receptor* (LEPR) deficiency, which is
  clinically similar but has extremely elevated rather than absent circulating
  leptin and does not respond to leptin replacement. Evidence about LEPR
  patients must not be reused here.

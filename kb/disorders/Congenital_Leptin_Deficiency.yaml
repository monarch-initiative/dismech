      signalling across the reported LEP-deficient cohort.
  downstream:
  - target: Unopposed Orexigenic Drive
    causal_link_type: DIRECT
  - target: Starvation-Pattern Neuroendocrine Suppression
    causal_link_type: DIRECT
  - target: Impaired T Cell Number and Function
    causal_link_type: DIRECT
- name: Unopposed Orexigenic Drive
  biological_scale: ORGANISM
  description: >-
    With the satiety limb silent, appetite runs without its physiological brake.
    Affected children show intense, food-seeking hyperphagia from the first
    months of life, and energy expenditure is not raised to compensate, so fat
    mass accumulates rapidly and continuously. This node is the immediate
    generator of the obesity phenotype and is the arm most visibly and rapidly
    reversed by leptin replacement.
  biological_processes:
  - preferred_term: regulation of appetite
    term:
      id: GO:0032098
      label: regulation of appetite
    modifier: DECREASED
  - preferred_term: feeding behavior
    term:
      id: GO:0007631
      label: feeding behavior
    modifier: INCREASED
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It results in weight loss, mainly of fat mass, with a major effect on reducing food intake"
    explanation: >-
      Leptin replacement acting principally by reducing food intake supports
      unopposed appetite drive as the mechanism generating the obesity.
    directness: INDIRECT
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sustained, beneficial effects on appetite, fat mass, hyperinsulinemia, and hyperlipidemia"
    explanation: >-
      Sustained reversal of appetite and fat mass on leptin supports these as
      leptin-dependent, and therefore as consequences of the missing signal.
    directness: INDIRECT
  downstream:
  - target: Severe Early-Onset Obesity
    causal_link_type: DIRECT
  - target: Hyperphagia
    causal_link_type: DIRECT
- name: Starvation-Pattern Neuroendocrine Suppression
  biological_scale: ORGANISM
  description: >-
    Leptin is also the permissive signal that tells the hypothalamus there is
    enough stored energy to run reproduction and full metabolic activity. Read
    as starvation, the hypothalamus suppresses GnRH-driven gonadotropin
    secretion, so LH and FSH remain prepubertal and are not pulsatile, and it
    blunts the thyroid and growth hormone axes. Puberty therefore does not
    begin, despite obesity — the combination that distinguishes this disease
    from common obesity, where puberty is typically early.
  biological_processes:
  - preferred_term: gonadotropin secretion
    term:
      id: GO:0032274
      label: gonadotropin secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:22343341
    reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, the patient had prepubertal basal and stimulated luteinizing hormone (LH) and follicle-stimulating hormone (FSH) levels, low growth hormone and insulin-like growth factor 1 (IGF1) levels and no pulsatile secretion of LH and FSH."
    explanation: >-
      Directly documents suppressed, non-pulsatile gonadotropin secretion plus a
      blunted GH/IGF1 axis in an untreated leptin-deficient adolescent.
  - reference: PMID:22343341
    reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data are further proof of the concept that leptin is needed for a timely maturation of the hypothalamic/pituitary/gonadal axis."
    explanation: >-
      States the causal dependence of HPG axis maturation on leptin, which is
      the mechanism this node asserts.
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leptin therapy resulted in a rapid and sustained increase in plasma thyroid hormone levels and, through its age-dependent effects on gonadotropin secretion, facilitated appropriately timed pubertal development."
    explanation: >-
      Reversal of both the thyroid and gonadotropin arms by leptin supports
      their suppression being caused by the missing signal.
    directness: INDIRECT
  downstream:
  - target: Hypogonadotropic Hypogonadism
    causal_link_type: DIRECT
  - target: Delayed Puberty
    causal_link_type: DIRECT
- name: Impaired T Cell Number and Function
  biological_scale: CELLULAR
  description: >-
    Leptin is also an immunomodulatory cytokine acting on lymphocytes, and its
    absence reduces circulating CD4-positive T cell numbers and impairs T cell
    proliferation and cytokine release. Clinically this presents as a high rate
    of childhood infection, which historically accounted for deaths in
    leptin-deficient kindreds. Like the endocrine arm, it is reversed by leptin
    replacement, establishing it as a direct consequence of the deficiency
    rather than a secondary effect of obesity.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: positive regulation of T cell proliferation
    term:
      id: GO:0042102
      label: positive regulation of T cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:12393845
    reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leptin deficiency was associated with reduced numbers of circulating CD4(+) T cells and impaired T cell proliferation and cytokine release, all of which were reversed by recombinant human leptin administration."
    explanation: >-
      Directly documents the cellular immune defect and its reversal by leptin,
      supporting both the mechanism and its leptin dependence.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "high rate of infection associated with a deficiency in T cell"
    explanation: >-
      Confirms the clinical infection burden accompanying the T cell defect
      across reported LEP-deficient patients.
  downstream:
  - target: Recurrent Infections
    causal_link_type: DIRECT

  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe obesity found in these congenitally"
    explanation: >-
      The founding report frames the human phenotype as genetic proof that
      leptin regulates energy balance, which is the signalling failure this node
      describes.
  - reference: PMID:22627381

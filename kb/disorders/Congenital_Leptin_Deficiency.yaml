- category: Phenotypic
  name: Hypogonadotropic Hypogonadism
  description: >-
    Failure of the hypothalamic-pituitary-gonadal axis with low, non-pulsatile
    LH and FSH, so secondary sexual development does not begin spontaneously.

    The frequency band understates the clinical reality and needs reading with
    the denominator. In the systematic series it is 16 of 103 patients (16%),
    which is OCCASIONAL — but that cohort is mostly small children in whom the
    phenotype cannot yet be observed. Among the 12 adult patients it was present
    in all 12 (100%). Treat it as effectively obligate in anyone who reaches
    pubertal age, and as unobservable before then.
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:22343341
    reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here the first adolescent with hypogonadotropic hypogonadism due to connatal leptin deficiency."
    explanation: >-
      Directly attributes hypogonadotropic hypogonadism to congenital leptin
      deficiency in an affected adolescent.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypogonadotropic hypogonadism including micropenis, undescended testis, primary amenorrhea, or delayed puberty in 16 of 103 patients [16%; including in all 12 adult patients (100%)]"
    explanation: >-
      Gives both denominators: 16% across a mostly paediatric cohort, but 100%
      of the adults, which is why the band is OCCASIONAL while the description
      records it as effectively obligate after pubertal age.
- category: Phenotypic
  name: Delayed Puberty
  description: >-
    Puberty does not begin at the expected age and is induced only once leptin
    is replaced, in contrast to common obesity where puberty tends to be early.

    Not independent of Hypogonadotropic Hypogonadism above: the systematic series
    counts delayed puberty inside that same 16/103 figure, as one of the signs by
    which the hypogonadism is recognised. Recorded separately because it is the
    presenting complaint, not because it is a second cohort.

    The frequency band therefore carries the same age caveat as its sibling, and
    for the same reason: 16% is the rate across a cohort that is mostly small
    children in whom puberty cannot yet be late, while all 12 adult patients
    showed hypogonadism. Read it as unobservable before pubertal age and
    effectively obligate after, not as a 16% lifetime risk.
  phenotype_term:
    preferred_term: Delayed puberty
    term:
      id: HP:0000823
      label: Delayed puberty
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:22343341

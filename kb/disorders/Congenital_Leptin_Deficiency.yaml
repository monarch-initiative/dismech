prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    148 patients across 28 distinct homozygous LEP variants in the 2024
    systematic classification. The earlier "fewer than 20 individuals" figure is
    retained below as the 2012 count, because the growth between the two is
    itself informative rather than merely superseded: most of it is ascertainment
    of the bioinactive and antagonistic classes, which present with normal or
    high measured leptin and were therefore missed while a low leptin level was
    treated as the screening criterion.
  evidence:
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 28 distinct homozygous leptin variants were identified in 148 patients."
    explanation: >-
      Current systematic census of reported patients and causative variants.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 1997, less than 20 individuals carrying a LEP gene mutation have been identified."
    explanation: >-
      The 2012 count, retained to show the scale of subsequent ascertainment
      rather than as the current figure.
diagnosis:
- name: Circulating leptin measurement with LEP sequencing
  description: >-
    Serum leptin is the discriminating first-line test, and it separates this
    disease from its closest mimic: it is undetectable in LEP mutation carriers
    but extremely elevated in LEPR (receptor) mutation carriers, whose clinical
    picture is otherwise similar and who do not respond to leptin replacement.

    The important caveat is that a normal or high leptin level does not exclude
    the diagnosis, and it fails in two different ways for the two non-classical
    subtypes. For biologically inactive leptin, combining a regular ELISA with
    the bioLEP assay — which measures receptor-binding capacity rather than
    hormone mass — separates it robustly. For antagonistic leptin, both assays
    read inconspicuous, so leptin measurement does not identify the disease at
    all and only sequencing will. LEP sequencing should therefore be considered
    in any severely obese, hyperphagic child even when circulating leptin is
    normal and even when the bioLEP assay is also normal.
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of circulating leptin may help for the diagnosis of such obesity: it is undetectable in LEP mutation carriers or extremely elevated in LEPR mutation carriers."
    explanation: >-
      Establishes serum leptin as the diagnostic discriminator between LEP and
      LEPR deficiency.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the leptin gene may need to be considered in hyperphagic, severely obese children with detectable levels of circulating leptin."
    explanation: >-
      Records the caveat that detectable leptin does not exclude the diagnosis,
      because bioinactive variants are secreted.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined measurements using a regular ELISA and the more recently developed bioLEP ELISA allow for the robust diagnosis of biological inactive leptin."
    explanation: >-
      Gives the two-assay algorithm that identifies the bioinactive subtype.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular and bioLEP ELISA will measure inconspicuous leptin levels in patients with antagonistic leptin and thus will not help to identify CLD in these patients."
    explanation: >-
      Records that neither assay detects the antagonistic subtype, the limit of
      the leptin-measurement strategy.

genetic:
- name: LEP loss of function
  gene_term:
    preferred_term: LEP
    term:
      id: hgnc:6553
      label: LEP
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic LEP variants cause the disease. The founding lesion was a
    homozygous single-guanine deletion in codon 133 producing no secreted
    hormone; later missense variants (for example p.D100Y, p.N103K) are secreted
    but biologically inactive, so circulating leptin is detectable. Fewer than
    20 LEP-mutation carriers had been reported by 2012, and the condition
    remains very rare.
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide in codon 133 of the gene for leptin was found"
    explanation: >-
      Identifies the causative homozygous LEP frameshift in the founding
      pedigree.
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since 1997, less than 20 individuals carrying a LEP gene mutation have been identified."
    explanation: >-
      Quantifies the rarity of causative LEP variants in the reported
      literature.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both homozygous for a c.309C>A substitution in the leptin gene leading to a p.N103K amino acid exchange in the protein and detectable circulating levels of leptin"
    explanation: >-
      Documents a homozygous missense LEP variant producing detectable but
      inactive hormone, extending the causative allelic spectrum.
animal_models:
- name: ob/ob mouse (Lep-deficient)
  species: Mouse
  genotype: Lep ob/ob
  publication: PMID:9202122
  description: >-
    The founding model. Extreme obesity in the ob/ob mouse was attributed to
    mutations in the leptin gene years before any human case was known, and it
    is what made congenital leptin deficiency a hypothesis worth testing in
    humans. Its immune phenotype also anticipated the human T cell defect.
  modeled_mechanisms:
  - target: Unopposed Orexigenic Drive
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Loss of leptin in the mouse reproduces the hyperphagia and severe obesity
      that define the human disease, through the orthologous gene.
    limitations: >-
      The mouse phenotype was characterised before the human disease and framed
      the human expectation rather than being validated against it. The human
      subtype structure has no murine counterpart: ob/ob is a null, so it models
      classical hormone deficiency only and says nothing about the bioinactive or
      antagonistic classes, where the hormone is present but non-functional.
    evidence:
    - reference: PMID:9202122
      reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The extreme obesity of the obese (ob/ob) mouse is attributable to mutations in the gene encoding leptin, an adipocyte-specific secreted protein which has profound effects on appetite and energy expenditure."
      explanation: >-
        Establishes the murine phenotype and its attribution to leptin, the
        model this node recapitulates.

treatments:
- name: Metreleptin
  description: >-
    Daily subcutaneous recombinant human leptin, which replaces the missing
    hormone and restores hypothalamic leptin signalling. It is uniquely
    effective here because the receptor and all downstream circuitry are intact
    — the defect is the ligand alone. Response spans every arm of the disease:
    appetite and fat mass fall, thyroid hormone rises, gonadotropin secretion
    and puberty are induced, and the T cell defect corrects.

    Dosing is not uniform across subtypes, however. Classical and biologically
    inactive deficiency take the same starting dose, but antagonistic variants
    antagonise metreleptin itself at the receptor, so those patients require
    higher initial doses and variant-tailored tapering.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metreleptin
      term:
        id: NCIT:C170171
        label: Metreleptin
  target_mechanisms:
  - target: Failure of Hypothalamic Leptin Signaling
    description: >-
      Exogenous leptin supplies the absent ligand for intact hypothalamic leptin
      receptors, restoring the signal at the point where the disease begins.
    evidence:
    - reference: PMID:12393845
      reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The subcutaneous administration of recombinant human leptin has major and sustained beneficial effects on the multiple phenotypic abnormalities associated with congenital human leptin deficiency."
      explanation: >-
        Correction of the full multi-system phenotype by replacing the ligand
        supports the treatment acting at the leptin signalling node.
  - target: Unopposed Orexigenic Drive
    description: >-
      Restored leptin signalling re-establishes satiety, and reduced food intake
      is the principal driver of the weight loss observed on therapy.
    evidence:
    - reference: PMID:22627381
      reference_title: "Leptin and leptin receptor-related monogenic obesity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It results in weight loss, mainly of fat mass, with a major effect on reducing food intake"
      explanation: >-
        Identifies reduced food intake as the mechanism of the therapeutic
        weight loss, which is the orexigenic node being corrected.
  - target: Impaired T Cell Number and Function
    description: >-
      Leptin replacement restores CD4-positive T cell numbers and T cell
      proliferative and cytokine responses.
    evidence:
    - reference: PMID:12393845
      reference_title: "Beneficial effects of leptin on obesity, T cell hyporesponsiveness, and neuroendocrine/metabolic dysfunction of human congenital leptin deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "impaired T cell proliferation and cytokine release, all of which were reversed by recombinant human leptin administration"
      explanation: >-
        Direct evidence that leptin administration reverses the T cell defect.
  - target: Starvation-Pattern Neuroendocrine Suppression
    description: >-
      Leptin substitution induces pulsatile gonadotropin secretion and permits
      pubertal progression, and raises thyroid hormone levels.
    evidence:
    - reference: PMID:22343341
      reference_title: "Leptin substitution results in the induction of menstrual cycles in an adolescent with leptin deficiency and hypogonadotropic hypogonadism."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After 11 weeks of therapy, basal and stimulated LH and FSH levels rose to pubertal values and nocturnal pulsatility was initiated."
      explanation: >-
        Documents restoration of gonadotropin secretion and pulsatility on
        leptin, correcting the suppressed neuroendocrine node.
  target_phenotypes:
  - preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  - preferred_term: Hyperphagia
    term:
      id: HP:0002591
      label: Polyphagia
  evidence:
  - reference: PMID:22627381
    reference_title: "Leptin and leptin receptor-related monogenic obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therapeutic option (subcutaneous daily injection of leptin) is available for patients with LEP deficiency."
    explanation: >-
      Establishes daily subcutaneous leptin as the available therapy for this
      specific genotype.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients living with antagonistic leptin cannot receive the same dose of metreleptin as patients living with classical hormone deficiency but require higher initial doses and appropriate dose tapering"
    explanation: >-
      Establishes that the dose is subtype-dependent, which is why this entry
      does not assert a uniform treatment response.

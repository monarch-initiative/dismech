inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic (homozygous or compound heterozygous) LEP variants are required.
    The original kindred was highly consanguineous and the affected children
    were homozygous for a codon 133 frameshift.
  inheritance_term:

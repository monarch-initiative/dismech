    snippet: "We have examined two severely obese children who are members of the same highly"
    explanation: >-
      The founding report identifies affected children within a single highly
      consanguineous pedigree, the pattern expected of a recessive trait.
pathophysiology:
- name: Absent or Bioinactive Leptin
  biological_scale: MOLECULAR
  description: >-
    Biallelic LEP variants remove the circulating leptin signal. The classical
    lesion is a frameshift or nonsense variant producing no secreted hormone, so
    serum leptin is low or undetectable despite a greatly expanded fat mass.
    A second, later-recognised class of missense variants yields a hormone that
    is secreted and immunoreactive — so measured leptin is normal or high — but
    biologically inactive or antagonistic at the receptor. Both classes abolish
    leptin signalling; only the assay result differs, which is why a normal
    leptin level does not exclude the diagnosis.
  gene:
    preferred_term: LEP
    term:
      id: hgnc:6553
      label: LEP
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  molecular_functions:
  - preferred_term: leptin hormone activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9202122
    reference_title: "Congenital leptin deficiency is associated with severe early-onset obesity in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide in codon 133 of the gene for leptin was found"
    explanation: >-
      Identifies the founding loss-of-function LEP lesion in the two affected
      children.
  - reference: PMID:38470203
    reference_title: "Classification of Congenital Leptin Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, variants have been described resulting in secreted mutant forms of the"
    explanation: >-
      Establishes the second variant class, in which mutant leptin is secreted
      rather than absent, so the molecular lesion is signal failure rather than
      simply low hormone concentration.
  - reference: PMID:26186301
    reference_title: "Severe Early-Onset Obesity Due to Bioinactive Leptin Caused by a p.N103K Mutation in the Leptin Gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro experiments in a heterologous cell system demonstrated that the mutated protein was biologically inactive."
    explanation: >-
      Functional confirmation that a secreted missense LEP product is inactive,
      supporting bioinactivity as a distinct molecular route to the same disease.
  downstream:
  - target: Failure of Hypothalamic Leptin Signaling
    causal_link_type: DIRECT
- name: Failure of Hypothalamic Leptin Signaling
  biological_scale: CELLULAR
  description: >-
    Without a functional ligand, leptin receptors on arcuate nucleus neurons
    are never engaged, so the JAK2/STAT3 cascade downstream of LEPR is not
    activated. Anorexigenic POMC/CART neurons lose their principal excitatory
    drive and orexigenic AgRP/NPY neurons lose their principal inhibition. The
    hypothalamus therefore reports depleted energy stores irrespective of the
    actual, greatly expanded, adipose mass — the central pathogenic inversion of
    this disease.
  cell_types:
  - preferred_term: arcuate nucleus POMC and AgRP neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: arcuate nucleus of hypothalamus
    term:
      id: UBERON:0001932
      label: arcuate nucleus of hypothalamus

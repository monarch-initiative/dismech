    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of a man with a heterozygous pathogenic CDKN1C variant has a 50% chance of inheriting the variant but is expected to be unaffected."
    explanation: >-
      The counseling asymmetry that follows from paternal silencing.

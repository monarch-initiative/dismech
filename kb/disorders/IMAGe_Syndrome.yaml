treatments:
- name: Glucocorticoid and Mineralocorticoid Replacement
  description: >-
    The core treatment, managed as for adrenal insufficiency of any cause:
    replacement doses of glucocorticoid and mineralocorticoid plus oral sodium
    chloride. GeneReviews flags the specific tension to manage - steroid doses
    should be optimized to allow linear growth without risking an adrenal
    crisis, which in an undergrowth disorder is a real trade-off rather than a
    formality.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

name: IMAGe Syndrome
creation_date: "2026-08-27T01:40:00Z"
category: Mendelian
synonyms:
- IMAGE syndrome
- intrauterine growth retardation-metaphyseal dysplasia-adrenal hypoplasia congenita-genital anomalies syndrome
description: >-
  IMAGe syndrome is an undergrowth disorder named for its four cardinal
  findings - Intrauterine growth restriction, Metaphyseal dysplasia, Adrenal
  hypoplasia congenita and Genitourinary anomalies in males - caused by
  heterozygous missense variants in the imprinted gene CDKN1C (p57KIP2) on
  11p15. Two features make it mechanistically unusual. First, the variants act
  by gain of function: they cluster in the PCNA-binding domain, abolish PCNA
  binding and dramatically stabilize the protein, so more rather than less of a
  cyclin-dependent kinase inhibitor accumulates. That is the mirror image of the
  loss-of-function CDKN1C variants that cause the overgrowth disorder
  Beckwith-Wiedemann syndrome, and the same gene therefore sits at both ends of
  a growth axis. Second, because CDKN1C is maternally expressed and paternally
  silenced, only maternal transmission produces disease; a father carrying the
  variant has unaffected children who may themselves transmit it. Adrenal
  insufficiency, usually declaring itself as a neonatal adrenal crisis, is the
  life-threatening component and the reason the diagnosis is urgent.
disease_term:
  preferred_term: IMAGe syndrome
  term:
    id: MONDO:0013873
    label: IMAGe syndrome
parents:
- Primordial dwarfism
- Imprinting disorder
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  - classification_value: ENDOCRINOLOGY_METABOLISM
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0210 "IMAGE syndrome (intrauterine growth retardation,
      metaphyseal dysplasia, adrenal hypoplasia, and genital anomalies)" (AD,
      OMIM 614732, CDKN1C). The nosology carries a second IMAGe row at
      NOS 21-0220, "IMAGE syndrome / FILS syndrome, POLE-related" (AR, OMIM
      618336 and 615139); that is a different gene and a different entity and is
      deliberately NOT curated here. Note also that CDKN1C is shared with
      Beckwith-Wiedemann syndrome and with familial Silver-Russell syndrome,
      neither of which is in the nosology - the gene does not place a disorder
      in this group, the committee's listing does.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population prevalence estimate has been published. The disease-defining
    report identified CDKN1C variants in two familial and four unrelated
    patients; ascertainment since has been case-by-case.
inheritance:
- name: Autosomal dominant with maternal-only transmission (imprinted)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  parent_of_origin_effect: >-
    CDKN1C is maternally expressed and paternally silenced. Only maternal
    transmission of the variant causes IMAGe syndrome; a child inheriting it
    from an unaffected carrier father is expected to be unaffected but can
    transmit it to his or her own children if female.
  description: >-
    Heterozygous CDKN1C variants segregating with an imprinted mode of
    inheritance. The mother in the Hamajima series was herself an unaffected
    carrier.
  evidence:
  - reference: PMID:22634751
    reference_title: "Mutations in the PCNA-binding domain of CDKN1C cause IMAGe syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A familial analysis showed an imprinted mode of inheritance in which only maternal transmission of the mutation resulted in IMAGe syndrome."
    explanation: >-
      Establishes the parent-of-origin restriction that governs recurrence
      counseling.
genetic:
- name: CDKN1C
  gene_term:
    preferred_term: CDKN1C
    term:
      id: hgnc:1786
      label: CDKN1C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    CDKN1C (11p15.4) encodes p57KIP2, a cyclin-dependent kinase inhibitor.
    IMAGe-associated variants are missense and cluster in the PCNA-binding
    domain - p.Ile272Ser, p.Asp274Asn and p.Phe276Val among them - and act by
    gain of function. Variants elsewhere in the gene cause Beckwith-Wiedemann
    syndrome by loss of function, so the domain, not merely the gene, is what
    identifies IMAGe.
  evidence:
  - reference: PMID:22634751
    reference_title: "Mutations in the PCNA-binding domain of CDKN1C cause IMAGe syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified missense mutations in the imprinted gene CDKN1C (also known as P57KIP2) in two familial and four unrelated patients"
    explanation: >-
      The gene-discovery study for IMAGe syndrome.
  - reference: PMID:24098681
    reference_title: "Increased protein stability of CDKN1C causes a gain-of-function phenotype in patients with IMAGe syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous mutation, c.815T>G (p.Ile272Ser), in the CDKN1C gene in three siblings manifesting clinical symptoms associated with IMAGe syndrome and their mother (unaffected carrier)."
    explanation: >-
      An independent family confirming both the variant class and the unaffected
      female carrier state expected under imprinting.
pathophysiology:
- name: CDKN1C PCNA-Binding Domain Variant
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    A heterozygous missense variant in the PCNA-binding domain of the maternally
    expressed CDKN1C allele. All IMAGe-associated variants cluster in this
    domain and abolish PCNA binding, which is what distinguishes them from the
    Beckwith-Wiedemann variants elsewhere in the same gene.
  genes:
  - preferred_term: CDKN1C
    term:
      id: hgnc:1786
      label: CDKN1C
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    allele_type: missense
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous missense variants restricted to the PCNA-binding domain of
      the maternally expressed CDKN1C allele.
  downstream:
  - target: Stabilized p57KIP2 Protein
  evidence:
  - reference: PMID:22634751
    reference_title: "Mutations in the PCNA-binding domain of CDKN1C cause IMAGe syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All IMAGe-associated mutations clustered in the PCNA-binding domain of CDKN1C and resulted in loss of PCNA binding, distinguishing them from the mutations of CDKN1C that cause Beckwith-Wiedemann syndrome, an overgrowth syndrome."
    explanation: >-
      Localizes the variants to one domain and contrasts them with the
      overgrowth-causing variant class in the same gene.
- name: Stabilized p57KIP2 Protein
  biological_scale: MOLECULAR
  description: >-
    Wild-type p57KIP2 is short-lived and turned over by the proteasome.
    IMAGe-associated mutant proteins remain stable in the presence of
    cycloheximide, so the variant acts by escaping degradation. This is the step
    that resolves an apparent paradox: loss of PCNA binding alone does not
    explain undergrowth, but accumulation of a cell-cycle inhibitor does.
  molecular_functions:
  - preferred_term: cyclin-dependent protein serine/threonine kinase inhibitor activity
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: GAIN_OF_FUNCTION
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  downstream:
  - target: Suppressed Cell Cycle Progression and Undergrowth
  evidence:
  - reference: PMID:24098681
    reference_title: "Increased protein stability of CDKN1C causes a gain-of-function phenotype in patients with IMAGe syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the IMAGe-associated mutant CDKN1C proteins were fairly stable even in the presence of cycloheximide, whereas the wild-type protein was almost completely degraded via the proteasome pathway"
    explanation: >-
      Directly demonstrates the stabilization that constitutes the gain of
      function.
  - reference: PMID:24098681
    reference_title: "Increased protein stability of CDKN1C causes a gain-of-function phenotype in patients with IMAGe syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "loss of PCNA binding and suppression of CDKN1C monoubiquitination by IMAGe-associated mutations hardly explain the reduced-growth phenotype"
    explanation: >-
      States the explanatory gap that protein stabilization fills, which is why
      this node sits between the variant and the growth phenotype.
- name: Suppressed Cell Cycle Progression and Undergrowth
  biological_scale: CELLULAR
  description: >-
    CDKN1C inhibits cell-cycle progression, so a stabilized, accumulating
    protein suppresses proliferation. Targeted expression of IMAGe-associated
    CDKN1C in Drosophila caused severe eye growth defects relative to wild-type
    CDKN1C - the in vivo demonstration that the variant is hypermorphic rather
    than merely non-functional.
  biological_processes:
  - preferred_term: negative regulation of cell population proliferation
    term:
      id: GO:0008285
      label: negative regulation of cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Intrauterine and Postnatal Growth Restriction
  - target: Adrenal Hypoplasia Congenita
  - target: Cryptorchidism
    description: >-
      Grouped with the male genitourinary findings, which are a developmental
      consequence of the same proliferative suppression; the specific route is
      not established.
  - target: Micropenis
    description: >-
      As for cryptorchidism: a male-restricted developmental consequence with
      no established specific route.
  - target: Hypospadias
    description: >-
      As for cryptorchidism: a male-restricted developmental consequence with
      no established specific route.
  - target: Hypotonia
    description: >-
      Reported in some individuals; grouped with the developmental
      consequences of the proliferative suppression, with no established
      route.
  evidence:
  - reference: PMID:22634751
    reference_title: "Mutations in the PCNA-binding domain of CDKN1C cause IMAGe syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "targeted expression of IMAGe-associated CDKN1C mutations in Drosophila caused severe eye growth defects compared to wild-type CDKN1C, suggesting a gain-of-function mechanism"
    explanation: >-
      An in vivo growth-suppression assay establishing the gain-of-function
      mechanism.
  - reference: PMID:24098681
    reference_title: "Increased protein stability of CDKN1C causes a gain-of-function phenotype in patients with IMAGe syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the reduced-growth phenotype of IMAGe syndrome derives from CDKN1C gain-of-function due to IMAGe-associated mutations driving increased protein stability"
    explanation: >-
      States the causal chain from stabilization to reduced growth that this
      node asserts.
- name: Intrauterine and Postnatal Growth Restriction
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The "I" of IMAGe: prenatal-onset growth restriction that persists, with
    delayed bone age, short stature and variable metaphyseal and epiphyseal
    dysplasia.
  downstream:
  - target: Intrauterine growth restriction
    description: >-
      The prenatal growth endpoint; the "I" of the acronym.
  - target: Short stature
    description: >-
      The postnatal growth endpoint.
  - target: Delayed bone age
    description: >-
      Skeletal maturation lags because the same cell-cycle suppression slows
      growth-plate chondrocyte turnover.
  - target: Metaphyseal dysplasia
    description: >-
      Named in the acronym and grouped here; note it is only occasionally
      present, and no work connects p57KIP2 stabilization specifically to
      metaphyseal architecture.
  evidence:
  - reference: PMID:24624461
    reference_title: "IMAGe Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some type of skeletal abnormality (most commonly delayed bone age and short stature, and occasionally, metaphyseal and epiphyseal dysplasia of varying severity)"
    explanation: >-
      GeneReviews characterizes the skeletal and growth component, including how
      variable the metaphyseal dysplasia actually is.
- name: Adrenal Hypoplasia Congenita
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Adrenal insufficiency, usually presenting in the first month of life as an
    adrenal crisis and only rarely later in childhood with failure to thrive and
    recurrent vomiting. This is the life-threatening component of the syndrome.
  locations:
  - preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  biological_processes:
  - preferred_term: adrenal gland development
    term:
      id: GO:0030325
      label: adrenal gland development
    modifier: DECREASED
  downstream:
  - target: Adrenal hypoplasia congenita
    description: >-
      The structural adrenal endpoint.
  - target: Adrenal insufficiency
    description: >-
      The functional consequence of the hypoplastic adrenal cortex.
  - target: Nephrocalcinosis
    description: >-
      Largely a consequence of managing the adrenal insufficiency: GeneReviews
      makes hypercalciuria and nephrocalcinosis an explicit annual
      surveillance item in treated patients, rather than a primary feature.
  evidence:
  - reference: PMID:24624461
    reference_title: "IMAGe Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adrenal insufficiency often presenting in the first month of life as an adrenal crisis or (rarely) later in childhood with failure to thrive and recurrent vomiting"
    explanation: >-
      GeneReviews describes the presentation and its timing.

discussions:
- discussion_id: imag_adrenal_tissue_selectivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Adrenal Hypoplasia Congenita
  prompt: >-
    Why does a general gain of function in a ubiquitously acting cell-cycle
    inhibitor produce adrenal hypoplasia specifically, rather than uniform
    undergrowth of every organ?
  rationale: >-
    The stabilization mechanism is established and explains reduced growth in
    general, but nothing in it accounts for the tissue selectivity that gives
    IMAGe syndrome its adrenal and male-genital emphasis. No published work
    identifies an adrenal-specific requirement for p57KIP2 turnover, and the
    Drosophila assay that established the gain of function measured eye growth,
    not an adrenal analogue.

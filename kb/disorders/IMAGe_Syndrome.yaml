- name: Genetic Counseling
  description: >-
    Counseling is dominated by the imprinting: each child of a heterozygous
    woman has a 50% chance of being affected, whereas each child of a
    heterozygous man has the same 50% chance of inheriting the variant but is
    expected to be unaffected. Testing at-risk newborns allows adrenal
    insufficiency to be managed before a crisis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

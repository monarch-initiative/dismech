name: Wissler syndrome
creation_date: '2026-01-27T22:32:20Z'
category: Immune
description: >-
  Wissler syndrome (Wissler-Fanconi syndrome; historically "subsepsis
  allergica") is a rare descriptive rheumatic syndrome defined by recurrent
  high fever, polymorphous exanthem, leukocytosis, and arthralgia. Its nosologic
  identity remains disputed: publications have treated it as a separate entity,
  an early or atypical Still-disease presentation, or a broad historical label
  spanning several modern diagnoses. No disease-specific molecular mechanism is
  established. Innate-immune mechanisms and biologic treatments established for
  adult-onset Still disease are therefore represented here only as conditional
  extrapolations, not as proven Wissler-syndrome biology or management.
disease_term:
  term:
    id: MONDO:0006018
    label: Wissler syndrome
  preferred_term: Wissler syndrome
parents:
- rheumatic disorder
- syndromic disease
synonyms:
- Wissler-Fanconi syndrome
- Subsepsis allergica
- Subsepsis hyperergica
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      Placed with the immune-mediated and rheumatologic disorders on the basis
      of its described character as a systemic inflammatory syndrome and its
      disputed relationship to Still disease, not on a settled mechanism.
    evidence:
    - reference: PMID:3092775
      reference_title: "[Fatal form of pericardo-myocarditis in Wissler-Fanconi syndrome]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The Wissler-Fanconi syndrome is an inflammatory disease of unknown
        origin, similar to Still's disease, a systemic form of juvenile
        arthritis.
      explanation: >-
        Characterizes the syndrome as a systemic inflammatory disease related
        to juvenile arthritis, supporting placement in the immune and
        rheumatologic Part.

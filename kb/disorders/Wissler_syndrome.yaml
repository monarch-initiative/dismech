diagnosis:
- name: Historical descriptive clinical pattern
  description: >-
    The historical syndrome is recognized by the combination of polymorphous
    exanthem, recurrent high fever, leukocytosis, and arthralgia. These are
    descriptive features, not validated classification criteria with known
    sensitivity or specificity.
  results: The full quartet supports consideration of the historical label.
  evidence:
  - reference: PMID:8150635
    reference_title: "[Wissler's allergic subsepsis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This rare disease is characterized by four typical symptoms: polymorphous
      exanthemas, recurrent high fever, leucocytosis and arthralgia.
    explanation: Defines the historical descriptive pattern.
- name: Exclusionary clinical evaluation
  description: >-
    Infection/sepsis, malignancy, and competing autoimmune or autoinflammatory
    diagnoses must be assessed before applying the historical label. The workup
    should be tailored to the presentation; no unique confirmatory test exists.
  results: A compatible syndrome after appropriate exclusions may support the label.
  evidence:
  - reference: PMID:27843372
    reference_title: "Wissler-Fanconi syndrome and related diagnoses: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before diagnosing Wissler-Fanconi syndrome, other conditions to exclude
      are sepsis/infection, neoplastic diseases (eg, lymphoma), and other
      autoimmune diseases (eg, Schnitzler-like and dermatomyositis).
    explanation: Explicitly describes diagnosis as exclusionary.
- name: Ferritin measurement
  diagnosis_term:

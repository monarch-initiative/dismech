mechanistic_hypotheses:
- hypothesis_group_id: still_spectrum_extrapolation
  hypothesis_label: Conditional Still-Spectrum Extrapolation
  status: ALTERNATIVE
  description: >-
    If a presentation historically labelled Wissler syndrome is an early or
    atypical form of Still disease, AOSD monocyte/macrophage, inflammasome, and
    IL-1/IL-18 mechanisms may apply. This conditional model is supported by
    proposed nosologic overlap, the contemporary consensus that unified the
    Still-disease spectrum, and a recent case-report framing, not by
    Wissler-specific molecular studies.
  evidence:
  - reference: PMID:39317417
    reference_title: EULAR/PReS recommendations for the diagnosis and management of Still's disease, comprising systemic juvenile idiopathic arthritis and adult-onset Still's disease.  # codespell:ignore-line
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      sJIA and AOSD are one disease, to be designated by one name, Still's
      disease.
    explanation: >-
      EULAR/PReS consensus unifies systemic juvenile idiopathic arthritis and
      adult-onset Still disease into a single entity, establishing the
      Still-disease spectrum that this hypothesis would extrapolate from. It
      does not place Wissler syndrome inside that spectrum, so the support is
      partial.
  - reference: PMID:8150635
    reference_title: "[Wissler's allergic subsepsis]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome has sometimes been considered equivalent to or an initial
      stage of Still's disease (juvenile rheumatoid arthritis) progressing to
      degenerative arthritis in many patients, whereas other authors have
      classified it as a separate entity with good prognosis.
    explanation: >-
      Supports historical Still overlap while explicitly documenting a competing
      interpretation.
  - reference: PMID:41737969
    reference_title: "When Fever Defies Diagnosis: Wissler-Fanconi Syndrome as an Atypical Presentation of Adult-Onset Still's Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of the Wissler-Fanconi variant and early ferritin testing can
      prevent diagnostic delay and enable prompt, effective immunosuppressive
      therapy.
    explanation: >-
      A recent single case report frames Wissler-Fanconi syndrome as an AOSD
      variant; its evidentiary weight is insufficient to settle the nosology.
- hypothesis_group_id: distinct_historical_syndrome
  hypothesis_label: Distinct Historical Syndrome
  status: ALTERNATIVE
  description: >-
    Wissler syndrome may be a separate clinicopathologic entity defined by its
    recurrent febrile-exanthem-leukocytosis-arthralgia pattern. Under this model,
    its cause remains unknown and Still-disease mechanisms cannot be assumed.
  evidence:
  - reference: PMID:3092775
    reference_title: "[Fatal form of pericardo-myocarditis in Wissler-Fanconi syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Wissler-Fanconi syndrome is an inflammatory disease of unknown origin,
      similar to Still's disease, a systemic form of juvenile arthritis.
    explanation: >-
      Describes unknown origin and similarity, rather than demonstrated identity,
      with Still disease.
  - reference: PMID:8150635
    reference_title: "[Wissler's allergic subsepsis]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome has sometimes been considered equivalent to or an initial
      stage of Still's disease (juvenile rheumatoid arthritis) progressing to
      degenerative arthritis in many patients, whereas other authors have
      classified it as a separate entity with good prognosis.
    explanation: >-
      Directly documents the historical separate-entity interpretation.
pathophysiology:
- name: Still-spectrum monocyte and macrophage activation (extrapolated)
  description: >-
    AOSD literature implicates PAMP/DAMP-pattern-recognition-receptor signalling
    and other stimuli in monocyte/macrophage activation. This is a hypothesis
    for Wissler-labelled illness only when the Still-spectrum interpretation is
    accepted; no Wissler-specific cellular study was identified.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: pattern recognition receptor signaling pathway
    term:
      id: GO:0002221
      label: pattern recognition receptor signaling pathway
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:36090971
    reference_title: Activation mechanisms of monocytes/macrophages in adult-onset Still disease.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Regarding the activation mechanisms of monocytes/macrophages in AOSD, in
      addition to type II interferon (IFN) stimulation, several pathways have
      recently been identified, such as the pathogen-associated molecular
      patterns (PAMPs) and damage-associated molecular patterns
      (DAMPs)-pattern recognition receptors (PRRs) axis, and neutrophil
      extracellular traps (NETs)-DNA.
    explanation: >-
      Supports this mechanism in AOSD only; its transfer to Wissler syndrome is
      conditional on the disputed Still-spectrum hypothesis.
  downstream:
  - target: Still-spectrum NLRP3 and IL-1/IL-18 activation (extrapolated)
    causal_link_type: DIRECT
    description: >-
      In AOSD, the reviewed stimuli activate NLRP3 and caspase-1, producing
      mature IL-1β and IL-18.
    hypothesis_groups:
    - still_spectrum_extrapolation
    evidence:
    - reference: PMID:36090971
      reference_title: Activation mechanisms of monocytes/macrophages in adult-onset Still disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These stimulations on monocytes/macrophages cause activation of the
        nucleotide-binding oligomerization domain, leucine-rich repeat, and
        pyrin domain (NLRP) 3 inflammasomes, which trigger capase-1 activation,
        resulting in conversion of pro-IL-1β and pro-IL-18 into mature forms.
      explanation: >-
        Supports the edge in AOSD; the hypothesis-group tag prevents it from
        being presented as established Wissler-specific causality.
- name: Still-spectrum NLRP3 and IL-1/IL-18 activation (extrapolated)
  description: >-
    AOSD studies describe NLRP3 inflammasome activation, caspase-1 activation,
    and maturation of IL-1β and IL-18 in activated monocytes/macrophages. No
    corresponding measurement has been reported specifically in a
    Wissler-syndrome cohort.

discussions:
- discussion_id: wissler-nosologic-boundary
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - mechanistic_hypothesis#still_spectrum_extrapolation
  - mechanistic_hypothesis#distinct_historical_syndrome
  - diagnosis#Historical descriptive clinical pattern
  prompt: >-
    Is Wissler syndrome a distinct entity, an early or atypical Still-disease
    presentation, or a historical umbrella that combines several modern diagnoses?
  rationale: >-
    The literature explicitly presents competing interpretations. A 1994 report
    records both equivalence/initial-stage and separate-entity views; a 2016 case
    report says the boundary remains open to debate; a 2026 case report uses a
    Still-variant framing but cannot settle the issue alone. The answer controls
    whether AOSD mechanism and treatment evidence can be transferred.
  evidence:
  - reference: PMID:8150635
    reference_title: "[Wissler's allergic subsepsis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome has sometimes been considered equivalent to or an initial
      stage of Still's disease (juvenile rheumatoid arthritis) progressing to
      degenerative arthritis in many patients, whereas other authors have
      classified it as a separate entity with good prognosis.
    explanation: Explicitly documents the two competing historical interpretations.
  - reference: PMID:27843372
    reference_title: "Wissler-Fanconi syndrome and related diagnoses: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This syndrome was considered by some authors as a premature stage of adult
      Still’s disease, whereas other authors considered it a separate entity,
      and this remains open to debate.
    explanation: Explicitly states that the nosologic boundary remains unresolved.
  - reference: PMID:41737969
    reference_title: "When Fever Defies Diagnosis: Wissler-Fanconi Syndrome as an Atypical Presentation of Adult-Onset Still's Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of the Wissler-Fanconi variant and early ferritin testing can
      prevent diagnostic delay and enable prompt, effective immunosuppressive therapy.
    explanation: Provides a recent, but single-case, Still-variant interpretation.
  proposed_experiments:
  - experiment_id: prospective-wissler-nosology-cohort
    name: Prospective multicenter nosology cohort
    description: >-
      Enroll patients meeting the historical
      fever-exanthem-leukocytosis-arthralgia pattern before final diagnosis.
      Apply standardized infectious,
      malignant, rheumatic-fever, rheumatoid-arthritis, systemic-JIA, and AOSD
      evaluations; collect longitudinal phenotypes, serial cytokines, ferritin,
      and single-cell immune profiles; and adjudicate final diagnoses blinded to
      molecular clustering.
    readouts:
    - name: Concordance of historical phenotype with contemporary diagnosis and immune cluster
      target: pathophysiology#Recurrent systemic inflammatory episodes
    decision_criterion: >-
      A reproducible cluster that aligns with contemporary Still disease would
      support transfer of Still mechanisms; a distinct reproducible cluster
      would support a separate entity; heterogeneous final diagnoses without a
      shared profile would support an umbrella-label interpretation.
- discussion_id: wissler-mechanism-validation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Still-spectrum monocyte and macrophage activation (extrapolated)
  - pathophysiology#Still-spectrum NLRP3 and IL-1/IL-18 activation (extrapolated)
  prompt: >-
    Do patients prospectively identified by the historical Wissler pattern show
    the monocyte/macrophage and NLRP3-IL-1/IL-18 state described in AOSD?
  rationale: >-
    The mechanistic evidence currently comes from AOSD, and no disease-specific
    experimental model, cohort-scale cytokine study, or omics dataset was
    identified. Importing an AOSD model would assume the disputed equivalence.
  evidence:
  - reference: PMID:3092775
    reference_title: "[Fatal form of pericardo-myocarditis in Wissler-Fanconi syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Wissler-Fanconi syndrome is an inflammatory disease of unknown origin,
      similar to Still's disease, a systemic form of juvenile arthritis.
    explanation: Establishes that the disease-specific origin was unresolved.
  - reference: PMID:36090971
    reference_title: Activation mechanisms of monocytes/macrophages in adult-onset Still disease.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      These stimulations on monocytes/macrophages cause activation of the
      nucleotide-binding oligomerization domain, leucine-rich repeat, and pyrin
      domain (NLRP) 3 inflammasomes, which trigger capase-1 activation,
      resulting in conversion of pro-IL-1β and pro-IL-18 into mature forms.
    explanation: Defines the AOSD mechanism that remains to be tested in Wissler-labelled patients.
  proposed_experiments:
  - experiment_id: wissler-aosed-mechanism-comparison
    name: Blinded Wissler-pattern versus AOSD immune comparison
    description: >-
      Compare prospectively collected Wissler-pattern cases, criteria-confirmed
      AOSD/systemic JIA, febrile infectious controls, and inflammatory controls
      using serial monocyte activation phenotyping, inflammasome activity,
      IL-1β/IL-18 measurements, and single-cell transcriptomics before major
      immunosuppression.
    readouts:
    - name: Reproducible monocyte and inflammasome signature by adjudicated diagnosis
      target: pathophysiology#Still-spectrum NLRP3 and IL-1/IL-18 activation (extrapolated)
    decision_criterion: >-
      A replicated signature matching Still disease after exclusion of mimics
      would support the conditional mechanism; absence of that signature or
      separation into heterogeneous disease-specific profiles would refute its
      use as a general Wissler mechanism.
- discussion_id: wissler-aps1-cooccurrence
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent systemic inflammatory episodes
  prompt: >-
    Does the reported co-occurrence of the Wissler-Fanconi pattern with
    autoimmune polyendocrine syndrome type 1 reflect a shared autoimmune
    mechanism, or is it a coincidental pairing seen in one patient?
  rationale: >-
    A 1990 case report describes a child with established polyglandular
    autoimmune syndrome type I who separately met the criteria for
    Wissler-Fanconi syndrome, and states that this association had not been
    reported before. Type I polyglandular autoimmune syndrome is a monogenic
    breakdown of central immune tolerance, so a real association would suggest
    that the Wissler pattern can arise as a secondary manifestation of a
    defined immune defect rather than as an independent entity. A single report
    cannot separate that possibility from chance, and the same report records
    nine subsequent years without rheumatoid symptoms, so the observation is
    held here as an open question rather than as an asserted comorbidity.
  evidence:
  - reference: PMID:2233764
    reference_title: "[Subsepsis allergica in a patient with type I polyglandular autoimmune syndrome]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All included the criteria of Wissler-Fanconi syndrome became clear which
      has not yet been reported in association with PGA.
    explanation: >-
      Documents the co-occurrence and states that it was unreported at the
      time; a single case cannot establish an association.
  - reference: PMID:2233764
    reference_title: "[Subsepsis allergica in a patient with type I polyglandular autoimmune syndrome]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although this syndrome generally is considered an equivalent of Still's
      syndrome, rheumatoid symptoms could not be ascertained during the
      following 9-year-course of PGA.
    explanation: >-
      Nine years of follow-up without rheumatoid symptoms in the same patient
      bears on whether the episode behaved like Still disease.
  proposed_experiments:
  - experiment_id: aire-cohort-wissler-pattern-screen
    name: APS-1 cohort screen for the Wissler pattern
    description: >-
      Review established APS-1 and AIRE-variant registries for episodes meeting
      the historical fever, polymorphous exanthem, leukocytosis, and arthralgia
      pattern, and compare the observed rate with the rate in age-matched
      autoimmune and general pediatric comparison cohorts.
    readouts:
    - name: Rate of the Wissler pattern in APS-1 registries versus comparison cohorts
      target: pathophysiology#Recurrent systemic inflammatory episodes
    decision_criterion: >-
      A rate clearly above the comparison cohorts would support a real
      association with defective central tolerance; a comparable rate would
      support coincidence and argue against curating a comorbidity.

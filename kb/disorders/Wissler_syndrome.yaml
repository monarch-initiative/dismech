    reference_title: "When Fever Defies Diagnosis: Wissler-Fanconi Syndrome as an Atypical Presentation of Adult-Onset Still's Disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of the Wissler-Fanconi variant and early ferritin testing can
      prevent diagnostic delay and enable prompt, effective immunosuppressive therapy.
    explanation: Supports early ferritin testing in a recent AOSD-variant case framing.
notes: >-
  Wissler-Fanconi syndrome was first described in Europe in the 1940s, and most
  of the literature since then is in French and German. As of the 2016 case
  report cited in this entry (PMID:27843372), only a very few papers had
  appeared in English, none of them recent. That publication-language skew is
  why the entity is under-represented in English-language sources, and why
  several references cited here are not in English.

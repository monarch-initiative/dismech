  description: >-
    Heterozygous LMNB1 variants, confirmed de novo in most reported probands.
    Recurrence of the same variants (p.Lys33Glu, p.Lys33del, p.Arg90Pro) in
    unrelated individuals points to a restricted set of pathogenic residues.
  evidence:
  - reference: PMID:32910914
    reference_title: De Novo Variants in LMNB1 Cause Pronounced Syndromic Microcephaly and Disruption of Nuclear Envelope Integrity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we confirm this hypothesis with the identification of de novo mutations
      in LMNB1 in seven individuals with pronounced primary microcephaly
    explanation: De novo heterozygous LMNB1 variants in seven affected individuals support dominant inheritance.
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, three recurrent LMNB1 variants were identified in seven
      individuals
    explanation: >-
      An independent cohort found three recurrent heterozygous LMNB1 variants
      in seven microcephalic individuals, most of them de novo.
mechanistic_hypotheses:
- hypothesis_group_id: lamin_b_progenitor_spindle_orientation
  hypothesis_label: Lamin B Spindle-Orientation Defect in Neural Progenitors
  status: EMERGING
  description: >-
    B-type lamins associate with the mitotic spindle, and mice lacking B-type
    lamins show spindle-orientation defects in neural progenitors. The
    hypothesis is that dominant LMNB1 variants perturb progenitor division in
    the same way, depleting the progenitor pool and reducing neuron output. It
    has not been tested with the human variants.
- hypothesis_group_id: lamin_b1_migrating_neuron_nuclear_rupture
  hypothesis_label: Nuclear Membrane Rupture and Death of Migrating Neurons
  status: EMERGING
  description: >-
    A lamina weakened by assembly-defective lamin B1 may fail to protect the
    nucleus against the mechanical forces of neuronal migration, so that
    migrating neurons suffer nuclear membrane ruptures, DNA damage, and cell
    death, reducing the number of neurons that populate the cortex. Shown in
    lamin B1-deficient mice; not tested with the dominant human variants.
pathophysiology:
- name: LMNB1 Head- and Rod-Domain Variant Disrupting Lamin B1 Assembly
  description: >-
    Heterozygous missense variants and in-frame deletions alter conserved
    residues of lamin B1. Lys33 (p.Lys33Glu, p.Lys33del) lies at the
    intradimer interface of coil 1A and Arg90 (p.Arg90Pro) at the interdimer
    interface of coil 1B of the alpha-helical rod; other reported variants lie
    in the N-terminal head domain. Substitution or deletion of these residues
    is predicted to interfere with dimer or filament assembly, and the
    corresponding Lys deletion disrupts protofilament assembly of the ancestral
    C. elegans lamin. The variants are proposed to act dominantly on assembly
    of the lamin B1 filament of the nuclear lamina rather than by
    haploinsufficiency.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      Missense variants and in-frame deletions at specific residues, with no
      truncating variants, led both reporting groups to favor a dominant
      mechanism (dominant negative, with gain of function not excluded) over
      haploinsufficiency; heterozygous Lmnb1 knockout mice do not have
      microcephaly. This is an inference from the variant spectrum, structural
      modeling and overexpression assays, not a measured effect on endogenous
      lamin B1 in neural cells.

      reference_title: Deficiencies in lamin B1 and lamin B2 cause neurodevelopmental defects and distinct nuclear shape abnormalities in neurons.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The forebrain-specific Lmnb1- and Lmnb2-knockout models had a small
        forebrain with disorganized layering of neurons and nuclear shape
        abnormalities
      explanation: Forebrain loss of lamin B1 reduces forebrain size, the outcome modeled by this link.
discussions:
- discussion_id: mcph26_null_mouse_versus_dominant_variant
  prompt: >-
    Do the brain phenotypes of lamin B1-deficient mice, which center on
    neuronal migration, explain how heterozygous dominant LMNB1 variants cause
    microcephaly without a migration defect?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Neural Progenitor Spindle Misorientation
  - pathophysiology#Nuclear Membrane Rupture and Death of Migrating Neurons
  - pathophysiology#Reduced Cortical Neuron Output
  rationale: >-
    Every mechanistic step below the lamina defect is supported only by null
    or conditional-null mice. Those mice show cortical layering and neuronal
    migration defects, whereas patients with MCPH26 have a small brain with no
    migration defect on imaging, and heterozygous Lmnb1 knockout mice do not
    have microcephaly. The reporting authors attribute the difference to the
    human variants acting dominantly rather than through loss of lamin B1. No
    heterozygous knock-in of a patient variant and no patient-derived neural
    cell or organoid model has been reported, so which progenitor or neuronal
    mechanism operates in MCPH26 is unknown.
  evidence:
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      there were neuronal migration defects resulting in abnormal layering of
      the cerebral cortex,18 suggesting potential discordance with the human
      phenotype and neuroimaging findings
    explanation: The reporting authors identify the discordance between the knockout mouse brain phenotype and the human disease.
notes: >-
  The two founding reports differ in how they describe the phenotype. One
  (PMID:32910914, seven individuals) calls it a syndromic microcephaly with
  relative short stature; the other (PMID:33033404) pools seven LMNB1 and six
  LMNB2 individuals, describes a nonsyndromic microcephaly with height mostly
  in the normal range, and reports most frequencies only for the pooled
  cohort. Pooled frequencies are labeled as such in the evidence explanations.
  LMNB2-related microcephaly (MCPH27) has the same clinical picture and has its
  own entry. The molecular function binding GO:0160123 (structural
  constituent of nuclear lamina) follows the sibling MCPH27 entry; it is the
  GO term for the activity of a lamina structural protein. The deep-research
  report attributes to the Cristofoli 2020 full text (not cached; only its
  abstract is quotable here) two alleles beyond missense variants and
  codon deletions: a canonical splice-donor variant, c.939+1G>A, in three
  affected siblings whose unaffected father was about 15% mosaic for it, and
  an in-frame deletion of exons 6-8 transmitted from a mildly affected mother.
  This is why the inheritance block says de novo in most rather than all
  cases, and why low-level parental mosaicism matters for recurrence
  counselling; neither allele is cited as evidence here. The same report lists
  further features from that paper's case table that have no quotable source
  in the cache and are therefore not curated as phenotypes: scoliosis (4 of
  7), spasticity or spastic tetraparesis (3 of 7), cortical visual impairment
  (2 of 7), recurrent pneumonia (3 of 7), and gastrostomy feeding (3 of 7).

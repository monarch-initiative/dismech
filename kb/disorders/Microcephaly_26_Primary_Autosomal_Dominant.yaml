- name: Nuclear Membrane Rupture and Death of Migrating Neurons
  description: >-
    In lamin B1-deficient mouse embryos, neurons migrating through the cortical
    plate show nuclear membrane ruptures accompanied by DNA damage and cell
    death; non-migrating cells in the ventricular zone do not, and constrictive
    forces provoke the ruptures in cultured Lmnb1-/- neurons. One reporting
    group proposes, by analogy to the equivalent LMNA variant producing fragile
    nuclei, that the human LMNB1 variants make neural precursor nuclei
    mechanically fragile in the same way. Not shown with the human variants.
  biological_scale: CELLULAR

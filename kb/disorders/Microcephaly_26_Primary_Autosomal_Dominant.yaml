  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    directness: INDIRECT
    snippet: >-
      LMNB1 Lys33 and LMNB2 Asn54 lie at the intradimer interface of coil 1A,
      LMNB1 Arg90 is at the interdimer interface of coil 1B, and LMNB2 Glu398
      is at the intradimer interface of coil 2B. Substitution or deletion of
      these residues would therefore likely interfere with dimer or filament
      assembly.
    explanation: >-
      Structural modeling on homologous lamin A/C structures places the
      recurrent LMNB1 residues at dimer and filament interfaces.
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: >-
      LMNB1 p.Lys33del has already been modeled in the ancestral C.elegans LMN
      (a protein most homologous to B-type lamins1) where it disrupts
      protofilament assembly in vitro and causes nuclear aggregates of lamin in
      vivo.
    explanation: >-
      The equivalent deletion in the nematode B-type lamin disrupts filament
      assembly; the experiment is cited by, not performed in, this report.
  - reference: PMID:33033404
    reference_title: Heterozygous lamin B1 and lamin B2 variants cause primary microcephaly and define a novel laminopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The pathogenic variants reported here are most likely dominant negative
      rather than haploinsufficient given that microcephaly is not present in
      the Lmnb1+/- mouse.
    explanation: >-
      The reporting authors' interpretation of the variant spectrum favors a
      dominant negative rather than haploinsufficient mechanism.
  - reference: CGGV:assertion_17d7361d-21e7-4502-a6bf-707c36b247fc-2026-01-22T170000.000Z
    reference_title: LMNB1 / microcephaly 26, primary, autosomal dominant (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Heterozygous variants in LMNB1 act in a dominant-negative manner to
      disrupt lamin B1 function and nuclear lamina stability
    explanation: The ClinGen expert panel summary adopts the dominant-negative interpretation.

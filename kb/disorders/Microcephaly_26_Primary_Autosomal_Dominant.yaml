name: Microcephaly 26, Primary, Autosomal Dominant
creation_date: "2026-10-23T01:57:51Z"
category: Mendelian
disease_term:
  preferred_term: microcephaly 26, primary, autosomal dominant
  term:
    id: MONDO:0030928
    label: microcephaly 26, primary, autosomal dominant
synonyms:
- MCPH26
- LMNB1-related microcephaly
- LMNB1-related primary microcephaly
description: >-
  Microcephaly 26, primary, autosomal dominant (MCPH26) is a severe congenital
  microcephaly caused by heterozygous, usually de novo, missense variants or
  in-frame deletions in LMNB1, which encodes the B-type nuclear lamin lamin B1.
  It was defined in 2020 by two independent reports, one of which grouped it
  with the LMNB2 form (MCPH27) as a lamin B-associated laminopathy. Affected
  individuals have microcephaly of -3.6 to -12 SD, usually evident at birth,
  with global developmental delay and intellectual disability of variable
  severity; hypotonia, seizures, and relatively short stature occur in some.
  Neuroimaging shows a small brain without a neuronal migration defect,
  sometimes with a simplified gyral pattern, reduced white matter, or an
  abnormal corpus callosum, and these individuals tend to be more severely
  affected. The variants alter conserved residues in the head domain and the
  coiled-coil rod of lamin B1 and impair assembly of the nuclear lamina in
  cells, with mislocalized lamin B1, misshapen or condensed nuclei, and lower
  lamin B1 levels in patient lymphoblasts; they are proposed to act dominantly
  rather than by haploinsufficiency. How the lamina defect reduces cortical
  neuron output is not established: disrupted spindle orientation in neural
  progenitors and nuclear membrane rupture with death of migrating neurons are
  the two mechanisms proposed, both supported only by lamin B1-deficient mice.
  MCPH26 is distinct from autosomal dominant adult-onset demyelinating
  leukodystrophy, which is caused by LMNB1 duplication or overexpression.
parents:
- autosomal dominant primary microcephaly

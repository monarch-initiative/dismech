        conditions but displayed grossly misshapen nuclei
      explanation: Loss of normal lamin B1 distorts nuclear shape.
- name: Forebrain-specific Lmnb1 knockout mouse
  species: Mouse
  genotype: Emx1-Cre Lmnb1 fl/fl
  publication: PMID:21976703
  description: >-
    Conditional deletion of Lmnb1 in the forebrain gives a small forebrain
    with disorganized neuronal layering and nuclear shape abnormalities.
  modeled_mechanisms:
  - target: Reduced Cortical Neuron Output
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces a small forebrain, the tissue-level outcome of MCPH26.
    limitations: >-
      A conditional null rather than a dominant missense allele, and the mice
      also have disorganized neuronal layering, which MCPH26 patients do not
      show on imaging.
    evidence:

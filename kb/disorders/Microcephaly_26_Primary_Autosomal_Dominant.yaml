- name: Nuclear Lamina Assembly Defect with Abnormal Nuclear Morphology
  description: >-
    In cells, the variant lamin B1 proteins form an abnormal nuclear lamina.
    Head-domain variants reduce nuclear localization of lamin B1 and increase
    the frequency of misshapen nuclei; a coil-region variant increases the
    frequency of condensed nuclei and lowers steady-state lamin B1 levels in
    patient lymphoblastoid cells. Overexpressed GFP-tagged variants form
    nuclear aggregates. The effect has not been shown in patient neural cells.

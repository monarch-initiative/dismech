classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report two siblings with phenotypic signs, including
        intellectual disability (ID), developmental delay and microcephaly from a
        Pakistani consanguineous family in which we have identified homozygosity
        for p(Tyr103His) in the PSMB1 gene
      explanation: >-
        The defining manifestations are neurological (microcephaly, intellectual
        disability, developmental delay), placing the entry in the neurologic
        chapter.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      Assigned on the degradation side of proteostasis: the primary lesion is in
      the proteasome itself rather than in an aggregation-prone client protein,
      so this is proteostasis failure by loss of degradative capacity. No
      PSMB1-specific aggregation or interferon-signature data exist yet (see the
      knowledge-gap discussion), and the classification rests on the
      class-level characterisation of proteasomopathies.
    evidence:
    - reference: PMID:42370079
      reference_title: >-
        Molecular mechanisms in rare proteasomopathies.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The concomitant proteasome impairment leads to imbalanced protein
        homeostasis by dysfunctional ubiquitin-mediated protein degradation.
      explanation: >-
        Establishes that proteasomopathies as a class act through failure of
        ubiquitin-mediated protein homeostasis; PARTIAL because the statement is
        class-level rather than specific to PSMB1.
inheritance:
- name: Autosomal recessive
  description: >-
    Both reported patients are sisters homozygous for PSMB1 c.307T>C
    p.(Tyr103His), inherited from unaffected consanguineous parents; the variant
    segregated with the phenotype in the kindred. Recessive inheritance is the
    exception among neurodevelopmental proteasomopathies, which are mostly
    dominant de novo disorders of the 19S regulatory particle.
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report two siblings with phenotypic signs, including intellectual
      disability (ID), developmental delay and microcephaly from a Pakistani
      consanguineous family in which we have identified homozygosity for
      p(Tyr103His) in the PSMB1 gene
    explanation: >-
      Homozygosity in two affected siblings of a consanguineous family that
      segregated with disease establishes autosomal recessive transmission.
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive forms, reported in 8/78 patients with PSMB1, PSMC1, or PSMC3
      biallelic variants, represent only 10% of neurodevelopmental
      proteasomopathies.
    explanation: >-
      Confirms that the PSMB1 form is biallelic/recessive and situates it as a
      minority pattern within the proteasomopathy class.


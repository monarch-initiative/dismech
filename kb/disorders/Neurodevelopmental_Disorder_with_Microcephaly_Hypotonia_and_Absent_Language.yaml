pathophysiology:
- name: Biallelic PSMB1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    The homozygous PSMB1 missense variant c.307T>C p.(Tyr103His) is the
    initiating lesion. PSMB1 encodes beta6, a non-catalytic beta-type subunit of
    the inner beta-rings of the 20S proteasome core particle. The variant is
    characterised as a partial rather than complete loss of function.
  genetic_context:
    gene:
      preferred_term: PSMB1
      term:
        id: hgnc:9537
        label: PSMB1
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous germline missense substitution p.(Tyr103His), inherited from
      consanguineous heterozygous parents.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PSMB1 encodes a β-type proteasome subunit (i.e. β6).
    explanation: Establishes the gene product identity as the beta6 proteasome subunit.
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PSMB1 (NM_002793.4)c.307T>C p.(Tyr103His)Possibly partial loss-of-function;
      structural modelling: possible influence on interaction between β6 and α5
    explanation: >-
      The review's variant table records the transcript, the cDNA and protein
      change, and classifies the allele as a possible partial loss of function.
  downstream:
  - target: Destabilised beta6-alpha5 Interface of the 20S Core Particle
    causal_link_type: DIRECT
    description: >-
      Tyr103 sits at the beta6 surface that contacts the alpha5 subunit;
      substitution to histidine weakens that contact.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Modeling of the p(Tyr103His) variant indicates that this variant weakens
        the interactions between PSMB1/β6 and PSMA5/α5 proteasome subunits and
        thus destabilizes the 20S proteasome complex.
      explanation: >-
        Structural modelling links the specific substitution to loss of the
        beta6-alpha5 contact.

- name: Destabilised beta6-alpha5 Interface of the 20S Core Particle
  biological_scale: MOLECULAR
  description: >-
    The 20S core particle is built from four stacked heptameric rings in the
    order alpha7-beta7-beta7-alpha7, so every beta subunit sits against defined
    neighbouring alpha and beta subunits. Weakening the beta6 (PSMB1) contact
    with alpha5 (PSMA5) destabilises the assembled core particle.
  cellular_components:
  - preferred_term: 20S proteasome core particle
    term:
      id: GO:0005839
      label: proteasome core complex
  - preferred_term: proteasome beta-ring
    term:
      id: GO:0019774
      label: proteasome core complex, beta-subunit complex
  evidence:
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The 20S CP consists of stringently ordered heptameric α- and β-rings: α7-β7-β7-α7'
    explanation: >-
      Establishes the stereotyped ring architecture in which a beta6-alpha5
      inter-subunit contact is structurally load-bearing.
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Modeling of the p(Tyr103His) variant indicates that this variant weakens
      the interactions between PSMB1/β6 and PSMA5/α5 proteasome subunits and thus
      destabilizes the 20S proteasome complex.
    explanation: Directly states destabilisation of the 20S complex by the variant.
  downstream:
  - target: Impaired beta6 Maturation and 20S Core Particle Assembly
    causal_link_type: DIRECT
    description: >-
      A destabilised inter-subunit interface impairs the ordered, chaperone-guided
      incorporation and maturation of beta6 during 20S biogenesis.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the p(Tyr103His) variant affects both the processing of PSMB1/β6 and its
        incorporation into proteasome, thus impairing proteasome activity
      explanation: >-
        Biochemical work in human SH-SY5Y cells ties the variant to defective
        beta6 processing and incorporation.

- name: Impaired beta6 Maturation and 20S Core Particle Assembly
  biological_scale: MOLECULAR
  description: >-
    Beta-ring assembly is an ordered, POMP-dependent process in which beta6 is
    incorporated onto the nascent alpha-ring, and each beta subunit must have its
    propeptide processed for the core particle to mature. In cells expressing the
    variant, beta6 maturation is absent and the unprocessed proform persists,
    with reduced overall subunit content — i.e. the defect is one of proteasome
    biogenesis rather than of catalysis.
  biological_processes:
  - preferred_term: proteasome assembly
    modifier: DECREASED
    term:
      id: GO:0043248
      label: proteasome assembly
  - preferred_term: beta6 propeptide processing
    modifier: DECREASED
    term:
      id: GO:0051604
      label: protein maturation
  evidence:
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Correct β-ring assembly strictly depends on POMP. Its recruitment
      facilitates β2 entry, followed by β3, β4, β5, β6 onto the α-ring
    explanation: >-
      Establishes that beta6 incorporation is a defined, ordered step of
      chaperone-guided 20S biogenesis, which is the step this variant perturbs.
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'SHSY5Y cells: maturation absent, proform present (myc)'
    explanation: >-
      The review's experimental-outcome table records absent beta6 maturation with
      a persisting proform in the cell model of the variant.
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSMB1/β6 pathogenic variants are the cause of a recessive disease with ID,
      microcephaly and developmental delay due to abnormal proteasome assembly
    explanation: >-
      The authors attribute the disease specifically to abnormal proteasome
      assembly.
  downstream:
  - target: Reduced Proteasome Proteolytic Capacity
    causal_link_type: DIRECT
    description: >-
      Fewer correctly matured core particles means less proteolytically competent
      proteasome.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the p(Tyr103His) variant affects both the processing of PSMB1/β6 and its
        incorporation into proteasome, thus impairing proteasome activity
      explanation: Links the assembly/maturation defect directly to impaired proteasome activity.

- name: Reduced Proteasome Proteolytic Capacity
  biological_scale: MOLECULAR
  description: >-
    Proteolysis in the 20S core particle is carried out by the caspase-like
    (beta1), trypsin-like (beta2) and chymotrypsin-like (beta5) active sites.
    Beta6 is not itself catalytic, so the activity loss is an indirect
    consequence of having fewer intact core particles. In the SH-SY5Y cell model
    the measured deficit was modest — a slight reduction of chymotrypsin-like
    activity — which is consistent with a partial rather than complete loss of
    function and is an important quantitative caveat.
  molecular_functions:
  - preferred_term: proteasome threonine-type endopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004298
      label: threonine-type endopeptidase activity
  biological_processes:
  - preferred_term: proteasomal protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0010498
      label: proteasomal protein catabolic process
  evidence:
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Peptide-bond hydrolysis is associated with the 20S CP through 3 cleavage
      specificities of the 6 active site subunits
    explanation: >-
      Establishes that proteolysis resides in the core particle's active-site
      subunits, so loss of intact core particles is what lowers activity.
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the p(Tyr103His) variant affects both the processing of PSMB1/β6 and its
      incorporation into proteasome, thus impairing proteasome activity
    explanation: Reports impaired proteasome activity as the functional consequence.
  downstream:
  - target: Impaired Ubiquitin-Dependent Protein Homeostasis
    causal_link_type: DIRECT
    description: >-
      Reduced proteasome capacity lowers throughput of the ubiquitin-proteasome
      system for polyubiquitinated substrates.
    evidence:
    - reference: PMID:42370079
      reference_title: >-
        Molecular mechanisms in rare proteasomopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The concomitant proteasome impairment leads to imbalanced protein
        homeostasis by dysfunctional ubiquitin-mediated protein degradation.
      explanation: >-
        States the class-level step from proteasome impairment to imbalanced
        protein homeostasis.

- name: Impaired Ubiquitin-Dependent Protein Homeostasis
  biological_scale: CELLULAR
  description: >-
    Reduced proteasomal throughput leaves K48-polyubiquitinated substrates
    undegraded, shifting the balance between protein synthesis and degradation.
    Across proteasomopathies this state is associated with protein aggregation
    and activated cellular stress responses; whether those specific downstream
    features occur in PSMB1-mutant cells has not been shown directly. The type I
    interferon arm of the class mechanism is deliberately NOT carried into this
    chain: PSMB1 is the one 20S core-particle subunit whose variants have not
    been shown to provoke immune dysregulation.
  biological_processes:
  - preferred_term: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      both syndromes show molecular similarities with protein aggregation,
      activated stress responses, metabolic imbalance and dysregulated type I
      interferon signalling
    explanation: >-
      Describes the shared downstream cellular consequences across
      proteasomopathies. PARTIAL because these are class-level observations that
      have not been demonstrated for PSMB1 specifically.
  downstream:
  - target: Impaired Brain Growth and Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The developing brain is the compartment in which reduced proteostatic
      capacity manifests. The molecular intermediates between lowered
      ubiquitin-proteasome throughput and reduced brain growth are not
      established; the link rests on the zebrafish loss-of-function phenotype and
      on the human microcephaly.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CRISPR/Cas9 mutagenesis or morpholino knock-down of the single psmb1
        zebrafish orthologue resulted in microcephaly, microphthalmia and reduced
        brain size.
      explanation: >-
        Two independent loss-of-function approaches in zebrafish converge on
        reduced brain size, supporting a causal link from psmb1 deficiency to
        impaired brain growth.


name: Neurodevelopmental Disorder with Microcephaly, Hypotonia, and Absent Language
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
synonyms:
- NEDMHAL
- PSMB1-related neurodevelopmental disorder
- PSMB1-related neurodevelopmental proteasomopathy
description: >-
  Neurodevelopmental disorder with microcephaly, hypotonia, and absent language
  (NEDMHAL; OMIM:620038) is an ultra-rare autosomal recessive neurodevelopmental
  disorder caused by biallelic variants in PSMB1, which encodes the beta6
  subunit of the 20S proteasome core particle. It is one of the small family of
  "neurodevelopmental proteasomopathies" (PRNDD) and is, to date, the only
  member of that family whose causal lesion sits in the 20S core particle rather
  than the 19S regulatory particle. Affected individuals have microcephaly,
  hypotonia, severe intellectual disability with global developmental delay,
  profoundly impaired expressive language, motor delay, hearing impairment,
  growth failure, and behavioural abnormalities; epilepsy, autistic features and
  visceral malformations were not seen in the published cases. Mechanistically
  the reported homozygous missense variant p.(Tyr103His) weakens the beta6-alpha5
  inter-subunit interface, destabilising the 20S proteasome complex and impairing
  beta6 propeptide maturation and its incorporation into the proteasome, so that
  ubiquitin-dependent proteolytic capacity falls. Knockdown or mutagenesis of the
  single zebrafish psmb1 orthologue reproduces microcephaly and reduced brain
  size, linking proteasome-assembly failure directly to impaired brain growth.
  The entity is defined by a single consanguineous Pakistani kindred (two
  affected sisters) plus functional validation, so its phenotypic boundaries
  remain provisional.

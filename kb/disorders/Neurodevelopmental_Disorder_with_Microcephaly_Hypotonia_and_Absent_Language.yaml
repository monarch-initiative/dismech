genetic:
- name: PSMB1
  gene_term:
    preferred_term: PSMB1
    term:
      id: hgnc:9537
      label: PSMB1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PSMB1 (6q27) encodes beta6, a non-catalytic beta-type subunit of the 20S
    proteasome core particle. A single pathogenic allele, the homozygous missense
    c.307T>C p.(Tyr103His), has been reported. PSMB1 is the only 20S core-particle
    gene implicated in a neurodevelopmental proteasomopathy; every other gene in
    the class encodes a 19S regulatory-particle subunit.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSMB1/β6 pathogenic variants are the cause of a recessive disease with ID,
      microcephaly and developmental delay due to abnormal proteasome assembly
    explanation: States the gene-disease relationship and its mode of inheritance.
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a total of six neurodevelopmental proteasomopathies have been described,
      involving the four subunits PSMB1/β6, PSMC1/Rpt2, PSMC3/Rpt5, and
      PSMD12/Rpn5
    explanation: >-
      Confirms PSMB1/beta6 as one of the four proteasome subunits implicated in
      neurodevelopmental proteasomopathies.
  - reference: PMID:38866022
    reference_title: >-
      PSMD11 loss-of-function variants correlate with a neurobehavioral
      phenotype, obesity, and increased interferon response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary proteasomopathies have recently emerged as a new class of rare
      early-onset neurodevelopmental disorders (NDDs) caused by pathogenic
      variants in the PSMB1, PSMC1, PSMC3, or PSMD12 proteasome genes.
    explanation: >-
      Names PSMB1 among the genes defining the primary-proteasomopathy disease
      class, independently of the two review sources.
  variants:
  - name: PSMB1 c.307T>C p.(Tyr103His)
    description: >-
      Homozygous missense substitution in PSMB1 (NM_002793.4), the only
      NEDMHAL-causing allele reported to date. Structural modelling places it at
      the beta6-alpha5 inter-subunit interface; in a cell model it abolishes beta6
      maturation, leaving the proform present, and reduces overall subunit content
      with a slight fall in chymotrypsin-like activity.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:42370079
      reference_title: >-
        Molecular mechanisms in rare proteasomopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        PSMB1 (NM_002793.4)c.307T>C p.(Tyr103His)Possibly partial
        loss-of-function; structural modelling: possible influence on interaction
        between β6 and α5
      explanation: >-
        The review's variant table gives the transcript, cDNA and protein change,
        the predicted partial loss of function, and the structural interpretation.

animal_models:
- species: Zebrafish
  genotype: psmb1 CRISPR/Cas9 mutant and morpholino knockdown
  category: Loss-of-function model of the single psmb1 orthologue
  publication: PMID:32129449
  description: >-
    Zebrafish carry a single psmb1 orthologue. Two independent loss-of-function
    approaches — CRISPR/Cas9 mutagenesis and morpholino knockdown — were applied,
    and both produced microcephaly, microphthalmia and reduced brain size. The
    concordance of the two approaches partially mitigates the well-known
    off-target concerns with morpholino knockdown.
  modeled_mechanisms:
  - target: Impaired Brain Growth and Neurodevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of psmb1 function reproduces the reduced brain growth that underlies
      the human microcephaly.
    limitations: >-
      The model uses complete loss of function, whereas the human allele is a
      partial-loss-of-function missense variant, so the model is not
      genotype-matched. Zebrafish cannot report the human phenotypes of language
      and behaviour, and no zebrafish proteasome-assembly or activity measurement
      is described in the abstract.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CRISPR/Cas9 mutagenesis or morpholino knock-down of the single psmb1
        zebrafish orthologue resulted in microcephaly, microphthalmia and reduced
        brain size.
      explanation: >-
        Two independent loss-of-function approaches converge on reduced brain
        size, supporting the model as informative for the brain-growth node.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CRISPR/Cas9 mutagenesis or morpholino knock-down of the single psmb1
      zebrafish orthologue resulted in microcephaly, microphthalmia and reduced
      brain size.
    explanation: >-
      Establishes the model system, the two perturbation methods, and its
      phenotypic output.

experimental_models:
- name: SH-SY5Y neuroblastoma cell model of PSMB1 p.(Tyr103His)
  experimental_model_type: CELL_LINE
  publication: PMID:32129449
  description: >-
    Human SH-SY5Y neuroblastoma cells were used to assay the biochemical
    consequences of the p.(Tyr103His) substitution on beta6 processing, its
    incorporation into the proteasome, and proteasome activity. This is a
    heterologous cell line expressing the variant, not a patient-derived culture;
    no patient fibroblast or iPSC model of NEDMHAL has been reported.
  modeled_mechanisms:
  - target: Impaired beta6 Maturation and 20S Core Particle Assembly
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the direct biochemical readout of defective beta6 processing and
      incorporation attributable to the variant.
    limitations: >-
      A neuroblastoma cell line rather than patient-derived neural tissue, so
      results speak to the variant's molecular consequence rather than to the
      cellular state of the patients. The reported activity deficit is slight,
      leaving the quantitative link to the severe clinical phenotype unexplained.
    evidence:
    - reference: PMID:32129449
      reference_title: >-
        Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
        impairment of proteasome function, microcephaly, intellectual
        disability, developmental delay and short stature.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the p(Tyr103His) variant affects both the processing of PSMB1/β6 and its
        incorporation into proteasome, thus impairing proteasome activity
      explanation: >-
        States exactly what the cell model measured and what it showed for this
        mechanism node.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual disability,
      developmental delay and short stature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the p(Tyr103His) variant affects both the processing of PSMB1/β6 and its
      incorporation into proteasome, thus impairing proteasome activity
    explanation: >-
      Names the cell system used and establishes it as the source of the
      biochemical evidence for this variant's molecular consequence.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis is molecular and genotype-first: identification of biallelic PSMB1
    variants. In the founding kindred the variant was found by sequencing in a
    consanguineous family and shown to segregate with the phenotype. No consensus
    clinical diagnostic criteria exist, and the clinical presentation
    (microcephaly, hypotonia, developmental delay, absent language) is shared with
    many genetically distinct neurodevelopmental disorders.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consanguinity due to extensive homozygosity unravels many recessive
      phenotypes and facilitates the detection of novel gene-disease links.
    explanation: >-
      Describes the homozygosity-based sequencing approach by which the diagnosis
      was established in the index family.


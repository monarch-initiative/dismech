discussions:
- discussion_id: single_kindred_phenotype_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of NEDMHAL are intrinsic to PSMB1 deficiency, and which are
    particular to the single consanguineous kindred in which it was described?
  attaches_to:
  - pathophysiology#Impaired Brain Growth and Neurodevelopment
  rationale: >-
    The entity rests on two affected sisters from one family plus functional
    validation. Every phenotype frequency available is a 2/2 or 1/2 count from
    that kindred, so no feature can currently be separated from the family's
    shared genetic background and consanguinity-associated homozygosity
    elsewhere in the genome. This is why no `frequency:` qualifier is asserted on
    any phenotype in this entry. The absence of epilepsy, autistic features and
    visceral malformations is likewise a statement about two people.
  proposed_experiments:
  - experiment_id: exp_nedmhal_matchmaking_additional_families
    name: Identify additional families
    description: >-
      Identify additional families with biallelic PSMB1 variants through
      international matchmaking (GeneMatcher, DECIPHER, Matchmaker Exchange)
      and determine which features recur.
  - experiment_id: exp_nedmhal_allelic_series_genotype_phenotype
    name: Determine whether other PSMB1 alleles
    description: >-
      Determine whether other PSMB1 alleles, particularly compound
      heterozygous or truncating combinations, produce the same phenotype or
      a distinct severity.
  evidence:
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, visceral malformations have not been reported in forms with PSMB1
      or PSMC3 biallelic variants nor with PSMC1 deletions
    explanation: >-
      The review states the negative finding and, in the same passage, cautions
      that it should be interpreted with care given how few cases are reported.

- discussion_id: zebrafish_cannot_model_language_or_behaviour
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the zebrafish psmb1 model capture the disorder, when the two features
    that name it besides microcephaly — absent language and behavioural
    abnormality — have no zebrafish correlate?
  attaches_to:
  - pathophysiology#Impaired Brain Growth and Neurodevelopment
  rationale: >-
    The zebrafish model recapitulates reduced brain size convincingly, by two
    independent perturbations. But it is a complete loss-of-function model of a
    disease caused by a partial-loss-of-function missense allele, and it cannot
    report language, intellectual disability, or behaviour. Treating the model as
    validating the whole phenotype would overstate it; it validates the
    brain-growth arm only.
  proposed_experiments:
  - experiment_id: exp_nedmhal_knockin_tyr103his_zebrafish
    name: Generate a knock-in model carrying the orthologous Tyr103His
    description: >-
      Generate a knock-in model carrying the orthologous Tyr103His
      substitution and compare its brain phenotype and proteasome assembly
      with the null.
  - experiment_id: exp_nedmhal_ipsc_neural_progenitor_organoid
    name: Use human iPSC-derived neural progenitors and cortical organoids
    description: >-
      Use human iPSC-derived neural progenitors and cortical organoids from
      genotype-matched cells to test whether proliferation and neurogenesis
      are impaired at the reported partial reduction in proteasome activity.
  evidence:
  - reference: PMID:32129449
    reference_title: >-
      Biallelic variants in PSMB1 encoding the proteasome subunit β6 cause
      impairment of proteasome function, microcephaly, intellectual
      disability, developmental delay and short stature.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CRISPR/Cas9 mutagenesis or morpholino knock-down of the single psmb1
      zebrafish orthologue resulted in microcephaly, microphthalmia and reduced
      brain size.
    explanation: >-
      The reported model readouts are morphological brain measures only; nothing
      in the model addresses the language or behavioural components of the human
      phenotype.

- discussion_id: interferon_signature_untested_in_psmb1
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do PSMB1-deficient cells show the protein aggregation, stress-response
    activation and type I interferon dysregulation reported across other
    proteasomopathies?
  attaches_to:
  - pathophysiology#Impaired Ubiquitin-Dependent Protein Homeostasis
  rationale: >-
    Proteasomopathies as a class — both the autoinflammatory and the
    neurodevelopmental arm — converge on protein aggregation, activated stress
    responses and dysregulated type I interferon signalling, and interferon
    signatures are being explored as biomarkers for the class. None of this has
    been measured in PSMB1-mutant cells, so the downstream half of the mechanism
    chain in this entry is asserted at class level and inherited by analogy
    rather than demonstrated. The gap is sharper than mere absence of data:
    PSMB1 is explicitly named in the literature as the one 20S core-particle
    subunit whose pathogenic variants have not been shown to provoke immune
    dysregulation, while every other 20S lesion has. So the class-level
    interferon expectation may specifically fail to apply here, and importing it
    into this entry's mechanism would be the wrong inference rather than merely
    an unverified one. This matters practically: a proteasome-activity or
    interferon-signature assay would otherwise be the natural functional test
    for candidate PSMB1 variants of uncertain significance.
  proposed_experiments:
  - experiment_id: exp_nedmhal_ubiquitin_load_and_ifn_signature
    name: Measure polyubiquitinated protein load
    description: >-
      Measure polyubiquitinated protein load, proteotoxic stress-response
      activation and a type I interferon signature in cells carrying PSMB1
      p.(Tyr103His).
  - experiment_id: exp_nedmhal_20s_versus_19s_ifn_comparison
    name: Compare the magnitude of any interferon response
    description: >-
      Compare the magnitude of any interferon response with that of the 19S
      regulatory-particle proteasomopathies to test whether the
      20S core-particle lesion behaves differently.
  evidence:
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      both syndromes show molecular similarities with protein aggregation,
      activated stress responses, metabolic imbalance and dysregulated type I
      interferon signalling
    explanation: >-
      Establishes the class-level expectation whose absence of PSMB1-specific
      confirmation is the gap.
  - reference: PMID:37256937
    reference_title: >-
      PSMC3 proteasome subunit variants are associated with neurodevelopmental
      delay and type I interferon production.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      So far, with the exception of the PSMB1 (β6) subunit (25), all pathogenic
      variants related to the 20S core particle have been shown to provoke
      immune dysregulation.
    explanation: >-
      Singles out PSMB1 as the one 20S core-particle subunit not shown to cause
      immune dysregulation, so the interferon arm of the proteasomopathy
      mechanism cannot simply be inherited by this entry.
  - reference: PMID:38866022
    reference_title: >-
      PSMD11 loss-of-function variants correlate with a neurobehavioral
      phenotype, obesity, and increased interferon response.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PSMD11 loss of function resulted in impaired 26S proteasome assembly and
      the acquisition of a persistent type I interferon (IFN) gene signature,
      mediated by the integrated stress response (ISR) protein kinase R (PKR)
    explanation: >-
      Shows what the interferon arm looks like when it is actually demonstrated
      in a proteasomopathy: impaired 26S assembly, a persistent type I IFN
      signature, and a named PKR/ISR mediator. Nothing equivalent has been
      measured for PSMB1, which is precisely the gap.

- discussion_id: core_particle_versus_regulatory_particle
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are neurodevelopmental proteasomopathies essentially diseases of the 19S
    regulatory particle, and if so why does a 20S core-particle lesion produce
    the same phenotypic class?
  attaches_to:
  - pathophysiology#Destabilised beta6-alpha5 Interface of the 20S Core Particle
  rationale: >-
    PSMB1 p.(Tyr103His) is the lone 20S core-particle lesion among the variants
    identified in neurodevelopmental proteasomopathies, and it is also one of the
    few recessive ones — the rest are dominant, de novo, and in the 19S
    regulatory particle. Two reviews read the same fact in opposite directions:
    one treats the overwhelming 19S predominance as evidence that these are
    fundamentally 19S disorders, while the other treats PSMB1 as the case that
    breaks the subcomplex-determines-phenotype rule. The resolution matters for
    how the entity is grouped and for which proteasome genes should be searched
    in undiagnosed neurodevelopmental disorders.
  proposed_experiments:
  - experiment_id: exp_nedmhal_20s_subunit_cohort_screen
    name: Systematically screen 20S core-particle subunit genes in large
    description: >-
      Systematically screen 20S core-particle subunit genes in large
      neurodevelopmental disorder cohorts to establish whether 20S lesions
      are genuinely rare or merely under-ascertained.
  - experiment_id: exp_nedmhal_matched_20s_19s_assembly_activity
    name: Compare proteasome assembly
    description: >-
      Compare proteasome assembly, activity and interferon output side by
      side between matched 20S and 19S proteasomopathy variants in a common
      cell background.
  evidence:
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only one (i.e., p.Tyr103His in PSMB1/β6) of the forty-three lesions
      identified in individuals with neurodevelopmental proteasomopathies affect
      the 20S CP strongly suggests that these disorders are essentially diseases
      of the 19S RP
    explanation: >-
      States the 19S-predominance reading, and itself flags the conclusion as
      remaining to be confirmed.
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      a homozygous PSMB1 variant break the rules of this rationale and suggest
      that the phenotypic manifestation may occur independent of the subunit
      localisation in certain subcomplexes
    explanation: >-
      The opposing reading: PSMB1 is taken as evidence against the phenotype
      being determined by which subcomplex the lesion sits in.

differential_diagnoses:
- name: Other neurodevelopmental proteasomopathies
  description: >-
    PSMD12-related Stankiewicz-Isidor syndrome, and the PSMC1-, PSMC3- and
    PSMD11-related neurodevelopmental disorders, share developmental delay,
    speech delay and intellectual disability. Most are dominant, de novo, and
    caused by 19S regulatory-particle lesions, and several have distinguishing
    features absent in NEDMHAL — cataract and deafness in the PSMC3 neurosensory
    form, thumb and visceral anomalies in Stankiewicz-Isidor syndrome. Molecular
    testing is required to separate them.
  evidence:
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a total of six neurodevelopmental proteasomopathies have been described,
      involving the four subunits PSMB1/β6, PSMC1/Rpt2, PSMC3/Rpt5, and
      PSMD12/Rpn5
    explanation: >-
      Enumerates the sibling entities from which NEDMHAL must be distinguished.
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare
      disease entities: A review of current concepts, molecular
      biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      neurodevelopmental proteasomopathies are mostly monogenic dominant
      disorders arising from de novo mutations in proteasome genes
    explanation: >-
      The dominant, de novo inheritance of most sibling entities is a practical
      discriminator from recessive NEDMHAL.

notes: >-
  Curation caveats. (1) No `frequency:` qualifier is asserted on any phenotype.
  Every available proportion is a 2/2 or 1/2 count from a single sibship, which
  is not a population frequency; the counts are stated in the phenotype
  descriptions and evidenced instead. (2) The biochemical work behind the
  mechanism chain was done in human SH-SY5Y neuroblastoma cells expressing the
  variant, not in patient-derived fibroblasts — a deep-research draft asserted
  patient fibroblasts and was not followed. (3) The measured functional deficit
  is modest (a slight reduction in chymotrypsin-like activity), which sits
  uneasily with the severity of the clinical phenotype and is recorded as such
  rather than smoothed over. (4) No GeneReviews chapter exists for PSMB1 or
  NEDMHAL; a PubMed search for one returned nothing, so the GeneReviews phenotype
  baseline step was not applicable. (5) An `Inability to walk` phenotype
  (HP:0002540) was drafted from the OMIM/MedGen clinical synopsis and then
  removed: its only available evidence was the motor-delay table row already
  cited elsewhere, and motor delay does not support non-ambulation. The synopsis
  records it, but no citable publication states it, and OMIM is not a
  snippet-validatable reference source here. (6) The deep-research datum that
  the variant is absent from gnomAD and from 300 in-house control chromosomes is
  NOT curated: it appears only in the deep-research report, not in any cached
  abstract, so adding it would be exactly the treat-a-DR-lead-as-truth failure
  the evidence SOP warns about. (7) Named-entity-confusion watch: this entity
  must not be conflated with the similarly named MONDO:0100348
  (neurodevelopmental disorder with microcephaly, impaired language, and gait
  abnormalities) or MONDO:0971172 (RNU4-2-related, with hypotonia and absent
  language), nor with CDK19-related DEE87 (OMIM:618916), which surfaced during
  literature search on description similarity alone.

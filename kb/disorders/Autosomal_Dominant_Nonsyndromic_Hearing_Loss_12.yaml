- name: Cochlear implantation
  description: >-
    Consider specialist cochlear-implant evaluation for severe-to-profound loss with insufficient benefit
    from hearing aids, using individual audiologic and anatomic assessment. Electrical stimulation bypasses
    hair-cell transduction to activate auditory neurons. The cited 2013 TECTA implant case had biallelic
    DFNB21; it does not establish dominant DFNA8/12-specific outcomes or electric-acoustic stimulation
    efficacy.

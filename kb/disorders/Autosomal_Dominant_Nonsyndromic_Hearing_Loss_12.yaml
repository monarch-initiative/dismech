differential_diagnoses:
- name: DFNB21, recessive TECTA deafness
  description: >-
    Biallelic TECTA variants cause DFNB21. Loss-of-function alleles often underlie recessive disease,
    but missense alleles can also be recessive, and sequence consequence alone cannot assign inheritance.
    The 2011 report noted a truncating allele in two members of a dominant pedigree but could not exclude
    incidental carrier status or a missed second allele. Assess zygosity, phase, segregation and variant-specific
    evidence.
  evidence:
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the TECTA gene in the DFNB21-affected family revealed a
      G to A transition in the donor splice site (GT) of intron 9, predicted to
      lead to a truncated protein of 971 amino acids.
    explanation: >-
      Documents the truncating allele class that produces the recessive disease.
- name: Other autosomal dominant nonsyndromic hearing loss loci
  description: >-
    Many genetic hearing-loss disorders overlap with the DFNA8/12 audiogram. Mid-frequency loss can guide
    interpretation but is not specific; molecular testing and assessment for extra-auditory findings distinguish
    causes.
  evidence:
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore completed unbiased screening for TECTA mutations in a Spanish
      cohort of 372 probands from ADNSHL families.
    explanation: >-
      Indicates that TECTA is identified within a large pool of otherwise similar
      dominant nonsyndromic hearing loss families, which is why sequencing rather
      than phenotype makes the assignment.
discussions:
- discussion_id: mouse_does_not_progress
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do allele-matched Tecta mice not show the progression seen in the
    patients carrying the same substitution, and can any mouse be used to study
    progression in this disease?
  attaches_to:
  - animal_models#Tecta C1619S/+ mouse (ZA domain)
  - animal_models#Tecta C1509G/+ mouse
  - pathophysiology#Secondary Outer Hair Cell Vulnerability
  - animal_models#Tecta C1837G/+ mouse (ZP domain)
  rationale: >-
    C1619S and C1837G mice lacked progressive threshold deterioration over the studied intervals despite
    progression in corresponding human families. C1509G emission thresholds were stable in quiet through
    six months; after noise, recovery and cell-loss distribution differed from wild type without greater
    total loss in the sampled region. Lifespan, genetic background and cumulative exposure are candidate
    explanations, not established causes of the mismatch. The studied conditions lack a spontaneous progression
    endpoint.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The phenotypes are stable and no evidence has been found for a progressive
      deterioration in TM structure or auditory function.
    explanation: >-
      The direct statement of absent progression in the allele-matched mice.
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study reports linkage to DFNA12 in a new family with autosomal
      dominant high frequency hearing loss progressing from mild to moderate
      severity.
    explanation: >-
      Establishes that the human phenotype for a ZA-domain allele does progress,
      which is the half of the mismatch the mouse fails to reproduce.
- discussion_id: audiogenic_seizure_in_tecta_mice
  kind: OPEN_QUESTION
  prompt: >-
    Do Tecta mutations confer any central auditory phenotype in humans, given
    that all three allele-matched mouse models develop audiogenic seizures?
  attaches_to:
  - animal_models#Tecta L1820F,G1824D/+ mouse (ZP domain)
  - animal_models#Tecta C1619S/+ mouse (ZA domain)
  - animal_models#Tecta C1837G/+ mouse (ZP domain)
  rationale: >-
    C1619S, C1837G and L1820F/G1824D mice exhibited wild running predictive of seizures at low sound levels.
    The authors stopped stimulation early and could not complete the planned high-noise experiments. Central
    adaptation and other mechanisms remain hypotheses; a corresponding human phenotype was not established.
    This result cannot be assigned to the separate C1509G experiment.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite elevated auditory thresholds, the Tecta mutant mice all exhibit an
      enhanced tendency to have audiogenic seizures in response to white noise
      stimuli at low sound pressure levels (≤84 dB SPL), revealing a previously
      unrecognised consequence of Tecta mutations.
    explanation: >-
      Reports the unexpected central phenotype in all three models.
- discussion_id: domain_audiogram_correlation_limits
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the audiogram configuration does the mutated alpha-tectorin
    domain actually predict?
  attaches_to:
  - pathophysiology#Defective Tectorial Membrane Matrix Assembly
  - phenotypes#Mid-Frequency Hearing Loss
  rationale: >-
    Domain-associated structural differences in tested mice and human audiogram associations are useful
    but incomplete. Mid-frequency loss occurs outside the ZP domain, and cysteine/progression associations
    have exceptions. Both allelic effects and ascertainment matter; modifiers remain incompletely resolved.
    Domain location should inform interpretation without being presented as a deterministic prognosis.
notes: >-
  DFNA8 and DFNA12 denote the same TECTA-related dominant disease. Protein-domain patterns are clinical
  associations, not separate disease subtypes. Null-model findings and generic hearing-loss guidance are
  explicitly indirect. Congenital onset differs from prelingual onset, and neither is universal.

  The matching research narrative and bibliography were reviewed. PMID:37927186 is a TECTA family study
  and is now used for segregation and hearing-aid use. PMID:33559882 adds a distinct calcium/adaptation
  hypothesis rather than duplicating mechanical uncoupling. PMID:25564867 concerns striated-sheet mechanical
  properties; PMID:21368133 concerns CEACAM16 interaction in DFNA4 and remains contextual rather than
  a new DFNA8/12 causal branch. General hearing-loss papers are used only for appropriate context. The
  report's unresolved HP:0008565 and obsolete HP:0410007 bindings are not imported.

  The tagged GeneReviews overview was mined for clinical presentation, testing, care, surveillance, noise
  protection and counseling. Its TECTA table lists prelingual onset, while primary reports document exceptions;
  pooled hearing-loss frequencies and non-TECTA surveillance intervals are not assigned to this disease.
  No clinical efficacy trial specific to DFNA8/12 was identified in the matching report.

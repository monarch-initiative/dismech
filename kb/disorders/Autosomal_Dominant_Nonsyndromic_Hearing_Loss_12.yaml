inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous missense and in-frame variants, transmitted dominantly through
    multiple generations. The dominance is mechanistic rather than dosage-based:
    TECTA null alleles are recessive, and their heterozygous carriers hear
    normally, so the dominant alleles must be doing something the absence of one
    copy does not.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9590290
    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both families, mutation analysis revealed missense mutations which
      replace conserved amino-acid residues within the zona pellucida domain of
      TECTA.
    explanation: >-
      Establishes heterozygous missense variants as the cause in the two founding
      dominant families.
mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_tectorin_incorporation
  hypothesis_label: >-
    Dominant TECTA alleles act by incorporating mutant alpha-tectorin into the
    tectorial membrane, not by reducing its amount
  status: CANONICAL
  description: >-
    Alpha-tectorin forms homomeric and heteromeric structures within the
    tectorial membrane, so a mutant monomer that is still secreted can poison the
    assembly of a matrix built largely from wild-type protein. The decisive
    genetic argument is the contrast with DFNB21: a TECTA splice allele producing
    a truncated protein is recessive, and its heterozygous carriers are unaffected,
    which rules out simple haploinsufficiency as the mechanism of the dominant
    alleles.
  evidence:
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparison of the phenotype of the DFNB21 heterozygous carriers with that
      of DFNA8/12-affected individuals supports the hypothesis that the TECTA
      mutations which cause the dominant form of deafness have a dominant-negative
      effect.
    explanation: >-
      States the carrier-versus-patient comparison that grounds the
      dominant-negative model.
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present results provide genetic evidence for alpha-tectorin forming
      homo- or heteromeric structures.
    explanation: >-
      Supplies the multimerisation requirement that makes a dominant-negative
      effect physically possible.
pathophysiology:
- name: Heterozygous TECTA Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A conserved residue is replaced in one of the modular domains of
    alpha-tectorin — entactin/NIDO, the von Willebrand factor type D / zonadhesin
    repeats, or the C-terminal zona pellucida domain. A recurring subclass
    substitutes or introduces a cysteine, which matters because the matrix is held
    together partly by disulfide crosslinks. Unbiased screening of a Spanish and
    an American cohort found variants in every domain of the protein, including
    the entactin domain and the vWFD1-3 repeats.
  genes:
  - preferred_term: TECTA
    term:
      id: hgnc:11720
      label: TECTA
  genetic_context:
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: TECTA
      term:
        id: hgnc:11720
        label: TECTA
    notes: >-
      Dominant negative rather than loss of function, on the strength of the
      DFNB21 comparison: heterozygous carriers of a TECTA truncating allele hear
      normally, so losing one copy is not sufficient to cause disease.
  evidence:

- name: Defective Tectorial Membrane Matrix Assembly
  biological_scale: TISSUE
  description: >-
    The tectorial membrane is built in the endolymph from type II collagen
    fibrils crosslinked by alpha- and beta-tectorin, adhering medially to the
    spiral limbus through a tectorin-rich matrix on the interdental cell
    membranes and contacting outer hair cell stereocilia at its lower surface.
    Mutant alpha-tectorin disturbs this assembly, and — the point that makes the
    genotype-phenotype correlation mechanistic rather than statistical — the ZP
    and ZA domains do so in structurally distinct ways, shown directly in mice
    carrying the human alleles.
  biological_processes:
  - preferred_term: tectorial membrane matrix assembly
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: tectorial membrane
    term:
      id: UBERON:0002233
      label: tectorial membrane of cochlea
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mutations in the ZP and ZA domains generate distinctly different changes in
      the structure of the TM.
    explanation: >-
      Establishes that the domain a variant sits in determines the kind of
      structural damage, which is the mechanistic basis of the audiogram
      correlation.
  - reference: PMID:26806019
    reference_title: "Tectorins crosslink type II collagen fibrils and connect the tectorial membrane to the spiral limbus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      We observed that the TM adheres to the spiral limbus through a dense thin
      matrix enriched in α- and β-tectorin, both likely bound to the membranes of
      interdental cells.
    explanation: >-
      Establishes the normal structural role of alpha-tectorin in anchoring the
      membrane, which is what a dominant-negative allele degrades.
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results further support the involvement of TECTA mutations in
      autosomal dominant hearing impairment, and suggest that vicinal cysteines
      are involved in tectorial membrane matrix assembly.
    explanation: >-
      Links the cysteine-disrupting allele class specifically to matrix assembly.
  downstream:
  - target: Impaired Mechanical Coupling to Outer Hair Cell Stereocilia
    description: >-
      A structurally abnormal or shortened membrane no longer loads the outer hair
      cell bundles correctly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21567249

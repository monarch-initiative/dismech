      is not associated with visible abnormalities of the external ear or related medical findings; however,
      it can be associated with abnormalities of the middle ear and/or inner ear.
    explanation: >-
      General clinical definition of nonsyndromic hearing loss, not a TECTA-specific onset or frequency
      claim.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
- category: Auditory
  name: Congenital Sensorineural Hearing Impairment
  description: >-
    Congenital onset is documented in the founding Austrian family. Prelingual onset also occurs, but
    is not synonymous with presence at birth; childhood or later recognition and passage of newborn screening
    are documented in other families.

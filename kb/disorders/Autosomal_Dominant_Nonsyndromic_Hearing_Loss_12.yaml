diagnosis:
- name: Pure tone audiometry with otoacoustic emissions
  description: >-
    Age-appropriate audiometry, speech testing and objective measures characterize severity, configuration
    and auditory function. Absent emissions with good word recognition can occur in TECTA disease but
    are neither universal nor sufficient for a molecular diagnosis. Other causes and syndromic features
    remain part of assessment.
  evidence:
  - reference: PMID:24636747
    reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure tone audiometry, brainstem evoked response audiometry, the Freiburger
      test for speech understanding and transient evoked and distortion product
      otoacoustic emissions were assessed in three available affected members
      bearing p.Y1870C.
    explanation: >-
      Lists the test battery used to characterise affected family members.
- name: Molecular testing and variant interpretation
  description: >-
    A hearing-loss multigene panel or exome/genome analysis can identify a heterozygous pathogenic or
    likely pathogenic TECTA variant. Targeted testing is appropriate for a known familial variant. A VUS
    or domain location alone cannot confirm or exclude DFNA8/12; segregation and allele-specific functional
    information can refine interpretation.
  evidence:
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an additional cohort of 835 American ADNSHL families, we preselected 73
      probands for TECTA screening based on audiometric data.
    explanation: >-
      Documents audiogram-guided selection for TECTA testing.
  - reference: PMID:38224868
    reference_title: "Genetic diagnosis of childhood sensorineural hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: >-
      There is increasing awareness of the importance of an etiologic diagnosis,
      and genetic testing with next-generation sequencing (NGS) has the highest
      diagnostic yield.
    explanation: >-
      The general childhood hearing-loss review supports molecular testing; it does not itself specify
      a TECTA-only diagnostic strategy.
    quote_role: BACKGROUND
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The identification of variant(s) of uncertain significance cannot be used to confirm or rule out
      the diagnosis.
    explanation: >-
      General genetic-hearing-loss variant-interpretation guidance.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Single-gene testing (sequence analysis of a given gene, followed by gene-targeted deletion/duplication
      analysis) is rarely useful and typically NOT recommended.
    explanation: >-
      General testing strategy; familial variant testing remains a distinct use case.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:37927186
    reference_title: "Clinical relevance of the TECTA c.6183G>T variant identified in a family with autosomal dominant hearing loss: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This variant was not detected in the remaining five family members who did not have HL
    explanation: >-
      The family study used segregation with the phenotype to argue for reclassification of c.6183G>T;
      it did not provide a mutant-protein functional assay.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Evaluation of at-risk relatives
  description: >-
    Offer hearing assessment and, when available, targeted familial-variant testing to relatives. A passed
    newborn screen does not exclude mild or later-onset hearing loss.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Permanent childhood hearing loss in a parent or sib increases the probability of hearing loss in
      other family members and warrants early complete diagnostic evaluation of hearing regardless of
      the family member's newborn hearing screening result.
    explanation: >-
      General GeneReviews guidance for families with childhood genetic hearing loss.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
  - reference: PMID:40583560
    reference_title: A novel splicing variant in TECTA associated with prelingual autosomal dominant nonsyndromic hearing loss via dominant-negative effect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual V-3 passed newborn hearing screening; however, at the age of 6 years, she was diagnosed
      with HL and had used hearing aids since diagnosis.
    explanation: >-
      A screened child subsequently had documented hearing loss; a passed newborn screen does not exclude
      familial TECTA hearing loss.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
treatments:
- name: Hearing amplification and auditory rehabilitation
  description: >-
    Individualized hearing aids and auditory habilitation can support communication. Benefit and communication
    goals are assessed per person; the small p.Y1870C series does not establish unusually high efficacy
    for all TECTA variants. Spoken language, sign language and combined approaches should reflect individual
    and family preferences.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Cochlear Amplifier Failure
    description: >-
      Amplification substitutes externally for the gain the tectorial membrane
      can no longer deliver, without repairing the matrix.

- name: Secondary Outer Hair Cell Vulnerability
  biological_scale: CELLULAR
  description: >-
    In Tecta C1509G/+ mice, noise caused incompletely recovering emission thresholds and a redistribution
    of outer hair-cell loss toward the first row and more apical regions of the basal turn. Total loss
    in the sampled region did not significantly exceed wild type. Separately, electrical stimulation of
    excised cochleae produced greater reticular-lamina motion and membrane compromise. These experiments
    suggest exposure-dependent vulnerability; they do not demonstrate the cause of progression in human
    DFNA8/12 or every TECTA allele.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, noise exposure produced acute threshold shifts that fully recovered
      in Tecta (+/+) mice but only partially recovered in Tecta(C1509G/+) mice.
    explanation: >-
      Demonstrates increased vulnerability to acoustic injury in the mutant.
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The increased movements were associated with a fourfold increase in OHC
      death as measured by vital dye staining.
    explanation: >-
      This abstract statement refers to electrically stimulated excised cochleae with the membrane removed,
      assessed by propidium-iodide uptake. It is not fourfold cell death after in-vivo noise exposure.
    directness: INDIRECT

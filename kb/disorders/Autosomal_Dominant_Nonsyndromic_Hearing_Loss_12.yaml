      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Tecta(C1509/+) transgenic mouse with the same point mutation has
        partial hearing loss secondary to a shortened TM that only contacts the
        first row of OHCs.
      explanation: >-
        Shows the structural defect translating directly into altered contact
        with the outer hair cells.
- name: Impaired Mechanical Coupling to Outer Hair Cell Stereocilia
  biological_scale: TISSUE
  description: >-
    The membrane's job is to deliver shear to the outer hair cell bundles and to
    provide an inertial mass for them to push against. When it is shortened it
    contacts only the first row of outer hair cells, leaving the rest uncoupled
    and — by computational estimate — raising shear force on the row that remains
    attached by about half. That is a mechanical explanation for why a partial
    structural defect both reduces hearing and endangers the surviving coupled
    cells.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: detection of mechanical stimulus involved in sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
  evidence:
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      These analyses predicted that the shear force on the stereocilia is ~50%
      higher in the heterozygous condition.
    explanation: >-
      Quantifies the mechanical consequence of partial uncoupling, from a
      simulation of the mutant and wild-type cochlea.
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these findings indicate that uncoupling the TM from some OHCs
      leads to partial hearing loss and places the remaining coupled OHCs at
      higher risk.
    explanation: >-
      States the two consequences of uncoupling: immediate threshold elevation
      and secondary risk to the still-coupled cells.
  downstream:
  - target: Cochlear Amplifier Failure
    description: >-
      Without correct coupling the outer hair cell feedback loop loses gain and
      timing.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11087000
      reference_title: "A targeted deletion in alpha-tectorin reveals that the tectorial membrane is required for the gain and timing of cochlear feedback."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, the tectorial membrane ensures that outer hair cells can effectively
        respond to basilar membrane motion and that feedback is delivered with the
        appropriate gain and timing required for amplification.
      explanation: >-
        States the membrane's role in amplifier gain and timing, whose loss is
        this node.
- name: Cochlear Amplifier Failure
  biological_scale: TISSUE
  description: >-
    Active amplification by the outer hair cells is lost or degraded in the
    affected frequency band. In the alpha-tectorin null mouse, where the membrane
    is detached and stripped of non-collagenous matrix, the basilar membrane is
    still tuned but 35 dB less sensitive, and the second resonance that reveals
    the membrane acting as an inertial mass disappears. The organ of Corti is
    otherwise architecturally normal, which is what makes this an amplification
    failure rather than a sensory-cell disease.
  biological_processes:
  - preferred_term: sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  evidence:
  - reference: PMID:11087000
    reference_title: "A targeted deletion in alpha-tectorin reveals that the tectorial membrane is required for the gain and timing of cochlear feedback."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The basilar membranes of wild-type and alpha-tectorin mutant mice are tuned,
      but the alpha-tectorin mutants are 35 dB less sensitive.
    explanation: >-
      Quantifies the loss of amplification with tuning preserved.
  - reference: PMID:11087000
    reference_title: "A targeted deletion in alpha-tectorin reveals that the tectorial membrane is required for the gain and timing of cochlear feedback."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice homozygous for a targeted deletion in a-tectorin have tectorial
      membranes that are detached from the cochlear epithelium and lack all
      noncollagenous matrix, but the architecture of the organ of Corti is
      otherwise normal.
    explanation: >-
      Establishes that the sensory epithelium is structurally intact, which is
      why the entry treats this as a mechanical rather than a degenerative
      disease.
  - reference: PMID:24636747
    reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the missense p.Y1870C TECTA mutation leads to complete failure of
      the cochlear amplifier in humans, very high speech perception scores can be
      achieved with appropriate therapy.
    explanation: >-
      Confirms complete amplifier failure in human patients while showing the
      neural pathway remains usable.
  downstream:
  - target: Bilateral Sensorineural Hearing Loss
    description: >-
      Loss of amplification raises auditory thresholds in the affected band.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24636747
      reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pure tone audiometry showed U-shaped curves with moderate to severe
        degrees of hearing impairment confirmed by brainstem evoked response
        audiometry.
      explanation: >-
        Documents the resulting threshold elevation and its audiometric shape.
- name: Bilateral Sensorineural Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Bilateral, usually symmetric sensorineural loss, most often prelingual and
    frequently U-shaped on the audiogram with the maximum around 2 kHz. Whether
    it stays put or worsens, and which frequencies it takes, is partly predicted
    by the mutated domain. Vestibular function is spared and there are no
    extra-auditory features — this is a nonsyndromic deafness.
  evidence:
  - reference: PMID:9763681
    reference_title: "Autosomal-dominant, prelingual, nonprogressive sensorineural hearing loss: localization of the gene (DFNA8) to chromosome 11q by linkage in an Austrian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing loss was moderate to severe, a pure tone audiogram showing a
      U-shaped form with maximum loss at 2, 000 Hz.
    explanation: >-
      Documents the audiometric configuration in the founding DFNA8 family.
- name: Secondary Outer Hair Cell Vulnerability
  biological_scale: CELLULAR
  description: >-
    A slower, secondary process rather than the primary lesion. Because
    uncoupling concentrates shear on the outer hair cells that remain attached,
    and because prestin expression rises in the mutant, those cells are more
    easily damaged — mutant mice recover incompletely from a noise exposure that
    wild-type mice recover from fully, and lose outer hair cells preferentially
    from the first row. This is the best available mechanistic account of why
    some genotypes progress, though it has not been demonstrated in human
    temporal bones.
  cell_types:
  - preferred_term: cochlear outer hair cell
    modifier: DECREASED
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, noise exposure produced acute threshold shifts that fully recovered
      in Tecta (+/+) mice but only partially recovered in Tecta(C1509G/+) mice.
    explanation: >-
      Demonstrates increased vulnerability to acoustic injury in the mutant.
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The increased movements were associated with a fourfold increase in OHC
      death as measured by vital dye staining.
    explanation: >-
      Quantifies the excess outer hair cell death associated with the altered
      mechanics.

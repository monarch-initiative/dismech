genetic:
- name: TECTA
  notes: >-
    TECTA encodes the modular extracellular glycoprotein alpha-tectorin. Dominant and recessive disease
    must be distinguished using variant interpretation, zygosity, segregation and clinical findings; sequence
    consequence alone is insufficient. The 2011 study increased the then-known dominant alleles from 13
    to 33, a historical count rather than a current total. Most variants in that series were private.
    Founder evidence differed between recurrent alleles and populations. Penetrance is not quantified
    here. Unchanged total RNA for c.5999G>A does not demonstrate normal protein abundance or secretion.
  gene_term:
    preferred_term: TECTA
    term:
      id: hgnc:11720
      label: TECTA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:9590290
    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that mutations in TECTA are responsible for hearing
      impairment in these families, and implicate a new type of protein in the
      pathogenesis of hearing impairment.
    explanation: >-
      The founding gene-disease assignment.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, our results indicate that DFNA8/12 hearing loss is a frequent
      type of ADNSHL.
    explanation: >-
      The selected Spanish and American cohorts establish an important contribution to ADNSHL, not a general-population
      prevalence or current global ranking.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the majority are private mutations, four of them-p.Cys1036Tyr,
      p.Cys1837Gly, p.Thr1866Met, and p.Arg1890Cys-were observed in more than one
      unrelated family. For two of these mutations founder effects were also
      confirmed.
    explanation: >-
      Recurrence and founder analyses in the 2011 series; the full text supports a common founder for
      Cys1837Gly and shared haplotypes in some Arg1890Cys families. Recurrence does not establish progression.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In aggregate, we identified 23 TECTA mutations in this process. Remarkably,
      20 of these mutations are novel, more than doubling the number of reported
      TECTA ADNSHL mutations from 13 to 33.
    explanation: >-
      The number 33 is the cumulative count reported in 2011, not the current allelic spectrum.
environmental:
- name: Excessive noise exposure
  description: >-
    Noise is a potential modifier of inherited hearing loss. C1509G mouse experiments support altered
    recovery and spatial injury patterns, but do not quantify human TECTA-specific susceptibility or establish
    noise as the cause of human progression. General hearing-loss guidance supports avoiding repeated
    loud-noise overexposure.
  exposure_term:
    preferred_term: excessive noise exposure
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  evidence:
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, noise exposure produced acute threshold shifts that fully recovered
      in Tecta (+/+) mice but only partially recovered in Tecta(C1509G/+) mice.
    explanation: >-
      Shows the mutant cochlea fails to recover from an acoustic insult that the
      wild-type recovers from fully, which is what makes noise a
      disease-relevant exposure here.
  influences_mechanisms:
  - target: Secondary Outer Hair Cell Vulnerability
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      In the C1509G model, noise exposure changes emission-threshold recovery and the distribution of
      hair-cell injury. This exposure effect is model-specific.
    evidence:
    - reference: PMID:21567249
      reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, noise exposure produced acute threshold shifts that fully recovered
        in Tecta (+/+) mice but only partially recovered in Tecta(C1509G/+) mice.
      explanation: >-
        Shows the mutant cochlea fails to recover from an acoustic insult that the
        wild-type recovers from fully, which is what makes noise a
        disease-relevant exposure here.

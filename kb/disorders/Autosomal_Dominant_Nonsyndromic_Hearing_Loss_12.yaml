- name: Tecta C1509G/+ mouse
  species: Mouse
  genotype: Tecta(C1509G/+) transgenic
  publication: PMID:21567249
  description: >-
    The model that supplies the biophysical account of secondary outer hair cell
    loss, through a shortened tectorial membrane that contacts only the first
    outer hair cell row.
  modeled_mechanisms:
  - target: Secondary Outer Hair Cell Vulnerability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows partial uncoupling and altered in-vivo noise recovery and injury distribution; mechanical
      simulations and separate ex-vivo electrical experiments support possible contributors.
    limitations: >-
      Thresholds were stable in quiet through six months. Total hair-cell loss after noise was not significantly

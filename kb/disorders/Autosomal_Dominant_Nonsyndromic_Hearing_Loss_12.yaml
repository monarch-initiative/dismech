name: Autosomal Dominant Nonsyndromic Hearing Loss 12
creation_date: "2026-08-31T16:45:00Z"
category: Mendelian
synonyms:
- DFNA12
- DFNA8/12
- deafness, autosomal dominant 12
- TECTA-related autosomal dominant hearing loss
- alpha-tectorin deafness
description: >-
  Autosomal dominant nonsyndromic hearing loss 12 (DFNA8/12) is caused by heterozygous pathogenic TECTA
  variants affecting alpha-tectorin, a major non-collagenous component of the cochlear tectorial membrane.
  DFNA8 and DFNA12 were mapped independently in Austrian and Belgian families before both were linked
  to TECTA.

  The primary lesion affects an extracellular matrix required for efficient hair-cell stimulation and
  cochlear amplification. A dominant-negative mechanism is supported by human segregation and allele-matched
  mouse studies, but normal secretion and incorporation of every mutant protein have not been demonstrated.
  Mouse models also reveal secondary hair-cell vulnerability under experimental exposure; the disease
  cannot be characterized as universally free of cellular injury.

  Hearing loss can be congenital, prelingual or later-onset, stable or progressive, with mid-frequency,
  high-frequency or flatter configurations. Protein domain and residue help interpret a variant but do
  not determine an individual audiogram or course. Some alleles associated with human progression produce
  stable mouse thresholds over the studied intervals. Preserved speech recognition in selected patients
  supports hearing rehabilitation but does not establish universal preservation of the auditory nerve
  or dominant TECTA-specific implant efficacy.

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous pathogenic TECTA variants can be transmitted through multiple generations. Each child
    of a heterozygous parent has a 50% chance of inheriting the variant; onset, severity and progression
    cannot be predicted precisely from transmission alone. Many dominant alleles are missense or splice-altering
    variants; allele-specific interpretation distinguishes DFNA8/12 from recessive DFNB21.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:9590290
    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both families, mutation analysis revealed missense mutations which
      replace conserved amino-acid residues within the zona pellucida domain of
      TECTA.
    explanation: >-
      Establishes heterozygous missense variants as the cause in the two founding
      dominant families.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with autosomal dominant hearing loss have a 50% chance of transmitting the pathogenic
      variant to each child.
    explanation: >-
      GeneReviews provides the general autosomal dominant transmission probability, not an allele-specific
      penetrance estimate.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
mechanistic_hypotheses:
- hypothesis_group_id: dominant_negative_tectorin_incorporation
  hypothesis_label: >-
    Dominant-negative disruption of tectorial membrane organization
  status: CANONICAL
  description: >-
    The contrast between unaffected heterozygous carriers of a recessive TECTA allele and dominant missense
    families supports a dominant-negative model. Allele-matched mice show matrix defects distinct from
    simple heterozygous null states. These findings do not prove normal secretion, abundance or physical
    incorporation for every dominant mutant protein. For c.5999G>A, patient RNA shows abnormal in-frame
    splicing without reduced total transcript abundance; the protein-level mechanism remains inferred.
  evidence:
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparison of the phenotype of the DFNB21 heterozygous carriers with that
      of DFNA8/12-affected individuals supports the hypothesis that the TECTA
      mutations which cause the dominant form of deafness have a dominant-negative
      effect.
    explanation: >-
      States the carrier-versus-patient comparison that grounds the
      dominant-negative model.
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present results provide genetic evidence for alpha-tectorin forming
      homo- or heteromeric structures.
    explanation: >-
      The authors infer homo- or heteromeric assembly from genetic observations; this is not a direct
      protein interaction assay.
    directness: INDIRECT
  - reference: PMID:40583560
    reference_title: "A novel splicing variant in TECTA associated with prelingual autosomal dominant nonsyndromic hearing loss via dominant-negative effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Quantitative real-time polymerase chain reaction revealed no significant
      reduction in mRNA levels in lymphoblasts derived from individuals
      harboring the TECTA c.5999G > A (p.Gly2000Glu) variant
    explanation: >-
      Total RNA abundance was not reduced, but the study lacked direct protein-expression and matrix-incorporation
      measurements. This supports the authors' proposed mechanism indirectly and does not exclude a protein-level
      dosage effect.
    directness: INDIRECT
- hypothesis_group_id: tectorial_membrane_calcium_adaptation
  hypothesis_label: Tectorial membrane regulation of calcium near hair-cell transduction channels
  status: EMERGING
  description: >-
    Tecta/Tectb double-knockout mice retain mature hair-cell properties but lose long-lasting emission
    adaptation. The authors propose that the membrane regulates calcium near transduction channels. This
    extends membrane function beyond mechanical coupling; calcium regulation and its relevance to dominant
    human TECTA alleles remain unproven.
  evidence:
  - reference: PMID:33559882
    reference_title: MET currents and otoacoustic emissions from mice with a detached tectorial membrane indicate the extracellular matrix regulates Ca(2+) near stereocilia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      repetitive acoustic stimulation fails to produce adaptation of MET-dependent otoacoustic emissions
      in vivo in the Tecta/Tectb-/- mice.
    explanation: >-
      A double-knockout mouse result supports the adaptation hypothesis indirectly for dominant DFNA8/12;
      no local calcium concentration was directly measured in patients.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
pathophysiology:
- name: Heterozygous Pathogenic TECTA Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous pathogenic variants occur across the entactin/NIDO, zonadhesin-like and zona pellucida
    domains of TECTA. The 2011 study screened a Spanish cohort without audiogram preselection and an American
    subset selected by audiogram. Dominant alleles include missense changes and coding variants that alter
    splicing: c.5999G>A produces two in-frame exon-20 deletions. A sequence-level missense annotation
    alone therefore does not identify the molecular consequence.
  genes:
  - preferred_term: TECTA
    term:
      id: hgnc:11720
      label: TECTA
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    gene:
      preferred_term: TECTA
      term:
        id: hgnc:11720
        label: TECTA
    notes: >-
      Includes missense and splice-altering alleles. Dominant-negative action is the prevailing model;
      variant-specific protein consequences require functional evidence.
  evidence:
  - reference: PMID:9590290
    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both families, mutation analysis revealed missense mutations which
      replace conserved amino-acid residues within the zona pellucida domain of
      TECTA.
    explanation: >-
      The founding identification of TECTA missense variants in the DFNA8 and
      DFNA12 families.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations lie in all domains of the α-tectorin protein, including those for
      the first time identified in the entactin domain, as well as the vWFD1,
      vWFD2, and vWFD3 repeats, and the D1-D2 and TIL2 connectors.
    explanation: >-
      Establishes that the allelic spectrum spans the whole protein rather than
      being confined to the ZP and ZA domains.
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation abolishes the first of the vicinal cysteines
      (1619Cys-Gly-Leu- 1622Cys) present in the D4 von Willebrand factor (vWf)
      type D repeat.
    explanation: >-
      Describes the cysteine-disrupting allele class and locates it in the
      zonadhesin-like domain.
  - reference: PMID:40583560
    reference_title: "A novel splicing variant in TECTA associated with prelingual autosomal dominant nonsyndromic hearing loss via dominant-negative effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrated that the variant altered RNA splicing, specifically
      causing aberrant splicing of exon 20 and resulting in two in-frame
      deletions.
    explanation: >-
      Documents the splice-altering coding-variant class, which produces in-frame
      deletions rather than a residue substitution.
  - reference: PMID:40583560
    reference_title: "A novel splicing variant in TECTA associated with prelingual autosomal dominant nonsyndromic hearing loss via dominant-negative effect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      expands the mutational landscape of DFNA8/12 to include coding variants
      that alter RNA splicing, and underscores the importance of investigating
      splicing effects of coding variants
    explanation: >-
      States that the DFNA8/12 allelic spectrum includes coding variants acting
      through splicing, which is the practical warning for variant
      interpretation in this gene.
  downstream:

name: Autosomal Dominant Nonsyndromic Hearing Loss 12
creation_date: "2026-08-31T16:45:00Z"
category: Mendelian
synonyms:
- DFNA12
- DFNA8/12
- deafness, autosomal dominant 12
- TECTA-related autosomal dominant hearing loss
- alpha-tectorin deafness
description: >-
  Autosomal dominant nonsyndromic hearing loss 12 is caused by heterozygous
  TECTA variants affecting alpha-tectorin, the principal non-collagenous protein
  of the tectorial membrane. It is one disease under two locus names: DFNA8 and
  DFNA12 were mapped independently in an Austrian and a Belgian family before
  both were shown to be TECTA, and the literature writes it DFNA8/12 for that
  reason.

  The lesion is unusual among the deafnesses in being extracellular and purely
  mechanical. The tectorial membrane is an acellular gel of type II collagen
  crosslinked by alpha- and beta-tectorin, anchored medially to the spiral limbus
  and contacting the outer hair cell stereocilia distally. It is not a sensor; it
  is the load against which outer hair cells push. Mutant alpha-tectorin is
  secreted normally and incorporated into the assembling matrix, where it
  disrupts self-assembly dominant-negatively — an inference that rests on a clean
  natural comparison, since heterozygous carriers of recessive TECTA null alleles
  hear normally while heterozygotes for these missense alleles do not. Hair
  cells, the spiral ganglion and the auditory nerve are structurally preserved,
  which is why cochlear implantation works well and why speech discrimination can
  remain excellent even when the cochlear amplifier has failed completely.

  The most useful curated fact about this disease is its domain-to-audiogram
  correlation, and the most useful caveat is that the correlation is looser than
  it first appeared. Zona pellucida domain variants were associated with stable
  mid-frequency loss and zonadhesin domain variants with progressive
  high-frequency loss, and mouse models carrying the human alleles confirm that
  the two domains damage the tectorial membrane in structurally different ways.
  But unbiased screening of large cohorts found mid-frequency loss also arising
  from N-terminal entactin and vWFD variants, so domain position narrows the
  expected audiogram rather than determining it. A separate discrepancy is worth
  knowing before reaching for a mouse: the alleles that progress in patients do
  not progress in the mice that carry them.

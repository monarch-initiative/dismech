    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient evoked and distortion product otoacoustic emissions were
      completely absent in all affected family members whereas word recognition
      scores were up to 95%.
    explanation: >-
      Documents the dissociation between absent emissions and preserved speech
      discrimination.
genetic:
- name: TECTA
  notes: >-
    Encodes alpha-tectorin, a large modular secreted glycoprotein and one of the
    principal non-collagenous components of the tectorial membrane, with entactin,
    zonadhesin-like vWFD and zona pellucida domains. The gene carries two distinct
    disease mechanisms: dominant missense alleles cause DFNA8/12 by a
    dominant-negative effect on matrix assembly, while recessive truncating
    alleles cause DFNB21, a severe-to-profound prelingual deafness. DFNA8/12 is
    reported to be a frequent cause of autosomal dominant nonsyndromic hearing
    loss.
  gene_term:
    preferred_term: TECTA
    term:
      id: hgnc:11720
      label: TECTA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:9590290
    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that mutations in TECTA are responsible for hearing
      impairment in these families, and implicate a new type of protein in the
      pathogenesis of hearing impairment.
    explanation: >-
      The founding gene-disease assignment.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, our results indicate that DFNA8/12 hearing loss is a frequent
      type of ADNSHL.
    explanation: >-
      Establishes the relative frequency of this subtype within dominant
      nonsyndromic hearing loss.
animal_models:
- name: Tecta L1820F,G1824D/+ mouse (ZP domain)
  species: Mouse
  genotype: Tecta(L1820F,G1824D/+), modelling the Belgian DFNA12 ZP-domain family
  publication: PMID:24363064
  description: >-
    One of three allele-matched mouse models built to test the human
    domain-to-audiogram correlation directly.
  modeled_mechanisms:
  - target: Defective Tectorial Membrane Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the ZP-domain structural lesion and elevated thresholds, and
      confirms that ZP and ZA variants damage the matrix differently. It does not
      reproduce human progression, and it shows a phenotype humans do not have.
    limitations: >-
      Thresholds are elevated across 8-40 kHz rather than in a mid-frequency band,
      and the mouse cochlea's frequency map differs from the human one, so the
      audiogram shape that defines the human disease cannot be modelled directly.
      The mice also develop audiogenic seizures, which is not a feature of human
      DFNA8/12.
    readouts:
    - name: Auditory brainstem response threshold, 8-40 kHz
      target: Defective Tectorial Membrane Matrix Assembly
      direction: INCREASED
      interpretation: >-
        Threshold elevation of 30-40 dB confirms functional hearing loss from a
        ZP-domain allele.
      evidence:
      - reference: PMID:24363064
        reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Auditory brainstem response thresholds in the 8-40 kHz range are
          elevated by 30-40 dB in the ZP-domain mutants, whilst those in the
          ZA-domain mutant are elevated by 20-30 dB.
        explanation: >-
          Gives the measured threshold elevation for both domain classes.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Three mutant mice were created as models for human Tecta mutations; the
      Tecta(L1820F,G1824D/+) mouse for zona pellucida (ZP) domain mutations
      causing stable mid-frequency hearing loss in a Belgian family
    explanation: >-
      Establishes that this line was built to carry a specific human allele.
- name: Tecta C1619S/+ mouse (ZA domain)
  species: Mouse
  genotype: Tecta(C1619S/+), modelling the French DFNA12 zonadhesin-domain family
  publication: PMID:24363064
  description: >-
    The allele-matched model for the progressive, high-frequency human phenotype
    — and the one that does not reproduce the progression.
  modeled_mechanisms:
  - target: Defective Tectorial Membrane Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the ZA-domain structural lesion and threshold elevation, but the
      phenotype is stable where the human one progresses.
    limitations: >-
      The human C1619S family has progressive high-frequency loss; the mouse
      carrying the same substitution does not deteriorate over the period
      studied, in either tectorial membrane structure or auditory function. Any
      study of progression, or of an intervention aimed at slowing it, cannot use
      this model as its readout.
    readouts:
    - name: Longitudinal auditory threshold and tectorial membrane structure
      target: Defective Tectorial Membrane Matrix Assembly
      direction: UNCHANGED
      interpretation: >-
        A genuine negative: no deterioration over time, against a progressive
        human course for the same allele.
      evidence:
      - reference: PMID:24363064
        reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The phenotypes are stable and no evidence has been found for a
          progressive deterioration in TM structure or auditory function.
        explanation: >-
          Reports the absence of progression in the mutant mice.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the Tecta(C1619S/+) mouse for a zonadhesin-like (ZA) domain mutation
      responsible for progressive, high-frequency hearing loss in a French family
    explanation: >-
      Establishes the human allele this line was built to model.
- name: Tecta C1509G/+ mouse
  species: Mouse
  genotype: Tecta(C1509G/+) transgenic
  publication: PMID:21567249
  description: >-
    The model that supplies the biophysical account of secondary outer hair cell
    loss, through a shortened tectorial membrane that contacts only the first
    outer hair cell row.
  modeled_mechanisms:
  - target: Secondary Outer Hair Cell Vulnerability
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Shows partial uncoupling, raised shear on the still-coupled row, increased
      prestin-driven reticular lamina movement, greater noise vulnerability and
      excess outer hair cell death.
    limitations: >-
      The corresponding human phenotype is described as worsening over time, but
      the mouse's emission thresholds were stable to six months in quiet and the
      excess cell death was elicited by experimental noise exposure. The model
      therefore demonstrates a vulnerability rather than spontaneous progression,
      and the noise exposure has no defined human equivalent.
    readouts:
    - name: Outer hair cell survival after noise exposure
      target: Secondary Outer Hair Cell Vulnerability
      direction: DECREASED
      interpretation: >-
        Preferential loss in the first row, the row left mechanically coupled by
        the shortened membrane.
      evidence:
      - reference: PMID:21567249
        reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          While Tecta(+/+) mice lost OHCs primarily at the base and within all
          three rows, Tecta(C1509G/+) mice lost most of their OHCs in a more
          apical region of the cochlea and nearly completely within the first row.
        explanation: >-
          Locates the excess cell death in the row predicted to bear the extra
          shear.
    - name: Distortion product otoacoustic emission threshold in quiet
      target: Secondary Outer Hair Cell Vulnerability
      direction: UNCHANGED
      interpretation: >-
        No spontaneous deterioration in a quiet environment to six months, which
        is what confines the model's claim to vulnerability rather than
        progression.
      evidence:
      - reference: PMID:21567249
        reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Distortion product otoacoustic emission thresholds in a quiet
          environment did not change to 6 months of age.
        explanation: >-
          Records the absence of spontaneous progression in the unexposed mutant.
  evidence:
  - reference: PMID:21567249
    reference_title: "Biophysical mechanisms underlying outer hair cell loss associated with a shortened tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Humans with an autosomal dominant C1509G mutation in alpha-tectorin, a
      protein constituent of the TM, are born with a partial hearing loss that
      worsens over time.
    explanation: >-
      Establishes that the modelled allele is a human disease allele.
diagnosis:
- name: Pure tone audiometry with otoacoustic emissions
  description: >-
    Audiometry establishes the configuration — U-shaped mid-frequency loss being
    the classic pattern — and emissions testing shows the cochlear amplifier to
    be absent. The combination of absent emissions with good word recognition is
    characteristic and should prompt TECTA testing rather than a search for
    retrocochlear pathology.
  evidence:
  - reference: PMID:24636747
    reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pure tone audiometry, brainstem evoked response audiometry, the Freiburger
      test for speech understanding and transient evoked and distortion product
      otoacoustic emissions were assessed in three available affected members
      bearing p.Y1870C.
    explanation: >-
      Lists the test battery used to characterise affected family members.
- name: TECTA sequencing
  description: >-
    Confirmatory, and worth doing on audiometric grounds even outside a known
    family: preselecting probands by audiogram was how one large American cohort
    was screened. The domain the variant lands in narrows the expected audiogram
    and course, though it does not fix them.
  evidence:
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In an additional cohort of 835 American ADNSHL families, we preselected 73
      probands for TECTA screening based on audiometric data.
    explanation: >-
      Documents audiogram-guided selection for TECTA testing.
treatments:
- name: Hearing amplification and auditory rehabilitation
  description: >-
    First-line management. Because the lesion is a mechanical failure of an
    acellular matrix and the sensory and neural elements are preserved,
    amplification is unusually effective and speech perception outcomes are good.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C49947
          label: Hearing Aid
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Cochlear Amplifier Failure
    description: >-
      Amplification substitutes externally for the gain the tectorial membrane
      can no longer deliver, without repairing the matrix.
    evidence:
    - reference: PMID:24636747
      reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the missense p.Y1870C TECTA mutation leads to complete failure of
        the cochlear amplifier in humans, very high speech perception scores can
        be achieved with appropriate therapy.
      explanation: >-
        Establishes that treating the amplification failure externally restores
        useful speech perception.
  evidence:
  - reference: PMID:24636747
    reference_title: "Despite a lack of otoacoustic emission, word recognition is not seriously influenced in a TECTA DFNA8/12 family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transient evoked and distortion product otoacoustic emissions were
      completely absent in all affected family members whereas word recognition
      scores were up to 95%.
    explanation: >-
      Supports good functional outcomes despite complete amplifier failure.
differential_diagnoses:
- name: DFNB21, recessive TECTA deafness
  description: >-
    The same gene by the other mechanism. Truncating TECTA alleles are recessive
    and cause severe-to-profound prelingual deafness; heterozygous carriers hear
    normally. A truncating TECTA variant found in a dominant pedigree therefore
    argues against DFNA8/12 rather than for it.
  evidence:
  - reference: PMID:9949200
    reference_title: "An alpha-tectorin gene defect causes a newly identified autosomal recessive form of sensorineural pre-lingual non-syndromic deafness, DFNB21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the TECTA gene in the DFNB21-affected family revealed a
      G to A transition in the donor splice site (GT) of intron 9, predicted to
      lead to a truncated protein of 971 amino acids.
    explanation: >-
      Documents the truncating allele class that produces the recessive disease.
- name: Other autosomal dominant nonsyndromic hearing loss loci
  description: >-
    More than fifty DFNA loci are known and none is distinguishable from DFNA8/12
    by audiogram alone, though a U-shaped mid-frequency loss narrows the field
    considerably. Separation is by sequencing.
  evidence:
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We therefore completed unbiased screening for TECTA mutations in a Spanish
      cohort of 372 probands from ADNSHL families.
    explanation: >-
      Indicates that TECTA is identified within a large pool of otherwise similar
      dominant nonsyndromic hearing loss families, which is why sequencing rather
      than phenotype makes the assignment.
discussions:
- discussion_id: mouse_does_not_progress
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do allele-matched Tecta mice not show the progression seen in the
    patients carrying the same substitution, and can any mouse be used to study
    progression in this disease?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Secondary Outer Hair Cell Vulnerability
  rationale: >-
    The C1619S family has progressive high-frequency loss and the C1619S mouse
    does not deteriorate in either tectorial membrane structure or auditory
    function. The C1509G mouse likewise has stable emission thresholds in quiet to
    six months, and its excess outer hair cell death appears only after
    experimental noise exposure. Two readings are open: mouse lifespan may simply
    be too short for a process that takes human decades, or human progression may
    require cumulative acoustic exposure that laboratory housing does not supply —
    which would make the noise-exposure result the more faithful model of the
    human course, not the less. The distinction is testable and matters, because
    an intervention aimed at slowing progression currently has no model in which
    spontaneous progression occurs.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The phenotypes are stable and no evidence has been found for a progressive
      deterioration in TM structure or auditory function.
    explanation: >-
      The direct statement of absent progression in the allele-matched mice.
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study reports linkage to DFNA12 in a new family with autosomal
      dominant high frequency hearing loss progressing from mild to moderate
      severity.
    explanation: >-
      Establishes that the human phenotype for a ZA-domain allele does progress,
      which is the half of the mismatch the mouse fails to reproduce.
- discussion_id: audiogenic_seizure_in_tecta_mice
  kind: OPEN_QUESTION
  prompt: >-
    Do Tecta mutations confer any central auditory phenotype in humans, given
    that all three allele-matched mouse models develop audiogenic seizures?
  attaches_to:
  - animal_models#Mouse
  rationale: >-
    All three mice show an increased tendency to audiogenic seizures at low sound
    pressure levels, which the authors call a previously unrecognised consequence
    of Tecta mutations. Audiogenic seizure susceptibility is a well-known mouse
    strain trait with no straightforward human counterpart, so the most likely
    reading is that this is a species-specific finding. It is recorded because it
    is a positive result in a genotype-matched model that nobody has looked for in
    patients, and because assuming it is irrelevant is a judgement rather than an
    observation.
  evidence:
  - reference: PMID:24363064
    reference_title: "Three deaf mice: mouse models for TECTA-based human hereditary deafness reveal domain-specific structural phenotypes in the tectorial membrane."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite elevated auditory thresholds, the Tecta mutant mice all exhibit an
      enhanced tendency to have audiogenic seizures in response to white noise
      stimuli at low sound pressure levels (≤84 dB SPL), revealing a previously
      unrecognised consequence of Tecta mutations.
    explanation: >-
      Reports the unexpected central phenotype in all three models.
- discussion_id: domain_audiogram_correlation_limits
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of the audiogram configuration does the mutated alpha-tectorin
    domain actually predict?
  attaches_to:
  - pathophysiology#Defective Tectorial Membrane Matrix Assembly
  - phenotypes#Mid-Frequency Hearing Loss
  rationale: >-
    The original correlation was clean — ZP domain giving stable mid-frequency
    loss, zonadhesin domain giving progressive high-frequency loss — and mouse
    models confirm that the two domains damage the matrix differently. But
    unbiased cohort screening then found mid-frequency loss arising from entactin
    and vWFD1/vWFD2 variants too, so the mapping from domain to audiogram is
    many-to-one at best. What is not known is whether the residual variance is
    explained by finer structural features such as cysteine involvement, by
    modifier genes, or by environmental exposure. Until that is settled, a domain
    assignment should inform counselling about the likely audiogram without being
    presented as a prediction of it.
notes: >-
  DFNA8 and DFNA12 are the same disease. They were mapped separately in an
  Austrian and a Belgian family and both turned out to be TECTA, so the
  literature writes DFNA8/12. This entry is filed under the DFNA12 MONDO term and
  records DFNA8/12 as a synonym.

  Two mouse readouts in this entry use direction UNCHANGED deliberately. The
  absence of progression in the C1619S line and the stable emission thresholds in
  the unexposed C1509G line are real negative results, and they are the findings
  that bound what each model can be used for. Recording them as absent
  measurements would hide the mismatch that the HUMAN_MODEL_MISMATCH discussion
  is about.

  The deep-research report for this entry proposed HP:0008565 as a phenotype
  term. Its own term-validation section flagged that identifier as not existing
  in HPO, and it is not bound anywhere here. Recorded so a later curator does not
  rediscover it from the report and use it.

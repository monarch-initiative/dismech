- category: Auditory
  name: Progressive Sensorineural Hearing Impairment
  description: >-
    Worsening over time in a subset of genotypes, characteristically those
    substituting a cysteine or affecting the zonadhesin domain. Many ZP-domain
    non-cysteine variants are stable instead, so progression is genotype-dependent
    rather than a general feature.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In these families, missense mutations within the zona pellucida domain of
      alpha-tectorin were associated with stable severe mid-frequency hearing
      loss.
    explanation: >-
      Contrasts the stable ZP-domain course with the progressive ZA-domain course

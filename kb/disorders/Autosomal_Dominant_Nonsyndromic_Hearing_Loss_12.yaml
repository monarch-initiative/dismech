- name: Cochlear Amplifier Failure
  biological_scale: TISSUE
  description: >-
    Reduced or mistimed outer hair-cell feedback lowers cochlear sensitivity. Homozygous alpha-tectorin
    deletion mice have detached membranes and a 35 dB sensitivity reduction; this establishes normal membrane
    function indirectly for dominant DFNA8/12. Three assessed p.Y1870C family members had absent emissions
    with relatively preserved word recognition. Neither observation proves intact sensory cells and nerves
    in every patient or complete amplifier failure for every allele.

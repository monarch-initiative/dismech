    reference_title: "Mutations in the human alpha-tectorin gene cause autosomal dominant non-syndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In both families, mutation analysis revealed missense mutations which
      replace conserved amino-acid residues within the zona pellucida domain of
      TECTA.
    explanation: >-
      The founding identification of TECTA missense variants in the DFNA8 and
      DFNA12 families.
  - reference: PMID:21520338
    reference_title: "DFNA8/12 caused by TECTA mutations is the most identified subtype of nonsyndromic autosomal dominant hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations lie in all domains of the α-tectorin protein, including those for
      the first time identified in the entactin domain, as well as the vWFD1,
      vWFD2, and vWFD3 repeats, and the D1-D2 and TIL2 connectors.
    explanation: >-
      Establishes that the allelic spectrum spans the whole protein rather than
      being confined to the ZP and ZA domains.
  - reference: PMID:10196713
    reference_title: "Mutation in the zonadhesin-like domain of alpha-tectorin associated with autosomal dominant non-syndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation abolishes the first of the vicinal cysteines
      (1619Cys-Gly-Leu- 1622Cys) present in the D4 von Willebrand factor (vWf)
      type D repeat.
    explanation: >-
      Describes the cysteine-disrupting allele class and locates it in the
      zonadhesin-like domain.

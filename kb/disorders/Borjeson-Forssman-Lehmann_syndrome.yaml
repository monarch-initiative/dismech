    reference_title: "https://api.orphadata.com/rd-cross-referencing/orphacodes/127"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Borjeson-Forssman-Lehmann syndrome (BFLS) is a rare X-linked obesity
      syndrome characterized by intellectual deficit, truncal obesity,
      characteristic facial features, hypogonadism, tapered fingers and short
      toes.
    explanation: The Orphadata definition supplies the core recognizable clinical pattern.
- name: PHF6 molecular genetic testing
  description: >-
    Molecular confirmation requires identification and clinical interpretation
    of a pathogenic or likely pathogenic PHF6 variant. Testing should be able to
    detect both sequence variants and exon-level or whole-gene copy-number
    changes because the observed spectrum includes missense, splice, frameshift,
    nonsense, in-frame, deletion, and duplication variants.
  presence: Identification of a pathogenic or likely pathogenic PHF6 variant establishes the molecular diagnosis.
  diagnosis_term:

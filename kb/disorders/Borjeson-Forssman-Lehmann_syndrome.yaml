- name: Ephrin receptor transcriptional dysregulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PHF6 binds regulatory regions near Ephrin receptor genes and promotes their
    expression in developing mouse cortex. BFLS patient-variant mice and
    conditional Phf6-knockout mice show impaired Ephrin receptor regulation.
    This is a strong preclinical pathway, but direct confirmation in human
    prenatal neural tissue is unavailable.

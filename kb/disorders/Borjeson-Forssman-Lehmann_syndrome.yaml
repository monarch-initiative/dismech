diagnosis:
- name: Clinical recognition of the BFLS pattern
  description: >-
    Clinical suspicion is raised by developmental delay or intellectual
    disability with characteristic facial and digital findings, infantile
    hypotonia, truncal obesity, and hypogonadism. Blaschko-linear pigmentation
    and dental, retinal, or cortical anomalies are particularly informative in
    affected females.
  presence: A compatible syndromic neurodevelopmental phenotype prompts PHF6 testing.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351

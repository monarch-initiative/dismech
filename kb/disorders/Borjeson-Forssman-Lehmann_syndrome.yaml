    causal_link_type: DIRECT
    description: >-
      Mouse cortical binding, expression, knockdown, and rescue experiments
      identify Ephrin receptors as direct PHF6 transcriptional targets.
    evidence:
    - reference: DOI:10.1038/s44319-024-00082-0
      reference_title: PHF6-mediated transcriptional control of NSC via Ephrin receptors is impaired in the intellectual disability syndrome BFLS
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We identify a panel of Ephrin receptors (EphRs) as direct
        transcriptional targets of PHF6.
      explanation: This directly supports the PHF6-to-Ephrin-receptor edge in the mouse cortical model.
  - target: Abnormal neuronal morphogenesis
    causal_link_type: DIRECT
    description: >-
      PHF6 knockout directly impairs proliferation, neurite outgrowth, and
      migration in a differentiated human neuron-like cell model.
    evidence:
    - reference: DOI:10.1038/s41598-020-75999-2
      reference_title: Loss of PHF6 leads to aberrant development of human neuron-like cells
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Subsequently, we could demonstrate that PHF6 is indeed required for
        proper neuron proliferation, neurite outgrowth and migration.
      explanation: The CRISPR cell model directly tests PHF6 loss and neuronal developmental readouts.
  - target: Human neurodevelopmental and neurologic manifestations
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pathogenic PHF6 variants cause the human neurodevelopmental syndrome, but
      several developmental intermediates between broad transcriptional
      dysregulation and each clinical manifestation remain unknown.
    evidence:
    - reference: DOI:10.1038/s41431-023-01447-0

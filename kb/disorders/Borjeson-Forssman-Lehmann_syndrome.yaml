- phase: Neurodevelopmental manifestations
  age_range: Infancy through childhood
  notes: >-
    Motor milestones and speech are delayed, and intellectual disability ranges
    from mild to severe. Behavioral problems are common and may add substantial
    care needs.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the individuals had delayed motor milestones. Intellectual
      disability varied in severity from mild to severe. Limited or delayed
      speech was common (18/19). Behavioural problems were also frequent
      (13/19, 6 males and 7 females).
    explanation: >-
      The 19-person PHF6 cohort documents the childhood neurodevelopmental
      course and its variable severity.
- phase: Evolving craniofacial, growth, and endocrine phenotype
  age_range: Late childhood through adulthood
  notes: >-
    Facial coarsening and truncal obesity often become more apparent from late
    childhood. Pubertal and gonadal manifestations require age-appropriate
    assessment; gynecomastia is particularly associated with older affected
    males.

differential_diagnoses:
- name: Coffin-Siris syndrome
  description: >-
    Coffin-Siris syndrome can overlap in young affected females through
    intellectual disability, sparse hair, and hypoplastic nails. PHF6 testing,
    Blaschko-linear pigmentation, and the broader BFLS sex- and
    variant-associated pattern help resolve the distinction.
  disease_term:
    preferred_term: Coffin-Siris syndrome
    term:
      id: MONDO:0015452
      label: Coffin-Siris syndrome
  distinguishing_features:
  - BFLS is molecularly defined by pathogenic PHF6 variation rather than a BAF/SWI-SNF complex gene defect.
  - Blaschko-linear pigmentation and the BFLS endocrine pattern favor PHF6-related disease.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotypic combination of ID, sparse hair and hypoplastic nails in
      younger affected females has been noted to overlap with Cofﬁn-Siris
      syndrome (MIM# 135900)
    explanation: The cohort explicitly identifies Coffin-Siris syndrome as a clinical overlap.
- name: Incontinentia pigmenti
  description: >-
    Incontinentia pigmenti is an important differential in affected females
    with Blaschko-linear pigmentation and ectodermal, dental, retinal, or
    neurologic findings. IKBKG testing distinguishes it from PHF6-related BFLS.
  disease_term:
    preferred_term: IKBKG-related immunodeficiency with or without ectodermal dysplasia
    term:
      id: MONDO:0100162
      label: IKBKG-related immunodeficiency with or without ectodermal dysplasia
  distinguishing_features:
  - Incontinentia pigmenti is caused by pathogenic IKBKG variants, whereas BFLS is caused by PHF6 variants.
  - The BFLS phenotype includes its characteristic facial, digital, obesity, and hypogonadism pattern.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The streaky skin pigmentation in F1, F3 and F5 led to incontinentia
      pigmenti being considered and IKBKG gene testing being arranged.
    explanation: The cohort documents real-world consideration and molecular exclusion of this differential.
- name: Terminal osseous dysplasia-pigmentary defects syndrome
  description: >-
    Terminal osseous dysplasia with pigmentary defects overlaps in affected
    females through pigmentary abnormalities, digital anomalies, and recurrent
    digital fibromas. FLNA testing and the disorder-specific skeletal pattern
    distinguish it from PHF6-related BFLS.
  disease_term:

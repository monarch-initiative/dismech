discussions:
- discussion_id: bfls_neural_stem_cell_direction
  prompt: >-
    Does PHF6 loss increase or decrease embryonic neural stem-cell self-renewal,
    and which experimental variable explains the opposite findings across
    recent BFLS mouse models?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Altered embryonic neural stem-cell regulation
  rationale: >-
    One BFLS patient-variant and conditional-knockout study reports increased
    self-renewal with fewer neural progenitors, whereas another Phf6-deficient
    model reports reduced self-renewal with increased neuronal differentiation.
    The graph therefore records abnormal regulation without fixing its
    direction.
  evidence:
  - reference: DOI:10.1038/s44319-024-00082-0
    reference_title: PHF6-mediated transcriptional control of NSC via Ephrin receptors is impaired in the intellectual disability syndrome BFLS
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Characterization of BFLS mice harbouring PHF6 patient mutations reveals
      an increase in embryonic neural stem cell (eNSC) self-renewal and a
      reduction of neural progenitors.
    explanation: This study reports increased self-renewal.
  - reference: DOI:10.1371/journal.pgen.1011428
    reference_title: Loss of PHF6 causes spontaneous seizures, enlarged brain ventricles and altered transcription in the cortex of a mouse model of the Börjeson–Forssman–Lehmann intellectual disability syndrome
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Phf6 deficient neural precursor cells showed a reduced capacity for
      self-renewal and increased differentiation into neurons.
    explanation: This study reports reduced self-renewal.
- discussion_id: bfls_sex_variant_x_inactivation
  prompt: >-
    How do variant class, residual PHF6 activity, tissue-specific
    X-chromosome inactivation, and ascertainment combine to determine BFLS
    expression in affected females and males?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#PHF6
  rationale: >-
    Variant-class patterns differ strongly by sex, yet overlapping variants,
    affected and unaffected carrier females, and discordant X-inactivation
    observations prevent a simple deterministic genotype-phenotype model.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, a clear correlation between XCI and disease severity has not
      been demonstrated.
    explanation: The cohort explicitly states that X-inactivation does not yet explain severity.
- discussion_id: bfls_cancer_risk
  prompt: >-
    Is germline PHF6-related BFLS associated with a clinically meaningful
    age-specific cancer risk that warrants syndrome-specific surveillance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Somatic PHF6 variants occur in cancers and a few cancers have been reported
    in people with BFLS, but the denominator is very small and no risk estimate
    supports a syndrome-specific screening schedule. Cancer surveillance is
    therefore not represented as established BFLS management.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, at present, the cancer risk for BFLS patients remains
      uncertain due to lack of evidence.
    explanation: The clinical-spectrum paper explicitly identifies cancer risk as unresolved.
- discussion_id: bfls_ephrin_translation
  prompt: >-
    Does the PHF6-Ephrin-receptor rescue pathway observed in mouse embryonic
    neural stem cells translate to human prenatal neurodevelopment or a safe
    therapeutic strategy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ephrin receptor transcriptional dysregulation
  rationale: >-
    EphA4 or EphA7 expression rescues a cell-level phenotype in mouse-derived
    embryonic neural stem cells, but this does not establish efficacy, safety,
    timing, or delivery in humans. The rescue is represented as mechanistic
    evidence and not as a treatment.
  evidence:
  - reference: DOI:10.1038/s44319-024-00082-0
    reference_title: PHF6-mediated transcriptional control of NSC via Ephrin receptors is impaired in the intellectual disability syndrome BFLS
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      EphR-A family of receptors rescues PHF6 loss-of-function defects in BFLS
      mice-derived eNSCs.
    explanation: The rescue experiment is confined to mouse-derived embryonic neural stem cells.
review_notes: >-
  The 2026 re-review replaced the original narrow phenotype list with a
  sex-aware clinical profile grounded in the 19-person PHF6 cohort and current
  Orphadata records, added neonatal onset, progression, ultra-rare prevalence,
  high but variable clinical burden, diagnostic strategy, explicit
  differentials, monitoring and supportive management, and GSE247838, the
  disease-mechanism GEO dataset. Every pathograph edge now states
  mechanistic directness and carries evidence; preclinical cellular mechanisms
  remain provisional, while human phenotype-cluster nodes avoid pretending
  that one mouse pathway explains all multisystem findings. The contradictory
  neural-stem-cell self-renewal results, unresolved sex/variant/X-inactivation
  model, uncertain cancer risk, and preclinical status of Ephrin-receptor rescue
  are explicitly retained as open discussions. ClinicalTrials.gov API queries
  for "Borjeson-Forssman-Lehmann syndrome" and "PHF6 syndrome" were checked on
  2026-07-24 and returned no disease-specific studies, so clinical_trials
  remains empty. No disease-modifying treatment is established. The D2P audit
  identified many externally asserted granular features; central
  source-backed findings were added, but rows lacking precise cached human
  support were not bulk-imported. The bundled Asta report was used only for
  source discovery; all curated assertions were checked against direct
  reference caches.

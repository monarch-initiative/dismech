clinical_burden:
  burden_level: HIGH
  rationale: >-
    BFLS produces lifelong neurodevelopmental disability with variable speech
    limitation and behavior challenges, together with endocrine, visual,
    hearing, neurologic, skin, dental, and congenital complications that require
    multidisciplinary follow-up. Severity varies considerably, especially by
    sex and variant context, and the available cohorts are small; high burden
    does not imply uniformly severe expression in every affected person.
  evidence:
  - reference: DOI:10.1038/s41431-023-01447-0
    reference_title: "Börjeson–Forssman–Lehmann syndrome: delineating the clinical and allelic spectrum in 14 new families"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the individuals had delayed motor milestones. Intellectual
      disability varied in severity from mild to severe. Limited or delayed
      speech was common (18/19). Behavioural problems were also frequent
      (13/19, 6 males and 7 females).
    explanation: >-
      Universal motor delay, frequent speech limitation, and behavioral
      morbidity in the cohort support substantial lifelong care needs.
inheritance:
- name: X-linked inheritance
  description: >-
    BFLS is caused by pathogenic PHF6 variants on the X chromosome. Affected
    males and females are both reported, with inherited variants and mildly
    affected or unaffected carrier females in some families and de novo,
    often more disruptive variants in many clinically affected females.
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417

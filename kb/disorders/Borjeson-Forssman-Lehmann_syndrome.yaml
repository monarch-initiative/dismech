name: Borjeson-Forssman-Lehmann syndrome
creation_date: "2026-04-15T15:45:03Z"
category: Mendelian
description: >-
  Borjeson-Forssman-Lehmann syndrome (BFLS) is an ultra-rare X-linked
  PHF6-related neurodevelopmental disorder. Core manifestations include
  developmental delay or intellectual disability, infantile hypotonia,
  characteristic craniofacial and digital findings, truncal obesity, and
  hypogonadism. Expression is sex- and variant-dependent: affected males often
  have inherited missense or small in-frame variants, whereas clinically
  affected females more often have de novo truncating variants or larger
  deletions or duplications and may show Blaschko-linear pigmentation, dental,
  retinal, or cortical abnormalities. PHF6-dependent transcriptional
  dysregulation is established, but specific downstream developmental pathways
  remain incompletely resolved and are supported mainly by cellular and mouse
  models.

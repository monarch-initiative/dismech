    snippet: >-
      Börjeson-Forssman-Lehmann syndrome (BFLS) is an X-linked intellectual
      disability syndrome caused by variants in the PHF6 gene.
    explanation: This directly supports X-linked PHF6-related inheritance.
pathophysiology:
- name: PHF6-dependent transcriptional dysregulation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PHF6 is a chromatin-associated transcriptional regulator. Pathogenic PHF6
    variation disrupts broad transcriptional programs, including programs
    involved in chromatin regulation, axon development, neuronal development,
    and cortical neurogenesis. The causal gene-disease relationship is
    definitive, while the precise molecular consequence differs across variant
    classes and sex contexts.
  genes:
  - preferred_term: PHF6
    modifier: ABNORMAL
    term:
      id: hgnc:18145
      label: PHF6
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:

genetic:
- name: PHF6
  association: Pathogenic PHF6 variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: PHF6
    term:
      id: hgnc:18145
      label: PHF6
  notes: >-
    The PHF6-BFLS relationship is definitive. Affected males often have
    inherited missense variants or small in-frame deletions, while affected
    females more often have de novo truncating variants or large
    deletions/duplications. This is a cohort-level pattern rather than an
    absolute genotype-phenotype rule; missense variants also occur in affected
    females and X-inactivation does not fully explain severity.
  evidence:

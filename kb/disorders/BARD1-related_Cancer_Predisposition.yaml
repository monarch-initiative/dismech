  - reference: PMID:41066719
    reference_title: Investigation of DNA Damage Response Genes Validates the Role of DNA Repair in Pediatric Cancer Risk and Identifies SMARCAL1 as a Novel Osteosarcoma Predisposition Gene.
    supports: SUPPORT

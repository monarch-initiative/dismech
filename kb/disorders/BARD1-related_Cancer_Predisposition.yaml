      label: Autosomal dominant inheritance
  description: >-
    Heterozygous germline loss-of-function variants confer the predisposition. ClinGen classifies the BARD1 relationship with this MONDO entity as autosomal dominant. No constitutional biallelic BARD1 phenotype is described in the sources used here (see the biallelic knowledge-gap discussion).
  evidence:
  - reference: CGGV:assertion_09113d8c-ba63-40f1-9c8f-08b67c6c867c-2024-09-03T170000.000Z
    reference_title: BARD1 / BARD1-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is definitive evidence supporting the relationship between BARD1 and autosomal dominant inherited BARD1-related cancer predisposition."
    explanation: The ClinGen Hereditary Cancer GCEP curation states the mode of inheritance for this MONDO entity.
pathophysiology:
- name: Germline BARD1 Loss of Function
  description: >-
    Heterozygous germline nonsense, frameshift, copy-number and selected missense variants reduce functional BARD1. BARD1 is required for the ubiquitin ligase activity of the BRCA1-BARD1 RING heterodimer; individually, BRCA1 and BARD1 have very low ligase activity in vitro. ClinGen describes the pathogenic mechanism as loss of function with disrupted BRCA1 binding and loss of DNA damage response. In isogenic neuroblastoma and RPE1 cells, single-allele truncating variants were sufficient to reduce repair efficiency (haploinsufficiency).
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  evidence:
  - reference: CGGV:assertion_09113d8c-ba63-40f1-9c8f-08b67c6c867c-2024-09-03T170000.000Z
    reference_title: BARD1 / BARD1-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is loss of function in which BRCA1 binding is disrupted and subsequent loss of DNA damage response."
    explanation: ClinGen states the disease mechanism for this gene-disease pair.
  - reference: PMID:11278247
    reference_title: The RING heterodimer BRCA1-BARD1 is a ubiquitin ligase inactivated by a breast cancer-derived mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas individually BRCA1 and BARD1 have very low ubiquitin ligase activities in vitro, BRCA1 combined with BARD1 exhibits dramatically higher activity."
    explanation: Purified-protein assays show that the ligase activity resides in the heterodimer, so BARD1 loss removes a required partner.
  - reference: PMID:8944023
    reference_title: Identification of a RING protein that can interact in vivo with the BRCA1 gene product.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The BARD1/BRCA1 interaction is disrupted by BRCA1 missense mutations that segregate with breast cancer susceptibility, indicating that BARD1 may be involved in mediating tumour suppression by BRCA1."
    explanation: Original identification of BARD1 as the BRCA1 RING partner, linking the interaction to tumor suppression.
  - reference: PMID:37688570
    reference_title: BARD1 germline variants induce haploinsufficiency and DNA repair defects in neuroblastoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we used CRISPR-Cas9 to generate isogenic neuroblastoma (IMR-5) and control (RPE1) cellular models harboring heterozygous BARD1 loss-of-function variants (R112*, R150*, E287fs, and Q564*)"
    explanation: Engineered heterozygous truncating alleles model the germline first hit without a second hit.

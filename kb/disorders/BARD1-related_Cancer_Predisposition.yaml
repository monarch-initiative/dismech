  downstream:
  - target: Impaired BRCA1-BARD1 Homologous Recombination
    description: Biallelic loss in the tumor removes residual BRCA1-BARD1 function; in breast tumors it co-occurred with an HRD phenotype.
    causal_link_type: DIRECT
- name: Impaired BRCA1-BARD1 Homologous Recombination
  description: >-
    BRCA1-BARD1 binds DNA and RAD51 and stimulates RAD51-mediated synaptic-complex assembly during homologous recombination. BARD1 variants that are non-functional in homology-directed-repair reporter assays sensitize cells to ionizing radiation and cisplatin, and this assay separates known pathogenic from known benign BARD1 variants.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "dna_repair_synthetic_lethality#HRR or FA/BRCA Repair Deficiency"
  evidence:
  - reference: PMID:28976962
    reference_title: BRCA1-BARD1 promotes RAD51-mediated homologous DNA pairing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that both BRCA1 and BARD1 bind DNA and interact with RAD51, and that BRCA1-BARD1 enhances the recombinase activity of RAD51."
    explanation: Purified-protein biochemistry defines a direct BARD1-dependent step in homologous recombination.
  - reference: PMID:30925164
    reference_title: Functional analysis of BARD1 missense variants in homology-directed repair and damage sensitivity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two known benign variants were found to be functional in HDR, and three known pathogenic variants were non-functional, supporting the notion that the HDR assay can be used to predict the clinical risk of BARD1 variants."
    explanation: Cell-based HDR assays align loss of repair function with clinical pathogenicity.
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
    modifier: DECREASED
  downstream:
  - target: Genomic Instability and Homologous-Recombination Deficiency
    description: Failure of error-free double-strand break repair increases DNA damage burden and chromosomal instability.
    causal_link_type: DIRECT
  - target: PARP-Inhibitor and Platinum Sensitivity
    description: HR-deficient cells become sensitive to PARP inhibition and cisplatin.
    causal_link_type: DIRECT
- name: Genomic Instability and Homologous-Recombination Deficiency
  description: >-
    Common and rare neuroblastoma-associated BARD1 germline variants were associated with lower BARD1 mRNA and higher DNA-damage burden. Bard1-null mouse cells are aneuploid, and mammary-specific Bard1 inactivation produces tumors with high chromosomal instability. HRD has been observed in triple-negative carrier breast tumors with LOH but not in non-triple-negative primaries.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "genome_instability_mutation#Mutator Phenotype and Chromosomal Instability"
  evidence:
  - reference: PMID:37688570
    reference_title: BARD1 germline variants induce haploinsufficiency and DNA repair defects in neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both common and rare neuroblastoma-associated BARD1 germline variants were associated with lower levels of BARD1 mRNA and an increased burden of DNA damage."
    explanation: Genotype-correlation analysis in normal tissues and neuroblastomas links germline BARD1 variation to DNA damage burden.
  - reference: PMID:12832489
    reference_title: "Loss of Bard1, the heterodimeric partner of the Brca1 tumor suppressor, results in early embryonic lethality and chromosomal instability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This result, together with the increased chromosomal aneuploidy of Bard1 mutant cells, indicates a role for Bard1 in maintaining genomic stability."
    explanation: Complete Bard1 loss in mice causes aneuploidy; this is a null model, not the heterozygous human state.
  downstream:
  - target: Breast carcinoma
    description: Genomic instability in mammary epithelium is the proposed route to the ER-negative and triple-negative breast cancers enriched in carriers.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18443292
      reference_title: The basal-like mammary carcinomas induced by Brca1 or Bard1 inactivation implicate the BRCA1/BARD1 heterodimer in tumor suppression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Reminiscent of the basal-like breast carcinomas seen in human BRCA1 mutation carriers, these tumors are \"triple negative\" for estrogen and progesterone receptor expression and HER2/neu amplification."
      explanation: Conditional mammary Bard1 inactivation produces triple-negative carcinomas; this is mouse evidence from a biallelic conditional deletion, not a heterozygous germline model.
  - target: Neuroblastoma
    description: DNA-repair infidelity is proposed by the primary authors as a mechanism contributing to neuroblastoma initiation in carriers.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37688570
      reference_title: BARD1 germline variants induce haploinsufficiency and DNA repair defects in neuroblastoma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Taken together, we demonstrate that germline BARD1 variants disrupt DNA repair fidelity. This is a fundamental molecular mechanism contributing to neuroblastoma initiation that may have important therapeutic implications."
      explanation: The authors' conclusion links the repair defect to initiation; the initiation step itself was not tested directly.
- name: PARP-Inhibitor and Platinum Sensitivity
  description: >-
    Heterozygous BARD1 loss-of-function isogenic neuroblastoma cells show increased sensitivity to cisplatin and PARP inhibition in vitro and in vivo. This is a therapeutic vulnerability, not a disease manifestation; clinical evidence is a single pediatric case report.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "dna_repair_synthetic_lethality#PARP and Platinum Synthetic Lethality"
  evidence:
  - reference: PMID:37688570
    reference_title: BARD1 germline variants induce haploinsufficiency and DNA repair defects in neuroblastoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "enhanced sensitivity to cisplatin and poly (ADP-ribose) polymerase (PARP) inhibition both in vitro and in vivo"
    explanation: Isogenic heterozygous models establish the drug sensitivity in cells and in vivo.
discussions:
- discussion_id: bard1_ovarian_cancer_disputed
  kind: CONTROVERSY
  attaches_to:
  - disease#
  prompt: Do germline BARD1 loss-of-function variants increase ovarian cancer risk?
  rationale: >-
    Most case-control data do not support an ovarian association, and ClinGen curated BARD1 and familial ovarian cancer (MONDO:0016248) as a separate gene-disease pair classified Disputed. One study (Norquist 2016) reported BARD1 variants as more common in ovarian carcinoma than in population databases, cautioning that two of its BARD1 carriers also carried BRCA1 variants. Ovarian cancer is therefore not recorded as a phenotype of this entry.
  evidence:
  - reference: CGGV:assertion_02af8326-360e-4f42-a378-fefff7387d97-2024-08-29T170000.000Z
    reference_title: BARD1 / familial ovarian cancer (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: "In summary, the evidence supporting the relationship between BARD1 and autosomal dominant hereditary ovarian cancer has been disputed and no valid evidence remains to support the claim."
    explanation: ClinGen's separate ovarian curation disputes the association.
  - reference: PMID:32679805
    reference_title: Summary of BARD1 Mutations and Precise Estimation of Breast and Ovarian Cancer Risks Associated with the Mutations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "but not an OC risk gene (OR = 1.36, 95% CIs:0.87-2.11, p = 0.1733)"
    explanation: Pooled analysis of about 20,800 ovarian cancer cases against gnomAD controls found no significant ovarian association.
  - reference: PMID:26315354
    reference_title: "Germline Mutations in the BRIP1, BARD1, PALB2, and NBN Genes in Women With Ovarian Cancer."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "but no differences for BARD1 (P = .39)"
    explanation: Case-control sequencing of invasive epithelial ovarian cancer found no difference in BARD1 deleterious-variant frequency between cases and controls.
  - reference: PMID:31036035
    reference_title: Germline loss-of-function variants in the BARD1 gene are associated with early-onset familial breast cancer but not ovarian cancer.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Neither LoF variants nor predicted damaging rare missense variants in BARD1 were identified in 451 familial index patients with OC."
    explanation: No carriers among familial ovarian cancer index patients in GC-HBOC.
  - reference: PMID:26720728
    reference_title: Inherited Mutations in Women With Ovarian Carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BARD1 mutations were rare in OC patients, but significantly more common than in the general population, leading to wide confidence intervals for the generated odds ratio for OC (Table 2)."
    explanation: The one study reporting an ovarian enrichment, against population databases rather than matched controls.
  - reference: PMID:26720728
    reference_title: Inherited Mutations in Women With Ovarian Carcinoma.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These results are interpreted with some caution as two of the BARD1 mutation carriers also had mutations in BRCA1 (eTable1)."
    explanation: The same study notes that two of its BARD1 carriers also carried BRCA1 variants, weakening its own ovarian signal.
- discussion_id: bard1_neuroblastoma_common_vs_rare
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Neuroblastoma
  prompt: How large is the neuroblastoma risk for a heterozygous BARD1 loss-of-function carrier, and should carriers be surveilled in childhood?
  rationale: >-
    Two signals must be kept apart. Common BARD1 polymorphisms at 2q35 are associated with high-risk neuroblastoma in GWAS; this is polygenic susceptibility, not this Mendelian entity. Separately, rare germline pathogenic or likely pathogenic BARD1 variants and BARD1-disrupting copy-number variants are enriched in neuroblastoma patients, and ClinGen lumps neuroblastoma into this entity on that case-control evidence. The case-control odds ratios are wide (OR 32.30, 95% CI 6.44 to 310.35 in 786 patients; OR 6.3, 95% CI 2.4 to 13.9 in a pediatric pan-cancer analysis whose cohort overlap with the first study was not assessed here). Absolute childhood penetrance is not reported in these sources, and no source used here gives a neuroblastoma surveillance recommendation for carrier children.
  evidence:
  - reference: PMID:19412175
    reference_title: Common variations in BARD1 influence susceptibility to high-risk neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data show that common variation in BARD1 contributes to the etiology of the aggressive and most clinically relevant subset of human neuroblastoma."
    explanation: The GWAS signal concerns common variants and is outside this Mendelian entity.
  - reference: PMID:38411636
    reference_title: "Adult-Onset Cancer Predisposition Syndromes in Children and Adolescents-To Test or not to Test?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The best-studied examples include heterozygous PVs in mismatch repair genes associated with Lynch syndrome in children with mismatch repair deficient high-grade glioma, heterozygous PVs in BARD1 in childhood neuroblastoma, and heterozygous PVs in BRCA2 in children with rhabdomyosarcoma."
    explanation: Review framing of BARD1 as an adult-onset predisposition gene with a pediatric tumor association, which leaves testing and surveillance of children an open question.
- discussion_id: bard1_biallelic_phenotype_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - inheritance#Autosomal dominant
  prompt: Is there a constitutional biallelic BARD1 phenotype in humans?
  rationale: >-
    Bard1-null mice die between E7.5 and E8.5, and a 2022 review states that BARD1 is not a classic Fanconi anemia gene. A PubMed search, BARD1[ti] AND (biallelic[tiab] OR homozygous[tiab] OR compound heterozygous[tiab]), returned six records, none of which describes a person with constitutional biallelic BARD1 variants. Whether biallelic loss is compatible with human development, and with what phenotype, is unknown.
  evidence:
  - reference: PMID:12832489
    reference_title: "Loss of Bard1, the heterodimeric partner of the Brca1 tumor suppressor, results in early embryonic lethality and chromosomal instability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice become developmentally retarded and die between embryonic day 7.5 (E7.5) and E8.5."
    explanation: Constitutional Bard1 nullizygosity is early embryonic lethal in mice.
  - reference: PMID:35772246
    reference_title: "Moderate penetrance genes complicate genetic testing for breast cancer diagnosis: ATM, CHEK2, BARD1 and RAD51D."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No data are available regarding reproductive implications. BARD1 is not a classic FA gene."
    explanation: Review statement that no biallelic Fanconi-like syndrome is established for BARD1.
phenotypes:
- category: Neoplastic
  name: Breast carcinoma
  description: >-
    Female breast cancer is the established manifestation, at moderate risk. In BCAC (protein-truncating variants) the overall odds ratio in population-based studies was 2.09 (95% CI 1.35 to 3.23), with estimated absolute risk by age 80 in the 17 to 30% moderate-risk range; in the population-based CARRIERS study the overall odds ratio was 1.37 (95% CI 0.87 to 2.16), not significant. Both consortia found stronger associations with estrogen-receptor-negative disease. In familial German index patients, carriers were diagnosed younger (mean 42.3 years) and the association was not significant at age 50 or older.
  phenotype_term:
    preferred_term: Breast carcinoma, enriched for estrogen-receptor-negative and triple-negative subtypes
    term:
      id: HP:0003002
      label: Breast carcinoma
  evidence:

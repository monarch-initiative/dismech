      snippet: "BARD1 loss-of-function variant isogenic cells exhibited reduced efficiency in repairing Cas9-induced DNA damage, ineffective RAD51 focus formation at DNA double-strand break sites"
      explanation: Heterozygous engineered cells directly link a single germline-type allele to defective RAD51-dependent repair.
- name: Somatic BARD1 Second-Hit Inactivation
  description: >-
    Loss of the wild-type BARD1 allele is documented in a subset of carrier tumors but has not been shown to be universal. In a French case-control study, two of seven interpretable carrier breast tumors (both triple-negative primaries) showed loss of heterozygosity with an HRD phenotype, a metastasis showed LOH without HRD, and non-triple-negative primaries had neither. In a child with a germline BARD1 frameshift and refractory neuroblastoma, mono-allelic expression of the variant and loss of BARD1 protein on immunohistochemistry indicated biallelic loss in the tumor.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  conforms_to: "germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type Allele"
  evidence:
  - reference: PMID:42496958
    reference_title: "BARD1 and breast cancer genetic predisposition: case-control study and HRD signature analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among these, two triple-negative (TN) primary tumors exhibited both biallelic BARD1 inactivation via loss of heterozygosity (LOH) and an HRD phenotype; one metastasis displayed LOH without HRD. All non-TN primary tumors lacked both biallelic inactivation and HRD."
    explanation: Tumor analysis of carrier breast cancers shows the second hit in triple-negative primaries and its absence in non-triple-negative primaries; seven tumors only.
  - reference: PMID:39141861
    reference_title: Response to PARP Inhibition in BARD1-Mutated Refractory Neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemical staining of serial BM samples, obtained before talazoparib administration, confirmed somatic BARD1 protein loss"
    explanation: Single pediatric case documenting tumor-restricted loss of BARD1 protein in a germline heterozygote.

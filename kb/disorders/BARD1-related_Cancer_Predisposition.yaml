diagnosis:
- name: Germline molecular diagnosis
  description: >-
    Identification of a heterozygous pathogenic or likely pathogenic germline BARD1 variant, usually on a hereditary breast cancer multigene panel; BARD1 variants are also found through paired tumor-normal sequencing of children with neuroblastoma. Missense variants of uncertain significance are common and can be informed by functional HDR assays.
  evidence:
  - reference: PMID:42496958
    reference_title: "BARD1 and breast cancer genetic predisposition: case-control study and HRD signature analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a strong enrichment of BARD1 gPV among women selected for personal and family history of breast cancer, reinforcing their relevance for genetic testing for suspected hereditary predisposition."
    explanation: Supports inclusion of BARD1 in hereditary breast cancer panel testing.
  - reference: PMID:39141861
    reference_title: Response to PARP Inhibition in BARD1-Mutated Refractory Neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paired tumor-normal whole-exome analysis identified a pathogenic germline heterozygous frameshift in BARD1, but no other known driver variants"
    explanation: Paired tumor-normal sequencing in pediatric oncology is a second ascertainment route.
treatments:
- name: Breast cancer surveillance
  description: >-
    A 2022 review table adapted from NCCN v2.2022 lists annual mammography (tomosynthesis) and contrast-enhanced breast MRI starting at age 40, and states that evidence is insufficient for risk-reducing mastectomy, which is managed by family history. The primary GC-HBOC study recommends intensified surveillance on the basis of its early-onset association. Current NCCN text was not checked directly for this entry.
  treatment_term:
    preferred_term: breast cancer screening with mammography and breast MRI
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:35772246
    reference_title: "Moderate penetrance genes complicate genetic testing for breast cancer diagnosis: ATM, CHEK2, BARD1 and RAD51D."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BARD1 | ● Limited emerging evidence to suggest increased risk of female BC (with predisposition to triple negative) ● Unknown or Insufficient evidence for OC or other cancers risk | ● RRM: evidence insufficient, manage based on family history ● Screening: annual mammogram (tomosythesis) and breast MRI with contrast starting at age 40"
    explanation: Review table reproducing NCCN v2.2022 management for BARD1, including the absence of an ovarian or other-cancer recommendation.
  - reference: PMID:31036035
    reference_title: Germline loss-of-function variants in the BARD1 gene are associated with early-onset familial breast cancer but not ovarian cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to the significant association of germline LoF variants in BARD1 with early-onset BC, we suggest that intensified BC surveillance programs should be offered to women carrying pathogenic BARD1 gene variants."
    explanation: Primary-study recommendation for surveillance in carriers.
  target_mechanisms:
  - target: Breast carcinoma
    description: Surveillance detects breast cancer earlier; it does not modify the underlying mechanism.
- name: Genetic counseling and cascade testing
  description: >-
    Counseling covers the moderate breast cancer risk, the disputed ovarian association, and the pediatric neuroblastoma association, for which no surveillance recommendation is given in the sources used here. Testing minors for an adult-onset predisposition gene with a pediatric tumor association is an open question.
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38411636
    reference_title: "Adult-Onset Cancer Predisposition Syndromes in Children and Adolescents-To Test or not to Test?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Examples include heterozygous PVs in BRCA1, RAD51C or BARD1 in childhood neuroblastoma"
    explanation: Review placing BARD1 among adult-onset predisposition genes found in children with cancer, relevant to pediatric counseling.
- name: Talazoparib in BARD1-associated refractory neuroblastoma
  description: >-
    One child with a germline BARD1 frameshift, somatic BARD1 protein loss and refractory high-risk neuroblastoma had a complete bone-marrow response to talazoparib plus irinotecan and remained without clinical evidence of disease 32 months off therapy. This is a single case report plus preclinical data, not an established indication.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: PARP inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: talazoparib
      term:
        id: CHEBI:231344
        label: talazoparib
  evidence:
  - reference: PMID:39141861
    reference_title: Response to PARP Inhibition in BARD1-Mutated Refractory Neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first response of a child with neuroblastoma and a BARD1 germline mutation to a PARPi."
    explanation: Single pediatric case report of response.
  - reference: PMID:39141861
    reference_title: Response to PARP Inhibition in BARD1-Mutated Refractory Neuroblastoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient is 32 months off therapy with no clinical evidence of disease"
    explanation: Durability in the single reported case.
  target_mechanisms:
  - target: PARP-Inhibitor and Platinum Sensitivity
    description: Exploits the homologous-recombination defect of BARD1-deficient tumor cells.
animal_models:
- name: Mammary-conditional Bard1 knockout mouse
  species: Mus musculus
  genotype: Conditional Bard1 alleles inactivated by Cre in mammary epithelial cells
  publication: PMID:18443292
  description: >-
    Mammary-specific Bard1 inactivation produced carcinomas indistinguishable from conditional Brca1 and double-mutant tumors in frequency, latency, histopathology and cytogenetics. The tumors were triple-negative and basal-like. The model is biallelic and tissue-restricted, not a heterozygous germline model.
  evidence:
  - reference: PMID:18443292
    reference_title: The basal-like mammary carcinomas induced by Brca1 or Bard1 inactivation implicate the BRCA1/BARD1 heterodimer in tumor suppression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Significantly, the conditional Bard1- and Brca1-mutant mice developed breast carcinomas that are indistinguishable from each other (and from those of double conditional Bard1/Brca1-mutant animals) with respect to their frequency, latency, histopathology, and cytogenetic features."
    explanation: Equivalence of Bard1 and Brca1 tumors supports a heterodimer-mediated tumor-suppressor function.
  modeled_mechanisms:
  - target: Genomic Instability and Homologous-Recombination Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces chromosomally unstable triple-negative mammary carcinoma after Bard1 loss.
    limitations: Biallelic conditional deletion in mammary epithelium; does not model the heterozygous germline state or the neuroblastoma association.
    evidence:
    - reference: PMID:18443292
      reference_title: The basal-like mammary carcinomas induced by Brca1 or Bard1 inactivation implicate the BRCA1/BARD1 heterodimer in tumor suppression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "They also express basal cytokeratins CK5 and CK14, have an elevated frequency of p53 lesions, and display high levels of chromosomal instability."
      explanation: Tumor cytogenetics show chromosomal instability.
- name: Bard1-null mouse
  species: Mus musculus
  genotype: Bard1 homozygous null
  publication: PMID:12832489
  description: >-
    Constitutional Bard1 nullizygosity is lethal between E7.5 and E8.5 owing to impaired proliferation, partly ameliorated by p53 loss; mutant cells are aneuploid.
  evidence:
  - reference: PMID:12832489
    reference_title: "Loss of Bard1, the heterodimeric partner of the Brca1 tumor suppressor, results in early embryonic lethality and chromosomal instability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The striking similarities between the phenotypes of Bard1-null, Brca1-null, and double Bard1; Brca1-null mice provide strong genetic evidence that the developmental functions of Brca1 and Bard1 are mediated by the Brca1/Bard1 heterodimer."
    explanation: Genetic evidence that Bard1 acts through the Brca1/Bard1 heterodimer.
  modeled_mechanisms:
  - target: Germline BARD1 Loss of Function
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: Complete constitutional loss of Bard1.
    limitations: Homozygous null and embryonic lethal; informs gene function, not the heterozygous human cancer predisposition.
    evidence:
    - reference: PMID:12832489
      reference_title: "Loss of Bard1, the heterodimeric partner of the Brca1 tumor suppressor, results in early embryonic lethality and chromosomal instability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To explore the genetic relationship between BRCA1 and BARD1, we have examined the phenotype of Bard1-null mice."
      explanation: The model removes Bard1 entirely.

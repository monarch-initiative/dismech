    reference_title: BARD1 / BARD1-related cancer predisposition (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BARD1-related cancer predisposition is characterized by a susceptibility to breast cancer with emerging evidence suggesting the association of other cancer types including neuroblastoma."
    explanation: ClinGen names breast cancer as the defining manifestation of this entity.
  - reference: PMID:33471991
    reference_title: "Breast Cancer Risk Genes - Association Analysis in More than 113,000 Women."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BARD1 (odds ratio, 2.09; 95% CI, 1.35 to 3.23; P = 0.00098 [P = 0.00011 in all studies])"
    explanation: BCAC overall breast cancer odds ratio for protein-truncating BARD1 variants in population-based studies.

      label: BARD1
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic alleles are mainly truncating, splice and copy-number variants; some missense variants in the ankyrin-repeat and BRCT domains are non-functional in homology-directed-repair assays. Carrier frequency among CARRIERS population-based controls was 35 of 32,544 (0.11%). ClinGen separately classifies BARD1 and familial ovarian cancer (MONDO:0016248) as Disputed; that tier is not recorded here because it concerns a different disease.

      Two compound heterozygous VUSs (one paternally inherited—c.1118T>A p.(Val373Asp) and a maternally inherited—c.2015C>T p.(Thr672Met)) were identified within the EXT2 gene.
    explanation: >-
      This is the initial sequencing classification in the Gupta report; its final Discussion reclassifies the pair as likely pathogenic rather than leaving the initial VUS wording as the final conclusion.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT

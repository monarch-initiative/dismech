  notes: >-
    The established families reviewed here carried biallelic missense genotypes: a homozygous complex p.Met87Arg/p.Arg95Cys allele, homozygous p.Ser4Leu, compound p.Asp227Asn/p.Tyr608Cys, and compound p.Val373Asp/p.Thr672Met. The first pair comprises two substitutions in cis on each homolog, not two separate alleles in trans. Assays of that complex allele do not establish the functional effect of every later allele.


    The Gupta report initially returned the EXT2 pair as VUSs in a gene of uncertain significance, then concluded they were likely pathogenic under ACMG/AMP criteria using segregation, biochemical and emerging gene-phenotype evidence. Both affected twins also had the same monoallelic NDST1 p.Arg454Cys VUS. The proposed modifier effect was unproven; neuronal potassium-channel antibodies only in the proband were another possible contributor to discordance.


    A 2021 skeletal-dysplasia cohort reported nonsense p.Trp79Ter and splice-site c.1404+2T>C EXT2 variants in trans in a possible AREXT2 case. The authors explicitly retained diagnostic uncertainty and requested functional work. This does not establish a new definitive null/null subtype or justify excluding all non-missense candidates.

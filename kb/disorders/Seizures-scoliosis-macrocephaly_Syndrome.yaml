    - reference: PMID:38803636
      reference_title: 'Identification and treatment of intestinal malrotation with midgut volvulus in childhood: a multicenter retrospective study.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Abnormal midgut fixation leads to a short mesenteric attachment, which makes the midgut prone to twisting (volvulus) around the SMA and SMV
      explanation: >-

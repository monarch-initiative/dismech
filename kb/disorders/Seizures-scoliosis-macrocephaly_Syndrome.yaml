animal_models:
- name: Ext2-null mouse
  species: Mouse
  genotype: Ext2 homozygous null (gene targeting)
  publication: PMID:16236767
  description: >-
    The Ext2 knockout mouse, generated to study hereditary multiple exostoses.
    Homozygous embryos are growth arrested by embryonic day 6.0 and never
    gastrulate. This is the only Ext2 mouse reported, and it models the dominant
    disease through its heterozygotes rather than this one through its
    homozygotes.
  modeled_mechanisms:
  - target: Biallelic Hypomorphic EXT2 Missense Variants
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A biallelic null is not the human genotype. Human patients carry biallelic
      missense alleles that lower EXT2 abundance without abolishing it; the
      mouse abolishes it, and the embryo dies before any organ this disorder
      affects has formed.
    limitations: >-
      Homozygous mutant embryos arrest at embryonic day 6.0 and fail to
      gastrulate, so no neurological, skeletal, craniofacial or renal phenotype
      can be assessed. Nothing in this model corresponds to the human
      neurodevelopmental syndrome. The heterozygous arm of the same mouse - one
      third of which develop ectopic bone growths, and all of which show
      abnormal cartilage differentiation - models hereditary multiple exostoses,
      the dominant EXT2 disease, and is not evidence about this disorder. No
      hypomorphic Ext2 mouse carrying a patient missense allele has been
      reported, so the human genotype has never been modelled in an animal.
    evidence:
    - reference: PMID:16236767
      reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mutant embryos developed normally until embryonic day 6.0, when they became growth arrested and failed to gastrulate, pointing to the early essential role for heparan sulfate in developing embryos.
      explanation: >-
        The gastrulation arrest that makes the biallelic null mouse unusable as
        a model of this disorder, and that explains why every human allele
        reported is hypomorphic.
    - reference: PMID:16236767
      reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Heterozygotes had a normal lifespan and were fertile; however, analysis of their skeletons showed that about one-third of the animals formed one or more ectopic bone growths (exostoses).
      explanation: >-
        The heterozygous phenotype, recorded here to mark it explicitly as the
        dominant disease's model rather than this disorder's.
discussions:
- discussion_id: mismatch_ssms_no_hypomorphic_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Can any existing model system be used to study this disorder, given that the
    only Ext2 mouse is a null that dies at gastrulation and that the human
    disease is caused by partial loss?
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic EXT2 Missense Variants
  - pathophysiology#Neurodevelopmental Impairment and Epilepsy
  rationale: >-
    The gene has one mouse model and it answers a different question. Homozygous
    Ext2-null embryos arrest at embryonic day 6.0, before the brain, skeleton or
    kidney exists, so the model cannot show anything about a disorder defined by
    seizures, intellectual disability, scoliosis and renal dysfunction. The
    heterozygous arm of the same mouse is informative, but about hereditary
    multiple exostoses. The human alleles are missense and hypomorphic, and the
    one experiment done on them - reconstruction in vitro, showing reduced EXT2
    abundance for each substitution and a greater reduction for both - measures
    protein level, not a physiological consequence. No animal carrying a patient
    allele has been reported, and no cellular model beyond patient fibroblasts
    has been used. The mismatch is not that the mouse gives a misleading answer;
    it is that the mouse cannot be asked the question, and that the gap has not
    been filled by anything else.
  evidence:
  - reference: PMID:16236767
    reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mutant embryos developed normally until embryonic day 6.0, when they became growth arrested and failed to gastrulate, pointing to the early essential role for heparan sulfate in developing embryos.
    explanation: >-
      The developmental arrest that puts every organ of interest out of reach in
      the only available biallelic model.
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We also performed an in vitro assay to determine which mutation has a larger effect on protein expression and observed reduced EXT2 expression in constructs expressing either one of the mutations but a greater reduction when both residues were mutated.
    explanation: >-
      The extent of functional work done on the human alleles, which is a
      protein-abundance measurement rather than a physiological one.
- discussion_id: gap_ssms_dominant_recessive_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What decides whether an EXT2 genotype produces hereditary multiple
    exostoses, this recessive neurodevelopmental syndrome, or both at once?
  attaches_to:
  - genetic#EXT2
  - phenotypes#Multiple exostoses
  - pathophysiology#Systemic Heparan Sulfate Proteoglycan Deficiency
  rationale: >-
    The textbook answer is allele dose: one null allele gives exostoses, two
    hypomorphic alleles give the neurodevelopmental syndrome. The third reported
    recessive family breaks it. Those patients had biallelic missense variants
    and the neurodevelopmental phenotype, and they also developed multiple
    exostoses, which the earlier families did not. Their authors read this as a
    possible genotype-phenotype correlation within the recessive disorder,
    implying that some hypomorphic combinations reach the threshold for
    exostoses and others do not - but with three families there is no way to
    test that. A related unknown sits underneath it: which of the many
    heparan-sulfate-dependent pathways carries each clinical feature is not
    known for any of them, so there is no mechanistic account that would predict
    where the threshold should be. The practical consequence is that absence of
    exostoses cannot be used to rule this disorder in, and their presence cannot
    be used to rule it out.
  evidence:
  - reference: PMID:30288735
    reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our finding expands the clinical and molecular spectrum of the AREXT2 syndrome and suggests a possible genotype/phenotype correlation in the development of the exostoses.
    explanation: >-
      The authors' own hypothesis about the boundary, stated as a suggestion.
  - reference: PMID:30288735
    reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, our patients developed multiple exostoses, which were not observed in the previously described families.
    explanation: >-
      The observation that breaks the simple dose model.

genetic:
- name: EXT2
  association: Causal biallelic variant
  gene_term:
    preferred_term: EXT2
    term:
      id: hgnc:3513
      label: EXT2
  notes: >-
    EXT2 causes two different diseases by two different genetic mechanisms, and
    the literature is dominated by the other one. Heterozygous loss-of-function
    alleles cause autosomal dominant hereditary multiple exostoses; biallelic
    missense alleles cause this recessive neurodevelopmental syndrome. A
    citation about exostoses in a heterozygous carrier is evidence about the
    dominant disease and not about this one.

    Reported alleles here are p.Met87Arg with p.Arg95Cys (homozygous, defining
    family), p.Ser4Leu (homozygous), and p.Asp227Asn with p.Tyr608Cys (compound
    heterozygous, the family that also had exostoses). All are missense. No
    biallelic null genotype has been reported, and the Ext2-null mouse suggests
    why: complete loss of the enzyme arrests development at gastrulation.

    Expressivity is variable even within a genotype. In one family the proband's
    fraternal twin sister carried the same two compound heterozygous EXT2
    variants and was only mildly affected. That patient also carried a
    monoallelic NDST1 variant of uncertain significance, in a second
    heparan-sulfate gene, with no second NDST1 hit found; that variant is
    present in the mildly affected sister too, so it does not by itself explain
    the difference.
  evidence:
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EXT2 is implicated in the autosomal dominant disorder multiple Exostoses type 2 (MIM: 133701). Biallelic EXT2 mutations, however, have also been reported in four siblings born to consanguineous parents, manifesting scoliosis, seizures, and macrocephaly (MIM: 616682) without exostosis, following an autosomal recessive pattern of inheritance.1
    explanation: >-
      States the two-disease, two-mechanism structure of this gene explicitly,
      with both OMIM numbers.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the patient's fraternal twin sister who is mildly affected as compared to the proband, with some learning delays and speech concerns, was also found to have the two compound heterozygous EXT2 variants while the patient's unaffected brother was found to carry only the heterozygous paternally inherited EXT2 variant (Figure 1).
    explanation: >-
      Documents the within-genotype variability and confirms that the
      heterozygous sibling was unaffected.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, no second mutation was identified in this patient within this gene, and the deletion/duplication analysis for this gene yielded normal/negative results.
    explanation: >-
      Establishes that the NDST1 variant in that patient was monoallelic with no
      second hit, so the case is not a second-gene recessive disorder.

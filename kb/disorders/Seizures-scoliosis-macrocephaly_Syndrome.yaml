classifications:
  icimd_category:
  - classification_value: o_linked_protein_glycosylation
    notes: >-
      ICIMD disorders of O-linked protein glycosylation include glycosaminoglycan synthesis. EXT2 participates in HS biosynthesis on the O-linked proteoglycan linker. The classification follows the biosynthetic mechanism, not a claim that every measured fluid has low HS or that urinary HS excludes a mucopolysaccharidosis.
    evidence:
    - reference: PMID:30288735
      reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        AREXT2 syndrome can be considered as a multiorgan Congenital Disorder of Glycosylation caused by a significant, but non-lethal, decrease in EXT2 expression, thereby affecting the synthesis of the heparan sulfate proteoglycans, which is relevant in many physiological processes.
      explanation: >-
        The authors classify the disorder as a congenital disorder of glycosylation and propose a nonlethal partial-loss mechanism; this is disease interpretation rather than a directly measured clinical phenotype.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported AREXT2 families show biallelic inheritance, including homozygous complex alleles and compound heterozygous variants. Unaffected heterozygous relatives support recessive segregation for those alleles. A heterozygous EXT2 variant must be interpreted for its specific pathogenic mechanism; it is not automatically a dominant hereditary multiple exostoses diagnosis.
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In short, we have unravelled the genetic basis of a new recessive disorder, seizures-scoliosis-macrocephaly syndrome.
    explanation: >-
      The paper's own conclusion that the disorder is recessive.
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To confirm the autosomal-recessive mode of inheritance, all available family members were genotyped.
    explanation: >-

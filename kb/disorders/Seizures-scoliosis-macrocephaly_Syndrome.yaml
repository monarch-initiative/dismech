pathophysiology:
- name: Reduced EXT2 Protein Availability
  biological_scale: MOLECULAR
  description: >-
    The founding homozygous complex p.Met87Arg/p.Arg95Cys allele reduces EXT2 abundance in cultured patient fibroblasts and reconstructed COS-7/HEK293 cells. Each substitution contributes, with the larger effect from p.Arg95Cys and the greatest decrease when both are present. These protein-expression experiments do not establish an activity fraction for every AREXT2 allele.
  evidence:
  - reference: PMID:26246518
    reference_title: 'Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also performed an in vitro assay to determine which mutation has a larger effect on protein expression and observed reduced EXT2 expression in constructs expressing either one of the mutations but a greater reduction when both residues were mutated.
    explanation: >-
      Constructs carrying either substitution lowered protein abundance; the double-substitution construct lowered it further. These are substitutions on the same complex allele, and the assay does not directly quantify residual glycosyltransferase activity.
  - &id009
    reference: url:https://uwo.scholaris.ca/server/api/core/bitstreams/9c05addc-1235-4172-b033-10d272ebcc44/content
    reference_title: https://uwo.scholaris.ca/server/api/core/bitstreams/9c05addc-1235-4172-b033-10d272ebcc44/content
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed diminished EXT2 protein expression relative to a healthy EXT2-WT control (P<0.001)
    explanation: >-
      Farhan thesis chapter 3 reproduces the founding PMID:26246518 study, not an additional cohort. Cultured patient fibroblasts showed reduced EXT2 protein. This is an in-vitro patient-derived assay, not a tissue-wide concentration measurement.
  genes:

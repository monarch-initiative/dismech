biochemical:
- name: Heparan sulfate
  context: >-
    Heparan sulfate was measured during mucopolysaccharidosis screening in the Gupta proband. Serum was below the reported pediatric first percentile and the dried-blood-spot value equaled that percentile. The paper calls all three specimens low, but its urine value exceeds the table’s 99th percentile; urine direction therefore remains internally inconsistent.
  biomarker_term:
    preferred_term: heparan sulfate
    term:
      id: CHEBI:28815
      label: heparan sulfate
  presence: Abnormal
  notes: >-
    Reported values: dried blood spot 12 nmol/L, serum 4.46 ng/mL, urine 0.5 mg/mmol creatinine. Table 1 gives first percentiles of 12.0, 7.06 and 0.014 respectively, and a urine 99th percentile of 0.292 mg/mmol creatinine. The refreshed source cache now includes this table. Do not silently change the urine value, units or direction, and do not infer uniform tissue-wide depletion from these measurements.
  evidence:
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical screening for mucopolysaccharidoses was performed in view of the coarse facial features and revealed low levels of heparan sulfate in dried blood spot (12 nmol/L), serum (4.46 ng/mL), and urine (0.5 mg/mmol creatinine) specimens (Reference ranges given in Table 1).
    explanation: >-
      These are the authors’ reported values and low-level interpretation. Serum and dried-blood-spot comparisons support reduced/low-end values, but the urine interpretation conflicts with the source table, as recorded in the dedicated discussion.

- discussion_id: mismatch_arext2_neural_models
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Which aspects of the proposed HS-dependent neural-development pathway operate in human AREXT2, and which are allele- or species-specific?
  attaches_to:
  - pathophysiology#Disrupted HS-Dependent FGF and Wnt Signaling
  - pathophysiology#Altered Neural Patterning and Connectivity
  - phenotypes#Macrocephaly
  - phenotypes#Global developmental delay
  - phenotypes#Intellectual disability
  - phenotypes#Delayed speech and language development
  rationale: >-
    The founding authors explicitly use Ext-model neural-patterning and axon-guidance findings to explain developmental delay and macrocephaly, so qualified causal paths are represented. Zebrafish experiments establish Fgf/Wnt dependence, with selected Hh outcomes preserved; they do not directly assay human circuits, head growth or language. Mouse null embryonic arrest differs from viable patient complex alleles and does not establish human null lethality. Patient fibroblasts and variant reconstruction are informative proximal models, not evidence that no cellular model exists. The unresolved issue is translational fidelity and feature-specific mediation, not absence of a published hypothesis.
  evidence:
  - reference: url:https://uwo.scholaris.ca/server/api/core/bitstreams/9c05addc-1235-4172-b033-10d272ebcc44/content
    reference_title: https://uwo.scholaris.ca/server/api/core/bitstreams/9c05addc-1235-4172-b033-10d272ebcc44/content
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      these studies help explain why SSM patients are alive but have macrocephaly and are severely delayed in their developmental course.
    explanation: >-
      Farhan thesis chapter 3 reproduces the founding PMID:26246518 study, not an additional cohort. The authors explicitly connect the model-based neural-development explanation to macrocephaly and severe developmental delay in the founding family.
    directness: INDIRECT
  - reference: PMID:21892940
    reference_title: Zebrafish Ext2 is necessary for Fgf and Wnt signaling, but not for Hh signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, Hh dependent signaling is apparently unaffected in the ext2 mutants; Hh targeted gene expression is not reduced, the Hh inhibitor cyclopamine is not more affective in the mutants and Hh dependent cell differentiation in the retina and in the myotome are normal in ext2 mutants.
    explanation: >-
      Selected fish Hh assays were preserved; this constrains a universal morphogen-signaling claim without proving every Hh-dependent function normal.
  - reference: PMID:16236767
    reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mutant embryos developed normally until embryonic day 6.0, when they became growth arrested and failed to gastrulate, pointing to the early essential role for heparan sulfate in developing embryos.
    explanation: >-
      This documents mouse null-allele developmental arrest. It neither tests human biallelic null viability nor excludes partial mechanistic use of other Ext models.
- discussion_id: gap_arext2_seizure_types_and_tone
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which neural or neuromuscular processes explain seizure type, status susceptibility, hypotonia, tremor and gait abnormalities beyond the established EXT2 etiology?
  attaches_to:
  - phenotypes#Seizure
  - phenotypes#Focal-onset seizure
  - phenotypes#Bilateral tonic-clonic seizure with generalized onset
  - phenotypes#Status epilepticus
  - phenotypes#Hypotonia
  - phenotypes#Tremor
  - phenotypes#Broad-based gait
  rationale: >-
    The genetic cause of the defining seizure-developmental syndrome is retained, but the sources do not establish the circuit mechanisms selecting focal versus generalized seizures or progression to status. Status-associated brain injury explains a specific acquired motor deficit, not baseline hypotonia or the broad-based gait in a different sibling. Hypotonia is absent in the Gupta proband; central versus peripheral contributions were not resolved in the reviewed families. A coarse tremor lacks physiological classification, and a broad-based gait alone does not establish cerebellar degeneration. These are unresolved mediators/localizations rather than a requirement for complete pathway reconstruction.

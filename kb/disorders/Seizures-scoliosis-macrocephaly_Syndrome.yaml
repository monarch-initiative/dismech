      snippet: >-
        Features seen in all affected individuals include: moderate intellectual disability, seizure disorder with onset between two and five years of age, hypotonia, scoliosis, macrocephaly, coarse facies, bilateral cryptorchidism in males, long hypoplastic philtrum, and hypertelorism.
      explanation: >-
        Farhan thesis chapter 3 reproduces the founding PMID:26246518 study, not an additional cohort. The clinical spectrum establishes seizure disorder in all four individuals carrying the causal complex allele; it does not measure circuit function.
      directness: INDIRECT
- name: Reduced NDST1 Protein Stability
  biological_scale: MOLECULAR
  description: >-
    Absence of NDST1 protein despite preserved transcript in the founding patient fibroblasts suggests post-translational loss. Independent EXT2/NDST1 coexpression experiments show altered NDST1 abundance, glycosylation and HS sulfation, but do not identify the exact degradation or trafficking step in AREXT2.
  evidence:

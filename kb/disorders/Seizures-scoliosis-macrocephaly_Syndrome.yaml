notes: >-
  Two-arm gene, and the reason this entry exists. EXT2 is overwhelmingly known
  for autosomal dominant hereditary multiple exostoses, caused by
  haploinsufficiency for a null allele. This entry is the biallelic
  hypomorphic-missense disorder. Every citation was checked for which arm it
  describes. The one paper here that is substantially about the dominant arm,
  PMID:16236767, is used deliberately and only in two places: its homozygous-null
  gastrulation arrest, which is evidence about why human alleles must be
  hypomorphic and why no model of this disorder exists; and its heterozygous
  exostoses result, quoted inside the model's `limitations` for the express
  purpose of marking it as the other disease's evidence.

  Not curated from the EXT2 literature, deliberately: the zebrafish dackel
  (ext2) mutants, which have cartilage defects resembling hereditary multiple
  exostoses and were studied to explain that disease's aetiology; the
  osteochondroma-to-chondrosarcoma progression literature; and the EXT-carrier
  metabolic studies. All are about the dominant arm.

  Second-locus caution. One reported patient carried a monoallelic NDST1 variant
  of uncertain significance alongside the biallelic EXT2 variants. NDST1 acts on
  the same pathway and its biallelic loss causes a different recessive disorder.
  No second NDST1 hit was found, and the same NDST1 variant is present in that
  patient's mildly affected twin sister, so it is recorded in genetic.notes and
  in a differential rather than being folded into this disorder's mechanism.

  Head size is recorded as two separate phenotypes, Macrocephaly and
  Microcephaly, rather than as one averaged claim, because different families
  went in opposite directions and the syndrome name asserts only one of them.

  Evidence-source convention: patient clinical, genetic and biochemical findings
  HUMAN_CLINICAL; the variant reconstruction assay IN_VITRO; mouse
  MODEL_ORGANISM; background enzymology quoted from an introduction OTHER.

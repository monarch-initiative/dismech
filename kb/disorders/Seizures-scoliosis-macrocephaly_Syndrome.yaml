diagnosis:
- name: Exome sequencing with segregation analysis
  description: >-
    Exome sequencing and familial segregation established the reported biallelic EXT2 genotypes; autozygosity mapping was also used in the founding consanguineous family. Phase and allele-specific interpretation distinguish recessive AREXT2 from dominant hereditary multiple exostoses. The unaffected parents and heterozygous brother in the Gupta family demonstrate why a single familial EXT2 variant is not automatically a dominant exostosis genotype.
  results: Biallelic EXT2 variants interpreted with phenotype, segregation and variant-specific evidence.
  diagnosis_term:
    preferred_term: whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our application of autozygosity mapping and whole-exome sequencing allowed us to identify mutations in the patients.
    explanation: >-
      Documents the diagnostic route used in the defining family.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, the patient's fraternal twin sister who is mildly affected as compared to the proband, with some learning delays and speech concerns, was also found to have the two compound heterozygous EXT2 variants while the patient's unaffected brother was found to carry only the heterozygous paternally inherited EXT2 variant (Figure 1).
    explanation: >-
      The same EXT2 pair segregated to both affected twins, whereas the brother carrying only the paternal variant was clinically unaffected.
- name: Glycosaminoglycan measurement
  description: >-

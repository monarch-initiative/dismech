pathophysiology:
- name: Biallelic Hypomorphic EXT2 Missense Variants
  biological_scale: MOLECULAR
  description: >-
    Every family reported with this disorder carries EXT2 missense alleles on
    both chromosomes. In the defining family, patient cells showed reduced EXT2
    expression and function, and an in vitro reconstruction found each of the
    two substitutions lowered EXT2 abundance on its own, with a larger drop when
    both were present together. The allele class matters as much as the allele
    dose: the disorder is a partial-loss state, and a complete-loss state is not
    survivable, so a biallelic null genotype would not produce this phenotype.
  genes:
  - preferred_term: EXT2
    term:
      id: hgnc:3513
      label: EXT2
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two homozygous mutations p.Met87Arg and p.Arg95 Cys in exostosin 2, EXT2, a ubiquitously expressed gene that encodes a glycosyltransferase required for heparan sulfate synthesis.
    explanation: >-
      Identifies the defining genotype and names the enzymatic role of the gene.
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also performed an in vitro assay to determine which mutation has a larger effect on protein expression and observed reduced EXT2 expression in constructs expressing either one of the mutations but a greater reduction when both residues were mutated.
    explanation: >-
      The reconstruction experiment establishing that the alleles are
      hypomorphic and additive rather than null.
  downstream:
  - target: Reduced Heparan Sulfate Chain Polymerisation
    description: >-
      Less EXT2 protein with less activity means less of the glycosyltransferase
      that elongates the heparan sulfate chain.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26246518
      reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In patient cells, we observed diminished EXT2 expression and function.
      explanation: >-
        Measures the loss of both protein and activity in cells from affected
        individuals.
- name: Reduced Heparan Sulfate Chain Polymerisation
  biological_scale: MOLECULAR
  description: >-
    EXT2 is a Golgi glycosyltransferase of the exostosin family that carries out
    the chain-elongation step of heparan sulfate biosynthesis. Reduced but
    non-zero enzyme output shortens or reduces the heparan sulfate chains
    assembled on proteoglycan core proteins.
  cellular_components:
  - preferred_term: Golgi apparatus
    term:
      id: GO:0005794
      label: Golgi apparatus
  biological_processes:
  - preferred_term: heparan sulfate proteoglycan biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0015012
      label: heparan sulfate proteoglycan biosynthetic process
  evidence:
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      EXT2 belongs to the exostosin family of glycosyltransferases involved in the chain elongation step of heparan sulfate biosynthesis,2
    explanation: >-
      Names the specific enzymatic step this node describes.
  - reference: PMID:30288735
    reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AREXT2 syndrome can be considered as a multiorgan Congenital Disorder of Glycosylation caused by a significant, but non-lethal, decrease in EXT2 expression, thereby affecting the synthesis of the heparan sulfate proteoglycans, which is relevant in many physiological processes.
    explanation: >-
      States the significant-but-non-lethal reduction and its consequence for
      proteoglycan synthesis.
  downstream:
  - target: Systemic Heparan Sulfate Proteoglycan Deficiency
    description: >-
      Reduced chain synthesis lowers heparan sulfate throughout the body, which
      is measurable in blood and urine.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30997052
      reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Biochemical screening for mucopolysaccharidoses was performed in view of the coarse facial features and revealed low levels of heparan sulfate in dried blood spot (12 nmol/L), serum (4.46 ng/mL), and urine (0.5 mg/mmol creatinine) specimens (Reference ranges given in Table 1).
      explanation: >-
        Direct measurement of the systemic heparan sulfate deficit in a patient.
- name: Systemic Heparan Sulfate Proteoglycan Deficiency
  biological_scale: ORGANISM
  description: >-
    Heparan sulfate proteoglycans are structural components of the extracellular
    matrix and cell surface, and they act as co-receptors for a large number of
    growth factors and morphogens. A body-wide reduction in them is therefore a
    multi-system lesion rather than a tissue-specific one, and the disorder is
    described accordingly as a multiorgan congenital disorder of glycosylation.
    Which of the many heparan-sulfate-dependent pathways is responsible for any
    given clinical feature is not established.
  chemical_entities:
  - preferred_term: heparan sulfate
    modifier: DECREASED
    term:
      id: CHEBI:28815
      label: heparan sulfate
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Heparan sulfate proteoglycans are vital components of the extracellular matrix and are essential for cellular homeostasis.
    explanation: >-
      States the general role that makes a systemic deficit a multi-system
      lesion.
  downstream:
  - target: Neurodevelopmental Impairment and Epilepsy
    description: >-
      The neurological features are the most consistent part of the phenotype,
      but no specific heparan-sulfate-dependent pathway has been shown to
      mediate them.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26246518
      reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Many genes are involved in modulating heparan sulfate synthesis, and when these genes are mutated, they can give rise to early-onset developmental disorders affecting multiple body systems.
      explanation: >-
        Places the neurodevelopmental phenotype in the class of heparan-sulfate
        synthesis disorders without specifying an intermediate pathway, which is
        why this edge is indirect with unknown intermediates.
  - target: Skeletal and Craniofacial Dysmorphism
    description: >-
      The axial skeletal and facial features arise from the same systemic
      deficit, again without an identified intermediate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30288735
      reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        thereby affecting the synthesis of the heparan sulfate proteoglycans, which is relevant in many physiological processes
      explanation: >-
        The authors' own framing, which names many processes rather than an
        identified route to the skeletal phenotype.
- name: Neurodevelopmental Impairment and Epilepsy
  biological_scale: ORGANISM
  description: >-
    Seizures, intellectual disability, developmental delay and hypotonia are the
    most consistent features across the reported families. Developmental
    regression has been reported in more than one family. Seizure onset is
    variable, reported between two and five years in the earlier families and at
    ten years in a later patient.
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we describe a consanguineous family of four sibs with a novel disorder, which we designate as seizures-scoliosis-macrocephaly syndrome, characterised by seizures, intellectual disability, hypotonia, scoliosis, macrocephaly, hypertelorism and renal dysfunction.
    explanation: >-
      The defining feature list, of which the neurological components are the
      most consistent.
  - reference: PMID:30075207
    reference_title: A novel EXT2 mutation in a consanguineous family with severe developmental delay, microcephaly, seizures, feeding difficulties, and osteopenia extends the phenotypic spectrum of autosomal recessive EXT2-related syndrome (AREXT2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a consanguineous family where 2 boys presented with developmental delay, hypotonia, microcephaly, seizures, gastro-intestinal abnormalities, osteopenia, and neurological regression.
    explanation: >-
      Independent confirmation of the neurological core, and the report in which
      head size ran the other way.
- name: Skeletal and Craniofacial Dysmorphism
  biological_scale: ORGANISM
  description: >-
    Scoliosis and abnormal head size in the defining family, with hypertelorism
    and coarse facial features including a long hypoplastic philtrum. Osteopenia
    has been reported. None of these is invariant: the second family had
    microcephaly rather than macrocephaly, and a later patient had neither
    scoliosis nor hypotonia. Exostoses were absent in the defining family and
    are not a required feature, but they were present in the third family.
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we describe a consanguineous family of four sibs with a novel disorder, which we designate as seizures-scoliosis-macrocephaly syndrome, characterised by seizures, intellectual disability, hypotonia, scoliosis, macrocephaly, hypertelorism and renal dysfunction.
    explanation: >-
      The skeletal and craniofacial components of the defining feature list.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, skeletal issues such as scoliosis and decreased bone density and muscular issues such as hypotonia, observed with this disorder, were not observed in our patient.
    explanation: >-
      Records that the skeletal features are not invariant, which is why this
      node is described as variable.

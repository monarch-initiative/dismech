animal_models:
- name: Ext2-null mouse
  species: Mouse
  genotype: Homozygous Ext2-null and heterozygous littermate arms
  publication: PMID:16236767
  description: >-
    The homozygous-null arm arrests before gastrulation; the heterozygous arm survives with cartilage differentiation abnormalities and variably develops exostoses. The study was designed for HME, but its dosage/cartilage findings can inform a qualified shared EXT2 mechanism.
  modeled_mechanisms:
  - target: Reduced EXT2 Protein Availability
    relationship: FAILS_TO_RECAPITULATE
    description: >-
      Complete null loss differs from the residual-expression complex allele in the founding patients.
    limitations: >-
      Embryonic arrest prevents assessment of postnatal neural manifestations. This is a genotype and developmental-stage mismatch, not proof that no useful model exists.
    evidence:
    - reference: PMID:16236767
      reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Homozygous mutant embryos developed normally until embryonic day 6.0, when they became growth arrested and failed to gastrulate, pointing to the early essential role for heparan sulfate in developing embryos.
      explanation: >-
        This documents mouse null-allele developmental arrest. It neither tests human biallelic null viability nor excludes partial mechanistic use of other Ext models.
  - target: Abnormal Chondrocyte Differentiation
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      The heterozygous arm reproduces abnormal cartilage differentiation relevant to the proposed skeletal route.
    limitations: >-
      Single null-allele mice are not the same genotype as biallelic missense AREXT2 patients; the human cartilage intermediate has not been measured.
    evidence:
    - *id007
    readouts:
    - name: Disorganized chondrocytes and premature hypertrophy
      target: Abnormal Chondrocyte Differentiation
      direction: ALTERED
      description: >-
        Histological abnormalities in heterozygous mice.
      evidence:
      - reference: PMID:16236767
        reference_title: Mice deficient in Ext2 lack heparan sulfate and develop exostoses.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Significantly, all of the mice showed multiple abnormalities in cartilage differentiation, including disorganization of chondrocytes in long bones and premature hypertrophy in costochondral cartilage.
        explanation: >-
          This refers to heterozygous Ext2-null mice. It supports a partial-loss cartilage mechanism while differing from the human biallelic missense genotypes.
        directness: INDIRECT

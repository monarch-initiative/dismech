  - reference: PMID:30075207
    reference_title: A novel EXT2 mutation in a consanguineous family with severe developmental delay, microcephaly, seizures, feeding difficulties, and osteopenia extends the phenotypic spectrum of autosomal recessive EXT2-related syndrome (AREXT2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

classifications:
  icimd_category:
  - classification_value: o_linked_protein_glycosylation
    notes: >-
      ICIMD category 18 (disorders of O-linked protein glycosylation) explicitly
      subsumes glycosaminoglycan synthesis. EXT2 is the co-polymerase subunit
      that elongates the heparan sulfate chain on the O-linked tetrasaccharide
      linker, so this disorder belongs there. Deliberately not placed under
      glycosaminoglycan degradation: that category is the mucopolysaccharidoses,
      whose biochemical signature is the opposite of this disorder's. The
      distinction is clinically load-bearing here, because the coarse facies
      prompts mucopolysaccharidosis screening and the heparan sulfate result
      comes back low rather than high.
    evidence:
    - reference: PMID:30288735
      reference_title: "Novel exostosin-2 missense variants in a family with autosomal recessive exostosin-2-related syndrome: further evidences on the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        AREXT2 syndrome can be considered as a multiorgan Congenital Disorder of Glycosylation caused by a significant, but non-lethal, decrease in EXT2 expression, thereby affecting the synthesis of the heparan sulfate proteoglycans, which is relevant in many physiological processes.
      explanation: >-
        States both the classification as a congenital disorder of glycosylation
        and the partial-loss mechanism.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic EXT2 variants, homozygous in the consanguineous families and
    compound heterozygous elsewhere. Heterozygous carriers in these families are
    unaffected by the neurodevelopmental phenotype. This is the point at which
    the disorder is most often confused with hereditary multiple exostoses,
    which is dominant: a heterozygous EXT2 null allele causes that disease, not
    this one.
  evidence:
  - reference: PMID:26246518
    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To confirm the autosomal-recessive mode of inheritance, all available family members were genotyped.
    explanation: >-
      Documents the segregation analysis that established the recessive mode.
  - reference: PMID:30075207
    reference_title: A novel EXT2 mutation in a consanguineous family with severe developmental delay, microcephaly, seizures, feeding difficulties, and osteopenia extends the phenotypic spectrum of autosomal recessive EXT2-related syndrome (AREXT2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Segregation analysis by Sanger sequencing confirmed homozygous by descent autosomal recessive transmission of this mutation.
    explanation: >-
      Independent confirmation of recessive transmission in a second family.

differential_diagnoses:
- name: Hereditary multiple exostoses type 2
  description: >-
    Autosomal dominant EXT2-related hereditary multiple exostoses is an allelic disorder characterized by osteochondromas. Neurodevelopmental impairment is not its defining pattern. The presence of exostoses in the Gentile AREXT2 family means the skeletal finding alone does not distinguish the disorders; variant-specific mechanism, phase and the broader clinical phenotype are required.
  disease_term:
    preferred_term: exostoses, multiple, type 2
    term:
      id: MONDO:0007586
      label: exostoses, multiple, type 2
  distinguishing_features:
  - Dominant pathogenic EXT2 mechanism rather than the recessive family genotypes
  - Osteochondromas are central to the clinical presentation
  - A seizure-developmental syndrome prompts assessment for AREXT2 or an additional diagnosis
  evidence:
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous pathogenic variants within EXT2 are causative of an autosomal dominant disorder known as multiple Exostoses type 2 in which patients develop multiple benign (ie, non‐malignant) bone tumors called osteochondromas, not present in our patient.
    explanation: >-
      States the dominant disease, its allele dose, and its phenotype, and
      contrasts it with the recessive patient in the same sentence.
- name: Autosomal recessive intellectual disability type 46
  description: >-
    Biallelic NDST1 variants cause a distinct recessive intellectual-disability disorder affecting HS modification. Both Gupta twins carried a monoallelic NDST1 VUS alongside the EXT2 pair; a second NDST1 alteration was not identified and a modifier effect was not established.

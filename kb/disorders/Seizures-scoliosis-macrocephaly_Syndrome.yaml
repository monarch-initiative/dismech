  sequelae:
  - target: Gastroesophageal reflux
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Separation of the lower esophageal sphincter from the diaphragm can weaken the antireflux barrier. This supplies a plausible contribution from the documented hiatus hernia to II-1’s severe reflux. His hernia subtype, size and pressure dynamics were not measured, so the relation is qualified and does not explain reflux in siblings without documented hernia.
    evidence:
    - reference: PMID:16472589
      reference_title: Intermittent spatial separation of diaphragm and lower esophageal sphincter favors acidic and weakly acidic reflux.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        More reflux occurred when the LES and diaphragm were separated versus the reduced hernia state (23.1 +/- 5.1 vs 12.2 +/- 2.4 episodes per hour, respectively; P < .05).
      explanation: >-
        Within-subject high-resolution manometry and pH-impedance monitoring in 16 patients with small hiatal hernias associated the separated state with more reflux. AREXT2 patients were not studied; the numerical rates are not transferred to II-1.
      directness: INDIRECT

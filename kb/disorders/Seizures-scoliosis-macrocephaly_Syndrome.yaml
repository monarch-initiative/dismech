    reference_title: "Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein, we describe a consanguineous family of four sibs with a novel disorder, which we designate as seizures-scoliosis-macrocephaly syndrome, characterised by seizures, intellectual disability, hypotonia, scoliosis, macrocephaly, hypertelorism and renal dysfunction.
    explanation: >-

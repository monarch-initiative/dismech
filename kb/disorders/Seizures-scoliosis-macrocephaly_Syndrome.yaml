    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her fraternal twin sister has Asperger syndrome (diagnosed at 3 years of age), mild motor delays, and a history of cognitive and speech delays, which had improved over time.
    explanation: >-
      The narrative describes an autism-spectrum diagnosis in the milder twin, although Table 2 marks her Autism row negative. Preserve the stated diagnosis and this narrative/table terminology discrepancy.
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

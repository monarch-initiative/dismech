notes: >-
  The 2015 founding study and Farhan’s 2016 thesis chapter 3 describe the same four siblings and related experiments; the thesis is cited only for accessible full-text details and is not independent replication. Bare URL reference titles reproduce the fetcher metadata exactly. The full Gupta source was refreshed to include its tables. The complete El-Bazzal HAL PDF was visually reviewed, but its fetched text layer contains only the repository cover; that extraction limitation is not a biological knowledge gap. Gentile was assessed from its primary abstract and the Gupta comparison table; the later Sabir title-only record supplies no patient facts.


  The Falcon report was reviewed as navigation, with source checks correcting absence-of-exostoses claims, allele phase, family denominators, seizure/regression chronology and the urinary HS interpretation. An HME GeneReviews chapter was checked for its short AREXT2 allelic-disorder summary; its dominant-disease cohorts were not imported as AREXT2 evidence. Family counts and conflicting source timepoints are kept explicit rather than converted to population prevalence.


  Existing glycosylation classification is retained. The current Congenital_Disorders_of_Glycosylation grouping is explicitly restricted to protein N-glycosylation, and its sibling mechanism module centers on generalized client-protein hypoglycosylation. Neither is automatically instantiated by EXT2-dependent HS-chain synthesis, so no grouping/module conformance is added. Shared experimental mechanisms from Ext2 fish and mice are considered on biological relevance with explicit genotype/species limitations, rather than excluded solely because their original study concerned HME.


  Evidence grades distinguish human observations from cultured patient-cell assays, animal perturbations and author hypotheses. Assay readouts remain separate from clinical causal endpoints. The source-supported status-associated injury, motility/vomiting and reflux/ulceration relations are case scoped; they do not imply a complete gene-to-phenotype chain for every observation.


  Additional El-Bazzal body-only findings are preserved here because the fetched image-only manuscript cannot supply validated exact text: both brothers never walked or spoke, had axial hypotonia, large ears, dental decay and gingival hypertrophy; the younger had a single left transverse palmar crease, gastrostomy feeding and an infantile-spasm/West presentation. The article raises antiseizure treatment as a possible explanation for gingival hypertrophy. These visually reviewed observations are not replaced with unrelated or overly broad snippets; the extractability limitation does not establish a biological knowledge gap. Flat forehead is separately represented from the accessible Gupta comparison-table row summarizing these same brothers. Slightly elevated lactate and pyruvate are not labeled acidosis.


  The founding table records sensitive skin in all four siblings, without a sufficiently specific dermatological lesion to bind beyond the independently documented acne in Gupta. Reduced respiratory-chain assay activities in one founding patient did not establish a separate mitochondrial disease; negative genetic tests and the original diagnostic uncertainty are not converted into a mitochondrial causal pathway.


  General anatomical complication evidence is explicitly separate from syndrome membership: the pediatric malrotation surgical series and hiatal-hernia manometry study inform qualified local routes in the founding patients. Their cohorts and numerical rates are not imported as AREXT2 prevalence, and their measurements do not establish the anatomical intermediate in the individual AREXT2 case.

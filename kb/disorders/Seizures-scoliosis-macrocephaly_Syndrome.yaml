name: Seizures-scoliosis-macrocephaly syndrome
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- SSMS
- SSM syndrome
- seizures, scoliosis, and macrocephaly syndrome
- AREXT2
- autosomal recessive EXT2-related syndrome
description: >-
  Seizures-scoliosis-macrocephaly syndrome is the autosomal recessive disorder
  caused by biallelic hypomorphic EXT2 variants. It was defined in 2015 in four
  siblings of one consanguineous family who had seizures, intellectual
  disability, hypotonia, scoliosis, macrocephaly, hypertelorism and renal
  dysfunction, and specifically no exostoses. Later families led to the
  alternative name AREXT2, autosomal recessive EXT2-related syndrome, which is
  the more accurate label because the three eponymous features are not all
  constant: one family had microcephaly rather than macrocephaly, and another
  had no scoliosis.

  EXT2 is far better known for something else. Heterozygous loss-of-function
  EXT2 variants cause autosomal dominant hereditary multiple exostoses, and the
  overwhelming majority of the EXT2 literature is about that disease. The two
  disorders are separated by allele dose and by allele type, not by gene. The
  dominant disease is haploinsufficiency for a null allele. This disorder is
  biallelic missense: every reported family carries missense variants that
  reduce EXT2 abundance and activity without abolishing them. That the disorder
  is a partial-loss disease rather than a null disease is not incidental -
  Ext2-null mice arrest at gastrulation, so complete loss of heparan sulfate
  synthesis is not a survivable state.

  The boundary between the two disorders is nonetheless not a wall. The third
  reported AREXT2 family developed multiple exostoses in addition to the
  neurodevelopmental phenotype, which the authors read as a possible
  genotype-phenotype correlation within the recessive disorder rather than as a
  reclassification. Exostoses are therefore not a defining feature here, and
  their absence is not a diagnostic requirement.

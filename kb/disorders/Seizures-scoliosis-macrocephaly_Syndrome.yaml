  - *id002
  mechanism_confidence: PROVISIONAL
  downstream:
  - target: Impaired Heparan Sulfate Biosynthesis
    description: >-
      NDST1 loss is proposed to impair the sulfation component of HS biosynthesis, alongside reduced EXT2 polymerization capacity. The patient study did not directly assay sulfation; independent enzyme-expression perturbations establish that NDST1 abundance can change HS structure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18337501
      reference_title: Heparan sulfate biosynthesis enzymes EXT1 and EXT2 affect NDST1 expression and heparan sulfate sulfation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Whereas overexpression of EXT2 in HEK 293 cells enhanced NDST1 expression, increased NDST1 N-glycosylation, and resulted in elevated HS sulfation, overexpression of EXT1 had opposite effects.
      explanation: >-
        The intervention measured coordinated protein/glycosylation/sulfation changes. Its direction supports biochemical coupling, while the patient consequence remains an indirect inference rather than a measured reversal experiment.
      directness: INDIRECT
    - *id002
- name: Impaired Heparan Sulfate Biosynthesis
  biological_scale: MOLECULAR
  description: >-
    EXT1/EXT2 form the HS chain-polymerization machinery, with NDST1 contributing N-sulfation. AREXT2 is interpreted as impaired HS biosynthesis with residual function. Patient blood measurements provide limited biochemical support, but do not quantify tissue-wide polymer abundance, chain length or sulfation, and the urine interpretation conflicts with its reference table.
  evidence:
  - reference: PMID:18337501
    reference_title: Heparan sulfate biosynthesis enzymes EXT1 and EXT2 affect NDST1 expression and heparan sulfate sulfation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      During polymerization of the HS chain, carried out by a complex of the exostosin proteins EXT1 and EXT2, the first modification enzyme, glucosaminyl N-deacetylase/N-sulfotransferase (NDST), introduces N-sulfate groups into the growing polymer.
    explanation: >-
      Background biochemistry distinguishes chain polymerization from NDST-dependent modification.

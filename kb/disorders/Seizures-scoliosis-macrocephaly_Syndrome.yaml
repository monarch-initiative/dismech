name: Seizures-scoliosis-macrocephaly syndrome
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- SSMS
- SSM syndrome
- seizures, scoliosis, and macrocephaly syndrome
- AREXT2
- autosomal recessive EXT2-related syndrome
description: >-
  Seizures-scoliosis-macrocephaly syndrome, also called autosomal recessive EXT2-related syndrome (AREXT2), is a neurodevelopmental disorder associated with biallelic EXT2 variants. The original four siblings carried both p.Met87Arg and p.Arg95Cys in homozygous state on a complex allele. Subsequent families expanded the phenotype to microcephaly, variable scoliosis and multiple exostoses. Neither macrocephaly nor absence of exostoses is obligatory.


  Reduced EXT2 abundance and altered heparan-sulfate biosynthesis provide the supported molecular framework. Functional evidence is strongest for the original complex missense allele; it does not establish the residual activity of every reported variant. A later skeletal-dysplasia case had nonsense and splice-site variants in trans, but its AREXT2 attribution remained explicitly uncertain. Ext2-null mouse embryonic lethality is model evidence and does not prove that every human biallelic null genotype is lethal.


  Autosomal dominant hereditary multiple exostoses is an allelic disorder. Variant-specific mechanism, phase, segregation and clinical findings matter: the unaffected heterozygous relatives in AREXT2 families must not automatically be assigned a dominant exostosis genotype.

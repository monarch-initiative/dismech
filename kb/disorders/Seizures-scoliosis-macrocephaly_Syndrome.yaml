- discussion_id: gap_arext2_regression_behavior
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What explains early regression and behavioral variability when the same EXT2/NDST1 genotype occurs in twins with different severity?
  attaches_to:
  - phenotypes#Developmental regression
  - phenotypes#Autism
  - phenotypes#Aggressive behavior
  - phenotypes#Motor stereotypy
  - phenotypes#Sleep disturbance
  rationale: >-
    Gupta’s verbal/social regression at 27 months preceded seizures at ten years, so the seizure-injury route cannot explain that episode. The proband had voltage-gated potassium-channel antibodies and a reported transient immunotherapy response, but the study does not establish an autoimmune cause of the entire phenotype. Both twins carried the same EXT2 pair and monoallelic NDST1 VUS, making its proposed modifier effect unproven. Autism, aggression, rocking and nonspecific sleep difficulty are documented, but no experiment attributes each to a particular HS-dependent circuit. The twin’s narrative Asperger diagnosis and negative Autism table cell are preserved as a terminology inconsistency.
  evidence:
  - reference: PMID:30997052
    reference_title: Developmental delay, coarse facial features, and epilepsy in a patient with EXT2 gene variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental regression of verbal and social skills along with cognitive decline was reported at 27 months.
    explanation: >-
      This dates regression in the Gupta proband, whose seizures began at 10 years; the source does not establish seizures as the cause of this earlier decline.

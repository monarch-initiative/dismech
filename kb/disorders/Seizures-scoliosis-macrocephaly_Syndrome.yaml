      reference_title: 'Old gene, new phenotype: mutations in heparan sulfate synthesis enzyme, EXT2 leads to seizure and developmental disorder, no exostoses.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also performed an in vitro assay to determine which mutation has a larger effect on protein expression and observed reduced EXT2 expression in constructs expressing either one of the mutations but a greater reduction when both residues were mutated.
      explanation: >-
        Constructs carrying either substitution lowered protein abundance; the double-substitution construct lowered it further. These are substitutions on the same complex allele, and the assay does not directly quantify residual glycosyltransferase activity.

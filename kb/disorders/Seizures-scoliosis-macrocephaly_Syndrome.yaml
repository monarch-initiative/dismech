discussions:
- discussion_id: interpretation_arext2_hs_reference_conflict
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    How should the reported urinary HS result be interpreted when its value exceeds the paper’s own 99th-percentile reference boundary?
  attaches_to:
  - biochemical#Heparan sulfate
  - diagnosis#Glycosaminoglycan measurement
  - pathophysiology#Impaired Heparan Sulfate Biosynthesis
  rationale: >-
    Gupta reports dried-blood-spot HS 12 nmol/L, serum 4.46 ng/mL and urine 0.5 mg/mmol creatinine, calling all low. Table 1 instead gives first-percentile values 12.0, 7.06 and 0.014, and a urinary 99th percentile of 0.292. Serum is below its first percentile and dried blood spot equals it, but the stated urine value is above the 99th. The full source table was fetched and inspected; this is an internal value/interpretation conflict, not evidence that a cache is missing text. No number, unit or direction is silently repaired. These peripheral measures do not establish uniform tissue HS depletion.
  evidence:
  - reference: PMID:30997052

      label: mitochondrion organization
    modifier: ABNORMAL
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Neuronal Synaptic Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23685073
      reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
        dysfunction and impair parkin-dependent mitophagy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Drosophila deficient for dRad6 display defective synaptic function as a consequence of mitochondrial failure."
      explanation: Establishes synaptic dysfunction as the direct consequence of the
        mitochondrial failure caused by loss of the UBE2A orthologue.
- name: Neuronal Synaptic Dysfunction
  biological_scale: CELLULAR
  description: >
    The cellular consequence of mitochondrial failure in neurons is impaired
    synaptic function, shown directly in the dRad6-deficient Drosophila model

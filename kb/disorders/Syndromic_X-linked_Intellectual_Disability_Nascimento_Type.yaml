genetic:
- name: UBE2A
  association: Causative
  variant_origin: GERMLINE
  gene_term:
    preferred_term: UBE2A
    term:
      id: hgnc:12472
      label: UBE2A
  notes: >
    UBE2A (Xq24; also HR6A, RAD6A) encodes a ~152-amino-acid E2
    ubiquitin-conjugating enzyme, the human orthologue of yeast RAD6. The variant
    spectrum comprises intragenic point mutations (nonsense, missense at conserved
    residues, splice) and whole-gene or larger Xq24 microdeletions. Mechanism is
    loss of function. No ClinGen Gene-Disease Validity assertion is recorded here
    because none was retrieved; the gene-disease relationship rests on the primary
    literature cited below.
  evidence:
  - reference: PMID:16909393
    reference_title: UBE2A, which encodes a ubiquitin-conjugating enzyme, is mutated
      in a novel X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first description of a mutation in a ubiquitin-conjugating enzyme gene as the cause of a human disease."
    explanation: Gene-discovery report establishing UBE2A as the causative gene.
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked intellectual disability type Nascimento (MIM #300860), caused by mutations in UBE2A (MIM *312180)"
    explanation: Binds the named Nascimento-type entity to UBE2A.
variants:
- name: UBE2A Q128X
  description: >
    The nonsense allele (c.382C>T) identified in the founding two-generation
    family. It introduces a premature stop codon that removes the 25 C-terminal
    residues, whose importance for UBE2 function the original report infers from
    their conservation across vertebrates and Drosophila - the cleanest truncating
    end of the loss-of-function spectrum.
  gene:
    preferred_term: UBE2A
    term:
      id: hgnc:12472
      label: UBE2A
  type: NONSENSE
  evidence:
  - reference: PMID:16909393
    reference_title: UBE2A, which encodes a ubiquitin-conjugating enzyme, is mutated
      in a novel X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single-nucleotide substitution, c.382C-->T in UBE2A, led to a premature UAG stop codon (Q128X)."
    explanation: Documents the founding nonsense allele and its truncating consequence.
- name: UBE2A G23R
  description: >
    A missense allele affecting an evolutionarily conserved N-terminal residue,
    one of the variants that defined UBE2A deficiency as a clinically recognisable
    syndrome beyond the original truncating family.
  gene:
    preferred_term: UBE2A
    term:
      id: hgnc:12472
      label: UBE2A
  type: MISSENSE
  evidence:
  - reference: PMID:20412111
    reference_title: Novel missense mutations in the ubiquitination-related gene UBE2A
      cause a recognizable X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "screening several positional candidate genes revealed a G23R missense mutation in the UBE2A gene."
    explanation: Identifies the conserved N-terminal missense allele in an affected
      family.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  penetrance: COMPLETE
  description: >
    Hemizygous males carrying a pathogenic UBE2A allele are affected in all
    reported instances, while carrier females are typically unaffected and show
    completely skewed X-inactivation in blood - a pattern that should inform
    genetic counselling. Transmission is usually maternal; recurrence through
    maternal germline mosaicism is also documented, so a UBE2A variant absent from
    maternal blood does not exclude recurrence risk.
  evidence:
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all carrier females are unaffected and presented with a completely skewed X inactivation in blood"
    explanation: Establishes the X-linked recessive pattern with unaffected,
      skewed-XCI carrier females.
  - reference: PMID:29283210
    reference_title: 'UBE2A deficiency in two siblings: A novel splicing variant inherited
      from a maternal germline mosaicism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that the recurrent UBE2A deficiency observed in males of this family is caused by a maternal germline mosaicism."
    explanation: Documents maternal germline mosaicism as a recurrence mechanism, a
      counselling-relevant caveat to the recessive pattern.
diagnosis:
- name: UBE2A sequence analysis
  description: >
    Molecular confirmation in a male with the clinical phenotype rests on finding
    a hemizygous pathogenic UBE2A variant. Sequence analysis detects the
    intragenic nonsense, missense, frameshift and splice alleles; most reported
    probands carry such a point mutation. (No NCIT clinical-action term is bound
    here because the ones checked did not have a suitable label-matched entry in
    the diagnosis-term enum.)
  evidence:
  - reference: PMID:16909393
    reference_title: UBE2A, which encodes a ubiquitin-conjugating enzyme, is mutated
      in a novel X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A single-nucleotide substitution, c.382C-->T in UBE2A, led to a premature UAG stop codon (Q128X)."
    explanation: The founding diagnosis was made by sequence analysis identifying the
      intragenic point mutation.
- name: Chromosomal microarray / deletion analysis
  description: >
    Because UBE2A deletions and intragenic mutations occur at roughly equal
    frequency, a normal sequencing result does not exclude the diagnosis:
    chromosomal microarray or targeted deletion analysis is needed to detect the
    whole-gene and larger Xq24 deletions. Array design matters - some
    commercially available arrays have no or only terminal-exon coverage of
    UBE2A and would miss a small intragenic deletion, so a UBE2A-aware assay
    should be chosen.
  evidence:
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBE2A deletions and mutations seem to occur with an equal frequency."
    explanation: Establishes that deletion detection (microarray) is needed alongside
      sequencing because deletions account for about half of cases.
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "intragenic deletions as in family 1 would have been missed"
    explanation: Documents that array coverage of UBE2A varies and an unsuitable array
      can miss an intragenic deletion.

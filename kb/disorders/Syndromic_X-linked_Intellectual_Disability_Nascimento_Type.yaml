name: Syndromic X-linked Intellectual Disability Nascimento Type
creation_date: "2026-10-25T00:00:00Z"
category: Genetic
parents:
- Neurodevelopmental Disorder
- X-linked Disorder
disease_term:
  preferred_term: syndromic X-linked intellectual disability Nascimento type
  term:
    id: MONDO:0010461
    label: syndromic X-linked intellectual disability Nascimento type
synonyms:
- UBE2A deficiency syndrome
- X-linked intellectual disability-nail dystrophy-seizures syndrome
- intellectual developmental disorder, X-linked syndromic, Nascimento type
- Nascimento syndrome
- MRXSN
description: >
  Nascimento-type syndromic X-linked intellectual disability (also called UBE2A
  deficiency syndrome; MONDO:0010461; OMIM 300860) is a rare X-linked recessive
  neurodevelopmental disorder of hemizygous males caused by loss-of-function
  variants in, or deletions of, UBE2A at Xq24. UBE2A (HR6A) encodes an E2
  ubiquitin-conjugating enzyme (the human orthologue of yeast RAD6) that works
  with E3 ligases such as Parkin to ubiquitinate substrates in the
  ubiquitin-proteasome system; one well-characterised consequence of its loss is
  impaired Parkin-dependent clearance of dysfunctional mitochondria (mitophagy)
  in neurons. Affected males present with moderate to severe intellectual
  disability, impaired or absent speech, seizures, a recognisable craniofacial
  gestalt (synophrys, prominent supraorbital ridges, deep-set almond-shaped eyes,
  depressed nasal bridge, wide mouth), skin findings (generalised hirsutism,
  onychodystrophy), and genital anomalies including micropenis. Carrier females
  are typically unaffected with completely skewed X-inactivation.

  SCOPE NOTE — this entity is defined by germline UBE2A loss of function. It is
  distinct from the many other eponymous XLID types and should not be conflated
  with disorders of the paralogous ubiquitin-conjugating enzyme genes. Patients
  with larger Xq24 deletions encompassing neighbouring genes (notably SLC25A5)
  carry additional features such as ventricular septal defects that are not seen
  with intragenic UBE2A point mutations; those contiguous-gene features are
  recorded here as deletion-associated rather than as core UBE2A-intrinsic
  phenotypes.

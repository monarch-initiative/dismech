    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Impaired mGluR-Dependent Long-Term Depression
    causal_link_type: DIRECT
- name: Impaired mGluR-Dependent Long-Term Depression
  biological_scale: CELLULAR
  description: >
    In the Ube2a-knockout mouse the specific synaptic-plasticity lesion is a small
    but significant impairment of mGluR-dependent long-term depression, a form of
    plasticity repeatedly implicated in neurodevelopmental disorders. This is the
    cellular correlate of the cognitive phenotype.
  biological_processes:

notes: >
  GeneReviews baseline: searched PubMed with the `[book]` field
  (`UBE2A[TI] AND genereviews[book]`, `Nascimento[TI] AND genereviews[book]`,
  and `(intellectual disability) AND genereviews[book] AND UBE2A`) on 2026-10-25
  and ran `just check-genereviews` against the committed Bookshelf index. No
  GeneReviews chapter exists for UBE2A deficiency syndrome / X-linked
  intellectual disability type Nascimento. In the absence of a GeneReviews
  baseline the phenotype list is anchored on the original gene-discovery report
  (PMID:16909393) and the two largest clinical delineations (PMID:21108393,
  PMID:24053514); the Czeschik series (PMID:24053514) supplies the Table 2
  frequencies, including the heart-defect gradient across deletion and intragenic
  alleles.
pathophysiology:
- name: UBE2A Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >
    A hemizygous loss-of-function lesion in UBE2A (Xq24) is the initiating event.
    Reported alleles span nonsense and frameshift mutations, missense variants at
    evolutionarily conserved residues, splice variants, and whole-gene or larger
    Xq24 deletions. The founding family carried the nonsense allele Q128X
    (c.382C>T), which removes the 25 C-terminal residues; their importance for
    UBE2 function is inferred from their conservation across vertebrates and
    Drosophila. Recognisable missense alleles such as G23R affect the conserved
    N-terminus. Both truncating and missense alleles converge on reduced or
    abolished ubiquitin-conjugating activity, i.e. a loss-of-function mechanism.
  molecular_functions:
  - preferred_term: ubiquitin conjugating enzyme activity
    modifier: DECREASED
    term:
      id: GO:0061631
      label: ubiquitin conjugating enzyme activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HEMIZYGOUS
    genes:
    - preferred_term: UBE2A
      term:
        id: hgnc:12472
        label: UBE2A
  downstream:
  - target: Impaired Ubiquitin-Conjugating (E2) Enzyme Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16909393
      reference_title: UBE2A, which encodes a ubiquitin-conjugating enzyme, is mutated
        in a novel X-linked mental retardation syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "As a consequence, the predicted polypeptide lacks the 25 C-terminal amino acid residues."
      explanation: The disease-defining truncation removes the C-terminal residues
        whose importance for UBE2 function the source infers from their cross-species
        conservation; reduced enzyme activity is inferred rather than directly assayed.
  evidence:
  - reference: PMID:16909393
    reference_title: UBE2A, which encodes a ubiquitin-conjugating enzyme, is mutated
      in a novel X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a mutation of UBE2A/HR6A, which encodes a ubiquitin-conjugating enzyme (E2), a member of the ubiquitin proteasome pathway, as the cause of a novel X-linked mental retardation (XLMR) syndrome that affects three males in a two-generation family."
    explanation: Establishes a germline UBE2A mutation as the cause of the syndrome
      in hemizygous males.
  - reference: PMID:20412111
    reference_title: Novel missense mutations in the ubiquitination-related gene UBE2A
      cause a recognizable X-linked mental retardation syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, both missense and truncating mutations can give rise to a specific, syndromic form of XLMR which is identifiable in a clinical setting."
    explanation: Shows that both allele classes produce the same loss-of-function
      syndrome.
- name: Impaired Ubiquitin-Conjugating (E2) Enzyme Activity
  biological_scale: MOLECULAR
  description: >
    UBE2A/RAD6A is an E2 ubiquitin-conjugating enzyme that charges and transfers
    ubiquitin to substrates in concert with E3 ligases. Loss-of-function variants
    reduce this conjugating activity, so substrate ubiquitination that depends on
    UBE2A fails. A central UBE2A-dependent pathway is Parkin-mediated ubiquitination
    of mitochondrial proteins, the step that marks damaged mitochondria for removal.
  molecular_functions:
  - preferred_term: ubiquitin conjugating enzyme activity
    term:
      id: GO:0061631
      label: ubiquitin conjugating enzyme activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: DECREASED
  downstream:
  - target: Impaired Parkin-Dependent Mitophagy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23685073
      reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
        dysfunction and impair parkin-dependent mitophagy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we show that RAD6A acts as an E2 ubiquitin-conjugating enzyme that, in combination with an E3 ubiquitin ligase such as Parkin, ubiquitinates mitochondrial proteins to facilitate the clearance of dysfunctional mitochondria in cells."
      explanation: Directly links UBE2A/RAD6A E2 activity to the Parkin-dependent
        ubiquitination that drives mitophagy.
  evidence:
  - reference: PMID:23685073
    reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
      dysfunction and impair parkin-dependent mitophagy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a series of patients with X-linked intellectual disability presenting mutations in the Rad6a (Ube2a) gene, which encodes for an E2 ubiquitin-conjugating enzyme."
    explanation: Identifies UBE2A/RAD6A as the E2 ubiquitin-conjugating enzyme mutated
      in affected patients.
- name: Impaired Parkin-Dependent Mitophagy
  biological_scale: CELLULAR
  description: >
    Because UBE2A supplies the E2 activity that cooperates with the E3 ligase
    Parkin to ubiquitinate proteins on damaged mitochondria, loss of UBE2A impairs
    Parkin-dependent mitophagy, the selective autophagic clearance of dysfunctional
    mitochondria. The authors identify UBE2A/RAD6A as a regulator of this pathway.
  biological_processes:
  - preferred_term: mitophagy
    term:
      id: GO:0000423
      label: mitophagy
    modifier: DECREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Accumulation of Dysfunctional Neuronal Mitochondria
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23685073
      reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
        dysfunction and impair parkin-dependent mitophagy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Similarly, mouse mRad6a (Ube2a) knockout and patient-derived hRad6a (Ube2a) mutant cells show defective mitochondria."
      explanation: Failed Parkin-dependent mitophagy leaves defective mitochondria,
        shown in patient-derived and mouse Ube2a-mutant cells.
  evidence:
  - reference: PMID:23685073
    reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
      dysfunction and impair parkin-dependent mitophagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hence, we identify RAD6A as a regulator of Parkin-dependent mitophagy and establish a critical role for RAD6A in maintaining neuronal function."
    explanation: States UBE2A/RAD6A's regulatory role in Parkin-dependent mitophagy
      and in neuronal function.
- name: Accumulation of Dysfunctional Neuronal Mitochondria
  biological_scale: CELLULAR
  description: >
    Failure to clear damaged mitochondria leaves neurons carrying defective
    mitochondria, seen across the model systems used to study the disorder:
    patient-derived cells, Ube2a-knockout mouse cells, and dRad6-deficient
    Drosophila.
  biological_processes:
  - preferred_term: mitochondrion organization

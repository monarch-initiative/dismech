- name: Congenital Heart Defect
  category: Cardiovascular
  frequency: FREQUENT
  description: >
    Congenital heart defects occur in about 38% of individuals (10/26 in the
    largest sex-stratified series). Ventricular septal defect is the most common
    lesion; the spectrum also includes double-outlet right ventricle, truncus
    arteriosus, atrial septal defect and patent foramen ovale. Early, smaller
    series (de Leeuw 2010) saw heart defects only in Xq24-deletion patients and
    attributed them partly to deletion of the neighbouring gene SLC25A5. The
    larger Czeschik 2013 cohort corrects this: heart defects occur with
    intragenic UBE2A alleles as well as with deletions, so the lesion is not
    confined to contiguous-gene deletions, though it is more frequent among larger
    deletions. The frequency here is bound to the aggregate CHD term because the
    38% figure counts any heart defect, not VSD specifically.
  phenotype_term:
    preferred_term: Congenital heart defect
    term:
      id: HP:0001627
      label: Abnormal heart morphology
    coarse_binding_basis: VARIABLE_SPECTRUM
  evidence:
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heart defect | 0/3 | 0/4 | 0/1 | 2/2 | 1/1 | 1/1 | 1/1 | 1/2 | 0/3 | 1/3 | 0/2 | 1/1 | 1/1 | 1/1 | 10/26 (38%)"
    explanation: Table 2 aggregate gives any heart defect in 10/26 (38%), the basis for
      the FREQUENT band on the aggregate CHD term.
  - reference: PMID:24053514
    reference_title: X-linked intellectual disability type Nascimento is a clinically
      distinct, probably underdiagnosed entity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "double-outlet right ventricle, inlet ventricular septum defect, mitral stenosis"
    explanation: A concrete conotruncal lesion (DORV with inlet VSD) in a Czeschik
      patient carrying an intragenic frameshift allele, illustrating the heart-defect
      spectrum and its occurrence with a non-deletion allele.
  - reference: PMID:21108393
    reference_title: 'UBE2A deficiency syndrome: Mild to severe intellectual disability
      accompanied by seizures, absent speech, urogenital, and skin anomalies in male
      patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all five patients with an Xq24 deletion have ventricular septal defects that are not present in patients with a point mutation, which might be attributed to the deletion of SLC25A5."
    explanation: The earlier, smaller-cohort observation that prompted the
      deletion-specific SLC25A5 attribution, since refined by the larger Czeschik series.
  - reference: PMID:25287747
    reference_title: 'UBE2A deficiency syndrome: a report of two unrelated cases with
      large Xq24 deletions encompassing UBE2A gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest considerable prevalence of heart defects in the group of patients with larger deletions of Xq24 in comparison to the patients having intragenic UBE2A mutations."
    explanation: Supports the residual genotype gradient - heart defects are more
      frequent among larger Xq24 deletions than among intragenic mutations, not absent
      from the latter.
discussions:
- discussion_id: ube2a_seizure_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why do Ube2a-knockout mice fail to reproduce the seizures that are a core
    feature of human UBE2A deficiency, and what is the actual seizure mechanism?
  attaches_to:
  - pathophysiology#Spatial Learning and Memory Deficit
  - phenotypes#Seizures
  rationale: >
    Seizures are among the most consistent human features, yet the Ube2a-knockout
    mouse that reproduces the spatial-learning and mGluR-LTD deficits explicitly
    showed normal epilepsy and motor coordination. The mitophagy/synaptic-plasticity
    model therefore accounts for the cognitive phenotype but not the seizure
    phenotype, so the cellular substrate of seizures in this disorder is unresolved
    and not captured by the available mouse model.
  evidence:
  - reference: PMID:26476408
    reference_title: An essential role for UBE2A/HR6A in learning and memory and mGLUR-dependent
      long-term depression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that Ube2a knockout mice have a major deficit in spatial learning tasks, whereas other tested phenotypes, including epilepsy and motor coordination, were normal."
    explanation: Establishes that the mouse model does not reproduce the human seizure
      phenotype, defining the mismatch.

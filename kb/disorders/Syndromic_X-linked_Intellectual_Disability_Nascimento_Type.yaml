- name: Ventricular Septal Defect
  category: Cardiovascular
  frequency: FREQUENT
  description: >
    Heart defects occur in about 38% of individuals (10/26 in the largest
    sex-stratified series), with ventricular septal defect the most common
    lesion; the spectrum also includes double-outlet right ventricle, truncus
    arteriosus and atrial septal defect. Early, smaller series (de Leeuw 2010)
    saw VSDs only in Xq24-deletion patients and attributed them partly to
    deletion of the neighbouring gene SLC25A5. The larger Czeschik 2013 cohort
    corrects this: heart defects occur with intragenic UBE2A alleles as well as
    with deletions (e.g. the intragenic frameshift p.Y130Vfs*9 and p.I87Mfs*14,
    and the familial 7.1 kb intragenic deletion all had a heart defect), so the
    lesion is not confined to contiguous-gene deletions, though it is more
    frequent among larger deletions.

  evidence:
  - reference: PMID:23685073
    reference_title: Mutations in the intellectual disability gene Ube2a cause neuronal
      dysfunction and impair parkin-dependent mitophagy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Similarly, mouse mRad6a (Ube2a) knockout and patient-derived hRad6a (Ube2a) mutant cells show defective mitochondria."
    explanation: Demonstrates the mitochondrial defect in both patient cells and the

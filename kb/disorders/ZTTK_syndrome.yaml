notes: >-
  This entry emphasizes the established loss-of-function spliceopathy and
  representative, source-backed manifestations across major organ systems.
  Clinical expressivity is highly variable. Causal edges use
  INDIRECT_UNKNOWN_INTERMEDIATES with partial support where a SON-to-phenotype
  relationship is established but the intervening developmental mechanism is
  unresolved. The pathogenic mechanism of rare SON missense variants and robust
  genotype-phenotype correlations remain uncertain, and no disease-modifying
  therapy currently addresses SON deficiency.

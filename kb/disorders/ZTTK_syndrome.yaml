        Brain Development and Metabolism, Causing an Intellectual-Disability
        Syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report on an ID syndrome caused by de novo heterozygous
        loss-of-function (LoF) mutations in SON. The syndrome is characterized by
        ID and/or DD, malformations of the cerebral cortex, epilepsy, vision

- name: Erroneous SON-mediated RNA splicing
  biological_scale: MOLECULAR
  description: >-
    SON promotes pre-mRNA splicing, particularly for developmentally important
    transcripts with weak splice sites. Haploinsufficiency causes intron
    retention and other mis-splicing events that reduce productive transcripts.
  biological_processes:
  - preferred_term: RNA splicing
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: ABNORMAL
  evidence:
  - reference: PMID:27545680
    reference_title: >-
      De Novo Mutations in SON Disrupt RNA Splicing of Genes Essential for Brain
      Development and Metabolism, Causing an Intellectual-Disability Syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, analyses of RNA from affected individuals revealed that genes
      critical for neuronal migration and cortex organization (TUBG1, FLNA, PNKP,
      WDR62, PSMD3, and HDAC6) and metabolism (PCK2, PFKL, IDH2, ACY1, and ADA)
      are significantly downregulated because of the accumulation of mis-spliced
      transcripts resulting from erroneous SON-mediated RNA splicing.
    explanation: >-
      Patient-derived RNA directly supports the central spliceopathy node.
  - reference: PMID:31005274
    reference_title: >-
      SON haploinsufficiency causes impaired pre-mRNA splicing of CAKUT genes and
      heterogeneous renal phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The results demonstrate that short introns with weak splice site(s) were
      retained in the PKD1, PAX8, and FRAS1 pre-mRNAs when SON expression is
      reduced (Figure 4a).
    explanation: >-
      The kidney-cell experiments demonstrate SON-dependent processing of weak
      splice sites in developmentally important transcripts.
  downstream:
  - target: Reduced expression of neurodevelopmental and metabolic genes
    description: >-
      Mis-spliced transcripts accumulate and productive expression falls across
      SON-dependent developmental and metabolic targets.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27545680
      reference_title: >-
        De Novo Mutations in SON Disrupt RNA Splicing of Genes Essential for
        Brain Development and Metabolism, Causing an Intellectual-Disability
        Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, analyses of RNA from affected individuals revealed that
        genes critical for neuronal migration and cortex organization (TUBG1,
        FLNA, PNKP, WDR62, PSMD3, and HDAC6) and metabolism (PCK2, PFKL, IDH2,
        ACY1, and ADA) are significantly downregulated because of the accumulation
        of mis-spliced transcripts resulting from erroneous SON-mediated RNA
        splicing.
      explanation: >-
        The study directly connects transcript mis-splicing with reduced target
        gene expression.
  - target: Aberrant splicing of kidney-development genes
    description: >-
      The shared spliceopathy includes established CAKUT genes in kidney cells
      and cells from affected individuals.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31005274
      reference_title: >-
        SON haploinsufficiency causes impaired pre-mRNA splicing of CAKUT genes
        and heterogeneous renal phenotypes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SON knockdown in kidney cell lines leads to abnormal pre-mRNA splicing,
        resulting in decreased expression of several established CAKUT genes.
        Furthermore, these molecular events were observed in patient-derived
        cells with SON haploinsufficiency.
      explanation: >-
        Kidney-cell knockdown and patient-derived cells establish a renal branch
        of the SON-dependent spliceopathy.

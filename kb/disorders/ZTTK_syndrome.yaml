treatments:
- name: Supportive multidisciplinary care
  description: >-
    No therapy directly corrects SON deficiency. Management is supportive and
    individualized across developmental, neurologic, nutritional, renal,
    cardiac, musculoskeletal, ophthalmologic, hearing, immune, and other
    manifestations.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40991760
    reference_title: Zhu-Tokita-Takenouchi-Kim Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      None of the treatments available directly address SON deficiency.
      Supportive measures include developmental and educational support;
      standard treatment for seizures and movement disorder; treatment of
      craniosynostosis per craniofacial team; treatment of musculoskeletal
      manifestations per orthopedist; treatment of refractive errors and
      strabismus per ophthalmologist; low vision services as needed; nutritional
      support for feeding issues; treatment of growth hormone deficiency per
      endocrinologist; treatment of genitourinary and kidney manifestations per
      nephrologist and/or urologist; treatment of hematologic disorders per
      hematologist; surgical and/or medical treatment for cardiac anomalies;
      treat infections aggressively; in those with immune deficiency irradiated
      blood products are recommended; standard treatment of recurrent otitis
      media; management of bowel dysfunction and other gastrointestinal issues
      per gastroenterologist; hearing aids may be helpful; family and social work
      support.
    explanation: >-
      GeneReviews states that care is supportive rather than disease-modifying
      and enumerates the affected systems requiring individualized management.
- name: Kidney ultrasound surveillance
  description: Kidney ultrasound is recommended annually or as clinically needed.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: NCIT:C15747

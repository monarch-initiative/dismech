      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome is characterized by developmental
        delay and intellectual disability.
      explanation: >-
        GeneReviews establishes developmental delay as a defining manifestation,
        while the specific causal route remains unresolved.
  - target: Facial dysmorphism
    description: >-
      SON haploinsufficiency produces a characteristic craniofacial phenotype
      through developmental intermediates that have not been resolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40991760
      reference_title: Zhu-Tokita-Takenouchi-Kim Syndrome.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Characteristic facial features include facial asymmetry, prominent
        forehead, horizontal eyebrows, ptosis, downslanted palpebral fissures,
        epicanthal folds, deep-set eyes, midface retrusion, depressed or other
        abnormality of the nasal bridge, low-set ears that may be posteriorly
        rotated, short and/or smooth philtrum, thin vermilion of the upper lip,
        bifid uvula, and high palate.
      explanation: >-
        GeneReviews establishes the craniofacial phenotype of the SON-related
        syndrome, while the intervening developmental mechanism remains unknown.
  - target: Musculoskeletal abnormalities
    description: >-

name: ZTTK syndrome
creation_date: '2026-04-14T12:05:00Z'
category: Mendelian
description: >-
  ZTTK syndrome is a multisystem neurodevelopmental disorder caused by
  heterozygous loss-of-function variants in SON. The core disease mechanism is
  SON haploinsufficiency with downstream disturbance of RNA processing and
  neurodevelopmental programs, producing intellectual disability and broader
  congenital anomaly phenotypes.
disease_term:
  preferred_term: ZTTK syndrome
  term:
    id: MONDO:0014936
    label: ZTTK syndrome
synonyms:
- Zhu-Tokita-Takenouchi-Kim syndrome
- SON deficiency syndrome
- SON-related neurodevelopmental disorder
- SON-related ZTTK syndrome
parents:
- hereditary disease
- neurodevelopmental disorder
references:
- reference: PMID:40991760
  title: Zhu-Tokita-Takenouchi-Kim Syndrome.
  tags:
  - GeneReviews
inheritance:
- name: Autosomal dominant inheritance, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ZTTK syndrome is autosomal dominant. Almost all probands reported to date
    whose parents have undergone molecular genetic testing have a de novo
    pathogenic SON variant. Each child of an affected individual has a 50%
    chance of inheriting the variant, and prenatal or preimplantation genetic
    testing is possible once the familial variant is known.
  evidence:
  - reference: PMID:40991760
    reference_title: Zhu-Tokita-Takenouchi-Kim Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZTTK syndrome is an autosomal dominant disorder. Almost all probands
      reported to date with ZTTK syndrome whose parents have undergone molecular
      genetic testing have the disorder as the result of a de novo SON pathogenic
      variant.
    explanation: >-
      GeneReviews directly states the mode of inheritance and the predominantly
      de novo origin observed in affected families.
  - reference: PMID:40991760
    reference_title: Zhu-Tokita-Takenouchi-Kim Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with ZTTK syndrome has a 50% chance of
      inheriting the SON pathogenic variant (data on reproduction in affected
      individuals are currently lacking, as most reported individuals are not
      yet of reproductive age). Once the SON pathogenic variant has been
      identified in an affected family member, prenatal and preimplantation
      genetic testing are possible.
    explanation: >-
      GeneReviews directly states recurrence risk and reproductive testing
      options while noting the limited reproductive experience in this cohort.
pathophysiology:
- name: SON haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    ZTTK syndrome is caused by heterozygous loss-of-function variants in SON,
    establishing SON insufficiency as the proximal disease mechanism.
  genes:
  - preferred_term: SON
    term:
      id: hgnc:11183
      label: SON
  evidence:
  - reference: PMID:34521999
    reference_title: >-
      Establishing the phenotypic spectrum of ZTTK syndrome by analysis of 52
      individuals with variants in SON.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Zhu-Tokita-Takenouchi-Kim (ZTTK) syndrome, an intellectual disability
      syndrome first described in 2016, is caused by heterozygous loss-of-function
      variants in SON.
    explanation: >-
      The 52-person cohort directly establishes heterozygous SON
      loss-of-function as the defining mechanism.
  downstream:
  - target: Erroneous SON-mediated RNA splicing
    description: >-
      Reduced SON dosage impairs correct processing of weak splice sites in
      developmentally important transcripts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27545680
      reference_title: >-
        De Novo Mutations in SON Disrupt RNA Splicing of Genes Essential for
        Brain Development and Metabolism, Causing an Intellectual-Disability
        Syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Importantly, analyses of RNA from affected individuals revealed that
        genes critical for neuronal migration and cortex organization (TUBG1,
        FLNA, PNKP, WDR62, PSMD3, and HDAC6) and metabolism (PCK2, PFKL, IDH2,
        ACY1, and ADA) are significantly downregulated because of the accumulation
        of mis-spliced transcripts resulting from erroneous SON-mediated RNA
        splicing.
      explanation: >-
        RNA from affected individuals directly demonstrates mis-splicing after
        SON loss-of-function.
    - reference: PMID:31005274
      reference_title: >-
        SON haploinsufficiency causes impaired pre-mRNA splicing of CAKUT genes
        and heterogeneous renal phenotypes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The results demonstrate that short introns with weak splice site(s) were
        retained in the PKD1, PAX8, and FRAS1 pre-mRNAs when SON expression is
        reduced (Figure 4a).
      explanation: >-
        SON knockdown experimentally demonstrates intron retention at weak
        splice sites in developmentally important kidney transcripts.
  - target: Impaired neuronal migration
    description: >-
      Reduced SON dosage disrupts developmental programs required for normal
      cortical neuron positioning.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32448361
      reference_title: >-
        Knockdown of Son, a mouse homologue of the ZTTK syndrome gene, causes
        neuronal migration defects and dendritic spine abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data indicate that SON insufficiency causes neuronal migration
        defects and dendritic spine abnormalities, which seem neuropathological
        bases of the neural symptoms of ZTTK syndrome.
      explanation: >-
        This model-organism study links SON insufficiency directly to abnormal
        neuronal migration.
  - target: Dendritic spine abnormalities
    description: >-
      SON insufficiency also perturbs maturation of synaptic structures in
      cortical neurons.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32448361
      reference_title: >-
        Knockdown of Son, a mouse homologue of the ZTTK syndrome gene, causes
        neuronal migration defects and dendritic spine abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Son knockdown in neural progenitors resulted in defective migration
        during corticogenesis and reduced spine density on mature cortical
        neurons.
      explanation: >-
        The mouse study directly reports reduced dendritic spine density after
        Son knockdown.
  - target: Neurodevelopmental delay
    description: >-
      SON haploinsufficiency causes neurodevelopmental delay through incompletely
      resolved developmental intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40991760

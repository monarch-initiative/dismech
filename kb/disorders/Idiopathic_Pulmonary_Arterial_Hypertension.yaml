    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improvements in WHO functional class were observed in 54% of patients with classical IPAH, 26% of patients with IPAH with a lung phenotype, and 22% of patients with group 3 pulmonary hypertension
    explanation: >-
      Quantifies the therapeutic behaviour that places the IPAH lung phenotype closer to
      Group 3 disease than to classical IPAH.
- name: Pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
  description: >-
    A venous and capillary pulmonary vasculopathy that can mimic IPAH

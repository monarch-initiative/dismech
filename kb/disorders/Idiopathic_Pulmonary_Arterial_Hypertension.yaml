histopathology:
- name: Remodeled pulmonary arterioles with immune cell accumulation
  diagnostic: false
  description: >-
    Immune cells accumulate around and within the remodeled small pulmonary
    arterioles of IPAH lungs, and the inflammatory infiltrate is resolved by spatial
    transcriptomics as one of the constituent lesions of the remodeling process.
    Recorded as non-diagnostic because perivascular inflammation is shared across
    Group 1 PAH rather than specific to idiopathic disease, and because lung biopsy
    is neither required for nor used in routine IPAH diagnosis. The structural
    components this node originally bundled - plexiform lesions and medial
    hypertrophy - are curated as separate findings below so that each carries its
    own description and evidence.
  finding_term:
    preferred_term: perivascular inflammation of remodeled pulmonary arterioles
  evidence:
  - reference: PMID:38568479
    reference_title: Digital Spatial Profiling Identifies Distinct Molecular Signatures of Vascular Lesions in Pulmonary Arterial Hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic pulmonary arterial hypertension (IPAH) is characterized by extensive pulmonary vascular remodeling caused by plexiform and obliterative lesions, media hypertrophy, inflammatory cell infiltration, and alterations of the adventitia.
    explanation: >-
      IPAH-specific statement listing inflammatory cell infiltration among the lesions that
      make up the remodeled pulmonary vasculature.
  - reference: PMID:38797830
    reference_title: A new integrative analysis of histopathology and single cell RNA-seq reveals the CCL5 mediated T and NK cell interaction with vascular cells in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Accumulation of immune cells in remodeled pulmonary arterioles is a common finding in IPAH lung tissue
    explanation: >-
      IPAH-specific histopathological description of remodeled arterioles with immune cell
      infiltration.
- name: Plexiform lesions
  description: >-
    Complex, glomeruloid proliferations of endothelial and matrix-producing cells
    that arise at branch points of small pulmonary arteries and obliterate the
    lumen. Spatial transcriptomic profiling of individually microdissected IPAH
    lesions shows that plexiform lesions carry the largest differentially expressed
    gene set of any lesion class, enriched for transforming growth factor beta
    signalling and for extracellular-matrix and endothelial-mesenchymal
    transformation genes - so they are a molecularly distinct compartment rather
    than an end stage of medial hypertrophy.
  finding_term:
    preferred_term: pulmonary arterial plexiform lesion
  evidence:
  - reference: PMID:38568479
    reference_title: Digital Spatial Profiling Identifies Distinct Molecular Signatures of Vascular Lesions in Pulmonary Arterial Hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic pulmonary arterial hypertension (IPAH) is characterized by extensive pulmonary vascular remodeling caused by plexiform and obliterative lesions, media hypertrophy, inflammatory cell infiltration, and alterations of the adventitia.
    explanation: >-
      Names plexiform lesions as a constituent lesion of IPAH pulmonary vascular remodeling.
  - reference: PMID:38568479
    reference_title: Digital Spatial Profiling Identifies Distinct Molecular Signatures of Vascular Lesions in Pulmonary Arterial Hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plexiform lesions in IPAH showed enrichment for 1) genes associated with transforming growth factor β signaling and 2) mutated genes affecting the extracellular matrix and endothelial-mesenchymal transformation.
    explanation: >-
      Supports the claim that the plexiform lesion is a molecularly distinct compartment with
      its own transcriptional signature.
- name: Pulmonary arterial medial hypertrophy
  description: >-
    Thickening of the muscular media of small pulmonary arteries, the structural
    correlate of the smooth-muscle proliferation and muscularisation node. In the
    spatial-profiling series it is one of the four lesion classes microdissected
    from IPAH lungs and compared with the intima plus media of control pulmonary

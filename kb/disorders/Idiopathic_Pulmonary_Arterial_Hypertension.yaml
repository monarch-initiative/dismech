    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: T and NK Cell CCL5-Mediated Immune-Vascular Crosstalk
  biological_scale: CELLULAR
  role: amplifier
  description: >-
    Integrated analysis of IPAH lung transcriptomes, histopathology scoring and
    single-cell RNA sequencing identifies CXCL9, CCL5, GZMA and GZMK as
    inflammation-associated hub genes distinguishing IPAH lungs from controls, with
    CCL5 and GZMA expressed predominantly by T and NK cells. CCL5 mediates
    interaction of these lymphoid populations with pulmonary endothelial cells,
    smooth muscle cells and fibroblasts through multiple receptors, defining an
    adaptive immune-vascular amplification arm of IPAH remodeling. This is an
    IPAH-specific refinement of the generic perivascular-inflammation theme; it is
    discovery-stage and not a validated clinical target.

- name: Right heart catheterisation with exclusion of Groups 2-5 and associated PAH
  description: >-
    Diagnosis requires invasive confirmation of pre-capillary pulmonary hypertension
    (elevated mean pulmonary arterial pressure with a normal pulmonary arterial wedge
    pressure and elevated pulmonary vascular resistance), followed by systematic
    exclusion of left heart disease, lung disease/hypoxia, chronic thromboembolic
    disease and the associated and drug- or toxin-induced Group 1 subtypes. Only
    after this exclusion cascade is the case designated idiopathic.

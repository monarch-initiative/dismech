- name: Sotatercept
  description: >-
    An ActRIIA-Fc ligand trap that sequesters activin-family ligands and rebalances
    activin/BMP signalling. It is the first approved PAH therapy directed at the
    TGF-beta-superfamily imbalance underlying vascular remodeling rather than at
    vascular tone alone, and is added when low-risk status is not achieved on
    background therapy.

- name: Remodeled pulmonary arterioles with immune cell accumulation
  diagnostic: true
  description: >-
    IPAH lung pathology shows eccentric and concentric intimal fibrosis with
    occlusive thickening of small pulmonary arterioles, medial hypertrophy, in-situ
    thrombosis and plexiform lesions, together with accumulation of immune cells
    around and within the remodeled arterioles. Lung biopsy is not required for and
    is generally avoided in routine diagnosis.
  finding_term:

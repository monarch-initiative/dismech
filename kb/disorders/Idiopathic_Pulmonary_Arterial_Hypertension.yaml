discussions:
- discussion_id: gap_ipah_residual_etiology_after_genetic_testing
  prompt: >-
    After comprehensive gene-panel and genome sequencing has excluded known
    pathogenic variants, and all associated conditions and exposures have been ruled
    out, what actually initiates pulmonary vascular disease in the remaining
    genuinely idiopathic majority of IPAH patients?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
  - pathophysiology#Occult Rare Variant Burden and Reclassification to Heritable PAH
  - genetic#BMPR2
  rationale: >-
    This entry models IPAH as a diagnosis of exclusion with an explicit trigger node
    that names no trigger. Pooled genetic testing accounts for roughly one in five
    IPAH diagnoses by reclassifying them as heritable disease, which sharpens rather
    than resolves the question: the remaining four in five have no identified cause
    at all. Resolving what initiates disease in that residual population is the
    single largest mechanistic gap in this entry and determines whether IPAH remains
    a coherent disease entity or fragments into further aetiological subtypes, as
    the low-DLCO lung phenotype already suggests.
  evidence:
  - reference: PMID:40229839
    reference_title: "The prevalence of pathogenic variants in the BMPR2 gene in patients with the idiopathic pulmonary arterial hypertension in the Russian population: sequencing data and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the frequency of P/LP variants in our cohort (10.48%) is lower than the overall average of 17.75% from the meta-analysis
    explanation: >-
      Quantifies the fraction of IPAH explained by BMPR2 genetics, and by implication the much
      larger fraction that remains unexplained.
  - reference: PMID:39209481
    reference_title: Genetics and precision genomics approaches to pulmonary hypertension.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these cohorts are largely of European origin; greater diversity will be essential to characterise the full extent of genomic variation contributing to PH risk and treatment responses.
    explanation: >-
      Identifies ancestry bias in existing PAH genomic cohorts as a specific reason the
      residual unexplained fraction may be overestimated in non-European populations.
- discussion_id: gap_ipah_female_predominance_mechanism
  prompt: >-
    Why is IPAH roughly four times more common in women than in men, and why is this
    female predominance concentrated in the classical phenotype and largely absent in
    the low-DLCO lung phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#Idiopathic PAH patients across epidemiological studies
  - has_subtypes#Classical IPAH
  - has_subtypes#Lung phenotype IPAH
  - pathophysiology#Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
  rationale: >-
    The entry records a 4.1:1 female-to-male incidence ratio in IPAH and shows that
    it collapses in the lung phenotype, but offers no mechanism. Sex-hormone
    metabolism, sex-differential BMP-pathway regulation and sex differences in right
    ventricular adaptation are all candidate explanations, and they make divergent
    predictions. Because the sex distribution differs so sharply between the two
    registry-defined phenotypes, resolving this would help decide whether classical
    IPAH and the lung phenotype are one disease with modifiers or two diseases
    sharing a haemodynamic definition.
  evidence:
  - reference: PMID:37461108
    reference_title: "Unraveling the epigenetic landscape of pulmonary arterial hypertension: implications for personalized medicine development."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      women have a higher incidence rate than men across multiple studies (4.3:1 in the total PAH group and 4.1:1 in the IPAH category)
    explanation: >-
      Establishes the magnitude of the female predominance the gap seeks to explain.
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While 99 (77%) patients in COMPERA and 133 (72%) patients in ASPIRE with classical IPAH were female, there was a lower proportion of female patients in the IPAH and a lung phenotype cohort
    explanation: >-
      Documents the phenotype-dependent collapse of the female predominance that motivates the
      question.
notes: >-
  Positioning within the dismech PAH set. This entry is deliberately scoped to what
  is distinctive about idiopathic disease and defers the shared cascade to the
  pulmonary_vascular_remodeling module: five pathophysiology nodes declare
  conforms_to against that module (endothelial dysfunction, PASMC
  proliferation/vasoconstriction, obstructive remodeling, increased PVR, and the
  PAH/right-ventricular consequence) rather than re-deriving the mechanism. The
  IPAH-specific content is concentrated in (1) the "Unidentified Initiating Insult"
  trigger node, which substitutes for the germline BMPR2 lesion of
  Heritable_Pulmonary_Arterial_Hypertension and the culprit exposure of
  Drug_or_Toxin-Induced_Pulmonary_Arterial_Hypertension; (2) the "Occult Rare
  Variant Burden" node, which models the porous IPAH/HPAH boundary quantitatively
  (pooled 17.75% pathogenic BMPR2 across 3124 IPAH patients) rather than as prose;
  (3) the three registry- and physiology-defined subtypes (classical, low-DLCO lung
  phenotype, vasoresponder); (4) female predominance; and (5) the IPAH-specific
  CCL5 T/NK immune-vascular crosstalk node. Genes are typed SUSCEPTIBILITY rather
  than CAUSATIVE on purpose: from the perspective of a population defined as
  idiopathic, discovering such a variant moves the patient out of this entry.

  Deliberate omissions. The 2022 ESC/ERS guideline (PMID:36017548) has no PubMed
  abstract, so the current numeric haemodynamic thresholds (mPAP above 20 mmHg,
  PAWP at or below 15 mmHg, PVR above 2 Wood units) that the deep-research report
  supplied are described qualitatively rather than asserted with a fabricated
  quote; the qualitative pre-capillary definition is instead evidenced from a
  cached review. Incidence (2.5-7.5 per million/year), diagnostic delay (about 2.8
  years to diagnosis), and contemporary survival percentages appeared in the
  deep-research report but were sourced from full-text pages not present in the
  cached references, so they are not asserted here. The 2024 World Symposium
  12-definitive-gene list was reported by deep research from full text; only the
  individual genes independently verifiable from cached references (BMPR2, TBX4,
  ATP13A3, SOX17, GDF2) are curated. The ferroptosis mechanism is recorded as an
  EMERGING mechanistic_hypotheses entry rather than a pathophysiology node because
  the therapeutic evidence is preclinical and the finding is PAH-wide rather than
  IPAH-specific.

mechanistic_hypotheses:
- hypothesis_group_id: ipah_ferroptosis_inflammation
  hypothesis_label: Endothelial ferroptosis as an upstream inflammatory driver of IPAH remodeling
  description: >-
    An emerging model in which lipid peroxidation and ferroptotic death of pulmonary
    arterial endothelial cells release damage-associated molecular patterns that
    activate complement, recruit inflammatory macrophages and drive smooth muscle
    proliferation. Multi-omic and genetic-association data in humans plus rescue by
    the ferroptosis inhibitor ferrostatin-1 in monocrotaline rats support the model,
    but the evidence is preclinical for therapy and derives from PAH broadly rather
    than IPAH specifically.
  status: EMERGING
  evidence:
  - reference: PMID:39421926
    reference_title: Ferroptosis-Mediated Inflammation Promotes Pulmonary Hypertension.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ferrostatin-1, a small-molecule ferroptosis inhibitor, mitigated PAH severity in monocrotaline rats.
    explanation: >-
      Provides the in vivo pharmacological rescue that anchors the ferroptosis hypothesis.
  - reference: PMID:39421926
    reference_title: Ferroptosis-Mediated Inflammation Promotes Pulmonary Hypertension.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ferroptosis promotes PAH through metabolic and inflammatory mechanisms in the pulmonary vasculature.
    explanation: >-
      States the hypothesis in the authors' own terms. Evidence source is OTHER because the
      conclusion integrates human multi-omic, rodent and in vitro data.

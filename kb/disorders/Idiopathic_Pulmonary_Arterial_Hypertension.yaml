      without other causes of pre-capillary hypertension such as lung diseases or chronic thromboembolic pulmonary hypertension
    explanation: >-
      Supports the requirement to exclude Group 3 and Group 4 pulmonary hypertension before
      designating disease idiopathic.
- name: Transthoracic echocardiography
  description: >-
    Echocardiography is the principal noninvasive screening and probability-assessment
    study. It evaluates right-heart structure and function and possible left-heart
    causes, but does not replace confirmatory right-heart catheterisation.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Along with invasive hemodynamic measurements, several noninvasive imaging
      modalities such as echocardiography and ventilation-perfusion scanning are
      key adjunct techniques.
    explanation: >-
      Establishes echocardiography as a key noninvasive adjunct in the PAH
      diagnostic pathway.
- name: Ventilation-perfusion scanning
  description: >-
    Ventilation-perfusion scanning screens for chronic thromboembolic pulmonary
    hypertension, whose exclusion is mandatory before pre-capillary pulmonary
    hypertension can be designated idiopathic Group 1 PAH.
  diagnosis_term:
    preferred_term: ventilation-perfusion scan
    term:
      id: NCIT:C38100
      label: Ventilation Perfusion Scanning
  evidence:
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Along with invasive hemodynamic measurements, several noninvasive imaging
      modalities such as echocardiography and ventilation-perfusion scanning are
      key adjunct techniques.
    explanation: >-
      Establishes ventilation-perfusion scanning as a key adjunct used to exclude
      the Group 4 chronic-thromboembolic mimic.
- name: Pulmonary function testing with DLCO
  description: >-
    Spirometry and diffusing-capacity measurement evaluate Group 3 lung disease and
    identify the low-DLCO IPAH lung phenotype. Normal or near-normal spirometry with
    severely reduced DLCO distinguishes that subtype from overt parenchymal lung
    disease.
  diagnosis_term:
    preferred_term: pulmonary function test
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  evidence:
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with IPAH and a lung phenotype had normal or near normal
      spirometry, a severe reduction in DLCO, with the majority having no or a mild
      degree of parenchymal lung involvement on chest computed tomography.
    explanation: >-
      Defines the pulmonary-function pattern that identifies the IPAH lung
      phenotype while helping exclude overt Group 3 disease.
- name: Acute pulmonary vasodilator testing
  description: >-
    Acute vasoreactivity testing during the diagnostic right-heart catheterisation
    identifies the small subgroup of IPAH patients who may benefit from long-term
    calcium-channel blockade. This test is applied specifically in idiopathic,
    heritable and drug-associated PAH, and is one of the few points at which IPAH
    management diverges from other PAH subtypes.
  diagnosis_term:
    preferred_term: cardiac catheterization
    term:
      id: NCIT:C38044
      label: Cardiac Catheterization
  evidence:
  - reference: PMID:15939821
    reference_title: Long-term response to calcium channel blockers in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute pulmonary vasodilator testing with epoprostenol or nitric oxide was performed in 557 IPAH patients.
    explanation: >-
      Documents acute vasodilator testing as the standard procedure applied to IPAH patients
      to identify calcium-channel-blocker candidates.
- name: Comprehensive PAH gene panel testing
  description: >-
    Genetic testing with a curated PAH/PVOD gene panel including copy-number
    analysis is recommended for patients diagnosed with idiopathic PAH. A positive
    result reclassifies the patient as heritable PAH and enables cascade screening of
    relatives; a negative panel does not exclude genetic susceptibility.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36302552
    reference_title: "Genetic counselling and testing in pulmonary arterial hypertension: a consensus statement on behalf of the International Consortium for Genetic Studies in PAH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      importantly through cascade screening, the detection of healthy causal variant carriers, to whom regular assessment should be offered.
    explanation: >-
      The international consensus supports panel-based genetic testing with cascade screening
      of relatives.
  - reference: PMID:39209481
    reference_title: Genetics and precision genomics approaches to pulmonary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene and variant curation by an expert panel now provides a robust framework for knowing which genes to test and how to interpret variants in clinical practice. We recommend that genetic testing be offered to specific subgroups of symptomatic patients with PAH
    explanation: >-
      Supports expert-curated gene-panel testing as current practice for symptomatic PAH
      subgroups, which include idiopathic disease.
differential_diagnoses:
- name: Heritable pulmonary arterial hypertension
  description: >-
    Clinically and mechanistically indistinguishable from IPAH at presentation; the
    distinction rests entirely on family history or on identification of a
    pathogenic germline variant. Because penetrance is incomplete and sex-dependent,
    a substantial minority of apparently idiopathic patients are genetically
    heritable.
  distinguishing_features:
  - A pathogenic or likely pathogenic germline variant in a curated PAH gene reclassifies IPAH as heritable PAH.
  - Pooled genetic testing finds pathogenic BMPR2 variants in roughly 18% of patients diagnosed as IPAH.
  - Family history may be absent in genetically heritable disease because of incomplete, age- and sex-dependent penetrance.
  disease_term:
    preferred_term: heritable pulmonary arterial hypertension
    term:
      id: MONDO:0017148
      label: heritable pulmonary arterial hypertension
  evidence:
  - reference: PMID:36302552
    reference_title: "Genetic counselling and testing in pulmonary arterial hypertension: a consensus statement on behalf of the International Consortium for Genetic Studies in PAH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benefits of including molecular genetic testing within the management protocol of patients with PAH include the identification of individuals misclassified by other diagnostic approaches
    explanation: >-
      Supports genetic testing as the discriminator between idiopathic and heritable PAH.
- name: Drug- or toxin-induced pulmonary arterial hypertension
  description: >-
    Group 1 PAH attributable to a culprit exposure. Exposure history is the sole
    discriminator; the downstream vascular pathology is shared.
  distinguishing_features:
  - A documented exposure to a definite PAH-associated drug or toxin (anorexigens, methamphetamine, dasatinib) excludes the idiopathic designation.
  - Some drug-induced disease is partly reversible after withdrawal of the culprit agent, which has no counterpart in IPAH.
  disease_term:
    preferred_term: drug- or toxin-induced pulmonary arterial hypertension
    term:
      id: MONDO:0017149
      label: drug- or toxin-induced pulmonary arterial hypertension
- name: Pulmonary hypertension due to lung disease or hypoxia
  description: >-
    WHO Group 3 pulmonary hypertension. The IPAH lung phenotype (low DLCO, smoking
    history) sits at the boundary: these patients satisfy IPAH haemodynamic and
    spirometric criteria but resemble Group 3 disease in age, sex distribution,
    and poor treatment response.
  distinguishing_features:
  - Group 3 disease has overt obstructive or restrictive lung disease; the IPAH lung phenotype has normal or near-normal spirometry with little parenchymal involvement on CT.
  - Response to PAH therapy is poor in both the IPAH lung phenotype and Group 3 pulmonary hypertension, and markedly better in classical IPAH.
  disease_term:
    preferred_term: pulmonary hypertension due to lung disease and/or hypoxia
    term:
      id: MONDO:0017157
      label: pulmonary hypertension owing to lung disease and/or hypoxia
  evidence:
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Improvements in WHO functional class were observed in 54% of patients with classical IPAH, 26% of patients with IPAH with a lung phenotype, and 22% of patients with group 3 pulmonary hypertension
    explanation: >-
      Quantifies the therapeutic behaviour that places the IPAH lung phenotype closer to
      Group 3 disease than to classical IPAH.
- name: Pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
  description: >-
    A venous and capillary pulmonary vasculopathy that can mimic IPAH
    haemodynamically but is managed differently and can decompensate on PAH
    vasodilators. Biallelic EIF2AK4 variants identify heritable cases.
  distinguishing_features:
  - Biallelic EIF2AK4 variants indicate PVOD/PCH rather than ordinary IPAH and materially alter management.
  - Characteristic CT findings and a very low DLCO with hypoxaemia suggest PVOD/PCH.
  disease_term:
    preferred_term: pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
    term:
      id: MONDO:0018554
      label: pulmonary veno-occlusive disease and/or pulmonary capillary haemangiomatosis
  evidence:
  - reference: PMID:29650961
    reference_title: Identification of rare sequence variation underlying heritable pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen cases (1.3%) with biallelic EIF2AK4 mutations were found
    explanation: >-
      Shows that biallelic EIF2AK4 (PVOD/PCH) cases are recovered from cohorts recruited as
      idiopathic and heritable PAH, making PVOD/PCH an important differential.

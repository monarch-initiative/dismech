- category: Respiratory
  name: Decreased DLCO
  subtype: Lung phenotype IPAH
  description: >-
    A severely reduced diffusing capacity for carbon monoxide (<45% predicted) in the
    presence of normal or near-normal spirometry defines the IPAH lung phenotype and
    distinguishes it from classical IPAH.
  phenotype_term:
    preferred_term: Decreased DLCO
    term:
      id: HP:0045051
      label: Decreased DLCO
  reports_on:
  - target: Obstructive Pulmonary Vascular Remodeling
    relationship: CORRELATES_WITH
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    description: >-
      Carbon monoxide transfer depends on the alveolar-capillary surface and the
      pulmonary capillary blood volume it drains, so a severely reduced DLCO with
      preserved spirometry is read as a functional signal of a depleted pulmonary
      vascular bed rather than of airway or restrictive lung disease.
    interpretation: >-
      Attached as an observational readout, not a causal edge. In this subgroup a
      DLCO below 45% predicted is used to separate the smoking-associated lung
      phenotype from classical IPAH, so it marks which entity is present as much as
      it grades severity of the remodeling node it reports on.

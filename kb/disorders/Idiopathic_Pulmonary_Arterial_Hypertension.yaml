  - target: Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Also modulating rather than predisposing, and for a reason the entry
      states itself: smoking is not a validated cause of classical disease
      here, and in this subgroup it marks a presumably smoking-related
      pulmonary vascular disease that behaves more like pulmonary hypertension
      due to lung disease. What the exposure modifies is which entity the
      patient has rather than the mechanism within it, which is the same kind
      of claim as the absence link above and is why both point at the same
      node.

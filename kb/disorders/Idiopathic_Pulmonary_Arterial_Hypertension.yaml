  biological_scale: TISSUE
  role: central_effector
  description: >-
    Sustained smooth muscle proliferation, adventitial fibroblast activation, matrix
    deposition and neointima formation remodel the wall of small pulmonary arteries,
    producing medial hypertrophy, eccentric and concentric intimal fibrosis,
    in-situ thrombosis and plexiform lesions that obliterate the lumen. This
    structural obstruction is the central effector shared with heritable, associated
    and drug- or toxin-induced PAH, and it is largely irreversible once established.
  cell_types:
  - preferred_term: pulmonary artery smooth muscle cell
    term:
      id: CL:0002591
      label: smooth muscle cell of the pulmonary artery
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  biological_processes:
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: DYSREGULATED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38797830
    reference_title: A new integrative analysis of histopathology and single cell RNA-seq reveals the CCL5 mediated T and NK cell interaction with vascular cells in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is central to the irreversible progression of IPAH
    explanation: >-
      IPAH-specific statement that pulmonary vascular remodeling, marked by arteriolar
      eccentricity and occlusive intimal thickening, is the central and largely irreversible
      driver of disease progression.
  - reference: PMID:29650961
    reference_title: Identification of rare sequence variation underlying heritable pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic and heritable pulmonary arterial hypertension (PAH) are rare disorders characterised by occlusion of arterioles in the lung
    explanation: >-
      Explicitly groups idiopathic with heritable PAH around the shared lesion of arteriolar
      occlusion, the basis for conformance to the shared module.
  downstream:
  - target: Increased Pulmonary Vascular Resistance
    description: >-
      Fixed luminal obstruction, added to dynamic vasoconstriction, raises resistance
      across the pulmonary bed.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29540357
      reference_title: "Pulmonary arterial hypertension: pathogenesis and clinical management."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In PAH, the pulmonary vasculature is dynamically obstructed by vasoconstriction, structurally obstructed by adverse vascular remodeling, and pathologically non-compliant as a result of vascular fibrosis and stiffening.
      explanation: >-
        Names both the fixed and the dynamic components of obstruction that this edge combines.
        The sentence asserts obstruction and reduced compliance rather than the resistance
        figure itself, so the resistance rise follows by one inference step.
- name: Increased Pulmonary Vascular Resistance
  conforms_to: "pulmonary_vascular_remodeling#Increased Pulmonary Vascular Resistance"
  biological_scale: ORGANISM
  role: effector
  description: >-
    The combination of fixed structural obstruction and sustained vasoconstriction
    raises pulmonary vascular resistance and reduces pulmonary arterial compliance,
    while pulmonary arterial wedge pressure remains normal - the pre-capillary
    haemodynamic signature confirmed at right-heart catheterisation that defines PAH
    and separates it from Group 2 pulmonary hypertension due to left heart disease.
  biological_processes:
  - preferred_term: vasoconstriction
    term:
      id: GO:0042310
      label: vasoconstriction
    modifier: INCREASED
  evidence:
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary arterial hypertension (PAH) is a specific subset of PH characterized by a normal pulmonary arterial wedge pressure (PAWP), combined with elevated mPAP and increased pulmonary vascular resistance (PVR), without other causes of pre-capillary hypertension such as lung diseases or chronic thromboembolic pulmonary hypertension.
    explanation: >-
      Defines the pre-capillary haemodynamic state of this node and its explicit exclusion of
      Group 3 and Group 4 pulmonary hypertension.
  downstream:
  - target: Precapillary Pulmonary Arterial Hypertension with Right Ventricular Failure
    description: >-
      Elevated resistance imposes a chronic pressure load on the right ventricle.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36603064
      reference_title: BMPR2 Mutation and Metabolic Reprogramming in Pulmonary Arterial Hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dysfunctional pulmonary arterial endothelial cells lose their ability to produce vasodilatory mediators, together leading to augmented pulmonary arterial smooth muscle cell responses, increased pulmonary vascular pressures and right ventricular afterload, and progressive right ventricular hypertrophy and heart failure.
      explanation: >-
        Carries the causal chain through to its terminal step: raised pulmonary vascular
        pressures and right ventricular afterload producing hypertrophy and heart failure.
        Evidence source is OTHER because the citation is a review synthesising animal-model
        and human data.
  - target: Right ventricular hypertrophy
    description: >-
      The chronically raised afterload imposed by elevated pulmonary vascular
      resistance drives compensatory hypertrophy of the right ventricular
      myocardium, the adaptive phase that precedes overt failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic right ventricular pressure overload
    - compensatory cardiomyocyte hypertrophy

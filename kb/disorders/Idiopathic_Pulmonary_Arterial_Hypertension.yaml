    reference_title: BMPR2 Mutation and Metabolic Reprogramming in Pulmonary Arterial Hypertension.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Compelling evidence from animal models suggests endothelial cell dysfunction is a key initial trigger of pulmonary vascular remodeling, which is characterised by hyperproliferation and early apoptosis followed by enrichment of apoptosis-resistant populations.
    explanation: >-
      Establishes endothelial dysfunction as the conserved initiating cellular lesion of
      pulmonary vascular remodeling. Evidence source is OTHER because this is a review
      synthesising animal-model and human data.
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathophysiology of PAH involves the following four primary pathways: nitric oxide, endothelin-1, prostacyclin, and activin/bone morphogenetic protein (BMP).
    explanation: >-
      Names the four endothelium-centred signalling axes whose imbalance defines this node and
      which the approved therapies target.
  downstream:
  - target: Pulmonary Artery Smooth Muscle Cell Proliferation and Vasoconstriction
    description: >-
      Loss of endothelium-derived vasodilator and antiproliferative signalling
      releases the medial smooth muscle compartment.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36603064
      reference_title: BMPR2 Mutation and Metabolic Reprogramming in Pulmonary Arterial Hypertension.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dysfunctional pulmonary arterial endothelial cells lose their ability to produce vasodilatory mediators, together leading to augmented pulmonary arterial smooth muscle cell responses, increased pulmonary vascular pressures and right ventricular afterload, and progressive right ventricular hypertrophy and heart failure.
      explanation: >-
        States the causal step this edge asserts - loss of endothelial vasodilator production
        leading to augmented smooth muscle responses - rather than merely describing either
        node. Evidence source is OTHER because the citation is a review synthesising
        animal-model and human data.
  - target: T and NK Cell CCL5-Mediated Immune-Vascular Crosstalk
    description: >-
      Injured endothelium participates in chemokine-mediated recruitment of

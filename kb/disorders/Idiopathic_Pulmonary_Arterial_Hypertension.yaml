      snippet: >-
        Accumulation of immune cells in remodeled pulmonary arterioles is a common finding in IPAH lung tissue
      explanation: >-
        The primary lesion of IPAH is in the pulmonary arterial circulation within lung tissue,
        so the entry also belongs to Harrison's respiratory Part.
has_subtypes:
- name: Classical IPAH
  display_name: Classical IPAH (no cardiopulmonary comorbidities, preserved DLCO)
  description: >-
    The canonical IPAH phenotype: younger, predominantly female patients without
    cardiopulmonary comorbidities and with a diffusing capacity for carbon monoxide
    (DLCO) of 45% predicted or more. This subgroup shows the largest treatment
    response to PAH pathway therapy.
  evidence:
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients with classical IPAH (defined by the absence of cardiopulmonary comorbidities and a DLCO of 45% or more predicted)
    explanation: >-
      The COMPERA/ASPIRE registry analysis defines classical IPAH explicitly by absence of
      cardiopulmonary comorbidities and preserved DLCO.
- name: Lung phenotype IPAH
  display_name: IPAH with a lung phenotype (low DLCO, smoking history)
  description: >-
    An emerging IPAH subgroup that meets diagnostic criteria for IPAH but has a
    severely reduced DLCO (<45% predicted) and a smoking history, with normal or
    near-normal spirometry and little or no parenchymal lung disease on CT. These
    patients are older, far less female-predominant, and respond poorly to PAH
    therapy, resembling Group 3 pulmonary hypertension more than classical IPAH.
  evidence:
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients meeting diagnostic criteria for idiopathic pulmonary arterial hypertension (IPAH), there is an emerging lung phenotype characterised by a low diffusion capacity for carbon monoxide (DLCO) and a smoking history.
    explanation: >-
      This directly establishes the low-DLCO smoking-associated lung phenotype as a distinct
      subgroup within diagnostically defined IPAH.
  - reference: PMID:35777416
    reference_title: "Phenotyping of idiopathic pulmonary arterial hypertension: a registry analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with IPAH and a lung phenotype had normal or near normal spirometry, a severe reduction in DLCO, with the majority having no or a mild degree of parenchymal lung involvement on chest computed tomography.
    explanation: >-
      Characterises the physiological and radiological signature that separates this subgroup
      from Group 3 pulmonary hypertension due to overt lung disease.
- name: Vasoresponder IPAH
  display_name: Acutely vasoreactive, long-term calcium-channel-blocker-responsive IPAH
  description: >-
    A small IPAH subgroup identified by acute pulmonary vasodilator testing at
    diagnostic right-heart catheterisation. Roughly one in eight IPAH patients is an
    acute responder, but fewer than 10% sustain long-term benefit on calcium-channel
    blocker monotherapy. Long-term responders have an excellent prognosis, making
    vasoreactivity testing a distinctive and clinically decisive step in IPAH (and
    heritable/drug-associated PAH) that is not applied across other PH groups.
  evidence:
  - reference: PMID:15939821
    reference_title: Long-term response to calcium channel blockers in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 70 patients who displayed acute pulmonary vasoreactivity (12.6%; 95% CI, 9.8% to 15.3%) and received CCB therapy, only 38 showed long-term improvement (6.8%; 95% CI, 4.7% to 8.9%).
    explanation: >-
      Quantifies both the acute-vasoreactive and the durable calcium-channel-blocker-responsive
      fractions of an IPAH referral cohort.
  - reference: PMID:15939821
    reference_title: Long-term response to calcium channel blockers in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term CCB responders represent <10% of IPAH patients evaluated in a pulmonary vascular referral center.
    explanation: >-
      Establishes the small size of the durable vasoresponder subgroup within IPAH.

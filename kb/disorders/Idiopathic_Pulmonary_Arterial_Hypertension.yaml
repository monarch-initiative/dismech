- name: Prostacyclin pathway therapy
  description: >-
    Epoprostenol, treprostinil, iloprost and the oral prostacyclin receptor agonist
    selexipag restore prostacyclin signalling. Parenteral prostacyclin, especially
    intravenous epoprostenol, is added for high-risk disease, and efficacy is greater
    with parenteral than with non-parenteral therapy.

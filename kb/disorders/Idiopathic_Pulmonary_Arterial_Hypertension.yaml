- name: Absence of a recognised drug, toxin or associated-disease exposure
  influences_mechanisms:
  - target: Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
    environmental_effect: MODULATES
    causal_link_type: DIRECT
    description: >-
      The strangest link in this backfill and worth stating plainly: this
      records a classification criterion, not a mechanism. The exposure is an
      absence, so it cannot act on anything, and the node it targets is
      described by this entry as epistemic rather than biological, holding the
      fact that no cause has been found. Absence and node are therefore the
      same statement, which is why the link is direct, and modulating is used
      because no other value in the enum is honest for something that decides
      which entity you are looking at rather than what happens inside it.
      Identifying such an exposure moves the case out of this entry entirely.

differential_diagnoses:
- name: Heritable pulmonary arterial hypertension
  description: >-
    Clinically and mechanistically indistinguishable from IPAH at presentation; the
    distinction rests entirely on family history or on identification of a
    pathogenic germline variant. Because penetrance is incomplete and sex-dependent,
    a substantial minority of apparently idiopathic patients are genetically
    heritable.
  distinguishing_features:
  - A pathogenic or likely pathogenic germline variant in a curated PAH gene reclassifies IPAH as heritable PAH.
  - Pooled genetic testing finds pathogenic BMPR2 variants in roughly 18% of patients diagnosed as IPAH.
  - Family history may be absent in genetically heritable disease because of incomplete, age- and sex-dependent penetrance.
  disease_term:
    preferred_term: heritable pulmonary arterial hypertension
    term:
      id: MONDO:0017148
      label: heritable pulmonary arterial hypertension
  evidence:
  - reference: PMID:36302552
    reference_title: "Genetic counselling and testing in pulmonary arterial hypertension: a consensus statement on behalf of the International Consortium for Genetic Studies in PAH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benefits of including molecular genetic testing within the management protocol of patients with PAH include the identification of individuals misclassified by other diagnostic approaches
    explanation: >-
      Supports genetic testing as the discriminator between idiopathic and heritable PAH.
- name: Drug- or toxin-induced pulmonary arterial hypertension
  description: >-
    Group 1 PAH attributable to a culprit exposure. Exposure history is the sole
    discriminator; the downstream vascular pathology is shared.
  distinguishing_features:
  - A documented exposure to a definite PAH-associated drug or toxin (anorexigens, methamphetamine, dasatinib) excludes the idiopathic designation.
  - Some drug-induced disease is partly reversible after withdrawal of the culprit agent, which has no counterpart in IPAH.
  disease_term:
    preferred_term: drug- or toxin-induced pulmonary arterial hypertension
    term:
      id: MONDO:0017149
      label: drug- or toxin-induced pulmonary arterial hypertension
  evidence:
  - reference: PMID:29417823
    reference_title: "Drug-induced pulmonary arterial hypertension: a primer for clinicians and scientists."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although the clinical manifestation, pathology, and hemodynamic profile of D-PAH are indistinguishable from other forms of pulmonary arterial hypertension, its clinical course can be unpredictable and to some degree dependent on removal of the offending agent.
    explanation: >-
      Supports both distinguishing features recorded here: the presentation and pathology do
      not separate drug-induced from idiopathic disease, so exposure history is the
      discriminator, and the partial dependence of course on withdrawal of the culprit agent
      has no counterpart in IPAH.
- name: Pulmonary hypertension due to lung disease or hypoxia
  description: >-
    WHO Group 3 pulmonary hypertension. The IPAH lung phenotype (low DLCO, smoking
    history) sits at the boundary: these patients satisfy IPAH haemodynamic and
    spirometric criteria but resemble Group 3 disease in age, sex distribution,
    and poor treatment response.
  distinguishing_features:
  - Group 3 disease has overt obstructive or restrictive lung disease; the IPAH lung phenotype has normal or near-normal spirometry with little parenchymal involvement on CT.
  - Response to PAH therapy is poor in both the IPAH lung phenotype and Group 3 pulmonary hypertension, and markedly better in classical IPAH.
  disease_term:

progression:
- phase: Insidious onset with diagnostic delay
  notes: >-
    Symptoms at onset (exertional dyspnoea, fatigue) are nonspecific, so IPAH is
    frequently recognised only at an advanced stage.
  evidence:
  - reference: PMID:38797830
    reference_title: A new integrative analysis of histopathology and single cell RNA-seq reveals the CCL5 mediated T and NK cell interaction with vascular cells in idiopathic pulmonary arterial hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic pulmonary arterial hypertension (IPAH) is a devastating pulmonary vascular disease characterized by a progressive increase in pulmonary vascular resistance and right heart failure
    explanation: >-
      Establishes the progressive, right-heart-directed natural history of IPAH.
- phase: Progressive obstructive vascular disease and right heart failure
  notes: >-
    Untreated disease is relentlessly progressive; the historical median survival in
    the pre-targeted-therapy era was 2.8 years. Modern pathway-directed therapy
    improves haemodynamics, function and prognosis but does not reverse the
    underlying vascular remodeling.
  evidence:
  - reference: PMID:37376028
    reference_title: "Medical Management of Pulmonary Arterial Hypertension: Current Approaches and Investigational Drugs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the era of non-targeted agents, PAH had a very dismal prognosis with a median survival time of only 2.8 years.
    explanation: >-
      Documents the historical untreated natural history against which modern therapy is
      measured.
  - reference: PMID:37376028
    reference_title: "Medical Management of Pulmonary Arterial Hypertension: Current Approaches and Investigational Drugs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current targeted agents delay the progression of PAH but cannot fundamentally reverse pulmonary vascular remodeling.
    explanation: >-
      Supports the modelling of contemporary therapy as disease-modifying but not curative.
pathophysiology:
- name: Unidentified Initiating Insult in a Susceptible Pulmonary Vasculature
  biological_scale: ORGANISM
  role: trigger
  description: >-
    The defining feature of IPAH is that no associated condition, drug or toxin
    exposure, or family history explains the disease after a complete evaluation.
    This is an epistemic rather than a biological null: IPAH is best modelled as a
    threshold disorder in which incompletely characterised genetic susceptibility,
    epigenetic dysregulation, sex-hormone biology and acquired vascular stresses
    combine to cross a disease threshold, with no single trigger identifiable in the
    individual patient. This node substitutes for the disorder-specific trigger that
    heritable PAH (a germline BMPR2-pathway lesion) and drug- or toxin-induced PAH
    (a culprit exposure) each supply, and it is the reason IPAH is a diagnosis of
    exclusion.
  locations:
  - preferred_term: pulmonary artery
    term:
      id: UBERON:0002012
      label: pulmonary artery
  evidence:
  - reference: DOI:10.3390/biomedicines13071773
    reference_title: "State of the Art in Pulmonary Arterial Hypertension: Molecular Basis, Imaging Modalities, and Right Heart Failure Treatment"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of PAH cases are idiopathic; other common etiologies include connective tissue disease-associated PAH, congenital heart disease, and portopulmonary hypertension.
    explanation: >-
      Confirms that idiopathic disease - PAH without an identified associated cause - is the
      largest aetiological category within Group 1 PAH.
  - reference: PMID:36302552
    reference_title: "Genetic counselling and testing in pulmonary arterial hypertension: a consensus statement on behalf of the International Consortium for Genetic Studies in PAH."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary arterial hypertension (PAH) is a rare disease that can be caused by (likely) pathogenic germline genomic variants.
    explanation: >-
      Supports that an aetiological cause may be latent rather than absent in patients
      initially designated idiopathic; PARTIAL because the statement is PAH-wide.
  downstream:
  - target: Pulmonary Arterial Endothelial Dysfunction
    description: >-
      Whatever the unresolved initiating insult, the earliest identifiable lesion in
      IPAH is dysfunction of the pulmonary arterial endothelium.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Occult Rare Variant Burden and Reclassification to Heritable PAH
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    A substantial minority of patients who satisfy IPAH criteria are subsequently
    found on comprehensive PAH gene-panel or genome sequencing to carry a rare
    pathogenic or likely pathogenic germline variant - most often a loss-of-function
    BMPR2 allele, and less often variants in TBX4, ATP13A3, SOX17, GDF2, AQP1 or
    other curated PAH genes. Because incomplete, age- and sex-dependent penetrance
    means many carriers have no affected relative, absence of family history does not
    exclude a germline cause. Detecting such a variant reclassifies the patient as
    heritable PAH and opens cascade screening of relatives. This node is the explicit
    mechanistic boundary between this entry and Heritable Pulmonary Arterial
    Hypertension: it is not a separate remodeling mechanism but a statement that a
    fraction of the IPAH population is misclassified heritable disease.
  evidence:
  - reference: PMID:40229839
    reference_title: "The prevalence of pathogenic variants in the BMPR2 gene in patients with the idiopathic pulmonary arterial hypertension in the Russian population: sequencing data and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A meta-analysis, performed with MOOSE, included 24 studies involving 3124 IPAH patients and 470 P/LP variants.
    explanation: >-
      Establishes the scale of the pooled IPAH genetic-testing evidence underpinning this node.
  - reference: PMID:40229839
    reference_title: "The prevalence of pathogenic variants in the BMPR2 gene in patients with the idiopathic pulmonary arterial hypertension in the Russian population: sequencing data and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of 105 adult IPAH patients in Russia revealed 11 patients (10.48%) as carriers of pathogenic or likely pathogenetic (P/LP) BMPR2 variants.
    explanation: >-
      Directly documents occult pathogenic BMPR2 carriage within a clinically diagnosed IPAH
      cohort.
  - reference: PMID:36302552
    reference_title: "Genetic counselling and testing in pulmonary arterial hypertension: a consensus statement on behalf of the International Consortium for Genetic Studies in PAH."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Benefits of including molecular genetic testing within the management protocol of patients with PAH include the identification of individuals misclassified by other diagnostic approaches
    explanation: >-
      The international consensus explicitly frames genetic testing as a means of correcting
      misclassification, the mechanism modelled by this node.
  downstream:
  - target: Pulmonary Arterial Endothelial Dysfunction
    description: >-
      In the variant-positive fraction, reduced BMP receptor signalling is the
      identifiable molecular cause of the endothelial lesion, as in heritable PAH.
    causal_link_type: DIRECT
- name: Pulmonary Arterial Endothelial Dysfunction
  conforms_to: "pulmonary_vascular_remodeling#Pulmonary Endothelial Dysfunction and Impaired BMP Signaling"
  biological_scale: CELLULAR
  role: trigger
  description: >-
    Pulmonary arterial endothelial cells lose homeostatic function: BMP receptor
    signalling is reduced (by germline lesion in the occult-variant fraction, and by
    acquired suppression otherwise), nitric-oxide and prostacyclin production fall
    while endothelin-1 rises, barrier integrity is lost, and an apoptosis-prone
    population is replaced by apoptosis-resistant, hyperproliferative cells. This is
    the conserved entry point into the shared pulmonary vascular remodeling module;
    IPAH substitutes an unidentified or occult-genetic insult for the germline BMPR2
    lesion of heritable PAH.
  cell_types:
  - preferred_term: pulmonary artery endothelial cell
    term:
      id: CL:1001568
      label: pulmonary artery endothelial cell

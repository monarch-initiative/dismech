        Groups phosphodiesterase-5 inhibitors and soluble guanylate cyclase stimulators with
        the drug classes that improve haemodynamics. The haemodynamic gain is the measured
        consequence of relieving the vasoconstrictive component of this node, so the link
        follows by one inference step.

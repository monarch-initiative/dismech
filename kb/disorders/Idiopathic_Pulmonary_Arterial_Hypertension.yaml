name: Idiopathic Pulmonary Arterial Hypertension
creation_date: "2026-08-01T18:30:00Z"
category: Complex
disease_term:
  preferred_term: idiopathic pulmonary arterial hypertension
  term:
    id: MONDO:0001999
    label: idiopathic pulmonary arterial hypertension
parents:
- Pulmonary arterial hypertension
description: >-
  Idiopathic pulmonary arterial hypertension (IPAH) is the sporadic form of WHO
  Group 1 pulmonary arterial hypertension: pre-capillary pulmonary hypertension
  confirmed by right-heart catheterisation in which no associated condition, no
  culprit drug or toxin exposure, and no family history of pulmonary arterial
  hypertension can be identified. It is therefore defined jointly by positive
  haemodynamic findings and by exclusion of Groups 2-5 pulmonary hypertension
  and of the associated and drug- or toxin-induced Group 1 subtypes. "Idiopathic"
  denotes an unidentified cause, not an absent one: once vascular disease is
  established, IPAH converges on the same obstructive pulmonary vascular
  remodeling cascade shared with heritable and associated PAH, and a meaningful
  minority of patients labelled idiopathic are found on genetic testing to carry
  a rare pathogenic variant (most often in BMPR2), which reclassifies them as
  heritable PAH. IPAH shows a marked female predominance and, in modern
  registries, is clinically heterogeneous - spanning classical young, largely
  female disease, an older low-diffusing-capacity smoking-associated lung
  phenotype, and a small acutely vasoreactive subgroup with durable
  calcium-channel-blocker response.
synonyms:
- IPAH
- Idiopathic PAH
- Primary pulmonary hypertension
- Primary pulmonary arterial hypertension
- Sporadic primary pulmonary hypertension
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    evidence:

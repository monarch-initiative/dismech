      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary arterial hypertension (PAH) is a specific subset of PH characterized by a normal pulmonary arterial wedge pressure (PAWP), combined with elevated mPAP and increased pulmonary vascular resistance (PVR)
      explanation: >-
        PAH is defined by pulmonary vascular haemodynamics and culminates in right heart
        failure, placing IPAH in Harrison's cardiovascular Part.
  - classification_value: RESPIRATORY
    evidence:
    - reference: PMID:38797830
      reference_title: A new integrative analysis of histopathology and single cell RNA-seq reveals the CCL5 mediated T and NK cell interaction with vascular cells in idiopathic pulmonary arterial hypertension.
      supports: SUPPORT

genetic:
- name: ROR2 Truncating Variants Flanking the Tyrosine Kinase Domain
  gene_term:
    preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous nonsense, frameshift, and splice variants on 9q22 confined to
    two windows immediately before and after the intracellular tyrosine kinase
    domain. Distal truncations give a more severe phenotype than proximal ones.
    Whole-gene deletions do not cause BDB, and biallelic loss-of-function
    variants across the Frizzled-like, kringle, and kinase domains instead cause
    autosomal recessive Robinow syndrome — so the same gene yields two diseases
    through two different allele classes.
  evidence:
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations predict truncation of the protein within two distinct regions immediately before and after the TK domain, resulting in a complete or partial loss of the intracellular portion of the protein."
    explanation: Defines the two mutational windows in the BDB1 allele spectrum.
  - reference: PMID:10932186
    reference_title: Recessive Robinow syndrome, allelic to dominant brachydactyly type B, is caused by mutation of ROR2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nature of these mutations suggests that RRS is caused by loss of ROR2 activity."
    explanation: >-
      Contrasts the recessive loss-of-function allele class with the dominant
      BDB1 truncations, supporting the allele-class distinction.
  - reference: PMID:10932186
    reference_title: Recessive Robinow syndrome, allelic to dominant brachydactyly type B, is caused by mutation of ROR2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report homozygous missense mutations in both intracellular and extracellular domains of ROR2 in affected individuals from 3 unrelated consanguineous families"
    explanation: Documents the biallelic Robinow alleles distributed across multiple ROR2 domains.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Recognised clinically by terminal deficiency of digits II-V with absent or
    dysplastic nails and spared but broad thumbs; hand and foot radiographs show
    distal (and variably middle) phalangeal hypoplasia with symphalangism.
    Confirmation is by ROR2 sequencing. Because BDB1 alleles cluster in two
    narrow windows, an ROR2 whole-gene deletion found on array is evidence
    against BDB rather than for it, and an ROR2-negative patient with proximal
    symphalangism and carpal synostosis should be tested for NOG (type B2).
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Hypoplastic or absent distal phalanges and nails of digits II-V with spared
    thumbs, plus a truncating ROR2 variant flanking the tyrosine kinase domain.
  evidence:
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is clinical, anthropometric and radiological."
    explanation: Establishes the clinical-radiographic basis of brachydactyly diagnosis.
  - reference: PMID:17668388
    reference_title: A new subtype of brachydactyly type B caused by point mutations in the bone morphogenetic protein antagonist NOGGIN.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subset of ROR2-negative patients with BDB, clinically defined by the additional occurrence of proximal symphalangism and carpal synostosis, we identified six different point mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP) antagonist NOGGIN (NOG)."
    explanation: Defines the clinical trigger for testing NOG when ROR2 is negative.
treatments:

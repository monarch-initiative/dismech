      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Brachydactyly type B (BDB1) and Robinow syndrome (RRS) are two skeletal disorders caused by mutations in ROR2, a co-receptor of Wnt5a."
      explanation: Places ROR2 in the WNT5A non-canonical signalling axis relevant to both disorders.
- name: Disrupted WNT5A-ROR2 Planar Cell Polarity Signaling in the Digital Ray
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  biological_scale: CELLULAR
  description: >
    WNT5A/ROR2 can feed several non-canonical branches; mouse genetics implicates
    the planar cell polarity (PCP) branch in the limb. Mutation of the PCP gene
    Vangl2 produces digit defects that resemble BDB1, including loss of
    phalanges, and lowering Wnt5a dosage in Vangl2 mutants worsens them.
    Mechanistically, PCP loss changes the shape of the early limb bud and of the
    digit pre-chondrogenic condensates — wider, thicker, shorter — and perturbs
    the FGF/BMP balance that regulates limb growth. That an aberrant increase in
    BMP signalling is the proximate cause of the brachydactyly is supported by
    the rescue: halving Bmp4 dosage partially suppresses the phalangeal loss.
    This is where the ROR2 and BMP-pathway brachydactylies converge.
  biological_processes:
  - preferred_term: Establishment of Planar Polarity
    term:
      id: GO:0001736
      label: establishment of planar polarity
    modifier: DECREASED
  - preferred_term: BMP Signaling Pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: INCREASED
  - preferred_term: Embryonic Digit Morphogenesis
    term:

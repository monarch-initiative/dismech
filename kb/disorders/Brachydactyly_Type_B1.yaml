      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with variable severity, described in multigenerational
    pedigrees since MacKinder. A single homozygous individual, the offspring of
    two affected parents, has been reported with a far more severe reduction
    deformity, indicating a gene-dosage effect on top of the dominant trait.
  evidence:

pathophysiology:
- name: Truncated ROR2 Receptor with a Specific Mutational Effect
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  biological_scale: MOLECULAR
  description: >
    ROR2 is a 943-residue orphan receptor tyrosine kinase that acts as a
    co-receptor for WNT5A. BDB1 alleles are nonsense, frameshift, or splice
    variants confined to two narrow windows flanking the intracellular tyrosine
    kinase domain, removing part or all of the intracellular portion of the
    protein. Two lines of evidence show this is not haploinsufficiency:
    individuals heterozygous for 9q22 deletions that remove ROR2 entirely have no
    BDB, and Ror2 heterozygous null mice are normal. The truncated receptor is
    therefore doing something a missing receptor does not — the localised
    clustering of the alleles points to a specific gain of function or
    dominant-interfering effect. Position within the window grades severity:
    distal truncations produce a more severe phenotype than proximal ones.
  gene:
    preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  biological_processes:
  - preferred_term: Non-canonical Wnt Signaling Pathway
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Prechondrogenic Mesenchymal Cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  evidence:
  - reference: PMID:10700182
    reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified distinct heterozygous mutations (2 nonsense, 1 frameshift) within a 7-amino-acid segment of the 943-amino-acid protein, all of which predict truncation of the intracellular portion of the protein immediately after the tyrosine kinase domain."
    explanation: Establishes the tight positional clustering of BDB1 alleles.
  - reference: PMID:10700182
    reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We obtained further evidence for this by demonstrating that two patients heterozygous for 9q22 deletions including ROR2 do not exhibit BDB."
    explanation: Whole-gene deletion carriers without BDB exclude haploinsufficiency as the mechanism.
  - reference: PMID:10700182
    reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The localized nature of these mutations suggests that they confer a specific gain of function."
    explanation: States the authors' interpretation of the allele clustering.
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients affected with the distal mutations have a more severe phenotype than do those with the proximal mutation."
    explanation: Documents the position-severity gradient within the mutational window.
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The BDB phenotype, as well as the location and the nature of the BDB mutations, suggests a specific mutational effect that cannot be explained by simple haploinsufficiency and that is distinct from that in Robinow syndrome."
    explanation: Separates the BDB allele class from the recessive Robinow loss-of-function class.
  downstream:
  - target: Disrupted WNT5A-ROR2 Planar Cell Polarity Signaling in the Digital Ray
    description: >-
      The truncated co-receptor perturbs the WNT5A-ROR2 branch of non-canonical
      Wnt signalling that shapes the limb bud and its digital condensations.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20962035

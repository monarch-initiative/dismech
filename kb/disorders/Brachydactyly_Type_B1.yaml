    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The nature of genetic counseling depends both on the pattern of inheritance of the type of brachydactyly present in the family and on the presence or absence of accompanying symptoms."
    explanation: Supports inheritance- and phenotype-specific counseling.
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His phenotype resembles an extreme form of brachydactyly, with extensive hypoplasia of the phalanges and metacarpals/metatarsals and absence of nails."
    explanation: Documents the severe homozygous outcome relevant to counseling two affected partners.
- name: Reconstructive Hand Surgery
  description: >-
    BDB1 is the most severe isolated brachydactyly and is one of the forms in
    which surgery is genuinely function-directed rather than cosmetic; the
    homozygous patient in the original series regained the ability to write after
    several orthopaedic hand operations.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After several orthopedic operations he has become able to use his hand to write."
    explanation: A functional gain after reconstructive hand surgery in the severest reported case.
  - reference: PMID:18554391
    reference_title: Brachydactyly.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Plastic surgery is only indicated if the brachydactyly affects hand function or for cosmetic reasons, but is typically not needed."
    explanation: >-
      The general rule that brachydactyly surgery is reserved for functional
      impairment; PARTIAL because it addresses the brachydactylies collectively
      rather than the severe BDB case specifically.

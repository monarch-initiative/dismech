    reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly type B (BDB), an autosomal dominant disorder, is the most severe of the brachydactylies and characterized by terminal deficiency of the fingers and toes."
    explanation: States the dominant inheritance and the severity rank of BDB among the brachydactylies.
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our analysis includes the first description of homozygous BDB in an individual with a 5-bp deletion proximal to the TK domain."
    explanation: The homozygous case documents dosage sensitivity beyond simple dominance.
classifications:
  isds_skeletal_category:
  - classification_value: brachydactyly_without_extraskeletal_manifestations
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 18 "Brachydactylies (isolated)", which lists
      brachydactyly type B (ROR2; OMIM 113000). The NOG-related type B2 is a
      separate row in the same group and is curated separately as
      Brachydactyly Type B2; recessive Robinow syndrome, the other ROR2 disease,
      is not in this group. The 2019 revision (PMID:31633310) placed type B in
      group 37 "Brachydactylies (without extraskeletal manifestations)". Per-row
      re-verification against the 2023 Table 1 is tracked in
      monarch-initiative/dismech#7867.

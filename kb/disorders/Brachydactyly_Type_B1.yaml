      label: chondrocyte
  evidence:
  - reference: PMID:20962035
    reference_title: Disruption of PCP signaling causes limb morphogenesis and skeletal defects and may underlie Robinow syndrome and brachydactyly type B.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that a mutation in the mouse PCP gene Vangl2 causes digit defects resembling the clinical phenotypes in BDB1, including loss of phalanges."
    explanation: A PCP-pathway mouse mutant phenocopies the defining BDB1 phalangeal loss.
  - reference: PMID:20962035
    reference_title: Disruption of PCP signaling causes limb morphogenesis and skeletal defects and may underlie Robinow syndrome and brachydactyly type B.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The digit pre-chondrogenic condensates also become wider, thicker and shorter."
    explanation: Identifies the cellular change in the digital condensation caused by PCP disruption.
  - reference: PMID:20962035
    reference_title: Disruption of PCP signaling causes limb morphogenesis and skeletal defects and may underlie Robinow syndrome and brachydactyly type B.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Halving the dosage of Bmp4 partially suppresses the loss of phalanges in Vangl2 mutants, supporting the hypothesis that an aberrant increase in Bmp signaling is the cause of the brachydactyly defect."
    explanation: Genetic rescue identifies excess BMP signalling as the proximate cause of phalangeal loss.
  downstream:
  - target: Terminal Deficiency of Digits II-V
    description: >-
      Shortened, mis-shapen digital condensates fail to form the distal skeletal
      elements and their overlying nail units.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered limb-bud and condensate geometry
    - aberrant increase in BMP signalling
    evidence:
    - reference: PMID:10700182
      reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "BDB arises as a primary defect of skeletal patterning"
      explanation: Limb-bud Ror2 expression places the lesion in skeletal patterning rather than later growth.
- name: Terminal Deficiency of Digits II-V
  conforms_to: "limb_digit_patterning_serial_homology#Serially Homologous Autopod Malformation"
  role: consequence
  biological_scale: TISSUE
  description: >
    The realised malformation. Distal phalanges and nails of digits II-V are
    hypoplastic or absent, with variable middle-phalanx hypoplasia and distal or
    proximal symphalangism; thumbs and halluces are spared but often broad or
    partially duplicated. The deficit is symmetric, worse on the ulnar than the
    radial side, and milder in the feet than the hands. Because nail and distal
    phalanx develop as one apical unit, anonychia accompanies the bony deficiency
    rather than being a separate ectodermal disease.
  biological_processes:
  - preferred_term: Limb Morphogenesis
    term:
      id: GO:0035108
      label: limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10986040
    reference_title: Distinct mutations in the receptor tyrosine kinase gene ROR2 cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "readily distinguished from other brachydactylies by the characteristic shortening/hypoplasia of the distal phalanges, the occurrences of nail dysplasia, hypoplasia of middle phalanges, and variable degrees of distal and proximal symphalangism."
    explanation: Defines the composite BDB skeletal and nail phenotype.
  - reference: PMID:10700182
    reference_title: Dominant mutations in ROR2, encoding an orphan receptor tyrosine kinase, cause brachydactyly type B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the typical form of BDB, the thumbs and big toes are spared, sometimes with broadening or partial duplication."
    explanation: Documents thumb and hallux sparing as part of the pattern.

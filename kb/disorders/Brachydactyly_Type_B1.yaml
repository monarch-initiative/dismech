name: Brachydactyly Type B1
synonyms:
- BDB1
- Brachydactyly type B
- ROR2-related brachydactyly type B
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type B1 (BDB1) is the most severe of the isolated
  brachydactylies: an autosomal dominant terminal deficiency in which the distal
  phalanges and nails of fingers and toes II-V are hypoplastic or absent, the
  middle phalanges are variably short, and symphalangism, cutaneous syndactyly,
  and carpal/tarsal fusions are common. The thumbs and halluces are
  characteristically spared, though often broad, split, or partially duplicated,
  and the ulnar rays are affected more severely than the radial. BDB1 is caused
  by heterozygous truncating variants in ROR2, a co-receptor for WNT5A in
  non-canonical Wnt signalling. Crucially the alleles are not simple null
  alleles: they cluster in two narrow segments immediately before and after the
  intracellular tyrosine kinase domain, and carriers of whole-gene 9q22 deletions
  do not have BDB — so the mechanism is a specific mutational effect of the
  truncated receptor, not haploinsufficiency. Biallelic loss of ROR2 function
  instead causes autosomal recessive Robinow syndrome, making ROR2 an instructive
  example of two distinct diseases from one gene by two distinct allele classes.

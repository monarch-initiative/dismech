      Drainage removes the liquefied caseous material.
    evidence:
    - reference: PMID:24976240
      reference_title: Hepatobiliary tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In addition to chemotherapy, good clinical responses have also been
        reported in tuberculous liver abscess after percutaneous aspiration and
        drainage of the abscess plus antituberculous treatment
      explanation: >-
        Reports good responses to drainage plus chemotherapy.
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In addition to chemotherapy, good clinical responses have also been
      reported in tuberculous liver abscess after percutaneous aspiration and
      drainage of the abscess plus antituberculous treatment
    explanation: >-
      Supports drainage of tuberculous liver abscess with chemotherapy.
- name: Hepatic resection for tuberculoma
  description: >-
    Segmentectomy or hepatectomy, used when a nodular lesion cannot be told
    from a tumour or responds poorly, followed by chemotherapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: hepatectomy
    term:
      id: NCIT:C15249
      label: Hepatectomy
  target_mechanisms:
  - target: Caseous Necrosis and Coalescence into Tuberculomas
    treatment_effect: INHIBITS
    description: >-
      Resection removes the tuberculoma.
    evidence:
    - reference: PMID:24976240
      reference_title: Hepatobiliary tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Since the definite diagnosis is often difficult and occult malignancy
        is possible, surgical intervention with hepatectomy is an alternative
        option in treating nodular hepatic TB when necessary.
      explanation: >-
        Supports hepatectomy for nodular hepatic tuberculosis.
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Since the definite diagnosis is often difficult and occult malignancy is
      possible, surgical intervention with hepatectomy is an alternative
      option in treating nodular hepatic TB when necessary.
    explanation: >-
      Supports hepatectomy for nodular hepatic tuberculosis.
- name: Biliary decompression
  description: >-
    For obstructive jaundice, biliary decompression by stent at ERCP,
    percutaneous transhepatic biliary drainage or surgery, in addition to
    chemotherapy; some patients need long-term stenting.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: biliary stenting
    term:
      id: NCIT:C62741
      label: Biliary Stenting
  target_mechanisms:
  - target: Porta Hepatis Tuberculous Lymphadenitis

  description: >-
    An active tuberculous focus outside the liver, usually in the lungs and
    less often in the gastrointestinal tract, from which bacilli reach the
    liver. Hepatic tuberculosis is almost always secondary to such a focus.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung

- name: Antituberculosis Drug-Induced Liver Injury
  role: treatment complication
  description: >-
    Isoniazid, rifampicin and pyrazinamide are hepatotoxic, and drug-induced
    liver injury is the commonest serious adverse effect of standard therapy,
    reported in 2 to 28% of treated tuberculosis patients. Pre-existing liver

    snippet: >-
      Hepatobiliary tuberculosis is a rare manifestation of Mycobacterium
      tuberculosis infection and is usually secondary to tuberculosis of the
      lungs or gastrointestinal tract.
    explanation: >-
      Places a lung or gut focus upstream of hepatic disease.
  downstream:

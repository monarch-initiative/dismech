name: Hepatic Tuberculosis
creation_date: "2026-11-26T18:22:29Z"
description: >-
  Hepatic tuberculosis is infection of the liver by Mycobacterium
  tuberculosis. It takes two main forms. In the miliary form, about four in
  five reported cases, bacilli from a pulmonary focus reach the liver through
  the hepatic artery during disseminated disease and seed it diffusely with
  small tubercles. In the local form, bacilli reach the liver mainly through
  the portal vein from a gastrointestinal focus and produce larger nodules
  near the portal triads, which can coalesce into tuberculomas (pseudotumours)
  or liquefy into tuberculous liver abscesses. A tubular or biliary form,
  in which granulomas or enlarged porta hepatis lymph nodes involve the bile
  ducts, causes strictures and obstructive jaundice. In every form the liver
  responds with epithelioid granulomas, typically caseating. Presentation is
  nonspecific: hepatomegaly, fever, abdominal pain, weight loss and an
  infiltrative liver test pattern with a disproportionately raised alkaline
  phosphatase. Jaundice suggests biliary or nodal involvement. Imaging
  (ultrasound, and contrast-enhanced CT as the most sensitive test) shows
  micronodules, hepatomegaly, solitary or few low-density nodules with
  calcification, abscesses or hilar strictures, and local disease is often
  mistaken for a liver tumour. Diagnosis rests on liver biopsy with
  histology, acid-fast staining, mycobacterial culture and PCR. Treatment is
  standard multidrug antituberculous chemotherapy, with drainage or resection
  for some abscesses and tuberculomas and biliary decompression for
  obstructive jaundice. Isoniazid, rifampicin and pyrazinamide are
  themselves hepatotoxic, so drug-induced liver injury must be watched for in
  a liver already involved by disease.
category: Infectious Disease
disease_term:
  preferred_term: hepatic tuberculosis
  term:
    id: MONDO:0005787
    label: hepatic tuberculosis
parents:
- Tuberculosis
- Extrapulmonary Tuberculosis
- Abdominal Tuberculosis
synonyms:
- tuberculosis of liver
- hepatobiliary tuberculosis
- tuberculous hepatitis
- liver tuberculosis
notes: >-
  The literature is made of small case series (the largest are 130, 96 and 41
  patients, from the Philippines and South Africa, before or early in the HIV
  era), one systematic review that pooled 14 series (618 patients), a
  narrative review and case reports; there are no trials of treatment
  specific to the liver. Frequencies here are medians across series from the
  systematic review or figures from single series, and vary widely between
  series. Scope: the entry covers the miliary (diffuse) hepatic form, the
  local form (tuberculoma, pseudotumour and tuberculous liver abscess) and
  the tubular or biliary form, including obstructive jaundice from porta
  hepatis lymph nodes. Miliary hepatic involvement is one organ of
  disseminated tuberculosis; whole-body disseminated disease belongs to the
  Miliary_Tuberculosis entry (in progress separately), and this entry records
  only the liver's part of it. Hepatosplenic tuberculosis is in scope where
  the liver is involved: splenomegaly is recorded as a phenotype, and dismech
  has no entry or stub for splenic tuberculosis alone, which this entry does
  not cover. Gallbladder tuberculosis, tuberculous peritonitis and abdominal
  tuberculosis as a whole are out of scope. No source found for this entry
  names Mycobacterium bovis as a cause of hepatic tuberculosis, so no cattle
  reservoir is recorded; a PubMed title search for hepatic or liver
  tuberculosis with bovis returned no human hepatic series. The
  drug-induced liver injury caveat for isoniazid, rifampicin and pyrazinamide
  is sourced from general tuberculosis statements (the American Thoracic
  Society statement and a review); the systematic review of hepatic
  tuberculosis states that its incidence in hepatic tuberculosis itself has
  been poorly studied. Splenomegaly, ascites, abdominal distension,
  anaemia, generalized lymphadenopathy, hypoalbuminaemia and
  hyperbilirubinaemia are recorded without a causal edge because the cited
  sources report their frequency without saying which mechanism produces
  them. Seeded from
  `research/Hepatic_Tuberculosis-deep-research-claude_code.md` and PubMed
  searches.
review_notes: >-
  Deliberately lumped. The miliary (diffuse), local (tuberculoma, pseudotumour
  and abscess) and tubular (biliary) hepatic forms are kept in one entry as
  clinical-form subtypes rather than separate entries. A direct comparison of
  22 patients found the miliary and local forms clinically and
  pathologically similar, all forms share the caseating hepatic granuloma,
  the biopsy-based diagnostic pathway and standard four-drug chemotherapy,
  and they differ mainly in route of seeding, imaging and the need for
  drainage, resection or biliary decompression, which the subtypes record. No
  organism stratum is recorded: PubMed was searched for hepatic and
  hepatobiliary tuberculosis titles and the deep-research report was
  checked, and every hepatic series identifies M. tuberculosis without a
  species, lineage or drug-resistance stratum carrying its own presentation
  or first-line therapy.
has_subtypes:
- name: Miliary
  display_name: Miliary (diffuse) hepatic tuberculosis
  classification: clinical_form
  description: >-
    Hepatic involvement in disseminated tuberculosis, about four in five
    reported cases. Bacilli from a pulmonary focus reach the liver through the
    hepatic artery and seed the lobules with tubercles of 0.6 to 2 mm.
    Respiratory symptoms are more common, CT shows dispersed low-density
    micronodules or hepatomegaly alone, and liver biopsy is less helpful than
    in local disease. Massive miliary seeding can cause acute liver failure.
  subtype_frequency: FREQUENT
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Among reported hepatic TB cases, miliary form accounted for 79% of
      cases, while local hepatic TB accounted for 21% of cases
    explanation: >-
      Pooled share of miliary and local forms across the reviewed case series.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Miliary hepatic TB, which has smaller tubercles, is visualized on a CT
      scan as multiple, low-density micronodules dispersed throughout the
      liver
    explanation: >-
      Distinguishes the CT appearance of the miliary form from the local form.
- name: Local
  display_name: Local hepatic tuberculosis (tuberculoma, pseudotumour or abscess)
  classification: clinical_form
  description: >-
    Isolated or predominant liver disease, about one in five reported cases,
    usually without active pulmonary disease. Bacilli reach the liver mainly
    through the portal vein from a gastrointestinal focus and form tubercles
    larger than 2 mm near the portal triads, which coalesce into
    tuberculomas or liquefy into abscesses. CT shows one or a few large
    low-density nodules with calcification and peripheral enhancement, the
    lesion is often taken for a liver tumour, liver biopsy is more helpful,
    and abscess drainage or resection is considered in addition to
    chemotherapy. Tuberculous abscesses respond less well to chemotherapy.
  subtype_frequency: OCCASIONAL
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In local hepatic TB, which has also been called tuberculoma,
      macronodular hepatic TB, or pseudotumoral hepatic TB, dissemination
      primarily occurs via the portal vein from a focus in the
      gastrointestinal tract
    explanation: >-
      Defines the local form and its portal-venous route.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In contrast to miliary hepatic TB, those with local hepatic TB do not
      generally have evidence of active pulmonary disease
    explanation: >-
      Records that the local form usually lacks active lung disease.
  - reference: PMID:14600128
    reference_title: "The nodular form of hepatic tuberculosis: a review with five additional new cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All five patients (44-71 years old; two women, three men) underwent
      surgery, and had a preoperative diagnosis of malignant hepatic neoplasm
      and a postoperative histological diagnosis of chronic granulomatous
      inflammation, suggestive of tuberculosis.
    explanation: >-
      In five patients with the nodular form, every lesion was taken for a
      malignant liver tumour before surgery.
  - reference: PMID:19581768
    reference_title: "[Clinical features of hepatic tuberculosis in biopsy-proven cases]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Patients with tuberculous abscess formation tend to respond poorly to
      antituberculosis therapy, and surgery could be considered in these
      patients.
    explanation: >-
      In 12 biopsy-proven cases, the two with tuberculous liver abscess had
      persistent disease despite prolonged therapy.
- name: Tubular
  display_name: Tubular (biliary) hepatic tuberculosis
  classification: clinical_form
  description: >-
    Involvement of the bile ducts, by tuberculous cholangitis and
    pericholangitis, by granulomas rupturing into the ducts, or more often by
    enlarged porta hepatis lymph nodes compressing them. It presents with
    obstructive jaundice and hilar or common hepatic duct strictures that
    mimic cholangiocarcinoma or pancreatic cancer, and it needs biliary
    decompression by stent or percutaneous drainage as well as
    chemotherapy. In one prospective series of 38 patients with
    hepatobiliary tuberculosis, 15 had biliary disease, 12 of them from
    lymph node masses.
  evidence:
  - reference: PMID:18603675
    reference_title: Hepatobiliary tuberculosis in western India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      (B) biliary TB [15 (39.4%)]: (1) biliary strictures - 2 (5.2%), (2) gall
      bladder involvement - 1 (2.6%) and (3) biliary obstruction due to lymph
      node masses - 12 (31.5%)
    explanation: >-
      Counts the biliary forms in a prospective series, most of them nodal
      biliary obstruction.
  - reference: PMID:18360350
    reference_title: "Hepatobiliary tuberculosis: a review of presentations and outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three patients with biliary involvement required long-term biliary
      stenting.
    explanation: >-
      Biliary disease in a 14-patient series needed long-term stenting, a
      management step the other forms do not need.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes pulmonary tuberculosis
    and, after spread through the blood or portal circulation, granulomatous
    infection of the liver.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis (TB) infection of the liver, known as hepatic
      TB, is an extrapulmonary manifestation of TB.
    explanation: >-
      Names M. tuberculosis as the agent of hepatic tuberculosis.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans by airborne droplets and establishes
    a primary infection, usually in the lungs and less often in the
    gastrointestinal tract. Bacilli reach the liver through the hepatic artery
    in disseminated disease or through the portal vein from a gut focus.
    Congenital infection through the umbilical vein from a tuberculous
    placenta is rare. Humans are the reservoir.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous bacilli can reach the liver via hematogenous dissemination,
      generally from the lungs, or by local spread from the gastrointestinal
      tract
    explanation: >-
      Gives the two routes by which bacilli reach the liver.
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous hepatic infections are transmitted prenatally, perinatally
      and postnatally. Prenatally and perinatally tuberculous hepatic
      infections are transmitted via the umbilical vein or the amniotic fluid
      and presence of maternal placenta tuberculosa is a precondition for both
      infections.
    explanation: >-
      Describes congenital hepatic infection from a tuberculous placenta.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition with secondary spread to the liver
  description: >-
    The infection is acquired by inhaling airborne bacilli from a person with
    pulmonary tuberculosis. Hepatic disease is secondary to the pulmonary or
    gastrointestinal focus, reached through the hepatic artery or portal vein.
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hepatobiliary tuberculosis is a rare manifestation of Mycobacterium
      tuberculosis infection and is usually secondary to tuberculosis of the
      lungs or gastrointestinal tract.
    explanation: >-
      Places hepatic disease downstream of a lung or gut focus.
- name: Congenital transmission from a tuberculous placenta
  description: >-
    Rarely, the fetal liver is infected through the umbilical vein or
    amniotic fluid when the mother has placental tuberculosis.
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Prenatally and perinatally tuberculous hepatic infections are
      transmitted via the umbilical vein or the amniotic fluid and presence of
      maternal placenta tuberculosa is a precondition for both infections.
    explanation: >-
      Names the umbilical-vein and amniotic routes of congenital hepatic
      infection.
prevalence:
- population: Patients with active tuberculosis (South African and Taiwanese hospital series)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Hepatic tuberculosis was diagnosed in 1.2% (96/8,342) of patients with
    active tuberculosis in a South African hospital and 0.8% (10/1,251) in a
    Taiwanese one. This is the share of tuberculosis cases with hepatic
    disease, not a population prevalence, so no rate is asserted. The
    systematic review extrapolates about 87,000 new cases a year worldwide
    from these figures.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Essop et al. diagnosed hepatic TB by liver biopsy and/or autopsy in 1.2%
      (96/8,342) of all patients with active TB in a South African hospital,
      some of whom might have been HIV-positive
    explanation: >-
      Share of active tuberculosis cases with hepatic disease in one hospital.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      suggests there may be approximately 87,000 new cases of hepatic TB each
      year
    explanation: >-
      The review's rough worldwide estimate, extrapolated from about 1% of
      active cases.
- population: Patients with active tuberculosis, prospective series, western India
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    In 242 consecutive tuberculosis patients without miliary disease or
    immunosuppression, 15.7% had hepatobiliary tuberculosis. This is a share
    of a selected hospital cohort, not a population prevalence.
  evidence:
  - reference: PMID:18603675
    reference_title: Hepatobiliary tuberculosis in western India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Of 242 included cases, 38 patients (15.7%; age 38.1 +/- 12.5 years; sex
      ratio 2.5:1) had HBTB
    explanation: >-
      Share of hospital tuberculosis patients with hepatobiliary disease.
environmental:
- name: HIV infection
  description: >-
    HIV infection raises the risk of disseminated and extrapulmonary
    tuberculosis, and hepatic involvement was more frequent in HIV-infected
    than in HIV-uninfected patients with disseminated disease. HIV-associated
    hepatic tuberculosis occurs at very low CD4 counts and carries a high
    mortality, and granulomas may be poorly formed.
  influences_mechanisms:
  - target: Hepatic Arterial Hematogenous Seeding in Disseminated Tuberculosis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Immunosuppression from HIV makes dissemination of bacilli, and so
      hematogenous seeding of the liver, more likely.
    evidence:
    - reference: PMID:25943103
      reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        An increased risk of dissemination and development of abdominal TB
        among HIV-infected people may explain their greater risk of developing
        hepatic TB than HIV-uninfected persons
      explanation: >-
        Links HIV to hepatic tuberculosis through increased dissemination.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a study of 164 patients with disseminated TB, hepatic TB was
      observed in 17.4% (4/23) of HIV-infected people and 4.3% (6/141) of
      HIV-uninfected people
    explanation: >-
      Hepatic involvement was more frequent with HIV among patients with
      disseminated tuberculosis.
  - reference: PMID:28148232
    reference_title: "Hepatic tuberculosis in human immunodeficiency virus co-infected adults: a case series of South African adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In our case series of HIV-infected patients, hepatic TB occurred in
      patients with severe immunosuppression, who presented with hepatomegaly
      and abnormal liver enzymes.
    explanation: >-
      Twenty HIV-infected patients with hepatic tuberculosis had a median CD4
      count of 47 cells per microlitre.
- name: Immunosuppression other than HIV
  description: >-
    Immunocompromised patients, including those on corticosteroids or other
    immunosuppressive treatment, are at higher risk of hepatic tuberculosis,
    and steroid treatment is among the poor prognostic factors in the largest
    prognostic series.
  influences_mechanisms:
  - target: Hepatic Arterial Hematogenous Seeding in Disseminated Tuberculosis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired immunity allows bacilli to spread to the liver; the cited
      sources do not name the intervening steps.
    evidence:
    - reference: PMID:39403208
      reference_title: Characterization of pathological features and immune microenvironment in hepatic tuberculosis and pulmonary tuberculosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Epidemiological studies have shown that immunocompromised patients
        have a significantly higher risk of developing hepatic tuberculosis
      explanation: >-
        The background of a pathology series attributes higher hepatic
        tuberculosis risk to immunocompromise.
  evidence:
  - reference: PMID:39403208
    reference_title: Characterization of pathological features and immune microenvironment in hepatic tuberculosis and pulmonary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Epidemiological studies have shown that immunocompromised patients have
      a significantly higher risk of developing hepatic tuberculosis
    explanation: >-
      Names immunocompromise as a risk factor for hepatic tuberculosis.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Poor prognostic factors included age <20 years, miliary TB,
      predisposing factors (treatment with steroids, chronic renal failure,
      diabetes, systemic lupus erythematosus, and significant alcohol intake),
      coagulopathy, low prothrombin index, and greater extent of caseation on
      histology
    explanation: >-
      Lists steroid treatment and other predisposing conditions among poor
      prognostic factors in a 96-patient series.

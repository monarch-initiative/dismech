      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Local hepatic TB occurs when ingested TB bacilli cross the
        gastrointestinal mucosal barrier to reach the liver via the portal vein
      explanation: >-
        A case series' background describing the portal-venous route of the
        local form.
- name: Hepatic Arterial Hematogenous Seeding in Disseminated Tuberculosis
  description: >-
    In miliary disease, intermittent bacillaemia carries bacilli into the
    liver through the hepatic artery, seeding the lobules diffusely with
    tubercles 0.6 to 2 mm across. This is the commonest route, accounting for
    about four in five reported cases.
  biological_scale: TISSUE
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Miliary hepatic TB is characterized by diffuse seeding of the liver with
      tubercles ranging from 0.6 to 2.0 mm in diameter situated in the lobules
      of the liver
    explanation: >-
      Describes the hepatic-arterial route and the diffuse lobular tubercles
      of the miliary form.
  downstream:
  - target: Kupffer Cell and Macrophage Uptake of Mycobacterium tuberculosis
    causal_link_type: DIRECT
    description: >-
      Bacilli arriving in the liver meet its resident and recruited
      macrophages, and the liver responds with granulomas whatever the route
      of entry.
    evidence:
    - reference: PMID:24976240
      reference_title: Hepatobiliary tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Irrespective of the mode of entry, the liver responds by granuloma
        formation.
      explanation: >-
        States that the hepatic granulomatous response follows any route of
        seeding.
  - target: Massive Miliary Hepatic Infiltration
    causal_link_type: DIRECT
    description: >-
      Heavy miliary seeding can overwhelm the liver.
    evidence:
    - reference: PMID:24976240
      reference_title: Hepatobiliary tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Massive miliary spread to the liver may cause acute liver failure as
        well as septic shock with multiorgan failure
      explanation: >-
        Links massive miliary seeding to acute liver failure.
- name: Portal Venous Seeding from a Gastrointestinal Focus
  description: >-
    In the local form, bacilli reach the liver mainly through the portal vein

  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Development of portal hypertension caused by the compression of the
      portal vein by tuberculous lymph nodes, with resultant variceal
      hemorrhage is an uncommon manifestation of hepatobiliary TB.
    explanation: >-
      Describes nodal portal hypertension as uncommon.
  sequelae:
  - target: Esophageal varices
    description: >-
      Portal hypertension leads to varices that can bleed.
    evidence:
    - reference: PMID:24976240
      reference_title: Hepatobiliary tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Development of portal hypertension caused by the compression of the
        portal vein by tuberculous lymph nodes, with resultant variceal
        hemorrhage is an uncommon manifestation of hepatobiliary TB.
      explanation: >-
        Links nodal portal hypertension to variceal haemorrhage.
- category: Gastrointestinal
  name: Esophageal varices
  description: >-
    Varices secondary to portal hypertension, a cause of death in some series
    through rupture, often with coexisting cirrhosis.
  phenotype_term:
    preferred_term: Esophageal varices
    term:
      id: HP:0002040
      label: Esophageal varix
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nearly 50% of deaths in the Philippines study were due to respiratory
      failure and another third from ruptured esophageal varices due to
      associated cirrhosis
    explanation: >-
      Ruptured varices caused about a third of deaths in one large series.
- category: Hepatic
  name: Acute hepatic failure
  description: >-
    Rare acute liver failure from massive miliary hepatic infiltration.
  subtype: Miliary
  phenotype_term:
    preferred_term: Acute hepatic failure
    term:
      id: HP:0006554
      label: Acute hepatic failure
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Massive miliary spread to the liver may cause acute liver failure as
      well as septic shock with multiorgan failure
    explanation: >-
      Records acute liver failure from massive miliary spread.
histopathology:
- name: Caseating epithelioid granulomas
  description: >-
    Granulomas of epithelioid cells with central caseation and fibrinoid
    necrosis, a corona of epithelioid cells containing Langhans giant cells,
    and a loose rim of lymphocytes, most often periportal. Fatty change and
    portal fibrosis are also seen. In advanced HIV infection granulomas may
    be absent or poorly formed.
  diagnostic: true
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In miliary TB, multiple small tuberculous liver foci show central
      caseation and fibrinoid necrosis. In the periphery, a corona of
      epitheloid cells of variable diameter is found, in which Langhans’
      giant cells are embedded. These granulomatous tubercles are surrounded
      by a loose rim of lymphocytes.
    explanation: >-
      Describes the architecture of hepatic tuberculous granulomas.
  - reference: PMID:7744492
    reference_title: "Hepatic tuberculosis: comparison of miliary and local form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The histopathological features of the miliary form were also similar to
      the local form with granuloma, caseation, acid-fast bacilli, fatty
      change and portal fibrosis as the main findings.
    explanation: >-
      In 22 patients both forms showed granulomas, caseation, bacilli, fatty
      change and portal fibrosis.
- name: Acid-fast bacilli in liver tissue
  description: >-
    Acid-fast bacilli on liver biopsy smear or stain, with a median
    sensitivity of 25% across series (range 0 to 59%); more often found in
    abscess material than in solid tuberculomas.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      AFB smear had a median sensitivity of 25% (range: 0-59%) among hepatic
      TB case series
    explanation: >-
      Pooled sensitivity of acid-fast smear on liver tissue.
progression:
- phase: Seeding and granulomatous hepatitis
  notes: >-
    Bacilli reach the liver through the hepatic artery or portal vein and
    granulomas form, often silently; hepatic involvement is usually
    asymptomatic and the clinical picture is that of the extrahepatic
    disease.
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical manifestations of hepatobiliary TB are those of the
      extrahepatic disease (Table 1); hepatic involvement is usually
      asymptomatic.
    explanation: >-
      States that hepatic involvement is usually silent.
- phase: Tuberculoma, abscess and biliary disease
  notes: >-
    Granulomas coalesce into tuberculomas, which may liquefy into abscesses or
    involve the bile ducts, producing mass lesions, cholangitis and
    obstructive jaundice.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Multiple granulomas may coalesce to form a large tuberculoma, and
      caseation and liquefaction necrosis of a tuberculoma may lead to a
      tubercular abscess
    explanation: >-
      Describes the progression from granulomas to tuberculoma and abscess.
- phase: Response to treatment and healing
  notes: >-
    With chemotherapy, appetite and fever improve within weeks and
    hepatosplenomegaly and jaundice regress over two to three months; liver
    enzymes normalise more slowly, and healed tubercles can calcify or scar.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment has resulted in improved appetite and weight gain, resolution
      of fever, reduced jaundice, and decreased hepatosplenomegaly within the
      first two to three months
    explanation: >-
      Describes the timing of the clinical response.
  - reference: PMID:28148232
    reference_title: "Hepatic tuberculosis in human immunodeficiency virus co-infected adults: a case series of South African adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Eleven out of twelve patients (92%) had reduction with seven out of
      twelve patients (58%) showing normalization of ALP levels within 6
      months of anti-TB therapy.
    explanation: >-
      Alkaline phosphatase fell in most, and normalised in about half, of
      treated HIV-infected patients within six months.
diagnosis:
- name: Liver biopsy with histology
  description: >-
    Percutaneous, ultrasound- or CT-guided, laparoscopic or surgical liver
    biopsy is the key test. Caseating granulomas establish the diagnosis;
    without caseation, acid-fast bacilli, culture or PCR are needed. Biopsy
    is indicated for unexplained hepatomegaly, fever of unknown origin or
    abnormal liver tests in a patient from an endemic region.
  diagnosis_term:
    preferred_term: liver biopsy
    term:
      id: NCIT:C51677
      label: Liver Biopsy
  evidence:
  - reference: PMID:9736180
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Liver biopsies obtained either by ultrasound, computed tomography or
      laparoscopy, showing caseating granuloma usually establish the
      diagnosis. In the absence of caseation necrosis, a positive acid-fast
      bacillus (AFB) or culture for Mycobacterium tuberculosis is needed to
      establish the diagnosis.
    explanation: >-
      Sets out the histological and microbiological basis of the diagnosis.
  - reference: PMID:3659266
    reference_title: A prospective study of hepatic tuberculosis in 41 black patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In patients with unexplained hepatomegaly or hepatosplenomegaly or
      pyrexia of unknown origin liver biopsy provides the only means of making
      this diagnosis.
    explanation: >-
      A prospective series concludes that liver biopsy is required.
- name: Mycobacterial culture of liver tissue
  description: >-
    Culture is the most specific evidence but has low sensitivity, under 10%
    in some reports and 30 to 36% in an HIV-infected series.
  diagnosis_term:
    preferred_term: mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterial culture provides the strongest evidence of hepatic TB, but
      the sensitivity has been reported to be <10%
    explanation: >-
      Records the specificity and low sensitivity of culture.
  - reference: PMID:28148232
    reference_title: "Hepatic tuberculosis in human immunodeficiency virus co-infected adults: a case series of South African adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Acid-fast bacilli were cultured from liver tissue in 30% (6/20) of
      patients; 25% (5/20) identified as TB.
    explanation: >-
      Culture yield in 20 HIV-infected adults.
- name: PCR of liver tissue
  description: >-
    Nucleic acid amplification of liver tissue, with a median sensitivity of
    86% across series (range 30 to 100%), is more sensitive than smear or
    culture and gives earlier results; Xpert MTB/RIF also detects rifampicin
    resistance.
  diagnosis_term:
    preferred_term: PCR for Mycobacterium tuberculosis
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      polymerase chain reaction for TB had a median sensitivity of 86% (range:
      30-100%)
    explanation: >-
      Pooled sensitivity of PCR on liver tissue.
  - reference: PMID:18603675
    reference_title: Hepatobiliary tuberculosis in western India.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      positive polymerase chain reaction for Mycobacterium tuberculosis (28/29
      procedures)
    explanation: >-
      PCR was positive in 28 of 29 procedures in a prospective series.
- name: Contrast-enhanced CT
  description: >-
    The most sensitive imaging test (abnormal in a median 88% of cases). The
    miliary form shows multiple dispersed low-density micronodules or
    hepatomegaly alone; the local form shows one or a few low-density nodules
    with calcification and peripheral or ring enhancement. Findings are
    nonspecific and often taken for hepatocellular carcinoma, metastases or
    cholangiocarcinoma.
  diagnosis_term:
    preferred_term: contrast-enhanced abdominal CT
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The median proportion of patients with abnormal abdominal CT was 88%
      (range: 40-100%) among hepatic TB case series
    explanation: >-
      Pooled yield of CT.
  - reference: PMID:39403208
    reference_title: Characterization of pathological features and immune microenvironment in hepatic tuberculosis and pulmonary tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Enhanced CT scans showed ring-shaped delayed enhancement during the
      arterial, venous, and delayed phases. Most HTB cases were single
      lesions, with the highest incidence in the right lobe
    explanation: >-
      CT appearance in 32 pathology-confirmed cases.
- name: Abdominal ultrasound
  description: >-
    Widely available first test, abnormal in a median 76% of cases, but
    nonspecific (hypoechoic or echogenic lesions, complex masses); its main
    value is to prompt further tests and guide biopsy.
  diagnosis_term:
    preferred_term: abdominal ultrasound
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The median proportion of patients with abnormal abdominal ultrasound was
      76% (range: 6-100%) among hepatic TB case series. However, abdominal
      ultrasound generally showed a round, non-specific hypoechoic region in
      the liver, and is therefore not an optimal test for hepatic TB
    explanation: >-
      Pooled yield and nonspecificity of ultrasound.
- name: Chest radiography
  description: >-
    Abnormal in a median 42.5% of cases; a normal chest film does not exclude
    hepatic tuberculosis.
  diagnosis_term:
    preferred_term: chest radiograph
    term:
      id: NCIT:C38103
      label: Chest Radiography
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A positive chest radiograph may also prompt additional investigations
      for hepatic TB, but a negative chest radiograph should not be used to
      exclude hepatic TB
    explanation: >-
      A normal chest film does not exclude the diagnosis.
- name: Endoscopic retrograde cholangiopancreatography
  description: >-
    Cholangiography shows strictures and dilatation in biliary disease, biliary
    cytology may give the diagnosis, and a stent can be placed at the same
    procedure.
  diagnosis_term:
    preferred_term: ERCP
    term:
      id: NCIT:C16430
      label: Endoscopic Retrograde Cholangiopancreatography
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In case of bile duct TB, biliary cytologic findings from endoscopic
      cholangiography may yield the diagnosis.
    explanation: >-
      Names endoscopic cholangiography as a diagnostic route in bile duct
      disease.
- name: Laparoscopy with directed liver biopsy
  description: >-
    Laparoscopy shows cheesy white irregular nodules and allows targeted
    biopsy when less invasive tests have failed.
  diagnosis_term:
    preferred_term: laparoscopy
    term:
      id: NCIT:C16969
      label: Laparoscopy
  evidence:
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      advocated that laparoscopy combined with direct vision liver biopsy may be the preferred mode of investigation for
      hepatobiliary TB as this modality was successful in the diagnosis of
      liver tuberculoma in all the cases
    explanation: >-
      Reports laparoscopy with direct biopsy as diagnostic in the largest
      series.
treatments:
- name: Standard multidrug antituberculous chemotherapy
  description: >-
    Four-drug therapy with isoniazid, rifampicin, pyrazinamide and ethambutol
    for two months, then isoniazid and rifampicin, for a total of 6 to 12
    months, as for other extrapulmonary sites. Regimens containing isoniazid
    and rifampicin lowered mortality compared with monotherapy. Caveat:
    isoniazid, rifampicin and pyrazinamide are hepatotoxic, pre-existing
    liver disease raises the risk, and drug-induced liver injury is hard to
    separate from hepatic tuberculosis itself or from immune reconstitution
    in HIV. ALT should be monitored in patients with liver disease or HIV,
    and treatment interrupted and a modified regimen used if ALT exceeds
    three times the upper limit of normal with symptoms or jaundice, or five
    times without.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Kupffer Cell and Macrophage Uptake of Mycobacterium tuberculosis
    treatment_effect: INHIBITS
    description: >-
      The drugs kill the bacilli that drive the hepatic granulomatous
      response.
    evidence:
    - reference: PMID:25943103
      reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Standard anti-tuberculous chemotherapy for 6 to 12 months achieved
        positive outcomes for nearly all patients with drug-susceptible TB.
      explanation: >-
        Pooled outcomes of chemotherapy across series.
  evidence:
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Standard anti-tuberculous chemotherapy for 6 to 12 months achieved
      positive outcomes for nearly all patients with drug-susceptible TB.
    explanation: >-
      Pooled outcomes of standard chemotherapy.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In one cohort of 96 hepatic TB patients, those receiving monotherapy had
      higher mortality (20% vs. 0%) compared to patients receiving a
      multi-drug regimen containing isoniazid and rifampin
    explanation: >-
      Multidrug regimens with isoniazid and rifampicin lowered mortality.
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment consists of a fourfold combination: isoniazid (5 mg/kg
      BW/day), rifampicin (10 mg/kg BW/day), pyrazinamide (30 mg/kg BW/day),
      ethambutol (20 mg/kg BW/day) generally for 2-4 months, subsequently
      isoniazid and rifampicin for 6-12 months.
    explanation: >-
      Gives the four-drug regimen used for hepatic tuberculosis.
  - reference: PMID:24976240
    reference_title: Hepatobiliary tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Drug induced liver injury secondary to antituberculous drugs, especially
      isoniazid, is idiosyncratic and potentially lethal. Drug induced
      hepatotoxicity is not mentioned in most reports of hepatic TB and this
      is probably due to the small number of patients with hepatic TB.
      Careful monitoring for drug induced hepatitis may obviate fatality.
    explanation: >-
      Caveat: drug-induced liver injury is potentially lethal and
      underreported in hepatic tuberculosis, so monitoring is needed.
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During treatment of latent TB infection (LTBI) alanine aminotransferase
      (ALT) monitoring is recommended for those who chronically consume
      alcohol, take concomitant hepatotoxic drugs, have viral hepatitis or
      other preexisting liver disease or abnormal baseline ALT
    explanation: >-
      Recommends ALT monitoring for patients with pre-existing liver disease or
      abnormal baseline ALT.
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      During treatment of TB disease, in addition to these individuals,
      patients with HIV infection should have ALT monitoring.
    explanation: >-
      Extends ALT monitoring to treatment of disease and to HIV infection.
  - reference: PMID:17021358
    reference_title: "An official ATS statement: hepatotoxicity of antituberculosis therapy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment should be interrupted and, generally, a modified or
      alternative regimen used for those with ALT elevation more than three
      times the upper limit of normal (ULN) in the presence of hepatitis
      symptoms and/or jaundice, or five times the ULN in the absence of
      symptoms.
    explanation: >-
      Gives the ALT thresholds for interrupting treatment.
  - reference: PMID:25943103
    reference_title: A systematic review of hepatic tuberculosis with considerations in human immunodeficiency virus co-infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Making this distinction is critical since DILI is managed with treatment
      cessation and drug rechallenge, while TB-IRIS requires persistence of
      treatment with the possible addition of corticosteroids
    explanation: >-
      Caveat for HIV co-infection: drug-induced injury and hepatic immune
      reconstitution need opposite management.
- name: Percutaneous drainage of tuberculous liver abscess
  description: >-
    Percutaneous aspiration and drainage of a tuberculous liver abscess,
    combined with chemotherapy, for abscesses that respond poorly to drugs
    alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: percutaneous aspiration and drainage
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Liquefaction into Tuberculous Liver Abscess
    treatment_effect: INHIBITS

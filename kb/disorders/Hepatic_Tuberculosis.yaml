      intrahepatic ducts.
    explanation: >-
      Imaging of 12 biopsy-proven cases showed dilated intrahepatic ducts
      next to the nodules.
- category: Imaging
  name: Hepatolithiasis
  description: >-
    Intrahepatic stones in 5 of 12 biopsy-proven cases in one imaging series.
  frequency: FREQUENT
  subtype: Tubular
  phenotype_term:
    preferred_term: Hepatolithiasis
    term:
      id: HP:6000063
      label: Hepatolithiasis
  evidence:
  - reference: PMID:29174175
    reference_title: "Imaging appearances of hepatic tuberculosis: experience with 12 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Hepatolithiasis was seen in five patients.
    explanation: >-
      Five of 12 patients had intrahepatic stones.
- category: Hepatic
  name: Portal hypertension
  description: >-
    Uncommon portal hypertension from compression of the portal vein by
    tuberculous nodes, with variceal bleeding.
  phenotype_term:

notes: >-
  No GeneReviews chapter exists for this condition. `just check-genereviews` returns
  NO_CHAPTER for both Bookshelf collections against the committed index (snapshot
  2026-09-10), which is expected for a disorder defined in 2019 from a single patient. The
  phenotype baseline is therefore the index report itself (PMID:31554793).

  This entry is the loss-of-function, class IB counterpart of `Activated_PI3K-delta_Syndrome`
  (APDS), and the two should not be conflated: APDS is gain-of-function in PIK3CD (p110delta,
  class IA), this is loss-of-function in PIK3CG (p110gamma, class IB). Different gene,
  different isoform, opposite direction of effect.
classifications:
  iuis_category:
    classification_value: immune dysregulation
    notes: >-
      Recorded as immune dysregulation because the defining clinical picture combines a
      humoral deficiency with tissue-infiltrative autoinflammation (T-lymphocytic
      pneumonitis and colitis) and autoimmune cytopenias, with reduced regulatory T cells as
      the immunological correlate. A pure-deficiency classification would not capture the
      inflammatory half of the phenotype the disease is named for.
    evidence:
    - reference: PMID:31554793
      reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She has a history of childhood-onset antibody defects, cytopenias, and T lymphocytic
        pneumonitis and colitis, with reduced peripheral blood memory B, memory CD8+ T, and
        regulatory T cells and increased CXCR3+ tissue-homing CD4 T cells.
      explanation: >-
        Gives the combined deficiency-plus-dysregulation phenotype that the classification
        records.

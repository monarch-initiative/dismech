discussions:
- discussion_id: pik3cg_single_patient_evidence_base
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which features of this entry are properties of the disease, and which are properties of
    the one patient it was defined from?
  attaches_to:
  - disease#Immunodeficiency 97 With Autoinflammation
  rationale: >-
    Every HUMAN_CLINICAL item in this entry traces to a single individual. That is enough to
    establish that biallelic PIK3CG loss causes disease in humans - the trio exome, the
    absent protein and the functional cellular work together make that case - but it is not
    enough to distinguish the disease's core phenotype from this patient's particular course.
    Frequencies, age at onset, penetrance and burden are therefore recorded either as this
    patient's values or not at all, rather than as disease-level statistics. A second
    unrelated kindred would change what can be asserted here more than any further work on
    the first.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT

animal_models:
- name: Pik3cg-deficient mouse under natural microbiota exposure
  species: Mouse
  genotype: Pik3cg knockout
  publication: PMID:31554793
  description: >
    The knockout mouse reproduces major features of the human disease, but only after
    exposure to natural microbiota through co-housing with pet-store mice. This is the
    central caveat of the model and is the reason the disease is thought to be
    microbiota-dependent: under conventional specific-pathogen-free housing the phenotype
    does not appear. The dependence is established in the mouse and has not been
    demonstrated in the patient.
  modeled_mechanisms:
  - target: Unrestrained TLR-Driven Myeloid IL-12 and IL-23 Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the myeloid hyperinflammation and the tissue immunopathology,
      conditional on microbial exposure.
    limitations: >-
      The phenotype is contingent on co-housing with pet-store mice to acquire natural
      microbiota, so the model reports what PI3Kgamma loss does under a defined microbial
      challenge rather than what it does unconditionally. Whether the human disease carries
      the same dependence is untested, and the human comparison rests on the index patient.
    evidence:
    - reference: PMID:31554793
      reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pik3cg-deficient mice recapitulate major features of human disease after exposure to
        natural microbiota through co-housing with pet-store mice.
      explanation: >-
        States both that the model recapitulates the disease and the exact condition under
        which it does, which is what makes this a qualified rather than an unqualified
        recapitulation claim.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our results emphasize the physiological importance of PI3Kγ in restraining
      inflammation and promoting appropriate adaptive immune responses in both humans and
      mice.
    explanation: >-
      Supports treating the mouse as informative for the human mechanism, on the authors'
      own cross-species reading.
diagnosis:
- name: Trio whole exome sequencing
  description: >
    The diagnosis is molecular. There is no biomarker and no functional screening assay in
    routine use, so the disorder is found by sequencing a patient whose phenotype -
    childhood antibody defect with autoimmune cytopenias, lymphoproliferation and
    lymphocytic tissue infiltration - has no other explanation. The index diagnosis was made
    on a proband-plus-unaffected-parents trio, which is what established biallelic
    inheritance and excluded competing variants in the same run.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) of genomic DNA from patient A.1 and her unaffected
      parents identified deleterious mutations in the PIK3CG gene encoding p110γ
    explanation: >-
      Records the diagnostic route and its trio design, which is what makes the biallelic
      call possible.
- name: p110gamma protein expression in patient leukocytes
  description: >
    Absence of the p110gamma catalytic subunit on immunoblot of patient cells is the
    confirmatory step that turns two sequence variants into a demonstrated null. Recorded
    because for this disorder the variant call alone does not establish complete deficiency,
    which is the entry's scoping claim.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a human patient with bi-allelic, loss-of-function mutations in PIK3CG
      resulting in absence of the p110γ catalytic subunit of PI3Kγ.
    explanation: >-
      States that the protein is absent in the patient, which is the confirmatory finding
      this test reports.

name: Immunodeficiency 97 With Autoinflammation
creation_date: "2026-09-18T00:00:00Z"
category: Mendelian
synonyms:
- IMD97
- PI3K-gamma deficiency
- PI3Kgamma deficiency
- p110gamma deficiency
- PIK3CG deficiency
- immunodeficiency 97 with autoinflammation, autosomal recessive
description: >
  Immunodeficiency 97 with autoinflammation is an autosomal recessive inborn error of
  immunity caused by biallelic loss-of-function variants in PIK3CG, which encodes p110gamma,
  the catalytic subunit of class IB phosphoinositide 3-kinase (PI3Kgamma). PI3Kgamma is
  expressed almost exclusively in leukocytes and is activated downstream of G-protein-coupled
  receptors, which places it at the junction between chemokine sensing and cell-intrinsic
  restraint of myeloid activation.

  The disease has the paradoxical shape its name records: it is simultaneously an
  immunodeficiency and an autoinflammatory disorder. On the deficiency side there are
  childhood-onset antibody defects with reduced memory B cells, reduced memory CD8 T cells
  and markedly reduced regulatory T cells. On the inflammatory side, PI3Kgamma-deficient
  macrophages and monocytes over-produce IL-12 and IL-23 on Toll-like receptor stimulation
  in a GSK3alpha/beta-dependent manner, and CXCR3-positive tissue-homing CD4 T cells are
  expanded, giving T-lymphocytic pneumonitis and colitis. Losing the kinase therefore
  removes a brake on innate inflammation while also removing a signal that adaptive immunity
  needs - which is why experimental systems had previously produced conflicting verdicts on
  whether PI3Kgamma is pro- or anti-inflammatory.

  Two features of the evidence base should be read before the mechanism below. First, the
  human disease rests on very few reported patients, and everything in this entry graded
  HUMAN_CLINICAL derives from one of them: the index patient with complete absence of
  p110gamma (PMID:31554793). A second, unrelated patient with compound heterozygous PIK3CG
  variants has been reported independently (PMID:33054089), and that patient presented
  differently - a hyperferritinemic, HLH-like inflammatory syndrome controlled on anakinra,
  with an NK-cell defect, rather than the antibody deficiency and lymphocytic tissue
  infiltration this entry is built around. The two reports also characterise the residual
  kinase differently, which is recorded in the evidence-base discussion. Second, the mouse knockout recapitulates
  the disease only after exposure to natural microbiota through co-housing with pet-store
  mice - under specific-pathogen-free conditions it does not. The mechanism is therefore
  conditional on microbial exposure in the model, and that conditionality has not been
  demonstrated in humans. Both points are recorded as explicit discussions rather than
  smoothed over.

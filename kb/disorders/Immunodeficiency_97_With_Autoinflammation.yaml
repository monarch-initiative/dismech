clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The reported patient required blood transfusions and steroids for autoimmune haemolytic
    anaemia at nine, B-cell depletion with rituximab for recurrent cytopenias at seventeen,
    and is on indefinite immunoglobulin replacement plus mycophenolate mofetil. That is
    chronic, multi-agent, lifelong therapy for both halves of the phenotype. Recorded as
    MODERATE rather than HIGH because the disease proved controllable on that regimen and
    no death or organ failure is reported - but the assessment rests on one patient's
    course, so it should be read as provisional rather than as a population estimate.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient A.1 is currently treated with immunoglobulin replacement therapy to restore
      humoral protection and mycophenolate mofetil to suppress inflammation.
    explanation: >-
      Documents the indefinite two-agent regimen - one drug per half of the phenotype -
      behind the burden assessment.
inheritance:
- name: Autosomal recessive inheritance

      Documents the regulatory T cell deficit directly in the patient's peripheral blood.
- name: CXCR3-Positive T Cell Tissue Infiltration
  description: >
    CXCR3-positive tissue-homing CD4 T cells are expanded and infiltrate lung and gut,

    description: >-
      The regulatory T cell deficit is the entry's account of the autoimmune arm: the index
      report groups the cytopenias with the antibody defect as autoimmune complications, and
      autoantibody production against red cells is the intermediate step this edge skips
      over rather than asserts.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same autoimmune mechanism in a second lineage; the two cytopenias are reported
      together and recurred together, which is why they are wired from one node.
  - target: Decreased specific antibody response to vaccination
    causal_link_type: DIRECT
    description: >-
      The reduced memory B cell compartment is the same lesion seen from the functional
      side: fewer antigen-experienced B cells able to commit to the antibody-secreting fate
      means weaker responses to immunization.
  - target: CXCR3-Positive T Cell Tissue Infiltration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of regulatory T cells removes the suppressive constraint on effector T cells

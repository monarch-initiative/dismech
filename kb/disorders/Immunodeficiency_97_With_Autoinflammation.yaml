    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Disease requires biallelic loss-of-function PIK3CG variants. The index patient carried
    deleterious mutations identified by trio whole-exome sequencing with unaffected parents,
    consistent with recessive inheritance. Penetrance cannot be estimated from one kindred
    and is deliberately left unrecorded.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing (WES) of genomic DNA from patient A.1 and her unaffected
      parents identified deleterious mutations in the PIK3CG gene encoding p110γ
    explanation: >-
      Establishes biallelic PIK3CG mutations in an affected child of unaffected parents,
      the basis for recessive inheritance.
genetic:
- name: PIK3CG
  gene_term:
    preferred_term: PIK3CG
    term:
      id: hgnc:8978
      label: PIK3CG
  relationship_type: CAUSATIVE
  notes: >
    PIK3CG encodes p110gamma, the catalytic subunit of class IB PI3K. Biallelic
    loss-of-function variants abolish the protein. Because p110gamma is the only class IB
    catalytic subunit and is essentially leukocyte-restricted, the consequences are confined
    to the immune system rather than being systemic.

    There is a protein-level account of how a single residue can do this. Biophysical work on
    the C-terminal residue R1021 shows that immunodeficiency and oncogenic mutations at the
    same position act in opposite directions - inactivating or activating the enzyme - by
    disrupting regulatory C-terminal dynamics. That one residue can be pushed either way is
    what makes this gene a locus for both an inborn error of immunity and a cancer target,
    and it is the mechanism by which a missense change, rather than a truncation, produces a
    functional null.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phosphatidylinositol 3-kinase-gamma (PI3Kγ) is highly expressed in leukocytes and is
      an attractive drug target for immune modulation.
    explanation: >-
      Establishes the leukocyte-restricted expression that confines the phenotype to the
      immune compartment.
  - reference: PMID:33661099
    reference_title: "Disease-related mutations in PI3Kγ disrupt regulatory C-terminal dynamics and reveal a path to selective inhibitors."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we have revealed insight into regulation of kinase activity, specifically defining how
      immunodeficiency and oncogenic mutations of R1021 in the C-terminus can inactivate or
      activate enzyme activity
    explanation: >-
      Gives the structural mechanism by which a single C-terminal residue change inactivates
      the enzyme, and records that the same residue can be mutated the other way in cancer -
      which is why this gene supports two opposite disease directions.
pathophysiology:
- name: PIK3CG Loss of Function
  description: >
    Biallelic null PIK3CG alleles abolish the p110gamma catalytic subunit, eliminating class
    IB PI3K activity. Because p110gamma acts downstream of G-protein-coupled receptors in
    leukocytes, its loss removes a signalling node that both restrains myeloid inflammatory
    output and supports adaptive lymphocyte programs - which is why one lesion produces two
    apparently opposite phenotypes.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: PIK3CG
    term:
      id: hgnc:8978
      label: PIK3CG
  molecular_functions:
  - preferred_term: class IB phosphoinositide 3-kinase catalytic activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0016303
      label: 1-phosphatidylinositol-3-kinase activity
  downstream:
  - target: Unrestrained TLR-Driven Myeloid IL-12 and IL-23 Production
    causal_link_type: DIRECT
    description: >-
      Loss of p110gamma releases a GSK3alpha/beta-dependent brake on inflammatory cytokine
      output in macrophages and monocytes.
    evidence:
    - reference: PMID:31554793
      reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        PI3Kγ-deficient macrophages and monocytes produce elevated inflammatory IL-12 and
        IL-23 in a GSK3α/β-dependent manner upon TLR stimulation.
      explanation: >-
        Names both the direction of the effect and the intermediate (GSK3alpha/beta) that
        makes this a mechanistic edge rather than a correlation between two states.
  - target: Impaired Adaptive Lymphocyte Compartments
    causal_link_type: DIRECT
    description: >-
      The same kinase is required cell-intrinsically for the transcriptional program that
      commits activated B cells to the antibody-secreting fate, and its loss also depletes
      regulatory and memory T cell compartments.
    evidence:
    - reference: PMID:38961274
      reference_title: "PI3Kγ in B cells promotes antibody responses and generation of antibody-secreting cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        Using mouse immunization models, we found that PI3Kγ functions cell intrinsically
        within activated B cells in a kinase activity-dependent manner to transduce signals
        required for the transcriptional program supporting differentiation of ASCs.
      explanation: >-
        Establishes the cell-intrinsic, kinase-dependent requirement for PI3Kgamma in the
        B cell arm. Graded INDIRECT because the demonstration is in mouse immunization
        models and human tonsillar organoids rather than in the patient.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bi-allelic, loss-of-function mutations in PIK3CG resulting in absence of the p110γ
      catalytic subunit of PI3Kγ
    explanation: >-
      Documents the null lesion and its protein-level consequence as the initiating event.

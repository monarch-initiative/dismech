notes: >-
  No GeneReviews chapter exists for this condition. `just check-genereviews` returns
  NO_CHAPTER for both Bookshelf collections against the committed index (snapshot
  2026-09-10), which is expected for a disorder defined in 2019 from a single index patient. The
  phenotype baseline is therefore the index report itself (PMID:31554793).

  This entry is the loss-of-function, class IB counterpart of `Activated_PI3K-delta_Syndrome`
  (APDS), and the two should not be conflated: APDS is gain-of-function in PIK3CD (p110delta,
  class IA), this is loss-of-function in PIK3CG (p110gamma, class IB). Different gene,
  different isoform, opposite direction of effect.
classifications:
  iuis_category:
    classification_value: immune dysregulation
    notes: >-
      Recorded as immune dysregulation because the defining clinical picture combines a
      humoral deficiency with tissue-infiltrative autoinflammation (T-lymphocytic
      pneumonitis and colitis) and autoimmune cytopenias, with reduced regulatory T cells as
      the immunological correlate. A pure-deficiency classification would not capture the
      inflammatory half of the phenotype the disease is named for.
    evidence:
    - reference: PMID:31554793
      reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        She has a history of childhood-onset antibody defects, cytopenias, and T lymphocytic
        pneumonitis and colitis, with reduced peripheral blood memory B, memory CD8+ T, and
        regulatory T cells and increased CXCR3+ tissue-homing CD4 T cells.
      explanation: >-
        Gives the combined deficiency-plus-dysregulation phenotype that the classification
        records.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Two unrelated patients with germline biallelic PIK3CG variants have been reported: the
    index patient with complete absence of p110gamma (PMID:31554793), and a second patient
    reported independently by a different group (PMID:33054089), whose kinase the companion
    B-cell study describes as potentially hypomorphic. No rate, class or band can be
    assigned from two cases, and a qualitative tier is not used here either: ULTRA_RARE
    presupposes a prevalence threshold that nobody has estimated for this disorder.

    PubMed carries no abstract for PMID:33054089, but the full text is open access through
    PMC, so the second case is cited from its own report rather than only through another
    paper's restatement of it.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a human patient with bi-allelic, loss-of-function mutations in PIK3CG
      resulting in absence of the p110γ catalytic subunit of PI3Kγ.
    explanation: >-
      Establishes the index patient from whom the human disease was defined, and who is the
      whole of this entry's HUMAN_CLINICAL evidence base.
  - reference: PMID:33054089
    reference_title: "Germline biallelic PIK3CG mutations in a multifaceted immunodeficiency with immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified compound heterozygous variants in PIK3CG encoding for p110γ, the
      catalytic subunit of the PI3Kγ complex.
    explanation: >-
      The second patient, from her own report: an independent group, an unrelated family,
      and biallelic PIK3CG variants. This is what makes the denominator two rather than one.
  - reference: PMID:38961274
    reference_title: "PI3Kγ in B cells promotes antibody responses and generation of antibody-secreting cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      An additional previously reported case of a patient with immune dysregulation and
      potentially hypomorphic PI3Kγ had normal serum IgG levels
    explanation: >-
      A third group's reading of that second patient, kept alongside the primary report
      because the two characterise the residual kinase differently. quote_role BACKGROUND
      because this sentence restates another group's case in the discussion of a mouse study
      rather than reporting the case itself.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    The reported patient required blood transfusions and steroids for autoimmune haemolytic
    anaemia at nine, B-cell depletion with rituximab for recurrent cytopenias at seventeen,
    and is on indefinite immunoglobulin replacement plus mycophenolate mofetil. That is
    chronic, multi-agent, lifelong therapy for both halves of the phenotype. Recorded as
    MODERATE rather than HIGH because the disease proved controllable on that regimen and
    no death or organ failure is reported - but the assessment rests on the index patient's
    course, so it should be read as provisional rather than as a population estimate.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient A.1 is currently treated with immunoglobulin replacement therapy to restore
      humoral protection and mycophenolate mofetil to suppress inflammation.
    explanation: >-
      Documents the indefinite two-agent regimen - one drug per half of the phenotype -
      behind the burden assessment.

- discussion_id: pik3cg_microbiota_dependence_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the human disease microbiota-dependent in the way the mouse model is, or is the
    co-housing requirement a property of laboratory mice rather than of PI3Kgamma loss?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Unrestrained TLR-Driven Myeloid IL-12 and IL-23 Production
  rationale: >-
    The Pik3cg knockout does not display the phenotype under specific-pathogen-free housing;
    it does so only after acquiring natural microbiota from pet-store mice. That is a strong
    and specific mechanistic claim, and it fits the TLR-dependence of the myeloid cytokine
    defect. But specific-pathogen-free housing has no human counterpart - every human carries
    a microbiota - so the experiment that establishes the dependence in mice cannot be run in
    people, and the human patient gives no information about what her disease would look like
    without microbial exposure. This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP
    because the evidence exists and is good; what is uncertain is whether the conditionality
    it demonstrates transfers.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pik3cg-deficient mice recapitulate major features of human disease after exposure to
      natural microbiota through co-housing with pet-store mice.
    explanation: >-
      States the conditional recapitulation that this mismatch is about: the model works,
      but only under a microbial exposure whose human analogue cannot be varied.
- discussion_id: pik3cg_pro_versus_anti_inflammatory
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why did experimental systems disagree about whether PI3Kgamma is pro-inflammatory or
    anti-inflammatory, and does the human loss-of-function phenotype settle it?
  attaches_to:
  - pathophysiology#PIK3CG Loss of Function
  rationale: >-
    PI3Kgamma is an active drug target for immune modulation, and inhibitors are being
    developed on the premise that blocking it is anti-inflammatory. The human null phenotype
    points the other way for the myeloid arm: losing the kinase increases IL-12 and IL-23
    output and produces tissue immunopathology. The conflict was explicit in the literature
    before this patient was described and the index report frames its own contribution as
    addressing it. Recorded here because the resolution bears directly on whether
    PI3Kgamma inhibition carries an autoinflammatory liability, which is a question about
    drugs in development rather than only about this disease.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different experimental systems have led to conflicting conclusions regarding
      inflammatory and anti-inflammatory functions of PI3Kγ.
    explanation: >-
      States the disagreement in the literature that this discussion records as unresolved.

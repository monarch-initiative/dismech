discussions:
- discussion_id: pik3cg_two_patient_evidence_base
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which features of this entry are properties of the disease, and which are properties of
    the one patient it was defined from - and does the second reported patient's milder
    humoral phenotype reflect residual kinase activity or something else?
  attaches_to:
  - disease#Immunodeficiency 97 With Autoinflammation
  - phenotypes#Decreased circulating immunoglobulin concentration
  rationale: >-
    Every HUMAN_CLINICAL item in this entry traces to one individual, the index patient.
    That is enough to establish that biallelic PIK3CG loss causes disease in humans - the
    trio exome, the absent protein and the functional cellular work together make that case
    - but it is not enough to distinguish the disease's core phenotype from this patient's
    particular course. Frequencies, age at onset, penetrance and burden are therefore
    recorded either as this patient's values or not at all, rather than as disease-level
    statistics.

    A second unrelated patient with compound heterozygous PIK3CG variants has been reported
    (PMID:33054089), so the human evidence base is no longer one case. It does not settle
    the questions above, and it opens two of its own.

    The first is phenotypic. That patient presented at fourteen with fever,
    hyperferritinaemia, hypertriglyceridaemia and haemophagocytosis - a macrophage-activation
    picture that fell short of HLH criteria - with an NK-cell defect, and she has been stable
    on anakinra. The index patient presented in childhood with an antibody defect, autoimmune
    cytopenias and lymphocytic infiltration of lung and gut. Both are PI3Kgamma deficiency by
    genotype; clinically they share little beyond immune dysregulation. With two patients,
    there is no way to tell whether that is a spectrum, an allele effect, or two mechanisms
    that happen to share a gene.

    The second is about residual activity, and the two papers do not agree. The primary
    report finds p110gamma protein expressed at normal levels in the patient's T cells, and
    then shows by reconstitution that neither variant restores CD69 upregulation - a
    loss-of-function readout with the protein present. A later B-cell study reading the same
    case calls the kinase potentially hypomorphic, on the grounds that serum IgG was normal.
    Both may be right about different assays, but the entry should not assert either as the
    patient's residual-activity level, so it records both and asserts neither.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a human patient with bi-allelic, loss-of-function mutations in PIK3CG
    explanation: >-
      Establishes the index patient, from whom every HUMAN_CLINICAL item in this entry is
      taken.
  - reference: PMID:33054089
    reference_title: "Germline biallelic PIK3CG mutations in a multifaceted immunodeficiency with immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gave evidence of macrophage activation in the context of a hyperferritinemic
      inflammatory syndrome
    explanation: >-
      The second patient's presenting picture, which is not the presenting picture of the
      index patient and is the phenotypic half of this discussion.
  - reference: PMID:33054089
    reference_title: "Germline biallelic PIK3CG mutations in a multifaceted immunodeficiency with immune dysregulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We assessed the expression of mutated p110γ in T cells derived from patient peripheral
      blood mononuclear cells (PBMC), and found comparable expression levels in the patient,
      mother, and healthy donors (HD)
    explanation: >-
      The protein is present in the second patient, unlike the index patient in whom it is
      absent. Graded IN_VITRO because the measurement is an immunoblot of cultured patient
      cells.
  - reference: PMID:33054089
    reference_title: "Germline biallelic PIK3CG mutations in a multifaceted immunodeficiency with immune dysregulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      upon reconstitution of mutant N1085S or R49S, no upregulation of CD69 was observed
      compared to empty vector
    explanation: >-
      The reconstitution result behind the primary report's loss-of-function call for both
      alleles, which is the claim the later hypomorphic reading sits against.
  - reference: PMID:38961274
    reference_title: "PI3Kγ in B cells promotes antibody responses and generation of antibody-secreting cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      An additional previously reported case of a patient with immune dysregulation and
      potentially hypomorphic PI3Kγ had normal serum IgG levels, suggesting sufficient
      kinase activity remained for normal antibody induction in this patient
    explanation: >-
      The later reading that calls the same patient's kinase hypomorphic, kept beside the
      primary report's loss-of-function result because the two disagree. quote_role
      BACKGROUND because the sentence restates another group's case rather than reporting
      this study's own result.
  - reference: PMID:38961274
    reference_title: "PI3Kγ in B cells promotes antibody responses and generation of antibody-secreting cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously described the first patient with monogenic PI3Kγ deficiency causing a
      primary immunodeficiency with humoral defects and lung/gut inflammation
    explanation: >-
      Confirms that the index patient is the first reported case of monogenic PI3Kgamma
      deficiency, which is what makes the second report an independent one rather than a
      re-description.
- discussion_id: pik3cg_microbiota_dependence_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Is the human disease microbiota-dependent in the way the mouse model is, or is the
    co-housing requirement a property of laboratory mice rather than of PI3Kgamma loss?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Unrestrained TLR-Driven Myeloid IL-12 and IL-23 Production
  rationale: >-
    The Pik3cg knockout does not display the phenotype under specific-pathogen-free housing;
    it does so only after acquiring natural microbiota from pet-store mice. That is a strong
    and specific mechanistic claim, and it fits the TLR-dependence of the myeloid cytokine
    defect. But specific-pathogen-free housing has no human counterpart - every human carries
    a microbiota - so the experiment that establishes the dependence in mice cannot be run in
    people, and the human patient gives no information about what her disease would look like
    without microbial exposure. This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP
    because the evidence exists and is good; what is uncertain is whether the conditionality
    it demonstrates transfers.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pik3cg-deficient mice recapitulate major features of human disease after exposure to
      natural microbiota through co-housing with pet-store mice.
    explanation: >-
      States the conditional recapitulation that this mismatch is about: the model works,
      but only under a microbial exposure whose human analogue cannot be varied.
- discussion_id: pik3cg_pro_versus_anti_inflammatory
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why did experimental systems disagree about whether PI3Kgamma is pro-inflammatory or
    anti-inflammatory, and does the human loss-of-function phenotype settle it?
  attaches_to:
  - pathophysiology#PIK3CG Loss of Function
  rationale: >-
    PI3Kgamma is an active drug target for immune modulation, and inhibitors are being
    developed on the premise that blocking it is anti-inflammatory. The human null phenotype
    points the other way for the myeloid arm: losing the kinase increases IL-12 and IL-23
    output and produces tissue immunopathology. The conflict was explicit in the literature
    before this patient was described and the index report frames its own contribution as
    addressing it. Recorded here because the resolution bears directly on whether
    PI3Kgamma inhibition carries an autoinflammatory liability, which is a question about
    drugs in development rather than only about this disease.

    The same reading has a therapeutic corollary that this entry deliberately does not model
    as a treatment: if the myeloid arm is driven by unrestrained IL-12 and IL-23, then
    blocking their shared p40 subunit is the mechanistically indicated intervention. No
    reported patient has been given such an agent, so there is nothing to curate under
    treatments - a mechanistic rationale is not a treatment record - and it is noted here
    instead.
  evidence:
  - reference: PMID:31554793
    reference_title: "Human PI3Kγ deficiency and its microbiota-dependent mouse model reveal immunodeficiency and tissue immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different experimental systems have led to conflicting conclusions regarding
      inflammatory and anti-inflammatory functions of PI3Kγ.
    explanation: >-
      States the disagreement in the literature that this discussion records as unresolved.

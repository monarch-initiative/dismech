  description: >-
    Sustained KIT/RAS/PI3K signaling carries the transformed germ cell through
    the G1 restriction point into repeated rounds of division without the normal
    requirement for extrinsic growth factors. Clinically this autonomous
    proliferation is what makes MOGCT one of the fastest-growing ovarian
    neoplasms, with symptoms often developing over only weeks.

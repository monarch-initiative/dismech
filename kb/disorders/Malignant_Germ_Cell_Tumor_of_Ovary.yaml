  Known content gap: the epigenetic arm of MOGCT biology - global hypomethylation
  in dysgerminoma versus relative hypermethylation in yolk sac tumor, IGF2/H19
  imprinting-control hypomethylation, and the miR-371-373 / miR-302-367 clusters -
  is described in the deep-research source (PMID:37296950). This gap is now
  PARTIALLY CLOSED: the Children's Oncology Group epigenome-wide study
  (PMID:30287918, 154 paediatric germ cell tumours) has been cached as a citable
  primary source and is modeled as the "Histology-Determining Epigenetic
  Reprogramming" pathophysiology node, covering the 8,481-DMR
  histology-partitioning result and the germinoma-hypomethylation direction.
  Still unmodeled for want of a snippet-verifiable source: the IGF2/H19
  imprinting-control-region hypomethylation claim and the miR-371-373 /
  miR-302-367 cluster biology (the latter is represented on the biomarker side
  as circulating miR-371a-3p but not as a mechanism node). Note also that the
  COG cohort is paediatric germ cell tumours at all sites rather than

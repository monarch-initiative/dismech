  Prevalence scope. A previously curated third prevalence record - "ovarian germ
  cell tumors account for approximately 11% of cancer diagnoses in children,
  adolescents, and young adults" (PMID:37296950) - has been removed from
  `prevalence`. That figure is a case-mix proportion of cancer diagnoses, not a
  population occurrence measure, so it could not be given an honest
  `measure_type` or `prevalence_class`; it is recorded here instead. The age
  skew it describes is still modeled, in `progression`.

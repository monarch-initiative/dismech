      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Unsupervised hierarchical clustering of individual probes within DMRs
        resulted in four high level clusters closely corresponding to tumour
        histology.
      explanation: >-
        The clustering shows methylation state and histology co-vary tightly.
        Marked PARTIAL because a cross-sectional association cannot establish

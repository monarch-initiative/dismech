  description: >-
    LDH is the serum marker most associated with dysgerminoma and generally
    tracks tumor burden; it is less subtype-specific than AFP or beta-hCG and may
    be normal in early-stage disease.
  phenotype_term:
    preferred_term: Increased circulating lactate dehydrogenase concentration
    term:
      id: HP:0025435
      label: Increased circulating lactate dehydrogenase concentration
  reports_on:
  - target: Lineage-Specific Tumor Marker Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum lactate dehydrogenase reflects dysgerminoma tumor burden.
  evidence:
  - reference: PMID:34987988
    reference_title: "Unusual Cases of Pure Malignant Germ Cell Tumors of the Ovary: A Case Series on 10 Years Experience at a Tertiary Care Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor markers namely AFP, βHCG, and LDH increased in all except the
      patients with immature teratoma.
    explanation: >-
      Supports LDH as part of the routinely elevated serum marker panel in
      malignant ovarian germ cell tumor.
  - reference: PMID:26458677
    reference_title: "Ovarian dysgerminoma with normal serum tumour markers presenting in a child with precocious puberty."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum tumour markers including lactate dehydrogenase (LDH), beta-subunit of
      human chorionic gonadotropin (B-hCG) and luteinizing hormone/follicular
      stimulating hormone (LH/FSH) were all normal.
    explanation: >-
      Included as a counter-example: LDH is routinely measured but can be normal
      in early-stage dysgerminoma, so a negative marker panel does not exclude
      disease.
- category: Clinical
  name: Precocious Puberty
  frequency: VERY_RARE
  description: >-
    Hormone-producing components, particularly beta-hCG-secreting trophoblastic
    tissue, can drive isosexual precocious puberty with breast development and
    vaginal bleeding in prepubertal girls; the endocrine picture resolves after
    tumor resection.
  phenotype_term:
    preferred_term: Precocious puberty
    term:
      id: HP:0000826
      label: Precocious puberty
  evidence:
  - reference: PMID:40020991
    reference_title: "Nongestational Ovarian Choriocarcinoma with Precocious Puberty in a 7-Year-Old Girl: A Rare Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 7-year-old girl presented with early puberty and an abdominal mass.
    explanation: >-
      Documents precocious puberty as a presenting feature of a hormone-producing
      malignant ovarian germ cell tumor.
  - reference: PMID:40020991
    reference_title: "Nongestational Ovarian Choriocarcinoma with Precocious Puberty in a 7-Year-Old Girl: A Rare Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following tumor resection, her hormone levels normalized, and symptoms
      resolved.
    explanation: >-
      Confirms the tumor-dependent (paraneoplastic-endocrine) nature of the
      precocious puberty.
- category: Clinical
  name: Primary Amenorrhea With Gonadal Dysgenesis
  frequency: VERY_RARE
  description: >-
    In the subset arising on a dysgenetic gonad, primary amenorrhea and absent
    secondary sexual development are the presenting features that should trigger
    karyotyping and evaluation for Y-chromosome material.
  phenotype_term:
    preferred_term: Primary amenorrhea
    term:
      id: HP:0000786
      label: Primary amenorrhea
  evidence:
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pediatric and adolescent patients with DSD and the presence of the Y
      chromosome who had unambiguous female genitalia and underwent bilateral
      gonadectomy or gonadal biopsy were included in this study
    explanation: >-
      Support is partial: this cohort defines the phenotypically female DSD
      population in which dysgerminoma arises, but the abstract does not itself
      quantify amenorrhea.
- category: Clinical
  name: Gonadal Dysgenesis
  frequency: VERY_RARE
  description: >-
    A dysgenetic streak gonad, most consequentially in 46,XY complete gonadal
    dysgenesis (Swyer syndrome) or Turner syndrome with Y mosaicism, is the
    principal recognized predisposing condition.
  phenotype_term:
    preferred_term: Gonadal dysgenesis
    term:
      id: HP:0000133
      label: Gonadal dysgenesis
  evidence:
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with 46,XY complete gonadal dysgenesis (4/6; 66.7%) had the
      highest tumor occurrence rate.
    explanation: >-
      Directly ties gonadal dysgenesis to the highest observed rate of gonadal
      germ cell neoplasia.
- category: Neurologic
  name: Paraneoplastic Anti-NMDA Receptor Encephalitis
  subtype: Immature Teratoma
  frequency: VERY_RARE
  description: >-
    Ovarian teratomas containing neural tissue that expresses NMDA receptor
    subunits can trigger an antibody-mediated encephalitis with psychiatric
    symptoms, amnesia, seizures, dyskinesias, autonomic instability, and depressed
    consciousness. Tumor resection plus immunotherapy is the definitive treatment,
    which makes this a paraneoplastic syndrome with direct oncologic management
    implications.
  notes: >-
    Scope caveat: the association is with ovarian teratoma broadly, and in the
    defining series the majority of associated tumors were MATURE (benign) cystic
    teratomas, which are explicitly out of scope for this malignant-tumor entry
    and are listed under differential_diagnoses. The phenotype is retained here,
    tagged to the Immature Teratoma subtype, because immature (malignant)
    teratomas also cause it and because finding the tumor changes oncologic
    management; the supporting evidence is therefore marked PARTIAL. Separately,
    HPO has no term for autoimmune or anti-NMDA receptor encephalitis, so this
    phenotype binds the closest available parent (HP:0001298 Encephalopathy) and
    carries the specific syndrome name in preferred_term.
  phenotype_term:
    preferred_term: Anti-NMDA receptor encephalitis
    term:
      id: HP:0001298
      label: Encephalopathy
  evidence:
  - reference: PMID:17262855
    reference_title: "Paraneoplastic anti-N-methyl-D-aspartate receptor encephalitis associated with ovarian teratoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven patients had teratoma of the ovary (six mature) and one a mature
      teratoma in the mediastinum; five of five tumors examined contained nervous
      tissue that strongly expressed NR2 subunits and reacted with patients'
      antibodies.
    explanation: >-
      Establishes the mechanistic link between ovarian teratoma neural tissue and
      the anti-NMDAR autoantibody response. Support is PARTIAL for this entry
      because the snippet itself records that six of the eleven ovarian tumors
      were mature (benign) teratomas, which fall outside the malignant scope of
      this page.
  - reference: PMID:17262855
    reference_title: "Paraneoplastic anti-N-methyl-D-aspartate receptor encephalitis associated with ovarian teratoma."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twelve women (14-44 years) developed prominent psychiatric symptoms,
      amnesia, seizures, frequent dyskinesias, autonomic dysfunction, and
      decreased level of consciousness often requiring ventilatory support.
    explanation: >-
      Describes the encephalopathic syndrome captured by this phenotype; the
      preferred_term is deliberately more specific than the bound HPO term.
      PARTIAL for the same scope reason as the preceding item.

histopathology:
- name: Lymphocyte-Rich Fibrous Septa in Dysgerminoma
  description: >-
    Dysgerminoma classically shows nests and sheets of uniform polygonal cells
    with clear cytoplasm separated by fibrous septa containing a conspicuous
    lymphocytic infiltrate - the ovarian mirror image of testicular seminoma.
  finding_term:
    preferred_term: lymphocytic infiltrate in fibrous septa
    term:
      id: NCIT:C35983
      label: Lymphocytic Infiltrate
  subtype: Dysgerminoma
  diagnostic: true
  evidence:
  - reference: PMID:33577182
    reference_title: "Dysgerminoma of the Ovary: An Analysis of 140 Cases Emphasizing Unusual Microscopic Findings and Resultant Diagnostic Problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an alveolar pattern resulting from delicate fibrovascular septa (51%),
      diffuse (33%), macronodular (14%), insular (26%), cords (28%), solid
      tubular (17%), microspaces (sometimes simulating glands) (12%),
      follicle-like spaces (5%), prominent fibrous bands (65%), stromal edema
      (56%), stromal luteinization (9%), granulomatous infiltrate (46%),
      lymphocytic infiltrate (100%)
    explanation: >-
      A 140-case pure ovarian dysgerminoma series quantifying the defining
      morphology: a lymphocytic infiltrate in every case, with fibrovascular
      septa and prominent fibrous bands as the dominant architectural features.
  - reference: PMID:33577182
    reference_title: "Dysgerminoma of the Ovary: An Analysis of 140 Cases Emphasizing Unusual Microscopic Findings and Resultant Diagnostic Problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      prominent population of cells with pale to clear cytoplasm (73%)
    explanation: >-
      Quantifies the clear-cytoplasm cell population described in this finding.
- name: Immature Neuroepithelium in Immature Teratoma
  description: >-
    The diagnosis and grading of immature teratoma rest on the amount of primitive
    neuroepithelium, seen as immature tubules and rosettes.
  finding_term:
    preferred_term: neuroepithelial rosette
    term:
      id: HP:0031925
      label: Rosette
  subtype: Immature Teratoma
  diagnostic: true
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of immature teratomas relies on the presence of immature or
      embryonic tissues, with neuroepithelium being the most common immature
      element.
    explanation: >-
      Directly supports immature neuroepithelium as the defining and
      grade-determining histologic element of immature teratoma.
- name: Schiller-Duval Bodies in Yolk Sac Tumor
  description: >-
    Perivascular Schiller-Duval bodies are the classic histologic hallmark of the
    yolk sac tumor component.
  finding_term:
    preferred_term: Schiller-Duval body
    term:
      id: NCIT:C54124
      label: Schiller-Duval Body
  subtype: Yolk Sac Tumor
  diagnostic: true
  evidence:
  - reference: PMID:40818404
    reference_title: "Pediatric vaginal yolk sac tumor: A rare case report and diagnostic challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologic analysis confirmed YST, supported by characteristic
      Schiller-Duval bodies and markedly elevated alpha-fetoprotein (AFP)
      levels.
    explanation: >-
      Supports Schiller-Duval bodies as the characteristic diagnostic histologic
      feature of yolk sac tumor.
- name: Germ Cell Tumor Immunophenotype
  description: >-
    Immunohistochemistry assigns subtype. Dysgerminoma is OCT3/4-, SALL4-, PLAP-,
    D2-40-, NANOG- and CD117/KIT-positive; yolk sac tumor is SALL4-, glypican-3-
    and AFP-positive but OCT4-negative; embryonal carcinoma adds SOX2 and CD30;
    choriocarcinoma is beta-hCG-positive and OCT3/4-negative.
  finding_term:
    preferred_term: germ cell tumor immunohistochemical marker panel
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  diagnostic: true
  evidence:
  - reference: PMID:22448662
    reference_title: "Diagnostic utility of CD117, CD133, SALL4, OCT4, TCL1 and glypican-3 in malignant germ cell tumors of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 27 dysgerminomas and all 31 YSTs showed CD117 expression, with only
      nine (29%) positively stained in immature teratomas.
    explanation: >-
      Quantifies CD117/KIT immunoreactivity across ovarian germ cell tumor
      subtypes.
  - reference: PMID:22448662
    reference_title: "Diagnostic utility of CD117, CD133, SALL4, OCT4, TCL1 and glypican-3 in malignant germ cell tumors of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD117 can be used as a diagnostic marker for dysgerminoma and YST. SALL4 is
      a more sensitive and specific marker for YSTs than glypican-3. SALL4 and
      OCT4 are useful in distinguishing YST from dysgerminoma.
    explanation: >-
      Supports the immunohistochemical panel used to distinguish the malignant
      ovarian germ cell tumor subtypes.

biochemical:
- name: Alpha-Fetoprotein
  biomarker_term:
    preferred_term: Alpha-Fetoprotein
    term:
      id: NCIT:C16278
      label: Alpha-Fetoprotein
  presence: >-
    Elevated in yolk sac tumor and in mixed tumors containing a yolk sac
    component; may also be elevated in embryonal carcinoma and immature teratoma.
  specificity: >-
    Lineage-specific for yolk sac (extraembryonic endodermal) differentiation
    within the germ cell tumor spectrum.
  evidence:
  - reference: PMID:27401840
    reference_title: "Prognostic significance of an early decline in serum alpha-fetoprotein during chemotherapy for ovarian yolk sac tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The serum AFP decline was calculated with the formula previously developed
      and validated in male patients with poor prognosis non-seminomatous germ
      cell tumors.
    explanation: >-
      Supports serum AFP as a quantitative, kinetically interpreted biomarker in
      ovarian yolk sac tumor.
- name: Beta-Human Chorionic Gonadotropin
  biomarker_term:
    preferred_term: Human Chorionic Gonadotropin
    term:
      id: NCIT:C2275
      label: Human Chorionic Gonadotropin
  presence: >-
    Markedly elevated in non-gestational choriocarcinoma, frequently elevated in
    embryonal carcinoma, and elevated in the syncytiotrophoblast-containing
    minority of dysgerminomas.
  specificity: Lineage-specific for trophoblastic differentiation.
  evidence:
  - reference: PMID:40020991
    reference_title: "Nongestational Ovarian Choriocarcinoma with Precocious Puberty in a 7-Year-Old Girl: A Rare Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory tests revealed elevated estradiol, β-hCG, and CA125 levels, with
      suppressed luteinizing hormone and follicle-stimulating hormone.
    explanation: >-
      Documents beta-hCG as the diagnostic serum biomarker in ovarian
      choriocarcinoma.
- name: Lactate Dehydrogenase
  biomarker_term:
    preferred_term: Lactate Dehydrogenase
    term:
      id: NCIT:C25184
      label: Lactate Dehydrogenase
  presence: >-
    Associated with dysgerminoma and generally proportional to tumor burden; can
    also rise in other MOGCT histologies.
  specificity: >-
    Least subtype-specific of the three standard germ cell tumor markers; may be
    normal in early-stage dysgerminoma.
  notes: >-
    A normal LDH does not exclude dysgerminoma - reported cases present with a
    completely normal marker panel.
  evidence:
  - reference: PMID:34987988
    reference_title: "Unusual Cases of Pure Malignant Germ Cell Tumors of the Ovary: A Case Series on 10 Years Experience at a Tertiary Care Center."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor markers namely AFP, βHCG, and LDH increased in all except the
      patients with immature teratoma.
    explanation: >-
      Supports LDH as a measured serum biomarker in malignant ovarian germ cell
      tumor evaluation.
- name: Circulating miR-371a-3p
  biomarker_term:
    preferred_term: MicroRNA 371a-3p
    term:
      id: NCIT:C177289
      label: MicroRNA 371a-3p
  presence: >-
    Emerging circulating biomarker overexpressed across malignant germ cell tumor
    sites and histologies (except pure teratoma); validated mainly in testicular
    germ cell tumor and still investigational in ovarian disease.
  evidence:
  - reference: PMID:38611057
    reference_title: "Advancing GCT Management: A Review of miR-371a-3p and Other miRNAs in Comparison to Traditional Serum Tumor Markers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating levels of germ cell tumor (GCT)-associated miRNAs, such as
      miR-371a-3p, can be utilized as efficient and cost-effective alternatives
      in diagnosing and managing patients presenting with GCTs.
    explanation: >-
      Support is partial because the validation evidence is germ-cell-tumor-broad
      (largely testicular) rather than ovarian-specific.

genetic:
- name: Chromosome 12p Gain / Isochromosome 12p
  presence: >-
    Present in the large majority of malignant ovarian germ cell tumors across
    subtypes, typically absent in pure immature teratoma.
  association: >-
    Keystone somatic cytogenetic lesion of postpubertal-type malignant germ cell
    tumor; supports germ cell tumor classification in diagnostically ambiguous
    cases.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:21523721
    reference_title: "KIT gene mutation and amplification in dysgerminoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome 12p anomalies were found in 82% of the dysgerminomas and did
      not correlate with KIT abnormalities.
    explanation: >-
      Quantifies chromosome 12p abnormality frequency in ovarian dysgerminoma.
  - reference: PMID:2302685
    reference_title: "i(12p) in a malignant ovarian tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have found one or more copies of i(12p) in an ovarian germ cell tumor,
      histologically a yolk sac tumor.
    explanation: >-
      Documents isochromosome 12p in an ovarian germ cell tumor, extending the
      lesion beyond dysgerminoma.
- name: KIT
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  presence: >-
    Activating exon 17 codon 816 mutations and gene amplification each in
    approximately 27% of ovarian dysgerminomas; KIT protein expressed in 87%.
  association: >-
    Somatic oncogenic driver enriched in dysgerminoma; associated with advanced
    stage and proposed as a therapeutic target.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Dysgerminoma
  evidence:
  - reference: PMID:21523721
    reference_title: "KIT gene mutation and amplification in dysgerminoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIT mutations occur in approximately one-third of cases of dysgerminomas
      and are associated with advanced stage at presentation. KIT is a potential
      therapeutic target for those dysgerminomas that have the mutation.
    explanation: >-
      Directly supports KIT as a recurrent somatic driver in ovarian dysgerminoma
      with stage association and therapeutic relevance.
  - reference: PMID:37954076
    reference_title: "Seminoma and dysgerminoma: evidence for alignment of clinical trials and de-escalation of systemic chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They share genetic features including KIT and RAS mutations, amplification
      of chromosome 12p, and expression of pluripotency markers (NANOG (Nanog
      homeobox), OCT3/4 (Octamer-binding transcription factor 3/4), and SAL4
      (Spalt-like trascription factor 4)).
    explanation: >-
      Confirms KIT mutation as a shared genetic feature of dysgerminoma and its
      testicular counterpart seminoma.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  presence: Somatic mutation reported particularly in yolk sac tumor.
  association: Somatic oncogenic driver of the RAS-MAPK arm in non-dysgerminomatous MOGCT.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIT mutations are commonly observed in ovarian dysgerminomas and KRAS
      mutations, along with PIK3CA and AKT1 amplifications, are frequently found
      in yolk sac tumors
    explanation: >-
      Supports KRAS mutation as a recurrent somatic alteration in ovarian yolk sac
      tumor.
  - reference: PMID:33435376
    reference_title: "Molecular Characterization of Ovarian Yolk Sac Tumor (OYST)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A subset of three patients (33.3% of all patients) harbored targetable
      oncogenic mutations in KRAS, KIT, ARID1A.
    explanation: >-
      Molecular profiling series documenting targetable KRAS alterations in
      ovarian yolk sac tumor.
- name: PIK3CA
  gene_term:
    preferred_term: PIK3CA
    term:
      id: hgnc:8975
      label: PIK3CA
  presence: Amplification and mutation reported in yolk sac tumor, including persistent and recurrent disease.
  association: Somatic alteration of the PI3K-AKT arm.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:38733954
    reference_title: "Prognostic factors of 87 ovarian yolk sac tumor (OYST) patients and molecular characteristics of persistent and recurrent OYST."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the 8 persistent and recurrent OYST: cancer driver genes including
      ANKRD36, ANKRD62, DNAH8, MUC5B, NUP205, RYR2, STARD9, MUC16, TTN, ARID1A
      and PIK3CA were frequently mutated; cell cycle, ABC transporters, HR, NHEJ
      and AMPK signal pathway demonstrated as the most significantly enriched
      pathways; TMB, DNA MMR gene mutation and MSI were significantly higher.
    explanation: >-
      Supports recurrent PIK3CA alteration in persistent and recurrent ovarian
      yolk sac tumor.
- name: Y-Chromosome Material in a Dysgenetic Gonad
  presence: >-
    Constitutional (germline/karyotypic) Y-chromosome material in a phenotypically
    female individual with gonadal dysgenesis - 46,XY complete gonadal dysgenesis
    or 45,X/46,XY and related Turner mosaicism.
  association: >-
    Strongest recognized predisposing constitutional factor for malignant ovarian
    germ cell tumor, acting through gonadoblastoma; underpins the recommendation
    for prophylactic gonadectomy in high-risk syndromes.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gonadal neoplasia was confirmed in six (27.3%) cases by pathological
      examination of surgical gonadal tissue samples.
    explanation: >-
      Quantifies gonadal neoplasia risk in phenotypically female patients with
      DSD and Y-chromosome material.
  - reference: PMID:39577758
    reference_title: "Gonadal Tumors in Individuals with Turner Syndrome and Y-Chromosome Mosaicism: A Retrospective Multisite Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data shows a prevalence of 24.6% of gonadal tumors in individuals with
      TS +Y and a relatively low risk of malignant transformation (3.5%).
    explanation: >-
      Provides the contrasting, lower malignant-transformation risk in Turner
      syndrome with Y mosaicism, refining the risk gradient across DSD groups.
  - reference: PMID:39577758
    reference_title: "Gonadal Tumors in Individuals with Turner Syndrome and Y-Chromosome Mosaicism: A Retrospective Multisite Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen (29.8%) had gonadoblastoma. Two (4.3%) had dysgerminoma.
    explanation: >-
      Documents the gonadoblastoma-to-dysgerminoma progression pathway in this
      predisposed population.

diagnosis:
- name: Serum Tumor Marker Panel and Imaging Work-up
  description: >-
    Initial evaluation of a rapidly enlarging adnexal mass in a young patient
    combines serum AFP, beta-hCG, and LDH with pelvic ultrasound and
    cross-sectional imaging (MRI preferred over CT in this young population) for
    characterization and staging.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum tumor markers are critical for initial diagnosis and for monitoring
      the disease during and after treatment.
    explanation: >-
      Supports the central diagnostic and monitoring role of the serum marker
      panel.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Advanced imaging modalities like ultrasound, magnetic resonance imaging,
      and computed tomography are essential for staging, monitoring treatment
      response, and detecting recurrences.
    explanation: >-
      Supports the imaging component of the diagnostic and surveillance work-up.
- name: Histopathology With Immunohistochemistry
  description: >-
    Definitive diagnosis and subtyping require histopathology with an
    immunohistochemical panel (SALL4, OCT3/4, PLAP, CD117/KIT, glypican-3, AFP,
    SOX2, CD30, beta-hCG) to separate the germ cell tumor subtypes from each
    other and from epithelial and sex cord-stromal ovarian neoplasms.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathology is pivotal for diagnosis, incorporating immunohistochemical
      markers to differentiate malignant ovarian germ cell tumors subtypes,
      including dysgerminomas, yolk sac tumors, and immature teratomas.
    explanation: >-
      Directly supports immunohistochemistry-assisted histopathology as the
      definitive diagnostic modality.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysgerminoma is frequently positive for SALL4, OCT3/4, alkaline
      phosphatase, placental-like alkaline phosphatase (PLAP), D2-40, NANOG, and
      SCFR.
    explanation: >-
      Specifies the dysgerminoma immunophenotype used in the diagnostic panel.
- name: Karyotype in Premenarchal Presentation
  description: >-
    Karyotyping is recommended in premenarchal girls presenting with a malignant
    ovarian germ cell tumor to detect an underlying dysgenetic gonad with
    Y-chromosome material, which changes management of the contralateral gonad.
  diagnosis_term:
    preferred_term: karyotyping
    term:
      id: NCIT:C16768
      label: Karyotyping
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A preoperative karyotype is ideally recommended for all premenarchal girls.
    explanation: >-
      Directly supports preoperative karyotyping in premenarchal presentations.

treatments:
- name: Fertility-Sparing Surgery
  description: >-
    Unilateral salpingo-oophorectomy with minimal surgical staging is the standard
    primary treatment for adolescents and young adults, preserving the
    contralateral ovary and uterus. Because germ cell tumors are highly
    chemosensitive, extensive or mutilating cytoreduction is avoided.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: unilateral salpingo-oophorectomy
    term:
      id: NCIT:C94469
      label: Unilateral Salpingo-oophorectomy
  target_mechanisms:
  - target: Rapidly Expanding Unilateral Ovarian Mass
    treatment_effect: INHIBITS
    description: >-
      Resection removes the tumor-bearing ovary while preserving reproductive
      potential.
  evidence:
  - reference: PMID:41001186
    reference_title: "Updates in the Management of Malignant Ovarian Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fertility-sparing surgery, including unilateral salpingo-oophorectomy with
      minimal staging, is recommended for adolescent and young adult patients.
    explanation: >-
      Directly supports fertility-sparing unilateral salpingo-oophorectomy as the
      recommended surgical approach.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fertility-sparing surgery is the cornerstone of treatment for stage I
      disease, often followed by close surveillance to minimize the long-term
      toxicities of chemotherapy.
    explanation: >-
      Supports fertility-sparing surgery as the cornerstone of stage I management.
- name: BEP Chemotherapy
  description: >-
    Bleomycin, etoposide, and cisplatin is the standard first-line regimen for
    higher-risk stage I and for stage II-IV malignant ovarian germ cell tumors,
    typically for 3-4 cycles. Bleomycin is generally omitted after 3 cycles
    because of cumulative pulmonary toxicity, and it should be avoided in patients
    with pre-existing pulmonary disease and in those over 40 years old.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  regimen_term:
    preferred_term: BEP regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  target_mechanisms:
  - target: Exquisite Platinum Chemosensitivity
    treatment_effect: MODULATES
    description: >-
      Cisplatin-induced DNA adducts exploit the intrinsic apoptotic sensitivity of
      germ cell tumors.
  evidence:
  - reference: PMID:41001186
    reference_title: "Updates in the Management of Malignant Ovarian Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The bleomycin/etoposide/cisplatin regimen remains the first-line therapy.
    explanation: Directly supports BEP as first-line therapy for MOGCT.
  - reference: PMID:37954076
    reference_title: "Seminoma and dysgerminoma: evidence for alignment of clinical trials and de-escalation of systemic chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both histologies are exquisitely sensitive to platinum chemotherapy, and
      the combination of bleomycin, etoposide, and cisplatin (BEP) yields
      survival rates greater than 90%.
    explanation: >-
      Quantifies the survival achieved with BEP in germinomatous germ cell
      tumors.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the high pulmonary toxicity of bleomycin, it is generally omitted
      after 3 cycles, reaching a maximum total cumulative dose of 270 IU.
    explanation: >-
      Supports the bleomycin cumulative-dose safety constraint described in the
      treatment description.
- name: Risk-Adapted Active Surveillance
  description: >-
    Completely resected, properly staged low-risk disease - stage IA dysgerminoma
    and stage IA grade 1 immature teratoma - is managed by surgery plus
    surveillance rather than adjuvant chemotherapy, because relapse is usually
    salvageable and chemotherapy carries substantial lifelong toxicity in this
    young population. Surveillance combines serial tumor markers with imaging,
    intensified during the first two years.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: active surveillance
  notes: >-
    Left as preferred_term only: no NCIT term reachable from
    "Clinical Intervention or Procedure" (NCIT:C25218) corresponds to
    post-resection active surveillance of a known cancer. "Cancer Screening"
    (NCIT:C15406) is semantically screening of asymptomatic populations and was
    deliberately not used here.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to the ESMO guidelines, Stage IA dysgerminomas and properly
      staged Stage IA Grade 1 immature teratomas should be treated with surgery
      alone, followed by postoperative surveillance.
    explanation: >-
      Directly supports guideline-based surveillance-only management of low-risk
      stage IA disease.
  - reference: PMID:41001186
    reference_title: "Updates in the Management of Malignant Ovarian Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chemotherapy is not recommended for those with surgically resected immature
      teratomas.
    explanation: >-
      Supports omission of adjuvant chemotherapy after complete resection of
      immature teratoma.
  - reference: clinicaltrials:NCT03067181
    reference_title: A Phase 3 Study of Active Surveillance for Low Risk and a Randomized Trial of Carboplatin vs. Cisplatin for Standard Risk Pediatric and Adult Patients With Germ Cell Tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This phase III trial studies how well active surveillance help doctors to
      monitor subjects with low risk germ cell tumors for recurrence after their
      tumor is removed.
    explanation: >-
      Prospective trial evaluating active surveillance in low-risk germ cell
      tumors, including ovarian primaries.
- name: Carboplatin Substitution in Pediatric Patients
  description: >-
    Carboplatin may replace cisplatin in pediatric regimens (for example JEB) to
    reduce nephrotoxicity and ototoxicity while preserving the platinum backbone;
    the cisplatin-versus-carboplatin question in standard-risk disease is under
    randomized evaluation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
  regimen_term:
    preferred_term: JEB regimen
    term:
      id: NCIT:C67289
      label: JEB Regimen
  target_mechanisms:
  - target: Exquisite Platinum Chemosensitivity
    treatment_effect: MODULATES
    description: >-
      Carboplatin retains platinum-adduct-driven cytotoxicity with a different
      toxicity profile.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For pediatric patients, carboplatin may be substituted for cisplatin
    explanation: >-
      Directly supports carboplatin substitution in the pediatric setting.
  - reference: clinicaltrials:NCT03067181
    reference_title: A Phase 3 Study of Active Surveillance for Low Risk and a Randomized Trial of Carboplatin vs. Cisplatin for Standard Risk Pediatric and Adult Patients With Germ Cell Tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trial studies whether carboplatin or cisplatin is the preferred
      chemotherapy to use in treating metastatic standard risk germ cell tumors.
    explanation: >-
      Randomized trial directly addressing the carboplatin-versus-cisplatin
      question in standard-risk germ cell tumors.
- name: Paclitaxel-Carboplatin Chemotherapy
  description: >-
    Paclitaxel plus carboplatin is under randomized evaluation as a less toxic
    alternative to BEP in fertility-preserving treatment of MOGCT; retrospective
    data suggest comparable safety and prognosis, but BEP remains standard.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
  target_mechanisms:
  - target: Exquisite Platinum Chemosensitivity
    treatment_effect: MODULATES
    description: >-
      Preserves platinum-driven cytotoxicity while substituting a taxane for
      bleomycin and etoposide.
  evidence:
  - reference: PMID:36890292
    reference_title: "Fertility and prognosis assessment between bleomycin/etoposide/cisplatin and paclitaxel/carboplatin chemotherapy regimens in the conservative treatment of malignant ovarian germ cell tumors: a multicenter and retrospective study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PC regimen is as safe as the BEP regimen for MOGCT patients with
      fertility preservation treatment, and no differences were observed in
      fertility and clinical prognosis.
    explanation: >-
      Retrospective support only; prospective randomized confirmation is still
      pending, hence PARTIAL.
- name: KIT-Directed Targeted Therapy
  description: >-
    KIT inhibition is a mechanistically motivated but so far experimental strategy
    for the roughly one-third of dysgerminomas that carry activating KIT
    mutations; reported clinical success has been limited.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: KIT and RAS-PI3K Oncogenic Signaling Activation
    treatment_effect: INHIBITS
    description: >-
      Small-molecule inhibition of the constitutively activated KIT receptor
      tyrosine kinase.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Emerging targeted therapies and novel approaches, such as KIT inhibitors
      for dysgerminomas with KIT mutations, remain experimental, with limited
      success reported so far.
    explanation: >-
      Support is partial and explicitly qualified: the strategy is biologically
      rational but has not yet demonstrated clinical benefit.
  - reference: PMID:21523721
    reference_title: "KIT gene mutation and amplification in dysgerminoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KIT is a potential therapeutic target for those dysgerminomas that have the
      mutation.
    explanation: >-
      Provides the molecular rationale for KIT-directed therapy in mutated
      dysgerminoma.
- name: Prophylactic Gonadectomy in High-Risk Gonadal Dysgenesis
  description: >-
    Removal of dysgenetic gonads containing Y-chromosome material - most clearly
    indicated in confirmed 46,XY complete gonadal dysgenesis (Swyer syndrome) and
    considered in Turner syndrome with Y mosaicism - is the only established
    primary prevention for malignant ovarian germ cell tumor.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Dysgenetic Gonad With Y-Chromosome Material
    treatment_effect: INHIBITS
    description: >-
      Removes the at-risk tissue before gonadoblastoma progresses to invasive
      dysgerminoma.
  evidence:
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pediatric patients with 46,XY complete gonadal dysgenesis had a
      significantly increased risk of developing gonadal tumors and underwent
      prophylactic gonadectomy as soon as the diagnosis was confirmed
    explanation: >-
      Directly supports prophylactic gonadectomy in the highest-risk dysgenetic
      gonad group.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      prophylactic gonadectomy may be a reasonable recommendation
    explanation: >-
      Supports prophylactic gonadectomy as a reasonable recommendation in
      high-risk syndromes such as Turner and Swyer syndrome.

- name: High-Dose Chemotherapy With Autologous Stem-Cell Rescue
  description: >-
    For relapse after primary platinum-based chemotherapy, salvage options
    determined by a multidisciplinary team include high-dose chemotherapy with
    stem-cell rescue, further conventional chemotherapy, surgery, radiotherapy,
    or a combination. Evidence in ovarian primaries is largely extrapolated from
    testicular germ cell tumor.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: autologous hematopoietic stem cell transplantation
    term:
      id: NCIT:C16039
      label: Autologous Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Platinum-Resistant Relapse
    treatment_effect: INHIBITS
    description: >-
      Dose intensification with haematopoietic rescue aims to overcome acquired
      platinum resistance at relapse.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-dose chemotherapy with stem-cell transplantation offers promise in
      select cases, while the role of secondary cytoreductive surgery and
      radiotherapy is limited to specific indications.
    explanation: >-
      Support is partial and explicitly hedged by the source: benefit is
      described as promising in selected cases rather than established.
- name: Secondary Cytoreductive Surgery for Growing Teratoma Syndrome
  description: >-
    Resection is the sole required treatment for growing teratoma syndrome -
    enlarging masses during chemotherapy with normalized tumor markers, driven by
    a proliferating benign mature teratoma component - and may also benefit
    selected recurrent immature teratoma and recurrent mixed malignant germ cell
    tumor. Routine secondary cytoreduction is otherwise of uncertain value in
    this chemosensitive disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cytoreductive surgery
    term:
      id: NCIT:C132068
      label: Cytoreductive Surgery
  target_mechanisms:
  - target: Platinum-Resistant Relapse
    treatment_effect: INHIBITS
    description: >-
      Surgery removes chemoresistant residual tissue that systemic therapy
      cannot eliminate.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It appears that recurrent immature teratomas, growing teratoma syndrome,
      or recurrent mixed malignant germ cell tumors may benefit from
      cytoreductive surgery
    explanation: >-
      Names the specific recurrence settings in which secondary cytoreduction is
      indicated.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In these cases, surgery is the sole required treatment, aimed at
      alleviating compression symptoms and disease-related morbidity.
    explanation: >-
      Establishes surgery as the definitive and sufficient treatment of growing
      teratoma syndrome.

differential_diagnoses:
- name: Epithelial Ovarian Carcinoma
  disease_term:
    preferred_term: ovarian carcinoma
    term:
      id: MONDO:0005140
      label: ovarian carcinoma
  description: >-
    The dominant ovarian malignancy overall, but typically in older patients,
    CA-125-driven rather than AFP/beta-hCG-driven, and biologically and
    therapeutically distinct from germ cell tumors.
  distinguishing_features:
  - Older age at onset
  - Epithelial immunophenotype (PAX8, CK7) without germ cell markers (SALL4, OCT3/4, CD117)
  - Absence of chromosome 12p gain
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Non-epithelial ovarian tumors constitute approximately 10% of all ovarian
      cancers, with malignant ovarian germ cell tumors accounting for about 5%
    explanation: >-
      Frames germ cell tumors as a small non-epithelial minority that must be
      distinguished from the far more common epithelial ovarian cancers.
- name: Mature Cystic Teratoma
  disease_term:
    preferred_term: mature ovarian teratoma
    term:
      id: MONDO:0003820
      label: mature ovarian teratoma
  description: >-
    The benign counterpart of immature teratoma (dermoid cyst); far more common
    and managed by cystectomy alone.
  distinguishing_features:
  - Absence of immature (usually neuroepithelial) tissue on thorough sampling
  - Normal serum tumor markers
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of immature teratomas relies on the presence of immature or
      embryonic tissues, with neuroepithelium being the most common immature
      element.
    explanation: >-
      Identifies the histologic criterion that separates immature (malignant)
      from mature (benign) teratoma.

- name: Small Cell Carcinoma of the Ovary, Hypercalcemic Type
  disease_term:
    preferred_term: hypercalcemic type ovarian small cell carcinoma
    term:
      id: MONDO:0004319
      label: hypercalcemic type ovarian small cell carcinoma
  description: >-
    A highly aggressive SMARCA4-deficient ovarian malignancy that also affects
    young women and can mimic dysgerminoma microscopically.
  distinguishing_features:
  - Hypercalcemia and SMARCA4/BRG1 loss by immunohistochemistry
  - Absence of germ cell markers (SALL4, OCT3/4, CD117) and of a lymphocytic infiltrate
  - Markedly worse prognosis and platinum-refractory behaviour
  evidence:
  - reference: PMID:33577182
    reference_title: "Dysgerminoma of the Ovary: An Analysis of 140 Cases Emphasizing Unusual Microscopic Findings and Resultant Diagnostic Problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      certain tumors of very different nature being in the differential such as
      undifferentiated carcinoma not otherwise specified, small cell carcinoma of
      hypercalcemic type, and malignant lymphoma
    explanation: >-
      A 140-case dysgerminoma series naming small cell carcinoma of hypercalcemic
      type among the tumors that variant dysgerminoma morphology can mimic.
- name: Malignant Lymphoma Involving the Ovary
  disease_term:
    preferred_term: ovarian lymphoma
    term:
      id: MONDO:0002227
      label: ovarian lymphoma
  description: >-
    Ovarian involvement by lymphoma produces a diffuse population of
    discohesive cells that can be mistaken for dysgerminoma.
  distinguishing_features:
  - CD45/lymphoid immunophenotype with absent SALL4, OCT3/4 and CD117
  - Absence of fibrovascular septa and of chromosome 12p gain
  evidence:
  - reference: PMID:33577182
    reference_title: "Dysgerminoma of the Ovary: An Analysis of 140 Cases Emphasizing Unusual Microscopic Findings and Resultant Diagnostic Problems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      certain tumors of very different nature being in the differential such as
      undifferentiated carcinoma not otherwise specified, small cell carcinoma of
      hypercalcemic type, and malignant lymphoma
    explanation: >-
      The same dysgerminoma series names malignant lymphoma as a recognized
      diagnostic pitfall.

clinical_trials:
- name: NCT03067181
  phase: PHASE_III
  status: RECRUITING
  description: >-
    Pediatric and adult germ cell tumor trial (AGCT1531) combining active
    surveillance for low-risk disease with a randomized comparison of
    carboplatin- versus cisplatin-based chemotherapy for standard-risk metastatic
    disease. Directly relevant to both the de-escalation and the
    platinum-selection questions in malignant ovarian germ cell tumor.
  target_phenotypes:
  - preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  evidence:
  - reference: clinicaltrials:NCT03067181
    reference_title: A Phase 3 Study of Active Surveillance for Low Risk and a Randomized Trial of Carboplatin vs. Cisplatin for Standard Risk Pediatric and Adult Patients With Germ Cell Tumors
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trial studies whether carboplatin or cisplatin is the preferred
      chemotherapy to use in treating metastatic standard risk germ cell tumors.
    explanation: >-
      Trial directly addresses platinum selection and treatment de-escalation
      across pediatric and adult germ cell tumors including ovarian primaries.
- name: NCT02429687
  phase: PHASE_III
  status: RECRUITING
  description: >-
    MOGCT-01, an ovarian-specific randomized phase III trial comparing
    paclitaxel/carboplatin with BEP after surgery in newly diagnosed malignant
    ovarian germ cell tumor.
  target_phenotypes:
  - preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  notes: >-
    The falcon deep-research report flagged that the registry eligibility field
    for this study inconsistently mentions sex cord-stromal histologies despite
    the title and intervention summary specifying MOGCT; eligibility should be
    verified directly before referral.
  evidence:
  - reference: clinicaltrials:NCT02429687
    reference_title: "A Multicenter, Prospective, Randomized Trial Comparing Paclitaxel and Carboplatin or Bleomycin, Etoposide and Cisplatin in the Treatment of Malignant Ovarian Germ Cell Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Investigators will conduct the trial to determine whether paclitaxel and
      cisplatin (PT) has the same curative effects and less adverse effects than
      bleomycin, etoposide and cisplatin(BEP) among newly diagnosed malignant
      ovarian germ cell tumor patients after surgery.
    explanation: >-
      Ovarian-specific randomized evaluation of a less toxic alternative to BEP.

references:
- reference: PMID:37296950
  title: "Molecular Biology of Pediatric and Adult Ovarian Germ Cell Tumors: A Review"
  found_in:
  - Malignant_Germ_Cell_Tumor_of_Ovary-deep-research-falcon.md
  findings:
  - statement: >-
      Ovarian germ cell tumors are rare and occur predominantly in children,
      adolescents, and young adults, accounting for roughly 11% of cancer
      diagnoses in those age groups.
    supporting_text: >-
      Ovarian germ cell tumors (OGCTs) are rare in adults; indeed, they occur
      predominantly in children, adolescents, and young adults, and they account
      for approximately 11% of cancer diagnoses in these groups.
- reference: PMID:37372675
  title: Clinical Challenges in the Management of Malignant Ovarian Germ Cell Tumours
  found_in:
  - Malignant_Germ_Cell_Tumor_of_Ovary-deep-research-falcon.md
  findings:
  - statement: >-
      Epidemiology, histologic classification, marker use, and management
      challenges for malignant ovarian germ cell tumors.
    supporting_text: >-
      GCTs represent 2-5% of ovarian cancers, with a yearly incidence of
      4:100,000, and they usually affect young women and adolescents.
- reference: PMID:35935368
  title: >-
    Gonadal tumor risk in pediatric and adolescent phenotypic females with
    disorders of sex development and Y chromosomal constitution with different
    genetic etiologies
  found_in:
  - Malignant_Germ_Cell_Tumor_of_Ovary-deep-research-falcon.md
  findings:
  - statement: >-
      Dysgenetic gonads with Y-chromosome material carry the highest recognized
      germ cell tumor risk, greatest in 46,XY complete gonadal dysgenesis.
    supporting_text: >-
      Gonadal neoplasia was confirmed in six (27.3%) cases by pathological
      examination of surgical gonadal tissue samples.

notes: >-
  Scope and lump/split boundary. This entry is the umbrella (root) MOGCT page for
  MONDO:0018171 and is deliberately complementary to three pre-existing dismech
  entries rather than a superset of them:
  Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary (MONDO:0016096, the
  non-dysgerminomatous half of the same split), Yolk_Sac_Tumor (MONDO:0005744,
  site-agnostic), and Mixed_Germ_Cell_Tumor (MONDO:0015864, site-agnostic). To
  avoid duplication, mechanism here is curated (a) on the axis shared by all
  MOGCT histologies - primordial germ cell origin with retained pluripotency,
  chromosome 12p gain, lineage-specific marker secretion, bulky unilateral mass,
  platinum chemosensitivity - and (b) on the dysgerminoma arm and the dysgenetic
  gonad/Y-chromosome predisposition, neither of which is covered by any existing
  dismech entry (there is no standalone Dysgerminoma page). Yolk sac tumor,
  immature teratoma, embryonal carcinoma, choriocarcinoma, and mixed tumors are
  represented as has_subtypes with cross-references, and their subtype-specific
  detail is intentionally left in the dedicated entries. Mechanisms from
  epithelial ovarian carcinoma pages must not be imported here.

  Open modelling question for reviewers: MONDO also carries
  MONDO:0020538 "malignant dysgerminomatous germ cell tumor of ovary" as the
  exact sibling of MONDO:0016096. A cleaner long-term structure would be a
  dedicated Malignant_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary Disease entry
  mirroring the existing non-dysgerminomatous one, with MONDO:0018171 modeled as
  a kb/groupings/ Grouping over the two. That restructuring is deliberately NOT
  attempted here because it would also require rewriting an existing entry;

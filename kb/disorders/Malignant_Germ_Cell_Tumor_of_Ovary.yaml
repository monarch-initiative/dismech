- name: Histology-Determining Epigenetic Reprogramming
  biological_scale: MOLECULAR
  role: driver
  description: >-
    Germ cells undergo complete epigenetic reprogramming during development, and
    the DNA-methylation state at which transformation arrests is a principal
    determinant of which histology results. An epigenome-wide study of 154
    paediatric germ cell tumours identified 8,481 differentially methylated
    regions between histologies, and unsupervised clustering on those regions
    recovered four clusters corresponding to tumour histology rather than to
    age, anatomical location, sex or FFPE status. Germinomatous tumours
    (germinoma/seminoma/dysgerminoma) are globally hypomethylated relative to
    yolk sac tumour. This is the layer that the copy-number arm does not
    explain: 12p gain is shared across MOGCT histologies, so it cannot by itself
    account for the germinomatous versus non-germinomatous split, whereas the
    methylation state clusters by exactly that split.
  notes: >-
    This node closes the epigenetics gap previously disclosed in the entry-level
    notes. The blocker recorded there - that the only cached source was an
    abstract with no quotable methylation sentence - was resolved by caching the
    Children's Oncology Group epigenome-wide study (PMID:30287918) as a citable
    primary source. Scope caveat: that cohort is paediatric germ cell tumours at
    all sites, not ovary-restricted, and the specific IGF2/H19
    imprinting-control claim in the deep-research artifact remains unmodelled
    for want of a snippet-verifiable source.
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: epigenetic (DNA methylation) regulation of gene expression
    term:
      id: GO:0040029
      label: epigenetic regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:30287918
    reference_title: "Differences in DNA methylation profiles by histologic subtype of paediatric germ cell tumours: a report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 8,481 DMRs (FWER < 0.05). Unsupervised hierarchical
      clustering of individual probes within DMRs resulted in four high level
      clusters closely corresponding to tumour histology.
    explanation: >-
      Establishes in 154 primary human paediatric germ cell tumours that
      methylation state partitions the tumours by histology, which is the claim
      this node makes.
  - reference: PMID:30287918
    reference_title: "Differences in DNA methylation profiles by histologic subtype of paediatric germ cell tumours: a report from the Children's Oncology Group."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germinomas displayed lower levels of methylation across the DMRs relative
      to the other histologic subtypes.
    explanation: >-
      Supports the specific germinomatous-hypomethylation direction that
      distinguishes the dysgerminoma arm from the non-germinomatous arm.
  - reference: PMID:30287918
    reference_title: "Differences in DNA methylation profiles by histologic subtype of paediatric germ cell tumours: a report from the Children's Oncology Group."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormal DNA methylation may be important in germ cell tumour (GCT)
      aetiology, as germ cells undergo complete epigenetic reprogramming during
      development.
    explanation: >-
      Gives the developmental rationale linking the primordial germ cell origin
      to epigenetic susceptibility. Marked PARTIAL because the source frames it
      as "may be important" rather than as an established causal claim.
  downstream:
  - target: Divergent Germinomatous and Non-Germinomatous Differentiation
    description: >-
      The methylation state at which the transformed germ cell arrests
      determines whether it follows the germinomatous or the non-germinomatous
      (embryonic/extraembryonic) differentiation programme.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

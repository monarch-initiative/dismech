definitions:
- name: Malignant ovarian germ cell tumor case definition
  definition_type: CASE_DEFINITION
  description: >-
    A malignant ovarian neoplasm derived from the ovarian germ cell lineage,
    encompassing the primitive germ cell tumors (dysgerminoma, yolk sac tumor,
    embryonal carcinoma, non-gestational choriocarcinoma, mixed germ cell tumor)
    and malignant (immature) teratoma, and excluding epithelial ovarian carcinoma
    and sex cord-stromal tumors.
  scope: Rare gynecologic oncology disease grouping
  evidence:
  - reference: PMID:37372675
    reference_title: "Clinical Challenges in the Management of Malignant Ovarian Germ Cell Tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Precursory germ cells of the ovary form the basis of GCT. They are
      histologically classified into primitive GCT, teratomas, and monodermal
      and somatic-type tumours associated with dermoid cysts.
    explanation: >-
      Establishes the ovarian germ cell origin and the histologic classification
      framework used to scope this umbrella entry.
  - reference: PMID:37372675
    reference_title: "Clinical Challenges in the Management of Malignant Ovarian Germ Cell Tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A primitive GCT can be either a yolk sac tumour (YST), dysgerminoma, or
      mixed germ cell neoplasm. Teratomas are either mature (benign) or
      immature (malignant).
    explanation: >-
      Supports the specific histologic membership of the malignant ovarian germ
      cell tumor category modeled in has_subtypes.

has_subtypes:
- name: Dysgerminoma
  display_name: Ovarian dysgerminoma
  subtype_frequency: "35-50% of malignant ovarian germ cell tumors"
  description: >-
    The ovarian counterpart of testicular seminoma and the most common malignant
    ovarian germ cell histology. Composed of undifferentiated germinoma-like
    cells that retain the pluripotency program (OCT3/4, NANOG, SALL4) and express
    KIT/CD117. LDH is the usual serum marker; a syncytiotrophoblastic minority
    can secrete beta-hCG. Dysgerminoma is bilateral in a minority of pure cases
    (about 4-15% across series) and is the most chemosensitive MOGCT histology. This is the arm of the MOGCT
    spectrum with no dedicated dismech entry, so its mechanism is curated in
    depth on this page.
  subtype_term:
    preferred_term: ovarian dysgerminoma
    term:
      id: MONDO:0003481
      label: dysgerminoma of ovary
  evidence:
  - reference: PMID:21523721
    reference_title: "KIT gene mutation and amplification in dysgerminoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysgerminoma, the ovarian counterpart of seminoma, is the most common type
      of malignant ovarian germ cell tumor.
    explanation: >-
      Directly supports dysgerminoma as the most common malignant ovarian germ
      cell tumor histology and its equivalence to testicular seminoma.
- name: Yolk Sac Tumor
  display_name: Ovarian yolk sac tumor
  description: >-
    Endodermal sinus tumor showing extraembryonic (yolk sac/primitive endoderm)
    differentiation, marked by alpha-fetoprotein secretion and Schiller-Duval
    bodies. Yolk sac histology is an adverse prognostic factor and all yolk sac
    tumors receive adjuvant chemotherapy outside carefully selected stage IA-IB
    marker-negative disease. Curated in depth in the dedicated dismech entries
    Yolk_Sac_Tumor and
    Malignant_Non_Dysgerminomatous_Germ_Cell_Tumor_Of_Ovary.
  subtype_term:
    preferred_term: ovarian yolk sac tumor
    term:
      id: MONDO:0006344
      label: ovarian yolk sac tumor
  evidence:
  - reference: PMID:22448662
    reference_title: "Diagnostic utility of CD117, CD133, SALL4, OCT4, TCL1 and glypican-3 in malignant germ cell tumors of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SALL4 and glypican-3 were strongly positive in 100 and 79.3%,
      respectively, of YSTs.
    explanation: >-
      Documents the ovarian yolk sac tumor immunophenotype that distinguishes
      this subtype within a series of malignant ovarian germ cell tumors.
- name: Immature Teratoma
  display_name: Ovarian immature teratoma
  description: >-
    Malignant teratoma graded by the quantity of immature (usually
    neuroepithelial) tissue. It is the one MOGCT histology in which chromosome
    12p gain is typically absent, and completely resected disease is frequently
    managed by surveillance alone rather than chemotherapy.
  subtype_term:
    preferred_term: ovarian immature teratoma
    term:
      id: MONDO:0018369
      label: immature ovarian teratoma
  evidence:
  - reference: PMID:38544795
    reference_title: "Consensus and controversy in the management of paediatric and adult patients with ovarian immature teratoma: the Malignant Germ Cell International Consortium perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ovarian immature teratoma (IT) is a rare neoplasm comprising ∼3% of
      ovarian cancers, occurring primarily in young females.
    explanation: >-
      Supports ovarian immature teratoma as a distinct rare ovarian germ cell
      neoplasm of young patients.
- name: Embryonal Carcinoma
  display_name: Ovarian embryonal carcinoma
  description: >-
    A very rare primitive MOGCT showing embryonic (epiblast-like) differentiation
    with OCT3/4, SALL4, SOX2, and CD30 expression. It is frequently
    hormone-producing (beta-hCG) and carries the worst survival of the MOGCT
    histotypes in SEER analyses.
  subtype_term:
    preferred_term: ovarian embryonal carcinoma
    term:
      id: MONDO:0003581
      label: ovarian embryonal carcinoma
  evidence:
  - reference: PMID:33706324
    reference_title: "Clinicopathological Features, Prognostic Factors, Survival Trends, and Treatment of Malignant Ovarian Germ Cell Tumors: A SEER Database Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysgerminoma patients had the most favorable outcomes, whereas EC patients
      had the worst survival.
    explanation: >-
      Supports embryonal carcinoma as the MOGCT histotype with the poorest
      outcome and dysgerminoma as the most favorable.
- name: Non-Gestational Choriocarcinoma
  display_name: Non-gestational ovarian choriocarcinoma
  description: >-
    Extremely rare trophoblastic MOGCT that secretes large amounts of beta-hCG
    and may present with precocious puberty or abnormal uterine bleeding.
    Distinguishing it from gestational choriocarcinoma metastatic to the ovary
    can require genotyping.
  subtype_term:
    preferred_term: non-gestational ovarian choriocarcinoma
    term:
      id: MONDO:0004322
      label: non-gestational ovarian choriocarcinoma
  evidence:
  - reference: PMID:40020991
    reference_title: "Nongestational Ovarian Choriocarcinoma with Precocious Puberty in a 7-Year-Old Girl: A Rare Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nongestational ovarian choriocarcinoma (NGOC) is extremely rare,
      particularly in the pediatric population.
    explanation: >-
      Supports non-gestational ovarian choriocarcinoma as an extremely rare
      MOGCT subtype.
- name: Mixed Malignant Germ Cell Tumor
  display_name: Mixed malignant ovarian germ cell tumor
  description: >-
    A tumor containing two or more distinct malignant germ cell components. Serum
    marker pattern and management follow the composition and quantity of the
    components present. Curated in depth in the dedicated dismech entry
    Mixed_Germ_Cell_Tumor.
  subtype_term:
    preferred_term: ovarian mixed germ cell neoplasm
    term:
      id: MONDO:0003710
      label: ovarian mixed germ cell neoplasm
  evidence:
  - reference: PMID:33142349
    reference_title: "Imaging in gynecological disease (22): clinical and ultrasound characteristics of ovarian embryonal carcinomas, non-gestational choriocarcinomas and malignant mixed germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To describe the clinical and ultrasound characteristics of three types of
      rare malignant ovarian germ cell tumor: embryonal carcinoma,
      non-gestational choriocarcinoma and malignant mixed germ cell tumor.
    explanation: >-
      Supports malignant mixed germ cell tumor as one of the recognized rare
      malignant ovarian germ cell tumor types.

prevalence:
- population: Worldwide (women)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.4
  notes: >-
    The source states a yearly incidence of "4:100,000" alongside the statement
    that malignant germ cell tumors make up 2-5% of ovarian cancers. That
    printed figure is internally inconsistent with the rest of the literature
    and with the age-specific pediatric rate curated below (5.7 per million at
    age 14, in the peak age band), so it is normalized here as 4 per 1,000,000
    women per year (0.4 per 100,000). The verbatim source wording is retained in
    the snippet.
  evidence:
  - reference: PMID:37372675
    reference_title: "Clinical Challenges in the Management of Malignant Ovarian Germ Cell Tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCTs represent 2-5% of ovarian cancers, with a yearly incidence of
      4:100,000, and they usually affect young women and adolescents.
    explanation: >-
      Provides both the proportion among ovarian cancers and the reported annual
      incidence used for this record.
- population: Girls aged 14 years
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.57
  notes: >-
    Approximately 5.7 cases per million among 14-year-old patients, rising
    further in the 15-19 year age band.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the incidence rate is approximately 5.7 cases per million among 14-year-old
      patients
    explanation: >-
      Gives the age-specific pediatric incidence used to populate this
      age-stratified record.

progression:
- phase: Adolescent and young adult presentation
  age_range: Childhood to young adulthood
  notes: >-
    Ovarian germ cell tumors are the leading gynecologic malignancy in patients
    younger than 25 years.
  evidence:
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Testicular GCTs (TGCTs) are the most common cancers in 15- to 39-year-old
      men, and ovarian GCTs (OvGCTs) are the leading gynecologic malignancies in
      women younger than 25 years.
    explanation: >-
      Supports the adolescent and young adult age distribution of ovarian germ
      cell tumors.
- phase: Rapid growth with early-stage detection
  notes: >-
    Because these tumors grow quickly and become symptomatic early, most are
    detected at an early FIGO stage, and survival tracks strongly with stage.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival rates are strongly correlated with International Federation of
      Gynecology and Obstetrics (FIGO) stage
    explanation: >-
      Establishes the stage dependence of outcome across the malignant ovarian
      germ cell tumor spectrum; the source reports 5-year overall survival of
      91% for stage I versus 59% for stage IV.
- phase: Early relapse window
  notes: >-
    Recurrence is concentrated in the first two years after diagnosis, which
    determines the intensity of the post-treatment surveillance schedule.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since approximately 75% of malignant ovarian germ cell tumors recurrences
      occur within the first 2 years after initial diagnosis
    explanation: >-
      Supports the front-loaded relapse risk that shapes surveillance intensity.

pathophysiology:
- name: Dysgenetic Gonad With Y-Chromosome Material
  biological_scale: TISSUE
  role: trigger
  description: >-
    A minority of malignant ovarian germ cell tumors arise on an identifiable
    predisposing substrate: a dysgenetic (streak) gonad containing Y-chromosome
    material, as in 46,XY complete gonadal dysgenesis (Swyer syndrome) or Turner
    syndrome with Y mosaicism. Germ cells in a dysgenetic gonad fail to complete
    maturation and persist in an OCT3/4-positive pluripotent state; expression of
    gonadoblastoma-region Y genes (TSPY) in that setting marks cells that can
    progress through gonadoblastoma to invasive dysgerminoma. This is the basis
    for prophylactic gonadectomy in high-risk differences of sex development.
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  biological_processes:
  - preferred_term: germ cell development
    modifier: ABNORMAL
    term:
      id: GO:0007281
      label: germ cell development
  evidence:
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with 46,XY complete gonadal dysgenesis (4/6; 66.7%) had the
      highest tumor occurrence rate.
    explanation: >-
      Quantifies gonadal tumor risk in the highest-risk dysgenetic-gonad group
      that underlies this predisposing node.
  - reference: PMID:35935368
    reference_title: "Gonadal tumor risk in pediatric and adolescent phenotypic females with disorders of sex development and Y chromosomal constitution with different genetic etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 44 gonadal samples from these 22 patients, the following were
      identified: five gonadoblastomas, three dysgerminomas, and two Leydig cell
      tumors.
    explanation: >-
      Documents the gonadoblastoma-to-dysgerminoma tumor spectrum that arises in
      dysgenetic gonads with Y-chromosome material.
  - reference: PMID:35481403
    reference_title: "Sex chromosome DSD individuals with mosaic 45,X0 and aberrant Y chromosomes in 46,XY cells: distinct gender phenotypes and germ cell tumour risks."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With specific antibodies for OCT3/4 expression, we marked the pluripotent
      germ cell fraction being potential tumour precursor cells.
    explanation: >-
      Supports persistent OCT3/4-positive pluripotent germ cells in dysgenetic
      gonads as the tumour precursor population.
  downstream:
  - target: Primordial Germ Cell Transformation With Retained Pluripotency
    description: >-
      Immature, OCT3/4-positive germ cells trapped in a dysgenetic gonad are the
      substrate for malignant transformation.

- name: Primordial Germ Cell Transformation With Retained Pluripotency
  biological_scale: CELLULAR
  role: driver
  description: >-
    Malignant ovarian germ cell tumors derive from primordial germ cells that
    fail to complete normal oogenesis and instead retain an embryonic pluripotency
    program (OCT3/4, NANOG, SALL4). This retained stemness both permits survival
    outside the normal differentiation trajectory and supplies the capacity for
    subsequent multi-lineage (embryonic and extraembryonic) differentiation that
    generates the histologic diversity of the disease.
  cell_types:
  - preferred_term: primordial germ cell
    term:
      id: CL:0000670
      label: primordial germ cell
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  biological_processes:
  - preferred_term: stem cell population maintenance
    modifier: INCREASED
    term:
      id: GO:0019827
      label: stem cell population maintenance
  - preferred_term: germ cell development
    modifier: ABNORMAL
    term:
      id: GO:0007281
      label: germ cell development
  evidence:
  - reference: PMID:33435376
    reference_title: "Molecular Characterization of Ovarian Yolk Sac Tumor (OYST)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The malignant ovarian GCTs (mOGCTs) are assumed to derive from primordial
      germ cells (PGCs) with inherited or somatically acquired alterations [2].
    explanation: >-
      Directly supports primordial germ cells as the inferred cell of origin for
      malignant ovarian germ cell tumors.
  - reference: PMID:37954076
    reference_title: "Seminoma and dysgerminoma: evidence for alignment of clinical trials and de-escalation of systemic chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They share genetic features including KIT and RAS mutations, amplification
      of chromosome 12p, and expression of pluripotency markers (NANOG (Nanog
      homeobox), OCT3/4 (Octamer-binding transcription factor 3/4), and SAL4
      (Spalt-like trascription factor 4)).
    explanation: >-
      Documents retained pluripotency-factor expression together with the
      characteristic KIT/RAS and 12p alterations of germinomatous germ cell
      tumors.
  downstream:
  - target: Chromosome 12p Gain and Copy-Number-Driven Genome Imbalance
    description: >-
      The transformed pluripotent germ cell acquires the characteristic germ cell
      tumor cytogenetic lesion.
  - target: Divergent Germinomatous and Non-Germinomatous Differentiation
    description: >-
      Retained pluripotency permits divergent differentiation into the several
      MOGCT histologies.
  - target: Histology-Determining Epigenetic Reprogramming
    description: >-
      The developmental epigenetic reprogramming that primordial germ cells
      normally undergo is the substrate on which the histology-determining
      methylation state is set at transformation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Chromosome 12p Gain and Copy-Number-Driven Genome Imbalance
  biological_scale: MOLECULAR
  role: driver
  description: >-
    Rather than a high point-mutation burden, malignant germ cell tumors are
    driven principally by copy-number imbalance. Gain of the short arm of
    chromosome 12, frequently as isochromosome 12p, is the keystone cytogenetic
    lesion shared across postpubertal-type germ cell tumors of the ovary and
    testis. Pure immature teratoma is the notable exception in which 12p gain is
    typically absent, which is consistent with its distinct
    meiotic-error/parthenogenetic origin.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:21523721
    reference_title: "KIT gene mutation and amplification in dysgerminoma of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome 12p anomalies were found in 82% of the dysgerminomas and did
      not correlate with KIT abnormalities.
    explanation: >-
      Quantifies chromosome 12p anomalies in ovarian dysgerminoma and shows they
      are independent of KIT status.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent genetic alteration across all malignant ovarian germ cell
      tumors subtypes, except for pure immature teratomas, is a gain in chromosome
      12p.
    explanation: >-
      Supports 12p gain as the dominant recurrent alteration across MOGCT
      subtypes and its absence in pure immature teratoma.
  downstream:
  - target: KIT and RAS-PI3K Oncogenic Signaling Activation
    description: >-
      Copy-number-driven genome imbalance co-occurs with activating lesions in
      the KIT/RAS/PI3K mitogenic axis.

- name: KIT and RAS-PI3K Oncogenic Signaling Activation
  biological_scale: MOLECULAR
  role: driver
  conforms_to: "sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion"
  description: >-
    The dominant recurrent oncogenic lesions of malignant ovarian germ cell tumors
    fall in the receptor tyrosine kinase and downstream mitogenic pathways.
    Activating KIT mutations (characteristically exon 17 codon 816) and KIT
    amplification are enriched in dysgerminoma, where KIT/CD117 protein is
    expressed in the large majority of tumors; KRAS mutations together with PIK3CA
    and AKT1 amplification cluster instead in yolk sac tumor. KIT mutation is
    associated with more advanced stage at presentation and defines the rationale
    for KIT-inhibitor trials in dysgerminoma.

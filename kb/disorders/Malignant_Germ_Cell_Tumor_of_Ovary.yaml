- name: Divergent Germinomatous and Non-Germinomatous Differentiation
  biological_scale: CELLULAR
  role: effector
  description: >-
    The histologic diversity of MOGCT reflects which differentiation program the
    transformed pluripotent germ cell adopts. Cells that remain germinoma-like
    produce dysgerminoma (OCT3/4-, NANOG-, SALL4-, CD117-positive, AFP-negative);
    extraembryonic differentiation produces yolk sac tumor (SALL4-, glypican-3-,
    AFP-positive, OCT4-negative) and non-gestational choriocarcinoma;
    embryonic/somatic differentiation produces embryonal carcinoma and immature
    teratoma; simultaneous divergent differentiation produces mixed tumors. The
    resulting immunophenotype is what pathology uses to assign subtype.
  biological_processes:
  - preferred_term: cell differentiation
    modifier: ABNORMAL
    term:
      id: GO:0030154
      label: cell differentiation
  evidence:
  - reference: PMID:22448662
    reference_title: "Diagnostic utility of CD117, CD133, SALL4, OCT4, TCL1 and glypican-3 in malignant germ cell tumors of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All dysgerminomas were positive for OCT4, whereas all YSTs and immature
      teratomas were negative.
    explanation: >-
      Demonstrates that ovarian germ cell tumor subtypes are separated by
      divergent, lineage-specific differentiation programs detectable by
      immunophenotype.
  - reference: PMID:33435376
    reference_title: "Molecular Characterization of Ovarian Yolk Sac Tumor (OYST)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primitive GCTs are subdivided into the ovarian counterpart of the male
      testicular seminoma, dysgerminoma (DG), and non-DGs. The development of
      non-DGs is characterized by differentiation into cell histologies that mimic
      embryonic tissues (embryonal carcinoma (EC), teratoma) and extraembryonic
      tissues (yolk sac tumor (YST) or non-gestational choriocarcinoma (CC))
      (Figure 1) [2].
    explanation: >-
      Directly describes the germinomatous versus embryonic/extraembryonic
      differentiation split modeled by this node.
  downstream:
  - target: Lineage-Specific Tumor Marker Secretion
    description: >-
      Each differentiation program secretes a characteristic serum marker.
  - target: Rapidly Expanding Unilateral Ovarian Mass
    description: >-
      All differentiation programs converge on formation of a bulky ovarian
      tumor.
  - target: Peritoneal, Nodal, and Distant Dissemination
    description: >-
      Histology determines the dominant dissemination route (lymphatic for
      dysgerminoma, peritoneal for yolk sac tumor, haematogenous for
      choriocarcinoma).

- name: Lineage-Specific Tumor Marker Secretion
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Because each MOGCT histology recapitulates a different embryonic lineage, each
    secretes a different circulating marker: yolk sac differentiation produces
    alpha-fetoprotein, trophoblastic differentiation produces beta-hCG, and
    dysgerminoma releases lactate dehydrogenase in proportion to tumor burden.
    Embryonal carcinoma can produce either AFP or beta-hCG. This lineage-to-marker
    mapping makes serum markers simultaneously a subtype clue, a staging aid, and
    the principal response and relapse monitor.
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum tumor markers are critical for initial diagnosis and for monitoring
      the disease during and after treatment.
    explanation: >-
      Supports the diagnostic and monitoring role of the lineage-specific serum
      markers modeled by this node.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike other non-dysgerminomatous germ cell tumors, embryonal carcinoma is
      frequently associated with signs of hormone production, particularly human
      chorionic gonadotropin
    explanation: >-
      Documents histology-specific hormone production, the basis for
      lineage-specific marker secretion.

- name: Rapidly Expanding Unilateral Ovarian Mass
  biological_scale: TISSUE
  role: outcome
  description: >-
    MOGCTs typically form a large, solid or solid-cystic, unilateral ovarian mass
    that enlarges over only weeks. Mass effect and capsular stretch produce
    abdominal pain and distension, and the pedunculated bulky mass is prone to
    torsion or rupture, which can present as an acute abdomen. Rapid growth is
    also why most tumors become symptomatic - and therefore are detected - at an
    early FIGO stage.
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common presenting symptoms include abdominal pain and a palpable
      pelvic-abdominal mass. Acute abdominal pain due to tumor torsion or rupture
      is also not uncommon
    explanation: >-
      Directly supports the bulky unilateral mass and its torsion/rupture
      complications as the dominant local manifestation.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis is common due to the rapid tumor growth and symptoms such
      as abdominal pain and distension, leading to favorable prognoses when
      combined with the high chemosensitivity of platinum-based regimens.
    explanation: >-
      Links rapid growth to early symptomatic presentation and favorable
      prognosis.
  downstream:
  - target: Peritoneal, Nodal, and Distant Dissemination
    description: >-
      Capsular rupture and continued growth allow spread beyond the ovary.
  - target: Exquisite Platinum Chemosensitivity
    description: >-
      The resulting tumor, however bulky, remains highly sensitive to
      platinum-based chemotherapy.

- name: Peritoneal, Nodal, and Distant Dissemination
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Spread beyond the ovary follows histology-specific routes: dysgerminoma has
    the highest risk of lymphatic (retroperitoneal nodal) metastasis, yolk sac
    tumor spreads peritoneally as hypervascular implants, and choriocarcinoma
    disseminates haematogenously to lung and liver. Capsular rupture and
    peritoneal spread are the imaging complications specifically sought at
    staging. Because the disease remains chemosensitive, even disseminated
    disease is usually curable, which is why radical cytoreduction is avoided.
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358

- name: Exquisite Platinum Chemosensitivity
  biological_scale: CELLULAR
  role: therapeutic_vulnerability
  description: >-
    Germ cell tumors are among the most chemosensitive solid tumors. Their
    embryonic, pluripotency-associated apoptotic wiring and limited DNA-damage
    tolerance mean cisplatin-induced DNA adducts efficiently trigger apoptosis,
    so bleomycin/etoposide/cisplatin achieves survival above 90% even in advanced
    disease. This is the pathophysiologic reason mutilating surgery is avoided and
    fertility-sparing surgery is oncologically safe. The corollary is that the
    dominant unmet need is the platinum-resistant minority, especially relapsed
    yolk sac tumor, in which nucleotide-excision repair, stemness, and
    detoxification programs restore survival.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:37954076
    reference_title: "Seminoma and dysgerminoma: evidence for alignment of clinical trials and de-escalation of systemic chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both histologies are exquisitely sensitive to platinum chemotherapy, and
      the combination of bleomycin, etoposide, and cisplatin (BEP) yields
      survival rates greater than 90%.
    explanation: >-
      Directly supports the exquisite platinum sensitivity and the resulting
      survival benefit modeled by this node.
  - reference: PMID:37954076
    reference_title: "Seminoma and dysgerminoma: evidence for alignment of clinical trials and de-escalation of systemic chemotherapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, BEP causes significant, lifelong toxicity (cardiovascular, renal,
      respiratory, and neurological) in these young patients with an expectation
      of cure.
    explanation: >-
      Documents the toxicity burden that motivates de-escalation and surveillance
      strategies in this highly curable disease.
  downstream:
  - target: Platinum-Resistant Relapse
    description: >-
      A minority of tumors escape platinum-induced apoptosis and relapse, which
      is the dominant unmet need in this otherwise curable disease.

- name: Platinum-Resistant Relapse
  biological_scale: ORGANISM
  role: adaptive_escape
  description: >-
    The clinically decisive minority are the tumors that survive platinum. Most
    relapses occur in the first few years and are detected by rising serum
    markers or imaging change; recurrence after primary chemotherapy carries a
    substantially worse prognosis, and relapsed yolk sac tumor in particular is
    the principal unmet need. Management shifts to high-dose chemotherapy with
    stem-cell rescue, selected secondary cytoreduction, or radiotherapy. A
    distinct, non-malignant mimic is growing teratoma syndrome, in which masses
    enlarge during chemotherapy with normalized markers because a benign mature
    teratoma component is proliferating; that entity is chemoresistant by nature
    and is treated by resection alone.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who experience a recurrence of malignant disease after primary
      chemotherapy for malignant ovarian germ cell tumors are associated with a
      poorer prognosis.
    explanation: >-
      Directly supports post-chemotherapy relapse as an adverse-prognosis state
      distinct from the chemosensitive majority.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growing teratoma syndrome is characterized by a rapid increase in tumor
      size during chemotherapy, despite normalized tumor markers, due to the
      proliferation of a benign mature teratoma component.
    explanation: >-
      Documents the chemoresistant benign mimic that must be distinguished from
      true platinum-resistant relapse.


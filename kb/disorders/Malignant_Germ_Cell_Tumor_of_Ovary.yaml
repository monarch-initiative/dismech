name: Malignant Germ Cell Tumor of Ovary
creation_date: "2026-07-31T23:45:00Z"
category: Complex
categories:
- Gynecologic Cancer
- Germ Cell Neoplasm
- Solid Tumor
synonyms:
- malignant ovarian germ cell tumor
- malignant ovarian germ cell neoplasm
- ovarian germ cell cancer
- MOGCT
description: >-
  Malignant germ cell tumor of ovary (MOGCT) is the umbrella category of ovarian
  malignancies arising from the primordial germ cell lineage rather than from
  ovarian surface epithelium. It comprises dysgerminoma (the ovarian counterpart
  of testicular seminoma and the most common malignant histology), yolk sac
  (endodermal sinus) tumor, immature teratoma, embryonal carcinoma,
  non-gestational choriocarcinoma, and mixed malignant germ cell tumor. MOGCTs
  represent only 2-5% of ovarian cancers but are the leading gynecologic
  malignancy of children, adolescents, and young adults. Transformed germ cells
  retain a pluripotency program (OCT3/4, NANOG, SALL4) and typically carry
  chromosome 12p gain rather than a high point-mutation burden; KIT alterations
  are enriched in dysgerminoma while KRAS/PIK3CA/AKT1 changes cluster in yolk sac
  tumor. Tumors are usually large, unilateral, and fast-growing, presenting with
  abdominal pain and a pelvic-abdominal mass, sometimes with torsion or rupture,
  and secreting lineage-specific serum markers (AFP, beta-hCG, LDH). A dysgenetic
  gonad containing Y-chromosome material (46,XY complete gonadal dysgenesis,
  Turner syndrome with Y mosaicism) is the strongest recognized predisposition,
  usually via gonadoblastoma. Because germ cell tumors are exquisitely
  platinum-sensitive, fertility-sparing surgery with risk-adapted surveillance or
  bleomycin/etoposide/cisplatin (BEP) chemotherapy cures most patients.

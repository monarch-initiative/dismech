mechanistic_hypotheses:
- hypothesis_group_id: leukocyte_driven_lesion_formation
  hypothesis_label: Leukocyte proliferation as a causal driver of the necrotizing lesions
  status: EMERGING
  description: >-
    The classical account treats the symmetric necrotizing brainstem lesions as the direct
    result of energy failure in metabolically demanding neurons. Work in the Ndufs4 knockout
    mouse argues that immune cells are not merely reacting to that injury but are causally
    required for it: depleting leukocytes with a CSF1R inhibitor suppressed lesion formation
    and substantially extended survival, and this also supplies the missing mechanism for why
    mTOR inhibition helps. It is recorded as emerging because it rests on one model system
    and has no human validation.

pathophysiology:

- name: Biallelic NDUFS4 Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The reported pathogenic alleles are frameshifts, nonsense variants and splice-altering
    variants, and what they have in common is more informative than what distinguishes them:
    almost all of them abolish full-length NDUFS4 protein. Where a truncated product would be
    predicted, the transcript itself is usually lost as well.

    Founder alleles exist. A homozygous c.393dupA frameshift accounts for Leigh disease in the
    Hutterite population, where the carrier frequency was estimated at 1 in 27 across more
    than 1,300 individuals, and founder alleles have also been described in North Africa. A
    non-consanguineous family reached homozygosity by complete paternal uniparental isodisomy
    of chromosome 5, which is worth knowing because a single-parent carrier test in that
    situation is falsely reassuring.
  genetic_context:
    gene:
      preferred_term: NDUFS4
      term:
        id: hgnc:7711
        label: NDUFS4
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic in every reported patient, most often homozygous through consanguinity or a
      founder haplotype. Loss of function is asserted rather than inferred from the variant
      class: the protein is absent on immunoblot in patient fibroblasts.
  downstream:
  - target: Absence of the NDUFS4 Accessory Subunit
    causal_link_type: DIRECT
    description: >-
      The alleles do not produce a variant protein to study; they produce no protein.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In human patients, most of the currently known pathogenic NDUFS4 mutations lead to
      absence of (full length) NDUFS4 protein
    explanation: >-
      The allelic mechanism, stated across the reported human mutation spectrum rather than
      for one variant.
  - reference: PMID:12944388

- name: Leukocyte-Mediated Neuroinflammation
  biological_scale: CELLULAR
  description: >-
    Proliferating leukocytes are not just present in the lesions; in the Ndufs4 knockout mouse
    they are causally required for them. Depleting leukocytes with a CSF1R inhibitor suppressed
    lesion formation, rescued seizures, respiratory centre function and hyperlactaemia, and
    substantially extended survival. The same work proposes this as the explanation for why
    mTOR inhibition works, which had been unexplained for nearly a decade.

    Whether this is true of human NDUFS4 disease is untested. It is recorded because a causal
    immune step changes what a therapy would target, and because it is the strongest single
    mechanistic result to come out of this model since the rapamycin finding.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: neuroinflammatory response
    modifier: INCREASED
    term:
      id: GO:0150076
      label: neuroinflammatory response
  downstream:
  - target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
    causal_link_type: DIRECT
    hypothesis_groups:
    - leukocyte_driven_lesion_formation
    description: >-
      Removing the leukocytes removes the lesions, which is a causal rather than an
      associative claim.
  evidence:
  - reference: PMID:35050903
    reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Depleting leukocytes with a colony-stimulating factor 1 receptor inhibitor disrupted
      disease progression, including suppression of CNS lesion formation and a substantial
      extension of survival.
    explanation: >-
      The intervention result the causal claim rests on.
  - reference: PMID:35050903

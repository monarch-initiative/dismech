    explanation: >-
      The authors' own framing of the claim's strength and scope.

- name: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
  biological_scale: TISSUE
  description: >-
    The neuropathological endpoint, and the reason most NDUFS4 patients are diagnosed as Leigh
    syndrome. Brainstem lesions were present in 14 of 22 reported NDUFS4 patients and basal
    ganglia lesions in 9; cortical atrophy was much less common, in 3. The lesion pattern
    together with the native-gel profile was proposed as the diagnostic signature of NDUFS4
    mutations before sequencing.

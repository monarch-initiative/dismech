    modifier: DECREASED
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
  downstream:
  - target: Reductive Stress and Bioenergetic Failure
    causal_link_type: DIRECT
    description: >-
      Electrons that cannot enter the chain leave NADH unoxidised and the proton-motive force
      short of what ATP synthesis needs.
  - target: Decreased Complex I Activity in Muscle and Fibroblasts
    causal_link_type: DIRECT
    description: >-
      The laboratory finding that establishes the diagnosis biochemically.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In general, the expression/activity of OXPHOS complexes other than CI is not affected by
      NDUFS4 mutations and/or absence of the NDUFS4 protein.
    explanation: >-
      The isolation of the defect to complex I, which is the entity-defining biochemical
      feature.
  - reference: PMID:11181577
    reference_title: A nonsense mutation in the NDUFS4 gene encoding the 18 kDa (AQDQ) subunit of complex I abolishes assembly and activity of the complex in a patient with Leigh-like syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fibroblast cultures from the patient exhibited severe reduction of the rotenone-sensitive
      NADH-->UQ oxidoreductase activity of complex I, which was insensitive to cAMP
      stimulation.
    explanation: >-
      Both halves: the activity loss, and its loss of cAMP responsiveness.

- name: Reductive Stress and Bioenergetic Failure
  biological_scale: CELLULAR
  description: >-
    Downstream of the enzyme defect, patient-derived cells show partial mitochondrial membrane
    depolarisation, raised reactive oxygen species and raised NAD(P)H, disturbed cytosolic and
    mitochondrial calcium and ATP handling, and altered mitochondrial morphology. Pyruvate that
    cannot be oxidised is converted to lactate, which is what raises lactate in plasma and
    cerebrospinal fluid.

    A CRISPR knockout of NDUFS4 in human induced pluripotent stem cells reproduces the redox
    half of this directly, with roughly half the complex I activity of isogenic controls and an
    elevated NADH/NAD+ ratio - useful because it is a human cell with a defined isogenic
    comparator rather than a patient line with an uncontrolled background.
  biological_processes:
  - preferred_term: reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  - preferred_term: ATP biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006754
      label: ATP biosynthetic process
  downstream:
  - target: Leukocyte-Mediated Neuroinflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - leukocyte_driven_lesion_formation
    description: >-
      How a cell-autonomous bioenergetic defect recruits or activates leukocytes has not been
      established; the immune involvement is demonstrated, the step connecting it to the
      enzyme defect is not.
  - target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The classical account: neurons with the highest energy demand fail first, which is why
      the lesions are where they are.
  - target: Lactic Acidosis
    causal_link_type: DIRECT
    description: >-
      Unoxidised pyruvate is converted to lactate and exported.
  - target: Secondary Hypertrophic Cardiomyopathy

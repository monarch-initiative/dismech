- name: Secondary Hypertrophic Cardiomyopathy
  biological_scale: TISSUE
  description: >-
    Hypertrophic cardiomyopathy occurs in a minority of NDUFS4 patients - 5 of 22 in the
    published compilation. Heart- and muscle-specific Ndufs4 knockout mice suggest it is a
    late, secondary consequence of the complex I defect rather than a primary cardiac lesion,
    which matters for surveillance: it is something to look for over time rather than at
    presentation.

    An iPSC-derived cardiomyocyte model with NDUFS4 deletion reproduces the cardiac phenotype
    and links it to a specific molecular step - a fall in NAD+/NADH that leaves the cardiac
    sodium channel NaV1.5 hyperacetylated, producing bradyarrhythmia.
  downstream:
  - target: Hypertrophic Cardiomyopathy
    causal_link_type: DIRECT
    description: >-
      The clinical finding, in the minority of patients who develop it.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      models suggests that the hypertrophic cardiomyopathy in NDUFS4-mutated patients (see
      above) might be a secondary consequence of the CI deficiency, which develops at a later
      age.
    explanation: >-
      The claim that the cardiac phenotype is secondary and late, drawn from tissue-specific
      mouse models.
  - reference: PMID:35872650
    reference_title: Metabolic rescue ameliorates mitochondrial encephalo-cardiomyopathy in murine and human iPSC models of Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Human-induced pluripotent stem cell-derived cardiomyocytes (iPS-CMs) with Ndufs4 deletion
      recapitulate LS cardiomyopathy.
    explanation: >-

name: Mitochondrial Complex I Deficiency, Nuclear Type 1
creation_date: "2026-09-01T21:15:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial complex I deficiency, nuclear type 1
  term:
    id: MONDO:0100224
    label: mitochondrial complex I deficiency, nuclear type 1
synonyms:
- MC1DN1
- NDUFS4 deficiency
- NDUFS4-related mitochondrial complex I deficiency
- mitochondrial complex I deficiency due to NDUFS4 mutation
- NADH-coenzyme Q reductase deficiency, nuclear type 1
description: >-
  The isolated complex I deficiency caused by biallelic loss-of-function variants in NDUFS4,
  which encodes an accessory subunit of respiratory chain complex I. NDUFS4 is not part of
  the catalytic core: it sits at the interface between the N and Q modules of the peripheral
  arm and is required for the last step of assembly, in which the NADH-oxidising N module is
  docked onto the rest of the enzyme and the assembly factor NDUFAF2 is released. Remove it
  and that step does not complete.

  The consequence in patient cells is unusually stereotyped for a mitochondrial disease.
  Almost every known pathogenic allele - frameshift, nonsense, splice - abolishes full-length
  NDUFS4 protein, and every NDUFS4 fibroblast line tested on a native gel shows the same
  thing: no fully assembled complex I at all, and in its place a catalytically inactive
  830 kDa subcomplex lacking the N module. Other respiratory chain complexes are untouched.
  The accessory subunit NDUFA12 disappears along with NDUFS4 and the assembly factor NDUFAF2
  stays bound where it should have been released, so the lesion is a stalled assembly
  intermediate rather than a partially working enzyme. That constancy is what makes the
  biochemical profile diagnostic, and it is why NDUFS4 mutations can be predicted from a blue
  native gel plus an MRI before the gene is sequenced.

  Clinically, most patients have Leigh syndrome, and this entry does not pretend otherwise.
  What distinguishes NDUFS4 within that spectrum is severity: a review comparing 22 NDUFS4
  patients against 198 patients with 24 other complex I gene defects concluded that
  NDUFS4-related disease is invariably early-onset and severe. In a compilation of 22
  patients from 18 families, mean onset was 4.5 months and mean age at death 10 months.
  Later reports have found the edges of that - a girl alive at seven with a milder course
  from an intronic allele reached through uniparental isodisomy, and an eight-year-old
  presenting with horizontal gaze palsy - so "invariably" should be read as the shape of the
  published series rather than as a rule.

  The Ndufs4 knockout mouse is one of the most heavily used models in mitochondrial medicine,
  and it is a genuinely good model here for a reason worth stating: human NDUFS4 disease is
  recessive and its alleles abolish the protein, so a whole-body deletion reproduces the
  human genotype in kind rather than approximating it. Almost everything currently proposed
  as a therapy for Leigh syndrome - mTOR inhibition, chronic hypoxia, NAD repletion,
  leukocyte depletion - was established in that animal, and none of it has been shown to work
  in a patient.
parents:
- Mitochondrial Complex I Deficiency
- Mitochondrial Disease


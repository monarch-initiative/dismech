- name: Absence of the NDUFS4 Accessory Subunit
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    NDUFS4 is one of about thirty accessory subunits of complex I, and its position is what
    makes it load-bearing. It sits at the interface between the N module, which oxidises NADH,
    and the Q module, which passes the electrons to ubiquinone, and it contacts subunits in
    both. The current reading of the experimental data is that NDUFS4 controls the attachment
    of the N module to the rest of the enzyme.

    Losing it takes a second subunit with it. In both Ndufs4-null mouse cells and NDUFS4-mutant
    patient cells the accessory subunit NDUFA12 is almost entirely absent, while the assembly
    factor NDUFAF2 - which NDUFA12 would normally displace - accumulates. The relationship is
    one-way: NDUFA12-mutant patient cells do not lose NDUFS4.
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  downstream:
  - target: Arrest of Complex I Assembly at the CI-830 Subcomplex
    causal_link_type: DIRECT
    description: >-
      Without NDUFS4 the N module is not docked and the assembly intermediate persists.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the current experimental data suggests that the NDUFS4 subunit is potentially
      PKA-phosphorylated and plays a key role in CI assembly and/or stabilization (likely
      involving N-to-Q-module attachment), thereby exerting control over CI levels and/or
      activity.
    explanation: >-
      The function of the subunit, stated as the review's synthesis across structural and
      biochemical studies rather than as a single experiment - which is why this item is
      graded OTHER.
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Within ovine CI, the NDUFS4 subunit is located at the interface between the N- and
      Q-module
    explanation: >-
      The structural position that the assembly role follows from, determined in the ovine
      enzyme.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Absence of NDUFS4 induced near complete absence of the NDUFA12 accessory subunit, a 50%
      reduction in other CI subunit levels, and an increase in specific CI assembly factors.
    explanation: >-
      The knock-on loss of NDUFA12 and the accumulation of assembly factors, measured across
      Ndufs4-null mouse tissues - which is why this item is MODEL_ORGANISM while the next one,
      quoting the sentence about patient cells, is IN_VITRO.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Regarding NDUFS4, NDUFA12 and NDUFAF2, identical results were obtained in Ndufs4-/-
      mouse embryonic fibroblasts (MEFs) and NDUFS4-mutated LS patient cells.
    explanation: >-
      The step that makes the mouse biochemistry transferable: the same subunit losses were
      measured in human patient cells.

- name: Arrest of Complex I Assembly at the CI-830 Subcomplex
  biological_scale: MOLECULAR
  description: >-
    On a blue native gel, NDUFS4-mutant patient fibroblasts show no fully assembled complex I
    holoenzyme at all. What is present instead is a catalytically inactive subcomplex of about
    830 kDa, carrying NDUFAF2 and lacking the N module. This profile is constant across every
    NDUFS4 allele that has been tested, which is unusual enough that it was proposed as a
    screening method: the gel plus the MRI identifies the gene.

    One caveat belongs with the finding. In intact tissue, substantial rotenone-sensitive
    quinone-reductase activity survives, and Ndufs4-null mouse fibroblasts contain active
    complex I in situ - so the complete absence of holoenzyme on the gel partly reflects the
    complex falling apart during solubilisation. The enzyme in a living cell is destabilised,
    not necessarily wholly absent.
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  downstream:
  - target: Isolated Complex I Deficiency
    causal_link_type: DIRECT
    description: >-
      An enzyme that never completes assembly cannot oxidise NADH.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NDUFS4-mutated patient fibroblasts exhibit complete absence of the fully assembled CI
      holocomplex.
    explanation: >-
      The native-gel result in human patient cells.
  - reference: PMID:22326555
    reference_title: A constant and similar assembly defect of mitochondrial respiratory chain complex I allows rapid identification of NDUFS4 mutations in patients with Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All NDUFS4 mutations that have been tested with BN-PAGE result in a constant and similar
      abnormal assembly profile with a complete loss of the fully assembled complex I usually
      due to a truncated protein and the loss of its canonical cAMP dependent protein kinase
      phosphorylation consensus site.
    explanation: >-
      The constancy across alleles, from a systematic study plus a literature meta-analysis.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ndufs4-/- MEFs contained active CI in situ but blue-native-PAGE highlighted that NDUFAF2
      attached to an inactive CI subcomplex (CI-830) and inactive assemblies of higher MW.
    explanation: >-
      The caveat in the node description: active enzyme in situ alongside no holoenzyme on the
      gel, which is why the arrest is described as destabilisation rather than total absence.
  - reference: PMID:11181577
    reference_title: A nonsense mutation in the NDUFS4 gene encoding the 18 kDa (AQDQ) subunit of complex I abolishes assembly and activity of the complex in a patient with Leigh-like syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Two-dimensional electrophoresis showed the absence of detectable normally assembled
      complex I in the inner mitochondrial membrane.
    explanation: >-
      The original demonstration, in the first NDUFS4 nonsense patient.

- name: Isolated Complex I Deficiency
  biological_scale: MOLECULAR
  description: >-
    The enzymatic consequence, and it is isolated in the strict sense: the expression and
    activity of the other oxidative phosphorylation complexes are not affected. That is what
    puts this disease in the complex I deficiency nomenclature rather than in the combined
    respiratory-chain disorders, and it is measurable in the tissues that are biopsied -
    muscle in 18 of 22 reported patients, fibroblasts in 12.

    In a patient fibroblast line, complex I activity is severely reduced and, distinctively,
    insensitive to cAMP stimulation - the NDUFS4 subunit carries the consensus site through
    which protein kinase A is thought to act on the complex.
  molecular_functions:
  - preferred_term: NADH dehydrogenase (ubiquinone) activity
    modifier: DECREASED
    term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
  biological_processes:

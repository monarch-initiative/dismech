progression:

- phase: Infantile onset
  age_range: first year of life
  notes: >-
    Symptoms begin in infancy. Across the 22-patient, 18-family NDUFS4 compilation the mean age
    at disease onset was 4.5 months, and hypotonia was present in every patient.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      analysis of a cohort of 22 patients (18 families) yielded an average age of disease onset
      of 4.5
    explanation: >-
      The mean age at onset. The quotation is truncated at the numeral because the source
      continues with a non-ASCII plus-minus symbol that cannot be reproduced reliably in YAML.

- phase: Rapidly progressive infantile-lethal course
  age_range: first three years of life
  notes: >-
    Death in infancy or early childhood is the usual outcome. In the same compilation, 14 of the
    22 patients had mortality data and the mean age at death was 10 months; an independent series
    of 14 NDUFS4 patients reports a range of 3.6 to 27 months. A 2016 review that compared 22
    NDUFS4 patients against 198 patients with 24 other complex I gene defects concluded the
    NDUFS4 phenotype is invariably early-onset, severe and rapidly fatal.

    Note that the HPO term for this outcome, HP:0001522 (Death in infancy), sits in the
    Mortality/Aging branch rather than under Phenotypic abnormality, so it is curated here as
    natural history rather than as a phenotype - following the same decision recorded in
    `Cardiomyopathy-Hypotonia-Lactic_Acidosis_Syndrome`.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of 14 patients with pathogenic NDUFS4 mutations demonstrated that the age of
      death varied between 3.6 and 27 months.
    explanation: >-
      The observed range of age at death.
  - reference: PMID:27079373
    reference_title: "Ndufs4 related Leigh syndrome: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We concluded that NDUFS4-related Leigh syndrome is invariably linked to an early onset
      severe phenotype that results in early death.
    explanation: >-
      The severity claim from a review that compared 22 NDUFS4 patients against 198 patients
      with other complex I gene defects. It is quoted as the authors' conclusion; the longer
      survivors reported since are recorded in the next phase, so "invariably" describes the
      series available in 2016.

- phase: Longer survival in a minority
  age_range: beyond three years
  notes: >-
    Patients outside the infantile-lethal pattern have been reported since the 2016 review. One
    girl with an intronic splice variant reached through paternal uniparental isodisomy was alive
    at seven with a course her authors describe as less severe than most NDUFS4 patients, and an
    eight-year-old presented with bilateral horizontal gaze palsy. Eight of the 22 patients in
    the main compilation had no mortality data at all. The prognostic statement above should
    therefore be read as the shape of the published series rather than as a rule, and the
    determinants of longer survival are recorded as an open knowledge gap.
  evidence:
  - reference: PMID:33093004
    reference_title: Uniparental isodisomy as a cause of mitochondrial complex I respiratory chain disorder due to a novel splicing NDUFS4 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a one-year-old girl (being alive at the age of 7) belonging to a non-consanguineous
      family presenting with encephalopathy, psychomotor delay, lactic acidosis and a single CI
      deficiency, a less severe phenotype than those previously reported in most NDUFS4
      patients
    explanation: >-
      A documented survivor to age seven, explicitly contrasted by the authors with the usual
      NDUFS4 course.
  - reference: PMID:34484776
    reference_title: "Bilateral horizontal gaze palsy in an 8-year-old girl: A rare case with NDUFS4 gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Upon genetic investigation, the patient was found to carry a novel homozygous mutation in
      the NDUFS4 gene, thus adding to the heterogeneity of Leigh syndrome clinical presentation.
    explanation: >-
      A second genotyped patient surviving well beyond infancy, presenting atypically.

genetic:

- name: NDUFS4
  gene_term:
    preferred_term: NDUFS4
    term:
      id: hgnc:7711
      label: NDUFS4
  relationship_type: CAUSATIVE
  association: >-
    Biallelic loss-of-function NDUFS4 variants cause isolated mitochondrial complex I
    deficiency by preventing the final assembly step of the enzyme.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    The reported alleles are frameshift, nonsense and splice-altering, and nearly all abolish
    full-length protein - which is why, unusually for a mitochondrial gene, the biochemical
    consequence is the same whichever allele a patient carries. That homogeneity is the
    entity's most useful diagnostic property.
  evidence:
  - reference: PMID:22326555
    reference_title: A constant and similar assembly defect of mitochondrial respiratory chain complex I allows rapid identification of NDUFS4 mutations in patients with Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe five new NDUFS4 patients with a similar and constant abnormal BN-PAGE profile
      and present a meta-analysis of the literature.
    explanation: >-
      Five further patients plus a systematic review, which is the evidence that the constancy
      claim rests on.
  - reference: PMID:11181577
    reference_title: A nonsense mutation in the NDUFS4 gene encoding the 18 kDa (AQDQ) subunit of complex I abolishes assembly and activity of the complex in a patient with Leigh-like syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings show that the expression of the NDUFS4 gene is essential for the assembly
      of a functional complex I.
    explanation: >-
      The gene-function conclusion from the founding patient study.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic in every reported patient. Most are homozygous, through consanguinity or a
    founder allele, and heterozygous relatives are unaffected. One reported patient reached
    homozygosity through complete paternal uniparental isodisomy of chromosome 5 rather than
    through inheritance from both parents, so a normal maternal carrier test does not exclude
    the diagnosis.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations are inherited in an autosomal recessive manner and thus present in every
      cell.
    explanation: >-
      Inheritance mode, and the reason a whole-body mouse knockout matches the human genotype
      in kind.
  - reference: PMID:33093004
    reference_title: Uniparental isodisomy as a cause of mitochondrial complex I respiratory chain disorder due to a novel splicing NDUFS4 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Uniparental disomy (UPD) is an underestimated cause of autosomal recessive disorders.
    explanation: >-
      The exception to biparental transmission, stated as the report's own point.

animal_models:

- name: Whole-body Ndufs4 knockout mouse
  species: Mouse
  genotype: Ndufs4 exon 2 deletion, homozygous whole-body knockout
  publication: PMID:18396137
  description: >-
    The reference model for this disease and one of the most heavily used models in
    mitochondrial medicine. It is unusually well matched to the human condition for a reason
    that is explicit in the literature: human NDUFS4 disease is autosomal recessive and its
    alleles abolish full-length protein in every cell, so a whole-body deletion reproduces the
    human genotype in kind rather than approximating it. The animal was made by deleting exon
    2, producing a frameshift that prevents formation of NDUFS4 protein - the same lesion class
    as the human alleles.

    Mice appear healthy for about five weeks, then develop ataxia, lethargy, blindness and
    raised lactate, and die at around seven weeks. The neuropathology is bilateral spongiform
    lesions in the vestibular nuclei with degeneration in the olfactory bulb, cerebellum and
    other structures.
  modeled_mechanisms:
  - target: Arrest of Complex I Assembly at the CI-830 Subcomplex
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The same assembly lesion as human patient cells: no intact complex I, loss of NDUFA12
      alongside NDUFS4, and retention of NDUFAF2 on an inactive subcomplex.
    limitations: >-
      Fidelity is HIGH for this node specifically because the comparison was made directly
      against patient cells rather than assumed. The residual caveat is the same one that
      applies to the human material: complex I is partly active in situ and dissociates during
      solubilisation, so the gel exaggerates how completely the enzyme is absent in a living
      cell.
    readouts:
    - name: NDUFA12 protein level
      target: Arrest of Complex I Assembly at the CI-830 Subcomplex
      direction: DECREASED
      interpretation: >-
        Near-complete loss of a second accessory subunit as a consequence of losing NDUFS4,
        measured in the same way in mouse and human cells.
      evidence:
      - reference: PMID:32335026
        reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Absence of NDUFS4 induced near complete absence of the NDUFA12 accessory subunit
        explanation: >-
          The proteomic measurement behind this readout.
    - name: Assembled complex I on blue native PAGE
      target: Arrest of Complex I Assembly at the CI-830 Subcomplex
      direction: DECREASED
      interpretation: >-
        Intact complex I is reduced and an inactive CI-830 subcomplex appears in its place.
      evidence:
      - reference: PMID:18396137
        reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Native gel electrophoresis revealed reduced levels of intact CI.
        explanation: >-
          The native-gel measurement behind this readout.
    evidence:
    - reference: PMID:34849584
      reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Therefore, from a genetic point of view, whole-body Ndufs4 deletion is a valid strategy
        to create mouse models of MC1ND1/Leigh syndrome for pathomechanistic analysis.
      explanation: >-
        The explicit argument for treating this model as informative for the human disease. The
        source abbreviates the disease as "MC1ND1" here; the quotation reproduces that.
  - target: Isolated Complex I Deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Complex I activity is undetectable in submitochondrial particles while intact tissue
      retains about half of control complex I-driven respiration.
    limitations: >-
      The gap between the two measurements is itself the limitation: an assay on disrupted
      mitochondria reads zero where the living tissue is running at half capacity, so the
      severity of the enzyme defect depends on how it is measured. Tissue distribution also
      differs from the human pattern, with complex I subunit levels falling most in brain and
      diaphragm rather than uniformly.
    readouts:
    - name: Complex I activity in submitochondrial particles
      target: Isolated Complex I Deficiency
      direction: DECREASED
      interpretation: >-
        Undetectable by spectrophotometric assay after disruption of the mitochondria.
      evidence:
      - reference: PMID:18396137
        reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          CI activity in submitochondrial particles from KO mice was undetectable by
          spectrophotometric assays.
        explanation: >-
          The enzyme assay behind this readout.
    - name: Complex I-driven oxygen consumption in intact tissue
      target: Isolated Complex I Deficiency
      direction: DECREASED
      interpretation: >-
        About half of control, in contrast to the undetectable activity measured after
        disruption. Recorded separately because the two readouts disagree and the difference is
        mechanistically informative.
      evidence:
      - reference: PMID:18396137
        reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, CI-driven oxygen consumption by intact tissue was about half that of
          controls.
        explanation: >-
          The respirometry measurement behind this readout.
    evidence:
    - reference: PMID:18396137
      reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data suggest that CI fails to assemble properly or is unstable without NDUFS4.
      explanation: >-
        The authors' conclusion, which is the same mechanism established in patient cells.
  - target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      A progressive fatal encephalomyopathy with bilateral spongiform brainstem lesions,
      matching the human disease in kind.
    limitations: >-
      The anatomical distribution is not the human one. The mouse lesions centre on the
      vestibular nuclei, olfactory bulb and cerebellum, whereas the human disease is
      characterised by brainstem and basal ganglia involvement, with basal ganglia lesions in 9
      of 22 patients. The mouse is also normal for its first five weeks and then declines over
      two, a compressed course quite unlike an infant who presents at four months and dies at
      ten. Seizures dominate the terminal phase of some knockout lines while occurring in only
      4 of 22 published patients.
    readouts:
    - name: Brain lesion histology
      target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
      direction: ALTERED
      interpretation: >-
        Bilateral spongiform lesions appear in the vestibular nuclei with degeneration
        elsewhere - the same lesion type as the human disease in a different distribution.
      evidence:
      - reference: PMID:34849584
        reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          developed bilateral spongiform lesions in the vestibular nuclei, and neurodegeneration
          in various other brain regions including the olfactory bulb, optic chiasm, optic
          tract, superior colliculus, interpeduncular nucleus, lateral lemniscus, trapezoid
          body, cochlear nuclei, fastigial nucleus, inferior olivary complex, nodulus (X) and
          the uvula (IX) granular and molecular layer.
        explanation: >-
          The lesion distribution behind this readout, which is what the fidelity caveat is
          about.
    - name: Survival
      target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
      direction: DECREASED
      interpretation: >-
        Death at about seven weeks after roughly five weeks of apparent health.
      evidence:
      - reference: PMID:18396137
        reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Although small, Ndufs4 knockout (KO) mice appeared healthy until approximately 5 weeks
          of age, when ataxic signs began, progressing to death at approximately 7 weeks.
        explanation: >-
          The survival and onset timing behind this readout.
    evidence:
    - reference: PMID:18396137
      reference_title: Mice with mitochondrial complex I deficiency develop a fatal encephalomyopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        KO mice manifested encephalomyopathy including a retarded growth rate, lethargy, loss of
        motor skill, blindness, and elevated serum lactate.
      explanation: >-
        The clinical syndrome in the model, which overlaps the human one without matching it.
  - target: Leukocyte-Mediated Neuroinflammation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      The system in which the causal role of leukocytes was demonstrated, by depletion rather
      than by observation.
    limitations: >-
      Fidelity is UNKNOWN rather than low or moderate because there is nothing human to compare
      against. No study has shown leukocyte involvement in the lesions of an NDUFS4 patient, so
      it cannot be said whether the model reproduces a human process or exhibits a
      mouse-specific one. The finding is strong within the model and unvalidated outside it.
    readouts:
    - name: CNS lesion formation after CSF1R inhibition
      target: Leukocyte-Mediated Neuroinflammation
      direction: ABOLISHED
      interpretation: >-
        Lesion formation is suppressed when leukocytes are depleted, which is the intervention
        result that makes the immune involvement causal rather than reactive.
      evidence:
      - reference: PMID:35050903
        reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Depleting leukocytes with a colony-stimulating factor 1 receptor inhibitor disrupted
          disease progression, including suppression of CNS lesion formation and a substantial
          extension of survival.
        explanation: >-
          The depletion experiment behind this readout.
    - name: Seizures, respiratory centre function and hyperlactaemia after leukocyte depletion
      target: Leukocyte-Mediated Neuroinflammation
      direction: RESTORED
      interpretation: >-
        Multiple downstream disease features are rescued by the same intervention, which argues
        the immune step sits upstream of them rather than beside them.
      evidence:
      - reference: PMID:35050903
        reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Leukocyte depletion rescued diverse symptoms, including seizures, respiratory center
          function, hyperlactemia, and neurologic sequelae.
        explanation: >-
          The rescue measurements behind this readout.
    evidence:
    - reference: PMID:35050903
      reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report that leukocyte proliferation is causally involved in the pathogenesis of
        LS.
      explanation: >-
        The causal claim this model is being used to support.

experimental_models:

- name: NDUFS4 knockout human iPSC line
  experimental_model_type: OTHER
  description: >-
    CRISPR-Cas9 knockout of NDUFS4 in human induced pluripotent stem cells, with isogenic
    controls. Its value is the comparator: patient fibroblast lines differ from controls in
    their whole genetic background, whereas an isogenic knockout differs at one locus. The
    limitation the authors state themselves is that undifferentiated iPSCs cannot reproduce the
    cellular dynamics of the disease, so this is a redox and metabolic platform rather than a
    model of the encephalopathy.

    `experimental_model_type` is OTHER rather than IPSC_DERIVED_MODEL on purpose. That value is
    defined as a *differentiated* model derived from induced pluripotent stem cells, and this
    one is deliberately undifferentiated, which is exactly what the authors' own caveat is
    about. CELL_LINE does not fit either, being defined for immortalized lines. OTHER is the
    accurate choice here rather than a placeholder.
  modeled_mechanisms:
  - target: Reductive Stress and Bioenergetic Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Elevated NADH/NAD+ with about half the complex I activity of isogenic controls.
    limitations: >-
      Undifferentiated pluripotent cells are heavily glycolytic and are not the cell type the
      disease destroys; the metabolic phenotype is therefore real but is not neuronal. It is a
      screening platform, and the authors present it as one.
    readouts:
    - name: NADH/NAD+ ratio
      target: Reductive Stress and Bioenergetic Failure
      direction: INCREASED
      interpretation: >-
        Reductive stress in a human cell carrying only the NDUFS4 lesion.
      evidence:
      - reference: PMID:39547516
        reference_title: "CRISPR-Cas9 mediated knockout of NDUFS4 in human iPSCs: A model for mitochondrial complex I deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          predominantly associated with an elevated NADH/NAD+ ratio
        explanation: >-
          The metabolomic measurement behind this readout.
    evidence:
    - reference: PMID:39547516
      reference_title: "CRISPR-Cas9 mediated knockout of NDUFS4 in human iPSCs: A model for mitochondrial complex I deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human iPSCs were edited using CRISPR-Cas9 to target the NDUFS4 gene, generating isogenic
        NDUFS4 knockout (KO) cell lines.
      explanation: >-
        Establishes the model and its isogenic design.

- name: NDUFS4-deleted iPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cell-derived cardiomyocytes carrying an Ndufs4 deletion. This
    one is IPSC_DERIVED_MODEL rather than OTHER because the cells are differentiated into the
    affected cell type, which is the distinction the enum draws.

    It is the human counterpart of the tissue-specific mouse work on the cardiac phenotype, and
    it does something the mouse cannot: it puts the cardiomyopathy in a human cardiomyocyte and
    traces it to a specific molecular step, a fall in NAD+/NADH leaving the cardiac sodium
    channel NaV1.5 hyperacetylated. The same paper reports NDUFS4-deleted iPSC-derived neurons.
  modeled_mechanisms:
  - target: Secondary Hypertrophic Cardiomyopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cardiac phenotype in human cardiomyocytes and links it to NAD+/NADH-dependent
      hyperacetylation of NaV1.5.
    limitations: >-
      iPSC-derived cardiomyocytes are immature relative to adult myocardium, and the electrical
      phenotype the model explains is bradyarrhythmia and diastolic dysfunction, measured in the
      mouse, rather than the hypertrophy that is actually recorded in patients. So the model is
      informative about the cardiac consequences of complex I deficiency without being a model of
      the specific finding this node is named for. Hypertrophic cardiomyopathy occurs in 5 of 22
      reported patients, and no genotype-matched human cardiac tissue exists for comparison.
    readouts:
    - name: NaV1.5 acetylation
      target: Secondary Hypertrophic Cardiomyopathy
      direction: INCREASED
      interpretation: >-
        Hyperacetylation of the cardiac sodium channel, the proposed molecular link between the
        redox defect and the electrical phenotype.
      evidence:
      - reference: PMID:35872650
        reference_title: Metabolic rescue ameliorates mitochondrial encephalo-cardiomyopathy in murine and human iPSC models of Leigh syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          hyperacetylation of the cardiac sodium channel NaV 1.5, particularly at K1479 site
        explanation: >-
          The modification and its site, behind this readout. Graded MODEL_ORGANISM rather than
          IN_VITRO even though the readout sits on a cell model, because the sentence it is
          quoted from reports the mouse arm of the study - the bradyarrhythmia the acetylation
          is linked to was measured in Ndufs4-null mice. evidence_source classifies the cited
          finding, not the block it is filed under.
    evidence:
    - reference: PMID:35872650
      reference_title: Metabolic rescue ameliorates mitochondrial encephalo-cardiomyopathy in murine and human iPSC models of Leigh syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Human-induced pluripotent stem cell-derived cardiomyocytes (iPS-CMs) with Ndufs4 deletion
        recapitulate LS cardiomyopathy.
      explanation: >-
        Supports treating this model as informative for the cardiac node.

diagnosis:

- name: Blue native PAGE assembly profile of patient fibroblasts
  description: >-
    The discriminating biochemical test in this gene, and unusually informative because the
    profile is constant. Every NDUFS4 allele tested gives complete loss of assembled complex I
    with an inactive 830 kDa subcomplex, and the profile combined with the MRI appearance was
    proposed as sufficient to direct sequencing to NDUFS4. Most other complex I genes do not
    give a signature this specific.
  evidence:
  - reference: PMID:22326555
    reference_title: A constant and similar assembly defect of mitochondrial respiratory chain complex I allows rapid identification of NDUFS4 mutations in patients with Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we report our systematic approach with blue native PAGE (BN-PAGE) to study
      mitochondrial respiratory chain assembly in skin fibroblasts from patients with Leigh
      syndrome and CI deficiency.
    explanation: >-
      The test and the population it is applied to.
  - reference: PMID:34069703
    reference_title: Accessory Subunits of the Matrix Arm of Mitochondrial Complex I with a Focus on Subunit NDUFS4 and Its Role in Complex I Function and Assembly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Blue native (BN) PAGE consistently revealed abnormal assembly profiles in skin fibroblasts
      from affected patients and was proposed as a reliable and specific screening method
    explanation: >-
      The claim that the profile functions as a screen, not merely as a confirmatory finding.
      Graded OTHER because it is a review's summary of the primary study rather than a new
      measurement.

- name: Molecular testing of NDUFS4
  description: >-
    Sequencing establishes the diagnosis. NDUFS4 is on mitochondrial disease panels and is
    covered by exome and genome sequencing; in a child with isolated complex I deficiency, the
    characteristic native-gel profile and a Leigh MRI pattern, single-gene testing is
    reasonable. Ancestry changes the pretest probability substantially - the c.393dupA allele
    has a carrier frequency of 1 in 27 in the Hutterite population.

    Two routes to a biallelic genotype are worth anticipating. Array comparative genomic
    hybridisation has identified an NDUFS4 deletion that sequencing alone would have called
    hemizygous, and one patient's homozygosity arose from paternal uniparental isodisomy of
    chromosome 5.
  evidence:
  - reference: PMID:27671926
    reference_title: A novel NDUFS4 frameshift mutation causes Leigh disease in the Hutterite population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The carrier frequency of this mutation was estimated in >1,300 Hutterite individuals to be
      1 in 27.
    explanation: >-
      The population-specific pretest probability that changes the testing strategy.
  - reference: PMID:33093004
    reference_title: Uniparental isodisomy as a cause of mitochondrial complex I respiratory chain disorder due to a novel splicing NDUFS4 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reinforce that UPD, although rare, should be considered as a possible cause of
      mitochondrial diseases in order to provide accurate genetic counselling.
    explanation: >-
      The counselling consequence of the isodisomy route.

treatments:

- name: Supportive and Multidisciplinary Care
  therapeutic_modality: BEHAVIORAL
  description: >-
    There is no disease-modifying therapy. Management is nutritional support for the feeding
    difficulties present in about a third of patients, seizure control, respiratory monitoring
    given the frequency of central apnoea, cardiac surveillance for the hypertrophic
    cardiomyopathy that develops in a minority, and rehabilitation. Mitochondrial vitamin and
    cofactor cocktails are widely used and have not demonstrated efficacy in randomised trials
    in this or any related condition.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current mainstay of managing mitochondrial disease involves the use of vitamin
      co-factors
    explanation: >-
      What is actually given. The snippet is truncated before a non-ASCII character in the
      source list of cofactors.
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      None of these approaches have demonstrated efficacy in randomized controlled clinical
      trials.
    explanation: >-
      The evidence status of the supplements used, stated plainly by the source.

- name: mTOR Inhibition with Rapamycin
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The landmark preclinical result in this disease and still the most-replicated one. Untreated
    Ndufs4 knockout mice die at a median of 50 days; on daily rapamycin, median survival was 114
    days in males and 111 in females, and the longest-lived animal reached 269. Treatment also
    delayed the onset of neurological signs, reduced neuroinflammation and prevented the brain
    lesions altogether in treated animals examined at 100 and 268 days.

    It has not been tested in a controlled trial in NDUFS4 patients. The mechanism was
    unexplained for years and the leukocyte work now offers one - that rapamycin's benefit is
    largely immunosuppressive.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  target_mechanisms:
  - target: Leukocyte-Mediated Neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      On the emerging account, mTOR inhibition acts by suppressing the leukocyte proliferation
      that drives lesion formation, rather than by correcting the bioenergetic defect.
    evidence:
    - reference: PMID:24231806
      reference_title: mTOR inhibition alleviates mitochondrial disease in a mouse model of Leigh syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        delays onset of neurological symptoms, reduces neuroinflammation, and prevents brain
        lesions.
      explanation: >-
        The effect on neuroinflammation and lesions specifically, in the Ndufs4 model.
    - reference: PMID:35050903
      reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These data reveal a mechanistic explanation for the beneficial effects of mTOR
        inhibition.
      explanation: >-
        The proposed mechanism linking this treatment to the leukocyte node rather than to the
        enzyme defect.
  evidence:
  - reference: PMID:24231806
    reference_title: mTOR inhibition alleviates mitochondrial disease in a mouse model of Leigh syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that rapamycin, a specific inhibitor of the mechanistic target of rapamycin
      (mTOR) signaling pathway, robustly enhances survival and attenuates disease progression in
      a mouse model of Leigh syndrome.
    explanation: >-
      The survival result. Model evidence only, which is why the description says preclinical.
  - reference: PMID:24231806
    reference_title: mTOR inhibition alleviates mitochondrial disease in a mouse model of Leigh syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ndufs4−/− mice show a progressive neurodegenerative phenotype characterized by lethargy,
      ataxia, weight loss, and ultimately death at a median age of 50 days
    explanation: >-
      The untreated baseline the treated survival is measured against.
  - reference: PMID:24231806
    reference_title: mTOR inhibition alleviates mitochondrial disease in a mouse model of Leigh syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Median survival of males and females was 114 and 111 days, respectively
    explanation: >-
      The treated survival on the daily-dosing schedule, so the size of the effect is quoted
      rather than described.

- name: Chronic Normobaric Hypoxia
  therapeutic_modality: OTHER
  description: >-
    Breathing 11% oxygen continuously improves survival, body weight, temperature, behaviour
    and neuropathology in Ndufs4 knockout mice, and applied late can reverse established brain
    lesions. The dose-response is unusually strict and is the reason this has not become a
    clinical intervention: 17% oxygen for three weeks was ineffective, and intermittent hypoxia
    does not work either. A therapy that requires continuous severe hypoxia is difficult to
    deliver safely to an infant with brainstem respiratory failure.
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
    treatment_effect: MODULATES
    description: >-
      Reducing tissue oxygen prevents and can reverse the lesions, without correcting the
      complex I defect that causes them.
    evidence:
    - reference: PMID:26917594
      reference_title: Hypoxia as a therapy for mitochondrial disease.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Chronic hypoxia leads to a marked improvement in survival, body weight, body
        temperature, behavior, neuropathology, and disease biomarkers in a genetic mouse model
        of Leigh syndrome
      explanation: >-
        The efficacy result in the Ndufs4 model.
  evidence:
  - reference: PMID:34849584
    reference_title: "Ndufs4 knockout mouse models of Leigh syndrome: pathophysiology and intervention."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, temporary or milder hypoxia conditions (17% O2 for 3 weeks) were ineffective.
    explanation: >-
      The negative result that defines how narrow the effective window is, and the practical
      obstacle to translation.
  - reference: PMID:26917594
    reference_title: Hypoxia as a therapy for mitochondrial disease.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Further preclinical studies are required to assess whether hypoxic exposure can be
      developed into a safe and effective treatment for human diseases associated with
      mitochondrial dysfunction.
    explanation: >-
      The authors' own statement of how far this result reaches.

- name: NAD Repletion with Nicotinamide Riboside
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Aimed at the reductive stress rather than at the enzyme. Nicotinamide riboside raised
    intracellular NAD+/NADH, reversed protein hyperacetylation, improved the cardiomyopathic
    phenotype and reduced neuronal apoptosis and microglial activation in Ndufs4-null mice, and
    the same effects were seen in human iPSC-derived neurons with NDUFS4 deletion. Preclinical;
    no trial in NDUFS4 patients.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nicotinamide riboside
      term:
        id: CHEBI:15927
        label: N-ribosylnicotinamide
  target_mechanisms:
  - target: Reductive Stress and Bioenergetic Failure
    treatment_effect: RESTORES
    description: >-
      Raising the NAD+/NADH ratio addresses the redox consequence of the block, leaving the
      assembly defect in place.
    evidence:
    - reference: PMID:35872650
      reference_title: Metabolic rescue ameliorates mitochondrial encephalo-cardiomyopathy in murine and human iPSC models of Leigh syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Metabolic rescue by nicotinamide riboside (NR) supplementation increased intracellular
        NAD+ / NADH, restored metabolic derangement, reversed protein hyperacetylation through
        NAD+ -dependent Sirtuin deacetylase, and ameliorated cardiomyopathic phenotypes
      explanation: >-
        The mechanism and the phenotypic effect together.
  evidence:
  - reference: PMID:35872650
    reference_title: Metabolic rescue ameliorates mitochondrial encephalo-cardiomyopathy in murine and human iPSC models of Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      NR also attenuated neuronal apoptosis and microglial activation in the LS brain and human
      iPS-derived neurons with Ndufs4 deletion.
    explanation: >-
      The effect in a human cell system, which is the closest this treatment gets to human
      evidence. Graded IN_VITRO for the iPSC-derived neuron arm.

- name: Leukocyte Depletion by CSF1R Inhibition
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    The most recent preclinical strategy and the one that follows from the emerging
    leukocyte-driven account of lesion formation. In Ndufs4 knockout mice a CSF1R inhibitor
    suppressed lesion formation, rescued seizures, respiratory function and hyperlactaemia and
    substantially extended survival.

    It has not been tried in patients, and the step it targets has not been demonstrated in
    human NDUFS4 tissue - so this is a treatment aimed at a mechanism that is itself recorded
    here as emerging.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Leukocyte-Mediated Neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Depleting the proliferating leukocyte population removes the step the lesions are argued
      to require.
    evidence:
    - reference: PMID:35050903
      reference_title: Leukocytes mediate disease pathogenesis in the Ndufs4(KO) mouse model of Leigh syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that directly targeting leukocyte proliferation via colony-stimulating factor 1
        receptor (CSF1R) inhibition dramatically attenuates disease.
      explanation: >-
        The intervention and its effect in the model.

differential_diagnoses:

- name: Leigh syndrome from other nuclear or mitochondrial genes
  description: >-
    The clinical picture of MC1DN1 is Leigh syndrome, which more than thirty-five genes across
    both genomes are known to produce, so the differential is the rest of that list. Two things
    narrow it. Complex I deficiency in isolation, with other respiratory chain complexes normal,
    excludes the complex IV and pyruvate dehydrogenase causes. And within the complex I genes,
    the constant native-gel profile plus the MRI pattern was proposed as specific enough to
    point at NDUFS4 before sequencing - which is not true of most of its siblings.
  evidence:
  - reference: PMID:27671926
    reference_title: A novel NDUFS4 frameshift mutation causes Leigh disease in the Hutterite population.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in more than 35 genes affecting the mitochondrial respiratory chain encoded from
      both the nuclear and mitochondrial genomes have been associated with Leigh disease.
    explanation: >-
      The size of the genetic differential. Counts above this appear in the review literature;
      this is the figure that can be quoted from a cached source.
  - reference: PMID:22326555
    reference_title: A constant and similar assembly defect of mitochondrial respiratory chain complex I allows rapid identification of NDUFS4 mutations in patients with Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also report the association of abnormal brain MRI images with this characteristic
      BN-PAGE profile as the hallmarks of NDUFS4 mutations
    explanation: >-
      The combination that separates NDUFS4 from the other complex I genes in the differential.
  - reference: PMID:27079373
    reference_title: "Ndufs4 related Leigh syndrome: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some data, including the clinical phenotype, neuroimaging and biochemical findings, can
      guide the genetic study in patients with RCC I deficiency.
    explanation: >-
      The general principle that the phenotype narrows the gene within complex I deficiency,
      from the review that compared NDUFS4 against 24 other complex I genotypes.

- name: Other nuclear complex I subunit and assembly factor deficiencies
  description: >-
    The immediate siblings - NDUFS2, NDUFS8, NDUFA1, NDUFA12, NDUFB9, NDUFAF8, TIMMDC1 and the
    rest - present with overlapping encephalopathy and are separated by sequencing rather than
    clinically. What distinguishes NDUFS4 within the group is the narrowness of its range: the
    review that compared 22 NDUFS4 patients against 198 patients with 24 other complex I defects
    found NDUFS4 uniformly early-onset and severe, where several sibling genes span Leigh
    syndrome to isolated optic atrophy. Gene identity carries prognostic information within this
    group, which is the substantive reason each of these is curated as its own entry.
  evidence:
  - reference: PMID:27079373
    reference_title: "Ndufs4 related Leigh syndrome: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We reviewed 198 patients with 24 different genetic defects causing RCC I deficiency and
      compared them to 22 NDUFS4 patients.
    explanation: >-
      The comparison that establishes NDUFS4 as behaving differently from the complex I class as
      a whole.

discussions:

- discussion_id: mismatch_ndufs4_ko_mouse_lesion_distribution
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
  prompt: >-
    Does the Ndufs4 knockout mouse model the neuropathology of human NDUFS4 disease, or only
    its biochemistry?
  rationale: >-
    The biochemical match is as good as this field gets. The human alleles abolish the protein,
    the disease is recessive, and the whole-body knockout reproduces the assembly lesion,
    including the loss of NDUFA12 and the retained NDUFAF2, measured the same way in mouse and
    patient cells. That part transfers.

    The neuropathology does not transfer as cleanly. The mouse lesions centre on the vestibular
    nuclei, olfactory bulb and cerebellum. The human disease is defined by brainstem and basal
    ganglia involvement, with basal ganglia lesions in 9 of 22 reported patients and cortical
    atrophy in only 3. Seizures are prominent in the terminal phase of some knockout lines but
    occur in 4 of 22 published patients. The tempo differs too: the mouse is well for five
    weeks and dies two weeks later, while the median human patient presents at four months and
    dies at ten.

    This matters because every current therapeutic lead in this disease - rapamycin, chronic
    hypoxia, NAD repletion, leukocyte depletion - was established by preventing lesions in this
    animal, and the endpoint used was the mouse's own lesion set. If the anatomical
    distribution reflects a species difference in which nuclei are most vulnerable, an
    intervention that protects the mouse vestibular nucleus need not protect the human
    putamen.
  proposed_experiments:
  - experiment_id: ndufs4_lesion_distribution_comparison
    name: Systematic comparison of lesion distribution between Ndufs4 knockout mice and NDUFS4 patients
    description: >-
      Assemble the published NDUFS4 patient neuroimaging and any available neuropathology, score
      lesion presence by anatomical structure against the same structures scored in Ndufs4
      knockout mice, and test whether the distributions differ beyond what tissue availability
      and imaging modality explain.
    would_support:
    - pathophysiology#Symmetric Necrotizing Brainstem and Basal Ganglia Lesions
    supporting_outcome:
    - >-
      The distributions correspond once the homologous structures are matched, which would mean
      the mouse lesion set is a fair endpoint for preclinical trials and the apparent difference
      is one of nomenclature and imaging.
    refuting_outcome:
    - >-
      The distributions differ systematically, which would mean preclinical efficacy measured as
      protection of the mouse vestibular nucleus is not evidence of protection of the human
      basal ganglia, and would call for a lesion endpoint chosen to match the human anatomy.

- discussion_id: gap_ndufs4_severity_range
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - progression#Rapidly progressive infantile-lethal course
  prompt: >-
    Is NDUFS4 disease invariably fatal in infancy, or does the published series under-represent
    milder patients?
  rationale: >-
    The severity claim in this entry comes from a 2016 review that compared 22 NDUFS4 patients
    against 198 patients with other complex I defects and concluded the NDUFS4 phenotype is
    invariably early-onset, severe and rapidly fatal. That is the strongest gene-specific
    prognostic statement available and it is what makes NDUFS4 recognisable within the complex I
    class.

    Since then at least two patients have been reported who do not fit: a girl alive at seven,
    with a milder course attributed to an intronic splice variant reached through uniparental
    isodisomy, and an eight-year-old whose presentation was bilateral horizontal gaze palsy. In
    the 22-patient compilation itself, only 14 had mortality data.

    The mechanism that would explain a mild patient is available and untested. The severe
    phenotype is associated with alleles that abolish the protein entirely; a leaky splice
    variant that permits some residual NDUFS4 should sit further along the same axis. Nobody has
    measured residual NDUFS4 protein or complex I assembly in the long-surviving patients, so
    the correlation between residual protein and survival is a hypothesis rather than a finding.

    The stake is counselling. A family told the disease is invariably fatal in infancy is being
    given a prognosis derived from a series that may systematically miss the children who live.
  proposed_experiments:
  - experiment_id: ndufs4_residual_protein_versus_survival
    name: Residual NDUFS4 protein and complex I assembly in long-surviving patients
    description: >-
      Obtain fibroblasts from the reported NDUFS4 patients surviving beyond three years,
      quantify residual NDUFS4 and NDUFA12 protein by immunoblot and assembled complex I by blue
      native PAGE, and compare against lines from patients who died in infancy.
    would_support:
    - progression#Rapidly progressive infantile-lethal course
    supporting_outcome:
    - >-
      Long survivors have detectable residual NDUFS4 protein and some assembled complex I,
      establishing a genotype-severity axis within the gene and making residual protein a
      prognostic measurement that could be offered at diagnosis.
    refuting_outcome:
    - >-
      Long survivors have no more residual protein or assembled complex I than infants who died,
      which would mean survival is determined by something other than residual enzyme -
      modifiers, or care - and that the biochemical profile carries no prognostic information at
      all.

notes: >-
  Why this is a Disease and not a subtype of Leigh Syndrome. This was the substantive question
  on the claim issue and it does point both ways, so here is the argument as it was actually
  weighed against the two decided precedents.

  Toward a subtype, the way vanishing white matter 5 went in PR #10424: the Leigh Syndrome entry
  does genuinely bind NDUFS4. It carries hgnc:7711 in its `genetic:` section with an
  association, its own autosomal recessive inheritance block and cited evidence, and again in a
  `pathophysiology[].genes` list. This is not the methylmalonic aciduria cblA situation from PR
  #10260, where the gene was named in prose with nothing behind it. ClinGen points the same way:
  its Mitochondrial Diseases panel curates NDUFS4 against Leigh syndrome, MONDO:0009723, not
  against MONDO:0100224.

  Toward a Disease, which is what this is, four things.

  First, MONDO does not place this concept under Leigh syndrome. MONDO:0100224's parents are
  "mitochondrial complex I deficiency, nuclear type" and "inborn mitochondrial myopathy". That
  is the structural difference from the VWM5 case, where MONDO:0957873 is a direct child of the
  umbrella entry's own term, so a subtype record was recording a relation the ontology already
  asserted. Here it would be asserting a different one.

  Second, the VWM5 decision turned on two large cohorts showing that which eIF2B subunit is
  mutated does not predict the disease, so there was no gene-specific pathograph to write. The
  complex I literature says the opposite. A review comparing 22 NDUFS4 patients against 198
  patients with 24 other complex I gene defects concluded NDUFS4 disease is uniformly
  early-onset and severe, while sibling genes already curated here span Leigh syndrome to
  isolated optic atrophy. Gene identity carries information in this group.

  Third, there is a gene-specific mechanism to curate and the Leigh entry does not contain it.
  Leigh's node is a generic "Complex I deficiency" shared between NDUFS4, NDUFV1 and MT-ND5,
  with GO annotations for NADH dehydrogenase activity. Nothing there is about NDUFS4 being an
  accessory subunit at the N-Q module interface, about the CI-830 subcomplex, about the
  reciprocal loss of NDUFA12 and retention of NDUFAF2, or about the diagnostic constancy of the
  native-gel profile. Those are the load-bearing facts of this entity and they are all absent
  upstream.

  Fourth, seven MC1DN entries already exist here - types 2, 6, 12, 23, 24, 31 and 34 - most of
  which also present as Leigh syndrome, all coexisting with the Leigh Syndrome entry. Type 23
  even lists Leigh Syndrome among its `parents:`. Making type 1 the single exception would be
  the inconsistent choice, and it is the type with the strongest claim to its own entry.

  On the ClinGen point specifically: gene-disease validity curation deliberately lumps to the
  broadest defensible clinical entity, because the question that curation answers is whether
  variants in a gene cause disease at all. It is not a nosological ruling about whether the
  biochemical entity is separable. The entry records the assertion and says which disease it was
  made against rather than quietly re-labelling it.

  The Leigh Syndrome entry was not modified.

  Named entity check. The preflight passes rather than warns: NDUFS4 is mentioned 55 times in
  the deep-research report with the next gene at 5, and the OMIM identifier the report cites
  matches the one MONDO carries. But the gate is not sufficient here, because NDUFS4's literature
  is overwhelmingly about Leigh syndrome and overwhelmingly murine, and neither is automatically
  about this MONDO term. Every claim in this entry is therefore tagged by the population it came
  from. Two specific traps were checked and avoided. NDUFS4 has a substantial cancer literature -
  gastric cancer, glioma, prostate cancer, where it is studied as a proliferation or ferroptosis
  regulator - which is the same protein in a different context and is not cited. And the NADH
  reductive-stress biomarker study (PMID:39858433) reports a human fibroblast cohort of 22
  mitochondrial disease patients whose complex I cases are NDUFA1, MT-ND3, MT-ND5 and ACAD9 -
  NDUFS4 is not among them - so its human arm is not this disease and is not cited here at all;
  the mouse arm is Ndufs4 and would have been citable, but adds nothing the iPSC line does not
  say in a human cell.

  Frequencies. Every band comes from one denominator, the 22-patient 18-family NDUFS4
  compilation quoted in PMID:34849584, and each band is stated with its numerator in the
  phenotype description so it can be checked. Nothing is banded from a broader Leigh series. The
  Leigh registry (116 participants) and the incidence figure of 1 in 40,000 live births are
  Leigh-wide numbers and are deliberately not used: no `prevalence` record is given at all,
  because no MC1DN1-specific prevalence exists and a Leigh figure entered here would be a
  different disease's number in this file's slot.

  Evidence grading. The human anchors are the phenotype counts, the survival data, the allele
  spectrum, the founder frequency and the isodisomy case. The assembly biochemistry is graded
  IN_VITRO where it was measured in patient or knockout cells and MODEL_ORGANISM where it was
  measured in the animal, even when both appear in one paper. Every therapy in the entry is
  MODEL_ORGANISM or IN_VITRO; none has human efficacy evidence in this gene, and the descriptions
  say so rather than implying a treatment exists.

  What is deliberately absent. No `prevalence`, for the reason above. No `clinical_trials`: the
  trials in the deep-research report - vatiquinone in Leigh syndrome, elamipretide in nuclear
  primary mitochondrial myopathy - enrol Leigh or mitochondrial myopathy populations, not NDUFS4
  patients, and recording them here would attribute another population's trial to this entry. No
  `datasets`, because a search on the gene symbol returns the cancer and mouse literature rather
  than an NDUFS4 patient dataset. Two references were fetched and not used because their cache
  entries have no quotable content: both are Finsterer correspondence letters (PMID:28371352,
  PMID:30937725), and the second - which argues that early-age Ndufs4 knockout mice are an
  inappropriate model - would have been directly relevant to the model-mismatch discussion. It is
  named here so the next curator does not spend the same effort discovering it is unquotable.


differential_diagnoses:
- name: Contiguous ABCD1/DXS1357E deletion syndrome (CADDS)
  disease_term:
    preferred_term: CADDS
    term:
      id: MONDO:0018247
      label: CADDS
  description: >-
    Xq28 deletions removing BCAP31 together with the ABCD1 promoter or gene. It
    shares the DDCH features but adds very-long-chain fatty acid elevation from
    ABCD1 loss, neonatal cholestatic liver disease and, in most reported males,
    death in the first year. It is a separate MONDO and Orphanet disease and is
    not modelled as a subtype here, because its defining features come from the
    second deleted gene rather than from a variant class of BCAP31.
  distinguishing_features:
  - Elevated plasma very-long-chain fatty acids from absent ABCD1 protein
  - Neonatal cholestatic liver disease and early death, not seen with intragenic BCAP31 variants
  - Deletion detected by chromosomal microarray spanning BCAP31 and ABCD1
  evidence:
  - reference: PMID:11992258
    reference_title: "Contiguous deletion of the X-linked adrenoleukodystrophy gene (ABCD1) and DXS1357E: a novel neonatal phenotype similar to peroxisomal biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we showed that they lacked ALDP, and we identified deletions that extended
      into the promoter region of ABCD1 and the neighboring gene, DXS1357E.
    explanation: The founding CADDS report; DXS1357E is the former name of BCAP31.
  - reference: PMID:24597975
    reference_title: "Genotype-phenotype correlation of contiguous gene deletions of SLC6A8, BCAP31 and ABCD1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only deletions involving both BCAP31 and ABCD1 were associated with hepatic
      cholestasis and death before 1 year, which might be explained by a
      synergistic effect.
    explanation: Separates CADDS from DDCH by cholestasis and early death.
  - reference: PMID:37701323
    reference_title: "Interstitial lung disease and pancreatic exocrine insufficiency in CADDS: Phenotypic expansion and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While increased VLCFA levels also feature in CADDS, the few patients
      described to date all presented as neonates with a severe phenotype.
    explanation: VLCFA elevation and neonatal severity distinguish CADDS.
  - reference: PMID:33603160
    reference_title: "Further delineation of BCAP31-linked intellectual disability: description of 17 new families with LoF and missense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients with deletions of BCAP31 and ABCD1 have contiguous ABCD1 and
      DXS1375E/BCAP31 deletion syndrome (CADDS), and demonstrate a more severe
      neurological phenotype with cholestatic liver disease and early death.
    explanation: CADDS is more severe than intragenic BCAP31 disease.
discussions:
- discussion_id: ddch_hypomyelination_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of an ER-to-Golgi trafficking chaperone cause hypomyelination,
    and which neural cell type carries the primary defect?
  attaches_to:
  - pathophysiology#Disturbed ER Morphology and ER-to-Golgi Trafficking
  - pathophysiology#Impaired CNS Myelination
  rationale: >-
    The cellular lesion was characterised only in skin fibroblasts, where the
    Golgi is disorganised in about a third of cells and there is no UPR or
    apoptosis. The link to white matter rests on the MRI pattern and on the
    general dependence of myelination on secretory trafficking. No oligodendrocyte,
    neuronal or animal model of BAP31 deficiency addressing myelination was found
    in the sources cited here, and one patient's white-matter changes resolved by
    age 12, which does not fit a simple fixed myelin-synthesis defect.
- discussion_id: ddch_mitochondrial_involvement
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is mitochondrial complex I deficiency part of DDCH, or a finding confined to
    one patient?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Complex I Function
  - phenotypes#Decreased activity of mitochondrial complex I
  rationale: >-
    Complex I deficiency was measured in fibroblasts of one patient and fits
    BAP31's role in importing NDUFS4 at ER-mitochondria contacts, but normal
    respiratory-chain activities were reported in muscle of two patients and in
    fibroblasts of two brothers, and the mitochondrial network was normal in the
    founding patients' fibroblasts. The auditory-neuropathy data linking BCAP31 to
    mitochondrial dysfunction come from an allelic nonsyndromic family. The
    discrepancy could reflect tissue, assay or allele differences; a systematic
    comparison has not been reported.

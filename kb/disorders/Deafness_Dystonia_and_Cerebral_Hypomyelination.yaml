name: Deafness Dystonia and Cerebral Hypomyelination
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
description: >
  Deafness, dystonia and cerebral hypomyelination (DDCH) is an X-linked recessive
  neurodevelopmental disorder caused by hemizygous loss-of-function variants in
  BCAP31, which encodes BAP31, one of the most abundant membrane proteins of the
  endoplasmic reticulum. BAP31 acts as a chaperone and cargo receptor at the ER,
  taking part in ER export of membrane proteins to the Golgi, ER-associated
  degradation, and ER-mitochondria contact-site signalling.

  Affected males have severe to profound global developmental delay without
  independent walking, dystonic and choreic movements, sensorineural hearing loss,
  microcephaly, pyramidal signs and hypomyelinating white-matter changes on MRI,
  often with failure to thrive, strabismus and intermittent elevation of liver
  transaminases, typically during febrile illness. Several of the first reported
  males died in childhood, some during febrile episodes. Males with missense
  variants have a milder course, and heterozygous females are usually unaffected
  but may have hearing loss or learning difficulties.

  In patient fibroblasts BAP31 loss enlarges the ER and disorganises the Golgi
  without triggering the unfolded protein response or apoptosis, which places the
  primary lesion in ER-to-Golgi trafficking rather than in ER stress. A
  mitochondrial complex I defect has been reported in one patient's fibroblasts
  and is supported by BAP31's role at ER-mitochondria contacts, but was not found
  in other patients' muscle or fibroblasts. Contiguous Xq28 deletions that also
  remove ABCD1 cause a distinct, more severe neonatal disorder (CADDS), which is
  treated here as a differential diagnosis rather than a subtype.
synonyms:
- deafness, dystonia, and cerebral hypomyelination, X-linked recessive
- deafness, dystonia, and cerebral hypomyelination
- DDCH
- severe motor and intellectual disabilities-sensorineural deafness-dystonia syndrome
- BCAP31-related syndrome

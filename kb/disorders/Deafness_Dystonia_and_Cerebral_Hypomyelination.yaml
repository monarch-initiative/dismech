inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are hemizygous males; most variants are inherited from
    carrier mothers, with de novo variants and maternal somatic mosaicism reported.
    Heterozygous females are usually unaffected but can have sensorineural hearing
    loss, learning difficulties or intellectual disability, and a severely affected
    girl has been reported with a de novo variant on the active X chromosome and
    skewed X inactivation.
  evidence:
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three mutations were inherited through carrier females who do not have
      intellectual disability.
    explanation: Maternal transmission to affected males in the three founding families.
  - reference: PMID:33603160
    reference_title: "Further delineation of BCAP31-linked intellectual disability: description of 17 new families with LoF and missense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      that were all maternally inherited except one that was de novo. Somatic
      mosaicism was found in the mother of P12.
    explanation: Maternal inheritance in 11 of 12 families, one de novo variant and one mosaic mother.
  - reference: PMID:33603160
    reference_title: "Further delineation of BCAP31-linked intellectual disability: description of 17 new families with LoF and missense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We further demonstrate that carrier females (n = 10) may have a phenotype
      comprising LD, ID, and/or deafness.
    explanation: Heterozygous females can be symptomatic.
  - reference: PMID:32652807
    reference_title: De novo mutation and skewed X-inactivation in girl with BCAP31-related syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first reported female patient in BCAP31-related syndrome
      resulted from skewed X-inactivation and a de novo mutation in the active X
      chromosome.
    explanation: A fully affected female explained by skewed X inactivation.
prevalence:
- population: Worldwide, cases reported in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About 30 reported cases by 2025, counting intragenic variants and deletions
    that include BCAP31 together; no population estimate exists. The founding
    screen found BCAP31 variants in 3 of 30 males selected for deafness, dystonia
    and white-matter change, which the authors read as a sign that the disorder
    may be under-recognised in that phenotype group.
  evidence:
  - reference: PMID:40662097
    reference_title: "Hemizygous contiguous gene deletion within Xq28 that includes BCAP31, ABCD1, SRPK3 and SSR4: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Approximately 30 cases have been reported, mainly involving intragenic loss
      of function or missense mutations, but also including larger deletions
      encompassing contiguous genes, most involving ABCD1
    explanation: Literature count of reported BCAP31 cases.
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This relatively high detection rate suggests that BCAP31 mutations might
      not be rare in males suffering from deafness, dystonia, and white-matter
      changes.
    explanation: Diagnostic yield in a phenotype-selected cohort, suggesting under-ascertainment.
genetic:
- name: BCAP31
  notes: >-
    BCAP31 (Xq28) lies between SLC6A8 (centromeric) and ABCD1 (telomeric).
    Reported disease alleles are splice, nonsense, frameshift and exonic deletions
    that abolish normal BAP31, plus a smaller set of missense variants with a
    milder phenotype. Deletions removing BCAP31 together with SLC6A8 give the same
    phenotype as intragenic BCAP31 variants and are included in this entry;
    deletions removing BCAP31 together with ABCD1 cause CADDS (see differential
    diagnoses). Missense variants have also been reported in adult-onset
    presentations outside the DDCH picture (ataxia with hearing loss, early-onset
    Parkinson disease with congenital deafness, nonsyndromic auditory neuropathy);
    those are allelic phenotypes, not features of this entry.
  gene_term:
    preferred_term: BCAP31
    term:
      id: hgnc:16695
      label: BCAP31
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified loss-of-function mutations in BCAP31 in seven individuals
      from three families. These persons suffered from motor and intellectual
      disabilities, dystonia, sensorineural deafness, and white-matter changes,
      which together define an X-linked syndrome.
    explanation: The founding gene-disease report.
  - reference: PMID:33603160
    reference_title: "Further delineation of BCAP31-linked intellectual disability: description of 17 new families with LoF and missense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study confirms the phenotype reported in males with intragenic LoF
      variants and shows that males with missense variants exhibit a milder
      phenotype.
    explanation: Replication in 14 further families with intragenic variants, and the allelic severity difference.
  - reference: PMID:33603160
    reference_title: "Further delineation of BCAP31-linked intellectual disability: description of 17 new families with LoF and missense variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients with deletions including BCAP31 and SLC6A8 have the same phenotype
      as BCAP31 patients.
    explanation: BCAP31-SLC6A8 deletions fall within this entry.
  - reference: PMID:31330203
    reference_title: "BCAP31-related syndrome: The first de novo report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical exome sequencing in the trio identified a small intragenic deletion
      in exon 8 of BCAP31, c.709_721del (p.Val237Trpfs*69), originated de novo
      and not previously reported.
    explanation: An independent de novo truncating allele with the DDCH phenotype.
pathophysiology:
- name: BCAP31 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Hemizygous splice, nonsense, frameshift or exonic-deletion variants abolish
    normal BAP31. In the founding family the splice variant reduced BCAP31
    transcript to 7% of normal, consistent with nonsense-mediated decay.

        changes reminiscent of those observed in hypomyelinating leukodystrophies
      explanation: >-
        Links the trafficking defect to hypomyelination by inference from the MRI
        phenotype, not by measurement in glia.
  - target: Neurodevelopmental Brain Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24011989
      reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."

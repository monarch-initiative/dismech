notes: >
  Scope and the CADDS decision. MONDO:0010334 no longer lists the contiguous
  ABCD1/DXS1357E deletion syndrome as a synonym; CADDS is its own concept
  (MONDO:0018247, ORPHA:369942). Older papers cite MIM 300475 for CADDS because
  OMIM previously filed the deletion syndrome under that number. The stub's
  synonym "contiguous ABCD1/Dxs1375E deletion syndrome" is therefore not carried
  here, and CADDS is recorded as a differential diagnosis rather than a
  has_subtypes row: its distinguishing features (VLCFA elevation, neonatal
  cholestasis, death in infancy) are attributed to ABCD1 loss or to the combined
  deletion rather than to a BCAP31 allele class. Deletions removing BCAP31 and
  SLC6A8 without ABCD1 give the DDCH phenotype and are within scope.

  Schimke X-linked intellectual disability syndrome (OMIM 312840) was shown to be
  caused by a BCAP31 frameshift and judged clinically identical to DDCH
  (PMID:32681719); it is not added as a synonym because MONDO does not record it
  as one.

  Phenotype frequencies are from PMID:33603160 and count only males with
  intragenic loss-of-function variants (denominators 9 to 12, per feature).
  Missense males are milder and are not included in those counts.

  Allelic phenotypes outside this entry: adult-onset ataxia with hearing loss
  (p.Val8Ile, PMID:39831730), early-onset Parkinson disease with congenital
  deafness (p.Arg101Lys, PMID:42312245), and nonsyndromic auditory neuropathy
  (PMID:40462059). The last is used only as indirect support for the
  mitochondrial hearing-loss branch.

  GeneReviews: the Bookshelf index check (snapshot 2026-09-10, with live PubMed
  title search) finds no GeneReviews or StatPearls chapter for DDCH or BCAP31.
  Growth, strabismus and facial features are recorded without a causal edge
  because no cited source proposes a mechanism for them.

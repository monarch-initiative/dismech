  evidence:
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The three mutations identified in BCAP31 are probable loss-of-function
      alleles that abolish the production of normal BAP31
    explanation: Immunoblot of patient fibroblasts shows absence of normal BAP31.
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It is a chaperone protein involved in several pathways, including
      ER-associated degradation, export of ER proteins to the Golgi apparatus,
      and programmed cell death.
    explanation: The normal functions of BAP31 that loss of function removes.
  downstream:
  - target: Disturbed ER Morphology and ER-to-Golgi Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24011989
      reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In the primary fibroblasts of affected individuals, we found that BCAP31
        deficiency altered ER morphology and caused a disorganization of the Golgi
        apparatus in a significant proportion of cells.
      explanation: Patient fibroblasts lacking BAP31 show the ER and Golgi defect.
  - target: Impaired Mitochondrial Complex I Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BAP31 bridges the ER and mitochondria through Tom40 and promotes import of
      the complex I subunit NDUFS4, so its loss is expected to lower complex I
      activity. The disease-level data are mixed and are recorded on the target
      node.
    evidence:
    - reference: PMID:31206022
      reference_title: BAP31 regulates mitochondrial function via interaction with Tom40 within ER-mitochondria contact sites.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Disruption of the BAP31-Tom40 complex inhibits mitochondrial complex I
        activity and oxygen consumption by the decreased NDUFS4 localization to the
        mitochondria.
      explanation: >-
        Cell-line experiments disrupting the BAP31-Tom40 complex, not patient
        cells, hence INDIRECT for this disease.
  - target: Elevated circulating hepatic transaminase concentration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Liver enzyme elevation is attributed to BCAP31 loss because it occurs with
      intragenic variants and with every deletion that includes BCAP31; the hepatic
      mechanism is not known.
    evidence:
    - reference: PMID:24011989
      reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is very likely that the liver dysfunction reported in persons carrying
        large deletions involving BCAP31 and ABCD1 or SCL6A8 and BCAP31 can be
        attributed to BCAP31 loss.
      explanation: Attribution of the liver phenotype to BCAP31 across deletion and intragenic cases.
- name: Disturbed ER Morphology and ER-to-Golgi Trafficking
  biological_scale: CELLULAR
  description: >-
    BAP31-deficient patient fibroblasts are enlarged, with a swollen ER and a
    Golgi apparatus fragmented into scattered patches in up to about 30% of cells,
    and contain large vesicles with electron-dense inclusions. Constitutive BAP31
    loss does not cause measurable accumulation of an ERAD substrate, activate the
    unfolded protein response, or trigger apoptosis, unlike transient knockdown,
    so the defect is placed in ER-to-Golgi exchange rather than in ER stress.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: ABNORMAL
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  - preferred_term: Golgi organization
    modifier: ABNORMAL
    term:
      id: GO:0007030
      label: Golgi organization
  - preferred_term: endoplasmic reticulum organization
    modifier: ABNORMAL
    term:
      id: GO:0007029
      label: endoplasmic reticulum organization
  evidence:
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that the Golgi apparatus was disorganized in up to 29.5% of
      BAP31-deficient fibroblasts
    explanation: Quantifies the Golgi defect in patient fibroblasts.
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Contrary to what has been described with transient-RNA-interference
      experiments, we demonstrate that constitutive BCAP31 deficiency does not
      activate the unfolded protein response or cell-death effectors.
    explanation: Excludes UPR activation and apoptosis as the cellular lesion in patient cells.
  - reference: PMID:24011989
    reference_title: "Mutations in BCAP31 cause a severe X-linked phenotype with deafness, dystonia, and central hypomyelination and disorganize the Golgi apparatus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      our data demonstrate that the lack of BAP31 disturbs ER metabolism and
      impacts the Golgi apparatus, highlighting an important role for BAP31 in
      ER-to-Golgi crosstalk
    explanation: The authors' interpretation of the fibroblast findings as an ER-to-Golgi defect.
  downstream:

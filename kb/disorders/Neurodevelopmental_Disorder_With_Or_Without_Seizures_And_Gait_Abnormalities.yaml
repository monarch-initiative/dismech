    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using trio whole-exome sequencing, we have identified de novo heterozygous pathogenic variants in GRIA4 in five unrelated individuals with intellectual disability and other symptoms."
    explanation: Trio exome sequencing was the diagnostic test in the founding series.
  - reference: PMID:35518358

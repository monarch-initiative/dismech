  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    Sole known causative gene. All reported alleles are de novo heterozygous missense
    variants, mostly in the SYTANLAAF motif of the M3 transmembrane helix.
  notes: >-
    ClinGen rates the relationship Moderate rather than Definitive. relationship_type is
    CAUSATIVE because GRIA4 is the only gene known for this OMIM phenotype; the tier below is
    the external grading.

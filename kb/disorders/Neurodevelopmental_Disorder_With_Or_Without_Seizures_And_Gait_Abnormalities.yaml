animal_models:
- name: Gria4 knockout mouse
  species: Mouse
  genotype: Gria4 homozygous null (and C3H/HeJ spkw1 hypomorphic insertion allele)
  publication: PMID:18316356
  category: Genetically engineered
  description: >-
    Mice lacking or underexpressing Gria4 have frequent spike-wave discharges with behavioural
    arrest, modelling absence epilepsy. The spontaneous C3H/HeJ susceptibility locus spkw1
    is a hypomorphic retroviral-like insertion in Gria4, and the knockout fails to complement
    it.
  genes:
  - preferred_term: Gria4
    term:
      id: MGI:95811
      label: Gria4
  notes: >-
    Mouse Gria4 is the ortholog of human GRIA4.
  modeled_mechanisms:
  - target: Cortico-Thalamic Network Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces cortico-thalamic hypersynchrony and spike-wave discharges, the network
      phenotype behind the seizures and EEG findings in patients.
    limitations: >-
      The model carries loss-of-function alleles, mostly homozygous, while patients carry a
      single de novo missense allele of undetermined direction. Developmental delay, raised
      tone and gait abnormality are not reported in the mouse.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The patient lesion, a heterozygous missense change in the M3 gate that still
        produces a subunit, is not encoded; the mouse instead removes or reduces Gria4
        expression. Spike-wave discharges were more frequent in homozygotes and less frequent
        in heterozygotes, so the model is closer to a recessive null than to the human
        dominant missense disease.
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The cited studies report seizures and synaptic physiology only. The intellectual
        disability, spasticity and gait abnormality that define the human disorder are not
        described, although a mouse could show motor and learning deficits.
    readouts:
    - name: Spike-wave discharges
      target: Cortico-Thalamic Network Hypersynchrony
      direction: INCREASED
      interpretation: EEG readout of the hypersynchronous cortico-thalamic state.
      evidence:
      - reference: PMID:18316356
        reference_title: "Absence seizures in C3H/HeJ and knockout mice caused by mutation of the AMPA receptor subunit Gria4."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Consistent with this, Gria4 knockout mice also have frequent SWD and do not complement spkw1."
        explanation: Frequent spike-wave discharges in Gria4 knockout mice.
    - name: Cortico-reticular thalamic synaptic strength
      target: Cortico-Thalamic Network Hypersynchrony
      direction: DECREASED
      interpretation: The excitatory synapse onto reticular thalamic neurons that depends on GluA4.
      evidence:
      - reference: PMID:21857658
        reference_title: "A new mode of corticothalamic transmission revealed in the Gria4(-/-) model of absence epilepsy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found a systemic and specific reduction in strength in GluA4-deficient (Gria4(-/-)) mice of one excitatory synapse of the rhythmogenic cortico-thalamo-cortical system, the cortico-nRT projection"
        explanation: Measured reduction of cortico-nRT synaptic strength in Gria4 null mice.
    evidence:
    - reference: CGGV:assertion_2c6e2c49-e537-4eec-8b85-aef0c6651d55-2024-07-07T160000.000Z
      reference_title: "GRIA4 / neurodevelopmental disorder with or without seizures and gait abnormalities (Moderate)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The model appeared to be more consistent with recessive inheritance with spike wave discharges, also observed with lower incidence in the context of heterozygosity"
      explanation: >-
        ClinGen counts the mouse as experimental support while noting its recessive pattern,
        which is the basis of the CAUSE_UNREPRESENTED divergence.
  evidence:
  - reference: PMID:18316356
    reference_title: "Absence seizures in C3H/HeJ and knockout mice caused by mutation of the AMPA receptor subunit Gria4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we find that spkw1 is associated with a hypomorphic retroviral-like insertion mutation in the Gria4 gene"
    explanation: Identifies the spontaneous hypomorphic Gria4 allele behind C3H/HeJ absence seizures.

discussions:
- discussion_id: gria4_variant_functional_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do pathogenic GRIA4 missense variants increase or decrease GluA4-containing AMPA receptor
    current, and does the answer differ between gate (SYTANLAAF) and non-gate variants?
  attaches_to:
  - pathophysiology#Disturbed GluA4 AMPA Receptor Channel Gating
  - pathophysiology#GRIA4 De Novo Missense Variant
  rationale: >-
    The pathograph has to leave the receptor defect undirected. The founding report inferred
    disturbed gating for some variants and reduced permeability for another from modelling,
    and the 2022 report called for electrophysiology. In the paralogous GRIA3 disorder, gain-
    and loss-of-function alleles give opposite tone and seizure phenotypes and imply opposite
    drug choices, so the direction matters here too. The only animal model is a loss-of-function
    one and cannot answer the question.
  evidence:
  - reference: PMID:35518358
    reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, further investigation by the electrophysiology experiments and biotinylation assay will be necessary to determine whether p.Ala640Ser in GRIA4 affects the channel synthesis or trafficking and its effect on currents."
    explanation: The authors state that the effect of the variant on currents is untested.

notes: >-
  No GeneReviews or StatPearls chapter covers this disorder (Bookshelf index snapshot
  2026-09-10, searched by entry name and by GRIA4), so the phenotype baseline is the
  combined table of six patients in PMID:35518358 plus the later ESES case report. ClinGen
  also counts probands from PMID:27479843 and PMID:37921875 whose individual phenotypes are
  not described in their abstracts and are not curated here.

  description: >-
    Diagnosis rests on finding a de novo heterozygous GRIA4 missense variant. There is no
    biochemical or imaging marker; MRI is often normal. Sequencing the parents establishes de
    novo origin, which is the main evidence for pathogenicity in a gene with so few reported
    cases.
  diagnosis_term:
    preferred_term: trio whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:29220673

- name: Cortico-Thalamic Network Hypersynchrony
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The cortico-thalamo-cortical loop generates sleep spindles and, when hypersynchronous,
    spike-wave discharges. GluA4 is the main fast AMPA subunit at cortical synapses onto
    inhibitory reticular thalamic neurons. In Gria4-deficient mice that synapse is weakened,
    synaptic responses are prolonged, and spike-wave discharges with behavioural arrest
    appear. For the human disorder this node is an extrapolation from the mouse: the patient
    alleles are heterozygous missense changes of unknown direction, not null alleles, though
    the human EEG findings (generalized spike-wave in sleep, ESES) are of the type the node
    predicts.
  locations:
  - preferred_term: thalamic reticular nucleus
    term:
      id: UBERON:0001903
      label: thalamic reticular nucleus
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18316356
      reference_title: "Absence seizures in C3H/HeJ and knockout mice caused by mutation of the AMPA receptor subunit Gria4."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Consistent with this, Gria4 knockout mice also have frequent SWD and do not complement spkw1."
      explanation: Loss of Gria4 is sufficient for spike-wave seizures in the mouse.
  - target: EEG abnormality
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35518358
      reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "All four patients with seizures exhibited abnormal EEG and two of them had abnormal MRI."
      explanation: Every patient with seizures had an abnormal EEG, the human readout of the network defect.
  - target: Continuous spike and waves during slow sleep
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38819422
      reference_title: "Mutation in the GRIA4 Gene Presenting as ESES: Expanding the Genetic Landscape of ESES."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "EEG revealed nearly continuous generalized spike–wave epileptiform discharges during slow-wave sleep, consistent with ESES"
      explanation: A sleep-potentiated generalized spike-wave pattern in a GRIA4 carrier, the human counterpart of the mouse discharges.
  evidence:
  - reference: PMID:18316356
    reference_title: "Absence seizures in C3H/HeJ and knockout mice caused by mutation of the AMPA receptor subunit Gria4."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Gria4 mutants, synaptic excitation of inhibitory reticular thalamic neurons is enhanced, with increased duration of synaptic responses"
    explanation: Measured change in reticular thalamic synaptic responses in Gria4 mutant mice.
  - reference: PMID:21857658
    reference_title: "A new mode of corticothalamic transmission revealed in the Gria4(-/-) model of absence epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found a systemic and specific reduction in strength in GluA4-deficient (Gria4(-/-)) mice of one excitatory synapse of the rhythmogenic cortico-thalamo-cortical system, the cortico-nRT projection"
    explanation: Identifies the cortico-reticular synapse as the circuit element that depends on GluA4.

phenotypes:

inheritance:
- name: Autosomal dominant inheritance, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    A single heterozygous GRIA4 missense variant is sufficient. Every reported variant arose
    de novo in the proband with unaffected parents, so no familial transmission has been
    observed and penetrance cannot be estimated.
  evidence:
  - reference: PMID:35518358
    reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is a newly described autosomal dominant inherited disease caused by a heterozygous variant in the GRIA4 gene"
    explanation: States the autosomal dominant mode and heterozygous genotype.
  - reference: PMID:35518358
    reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All GRIA4 variants described are de novo heterozygous missense variants that cluster in the transmembrane and ligand-binding domains of the GRIA4 protein."
    explanation: Every variant reported at the time arose de novo, which is why no familial penetrance estimate exists.
  - reference: CGGV:assertion_2c6e2c49-e537-4eec-8b85-aef0c6651d55-2024-07-07T160000.000Z
    reference_title: "GRIA4 / neurodevelopmental disorder with or without seizures and gait abnormalities (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GRIA4 | HGNC:4574 | neurodevelopmental disorder with or without seizures and gait abnormalities | MONDO:0060641 | AD | Moderate"
    explanation: ClinGen curates the gene-disease relationship under autosomal dominant inheritance.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence has been published. ClinGen's 2024 curation counted
    ten probands with ten distinct missense variants across five publications, so only the
    qualitative ultra-rare tier is supportable and no rate is given.
  evidence:
  - reference: CGGV:assertion_2c6e2c49-e537-4eec-8b85-aef0c6651d55-2024-07-07T160000.000Z
    reference_title: "GRIA4 / neurodevelopmental disorder with or without seizures and gait abnormalities (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Ten unique missense variants reported in 10 probands in 5 publications"
    explanation: The total published case count, which is the basis for the ultra-rare tier.

pathophysiology:
- name: GRIA4 De Novo Missense Variant
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    A de novo heterozygous missense change in GRIA4 at 11q22 is the initiating lesion. Four
    of the five original variants (p.Thr639Ser, p.Asn641Asp, p.Ala643Gly, p.Ala644Val) and
    the later p.Ala640Ser lie in the SYTANLAAF motif of the M3 transmembrane helix, the gate
    of the channel; p.Arg697Pro lies in an extracellular domain and p.Thr292Ser in the
    amino-terminal region. No truncating or copy-number allele has been reported.
  genes:
  - preferred_term: GRIA4
    term:
      id: hgnc:4574
      label: GRIA4
  molecular_functions:
  - preferred_term: GluA4 AMPA receptor channel activity (affected wild-type function)
    modifier: ABNORMAL
    term:
      id: GO:0004971
      label: AMPA glutamate receptor activity
  genetic_context:
    gene:
      preferred_term: GRIA4
      term:
        id: hgnc:4574
        label: GRIA4
    allele_type: missense
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      Set to UNKNOWN because no published electrophysiology of a GRIA4 patient variant
      states a direction. The original report inferred disturbed gating for three
      SYTANLAAF variants and reduced permeability for a fourth from structural modelling
      only.
  downstream:
  - target: Disturbed GluA4 AMPA Receptor Channel Gating
    causal_link_type: DIRECT
    description: >-
      Substitutions at pore-facing residues of the SYTANLAAF gate are predicted to perturb
      gating or ion permeation of receptors that contain the mutant subunit.
    evidence:
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "Molecular modeling of the altered protein showed that three of the variants in the SYTANLAAF motif orient toward the center of the pore region and most likely lead to disturbance of the gating mechanism."
      explanation: >-
        Structural modelling, not a measurement, links the variants to disturbed gating;
        graded INDIRECT for that reason.
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: "The fourth variant in the SYTANLAAF motif most likely results in reduced permeability."
      explanation: The same modelling predicts reduced ion permeation for a fourth gate variant.
  evidence:
  - reference: PMID:29220673
    reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using trio whole-exome sequencing, we have identified de novo heterozygous pathogenic variants in GRIA4 in five unrelated individuals with intellectual disability and other symptoms."
    explanation: The founding case series identifying de novo heterozygous GRIA4 variants as the cause.
  - reference: PMID:29220673
    reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the variants are located in the highly conserved SYTANLAAF motif in the transmembrane protein M3, and the fifth is in an extra-cellular domain."
    explanation: Locates the variants in the gating motif and in an extracellular domain.
  - reference: PMID:35518358
    reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio-WES identified a novel de novo heterozygous missense variant c.1918G>T, p.Ala640Ser in the GRIA4 gene."
    explanation: An independent de novo missense variant in the same motif in a sixth patient.

- name: Disturbed GluA4 AMPA Receptor Channel Gating
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Receptors containing the mutant GluA4 subunit are predicted to gate or conduct abnormally.
    The SYTANLAAF motif couples ligand binding to channel opening, and the extracellular
    p.Arg697Pro variant may instead interfere with subunit assembly. Whether the net effect is
    gain or loss of current is not known for any GRIA4 patient variant; across GRIA1-4
    patient variants, measured changes include agonist potency, response time course,
    desensitization and surface expression.
  molecular_functions:
  - preferred_term: GluA4-containing AMPA receptor channel activity
    modifier: ABNORMAL
    term:
      id: GO:0004971
      label: AMPA glutamate receptor activity
  cellular_components:
  - preferred_term: AMPA receptor complex containing GluA4
    term:
      id: GO:0032281
      label: AMPA glutamate receptor complex
  downstream:
  - target: Dysregulated AMPA Receptor-Mediated Excitatory Transmission
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Altered gating of GluA4-containing receptors is expected to change the fast excitatory
      postsynaptic current they carry. This step is inferred from receptor function and has
      not been measured for a GRIA4 patient variant.
    evidence:
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "GRIA4 encodes an AMPA receptor subunit known as GluR4, which is found on excitatory glutamatergic synapses and is important for learning and memory."
      explanation: Places GluA4 at excitatory glutamatergic synapses, the site where a gating defect would act.
  evidence:
  - reference: PMID:35518358
    reference_title: "Novel Heterozygous Missense Variant in GRIA4 Gene Associated With Neurodevelopmental Disorder With or Without Seizures and Gait Abnormalities."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "M3 transmembrane segment contains a nine amino acid sequence, SYTANLAAF motif, that plays a crucial role in channel activation and gating, and is highly sensitive to a conservative amino acid change"
    explanation: Explains why substitutions in this motif are expected to disturb gating.
  - reference: PMID:29220673
    reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "The variant in the extracellular domain potentially interferes with the binding between the monomers."
    explanation: Modelling suggests the extracellular variant affects subunit association rather than the gate.
  - reference: PMID:37921875
    reference_title: "Clinical and functional consequences of GRIA variants in patients with neurological diseases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "These variants produce changes in agonist EC50, response time course, desensitization, and/or receptor surface expression."
    explanation: >-
      Recombinant testing of patient missense variants across GRIA1-4 found these kinds of
      functional change; the abstract does not separate the GRIA4 results, so this is
      indirect for GRIA4.

- name: Dysregulated AMPA Receptor-Mediated Excitatory Transmission
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Abnormal GluA4-containing receptors are expected to alter fast excitatory synaptic
    transmission in the circuits where GluA4 is abundant, including the thalamus (especially
    the thalamic reticular nucleus), hippocampal CA1 and cerebellar granule cells. During
    development this would affect activity-dependent circuit formation. The step is inferred
    from receptor biology and from the mouse model; it has not been observed in patients.
  biological_processes:
  - preferred_term: AMPA receptor-mediated excitatory synaptic transmission
    modifier: DYSREGULATED
    term:
      id: GO:0098976
      label: excitatory chemical synaptic transmission
  cell_types:
  - preferred_term: glutamatergic neuron
    term:
      id: CL:0000679
      label: glutamatergic neuron
  downstream:
  - target: Cortico-Thalamic Network Hypersynchrony
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      In Gria4-deficient mice, the changed excitatory drive onto reticular thalamic neurons
      promotes the oscillatory synchrony that produces spike-wave discharges.
    evidence:
    - reference: PMID:18316356
      reference_title: "Absence seizures in C3H/HeJ and knockout mice caused by mutation of the AMPA receptor subunit Gria4."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "suggest that abnormal AMPA receptor-dependent synaptic activity can be involved in the network hypersynchrony that underlies absence seizures"
      explanation: >-
        Mouse loss-of-function data link abnormal GluA4-dependent synaptic activity to
        network hypersynchrony; INDIRECT because the human alleles are different.
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "we suggest that pathogenic de novo variants in GRIA4 lead to intellectual disability with or without seizures, gait abnormalities, problems of social behavior, and other variable features"
      explanation: Ties the GRIA4 lesion to the neurodevelopmental phenotype; the circuit-level steps between them are not described.
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "we suggest that pathogenic de novo variants in GRIA4 lead to intellectual disability with or without seizures, gait abnormalities, problems of social behavior, and other variable features"
      explanation: Intellectual disability is the defining outcome of the GRIA4 lesion in the founding series.
  - target: Gait disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29220673
      reference_title: "De Novo Variants in GRIA4 Lead to Intellectual Disability with or without Seizures and Gait Abnormalities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "we suggest that pathogenic de novo variants in GRIA4 lead to intellectual disability with or without seizures, gait abnormalities, problems of social behavior, and other variable features"
      explanation: Gait abnormality is named as a consequence of the GRIA4 variants.
  - target: Hypertonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: CGGV:assertion_2c6e2c49-e537-4eec-8b85-aef0c6651d55-2024-07-07T160000.000Z
      reference_title: "GRIA4 / neurodevelopmental disorder with or without seizures and gait abnormalities (Moderate)"

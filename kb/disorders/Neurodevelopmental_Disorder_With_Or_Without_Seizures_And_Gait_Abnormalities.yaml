name: Neurodevelopmental Disorder With Or Without Seizures And Gait Abnormalities
creation_date: "2026-11-22T07:30:00Z"
category: Mendelian
description: >-
  Neurodevelopmental disorder with or without seizures and gait abnormalities (NEDSGA;
  OMIM 617864) is an ultra-rare early-onset neurodevelopmental disorder caused by de novo
  heterozygous missense variants in GRIA4, which encodes GluA4 (GluR4), a subunit of the
  AMPA-type ionotropic glutamate receptor at excitatory synapses. Global developmental delay
  and intellectual disability of mild to severe degree are present in every reported
  individual. Most also have early tone abnormalities (irritability, stiffness and
  hypertonia, later spasticity), a clumsy, stiff or wide-based gait or no independent walking,
  and poor or absent speech. Seizures occur in about two thirds of reported cases, with onset
  from the first day of life to 14 months, and range from febrile and generalized seizures to
  refractory epilepsy with status epilepticus and, in one child, electrical status epilepticus
  in slow sleep. Ocular findings (strabismus, nystagmus, optic nerve hypoplasia, retinal
  hypoplasia) are reported in some. Most reported variants fall in the SYTANLAAF gating motif
  of the M3 transmembrane helix, and structural modelling predicts disturbed channel gating or
  permeability. The functional direction of the human variants has not been settled by
  published electrophysiology, so the pathograph below records the receptor defect as an
  altered, not a gained or lost, function. Gria4-deficient mice have absence-like spike-wave
  discharges arising in the cortico-thalamic circuit, which is the only experimental route to
  the seizure phenotype.

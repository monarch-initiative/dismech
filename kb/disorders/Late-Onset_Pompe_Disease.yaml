name: Late-Onset Pompe Disease
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
description: >
  Late-onset Pompe disease (LOPD; glycogen storage disease due to acid maltase
  deficiency, late-onset) is the attenuated end of the acid alpha-glucosidase
  (GAA) deficiency spectrum. It is defined clinically as Pompe disease presenting
  after age 12 months, or before 12 months in the absence of cardiomyopathy, and
  can declare itself anywhere from the first to the seventh decade of life. The
  mechanistic distinction from infantile-onset disease is quantitative rather than
  categorical: LOPD genotypes retain partial GAA activity, most commonly through
  the "leaky" intron-1 splice variant c.-32-13T>G, which weakens the exon 2 splice
  acceptor but still permits a low level of correctly spliced transcript. Residual
  enzyme keeps lysosomal glycogen turnover above the threshold at which
  cardiomyocytes decompensate, so the heart is largely spared, while slowly
  progressive storage in skeletal and respiratory muscle produces a limb-girdle
  myopathy with disproportionate diaphragmatic involvement. Respiratory failure,
  not cardiac failure, is the dominant cause of death in untreated LOPD. Enzyme
  replacement therapy slows but does not arrest the myopathy, in part because
  autophagic buildup in skeletal myofibers mistargets endocytosed recombinant
  enzyme away from the lysosome. Newborn screening now identifies pre-symptomatic
  LOPD, creating a management problem the infantile form does not have.

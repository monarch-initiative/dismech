progression:
- phase: Clinically manifest disease
  age_range: >-
    Onset from the first to the seventh decade; median age at diagnosis 38 years,
    median age at death 56 years in untreated natural-history series
  notes: >-
    LOPD is insidious and lifelong. The wide onset range is the clinical expression
    of the residual-activity gradient set by the patient's leaky allele, and there
    is no spontaneous remission.
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

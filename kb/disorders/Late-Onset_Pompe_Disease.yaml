  attaches_to:
  - pathophysiology#Incomplete Response to Enzyme Replacement Therapy
  prompt: >-
    When should enzyme replacement therapy be started in a person with a confirmed
    LOPD genotype who has no symptoms, as is now routine after newborn screening or
    family cascade testing?
  rationale: >
    Newborn screening and family screening increasingly identify LOPD before any
    clinical sign. Because LOPD is defined by a decades-long latency, the
    conventional trigger for treatment - symptom onset - may come after irreversible
    myofiber loss, but treating a pre-symptomatic patient commits them to lifelong
    infusions with cost, infusion-reaction risk, and immunogenicity. Guidance is not
    settled: European recommendations favour monitoring asymptomatic cases with
    minimal muscle MRI findings, while other guidance would start therapy once any
    muscle involvement (for example paraspinal) is detectable. Siblings sharing a
    genotype can differ markedly in age at presentation and MRI burden, so genotype
    alone does not resolve the question.
  evidence:
  - reference: PMID:36833288
    reference_title: "Treatment Dilemma in Children with Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dilemma is when to start Enzyme Replacement Therapy (ERT) in patients without any clinical sign of the disease, considering its important benefits in terms of loss of muscle but also its very high cost, risk of side effects, and long-term immunogenicity."
    explanation: States the pre-symptomatic treatment-initiation gap that this discussion records.
  - reference: PMID:36833288
    reference_title: "Treatment Dilemma in Children with Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "European guidelines suggest monitoring in asymptomatic LOPD cases with minimal MRI findings, although other guidelines consider starting ERT in apparently asymptomatic cases with initial muscle involvement (e.g., paraspinal muscles)."
    explanation: Documents the disagreement between guidelines that makes this an open question rather than settled practice.
  - reference: PMID:24383498
    reference_title: "The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions in juvenile- and adult-onset patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The best outcome of ERT both clinically and morphologically was observed in the NBS patients."
    explanation: Argues for earlier initiation, since newborn-screening-detected patients had the best clinical and histological response - but this is an uncontrolled comparison across onset groups, so it informs rather than settles the question.
- discussion_id: lopd_autophagic_mistargeting_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Autophagic Buildup and Mistargeting of Endocytosed Recombinant Enzyme
  prompt: >-
    Does autophagic mistargeting of endocytosed recombinant GAA, demonstrated in
    single fibers of the GAA knockout mouse, account for the therapeutic ceiling
    observed in treated human LOPD skeletal muscle?
  rationale: >
    The mistargeting mechanism is directly imaged in live single muscle fibers of
    GAA knockout mice, which model complete rather than partial enzyme deficiency.
    LOPD muscle retains residual enzyme and accumulates storage over decades, so the
    extent of autophagic buildup - and therefore how much of the human treatment
    ceiling it explains - is not established from the mouse data alone. The human
    counterpart evidence in this entry is indirect: fat fraction continues to rise
    and some patients still progress to ventilation on therapy, which is consistent
    with the mechanism but does not measure enzyme trafficking in human muscle.
  proposed_experiments:
  - experiment_id: lopd_rhgaa_trafficking_in_patient_myofibers
    name: Trafficking of labelled rhGAA in LOPD patient muscle biopsy fibers
    description: >-
      Assess whether endocytosed recombinant GAA reaches lysosomes or is retained in
      autophagic compartments in myofibers from genotyped LOPD patients, stratified
      by residual enzyme activity and by duration of enzyme replacement therapy.
  evidence:
  - reference: PMID:17008131
    reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings may explain why ERT often falls short of reversing the disease process and point toward new avenues for the development of pharmacological intervention."
    explanation: The authors present the mechanism as an explanation that "may" account for the therapeutic shortfall, which is the translational uncertainty recorded here.
notes: >
  Scope. This entry curates the late-onset arm of the acid alpha-glucosidase
  deficiency spectrum (MONDO:0018485) as a distinct entity from the umbrella Pompe
  disease entry (MONDO:0009290, kb/disorders/Pompe_Disease.yaml). It deliberately
  does not restate the umbrella entry's generic GAA/glycogen biology, its
  infantile-onset content, or its full treatment catalogue. What is curated here is
  the mechanism that makes late onset late: partial rather than absent enzyme
  activity arising from leaky splicing, the resulting cardiac sparing and
  muscle-restricted storage, the diaphragm-predominant respiratory arm including
  its possible phrenic motor neuron component, and the autophagic ceiling on
  enzyme replacement therapy.

  A residual-activity range of roughly 1-30% of normal is widely cited for LOPD and
  is recorded in the umbrella entry's subtype description; it is stated here as
  context in the biochemical entry rather than as an evidence-bearing claim, because
  the cited genotype-phenotype study explicitly found enzyme activity alone
  insufficient to classify disease subtype.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    LOPD is autosomal recessive. The characteristic LOPD genotype is compound
    heterozygosity for the leaky c.-32-13T>G intron-1 splice variant on one allele
    and a fully deleterious GAA variant on the other, so that the leaky allele sets
    the residual enzyme activity and therefore the phenotype.
  evidence:
  - reference: PMID:36299500
    reference_title: "Investigating Late-Onset Pompe Prevalence in Neuromuscular Medicine Academic Practices: The IPaNeMA Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the definite LOPD participants, 8 (89%) were Caucasian and were heterozygous for the common leaky (IVS1) splice site mutation in the GAA gene (c -32-13T>G), with a second mutation that was previously confirmed to be pathogenic."
    explanation: Documents the compound-heterozygous leaky-allele-plus-null genotype that characterizes LOPD.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: >-
      GeneReviews states the sibling recurrence risks that follow from biallelic GAA
      inheritance. This is the counselling figure the block exists to record, and it is
      quantitative in a way the IPaNeMA genotype observation is not, so both are kept.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Once the GAA pathogenic variants have been identified in an affected family member, molecular genetic carrier testing for at-risk relatives and prenatal/preimplantation genetic testing are possible."
    explanation: >-
      Establishes that identifying the proband's biallelic GAA variants is what makes
      carrier and prenatal testing available to the family.

- category: Laboratory
  name: Elevated creatine kinase
  description: >
    Serum creatine kinase is commonly raised and may be the only abnormality that
    brings a patient to neuromuscular attention; isolated hyperCKemia is one of the
    accepted triggers for GAA enzyme screening.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  diagnostic: true
  evidence:
  - reference: PMID:36299500
    reference_title: "Investigating Late-Onset Pompe Prevalence in Neuromuscular Medicine Academic Practices: The IPaNeMA Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All successive patients presenting with proximal muscle weakness or isolated hyperCKemia and/or neck muscle weakness to these 13 centers were invited to participate in the study."
    explanation: Isolated hyperCKemia is used as a case-finding criterion for LOPD in neuromuscular practice.
biochemical:
- name: Reduced but not absent acid alpha-glucosidase activity
  presence: DECREASED
  context: >
    LOPD is biochemically defined by partial rather than absent GAA activity,
    conventionally cited as roughly 1-30% of normal. Enzyme activity alone,
    however, does not reliably separate LOPD from IOPD - genotype carries more
    predictive information - so a low-but-not-absent value should be interpreted
    alongside GAA sequencing.
  evidence:
  - reference: PMID:33972680
    reference_title: "Phenotypic implications of pathogenic variant types in Pompe disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzyme activity levels in isolation were not sufficient to predict disease subtype or other major clinical features."
    explanation: Bounds the diagnostic claim - residual enzyme activity alone does not classify a patient as LOPD versus IOPD.
  - reference: PMID:36299500
    reference_title: "Investigating Late-Onset Pompe Prevalence in Neuromuscular Medicine Academic Practices: The IPaNeMA Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole blood was tested for acid alpha-glucosidase (GAA) assay through the fluorometric method, and all cases with enzyme levels of ≤10 pmoL/punch/h were reflexed to molecular testing for mutations in the GAA gene."
    explanation: Documents the reflex-testing workflow in which a reduced GAA activity result is confirmed by GAA genotyping.
histopathology:
- name: Lipofuscin-loaded autolysosomes in skeletal muscle
  description: >
    Muscle biopsies from adult-onset, juvenile-onset, and newborn-screening-detected
    LOPD patients on enzyme replacement therapy contain areas of autophagic buildup
    filled with large autofluorescent inclusions identified as lipofuscin. These
    lipofuscin-loaded lysosomes and autolysosomes are the dominant pathology that
    persists in myofibers after enzyme replacement therapy, and are proposed to
    aggravate the lysosomal and autophagic abnormalities that caused them.
  diagnostic: false
  evidence:
  - reference: PMID:24383498
    reference_title: "The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions in juvenile- and adult-onset patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The areas of autophagic buildup found in patients' biopsies of all three groups, contained large autofluorescent inclusions which we show are made of lipofuscin, an indigestible intralysosomal material typically associated with ageing."
    explanation: Identifies the lipofuscin content of the autophagic areas in LOPD muscle biopsies.
  - reference: PMID:24383498
    reference_title: "The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions in juvenile- and adult-onset patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These inclusions, analysed by staining, spectral analysis, time-resolved Fluorescence Lifetime Imaging (FLIM), and Second Harmonic Generation (SHG) imaging, were the major pathology remaining in many fibers after ERT."
    explanation: Establishes these inclusions as the ERT-resistant residual pathology of LOPD skeletal muscle.
genetic:
- name: GAA leaky splice-site variants
  gene_term:
    preferred_term: GAA
    term:
      id: hgnc:4065
      label: GAA
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >
    The LOPD genotype is defined by retention of at least one allele that still
    produces some functional enzyme. c.-32-13T>G is by far the commonest such
    allele in populations of European ancestry, but it is not the only one: several
    other splice-site variants are similarly associated with the late-onset
    phenotype, whereas two non-splice-site (typically null) alleles produce
    infantile disease.
  evidence:
  - reference: PMID:33972680
    reference_title: "Phenotypic implications of pathogenic variant types in Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To extend the findings of prior studies, we found that multiple types of splice site variants beyond the classic c.-32-13T > G variant are often associated with a milder phenotype."
    explanation: Shows the late-onset phenotype tracks with splice-site (leaky) alleles generally, not only c.-32-13T>G.
  - reference: PMID:36299500
    reference_title: "Investigating Late-Onset Pompe Prevalence in Neuromuscular Medicine Academic Practices: The IPaNeMA Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the definite LOPD participants, 8 (89%) were Caucasian and were heterozygous for the common leaky (IVS1) splice site mutation in the GAA gene (c -32-13T>G), with a second mutation that was previously confirmed to be pathogenic."
    explanation: Quantifies the dominance of the leaky IVS1 allele among LOPD patients in a North American neuromuscular cohort.
  - reference: PMID:39273088
    reference_title: "Mutation Spectrum of GAA Gene in Pompe Disease: Current Knowledge and Results of an Italian Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study concluded that Italian patients exhibited a characteristic genetic profile similar to that of the broader European population, with the c.-32-13T>G variant being the most prevalent."
    explanation: >-
      A second, independent European cohort confirms c.-32-13T>G as the most prevalent
      allele, so the leaky-allele finding is not specific to the North American series.
  - reference: PMID:39273088
    reference_title: "Mutation Spectrum of GAA Gene in Pompe Disease: Current Knowledge and Results of an Italian Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the whole cohort of patients analyzed with reduced or borderline activity, genetic testing was done, and we found 39 patients with two causative mutations in GAA gene connected to PD, and 22 subjects with GVUS variants."
    explanation: >-
      Bounds the genotype-first framing - in a screened cohort, a substantial minority
      carried variants of uncertain significance rather than a resolvable genotype, which
      is the practical limit on classifying a patient by GAA sequence.
  variants:
  - name: c.-32-13T>G (IVS1)
    description: >
      Intron-1 variant 13 nucleotides upstream of GAA exon 2. It weakens the exon 2
      splice acceptor, causing partial and complete exon 2 skipping, while permitting
      a low level of correctly spliced wild-type transcript - the "leaky" behaviour
      that yields residual enzyme and late-onset disease.
    clinical_significance: PATHOGENIC
    regulatory_category: mLOE
    evidence:
    - reference: PMID:28624228
      reference_title: "Antisense Oligonucleotides Promote Exon Inclusion and Correct the Common c.-32-13T>G GAA Splicing Variant in Pompe Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which weakens the splice acceptor of GAA exon 2 and induces partial and complete exon 2 skipping. It also allows a low level of leaky wild-type splicing, leading to a childhood/adult phenotype."
      explanation: Characterizes the splicing consequence and residual-activity behaviour of the IVS1 variant.
treatments:
- name: Enzyme replacement therapy for late-onset disease
  description: >
    Intravenous recombinant human GAA is the standard disease-modifying treatment.
    Alglucosidase alfa is approved for LOPD; avalglucosidase alfa is approved for
    individuals with LOPD older than one year; and cipaglucosidase alfa with
    miglustat is approved for adults with LOPD weighing at least 40 kg who are not
    improving on their current regimen. Benefit in LOPD is real but partial, and is
    limited by autophagic mistargeting of enzyme in skeletal muscle.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: alglucosidase alfa
      term:
        id: NCIT:C65221
        label: Alglucosidase Alfa
    - preferred_term: avalglucosidase alfa
      term:
        id: NCIT:C169795
        label: Avalglucosidase Alfa
    - preferred_term: cipaglucosidase alfa
      term:
        id: NCIT:C175059
        label: Cipaglucosidase Alfa
    - preferred_term: miglustat
      term:
        id: CHEBI:50381
        label: miglustat
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  - preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  target_mechanisms:
  - target: Attenuated Lysosomal Glycogen Accumulation in Skeletal and Respiratory Muscle
    treatment_effect: MODULATES
    description: >-
      Recombinant enzyme supplies the deficient lysosomal hydrolase and reduces the
      stored glycogen burden in muscle.
    evidence:
    - reference: PMID:20393176
      reference_title: "A randomized study of alglucosidase alfa in late-onset Pompe's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "At 78 weeks, the estimated mean changes from baseline in the primary end points favored alglucosidase alfa (an increase of 28.1+/-13.1 m on the 6-minute walk test and an absolute increase of 3.4+/-1.2 percentage points in FVC; P=0.03 and P=0.006, respectively)."
      explanation: The pivotal LOPD randomized trial shows enzyme replacement modifies walking distance and vital capacity relative to placebo.
  evidence:
  - reference: PMID:20393176
    reference_title: "A randomized study of alglucosidase alfa in late-onset Pompe's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 78 weeks, the estimated mean changes from baseline in the primary end points favored alglucosidase alfa (an increase of 28.1+/-13.1 m on the 6-minute walk test and an absolute increase of 3.4+/-1.2 percentage points in FVC; P=0.03 and P=0.006, respectively)."
    explanation: Randomized, placebo-controlled evidence of benefit for alglucosidase alfa in late-onset Pompe disease.
  - reference: PMID:34800399
    reference_title: "Safety and efficacy of avalglucosidase alfa versus alglucosidase alfa in patients with late-onset Pompe disease (COMET): a phase 3, randomised, multicentre trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We consider that this study provides evidence of clinically meaningful improvement with avalglucosidase alfa therapy over alglucosidase alfa in respiratory function, ambulation, and functional endurance, with no new safety signals reported."
    explanation: Head-to-head phase 3 evidence supporting avalglucosidase alfa in late-onset disease.
  - reference: PMID:38057636
    reference_title: "Long-term safety and efficacy of cipaglucosidase alfa plus miglustat in individuals living with Pompe disease: an open-label phase I/II study (ATB200-02)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, cipa + mig was well tolerated with a safety profile like alglucosidase alfa. ATB200-02 results show the potential benefits of cipa + mig as a long-term treatment option for Pompe disease."
    explanation: >-
      Supplies the long-term (48-month) safety and efficacy evidence for the third
      approved LOPD regimen, cipaglucosidase alfa with miglustat.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ERT options include alglucosidase alfa for both IOPD and LOPD; avalglucosidase for individuals with LOPD who are older than age one year; and cipaglucosidase alfa with miglustat for adults with LOPD who weigh at least 40 kg and are not improving on their current ERT regimen."
    explanation: GeneReviews sets out the approved enzyme replacement options specific to late-onset disease.
- name: Non-invasive ventilation
  description: >
    Non-invasive ventilation is the mainstay of treatment for sleep-disordered
    breathing and ventilatory failure in LOPD, targeting adequate ventilation during
    sleep and prevention of acute hypercapnic decompensation. It addresses the
    diaphragmatic failure node directly and is required regardless of enzyme
    replacement therapy in many patients.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Nocturnal hypoventilation
    term:
      id: HP:0002877
      label: Nocturnal hypoventilation
  - preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
  target_mechanisms:
  - target: Phrenic Motor Unit Failure
    treatment_effect: MODULATES
    description: >-
      Positive-pressure ventilation substitutes for failing inspiratory muscle work
      rather than correcting the underlying storage lesion.
    evidence:
    - reference: PMID:33214927
      reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mainstay of treatment for SDB and respiratory failure in LOPD is non-invasive ventilation (NIV), which aims to ensure adequate ventilation, particularly during sleep, and prevent acute hypercapnic failure."
      explanation: Identifies non-invasive ventilation as the primary intervention for the respiratory failure node.
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mainstay of treatment for SDB and respiratory failure in LOPD is non-invasive ventilation (NIV), which aims to ensure adequate ventilation, particularly during sleep, and prevent acute hypercapnic failure."
    explanation: Establishes non-invasive ventilation as standard management of respiratory failure in LOPD.
- name: Structured multidisciplinary surveillance
  description: >
    LOPD is managed as a multisystem disease on a fixed schedule rather than
    symptomatically. GeneReviews specifies, at least annually, DXA bone mineral
    density (a recommendation written specifically for the late-onset group),
    pulmonary function tests, echocardiography including assessment for aortic
    dilatation, EKG, audiology, and BNP where cardiomyopathy is a concern; MR cerebral
    angiography at least every five years for progressive cerebral vessel dilation;
    and, as clinically indicated, whole-body MRI, polysomnography, and
    videofluoroscopic swallow study. This is the surveillance counterpart of the
    aortic dilatation, reduced bone density, dysphagia, and sleep-disordered breathing
    phenotypes curated above.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary disease surveillance
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least annually, bone mineral density screening (DXA) in those with LOPD (in those with IOPD, DXA scan every two to three years until puberty, then every one to two years); pulmonary function tests; echocardiography (to include assessment for aortic dilatation in those with LOPD); EKG; audiology evaluation; BNP level (if there are concerns for evolving cardiomyopathy)."
    explanation: >-
      GeneReviews sets out the annual surveillance panel, with the DXA and aortic
      assessment items written specifically for late-onset patients.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least every five years, MR cerebral angiography to evaluate for progressive dilation of cerebral vasculature."
    explanation: >-
      Records the cerebral vascular surveillance interval, the intracranial counterpart
      of the aortic arteriopathy curated as a phenotype.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Polysomnography and/or oxycapnography should be performed every 12 months."
    explanation: >-
      The European pathway independently sets an annual sleep-study interval, which is
      the surveillance that detects the nocturnal hypoventilation phenotype before
      daytime failure.
- name: Anaesthetic and cardiovascular agent precautions
  description: >
    This is a negative recommendation rather than an intervention. Anaesthesia carries
    disproportionate risk in LOPD because reduced cardiovascular return combines with
    the underlying respiratory insufficiency, and GeneReviews advises using it only
    when absolutely necessary. Positioning matters for the same reason: because vital
    capacity falls on lying flat, LOPD patients should not be laid completely supine.
    Digoxin, inotropes, diuretics, and afterload-reducing agents can worsen left
    ventricular outflow obstruction; that caution is inherited from Pompe disease
    generally and is less applicable to the typically cardiac-spared LOPD patient, so
    it is recorded here as context rather than as an LOPD-specific claim.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: avoidance of high-risk agents and circumstances
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anesthesia should be used only when absolutely necessary because reduced cardiovascular return and underlying respiratory insufficiency pose significant risks."
    explanation: GeneReviews states the anaesthetic caution and the two physiological reasons for it.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It should be noted that most patients have lower FVC in supine position due to poor diaphragmatic function; therefore, they should not lay totally flat, but be positioned in a (slightly) upright position."
    explanation: >-
      Gives the positioning precaution that follows from the same diaphragmatic weakness,
      applicable during respiratory decompensation and around procedures.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The use of digoxin, ionotropes, diuretics, and afterload-reducing agents may worsen left ventricular outflow obstruction, although they may be indicated in later stages of the disease"
    explanation: >-
      Bounds the cardiac drug caution - it is written for Pompe disease as a whole, and
      the outflow obstruction it guards against is a feature of the infantile-onset
      cardiomyopathy rather than of typically cardiac-spared LOPD.
diagnosis:
- name: Recognition of the LOPD red-flag presentation
  description: >
    Because LOPD presents insidiously with non-specific complaints, the rate-limiting
    step is clinical suspicion rather than any assay. Unexplained proximal or axial
    weakness, restrictive respiratory insufficiency, hyperCKemia, and exercise
    intolerance are the agreed red flags that should trigger GAA testing; reduced
    pulmonary function specifically in the supine position is the LOPD-typical
    modifier. Normal CK, EMG, or muscle biopsy do not exclude the diagnosis.
  diagnosis_term:
    preferred_term: LOPD red-flag case finding
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Any of these red flags in an adult or older child without a better explanation
    should prompt a dried blood spot GAA assay rather than further undirected
    neuromuscular workup.
  evidence:
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the presence of unexplained proximal/axial weakness (with or without respiratory symptoms) or restrictive respiratory insufficiency with hyperCKemia (up to 15-fold) and/or exercise intolerance should be considered as the red flag symptoms/signs that raise suspicion for LOPD diagnosis"
    explanation: The neurology expert consensus enumerates the red flags that open the LOPD diagnostic algorithm.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "proximal limb girdle weakness and/or axial muscle weakness with or without reduced pulmonary function, in particular when in supine position should be considered as red flags for LOPD patients"
    explanation: >-
      The MetabERN European clinical pathway independently defines the same red-flag
      set and adds the supine-position qualifier that is characteristic of LOPD.
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it should be noted that normal CK values or the normal findings on EMG or muscle biopsy do not exclude the LOPD diagnosis"
    explanation: >-
      Bounds the negative predictive value of the supporting tests - a normal CK, EMG,
      or biopsy must not be used to close the diagnostic question.
- name: Dried blood spot GAA activity as first-line screen
  description: >
    A GAA enzyme assay on a dried blood spot is the first-line test: cheap, minimally
    invasive, and fast. It is explicitly a screening test and is never sufficient for
    a definitive diagnosis. Modern assays include acarbose to competitively inhibit
    maltase-glucoamylase, which otherwise confounds activity measured at acidic pH;
    poor spotting, humidity, and heat during shipping are recognized preanalytical
    causes of spurious results.
  diagnosis_term:
    preferred_term: dried blood spot acid alpha-glucosidase assay
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    Reduced GAA activity on dried blood spot is a positive screen that must be
    referred on for confirmation; a normal result in a patient with strong red flags
    does not close the question.
  evidence:
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A GAA enzyme assay in dried blood spot assay can be used as a first line test. However, this test is not sufficient for a definitive diagnosis."
    explanation: States both the first-line role of the dried blood spot assay and its explicit insufficiency for diagnosis.
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is frequently a first-line test because it has the advantages of being easy to perform, inexpensive, minimally invasive, and able to provide rapid results"
    explanation: Gives the reasons the dried blood spot assay occupies the screening position.
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "incorrect blood spotting and the combination of humidity and heat caused by insufficient drying or inappropriate shipping can interfere with enzyme stability and, consequently, the assessment of GAA levels"
    explanation: Documents the preanalytical failure modes that make a single dried blood spot result unreliable on its own.
- name: Confirmatory enzyme and molecular genetic testing
  description: >
    A positive screen is confirmed either by GAA enzyme assay in a second tissue
    (peripheral leukocytes or lymphocytes, cultured skin fibroblasts, or muscle) or by
    identifying biallelic pathogenic GAA variants. Molecular confirmation is the more
    informative of the two in LOPD, because residual enzyme activity alone does not
    separate late-onset from infantile-onset disease whereas the genotype - in
    practice the presence of the leaky c.-32-13T>G allele - largely does.
  diagnosis_term:
    preferred_term: GAA molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Deficient GAA activity in a confirmatory tissue and/or two pathogenic GAA variants
    in trans establish the diagnosis.
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of Pompe disease is established in a proband who has deficiency of acid alpha-glucosidase (GAA) enzyme activity in isolated lymphocytes or mixed leukocytes and/or by identification of biallelic pathogenic (or likely pathogenic) variants in GAA by molecular genetic testing"
    explanation: GeneReviews states the two accepted routes to a confirmed diagnosis.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of Pompe disease should be confirmed by GAA enzyme assay in at least one of the following: peripheral leukocytes/lymphocytes, cultured fibroblasts from skin biopsy, muscle biopsy."
    explanation: Names the acceptable confirmatory tissues for the enzyme route.
  - reference: PMID:33972680
    reference_title: "Phenotypic implications of pathogenic variant types in Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enzyme activity levels in isolation were not sufficient to predict disease subtype or other major clinical features."
    explanation: >-
      Supports preferring genotype over residual activity when the question is whether
      a confirmed patient has late-onset rather than infantile-onset disease.
- name: Pseudodeficiency alleles as a false-positive trap
  description: >
    A reduced GAA activity result with no pathogenic genotype may reflect a
    pseudodeficiency allele rather than disease. The best-characterized example is
    GAA c.271G>A (p.Asp91Asn), which depresses measured enzyme activity but has been
    formally reviewed as benign for Pompe disease. This is the specific reason
    molecular confirmation - and, when the genotype does not explain the phenotype,
    broader genetic analysis - is required rather than optional.
  diagnosis_term:
    preferred_term: GAA variant classification
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Low measured GAA activity without two pathogenic variants should raise a
    pseudodeficiency allele and prompt variant curation against ACMG-AMP criteria, not
    a diagnosis of Pompe disease.
  evidence:
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rarely, positive DBS with no pathogenic variant may also be related to pseudodeficiency alleles"
    explanation: Establishes pseudodeficiency as a recognized cause of a positive screen without disease.
  - reference: DOI:10.1101/2024.10.03.24314698
    reference_title: "From Past to Present: Pompe Disease, Pseudodeficiency Alleles, and Diagnostic Challenges"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We demonstrated that GAA :c.271G>A meets the criterion of being classified as benign for Pompe."
    explanation: >-
      Identifies the specific pseudodeficiency allele and its expert-panel-reviewed
      benign classification. This source is a preprint, so it is cited for the variant
      classification only and the general trap is carried by the peer-reviewed citation
      above.
  notes: >-
    The preprint additionally reports a patient homozygous for c.271G>A whose symptoms
    were ultimately explained by a PABPN1 variant, which is the clinical shape of the
    error this entry is guarding against.
- name: Sitting and supine forced vital capacity
  description: >
    Spirometry performed in both the sitting and the supine position is the routine
    diaphragm-specific measurement in LOPD. Because the diaphragm is
    disproportionately affected, vital capacity falls on lying flat, so a supine drop
    identifies diaphragm weakness that a seated measurement alone can miss. It is
    recommended at least annually.
  diagnosis_term:
    preferred_term: sitting and supine spirometry
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  results: >-
    A fall in forced vital capacity from sitting to supine indicates diaphragmatic
    weakness; an FVC below 40% predicted should prompt referral to a home ventilation
    team.
  evidence:
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Due to the involvement of diaphragm, pulmonary function in supine position may be more affected than in upright position."
    explanation: States the physiological basis for measuring vital capacity in both positions.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pulmonary function (FVC sitting, supine) should be evaluated in both sitting and supine position at least once a year or more frequently depending on patients' conditions."
    explanation: Gives the recommended frequency and the two-position protocol.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with an FVC < 40% should be brought to the attention of a home ventilation team"
    explanation: Provides the actionable threshold that makes this measurement a management decision point.
- name: Electrodiagnostic study with paraspinal needle EMG
  description: >
    Needle electromyography with nerve conduction studies is the step that separates
    LOPD from other neuromuscular causes of the same presentation. Electrophysiological
    myotonia without clinical myotonia, particularly in the paraspinal muscles, is
    considered highly suggestive of LOPD. It is a supportive, not a confirmatory,
    investigation.
  diagnosis_term:
    preferred_term: needle electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  results: >-
    Paraspinal electrophysiological myotonia in the absence of clinical myotonia
    strengthens the case for GAA testing; a normal study does not exclude LOPD.
  evidence:
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of electrophysiological myotonia in the absence of clinical myotonia and permanent weakness, particularly in paraspinal muscles, are highly suggestive of LOPD diagnosis"
    explanation: Identifies the characteristic electrodiagnostic finding and its paraspinal localization.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "EMG and peripheral nerve conduction studies are optional and may be considered at diagnosis as a supportive element."
    explanation: >-
      Bounds the claim - the European pathway rates electrodiagnosis as optional and
      supportive, so it is curated here as an adjunct rather than a required step.
- name: Skeletal muscle MRI for disease burden
  description: >
    Skeletal muscle MRI documents muscle trophism and fatty degeneration and is used to
    map disease burden rather than to make the diagnosis. Whole-body protocols cover
    muscle groups a targeted study would miss, and quantitative muscle MRI is offered
    to late-onset patients as an addition to annual assessment. The supine position
    required for imaging is itself a hazard in patients with diaphragm weakness.
  diagnosis_term:
    preferred_term: skeletal muscle magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    A characteristic pattern of fatty replacement in paraspinal, pelvic, and thigh
    muscle supports the diagnosis and quantifies burden for follow-up.
  evidence:
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Whole-body MRI protocols are more inclusive than standard MRI protocols focusing on specific anatomical regions (e.g., paraspinal muscles, tongues, pelvis, thigh), enabling evaluation of relevant muscle groups beyond the pelvis and proximal lower extremities"
    explanation: Supports whole-body over targeted protocols for mapping LOPD muscle involvement.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Quantitative muscle MRI can be performed in late-onset patients in addition to annual investigations."
    explanation: >-
      Bounds the role - quantitative muscle MRI is an addition to, not a component of,
      the core annual LOPD assessment.
  notes: >-
    MetabERN cautions that the supine position needed for MRI may aggravate respiratory
    failure, which is a real constraint in exactly the LOPD patients whose burden most
    needs mapping.
- name: Newborn screening and the pre-symptomatic LOPD patient
  description: >
    Newborn screening measures GAA activity in dried blood spots and is designed to
    catch infantile-onset disease early enough for enzyme replacement therapy to work.
    Its consequence for LOPD is a distinct and growing group: children identified
    pre-symptomatically who cannot be told when, or whether, they will become
    symptomatic. Current screening cannot separate infantile-onset from late-onset
    disease, so these are patients in waiting requiring long-term monitoring.
  diagnosis_term:
    preferred_term: newborn screening for Pompe disease
    term:
      id: NCIT:C81178
      label: Newborn Screening
  results: >-
    An out-of-range newborn screen requires confirmatory enzyme and molecular testing;
    a confirmed child without infantile-onset features enters long-term surveillance
    rather than immediate treatment.
  evidence:
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Newborn screening (NBS) for Pompe disease is possible by measuring GAA activity in dried blood spots with different methods (tandem-mass spectrometry, fluorometry, microfluidics)"
    explanation: Establishes the assay basis of newborn screening.
  - reference: PMID:39482698
    reference_title: "The European reference network for metabolic diseases (MetabERN) clinical pathway recommendations for Pompe disease (acid maltase deficiency, glycogen storage disease type II)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the NBS screening in its current form cannot discern IOPD from LOPD. LOPD patients are thereby patients in waiting requiring long term follow-up and monitoring which may create uncertainty and a psychological burden for families"
    explanation: >-
      States the LOPD-specific consequence of newborn screening, which is the
      pre-symptomatic, screening-detected patient group this entry needs to represent.
- name: Urinary glucose tetrasaccharide as a second-tier and monitoring marker
  description: >
    Urinary glucose tetrasaccharide (Glc4/Hex4) is used as a second-tier test after a
    positive dried blood spot and as a follow-up marker. It is not specific to Pompe
    disease - urinary infection, acute pancreatitis, muscle trauma, and some cancers
    also raise it - and early-phase patients may excrete normal amounts, so it
    supports rather than establishes a diagnosis.
  diagnosis_term:
    preferred_term: urinary glucose tetrasaccharide measurement
    term:
      id: NCIT:C15419
      label: Disease Screening
  results: >-
    An elevated Glc4 supports the diagnosis after a positive screen and tracks response
    on therapy; a normal Glc4 does not exclude early LOPD.
  evidence:
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Urinary glucose tetrasaccharide (Glc4) could be used as a second-tier test after positive DBS, and its concentration seems to correlate with age of symptom onset, with more elevated levels in IOPD patients"
    explanation: Places Glc4 as a second-tier test and notes its correlation with onset age.
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "elevated urinary tetrasaccharide glucose levels are not specific to PD and may also be related to urinary infections, acute pancreatitis, muscular trauma, and some cancers"
    explanation: Bounds the specificity of the marker, which is why it is curated as second-tier rather than diagnostic.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "obtain electrolytes, BUN, creatinine, liver function tests, CK level, and urine total glucotetrasaccharide (Hex4) level"
    explanation: GeneReviews includes urinary Hex4 in routine follow-up laboratory monitoring.

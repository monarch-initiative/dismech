progression:
- phase: Clinically manifest disease
  age_range: >-
    Onset from the first to the seventh decade; median age at diagnosis 38 years,
    median age at death 56 years in untreated natural-history series
  notes: >-
    LOPD is insidious and lifelong. The wide onset range is the clinical expression
    of the residual-activity gradient set by the patient's leaky allele, and there
    is no spontaneous remission.
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at diagnosis is 38 years, while median age at death is 56 years"
    explanation: Provides the natural-history timing of diagnosis and death in late-onset disease.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LOPD can manifest from the first decade to as late as the seventh decade of life"
    explanation: GeneReviews states the age-of-onset range that defines the late-onset form.
- phase: Ventilator-dependent phase
  notes: >-
    A substantial minority progress to requiring ventilatory support, usually
    non-invasive and initially nocturnal.
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "of which the majority will receive non-invasive ventilation (NIV)"
    explanation: Documents that ventilatory support in LOPD is predominantly non-invasive.
pathophysiology:
- name: Leaky GAA Splicing and Partial Residual Enzyme Activity
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >
    The LOPD-defining lesion is partial rather than complete loss of acid
    alpha-glucosidase. The commonest LOPD allele, c.-32-13T>G (IVS1), sits in
    intron 1 and weakens the splice acceptor of GAA exon 2. Most transcripts from
    that allele are aberrantly spliced (partial or complete exon 2 skipping), but a
    low level of correctly spliced, fully functional transcript escapes. That
    residual activity - conventionally quoted as roughly 1-30% of normal, though see
    the caveat in the biochemical section and in notes - is what shifts the phenotype
    from infantile to late onset. In the great majority of LOPD patients the leaky
    allele is carried in trans with a second, more deleterious pathogenic variant, so
    the leaky allele is the one setting how much enzyme the patient makes.
  gene:
    preferred_term: GAA
    description: >-
      Acid alpha-glucosidase, the lysosomal enzyme that hydrolyzes alpha-1,4 and
      alpha-1,6 glycosidic bonds of glycogen.
    modifier: DECREASED
    term:
      id: hgnc:4065
      label: GAA
  molecular_functions:
  - preferred_term: acid alpha-glucosidase activity
    modifier: DECREASED
    term:
      id: GO:0004558
      label: alpha-1,4-glucosidase activity
  biological_processes:
  - preferred_term: GAA pre-mRNA splicing at the exon 2 acceptor
    modifier: DECREASED
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  genetic_context:
    gene:
      preferred_term: GAA
      term:
        id: hgnc:4065
        label: GAA
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Compound heterozygosity for the leaky c.-32-13T>G intron-1 splice variant and
      a second, more deleterious pathogenic GAA variant.
  evidence:
  - reference: PMID:28624228
    reference_title: "Antisense Oligonucleotides Promote Exon Inclusion and Correct the Common c.-32-13T>G GAA Splicing Variant in Pompe Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "which weakens the splice acceptor of GAA exon 2 and induces partial and complete exon 2 skipping. It also allows a low level of leaky wild-type splicing, leading to a childhood/adult phenotype."
    explanation: Establishes the leaky-splicing mechanism by which c.-32-13T>G yields residual enzyme and a late-onset phenotype.
  - reference: PMID:33972680
    reference_title: "Phenotypic implications of pathogenic variant types in Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of at least one splice site variant (c.546 G > C/p.T182 = , c.1076-22 T > G, c.2646 + 2 T > A, and the classic c.-32-13T > G variant) was associated with LOPD, while the presence of non-splice site variants on both alleles was associated with IOPD."
    explanation: Human genotype-phenotype data tying retention of a leaky splice allele to the late-onset phenotype.
  downstream:
  - target: Attenuated Lysosomal Glycogen Accumulation in Skeletal and Respiratory Muscle
    causal_link_type: DIRECT
    description: >-
      Residual GAA activity slows, but does not prevent, lysosomal glycogen
      accumulation, producing a decades-long rather than months-long storage course.
    evidence:
    - reference: PMID:28624228
      reference_title: "Antisense Oligonucleotides Promote Exon Inclusion and Correct the Common c.-32-13T>G GAA Splicing Variant in Pompe Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "It also allows a low level of leaky wild-type splicing, leading to a childhood/adult phenotype."
      explanation: Links the residual enzyme produced by leaky splicing to the attenuated childhood/adult disease course.
  - target: Relative Cardiac Sparing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Residual enzyme activity is sufficient to keep cardiomyocyte glycogen turnover
      below the threshold that produces infantile hypertrophic cardiomyopathy. The
      quantitative threshold itself has not been measured in human myocardium, so
      the link is recorded with unknown intermediates.
    evidence:
    - reference: PMID:33214927
      reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Late-onset Pompe disease (LOPD), caused by reduced rather than absent GAA, presents with a milder form, any time from 1 year to adulthood."
      explanation: Attributes the milder late-onset phenotype specifically to reduced rather than absent enzyme.
- name: Attenuated Lysosomal Glycogen Accumulation in Skeletal and Respiratory Muscle
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  mechanism_confidence: ESTABLISHED
  description: >
    Partial GAA activity permits slow lysosomal glycogen accumulation that is
    concentrated in skeletal muscle, including the respiratory muscles, rather than
    the generalized multisystem storage of infantile disease. The tissue selectivity
    reflects the very high glycogen flux of muscle relative to its residual
    degradative capacity, so muscle is the first compartment in which the reduced
    enzyme reserve is exhausted.

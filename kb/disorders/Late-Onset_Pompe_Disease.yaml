- name: Relative Cardiac Sparing
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >
    Absence of hypertrophic cardiomyopathy is a defining feature of LOPD and part of
    its formal case definition, not merely a statistical tendency. Residual GAA
    activity is sufficient to keep cardiomyocyte glycogen storage subclinical, so
    the cardiorespiratory collapse that kills untreated infants does not occur; the
    respiratory system, not the heart, becomes the life-limiting organ. This node is
    curated as a mechanistic contrast rather than as a claim that the myocardium is
    entirely normal - adult arteriopathy and rare conduction findings are described
    in the umbrella Pompe disease entry.
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "late-onset Pompe disease (LOPD) (i.e., individuals with onset before age 12 months without cardiomyopathy, and all individuals with onset after age 12 months)"
    explanation: GeneReviews makes absence of cardiomyopathy definitional for LOPD.
- name: Autophagic Buildup and Mistargeting of Endocytosed Recombinant Enzyme
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >
    Skeletal myofibers in Pompe disease develop large autophagic areas alongside
    glycogen-filled lysosomes. These areas trap endocytosed recombinant human GAA in
    a partially processed form so that it never reaches the lysosome, which is a
    mechanistic explanation for why enzyme replacement therapy is far more effective
    in cardiac than in skeletal muscle and why it slows rather than arrests the LOPD
    myopathy. Because LOPD is a decades-long disease treated for decades, this
    therapeutic ceiling is a defining clinical problem of the late-onset form.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  - preferred_term: endosomal transport of endocytosed enzyme
    modifier: DECREASED
    term:
      id: GO:0016197
      label: endosomal transport
  evidence:
  - reference: PMID:17008131
    reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Confocal microscopy of live single muscle fibers exposed to fluorescently labeled rhGAA indicates that a significant portion of the endocytosed enzyme in the KO was trapped as a partially processed form in the autophagic areas instead of reaching its target--the lysosomes."
    explanation: Demonstrates autophagic mistargeting of therapeutic enzyme in skeletal muscle fibers.
  - reference: PMID:17008131
    reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The therapy, which relies on receptor-mediated endocytosis of recombinant human GAA (rhGAA), appears to be effective in cardiac muscle, but less so in skeletal muscle."
    explanation: States the cardiac-versus-skeletal-muscle discrepancy in ERT response that this node explains.
  - reference: PMID:24383498
    reference_title: "The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions in juvenile- and adult-onset patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "numerous lysosomes and autolysosomes loaded with lipofuscin appear to be a hallmark of LOPD skeletal muscle"
    explanation: Human LOPD muscle biopsies confirm an autophagic-lysosomal lesion in the late-onset form itself, not only in the knockout mouse.
  downstream:
  - target: Incomplete Response to Enzyme Replacement Therapy
    causal_link_type: DIRECT
    description: >-
      Enzyme that never reaches the lysosome cannot clear stored glycogen.
    evidence:
    - reference: PMID:17008131
      reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings may explain why ERT often falls short of reversing the disease process and point toward new avenues for the development of pharmacological intervention."
      explanation: The authors propose autophagic mistargeting as the explanation for the incomplete response to enzyme replacement therapy.
- name: Pre-Vacuolar Metabolic Reprogramming of Myonuclei
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >
    Single-nucleus RNA sequencing combined with spatial transcriptomics of LOPD
    muscle biopsies shows that myofibers are transcriptionally abnormal before they
    are histologically abnormal. Fibers that are not yet vacuolated already show
    reduced glycolytic gene expression with increased lipid and amino-acid
    metabolism, upregulated autophagy genes, and downregulated ribosomal and
    mitochondrial programmes producing defective oxidative phosphorylation.
    Inflammation, apoptosis, and regeneration signatures appear only once
    vacuolation is established. This staging matters for LOPD specifically, because
    it identifies an early, possibly still-tractable metabolic derangement that
    precedes the structural damage enzyme replacement therapy cannot undo. The
    study reports only a "tendency" for therapy to restore the dysregulated
    metabolism, so reversibility is a hypothesis this node raises rather than a
    result it records.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Slow (type I) muscle fiber
    term:
      id: CL:0000189
      label: slow muscle cell
  - preferred_term: Muscle-infiltrating macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  - preferred_term: lipid metabolic process
    modifier: INCREASED
    term:
      id: GO:0006629
      label: lipid metabolic process
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of the genes involved in glycolysis was reduced, whereas the expression of the genes involved in the metabolism of lipids and amino acids was increased in non-vacuolated fibres, indicating early metabolic abnormalities."
    explanation: Demonstrates metabolic reprogramming in histologically unaffected LOPD myofibers, before vacuolation.
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upregulation of genes associated with inflammation, apoptosis and muscle regeneration was observed only in vacuolated fibres."
    explanation: Separates the later inflammatory/degenerative programme from the earlier metabolic one, which is the staging claim of this node.
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, enzyme replacement therapy (the only available therapy for the disease) showed a tendency to restore dysregulated metabolism, particularly within slow fibres."
    explanation: Bounds the reversibility claim - the authors report a tendency, not a demonstrated restoration, which is why this node is PROVISIONAL.
  downstream:
  - target: Progressive Limb-Girdle and Axial Myofiber Degeneration
    causal_link_type: DIRECT
    description: >-
      Metabolically compromised fibers progress to vacuolation, inflammation,
      apoptosis, and replacement by fat.

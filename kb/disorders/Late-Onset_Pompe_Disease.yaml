- name: GeneReviews onset/cardiomyopathy case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    GeneReviews partitions Pompe disease by age of onset together with the presence
    or absence of cardiomyopathy. LOPD is defined as onset after age 12 months, or
    onset before 12 months without cardiomyopathy. The cardiomyopathy criterion, not
    age alone, is what separates the two forms at the boundary.
  evidence:

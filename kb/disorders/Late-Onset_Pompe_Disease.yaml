      explanation: Links the storage lesion to the transcriptional metabolic derangement of LOPD myonuclei.
  - target: Progressive Limb-Girdle and Axial Myofiber Degeneration
    causal_link_type: DIRECT
    description: >-
      Cumulative storage and autophagic damage destroy contractile architecture in
      proximal lower-limb and paraspinal muscle.
    evidence:
    - reference: PMID:33214927
      reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It causes a progressive proximal myopathy, accompanied by respiratory muscle weakness, which can lead to ventilatory failure."
      explanation: Connects muscle-cell glycogen accumulation to the progressive proximal myopathy of LOPD.
  - target: Phrenic Motor Unit Failure
    causal_link_type: DIRECT
    description: >-
      Storage in the diaphragm undermines the principal muscle of inspiration.
    evidence:
    - reference: PMID:20301438
      reference_title: "Pompe Disease."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Respiratory insufficiency progressing to respiratory failure is a significant cause of morbidity and mortality."
      explanation: GeneReviews records respiratory muscle involvement as a principal consequence of late-onset storage disease.
- name: Relative Cardiac Sparing
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >
    Absence of hypertrophic cardiomyopathy is a defining feature of LOPD and part of
    its formal case definition, not merely a statistical tendency. Residual GAA
    activity is sufficient to keep cardiomyocyte glycogen storage subclinical, so
    the cardiorespiratory collapse that kills untreated infants does not occur; the
    respiratory system, not the heart, becomes the life-limiting organ. This node is
    curated as a mechanistic contrast rather than as a claim that the myocardium is
    entirely normal - adult arteriopathy and rare conduction findings are described
    in the umbrella Pompe disease entry.
  cell_types:
  - preferred_term: Cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "late-onset Pompe disease (LOPD) (i.e., individuals with onset before age 12 months without cardiomyopathy, and all individuals with onset after age 12 months)"
    explanation: GeneReviews makes absence of cardiomyopathy definitional for LOPD.
- name: Autophagic Mistargeting of Endocytosed Recombinant Enzyme
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >
    Skeletal myofibers in Pompe disease develop large autophagic areas alongside
    glycogen-filled lysosomes. These areas trap endocytosed recombinant human GAA in
    a partially processed form so that it never reaches the lysosome, which is a
    mechanistic explanation for why enzyme replacement therapy is far more effective
    in cardiac than in skeletal muscle and why it slows rather than arrests the LOPD
    myopathy. Because LOPD is a decades-long disease treated for decades, this
    therapeutic ceiling is a defining clinical problem of the late-onset form.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  - preferred_term: endosomal transport of endocytosed enzyme
    modifier: DECREASED
    term:
      id: GO:0016197
      label: endosomal transport
  evidence:
  - reference: PMID:17008131
    reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Confocal microscopy of live single muscle fibers exposed to fluorescently labeled rhGAA indicates that a significant portion of the endocytosed enzyme in the KO was trapped as a partially processed form in the autophagic areas instead of reaching its target--the lysosomes."
    explanation: Demonstrates autophagic mistargeting of therapeutic enzyme in skeletal muscle fibers.
  - reference: PMID:17008131
    reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The therapy, which relies on receptor-mediated endocytosis of recombinant human GAA (rhGAA), appears to be effective in cardiac muscle, but less so in skeletal muscle."
    explanation: States the cardiac-versus-skeletal-muscle discrepancy in ERT response that this node explains.
  - reference: PMID:24383498
    reference_title: "The value of muscle biopsies in Pompe disease: identifying lipofuscin inclusions in juvenile- and adult-onset patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "numerous lysosomes and autolysosomes loaded with lipofuscin appear to be a hallmark of LOPD skeletal muscle"
    explanation: Human LOPD muscle biopsies confirm an autophagic-lysosomal lesion in the late-onset form itself, not only in the knockout mouse.
  - reference: PMID:38785980
    reference_title: Failure of Autophagy in Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As in mouse models, autophagic buildup, filled with potentially toxic ubiquitinated protein aggregates, glycogen particles, autophagy substrate p62/SQSTM1, and lipofuscin (an indicator of oxidative damage and mitochondrial dysfunction), is a prominent feature in muscle from patients with the disease; in some fibers, particularly from biopsies of adult patients, the enlarged lysosomes in the surrounding buildup-free areas look like innocent bystanders compared to the autophagic pathology"
    explanation: >-
      States that the autophagic buildup, not the enlarged lysosome, is the dominant
      lesion in patient muscle, and specifically in biopsies from adult patients - which
      is the late-onset population this entry covers. It also names the p62/SQSTM1 and
      lipofuscin content of the buildup.
  - reference: PMID:38785980
    reference_title: Failure of Autophagy in Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, a major mechanism underlying autophagic buildup is an impairment of autophagosomal–lysosomal fusion, a condition known as autophagic block."
    explanation: >-
      Supplies the mechanism by which the buildup forms and therefore why endocytosed
      enzyme delivered into that compartment does not reach a functional lysosome.
  - reference: PMID:35682977
    reference_title: "Isogenic GAA-KO Murine Muscle Cell Lines Mimicking Severe Pompe Mutations as Preclinical Models for the Screening of Potential Gene Therapy Strategies."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All of the generated GAA-KO cells lacked GAA activity and presented an increased autophagy and increased glycogen content by means of myotube differentiation as well as the downregulation of mannose 6-phosphate receptors (CI-MPRs)"
    explanation: >-
      Isogenic GAA-null myotubes reproduce both the increased autophagy of this node and
      downregulation of the CI-MPR receptor that recombinant enzyme depends on for uptake,
      a second route by which delivered enzyme fails to reach the lysosome.
  downstream:
  - target: Incomplete Response to Enzyme Replacement Therapy
    causal_link_type: DIRECT
    description: >-
      Enzyme that never reaches the lysosome cannot clear stored glycogen.
    evidence:
    - reference: PMID:17008131
      reference_title: "Autophagy and mistargeting of therapeutic enzyme in skeletal muscle in Pompe disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings may explain why ERT often falls short of reversing the disease process and point toward new avenues for the development of pharmacological intervention."
      explanation: The authors propose autophagic mistargeting as the explanation for the incomplete response to enzyme replacement therapy.
- name: Pre-Vacuolar Metabolic Reprogramming of Myonuclei
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >
    Single-nucleus RNA sequencing combined with spatial transcriptomics of LOPD
    muscle biopsies shows that myofibers are transcriptionally abnormal before they
    are histologically abnormal. Fibers that are not yet vacuolated already show
    reduced glycolytic gene expression with increased lipid and amino-acid
    metabolism, upregulated autophagy genes, and downregulated ribosomal and
    mitochondrial programmes producing defective oxidative phosphorylation.
    Inflammation, apoptosis, and regeneration signatures appear only once
    vacuolation is established. This staging matters for LOPD specifically, because
    it identifies an early, possibly still-tractable metabolic derangement that
    precedes the structural damage enzyme replacement therapy cannot undo. The
    study reports only a "tendency" for therapy to restore the dysregulated
    metabolism, so reversibility is a hypothesis this node raises rather than a
    result it records.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Slow (type I) muscle fiber
    term:
      id: CL:0000189
      label: slow muscle cell
  - preferred_term: Muscle-infiltrating macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  - preferred_term: lipid metabolic process
    modifier: INCREASED
    term:
      id: GO:0006629
      label: lipid metabolic process
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The expression of the genes involved in glycolysis was reduced, whereas the expression of the genes involved in the metabolism of lipids and amino acids was increased in non-vacuolated fibres, indicating early metabolic abnormalities."
    explanation: Demonstrates metabolic reprogramming in histologically unaffected LOPD myofibers, before vacuolation.
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upregulation of genes associated with inflammation, apoptosis and muscle regeneration was observed only in vacuolated fibres."
    explanation: Separates the later inflammatory/degenerative programme from the earlier metabolic one, which is the staging claim of this node.
  - reference: PMID:39045638
    reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, enzyme replacement therapy (the only available therapy for the disease) showed a tendency to restore dysregulated metabolism, particularly within slow fibres."
    explanation: Bounds the reversibility claim - the authors report a tendency, not a demonstrated restoration, which is why this node is PROVISIONAL.
  - reference: PMID:33799647
    reference_title: "Muscle Proteomic Profile before and after Enzyme Replacement Therapy in Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in oxidative metabolism, muscle contractile protein regulation, cytoskeletal rearrangement, and membrane reorganization persisted."
    explanation: >-
      Independent corroboration by a different modality - muscle proteomics rather than
      single-nucleus transcriptomics - that the oxidative-metabolism defect of this node
      is real and survives a year of enzyme replacement therapy.
  - reference: PMID:33799647
    reference_title: "Muscle Proteomic Profile before and after Enzyme Replacement Therapy in Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic changes, ER stress and UPR (unfolded protein response) contribute to muscle proteostasis dysregulation with active membrane remodeling (high levels of LC3BII/LC3BI) and accumulation of p62, suggesting imbalance in the autophagic process."
    explanation: >-
      Supplies the p62 and LC3 protein-level readout of the autophagic imbalance that the
      transcriptomic study infers from autophagy gene upregulation.
  downstream:
  - target: Progressive Limb-Girdle and Axial Myofiber Degeneration
    causal_link_type: DIRECT
    description: >-
      Metabolically compromised fibers progress to vacuolation, inflammation,
      apoptosis, and replacement by fat.
    evidence:
    - reference: PMID:39045638
      reference_title: "Decoding the muscle transcriptome of patients with late-onset Pompe disease reveals markers of disease progression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We observed an increase in the proportion of slow and regenerative muscle fibres and macrophages in LOPD muscles."
      explanation: Documents the shift toward regenerative fibers and macrophage infiltration that accompanies progression to overt degeneration.
- name: Progressive Limb-Girdle and Axial Myofiber Degeneration
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >
    Chronic storage and autophagic injury destroy myofibers, which are replaced by
    fat. The distribution is characteristically limb-girdle and axial, with early
    involvement of the psoas and paraspinal muscles; quantitative fat fraction on
    lumbar MRI correlates with strength, walking distance, stair climbing and supine
    spirometry, and continues to rise during enzyme replacement therapy.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:29315315
    reference_title: "Quantification of intramuscular fat in patients with late-onset Pompe disease by conventional magnetic resonance imaging for the long-term follow-up of enzyme replacement therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A significant increase in the MR-derived fat fraction of the psoas muscle was found between baseline and follow-up 1 (P = 0.016), as was a significant decrease in the performance on the 6-minute walk test (P = 0.006) and 4-step stair climb test (P = 0.034)"
    explanation: Shows progressive fatty replacement of proximal/axial muscle with concurrent functional decline during ERT.
  downstream:
  - target: Progressive proximal muscle weakness
    causal_link_type: DIRECT
    description: >-
      Loss of contractile tissue in limb-girdle and axial muscle produces the
      characteristic LOPD weakness pattern.
    evidence:
    - reference: PMID:29315315
      reference_title: "Quantification of intramuscular fat in patients with late-onset Pompe disease by conventional magnetic resonance imaging for the long-term follow-up of enzyme replacement therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Measurements derived from the quantitative method correlated well with Medical Research Council scores of muscle strength, with moderate correlations found for the 6-minute walk test, the 4-step stair climb test, and spirometry in the supine position."
      explanation: Fatty replacement of proximal and paraspinal muscle correlates with measured strength and function, linking the tissue lesion to the weakness phenotype.
- name: Phrenic Motor Unit Failure
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >
    Diaphragm weakness in LOPD is disproportionate to limb weakness and is the
    proximate cause of nocturnal hypoventilation and ultimately of ventilatory
    failure. Neurophysiological study of treated LOPD patients found that those with
    respiratory failure had absent or severely reduced phrenic nerve compound muscle
    action potentials and diaphragm EMG showing neurogenic as well as myopathic
    changes, implicating spinal phrenic motor neuron dysfunction alongside myofiber
    disease. Because intravenous recombinant enzyme does not cross the blood-brain
    barrier, a motor neuron contribution would explain residual respiratory decline
    on enzyme replacement therapy. The motor neuron arm is curated as PROVISIONAL:
    the supporting series is small (eight patients) and calls for confirmation.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Phrenic motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: diaphragm
    term:
      id: UBERON:0001103
      label: diaphragm
  evidence:
  - reference: PMID:38653115
    reference_title: "Diaphragm weakness in late-onset Pompe disease: A complex interplay between lower motor neuron and muscle fibre degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diaphragm needle EMG revealed both myopathic and neurogenic changes in 3 (60%) and myopathic potentials in 1 patient."
    explanation: Provides the electrophysiological observation of combined neurogenic and myopathic diaphragm involvement.
  - reference: PMID:38653115
    reference_title: "Diaphragm weakness in late-onset Pompe disease: A complex interplay between lower motor neuron and muscle fibre degeneration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study provide new insights regarding respiratory mechanisms in LOPD, suggesting a contribution of spinal phrenic motor neuron dysfunction for diaphragm weakness."
    explanation: The authors themselves frame the phrenic motor neuron contribution as a suggestion requiring confirmation, which is why this node is PROVISIONAL.
  - reference: PMID:42074341
    reference_title: "Pompe Disease: Pathogenesis, Molecular Mechanisms, Neurological Aspects, Diagnostics and Modern Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "limited penetration across the blood-brain barrier (BBB), resulting in persistent central nervous system involvement, and immune responses against the infused enzyme"
    explanation: >-
      Supports the pharmacological half of this node's argument - intravenous recombinant
      enzyme does not reach the central nervous system, so a phrenic motor neuron
      contribution would not be corrected by enzyme replacement therapy.
  downstream:
  - target: Nocturnal hypoventilation and sleep-disordered breathing
    causal_link_type: DIRECT
    description: >-
      Inspiratory muscle failure is expressed first during sleep, when accessory
      muscle recruitment falls and ventilation depends on the diaphragm.
    evidence:
    - reference: PMID:33214927
      reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Diaphragm weakness leads to nocturnal hypoventilation, which can result in sleep disruption."
      explanation: States the diaphragm-to-nocturnal-hypoventilation causal step directly.
  - target: Respiratory insufficiency due to muscle weakness
    causal_link_type: DIRECT
    description: >-
      Progressive diaphragm failure produces daytime hypercapnic respiratory failure,
      the leading cause of death in untreated LOPD.
    evidence:
    - reference: PMID:33214927
      reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In untreated LOPD, the most common cause of death is respiratory failure."
      explanation: Establishes ventilatory failure as the terminal consequence of respiratory muscle weakness in untreated LOPD.
- name: Incomplete Response to Enzyme Replacement Therapy
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >
    Enzyme replacement therapy changes the trajectory of LOPD but does not normalize
    it. Walking distance and forced vital capacity improve modestly relative to
    placebo in the short term, yet muscle fat fraction continues to increase, some
    patients still progress to ventilatory support, and the effect on
    sleep-disordered breathing is undocumented. This residual disease burden is a
    mechanistic consequence of the autophagic mistargeting node and, possibly, of the
    motor neuron arm of diaphragm weakness, which intravenous enzyme cannot reach.
  evidence:
  - reference: PMID:38653115
    reference_title: "Diaphragm weakness in late-onset Pompe disease: A complex interplay between lower motor neuron and muscle fibre degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-onset Pompe disease (LOPD) patients may still need ventilation support at some point of their disease course, despite regular recombinant human alglucosidase alfa treatment."
    explanation: Documents residual progression to ventilatory support despite ongoing enzyme replacement therapy.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Whilst disease-modifying enzyme replacement therapy (ERT) delays progression of locomotor dysfunction and prolongs life, its effect on respiratory function and SDB remains unclear."
    explanation: States that the respiratory benefit of ERT in LOPD is not established, bounding the claim of therapeutic benefit.
  - reference: PMID:33799647
    reference_title: "Muscle Proteomic Profile before and after Enzyme Replacement Therapy in Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "178 proteins were changed in abundance in LOPD patients, 47 of them recovered normal level after ERT. Defects in oxidative metabolism, muscle contractile protein regulation, cytoskeletal rearrangement, and membrane reorganization persisted."
    explanation: Quantifies the molecular residue of disease in LOPD muscle after a year of enzyme replacement therapy - roughly a quarter of the altered proteome normalizes.
phenotypes:
- category: Musculoskeletal
  name: Progressive proximal muscle weakness
  description: >
    Slowly progressive limb-girdle weakness with lower-limb predominance is the
    cardinal motor manifestation of LOPD, and may progress to wheelchair use.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LOPD can manifest from the first decade to as late as the seventh decade of life with progressive proximal muscle weakness primarily affecting the lower limbs, which may require use of a wheelchair."
    explanation: GeneReviews identifies progressive lower-limb-predominant proximal weakness as the defining LOPD motor phenotype.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It causes a progressive proximal myopathy, accompanied by respiratory muscle weakness, which can lead to ventilatory failure."
    explanation: Confirms progressive proximal myopathy as the core LOPD phenotype.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients will present with a lower limb girdle and truncal muscle weakness pattern"
    explanation: Frequency evidence - "most patients" maps to the VERY_FREQUENT band (80-100%).
- category: Respiratory
  name: Respiratory insufficiency due to muscle weakness
  description: >
    Respiratory muscle weakness, principally of the diaphragm, progresses to
    ventilatory failure and is the leading cause of death in untreated LOPD. In
    roughly a third of patients respiratory symptoms are the presenting complaint,
    ahead of limb weakness.
  phenotype_term:
    preferred_term: Respiratory insufficiency due to muscle weakness
    term:
      id: HP:0002747
      label: Respiratory insufficiency due to muscle weakness
    clinical_course: PROGRESSIVE
  frequency: FREQUENT
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It causes a progressive proximal myopathy, accompanied by respiratory muscle weakness, which can lead to ventilatory failure. In untreated LOPD, the most common cause of death is respiratory failure."
    explanation: Establishes respiratory muscle weakness progressing to ventilatory failure as the dominant cause of death in untreated LOPD.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Respiratory insufficiency progressing to respiratory failure is a significant cause of morbidity and mortality."
    explanation: GeneReviews confirms respiratory insufficiency as a major source of LOPD morbidity and mortality.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half will suffer respiratory involvement during the course of their illness"
    explanation: Frequency evidence - "approximately half" falls in the FREQUENT band (30-79%).
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One-third of patients present with respiratory symptoms as their first manifestation of the illness"
    explanation: Supports the description's claim that respiratory symptoms are the presenting complaint in about a third of patients.
- category: Respiratory
  name: Nocturnal hypoventilation and sleep-disordered breathing
  description: >
    Diaphragm weakness is expressed earliest during sleep, so sleep-disordered
    breathing and nocturnal hypoventilation typically precede overt daytime
    respiratory failure and are accompanied by sleep disruption, excessive daytime
    sleepiness, and reduced health-related quality of life.
  phenotype_term:
    preferred_term: Nocturnal hypoventilation
    term:
      id: HP:0002877
      label: Nocturnal hypoventilation
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diaphragm weakness leads to nocturnal hypoventilation, which can result in sleep disruption."
    explanation: Directly links diaphragm weakness to nocturnal hypoventilation in LOPD.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients suffering from respiratory compromise may present with symptoms of sleep-disordered breathing (SDB) before overt signs of respiratory failure."
    explanation: Supports sleep-disordered breathing as an early, pre-failure respiratory manifestation.
- category: Musculoskeletal
  name: Axial and paraspinal muscle weakness
  description: >
    Weakness of the paraspinal and other axial muscles is a characteristic feature of
    the LOPD weakness pattern, running alongside the limb-girdle involvement rather
    than following it, and it is the substrate for the scoliosis and lumbar
    hyperlordosis seen on examination.
  phenotype_term:
    preferred_term: Axial and paraspinal muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients will present with a lower limb girdle and truncal muscle weakness pattern"
    explanation: Records truncal (axial) weakness as part of the presenting LOPD weakness pattern.
  - reference: PMID:33799647
    reference_title: "Muscle Proteomic Profile before and after Enzyme Replacement Therapy in Late-Onset Pompe Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-onset Pompe disease (LOPD) is characterized by progressive proximal and axial muscle weakness and atrophy, causing respiratory failure."
    explanation: >-
      Independently characterizes axial weakness, alongside proximal weakness, as a
      defining feature of LOPD.
- category: Musculoskeletal
  name: Scoliosis
  description: >
    Axial and paraspinal muscle involvement produces scoliosis, which is frequent in
    late-onset disease and is one of the manifestations GeneReviews places under
    routine assessment at every visit.
  phenotype_term:
    preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  frequency: FREQUENT
  evidence:
  - reference: PMID:37759679
    reference_title: A Comprehensive Update on Late-Onset Pompe Disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For example, degeneration of bones and joints as a consequence of muscle weakness is a frequent finding, as scoliosis, kyphosis, and hyperlordosis are usually linked to abdominal and hip extensor weakness"
    explanation: >-
      Frequency evidence - an LOPD review calls the skeletal consequence of muscle
      weakness a frequent finding and names scoliosis as one of them, which is the basis
      for the FREQUENT band. It also states the mechanism this phenotype's description
      asserts, namely that the deformity follows trunk and hip extensor weakness.
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subsequent secondary musculoskeletal complications include contractures, limb and spinal deformities (winging scapula, scoliosis, lumbar hyperlordosis, and rigid spine syndrome), and osteopenia/osteoporosis"
    explanation: >-
      The neurology expert consensus independently lists scoliosis among the expected
      secondary musculoskeletal complications of LOPD.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "assess for scoliosis; monitor for evidence of aspiration and respiratory insufficiency"
    explanation: >-
      Scoliosis is under active surveillance at every visit, supporting it as a
      recurrent rather than incidental manifestation.
- category: Cardiovascular
  name: Dilatation of the ascending thoracic aorta
  description: >
    A minority of adults with LOPD develop an arteriopathy whose best-characterized
    expression is dilatation of the ascending thoracic aorta. It is distinct from the
    hypertrophic cardiomyopathy of infantile-onset disease - the LOPD myocardium is
    typically spared - and it is specific enough to LOPD that GeneReviews adds aortic
    assessment to the annual echocardiogram for this group. Glycogen storage in
    vascular smooth muscle is the proposed substrate, but the mechanism is not
    established here and is deliberately not asserted.
  phenotype_term:
    preferred_term: Dilatation of the ascending thoracic aorta
    term:
      id: HP:0012727
      label: Thoracic aortic aneurysm
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Some adults have developed arteriopathy, including dilatation of the ascending thoracic aorta."
    explanation: >-
      GeneReviews names ascending thoracic aortic dilatation as an adult (late-onset)
      manifestation of Pompe disease.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "echocardiography (to include assessment for aortic dilatation in those with LOPD)"
    explanation: >-
      The surveillance recommendation is LOPD-specific, which is why this phenotype is
      curated on the late-onset entry rather than left to the umbrella entry.
- category: Gastrointestinal
  name: Dysphagia
  description: >
    Bulbar and tongue involvement produces difficulty swallowing, which patients may
    report indirectly as weight loss. It is the reason a videofluoroscopic swallow
    study and monitoring for aspiration form part of LOPD follow-up.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They may also report weight loss, due to difficulty swallowing"
    explanation: Records difficulty swallowing among the presenting symptoms of LOPD.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case reports also suggest LOPD can cause bulbar dysfunction"
    explanation: >-
      Identifies bulbar dysfunction as the mechanism, and bounds it - the supporting
      literature is case reports, so no frequency band is assigned here.
- category: Musculoskeletal
  name: Reduced bone mineral density
  description: >
    Low bone density and osteoporosis are recognized LOPD complications, driven by
    reduced mechanical loading from the myopathy, and are managed with standard
    osteoporosis treatment. Annual DXA screening is recommended specifically in the
    late-onset group.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  evidence:
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Standard treatment for arteriopathy, muscle weakness, scoliosis, osteoporosis, and hearing loss."
    explanation: >-
      GeneReviews lists osteoporosis among the Pompe disease manifestations requiring
      management, establishing it as a curatable phenotype rather than an incidental
      comorbidity.
  - reference: PMID:20301438
    reference_title: "Pompe Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least annually, bone mineral density screening (DXA) in those with LOPD"
    explanation: >-
      The annual DXA recommendation is written specifically for the late-onset group,
      which is why reduced bone density is curated here.
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Subsequent secondary musculoskeletal complications include contractures, limb and spinal deformities (winging scapula, scoliosis, lumbar hyperlordosis, and rigid spine syndrome), and osteopenia/osteoporosis"
    explanation: >-
      Places osteopenia/osteoporosis among the expected secondary musculoskeletal
      complications of LOPD, and identifies it as secondary to the myopathy rather than
      a primary bone defect.
- category: Musculoskeletal
  name: Exercise intolerance
  description: >
    Reduced exercise tolerance, often reported as difficulty climbing stairs or rising
    from a chair, is typically the earliest functional complaint in LOPD and - with
    hyperCKemia - is one of the red flags that should trigger GAA testing.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:37265469
    reference_title: "Expert opinion on the diagnostic odyssey and management of late-onset Pompe disease: a neurologist's perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "restrictive respiratory insufficiency with hyperCKemia and/or exercise intolerance as the red flag symptoms/signs that raise the index of suspicion for LOPD diagnosis"
    explanation: >-
      The neurology expert consensus names exercise intolerance as a red-flag sign for
      LOPD, which is both the phenotype claim and its diagnostic significance.
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients will initially report complaints suggestive of progressively reducing muscle strength, such as a difficulty with physical exercise, difficulty climbing stairs or standing from a chair."
    explanation: Places reduced exercise capacity as the initial functional complaint in LOPD.
- category: Constitutional
  name: Myalgia and fatigue
  description: >
    Muscle aches and tiredness accompany the early weakness and are part of why LOPD
    is commonly mistaken for a non-specific or functional complaint before enzyme
    testing is considered.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  evidence:
  - reference: PMID:33214927
    reference_title: "Respiratory failure and sleep-disordered breathing in late-onset Pompe disease: a narrative review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is likely to be associated with muscle aches and tiredness."
    explanation: >-
      Records myalgia (muscle aches) and fatigue (tiredness) as accompaniments of the
      early LOPD weakness. Fatigue is described in the same sentence and is captured in

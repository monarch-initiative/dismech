    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antinuclear antibody was positive in all cases, whereas anti-dsDNA was negative with normal levels of complement C3, C4 and decreased CH50 activity."
    explanation: >-
      The diagnostic complement pattern in three patients.
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young patients with cutaneous lesions resembling SLE, early onset of autoimmunity, with normal C3, C4, elevated ANAs, and negative anti-dsDNA, C1q deficiency should be suspected and complement screening tests should be done."
    explanation: >-

clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Outcome ranges widely. About a fifth of reported patients have died,
    nearly all before the age of 20, mostly from severe infection in early
    childhood or from renal and central nervous system lupus, and most
    survivors need long-term immunosuppression or transplantation. A subset,
    including some patients with infections only or no symptoms, has an
    excellent prognosis, and at least half are expected to reach middle age.
  evidence:
  - reference: PMID:26119135
    reference_title: "Marked variability in clinical presentation and outcome of patients with C1q immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total 9 (20%) of the C1q deficient individuals had died. All except for one died before the age of 20 years."
    explanation: >-
      Mortality in an international follow-up survey of 45 patients.
  - reference: PMID:26119135
    reference_title: "Marked variability in clinical presentation and outcome of patients with C1q immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the largest phenotypic data set on C1q deficiency to date, revealing high variance; with high mortality but also a subset of patients with an excellent prognosis."
    explanation: >-
      The same survey characterises the outcome as highly variable, which is
      why the burden is recorded as variable rather than uniformly high.
animal_models:
- name: C1qa knockout mouse
  species: Mouse
  genotype: C1qa(-/-)
  publication: PMID:9590289
  description: >-
    Gene-targeted C1qa-deficient mice develop autoantibodies and
    immune-complex glomerulonephritis with accumulation of apoptotic bodies,
    with penetrance strongly dependent on genetic background.
  modeled_mechanisms:
  - target: Defective Clearance of Apoptotic Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Apoptotic bodies accumulate in glomeruli of C1q-deficient mice.
    limitations: >-
      Apoptotic cell clearance is measured in mouse glomeruli and peritoneum;
      an equivalent defect has not been measured directly in patients.
    evidence:
    - reference: PMID:9590289
      reference_title: "Homozygous C1q deficiency causes glomerulonephritis associated with multiple apoptotic bodies."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Among mice without glomerulonephritis, there were significantly greater numbers of glomerular apoptotic bodies in C1q-deficient mice compared with controls."
      explanation: >-
        Supports the model as informative for apoptotic cell clearance.
  - target: Loss of Tolerance to Nuclear Autoantigens
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Autoantibodies and glomerulonephritis develop, but only on some genetic
      backgrounds.
    limitations: >-
      On the C57BL/6 background C1q deficiency produces no autoimmune
      phenotype, whereas most human patients develop autoimmunity. The cited
      studies do not report the skin and central nervous system disease or the
      interferon signature that dominate the human phenotype.
    evidence:
    - reference: PMID:11859149
      reference_title: "C1q deficiency and autoimmunity: the effects of genetic background on disease expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In C1q-deficient C57BL/6 mice, no evidence of an autoimmune phenotype was found"
      explanation: >-
        Shows the background dependence that limits fidelity.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Because C1q is made by monocyte-derived cells, allogeneic HSCT restores C1q
    production and classical pathway function and can cure the disease. In a
    multicentre series of 18 patients transplanted mainly for refractory
    autoimmunity, autoimmune features resolved in 11, but five died of
    transplant-related complications and survival was worst in patients with
    renal or neurological involvement, so patient selection is critical.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Absent or Dysfunctional C1q
    treatment_effect: RESTORES
    description: >-
      Donor-derived monocytes and macrophages produce normal C1q.
  evidence:
  - reference: PMID:39470951
    reference_title: "Hematopoietic Stem Cell Transplantation for C1q Deficiency: A Study on Behalf of the EBMT Inborn Errors Working Party."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In eleven patients HSCT led to resolution of autoimmune features and discontinuation of immunosuppressive treatments (follow-up time range 3-84 months). Five patients died due to transplant-related complications."
    explanation: >-
      Outcome of HSCT in the largest series, including its mortality.
  - reference: PMID:26516671
    reference_title: "Allogeneic Hematopoietic Stem Cell Transplantation in the Treatment of Human C1q Deficiency: The Karolinska Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 9-year-old boy and a 12-year-old girl with refractory SLE restored C1q production after allo-HSCT. This resulted in normal functional properties of the classical complement pathway followed by reduced severity of SLE symptoms."
    explanation: >-
      HSCT restored C1q production and classical pathway function.
  - reference: PMID:33000368
    reference_title: "Bone marrow transplantation from a human leukocyte antigen-mismatched unrelated donor in a case with C1q deficiency associated with refractory systemic lupus erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete donor chimerism has been maintained for 2 years after transplantation, leading to the restoration of C1q levels and the resolution of SLE symptoms. Normal C1q mRNA expression was observed in CD14 + cells."
    explanation: >-
      C1q restored from donor CD14-positive monocytes after transplantation.
  - reference: PMID:15517607
    reference_title: "Restoration of C1q levels by bone marrow transplantation attenuates autoimmune disease associated with C1q deficiency in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, a significant delay in the development of autoantibodies and glomerulonephritis was observed in C1qa(-/-) mice reconstituted with wild-type BMC, and the impaired clearance of apoptotic cells, previously described in C1qa(-/-) mice, was rectified."
    explanation: >-
      Bone marrow transplantation corrects C1q deficiency and attenuates its
      autoimmunity in mice.
- name: Fresh Frozen Plasma
  description: >-
    Regular fresh frozen plasma infusion supplies C1q and has controlled
    refractory cutaneous and systemic disease in several reported patients,
    allowing corticosteroid reduction. The effect is temporary, so infusions
    must be repeated.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Absent or Dysfunctional C1q
    treatment_effect: RESTORES
    description: >-
      Transiently supplies circulating C1q.
  evidence:
  - reference: PMID:29113537
    reference_title: "Systemic lupus erythematosus with C1q deficiency: treatment with fresh frozen plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All symptoms of all three cases improved by daily fresh frozen plasma (FFP) infusions, and once cutaneous lesions subsided, the infusions were reduced to a frequency that would prevent the flare up of the symptoms."
    explanation: >-
      Plasma infusion controlled disease in three patients.
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular fresh frozen plasma infusions keep her disease under control, and we were able to reduce the dose of corticosteroids."
    explanation: >-
      Plasma infusion allowed steroid reduction.
  - reference: PMID:24160257
    reference_title: "The identification of a novel splicing mutation in C1qB in a Japanese family with C1q deficiency: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because treatment with steroids and immunosuppressive drugs was not effective, we commenced use of fresh frozen plasma to provide C1q supplements."
    explanation: >-
      Plasma used as C1q replacement after failure of immunosuppression.
- name: Type I Interferon Receptor Blockade
  description: >-
    Anifrolumab, a monoclonal antibody against the type I interferon receptor,
    resolved refractory mucocutaneous disease and allowed corticosteroid
    withdrawal in a single reported child.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anifrolumab
      term:
        id: NCIT:C166658
        label: Anifrolumab
  target_mechanisms:
  - target: Type I Interferon Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Blocks signalling through the type I interferon receptor.
  evidence:
  - reference: PMID:42597478
    reference_title: "Interferon-targeted therapy with anifrolumab in monogenic pediatric systemic lupus erythematosus due to C1q deficiency: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She showed significant clinical improvement and full recovery of mucocutaneous lesions, restoration of laboratory parameters and successful discontinuation of corticosteroids after the seventh monthly infusion."
    explanation: >-
      Response to anifrolumab in one C1QA-deficient child.
- name: JAK Inhibitors
  description: >-
    JAK inhibitors have been tried to block interferon signalling, with
    variable results: one of three reported patients responded.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: JAK inhibitor
      term:
        id: NCIT:C172200
        label: JAK Inhibitor
  target_mechanisms:
  - target: Type I Interferon Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Blocks JAK-dependent interferon receptor signalling.
  evidence:
  - reference: PMID:39196411
    reference_title: "Hereditary C1q Deficiency is Associated with Type 1 Interferon-Pathway Activation and a High Risk of Central Nervous System Inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients were treated with Janus-kinase inhibitors (JAKi), with variable outcome; one displaying an apparently favourable response in respect of cutaneous and neurological features, and two others experiencing persistent disease despite JAKi therapy."
    explanation: >-
      Mixed outcome of JAK inhibition in three patients; supports its use as a
      treatment tried in this disease, not established efficacy.
- name: Corticosteroids and Conventional Immunosuppression
  description: >-
    Corticosteroids, hydroxychloroquine and steroid-sparing agents are used as
    in sporadic SLE, but cutaneous disease in particular often responds only to
    high-dose steroids and flares on tapering.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: hydroxychloroquine
      term:
        id: CHEBI:5801
        label: hydroxychloroquine
  evidence:
  - reference: PMID:29113537
    reference_title: "Systemic lupus erythematosus with C1q deficiency: treatment with fresh frozen plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, all of them had been treated with steroids, hydroxychloroquine and methotrexate or azathioprine."
    explanation: >-
      The conventional regimen used.
  - reference: PMID:29113537
    reference_title: "Systemic lupus erythematosus with C1q deficiency: treatment with fresh frozen plasma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "It was learned that they had responded only to high dosage prednisolone and their symptoms flared up during dosage reduction even under methotrexate or azathioprine."
    explanation: >-
      Disease was not controlled once conventional therapy was tapered.
  - reference: PMID:42147803
    reference_title: "Homozygous C1qA Deficiency Presenting as Early-Onset Systemic Lupus Erythematosus: A Case Report With a Literature Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite treatment with corticosteroids and hydroxychloroquine, the patient's disease activity remained suboptimal, leading to consideration of hematopoietic stem cell transplantation as a definitive therapeutic option."
    explanation: >-
      Inadequate control on corticosteroids and hydroxychloroquine in a
      C1QA-deficient child.
- name: Vaccination and Antibiotic Prophylaxis
  description: >-
    Vaccination against encapsulated bacteria and antibiotic prophylaxis are
    part of standard management to reduce the infection risk.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Impaired Complement-Dependent Defence Against Encapsulated Bacteria
    treatment_effect: BYPASSES
    description: >-
      Reduces infection by encapsulated organisms despite the complement
      defect.
  evidence:
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Treatment and management of this rare disease are very complex and include prophylactic vaccination, antibiotics, and immunosuppressive drugs."
    explanation: >-
      Lists vaccination and antibiotics in management.
notes: >-
  The three gene-defined MONDO subtypes (C1Q deficiency 1, 2 and 3) are
  curated as has_subtypes rows. MONDO also has gene-specific classes named
  "systemic lupus erythematosus related to C1QA/C1QB/C1QC", placed under
  systemic lupus erythematosus rather than under C1Q deficiency; they are
  recorded under mappings as relatedMatch because they cover the lupus
  manifestation of each subtype rather than the whole deficiency, which also
  includes patients with infection alone or no symptoms.

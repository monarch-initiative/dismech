mappings:
  mondo_mappings:
  - term:
      id: MONDO:1060174
      label: systemic lupus erythematosus related to C1QA
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      MONDO places this class under systemic lupus erythematosus, not under C1Q
      deficiency, and defines it as SLE caused by variation in C1QA. It covers
      the lupus manifestation of the C1QA subtype curated here, but C1Q
      deficiency 1 also includes patients with infections only or no symptoms,
      so neither class subsumes the other with certainty.
  - term:
      id: MONDO:1060228
      label: systemic lupus erythematosus related to C1QB
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      As for the C1QA class: a gene-specific SLE class placed under systemic
      lupus erythematosus, overlapping the C1QB subtype curated here without
      being the same concept.
  - term:
      id: MONDO:1060227
      label: systemic lupus erythematosus related to C1QC
    mapping_predicate: skos:relatedMatch
    mapping_source: manual curation
    mapping_justification: >-
      As for the C1QA class: a gene-specific SLE class placed under systemic
      lupus erythematosus, overlapping the C1QC subtype curated here without
      being the same concept.
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency presenting with lupus-like autoimmunity and
      bacterial infection, placing it in Harrison's immune/rheumatologic Part.
      Assigned to match the sibling Complement_Component_2_Deficiency and
      Complement_Component_3_Deficiency entries.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      A defect of C1q, the recognition subunit of the classical pathway C1
      complex, which is a row of the IUIS complement deficiencies table.

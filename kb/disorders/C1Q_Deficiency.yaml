diagnosis:
- name: Complement screening (CH50, C3, C4, C1q antigen)
  description: >-
    Classical pathway haemolytic activity (CH50) is absent while C3 and C4
    are normal, which points to an early classical pathway component
    deficiency rather than the complement consumption of sporadic SLE.
    Undetectable C1q antigen then localises the defect. Secondary C1q
    deficiency (consumption, anti-C1q autoantibodies) must be excluded, and
    a missense variant producing low-molecular-weight C1q can leave antigen
    detectable despite absent function. The pattern should prompt testing in
    a young child with SLE-like skin disease, normal C3 and C4 and negative
    anti-dsDNA.
  diagnosis_term:
    preferred_term: complement screening assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: CH50, serum C3, serum C4, serum C1q antigen
  evidence:
  - reference: PMID:29113537

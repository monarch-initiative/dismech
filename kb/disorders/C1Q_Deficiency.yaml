    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel homozygous splicing mutation in the C1qB gene, c.187 + 1G > T, which is the first mutation to be confirmed in a Japanese individual."
    explanation: >-
      A homozygous C1QB splice variant in a C1q-deficient child with SLE
      features.
  - reference: PMID:17513176
    reference_title: "C1q deficiency in an Inuit family: identification of a new class of C1q disease-causing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the C1q genes revealed a novel missense mutation (Gly-Arg) in codon 217 of the B chain. All sisters were homozygous for the mutation: both parents were heterozygous."
    explanation: >-
      A homozygous C1QB missense variant segregating with C1q deficiency.

  - reference: PMID:22472776
    reference_title: "Identification of novel coding mutation in C1qA gene in an African-American pedigree with lupus and C1q deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an African-American patient with lupus and C1q deficiency, we identified and confirmed a novel homozygote start codon mutation in C1qA gene that changes amino acid methionine to arginine at position 1."
    explanation: >-
      A homozygous C1QA variant in a patient with C1q deficiency and lupus.
  - reference: PMID:29113537
    reference_title: "Systemic lupus erythematosus with C1q deficiency: treatment with fresh frozen plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1QA gene of two patients had homozygous nonsense mutation"
    explanation: >-
      Homozygous C1QA nonsense variants in C1q-deficient patients with SLE.
- name: C1QD2
  display_name: C1Q deficiency 2 (C1QB)
  description: >-
    C1q deficiency caused by biallelic C1QB variants, including splice-site
    and missense variants. A homozygous missense variant in an Inuit family
    abolished detectable serum C1q antigen, and a non-coding splice variant
    abolished C1QB mRNA in a boy with infections and no lupus.
  subtype_term:
    preferred_term: C1Q deficiency 2

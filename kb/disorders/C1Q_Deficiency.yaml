inheritance:
- name: Autosomal Recessive
  description: >-
    Disease requires biallelic variants in one of the three C1q genes, usually
    homozygous and frequently in consanguineous families. Heterozygous parents
    and siblings are clinically unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is a rare genetic condition inherited in an autosomal recessive manner, caused by mutations in C1q genes."
    explanation: >-
      States the autosomal recessive inheritance.
  - reference: PMID:20560256
    reference_title: "Hereditary C1q deficiency: a new family with C1qA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular study disclosed a homozygous point mutation in the C1qA chain gene. Five members of the family, including the parents and three healthy siblings, were heterozygous for this mutation."
    explanation: >-
      A homozygous proband with healthy heterozygous parents and siblings,
      consistent with recessive inheritance.
pathophysiology:
- name: Absent or Dysfunctional C1q
  biological_scale: MOLECULAR
  description: >-
    Biallelic variants in C1QA, C1QB or C1QC either abolish C1q (nonsense,
    splice, start-codon and some missense variants that prevent assembly or
    secretion) or yield a low-molecular-weight C1q that circulates at low
    level but is not functional. Loss of a single chain is enough to prevent
    C1q production even when the other two chains are made.
  genes:
  - preferred_term: C1QA
    term:
      id: hgnc:1241
      label: C1QA
  - preferred_term: C1QB
    term:
      id: hgnc:1242
      label: C1QB
  - preferred_term: C1QC
    term:
      id: hgnc:1245
      label: C1QC
  molecular_functions:
  - preferred_term: immunoglobulin binding by the C1q globular heads
    term:
      id: GO:0019865
      label: immunoglobulin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:29692784
    reference_title: "Complement Component C1q: Historical Perspective of a Functionally Versatile, and Structurally Unusual, Serum Protein."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Complement component C1q plays an important recognition role in adaptive, and innate, immunity through its ability to interact, via its six globular head regions, with both immunoglobulin and non-immunoglobulin activators of the complement system"
    explanation: >-
      States the normal molecular function of C1q that is lost in the
      deficiency: binding of immunoglobulin (and other activators) through its
      globular heads, which is the recognition step that starts the classical
      pathway.
  - reference: PMID:28082982
    reference_title: "C1q Deficiency and Neuropsychiatric Systemic Lupus Erythematosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "A mutation in one of the C1q genes can either lead to complete deficiency or to low C1q levels with C1q polypeptide in the form of low-molecular weight (LMW) C1q."
    explanation: >-
      Describes the two molecular outcomes of C1q gene variants.
  - reference: PMID:20635792
    reference_title: "Homozygosity for a novel mutation in the C1q C chain gene in a Turkish family with hereditary C1q deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation affected both the formation and the secretion of C1q variant molecules."
    explanation: >-
      A collagen-region missense variant prevents assembly and secretion of
      C1q.
  - reference: PMID:25454803
    reference_title: "Identification of a novel non-coding mutation in C1qB in a Dutch child with C1q deficiency associated with recurrent infections."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analyses of in vitro cultured cells from the patient revealed a lack of production of C1q and intracellular absence of C1qB in the presence of C1qA and C1qC peptides."
    explanation: >-
      Loss of a single chain (C1qB) abolishes C1q production even though the
      other two chains are made.
  downstream:
  - target: Classical Complement Pathway Initiation Failure
    description: >-
      Without functional C1q, the C1 complex cannot recognise immune complexes
      or other targets, so the classical pathway is not initiated.
  - target: Loss of C1q Restraint on Immune Complex-Induced Interferon-alpha Production
    description: >-
      C1q itself binds immune complexes and plasmacytoid dendritic cells and
      limits interferon-alpha induction; its absence removes this restraint.
  - target: Decreased Circulating C1q
    description: >-
      Absent or non-functional C1q is measured as undetectable or very low
      serum C1q antigen.
- name: Classical Complement Pathway Initiation Failure
  biological_scale: MOLECULAR
  description: >-
    C1q is the pattern-recognition subunit of C1, the first component of the
    classical pathway. Without it, classical-pathway haemolytic activity is
    absent while C3 and C4 levels and the lectin and alternative pathways are
    normal, which is the diagnostic pattern.
  biological_processes:
  - preferred_term: complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17513176
    reference_title: "C1q deficiency in an Inuit family: identification of a new class of C1q disease-causing mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initial examination for complement deficiency showed no function of the classical complement activation pathway in the patients; the lectin and alternative pathways were intact."
    explanation: >-
      Absent classical pathway function with intact lectin and alternative
      pathways in homozygous patients.
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Total complement activity, classical pathway (hemolytic test) was deficient and C1q antigen was below the detection limit supporting the presence of C1q deficiency."
    explanation: >-
      Absent classical pathway haemolytic activity in a genetically confirmed
      patient.
  downstream:
  - target: Impaired Complement-Dependent Defence Against Encapsulated Bacteria
    description: >-
      Without classical pathway activation, antibody-bound encapsulated
      bacteria are poorly opsonised.
  - target: Defective Clearance of Apoptotic Cells
    description: >-
      C1q and the early classical pathway components tag apoptotic cells for
      phagocytic clearance; without them apoptotic cells persist.
  - target: Reduced CH50
    description: >-
      Failure of classical pathway initiation is measured as absent
      classical-pathway haemolytic activity.
- name: Impaired Complement-Dependent Defence Against Encapsulated Bacteria
  biological_scale: CELLULAR
  description: >-
    Patients are susceptible to recurrent and severe infection with
    polysaccharide-encapsulated bacteria, including meningitis and pneumonia.
    The usual explanation is loss of classical-pathway C3b deposition on
    antibody-coated organisms, which phagocytes need for efficient uptake; no
    cited study measures opsonophagocytosis directly in C1q-deficient
    patients.
  evidence:
  - reference: PMID:20560256
    reference_title: "Hereditary C1q deficiency: a new family with C1qA deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary deficiency of complement component C1q is a rare genetic disorder with susceptibility to recurrent infections with polysaccharide-containing encapsulated microorganisms"
    explanation: >-
      States the susceptibility to encapsulated organisms.
  - reference: PMID:34993161
    reference_title: "Case Report: Early Onset Systemic Lupus Erythematosus Due to Hereditary C1q Deficiency Treated With Fresh Frozen Plasma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Hereditary C1q deficiency is associated with early-onset autoimmunity causing SLE or SLE-like disease as well as increased risk for infections with encapsulated bacteria."
    explanation: >-
      States the encapsulated-bacteria infection risk alongside the
      autoimmunity.
  downstream:
  - target: Recurrent Bacterial Infections
    description: >-
      Impaired defence against encapsulated organisms manifests as recurrent
      or severe bacterial infection.
  - target: Recurrent Meningitis
    description: >-
      Bacterial meningitis is among the severe infections reported.
- name: Defective Clearance of Apoptotic Cells
  biological_scale: CELLULAR
  description: >-
    C1q binds apoptotic cells and, with the early classical pathway
    components, promotes their removal by macrophages. In C1q-deficient mice
    apoptotic bodies accumulate in glomeruli and are cleared poorly from the
    peritoneum. This is the basis of the waste-disposal hypothesis, in which
    persisting apoptotic material supplies the nuclear autoantigens of SLE.
    The defect has been demonstrated in mice rather than measured directly in
    patients.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:9590289
    reference_title: "Homozygous C1q deficiency causes glomerulonephritis associated with multiple apoptotic bodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Among mice without glomerulonephritis, there were significantly greater numbers of glomerular apoptotic bodies in C1q-deficient mice compared with controls."
    explanation: >-
      Apoptotic bodies accumulate in C1q-deficient mouse glomeruli even
      without nephritis.
  - reference: PMID:10934224
    reference_title: "A hierarchical role for classical pathway complement proteins in the clearance of apoptotic cells in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we demonstrate, using novel in vivo models of apoptotic cell clearance during sterile peritonitis, a similar hierarchical role for classical pathway complement proteins in vivo in the clearance of apoptotic cells by macrophages."
    explanation: >-
      In vivo macrophage clearance of apoptotic cells depends on the classical
      pathway proteins, in the same hierarchy as human SLE risk, in which C1q
      deficiency carries the highest risk.
  downstream:
  - target: Loss of Tolerance to Nuclear Autoantigens
    description: >-
      Persisting apoptotic cells are a sustained source of nuclear autoantigen.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Loss of C1q Restraint on Immune Complex-Induced Interferon-alpha Production
  biological_scale: CELLULAR
  description: >-
    Nucleic-acid-containing immune complexes induce interferon-alpha in
    plasmacytoid dendritic cells. Physiological concentrations of C1q inhibit
    this, in part by directing immune complexes to monocytes rather than
    plasmacytoid dendritic cells. Without C1q this brake is lost.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: negative regulation of type I interferon production
    term:
      id: GO:0032480
      label: negative regulation of type I interferon production
    modifier: DECREASED
  evidence:
  - reference: PMID:19790049
    reference_title: "C1q inhibits immune complex-induced interferon-alpha production in plasmacytoid dendritic cells: a novel link between C1q deficiency and systemic lupus erythematosus pathogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "C1q significantly inhibited PBMC IFNalpha production induced by RNA-containing immune complexes (ICs), herpes simplex virus (HSV), and CpG DNA."
    explanation: >-
      C1q inhibits immune complex-induced interferon-alpha in human blood
      cells, so its absence removes this inhibition.
  - reference: PMID:20844193
    reference_title: "C1q deficiency leads to the defective suppression of IFN-alpha in response to nucleoprotein containing immune complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our experiments revealed that C1q preferentially promotes the binding of SLE ICs to monocytes rather than plasmacytoid dendritic cells"
    explanation: >-
      Proposes the cellular route of the C1q effect.
  downstream:
  - target: Type I Interferon Pathway Activation
    description: >-
      Unrestrained interferon-alpha production drives a systemic type I
      interferon signature.
- name: Type I Interferon Pathway Activation
  biological_scale: ORGANISM
  description: >-
    Patients have elevated interferon-stimulated gene expression in blood and
    raised interferon-alpha in serum and cerebrospinal fluid, which places C1q
    deficiency close to the monogenic type I interferonopathies. Chilblain-like
    acral lesions and basal ganglia calcification, seen in some patients, are
    features shared with those disorders.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:39196411
    reference_title: "Hereditary C1q Deficiency is Associated with Type 1 Interferon-Pathway Activation and a High Risk of Central Nervous System Inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated ISG expression was observed in all patients tested (n = 10/10), and serum and CSF IFNα elevated in 2/2 patients."
    explanation: >-
      An interferon signature in every genetically confirmed patient tested.
  - reference: PMID:20844193
    reference_title: "C1q deficiency leads to the defective suppression of IFN-alpha in response to nucleoprotein containing immune complexes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with C1q deficiency, serum and cerebrospinal fluid levels of IFN-α and IFN-γ-inducible protein-10 levels were elevated and strongly correlated with Ro autoantibodies"
    explanation: >-
      Raised interferon-alpha in serum and cerebrospinal fluid of
      C1q-deficient patients.
  downstream:
  - target: Systemic Lupus Erythematosus
    description: >-
      Type I interferon is a central driver of lupus autoimmunity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Chilblains
    description: >-
      Chilblain-like acral lesions are an interferonopathy feature reported in
      C1q deficiency.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Basal Ganglia Calcification
    description: >-
      Basal ganglia calcification is reported alongside raised CSF
      interferon-alpha, as in the type I interferonopathies.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Increased CSF Interferon-alpha
    description: >-
      Intrathecal interferon-alpha is the measurable readout of the pathway in
      the central nervous system.
  - target: Cerebral Vasculitis
    description: >-
      Central nervous system inflammation, including vasculitis, is frequent
      in patients with an interferon signature; the causal route from
      interferon to vascular inflammation is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    description: >-
      Seizures are the commonest neuropsychiatric presentation of the central
      nervous system inflammation that accompanies the interferon signature;
      the causal route is not established.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Loss of Tolerance to Nuclear Autoantigens
  biological_scale: ORGANISM
  description: >-
    Sustained exposure to nuclear autoantigens from uncleared apoptotic
    material leads to antinuclear autoantibody production and immune-complex
    disease. C1q-deficient mice develop autoantibodies and immune-complex
    glomerulonephritis, though expression depends strongly on genetic
    background. In patients antinuclear antibodies are usual but anti-dsDNA
    antibodies are less frequent than in sporadic SLE.
  evidence:
  - reference: PMID:9590289
    reference_title: "Homozygous C1q deficiency causes glomerulonephritis associated with multiple apoptotic bodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "C1qa-/- mice had increased mortality and higher titres of autoantibodies, compared with strain-matched controls. Of the C1qa-/- mice, 25% had glomerulonephritis with immune deposits and multiple apoptotic cell bodies."
    explanation: >-
      C1q deficiency alone produces autoantibodies and immune-complex
      glomerulonephritis in mice.
  - reference: PMID:11859149
    reference_title: "C1q deficiency and autoimmunity: the effects of genetic background on disease expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data demonstrate that the expression of autoimmunity in C1q-deficient mice is strongly influenced by other background genes."
    explanation: >-
      The autoimmune outcome of C1q loss depends on genetic background in
      mice.
  downstream:
  - target: Systemic Lupus Erythematosus
    description: >-
      Loss of tolerance manifests as SLE or an SLE-like illness in most
      patients.
  - target: Antinuclear Antibody Positivity
    description: >-
      Antinuclear antibodies are the serological readout of lost tolerance.
  - target: Glomerulonephritis
    description: >-
      Immune complex deposition in the kidney causes glomerulonephritis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Discoid Lupus Rash
    description: >-
      Cutaneous lupus lesions are the commonest manifestation of the
      autoimmune disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Oral Ulcers
    description: >-
      Mucosal ulceration is a lupus manifestation of the autoimmune disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Malar Rash
    description: >-
      Malar rash is a lupus manifestation of the autoimmune disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cutaneous Photosensitivity
    description: >-
      Photosensitive rash is a lupus manifestation of the autoimmune disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthritis
    description: >-
      Inflammatory arthritis is a lupus manifestation, though less frequent
      than in sporadic SLE.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- category: Immunological
  name: Systemic Lupus Erythematosus
  frequency: FREQUENT
  description: >-
    SLE or an SLE-like illness develops in most patients, usually in early
    childhood. In a 2015 literature review 55% of 71 reported patients met ACR
    criteria for SLE and a further 22.5% had an SLE-like syndrome; an
    international follow-up survey of 45 patients found SLE in 80%. Compared
    with sporadic SLE, discoid rash and oral ulcers are more common and
    arthritis and anti-dsDNA antibodies less common.
  phenotype_term:
    preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  evidence:
  - reference: PMID:25846716
    reference_title: "Clinical presentation of human C1q deficiency: How much of a lupus?"
    supports: SUPPORT

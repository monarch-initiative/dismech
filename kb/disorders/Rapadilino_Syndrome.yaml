name: RAPADILINO Syndrome
creation_date: "2026-10-03T21:57:14Z"
category: Mendelian
description: >-
  RAPADILINO syndrome is a rare autosomal recessive multiple-malformation
  syndrome named for its cardinal features: RAdial ray aplasia or hypoplasia,
  PAtellar aplasia or hypoplasia and cleft or high-arched PAlate, DIarrhea in
  infancy and DIslocated joints, LIttle size and LImb malformation, and a
  slender NOse with NOrmal intelligence. It is one of three allelic disorders
  caused by biallelic variants in RECQL4, a RecQ-family DNA helicase gene, the
  others being Rothmund-Thomson syndrome type 2 and Baller-Gerold syndrome. It
  is distinguished from both by the absence of poikiloderma, and from
  Rothmund-Thomson syndrome also by the absence of alopecia and loss of
  eyebrows and eyelashes. Most reported patients are Finnish and carry at least
  one copy of the founder splice variant c.1390+2delT, which causes in-frame
  skipping of exon 7 (p.Ala420_Ala463del) and yields a protein that retains
  strand-annealing activity but lacks helicase and ATPase activity and is
  retained poorly in the nucleus. Growth restriction begins before birth. The
  syndrome was first thought to carry no significant cancer risk, but longer
  follow-up of the Finnish cohort recorded osteosarcoma or lymphoma in 6 of 15
  patients.
synonyms:
- RAPADILINO
- Rapadilino syndrome
- RECQL4-related RAPADILINO syndrome
parents:
- Genetic Disease
- Skeletal Disease
- Congenital Limb Malformation
- Autosomal Recessive Disease

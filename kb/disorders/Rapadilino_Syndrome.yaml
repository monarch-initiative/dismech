inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Recessive inheritance was proposed from the first sib pair and sporadic
    cases and confirmed when biallelic RECQL4 variants were found in the Finnish
    patients, who are homozygous for the exon 7 founder allele or compound
    heterozygous for it and a truncating allele.
  evidence:
  - reference: PMID:2801769
    reference_title: RAPADILINO syndrome with radial and patellar aplasia/hypoplasia as main manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive inheritance seems the most plausible cause."
    explanation: The original description proposed recessive inheritance from the occurrence of the syndrome in a sib pair and sporadic patients.
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RAPADILINO syndrome is an autosomal recessive disorder characterized by short stature, radial ray defects and other malformations, as well as infantile diarrhoea"
    explanation: The gene-discovery report states the autosomal recessive mode of inheritance.
prevalence:
- population: Worldwide, with most reported patients from Finland
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fifteen patients had been identified in Finland by 2009, where the
    syndrome is overrepresented through enrichment of the c.1390+2delT founder
    allele, and only a few cases have been described in other populations. A
    1998 report of a non-Finnish case counted seven children described in total
    at that time. No population-based prevalence, incidence or carrier
    frequency has been published.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, 15 RAPADILINO patients have been identified in Finland where RAPADILINO syndrome is overrepresented because of the enrichment of a founder mutation"
    explanation: Gives the Finnish case count and attributes the regional overrepresentation to a founder allele.
  - reference: PMID:9571286
    reference_title: Rapadilino syndrome--a non-Finnish case.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Including this report seven children with this syndrome have been described."
    explanation: Gives the literature case count at the time of the first non-Finnish report.
pathophysiology:
- name: Biallelic RECQL4 Pathogenic Variants
  biological_scale: MOLECULAR
  description: >-
    Both RECQL4 alleles carry a pathogenic variant. The most common allele, and
    the one carried by every reported Finnish patient, is the splice-site
    variant c.1390+2delT, which causes in-frame skipping of exon 7 and deletes
    44 amino acids (p.Ala420_Ala463del) immediately upstream of the helicase
    domain. Patients are homozygous for it or compound heterozygous with a
    nonsense or frameshift allele; a few patients have two truncating alleles.
  genes:
  - preferred_term: RECQL4
    term:
      id: hgnc:9949
      label: RECQL4
  molecular_functions:
  - preferred_term: 3'-5' DNA helicase activity
    term:
      id: GO:0043138
      label: 3'-5' DNA helicase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      The exon 7 deletion protein keeps ATP-independent strand-annealing
      activity but loses helicase and single-stranded DNA-stimulated ATPase
      activity, and fails to be retained in the nucleus, so the allele removes
      some but not all RECQL4 activities.
  downstream:
  - target: Loss of RECQL4 Helicase and ATPase Activity
    description: >-
      The exon 7 in-frame deletion abolishes the protein's catalytic unwinding
      activity even though the core helicase motifs are retained.
    evidence:
    - reference: PMID:22885111
      reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, the RAPADILINO protein variant lacks helicase and ssDNA-stimulated ATPase activity."
      explanation: Purified exon 7-deleted RECQL4 has no helicase or ssDNA-stimulated ATPase activity, which is the step this edge asserts.
  - target: Failure of RECQL4 Nuclear Retention
    description: >-
      Exon 7 encodes a domain needed to keep RECQL4 in the nucleus, so the
      founder allele relocates the protein to the cytoplasm.
    evidence:
    - reference: PMID:17250975
      reference_title: Nuclear import and retention domains in the amino terminus of RECQL4.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "GFP-RECQL4 deleted for exon 7 (aa 420-463), a mutation found in all reported patients with RAPADILINO syndrome, is cytoplasmic."
      explanation: A tagged construct reproducing the RAPADILINO exon 7 deletion is cytoplasmic in cultured cells.
  - target: p53 Activation in the Developing Skeleton
    description: >-
      Loss of RECQL4 in skeletal progenitors activates p53, which mediates the
      skeletal defects in conditional knockout mice.
    evidence:
    - reference: PMID:25556649
      reference_title: RECQL4 Regulates p53 Function In Vivo During Skeletogenesis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "These Prx1-Cre(+) ;Recql4(fl/fl) mice as well as Col2a1-Cre(+) ;Recql4(fl/fl) mice exhibited growth plate defects and an increased p53 response in affected tissues."
      explanation: Shows the p53 response to Recql4 loss in limb and growth-plate tissue; graded indirect because the model is a null deletion, not the RAPADILINO exon 7 allele.
  evidence:
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four mutations in the RECQL4 gene were found in the Finnish patients, the most common mutation representing exon 7 in-frame deletion saving the helicase domain and showing dominant effect over other three nonsense mutations."
    explanation: Identifies the RECQL4 variants in the Finnish RAPADILINO patients and the predominance of the exon 7 in-frame deletion.
  - reference: PMID:22885111
    reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "One of the more common mutations found in RECQL4 is the RAPADILINO mutation, c.1390+2delT which is a splice-site mutation leading to an in-frame skipping of exon 7 resulting in 44 amino acids being deleted from the protein (p.Ala420-Ala463del)."
    explanation: Defines the founder splice variant and its in-frame protein consequence.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the Finnish RAPADILINO patients are at least compound heterozygotes for this mutation and therefore have at least one gene copy that encodes a RECQL4 protein from which 44 amino acids are missing."
    explanation: Establishes that every Finnish patient carries at least one exon 7 deletion allele.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Truncating mutations in both alleles usually strongly suggest RTSII or BGS; however, a few RAPADILINO patients have two truncating mutations as well."
    explanation: Records that the exon 7 allele is not obligatory, since a few patients carry two truncating alleles.
- name: Loss of RECQL4 Helicase and ATPase Activity
  biological_scale: MOLECULAR
  description: >-
    The exon 7-deleted protein, purified and assayed directly, unwinds no DNA
    and shows no single-stranded DNA-stimulated ATP hydrolysis, while its
    ATP-independent strand-annealing activity is unchanged from wild type.
  molecular_functions:
  - preferred_term: 3'-5' DNA helicase activity
    term:
      id: GO:0043138
      label: 3'-5' DNA helicase activity
    modifier: DECREASED
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  downstream:
  - target: Predisposition to Osteosarcoma and Lymphoma
    description: >-
      Loss of helicase activity is proposed, not shown, to underlie the cancer
      predisposition shared by RAPADILINO and Rothmund-Thomson syndrome type 2
      patients.
    evidence:
    - reference: PMID:22885111
      reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Given our finding that the RAPA RECQL4 lacks helicase and ATPase activity, this lends support to the proposal that lack of helicase activity contributes to the cancer predisposition seen in both RTS and RAPADILINO patients."
      explanation: The authors infer the link from the biochemical result; no experiment connects helicase loss to tumor formation, so the edge is graded indirect.
  evidence:
  - reference: PMID:22885111
    reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that strand annealing activity in the absence of ATP is unchanged from that of WT RECQL4. However, the RAPADILINO protein variant lacks helicase and ssDNA-stimulated ATPase activity."
    explanation: Direct biochemical characterization of the RAPADILINO mutant protein separates the lost catalytic activities from the retained annealing activity.
- name: Failure of RECQL4 Nuclear Retention
  biological_scale: CELLULAR
  description: >-
    The amino terminus of RECQL4 carries its nuclear localization and retention
    activities. Exon 7 encodes a retention domain, partly conveyed by a
    conserved VLPLY motif, and RECQL4 lacking exon 7 accumulates in the
    cytoplasm, where it cannot take part in the nuclear replication functions
    that map to the same amino-terminal region.
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
    modifier: DECREASED
  downstream:
  - target: Impaired DNA Replication Initiation
    description: >-
      Exclusion of RECQL4 from the nucleus is expected to deprive replication
      origins of its initiation activity. This step is inferred from the
      localization and replication studies taken together; it has not been
      measured in RAPADILINO patient cells.
    evidence:
    - reference: PMID:17250975
      reference_title: Nuclear import and retention domains in the amino terminus of RECQL4.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "A role in DNA replication initiation has been demonstrated and mapped to the amino terminus upstream of the helicase domain"
      explanation: Places the replication-initiation function in the same amino-terminal region whose nuclear retention the exon 7 deletion disrupts; the consequence for replication is inferred rather than measured.
  evidence:
  - reference: PMID:17250975
    reference_title: Nuclear import and retention domains in the amino terminus of RECQL4.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Nuclear localization of the exon 7 deletion construct is increased in cells treated with leptomycin B suggesting that exon 7 encodes a domain required for nuclear retention of RECQL4."
    explanation: Shows that the exon 7 deletion protein is exported rather than never imported, identifying exon 7 as a nuclear retention domain.
  - reference: PMID:22885111
    reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The region of RECQL4 encoded by exon 7 has been previously reported to be important for nuclear import and retention, because the GFP fusion of RECQL4 protein harboring the major RAPADILINO patient mutation (RAPA) was overwhelmingly mislocalized to the cytoplasm"
    explanation: Independent restatement of the cytoplasmic mislocalization of the RAPADILINO protein.
- name: Impaired DNA Replication Initiation
  biological_scale: MOLECULAR
  description: >-
    RECQL4 acts after pre-replicative complex assembly to promote loading of
    replication factors, including RPA, at origins. Reduced availability of
    functional nuclear RECQL4 is expected to compromise origin firing in
    rapidly dividing cells.
  biological_processes:
  - preferred_term: DNA replication initiation
    term:
      id: GO:0006270
      label: DNA replication initiation
    modifier: DECREASED
  downstream:
  - target: Progenitor Cell Proliferation Failure
    description: >-
      Cells that cannot initiate replication efficiently fail to proliferate.
    evidence:
    - reference: PMID:15960976
      reference_title: Initiation of DNA replication requires the RECQL4 protein mutated in Rothmund-Thomson syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "xRTS can be replaced in extracts by its human homolog, while RECQL4 depletion from mammalian cells induces proliferation failure, suggesting an evolutionarily conserved function."
      explanation: Links loss of RECQL4 replication-initiation activity to proliferation failure in mammalian cells.
  evidence:
  - reference: PMID:15960976
    reference_title: Initiation of DNA replication requires the RECQL4 protein mutated in Rothmund-Thomson syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, xRTS functions after pre-RC formation to promote loading of replication factors at origins, a previously unrecognized activity necessary for initiation."
    explanation: Establishes the replication-initiation step for which RECQL4 is required.
- name: Progenitor Cell Proliferation Failure
  biological_scale: CELLULAR
  description: >-
    Dividing progenitor populations, notably osteoblast-lineage progenitors,
    respond to RECQL4 loss with failed proliferation, cell-cycle arrest,
    apoptosis and impaired differentiation. This proliferative deficit is the
    proposed cellular basis of the benign skeletal phenotypes of the RECQL4
    syndromes.
  cell_types:
  - preferred_term: osteoblast progenitor cell
    term:
      id: CL:0007010
      label: preosteoblast
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Defective Skeletal Development
    description: >-
      Failure of skeletal progenitors to expand reduces bone formation and
      limb skeletal growth.
    evidence:
    - reference: PMID:25859855
      reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data provide a mechanism for the benign skeletal phenotypes of RECQL4 mutation syndromes."
      explanation: The authors propose the osteoblast-progenitor proliferation defect as the mechanism of the skeletal phenotypes of the RECQL4 syndromes, which include RAPADILINO.
  - target: Generalized Growth Restriction
    description: >-
      Reduced proliferative capacity across dividing tissues is the likely
      basis of the constitutional growth deficit; this step is inferred from
      the shared growth phenotype of the RECQL4 syndromes and has not been
      measured directly in patients.
  evidence:
  - reference: PMID:25859855
    reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Acute deletion of Recql4 in primary osteoblasts or shRNA knockdown in an osteoblastic cell line caused failed proliferation, accompanied by cell cycle arrest, induction of apoptosis and impaired differentiation."
    explanation: Cell-autonomous experiments establish proliferative arrest and apoptosis as the cellular consequence of Recql4 loss in the osteoblast lineage.
- name: p53 Activation in the Developing Skeleton
  biological_scale: CELLULAR
  description: >-
    In mice, Recql4 inactivation in limb mesenchyme or growth-plate chondrocyte
    lineages raises p53 activity in the affected tissues, and removing Trp53
    rescues the skeletal phenotype, placing p53 activation between RECQL4 loss
    and the developmental bone defects.
  biological_processes:
  - preferred_term: signal transduction by p53 class mediator
    term:
      id: GO:0072331
      label: signal transduction by p53 class mediator
    modifier: INCREASED
  downstream:
  - target: Defective Skeletal Development
    description: >-
      p53 activation is required for the skeletal defects that follow Recql4
      loss in the developing limb.
    evidence:
    - reference: PMID:25556649
      reference_title: RECQL4 Regulates p53 Function In Vivo During Skeletogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inactivation of Trp53 in these Recql4 mutants resulted in genetic rescue of the skeletal phenotypes, indicating an in vivo interaction between Recql4 and Trp53, and p53 activation as an underlying mechanism for the developmental bone abnormalities in RECQL4 disorders."
      explanation: Genetic rescue by Trp53 deletion shows p53 activation is required for the skeletal phenotype.
  evidence:
  - reference: PMID:25556649
    reference_title: RECQL4 Regulates p53 Function In Vivo During Skeletogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These Prx1-Cre(+) ;Recql4(fl/fl) mice as well as Col2a1-Cre(+) ;Recql4(fl/fl) mice exhibited growth plate defects and an increased p53 response in affected tissues."
    explanation: Documents the p53 response in the skeletal tissues of Recql4 conditional knockouts.
- name: Defective Skeletal Development
  biological_scale: TISSUE
  description: >-
    The embryonic skeleton develops abnormally, most consistently in the
    preaxial upper limb and the patella. Radial ray reduction ranges from thumb
    hypoplasia to absent radius, patellae are hypoplastic or absent, joints
    dislocate, and the palate is cleft or high-arched. Joint dislocation and
    patellar hypoplasia have been described as features that separate
    RAPADILINO from the other RECQL4 syndromes. How progenitor proliferation
    failure produces this particular distribution of defects, and in
    particular the palatal defect, has not been established.
  biological_processes:
  - preferred_term: limb development
    term:
      id: GO:0060173
      label: limb development
    modifier: ABNORMAL
  - preferred_term: ossification
    term:
      id: GO:0001503
      label: ossification
    modifier: DECREASED
  downstream:
  - target: Radial Aplasia or Hypoplasia
    description: Preaxial forearm reduction is the most constant malformation.
  - target: Thumb Aplasia or Hypoplasia
    description: Thumb hypoplasia or absence accompanies the radial defect.
  - target: Patellar Aplasia or Hypoplasia
    description: Patellar hypoplasia or aplasia is a defining lower-limb feature.
  - target: Joint Dislocation
    description: >-
      Joint dislocations are part of the congenital skeletal phenotype; no
      joint-specific mechanism has been described.
  - target: Cleft Palate
    description: >-
      The palatal defect is part of the defining malformation pattern; the
      developmental route from RECQL4 loss to failure of palatal closure is not
      known.
  - target: High Palate
    description: >-
      High-arched palate is the milder palatal presentation of the same
      defining feature; its developmental route is likewise not known.
  evidence:
  - reference: PMID:2801769
    reference_title: RAPADILINO syndrome with radial and patellar aplasia/hypoplasia as main manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic manifestations are radial aplasia or hypoplasia, absence of thumbs, absent or hypoplastic patellae, dislocations of joints, unusual face, cleft or highly arched palate, diarrhea in infancy, small stature, and normal intelligence."
    explanation: The founding clinical description lists the skeletal malformations that make up this node.
  - reference: PMID:20113479
    reference_title: Rothmund-Thomson syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, cataracts are seen only in RTS, joint dislocation and patellar hypoplasia are seen only in RAPADILINO and craniosynostosis only in BGS."
    explanation: A review states that joint dislocation and patellar hypoplasia are the skeletal features specific to RAPADILINO among the RECQL4 syndromes.
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The skeletal malformations in RAPADILINO and RTS patients as well as the high osteosarcoma risk in RTS propose a special role for RECQL4 in bone development."
    explanation: The gene-discovery report attributes the skeletal malformations to a role of RECQL4 in bone development.
- name: Generalized Growth Restriction
  biological_scale: ORGANISM
  description: >-
    Growth is restricted from intrauterine life onward and persists
    postnatally as short stature. Infantile diarrhea, vomiting and feeding
    difficulty occur in the same period and may compound the postnatal deficit,
    but the growth restriction is already present before birth.
  downstream:
  - target: Short Stature
    description: The postnatal expression of the growth deficit.
  - target: Intrauterine Growth Retardation
    description: The prenatal expression of the same growth deficit.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients have overlapping features with RTS patients, namely intrauterine and postnatal growth retardation and bone malformations, especially radial defects, such as hypoplasia and aplasia of thumbs and radius."
    explanation: States that RAPADILINO patients have both intrauterine and postnatal growth retardation.
- name: Predisposition to Osteosarcoma and Lymphoma
  biological_scale: ORGANISM
  description: >-
    Patients carrying the c.1390+2delT allele have an increased risk of
    osteosarcoma and of lymphoma. The 2003 gene-discovery report described no
    significant cancer risk; updated review of all 15 Finnish patients in 2009
    found two osteosarcomas and four lymphomas. Lymphoma is more prominent here
    than in Rothmund-Thomson syndrome type 2, where osteosarcoma predominates,
    and why the RAPADILINO allele predisposes to both is unexplained.
  downstream:
  - target: Osteosarcoma
    description: Osteosarcoma has been diagnosed in Finnish RAPADILINO patients, including in the teens.
  - target: Lymphoma
    description: Lymphoma has been diagnosed in Finnish RAPADILINO patients, including in early adulthood.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that RAPADILINO patients identified as carriers of the c.1390+2delT mutation (p.Ala420_Ala463del) are at increased risk to develop lymphoma or osteosarcoma (6 out of 15 patients)."
    explanation: Cancer occurred in 6 of the 15 Finnish patients carrying the founder allele.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, out of 15 Finnish RAPADILINO patients there have been two diagnoses of osteosarcoma and four of lymphoma making the cancer incidence very high among Finnish RAPADILINO patients (40%)."
    explanation: Splits the six cancers into two osteosarcomas and four lymphomas.
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "RAPADILINO syndrome is an autosomal recessive disorder characterized by short stature, radial ray defects and other malformations, as well as infantile diarrhoea, but not by a significant cancer risk."
    explanation: The earlier report on the same Finnish cohort described no significant cancer risk; the later, longer follow-up superseded it.
  - reference: PMID:20113479
    reference_title: Rothmund-Thomson syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The recent follow-up of RAPADILINO patients who developed either osteosarcoma or lymphoma"
    explanation: A review records that follow-up of RAPADILINO patients changed the view of their cancer predisposition.
phenotypes:
- category: Skeletal
  name: Radial Aplasia or Hypoplasia
  description: >-
    Underdevelopment or absence of the radius, usually with absent or
    hypoplastic thumbs. The radial ray defect is the defining limb feature.
  phenotype_term:
    preferred_term: radial aplasia or hypoplasia
    term:
      id: HP:0006501
      label: Aplasia/Hypoplasia of the radius
  evidence:
  - reference: PMID:2801769
    reference_title: RAPADILINO syndrome with radial and patellar aplasia/hypoplasia as main manifestations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic manifestations are radial aplasia or hypoplasia, absence of thumbs, absent or hypoplastic patellae, dislocations of joints, unusual face, cleft or highly arched palate, diarrhea in infancy, small stature, and normal intelligence."
    explanation: Radial aplasia or hypoplasia is the first characteristic manifestation listed.
  - reference: PMID:1481838
    reference_title: RAPADILINO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on a boy with severe radial hypoplasia, absent thumbs and patellae, short stature, persistent diarrhea, slender nose and normal intelligence as another example of the RAPADILINO syndrome."
    explanation: Single case report with severe radial hypoplasia.
- category: Skeletal
  name: Thumb Aplasia or Hypoplasia
  description: Hypoplastic or absent thumbs accompany the radial defect.
  phenotype_term:
    preferred_term: thumb aplasia or hypoplasia
    term:
      id: HP:0009601
      label: Aplasia/Hypoplasia of the thumb
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.

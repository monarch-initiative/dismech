genetic:
- name: RECQL4
  gene_term:
    preferred_term: RECQL4
    term:
      id: hgnc:9949
      label: RECQL4
  association: Causative
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    The founder allele c.1390+2delT (p.Ala420_Ala463del) is the most common
    RAPADILINO variant; all Finnish patients carry at least one copy, in the
    homozygous state or in trans with a nonsense or frameshift allele, and the
    splice variant has been reported only in RAPADILINO patients. Other
    RAPADILINO-associated RECQL4 variants include truncating alleles and the
    missense change p.Phe637Ser. Some RECQL4 alleles are shared between
    RAPADILINO, Rothmund-Thomson syndrome type 2 and Baller-Gerold syndrome, so
    genotype alone does not assign a patient to one of the three syndromes.
  evidence:
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a fourth syndrome resulting in mutations in the RECQL genes."
    explanation: The gene-discovery report establishing RECQL4 as the cause of RAPADILINO syndrome.
  - reference: PMID:22885111
    reference_title: RAPADILINO RECQL4 mutant protein lacks helicase and ATPase activity.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is found in the majority of reported RAPADILINO patients, especially those of Finnish decent, and importantly, it is one of a few homozygous RECQL4 mutations."
    explanation: Records the prevalence of the founder allele among reported patients and that it occurs in the homozygous state.
  - reference: PMID:20113479
    reference_title: Rothmund-Thomson syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, this splicing mutation has been detected only in RAPADILINO patients."
    explanation: Records the specificity of the exon 7 splice allele for RAPADILINO.
  - reference: PMID:40819286
    reference_title: "Unilateral loss of recql4 function in Xenopus laevis tadpoles leads to ipsilateral ablation of the forelimb, hypoplastic Meckel's cartilage, and vascular defects."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "While RAPADILINO syndrome mainly results from a single RECQL4 variant more common in the Finnish population, BGS and RTS are genetically heterogeneous."
    explanation: Background statement from a Xenopus study contrasting the near-single-allele genetics of RAPADILINO with the heterogeneity of the allelic syndromes.
animal_models:
- name: Prx1-Cre conditional Recql4 limb-mesenchyme knockout mouse
  species: Mouse
  genotype: Recql4 fl/fl with Prx1-Cre deletion in limb and craniofacial mesenchyme
  publication: PMID:25556649
  description: >-
    Recql4 inactivation in the skeletal lineage with Prx1-Cre produces limb
    abnormalities and craniosynostosis with growth plate defects and a raised
    p53 response; Trp53 inactivation rescues the skeletal phenotype.
  modeled_mechanisms:
  - target: p53 Activation in the Developing Skeleton
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows the p53 response in the affected skeletal tissues and its
      requirement for the bone phenotype.
    limitations: >-
      The allele is a conditional null rather than the RAPADILINO exon 7
      in-frame deletion, which keeps strand-annealing activity, and the
      phenotype includes craniosynostosis, a Baller-Gerold rather than a
      RAPADILINO feature.
    evidence:
    - reference: PMID:25556649
      reference_title: RECQL4 Regulates p53 Function In Vivo During Skeletogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inactivation of Trp53 in these Recql4 mutants resulted in genetic rescue of the skeletal phenotypes, indicating an in vivo interaction between Recql4 and Trp53, and p53 activation as an underlying mechanism for the developmental bone abnormalities in RECQL4 disorders."
      explanation: Genetic rescue establishes p53 activation as required in this model.
  - target: Defective Skeletal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces limb abnormalities attributed to RECQL4 loss in the skeletal
      lineage.
    limitations: >-
      Radial ray reduction, patellar aplasia and palatal defects, the
      RAPADILINO-defining malformations, are not specifically reported in the
      abstract, and the mice also develop craniosynostosis, which is absent in
      RAPADILINO.
    evidence:
    - reference: PMID:25556649
      reference_title: RECQL4 Regulates p53 Function In Vivo During Skeletogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inactivation of Recql4 using the Prx1-Cre transgene led to limb abnormalities and craniosynostosis mimicking the major bone findings in human RECQL4 patients."
      explanation: Reports the limb phenotype of the model and its stated correspondence to the human RECQL4 bone findings.
- name: Unilateral recql4 CRISPR knockdown Xenopus laevis tadpole
  species: Xenopus laevis
  genotype: recql4 CRISPR-edited on one side of the embryo
  publication: PMID:40819286
  description: >-
    One-sided recql4 editing in Xenopus laevis tadpoles leads, after feeding
    begins, to slowed growth on the edited side, failure of forelimb bud
    development with complete absence of the ipsilateral forelimb, reduced
    ossification of Meckel's cartilage, and hypoplastic vasculature.
  modeled_mechanisms:
  - target: Defective Skeletal Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Shows that recql4 loss in a vertebrate limb field abolishes forelimb
      development, an extreme form of the upper-limb reduction seen in the
      RECQL4 syndromes.
    limitations: >-
      Complete forelimb absence is far more severe than the preaxial radial ray
      defect of RAPADILINO, the edit is a knockdown rather than the exon 7
      in-frame deletion, and amphibian forelimb development differs from
      human limb patterning.
    evidence:
    - reference: PMID:40819286
      reference_title: "Unilateral loss of recql4 function in Xenopus laevis tadpoles leads to ipsilateral ablation of the forelimb, hypoplastic Meckel's cartilage, and vascular defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Forelimb buds fail to develop, leading to complete absence of the forelimb on the edited side."
      explanation: Reports the forelimb outcome of recql4 loss in this model.
treatments:
- name: Osteosarcoma and Lymphoma Surveillance
  description: >-
    Clinical attention to signs of osteosarcoma (bone pain, swelling, an
    enlarging limb lesion) and of lymphoma (lymph node enlargement, fever,
    weight loss). No RAPADILINO-specific surveillance protocol has been
    published; the recommendation comes from the Baller-Gerold syndrome
    GeneReviews chapter, which bases it on the cancer risk of the allelic
    RECQL4 disorders, of which RAPADILINO is one.
  treatment_term:
    preferred_term: cancer surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Predisposition to Osteosarcoma and Lymphoma
    description: >-
      Surveillance does not alter the predisposition; it aims to detect
      osteosarcoma or lymphoma early.
  evidence:
  - reference: PMID:20301383
    reference_title: Baller-Gerold Syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because individuals with allelic RECQL4 disorders are at increased risk for osteosarcoma and lymphoma"
    explanation: The surveillance recommendation is made in the Baller-Gerold chapter on the basis of the allelic RECQL4 disorders, so it applies to RAPADILINO by extension rather than by a RAPADILINO-specific study.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report that RAPADILINO patients identified as carriers of the c.1390+2delT mutation (p.Ala420_Ala463del) are at increased risk to develop lymphoma or osteosarcoma (6 out of 15 patients)."
    explanation: The RAPADILINO-specific cancer incidence that motivates surveillance for both tumor types.
- name: Immunoglobulin Substitution Therapy
  description: >-
    Intravenous immunoglobulin substitution, with Pneumocystis jirovecii
    prophylaxis and minimal use of ionizing radiation, was used in the single
    reported RAPADILINO patient with hypogammaglobulinemia and absent vaccine
    responses. It is not established management for the syndrome.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Decreased Circulating IgG
    description: Replaces the missing immunoglobulin; it does not correct the underlying lymphocyte deficiency.
  evidence:
  - reference: PMID:26064716
    reference_title: "Immunodeficiency in a Child with Rapadilino Syndrome: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the poor responses to vaccination, the child is receiving intravenous immunoglobulin substitution therapy."
    explanation: Single case report of immunoglobulin substitution in a RAPADILINO patient with antibody deficiency.
diagnosis:
- name: Molecular genetic testing of RECQL4
  description: >-
    Identification of biallelic RECQL4 variants confirms a RECQL4 disorder.
    Within that group, the absence of poikiloderma points to RAPADILINO
    rather than Rothmund-Thomson syndrome type 2 or Baller-Gerold syndrome,
    and the c.1390+2delT allele is characteristic.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the patient has RECQL4 mutations, but no evidence of poikiloderma, the diagnosis is more likely RAPADILINO syndrome."
    explanation: States how a molecular RECQL4 result and the skin examination together assign the diagnosis.
- name: Immunological evaluation
  description: >-
    Lymphocyte subset counts, immunoglobulin levels and vaccine responses have
    been proposed for children with RECQL4 variants after a RAPADILINO patient
    was found to be immunodeficient.
  diagnosis_term:
    preferred_term: immunological work-up
    term:
      id: NCIT:C16723
      label: Immunology Test
  evidence:
  - reference: PMID:26064716
    reference_title: "Immunodeficiency in a Child with Rapadilino Syndrome: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case report suggests that immunodeficiency can occur in children with REQL4 mutations and that immunological screening should be performed as a standard of care."
    explanation: The case authors recommend immunological screening; this rests on one patient.
differential_diagnoses:
- name: Rothmund-Thomson syndrome type 2
  disease_term:
    preferred_term: Rothmund-Thomson syndrome type 2
    term:
      id: MONDO:0016369
      label: Rothmund-Thomson syndrome type 2
  description: >-
    The RECQL4-related form of Rothmund-Thomson syndrome shares short stature,
    radial ray defects, gastrointestinal symptoms and cancer predisposition
    with RAPADILINO.
  distinguishing_features:
  - Poikiloderma is the hallmark of RTS and has not been observed in typical RAPADILINO.
  - Alopecia and loss of eyebrows and eyelashes occur in RTS but not in RAPADILINO.
  - Osteosarcoma dominates the RTS cancer spectrum, whereas RAPADILINO patients also develop lymphoma.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, patients with RAPADILINO syndrome do not have alopecia or the absence of eyebrows and eyelashes, features that are usually encountered in RTS."
    explanation: Names the hair findings that separate RTS from RAPADILINO.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When evaluating differences among RECQL4 syndromes it seems that a poikilodermatous rash is a distinguishing feature between RTS and RAPADILINO."
    explanation: Identifies poikiloderma as the distinguishing feature.
  - reference: PMID:15897384
    reference_title: A patient with Rothmund-Thomson syndrome and all features of RAPADILINO.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with RTS may possess all features of RAPADILINO."
    explanation: Shows the boundary is not absolute, since an RTS patient with poikiloderma had every RAPADILINO criterion.
- name: Baller-Gerold syndrome
  disease_term:
    preferred_term: Baller-Gerold syndrome
    term:
      id: MONDO:0009039
      label: Baller-Gerold syndrome
  description: >-
    The RECQL4-positive form of Baller-Gerold syndrome shares radial defects
    and growth restriction with RAPADILINO.
  distinguishing_features:
  - Craniosynostosis is a feature of BGS and not of RAPADILINO.
  - Poikiloderma is a hallmark of BGS and is absent in typical RAPADILINO.
  evidence:
  - reference: PMID:20113479
    reference_title: Rothmund-Thomson syndrome.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "For example, cataracts are seen only in RTS, joint dislocation and patellar hypoplasia are seen only in RAPADILINO and craniosynostosis only in BGS."
    explanation: Places craniosynostosis in BGS and joint dislocation and patellar hypoplasia in RAPADILINO.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All these syndromes, Rothmund-Thomson (RTS), RAPADILINO and Baller-Gerold (BGS), are characterized by growth retardation and radial defects, but RAPADILINO syndrome lacks the main dermal manifestation, poikiloderma that is a hallmark feature in both RTS and BGS."
    explanation: States the shared features and the absence of poikiloderma that separates RAPADILINO from BGS.
discussions:
- discussion_id: rapadilino_dual_cancer_predisposition
  prompt: >-
    Why does the RAPADILINO exon 7 allele predispose to lymphoma as well as
    osteosarcoma, when the allelic Rothmund-Thomson syndrome type 2 is
    dominated by osteosarcoma, and what is the true lifetime cancer risk?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Predisposition to Osteosarcoma and Lymphoma
  - phenotypes#Lymphoma
  rationale: >-
    The only incidence figure comes from 15 Finnish patients, and the same
    cohort was described as having no significant cancer risk six years
    earlier, so the estimate rests on a handful of events and on how long
    patients were followed. The authors state that existing knowledge of
    RECQL4 function cannot explain the lymphoma component, and no study has
    compared the exon 7 protein with truncating RTS alleles in lymphoid cells.
  evidence:
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the basis of the existing data from the function of RECQL4 it is not possible to explain why the Finnish RAPADILINO patients are susceptible to developing both lymphoma and osteosarcoma."
    explanation: The authors of the incidence study state the mechanistic gap directly.
- discussion_id: rapadilino_mutant_versus_null_alleles
  prompt: >-
    Do mouse Recql4 null alleles model RAPADILINO when the patient allele is an
    in-frame deletion that keeps part of RECQL4's activity?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Predisposition to Osteosarcoma and Lymphoma
  - pathophysiology#Biallelic RECQL4 Pathogenic Variants
  rationale: >-
    Conditional Recql4 deletion in osteoblast progenitors reproduces the
    benign skeletal phenotype but does not initiate osteosarcoma, and
    tumors arising on a p53-null background retained Recql4, leading the
    authors to propose that cancer susceptibility depends on mutant rather
    than null alleles. The RAPADILINO allele is exactly such a mutant allele,
    retaining strand annealing while losing helicase activity and nuclear
    retention, so null models may systematically miss its cancer phenotype.
  evidence:
  - reference: PMID:25859855
    reference_title: The DNA helicase recql4 is required for normal osteoblast expansion and osteosarcoma formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that tumor suppression and osteosarcoma susceptibility are most likely a function of mutant, not null, alleles of RECQL4."
    explanation: States the null-versus-mutant allele mismatch that applies to the RAPADILINO exon 7 allele.
- discussion_id: rapadilino_poikiloderma_absence
  prompt: >-
    What determines whether a biallelic RECQL4 genotype produces RAPADILINO,
    without poikiloderma, rather than Rothmund-Thomson syndrome type 2 or
    Baller-Gerold syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#RECQL4
  - differential_diagnoses#Rothmund-Thomson syndrome type 2
  rationale: >-
    The exon 7 allele is specific to RAPADILINO, but other alleles are shared
    among the three syndromes, a non-Finnish RAPADILINO patient developed a
    poikilodermatous rash, and an RTS patient with poikiloderma met every
    RAPADILINO criterion. Clinical expression also differs within sib pairs
    carrying the same variants. No genotype rule or modifier separating the
    three phenotypes has been identified.
  evidence:
  - reference: PMID:16617241
    reference_title: The versatile RECQL4.
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, it is especially difficult to draw precise genotype-phenotype correlations in RECQL4 related syndromes."
    explanation: A review states the absence of a genotype-phenotype rule.
  - reference: PMID:9571286
    reference_title: Rapadilino syndrome--a non-Finnish case.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient developed a poikilodermatous skin rash, suggesting overlap with the Rothmund-Thompson syndrome."
    explanation: A RAPADILINO patient with poikiloderma shows that the defining skin criterion is not absolute.
  - reference: PMID:18716613
    reference_title: The mutation spectrum in RECQL4 diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it was noted that the clinical picture of the brothers was significantly milder than their sisters' and it would have been difficult to suspect the RAPADILINO diagnosis without the sister with typical features"
    explanation: Variable expression between siblings with the same genotype points to factors beyond the RECQL4 alleles.
- discussion_id: rapadilino_infantile_diarrhea_mechanism
  prompt: >-
    What causes the infantile diarrhea of RAPADILINO syndrome, and does it
    contribute to the postnatal growth deficit?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Infantile Diarrhea
  - pathophysiology#Generalized Growth Restriction
  rationale: >-
    Infantile diarrhea is a defining feature of the syndrome, yet no study has
    examined intestinal histology, absorptive function or epithelial turnover
    in RAPADILINO patients, and no Recql4 model has been characterized for an
    intestinal phenotype. Whether it reflects proliferation failure in the
    rapidly renewing intestinal epithelium, an immune component, or something
    else is unknown, which is why it has no causal edge in this entry.
  evidence:
  - reference: PMID:12952869
    reference_title: Molecular defect of RAPADILINO syndrome expands the phenotype spectrum of RECQL diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The tissue expression of Recql4 in mouse well agrees with the tissue symptoms of RAPADILINO."
    explanation: The only mechanistic statement about tissue involvement is a correspondence of expression pattern, which does not explain the diarrhea.
- discussion_id: rapadilino_immunodeficiency_frequency
  prompt: >-
    Is immunodeficiency a recurrent feature of RAPADILINO syndrome or an
    isolated finding in one patient?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Lymphopenia
  - phenotypes#Decreased Circulating IgG
  rationale: >-
    Combined T, B and NK lymphopenia with antibody deficiency has been
    reported in one RAPADILINO child, and immune abnormalities have been
    described in Rothmund-Thomson syndrome, but no cohort of RAPADILINO
    patients has had immunological evaluation. The mechanism, whether reduced
    thymic output, defective class-switch recombination, or both, is also
    unknown.
  evidence:
  - reference: PMID:26064716
    reference_title: "Immunodeficiency in a Child with Rapadilino Syndrome: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Larger studies will be necessary to conclude if the immunological abnormalities found in this patient are indeed common in children with RS as well."
    explanation: The case authors state that the frequency of the finding is unknown.
notes: >-
  Lump/split. RAPADILINO is curated as its own Disease entry rather than as a
  subtype of Rothmund-Thomson syndrome (kb/disorders/Rothmund-Thomson_Syndrome.yaml),
  matching the treatment of Baller-Gerold syndrome. MONDO keeps it as a
  separate class (MONDO:0009955) under dysostosis and congenital limb
  malformation rather than among the genodermatoses, the defining dermatological
  feature of RTS is absent, its defining malformations (patellar aplasia,
  joint dislocation, palatal defect) are not RTS criteria, and it has its own
  founder allele and cancer spectrum. The RECQL4 spectrum framing is accepted
  at the level of mechanism: the RECQL4 replication-initiation and
  progenitor-proliferation nodes here follow the Baller-Gerold entry, with the
  RAPADILINO-specific exon 7 protein defects (helicase and ATPase loss,
  nuclear retention failure) added upstream.
  Phenotypes without causal edges. Infantile diarrhea, vomiting and feeding
  difficulties have no published mechanism and are left unconnected, recorded
  as a knowledge gap. Lymphopenia and decreased IgG rest on a single case and
  their mechanism is unknown. The slender nose and brownish skin spots are
  descriptive features without a mechanism. Normal intelligence is part of the
  definition and is not recorded as a phenotype.
  Phenotype frequencies are not given because the only tabulated frequencies
  (PMID:18716613) pool RAPADILINO, Rothmund-Thomson and Baller-Gerold patients.

- name: Disrupted HOMER2-CDC42 Coupling at the Hair Bundle
  biological_scale: MOLECULAR
  description: HOMER2/Cupidin binds activated CDC42 through a C-terminal region mapped to residues 191–283 in biochemical and neuronal experiments. Deletion of residues 191–230 disrupts binding while largely preserving self-multimerization. CDC42 activity in mouse stereocilia and the Cdc42 conditional-knockout phenotype make this a candidate auditory pathway. The cited DFNA68 studies do not establish a disease-allele defect in a native hair-cell HOMER2–CDC42 complex. The 2025 EVH1-interface prediction must be distinguished from the experimentally mapped C-terminal binding region.
  mechanism_confidence: PROVISIONAL

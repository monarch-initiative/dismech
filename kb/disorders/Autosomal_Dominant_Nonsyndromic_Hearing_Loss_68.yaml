  category: Auditory
  description: >-
    The defining feature and, across every reported family, the only one. The loss is
    sensorineural - bone conduction thresholds in the founding family excluded a
    conductive component - and it deteriorates for decades rather than being static,
    reaching severe or profound levels.
  frequency: OBLIGATE
  phenotype_term:

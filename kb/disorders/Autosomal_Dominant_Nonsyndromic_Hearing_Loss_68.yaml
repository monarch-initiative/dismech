    allele_type: frameshift variant producing a premature stop codon within the CDC42-binding domain
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      The recorded value follows the measured properties of the truncated product -
      reduced multimerisation with a stable, mislocalised protein still present in the
      cell - which is the signature of interference with wild-type product rather than of
      its absence. It is not the only reading the literature offers: the Spanish authors
      state explicitly that the mechanism is either a gain of function of the aberrant
      C-terminal tail or a dominant negative, and do not choose between them. That
      unresolved alternative is recorded here rather than smoothed away, and the
      single-valued slot should not be read as a settled answer.

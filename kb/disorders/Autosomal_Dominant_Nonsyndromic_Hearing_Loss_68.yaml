- name: HOMER2 C-Terminal Extension Variant
  biological_scale: MOLECULAR
  description: C-terminal extension alleles include c.1064A>G (stop-to-tryptophan; predicted ten-residue extension) (NM_199330.3), p.Arg345Glufs*64 (NM_199330) and p.Asp342Argfs*54 (NM_004839.4). The nonstop allele remained detectable in patient blood RNA, and its zebrafish overexpression reduced acoustic startle responses. The p.Arg345Glufs*64 study found reduced neuromast FM1-43 uptake and altered tap-startle behavior compared with controls; an artificial p.Arg345* comparator also reduced dye uptake, while the extension produced a larger behavioral disturbance. These results support abnormal protein effects but do not separate gain of function from dominant-negative action. AlphaFold-based changes in an EVH1-associated CDC42 interface are predictions, whereas biochemical mapping places the established CDC42-binding region in the C-terminal coiled coil. The p.Asp342Argfs*54 report provides segregation and clinical evidence without an allele-specific functional assay.

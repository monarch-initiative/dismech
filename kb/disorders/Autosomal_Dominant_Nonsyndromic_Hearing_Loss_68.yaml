  notes: HOMER2 maps to 15q25.2. The literature uses 343- and 354-residue isoforms; p.Arg185Pro and p.Arg196Pro denote the same founding missense change on those different isoforms. Reported variants include coiled-coil missense, frameshift truncations, stop-loss/frameshift extensions and an Italian p.Thr198_Thr199del in-frame deletion. The Italian family showed segregation, but a later study classified that deletion as uncertain; p.Pro63Leu is also listed as uncertain and should not be promoted to a confirmed DFNA68 cause. ClinGen’s August 2020 gene–disease classification was Moderate, predating several later families. Its February 2026 dosage scores of zero mean no evidence for a dosage-sensitive disease mechanism in that curation, not proof against all such mechanisms.
  evidence:
  - reference: PMID:25816005
    reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These data provide compelling evidence that HOMER2 is required for normal hearing and that its sequence alteration in humans leads to ADNSHL through a dominant-negative mode of action.
    explanation: The gene-disease relationship as first established, together with its proposed mode of action.
  - reference: PMID:30047143
    reference_title: Whole exome sequencing identified a second pathogenic variant in HOMER2 for autosomal dominant non-syndromic deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This is the second family reported globally with hearing loss caused by a variant in HOMER2.
    explanation: The independent replication of the gene-disease relationship in an unrelated family, which is what moved it past a single-pedigree claim.
  - reference: PMID:25816005
    reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: HOMER2 belongs to the homer family of post-synaptic density scaffolding proteins and is expressed as two isoforms, HOMER2 isoform 1 (NM_004839, 343 aa) and isoform 2 (NM_199330.2, 354 aa), which differ by 11 amino acids.
    explanation: The two-isoform fact behind the two protein numberings. BACKGROUND because it is established transcript annotation restated in this paper's results.
  - reference: PMID:25816005
    reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: The recessive phenotype exhibited by null alleles of Homer2 makes it a strong candidate for autosomal recessive hearing loss due to loss of function in humans as well.
    explanation: The untested recessive prediction, recorded as the authors made it.
  - reference: PMID:33105617
    reference_title: Lights and Shadows in the Genetics of Syndromic and Non-Syndromic Hearing Loss in the Italian Population.
    supports: SUPPORT
    snippet: p.(Thr198_Thr199del)) segregating within the family in an autosomal dominant fashion.
    explanation: Italian family 32 provides in-frame deletion segregation evidence. Later classification differs, so segregation alone is not treated as definitive pathogenicity.
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: CGGV:assertion_9158c2a6-f11b-47b4-ac7d-45471f7255a1-2020-08-31T170000.000Z
    reference_title: HOMER2 / nonsyndromic genetic hearing loss (Moderate)
    supports: SUPPORT
    snippet: there is moderate evidence to support this gene-disease association
    explanation: ClinGen Hearing Loss Working Group classification approved 31 August 2020; later studies are considered separately here.
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
diagnosis:
- name: Comprehensive hearing-loss gene panel or exome sequencing
  description: Use a hearing-loss multigene panel that includes HOMER2 or genomic testing, with segregation and variant interpretation in the family context. Clinical configuration is not specific to HOMER2, and low-frequency loss does not exclude it. Variants of uncertain significance cannot confirm or rule out the diagnosis.
  evidence:
  - reference: PMID:33809266
    reference_title: A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study also highlights the importance of using NGS-based diagnostic methods to identify mutations in low-prevalence deafness genes like HOMER2
    explanation: The diagnostic argument in the authors' own words, and the reason a gene this rare needs a broad panel to be found at all.
  - reference: PMID:41351289
    reference_title: A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole exome sequencing analysis was conducted to detect the disease-causing variant. Co-segregation analysis was performed using Sanger sequencing.
    explanation: The two-step route - discovery by sequencing, confirmation by segregation - as applied in practice.
  - reference: PMID:33809266
    reference_title: A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Sixty-seven of these loci and 50 of these genes are associated with autosomal dominant NSSNHL
    explanation: The size of the differential a panel has to cover, which is why the diagnosis is made by broad sequencing rather than by a targeted test. BACKGROUND because it restates a field count from a gene-count resource.
  - reference: PMID:41351289
    reference_title: A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CT scans of the proband ruled out middle‐ and inner‐ear malformations
    explanation: The one imaging result published for a DFNA68 patient, cited to record that it was normal - imaging excludes alternatives here rather than establishing the diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    snippet: The identification of variant(s) of uncertain significance cannot be used to confirm or rule out the diagnosis.
    explanation: General genetic hearing-loss diagnostic guidance, especially relevant to uncertain HOMER2 alleles.
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Pure tone audiometry with serial follow-up
  description: Air- and bone-conduction audiometry characterizes severity and configuration and assesses a conductive component; age-appropriate objective testing may be needed in young children. Serial audiometry measures individual change. Differences among relatives’ audiograms should not substitute for longitudinal observations in one person.
  evidence:
  - reference: PMID:25816005
    reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Linear regression analyses of threshold on age were used to evaluate progression of hearing impairment at individual frequencies.
    explanation: The method by which the one quantitative natural-history figure for this disease was obtained.
  - reference: PMID:41351289
    reference_title: A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The older patients (43 years old) displayed flatter audiograms, indicating hearing loss across all frequencies. Accordingly, the different forms of auditory configuration may present different stages of the disease.
    explanation: The authors propose a stage explanation for cross-sectional configurations; individual longitudinal audiometry is needed to test it.
- name: Assessment for vestibular and syndromic findings
  description: The 2026 family had normal tandem gait and Romberg examinations, and the founding family had no examination findings consistent with syndromic hearing loss. These observations support the nonsyndromic presentation without excluding every comorbidity or subclinical vestibular abnormality.
  evidence:
  - reference: PMID:41351289
    reference_title: A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Tandem gait and Romberg tests did not reveal any symptoms of vestibular dysfunction in all family members.
    explanation: Observed negative examination finding in the reported family; does not establish a universal exclusion.
  - reference: PMID:25816005
    reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical examination was negative for any findings consistent with syndromic hearing loss and also ruled out autoimmune phenotypes.
    explanation: Observed negative examination finding in the reported family; does not establish a universal exclusion.
treatments:
- name: Hearing Amplification
  description: Hearing aids, communication support and repeated audiological review are general care options chosen according to severity and personal communication goals. A nonstop-variant proband was fitted with hearing aids at age 47, but that report did not quantify benefit. No HOMER2-directed treatment efficacy is established by these clinical reports.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  notes: Hearing-aid fitting is retained as a clinical action without binding the device itself as the procedure. Device choice and communication support require individual assessment.
  evidence:
  - reference: PMID:37371710
    reference_title: 'Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants.
    explanation: Cited at the group level deliberately. This is a narrative review of autosomal dominant nonsyndromic hearing loss as a class, not of DFNA68, so it supports the management approach for the class rather than an outcome in this disorder. Graded OTHER because a narrative review reports no study of its own.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    snippet: Habilitation for hearing loss includes improved access to sound through hearing aids or cochlear implants
    explanation: General hearing-loss management; not a DFNA68-specific efficacy estimate.
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Cochlear Implantation
  description: Cochlear implantation may be considered when severe or profound hearing loss limits benefit from amplification. One 61-year-old patient carrying p.Arg345Glufs*64 had 8% bilateral speech discrimination before implantation and improved speech recognition at three and six months. This single-patient outcome supports potential benefit without predicting all carriers’ response. Preserved spiral-ganglion appearance in three-month-old null mice does not guarantee the human neural substrate throughout life.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  target_mechanisms:
  - target: Hair Cell Dysfunction
    treatment_effect: BYPASSES
    description: An implant does not repair the hair cell; it stimulates the spiral ganglion directly, bypassing the transduction step that has failed. BYPASSES rather than RESTORES because nothing about the hair-cell lesion changes.
  evidence:
  - reference: PMID:40515814
    reference_title: Impact of HOMER2 frameshift extension variant on auditory function and development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Post-Cochlear Implantation speech outcome speech recognition improves significantly at 3- and 6-months post-implantation across various syllable and sentence conditions.
    explanation: The only published implantation outcome in a genetically confirmed DFNA68 patient. One patient, no control, and the follow-up is six months.
  - reference: PMID:40515814
    reference_title: Impact of HOMER2 frameshift extension variant on auditory function and development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: HOMER2 is a causative gene in elderly patients, particularly those in their 60 s or 70 s, who develop profound SNHL and require CI
    explanation: The authors' statement of when in the disease course implantation becomes the relevant intervention.
- name: Genetic Counselling and Cascade Testing
  description: For a heterozygous pathogenic variant, each child has a 50% chance of inheriting the variant. That transmission probability is distinct from age-dependent expression, penetrance and severity. Counseling and family testing should address uncertain variants, variable onset and continued audiological follow-up of carriers. The founding family’s decline rate cannot provide an individual prognosis for every family.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    snippet: Individuals with autosomal dominant hearing loss have a 50% chance of transmitting the pathogenic variant to each child.
    explanation: Inheritance risk is distinct from predicting onset or severity.
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Audiological Surveillance and Noise Conservation
  therapeutic_modality: OTHER
  description: Repeat audiological assessment to detect individual progression and adjust hearing or communication support. General genetic hearing-loss guidance advises limiting sustained loud-noise exposure; this is preventive care rather than a demonstrated HOMER2 disease-modifying treatment.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf
    supports: SUPPORT
    snippet: persons with documented hearing loss should be counseled appropriately and repeated overexposure to loud noises should be avoided
    explanation: General prevention guidance; no HOMER2-specific intervention trial is implied.
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
animal_models:
- name: Homer2 constitutive knockout mouse
  species: Mouse
  genotype: Homer2 targeted deletion, homozygous and heterozygous
  publication: PMID:25816005
  genes:
  - preferred_term: HOMER2
    term:
      id: hgnc:17513
      label: HOMER2
  description: Constitutive Homer2-null mice on a C57BL/6J background were tested at P14, P28 and P56. Homozygotes developed progressive ABR/DPOAE abnormalities and profound loss by P56; heterozygotes had thresholds comparable to wild type. P56 whole mounts showed no obvious hair-cell loss, and supplementary S5 showed no obvious spiral-ganglion degeneration at three months. The homozygous deletion models gene requirement rather than a heterozygous patient allele.
  modeled_mechanisms:
  - target: Hair Cell Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Auditory dysfunction accompanies qualitatively preserved P56 hair-cell morphology.
    limitations: The genotype is a homozygous null rather than a patient heterozygous variant. Qualitative staining at one age does not exclude subtle structural damage, later degeneration or human pathology.
    readouts:
    - name: P56 inner and outer hair-cell appearance by phalloidin staining
      target: Hair Cell Dysfunction
      direction: UNCHANGED
      interpretation: No obvious loss was reported; this was an age-bounded qualitative histological assessment.
      evidence:
      - reference: PMID:25816005
        reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: No differences in IHCs and OHCs were observed in any animals regardless of genotype indicating the absence of Homer2 does not impair hair cell formation and development
        explanation: The measurement itself, reported as a negative across all genotypes.
    evidence:
    - reference: PMID:25816005
      reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: mouse mutants homozygous for the targeted deletion of Homer2 present with early-onset rapidly progressive hearing loss
      explanation: Establishes that this model is informative for the hearing phenotype at all, which is the precondition for reading its hair-cell result.
  - target: Progressive Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces the audiometric shape of the human disease - progressive, starting at high frequencies, eventually involving all of them - on a radically compressed timescale.
    limitations: The complete deletion, early onset and rapid course differ from heterozygous patients. This model cannot establish a human decline rate.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: Rising thresholds over successive ages are the measurement that makes the model's phenotype progressive rather than static.
      evidence:
      - reference: PMID:25816005
        reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Its complete absence in mice leads to early onset progressive hearing loss starting at the high frequencies and rapidly involving all frequencies.
        explanation: The authors' summary of the threshold data, naming both onset and direction of spread.
    evidence:
    - reference: PMID:25816005
      reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we measured auditory brainstem responses (ABR), an electrophysiological hearing test that reflects the activity of afferent auditory neurons downstream of IHCs
      explanation: Names the assay and what it reports on, which is what licenses reading the mouse result as a hearing phenotype rather than a behavioural one.
- name: Zebrafish HOMER2 missense mRNA overexpression model
  species: Zebrafish
  genotype: wild-type embryos injected with in vitro transcribed mutant human HOMER2 mRNA
  publication: PMID:25816005
  description: The 2015 study injected human p.Arg185Pro or wild-type HOMER2 mRNA into wild-type embryos. Mutant expression reduced otic-vesicle size and kinocilium number at three days; shorter kinocilia were noted qualitatively but required confirmation. Splice-blocking morpholinos did not alter the tested ear morphology. These results support a harmful mutant effect in the assay, without directly demonstrating interference with normal HOMER2 or measuring mature auditory thresholds.
  modeled_mechanisms:
  - target: HOMER2 Coiled-Coil Missense Variant
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: A disease missense allele perturbs embryonic otic and kinocilium morphology during transient overexpression.
    limitations: Zebrafish homer2 is 67 percent identical to the human protein, the injected message is supraphysiological and transient, and the readout is otic vesicle size and kinocilium number in an embryo rather than hearing in a mature cochlea. A fish has no cochlea, no endocochlear potential and no outer-hair-cell amplifier, so the assay reports that the allele is harmful to hair cells, not how it causes human deafness.
    readouts:
    - name: Otic vesicle size in injected larvae
      target: HOMER2 Coiled-Coil Missense Variant
      direction: DECREASED
      interpretation: A mutant-associated morphological effect; this does not itself resolve dominant-negative action from another toxic gain of function.
      evidence:
      - reference: PMID:25816005
        reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: injection of in vitro synthesized mRNA encoding HOMER2 P185-mutant RNA (P185RNA) resulted in significantly smaller ear size in larvae as compared to injections with WT HOMER2
        explanation: The measurement, with its wild-type-mRNA control stated in the same sentence.
    evidence:
    - reference: PMID:25816005
      reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although knockdown of homer2 altered neither ear size nor morphology (p>0.5)
      explanation: The morpholino control lacked the tested ear-morphology defect. Together with mutant overexpression, this supports an altered-protein effect without directly distinguishing dominant-negative interference from another gain of function.
- name: Zebrafish HOMER2 nonstop mRNA overexpression model
  species: Zebrafish
  genotype: Wild-type embryos injected with 80 pg human c.1064A>G or wild-type HOMER2 mRNA
  publication: PMID:37173411
  description: At five days, morphologically normal selected larvae carrying mutant mRNA had fewer acoustic-startle responders to 70-dB, 400-Hz stimuli, while visual-motor responses were unchanged. Ear size and injected RNA abundance at three days were not significantly different. This experiment did not measure FM1-43 uptake.
  modeled_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Supports an auditory behavioral effect of the nonstop allele.
    limitations: Transient overexpression and larval acoustic-startle behavior do not reproduce endogenous dosage, human cochlear physiology or longitudinal progression. Preserved visual-motor responses reduce gross locomotor confounding without proving an exclusively peripheral lesion.
    readouts:
    - name: Acoustic-startle responding larvae
      target: Progressive Sensorineural Hearing Loss
      direction: DECREASED
      interpretation: Reduced response probability to the tested acoustic stimulus.
      evidence:
      - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10326047/
        reference_title: Identification and in vivo functional investigation of a HOMER2 nonstop variant causing hearing loss - PMC
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: ASR data analyses, from three independent tests, highlighted a significant decrease in the number of responsive larvae exposed to noise (70 db, 400 HZ) in the G1064 group compared to the A1064 group
        explanation: Mutant-injected larvae showed reduced acoustic-startle responsiveness relative to wild-type RNA controls; this does not measure progressive human cochlear loss.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10326047/

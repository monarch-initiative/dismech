  notes: >-
    Conformance is asserted at the module's sensory-epithelium-insult node and not at
    "Hair Cell Mechanotransduction Failure and Death". The module's middle nodes run
    through ionic disruption, oxidative stress and apoptotic hair-cell death, and
    hair-cell death is specifically what the HOMER2 models do not show: the homozygous
    null mouse is deaf with a normal complement of inner and outer hair cells, and the
    zebrafish allele models lose hair-cell function with unchanged hair-cell counts.
    Substituting the module's chain here would assert a mechanism this disease has been
    shown not to have.

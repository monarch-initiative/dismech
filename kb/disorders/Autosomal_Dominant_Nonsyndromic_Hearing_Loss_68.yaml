- name: HOMER2 C-Terminal Extension Variant
  biological_scale: MOLECULAR
  description: >-
    A third allele class leaves the reading frame running past the point where it should
    stop. It includes a nonstop substitution that converts the termination codon to a
    tryptophan codon and adds ten residues, a frameshift that alters the last ten residues
    and adds fifty-three more, and a seven-nucleotide deletion producing an extended
    incorrect C terminus.

    These alleles are not simply weaker truncations. Transcripts carrying the nonstop
    variant escape nonstop decay, so the aberrant product is made; the frameshift-extension
    allele lies in the last exon and so is likewise not expected to be removed by
    nonsense-mediated decay. Structure prediction for the longest of them puts the damage
    not in the coiled coil, where the residue sits, but in the distant EVH1 domain, with
    the predicted CDC42 interface disturbed while dimer and tetramer formation is
    preserved. On that reading the extension acts by adding something, which is why this
    node is graded as a gain of function while the other two allele classes are not.

inheritance:
- name: Autosomal dominant
  description: Heterozygous HOMER2 variants segregate with hearing loss in multigeneration pedigrees. Onset and severity vary; clinically unaffected young carriers require age-appropriate follow-up. Normal hearing in heterozygous null mice through eight weeks argues against simple dosage reduction for that model, but does not exclude all human dosage mechanisms or establish direct interference between mutant and normal proteins.

- name: Low-Frequency Hearing Loss at Presentation
  category: Auditory
  description: >-
    One reported proband, aged eighteen with onset at seventeen, presented with the
    inverse of the usual pattern: moderate loss confined to the low frequencies, an
    ascending audiogram. Older affected members of the same family had flat audiograms
    with loss across all frequencies.

    The reporting authors read this as a stage effect rather than as a different disease,
    and the entry follows them. It matters diagnostically: an ascending audiogram in a
    young adult would not usually prompt a DFNA68 hypothesis, and this family shows that
    it should not exclude one.
  frequency: VERY_RARE
  phenotype_term:
    preferred_term: Low-frequency sensorineural hearing impairment
    term:
      id: HP:0008573
      label: Low-frequency sensorineural hearing impairment
  notes: >-
    VERY_RARE reflects that this is a single reported proband against a literature in
    which every other described family starts at the high frequencies. It is not a measured
    frequency; no denominator exists.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the initially high-frequency hearing loss observed in the previously reported families, the young proband in our study (IV:4, 18 years old) exhibited typical low-frequency hearing loss."
    explanation: The observation itself, stated against the background it departs from.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The older patients (43 years old) displayed flatter audiograms, indicating hearing loss across all frequencies. Accordingly, the different forms of auditory configuration may present different stages of the disease."
    explanation: >-
      The authors' own reading of the discrepancy, which is what justifies curating this as
      a presentation of the same disease rather than as a contradiction.
- name: Tinnitus
  category: Auditory
  description: >-
    Reported in some affected members of two families and explicitly absent in two others.
    It is curated because it is the only symptom besides hearing loss that any of the six
    primary reports records, and because a family in which tinnitus is prominent looks different to a
    clinician from one in which it is not.

    Deliberately not wired into the pathograph. Tinnitus accompanying cochlear hearing
    loss is unsurprising, but none of the six primary reports proposes a mechanism for it,
    and the entry's hair-cell nodes were not built to explain it. Drawing an edge from
    "Hair Cell Functional Failure Without Hair Cell Loss" would assert a causal claim
    that nothing cited here makes. The disconnection is the honest state of the evidence,
    not an oversight.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of tinnitus or cranial tinnitus, however, has only been displayed by some affected members of the Chinese family and this phenotype was not present in any of the other two families."
    explanation: >-
      Both halves of the frequency claim in one sentence: present in some members of one
      family, absent in two others.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals in this family complain of tinnitus but do not experience vertigo, and their intelligence and speech functions are normal."
    explanation: >-
      A second family in which tinnitus is common, which is why the band is OCCASIONAL
      across the disease rather than VERY_RARE.
- name: Absence of Vestibular Dysfunction
  category: Vestibular
  diagnostic: true
  description: >-
    No vertigo, imbalance or vestibular involvement has been reported in any DFNA68
    family, and in the most recently reported family it was actively looked for: tandem
    gait and Romberg testing were performed in all family members and were normal. That is
    a substantive negative rather than an omission - it is the result of a test, not the
    silence of a report - and it is one of the things that separates a DFNA68 presentation
    from the vestibulocochlear differential a clinician would otherwise be working
    through.

    Curated as a REFUTED phenotype with no phenotype_term and no frequency, following the
    pattern used for "Absence of Retinitis Pigmentosa" in
    Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11. The schema has no negation slot and
    FrequencyEnum has no EXCLUDED value, so binding a vestibular HP term with a frequency
    here would export as the assertion that DFNA68 patients have vestibular dysfunction,
    which is the opposite of the finding.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms of vertigo, balance disorders, and vestibular system involvement were not reported."
    explanation: >-
      A statement made across the reported families, not only about the one this paper
      describes.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Tandem gait and Romberg tests did not reveal any symptoms of vestibular dysfunction in all family members."
    explanation: >-
      The tested negative, in one family, which is stronger than the reported absence above
      because it names the examination that was performed.
- name: Absence of Syndromic Features
  category: Constitutional
  diagnostic: true
  description: >-
    DFNA68 is nonsyndromic, and that is a finding rather than a default. The founding
    family was examined for syndromic features and for autoimmune causes and had neither;
    a later family had normal intelligence and speech. The one caveat worth carrying is
    that a zebrafish study of the longest extension allele found an increase in cardiac
    anomalies and raised the possibility of a broader effect in humans, while noting that
    its own patient had no cardiac abnormality. That is curated as an open question below
    rather than as a phenotype.

    Curated as a REFUTED phenotype, with no phenotype_term and no frequency, for the same
    reason as the vestibular entry above.
  evidence:
  - reference: PMID:25816005
    reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical examination was negative for any findings consistent with syndromic hearing loss and also ruled out autoimmune phenotypes."
    explanation: >-
      The examination that established the nonsyndromic label in the family the disease
      was defined in.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists and none of the reporting groups offers one; each
    describes the disorder qualitatively as rare or extremely rare. What can be counted is
    families: the founding European pedigree in 2015, then Chinese, Spanish, Sicilian and
    Italian families, then an isolated patient and a further Chinese family, with the two
    most recent reports describing their alleles as the seventh and the sixth HOMER2 variant
    on record. Fewer than ten unrelated families is therefore the honest statement of the
    literature's size.

    prevalence_class is the qualitative ULTRA_RARE tier and no rate_per_100000 is given,
    because no numerator and no denominator have been published and a band beside this
    note would be an invention. The tier is compatible with measure_type
    CASES_IN_LITERATURE, which is what is actually being reported.

    The two published counts disagree by one. They were written months apart and enumerate
    the variant list differently, and neither group reconciles its count with the other's.
    Both are quoted below rather than reconciled here.
  evidence:
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hearing loss caused by HOMER2 mutations is an extremely rare disorder."
    explanation: The qualitative rarity statement from a group that reported one of the families.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only five heterozygous variants in the HOMER2 gene have been reported worldwide in five isolated families of European, Chinese, Sicilian, Italian and Spanish origins"
    explanation: >-
      A count of families and their origins, which is the closest thing to a denominator
      the literature provides.
  - reference: PMID:40515814
    reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our review found that this frameshift extension variant is only the seventh HOMER2 variant documented in patients with SNHL."
    explanation: >-
      The other published count, quoted alongside the first because the two do not agree
      and neither should be presented as settled.
progression:
- phase: Presymptomatic
  notes: >-
    Hearing is normal through infancy and early childhood and speech is acquired normally,
    so the disorder is invisible to newborn hearing screening. In the founding family a
    two-year-old carrier had not had a formal auditory brainstem response performed, which
    is the practical shape of this phase: carriers are identified genetically before they
    are identified audiometrically.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prelingual hearing loss is present before speech develops and usually begins before 3 years of age, whereas post‐lingual hearing loss occurs after the development of normal speech"
    explanation: >-
      The definition the reporting group applied when classifying this disorder as
      postlingual, which is what establishes that a presymptomatic window exists.
- phase: High-frequency onset
  age_range: first to second decade in most reported families
  notes: >-
    Loss begins at the high frequencies, giving a down-sloping audiogram while speech
    frequencies are still relatively spared. Reported onset ages span the first decade in
    the European and Spanish families and the late teens to early twenties in the most
    recent Chinese one.
  evidence:
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals show progressive hearing loss affecting mainly the high frequencies (downsloping profile) with a typical onset in the first decade of life"
    explanation: The onset window and audiometric shape, generalised across three families.
- phase: Progressive decline
  notes: >-
    Thresholds deteriorate at a measured 1.2 to 1.6 dB per year across all frequencies in
    the founding family, and the lower frequencies are progressively drawn in so that the
    audiogram flattens. This is the one phase of the disease with a quantitative
    description.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degree of hearing loss ranges from mild to severe hearing loss and the annual threshold deterioration is between 1.2 and 1.6 dB HL per year across all frequencies"
    explanation: >-
      The rate and the severity range, restated across the reported families by the most
      recent group.
- phase: Severe-to-profound loss
  notes: >-
    The endpoint reached by older affected individuals, with profound loss and very poor
    speech discrimination. The one patient for whom a functional figure is published had
    8 percent speech discrimination bilaterally and proceeded to cochlear implantation in
    her sixties. How typical that timing is cannot be said from one patient.
  evidence:
  - reference: PMID:40515814
    reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SB1190-1923 began to experience more severe progressive SNHL in the high-frequency range starting in their 50 s."
    explanation: >-
      The late-severity trajectory in the one patient followed to implantation, quoted
      because it is the only longitudinal account of the disease's end stage.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    DFNA68 is not life-threatening and involves no organ system other than the ear, but it
    is lifelong, progressive and ends in severe or profound deafness in an adult who
    acquired speech normally and then lost access to it. The functional cost is documented
    at the severe end: one patient reached 8 percent bilateral speech discrimination and
    required cochlear implantation. Management is amplification, then implantation, then
    ongoing audiological follow-up; none of the six primary reports names a
    disease-modifying option.

    MODERATE rather than HIGH because the burden is confined to one sensory modality, is
    substantially correctable by devices whose benefit in this disease has been
    demonstrated, and carries no reported mortality or systemic morbidity. MODERATE rather
    than LOW because the deficit is progressive and permanent, and the endpoint is
    profound deafness.
  evidence:
  - reference: PMID:40515814
    reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten years after the onset of significant SNHL, SB1190-1923 had developed profound deafness with a speech discrimination score of only 8%"
    explanation: >-
      The functional severity reached, and the interval over which it was reached, in the
      one patient with a published longitudinal course.
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "age-matched patients in both families display quite similar hearing loss phenotypes consisting of early-onset, moderate-to-profound progressive hearing loss"
    explanation: The severity range across two independent families, which is what the band is set against.
genetic:
- name: HOMER2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: HOMER2
    term:
      id: hgnc:17513
      label: HOMER2
  notes: >-
    HOMER2 maps to chromosome 15q24.3 and has nine exons. Two transcripts are described,
    encoding a 343-residue and a 354-residue isoform, and both numbering systems appear in
    the DFNA68 literature for the same variants - the founding missense allele is
    p.Arg185Pro against the shorter isoform and p.Arg196Pro against the longer one. A
    reader comparing two DFNA68 papers will meet both spellings and they are not two
    alleles.

    Every reported allele is heterozygous, and the allele classes are curated as three
    separate pathophysiology nodes because their proposed mechanisms differ: a coiled-coil
    missense change acting as a dominant negative, frameshift truncations inside the
    CDC42-binding domain that destabilise the product and reduce its multimerisation, and
    extension variants that run past the stop codon and have been argued to act by gain of
    function. What unites them is a negative: none of them is haploinsufficiency.

    The mouse null phenotype led the founding authors to nominate HOMER2 as a candidate for
    autosomal recessive hearing loss in humans as well. No recessive HOMER2 patient appears
    among the nine PubMed records returned by the search recorded in the notes below, so
    that prediction is still open a decade later.
  evidence:
  - reference: PMID:25816005
    reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data provide compelling evidence that HOMER2 is required for normal hearing and that its sequence alteration in humans leads to ADNSHL through a dominant-negative mode of action."
    explanation: The gene-disease relationship as first established, together with its proposed mode of action.
  - reference: PMID:30047143
    reference_title: "Whole exome sequencing identified a second pathogenic variant in HOMER2 for autosomal dominant non-syndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second family reported globally with hearing loss caused by a variant in HOMER2."
    explanation: >-
      The independent replication of the gene-disease relationship in an unrelated family,
      which is what moved it past a single-pedigree claim.
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The HOMER2 gene maps to chromosome 15q24.3"
    explanation: >-
      The locus. BACKGROUND because it restates the gene's map position from an earlier
      source rather than reporting a mapping result of this study.
  - reference: PMID:25816005
    reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "HOMER2 belongs to the homer family of post-synaptic density scaffolding proteins and is expressed as two isoforms, HOMER2 isoform 1 (NM_004839, 343 aa) and isoform 2 (NM_199330.2, 354 aa), which differ by 11 amino acids."
    explanation: >-
      The two-isoform fact behind the two protein numberings. BACKGROUND because it is
      established transcript annotation restated in this paper's results.
  - reference: PMID:25816005
    reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The recessive phenotype exhibited by null alleles of Homer2 makes it a strong candidate for autosomal recessive hearing loss due to loss of function in humans as well."
    explanation: The untested recessive prediction, recorded as the authors made it.
diagnosis:
- name: Comprehensive hearing-loss gene panel or exome sequencing
  description: >-
    DFNA68 is reached by sequencing, not by any distinguishing clinical sign. Every
    reported family was found the same way - a targeted deafness gene panel or whole exome
    sequencing in a pedigree with dominant, postlingual, progressive sensorineural hearing
    loss, followed by Sanger segregation across the family. There is no biochemical
    marker and no audiometric pattern specific enough to point at HOMER2 rather than at any
    of the fifty-odd genes associated with autosomal dominant nonsyndromic hearing loss, and
    the one temporal bone CT reported in a DFNA68 proband was normal.

    The practical point the reporting groups make is about panel content rather than about
    technique: HOMER2 is a low-prevalence deafness gene, so whether it is found depends on
    whether it is on the panel that was ordered.
  evidence:
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study also highlights the importance of using NGS-based diagnostic methods to identify mutations in low-prevalence deafness genes like HOMER2"
    explanation: >-
      The diagnostic argument in the authors' own words, and the reason a gene this rare
      needs a broad panel to be found at all.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing analysis was conducted to detect the disease-causing variant. Co-segregation analysis was performed using Sanger sequencing."
    explanation: The two-step route - discovery by sequencing, confirmation by segregation - as applied in practice.
  - reference: PMID:33809266
    reference_title: "A Novel Truncating Mutation in HOMER2 Causes Nonsyndromic Progressive DFNA68 Hearing Loss in a Spanish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Sixty-seven of these loci and 50 of these genes are associated with autosomal dominant NSSNHL"
    explanation: >-
      The size of the differential a panel has to cover, which is why the diagnosis is made
      by broad sequencing rather than by a targeted test. BACKGROUND because it restates a
      field count from a gene-count resource.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CT scans of the proband ruled out middle‐ and inner‐ear malformations"
    explanation: >-
      The one imaging result published for a DFNA68 patient, cited to record that it was
      normal - imaging excludes alternatives here rather than establishing the diagnosis.
- name: Pure tone audiometry with serial follow-up
  description: >-
    Pure tone audiometry establishes the sensorineural character, the configuration and,
    over repeated visits, the rate. Bone conduction thresholds are what exclude a
    conductive component. Serial audiometry matters more here than in a static hearing
    loss: the audiogram's shape changes as the disease advances, so a single audiogram
    describes a stage rather than the disorder, and the rate of deterioration is only
    obtainable by regressing thresholds on age across visits.
  evidence:
  - reference: PMID:25816005
    reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linear regression analyses of threshold on age were used to evaluate progression of hearing impairment at individual frequencies."
    explanation: >-
      The method by which the one quantitative natural-history figure for this disease was
      obtained.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The older patients (43 years old) displayed flatter audiograms, indicating hearing loss across all frequencies. Accordingly, the different forms of auditory configuration may present different stages of the disease."
    explanation: >-
      Why one audiogram is not enough: configuration is stage-dependent in this disorder,
      on the reporting group's own reading.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids are the first-line intervention while thresholds remain within the range
    amplification can address. None of the six primary DFNA68 reports names a
    disease-modifying therapy or a trial, and no HOMER2-directed agent appears among them.
    What is specific to this disorder is the commitment rather than the modality: the loss is progressive at a measurable rate, so the useful clinical act
    is repeated audiological review that catches deterioration and re-fits, not a single
    fitting decision.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid fitting
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  notes: >-
    treatment_term carries no NCIT binding. NCIT:C183182 Hearing Aid is a device concept
    and is not reachable from NCIT:C25218 Clinical Intervention or Procedure, the root of
    the TreatmentTerm enum, and NCIT has no clinical-action term for hearing-aid fitting -
    searched with `runoak -i ols:ncit search "l^Hearing Aid"`, which returns
    NCIT:C183182 Hearing Aid, NCIT:C205713 Hearing Aid Fitter Audiologist, and two
    questionnaire items, none of which is a clinical action. A free-text preferred_term is
    what the ontology contract asks for here. This does not generalise to cochlear
    implantation below, which is a surgical procedure and does bind.

    No DFNA68-specific amplification outcome has been published, so the evidence is cited
    at the level of the disease class this disorder belongs to.
  evidence:
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants."
    explanation: >-
      Cited at the group level deliberately. This is a narrative review of autosomal
      dominant nonsyndromic hearing loss as a class, not of DFNA68, so it supports the
      management approach for the class rather than an outcome in this disorder. Graded
      OTHER because a narrative review reports no study of its own.
- name: Cochlear Implantation
  description: >-
    Implantation once amplification no longer delivers useful speech understanding. This
    disorder, unusually for one described in so few families, has a published outcome: a
    patient in her sixties with profound down-sloping loss and 8 percent bilateral speech discrimination
    was implanted, and speech recognition improved significantly at three and six months
    across syllable and sentence conditions.

    The mechanism supports the intervention in principle as well. The lesion is in the
    hair cell, upstream of the spiral ganglion neurons an implant stimulates, and the
    animal data show hair-cell dysfunction without hair-cell death, so there is no reason
    to expect the neural substrate an implant depends on to be compromised. That reasoning
    is the entry's, not a published claim; the outcome datapoint is published.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_phenotypes:
  - preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  target_mechanisms:
  - target: Hair Cell Functional Failure Without Hair Cell Loss
    treatment_effect: BYPASSES
    description: >-
      An implant does not repair the hair cell; it stimulates the spiral ganglion directly,
      bypassing the transduction step that has failed. BYPASSES rather than RESTORES
      because nothing about the hair-cell lesion changes.
  evidence:
  - reference: PMID:40515814
    reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-Cochlear Implantation speech outcome speech recognition improves significantly at 3- and 6-months post-implantation across various syllable and sentence conditions."
    explanation: >-
      The only published implantation outcome in a genetically confirmed DFNA68 patient.
      One patient, no control, and the follow-up is six months.
  - reference: PMID:40515814
    reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HOMER2 is a causative gene in elderly patients, particularly those in their 60 s or 70 s, who develop profound SNHL and require CI"
    explanation: >-
      The authors' statement of when in the disease course implantation becomes the
      relevant intervention.
- name: Genetic Counselling and Cascade Testing
  description: >-
    Counselling for a dominant condition with a 50 percent transmission risk. Two things
    are specific to DFNA68 and worth saying to a family. The first is that a normal
    audiogram in a young carrier does not mean much: onset is postlingual and in one
    reported family did not begin until the late teens or twenties, so an unaffected-looking
    child may simply not have reached onset. The second is that the finding predicts a
    trajectory rather than a state - a known rate of decline is the main thing a molecular
    diagnosis adds here, because there is no treatment it selects.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

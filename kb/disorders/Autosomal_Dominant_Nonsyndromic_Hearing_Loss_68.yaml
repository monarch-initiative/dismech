- name: Impaired HOMER2 Multimerisation
  biological_scale: MOLECULAR
  description: >-
    Homer proteins work as tetramers assembled through the parallel alignment of their
    coiled-coil domains, and it is the tetramer, not the monomer, that acts as a hub
    holding several binding partners together. Both the missense and the truncating
    disease alleles fall in that domain, and the truncating one has been shown directly to
    oligomerise less than wild type.

    Because a mutant subunit is still made and can still enter a hub, reduced
    multimerisation in a heterozygote is not the same as having half as much scaffold: an
    assembly built from a mixture of wild-type and mutant subunits can be worse than one
    built from fewer wild-type subunits alone. That is the reading under which a dominant
    allele coexists with a mouse heterozygote that hears normally.
  biological_processes:
  - preferred_term: protein homotetramerization
    modifier: DECREASED
    term:

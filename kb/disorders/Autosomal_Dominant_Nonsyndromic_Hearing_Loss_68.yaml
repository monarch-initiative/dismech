pathophysiology:
- name: HOMER2 Coiled-Coil Missense Variant
  biological_scale: MOLECULAR
  description: >-
    The founding allele, p.Arg185Pro numbered against HOMER2 isoform 1 and p.Arg196Pro
    against the longer isoform 2, is a single amino acid substitution inside the
    coiled-coil domain. Arginine is replaced by proline, which the reporting authors predict
    will alter the domain's conformation or its ability to multimerise and to bind partner
    proteins, and the residue sits in the stretch that both drives multimerisation and
    carries the CDC42-binding site.

    Its classification as dominant negative rests on a positive experiment rather than on
    inference from the pedigree: injecting mutant mRNA into zebrafish embryos, which
    retain their own wild-type homer2, reduced ear size and kinocilium number, while
    knocking the fish gene down did not change ear size or morphology. An allele that
    damages a process only when it is present, and not when the gene is simply absent, is
    acting on the wild-type product.

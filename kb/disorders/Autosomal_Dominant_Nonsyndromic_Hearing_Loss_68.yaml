- name: Impaired HOMER2 Multimerisation
  biological_scale: MOLECULAR
  description: Long Homer scaffolds form tetramers through their coiled-coil region. Later crystallography of Homer1/Homer3 revised the earlier parallel-tetramer model to two parallel dimers arranged tail-to-tail. Reduced HOMER2 multimerization was measured for the Chinese truncating allele, but not established across all DFNA68 variants. Mixed mutant and normal complexes could alter scaffold function, although direct interference requires additional testing. Biochemical deletion experiments show that CDC42 binding and self-multimerization are substantially independent, so defective assembly cannot be treated as directly proving defective CDC42 binding.

pathophysiology:
- name: HOMER2 Coiled-Coil Missense Variant
  biological_scale: MOLECULAR
  description: The founding p.Arg185Pro variant in the 343-residue isoform corresponds to p.Arg196Pro in the 354-residue isoform. It segregated with hearing loss and alters a conserved coiled-coil residue. Mutant-mRNA overexpression in zebrafish reduced otic size and neuromast kinocilium number, whereas morpholino knockdown did not produce those morphological changes. The authors interpreted this as dominant negative. An adverse overexpression phenotype supports an altered-protein effect but does not itself demonstrate poisoning of wild-type complexes; multimerization impairment for this missense allele remains a prediction.

    giving a down-sloping curve, and the lower frequencies are drawn in as the disease
    advances until the audiogram flattens. In the Spanish family this is visible as a
    cross-sectional gradient within one pedigree: the two children had moderate loss
    weighted to the high frequencies, their mother had profound loss above 2000 Hz.

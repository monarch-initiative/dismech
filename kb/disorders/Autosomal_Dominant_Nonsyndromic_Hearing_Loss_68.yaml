- name: HOMER2 Frameshift Truncation in the CDC42-Binding Domain
  biological_scale: MOLECULAR
  description: >-
    Two independent frameshift alleles, a single-base duplication reported in a Chinese
    family and a five-base deletion reported in a Spanish family, introduce premature stop
    codons a few residues apart inside the CDC42-binding domain. They are curated as one
    node because the two truncated products share an identical aberrant C-terminal tail,
    which is the observation the Spanish authors use to argue that the two families share
    a mechanism.

    What is measured, rather than predicted, comes from the Chinese allele expressed in
    cells: the mutant protein was less stable than wild type, multimerised less well, and
    lost the perinuclear clustering that wild-type HOMER2 shows, distributing diffusely
    through the cytoplasm instead.

- name: Cdc42 hair-cell conditional knockout comparator
  species: Mouse
  genotype: Atoh1-Cre;Cdc42 flox/flox
  publication: PMID:24610943
  description: Hair cells developed normally and then progressively degenerated, with stereocilia fusion/depletion and apical actin-belt disruption. The manipulated gene is Cdc42, not Homer2.
  modeled_mechanisms:
  - target: Failure of Stereocilia Actin Maintenance
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Establishes a role for CDC42 in hair-cell maintenance.
    limitations: Does not demonstrate that HOMER2 variants impair CDC42 binding or reproduce this sequence in patients.
    readouts:
    - name: Stereocilia fusion and depletion
      target: Failure of Stereocilia Actin Maintenance
      direction: ALTERED
      interpretation: A structural consequence of deleting Cdc42 in the comparator model.
      evidence:
      - reference: PMID:24610943
        reference_title: Maintenance of stereocilia and apical junctional complexes by Cdc42 in cochlear hair cells.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: Cochlear hair cell degeneration was more robust in inner hair cells than in outer hair cells, and began as stereocilia fusion and depletion, accompanied by a thinning and waving circumferential actin belt at apical junctional complexes (AJCs).
        explanation: The cellular lesion in the CDC42 model, described at the level of the actin structures. INDIRECT because the gene removed is CDC42, not HOMER2.
    evidence:
    - reference: PMID:24610943
      reference_title: Maintenance of stereocilia and apical junctional complexes by Cdc42 in cochlear hair cells.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Hair cells of Atoh1-Cre;Cdc42(flox/flox) mice developed normally but progressively degenerated after maturation, resulting in progressive hearing loss particularly at high frequencies.
      explanation: The normal-development-then-progressive-loss course, which is the feature that makes this model resemble the human disease.
discussions:
- discussion_id: dfna68_actin_versus_calcium_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted HOMER2-CDC42 Coupling at the Hair Bundle
  - pathophysiology#Dysregulated Hair Cell Cytosolic Calcium Handling
  prompt: Does HOMER2 keep hair cells working by regulating stereociliary actin through CDC42, by holding calcium-handling proteins in place, or by both?
  rationale: Biochemical work establishes HOMER2–CDC42 binding outside the cochlea, while Cdc42 deletion establishes a hair-cell maintenance requirement. Neither observation demonstrates mediation of a HOMER2 patient allele. PMCA1/PMCA4 regulation in parotid and HEK293 cells supports a separate calcium hypothesis, but tissue-specific adaptation limits extrapolation to stereociliary PMCA2. The two pathways may coexist, and neither is established as the shared cause across DFNA68 alleles.
  proposed_experiments:
  - experiment_id: dfna68_homer2_cdc42_interaction_in_hair_cells
    name: HOMER2 partner mapping and allele-specific binding in cochlear hair cells
    description: Immunoprecipitate HOMER2 from mouse cochlear sensory epithelium and identify its partners by mass spectrometry, asking specifically whether CDC42, PMCA2 and TRPC channels are among them; then measure binding of each disease allele class to whichever partners are found, in a hair-cell-derived line rather than in HEK cells.
    readouts:
    - name: CDC42 recovery in HOMER2 immunoprecipitates from cochlear epithelium
      target: pathophysiology#Disrupted HOMER2-CDC42 Coupling at the Hair Bundle
      direction: DECREASED
      interpretation: Allele-specific binding loss in the appropriate cells would strengthen the proposed link. A negative immunoprecipitation requires expression, sensitivity and transient-interaction controls and does not by itself refute the pathway.
    - name: PMCA2 recovery in HOMER2 immunoprecipitates from cochlear epithelium
      target: pathophysiology#Dysregulated Hair Cell Cytosolic Calcium Handling
      interpretation: Physical association would support a candidate partnership, but altered pump activity and causal rescue would still be needed to establish mediation.
- discussion_id: dfna68_no_model_of_the_human_genotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Homer2 constitutive knockout mouse
  - pathophysiology#HOMER2 Coiled-Coil Missense Variant
  prompt: Every HOMER2 hearing model is either a null or an overexpression assay. Does a mouse heterozygous for an actual human DFNA68 allele go deaf, and does it do so the way a patient does?
  rationale: The cited mammalian model removes Homer2 completely, whereas zebrafish studies transiently overexpress patient-derived RNA. Neither tests endogenous heterozygous dosage in a mammalian cochlea. Patient-allele knock-ins could distinguish auditory effects, age-dependent histology and allele classes, while mutant–wild-type interaction and rescue assays would be needed to resolve dominant-negative action.
  proposed_experiments:
  - experiment_id: dfna68_knock_in_mouse_allelic_series
    name: Knock-in mouse series carrying human DFNA68 alleles
    description: Generate heterozygous knock-in mice carrying the orthologues of one allele from each class - the coiled-coil missense, a CDC42-binding-domain frameshift, and a C-terminal extension - and follow auditory brainstem response and distortion-product otoacoustic emission thresholds, hair-bundle morphology by scanning electron microscopy, and hair-cell counts, to an age well past threshold onset.
    readouts:
    - name: Auditory brainstem response threshold in heterozygous knock-in mice
      target: pathophysiology#Progressive Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: A phenotype would validate the patient-allele model, but would not alone distinguish direct wild-type interference from another gain of function.
    - name: Hair cell counts at and beyond threshold onset
      target: pathophysiology#Hair Cell Dysfunction
      interpretation: Serial histology would define whether dysfunction precedes degeneration for each allele and age, without predetermining the outcome.
    - name: Stereocilia morphology by scanning electron microscopy
      target: pathophysiology#Failure of Stereocilia Actin Maintenance
      direction: ALTERED
      interpretation: Fusion and depletion resembling the Cdc42 conditional knockout would connect the HOMER2 allele to the actin branch directly, which is the step the CDC42 experiment cannot supply.
- discussion_id: dfna68_extension_allele_cardiac_signal
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#HOMER2 C-Terminal Extension Variant
  prompt: Do cardiac abnormalities in the 2025 zebrafish overexpression assay have any counterpart in human extension-allele carriers?
  rationale: Variant constructs increased cardiac abnormalities in embryos at a common RNA dose; this was not a dose-response study. The reported patient lacked cardiac abnormalities, and embryonic overexpression can have effects unrelated to endogenous human heterozygosity. These experiments do not establish a human cardiac phenotype or fetal-survival risk.
  proposed_experiments:
  - experiment_id: dfna68_cardiac_assessment_of_reported_families
    name: Echocardiography and electrocardiography in DFNA68 carriers
    description: Cardiac assessment of carriers in the reported families, stratified by allele class, reported whether normal or abnormal. The question is answerable with existing cohorts and no new genetics.
    readouts:
    - name: Left ventricular function and rhythm in HOMER2 carriers
      target: pathophysiology#HOMER2 C-Terminal Extension Variant
      interpretation: Consistent abnormalities would motivate independent replication and reassessment of scope. Normal results would constrain risk in the examined carriers without proving every fish effect assay-specific or excluding all age-dependent effects.
external_assertions:
- name: OMIM deafness, autosomal dominant 68 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:616707
  url: https://omim.org/entry/616707
  description: The OMIM phenotype record under which DFNA68 was designated, and the identifier the clinical literature uses for the disorder. Recorded here rather than under mappings because the DiseaseMappings class carries only ICD-10-CM, ICD-11, MONDO and NCIT slots.
  evidence:
  - reference: PMID:41351289
    reference_title: A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Deafness, autosomal dominant 68 (DFNA68, OMIM #616707) is a rare subtype of ADNSHL caused by heterozygous variants in the HOMER2'
    explanation: The OMIM number, the DFNA designation and the causal gene in one sentence.

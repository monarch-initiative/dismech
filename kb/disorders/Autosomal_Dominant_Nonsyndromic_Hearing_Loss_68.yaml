    explanation: The severity range reached, in the two families carrying truncating alleles.
- name: Postlingual Onset
  category: Auditory
  description: >-
    Hearing is normal through infancy, speech is acquired normally, and the loss declares
    itself afterwards - usually in the first or second decade, but not until her fifties in
    one reported patient. The practical consequence is that a carrier passes newborn
    hearing screening, so the disease is not found by the programme designed to find
    congenital deafness.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  notes: >-
    Recorded as OBLIGATE rather than FREQUENT because postlingual onset is part of how
    every reporting group characterises the entity, including the one whose patient
    presented in her sixties, and none of the six primary reports describes a prelingual or
    congenital case. The claim is about the entity as reported, not a per-carrier count; no
    denominator of carriers has been published.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals with variants in HOMER2 exhibit bilateral post‐lingual progressive hearing loss that typically begins in the high frequencies during the first or second decade of life."
    explanation: >-

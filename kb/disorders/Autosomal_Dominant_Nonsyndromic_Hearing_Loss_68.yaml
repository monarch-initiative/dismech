- name: ClinGen HOMER2 dosage sensitivity
  source: ClinGen
  assertion_type: dosage_sensitivity
  external_id: HGNC:17513
  url: https://search.clinicalgenome.org/kb/gene-dosage/HGNC:17513
  description: February 2026 curation records haploinsufficiency and triplosensitivity scores of zero. The curators favor dominant-negative/gain-of-function mechanisms; the scores represent available evidence rather than universal biological exclusion.
  evidence:
  - reference: url:https://search.clinicalgenome.org/kb/gene-dosage/HGNC:17513
    reference_title: HOMER2 curation results for Dosage Sensitivity
    supports: SUPPORT
    snippet: Evidence across all variants consistently supports a dominant-negative or gain-of-function mechanism rather than haploinsufficiency.
    explanation: Expert synthesis of the available variants; direct molecular mechanisms remain bounded by the underlying assays.
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
notes: 'The allele series supports HOMER2-related dominant hearing loss but does not establish one shared downstream mechanism. The available models differ from endogenous heterozygous patient genotypes. Negative histology and normal neuromast counts are bounded by age, allele and assay; they do not establish lifelong absence of degeneration. Proposed actin and calcium branches are provisional. General care evidence is extrapolated from genetic hearing-loss guidance where disorder-specific outcomes are sparse. Reference retrieval exceptions (23 September 2026): PMID:37173411 and PMID:25049230 remained abstract-only after fresh fetch-reference attempts; their PMC URL caches supply the quoted full-text results and represent the same publications, not independent evidence. PMID:20301607 likewise did not retrieve the GeneReviews chapter body; the tagged Bookshelf URL supplies its clinical guidance. The ClinGen dosage rebuild lacked the pinned GRCh38 TSV, and refresh failed checksum verification because both upstream downloads had changed; the URL cache preserves the February 2026 narrative without repinning a repository-wide source during this disorder review. The gene-validity narrative
  uses the successfully rebuilt CGGV record.'

    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ages at onset of the affected individuals ranged from 17 to 24 years."
    explanation: >-
      The late-onset window that makes a normal childhood audiogram uninformative about
      carrier status in some families.
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "contribute to the development of genetic counseling for inherited deafness"
    explanation: >-

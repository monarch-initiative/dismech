- name: Dysregulated Hair Cell Cytosolic Calcium Handling
  biological_scale: MOLECULAR
  description: >-
    The alternative proposed lesion, and the weaker of the two. Homer proteins bind and
    regulate several calcium-handling proteins, and deleting Homer2 from mouse parotid
    acinar cells raises plasma-membrane calcium pump expression and speeds calcium
    extrusion, which is a measured regulatory relationship in a real tissue. The reason it
    is interesting for hearing is that PMCA2 is the only route by which calcium is cleared
    from a stereocilium, so a scaffold that sets pump behaviour would matter there
    disproportionately.

    Nothing has tested this in a hair cell. No HOMER2 calcium phenotype has been measured
    in the cochlea, the established Homer2 partner among the TRPC channels is TRPC1 rather
    than the TRPC3 and TRPC6 that hair cells need, and the PMCA2 partnership is a proposal
    rather than an observation. The node is carried because the founding paper put it
    forward as a live alternative and because discarding it would make the entry look more
    settled than the field is.

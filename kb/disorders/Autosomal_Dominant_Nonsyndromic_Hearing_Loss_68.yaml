name: Autosomal Dominant Nonsyndromic Hearing Loss 68
category: Mendelian
creation_date: "2026-09-18T00:00:00Z"
synonyms:
- DFNA68
- deafness, autosomal dominant 68
- deafness, autosomal dominant type 68
- autosomal dominant nonsyndromic deafness 68
- HOMER2 autosomal dominant nonsyndromic deafness
description: >-
  DFNA68 is bilateral, postlingual, progressive nonsyndromic sensorineural hearing loss
  caused by heterozygous variants in HOMER2, which encodes a scaffolding protein of the
  Homer family. Hearing is normal at birth and through early childhood; loss typically
  declares itself in the first or second decade at the high frequencies, with a
  down-sloping audiogram that flattens as the lower frequencies are drawn in, and
  deteriorates by roughly 1.2 to 1.6 dB per year until it is severe or profound.

  The mechanistic interest of the entity is that it is a scaffold disease rather than a
  transducer disease. HOMER2 does not itself carry current, move the hair bundle, or
  recycle potassium. Its long isoform is built from an N-terminal EVH1 domain that binds
  proline-rich motifs and a C-terminal coiled-coil domain that does two things: it makes
  Homer proteins multimerise into tetrameric hubs, and it carries the binding site for
  CDC42, the Rho-family GTPase that tunes actin turnover. In the mouse cochlea the
  protein is enriched at the tips of the stereocilia of both inner and outer hair cells,
  which is the observation that connects a general signalling scaffold to hearing.

  Two candidate downstream lesions are on the table and neither has been settled. The
  first is actin: HOMER2 couples to CDC42, and deleting Cdc42 from murine hair cells
  produces stereocilia fusion and depletion with a progressive high-frequency hearing
  loss that resembles the human picture. The second is calcium: Homer proteins regulate
  TRPC channels and the plasma-membrane calcium pump, and PMCA2 is the only route by
  which calcium leaves a stereocilium. The paper that founded the disease named both
  hypotheses and left them open, and nothing since has closed them.

  What the allele series shows is that this is not a haploinsufficiency disease. Mice
  heterozygous for a Homer2 null hear normally and only the homozygous null is deaf;
  HOMER2 is tolerant of loss-of-function variation in population data. The human alleles
  instead cluster into three classes that each interfere with the wild-type protein: a
  coiled-coil missense change shown to act as a dominant negative in zebrafish; frameshift
  variants that truncate the protein inside the CDC42-binding domain and reduce its
  stability and its ability to multimerise; and variants that extend the protein past its
  normal stop codon, for which a gain-of-function effect of the aberrant C-terminal tail
  has been argued directly.

  The entity is very rare. Fewer than ten unrelated families have been reported worldwide
  since the gene was identified, and the whole clinical description rests on them.

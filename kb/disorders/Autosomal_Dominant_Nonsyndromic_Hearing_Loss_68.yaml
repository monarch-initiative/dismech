animal_models:
- name: Homer2 constitutive knockout mouse
  species: Mouse
  genotype: Homer2 targeted deletion, homozygous and heterozygous
  publication: PMID:25816005
  genes:
  - preferred_term: HOMER2
    term:
      id: hgnc:17513
      label: HOMER2
  description: >-
    The only mammalian model of the gene's role in hearing among the nine PubMed records
    swept for this entry, and the one that supplied both the strongest and the most awkward
    result. Homozygous nulls have progressively rising
    auditory brainstem response thresholds from two weeks of age and are profoundly deaf by
    eight weeks, with the loss starting at high frequencies and spreading. At that point the
    organ of Corti still has its full complement of inner and outer hair cells.

    The awkward result is the heterozygote. It hears normally, which means the mouse models
    absence of the protein while every human allele is something other than absence. The
    model therefore supports the claim that HOMER2 is required for hearing, and does not
    model the human genotype.
  modeled_mechanisms:
  - target: Hair Cell Functional Failure Without Hair Cell Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model's distinctive contribution: profound deafness in the presence of an intact
      hair-cell population, which is what separates this disease from the hair-cell-death
      mechanisms the module it conforms to normally describes.
    limitations: >-
      The genotype is a homozygous null and the human disease is heterozygous for
      non-null alleles; the heterozygous mouse, the genotype that corresponds to a human
      carrier, has no phenotype at all. The hair-cell count was made at eight weeks in an
      animal with a very compressed disease course, so it does not exclude hair-cell loss
      over the decades a human cochlea is exposed to the lesion. No knock-in mouse carrying
      a human DFNA68 allele appears among the nine PubMed records returned by the search
      recorded in the entry notes.
    readouts:
    - name: Inner and outer hair cell counts in whole-mount organ of Corti
      target: Hair Cell Functional Failure Without Hair Cell Loss
      direction: UNCHANGED
      interpretation: >-
        An unchanged hair-cell population alongside profound threshold elevation is what
        makes the lesion functional rather than degenerative in this model.
      evidence:
      - reference: PMID:25816005
        reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No differences in IHCs and OHCs were observed in any animals regardless of genotype indicating the absence of Homer2 does not impair hair cell formation and development"
        explanation: The measurement itself, reported as a negative across all genotypes.
    evidence:
    - reference: PMID:25816005
      reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mouse mutants homozygous for the targeted deletion of Homer2 present with early-onset rapidly progressive hearing loss"
      explanation: >-
        Establishes that this model is informative for the hearing phenotype at all, which
        is the precondition for reading its hair-cell result.
  - target: Progressive Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the audiometric shape of the human disease - progressive, starting at
      high frequencies, eventually involving all of them - on a radically compressed
      timescale.
    limitations: >-
      Onset is at two weeks and the endpoint at eight, against decades in humans, so the
      model cannot speak to the human rate, to the stage-dependent change in audiometric
      configuration, or to anything about late adult disease. The genotype mismatch above
      applies here too.
    readouts:
    - name: Auditory brainstem response threshold
      target: Progressive Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        Rising thresholds over successive ages are the measurement that makes the model's
        phenotype progressive rather than static.
      evidence:
      - reference: PMID:25816005
        reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Its complete absence in mice leads to early onset progressive hearing loss starting at the high frequencies and rapidly involving all frequencies."
        explanation: The authors' summary of the threshold data, naming both onset and direction of spread.
    evidence:
    - reference: PMID:25816005
      reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we measured auditory brainstem responses (ABR), an electrophysiological hearing test that reflects the activity of afferent auditory neurons downstream of IHCs"
      explanation: >-
        Names the assay and what it reports on, which is what licenses reading the mouse
        result as a hearing phenotype rather than a behavioural one.
- name: Zebrafish HOMER2 mutant mRNA overexpression model
  species: Zebrafish
  genotype: wild-type embryos injected with in vitro transcribed mutant human HOMER2 mRNA
  publication: PMID:25816005
  description: >-
    The workhorse assay of this field, used by three separate groups. Human HOMER2 mRNA -
    wild type or mutant - is injected into wild-type embryos, so the fish's own homer2 is
    intact and any phenotype is an effect of the mutant product on a normal background.
    That design is what makes it a dominant-negative assay rather than a loss-of-function
    one, and the founding study made the point explicitly by showing that morpholino
    knockdown of the fish gene did not change ear size while mutant mRNA did.

    Later groups extended it from morphology to function: FM1-43 uptake in neuromast hair
    cells and startle-reflex testing, both reduced by disease alleles.
  modeled_mechanisms:
  - target: HOMER2 Coiled-Coil Missense Variant
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The assay that established the dominant-negative classification of the founding
      allele, by the contrast between mutant-mRNA injection and gene knockdown.
    limitations: >-
      Zebrafish homer2 is 67 percent identical to the human protein, the injected message
      is supraphysiological and transient, and the readout is otic vesicle size and
      kinocilium number in an embryo rather than hearing in a mature cochlea. A fish has no
      cochlea, no endocochlear potential and no outer-hair-cell amplifier, so the assay
      reports that the allele is harmful to hair cells, not how it causes human deafness.
    readouts:
    - name: Otic vesicle size in injected larvae
      target: HOMER2 Coiled-Coil Missense Variant
      direction: DECREASED
      interpretation: >-
        Smaller ears after mutant but not wild-type mRNA injection is the positive result
        the dominant-negative reading rests on.
      evidence:
      - reference: PMID:25816005
        reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "injection of in vitro synthesized mRNA encoding HOMER2 P185-mutant RNA (P185RNA) resulted in significantly smaller ear size in larvae as compared to injections with WT HOMER2"
        explanation: The measurement, with its wild-type-mRNA control stated in the same sentence.
    evidence:
    - reference: PMID:25816005
      reference_title: "HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in humans and mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although knockdown of homer2 altered neither ear size nor morphology (p>0.5)"
      explanation: >-
        The knockdown control. It is what makes the model informative about a
        dominant-negative mechanism specifically rather than about the gene being needed.
  - target: Hair Cell Functional Failure Without Hair Cell Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The functional extension of the assay, in which disease alleles reduce FM1-43 uptake
      by neuromast hair cells while leaving hair-cell numbers unchanged - the fish
      counterpart of the mouse null's intact organ of Corti.
    limitations: >-
      Neuromasts are lateral-line organs, not cochlear, and FM1-43 uptake is a proxy for
      open mechanotransduction channels rather than a direct measurement of transduction
      current. The injected alleles are extension variants, so the result is not
      established for the missense or truncating classes.
    readouts:
    - name: FM1-43 uptake by neuromast hair cells
      target: Hair Cell Functional Failure Without Hair Cell Loss
      direction: DECREASED
      interpretation: >-
        Reduced dye entry indicates fewer open transduction channels, so the hair cells are
        present but not transducing.
      evidence:
      - reference: PMID:40515814
        reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "in the HOMER2 variant groups, FM1-43 uptake was markedly reduced"
        explanation: The measurement itself, against injected wild-type and fluorescent-protein controls.
    - name: Startle reflex latency and distance
      target: Hair Cell Functional Failure Without Hair Cell Loss
      direction: ALTERED
      interpretation: >-
        A behavioural readout of hearing in the fish, which is what converts a dye-uptake
        result into a claim about auditory function.
      evidence:
      - reference: PMID:40515814
        reference_title: "Impact of HOMER2 frameshift extension variant on auditory function and development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the startle reflex test, both variants reduced distance and increased latency, providing strong evidence for hearing loss and the pathogenicity of the p.R345Efs*64 variant."
        explanation: The behavioural result and the inference the authors draw from it.
    evidence:
    - reference: PMID:37173411
      reference_title: "Identification and in vivo functional investigation of a HOMER2 nonstop variant causing hearing loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in vivo studies using a zebrafish animal model and behavioral tests clearly established the deleterious impact of this novel HOMER2 alteration on hearing function"
      explanation: >-
        An independent group reaching the same conclusion with the same system, which is
        what makes the assay a reproducible tool rather than a single study's result.
discussions:
- discussion_id: dfna68_actin_versus_calcium_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Disrupted HOMER2-CDC42 Coupling at the Hair Bundle"
  - "pathophysiology#Dysregulated Hair Cell Cytosolic Calcium Handling"
  prompt: >-
    Does HOMER2 keep hair cells working by regulating stereociliary actin through CDC42,
    by holding calcium-handling proteins in place, or by both?
  rationale: >-
    The founding paper set out two hypotheses and declined to choose, and a decade later
    nothing has chosen for it. Both are carried in this entry as separate nodes rather than
    collapsed, because collapsing them would manufacture a resolution.

    The actin branch has the better circumstantial case. The HOMER2-CDC42 interaction is
    mapped to the same residue range the disease alleles fall in; CDC42 is present and
    active at stereociliary membranes; and removing CDC42 from mouse hair cells produces
    stereocilia fusion and depletion with progressive high-frequency hearing loss that
    looks like the human disease. What is missing is any measurement of the HOMER2-CDC42
    complex in a cochlear hair cell, and any binding assay for a disease allele.

    The calcium branch has one real measurement and it is in the wrong tissue: deleting
    Homer2 from mouse parotid acinar cells raises PMCA expression and speeds calcium
    extrusion. The reason to care is that PMCA2 is the only calcium clearance route out of
    a stereocilium, so a scaffold that sets pump behaviour would matter there. But the
    Homer2 partner established among TRPC channels is TRPC1, while the TRPCs hair cells
    need are TRPC3 and TRPC6, and the PMCA2 partnership has been proposed rather than
    shown.

    The two are not mutually exclusive. A tetrameric hub holds several partners at once,
    and an allele that degrades hub assembly would be expected to loosen the grip on all
    of them. It is entirely possible that the answer is "both, and the actin arm dominates
    the phenotype" - but that is a hypothesis with no data behind it either.
  proposed_experiments:
  - experiment_id: dfna68_homer2_cdc42_interaction_in_hair_cells
    name: HOMER2 partner mapping and allele-specific binding in cochlear hair cells
    description: >-
      Immunoprecipitate HOMER2 from mouse cochlear sensory epithelium and identify its
      partners by mass spectrometry, asking specifically whether CDC42, PMCA2 and TRPC
      channels are among them; then measure binding of each disease allele class to
      whichever partners are found, in a hair-cell-derived line rather than in HEK cells.
    readouts:
    - name: CDC42 recovery in HOMER2 immunoprecipitates from cochlear epithelium
      target: "pathophysiology#Disrupted HOMER2-CDC42 Coupling at the Hair Bundle"
      direction: DECREASED
      interpretation: >-
        Recovery of CDC42 from wild-type cochlea, reduced for disease alleles, would move
        this node from provisional to established. Failure to recover CDC42 at all would
        undercut the better-supported of the two hypotheses and push the field to the
        calcium branch.
    - name: PMCA2 recovery in HOMER2 immunoprecipitates from cochlear epithelium
      target: "pathophysiology#Dysregulated Hair Cell Cytosolic Calcium Handling"
      interpretation: >-
        A HOMER2-PMCA2 complex in cochlear tissue would convert the calcium hypothesis from
        an extrapolation out of salivary gland into a claim about the right cell.
- discussion_id: dfna68_no_model_of_the_human_genotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "animal_models#Mouse"
  - "pathophysiology#HOMER2 Coiled-Coil Missense Variant"
  prompt: >-
    Every HOMER2 hearing model is either a null or an overexpression assay. Does a mouse
    heterozygous for an actual human DFNA68 allele go deaf, and does it do so the way a
    patient does?
  rationale: >-
    This is a mismatch of genotype, not of species, and it runs through the whole evidence
    base. The mammalian model is a homozygous constitutive null whose heterozygote - the
    genotype corresponding to a human carrier - hears normally. The zebrafish assays
    inject human mutant mRNA into embryos with intact endogenous homer2, at
    supraphysiological and transient levels, and read out otic vesicle size, neuromast dye
    uptake and startle behaviour. Neither system contains a single copy of a human disease
    allele expressed at its own level in a mammalian cochlea, which is what the disease is.

    Why it matters rather than being a routine caveat: the entire mechanistic
    classification of this disease turns on the difference between absence of HOMER2 and
    interference by a mutant HOMER2. The mouse tests absence. The fish tests excess. The
    disease is neither. The specific claims that are unverified as a result are the
    dominant-negative classification of the missense allele, the gain-of-function
    classification of the extension alleles, and the assertion that hair cells survive -
    which is measured at eight weeks in an animal whose disease runs its whole course in
    six.

    Filed as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the experiments have
    been done, in models whose correspondence to the human genotype is the open question,
    rather than not done at all.
  proposed_experiments:
  - experiment_id: dfna68_knock_in_mouse_allelic_series
    name: Knock-in mouse series carrying human DFNA68 alleles
    description: >-
      Generate heterozygous knock-in mice carrying the orthologues of one allele from each
      class - the coiled-coil missense, a CDC42-binding-domain frameshift, and a C-terminal
      extension - and follow auditory brainstem response and distortion-product otoacoustic
      emission thresholds, hair-bundle morphology by scanning electron microscopy, and
      hair-cell counts, to an age well past threshold onset.
    readouts:
    - name: Auditory brainstem response threshold in heterozygous knock-in mice
      target: "pathophysiology#Progressive Sensorineural Hearing Loss"
      direction: INCREASED
      interpretation: >-
        Rising thresholds in a heterozygote, where the null heterozygote has none, would be
        the direct demonstration that these alleles act on the wild-type product, and would
        convert the dominant-negative and gain-of-function classifications from inference
        into measurement.
    - name: Hair cell counts at and beyond threshold onset
      target: "pathophysiology#Hair Cell Functional Failure Without Hair Cell Loss"
      interpretation: >-
        Preserved hair cells late in a slowly progressing model would establish the entry's
        distinctive claim in the right genotype. Progressive hair-cell loss would instead
        place the disease inside the module's ordinary death pathway and change what this
        node asserts.
    - name: Stereocilia morphology by scanning electron microscopy
      target: "pathophysiology#Failure of Stereocilia Actin Maintenance"
      direction: ALTERED
      interpretation: >-
        Fusion and depletion resembling the Cdc42 conditional knockout would connect the
        HOMER2 allele to the actin branch directly, which is the step the CDC42 experiment
        cannot supply.
- discussion_id: dfna68_extension_allele_cardiac_signal
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#HOMER2 C-Terminal Extension Variant"
  prompt: >-
    Is the cardiac anomaly seen in zebrafish injected with the longest HOMER2 extension
    allele a signal about human carriers, or an artefact of overexpressing an aberrant
    protein in an embryo?
  rationale: >-
    DFNA68 is nonsyndromic in every reported family. Against that, the group that
    characterised the longest extension allele reported that it increased the frequency of
    cardiac anomalies and general morphological abnormalities in injected zebrafish, more
    than an artificial pure-truncation control did, and raised the possibility that human
    fetuses carrying such a variant might not survive - which would make the human families
    an ascertainment of the survivors.

    The case against taking it seriously is straightforward: the patient carrying the
    allele had no cardiac abnormality, the assay is supraphysiological mRNA injection into
    an embryo, and morphological abnormality in that system is a common non-specific
    outcome. The case for not dismissing it is that the effect was dose-ordered against a
    designed control rather than incidental, and that none of the six primary reports
    describes cardiac imaging in a DFNA68 family.

    Recorded as an open question rather than as a phenotype or a knowledge gap: none of the
    six primary reports describes a cardiac feature in a DFNA68 patient, and curating one on
    the strength of a fish would be exactly the import this entry is otherwise careful to
    avoid.
  proposed_experiments:
  - experiment_id: dfna68_cardiac_assessment_of_reported_families
    name: Echocardiography and electrocardiography in DFNA68 carriers
    description: >-
      Cardiac assessment of carriers in the reported families, stratified by allele class,
      reported whether normal or abnormal. The question is answerable with existing
      cohorts and no new genetics.
    readouts:
    - name: Left ventricular function and rhythm in HOMER2 carriers
      target: "pathophysiology#HOMER2 C-Terminal Extension Variant"
      interpretation: >-
        Normal cardiac findings across carriers, particularly extension-allele carriers,
        would close the question and confirm the fish result as assay-specific. Any
        consistent abnormality would change DFNA68 from a nonsyndromic entity into a
        syndromic one and would add cardiac surveillance to its management.
external_assertions:
- name: OMIM deafness, autosomal dominant 68 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:616707
  url: https://omim.org/entry/616707
  description: >-
    The OMIM phenotype record under which DFNA68 was designated, and the identifier the
    clinical literature uses for the disorder. Recorded here rather than under mappings
    because the DiseaseMappings class carries only ICD-10-CM, ICD-11, MONDO and NCIT slots.
  evidence:
  - reference: PMID:41351289
    reference_title: "A Novel Frameshift Variant c.1023_1029del (p.Asp342ArgfsTer54) Leading to Extended Incorrect Protein C Termini in HOMER2 Causing Autosomal Dominant Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deafness, autosomal dominant 68 (DFNA68, OMIM #616707) is a rare subtype of ADNSHL caused by heterozygous variants in the HOMER2"
    explanation: The OMIM number, the DFNA designation and the causal gene in one sentence.
notes: >-
  Scope decision. Curated as a DISEASE, not a GROUPING, a SUBTYPE or OUT_OF_SCOPE. One
  gene, one clinical picture, one conserved pathograph from a HOMER2 allele to progressive
  sensorineural hearing loss, and no member diseases to unite. The OLS4 descendants endpoint
  returns zero descendants for MONDO:0014740, and the stub deleted by this change recorded
  one causal gene, hgnc:17513 HOMER2, taken from MONDO's own RO:0004003 relation. Its MONDO
  parent, MONDO:0019587 autosomal dominant nonsyndromic hearing loss, is an ontology
  grouping returning 76 descendants from the same endpoint, spanning unrelated DFNA loci,
  and is not a dismech entry: a search of kb/groupings/ found no hearing-loss or deafness grouping
  of any kind, and no disorder entry carries MONDO:0019587 as its own disease_term. The
  repository's established treatment of this family is one entry per DFNA locus - twelve
  Autosomal_Dominant_Nonsyndromic_Hearing_Loss_NN entries plus eight
  Hearing_Loss_Autosomal_Dominant_NN entries and sixteen recessive counterparts already
  exist, counted by filename on this branch's base - so an umbrella entry carrying
  this as a has_subtypes row would be a new pattern rather than an existing one. The stub is
  deleted by this change.

  Precedent followed. Autosomal_Recessive_Nonsyndromic_Hearing_Loss_123 (merged 2026-09-17)
  for the overall shape and for the discipline about what a thin literature does and does
  not license; Autosomal_Dominant_Nonsyndromic_Hearing_Loss_50 for the dominant-specific
  sections, for the practice of splitting mechanistically distinct allele classes into
  separate pathophysiology nodes, and for the convention on conforming only the terminal
  node to sensorineural_hair_cell_loss where the module's middle chain does not apply;
  Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11 for the hearing-aid ontology gap, the
  cochlear-implantation binding, and the REFUTED-phenotype pattern used here for the
  vestibular and syndromic negatives; Autosomal_Dominant_Nonsyndromic_Hearing_Loss_17 for
  conformance at the module's sensory-epithelium-insult node with the reason stated.

  Naming. The entry name follows the repository's Autosomal Dominant Nonsyndromic Hearing
  Loss NN convention, which here coincides with the MONDO label, so disease_term
  preferred_term and term label are identical. That is not true of every sibling entry -
  MONDO calls several of them "hearing loss, autosomal dominant NN" - and the label is
  copied from the ontology either way.

  Module conformance. Two nodes conform to sensorineural_hair_cell_loss, and the three
  between them deliberately do not. The module runs insult to ionic disruption and
  oxidative stress to hair-cell mechanotransduction failure AND DEATH to amplification loss
  and spiral ganglion degeneration to progressive hearing loss. DFNA68's evidence
  contradicts the death step: the homozygous null mouse is profoundly deaf with a normal
  complement of inner and outer hair cells at eight weeks, and zebrafish injected with
  disease alleles lose hair-cell function with unchanged hair-cell counts. None of the six
  primary reports describes ionic homeostasis, oxidative stress, endocochlear potential or
  spiral ganglion status in this disease at all. Conforming the middle chain would assert three
  mechanisms the disease has not been shown to have and one it has been shown not to have.
  excitatory_synapse_scaffold_disruption was considered and rejected despite HOMER2 being a
  postsynaptic-density scaffold: that module scopes itself explicitly to glutamatergic
  synapse scaffolds producing neurodevelopmental phenotypes, and its node chain runs through
  excitatory-inhibitory imbalance and cortical circuit assembly, none of which is DFNA68.

  What is deliberately not curated. There is no biochemical block: none of the six primary
  reports describes a biomarker, a reference range or a laboratory analyte for this
  disorder. There are no datasets: a search for HOMER2 hearing-loss expression or sequencing datasets was not
  pursued, because none of the six primary reports deposits one and the entry would be
  guessing at accessions. There are no clinical trials: none of the six primary reports
  names one, and none names a candidate therapy to trial. There is no histopathology and no imaging block:
  temporal bone CT was performed in one proband and is reported as excluding middle- and
  inner-ear malformation rather than as showing a disease finding, and none of the six
  primary reports describes human cochlear material from a DFNA68 patient.
  There are no computational models and no experimental_models: the AlphaFold2 structure
  predictions are curated as evidence on the allele node they bear on rather than as a
  model entry, because they predict a structure rather than simulate a disease process.

  Prevalence counts. The two published tallies of HOMER2 variants differ - one says five
  variants in five families, the other says seven - and both are quoted rather than
  reconciled: they were written months apart and enumerate the variant list differently,
  and neither group reconciles its count with the other's. Neither is repeated here as a settled number, and the entry's own summary
  statement is the weaker "fewer than ten unrelated families", which both counts support.

  Evidence balance, stated rather than smoothed. The clinical picture rests on six
  pedigrees plus one isolated patient. The mechanism rests on mouse immunolocalisation,
  a mouse null, cell-line expression of two truncating alleles, zebrafish mRNA injection
  assays, one structure prediction, and a CDC42 conditional knockout mouse that does not
  involve HOMER2 at all. Across the nine PubMed records swept for this entry there is no
  knock-in model of any human allele, no binding measurement for any disease allele, and no
  human cochlear tissue. Every node below the
  gene is graded accordingly, the CDC42 conditional knockout is marked INDIRECT everywhere
  it is used because the gene removed is not the disease gene, and the two nodes whose
  mechanism is proposed rather than demonstrated carry mechanism_confidence PROVISIONAL and
  HYPOTHETICAL respectively.

  Sourcing. The entry was written from a direct PubMed sweep, not from a deep-research
  report. Searching HOMER2 against hearing and deafness returns nine records, of which six
  are the primary DFNA68 reports; the supporting mechanistic papers were selected from the
  founding paper's own discussion of its two hypotheses. Ten of the eleven cited references
  were fetched into references_cache with just fetch-reference for this entry; the
  eleventh, PMID:37371710, was already cached from an earlier hearing-loss entry. Every
  snippet was taken from the cached text.

  Deep research, and what it is and is not worth here. A provider run was added after the
  entry was complete, at review, as a cross-check rather than as a source:
  research/Autosomal_Dominant_Nonsyndromic_Hearing_Loss_68-deep-research-claude_code.md.
  It is clean on its own terms - just preflight-dr against MONDO:0014740 returns PASS with
  HOMER2 mentioned 43 times and the OMIM number matching on both sides, 15 of 15 references
  resolved with a confabulation rate of 0.0, and 27 of 28 terms resolved with none obsolete
  and none naming a different term than the report claims.

  It is nonetheless not independent corroboration, and should not be read as any. The
  report says in its own first line that it used the curated dismech entry on this branch
  as a local resource, so where it agrees with this entry it is substantially restating it.
  Nothing was imported from it. It surfaced a few identifiers this entry does not carry - a
  group-level ORPHA concept, an LOVD disease number, an ICD-10 code at the DFNA group level
  rather than for DFNA68, and a DFNA2/KCNQ4 differential - and those were left out rather
  than added, because a deep-research suggestion is a lead and none of them was separately
  verified. The four terms its own term-validation section flags as worth a second look are
  the report's prose headings for the four HP terms this entry already binds, each with the
  canonical label; none is a binding disagreement.

  The claude_code provider emits no artifacts directory, so the run is committed as the
  report plus its .citations.md sidecar and the two DOI reference-cache files its citation
  resolution fetched. Those two DOIs are alternative identifiers for papers this entry
  already cites by PMID; no evidence item uses them.

  GeneReviews baseline. No GeneReviews chapter is specific to DFNA68 or to HOMER2. The
  committed cache/bookshelf/ index (958 GeneReviews chapters, snapshot 2026-09-10) contains
  no chapter whose title names either, and the general chapter for this disease class,
  "Genetic Hearing Loss Overview" (NBK1434, PMID:20301607), contains no occurrence of
  HOMER2 or DFNA68 in its text. That chapter is an overview rather than a locus catalogue -
  DFNA3 is the only numbered DFNA locus it names at all - so its silence is consistent with
  DFNA68 being too rare to have entered it rather than with the entity being disputed. The
  phenotype baseline for this entry is therefore the six primary reports themselves.

  The overview chapter is tagged in references: above because this entry consulted it, and
  because it is what the baseline check matches on. just check-genereviews on this file
  reports GeneReviews TAGGED, and --strict exits 0. Read TAGGED as "the chapter this entry
  cites is a GeneReviews chapter and is declared as one", not as "DFNA68 has its own
  chapter" - it does not, which is the finding the paragraph above records.

  An earlier version of this paragraph claimed the check reported NO_CHAPTER. That was
  wrong when it was written, not drift: naming NBK1434 in this very paragraph made the
  checker report CITED_UNTAGGED, because a chapter cited in an entry but absent from
  references: is exactly what that verdict is for. The claim was offered as re-runnable and
  did not re-run, which is the failure mode CLAUDE.md warns about when prose describes
  repository state. Corrected after review (PR #12287).

  Unconnected phenotype. Tinnitus is curated and deliberately left out of the causal graph.
  None of the six primary reports proposes a mechanism for it, and the entry's hair-cell
  nodes were not built to explain it; the reason is stated in the phenotype's own description
  rather than only here. The two REFUTED phenotypes are unconnected by construction, since
  a negative finding has no upstream cause to point at.

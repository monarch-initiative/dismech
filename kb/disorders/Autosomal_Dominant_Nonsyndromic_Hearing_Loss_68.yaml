name: Autosomal Dominant Nonsyndromic Hearing Loss 68
category: Mendelian
creation_date: '2026-09-18T00:00:00Z'
synonyms:
- DFNA68
- deafness, autosomal dominant 68
- deafness, autosomal dominant type 68
- autosomal dominant nonsyndromic deafness 68
- HOMER2 autosomal dominant nonsyndromic deafness
description: DFNA68 is HOMER2-related autosomal dominant nonsyndromic sensorineural hearing loss. Reported families show bilateral progressive loss, commonly beginning at high frequencies during childhood or adolescence; early-childhood diagnosis and a low-frequency presentation also occur. Severity and timing vary, and the founding family’s estimated 1.2–1.6 dB annual deterioration is not a universal prognosis. HOMER2 is a multimeric scaffold enriched at mouse hair-cell stereocilia tips. Human variants include missense, truncating, in-frame deletion and C-terminal extension alleles. Altered assembly and protein localization have been measured for one truncating allele; dominant-negative and gain-of-function mechanisms remain proposed for the broader series. CDC42-dependent actin maintenance and calcium regulation are candidate downstream mechanisms. Mouse null and zebrafish overexpression experiments establish auditory or mechanosensory abnormalities but do not reproduce endogenous heterozygous human genotypes.

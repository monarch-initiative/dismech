      snippet: ASR data analyses, from three independent tests, highlighted a significant decrease in the number of responsive larvae exposed to noise (70 db, 400 HZ) in the G1064 group compared to the A1064 group
      explanation: Mutant-injected larvae showed reduced acoustic-startle responsiveness relative to wild-type RNA controls; this does not measure progressive human cochlear loss.
- name: Zebrafish HOMER2 C-terminal frameshift-extension model
  species: Zebrafish
  genotype: Human p.Arg345Glufs*64, artificial p.Arg345* or wild-type HOMER2 mRNA injection
  publication: PMID:40515814
  description: At the tested common RNA concentration, both variant constructs reduced neuromast FM1-43 uptake without significant changes in hair-cell count or otic area. The extension caused altered tap-startle latency and distance; visual-motor responses were preserved. Cardiac abnormalities occurred at three days in the variant groups. These comparisons were between constructs at a common dose, not a dose-response experiment. The artificial stop allele is a comparator, not an established DFNA68 allele.
  modeled_mechanisms:
  - target: Hair Cell Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reduced dye uptake with preserved counted neuromast hair cells supports a functional defect in the assay.
    limitations: Neuromasts are lateral-line organs. FM1-43 uptake is a proxy, and tap-startle behavior includes neuromotor coordination. Endogenous heterozygous cochlear physiology was not tested.
    readouts:
    - name: Neuromast FM1-43 uptake
      target: Hair Cell Dysfunction
      direction: DECREASED
      interpretation: Reduced uptake indicates altered mechanosensory function; it is not a direct count of open channels.
      evidence:
      - reference: PMID:40515814
        reference_title: Impact of HOMER2 frameshift extension variant on auditory function and development.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: The data suggest that HOMER2 variants severely impaired the capacity of neuromast hair cells to uptake FM1-43, indicating disrupted hair cell function in variant larvae.
        explanation: The positive functional measurement. INDIRECT because it was made in lateral-line neuromasts of a fish, which have no cochlea and no endocochlear potential.
    - name: Counted neuromast hair cells
      target: Hair Cell Dysfunction
      direction: UNCHANGED
      interpretation: No significant count difference at the tested developmental stage.
      evidence:
      - reference: PMID:40515814
        reference_title: Impact of HOMER2 frameshift extension variant on auditory function and development.
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: The statistical analysis from the four neuromasts revealed no significant differences in hair cell numbers between the groups
        explanation: 'The matching negative in the fish: function falls while cell number does not, which is the pairing this node asserts.'

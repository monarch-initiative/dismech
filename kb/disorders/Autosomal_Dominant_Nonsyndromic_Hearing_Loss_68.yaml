- name: HOMER2 Frameshift Truncation in the CDC42-Binding Domain
  biological_scale: MOLECULAR
  description: The Chinese c.840_841insC and Spanish c.832_836del variants on NM_199330 produce p.Met281Hisfs*9 and p.Pro278Alafs*10, respectively. They truncate the coiled-coil region near the mapped CDC42-binding domain; their aberrant tails share the last eight residues rather than being identical throughout. Reduced stability, multimerization and perinuclear clustering were measured for the Chinese allele in transfected cells. Corresponding effects for the Spanish allele are inferred; its transcript decay was not measured. Dominant-negative action and gain of function from an aberrant tail are alternatives proposed in the Spanish study.

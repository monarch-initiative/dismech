      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Sepsis, psychomotor retardation, seizures, elevated C3-acylcarnitine, methyl-citrate in urine
      explanation: Records seizures in a molecularly confirmed patient.
  - target: Intellectual disability
    description: Fixed cognitive impairment is reported at the severe end of the spectrum.

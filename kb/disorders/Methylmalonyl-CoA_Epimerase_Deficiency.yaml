name: Methylmalonyl-CoA Epimerase Deficiency
creation_date: '2026-09-22T00:00:00Z'
category: Mendelian
synonyms:
- MCEE deficiency
- MCE deficiency
- Methylmalonyl-CoA racemase deficiency
- Methylmalonic aciduria due to methylmalonyl-CoA epimerase deficiency
- Atypical methylmalonic aciduria
description: >-
  Methylmalonyl-CoA epimerase (MCEE) deficiency is an ultra-rare autosomal
  recessive defect of the propionate catabolic pathway. MCEE occupies the middle
  of three consecutive steps that carry propionyl-CoA into the TCA cycle:
  propionyl-CoA carboxylase makes D-methylmalonyl-CoA, MCEE epimerises it to the
  L-enantiomer, and methylmalonyl-CoA mutase converts that to succinyl-CoA.
  Deficiencies of the first and third steps are the well-characterised diseases
  propionic acidemia and isolated methylmalonic acidemia. The middle step is the
  one whose physiological importance was unclear until 2006, and whose clinical
  importance is still argued over.

  The reason is structural rather than evidential. The epimerisation MCEE
  catalyses can also proceed non-enzymatically, and a shunt through free
  methylmalonic acid provides a second bypass, so losing the enzyme produces a
  partial rather than a complete block. Knocking MCEE down by siRNA reduces
  pathway flux only slightly. That single fact explains the shape of the whole
  disorder: a persistent but mild-to-moderate methylmalonic aciduria, a
  biochemical profile dominated by 2-methylcitrate, 3-hydroxypropionate and C3
  propionylcarnitine rather than by methylmalonate, and a clinical spectrum that
  runs from entirely asymptomatic through a single acute decompensation to
  severe intellectual disability and spasticity - with no genotype-phenotype
  correlation, and 83% of reported alleles being one nonsense variant.

  This entry therefore models the enzymatic block and its metabolite
  consequences as established, and keeps the neurological outcomes on an
  explicitly provisional branch. Two published patients had their symptoms fully
  explained by a second disorder, sepiapterin reductase deficiency, whose gene
  sits 1.8 Mb away on 2p13.3 and was co-inherited through consanguinity - a
  confounder that has to be excluded before any neurological finding is
  attributed to MCEE at all.
classifications:
  icimd_category:
  - classification_value: organic_acidurias
    notes: >-
      MONDO places this disorder under methylmalonic acidemia, and the
      presenting abnormality is an organic aciduria on urine organic-acid
      analysis.
    evidence:
    - reference: PMID:38034150
      reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Isolated methylmalonic aciduria (MMAuria) encompasses a group of
        autosomal recessive propionate degradation disorders resulting in
        methylmalonic acid (MMA) accumulation in body fluids.
      explanation: Places the disorder within the isolated methylmalonic acidurias, a group of organic acidurias.
  - classification_value: branched_chain_amino_acids
    notes: >-
      The blocked step is the common terminal route for the propiogenic amino
      acids valine, isoleucine, methionine and threonine, so the disorder is
      also a branched-chain amino acid catabolic defect.
    evidence:
    - reference: PMID:38034150
      reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Methylmalonyl coenzyme A (CoA) epimerase (MCE) converts
        D-methylmalonyl-CoA into L-methylmalonyl CoA in the final common
        degradation pathway of valine, isoleucine, methionine, threonine,
        odd-chain fatty acids, and cholesterol side chains.
      explanation: Names the branched-chain and other amino acid pathways that converge on the blocked step.

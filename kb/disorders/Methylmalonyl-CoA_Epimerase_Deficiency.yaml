- name: Two Molecular Routes to Enzyme Loss
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The dominant allele by far, c.139C>T (p.Arg47*), truncates the protein
    inside the first beta-sheet, so essentially no protein survives. The
    missense alleles fail differently. p.Ile53Arg sits at the dimer interface
    and yields almost no soluble protein in either a recombinant system or
    patient fibroblasts, i.e. it misfolds. p.Arg143Cys is expressed at close to
    wild-type levels but its crystal structure shows two displaced loops that
    frame the active-site pocket, and its activity is nearly gone. So the same
    enzyme deficiency is reached either by losing the protein or by keeping it
    and breaking the site.
  molecular_functions:
  - preferred_term: methylmalonyl-CoA epimerase activity
    term:
      id: GO:0004493
      label: methylmalonyl-CoA epimerase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Loss of almost the entire protein is therefore the likely cause of
      enzymatic dysfunction due to this variation, assuming there is residual
      mRNA following nonsense-mediated decay.
    explanation: Gives the molecular consequence of the common truncating allele.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional analysis of MCEE-Ile53Arg expressed in a bacterial recombinant
      system as well as patient-derived fibroblasts revealed nearly undetectable
      soluble protein levels, defective globular protein behavior, and using a
      newly developed assay, lack of enzymatic activity - consistent with
      misfolded protein.
    explanation: Establishes misfolding with loss of soluble protein as the mechanism for p.Ile53Arg.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MCEE-Arg143Cys was detectable at comparable levels to wt MCEE, but had
      slightly altered unfolding kinetics and greatly reduced activity.
    explanation: Establishes the contrasting class, where protein is present but catalytically defective.
  downstream:
  - target: Partial Block of the Propionate-to-Succinate Pathway

inheritance:
- name: Autosomal recessive inheritance with unresolved clinical penetrance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Patients are homozygous or compound heterozygous for MCEE variants, most
    ascertained through consanguineous unions. Biallelic variants establish the
    biochemical phenotype but do not predict clinical outcome: siblings sharing
    the same homozygous null allele have been reported with and without
    symptoms, and a published review of the whole case series found no
    genotype-phenotype relationship. Obligate heterozygote parents excrete
    normal amounts of methylmalonic acid, so the carrier state is biochemically
    silent.
  evidence:
  - reference: PMID:16752391
    reference_title: A homozygous nonsense mutation in the methylmalonyl-CoA epimerase gene (MCEE) results in mild methylmalonic aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both parents were heterozygous for this mutation; they were found to
      excrete normal amounts of methylmalonic acid (MMA).
    explanation: Establishes recessive inheritance and a biochemically silent carrier state.
  - reference: PMID:38034150
    reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found no association between genotype and biochemical and clinical phenotypes.
    explanation: Supports variable expressivity by recording the absence of any genotype-phenotype correlation across the reported series.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cardiomyopathy. Sibling with similar biochemical profile but no symptoms
    explanation: Documents a sibling pair concordant for the biochemical phenotype and discordant for symptoms, supporting incomplete clinical penetrance.

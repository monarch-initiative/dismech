genetic:
- name: MCEE
  gene_term:
    preferred_term: MCEE
    term:
      id: hgnc:16732
      label: MCEE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    MCEE on 2p13.3 encodes mitochondrial methylmalonyl-CoA epimerase. Reported
    disease alleles are overwhelmingly one nonsense variant, c.139C>T
    (p.Arg47*), which accounts for 83% of alleles in the published series; the
    remainder are rare missense, frameshift and deep-intronic splicing changes.
    The locus matters clinically for a second reason: SPR, whose deficiency
    causes a treatable neurotransmitter disorder, lies 1.8 Mb away, and
    consanguineous families have been reported homozygous for null alleles in
    both.
  evidence:
  - reference: PMID:38034150
    reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most patients were homozygous for that variant (83% of the alleles).
    explanation: Quantifies the dominance of the p.Arg47* allele in the reported series.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This remains by far the most common pathogenic variation identified in
      MCEE deficiency, with 16 out of 21 patients homozygous for this allele.
    explanation: Independent quantification of the same allelic skew.
  - reference: PMID:25763508
    reference_title: "Combined Sepiapterin Reductase and Methylmalonyl-CoA Epimerase Deficiency in a Second Patient: Cerebrospinal Fluid Polyunsaturated Fatty Acid Level and Follow-Up Under L-DOPA, 5-HTP and BH4 Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the second patient presenting the combination of two
      homoallelic homozygous nonsense mutations in two genes distant from 1.8 Mb
      in the chromosome 2p13-3, the methylmalonyl-CoA epimerase gene (MCEE) and
      the sepiapterin reductase gene (SPR).
    explanation: Establishes the physical proximity of MCEE and SPR and the co-inheritance that confounds phenotype attribution.
  variants:
  - name: c.139C>T (p.Arg47*)
    description: >-
      The recurrent nonsense allele, truncating the protein within the first
      beta-sheet so that essentially no product survives nonsense-mediated decay.
      It accounts for the large majority of reported disease alleles.
    evidence:
    - reference: PMID:30682498
      reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Loss of almost the entire protein is therefore the likely cause of
        enzymatic dysfunction due to this variation, assuming there is residual
        mRNA following nonsense-mediated decay.
      explanation: States the functional consequence of the recurrent allele.
  - name: c.158T>G (p.Ile53Arg)
    description: >-
      A misfolding missense allele at the dimer interface, absent from ExAC,
      yielding almost no soluble protein and no measurable activity.
    evidence:
    - reference: PMID:30682498
      reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        However, hMCEE containing p.Ile53Arg had very low levels of detectable
        protein (6 ± 1% of wt), similar to empty vector (4 ± 2% of wt)
      explanation: Quantifies the loss of soluble protein that defines this allele's mechanism.
  - name: c.427C>T (p.Arg143Cys)
    description: >-
      An expressed but catalytically defective allele; the crystal structure of
      the variant protein shows displacement of two loops framing the active
      site. Reported only in the heterozygous state without an identified second
      allele, so its clinical role is not settled.
    evidence:
    - reference: PMID:30682498
      reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We solved the structure of MCEE-Arg143Cys to 1.9 Å and found significant
        disruption of two important loop structures, potentially impacting
        surface features as well as the active-site pocket.
      explanation: Gives the structural basis for loss of activity in an allele that is normally expressed.
  - name: c.379-644A>G
    description: >-
      A deep-intronic splicing variant found in trans with p.Arg47*, identified
      only by RNA study after exon sequencing found a single heterozygous allele.
      It is the reason a heterozygous-looking exome result does not exclude the
      diagnosis.
    evidence:
    - reference: PMID:27699154
      reference_title: "Methylmalonyl-coA epimerase deficiency: A new case, with an acute metabolic presentation and an intronic splicing mutation in the MCEE gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A heterozygous p.Arg47Ter (p.R47*) mutation in the MCEE gene was
        identified by sequencing of exons, and RNA studies identified a novel
        intronic splicing mutation, c.379-644A > G, confirming the diagnosis of
        MCE deficiency.
      explanation: Documents the deep-intronic allele and the RNA study needed to find it.
diagnosis:
- name: Urine organic acid analysis
  diagnosis_term:
    preferred_term: urine organic acid analysis
  description: >-
    The entry point. The profile shows methylmalonate that is mildly and
    sometimes intermittently raised, alongside more prominent 2-methylcitrate
    and 3-hydroxypropionate. Because the propionyl-CoA-derived acids dominate,
    the pattern reads as propionic acidemia and has led to that working
    diagnosis.
  results: >-
    Mild persistent methylmalonic aciduria with 2-methylcitrate,
    3-hydroxypropionate and ketosis; normal homocysteine.
  evidence:
  - reference: PMID:29104221
    reference_title: Methylmalonyl-CoA Epimerase Deficiency Mimicking Propionic Aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic investigations were consistent with propionic aciduria (PA).
      Unexpectedly, propionyl-CoA carboxylase activity was within the reference
      range.
    explanation: Documents the diagnostic confusion the organic acid profile causes, and how it was resolved.
- name: Newborn screening acylcarnitine profile
  diagnosis_term:
    preferred_term: newborn screening
  description: >-
    There is no dedicated screen for this disorder; it is picked up incidentally
    on the C3 propionylcarnitine marker used for propionic acidemia and mutase
    deficiency. The first screening-detected case showed raised C3 and
    2-methylcitrate with methylmalonate and homocysteine still in range, which is
    a pattern worth recognising because the defining analyte is the one that is
    normal.
  results: Elevated C3 with slightly raised 2-methylcitrate; methylmalonate and homocysteine within reference limits.
  evidence:
  - reference: PMID:39051409
    reference_title: "Biochemical Pattern of Methylmalonyl-CoA Epimerase Deficiency Identified in Newborn Screening: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated concentrations of C3 with a slight increase in MCA and normal MMA
      and Hcy during NBS should prompt the consideration of MCEE deficiency in
      differential diagnosis.
    explanation: States the screening pattern that should raise the diagnosis.
  - reference: PMID:39051409
    reference_title: "Biochemical Pattern of Methylmalonyl-CoA Epimerase Deficiency Identified in Newborn Screening: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A dedicated test for MCEE deficiency is not included in the newborn
      screening (NBS) panels but it can be incidentally identified when
      investigating methylmalonic acidemia and propionic acidemia.
    explanation: Establishes that ascertainment is incidental to screening for the flanking enzyme defects.
- name: MCEE molecular genetic testing
  diagnosis_term:
    preferred_term: molecular genetic testing
  description: >-
    Sequencing MCEE, usually within a methylmalonic-pathway gene panel, is the
    practical confirmatory test and the one GeneReviews treats as establishing
    the diagnosis. Exon sequencing alone is not always sufficient: one patient
    was heterozygous on exon sequencing and required RNA study to find a deep
    intronic second allele.
  results: Biallelic MCEE variants, most often homozygous c.139C>T (p.Arg47*).
  evidence:
  - reference: PMID:20301409
    reference_title: Isolated Methylmalonic Acidemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of isolated MMA is established in a proband by
      identification of biallelic pathogenic variants in MCEE, MMAA, MMAB,
      MMADHC, or MMUT
    explanation: GeneReviews states molecular testing as the diagnostic standard, with MCEE among the genes.
  - reference: PMID:38034150
    reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients present with overlapping clinical features with predominant
      neurological manifestations; genetic testing is indispensable for
      diagnosis.
    explanation: States that the clinical and biochemical picture does not distinguish the disorder, so genetic testing is required.
- name: Fibroblast propionate incorporation and complementation analysis
  diagnosis_term:
    preferred_term: enzyme activity assay
  description: >-
    Cultured fibroblasts show moderately reduced incorporation of labelled
    propionate that is not corrected by hydroxocobalamin. Complementation
    analysis assigns the defect to the MCEE group and distinguishes it from mut,
    cblA and cblB. Available in specialist laboratories only, and now largely
    superseded by sequencing.
  results: Moderately reduced propionate incorporation, no cobalamin response, complementation assigns to MCEE.
  evidence:
  - reference: PMID:17823972
    reference_title: "Atypical methylmalonic aciduria: frequency of mutations in the methylmalonyl CoA epimerase gene (MCEE)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the defect in these fibroblasts was complemented by mut, cblA, and cblB
      fibroblasts
    explanation: Establishes complementation analysis as the assay that assigns the defect to MCEE and separates it from the mutase and cobalamin groups.
differential_diagnoses:
- name: Propionic acidemia
  description: >-
    The closest mimic and the one that has repeatedly been diagnosed first,
    because 2-methylcitrate, 3-hydroxypropionate and C3 dominate the profile
    while methylmalonate is only mildly raised. Normal propionyl-CoA carboxylase
    activity is what separates them.
  evidence:
  - reference: PMID:29104221
    reference_title: Methylmalonyl-CoA Epimerase Deficiency Mimicking Propionic Aciduria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report isolated MCE deficiency in a boy who presented at five years of
      age with acute metabolic acidosis. Metabolic investigations were consistent
      with propionic aciduria (PA).
    explanation: A worked instance of the disorder being investigated as propionic aciduria.
- name: Methylmalonyl-CoA mutase deficiency and the cblA/cblB cobalamin disorders
  description: >-
    The other isolated methylmalonic acidemias. They produce a far larger
    methylmalonate elevation, and the cobalamin defects respond at least
    partially to hydroxocobalamin, which MCEE deficiency does not. One patient
    was assigned to the cblA complementation group for years before MCEE
    sequencing corrected it.
  evidence:
  - reference: PMID:16697227
    reference_title: "Homozygous nonsense mutation in the MCEE gene and siRNA suppression of methylmalonyl-CoA epimerase expression: a novel cause of mild methylmalonic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A patient, formerly identified as belonging to the cblA complementation
      group of vitamin B12 disorders but lacking mutations in the affected gene,
      MMAA, was tested for mutations in the MCEE gene.
    explanation: Documents a patient misassigned to cblA before MCEE was identified.
- name: Sepiapterin reductase deficiency
  description: >-
    Not a biochemical mimic but a co-inheritance trap. SPR lies 1.8 Mb from MCEE
    on 2p13.3, and in consanguineous families homozygous null alleles in both
    have segregated together. Because sepiapterin reductase deficiency is a
    treatable neurotransmitter disorder, a patient with MCEE deficiency and
    progressive neurological disease needs it excluded before the neurology is
    attributed to the epimerase defect.
  evidence:
  - reference: PMID:25763508
    reference_title: "Combined Sepiapterin Reductase and Methylmalonyl-CoA Epimerase Deficiency in a Second Patient: Cerebrospinal Fluid Polyunsaturated Fatty Acid Level and Follow-Up Under L-DOPA, 5-HTP and BH4 Trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive dystonia and cataplexy narcolepsy led to diagnose the second
      homozygous mutation in the SPR gene: c.751A>T; p.Lys251*.
    explanation: Documents the co-inherited second disorder that explained the neurological course.
treatments:
- name: Emergency management of acute metabolic decompensation
  description: >-
    Reversal of catabolism with intravenous glucose, correction of acidosis and
    dehydration, and temporary withdrawal of natural protein, as for the other
    intoxication-type organic acidemias. The published crises resolved with
    supportive metabolic management.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: metabolic emergency management
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute Metabolic Decompensation under Catabolic Stress
    description: Reversing catabolism removes the propionyl-CoA load that precipitated the crisis.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When isolated MMA is suspected during the diagnostic evaluation due to
        elevated propionylcarnitine (C3) on a newborn blood spot, metabolic
        treatment should be initiated immediately, while the suspected diagnosis
        is being confirmed.
      explanation: GeneReviews directs immediate metabolic treatment on suspicion, which is the management this treatment describes.
- name: Natural protein restriction
  description: >-
    Restriction of propiogenic amino acid precursors is the standard chronic
    management of isolated methylmalonic acidemia. Its necessity in MCEE
    deficiency specifically is unsettled: the best-documented patient with a
    severe initial crisis has remained well for six years on an essentially
    normal diet.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Accumulation of Propionate-Pathway Metabolites
    description: Reducing precursor intake lowers the propionyl-CoA flux arriving at the partial block.
    evidence:
    - reference: PMID:20301409
      reference_title: Isolated Methylmalonic Acidemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        restrict natural protein, particularly of propiogenic amino acid
        precursors, while maintaining a high-calorie diet
      explanation: States the dietary principle and its rationale in the isolated methylmalonic acidemias.
  evidence:
  - reference: PMID:27699154
    reference_title: "Methylmalonyl-coA epimerase deficiency: A new case, with an acute metabolic presentation and an intronic splicing mutation in the MCEE gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following the initial severe presentation, development has been normal and
      the clinical course over the subsequent six years has remained relatively
      uneventful on an essentially normal diet.
    explanation: Contradicts a requirement for protein restriction in this disorder, in the patient with the best-documented long-term follow-up.
- name: Hydroxocobalamin trial
  description: >-
    Cobalamin supplementation is standard practice in isolated methylmalonic
    acidemia because the cblA and cblB forms respond to it. MCEE deficiency does
    not: the enzyme is not cobalamin-dependent, and both the index patient and an
    adult patient on high-dose hydroxocobalamin failed to respond. A trial is
    still reasonable as part of the diagnostic work-up, but is recorded here as a
    treatment that does not work.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
  evidence:
  - reference: PMID:16752391
    reference_title: A homozygous nonsense mutation in the methylmalonyl-CoA epimerase gene (MCEE) results in mild methylmalonic aciduria.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Her fibroblast mutase activity was normal and no effect of vitamin B12 supplementation could be established.
    explanation: Records the absence of a cobalamin response in the index patient.
  - reference: PMID:31146325
    reference_title: "MCEE Mutations in an Adult Patient with Parkinson's Disease, Dementia, Stroke and Elevated Levels of Methylmalonic Acid."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Metabolic work-up revealed intermittent MMA-uria and increased plasma
      levels of propionyl-carnitine not responsive to treatment with high-dose
      hydroxycobalamin.
    explanation: Independent confirmation that high-dose hydroxocobalamin does not correct the biochemical phenotype.

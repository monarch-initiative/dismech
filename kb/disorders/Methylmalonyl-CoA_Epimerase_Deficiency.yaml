- name: Acute Encephalopathy and Neurological Injury
  conforms_to: metabolic_intoxication_decompensation#Acute Metabolic Encephalopathy
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Several patients have fixed neurological deficits - intellectual disability,
    spasticity, ataxia, seizures - and in some the deficit followed a documented
    decompensation with coma. The node is deliberately marked provisional rather
    than established, for two specific reasons and not out of general caution.
    First, two of the published patients with progressive neurological disease
    also carried homozygous nonsense variants in SPR, 1.8 Mb away on 2p13.3, and
    their course was fully explained by sepiapterin reductase deficiency and
    reversed by neurotransmitter replacement. Second, the largest review found no
    relationship between genotype and clinical phenotype, and asymptomatic
    individuals carry the same homozygous null allele as the most severely
    affected. The metabolic-injury mechanism is borrowed from the
    better-characterised organic acidemias; it has not been demonstrated in this
    disorder.
  evidence:
  - reference: PMID:38034150
    reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When first seen in our country, aged 10 and four years, respectively, both
      presented severe intellectual disability and spasticity.
    explanation: Documents the severe end of the neurological spectrum in molecularly confirmed patients.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For two patients, coincidental variations in the SPR gene causing
      sepiapterin reductase deficiency sufficiently explained their clinical
      symptoms
    explanation: Directly contradicts attributing the neurological phenotype to MCEE deficiency in the patients where it was most prominent, and is the reason this node is provisional.
  - reference: PMID:25763508
    reference_title: "Combined Sepiapterin Reductase and Methylmalonyl-CoA Epimerase Deficiency in a Second Patient: Cerebrospinal Fluid Polyunsaturated Fatty Acid Level and Follow-Up Under L-DOPA, 5-HTP and BH4 Trials."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A treatment with L-DOPA/carbidopa and 5-HTP dramatically improved the
      dystonic posture, the mood and the hypersomnia, proving that the
      pathogenesis was due to SRD.
    explanation: Shows the neurological syndrome in a dually affected patient responded to neurotransmitter replacement, attributing it to sepiapterin reductase deficiency rather than to MCEE.
  downstream:
  - target: Seizure
    description: Seizures occur both acutely during decompensation and as a chronic feature.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30682498

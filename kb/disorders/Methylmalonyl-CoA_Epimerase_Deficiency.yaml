- name: Accumulation of Propionate-Pathway Metabolites
  conforms_to: metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Because the block is partial and sits one step below propionyl-CoA
    carboxylase, the accumulating pool is weighted toward propionyl-CoA-derived
    metabolites rather than toward methylmalonate. 2-methylcitrate,
    3-hydroxypropionate and C3 propionylcarnitine dominate the profile while
    methylmalonic acid is only mildly and sometimes intermittently raised.
    Homocysteine and vitamin B12 stay normal, which separates this from the
    combined cobalamin defects. The consequence is diagnostic rather than merely
    descriptive: the profile reads as propionic acidemia, and published patients
    were investigated as such.

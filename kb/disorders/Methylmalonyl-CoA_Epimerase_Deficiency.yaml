  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been estimated and the disorder is not screened for
    directly. Published case counts are the only available measure: eleven cases
    were on record before the 2019 cohort screen added ten, and a 2023 review
    counted at least twenty-four including its own two patients.
  evidence:
  - reference: PMID:38034150
    reference_title: "Methylmalonyl Coenzyme A (CoA) Epimerase Deficiency, an Ultra-Rare Cause of Isolated Methylmalonic Aciduria With Predominant Neurological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Including our two novel patients, at least 24 cases of MCE deficiency have
      been described, with a broad clinical spectrum ranging from asymptomatic
      to severely neurologically impaired patients.
    explanation: Gives the published case count and the breadth of the clinical spectrum.
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We investigated a cohort of 150 individuals suffering from MMAuria of
      unknown origin, identifying ten new patients with pathogenic variations in
      MCEE.
    explanation: Quantifies the yield of MCEE variants among unexplained methylmalonic aciduria, the only systematic ascertainment published.

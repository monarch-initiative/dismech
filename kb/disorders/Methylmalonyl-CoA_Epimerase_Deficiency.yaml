  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Located at the centre of this pathway, methylmalonyl CoA epimerase (MCEE)
      catalyzes the epimerization of d-methylmalonyl-CoA, generated from
      propionyl-CoA by propionyl-CoA carboxylase (PCC), to form
      l-methylmalonyl-CoA, subsequently converted into succinyl-CoA by
      methylmalonyl-CoA mutase (MUT) for entry into the TCA cycle.
    explanation: States the position of the blocked reaction between the two flanking enzymes and its destination in the TCA cycle.
  - reference: PMID:16697227
    reference_title: "Homozygous nonsense mutation in the MCEE gene and siRNA suppression of methylmalonyl-CoA epimerase expression: a novel cause of mild methylmalonic aciduria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, siRNA only led to a small reduction in pathway activity,
      suggesting that previously postulated non-enzymatic conversion of D- to
      L-methylmalonyl-CoA may contribute to some flux through the pathway.
    explanation: The direct experimental basis for calling this a partial rather than a complete block.
  - reference: PMID:16697227
    reference_title: "Homozygous nonsense mutation in the MCEE gene and siRNA suppression of methylmalonyl-CoA epimerase expression: a novel cause of mild methylmalonic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that the patient's MCEE defect was responsible for the mild
      methylmalonic aciduria, confirming a partial requirement for the enzymatic
      activity in humans.
    explanation: States the partial requirement for MCEE activity in humans, the claim this node encodes.
  - reference: PMID:27699154
    reference_title: "Methylmalonyl-coA epimerase deficiency: A new case, with an acute metabolic presentation and an intronic splicing mutation in the MCEE gene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      There is evidence that this reaction may be partially bypassed in vivo, by
      a shunt pathway proceeding via free methylmalonic acid
    explanation: Names the second bypass route that keeps the block partial.

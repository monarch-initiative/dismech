discussions:
- discussion_id: controversy_mcee_clinical_significance
  prompt: >-
    Is MCEE deficiency a disease, or a biochemical trait that has been
    ascertained through disease?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Acute Encephalopathy and Neurological Injury
  - disease#Methylmalonyl-CoA Epimerase Deficiency
  rationale: >-
    The biochemical phenotype is not in dispute: biallelic null alleles, reduced
    propionate incorporation, complementation to the MCEE group, and rescue by
    wild-type cDNA. What is disputed is whether the clinical findings reported
    alongside it are caused by it. The case against is specific rather than
    general - two patients' neurological disease was fully explained by a
    co-inherited SPR defect and reversed by neurotransmitter replacement; two
    others were asymptomatic; siblings homozygous for the same null allele are
    discordant for symptoms; and the largest review found no genotype-phenotype
    relationship. The case for rests on the acute decompensations, which are hard
    to attribute to anything else and which follow catabolic stress in the way an
    intoxication-type block predicts. The most defensible current reading is that
    the enzymatic block and the acute crises are real, and that the chronic
    neurological burden is unproven.
  evidence:
  - reference: PMID:27699154
    reference_title: "Methylmalonyl-coA epimerase deficiency: A new case, with an acute metabolic presentation and an intronic splicing mutation in the MCEE gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical significance and biochemical characteristics of this rare
      condition have been incompletely defined.
    explanation: States the unresolved clinical significance that this controversy is about.
- discussion_id: gap_mcee_lys60gln_mechanism
  prompt: >-
    How does p.Lys60Gln cause disease when its protein behaves like wild type in
    every assay applied to it?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Two Molecular Routes to Enzyme Loss
  - genetic#MCEE
  rationale: >-
    p.Lys60Gln was reported homozygous in a patient, but it maps onto the
    wild-type structure without an obvious defect, is predicted tolerated by both
    SIFT and PolyPhen2, and its recombinant protein matches wild type in soluble
    level, unfolding and activity. Either the assays miss the defect - an
    interaction with a partner enzyme, a tissue-specific effect, an
    expression-level change not captured by over-expression - or the variant is
    not the cause of that patient's phenotype. Nothing published resolves it.
  evidence:
  - reference: PMID:30682498
    reference_title: "Genetic, structural, and functional analysis of pathogenic variations causing methylmalonyl-CoA epimerase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      By contrast, soluble protein levels, unfolding characteristics and activity
      of MCEE-Lys60Gln were comparable to wt, leaving unclear how this variation
      may cause disease.
    explanation: States the unresolved discrepancy directly.
- discussion_id: gap_mcee_residual_flux_route
  prompt: >-
    What actually carries the residual flux past the missing epimerase, and how
    much does it vary between people?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Partial Block of the Propionate-to-Succinate Pathway
  rationale: >-
    Two bypasses have been proposed - spontaneous non-enzymatic racemisation of
    the CoA ester, and a shunt through free methylmalonic acid - and the siRNA
    experiment shows something substantial is carrying flux, but neither has been
    quantified in humans and no second enzyme has been identified. This matters
    beyond mechanism: if bypass capacity varies between individuals it is the
    most obvious candidate explanation for why the same homozygous null allele
    produces everything from no symptoms to severe disease, which is the question
    the controversy above turns on.
  evidence:
  - reference: PMID:27699154
    reference_title: "Methylmalonyl-coA epimerase deficiency: A new case, with an acute metabolic presentation and an intronic splicing mutation in the MCEE gene."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      In contrast, the physiological significance of the second enzymatic step,
      catalysed by methylmalonyl-coA epimerase (MCE; also known as
      methylmalonyl-coA racemase), has remained less clear.
    explanation: Records that the physiological weight of this step, and hence of its bypasses, is unsettled.
notes: >-
  Curated for the metabolic WP-001 package (issue #5556, row 1.2.2.01), whose
  work hint was to review "Methylmalonic Acidemia" as a possible local home for
  this concept. It was curated as a separate entry rather than as a subtype of
  Methylmalonic_Acidemia, on three grounds. The lesion is a different enzyme at a
  different step, not an allelic or cofactor variant of methylmalonyl-CoA mutase,
  which is what that entry's existing subtypes describe. MONDO carries a distinct
  term for it. And the block is partial by construction, which makes the disease
  quantitatively and diagnostically unlike mutase deficiency - it presents
  looking like propionic acidemia rather than like the entry it would be nested
  under. The existing Methylmalonic_Acidemia entry's description scopes itself to
  MMUT, cblA and cblB and does not claim this form.

  No ORPHA cache was committed for ORPHA:308425: the Orphanet structured source
  needs the bulk Orphadata XML, which is not present in this checkout, so
  `just fetch-reference ORPHA:308425` fails rather than fetching a single record.
  There is no ClinGen Gene-Disease Validity assertion for MCEE in the committed
  ClinGen cache, so no CGGV evidence is cited; that is an absence in ClinGen's
  curation, not a judgement about the gene.

  Two PMIDs were written from memory during curation and both resolved to
  unrelated papers when fetched - an HDL/PI3K signalling study and a
  fructose-1,6-bisphosphatase cohort. Neither is cited here. The first had no
  cache file before this run and its file was removed; the second turned out to
  be an already-committed cache belonging to Fructose-1,6-Bisphosphatase
  Deficiency, so removing it would have broken that entry, and it was restored.
  Recorded because it is the exact failure mode CLAUDE.md describes for ontology
  CURIEs and it applies to PMIDs written from memory in the same way - and
  because the clean-up is its own hazard: a reference cache that looks like your
  own mistake may be another entry's evidence.

- name: Acute Metabolic Decompensation under Catabolic Stress
  conforms_to: metabolic_intoxication_decompensation#Acute Metabolic Decompensation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Intercurrent illness, fasting or a protein load raises the endogenous
    propionyl-CoA load beyond what the partially bypassed pathway can clear, and
    the compensated steady state fails. The result is a high-anion-gap metabolic
    acidosis with ketosis, sometimes with hypoglycaemia and mild hyperammonaemia.
    That these crises can be severe in a disorder whose baseline biochemistry is
    mild is the strongest argument that the enzyme deficiency is clinically real.

- FAM126A leukodystrophy
- HYCC1-related hypomyelination and congenital cataract
description: >-
  Hypomyelinating leukodystrophy 5, better known as hypomyelination and
  congenital cataract (HCC), is a rare autosomal recessive white-matter
  disorder caused by biallelic loss-of-function variants in HYCC1 (formerly
  FAM126A), which encodes hyccin. Hyccin is a regulatory subunit of the
  plasma-membrane phosphatidylinositol 4-kinase complex built around
  PI4KIIIalpha (PI4KA) with TTC7 and EFR3. Without it the complex is
  unstable and the plasma membrane makes less phosphatidylinositol
  4-phosphate (PtdIns(4)P). Oligodendrocytes, in which hyccin is the
  predominant FAM126 isoform, must expand their plasma membrane enormously to
  build myelin, and the proposed consequence of the PtdIns(4)P deficit is
  failure to myelinate the central nervous system; peripheral nerves are
  hypomyelinated as well. Most patients have bilateral congenital cataracts
  and normal or mildly delayed development in the first year, followed by
  slowly progressive spasticity, cerebellar ataxia, dysarthria, demyelinating
  peripheral neuropathy and mild to moderate intellectual disability. Brain MRI
  shows diffuse supratentorial hypomyelination with increased periventricular
  white-matter water content, and older patients develop white-matter loss and
  gliosis. Hypomorphic missense alleles give a milder course that can spare the
  peripheral nerves. Management is supportive, with early cataract extraction.

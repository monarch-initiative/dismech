    reference_title: "Hypomyelinating leukodystrophy-associated missense mutant of FAM126A/hyccin/DRCTNNB1A aggregates in the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the L53P mutant aggregates in cells, accumulating primarily in the ER."
    explanation: >-
      Aggregation of the missense protein in the ER.
  - reference: PMID:24417797
    reference_title: "Hypomyelinating leukodystrophy-associated missense mutant of FAM126A/hyccin/DRCTNNB1A aggregates in the endoplasmic reticulum."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition, the L53P mutant expression promotes the activities of kinases involved in unfolded protein response."
    explanation: >-
      UPR activation by the missense protein.
- name: Destabilised Plasma-Membrane PI4KIIIalpha Complex
  biological_scale: MOLECULAR
  description: >-
    Hyccin is an intrinsic component of the plasma-membrane phosphatidylinositol
    4-kinase complex with PI4KIIIalpha, TTC7 and EFR3, binding TTC7 through a
    large interface. Its absence lowers the levels of the other subunits and
    so of plasma-membrane PI4-kinase activity. Hyccin itself has no catalytic
    activity (GO annotates it only with protein binding), so the gene is
    placed on this node, whose molecular function is the activity of the
    complex it stabilises.
  genes:
  - preferred_term: HYCC1 (FAM126A)
    term:
      id: hgnc:24587
      label: FAM126A
  molecular_functions:
  - preferred_term: 1-phosphatidylinositol 4-kinase activity
    modifier: DECREASED
    term:
      id: GO:0004430
      label: 1-phosphatidylinositol 4-kinase activity
  evidence:
  - reference: PMID:26571211
    reference_title: "The leukodystrophy protein FAM126A (hyccin) regulates PtdIns(4)P synthesis at the plasma membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FAM126A is an intrinsic component of the plasma membrane phosphatidylinositol 4-kinase complex that comprises PI4KIIIα and its adaptors TTC7 and EFR3 (refs 5,7)."
    explanation: >-
      Places hyccin in the PI4KIIIalpha complex.
  - reference: PMID:34894559
    reference_title: "Hyccin/FAM126A deficiency reduces glial enrichment and axonal sheath, which are rescued by overexpression of a plasma membrane-targeting PI4KIIIα in Drosophila."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study shows Hyccin/FAM126A expression was necessary for the expression of other components of the PI4KIIIα complex in Drosophila."
    explanation: >-
      In flies, hyccin is required for the other complex components to be
      expressed.
  downstream:
  - target: Reduced Plasma-Membrane PtdIns(4)P Synthesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26571211
      reference_title: "The leukodystrophy protein FAM126A (hyccin) regulates PtdIns(4)P synthesis at the plasma membrane."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "HCC patient fibroblasts exhibit reduced PtdIns(4)P levels."
      explanation: >-
        Patient cells lacking a stable complex have less PtdIns(4)P.
- name: Reduced Plasma-Membrane PtdIns(4)P Synthesis
  biological_scale: CELLULAR
  description: >-
    Less PtdIns(4)P, a determinant of plasma-membrane identity and the
    precursor of PtdIns(4,5)P2, is made at the plasma membrane. The proposed
    pathogenic site is the oligodendrocyte, whose myelinating function
    requires massive plasma-membrane expansion; this cell-type link is
    proposed from the protein's expression pattern and the fly model rather
    than measured in human oligodendrocytes.
  conforms_to: cns_myelin_failure#Oligodendrocyte-Lineage or Myelin-Membrane Insult
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: phosphatidylinositol 4-phosphate biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0180048
      label: phosphatidylinositol 4-phosphate biosynthetic process
  evidence:
  - reference: PMID:26571211
    reference_title: "The leukodystrophy protein FAM126A (hyccin) regulates PtdIns(4)P synthesis at the plasma membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that HCC pathogenesis involves defects in PtdIns(4)P production in oligodendrocytes, whose specialized function requires massive plasma membrane expansion and thus generation of PtdIns(4)P and downstream phosphoinositides."
    explanation: >-
      States the oligodendrocyte PtdIns(4)P hypothesis.
  downstream:
  - target: CNS and PNS Hypomyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34894559
      reference_title: "Hyccin/FAM126A deficiency reduces glial enrichment and axonal sheath, which are rescued by overexpression of a plasma membrane-targeting PI4KIIIα in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of Hyccin/FAM126A in glia reduced the enrichment of glial cells, disrupted axonal sheaths and visual ability in the visual system, and these defects could be fully rescued by overexpressing either human FAM126A or FAM126B, and partially rescued by overexpressing a plasma membrane-targeting recombinant mouse PI4KIIIα."
      explanation: >-
        Glial hyccin loss disrupts axonal sheaths in flies and is partly
        rescued by restoring plasma-membrane PI4KIIIalpha, linking the kinase
        complex to sheath formation.
- name: CNS and PNS Hypomyelination
  biological_scale: TISSUE
  description: >-
    Myelin is never adequately laid down in the central nervous system, and
    peripheral nerves show reduced myelinated-fibre density with thin or
    absent myelin sheaths. MRI shows diffuse supratentorial hypomyelination,
    often deep cerebellar white-matter hypomyelination, increased
    periventricular white-matter water content and brainstem pyramidal tract
    involvement; older patients add white-matter loss and gliosis.
  conforms_to: cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  biological_processes:
  - preferred_term: central nervous system myelination
    modifier: DECREASED
    term:
      id: GO:0022010
      label: central nervous system myelination
  evidence:
  - reference: PMID:17974614
    reference_title: "Hypomyelination and congenital cataract: neuroimaging features of a novel inherited white matter disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supratentorial white matter hypomyelination was detected in all patients; 7 patients also had evidence of variably extensive areas of increased white matter water content."
    explanation: >-
      Hypomyelination on MRI in every patient of a ten-patient series.
  - reference: PMID:17683097
    reference_title: "Phenotypic characterization of hypomyelination and congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsy showed a slight-to-severe reduction in myelinated fiber density, with several axons surrounded by a thin myelin sheath or devoid of myelin."
    explanation: >-
      Peripheral nerve hypomyelination on biopsy.
  - reference: PMID:16951682
    reference_title: "Deficiency of hyccin, a newly identified membrane protein, causes hypomyelination and congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study highlights the essential role of hyccin in central and peripheral myelination."
    explanation: >-
      Links hyccin deficiency to central and peripheral myelination.

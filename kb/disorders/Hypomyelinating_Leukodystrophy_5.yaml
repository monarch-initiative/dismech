diagnosis:
- name: Brain MRI, nerve conduction studies and HYCC1 sequencing
  description: >-
    The combination of congenital cataract, a characteristic MRI pattern of
    hypomyelination with increased periventricular water content, and
    slowed nerve conduction suggests the diagnosis, which is confirmed by
    biallelic HYCC1 variants. Deletion analysis is needed because exonic
    microdeletions occur.
  evidence:
  - reference: PMID:20301737
    reference_title: "Hypomyelination and Congenital Cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of HCC can be established in individuals with typical clinical findings, characteristic abnormalities on brain MRI, and biallelic pathogenic variants in HYCC1 (formerly FAM126A) identified by molecular genetic testing."
    explanation: >-
      GeneReviews diagnostic criteria.
  - reference: PMID:17974614
    reference_title: "Hypomyelination and congenital cataract: neuroimaging features of a novel inherited white matter disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the proper clinical setting, recognition of suggestive neuroimaging findings should prompt appropriate genetic investigations."
    explanation: >-
      MRI pattern as the trigger for genetic testing.

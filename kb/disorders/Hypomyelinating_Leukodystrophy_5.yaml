animal_models:
- name: Drosophila glial Hyccin knockdown
  species: Drosophila melanogaster
  genotype: glia-specific RNAi knockdown of Hyccin (fly ortholog of HYCC1/FAM126A)
  publication: PMID:34894559
  description: >-
    Glial knockdown of the fly hyccin ortholog reduces glial enrichment and
    disrupts axonal sheaths and vision; human FAM126A or FAM126B rescues it
    fully and plasma-membrane-targeted PI4KIIIalpha partly, and PI4KIIIalpha
    knockdown phenocopies it.
  modeled_mechanisms:
  - target: Destabilised Plasma-Membrane PI4KIIIalpha Complex
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Hyccin is required for expression of the other complex components in
      fly glia.
    evidence:
    - reference: PMID:34894559
      reference_title: "Hyccin/FAM126A deficiency reduces glial enrichment and axonal sheath, which are rescued by overexpression of a plasma membrane-targeting PI4KIIIα in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study shows Hyccin/FAM126A expression was necessary for the expression of other components of the PI4KIIIα complex in Drosophila."
      explanation: >-
        Loss of the complex in the fly model.
  - target: CNS and PNS Hypomyelination
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Glial axonal sheaths are disrupted.
    limitations: >-
      Flies have no compact vertebrate myelin, so the model shows glial
      ensheathment failure rather than hypomyelination itself.
    evidence:
    - reference: PMID:34894559
      reference_title: "Hyccin/FAM126A deficiency reduces glial enrichment and axonal sheath, which are rescued by overexpression of a plasma membrane-targeting PI4KIIIα in Drosophila."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Knockdown of Hyccin/FAM126A in glia reduced the enrichment of glial cells, disrupted axonal sheaths and visual ability in the visual system, and these defects could be fully rescued by overexpressing either human FAM126A or FAM126B, and partially rescued by overexpressing a plasma membrane-targeting recombinant mouse PI4KIIIα."
      explanation: >-
        Disrupted axonal sheaths after glial knockdown, rescued by human
        hyccin.

pathophysiology:
- name: Biallelic HYCC1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic splice-site (the recurrent IVS5+1G>T), frameshift, deletion and
    missense variants in HYCC1 cause complete or severe hyccin deficiency.
    Truncating and splice alleles give the full phenotype with peripheral
    neuropathy; missense alleles such as p.Leu53Pro leave some protein and a
    milder course.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16951682
    reference_title: "Deficiency of hyccin, a newly identified membrane protein, causes hypomyelination and congenital cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified mutations in five affected families, resulting in a deficiency of hyccin, a newly identified 521-amino acid membrane protein."
    explanation: >-
      Identifies hyccin deficiency as the cause in the first five families.
  - reference: PMID:23998934
    reference_title: "Novel FAM126A mutations in hypomyelination and congenital cataract disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A residual amount of hyccin protein in primary fibroblasts was demonstrated by functional studies indicating that missense mutations are likely to have less detrimental effects if compared with splice-site mutations or deletions that cause the full-blown HCC phenotype, including peripheral nervous system involvement."
    explanation: >-
      Genotype-phenotype relationship between missense and null alleles.
  - reference: PMID:42382508
    reference_title: "Expanding the Phenotype and Genotype Spectrum of a Novel Mutation in Hypomyelinating Leukodystrophy-5 With a Review of the Literature on 42 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES identified a novel homozygous mutation (NM_032581: c.636_639del p.C213Dfs*7) in the FAM126A gene."
    explanation: >-
      A homozygous frameshift allele in an Iranian family.
  downstream:

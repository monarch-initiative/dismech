      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Absence of FAM126A, the predominant FAM126 isoform in oligodendrocytes, destabilizes the PI4KIIIα complex in mouse brain and patient fibroblasts."
      explanation: >-
        Loss of hyccin destabilises the kinase complex in patient cells and
        mouse brain.
  - target: Misfolded Hyccin Accumulation in the Endoplasmic Reticulum
- name: Misfolded Hyccin Accumulation in the Endoplasmic Reticulum
  biological_scale: CELLULAR
  description: >-
    The missense hyccin p.Leu53Pro aggregates in the endoplasmic reticulum
    and activates unfolded-protein-response kinases in cultured cells. This
    is a proposed additional toxic mechanism for some missense alleles, not a
    demonstrated cause of the human phenotype.
  biological_processes:
  - preferred_term: endoplasmic reticulum unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
  evidence:

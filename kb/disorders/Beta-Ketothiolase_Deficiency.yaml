- name: 3-Hydroxybutyrylcarnitine (C4OH)
  presence: INCREASED
  context: 'C4OH is a proposed co-primary newborn-screening marker for BKD. Because T2 also catalyses the thiolytic cleavage of acetoacetyl-CoA in extrahepatic ketolysis, D-3-hydroxybutyrate accumulates and is conjugated to C4OH. It was raised in 94% of a Chinese cohort with available values, and critically it can be elevated in patients whose C5-OH and C5:1 are normal — the false-negative pattern that causes BKD to be missed on the conventional two-marker panel. Like the other markers it is state-dependent and may normalise between crises.

    '

- phase: Long-term outcome
  notes: 'The overall prognosis is generally favorable with appropriate management, but not uniformly so: about four fifths of patients with follow-up data have a favourable outcome, while a minority develop developmental delay or die during a severe crisis. Neurological complications, particularly extrapyramidal signs, may occur as sequelae of severe episodes or occasionally independent of recognized metabolic crises. Outcome tracks timeliness of diagnosis rather than genotype - patients detected only after symptomatic presentation have a poorer prognosis than those found on newborn screening.

    '
  evidence:

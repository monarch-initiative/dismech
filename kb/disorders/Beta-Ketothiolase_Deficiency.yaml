      reference_title: "C4OH is a potential newborn screening marker-a multicenter retrospective study of patients with beta-ketothiolase deficiency in China."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: D-3-hydroxybutyrate ketone bodies can be converted into D-3-hydroxybutyrylcarnitine (C4OH) in vivo and in vitro

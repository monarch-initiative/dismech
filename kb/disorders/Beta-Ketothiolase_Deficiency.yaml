diagnosis:
- name: Chiral and molecular confirmation of BKD versus HSD10 mitochondrial disease
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Elevated urinary 2-methyl-3-hydroxybutyrate and tiglylglycine are NOT specific
    to BKD: the same organic-acid pattern occurs in HSD10 mitochondrial disease
    (HSD10MD, an X-linked disorder of HSD17B10), and patients have been
    misdiagnosed as BKD on metabolite data alone. Enzyme activity assay or ACAT1
    mutation analysis is therefore required to CONFIRM the diagnosis, not merely
    to characterise a diagnosis already made biochemically.
  evidence:
  - reference: PMID:34001203
    reference_title: "C4OH is a potential newborn screening marker-a multicenter retrospective study of patients with beta-ketothiolase deficiency in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: elevated excretion of urinary 2M3HB and TIG indicates not only BKTD but also HSD10 mitochondrial disease
    explanation: States directly that the characteristic BKD organic acids are not specific to BKD.

genetic:
- name: ACAT1 pathogenic variants
  gene_term:
    preferred_term: ACAT1
    term:
      id: hgnc:93
      label: ACAT1
  features: 'BKD is caused by biallelic pathogenic variants in the ACAT1 gene, which encodes mitochondrial acetoacetyl-CoA thiolase (T2). To date, 105 ACAT1 variants have been reported in 149 T2-deficient patients. The 56 disease-associated missense variants map to buried residues in the T2 crystal structure, likely causing deficiency through lower folding efficiency or stability. Residual T2 activity in vivo determines the severity of the biochemical phenotype, while clinical phenotype does not correlate well with genotype.

    '
  inheritance:
  - name: Autosomal recessive
    description: 'BKD follows autosomal recessive inheritance. All affected individuals carry biallelic (homozygous or compound heterozygous) pathogenic variants in ACAT1.

      '
    evidence:
    - reference: PMID:38853254
      reference_title: "Diabetic ketoacidosis in an adult with beta-ketothiolase deficiency (BKD) involving a novel ACAT1 variant : first report of established diabetes in BKD and a review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Beta-ketothiolase deficiency (BKD) is a rare autosomal recessive condition affecting isoleucine catabolism and ketone body metabolism.
      explanation: Directly states autosomal recessive inheritance for BKD.
    - reference: PMID:40598206
      reference_title: "Molecular characterization, clinical phenotype, and neurological outcome of twelve Palestinian children with beta-ketothiolase deficiency: report of two novel variants in the ACAT1 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'Beta-ketothiolase deficiency (mitochondrial acetoacetyl-CoA thiolase, T2) deficiency (OMIM #203750, *607809) is an autosomal recessive disorder of isoleucine catabolism and ketone body utilization.'
      explanation: Confirms autosomal recessive inheritance with OMIM reference.
  variants:
  - name: Compound heterozygous ACAT1 variants
    description: 'Compound heterozygosity for two different ACAT1 pathogenic variants is a common genotype. For example, ACAT1 c.481T>C, p.(Tyr161His) was identified in compound heterozygosity in an adult patient presenting with diabetic ketoacidosis.

      '
    evidence:
    - reference: PMID:38853254
      reference_title: "Diabetic ketoacidosis in an adult with beta-ketothiolase deficiency (BKD) involving a novel ACAT1 variant : first report of established diabetes in BKD and a review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: genetically confirmed compound heterozygosity for variants in ACAT1, including a novel ACAT1 c.481T>C, p.(Tyr161His) variant.
      explanation: Documents a specific novel ACAT1 variant in a BKD patient.
  - name: Founder mutations in consanguineous populations
    description: 'Founder mutations have been identified in specific populations. In a Palestinian cohort, a founder mutation was found in six patients from three families. All affected patients were offspring of consanguineous marriages, increasing the likelihood of homozygous pathogenic variants.

      '
    evidence:
    - reference: PMID:40598206
      reference_title: "Molecular characterization, clinical phenotype, and neurological outcome of twelve Palestinian children with beta-ketothiolase deficiency: report of two novel variants in the ACAT1 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: a founder mutation was identified in six patients from three families.
      explanation: Documents a founder ACAT1 mutation in the Palestinian population.
  - name: Missense variants affecting buried residues
    description: 'Almost all of the 56 disease-associated missense ACAT1 variants affect residues that are completely or partially buried in the T2 structure, causing deficiency through lower in vivo T2 activity due to reduced folding efficiency or stability.

      '
    evidence:
    - reference: PMID:31268215
      reference_title: "Mutation update on ACAT1 variants associated with mitochondrial acetoacetyl-CoA thiolase (T2) deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Almost all these missense variants concern residues that are completely or partially buried in the T2 structure. Such variants are expected to cause T2 deficiency by having lower in vivo T2 activity because of lower folding efficiency and/or stability.
      explanation: Structural analysis of ACAT1 missense variants mapped onto T2 crystal structure.
  evidence:
  - reference: PMID:31268215
    reference_title: "Mutation update on ACAT1 variants associated with mitochondrial acetoacetyl-CoA thiolase (T2) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: To date, 105 ACAT1 variants have been reported in 149 T2-deficient patients.
    explanation: Comprehensive mutation update cataloging all known ACAT1 variants.
  - reference: CGGV:assertion_99bcab0a-de59-479d-8fe6-8b76cbce90ee-2018-05-22T160000.000Z

treatments:
- name: Avoidance of catabolic triggers
  description: 'The cornerstone of chronic BKD management is avoidance of prolonged fasting, ketogenic diets, and prompt treatment of intercurrent illness to prevent catabolic stress and ketoacidotic episodes.

    '
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38853254
    reference_title: "Diabetic ketoacidosis in an adult with beta-ketothiolase deficiency (BKD) involving a novel ACAT1 variant : first report of established diabetes in BKD and a review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: BKD typically manifests in childhood as recurrent episodes of ketoacidosis, the frequency of which tends to reduce with age.
    explanation: Episodic nature triggered by catabolic stress supports the importance of trigger avoidance.
  - reference: PMID:34001203
    reference_title: "C4OH is a potential newborn screening marker-a multicenter retrospective study of patients with beta-ketothiolase deficiency in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Therefore, vaccines should be administered more cautiously to BKTD patients given that metabolic abnormalities can be significantly worsened by the physiologic changes associated with the inflammatory response to vaccination.
    explanation: Identifies the post-vaccination inflammatory response as a trigger requiring specific precaution - two cohort patients decompensated after vaccination, one fatally.
  notes: 'Vaccination deserves specific mention: it should not be withheld, but the post-vaccination inflammatory response is a recognised precipitant and its clinical picture can be mistaken for a routine vaccine reaction, delaying recognition of decompensation.

    '
- name: Dietary management
  description: 'Mild protein restriction with avoidance of excess fat intake, regular carbohydrate intake to prevent ketosis, and sick-day glucose and electrolyte solutions. The dietary approach is less restrictive than for many other organic acidemias due to the generally favorable prognosis.

    '
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  notes: Mild protein restriction and dietary management are standard of care but no controlled trial evidence exists; the supporting citation establishes the mechanistic rationale (isoleucine catabolism plus ketolysis are both blocked) rather than efficacy.
  evidence:
  - reference: PMID:38853254
    reference_title: "Diabetic ketoacidosis in an adult with beta-ketothiolase deficiency (BKD) involving a novel ACAT1 variant : first report of established diabetes in BKD and a review of the literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Beta-ketothiolase deficiency (BKD) is a rare autosomal recessive condition affecting isoleucine catabolism and ketone body metabolism.
    explanation: Establishes the dual isoleucine and ketolysis block that motivates mild protein restriction and avoidance of ketogenic states, but does not itself evaluate dietary efficacy.
- name: Acute crisis management with intravenous dextrose
  description: 'During acute ketoacidotic episodes, intravenous dextrose infusion to suppress ketogenesis (even if euglycemic), along with intravenous fluids and electrolyte correction. Bicarbonate may be used for severe acidosis. Severe crises may require intensive care with ventilation and dialysis when needed.

    '
  treatment_term:

- name: Fever
  description: 'Fever is a common accompaniment of the intercurrent infection that precipitates decompensation, and was among the presenting features in a 29-patient Chinese cohort.

    '
  notes: 'Deliberately carries no incoming causal edge. Fever in BKD sits on the TRIGGER side - it marks the intercurrent infection that precipitates a crisis - rather than being a consequence of the crisis, so wiring it downstream of the acute crisis node would invert the causal direction. It is recorded as a phenotype because it is a real and frequent presenting feature that clinicians will observe, but the pathograph should not imply the disease causes it.

    '

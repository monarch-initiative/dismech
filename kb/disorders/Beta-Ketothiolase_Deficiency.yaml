  notes: 'A single-centre expanded newborn-screening study of 206,977 neonates in Huaihua detected exactly ONE case of BKD. The paper reports that single case two ways: 1:206,977 over the whole screened cohort (Table 5 and Discussion), and 1:32,237 over the Miao-only denominator in the Results text, because the one affected neonate was of Miao ancestry. Both figures describe the same single patient - the Miao subpopulation was about 32,237 of the 206,977 screened, which the neighbouring VLCADD entry corroborates (2 Miao cases, 1:16,119). This record uses the whole-cohort figure; the ancestry-specific figure is recorded separately below. Neither should be treated as a stable rate: a denominator of one case cannot support a precise incidence, and the wide gap between the two published numbers for the same patient is itself a caution.

    '

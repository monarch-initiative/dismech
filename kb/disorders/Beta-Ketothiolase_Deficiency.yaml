    population: newborn screening reference interval used in the Chinese BKD cohort
    notes: 'No loinc_term is bound: LOINC has no code for 3-hydroxybutyrylcarnitine specifically. Affected patients in this cohort had a median C4OH of 1.38 umol/L (range 0.26-3.58), i.e. roughly 4-fold above the upper reference limit, but the value is state-dependent and can fall back into range between crises.


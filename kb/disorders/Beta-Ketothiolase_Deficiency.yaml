  notes: L-carnitine supplementation is a standard adjunctive therapy in organic acidemias but direct evidence specific to BKD efficacy is limited.
- name: Newborn screening
  description: 'BKD can be detected through expanded newborn screening using tandem mass spectrometry (MS/MS) via elevated C5:1 and C5-OH acylcarnitines. However, screening sensitivity is not 100 percent, and some affected patients may be missed: C5-OH and C5:1 can both be normal even during acute decompensation. Adding 3-hydroxybutyrylcarnitine (C4OH) as a co-primary marker is proposed to reduce these false negatives, and second-tier genetic testing using NGS panels reduces false positive rates.

    '
  treatment_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:38535123
    reference_title: "Harnessing Next-Generation Sequencing as a Timely and Accurate Second-Tier Screening Test for Newborn Screening of Inborn Errors of Metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The false positive rate for these six conditions after the NGS second-tier test was only 0.017%, and two cases of citrullinemia type II would have been missed as false negatives if only biochemical first-tier testing was performed.
    explanation: Documents implementation of NGS second-tier NBS including BKD, reducing false positives.
  - reference: PMID:34001203
    reference_title: "C4OH is a potential newborn screening marker-a multicenter retrospective study of patients with beta-ketothiolase deficiency in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The performance of BKTD NBS may be improved by adding C4OH to the C5OH and C5:1 combination in NBS.
    explanation: Proposes C4OH as a co-primary screening marker to reduce the false negatives of the conventional two-marker panel.

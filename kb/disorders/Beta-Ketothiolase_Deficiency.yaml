    reference_title: "C4OH is a potential newborn screening marker-a multicenter retrospective study of patients with beta-ketothiolase deficiency in China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Nineteen of 23 individuals (82% of the cohort) for whom there was information had a favorable outcome, while one showed a developmental delay and three died.
    explanation: Quantifies long-term outcome in the largest Chinese BKD cohort.
  - reference: PMID:34001203

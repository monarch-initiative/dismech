animal_models:
- species: Mouse
  genotype: Wild-type BALB/c infected with coxsackievirus B3
  category: Infection model
  description: >-
    Intraperitoneal coxsackievirus B3 infection of susceptible BALB/c mice produces
    acute myocarditis at days 7-14 and chronic myocarditis from day 28, with viral
    replication, innate and adaptive infiltration, myocyte necrosis and later
    fibrosis. It is the workhorse model for enteroviral myocarditis.
  publication: PMID:11334481
  modeled_mechanisms:
  - target: Cardiotropic Viral Infection of the Myocardium
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces cardiotropic enteroviral infection of the myocardium and the biphasic
      acute-then-chronic inflammatory course.
    limitations: >-
      Enterovirus accounts for a minority of contemporary human myocarditis, where
      parvovirus B19 and HHV-6 dominate the biopsy virome; outcome in the model is
      also strongly dependent on mouse strain, sex, age and viral passage.
    evidence:
    - reference: PMID:11334481
      reference_title: "Innate immunity and the role of the complement system in the pathogenesis of viral myocarditis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Infection of susceptible BALB/c mice with either Coxsackievirus or murine cytomegalovirus results in the development of acute myocarditis from day 7-14 after infection, and chronic myocarditis from day 28 onwards."
      explanation: >-
        Establishes that the model reproduces the acute and chronic phases of viral
        myocarditis.
  - target: Direct Cardiomyocyte Cytoskeletal Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Murine CVB3 hearts show loss of sarcolemmal dystrophin and dissociation of the
      sarcoglycan complex, the structural lesion this node asserts.
    limitations: >-
      Specific to enteroviral protease 2A; it does not generalise to parvovirus B19,
      HHV-6, drug-induced or checkpoint-inhibitor myocarditis.
    evidence:
    - reference: PMID:10988241
      reference_title: "Enteroviral protease 2A cleaves dystrophin: evidence of cytoskeletal disruption in an acquired cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The dystrophin-associated glycoproteins alpha-, beta-, gamma-, and delta-sarcoglycan and beta-dystroglycan were markedly decreased in the membrane fraction of infected cells in culture, and the typical sarcolemmal localization for each of these proteins was lost in coxsackievirus-B3-infected cardiomyocytes in vivo."
      explanation: >-
        Demonstrates the sarcolemmal lesion in the model in vivo.
- species: Mouse
  genotype: NOD2 knockout, coxsackievirus B3 infected
  category: Genetic perturbation of an infection model
  description: >-
    NOD2-deficient mice infected with CVB3 show reduced cardiac inflammation,
    fibrosis and apoptosis, lower CAR expression and viral copy number, and improved
    left ventricular function relative to wild-type infected controls.
  publication: PMID:28912259
  modeled_mechanisms:
  - target: Innate Immune Sensing and Cytokine Amplification
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Genetic removal of the innate sensor establishes that this node is causally
      required for the downstream inflammation, fibrosis and contractile loss.
    limitations: >-
      A single-gene knockout in an enteroviral model; NOD2 dependence has not been
      shown for the non-enteroviral or drug-induced forms of human myocarditis.
    evidence:
    - reference: PMID:28912259
      reference_title: "NOD2 (Nucleotide-Binding Oligomerization Domain 2) Is a Major Pathogenic Mediator of Coxsackievirus B3-Induced Myocarditis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NOD2 is an important mediator in the viral uptake and inflammatory response during the pathogenesis of CVB3 myocarditis."
      explanation: >-
        States the causal role of the innate sensing node established by the knockout.
- species: Mouse
  genotype: Cardiac myosin-immunized susceptible strain (experimental autoimmune myocarditis)
  category: Autoimmune induction model
  description: >-
    Immunization with cardiac myosin plus adjuvant produces T-cell-driven myocarditis
    and later dilated cardiomyopathy, and is the standard system for studying
    post-infectious autoimmunity, Th17/IL-17 biology and post-myocarditis fibrosis.
  publication: PMID:22531062
  modeled_mechanisms:
  - target: Anti-Cardiac Myosin Autoimmunity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Immunization against cardiac myosin reproduces the autoimmune arm and shows that
      anti-myosin reactivity alone is sufficient to cause myocarditis.
    limitations: >-
      Deliberate immunization with adjuvant is not how human myocarditis begins, so the
      model reproduces the effector autoimmunity without reproducing the initiating
      event or the tolerance breach.
    evidence:
    - reference: PMID:1315309
      reference_title: "Mouse cytomegalovirus infection induces antibodies which cross-react with virus and cardiac myosin: a model for the study of molecular mimicry in the pathogenesis of viral myocarditis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "immunization with cardiac myosin induced myocarditis and high titres of cardiac myosin antibodies in uninfected mice of the susceptible BALB/c strain only"
      explanation: >-
        Shows that cardiac myosin immunization alone induces myocarditis in susceptible
        animals.
  - target: Post-Inflammatory Ventricular Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The model develops post-myocarditis cardiac fibrosis and was used to establish
      IL-17 as a direct fibrogenic driver of it.
    limitations: >-
      Fibrosis in this model follows an artificially induced autoimmune insult; the
      IL-17/PKC-beta/Erk1/2/NF-kappaB route has not been shown to carry the same weight
      in human post-myocarditis remodelling.
    evidence:
    - reference: PMID:22531062
      reference_title: "IL-17 contributes to cardiac fibrosis following experimental autoimmune myocarditis by a PKCβ/Erk1/2/NF-κB-dependent signaling pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We therefore investigated whether IL-17 directly induced cardiac fibrosis in experimental autoimmune myocarditis (EAM) and explored the possible molecular mechanisms."
      explanation: >-
        Identifies the model as the system in which the fibrotic remodelling mechanism
        was established.
discussions:
- discussion_id: why_some_progress_to_dcm
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do some patients with acute myocarditis recover with no residual myocardial
    injury while others progress to dilated cardiomyopathy?
  attaches_to:
  - pathophysiology#Post-Inflammatory Ventricular Remodeling
  - pathophysiology#Inflammatory Dilated Cardiomyopathy
  rationale: >-
    This is the determining question for the whole entry: the acute phase is usually
    survivable and the chronic phase is not reversible, so everything that matters
    clinically turns on which patients cross between them. The relative contributions
    of the pathogen, host genotype and environment are unsettled, which is also why
    no treatment strategy is established for preventing the transition. The two
    hypothesis groups curated above - post-infectious autoimmunity and viral
    persistence - are the leading competing explanations and are not mutually
    exclusive.
  evidence:
  - reference: PMID:33046850
    reference_title: "Myocarditis and inflammatory cardiomyopathy: current evidence and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The relative roles of the pathogen, host genomics and environmental factors in disease progression and healing are still under discussion, including which viruses are active inducers and which are only bystanders."
    explanation: >-
      Names the gap explicitly, including the unresolved question of which detected
      viruses are actually causal.
- discussion_id: eam_cvb3_translational_validity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the two standard rodent models - coxsackievirus B3 infection and cardiac
    myosin-induced experimental autoimmune myocarditis - reproduce the mechanisms that
    actually drive human myocarditis, given that enterovirus is now a minority cause
    and that no human disease begins with adjuvanted self-antigen immunization?
  attaches_to:
  - pathophysiology#Cardiotropic Viral Infection of the Myocardium
  - pathophysiology#Anti-Cardiac Myosin Autoimmunity
  rationale: >-
    Most of the mechanistic content in this entry - innate sensing, dystrophin
    cleavage, anti-myosin autoimmunity, IL-17-driven fibrosis - rests on these two
    models, and both have a specific translational problem. CVB3 models an agent that
    contemporary human endomyocardial biopsy recovers far less often than parvovirus
    B19 or HHV-6, and its outcome is strongly conditioned on strain, sex and viral
    passage. Experimental autoimmune myocarditis reproduces the effector autoimmunity
    faithfully but starts from a deliberate adjuvanted immunization that has no human
    counterpart, so it cannot speak to how tolerance is broken in the first place.
    Evidence exists in these models; what is uncertain is how far it carries.
  evidence:
  - reference: PMID:35533750
    reference_title: "Coronary spasm in patients with biopsy-proven viral myocarditis: prevalence and association with virus type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequently, virus DNA was detected by PCR from parvovirus B19 (PVB19, 59%) and human herpesvirus 6 (HHV6, 26%)."
    explanation: >-
      Shows that the viruses recovered from contemporary human myocardium are not the
      one modelled by the standard CVB3 system.
- discussion_id: ici_myocarditis_module_gap
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should the immune_checkpoint_blockade module gain an immune-related-adverse-event
    arm so that checkpoint-inhibitor myocarditis, colitis, pneumonitis and hepatitis
    can declare conformance to a shared off-target-toxicity mechanism?
  attaches_to:
  - pathophysiology#Checkpoint Withdrawal and Off-Target Myocardial T Cell Reactivity
  rationale: >-
    The checkpoint-inhibitor form of myocarditis is a textbook treatment-toxicity
    conformer, but the existing module models only the anti-tumour arm - neoantigen
    generation, anti-tumour T cell response, adaptive immune resistance, T cell
    exhaustion - and has no node describing loss of peripheral tolerance in a
    non-tumour tissue. Rather than anchor this node to a tumour-immunity node it does
    not describe, no conforms_to is asserted here. Adding a shared irAE node to the
    module would let several disorder entries converge on it.

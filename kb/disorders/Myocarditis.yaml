    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac infection by SARS-CoV-2 is associated with more cardiac inflammation and electrocardiographic changes."
    explanation: >-
      Links myocardial inflammation to electrocardiographic abnormality in human
      hearts, supporting the inflammation-to-electrical-disturbance step.
  - reference: PMID:9197214

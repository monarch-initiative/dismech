- name: Giant Cell Destructive Myocardial Necrosis
  description: >-
    In giant cell myocarditis the infiltrate contains multinucleated giant cells and
    the myocyte necrosis is unusually extensive and rapidly progressive. Clinically
    it converges on the same endpoints as other forms - heart failure, ventricular
    arrhythmia and heart block - but at a pace that makes it the histological subtype
    with the worst prognosis, and it is the one form in which combination
    immunosuppression clearly prolongs survival.
  role: trigger
  biological_scale: TISSUE
  cell_types:

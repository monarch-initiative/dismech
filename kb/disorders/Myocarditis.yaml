    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients usually die of heart failure and ventricular arrhythmia unless cardiac transplantation is performed."
    explanation: >-
      Establishes ventricular arrhythmia, alongside pump failure, as a principal mode
      of death in myocarditis.
- name: Post-Inflammatory Ventricular Remodeling
  description: >-
    Where inflammation does not resolve, cardiac fibroblasts are activated and lay
    down extracellular matrix, replacing lost myocardium with scar. IL-17 from Th17
    cells is a direct fibrogenic signal in experimental autoimmune myocarditis,
    acting through PKC-beta, Erk1/2 and NF-kappaB. This node is the inflammatory
    entry into the conserved ventricular-remodelling step shared across the
    cardiomyopathies.
  role: effector
  biological_scale: TISSUE
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"

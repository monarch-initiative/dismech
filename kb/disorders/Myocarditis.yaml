name: Myocarditis
creation_date: "2026-08-28T00:00:00Z"
category: Immune
description: >-
  Myocarditis is inflammatory injury of the myocardium, defined histologically as
  an inflammatory infiltrate of the heart muscle together with injury or necrosis
  of the adjacent myocytes. It is a syndrome with many entry points rather than a
  single disease: most cases begin with an insult to the myocardium - most often a
  cardiotropic virus, but also a drug, a systemic immune-mediated disease, or
  release of T cell checkpoint restraint by cancer immunotherapy - which is
  followed by an immune-mediated phase in which the host response, not the
  original insult, becomes the dominant driver of myocyte injury. In a subset the
  process does not resolve, and persistent inflammation with fibrotic remodelling
  produces chronic inflammatory cardiomyopathy and dilated cardiomyopathy. Clinical
  expression ranges from a self-limited chest-pain syndrome to fulminant
  cardiogenic shock, high-grade atrioventricular block, ventricular tachyarrhythmia,
  and sudden cardiac death in otherwise healthy young people. The aetiological and
  histological forms carried here as subtypes share this downstream chain but
  differ sharply in their trigger, their infiltrate, and - critically - in whether
  immunosuppression helps or harms.
disease_term:
  preferred_term: myocarditis
  term:
    id: MONDO:0004496
    label: myocarditis
synonyms:
- inflammatory myocardial disease
- inflammatory cardiomyopathy
- myopericarditis
parents:
- Cardiovascular Disease
- Inflammatory Disease
- Immune-Mediated Disease
notes: >-
  Two curation decisions worth recording. First, the subtypes below deliberately
  mix two axes - aetiology (viral, checkpoint-inhibitor-associated) and histology
  (lymphocytic, eosinophilic, giant cell) - because that is how the clinical
  literature and the endomyocardial-biopsy report are actually organised; a viral
  case is usually lymphocytic on histology, so the two overlap rather than
  partition. Second, this entry does NOT declare conformance to the
  immune_checkpoint_blockade module for the checkpoint-inhibitor form. That module
  models anti-tumour efficacy (neoantigen generation, anti-tumour T cell response,
  adaptive immune resistance, T cell exhaustion) and carries no off-target-toxicity
  or immune-related-adverse-event node, so every available anchor would misdescribe
  what happens in the myocardium. Adding an irAE arm to that module is the right
  fix and is left as follow-up work.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Myocarditis is a leading identified cause of sudden cardiac death in young
    people, and the fulminant presentation carries high short- and long-term rates
    of cardiac death or transplantation. Giant cell myocarditis is near-uniformly
    fatal without immunosuppression or transplantation.
  evidence:
  - reference: PMID:31319912
    reference_title: "Fulminant Versus Acute Nonfulminant Myocarditis in Patients With Left Ventricular Systolic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with FM (n = 165) had significantly higher rates of cardiac death and heart transplantation compared with those with NFM (n = 55), both at 60 days (28.0% vs. 1.8%, p = 0.0001) and at 7-year follow-up (47.7% vs. 10.4%, p < 0.0001)."
    explanation: >-
      Quantifies the burden of the fulminant presentation in an international
      registry of biopsy-proven acute myocarditis.
has_subtypes:
- name: Viral
  display_name: Viral myocarditis
  subtype_term:
    preferred_term: viral myocarditis
    term:
      id: MONDO:0023161
      label: viral myocarditis
  description: >-
    Myocarditis in which a cardiotropic virus is the initiating insult. Enteroviruses
    (notably coxsackievirus B), parvovirus B19, human herpesvirus 6, adenovirus,
    influenza and SARS-CoV-2 are the agents most often recovered from myocardium.
    The endomyocardial-biopsy virome has shifted over time from enterovirus-dominant
    to parvovirus B19- and HHV-6-dominant, and detection of viral nucleic acid alone
    does not establish that the virus is causing the current inflammation rather
    than sitting latent in endothelium.
  evidence:
  - reference: PMID:35533750
    reference_title: "Coronary spasm in patients with biopsy-proven viral myocarditis: prevalence and association with virus type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most frequently, virus DNA was detected by PCR from parvovirus B19 (PVB19, 59%) and human herpesvirus 6 (HHV6, 26%)."
    explanation: >-
      Reports the contemporary distribution of viral genomes recovered by PCR from
      endomyocardial biopsies in biopsy-proven viral myocarditis.
- name: Lymphocytic
  display_name: Lymphocytic myocarditis
  description: >-
    The commonest histological form: a T-cell-rich mononuclear infiltrate with
    associated myocyte injury. It is the histological correlate of most presumed-viral
    and idiopathic myocarditis, and is the form in which the Myocarditis Treatment
    Trial found no benefit from routine immunosuppression. It has no distinct MONDO
    identifier; it is a biopsy-defined pattern rather than an aetiology.
  evidence:
  - reference: PMID:31319912
    reference_title: "Fulminant Versus Acute Nonfulminant Myocarditis in Patients With Left Ventricular Systolic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a subanalysis including only adults with lymphocytic myocarditis, the main endpoints occurred more frequently in FM compared with in NFM both at 60 days (19.5% vs. 0%, p = 0.005) and at 7-year follow up (41.4% vs. 3.1%, p = 0.0004)."
    explanation: >-
      Treats lymphocytic myocarditis as a distinct histological stratum with its own
      outcome profile, supporting it as a curated subtype.
- name: Giant Cell
  display_name: Giant cell myocarditis
  subtype_term:
    preferred_term: giant cell myocarditis
    term:
      id: MONDO:0023232
      label: giant cell myocarditis
  description: >-
    A destructive T-cell and macrophage myocarditis containing multinucleated giant
    cells and extensive myocyte necrosis, occurring in relatively young, previously
    healthy adults and frequently associated with other autoimmune disease. It is
    the aetiological form for which the lump/split decision matters most clinically:
    untreated it is near-uniformly fatal within months, it responds to combination
    immunosuppression, and it can recur in the transplanted heart.
  evidence:
  - reference: PMID:9197214
    reference_title: "Idiopathic giant-cell myocarditis--natural history and treatment. Multicenter Giant Cell Myocarditis Study Group Investigators."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant cell myocarditis is a disease of relatively young, predominantly healthy adults."
    explanation: >-
      The multicenter natural-history series that defined giant cell myocarditis as a
      distinct clinical entity.
  - reference: PMID:9197214
    reference_title: "Idiopathic giant-cell myocarditis--natural history and treatment. Multicenter Giant Cell Myocarditis Study Group Investigators."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nineteen percent had associated autoimmune disorders."
    explanation: >-
      Supports the association of the giant cell form with systemic autoimmunity,
      which distinguishes it from presumed-viral lymphocytic myocarditis.
- name: Eosinophilic
  display_name: Eosinophilic and hypersensitivity myocarditis
  description: >-
    Myocarditis with an eosinophil-rich infiltrate, most often provoked by a drug
    (hypersensitivity myocarditis) or occurring in the setting of a systemic
    eosinophilic disorder such as eosinophilic granulomatosis with polyangiitis.
    Peripheral eosinophilia is usual but not obligatory. The hypersensitivity form
    has the highest in-hospital mortality of the eosinophilic subgroups, and the
    first therapeutic step is withdrawal of the offending agent rather than a drug.
  evidence:
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorders most frequently associated with EM were hypersensitivity and eosinophilic granulomatosis with polyangiitis, which accounted for 34.1% and 12.8% of cases, respectively, whereas idiopathic or undefined forms accounted for 35.7% of cases."
    explanation: >-
      Establishes the aetiological composition of the eosinophilic form from a
      systematic review of histologically proven cases.
- name: ICI-Associated
  display_name: Immune checkpoint inhibitor-associated myocarditis
  description: >-
    Myocarditis precipitated by cancer immunotherapy targeting CTLA-4, PD-1 or PD-L1.
    It is uncommon but has the highest case fatality of any immune-related adverse
    event, typically presents within weeks of the first doses, and frequently
    overlaps with myositis and myasthenia gravis. Mechanistically it is not a
    hypersensitivity reaction: the myocardial infiltrate carries the same T cell
    clones found in the tumour and skeletal muscle. Combination CTLA-4 plus PD-1
    blockade is the best-established risk factor.
  evidence:
  - reference: PMID:30242316
    reference_title: "Fatal Toxic Effects Associated With Immune Checkpoint Inhibitors: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myocarditis had the highest fatality rate (52 [39.7%] of 131 reported cases), whereas endocrine events and colitis had only 2% to 5% reported fatalities"
    explanation: >-
      Establishes checkpoint-inhibitor myocarditis as the most lethal immune-related
      adverse event in a global pharmacovigilance analysis.
prevalence:
- population: Recipients of a second BNT162b2 mRNA COVID-19 vaccine dose, males aged 16-19 (excess over first dose)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 13.73
  rate_low: 8.11
  rate_high: 19.46
  notes: >-
    Risk difference between the second and first dose in Israeli national active
    surveillance; the highest-risk stratum identified. Reported as a risk difference
    per 100,000 vaccinated persons, not a general-population prevalence.
  evidence:
  - reference: PMID:34614328
    reference_title: "Myocarditis after BNT162b2 mRNA Vaccine against Covid-19 in Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall risk difference between the first and second doses was 1.76 per 100,000 persons (95% confidence interval [CI], 1.33 to 2.19), with the largest difference among male recipients between the ages of 16 and 19 years (difference, 13.73 per 100,000 persons; 95% CI, 8.11 to 19.46)."
    explanation: >-
      Source of the stratified risk-difference estimate and its confidence interval.
- population: Patients receiving combined ipilimumab plus nivolumab
  measure_type: PERIOD_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 270.0
  notes: >-
    Pharmacovigilance estimate of 0.27% of treated patients, converted to 270 per
    100,000. This is an occurrence rate within a drug-exposed population, not a
    population prevalence.
  evidence:
  - reference: PMID:27806233
    reference_title: "Fulminant Myocarditis with Combination Immune Checkpoint Blockade."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pharmacovigilance studies show that myocarditis occurred in 0.27% of patients treated with a combination of ipilimumab and nivolumab, which suggests that our patients were having a rare, potentially fatal, T-cell-driven drug reaction."
    explanation: >-
      Source of the 0.27% occurrence figure in combination checkpoint blockade.
progression:
- phase: Acute injury and inflammation
  duration: Approximately the first month after symptom onset
  notes: >-
    Trigger and prodrome, followed by myocardial oedema, myocyte injury with troponin
    release, and the peak risk of shock, malignant arrhythmia and high-grade AV block.
  evidence:
  - reference: PMID:11334481
    reference_title: "Innate immunity and the role of the complement system in the pathogenesis of viral myocarditis."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Infection of susceptible BALB/c mice with either Coxsackievirus or murine cytomegalovirus results in the development of acute myocarditis from day 7-14 after infection, and chronic myocarditis from day 28 onwards."
    explanation: >-
      Supports the separation of an acute from a chronic phase, though the timing is
      taken from murine models rather than from human natural history.
- phase: Chronic inflammatory cardiomyopathy
  notes: >-
    In the subset that does not resolve, persistent mononuclear infiltration and
    fibrotic remodelling produce ventricular dilation and heart failure. Whether the
    persisting driver is residual virus or post-infectious autoimmunity is unsettled;
    both hypotheses are curated below.
  evidence:
  - reference: PMID:33046850
    reference_title: "Myocarditis and inflammatory cardiomyopathy: current evidence and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At present, the reason why some patients recover without residual myocardial injury whereas others develop dilated cardiomyopathy is unclear."
    explanation: >-
      States directly that the determinants of progression from acute myocarditis to
      dilated cardiomyopathy remain unresolved.
mechanistic_hypotheses:
- hypothesis_group_id: postinfectious_autoimmunity
  hypothesis_label: Post-infectious autoimmunity against cardiac myosin sustains chronic injury
  status: CANONICAL
  description: >-
    Under this model the initiating virus is cleared, but antigen release and the
    inflammatory context break tolerance to cardiac myosin. Cross-reactive T cells
    and autoantibodies then sustain myocardial injury after the virus is gone, which
    is why virus-negative inflammatory cardiomyopathy responds to immunosuppression.
  evidence:
  - reference: PMID:11334481
    reference_title: "Innate immunity and the role of the complement system in the pathogenesis of viral myocarditis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The chronic phase of myocarditis is associated with mononuclear infiltration of the myocardium and the production of autoantibodies to cardiac myosin, although infectious virus cannot be detected past day 14 of infection."
    explanation: >-
      Describes the defining observation of this hypothesis: chronic myocardial
      inflammation and anti-myosin autoantibodies persisting after the virus has
      become undetectable.
- hypothesis_group_id: viral_persistence
  hypothesis_label: Persistent myocardial viral genome drives ongoing injury and remodelling
  status: ALTERNATIVE
  description: >-
    The competing model holds that low-level viral persistence in the myocardium,
    rather than autoimmunity, drives continuing injury; the corollary is that
    clearance predicts recovery and persistence predicts deterioration, and that
    immunosuppression could be harmful. The two hypotheses are not mutually exclusive
    and probably apply to different patients, which is exactly why endomyocardial
    biopsy with viral PCR governs whether immunosuppression is offered.
  evidence:
  - reference: PMID:14722762
    reference_title: "Viral heart disease: molecular diagnosis, clinical prognosis, and treatment strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Advances in molecular diagnosis have indicated beyond doubt that persistence of viral infection is associated with disease deterioration and poor prognosis."
    explanation: >-
      States the central claim of the viral-persistence model: continued presence of
      viral genome in myocardium tracks with clinical deterioration.
pathophysiology:
- name: Cardiotropic Viral Infection of the Myocardium
  description: >-
    A cardiotropic virus reaches and infects the myocardium. Enteroviruses such as
    coxsackievirus B enter cardiomyocytes through the coxsackievirus and adenovirus
    receptor; parvovirus B19 and HHV-6 are recovered most often from contemporary
    biopsies and are largely endothelial in tropism; SARS-CoV-2 can be detected in
    myocardium in fatal COVID-19, but usually as very rare infected cells. Direct
    viral replication is only the opening move - in most cases the burden of injury
    is delivered by what the host does next.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Viral entry into the cardiomyocyte
    term:
      id: GO:0046718
      label: symbiont entry into host cell
    modifier: INCREASED
  evidence:
  - reference: PMID:33046850
    reference_title: "Myocarditis and inflammatory cardiomyopathy: current evidence and future directions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inflammatory cardiomyopathy is predominantly mediated by viral infection, but can also be induced by bacterial, protozoal or fungal infections as well as a wide variety of toxic substances and drugs and systemic immune-mediated diseases."
    explanation: >-
      Establishes viral infection as the predominant trigger while naming the
      non-viral triggers modelled elsewhere in this entry.
  - reference: PMID:33727695
    reference_title: "Factors associated with myocardial SARS-CoV-2 infection, myocarditis, and cardiac inflammation in patients with COVID-19."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In the cases with cardiac infection, SARS-CoV-2+ cells in the myocardium were rare, with a median density of 1 cell/cm2."
    explanation: >-
      Supports myocardial viral presence while qualifying its extent - the density of
      infected cells is too low for direct cytolysis alone to explain the injury.
  downstream:
  - target: Direct Cardiomyocyte Cytoskeletal Injury
    causal_link_type: DIRECT
  - target: Innate Immune Sensing and Cytokine Amplification
    causal_link_type: DIRECT
  - target: Post-Inflammatory Ventricular Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - viral_persistence
    description: >-
      Under the viral-persistence model, failure to clear myocardial virus sustains
      injury and remodelling directly, without requiring an autoimmune intermediate.
    evidence:
    - reference: PMID:14722762
      reference_title: "Viral heart disease: molecular diagnosis, clinical prognosis, and treatment strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Myocarditis is considered as a potent predisposing factor for dilated cardiomyopathy (DCM)."
      explanation: >-
        Supports the link from myocarditis to subsequent dilated remodelling in the
        molecular-virology framing of this hypothesis group.
- name: Direct Cardiomyocyte Cytoskeletal Injury
  description: >-
    Coxsackievirus B3 protease 2A cleaves dystrophin, and the cleaved carboxyl
    terminus and its associated sarcoglycan complex are lost from the sarcolemma.
    The result is functional membrane fragility that phenocopies the hereditary
    sarcoglycanopathies, giving enteroviral myocarditis a mechanism of contractile
    failure that is independent of immune-mediated killing.
  role: mediator
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  cellular_components:
  - preferred_term: Sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
    modifier: ABNORMAL
  evidence:
  - reference: PMID:10988241
    reference_title: "Enteroviral protease 2A cleaves dystrophin: evidence of cytoskeletal disruption in an acquired cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that in cultured cardiac myocytes and murine hearts infected with coxsackievirus B3, the sarcolemmal localization of the dystrophin carboxyl terminus is lost."
    explanation: >-
      Demonstrates the loss of sarcolemmal dystrophin in coxsackievirus B3-infected
      cardiomyocytes both in culture and in vivo.
  - reference: PMID:10988241
    reference_title: "Enteroviral protease 2A cleaves dystrophin: evidence of cytoskeletal disruption in an acquired cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, the sarcolemmal integrity was functionally impaired with Evans blue dye uptake even though there was no generalized disruption of the sarcolemma of infected myocytes"
    explanation: >-
      Shows the loss is functional membrane fragility rather than gross membrane
      destruction, which is what makes it a distinct injury mechanism.
  downstream:
  - target: Cardiomyocyte Necrosis and Contractile Failure
    causal_link_type: DIRECT
- name: Innate Immune Sensing and Cytokine Amplification
  description: >-
    Cytosolic and membrane pattern-recognition receptors sense viral RNA and released
    damage-associated molecules. NOD2 is induced in the myocardium of virus-positive
    patients and drives NLRP3-caspase-1-IL-1beta signalling and viral uptake;
    monocytes and macrophages are recruited and generate IL-1, IL-6, TNF and reactive
    oxygen species. This is the step that converts a focal infection into diffuse
    myocardial inflammation, and it is the target of IL-1 blockade.
  role: amplifier
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: INCREASED
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:28912259
    reference_title: "NOD2 (Nucleotide-Binding Oligomerization Domain 2) Is a Major Pathogenic Mediator of Coxsackievirus B3-Induced Myocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endomyocardial biopsy NOD2 mRNA expression was higher in CVB3-positive patients compared with patients with myocarditis but without evidence of persistent CVB3 infection."
    explanation: >-
      Human biopsy evidence that innate viral sensing through NOD2 is upregulated
      specifically in virus-positive myocarditis.
  - reference: PMID:28912259
    reference_title: "NOD2 (Nucleotide-Binding Oligomerization Domain 2) Is a Major Pathogenic Mediator of Coxsackievirus B3-Induced Myocarditis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NOD2 knockdown(-/-) mice were rescued from the detrimental CVB3-mediated effects as shown by a reduced cardiac inflammation (less cardiac infiltrates and suppression of proinflammatory cytokines), cardiac fibrosis, apoptosis, lower CAR (Coxsackievirus and adenovirus receptor) expression and CVB3 copy number, and an improved left ventricular function in NOD2-/- CVB3 mice compared with wild-type CVB3 mice."
    explanation: >-
      Loss-of-function evidence that innate sensing is causally required for the
      inflammation, fibrosis and contractile loss downstream of it.
  - reference: PMID:33727695
    reference_title: "Factors associated with myocardial SARS-CoV-2 infection, myocarditis, and cardiac inflammation in patients with COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virus+ cases showed higher densities of myocardial CD68+ macrophages and CD3+ lymphocytes, as well as more electrocardiographic changes (23/27 vs 4/10; P = 0.01)."
    explanation: >-
      Links myocardial viral presence to macrophage and lymphocyte recruitment and,
      in turn, to electrical abnormality in human hearts.
  downstream:
  - target: Adaptive T Cell-Mediated Myocardial Injury
    causal_link_type: DIRECT
  - target: Cardiomyocyte Necrosis and Contractile Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Anti-Cardiac Myosin Autoimmunity
  description: >-
    Antigen release in an inflamed myocardium, together with viral epitopes that
    cross-react with the cardiac myosin heavy chain, breaks tolerance. The resulting
    anti-cardiac-myosin response outlives the infection and is itself sufficient to
    cause myocardial inflammation and necrosis - passive transfer of the antibodies
    reproduces the lesion in uninfected animals. This node is the mechanistic content
    of the post-infectious autoimmunity hypothesis and the rationale for
    immunosuppressing virus-negative inflammatory cardiomyopathy.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Adaptive immune response against cardiac myosin
    term:
      id: GO:0002250
      label: adaptive immune response
    modifier: INCREASED
  evidence:
  - reference: PMID:1315309
    reference_title: "Mouse cytomegalovirus infection induces antibodies which cross-react with virus and cardiac myosin: a model for the study of molecular mimicry in the pathogenesis of viral myocarditis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Passive transfer of anti-cardiac myosin antibodies from Day 56 post-infection sera of the BALB/c strain induced inflammation and necrosis of the myocardium of uninfected BALB/c recipients."
    explanation: >-
      Transfer experiment showing the autoantibody response is sufficient, not merely
      correlated, to produce myocardial inflammation and necrosis.
  - reference: PMID:1315309
    reference_title: "Mouse cytomegalovirus infection induces antibodies which cross-react with virus and cardiac myosin: a model for the study of molecular mimicry in the pathogenesis of viral myocarditis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These affinity-purified anti-cardiac myosin antibodies cross-react with MCMV protein(s)."
    explanation: >-
      Direct demonstration of the molecular mimicry between viral protein and cardiac
      myosin that this node asserts.
  downstream:
  - target: Adaptive T Cell-Mediated Myocardial Injury
    causal_link_type: DIRECT
    hypothesis_groups:
    - postinfectious_autoimmunity
    description: >-
      Under the post-infectious autoimmunity model, anti-myosin reactivity is what
      keeps the adaptive infiltrate running after the virus is cleared.
- name: Checkpoint Withdrawal and Off-Target Myocardial T Cell Reactivity
  description: >-
    Blockade of CTLA-4, PD-1 or PD-L1 removes the inhibitory signalling that normally
    restrains T cell activation, including in the heart. The myocardial infiltrate in
    checkpoint-inhibitor myocarditis carries the same clonally expanded T cell
    populations found in the tumour and in skeletal muscle, so this is not
    hypersensitivity to a drug but a loss of peripheral tolerance that lets a
    tumour-directed T cell response spill onto a shared cardiac and skeletal-muscle
    antigen. It explains the frequent myositis and myasthenic overlap.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: Negative regulation of T cell activation
    term:
      id: GO:0050868
      label: negative regulation of T cell activation
    modifier: DECREASED
  evidence:
  - reference: PMID:27806233
    reference_title: "Fulminant Myocarditis with Combination Immune Checkpoint Blockade."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Selective clonal T-cell populations infiltrating the myocardium were identical to those present in tumors and skeletal muscle."
    explanation: >-
      The clonal identity between tumour, skeletal muscle and myocardial T cells is
      the direct evidence that this is shared-antigen off-target reactivity.
  - reference: PMID:38982146
    reference_title: "Immune-checkpoint inhibitor-mediated myocarditis: CTLA4, PD1 and LAG3 in the heart."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inflammation of the heart muscle, known as myocarditis, resulting from ICI targeting cytotoxic T lymphocyte-associated antigen 4 (CTLA4), programmed cell death protein 1 (PD1) and PD1 ligand 1 (PDL1) is an infrequent but potentially fatal complication."
    explanation: >-
      Attributes the myocarditis specifically to pharmacological targeting of the
      CTLA4 and PD1/PDL1 checkpoint axes.
  downstream:
  - target: Adaptive T Cell-Mediated Myocardial Injury
    causal_link_type: DIRECT
- name: Eosinophil-Mediated Myocardial Injury
  description: >-
    In the eosinophilic and hypersensitivity forms the infiltrate is eosinophil-rich
    and the injury is driven by eosinophil degranulation products rather than by
    cytotoxic T cells. It arises either as a drug hypersensitivity reaction or as
    cardiac involvement of a systemic eosinophilic disorder, and peripheral
    eosinophilia accompanies about three-quarters of cases.
  role: trigger
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eosinophilic myocarditis (EM) is an acute life-threatening inflammatory disease of the heart."
    explanation: >-
      Establishes the eosinophilic form as a distinct, severe inflammatory myocardial
      disease.
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with peripheral eosinophilia observed in 75.9%"

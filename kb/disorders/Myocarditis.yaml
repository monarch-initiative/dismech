- name: Acute Contractile Failure and Cardiogenic Shock
  description: >-
    When myocyte loss and oedema are extensive and abrupt, ventricular systolic
    function collapses over hours to days and the patient presents in cardiogenic
    shock requiring inotropes or mechanical circulatory support. This fulminant
    presentation is where the acute mortality of myocarditis is concentrated, and it
    is also the point at which endomyocardial biopsy changes management, because the
    histological subtype independently predicts outcome.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:

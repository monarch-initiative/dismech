name: Myocarditis
creation_date: "2026-08-28T00:00:00Z"
category: Immune
description: >-
  Myocarditis is inflammatory injury of the myocardium, defined histologically by
  an inflammatory infiltrate of the heart muscle with degeneration or necrosis of
  adjacent myocytes. Most cases begin with an insult - most often a cardiotropic
  virus - that is followed by an immune-mediated phase in which the host response
  becomes the dominant driver of injury, and in a subset by a chronic phase with
  persistent inflammation, fibrotic remodelling, and progression to dilated
  cardiomyopathy. Presentation ranges from subclinical disease through
  chest pain with troponin release, to fulminant cardiogenic shock and sudden
  cardiac death in the young.

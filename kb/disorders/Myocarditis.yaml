- name: Genetically Susceptible Myocardium
  description: >-
    A minority of patients carry a pathogenic or likely pathogenic variant in an
    inherited-cardiomyopathy gene, and that background modifies how the myocardium
    responds to an inflammatory insult. Such variants are found in around 4% of
    uncomplicated acute myocarditis but in roughly a fifth of adults and nearly half
    of children whose myocarditis is complicated by heart failure, reduced ejection
    fraction, or life-threatening ventricular arrhythmia, with desmosomal genes
    predominating in the milder group and sarcomeric genes in the severe one. This
    is a susceptibility and severity modifier, not a cause of myocarditis - the
    inflammatory episode still needs its own trigger.
  role: modifier
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:38573261
    reference_title: "Prevalence of Pathogenic Variants in Cardiomyopathy-Associated Genes in Acute Myocarditis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For uncomplicated myocarditis, the pooled prevalence was 4.2% (95% CI: 1.8%-7.4%; I2 = 1.4%), whereas for complicated myocarditis, the pooled prevalence was 21.9% (95% CI: 14.3%-30.5%; I2 = 38.8%) and 44.5% (95% CI: 22.7%-67.4%; I2 = 52.8%) in adults and children, respectively."
    explanation: >-
      Quantifies the enrichment of cardiomyopathy-gene variants in severe versus mild
      acute myocarditis, which is the severity-modifier claim this node makes.
  - reference: PMID:38573261
    reference_title: "Prevalence of Pathogenic Variants in Cardiomyopathy-Associated Genes in Acute Myocarditis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P/LP variants in desmosomal genes were predominant in uncomplicated myocarditis (64%), whereas sarcomeric gene variants were more prevalent in complicated myocarditis (58% in adults and 71% in children)."
    explanation: >-
      Establishes that the gene classes involved differ by clinical severity, which is
      why this node is curated as a modifier rather than as a single susceptibility gene.
  downstream:
  - target: Cardiomyocyte Necrosis and Contractile Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A vulnerable structural background lowers the threshold at which an inflammatory
      insult produces clinically significant myocyte loss and contractile failure. The
      intermediate steps are not established, and the evidence is an association between
      genotype and severity rather than a demonstrated mechanism.
  - target: Post-Inflammatory Ventricular Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Adaptive T Cell-Mediated Myocardial Injury
  description: >-
    The defining lesion of myocarditis: a T cell and macrophage infiltrate in the
    myocardium accompanied by injury to the adjacent myocytes. This is the node at
    which all of the aetiological entry points converge, and it is the node the
    histological definition of myocarditis actually names - an inflammatory infiltrate
    with myocyte injury, in multiple foci, not explained by another cause. Cytotoxic
    CD8 T cells kill infected or autoantigen-presenting myocytes; CD4 T cells and
    macrophages sustain the response.

      id: NCIT:C35983
      label: Lymphocytic Infiltrate
  description: >-
    Mononuclear, T-cell-predominant infiltration of the myocardium with injury to
    adjacent myocytes; the commonest histological pattern and the substrate of the
    Dallas-criteria diagnosis.
  diagnostic: true
  subtype: Lymphocytic
  evidence:
  - reference: PMID:33727695
    reference_title: "Factors associated with myocardial SARS-CoV-2 infection, myocarditis, and cardiac inflammation in patients with COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Virus+ cases showed higher densities of myocardial CD68+ macrophages and CD3+ lymphocytes, as well as more electrocardiographic changes (23/27 vs 4/10; P = 0.01)."
    explanation: >-
      Quantifies the CD3+ lymphocyte and CD68+ macrophage composition of the
      myocardial infiltrate on human autopsy histology.
- name: Eosinophilic Infiltrate of the Myocardium
  finding_term:
    preferred_term: Eosinophilic infiltrate
    term:
      id: NCIT:C35981
      label: Eosinophilic Infiltrate
  description: >-
    Eosinophil-rich myocardial infiltration defining the eosinophilic and
    hypersensitivity forms on biopsy.
  diagnostic: true
  subtype: Eosinophilic
  evidence:
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on a systematic revision of all published histologically proven cases, this study aimed to describe the clinical presentation, treatment, and outcome of EM."
    explanation: >-
      Confirms that the eosinophilic form is defined and assembled histologically
      rather than clinically.
- name: Cardiac Fibrosis
  finding_term:
    preferred_term: Cardiac fibrosis
    term:
      id: NCIT:C178564
      label: Cardiac Fibrosis
  description: >-
    Replacement and interstitial fibrosis following myocyte loss, the histological
    correlate of chronic remodelling and of the arrhythmogenic scar substrate.
  evidence:
  - reference: PMID:22531062
    reference_title: "IL-17 contributes to cardiac fibrosis following experimental autoimmune myocarditis by a PKCβ/Erk1/2/NF-κB-dependent signaling pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "western blot, immunofluorescence and sirius red staining were used to analyze the collagen expression"
    explanation: >-
      Names the histological methods by which the post-myocarditis collagen
      deposition was demonstrated in the experimental model.
imaging_findings:
- name: Myocardial Late Gadolinium Enhancement
  modality: MRI
  imaging_finding_term:
    preferred_term: Myocardial late gadolinium enhancement
    term:
      id: HP:4000004
      label: Myocardial late gadolinium enhancement
  description: >-
    Non-ischaemic, typically subepicardial or mid-wall late gadolinium enhancement on
    cardiac magnetic resonance. Under the updated Lake Louise criteria it is one of
    the T1-based markers which, combined with a T2-based marker of oedema, supports a
    diagnosis of acute myocardial inflammation.
  diagnostic: true
  evidence:
  - reference: PMID:30545455
    reference_title: "Cardiovascular Magnetic Resonance in Nonischemic Myocardial Inflammation: Expert Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is based on at least one T2-based criterion (global or regional increase of myocardial T2 relaxation time or an increased signal intensity in T2-weighted CMR images), with at least one T1-based criterion (increased myocardial T1, extracellular volume, or late gadolinium enhancement)."
    explanation: >-
      Places late gadolinium enhancement within the consensus CMR criteria for
      diagnosing myocardial inflammation.
diagnosis:
- name: Endomyocardial Biopsy
  description: >-
    The reference standard for histological, immunophenotypic and pathogen-directed
    diagnosis. It is the only test that distinguishes lymphocytic from giant cell and
    eosinophilic disease and that separates virus-positive from virus-negative
    inflammation - and because those distinctions decide whether immunosuppression is
    offered, biopsy changes management rather than merely confirming it.
  evidence:
  - reference: PMID:31319912
    reference_title: "Fulminant Versus Acute Nonfulminant Myocarditis in Patients With Left Ventricular Systolic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we provide evidence that the histologic subtype of FM carries independent prognostic value, highlighting the need for timely endomyocardial biopsy in this condition"
    explanation: >-
      Supports biopsy as management-changing by showing the histological subtype
      carries prognostic information beyond clinical severity.
- name: Cardiac Magnetic Resonance
  description: >-
    The principal non-invasive tissue-characterisation test, combining T2-based
    markers of oedema with T1-based markers of injury under the updated Lake Louise
    criteria.
  evidence:
  - reference: PMID:30545455
    reference_title: "Cardiovascular Magnetic Resonance in Nonischemic Myocardial Inflammation: Expert Recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While having both a positive T2-based marker and a T1-based marker will increase specificity for diagnosing acute myocardial inflammation, having only one (i.e., T2-based OR T1-based) marker may still support a diagnosis of acute myocardial inflammation in an appropriate clinical scenario, albeit with less specificity."
    explanation: >-
      States the diagnostic logic and the specificity trade-off of the CMR criteria.
differential_diagnoses:
- name: Acute Myocardial Infarction
  description: >-
    The infarct-like presentation of myocarditis - chest pain, ST/T change and
    troponin release - is indistinguishable from acute coronary syndrome until
    coronary imaging shows unobstructed arteries.
  disease_term:
    preferred_term: myocardial infarction
    term:
      id: MONDO:0005068
      label: myocardial infarction
  distinguishing_features:
  - Unobstructed coronary arteries on angiography
  - Non-ischaemic (subepicardial or mid-wall rather than subendocardial) distribution of late gadolinium enhancement
  evidence:
  - reference: PMID:35533750
    reference_title: "Coronary spasm in patients with biopsy-proven viral myocarditis: prevalence and association with virus type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 618 consecutive patients with unobstructed coronary arteries who underwent endomyocardial biopsy between 2008 and 2018 were screened."
    explanation: >-
      Describes the clinical population in which myocarditis is separated from
      coronary disease - patients presenting like infarction but with unobstructed
      coronaries.
- name: Cardiac Sarcoidosis
  description: >-
    Granulomatous myocardial inflammation that presents with the same high-grade AV
    block, ventricular arrhythmia and heart failure, and is curated separately in
    this knowledge base.
  disease_term:
    preferred_term: cardiac sarcoidosis
    term:
      id: MONDO:0001707
      label: cardiac sarcoidosis
  distinguishing_features:
  - Non-caseating epithelioid granulomas rather than a lymphocytic, eosinophilic or giant-cell-with-necrosis infiltrate
  - Extracardiac sarcoid involvement
  - Patchy distribution favouring the basal septum on imaging
environmental:
- name: mRNA COVID-19 vaccination
  description: >-
    Myocarditis occurs rarely after mRNA COVID-19 vaccination, concentrated in
    adolescent and young adult males and mostly after the second dose. The clinical
    course is usually mild and self-limited, unlike infection-associated myocarditis.
  effect: Increases the short-term incidence of myocarditis, concentrated in young males after dose 2
  notes: >-
    No exposure_term is bound. ECTO was searched and carries no vaccination-exposure
    term suitable for this concept; a free-text preferred_term with no ontology
    binding would render as an unbound node without adding meaning, so it is omitted
    deliberately rather than left un-researched.
  evidence:
  - reference: PMID:34614328
    reference_title: "Myocarditis after BNT162b2 mRNA Vaccine against Covid-19 in Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of myocarditis, although low, increased after the receipt of the BNT162b2 vaccine, particularly after the second dose among young male recipients."
    explanation: >-
      National active-surveillance evidence for the association and for its
      concentration in young males after the second dose.
  - reference: PMID:34614328
    reference_title: "Myocarditis after BNT162b2 mRNA Vaccine against Covid-19 in Israel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation was judged to be mild in 129 recipients (95%); one fulminant case was fatal."
    explanation: >-
      Establishes that the vaccine-associated form is usually mild, while recording
      that fulminant disease occurred.
  influences_mechanisms:
  - target: Adaptive T Cell-Mediated Myocardial Injury
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Vaccination is followed by myocardial inflammation in a small excess of
      recipients. The intermediate steps are not established - molecular mimicry and
      cytokine dysregulation are both proposed and neither is settled - so the link is
      recorded as indirect with unknown intermediates.
    evidence:
    - reference: PMID:34614328
      reference_title: "Myocarditis after BNT162b2 mRNA Vaccine against Covid-19 in Israel."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As compared with the expected incidence based on historical data, the standardized incidence ratio was 5.34 (95% CI, 4.48 to 6.40) and was highest after the second dose in male recipients between the ages of 16 and 19 years (13.60; 95% CI, 9.30 to 19.20)."
      explanation: >-
        Quantifies the excess of myocarditis over background incidence following
        vaccination, which is the evidence that the exposure acts on this node.
- name: Immune checkpoint inhibitor therapy
  description: >-
    Therapeutic blockade of CTLA-4, PD-1 or PD-L1 for cancer. Combination CTLA-4 plus
    PD-1 blockade carries the highest risk, and myocarditis is the most lethal of the
    immune-related adverse events it provokes.
  effect: Triggers off-target myocardial T cell reactivity by removing checkpoint restraint
  exposure_term:
    preferred_term: exposure to immune checkpoint inhibitor drug
    term:
      id: ECTO:0000509
      label: exposure to drug
  evidence:
  - reference: PMID:30242316
    reference_title: "Fatal Toxic Effects Associated With Immune Checkpoint Inhibitors: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combination PD-1/CTLA-4 deaths were frequently from colitis (32 [37%]) and myocarditis (22 [25%])."
    explanation: >-
      Establishes checkpoint-inhibitor exposure, particularly combination therapy, as
      a cause of fatal myocarditis.
  influences_mechanisms:
  - target: Checkpoint Withdrawal and Off-Target Myocardial T Cell Reactivity
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The drug exposure is the proximate cause of the loss of checkpoint restraint on
      myocardial T cells.
    evidence:
    - reference: PMID:27806233
      reference_title: "Fulminant Myocarditis with Combination Immune Checkpoint Blockade."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the cases of two patients with melanoma in whom fatal myocarditis developed after treatment with ipilimumab and nivolumab."
      explanation: >-
        Direct clinical evidence linking the checkpoint-inhibitor exposure to the
        myocardial T cell lesion.
- name: Strenuous exercise during active myocarditis
  description: >-
    Vigorous exertion while the myocardium is actively inflamed is believed to amplify
    injury and arrhythmic risk, which is why exercise restriction is standard advice
    during the acute phase. Half of sudden cardiac deaths in athletes are exertional.
  effect: Believed to amplify myocardial injury and arrhythmic risk during active inflammation
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  notes: >-
    The mechanistic link is inferred rather than demonstrated: the cited athlete
    cohort establishes that half of sudden cardiac deaths are exertional across all
    causes, not that exertion causes deterioration specifically in myocarditis. The
    evidence is graded PARTIAL for that reason and no influences_mechanisms link is
    asserted.
  evidence:
  - reference: PMID:37955565
    reference_title: "Sudden Cardiac Death in National Collegiate Athletic Association Athletes: A 20-Year Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SCD events were exertional in 50% of cases."
    explanation: >-
      Supports the association between exertion and sudden cardiac death across
      causes; it does not by itself establish that exertion worsens myocarditis
      specifically.
genetic:
- name: Cardiomyopathy-associated gene variants
  relationship_type: SUSCEPTIBILITY
  association: >-
    Pathogenic or likely pathogenic variants in inherited-cardiomyopathy genes -
    desmosomal genes such as DSP and PKP2, and sarcomeric and cytoskeletal genes
    such as TTN, MYH7 and FLNC - are found in a substantial minority of patients
    with acute myocarditis and are markedly enriched in those with a complicated
    course. There is no myocarditis gene; the genotype modifies susceptibility and
    severity rather than causing the inflammatory episode, and it is one reason a
    myocarditis-like presentation can be the first manifestation of an inherited
    cardiomyopathy.
  notes: >-
    No gene_term is bound because the evidence curated here is at the level of gene
    classes (desmosomal versus sarcomeric) from a meta-analysis, not a variant-level
    claim about a named gene. Binding a specific HGNC gene would assert more than the
    cited source supports.
  evidence:
  - reference: PMID:38573261
    reference_title: "Prevalence of Pathogenic Variants in Cardiomyopathy-Associated Genes in Acute Myocarditis: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variants are present in a large proportion of patients with acute myocarditis. The prevalence of genetic variants and the genes involved vary according to age and clinical presentation."
    explanation: >-
      States both the frequency of cardiomyopathy-gene variants in acute myocarditis
      and their dependence on age and presentation.
  - reference: PMID:38573261
    reference_title: "Prevalence of Pathogenic Variants in Cardiomyopathy-Associated Genes in Acute Myocarditis: A Systematic Review and Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute myocarditis is an inflammatory condition that may precede the development of dilated or arrhythmogenic cardiomyopathy."
    explanation: >-
      Supports the overlap between acute myocarditis and inherited cardiomyopathy that
      makes genetic evaluation relevant; it does not itself establish causality.
treatments:
- name: Guideline-Directed Heart Failure Therapy and Supportive Care
  description: >-
    The baseline for most patients. Ventricular dysfunction is treated with standard
    heart-failure therapy - in the ARAMIS trial population an ACE inhibitor and a
    beta-blocker were given as standard of care - alongside rhythm monitoring and
    haemodynamic support. Most uncomplicated cases are self-limited and need nothing
    more.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:37640625
    reference_title: "Rationale and design of the ARAMIS trial: Anakinra versus placebo, a double blind randomized controlled trial for the treatment of acute myocarditis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in addition to standard of care, including an angiotensin-converting enzyme inhibitor and a beta-blocker"
    explanation: >-
      Documents ACE inhibition plus beta-blockade as the standard-of-care backbone in
      a contemporary randomized acute-myocarditis trial.
- name: Immunosuppression for Virus-Negative Inflammatory Cardiomyopathy
  description: >-
    Prednisone plus azathioprine in patients with biopsy-proven myocarditis, chronic
    heart failure refractory to conventional therapy, and no myocardial viral genome.
    The TIMIC trial showed a significant improvement in ejection fraction and a
    reduction in ventricular dimensions in the treated arm while the placebo arm
    deteriorated. The pathogen-exclusion step is not optional - it is what separates
    this indication from the unselected population in which immunosuppression failed.
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Adaptive T Cell-Mediated Myocardial Injury
    description: >-
      Suppresses the adaptive infiltrate that drives ongoing myocyte injury once the
      myocardium has been shown to be virus-free.
    evidence:
    - reference: PMID:19556262
      reference_title: "Randomized study on the efficacy of immunosuppressive therapy in patients with virus-negative inflammatory cardiomyopathy: the TIMIC study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Group 1 showed a significant improvement of left-ventricular ejection fraction and a significant decrease in left-ventricular dimensions and volumes compared with baseline."
      explanation: >-
        Randomized evidence that suppressing the immune infiltrate reverses the
        contractile and dimensional consequences of the mechanism.
  evidence:
  - reference: PMID:19556262
    reference_title: "Randomized study on the efficacy of immunosuppressive therapy in patients with virus-negative inflammatory cardiomyopathy: the TIMIC study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm the efficacy of immunosuppression in virus-negative inflammatory cardiomyopathy."
    explanation: >-
      The trial conclusion supporting this indication.
  - reference: PMID:7596370
    reference_title: "A clinical trial of immunosuppressive therapy for myocarditis. The Myocarditis Treatment Trial Investigators."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results do not support routine treatment of myocarditis with immunosuppressive drugs."
    explanation: >-
      Recorded as a refuting item because it is the negative trial that bounds this
      indication: in unselected myocarditis, without virus exclusion, immunosuppression
      did not improve ejection fraction or survival.
- name: Combination Immunosuppression for Giant Cell Myocarditis
  description: >-
    Corticosteroids combined with cyclosporine, azathioprine, or both. In the
    multicenter registry, treated patients survived on average 12.3 months versus 3.0
    months untreated. This is the clearest survival benefit from immunosuppression in
    any myocarditis subtype and is the practical reason the giant cell form must be
    identified on biopsy.
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: cyclosporine
      term:
        id: CHEBI:4031
        label: cyclosporin A
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Giant Cell Destructive Myocardial Necrosis
    description: >-
      Suppresses the T cell and macrophage response responsible for the destructive
      giant cell lesion.
    evidence:
    - reference: PMID:9197214
      reference_title: "Idiopathic giant-cell myocarditis--natural history and treatment. Multicenter Giant Cell Myocarditis Study Group Investigators."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 22 patients treated with corticosteroids and cyclosporine, azathioprine, or both therapies survived for an average of 12.3 months, as compared with an average of 3.0 months for the 30 patients who received no immunosuppressive therapy (P=0.001)."
      explanation: >-
        Quantifies the survival gain from suppressing the giant cell lesion.
  evidence:
  - reference: PMID:9197214
    reference_title: "Idiopathic giant-cell myocarditis--natural history and treatment. Multicenter Giant Cell Myocarditis Study Group Investigators."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 22 patients treated with corticosteroids and cyclosporine, azathioprine, or both therapies survived for an average of 12.3 months, as compared with an average of 3.0 months for the 30 patients who received no immunosuppressive therapy (P=0.001)."
    explanation: >-
      The observational comparison supporting combination immunosuppression in the
      giant cell form.
  notes: Applies to the Giant Cell subtype.
- name: Corticosteroid Therapy for Eosinophilic Myocarditis
  description: >-
    Withdrawal of the offending agent where one is identified, plus corticosteroids;
    steroids were given to more than three-quarters of patients in the largest
    published series. In-hospital mortality remains high, and is highest in the
    hypersensitivity form.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Eosinophil-Mediated Myocardial Injury
    description: >-
      Corticosteroids suppress the eosinophil-driven infiltrate responsible for the
      myocardial injury in this form.
    evidence:
    - reference: PMID:29096807
      reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Steroids were administered in 77.7% of patients."
      explanation: >-
        Documents corticosteroid use as near-universal practice in this form; the
        series is observational and reports no controlled effect estimate, so the
        support is partial.
  evidence:
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In-hospital death was 22.3% (n = 40), with the highest occurrence in the hypersensitivity form (36.1%; p = 0.026)."
    explanation: >-
      Records the residual mortality despite widespread steroid use, bounding the
      claim that this treatment is sufficient.
  notes: Applies to the Eosinophilic subtype.
- name: High-Dose Corticosteroids and Drug Withdrawal for Checkpoint-Inhibitor Myocarditis
  description: >-
    Immediate discontinuation of the checkpoint inhibitor with early high-dose
    corticosteroids. The evidence base is observational; the two index cases were
    refractory and fatal despite treatment, which is the origin of the recommendation
    to act early rather than escalate late.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylprednisolone
      term:
        id: NCIT:C647
        label: Methylprednisolone
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Checkpoint Withdrawal and Off-Target Myocardial T Cell Reactivity
    description: >-
      Stopping the drug removes the ongoing checkpoint blockade; corticosteroids
      suppress the T cell response it released.
    evidence:
    - reference: PMID:30242316
      reference_title: "Fatal Toxic Effects Associated With Immune Checkpoint Inhibitors: A Systematic Review and Meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Median time from symptom onset to death was 32 days."
      explanation: >-
        Supports the urgency rationale by showing how short the window between symptom
        onset and death is; it does not itself measure corticosteroid efficacy.
  evidence:
  - reference: PMID:27806233
    reference_title: "Fulminant Myocarditis with Combination Immune Checkpoint Blockade."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, there was development of myositis with rhabdomyolysis, early progressive and refractory cardiac electrical instability, and myocarditis with a robust presence of T-cell and macrophage infiltrates."
    explanation: >-
      Documents the refractory course that motivates immediate drug withdrawal and
      early high-dose steroids; it does not demonstrate steroid efficacy.
  notes: Applies to the ICI-Associated subtype.
- name: Temporary Mechanical Circulatory Support
  description: >-
    Extracorporeal membrane oxygenation or a temporary ventricular assist device to
    carry the patient through fulminant cardiogenic shock, either to myocardial
    recovery or to transplantation. It was used in about one in six patients in the
    eosinophilic series and is the established bridge in giant cell disease.
  treatment_term:
    preferred_term: Extracorporeal Membrane Oxygenation
    term:
      id: NCIT:C171507
      label: Extracorporeal Membrane Oxygenation
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Acute Contractile Failure and Cardiogenic Shock
    description: >-
      Mechanical support substitutes for the failed ventricle while the inflammatory
      injury resolves or a donor organ is found.
    evidence:
    - reference: PMID:12057701
      reference_title: "Giant cell myocarditis: clinical presentation, bridge to transplantation with mechanical circulatory support, and long-term outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In our experience, these patients can be bridged successfully to transplant with mechanical circulatory assist."
      explanation: >-
        Direct evidence that mechanical support addresses the shock node as a bridge
        to definitive therapy.
  evidence:
  - reference: PMID:29096807
    reference_title: "Eosinophilic Myocarditis: Characteristics, Treatment, and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A temporary mechanical circulatory support (n = 30) was instituted in 16.8% of patients."
    explanation: >-
      Quantifies how often temporary mechanical support is required in severe
      myocarditis.
- name: Heart Transplantation
  description: >-
    Definitive therapy for irreversible myocardial failure. In giant cell myocarditis
    transplantation is the treatment of choice for most patients despite a real risk
    of the giant cell infiltrate recurring in the graft, which can respond to
    augmented immunosuppression.
  treatment_term:
    preferred_term: Heart Transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Inflammatory Dilated Cardiomyopathy
    description: >-
      Replaces the irreversibly remodelled ventricle when medical therapy has failed.
    evidence:
    - reference: PMID:9197214
      reference_title: "Idiopathic giant-cell myocarditis--natural history and treatment. Multicenter Giant Cell Myocarditis Study Group Investigators."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite the possibility of fatal disease recurrence, transplantation is the treatment of choice for most patients."
      explanation: >-
        States transplantation as definitive therapy while recording the recurrence
        risk that qualifies it.
  evidence:
  - reference: PMID:12057701
    reference_title: "Giant cell myocarditis: clinical presentation, bridge to transplantation with mechanical circulatory support, and long-term outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant cell myocarditis may recur after transplantation but may respond to augmented immunosuppression."
    explanation: >-
      Records both the recurrence risk after transplantation and its responsiveness to
      augmented immunosuppression.
- name: Interleukin-1 Blockade
  description: >-
    Anakinra, an IL-1 receptor antagonist, targets the NLRP3-caspase-1-IL-1beta arm of
    the innate amplification step. It is investigational in acute myocarditis; ARAMIS
    is the randomized trial designed to test it, and the indication should not be
    treated as established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anakinra
      term:
        id: NCIT:C38717
        label: Anakinra
  therapeutic_modality: PROTEIN_REPLACEMENT
  target_mechanisms:
  - target: Innate Immune Sensing and Cytokine Amplification
    description: >-
      Blocks IL-1 receptor signalling downstream of inflammasome activation, the
      cytokine amplification step of this node.
    evidence:
    - reference: PMID:37640625

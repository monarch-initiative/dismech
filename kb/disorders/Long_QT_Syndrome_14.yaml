      explanation: Identifies the variant and its segregation.
  - name: p.Asn97Ser
    description: >-
      CALM1 c.293A>G de novo missense variant in an individual with CPVT;
      reduces calcium binding and interacts abnormally with the RyR2
      calmodulin-binding domain.
    evidence:
    - reference: PMID:23040497

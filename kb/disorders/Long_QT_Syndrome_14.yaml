    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cardiomyocytes, it mediates Ca2+-dependent inactivation (CDI) of Cav1.2"
    explanation: The normal calmodulin function whose loss this node describes.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations that disrupt these interactions abolish CDI, resulting in excessive Ca2+ entry"
    explanation: >-
      Disrupting the calmodulin-Cav1.2 interaction abolishes inactivation and
      causes excess calcium entry.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "calmodulin mutants associated with LQTS do not affect RyR2, but rather impair LTCC inactivation, leading to a profound action potential lengthening and QT prolongation"
    explanation: >-
      Review statement that impaired L-type channel inactivation is the
      mechanism of LQTS-associated calmodulin variants; stated for the class,
      not for a named CALM1 variant.
  - reference: PMID:26969752
    reference_title: "Spectrum and Prevalence of CALM1-, CALM2-, and CALM3-Encoded Calmodulin Variants in Long QT Syndrome and Functional Characterization of a Novel Long QT Syndrome-Associated Calmodulin Missense Variant, E141G."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional characterization of 1 novel variant, E141G-CaM, revealed an 11-fold reduction in Ca(2+)-binding affinity and a functionally dominant loss of inactivation in CaV1.2, mild accentuation in NaV1.5 late current, but no effect on intracellular RyR2-mediated calcium release."
    explanation: >-
      The CALM1 E141G variant, expressed with Cav1.2 in heterologous cells,
      causes a dominant loss of Cav1.2 inactivation while leaving RyR2-mediated
      calcium release unchanged.
  downstream:
  - target: Prolonged Ventricular Action Potential Duration
    causal_link_type: DIRECT
    description: >-
      Failure to terminate L-type calcium influx during the plateau lengthens
      the ventricular action potential.
    evidence:
    - reference: PMID:32115705

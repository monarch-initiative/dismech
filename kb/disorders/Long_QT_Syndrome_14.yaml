    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The binding of calmodulin to RyR2 inhibits calcium release from the SR during diastole"
    explanation: The normal calmodulin-RyR2 regulation this node describes.
  - reference: PMID:32115705
    reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "calmodulin mutants linked to CPVT either fail to inhibit or even activate RyR2"
    explanation: CPVT-associated calmodulin variants lose RyR2 inhibition.
  - reference: PMID:23040497
    reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "p.Asn97Ser displayed an aberrant interaction with the RYR2 calmodulin-binding-domain peptide at low calcium concentrations"
    explanation: The CALM1 N97S variant interacts abnormally with the RyR2 calmodulin-binding domain.
  downstream:
  - target: Polymorphic Ventricular Tachycardia
    causal_link_type: DIRECT
    description: >-
      RyR2 calcium leak produces delayed-afterdepolarization-triggered activity,
      the substrate of catecholaminergic polymorphic ventricular tachycardia.
    evidence:
    - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1289/?report=reader
      reference_title: "Catecholaminergic Polymorphic Ventricular Tachycardia - GeneReviews&reg; - NCBI Bookshelf"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "pathogenic variants lead to RyR2 leakage and propensity to DAD-TA, but the exact mechanisms are still under investigation"
      explanation: >-
        GeneReviews CPVT chapter: CALM1, CALM2, CALM3 and TECRL pathogenic
        variants lead to RyR2 leak and delayed-afterdepolarization-triggered
        activity.

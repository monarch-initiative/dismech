genetic:
- name: CALM1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: CALM1
    term:
      id: hgnc:1442
      label: CALM1
  association: Pathogenic Variants
  notes: >-
    CALM1 carries the LQT14 designation. ClinGen classifies CALM1 as Definitive
    for long QT syndrome (assertion against MONDO:0002442) and Moderate for CPVT
    (assertion against MONDO:0017990); neither is against MONDO:0014548, so both
    are cited as evidence here rather than recorded in gene_disease_validity.
    Variant origin is recorded as de novo for the long QT presentation; the
    CPVT-like N53I variant was inherited within a family. In the 2023 registry
    CALM1 carriers had the highest cardiac event rate of the three calmodulin
    genes (88%, against 70% for CALM2 and 57% for CALM3), counted over all
    phenotypes rather than long QT alone.
  variants:
  - name: p.Asn53Ile
    description: >-
      CALM1 c.161A>T missense variant that segregated with a severe dominantly
      inherited CPVT-like arrhythmia in a large Swedish family; reduces calcium
      binding. Named as in the original report, which numbers residues without
      the initiator methionine (p.Asn54Ile with it counted).
    evidence:
    - reference: PMID:23040497
      reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing CALM1 encoding calmodulin revealed a heterozygous missense mutation"
      explanation: Identifies the variant and its segregation.
  - name: p.Asn97Ser
    description: >-
      CALM1 c.293A>G de novo missense variant in an individual with CPVT;
      reduces calcium binding and interacts abnormally with the RyR2
      calmodulin-binding domain. Named as in the original report, which numbers
      residues without the initiator methionine; with the methionine counted,
      as in the calmodulinopathy registry and in the D130G and F142L names used
      here, the same codon (c.293) is p.Asn98Ser (N98S), the registry's
      recurrent variant with long QT, CPVT, idiopathic ventricular fibrillation
      and sudden unexplained death phenotypes (counted across all three genes).
    evidence:
    - reference: PMID:23040497
      reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "was subsequently identified in an individual of Iraqi origin; this individual was diagnosed with CPVT from a screening of 61 arrhythmia samples with no identified RYR2 mutations."
      explanation: Identifies the de novo variant and the CPVT diagnosis.
  - name: p.Asp130Gly
    description: >-
      CALM1 missense variant (D130G) at a calcium-chelating aspartate of the
      fourth EF-hand, de novo in the founding LQT14 proband and found in a
      second infant with recurrent cardiac arrest from age 1 month. The same
      substitution causes childhood LQTS from CALM2 and CALM3, and the registry
      found it only with the long QT phenotype.
    evidence:
    - reference: PMID:23388215
      reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In proband 1, a missense mutation in CALM1 (chr 14q31) predicted replacement of a highly conserved aspartic acid residue at position 130 (first methionine residue assigned position 1) with glycine (D130G)."
      explanation: Identifies the de novo CALM1 D130G variant in proband 1.
    - reference: PMID:31170290
      reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of note, while p.Asp130Gly and p.Phe142Leu were always associated with the LQTS phenotype, the p.Asn98Ser had phenotypic variability, including LQTS, CPVT, IVF, and SUD."
      explanation: Pooled CALM1-3 registry; D130G and F142L are recurrent long-QT-only variants.
  - name: p.Phe142Leu
    description: >-
      CALM1 missense variant (F142L) in the fourth EF-hand, found in an adopted
      boy with non-sustained ventricular tachycardia, T-wave alternans, QTc over
      600 ms and ventricular fibrillation arrest. In his iPSC-derived
      cardiomyocytes it severely impairs calcium-dependent inactivation of the
      L-type current and prolongs repolarization without affecting IKs; the
      registry found F142L only with the long QT phenotype.
    evidence:
    - reference: PMID:23388215
      reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also discovered a novel CALM1 missense mutation in an adopted 14 year-old Caucasian male from Italy (Case 4) with recurrent episodes of non-sustained ventricular tachycardia, T-wave alternans, markedly prolonged QTc interval and cardiac arrest due to ventricular fibrillation."
      explanation: Identifies the CALM1 F142L carrier and his phenotype.
    - reference: PMID:28158429
      reference_title: Elucidating arrhythmogenic mechanisms of long-QT syndrome CALM1-F142L mutation in patient-specific induced pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The mutation failed to affect IKs and INaL and changed If only marginally."
      explanation: >-
        In patient-derived cardiomyocytes F142L leaves IKs and the late sodium
        current unchanged, isolating the L-type calcium current defect.
  - name: p.Glu141Gly
    description: >-
      CALM1 c.422A>G missense variant (E141G), de novo in a boy with syncope at
      3 years, cardiac arrest at 4 years, QTc 610 ms and speech and motor delay,
      found by exome sequencing of genetically elusive long QT syndrome. It
      lowers calcium-binding affinity about 11-fold and causes a dominant loss of
      Cav1.2 inactivation without affecting RyR2-mediated calcium release.
    evidence:
    - reference: PMID:26969752
      reference_title: "Spectrum and Prevalence of CALM1-, CALM2-, and CALM3-Encoded Calmodulin Variants in Long QT Syndrome and Functional Characterization of a Novel Long QT Syndrome-Associated Calmodulin Missense Variant, E141G."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "WES revealed 6 CaM missense variants, p.D96V (c.287 A>T, CALM2), p.D130G (c.389 A>G, CALM2), p.D130V (c.389 A>T, CALM2), p.E141G (c.422 A>G, CALM1), and two cases with p.F142L (c.426 C>G, CALM1), in a total of 6 of 39 cases (15.4%; Table 2, Figure 1)."
      explanation: Places E141G in CALM1 and reports two further CALM1 F142L carriers in the same cohort.
    - reference: PMID:26969752
      reference_title: "Spectrum and Prevalence of CALM1-, CALM2-, and CALM3-Encoded Calmodulin Variants in Long QT Syndrome and Functional Characterization of a Novel Long QT Syndrome-Associated Calmodulin Missense Variant, E141G."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.E141G was not identified in either parent confirming a de novo occurrence in the child."
      explanation: The E141G variant arose de novo.
  evidence:
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, cardiac events decreased from CALM1 [46/52, 88% (95% CI 77%–96%)], to CALM2 [37/53, 70% (95% CI 56%–82%)], to CALM3 [20/35, 57% (95% CI 39%–74%)] (P = .004)."
    explanation: >-
      Per-gene registry figure: 46 of 52 CALM1 carriers (88%, all phenotypes)
      had a cardiac event, the highest rate of the three calmodulin genes.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This pattern was observed for any event as well as for MAE [34/52, 65% (95% CI 51%–78%); 30/53, 57% (95% CI 42%–70%); 13/35, 37% (95% CI 21%–55%), respectively, P = .03]."
    explanation: >-
      Per-gene registry figure: 34 of 52 CALM1 carriers (65%) had a major
      arrhythmic event (aborted arrest, sudden death or appropriate ICD shock).
  - reference: CGGV:assertion_4a150cd9-e16b-4992-8cc7-5ccec44b4d6b-2018-09-25T160000.000Z
    reference_title: "CALM1 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM1 | HGNC:1442 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      ClinGen classifies the CALM1-long QT syndrome relationship as definitive
      with autosomal dominant inheritance, against the broader long QT syndrome
      term.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT

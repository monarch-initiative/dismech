treatments:
- name: Beta-Blocker Therapy
  description: >-
    Anti-adrenergic first-line therapy in paediatric LQTS. The cited registry
    pools calmodulinopathies with other high-risk genotypes and reports no
    calmodulin-specific treatment outcome.
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

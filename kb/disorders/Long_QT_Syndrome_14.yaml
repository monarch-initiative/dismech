      label: calcium ion binding
    modifier: DECREASED
  evidence:
  - reference: PMID:23040497
    reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both CALM1 substitutions demonstrated compromised calcium binding"
    explanation: The two index CALM1 variants (N53I, N97S) reduce calmodulin calcium binding.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "It is encoded by three independent genes (CALM1–3), which produce identical proteins"
    explanation: >-
      Why a CALM1 variant acts on the same protein as CALM2 and CALM3 variants,
      and so why shared calmodulin mechanism evidence applies here.
  - reference: CGGV:assertion_1ca1d8df-10fa-48ef-aea4-fb4dc6564dd0-2021-06-17T160000.000Z
    reference_title: "CALM1 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the de novo variant p.Asp130Gly has been shown in all 3 CALM genes to provoke LQTS in children"
    explanation: >-
      The same de novo calmodulin substitution causes childhood LQTS from CALM1
      as from CALM2 or CALM3, showing the functional equivalence of the three
      genes.
  downstream:
  - target: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
    causal_link_type: DIRECT
    description: >-
      Long-QT-associated calmodulin variants fail to drive calcium-dependent
      inactivation of Cav1.2.
    evidence:
    - reference: PMID:32115705
      reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "calmodulin mutants associated with LQTS do not affect RyR2, but rather impair LTCC inactivation, leading to a profound action potential lengthening and QT prolongation"
      explanation: >-
        Review statement for LQTS-associated calmodulin variants as a class; no
        CALM1 variant is named.
  - target: Ryanodine Receptor 2 Dysregulation
    causal_link_type: DIRECT
    description: >-
      CPVT-associated calmodulin variants lose normal inhibition of RyR2, and
      the CALM1 N97S variant binds the RyR2 calmodulin-binding domain
      abnormally.
    evidence:
    - reference: PMID:23040497
      reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "p.Asn97Ser displayed an aberrant interaction with the RYR2 calmodulin-binding-domain peptide at low calcium concentrations"
      explanation: A CALM1 variant interacts abnormally with the RyR2 calmodulin-binding domain.
- name: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Calmodulin pre-associates with the IQ motif of the Cav1.2 pore-forming
    alpha-1C subunit and, on binding calcium, inactivates the channel. A
    long-QT-associated calmodulin variant leaves the channel conducting for
    longer, so calcium influx during the action potential plateau is
    excessive.
  genes:

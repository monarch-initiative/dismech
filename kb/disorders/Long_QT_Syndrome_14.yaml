    snippet: "CALM1 and CALM2 were first associated with LQTS by exome sequencing of 2 unrelated infants with QT prolongation where de novo variants were identified."
    explanation: The founding CALM1-LQTS observation was a de novo variant in an infant.
  - reference: CGGV:assertion_1ca1d8df-10fa-48ef-aea4-fb4dc6564dd0-2021-06-17T160000.000Z
    reference_title: "CALM1 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM1 | HGNC:1442 | catecholaminergic polymorphic ventricular tachycardia | MONDO:0017990 | AD | Moderate"
    explanation: ClinGen also classifies CALM1 for CPVT, the overlap phenotype.
  - reference: PMID:30384889
    reference_title: Genetic Basis of Severe Childhood-Onset Cardiomyopathies.

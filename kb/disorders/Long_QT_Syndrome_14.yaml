inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ClinGen curated CALM1 for long QT syndrome under an autosomal dominant mode
    of inheritance; a single heterozygous variant is sufficient. In the
    CPVT-like presentation a CALM1 missense variant segregated through a large
    family.
  evidence:
  - reference: CGGV:assertion_4a150cd9-e16b-4992-8cc7-5ccec44b4d6b-2018-09-25T160000.000Z
    reference_title: "CALM1 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM1 | HGNC:1442 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      The ClinGen validity row records AD as the mode of inheritance under which
      the CALM1-long QT syndrome relationship was curated.
  - reference: PMID:23040497
    reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing CALM1 encoding calmodulin revealed a heterozygous missense mutation"
    explanation: >-
      A single heterozygous CALM1 variant segregated with a dominantly inherited
      arrhythmia phenotype in a large family.
- name: Sporadic (de novo)
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Long QT presentations of the calmodulin genes are typically sporadic: the
    variant arises de novo, and no other family member is affected. Both
    founding CALM1 probands carried a de novo variant. In the pooled CALM1-3
    registry the culprit variant was de novo in 93% of genetically screened
    CALM-LQTS families; in the remaining two it was inherited from a parent
    with germline mosaicism. The 2023 registry update reports a falling de novo
    proportion (82% of pooled index cases) as milder familial cases are found.
  evidence:
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We discovered 3 heterozygous de novo mutations in either CALM1 or CALM2, 2 of the 3 human genes encoding calmodulin, in the 2 probands and in 2 additional subjects with recurrent cardiac arrest."
    explanation: >-
      Parent-child trio sequencing found the CALM1 D130G variant de novo in a
      proband with recurrent cardiac arrest and long QT.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 27/29 (93%) CALM-LQTS and in 7/9 CALM-CPVT (78%) patients whose family members were genetically screened, the culprit variant was de novo. In the remaining two CALM-LQTS cases and in one IVF case, germline mosaicism was present in one of the parents."
    explanation: >-
      Pooled CALM1-3 registry figure: de novo origin in most CALM-LQTS
      families, with parental germline mosaicism in the rest.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cascade parental screening, performed in 78 of the 97 index cases, showed that in 64 (82%), the culprit variant had not been inherited but was de novo"
    explanation: >-
      Pooled CALM1-3 update: most index cases remain de novo, a lower
      proportion than in the first registry report.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases identified, no other family members were found to be phenotype-positive and were thus concordant with de novo variants"
    explanation: >-
      The reappraisal's account of the calmodulin-gene LQTS cases, CALM1
      included: affected individuals are sporadic, consistent with de novo
      variants.
pathophysiology:
- name: CALM1 Heterozygous Missense Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in CALM1, usually de novo in the long QT
    presentation, alters a calmodulin calcium-binding EF-hand and reduces its
    calcium binding. Because CALM1, CALM2 and CALM3 encode an identical protein,
    the variant protein is one of six calmodulin alleles' products, yet it acts
    dominantly.
  genes:
  - preferred_term: CALM1
    term:
      id: hgnc:1442
      label: CALM1
  genetic_context:
    gene:
      preferred_term: CALM1
      term:
        id: hgnc:1442
        label: CALM1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      De novo in the long QT presentations; the CPVT-like N53I variant was
      inherited and segregated in a family.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:
  - preferred_term: calcium ion binding
    term:
      id: GO:0005509
      label: calcium ion binding
    modifier: DECREASED
  evidence:
  - reference: PMID:23040497
    reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both CALM1 substitutions demonstrated compromised calcium binding"
    explanation: The two index CALM1 variants (N53I, N97S) reduce calmodulin calcium binding.
  - reference: PMID:41294816
    reference_title: Calmodulin D133H Disrupts Ca(v)1.2 and K(v)7.1 Regulation to Prolong Cardiac Action Potentials in Long QT Syndrome.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "It is encoded by three independent genes (CALM1–3), which produce identical proteins"
    explanation: >-
      Why a CALM1 variant acts on the same protein as CALM2 and CALM3 variants,
      and so why shared calmodulin mechanism evidence applies here.
  - reference: CGGV:assertion_1ca1d8df-10fa-48ef-aea4-fb4dc6564dd0-2021-06-17T160000.000Z
    reference_title: "CALM1 / catecholaminergic polymorphic ventricular tachycardia (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the de novo variant p.Asp130Gly has been shown in all 3 CALM genes to provoke LQTS in children"
    explanation: >-
      The same de novo calmodulin substitution causes childhood LQTS from CALM1
      as from CALM2 or CALM3, showing the functional equivalence of the three
      genes.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The data revealed that all three mutations have reduced Ca2+ affinity in the C-domain (5–53 fold)"
    explanation: >-
      Recombinant CALM1 D130G and F142L proteins (with CALM2 D96V) bind calcium
      less avidly at the C-terminal lobe.
  downstream:
  - target: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
    causal_link_type: DIRECT
    description: >-
      Long-QT-associated calmodulin variants fail to drive calcium-dependent
      inactivation of Cav1.2. Shown for CALM1 F142L in the patient's own
      iPSC-derived cardiomyocytes, where the mutant is one of six calmodulin
      alleles, and for CALM1 D130G and F142L in ventricular myocytes.
    evidence:
    - reference: PMID:28158429
      reference_title: Elucidating arrhythmogenic mechanisms of long-QT syndrome CALM1-F142L mutation in patient-specific induced pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This was associated with severe impairment of Ca2+-dependent inactivation (CDI) of ICaL, resulting in augmented inward current during the plateau phase."
      explanation: >-
        CALM1 F142L, at its native allelic ratio in patient-derived
        cardiomyocytes, severely impairs calcium-dependent inactivation of the
        L-type current.
    - reference: PMID:24816216
      reference_title: Calmodulin mutations associated with long QT syndrome prevent inactivation of cardiac L-type Ca(2+) currents and promote proarrhythmic behavior in ventricular myocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Similarly, coexpression of channels with CaMD130G or CaMF142L also sharply diminished CDI"
      explanation: >-
        The two LQT14 calmodulin substitutions suppress calcium-dependent
        inactivation of Cav1.2 channels.
    - reference: PMID:32115705
      reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "calmodulin mutants associated with LQTS do not affect RyR2, but rather impair LTCC inactivation, leading to a profound action potential lengthening and QT prolongation"
      explanation: >-
        Review statement for LQTS-associated calmodulin variants as a class; no
        CALM1 variant is named.
  - target: Ryanodine Receptor 2 Dysregulation
    causal_link_type: DIRECT
    description: >-
      CPVT-associated calmodulin variants lose normal inhibition of RyR2, and
      the CALM1 N97S variant binds the RyR2 calmodulin-binding domain
      abnormally.
    evidence:
    - reference: PMID:23040497
      reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "p.Asn97Ser displayed an aberrant interaction with the RYR2 calmodulin-binding-domain peptide at low calcium concentrations"
      explanation: A CALM1 variant interacts abnormally with the RyR2 calmodulin-binding domain.
- name: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
  conforms_to: "cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling"
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Calmodulin pre-associates with the IQ motif of the Cav1.2 pore-forming
    alpha-1C subunit and, on binding calcium, inactivates the channel. A
    long-QT-associated calmodulin variant leaves the channel conducting for
    longer, so calcium influx during the action potential plateau is
    excessive.

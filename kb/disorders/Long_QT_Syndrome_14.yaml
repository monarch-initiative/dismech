name: Long QT Syndrome 14
creation_date: '2026-10-14T16:47:58Z'
description: >-
  Long QT syndrome 14 (LQT14) is the numbered long QT syndrome designation for
  CALM1, one of three genes (CALM1, CALM2, CALM3) that encode the identical
  calcium-sensing protein calmodulin. It is one of the calmodulinopathies:
  heterozygous missense variants, in long QT presentations usually de novo, act
  dominantly although five of the six calmodulin alleles are normal. Calmodulin
  normally drives calcium-dependent inactivation of the Cav1.2 L-type calcium
  channel; long-QT-associated calmodulin variants impair that inactivation,
  prolonging calcium entry, the ventricular action potential and the QT
  interval. ClinGen's long QT expert panel classes CALM1 as definitive for long
  QT syndrome with atypical features: presentation in infancy or early
  childhood, marked bradycardia or atrioventricular block, and severe QT
  prolongation. CALM1 variants also cause a catecholaminergic polymorphic
  ventricular tachycardia (CPVT) phenotype, through dysregulation of the
  ryanodine receptor RyR2, and the calmodulin genes have been linked to
  idiopathic ventricular fibrillation and sudden cardiac death.
category: Genetic
disease_term:
  preferred_term: long QT syndrome 14
  term:
    id: MONDO:0014548
    label: long QT syndrome 14
synonyms:
- LQT14
- LQTS14
- CALM1-related long QT syndrome
- CALM1 calmodulinopathy
parents:
- Familial Long QT Syndrome
- Channelopathy
notes: >-
  Scope. This is a gene-specific child of the familial long QT syndrome entry
  (Long_QT_Syndrome, has_subtypes Type 14). Its sibling Long_QT_Syndrome_15
  covers CALM2 (LQT15); CALM3-related long QT syndrome has no numbered MONDO
  subtype and stays with the familial long QT syndrome entry. The three
  calmodulin genes encode an identical protein, so the calcium-dependent
  inactivation and RyR2 mechanisms here are shared with LQT15, and several
  mechanism statements are cited from work on a CALM2 variant or from reviews of
  calmodulin variants generally; those items are marked INDIRECT or
  BACKGROUND. The CALM1-specific evidence is the CPVT-like family and the de
  novo case of Nyegaard et al. 2012 (PMID:23040497), the ClinGen CALM1 records,
  and the Adler et al. 2020 reappraisal.

  Why gene_disease_validity is not filled. The two cached ClinGen assertions for
  CALM1 are made against MONDO:0002442 long QT syndrome (Definitive, AD) and
  MONDO:0017990 catecholaminergic polymorphic ventricular tachycardia (Moderate,
  AD), not against MONDO:0014548, so under the rule that a copied tier must be
  for the entry's own disease term both are cited as evidence on the genetic
  record rather than recorded in gene_disease_validity.

  Not curated. Neurodevelopmental features (developmental delay, seizures)
  reported in some calmodulinopathy patients are not recorded, because no
  cached source states them for calmodulin variants. Atrioventricular block and
  bradycardia are recorded without an upstream causal edge: the cited sources
  report them with severe QT prolongation but do not state the mechanism. No
  frequencies are given; the cached sources report no per-phenotype
  proportions for CALM1 carriers.

treatments:
- name: Beta-Blocker Therapy
  description: >-
    Anti-adrenergic first-line therapy; cardiac events in calmodulinopathy are
    mostly adrenergically triggered. Beta-blockade alone rarely suffices. In
    the CALM1 D130G founding proband propranolol up to 10 mg/kg/day did not
    suppress ventricular fibrillation, and in the pooled CALM1-3 registry 56% of
    treated patients, all on beta-blockers alone or in combination, had a
    breakthrough event. The Spanish paediatric registry pools calmodulinopathies
    with other high-risk genotypes.
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These data support the current genotype and QTc-guided management strategy, with beta-blockers as the cornerstone therapy and selective use of left cardiac sympathetic denervation and ICDs in high-risk profiles."
    explanation: >-
      Paediatric LQTS registry in which calmodulinopathies are among the
      high-risk genotypes; the management conclusion is not calmodulin-specific.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with β-adrenergic antagonists was of some value albeit not sufficient to prevent all arrhythmic events."
    explanation: >-
      Partial benefit across the four founding carriers, three of them CALM1;
      the insufficiency is recorded in the items below.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Propranolol dosage was progressively increased to 10 mg/kg/day without arrhythmia suppression."
    explanation: Beta-blockade failed to suppress ventricular fibrillation in the CALM1 D130G proband.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Over a median 5-year follow-up on therapy, at least one breakthrough event occurred in 25 (20 CALM-LQTS, 5 CALM-CPVT) of these 45 patients (56%), including eight SCD (seven in CALM-LQTS.)"
    explanation: >-
      Pooled CALM1-3 registry: breakthrough events in over half of patients
      treated with beta-blockers alone or combined with other therapy.
- name: Left Cardiac Sympathetic Denervation
  description: >-
    Surgical anti-adrenergic escalation, used mainly in high-risk paediatric LQTS
    patients, a group that includes calmodulinopathies. In calmodulinopathy it
    has not prevented recurrence: QTc stayed prolonged after LCSD in the CALM1
    D130G founding proband, and arrhythmias recurred in all three pooled-registry
    CALM-LQTS patients followed after denervation. The 2023 registry update
    nonetheless proposes full-dose triple therapy (beta-blocker, sodium channel
    blocker and LCSD) for symptomatic patients, noting that none of its sudden
    deaths had received it.
  treatment_term:
    preferred_term: left cardiac sympathetic denervation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Left cardiac sympathetic denervation was performed in 33 (8.9%), mainly high-risk patients, and was associated with >80% arrhythmia-free survival without major complications."
    explanation: Outcome in mainly high-risk paediatric LQTS patients; not reported separately for calmodulinopathies.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Left cardiac sympathetic denervation (LCSD) was performed at age 12 months, but QTc remained prolonged (550–630 ms) and episodes of T-wave alternans continued to occur."
    explanation: LCSD did not normalize repolarization in the CALM1 D130G proband.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "arrhythmias recurred in all three CALM-LQTS patients undergoing denervation surgery and with an adequate follow-up; however, they are all still alive"
    explanation: Pooled CALM1-3 registry; recurrence after denervation in every followed CALM-LQTS patient.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we consider it reasonable—despite the lack of clear evidence—to recommend the full-dose triple therapy for symptomatic patients with a predominantly cardiac calmodulinopathy"
    explanation: >-
      Pooled CALM1-3 registry authors' recommendation, made on the observation
      that no sudden death occurred on full triple therapy; not trial evidence.
- name: Implantable Cardioverter-Defibrillator Placement
  description: >-
    Device therapy for high-risk patients; in the cited paediatric registry a
    third of implanted children received appropriate therapies and a quarter
    had complications.
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  therapeutic_modality: DEVICE
  evidence:
  - reference: PMID:42466893
    reference_title: "Paediatric long QT syndrome: clinical outcomes and therapy in the Spanish National Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "ICDs were implanted in 33 children (8.9%); 10 (30%) received appropriate therapies, and 8 (24%) experienced complications."
    explanation: Benefit and complication burden of ICDs in paediatric LQTS, not calmodulin-specific.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ICDs are probably necessary in most patients but, in the very young ones, they represent a double-edged sword and the appropriate time for implantation should be carefully balanced considering symptoms and age"
    explanation: >-
      Pooled CALM1-3 registry conclusion; one neonate in the registry died of
      device-related complications.
- name: Mexiletine
  description: >-
    Sodium channel blocker added to beta-blockade. A loading dose did not
    shorten the QT interval in the CALM1 D130G founding proband. In the pooled
    CALM1-3 registry mexiletine suppressed arrhythmias in 4 of 11 assessable
    CALM-LQTS patients but rarely shortened QTc, unlike its effect in LQT3.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mexiletine
      term:
        id: CHEBI:6916
        label: mexiletine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A loading dose of mexiletine did not shorten the QT interval."
    explanation: No QT shortening with mexiletine in the CALM1 D130G proband.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The effect of mexiletine could be assessed in 11 CALM-LQTS patients, and among them arrhythmia suppression was reported in 4 (36%)."
    explanation: Pooled CALM1-3 registry; arrhythmia suppression in a minority of patients.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, at variance with LQT3,25 only in one of the six CALM-LQTS cases acute oral mexiletine significantly shortened QTc."
    explanation: Pooled CALM1-3 registry; mexiletine seldom shortens QTc in CALM-LQTS.
  - reference: PMID:37528649
    reference_title: "Clinical presentation of calmodulin mutations: the International Calmodulinopathy Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment was interrupted due to intolerance or inefficacy (no change in QT intervals and/or recurrences of arrhythmic episodes) in 10; among the remaining 16 on continued therapy, QTc shortened in 6."
    explanation: >-
      Pooled CALM1-3 update on sodium channel blockers (mostly mexiletine or
      flecainide) in 26 CALM-LQTS patients; QTc shortened in 6 of 16 who
      continued.
- name: Verapamil
  description: >-
    L-type calcium channel blocker, a mechanism-directed choice because
    impaired calcium-dependent inactivation of Cav1.2 underlies CALM-LQTS. It
    reversed repolarization abnormalities in CALM1 F142L patient-derived
    cardiomyocytes and reduced T-wave alternans in the CALM1 D130G founding
    proband, but in the pooled registry it was stopped in two of three patients
    (one ventricular fibrillation recurrence, one intolerance), and the
    registry judged the clinical data too limited for a conclusion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Calcium-Dependent Inactivation of the L-Type Calcium Current
    description: >-
      Blocking the L-type calcium current offsets the excess plateau calcium
      entry left by failed calcium-dependent inactivation.
    evidence:
    - reference: PMID:28158429
      reference_title: Elucidating arrhythmogenic mechanisms of long-QT syndrome CALM1-F142L mutation in patient-specific induced pluripotent stem cell-derived cardiomyocytes.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutation-induced repolarization abnormalities were reversed by verapamil."
      explanation: Verapamil reverses the CALM1 F142L repolarization defect in patient-derived cardiomyocytes.
  evidence:
  - reference: PMID:28158429
    reference_title: Elucidating arrhythmogenic mechanisms of long-QT syndrome CALM1-F142L mutation in patient-specific induced pluripotent stem cell-derived cardiomyocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutation-induced repolarization abnormalities were reversed by verapamil."
    explanation: Cellular rationale in CALM1 F142L patient-derived cardiomyocytes.
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Verapamil reduced the frequency of T-wave alternans, but persistent cardiac electrical instability prompted right cardiac sympathetic denervation (RCSD)."
    explanation: Partial effect in the CALM1 D130G proband; instability persisted.
  - reference: PMID:31170290
    reference_title: "Calmodulin mutations and life-threatening cardiac arrhythmias: insights from the International Calmodulinopathy Registry."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Verapamil was used in three patients but was discontinued in two because of VF recurrences (n = 1) or intolerance (n = 1)."
    explanation: Pooled CALM1-3 registry; limited and largely unfavourable clinical experience.
- name: Flecainide
  description: >-
    Sodium channel blocker. In the CALM1 D130G founding proband it replaced
    verapamil and was followed by a single ventricular fibrillation episode in
    the next year, after 16 episodes in the first two years of life on other
    therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: flecainide
      term:
        id: CHEBI:75984
        label: flecainide
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:23388215
    reference_title: Calmodulin mutations associated with recurrent cardiac arrest in infants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Verapamil was replaced with flecainide and in the following year she had only one VF episode triggered by strong emotional stress."
    explanation: >-
      Single-patient observation in the CALM1 D130G proband, on top of
      beta-blockade, ICD and bilateral denervation.
diagnosis:
- name: Genetic testing of the calmodulin genes
  description: >-
    Genetic testing for CALM1, CALM2 and CALM3 is recommended in LQTS with
    atypical features (infant or early-childhood onset, bradycardia or
    atrioventricular block, severe QT prolongation). These genes were the least
    often included on commercial LQTS panels at the time of the reappraisal.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing for genes (CALM1, CALM2, CALM3, TRDN) in LQTS with atypical features should be considered in patients with clinical observations concordant with the specific phenotypic expression demonstrated in reported cases."
    explanation: Recommendation to test the calmodulin genes in atypical LQTS.
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "were least likely to be included and were found in only 39% to 75% of panels"
    explanation: The calmodulin genes were often missing from commercial LQTS panels.
  - reference: PMID:26969752
    reference_title: "Spectrum and Prevalence of CALM1-, CALM2-, and CALM3-Encoded Calmodulin Variants in Long QT Syndrome and Functional Characterization of a Novel Long QT Syndrome-Associated Calmodulin Missense Variant, E141G."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of CALM1-3 should be pursued for individuals with LQTS, especially those with early childhood cardiac arrest, extreme QT prolongation, and a negative family history."
    explanation: >-
      Recommendation from an exome study of genetically elusive long QT
      syndrome, in which calmodulin variants (CALM1 and CALM2 pooled) were
      over-represented.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ClinGen curated CALM1 for long QT syndrome under an autosomal dominant mode
    of inheritance; a single heterozygous variant is sufficient. In the
    CPVT-like presentation a CALM1 missense variant segregated through a large
    family.
  evidence:
  - reference: CGGV:assertion_4a150cd9-e16b-4992-8cc7-5ccec44b4d6b-2018-09-25T160000.000Z
    reference_title: "CALM1 / long QT syndrome (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CALM1 | HGNC:1442 | long QT syndrome | MONDO:0002442 | AD | Definitive"
    explanation: >-
      The ClinGen validity row records AD as the mode of inheritance under which
      the CALM1-long QT syndrome relationship was curated.
  - reference: PMID:23040497
    reference_title: Mutations in calmodulin cause ventricular tachycardia and sudden cardiac death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing CALM1 encoding calmodulin revealed a heterozygous missense mutation"
    explanation: >-
      A single heterozygous CALM1 variant segregated with a dominantly inherited
      arrhythmia phenotype in a large family.
- name: Sporadic (de novo)
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Long QT presentations of the calmodulin genes are typically sporadic: the
    variant arises de novo, and no other family member is affected.
  evidence:
  - reference: DOI:10.1161/CIRCULATIONAHA.119.043132
    reference_title: "An International, Multicentered, Evidence-Based Reappraisal of Genes Reported to Cause Congenital Long QT Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases identified, no other family members were found to be phenotype-positive and were thus concordant with de novo variants"
    explanation: >-
      The reappraisal's account of the calmodulin-gene LQTS cases, CALM1
      included: affected individuals are sporadic, consistent with de novo
      variants.
pathophysiology:
- name: CALM1 Heterozygous Missense Variant
  conforms_to: "cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in CALM1, usually de novo in the long QT
    presentation, alters a calmodulin calcium-binding EF-hand and reduces its
    calcium binding. Because CALM1, CALM2 and CALM3 encode an identical protein,
    the variant protein is one of six calmodulin alleles' products, yet it acts
    dominantly.
  genes:
  - preferred_term: CALM1
    term:
      id: hgnc:1442
      label: CALM1
  genetic_context:
    gene:
      preferred_term: CALM1
      term:
        id: hgnc:1442
        label: CALM1
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    description: >-
      De novo in the long QT presentations; the CPVT-like N53I variant was
      inherited and segregated in a family.
  cell_types:
  - preferred_term: cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  molecular_functions:

  notes: >-
    CALM1 carries the LQT14 designation. ClinGen classifies CALM1 as Definitive
    for long QT syndrome (assertion against MONDO:0002442) and Moderate for CPVT
    (assertion against MONDO:0017990); neither is against MONDO:0014548, so both
    are cited as evidence here rather than recorded in gene_disease_validity.
    Variant origin is recorded as de novo for the long QT presentation; the
    CPVT-like N53I variant was inherited within a family.
  variants:

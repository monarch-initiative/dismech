notes: >-
  Scope. This is a gene-specific child of the familial long QT syndrome entry
  (Long_QT_Syndrome, has_subtypes Type 14). Its sibling Long_QT_Syndrome_15
  covers CALM2 (LQT15); CALM3-related long QT syndrome has no numbered MONDO
  subtype and stays with the familial long QT syndrome entry. The three
  calmodulin genes encode an identical protein, so the calcium-dependent
  inactivation and RyR2 mechanisms here are shared with LQT15, and several
  mechanism statements are cited from work on a CALM2 variant or from reviews of
  calmodulin variants generally; those items are marked INDIRECT or
  BACKGROUND. The CALM1-specific evidence is the CPVT-like family and the de
  novo case of Nyegaard et al. 2012 (PMID:23040497), the three CALM1 carriers
  (D130G twice, F142L) of the founding Crotti et al. 2013 report
  (PMID:23388215), the CALM1 F142L patient-derived iPSC cardiomyocytes
  (PMID:28158429), the de novo CALM1 E141G carrier and its functional study
  (PMID:26969752), the CALM1 D130G and F142L proteins expressed in guinea-pig
  ventricular myocytes (PMID:24816216), the CALM1 rows of the International
  Calmodulinopathy Registry (PMID:37528649), the ClinGen CALM1 records, and
  the Adler et al. 2020 reappraisal. Registry figures that are not broken
  down by gene (PMID:31170290, and most of PMID:37528649) pool CALM1, CALM2
  and CALM3 carriers and are labelled as pooled wherever they are cited.

  Why gene_disease_validity is not filled. The two cached ClinGen assertions for
  CALM1 are made against MONDO:0002442 long QT syndrome (Definitive, AD) and
  MONDO:0017990 catecholaminergic polymorphic ventricular tachycardia (Moderate,
  AD), not against MONDO:0014548, so under the rule that a copied tier must be
  for the entry's own disease term both are cited as evidence on the genetic
  record rather than recorded in gene_disease_validity.

  Neurological features. Developmental delay and seizures in the founding
  CALM1 carriers followed cardiac arrest in infancy, and the registry judged
  most post-arrest deficits post-anoxic, so they are drawn as sequelae of
  cardiac arrest. The registry also reports CALM1 carriers with autism,
  developmental delay and epilepsy unrelated to cardiac arrest; no mechanism
  is established for those, so the autism node has no upstream edge.

  Atrioventricular block. The 2:1 block is drawn from the prolonged action
  potential node through ventricular refractoriness. That edge rests on
  general long QT syndrome studies (PMID:1918714, PMID:1889452) and on the
  registry's description of the block as functional; no calmodulin study
  measured refractoriness, so the edge evidence is INDIRECT. The general
  atrioventricular block, bradycardia and late-onset peaked T wave nodes keep
  no upstream edge; the registry compares the T-wave pattern with LQT3 and
  Timothy syndrome but states no mechanism for it. The
  frequencies on T-wave alternans, 2:1 block, seizures and developmental delay
  are counts over the three CALM1 carriers tabulated in PMID:23388215 and are
  not population estimates.

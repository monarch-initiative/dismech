diagnosis:
- name: Serum magnesium measurement
  description: >-
    Low serum magnesium (about 0.44 to 0.72 mmol/L against a normal range of
    0.70 to 1.05 mmol/L) is the biochemical clue. The largest cohort
    recommends CNNM2 testing for patients with mildly lowered serum
    magnesium together with intellectual disability, transient seizures,
    obesity and speech defects. Serum magnesium can be normal in a minority
    of carriers.
  diagnosis_term:
    preferred_term: serum magnesium measurement
    term:
      id: NCIT:C61035
      label: Serum Magnesium Measurement
  evidence:
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Physicians should include CNNM2 into a genetic screen upon receiving patients with lowered serum Mg2+ concentrations"
    explanation: Low serum magnesium with the neurological features prompts CNNM2 testing.
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients suffered from hypomagnesemia (0.44-0.72 mmol/L), which could not be fully corrected by Mg2+ supplementation."
    explanation: Range of serum magnesium in the cohort.
- name: Fractional excretion of magnesium
  description: >-
    Fractional urinary magnesium excretion that is normal or raised despite
    hypomagnesemia shows that the magnesium loss is renal.
  diagnosis_term:
    preferred_term: fractional excretion of magnesium
    term:
      id: NCIT:C122119
      label: Fractional Excretion of Magnesium
  evidence:
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accompanied with an inappropriate fractional excretion of Mg2+ in the normal range despite a low serum Mg2+ level"
    explanation: Inappropriately normal fractional excretion in hypomagnesemic patients.
  - reference: PMID:38519529
    reference_title: "Hypomagnesaemia with varying degrees of extrarenal symptoms as a consequence of heterozygous CNNM2 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The hypomagnesaemia is of renal origin, as excretion of Mg2+ is expected to decrease upon low serum Mg2+, but was found to be either normal or increased"
    explanation: Renal origin established from urinary magnesium excretion across reported patients.
- name: CNNM2 molecular testing
  description: >-
    The diagnosis is confirmed by finding a pathogenic CNNM2 variant, usually

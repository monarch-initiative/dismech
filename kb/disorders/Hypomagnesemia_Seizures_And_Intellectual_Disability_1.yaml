    shows as microcephaly, wide outer cerebrospinal fluid spaces, failure of
    opercularization and reduced myelination. Monoallelic patients usually
    have a normal brain MRI but have intellectual disability and speech and
    motor impairment. In zebrafish, cnnm2a knockdown disturbs the
    midbrain-hindbrain boundary and cnnm2b knockdown causes cerebrospinal
    fluid accumulation in the cerebrum, and Cnnm2 null mice die after birth
    with exencephaly.

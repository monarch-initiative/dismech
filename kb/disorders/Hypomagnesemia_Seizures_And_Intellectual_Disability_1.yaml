animal_models:
- name: cnnm2a and cnnm2b zebrafish morphants
  species: Zebrafish
  genotype: cnnm2a or cnnm2b translation-blocking morpholino knockdown
  publication: PMID:24699222
  description: >-
    Morpholino knockdown of either zebrafish CNNM2 paralogue, with rescue by
    mouse wild-type but not mutant (p.Glu357Lys) Cnnm2 cRNA.
  modeled_mechanisms:
  - target: Impaired Neurodevelopment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      cnnm2a morphants show maldevelopment of the midbrain-hindbrain boundary
      and cnnm2b morphants accumulate cerebrospinal fluid in the cerebrum,
      resembling the wide outer cerebrospinal fluid spaces of a homozygous
      patient. High-magnesium medium does not rescue the brain phenotype.
    limitations: >-
      Transient, dose-dependent morpholino knockdown in embryos rather than a
      germline allele, in a species with two CNNM2 paralogues that have split
      the function.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "maldevelopment of the midbrain hindbrain boundary (MHB) is observed in cnnm2a morphant embryos"
      explanation: Brain developmental defect in morphants.
  - target: Systemic Magnesium Depletion
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Total body magnesium is reduced in both morphants.
    limitations: >-
      Larval zebrafish do not feed, so total body magnesium reflects
      pronephric and skin ionocyte uptake rather than human renal handling;
      serum could not be sampled.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In line with the human disease, the concentration of total body Mg was decreased in zebrafish cnnm2a and cnnm2b morphants when compared to controls."
      explanation: Reduced body magnesium in morphants.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Increased spontaneous embryonic contractions, read as motor neuron hyperexcitability.
    limitations: >-
      The contraction readout at 25 hours post-fertilization depends on spinal
      circuits, not on the brain, and no seizure or electrographic activity
      was recorded.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the frequency of spontaneous embryonic contractions was increased in cnnm2a morphants compared to controls"
      explanation: Behavioural readout taken as hyperexcitability.
- name: Cnnm2 knockout mouse (Franken 2021)
  species: Mouse
  genotype: Cnnm2 CRISPR/Cas9 frameshift alleles, heterozygous and homozygous
  publication: PMID:33859252
  description: >-
    Cnnm2-/- embryos are present at Mendelian ratios at E18 but almost all
    die around birth, with exencephaly. Adult Cnnm2+/- mice have mild
    hypomagnesaemia, raised serum calcium and increased faecal magnesium and
    calcium excretion.
  modeled_mechanisms:
  - target: Systemic Magnesium Depletion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Heterozygous and null mice have low serum magnesium.
    limitations: >-
      The hypomagnesaemia of heterozygous mice is mild, and the mice also show
      raised serum calcium, which is not a consistent patient finding.
    evidence:
    - reference: PMID:33859252
      reference_title: "Cyclin M2 (CNNM2) knockout mice show mild hypomagnesaemia and developmental defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult Cnnm2+/- mice showed mild hypomagnesaemia compared to Cnnm2+/+ mice and increased serum Ca2+ levels, independent of dietary Mg2+ intake."
      explanation: Hypomagnesaemia in heterozygous mice.
  - target: Reduced Intestinal Magnesium Absorption
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: Faecal magnesium excretion is increased in heterozygous mice.
    limitations: Intestinal magnesium handling has not been measured in patients, so fidelity cannot be judged.
    evidence:
    - reference: PMID:33859252
      reference_title: "Cyclin M2 (CNNM2) knockout mice show mild hypomagnesaemia and developmental defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Faecal analysis displayed increased Mg2+ and Ca2+ excretion in the Cnnm2+/- mice."
      explanation: Faecal magnesium loss in the model.
  - target: Impaired Neurodevelopment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Null mice die perinatally with brain maldevelopment; heterozygous adult
      brain morphology is normal.
    limitations: >-
      Exencephaly, a neural tube defect, has not been reported in patients,
      and perinatal lethality prevents study of postnatal brain function.
    evidence:
    - reference: PMID:33859252
      reference_title: "Cyclin M2 (CNNM2) knockout mice show mild hypomagnesaemia and developmental defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Nevertheless, only four Cnnm2-/- pups were born alive."
      explanation: Perinatal loss of null mice.
- name: Kidney-specific Cnnm2 knockout mouse (Funato 2017)
  species: Mouse
  genotype: Systemic Cnnm2 heterozygous and kidney-specific Cnnm2 homozygous deletion
  publication: PMID:28033128
  description: >-
    Both systemic heterozygotes and kidney-specific homozygotes are viable and
    hypomagnesemic, with lower blood pressure than wild type.
  modeled_mechanisms:
  - target: Impaired Distal Convoluted Tubule Magnesium Reabsorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Kidney-restricted loss of Cnnm2 is sufficient for hypomagnesemia.
    limitations: >-
      Tubular magnesium transport was not measured directly; the renal
      conclusion rests on serum magnesium in a kidney-specific deletion.
      Patients have not been reported with low blood pressure.
    evidence:
    - reference: PMID:28033128
      reference_title: "Renal function of cyclin M2 Mg2+ transporter maintains blood pressure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Systemic heterozygotes and the kidney-specific homozygotes for Cnnm2-deficient alleles are both viable and show hypomagnesemia, indicating the important function of CNNM2 in maintaining magnesium homeostasis in the kidney."
      explanation: Renal CNNM2 loss causes hypomagnesemia.
experimental_models:
- name: HEK293 cells expressing CNNM2 patient variants (25Mg2+ uptake)
  experimental_model_type: CELL_LINE
  description: >-
    HEK293 cells transiently transfected with wild-type or mutant CNNM2 and
    incubated with the stable isotope 25Mg2+ to measure CNNM2-dependent
    magnesium uptake, with cell surface biotinylation for plasma membrane
    expression.
  publication: PMID:24699222
  modeled_mechanisms:
  - target: Loss of CNNM2-Dependent Magnesium Transport
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Patient variants fail to increase cellular magnesium uptake.
    limitations: >-
      Overexpression in nonpolarized HEK293 cells, not distal convoluted
      tubule cells. The assay measures uptake, while other studies describe
      CNNM2 as mediating magnesium efflux, so what the readout means for
      tubular transport is unsettled.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In contrast, cells expressing mutated CNNM2 proteins did not show increased Mg(2+) uptake."
      explanation: Loss of uptake for mutant CNNM2.
discussions:
- discussion_id: homgsmr1_cnnm2_molecular_function
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Loss of CNNM2-Dependent Magnesium Transport
  prompt: >-
    Is CNNM2 a magnesium transporter, a Na+/Mg2+ exchanger that extrudes
    magnesium, or a regulator of other magnesium transport proteins?
  rationale: >-
    Patient variants consistently reduce CNNM2 activity, but the assays
    disagree on what that activity is. Overexpressed CNNM2 increases magnesium
    uptake in HEK293 cells through TRPM7, another study finds that CNNM2
    isoforms do not transport magnesium, and an efflux assay in mouse distal
    convoluted tubule cells shows reduced magnesium extrusion by a patient
    variant. Which of these underlies basolateral magnesium reabsorption
    decides how the renal step should be described.
  evidence:
  - reference: PMID:27068403
    reference_title: "Human CNNM2 is not a Mg(2+) transporter per se."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Iso1 and Iso2 are not Mg(2+) transporters per se."
    explanation: Argues that CNNM2 does not itself transport magnesium.
  - reference: PMID:35846113
    reference_title: "Novel CNNM2 Mutation Responsible for Autosomal-Dominant Hypomagnesemia With Seizure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Mg2+ efflux assay in murine DCT (mDCT) cells revealed a significant increase in intracellular Mg2+ green in CNNM2-R480L compared to that in CNNM2-WT."
    explanation: A patient variant reduces magnesium efflux in distal convoluted tubule cells.
- discussion_id: homgsmr1_obesity_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Obesity
  prompt: >-
    How does CNNM2 loss of function cause severe obesity, given that obesity
    is not a feature of other hereditary hypomagnesemias?
  rationale: >-
    Obesity is present in most monoallelic patients at a rate above that
    expected for intellectual disability, and the CNNM2 locus is associated
    with obesity in population genetics. No mechanism has been studied, so no
    pathophysiology node points at the phenotype.
  evidence:
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings rather suggest that obesity represents a primary feature of HSMR syndrome."
    explanation: Obesity is a primary feature without a known mechanism.

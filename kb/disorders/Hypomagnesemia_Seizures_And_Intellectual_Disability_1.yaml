name: Hypomagnesemia, Seizures, and Intellectual Disability 1
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  Hypomagnesemia, seizures, and intellectual disability 1 (HOMGSMR1, also
  called HSMR syndrome) is caused by loss-of-function variants in CNNM2, which
  encodes cyclin M2, a membrane protein of the basolateral membrane of the
  distal convoluted tubule that is required for renal magnesium reabsorption
  and is also expressed in the brain. Most patients carry a single CNNM2
  variant, often arising de novo, and have hypomagnesemia from renal magnesium
  wasting that supplementation does not fully correct, generalized seizures in
  childhood that often remit, mild to moderate intellectual disability with
  impaired speech and motor skills, and frequently severe obesity. Patients
  with biallelic CNNM2 variants have a more severe disease, with refractory
  seizures from the first days of life, severe intellectual disability,
  microcephaly and structural brain abnormalities. Zebrafish knockdown and
  knockout mouse models show that CNNM2 is needed for brain development
  independently of serum magnesium.
notes: >-
  The entry is anchored on MONDO:0020787 (OMIM 616418) and CNNM2 (hgnc:103).
  MONDO and OMIM keep isolated dominant renal hypomagnesemia without seizures
  or intellectual disability (renal hypomagnesemia 6, HOMG6, MONDO:0013480,
  OMIM 613882) as a separate disease, although it is allelic. That isolated
  presentation, including the two families in which CNNM2 was first
  identified (PMID:21397062) and the spironolactone-responsive p.Pro482Ala
  family (PMID:35806288), is not curated here as a phenotype stratum. Papers
  from those families are cited only for CNNM2 localization and function. The
  ClinGen Tubulopathy GCEP lumps HOMG6 with HOMGSMR1 into one entity
  (hypomagnesemia with or without seizures and intellectual disability, mode
  of inheritance semidominant) and records it against MONDO:0020787.

  A de novo heterozygous CNNM2 variant has been reported with refractory
  epilepsy and mild intellectual disability but normal serum magnesium
  (PMID:34490037), so hypomagnesemia is not obligatory in every reported
  carrier.

  The synonym HSMR syndrome is not a MONDO synonym; it is the name used by
  the largest patient cohort (PMID:33600043) and later reports.

  No GeneReviews chapter covers this disease or CNNM2 (just check-genereviews
  --online returned NO_CHAPTER against the Bookshelf index of 2026-09-10).
disease_term:
  preferred_term: hypomagnesemia, seizures, and impaired intellectual development 1
  term:
    id: MONDO:0020787
    label: hypomagnesemia, seizures, and impaired intellectual development 1
synonyms:
- "HOMGSMR1"
- "hypomagnesemia, seizures, and impaired intellectual development 1"
- "hypomagnesemia, seizures, and mental retardation"
- "HSMR syndrome"
parents:
- Hypomagnesemia, Seizures, and Intellectual Disability
has_subtypes:
- name: Monoallelic
  display_name: Monoallelic CNNM2 disease
  description: >-
    One CNNM2 variant, inherited dominantly or arising de novo. Hypomagnesemia
    with generalized seizures that usually begin in infancy or childhood and
    can be controlled with antiseizure medication, mild to moderate
    intellectual disability, speech and motor impairment, and frequent severe
    obesity. Brain MRI is usually normal.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:34604137
    reference_title: "CNNM2-Related Disorders: Phenotype and Its Severity Were Associated With the Mode of Inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fifteen type 2 patients could have ID/DD and seizures, which can be controlled with antiseizure medications (ASMs); their variations clustered in the DUF21 domain of CNNM2."
    explanation: >-
      The pooled case review defines the dominant syndromic stratum (its type
      2) and its controllable seizures.
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients suffering from recessive CNNM2 mutations especially display severe structural brain defects, whereas patients with monoallelic CNNM2 mutations usually lack structural brain abnormalities"
    explanation: Monoallelic patients usually have no structural brain abnormality.
- name: Biallelic
  display_name: Biallelic CNNM2 disease
  description: >-
    Homozygous CNNM2 variants in consanguineous families. Seizures begin in
    the first days of life and are refractory, with severe global
    developmental delay, severe intellectual disability without verbal
    speech, microcephaly, and structural brain abnormalities (wide outer
    cerebrospinal fluid spaces, failure of opercularization, reduced white
    matter myelination). The degree of hypomagnesemia is similar to the
    monoallelic form, so it does not explain the greater severity.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease manifestation in the neonatal period, the extent of seizures, the severe degree of intellectual disability, and the presence of structural brain abnormalities clearly render recessive CNNM2 disease a distinct clinical entity."
    explanation: The authors of the largest cohort treat recessive CNNM2 disease as a distinct clinical stratum.
  - reference: PMID:34604137
    reference_title: "CNNM2-Related Disorders: Phenotype and Its Severity Were Associated With the Mode of Inheritance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three type 3 patients had seizures from 1 to 6 days after birth; the seizures were refractory, and 1/3 had status epilepticus; ID/DD in these AR-inherited cases was more severe than that of AD-inherited cases; they all had abnormalities of brain magnetic resonance imaging (MRI)."
    explanation: Neonatal refractory seizures, more severe developmental impairment and abnormal MRI in all recessive cases.
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous CNNM2 p.Glu122Lys mutation in this family resulted in the manifestation of a neonatal onset and a considerably more severe cerebral involvement than in the remaining patients."
    explanation: The first recessive family was more severely affected than the heterozygous patients.
inheritance:
- name: Semidominant inheritance
  description: >-
    Heterozygous CNNM2 variants cause the disease, and biallelic variants
    cause a more severe form, so the severity depends on the number of
    affected alleles. ClinGen records the mode of inheritance as semidominant.
  inheritance_term:
    preferred_term: Semidominant inheritance
    term:
      id: HP:0032113
      label: Semidominant inheritance
  evidence:
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Together, these findings argue for distinct degrees of severity of the disease depending on the number of affected alleles."
    explanation: Severity scales with the number of mutant alleles.
  - reference: CGGV:assertion_522bb617-c817-4536-a87b-01d4302d7bf0-2024-02-15T170000.000Z
    reference_title: "CNNM2 / hypomagnesemia, seizures, and impaired intellectual development 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CNNM2 | HGNC:103 | hypomagnesemia, seizures, and impaired intellectual development 1 | MONDO:0020787 | SD | Definitive"
    explanation: ClinGen records the mode of inheritance as semidominant (SD).
- name: Autosomal dominant inheritance
  description: >-
    Most patients are heterozygous for one CNNM2 variant. Many of these
    variants arose de novo, and a few families show dominant transmission.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, three patients with moderate mental disability were shown to carry de novo heterozygous missense mutations in the CNNM2 gene."
    explanation: Heterozygous, de novo variants in three patients.
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eleven novel variants in CNNM2 were identified in nine single sporadic cases and in two families with suspected HSMR syndrome."
    explanation: Sporadic cases and two families with heterozygous variants.
- name: Autosomal recessive inheritance
  description: >-
    Homozygous CNNM2 variants have been reported in a small number of
    consanguineous families, with a more severe neurological phenotype.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For the first time, a recessive mode of inheritance of CNNM2 mutations was observed."
    explanation: Recessive inheritance in the consanguineous family F1.
  - reference: PMID:30026055
    reference_title: "CNNM2 homozygous mutations cause severe refractory hypomagnesemia, epileptic encephalopathy and brain malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the second homozygous CNNM2 mutation (c.1642G > A,p.Val548Met) in a Moroccan patient, presenting with hypomagnesemia and severe epileptic encephalopathy."
    explanation: A second recessive family.
genetic:
- name: CNNM2
  gene_term:
    preferred_term: CNNM2
    term:
      id: hgnc:103
      label: CNNM2
  relationship_type: CAUSATIVE
  features: >-
    CNNM2 (10q24.32) encodes cyclin M2 (CBS domain divalent metal cation
    transport mediator 2), a membrane protein with an extracellular N terminus,
    a DUF21 transmembrane domain and intracellular CBS-pair and cyclic
    nucleotide-binding homology domains. Reported disease variants include
    missense, nonsense, frameshift and in-frame changes and multi-exon
    deletions.
  notes: >-
    The molecular function of CNNM2 is debated: it has been described as a
    Na+/Mg2+ exchanger that extrudes magnesium, as a regulator of the
    magnesium channel TRPM7, and as a magnesium homeostatic factor that does
    not itself transport magnesium. The trigger node binds magnesium ion
    transmembrane transporter activity (GO:0015095), the molecular function
    GO assigns to CNNM2 by phylogenetic inference (IBA), and the
    downstream node is worded as a loss of CNNM2-dependent magnesium
    transport so that it does not decide between these models.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_522bb617-c817-4536-a87b-01d4302d7bf0-2024-02-15T170000.000Z
    evidence:
    - reference: CGGV:assertion_522bb617-c817-4536-a87b-01d4302d7bf0-2024-02-15T170000.000Z
      reference_title: "CNNM2 / hypomagnesemia, seizures, and impaired intellectual development 1 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CNNM2 | HGNC:103 | hypomagnesemia, seizures, and impaired intellectual development 1 | MONDO:0020787 | SD | Definitive"
      explanation: ClinGen Tubulopathy GCEP classifies CNNM2 as Definitive for this disease.
  evidence:
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we have identified new mutations in CNNM2 in five families suffering from mental retardation, seizures, and hypomagnesemia."
    explanation: CNNM2 variants in five families with the syndrome.
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonsense mutations leading to a preterminal stop of translation as well as the deletion of multiple exons of the CNNM2 gene identified in two patients clearly argue for a loss of CNNM2 function as the general underlying disease mechanism of HSMR and for functional haploinsufficiency in monoallelic cases."
    explanation: Null alleles in affected heterozygotes indicate loss of function and haploinsufficiency.
  - reference: CGGV:assertion_522bb617-c817-4536-a87b-01d4302d7bf0-2024-02-15T170000.000Z
    reference_title: "CNNM2 / hypomagnesemia, seizures, and impaired intellectual development 1 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is known to be loss of function."
    explanation: ClinGen summary of the disease mechanism.
  variants:
  - name: CNNM2 c.364G>A (p.Glu122Lys)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous in two siblings of a consanguineous family (F1) with neonatal
      refractory seizures, microcephaly, severe intellectual disability and
      brain malformations. Parents heterozygous and unaffected. The mutant
      protein retains a small residual activity and shows reduced plasma
      membrane expression. The cited source does not give the transcript
      accession.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Conventional Sanger sequencing of the complete coding region of the CNNM2 gene revealed a homozygous mutation, c.364G>A, leading to a non-conservative amino acid substitution of glutamate to lysine at position 122 of the CNNM2 protein"
      explanation: Identification of the homozygous variant in family F1.
  - name: CNNM2 c.1642G>A (p.Val548Met)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous in a Moroccan patient with hypomagnesemia and severe
      epileptic encephalopathy, the second recessive family reported.
    evidence:
    - reference: PMID:30026055
      reference_title: "CNNM2 homozygous mutations cause severe refractory hypomagnesemia, epileptic encephalopathy and brain malformations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report the second homozygous CNNM2 mutation (c.1642G > A,p.Val548Met) in a Moroccan patient, presenting with hypomagnesemia and severe epileptic encephalopathy."
      explanation: Identification of the homozygous variant.
  - name: CNNM2 c.1069G>A (p.Glu357Lys)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Recurrent de novo heterozygous variant in two unrelated patients (F2.1,
      F4.1) with hypomagnesemia, seizures and intellectual disability, in the
      second membrane-spanning segment. The mutant fails to increase cellular
      magnesium uptake.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interestingly, patients F2.1 and F4.1 exhibited the same mutation, p.Glu357Lys (c.1069G>A), affecting a highly conserved amino acid residue in the 2nd membrane-spanning domain of the CNNM2 protein."
      explanation: Recurrent de novo variant.
  - name: CNNM2 c.806C>G (p.Ser269Trp)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo heterozygous variant in patient F3.1, in the first transmembrane
      segment, with a trend to reduced plasma membrane expression and loss of
      magnesium uptake.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Also the p.Ser269Trp (c.806C>G) mutation detected in patient F3.1 affects a highly conserved residue located in the 1st transmembrane domain."
      explanation: Identification of the de novo variant.
  - name: CNNM2 c.566A>G (p.Tyr189Cys)
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      De novo heterozygous variant in a 4-month-old Chinese girl with
      seizures, hypomagnesemia, liver function damage, atrial septal defect
      and sinus arrhythmia. Classified pathogenic under ACMG criteria;
      molecular dynamics predicts loss of local hydrogen bonding.
    evidence:
    - reference: PMID:35170241
      reference_title: "Rare hypomagnesemia, seizures, and mental retardation in a 4-month-old patient caused by novel CNNM2 mutation Tyr189Cys: Genetic analysis and review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel mutation in CNNM2 (c.566A>G/p.Tyr189Cys) was identified by genetic detection."
      explanation: Identification of the variant.
  - name: CNNM2 c.1448delT (p.Val483GlyfsTer29)
    type: FRAMESHIFT
    clinical_significance: PATHOGENIC
    description: >-
      De novo heterozygous frameshift in a boy with epilepsy, global
      developmental delay and low serum magnesium, classified pathogenic
      (PVS1, PS2, PM2_Supporting, PP4).
    evidence:
    - reference: PMID:37532502
      reference_title: "[Analysis of CNNM2 gene variant in a child with Hypomagnesemia, seizures, and mental retardation syndrome]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genetic testing showed that the child has harbored a heterozygous c.1448delT (p.Val483GlyfsTer29) variant of the CNNM2 gene, which was de novo in origin."
      explanation: Identification of the de novo truncating variant.
pathophysiology:
- name: CNNM2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous or biallelic CNNM2 variants abolish or reduce CNNM2 function.
    Nonsense variants and multi-exon deletions in affected heterozygotes
    indicate that loss of one functional allele is sufficient
    (haploinsufficiency). Missense variants cluster in the DUF21
    transmembrane domain and the CBS-pair domains.
  role: trigger
  genes:
  - preferred_term: CNNM2
    term:
      id: hgnc:103
      label: CNNM2
  molecular_functions:
  - preferred_term: CNNM2-dependent magnesium transport activity
    term:
      id: GO:0015095
      label: magnesium ion transmembrane transporter activity
    modifier: DECREASED
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:33600043
    reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonsense mutations leading to a preterminal stop of translation as well as the deletion of multiple exons of the CNNM2 gene identified in two patients clearly argue for a loss of CNNM2 function as the general underlying disease mechanism of HSMR and for functional haploinsufficiency in monoallelic cases."
    explanation: Null alleles in affected heterozygotes.
  - reference: PMID:22399287
    reference_title: "Membrane topology and intracellular processing of cyclin M2 (CNNM2)."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "By homology modeling, we demonstrated that the loss-of-function mutation as found in patients disturbs the potential ATP binding by the intracellular cystathionine β-synthase domains."
    explanation: A patient variant is predicted to disturb ATP binding by the CBS domains.
  downstream:
  - target: Disrupted Mg-ATP Binding by the CBS Module
    causal_link_type: DIRECT
    description: >-
      Missense variants in the intracellular CBS-pair (Bateman) module, such
      as p.Thr568Ile, interfere with its Mg2+-dependent binding of ATP.
    evidence:
    - reference: PMID:24706765
      reference_title: "Mg2+-dependent interactions of ATP with the cystathionine-β-synthase (CBS) domains of a magnesium transporter."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Binding analyses reveal that the CBS domains of CNNM2 bind directly to ATP and not AMP in a manner dependent on the presence of Mg(2+), which is inhibited in a similar pattern by the disease-associated amino acid substitution."
      explanation: A disease-associated CBS substitution inhibits Mg-ATP binding.
  - target: Reduced CNNM2 Plasma Membrane Expression
    causal_link_type: DIRECT
    description: >-
      Many missense variants reduce the amount of CNNM2 reaching the plasma
      membrane.
    evidence:
    - reference: PMID:33600043
      reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Interestingly, the pathogenic mutations resulted in decreased plasma membrane expression."
      explanation: Cell surface biotinylation of patient variants in HEK293 cells.
  - target: Loss of CNNM2-Dependent Magnesium Transport
    causal_link_type: DIRECT
    description: >-
      Patient variants, including null alleles, remove CNNM2-dependent
      magnesium uptake.
    evidence:
    - reference: PMID:33600043
      reference_title: "The phenotypic and genetic spectrum of patients with heterozygous mutations in cyclin M2 (CNNM2)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "25 Mg2+ uptake assays demonstrated loss-of-function in seven out of nine variants in CNNM2."
      explanation: Most novel variants lost CNNM2-dependent magnesium uptake.
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      CNNM2 is required for brain development through a function that does
      not depend on serum magnesium. The steps between loss of CNNM2 and the
      developmental defect are not known.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Interestingly, the brain phenotypes observed in both zebrafish and patients were independent of Mg2+, as Mg2+ supplementation was unsuccessful to rescue the phenotypes."
      explanation: Magnesium supplementation did not rescue the brain phenotype in zebrafish morphants or patients.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Seizures continue after serum magnesium is corrected, which points to a
      disturbance of brain function caused by defective CNNM2 itself.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, the persistence of seizure activity despite Mg2+ supplementation might point to a genuine disturbance in brain function caused by defective CNNM2."
      explanation: The authors attribute persistent seizures to CNNM2 dysfunction in the brain; stated as a possibility.
- name: Disrupted Mg-ATP Binding by the CBS Module
  biological_scale: MOLECULAR
  description: >-
    The intracellular Bateman module of CNNM2 (residues 429 to 584, two CBS
    domains) binds ATP in a Mg2+-dependent way, and nucleotide binding
    switches the CBS module dimer from a twisted to a flat disc-like form
    that alters the elements linking it to the transmembrane region. The
    dominant p.Thr568Ile variant, reported in one of the first CNNM2
    families, mimics the nucleotide-bound structure and is proposed to lock
    the module in its flat form. CBS-deleted CNNM2 cannot promote Mg2+
    efflux.
  molecular_functions:
  - preferred_term: Mg-ATP binding by the CBS module
    term:
      id: GO:0005524
      label: ATP binding
    modifier: DECREASED
  evidence:
  - reference: PMID:25184538
    reference_title: "Nucleotide binding triggers a conformational change of the CBS module of the magnesium transporter CNNM2 from a twisted towards a flat structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results of the present study suggest that the T568I mutation exerts its pathogenic effect in humans by constraining the conformational equilibrium of the CBS module of CNNM2, which becomes 'locked' in its flat form."
    explanation: >-
      Crystal structures of the Bateman module show the pathogenic
      substitution fixing the nucleotide-bound conformation.
  - reference: PMID:24706765
    reference_title: "Mg2+-dependent interactions of ATP with the cystathionine-β-synthase (CBS) domains of a magnesium transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Deletion mutants of CNNM2 and CNNM4, lacking the CBS domains, are unable to promote Mg(2+) efflux."
    explanation: The CBS domains are required for CNNM2 activity.
  downstream:
  - target: Loss of CNNM2-Dependent Magnesium Transport
    causal_link_type: DIRECT
    description: A CBS-domain substitution abolishes CNNM2-mediated Mg2+ efflux.
    evidence:
    - reference: PMID:24706765
      reference_title: "Mg2+-dependent interactions of ATP with the cystathionine-β-synthase (CBS) domains of a magnesium transporter."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, the substitution of one amino acid residue in the CBS domains of CNNM2, which is associated with human hereditary hypomagnesemia, abrogates Mg(2+) efflux."
      explanation: The disease substitution in the CBS domain removes efflux activity.
- name: Reduced CNNM2 Plasma Membrane Expression
  biological_scale: CELLULAR
  description: >-
    Mutant CNNM2 proteins reach the plasma membrane less efficiently than wild
    type. Shown by cell surface biotinylation for p.Glu122Lys, p.Ser269Trp and
    most variants of the largest cohort, and by mislocalization and
    cytoplasmic aggregation for p.Glu298del and p.Pro360Arg.
  biological_processes:
  - preferred_term: protein localization to plasma membrane
    term:
      id: GO:0072659
      label: protein localization to plasma membrane
    modifier: DECREASED
  evidence:
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biotinylation experiments demonstrated a trafficking defect of p.Glu122Lys and p.Ser269Trp mutants supporting a loss-of-function nature of CNNM2 mutations."
    explanation: Trafficking defect of two patient variants.
  - reference: PMID:40612795
    reference_title: "Two novel variants in CNNM2 disrupts magnesium efflux leading to neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies confirmed that the p.E298del and p.P360R variants increased CNNM2 transcription and protein levels, impairing the proper localization of the CNNM2 protein to the cell membrane."
    explanation: Two further variants fail to localize to the cell membrane.
  downstream:
  - target: Loss of CNNM2-Dependent Magnesium Transport
    causal_link_type: DIRECT
    description: Less CNNM2 at the plasma membrane means less CNNM2-dependent magnesium transport.
    evidence:
    - reference: PMID:24699222
      reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To examine whether CNNM2 dysfunction can be explained by a reduced plasma membrane expression, all mutants were subjected to cell surface biotinylation analysis."
      explanation: >-
        The authors tested reduced surface expression as the explanation for

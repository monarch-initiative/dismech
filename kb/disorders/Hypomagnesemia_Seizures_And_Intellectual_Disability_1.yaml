    renal magnesium reabsorption. CNNM2 is expressed at the basolateral
    membrane of these cells and of the cortical thick ascending limb. With
    CNNM2 lost, fractional magnesium excretion stays in the normal range
    despite low serum magnesium, which is inappropriate and indicates renal
    magnesium wasting.

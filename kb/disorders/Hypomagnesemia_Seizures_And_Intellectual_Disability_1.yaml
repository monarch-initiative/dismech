    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients suffered from hypomagnesemia (0.44-0.72 mmol/L), which could not be fully corrected by Mg2+ supplementation."
    explanation: Hypomagnesemia in every patient of the cohort.
  - reference: PMID:24699222
    reference_title: "CNNM2 mutations cause impaired brain development and seizures in patients with hypomagnesemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Continuous oral Mg2+ supplementation stabilized serum Mg2+ levels in the subnormal range, however a complete normalization of Mg2+ metabolism could not be achieved in any of the patients."
    explanation: Supplementation does not normalize serum magnesium.
  - reference: PMID:34490037
    reference_title: "Case Report: CNNM2 Mutations Cause Damaged Brain Development and Intractable Epilepsy in a Patient Without Hypomagnesemia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented with mild intellectual disability and refractory epilepsy but without hypomagnesemia."
    explanation: A de novo CNNM2 carrier without hypomagnesemia, so the finding is not obligatory.

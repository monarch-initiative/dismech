inheritance:
- name: X-linked inheritance with female-limited expression
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    PCDH19 is on the X chromosome, but expression is female-limited: heterozygous
    females are affected while hemizygous males are usually unaffected carriers,
    the opposite of the typical X-linked pattern. Most cases are de novo or
    inherited from an unaffected carrier father. Rare affected males carry a
    postzygotic (mosaic) PCDH19 variant.
  evidence:
  - reference: PMID:18469813
    reference_title: "X-linked protocadherin 19 mutations cause female-limited epilepsy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EFMR spares transmitting males and affects only carrier females."
    explanation: >-
      The founding study established the unusual female-limited, male-sparing
      inheritance pattern of the disorder.
  - reference: PMID:19752159
    reference_title: "Epilepsy and mental retardation limited to females with PCDH19 mutations can present de novo or in single generation families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "can present de novo or in single generation families"
    explanation: >-
      Documents the frequent de novo occurrence, consistent with the largely
      simplex presentation.
pathophysiology:
- name: PCDH19 Loss-of-Function Variant
  description: >-
    A loss-of-function variant in PCDH19 (missense, truncating, or deletion)
    abolishes or reduces functional protocadherin-19, a calcium-dependent
    cell-adhesion molecule of the delta-2 protocadherin family expressed in
    neurons. This node captures the single concept of the initiating genetic
    lesion.
  role: trigger
  gene:
    preferred_term: PCDH19
    term:
      id: hgnc:14270
      label: PCDH19
  evidence:
  - reference: PMID:18469813
    reference_title: "X-linked protocadherin 19 mutations cause female-limited epilepsy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five mutations resulted in the introduction of a premature termination codon. Study of two of these demonstrated nonsense-mediated decay of PCDH19 mRNA."
    explanation: >-
      Establishes the loss-of-function character of the initiating lesion: most
      of the founding mutations truncate the protein and are cleared by
      nonsense-mediated decay, so functional protocadherin-19 is absent from the
      mutant allele rather than merely altered.
  - reference: PMID:18469813
    reference_title: "X-linked protocadherin 19 mutations cause female-limited epilepsy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two missense mutations were predicted to affect adhesiveness of PCDH19 through impaired calcium binding."
    explanation: >-
      Covers the missense arm of the same node and ties it to the
      calcium-dependent adhesion function that the downstream
      cellular-interference node depends on.
  downstream:
  - target: Mosaic Protocadherin-19 Expression
    causal_link_type: DIRECT
    description: >-
      In a heterozygous female (or mosaic male), the variant produces a mixture
      of protocadherin-19-positive and protocadherin-19-negative cells.
- name: Mosaic Protocadherin-19 Expression
  description: >-
    Because PCDH19 is subject to random X-chromosome inactivation, a heterozygous
    female is a mosaic of neurons expressing normal protocadherin-19 and neurons
    lacking it. A hemizygous male instead has a uniform, all-negative population.
    This node captures the single concept of the mosaic cell-population state
    that is necessary for disease.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mosaic expression of Pcdh19 in heterozygous female mice leads to striking sorting between cells expressing wild-type (WT) PCDH19 and null PCDH19 in the developing cortex, correlating with altered network activity."
    explanation: >-
      Demonstrates the mosaic cell-population state this node models, and shows
      it has a physical consequence in the developing cortex: positive and
      negative neurons segregate from one another, with altered network
      activity.
  - reference: PMID:32366910
    reference_title: "A standardized patient-centered characterization of the phenotypic spectrum of PCDH19 girls clustering epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no phenotypic differences between heterozygous females and mosaic males."
    explanation: >-
      Strong human support for mosaicism (not sex) being the operative variable:
      mosaic males, who share the mosaic cell population but not the female
      karyotype, are phenotypically indistinguishable from heterozygous females.
  downstream:
  - target: Cellular Interference and Impaired Homophilic Adhesion
    causal_link_type: DIRECT
    description: >-
      The coexistence of positive and negative neuron populations sets up
      pathological cellular interference.
- name: Cellular Interference and Impaired Homophilic Adhesion
  description: >-
    Protocadherin-19 mediates calcium-dependent homophilic cell-cell adhesion.
    In a mosaic brain, protocadherin-19-positive and protocadherin-19-negative
    neurons cannot engage in normal homophilic interactions at their shared
    boundaries, so the mismatch itself (cellular interference), rather than
    simple loss of the protein, disrupts neuronal communication. This explains
    why uniform loss in hemizygous males is tolerated. This node captures the
    single concept of the cellular-interference mechanism.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Homophilic cell-cell adhesion
    term:
      id: GO:0007156
      label: homophilic cell-cell adhesion
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "protocadherin 19 (PCDH19) mutations cause epilepsy in heterozygous females but spare hemizygous males."
    explanation: >-
      States the paradoxical inheritance the cellular-interference model must
      explain.
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complete deletion of PCDH19 in heterozygous mice abolishes abnormal cell sorting and restores normal network activity."
    explanation: >-
      The pivotal result: removing the mosaic (uniform deletion) abolishes the
      abnormal cell sorting and normalizes activity, demonstrating that the
      mismatched mosaic - cellular interference - not simple loss of the
      protein, is pathogenic.
  downstream:
  - target: Disrupted Neuronal Network Assembly
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired adhesion between mismatched neuron populations disrupts the
      assembly and wiring of neuronal networks.
- name: Disrupted Neuronal Network Assembly
  description: >-
    Faulty protocadherin-19-dependent interactions perturb neuronal migration,
    sorting, and synaptic connectivity, yielding abnormally assembled cortical
    and limbic circuits. This node captures the single concept of the
    circuit-assembly defect.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results highlight the role of PCDH19 in determining cell adhesion affinities during cortical development and the way segregation of WT and null PCDH19 cells is associated with the unique X-linked inheritance of PCDH19 epilepsy."
    explanation: >-
      Places the defect at the level of cortical developmental assembly, which
      is what this node asserts, rather than at ongoing synaptic function.
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, we identify variable cortical malformations in PCDH19 epilepsy patients."
    explanation: >-
      Human structural correlate of the circuit-assembly defect. Rated PARTIAL
      because the malformations are described as variable, so they are not a
      constant feature and cannot carry the node on their own.
  downstream:
  - target: Neuronal Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormally assembled circuits become hyperexcitable, particularly under
      the provocation of fever.
  - target: Cognitive and Behavioral Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same circuit-assembly defect underlies the cognitive and behavioral
      features.
- name: Neuronal Network Hyperexcitability
  description: >-
    The disrupted networks are hyperexcitable and prone to hypersynchronous
    discharges, with a characteristic sensitivity to fever. This node captures
    the single concept of network hyperexcitability and conforms to the shared
    epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Complete deletion of PCDH19 in heterozygous mice abolishes abnormal cell sorting and restores normal network activity."
    explanation: >-
      The rescue experiment shows network activity is abnormal in the mosaic

genetic:
- name: PCDH19
  gene_term:
    preferred_term: PCDH19
    term:
      id: hgnc:14270
      label: PCDH19
  relationship_type: CAUSATIVE
  notes: >-
    PCDH19 (Xq22.1) encodes protocadherin-19, a calcium-dependent homophilic
    cell-adhesion molecule. Disease requires a mosaic of positive and negative
    neurons: heterozygous females (via random X-inactivation) and rare mosaic
    males are affected, whereas hemizygous (uniformly negative) males are usually
    unaffected carriers. Variants include missense, truncating, and whole-gene
    deletions.
  evidence:
  - reference: PMID:18469813
    reference_title: "X-linked protocadherin 19 mutations cause female-limited epilepsy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aided by systematic resequencing of 737 X chromosome genes, we identified different protocadherin 19 (PCDH19) gene mutations in seven families with EFMR."
    explanation: >-
      The gene-discovery study establishing PCDH19 as causative, across seven
      independent EFMR families.
  - reference: PMID:18469813
    reference_title: "X-linked protocadherin 19 mutations cause female-limited epilepsy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCDH19 is expressed in developing brains of human and mouse and is the first member of the cadherin superfamily to be directly implicated in epilepsy or mental retardation."
    explanation: >-
      Supports the notes' framing of PCDH19 as a brain-expressed cell-adhesion
      molecule, the property the cellular-interference mechanism turns on.
  - reference: PMID:32366910
    reference_title: "A standardized patient-centered characterization of the phenotypic spectrum of PCDH19 girls clustering epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 112 individuals represented (15 males), there were 70 unique variants."
    explanation: >-
      Documents the allelic heterogeneity this notes block describes: 70 distinct
      variants across 112 individuals, with no single recurrent lesion dominating.
diagnosis:
- name: PCDH19 Molecular Genetic Testing
  description: >-
    Diagnosis is confirmed by identifying a pathogenic PCDH19 variant on
    molecular genetic testing in a female with clustering fever-sensitive
    seizures; because affected males are somatic mosaics, mosaicism-aware deep
    sequencing is needed to detect low-level variants in males. PCDH19 is a
    high-yield gene in SCN1A-negative Dravet-like females.
  evidence:
  - reference: PMID:19214208
    reference_title: "Sporadic infantile epileptic encephalopathy caused by mutations in PCDH19 resembles Dravet syndrome but mainly affects females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCDH19 is responsible for a Dravet-like syndrome, we sequenced its coding region in 73 additional SCN1A-negative patients."
    explanation: >-
      Establishes PCDH19 sequencing as the diagnostic test in SCN1A-negative
      Dravet-like patients.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No precise cases-per-100,000 figure is well established. PCDH19 clustering
    epilepsy is nonetheless described as one of the most common monogenic
    epilepsies and, after SCN1A, a leading epilepsy gene; PCDH19 variants are
    found in a substantial fraction of SCN1A-negative Dravet-like females.
  evidence:
  - reference: PMID:19214208
    reference_title: "Sporadic infantile epileptic encephalopathy caused by mutations in PCDH19 resembles Dravet syndrome but mainly affects females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCDH19 plays a major role in epileptic encephalopathies, with a clinical spectrum overlapping that of DS."
    explanation: >-
      Supports the qualitative rarity/importance framing (a major epilepsy gene
      with a Dravet-overlapping spectrum); no normalized rate is asserted.
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are treated with antiseizure medications; clobazam and bromide are
    among the agents reported to help the clustering seizures, though seizures
    can be drug-resistant.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clobazam
      term:
        id: CHEBI:31413
        label: clobazam
- name: Neurosteroid Therapy
  description: >-
    Because PCDH19 loss has been linked to reduced neurosteroid (allopregnanolone)
    synthesis and consequent GABA-A hypofunction, the neurosteroid GABA-A
    positive allosteric modulator ganaxolone has been investigated as a targeted
    therapy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:

  downstream:
  - target: Neuronal Network Hyperexcitability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormally assembled circuits become hyperexcitable, particularly under
      the provocation of fever.
  - target: Cognitive and Behavioral Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same circuit-assembly defect underlies the cognitive and behavioral
      features.
- name: Neuronal Network Hyperexcitability
  biological_scale: TISSUE
  description: >-
    The disrupted networks are hyperexcitable and prone to hypersynchronous
    discharges, with a characteristic sensitivity to fever. This node captures

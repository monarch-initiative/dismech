discussions:
- discussion_id: gap_pcdh19_cellular_interference_completeness
  prompt: >-
    Is cellular interference (pathological mis-sorting between
    protocadherin-19-positive and protocadherin-19-negative neurons in a mosaic
    brain) the complete explanation for PCDH19 clustering epilepsy, or do
    mosaicism-independent mechanisms such as altered neurogenesis and
    mitotic-spindle defects also contribute?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
  - pathophysiology#Disrupted Neuronal Network Assembly
  rationale: >-
    The cellular-interference model elegantly explains the female-limited,
    male-sparing inheritance: mosaic mice show abnormal cell sorting that is
    abolished by uniform deletion. But patient iPSC and organoid work points to
    additional, potentially mosaicism-independent phenotypes (precocious
    neurogenesis, mitotic-spindle and centrosome abnormalities), and some model
    data suggest phenotypes that do not require mosaicism. How much of the human
    disease is cellular interference versus a parallel cell-autonomous
    developmental defect is unresolved, and it shapes which mechanism a therapy
    should target.
  evidence:
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Complete deletion of PCDH19 in heterozygous mice abolishes abnormal cell sorting and restores normal network activity."
    explanation: >-
      Establishes cellular interference as a genuine mechanism; the open question
      is whether it is the whole story or whether cell-autonomous developmental
      defects also contribute.
  proposed_experiments:
  - experiment_id: exp_pcdh19_interference_vs_cell_autonomous
    name: Dissecting cellular interference from cell-autonomous defects
    description: >-
      Compare mosaic and uniform PCDH19-null human cortical organoids and mouse
      cortex for network excitability and developmental phenotypes, to partition
      which deficits require mosaicism (interference) and which persist in a
      uniform-genotype (cell-autonomous) context.
    experiment_type:
      preferred_term: mosaic versus uniform comparison experiment
    readouts:
    - name: Interference-dependent versus cell-autonomous phenotypes
      target: pathophysiology#Disrupted Neuronal Network Assembly
      assays:
      - preferred_term: multielectrode array recording
      - preferred_term: immunostaining
      direction: POSITIVE
    controls:
    - name: Wild-type uniform organoids
      description: PCDH19-normal uniform organoids as the reference.
    decision_criterion: >-
      A phenotype is interference-dependent if it appears in mosaic but not
      uniform-null tissue; it is cell-autonomous if it persists in uniform-null
      tissue.
    would_support:
    - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
    datasets:
    - accession: geo:GSE229366
      title: >-
        PCDH19 regulation of neural progenitor cell differentiation suggests
        asynchrony of neurogenesis as a mechanism contributing to PCDH19 Girls
        Clustering Epilepsy
      description: >-
        Existing data that already runs part of this comparison, at the
        progenitor rather than the network level: neurospheres from Pcdh19
        knockout, wild-type, and a mosaic mix of the two, arrayed at day 0 and
        day 4 of differentiation. It is the mouse, in vitro, transcriptomic
        precedent for the mosaic-versus-uniform contrast this experiment
        proposes to make in human organoids with electrophysiological readouts.
      organism:
        preferred_term: house mouse
        term:
          id: NCBITaxon:10090
          label: Mus musculus
      data_type: MICROARRAY
      sample_count: 18
      publication: PMID:29763708
      notes: >-
        Same series as the entry-level datasets record; listed here because its
        three-genotype design directly prefigures this experiment's decision
        criterion. That design is the load-bearing reason for the attachment,
        so it is sourced rather than asserted: GEO's "Overall design" field
        states that the series compares "Pcdh19 knock out, wild type or a
        mosaic mix of cells", and GEO's sample titles name a wild-type arm
        (GSM7159328-30), a Pcdh19-knockout arm (GSM7159331-33), and a
        "mosaic_wild_type-Pcdh19_knockout" arm (GSM7159334-36), each repeated
        after differentiation (GSM7159337-45). The contrast of mosaic against
        uniform-null tissue that this experiment's decision criterion turns on
        is therefore already present in the series, at the progenitor level.

- discussion_id: gap_pcdh19_allopregnanolone_neurosteroid_hypothesis
  prompt: >-
    Does PCDH19-associated allopregnanolone (neurosteroid) deficiency causally
    contribute to seizures via reduced GABA-A inhibition, and does it predict
    response to neurosteroid therapy such as ganaxolone?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Network Hyperexcitability
  rationale: >-
    Transcriptomic work in patient cells links PCDH19 dysfunction to reduced
    synthesis of allopregnanolone, a potent positive allosteric modulator of
    GABA-A receptors, suggesting a neurosteroid-deficiency arm that lowers
    inhibitory tone and could underlie the fever sensitivity. This motivated a
    ganaxolone trial, in which the seizure reduction versus placebo was larger
    but did not reach statistical significance. Whether allopregnanolone
    deficiency is causal (versus a bystander transcriptomic change) and whether a
    neurosteroid biomarker can select responders is the open question that
    determines the future of neurosteroid therapy in this disorder.
  evidence:
  - reference: PMID:26123493
    reference_title: "Mutations of protocadherin 19 in female epilepsy (PCDH19-FE) lead to allopregnanolone deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In conclusion, we show that the deficiency of neurosteroid allopregnanolone, one of the most potent GABA receptor modulators, may contribute to PCDH19-FE."
    explanation: >-
      Provides the mechanistic basis (allopregnanolone deficiency) for the
      neurosteroid hypothesis and for ganaxolone therapy.
  - reference: PMID:36870093
    reference_title: "Phase 2, placebo-controlled clinical study of oral ganaxolone in PCDH19-clustering epilepsy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ganaxolone was generally well tolerated and led to a greater reduction in the frequency of PCDH19-clustering seizures compared to placebo; however, the trend did not reach statistical significance."
    explanation: >-
      The trial tested the hypothesis clinically; the non-significant primary
      result leaves the causal and predictive value of the neurosteroid arm open.
  proposed_experiments:
  - experiment_id: exp_pcdh19_neurosteroid_biomarker_response
    experiment_design: HUMAN_OBSERVATIONAL
    name: Allopregnanolone biomarker and neurosteroid-therapy response
    description: >-
      In a prospective PCDH19 cohort, relate baseline serum allopregnanolone to
      seizure burden and to response to neurosteroid therapy, testing whether the
      biomarker identifies a neurosteroid-responsive subgroup.
    experiment_type:
      preferred_term: biomarker-stratified treatment-response experiment
    readouts:
    - name: Seizure response by neurosteroid biomarker
      target: pathophysiology#Neuronal Network Hyperexcitability
      assays:
      - preferred_term: electroencephalography
      direction: NEGATIVE
    controls:
    - name: Biomarker-normal patients
      description: Patients without measurable allopregnanolone deficiency.
    decision_criterion: >-
      The hypothesis is supported if lower baseline allopregnanolone predicts
      greater seizure reduction with neurosteroid therapy.
    would_support:
    - pathophysiology#Neuronal Network Hyperexcitability

- discussion_id: gap_pcdh19_mosaic_dependence_therapy_paradox
  prompt: >-
    How does the requirement for cellular mosaicism constrain therapeutic
    strategy in PCDH19 clustering epilepsy - in particular, does the
    mosaic-dependent mechanism make straightforward gene replacement
    counterproductive, and does the mosaic ratio (X-inactivation skew or somatic
    variant fraction) predict severity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Mosaic Protocadherin-19 Expression
  - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
  rationale: >-
    Because the pathogenic unit is the mismatched mosaic and not the null cell,
    the disorder poses an unusual therapeutic problem: uniformly restoring
    protocadherin-19 to all neurons would move a patient toward a uniform state
    (potentially beneficial), but partial or patchy correction could create new
    mosaic boundaries and additional interference. Meanwhile, affected mosaic
    males and the variable X-inactivation skew in females suggest the mosaic
    ratio may set severity. Whether mosaic fraction predicts outcome, and how to
    design a correction that does not recreate interference, are open questions
    with direct implications for gene- and cell-based therapy design.
  proposed_experiments:
  - experiment_id: exp_pcdh19_mosaic_ratio_and_correction
    name: Mosaic ratio, severity, and correction strategy
    description: >-
      In graded-mosaic PCDH19 organoid and mouse systems, vary the fraction of
      protocadherin-19-null cells and measure network excitability, then test
      whether uniform correction versus partial correction improves or worsens
      the phenotype.
    experiment_type:
      preferred_term: graded-mosaic correction experiment
    readouts:
    - name: Excitability versus mosaic fraction and correction
      target: pathophysiology#Cellular Interference and Impaired Homophilic Adhesion
      assays:
      - preferred_term: multielectrode array recording
      direction: POSITIVE
    controls:
    - name: Uniform wild-type and uniform null
      description: Both uniform-genotype states as the non-mosaic references.
    decision_criterion: >-
      A mosaic-ratio severity relationship is supported if intermediate mosaic
      fractions produce the greatest hyperexcitability; a correction is validated
      only if it reduces excitability without creating new interference.
    would_support:
    - pathophysiology#Cellular Interference and Impaired Homophilic Adhesion

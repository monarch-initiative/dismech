    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine different point mutations (four missense and five truncating mutations) were identified in 11 unrelated female patients."
    explanation: >-
      Demonstrates diagnostic yield of PCDH19 sequencing in SCN1A-negative
      female patients presenting with Dravet-like infantile epileptic
      encephalopathy.
differential_diagnoses:
- name: Dravet Syndrome
  description: >-
    SCN1A-related developmental and epileptic encephalopathy presenting in
    infancy with prolonged febrile and afebrile seizures, developmental slowing,
    and drug resistance that closely mimics early PCDH19 clustering epilepsy.
  disease_term:
    preferred_term: Dravet syndrome
    term:
      id: MONDO:0100135
      label: Dravet syndrome
  distinguishing_features:
  - Affects males and females equally via heterozygous SCN1A variants, whereas PCDH19 clustering epilepsy predominantly affects heterozygous females and mosaic males.
  - Prominent seizure clustering with fearful affective focal seizures and fewer polymorphic myoclonic or atypical absence seizures favor PCDH19 clustering epilepsy over SCN1A Dravet syndrome.
  evidence:
  - reference: PMID:19214208
    reference_title: "Sporadic infantile epileptic encephalopathy caused by mutations in PCDH19 resembles Dravet syndrome but mainly affects females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PCDH19 and SCN1A mutations had very similar clinical features including the association of early febrile and afebrile seizures, seizures occurring in clusters, developmental and language delays, behavioural disturbances, and cognitive regression."
    explanation: >-

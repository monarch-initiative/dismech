- name: Fever-Sensitive Clustering Seizures
  description: >-
    The clinical hallmark is seizures, often triggered or worsened by fever,
    that occur in tight clusters (many seizures over one or a few days separated
    by longer seizure-free intervals). Seizure types include focal, tonic-clonic,
    and absence. This node captures the single concept of the clustering-seizure
    endpoint and conforms to the shared epilepsy final common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"

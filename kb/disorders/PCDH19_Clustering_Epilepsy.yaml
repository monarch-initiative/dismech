    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results highlight the role of PCDH19 in determining cell adhesion affinities during cortical development and the way segregation of WT and null PCDH19 cells is associated with the unique X-linked inheritance of PCDH19 epilepsy."
    explanation: >-
      Places the defect at the level of cortical developmental assembly, which
      is what this node asserts, rather than at ongoing synaptic function.
  - reference: PMID:29301106
    reference_title: "Abnormal Cell Sorting Underlies the Unique X-Linked Inheritance of PCDH19 Epilepsy."
    supports: SUPPORT
    directness: INDIRECT

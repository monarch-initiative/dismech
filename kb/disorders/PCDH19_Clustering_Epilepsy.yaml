name: PCDH19 Clustering Epilepsy
creation_date: "2026-07-17T00:00:00Z"
category: Mendelian
description: >-
  PCDH19 clustering epilepsy (PCDH19-CE; historically epilepsy and mental
  retardation limited to females, EFMR; DEE9) is an X-linked developmental and
  epileptic encephalopathy with a distinctive inheritance pattern: heterozygous
  females are affected whereas hemizygous males are typically unaffected
  carriers. It presents in infancy or early childhood with fever-sensitive
  seizures that characteristically occur in clusters, and is variably associated
  with intellectual disability and behavioral features (autistic traits,
  hyperactivity, aggression). The paradoxical female-limited expression is
  explained by cellular interference: random X-chromosome inactivation in
  heterozygous females produces a mosaic of protocadherin-19-positive and
  protocadherin-19-negative neurons that cannot interact normally, whereas
  hemizygous males have a uniform (all-negative) neuronal population and are
  spared; rare mosaic males (somatic PCDH19 variant) are affected, supporting
  the model.
parents:
- Epilepsy
- Neurodevelopmental Disorder
- Neurological Disease
synonyms:
- PCDH19-related epilepsy
- PCDH19-CE
- PCDH19 epilepsy
- Protocadherin 19 clustering epilepsy
- Epilepsy, female-restricted, with mental retardation
- EFMR
- Developmental and epileptic encephalopathy 9
- DEE9
- Juberg-Hellman syndrome

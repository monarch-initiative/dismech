    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our observations are compatible with Tulp1 functioning in protein trafficking in multiple photoreceptor compartments, likely as an adapter molecule linking vesicles to molecular motors and the cytoskeletal scaffold."
    explanation: >-

      Complete loss of Tulp1 is sufficient for early-onset photoreceptor
      degeneration.
  - reference: PMID:16303976
    reference_title: "Tubby-like protein 1 (TULP1) interacts with F-actin in photoreceptor cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In photoreceptor cells, actin and TULP1 colocalize at the inner segment, connecting cilium, and outer limiting membrane."
    explanation: >-
      TULP1 binds F-actin and sits where outer segment proteins are sorted.
  - reference: PMID:17525220
    reference_title: "Interaction between the photoreceptor-specific tubby-like protein 1 and the neuronal-specific GTPase dynamin-1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data indicated that TULP1 interacts with Dynamin-1 and suggested that TULP1 is involved in the vesicular trafficking of photoreceptor proteins, both at the nerve terminal during synaptic transmission and at the inner segment during protein translocation to the outer segment."
    explanation: >-
      The dynamin-1 interaction places TULP1 in vesicular trafficking at the
      synapse and the inner segment, the two arms that follow.
  - reference: PMID:10892883
    reference_title: "Localization of tubby-like protein 1 in developing and adult human retinas."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In adult retinas, anti-TULP1 labels cone and rod inner segments, somata, and synapses; outer segments are TULP1-negative."
    explanation: >-

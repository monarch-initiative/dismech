- TULP1-related retinal dystrophy
- TULP1-associated inherited retinal degeneration
parents:
- Leber Congenital Amaurosis
- Retinitis Pigmentosa
- Inherited Retinal Dystrophy
notes: >-
  Scope and binding. This entry covers the whole TULP1 recessive retinopathy
  spectrum, LCA15 and retinitis pigmentosa 14 together, following the ClinGen
  Retina Gene Curation Expert Panel, which lumped the two "per criteria outlined
  by the ClinGen Lumping & Splitting Working Group" into one entity,
  "TULP1-related retinopathy", on the grounds of a shared mechanism (biallelic loss of
  function), shared inheritance and a single clinical spectrum, and curated that
  entity against MONDO:0013457 (Definitive, 5 June 2025). MONDO has no TULP1
  gene-level spectrum term (unlike GUCY2D, PRPH2 or LCA5, whose spectrum entries
  bind MONDO:0100453, MONDO:1040055 and MONDO:0100445), so disease_term stays
  on MONDO:0013457, the term ClinGen used, with its label kept as given; a MONDO
  "TULP1-related retinopathy" grouping term would be the correct binding once it
  exists. The name follows the ClinGen label and the GeneReviews-style dyadic
  form used by the sibling retinopathy entries; the MONDO labels of both
  presentations are kept as synonyms and as has_subtypes rows. A separate RP14
  entry is not made because its pathograph would be identical to this one:
  every mechanistic source below studies the same null and missense allele
  classes, and much of it was published under the retinitis pigmentosa label.
  The two labels differ in age at onset and severity, not in mechanism; an
  Algerian family homozygous for one TULP1 allele contains both LCA and
  early-onset retinal degeneration, and the largest cohort spans LCA, early-onset
  and adult-onset RP, cone and cone-rod dystrophy. Neither MONDO term carries an
  Orphanet cross-reference, and no TULP1-specific Orphanet record was found.
  Sources. The only GeneReviews chapters that cover TULP1 are the nonsyndromic
  LCA/EOSRD and nonsyndromic retinitis pigmentosa overviews, whose PubMed
  abstracts are statements of purpose without clinical findings, so the
  phenotype baseline comes from the TULP1 case series (Lewis 1999, Mataftsi
  2007, Jacobson 2014, Khan 2015, Majander 2023, Bodenbender 2023). Mechanistic
  evidence comes almost entirely from Tulp1 mouse and zebrafish models and cell
  culture. Modules. Cone loss is not conformed to the photoreceptor_degeneration
  module's secondary cone degeneration node, because TULP1 is expressed in cones
  and Tulp1-null cones mislocalize their opsin and degenerate early alongside
  rods, so cone loss here is at least partly cell-autonomous rather than
  secondary to rod death. No ciliopathy_dysfunction node is conformed: TULP1
  acts in the inner segment and synapse rather than as a basal body, transition
  zone or intraflagellar transport component (see the ciliopathy discussion).

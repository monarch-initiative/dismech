    - reference: PMID:10440267
      reference_title: "Tubby-like protein 1 homozygous splice-site mutation causes early-onset severe retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Heterozygotes had normal visual function."
      explanation: Carriers are unaffected.
  features: >-
    Biallelic nonsense, frameshift, splice-site, small in-frame and missense
    variants. Founder alleles include c.901C>T (p.Gln301Ter) on the Arabian
    Peninsula, c.148delG in Finland and the IVS14+1G>A splice-site allele in
    Dominican kindreds. Missense variants cluster in the C-terminal tubby
    domain. Truncating alleles give similar levels of visual loss.
  variants:
  - name: c.901C>T (p.Gln301Ter)
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous nonsense founder allele on a shared haplotype in ten Arabian
      children with congenital rod-cone dystrophy.
    evidence:
    - reference: PMID:25342276
      reference_title: "A TULP1 founder mutation, p.Gln301*, underlies a recognisable congenital rod-cone dystrophy phenotype on the Arabian Peninsula."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A specific haplotype was associated with p.Gln301* and was not present in controls."
      explanation: Founder haplotype.
  - name: c.148delG
    variant_type: deletion
    clinical_significance: PATHOGENIC
    description: Homozygous frameshift allele in 16 Finnish patients with infantile or early-childhood onset.
    evidence:
    - reference: PMID:36128853
      reference_title: "Natural history and biomarkers of retinal dystrophy caused by the biallelic TULP1 variant c.148delG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The biallelic TULP1 variant c.148delG was associated with infantile and early childhood onset IRD."
      explanation: Early-onset disease with this allele.
    - reference: PMID:31087526
      reference_title: "The genetic aetiology of retinal degeneration in children in Finland - new founder mutations identified."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Several founder mutations were detected including three novel founder mutations c.148delG in TULP1, c.2314C>R (p.Gln772Ter) in RPGRIP1 and c.533G>A (Trp178Ter) in TYR."
      explanation: >-
        Founder status of this allele in Finnish children with retinal
        degeneration, which the variant description asserts.
  - name: IVS14+1G>A
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      Canonical splice-donor allele homozygous in 33 affected members of two
      Dominican kindreds, causing early-onset severe retinal degeneration.
    evidence:
    - reference: PMID:10440267
      reference_title: "Tubby-like protein 1 homozygous splice-site mutation causes early-onset severe retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This TULP1 splice-site mutation in homozygotes causes early-onset, severe retinal degeneration involving macular and peripheral cones and rods."
      explanation: Phenotype of homozygotes.
  - name: 6-bp in-frame duplication
    variant_type: duplication
    clinical_significance: PATHOGENIC
    description: Homozygous in a consanguineous Algerian family with LCA and early-onset retinal degeneration.
    evidence:
    - reference: PMID:17962469
      reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Seven of 30 examined family members were affected, including five with EORD and two with LCA."
      explanation: One allele, two clinical labels in one family.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ecc6101d-f936-48a2-b2f1-34bfd785542d-2025-06-05T160000.000Z
    notes: >-
      Retina Gene Curation Expert Panel, autosomal recessive, SOP11, approved
      5 June 2025; lumps RP14 and LCA15 as TULP1-related retinopathy.
    evidence:
    - reference: CGGV:assertion_ecc6101d-f936-48a2-b2f1-34bfd785542d-2025-06-05T160000.000Z
      reference_title: "TULP1 / Leber congenital amaurosis 15 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In summary, TULP1 is definitively associated with TULP1 -related retinopathy."
      explanation: ClinGen Definitive classification.
  evidence:
  - reference: PMID:9462750
    reference_title: "Recessive mutations in the gene encoding the tubby-like protein TULP1 in patients with retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Upon analysing 162 patients with nonsyndromic recessive retinitis pigmentosa (RP) and 374 simplex cases of RP, we found two who were compound heterozygotes for mutations that cosegregated with disease in the respective families."
    explanation: First identification of TULP1 as a recessive retinal disease gene.
  - reference: PMID:17962469
    reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation in the TULP1 gene is a rare cause of LCA/EORD, with only 14 mutations reported so far."
    explanation: TULP1 as a rare cause of LCA.
treatments:
- name: TULP1 Gene Supplementation (preclinical)
  description: >-
    The only disease-directed approach tested. Subretinal AAV2/5 delivery of
    Tulp1 under a photoreceptor (rhodopsin kinase) promoter at postnatal days
    2 to 3 restored Tulp1 mRNA and protein to wild-type levels in Tulp1-null
    photoreceptors but did not preserve the outer nuclear layer and gave only a
    small, transient ERG benefit at one dose. Non-photoreceptor TULP1 expression
    is one proposed reason. No human trial has been reported.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    target_cell_types:
    - preferred_term: photoreceptor cell
      term:
        id: CL:0000210
        label: photoreceptor cell
  target_mechanisms:
  - target: Loss of TULP1 Function in Photoreceptors
    treatment_effect: RESTORES
    evidence:
    - reference: PMID:32973439
      reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results indicate that TULP1 was expressed in photoreceptors; achieved levels of Tulp1 mRNA and protein were similar to wild type levels at p20."
      explanation: The vector restores the missing protein in photoreceptors.
  evidence:
  - reference: PMID:32973439
    reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that TULP1 was expressed in photoreceptors; achieved levels of Tulp1 mRNA and protein were similar to wild type levels at p20."
    explanation: The vector restores TULP1 protein.
  - reference: PMID:32973439
    reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "However, the thickness of the outer nuclear layer (ONL) did not improve in treated Tulp1-/- mice."
    explanation: Restored protein did not prevent photoreceptor loss.
  - reference: PMID:32973439
    reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that Tulp1 supplementation in photoreceptors may not be sufficient to provide robust benefit in Tulp1-/- mice."
    explanation: The study's overall conclusion.
diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis rests on finding biallelic TULP1 variants by retinal gene panel or
    exome sequencing, because the clinical picture overlaps other forms of LCA
    and early-onset retinal degeneration. A recurrent founder allele makes
    targeted testing efficient on the Arabian Peninsula.
  evidence:
  - reference: PMID:30090012
    reference_title: "Maternal uniparental isodisomy of chromosome 6 unmasks a novel variant in TULP1 in a patient with early onset retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNA from the proband was sequenced using a gene panel for inherited retinal disorders, and a single nucleotide polymorphism (SNP) array was conducted to detect the presence of deletions and uniparental disomy."
    explanation: The panel-plus-array approach that makes the diagnosis.
  - reference: PMID:36769033
    reference_title: "Biallelic Variants in TULP1 Are Associated with Heterogeneous Phenotypes of Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assays and structural analyses were performed to assess the consequences of splice variants and missense variants."
    explanation: >-
      How splice and missense variants of uncertain significance are resolved
      in this gene.
  - reference: PMID:25342276
    reference_title: "A TULP1 founder mutation, p.Gln301*, underlies a recognisable congenital rod-cone dystrophy phenotype on the Arabian Peninsula."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This makes the mutation and its associated childhood retinopathy particularly interesting for genetic diagnostic and, potentially, gene therapy approaches."
    explanation: Founder allele relevance to targeted testing.
- name: SNP array for uniparental disomy
  diagnosis_term:
    preferred_term: genotyping
    term:
      id: NCIT:C45447
      label: Genotyping
  description: >-
    When a patient is homozygous for a TULP1 variant but only one parent
    carries it, a SNP array distinguishes uniparental isodisomy of chromosome 6
    from a deletion and from non-paternity, and it changes the recurrence risk
    given to the family. Isodisomy is copy-neutral, so it is read from the
    genotypes - a stretch of chromosome with no heterozygous calls - rather
    than from array intensity; the array's intensity channel is what separates
    it from a deletion. The term bound here is therefore the genotyping
    procedure. NCIT has no SNP-array procedure term (NCIT:C116151 Single
    Nucleotide Polymorphism Array is an equipment term, not a procedure), and
    array comparative genomic hybridization would be the wrong binding because
    it measures copy number only and cannot see a copy-neutral event (needs
    term / NTR).
  evidence:
  - reference: PMID:30090012
    reference_title: "Maternal uniparental isodisomy of chromosome 6 unmasks a novel variant in TULP1 in a patient with early onset retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a single nucleotide polymorphism (SNP) array was conducted to detect the presence of deletions and uniparental disomy"
    explanation: The test that found the isodisomy.
- name: Spectral-domain optical coherence tomography
  diagnosis_term:
    preferred_term: optical coherence tomography
    term:
      id: NCIT:C20828
      label: Optical Coherence Tomography
  description: >-
    SD-OCT stages the disease and supplies its candidate biomarkers: the
    horizontal width of the foveal ellipsoid zone and the thickness of the
    foveal outer plexiform and outer nuclear layers, which track acuity and
    age.
  evidence:
  - reference: PMID:36128853
    reference_title: "Natural history and biomarkers of retinal dystrophy caused by the biallelic TULP1 variant c.148delG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The width of the foveal EZ and the thickness of the foveal OPL-ONL layers could serve as biomarkers of the disease stage."
    explanation: The imaging biomarkers of disease stage.
- name: Full-field electroretinography
  description: >-
    Full-field ERG is the functional test that establishes the severity:
    scotopic and photopic responses are nondetectable, or reduced to
    microvolt-level cone responses, often while the fundus still looks nearly
    normal. No NCIT clinical-intervention term for electroretinography was
    found, so no term is bound (needs term / NTR).
  evidence:
  - reference: PMID:17962469
    reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both scotopic and photopic electroretinograms were nondetectable."
    explanation: The ERG result that defines the severe end of the spectrum.
  - reference: PMID:10440267
    reference_title: "Tubby-like protein 1 homozygous splice-site mutation causes early-onset severe retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rod and cone electroretinograms (ERGs) were not detectable using standard methods; microvolt-level cone ERGs were present in some patients."
    explanation: >-
      Standard-method ERG is extinguished, so residual cone signal needs
      non-standard recording.
progression:
- phase: Infancy
  age_range: Birth to early childhood
  notes: >-
    Nystagmus from soon after birth and a nondetectable ERG, while the fundus
    looks virtually normal and central OCT can be within normal limits.
  evidence:
  - reference: PMID:17962469
    reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A salt-and-pepper retinopathy with midperipheral retinal pigment epithelium (RPE) atrophy was present in the older patients with LCA, whereas the retina appeared virtually normal in the younger ones."
    explanation: The near-normal fundus of the youngest patients.
  - reference: PMID:25342276
    reference_title: "A TULP1 founder mutation, p.Gln301*, underlies a recognisable congenital rod-cone dystrophy phenotype on the Arabian Peninsula."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autofluorescence showed a hyper-fluorescent ring around the fovea while central optical coherence tomography was within normal limits."
    explanation: Normal central structure in children aged 2 to 8 years.
- phase: Childhood
  age_range: Early childhood to adolescence
  notes: >-
    Peripheral mottling evolves to bone spicules with arteriolar attenuation
    and a perifoveal hyperautofluorescent ring; rod function is already
    unrecordable while depressed and delayed cone responses persist.
  evidence:
  - reference: PMID:25342276
    reference_title: "A TULP1 founder mutation, p.Gln301*, underlies a recognisable congenital rod-cone dystrophy phenotype on the Arabian Peninsula."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rod function was non-recordable while cone function was present (albeit depressed and delayed); however, repeat electroretinogram years later in two children revealed loss of recordable cone function."
    explanation: Residual cone function in childhood, lost on repeat testing.
- phase: Later childhood and adulthood
  age_range: Adolescence onwards
  notes: >-
    Recordable cone ERG is lost, the maculopathy and peripheral pigmentary
    retinopathy are established, the visual field is reduced to peripheral
    islands, and acuity declines by a modelled mean of 0.027 logMAR per year.
  evidence:
  - reference: PMID:10440267
    reference_title: "Tubby-like protein 1 homozygous splice-site mutation causes early-onset severe retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Younger patients had a relatively wide extent of kinetic visual fields; older patients had only peripheral islands."
    explanation: Field loss with age.
  - reference: PMID:36128853
    reference_title: "Natural history and biomarkers of retinal dystrophy caused by the biallelic TULP1 variant c.148delG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Modelling of the BCVA data suggested a mean annual loss of logMAR 0.027."
    explanation: The modelled rate of acuity loss.
animal_models:
- name: Tulp1 knockout mouse
  species: Mouse
  genotype: Tulp1 null (targeted disruption), homozygous
  publication: PMID:10607826
  description: >-
    Targeted Tulp1-null mice develop early-onset, rapid rod and cone
    degeneration with opsin mislocalization, extracellular rhodopsin-laden
    vesicles, ribbon synapse defects and an active IRE1 unfolded protein
    response, but normal hearing and body weight, unlike tubby mice. The
    rate of photoreceptor loss depends on genetic background: a protective
    Mtap1a allele reduces it.
  evidence:
  - reference: PMID:22323461
    reference_title: "An allele of microtubule-associated protein 1A (Mtap1a) reduces photoreceptor degeneration in Tulp1 and Tub Mutant Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The protective Mtap1a(129P2/OlaHsd) allele was shown to reduce photoreceptor loss in both Tulp1(tm1Pjn/tm1Pjn) and Tub(tub/tub) mice."
    explanation: A background modifier of degeneration rate.
  - reference: PMID:10607826
    reference_title: "Retinal degeneration but not obesity is observed in null mutants of the tubby-like protein 1 gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, in contrast to tubby mice, Tulp1 (-/-)mice exhibited normal hearing ability and, surprisingly, normal body weight"
    explanation: The knockout phenotype is confined to the retina.
  modeled_mechanisms:
  - target: Rod and Cone Opsin Mistrafficking
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Rod and cone opsins are mislocalized before degeneration.
    evidence:
    - reference: PMID:10549638
      reference_title: "Retinal degeneration in tulp1-/- mice: vesicular accumulation in the interphotoreceptor matrix."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At the early stage of degeneration, rod and cone opsins, but not peripherin/RDS, exhibited prominent ectopic localization."
      explanation: Opsin mislocalization in the knockout.
  - target: Rod Photoreceptor Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Rapid early-onset photoreceptor loss.
    limitations: >-
      Mouse degeneration is faster and cone involvement more uniform than in
      patients, who retain a central foveal cone island; the mouse has no
      fovea.
    evidence:
    - reference: PMID:10607826
      reference_title: "Retinal degeneration but not obesity is observed in null mutants of the tubby-like protein 1 gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tulp1 (-/-)mice exhibit an early-onset retinal degeneration with a progressive, rapid loss of photoreceptors"
      explanation: Rapid photoreceptor loss.
  - target: Photoreceptor Synaptic Ribbon Malformation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Ribbon synapse defects before degeneration; not yet examined in patients.
    evidence:
    - reference: PMID:19218615
      reference_title: "Early synaptic defects in tulp1-/- mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Photoreceptor synapses and bipolar cell dendrites in tulp1(-/-) mice display abnormal structure and function."
      explanation: Synaptic structure and function are abnormal.
- name: Tulp1 F492L and D89Y knock-in mice
  species: Mouse
  genotype: Tulp1 F492L or D89Y, homozygous knock-in of orthologs of human missense alleles
  publication: PMID:41493298
  description: >-
    Two knock-in lines carrying orthologs of human homozygous missense alleles.
    F492L, in the tubby domain, reproduces the null phenotype; D89Y, outside the
    tubby domain, keeps normal retinal morphology and function to 12 months.
  evidence:
  - reference: PMID:41493298
    reference_title: "TULP1 missense mutations cause variable retinal phenotypes and activation of the endoplasmic reticulum unfolded protein response pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, these abnormalities were not seen in the Tulp1D89Y model; indeed, retinal morphology and function was preserved up to 12 months"
    explanation: Allele-dependent severity in knock-in mice.
  modeled_mechanisms:
  - target: Photoreceptor Endoplasmic Reticulum Unfolded Protein Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: IRE1 activation in the F492L retina.
    evidence:
    - reference: PMID:41493298
      reference_title: "TULP1 missense mutations cause variable retinal phenotypes and activation of the endoplasmic reticulum unfolded protein response pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we observed activation of the IRE1 branch of the endoplasmic reticulum (ER)-unfolded protein response (UPR) complex in Tulp1-/- and Tulp1F492L retinas"
      explanation: UPR activation in vivo.
- name: tulp1a/tulp1b double knockout zebrafish
  species: Zebrafish
  genotype: tulp1a and tulp1b null, homozygous
  publication: PMID:36396940
  description: >-
    Zebrafish have two TULP1 paralogs; tulp1a loss affects UV cones and tulp1b
    loss affects rods. The double knockout mislocalizes opsins in all
    photoreceptor types, shortens photoreceptor cilia and degenerates very
    early, with changes suggestive of ferroptosis.
  evidence:
  - reference: PMID:36396940
    reference_title: "Tulp1 deficiency causes early-onset retinal degeneration through affecting ciliogenesis and activating ferroptosis in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "knockout of tulp1b resulted in mislocalization of rod opsins and rod-cone degeneration"
    explanation: The rod paralog phenotype.
  modeled_mechanisms:
  - target: Rod and Cone Opsin Mistrafficking
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Opsin mislocalization in all photoreceptor types.
    evidence:
    - reference: PMID:36396940
      reference_title: "Tulp1 deficiency causes early-onset retinal degeneration through affecting ciliogenesis and activating ferroptosis in zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the tulp1-dKO zebrafish, mislocalization of opsins was present in all types of photoreceptors, and severe degeneration was observed at a very early age, mimicking the clinical manifestations of TULP1 patients."
      explanation: Conserved opsin defect.
references:
- reference: PMID:30285347
  title: "Nonsyndromic Leber Congenital Amaurosis / Early-Onset Severe Retinal Dystrophy Overview."
  tags:
  - GeneReviews
- reference: PMID:20301590
  title: "Nonsyndromic Retinitis Pigmentosa Overview."
  tags:
  - GeneReviews
discussions:
- discussion_id: tulp1_function_before_structure
  prompt: >-
    Why is photoreceptor function lost earlier and more completely than
    photoreceptor structure in TULP1 retinopathy, and which TULP1-dependent
    defect is responsible?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Photoreceptor Dysfunction Preceding Structural Loss
  - pathophysiology#Guanylate Cyclase Carrier Pathway Mislocalization
  - pathophysiology#Rod and Cone Opsin Mistrafficking
  - pathophysiology#Photoreceptor Synaptic Ribbon Malformation
  - phenotypes#Undetectable light- and dark-adapted electroretinogram
  rationale: >-
    Patients have no measurable rod function at any age and undetectable
    ERGs while central OCT is still normal, and their surviving foveal cones
    are less sensitive than their laminar thickness predicts, a dissociation
    Jacobson and colleagues did not see in four ciliopathy genotypes. The mouse
    offers three candidate causes, each shown only in Tulp1-null retina:
    misrouted opsin, mislocalized guanylate cyclase and GCAPs in the outer
    segment, and a malformed ribbon synapse with reduced endocytosis. The
    edges from these nodes to the dysfunction node are therefore marked as
    having unknown intermediates. Which one dominates decides what a therapy
    must restore and how residual cones should be read as a trial outcome:
    an outer segment cascade defect would reduce the photoreceptor-derived
    response itself, whereas a synaptic defect would leave it and impair
    transmission downstream.
  proposed_experiments:
  - experiment_id: exp_tulp1_organoid_compartment_function
    name: Compartment-resolved function in TULP1 patient retinal organoids
    experiment_design: TARGETED_PERTURBATION
    description: >-
      Differentiate retinal organoids from iPSCs of patients with biallelic
      truncating TULP1 alleles and from isogenic corrected lines. Before any
      photoreceptor loss, measure rhodopsin and GUCY2D localization by
      immunostaining, outer segment cGMP and light-evoked photocurrent by
      suction electrode or multielectrode array, and ribbon number and
      synaptic vesicle endocytosis (FM dye uptake) at the terminals.
    supporting_outcome:
    - >-
      Reduced photocurrent with mislocalized opsin and cyclase but intact
      ribbons would place the primary dysfunction in the outer segment
      carrier pathways.
    refuting_outcome:
    - >-
      Normal photocurrent with reduced terminal endocytosis would place it at
      the synapse and refute an outer segment cascade explanation.
  evidence:
  - reference: PMID:25074776
    reference_title: "TULP1 mutations causing early-onset retinal degeneration: preserved but insensitive macular cones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cones are less sensitive than expected from the residual structure."
    explanation: The structure-function dissociation in patients.
  - reference: PMID:21867699
    reference_title: "Immunocytochemical evidence of Tulp1-dependent outer segment protein transport pathways in photoreceptor cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The exact role of Tulp1 in outer segment protein transport remains elusive."
    explanation: The transport mechanism itself is unresolved.
- discussion_id: tulp1_mouse_model_mismatch
  prompt: >-
    How far do Tulp1 mouse models predict human TULP1 retinopathy, given the
    absent fovea, uniform early cone loss, allele-dependent knock-in severity
    and the failure of photoreceptor gene supplementation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Tulp1 knockout mouse
  - animal_models#Tulp1 F492L and D89Y knock-in mice
  - pathophysiology#Cone Photoreceptor Degeneration
  - treatments#TULP1 Gene Supplementation (preclinical)
  rationale: >-
    Tulp1-null mice reproduce opsin mistrafficking and early rod and cone
    degeneration, but they have no fovea, so the residual foveal cone island
    that patients keep through childhood, and that any human trial would
    target, has no counterpart. Cone involvement in the mouse is early and
    uniform. The D89Y knock-in, an ortholog of a homozygous human allele, has
    normal retinal morphology and function to 12 months, so at least one
    disease allele does not reproduce disease in mice. Photoreceptor-targeted
    AAV supplementation restored Tulp1 to wild-type levels without
    preserving the outer nuclear layer; the authors' explanations include
    non-photoreceptor expression and the speed of mouse degeneration, neither
    of which can be judged in humans from mouse data alone. Unlike tubby
    mice, Tulp1-null mice are not obese or deaf, which matches the
    non-syndromic human disease.
  proposed_experiments:
  - experiment_id: exp_tulp1_cross_species_rescue
    name: Gene supplementation in patient organoids and a cone-rich model
    experiment_design: TARGETED_PERTURBATION
    description: >-
      Deliver human TULP1 by AAV under photoreceptor and pan-retinal
      promoters to TULP1-null patient retinal organoids and to a cone-rich or
      large-animal TULP1 model, and compare photoreceptor survival, opsin
      localization and light responses between the two promoter designs.
    supporting_outcome:
    - >-
      Rescue with the pan-retinal but not the photoreceptor promoter would
      support a non-photoreceptor requirement and explain the mouse result.
    refuting_outcome:
    - >-
      Robust rescue with the photoreceptor promoter in human tissue would
      indicate the mouse failure reflects mouse-specific timing.
  evidence:
  - reference: PMID:41493298
    reference_title: "TULP1 missense mutations cause variable retinal phenotypes and activation of the endoplasmic reticulum unfolded protein response pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, these abnormalities were not seen in the Tulp1D89Y model; indeed, retinal morphology and function was preserved up to 12 months"
    explanation: A disease allele that fails to cause disease in mice.
  - reference: PMID:32973439
    reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There was a small and transient electroretinography benefit in the treated retinas at 4 weeks of age (not observed by 6 weeks) when using 3.7E8 vg dose."
    explanation: Gene supplementation gives only a transient benefit in mice.
  - reference: PMID:25074776
    reference_title: "TULP1 mutations causing early-onset retinal degeneration: preserved but insensitive macular cones."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Small central islands showed melanized retinal pigment epithelium by autofluorescence imaging and well-preserved photoreceptor laminar thickness by OCT imaging."
    explanation: The foveal island that mice cannot model.
- discussion_id: tulp1_lca15_rp14_spectrum
  prompt: >-
    Are LCA15 and RP14 points on one TULP1 severity continuum, and what
    determines where a patient falls on it?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - has_subtypes#LCA15
  - has_subtypes#RP14
  - genetic#TULP1
  rationale: >-
    This entry treats the two labels as presentations of one disease, as
    ClinGen does. The strongest support is within-family: one Algerian family
    homozygous for a single in-frame duplication contains both LCA and
    early-onset retinal degeneration, which the authors attribute to disease
    progression or modifier alleles. The largest cohort (17 patients) spans
    LCA, early-onset RP, adult-onset RP, cone dystrophy and cone-rod
    dystrophy, and individual missense alleles give cone-dominated disease or
    an isolated bull's eye maculopathy. Truncating alleles cluster at the
    severe end, with similar visual loss across them, and in mice a missense
    allele outside the tubby domain is far milder than one inside it. Whether
    allele class, tubby-domain position, modifier genes (Mtap1a modifies the
    mouse) or simply age at examination explains the labels is not settled.
  proposed_experiments:
  - experiment_id: exp_tulp1_genotype_phenotype_registry
    name: Pooled natural-history analysis by allele class
    experiment_design: HUMAN_OBSERVATIONAL
    description: >-
      Pool published and registry TULP1 patients with ages at onset, ERG,
      acuity and foveal ellipsoid zone width, classify each genotype as
      biallelic truncating, truncating plus missense, or biallelic missense
      (tubby domain or not), and model onset and progression rate against
      allele class while adjusting for age.
    supporting_outcome:
    - >-
      Allele class predicts onset and progression, with LCA confined largely
      to biallelic truncating genotypes.
    refuting_outcome:
    - >-
      Within-genotype spread as wide as between-genotype spread, pointing to
      modifiers or ascertainment rather than allele class.
  evidence:
  - reference: PMID:17962469
    reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed intrafamilial phenotypic variability could be attributed to disease progression or possibly modifier alleles."
    explanation: One allele, two labels, in one family.
  - reference: PMID:36769033
    reference_title: "Biallelic Variants in TULP1 Are Associated with Heterogeneous Phenotypes of Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most of the patients exhibited rod-driven disease, yet a fraction of the patients exhibited cone-driven disease."
    explanation: Spectrum within the largest cohort.
  - reference: PMID:23499059
    reference_title: "Maternal uniparental isodisomy of chromosome 6 reveals a TULP1 mutation as a novel cause of cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This expands the disease spectrum of TULP1 mutations from Leber congenital amaurosis and early-onset retinitis pigmentosa to cone-dominated disease."
    explanation: Cone-dominated disease from a missense allele.
  - reference: PMID:41912321
    reference_title: "Isolated bull's eye maculopathy in two siblings with biallelic TULP1 variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a pair of siblings with an isolated bull's eye maculopathy and no functional or anatomic generalized photoreceptor pathology."
    explanation: The mild end of the spectrum.
  - reference: PMID:34865612
    reference_title: "TULP1 related retinal dystrophy: report of rare and novel variants with a previously undescribed phenotype in two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 4 year-old and a 19 year-old female presented with reduced vision and bilateral bull's eye maculopathy."
    explanation: >-
      Two patients 15 years apart in age with the same presentation, which
      bears on whether the labels track age at examination.
  - reference: CGGV:assertion_ecc6101d-f936-48a2-b2f1-34bfd785542d-2025-06-05T160000.000Z
    reference_title: "TULP1 / Leber congenital amaurosis 15 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therefore, these cases have been lumped for the purposes of gene curation into a single disease entity, referred to as TULP1 -related retinopathy."
    explanation: ClinGen's lumping decision, followed by this entry.
- discussion_id: tulp1_missense_er_retention
  prompt: >-
    Do TULP1 missense proteins misfold and accumulate in the endoplasmic
    reticulum in photoreceptors, and what triggers the unfolded protein
    response in null retina?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Misfolded Missense TULP1 Retained in the Endoplasmic Reticulum
  - pathophysiology#Photoreceptor Endoplasmic Reticulum Unfolded Protein Response
  rationale: >-
    Transfected tubby-domain missense proteins colocalize with the ER and
    activate PERK, IRE1 and CHOP, and modelling predicts their
    destabilization. Two findings cut against ER retention as the in vivo
    mechanism: in F492L knock-in retina the mutant protein's level and
    distribution match wild type, and the P388S protein is unstable without
    ER stress. Yet IRE1 is active in both F492L and Tulp1-null retina, so the
    UPR does not need a misfolded TULP1 protein at all; misrouted opsin
    accumulating in inner segment membranes is a plausible but untested
    trigger. The ER-retention node is therefore provisional, and the null
    path to the UPR is drawn with unknown intermediates.
  proposed_experiments:
  - experiment_id: exp_tulp1_upr_source
    name: Separate ER retention from secondary UPR in vivo
    experiment_design: TARGETED_PERTURBATION
    description: >-
      In Tulp1-null, F492L and wild-type retinas at ages before cell loss,
      fractionate photoreceptor ER and measure mutant TULP1 and rhodopsin
      content, BiP association and IRE1 and PERK activation; test whether
      reducing rhodopsin synthesis (Rho heterozygosity) lowers UPR markers
      in null retina.
    supporting_outcome:
    - >-
      ER-resident F492L protein bound to BiP would support retention for that
      allele.
    refuting_outcome:
    - >-
      UPR that falls with reduced rhodopsin load in null retina would show
      the UPR is secondary to opsin misrouting rather than to misfolded
      TULP1.
  evidence:
  - reference: PMID:26987071
    reference_title: "Involvement of Endoplasmic Reticulum Stress in TULP1 Induced Retinal Degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These observations suggest that modulating the UPR pathways might be a strategy for therapeutic intervention."
    explanation: The therapeutic stake of the UPR mechanism.
  - reference: PMID:41493298
    reference_title: "TULP1 missense mutations cause variable retinal phenotypes and activation of the endoplasmic reticulum unfolded protein response pathway."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "In both mutant retinas, TULP1F492L and TULP1D89Y protein levels and distribution were comparable to WT."
    explanation: In vivo distribution argues against retention.
  - reference: PMID:33907372
    reference_title: "A novel homozygous missense mutation p.P388S in TULP1 causes protein instability and retinitis pigmentosa."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "These results add to the list of known mutations in TULP1 identified in individuals with RP and suggest a possible unique pathogenic mechanism in TULP1-induced RP, which may be shared among select mutations in TULP1."
    explanation: A different missense mechanism, protein instability.
- discussion_id: tulp1_ciliopathy_classification
  prompt: >-
    Should TULP1 retinopathy be modelled as a photoreceptor ciliopathy?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Rod and Cone Opsin Mistrafficking
  - pathophysiology#Loss of TULP1 Function in Photoreceptors
  rationale: >-
    TULP1 colocalizes with actin at the connecting cilium as well as the inner
    segment, its loss disturbs Rab8 and Rab11 near the cilium, and zebrafish
    double knockouts have shortened photoreceptor cilia with reduced tekt2
    expression. Against a ciliopathy reading: in human retina and mouse
    TULP1 is in the inner segment, cell body and synapse and excluded from
    the outer segment, the disease has no extraocular features, the
    synaptic defect has no ciliary explanation, and the structure-function
    relationship of residual foveal cones differs from four ciliopathy
    genotypes. The entry therefore models TULP1 as an inner segment and
    synaptic trafficking adapter and does not conform to the ciliopathy
    module; the zebrafish cilium and ferroptosis findings await mammalian
    confirmation.
  evidence:
  - reference: PMID:36396940
    reference_title: "Tulp1 deficiency causes early-onset retinal degeneration through affecting ciliogenesis and activating ferroptosis in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Photoreceptor cilium length was significantly reduced in the tulp1-dKO retinas."
    explanation: The ciliary phenotype in zebrafish.
  - reference: PMID:36396940
    reference_title: "Tulp1 deficiency causes early-onset retinal degeneration through affecting ciliogenesis and activating ferroptosis in zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In addition, ferroptosis might be activated in the tulp1-dKO zebrafish, as suggested by the up-regulation of genes related to the ferroptosis pathway"
    explanation: A death pathway suggested only in zebrafish.
  - reference: PMID:25074776
    reference_title: "TULP1 mutations causing early-onset retinal degeneration: preserved but insensitive macular cones."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with TULP1-RD, unlike the others, had greater dysfunction for the degree of foveal structural preservation."
    explanation: TULP1 patients differ from ciliopathy genotypes.
  - reference: PMID:11481257
    reference_title: "A role for the Tubby-like protein 1 in rhodopsin transport."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "TULP1 is distributed throughout the photoreceptor cytoplasm but is excluded from the outer segments and the nuclei."
    explanation: TULP1 is not an outer segment (ciliary) protein.
- discussion_id: tulp1_rpe_phagocytosis_ligand
  prompt: >-
    Does loss of TULP1 as a secreted MerTK ligand impair RPE phagocytosis of
    outer segments in TULP1 retinopathy?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of TULP1 Function in Photoreceptors
  rationale: >-
    In vitro, TULP1 is secreted by an unconventional route and binds MerTK,
    Tyro3 and Axl, bridging prey to RPE cells and stimulating phagocytosis,
    synergistically with TUB. MERTK loss itself causes retinal degeneration.
    No study has measured RPE phagocytosis in Tulp1-null or patient retina,
    so no pathophysiology node or edge is drawn for this branch.
  proposed_experiments:
  - experiment_id: exp_tulp1_rpe_phagosome_count
    name: RPE phagosome counts in Tulp1-null retina
    experiment_design: DESCRIPTIVE_PROFILING
    description: >-
      Count rhodopsin-positive phagosomes in RPE at light onset in Tulp1-null
      and wild-type mice before photoreceptor loss, and test whether
      recombinant TULP1 restores phagocytosis by Tulp1-null-conditioned RPE
      cultures.
    supporting_outcome:
    - Reduced peak phagosome load that recombinant TULP1 restores.
    refuting_outcome:
    - Normal phagosome load before degeneration.
  evidence:
  - reference: PMID:20978472
    reference_title: "Tubby and tubby-like protein 1 are new MerTK ligands for phagocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that tubby and Tulp1 are novel bridging molecules to facilitate phagocytosis through MerTK."
    explanation: The in vitro basis of the hypothesis.
- discussion_id: tulp1_therapeutic_window
  prompt: >-
    What would a TULP1 therapy need to restore, in which cells, and by what
    age?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - treatments#TULP1 Gene Supplementation (preclinical)
  - pathophysiology#Inner Retinal Neuron Alterations
  - pathophysiology#Photoreceptor Endoplasmic Reticulum Unfolded Protein Response
  - phenotypes#Photoreceptor layer loss on macular OCT
  rationale: >-
    The only gene therapy tested restored TULP1 protein in mouse
    photoreceptors but did not keep them alive. If TULP1 is needed in inner
    retinal neurons as well, photoreceptor-restricted vectors will fall short;
    if the mouse simply degenerates too fast, earlier or more efficient
    delivery may work. In patients, extrafoveal photoreceptors are lost
    progressively while a foveal island persists, and its ellipsoid zone
    width tracks acuity and age, which gives both a target and a candidate
    outcome measure. UPR modulation is proposed as a mutation-independent
    approach but has not been tested in vivo. No TULP1 clinical trial is
    registered.
  proposed_experiments:
  - experiment_id: exp_tulp1_foveal_ez_trial_readiness
    name: Prospective foveal ellipsoid zone natural history
    experiment_design: HUMAN_OBSERVATIONAL
    description: >-
      Follow genotyped TULP1 patients with serial OCT, full-field stimulus
      threshold and microperimetry to estimate the rate of foveal ellipsoid
      zone loss by age and allele class, and the age by which the island
      falls below a size usable for subretinal delivery.
    supporting_outcome:
    - >-
      A measurable, monotonic decline in foveal EZ width with low
      between-visit variance, supporting it as a trial endpoint.
    refuting_outcome:
    - >-
      EZ width that does not track function in TULP1, given the known
      structure-function dissociation, which would argue for a functional
      primary endpoint.
  evidence:
  - reference: PMID:36128853
    reference_title: "Natural history and biomarkers of retinal dystrophy caused by the biallelic TULP1 variant c.148delG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study describes the progression of TULP1 IRD suggesting a potential time window for therapeutic interventions."
    explanation: A therapeutic window inferred from natural history.
  - reference: PMID:32655363
    reference_title: "Non-photoreceptor Expression of Tulp1 May Contribute to Extensive Retinal Degeneration in Tulp1-/- Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Early and widespread expression of TULP1 and some other IRD genes in both the inner and outer retina highlights potential hurdles in the development of treatments for these IRDs."
    explanation: Non-photoreceptor expression as a hurdle for therapy.
  - reference: PMID:32973439
    reference_title: "AAV-Delivered Tulp1 Supplementation Therapy Targeting Photoreceptors Provides Minimal Benefit in Tulp1-/- Retinas."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As such, further studies are required to fine tune the Tulp1 supplementation therapy, which, in principle, should rescue the Tulp1-/- phenotype."
    explanation: The authors expect a refined vector could rescue.
- discussion_id: tulp1_inner_retina_primary
  prompt: >-
    Are the inner retinal changes in TULP1 retinopathy primary, from loss of
    TULP1 in inner retinal neurons, or secondary remodelling?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Inner Retinal Neuron Alterations
  - pathophysiology#Stunted Bipolar Cell Dendrites
  rationale: >-
    Two explanations are recorded separately. Stunted bipolar dendrites are
    attributed by their authors to the malformed photoreceptor ribbon,
    making them secondary. Separately, Tulp1 is detected in inner retinal
    cells, bipolar, amacrine and ganglion cell changes occur in Tulp1-null
    but not Rho- or Rds-null retinas, and patients have inner retinal
    thickening, which could be primary or the remodelling seen in many
    degenerations. The inner retinal node is provisional and its edge has
    unknown intermediates.
  proposed_experiments:
  - experiment_id: exp_tulp1_conditional_knockout
    name: Photoreceptor-restricted versus inner-retina-restricted Tulp1 deletion
    experiment_design: TARGETED_PERTURBATION
    description: >-
      Generate conditional Tulp1 deletions in photoreceptors only and in
      inner retinal neurons only, and compare bipolar, amacrine and ganglion
      cell morphology and photoreceptor survival with the global knockout.
    supporting_outcome:
    - Inner retinal changes after inner-retina-restricted deletion alone.
    refuting_outcome:
    - Inner retinal changes only when photoreceptors lack Tulp1.
  evidence:
  - reference: PMID:32655363
    reference_title: "Non-photoreceptor Expression of Tulp1 May Contribute to Extensive Retinal Degeneration in Tulp1-/- Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Peak expression of Tulp1 in healthy mouse retinas was detected at p8; of note, TULP1 was detected in both the outer and inner retina."
    explanation: Inner retinal Tulp1 expression in mouse.
  - reference: PMID:19218615
    reference_title: "Early synaptic defects in tulp1-/- mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A malformation of the photoreceptor synaptic ribbon is likely the cause of the dystrophy in bipolar cell dendrites."
    explanation: The secondary explanation for bipolar changes.

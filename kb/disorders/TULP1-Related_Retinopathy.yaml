    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Comparison of disease phenotypes in the single and double mutants suggests that TULP1 and Tubby are not functionally interchangeable in photoreceptors nor do they form an obligate functional complex."
    explanation: >-
      The homologous TUB protein cannot compensate for TULP1 loss.
  - reference: PMID:34360830

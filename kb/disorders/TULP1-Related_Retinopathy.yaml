    reference_title: "Novel TULP1 mutation causing leber congenital amaurosis or early onset retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Linkage analysis identified a region of homozygosity on chromosome 6, region p21.3, and mutation screening revealed a novel 6-base in-frame duplication, in the TULP1 gene."
    explanation: >-
      A homozygous TULP1 allele in a consanguineous family with Leber
      congenital amaurosis.
  - reference: PMID:25342276
    reference_title: "A TULP1 founder mutation, p.Gln301*, underlies a recognisable congenital rod-cone dystrophy phenotype on the Arabian Peninsula."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The TULP1 allele p.Gln301* represents a founder mutation on the Arabian Peninsula and is associated with a recognisable congenital recessive rod-cone dystrophy phenotype in the homozygous state."
    explanation: >-
      A homozygous nonsense founder allele causing congenital-onset disease.
  - reference: PMID:36769033
    reference_title: "Biallelic Variants in TULP1 Are Associated with Heterogeneous Phenotypes of Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen different alleles were identified, namely eight missense variants, six nonsense variants, one in-frame deletion variant, and two splice site variants."
    explanation: >-
      The allele classes seen in the largest TULP1 cohort.
  - reference: PMID:10549638
    reference_title: "Retinal degeneration in tulp1-/- mice: vesicular accumulation in the interphotoreceptor matrix."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The function of Tulp1 is required to maintain viability of rod and cone photoreceptors."
    explanation: >-
      Supports the decreased photoreceptor maintenance bound on this node, in
      both rods and cones.
  downstream:
  - target: Loss of TULP1 Function in Photoreceptors
    causal_link_type: DIRECT
  - target: Misfolded Missense TULP1 Retained in the Endoplasmic Reticulum
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26987071
      reference_title: "Involvement of Endoplasmic Reticulum Stress in TULP1 Induced Retinal Degeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we provide evidence that common missense mutations in TULP1 express as misfolded protein products that accumulate within the endoplasmic reticulum (ER) causing prolonged ER stress."
      explanation: >-
        This branch applies to missense alleles: they yield misfolded protein
        that accumulates in the ER.
- name: Loss of TULP1 Function in Photoreceptors
  biological_scale: MOLECULAR
  description: >-
    Null alleles remove TULP1 protein, and the Tulp1 knockout mouse reproduces
    early-onset rod and cone degeneration. TULP1 is a soluble, roughly 70 kDa
    cytoplasmic protein that associates with membranes, probably through
    phosphorylated phospholipids, and binds F-actin and the GTPase dynamin-1.
    It colocalizes with actin at the inner segment, connecting cilium and outer
    limiting membrane and with dynamin-1 at the synaptic terminal, which places
    it in vesicular trafficking at both ends of the cell. TUB and TULP1 do not
    substitute for one another.

    patients, cone electroretinograms are reduced and delayed in early
    childhood and lost on repeat testing years later, leaving a small central
    island of foveal cones. Because TULP1 is expressed in cones and the
    cone-expressed zebrafish paralog is needed for cone opsin targeting and cone
    survival, cone loss is treated here as at least partly primary.

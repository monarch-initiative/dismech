- name: Inner Retinal Neuron Alterations
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    TULP1 is weakly expressed in some inner nuclear layer and ganglion cells,
    and Tulp1-null retinas show bipolar, amacrine and ganglion cell changes not

  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence is published. In a survey of 179 unrelated LCA
    patients, TULP1 accounted for 1.7% of cases; TULP1 is described as a rare
    cause of both LCA/EORD and recessive RP.
  evidence:
  - reference: PMID:15024725
    reference_title: "Leber congenital amaurosis: comprehensive survey of the genetic heterogeneity, refinement of the clinical definition, and genotype-phenotype correlations as a strategy for molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GUCY2D appeared to account for most LCA cases of our series (21.2%), followed by CRB1 (10%), RPE65 (6.1%), RPGRIP1 (4.5%), AIPL1 (3.4%), TULP1 (1.7%), and CRX (0.6%)."
    explanation: TULP1 share of a large LCA series.
  - reference: PMID:9462751
    reference_title: "TULP1 mutation in two extended Dominican kindreds with autosomal recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The data indicate that impairment of TULP1 protein function is a rare cause of arRP and that the normal protein plays an essential role in the physiology of the retina."
    explanation: TULP1 is a rare cause of recessive RP.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires two pathogenic TULP1 alleles. They are homozygous in
    consanguineous families, compound heterozygous, or, in two reported
    patients, homozygous through maternal uniparental isodisomy of chromosome 6
    with only one carrier parent (recorded as a separate inheritance row,
    because the recurrence risk differs). Heterozygous carriers have normal
    visual function.
  evidence:
  - reference: PMID:10440267
    reference_title: "Tubby-like protein 1 homozygous splice-site mutation causes early-onset severe retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygotes had normal visual function."
    explanation: >-
      Carriers of the splice-site allele are unaffected, consistent with
      recessive inheritance.
  - reference: PMID:9462751
    reference_title: "TULP1 mutation in two extended Dominican kindreds with autosomal recessive retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a splice-site mutation (IVS14+1, G-->A) that is homozygous in all affected individuals (N=33) and heterozygous in all obligate carriers (N=50) from two RP14-linked kindreds."
    explanation: >-
      Homozygosity in every affected and heterozygosity in every obligate
      carrier across two large kindreds.
- name: Uniparental disomy
  inheritance_term:
    preferred_term: Uniparental disomy
    term:
      id: HP:0032382
      label: Uniparental disomy
  description: >-
    Two patients became homozygous for a TULP1 variant through maternal
    uniparental isodisomy of chromosome 6 rather than by inheriting an allele
    from each parent. Their phenotypes differ, and neither is a reason to
    expect the mechanism from the clinical picture: the c.524dupC patient had
    the usual early-onset picture (congenital nystagmus, night blindness,
    non-recordable ERG, mild myopia, mild peripheral pigmentary change), while
    the p.Arg420Ser patient had cone-dominated disease with a relatively
    preserved ERG, the case that extended the TULP1 spectrum to cone
    dysfunction. What the two share is the counselling consequence: with one
    carrier parent the recurrence risk is not the 25% of a biallelic recessive
    disease, which is why a SNP array belongs in the workup when only one
    parent carries the variant.
  evidence:
  - reference: PMID:30090012
    reference_title: "Maternal uniparental isodisomy of chromosome 6 unmasks a novel variant in TULP1 in a patient with early onset retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel homozygous variant (c.524dupC, p.(Pro176ThrfsTer7)) in TULP1 resulting from maternal uniparental isodisomy of chromosome 6."
    explanation: Homozygosity without biparental transmission.
  - reference: PMID:30090012
    reference_title: "Maternal uniparental isodisomy of chromosome 6 unmasks a novel variant in TULP1 in a patient with early onset retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular diagnosis of inherited retinal dystrophies is essential to inform the mode of transmission and clinical management, and to identify potential candidates for future gene-specific therapies."
    explanation: >-
      The counselling consequence: the mode of transmission is not inferable
      from the homozygous genotype alone.
  - reference: PMID:23499059
    reference_title: "Maternal uniparental isodisomy of chromosome 6 reveals a TULP1 mutation as a novel cause of cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 1 patient, homozygosity mapping and subsequent segregation analysis revealed maternal uniparental disomy (UPD) of chromosome 6."
    explanation: An independent patient homozygous through the same mechanism.
  - reference: PMID:30090012
    reference_title: "Maternal uniparental isodisomy of chromosome 6 unmasks a novel variant in TULP1 in a patient with early onset retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had clinical features consistent with biallelic pathogenic variants in TULP1, including congenital nystagmus, night blindness, non-recordable electroretinogram, mild myopia, and mild peripheral pigmentary changes in the fundus."
    explanation: >-
      The phenotype of the isodisomy patient in this report, which is the usual
      early-onset TULP1 picture.
  - reference: PMID:23499059
    reference_title: "Maternal uniparental isodisomy of chromosome 6 reveals a TULP1 mutation as a novel cause of cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first patient had progressive loss of visual acuity with a relatively preserved ERG, whereas the second patient developed loss of visual acuity, peripheral degeneration, and severely reduced ERG responses in a cone-rod pattern."
    explanation: >-
      The isodisomy patient is the first of this report's two; unlike the other
      report's patient, this one had a relatively preserved ERG, so the
      isodisomy mechanism carries no characteristic phenotype.
  - reference: PMID:23499059
    reference_title: "Maternal uniparental isodisomy of chromosome 6 reveals a TULP1 mutation as a novel cause of cone dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This expands the disease spectrum of TULP1 mutations from Leber congenital amaurosis and early-onset retinitis pigmentosa to cone-dominated disease."
    explanation: >-
      The same patient is the one that extended the TULP1 spectrum to
      cone-dominated disease.
pathophysiology:
- name: Biallelic Pathogenic TULP1 Variants
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  biological_scale: MOLECULAR
  description: >-
    Two pathogenic TULP1 alleles in trans or in homozygosity. Allele classes
    include nonsense and frameshift variants (the Arabian p.Gln301Ter and the
    Finnish c.148delG founder alleles), canonical splice-site variants that
    produce frameshifted transcripts, a small in-frame duplication, and missense
    variants that cluster in the conserved C-terminal tubby domain. TULP1 is
    expressed in rod and cone photoreceptors, so the primary lesion sits in both
    cell types.

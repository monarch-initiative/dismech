- name: Astrocytic Apoptosis and Loss
  description: >-
    Astrocytes undergo apoptosis and are progressively lost from cortical and
    white matter areas of the affected hemisphere, a change specific to
    Rasmussen encephalitis and absent from other epilepsy pathologies. This node

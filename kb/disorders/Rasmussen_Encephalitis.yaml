name: Rasmussen Encephalitis
creation_date: "2026-07-18T00:00:00Z"
category: Complex
description: >-
  Rasmussen encephalitis is a rare, acquired, progressive inflammatory disorder
  that affects a single cerebral hemisphere, usually beginning in childhood.
  Unlike the genetic developmental and epileptic encephalopathies, it is an
  immune-mediated (predominantly CD8+ cytotoxic T-cell-driven) chronic
  encephalitis of unknown trigger. Progressive unihemispheric inflammation,
  microglial activation, and neuronal loss produce drug-resistant focal
  seizures - characteristically epilepsia partialis continua - together with
  progressive hemiparesis, cognitive decline, and atrophy of the affected
  hemisphere. Antiseizure medications rarely control the seizures;
  immunotherapy can slow progression, but functional hemispherectomy
  (hemispherotomy) is the only reliably seizure-terminating treatment.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- Rasmussen syndrome
- Rasmussen subacute encephalitis
- Chronic focal encephalitis

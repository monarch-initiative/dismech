- name: Unihemispheric Cortical Hyperexcitability
  description: >-
    The inflamed and injured cortex of the affected hemisphere is intensely
    hyperexcitable and prone to continuous focal discharge. This node captures
    the single concept of network hyperexcitability and conforms to the shared
    epilepsy final common pathway.

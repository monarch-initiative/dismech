      snippet: "Astrocytes in these tissues showed major histocompatibility complex class I expression. Furthermore, granzyme-B(+) lymphocytes were found in close apposition to astrocytes bordering astrocyte-deficient lesions."
      explanation: >-
        PARTIAL: the study establishes both ends of this edge in the same

pathophysiology:
- name: Immune Trigger and Adaptive Immune Activation
  description: >-
    An unknown trigger initiates an adaptive immune response directed at one
    cerebral hemisphere. The inciting antigen is not established, but the
    downstream process is a cell-mediated (T-cell) attack. This node captures
    the single concept of the initiating immune activation.
  role: trigger
  evidence:
  - reference: PMID:24457189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rasmussen's encephalitis is probably driven by a T-cell response to one or more antigenic epitopes"
    explanation: >-
      The disorder is thought to be driven by a T-cell response to antigenic
      epitopes, with the inciting trigger not fully defined.
  downstream:
  - target: CD8+ Cytotoxic T-Cell Brain Infiltration
    causal_link_type: DIRECT
    description: >-
      Immune activation drives cytotoxic T-cell infiltration of the affected
      hemisphere.
- name: CD8+ Cytotoxic T-Cell Brain Infiltration
  description: >-
    CD8+ cytotoxic T lymphocytes infiltrate the cortex of a single hemisphere
    and attack neurons and astrocytes, the central immunopathological lesion of
    Rasmussen encephalitis. This node captures the single concept of the
    T-cell-mediated attack.
  role: mediator
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:11891826
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocytic infiltrates that consisted mainly of CD3(+)CD8(+) T cells"
    explanation: >-
      Immunohistochemistry showed the lymphocytic infiltrate is mainly CD8+
      cytotoxic T cells, with granzyme-B polarized toward MHC-I+ neurons.
  downstream:
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: DIRECT
    description: >-
      T-cell attack activates microglia and sustains neuroinflammation.
- name: Microglial Activation and Neuroinflammation
  description: >-
    Activated microglia form microglial nodules and, with the T-cell
    infiltrate, sustain chronic neuroinflammation in the affected hemisphere.
    This node captures the single concept of the innate/neuroinflammatory
    amplification.
  role: mediator
  cell_types:
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Progressive Unihemispheric Neuronal Loss and Gliosis
    causal_link_type: DIRECT
    description: >-
      Sustained cytotoxic inflammation destroys neurons and drives astrogliosis.
- name: Progressive Unihemispheric Neuronal Loss and Gliosis
  description: >-
    Chronic cytotoxic inflammation causes progressive neuronal loss and reactive
    astrogliosis confined to one hemisphere, producing the characteristic
    progressive unilateral hemispheric atrophy. This node captures the single
    concept of the resulting tissue destruction.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:11891826
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a T-cell-mediated cytotoxic reaction induces neuronal death in Rasmussen's encephalitis"
    explanation: >-
      Cytotoxic T cells directly induce neuronal death, driving the progressive
      hemispheric destruction.
  - reference: PMID:11891826
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unihemispheric lymphocytic infiltrates, microglial nodules, and neuronal loss leading to the destruction of the affected hemisphere"
    explanation: >-
      The neuropathology is unihemispheric inflammation with neuronal loss and
      progressive hemispheric destruction.
  downstream:
  - target: Unihemispheric Cortical Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The inflamed, injured cortex becomes epileptogenic and hyperexcitable.
  - target: Progressive Neurological Decline
    causal_link_type: DIRECT
    description: >-
      Progressive hemispheric destruction produces hemiparesis and cognitive
      decline.
- name: Unihemispheric Cortical Hyperexcitability
  description: >-
    The inflamed and injured cortex of the affected hemisphere is intensely
    hyperexcitable and prone to continuous focal discharge. This node captures
    the single concept of network hyperexcitability and conforms to the shared
    epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Drug-Resistant Focal Seizures and Epilepsia Partialis Continua
    causal_link_type: DIRECT
    description: >-
      Cortical hyperexcitability generates continuous, drug-resistant focal
      seizures.
- name: Drug-Resistant Focal Seizures and Epilepsia Partialis Continua
  description: >-
    The clinical hallmark is drug-resistant focal seizures, characteristically
    epilepsia partialis continua (continuous focal motor seizures). This node
    captures the single concept of the seizure endpoint and conforms to the
    shared epilepsy final common pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
- name: Progressive Neurological Decline
  description: >-
    Progressive hemiparesis (contralateral to the affected hemisphere), cognitive
    decline, and, when the dominant hemisphere is involved, language impairment
    result from the ongoing hemispheric destruction. This node captures the
    single concept of the neurological deterioration.
  role: effector
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
phenotypes:
- name: Epilepsia Partialis Continua
  description: >-
    Continuous focal motor seizures (epilepsia partialis continua) are the
    characteristic seizure manifestation.
  phenotype_term:
    preferred_term: Epilepsia partialis continua
    term:
      id: HP:0012847
      label: Epilepsia partialis continua
- name: Drug-Resistant Focal Seizures
  description: >-
    Focal-onset seizures that are typically refractory to antiseizure
    medication.
  phenotype_term:
    preferred_term: Focal-onset seizure
    term:
      id: HP:0007359
      label: Focal-onset seizure
  evidence:
  - reference: PMID:24457189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterised by unilateral inflammation of the cerebral cortex, drug-resistant epilepsy, and progressive neurological and cognitive deterioration"
    explanation: >-
      The review defines the triad of unilateral cortical inflammation,
      drug-resistant epilepsy, and progressive neurological/cognitive decline.
- name: Progressive Hemiparesis
  description: >-
    Progressive hemiparesis contralateral to the affected hemisphere develops as
    the disease advances.
  phenotype_term:
    preferred_term: Hemiparesis
    term:
      id: HP:0001269
      label: Hemiparesis
- name: Progressive Cognitive Decline
  description: >-
    Progressive cognitive decline and encephalopathy accompany disease
    progression.
  phenotype_term:
    preferred_term: Progressive encephalopathy
    term:
      id: HP:0002448
      label: Progressive encephalopathy
- name: Unilateral Cerebral Atrophy
  description: >-
    Progressive atrophy of the affected cerebral hemisphere is seen on imaging.
  phenotype_term:
    preferred_term: Cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
prevalence:
- population: Children (worldwide)
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Rasmussen encephalitis is a rare, sporadic disorder of childhood, with
    population estimates on the order of only a few cases per ten million
    children; a precise, well-established rate is not available. Onset is
    typically in mid-childhood.
treatments:
- name: Functional Hemispherectomy (Hemispherotomy)
  description: >-
    Functional hemispherectomy/hemispherotomy - surgically disconnecting the
    affected hemisphere - is the only reliably seizure-terminating treatment and
    is the definitive therapy for drug-resistant Rasmussen encephalitis, at the
    cost of a fixed contralateral hemiparesis and (for the dominant hemisphere)
    language considerations.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:24457189
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral hemispherectomy remains the only cure for seizures"
    explanation: >-
      Hemispherectomy is the only reliably curative treatment for the seizures,
      at the cost of fixed functional deficits.
- name: Immunotherapy
  description: >-
    Immunomodulatory therapy (corticosteroids, intravenous immunoglobulin, and
    agents such as tacrolimus or rituximab) can slow inflammatory progression
    and is used particularly early or to delay surgery, but does not reliably
    stop seizures.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Antiseizure Medication
  description: >-
    Antiseizure medications are used but rarely control the seizures, especially
    epilepsia partialis continua.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

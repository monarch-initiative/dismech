prevalence:
- population: Children and adolescents up to age 18 (Germany, nationwide)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.024
  notes: >-
    Countrywide German ascertainment over 6.3 years estimated the incidence of
    diagnosed Rasmussen encephalitis at 2.4 cases per 10 million people aged
    18 years or under per year (0.024 per 100,000 per year). Rasmussen
    encephalitis is a rare, sporadic disorder with onset typically in
    mid-childhood; no well-established worldwide prevalence figure exists.
  evidence:
  - reference: PMID:23216622
    reference_title: "Rasmussen encephalitis: incidence and course under randomized therapy with tacrolimus or intravenous immunoglobulins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The countrywide incidence rate of diagnosed RE is estimated as 2.4 cases/10⁷ people ≤ age 18/year."
    explanation: >-
      Germany-wide prospective ascertainment provides the incidence estimate of
      2.4 cases per 10 million people aged 18 or under per year.
treatments:
- name: Functional Hemispherectomy (Hemispherotomy)
  description: >-
    Functional hemispherectomy/hemispherotomy - surgically disconnecting the
    affected hemisphere - is the only reliably seizure-terminating treatment and
    is the definitive therapy for drug-resistant Rasmussen encephalitis, at the
    cost of a fixed contralateral hemiparesis and (for the dominant hemisphere)
    language considerations.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: MAXO:0000004
      label: surgical procedure
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral hemispherectomy remains the only cure for seizures"
    explanation: >-
      Hemispherectomy is the only reliably curative treatment for the seizures,
      at the cost of fixed functional deficits.
  - reference: PMID:24815913
    reference_title: "Hemispherotomy in Rasmussen encephalitis: long-term outcome in an Italian series of 16 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All but three patients were seizure-free at latest follow-up."
    explanation: >-
      Long-term follow-up (median 9.5 years) after hemispherotomy in 16 patients
      showed seizure freedom in 13 of 16, supporting disconnective surgery as
      definitive seizure-terminating therapy.
  - reference: PMID:37992429
    reference_title: "The Important Role of Hemispherotomy for Rasmussen Encephalitis: Clinical and Functional Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the last follow-up, 68% of patients were seizure free, and 70% were classified as Engel Class I or II."
    explanation: >-
      A 44-patient pediatric hemispheric surgery series confirms high rates of
      seizure freedom, with preoperative functional status largely preserved.
- name: Immunotherapy
  description: >-
    Immunomodulatory therapy (corticosteroids, intravenous immunoglobulin, and
    agents such as tacrolimus or rituximab) can slow inflammatory progression
    and is used particularly early or to delay surgery, but does not reliably
    stop seizures.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:23216622
    reference_title: "Rasmussen encephalitis: incidence and course under randomized therapy with tacrolimus or intravenous immunoglobulins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with tacrolimus or IVIG may slow down tissue and function loss and prevent development of intractable epilepsy."
    explanation: >-
      The only randomized prospective treatment trial in Rasmussen encephalitis
      found that tacrolimus or IVIG may slow tissue and function loss relative
      to historical untreated controls.
  - reference: PMID:23216622
    reference_title: "Rasmussen encephalitis: incidence and course under randomized therapy with tacrolimus or intravenous immunoglobulins."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No patient with refractory epilepsy became treatment-responsive under immunotherapy."
    explanation: >-
      Immunotherapy did not restore seizure control in patients who had already
      developed refractory epilepsy, supporting the caveat that it does not
      reliably stop seizures.
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunomodulatory treatments seem to slow rather than halt disease progression in Rasmussen's encephalitis, without changing the eventual outcome."
    explanation: >-
      Immunomodulation slows but does not halt progression, framing its role as
      adjunctive/delaying rather than curative.
- name: Antiseizure Medication
  description: >-
    Antiseizure medications are used but rarely control the seizures, especially
    epilepsia partialis continua.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:

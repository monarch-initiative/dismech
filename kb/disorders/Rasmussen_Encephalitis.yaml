    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In pathophysiological terms, EPC seems to represent an oscillation of excitation and inhibition in a feedback loop whose mechanisms are still poorly understood."
    explanation: >-
      The hallmark seizure type of Rasmussen encephalitis is understood as a
      disturbance of the balance between cortical excitation and inhibition,
      which is the excitation-inhibition-imbalance concept this node conforms
      to. The review also notes that the mechanism remains incompletely
      understood.
  - reference: PMID:36939721
    reference_title: "Epilepsia partialis continua and unilateral cortical-subcortical FLAIR-hyperintense lesion in Rasmussen's encephalitis: Is it diagnostic?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up MRI, within 3 weeks to 6 months of the onset of EPC (mean 1.6 months) showed paramedian frontal HI with limb EPC in six patients."
    explanation: >-
      The topography of the inflamed hyperintense cortex matches the somatotopy
      of the continuous focal motor seizures, indicating that the affected
      cortex itself is the hyperexcitable seizure generator.

prevalence:
- population: Children (worldwide)
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Rasmussen encephalitis is a rare, sporadic disorder of childhood, with
    population estimates on the order of only a few cases per ten million
    children; a precise, well-established rate is not available. Onset is
    typically in mid-childhood.
  evidence:
  - reference: PMID:15689357
    reference_title: "Pathogenesis, diagnosis and treatment of Rasmussen encephalitis: a European consensus statement."
    supports: SUPPORT

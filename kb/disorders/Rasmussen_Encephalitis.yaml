- accession: geo:GSE213364
  title: Molecular and spatial heterogeneity of microglia in Rasmussen encephalitis
  description: Rasmussen encephalitis (RE) is a rare childhood neurological disease characterized by progressive unilateral loss of function, hemispheric atrophy and drug-resistant epilepsy. Affected brain tissue shows signs of infiltrating cytotoxic T-cells, microglial activation, and neuronal death, implicating an inflammatory disease process. Recent studies have identified molecular correlates of inflammation in RE, but cell-type-specific mechanisms remain unclear. We used single-nucleus RNA-sequencing (snRNA-seq) to assess gene expression across multiple cell types in brain tissue resected from two children with RE.

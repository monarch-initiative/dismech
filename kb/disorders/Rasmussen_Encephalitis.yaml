discussions:
- discussion_id: re-unknown-antigenic-trigger
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Immune Trigger and Adaptive Immune Activation"
  prompt: >-
    Rasmussen encephalitis is driven by a T-cell response, but the inciting
    antigen (and whether an infection or a specific autoantigen initiates it)
    is unknown. Is there a definable target antigen or trigger, and would
    identifying it enable antigen-specific immunotherapy instead of broad
    immunosuppression or hemispherectomy?
  rationale: >-
    The absence of a known antigen is the central gap blocking targeted,
    hemisphere-sparing therapy; the immune attack is well characterized
    downstream, but its origin is not.
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rasmussen's encephalitis is probably driven by a T-cell response to one or more antigenic epitopes, with potential additional contribution by autoantibodies."
    explanation: >-
      The target epitope(s) remain unspecified ("one or more antigenic
      epitopes"), documenting the open antigen-identity gap.
  - reference: PMID:37992429

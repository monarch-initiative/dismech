treatments:
- name: Functional Hemispherectomy (Hemispherotomy)
  description: >-
    Functional hemispherectomy/hemispherotomy - surgically disconnecting the
    affected hemisphere - is the only reliably seizure-terminating treatment and
    is the definitive therapy for drug-resistant Rasmussen encephalitis, at the
    cost of a fixed contralateral hemiparesis and (for the dominant hemisphere)
    language considerations.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral hemispherectomy remains the only cure for seizures"
    explanation: >-
      Hemispherectomy is the only reliably curative treatment for the seizures,
      at the cost of fixed functional deficits.
  - reference: PMID:33294146
    reference_title: "Rasmussen's encephalitis: mechanisms update and potential therapy target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most effective way to limit the influence of seizures currently is cerebral hemispherectomy"
    explanation: >-
      Independent review confirms hemispherectomy as the most effective
      seizure-limiting intervention.
- name: Immunotherapy
  description: >-
    Immunomodulatory therapy (corticosteroids, intravenous immunoglobulin, and
    agents such as tacrolimus or rituximab) can slow inflammatory progression
    and is used particularly early or to delay surgery, but does not reliably
    stop seizures.

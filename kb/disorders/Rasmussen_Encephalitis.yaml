discussions:
- discussion_id: re-unknown-antigenic-trigger
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Immune Trigger and Adaptive Immune Activation"
  prompt: >-
    Rasmussen encephalitis is driven by a T-cell response, but the inciting
    antigen (and whether an infection or a specific autoantigen initiates it)
    is unknown. Is there a definable target antigen or trigger, and would
    identifying it enable antigen-specific immunotherapy instead of broad
    immunosuppression or hemispherectomy?
  rationale: >-
    The absence of a known antigen is the central gap blocking targeted,
    hemisphere-sparing therapy; the immune attack is well characterized
    downstream, but its origin is not.
  proposed_experiments:
  - experiment_id: re-antigen-discovery
    name: Target-antigen discovery study
    description: >-
      Use T-cell receptor repertoire sequencing and antigen-screening of
      resected brain and blood from Rasmussen patients to search for a shared
      target antigen or trigger driving the clonal T-cell response.
    readouts:
    - name: Shared TCR clonotypes and candidate target antigens
      target: "pathophysiology#Immune Trigger and Adaptive Immune Activation"
    would_support:
    - "pathophysiology#Immune Trigger and Adaptive Immune Activation"
- discussion_id: re-immunotherapy-vs-surgery-timing
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Progressive Neurological Decline"
  - "pathophysiology#Drug-Resistant Focal Seizures and Epilepsia Partialis Continua"
  prompt: >-
    Immunotherapy can slow inflammatory progression but rarely stops the
    seizures, whereas hemispherectomy cures the seizures at the cost of a fixed
    neurological deficit. Can earlier or better-targeted immunotherapy (guided by
    imaging or immune biomarkers) defer or avoid hemispherectomy while preserving
    function, and what is the optimal timing of surgery?
  rationale: >-
    The trade-off between preserving hemispheric function and achieving seizure
    freedom is the central management dilemma, and the optimal timing and role of
    immunotherapy versus surgery are not resolved.
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral hemispherectomy remains the only cure for seizures"
    explanation: >-
      Frames the dilemma: surgery is curative for seizures but functionally
      costly, motivating better use of immunotherapy and timing.
  proposed_experiments:
  - experiment_id: re-immunotherapy-timing-trial
    name: Immunotherapy timing and biomarker study
    description: >-
      Prospectively evaluate early immunotherapy regimens with serial MRI and
      immune biomarkers to test whether they slow progression enough to defer or
      avoid hemispherectomy while preserving neurological function.
    readouts:
    - name: Progression, seizure, and function outcomes by immunotherapy timing
      target: "pathophysiology#Progressive Neurological Decline"
    decision_criterion: >-
      Preserved function with acceptable seizure control would support earlier
      immunotherapy as a hemisphere-sparing strategy.
    would_support:
    - "pathophysiology#Progressive Neurological Decline"
- discussion_id: re-unihemispheric-restriction
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Progressive Unihemispheric Neuronal Loss and Gliosis"
  prompt: >-
    Rasmussen encephalitis characteristically remains confined to a single
    cerebral hemisphere. What restricts the T-cell-mediated attack to one
    hemisphere and largely spares the other, and could that restriction be
    reinforced therapeutically?
  rationale: >-
    The unihemispheric confinement is both diagnostically defining and
    mechanistically puzzling; understanding what limits spread could reveal
    protective mechanisms and therapeutic targets.
  proposed_experiments:
  - experiment_id: re-hemispheric-restriction
    name: Study of hemispheric confinement
    description: >-
      Compare affected and unaffected hemispheres (imaging, immune, and, where
      available, tissue analyses) to identify factors that confine the
      inflammatory process to one hemisphere.
    readouts:
    - name: Differences between affected and spared hemispheres
      target: "pathophysiology#Progressive Unihemispheric Neuronal Loss and Gliosis"
    would_support:
    - "pathophysiology#Progressive Unihemispheric Neuronal Loss and Gliosis"

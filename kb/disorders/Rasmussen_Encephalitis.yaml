      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "unihemispheric lymphocytic infiltrates, microglial nodules, and neuronal loss leading to the destruction of the affected hemisphere"
      explanation: >-
        The neuropathological sequence links the inflammatory infiltrate and
        microglial nodules to neuronal loss and destruction of the affected

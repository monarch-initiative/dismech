datasets:
- accession: geo:GSE310367
  title: Brain Molecular Mechanisms in Rasmussen Encephalitis
  description: 'Objective: Identify molecular mechanisms in brain tissue of Rasmussen encephalitis (RE) when compared to people with non-RE epilepsy (PWE) and control cases using whole exome sequencing (WES), RNAseq, and proteomics. Methods: Frozen brain tissue (ages 2-19 years) was obtained from control autopsy (n=14), surgical PWE (n=10), and surgical RE cases (n=27). We evaluated WES variants in RE associated with epilepsy, seizures, RE, and human leukocyte antigens (HLAs). Differential expression was evaluated by RNAseq (adjusted p<0.05) and label-free quantitative mass spectrometry (false discovery rate<5%) in the three groups.'

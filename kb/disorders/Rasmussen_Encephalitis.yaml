    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RE is an immune-mediated disease, with a predominant role of CD8+ T cytotoxic cells, microglial cells, and activation of inflammasome pathway"
    explanation: >-
      A systematic review of the disease mechanism assigns microglial cells and

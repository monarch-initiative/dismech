treatments:
- name: Functional Hemispherectomy (Hemispherotomy)
  description: >-
    Functional hemispherectomy/hemispherotomy - surgically disconnecting the
    affected hemisphere - is the only reliably seizure-terminating treatment and
    is the definitive therapy for drug-resistant Rasmussen encephalitis, at the
    cost of a fixed contralateral hemiparesis and (for the dominant hemisphere)
    language considerations.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebral hemispherectomy remains the only cure for seizures"
    explanation: >-
      Hemispherectomy is the only reliably curative treatment for the seizures,
      at the cost of fixed functional deficits.
  - reference: PMID:33294146
    reference_title: "Rasmussen's encephalitis: mechanisms update and potential therapy target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most effective way to limit the influence of seizures currently is cerebral hemispherectomy"
    explanation: >-
      Independent review confirms hemispherectomy as the most effective
      seizure-limiting intervention.
- name: Immunotherapy
  description: >-
    Immunomodulatory therapy (corticosteroids, intravenous immunoglobulin, and
    agents such as tacrolimus or rituximab) can slow inflammatory progression
    and is used particularly early or to delay surgery, but does not reliably
    stop seizures.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: tacrolimus
      term:
        id: CHEBI:61049
        label: tacrolimus (anhydrous)
  target_mechanisms:
  - target: CD8+ Cytotoxic T-Cell Brain Infiltration
    treatment_effect: INHIBITS
    description: >-
      Immunosuppressive and immunomodulatory agents dampen the cytotoxic
      T-cell-mediated attack on the affected hemisphere.
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunomodulatory treatments seem to slow rather than halt disease progression in Rasmussen's encephalitis, without changing the eventual outcome."
    explanation: >-
      Immunomodulatory therapy slows but does not halt progression, supporting
      its use as a disease-modifying rather than curative treatment.
  - reference: PMID:32769034
    reference_title: "Rasmussen's encephalitis: From immune pathogenesis towards targeted-therapy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although often insufficient to modify the disease course and to achieve symptomatic control, immune therapy can be effective in patients with slow disease progression or in patients in which surgery is not applicable."
    explanation: >-
      Delimits the clinical niche for immunotherapy: slowly progressive disease
      or patients who are not surgical candidates.

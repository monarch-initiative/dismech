  - target: Astrocytic MHC Class I Upregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Astrocytes within the inflamed hemisphere come to display MHC class I.
    evidence:
    - reference: PMID:17503512
      reference_title: "Astrocytes are a specific immunological target in Rasmussen's encephalitis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Astrocytes in these tissues showed major histocompatibility complex class I expression."
      explanation: >-
        PARTIAL, and the link type is deliberately
        INDIRECT_UNKNOWN_INTERMEDIATES: the study documents MHC class I
        expression on astrocytes inside inflamed Rasmussen cortex, but it does
        not identify the signal that induces it. This edge encodes the
        inflammatory context in which the MHC class I display arises, not a
        demonstrated induction by microglial activation.
- name: Astrocytic MHC Class I Upregulation
  description: >-
    Astrocytes in the affected hemisphere display major histocompatibility

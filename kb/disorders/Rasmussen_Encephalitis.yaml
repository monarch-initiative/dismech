    explanation: >-
      The European consensus statement characterizes Rasmussen encephalitis as
      a rare disorder, supporting the qualitative rarity band; no precise
      numeric rate is reported.
  - reference: PMID:33294146
    reference_title: "Rasmussen's encephalitis: mechanisms update and potential therapy target."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    reference_title: "Medical treatment of Rasmussen's Encephalitis: A systematic review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Antiseizure medications are generally unable to stop seizures."
    explanation: >-
      A systematic review of medical treatment concludes that antiseizure
      medications generally fail to control the seizures of Rasmussen
      encephalitis.
  - reference: PMID:28029552
    reference_title: "Epilepsia partialis continua: A review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in general, EPC tends to be drug-resistant. Epilepsy surgery is often indicated in Rasmussen encephalitis."
    explanation: >-
      Epilepsia partialis continua in particular is drug-resistant, which is why
      epilepsy surgery is often indicated in Rasmussen encephalitis.

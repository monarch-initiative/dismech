pathophysiology:
- name: Immune Trigger and Adaptive Immune Activation
  description: >-
    An unknown trigger initiates an adaptive immune response directed at one
    cerebral hemisphere. The inciting antigen is not established, but the
    downstream process is a cell-mediated (T-cell) attack. This node captures
    the single concept of the initiating immune activation.
  role: trigger
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:24457189
    reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rasmussen's encephalitis is probably driven by a T-cell response to one or more antigenic epitopes"
    explanation: >-
      The disorder is thought to be driven by a T-cell response to antigenic
      epitopes, with the inciting trigger not fully defined.
  downstream:
  - target: CD8+ Cytotoxic T-Cell Brain Infiltration
    causal_link_type: DIRECT
    description: >-
      Immune activation drives cytotoxic T-cell infiltration of the affected
      hemisphere.
    evidence:
    - reference: PMID:24457189
      reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Neuropathological and immunological studies support the notion that Rasmussen's encephalitis is probably driven by a T-cell response to one or more antigenic epitopes"
      explanation: >-
        Attributing the disease process to an antigen-directed T-cell response is
        what places cytotoxic T-cell infiltration downstream of the initiating
        immune activation. PARTIAL rather than SUPPORT because the review states
        the driving response, not the infiltration event itself, and hedges it as
        "probably".
- name: CD8+ Cytotoxic T-Cell Brain Infiltration
  description: >-
    CD8+ cytotoxic T lymphocytes infiltrate the cortex of a single hemisphere
    and attack neurons and astrocytes, the central immunopathological lesion of
    Rasmussen encephalitis. This node captures the single concept of the
    T-cell-mediated attack.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD8-positive cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: T cell mediated cytotoxicity
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: INCREASED
  evidence:
  - reference: PMID:11891826
    reference_title: "Destruction of neurons by cytotoxic T cells: a new pathogenic mechanism in Rasmussen's encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lymphocytic infiltrates that consisted mainly of CD3(+)CD8(+) T cells"
    explanation: >-
      Immunohistochemistry showed the lymphocytic infiltrate is mainly CD8+
      cytotoxic T cells, with granzyme-B polarized toward MHC-I+ neurons.
  downstream:
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: DIRECT
    description: >-
      T-cell attack activates microglia and sustains neuroinflammation.
    evidence:
    - reference: PMID:24457189
      reference_title: "Rasmussen's encephalitis: clinical features, pathobiology, and treatment advances."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "initial damage to the brain is mediated by T cells and microglia"
      explanation: >-
        Histopathology-clinical correlation places T cells and microglia together
        in the early damaging lesion. PARTIAL because co-occurrence in the early
        lesion is indirect evidence for the directional T-cell-to-microglia
        amplification step, which the review does not state as such.
  - target: Cytotoxic T-Cell Attack on Astrocytes
    causal_link_type: DIRECT
    description: >-
      The same cytotoxic T-cell infiltrate engages astrocytes, not only neurons.
    evidence:
    - reference: PMID:17503512
      reference_title: "Astrocytes are a specific immunological target in Rasmussen's encephalitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "granzyme-B(+) lymphocytes were found in close apposition to astrocytes bordering astrocyte-deficient lesions"
      explanation: >-
        Granzyme-B-positive lymphocytes sit directly against astrocytes at the
        edge of astrocyte-depleted lesions, placing the cytotoxic infiltrate in
        physical contact with astrocytes and establishing this edge.
- name: Microglial Activation and Neuroinflammation
  description: >-
    Activated microglia form microglial nodules and, with the T-cell
    infiltrate, sustain chronic neuroinflammation in the affected hemisphere.
    This node captures the single concept of the innate/neuroinflammatory
    amplification.
  role: mediator
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:11891826
    reference_title: "Destruction of neurons by cytotoxic T cells: a new pathogenic mechanism in Rasmussen's encephalitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unihemispheric lymphocytic infiltrates, microglial nodules, and neuronal loss"

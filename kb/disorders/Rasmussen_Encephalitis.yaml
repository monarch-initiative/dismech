- name: Progressive Unihemispheric Neuronal Loss and Gliosis
  description: >-
    Chronic cytotoxic inflammation causes progressive neuronal loss and reactive
    astrogliosis confined to one hemisphere, producing the characteristic
    progressive unilateral hemispheric atrophy. This node captures the single
    concept of the resulting tissue destruction.
  role: mediator
  cell_types:

      CD68-positive microglial nodules are a defining histological feature of
      the affected hemisphere, evidencing activated microglia in situ.
  downstream:
  - target: Progressive Unihemispheric Neuronal Loss and Gliosis
    causal_link_type: DIRECT
    description: >-
      Sustained cytotoxic inflammation destroys neurons and drives astrogliosis.
    evidence:
    - reference: PMID:11891826

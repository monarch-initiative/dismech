name: Autosomal Recessive Nonsyndromic Hearing Loss 22
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 22
  term:
    id: MONDO:0011762
    label: autosomal recessive nonsyndromic hearing loss 22
synonyms:
- DFNB22
- deafness, autosomal recessive 22
- OTOA-related autosomal recessive nonsyndromic hearing loss
- otoancorin deficiency
description: >-
  DFNB22 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic OTOA dysfunction.
  OTOA encodes otoancorin, a GPI-anchored protein at the interface between nonsensory inner-ear epithelia and
  overlying acellular gels. In knockout mice, loss of otoancorin detaches the tectorial membrane from the spiral
  limbus and alters its morphology. Cochlear physiology supports impaired mechanical stimulation of inner hair
  cells despite relatively preserved basilar-membrane amplification; direct human cochlear pathology remains
  unestablished. Human severity, onset and audiogram shape vary: congenital or prelingual, childhood and postlingual
  presentations, with mid-frequency, flat or sloping loss, have been reported. Progression occurs in some patients
  but its frequency and rate are not established. Pathogenic alleles include sequence variants, deletions and
  OTOAP1-mediated conversions. High gene-pseudogene homology complicates variant detection and requires assay-specific
  coverage and confirmation.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

prevalence:
- population: Israeli chromosomal-microarray referral cohort (19,189 consecutive CMA tests, Rabin Medical Center)
  measure_type: CARRIER_FREQUENCY
  notes: >-
    Thirty-nine heterozygous OTOA deletions were found in 19,189 prenatal and postnatal CMA tests (reported
    as 0.2%). Patients with hearing loss and duplicate relatives carrying the same deletion were excluded.
    This is a deletion-carrier observation in a clinical testing cohort, not disease prevalence or total carrier
    frequency. The paper estimated a 0.016-0.13% chance of a second disease-associated sequence allele in an
    individual with a deletion from database frequencies and Mendelian assumptions. This was a model-based
    estimate, not observed penetrance or a prospectively measured hearing-loss rate; it depends on the database,
    ancestry and variant classifications.

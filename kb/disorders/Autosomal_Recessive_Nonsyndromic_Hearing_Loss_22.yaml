      Reproduces the structural lesion: tectorial membrane detached from the limbus,
      otherwise intact and still over the organ of Corti.
    limitations: >-
      No human temporal-bone histopathology exists for DFNB22, so the correspondence
      between this lesion and the human one is inferred from shared genotype rather than
      demonstrated.

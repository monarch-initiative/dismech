- name: Deficient Otoancorin at the Limbal Attachment Zone
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    Mouse localization places otoancorin at the apical surface of interdental cells of the spiral limbus and
    transiently at the developing greater epithelial ridge. Wild-type otoancorin expressed in HEK293T cells
    was released by phosphatidylinositol-specific phospholipase C, supporting GPI anchorage. p.Gln589ArgfsX55
    was constitutively released into medium and lacked detectable surface staining. This overexpression result
    establishes a defect of the expressed truncated protein, but not whether sufficient mutant protein escapes
    nonsense-mediated decay in patient cochlear cells. Complete protein absence has been demonstrated in the
    mouse null model, not for every human genotype.
  cell_types:
  - preferred_term: interdental cell of the spiral limbus
    term:
      id: CL:0002172
      label: interdental cell of cochlea
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cochlea, otoancorin is detected at two attachment zones of the tectorial membrane, a permanent
      one along the top of the spiral limbus and a transient one on the surface of the developing greater epithelial
      ridge.
    explanation: >-
      Localizes the protein to the attachment zone whose failure the next node describes. The localization
      is murine, hence MODEL_ORGANISM.
  - reference: PMID:30740825
    reference_title: "Clarification of glycosylphosphatidylinositol anchorage of OTOANCORIN and human OTOA variants associated with deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant OTOA with p.Gln589ArgfsX55 resulted in an uncontrolled release of OTOA into the medium in
      contrast with phosphatidylinositol-specific phospholipase C-induced controlled release of WT OTOA from
      the cell surface.
    explanation: >-
      Transfected-cell evidence of impaired surface retention of the expressed truncation; patient protein
      abundance and nonsense-mediated decay remain unresolved.
  - reference: PMID:30740825
    reference_title: Clarification of glycosylphosphatidylinositol anchorage of OTOANCORIN and human OTOA variants associated with deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the study, we could not properly evaluate the possibility of NMD for two mutant truncating transcripts from c.1320+5G>C and p.Gln589ArgfsX55, because OTOA transcript was not detected even from wild-type lymphoblastoid cell line (unpublished data).
    explanation: Explicit limit on extrapolating the expressed truncation to endogenous patient protein.
  downstream:
  - target: Tectorial Membrane Detachment from the Spiral Limbus
    causal_link_type: DIRECT
    description: >-
      Otoa knockout causes loss of limbal attachment in mice; the corresponding tissue lesion has not been
      directly examined in patients.

- name: Tectorial Membrane Detachment from the Spiral Limbus
  role: mechanism
  biological_scale: TISSUE
  description: >-
    In Otoa-null mice, the tectorial membrane loses attachment to the spiral limbus while retaining its gross
    form near the organ of Corti and outer hair-cell bundle imprints. It is not otherwise structurally normal:
    the lateral region is thinned and fenestrated, a distinct marginal band is absent, and Hensen's stripe
    is not visible. These full-text morphological observations limit interpretation of the mutant as an isolated
    detachment experiment. Human temporal-bone confirmation is unavailable in the reviewed studies.
  locations:
  - preferred_term: tectorial membrane of the cochlea
    term:
      id: UBERON:0002233
      label: tectorial membrane of cochlea
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the tectorial membrane (TM), a ribbon-like strip of ECM that is normally anchored by one edge to the
      spiral limbus and lies over the organ of Corti, retains its general form, and remains in close proximity
      to the organ of Corti, but is detached from the limbal surface.
    explanation: >-
      The abstract establishes detachment and preserved gross form; the full-text Results and Figures 3-4 additionally
      describe marginal and Hensen-stripe abnormalities.
  downstream:
  - target: Failure of Inner Hair Cell Stimulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of limbal attachment and accompanying structural abnormalities are inferred to reduce hydrodynamic drive to inner hair-cell bundles. The relative contributions of detachment, altered subtectorial geometry and other membrane changes were not isolated.
- name: Failure of Inner Hair Cell Stimulation
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    In Otoa-null mice, compound action potential thresholds were elevated by 35-55 dB over 8-70 kHz while neural
    masker tuning remained sharp and was sharper than wild type under the tested conditions. Basilar-membrane
    sensitivity and tuning were largely preserved in the measured basal region. This dissociation supports
    inefficient transmission of cochlear motion to inner hair cells. Compound action potentials measure synchronized
    auditory-nerve activity and are an indirect assay of inner hair-cell stimulation, not direct recordings
    of inner hair-cell mechanotransduction currents. The exact hydrodynamic intermediate and applicability
    to every human allele remain unresolved.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: mechanical stimulation of the inner hair-cell bundle
    modifier: DECREASED
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The compound action potential masker tuning curves, a measure of the tuning of the sensory inner hair
      cells, are also sharply tuned, but the thresholds of the compound action potentials, a measure of inner
      hair cell sensitivity, are significantly elevated.
    explanation: >-
      Auditory-nerve compound potentials support the stimulation hypothesis indirectly; sharp tuning does not
      demonstrate normal inner hair-cell transduction.
  downstream:
  - target: Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Reduced sensory drive provides a mechanistic explanation for hearing impairment in the knockout, with
      provisional extrapolation to humans.

- name: Relatively Preserved Cochlear Amplification in Mice
  role: modifier
  biological_scale: CELLULAR
  description: >-
    Basilar-membrane sensitivity and sharpness of tuning at the high-frequency cochlear base were not significantly
    different between null and wild-type mice. This relative preservation constrains the proposed hearing-loss
    mechanism. It is a parallel physiological observation, not a consequence that detachment causes normal
    function. DPOAE thresholds were nevertheless elevated by 10-35 dB over 8-65 kHz; the authors proposed altered
    reverse transmission as an explanation for the difference from basilar-membrane responses. Normal otoacoustic
    emissions or universally intact outer hair cells cannot be inferred in human DFNB22.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Measurements of cochlear microphonic potentials, distortion product otoacoustic emissions, and basilar
      membrane motion indicate that the TM remains functionally attached to the electromotile, sensorimotor
      outer hair cells of the organ of Corti, and that the amplification and frequency tuning of the basilar
      membrane responses to sounds are almost normal.
    explanation: >-
      Relative preservation of basilar-membrane amplification in mice; the full-text Results and Figure 5B
      separately show elevated DPOAE thresholds.
- name: Sensorineural Hearing Loss
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Bilateral sensorineural hearing loss is the clinical endpoint. Severity, onset, symmetry and audiogram
    configuration vary between reported families. The Chinese series emphasized postlingual sloping loss; Japanese
    cases included mid-frequency loss and progression. These cohorts do not establish a universal clinical
    pattern.
  evidence:
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, the hearing loss caused by OTOA defects mostly presents as bilateral, symmetrical, and
      postlingual, and that of a few presents as congenital.
    explanation: >-
      Clinical pattern in six Chinese pedigrees, not a universal description or the largest possible series.

  downstream:
  - target: Bilateral Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: Clinical manifestation of the cochlear hearing deficit.

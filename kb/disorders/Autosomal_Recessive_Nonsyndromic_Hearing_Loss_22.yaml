pathophysiology:
- name: Biallelic OTOA Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic OTOA loss of function is supported by homozygous deletions and splice variants and by compound
    heterozygous genotypes. Reported missense alleles have varying levels of support and are not all established
    pathogenic variants. The founding Palestinian family carried homozygous IVS12+2T>C (c.1320+2T>C); aberrant
    splicing was predicted in that study. A later Korean proband carried c.1320+5G>C in trans with c.1765delC
    (p.Gln589ArgfsX55). COS7 minigenes demonstrated abnormal splicing for c.1320+5G>C, while HEK293T assays
    showed impaired surface retention of the truncated protein. Patient cochlear RNA and protein were not tested.
    In two other probands, OTOAP1 sequence replaced part of OTOA and introduced p.Glu787* in trans with an
    OTOA deletion. The conversion tract was at least 9 kb in one case and less than 900 bp in the other. Different
    recombination or repair mechanisms for generating these tracts were proposed, not experimentally established.
    A South Indian family carried a homozygous 250.285-kb deletion encompassing METTL9, IGSF6, OTOA and part
    of NPIPB4. Its nonsyndromic presentation does not exclude effects of neighboring genes in other deletions
    or backgrounds.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: Both homozygous and compound heterozygous pathogenic genotypes occur; one zygosity does not represent the disorder.
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the mutation (IVS12+2T>C) in the corresponding gene OTOA in one consanguineous
      Palestinian family affected by nonsyndromic recessive deafness DFNB22 assigns an essential function to
      otoancorin.
    explanation: >-
      The founding gene-disease observation and the allele it rests on.
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic variations of OTOA gene are mainly copy number variations followed by deletion variations
      and missense variations.
    explanation: >-
      Copy-number variants predominated among the variants classified as pathogenic in this six-pedigree series;
      two additional variants remained uncertain.
  - reference: PMID:33492714
    reference_title: "Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both conversions lead to loss-of-function by introducing a premature stop codon in exon 22 (p.Glu787*).
    explanation: >-
      Establishes gene conversion as a pathogenic allele class and names the resulting variant, which is the
      same in both probands because it is pseudogene sequence rather than an independent mutation.
  - reference: PMID:39916398
    reference_title: "A 250-kb Microdeletion Identified in Chromosome 16 Is Associated With Non-Syndromic Sensorineural Hearing Loss in a South Indian Consanguineous Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous deletion of 250.285 kb was identified in the 16p12.2 region encompassing three genes, METTL9,
      IGSF6, and OTOA
    explanation: >-
      This abstract names three genes; the full-text deletion analysis additionally includes part of NPIPB4.
      The family does not establish the absence of neighboring-gene effects generally.
  - reference: PMID:33492714
    reference_title: Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This allowed us to estimate that the size of the conversion on this second allele was less than 900bp
    explanation: Upper bound for the shorter tract from the full-text sequence analysis.
  - reference: PMID:30740825
    reference_title: Clarification of glycosylphosphatidylinositol anchorage of OTOANCORIN and human OTOA variants associated with deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Notably, no normal splicing pattern was detected in the c.1320+5G>C mutant.
    explanation: 'COS7 minigene evidence: 113 mutant colonies showed alternative splicing, not patient cochlear RNA.'
  downstream:

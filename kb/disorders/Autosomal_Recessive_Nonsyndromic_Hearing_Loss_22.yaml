name: Autosomal Recessive Nonsyndromic Hearing Loss 22
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 22
  term:
    id: MONDO:0011762
    label: autosomal recessive nonsyndromic hearing loss 22
synonyms:
- DFNB22
- deafness, autosomal recessive 22
- OTOA-related autosomal recessive nonsyndromic hearing loss
- otoancorin deficiency
description: >-
  Non-syndromic sensorineural hearing loss caused by biallelic loss of OTOA, which
  encodes otoancorin: a GPI-anchored protein found only in the inner ear, and only at
  the interface where an acellular gel meets the epithelium underneath it. In the
  cochlea that interface is the attachment of the tectorial membrane to the spiral
  limbus.

  Two things distinguish this disease from most hereditary hearing loss and shaped how
  this entry is curated.

  The first is that the lesion is not in the hair cell. Otoancorin is made by the
  non-sensory interdental cells of the spiral limbus, not by hair cells, and the mouse
  model shows the consequence precisely: the tectorial membrane loses its limbal
  attachment but keeps its shape and stays over the organ of Corti, so outer hair cell
  amplification and cochlear tuning remain close to normal while inner hair cell
  sensitivity falls. The deafness is a failure to stimulate the inner hair cells, not a
  failure of transduction within them. Most of what is asserted about this mechanism
  comes from that mouse, and the entry says so rather than presenting it as human
  pathology.

  The second is genotype. OTOA sits in a segmental duplication and a large share of
  pathogenic alleles are recurrent copy-number deletions rather than point mutations,
  which is why the gene is under-called by sequencing-only pipelines and why the
  diagnostic recommendation here is about assay choice rather than about gene choice.

  The severity reported in humans is not uniform. The founding Palestinian family was
  described as having non-syndromic recessive deafness, while the largest published
  case series found mostly post-lingual, mild-to-moderate low-frequency and
  moderate-to-severe high-frequency loss. The entry records the sloping, post-lingual
  presentation as the common one and congenital presentation as occasional, which is
  what that series reports.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

prevalence:
- population: Israeli chromosomal-microarray referral cohort (19,189 consecutive CMA tests, Rabin Medical Center)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 200.0
  rate_denominator: POPULATION
  notes: >-
    Heterozygous OTOA microdeletions in 39 of 19,189 individuals, 0.2%. Two cautions
    before this number is reused. It counts *deletions only* - point variants are not
    included, so it is a floor on carrier frequency rather than an estimate of it. And
    the denominator is a clinical microarray referral population, not a population
    sample, so it is not a general-population carrier rate.

    The same study estimates the hearing-loss risk for an individual found to carry such
    a deletion at 0.016-0.13%, which is the figure that matters when one turns up as an
    incidental finding.
  evidence:
  - reference: PMID:33753912
    reference_title: "Is it time to report carrier state for recessive disorders in every microarray analysis?-A pilot model based on hearing loss genes deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 19,189 CMA tests were performed in our laboratory, 107 STRC microdeletions
      were found (0.56%), followed in frequency by OTOA deletions (39, 0.2%), and DFNB1
      locus deletions (10, 0.05%).
    explanation: >-
      The numerator, denominator and rate. Quoted with the STRC and DFNB1 figures intact
      because they are in the same sentence and because the comparison is informative -
      OTOA deletions are the second commonest of the three.
  - reference: PMID:33753912
    reference_title: "Is it time to report carrier state for recessive disorders in every microarray analysis?-A pilot model based on hearing loss genes deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The estimated risk for a hearing loss in the examined individual carrying the
      microdeletion was estimated as 0.11-0.67% for STRC, 0.016-0.13% for OTOA
    explanation: >-
      The penetrance-adjusted risk for an incidentally identified carrier, which is the
      clinically actionable form of the carrier frequency.

- population: Dutch hearing-impairment cohort referred for genetic testing
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No prevalence estimate for the disease exists - the carrier-frequency record above is
    a deletion-only rate in a referral cohort and does not yield one. What is documented
    instead is DFNB22's share of diagnoses in gene-panel cohorts, where OTOA appears among the genes
    whose causative variant is a large homozygous deletion detectable only by copy-number
    analysis. Recorded as a diagnostic-yield observation, not as a prevalence rate, which
    is why no rate_per_100000 is given.
  evidence:
  - reference: PMID:28000701
    reference_title: "The diagnostic yield of whole-exome sequencing targeting a gene panel for hearing impairment in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these patients have a large homozygous deletion involving STRC, OTOA or
      USH2A, which could only be identified by copy number variation detection.
    explanation: >-
      Establishes that OTOA contributes to the diagnosed fraction of a hearing-impairment
      cohort, and that its contribution is via deletions rather than point variants.

pathophysiology:

- name: Biallelic OTOA Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Reported alleles span splice-site changes, frameshifts, a
    missense variant, and - most often - whole or partial gene deletions.

    The founding DFNB22 allele is the splice variant IVS12+2T>C, found homozygous in a
    consanguineous Palestinian family. Later series are dominated by copy-number
    variants, which is a consequence of where the gene sits rather than of any special
    mutability of its coding sequence.

    A third allele class is worth separating out because it is neither a point variant nor
    a deletion, and neither a sequencing pipeline nor a copy-number pipeline is built to
    find it: **gene conversion from the OTOAP1 pseudogene**. Pseudogene sequence is copied
    into the functional gene, carrying a premature stop at p.Glu787* in exon 22. The
    converted tracts reported span roughly 900 bp to over 9 kbp, and the two probands
    described were compound heterozygous for a converted allele and a deletion - so the
    conversion is doing half the work in a genotype that a deletion assay would report as
    a single heterozygous finding.

    Deletions also extend beyond the gene. A homozygous 250 kb deletion at 16p12.2
    spanning METTL9, IGSF6 and OTOA segregated with non-syndromic hearing loss in a South
    Indian consanguineous family, which is worth knowing because a contiguous-gene
    deletion invites the question of whether the neighbours contribute - and here the
    phenotype was non-syndromic, so on the available evidence they do not.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the mutation (IVS12+2T>C) in the corresponding gene OTOA in
      one consanguineous Palestinian family affected by nonsyndromic recessive deafness
      DFNB22 assigns an essential function to otoancorin.
    explanation: >-
      The founding gene-disease observation and the allele it rests on.
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenic variations of OTOA gene are mainly copy number variations followed
      by deletion variations and missense variations.
    explanation: >-
      Establishes that copy-number loss, not point mutation, is the predominant allele
      class in a six-pedigree series.
  - reference: PMID:33492714
    reference_title: "Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both conversions lead to loss-of-function by introducing a premature stop codon in
      exon 22 (p.Glu787*).
    explanation: >-
      Establishes gene conversion as a pathogenic allele class and names the resulting
      variant, which is the same in both probands because it is pseudogene sequence rather
      than an independent mutation.
  - reference: PMID:39916398
    reference_title: "A 250-kb Microdeletion Identified in Chromosome 16 Is Associated With Non-Syndromic Sensorineural Hearing Loss in a South Indian Consanguineous Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous deletion of 250.285 kb was identified in the 16p12.2 region encompassing
      three genes, METTL9, IGSF6, and OTOA
    explanation: >-
      A contiguous-gene deletion reaching beyond OTOA, in a family whose phenotype remained
      non-syndromic.
  downstream:
  - target: Loss of Otoancorin from the Limbal Attachment Zone
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles remove the protein from the one place it is found.

- name: Loss of Otoancorin from the Limbal Attachment Zone
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    Otoancorin is GPI-anchored to the apical surface of non-sensory epithelial cells and
    is restricted to the zones where those surfaces contact an acellular gel. In the
    cochlea that means the permanent attachment along the top of the spiral limbus, and a
    transient one over the developing greater epithelial ridge.

    The GPI anchorage is not an inference from sequence. It was tested directly: wild-type
    otoancorin is released from the cell surface by phosphatidylinositol-specific
    phospholipase C, whereas a truncating variant is shed into the medium uncontrolled.
    So a C-terminal truncation does not merely shorten the protein, it stops it being
    held at the surface at all.
  cell_types:
  - preferred_term: interdental cell of the spiral limbus
    term:
      id: CL:0002172
      label: interdental cell of cochlea
  biological_processes:
  - preferred_term: attachment of the tectorial membrane to the limbal epithelium
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: ABSENT
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the cochlea, otoancorin is detected at two attachment zones of the tectorial
      membrane, a permanent one along the top of the spiral limbus and a transient one on
      the surface of the developing greater epithelial ridge.
    explanation: >-
      Localizes the protein to the attachment zone whose failure the next node describes.
      The localization is murine, hence MODEL_ORGANISM.
  - reference: PMID:30740825
    reference_title: "Clarification of glycosylphosphatidylinositol anchorage of OTOANCORIN and human OTOA variants associated with deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant OTOA with p.Gln589ArgfsX55 resulted in an uncontrolled release of OTOA
      into the medium in contrast with phosphatidylinositol-specific phospholipase
      C-induced controlled release of WT OTOA from the cell surface.
    explanation: >-
      Experimentally establishes the GPI anchorage and shows that a truncating allele
      abolishes surface retention rather than only altering the protein.
  downstream:
  - target: Tectorial Membrane Detachment from the Spiral Limbus
    causal_link_type: DIRECT
    description: >-
      With nothing anchoring it, the tectorial membrane separates from the limbal surface.

- name: Tectorial Membrane Detachment from the Spiral Limbus
  role: mechanism
  biological_scale: TISSUE
  description: >-
    The specific structural lesion, and the reason this disease behaves unlike other
    tectorial membrane disorders. The membrane is not absent, malformed, or displaced
    away from the organ of Corti. It keeps its ribbon shape and stays in contact with the
    outer hair cells. Only its inner edge, where it should be moored to the limbus, comes
    free.
  locations:
  - preferred_term: tectorial membrane of the cochlea
    term:
      id: UBERON:0002233
      label: tectorial membrane of cochlea
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the tectorial membrane (TM), a ribbon-like strip of ECM that is normally anchored by
      one edge to the spiral limbus and lies over the organ of Corti, retains its general
      form, and remains in close proximity to the organ of Corti, but is detached from the
      limbal surface.
    explanation: >-
      States the lesion and, in the same sentence, what is preserved - which is what makes
      the downstream split between inner and outer hair cells possible.
  downstream:
  - target: Failure of Inner Hair Cell Stimulation
    causal_link_type: DIRECT
    description: >-
      The detached inner edge no longer couples motion to the inner hair cell bundles.
  - target: Preserved Outer Hair Cell Amplification
    causal_link_type: DIRECT
    description: >-
      The membrane's continued contact with the outer hair cells leaves the cochlear
      amplifier substantially intact. Recorded as an explicit node because the preserved
      function is diagnostically useful, not merely an absence of damage.

- name: Failure of Inner Hair Cell Stimulation
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    The functional lesion. Inner hair cell tuning stays sharp - the cells are being driven
    at the right frequency - but the drive itself is too weak, so compound action
    potential thresholds rise while masker tuning curves remain narrow. That dissociation
    is what identifies the defect as one of stimulation rather than of transduction or of
    frequency selectivity.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: mechanical stimulation of the inner hair cell bundle
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The compound action potential masker tuning curves, a measure of the tuning of the
      sensory inner hair cells, are also sharply tuned, but the thresholds of the compound
      action potentials, a measure of inner hair cell sensitivity, are significantly
      elevated.
    explanation: >-
      The measurement behind the claim: tuning preserved, sensitivity lost.
  downstream:
  - target: Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Reduced inner hair cell drive is reduced afferent output, which is the hearing loss.

- name: Preserved Outer Hair Cell Amplification
  role: modifier
  biological_scale: CELLULAR
  description: >-
    Not a pathological step. It is recorded because it is the part of the cochlea this
    disease spares, and because sparing it has a clinical consequence: otoacoustic
    emissions, which report outer hair cell function, can be present in an ear that is
    nonetheless substantially deaf.

    The entry stops short of claiming that OAEs are preserved in DFNB22 patients. The
    measurement is murine. What is asserted in humans is only that the mechanism predicts
    it, and the knowledge gap below says so.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Measurements of cochlear microphonic potentials, distortion product otoacoustic
      emissions, and basilar membrane motion indicate that the TM remains functionally
      attached to the electromotile, sensorimotor outer hair cells of the organ of Corti,
      and that the amplification and frequency tuning of the basilar membrane responses to
      sounds are almost normal.
    explanation: >-
      The measurement establishing that outer hair cell amplification survives the lesion.

- name: Sensorineural Hearing Loss
  role: outcome
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint. Bilateral and symmetric, sloping, and in most reported probands
    post-lingual rather than congenital.
  biological_processes:
  - preferred_term: hearing
    term:
      id: GO:0007605
      label: sensory perception of sound
    modifier: DECREASED
  evidence:
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, the hearing loss caused by OTOA defects mostly presents as bilateral,
      symmetrical, and postlingual, and that of a few presents as congenital.
    explanation: >-
      Characterizes the endpoint in the largest published case series.


    description: >-
      Establishes the functional lesion by direct cochlear physiology.
    limitations: >-
      The human phenotype in the largest series is a sloping, largely post-lingual loss,
      whereas the mouse is studied as a fixed state; the model says nothing about why the
      human loss is progressive or late in onset.
    readouts:
    - name: Compound action potential threshold
      target: Failure of Inner Hair Cell Stimulation
      direction: INCREASED
      interpretation: >-
        An elevated threshold is reduced inner hair cell sensitivity.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the thresholds of the compound action potentials, a measure of inner hair cell
          sensitivity, are significantly elevated.
        explanation: >-
          The measurement itself.
    - name: Compound action potential masker tuning curve sharpness
      target: Failure of Inner Hair Cell Stimulation
      direction: UNCHANGED
      interpretation: >-
        Preserved tuning is the negative result that makes this a stimulation defect
        rather than a tuning or transduction defect. Recorded because the unchanged
        measurement carries the argument.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The compound action potential masker tuning curves, a measure of the tuning of
          the sensory inner hair cells, are also sharply tuned
        explanation: >-
          States the preserved tuning.
  - target: Preserved Outer Hair Cell Amplification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows amplification and basilar-membrane tuning near normal despite the detachment.
    limitations: >-
      Whether otoacoustic emissions are likewise preserved in human DFNB22 ears has not
      been reported, so the clinically useful form of this finding remains untested in
      patients.
    readouts:
    - name: Distortion product otoacoustic emissions and basilar membrane motion
      target: Preserved Outer Hair Cell Amplification
      direction: UNCHANGED
      interpretation: >-
        Near-normal amplification, indicating the outer hair cell system is spared.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the amplification and frequency tuning of the basilar membrane responses to
          sounds are almost normal.
        explanation: >-
          The measurement establishing preservation.
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gene targeting in ES cells was used to create an EGFP knock-in, otoancorin KO
      (Otoa(EGFP/EGFP)) mouse.
    explanation: >-
      Establishes the model's construction, which is what licenses treating it as an
      otoancorin-null model of this disease.

diagnosis:

- name: Copy-Number-Aware Genetic Testing
  description: >-
    The diagnostic point specific to this disease, and it has two halves because the locus
    generates two kinds of structural allele.

    Most pathogenic OTOA alleles are deletions in a segmentally duplicated region, so a
    sequencing-only panel returns negative in a proband who has the disease. Copy-number
    analysis - MLPA in the reported case series, or read-depth CNV calling on exome data -
    is what makes that diagnosis.

    Gene conversions need something further again. They are not copy-number changes, so a
    CNV pipeline does not see them either; they were found by noticing sequencing-depth
    anomalies at the locus and then confirmed by long-range PCR and nanopore sequencing.
    A proband compound heterozygous for a deletion and a conversion will look like a
    heterozygous carrier on a deletion assay alone.
  evidence:
  - reference: PMID:28000701
    reference_title: "The diagnostic yield of whole-exome sequencing targeting a gene panel for hearing impairment in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these patients have a large homozygous deletion involving STRC, OTOA or
      USH2A, which could only be identified by copy number variation detection.
    explanation: >-
      States that these diagnoses were reachable only by copy-number analysis, which is
      the recommendation.
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the copy number variations were validated by multiplex ligation-dependent probe
      amplification (MLPA) in the family members.
    explanation: >-
      Names the confirmatory assay used in the case series.
  - reference: PMID:33492714
    reference_title: "Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The conversions were initially detected through sequencing depths anomalies at the
      OTOA locus after exome sequencing, then confirmed with long range polymerase chain
      reactions.
    explanation: >-
      The detection route for conversions, which is neither variant calling nor copy-number
      analysis and is the reason this allele class is missed by both.

treatments:

- name: Hearing Amplification and Auditory Rehabilitation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: auditory rehabilitation with amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    The mainstay for a sloping mild-to-severe loss, which is what most reported probands
    have. Amplification is well matched to this disease in principle: the afferent pathway
    is intact and the deficit is that the inner hair cells are under-driven, so delivering
    more acoustic energy addresses the actual failure.

    No DFNB22-specific outcome data exist. Recorded without an evidence item rather than
    with a quote from the general amplification literature, which would not be about this
    disease.
  target_mechanisms:
  - target: Failure of Inner Hair Cell Stimulation
    treatment_effect: MODULATES
    description: >-
      Increases the acoustic drive reaching an under-stimulated but otherwise functional
      inner hair cell population. It does not restore the limbal attachment.
  notes: >-
    Carries no evidence item deliberately. The mechanistic rationale is this entry's
    inference from the mouse physiology and is labelled as such.

- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    Reserved for the minority whose loss is severe-to-profound. The lesion is upstream of
    the spiral ganglion, so an implant's target is intact, and no cochlear malformation
    has been described in this disease.

    As with amplification, no DFNB22 implant outcomes are published and none are asserted
    here.
  target_mechanisms:
  - target: Failure of Inner Hair Cell Stimulation
    treatment_effect: BYPASSES
    description: >-
      Stimulates the auditory nerve directly, bypassing the mechanical coupling step that
      has failed.
  notes: >-
    No evidence item, for the same reason as the amplification entry.

    The treatment term is the generic surgical action, following the convention in
    CLAUDE.md: NCIT:C157820 Cochlear Implant names the device rather than a clinical
    action and is not reachable from NCIT:C25218, so it is attached as a qualifier
    instead of occupying the term slot.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Autosomal recessive, 25% recurrence risk per pregnancy for carrier couples. Worth
    pairing with a note that carrier testing in relatives has the same copy-number caveat
    as diagnosis: a sequencing-only carrier test can miss a deletion allele.

differential_diagnoses:

- name: STRC-related hearing loss (DFNB16)
  description: >-
    The closest differential, and for a structural reason rather than a clinical one.
    STRC also sits in a segmental duplication, is also lost predominantly by recurrent
    deletion, and also produces a mild-to-moderate recessive sensorineural loss. The two
    genes turn up together in the same copy-number analyses of the same cohorts, so a
    pipeline that finds one is the pipeline that finds the other.
  evidence:
  - reference: PMID:28000701
    reference_title: "The diagnostic yield of whole-exome sequencing targeting a gene panel for hearing impairment in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these patients have a large homozygous deletion involving STRC, OTOA or
      USH2A, which could only be identified by copy number variation detection.
    explanation: >-
      Puts the two genes in the same deletion-detected diagnostic class in one cohort.

- name: Tectorial membrane disorders of TECTA and TECTB
  description: >-
    Also tectorial membrane diseases, but the lesion is in the membrane's own matrix
    rather than in its attachment. In DFNB22 the membrane is structurally normal and only
    unmoored, which is a different pathology with a different predicted effect on outer
    hair cell function.

discussions:

- discussion_id: otoa_mouse_to_human_correspondence
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the inner-hair-cell-stimulation defect demonstrated in the Otoa null mouse
    account for the human DFNB22 phenotype, given that the mouse is characterized as a
    fixed deficit while most human probands have a post-lingual, sloping loss?
  rationale: >-
    Everything mechanistic in this entry above the level of "OTOA is lost" comes from one
    mouse. The mouse gives a clean, internally consistent account: the tectorial membrane
    comes off the limbus, inner hair cell drive falls, outer hair cell amplification
    survives. Nothing in that account predicts a loss that arrives after speech acquisition
    and slopes with frequency, which is what five of six probands in the largest human
    series have.

    This is a mismatch rather than a gap because the model evidence is strong and specific
    - it is the human correspondence that is unestablished, not the model result. It
    matters practically: the prediction that otoacoustic emissions should be preserved in
    a DFNB22 ear follows from the mouse and would be a cheap, decisive clinical test of
    whether the same mechanism is operating in patients, and it has not been reported.
  attaches_to:
  - pathophysiology#Failure of Inner Hair Cell Stimulation
  - pathophysiology#Preserved Outer Hair Cell Amplification
  proposed_experiments:
  - experiment_id: otoa_oae_in_patients
    name: Otoacoustic emission testing in genetically confirmed DFNB22 probands
    description: >-
      Measure distortion product otoacoustic emissions in patients with biallelic OTOA
      loss and audiometrically confirmed sensorineural hearing loss. The mouse predicts
      emissions should be present despite the loss, because the outer hair cell system is
      spared. Absent emissions would mean the human disease involves outer hair cells and
      the mouse account is incomplete.
    readouts:
    - name: Distortion product otoacoustic emission amplitude
      target: pathophysiology#Preserved Outer Hair Cell Amplification
      direction: UNCHANGED
      interpretation: >-
        Preserved emissions in an ear with a substantial audiometric loss would confirm
        the mouse mechanism operates in humans.
    would_support:
    - pathophysiology#Preserved Outer Hair Cell Amplification
    supporting_outcome:
    - >-
      Otoacoustic emissions present at normal or near-normal amplitude in ears with
      significant audiometric hearing loss.
    would_refute:
    - pathophysiology#Preserved Outer Hair Cell Amplification
    refuting_outcome:
    - >-
      Otoacoustic emissions absent or markedly reduced in proportion to the audiometric
      loss, indicating outer hair cell involvement not predicted by the model.

- discussion_id: otoa_allele_class_and_onset
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does allele class - copy-number deletion versus splice or missense variant - explain
    the difference between congenital and post-lingual presentation?
  rationale: >-
    The founding Palestinian family carried a splice allele and was reported simply as
    non-syndromic recessive deafness. The Chinese series is dominated by copy-number
    variants and is mostly post-lingual, with one congenital proband. Six probands is too
    few to separate allele class from ancestry, ascertainment, or chance, and no published
    analysis attempts it. Recorded as an open question rather than curated as a
    genotype-phenotype correlation, because the data do not support one.
  attaches_to:
  - pathophysiology#Biallelic OTOA Loss-of-Function
  - phenotypes#Postlingual Onset

notes: >-
  Scope. This entry covers biallelic OTOA loss only. Heterozygous OTOA deletions are
  common enough in population data to be a recurrent incidental finding, and carrier
  status is not curated here as a phenotype.

  Deep research. An OpenScientist report is committed alongside this entry. Its first run
  hit the provider's 3600 s timeout and was cancelled; the report here is a retry at a
  longer timeout and fewer iterations. It is the strongest of the five reports in this
  batch on its own validation numbers - 13/13 references verified, 13/13 judged on-topic,
  zero confabulation - and `just preflight-dr` returns PASS with the OMIM xref matching.

  It changed the entry substantively rather than confirming it. Three things came from it
  and were then verified against their primary sources before use: the carrier-frequency
  record above (which corrected a sentence in this entry asserting no population estimate
  existed), gene conversion from the OTOAP1 pseudogene as a third allele class, and the
  contiguous-gene deletion. The gene-conversion material is the most useful, because it
  identifies a genotype that neither a sequencing pipeline nor a copy-number pipeline will
  report.

  Evidence base. Nine references, of which one - the Otoa null mouse - carries the
  mechanism and the rest carry the human genetics and phenotype. Every mechanistic node below the trigger
  is graded MODEL_ORGANISM or IN_VITRO, and the entry does not upgrade any of it to a
  human claim. Readers should treat the cellular and tissue nodes as a murine account
  with a human genotype attached, which is what the HUMAN_MODEL_MISMATCH discussion says
  explicitly.

  Two things this entry deliberately does not assert. It does not claim preserved
  otoacoustic emissions in patients, because that measurement is murine. And it does not
  give a prevalence rate: the only population-level number available is a diagnostic-yield
  share from one referred cohort, which is not a prevalence, so the prevalence record
  carries a class and a note rather than a rate.

genetic:
- name: OTOA
  gene_term:
    preferred_term: OTOA
    term:
      id: hgnc:16378
      label: OTOA
  relationship_type: CAUSATIVE
  notes: >-
    OTOA encodes otoancorin, localized to nonsensory epithelial surfaces at acellular-gel attachment zones
    in the mouse inner ear. The founding paper's 1088-residue abstract refers to murine sequence and must not
    be treated as a human protein length. OTOA and OTOAP1 share greater than 99% identity in the paralogous
    region, complicating mapping, copy-number calls and primer/probe placement. Alleles include whole or partial
    deletions, splice and truncating variants, selected missense variants and pseudogene-mediated conversions.
    A conversion can resemble an exon deletion in read-depth output; locus-specific amplification and sequencing
    are required to distinguish the physical alterations. Proposed recombination mechanisms generating a conversion
    are distinct from the observed converted sequence. Neither isolated heterozygosity nor a pair of uncertain
    variants alone establishes recessive OTOA disease.
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A 3,673-bp murine cDNA predicted to encode a glycosylphosphatidylinositol-anchored protein of 1,088 amino
      acids was isolated during a study aimed at identifying transcripts specifically expressed in the inner
      ear.
    explanation: >-
      Murine cDNA characterization, not a human protein length or proof that extra-auditory findings are impossible.
  - reference: PMID:25528277
    reference_title: "Exome sequencing and genome-wide copy number variant mapping reveal novel associations with sensorineural hereditary hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High-resolution genome-wide CNV analysis of 150 cases and 157 controls revealed deletions in genes known
      to be involved in hearing (e.g. GJB6, OTOA, and STRC, encoding connexin 30, otoancorin, and stereocilin,
      respectively), supporting CNV contributions to hearing loss phenotypes.
    explanation: >-
      Case-control CNV analysis found OTOA-overlapping calls in cases and controls; this is not confirmation
      of biallelic causation for every overlapping call.

  - reference: PMID:32681043
    reference_title: Spectrum of genetic variants in moderate to severe sporadic hearing loss in Pakistan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A large homozygous deletion including OTOA was identified in individual SPK7.
    explanation: Additional deletion case in a Pakistani sporadic hearing-loss cohort.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported causative genotypes are homozygous or compound heterozygous, consistent with autosomal recessive
    inheritance. When both parents carry established pathogenic alleles, each pregnancy has a 25% chance of
    an affected child. Apply recurrence counseling after verifying familial variants, phase and diagnostic
    attribution.
  evidence:
  - reference: PMID:11972037
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of the mutation (IVS12+2T>C) in the corresponding gene OTOA in one consanguineous
      Palestinian family affected by nonsyndromic recessive deafness DFNB22 assigns an essential function to
      otoancorin.
    explanation: >-
      Names the inheritance mode and the consanguineous pedigree it was established in.

  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: General recessive recurrence risk, conditional on established parental pathogenic variants.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC122933/?report=xml
    reference_title: "Otoancorin, an inner ear protein restricted to the interface between the apical surface of sensory epithelia and their overlying acellular gels, is defective in autosomal recessive deafness DFNB22 - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: was not detected in a total of 417 Jordanian, Lebanese, Palestinian, and Jewish (mainly from Sephardi and Yemenite ethnic groups) individuals with normal hearing.
    explanation: Founding-family segregation and control data from the full text; not a penetrance estimate.
animal_models:
- name: Otoa-EGFP knock-in null mouse
  species: Mouse
  genotype: Otoa(EGFP/EGFP)
  publication: PMID:23129639
  description: >-
    EGFP replaces the first coding exon of Otoa. Absent full-length transcript and undetectable otoancorin
    immunoreactivity support a null model. Physiological experiments used littermates younger than three months.
    The model links tectorial-membrane attachment and morphology to reduced auditory-nerve sensitivity, but
    does not establish the human tissue lesion or the effects of every allele.
  modeled_mechanisms:
  - target: Tectorial Membrane Detachment from the Spiral Limbus
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Limbal detachment occurs with thinning and fenestration of the lateral membrane and loss of Hensen's
      stripe; this is not an otherwise intact membrane.
    limitations: >-
      Human cochlear pathology has not been directly examined in the cited studies. Multiple membrane abnormalities
      prevent attribution of every physiological effect solely to detachment.
    readouts:
    - name: Position of the tectorial membrane relative to the limbal surface
      target: Tectorial Membrane Detachment from the Spiral Limbus
      direction: ALTERED
      interpretation: >-
        Structural readout of the attachment failure.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the tectorial membrane (TM), a ribbon-like strip of ECM that is normally anchored by one edge to
          the spiral limbus and lies over the organ of Corti, retains its general form, and remains in close
          proximity to the organ of Corti, but is detached from the limbal surface.
        explanation: >-
          The observation behind this readout.
  - target: Failure of Inner Hair Cell Stimulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Elevated auditory-nerve compound action potential thresholds, despite relatively preserved basilar-membrane
      responses, support impaired transmission of mechanical drive to inner hair cells.
    limitations: >-
      CAP is an indirect measure of inner hair-cell stimulation. Direct inner hair-cell currents, adult human
      natural history and allele-specific residual function are not established by this null model.
    readouts:
    - name: Compound action potential threshold
      target: Failure of Inner Hair Cell Stimulation
      direction: INCREASED
      interpretation: >-
        Elevated auditory-nerve response thresholds support reduced sensory drive; they do not directly measure
        inner hair-cell transduction.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the thresholds of the compound action potentials, a measure of inner hair cell sensitivity, are significantly
          elevated.
        explanation: >-
          The measurement itself.
    - name: Compound action potential masker tuning curve sharpness
      target: Failure of Inner Hair Cell Stimulation
      interpretation: >-
        Full-text Figure 5F and Results show sharper masker tuning than wild type under the tested stimulus
        conditions, not unchanged tuning or proof of normal transduction.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The compound action potential masker tuning curves, a measure of the tuning of the sensory inner
          hair cells, are also sharply tuned
        explanation: >-
          The abstract states sharp tuning; the full-text comparison reports increased sharpness relative to
          wild type.
  - target: Relatively Preserved Cochlear Amplification in Mice
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Basilar-membrane sensitivity and tuning in the measured high-frequency basal region were not significantly
      altered. This relative preservation differs from elevated DPOAE thresholds.
    limitations: >-
      Measurements were restricted to the high-frequency cochlear base. DPOAE thresholds increased by 10-35
      dB over 8-65 kHz; therefore neither normal emissions nor absence of all outer hair-cell effects is established.
      Human correspondence remains unresolved.
    readouts:
    - name: Basilar-membrane sensitivity and tuning at the high-frequency cochlear base
      target: Relatively Preserved Cochlear Amplification in Mice
      direction: UNCHANGED
      interpretation: >-
        No significant group difference in the measured basal responses; this does not describe DPOAE thresholds,
        which increased.
      evidence:
      - reference: PMID:23129639
        reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the amplification and frequency tuning of the basilar membrane responses to sounds are almost normal.
        explanation: >-
          The measurement establishing preservation.
  evidence:
  - reference: PMID:23129639
    reference_title: "A mouse model for human deafness DFNB22 reveals that hearing impairment is due to a loss of inner hair cell stimulation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gene targeting in ES cells was used to create an EGFP knock-in, otoancorin KO (Otoa(EGFP/EGFP)) mouse.
    explanation: >-
      Establishes the model's construction, which is what licenses treating it as an otoancorin-null model
      of this disease.

diagnosis:
- name: Copy-Number-Aware Genetic Testing
  description: >-
    Use genetic testing that evaluates OTOA sequence variants and deletions/duplications and has appropriate
    coverage of the homologous OTOA/OTOAP1 region. Short-read panel or exome data can detect CNVs when analyzed
    appropriately, but assay-specific limitations matter. In the conversion study, exome CNV analysis flagged
    an apparent exon-22 deletion; MLPA confirmed a larger deletion but lacked probes in the paralogous region.
    Long-range PCR with Sanger and nanopore sequencing resolved the converted allele. Thus conversion may be
    flagged or misclassified rather than uniformly invisible. Confirm candidate variants, phase and familial
    segregation and assess current pathogenicity; a single heterozygous deletion or an uncertain missense genotype
    is not a complete recessive diagnosis.
  evidence:
  - reference: PMID:28000701
    reference_title: "The diagnostic yield of whole-exome sequencing targeting a gene panel for hearing impairment in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these patients have a large homozygous deletion involving STRC, OTOA or USH2A, which could only
      be identified by copy number variation detection.
    explanation: >-
      Eight deletion diagnoses collectively involved STRC, OTOA or USH2A; the number is not eight OTOA cases.
  - reference: PMID:37114731
    reference_title: "[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss caused by OTOA variations]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the copy number variations were validated by multiplex ligation-dependent probe amplification (MLPA)
      in the family members.
    explanation: >-
      Names the confirmatory assay used in the case series.
  - reference: PMID:33492714
    reference_title: "Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The conversions were initially detected through sequencing depths anomalies at the OTOA locus after exome
      sequencing, then confirmed with long range polymerase chain reactions.
    explanation: >-
      Read-depth anomalies triggered further analysis; the full text identifies the initial signal as CNV calls,
      subsequently resolved by locus-specific amplification and sequencing.

  - reference: PMID:33492714
    reference_title: Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The resolution of the paternal allele was hindered by the fact that the region spanning intron 20 to exon 29 of OTOA displays very high sequence identity with exons 1 to 9 of the OTOAP1 pseudogene (NR_003676.3) and therefore lacks MLPA probes.
    explanation: Probe coverage and homology explain this assay-specific limitation.
- name: Audiologic assessment and serial follow-up
  description: Use age-appropriate diagnostic audiometry or ABR, with tympanometry, otoacoustic emissions and speech assessment as appropriate. Repeated audiometry documents progression and guides hearing support. Failed or preserved emissions alone do not confirm or exclude OTOA disease. Surveillance follows general genetic-hearing-loss care; a DFNB22-specific interval is not established.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Regular follow up is recommended for all individuals with genetic hearing loss in order to:'
    explanation: General surveillance recommendation, not a disease-specific interval.
treatments:
- name: Hearing Amplification and Auditory Rehabilitation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory rehabilitation with amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    Individualized hearing aids and auditory rehabilitation follow general guidance for mild-to-severe hearing
    loss. They address the hearing phenotype; the mouse mechanism does not guarantee an intact human afferent
    pathway or a particular aided outcome. Genotype-specific efficacy is not established by the reviewed studies.
  target_phenotypes:
  - preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General guidance on hearing aids, not an OTOA-specific outcome study.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    Consider specialist cochlear-implant assessment for severe-to-profound hearing loss according to hearing
    ability and clinical candidacy. A Filipino implant cohort included a homozygous OTOA c.2301+1G>T candidate
    case, but that patient also had substantial perinatal and acquired risk factors. Implant outcomes were
    reported collectively across heterogeneous genotypes, not as an OTOA-specific efficacy estimate. The proposed
    mouse lesion does not establish intact neural targets or guarantee benefit in every patient.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cochlear implantation can be considered in children with severe-to-profound hearing loss who are older than age nine months.
    explanation: General candidacy guidance.
  - reference: PMID:30828794
    reference_title: Exome sequencing reveals novel variants and unique allelic spectrum for hearing impairment in Filipino cochlear implantees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However there was no significant difference in post-surgical thresholds, suggesting that carriage of the genetic variants reported here does not determine the outcome of cochlear implantation, with average implant-aided hearing at 38dB across frequencies.
    explanation: Cohort-level comparison across heterogeneous genotypes; not an OTOA-specific treatment effect.
  - reference: PMID:30828794
    reference_title: Exome sequencing reveals novel variants and unique allelic spectrum for hearing impairment in Filipino cochlear implantees.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patient #14 has global developmental delay and a history of maternal rubella, low birth weight, exchange transfusion for jaundice, antibiotic treatment and mechanical ventilation for neonatal pneumonia, and intraventricular hemorrhage.'
    explanation: Table 1 footnote documents competing contributors in the OTOA candidate case; these are not curated as DFNB22 manifestations.
- name: Genetic Counselling
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Provide nondirective counseling after molecular confirmation. Recurrence risk is conditional on the established
    parental pathogenic genotypes. Testing relatives must be designed to detect the actual familial allele
    class, including deletions or resolved conversions.

  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: General recessive recurrence risk, conditional on established parental pathogenic variants.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Carrier testing for relatives who may have a hearing loss-related pathogenic variant requires prior identification of the pathogenic variants in the family.
    explanation: Prerequisite for informative family testing.
- name: Communication and language support
  description: Establish communication goals and provide appropriate language access, speech-language services and educational support. These are general measures for hearing loss, not evidence of a primary neurodevelopmental syndrome caused by OTOA.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: On initial evaluation of individuals with hearing loss, the goals for communication must be established with a focus on equipping individuals with language and appropriate access to language.
    explanation: General hearing-loss management.
- name: Hearing-conservation counseling
  description: Avoid repeated hazardous noise exposure as part of general care for documented hearing loss. Increased OTOA-specific noise vulnerability and a genotype-specific preventive effect have not been demonstrated here.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/?report=reader
    reference_title: "Genetic Hearing Loss Overview - GeneReviews&reg; - NCBI Bookshelf"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Since this risk can be minimized by avoidance, persons with documented hearing loss should be counseled appropriately and repeated overexposure to loud noises should be avoided.
    explanation: General hearing-conservation guidance.
differential_diagnoses:
- name: STRC-related hearing loss (DFNB16)
  description: >-
    STRC-related recessive hearing loss overlaps clinically and also requires attention to deletions and gene-pseudogene
    homology. Audiogram shape alone does not distinguish it from OTOA disease; molecular testing can evaluate
    both loci.
  evidence:
  - reference: PMID:28000701
    reference_title: "The diagnostic yield of whole-exome sequencing targeting a gene panel for hearing impairment in The Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight of these patients have a large homozygous deletion involving STRC, OTOA or USH2A, which could only
      be identified by copy number variation detection.
    explanation: >-
      Puts the two genes in the same deletion-detected diagnostic class in one cohort.

- name: TECTA-related hearing loss
  description: TECTA disease can also produce mid-frequency hearing loss and involves the tectorial membrane. Molecular testing distinguishes it from OTOA-related disease. DFNB22 mouse membranes have structural abnormalities as well as detachment, so normal membrane structure is not a valid differentiator.
  evidence:
  - reference: PMID:31527525
    reference_title: Mid-Frequency Hearing Loss Is Characteristic Clinical Feature of OTOA-Associated Hearing Loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: is also known as a genetic cause of mid-frequency HL
    explanation: The full source sentence identifies TECTA as another cause of mid-frequency hearing loss; the quoted clause follows its gene name and reference markers.
- name: Additional genetic diagnoses in a complex phenotype
  description: Extra-auditory findings warrant evaluation for additional causes. Two siblings with OTOA deletion and mid-frequency hearing loss also had a homozygous ERCC4 missense variant and an NER-disorder-like phenotype. The ERCC4 allele was classified as uncertain and lacked functional confirmation; this report supports considering blended diagnoses, not assigning photosensitivity or intellectual disability to DFNB22.
  evidence:
  - reference: PMID:39769235
    reference_title: "Unveiling Secondary Mutations in Blended Phenotypes: Dual ERCC4 and OTOA Pathogenic Variants Through WES Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: While the homozygous deletion in OTOA is a well-established cause of deafness, the pathogenicity of the ERCC4 variant identified in our patients is currently supported only by allele frequency data, in silico predictions, and clinical concordance.
    explanation: The full-text limitation prevents upgrading the proposed second diagnosis to a functionally confirmed mechanism.
discussions:
- discussion_id: otoa_mouse_to_human_correspondence
  kind: KNOWLEDGE_GAP
  prompt: How closely does the Otoa-null mouse physiology represent human OTOA hearing loss?
  rationale: The mouse has limbal detachment, additional membrane abnormalities, elevated CAP and DPOAE thresholds, and relatively preserved basal basilar-membrane responses. It does not predict universally normal human emissions. One conversion proband repeatedly failed neonatal OAE screening, but screening results do not localize the lesion or directly test the proposed hydrodynamic mechanism. Human physiological characterization across confirmed genotypes remains limited.
  attaches_to:
  - pathophysiology#Failure of Inner Hair Cell Stimulation
  - pathophysiology#Relatively Preserved Cochlear Amplification in Mice
  evidence:
  - reference: PMID:33492714
    reference_title: Molecular characterization of pathogenic OTOA gene conversions in hearing loss patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband’s neonatal auditory screening (otoacoustic emissions) failed for both ears. After four repeated failures she was referred for a full hearing evaluation.
    explanation: Human screening result; insufficient to establish outer hair-cell dysfunction or refute the mouse mechanism.
- discussion_id: otoa_allele_class_and_onset
  kind: KNOWLEDGE_GAP
  prompt: Which confirmed genotypes explain variation in onset, configuration and progression?
  rationale: Congenital, prelingual, childhood and postlingual presentations occur across reports. Small differently ascertained cohorts, uncertain missense variants, incomplete segregation and sparse serial audiometry prevent reliable allele-class correlations. Diagnosis or recognition age must be distinguished from true onset, and reported candidate cases must be separated from firmly established molecular diagnoses.
  attaches_to:
  - pathophysiology#Biallelic OTOA Loss-of-Function
  - phenotypes#Postlingual Onset
  - phenotypes#Congenital Onset
  - phenotypes#Progressive Sensorineural Hearing Loss
notes: >-
  The disease scope is recessive OTOA-related hearing loss. An isolated heterozygous deletion is carrier evidence
  unless a second pathogenic allele is established. Additional findings in multigene deletions or proposed
  blended diagnoses should not automatically be attributed to OTOA. The causal cochlear tissue mechanism is
  supported primarily by mouse experiments, supplemented by human genetics and transfected-cell assays; human
  membrane pathology and genotype-specific treatment outcomes remain incompletely characterized.


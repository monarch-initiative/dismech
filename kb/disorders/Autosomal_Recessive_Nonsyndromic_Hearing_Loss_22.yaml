    of essentially the whole mechanism in this entry, and the reason the entry can
    distinguish a stimulation defect from a transduction defect at all - that distinction
    rests on physiological measurements nobody has made in a patient.
  modeled_mechanisms:
  - target: Tectorial Membrane Detachment from the Spiral Limbus

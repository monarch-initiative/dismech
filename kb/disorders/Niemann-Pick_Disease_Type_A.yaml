- name: Lysosomal Sphingomyelin and Secondary Lipid Accumulation
  biological_scale: CELLULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Substrate Accumulation"
  description: >-
    Undegraded sphingomyelin (ceramide-phosphocholine), accompanied by
    lysosphingomyelin, bis(monoacylglycero)phosphate, and secondary unesterified
    cholesterol and glycosphingolipids, accumulates inside lysosomes and
    plasma-membrane microdomains of macrophages and neurons. Engorged macrophages
    transform into mulberry-like, concentrically lamellated lipid-laden foam
    cells ("Niemann-Pick cells") throughout bone marrow, reticuloendothelial
    viscera, pulmonary airways, and cerebral perivascular spaces, while swollen
    neurons accumulate pale vacuolated membrane-bound cytoplasmic inclusions.

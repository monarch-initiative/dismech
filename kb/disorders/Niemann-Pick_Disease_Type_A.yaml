pathophysiology:
- name: SMPD1 Loss of Function and Acid Sphingomyelinase Deficiency
  biological_scale: MOLECULAR
  conforms_to: "lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency"
  description: >-
    Biallelic severe loss-of-function variants in SMPD1 (sphingomyelin
    phosphodiesterase 1) abolish or reduce lysosomal acid sphingomyelinase
    activity to well below 10% of normal controls (and below the ~5–10% residual
    central nervous system activity threshold seen in non-neuronopathic type B
    alleles). Acid sphingomyelinase normally hydrolyzes sphingomyelin into
    ceramide and phosphocholine within lysosomes and at stressed plasma-membrane
    microdomains; its profound loss is the initiating molecular defect of NPD-A.

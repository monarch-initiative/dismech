- name: Autosomal recessive
  description: >-
    Inherited in an autosomal recessive pattern with 25% sibling recurrence risk
    when both parents are heterozygous SMPD1 carriers; because SMPD1 at 11p15.4
    is paternally imprinted and preferentially expressed from the maternal
    chromosome, parent-of-origin of severe alleles can modulate heterozygote and
    compound-heterozygote expression.

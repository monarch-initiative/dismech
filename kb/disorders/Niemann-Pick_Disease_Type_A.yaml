- name: Hepatosplenic and Reticuloendothelial Foam-Cell Storage
  biological_scale: TISSUE
  description: >-
    Massive sphingomyelin-laden foam-cell accumulation across hepatic Kupffer
    cells, hepatocytes, bile-duct epithelium, splenic red pulp, and bone marrow
    causes early infantile hepatosplenomegaly, hepatic parenchymal injury with
    elevated transaminases and potential infantile liver failure, synthetic
    coagulopathy, hypersplenism and marrow-infiltration cytopenias
    (thrombocytopenia and anemia), and atherogenic dyslipidemia with markedly
    decreased HDL cholesterol.

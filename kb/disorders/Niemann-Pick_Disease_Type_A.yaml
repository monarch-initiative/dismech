- name: Central Nervous System Neuronal Storage and Cortical-Cerebellar Cell Loss
  biological_scale: TISSUE
  conforms_to: "lysosomal_substrate_accumulation#Storage-Cell Cytotoxicity and Neuroinflammation"
  description: >-
    In NPD-A infants, membrane-bound sphingomyelin inclusions distend and
    vacuolate ganglion cells and drive progressive neuronal loss across the
    cerebral and cerebellar cortices accompanied by gray- and white-matter
    gliosis and patchy demyelination; complementary studies in ASM knockout
    (ASMKO) mice demonstrate cerebellar Purkinje cell death together with
    defective synaptic vesicle cycling, calcium homeostasis, neuronal
    polarization, and myelin production.

name: Niemann-Pick Disease Type A
creation_date: "2026-06-13T00:00:00Z"
updated_date: "2026-11-12T00:00:00Z"
description: >-
  Niemann-Pick disease type A (NPD-A; infantile neurovisceral acid
  sphingomyelinase deficiency) is the severe, infantile-onset neuronopathic end
  of the acid sphingomyelinase deficiency (ASMD) continuum, caused by biallelic
  loss-of-function variants in SMPD1 encoding lysosomal acid sphingomyelinase.
  Profound deficiency of acid sphingomyelinase (<10% of normal residual activity
  and typically near-absent activity) prevents hydrolysis of sphingomyelin to
  ceramide and phosphocholine, driving intralysosomal and membrane accumulation
  of sphingomyelin, lysosphingomyelin, bis(monoacylglycero)phosphate, and
  secondary cholesterol across reticuloendothelial macrophages, pulmonary
  alveolar macrophages, retinal ganglion cells, and central nervous system
  neurons. Affected infants appear normal at birth, present by 2–6 months with
  hepatosplenomegaly, vomiting, and failure to thrive, plateau in psychomotor
  development before 12 months, and then undergo relentless neurodegenerative
  regression with profound hypotonia, loss of deep tendon reflexes, macular
  cherry-red spots, and progressive interstitial lung disease, with median
  survival around 2 years and death typically before age 3 years, most commonly
  from respiratory failure. Recombinant human acid sphingomyelinase enzyme
  replacement therapy (olipudase alfa) reduces non-central nervous system
  visceral and pulmonary sphingomyelin storage in ASMD, but does not cross the
  blood-brain barrier and therefore does not alter the central nervous system
  neurodegeneration of NPD-A, leaving clinical management primarily supportive
  and palliative.

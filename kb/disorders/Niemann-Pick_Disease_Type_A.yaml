    snippet: >-
      The differential diagnosis of types A and B NPD should include Gaucher
      disease and type C NPD. Biochemical and/or genetic testing in a reliable
      laboratory can readily distinguish these conditions.
    explanation: >-
      Explicitly highlights Gaucher disease as a primary enzymatic and genetic
      differential diagnosis of NPD-A/B.
treatments:
- name: Supportive Care
  description: >-
    Because no approved therapy crosses the blood-brain barrier to arrest CNS
    neurodegeneration in NPD-A, multidisciplinary supportive and palliative care
    remains the cornerstone of management — including feeding therapy or enteral
    tube feeding for nutritional failure, supplemental oxygen for symptomatic
    interstitial lung disease, blood-product transfusion for severe
    coagulopathy/bleeding, physical and occupational therapy to prevent
    contractures, targeted symptom control for irritability and sleep
    disturbance, and family-centered palliative support.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Supportive care: Feeding therapy and/or feeding tube as needed for
      nutritional support; supportive management of coagulopathy and end-stage
      liver disease manifestations; transfusion of blood products for
      life-threatening bleeding; partial splenectomy may be considered for
      individuals with severe hypersplenism; supplemental oxygen for symptomatic
      pulmonary disease; physical and occupational therapy to maximize function
      and to prevent contractures
    explanation: >-
      Details standard multidisciplinary supportive interventions for
      nutritional, hematologic, pulmonary, and neuromuscular complications in
      ASMD/NPD-A.
  - reference: PMID:28228103
    reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Available treatments are limited to symptom management and supportive care."
    explanation: "Confirms that care for neuronopathic NPD-A relies on symptom management and supportive care."
- name: Enzyme Replacement Therapy (olipudase alfa)
  description: >-
    Intravenous recombinant human acid sphingomyelinase (olipudase alfa;
    evaluated across pediatric NCT02292654 and adult NCT02004691 step-up
    debulking dose-escalation trials to avoid acute ceramide-release toxicity)
    is approved for non-central nervous system manifestations of ASMD across
    subtypes, reducing sphingomyelin storage in liver, spleen, and lung.
    However, intravenous olipudase alfa does not cross the blood-brain barrier
    and therefore does not prevent or slow the relentless central nervous system
    neurodegeneration of NPD-A.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
    therapeutic_agent:
    - preferred_term: olipudase alfa
      term:
        id: CHEBI:755825
        label: olipudase alfa
  target_mechanisms:
  - target: Lysosomal Sphingomyelin and Secondary Lipid Accumulation
    description: >-
      Exogenous recombinant human acid sphingomyelinase hydrolyzes stored
      lysosomal sphingomyelin in non-CNS reticuloendothelial and pulmonary
      tissues (without crossing the blood-brain barrier to clear neuronal
      storage).
    evidence:
    - reference: PMID:20301544
      reference_title: "Acid Sphingomyelinase Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Olipudase alfa (Xenpozyme®) enzyme replacement therapy (ERT) helps to
        reduce the accumulation of sphingomyelin in the lung, liver, spleen, and
        other non-central nervous system organs. It does not impact the central
        nervous system and therefore does not impact the neurocognitive issues
        seen in individuals with NPD-A or NPD-A/B.
      explanation: >-
        Demonstrates both the visceral/pulmonary sphingomyelin-clearing mechanism
        of olipudase alfa and its lack of CNS blood-brain barrier efficacy in
        NPD-A.
  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Olipudase alfa (Xenpozyme®) enzyme replacement therapy (ERT) helps to

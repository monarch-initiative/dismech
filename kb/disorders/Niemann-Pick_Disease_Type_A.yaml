genetic:
- name: SMPD1
  presence: PRESENT
  association: Biallelic severe loss-of-function SMPD1 variants abolishing acid sphingomyelinase activity
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SMPD1
    term:
      id: hgnc:11120
      label: SMPD1
  features: >-
    More than 180 pathogenic missense, nonsense, small-deletion, and splice-site
    variants in SMPD1 (11p15.4, a paternally imprinted locus preferentially
    expressed from the maternal allele) underlie ASMD. Three founder alleles
    (including p.Arg496Leu / R496L) account for ~90% of Ashkenazi Jewish NPD-A
    infants (carrier frequency 1:80–1:100), whereas hypomorphic alleles that
    preserve ~5–10% residual brain ASM activity (such as p.Arg608del / deltaR608)
    confer neuroprotection and produce non-neuronopathic NPD-B rather than
    NPD-A.
  evidence:
  - reference: PMID:28228103
    reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Acid sphingomyelinase deficiency (ASMD), a rare lysosomal storage disease, is an autosomal recessive genetic disorder caused by different SMPD1 mutations."
    explanation: "SMPD1 mutations are the genetic cause of ASMD/NPD-A."
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This region of chromosome 11 is a hotspot for imprinting within the human
      genome, and studies have shown that the SMPD1 gene is preferentially
      expressed from the maternal chromosome (i.e., paternally imprinted)
    explanation: >-
      Documents chromosomal locus 11p15.4 and preferential maternal expression
      (paternal imprinting) of SMPD1.
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In these models the common type NPD A mutation – R496L, and the common
      type B mutation – deltaR608 were introduced. The phenotypes of these mice
      were as expected. R496L mice developed a severe "type A" phenotype
      indistinguishable from the knockout mice. DeltaR608 developed a later
      onset, non-neurological "type B" phenotype. They expressed between ~5 and
      10% residual ASM activity in the brain, again demonstrating that low level
      ASM activity was neuroprotective.
    explanation: >-
      Knock-in mouse genotype-phenotype modeling contrasting the severe type A
      R496L allele against the neuroprotective ~5–10% residual-activity type B
      deltaR608 allele.
progression:
- phase: Fatal infantile course
  age_range: Infancy to early childhood (onset by 3–6 months; median survival ~2.0 years; death typically before 3 years)
  notes: >-
    Affected neonates appear clinically normal at birth, present with
    hepatosplenomegaly at a median diagnostic age of ~6–8 months, plateau in
    psychomotor development between 6 and 15 months, and follow a uniformly
    relentless neurodegenerative decline. In the US prospective natural-history
    cohort (n=10), median time from diagnosis to death was 21 months (9/10 from
    respiratory failure, 1/10 from bleeding complications); in the French
    national retrospective survival cohort (n=15 type A patients), Kaplan-Meier
    median survival from birth was 2.0 years (95% CI 1.8–2.7 years).
  evidence:
  - reference: PMID:28228103
    reference_title: "Disease manifestations and burden of illness in patients with acid sphingomyelinase deficiency (ASMD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "leading to death typically by the age of 3 years, most often from respiratory failure"
    explanation: "Documents the fatal infantile prognosis of type A, typically before age 3 years."
  - reference: PMID:16434659
    reference_title: "Natural history of Type A Niemann-Pick disease: possible endpoints for therapeutic trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median time from diagnosis to death was 21 months. The cause of death
      was respiratory failure in nine patients and complications from bleeding
      in the tenth.
    explanation: >-
      Provides prospective natural-history survival duration and cause-of-death
      distribution in 10 NPD-A infants.
  - reference: DOI:10.1186/s13023-024-03234-6
    reference_title: "Acid sphingomyelinase deficiency in France: a retrospective survival study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For patients with ASMD type A, a mortality rate of 93.3% was found at the
      cut-off date, with median OS since birth of 24 months; one patient who was
      reported alive at the cut-off date died 2 years later at the age of 2
      years 7 months.
    explanation: >-
      French 27-hospital survival study establishing 93.3% cut-off mortality and
      median overall survival from birth of 24 months (2.0 years) in NPD-A.

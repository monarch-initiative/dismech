      halt neurodegeneration, high transplant morbidity, and supersession by
      ERT.
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bone marrow transplantation (BMT) has been undertaken in several
      ASM-deficient NPD patients. Reduction in liver and spleen size has been
      documented following BMT, although complications secondary to the
      transplant procedure may be severe [72].
    explanation: >-
      Confirms reduction in hepatosplenomegaly alongside severe transplant-related
      complications in ASM-deficient NPD patients.
definitions:
- name: Clinical case definition of Niemann-Pick disease type A
  definition_type: CASE_DEFINITION
  description: >-
    Niemann-Pick disease type A is the fatal infantile neurovisceral form of acid
    sphingomyelinase deficiency, defined by biallelic SMPD1 loss-of-function variants with
    profound enzyme deficiency (<10% of control activity), early hepatosplenomegaly, and
    rapidly progressive infantile neurodegeneration.
  scope: Disease-level case definition for the severe infantile neuronopathic ASMD subtype.
  evidence:
  - reference: PMID:37069638
    reference_title: "Consensus clinical management guidelines for acid sphingomyelinase deficiency (Niemann-Pick disease types A, B and A/B)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Acid Sphingomyelinase Deficiency (ASMD) is a rare autosomal recessive disorder caused by mutations in the SMPD1 gene."
    explanation: "Anchors the case definition in the SMPD1/ASMD framework."
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Individuals with the severe early-onset form, infantile neurovisceral
      ASMD, were historically diagnosed with Niemann-Pick disease type A
      (NPD-A).
    explanation: >-
      Defines NPD-A as the severe early-onset infantile neurovisceral subtype of
      ASMD.

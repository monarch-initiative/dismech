  evidence:
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hematopoietic stem cell transplantation (HSCT) can correct the metabolic

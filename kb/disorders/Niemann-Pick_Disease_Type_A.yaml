    snippet: "All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1), and thus the disease is more accurately referred to as ASM deficiency (ASMD)."
    explanation: >-
      Establishes SMPD1 mutation and acid sphingomyelinase deficiency as the
      primary cause of NPD type A.
  - reference: PMID:20301544
    reference_title: "Acid Sphingomyelinase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of ASMD is established by detection of biallelic pathogenic
      variants in SMPD1 by molecular genetic testing and residual acid
      sphingomyelinase enzyme activity that is less than 10% of controls (in
      peripheral blood lymphocytes or cultured skin fibroblasts).
    explanation: >-
      Defines the diagnostic biochemical threshold (<10% residual ASM activity)
      resulting from biallelic pathogenic SMPD1 variants.
  - reference: PMID:38397448
    reference_title: "The Genetic Basis, Lung Involvement, and Therapeutic Options in Niemann-Pick Disease: A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "NPD type A and B are caused by mutations in the gene SMPD1 coding for sphingomyelin phosphodiesterase 1, with a consequent lack of acid sphingomyelinase activity."
    explanation: "Confirms the SMPD1/acid sphingomyelinase loss-of-function mechanism."

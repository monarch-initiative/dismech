      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The enzyme defective in types A and B NPD, acid sphingomyelinase (E.C.
        #3.1.4.12), has its highest activity at reduced pH and catalyzes the
        hydrolytic cleavage of sphingomyelin in lysosomes, producing
        phosphocholine and ceramide (N-fatty acylsphingosine) [37,38].
      explanation: >-
        Places NPD-A within inherited disorders of lysosomal sphingolipid
        degradation in the ICIMD nosology.

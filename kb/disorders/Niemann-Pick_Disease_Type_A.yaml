differential_diagnoses:
- name: Niemann-Pick disease type B
  description: >-
    The chronic, non-neuronopathic visceral form of acid sphingomyelinase
    deficiency, sharing biallelic SMPD1 etiology but retaining neuroprotective
    residual enzyme activity with little or no CNS involvement and frequent
    survival into adulthood.
  disease_term:
    preferred_term: Niemann-Pick disease type B
    term:
      id: MONDO:0011871
      label: Niemann-Pick disease type B
  distinguishing_features:
  - Higher residual brain acid sphingomyelinase activity (~5–10% with alleles such as p.Arg608del), absence of infantile neurodegeneration, and frequent survival into adulthood.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Type B patients also have hepatosplenomegaly and pathologic alterations of their lungs, but there are usually no CNS signs."
    explanation: "Type B lacks the profound CNS involvement of type A, distinguishing the two."
- name: Niemann-Pick disease type C
  description: >-
    A clinically overlapping neurovisceral lipid storage disorder caused by
    defective endolysosomal cholesterol trafficking (NPC1 or NPC2) rather than
    primary acid sphingomyelinase deficiency.
  disease_term:
    preferred_term: Niemann-Pick disease type C
    term:
      id: MONDO:0018982
      label: Niemann-Pick disease type C
  distinguishing_features:
  - Caused by biallelic NPC1 or NPC2 cholesterol-trafficking variants rather than SMPD1; leukocyte/fibroblast acid sphingomyelinase activity is normal or only mildly secondarily reduced.
  evidence:
  - reference: PMID:28164782
    reference_title: "Types A and B Niemann-Pick disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the second is due to defective function in cholesterol transport (\"type C\" NPD)"
    explanation: "Type C is a distinct cholesterol-transport defect, not acid sphingomyelinase deficiency."
- name: Gaucher disease
  description: >-
    Allelic-pathway lysosomal sphingolipidosis caused by acid beta-glucosidase
    (GBA1) deficiency that presents with overlapping infantile hepatosplenomegaly,
    cytopenias, marrow storage cells, and (in neuronopathic type 2) rapid
    infantile neurologic decline.
  disease_term:
    preferred_term: Gaucher disease
    term:

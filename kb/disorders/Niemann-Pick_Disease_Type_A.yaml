      often swollen, and the cytoplasm is pale and vacuolated. Within these
      cells are membrane-bound inclusions. There is a loss of cells in the
      cerebral and cerebellar cortices of type A infants, along with gliosis in
      both gray and white matter. Some areas of the white matter show
      demyelination.
    explanation: >-
      Documents human neuropathological hallmarks of NPD-A including cerebral
      and cerebellar cortical cell loss, vacuolated ganglion cells, gliosis,
      and patchy white-matter demyelination.

name: COXFA4-Related COX Deficiency
category: Mendelian
creation_date: '2026-06-24T00:00:00Z'
synonyms:
- COXFA4 deficiency
- NDUFA4 deficiency
- Mitochondrial complex IV deficiency, nuclear type 21
- MC4DN21
- COXFA4-related cytochrome c oxidase deficiency
- NDUFA4-related Leigh syndrome
- COXFA4-related primary mitochondrial disease
description: Autosomal recessive COXFA4-related mitochondrial disease (MC4DN21) is caused by biallelic loss-of-function variants in a nuclear-encoded complex IV subunit formerly called NDUFA4. Splice variants and genomic deletions cause loss of detectable subunit protein and impair late maturation, stability and activity of cytochrome c oxidase. Residual enzyme and partial COXFA4L2 compensation distinguish this from a complete block of core-complex assembly. The spectrum includes Leigh-like encephalopathy, developmental and movement disorders, lactic acidosis and variable cardiac involvement; some individuals have mild developmental disease without established Leigh syndrome. Childhood progression, adult survival and early deaths have all been reported. Cellular paralog rescue and polyamine supplementation in Xenopus remain preclinical findings.
disease_term:
  preferred_term: COXFA4-related COX deficiency (MC4DN21)
  term:
    id: MONDO:0033656
    label: mitochondrial complex IV deficiency, nuclear type 21
parents:
- Mitochondrial Disease
- Inborn Error of Metabolism
pathophysiology:
- name: COXFA4 splice-site single-nucleotide variants
  description: Biallelic intronic SNVs disrupt donor or acceptor sites. The founding c.42+1G>C variant and later donor-2 variants have distinct transcript consequences.
  evidence:
  - &id018
    reference: PMID:23746447
    reference_title: NDUFA4 mutations underlie dysfunction of a cytochrome c oxidase subunit linked to human neurological disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: identified a homozygous splice donor site mutation (c.42+1G → C, NM_002489.3) in NDUFA4
    explanation: The founding intronic SNV is distinct from the resulting four-base RNA retention.
  genes:
  - &id001
    preferred_term: COXFA4
    term:
      id: hgnc:7687
      label: NDUFA4
  genetic_context:
    gene: *id001
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Abnormal COXFA4 splicing
    causal_link_type: DIRECT
    description: Disrupted splice recognition produces intron retention or exon skipping.
    evidence:
    - &id004
      reference: PMID:23746447
      reference_title: NDUFA4 mutations underlie dysfunction of a cytochrome c oxidase subunit linked to human neurological disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: the first 4 bp of intron 1 are retained following activation of a cryptic splice site 4 bp downstream of the c.42+1G → C mutation
      explanation: RNA analysis identifies aberrant donor use; this is not a genomic four-base insertion.
    - &id005
      reference: PMID:42218136
      reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In S1 and S2 (c.131+1 G > C), exon 2 was absent, indicating complete exon skipping compared to controls
      explanation: The donor-2 alleles produce a different RNA consequence from the donor-1 variants.
- name: COXFA4 splice-donor nucleotide deletion
  description: The homozygous c.42+1del allele reported in subject S6 is a one-base genomic deletion at the first donor site. Patient RNA was unavailable for this allele in the 2026 study.
  evidence: &id019
  - reference: PMID:42218136
    reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Confirmation of COXFA4 c.42+1del, c.42+2 T > C, c.42+1 G > C, c.131+1 G > C, and c.131+5 G > A variants was assessed using standard PCR-based sequencing.
    explanation: The small donor deletion is a distinct physical variant class.
  genes:
  - *id001
  genetic_context:
    gene: *id001
    variant_type: deletion
    genomic_contexts:
    - intron
  downstream:
  - target: Loss of COXFA4 protein
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of functional protein is inferred from the splice-site lesion and cohort interpretation; the specific S6 RNA and protein effects remain untested.
    evidence:
    - reference: PMID:42218136
      reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We identified seven novel biallelic COXFA4 variants, including five that disrupt mRNA splicing and two that result in partial or complete gene deletions, all leading to complete loss of COXFA4 protein.
      explanation: The authors classify the donor deletion with loss-of-function alleles; S6 RNA and protein were not directly assayed.
- name: COXFA4 genomic deletions
  description: Reported homozygous deletions remove all or part of COXFA4. The 2025 siblings have deletion of the coding region without another protein-coding gene; the 2026 cohort includes distinct partial and larger whole-gene deletions.
  evidence:
  - &id002
    reference: PMID:39967265
    reference_title: Polyamine metabolism is dysregulated in COXFA4-related mitochondrial disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Exome sequencing revealed a homozygous deletion of 7p21.3 (10933348–10941418, GRCh38) in both siblings that includes the entirety of the coding region of COXFA4 and no other protein-coding genes.
    explanation: A homozygous genomic deletion removes COXFA4 coding sequence in two tested siblings.
  - reference: PMID:42218136
    reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The first deletion spanned 8013 bp and partially overlapped the gene, whereas the second was a larger deletion of 63,856 bp on chromosome 7, which completely overlapped the COXFA4 locus
    explanation: The newer structural variants differ in their extent.
  genes:
  - *id001
  genetic_context:

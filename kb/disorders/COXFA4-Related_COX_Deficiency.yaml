  downstream:
  - target: Reduced mature complex IV accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss of the late-incorporating subunit impairs stable holoenzyme accumulation.
    evidence:
    - &id007
      reference: PMID:42218136
      reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: This analysis revealed a reduction in fully assembled complex IV in all COXFA4-deficient samples
      explanation: BN-PAGE shows reduced assembled enzyme in the assayed patient-derived fibroblasts.
    - &id008
      reference: PMID:42218136
      reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The observation that all COX-containing assemblies still form, although at lower levels, is consistent with this late-stage role.
      explanation: The defect affects late maturation and stable accumulation, rather than preventing all core-complex assembly.
  - target: Increased COXFA4L2 expression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Assayed deficient fibroblasts increase paralog expression through an unresolved regulatory pathway.
    evidence:

- name: Ndufa4-manipulated P19-derived neural cells
  experimental_model_type: CELL_LINE
  description: Retinoic-acid-differentiated mouse embryonal carcinoma cells were used to study Ndufa4 RNA, miR-145a-5p, Homer1/Ccnd2 expression and apoptosis. This Dandy-Walker-oriented experiment does not establish a human MC4DN21 neuronal mechanism; oxygen consumption and ATP generation were not measured.
  publication: PMID:36763283
  evidence:
  - reference: PMID:36763283
    reference_title: Ndufa4 Regulates the Proliferation and Apoptosis of Neurons via miR-145a-5p/Homer1/Ccnd2.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Ndufa4 overexpression promoted the proliferation of neurons and inhibited their apoptosis in vitro, which underwent reverse regulation by the Ndufa4 short hairpin RNAs.
    explanation: The experiment concerns manipulated neural-like cells, not patient neurons.
animal_models:
- name: Xenopus tropicalis coxfa4 F0 mosaic crispants
  species: Xenopus tropicalis
  genotype: CRISPR/Cas9 mosaic loss of coxfa4
  description: Early embryos show reduced cardiac contractility, craniofacial cartilage defects, brain/heart complex IV deficiency and lower polyamines. Polyamines improve cardiac function and survival without correcting complex IV activity; human COXFA4 or COXFA4L2 mRNA provides rescue. Early-stage neurological behavior does not reproduce the full human disease.
  publication: PMID:39967265
  evidence:
  - *id017
  - *id023
  - *id024
  modeled_mechanisms:
  - target: Reduced polyamine abundance in Xenopus
    relationship: RECAPITULATES
    model_scale: ORGANISM
    limitations: Mosaic embryonic model with unproven human treatment translation.
- name: Whole-body Ndufa4-knockout mouse
  species: Mus musculus
  genotype: Constitutive Ndufa4 exon 3–4 deletion generated with Cre/LoxP
  description: The 2023 model shows neuronal injury, increased brain apoptosis and altered behavioral assays. The primary methods specify whole-body knockout, which can confound behavior through systemic respiratory-chain dysfunction. The proposed miR-145a-5p/Homer1/Ccnd2 pathway is not validated in affected humans.
  publication: PMID:36763283
  evidence:
  - reference: PMID:36763283
    reference_title: Ndufa4 Regulates the Proliferation and Apoptosis of Neurons via miR-145a-5p/Homer1/Ccnd2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the whole body knockout of Ndufa4 cannot completely avoid its influence on the behavioral phenotype of mice as a component of the respiratory chain.
    explanation: The authors explicitly acknowledge the systemic-model limitation.
  - reference: PMID:36763283
    reference_title: Ndufa4 Regulates the Proliferation and Apoptosis of Neurons via miR-145a-5p/Homer1/Ccnd2.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: TUNEL staining showed increased apoptosis in the brain tissues of Ndufa4-KO mice compared with WT mice
    explanation: The animal model supports neuronal injury, not a corresponding established human histopathology.

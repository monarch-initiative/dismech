- name: Reduced mature complex IV accumulation
  description: Core assemblies can still form without COXFA4, but late stable holoenzyme accumulation is reduced in patient fibroblasts. Reduced respirasome abundance appears secondary to limited mature complex IV. Earlier patient muscle showed assembled enzyme without abnormal subassemblies.
  evidence:

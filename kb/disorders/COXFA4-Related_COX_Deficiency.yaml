- name: COXFA4-deficient patient fibroblasts
  experimental_model_type: CELL_LINE
  description: Patient primary and immortalized fibroblasts reveal allele-specific splicing, low mature complex IV, reduced respiration and partial COXFA4L2 compensation. Glucose culture can mask deficiency. Complementation with wild-type COXFA4 or its paralog tests causality and residual function.
  publication: PMID:42218136

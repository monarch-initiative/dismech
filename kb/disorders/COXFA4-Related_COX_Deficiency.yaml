- name: Abnormal COXFA4 splicing
  description: Donor-1 variants can retain four intronic RNA nucleotides; donor-2 variants can skip exon 2. Some correctly spliced RNA persists in particular samples. The RNA changes must not be confused with genomic insertion or deletion size.
  evidence:
  - *id004
  - *id005
  genes:
  - *id001
  downstream:
  - target: Loss of COXFA4 protein
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Aberrant transcripts accompany loss of detectable subunit protein; a specific RNA-decay pathway is not established.
    evidence:
    - &id006
      reference: PMID:23746447
      reference_title: NDUFA4 mutations underlie dysfunction of a cytochrome c oxidase subunit linked to human neurological disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: NDUFA4 protein was undetectable in all affected subjects examined
      explanation: Immunoblotting and cellular staining establish loss of detectable protein in the tested muscle and fibroblasts.
- name: Loss of COXFA4 protein
  description: COXFA4 protein is undetectable in the assayed affected muscle and fibroblasts. This structural subunit supports complex IV maturation and activity; it is not a complex I subunit.
  evidence:
  - *id006
  - &id009
    reference: PMID:42218136
    reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Stable expression of wild-type COXFA4 in fibroblasts of S2 (c.131+1 G > C), S4 (c.131+5 G > A), and S5 (c.42+2 T > C, Fig. 6A) significantly restored complex IV activity
    explanation: Patient-cell complementation supports a causal COXFA4 defect.
  genes:

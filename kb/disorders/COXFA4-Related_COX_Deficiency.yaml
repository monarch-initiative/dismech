- name: COXFA4-knockdown SH-SY5Y neuroblastoma cells
  experimental_model_type: CELL_LINE
  description: Stable COXFA4 knockdown induces COXFA4L2, and double depletion worsens respiration. SH-SY5Y is a transformed neuronal-like system; compensation in primary neurons in vivo remains unproven.
  publication: PMID:42218136
  evidence:
  - reference: PMID:42218136
    reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the double KD resulted in a more pronounced reduction in basal respiration compared to COXFA4 KD alone
    explanation: Double depletion provides functional evidence for paralog compensation in this cell line.
  modeled_mechanisms:
  - target: Increased COXFA4L2 expression
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Experimental findings do not establish the complete clinical phenotype.
  - target: Partial paralog compensation

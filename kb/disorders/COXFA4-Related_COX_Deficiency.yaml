diagnosis:
- name: Molecular diagnosis including copy-number analysis
  description: Identify biallelic COXFA4 variants through a mitochondrial-disease workup including sequence and deletion analysis. Family segregation and RNA studies can clarify splice variants. Genome sequencing is preferred when available in general LSS guidance.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - *id018
  - *id002
  - *id003
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK320989/
    reference_title: Nuclear Gene-Encoded Leigh Syndrome Spectrum Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genome sequencing is preferred (if available), as it allows analysis of the mitochondrial and nuclear genome, and typically has the highest diagnostic rate.
    explanation: General LSS guidance covers a genetically heterogeneous differential.
- name: Respiratory-chain enzymology with culture-context interpretation
  description: Reduced complex IV activity supports diagnosis, but a normal glucose-grown fibroblast assay does not exclude COXFA4 deficiency. Galactose culture revealed the defect in a founding patient; biochemical findings vary by tissue.
  evidence:
  - *id010
  - *id026
  - reference: PMID:42218136
    reference_title: COXFA4L2 upregulation preserves residual cytochrome c oxidase activity in COXFA4-related Leigh-like encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Respiratory chain enzyme analyses of muscle tissues (S1, S4, S7, S10 and S14) showed a profound reduction in COX activity.
    explanation: Human muscle enzymology supports tissue complex IV deficiency; the cohort also includes a case with additional respiratory-chain abnormalities.
- name: RNA analysis of splice variants
  description: RT-PCR or RNA sequencing can identify donor-site intron retention, exon skipping and residual correctly spliced transcripts; effects must be assigned to the tested allele and tissue.
  evidence:
  - *id004
  - *id005

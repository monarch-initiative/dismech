- name: COXFA4 deletion-insertion
  description: The 2024 homozygous allele removes the gene and inserts an Alu-rich segment from chromosome 19. Alu sequence homology suggests a rearrangement mechanism, but no single repair pathway was experimentally established.
  evidence:
  - &id003
    reference: PMID:38674434
    reference_title: Biallelic NDUFA4 Deletion Causes Mitochondrial Complex IV Deficiency in a Patient with Leigh Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the patient had a deletion of chr7:10969448–10982428, with 337 bp insertion from chr19:14427161–14427497.
    explanation: Breakpoint sequencing refines the GRCh37 deletion and detects an inserted chromosome-19 segment.
  genes:

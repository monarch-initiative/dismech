- name: Reduced complex IV activity
  description: Complex IV activity is reduced with residual activity retained. The magnitude varies with tissue and culture conditions; normal glucose-grown fibroblast measurements have been reported. COXFA4 supports holoenzyme function rather than catalyzing electron transfer independently.

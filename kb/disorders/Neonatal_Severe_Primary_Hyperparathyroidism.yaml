- name: Hungry Bone Syndrome After Parathyroidectomy
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    A consequence of treatment, not of the untreated disease. After total
    parathyroidectomy the fall in PTH ends osteoclastic resorption while bone
    formation continues, and calcium and phosphate move into the demineralised
    skeleton. Serum calcium and phosphate fall and alkaline phosphatase stays
    raised. The node is provisional because the mechanism is inferred from the adult
    parathyroidectomy literature, where the review authors themselves say it is
    poorly documented.

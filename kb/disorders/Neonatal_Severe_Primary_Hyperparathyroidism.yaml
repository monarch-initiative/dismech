    explanation: Molecular diagnosis decides between NSHPT and milder neonatal hyperparathyroidism.
treatments:
- name: Total Parathyroidectomy
  description: >-
    The definitive treatment, performed once calcium has been lowered medically. All
    four glands are removed, and because supernumerary and ectopic glands occur some
    surgeons add transcervical thymectomy. Whether to autotransplant parathyroid
    tissue is unsettled: in the largest series almost every infant, autotransplanted
    or not, ended up on calcium and vitamin D, and other surgeons avoid
    autotransplantation because of graft-dependent recurrence. Surgery is followed
    by hungry bone syndrome and usually by permanent hypoparathyroidism. It removes
    the parathyroid limb of the disease only; the renal calcium retention persists.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Parathyroidectomy
    term:
      id: NCIT:C51593
      label: Parathyroidectomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  - preferred_term: Elevated circulating parathyroid hormone level
    term:
      id: HP:0003165
      label: Elevated circulating parathyroid hormone level
  target_mechanisms:
  - target: Parathyroid Chief Cell Hyperplasia
    treatment_effect: INHIBITS
    description: Removes the hyperplastic glands that the defective receptor cannot restrain.
    evidence:
    - reference: PMID:32699790
      reference_title: "Neonatal Severe Primary Hyperparathyroidism: A Series of Four Cases and their Long-term Management in India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The key to successful surgery is to identify four parathyroids including ectopic and supernumerary glands."
      explanation: >-
        Surgical series stating that all parathyroid tissue has to be found and removed.
  - target: Unrestrained Parathyroid Hormone Secretion
    treatment_effect: INHIBITS
    description: Removing all parathyroid tissue ends the PTH excess.
    evidence:
    - reference: PMID:37916585
      reference_title: Surgical management of neonatal severe hyperparathyroidism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mean postoperative PTH and calcium levels were 25 ng/L and 1.64 mmol/L, respectively."
      explanation: >-
        Mean PTH fell from 996 ng/L before surgery to 25 ng/L after it in a 19-infant
        series.

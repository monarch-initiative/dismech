      label: G protein-coupled receptor activity
  genes:
  - preferred_term: CASR
    term:
      id: hgnc:1514
      label: CASR
  evidence:
  - reference: PMID:7916660
    reference_title: Mutations in the human Ca(2+)-sensing receptor gene cause familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expressed wild-type receptor elicited large inward currents in response to perfused polyvalent cations; a markedly attenuated response was observed with the mutated protein."
    explanation: >-
      Oocyte expression showing a disease allele signals poorly. The allele
      tested was one identified in FHH individuals, so this supports loss of
      function of disease alleles generally rather than of an NSHPT allele.
  - reference: PMID:7493018
    reference_title: A mouse model of human familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings suggest that Casr mutations cause these human disorders by reducing the number of functional receptor molecules on the cell surface."
    explanation: Casr null mice reproduce NSHPT, supporting loss of functional receptor as the mechanism.
  downstream:
  - target: Raised Parathyroid Calcium Set Point
    causal_link_type: DIRECT
    description: Fewer functional receptors means more calcium is needed to suppress PTH secretion.
  - target: Parathyroid Chief Cell Hyperplasia
    causal_link_type: DIRECT
    description: Loss of the receptor in the parathyroid is followed by hyperplasia of all four glands.
  - target: Increased Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: The receptor also acts in the renal tubule, so its loss acts there directly.
    evidence:
    - reference: PMID:12671052
      reference_title: Rescue of the skeletal phenotype in CasR-deficient mice by transfer onto the Gcm2 null background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, concomitant Gcm2 and CasR deficiency failed to rescue the hypocalciuria in CasR-deficient mice, consistent with direct regulation of urinary calcium excretion by CasR in the kidney."
      explanation: >-
        Removing the parathyroids from Casr-deficient mice did not correct the
        hypocalciuria, so the renal defect follows from receptor loss in the kidney and
        not from the PTH excess.
- name: Raised Parathyroid Calcium Set Point
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The set point is the extracellular calcium concentration at which PTH
    secretion is half-maximally inhibited. Parathyroid cells lacking functional
    receptor read a high calcium as adequate or low, so the homeostatic loop
    defends a much higher calcium.
  cell_types:
  - preferred_term: parathyroid chief cell
    term:
      id: CL:0000446
      label: chief cell of parathyroid gland
  biological_processes:
  - preferred_term: cellular response to calcium ion
    modifier: DECREASED
    term:
      id: GO:0071277
      label: cellular response to calcium ion
  evidence:
  - reference: PMID:32699790
    reference_title: "Neonatal Severe Primary Hyperparathyroidism: A Series of Four Cases and their Long-term Management in India."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The calcium-set point is elevated leading to parathormone (PTH) secretion and renal absorption of calcium."
    explanation: States the raised set point in NSHPT and its two consequences, parathyroid and renal.
  - reference: PMID:9011580
    reference_title: "In vivo and in vitro characterization of neonatal hyperparathyroidism resulting from a de novo, heterozygous mutation in the Ca2+-sensing receptor gene: normal maternal calcium homeostasis as a cause of secondary hyperparathyroidism in familial benign hypocalciuric hypercalcemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Dispersed parathyroid cells from the resected tissue showed a set-point (the level of Ca2+(o) half maximally inhibiting PTH secretion) substantially higher than for normal human parathyroid cells"
    explanation: >-
      Direct measurement of a raised set point in parathyroid cells resected
      from a neonate with CASR-related hyperparathyroidism. The case was
      monoallelic (de novo R185Q), so for biallelic disease this is
      supportive rather than direct.
  downstream:
  - target: Unrestrained Parathyroid Hormone Secretion
    causal_link_type: DIRECT
    description: PTH secretion continues at calcium concentrations that should suppress it.
- name: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: casr_positive_allosteric_modulation#Calcimimetic Occupancy of the Parathyroid Calcium-Sensing Receptor
  description: >-
    Cinacalcet binds the calcium-sensing receptor allosterically and raises its
    sensitivity to extracellular calcium. In this disease the drug can only act on
    whatever mutant receptor reaches the cell surface and still signals, so its
    effect depends on the alleles: in transfected cells calcimimetics restore
    signalling of several disease mutants, and fail on mutants that are not
    expressed at the surface. The relation to the other nodes is pharmacological
    compensation for the receptor defect, not causation, so this node asserts no
    downstream edge.

pathophysiology:
- name: Biallelic CASR Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Two inactivating CASR alleles leave the parathyroid and renal tubule with
    few or no functional calcium-sensing receptors at the cell surface. The
    disease differs from FHH1 in receptor dose rather than in kind.
  genetic_context:
    gene:

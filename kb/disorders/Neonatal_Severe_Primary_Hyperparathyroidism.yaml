    label: neonatal severe primary hyperparathyroidism
synonyms:
- NSHPT
- hyperparathyroidism, neonatal
- neonatal severe hyperparathyroidism
- autosomal recessive neonatal hyperparathyroidism
parents:
- Endocrine disorder
- Disorder of Calcium Metabolism
notes: >-
  Allelic relationship and lump/split. Heterozygous inactivating CASR variants
  cause Familial_Hypocalciuric_Hypercalcemia_1 (MONDO:0007791), which is a
  separate entry and is not merged here. That entry currently carries an NSHPT
  row in has_subtypes with no MONDO binding; this entry, bound to
  MONDO:0009397, is the full curation of the biallelic disease, so that row is a
  candidate pointer (curated_in) rather than a second model of the disease.
  ClinGen curates the neonatal AR disease separately from FHH1 under its
  lumping-and-splitting criteria, which is the split followed here.
  Monoallelic neonatal hyperparathyroidism (a de novo or paternally inherited
  heterozygous variant in a neonate of a normocalcaemic mother) is recorded as a
  subtype because Marx and Sinaii count heterozygous NSHPT as one of the two
  NSHPT genotype/phenotype pairings, but ClinGen excludes these cases from its
  AR curation, so no autosomal dominant inheritance block is bound. Differential
  diagnoses already in the KB: Transient_Neonatal_Hyperparathyroidism (TRPV6,
  placental calcium transport, secondary hyperparathyroidism) and
  Hyperparathyroidism_1 (familial isolated primary hyperparathyroidism of later
  onset). No GeneReviews chapter covers this disease (checked against the
  committed Bookshelf index with just check-genereviews).
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Two inactivating CASR alleles, homozygous (often in consanguineous kindreds)
    or compound heterozygous. Both parents are typically heterozygous carriers
    with FHH1, so a family history of mild hypercalcaemia in the parents is the
    usual pedigree.
  evidence:
  - reference: PMID:8132750
    reference_title: Familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism. Effects of mutant gene dosage on phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each individual who was homozygous for loci that are closely linked to the gene responsible for familial hypocalciuric hypercalcemia had neonatal severe hyperparathyroidism."
    explanation: >-
      Linkage in four consanguineous families: every NSHPT child was homozygous
      at the FHH locus.
  - reference: PMID:8132750
    reference_title: Familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism. Effects of mutant gene dosage on phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a single defective allele causes familial hypocalciuric hypercalcemia, while two defective alleles causes neonatal severe hyperparathyroidism"
    explanation: The gene-dosage conclusion that makes this disease the biallelic form of FHH.
  - reference: CGGV:assertion_095b6507-5537-4017-b2b9-28715cc23df7-2023-07-20T160000.000Z
    reference_title: CASR / neonatal severe primary hyperparathyroidism (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CASR | HGNC:1514 | neonatal severe primary hyperparathyroidism | MONDO:0009397 | AR | Definitive"
    explanation: ClinGen records the mode of inheritance for this gene-disease pair as AR.
has_subtypes:
- name: Biallelic NSHPT
  display_name: Biallelic (homozygous or compound heterozygous) NSHPT
  description: >-
    The classic and ClinGen-curated form. In a pooled analysis of 57 published
    cases, calcium and PTH were higher in homozygotes than in heterozygotes, and
    serum calcium above 4.5 mmol/L occurred only in homozygotes, which the
    authors propose as a biomarker of biallelic dosage that supports early total
    parathyroidectomy.
  evidence:
  - reference: PMID:31778168
    reference_title: "Neonatal Severe Hyperparathyroidism: Novel Insights From Calcium, PTH, and the CASR Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extreme hypercalcemia (above 4.5 mM; normal 2.2-2.6 mM) is a robust biomarker, occurring only in homozygotes (83% of that pairing)."
    explanation: Pooled case-level analysis separating biallelic from monoallelic NSHPT by serum calcium.
- name: Monoallelic NSHPT
  display_name: Monoallelic (heterozygous, de novo or paternally inherited) neonatal hyperparathyroidism
  description: >-
    Reported in neonates carrying one inactivating CASR allele, usually de novo or
    paternally inherited, born to a normocalcaemic mother. Two mechanisms are
    proposed: a dominant-negative effect of the mutant receptor on the wild-type
    one, and fetal secondary hyperparathyroidism because the fetus reads the
    normal maternal calcium as low. These presentations are generally milder than
    biallelic disease and often improve over the first months. Whether they
    belong to this disease is contested: ClinGen excludes them from its AR
    curation because a dominant-negative mechanism has not been proven and a
    second variant in trans cannot be excluded.
  evidence:
  - reference: PMID:31778168
    reference_title: "Neonatal Severe Hyperparathyroidism: Novel Insights From Calcium, PTH, and the CASR Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous and heterozygous NSHPT are 2 among a spectrum of 9 genotype/phenotype pairings relating to CASRs and NSHPT."
    explanation: A pooled case analysis treats heterozygous NSHPT as an NSHPT pairing.
  - reference: PMID:9011580
    reference_title: "In vivo and in vitro characterization of neonatal hyperparathyroidism resulting from a de novo, heterozygous mutation in the Ca2+-sensing receptor gene: normal maternal calcium homeostasis as a cause of secondary hyperparathyroidism in familial benign hypocalciuric hypercalcemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus this de novo, heterozygous CaR mutation may exert a dominant negative action on the normal CaR, producing NHPT and more severe hypercalcemia than typically seen with FBHH."
    explanation: >-
      Co-transfection of R185Q with wild-type receptor shifted the EC50,
      the in vitro basis for the dominant-negative proposal. The authors call
      the case neonatal hyperparathyroidism (NHPT), not NSHPT.
  - reference: PMID:35566721
    reference_title: "Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In these pregnancies, the normocalcemic maternal environment is sensed as hypocalcemic by the fetus and thus induces fetal hyperparathyroidism to support increased fetal calcium levels at the expense of skeletal mineralization."
    explanation: The maternofetal mechanism proposed for severe disease in heterozygous neonates.
  - reference: CGGV:assertion_095b6507-5537-4017-b2b9-28715cc23df7-2023-07-20T160000.000Z
    reference_title: CASR / neonatal severe primary hyperparathyroidism (Definitive)
    supports: REFUTE
    evidence_source: OTHER
    snippet: "However, these are isolated case reports, a dominant-negative disease mechanism has not been proven, and a second causative variant in trans cannot be excluded."
    explanation: >-
      ClinGen's reason for excluding monoallelic cases from this gene-disease
      curation; it contradicts treating a dominant-negative heterozygous
      mechanism as established.

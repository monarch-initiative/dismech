    - reference: PMID:19759318
      reference_title: "Effect of the calcimimetic R-568 [3-(2-chlorophenyl)-N-((1R)-1-(3-methoxyphenyl)ethyl)-1-propanamine] on correcting inactivating mutations in the human calcium-sensing receptor."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that extracellular Ca(2+) was significantly less potent on the mutated receptors compared with wild-type hCaSR."
      explanation: >-
        Eleven NSHPT or FHH mutants showed reduced calcium potency in transfected cells.
  - target: Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: Tests whether a calcimimetic restores signalling or surface expression of a given mutant.
    limitations: >-
      Rescue in these cells has not predicted the clinic reliably: I81K was not
      rescued by any compound, yet a homozygous I81K infant is reported to have
      responded to cinacalcet.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The node is about the parathyroid chief cell; the assay has no chief cell, no
        PTH readout and no renal or skeletal compartment, so a clinical calcium response
        cannot be read from it.
    evidence:
    - reference: PMID:35318962
      reference_title: Personalised medicines for familial hypercalcemia and hyperparathyroidism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We assessed the compounds in CaSR-expressing HEK293 cells for correction of mutation-induced impairments in intracellular calcium (Ca2+i) mobilization and cell surface expression."
      explanation: >-
        Design of the comparison of cinacalcet, evocalcet, etelcalcetide and an
        experimental modulator.
    - reference: PMID:35318962
      reference_title: Personalised medicines for familial hypercalcemia and hyperparathyroidism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "However, no compound rescued expression of I81K and C582R mutants or a receptor missing 77 amino acids in the extracellular domain mimicking deletion of CASRexon 5, which impairs CaSR function."
      explanation: >-
        Mutants that do not reach the cell surface were not rescued by any of the four
        compounds.
    - reference: PMID:18796518
      reference_title: "Novel inactivating mutations of the calcium-sensing receptor: the calcimimetic NPS R-568 improves signal transduction of mutant receptors."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Therefore, calcimimetics might offer medical treatment for symptomatic FHH patients, and more important, for patients with neonatal severe hyperparathyroidism that harbor calcimimetic-sensitive CaSR mutants."
      explanation: >-
        Conclusion of an earlier study in which the research calcimimetic NPS
        R-568 improved signalling of four of seven mutants found in FHH patients.
discussions:
- discussion_id: nshpt_calcimimetic_response_prediction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Can the response to cinacalcet be predicted from the CASR genotype before
    treatment, so that infants who will not respond go to parathyroidectomy without
    delay?
  rationale: >-
    Reported responses range from nine years of monotherapy to none. The proposed
    explanation is residual receptor function, but it has only been tested allele by
    allele in transfected cells, and the cell result and the clinical result
    disagree for at least one allele (I81K). The same allele has also been reported
    as responsive in one infant and unresponsive in another. No registry or
    prospective series relates genotype, dose and response, and no calcimimetic
    other than cinacalcet has been reported in an affected infant.
  attaches_to:
  - treatments#Cinacalcet
  - pathophysiology#Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
  evidence:
  - reference: PMID:35318962
    reference_title: Personalised medicines for familial hypercalcemia and hyperparathyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest specific compounds may be clinically effective in some patients with CaSR mutations, but other patients will remain refractory to treatment with currently available CaSR-targeting activators, highlighting the need for new generation drugs to rescue both the signaling and expression of mutant CaSRs."
    explanation: >-
      The authors' own statement of the gap.
  - reference: PMID:26855056
    reference_title: "Neonatal severe hyperparathyroidism caused by homozygous mutation in CASR: A rare cause of life-threatening hypercalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Though a patient with the same CaSR gene mutation described here has responded to cinacalcet, our patient did not respond and required parathyroidectomy."
    explanation: >-
      Discordant clinical responses for one allele.
  proposed_experiments:
  - experiment_id: nshpt_genotype_response_case_registry
    name: Pooled case-level analysis of genotype, cinacalcet dose and response
    experiment_design: HUMAN_OBSERVATIONAL
    executability: CONCEPTUAL
    description: >-
      Collect every published and registry NSHPT case treated with cinacalcet, with
      both alleles, age at start, maximum dose in mg/kg/day, calcium and PTH before
      and on treatment, and whether surgery followed. Pair each allele with its
      surface-expression and signalling result in transfected cells where one exists.
    would_support:
    - pathophysiology#Calcimimetic Occupancy of Parathyroid Calcium-Sensing Receptors
    supporting_outcome:
    - Response tracks measured residual function or surface expression of the patient's alleles across cases.
    refuting_outcome:
    - Response is unrelated to the in vitro behaviour of the alleles once dose and age at start are accounted for.

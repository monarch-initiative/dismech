- name: Increased Renal Tubular Calcium Reabsorption
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Loss of the receptor in the renal tubule raises the renal calcium threshold,
    so calcium is reabsorbed despite hypercalcaemia and urinary calcium is low.
    After total parathyroidectomy the same defect persists, which is the
    explanation offered for falling calcium and calcitriol requirements in
    long-term follow-up. In Casr-deficient mice the hypocalciuria survives
    removal of the parathyroids or of PTH, so the defect is renal and independent
    of PTH. The tubular segment (thick ascending limb) and the claudin effectors
    come from mouse and FHH1 work and have not been shown in NSHPT, which is why
    the node stays provisional.
  cell_types:
  - preferred_term: thick ascending limb epithelial cell

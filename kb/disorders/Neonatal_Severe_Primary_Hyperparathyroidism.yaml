    description: Measures the signalling and surface expression of individual mutant receptors.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        A kidney-derived cell line expressing one receptor from a plasmid. The
        parathyroid chief cell, its PTH secretory machinery and any tissue-specific
        signalling partners are not in the system, so the readout is receptor signalling
        and not PTH secretion.
    - divergence_type: CAUSE_UNREPRESENTED

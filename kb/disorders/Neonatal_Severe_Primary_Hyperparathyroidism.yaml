- name: Severe Neonatal Hypercalcemia
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Serum calcium far above the neonatal range, characteristically above
    15 mg/dL, presenting in the first days to weeks of life. The non-specific
    features of neonatal hypercalcaemia (hypotonia, poor feeding, constipation,
    polyuria, dehydration, lethargy, failure to thrive) follow from it. That
    those features are caused by the hypercalcaemia, rather than by PTH or bone
    disease directly, is drawn from the general neonatal hypercalcaemia
    literature, not from NSHPT-specific studies.
  evidence:
  - reference: PMID:8132750
    reference_title: Familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism. Effects of mutant gene dosage on phenotype.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neonatal severe hyperparathyroidism is a rare life-threatening disorder characterized by very high serum calcium concentrations (> 15 mg/dl)."
    explanation: Characteristic degree of hypercalcaemia.
  - reference: PMID:33990852
    reference_title: Genetic causes of neonatal and infantile hypercalcaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypercalcaemia presents clinically with a range of symptoms including failure to thrive, poor feeding, constipation, polyuria, irritability, lethargy, seizures and hypotonia."
    explanation: >-
      Review of neonatal hypercalcaemia (all causes) supporting the edges from
      hypercalcaemia to the non-specific clinical features below.
  downstream:

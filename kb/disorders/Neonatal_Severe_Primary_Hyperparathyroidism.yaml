    explanation: Molecular diagnosis decides between NSHPT and milder neonatal hyperparathyroidism.
treatments:
- name: Total Parathyroidectomy
  description: >-
    Generally considered the definitive treatment, performed once calcium has
    been lowered medically. Subtotal parathyroidectomy is not recommended in the
    main review, though an individual case report describes control after
    subtotal resection. Postoperatively, hungry bone syndrome requires calcium
    and calcitriol, and permanent hypoparathyroidism can follow. Ectopic
    parathyroid tissue can cause persistent disease, which is why thymectomy is
    sometimes added.
  treatment_term:
    preferred_term: Parathyroidectomy
    term:
      id: NCIT:C51593
      label: Parathyroidectomy
  therapeutic_modality: SURGERY
  target_phenotypes:
  - preferred_term: Hypercalcemia
    term:
      id: HP:0003072
      label: Hypercalcemia
  target_mechanisms:
  - target: Parathyroid Chief Cell Hyperplasia
    description: Removes the hyperplastic glands that the defective receptor cannot restrain.

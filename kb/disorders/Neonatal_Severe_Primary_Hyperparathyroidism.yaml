name: Neonatal Severe Primary Hyperparathyroidism
creation_date: "2026-11-03T19:15:04Z"
category: Mendelian
description: >-
  Neonatal severe primary hyperparathyroidism (NSHPT) is the biallelic,
  loss-of-function end of the CASR allelic series. Homozygous or compound
  heterozygous inactivating variants in CASR, the parathyroid and renal
  calcium-sensing receptor, remove most or all of the receptor's ability to
  read extracellular calcium. Parathyroid chief cells then keep secreting PTH at
  calcium concentrations that should silence them, all four glands become
  hyperplastic, and the kidney retains calcium rather than excreting it. The
  result, within the first days to weeks of life, is extreme PTH-dependent
  hypercalcaemia with hypocalciuria and hyperparathyroid bone disease:
  demineralisation, fractures and a deformed, bell-shaped chest. Affected infants
  present with hypotonia, poor feeding, dehydration, failure to thrive and
  respiratory distress, and the disease carries a high mortality without
  intervention. Acute management lowers calcium with hydration, diuretics,
  calcitonin and bisphosphonates; the calcimimetic cinacalcet controls some
  cases and fails in others; total parathyroidectomy is generally the definitive
  treatment and is followed by hungry bone syndrome and, usually, permanent
  hypoparathyroidism. The heterozygous counterpart of the same receptor defect
  is familial hypocalciuric hypercalcaemia type 1, a benign lifelong condition
  in which parathyroidectomy is not indicated.
disease_term:
  preferred_term: neonatal severe primary hyperparathyroidism
  term:

animal_models:
- name: Casr knockout mouse (Casr-/-)
  species: Mouse
  genotype: Casr-/-
  publication: PMID:7493018
  modeled_mechanisms:
  - target: Parathyroid Chief Cell Hyperplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      A null allele, whereas many human NSHPT alleles are missense, so the model
      cannot show how residual receptor function (relevant to cinacalcet
      response) alters the course. Affected mice die young, limiting study of
      long-term outcomes.
    evidence:
    - reference: PMID:7493018
      reference_title: A mouse model of human familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Casr-/- mice, like humans with neonatal severe hyperparathyroidism, had markedly elevated serum calcium and parathyroid hormone levels, parathyroid hyperplasia, bone abnormalities, retarded growth and premature death."
      explanation: Null mice reproduce parathyroid hyperplasia and the biochemistry of NSHPT.
  - target: Severe Neonatal Hypercalcemia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: Early lethality limits comparison with treated infants.
    evidence:
    - reference: PMID:7493018
      reference_title: A mouse model of human familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Casr-/- mice, like humans with neonatal severe hyperparathyroidism, had markedly elevated serum calcium and parathyroid hormone levels, parathyroid hyperplasia, bone abnormalities, retarded growth and premature death."
      explanation: Markedly raised serum calcium in null mice.
- name: Casr and Gcm2 double-deficient mouse
  species: Mouse
  genotype: Casr-/- Gcm2-/-
  description: >-
    Casr deficiency bred onto the Gcm2-null background, which lacks parathyroid
    glands. It separates what the parathyroid PTH excess causes from what loss of
    the receptor causes elsewhere.
  publication: PMID:12671052
  modeled_mechanisms:
  - target: Unrestrained Parathyroid Hormone Secretion
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Removing the parathyroids genetically corrects the hyperparathyroidism and
      rescues the perinatal lethality, the experimental counterpart of total
      parathyroidectomy.
    limitations: >-
      The parathyroids are absent from development onward, whereas an infant has weeks
      of PTH excess and established bone disease before surgery, so the model does not
      show hungry bone syndrome or recovery of an already demineralised skeleton.
    evidence:
    - reference: PMID:12671052
      reference_title: Rescue of the skeletal phenotype in CasR-deficient mice by transfer onto the Gcm2 null background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Superimposed Gcm2 deficiency rescued the perinatal lethality in CasR-deficient mice in association with ablation of the parathyroid glands and correction of the severe hyperparathyroidism."
      explanation: >-
        Rescue of lethality by parathyroid ablation.
  - target: Skeletal Demineralization
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The mineralisation defect of bone and cartilage heals when the parathyroids are absent.
    limitations: Mouse skeletal findings are described as rickets and osteomalacia; the human radiographic picture is demineralisation with fractures.
    evidence:
    - reference: PMID:12671052
      reference_title: Rescue of the skeletal phenotype in CasR-deficient mice by transfer onto the Gcm2 null background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, the double homozygous CasR- and Gcm2-deficient mice demonstrated healing of the abnormal mineralization of cartilage and bone associated with CasR deficiency"
      explanation: >-
        Healing of the skeletal phenotype in double-deficient mice.
  - target: Increased Renal Tubular Calcium Reabsorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Hypocalciuria persists without parathyroids, as urinary calcium stays low in patients after total parathyroidectomy.
    limitations: The tubular segment responsible was not localised in this study.
    evidence:
    - reference: PMID:12671052
      reference_title: Rescue of the skeletal phenotype in CasR-deficient mice by transfer onto the Gcm2 null background.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, concomitant Gcm2 and CasR deficiency failed to rescue the hypocalciuria in CasR-deficient mice, consistent with direct regulation of urinary calcium excretion by CasR in the kidney."
      explanation: >-
        Persistent hypocalciuria in double-deficient mice.
experimental_models:
- name: HEK293 cells expressing mutant human CASR
  experimental_model_type: CELL_LINE
  cell_source: Human embryonic kidney 293 cells transfected with wild-type or disease-mutant CASR.
  description: >-
    Heterologous expression of patient CASR variants, read out as intracellular
    calcium mobilisation or inositol phosphate accumulation in response to
    extracellular calcium, with and without calcimimetics. It is the system in which
    calcimimetic rescue of individual disease alleles has been tested.
  organism:

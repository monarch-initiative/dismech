- name: Cinacalcet
  description: >-
    An oral calcimimetic used off-label. It acts on the receptor itself, so it needs
    mutant receptor that reaches the cell surface and can still signal. Reported
    outcomes range from years of control on cinacalcet alone to no response at all.
    Infants with one inactivating allele respond more consistently than infants with
    two, and among biallelic cases the response follows the alleles: missense
    variants with residual function have responded, while a deletion-frameshift and
    a conformation-locking missense variant have not. Because the result cannot be
    predicted reliably, several authors propose a short trial while genetic results
    are awaited. Reported doses were titrated against calcium and PTH, from 0.5
    mg/kg/day up to 8.5 mg/kg/day in two or three divided doses.

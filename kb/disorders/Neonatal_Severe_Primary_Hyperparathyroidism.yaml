  evidence:
  - reference: PMID:7916660
    reference_title: Mutations in the human Ca(2+)-sensing receptor gene cause familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expressed wild-type receptor elicited large inward currents in response to perfused polyvalent cations; a markedly attenuated response was observed with the mutated protein."
    explanation: >-
      Oocyte expression showing a disease allele signals poorly. The allele
      tested was one identified in FHH individuals, so this supports loss of
      function of disease alleles generally rather than of an NSHPT allele.
  - reference: PMID:7493018
    reference_title: A mouse model of human familial hypocalciuric hypercalcemia and neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings suggest that Casr mutations cause these human disorders by reducing the number of functional receptor molecules on the cell surface."
    explanation: Casr null mice reproduce NSHPT, supporting loss of functional receptor as the mechanism.
  downstream:
  - target: Raised Parathyroid Calcium Set Point
    causal_link_type: DIRECT
    description: Fewer functional receptors means more calcium is needed to suppress PTH secretion.
  - target: Parathyroid Chief Cell Hyperplasia
    causal_link_type: DIRECT
    description: Loss of the receptor in the parathyroid is followed by hyperplasia of all four glands.
  - target: Increased Renal Tubular Calcium Reabsorption
    causal_link_type: DIRECT
    description: The receptor also acts in the renal tubule, so its loss acts there directly.
- name: Raised Parathyroid Calcium Set Point
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The set point is the extracellular calcium concentration at which PTH
    secretion is half-maximally inhibited. Parathyroid cells lacking functional
    receptor read a high calcium as adequate or low, so the homeostatic loop
    defends a much higher calcium.

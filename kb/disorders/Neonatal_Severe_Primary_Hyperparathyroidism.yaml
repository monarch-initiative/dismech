    Sequencing of CASR establishes the diagnosis and, by distinguishing
    biallelic from monoallelic disease, guides the choice between definitive
    surgery and observation for spontaneous improvement. Parental calcium and
    CASR status are informative because carrier parents have FHH1.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing

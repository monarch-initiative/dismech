- name: Bisphosphonate (Pamidronate)
  description: >-
    Intravenous pamidronate lowers severe hypercalcaemia and halts skeletal
    demineralisation before parathyroidectomy, and serves as rescue therapy. It does
    not lower PTH. The effect usually lasts one to two weeks and calcium then climbs
    again, sometimes with a rebound rise in PTH, although one homozygous infant
    stayed normocalcaemic on bisphosphonates for 11 months. Reported single doses
    are 0.5 to 1 mg/kg.

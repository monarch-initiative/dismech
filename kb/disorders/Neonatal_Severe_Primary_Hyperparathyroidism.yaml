    so calcium is reabsorbed despite hypercalcaemia and urinary calcium is low.
    After total parathyroidectomy the same defect persists, which is the
    explanation offered for falling calcium and calcitriol requirements in
    long-term follow-up. The tubular segment and effector proteins are inferred
    from FHH1 and mouse work rather than shown in NSHPT.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Neonatal severe hyperparathyroidism (NSHPT) is a rare, life-threatening disorder, with only approximately 100 known reported cases"
    explanation: Case count stated in the introduction of a 2024 case report.
progression:
- phase: Onset
  age_range: Neonatal (first days to weeks of life)
  notes: >-
    Symptomatic hypercalcaemia with muscular weakness, respiratory distress,
    fractures and failure to thrive in the early days of life.
  evidence:
  - reference: PMID:35566721
    reference_title: "Disorders of the Calcium Sensing Signaling Pathway: From Familial Hypocalciuric Hypercalcemia (FHH) to Life Threatening Conditions in Infancy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Infants with NSHPT develop significant and symptomatic hypercalcemia with muscular weakness, respiratory distress, fractures, and failure to thrive in the early days of life"
    explanation: >-
      Review statement of the timing and features of onset.
  - reference: ORPHA:417
    reference_title: "Neonatal severe primary hyperparathyroidism"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Neonatal"
    explanation: >-
      Orphanet natural-history record.
- phase: After total parathyroidectomy
  age_range: From surgery, usually in the first months of life, lifelong
  notes: >-
    Hungry bone syndrome in the days to weeks after surgery, then in most patients
    permanent hypoparathyroidism managed with calcium and active vitamin D. The
    renal calcium retention persists, and supplement requirements can fall over
    years.
  evidence:
  - reference: PMID:37916585
    reference_title: Surgical management of neonatal severe hyperparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultimately, all the patients were required to initiate calcium and vitamin D supplements, except for two patients who had undergone auto-transplantation."
    explanation: >-
      Long-term outcome over a mean six-year follow-up in 19 infants.
  - reference: PMID:42429692
    reference_title: "Long-term follow-up of neonatal severe hyperparathyroidism: redefining calcium management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Over time, calcium and calcitriol requirements progressively decreased despite persistently undetectable PTH, with recurrent episodes of hypercalcemia requiring careful dose adjustments."
    explanation: >-
      Twenty-five-year follow-up of one homozygous patient.

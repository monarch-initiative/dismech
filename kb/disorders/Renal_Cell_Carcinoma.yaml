    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Evasion of cuproptosis through PRR15 silencing and FDX1 repression allows
      transformed renal epithelial cells to escape copper-dependent cell death,
      increasing tumor invasiveness and metastatic progression.
  evidence:
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRR15 promotes cuproptosis and mitochondrial damage in RCC cells and inhibits tumor proliferation and metastasis, as demonstrated in vivo and in vitro. When RCC develops, PRR15 silencing activates the nuclear factor kappa-B (NF-κB) signaling pathway, which inhibits FDX1 expression, ultimately blocking the cuproptosis process and increasing tumor invasiveness."
    explanation: The study demonstrates that PRR15 loss leads to NF-κB activation and FDX1 suppression, blocking cuproptosis and promoting RCC progression.
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "inhibits tumor proliferation and metastasis, as demonstrated in vivo"
    explanation: In vivo studies in RCC xenografts demonstrate that PRR15-mediated cuproptosis suppresses tumor progression.
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When RCC develops, PRR15 silencing activates the nuclear factor kappa-B (NF-κB) signaling pathway, which inhibits FDX1 expression, ultimately blocking the cuproptosis process and increasing tumor invasiveness."
    explanation: Demonstrates the PRR15/NF-κB/FDX1 axis that controls cuproptosis evasion during RCC development.

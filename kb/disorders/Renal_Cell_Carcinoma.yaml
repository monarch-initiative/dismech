discussions:
- discussion_id: gap_rcc_prr15_cuproptosis
  prompt: >-
    PRR15 (Proline-rich 15) was recently reported to suppress renal cell
    carcinoma progression by promoting cuproptosis via an NF-κB/FDX1 axis, yet
    the upstream signals that silence PRR15 during tumorigenesis, the functional
    hierarchy of the PRR15/NF-κB/FDX1 axis, and the relevance of impaired
    cuproptosis to therapy resistance remain unknown. Which signals trigger PRR15
    loss, is PRR15 a direct or indirect regulator of NF-κB, and is PRR15 loss a
    driver or passenger event in RCC?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Renal Epithelial Malignancy
  - pathophysiology#Histologic and Molecular Heterogeneity
  rationale: >-
    Cuproptosis, a copper-dependent regulated cell death, contributes to RCC
    proliferation, metastasis, and drug-resistance with Ferredoxin 1 (FDX1) as a
    core regulator. Ma et al. (2026) report that PRR15 promotes cuproptosis and
    mitochondrial damage in RCC cells and that PRR15 silencing activates NF-κB,
    which represses FDX1 and blocks cuproptosis, increasing tumor invasiveness.
    However, the upstream events that drive PRR15 loss in developing RCC are not
    defined, leaving open whether PRR15 silencing is a tumor-initiating driver or
    a passenger consequence of malignant transformation. It is also unresolved
    whether PRR15 regulates NF-κB directly or through intermediate effectors, and
    whether the same axis operates across the histologic and molecular subtypes
    of RCC. Finally, the contribution of cuproptosis evasion to resistance
    against conventional and targeted RCC therapies is unknown. Resolving these
    gaps would clarify whether the PRR15/NF-κB/FDX1 axis is a tractable
    therapeutic target and a biomarker of RCC aggressiveness.
  proposed_experiments:
  - experiment_id: exp_rcc_prr15_silencing_triggers
    name: Identify upstream triggers and driver/passenger status of PRR15 silencing
    description: >-
      Profile PRR15 expression, promoter methylation, copy-number, and mutation
      status across primary RCC tumors and matched normal kidney, stratified by
      histologic and molecular subtype. Combine with engineered restoration or
      knockout of PRR15 in RCC cell lines and orthotopic xenografts to test
      whether PRR15 loss is sufficient to initiate or accelerate malignant
      progression versus arising downstream of established transformation, and
      whether candidate upstream signals (e.g., inflammatory cytokine exposure,
      epigenetic silencing) suppress PRR15.
    experiment_type:
      preferred_term: integrative molecular profiling with functional perturbation
    readouts:
    - name: PRR15 silencing mechanism across subtypes
      target: pathophysiology#Histologic and Molecular Heterogeneity
      description: >
        Quantify PRR15 expression, promoter methylation, and genomic alterations
        across RCC subtypes to determine the dominant silencing mechanism and
        whether it is subtype-specific.
      assays:
      - preferred_term: bisulfite sequencing
      - preferred_term: RNA sequencing
      direction: NEGATIVE
    - name: Tumorigenic consequence of PRR15 manipulation
      target: pathophysiology#Renal Epithelial Malignancy
      description: >
        Measure proliferation, invasion, and metastatic burden after PRR15
        restoration or knockout to test whether PRR15 loss is a driver of
        malignant progression.
      assays:
      - preferred_term: orthotopic xenograft tumor growth assay
      - preferred_term: transwell invasion assay
      direction: POSITIVE
    decision_criterion: >-
      PRR15 loss is supported as a driver if its restoration suppresses, and its
      knockout enhances, tumor proliferation/invasion in vivo, and if a
      reproducible upstream silencing mechanism (e.g., promoter hypermethylation)
      is identified in primary tumors with low PRR15. A predominantly passenger
      role is supported if PRR15 manipulation does not alter tumor behavior
      despite axis perturbation.
    would_support:
    - pathophysiology#Renal Epithelial Malignancy
    - pathophysiology#Histologic and Molecular Heterogeneity
  evidence:
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PRR15 promotes cuproptosis and mitochondrial damage in RCC cells"
    explanation: >-
      Establishes the cell-based finding that PRR15 promotes cuproptosis and
      mitochondrial damage in RCC cells, motivating the gap around how PRR15 is
      silenced and its driver/passenger status.
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "inhibits tumor proliferation and metastasis, as demonstrated in vivo"
    explanation: >-
      Reports the in vivo (xenograft) tumor-suppressive effect of PRR15,
      separating the animal-model evidence for tumor suppression from the
      cell-based cuproptosis mechanism.
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "When RCC develops, PRR15 silencing activates the nuclear factor kappa-B (NF-κB) signaling pathway, which inhibits FDX1 expression, ultimately blocking the cuproptosis process and increasing tumor invasiveness."
    explanation: >-
      Defines the PRR15/NF-κB/FDX1 axis whose upstream triggers and direct-versus-
      indirect mechanism remain the central knowledge gap.
- discussion_id: prr15_upstream_triggers
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cuproptosis via PRR15/NF-κB/FDX1 Axis
  prompt: What upstream signals or mutations trigger PRR15 silencing during RCC development and progression?
  rationale: >-
    The study demonstrates that PRR15 loss is associated with RCC progression and altered NF-κB/FDX1 cuproptosis signaling.
    However, the cellular or molecular events that trigger PRR15 silencing remain unknown. Identifying these upstream triggers
    would clarify whether PRR15 loss is a driver mutation, a passenger consequence of other RCC-initiating events, or a
    context-dependent response to specific RCC subtypes or microenvironmental pressures.
  evidence:
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    snippet: "However, the role of PRR15 in cuproptosis and its molecular mechanisms remain unknown."
    explanation: The gap statement directly from the paper indicates the unknown nature of PRR15 upstream regulation and mechanistic roles.
- discussion_id: prr15_nfkb_direct_indirect
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cuproptosis via PRR15/NF-κB/FDX1 Axis
  prompt: Is PRR15 a direct NF-κB inhibitor or does it regulate NF-κB signaling through intermediate mechanisms?
  rationale: >-
    The regulatory relationship between PRR15 and NF-κB pathway activation is incompletely characterized at the molecular level.
    PRR15 could directly inhibit NF-κB signaling via protein-protein interaction, suppress it indirectly through effects on upstream
    activators, or modulate it through other signaling modules. Mechanistic clarity would support rational therapeutic targeting
    strategies and predict which RCC contexts would benefit from PRR15 restoration or NF-κB inhibition.
  evidence:
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    snippet: "This study reveals for the first time the regulatory mechanism of the PRR15/NF-κB/FDX1 axis in cuproptosis in RCC, providing a new strategy for the treatment of RCC patients."
    explanation: The authors emphasize this is the first mechanistic characterization of the PRR15-NF-κB-FDX1 axis, indicating important details remain unresolved.
- discussion_id: prr15_therapy_resistance
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Cuproptosis via PRR15/NF-κB/FDX1 Axis
  prompt: Does PRR15-mediated cuproptosis suppression contribute to resistance against conventional and targeted RCC therapies?
  rationale: >-
    Given that cuproptosis blockade promotes tumor invasiveness and drug resistance formation in RCC, it is unclear whether
    PRR15 loss-driven cuproptosis impairment specifically confers resistance to cytotoxic therapies, VEGF/HIF-2α-targeted inhibitors,
    immunotherapy, or multi-targeted combinations. Understanding this relationship would refine patient stratification and treatment selection,
    potentially guiding rational combination therapies that restore cuproptosis via PRR15 restoration or direct cuproptosis inducers.
  evidence:
  - reference: PMID:41673093
    reference_title: "PRR15 suppresses renal cell carcinoma progression via the NF-κB/FDX1 axis to induce cuproptosis and mitochondrial dysfunction."
    supports: SUPPORT
    snippet: "Cuproptosis is involved in the proliferation, metastasis, and drug resistance formation development of renal cell carcinoma (RCC) by regulating lipid metabolism and oxidative stress levels in the tumor microenvironment, with Ferredoxin 1 (FDX1) as a core regulator."
    explanation: The abstract identifies cuproptosis dysfunction as relevant to drug resistance formation, but the PRR15-specific contribution to resistance against specific therapy classes is not addressed.
- discussion_id: gap_mrcc_gut_microbiota_checkpoint_response
  prompt: >-
    Does gut microbiota composition causally determine immune checkpoint
    inhibitor response in metastatic renal cell carcinoma, or does it track a
    host immune state set by something else? In the only randomized test to
    date, adding the live biotherapeutic CBM588 to nivolumab-ipilimumab was
    followed by a large progression-free survival difference while the trial's
    microbiome primary endpoint went unmet, so no measured microbial change
    currently explains the clinical effect, and the taxa, metabolites, and
    immune steps that would connect a gut community to intratumoral checkpoint
    sensitivity remain unidentified.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
  - pathophysiology#Immune Evasion
  - treatments#Immune Checkpoint Inhibitor Combination Therapy
  rationale: >-
    This entry models checkpoint sensitivity as a property of the tumor immune
    microenvironment with no host-external input. A candidate input exists: gut
    microbiota composition is repeatedly reported as a correlate of checkpoint
    inhibitor efficacy across tumor types, and in metastatic renal cell
    carcinoma specifically, a randomized phase 1 trial of nivolumab-ipilimumab
    with or without CBM588 reported a median progression-free survival of 12.7
    versus 2.5 months favouring the supplemented arm. The mechanistic problem is
    that the same trial detected no significant change in Bifidobacterium spp.
    or in Shannon diversity - the measurement that was supposed to carry the
    mechanism. A benefit whose proposed mediator did not move leaves three live
    possibilities the current data cannot separate: an unmeasured microbial or
    metabolite change, a microbiota-independent effect of the product, or a
    chance result in a 30-patient open-label study. Until one is established,
    curating a gut-microbiota node upstream of checkpoint sensitivity would
    assert a causal edge the evidence does not support. The cross-disease review
    that prompted this discussion makes the same point structurally: gut
    composition is emerging as a predictive marker, but the field's primary
    obstacle is a lack of methodological standardization that generates
    observational inconsistency and complicates causal inference.
  proposed_experiments:
  - experiment_id: exp_mrcc_microbiota_checkpoint_mediation_trial
    name: Mediation-powered randomized live-biotherapeutic trial with paired stool and tumor immune profiling
    description: >-
      Repeat the CBM588 randomization at a sample size powered for mediation
      rather than for a single-taxon abundance endpoint, in treatment-naive
      metastatic renal cell carcinoma receiving nivolumab-ipilimumab. Collect
      paired longitudinal stool shotgun metagenomes and fecal metabolomes
      together with on-treatment tumor biopsies, and test formally whether any
      microbial or metabolite feature mediates the progression-free survival
      difference. Include a heat-inactivated product arm to separate live
      colonization from formulation and placebo effects.
    experiment_type:
      preferred_term: randomized controlled trial with causal mediation analysis
    readouts:
    - name: Microbial or metabolite mediator of the progression-free survival difference
      target: pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
      description: >-
        Fraction of the progression-free survival difference attributable to a
        prespecified microbial taxon or fecal metabolite, estimated by causal
        mediation analysis over paired longitudinal samples.
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: untargeted fecal metabolomics
    - name: Intratumoral effector T cell infiltration on treatment
      target: pathophysiology#Immune Evasion
      description: >-
        Change in CD8-positive effector T cell density and exhaustion-marker
        expression in on-treatment biopsies, compared between the supplemented
        and control arms.
      assays:
      - preferred_term: multiplex immunofluorescence
      - preferred_term: single-cell RNA sequencing
      direction: INCREASED
    decision_criterion: >-
      A gut-microbiota input to checkpoint sensitivity is supported if a
      microbial or metabolite feature significantly mediates the progression-free
      survival difference AND that feature tracks with increased intratumoral
      effector T cell infiltration. It is not supported if the clinical benefit
      reproduces in the heat-inactivated arm, or if no measured microbial feature
      mediates it - in which case the effect belongs outside the microbiota axis
      and the trial result should be treated as unexplained.
    would_support:
    - pathophysiology#Immune Microenvironment and Checkpoint Sensitivity
  evidence:
  - reference: PMID:35228755
    reference_title: "Nivolumab plus ipilimumab with or without live bacterial supplementation in metastatic renal cell carcinoma: a randomized phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PFS was significantly longer in patients receiving nivolumab-ipilimumab
      with CBM588 than without (12.7 months versus 2.5 months, hazard ratio 0.15,
      95% confidence interval 0.05-0.47, P = 0.001).
    explanation: >-
      The clinical signal that makes a microbiota input to checkpoint response
      worth modeling at all in this disease.
  - reference: PMID:35228755
    reference_title: "Nivolumab plus ipilimumab with or without live bacterial supplementation in metastatic renal cell carcinoma: a randomized phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary endpoint to compare the relative abundance of Bifidobacterium
      spp. at baseline and at 12 weeks was not met, and no significant
      differences in Bifidobacterium spp. or Shannon index associated with the
      addition of CBM588 to nivolumab-ipilimumab were detected.
    explanation: >-
      The core of the gap: the proposed microbial mediator did not measurably
      change, so the trial does not identify a mechanism linking the product to
      the survival difference.
  - reference: PMID:35228755
    reference_title: "Nivolumab plus ipilimumab with or without live bacterial supplementation in metastatic renal cell carcinoma: a randomized phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Larger studies are warranted to confirm this clinical observation and
      elucidate the mechanism of action and the effects on microbiome and immune
      compartments.
    explanation: >-
      The investigators themselves treat both the clinical effect and its
      mechanism as unconfirmed, which is the gap recorded here.
  - reference: PMID:42426614
    reference_title: "Microbiota-mediated modulation of the tumor microenvironment in urological cancers: crosstalk between gut and intratumoral microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The composition of the gut microbiota is emerging as a potential
      predictive marker for ICI efficacy, as the enrichment of certain
      beneficial taxa has been linked to favorable outcomes.
    explanation: >-
      Review-level synthesis that the gut-composition-to-checkpoint-response
      link is predictive and emerging rather than mechanistically established.
  - reference: PMID:42426614
    reference_title: "Microbiota-mediated modulation of the tumor microenvironment in urological cancers: crosstalk between gut and intratumoral microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A primary challenge is the lack of methodological standardization, which
      generates observational inconsistencies and complicates causal inference.
    explanation: >-
      Names the barrier that keeps this gap open across all three urological
      cancers, and motivates specifying the proposed experiment around formal
      mediation rather than another abundance-endpoint trial.
  notes: >-
    Recorded from monarch-initiative/dismech#6383. Originally attached to the
    former Metastatic_Renal_Cell_Carcinoma entry (folded into this entry per
    design decisions §3a) because checkpoint sensitivity and
    checkpoint-inhibitor combination therapy are modeled on those nodes, and
    the randomized evidence is in treatment-naive metastatic disease. The two
    PMID:42426614 items carry `evidence_source: OTHER` because that publication
    is a narrative review making a field-level synthesis claim rather than
    reporting primary data; see monarch-initiative/dismech#8184.

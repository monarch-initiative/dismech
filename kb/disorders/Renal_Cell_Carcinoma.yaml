environmental:
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  notes: Smoking increases RCC risk and may contribute to aggressive disease biology.
  evidence:
  - reference: PMID:15523697
    reference_title: "Renal cell carcinoma in relation to cigarette smoking: meta-analysis of 24 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The relative risk (RR) for RCC for ever smokers as compared to lifetime never smokers was 1.38 (95% confidence interval [CI] = 1.27-1.50)"
    explanation: Meta-analysis of 24 studies quantifies smoking's association with renal cell carcinoma risk.
- name: Obesity
  notes: Obesity is a major RCC risk factor and influences inflammatory and metabolic signaling.
  evidence:
  - reference: PMID:24615287
    reference_title: "Body mass index and risk of renal cell cancer: a dose-response meta-analysis of published cohort studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared to normal weight, the pooled relative risks and the corresponding 95% confidence intervals of RCC were 1.28(1.24-1.33) for preobesity and 1.77(1.68-1.87) for obesity, respectively"
    explanation: Dose-response meta-analysis of cohort studies quantifies obesity's association with renal cell carcinoma risk.
classifications:
  icdo_morphology:
    classification_value: Carcinoma
    notes: >-
      Derived from this entry's disease term MONDO:0005086 (renal cell
      carcinoma), whose NCI Thesaurus counterpart NCIT:C9385 (Renal Cell
      Carcinoma) is a descendant of NCIT:C2916 (Carcinoma), the term this enum
      value is bound to. NCIT also places NCIT:C9385 under NCIT:C224634 (Urinary
      System Adenocarcinoma), and ICD-O codes renal cell carcinoma NOS as 8312/3
      within the adenocarcinoma block, so the more specific ``Adenocarcinoma``
      value is defensible; ``Carcinoma`` is recorded here as the conservative
      assignment matching contemporary clinical and WHO usage, which does not
      call renal cell carcinoma an adenocarcinoma.
    evidence:
    - reference: PMID:36831657
      reference_title: "Downstream Targets of VHL/HIF-α Signaling in Renal Clear Cell Carcinoma Progression: Mechanisms and Therapeutic Relevance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clear cell variant of renal cell carcinoma (ccRCC) is the most common renal epithelial malignancy"
      explanation: >-
        Identifies renal cell carcinoma as an epithelial malignancy, which is
        what the ICD-O carcinoma morphology axis records.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Metastatic renal cell carcinoma is managed as a solid-tumor oncology
      problem (VEGF-directed and checkpoint-inhibitor therapy).

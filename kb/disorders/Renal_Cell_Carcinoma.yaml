      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Renal Cell Carcinoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001004208
  title: Pancreatic tropism of metastatic renal cell carcinoma
  description: Renal cell carcinoma (RCC) is characterized by a particularly broad metastatic swath, and enigmatically, when the pancreas is a destination, the disease is associated with improved survival. Intrigued by this observation, we sought to characterize the clinical behavior, therapeutic implications, and underlying biology. While pancreatic metastases (PM) are infrequent, we identified 31 patients across two institutional cohorts and show that improved survival is independent of established prognostic variables, that these tumors are exquisitely sensitive to anti-angiogenic agents and resistant to immune checkpoint inhibitors (ICI), and that they are characterized by a distinctive biology.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Renal Cell Carcinoma"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001004386
  title: Bulk RNAseq gene expression of baseline tumors from metastatic urothelial bladder cancer patients (IMvigor210) and metastatic renal cell carcinoma (IMmotion150)
  description: We examined tumors from a large cohort of patients with metastatic urothelial bladder cancer (mUC) and metastatic renal cell carcinoma (mRCC) treated with an anti-PD-L1 agent (atezolizumab) and found that high tumor IL8 gene expression was associated with worse overall survival (OS). We further identified the tumoral immune presence based on Teff signature. We found that high tumor IL8 expression continued to be associated with worse OS even in inflamed tumors in mUC and mRCC.

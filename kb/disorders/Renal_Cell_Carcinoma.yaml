  relationship: CANONICAL_PATHWAY
  note: >-
    KEGG renal cell carcinoma pathway. Metastasis-specific biology is carried by the Tumor Cell Invasion and Hematogenous Dissemination nodes (the former Metastatic_Renal_Cell_Carcinoma entry was folded in).
description: >-
  Renal cell carcinoma is the most common form of kidney cancer arising from
  renal epithelial cells.
stages:
- name: Localized
  description: >-
    Disease confined to the kidney or locoregional nodes, where radical or
    partial nephrectomy with or without adjuvant therapy is potentially
    curative.
- name: Metastatic
  description: >-
    Advanced RCC with dissemination most commonly to lung, bone, liver, and
    brain. Clear cell biology predominates and is driven by VHL loss, HIF
    stabilization, intense angiogenesis, and context-dependent immune
    responsiveness that has made checkpoint blockade a core therapy in modern
    metastatic RCC.
  notes: >-
    Folded in from the former Metastatic_Renal_Cell_Carcinoma entry (cancer
    granularity ladder, design decisions §3a). Lung and bone are common
    metastatic destinations, but the dominant mechanistic theme is still
    VHL-HIF-driven angiogenic biology layered with heterogeneous immune
    responsiveness; the Tumor Cell Invasion and Hematogenous Dissemination
    pathophysiology nodes carry the stage-specific mechanism content.
  evidence:
  - reference: PMID:28882737
    reference_title: "Five-year Survival of Patients With Metastatic Renal Cell Carcinoma in the Russian Federation: Results From the RENSUR5 Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 1-, 3-, and 5-year OS rate was 49.4%, 18.9%, and 8.2%, respectively.
    explanation: Provides a long-term real-world survival estimate for the metastatic stage of RCC.
pathophysiology:
- name: Renal Epithelial Malignancy
  description: >-
    Malignant transformation of renal epithelial cells gives rise to renal cell
    carcinoma with diverse molecular subtypes.
  evidence:

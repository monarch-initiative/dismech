computational_models:
- name: RCC 3D Agent-Based Learning Model
  description: >-
    Spatial three-dimensional agent-based simulation of established renal cell
    carcinoma, immune-cell populations, sex-hormone effects, and ICI or TKI
    treatment rules. A genetic algorithm evolves synthetic tumor-cell genotypes,
    while Optuna tunes model parameters against overall-survival and survival-status
    outcomes from selected ARON registry cases.
  model_type: AGENT_BASED
  repository_url: https://github.com/marco-caputo/RCC-agent-learning-model/tree/40220d6c398d90b41971f102acb9f84838982601
  model_id: "GitHub:marco-caputo/RCC-agent-learning-model@40220d6c398d90b41971f102acb9f84838982601"
  base_model: OncoAgent RCC obesity-paradox agent-based learning model (PMID:33996779)
  model_software: Python 3.13; Mesa 3.2.0; Optuna; Solara 1.48.0; pythreejs 2.4.2
  model_format: Custom imperative Python/Mesa source (not SBML or CellML); Jupyter Notebook (IPYNB); CSV patient input
  publication: PMID:42064045
  variables:
  - name: Patient sex
    dataset_identifier: sex
    description: Biological-sex input used to initialize hormone and immune-cell rules.
  - name: Treatment regimen
    dataset_identifier: treatment
    description: Model input selecting ICI, TKI, combined ICI plus TKI, or no treatment.
  - name: Treatment start
    dataset_identifier: treatment_start
    description: Simulation step at which the selected treatment begins.
    unit: simulation step
  - name: Tumor-cell count
    dataset_identifier: Tumor Cells
    description: Number of spatial tumor-cell agents collected during a simulation.
    unit: cells
  - name: Simulated overall survival
    dataset_identifier: steps
    description: Number of simulation steps before the modeled stopping outcome.
    unit: simulation steps
  - name: Mean tumor mutation mask
    dataset_identifier: average_mutation_mask
    description: >-
      Mean binary mutation profile across the simulated tumor-cell population,
      used to summarize within-model genetic adaptation.
    unit: fraction
  modeled_mechanisms:
  - target: Renal Epithelial Malignancy
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      The model simulates expansion or regression of an established RCC tumor-cell
      population under spatial immune pressure, evolving tumor-cell rules, and ICI
      or ICI-plus-TKI treatment.
    fidelity: LOW
    limitations: >-
      The simulation begins with generic tumor cells and does not model renal
      epithelial transformation, kidney anatomy, or a specified RCC histology. It
      was tuned and assessed on the same seven selected cases without a held-out or
      external cohort. Sex is perfectly confounded with regimen in those cases: all
      three male records received ICI and all four female records received ICI plus
      TKI. Immune concentrations were estimated, simulation steps and tumor-count
      thresholds are not calibrated clinical endpoints, and the synthetic mutation
      system does not reproduce patient RCC genomes.
    readouts:
    - name: Simulated tumor-cell burden trajectory
      target: Renal Epithelial Malignancy
      description: >-
        Tumor-cell counts change over time according to the initialized case,
        stochastic seed, immune interactions, tumor adaptation, and treatment rules.
      direction: ALTERED
      interpretation: >-
        This is a model-specific trajectory rather than a validated measure of
        clinical tumor volume or treatment efficacy.
      evidence:
      - reference: PMID:42064045
        reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          Female models showed delayed initial responses but stronger late immune
          activation and rapid tumor regression, whereas male models exhibited more
          stable early responses but greater tumor resilience driven by genetic
          adaptations.
        explanation: >-
          Reports differing tumor-response trajectories across the model's
          sex-and-regimen strata.
    evidence:
    - reference: PMID:42064045
      reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        This study enhanced an agent-based learning model (ALM) to simulate RCC
        progression and treatment response by integrating hormonal effects, immune
        interactions, and tumor genetic adaptation with data-driven tuning.
      explanation: >-
        Establishes that RCC progression and treatment response are represented in
        the computational model.
  evidence:
  - reference: PMID:42064045
    reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      An RCC-specific ALM was developed incorporating immune agents (CD8+, NK, Treg,
      dendritic cells), hormone-sensitive mechanisms, tumor genetic modules, and
      effects of immune checkpoint inhibitors (ICIs) and tyrosine kinase inhibitors
      (TKIs).
    explanation: >-
      Identifies the disease-specific agent-based model and its main simulated
      components.
  findings:
  - statement: >-
      Female-model runs showed delayed initial responses followed by stronger late
      immune activation and rapid regression, whereas male-model runs showed steadier
      early responses but greater modeled tumor resilience.
    evidence:
    - reference: PMID:42064045
      reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Female models showed delayed initial responses but stronger late immune
        activation and rapid tumor regression, whereas male models exhibited more
        stable early responses but greater tumor resilience driven by genetic
        adaptations.
      explanation: >-
        Reports the exploratory sex-and-regimen-stratified simulation result without
        establishing a clinical sex effect.
  - statement: >-
      Parameter tuning used seven RCC records and 26 Optuna trials for each objective;
      the paper reports lower aggregate prediction MSE and increasingly stable CI,
      without held-out validation.
    evidence:
    - reference: PMID:42064045
      reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        From this collection of data, we manually filtered the subset of patients
        affected by RCC as part of the preprocessing, consisting of 7 subjects—3
        males and 4 females.
      explanation: Gives the complete RCC subset used for parameter optimization.
    - reference: PMID:42064045
      reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We conducted a total of 26 optimization trials with each fitness function,
        enabling the system to iteratively converge toward more accurate
        configurations.
      explanation: Reports the number of optimization trials for each objective.
    - reference: PMID:42064045
      reference_title: An agent-based learning model integrating sex differences in renal cell carcinoma.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The adaptive learning procedure yielded promising improvements in both
        training procedures: the optimized parameter sets achieved a significant
        reduction in prediction MSE compared to the baseline results obtained using
        manually tuned defaults, while the trend of CI over trials shows increasing
        stability towards fitter configurations of parameters.
      explanation: >-
        Supports the aggregate training-metric result; the same records were used for
        tuning and assessment.
  notes: >-
    The GitHub repository is pinned at unsigned commit
    40220d6c398d90b41971f102acb9f84838982601 (tree
    acfe9582f716869dc965aad04c11f279a5c13470) and has no tags or releases. Zenodo
    record 10.5281/zenodo.18727138 archives software version 1.0.0 as RCC-ALM.zip
    (SHA-256 4e7c38b570916555fac9fd422f0e5b8d52c5ebd2f8c93a708f3b0dedf4745358),
    although pyproject.toml calls the package 0.1.0; all 72 archived files are
    byte-identical to the pinned Git tree. Software Heritage directory
    swh:1:dir:570c82c75e1f417940762d4d66706f3467df706c contains the matching inner
    Git-tree directory, but no revision object for the commit resolves, so it preserves
    deposited content rather than Git history. The repository LICENSE and Zenodo
    software record are MIT. The upstream ARON-1 dataset is Zenodo DOI
    10.5281/zenodo.13353313 under CC BY 4.0. The repository contains three
    byte-identical copies of a derived seven-row, 19-column CSV (SHA-256
    aef040b2d21069fcdb58aca45a3331fa03c85c2dfadf6b9d5e8bc713cbf1d585), but does
    not cite that DOI, state data-specific attribution or licensing, or provide the
    manual selection and conversion procedure. Curator smoke testing installed the
    requirements under Python 3.13.9, constructed and advanced the 643-agent default
    model, exercised a small data pipeline, and completed the documented 100-step
    non-GUI command. That command emits only console traces and does not reproduce a
    paper result. Reproducibility remains partial: dependencies are not fully pinned or
    locked; the documented Solara interface fails with the resolved unbounded
    Starlette version; the built wheel omits required package data and uses incompatible
    src.* imports outside the checkout; and the analysis notebook has no executed
    outputs or reference results. There are 83 tuned weights for seven non-held-out
    cases. The MSE result-loading code mistakenly reloads CI parameters, repeat-count
    handling is defective, stochastic antigen selection depends on Python hash
    ordering, and a class-global tumor blood-source list can contaminate repeated runs.
    The model is exploratory and hypothesis-generating, not a clinically validated
    patient digital twin. Generic mutation adaptation does not justify linking it to
    the entry's histologic-and-molecular-subtype node, and it does not encode the
    PRR15/NF-κB/FDX1 cuproptosis mechanism.

- name: Susceptibility to Severe and Opportunistic Infection
  biological_scale: ORGANISM
  description: >-
    Without functional T-cell immunity the patients cannot control common or
    opportunistic pathogens. The reported infections are recurrent pneumonia from
    infancy, cytomegalovirus viraemia in all three siblings of the first kindred,
    adenovirus, varicella, Candida pneumonia, congenital toxoplasmosis,
    Epstein-Barr viraemia, and in the youngest sibling urinary infections and
    gastroenteritis. Two of the three died of infection or its consequences, one of
    disseminated CMV while awaiting transplant.

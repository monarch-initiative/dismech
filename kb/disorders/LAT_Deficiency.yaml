genetic:
- name: LAT
  gene_term:
    preferred_term: LAT
    term:
      id: hgnc:18874
      label: LAT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    LAT encodes the linker for activation of T cells, a transmembrane adaptor with
    a short extracellular segment, a transmembrane domain and a long cytoplasmic
    tail carrying the tyrosines Y132, Y171, Y191 and Y226. All reported
    disease-causing alleles are homozygous truncating variants that remove some or
    all of those tyrosines: c.268_269delGG in exon 5, an independent frameshift
    abolishing protein expression, and p.Y207fsTer33. The c.268_269delGG transcript
    is present at normal levels and the truncated protein can be expressed from a
    transgene, so this is a loss of adaptor function rather than a loss of the
    transcript.
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      12 homozygous variants remained, but only chr16:28997725 deletion (del) GG
      (RefSeq accession no. NM_001014987.1: c.268_269del) segregated with the
      disease in the family.
    explanation: >-
      Establishes the causal allele by segregation in the first kindred.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The relative amount of LAT mRNA in patient’s sorted CD4 CD45R0 T cells was
      within the range of three different healthy controls (Fig. 2 C), indicating
      that the mutation does not interfere with transcript stability.
    explanation: >-
      Shows the transcript is stable, which locates the defect in the protein's
      adaptor function.
diagnosis:
- name: Whole exome sequencing
  description: >-
    The diagnosis in every reported case was molecular. Exome sequencing identified
    the causal homozygous variant in the first kindred and in the Iranian SCID
    series, with Sanger confirmation in the parents; the second pedigree was solved
    by homozygosity mapping followed by Sanger sequencing of LAT.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:37516813
    reference_title: "Clinical, immunological and molecular findings of 8 patients with typical
      and atypical severe combined immunodeficiency: identification of 7 novel mutations by whole
      exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, all variants were confirmed in patients and their parents as a
      heterozygous state by Sanger sequencing.
    explanation: >-
      Describes the exome-plus-Sanger route by which the LAT variant in this
      series was identified and confirmed in the family.
  - reference: PMID:27522155
    reference_title: Mutations in linker for activation of T cells (LAT) lead to a novel form
      of severe combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping was used to identify potential defective genes.
    explanation: >-
      The alternative route used in the consanguineous SCID pedigree, which
      narrowed the search before Sanger sequencing of LAT.
- name: Flow cytometric assessment of LAT protein expression
  description: >-
    LAT protein was undetectable by flow cytometry with an antibody against the
    intracytoplasmic part of the protein in the index patient's CD4 T cells, while
    the heterozygous sibling showed normal levels in most cells. The assay
    separates affected from carrier, but note it reads the cytoplasmic region, so a
    truncated protein that is still made will read as absent.
  diagnosis_term:
    preferred_term: immunological flow cytometry
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The LAT protein, however, could not be detected by flow cytometry using an
      antibody directed against the intracytoplasmic part of LAT in CD4 T cells
      (Fig. 2 D) and by Western blotting of patient-derived EBV lines using a
      polyclonal antibody against LAT (not depicted).
    explanation: >-
      Documents the flow cytometric finding and the antibody's target, which is
      what the caveat in the description rests on.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only reported treatment that addresses the disease rather than its
    complications. The index patient of the first kindred was transplanted at eight
    years from a fully matched heterozygous sibling; at one year the graft showed
    full donor chimerism with resolution of the opportunistic infections and the
    autoimmune cytopenias and clearance of the skin infiltrates, off
    immunosuppression. This is one transplanted patient with one year of follow-up,
    so it establishes feasibility rather than long-term outcome.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Impaired T Cell Activation and Proliferation
    treatment_effect: RESTORES
    description: >-
      Donor-derived lymphocytes carry intact LAT and can assemble the TCR
      signalosome.
  - target: Loss of LAT-Dependent Restraint on T Cell Responses
    treatment_effect: RESTORES
    description: >-
      Replacing the LAT-deficient T-cell compartment removed the autoimmune
      cytopenias and the skin infiltrates in the transplanted patient.
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 1-yr follow-up demonstrated full donor chimerism, resolution of

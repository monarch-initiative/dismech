    notes: >-
      The IUIS 2024 update lists LAT deficiency in Table 1 (immunodeficiencies
      affecting cellular and humoral immunity), in the T-B+ severe combined
      immunodeficiency subtable. Its row carries both ends of the reported
      spectrum in one entry: typical SCID, or a combined immunodeficiency with
      adenopathy, splenomegaly, recurrent infection and autoimmunity. That the
      committee treats these as one condition is the basis for curating them as
      one dismech entry rather than splitting the SCID and CID presentations.

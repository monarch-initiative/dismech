notes: >-
  Ultra-rare. Every claim about patients in this entry rests on three published
  kindreds: three siblings of an Israeli Arab consanguineous family homozygous for
  LAT c.268_269delGG (Keller et al., J Exp Med 2016), a pedigree with a homozygous
  frameshift abolishing LAT expression (Bacchelli et al., JACI 2017, which reports
  affected family members without giving a count in its abstract), and one patient
  homozygous for LAT p.Y207fsTer33 in an eight-patient SCID exome series (Alizadeh
  et al., Genes Immun 2023). `frequency` is
  deliberately left unset on every phenotype: with a denominator this small any
  enum value would assert a population rate that no source supports, and the
  evidence `explanation` says instead how many patients showed a finding.

  The two presentations were curated as one entry rather than split. IUIS 2024
  carries typical SCID and the CID-with-autoimmunity picture in a single row, and
  the truncating variants behind them remove the same cytoplasmic tyrosines, so
  there is no second pathomechanism to separate. Whether the difference is
  allelic, modifier-driven or an artefact of when the patients were ascertained
  cannot be answered from three kindreds; it is recorded as an open question in
  `discussions` rather than as a `has_subtypes` split.

  No GeneReviews chapter exists for LAT deficiency: `just check-genereviews`
  reports NO_CHAPTER against the committed Bookshelf index with the synonyms above
  in place. The phenotype baseline here is therefore the primary literature, and
  the great majority of it is the Keller kindred, the only report with full-text
  clinical and immunological detail.

  The umbrella entry `Severe_Combined_Immunodeficiency` carries LAT as one of its
  causal gene rows. That entry is untouched here; this one is the gene-specific
  pathomechanism it points at.

  Sibling entries in the same signalling chain are already curated: ZAP70
  deficiency (`ZAP70_Deficiency`, the kinase that phosphorylates LAT) and
  CD3gamma deficiency (`Combined_Immunodeficiency_Due_To_CD3gamma_Deficiency`,
  upstream at the receptor). Keller et al. note the clinical resemblance to ZAP70,
  ITK and LCK deficiency and what separates each: the prominent CD8 reduction in
  ZAP70 deficiency, the absent calcium signal in ITK deficiency, and the preserved
  ERK signal in LCK deficiency. The ERK-abolished, calcium-preserved pattern is
  what distinguishes LAT deficiency from those.

  LAT is expressed in mast cells, natural killer cells, megakaryocytes, platelets
  and early B cells as well as T cells, and no patient has been studied for
  platelet or mast-cell function. The one non-T lineage with human data is the NK
  compartment, whose degranulation was reduced but not absent. The gap is recorded
  in `discussions` rather than filled by inference from expression data.

  No `conforms_to` module was declared. `kb/modules/` was searched (`ls
  kb/modules/`, plus `rg -il "T cell receptor|TCR signal" kb/modules`) for a TCR
  signalling or lymphocyte activation module and none exists. If one is ever
  written, this entry, ZAP70 deficiency and CD3gamma deficiency are its first
  conformers.

  Three things the deep-research report proposed are deliberately not curated
  here, because no source ties them to this disease rather than to severe combined
  immunodeficiency in general: detection by TREC newborn screening, the standard
  SCID supportive-care package (Pneumocystis prophylaxis, irradiated and CMV-safe
  blood products, avoidance of live vaccines), and survival figures taken from
  general SCID transplant cohorts. Eosinophilia is omitted for a different reason:
  it is a feature of the LatY136F mouse, and no eosinophil count is reported for
  any patient.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients are homozygous for truncating LAT variants; the first
    kindred was born to consanguineous parents of Arab origin, and in the third
    report the parents were confirmed heterozygous by Sanger sequencing.
    Heterozygous carriers are clinically well; in the
    Keller kindred the heterozygous parents and sister had normal lymphocyte
    subsets, normal immunoglobulins and normal TCR-induced phosphorylation of
    ZAP-70, ITK and ERK, arguing against a dominant-negative effect of the
    truncated protein.
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we describe the first kindred with defective LAT signaling
      caused by a homozygous mutation in exon 5, leading to a premature stop codon
      deleting most of the cytoplasmic tail of LAT, including the critical
      tyrosine residues for signal propagation.
    explanation: >-
      Establishes homozygosity for a truncating LAT allele in the first reported
      kindred, which is the basis for the recessive classification.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In T cells of the heterozygous parents and sister, the phosphorylation of
      ZAP70, ITK, ERK, and Ca2+ mobilization was found to be normal (not
      depicted), indicating that there is no dominant-negative effect of the
      mutation in the heterozygous situation.
    explanation: >-
      Documents normal TCR signalling in carriers, which is what makes the
      inheritance recessive rather than dominant-negative.

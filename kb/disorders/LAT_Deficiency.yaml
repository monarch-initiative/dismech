pathophysiology:
- name: Biallelic LAT Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous truncating LAT variants. The reported alleles are the exon 5
    two-base deletion c.268_269delGG, which frameshifts at codon 89 and truncates
    the protein after 100 of 233 residues; an independent frameshift producing a
    premature stop codon with complete loss of LAT protein expression; and
    p.Y207fsTer33. All remove some or all of the cytoplasmic tyrosines. The
    c.268_269delGG transcript is present at normal levels and the truncated
    protein can be expressed from a transgene, so the lesion is in the protein's
    adaptor function rather than in transcription.
  genes:
  - preferred_term: LAT
    term:
      id: hgnc:18874
      label: LAT
    modifier: LOSS_OF_FUNCTION
  genetic_context:
    description: >-
      Germline biallelic truncating LAT alleles, homozygous in every reported
      patient, with the parents heterozygous and unaffected wherever they were
      tested.
    allelic_events:
    - FRAMESHIFT_VARIANT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation caused a deletion of guanosines 268/269 in exon 5 of LAT,
      leading to a frame shift and a premature stop codon after 303 bp (Fig. 2
      A).
    explanation: >-
      Identifies the specific frameshift allele segregating with disease in the
      first reported kindred.
  - reference: PMID:27522155
    reference_title: Mutations in linker for activation of T cells (LAT) lead to a novel form
      of severe combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing of the LAT gene showed a mutation that resulted in a
      premature stop codon and protein truncation leading to complete loss of
      function and loss of expression of LAT in the affected family members.
    explanation: >-
      Documents an independent truncating allele that abolishes LAT expression,
      establishing loss of function as the disease mechanism.
  - reference: PMID:37516813
    reference_title: "Clinical, immunological and molecular findings of 8 patients with typical
      and atypical severe combined immunodeficiency: identification of 7 novel mutations by whole
      exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutations include RAG2 (p.I273T,p.G44X), IL7R (p.F361WfsTer17), ADA
      (c.780+1G>A), JAK3 (p.Q228Ter), LIG4 (p.G428R), and LAT (p.Y207fsTer33)
    explanation: >-
      Adds a third truncating LAT allele from an independent SCID cohort, so the
      allelic spectrum is not confined to one family.
  downstream:
  - target: Loss of the LAT Cytoplasmic Phosphotyrosine Docking Sites
    causal_link_type: DIRECT
    description: >-
      Truncation removes the cytoplasmic tail carrying the phosphorylation sites,
      so no docking platform can be built regardless of upstream kinase activity.
    evidence:
    - reference: PMID:27242165
      reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
        loss-of-function mutation in LAT.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The predicted protein of 100 of the 233 aa contains an intact
        extracellular and transmembrane region but a shortened intracellular
        region, eliminating the known major phosphorylation sites Y132, Y171,
        Y191, and Y226.
      explanation: >-
        States exactly what the variant removes, which is the step from allele to
        loss of the docking sites.

- name: Loss of the LAT Cytoplasmic Phosphotyrosine Docking Sites
  biological_scale: MOLECULAR
  description: >-
    LAT works by being phosphorylated. ZAP-70, activated at the engaged receptor,
    phosphorylates the tyrosines of the LAT cytoplasmic tail; the resulting
    phosphotyrosine motifs are SH2-domain binding sites for PLC-gamma1, Grb2 and
    Gads, with Gads in turn recruiting SLP-76. Truncated LAT retains its
    extracellular and transmembrane segments and reaches the membrane but presents
    no phosphotyrosines, so the adaptor function is lost while upstream events are
    untouched: ZAP-70 phosphorylation is normal in cells expressing the mutant
    protein.
  genes:
  - preferred_term: LAT
    term:
      id: hgnc:18874
      label: LAT
    modifier: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: signaling adaptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0035591
      label: signaling adaptor activity
  - preferred_term: SH2 domain binding
    modifier: DECREASED
    term:
      id: GO:0042169
      label: SH2 domain binding
  evidence:
  - reference: PMID:9489702
    reference_title: "LAT: the ZAP-70 tyrosine kinase substrate that links T cell receptor to
      cellular activation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that this protein is phosphorylated by ZAP-70/Syk protein tyrosine
      kinases leading to recruitment of multiple signaling molecules.
    explanation: >-
      The original identification of LAT as the ZAP-70 substrate whose
      phosphorylation recruits downstream molecules, which is the function the
      truncation removes.
  - reference: PMID:26354432
    reference_title: "The linker for activation of T cells (LAT) signaling hub: from signaling
      complexes to microclusters."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These Tyr(P) motifs serve as binding sites for SH2 domain-containing
      proteins, including PLC-γ1, Grb2, and Gads (14–16), allowing the nucleation
      of multiple signaling complexes on LAT, which are essential for downstream
      signaling.
    explanation: >-
      Names the partners the phosphotyrosine motifs recruit, which is what the
      patients' truncated protein cannot do. Graded OTHER with quote_role
      REVIEW_SYNTHESIS because the sentence is a review's synthesis of work it did
      not perform.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      After CD3 cross-linking, similar TCR-proximal ZAP70 phosphorylation was
      observed in LAT-deficient, LATwt-, and LATmut-expressing T cell lines (Fig.
      3 A).
    explanation: >-
      Shows the lesion is at the adaptor and not upstream of it: the kinase that
      phosphorylates LAT is activated normally in cells carrying the patient
      allele.
  downstream:
  - target: Failure of TCR Signalosome Assembly
    causal_link_type: DIRECT
    description: >-
      With no phosphotyrosines to dock on, the PLC-gamma1 and Gads-SLP-76
      complexes cannot be nucleated at the membrane.

- name: Failure of TCR Signalosome Assembly
  biological_scale: MOLECULAR
  description: >-
    The multiprotein complex that normally forms on phosphorylated LAT does not
    assemble. In cells reconstituted with the patient allele the measurable
    consequence is that PLC-gamma1 phosphorylation is absent, because PLC-gamma1
    recruitment depends on the LAT-SLP-76 signalosome. This is where a single
    receptor signal would ordinarily be diversified into the calcium and Ras-ERK
    arms, and it is the step the disease removes.
  biological_processes:
  - preferred_term: T cell receptor signaling pathway
    modifier: DECREASED
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In line with the literature that PLCγ1 phosphorylation depends on the
      assembly of the LAT-SLP76 signalosome (Smith-Garvin et al., 2009), PLCγ1
      phosphorylation was absent in J.CaM2.5 and J.CaM2.5-LATmut cells (Fig. 3
      A).
    explanation: >-
      Demonstrates in LAT-deficient Jurkat cells reconstituted with the patient
      allele that the signalosome-dependent step fails.
  - reference: PMID:27522155
    reference_title: Mutations in linker for activation of T cells (LAT) lead to a novel form
      of severe combined immunodeficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrate loss of LAT expression and lack of TCR signaling
      restoration in LAT-deficient cell lines reconstituted with a synthetic LAT
      gene bearing this severe combined immunodeficiency mutation.
    explanation: >-
      An independent reconstitution experiment showing the patient allele cannot
      restore TCR signalling, which is the functional definition of this node.
  - reference: PMID:17534068
    reference_title: Th2 lymphoproliferative disorders resulting from defective LAT signalosomes.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      LAT coordinates the assembly of a multiprotein signalling complex through
      phosphotyrosine-based motifs present within its intracytoplasmic segment.
      The resulting 'LAT signalosome' links the TCR to the main intracellular
      signalling pathways that regulate T cell development and T cell function.
    explanation: >-
      States what the signalosome is and what it connects, which is the structure
      this node says fails to form.
  downstream:
  - target: Abolished TCR-Induced ERK Activation
    causal_link_type: DIRECT
    description: >-
      The Grb2-SOS arm that drives Ras-ERK is recruited through the same
      phosphotyrosine motifs.
  - target: Arrest of Thymic T Cell Development
    causal_link_type: DIRECT
    description: >-
      Pre-TCR and TCR signals that drive thymocyte maturation pass through the
      same adaptor.
  - target: Loss of LAT-Dependent Restraint on T Cell Responses
    causal_link_type: DIRECT
    description: >-
      LAT carries negative as well as positive regulatory modules, so its loss
      removes a brake at the same time as it removes the signal.
  - target: Reduced Cytotoxic Degranulation
    causal_link_type: DIRECT
    description: >-
      Signalling through LAT is beneficial, though not essential, for granule
      release by cytotoxic lymphocytes.

- name: Abolished TCR-Induced ERK Activation
  biological_scale: MOLECULAR
  description: >-
    ERK phosphorylation after receptor cross-linking is absent both in the
    patients' own T cells and in cells reconstituted with the patient allele. This
    is the branch of the cascade the human disease loses cleanly, and it is what
    distinguishes LAT deficiency from the neighbouring T-cell signalling defects:
    the calcium and NF-kappaB arms are preserved in the patients' residual T cells
    while ERK is not.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: DECREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the reported nonredundant role of LAT in Ca(2+) mobilization,
      residual T cells were able to induce Ca(2+) influx and nuclear factor (NF)
      κB signaling, whereas extracellular signal-regulated kinase (ERK) signaling
      was completely abolished.
    explanation: >-
      States the selective loss of ERK signalling in patient T cells alongside
      preserved calcium and NF-kappaB responses.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the phosphorylation of ERK was absent in LATmut-expressing CD4 T cell
      subpopulations (Fig. 4 C)
    explanation: >-
      The measurement behind the node, made directly in the patient's CD4 T cells.
  downstream:
  - target: Impaired T Cell Activation and Proliferation
    causal_link_type: DIRECT
    description: >-
      ERK output is required for the activation programme that follows receptor
      engagement.

- name: Arrest of Thymic T Cell Development
  biological_scale: CELLULAR
  description: >-
    LAT is required for the signals that carry thymocytes through development. In
    mice the requirement is absolute and the block sits at the CD25+CD44- DN3
    stage, with no peripheral T cells at all. In people the block is partial and
    variable: one pedigree had absent T cells with preserved B and NK cells, a
    T-B+NK+ SCID immunophenotype, while in the kindred with the exon 5 truncation T
    cells were present in normal numbers at presentation and fell over years. Both
    are recorded here; the species difference is taken up in `discussions`.
  biological_processes:
  - preferred_term: T cell differentiation in thymus
    modifier: DECREASED
    term:
      id: GO:0033077
      label: T cell differentiation in thymus
  cell_types:
  - preferred_term: thymocyte
    term:
      id: CL:0000893
      label: thymocyte
  evidence:
  - reference: PMID:27522155
    reference_title: Mutations in linker for activation of T cells (LAT) lead to a novel form
      of severe combined immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a pedigree affected by a severe combined immunodeficiency
      phenotype with absent T cells and normal B-cell and natural killer cell
      numbers.
    explanation: >-
      The human end of the claim: a LAT-mutant pedigree with no T cells and intact
      B and NK compartments.
  - reference: PMID:10204488
    reference_title: Essential role of LAT in T cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Flow cytometric analysis revealed normal B cell populations but the absence
      of any mature peripheral T cells. Intrathymic development was blocked within
      the CD4- CD8- stage.
    explanation: >-
      Establishes where in thymic development the requirement for LAT sits. Graded
      INDIRECT because the stage of the block is shown in mice and the human block
      is demonstrably less complete.
  downstream:
  - target: Severe combined immunodeficiency
    causal_link_type: DIRECT
    description: >-
      Absent thymic output produces the T-negative, B-positive, NK-positive SCID
      presentation.
  - target: Decreased total T cell count
    causal_link_type: DIRECT

- name: Loss of LAT-Dependent Restraint on T Cell Responses
  biological_scale: CELLULAR
  description: >-
    The counterintuitive arm of the disease. LAT is not only a positive conductor
    of receptor signals; it is also a negative regulator of TCR signalling and
    T-cell homeostasis, and T cells deprived of it mount self-perpetuating
    responses. Mouse genetics shows this directly: deleting LAT from post-thymic
    CD4 T cells, or replacing the PLC-gamma1 docking tyrosine, produces a
    lymphoproliferative disorder with excessive cytokine production and
    autoantibodies rather than a quiescent immunodeficiency, and the expansion is
    receptor-independent rather than driven by self-reactive clones. The patients
    show the corresponding clinical picture, with lymphoproliferation and severe
    autoimmune cytopenias from the first year of life.
  biological_processes:
  - preferred_term: T cell homeostasis

animal_models:
- name: Lat-null mouse
  species: Mouse
  genotype: Lat knockout (Lat-/-)
  publication: PMID:10204488
  description: >-
    The original null model. Thymocyte development is blocked within the
    CD4-CD8- double-negative compartment and no mature peripheral T cells appear,
    while B cells are normal. It established that LAT is required for T-cell development,
    and its block is more complete than any human patient's.
  modeled_mechanisms:
  - target: Arrest of Thymic T Cell Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the requirement for LAT in thymic development, and locates the
      checkpoint, but at a severity the human disease does not reach.
    limitations: >-
      Mice lacking LAT, and mice in which all four cytoplasmic tyrosines are
      replaced, have no peripheral T cells at all. Patients homozygous for an
      allele that removes the same four tyrosines still produce mature T cells,
      and in one kindred those T cells were present in normal numbers for years. A
      study reading peripheral T-cell numbers off this model would describe a more
      absolute deficit than patients have.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The murine developmental block is complete at the DN3 stage; the human
        block is partial and variable despite an allele that removes the same four
        phosphorylation sites. No compensating adaptor has been found to explain
        the difference, so the divergence is unexplained rather than attributable
        to a known paralogue.
    evidence:
    - reference: PMID:10204488
      reference_title: Essential role of LAT in T cell development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Flow cytometric analysis revealed normal B cell populations but the
        absence of any mature peripheral T cells. Intrathymic development was
        blocked within the CD4- CD8- stage.
      explanation: >-
        States the model's developmental block and its stage, which is the claim
        this link makes.
    - reference: PMID:27353087
      reference_title: Human LAT mutation results in immune deficiency and autoimmunity but also
        raises questions about signaling pathways.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Germline deletion of LAT in mice results in profound early thymocyte
        developmental arrest, resulting in complete absence of peripheral T cells.
      explanation: >-
        A commentary stating the mouse phenotype in the sentence that contrasts it
        with the patients, which is what the limitation records.
  evidence:
  - reference: PMID:10204488
    reference_title: Essential role of LAT in T cell development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To probe the role of LAT in T cell development, the LAT gene was disrupted
      by targeting.
    explanation: >-
      Establishes how the model was made.
- name: LatY136F knock-in mouse
  species: Mouse
  genotype: Lat Y136F knock-in (homozygous)
  publication: PMID:12065840
  description: >-
    A knock-in replacing the PLC-gamma1 docking tyrosine and leaving the other
    three intact. Unlike the null, these mice pass the developmental block
    partially and then accumulate type 2 helper T cells, developing a polyclonal
    lymphoproliferative disorder, hypergammaglobulinaemia and systemic autoimmunity
    with nephritis. It is the model that made the immunodeficiency-with-autoimmunity
    combination intelligible, and it is a closer counterpart to the human CID
    presentation than the null is.
  modeled_mechanisms:
  - target: Loss of LAT-Dependent Restraint on T Cell Responses
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the central paradox of the human disease: an allele that impairs
      receptor signalling produces lymphoproliferation and autoimmunity rather than
      immunological silence.
    limitations: >-
      The mouse allele removes one docking tyrosine, whereas the patients' alleles
      truncate the whole tail, so the model is not genotype-matched. The murine
      disease is also dominated by nephritis and by IgE and IgG1
      hypergammaglobulinaemia, while the patients' autoimmunity is principally
      haematological and their immunoglobulins fall over years.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Systemic autoimmune nephritis with severe proteinuria dominates the murine
        disease; no patient developed nephritis, and the reported human
        autoimmunity is haematological.
    evidence:
    - reference: PMID:12065840
      reference_title: A LAT mutation that inhibits T cell development yet induces lymphoproliferation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice homozygous for a single tyrosine mutation in LAT (linker for
        activation of T cells) exhibited an early block in T cell maturation but
        later developed a polyclonal lymphoproliferative disorder and signs of
        autoimmune disease.
      explanation: >-
        States the model's combination of developmental block and later
        lymphoproliferative autoimmunity, which is the mechanism this link
        attributes to it.
    - reference: PMID:18209052
      reference_title: Th2 lymphoproliferative disorder of LatY136F mutant mice unfolds independently
        of TCR-MHC engagement and is insensitive to the action of Foxp3+ regulatory T cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This abnormal status confers Lat(Y136F) CD4 T cells with the ability to
        trigger the production of Abs and of autoantibodies in a TCR-independent,
        quasi-mitogenic fashion.
      explanation: >-
        Characterises the mechanism as receptor-independent rather than
        autoreactive, which is what the node claims about loss of restraint.
  - target: Th2 Effector Skewing
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The type 2 skew is reproduced in full, and was described in the model before
      it was observed in patients.
    limitations: >-
      The model's type 2 response drives tissue eosinophilia and massive IgE and
      IgG1 plasma cell maturation; in patients it was demonstrated as constitutive
      IL-4 production by CD4 and gamma-delta T cells, with raised IgE recorded in
      only one of the three siblings.
    evidence:
    - reference: PMID:12065839
      reference_title: Induction of T helper type 2 immunity by a point mutation in the LAT adaptor.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This exaggerated TH2 differentiation caused tissue eosinophilia and
        massive maturation of plasma cells secreting to immunoglobulins of the E
        and G1 isotypes.
      explanation: >-
        Describes the type 2 phenotype of the model that this link cites it for.
  - target: Polyclonal B Cell Activation and Autoantibody Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Supplies the step from aberrant helper T cells to polyclonal, non-antigen
      driven B-cell activation and systemic autoimmunity.
    limitations: >-
      The autoimmune target organ differs: the model develops nephritis with IgE
      autoantibody deposits and severe proteinuria, whereas the patients'
      autoantibody disease was directed at blood cells and, in one, at ADAMTS13.
    evidence:
    - reference: PMID:16887989
      reference_title: The Th2 lymphoproliferation developing in LatY136F mutant mice triggers
        polyclonal B cell activation and systemic autoimmunity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These results show that Th2 cells developing in Lat(Y136F) mice can
        trigger polyclonal B cell activation and thereby lead to systemic
        autoimmune disease.
      explanation: >-
        States the causal step from the helper T-cell abnormality to polyclonal
        B-cell activation and autoimmunity.
  evidence:
  - reference: PMID:12065840
    reference_title: A LAT mutation that inhibits T cell development yet induces lymphoproliferation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results identify a critical role for integrated PLC-gamma1 and Ras-Erk
      signaling through LAT in T cell development and homeostasis.
    explanation: >-
      The model's own conclusion about what the mutated docking site does, which
      establishes what the model is a model of.
discussions:
- discussion_id: mouse_null_overstates_the_human_developmental_block
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can the LAT-null mouse be used to predict the T-cell compartment of a person
    with LAT deficiency, when the same loss of all four cytoplasmic tyrosines
    abolishes peripheral T cells in the mouse but not in patients?
  attaches_to:
  - pathophysiology#Arrest of Thymic T Cell Development
  - animal_models#Lat-null mouse
  rationale: >-
    This is the mismatch the first human report was built around, and it is not a
    difference of degree at the margins. Mice lacking LAT, and mice in which all
    four tyrosines are replaced by phenylalanine, arrest at the DN3 stage and have
    no peripheral T cells. The patients in the first kindred carry an allele that
    removes those same four tyrosines and still had mature T cells in normal
    numbers at presentation, with the numbers falling only over subsequent years.

    Two candidate explanations were tested and neither survived. A compensating
    adaptor was sought: SIT, TRIM, LAX, LIME and PAG were not differentially
    expressed in the patients' T cells, NTAL/LAB protein was undetectable, and CD6
    transduced into LAT-deficient Jurkat cells did not restore calcium
    mobilisation. Reversion of the mutation and alternative splicing were both
    excluded, by sequencing of sorted T cells and by RNA sequencing. So the
    residual development is unexplained rather than explained by a known
    substitute.

    The practical consequence is narrow enough to use. The null mouse is
    informative about where in thymic development LAT acts and about what the
    adaptor does biochemically; it is not informative about how many T cells a
    patient will have, nor about anything that depends on having a peripheral
    T-cell compartment, which includes the whole autoimmune arm of the human
    disease. For that arm the tyrosine knock-in strains are the better read.
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LAT knockout mice (Zhang et al., 1999b) and mice with targeted replacement
      of all four tyrosine residues (Sommers et al., 2001) lack peripheral T cells
      because of a block at the double-negative 3 stage, whereas in humans, T
      cells lacking all four equivalent tyrosine residues were still present,
      although with a severely disturbed differentiation.
    explanation: >-
      States both halves of the mismatch in one sentence, naming the mouse alleles
      that produce the complete block.
  - reference: PMID:27353087
    reference_title: Human LAT mutation results in immune deficiency and autoimmunity but also
      raises questions about signaling pathways.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is possible that some LAT-related molecule might compensate for the loss
      of LAT function in the human, but efforts to identify such molecules were
      not productive.
    explanation: >-
      Records that the obvious explanation was looked for and not found, which is
      why the mismatch is left open.
- discussion_id: residual_calcium_and_nfkb_signalling_is_unexplained
  kind: KNOWLEDGE_GAP
  prompt: >-
    How do patient T cells lacking all four LAT phosphotyrosines still mobilise
    calcium and activate NF-kappaB after receptor cross-linking, when the same
    allele abolishes both in a reconstituted LAT-deficient T-cell line?
  attaches_to:
  - pathophysiology#Failure of TCR Signalosome Assembly
  - pathophysiology#Abolished TCR-Induced ERK Activation
  rationale: >-
    Calcium mobilisation downstream of the receptor is supposed to require
    PLC-gamma1 recruited to the LAT phosphotyrosine at position 132. In the
    patients' own memory CD4 and CD8 T cells, and in their gamma-delta T cells,
    calcium flux after CD3 cross-linking was within the range of healthy controls
    across independent experiments, and IkappaB-alpha degradation proceeded
    normally, while ERK phosphorylation was absent. The same patient allele
    expressed in LAT-deficient Jurkat cells abolished calcium flux, so this is a
    difference between primary human T cells and the cell line rather than between
    the mutant and the wild-type protein.

    A partial account exists for why ERK and calcium come apart: the three distal
    tyrosines recruit Grb2-SOS1 and are required for Ras activation, so a route to
    PLC-gamma1 that bypasses LAT would give inositol trisphosphate and calcium
    without giving ERK. What is missing is the route itself. Resolving it matters
    beyond this disease, because the textbook non-redundancy of LAT in calcium
    signalling is what the patients contradict.
  evidence:
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, to our surprise, Ca2+ mobilization after CD3 cross-linking was
      normal in primary T cells of the index patient, and the sustained T cell
      differentiation in LAT-deficient patients supports the notion of a preserved
      residual TCR signal in vivo.
    explanation: >-
      States the unexpected preserved calcium response in the patient's primary T
      cells, which is the gap.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is unlikely that CD6 replaces LAT function in LAT-deficient
      primary T cells, and the explanation of the preserved Ca2+ flux, NF-κB
      activation in the patient’s T cells, and the persistent T cell
      differentiation remains elusive at this time.
    explanation: >-
      The authors' own statement that the finding is unexplained after the
      candidate substitutes were tested.
- discussion_id: scid_versus_cid_presentation_is_not_yet_explained
  kind: OPEN_QUESTION
  prompt: >-
    Why does the same class of truncating LAT allele produce absent T cells and
    typical SCID in one pedigree and present-but-declining T cells with severe
    autoimmunity in another?
  attaches_to:
  - pathophysiology#Arrest of Thymic T Cell Development
  - pathophysiology#Loss of LAT-Dependent Restraint on T Cell Responses
  rationale: >-
    IUIS records both presentations in a single row, and this entry follows that by
    curating them together. But the two kindreds are genuinely different at the
    bedside: one presented as T-negative SCID with normal B and NK cells, the other
    with normal T-cell numbers, lymphoproliferation and life-threatening autoimmune
    cytopenias from five months of age. Both alleles are truncating.

    Three explanations are available and none can be chosen with three kindreds.
    The alleles truncate at different positions, so a residual product retaining
    some proximal function is possible in one and not the other. The CID kindred's
    own course shows that T-cell numbers fall with time, so the difference may be
    partly one of when the patients were ascertained. And modifier or environmental
    contributions cannot be excluded in pedigrees of this size.
    Recording the question rather than a `has_subtypes` split keeps the entry from
    asserting a stratification the evidence does not yet support.
  evidence:
  - reference: PMID:41608114
    reference_title: "Human inborn errors of immunity: 2024 update on the classification from
      the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      LAT deficiency | LAT | AR | 617514 | Normal to low | Normal to low | High
      | Typical SCID or CID, the latter with adenopathy, splenomegaly,
      recurrent infections, autoimmunity
    explanation: >-
      The classification committee's own record that both presentations belong to
      one condition, which is what makes this an open question rather than a
      lumping error.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of additional patients with possibly different LAT
      mutations will shed further light on the full immunological and clinical
      presentation of human LAT deficiency.
    explanation: >-
      The authors' statement that the phenotypic range is not yet established,
      which is the state this question records.
- discussion_id: il6_dependence_of_the_lymphoproliferative_arm_is_untested_in_patients
  kind: EMERGING_HYPOTHESIS
  prompt: >-
    Is the lymphoproliferative arm of human LAT deficiency IL-6 dependent, as it is
    in the LatY136F mouse, and would IL-6 blockade therefore be a rational bridge
    to transplant?
  attaches_to:
  - pathophysiology#Loss of LAT-Dependent Restraint on T Cell Responses
  - pathophysiology#Polyclonal Lymphoproliferation
  rationale: >-
    In the LatY136F mouse the mutant T cells overproduce IL-6, and crossing the
    strain onto an IL-6-deficient background showed that IL-6 is required for the
    uncontrolled early T-cell expansion; the reduction came from impaired cell
    survival rather than from a further developmental block or more regulatory T
    cells. Aged IL-6-deficient LatY136F mice eventually hyperproliferated and
    developed splenomegaly, but with diminished isotype switching and autoantibody
    production, so IL-6 loss delays and attenuates the syndrome rather than
    abolishing it.

    Nothing equivalent has been measured in patients: no IL-6 level, no IL-6
    pathway readout, and no anti-IL-6 exposure is reported in any of the three
    kindreds. The hypothesis is recorded because the autoimmune arm is what kills
    these children before transplant and there is an approved drug class against
    this target, not because human evidence supports it. Any use would be
    off-label, unstudied in this disease, and taken on a mouse result obtained with
    a different allele.
  evidence:
  - reference: PMID:26034173
    reference_title: The Importance of IL-6 in the Development of LAT-Mediated Autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      By crossing LATY136F mice with IL-6-deficient mice, we demonstrated that
      IL-6 is required for uncontrolled T cell expansion during the early stage of
      disease development.
    explanation: >-
      The genetic experiment behind the hypothesis. INDIRECT because it is a mouse
      result on a different allele from the human disease-causing ones, and the
      inference to patients is untested.
  - reference: PMID:26034173
    reference_title: The Importance of IL-6 in the Development of LAT-Mediated Autoimmunity.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      In aged IL-6(-/-) LATY136F mice, CD4(+) T cells began to hyperproliferate
      and induced splenomegaly; however, isotype switching and autoantibody
      production were diminished.
    explanation: >-
      Records that removing IL-6 attenuates rather than abolishes the syndrome,
      which is the limit on how much the hypothesis could deliver.
- discussion_id: non_t_lineage_contribution_is_uncharacterised
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does loss of LAT contribute to disease through mast cells, megakaryocytes or
    platelets, in which the adaptor is also expressed but in which no patient has
    been studied?
  attaches_to:
  - pathophysiology#Reduced Cytotoxic Degranulation
  - phenotypes#Decreased natural killer cell degranulation
  rationale: >-
    LAT is expressed in mast cells, natural killer cells, megakaryocytes, platelets
    and early B cells as well as in T cells. The only non-T lineage in which
    LAT-deficient patients have been assessed is the NK compartment, where
    degranulation and cytotoxicity were reduced but not absent. No report gives
    platelet function, bleeding history, mast-cell function or allergic history in a
    LAT-deficient patient, so whether the expression pattern translates into
    clinical features outside the T-cell compartment is unknown.

    This is worth recording rather than leaving implicit because the inference is
    tempting and unsupported: an adaptor expressed in platelets is not thereby a
    platelet disease, and the thrombocytopenia the patients did have was
    autoantibody-mediated, which is a T-cell-driven route to the same laboratory
    finding. Distinguishing the two would need platelet function testing in a
    patient, which nobody has published.
  evidence:
  - reference: PMID:16102570
    reference_title: Role of the LAT adaptor in T-cell development and Th2 differentiation.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although LAT is also expressed in mast cells, natural killer cells,
      megakaryocytes, platelets, and early B cells, the present review
      specifically illustrates the role LAT plays in the development and function
      of mouse T cells.
    explanation: >-
      Establishes the expression pattern outside T cells that makes the question
      worth asking.
  - reference: PMID:27242165
    reference_title: Early onset combined immunodeficiency and autoimmunity in patients with
      loss-of-function mutation in LAT.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, the degranulation of LATmut CTLs after stimulation with
      anti-CD3/anti-CD28 beads (Fig. 6 D) and of patient-derived NK cells after
      stimulation with the K562 cell line was reduced (Fig. 6 E), although not
      absent.
    explanation: >-
      The one non-T lineage measurement that exists in patients, which is where
      the available human evidence stops.

    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      These results argue against a scenario where the Lat(Y136F) pathology is
      primarily due to a lack of functional Foxp3(+) regulatory T cells and
      suggest that a defect intrinsic to Lat(Y136F) CD4 T cells leads to a state
      of TCR-independent hyperactivity.

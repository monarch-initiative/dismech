name: LAT Deficiency
creation_date: "2026-09-29T21:00:00Z"
category: Mendelian
synonyms:
- severe combined immunodeficiency due to LAT deficiency
- combined immunodeficiency due to LAT deficiency
- immunodeficiency 52
- IMD52
- SCID due to LAT deficiency
- T-B+NK+ severe combined immunodeficiency due to LAT deficiency
- LAT-related combined immunodeficiency
description: >-
  LAT deficiency is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function variants in LAT, the transmembrane adaptor that
  ZAP-70 phosphorylates once the T-cell receptor is engaged. LAT has no catalytic
  activity of its own: its cytoplasmic tail carries four tyrosines that, when
  phosphorylated, become docking sites for PLC-gamma1, Grb2 and Gads, and through
  Gads for SLP-76. That assembly is where one receptor signal fans out into the
  calcium, Ras-ERK and transcriptional arms of T-cell activation, so losing the
  adaptor leaves the receptor intact and every branch below it unserved.

  The reported human phenotype spans two presentations that are recognisably the
  same lesion. In one pedigree the picture was typical severe combined
  immunodeficiency with absent T cells and preserved B and natural killer cells,
  and a later single patient was reported from a series of typical and atypical
  SCID without a published immunophenotype. In a consanguineous kindred with a
  truncating exon 5 variant, three siblings instead presented in the first year with combined
  immunodeficiency accompanied by severe autoimmune cytopenias, lymphadenopathy
  and splenomegaly, with T cells present at diagnosis and progressively lost; two
  died in childhood and the third was transplanted. Both presentations are
  curated here as one entry because the gene, the inheritance and the signalling
  lesion are the same, and the IUIS classification carries them as one condition.

  Two features make the disorder mechanistically interesting beyond its rarity.
  First, autoimmunity in a disease of failed T-cell activation is not a paradox in
  this pathway: mouse genetics established that LAT is itself a negative regulator
  of T-cell responses and homeostasis, and that T cells deprived of it drive
  lymphoproliferation and autoantibody production in a receptor-independent,
  quasi-mitogenic fashion. Second, human and mouse do not agree on how severe the
  developmental block is. Mice lacking LAT, or carrying all four tyrosines
  mutated, arrest at the DN3 thymocyte stage with no peripheral T cells at all,
  whereas patients lacking the same four tyrosines still produce mature, if badly
  differentiated, T cells whose receptors still mobilise calcium and activate
  NF-kappaB while ERK signalling is abolished. No compensating adaptor has been
  identified, and that residual signalling remains unexplained.

    directness: INDIRECT
    snippet: >-
      The fact that such LAT-independent signals result in lymphoproliferative
      disorders with excessive cytokine production demonstrates that LAT
      constitutes a key negative regulator of the triggering module and of the
      LAT-independent branches of the TCR signaling cassette.
    explanation: >-

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ten patients from nine families in five countries in the defining report.
    No population rate has been estimated and none should be inferred from the
    case count. Two founder haplotypes (Maltese/Italian and French) mean the
    allele is regionally clustered rather than uniformly rare, and the authors
    argue the disease is under-recognised because late-onset X-linked disease
    usually presents as sporadic.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four different missense mutations were identified in ten patients from nine families in five different countries, suggesting that this disease could be prevalent in other populations as well.
    explanation: >-
      Gives the total published case count that this literature-count measure
      records, and the authors' own statement that it is a floor rather than an
      estimate.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis of patients with similar ancestry revealed two different founder mutations in Southern Europe and France, indicating that the prevalence in these populations may be higher.
    explanation: >-
      Supports the note that occurrence is regionally clustered by founder
      alleles, so a single worldwide rate would misdescribe it.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    All reported patients are hemizygous males. Most probands had a negative
    family history and presented as sporadic cases; only one family contributed
    two affected brothers. The generic X-linked term is bound deliberately rather
    than X-linked recessive or X-linked dominant: no female heterozygote has been
    phenotyped, so there is no basis for choosing between them, and published
    tabulations of this disease are inconsistent on the point.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all ten families, except the two brothers in F5, all probands reported negative family history of muscle weakness and presented as sporadic cases
    explanation: >-
      Supports the sporadic presentation typical of a late-onset X-linked
      disorder, which is the reason family history rarely raises the diagnosis.
pathophysiology:
- name: SMPX missense variant with increased aggregation propensity
  biological_scale: MOLECULAR
  description: >-
    Four hemizygous SMPX missense variants (p.P7T, p.A13V, p.P27A, p.S78N) have
    been reported. In silico aggregation prediction and cell fractionation agree
    that the mutant protein is less soluble than wild type, with the two
    N-terminal changes producing the largest effect. This is a change in the
    behaviour of the protein rather than its absence, which is what separates
    this disease from the SMPX loss-of-function alleles that cause DFNX4 hearing
    loss.
  genes:
  - preferred_term: SMPX
    term:
      id: hgnc:11122
      label: SMPX
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    allele_type: SNV
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Hemizygous germline missense alleles in affected males. GAIN_OF_FUNCTION is
      used because the defining report states the mechanism in those words and
      contrasts it explicitly with the loss-of-function alleles that cause DFNX4
      hearing loss. It is a toxic gain through aggregation, not increased normal
      SMPX activity. NEOMORPHIC was considered and rejected: no source reports a
      novel activity of the mutant protein, only reduced solubility and
      accumulation.
  notes: >-
    No GO or PATO term is bound to this node. "Increased aggregation propensity"
    is a physicochemical property of the mutant protein; GO has no matching
    biological-process or molecular-function term, and binding a generic protein
    folding or oligomerization term would assert an activity the source does not
    report. The consequence is captured at the next node with GO:0070841.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In silico predictions and subsequent cell culture studies showed that the missense mutations increase aggregation propensity of the SMPX protein.
    explanation: >-
      States the molecular consequence of the disease alleles that this node
      records.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      they supported clearly reduced solubility of SMPX p.P7T and p.A13V, whereas the C-terminal mutations showed a minor yet significant effect
    explanation: >-
      The biochemical measurement behind the aggregation claim, and the reason
      the node describes the effect as graded across the four alleles rather
      than uniform.
  downstream:
  - target: Sarcoplasmic SMPX inclusion body formation
    description: >-
      Reduced solubility of the mutant protein corresponds to its accumulation
      in inclusions in patient muscle fibres.
    causal_link_type: DIRECT
  - target: SMPX-enriched stress granule persistence
    description: >-
      A second, less established route by which mutant SMPX may act; see the
      node's own evidence for what the source does and does not show.
    causal_link_type: UNKNOWN
- name: Sarcoplasmic SMPX inclusion body formation
  biological_scale: CELLULAR
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Sarcoplasmic and subsarcolemmal protein inclusions accumulate in skeletal
    muscle fibres. They stain for SMPX itself along with SQSTM1/p62, ubiquitin,
    SMI-31 and vinculin, and are negative for TDP-43. Some inclusions bind Congo
    red with apple-green birefringence, so at least a subset has amyloid-like
    character. Equivalent SMPX-positive inclusions were not found in control
    myopathies with rimmed-vacuolar or myofibrillar pathology, which makes the
    finding specific to this disease rather than a shared end-stage change.
  biological_processes:
  - preferred_term: inclusion body assembly
    modifier: INCREASED
    term:
      id: GO:0070841
      label: inclusion body assembly
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathological and electron microscopic analysis of patient muscle biopsies revealed myopathic findings with rimmed vacuoles and the presence of sarcoplasmic inclusions, some with amyloid-like characteristics.
    explanation: >-
      Establishes the inclusions in patient muscle that this node represents.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither SMPX-positive protein inclusions, nor other SMPX accumulation was observed in any other disease control myopathies with rimmed vacuolar and/or myofibrillar pathology
    explanation: >-
      Supports the specificity claim: the inclusions are not a generic feature of
      rimmed-vacuolar myopathy, which is what makes them mechanistically
      informative here.
  downstream:
  - target: Myofibrillar lesion formation and myofibre degeneration
    description: >-
      Protein accumulation is accompanied by myotilin-positive myofibrillar
      lesions containing the chaperone-assisted selective autophagy proteins
      BAG3 and HSPB8.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: SMPX-enriched stress granule persistence
  biological_scale: CELLULAR
  description: >-
    In transfected cells, SMPX localises to a minority of stress granules, and
    granules enriched for SMPX recover more slowly after proteasome-inhibition
    stress. This node is retained because the source reports the observation,
    but it is deliberately not treated as an established disease mechanism: the
    same experiments found no major difference between wild-type and mutant
    SMPX, so nothing yet ties the delayed granule clearance to the disease
    alleles.
  biological_processes:
  - preferred_term: stress granule disassembly
    modifier: DECREASED
    term:
      id: GO:0035617
      label: cytoplasmic stress granule disassembly
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell culture studies, overexpressed SMPX localized to stress granules and slowed down their clearance.
    explanation: >-
      Supports the granule-clearance observation itself. Note this is a statement
      about SMPX, not specifically about the mutant alleles.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    snippet: >-
      However, as our experiments did not reveal major differential effects on SG dynamics between wild-type and mutant SMPX, the potential role of SGs in the pathomechanism remains unclear and should be addressed in further studies in experimental systems allowing longer-term SMPX expression.
    explanation: >-
      The authors' own statement that the mutant-specific stress-granule
      mechanism is untested rather than demonstrated. This is why the incoming
      edge is causal_link_type UNKNOWN and why the node makes no causal claim
      downstream.
- name: Myofibrillar lesion formation and myofibre degeneration
  biological_scale: TISSUE
  description: >-
    Muscle shows general myopathic change of variable severity — fibre size
    variation, internal nuclei, rimmed vacuolar pathology — together with less
    prominent myotilin- and alphaB-crystallin-positive myofibrillar lesions.
    Electron microscopy found the sarcomere largely preserved, with intact
    M-bands and irregular Z-disc alignment, so this is protein-accumulation
    pathology rather than gross sarcomeric disintegration.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, we observed less prominent myofibrillar pathology immunoreactive for myotilin and αB-crystallin.
    explanation: >-
      Establishes the myofibrillar component of the tissue pathology and its
      subordinate weight relative to the inclusions.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      EM of patient muscles did not reveal major disorganization of sarcomeric structures; M-bands were intact whereas the alignment of Z-discs was irregular
    explanation: >-
      Supports the qualification that the sarcomere is largely preserved, which
      keeps this node from overstating structural breakdown.
  downstream:
  - target: Distal muscle weakness
    description: >-
      Progressive myofibre pathology in the anterior lower leg and forearm
      produces the distal-predominant weakness that defines the phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Weakness of long finger extensor muscles
    description: >-
      The forearm half of the presenting deficit, from myofibre loss in the long
      finger extensors.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Foot dorsiflexor weakness
    description: >-
      The lower-leg half of the presenting deficit, from myofibre loss in the
      anterior compartment, which is also where the MRI fatty replacement appears
      first.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Shoulder girdle muscle weakness
    description: >-
      Later spread of the same myofibre pathology to the shoulder abductors.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Axial muscle weakness
    description: >-
      Paravertebral involvement reported in one patient with the p.S78N founder
      allele. Recorded as an edge of the spectrum rather than a core step.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Proximal muscle weakness
    description: >-
      Later spread of the same process to more proximal muscles.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fatty replacement of skeletal muscle
    description: >-
      Chronic myofibre loss is replaced by fat, which is what the characteristic
      MRI pattern detects.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:
- name: Distal muscle weakness
  category: Musculoskeletal
  description: >-
    Onset in the finger extensors and ankle dorsiflexors in the third to fourth
    decade, progressing over decades to severe distal weakness of both upper and
    lower limbs. Walking is retained late; the oldest reported patient was still
    ambulant at 80.
  phenotype_term:
    preferred_term: Distal muscle weakness
    term:
      id: HP:0002460
      label: Distal muscle weakness
    clinical_course: PROGRESSIVE
    onset:
      onset_category: ADULT
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the probands of families F1–F5, onset of finger extensor/ankle dorsiflexor weakness was observed in the 3rd–4th decade.
    explanation: >-
      Gives both the distribution and the age of onset recorded on this
      phenotype.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study all patients presented with highly similar clinical features: adult-onset, usually distal more than proximal limb muscle weakness, slowly progressing over decades with preserved walking.
    explanation: >-
      Supports the distal-over-proximal gradient and the preserved ambulation
      that distinguishes this myopathy from faster distal myopathies.
- name: Weakness of long finger extensor muscles
  category: Musculoskeletal
  description: >-
    Finger extension weakness in the forearm is one of the two presenting
    deficits, appearing in the third to fourth decade alongside ankle
    dorsiflexor weakness.
  phenotype_term:
    preferred_term: Finger extensor weakness
    term:
      id: HP:0009077
      label: Weakness of long finger extensor muscles
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the probands of families F1–F5, onset of finger extensor/ankle dorsiflexor weakness was observed in the 3rd–4th decade.
    explanation: >-
      Names finger extensor weakness specifically as a presenting deficit.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The weakness typically started in the forearms with finger extension defect and in the lower legs with ankle dorsiflexion weakness and progressed to scapular arm abduction muscles while sparing the heart and respiratory muscles.
    explanation: >-
      Independent restatement in a review. Evidence source is OTHER because this
      is a review.
- name: Foot dorsiflexor weakness
  category: Musculoskeletal
  description: >-
    Ankle dorsiflexor weakness in the anterior compartment of the lower leg is
    the other presenting deficit, and is the muscle group in which the
    characteristic MRI fatty replacement appears first.
  phenotype_term:
    preferred_term: Ankle dorsiflexor weakness
    term:
      id: HP:0009027
      label: Foot dorsiflexor weakness
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the probands of families F1–F5, onset of finger extensor/ankle dorsiflexor weakness was observed in the 3rd–4th decade.
    explanation: >-
      Names ankle dorsiflexor weakness specifically as a presenting deficit.
- name: Shoulder girdle muscle weakness
  category: Musculoskeletal
  description: >-
    Weakness progresses from the presenting distal muscles to the shoulder
    abductors. Recorded as shoulder girdle weakness rather than as scapular
    winging: the source describes involvement of the arm abduction muscles, and
    winging is a distinct clinical sign that no cited source reports.
  phenotype_term:
    preferred_term: Shoulder girdle muscle weakness
    term:
      id: HP:0003547
      label: Shoulder girdle muscle weakness
  evidence:
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The weakness typically started in the forearms with finger extension defect and in the lower legs with ankle dorsiflexion weakness and progressed to scapular arm abduction muscles while sparing the heart and respiratory muscles.
    explanation: >-
      The sentence recording progression to the shoulder abductors, and in the
      same clause the sparing of heart and respiratory muscles. Evidence source
      is OTHER because this is a review.
- name: Proximal muscle weakness
  category: Musculoskeletal
  description: >-
    Proximal limb muscles become involved after the distal muscles and remain
    less affected.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thereafter, the symptoms slowly progressed over decades to severe distal more than proximal upper and lower limb weakness
    explanation: >-
      Records proximal involvement while preserving the ordering that makes it
      secondary to the distal weakness.
- name: Fatty replacement of skeletal muscle
  category: Musculoskeletal
  description: >-
    Fatty degeneration in a characteristic order: anterior compartment of the
    lower legs first, then medial gastrocnemius and soleus, and only very late
    the thigh, predominantly the hamstrings.
  phenotype_term:
    preferred_term: Fatty replacement of skeletal muscle
    term:
      id: HP:0012548
      label: Fatty replacement of skeletal muscle
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle imaging of the patients showed a characteristic MRI pattern of muscle involvement (Fig.2) with fatty replacement in the anterior compartment muscles of the lower legs, later in the calf muscles medial gastrocnemius and soleus, and very late changes in the thigh muscles more in the hamstrings.
    explanation: >-
      Gives the muscles involved and the sequence, which is the basis for the
      imaging finding recorded separately below.
- name: Axial muscle weakness
  category: Musculoskeletal
  description: >-
    Paravertebral muscle involvement has been reported as a prominent feature in
    an individual carrying the p.S78N founder allele, extending the pattern
    beyond the limb muscles described in the defining cohort. It is a single
    reported case, so it is recorded as part of the spectrum rather than as a
    core feature.
  phenotype_term:
    preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  evidence:
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, Salman et al., also described an individual with the founder pathogenic variant p.S78N and prominent paravertebral muscle involvement.
    explanation: >-
      A review reporting the axial finding. It is cited in place of the primary
      case report (PMID:38615630), which has no abstract in the reference cache
      and so could not be snippet-verified. Evidence source is OTHER because this
      is a review.
- name: Rimmed vacuoles
  category: Histopathology
  description: >-
    Rimmed vacuolar pathology in skeletal muscle fibres, seen on H&E and
    positive for the autophagosome marker LC3b.
  phenotype_term:
    preferred_term: Rimmed vacuoles
    term:
      id: HP:0003805
      label: Rimmed vacuoles
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed general myopathic changes of variable severity, including fiber size variation, internal nuclei, rimmed vacuolar pathology and sarcoplasmic inclusions, which stained positive with antibodies against SMPX, SQSTM1/p62, SMI-31, ubiquitin, and the known SMPX-interacting protein vinculin
    explanation: >-
      Reports the rimmed vacuoles alongside the immunostaining profile of the
      accompanying inclusions.
- name: Muscle fibre sarcoplasmic inclusion bodies
  category: Histopathology
  description: >-
    Sarcoplasmic and subsarcolemmal inclusions positive for SMPX, SQSTM1/p62,
    ubiquitin, SMI-31 and vinculin, and negative for TDP-43. A subset binds
    Congo red and shows apple-green birefringence under polarised light.
  phenotype_term:
    preferred_term: Muscle fiber inclusion bodies
    term:
      id: HP:0100299
      label: Muscle fiber inclusion bodies
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sarcoplasmic inclusions in patient F9 II.1 muscle showed Congo red fluorescence when viewed with fluorescent microscope using Texas red filter, suggesting amyloid-like aggregation
    explanation: >-
      The amyloid-like staining result. Note it is reported for one patient's
      biopsy, which is why the entry says "a subset" rather than treating amyloid
      as a defining feature.
- name: Increased variability in muscle fibre diameter
  category: Histopathology
  description: >-
    Fibre size variation with internal nuclei, part of the general myopathic

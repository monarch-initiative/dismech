diagnosis:
- name: SMPX sequencing
  description: >-
    Confirmation is molecular. SMPX is a small gene that was not on
    neuromuscular panels before 2021, and the defining cohort was found by
    high-throughput sequencing after conventional neuromuscular gene testing came
    back negative, so a prior negative panel does not exclude the diagnosis.
  diagnosis_term:
    preferred_term: exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We analyzed the HTS data from the probands for potential disease-causing variants that could explain their disease phenotype but did not identify causative variants in any of the known neuromuscular disease genes.
    explanation: >-
      Records that the diagnosis was reached by sequencing after the known
      neuromuscular genes were excluded, which is the point about prior negative
      panels.
- name: Lower-limb muscle MRI
  description: >-
    Muscle imaging shows a stereotyped order of fatty replacement and is what
    raises the specific suspicion. It has been described in one cohort and has
    not been evaluated as a diagnostic test, so it is supportive rather than
    confirmatory.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower limb muscle imaging showed a characteristic pattern of muscle involvement and fatty degeneration.
    explanation: >-
      States the imaging pattern is characteristic, which is what makes it useful
      diagnostically.
- name: Muscle biopsy
  description: >-
    Biopsy is supportive rather than independently diagnostic. It shows
    rimmed-vacuolar and myofibrillar-like change that overlaps other myopathies;
    what is specific is the SMPX-immunoreactive sarcoplasmic inclusion, which was
    absent from every rimmed-vacuolar and myofibrillar disease control tested.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither SMPX-positive protein inclusions, nor other SMPX accumulation was observed in any other disease control myopathies with rimmed vacuolar and/or myofibrillar pathology
    explanation: >-
      The specificity result that makes the SMPX immunostain, rather than the
      rimmed vacuoles, the discriminating biopsy finding.
- name: Cardiac and respiratory assessment
  description: >-
    Echocardiography was normal in the tested patients and the heart and
    respiratory muscles are described as spared, which is clinically
    load-bearing: cardiac or respiratory involvement points away from this
    diagnosis and towards another distal or myofibrillar myopathy. The sparing
    rests on a small cross-sectional cohort, so baseline assessment remains
    reasonable.
  evidence:
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The weakness typically started in the forearms with finger extension defect and in the lower legs with ankle dorsiflexion weakness and progressed to scapular arm abduction muscles while sparing the heart and respiratory muscles.
    explanation: >-
      The organ-sparing statement. Evidence source is OTHER because this is a
      review.
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac evaluations with echocardiography were normal and no hearing loss was recorded even at higher age
    explanation: >-
      The primary cohort's cardiac result, which is the observation the sparing
      claim rests on.
treatments:
- name: Physical and occupational therapy
  description: >-
    Rehabilitation directed at the distal deficits: hand function for the finger
    extensor weakness, gait and fall prevention for the ankle dorsiflexor
    weakness. No disease-specific rehabilitation protocol or outcome study exists
    for this myopathy; this follows general hereditary distal myopathy practice.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
- name: Ankle-foot orthosis and mobility aids
  description: >-
    Orthoses for foot drop and mobility aids as the distal lower-limb weakness
    progresses. Ambulation is typically retained for decades, so the aim is gait
    stability rather than replacement of walking.
  therapeutic_modality: DEVICE
  notes: >-
    No treatment_term is bound. NCIT has no clinical-action term for orthosis
    use that is reachable from Clinical Intervention or Procedure, which is the
    same gap CLAUDE.md records for device usage generally. A free-text name is
    kept rather than binding an unsuitable term.
- name: Supportive neuromuscular care
  description: >-
    No disease-modifying treatment has been reported and no trial or treatment
    study exists for this disease. Management is symptom-directed and is captured
    by the two specific entries above; this entry marks the absence of anything
    disease-modifying rather than adding a further intervention.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
animal_models:
- name: Smpx-deficient zebrafish
  species: Zebrafish
  genotype: smpx morpholino knockdown
  publication: PMID:34204426
  description: >-
    Morpholino knockdown of smpx in zebrafish embryos produces both an inner-ear
    phenotype (reduced kinocilia, altered stereocilia, impaired hair-cell
    mechanotransduction) and a muscle phenotype (defective myofibre organisation
    and function). It was built to test the loss-of-function hypothesis for
    DFNX4 hearing loss, not this disease.
  modeled_mechanisms:
  - target: Myofibrillar lesion formation and myofibre degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Establishes that SMPX is required for normal muscle fibre organisation,
      which is consistent with muscle being a target tissue.
    limitations: >-
      Fidelity is LOW because the model is a knockdown and therefore reproduces
      the allele class that causes DFNX4 hearing loss, not the aggregation-prone
      missense alleles that cause this myopathy. It is an embryonic developmental
      phenotype rather than an adult-onset degenerative one, and it produces no
      protein inclusions or rimmed vacuoles. It is evidence that smpx matters in
      muscle, not evidence for the mechanism modelled in this entry.
    evidence:
    - reference: PMID:34204426
      reference_title: "Inner Ear and Muscle Developmental Defects in Smpx-Deficient Zebrafish Embryos."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Additionally, we observed a clear muscular phenotype consisting of the defective organization and functioning of muscle fibers, strongly suggesting a potential role for the protein in the development of muscle fibers.
      explanation: >-
        The muscle result that makes this model partially informative for the
        myofibre node.
  evidence:
  - reference: PMID:34204426
    reference_title: "Inner Ear and Muscle Developmental Defects in Smpx-Deficient Zebrafish Embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the attempt to confirm this hypothesis we generated an Smpx-deficient zebrafish model, pointing out its crucial role in proper inner ear development.
    explanation: >-
      States what the model was built to test, which is why its relevance to the
      myopathy is indirect.
differential_diagnoses:
- name: Myofibrillar myopathy
  disease_term:
    preferred_term: myofibrillar myopathy
    term:
      id: MONDO:0018943
      label: myofibrillar myopathy
  description: >-
    Myotilin-positive myofibrillar lesions containing BAG3 and HSPB8 are present
    in SMPX myopathy, so biopsies can be read as myofibrillar myopathy. The
    discriminator is the SMPX-positive sarcoplasmic inclusion, which was absent
    from every myofibrillar and rimmed-vacuolar control biopsy tested.
  distinguishing_features:
  - SMPX-immunoreactive sarcoplasmic inclusions favour SMPX myopathy.
  - Marked desmin accumulation is absent in SMPX myopathy.
  - X-linked inheritance with only affected males favours SMPX myopathy.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, resemblance to other myofibrillar myopathies was observed as myotilin-positive myofibrillar lesions also contain BAG3 and HSPB8.
    explanation: >-
      States the overlap with myofibrillar myopathy that puts it in the
      differential.
- name: X-linked non-syndromic hearing loss, DFNX4
  disease_term:
    preferred_term: hearing loss, X-linked 4
    term:
      id: MONDO:0010238
      label: hearing loss, X-linked 4
  description: >-
    The other SMPX disease, already curated in this knowledge base as a subtype
    of X-linked Nonsyndromic Hearing Loss. It is allelic but not overlapping in
    presentation: DFNX4 is childhood-onset progressive hearing loss from
    truncating loss-of-function alleles, with no reported skeletal myopathy, and
    the myopathy cohort had no hearing loss on examination into the eighth
    decade.
  distinguishing_features:
  - Truncating or splice-disrupting SMPX alleles favour DFNX4; missense alleles favour the myopathy.
  - Progressive hearing loss beginning in the first two decades favours DFNX4.
  - Adult-onset distal limb weakness with normal hearing favours the myopathy.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our families, in contrast, affected adult males examined in their 6th–8th decades showed no hearing loss and neither reported any hearing impairment in their relatives.
    explanation: >-
      The direct statement that the two SMPX phenotypes have been observed apart
      from each other, which is the basis for curating them as separate entries.
discussions:
- discussion_id: gap_mpd7_subclinical_auditory_involvement
  prompt: >-
    Has anyone systematically audiogrammed a cohort of SMPX missense-variant
    myopathy patients, and would formal audiometry find subclinical auditory
    involvement that clinical history and examination missed?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#SMPX
  - phenotypes#Distal muscle weakness
  rationale: >-
    This entry claims no auditory phenotype, and that claim rests on the defining
    cohort recording no hearing loss on examination into the eighth decade. What
    it does not rest on is a systematic audiometric study: the source reports
    absence of recorded hearing loss, not normal audiograms in a screened cohort.
    Aggregated phenotype annotations for MPD7 in third-party resources do list
    hearing impairment, so the annotation layer and the primary literature
    disagree. The question matters because a positive result would move SMPX from
    two allelic diseases towards one pleiotropic disease with allele-dependent
    emphasis, and would change how a clinician follows a myopathy patient.
  proposed_experiments:
  - experiment_id: exp_mpd7_audiometry_in_missense_cohort
    name: Pure-tone and high-frequency audiometry in an SMPX missense-variant cohort
    description: >-
      Perform standardised pure-tone audiometry, extended high-frequency
      audiometry and otoacoustic emissions on hemizygous carriers of the reported
      SMPX missense alleles, comparing against age- and sex-matched normative
      data, and stratifying by N-terminal versus C-terminal allele since these
      differ in their effect on protein solubility.
    would_support:
    - phenotypes#Distal muscle weakness
    supporting_outcome:
    - >-
        Age-adjusted high-frequency threshold elevation in missense carriers would
        show that the myopathy alleles also affect the cochlea subclinically, and
        would require adding an auditory phenotype to this entry.
    refuting_outcome:
    - >-
        Audiograms within age-matched normative limits across the cohort would
        confirm the current claim that the missense alleles spare hearing.
    decision_criterion: >-
      A consistent, age-adjusted threshold shift relative to matched controls
      resolves the gap towards auditory involvement; thresholds within normative
      limits resolve it towards the current two-disease reading.
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac evaluations with echocardiography were normal and no hearing loss was recorded even at higher age
    explanation: >-
      The whole basis for the no-hearing-loss claim. Note the wording is that no
      hearing loss was recorded, which is what makes the systematic-audiometry
      question a real gap rather than a rhetorical one.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The weakness typically started in the forearms with finger extension defect and in the lower legs with ankle dorsiflexion weakness and progressed to scapular arm abduction muscles while sparing the heart and respiratory muscles.
    explanation: >-
      An independent review restating the organ sparing, which is the same kind of
      absence claim as the hearing one and rests on the same small cohort.
      Evidence source is OTHER because this is a review.
- discussion_id: mismatch_smpx_zebrafish_knockdown_allele_class
  prompt: >-
    Smpx-deficient zebrafish show both inner-ear and muscle defects, but the
    model is a knockdown and human MPD7 is caused by aggregation-prone missense
    alleles. Does the fish pleiotropy say anything about this disease, or only
    about SMPX loss of function?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#SMPX missense variant with increased aggregation propensity
  - animal_models#Zebrafish
  rationale: >-
    The zebrafish result is the strongest single argument that SMPX is one
    pleiotropic gene rather than two diseases, because one perturbation produces
    both organ phenotypes. But the perturbation is loss of function, which in
    humans produces hearing loss without myopathy, and the fish phenotype is an
    embryonic developmental defect rather than an adult-onset degenerative one.
    No model yet expresses a human missense allele at endogenous levels in
    muscle, so the aggregation mechanism this entry models has no in vivo model
    at all. Until one exists, the fish pleiotropy cannot be used either to argue
    that MPD7 patients should be deaf or to argue that they should not be.
  proposed_experiments:
  - experiment_id: exp_smpx_knockin_missense_animal_model
    name: Knock-in animal model carrying a human SMPX missense allele
    description: >-
      Generate a knock-in model expressing an orthologous version of a human
      aggregation-prone SMPX allele at the endogenous locus, alongside a null
      allele and wild-type controls. Compare adult skeletal muscle for SMPX
      inclusions, rimmed vacuoles and progressive distal weakness, and compare
      the inner ear for hair-cell and auditory-threshold phenotypes.
    would_support:
    - pathophysiology#Sarcoplasmic SMPX inclusion body formation
    would_refute:
    - pathophysiology#SMPX-enriched stress granule persistence
    supporting_outcome:
    - >-
        Adult-onset muscle inclusions and weakness in the knock-in but not the null
        would confirm that the missense alleles act by a different mechanism from
        loss of function, and would separate the two SMPX diseases at the level of
        the model as well as the clinic.
    refuting_outcome:
    - >-
        An auditory phenotype in the knock-in equal to that of the null, without a
        muscle phenotype, would show the missense alleles are simply hypomorphic
        and undercut the gain-of-function reading.
    decision_criterion: >-
      Divergence between knock-in and null in the direction of muscle pathology
      supports the aggregation mechanism; convergence of the two on the auditory
      phenotype refutes it.
  evidence:
  - reference: PMID:34204426
    reference_title: "Inner Ear and Muscle Developmental Defects in Smpx-Deficient Zebrafish Embryos."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This piece of evidence highlights the need for more in-depth analyses in search for possible correlations between SMPX mutations and muscular disorders in humans, thus potentially turning this non-syndromic hearing loss-associated gene into the genetic cause of dysfunctions characterized by more than one symptom, making SMPX a novel syndromic gene.
    explanation: >-
      The zebrafish authors posing the syndromic-versus-two-diseases question
      themselves, which is the mismatch this discussion records.
datasets: []
clinical_trials: []
notes: >-
  Boundary with the other SMPX disease. SMPX causes two clinically separate
  diseases, and this knowledge base curates them as two entries: DFNX4 hearing
  loss is a subtype of X-linked Nonsyndromic Hearing Loss, and this myopathy is
  its own entry. The split follows the literature rather than the gene: the
  variant class differs (truncating and splice-disrupting alleles for DFNX4,
  missense for the myopathy), the proposed mechanism differs (loss of function
  versus toxic aggregation), and each cohort lacks the other's phenotype. It is
  not airtight — one missense allele has been reported in hearing loss, where it
  is read as a destabilising hypomorph rather than as an aggregating allele — so
  the residual uncertainty is recorded as a KNOWLEDGE_GAP about systematic
  audiometry rather than resolved silently in either direction.

  Not curated. The chaperone-assisted selective autophagy explanation for the
  myofibrillar lesions is stated by the source as "one possibility" and is not
  modelled as a pathophysiology node. No module conformance to
  disabled_macroautophagy was declared for the same reason. Conformance to the
  amyloidogenesis module was also not declared: Congo red positivity and
  apple-green birefringence are reported for one patient's biopsy and described
  by the authors as amyloid-like, which is weaker than a conformance claim
  needs. Two later case reports that would extend the phenotype
  (PMID:38615630, axial involvement; PMID:39230604, scapuloperoneal and
  myofibrillar presentation) have no abstract indexed in the reference cache, so
  no snippet could be verified and neither is cited.

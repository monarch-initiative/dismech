imaging_findings:
- name: Anterior-compartment-first fatty degeneration on lower-limb MRI
  modality: MRI
  description: >-
    Lower-limb MRI shows a stereotyped order of fatty replacement — anterior
    compartment of the lower legs, then medial gastrocnemius and soleus, then
    late thigh involvement predominantly in the hamstrings. The pattern is
    reported as characteristic of the disease, but it has been described in one
    cohort and has not been evaluated as a diagnostic test.
  phenotype_term:
    preferred_term: Fatty replacement of skeletal muscle
    term:
      id: HP:0012548
      label: Fatty replacement of skeletal muscle
  evidence:
  - reference: PMID:33974137
    reference_title: "Missense mutations in small muscle protein X-linked (SMPX) cause distal myopathy with protein inclusions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lower limb muscle imaging showed a characteristic pattern of muscle involvement and fatty degeneration.
    explanation: >-
      States that the imaging pattern is characteristic, which is the claim this
      finding records.
  - reference: PMID:39017652
    reference_title: Current advance on distal myopathy genetics.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Muscle imaging across several patients showed a pattern of muscle involvement where fatty replacement affected the anterior compartment muscles of the lower legs.
    explanation: >-
      Independent restatement of the lower-leg pattern. Note this review describes
      the thigh stage as adductors and quadriceps more than hamstrings, which is
      the opposite of the primary report; the entry follows the primary report and
      records the discrepancy here rather than choosing silently. Evidence source
      is OTHER because this is a review.
  notes: >-
    The primary report and a later review disagree about which thigh muscles are
    affected first at the late stage. The finding description follows the primary
    report; see the second evidence item.

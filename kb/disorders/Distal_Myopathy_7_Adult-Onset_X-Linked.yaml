name: Distal Myopathy 7, Adult-Onset, X-Linked
creation_date: "2026-09-03T23:59:00Z"
category: Mendelian
description: >-
  An adult-onset, slowly progressive distal myopathy caused by hemizygous
  missense variants in SMPX, the small muscle protein X-linked. Weakness begins
  in the finger extensors and ankle dorsiflexors in the third to fourth decade
  and progresses over decades to distal-more-than-proximal limb weakness, with
  walking usually retained into old age. Muscle biopsy shows rimmed vacuoles and
  SMPX-positive sarcoplasmic inclusions, some with amyloid-like staining
  properties, and the mutant protein is less soluble and more aggregation-prone
  than wild type. This is an allelic but mechanistically distinct disease from
  DFNX4 X-linked non-syndromic hearing loss, which is caused by SMPX
  loss-of-function alleles; the myopathy cohort reported no hearing loss and no
  cardiac involvement.

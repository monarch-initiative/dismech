    reference_title: "Genomic and phenotypic landscapes of X-linked hereditary hearing loss in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variations in SMPX causing truncation of the protein product were associated with DFNX4, which resulted in typical audiological profiles before and after the age of 10 years, whereas nontruncated proteins typically led to distal myopathy.
    explanation: >-
      An independent large hearing-loss cohort stating the same genotype-phenotype
      split from the other side of the allelic series.

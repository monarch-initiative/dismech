  description: >-
    Increased cytosolic calcium is the final common pathway of
    aldosterone-producing adenoma formation. It is simultaneously the signal for
    aldosterone biosynthesis and for glomerulosa cell proliferation, which is why a
    single somatic channel mutation is sufficient to produce both constitutive
    hormone production and tumour growth.

name: Adrenal Cortex Adenoma
creation_date: "2026-08-01T06:20:00Z"
category: Neoplastic
disease_term:
  preferred_term: adrenal cortex adenoma
  term:
    id: MONDO:0003924
    label: adrenal cortex adenoma
synonyms:
- adrenocortical adenoma
- adrenal cortical adenoma
- adrenal adenoma
- benign adrenal gland adenoma
parents:
- adrenal cortex neoplasm
- benign neoplasm of adrenal gland
description: >
  A benign, clonal neoplasm arising from the steroidogenic cells of the adrenal
  cortex. Most adrenal cortex adenomas are found incidentally on cross-sectional
  imaging performed for unrelated reasons — the "adrenal incidentaloma" — and the
  lesion itself is biologically indolent: it does not metastasize and its
  tumour-specific prognosis is excellent. Clinical significance is therefore
  determined almost entirely by autonomous hormone secretion, and this entry is
  organised on that functional axis. Cortisol-producing adenomas cause
  ACTH-independent Cushing syndrome and are driven predominantly by somatic
  activating mutations of PRKACA (and, less often, GNAS) that release the PKA
  catalytic subunit from regulatory-subunit restraint. Aldosterone-producing
  adenomas (APA, Conn adenoma) cause unilateral primary aldosteronism and are
  driven by mutually exclusive somatic mutations in KCNJ5, CACNA1D, ATP1A1 and
  ATP2B3, which converge on zona glomerulosa membrane depolarisation, calcium
  influx and CYP11B2 induction; CTNNB1 also occurs in a minority of APAs but is
  a transcriptional proliferation driver, not part of that ion-channel
  convergence. A large intermediate group
  shows mild autonomous cortisol secretion (MACS) without overt Cushing stigmata;
  MACS has been reclassified from a benign curiosity to a recognised
  cardiometabolic and skeletal risk state. Non-functioning adenomas, the largest single group,
  are molecularly heterogeneous with frequent Wnt/beta-catenin activation.

  Adrenal cortex adenoma must be distinguished from adrenocortical carcinoma, from
  bilateral macronodular adrenal hyperplasia (ARMC5) and from primary pigmented
  nodular adrenocortical disease (PRKAR1A / Carney complex); these are separate
  disease entities modelled elsewhere, not subtypes of this entry.
classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM

has_subtypes:
- name: Cortisol-Producing
  display_name: Cortisol-Producing Adenoma (overt Cushing syndrome)
  description: >-
    A unilateral adenoma secreting cortisol autonomously and sufficiently to
    produce clinically overt ACTH-independent Cushing syndrome. Somatic PRKACA
    hotspot mutations are the dominant driver; GNAS activating mutations account
    for an additional subset. Cortisol autonomy suppresses pituitary ACTH and
    causes atrophy of the contralateral adrenal cortex, so unilateral
    adrenalectomy is followed by transient adrenal insufficiency requiring
    glucocorticoid cover.
  genes:
  - preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  - preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "somatic PRKACA mutations resulted in unilateral cortisol-producing adrenal adenomas"
    explanation: Establishes the somatic-PRKACA cortisol-producing unilateral adenoma as a distinct entity.

- name: MACS
  display_name: Mild Autonomous Cortisol Secretion (MACS)
  description: >-
    Biochemical cortisol autonomy — serum cortisol above 50 nmol/L (1.8 ug/dL)
    after a 1-mg overnight dexamethasone suppression test — in a patient without
    the clinical signs of overt Cushing syndrome. Formerly dismissed as
    "subclinical hypercortisolism", MACS is now recognised as a genuine
    cardiometabolic risk condition carrying excess hypertension, type 2 diabetes,
    osteoporosis, fracture and all-cause mortality relative to non-functioning
    adenomas. It is by far the largest functional group: roughly 45% of benign
    adrenal tumours in the ENSAT EURINE-ACT cohort fell into the MACS-1 or MACS-2
    strata.
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies have provided evidence that most patients without clinical signs of overt Cushing's syndrome but serum cortisol levels post dexamethasone >50 nmol/L (>1.8 µg/dL) harbor increased risk of morbidity and mortality."
    explanation: The ESE guideline defines MACS by the post-dexamethasone threshold and asserts the associated risk.
  - reference: PMID:34978855
    reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 1305 participants, 49.7% had NFAT ... 34.6% had MACS-1 ... 10.7% had MACS-2"
    explanation: Quantifies the relative sizes of the non-functioning and MACS strata.

- name: Aldosterone-Producing
  display_name: Aldosterone-Producing Adenoma (APA, Conn adenoma)
  description: >-
    A unilateral adenoma of zona glomerulosa lineage secreting aldosterone
    renin-independently, causing unilateral primary aldosteronism. Driven by
    mutually exclusive somatic mutations in KCNJ5 (most common), CACNA1D, ATP1A1,
    ATP2B3 and CTNNB1. Because CT cannot reliably identify the secreting side (non-functioning nodules become
    common with age), adrenal vein sampling is usually required before
    lateralising surgery.
  genes:
  - preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  - preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  - preferred_term: ATP2B3
    term:
      id: hgnc:816
      label: ATP2B3
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  evidence:
  - reference: PMID:21311022
    reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify two recurrent somatic mutations in and near the selectivity filter of the potassium (K(+)) channel KCNJ5 that are present in 8 of 22 human APAs studied."
    explanation: Identifies KCNJ5 as a recurrent somatic driver defining this functional subtype.

- name: Non-Functioning
  display_name: Non-Functioning Adenoma (NFAT)
  description: >-
    An adenoma without demonstrable autonomous hormone secretion — normal
    metanephrines, a suppressed 1-mg dexamethasone test (below 50 nmol/L) and,
    where indicated, a normal aldosterone-to-renin ratio. This is the largest
    single group among incidentally detected adrenal masses. Molecularly
    heterogeneous; CTNNB1/Wnt-beta-catenin activation is the commonest recurrent
    alteration. A homogeneous lesion of 10 HU or less on unenhanced CT requires no
    further imaging follow-up and no surgery.
  genes:
  - preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  evidence:
  - reference: PMID:35731037
    reference_title: Mutational landscape of non-functional adrenocortical adenomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-two NFACAs (36.67%) had genetic alterations in CTNNB1."
    explanation: Defines the dominant recurrent somatic alteration in the non-functioning subtype.


- name: Aldosterone-Mediated Target Organ Damage
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinically decisive feature of primary aldosteronism is that its
    cardiovascular and renal injury is disproportionate to the blood pressure.
    Compared with essential hypertensives, patients with primary aldosteronism
    have markedly higher odds of stroke, coronary disease, atrial fibrillation and
    heart failure. Combined with the fact that primary aldosteronism remains
    largely underdiagnosed and undertreated, this is the strongest argument for
    biochemical screening of hypertensive patients with an adrenal adenoma rather
    than treating blood pressure alone.

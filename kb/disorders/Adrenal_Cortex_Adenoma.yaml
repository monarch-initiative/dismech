biochemical:
- name: 1-mg Overnight Dexamethasone Suppression Test Cortisol
  biomarker_term:
    preferred_term: cortisol
    term:
      id: CHEBI:17650
      label: cortisol
  notes: >-
    The pivotal test for cortisol autonomy in adrenal adenoma. Dexamethasone 1 mg
    is given at 2300 h and serum cortisol measured at 0800-0900 h the next
    morning. In a normal hypothalamic-pituitary-adrenal axis, cortisol suppresses
    below 50 nmol/L. Failure to suppress indicates that adrenal cortisol output is
    not under pituitary control.
  reference_ranges:
  - loinc_term:
      id: LOINC:97765-2
      label: Cortisol [Moles/volume] in Serum or Plasma --post dose dexamethasone PO overnight
    upper_bound: 50.0
    unit: nmol/L
    population: adults with an adrenal incidentaloma, no exogenous glucocorticoid or interfering medication
    notes: >-
      One-sided interval: suppression to below 50 nmol/L (1.8 ug/dL) is the normal
      / non-functioning result under the 2023 ESE guideline cutoff. Results are
      invalid in patients on drugs that induce or inhibit CYP3A4, or with abnormal
      cortisol-binding globulin. The LOINC code was verified against the NLM
      clinical-tables LOINC service; LOINC is not covered by the repository's OAK
      term validation.
    evidence:
    - reference: PMID:37318239
      reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a 1-mg overnight dexamethasone suppression test (applying a cutoff value of serum cortisol ≤50 nmol/L"
      explanation: The ESE guideline states the 50 nmol/L cutoff for a suppressed (normal) result.
    interpretation_bands:
    - name: Non-functioning adenoma
      upper_bound: 50.0
      unit: nmol/L
      abnormal_flag: NORMAL
      interpretation: >-
        Cortisol suppressed. No cortisol autonomy; the adenoma is non-functioning
        with respect to glucocorticoid secretion.
    - name: Possible MACS (MACS-1)
      lower_bound: 50.0
      upper_bound: 138.0
      unit: nmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Increased circulating cortisol level
        term:
          id: HP:0003118
          label: Increased circulating cortisol level
      interpretation: >-
        Partial non-suppression, classified as possible autonomous cortisol
        secretion in the NAPACA and EURINE-ACT stratifications. Already associated
        with excess cardiometabolic comorbidity and increased all-cause mortality.
    - name: Definitive MACS (MACS-2)
      lower_bound: 138.0
      unit: nmol/L
      abnormal_flag: HIGH
      phenotype_term:
        preferred_term: Increased circulating cortisol level
        term:
          id: HP:0003118
          label: Increased circulating cortisol level
      interpretation: >-
        Frank non-suppression above 138 nmol/L in the absence of typical clinical
        Cushing features. The same result accompanied by overt Cushing stigmata is
        classified as Cushing syndrome rather than MACS — the distinction at this
        threshold is clinical, not biochemical.
  evidence:
  - reference: PMID:34978855
    reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "serum cortisol: <50 nmol/L, nonfunctioning adrenal tumor ... ; 50 to 138 nmol/L, possible MACS ... ; >138 nmol/L and absence of typical clinical Cushing syndrome"
    explanation: Source of the three interpretation bands and their exact numeric boundaries.

- name: Aldosterone-to-Renin Ratio
  biomarker_term:
    preferred_term: aldosterone
    term:
      id: CHEBI:27584
      label: aldosterone
  notes: >-
    The screening test for primary aldosteronism: plasma aldosterone concentration
    divided by plasma renin activity or concentration. An elevated ratio indicates
    aldosterone production that is not being driven by renin. It should be
    measured with the patient off interfering agents (mineralocorticoid receptor
    antagonists in particular) and with potassium repleted, and a positive result
    requires confirmatory testing before subtype work-up.
  reference_ranges:
  - loinc_term:
      id: LOINC:30894-0
      label: Aldosterone/Renin [Ratio] in Plasma
    unit: '{ratio}'
    population: hypertensive adults screened for primary aldosteronism
    notes: >-
      No numeric cutoff is asserted here. The threshold for a positive
      aldosterone-to-renin ratio is assay- and unit-dependent: values differ by
      orders of magnitude depending on whether aldosterone is reported in ng/dL or
      pmol/L and whether renin is reported as activity or concentration, so a
      single interval would be misleading. The qualitative criterion — an elevated
      ratio with a suppressed renin — is what HP:6000318 (Elevated
      aldosterone:renin ratio) captures. The LOINC code was verified against the
      NLM clinical-tables LOINC service.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend case detection of primary aldosteronism by determining the aldosterone-renin ratio under standard conditions"
    explanation: >-
      Guideline basis for the aldosterone-to-renin ratio as the case-detection test,
      and for the requirement that it be measured under standardised conditions.
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Every patient needs a thorough clinical and endocrine work-up to exclude hormone excess"
    explanation: >-
      Supports the requirement for endocrine screening for hormone excess; the
      abstract enumerates metanephrines and the dexamethasone test explicitly but
      not the aldosterone-to-renin ratio, hence PARTIAL.

- name: Late-Night Salivary Cortisol
  biomarker_term:
    preferred_term: cortisol
    term:
      id: CHEBI:17650
      label: cortisol
  notes: >-
    Measures loss of the normal nocturnal nadir of cortisol secretion. Useful as a
    second-line confirmatory test for overt Cushing syndrome, but insensitive in
    MACS, where the circadian nadir is often preserved — which is precisely why
    the dexamethasone suppression test, not salivary cortisol, is the recommended
    first-line screen in adrenal incidentaloma.
  reference_ranges:
  - loinc_term:
      id: LOINC:2142-8
      label: Cortisol [Mass/volume] in Saliva (oral fluid)
    unit: nmol/L
    population: adults, specimen collected at 2300-2400 h
    notes: >-
      No numeric interval asserted: late-night salivary cortisol cutoffs are
      strongly assay-dependent (immunoassay versus LC-MS/MS) and vary between
      laboratories, so a repository-wide interval would be misleading. Provenance
      is recorded here rather than as a citation because no quotable interval was
      found in a citable source during curation. The LOINC code was verified
      against the NLM clinical-tables LOINC service.
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 1-mg overnight dexamethasone suppression test (applying a cutoff value of serum cortisol ≤50 nmol/L"
    explanation: >-
      Supports the point made in the notes: the guideline nominates the
      dexamethasone suppression test, not salivary cortisol, as the mandated
      first-line screen in adrenal incidentaloma.

- name: Elevated Aldosterone with Suppressed Renin
  biomarker_term:
    preferred_term: aldosterone
    term:
      id: CHEBI:27584
      label: aldosterone
  notes: >-
    The paired biochemical signature of an aldosterone-producing adenoma: raised
    plasma aldosterone in the face of a renin that has been suppressed by
    aldosterone-driven volume expansion. Either measurement alone is
    uninterpretable; it is the discordance that establishes autonomy.
  evidence:
  - reference: PMID:23416519
    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation-positive cases showed male dominance, increased plasma aldosterone concentrations and lower potassium concentrations compared with mutation-negative cases."
    explanation: >-
      Documents raised plasma aldosterone in genetically defined
      aldosterone-producing adenomas. PARTIAL because this sentence covers the
      aldosterone and potassium halves of the signature but says nothing about
      renin suppression; the item below carries the renin half.
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients had hypertension with elevated aldosterone levels despite suppressed plasma renin activity (PRA)"
    explanation: States the elevated-aldosterone-with-suppressed-renin pattern as the diagnostic criterion applied.

imaging_findings:
- name: Homogeneous Lipid-Rich Adrenal Mass with Low Unenhanced CT Attenuation
  modality: CT
  description: >-
    The single most useful imaging discriminator. Adrenal cortical adenomas are
    rich in intracytoplasmic lipid, which lowers their unenhanced CT attenuation.
    Under the 2023 ESE guideline a homogeneous lesion measuring 10 Hounsfield
    units or less on unenhanced CT is benign and requires no further imaging
    follow-up irrespective of size — a substantive change from earlier size-based
    surveillance.
  imaging_finding_term:
    preferred_term: Adrenocortical adenoma
    term:
      id: HP:0008256
      label: Adrenocortical adenoma
  located_in:
    preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  diagnostic: true
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homogeneous lesions with Hounsfield unit (HU) ≤ 10 on unenhanced CT are benign and do not require any additional imaging independent of size."
    explanation: Direct guideline statement of the diagnostic imaging criterion and its size independence.
  - reference: PMID:37583083
    reference_title: Recent Updates on the Management of Adrenal Incidentalomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a homogeneous adrenal mass with ≤10 Hounsfield units on non-contrast computed tomography requires no further follow-up, irrespective of its size"
    explanation: Independent restatement of the same criterion in the guideline review.

- name: Indeterminate Large or High-Attenuation Adrenal Mass
  modality: CT
  description: >-
    A lesion that is inhomogeneous or has unenhanced attenuation above 20 HU, and
    is larger than 4 cm, carries sufficient malignancy risk that surgery is the
    usual management. This is the imaging boundary between adrenal cortex adenoma
    and adrenocortical carcinoma.
  located_in:
    preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only lesions >4 cm that are inhomogeneous or have HU >20 have sufficiently high risk of malignancy that surgery will be the usual management of choice"
    explanation: Defines the imaging threshold that shifts management from surveillance to resection.
  notes: >-
    This finding argues *against* adrenal cortex adenoma and toward carcinoma; it is
    recorded here because it is the decision boundary of the incidentaloma work-up,
    not because it is diagnostic of adenoma.

histopathology:
- name: Circumscribed Lipid-Rich Cortical Adenoma
  description: >-
    Grossly circumscribed, often golden-yellow tumour composed of bland
    lipid-laden cortical cells, without destructive capsular or vascular invasion.
    Cortical origin is confirmed immunohistochemically with SF-1, inhibin-alpha,
    Melan-A and calretinin.
  diagnostic: true
  evidence:
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathological correlates of adrenal cortical proliferations include diffuse adrenal cortical hyperplasia, adrenal cortical nodular disease, adrenal cortical adenomas and adrenal cortical carcinomas."
    explanation: Places adrenal cortical adenoma within the WHO 2022 spectrum of cortical proliferations.

- name: Low Weiss Score
  description: >-
    Adrenal cortical adenoma is distinguished from carcinoma by multiparameter
    histologic scoring. In Weiss's original series, none of the 24 tumours with
    two or fewer of the nine criteria metastasised or recurred, while almost all
    with four or more did. A Weiss score of 2 or less therefore supports adenoma.
    The 2022 WHO classification retains Weiss and modified Weiss alongside the
    reticulin algorithm, Lin-Weiss-Bisceglia and Helsinki systems.
  diagnostic: true
  evidence:
  - reference: PMID:6703192
    reference_title: Comparative histologic study of 43 metastasizing and nonmetastasizing adrenocortical tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 24 tumors with two or less of these criteria metastasized or recurred, while all but one of the 19 tumors with four or more of these criteria either recurred or metastasized."
    explanation: The original derivation of the Weiss score threshold separating adenoma from carcinoma.
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to well-established Weiss and modified Weiss scoring systems, the new WHO classification also expands on the use of other multiparameter diagnostic algorithms (reticulin algorithm, Lin-Weiss-Bisceglia system, and Helsinki scoring system)"
    explanation: Confirms the continued role of Weiss scoring in the current WHO framework.

- name: Low Proliferative Index
  description: >-
    Adenomas show low mitotic activity and a low Ki67 labelling index. Most adult
    adrenal cortical carcinomas, by contrast, exceed 5 mitoses per 10 mm2 and 5%
    Ki67 — the proliferation-rate boundary is one of the most reproducible
    discriminators between the two entities.
  diagnostic: true
  evidence:
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most adult adrenal cortical carcinomas show > 5 mitoses per 10 mm2 and > 5% Ki67."
    explanation: Gives the proliferation thresholds above which carcinoma rather than adenoma is favoured.

- name: CYP11B2 Immunoreactivity in Aldosterone-Producing Lesions
  subtype: Aldosterone-Producing
  description: >-
    Aldosterone synthase (CYP11B2) immunohistochemistry identifies which cortical
    structures are actually producing aldosterone. The HISTALDO classification,
    endorsed by WHO 2022, uses this to distinguish a solitary CYP11B2-positive
    adenoma from multifocal or bilateral aldosterone-producing micronodules, which
    predicts the risk of persistent disease after unilateral adrenalectomy.
  diagnostic: true
  evidence:
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "uses CYP11B2 immunohistochemistry to identify functional sites of aldosterone production to help predict the risk of bilateral disease in primary aldosteronism"
    explanation: Establishes CYP11B2 immunohistochemistry as the WHO-endorsed functional marker.

genetic:
- name: PRKACA
  gene_term:
    preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Cortisol-Producing
  association: >-
    Recurrent activating hotspot mutations (c.617A>C; p.Leu206Arg counting the
    initiator methionine, equivalently L205R in the mature-protein numbering used
    in the earlier literature) in the P+1 loop of the PKA catalytic subunit. The mutant escapes inhibition by the PKA regulatory subunit, giving
    constitutive, cAMP-independent kinase activity.
  case_fractions:
  - population: Patients with unilateral adenoma and overt Cushing syndrome (European cohort)
    case_fraction_percent: 37.0
    cohort_size: 59
    notes: Somatic PRKACA mutations in 22 of 59 unilateral adenomas with overt Cushing syndrome.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PRKACA somatic mutations were identified in 22 of 59 unilateral adenomas (37%) from patients with overt Cushing's syndrome"
      explanation: Direct numerator and denominator for the PRKACA case fraction in this cohort.
  - population: Cortisol-producing adrenocortical adenomas (Chinese cohort)
    case_fraction_percent: 65.5
    cohort_size: 87
    notes: >-
      Markedly higher than the European estimate. Cohort composition and the
      threshold used to define "cortisol-producing" differ between the two
      studies, so the two figures should not be averaged.
    evidence:
    - reference: PMID:24700472
      reference_title: "Activating hotspot L205R mutation in PRKACA and adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a hotspot in the PRKACA gene with a L205R mutation in 69.2% (27 out of 39) of ACAs and validated in 65.5% of a total of 87 ACAs"
      explanation: Direct case fraction in the validation cohort of 87 adenomas.
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed somatic mutations in PRKACA, which encodes the catalytic subunit of cyclic AMP-dependent protein kinase"
    explanation: The discovery observation establishing PRKACA as the somatic driver.
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these mutations were not detectable in 40 patients with subclinical hypercortisolism"
    explanation: >-
      PRKACA mutation is absent in subclinical hypercortisolism (MACS), which is why
      this gene is scoped to the overt Cushing subtype rather than to cortisol
      autonomy generally — a direct constraint on the driver-to-subtype mapping.
  notes: >-
    Germline copy-number gain of the PRKACA locus causes bilateral
    cortisol-producing adrenal hyperplasia, not unilateral adenoma. That is a
    distinct disease entity and is out of scope for this entry.

- name: GNAS
  gene_term:
    preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Cortisol-Producing
  association: >-
    Activating mutations of the stimulatory G-protein alpha subunit lock Gs-alpha
    in its GTP-bound state, raising cAMP and activating PKA one step upstream of
    PRKACA.
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "somatic mutations in the gene encoding the α subunit of the stimulatory G protein (GNAS1) cause adenomas or hyperplasias leading to Cushing's syndrome"
    explanation: >-
      Establishes GNAS as a cAMP-pathway driver of cortisol-producing adrenal
      lesions. PARTIAL because the cited sentence continues "in patients with
      McCune-Albright syndrome or macronodular hyperplasia" — i.e. it evidences the
      pathway, not specifically the sporadic unilateral adenoma modelled here, and
      this study excluded somatic-GNAS cases from its own cohort.

- name: KCNJ5
  gene_term:
    preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Aldosterone-Producing
  association: >-
    Recurrent somatic mutations in and near the selectivity filter of the inwardly
    rectifying potassium channel Kir3.4 (p.Gly151Arg, p.Leu168Arg). Loss of K+
    selectivity permits Na+ conductance and chronic depolarisation. The commonest
    APA driver.
  case_fractions:
  - population: Aldosterone-producing adenomas (discovery cohort)
    case_fraction_percent: 36.4
    cohort_size: 22
    notes: 8 of 22 APAs in the original discovery series.
    evidence:
    - reference: PMID:21311022
      reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two recurrent somatic mutations in and near the selectivity filter of the potassium (K(+)) channel KCNJ5 that are present in 8 of 22 human APAs studied"
      explanation: Direct numerator and denominator for the discovery-cohort case fraction.
  evidence:
  - reference: PMID:21311022
    reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings explain pathogenesis in a subset of patients with severe hypertension and implicate loss of K(+) channel selectivity in constitutive cell proliferation and hormone production."
    explanation: >-
      Establishes the mechanism by which KCNJ5 mutation drives both proliferation
      and hormone excess. Tagged IN_VITRO because the mechanistic inference rests on
      the paper's electrophysiology, matching the tagging of the same sentence used
      on the Calcium Influx node.
  notes: >-
    Germline variants at the same KCNJ5 residues cause familial hyperaldosteronism
    type III with massive bilateral adrenal hyperplasia — a separate entity,
    curated under Familial_Hyperaldosteronism, not as a subtype here. The germline
    substitutions are not always identical to the somatic G151R/L168R changes.

- name: CACNA1D
  gene_term:
    preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  subtype: Aldosterone-Producing
  association: >-
    Gain-of-function mutations in the S6 pore-lining segments of the Cav1.3 L-type
    calcium channel (p.Gly403Arg, p.Ile770Met) shift channel activation to less
    depolarised potentials and impair inactivation, increasing calcium influx.
    Found in APAs that lack KCNJ5 mutations, demonstrating driver mutual
    exclusivity.
  case_fractions:
  - population: Aldosterone-producing adenomas (combined exome and Sanger cohort)
    case_fraction_percent: 7.8
    cohort_size: 64
    notes: 5 of 64 APAs overall; 5 of 41 (12.2%) among those without KCNJ5 or CTNNB1 mutations.
    evidence:
    - reference: PMID:23913001
      reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Collectively, CACNA1D mutations were identified in 5 of 64 APAs (7.8%), including 5/41 without KCNJ5 or CTNNB1 mutations (12.2%)."
      explanation: Direct case fractions, both overall and in the KCNJ5-wild-type subset.
  evidence:
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both alterations result in channel activation at less depolarized potentials; Gly403 alterations also impair channel inactivation."
    explanation: Electrophysiological demonstration of the gain-of-function mechanism.
  notes: >-
    De novo germline mutations at the same CACNA1D residues cause a distinct
    Mendelian syndrome of primary aldosteronism with seizures and neuromuscular
    abnormalities. That is a separate entity and is not curated here; only the
    somatic tumour driver is in scope.

- name: ATP1A1
  gene_term:
    preferred_term: ATP1A1
    term:

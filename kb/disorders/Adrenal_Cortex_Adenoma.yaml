    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Constitutive production of aldosterone (primary aldosteronism) results in hypertension, often associated with hypokalemia"
    explanation: Links primary aldosteronism to hypokalaemia as a frequent but not obligate accompaniment.
  notes: >-
    Frequency deliberately omitted. The cited source says only "often associated
    with hypokalemia" with no numerator or denominator, and contemporary reviews
    emphasise that primary aldosteronism is commonly normokalaemic. Assigning a
    FrequencyEnum band here would not be supported by quotable evidence.

- category: Metabolic
  name: Type II Diabetes Mellitus
  description: >-

  biological_scale: CELLULAR
  role: mediator
  description: >-
    The glomerulosa cell resting potential, normally close to the K+ equilibrium
    potential, shifts toward depolarisation. This is the convergence point of the
    channel and pump drivers, and the reason a heterogeneous set of genes produces
    one clinical phenotype.

    snippet: "All-cause mortality (adjusted for age, sex, comorbidities, and previous cardiovascular events) was significantly increased in patients with possible autonomous cortisol secretion (HR 1·52, 95% CI 1·19-1·94) and autonomous cortisol secretion (1·77, 1·20-2·62) compared with patients with non-functioning adenoma."
    explanation: Quantifies the adjusted mortality hazard across both cortisol-autonomy strata.

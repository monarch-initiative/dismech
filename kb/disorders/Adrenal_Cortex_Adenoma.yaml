    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "osteoporosis/osteopenia in MACS/SH were 43% ... and 50% (95% CI: 33%, 66%), respectively."
    explanation: >-
      Pooled prevalence of the composite osteoporosis/osteopenia endpoint is 50%

    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary aldosteronism is the most prevalent form of secondary hypertension."
    explanation: Establishes primary aldosteronism as the clinical phenotype of the aldosterone-producing adenoma.

- category: Cardiovascular
  name: Hypertension
  description: >-
    Elevated arterial blood pressure. It arises through two mechanistically
    distinct routes in this disease — mineralocorticoid excess in
    aldosterone-producing adenoma, and glucocorticoid excess in cortisol-producing
    adenoma and MACS.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  frequency: FREQUENT
  evidence:
  - reference: PMID:35533704
    reference_title: "Age-dependent and sex-dependent disparity in mortality in patients with adrenal incidentalomas and autonomous cortisol secretion: an international, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hypertension occurred in 1186 ... of 2024 patients with non-functioning adenoma, 944 ... of 1275 with possible autonomous cortisol secretion, and 179 ... of 238 with autonomous cortisol secretion"
    explanation: >-
      Gives the numerators and denominators for hypertension across the three
      cortisol strata (1186/2024 = 58.6%, 944/1275 = 74.0%, 179/238 = 75.2%), all
      of which fall in the FREQUENT (30-79%) band.
  notes: >-
    Frequency assigned FREQUENT from the counts quoted above (58.6-75.2% across
    the cortisol-autonomy strata of the NAPACA cohort). Hypertension is
    near-universal in the aldosterone-producing subtype specifically, since it is
    part of that subtype's case definition, so the subtype-level frequency is
    higher than this disease-level band; that subtype-specific figure was not
    separately curated.

- category: Endocrine
  name: Hypokalemia
  subtype: Aldosterone-Producing
  description: >-
    Low serum potassium from aldosterone-driven distal kaliuresis. Present in only
    a minority of patients with primary aldosteronism — normokalaemia does not
    exclude the diagnosis.
  phenotype_term:
    preferred_term: Hypokalemia
    term:
      id: HP:0002900

  - reference: PMID:38703381
    reference_title: "Fracture risk and bone health in adrenal adenomas with mild autonomous cortisol secretion/subclinical hypercortisolism: a systematic review, meta-analysis and meta-regression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

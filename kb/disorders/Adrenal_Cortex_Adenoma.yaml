- subtype: MACS
  population: Patients with a benign adrenal tumour referred to endocrine centres (ENSAT EURINE-ACT)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 45300.0

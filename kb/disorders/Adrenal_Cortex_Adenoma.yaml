    explanation: Attributes benign adrenal tumorigenesis to Wnt/beta-catenin activation.

treatments:
- name: Unilateral Adrenalectomy
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Definitive treatment for a unilateral aldosterone-producing adenoma and for an
    overt cortisol-producing adenoma; considered on an individualised basis in
    MACS when cortisol-attributable comorbidity is present. A minimally invasive
    approach is preferred for benign hormone-secreting lesions. It is not
    indicated for an asymptomatic, non-functioning unilateral mass with benign
    imaging features. Biochemical cure rates after adrenalectomy for unilateral
    primary aldosteronism are high (94% complete biochemical success in the PASO
    cohort), but complete clinical (blood-pressure) success is achieved in only
    about 37% — a distinction clinicians and curators should not conflate.
  treatment_term:
    preferred_term: Adrenalectomy
    term:
      id: NCIT:C15177
      label: Adrenalectomy
  target_mechanisms:
  - target: CYP11B2 Induction and Autonomous Aldosterone Synthesis
    treatment_effect: INHIBITS
    description: Removal of the tumour eliminates the autonomous source of aldosterone.
  - target: ACTH-Independent Cortisol Hypersecretion
    treatment_effect: INHIBITS
    description: Removal of the tumour eliminates the autonomous source of cortisol.
  evidence:
  - reference: PMID:28576687
    reference_title: "Outcomes after adrenalectomy for unilateral primary aldosteronism: an international consensus on outcome measures and analysis of remission rates in an international cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete clinical success was achieved in 259 (37%) of 705 patients, with a wide variance (range 17-62), and partial clinical success in an additional 334 (47%, range 35-66); complete biochemical success was seen in 656 (94%, 83-100) of 699 patients."
    explanation: Quantifies the divergence between biochemical cure and clinical (blood-pressure) cure after adrenalectomy.
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with MACS who also have relevant comorbidities surgical treatment should be considered in an individualized approach."
    explanation: States the individualised indication for surgery in MACS.
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery is not usually indicated in patients with an asymptomatic, nonfunctioning unilateral adrenal mass and obvious benign features on imaging studies."
    explanation: States the explicit contraindication to surgery in non-functioning benign lesions.

- name: Mineralocorticoid Receptor Antagonist Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Spironolactone or eplerenone block the mineralocorticoid receptor, addressing
    both the blood-pressure and the direct target-organ effects of aldosterone
    excess. Used when surgery is declined or not feasible, while awaiting
    lateralisation, or when disease proves bilateral. Requires monitoring for
    hyperkalaemia and declining renal function; spironolactone additionally causes
    gynaecomastia and menstrual disturbance through its antiandrogenic and
    progestogenic activity, which is the usual reason for switching to eplerenone.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
    - preferred_term: eplerenone
      term:
        id: CHEBI:31547
        label: eplerenone
  target_mechanisms:
  - target: Renin-Independent Mineralocorticoid Excess
    treatment_effect: INHIBITS
    description: >-
      Receptor blockade prevents aldosterone from acting on the distal nephron and
      on cardiovascular tissue, even though tumour aldosterone output is unchanged.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that patients with bilateral adrenal hyperplasia or those unsuitable for surgery should be treated primarily with a mineralocorticoid receptor antagonist."
    explanation: >-
      Guideline recommendation establishing mineralocorticoid receptor antagonism
      as the primary medical therapy when surgery is not the chosen route.
  - reference: PMID:29129575
    reference_title: "Cardiovascular events and target organ damage in primary aldosteronism compared with essential hypertension: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "primary aldosteronism increased the risk of diabetes (OR 1·33, 95% CI 1·01-1·74), metabolic syndrome (1·53, 1·22-1·91), and left ventricular hypertrophy (2·29, 1·65-3·17)."
    explanation: >-
      Quantifies the aldosterone-attributable end-organ burden that motivates
      receptor blockade. PARTIAL because this meta-analysis measures the untreated
      risk, not the treatment effect of mineralocorticoid receptor antagonists.

- name: Perioperative and Postoperative Glucocorticoid Replacement
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Patients with cortisol autonomy who undergo adrenalectomy have a suppressed
    hypothalamic-pituitary-adrenal axis and an atrophic contralateral cortex, and
    will develop adrenal insufficiency on removal of the tumour. Stress-dose
    hydrocortisone is given perioperatively and then tapered according to recovery
    of the axis, which may take months. Omitting this is a recognised cause of
    avoidable postoperative adrenal crisis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrocortisone
      term:
        id: CHEBI:17650
        label: cortisol
  target_phenotypes:
  - preferred_term: Adrenal insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  target_mechanisms:
  - target: HPA Axis Suppression and Contralateral Adrenal Atrophy
    treatment_effect: MODULATES
    description: >-
      Exogenous glucocorticoid substitutes for the deficient endogenous output
      until the suppressed axis recovers.
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The appropriateness of surgical intervention should be guided by the likelihood of malignancy, the presence and degree of hormone excess, age, general health, and patient preference."
    explanation: >-
      Supports the link between degree of hormone excess and surgical planning, of
      which glucocorticoid cover is part. PARTIAL because the abstract does not
      state the perioperative steroid recommendation explicitly.

- name: Screening for and Treatment of Cortisol-Attributable Comorbidity in MACS
  action_category: SCREENING
  description: >-
    The practical consequence of the MACS reclassification: rather than reassuring
    the patient, every individual with MACS should be actively screened for
    hypertension, type 2 diabetes, dyslipidaemia and osteoporosis, and those
    conditions treated on their own terms. This is now a guideline recommendation
    and, for the large majority of MACS patients who do not undergo surgery, it is
    the entire intervention.
  treatment_term:
    preferred_term: Disease Screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with MACS should be screened for potential cortisol-related comorbidities that are potentially attributably to cortisol (eg, hypertension and type 2 diabetes mellitus), to ensure these are appropriately treated."
    explanation: Direct guideline recommendation for comorbidity screening in MACS.
  - reference: PMID:38703381
    reference_title: "Fracture risk and bone health in adrenal adenomas with mild autonomous cortisol secretion/subclinical hypercortisolism: a systematic review, meta-analysis and meta-regression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "people with adrenal adenomas/incidentalomas and MACS/SH are at a 1.5- to 2-fold higher likelihood of fractures and osteoporosis/osteopenia compared to non-functional adrenal adenomas and should routinely be screened for bone disease"
    explanation: Extends the screening recommendation to bone disease specifically.

- name: Non-Operative Management of the Benign Non-Functioning Adenoma
  action_category: MONITORING
  description: >-
    For a homogeneous adrenal mass measuring 10 HU or less on unenhanced CT with a
    normal endocrine work-up, the 2023 ESE guideline recommends no further imaging
    follow-up at all, irrespective of size, and no surgery. This is a deliberate
    de-escalation from earlier size-based surveillance protocols and spares a large
    number of patients repeated CT and its radiation burden.
  treatment_term:
    preferred_term: Diagnostic Imaging Testing
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homogeneous lesions with Hounsfield unit (HU) ≤ 10 on unenhanced CT are benign and do not require any additional imaging independent of size."
    explanation: Direct guideline basis for withholding imaging surveillance in benign lesions.
  - reference: PMID:37583083
    reference_title: Recent Updates on the Management of Adrenal Incidentalomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "requires no further follow-up, irrespective of its size"
    explanation: Confirms the removal of the size restriction from the follow-up rule.

- name: Steroidogenesis Inhibitor Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Metyrapone (an 11-beta-hydroxylase inhibitor) and related agents can lower
    cortisol in severe hypercortisolism when surgery must be delayed or is not
    possible. This is a bridging or salvage measure, not definitive therapy for a
    resectable benign adenoma.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metyrapone
      term:
        id: CHEBI:44241
        label: metyrapone
  target_mechanisms:
  - target: ACTH-Independent Cortisol Hypersecretion
    treatment_effect: INHIBITS
    description: >-
      Blockade of 11-beta-hydroxylase reduces cortisol synthesis by the tumour
      without removing it.
  evidence:
  - reference: PMID:35769081
    reference_title: "Metyrapone Versus Osilodrostat in the Short-Term Therapy of Endogenous Cushing's Syndrome: Results From a Single Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metyrapone and osilodrostat are both steroidogenic inhibitors targeting the 11β-hydroxylase"
    explanation: States the 11-beta-hydroxylase target that is the mechanism claimed for this treatment.
  - reference: PMID:35769081
    reference_title: "Metyrapone Versus Osilodrostat in the Short-Term Therapy of Endogenous Cushing's Syndrome: Results From a Single Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "medical therapy is often required to control severe hypercortisolism"
    explanation: >-
      Establishes the indication — medical cortisol lowering when surgery does not
      control hypercortisolism. The cohort included adrenal Cushing syndrome.

differential_diagnoses:
- name: Adrenal Cortex Carcinoma
  disease_term:
    preferred_term: adrenal cortex carcinoma
    term:
      id: MONDO:0006639
      label: adrenal cortex carcinoma
  description: >-
    The single most consequential distinction. Adrenocortical carcinoma is a
    malignant tumour of the same cortical lineage with an entirely different
    prognosis, and misclassifying one as the other is the main harm the adrenal
    incidentaloma work-up exists to prevent. Carcinoma is favoured by larger size,
    inhomogeneity and higher unenhanced attenuation on CT, by high proliferation
    rate and angioinvasion on histology, by IGF2 overexpression, and by TP53 and
    CTNNB1 alterations with broad copy-number instability. Rapid virilisation or
    feminisation, or mixed steroid excess, is a red flag for carcinoma rather than
    adenoma.
  distinguishing_features:
  - Size greater than 4 cm with inhomogeneity or unenhanced CT attenuation above 20 HU
  - Weiss score of 4 or more (adenoma 2 or less); angioinvasion; more than 5 mitoses per 10 mm2 and more than 5% Ki67
  - IGF2 overexpression detectable by immunohistochemistry
  - Broad copy-number instability, TP53 disruption, extensive methylomic derangement
  - Rapid onset of virilisation, feminisation or mixed steroid excess
  evidence:
  - reference: PMID:6703192
    reference_title: Comparative histologic study of 43 metastasizing and nonmetastasizing adrenocortical tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 24 tumors with two or less of these criteria metastasized or recurred, while all but one of the 19 tumors with four or more of these criteria either recurred or metastasized."
    explanation: The Weiss threshold that operationalises the adenoma-versus-carcinoma distinction.
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most adult adrenal cortical carcinomas show > 5 mitoses per 10 mm2 and > 5% Ki67."
    explanation: Gives the proliferation-rate thresholds distinguishing carcinoma from adenoma.
  - reference: PMID:38108848
    reference_title: "Molecular pathology of endocrine gland tumors: genetic alterations and clinicopathologic relevance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "overexpression in adrenal cortical carcinoma can be identified by immunohistochemistry and may be useful in the differential diagnosis with adenoma"
    explanation: >-
      States that IGF2 overexpression is a useful immunohistochemical discriminator
      between carcinoma and adenoma. The snippet begins mid-sentence because the
      cached full text renders "IGF2overexpression" without a separating space.
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only lesions >4 cm that are inhomogeneous or have HU >20 have sufficiently high risk of malignancy that surgery will be the usual management of choice"
    explanation: Gives the imaging criteria that raise suspicion of carcinoma.
  notes: >-
    Adrenal cortex carcinoma is a distinct disease entity, not a subtype or a
    progression stage of adrenal cortex adenoma. There is no established
    adenoma-to-carcinoma sequence in the adrenal cortex analogous to the colorectal
    adenoma-carcinoma sequence.

- name: Bilateral Macronodular Adrenal Hyperplasia
  disease_term:
    preferred_term: Cushing syndrome due to macronodular adrenal hyperplasia
    term:
      id: MONDO:0009049
      label: Cushing syndrome due to macronodular adrenal hyperplasia
  description: >-
    A bilateral, multinodular adrenocortical disease causing ACTH-independent
    cortisol excess, caused in roughly half of cases by inactivating germline
    ARMC5 mutations with a somatic second hit in each nodule. It shares the
    cortisol phenotype with a cortisol-producing adenoma but is bilateral,
    macronodular, germline-driven and heritable — so it demands genetic counselling
    and family screening, and cannot be cured by unilateral adrenalectomy. It is a
    separate entity, not a bilateral variant of adrenal cortex adenoma.
  distinguishing_features:
  - Bilateral macronodular adrenal enlargement rather than a solitary unilateral mass
  - Germline ARMC5 inactivating mutations in approximately 44% of cases
  - Heritable; warrants cascade genetic testing of relatives
  - Not curable by unilateral adrenalectomy
  evidence:
  - reference: PMID:24601692
    reference_title: "Macronodular adrenal hyperplasia due to mutations in an armadillo repeat containing 5 (ARMC5) gene: a clinical and genetic investigation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline ARMC5 mutations were found in 15 of 34 patients (44.1%)."
    explanation: Quantifies the germline ARMC5 contribution that distinguishes this entity mechanistically.
  - reference: PMID:24601692
    reference_title: "Macronodular adrenal hyperplasia due to mutations in an armadillo repeat containing 5 (ARMC5) gene: a clinical and genetic investigation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Knowledge of a patient's ARMC5 status has important clinical implications for the diagnosis of Cushing's syndrome and genetic counseling of patients and their families."
    explanation: Establishes the heritability and counselling implications absent from sporadic adrenal cortex adenoma.

- name: Primary Pigmented Nodular Adrenocortical Disease
  disease_term:
    preferred_term: primary pigmented nodular adrenocortical disease
    term:
      id: MONDO:0015999
      label: primary pigmented nodular adrenocortical disease
  description: >-
    Bilateral micronodular pigmented adrenocortical disease causing
    ACTH-independent Cushing syndrome, usually in children and young adults,
    caused by germline inactivating PRKAR1A mutations and frequently part of
    Carney complex. It converges on the same pathway as the cortisol-producing
    adenoma — loss of PKA regulatory-subunit restraint — but from the opposite
    direction (germline loss of the regulatory subunit rather than somatic gain in
    the catalytic subunit) and with a bilateral, germline, syndromic presentation.
    Curated separately in this knowledge base as
    Primary_Pigmented_Nodular_Adrenocortical_Disease.
  distinguishing_features:
  - Bilateral pigmented micronodules rather than a solitary unilateral adenoma
  - Germline PRKAR1A inactivating mutations, often with Carney complex features (lentigines, myxomas, other endocrine tumours)
  - Typically presents in childhood or young adulthood
  - Paradoxical rise in urinary free cortisol on the Liddle dexamethasone test
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "have been identified in patients with Cushing’s syndrome due to primary pigmented nodular adrenocortical disease"
    explanation: >-
      Establishes PRKAR1A as the driver of primary pigmented nodular adrenocortical
      disease, contrasting with the somatic PRKACA driver of unilateral
      cortisol-producing adenoma.

- name: Pheochromocytoma
  disease_term:
    preferred_term: pheochromocytoma
    term:
      id: MONDO:0008233
      label: pheochromocytoma
  description: >-
    A catecholamine-secreting tumour of the adrenal medulla, not the cortex. It is
    a mandatory exclusion in any adrenal incidentaloma work-up because
    unrecognised pheochromocytoma can precipitate a hypertensive crisis during
    biopsy, surgery or anaesthesia. Plasma or urinary metanephrines must be
    measured in every patient before any invasive procedure.
  distinguishing_features:
  - Medullary (chromaffin) rather than cortical origin
  - Elevated plasma free or urinary fractionated metanephrines
  - High unenhanced CT attenuation (above 10 HU), often with marked contrast enhancement
  - Episodic headache, palpitations and sweating with paroxysmal hypertension
  - Biopsy or unprepared surgery can precipitate a hypertensive crisis
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Every patient needs a thorough clinical and endocrine work-up to exclude hormone excess including the measurement of plasma or urinary metanephrines"
    explanation: Mandates metanephrine measurement to exclude pheochromocytoma in every adrenal incidentaloma.

- name: Adrenal Metastasis
  disease_term:
    preferred_term: metastatic neoplasm
    term:
      id: MONDO:0024883
      label: metastatic neoplasm
  description: >-
    Secondary deposit in the adrenal gland, most often from lung, breast, renal or
    gastrointestinal primaries or melanoma. In a patient with a known extra-adrenal
    malignancy this — not adenoma — is the leading explanation for a new adrenal
    mass, which is why the ESE guideline treats prior malignancy as a distinct
    management context. Metastases are typically inhomogeneous, lipid-poor with
    unenhanced attenuation above 10 HU, and are frequently bilateral.
  distinguishing_features:
  - Known or suspected extra-adrenal primary malignancy
  - Lipid-poor, inhomogeneous, unenhanced attenuation above 10 HU
  - Frequently bilateral, unlike the typically unilateral adenoma
  - Hormonally silent, so a normal endocrine work-up does not exclude it
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may also require therapeutic intervention including that for adrenocortical carcinoma, pheochromocytoma, hormone-producing adenoma, or metastases"
    explanation: >-
      The ESE guideline lists metastases among the incidentaloma diagnoses that must
      be separated from benign non-functioning adenoma.

- name: Adrenal Myelolipoma
  disease_term:
    preferred_term: adrenal gland myelolipoma
    term:
      id: MONDO:0006075
      label: adrenal gland myelolipoma
  description: >-
    A benign, hormonally inactive tumour composed of mature adipose tissue and
    haematopoietic elements. It is radiologically unmistakable because of its
    macroscopic fat, which gives strongly negative CT attenuation — well below the
    lipid-rich adenoma threshold. No endocrine work-up beyond the standard
    incidentaloma screen and no follow-up is needed for a typical lesion.
  distinguishing_features:
  - Macroscopic fat with markedly negative CT attenuation, well below 0 HU
  - Composed of mature adipose tissue plus haematopoietic elements on histology
  - Hormonally inactive
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Each adrenal mass requires dedicated adrenal imaging."
    explanation: >-
      Supports the imaging-first triage in which myelolipoma is separated from
      adenoma by attenuation. PARTIAL because the abstract does not name
      myelolipoma explicitly.

diagnosis:
- name: Adrenal Vein Sampling
  description: >-
    Bilateral adrenal venous sampling is the reference standard for deciding
    whether confirmed primary aldosteronism is unilateral (an aldosterone-producing
    adenoma, curable by adrenalectomy) or bilateral (hyperplasia, treated
    medically). It is required because CT cannot reliably identify the secreting
    side: non-functioning adrenal nodules become common with age, so a visible
    nodule may not be the source of the aldosterone, and conversely an
    aldosterone-producing lesion may be too small to see. Getting this wrong means
    either removing the wrong gland or denying a curable patient surgery.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that an experienced radiologist should establish/exclude unilateral primary aldosteronism using bilateral adrenal venous sampling, and if confirmed, this should optimally be treated by laparoscopic adrenalectomy."
    explanation: Guideline basis for adrenal vein sampling as the lateralisation standard before adrenalectomy.
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "not all grossly or radiologically identified adrenal cortical lesions may be the source of aldosterone excess"
    explanation: States the reason imaging alone cannot lateralise primary aldosteronism.
  notes: >-
    No structured `diagnosis_term` is bound: NCIT has no adrenal-venous-sampling
    concept that is both specific and reachable from the procedure roots used by
    this schema, so a term is omitted rather than approximated.

- name: Adrenal CT for Subtype Testing
  description: >-
    Unenhanced adrenal CT is the initial subtype study in confirmed primary
    aldosteronism, used both to look for a lateralising lesion and to exclude
    adrenocortical carcinoma before any surgical plan.
  evidence:
  - reference: PMID:26934393
    reference_title: "The Management of Primary Aldosteronism: Case Detection, Diagnosis, and Treatment: An Endocrine Society Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that all patients with primary aldosteronism undergo adrenal computed tomography as the initial study in subtype testing and to exclude adrenocortical carcinoma."
    explanation: Guideline basis for adrenal CT as the initial subtype and malignancy-exclusion study.

references:
- reference: PMID:37318239
  title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
- reference: PMID:35288842
  title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.

notes: >-
  Scope and boundaries. This entry covers the benign adrenal cortical neoplasm
  only. Three adjacent entities were deliberately excluded and modelled as
  differential diagnoses rather than subtypes, because each has a distinct driver,
  laterality and inheritance: adrenal cortex carcinoma (MONDO:0006639), bilateral
  macronodular adrenal hyperplasia (ARMC5; MONDO:0009049), and primary pigmented
  nodular adrenocortical disease (PRKAR1A / Carney complex; MONDO:0015999), the
  last of which is already curated in this knowledge base as
  Primary_Pigmented_Nodular_Adrenocortical_Disease.

  Relationship to existing entries. The downstream clinical syndromes caused by
  functional adenomas are curated separately and are not duplicated here:
  Cushings_Syndrome covers the full hypercortisolism syndrome across all
  aetiologies (pituitary, ectopic and adrenal), and Familial_Hyperaldosteronism
  and Familial_Hyperaldosteronism_Type_I cover the germline forms of aldosterone
  excess. This entry models the adenoma itself and the mechanistic chain from its
  somatic driver to the hormone excess; the syndrome entries model the systemic
  consequences of that hormone excess in full.

  On the functional axis. Subtypes are defined by autonomous secretion rather than
  by histology or size because that is what determines management, and because the
  somatic driver classes map cleanly onto the secretory phenotypes. MACS is
  modelled as a subtype in its own right rather than as mild Cushing syndrome,
  reflecting its 2023 ESE-formalised status and the mortality and fracture data
  that reclassified it.

  Curation gaps for a future pass. (1) No numeric interval is asserted for the
  aldosterone-to-renin ratio or for late-night salivary cortisol; both are strongly
  assay- and unit-dependent and no citable quotable interval was found. (2) Rare
  androgen-, estrogen- and mixed-steroid-secreting adenomas are noted in the
  literature but are not modelled as subtypes, because marked sex-steroid excess
  should raise suspicion of carcinoma rather than adenoma. (3) Bilateral adrenal
  hyperplasia (idiopathic hyperaldosteronism) is the differential that adrenal vein
  sampling exists to resolve and is discussed in the Adrenal Vein Sampling
  diagnosis entry, but is not curated as a structured differential_diagnoses item
  because MONDO has no distinct term for it separate from primary aldosteronism
  itself. (4) Metabolic alkalosis, a recognised accompaniment of marked
  hypokalaemic mineralocorticoid excess, was removed during review: the only
  cached source for it was a germline PASNA case with no adrenal adenoma, and no
  adenoma-specific citable statement was found. (5) No `conforms_to` link is
  declared to `osteoporosis_bone_resorption`; glucocorticoid-induced osteoporosis
  is a plausible conformer but the module's node-level expectations were not
  checked against this entry. (6) `clinical_trials:` is absent; the six NCTs
  surfaced by deep research are all observational or diagnostic rather than
  interventional.

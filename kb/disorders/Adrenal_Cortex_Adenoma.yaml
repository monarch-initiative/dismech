  evidence:
  - reference: PMID:34978855
    reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "34.6% had MACS-1 ... 10.7% had MACS-2"
    explanation: Gives the MACS-1 and MACS-2 fractions summing to the quoted MACS proportion.

pathophysiology:
- name: Clonal Adrenocortical Proliferation
  biological_scale: CELLULAR
  role: trigger
  description: >-
    A somatic driver mutation in a single adrenocortical cell produces a clonal,
    benign, well-circumscribed proliferation. Unlike adrenocortical carcinoma,
    this proliferation is self-limited: there is no destructive capsular or
    vascular invasion and no metastatic capacity. The driver that initiates the
    clone also determines the tumour's secretory phenotype, which is why the
    functional classification of adrenal adenomas maps onto distinct mutational
    classes rather than onto tumour size or histology.
  cell_types:
  - preferred_term: adrenal cortical cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  locations:
  - preferred_term: adrenal cortex
    term:
      id: UBERON:0001235
      label: adrenal cortex
  evidence:
  - reference: PMID:35288842
    reference_title: Overview of the 2022 WHO Classification of Adrenal Cortical Tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recognition of the clonal-neoplastic nature of incidentally discovered non-functional subcentimeter benign adrenal cortical nodules has led to redefining the spectrum of adrenal cortical nodular disease"
    explanation: WHO 2022 affirms the clonal-neoplastic nature of benign adrenal cortical nodules.
  downstream:
  - target: Adrenal Cortical Mass
    causal_link_type: DIRECT
    description: >-
      The clonal proliferation is itself the radiologically and pathologically
      detected adrenal mass.
    evidence:
    - reference: PMID:37318239
      reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In most cases, adrenal incidentalomas are nonfunctioning adrenocortical adenomas"
      explanation: Links the detected adrenal mass to an underlying adrenocortical adenoma.

- name: PRKACA Catalytic Subunit Activation
  biological_scale: MOLECULAR
  role: driver
  description: >-
    Somatic hotspot mutations in PRKACA — the recurrent change is c.617A>C,
    designated p.Leu206Arg when the initiator methionine is counted and widely
    reported in the earlier literature as L205R under mature-protein numbering
    that omits it — lie in the P+1 loop at the interface between the PKA
    catalytic subunit and its regulatory subunit. The mutant catalytic subunit can no longer be held inactive by the
    regulatory subunit, so kinase activity becomes constitutive and
    cAMP-independent. Activating GNAS mutations produce the same functional
    endpoint one step upstream by locking Gs-alpha in its active state.
  genes:
  - preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  - preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    modifier: INCREASED
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRKACA somatic mutations were identified in 22 of 59 unilateral adenomas (37%) from patients with overt Cushing's syndrome"
    explanation: Quantifies PRKACA somatic mutation frequency in overtly cortisol-producing adenomas.
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro studies showed impaired inhibition of both PKA catalytic subunit mutants by the PKA regulatory subunit"
    explanation: Demonstrates the loss of regulatory-subunit restraint that is the molecular mechanism of the driver.
  - reference: PMID:24700472
    reference_title: "Activating hotspot L205R mutation in PRKACA and adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a hotspot in the PRKACA gene with a L205R mutation in 69.2% (27 out of 39) of ACAs and validated in 65.5% of a total of 87 ACAs."
    explanation: Independent cohort confirming the PRKACA hotspot and its high frequency in cortisol-producing adenomas.
  downstream:
  - target: Constitutive cAMP-PKA Signalling
    causal_link_type: DIRECT
    description: >-
      Loss of regulatory-subunit inhibition renders PKA catalytic activity
      constitutive and independent of upstream cAMP.
    evidence:
    - reference: PMID:24700472
      reference_title: "Activating hotspot L205R mutation in PRKACA and adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the activating L205R mutation, which locates in the P+1 loop of the protein kinase A (PKA) catalytic subunit, promoted PKA substrate phosphorylation and target gene expression"
      explanation: Functional demonstration that the hotspot mutation increases PKA substrate phosphorylation.

- name: Constitutive cAMP-PKA Signalling
  biological_scale: MOLECULAR
  role: mediator
  description: >-
    Unrestrained PKA catalytic activity phosphorylates CREB and other substrates,
    driving transcription of the steroidogenic program (STAR, CYP11A1, CYP11B1)
    in the absence of ACTH stimulation. The same signalling supports the modest
    proliferative advantage that allows the clone to form a macroscopic adenoma.
  biological_processes:
  - preferred_term: protein phosphorylation
    modifier: INCREASED
    term:
      id: GO:0006468
      label: protein phosphorylation
  evidence:
  - reference: PMID:24700472
    reference_title: "Activating hotspot L205R mutation in PRKACA and adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "promoted PKA substrate phosphorylation and target gene expression"
    explanation: Directly evidences increased PKA-dependent substrate phosphorylation and transcriptional output.
  downstream:
  - target: Clonal Adrenocortical Proliferation
    causal_link_type: DIRECT
    description: >-
      The same unrestrained PKA activity supports the proliferative advantage that
      lets the mutant clone grow into a macroscopic adenoma, so the cortisol arm
      feeds the shared proliferation trunk just as the aldosterone and Wnt arms do.
    evidence:
    - reference: PMID:24700472
      reference_title: "Activating hotspot L205R mutation in PRKACA and adrenal Cushing's syndrome."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "promoted PKA substrate phosphorylation and target gene expression"
      explanation: >-
        Evidences the increased PKA transcriptional output that underlies the
        proliferative advantage. PARTIAL because the cited sentence demonstrates
        signalling output rather than measuring proliferation directly.
  - target: ACTH-Independent Cortisol Hypersecretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - CREB phosphorylation and CRE-dependent transcription
    - Induction of STAR and steroidogenic cytochrome P450 enzymes (CYP11A1, CYP11B1)
    description: >-
      PKA-driven transcription of the steroidogenic machinery produces cortisol
      output that does not require ACTH.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Corticotropin-independent Cushing's syndrome is caused by tumors or hyperplasia of the adrenal cortex."
      explanation: Establishes that the cortisol excess in these adenomas is corticotropin-independent.

- name: ACTH-Independent Cortisol Hypersecretion
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Zona fasciculata-like tumour cells synthesise and release cortisol
    autonomously, uncoupled from the hypothalamic-pituitary axis. The magnitude of
    this autonomous output is the single variable that determines whether the
    patient presents with overt Cushing syndrome, with MACS, or with no
    cortisol-related phenotype at all — the same mechanism operating along a
    continuum of severity.
  cell_types:
  - preferred_term: zona fasciculata cell
    term:
      id: CL:0002136
      label: type II cell of adrenal cortex
  biological_processes:
  - preferred_term: cortisol biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0034651
      label: cortisol biosynthetic process
  locations:
  - preferred_term: zona fasciculata
    term:
      id: UBERON:0002054
      label: zona fasciculata of adrenal gland
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypersecretion of cortisol can be driven by an excess of pituitary or ectopic corticotropin or can be due to adrenocortical tumors or hyperplasias with corticotropin-independent cortisol production."
    explanation: States that adrenocortical tumours produce cortisol corticotropin-independently.
  downstream:
  - target: Primary Hypercortisolism
    causal_link_type: DIRECT
    description: Autonomous adrenal cortisol output is, by definition, primary hypercortisolism.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Endogenous hypercortisolism, referred to as Cushing’s syndrome, is associated with substantial morbidity and mortality."
      explanation: Links autonomous cortisol production to endogenous hypercortisolism and its morbidity.
  - target: HPA Axis Suppression and Contralateral Adrenal Atrophy
    causal_link_type: DIRECT
    description: >-
      Autonomous cortisol feeds back on the pituitary, suppressing ACTH and
      depriving the contralateral adrenal cortex of trophic support.
    evidence:
    - reference: PMID:37318239
      reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "a 1-mg overnight dexamethasone suppression test (applying a cutoff value of serum cortisol ≤50 nmol/L"
      explanation: >-
        Indirect support: the diagnostic test itself is a feedback-suppression
        test, whose failure demonstrates that tumour cortisol output is not under
        hypothalamic-pituitary control. The guideline does not state contralateral
        atrophy explicitly, hence PARTIAL.
  - target: Chronic Glucocorticoid Excess
    causal_link_type: DIRECT
    description: >-
      When autonomous output is high, sustained supraphysiological glucocorticoid
      exposure of peripheral tissues follows.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "When Cushing’s syndrome is severe, patients have catabolic symptoms such as muscle weakness, skin fragility, osteoporosis, and severe metabolic sequelae."
      explanation: Connects sustained cortisol excess to the catabolic multi-system phenotype.
  - target: Mild Autonomous Cortisol Secretion
    causal_link_type: DIRECT
    description: >-
      When autonomous output is low-grade, the patient has biochemical cortisol
      autonomy without the classical clinical stigmata — the MACS state.
    evidence:
    - reference: PMID:37318239
      reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "most patients without clinical signs of overt Cushing's syndrome but serum cortisol levels post dexamethasone >50 nmol/L (>1.8 µg/dL) harbor increased risk of morbidity and mortality"
      explanation: Defines the low-grade autonomy state that the ESE guideline names MACS.

- name: HPA Axis Suppression and Contralateral Adrenal Atrophy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Negative feedback from tumour-derived cortisol suppresses pituitary ACTH
    secretion; the non-tumorous ipsilateral and contralateral adrenal cortex
    atrophies. This is clinically silent while the adenoma is in place but becomes
    the dominant management problem immediately after adrenalectomy, when the
    remaining gland cannot mount a cortisol response — hence the requirement for
    perioperative and tapering glucocorticoid cover, with
    hypothalamic-pituitary-adrenal recovery often taking months.
  evidence:
  - reference: PMID:37318239
    reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Every patient needs a thorough clinical and endocrine work-up to exclude hormone excess"
    explanation: >-
      Indirect support only: the guideline mandates the endocrine work-up that
      detects cortisol autonomy, which is what predicts postoperative adrenal
      insufficiency. Marked PARTIAL because the abstract does not itself describe
      contralateral atrophy.
  downstream:
  - target: Adrenal Insufficiency
    causal_link_type: DIRECT
    description: >-
      After removal of the autonomous source, the suppressed contralateral gland
      is temporarily unable to sustain cortisol output.
    evidence:
    - reference: PMID:37318239
      reference_title: "European Society of Endocrinology clinical practice guidelines on the management of adrenal incidentalomas, in collaboration with the European Network for the Study of Adrenal Tumors."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The appropriateness of surgical intervention should be guided by the likelihood of malignancy, the presence and degree of hormone excess"
      explanation: >-
        Indirect: the guideline ties surgical planning to the degree of hormone
        excess, which is what determines postoperative adrenal insufficiency risk.
        No abstract sentence states the complication directly, hence PARTIAL.

- name: Chronic Glucocorticoid Excess
  biological_scale: ORGANISM
  role: effector
  description: >-
    Sustained supraphysiological cortisol exposure produces the classical Cushing
    phenotype: central and abdominal fat redistribution, proteolytic muscle wasting
    with proximal weakness, dermal collagen loss with easy bruising, insulin
    resistance and type 2 diabetes, hypertension, and glucocorticoid-induced
    osteoporosis with fragility fracture.
  evidence:
  - reference: PMID:24571724
    reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients have catabolic symptoms such as muscle weakness, skin fragility, osteoporosis, and severe metabolic sequelae"
    explanation: Enumerates the catabolic consequences of severe glucocorticoid excess.
  downstream:
  - target: Abdominal Obesity
    causal_link_type: DIRECT
    description: Glucocorticoid-driven central fat redistribution.
    evidence:
    - reference: PMID:34978855
      reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Urinary multisteroid profiling revealed an increase in glucocorticoid excretion from NFAT over MACS-1 and MACS-2 to CS"
      explanation: >-
        Supports the graded glucocorticoid-exposure axis on which central adiposity
        sits; the abstract does not report adiposity itself, hence PARTIAL.
  - target: Proximal Muscle Weakness
    causal_link_type: DIRECT
    description: Glucocorticoid-induced proteolysis of type II muscle fibres.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "catabolic symptoms such as muscle weakness"
      explanation: Names muscle weakness as a direct catabolic consequence of severe cortisol excess.
  - target: Bruising Susceptibility
    causal_link_type: DIRECT
    description: Glucocorticoid-induced dermal collagen loss and capillary fragility.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "catabolic symptoms such as muscle weakness, skin fragility"
      explanation: Skin fragility is the substrate for the easy bruising seen in cortisol excess.
  - target: Hypertension
    causal_link_type: DIRECT
    description: >-
      Glucocorticoid excess raises blood pressure; hypertension prevalence and
      severity rise across the cortisol-autonomy strata.
    evidence:
    - reference: PMID:34978855
      reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Prevalence and severity of hypertension were higher in MACS-2 and CS than NFAT"
      explanation: Directly relates cortisol autonomy strata to hypertension burden.
  - target: Type II Diabetes Mellitus
    causal_link_type: DIRECT
    description: Glucocorticoid-induced insulin resistance and hepatic gluconeogenesis.
    evidence:
    - reference: PMID:34978855
      reference_title: "Cardiometabolic Disease Burden and Steroid Excretion in Benign Adrenal Tumors : A Cross-Sectional Multicenter Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Type 2 diabetes was more prevalent in CS than NFAT"
      explanation: Directly relates overt cortisol excess to diabetes prevalence versus non-functioning tumours.
  - target: Hyperlipidemia
    causal_link_type: DIRECT
    description: >-
      Glucocorticoid-driven dyslipidaemia; prevalence rises across the
      cortisol-autonomy strata.
    evidence:
    - reference: PMID:35533704
      reference_title: "Age-dependent and sex-dependent disparity in mortality in patients with adrenal incidentalomas and autonomous cortisol secretion: an international, retrospective, cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "dyslipidaemia occurred in 724 ... of 1999 patients, 547 ... of 1250, and 123 ... of 237"
      explanation: Gives dyslipidaemia prevalence rising across the three cortisol strata.
  - target: Osteoporosis
    causal_link_type: DIRECT
    description: Glucocorticoid-induced suppression of osteoblast function and bone loss.
    evidence:
    - reference: PMID:24571724
      reference_title: "Constitutive activation of PKA catalytic subunit in adrenal Cushing's syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "catabolic symptoms such as muscle weakness, skin fragility, osteoporosis"
      explanation: Names osteoporosis as a direct catabolic consequence of cortisol excess.

- name: Mild Autonomous Cortisol Secretion
  biological_scale: ORGANISM
  role: effector
  description: >-
    Low-grade cortisol autonomy sufficient to fail the 1-mg dexamethasone
    suppression test but insufficient to produce the classical Cushing habitus.
    The mechanistically important point — and the reason this node exists
    separately from Chronic Glucocorticoid Excess — is the reclassification of
    MACS. It was long treated as a biochemical curiosity of no consequence
    ("subclinical hypercortisolism"). Contemporary multicentre cohort data show
    that MACS is instead an independent cardiometabolic and skeletal risk state,
    carrying excess hypertension, insulin-requiring diabetes, vertebral fracture,
    and — critically — increased all-cause mortality relative to non-functioning
    adenomas, with the excess concentrated in women under 65. The 2023 ESE
    guideline formalised the term and mandated screening for cortisol-attributable
    comorbidity in every patient with MACS.
  evidence:
  - reference: PMID:35533704
    reference_title: "Age-dependent and sex-dependent disparity in mortality in patients with adrenal incidentalomas and autonomous cortisol secretion: an international, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cortisol autonomy is associated with increased all-cause mortality, particularly in women younger than 65 years."
    explanation: The mortality finding that drives the reclassification of MACS as a genuine risk state.
  - reference: PMID:35533704

- name: Zona Glomerulosa Ion Channel and Pump Driver Mutation
  biological_scale: MOLECULAR
  role: driver
  description: >-
    Aldosterone-producing adenomas carry mutually exclusive somatic mutations in a
    small set of genes encoding ion channels and pumps of the zona glomerulosa
    plasma membrane: KCNJ5 (inwardly rectifying K+ channel; the commonest),
    CACNA1D (Cav1.3 L-type calcium channel), ATP1A1
    (Na+/K+-ATPase alpha subunit) and ATP2B3 (plasma-membrane Ca2+-ATPase).
    CTNNB1 mutations occur in a minority. Different genes, one shared functional
    endpoint — the resting membrane potential of the glomerulosa cell can no longer
    be maintained.
  genes:
  - preferred_term: KCNJ5
    term:
      id: hgnc:6266
      label: KCNJ5
  - preferred_term: CACNA1D
    term:
      id: hgnc:1391
      label: CACNA1D
  - preferred_term: ATP1A1
    term:
      id: hgnc:799
      label: ATP1A1
  - preferred_term: ATP2B3
    term:
      id: hgnc:816
      label: ATP2B3
  cell_types:
  - preferred_term: zona glomerulosa cell
    term:
      id: CL:0002099
      label: type I cell of adrenal cortex
  locations:
  - preferred_term: zona glomerulosa
    term:
      id: UBERON:0002053
      label: zona glomerulosa of adrenal gland
  evidence:
  - reference: PMID:23416519
    reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a collection of 308 APAs, we found 16 (5.2%) somatic mutations in ATP1A1 and 5 (1.6%) in ATP2B3."
    explanation: Quantifies the ATPase driver mutation frequencies in a large APA collection.
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 5 somatic mutations (4 altering Gly403 and 1 altering Ile770) in CACNA1D, encoding a voltage-gated calcium channel, among 43 APAs without mutated KCNJ5."
    explanation: Establishes CACNA1D as a driver in the KCNJ5-wild-type fraction of APAs, showing mutual exclusivity.
  - reference: PMID:23913001
    reference_title: Somatic and germline CACNA1D calcium channel mutations in aldosterone-producing adenomas and primary aldosteronism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All CACNA1D mutations occurred in tumors without KCNJ5 or CTNN1B mutations."
    explanation: >-
      Direct demonstration of mutual exclusivity between the APA driver classes.
      Note that the source spells beta-catenin "CTNN1B" in this sentence (a
      typographical error for CTNNB1, spelled correctly elsewhere in the same
      paper); the snippet is quoted verbatim.

  downstream:
  - target: Zona Glomerulosa Membrane Depolarisation
    causal_link_type: DIRECT
    description: >-
      Loss of K+ selectivity (KCNJ5), loss of Na+/K+-ATPase pump activity (ATP1A1)
      or loss of Ca2+ extrusion (ATP2B3) each depolarise the glomerulosa cell.
    evidence:
    - reference: PMID:21311022
      reference_title: K+ channel mutations in adrenal aldosterone-producing adenomas and hereditary hypertension.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both produce increased sodium (Na(+)) conductance and cell depolarization"
      explanation: Functional demonstration that KCNJ5 mutations depolarise the cell.
    - reference: PMID:23416519
      reference_title: Somatic mutations in ATP1A1 and ATP2B3 lead to aldosterone-producing adenomas and secondary hypertension.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Electrophysiological ex vivo studies on primary adrenal adenoma cells provided further evidence for inappropriate depolarization of cells with ATPase alterations."
      explanation: Shows the ATPase drivers converge on the same depolarisation endpoint.


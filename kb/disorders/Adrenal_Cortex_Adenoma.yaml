    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A cardiometabolic risk condition, MACS predominantly affects women and warrants regular assessment for hypertension and type 2 diabetes."
    explanation: States the reclassification of MACS as a cardiometabolic risk condition explicitly.
  downstream:

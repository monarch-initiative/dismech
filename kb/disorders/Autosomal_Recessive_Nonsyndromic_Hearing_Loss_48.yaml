    reference_title: "Language outcomes following pediatric cochlear implantation: Associations with clinical, socioeconomic, and rehabilitation factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "children with congenital bilateral severe-to-profound sensorineural hearing loss who underwent cochlear implantation, received post implantation Auditory Verbal Therapy and completed post-implant language assessments"
    explanation: >-
      Establishes cochlear implantation plus auditory-verbal therapy as the management route for
      exactly this audiological phenotype. Indirect for DFNB48 specifically: the cohort is
      defined audiologically, not by CIB2 genotype.
    directness: INDIRECT
- name: Auditory-Verbal Therapy
  description: >-
    Post-implantation habilitation aimed at spoken-language acquisition, delivered alongside
    cochlear implantation rather than instead of it. Language outcomes after implantation vary
    widely and are not fully explained by age at implantation, and attendance at post-activation
    appointments was the factor most consistently associated with better receptive and
    expressive language, so the rehabilitation arm carries real weight in outcome.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Sensorineural hearing impairment
    description: >-
      Addresses the language consequence of the sensory deficit rather than the cochlear lesion,
      by training use of the restored auditory input.
  evidence:
  - reference: PMID:42330611
    reference_title: "Language outcomes following pediatric cochlear implantation: Associations with clinical, socioeconomic, and rehabilitation factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Higher appointment attendance was consistently associated with more favorable language outcomes following pediatric cochlear implantation."
    explanation: >-
      Supports the rehabilitation arm as outcome-relevant. Indirect for DFNB48: the cohort is
      audiological rather than genotype-defined, and the authors state explicitly that whether
      the association reflects rehabilitation exposure or broader family factors is uncertain.
    directness: INDIRECT
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance with a 25% recurrence risk for future siblings, and
    carrier parents who are themselves unaffected. Counselling depends on having the molecular
    diagnosis, which is the practical argument for genetic testing in an otherwise
    clinically indistinguishable hearing loss.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:

prevalence:
- population: Pakistani consanguineous hearing-loss cohorts
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence figure for DFNB48 specifically is available. The locus was mapped and is
    most often reported in consanguineous Pakistani families, so the case series are ascertainment-driven
    rather than population-based, and no rate is asserted here.
  evidence:
  - reference: PMID:30303587
    reference_title: Global genetic insight contributed by consanguineous Pakistani families segregating hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The five most common HL genes in the Pakistani population are SLC26A4, MYO7A, GJB2, CIB2 and HGF,
      respectively.
    explanation: >-
      Places CIB2 among the five most common hearing-loss genes in this population. A rank within an ascertained
      clinical cohort, not a population rate, which is why no rate_per_100000 is asserted.

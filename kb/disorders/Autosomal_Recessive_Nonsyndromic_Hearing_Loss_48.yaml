    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the 6 families we ascertained, 3 segregated novel loss-of-function (LOF) variants, 2 families
      segregated missense variants (1 novel) and 1 family segregated a previously reported pathogenic
      variant in trans with a frameshift variant.
    explanation: >-

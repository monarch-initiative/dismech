    directness: INDIRECT
- name: AAV-Mediated CIB2 or CIB3 Gene Therapy
  description: >-
    Experimental, in mouse only. AAV delivery of either CIB2 or CIB3 rescues stereocilia
    architecture and hearing function in a DFNB48 mouse model. That CIB3 works as well as CIB2
    is the therapeutic pay-off of the paralogue-redundancy finding. There is no human trial for
    DFNB48; the clinical precedent for cochlear gene therapy is OTOF/DFNB9, a different gene.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Failure to Restrict Transducing Stereocilia Growth
    description: >-
      Restores CIB2 or CIB3 protein in hair cells, rescuing stereocilia architecture and
      hearing in the mouse model.
  evidence:
  - reference: PMID:42427029
    reference_title: "Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model of recessive deafness DFNB48."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed sustained, but partial, recovery of hearing function and restoration of stereocilia architecture in the apical to middle cochlear turns in mice having received AAV-Cib2 between postnatal day 0 (P0) and P4."
    explanation: >-
      Reports the rescue with its two important limits stated by the authors themselves: the
      recovery is partial and restricted to apical-to-middle turns, and it depends on treating
      within a narrow postnatal window.
discussions:
- discussion_id: cib2_ush1j_reassignment
  kind: CONTROVERSY
  prompt: >-
    Does CIB2 cause Usher syndrome type 1J, or only non-syndromic deafness DFNB48?
  rationale: >-
    CIB2 was originally reported as the gene for both DFNB48 and USH1J, and it is still listed
    among the six genes linked to the USH1 phenotype. A later multi-ethnic cohort of six ARNSHL
    families found non-syndromic deafness for every pathogenic genotype it examined,
    loss-of-function alleles included, and stated an intent to disqualify CIB2 as an
    Usher-causing gene. The mouse work supplies a mechanism for the reassignment: CIB3
    compensates for CIB2 in vestibular hair cells and CIB2 mutations spare vestibular function,
    so the vestibular arm of the Usher phenotype has a positive reason to be absent rather than
    merely being unobserved. This entry curates the disease as non-syndromic on that basis, and
    both claims are recorded with their evidence because the difference is clinically
    consequential - whether a deaf child is counselled to expect progressive retinal
    degeneration turns on it. Note the reassignment rests on the absence of a finding in a
    modest cohort, and retinitis pigmentosa in Usher type 1 has onset in the first decade, so
    ascertainment age is a live limitation on the negative claim.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 48
  - pathophysiology#CIB3 Paralogue Redundancy in Vestibular Hair Cells
  evidence:
  - reference: PMID:23023331
    reference_title: "Alterations of the CIB2 calcium- and integrin-binding protein cause Usher syndrome type 1J and nonsyndromic deafness DFNB48."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report that mutations in CIB2, which encodes a calcium- and integrin-binding protein, are associated with nonsyndromic deafness (DFNB48) and Usher syndrome type 1J (USH1J)"
    explanation: >-
      The original dual assignment as the founding paper stated it, which is the claim the later
      cohort disputes.
  - reference: PMID:29112224
    reference_title: "Variants in CIB2 cause DFNB48 and not USH1J."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "This report is the first to show that biallelic LOF variants in CIB2 cause ARNSHL and not USH."
    explanation: >-
      Refutes the USH1J assignment for loss-of-function genotypes, which is the strongest test
      since null alleles are the ones classically expected to give the syndromic phenotype.
  - reference: PMID:29112224
    reference_title: "Variants in CIB2 cause DFNB48 and not USH1J."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we provide evidence disqualifying CIB2 as an USH-causing gene."
    explanation: The authors' explicit statement of the reassignment they are arguing for.
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in the gene encoding CIB2 cause hearing loss but no vestibular dysfunction in humans and mice"
    explanation: >-
      Supplies the mechanistic basis for the non-syndromic reading: vestibular function is
      spared in both species, consistent with paralogue compensation rather than with an
      unascertained syndromic feature.
  - reference: PMID:29084757
    reference_title: "CIB2, defective in isolated deafness, is key for auditory hair cell mechanotransduction and survival."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here two new nonsense mutations (pGln12* and pTyr110*) in CIB2 patients displaying nonsyndromic profound hearing loss, with no evidence of vestibular or retinal dysfunction."
    explanation: >-
      Independent human refutation of the syndromic assignment, and with null alleles, which are
      the genotypes most expected to give the Usher phenotype if CIB2 caused it.
  - reference: PMID:29084757
    reference_title: "CIB2, defective in isolated deafness, is key for auditory hair cell mechanotransduction and survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the mechanoelectrical transduction currents are totally abolished in the auditory hair cells, whilst they remain unchanged in the vestibular hair cells"
    explanation: >-
      The direct physiological demonstration that the transduction defect is confined to the
      cochlea, which is the mechanism that makes the non-syndromic phenotype expected rather
      than merely observed.

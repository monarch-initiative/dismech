    snippet: "Functional studies in mice show that CIB2 regulates TMC1/2 localization and function in hair cells, processes that are affected by deafness-causing CIB2 mutations."
    explanation: >-
      Connects the structural interaction to channel localisation and function, and to the
      disease alleles specifically.
- name: Abolished Cochlear Mechanoelectrical Transduction
  description: >-
    Mechanotransduction is absent in auditory hair cells of Cib2 mutant mice, and MET currents
    are abolished in Cib2-deficient outer hair cells. The result that carries the mechanistic
    weight is the qualifier: this happens despite the presence of tip links. Tip links are the
    filaments that transmit force to the channel, so their being intact localises the lesion to
    the channel complex rather than to the force-delivery apparatus.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:

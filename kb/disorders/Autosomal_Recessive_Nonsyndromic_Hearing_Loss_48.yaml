name: Autosomal Recessive Nonsyndromic Hearing Loss 48
category: Mendelian
creation_date: '2026-09-04T00:00:00Z'
synonyms:
- DFNB48
- deafness, autosomal recessive 48
- autosomal recessive nonsyndromic deafness 48
- CIB2-related nonsyndromic hearing loss
description: >-
  DFNB48 is autosomal recessive nonsyndromic sensorineural hearing loss caused by biallelic CIB2 variants.
  Hearing loss is bilateral and prelingual, including documented congenital cases, and is usually severe
  to profound; moderate-to-severe hearing loss has also been reported. CIB2 is an auxiliary component
  of the cochlear hair-cell mechanoelectrical transduction (MET) complex. Experimental loss of CIB2 impairs
  TMC1/TMC2 localization and channel function, with additional abnormalities of stereocilia maintenance
  and later hair-cell degeneration. Missense alleles differ in their effects on residual channel function.
  CIB3 can compensate in vestibular hair cells in mouse models, whereas its low cochlear expression does
  not prevent deafness. Later clinical series challenge the original assignment of CIB2 to Usher syndrome;
  vestibular compensation does not itself establish the absence of retinal disease.

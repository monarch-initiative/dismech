    reference_title: "CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mechanotransducing shorter row stereocilia overgrow in hair cell bundles of both Cib2 mutants"
    explanation: Documents the stereocilia overgrowth phenotype in both mutant lines.
  - reference: PMID:28663585
    reference_title: "CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "is required for normal operation of the mechanotransducer channels and is involved in limiting the growth of transducing stereocilia"
    explanation: >-
      The authors' own two-part conclusion, which is why this entry carries two parallel arms
      downstream of CIB2 loss rather than one.
- name: Hair Cell Dysfunction and Death
  description: >-
    Loss of transduction and disorganised bundle architecture together produce hair-cell
    dysfunction and, subsequently, hair-cell death. Because cochlear hair cells are not
    replaced in mammals, this is the step that makes the deafness permanent and sets the
    therapeutic window for any gene-replacement approach.
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: cochlear hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29084757
    reference_title: "CIB2, defective in isolated deafness, is key for auditory hair cell mechanotransduction and survival."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "begin only after birth and lead to regression of the stereocilia and rapid hair-cell death"
    explanation: >-
      Reports the postnatal onset of bundle abnormalities and their progression to stereocilia
      regression and rapid hair-cell death, which is the sequence this node encodes.
- name: CIB3 Paralogue Redundancy in Vestibular Hair Cells
  description: >-
    Vestibular hair cells co-express CIB2 and CIB3; cochlear hair cells express CIB2 alone.
    CIB3 can functionally substitute for CIB2 - expressed in Cib2-null outer hair cells it
    rescues MET currents, whereas CIB1 does not. This is the mechanistic explanation for why the
    disease is non-syndromic: the vestibular system has a backup and the cochlea does not. It is
    a protective mechanism, so it has no downstream disease edge; it is the reason an expected
    edge to vestibular dysfunction is absent.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: vestibular hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  evidence:
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CIB2 is a Ca2+- and Mg2+-binding protein essential for mechanoelectrical transduction (MET) by cochlear hair cells, but not by vestibular hair cells that co-express CIB2 and CIB3. Here, we show that in cochlear hair cells, CIB3 can functionally substitute for CIB2."
    explanation: >-
      States both the differential expression and the functional substitution, which together
      account for the cochlea-restricted phenotype.
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both CIB2 and CIB3, but not CIB1, rescued MET defects in OHCs from Cib2"
    explanation: >-
      The rescue experiment, with CIB1 as the negative control that makes the result specific to
      the closest paralogue rather than to CIB overexpression generally.
  notes: >-
    Deliberately carries no downstream edge. This node explains an absence - vestibular
    dysfunction - rather than causing a phenotype, and the pathograph has no representation for
    a protective mechanism inside a disease entry.

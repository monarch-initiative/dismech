  relationship_type: CAUSATIVE
  notes: >-
    CIB2-related hearing loss includes homozygous and compound heterozygous genotypes. Reported variant
    classes include missense, nonsense, frameshift, splice-site and exon-deletion alleles. Founder effects
    were reported for p.Phe91Ser and p.Cys99Trp in Pakistani families. Hearing severity can differ among
    families with the same p.Phe91Ser genotype; these studies do not identify a proven human modifier
    or provide a population penetrance estimate. Splice and truncation consequences below distinguish
    prediction from directly measured functional results.
  evidence:
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT

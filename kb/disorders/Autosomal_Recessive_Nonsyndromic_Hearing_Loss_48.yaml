- name: Failure to Restrict Transducing Stereocilia Growth
  description: >-
    Shorter transducing stereocilia rows overgrow in Cib2 mutant mice, followed by broader bundle disorganization
    and regression. This growth phenotype differs from the retraction expected after MET-current loss,
    supporting an additional bundle-maintenance role. CIB2 physically interacts with WHRN, and MYO15A
    accumulates abnormally at first-row tips. WHRN overexpression fails to rescue Cib2-null bundles, and
    Cib2/Whrn double-null bundles show predominantly Whrn-like abnormalities with some superimposed Cib2
    features. These findings support distinct functions but do not exclude every role for WHRN in CIB2-dependent
    maintenance. Local calcium regulation and GPSM2-GNAI participation remain hypotheses; bulk calcium
    responses in transfected cells do not settle local stereociliary calcium mechanisms.
  biological_scale: CELLULAR

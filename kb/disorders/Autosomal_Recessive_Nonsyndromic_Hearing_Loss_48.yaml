treatments:
- name: Cochlear Implantation
  description: >-
    Standard management for severe-to-profound prelingual sensorineural hearing loss. It bypasses
    the failed hair-cell transduction step by stimulating the cochlear nerve directly, so it
    addresses the consequence of the lesion rather than the lesion itself.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Abolished Cochlear Mechanoelectrical Transduction
    description: >-
      Substitutes electrical stimulation of the cochlear nerve for the absent hair-cell
      mechanotransduction, without restoring the transduction step itself.
  evidence:

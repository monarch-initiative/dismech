      the very low endogenous expression of CIB3 in the auditory hair cells cannot compensate for the
      lack of CIB2 in DFNB48
    explanation: The cochlear restriction is associated with low endogenous CIB3, not proven absolute absence.
phenotypes:
- category: Auditory
  name: Sensorineural hearing impairment
  description: >-
    Bilateral sensorineural hearing loss is the defining feature of DFNB48. Severity varies between families,
    including families with the same CIB2 founder variant. Stable longitudinal hearing thresholds were
    documented in one Dutch adult; this case does not establish a uniform stable course for every genotype.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:23023331
    reference_title: >-
      Alterations of the CIB2 calcium- and integrin-binding protein cause Usher syndrome type 1J and nonsyndromic
      deafness DFNB48.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One mutation in CIB2 is a prevalent cause of deafness DFNB48 in Pakistan; other CIB2 mutations contribute
      to deafness elsewhere in the world.
    explanation: Establishes CIB2 as a cause of DFNB48 deafness both in the founder population and beyond it.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiometry revealed a bilateral symmetric prelingual severe-to-profound hearing loss across all
      frequencies in all affected individuals.
    explanation: >-
      Audiometric characterisation across a multi-ethnic ARNSHL cohort, giving laterality, symmetry, onset,
      severity and frequency involvement in one measured statement.
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals of Pakistani family W09-1575 (Figure 1a) were diagnosed with prelingual, bilateral,
      moderate-to-severe sensorineural HI
    explanation: The clinical spectrum includes moderate-to-severe loss.
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: SUPPORT

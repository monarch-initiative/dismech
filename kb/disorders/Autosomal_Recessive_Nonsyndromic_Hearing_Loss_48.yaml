    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we report that calcium and integrin-binding protein 2 binds to the components of the hair cell mechanotransduction complex, TMC1 and TMC2, and these interactions are disrupted by deafness-causing Cib2 mutations."
    explanation: >-
      Establishes both the interaction and that disease alleles disrupt it, which is the edge
      this node encodes.
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."
    supports: SUPPORT

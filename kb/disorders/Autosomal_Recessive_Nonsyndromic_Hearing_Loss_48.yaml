- name: Impaired Cochlear Mechanoelectrical Transduction
  description: >-
    Cochlear MET currents are absent in Cib2-null, F91S and I123T mouse models, but severely reduced rather
    than absent in E64D and R186W knock-ins. The latter retain early TMC2-dependent function despite deafness.

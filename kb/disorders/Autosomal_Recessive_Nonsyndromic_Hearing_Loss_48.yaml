          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Abolished Cochlear Mechanoelectrical Transduction
    description: >-
      Substitutes electrical stimulation of the cochlear nerve for the absent hair-cell
      mechanotransduction, without restoring the transduction step itself.

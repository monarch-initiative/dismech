name: Autosomal Recessive Nonsyndromic Hearing Loss 48
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNB48
- deafness, autosomal recessive 48
- autosomal recessive nonsyndromic deafness 48
- CIB2-related nonsyndromic hearing loss
description: >-
  DFNB48 is prelingual, bilateral, generally severe-to-profound sensorineural hearing loss
  caused by biallelic variants in CIB2, the calcium- and integrin-binding protein 2. CIB2 is an
  auxiliary subunit of the hair-cell mechanoelectrical transduction (MET) channel: it binds
  TMC1 and TMC2 in the stereocilia of cochlear hair cells and is required for the channel to
  work.

  The defining mechanistic result is a dissociation. Cib2 mutant mice are deaf and show no
  mechanotransduction in auditory hair cells **despite the presence of tip links** that gate
  the channels. So the lesion is not a failure to deliver force to the channel - the
  force-transmitting apparatus is intact - but a failure of the channel complex itself. That is
  what makes CIB2 an auxiliary subunit rather than a structural component of the bundle.

  Two further things make this entry worth reading rather than filing as one more numbered
  DFNB locus.

  **The gene was reassigned.** CIB2 was originally reported to cause both DFNB48 and Usher
  syndrome type 1J - deafness plus retinitis pigmentosa and vestibular dysfunction. A later
  multi-ethnic cohort found that every pathogenic CIB2 genotype it examined, loss-of-function
  included, gave non-syndromic deafness, and the authors set out explicitly to disqualify CIB2
  as an Usher gene. This entry records both claims with the evidence that cuts each way,
  because the reassignment changes patient care: whether a deaf child is told to expect
  progressive blindness turns on it.

  **The reason it is non-syndromic is a paralogue.** Vestibular hair cells co-express CIB2 and
  CIB3, and CIB3 can functionally substitute for CIB2 - injectoporated CIB3 rescues MET currents
  in Cib2-null outer hair cells, while CIB1 does not. Cochlear hair cells do not have that
  backup. So the tissue restriction of the phenotype is explained by paralogue redundancy
  present in the vestibule and absent in the cochlea, which also supplies the rationale for the
  AAV-CIB2/CIB3 gene therapy that rescues hearing in mouse models.

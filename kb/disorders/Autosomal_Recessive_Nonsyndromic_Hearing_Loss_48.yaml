    evidence_source: MODEL_ORGANISM
    snippet: "CIB2 is a Ca2+- and Mg2+-binding protein essential for mechanoelectrical transduction (MET) by cochlear hair cells, but not by vestibular hair cells that co-express CIB2 and CIB3. Here, we show that in cochlear hair cells, CIB3 can functionally substitute for CIB2."
    explanation: >-
      States both the differential expression and the functional substitution, which together
      account for the cochlea-restricted phenotype.
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."

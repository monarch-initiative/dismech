    reference_title: "CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "exhibit no mechanotransduction in auditory hair cells, despite the presence of tip links that gate the mechanotransducer channels"
    explanation: >-
      The dissociation that localises the defect to the channel complex rather than the tip-link
      force-transmission apparatus.
  - reference: PMID:34089643
    reference_title: "CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "MET currents were abolished in Cib2-deficient OHCs"
    explanation: Independent electrophysiological confirmation in outer hair cells.
- name: Failure to Restrict Transducing Stereocilia Growth
  description: >-
    Beyond its channel role, CIB2 limits the length of the shorter, transducing rows of
    stereocilia: these overgrow in the hair bundles of Cib2 mutants, degrading the graded
    "staircase" architecture the bundle needs. This is a structural arm distinct from the
    channel arm, and it is organised through whirlin rather than through TMC1/2.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: stereocilium
    term:
      id: GO:0032420
      label: stereocilium
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: DECREASED
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  downstream:
  - target: Hair Cell Dysfunction and Death
    causal_link_type: DIRECT

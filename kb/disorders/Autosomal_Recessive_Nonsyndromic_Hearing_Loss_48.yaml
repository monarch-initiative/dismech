pathophysiology:
- name: CIB2 Loss of Function
  description: >-
    Biallelic CIB2 variants reduce or abolish the function of the auxiliary MET-channel protein. Human
    disease alleles include missense, nonsense, frameshift, splice-site and exon-deletion variants. Null
    and missense knock-in mice support loss of function, but different missense alleles retain different
    degrees of TMC binding and channel activity; a simple N-terminal binding versus C-terminal calcium-buffering
    division does not describe the later functional evidence.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

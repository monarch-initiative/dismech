treatments:
- name: Cochlear Implantation
  description: >-
    Cochlear implantation provides auditory habilitation for eligible people with severe-to-profound DFNB48
    hearing loss. Two Dutch siblings received implants with good reported results, and a child homozygous
    for c.198+1G>A underwent successful bilateral implantation at 13 months. These are individual clinical
    reports, not a genotype-specific outcome rate.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Impaired Cochlear Mechanoelectrical Transduction
    description: >-
      Substitutes electrical stimulation of the cochlear nerve for impaired hair-cell mechanotransduction,
      without restoring the transduction step itself.
  evidence:
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both hearing-impaired members of family 07-1069 received a cochlear implant with good results.
    explanation: Direct CIB2-specific outcomes in two siblings.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The proband of family 51550 underwent bilateral cochlear implantation at 13 months
    explanation: Direct clinical timing in the splice-site family.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A patient carrying this variant underwent successful bilateral cochlear implant implantation
    explanation: The discussion reports a successful outcome for the c.198+1G>A proband.
- name: Hearing Aids and Auditory Rehabilitation
  description: >-
    Hearing aids can support useful residual hearing, with fitting based on individual audiometry. Communication
    support, including sign language when desired, should be individualized. These are general genetic
    hearing-loss approaches; CIB2-specific hearing-aid outcomes were not established in the cited guidance.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory rehabilitation with amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  notes: >-
    General care guidance; the treatment term describes rehabilitation and the qualifier identifies the
    hearing-aid device.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals
      with mild-to-severe hearing loss.
    explanation: General hearing-loss guidance applicable to residual hearing, including the less severe DFNB48 spectrum.
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Habilitation for hearing loss includes improved access to sound through hearing aids or cochlear
      implants and, when desired, exposure to and teaching of American Sign Language.
    explanation: General communication and habilitation options, rather than a gene-specific efficacy study.
    directness: INDIRECT
- name: Auditory-Verbal Therapy
  description: >-
    Speech-language and auditory habilitation can support communication after implantation, individualized
    to the person and family. A general pediatric implant cohort associated appointment attendance with
    language outcomes; that observational association does not establish a CIB2-specific treatment effect
    or separate therapy exposure from family factors.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  target_mechanisms:
  - target: Sensorineural hearing impairment
    description: >-
      Addresses the language consequence of the sensory deficit rather than the cochlear lesion, by training
      use of the restored auditory input.
  evidence:
  - reference: PMID:42330611
    reference_title: >-
      Language outcomes following pediatric cochlear implantation: Associations with clinical, socioeconomic,
      and rehabilitation factors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher appointment attendance was consistently associated with more favorable language outcomes
      following pediatric cochlear implantation.
    explanation: General pediatric implant cohort; the association is observational and not specific to CIB2.
    directness: INDIRECT
- name: Genetic Counseling
  description: >-
    Counseling follows confirmation of the molecular diagnosis and parental segregation. If both parents
    carry a pathogenic CIB2 allele, each pregnancy has a 25% chance of biallelic hearing loss, a 50% chance
    of carrier status and a 25% chance of inheriting neither familial allele. The disputed historical
    Usher assignment should not be presented as an established prediction of blindness for DFNB48.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss
    explanation: General recessive hearing-loss counseling, conditional on both parents being confirmed carriers.
    directness: INDIRECT
- name: Experimental AAV-CIB2 Gene Augmentation
  description: >-
    Preclinical gene augmentation with AAV2.Anc80L65 carrying mouse Cib2 partially restored cochlear architecture
    and hearing in Cib2-null mice treated at P0-P4. P6 treatment did not improve hearing with this construct.
    In P0-P1-treated null mice, benefit persisted to 24 weeks and was strongest at lower frequencies;
    high-frequency recovery was limited. P0-treated F91S knock-in mice retained partial low-frequency
    benefit to P60, the last tested time. These mouse studies do not establish human efficacy, safety
    or a prenatal treatment window.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: CIB2 Loss of Function
    description: Supplies functional CIB2 in cochlear hair cells.
  - target: Failure to Restrict Transducing Stereocilia Growth
    description: Partially restores bundle architecture in treated mouse cochleae.
  evidence:
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We observed sustained, but partial, recovery of hearing function and restoration of stereocilia
      architecture in the apical to middle cochlear turns in mice having received AAV-Cib2 between postnatal
      day 0 (P0) and P4.
    explanation: >-
      Reports the rescue with its two important limits stated by the authors themselves: the recovery
      is partial and restricted to apical-to-middle turns, and it depends on treating within a narrow
      postnatal window.
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      no improvement in ABR thresholds (Figure 3B) or stereocilia bundle morphology was observed in Cib2ko/ko
      mice injected with Anc80.CIB2.GFP.WPRE at P6
    explanation: No rescue at the tested later age with this construct; not a universal point of irreversibility.
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: which persisted out to the latest time point tested, 24 weeks after injection
    explanation: Duration of partial rescue in the null model.
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      partial but significant improvements in the ABR thresholds at lower frequencies as early as P16,
      which persisted until P60, the last time point tested
    explanation: Allele-specific rescue in F91S knock-in mice.
- name: Experimental AAV-CIB3 Compensation
  description: >-
    AAV2.Anc80L65 delivery of human CIB3 at P0-P1 partially restored hearing in Cib2-null mice and improved
    hair-cell survival at P45. This is paralogue compensation rather than replacement of the mutated CIB2
    gene. Increasing endogenous CIB3 with transcriptional activation or small molecules remains a proposed
    strategy without demonstrated clinical efficacy.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Impaired Cochlear Mechanoelectrical Transduction
    description: Provides a paralogue able to substitute for CIB2 in the mouse cochlea.
  evidence:
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      overexpression of CIB3 via Anc80.CIB3.GFP.WPRE injection at P0–P1 restored persistent hearing function
      in Cib2ko/ko mice
    explanation: Human CIB3 cDNA was delivered to mice; this is not a human treatment result.
  - reference: PMID:42427029
    reference_title: >-
      Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3 in a mouse model
      of recessive deafness DFNB48.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      administration of Anc80.CIB3.GFP.WPRE significantly improved survival of both IHCs and OHCs in Cib2ko/ko
      mice at P45
    explanation: Hair-cell survival outcome was measured against GFP-vector controls.
animal_models:
- name: Cib2 knockout mouse
  species: Mouse
  genotype: Cib2 null (tm1a gene-trap or tm1b exon-4 deletion; Cib2KO/KO)
  publication: PMID:28663585
  description: >-
    Constitutive Cib2 null. Deaf, with mechanotransduction absent in auditory hair cells while tip links
    remain present, and with overgrowth of the shorter transducing stereocilia rows. Vestibular function
    is spared, matching the human non-syndromic phenotype.
  modeled_mechanisms:
  - target: Impaired Cochlear Mechanoelectrical Transduction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Reproduces the experimentally demonstrated cochlear MET defect, including preserved tip links; equivalent
      human hair-cell electrophysiology was not reported.
    limitations: >-
      A constitutive null, whereas most reported human alleles are missense. Mouse cochlear TMC2 is replaced
      by TMC1 within the first postnatal days, so the developmental window differs from human.
    readouts:
    - name: Mechanotransduction current in auditory hair cells
      target: Impaired Cochlear Mechanoelectrical Transduction
      direction: ABOLISHED
      interpretation: Direct electrophysiological measure of the node in this model.
      evidence:
      - reference: PMID:34089643
        reference_title: CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: MET currents were abolished in Cib2-deficient OHCs
        explanation: Patch-clamp measurement of the abolished current in outer hair cells.
    evidence:
    - reference: PMID:28663585
      reference_title: CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        exhibit no mechanotransduction in auditory hair cells, despite the presence of tip links that
        gate the mechanotransducer channels
      explanation: >-
        The result that makes this model informative for the node: transduction fails with the force-delivery
        apparatus intact.
  - target: Failure to Restrict Transducing Stereocilia Growth
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces the stereocilia overgrowth arm.
    limitations: >-
      Bundle architecture was measured in mouse cochlea; these studies do not establish equivalent human
      temporal-bone histology.
    readouts:
    - name: Shorter-row stereocilia length
      target: Failure to Restrict Transducing Stereocilia Growth
      direction: INCREASED
      interpretation: Overgrowth of the transducing rows is the structural readout of this node.
      evidence:
      - reference: PMID:28663585
        reference_title: CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: mechanotransducing shorter row stereocilia overgrow in hair cell bundles of both Cib2 mutants
        explanation: Direct measurement of the overgrowth in both mutant lines.
- name: Cib2 p.F91S knock-in mouse
  species: Mouse
  genotype: Cib2 p.Phe91Ser knock-in (Cib2F91S/F91S)
  publication: PMID:28663585
  description: >-
    Carries the recurrent Pakistani founder allele p.Phe91Ser rather than a null, so it tests whether the
    disease missense variant, and not merely absence of the protein, causes the phenotype. It does: these
    mice are deaf with the same transduction and bundle defects.
  modeled_mechanisms:
  - target: CIB2 Loss of Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Models a recurrent human missense allele, allowing comparison with complete loss of CIB2.
    limitations: >-
      Models one recurrent founder allele. Other disease-associated missense alleles have distinct effects
      on TMC binding, localization and residual channel activity.
    evidence:
    - reference: PMID:28663585
      reference_title: CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: we generated a p.F91S missense mutation knockin mouse
      explanation: Establishes that the model carries the prevalent human deafness allele.
- name: Cib2 CRISPR exon-4 knockout mouse
  species: Mouse
  genotype: Cib2 exon-4 deletions introducing a premature stop
  publication: PMID:29255404
  description: >-
    Independent CRISPR knockout mice have absent cochlear MET before marked bundle deterioration. The
    endocochlear potential remains normal. Voltage-gated outer hair-cell currents are modestly reduced
    at P7 but not at P1 or P4; their contribution to deafness is unresolved. Reverse-polarity currents
    remain detectable, distinguishing conventional MET loss from loss of every mechanically evoked current.
  modeled_mechanisms:
  - target: Impaired Cochlear Mechanoelectrical Transduction
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Independent allele corroborates absent conventional MET in early auditory hair cells.
    limitations: Mouse electrophysiology does not measure residual current in human DFNB48.
    evidence:
    - reference: PMID:29255404
      reference_title: Loss of CIB2 Causes Profound Hearing Loss and Abolishes Mechanoelectrical Transduction in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: MET currents are also absent in P7 Cib2 knockout IHCs
      explanation: The same study reports absent outer hair-cell MET at P1, P4 and P7.
    - reference: PMID:29255404
      reference_title: Loss of CIB2 Causes Profound Hearing Loss and Abolishes Mechanoelectrical Transduction in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Cib2 knockout mice maintain a normal potential in the scala media
      explanation: >-
        Preserved endocochlear potential argues against a primary loss of the cochlear electrical driving
        force in this model.
    - reference: PMID:29255404
      reference_title: Loss of CIB2 Causes Profound Hearing Loss and Abolishes Mechanoelectrical Transduction in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: reverse-polarity currents could be recorded in P4 Cib2 knockout OHCs
      explanation: The effect is selective for conventional hair-cell MET.
    - reference: PMID:29255404
      reference_title: Loss of CIB2 Causes Profound Hearing Loss and Abolishes Mechanoelectrical Transduction in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The reduction of voltage-gated currents was not observed in P1 and P4 Cib2 knockout OHCs
      explanation: The modest reduction at P7 is developmental-stage dependent, unlike the early MET loss.
diagnosis:
- name: Genetic testing in bilateral prelingual sensorineural hearing loss
  description: >-
    Molecular testing identifies biallelic disease-causing CIB2 variants in the context of the auditory
    phenotype and segregation. Hearing-loss panels or genomic testing should include assessment for exon-level
    copy-number changes: one CIB2 family was resolved only after recognizing absent exon-2 sequence coverage
    and confirming a deletion by PCR. A variant of uncertain significance alone does not establish DFNB48.
  evidence:
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Assessing the coverage for each gene in the region using IGV revealed absence of sequence reads
      mapping to exon 2 of CIB2
    explanation: Exon-level read-depth review identified a deletion missed by the initial small-variant candidate list.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Long-range PCR found the deletion to segregate with hearing loss in the extended family
    explanation: Orthogonal confirmation and segregation supported the molecular diagnosis.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: can often identify the cause of genetic hearing loss while limiting identification of
    explanation: >-
      The quoted clause describes a multigene hearing-loss panel. The source separately cautions that
      variants of uncertain significance cannot establish or exclude a diagnosis.
- name: Audiological characterization and pre-implant imaging
  description: >-
    Audiometry and auditory brainstem responses characterize bilateral sensorineural loss. Neonatal screening
    detected congenital loss in two CIB2 siblings. Temporal-bone CT was normal in reported Dutch cases
    and in the child from family 51550; normal imaging supports implant assessment but does not distinguish
    DFNB48 from other genetic hearing losses.
  evidence:
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During BERA no responses were found for both individuals.
    explanation: Auditory brainstem testing in the two siblings who failed neonatal screening.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: his preoperative temporal bone computed tomography showed normal cochlear anatomy.
    explanation: Clinical imaging in the implanted child from family 51550.
discussions:
- discussion_id: cib2_ush1j_reassignment
  kind: CONTROVERSY
  prompt: Does CIB2 cause Usher syndrome type 1J, or only non-syndromic deafness DFNB48?
  rationale: >-
    The founding report assigned p.Glu64Asp in one Pakistani family to USH1J. Later CIB2 cohorts, including
    truncating and exon-deletion genotypes, had nonsyndromic hearing loss; normal funduscopy in adults
    strengthens that counterevidence, while young children cannot exclude every later-onset manifestation.
    Minor vestibular findings in the Dutch series included slight hyperreflexia in one adult and unilateral
    weakness measured after cochlear implantation in one child; these do not establish the congenital
    vestibular areflexia of Usher type 1. Mouse CIB3 redundancy explains preserved vestibular function
    but does not establish retinal redundancy. A later retinal study reported RPE defects and reduced
    retinal responses in Cib2-deficient mice, so absence of mouse retinal involvement is not uniform across
    studies. Those experimental findings do not establish retinitis pigmentosa as a human DFNB48 phenotype.
  attaches_to:
  - disease#Autosomal Recessive Nonsyndromic Hearing Loss 48
  - pathophysiology#CIB3 Paralogue Redundancy in Vestibular Hair Cells
  evidence:
  - reference: PMID:23023331
    reference_title: >-
      Alterations of the CIB2 calcium- and integrin-binding protein cause Usher syndrome type 1J and nonsyndromic
      deafness DFNB48.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report that mutations in CIB2, which encodes a calcium- and integrin-binding protein, are associated
      with nonsyndromic deafness (DFNB48) and Usher syndrome type 1J (USH1J)
    explanation: The original dual assignment as the founding paper stated it, which is the claim the later cohort disputes.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: This report is the first to show that biallelic LOF variants in CIB2 cause ARNSHL and not USH.
    explanation: >-
      Refutes the USH1J assignment for loss-of-function genotypes, which is the strongest test since null
      alleles are the ones classically expected to give the syndromic phenotype.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we provide evidence disqualifying CIB2 as an USH-causing gene.
    explanation: The authors' explicit statement of the reassignment they are arguing for.
  - reference: PMID:29084757
    reference_title: CIB2, defective in isolated deafness, is key for auditory hair cell mechanotransduction and survival.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here two new nonsense mutations (pGln12* and pTyr110*) in CIB2 patients displaying nonsyndromic
      profound hearing loss, with no evidence of vestibular or retinal dysfunction.
    explanation: Additional human truncating-variant families challenge a general syndromic assignment.
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: Vestibular examination showed a slight hyperreflexia.
    explanation: Minor vestibular finding in one Dutch adult, not evidence of congenital areflexia.
  - reference: PMID:26173970
    reference_title: >-
      Novel and recurrent CIB2 variants, associated with nonsyndromic deafness, do not affect calcium
      buffering and localization in hair cells.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: This was examined after cochlear implantation at the left ear.
    explanation: >-
      The unilateral weakness reported immediately before this sentence was assessed after implantation,
      limiting causal attribution.
  - reference: PMID:34162842
    reference_title: CIB2 regulates mTORC1 signaling and is essential for autophagy and visual function.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results suggest that both haploinsufficiency and complete loss of CIB2 leads to rod PR dysfunction
      in mice.
    explanation: >-
      This later mouse RPE/retinal study differs from earlier negative retinal assessments. It does not
      establish retinitis pigmentosa in human DFNB48.
  - reference: PMID:29112224
    reference_title: Variants in CIB2 cause DFNB48 and not USH1J.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These persons all have normal funduscopy, suggesting that pathogenic variants in CIB2, irrespective
      of variant effect be it missense or truncating, do not cause USH.
    explanation: >-
      The preceding source paragraph identifies adults aged 20, 49 and 28. This is stronger counterevidence
      than absence of retinal signs in young children, but not proof that every allele excludes retinal
      disease.

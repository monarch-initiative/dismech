    snippet: "Of the 6 families we ascertained, 3 segregated novel loss-of-function (LOF) variants, 2 families segregated missense variants (1 novel) and 1 family segregated a previously reported pathogenic variant in trans with a frameshift variant."
    explanation: >-
      Documents biallelic segregation across six families and the range of allele combinations
      seen, including compound heterozygosity.
pathophysiology:
- name: CIB2 Loss of Function
  description: >-
    Biallelic CIB2 variants abolish or impair the protein. The most prevalent allele in the
    original human families is the missense p.Phe91Ser, which was modelled directly as a
    knock-in mouse. Variants act regionally rather than uniformly: those in the N-terminal
    region disrupt the TMC1/TMC2 interaction without affecting calcium buffering, C-terminal
    variants affect only calcium buffering, and middle-region variants do both.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: CIB2
    term:
      id: hgnc:24579
      label: CIB2
  downstream:
  - target: Disrupted CIB2-TMC1/TMC2 Association at the MET Channel
    causal_link_type: DIRECT
  - target: Failure to Restrict Transducing Stereocilia Growth
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28663585
    reference_title: "CIB2 interacts with TMC1 and TMC2 and is essential for mechanotransduction in auditory hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we have characterized two mutant mouse lines, one lacking calcium and integrin-binding protein 2 and one carrying a human deafness-related Cib2 mutation, and show that both are deaf"
    explanation: >-
      Establishes that both a null allele and a human disease missense allele produce deafness
      in mouse, supporting loss of function as the disease mechanism.
  - reference: PMID:29112224
    reference_title: "Variants in CIB2 cause DFNB48 and not USH1J."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in the N-terminal region of CIB2, which interacts with TMC1 and TMC2, alter this interaction but do not affect CIB2 calcium buffering ability; in contrast, variants in the C-terminal region affect only calcium buffering."
    explanation: >-
      Records that different domains carry different molecular consequences, which is why this
      node has two distinct downstream arms.
- name: Disrupted CIB2-TMC1/TMC2 Association at the MET Channel
  description: >-
    CIB2 binds TMC1 and TMC2 through a conserved hydrophobic groove, engaging a domain of
    TMC1/2 flanked by transmembrane domains 2 and 3. The architecture mirrors KChIP auxiliary
    subunits binding Kv4 channels, which is the structural argument for calling CIB2 an
    auxiliary subunit. Deafness-causing CIB2 mutations disrupt this interaction and perturb
    TMC1/2 localisation and function.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: mechanotransduction channel assembly and regulation in hair cells
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
  cellular_components:

- name: Cochlear Hair Cell Apoptosis
  description: >-
    Cib2-deficient mouse cochleae develop apoptotic hair-cell loss after the early transduction defect
    and bundle abnormalities. TUNEL-positive auditory hair cells were demonstrated at P20, supporting
    an apoptotic component. Outer hair-cell loss progresses before extensive inner hair-cell depletion
    in the models. The molecular route from CIB2 deficiency to apoptosis is unresolved; proposed ASK1
    or sphingosine-kinase signaling mechanisms have not been established in Cib2-deficient auditory hair
    cells.
  biological_scale: CELLULAR

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic CIB2 variants; heterozygous carriers are unaffected. The locus was mapped in consanguineous
    Pakistani families and most reported affected individuals are homozygous, though compound heterozygotes
    and a pathogenic variant in trans with a frameshift are also described.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance

      most severe feature of XLP1.
    explanation: >-
      Establishes HLH as the dominant severity determinant in a modern
      91-patient XLP1 cohort.
  downstream:
  - target: Fulminant Infectious Mononucleosis with Hemophagocytic Lymphohistiocytosis
    causal_link_type: DIRECT
    description: >-
      The unterminated hyperinflammatory state is what presents clinically as
      fulminant infectious mononucleosis and/or HLH.
  - target: Hemophagocytosis

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HLH / fulminant infectious mononucleosis is the most common presentation
      regardless of subtype.
    explanation: >-
      Establishes fulminant infectious mononucleosis / HLH as the most common
      presentation.
  - reference: PMID:21119115
    reference_title: Clinical similarities and differences of patients with X-linked lymphoproliferative syndrome type 1 (XLP-1/SAP deficiency) versus type 2 (XLP-2/XIAP deficiency).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

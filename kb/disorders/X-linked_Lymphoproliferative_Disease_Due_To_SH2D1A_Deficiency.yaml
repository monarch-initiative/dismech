  - reference: PMID:9811875
    reference_title: Inactivating mutations in an SH2 domain-encoding gene in X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      its inactivation in XLP patients results in a selective immunodeficiency to
      EBV
    explanation: >-
      Emphasizes the EBV-selectivity of the immunodeficiency produced by loss of

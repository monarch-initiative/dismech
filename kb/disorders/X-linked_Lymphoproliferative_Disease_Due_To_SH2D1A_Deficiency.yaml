      lymphocytosis, and a spectrum ranging from agammaglobulinaemia to
      polyclonal hyper-gammaglobulinaemia occurred.
    explanation: >-
      The original description of the bidirectional immunoglobulin abnormality
      that the term dysgammaglobulinemia captures.
  downstream:
  - target: Dysgammaglobulinemia
    causal_link_type: DIRECT
    description: >-
      The failure of class switching and antibody output is measured as the
      abnormal serum immunoglobulin profile.
  - target: Decreased Circulating Immunoglobulin Concentration
    causal_link_type: DIRECT
    description: >-
      Hypogammaglobulinemia is the commonest direction the abnormality takes.
  - target: Recurrent Respiratory Infections and Bronchiectasis
    causal_link_type: DIRECT
    description: >-

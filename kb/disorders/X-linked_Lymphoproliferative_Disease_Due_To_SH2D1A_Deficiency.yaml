    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In those with XLP1, dys- or hypogammaglobulinemia can lead to varying
      degrees of humoral immune dysfunction associated with bronchiectasis and
      recurrent respiratory infections that, if untreated, may result in death.
    explanation: >-
      Establishes dysgammaglobulinemia and its clinical consequences as an XLP1
      manifestation.
  - reference: PMID:48119
    reference_title: "X-linked recessive progressive combined variable immunodeficiency (Duncan's disease)."

  downstream:
  - target: Unterminated Hyperinflammatory Response to Primary EBV Infection
    description: >-
      Persistent antigen load from uncleared EBV-infected B cells drives
      unterminated lymphocyte and macrophage activation.
    causal_link_type: DIRECT
  - target: Impaired Immune Surveillance and B Cell Lymphomagenesis
    description: >-
      Sustained polyclonal B-cell proliferation provides the substrate on which
      monoclonal malignant transformation occurs.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
- name: Unterminated Hyperinflammatory Response to Primary EBV Infection
  biological_scale: ORGANISM
  description: >-
    The acute arm of XLP1. Because the activating stimulus is never cleared,
    lymphocyte and macrophage activation continues without a termination signal,
    producing a hyperinflammatory cytokine state clinically indistinguishable
    from HLH: prolonged high fever, bi- or trilineage cytopenias,
    hepatosplenomegaly and hemophagocytosis, with death typically from liver
    failure or multiorgan dysfunction. This is the most severe feature of XLP1
    and the principal determinant of outcome. The general HLH pathophysiology is
    modeled in the Hemophagocytic_Lymphohistiocytosis entry.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  biological_processes:
  - preferred_term: hyperinflammatory cytokine production
    term:
      id: GO:0002367
      label: cytokine production involved in immune response
    modifier: INCREASED
  - preferred_term: systemic inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HLH is characterized as an acute illness with prolonged and high fever,
      bi- or trilineage cytopenias, and hepatosplenomegaly, which is often severe
      or fatal.
    explanation: Describes the clinical syndrome produced at this node.
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Death is generally secondary to liver failure or multisystem organ
      dysfunction.
    explanation: >-
      Identifies the organ-level mechanism of death in the acute arm.
  - reference: PMID:3030174
    reference_title: Epstein-Barr virus infections in males with the X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We hypothesized that the defective lymphoproliferative control locus on the
      X chromosome results in unregulated cytotoxic lymphocytic responses to the
      Epstein-Barr virus; hence, severe hepatitis and virus-associated
      hemophagocytic syndrome occur with the infectious mononucleosis phenotype.
    explanation: >-
      The registry-era formulation of this node: unregulated cytotoxic
      lymphocytic response producing hepatitis and hemophagocytic syndrome.
  - reference: PMID:20926771
    reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

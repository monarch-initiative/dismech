      Study of SAP expression is specific but may have insufficient sensitivity
      for screening XLP1 as a single tool. Combination with 2B4 functional assay
      allows identification of all cases.
    explanation: >-
      Establishes the diagnostic value of the NK functional readout alongside SAP
      protein staining.
- category: Lymphatic
  name: Lymphadenopathy
  description: >-
    Lymphadenomegaly accompanies both the acute mononucleosis-like illness and
    the lymphoproliferative manifestations of XLP1.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:48119
    reference_title: "X-linked recessive progressive combined variable immunodeficiency (Duncan's disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fever, pharyngitis, lymphadenomegaly, hepatosplenomegaly, atypical
      lymphocytosis, and a spectrum ranging from agammaglobulinaemia to
      polyclonal hyper-gammaglobulinaemia occurred.
    explanation: >-
      Original clinical description documenting lymphadenomegaly in affected
      males.
- category: Gastrointestinal
  name: Hepatosplenomegaly
  description: >-
    Hepatosplenomegaly is a core feature of the HLH episode and was present in
    the original Duncan kindred description.
  phenotype_term:
    preferred_term: Hepatosplenomegaly
    term:
      id: HP:0001433
      label: Hepatosplenomegaly
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HLH is characterized as an acute illness with prolonged and high fever,
      bi- or trilineage cytopenias, and hepatosplenomegaly, which is often severe
      or fatal.
    explanation: >-
      Lists hepatosplenomegaly as a defining component of the HLH presentation.
genetic:
- name: SH2D1A
  gene_term:
    preferred_term: SH2D1A
    term:
      id: hgnc:10820
      label: SH2D1A
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
  notes: >-
    XLP1 is caused by hemizygous germline loss-of-function variants in SH2D1A
    (Xq25), encoding SAP. Reported alleles include large constitutional genomic
    deletions, small intragenic deletions, frameshift, nonsense, splice-site and
    missense changes. Most abolish SAP protein expression; a minority (e.g.
    R55L) retain detectable protein but are functionally deficient.
  evidence:
  - reference: PMID:9771704
    reference_title: Host response to EBV infection in X-linked lymphoproliferative disease results from mutations in an SH2-domain encoding gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a gene, SH2D1A, that is mutated in XLP patients and
      encodes a novel protein composed of a single SH2 domain.
    explanation: Establishes SH2D1A as the XLP1 disease gene.
  - reference: PMID:9774102
    reference_title: The X-linked lymphoproliferative-disease gene product SAP regulates signals induced through the co-receptor SLAM.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene encoding SAP maps to the same area of the X chromosome as the
      locus for X-linked lymphoproliferative disease (XLP) and we found mutations
      in the SAP gene in three XLP patients.
    explanation: >-
      Independent identification of SAP gene mutations in XLP patients, with
      positional concordance at the XLP locus.
  - reference: PMID:24985396
    reference_title: Diagnosing XLP1 in patients with hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine cases were SAP(-), 2 expressed SAP with mean relative fluorescence
      intensity values below the range of healthy controls (SAP(dull)), and 1,
      carrying the R55L mutation, was SAP(+).
    explanation: >-
      Documents allelic heterogeneity: most SH2D1A variants abolish SAP protein,
      but some (R55L) preserve expression while remaining functionally
      deficient.
environmental:
- name: Primary Epstein-Barr Virus Infection
  description: >-
    Primary EBV infection is the disease-defining environmental trigger of XLP1.
    The genetic lesion is present from birth, but the fulminant infectious
    mononucleosis/HLH phenotype is precipitated by the first encounter with the
    virus, which was the trigger in 92% of XLP-1 HLH episodes in the Pachlopnik
    Schmid cohort. GeneReviews accordingly lists EBV contact as an
    agent/circumstance to avoid. Note that EBV is not required for every
    manifestation — dysgammaglobulinemia may precede or occur without documented
    EBV infection — so this is modeled as a trigger of the acute arm rather than
    of the disease as a whole.
  exposure_term:
    preferred_term: exposure to Epstein-Barr virus
    term:
      id: ECTO:3000001
      label: exposure to virus
  effect: Precipitates fulminant infectious mononucleosis and HLH in SAP-deficient males.
  influences_mechanisms:
  - target: Unterminated Hyperinflammatory Response to Primary EBV Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Primary EBV infection supplies the SLAM-ligand-bearing B-cell target
      population that SAP-deficient NK and CD8+ T cells cannot clear, and is the
      documented precipitant of the great majority of XLP1 HLH episodes.
    evidence:
    - reference: PMID:21119115
      reference_title: Clinical similarities and differences of patients with X-linked lymphoproliferative syndrome type 1 (XLP-1/SAP deficiency) versus type 2 (XLP-2/XIAP deficiency).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Epstein-Barr virus infection in XLP-1 and XLP-2 was the common trigger of
        HLH (XLP-1, 92%; XLP-2, 83%).
      explanation: >-
        Quantifies EBV infection as the precipitant of 92% of HLH episodes in
        XLP-1, supporting a TRIGGERS edge onto the HLH node.
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Individuals with XLP who come into contact with EBV are at risk of
        developing HLH and/or lymphoproliferation.
      explanation: >-
        States the exposure-outcome relationship directly, as an
        agent/circumstance to avoid.
  evidence:
  - reference: PMID:9771704
    reference_title: Host response to EBV infection in X-linked lymphoproliferative disease results from mutations in an SH2-domain encoding gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked lymphoproliferative syndrome (XLP or Duncan disease) is
      characterized by extreme sensitivity to Epstein-Barr virus (EBV), resulting
      in a complex phenotype manifested by severe or fatal infectious
      mononucleosis, acquired hypogammaglobulinemia and malignant lymphoma.
    explanation: >-
      Establishes EBV sensitivity as the defining environmental dimension of the
      disease.
  - reference: PMID:48119
    reference_title: "X-linked recessive progressive combined variable immunodeficiency (Duncan's disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study suggests that the Epstein-Barr virus or other viruses triggered
      the fatal proliferation of lymphocytes
    explanation: >-
      The original hypothesis that a viral exposure triggers the fatal
      lymphoproliferation, later confirmed as EBV.
prevalence:
- population: Worldwide (males)
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.1
  notes: >-
    Approximately one affected male per million. Two caveats: the source figure
    is for X-linked lymphoproliferative syndrome as a whole (XLP1 plus XLP2),
    not XLP1 alone, and the source does not state whether the estimate is a
    point prevalence or a birth incidence, so measure_type is UNKNOWN. The same
    source notes the condition is probably underdiagnosed. An Orphanet-backed
    record keyed on ORPHA:538931 would give a second, independently derived
    estimate and split XLP1 from XLP2, and is worth adding.
  evidence:
  - reference: PMID:31754776
    reference_title: "X-linked lymphoproliferative syndrome in mainland China: review of clinical, genetic, and immunological characteristic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XLP is estimated to affect approximately one per million males
    explanation: >-
      Source for the approximately one-per-million-males estimate underlying the
      1-9 per 1,000,000 band.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic HSCT is the only known curative therapy for XLP1: it replaces the
    SAP-deficient hematopoietic compartment, restoring NK, CD8+ T and iNKT
    function. Outcome depends sharply on timing. In the 91-patient Booth cohort,
    survival after allogeneic HSCT was 81.4% overall but fell to 50% in patients
    who had HLH as a feature of disease, while untransplanted patients who had
    had HLH survived only 18.8% of the time. The evidence therefore supports
    pre-emptive transplantation in asymptomatic males rather than waiting for an
    HLH episode.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: SAP Adaptor Deficiency
    treatment_effect: RESTORES
    description: >-
      Donor-derived hematopoiesis reconstitutes SAP-expressing lymphocytes,
      correcting the initiating molecular lesion in the hematopoietic
      compartment.
    evidence:
    - reference: PMID:20926771
      reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Survival after allogeneic HSCT is 81.4% with good immune reconstitution
        in the large majority of patients and little evidence of posttransplant
        lymphoproliferative disease.
      explanation: >-
        Good immune reconstitution after HSCT, with resolution of the
        lymphoproliferative risk, indicates correction of the underlying SAP
        defect in the hematopoietic compartment.
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only known curative therapy for XLP1 is allogeneic hematopoietic stem
      cell transplant (HSCT), which should be strongly considered in all males as
      early in life as is feasible, particularly in those who have not developed
      symptoms
    explanation: >-
      Establishes HSCT as the only curative therapy and supports pre-emptive
      timing.
  - reference: PMID:20926771
    reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, survival falls to 50% in patients with HLH as a feature of
      disease.
    explanation: >-
      Quantifies the outcome penalty of transplanting after HLH rather than
      preemptively.
  - reference: PMID:20926771
    reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HSCT should be undertaken in all patients with HLH, because outcome without
      transplant is extremely poor.
    explanation: >-
      The cohort's management conclusion: HSCT is mandatory once HLH has
      occurred.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody depletion of B cells removes the EBV-infected
    B-cell reservoir that XLP1 NK and CD8+ T cells cannot clear, addressing the
    antigen source that sustains the hyperinflammatory state. It is used as part
    of the management of fulminant EBV infection / HLH in XLP.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Uncontrolled EBV-Driven B Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      CD20-directed depletion removes the expanding EBV-infected B-cell
      population directly, bypassing the SAP-dependent cytotoxic pathways that
      cannot act on it.
    evidence:
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
        (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
        steroids and consideration of rituximab), lymphoma, colitis, aplastic
        anemia, and vasculitis.
      explanation: >-
        Places rituximab in the management of fulminant EBV infection / HLH,
        which is where the EBV-driven B-cell expansion is the therapeutic target.
      directness: INDIRECT
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
      (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
      steroids and consideration of rituximab), lymphoma, colitis, aplastic
      anemia, and vasculitis.
    explanation: >-
      GeneReviews management guidance naming rituximab as a consideration in
      fulminant EBV infection / HLH.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Intravenous or subcutaneous immunoglobulin replaces the antibody the failed
    germinal-center reaction cannot generate, preventing the recurrent
    respiratory infection and bronchiectasis that untreated dysgammaglobulinemia
    causes. It is supportive rather than curative: in the Booth cohort the
    majority of untransplanted survivors were maintained on immunoglobulin
    replacement.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Failed Class Switching and Antibody Production
    treatment_effect: BYPASSES
    description: >-
      Exogenous polyclonal IgG substitutes for the class-switched antibody that
      SAP-deficient T-B collaboration fails to produce; it does not repair the
      germinal-center defect.
    evidence:
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
        (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
        steroids and consideration of rituximab), lymphoma, colitis, aplastic
        anemia, and vasculitis.
      explanation: >-
        Names IVIG/IgG as the standard treatment for the hypogammaglobulinemia
        arm of XLP.
  evidence:
  - reference: PMID:20926771
    reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Untransplanted patients have an overall survival of 62.5% with the majority
      on immunoglobulin replacement therapy, but the outcome for those
      untransplanted after HLH is extremely poor (18.8%).
    explanation: >-
      Documents immunoglobulin replacement as the mainstay for untransplanted
      XLP1 patients, and its limits once HLH has occurred.
- name: HLH-Directed Etoposide-Based Therapy
  description: >-
    Etoposide plus corticosteroids (the HLH-94/HLH-2004 backbone) suppresses the
    activated lymphocyte and macrophage compartment driving the hyperinflammatory
    state. In XLP1 this is a bridge, not a cure: it controls the acute episode so
    that curative HSCT can be performed. The detailed HLH protocol is modeled in
    the Hemophagocytic_Lymphohistiocytosis entry.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
  target_mechanisms:
  - target: Unterminated Hyperinflammatory Response to Primary EBV Infection
    treatment_effect: INHIBITS
    description: >-
      Etoposide-based cytoreduction deletes the activated lymphocytes and
      macrophages sustaining the cytokine state, interrupting the
      hyperinflammatory arm without correcting the SAP defect.
    evidence:
    - reference: PMID:20301580
      reference_title: X-Linked Lymphoproliferative Disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Standard treatment for liver dysfunction/failure, hypogammaglobulinemia
        (IVIG or IgG), fulminant EBV infection / HLH (including etoposide and
        steroids and consideration of rituximab), lymphoma, colitis, aplastic
        anemia, and vasculitis.
      explanation: >-
        Names etoposide and steroids as the standard treatment for the fulminant
        EBV infection / HLH manifestation this node represents.
  evidence:
  - reference: PMID:20926771
    reference_title: "X-linked lymphoproliferative disease due to SAP/SH2D1A deficiency: a multicenter study on the manifestations, management and outcome of the disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The advent of better treatment strategies for HLH and malignancy has
      greatly reduced mortality for these patients, but HLH still remains the
      most severe feature of XLP1.
    explanation: >-
      Attributes the modern mortality reduction to improved HLH-directed
      treatment, while noting it does not eliminate HLH as the dominant risk.

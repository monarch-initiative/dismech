- name: Impaired Immune Surveillance and B Cell Lymphomagenesis
  biological_scale: TISSUE
  description: >-
    The chronic arm of XLP1. Sustained polyclonal B-cell proliferation, combined
    with loss of NK-, CD8- and iNKT-mediated surveillance of transformed cells,
    provides both the substrate and the permissive environment for conversion to
    monoclonal B-cell malignancy. Lymphoma is essentially confined to XLP1 among
    the X-linked lymphoproliferative syndromes and typically arises in childhood,
    usually after EBV exposure; extranodal ileocecal/ileal B-cell lymphoma is the
    classically described site, and the original Duncan kindred included
    lymphomas of the ileum.

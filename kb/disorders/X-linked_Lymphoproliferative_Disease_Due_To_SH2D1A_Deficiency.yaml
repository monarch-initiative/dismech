      States the polyclonal-to-monoclonal transition that this node models.
  - reference: PMID:21119115
    reference_title: Clinical similarities and differences of patients with X-linked lymphoproliferative syndrome type 1 (XLP-1/SAP deficiency) versus type 2 (XLP-2/XIAP deficiency).
    supports: SUPPORT

  - reference: PMID:22500829
    reference_title: "From SAP-less T cells to helpless B cells and back: dynamic T-B cell interactions underlie germinal center development and function."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Signaling lymphocytic activation molecule (SLAM)-associated protein (SAP)

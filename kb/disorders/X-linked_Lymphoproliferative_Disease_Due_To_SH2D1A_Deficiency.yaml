phenotypes:
- category: Immunologic
  name: Fulminant Infectious Mononucleosis with Hemophagocytic Lymphohistiocytosis
  description: >-
    The defining acute presentation: an overwhelming response to primary EBV
    infection producing severe or fatal mononucleosis and/or HLH with prolonged
    high fever, cytopenias, hepatosplenomegaly and hemophagocytosis. It is the
    most common presentation of XLP and the leading cause of death. In the
    modern Pachlopnik Schmid cohort HLH occurred in 55% of XLP-1 patients and
    was EBV-triggered in 92%; in the historical Purtilo registry 57% of affected
    males died of infectious mononucleosis.
  frequency: FREQUENT

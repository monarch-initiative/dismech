inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    XLP1 is inherited in an X-linked manner. Affected males carry a hemizygous
    germline SH2D1A pathogenic variant; heterozygous female carriers are
    typically unaffected, though symptomatic carriers with skewed X-chromosome
    inactivation have been reported.
  evidence:
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "XLP is inherited in an X-linked manner."
    explanation: States the inheritance mode directly.
  - reference: PMID:48119
    reference_title: "X-linked recessive progressive combined variable immunodeficiency (Duncan's disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half the boys, including the half-brothers, were affected,
      and girls were spared, implying sex-linked recessive inheritance.
    explanation: >-
      The original Duncan kindred segregation analysis that established X-linked
      recessive inheritance for the disorder.
pathophysiology:
- name: SAP Adaptor Deficiency
  biological_scale: MOLECULAR
  description: >-
    Hemizygous SH2D1A deletions, frameshifts, nonsense and missense variants
    abolish or destabilize SAP, a 128-amino-acid protein consisting almost
    entirely of a single SH2 domain. Affected males typically have absent or
    markedly reduced intracellular SAP protein by flow cytometry. This is the
    initiating molecular lesion of XLP1.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    genes:
    - preferred_term: SH2D1A
      term:
        id: hgnc:10820
        label: SH2D1A
    description: >-
      Hemizygous germline SH2D1A variants in males, including large constitutional
      deletions, small intragenic deletions, nonsense and missense alleles.
      Missense alleles such as R55L may retain detectable protein while remaining
      functionally deficient.
  molecular_functions:
  - preferred_term: SAP signaling adaptor activity
    term:
      id: GO:0035591
      label: signaling adaptor activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9771704
    reference_title: Host response to EBV infection in X-linked lymphoproliferative disease results from mutations in an SH2-domain encoding gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a gene, SH2D1A, that is mutated in XLP patients and
      encodes a novel protein composed of a single SH2 domain.
    explanation: >-
      Identifies SH2D1A as the mutated gene in XLP and its product as a
      single-SH2-domain protein.
  - reference: PMID:9811875
    reference_title: Inactivating mutations in an SH2 domain-encoding gene in X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe here the presence of small deletions and intragenic mutations
      that specifically disrupt a gene named DSHP in 6 of 10 unrelated patients
      with XLP.
    explanation: >-
      Independent identification of inactivating deletions and intragenic
      mutations in the same gene (named DSHP in this report) in XLP patients.
  - reference: PMID:20301580
    reference_title: X-Linked Lymphoproliferative Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These males typically have low or absent SAP or XIAP protein expression,
      respectively, by flow cytometry.
    explanation: >-
      Confirms that the genetic lesion translates into absent or reduced SAP
      protein in affected males.
  downstream:
  - target: SLAM-Family Receptor Signaling Failure
    description: >-
      Loss of the SAP adaptor removes the obligate coupling between SLAM-family
      receptor cytoplasmic tails and downstream activating signaling.
    causal_link_type: DIRECT
- name: SLAM-Family Receptor Signaling Failure
  biological_scale: MOLECULAR
  description: >-
    SAP binds immunoreceptor tyrosine-based switch motifs in the cytoplasmic
    tails of SLAM (CD150), 2B4 (CD244), NTB-A (SLAMF6), CD84 and Ly9, and
    normally recruits the kinase FynT while blocking docking of SH2-containing
    phosphatases. Without SAP, SHP-1/SHP-2 occupy those docking sites, so the
    receptors deliver inhibitory rather than activating signals. This inversion —
    rather than a simple absence of signal — is the defining molecular feature
    of XLP1 and explains why the immune failure is targeted at SLAM-ligand-bearing
    B lymphocytes.
  molecular_functions:
  - preferred_term: SAP SH2-domain binding to SLAM-family receptor tails
    term:
      id: GO:0042169
      label: SH2 domain binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:9774102
    reference_title: The X-linked lymphoproliferative-disease gene product SAP regulates signals induced through the co-receptor SLAM.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      acts as an inhibitor by blocking recruitment of the SH2-domain-containing
      signal-transduction molecule SHP-2 to a docking site in the SLAM
      cytoplasmic region
    explanation: >-
      Defines SAP's molecular role as competitively excluding SHP-2 from the
      SLAM cytoplasmic tail, the step lost in XLP1.
  - reference: PMID:9774102
    reference_title: The X-linked lymphoproliferative-disease gene product SAP regulates signals induced through the co-receptor SLAM.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Absence of the inhibitor SAP in XLP patients affects T/B-cell interactions
      induced by SLAM, leading to an inability to control B-cell proliferation
      caused by Epstein-Barr virus infections.
    explanation: >-
      Connects loss of SAP-dependent SLAM signaling to failure of control over
      EBV-driven B-cell proliferation. Graded IN_VITRO with INDIRECT
      directness because this is the authors' closing interpretation of their
      COS-cell and Jurkat transfection experiments, not a clinical observation
      reported in the paper; it matches the grading of the other quote from
      this same publication above.
  - reference: PMID:21219180
    reference_title: SLAM family receptors and SAP adaptors in immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SAP consists almost entirely of a single SH2 protein domain that interacts
      with the cytoplasmic tail of SLAM and related receptors, including 2B4,
      Ly108, CD84, Ly9, and potentially CRACC.
    explanation: >-
      Enumerates the SLAM-family receptors whose signaling depends on SAP,
      defining the breadth of the lesion. Review article, hence OTHER.
  downstream:
  - target: 2B4/NTB-A Inhibitory Switch on NK Cells
    description: >-
      On NK cells, uncoupled 2B4 and NTB-A engage their ligands on EBV-infected
      B cells and transmit inhibitory signals.
    causal_link_type: DIRECT
  - target: Defective EBV-Specific CD8+ T Cell Cytotoxicity
    description: >-
      On EBV-specific cytotoxic T cells, the same SLAM-family receptors block
      recognition of SLAM-ligand-positive B-cell targets.
    causal_link_type: DIRECT
  - target: Absent Invariant NKT Cell Development
    description: >-
      SAP-dependent SLAM-family homotypic signaling during thymic selection is
      required for iNKT lineage commitment.
    causal_link_type: DIRECT
  - target: Defective T-B Cell Help and Germinal Center Formation
    description: >-
      SAP-dependent SLAM-family signaling sustains stable cognate T-B conjugates
      and follicular helper T-cell function.
    causal_link_type: DIRECT
- name: 2B4/NTB-A Inhibitory Switch on NK Cells
  biological_scale: CELLULAR
  description: >-
    In XLP1 NK cells, 2B4 (CD244) not only fails to transduce a triggering
    signal but actively inhibits cytolysis, and the same inversion affects
    NTB-A. Because CD48 — the 2B4 ligand — is densely expressed on EBV-infected
    B cells, XLP1 NK cells engaging an EBV-positive target receive a dominant
    inhibitory signal and fail to kill it. Antibody-mediated masking of 2B4 and
    NTB-A restores lysis, demonstrating that inhibition rather than absent
    activation is the operative defect. Other NK triggering receptors (CD16,
    NKp46, NKp44, NKp30) are intrinsically normal but are overridden by 2B4
    engagement.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: NK-cell killing of EBV-infected B cells
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:10934222
    reference_title: X-linked lymphoproliferative disease. 2B4 molecules displaying inhibitory rather than activating function are responsible for the inability of natural killer cells to kill Epstein-Barr virus-infected cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that, in these patients, 2B4 not only fails to transduce
      triggering signals, but also mediates a sharp inhibition of the NK-mediated
      cytolysis.
    explanation: >-
      Direct demonstration that 2B4 signaling is inverted, not merely lost, in
      XLP1 NK cells.
  - reference: PMID:10934222
    reference_title: X-linked lymphoproliferative disease. 2B4 molecules displaying inhibitory rather than activating function are responsible for the inability of natural killer cells to kill Epstein-Barr virus-infected cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Remarkably, NK cells from XLP patients could not kill EBV(+) B cell lines."
    explanation: >-
      Establishes the functional consequence: failure of XLP1 NK cells to kill
      EBV-infected B cells.
  - reference: PMID:11489943
    reference_title: "NTB-A [correction of GNTB-A], a novel SH2D1A-associated surface molecule contributing to the inability of natural killer cells to kill Epstein-Barr virus-infected B cells in X-linked lymphoproliferative disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, in XLP-NK cells, NTB-A mediates inhibitory rather than activating signals."
    explanation: >-
      Shows the inhibitory switch is not confined to 2B4 but extends to a second
      SAP-dependent SLAM-family receptor.
  - reference: PMID:24985396
    reference_title: Diagnosing XLP1 in patients with hemophagocytic lymphohistiocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NK cells from all patients showed inhibitory 2B4 function and defective
      killing of B-EBV cells.
    explanation: >-
      Confirms the inhibitory 2B4 phenotype in every patient of a genetically
      confirmed XLP1 cohort, establishing it as a consistent disease feature.
  downstream:
  - target: Uncontrolled EBV-Driven B Cell Proliferation
    description: >-
      Failure of NK-mediated killing leaves the EBV-infected B-cell pool
      unchecked during primary infection.
    causal_link_type: DIRECT
  - target: Decreased Natural Killer Cell-Induced Killing of Target Cells
    causal_link_type: DIRECT
    description: >-
      The inhibitory switch is measured directly as impaired NK killing of
      EBV-infected B-cell targets — the laboratory readout of this node.
- name: Defective EBV-Specific CD8+ T Cell Cytotoxicity
  biological_scale: CELLULAR
  description: >-
    XLP1 patients who survive primary EBV infection mount numerically normal
    EBV-specific CD8+ T-cell responses, but those T cells are selectively unable
    to recognize SLAM-ligand-positive targets. CD8+ clones kill EBV-antigen-expressing
    targets that lack SLAM ligands, yet fail against EBV-transformed lymphoblastoid
    cell lines; blocking CD244 and NTB-A restores recognition. This selectivity
    is the best available explanation for why XLP1 confers susceptibility to EBV
    specifically rather than to viruses in general — EBV's tropism is for the
    very B lymphocytes that carry the inhibitory ligands.
  cell_types:
  - preferred_term: EBV-specific CD8+ cytotoxic T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: CD8+ T-cell killing of EBV-transformed B cells
    term:
      id: GO:0001913
      label: T cell mediated cytotoxicity
    modifier: DECREASED
  evidence:
  - reference: PMID:20644117
    reference_title: Impaired Epstein-Barr virus-specific CD8+ T-cell function in X-linked lymphoproliferative disease is restricted to SLAM family-positive B-cell targets.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, further investigation of in vitro-derived CD8(+) T-cell clones
      established from 2 of these donors showed they efficiently recognized SLAM
      ligand-negative target cells expressing EBV antigens, but showed impaired
      recognition of EBV-transformed, SLAM ligand-positive, lymphoblastoid cell
      lines (LCLs).
    explanation: >-
      Demonstrates that the CD8+ T-cell defect in XLP1 is target-restricted to
      SLAM-ligand-positive B cells.
  - reference: PMID:20644117
    reference_title: Impaired Epstein-Barr virus-specific CD8+ T-cell function in X-linked lymphoproliferative disease is restricted to SLAM family-positive B-cell targets.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, LCL recognition was restored when interactions between the
      SLAM receptors CD244 and natural killer-, T-, and B-cell antigen (NTBA) and
      their ligands on LCLs were blocked.
    explanation: >-
      Rescue by receptor blockade identifies inhibitory SLAM-family signaling as
      the operative cause of the CD8+ recognition failure.
  downstream:
  - target: Uncontrolled EBV-Driven B Cell Proliferation
    description: >-
      Loss of cytotoxic T-cell control over EBV-transformed B cells permits their
      continued expansion.
    causal_link_type: DIRECT
- name: Absent Invariant NKT Cell Development
  biological_scale: CELLULAR
  description: >-
    SAP is required for the development of invariant (type I) NKT cells. Sh2d1a-null
    mice lack NKT cells in thymus and periphery through a hematopoietic-cell-autonomous
    defect that is rescued by restoring SAP expression in bone marrow, and seventeen
    genetically confirmed XLP1 patients likewise lacked NKT cells. Absent iNKT cells
    are a robust, near-universal cellular biomarker of SAP deficiency and are thought
    to contribute to defective antiviral and antitumor immunity and to
    hypogammaglobulinemia.
  cell_types:
  - preferred_term: invariant (type I) NKT cell
    term:
      id: CL:0000921
      label: type I NK T cell
  biological_processes:
  - preferred_term: invariant NKT cell development
    term:
      id: GO:0001865
      label: NK T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:15711562
    reference_title: "Regulation of NKT cell development by SAP, the protein defective in XLP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventeen individuals with X-linked lymphoproliferative disease (XLP), who
      harbored germline mutations in SH2D1A, also lacked NKT cells.
    explanation: >-
      Establishes absent NKT cells in genetically confirmed human XLP1 patients.
  - reference: PMID:15711562
    reference_title: "Regulation of NKT cell development by SAP, the protein defective in XLP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The defect in NKT cell ontogeny was hematopoietic cell autonomous and could
      be rescued by reconstitution of SAP expression within Sh2d1a-/- bone marrow
      cells.
    explanation: >-
      Mouse genetics establishes that the NKT developmental block is caused by
      SAP loss within the hematopoietic compartment and is SAP-reversible.
  downstream:
  - target: Impaired Immune Surveillance and B Cell Lymphomagenesis
    description: >-
      Loss of the iNKT compartment removes an antitumor effector arm, contributing
      to defective surveillance of transformed B cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Failed Class Switching and Antibody Production
    description: >-
      Absent iNKT cells are proposed to contribute to the humoral defect of SAP
      deficiency alongside the primary T-B help failure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Uncontrolled EBV-Driven B Cell Proliferation
  biological_scale: CELLULAR
  description: >-
    With both NK- and CD8-mediated control of SLAM-ligand-positive targets lost,
    primary EBV infection produces an uncontained expansion of virus-carrying B
    cells accompanied by a massive reactive cytotoxic T-cell response. This is
    the pivotal cellular event of XLP1 and the branch point from which both the
    acute hyperinflammatory arm and the chronic lymphomagenesis arm descend.
  cell_types:
  - preferred_term: EBV-infected B cell
    term:
      id: CL:0000236
      label: B cell
  biological_processes:
  - preferred_term: EBV-driven B cell proliferation
    term:
      id: GO:0030890
      label: positive regulation of B cell proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:9811875
    reference_title: Inactivating mutations in an SH2 domain-encoding gene in X-linked lymphoproliferative syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In affected males, primary EBV infection leads to the uncontrolled
      proliferation of virus-containing B cells and reactive cytotoxic T cells,

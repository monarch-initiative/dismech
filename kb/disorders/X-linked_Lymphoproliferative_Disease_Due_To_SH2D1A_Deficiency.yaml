name: X-linked Lymphoproliferative Disease Due To SH2D1A Deficiency
creation_date: '2026-09-01T00:00:00Z'
category: Genetic
synonyms:
- XLP1
- XLP type 1
- Duncan disease
- Purtilo syndrome
- SAP deficiency
- X-linked lymphoproliferative syndrome type 1
description: >-
  X-linked lymphoproliferative disease type 1 (XLP1, Duncan disease) is a rare
  inborn error of immunity caused by hemizygous loss-of-function variants in
  SH2D1A, which encodes SAP (SLAM-associated protein). SAP is a small adaptor
  built almost entirely from a single SH2 domain that couples the cytoplasmic
  tails of SLAM-family receptors — SLAM (CD150), 2B4 (CD244), NTB-A (SLAMF6),
  CD84 and Ly9 — to activating kinases. Without SAP these receptors do not
  simply fall silent: they recruit SH2-domain-containing phosphatases instead
  and switch from activating to inhibitory signaling. The consequence is
  paradoxical, and it is specific to the B-lymphocyte compartment that
  Epstein-Barr virus (EBV) inhabits, because SLAM-family ligands such as CD48
  are densely expressed on EBV-infected B cells. NK cells and EBV-specific CD8+
  cytotoxic T cells engage those targets and are inhibited by the encounter,
  so the virus-driven B-cell expansion is never contained. SAP loss also
  abolishes invariant NKT (type I NKT) cell development and cripples cognate
  T-B help and germinal-center formation.

  The classical triad is fulminant infectious mononucleosis/hemophagocytic
  lymphohistiocytosis (HLH) on primary EBV exposure, dysgammaglobulinemia, and
  B-cell lymphoma (historically often ileocecal). Rarer manifestations include
  hepatitis progressing to liver failure, aplastic anemia, vasculitis, and
  lymphomatoid granulomatosis. Allogeneic hematopoietic stem cell transplant is
  the only curative therapy, and outcome depends sharply on whether it is done
  before or after an HLH episode.
notes: >-
  Scope note: this entry is the dedicated XLP1 (SH2D1A/SAP) disease entry. The
  Hemophagocytic_Lymphohistiocytosis entry covers HLH as a syndrome and carries
  XLP1 and XLP2 as HLH-predisposing subtypes; it is the place to look for the
  general HLH pathophysiology, diagnostic criteria and HLH-94/HLH-2004
  treatment protocols. This entry covers the SAP-specific mechanism and the
  non-HLH arms of XLP1 (dysgammaglobulinemia, lymphoma, absent iNKT cells) that
  the HLH entry does not model. XLP2 (XIAP/BIRC4 deficiency, MONDO:0010385) is a
  separate disease and is not covered here.

- name: Defective T-B Cell Help and Germinal Center Formation
  biological_scale: CELLULAR
  description: >-
    SAP-dependent SLAM-family signaling sustains stable cognate interactions
    between follicular helper T cells and antigen-engaged B cells, and is
    required for germinal-center development. XLP1 patients have normal B-cell
    development but markedly reduced memory B cells, and the few present are
    IgM-positive, indicating failed in vivo isotype switching. The block is
    B-cell extrinsic: XLP1 B cells proliferate and differentiate normally in
    vitro, while XLP1 CD4+ T cells fail to differentiate into IL-10-producing
    effectors, fail to upregulate ICOS, and provide poor B-cell help — a defect
    partially corrected by exogenous IL-10 or restored SAP expression.
  cell_types:
  - preferred_term: T follicular helper cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: germinal center formation
    term:
      id: GO:0002467
      label: germinal center formation
    modifier: DECREASED
  evidence:
  - reference: PMID:15761493
    reference_title: Impaired humoral immunity in X-linked lymphoproliferative disease is associated with defective IL-10 production by CD4+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our analysis of 14 XLP patients revealed normal B cell development but a
      marked reduction in the number of memory B cells.
    explanation: >-
      Localizes the humoral lesion downstream of B-cell development, at memory
      B-cell generation.
  - reference: PMID:15761493
    reference_title: Impaired humoral immunity in X-linked lymphoproliferative disease is associated with defective IL-10 production by CD4+ T cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The few memory cells detected were IgM(+), revealing deficient isotype
      switching in vivo.
    explanation: >-
      Demonstrates failed in vivo class switching, the hallmark of a defective
      germinal-center reaction.
  - reference: PMID:15761493
    reference_title: Impaired humoral immunity in X-linked lymphoproliferative disease is associated with defective IL-10 production by CD4+ T cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      XLP CD4(+) T cells did not efficiently differentiate into IL-10(+) effector

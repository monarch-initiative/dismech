animal_models:
- name: taut-/- taurine transporter knockout mouse (retinal arm)
  species: Mouse
  genotype: Slc6a6 (taut) homozygous null
  publication: PMID:11772953
  description: >-
    Germline disruption of the mouse taurine transporter gene, the model in which
    the retinal consequence of transporter loss was first established and which
    predated the recognition of the human disorder.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration and Outer Retinal Thinning
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The null mouse loses vision from severe retinal degeneration, matching the
      panretinal degeneration of human TauT deficiency, and was the basis for
      searching for the human disease.
    limitations: >-
      The mouse is a complete null, whereas human disease alleles range from
      complete loss of transport to a hypomorph retaining roughly 15% of normal
      capacity; the mouse also develops later multisystem features (hearing loss,
      liver fibrosis, behavioural abnormalities) that have not been observed in
      patients.
    readouts:
    - name: Retinal morphology and visual function
      target: Photoreceptor Degeneration and Outer Retinal Thinning
      direction: DECREASED
      interpretation: >-
        Structural and functional loss of the retina in the transporter-null
        mouse, the animal correlate of the human outer-retinal degeneration node.
      evidence:
      - reference: PMID:11772953
        reference_title: "Disruption of the taurine transporter gene (taut) leads to retinal degeneration in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "loss of vision due to severe retinal degeneration"
        explanation: Reports the retinal measurement behind this readout.
    evidence:
    - reference: PMID:11772953
      reference_title: "Disruption of the taurine transporter gene (taut) leads to retinal degeneration in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In particular, the retinal involvement identifies the taurine transporter as an important factor for the development and maintenance of normal retinal functions and morphology."
      explanation: Supports treating this model as informative for the retinal degeneration node.
- name: TauTKO taurine transporter knockout mouse (cardiac and muscle arm)
  species: Mouse
  genotype: Slc6a6 (TauT) homozygous knockout
  publication: PMID:18407290
  description: >-
    Taurine transporter knockout mouse characterized for cardiac and skeletal
    muscle phenotype, with myocardial and skeletal muscle taurine depletion,
    ventricular remodeling, cardiac atrophy and reduced exercise capacity.
  modeled_mechanisms:
  - target: Cardiomyocyte Atrophy and Ventricular Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The knockout develops a dilated, atrophic cardiomyopathy with reduced
      cardiac output and induction of fetal heart-failure genes, providing the
      mechanistic account of the cardiomyopathy seen in the index human family.
    limitations: >-
      Fidelity is only MODERATE because the cardiac arm is variably penetrant in
      humans: the later multicenter series found structurally normal hearts in
      all seven affected individuals despite complete loss of taurine transport,
      so the uniform murine cardiomyopathy overstates the human cardiac risk.
    readouts:
    - name: Ventricular wall thickness and cardiomyocyte size
      target: Cardiomyocyte Atrophy and Ventricular Remodeling
      direction: DECREASED
      interpretation: >-
        Structural correlate of the ventricular remodeling node — thinner walls
        and smaller cardiomyocytes rather than hypertrophy.
      evidence:
      - reference: PMID:18407290
        reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "reductions in ventricular wall thickness and cardiac atrophy accompanied with the smaller cardiomyocytes"
        explanation: Reports the structural measurement behind this readout.
    - name: Cardiac output
      target: Cardiomyocyte Atrophy and Ventricular Remodeling
      direction: DECREASED
      interpretation: Functional consequence of the remodeling in this model.
      evidence:
      - reference: PMID:18407290
        reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "a reduction in cardiac output and increased expression of heart cardiac failure (fetal) marker genes"
        explanation: Reports the functional measurement behind this readout.
    evidence:
    - reference: PMID:18407290
      reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taurine depletion causes cardiomyocyte atrophy, mitochondrial and myofiber damage and cardiac dysfunction, effects likely related to the actions of taurine."
      explanation: Supports treating this model as informative for the cardiac remodeling node.
  - target: Skeletal Muscle Taurine Depletion
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      The knockout depletes skeletal muscle taurine and produces measurable
      structural and exercise-capacity deficits.
    limitations: >-
      No myopathy or exercise intolerance has been reported in patients with
      taurine transporter deficiency, in whom skeletal muscle taurine is severely
      reduced but extraocular dysfunction was explicitly not detected; the murine
      muscle phenotype therefore has no established human counterpart.
    readouts:
    - name: Skeletal muscle cell volume and exercise endurance
      target: Skeletal Muscle Taurine Depletion
      direction: DECREASED
      interpretation: >-
        Muscle-level correlate of taurine depletion in this model, currently
        without a clinical human counterpart.
      evidence:
      - reference: PMID:18407290
        reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the skeletal muscle of the TauTKO mice also exhibited decreased cell volume, structural defects and a reduction of exercise endurance capacity"
        explanation: Reports the muscle measurements behind this readout.
    evidence:
    - reference: PMID:18407290
      reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "which exhibited a deficiency in myocardial and skeletal muscle taurine content compared with their wild-type littermates"
      explanation: Supports the model as informative for the skeletal-muscle taurine depletion node.
discussions:
- discussion_id: slc6a6_cardiac_penetrance_gap
  prompt: >-
    Why is cardiomyopathy present in some SLC6A6-deficient pedigrees and absent
    in others despite comparable or greater loss of taurine transport?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cardiomyocyte Atrophy and Ventricular Remodeling
  rationale: >-
    The index consanguineous family carried a hypomorphic allele retaining
    roughly 15% of normal transport and had childhood cardiomyopathy that
    reversed on taurine supplementation. The later multicenter series included
    variants causing complete loss of transport, yet cardiac structure was normal
    in all seven affected individuals, with only short PR intervals. The cardiac
    arm therefore does not track with residual transport capacity, so something
    else — age at assessment, dietary taurine intake, genetic background, or a
    modifier of cardiac taurine handling — determines whether it manifests. This
    matters clinically because it determines whether cardiac surveillance and
    pre-emptive supplementation are warranted in every patient or only in some.
  proposed_experiments:
  - experiment_id: exp_slc6a6_longitudinal_cardiac_cohort
    name: Longitudinal cardiac phenotyping of SLC6A6-deficient patients
    description: >-
      Serial echocardiography, ECG and cardiac MRI in all known SLC6A6-deficient
      patients, stratified by residual transport capacity and age, to test
      whether cardiomyopathy is age-dependent rather than genotype-dependent.
    decision_criterion: >-
      Emergence of ventricular remodeling with age in patients whose hearts were
      initially structurally normal would support an age-dependent arm; its
      absence in adults with complete loss of transport would argue for a genuine
      modifier.
  - experiment_id: exp_slc6a6_dietary_taurine_confounder
    name: Dietary taurine intake versus cardiac phenotype
    description: >-
      Quantify dietary taurine intake alongside plasma taurine in
      SLC6A6-deficient patients with and without cardiomyopathy, to test whether
      nutritional taurine masks the cardiac phenotype.
    decision_criterion: >-
      Higher taurine intake in the cardiac-unaffected pedigrees would support
      dietary rescue as the explanation for variable penetrance.
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac structure was normal in all patients; however, short PR intervals were observed in all patients"
    explanation: Documents the absence of structural cardiomyopathy in a cohort with complete loss of transport.
  - reference: PMID:31903486
    reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals presented with rapidly progressive childhood retinal degeneration, cardiomyopathy and almost undetectable plasma taurine levels."
    explanation: Documents the contrasting pedigree in which cardiomyopathy was present in childhood.
- discussion_id: slc6a6_mouse_multisystem_mismatch
  prompt: >-
    Does the multisystem phenotype of the Slc6a6-null mouse predict human
    disease, or does it represent an allelic and physiological state no patient
    occupies?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal Muscle Taurine Depletion
  rationale: >-
    The mouse null develops hearing loss, liver fibrosis, and behavioural, heart
    and skeletal-muscle abnormalities in addition to retinal degeneration. In the
    two human brothers with 95% loss of taurine uptake, skeletal-muscle and brain
    taurine were severely reduced yet no extraocular dysfunction was detectable —
    only a subclinical oxidative-stress marker. Two explanations have different
    consequences for surveillance: either the human extraocular phenotypes are
    late and will appear with age (in which case the mouse is a valid predictor
    and lifelong multisystem monitoring is indicated), or humans are protected by
    dietary taurine and residual biosynthesis in a way mice on standard chow are
    not (in which case the mouse overstates human risk). The original report
    chose the cautious reading and recommended continuous broad surveillance.
  proposed_experiments:
  - experiment_id: exp_slc6a6_adult_multisystem_survey
    name: Multisystem assessment of adult SLC6A6-deficient patients
    description: >-
      Systematic audiological, hepatic and neuromuscular assessment of adult
      SLC6A6-deficient patients, to test whether the murine extraocular
      phenotypes emerge with age in humans.
    decision_criterion: >-
      Detection of hearing loss, hepatic fibrosis or myopathy in adults would
      validate the mouse as predictive; their absence in adulthood would
      establish a species-restricted phenotype.
  - experiment_id: exp_slc6a6_species_taurine_supply
    name: Cross-species comparison of taurine supply
    description: >-
      Compare dietary taurine intake and endogenous taurine biosynthetic flux
      between mouse and human, to test the dietary and biosynthetic protection
      hypothesis for the species difference.
    decision_criterion: >-
      Substantially greater human dietary or biosynthetic taurine supply would
      explain the milder human extraocular phenotype without invoking a
      different mechanism.
  evidence:
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extraocular dysfunctions were not yet detected, but significantly increased urinary excretion of 8-oxo-7,8-dihydroguanosine indicated generally enhanced (yet clinically unapparent) oxidative stress and RNA oxidation, warranting continuous broad surveillance"
    explanation: States the human-mouse discrepancy and the surveillance recommendation that follows from it.
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice develop multisystemic dysfunctions (hearing loss; liver fibrosis; and behavioral, heart, and skeletal muscle abnormalities) later on"
    explanation: Enumerates the murine multisystem phenotypes whose human counterparts are unconfirmed.
- discussion_id: slc6a6_mitochondrial_arm_unvalidated
  prompt: >-
    Does SLC6A6-dependent mitochondrial taurine import contribute to the
    pathophysiology of inherited taurine transporter deficiency, and if so why
    does oral taurine help patients when exogenous taurine did not rescue
    SLC6A6-deficient cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Taurine Import and mt-tRNA Modification
  rationale: >-
    The mitochondrial-import function of SLC6A6 was established in cancer cell
    lines, where the transporter — and not extracellular taurine — was the
    requirement for mitochondrial translation. If that holds in patient tissue,
    then raising extracellular taurine should not correct the mitochondrial arm,
    and the clinical benefit of supplementation would be confined to the
    plasma-membrane-dependent, osmotic and antioxidant functions. Yet oral
    taurine reversed cardiomyopathy in the index family, where cardiac muscle is
    among the most mitochondria-dependent tissues affected. Either the
    mitochondrial arm is not rate-limiting in the inherited disease, or the
    residual transport of a hypomorphic allele is sufficient to serve the
    mitochondrial pool once extracellular taurine is high. Distinguishing these
    determines whether a subset of patients — particularly those with truncating
    alleles — would be predicted not to respond to supplementation.
  proposed_experiments:
  - experiment_id: exp_slc6a6_mito_taurine_patient_fibroblasts
    name: Mitochondrial taurine and mt-tRNA modification in patient fibroblasts
    description: >-
      Assay mitochondrial taurine content, mitochondrial tRNA taurine
      modification, and mitochondrial translation in patient-derived fibroblasts
      carrying truncating versus hypomorphic SLC6A6 alleles, with and without
      taurine loading.
    decision_criterion: >-
      Reduced mitochondrial taurine and mt-tRNA modification in patient cells
      would establish the mitochondrial arm in the inherited disease; normal
      values would confine it to the cancer context.
  - experiment_id: exp_slc6a6_mito_rescue_by_taurine_loading
    name: Substrate-correctability of the mitochondrial arm
    description: >-
      Measure respiratory-chain function and mitochondrial translation products
      in patient fibroblasts before and after taurine supplementation, to test
      whether the mitochondrial arm is substrate-correctable in the inherited
      disease.
    decision_criterion: >-
      Restoration of mitochondrial translation by taurine loading would
      reconcile the clinical response with the cell-line result; failure to
      restore would predict non-responders among truncating-allele patients.
  evidence:
  - reference: PMID:41652173
    reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that SLC6A6, but not exogenous taurine, is essential for mitochondrial metabolism and cancer cell growth."
    explanation: The finding that extracellular taurine cannot substitute for the transporter is what creates the tension with clinical supplementation response.
  - reference: PMID:31903486
    reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "after 24-months, the cardiomyopathy was corrected in both affected siblings"
    explanation: The clinical response to supplementation that the in vitro result does not predict.
notes: >-
  Curated as an increment of IEMbase metabolic package WP-004 (issue #5559), row
  1.11.13.01 "SLC6A6-related Taurine transporter deficiency".

  Identity check performed before curation: MONDO:0007777 carries RO:0004003
  HGNC:11052 (SLC6A6) and xref OMIM:145350, matching the causal gene named in
  every cited human report. Note that the IEMbase seed row cites OMIM 186854,
  which is the SLC6A6 gene entry rather than the disease entry — the disease MIM
  is 145350.

  Claims deliberately NOT curated, so a future curator does not re-add them:

  - No hearing loss, liver fibrosis or behavioural phenotype is curated as a
    human phenotype. These are Slc6a6-null mouse findings; the human reports
    state that extraocular dysfunction was not detected. They are represented
    only inside the HUMAN_MODEL_MISMATCH discussion.
  - No dilated cardiomyopathy HP term is used. The dilated/atrophic
    characterization comes from the rodent literature; the human reports say
    "cardiomyopathy" without a structural subtype, so the generic HP:0001638 is
    used.
  - No taurine reference range is curated. The 2026 series reports differences
    in means between groups rather than a reference interval, and no
    LOINC-coded interval for plasma taurine was verified.
  - The SLC6A6 cancer literature (breast, cholangiocarcinoma, colon; PROTAC
    degraders; Mendelian-randomization associations) is out of scope for this
    entry. Only the mitochondrial-transport mechanism paper is cited, and only
    as an EMERGING hypothesis with IN_VITRO evidence.
  - The "Photoreceptor Degeneration and Outer Retinal Thinning" node does NOT
    declare conforms_to photoreceptor_degeneration#Secondary Cone Degeneration
    and Outer Retinal Thinning, and the anchor should not be re-added. That
    module node defines cone loss as non-cell-autonomous and consequent on rods
    having already been largely eliminated, in a disease whose mutation is "not
    expressed in cones". Neither holds here: scotopic AND photopic ERGs are
    severely depressed from presentation (the LCA/EORD pattern), so cone
    involvement is concurrent rather than secondary, and SLC6A6 loss is systemic
    so cones carry the lesion themselves. The entry correspondingly does not
    conform to the module's #Rod Photoreceptor Apoptosis node either. Retinal
    conformance is asserted only at #Photoreceptor Metabolic and Oxidative
    Stress and #Progressive Visual Field Loss and Blindness, which are
    mechanism-neutral as to which photoreceptor class fails first.

  - No finer retinal descriptors are curated beyond the six retinal phenotypes
    above. The deep-research artifact surfaces macular atrophy (HP:0007401),
    clumped pigmentary retinal degeneration, nyctalopia (HP:0000662),
    strabismus and a colour-vision defect. All are expected components of the
    curated HP:0000510 rod-cone dystrophy / HP:0000546 retinal degeneration
    pair, and the artifact reports them either as individual-patient findings
    (macular atrophy with clumped pigmentation progressing between ages 11 and
    18 in one patient) or as an unquantified symptom list. They are omitted for
    want of a frequency band that could be honestly justified, not because they
    were missed.
  - Taurine's roles in intracellular calcium handling and in
    proteostasis/apoptosis regulation are not modeled as pathophysiology nodes.
    The deep-research artifact cites them only to a review and to a
    non-peer-reviewed preprint, neither of which measures them in
    SLC6A6-deficient human tissue, so they do not meet the evidence bar for a
    causal node here.

  Correction to an earlier draft of this entry: it claimed HPO had no term for
  short PR interval and flagged an ontology gap warranting a new-term request.
  That was wrong — HP:0005165 "Shortened PR interval" exists, is inside the
  PhenotypeTerm enum root, and is already used in Pompe_Disease.yaml. The
  finding is now curated as a phenotype and no NTR is warranted.

name: Taurine transporter deficiency
creation_date: "2026-08-19T00:00:00Z"
category: Mendelian
synonyms:
- TauT deficiency
- SLC6A6 deficiency
- Hypotaurinemic retinal degeneration and cardiomyopathy
- SLC6A6-related Leber congenital amaurosis / early-onset retinal dystrophy
description: >-
  Taurine transporter deficiency is an autosomal recessive inborn error of amino
  acid transport caused by biallelic variants in SLC6A6, which encodes TauT, the
  ubiquitously expressed sodium- and chloride-dependent taurine transporter.
  Because most tissues have only limited capacity to synthesize taurine, they
  depend on TauT-mediated uptake against a steep concentration gradient to
  maintain a large intracellular taurine pool. Loss of that uptake produces
  profound systemic hypotaurinemia and depletes intracellular taurine in the
  tissues that need it most.

  The consistent and earliest clinical consequence is retinal: reported patients
  present in infancy or early childhood with Leber congenital amaurosis or
  early-onset retinal dystrophy, nystagmus, and severely depressed scotopic and
  photopic electroretinograms, progressing to panretinal degeneration. A
  cardiomyopathy arm is established but not obligate — the first reported
  consanguineous family had childhood cardiomyopathy, while a later multicenter
  series found structurally normal hearts (with short PR intervals) despite
  complete loss of taurine transport. Skeletal muscle, brain, and hearing
  involvement are prominent in the Slc6a6-null mouse but have so far been
  subclinical in humans.

  The disorder is mechanistically notable as a treatable transportopathy: oral
  taurine supplementation restores normal blood taurine levels, and in the index
  family corrected the cardiomyopathy and arrested the retinal degeneration over
  24 months. It is cited as a template for high-dose substrate supplementation in
  Mendelian transporter disease generally.

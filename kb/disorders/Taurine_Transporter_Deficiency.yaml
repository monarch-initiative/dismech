    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The importance of taurine in retinal development, photoreceptors maintenance, and cellular homeostasis was recognized as early as the 1970s when studies involving taurine-deficient cats demonstrated progressive retinal degeneration."
    explanation: Establishes the retinal taurine requirement and that its absence alone causes progressive degeneration.
  - reference: PMID:11772953
    reference_title: "Disruption of the taurine transporter gene (taut) leads to retinal degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In particular, the retinal involvement identifies the taurine transporter as an important factor for the development and maintenance of normal retinal functions and morphology."
    explanation: The mouse null shows the transporter itself is required for retinal development and maintenance.

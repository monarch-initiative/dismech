- name: Myocardial Taurine Depletion and Energy Starvation
  biological_scale: CELLULAR
  description: >-
    Taurine is the most abundant free amino acid in cardiac muscle and one of its
    major functions there is regulation of the respiratory chain. In the
    taurine-deficient heart glycolysis rises while glucose oxidation falls,
    pyruvate dehydrogenase flux is reduced by a raised NADH/NAD+ ratio, and
    long-chain fatty acid uptake into mitochondria is diminished; ATP production
    falls and the phosphocreatine/ATP ratio declines. The cardiomyocyte is
    therefore energy-starved before it is structurally abnormal. This node's
    evidence is rodent; the human counterpart is the taurine-responsive
    cardiomyopathy of the index family.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell

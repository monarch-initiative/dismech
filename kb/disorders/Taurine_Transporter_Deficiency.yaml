treatments:
- name: Oral taurine supplementation
  description: >-
    High-dose oral taurine (100 mg/kg/day in the reported regimen) raises
    extracellular taurine sufficiently to restore normal blood taurine levels
    despite the transport defect. In the index consanguineous family, 24 months
    of supplementation corrected the cardiomyopathy in both affected siblings
    and, in the younger child, arrested the retinal degeneration with clinical
    improvement in vision. It is the only disease-modifying therapy reported and
    is explicitly proposed as a template for substrate supplementation in
    Mendelian transporter disease more broadly. Outside the index family it
    remains investigational.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral taurine supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation

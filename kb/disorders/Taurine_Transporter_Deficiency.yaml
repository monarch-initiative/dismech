mechanistic_hypotheses:
- hypothesis_group_id: osmotic_cytoprotection_model
  hypothesis_label: Osmolyte and Cytoprotection Model
  status: CANONICAL
  description: >-
    Taurine acts as an organic osmolyte and cytoprotectant supporting cell volume
    homeostasis, protein stabilization, antioxidation, and calcium handling. Under
    this model the disease is the sum of what happens to taurine-dependent
    tissues when that support is withdrawn: outer-retinal oxidative and metabolic
    stress, cardiomyocyte volume loss and atrophy, and reduced skeletal-muscle
    cell volume. It is the canonical framing because it accounts for the tissue
    distribution of disease and for the reversal of the cardiac phenotype on
    substrate replacement.
  evidence:
  - reference: PMID:11772953
    reference_title: "Disruption of the taurine transporter gene (taut) leads to retinal degeneration in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taurine is involved in cell volume homeostasis, antioxidant defense, protein stabilization, and stress responses."
    explanation: States the cytoprotective functions on which the model rests.
  - reference: PMID:18407290
    reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data suggest that multiple actions of taurine, including osmoregulation, regulation of mitochondrial protein expression and inhibition of apoptosis, collectively ensure proper maintenance of cardiac and skeletal muscular structure and function."
    explanation: Attributes the cardiac and muscular phenotypes to taurine's osmoregulatory and cytoprotective actions.
  notes: >-
    Retained as CANONICAL but not sufficient on its own: it does not explain why
    the retina fails first and most severely, nor why cardiac involvement is
    present in some pedigrees and absent in others despite comparable loss of
    transport.
- hypothesis_group_id: mitochondrial_translation_model
  hypothesis_label: Mitochondrial Taurine Import and Translation Model
  status: EMERGING
  description: >-
    A mitochondrial pool of SLC6A6 supplies taurine for mitochondrial tRNA
    modification, and its loss abrogates mitochondrial translation. Under this
    model taurine transporter deficiency is partly a disorder of mitochondrial
    protein synthesis, which would predict a bioenergetic phenotype in
    high-demand post-mitotic tissue — photoreceptors and cardiomyocytes are the
    two most oxidative-dependent tissues affected. The supporting work was done
    in cancer cell lines with SLC6A6 loss, not in patient material, so this is an
    emerging rather than established arm of the disease model.
  evidence:
  - reference: PMID:41652173
    reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taurine plays a crucial role in mitochondrial translation."
    explanation: States the mitochondrial-translation dependence on taurine underlying this model.
  - reference: PMID:41652173
    reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, these findings suggest that SLC6A6 is a mitochondrial taurine transporter and an exploitable metabolic dependency in cancer."
    explanation: Confirms the authors' own framing of the mitochondrial transport function and its experimental context.
  notes: >-
    Deliberately not asserted as an explanation of the human disease. If it is
    confirmed in patient tissue it has a direct therapeutic implication, because
    the same study reports that exogenous taurine did not substitute for the
    transporter in the systems tested, whereas oral taurine supplementation does
    benefit patients — a tension that is itself worth resolving.

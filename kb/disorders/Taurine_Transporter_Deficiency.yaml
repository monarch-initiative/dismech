    term:
      id: GO:0005739
      label: mitochondrion
  chemical_entities:
  - preferred_term: taurine
    term:
      id: CHEBI:15891
      label: taurine
    modifier: DECREASED
  evidence:
  - reference: PMID:41652173
    reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SLC6A6 deficiency specifically reduces mitochondrial taurine abundance and abrogates mitochondrial translation and cell proliferation."
    explanation: Directly links loss of the transporter to mitochondrial taurine depletion and translation failure.
  - reference: PMID:41652173
    reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here we show that SLC6A6, but not exogenous taurine, is essential for mitochondrial metabolism and cancer cell growth."
    explanation: >-
      Supports the transporter-specific requirement, but only in cancer cell
      lines — hence PARTIAL rather than SUPPORT for the inherited disease.
  downstream:
  - target: Myocardial Taurine Depletion and Energy Starvation
    description: >-
      Failure of mitochondrial translation would compromise respiratory-chain
      subunit synthesis, converging on the impaired respiratory-chain function
      and reduced ATP output already documented in the taurine-deficient heart.
      Hypothesized rather than established in this disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mitochondrial_translation_model
    evidence:
    - reference: PMID:26475290
      reference_title: "Impaired energy metabolism of the taurine-deficient heart."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "One of the major functions of taurine in the heart is the regulation of the respiratory chain."
      explanation: Independent evidence that taurine deficiency in the heart acts through the respiratory chain, the output of mitochondrial translation.
- name: Retinal Taurine Depletion and Photoreceptor Stress
  biological_scale: CELLULAR
  description: >-
    Photoreceptors and retinal pigment epithelium depend on imported taurine for
    viability, calcium signaling, and antioxidant defense; the requirement is old
    knowledge from taurine-deficient cats, which develop progressive retinal
    degeneration. In taurine transporter deficiency this dependency is unmet from
    birth, leaving the outer retina under chronic metabolic and oxidative stress.
  conforms_to: "photoreceptor_degeneration#Photoreceptor Metabolic and Oxidative Stress"

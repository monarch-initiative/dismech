inheritance:
- name: Autosomal recessive
  description: >-
    All reported patients are homozygous for SLC6A6 variants, with heterozygous
    parents and relatives unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis identified homozygous pathogenic SLC6A6 variants in all affected individuals, while unaffected relatives were heterozygous carriers."
    explanation: Homozygosity in all affected individuals with unaffected heterozygous relatives establishes recessive inheritance.
genetic:
- name: SLC6A6
  gene_term:
    preferred_term: SLC6A6
    term:
      id: hgnc:11052
      label: SLC6A6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SLC6A6 encodes TauT, the sodium- and chloride-dependent taurine transporter.
    Reported disease alleles span missense variants that abolish or severely
    reduce transport (p.Ala78Glu, p.Thr249Ile, p.Ala294Thr), a hypomorphic
    missense variant retaining roughly 15% of normal transport (p.Gly399Val),
    and truncating lesions (p.Thr113Ter, deletion of exon 11). All reported
    patients are homozygous, and every characterized allele acts by loss of
    transport function.
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The human solute carrier family 6 member 6 gene (SLC6A6) encodes a ubiquitously expressed taurine transporter (TauT) that regulates the intracellular taurine content in many tissues, including brain, retina, heart, kidney, liver, and skeletal muscles."
    explanation: Identifies SLC6A6 as the gene encoding the taurine transporter and names the tissues that depend on it.
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Families 1 and 2 carried missense variants p.(Thr249Ile) and p.(Ala294Thr), while families 3 and 4 carried truncating variants-a deletion of exon 11 and p.(Thr113Ter), respectively."
    explanation: Documents the allelic spectrum, including both missense and truncating disease alleles.
  - reference: PMID:31903486
    reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a consanguineous Pakistani family with two affected individuals, a homozygous variant Gly399Val in the eighth transmembrane domain of the taurine transporter SLC6A6 was identified resulting in a hypomorph transporting capacity of ~15% compared with normal."
    explanation: Establishes a hypomorphic allele with quantified residual transport capacity.
  variants:
  - name: SLC6A6 p.Gly399Val
    description: >-
      Homozygous missense variant in the eighth transmembrane domain, retaining
      approximately 15% of normal taurine transport. Carried by the index
      consanguineous Pakistani family with retinal degeneration and
      taurine-responsive cardiomyopathy.
    evidence:
    - reference: PMID:31903486
      reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three-dimensional modeling of this variant has indicated that it likely causes displacement of the Tyr138 (TM3) side chain, important for transport of taurine."
      explanation: Gives the structural basis for the partial loss of transport by this allele.
  - name: SLC6A6 p.Ala78Glu
    description: >-
      Homozygous missense variant in the first reported human pedigree, reducing
      3H-taurine uptake in patient peripheral blood mononuclear cells by 95%
      while the protein still reaches the plasma membrane.
    evidence:
    - reference: PMID:31345061
      reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "TAUTp.A78E still localized in the plasma membrane but is predicted to impact structural stabilization."
      explanation: Distinguishes a transport-function defect from a trafficking defect for this allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. As of the 2026 multicenter series, human SLC6A6 deficiency had
    been reported in a handful of pedigrees: the original two-brother family, one
    consanguineous Pakistani family, and seven affected individuals from four
    further unrelated families recruited in Pakistan, Italy, the US and France.
    No population frequency estimate exists.
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This was a retrospective, multicenter observational study conducted between June 2019 and March 2025, involving 7 affected and 10 unaffected individuals from 4 unrelated families recruited in Pakistan, Italy, the US, and France."
    explanation: Gives the size of the largest reported cohort, from which the case-count basis for ultra-rarity follows.
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a direct link between SLC6A6 and human diseases has been established only recently, following the identification of 2 unrelated pedigrees with LCA/EORD and biallelic recessive variants in this gene."
    explanation: Confirms only two pedigrees were known before this series, supporting the case-in-literature framing.
progression:
- phase: Congenital to early-childhood retinal presentation
  age_range: Birth to 5 years
  notes: >-
    Visual impairment and nystagmus may be present from birth (Leber congenital
    amaurosis pattern) or be detected after early infancy but before age 5
    (early-onset retinal dystrophy pattern), with gradual deterioration of
    visual function thereafter.
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four of the children had visual impairment and nystagmus since birth, with gradually deteriorating visual function over the years."
    explanation: Documents congenital onset and progressive deterioration in the largest family reported.
- phase: Childhood progression with variable cardiac involvement
  age_range: Childhood
  notes: >-
    In the index consanguineous family the retinal degeneration was rapidly
    progressive during childhood and accompanied by cardiomyopathy. Cardiac
    involvement is not obligate: in the later multicenter series cardiac
    structure was normal in all patients, with only conduction findings.
  evidence:
  - reference: PMID:31903486
    reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals presented with rapidly progressive childhood retinal degeneration, cardiomyopathy and almost undetectable plasma taurine levels."
    explanation: Describes the rapidly progressive childhood course with cardiomyopathy in the index family.
pathophysiology:
- name: SLC6A6 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC6A6 variants abolish or severely reduce the activity of TauT,
    the sodium- and chloride-dependent plasma-membrane taurine transporter. The
    functional consequence has been measured directly in patient material:
    3H-taurine uptake was reduced by 95% in peripheral blood mononuclear cells
    carrying p.Ala78Glu, the p.Gly399Val allele retains roughly 15% of normal
    capacity, and p.Thr249Ile and p.Ala294Thr abolish transport in both HEK-293
    cells and patient fibroblasts. Loss of transport is not necessarily loss of
    the protein from the membrane — p.Ala78Glu still localizes to the plasma
    membrane, so the lesion is transport-functional rather than purely
    trafficking.
  genes:
  - preferred_term: SLC6A6
    term:
      id: hgnc:11052
      label: SLC6A6
  molecular_functions:
  - preferred_term: taurine transmembrane transporter activity
    term:
      id: GO:0005368
      label: taurine transmembrane transporter activity
    modifier: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  evidence:
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3H-taurine uptake by peripheral blood mononuclear cells was reduced by 95%, and taurine levels were severely reduced in plasma, skeletal muscle, and brain."
    explanation: Quantifies loss of taurine transport in patient cells as the proximal molecular defect.
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TAUTp.A78E still localized in the plasma membrane but is predicted to impact structural stabilization."
    explanation: Shows the defect is in transport function rather than membrane delivery for this allele.
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies demonstrated that both missense variants are associated with complete loss of taurine transport in HEK-293 cells and patient-derived fibroblasts."
    explanation: Independent functional confirmation that disease missense alleles abolish taurine transport.
  downstream:
  - target: Systemic Taurine Depletion
    description: >-
      Loss of TauT-mediated uptake removes the only route by which most tissues
      can accumulate taurine against its concentration gradient, so circulating
      and tissue taurine fall.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31903486
      reference_title: "Taurine treatment of retinal degeneration and cardiomyopathy in a consanguineous family with SLC6A6 taurine transporter deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The affected individuals presented with rapidly progressive childhood retinal degeneration, cardiomyopathy and almost undetectable plasma taurine levels."
      explanation: Links the transporter defect directly to near-absent circulating taurine in affected individuals.
  - target: Impaired Mitochondrial Taurine Import and mt-tRNA Modification
    description: >-
      Beyond the plasma membrane, SLC6A6 has been shown to localize to
      mitochondria and to supply the taurine used for mitochondrial tRNA
      modification, so loss of the transporter would also deplete the
      mitochondrial taurine pool. This arm is demonstrated in cancer cell lines,
      not in patient tissue.
    causal_link_type: DIRECT
    hypothesis_groups:
    - mitochondrial_translation_model
    evidence:
    - reference: PMID:41652173
      reference_title: "SLC6A6 imports taurine into mitochondria to sustain mitochondrial translation and tumour growth."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We discover that SLC6A6 also localizes to mitochondria and imports taurine for mitochondrial transfer RNA modifications."
      explanation: Establishes a mitochondrial localization and mitochondrial-taurine-import function for the same transporter.
- name: Systemic Taurine Depletion
  biological_scale: ORGANISM
  description: >-
    Failure of TauT-mediated uptake produces profound hypotaurinemia together
    with depletion of the tissue taurine pool. Patient plasma taurine is reduced
    relative both to heterozygous carriers and to healthy controls, and taurine
    is severely reduced in skeletal muscle and brain as well as plasma. This is
    the systemic state from which every downstream tissue phenotype follows, and
    it is the node that oral taurine supplementation acts on.
  chemical_entities:
  - preferred_term: taurine
    term:
      id: CHEBI:15891
      label: taurine
    modifier: DECREASED
  biological_processes:
  - preferred_term: taurine transmembrane transport
    term:
      id: GO:0015734
      label: taurine transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:41343195
    reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, irrespective of the variants considered, plasma taurine levels in affected individuals were reduced compared with heterozygous carriers"
    explanation: Quantitative confirmation of hypotaurinemia across all reported genotypes.
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "taurine levels were severely reduced in plasma, skeletal muscle, and brain"
    explanation: Shows the depletion is systemic and extends into tissue compartments, not just plasma.
  downstream:
  - target: Retinal Taurine Depletion and Photoreceptor Stress
    description: >-
      The retina is the tissue in which taurine depletion becomes clinically
      manifest first; taurine supports photoreceptor viability and outer-retinal
      homeostasis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41343195
      reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequent research has shown that cellular intake of taurine supports photoreceptors viability, regulates intracellular calcium signaling, and acts as an antioxidant."
      explanation: States the cellular dependence of photoreceptors on taurine uptake that the depletion removes.
  - target: Myocardial Taurine Depletion and Energy Starvation
    description: >-
      Cardiac and skeletal muscle hold the largest free taurine pools of any
      tissue but have limited biosynthetic capacity, so they are among the first
      to be depleted when uptake fails.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18407290
      reference_title: "Taurine depletion caused by knocking out the taurine transporter gene leads to cardiomyopathy with cardiac atrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated taurine transporter- (TauT-) knockout mice (TauTKO), which exhibited a deficiency in myocardial and skeletal muscle taurine content compared with their wild-type littermates."
      explanation: Shows that loss of the transporter depletes the myocardial taurine pool specifically.
  - target: Cellular Oxidative Stress and RNA Oxidation
    description: >-
      Taurine is an intracellular antioxidant and cytoprotectant; its loss
      raises oxidative burden, measurable systemically before any organ
      dysfunction is clinically apparent.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31345061
      reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "significantly increased urinary excretion of 8-oxo-7,8-dihydroguanosine indicated generally enhanced (yet clinically unapparent) oxidative stress and RNA oxidation, warranting continuous broad surveillance"
      explanation: Measured oxidative-stress and RNA-oxidation marker elevation in patients with taurine depletion.
  - target: Skeletal Muscle Taurine Depletion
    description: >-
      Skeletal muscle taurine is severely reduced in patients, and in the mouse
      null this translates into decreased cell volume, structural defects, and
      reduced exercise capacity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31345061
      reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "taurine levels were severely reduced in plasma, skeletal muscle, and brain"
      explanation: Documents measured skeletal-muscle taurine depletion in a patient.
- name: Cellular Oxidative Stress and RNA Oxidation
  biological_scale: CELLULAR
  description: >-
    Taurine contributes to cell volume homeostasis, protein stabilization,
    cytoprotection and antioxidation, so depletion leaves cells with reduced
    antioxidant buffering. In the two reported brothers this was detectable as
    significantly increased urinary 8-oxo-7,8-dihydroguanosine — an RNA-oxidation
    marker — while extraocular organ function was still clinically normal,
    making it the earliest measurable systemic consequence of the transport
    defect.
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extraocular dysfunctions were not yet detected, but significantly increased urinary excretion of 8-oxo-7,8-dihydroguanosine indicated generally enhanced (yet clinically unapparent) oxidative stress and RNA oxidation, warranting continuous broad surveillance"
    explanation: Reports the measured RNA-oxidation marker itself — increased urinary 8-oxo-7,8-dihydroguanosine in the affected brothers — and places it upstream of any clinically apparent extraocular disease.
  - reference: PMID:31345061
    reference_title: "Biallelic mutation of human SLC6A6 encoding the taurine transporter TAUT is linked to early retinal degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Compatible with taurine's indispensability for cell volume homeostasis, protein stabilization, cytoprotection, antioxidation, and immuno- and neuromodulation, mice develop multisystemic dysfunctions (hearing loss; liver fibrosis; and behavioral, heart, and skeletal muscle abnormalities) later on."
    explanation: States the cytoprotective and antioxidant roles of taurine whose loss produces the oxidative phenotype. Tagged MODEL_ORGANISM because the main clause reports the multisystem consequences in mice, not in the patients — the human counterparts of those findings are deliberately not curated here (see notes).
  downstream:
  - target: Retinal Taurine Depletion and Photoreceptor Stress
    description: >-
      Oxidative injury is the shared final stress on photoreceptors in inherited
      retinal degeneration and is the route by which loss of taurine's
      antioxidant function reaches the outer retina.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Loss of taurine-dependent antioxidant buffering in outer-retinal cells.
    - Oxidative damage to photoreceptor lipids, proteins and RNA.
    evidence:
    - reference: PMID:41343195
      reference_title: "Early-Onset Retinopathy in Patients With Variants in SLC6A6 Leading to Impaired Taurine Transport."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subsequent research has shown that cellular intake of taurine supports photoreceptors viability, regulates intracellular calcium signaling, and acts as an antioxidant."
      explanation: Names the antioxidant role of imported taurine in photoreceptors.
- name: Impaired Mitochondrial Taurine Import and mt-tRNA Modification
  biological_scale: MOLECULAR
  description: >-
    A second, mitochondrial pool of SLC6A6 imports taurine into mitochondria,
    where it is used for taurine-dependent modification of mitochondrial tRNAs.
    Loss of the transporter reduces mitochondrial taurine abundance specifically
    and abrogates mitochondrial translation. This is an emerging arm: it was
    established in cancer cell lines as a metabolic dependency, and it has not
    been demonstrated in tissue from patients with SLC6A6 deficiency. It is
    curated because, if it holds in patient tissue, it would place taurine
    transporter deficiency partly within mitochondrial-translation disease and
    would complicate the therapeutic logic — the same paper reports that
    exogenous taurine does not substitute for the transporter in the cell
    systems tested.
  biological_processes:
  - preferred_term: tRNA wobble uridine modification
    term:
      id: GO:0002098
      label: tRNA wobble uridine modification
    modifier: DECREASED
  cellular_components:

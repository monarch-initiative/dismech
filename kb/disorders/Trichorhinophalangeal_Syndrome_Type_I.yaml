animal_models:
- name: Trps1 GATA-domain deletion mouse
  species: Mouse
  genotype: Trps1 delta-GT (deletion of the GATA zinc finger), heterozygous and homozygous
  publication: PMID:18424451
  description: >-
    Heterozygotes show facial anomalies, kyphoscoliosis and bone deficits;
    homozygotes lack vibrissae and die of neonatal respiratory failure.
    Growth plates show delayed chondrocyte differentiation with accelerated
    perichondrial mineralisation, rescued by Runx2 heterozygosity.
  modeled_mechanisms:
  - target: Uncoupled Chondrocyte Differentiation and Perichondrial Mineralisation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The growth-plate defect behind the human skeletal phenotype.
    limitations: >-
      Most growth-plate analyses use mutants more severe than the human
      heterozygous state.
    evidence:
    - reference: PMID:18424451
      reference_title: "Uncoupling of chondrocyte differentiation and perichondrial mineralization underlies the skeletal dysplasia in tricho-rhino-phalangeal syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These abnormalities were accompanied by increased Runx2 and Ihh expression and increased Indian hedgehog signaling."
      explanation: >-
        Molecular readout of the growth-plate defect.
  - target: Disrupted Hair Follicle Morphogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Fewer pelage follicles and absent vibrissae.
    limitations: >-
      Vibrissae have no human counterpart; the pelage reduction is in
      homozygotes.
    evidence:
    - reference: PMID:22115758
      reference_title: "Trps1 activates a network of secreted Wnt inhibitors and transcription factors crucial to vibrissa follicle morphogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice in which the GATA domain of Trps1 has been deleted (Trps1(Δgt/Δgt)) have a reduced number of pelage follicles and lack vibrissae follicles postnatally."
      explanation: >-
        Follicle phenotype in the mutant.
- name: Trps1 intronic regulatory-element deletion mouse
  species: Mouse
  genotype: Trps1 delta-int/delta-int (hypomorph)
  publication: PMID:38899779
  description: >-
    A viable hypomorph that reproduces postnatal growth retardation and hip
    dysplasia, avoiding the early lethality of knockouts.
  modeled_mechanisms:
  - target: Abnormal Hip Joint Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Acetabular dysplasia and patellar dislocation.
    evidence:
    - reference: PMID:38899779
      reference_title: "Deletion of Trps1 regulatory elements recapitulates postnatal hip joint abnormalities and growth retardation of Trichorhinophalangeal syndrome in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our novel Trps1 hypomorphic strain recapitulates many postnatal pathologies observed in human TRPS patients, thus positioning this strain as a useful animal model to study postnatal TRPS pathogenesis."
      explanation: >-
        The model reproduces postnatal TRPS pathology.

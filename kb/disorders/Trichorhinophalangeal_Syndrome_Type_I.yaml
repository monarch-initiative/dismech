disease_term:
  preferred_term: trichorhinophalangeal syndrome type I
  term:
    id: MONDO:0008596
    label: trichorhinophalangeal syndrome type I
synonyms:
- TRPS I
- tricho-rhino-phalangeal syndrome type I
- trichorhinophalangeal syndrome type III
- TRPS III
- Sugio-Kajii syndrome
description: >-
  Trichorhinophalangeal syndrome type I is an autosomal dominant skeletal and
  ectodermal dysplasia caused by heterozygous pathogenic variants in TRPS1,
  which encodes an atypical GATA-type zinc-finger transcription factor that
  mainly represses its targets. MONDO includes the more severe type III form,
  caused by missense variants in the GATA DNA-binding zinc finger, in this
  term. Patients have fine, sparse, slow-growing scalp hair, eyebrows that are
  thick medially and thin laterally, a bulbous nose with underdeveloped alae,
  a long philtrum, a thin upper lip and protruding ears, together with
  brachydactyly with cone-shaped epiphyses of the phalanges, short metacarpals,
  short stature, hip dysplasia and, as the main lifelong morbidity, joint
  problems progressing to premature osteoarthritis. Osteopenia is common and
  dystrophic nails and supernumerary teeth occur. In mouse models, loss of
  TRPS1 repression of Runx2 and of the Ihh/PTHrP loop uncouples chondrocyte
  differentiation from perichondrial mineralisation in the growth plate, and
  disrupted Wnt-inhibitor and Sox9 regulation in the hair follicle explains
  the sparse hair. Intelligence is normal and life expectancy is not reduced.
  Management is supportive. The contiguous-gene TRPS type II (Langer-Giedion
  syndrome), which also deletes EXT1 and RAD21, is curated as a subtype of
  Hereditary_Multiple_Osteochondromas.

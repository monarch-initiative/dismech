      label: chondrocyte differentiation
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:18424451
    reference_title: "Uncoupling of chondrocyte differentiation and perichondrial mineralization underlies the skeletal dysplasia in tricho-rhino-phalangeal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analyses of growth plates demonstrated delayed chondrocyte differentiation and accelerated mineralization of perichondrium in Trps1 mutant mice."
    explanation: >-
      The core growth-plate defect.
  - reference: PMID:18424451
    reference_title: "Uncoupling of chondrocyte differentiation and perichondrial mineralization underlies the skeletal dysplasia in tricho-rhino-phalangeal syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, generation of Trps1(DeltaGT/+);Runx2(+/-) double heterozygous mice rescued the opposite growth plate phenotypes of single mutants, demonstrating the genetic interaction between Trps1 and Runx2 transcription factors."
    explanation: >-
      Genetic rescue confirms that derepressed Runx2 drives the defect.
  - reference: PMID:18456591
    reference_title: "Trps1 deficiency enlarges the proliferative zone of growth plate cartilage by upregulation of Pthrp."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, promoter analysis combined with the chromatin immunoprecipitation (ChIP) assay demonstrated that direct binding of Trps1 to the PTHrP promoter suppressed the transcription of PTHrP."
    explanation: >-
      A second direct growth-plate target.

- name: Uncoupled Chondrocyte Differentiation and Perichondrial Mineralisation
  biological_scale: TISSUE
  description: >-
    In Trps1 mutant growth plates, chondrocyte differentiation is delayed
    while the perichondrium mineralises early, with increased Runx2 and Ihh
    signalling and expanded PTHrP expression that enlarges the proliferative
    zone. Halving Runx2 dosage rescues the growth-plate phenotype. This
    dysregulated endochondral ossification is the proposed basis of the
    cone-shaped epiphyses, short phalanges and metacarpals, short stature and
    hip malformation.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: ABNORMAL

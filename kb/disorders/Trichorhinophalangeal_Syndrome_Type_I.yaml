    reference_title: "Deletion of the GATA domain of TRPS1 causes an absence of facial hair and provides new insights into the bone disorder in inherited tricho-rhino-phalangeal syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report that heterozygous mice with deletions of the TRPS1 GATA domain (TRPS1(+/Deltagt)) display facial anomalies that overlap with findings for TRPS, whereas TRPS1(Deltagt/Deltagt) mice additionally reveal a complete absence of vibrissae."
    explanation: >-
      Facial anomalies in heterozygous mutant mice.
  - reference: PMID:12446778
    reference_title: "Deletion of the GATA domain of TRPS1 causes an absence of facial hair and provides new insights into the bone disorder in inherited tricho-rhino-phalangeal syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings directly implicate the GATA type zinc finger of TRPS1 in regulation of bone and hair development and suggest that skeletal abnormalities emphasized in descriptions of TRPS are only the extreme manifestations of a generalized bone dysplasia."
    explanation: >-
      Generalised bone dysplasia in the mouse model.

has_subtypes:
- name: TRPS I
  display_name: Classic TRPS I (truncating or deletion alleles)
  description: >-
    The usual form, caused by nonsense, frameshift or whole-gene deletion
    alleles that act by haploinsufficiency.
  evidence:
  - reference: PMID:10615131
    reference_title: "Mutations in a new gene, encoding a zinc-finger protein, cause tricho-rhino-phalangeal syndrome type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that haploinsufficiency for this putative transcription factor causes TRPS I."
    explanation: >-
      Haploinsufficiency as the mechanism of classic TRPS I.
- name: TRPS III
  display_name: TRPS III (GATA zinc-finger missense alleles)
  description: >-
    The severe end of the spectrum, with severe brachydactyly from short
    metacarpals and severe short stature, mostly caused by missense variants
    in the GATA DNA-binding zinc finger (exons 6 and 7).
  evidence:
  - reference: PMID:11112658
    reference_title: "Genotypic and phenotypic spectrum in tricho-rhino-phalangeal syndrome types I and III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data indicate that TRPS III is at the severe end of the TRPS spectrum and that it is most often caused by a specific class of mutations in the TRPS1 gene."
    explanation: >-
      TRPS III is the severe, missense-driven end of one spectrum.
  - reference: PMID:42361898
    reference_title: "Clinical and genetic spectrum of trichorhinophalangeal syndrome type I/III in 20 children of Korean origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants in exon 6 were consistently associated with severe brachydactyly, whereas the overall stature showed no clear correlation with genotype."
    explanation: >-
      Genotype-phenotype correlation in a Korean cohort.

- name: Loss of TRPS1 GATA-Dependent Transcriptional Repression
  biological_scale: MOLECULAR
  description: >-
    TRPS1 binds GATA sequences through its single GATA zinc finger and
    represses transcription through an Ikaros-like C-terminal domain. Its
    targets include Runx2, the PTHrP gene, Sox9 and Wnt-pathway genes; in the
    hair follicle it can also activate targets.
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity
    modifier: DECREASED
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:11285235
    reference_title: "Transcriptional repression and developmental functions of the atypical vertebrate GATA protein TRPS1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "TRPS1 is a nuclear protein that binds GATA sequences but fails to transactivate a GATA-dependent reporter. Instead, TRPS1 potently and specifically represses transcriptional activation mediated by other GATA factors."
    explanation: >-
      TRPS1 is a GATA-binding repressor.
  - reference: PMID:36990068
    reference_title: "Molecular Genetic Analysis and Growth Hormone Treatment in a Three-Generation Chinese Family with Tricho-Rhino-Phalangeal Syndrome I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional studies showed that the TRPS1 variant did not affect the cellular localization and the expression of TRPS1, but the transcriptional repression effect of the TRPS1 on the RUNX2 and STAT3 was disturbed."
    explanation: >-
      A patient variant impairs repression of RUNX2 and STAT3.

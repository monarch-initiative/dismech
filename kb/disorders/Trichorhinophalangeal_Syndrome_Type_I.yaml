- name: Craniofacial and Axial Skeletal Dysplasia
  biological_scale: TISSUE
  description: >-
    Mice heterozygous for deletion of the TRPS1 GATA domain show facial
    anomalies resembling the human syndrome and develop kyphoscoliosis and
    cortical and trabecular bone deficits, suggesting a generalised bone
    dysplasia beyond the hands and hips.
  evidence:

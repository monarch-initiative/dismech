    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A dominant disease locus associated with cardiac malformations and
      atrioventricular conduction abnormalities was mapped to chromosome 5q35
    explanation: >-
      Evidences the developmental route to arrhythmia specifically: one locus producing
      both the structural malformation and the conduction abnormality.
- category: Cardiovascular
  name: Sudden cardiac death
  description: >-
    The dominant mode of late mortality in congenital heart disease, and the endpoint
    that makes arrhythmia surveillance in adult survivors consequential rather than
    routine. Risk is markedly elevated over the general population, concentrated in
    complex lesions (tetralogy of Fallot, transposition of the great arteries, cyanotic
    heart disease, Ebstein anomaly, Fontan circulation), and is greater in adults than
    in children - the opposite of the intuition that CHD is a paediatric problem
    resolved by neonatal surgery.
  phenotype_term:
    preferred_term: Sudden cardiac death
    term:
      id: HP:0001645
      label: Sudden cardiac death
  evidence:
  - reference: PMID:39768857
    reference_title: "Cardiovascular Diseases in Public Health: Chromosomal Abnormalities in Congenital Heart Disease Causing Sudden Cardiac Death in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in CHD patients, the rates are 20-30 times higher than those in the
      general population
    explanation: >-
      Quantifies the excess sudden-cardiac-death risk in CHD relative to the general
      population.
  - reference: PMID:39768857
    reference_title: "Cardiovascular Diseases in Public Health: Chromosomal Abnormalities in Congenital Heart Disease Causing Sudden Cardiac Death in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some patients with tetralogy of Fallot, transposition of the great arteries,
      cyanotic heart disease, Ebstein anomaly, and Fontan circulation are at an
      increased risk for SCD.
    explanation: >-
      Identifies the lesion classes carrying the highest sudden-cardiac-death risk,
      which map onto this entry's CTD, RVOTO and single-ventricle-palliation content.
  - reference: PMID:39768857
    reference_title: "Cardiovascular Diseases in Public Health: Chromosomal Abnormalities in Congenital Heart Disease Causing Sudden Cardiac Death in Children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of SCD is greater in adults than in children
    explanation: >-
      Supports this entry's framing of CHD as a lifelong condition whose burden shifts
      into adulthood rather than one resolved by neonatal surgery.
- category: Growth
  name: Failure to thrive
  description: >-
    Poor weight gain from the combination of increased metabolic demand, feeding
    difficulty and hypoxaemia; a leading indication for earlier surgical repair.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
- category: Neurologic
  name: Neurodevelopmental abnormality
  description: >-
    Cognitive, motor, language and executive-function impairment, common after critical
    neonatal CHD. This entry models it as partly a shared-genetic phenomenon rather than
    purely a consequence of hypoxaemia and surgery: the de novo variants that cause
    severe CHD fall in genes highly expressed in the developing brain as well as the
    developing heart.
  phenotype_term:
    preferred_term: Neurodevelopmental abnormality
    term:
      id: HP:0012759
      label: Neurodevelopmental abnormality
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings reveal shared genetic contributions to CHD, NDD, and CA and
      provide opportunities for improved prognostic assessment and early therapeutic
      intervention in CHD patients.
    explanation: >-
      Supports a shared genetic, rather than purely acquired, contribution to
      neurodevelopmental disability in CHD.
- category: Congenital anomaly
  name: Extracardiac congenital anomaly
  description: >-
    Non-cardiac structural anomaly co-occurring with CHD, at roughly twice the
    background newborn rate. Mechanistically expected from this entry's model, because
    the cardiac neural crest and the chromatin-modifying genes that dominate the CHD de
    novo burden are shared with craniofacial, limb and other developmental programmes.
  phenotype_term:
    preferred_term: Extracardiac congenital anomaly
  notes: >-
    NEEDS TERM / NTR CANDIDATE. Deliberately left unbound. The claim is an
    extracardiac structural or functional anomaly of ANY organ system, and the cited
    evidence is likewise system-agnostic. HPO was searched (2026-08-19) for a
    system-agnostic congenital-anomaly class: the only "congenital malformation of"
    terms are cardiac (HP:0011603, HP:0011723, HP:0045017), there is no "multiple
    congenital anomalies" class, and every "Abnormality of the X system" term names a
    single system. An earlier revision bound this to HP:0000924 (Abnormality of the
    skeletal system), which silently narrowed a whole-organism claim to the skeleton
    and was removed on review - no term beats a bad term. An HPO new-term request for
    a system-agnostic extracardiac/multiple congenital anomaly class would be the
    right resolution.
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extra-cardiac congenital anomalies (CA, structural or functional anomalies that
      arise in utero) occur in approximately 13% of newborns with congenital heart
      disease (CHD), including 2% with a genetic syndrome, almost twice the prevalence
      observed in infants without CHD
    explanation: Quantifies the excess of extracardiac anomalies among newborns with CHD.

inheritance:
- name: Multifactorial inheritance
  description: >-
    Most isolated CHD is not Mendelian. The prevailing model is multifactorial: common
    variation, rare inherited variants of modest effect, de novo variants, and maternal
    environmental exposures combine to cross a developmental threshold. Recurrence risk
    after an isolated non-syndromic case is empirically a few percent, and a defined
    Mendelian or chromosomal diagnosis replaces that empiric figure with disorder-specific
    counselling. A genetic cause remains unidentified in a majority of patients.
  inheritance_term:
    preferred_term: Multifactorial inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  evidence:
  - reference: PMID:39337901
    reference_title: "The Genetic Architecture of Congenital Heart Disease in Neonatal Intensive Care Unit Patients-The Experience of University Medical Centre, Ljubljana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The etiology of CHD is multifactorial and involves interplay between genetic and
      environmental factors.
    explanation: States the multifactorial inheritance model this block records.
  - reference: PMID:39337901
    reference_title: "The Genetic Architecture of Congenital Heart Disease in Neonatal Intensive Care Unit Patients-The Experience of University Medical Centre, Ljubljana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      however, the cause of the disease remains unexplained in up to 60% of CHD patients
    explanation: >-
      Quantifies the substantial unexplained fraction that motivates the multifactorial
      rather than Mendelian default.
- name: De novo variation in severe sporadic congenital heart disease
  description: >-
    A distinct inheritance mode within CHD rather than an alternative to the
    multifactorial model: severe CHD impairs reproductive fitness, so a large share of
    severe sporadic cases is caused by newly arisen variants absent from both parents.
    The de novo contribution is strongly stratified by phenotype — it is small in
    isolated CHD and large when neurodevelopmental disability and extracardiac anomalies
    accompany the cardiac lesion.
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  de_novo_rate: >-
    De novo mutations accounted for 8% of cases overall, ~3% of isolated CHD and ~28% of
    CHD with both neurodevelopmental and extracardiac congenital anomalies (Jin 2017,
    n=2,871 probands).
  evidence:
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      De novo mutations (DNMs) accounted for 8% of cases, including ~3% of isolated CHD
      patients and ~28% with both neurodevelopmental and extra-cardiac congenital
      anomalies.
    explanation: >-
      Quantifies the de novo contribution and its stratification by accompanying
      phenotype.
  - reference: PMID:23665959
    reference_title: De novo mutations in histone-modifying genes in congenital heart disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many cases occur sporadically and impair reproductive fitness, suggesting a role
      for de novo mutations.
    explanation: >-
      States the evolutionary rationale for expecting de novo variation to dominate
      severe sporadic CHD.

genetic:
- name: NKX2-5
  association: Pathogenic Variants
  subtype: Septal
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  notes: >-
    Homeobox transcription factor of the cardiac septation network. Haploinsufficiency
    causes autosomal dominant secundum atrial septal defect with progressive
    atrioventricular conduction block — the paradigm case in which one gene links a
    structural CHD to a lifelong electrical phenotype.
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the gene encoding the homeobox transcription factor NKX2-5 were
      found to cause nonsyndromic, human congenital heart disease.
    explanation: Establishes NKX2-5 as a cause of non-syndromic human CHD.
- name: GATA4
  association: Pathogenic Variants
  subtype: Septal
  gene_term:
    preferred_term: GATA4
    term:
      id: hgnc:4173
      label: GATA4
  notes: >-
    Zinc-finger transcription factor; septal-defect-causing missense alleles disrupt its
    physical interaction with TBX5, the molecular basis of the phenotypic overlap
    between isolated septal defects and Holt-Oram syndrome.
  evidence:
  - reference: PMID:12845333
    reference_title: GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous G296S missense mutation of GATA4, a transcription factor
      essential for heart formation, was found in all available affected family
      members but not in any control individuals
    explanation: >-
      Segregation of a GATA4 missense variant with non-syndromic septal defects in a
      pedigree, absent from controls, supports GATA4 as a CHD gene.
- name: TBX5
  association: Pathogenic Variants
  subtype: Septal
  gene_term:
    preferred_term: TBX5
    term:
      id: hgnc:11604
      label: TBX5
  notes: >-
    T-box transcription factor; loss of function causes Holt-Oram syndrome (septal
    defect plus radial ray upper-limb malformation). Its GATA4 interaction places it in
    the septation network modelled by this entry; curated in full in Holt-Oram_Syndrome.
- name: NOTCH1
  association: Pathogenic Variants
  subtype: LVOTO
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  notes: >-
    Signalling and transcriptional regulator of endocardial-to-mesenchymal transition
    and valvulogenesis. Loss of function causes bicuspid aortic valve with early and
    severe valve calcification, and contributes more broadly to left-sided obstructive
    lesions.
  evidence:
  - reference: PMID:16025100
    reference_title: Mutations in NOTCH1 cause aortic valve disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we show that mutations in the signalling and transcriptional regulator NOTCH1
      cause a spectrum of developmental aortic valve anomalies and severe valve
      calcification in non-syndromic autosomal-dominant human pedigrees
    explanation: >-
      States the paper's finding - NOTCH1 mutation causes developmental aortic valve
      anomaly plus severe calcification - which is the NOTCH1-LVOTO association this
      gene entry asserts.
- name: ZIC3
  association: Pathogenic Variants
  subtype: HTX
  gene_term:
    preferred_term: ZIC3
    term:
      id: hgnc:12874
      label: ZIC3
  notes: >-
    Zinc-finger transcription factor acting at the earliest stages of left-right axis
    formation; the first gene unequivocally associated with human situs abnormalities,
    causing X-linked heterotaxy.
  evidence:
  - reference: PMID:9354794
    reference_title: X-linked situs abnormalities result from mutations in ZIC3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ZIC3, which has not been previously implicated in vertebrate LR-axis development,
      is the first gene unequivocally associated with human situs abnormalities.
    explanation: Establishes ZIC3 as the founding human laterality/heterotaxy gene.
- name: TBX1
  association: Pathogenic Variants
  subtype: CTD
  gene_term:
    preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  notes: >-
    T-box transcription factor within the 22q11.2 critical region; the principal driver
    of the conotruncal and aortic arch defects of 22q11.2 deletion syndrome, acting in
    the second heart field and pharyngeal apparatus. Curated in full in
    22q11.2_Deletion_Syndrome.
- name: GDF1
  association: Pathogenic Variants
  subtype: CTD
  gene_term:
    preferred_term: GDF1
    term:
      id: hgnc:4214
      label: GDF1
  notes: >-
    NODAL-pathway growth differentiation factor. A recessive founder allele accounts for
    a substantial share of severe CHD in the Ashkenazi Jewish population — the clearest
    demonstration that recessive inheritance contributes materially to CHD in specific
    populations.
  evidence:
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including a recessive founder mutation in GDF1 accounting for ~5% of severe CHD
      in Ashkenazim
    explanation: Quantifies the GDF1 founder allele's contribution to severe CHD.
- name: MYH6
  association: Pathogenic Variants
  subtype: LVOTO
  gene_term:
    preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  notes: >-
    Alpha-myosin heavy chain. Recessive genotypes account for a large share of Shone
    complex, linking a sarcomeric gene to a left-sided obstructive malformation and
    illustrating the contractile/cytoskeletal route into CHD.
  evidence:
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      recessive genotypes in MYH6 accounting for ~11% of Shone complex
    explanation: Quantifies the MYH6 recessive contribution to a defined LVOTO lesion.
- name: FLT4
  association: Pathogenic Variants
  subtype: CTD
  gene_term:
    preferred_term: FLT4
    term:
      id: hgnc:3767
      label: FLT4
  notes: >-
    VEGFR-3 receptor tyrosine kinase. Dominant variants account for a defined fraction
    of tetralogy of Fallot.
  evidence:
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "dominant FLT4 mutations accounting for 2.3% of Tetralogy of Fallot"
    explanation: Quantifies the FLT4 contribution to tetralogy of Fallot.
- name: KMT2D
  association: Pathogenic Variants
  gene_term:
    preferred_term: KMT2D
    term:
      id: hgnc:7133
      label: KMT2D
  notes: >-
    H3K4 methyltransferase and the exemplar of the chromatin-modifier class that
    dominates the CHD de novo burden; causes Kabuki syndrome, in which CHD is a cardinal
    feature. Curated in full in Kabuki_Syndrome.
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Within this 21-gene set, PTPN11, KMT2D (MLL2), and RBFOX2, each had significantly
      more damaging de novo mutations than expected
    explanation: >-
      Identifies KMT2D as one of only three genes reaching genome-wide significance for
      damaging de novo mutation in CHD.
- name: CHD7
  association: Pathogenic Variants
  gene_term:
    preferred_term: CHD7
    term:
      id: hgnc:20626
      label: CHD7
  notes: >-
    Chromodomain helicase DNA-binding protein 7, a chromatin remodeller required for
    neural crest gene expression; causes CHARGE syndrome, whose conotruncal and arch
    defects are the neurocristopathy face of CHD. Curated in full in CHARGE_Syndrome.
    Note this is CHD7 the gene, unrelated to the CHD abbreviation for congenital heart
    disease used throughout this entry.
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, this list includes seven genes previously implicated in CHD (PTPN11,
      KMT2D, CHD7, MYH6, JAG1, NOTCH1, ZEB2).
    explanation: >-
      Confirms CHD7 among the recurrently de novo mutated genes established as CHD
      causes.
- name: RBFOX2
  association: Pathogenic Variants
  subtype: LVOTO
  gene_term:
    preferred_term: RBFOX2
    term:
      id: hgnc:9906
      label: RBFOX2
  notes: >-
    RNA-binding regulator of alternative splicing and of epithelial-mesenchymal
    transition, newly implicated in CHD by de novo loss-of-function variants that
    clustered strikingly in hypoplastic left heart syndrome. This is the clearest
    single-gene link between the endothelial-to-mesenchymal transition arm of this entry
    and a specific severe lesion.
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RBFOX2 harbored three distinct de novo LoF mutations, a highly significant finding
    explanation: >-
      Documents the RBFOX2 de novo burden and its exclusive association with
      hypoplastic left heart syndrome.
- name: Chromosomal aneuploidy and recurrent copy-number variants
  association: Pathogenic Variants
  notes: >-
    Whole-chromosome aneuploidy (notably trisomy 21, trisomy 18, trisomy 13, monosomy X)
    and recurrent CNVs (22q11.2 deletion, 7q11.23 deletion) are the single largest
    identifiable genetic category in clinically ascertained CHD. Chromosomal microarray
    remains diagnostic in a meaningful minority even of apparently isolated CHD, which is
    why it is recommended irrespective of dysmorphology assessment.
  evidence:
  - reference: PMID:34440418
    reference_title: "Genetic Evaluation of Inpatient Neonatal and Infantile Congenital Heart Defects: New Findings and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic yield was higher in syndromic appearing infants, but geneticists'
      dysmorphology exams lacked complete sensitivity and 6.5% of isolated CHD cases had
      diagnostic CMA.
    explanation: >-
      Quantifies the chromosomal-microarray yield in apparently isolated CHD and shows
      dysmorphology assessment cannot substitute for it.
  - reference: PMID:39337901
    reference_title: "The Genetic Architecture of Congenital Heart Disease in Neonatal Intensive Care Unit Patients-The Experience of University Medical Centre, Ljubljana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent genetic diagnoses in diagnosed cases were 22q11.2 microdeletion
      and CHARGE syndromes, followed by Noonan syndrome and Williams syndrome.
    explanation: >-
      Identifies the recurrent CNV and syndromic diagnoses that dominate a
      contemporary neonatal CHD cohort.

environmental:
- name: Maternal pregestational diabetes mellitus
  effect: Increases risk
  description: >-
    Diabetes present before conception (type 1 or type 2, with no material difference in
    effect size between them) is the strongest established modifiable risk factor for
    CHD, tripling the odds. Gestational diabetes, which begins after the window of
    cardiac organogenesis has largely closed, carries a substantially smaller effect —
    an internal consistency check that supports a causal, timing-dependent mechanism
    rather than confounding by maternal metabolic phenotype alone.
  notes: >-
    Deliberately left without an exposure_term: ECTO was searched and has no class for
    exposure to a maternal metabolic disease state (its maternal branch covers
    substances such as alcohol, nicotine and pharmacotherapy). Recording a substance
    exposure here would misrepresent the exposure.
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Pregestational maternal hyperglycaemia is the exposure that establishes the
      perturbed embryonic metabolic environment modelled by this node.
    evidence:
    - reference: PMID:38996968
      reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The effect size of gestational diabetes was less than that of PGDM (OR, 1.38;
        95% CI, 1.18-1.61).
      explanation: >-
        The timing-dependent gradient between pregestational and gestational diabetes
        supports action during early cardiac organogenesis rather than later gestation.
  evidence:
  - reference: PMID:38996968
    reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregestational diabetes (PGDM) was associated with CHDs (OR, 3.51; 95% CI,
      2.86-4.3), without difference between type 1 and type 2 PGDM.
    explanation: Quantifies the pregestational-diabetes effect size and its type-independence.
- name: Maternal overweight and obesity
  effect: Increases risk
  description: >-
    Raised pre-pregnancy body mass index is associated with CHD in offspring with a
    dose-effect relationship, independently of overt diabetes.
  notes: >-
    No exposure_term bound: ECTO was searched and has no class for maternal adiposity as
    an exposure.
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Associated with CHD with a dose-effect relationship; the mediating embryonic
      mechanism is not established, so the edge is recorded as indirect with unknown
      intermediates rather than assumed to run through hyperglycaemia.
  evidence:
  - reference: PMID:38996968
    reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was an association between being overweight or obese and CHDs (OR, 1.26;
      95% CI, 1.15-1.37), with a dose-effect relationship.
    explanation: Quantifies the maternal-adiposity association and its dose-response.
- name: Periconceptional exposure to alcohol
  effect: Increases risk
  description: >-
    Parental alcohol use is associated with CHD in offspring at modest effect size. Note
    the cited meta-analysis reports this association for alcohol use in the parental
    exposure group; it is grouped in that analysis with paternal smoking rather than
    reported as a maternal-only exposure.
  exposure_term:
    preferred_term: exposure to drinking alcohol via maternal
    term:
      id: ECTO:0300001
      label: exposure to drinking alcohol via maternal
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38996968
    reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was an association between CHDs and pre-eclampsia (OR, 2.01; 95% CI,
      1.32-3.05), paternal smoking (OR, 1.32; 95% CI, 1.03-1.70), and alcohol use (OR,
      1.50; 95% CI, 1.08-2.08).
    explanation: >-
      Reports the alcohol-use association and, in the same sentence, the parental
      exposure grouping in which it was analysed.
- name: Maternal cigarette smoking
  effect: Increases risk
  description: >-
    Maternal smoking is associated with CHD, though at a smaller effect size than
    pregestational diabetes or obesity.
  exposure_term:
    preferred_term: exposure to cigarette smoking via maternal
    term:
      id: ECTO:0300003
      label: exposure to cigarette smoking via maternal
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38996968
    reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There exists robust evidence for increased risk of CHD in the presence of
      obesity, maternal diabetes, maternal smoking, and increased maternal age.
    explanation: >-
      Places maternal smoking among the exposures the meta-analysis judges robustly
      evidenced.
- name: Teratogenic drug and infectious exposures during cardiac organogenesis
  effect: Increases risk
  description: >-
    Definitive teratogens for congenital cardiovascular defects include maternal
    rubella infection, untreated maternal phenylketonuria, thalidomide, vitamin A
    congeners and retinoids, and indomethacin tocolysis. Their shared feature is action
    during the roughly 3-8 week window of cardiac organogenesis. Rubella is a
    teratogenic maternal infection, not a disease transmitted from the affected infant —
    CHD itself is neither infectious nor transmissible.
  notes: >-
    A single entry covering a heterogeneous exposure set, because the cited AHA
    statement classifies them together as definitive rather than reporting per-agent
    effect sizes. No single ECTO class covers the set.
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:17519397
    reference_title: "Noninherited risk factors and congenital cardiovascular defects: current knowledge: a scientific statement from the American Heart Association Council on Cardiovascular Disease in the Young: endorsed by the American Academy of Pediatrics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Information is highlighted regarding definitive risk factors such as maternal
      rubella; phenylketonuria; pregestational diabetes; exposure to thalidomide,
      vitamin A cogeners, or retinoids; and indomethacin tocolysis.
    explanation: Enumerates the exposures classified as definitive risk factors.
- name: Periconceptional multivitamin or folic acid intake
  effect: May reduce risk
  description: >-
    The principal candidate protective exposure. The AHA statement summarises it as
    possibly reducing fetal cardiac risk; the evidence base is predominantly
    case-control, which the same statement flags as a limitation, so this is curated as
    a candidate protective factor rather than a demonstrated one.
  influences_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17519397
    reference_title: "Noninherited risk factors and congenital cardiovascular defects: current knowledge: a scientific statement from the American Heart Association Council on Cardiovascular Disease in the Young: endorsed by the American Academy of Pediatrics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Information is summarized for periconceptional multivitamin or folic acid intake,
      which may reduce the risk of cardiac disease in the fetus
    explanation: >-
      The hedged wording ("may reduce") is the reason this is curated as PARTIAL rather
      than SUPPORT.
  - reference: PMID:17519397
    reference_title: "Noninherited risk factors and congenital cardiovascular defects: current knowledge: a scientific statement from the American Heart Association Council on Cardiovascular Disease in the Young: endorsed by the American Academy of Pediatrics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Caveats regarding interpretation of possible exposure-outcome relationships from
      case-control studies are given because this type of study has provided most of
      the available information.
    explanation: >-
      Records the study-design limitation that constrains how strongly any of these
      exposure-outcome relationships can be asserted.

prevalence:
- population: Worldwide
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 941.0
  rate_low: 860.2
  rate_high: 1025.3
  notes: >-
    Pooled birth prevalence for 2010-2017 from 260 studies and 130,758,851 live births:
    9.410 per 1000 (95% CI 8.602-10.253), i.e. 941 per 100,000. CHD as an umbrella is
    emphatically not a rare disease: it is the commonest congenital anomaly in humans,
    and the rate sits an order of magnitude above the EU rare-disease threshold. The
    prevalence_class is therefore ABOVE_1_IN_1000, the Orphanet class for rates above
    100 per 100,000, which is unbounded above and so accommodates this figure directly.
  evidence:
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The birth prevalence of CHD from 1970-2017 progressively increased to a maximum
      in the period 2010-17 of 9.410/1000 [95% CI (confidence interval) 8.602-10.253].
    explanation: Source of the pooled worldwide birth-prevalence estimate.
- population: Africa
  measure_type: BIRTH_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 231.5
  rate_low: 42.9
  rate_high: 569.6
  notes: >-
    2.315 per 1000 (95% CI 0.429-5.696), i.e. 231.5 per 100,000 - still in the
    ABOVE_1_IN_1000 class despite being the lowest reported regional figure. The
    authors interpret that low figure as severe unmet diagnostic need rather than
    genuinely lower disease occurrence, which is why this is curated as reported
    rather than true prevalence. Note the confidence interval is wide enough that its
    lower bound (42.9 per 100,000) would fall a band lower; the point estimate sets the
    class here.
  evidence:
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was marked heterogeneity among geographical regions, with Africa reporting
      the lowest prevalence [2.315/1000 (95% CI 0.429-5.696)] and Asia the highest
      [9.342/1000 (95% CI 8.072-10.704)].
    explanation: Source of the regional prevalence figures.
- population: Asia

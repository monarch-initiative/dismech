- name: Flow-Dependent Cardiac Morphogenesis Failure
  biological_scale: TISSUE
  description: >-
    Cardiac morphogenesis is not driven by the genome alone. The developing heart
    begins to function while it is still being built, and the resulting haemodynamic
    forces — shear stress on the endocardium and cyclic strain on the myocardium — are
    themselves morphogenetic inputs that the tissue senses and responds to. Removing or
    altering those forces produces abnormal heart development. This is the mechanistic
    content of the clinical "no flow, no grow" principle, and it is what converts a
    focal primary lesion into a global one: an early valvar or arch obstruction reduces
    flow through the structures downstream of it, whose growth is then secondarily
    curtailed, so that a point stenosis becomes hypoplastic left heart syndrome or
    aortic arch hypoplasia. It also means that a CHD lesion at birth is the compound
    product of the original developmental error and months of altered loading — a
    caveat that limits how directly a neonatal anatomical phenotype can be read back to
    a single genetic first cause. This node is unbroken ground in dismech; the
    Hypoplastic_Left_Heart_Syndrome and Coarctation_of_the_Aorta entries assert the
    flow-limitation step in prose without anchoring the general mechanism.
  biological_processes:
  - preferred_term: response to fluid shear stress
    term:
      id: GO:0034405
      label: response to fluid shear stress
    modifier: DYSREGULATED
  - preferred_term: heart morphogenesis
    term:
      id: GO:0003007
      label: heart morphogenesis
    modifier: DECREASED
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:26969993
    reference_title: "Organ Function as a Modulator of Organ Formation: Lessons from Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the absence or disruption of these forces, heart development is abnormal,
      suggesting that the heart must sense these changes and respond appropriately.
    explanation: >-
      Establishes haemodynamic force as a necessary morphogenetic input to heart
      development, which is the claim of this node. Evidence is from zebrafish, so the
      node is tagged MODEL_ORGANISM rather than treated as demonstrated in humans.
  - reference: PMID:26969993
    reference_title: "Organ Function as a Modulator of Organ Formation: Lessons from Zebrafish."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This theme is particularly evident in the developing heart as progression of
      cardiac development is accompanied by increased and altered hemodynamic forces.
    explanation: >-
      Supports the coupling of developmental progression to changing haemodynamic load.
  downstream:
  - target: Structural Cardiac Malformation
    causal_link_type: DIRECT
    description: >-
      Secondary hypoplasia of the chamber, valve or arch segment behind a flow-limiting
      lesion, converting a focal defect into a hypoplastic-heart phenotype.

- name: Structural Cardiac Malformation
  biological_scale: TISSUE
  description: >-
    The convergence node of this entry: an anatomically abnormal heart or great vessels
    at birth. Every mechanistic arm above terminates here, and every lesion-specific
    dismech entry begins from a member of this node's phenotype set. The malformation
    is fixed at birth (surgery repairs or palliates anatomy but does not restore normal
    development), which is why CHD is a lifelong condition rather than a neonatal event.
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  evidence:
  - reference: PMID:38488639
    reference_title: On the involvement of the second heart field in congenital heart defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Congenital heart defects (CHD) affect 1 in 100 live births and result from
      defects in cardiac development.
    explanation: >-
      States the defining causal claim of this entry: CHD is the anatomical outcome of
      disrupted cardiac development.
  downstream:
  - target: Altered Circulatory Physiology
    causal_link_type: DIRECT

- name: Altered Circulatory Physiology
  biological_scale: ORGANISM
  description: >-
    The shared physiological consequence of structural malformation, and the level at
    which otherwise unrelated lesions become clinically interchangeable. Four patterns
    recur: left-to-right shunting with pulmonary overcirculation and volume loading;
    outflow obstruction with pressure loading of the upstream ventricle; obligatory
    mixing or right-to-left shunting with systemic hypoxaemia and cyanosis; and
    duct-dependent circulation, in which either systemic or pulmonary blood flow is
    supplied through the arterial duct and collapses when it closes in the first days
    of life. Long-term, the volume- and pressure-loaded and hypoxaemic circulations
    drive pulmonary vascular remodelling, ventricular hypertrophy and fibrosis,
    arrhythmia and heart failure. The lesion-specific elaboration of each pattern is
    curated in the individual lesion entries (notably Eisenmenger_Syndrome for the
    shunt-to-pulmonary-vascular-disease trajectory) and is deliberately not re-derived
    here.
  evidence:
  - reference: PMID:29162633
    reference_title: Use of prostaglandins in duct-dependent congenital heart conditions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infants with duct-dependent critical CHD remain well during the fetal period and
      may deteriorate when the ductus arteriosus (commonly called 'duct') closes after
      birth.
    explanation: >-
      Documents the duct-dependent physiological pattern and its characteristic
      postnatal timing.
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
  - target: Congestive heart failure
    causal_link_type: DIRECT
  - target: Pulmonary arterial hypertension
    causal_link_type: DIRECT
  - target: Arrhythmia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Chronic volume and pressure loading causing chamber dilation and hypertrophy,
      plus surgical scar in the repaired or palliated heart, creating reentrant and
      triggered arrhythmogenic substrate.
  - target: Sudden cardiac death
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
      Ventricular tachyarrhythmia arising on that substrate; the entry keeps this
      indirect rather than drawing physiology straight to death.
    evidence:
    - reference: PMID:39768857
      reference_title: "Cardiovascular Diseases in Public Health: Chromosomal Abnormalities in Congenital Heart Disease Causing Sudden Cardiac Death in Children."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        CAs associated with cardiovascular diseases cause structural or functional
        alterations of the heart, affecting the cardiac chambers, valves, coronary
        arteries, aorta, and cardiac conduction, thus increasing the likelihood of
        arrhythmias, cardiac arrest, and sudden cardiac death (SCD).
      explanation: >-
        Places arrhythmia between the structural/functional cardiac alteration and
        sudden cardiac death, which is the intermediate this edge names.
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
        Increased metabolic demand and feeding difficulty in the setting of pulmonary
        overcirculation or hypoxaemia.


    explanation: Source of the regional prevalence figures.

diagnosis:
- name: Newborn pulse oximetry screening for critical congenital heart disease
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  description: >-
    Postductal (or pre- and postductal) oxygen-saturation measurement in the
    asymptomatic newborn, exploiting the fact that most critical CHD produces a
    detectable arterial saturation deficit before it produces visible cyanosis or a
    murmur. Its high specificity is what makes it viable as universal screening; its
    moderate sensitivity means a normal result does not exclude CHD, and it will not
    detect non-cyanotic lesions such as an isolated ventricular septal defect.
  results: >-
    Pooled sensitivity 76.5% (95% CI 67.7-83.5), specificity 99.9%, false-positive rate
    0.14%. Screening after 24 hours of age reduces the false-positive rate roughly
    tenfold (0.05% vs 0.50%).
  evidence:
  - reference: PMID:22554860
    reference_title: "Pulse oximetry screening for critical congenital heart defects in asymptomatic newborn babies: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulse oximetry is highly specific for detection of critical congenital heart
      defects with moderate sensitivity, that meets criteria for universal screening.
    explanation: >-
      States the test-performance profile and the screening recommendation this entry
      records.
  - reference: PMID:22554860
    reference_title: "Pulse oximetry screening for critical congenital heart defects in asymptomatic newborn babies: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The false-positive rate for detection of critical congenital heart defects was
      particularly low when newborn pulse oximetry was done after 24 h from birth than
      when it was done before 24 h
    explanation: Supports the timing dependence recorded in the results field.
- name: Chromosomal microarray as first-tier genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Chromosomal microarray is the first-tier genetic test in an infant with severe CHD,
    followed by exome or genome sequencing when the array is normal. The curatorially
    important point is that the yield is not confined to dysmorphic or syndromic
    infants: a clinical geneticist's dysmorphology examination does not reliably
    identify which apparently isolated CHD cases carry a pathogenic copy-number variant,
    so testing is recommended regardless of lesion type or extracardiac findings.
  results: >-
    Diagnostic chromosomal microarray in 14.6% of tested infants overall and in 6.5% of
    apparently isolated CHD; overall genetic-testing yield 17% once second-tier
    molecular testing is included. An independent neonatal cohort reported the same 17%
    overall figure (32/188).
  evidence:
  - reference: PMID:34440418
    reference_title: "Genetic Evaluation of Inpatient Neonatal and Infantile Congenital Heart Defects: New Findings and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cumulative evidence provides a rationale for comprehensive, standardized genetic
      evaluation in infants with severe CHDs regardless of lesion or extracardiac
      anomalies because genetic diagnoses that impact care are easily missed.
    explanation: >-
      States the recommendation to test irrespective of lesion class or extracardiac
      findings.
  - reference: PMID:34440418
    reference_title: "Genetic Evaluation of Inpatient Neonatal and Infantile Congenital Heart Defects: New Findings and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, 376 (85.5%) had chromosome microarray (CMA), of which 55 (14.6%) were
      diagnostic in syndromic (N = 35) or isolated (N = 20) presentations.
    explanation: Source of the chromosomal-microarray diagnostic yield.
  - reference: PMID:39337901
    reference_title: "The Genetic Architecture of Congenital Heart Disease in Neonatal Intensive Care Unit Patients-The Experience of University Medical Centre, Ljubljana."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We established the genetic diagnosis of 22 distinct syndromes in 17% (32/188) of
      neonates.
    explanation: >-
      Independent replication of the overall genetic-diagnostic yield in a neonatal CHD
      cohort.
- name: Echocardiography
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Transthoracic echocardiography is the definitive anatomical and physiological
    diagnostic modality for CHD at every age, and fetal echocardiography extends it into
    prenatal life. Prenatal detection is what permits delivery planning, prostaglandin
    availability at birth, and — as the epidemiological record shows — it also changes
    measured birth prevalence through pregnancy termination for the most severe lesions.
  evidence:
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which would be consistent with improved prenatal detection and consequent
      termination of pregnancy when these very severe lesions are discovered
    explanation: >-
      Supports the claim that prenatal echocardiographic detection measurably shifts
      recorded birth prevalence. PARTIAL because the authors offer it as a consistent
      interpretation rather than a demonstrated causal chain.

treatments:
- name: Prostaglandin E1 infusion for duct-dependent circulation
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    In duct-dependent lesions the arterial duct is the sole route for either systemic or
    pulmonary blood flow after birth; its physiological closure in the first days of life
    precipitates shock or profound cyanosis. Prostaglandin E1 (alprostadil) maintains
    ductal patency and is the single most time-critical medical intervention in neonatal
    CHD — it does not treat the malformation but buys the interval to reach definitive
    surgery or catheter intervention. Delay in starting the infusion can be fatal.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: alprostadil
      term:
        id: CHEBI:15544
        label: prostaglandin E1
  target_mechanisms:
  - target: Altered Circulatory Physiology
    treatment_effect: MODULATES
    description: >-
      Sustains the duct-dependent circulatory pattern rather than correcting the
      structural malformation upstream of it. MODULATES rather than RESTORES: the
      circulation is held in a survivable but still abnormal fetal-type arrangement.
    evidence:
    - reference: PMID:29162633
      reference_title: Use of prostaglandins in duct-dependent congenital heart conditions.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is critical to open or maintain ductus arteriosus patent in infants with
        duct-dependent CHDs.
      explanation: >-
        States the physiological target of the intervention: ductal patency, not the
        malformation.
  evidence:
  - reference: PMID:29162633
    reference_title: Use of prostaglandins in duct-dependent congenital heart conditions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prostaglandin E1 (alprostadil marketed as 'Prostin VR ') and prostaglandin E2
      (dinoprostone) are used to maintain a patent ductus arteriosus and the dose of
      medication depends on the clinical presentation.
    explanation: Identifies the agent and its indication.
  - reference: PMID:29162633
    reference_title: Use of prostaglandins in duct-dependent congenital heart conditions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delay in starting prostaglandin infusion can have deleterious effects on infants
      and can even lead to death.
    explanation: Records the time-critical nature of the intervention.
- name: Cardiac surgical repair or palliation
  therapeutic_modality: SURGERY
  description: >-
    Anatomical repair (septal defect closure, arterial switch, tetralogy repair,
    coarctation resection) where two-ventricle physiology can be achieved, or staged
    single-ventricle palliation culminating in the Fontan circulation where it cannot.
    The curatorially important framing, and the reason this entry models CHD as a
    lifelong condition, is that surgery repairs or palliates anatomy without restoring
    normal cardiac development: residual shunts and obstruction, valve dysfunction,
    ventricular failure, aortopathy, pulmonary hypertension, arrhythmia,
    Fontan-associated liver disease and reintervention remain lifelong risks, and the
    burden of CHD has correspondingly shifted into adulthood.
  treatment_term:
    preferred_term: cardiac surgery
    term:
      id: NCIT:C157806
      label: Cardiac Surgery
  target_mechanisms:
  - target: Structural Cardiac Malformation
    treatment_effect: RESTORES
    description: >-
      Addresses the anatomical convergence node directly. RESTORES refers to
      circulatory anatomy in the biventricular-repair case only; staged
      single-ventricle palliation instead bypasses the defect, and in neither case is
      the developmental error or its lifelong sequelae reversed.
    evidence:
    - reference: PMID:30413300
      reference_title: "Advanced care planning in adult congenital heart disease: Transitioning from repair to palliation and end-of-life care."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Unfortunately, adult patients with CHD carry residual lesions and sequelae
        putting them at risk for premature death related to re-interventions or
        complications; most commonly heart failure and arrhythmia
      explanation: >-
        Substantiates the qualification on this RESTORES edge - anatomical repair
        leaves residual lesions and sequelae, so the effect on the malformation node
        is not equivalent to cure.
  evidence:
  - reference: PMID:30413300
    reference_title: "Advanced care planning in adult congenital heart disease: Transitioning from repair to palliation and end-of-life care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a result of advances in pediatric care, the majority of patients born with
      congenital heart disease (CHD) survive into adulthood
    explanation: >-
      Evidences the efficacy of the surgical/paediatric-care era that this treatment
      entry describes: most people born with CHD now reach adulthood.
  - reference: PMID:30413300
    reference_title: "Advanced care planning in adult congenital heart disease: Transitioning from repair to palliation and end-of-life care."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More emerging is that a substantial number of patients, in particular those with
      complex heart defects, will eventually end up in a stage with hardly any medical
      or interventional options left.
    explanation: >-
      Directly supports this entry's framing that surgery repairs or palliates anatomy
      without restoring normal development, and that the burden shifts into adulthood.
- name: Heart transplantation
  therapeutic_modality: SURGERY
  description: >-
    Definitive option for end-stage CHD, including failed single-ventricle palliation
    and severe forms of hypoplastic left heart syndrome in which staged palliation is
    not viable or has failed.
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_mechanisms:
  - target: Structural Cardiac Malformation
    treatment_effect: RESTORES
    description: >-
      The only intervention that removes the malformed heart rather than remodelling
      it, hence RESTORES without the qualification attached to surgical repair. Where
      Fontan-associated liver disease has supervened, combined heart-liver
      transplantation is the corresponding option.
    evidence:
    - reference: PMID:40320589
      reference_title: "Combined Heart and Liver Transplantation in the Failing Fontan: Systematic Review and Single-arm Meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The Fontan procedure has transformed the management of congenital heart
        defects characterized by single ventricle physiology, yet it predisposes
        individuals to Fontan-associated liver disease. Combined heart and liver
        transplantation (CHLT) emerges as a therapeutic option, but evidence of its
        efficacy and safety remains limited
      explanation: >-
        Evidences transplantation as the terminal option for the failed
        single-ventricle palliation pathway modelled in this entry.
  evidence:
  - reference: PMID:40320589
    reference_title: "Combined Heart and Liver Transplantation in the Failing Fontan: Systematic Review and Single-arm Meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CHLT in Fontan patients demonstrates promising survival rates, but graft
      rejection and postoperative complications pose challenges.
    explanation: >-
      Supports transplantation as an effective but complication-laden option. PARTIAL
      because the meta-analysis covers combined heart-liver transplantation in failing
      Fontan specifically (4 retrospective cohorts, 67 patients), not heart
      transplantation across CHD as a whole.
- name: Preconception glycaemic control in maternal pregestational diabetes
  therapeutic_modality: BEHAVIORAL
  description: >-
    The principal actionable primary-prevention measure implied by this entry's
    environmental arm: because pregestational rather than gestational diabetes carries
    the large effect, and because the vulnerable window is the first eight weeks of
    gestation, glycaemic optimisation must precede conception to be relevant. Blood
    glucose reduction, antioxidant supplementation and exercise have all been proposed
    as preventive measures on this basis.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
    treatment_effect: INHIBITS
    description: >-
      Acts on the maternal metabolic exposure upstream of cardiogenesis rather than on
      any established malformation; the intent is primary prevention, so the effect is
      recorded against the exposure node it suppresses.
    evidence:
    - reference: PMID:35838899
      reference_title: Effect of maternal pregestational diabetes mellitus on congenital heart diseases.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment options including blood sugar-reducing, anti-oxidative stress drug
        supplements and exercise can help to prevent maternal pregestational diabetes
        mellitus from inducing congenital heart diseases.
      explanation: >-
        Supports the preventive rationale. Recorded as PARTIAL because this is a
        narrative-review assertion, not a trial result.

animal_models:
- name: Zebrafish embryonic heart-function model of flow-dependent cardiac morphogenesis
  species: Zebrafish
  genotype: >-
    Wild-type and contractility/flow-perturbed embryos (e.g. cardiac troponin and
    myosin morphants that abolish or alter intracardiac flow while the heart tube
    continues to form)
  publication: PMID:26969993
  description: >-
    The optically accessible, externally developing zebrafish embryo can survive by
    diffusion for long enough to tolerate near-complete loss of cardiac output, which
    is what makes it possible to remove flow and still observe morphogenesis. It is
    the system that supplies essentially all of the direct evidence behind the
    "no flow, no grow" node in this entry, and therefore the model on which the
    chd_flow_dependent_human_evidence HUMAN_MODEL_MISMATCH discussion turns.
  modeled_mechanisms:
  - target: Flow-Dependent Cardiac Morphogenesis Failure
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Experimentally removes or alters haemodynamic force during cardiac development
      and observes the morphogenetic consequence, establishing flow as a causal
      morphogenetic input rather than a correlate of it.
    limitations: >-
      Substantial species divergence at exactly the points this entry cares about: the
      zebrafish heart is two-chambered, undergoes no atrial or ventricular septation
      and has no separate pulmonary circulation, so the septation, conotruncal and
      duct-dependent arms of the model cannot be represented at all. Embryo scale also
      places the developing zebrafish heart in a different flow regime from the human
      embryo. The node is consequently curated with evidence_source MODEL_ORGANISM,
      and the translational question is left open in
      discussions.chd_flow_dependent_human_evidence rather than closed by this model.
    readouts:
    - name: Cardiac morphogenesis under experimentally altered haemodynamic force
      target: Flow-Dependent Cardiac Morphogenesis Failure
      direction: ALTERED
      interpretation: >-
        Heart development is abnormal when the forces are absent or disrupted, which
        is the observation the node's causal claim rests on.
      evidence:
      - reference: PMID:26969993
        reference_title: "Organ Function as a Modulator of Organ Formation: Lessons from Zebrafish."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In the absence or disruption of these forces, heart development is abnormal,
          suggesting that the heart must sense these changes and respond appropriately.
        explanation: Reports the perturbation result behind this readout.
    evidence:
    - reference: PMID:26969993
      reference_title: "Organ Function as a Modulator of Organ Formation: Lessons from Zebrafish."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we discuss concepts of how embryonic heart function contributes to heart
        development using lessons learned mostly from studies in zebrafish.
      explanation: >-
        Establishes zebrafish as the model system supplying the evidence for this
        node, which is what makes the link informative and the mismatch discussion
        necessary.

experimental_models:
- name: Hypoplastic left heart syndrome patient-derived iPSC-cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_source: PATIENT_DERIVED
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:39273002
  description: >-
    Cardiomyocytes differentiated from iPSCs reprogrammed from HLHS patients. These
    are curated here for a specific reason rather than as generic model-system
    completeness: they bear directly on the open question in
    chd_flow_dependent_human_evidence. If HLHS were purely a flow-deprivation
    phenomenon, patient cardiomyocytes removed from the haemodynamic environment
    should behave normally. They do not - they show impaired cardiac-lineage
    differentiation and structural/electromechanical defects in dish - which is
    human-derived evidence for a cell-autonomous contribution alongside, not instead
    of, the flow mechanism.
  modeled_mechanisms:
  - target: Flow-Dependent Cardiac Morphogenesis Failure
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the counterfactual the zebrafish model cannot: human patient cells
      cultured entirely outside a haemodynamic environment still show intrinsic
      defects, evidencing the "shared upstream developmental cause" alternative that
      the HUMAN_MODEL_MISMATCH discussion sets against pure flow dependence.
    limitations: >-
      iPSC-derived cardiomyocytes are transcriptionally and structurally immature,
      closer to fetal than adult myocardium, and a monolayer of one cell type cannot
      represent chamber-level morphogenesis at all. The findings are also from small
      patient-derived series with the genetic heterogeneity of HLHS uncontrolled, so
      they establish that a cell-autonomous component exists without quantifying its
      share relative to flow.
    readouts:
    - name: Connexin 43 expression and cardiac myocyte alignment in HLHS iPSC-CMs
      target: Flow-Dependent Cardiac Morphogenesis Failure
      direction: DECREASED
      interpretation: >-
        Reduced CX43 with impaired electromechanical transduction and failure of
        myocyte alignment, measured with no haemodynamic input present.
      evidence:
      - reference: PMID:39273002
        reference_title: iPSC-Derived Cardiomyocytes as a Disease Model to Understand the Biology of Congenital Heart Defects.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          They observed a reduction in CX43 expression in iPSC-derived CMs from HLHS
          patients, showing that there is impaired electromechanical transduction
          which causes the failure of correct cardiac myocyte alignment.
        explanation: Reports the measurement behind this readout.
    - name: Myofibril and organelle organisation in HLHS iPSC-CMs
      target: Flow-Dependent Cardiac Morphogenesis Failure
      direction: ALTERED
      interpretation: >-
        Structural disorganisation of the contractile apparatus intrinsic to the
        patient-derived cells.
      evidence:
      - reference: PMID:39273002
        reference_title: iPSC-Derived Cardiomyocytes as a Disease Model to Understand the Biology of Congenital Heart Defects.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          HLHS iPSC-CMs had an irregular myofibril arrangement, RER, and SR.
        explanation: Reports the structural measurement behind this readout.
    evidence:
    - reference: PMID:39273002
      reference_title: iPSC-Derived Cardiomyocytes as a Disease Model to Understand the Biology of Congenital Heart Defects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        They report an impairment in the differentiation process to the cardiac
        lineage of fully formed mature CMs.
      explanation: >-
        Establishes that HLHS patient-derived cells carry an intrinsic
        cardiac-differentiation defect outside any haemodynamic context, which is why
        this model is informative for the flow-dependence question.

discussions:
- discussion_id: chd_root_scope
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    What does this root entry add over the ~24 lesion-specific and ~195 syndromic
    dismech entries that already carry congenital cardiac content, and where should the
    boundary sit?
  attaches_to:
  - pathophysiology#Structural Cardiac Malformation
  rationale: >-
    At the time of curation the knowledge base already held dedicated entries for
    atrial and ventricular septal defect, tetralogy of Fallot, coarctation, hypoplastic
    left heart syndrome, d-transposition, persistent truncus arteriosus, double outlet
    right ventricle, Ebstein anomaly, visceral heterotaxy, patent ductus arteriosus,
    anomalous pulmonary venous return and more, plus syndromic entries (22q11.2
    deletion, CHARGE, Alagille, Down, Holt-Oram, Noonan, Turner, Kabuki, Williams,
    Ellis-van Creveld) carrying CHD as a phenotype. This entry was deliberately scoped
    to the *shared developmental biology* those entries individually assume but none
    asserts: first heart field vs second heart field deployment, cardiac neural crest
    migration, endocardial cushion endothelial-to-mesenchymal transition, the septation
    transcription factor network, left-right patterning, and flow-dependent
    morphogenesis. Four of those were unbroken ground in the KB before this entry
    (GO:0003272 and GO:0003203 endocardial cushion terms had zero prior uses,
    GO:0003198 one, CL:2000073 migratory cardiac neural crest cell zero, and
    flow-dependent morphogenesis had no ontology anchoring anywhere). Conversely the
    entry deliberately does NOT re-derive lesion-specific pathographs, post-operative
    course, or the shunt-to-Eisenmenger trajectory, all of which are curated elsewhere.
    The open question is whether the boundary should be enforced by a complementary
    kb/groupings/ Grouping recording the curated membership set and its criteria, in
    the manner of Familial_Hypertrophic_Cardiomyopathy, which keeps both an umbrella
    Disease entry (for the shared mechanism and gene spectrum) and a Grouping (for the
    audited membership boundary).
- discussion_id: chd_module_candidate
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should the cardiac morphogenesis chain in this entry be factored out into a
    kb/modules/ mechanism module that the lesion entries can declare conforms_to?
  attaches_to:
  - pathophysiology#Cardiac Progenitor Specification and Second Heart Field Deployment Failure
  rationale: >-
    The four developmental arms modelled here recur, node for node, across at least
    eight existing lesion entries: tetralogy of Fallot, persistent truncus arteriosus
    and double outlet right ventricle all carry "cardiac neural crest and second heart
    field" nodes in prose; d-transposition and DORV both carry looping/left-right nodes;
    hypoplastic left heart syndrome and coarctation both assert the flow-limitation step
    without anchoring it. That recurrence is exactly the signal the create-module skill
    treats as a module trigger, and no kb/modules/ entry currently covers cardiac
    development. A cardiac_morphogenesis_failure module would let those entries declare
    conformance rather than each re-deriving the chain. It was not created in this pass
    because module creation is a separate deliverable with its own review requirements,
    and because the correct node granularity is better judged after this root entry has
    been reviewed.
- discussion_id: chd_flow_dependent_human_evidence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is flow-dependent cardiac morphogenesis demonstrated in human development, or is the
    "no flow, no grow" node in this entry an extrapolation from zebrafish?
  attaches_to:
  - pathophysiology#Flow-Dependent Cardiac Morphogenesis Failure
  rationale: >-
    The direct experimental evidence that haemodynamic force is a necessary
    morphogenetic input — that removing or altering flow makes heart development
    abnormal — comes from zebrafish, where the embryo can be manipulated and observed.
    The node is therefore curated with evidence_source MODEL_ORGANISM. In humans the
    supporting evidence is inferential: an early flow-limiting lesion is observed to be
    accompanied by progressive hypoplasia of the structures behind it (the natural
    history of evolving hypoplastic left heart syndrome and of aortic arch hypoplasia).
    That correlation is compatible with the flow hypothesis but does not exclude a
    common developmental cause acting on both the valve and the chamber. Resolving this
    matters because it determines whether fetal intervention to restore flow can be
    expected to rescue chamber growth, or only to relieve obstruction.

    Both sides of the question now have a structural anchor in this entry. The
    zebrafish perturbation model (animal_models) supplies the causal flow evidence and
    carries its species limitations explicitly - a two-chambered heart with no
    septation cannot represent most of what this entry models. Against it, HLHS
    patient-derived iPSC-cardiomyocytes (experimental_models) show impaired
    cardiac-lineage differentiation, reduced CX43 and disorganised myofibrils while
    cultured entirely outside any haemodynamic environment, which is human-derived
    evidence that a cell-autonomous component exists. Neither settles the share of
    each contribution, which is what the proposed experiment below is aimed at.
  proposed_experiments:
  - experiment_id: chd_fetal_valvuloplasty_growth_trajectory
    name: Serial fetal echocardiographic growth trajectories after fetal aortic valvuloplasty
    description: >-
      Test whether relieving a flow-limiting lesion in mid-gestation alters the
      subsequent growth trajectory of the left ventricle, aortic valve annulus and
      ascending aorta relative to matched unintervened fetuses. A growth response would
      support the flow-dependent model directly in humans; its absence would favour a
      shared upstream developmental cause.
- discussion_id: chd_prevalence_ascertainment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How much of the reported worldwide variation in CHD birth prevalence is real
    biological difference and how much is ascertainment?
  attaches_to:
  - pathophysiology#Structural Cardiac Malformation
  rationale: >-
    Reported birth prevalence rose from 0.6 per 1000 in the 1930s to over 9 per 1000
    after 1995, and 93.4% of the recent increase is attributable to the mild lesions
    (ventricular septal defect, atrial septal defect, patent ductus arteriosus) that
    postnatal echocardiography detects. Meanwhile the reported prevalence of left
    ventricular outflow tract obstruction has fallen, which the authors read as prenatal
    detection with consequent termination. Africa reports the lowest prevalence and Asia
    the highest. Almost none of this is safely interpretable as variation in the
    underlying developmental biology this entry models, and the prevalence records here
    are curated as *reported* birth prevalence for that reason. Distinguishing the two
    would need a population with uniform prenatal and postnatal ascertainment,
    including pregnancy outcomes.

notes: >-
  Scope note. This entry is the mechanistic root of the CHD family and is intentionally
  not a superset of the lesion entries. Where a claim is lesion-specific it is left to
  that lesion's entry and referenced by name rather than duplicated; the phenotype list
  here records the malformation classes that the developmental arms converge on, not a
  full clinical description of each. The subtype names (CTD, Septal, AVSD, LVOTO, RVOTO,
  HTX, APVR) follow the analytic lesion classes used in the CHD genomics and
  epidemiology literature rather than a surgical classification, because it is those
  classes for which differential genetic architecture has actually been reported —
  notably the absence of a de novo variant excess in heterotaxy and the distinctive
  isolated-CHD diagnostic yield in LVOTO.

  Ontology note. Three CL/GO terms used here were previously unused or near-unused in
  this knowledge base: CL:2000073 (migratory cardiac neural crest cell), which existing
  entries had been naming only as free text; GO:0003272 and GO:0003203 (endocardial
  cushion formation and morphogenesis), which had no prior use; and GO:0003198
  (epithelial to mesenchymal transition involved in endocardial cushion formation),
  which had one.

  Naming caution. CHD7 in the genetic section is the chromodomain-helicase gene that
  causes CHARGE syndrome. It is unrelated to the abbreviation CHD used for congenital
  heart disease throughout this entry, and the knowledge base also contains CHD2- and
  CHD8-related entries that are likewise chromodomain-helicase genes rather than
  cardiac entries.

  GeneReviews. No GeneReviews chapter exists for the congenital heart disease umbrella
  (PubMed searched 2026-08-19 for "congenital heart disease[TI] AND GeneReviews[All
  Fields]": zero results), which is expected for a complex multifactorial root term.
  GeneReviews chapters do exist for several of the syndromic causes and are cited in
  those entries.

- name: Cardiac Septation Transcription Factor Network Failure
  biological_scale: MOLECULAR
  description: >-
    Division of the looped, chambered heart into four cavities depends on a small,
    combinatorially acting transcription factor network — NKX2-5, GATA4/GATA6, TBX5 and
    TBX20 — whose members physically interact and are dosage-sensitive. Haploinsufficiency
    of any one member permits septation to begin but not to complete. Two features of
    this network are diagnostically important and are curated here rather than in the
    lesion entries: the same factors that direct septation also build and maintain the
    atrioventricular conduction system, so NKX2-5 haploinsufficiency yields septal
    defect plus progressive atrioventricular block; and the GATA4-TBX5 physical
    interaction is disrupted by septal-defect-causing missense alleles in either
    partner, which is the molecular basis of the cardiac overlap between isolated
    septal defects and Holt-Oram syndrome.
  biological_processes:
  - preferred_term: cardiac septum development
    term:
      id: GO:0003279
      label: cardiac septum development
    modifier: DECREASED
  - preferred_term: atrial septum development

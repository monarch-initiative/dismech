name: Congenital Heart Disease
creation_date: "2026-08-19T00:00:00Z"
category: Complex
description: >-
  Congenital heart disease (CHD) is the umbrella term for structural malformation of
  the heart or intrathoracic great vessels present at birth. This entry is curated as
  the **mechanistic root** of the CHD family: it models the shared developmental
  biology from which the individual lesions arise — cardiac progenitor field
  specification and second heart field deployment, left-right patterning and cardiac
  looping, cardiac neural crest migration and outflow tract septation, endocardial
  cushion formation and endothelial-to-mesenchymal transition, the septation
  transcription factor network, and flow-dependent morphogenesis — together with the
  genetic and maternal-environmental perturbations that disrupt them. The individual
  lesions and syndromes are curated in their own dismech entries (Atrial_Septal_Defect,
  Ventricular_Septal_Defect, Tetralogy_of_Fallot, Coarctation_of_the_Aorta,
  Hypoplastic_Left_Heart_Syndrome, Dextro_Transposition_of_the_Great_Arteries,
  Persistent_Truncus_Arteriosus, Double_Outlet_Right_Ventricle, Ebstein_Anomaly,
  Visceral_Heterotaxy, 22q11.2_Deletion_Syndrome, CHARGE_Syndrome, Alagille_syndrome,
  Down_syndrome, Holt-Oram_Syndrome, Noonan_Syndrome, Turner_Syndrome and others); this
  root deliberately does not re-derive their lesion-specific pathographs or
  post-natal haemodynamics beyond the shared convergence point.
disease_term:
  preferred_term: congenital heart disease
  term:
    id: MONDO:0005453
    label: congenital heart disease
synonyms:
- congenital heart defect
- congenital anomaly of heart
- CHD
parents:
- Heart disorder
- Congenital anomaly of cardiovascular system

has_subtypes:
- name: CTD
  display_name: Conotruncal (outflow tract) defects
  subtype_term:
    preferred_term: conotruncal heart malformations
    term:
      id: MONDO:0016581
      label: conotruncal heart malformations
  description: >-
    Malformations of the cardiac outflow tract and great arteries arising from failure
    of aorticopulmonary septation, outflow tract rotation, or alignment: tetralogy of
    Fallot, transposition of the great arteries, persistent truncus arteriosus, double
    outlet right ventricle, and interrupted aortic arch. Mechanistically anchored on
    the cardiac neural crest and second heart field arms of this entry.
  evidence:
  - reference: PMID:32405705
    reference_title: "Cardiac Neural Crest Cells: Their Rhombomeric Specification, Migration, and Association with Heart and Great Vessel Anomalies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Outflow tract abnormalities are the most frequent congenital heart defects."
    explanation: >-
      Establishes the conotruncal/outflow-tract group as a distinct and numerically
      dominant class within CHD.
- name: Septal
  display_name: Septal defects (atrial and ventricular)
  description: >-
    Communications across the interatrial or interventricular septum — secundum and
    primum atrial septal defect, and perimembranous, muscular, inlet and outlet
    ventricular septal defect. Together with patent ductus arteriosus these are the
    mild-end lesions that dominate reported CHD birth prevalence. No single MONDO
    class covers the atrial-plus-ventricular septal group; the constituent lesions are
    curated as Atrial_Septal_Defect (MONDO:0006664) and Ventricular_Septal_Defect
    (MONDO:0002070).
  evidence:
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The change in prevalence of mild CHD lesions (ventricular septal defect, atrial
      septal defect and patent ductus arteriosus) together explained 93.4% of the
      increased overall prevalence
    explanation: >-
      Identifies the septal-defect group (with PDA) as the lesion class that dominates
      contemporary reported CHD birth prevalence.
- name: AVSD
  display_name: Atrioventricular septal defect (AV canal defect)
  subtype_term:
    preferred_term: atrioventricular septal defect
    term:
      id: MONDO:0859565
      label: atrioventricular septal defect
  description: >-
    Deficiency of the atrioventricular septum with a common atrioventricular junction,
    arising from failure of endocardial cushion fusion. Strongly associated with
    trisomy 21. Anchored on the endocardial cushion / endothelial-to-mesenchymal
    transition arm of this entry.
- name: LVOTO
  display_name: Left ventricular outflow tract obstruction
  description: >-
    Obstructive lesions of the left heart and systemic outflow — hypoplastic left heart
    syndrome, aortic valve stenosis, bicuspid aortic valve, coarctation of the aorta,
    and Shone complex. Mechanistically the class in which flow-dependent morphogenesis
    ("no flow, no grow") is most clearly implicated: an early obstruction limits flow
    through left heart structures, whose growth is then secondarily curtailed.
  evidence:
  - reference: PMID:30783674
    reference_title: "Global birth prevalence of congenital heart defects 1970-2017: updated systematic review and meta-analysis of 260 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the prevalence of lesions grouped together as left ventricular outflow tract
      obstruction (which includes hypoplastic left heart syndrome) decreased
    explanation: >-
      Uses left ventricular outflow tract obstruction as an established analytic
      lesion class in CHD epidemiology.
- name: RVOTO
  display_name: Right-sided obstructive lesions
  description: >-
    Obstructive and hypoplastic lesions of the right heart and pulmonary outflow —
    pulmonary valve stenosis, pulmonary atresia with or without ventricular septal
    defect, tricuspid atresia, and Ebstein anomaly. The right-sided counterpart of
    LVOTO; the severe forms produce duct-dependent pulmonary circulation.
  evidence:
  - reference: PMID:22078432
    reference_title: "Birth prevalence of congenital heart disease worldwide: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with relatively more pulmonary outflow obstructions and fewer left ventricular
      outflow tract obstructions
    explanation: >-
      Treats pulmonary (right-sided) outflow obstruction as a lesion class distinct
      from left ventricular outflow tract obstruction in CHD epidemiology.
- name: HTX
  display_name: Heterotaxy and laterality defects
  subtype_term:
    preferred_term: visceral heterotaxy
    term:
      id: MONDO:0018677
      label: visceral heterotaxy
  description: >-
    Complex cardiac malformation arising from failure of left-right axis determination
    at the embryonic left-right organizer, with abnormal atrial situs, systemic and
    pulmonary venous connections, and atrioventricular/ventriculoarterial alignment.
    Notably, this is the CHD class that did NOT show an excess of damaging de novo
    variants in the PCGC cohort, distinguishing its genetic architecture from the
    conotruncal and LVOTO classes.
  evidence:
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was found in each CHD category (conotruncal defects, left ventricular outflow
      tract obstruction and "other"), except for heterotaxy, which showed no excess
    explanation: >-
      Establishes heterotaxy as an analytically separate CHD class whose de novo
      variant burden differs from the other classes.
- name: APVR
  display_name: Anomalous pulmonary venous return
  subtype_term:
    preferred_term: congenital pulmonary venous return anomaly
    term:
      id: MONDO:0017705
      label: congenital pulmonary venous return anomaly
  description: >-
    Total or partial drainage of the pulmonary veins to the systemic venous circulation
    rather than the left atrium, arising from failure of the common pulmonary vein to
    incorporate into the left atrium. Frequently a component of heterotaxy.

pathophysiology:
- name: Developmental Gene Dosage Disruption
  biological_scale: MOLECULAR
  description: >-
    The upstream molecular trigger of most severe CHD: loss of normal dosage or
    function of genes required for cardiac morphogenesis. Three genetic mechanisms
    converge here — chromosomal aneuploidy, recurrent and non-recurrent copy-number
    variants, and point mutations (predominantly de novo in severe sporadic cases).
    De novo damaging variants are concentrated in genes highly expressed in the
    developing heart and, strikingly, in chromatin-modifying genes that write, read
    and erase H3K4 methylation and H2BK120 ubiquitination — the marks that
    characterise the "poised" promoters and enhancers of key developmental genes.
    Because the same genes are also highly expressed in the developing brain, this
    node also explains the co-occurrence of CHD with neurodevelopmental disability and
    extracardiac anomalies. Roughly 400 developing-heart-expressed genes are inferred
    to contribute.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: LOSS_OF_FUNCTION
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:23665959
    reference_title: De novo mutations in histone-modifying genes in congenital heart disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find a marked excess of de novo mutations in genes involved in the
      production, removal or reading of histone 3 lysine 4 (H3K4) methylation, or
      ubiquitination of H2BK120, which is required for H3K4 methylation.
    explanation: >-
      Identifies chromatin modification of developmental promoters/enhancers as the
      molecular process disrupted by de novo mutation in severe CHD.
  - reference: PMID:26785492
    reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing of 1213 CHD parent-offspring trios identified an excess of
      protein-damaging de novo mutations, especially in genes highly expressed in the
      developing heart and brain.
    explanation: >-
      Localises the mutational burden to genes with high developing-heart expression
      and explains the shared cardiac/neurodevelopmental pleiotropy.
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNMs in ~440 genes were inferred to contribute to CHD.
    explanation: >-
      Quantifies the breadth of the developmental gene set whose dosage disruption
      causes CHD.
  downstream:
  - target: Cardiac Progenitor Specification and Second Heart Field Deployment Failure
    causal_link_type: DIRECT
    description: >-
      Haploinsufficiency of second heart field transcription factors (TBX1, ISL1,
      GATA4/6, NKX2-5) and of the chromatin machinery that licenses their targets
      reduces progenitor addition to the cardiac poles.
  - target: Left-Right Patterning and Cardiac Looping Failure
    causal_link_type: DIRECT
    description: >-
      Variants in left-right organizer genes (ZIC3, NODAL, GDF1) and in SMAD2, which
      regulates H3K27 methylation in the embryonic left-right organizer, randomise
      axis determination.
    evidence:
    - reference: PMID:23665959
      reference_title: De novo mutations in histone-modifying genes in congenital heart disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There are also two de novo mutations in SMAD2, which regulates H3K27
        methylation in the embryonic left-right organizer.
      explanation: >-
        Directly links the de novo mutational burden to the embryonic left-right
        organizer, the structure whose failure produces the laterality arm of CHD.
  - target: Cardiac Neural Crest Migration and Outflow Tract Septation Failure
    causal_link_type: DIRECT
  - target: Endocardial Cushion Formation and Endothelial-to-Mesenchymal Transition Failure
    causal_link_type: DIRECT
    description: >-
      RBFOX2 loss of function, recurrent de novo in hypoplastic left heart syndrome,
      disrupts the epithelial-mesenchymal transition programme; NOTCH1 and JAG1 are
      also recurrently mutated.
    evidence:
    - reference: PMID:26785492
      reference_title: "De novo mutations in congenital heart disease with neurodevelopmental and other congenital anomalies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        RBFOX2 is critical for zebrafish heart development (14), and regulates
        epithelial-mesenchymal transitions (EMT) (15). Disruption of EMT is felt to
        underlie HLHS pathogenesis
    
      explanation: >-
        Connects a recurrently de novo mutated gene to the endothelial-to-mesenchymal
        transition step, and to a specific lesion class.
  - target: Cardiac Septation Transcription Factor Network Failure
    causal_link_type: DIRECT

- name: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
  biological_scale: ORGANISM
  description: >-
    The non-genetic arm of CHD causation. During the window of cardiac organogenesis
    (roughly gestational weeks 3-8) the embryonic heart is vulnerable to the maternal
    metabolic and pharmacological environment. Pregestational diabetes is by a wide
    margin the strongest established modifiable risk factor; the proposed mediators are
    persistent embryonic hyperglycaemia, oxidative stress, dysregulation of
    hypoxia-inducible factor 1, and downregulation of the very NOTCH1 and NKX2-5
    programmes that the genetic arm of this entry disrupts. Definitive teratogenic
    exposures include maternal rubella, untreated maternal phenylketonuria, thalidomide,
    retinoids and vitamin A congeners, and indomethacin tocolysis. Periconceptional
    folic acid / multivitamin intake is the principal candidate protective exposure.
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:38996968
    reference_title: "Systematic Review and Meta-analysis of Prenatal Risk Factors for Congenital Heart Disease: Part 1, Maternal Chronic Diseases and Parental Exposures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pregestational diabetes (PGDM) was associated with CHDs (OR, 3.51; 95% CI,
      2.86-4.3), without difference between type 1 and type 2 PGDM.
    explanation: >-
      Quantifies pregestational diabetes as the dominant non-genetic risk factor in a
      170-study meta-analysis.
  - reference: PMID:35838899
    reference_title: Effect of maternal pregestational diabetes mellitus on congenital heart diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Factors such as persistent maternal hyperglycemia, oxidative stress,
      polymorphism of uncoupling protein 2, polymorphism of adiponectin gene, Notch 1
      pathway, Nkx2.5 disorders, dysregulation of the hypoxia-inducible factor 1, and
      viral etiologies are associated with the occurrence of congenital heart diseases
      in the offspring of mothers with pregestational diabetes mellitus.
    explanation: >-
      Names the proposed molecular mediators, which converge on the same NOTCH1 and
      NKX2-5 programmes as the genetic arm.
  - reference: PMID:17519397
    reference_title: "Noninherited risk factors and congenital cardiovascular defects: current knowledge: a scientific statement from the American Heart Association Council on Cardiovascular Disease in the Young: endorsed by the American Academy of Pediatrics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Information is highlighted regarding definitive risk factors such as maternal
      rubella; phenylketonuria; pregestational diabetes; exposure to thalidomide,
      vitamin A cogeners, or retinoids; and indomethacin tocolysis.
    explanation: >-
      Enumerates the exposures the AHA classifies as definitive non-inherited risk
      factors for congenital cardiovascular defects.
  downstream:
  - target: Endocardial Cushion Formation and Endothelial-to-Mesenchymal Transition Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
        Hyperglycaemia-driven oxidative stress and HIF-1 dysregulation with
        downregulation of the NOTCH1 programme in the developing endocardium.
  - target: Cardiac Septation Transcription Factor Network Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - >-
        Reported downregulation of Nkx2.5 in the hyperglycaemic embryonic environment.

- name: Cardiac Progenitor Specification and Second Heart Field Deployment Failure
  biological_scale: CELLULAR
  description: >-
    The heart is not built from a single progenitor pool. The first heart field forms
    the linear heart tube and gives rise principally to the left ventricle and part of
    the atria; the second heart field (SHF) is a distinct population of progenitors that
    is progressively added to both poles of the elongating tube. The SHF supplies the
    right ventricle, the outflow tract myocardium and the ventricular septal myocardium
    at the arterial pole, and atrial including atrial septal myocardium at the venous
    pole. Because SHF deployment lays down the template on which septation is later
    performed, and because it orchestrates outflow tract development jointly with the
    neural crest, a deficit in progenitor addition is a single upstream lesion that can
    produce conotruncal, right ventricular hypoplastic, and septal phenotypes. This node
    is the reason a "root" CHD entry is mechanistically coherent rather than merely a
    list.
  biological_processes:
  - preferred_term: embryonic heart tube development
    term:
      id: GO:0035050
      label: embryonic heart tube development
    modifier: DECREASED
  - preferred_term: embryonic heart tube morphogenesis
    term:
      id: GO:0003143
      label: embryonic heart tube morphogenesis
    modifier: DECREASED
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
    modifier: DECREASED
  evidence:
  - reference: PMID:38488639
    reference_title: On the involvement of the second heart field in congenital heart defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The SHF gives rise to ventricular septal, right ventricular and outflow tract
      myocardium at the arterial pole, and atrial, including atrial septal myocardium,
      at the venous pole.
    explanation: >-
      Defines exactly which cardiac structures depend on second heart field addition,
      and therefore which lesions a deployment deficit can produce.
  - reference: PMID:38488639
    reference_title: On the involvement of the second heart field in congenital heart defects.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genetic or environmental perturbation of SHF deployment thus underlies a
      spectrum of common forms of CHD affecting conotruncal and septal morphogenesis.
    explanation: >-
      States the causal claim of this node: SHF deployment failure is a shared upstream
      cause of both conotruncal and septal CHD.
  - reference: PMID:39000221
    reference_title: "Cardiac Development and Factors Influencing the Development of Congenital Heart Defects (CHDs): Part I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac morphogenesis involves numerous types of cells originating outside the
      initial cardiac crescent, including neural crest cells, cells of the second heart
      field origin, and epicardial progenitor cells.
    explanation: >-
      Establishes the multi-progenitor architecture of cardiac morphogenesis that this
      node and the neural crest node between them represent.
  downstream:
  - target: Cardiac Neural Crest Migration and Outflow Tract Septation Failure
    causal_link_type: DIRECT
    description: >-
      SHF deployment has been implicated in orchestrating outflow tract development
      together with the neural crest cells; a deficient arterial-pole template
      compromises subsequent neural-crest-dependent septation.
    evidence:
    - reference: PMID:38488639
      reference_title: On the involvement of the second heart field in congenital heart defects.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        SHF deployment creates the template for subsequent cardiac septation and has
        been implicated in cardiac looping and in orchestrating outflow tract
        development with neural crest cells.
      explanation: >-
        Directly asserts the SHF-to-neural-crest coordination this edge represents.
  - target: Cardiac Septation Transcription Factor Network Failure
    causal_link_type: DIRECT
    description: >-
      The SHF supplies the ventricular septal and atrial septal myocardium, so the
      septation programme acts on a template the SHF has laid down.
  - target: Left-Right Patterning and Cardiac Looping Failure
    causal_link_type: DIRECT
    description: >-
      Second heart field deployment has been implicated in cardiac looping itself, not
      only in the addition of myocardium at the poles.
  - target: Structural Cardiac Malformation
    causal_link_type: DIRECT

- name: Left-Right Patterning and Cardiac Looping Failure
  biological_scale: CELLULAR
  description: >-
    The linear heart tube must break bilateral symmetry and loop rightward (dextral
    looping) for the systemic and pulmonary circulations to be placed in their correct
    series arrangement. Handedness is set upstream at the embryonic left-right
    organizer, where motile-cilium-driven leftward flow establishes asymmetric NODAL,
    LEFTY and PITX2 expression; ZIC3 acts at the earliest stages of this process.
    Failure randomises the axis, producing situs ambiguus (heterotaxy) with its complex
    atrial, venous and ventriculoarterial mis-connections, or complete situs inversus.
    This node is the point at which the CHD root meets the ciliopathy_dysfunction and
    Visceral_Heterotaxy entries; those curate the ciliary machinery and the individual
    HTX loci in detail and are deliberately not re-derived here.
  biological_processes:
  - preferred_term: determination of left/right symmetry
    term:
      id: GO:0007368
      label: determination of left/right symmetry
    modifier: LOSS_OF_FUNCTION
  - preferred_term: left/right pattern formation
    term:
      id: GO:0060972
      label: left/right pattern formation
    modifier: DECREASED
  - preferred_term: heart looping
    term:
      id: GO:0001947
      label: heart looping
    modifier: DECREASED
  evidence:
  - reference: PMID:9354794
    reference_title: X-linked situs abnormalities result from mutations in ZIC3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frameshift allele is also associated with situs inversus among some
      heterozygous females, suggesting that ZIC3 functions in the earliest stages of
      LR-axis formation.
    explanation: >-
      Places a human CHD/laterality gene at the earliest step of left-right axis
      formation, which is the claim of this node.
  - reference: PMID:9354794
    reference_title: X-linked situs abnormalities result from mutations in ZIC3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aberrant LR axis development can lead to randomization of individual organ
      position (situs ambiguus) or to mirror-image reversal of all lateralized
      structures (situs inversus).
    explanation: >-
      States the two phenotypic outcomes of left-right patterning failure that define
      the heterotaxy subtype.
  downstream:
  - target: Structural Cardiac Malformation
    causal_link_type: DIRECT
    description: >-
      Randomised laterality produces abnormal atrial situs, anomalous systemic and
      pulmonary venous connections, atrioventricular and ventriculoarterial discordance,
      and commonly an unbalanced atrioventricular septal defect.

- name: Cardiac Neural Crest Migration and Outflow Tract Septation Failure
  biological_scale: CELLULAR
  description: >-
    Cardiac neural crest cells delaminate from the postotic (vagal) hindbrain, migrate
    through the caudal pharyngeal arches, and enter the outflow tract, where they are
    indispensable for formation of the aorticopulmonary septum that divides the common
    truncus into aorta and pulmonary trunk. The same population patterns the aortic
    arch arteries and contributes to the semilunar valves and the proximal coronary
    arteries. Crucially, cardiac neural crest and second heart field cells migrate in
    opposite directions at the same developmental stage, so a perturbation of either
    population produces overlapping conotruncal phenotypes. Because these cells also
    build craniofacial and pharyngeal-arch derivatives, their failure explains the
    recurrent clinical co-occurrence of conotruncal CHD with craniofacial and
    pharyngeal anomalies (22q11.2 deletion, CHARGE) — the cardiac face of the
    neurocristopathy concept.
  cell_types:
  - preferred_term: migratory cardiac neural crest cell
    term:
      id: CL:2000073
      label: migratory cardiac neural crest cell
  biological_processes:
  - preferred_term: cardiac neural crest cell migration involved in outflow tract morphogenesis
    term:
      id: GO:0003253
      label: cardiac neural crest cell migration involved in outflow tract morphogenesis
    modifier: DECREASED
  - preferred_term: neural crest cell migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: DECREASED
  - preferred_term: outflow tract morphogenesis
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
    modifier: DECREASED
  locations:
  - preferred_term: outflow tract
    term:
      id: UBERON:0004145
      label: outflow tract
  evidence:
  - reference: PMID:32405705
    reference_title: "Cardiac Neural Crest Cells: Their Rhombomeric Specification, Migration, and Association with Heart and Great Vessel Anomalies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These are due to the absence or dysfunction of the two main cell types, i.e.,
      neural crest cells and secondary heart field cells that migrate in opposite
      directions at the same stage of development.
    explanation: >-
      States the two-population, counter-migratory architecture that makes neural crest
      and second heart field failure phenotypically convergent on the outflow tract.
  - reference: PMID:32405705
    reference_title: "Cardiac Neural Crest Cells: Their Rhombomeric Specification, Migration, and Association with Heart and Great Vessel Anomalies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These cells directly govern aortic arch patterning and development, ascending
      aorta dilatation, semi-valvular and coronary artery development,
      aortopulmonary septation abnormalities, persistence of the ductus arteriosus,
      trunk and proximal pulmonary arteries
    explanation: >-
      Enumerates the specific structures whose malformation follows cardiac neural
      crest failure.
  - reference: PMID:39000221
    reference_title: "Cardiac Development and Factors Influencing the Development of Congenital Heart Defects (CHDs): Part I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For example, neural crest cells, which form the building blocks of the peripheral
      nervous system and craniofacial areas, migrate to the heart, where they are
      indispensable for the formation of a septum within the outflow tract
    explanation: >-
      Establishes the indispensability of neural crest cells for outflow tract
      septation and their shared origin with craniofacial structures.
  - reference: PMID:39000221
    reference_title: "Cardiac Development and Factors Influencing the Development of Congenital Heart Defects (CHDs): Part I."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The relationship between neural crest cells and the formation of septa in the
      heart explains the correlation between craniofacial defects and some congenital
      heart defects
    explanation: >-
      Supports the neurocristopathy claim that links conotruncal CHD to craniofacial
      anomalies in the syndromic entries.
  downstream:
  - target: Structural Cardiac Malformation
    causal_link_type: DIRECT
    description: >-
      Failure of aorticopulmonary septation yields persistent truncus arteriosus;
      partial or malaligned septation yields tetralogy of Fallot, double outlet right
      ventricle and interrupted aortic arch.

- name: Endocardial Cushion Formation and Endothelial-to-Mesenchymal Transition Failure
  biological_scale: CELLULAR
  description: >-
    The atrioventricular canal and outflow tract cushions are the swellings of cardiac
    jelly that are colonised when a subset of endocardial cells loses cell-cell
    adhesion, delaminates and transforms into invasive mesenchyme
    (endothelial-to-mesenchymal transition, a cardiac-specific instance of EMT driven
    by TGF-beta, BMP and NOTCH signalling from the adjacent myocardium). Those
    mesenchymal cells then remodel into the atrioventricular and semilunar valve
    leaflets and into the membranous portions of the atrial and ventricular septa.
    Failure at this step is therefore simultaneously a valve lesion and a septation
    lesion, which is why the atrioventricular septal defect is a single malformation
    rather than a coincidence of two. NOTCH1 loss of function in this programme is the
    established cause of bicuspid aortic valve with early calcification.

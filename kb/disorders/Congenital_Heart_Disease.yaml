      id: GO:0003283
      label: atrial septum development
    modifier: DECREASED
  - preferred_term: ventricular septum development
    term:
      id: GO:0003281
      label: ventricular septum development
    modifier: DECREASED
  - preferred_term: cardiac septum morphogenesis
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data indicate that NKX2-5 is important for regulation of septation during
      cardiac morphogenesis and for maturation and maintenance of atrioventricular node
      function throughout life.
    explanation: >-
      Establishes the dual septation/conduction role of NKX2-5 that this node asserts.
  - reference: PMID:9651244
    reference_title: Congenital heart disease caused by mutations in the transcription factor NKX2-5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two are predicted to impair binding of NKX2-5 to target DNA, resulting in
      haploinsufficiency, and a third potentially augments target-DNA binding.
    explanation: >-
      Documents the dosage-sensitive, DNA-binding-dependent mechanism of the septation
      transcription factor network.
  - reference: PMID:12845333
    reference_title: GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous G296S missense mutation of GATA4, a transcription factor
      essential for heart formation, was found in all available affected family
      members but not in any control individuals
    explanation: >-
      Establishes GATA4 as a second septation-network transcription factor causing
      isolated human cardiac septal defects, by co-segregation in a linked pedigree.
  - reference: PMID:12845333
    reference_title: GATA4 mutations cause human congenital heart defects and reveal an interaction with TBX5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, the Gata4 mutation abrogated a physical interaction between Gata4
      and TBX5, a T-box protein responsible for a subset of syndromic cardiac septal
      defects. Conversely, interaction of Gata4 and TBX5 was disrupted by specific
      human TBX5 missense mutations that cause similar cardiac septal defects.
    explanation: >-
      Supports the combinatorial, physically interacting character of the septation
      transcription factor network, and the specific GATA4-TBX5 interaction this node
      cites as the molecular basis of the isolated-septal-defect / Holt-Oram overlap.
      Disruption from either side of the interaction produces similar septal defects.
  downstream:
  - target: Structural Cardiac Malformation
    causal_link_type: DIRECT
    description: >-
      Incomplete septation leaves an interatrial or interventricular communication, or
      in the severe case a common atrioventricular junction.
  - target: Arrhythmia
    causal_link_type: DIRECT
    description: >-
      The developmental, non-acquired route to arrhythmia in CHD: the same
      transcription factors that direct septation build and maintain the
      atrioventricular conduction system, so their haploinsufficiency yields
      progressive atrioventricular block alongside the septal defect rather than as a
      consequence of it.

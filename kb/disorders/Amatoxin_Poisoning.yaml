- name: Hepatic Synthetic and Metabolic Failure
  biological_scale: ORGANISM
  description: >-
    Loss of hepatic synthetic and metabolic function - clotting factors,
    gluconeogenesis, ammonia clearance - presenting from about the third day and
    driving the systemic phenotypes. This is the node transplant decisions are made
    against. It is deliberately named for the mechanism rather than for the
    clinical syndrome, so that it does not collide with the `Acute liver failure`
    phenotype in the flat bare-name target namespace.
  downstream:

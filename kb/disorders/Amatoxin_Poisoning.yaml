environmental:
- name: Ingestion of foraged amatoxin-containing mushrooms
  description: >-
    Consumption of wild-collected mushrooms of Amanita, Galerina or Lepiota
    mistaken for edible species. The exposure is dietary, the dose is set by the
    quantity of fruiting body eaten, and no method of preparation reduces it.
  exposure_term:
    preferred_term: dietary exposure to amatoxins in foraged mushrooms
    term:
      id: ECTO:0000537
      label: exposure to toxin
  food_source:
    preferred_term: mushroom fruitbody
    term:
      id: FOODON:00003528
      label: mushroom fruitbody
  influences_mechanisms:
  - target: Systemic Alpha-Amanitin Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The foraged meal is the route by which systemic amatoxin exposure is
      established; there is no other meaningful route of human exposure.
    evidence:
    - reference: PMID:17503263
      reference_title: 'Amatoxin poisoning: a 15-year retrospective analysis and follow-up evaluation of 105 patients.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "more than 90% of deaths resulting from ingestion of amatoxin-containing species"
      explanation: >-
        Attributes the great majority of mushroom-poisoning deaths to ingestion of
        amatoxin-containing species, which is the exposure this link models.
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Amatoxins have good heat stability and are not destroyed by cooking or drying"
    explanation: >-
      Supports treating the ingested mushroom as the exposure regardless of
      preparation, since cooking does not reduce the dose.
  - reference: PMID:12475187
    reference_title: 'Treatment of amatoxin poisoning: 20-year retrospective analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mushroom intoxication is ascribed to 35 amatoxin-containing species belonging to three genera: Amanita, Galerina, and Lepiota."
    explanation: >-
      Sources the species scope, which is this entry's stated reason for being
      named after the toxin rather than after a genus.
  notes: >-
    Bound to the genus ECTO:0000537 exposure to toxin rather than to
    ECTO:0000524 exposure to mycotoxin, on positive grounds rather than for want
    of searching. Searched the pinned local build
    (`uv run runoak -i sqlite:obo:ecto search 'l~mushroom'`, `'l~amanit'`,
    `'l~fungal toxin'`, `'l~mycotoxin'`, `'l~toxin'`, `'l~exposure to fung'`,
    `'l~poisonous'`) on 2026-09-19: ECTO has no mushroom, Amanita or amatoxin
    exposure class, and the only fungal-toxin hit is ECTO:0000524. That term is
    defined as `RO:0002309` involving CHEBI:25442 mycotoxin, and
    `uv run runoak -i sqlite:obo:chebi ancestors CHEBI:37415 -p i` shows
    alpha-amanitin is not a descendant of CHEBI:25442 - it sits under cyclic
    peptide, not under mycotoxin - so binding it would assert a classification
    CHEBI does not make. This also matches how the KB already splits the two:
    Ergotism, a genuine mould mycotoxicosis, binds ECTO:0000524, while
    Ciguatera_Fish_Poisoning and Acute_Ackee_Fruit_Intoxication bind ECTO:0000537
    and carry the agent in preferred_term, which is what this entry does.
treatments:
- name: Intravenous Fluid Resuscitation and Supportive Care
  description: >-
    Volume replacement and correction of electrolytes and glucose, begun on
    presentation. Beyond treating hypovolaemia it maintains the urine output on
    which renal elimination of the toxin depends.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: fluid therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aggressive IV rehydration maintains renal function, corrects metabolic acidosis and electrolyte abnormalities, and is beneficial in mitigating irreversible hepatotoxicity"
    explanation: States the rationale and claimed benefit of fluid resuscitation.
- name: Multiple-Dose Activated Charcoal
  description: >-
    Repeated enteral activated charcoal, aimed not only at unabsorbed toxin in the
    gut but at toxin re-secreted in bile, which is what makes repeat dosing
    rational rather than merely cautious.

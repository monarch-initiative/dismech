    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "PEX was independently associated with reduced risk of the combined endpoint death or liver transplantation within 28 days from inclusion in patients with HE grade ≥ 2"
    explanation: >-
      The positive subgroup result, in patients with hepatic encephalopathy of
      grade 2 or worse, from a 111-patient multi-centre retrospective study.
  - reference: PMID:41163058
    reference_title: Therapeutic plasma exchange in amatoxin associated acute liver failure-results from the multi-center Amanita-PEX study.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL

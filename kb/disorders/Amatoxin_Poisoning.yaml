- name: Enterohepatic Recirculation of Alpha-Amanitin
  biological_scale: ORGANISM
  description: >-
    Biliary excretion of absorbed toxin followed by intestinal reabsorption, which
    returns the toxin to the liver rather than eliminating it and so extends the
    hepatic exposure well beyond the plasma half-life. This node is the target of
    multi-dose activated charcoal and of biliary drainage, and it is why an
    intervention aimed only at the blood has limited reach.
  downstream:
  - target: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
    causal_link_type: DIRECT
    description: Reabsorbed toxin re-enters the portal circulation and is taken up again.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Approximately 60% of absorbed α-amanitin is excreted into bile and then returned to the liver via enterohepatic circulation."
      explanation: States the recirculating fraction returning to the liver.
- name: Intestinal Epithelial Injury
  biological_scale: TISSUE
  description: >-
    Direct injury to enterocytes, whose high protein-synthesis rate makes them an
    early target. This produces the gastrointestinal phase, which begins six to
    twenty-four hours after the meal and can itself be severe enough to cause
    hypovolaemic collapse before any hepatic sign appears.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  downstream:
  - target: Profuse watery diarrhea
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Abdominal pain
    causal_link_type: DIRECT
  - target: Dehydration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Fluid and electrolyte loss from the gastrointestinal phase.
  - target: Hypotension
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hypovolaemia from the gastrointestinal losses, which the source names as a
      consequence of this phase rather than of the later hepatic failure.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The clinical and metabolic consequences of these symptoms include hypotension, electrolyte disturbances, impaired renal function, and metabolic acidosis"
      explanation: >-
        Attributes hypotension and acidosis to the gastrointestinal symptoms, which
        is what these two edges assert.
  - target: Metabolic acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Acid-base disturbance from the gastrointestinal fluid and electrolyte losses.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The clinical and metabolic consequences of these symptoms include hypotension, electrolyte disturbances, impaired renal function, and metabolic acidosis"
      explanation: Attributes metabolic acidosis to the gastrointestinal phase.
- name: Renal Proximal Tubular Injury
  biological_scale: TISSUE
  description: >-
    Injury to the proximal tubular epithelium, which reabsorbs filtered toxin and so
    concentrates it. The renal lesion can run independently of the hepatic one and
    may outlast it, which is why acute kidney injury is not simply hepatorenal
    syndrome in this poisoning.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  downstream:
  - target: Acute kidney injury
    causal_link_type: DIRECT
  - target: Oliguria
    causal_link_type: DIRECT
- name: Mitochondrial Injury in Proximal Tubular Epithelium
  biological_scale: CELLULAR
  description: >-
    Swollen mitochondria with reduced cristae and lowered TOM20 in tubular
    epithelium, with cytochrome c oxidase activity preserved. Proposed as the
    proximate mechanism of the renal lesion, on the strength of one human biopsy.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  biological_processes:
  - preferred_term: mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: DECREASED
  evidence:
  - reference: PMID:39967828
    reference_title: Is Amanita phalloides Nephrotoxicity due to Mitochondrial Toxicity?
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence for the key mitochondrial protein TOM20 found significantly decreased expression compared with ischemic acute tubular injury."
    explanation: >-
      The measurement behind this node, with ischaemic tubular injury as the
      comparator, from a renal biopsy in a patient whose liver injury had resolved.
  downstream:
  - target: Renal Proximal Tubular Injury
    causal_link_type: DIRECT
    hypothesis_groups:
    - mitochondrial_nephrotoxicity
    evidence:
    - reference: PMID:39967828
      reference_title: Is Amanita phalloides Nephrotoxicity due to Mitochondrial Toxicity?
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings suggest that Amanita phalloides elicits acute tubular injury via mitochondrial damage, possibly through a pathway that spares COX function."
      explanation: >-
        The authors' own reading of the biopsy, stated as a suggestion. Graded
        INDIRECT because a single cross-sectional biopsy shows the two findings
        together rather than showing that one produces the other.
- name: Hematopoietic Cell Apoptosis
  biological_scale: CELLULAR
  description: >-
    Caspase-dependent death of haematopoietic cells and CD34+ progenitors on direct
    exposure to alpha-amanitin. This is the part of the disease the transporter
    account does not explain, because OATP1B3 inhibitors do not protect these cells.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38276537
    reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "α-amanitin induces apoptosis in hematopoietic cells via a caspase-dependent mechanism"
    explanation: The paper's own conclusion, from caspase-3/7 activity and pan-caspase-inhibitor rescue.
  - reference: PMID:38276537
    reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The antidotes and OATP1B3 inhibitors did not reverse α-amanitin-induced toxicity."
    explanation: >-
      Supports this node's own statement that OATP1B3 inhibitors do not protect
      these cells. The claim it cuts against - that transporter-mediated uptake
      explains entry into every susceptible cell - is made by the
      oatp1b3_independent_uptake hypothesis and its discussion, not by this node,
      so the REFUTE is carried there rather than here.
  downstream:
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - oatp1b3_independent_uptake
  - target: Anemia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - oatp1b3_independent_uptake

    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In positive amatoxins patients, urinary concentrations > 55 ng/ml (or a baseline prothrombin ≤ 83%), were associated to hepatotoxicity"
    explanation: The concentration threshold the same study derived.
  notes: >-
    Bound to NCIT:C217459 Diagnostic Toxicology Testing, whose OLS
    hierarchicalAncestors include both NCIT:C25218 Clinical Intervention or
    Procedure (so it satisfies the dynamic enum) and NCIT:C18020 Diagnostic
    Procedure (so it is a strict specialisation of the generic term). The assay

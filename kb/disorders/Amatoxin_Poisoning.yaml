- name: Biliary Drainage
  description: >-
    Percutaneous or endoscopic drainage of bile, diverting re-secreted toxin out of
    the body instead of returning it to the gut. Mechanistically the most direct
    attack on enterohepatic recirculation, and supported so far only by very small
    prospective and veterinary series.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: percutaneous or endoscopic biliary drainage
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Enterohepatic Recirculation of Alpha-Amanitin
    treatment_effect: INHIBITS
    description: External diversion of bile removes re-secreted toxin from the recirculating pool.
    evidence:
    - reference: PMID:42273384
      reference_title: 'Bile Drainage Improves Survival in Amatoxin-induced Severe Liver Injury: A Prospective Pilot Cohort Study.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Interrupting the enterohepatic recirculation of amatoxins is a mechanistically rational but unproven therapeutic strategy."
      explanation: >-
        States the mechanism this edge asserts, and states in the same sentence

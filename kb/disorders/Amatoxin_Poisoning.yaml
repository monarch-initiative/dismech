      term:
        id: CHEBI:91090
        label: charcoal
  target_mechanisms:
  - target: Enterohepatic Recirculation of Alpha-Amanitin
    treatment_effect: INHIBITS
    description: Charcoal binds biliary-excreted toxin in the small intestine and prevents its reabsorption.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Given the enterohepatic circulation of amatoxins, activated charcoal should bind toxins excreted via bile into the small intestine, and multiple doses of charcoal should reduce toxin absorption from the gastrointestinal tract"
      explanation: >-
        States the mechanism this edge asserts. Note the source's own modal verb -
        "should bind", "should reduce" - which is a rationale rather than a measured
        effect, and the explanation does not upgrade it.
- name: Silibinin
  description: >-
    The first-line antidote where available, given intravenously. Its mechanistic
    claim is precise: it competes with amatoxin for OATP1B3 and so blocks the
    uptake step. Its clinical claim is weaker than that precision suggests - see
    the treatments discussion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: silibinin
      term:
        id: CHEBI:9144
        label: silibinin
  target_mechanisms:
  - target: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
    treatment_effect: INHIBITS
    description: >-
      Silibinin inhibits OATP1B3-mediated amanitin transport, which is the
      mechanistic basis for giving it.
    evidence:
    - reference: PMID:16495352
      reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "as well as by some antidotes used in the past for the treatment of human amatoxin poisoning (silibinin dihemisuccinate, penicillin G, prednisolone phosphate, and antamanide)"
      explanation: >-
        The transport assay result, quoted far enough to name silibinin itself. The
        shorter form of this quote established only that some inhibitors worked.
  - target: Enterohepatic Recirculation of Alpha-Amanitin
    treatment_effect: INHIBITS
    description: >-
      Blocking hepatic re-uptake also interrupts the recirculating loop, so
      silibinin acts on the loop as well as on the uptake step that feeds it.
    evidence:
    - reference: PMID:22352731
      reference_title: 'Legalon® SIL: the antidote of choice in patients with acute hepatotoxicity from amatoxin poisoning.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: OTHER
      snippet: "has been shown to interact with specific hepatic transport proteins blocking cellular amatoxin re-uptake and thus interrupting enterohepatic circulation of the toxin"
      explanation: >-
        States both effects in one sentence, and is why silibinin carries a second
        target_mechanisms link rather than only the uptake one.
  evidence:
  - reference: PMID:22352731
    reference_title: 'Legalon® SIL: the antidote of choice in patients with acute hepatotoxicity from amatoxin poisoning.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In nearly 1,500 documented cases, the overall mortality in patients treated with Legalon® SIL is less than 10% in comparison to more than 20% when using penicillin or a combination of silibinin and penicillin."
    explanation: >-
      The efficacy claim for the intravenous formulation, which the oral-silymarin
      study below does not address. Graded INDIRECT because it aggregates
      uncontrolled case reports, and the source is a review advocating for the
      product it names.
  - reference: PMID:22352731
    reference_title: 'Legalon® SIL: the antidote of choice in patients with acute hepatotoxicity from amatoxin poisoning.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no controlled clinical studies available due to ethical reasons"
    explanation: >-
      Records why the evidence base for the first-line antidote is uncontrolled,
      which is why the item above is graded INDIRECT rather than treated as settled.
  - reference: PMID:41378447
    reference_title: 'Effect of oral silymarin in patients with acute hepatotoxic mushroom poisoning: an analysis of poison center data.'
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "After adjusting for potential confounders, silymarin was not associated with a decrease in mortality."
    explanation: >-
      Scoped to the claim that this treatment reduces mortality, and to the oral
      silymarin formulation studied here rather than to intravenous silibinin. It
      does not refute the uptake-inhibition mechanism above, which is an in-vitro
      transport result.
  - reference: PMID:41378447
    reference_title: 'Effect of oral silymarin in patients with acute hepatotoxic mushroom poisoning: an analysis of poison center data.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "the incidence of acute kidney injury was reduced"
    explanation: >-
      The same study's positive secondary outcome. Recorded as a separate item
      because one evidence item cannot carry a negative primary and a positive
      secondary result at once.
- name: Benzylpenicillin
  description: >-
    High-dose intravenous penicillin G, historically the most widely used agent for
    this poisoning and mechanistically a competitor at the same transporter
    silibinin blocks. It is included because the entry's primary source calls it
    the most widely used agent, not because it is preferred: where the two have
    been compared, silibinin did better.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: benzylpenicillin
      term:
        id: CHEBI:18208
        label: benzylpenicillin
  target_mechanisms:
  - target: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
    treatment_effect: INHIBITS
    description: >-
      Benzylpenicillin inhibits OATP1B3 and so limits amatoxin entry into the
      hepatocyte, the same node silibinin acts on.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: "In vitro studies with human hepatocytes demonstrated that benzylpenicillin limited the cytotoxicity of amatoxins through potent inhibition of the OATP1B3 transporter"
      explanation: >-
        The transport-inhibition result behind this edge, in human hepatocytes.
    - reference: PMID:16495352
      reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "as well as by some antidotes used in the past for the treatment of human amatoxin poisoning (silibinin dihemisuccinate, penicillin G, prednisolone phosphate, and antamanide)"
      explanation: >-
        Independent confirmation from the transporter-identification study, which
        names penicillin G among the antidotes that inhibited amanitin uptake.
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Benzylpenicillin is the most widely used agent against A. phalloides poisoning"
    explanation: >-
      Establishes the agent's place in practice, which is why omitting it would
      have given a distorted picture of how this poisoning is actually treated.
  - reference: PMID:12475187
    reference_title: 'Treatment of amatoxin poisoning: 20-year retrospective analysis.'
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Benzylpenicillin (Penicillin G) alone and in association was the mostfrequently utilized chemotherapy but showed little efficacy"
    explanation: >-
      Scoped to the claim that this agent is effective, not to the claim that it is
      widely used, which the item above makes and this one independently confirms.
      From a compilation of 2108 hospitalised exposures. The source's run-together
      "mostfrequently" is reproduced exactly, since a snippet never corrects its source.
  - reference: PMID:22352731
    reference_title: 'Legalon® SIL: the antidote of choice in patients with acute hepatotoxicity from amatoxin poisoning.'
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In nearly 1,500 documented cases, the overall mortality in patients treated with Legalon® SIL is less than 10% in comparison to more than 20% when using penicillin or a combination of silibinin and penicillin."
    explanation: >-
      Scoped to the claim that benzylpenicillin should be preferred: where the two
      were compared, mortality was roughly twice as high with penicillin. The source
      is a review advocating for the silibinin product it names, which is why this is
      recorded as comparative evidence rather than as a settled result.
- name: N-Acetylcysteine
  description: >-
    Given intravenously on acetaminophen-style regimens, as a glutathione precursor
    aimed at the oxidative arm of the injury. It is standard in most protocols; the
    oxidative arm it targets is itself not firmly established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acetylcysteine

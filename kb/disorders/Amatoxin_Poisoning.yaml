diagnosis:
- name: Urinary amatoxin detection
  description: >-
    The only specific confirmatory test. Urine is the correct matrix; the window is
    narrow, and a negative result late after ingestion does not exclude poisoning.
  diagnosis_term:
    preferred_term: urinary amatoxin assay
    term:
      id: NCIT:C217459
      label: Diagnostic Toxicology Testing
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The only specific laboratory test available is the detection of amatoxins in urine"
    explanation: Establishes urinary detection as the specific test.
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER

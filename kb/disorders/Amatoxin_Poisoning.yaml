animal_models:
- name: Canine natural amatoxin poisoning treated on an adapted Santa Cruz protocol
  species: Dog
  description: >-
    Dogs are poisoned naturally by foraged Amanita and reproduce the human course
    closely, including the oral route and the hepatic failure. This series treated
    five dogs with a protocol adapted from human practice, with biliary drainage as
    a core intervention.
  publication: PMID:33458945
  modeled_mechanisms:
  - target: Enterohepatic Recirculation of Alpha-Amanitin
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Percutaneous biliary drainage was used to interrupt recirculation, and all
      five dogs survived.
    limitations: >-
      An uncontrolled case series of five animals with no comparison group, so
      survival cannot be attributed to any one component of a multi-part protocol.
      Species differences in amatoxin absorption are also substantial.
    evidence:
    - reference: PMID:33458945
      reference_title: Clinical recovery of 5 dogs from amatoxin mushroom poisoning using an adapted Santa Cruz protocol for people.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Core interventions included percutaneous biliary drainage, use of octreotide, and early nil per os orders."
      explanation: Names biliary drainage as a core element of the protocol applied.
  evidence:
  - reference: PMID:33458945
    reference_title: Clinical recovery of 5 dogs from amatoxin mushroom poisoning using an adapted Santa Cruz protocol for people.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All dogs survived to discharge with this treatment strategy."
    explanation: >-
      The outcome of the series, and the reason the canine setting is treated as
      informative for human management rather than only as comparative toxicology.
experimental_models:
- name: HepG2 hepatoma line with OATP1B3 knockdown
  experimental_model_type: CELL_LINE
  description: >-
    Human hepatoma cells in which OATP1B3 is knocked down, used to test whether
    transporter-mediated uptake is necessary for amatoxin cytotoxicity. The panel
    of eight organ-derived lines in the same study is what connects transporter
    expression to the organ selectivity seen clinically.
  publication: PMID:38641045
  modeled_mechanisms:
  - target: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockdown abolishes cytotoxicity, establishing the uptake step as necessary.
    limitations: >-
      A transformed hepatoma line rather than primary hepatocyte, and cytotoxicity
      over hours in culture rather than the multi-day staged human course. The model
      speaks to the uptake step only.
    evidence:
    - reference: PMID:38641045
      reference_title: Amanitin-induced variable cytotoxicity in various cell lines is mediated by the different expression levels of OATP1B3.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "knockdown of OATP1B3 in HepG2 cells prevented α-amanitin-induced cytotoxicity"
      explanation: The loss-of-function result this model contributes.
- name: Cultured hematopoietic cell lines and primary CD34+ progenitors
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Haematopoietic lines and primary CD34+ cells exposed to alpha- and beta-amanitin
    with and without caspase inhibition, antidotes and OATP1B3 inhibitors. This is
    the model that exposed the gap in the transporter account.
  publication: PMID:38276537
  modeled_mechanisms:
  - target: Hematopoietic Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Direct amanitin exposure kills haematopoietic cells and progenitors by a
      caspase-dependent route that OATP1B3 inhibitors do not block.
    limitations: >-
      An in-vitro exposure at defined concentrations, which does not establish that
      marrow reaches those concentrations in poisoned patients; the human evidence
      for hematotoxicity is a separate 28-patient retrospective series.
    evidence:
    - reference: PMID:38276537
      reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The antidotes and OATP1B3 inhibitors did not reverse α-amanitin-induced toxicity."
      explanation: >-
        The negative rescue result that makes this model informative about an
        OATP1B3-independent route.
discussions:
- discussion_id: oatp1b3_independent_entry_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does alpha-amanitin enter haematopoietic cells, given that
    OATP1B3 inhibition does not protect them?
  attaches_to:
  - pathophysiology#Hematopoietic Cell Apoptosis
  rationale: >-
    OATP1B3 expression is the accepted explanation for why amatoxin spares lung,
    heart and brain while destroying liver, gut and kidney, and the hepatic evidence
    for it is strong in both directions - the transporter carries the toxin, and
    knocking it down abolishes the cytotoxicity. Haematopoietic cells do not fit:
    they are killed at comparable concentrations, and OATP1B3 inhibitors do not
    rescue them. Either another carrier is involved or the transporter account is
    incomplete as a general theory of cellular susceptibility. The question matters
    therapeutically, because silibinin's mechanism is transporter blockade, and a
    compartment that takes up toxin without OATP1B3 is a compartment the antidote
    cannot protect.
  evidence:
  - reference: PMID:38276537
    reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The antidotes and OATP1B3 inhibitors did not reverse α-amanitin-induced toxicity."
    explanation: The observation that opens the gap.
- discussion_id: ros_causal_role_in_hepatotoxicity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do reactive oxygen species contribute causally to amatoxin hepatotoxicity, or
    are they a marker of cells already dying from transcriptional arrest?
  attaches_to:
  - pathophysiology#TNF-Mediated Amplification of Hepatocyte Injury
  rationale: >-
    This is not an idle question, because N-acetylcysteine is given in nearly every
    protocol and its rationale is the oxidative arm. The TNF half of the loop has a
    blocking experiment behind it; the ROS half does not, and the review that
    reports both says so in as many words. Until it is settled, the standard use of
    an antioxidant antidote rests on a mechanism the same literature declines to
    assert.
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although some in vivo and in vitro studies have found some association between α-amanitin and the development of ROS, further investigation is needed"
    explanation: The review declining to treat the oxidative arm as established.
- discussion_id: biliary_drainage_survival_benefit
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does interrupting enterohepatic recirculation by biliary drainage improve
    survival, or does the nine-patient pilot reflect selection?
  attaches_to:
  - treatments#Biliary Drainage
  rationale: >-
    Two of this entry's interventions - multiple-dose charcoal and biliary drainage
    - target the recirculation node directly, and a third, silibinin, targets the
    uptake step that recirculation feeds. Recirculation is the one part of the
    mechanism that is straightforwardly interruptible. The drainage result is the
    largest effect reported for any intervention here and rests on five treated
    patients against four controls; the mechanistic case is strong and the clinical
    case is a pilot. The same manoeuvre is a core element of the canine protocol,
    which is supportive but also uncontrolled.
  evidence:
  - reference: PMID:42273384
    reference_title: 'Bile Drainage Improves Survival in Amatoxin-induced Severe Liver Injury: A Prospective Pilot Cohort Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interrupting the enterohepatic recirculation of amatoxins is a mechanistically rational but unproven therapeutic strategy."
    explanation: The authors' own statement of the gap their pilot addresses but does not close.
clinical_trials:
- name: ChiCTR2300073442
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    Prospective pilot cohort of biliary drainage in amatoxin-induced pre-acute liver
    failure, registered with the Chinese Clinical Trial Registry and reported in
    PMID:42273384. The registry record still reads "Recruiting" and "Phase 0", but
    its last refresh predates the published nine-patient result, so `status` is
    recorded as UNKNOWN rather than copying a stale registry field, and `phase` as
    NOT_APPLICABLE because a non-randomised interventional pilot does not follow the
    FDA phase scheme the enum encodes.
  evidence:
  - reference: ICTRP:ChiCTR2300073442
    reference_title: Clinical study of interruption of toxin enterohepatic circulation by bile drainage for the treatment of liver failure due to amatoxin-containing mushrooms
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| Main ID | ChiCTR2300073442 |"
    explanation: WHO ICTRP registration record establishing the trial's identity.

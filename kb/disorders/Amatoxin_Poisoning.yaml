name: Amatoxin Poisoning
creation_date: '2026-09-19T19:00:00Z'
description: >-
  Amatoxin poisoning follows ingestion of a mushroom containing alpha-amanitin or
  one of its congeners. It causes the large majority of deaths from eating wild
  mushrooms, and the reason is as much timing as potency: the toxin is not
  destroyed by cooking, and it produces no symptom at all for a latent interval of
  six to eighteen hours, with the gastrointestinal phase beginning between six and
  twenty-four hours, so the patient presents after absorption is complete and the
  meal is rarely volunteered as relevant. The species differ and the toxin does
  not - Amanita phalloides, Amanita virosa, several Galerina and several Lepiota
  converge on the same molecule, which is why this entry is named for the toxin
  rather than the genus.

  Alpha-amanitin is a poor membrane permeant, and the step that makes an
  otherwise general poison organ-selective is carriage across the hepatocyte
  sinusoidal membrane by the uptake transporter OATP1B3. Cells that express the
  transporter take the toxin up and die; cells that do not are largely spared,
  which is why lung, heart and brain escape while liver, gut and kidney do not.
  Inside the cell the toxin binds RNA polymerase II and stops transcription, so
  the tissues that fail first are the ones with the highest demand for new
  protein.

  Clinically this reads as four phases - a latent interval, a cholera-like
  gastroenteritis, an apparent recovery, and hepatic failure from about the third
  day. The third phase is the dangerous one, because a patient who looks better is
  discharged while transcription is already silenced.
categories:
- Toxic Exposure Disorder
- Foodborne Toxin Exposure
- Acute Liver Failure
category: Environmental
parents:
- Poisoning
synonyms:
- Amanita phalloides poisoning
- death cap poisoning
- amatoxin syndrome
- cyclopeptide mushroom poisoning
- phalloides syndrome
notes: >-
  No disease_term is bound because MONDO has no amatoxin or mushroom-poisoning
  concept. Searched via the OLS MONDO index on 2026-09-19 for "mushroom
  poisoning", "mycetism", "amatoxin", "amanita", "amanitin", "phalloides",
  "toxic mushroom" and "hepatotoxic mushroom": the only returns were unrelated
  (MONDO:0005865 mushroom workers' lung, an occupational hypersensitivity
  pneumonitis, and MONDO:0016028 erythromelalgia). The nearest MONDO poisoning
  terms are agent-specific for other agents (MONDO:0017859 colchicine poisoning,
  MONDO:0042496 ergotism), and binding any of them would misname the agent. The
  deep-research report reached the same conclusion independently and offered
  MeSH:D009145 Mushroom Poisoning as the closest controlled heading; MeSH is not
  an ontology dismech binds disease_term to, and that heading is in any case the
  genus (all mushroom poisoning) rather than this toxin syndrome. Thirty-five other
  disorder entries already carry no disease_term.

  Thirteen further references were fetched and are committed because the
  deep-research report cites them, but are not cited by this entry. They divide
  into three groups: duplicates of mechanism or clinical content already sourced
  here from a primary or more specific paper (PMID:26375431, PMID:8370055,
  PMID:22811920, PMID:42188618, PMID:34208167 and
  DOI:10.1080/15563650.2022.2098139); case reports and regional series whose
  content is epidemiological or descriptive rather than mechanistic
  (PMID:28570504, PMID:41050366, PMID:41441612, PMID:42523156, PMID:40645529 and
  the canine DOI:10.1177/104063870701900317, a second dog case report beside the
  five-dog series already cited); and none that were screened out as wrong-entity
  or contradicted. They are kept rather than pruned because the committed report
  cites them, which is the repository's rule for what a reference cache may hold.

  No GeneReviews chapter exists for this disease, which is expected: GeneReviews
  covers Mendelian disorders and this is an acute toxic exposure with no genetic
  cause. `just check-genereviews` reports GeneReviews NO_CHAPTER against the
  committed Bookshelf index. It also reports StatPearls CITED_UNTAGGED, naming
  PMID:28613706 - and that finding is triggered by this very sentence, because the
  checker reads the chapter identifier written here as a citation. No StatPearls
  chapter is cited as evidence anywhere in the entry. StatPearls is never a
  baseline in any case, and the deep-research report's StatPearls quotations were
  not reused: the report's own reference validation found 11 of its 12 quoted
  claims absent from the cited source, so none of its quotations was treated as
  usable without re-derivation from a cached record.
mechanistic_hypotheses:
- hypothesis_group_id: rnap2_translocation_block
  hypothesis_label: Alpha-amanitin arrests transcription by trapping the RNA polymerase II translocation machinery
  status: CANONICAL
  description: >-
    The canonical account. Alpha-amanitin binds RNA polymerase II non-covalently
    near the bridge helix and trigger loop and prevents the conformational cycle
    that advances the enzyme by one nucleotide, so elongation stalls and mRNA
    output falls. Every downstream event in this entry is a consequence of that
    arrest. Review literature has presented the bridge helix and the trigger loop
    as two competing accounts of the binding site; the crystallographic work says
    they are not alternatives, because the inhibitor traps both elements at once.
- hypothesis_group_id: oatp1b3_independent_uptake
  hypothesis_label: A second, OATP1B3-independent route carries amatoxin into non-hepatic cells
  status: EMERGING
  description: >-
    OATP1B3 expression explains the classical organ selectivity well, and
    knocking it down in a hepatoma line abolishes cytotoxicity. It does not
    explain hematotoxicity: cultured hematopoietic cells and CD34+ progenitors are
    killed by alpha-amanitin, and OATP1B3 inhibitors do not rescue them. Either
    those cells import the toxin by another carrier, or enough enters by a
    non-carrier route to matter where the transporter account predicts sparing.
    One transporter-independent entry determinant is known - a CRISPR screen
    identified the N-glycan biosynthesis component STT3B as required for
    alpha-amanitin to enter human cells - so the open question is not whether any
    second route exists but whether STT3B accounts for the haematopoietic
    compartment specifically, which has not been tested.
- hypothesis_group_id: mitochondrial_nephrotoxicity
  hypothesis_label: Renal tubular injury is mediated by mitochondrial damage rather than by transcription arrest alone
  status: EMERGING
  description: >-
    Proposed from a single human case with electron microscopy and
    immunofluorescence on the renal biopsy, in a patient whose liver injury had
    already resolved. Mitochondria were swollen with reduced cristae and TOM20
    expression was lower than in ischaemic tubular injury, while cytochrome c
    oxidase activity was preserved. The authors put it as a question rather than a
    conclusion, and the entry carries it the same way.
- hypothesis_group_id: tnf_ros_amplification
  hypothesis_label: TNF and reactive oxygen species amplify hepatocyte death beyond the primary transcriptional lesion
  status: ALTERNATIVE
  description: >-
    Anti-TNF antibody prevents alpha-amanitin liver injury in mice, which is a
    strong functional result and places TNF upstream of the injury rather than
    beside it. The reactive-oxygen arm is weaker: the same review that reports the
    TNF experiments says explicitly that the role of ROS is not established. The
    two are grouped because the proposed link between them is that TNF acts
    through lipid peroxidation.
pathophysiology:
- name: Systemic Alpha-Amanitin Exposure
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Circulating alpha-amanitin, established by absorption of the ingested fruiting
    body across the intestinal epithelium into the portal circulation. The toxin
    binds serum proteins weakly and is cleared quickly from plasma into liver and
    kidney, so the plasma compartment is a conduit rather than a reservoir - which
    is why extracorporeal removal aimed at the blood has a narrow window. The
    ingestion event itself is modelled once, as the `environmental:` entry that
    TRIGGERS this node, rather than duplicated as a pathophysiology node; that
    follows Arsenic_Poisoning, whose exposure entries likewise point at the
    systemic-exposure node.
  chemical_entities:
  - preferred_term: alpha-amanitin
    term:
      id: CHEBI:37415
      label: alpha-amanitin
    modifier: INCREASED
  downstream:
  - target: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
    causal_link_type: DIRECT
    description: >-
      The liver is the first organ reached from the portal circulation, and the
      sinusoidal transporter OATP1B3 carries the toxin into the hepatocyte.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the liver, amanitins are transported by Organic Anion Transporting Polypeptides (OATP) into hepatocytes, causing extensive centrolobular necrosis."
      explanation: States the transporter-mediated hepatic uptake step and the lesion it produces.
  - target: Enterohepatic Recirculation of Alpha-Amanitin
    causal_link_type: DIRECT
    description: >-
      A substantial fraction of absorbed toxin is excreted in bile and reabsorbed,
      returning to the liver instead of leaving the body.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Approximately 60% of absorbed α-amanitin is excreted into bile and then returned to the liver via enterohepatic circulation."
      explanation: Quantifies the recirculating fraction, which is the rationale for charcoal and biliary drainage.
  - target: Intestinal Epithelial Injury
    causal_link_type: DIRECT
    description: >-
      Enterocytes have a high protein-synthesis rate and are injured directly,
      producing the gastrointestinal phase before any hepatic sign appears.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Metabolically active tissues dependent on high rates of protein synthesis, such as cells of the gastrointestinal tract, hepatocytes, and proximal convoluted tubules of the kidney, are disproportionately affected"
      explanation: >-
        Names the three high-turnover tissues that bear the injury, and is the
        source for treating the gut as a primary target rather than a bystander.
  - target: Renal Proximal Tubular Injury
    causal_link_type: DIRECT
    description: >-
      Filtered toxin is reabsorbed by the proximal tubule, which concentrates it in
      the tubular epithelium.
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the kidneys, after glomerular filtration, amanitins are reabsorbed in the renal tubules, resulting in acute tubular necrosis"
      explanation: States the renal route of exposure and the resulting lesion.
  - target: STT3B-Dependent Cellular Entry of Alpha-Amanitin
    causal_link_type: DIRECT
    hypothesis_groups:
    - oatp1b3_independent_uptake
    description: >-
      Entry into cells additionally requires the N-glycan biosynthesis machinery,
      a determinant separate from sinusoidal uptake.
  - target: Hematopoietic Cell Apoptosis
    causal_link_type: DIRECT
    hypothesis_groups:
    - oatp1b3_independent_uptake
    description: >-
      Hematopoietic cells are killed in culture at concentrations reached in
      poisoning, by a route the transporter account does not cover.
    evidence:
    - reference: PMID:38276537
      reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In CD34+ stem cells, α-amanitin decreased the number of colonies and cells."
      explanation: >-
        Shows direct toxicity to primary human progenitors, establishing the
        hematopoietic compartment as a target rather than a consequence of liver failure.
- name: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
  biological_scale: CELLULAR
  description: >-
    Carriage of alpha-amanitin across the sinusoidal membrane into the hepatocyte
    by the organic anion transporting polypeptide OATP1B3, encoded by SLCO1B3.
    This is the step that converts a poorly permeant peptide into a hepatocyte
    poison, and it is the reason the disease is a hepatopathy rather than a
    generalised cytotoxicity. It is also the step the first-line antidote targets.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  genes:
  - preferred_term: SLCO1B3
    term:
      id: hgnc:10961
      label: SLCO1B3
  evidence:
  - reference: PMID:16495352
    reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "we have identified OATP1B3 as the human hepatic uptake transporter for amatoxins"
    explanation: >-
      The identification of the transporter, from uptake assays in cells stably
      expressing each candidate OATP.
  - reference: PMID:16495352
    reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Under our conditions, only OATP1B3 was able to transport amanitin"
    explanation: >-
      A specificity result rather than a positive one: of the three sinusoidal
      OATPs tested, the other two did not transport the toxin.
  - reference: PMID:38641045
    reference_title: Amanitin-induced variable cytotoxicity in various cell lines is mediated by the different expression levels of OATP1B3.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "knockdown of OATP1B3 in HepG2 cells prevented α-amanitin-induced cytotoxicity"
    explanation: >-
      The loss-of-function control for this node: removing the transporter removes
      the toxicity, which makes uptake necessary rather than merely associated.
  notes: >-
    The node is bound to CL:0000182 hepatocyte rather than to a zonal subtype
    because the uptake step is not reported as zone-restricted; the zonation
    appears downstream, at the necrosis node, which binds CL:0019029.
  downstream:
  - target: RNA Polymerase II Inhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - rnap2_translocation_block
    description: Intracellular toxin reaches the nucleus and engages RNA polymerase II.
    evidence:
    - reference: PMID:16495352
      reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "CCK-8, a substrate specific for OATP1B3, prevented the fragmentation of nucleoli, a lesion typical for amanitin action"
      explanation: >-
        Blocking the transporter prevents the nucleolar lesion, which links uptake
        to the nuclear target. Graded INDIRECT because nucleolar fragmentation is a
        morphological readout of transcriptional arrest rather than a measurement of
        polymerase activity.
- name: STT3B-Dependent Cellular Entry of Alpha-Amanitin
  biological_scale: CELLULAR
  description: >-
    A requirement for the N-glycan biosynthesis component STT3B for alpha-amanitin
    to enter human cells, identified by CRISPR screening. It is a separate
    determinant from sinusoidal uptake: OATP1B3 explains which organs are reached,
    while STT3B is required for entry at the cellular level, and depleting it
    reduces toxin entry. It also nominated a repurposable inhibitor, which is why
    it appears here as a node with a treatment attached rather than as a note.
  evidence:
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Depletion of STT3B significantly decreased the entrance of α-amanitin in human cells"
    explanation: >-
      The loss-of-function result establishing STT3B as required for cellular
      entry, restated by this review from the CRISPR screen it cites.
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The N-glycan biosynthesis pathway and its main component, STT3B, were found to play a crucial role in α-amanitin toxicity"
    explanation: Names the pathway and the screen that identified it.
  downstream:
  - target: RNA Polymerase II Inhibition
    causal_link_type: DIRECT
    hypothesis_groups:
    - oatp1b3_independent_uptake
    description: >-
      Entry through this route delivers toxin to the same nuclear target, which is
      why it is drawn into the shared chain rather than as a parallel branch.
- name: RNA Polymerase II Inhibition
  biological_scale: MOLECULAR
  description: >-
    Non-covalent binding of alpha-amanitin to RNA polymerase II, trapping the
    bridge helix and trigger loop so the enzyme cannot complete the conformational
    cycle that adds a nucleotide and advances along the template. The enzyme is not
    destroyed; it is held, which is why the effect is a progressive decay of
    existing transcripts rather than an instantaneous stop.
  molecular_functions:
  - preferred_term: DNA-directed RNA polymerase activity
    term:
      id: GO:0003899
      label: DNA-directed RNA polymerase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: transcription elongation by RNA polymerase II
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
    modifier: DECREASED
  genes:
  - preferred_term: POLR2A
    term:
      id: hgnc:9187
      label: POLR2A
  evidence:
  - reference: PMID:18552824
    reference_title: Structural basis of transcription inhibition by alpha-amanitin and implications for RNA polymerase II translocation.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "suggest that alpha-amanitin impairs nucleotide incorporation and translocation by trapping the trigger loop and bridge helix"
    explanation: >-
      The structural result behind this node, from elongation-complex crystals
      soaked with the inhibitor. It also settles the bridge-helix-versus-trigger-loop
      question in favour of both.
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The primary mechanism of liver toxicity is considered to be the inhibition of RNA polymerase II with consequent hepatocyte apoptosis."
    explanation: Places polymerase inhibition as the accepted primary lesion.
  downstream:
  - target: Arrest of Messenger RNA Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - rnap2_translocation_block
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This inhibits transcription, causing a progressive decrease in messenger ribonucleic acid (mRNA) levels, leading to deficient protein synthesis and, eventually, cell apoptosis and necrosis"
      explanation: >-
        States the whole intracellular chain in one sentence - transcription arrest,
        falling mRNA, failed protein synthesis, cell death - and is cited on each of
        the three edges it covers.
- name: Arrest of Messenger RNA Synthesis
  biological_scale: MOLECULAR
  description: >-
    Progressive loss of cellular mRNA as existing transcripts are degraded and not
    replaced. The lag between exposure and injury is largely the half-life of the
    transcripts and proteins already present.
  biological_processes:
  - preferred_term: mRNA synthesis
    term:
      id: GO:0009299
      label: mRNA transcription
    modifier: DECREASED
  downstream:
  - target: Failure of Protein Synthesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - rnap2_translocation_block
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This inhibits transcription, causing a progressive decrease in messenger ribonucleic acid (mRNA) levels, leading to deficient protein synthesis and, eventually, cell apoptosis and necrosis"
      explanation: Covers the step from falling mRNA to deficient protein synthesis.
- name: Failure of Protein Synthesis
  biological_scale: CELLULAR
  description: >-
    Collapse of new protein production in cells that cannot tolerate it. This is
    the point at which the lesion becomes tissue-selective: the transcriptional
    block is universal, but only cells with a high protein-synthesis demand fail on
    the timescale of the poisoning.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
    modifier: DECREASED
  evidence:
  - reference: PMID:33803263
    reference_title: Identification of Decrease in TRiC Proteins as Novel Targets of Alpha-Amanitin-Derived Hepatotoxicity by Comparative Proteomic Analysis In Vitro.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "four subunits in the T-complex protein 1-ring complex protein decreased depending on the α-AMA concentration"
    explanation: >-
      A dose-dependent fall in specific chaperonin subunits in treated hepatoma
      cells, which is a measured consequence of the synthesis block. Graded INDIRECT
      because the proteomic readout shows depletion of particular proteins rather
      than global synthesis rate.
  downstream:
  - target: p53- and Caspase-Dependent Hepatocyte Apoptosis
    causal_link_type: DIRECT
    hypothesis_groups:
    - rnap2_translocation_block
    evidence:
    - reference: PMID:39684738
      reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This inhibits transcription, causing a progressive decrease in messenger ribonucleic acid (mRNA) levels, leading to deficient protein synthesis and, eventually, cell apoptosis and necrosis"
      explanation: Covers the final step, from deficient protein synthesis to cell death.

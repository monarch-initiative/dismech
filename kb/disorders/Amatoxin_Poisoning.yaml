    description: >-
      The clinical syndrome these synthetic and metabolic failures constitute.
  - target: Prolonged prothrombin time
    causal_link_type: DIRECT
    description: Loss of hepatic clotting-factor synthesis.
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: Loss of hepatic gluconeogenesis and glycogen reserve.
  - target: Hepatic encephalopathy

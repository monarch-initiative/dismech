    quote_role: REVIEW_SYNTHESIS
    snippet: "NAC was associated with higher survival in patients with amatoxin poisoning"
    explanation: >-
      The human efficacy signal, from a retrospective multivariate analysis.
      Graded INDIRECT because it is an association in observational data; no
      randomised or controlled trial of N-acetylcysteine in this poisoning exists.
  - reference: PMID:39684738
    reference_title: 'Amanita phalloides-Associated Liver Failure: Molecular Mechanisms and Management.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In experimental studies, NAC has demonstrated protective effects in human hepatocytes from α-amanitin-induced apoptosis"
    explanation: >-
      The mechanistic counterpart in human hepatocytes, which is what makes the
      observational survival signal biologically plausible rather than incidental.
- name: Therapeutic Plasma Exchange
  description: >-
    Extracorporeal plasma exchange, used as an adjunct in established liver failure.
    The largest series to date missed its primary endpoint overall but found a
    benefit confined to patients with grade 2 or worse encephalopathy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic plasma exchange

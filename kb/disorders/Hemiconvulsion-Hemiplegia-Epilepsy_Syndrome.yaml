name: Hemiconvulsion-Hemiplegia-Epilepsy Syndrome
creation_date: "2026-08-05T00:00:00Z"
category: Acquired
description: >-
  A catastrophic sequence that unfolds over hours in a previously well toddler. A
  febrile illness triggers a prolonged convulsive seizure that is clonic and
  one-sided; by the time it stops the child is hemiplegic; the affected
  hemisphere swells acutely and then, over months, shrinks into hemiatrophy; and
  after a latent interval a drug-resistant focal epilepsy emerges from the
  damaged side. The three stages give the syndrome its name. What makes it
  mechanistically arresting is not that a long seizure damages brain, which is
  expected, but that the damage stops at the midline. Nothing in the proposed
  mechanisms explains why an entire hemisphere is taken and the other spared, and
  the authors of the standard review say so outright.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - HHE syndrome
  - HH syndrome
  - hemiconvulsion-hemiplegia syndrome
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        An ILAE-recognized developmental and epileptic encephalopathy of
        childhood, presenting as status epilepticus and managed neurologically.

notes: >-
  Scope note. The MONDO term used here names the idiopathic form, deliberately:
  the review literature reports idiopathic HH/HHE as the commonest form, and
  symptomatic cases, in which a pre-existing lesion or a genetic epilepsy
  predisposes to the prolonged seizure, are modeled here as a predisposing-factor
  node rather than as a separate disease. The two share the cascade from
  prolonged unilateral status onward; what differs is what let the seizure run
  that long.

  On the central gap. This entry curates a mechanism it cannot complete. Each
  step from prolonged febrile seizure through inflammation and blood-brain
  barrier failure to cytotoxic oedema, hemiatrophy, and late epilepsy is
  supported, but none of it explains the syndrome's defining feature, which is
  that the injury respects the midline. The standard review states plainly that
  the proposed factors cannot account for the elective involvement of an entire
  hemisphere. That is recorded as an explicit knowledge gap rather than smoothed
  over with a plausible-sounding chain, and the graph carries a node whose
  content is honestly incomplete.

  Sourcing note. The entry was drafted from the standard review and the clinical
  summaries, then cross-checked against a deep-research report generated with the
  falcon provider (Edison Scientific), committed here as
  research/Hemiconvulsion-Hemiplegia-Epilepsy_Syndrome-deep-research-falcon.md.
  One property of that report shapes how it was used: it states in its own
  evidence-limitations section that direct abstract quotations could not be
  supplied reliably, because most articles on this syndrome were not available as
  searchable full text, and that it therefore omitted PMIDs rather than risk
  supplying incorrect identifiers. That is the right call by the tool, and the
  consequence for curation is that the report was used as a completeness
  cross-check only. No snippet in this entry is taken from it; every quotation
  here comes from a reference fetched and verified against its own cache. The
  report also records that an Open Targets query for this syndrome returned zero
  results, which is itself informative about how little tractable target biology
  exists here.

  Module conformance note. Two nodes conform to
  epilepsy_excitation_inhibition_imbalance, at the hyperexcitability and
  recurrent-seizure nodes. The module's ion-channel trigger is not claimed: the
  proximal event is a prolonged provoked seizure in a normally developing child,
  not a channel defect, and the late epilepsy arises from acquired structural
  damage.
inheritance:
  - name: Not inherited; genetic factors as predisposition only
    description: >-
      The syndrome is acquired, arising from an event rather than a genotype, and
      it is not transmitted. Genetics enters only as one of several factors that
      may let a febrile seizure run long enough to do damage, which puts it
      alongside a focal epileptogenic lesion rather than in a causal role of its
      own. There is no recurrence risk to counsel on in the usual sense.
    inheritance_term:
      preferred_term: Sporadic
      term:
        id: HP:0003745
        label: Sporadic
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          predisposing factors facilitating prolonged seizure such as genetic
          factors or focal epileptogenic lesion
        explanation: >-
          Places genetic factors as predisposing to the prolonged seizure rather
          than causing the syndrome, which is why this block records sporadic
          occurrence with a genetic contribution to susceptibility only.
pathophysiology:
  - name: Predisposing Factors Facilitating Prolonged Seizure
    biological_scale: ORGANISM
    description: >-
      An upstream node covering what makes a particular child's febrile seizure
      run on rather than stop. It is also where the boundary between idiopathic
      and symptomatic cases sits. Two kinds of predisposition are recognized: a
      focal epileptogenic lesion, which in some cases is a mild cortical
      malformation only found after surgery, and genetic factors, for which
      CACNA1A is the one gene the primary literature names in connection with
      this syndrome. This node is deliberately upstream of, and not identical
      with, the status epilepticus itself; it is why some children with prolonged
      febrile seizures develop the syndrome and most do not. It is not a
      necessary node, since the syndrome occurs in children with no identified
      predisposition at all.
    downstream:
      - target: Prolonged Unilateral Febrile Status Epilepticus
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          predisposing factors facilitating prolonged seizure such as genetic
          factors or focal epileptogenic lesion
        explanation: >-
          Names both branches of predisposition explicitly, and frames them as
          facilitating the prolongation of the seizure rather than as causes of
          the syndrome, which is exactly the position this node occupies.
      - reference: PMID:31824410
        reference_title: >-
          Three Cases of Hemiconvulsion-Hemiplegia-Epilepsy Syndrome With Focal
          Cortical Dysplasia Type IIId.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The epileptogenic mild cortical malformations may be the cause of HHES.
        explanation: >-
          The lesional branch made concrete: in three surgical cases the
          predisposing lesion was a focal cortical dysplasia identified only on
          pathology, which is why an initially normal scan does not exclude a
          structural predisposition.
  - name: Prolonged Unilateral Febrile Status Epilepticus
    biological_scale: ORGANISM
    description: >-
      The initiating event, and it is an event rather than a state: a convulsive
      seizure during a febrile illness in a child under about four, clonic and
      predominantly one-sided, which does not stop. Everything that follows is
      downstream of how long it ran. This is also why the syndrome is in principle
      preventable in a way most epilepsies are not, since the damage accrues
      during a window in which someone could be terminating the seizure.
    downstream:
      - target: Inflammation and Blood-Brain Barrier Breakdown
      - target: Unexplained Hemispheric Selectivity
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Hemiconvulsion-Hemiplegia (HH) syndrome is an uncommon consequence of
          prolonged focal febrile convulsive seizures in infancy and early
          childhood.
        explanation: >-
          Names the initiating event and its age window, which is what this node
          models.
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          It is characterized by the occurrence of prolonged clonic seizures with
          unilateral predominance occurring in a child and followed by the
          development of hemiplegia.
        explanation: >-
          Establishes the unilateral predominance of the seizure itself, the first
          appearance of the lateralization this entry cannot explain.
  - name: Inflammation and Blood-Brain Barrier Breakdown
    biological_scale: TISSUE
    description: >-
      Two processes are proposed to convert a long seizure into tissue injury, and
      they reinforce each other. Fever and the underlying illness supply an
      inflammatory context thought to worsen the cell injury a seizure inflicts,
      and inflammation together with sustained ictal activity is proposed to
      compromise the blood-brain barrier. A leaking barrier in a seizing
      hemisphere is a plausible route from electrical activity to the oedema seen
      on imaging. Both remain proposals rather than demonstrations here.
    biological_processes:
      - preferred_term: inflammatory response
        term:
          id: GO:0006954
          label: inflammatory response
        modifier: INCREASED
    downstream:
      - target: Acute Unilateral Cytotoxic Oedema
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          prolonged febrile seizure in which inflammation may worsen the level of
          cell injury; 2. inflammation and prolonged ictal activity that act on
          blood-brain-barrier permeability
        explanation: >-
          States both proposed mechanisms this node models, as contributory factors
          rather than established steps.
  - name: Unexplained Hemispheric Selectivity
    biological_scale: TISSUE
    description: >-
      The node this entry cannot fill, kept explicit rather than hidden. Whatever
      converts a prolonged seizure into injury does so on one side of the brain
      and stops at the midline, and the review that assembles the candidate
      mechanisms concludes that none of them accounts for this. Suggested
      directions include the maturational state of interhemispheric connections,
      the corpus callosum in particular, and genetic factors, but these are
      offered as hypotheses to test rather than answers. Any model of this
      syndrome that does not explain the midline is incomplete, and this one does
      not.
    locations:
      - preferred_term: cerebral hemisphere
        term:
          id: UBERON:0001869
          label: cerebral hemisphere
    downstream:
      - target: Acute Unilateral Cytotoxic Oedema
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          However, these factors cannot explain the elective involvement of an
          entire hemisphere.
        explanation: >-
          The authors' own statement that the assembled mechanisms fail to account
          for the lateralization, which is what this node encodes.
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          We draw new hypothesis that may explain the involvement of one
          hemisphere such as maturation of brain structure such as corpus callosum
          or genetic factors (CACNA1A gene) that are specifically discussed.
        explanation: >-
          Records the proposed directions. Marked PARTIAL because the source
          presents them explicitly as new hypotheses rather than findings.
  - name: Acute Unilateral Cytotoxic Oedema
    biological_scale: TISSUE
    description: >-
      During and immediately after the status epilepticus, imaging shows the
      seizing hemisphere swollen with cytotoxic oedema, meaning water has moved
      into cells that are failing rather than into the interstitium. This is the
      acute radiological signature and the point at which the diagnosis can be
      made rather than inferred in retrospect, which matters because it is also
      the only point at which intervention could plausibly alter the outcome.
    locations:
      - preferred_term: cerebral hemisphere
        term:
          id: UBERON:0001869
          label: cerebral hemisphere
    downstream:
      - target: Hemiplegia
      - target: Progressive Cerebral Hemiatrophy
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Neuroradiological studies showed unilateral edematous swelling of the
          epileptic hemisphere at the time of initial status epilepticus (SE).
        explanation: >-
          Documents the acute swelling and its timing relative to the status
          epilepticus.
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Neuroimaging show unilateral cytotoxic oedema at the initial convulsive
          state, followed by severe chronic atrophy of the affected hemisphere.
        explanation: >-
          Independently confirms the cytotoxic character of the oedema and its
          progression to atrophy.
  - name: Hemiplegia
    biological_scale: ORGANISM
    description: >-
      Weakness of the side opposite the affected hemisphere, present when the
      seizure stops rather than developing later, which distinguishes it from a
      post-ictal Todd paresis that resolves. Its degree varies and it is the
      second element of the syndrome's name.
    evidence:
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Various degrees of hemiplegia and within a variable interval, subsequent
          epilepsia follows.
        explanation: >-
          Documents the variable severity of the hemiplegia and its position before
          the epilepsy.
  - name: Progressive Cerebral Hemiatrophy
    biological_scale: TISSUE
    description: >-
      Over the months after the acute event the swollen hemisphere shrinks, ending
      in severe chronic atrophy of that side alone. The swelling and the atrophy
      are the same process seen at two timepoints, which is why serial imaging is
      more informative than any single scan, and why a scan obtained late shows a
      picture that could be mistaken for a congenital malformation.
    locations:
      - preferred_term: cerebral hemisphere
        term:
          id: UBERON:0001869
          label: cerebral hemisphere
    downstream:
      - target: Epileptogenic Reorganization of the Damaged Hemisphere
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This acute phase is followed by characteristic cerebral hemiatrophy with
          subsequent appearance of epilepsy, so called
          Hemiconvulsion-Hemiplegia-Epilepsy (HHE) syndrome.
        explanation: >-
          States the progression from acute phase to hemiatrophy to epilepsy, the
          sequence that defines the full syndrome.
  - name: Epileptogenic Reorganization of the Damaged Hemisphere
    biological_scale: CELLULAR
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Seizure Generation and Epileptogenesis"
    description: >-
      Between the hemiatrophy and the epilepsy there is a latent interval, the
      classic signature of epileptogenesis rather than of ongoing seizures: the
      damaged tissue reorganizes into a network that generates seizures, and that
      takes time. The interval is variable, which is part of why the eventual
      epilepsy can seem to arrive out of nowhere in a child whose acute illness
      was months or years earlier.
    downstream:
      - target: Drug-Resistant Focal Epilepsy from the Affected Hemisphere
    evidence:
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Various degrees of hemiplegia and within a variable interval, subsequent
          epilepsia follows.
        explanation: >-
          Documents the latent and variable interval before the epilepsy appears,
          which makes this a reorganization step rather than a direct continuation.
  - name: Drug-Resistant Focal Epilepsy from the Affected Hemisphere
    biological_scale: ORGANISM
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
    description: >-
      The third element of the name and the reason this is a lifelong diagnosis
      rather than an acute illness. Seizures arise from the atrophic hemisphere
      and are typically refractory to medication, which is what brings these
      children to epilepsy surgery: the damaged side is already largely
      non-functional and the healthy side has had years to take over, so
      disconnection has an unusually favourable ratio of benefit to further loss.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This acute phase is followed by characteristic cerebral hemiatrophy with
          subsequent appearance of epilepsy, so called
          Hemiconvulsion-Hemiplegia-Epilepsy (HHE) syndrome.
        explanation: >-
          Establishes that the epilepsy is the defining third stage rather than an
          incidental comorbidity.

progression:
  - phase: Acute hemiconvulsive status with hemiplegia and hemispheric swelling
    age_range: Under four years
    notes: >-
      The seizure, the hemiplegia, and the unilateral oedema all belong to the
      same acute episode, over hours to days. This is the only phase in which the
      process is plausibly modifiable, which is why early recognition is
      emphasized in every account of the syndrome.
    evidence:
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          To improve the outcome, further studies are needed and early diagnosis
          is essential.
        explanation: >-
          States the emphasis on early diagnosis that this phase turns on.
  - phase: Hemiatrophy and a latent interval, then epilepsy
    age_range: Months to years after the acute event
    notes: >-
      The swollen hemisphere becomes atrophic, and after a variable latent
      interval a drug-resistant focal epilepsy emerges from it. The interval makes
      the causal link easy to miss when a child presents years later with seizures
      and an atrophic hemisphere.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This acute phase is followed by characteristic cerebral hemiatrophy with
          subsequent appearance of epilepsy, so called
          Hemiconvulsion-Hemiplegia-Epilepsy (HHE) syndrome.
        explanation: >-
          States the sequence of phases this record describes.
genetic:
  - name: CACNA1A
    gene_term:
      preferred_term: CACNA1A
      term:
        id: hgnc:1388
        label: CACNA1A
    relationship_type: SUSCEPTIBILITY
    notes: >-
      The one gene the primary literature names in connection with this syndrome,
      and it is named as a hypothesis about the unexplained hemispheric
      selectivity rather than as an established cause. CACNA1A encodes a neuronal
      calcium channel already implicated in hemiplegic migraine and in
      febrile-seizure-associated phenotypes, which is what makes it a plausible
      candidate for a channel-level predisposition to a prolonged, lateralized
      febrile seizure. It is curated as SUSCEPTIBILITY, not as causative: this is
      not a monogenic disorder, the great majority of cases are sporadic, and no
      cohort has established a CACNA1A variant burden in this syndrome. The
      corresponding open question is carried in the hhe_why_only_one_hemisphere
      discussion.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          We draw new hypothesis that may explain the involvement of one
          hemisphere such as maturation of brain structure such as corpus callosum
          or genetic factors (CACNA1A gene) that are specifically discussed.
        explanation: >-
          The only source-supported naming of a specific gene for this syndrome.
          Marked PARTIAL because the authors present it explicitly as a new
          hypothesis they go on to discuss, not as a demonstrated association.
  - name: SCN1A
    gene_term:
      preferred_term: SCN1A
      term:
        id: hgnc:10585
        label: SCN1A
    relationship_type: SUSCEPTIBILITY
    frequency: rare predisposing cause; 1 of 11 screened patients
    notes: >-
      Included because the negative result is worth curating explicitly. SCN1A
      was a natural candidate, since this syndrome and Dravet syndrome share a
      great deal clinically, both turning on prolonged fever-provoked seizures in
      infancy, and Dravet is more than two-thirds explained by SCN1A. Direct
      sequencing of eleven patients found exactly one mutation, in a patient who
      also met criteria for Dravet, and none in the remaining ten. The reading is
      that SCN1A is a rare predisposing cause rather than the gene of this
      syndrome, and that a child with both an SCN1A mutation and this clinical
      picture may be better understood as having Dravet syndrome with a
      hemiconvulsive presentation. Curating the negative lets the entry say
      affirmatively what it is not: a monogenic sodium channelopathy.
    evidence:
      - reference: PMID:23916143
        reference_title: >-
          Low incidence of SCN1A genetic mutation in patients with
          hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Our study suggests that SCN1A genetic mutation is only a rare
          predisposing cause of HHE syndrome.
        explanation: >-
          The authors' own conclusion, which is precisely the SUSCEPTIBILITY
          rather than causative relationship curated here.
      - reference: PMID:23916143
        reference_title: >-
          Low incidence of SCN1A genetic mutation in patients with
          hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Direct sequencing of all coding exons and flanking intronic sequences
          of the SCN1A gene was performed, but we failed to identify additional
          mutations in 10 patients.
        explanation: >-
          Marked REFUTE against the proposition that SCN1A explains this
          syndrome. Ten of eleven patients had no mutation on full coding
          sequencing, which is the direct negative evidence.
treatments:
  - name: Epilepsy surgery, functional hemispherotomy
    description: >-
      For the drug-resistant epilepsy that follows, disconnection of the damaged
      hemisphere. The rationale is unusually clean for epilepsy surgery: the
      seizures arise from a hemisphere that is already destroyed and already
      producing a hemiplegia, so the functional cost of disconnecting it has
      largely been paid by the disease. This is the one intervention that
      addresses the chronic epilepsy at its source rather than suppressing it,
      and in the reported surgical cases it was reached only after antiseizure
      drugs failed.
    therapeutic_modality: SURGERY
    treatment_term:
      preferred_term: Surgical Procedure
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    target_mechanisms:
      - target: Drug-Resistant Focal Epilepsy from the Affected Hemisphere
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:31824410
        reference_title: >-
          Three Cases of Hemiconvulsion-Hemiplegia-Epilepsy Syndrome With Focal
          Cortical Dysplasia Type IIId.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Their seizures were intractable with antiepileptic drugs and required
          hemispherotomy.
        explanation: >-
          Establishes both that the epilepsy is drug-resistant and that
          hemispherotomy is the intervention it is escalated to.
  - name: Aggressive termination of the status epilepticus
    description: >-
      The one intervention with a mechanistic claim on the outcome, because the
      injury accrues while the seizure runs. Everything else in this entry treats
      consequences. The corollary is uncomfortable and worth stating: by the time
      the syndrome is recognizable as itself, the treatable window has usually
      closed, which is why the literature stresses early diagnosis rather than
      novel therapy.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Prolonged Unilateral Febrile Status Epilepticus
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          To improve the outcome, further studies are needed and early diagnosis
          is essential.
        explanation: >-
          Supports the emphasis on acting early. Marked PARTIAL because it calls
          for early diagnosis and further study rather than demonstrating that any
          particular acute treatment changes the outcome, which is the honest state
          of the evidence.
      - reference: PMID:29414550
        reference_title: >-
          Clinical aspects, neuroimaging, and electroencephalography of 35 cases
          of hemiconvulsion-hemiplegia syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          On the one hand, authors highlight the need for improving emergency
          care of status epilepticus.
        explanation: >-
          A recommendation about status epilepticus management specifically,
          rather than about the syndrome in general, which is what this treatment
          record asserts.
  - name: Prophylaxis of febrile seizures
    description: >-
      Upstream of everything else. Because the syndrome is the consequence of a
      prolonged febrile seizure, preventing or shortening febrile seizures
      prevents the syndrome outright, and in settings where emergency care of
      status epilepticus is hard to deliver reliably this is argued to be the
      more realistic lever of the two. That is a statement about health systems
      as much as about biology, and the source makes it in exactly those terms.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Supportive Care
      term:
        id: NCIT:C15747
        label: Supportive Care
    target_mechanisms:
      - target: Prolonged Unilateral Febrile Status Epilepticus
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:29414550
        reference_title: >-
          Clinical aspects, neuroimaging, and electroencephalography of 35 cases
          of hemiconvulsion-hemiplegia syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          On the other hand, in our context, the prophylaxis of febrile seizures
          seems to be the corner stone of the prevention of HHE Syndrome.
        explanation: >-
          Names febrile-seizure prophylaxis as the cornerstone of prevention, and
          scopes the claim to the authors' own setting, which is why the
          description keeps that qualification.
  - name: Antiseizure medication for the established epilepsy
    description: >-
      Medication is used for the late focal epilepsy and frequently fails, which
      is what brings these children to surgical assessment. Its role is symptom
      control rather than modification of the underlying damage, which is fixed by
      the time it is prescribed.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Drug-Resistant Focal Epilepsy from the Affected Hemisphere
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          understanding of the underlying mechanisms of HHE are needed to improve
          the outcome of this condition
        explanation: >-
          Supports the position that outcomes are currently unsatisfactory and
          depend on mechanistic understanding not yet available. Marked PARTIAL
          because it speaks to the state of the field rather than to the efficacy
          of any drug.
diagnosis:
  - name: Brain MRI, acute and serial
    description: >-
      Imaging is what makes the diagnosis, and the timing changes what it shows.
      Acutely the affected hemisphere is swollen with cytotoxic oedema; months
      later the same hemisphere is atrophic. A single late scan can therefore be
      misread as a congenital or long-standing abnormality, which is an argument
      for imaging during the acute illness rather than only afterwards.
    diagnosis_term:
      preferred_term: Magnetic Resonance Imaging
      term:
        id: NCIT:C16809
        label: Magnetic Resonance Imaging
    results: >-
      Unilateral hemispheric swelling with cytotoxic oedema acutely; severe
      unilateral hemiatrophy on later imaging.
    evidence:
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Neuroimaging show unilateral cytotoxic oedema at the initial convulsive
          state, followed by severe chronic atrophy of the affected hemisphere.
        explanation: >-
          States both imaging appearances and their timing, which is the content of
          the results field.
  - name: Electroencephalography
    description: >-
      Electroencephalography documents the lateralized ictal activity during the
      acute episode and later characterizes the focal epilepsy arising from the
      damaged hemisphere, which is the information a surgical assessment needs.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    results: >-
      Lateralized ictal activity acutely; later, focal epileptiform abnormality
      over the atrophic hemisphere.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Neuroradiological studies showed unilateral edematous swelling of the
          epileptic hemisphere at the time of initial status epilepticus (SE).
        explanation: >-
          Establishes that the hemisphere involved is the epileptic one, which is
          the lateralization electroencephalography demonstrates. Marked PARTIAL
          because the quoted sentence reports imaging rather than electrographic
          findings.
differential_diagnoses:
  - name: Rasmussen Encephalitis
    disease_term:
      preferred_term: Rasmussen subacute encephalitis
      term:
        id: MONDO:0016019
        label: Rasmussen subacute encephalitis
    description: >-
      The other childhood syndrome that destroys one hemisphere and leaves a
      drug-resistant epilepsy, and the closest mimic on a late scan. The
      distinction is tempo: here the damage is done in a single acute episode and
      then stops, whereas Rasmussen is a progressive inflammatory process that
      keeps consuming the hemisphere over years.
    distinguishing_features:
      - Damage is inflicted in one acute episode rather than accruing progressively over years.
      - Onset is a febrile status epilepticus, not an insidious increase in seizure frequency.
      - Hemiplegia appears at the outset rather than developing as the hemisphere is progressively lost.
      - No histological evidence of ongoing T-cell-mediated encephalitis.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This acute phase is followed by characteristic cerebral hemiatrophy with
          subsequent appearance of epilepsy, so called
          Hemiconvulsion-Hemiplegia-Epilepsy (HHE) syndrome.
        explanation: >-
          Establishes the monophasic acute-then-atrophy course that distinguishes
          this syndrome from a progressive encephalitis producing the same endpoint.
  - name: Dravet Syndrome
    disease_term:
      preferred_term: Dravet syndrome
      term:
        id: MONDO:0100135
        label: Dravet syndrome
    description: >-
      Arguably the most consequential differential, because the two syndromes
      share the thing that defines this one: prolonged, often hemiclonic,
      fever-provoked seizures in the first years of life. The overlap is close
      enough that it motivated screening this syndrome for SCN1A in the first
      place, and close enough that a child can satisfy both descriptions. The
      separation matters because Dravet is a monogenic channelopathy with its own
      trajectory and its own contraindicated drugs, whereas this syndrome is an
      acquired hemispheric injury.
    distinguishing_features:
      - Seizures in Dravet recur and diversify over years rather than being a single destructive event followed by a latent interval.
      - Dravet produces no unilateral hemispheric atrophy and no fixed hemiplegia.
      - SCN1A mutation is found in more than two-thirds of classic Dravet but in only a small minority here.
      - Developmental slowing in Dravet begins in the second year without a discrete injury to date it from.
    evidence:
      - reference: PMID:23916143
        reference_title: >-
          Low incidence of SCN1A genetic mutation in patients with
          hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A role for SCN1A genetic mutations in the development of
          hemiconvulsion-hemiplegia-epilepsy (HHE) syndrome was recently
          suggested based on the observation that HHE syndrome and classic Dravet
          syndrome share many clinical features.
        explanation: >-
          States the clinical overlap that makes this differential necessary, and
          explains why the two were suspected of sharing a genetic basis.
      - reference: PMID:23916143
        reference_title: >-
          Low incidence of SCN1A genetic mutation in patients with
          hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We previously identified a 2 bp-deletion mutation in SCN1A in a Dravet
          patient, and we found out the patient also had HHE syndrome upon
          clinical re-evaluation.
        explanation: >-
          Documents that a single patient can carry both diagnoses, which is why
          the separation is drawn on trajectory and imaging rather than on the
          acute presentation alone.
  - name: Febrile Infection-Related Epilepsy Syndrome
    disease_term:
      preferred_term: febrile infection-related epilepsy syndrome
      term:
        id: MONDO:0015584
        label: febrile infection-related epilepsy syndrome
    description: >-
      Classified by the ILAE alongside this syndrome and sharing the essential
      setup, a febrile illness in a previously well child followed by refractory
      status and then chronic epilepsy. The separation is topographic: FIRES is
      bilateral and diffuse, this syndrome takes one hemisphere.
    distinguishing_features:
      - Status epilepticus is bilateral and refractory rather than unilateral and clonic.
      - No hemiplegia and no unilateral hemiatrophy.
      - Onset typically in school-age children rather than under four.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and definition of
          epilepsy syndromes with onset in childhood: Position paper by the ILAE
          Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          developmental and/or epileptic encephalopathies, comprising five
          syndromes: epilepsy with myoclonic-atonic seizures, Lennox-Gastaut
          syndrome, developmental and/or epileptic encephalopathy with
          spike-and-wave activation in sleep, hemiconvulsion-hemiplegia-epilepsy
          syndrome, and febrile infection-related epilepsy syndrome.
        explanation: >-
          Establishes that the ILAE treats these as two distinct syndromes within
          the same category, which is what makes the differentiation necessary.
discussions:
  - discussion_id: hhe_why_only_one_hemisphere
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      Every proposed mechanism for this syndrome, prolonged seizure activity,
      inflammation, blood-brain barrier failure, is bilateral in principle. Why
      does the injury take one entire hemisphere and stop at the midline?
    attaches_to:
      - pathophysiology#Unexplained Hemispheric Selectivity
      - pathophysiology#Acute Unilateral Cytotoxic Oedema
    rationale: >-
      This is the defining feature of the syndrome and the one thing no account of
      it explains. The review that assembles the candidate mechanisms says so
      directly: the factors it lists cannot explain the elective involvement of an
      entire hemisphere. The difficulty is structural rather than evidential.
      Prolonged seizure activity, fever, systemic inflammation, and barrier
      permeability are all whole-brain phenomena, so none has the geometry to
      produce a lesion bounded by the midline. Something must supply the
      lateralization, and the candidates fall into three families. It could
      originate in the seizure itself, if the discharge stays confined to one
      hemisphere because interhemispheric propagation is limited in the immature
      brain, which is where the corpus callosum hypothesis comes from and which
      would make this a disease of a developmental window rather than of any
      particular insult. It could be vascular or metabolic, if unilateral
      hyperperfusion or a unilateral failure of autoregulation determines which
      side decompensates. Or the child could carry a pre-existing asymmetry,
      subtle enough to be invisible on imaging, that makes one hemisphere both
      likelier to sustain the seizure and likelier to be injured by it. That last
      branch is the one with a named molecular candidate: the same review that
      raises these hypotheses points specifically at CACNA1A, a neuronal calcium
      channel gene already tied to hemiplegic migraine, as the genetic factor
      worth pursuing. It is curated in the genetic section as SUSCEPTIBILITY
      rather than as a cause, because it has been proposed and discussed but
      never tested in a cohort with this syndrome, and a channel-level
      predisposition is only one of several routes to a pre-existing asymmetry.
      The lesional counterpart of the same branch is concrete rather than
      hypothetical: three surgical cases turned out to have a focal cortical
      dysplasia that no scan had shown. These make
      different predictions and none has been tested head to head. The stake is
      practical as well as intellectual: if lateralization is set by the seizure's
      propagation, then interrupting propagation early is protective, whereas if
      it reflects a pre-existing asymmetry, the die is cast before the child ever
      seizes.
    proposed_experiments:
      - experiment_id: exp_hhe_acute_lateralization_imaging_cohort
        name: Acute multimodal imaging in prolonged unilateral febrile status
        description: >-
          Prospectively image children presenting with prolonged lateralized
          febrile status during the acute episode, combining perfusion imaging,
          diffusion, and barrier-permeability sequences over both hemispheres, and
          follow them for the development of hemiatrophy and epilepsy. The
          unaffected hemisphere is the internal control the retrospective
          literature never has.
        decision_criterion: >-
          If the hemispheres differ in perfusion or barrier permeability before
          oedema is established, the lateralization is haemodynamic or vascular and
          is potentially modifiable acutely. If the two are indistinguishable until
          oedema appears, the determinant lies upstream in seizure propagation or
          in a pre-existing asymmetry.
      - experiment_id: exp_hhe_callosal_maturation_comparison
        name: Callosal maturation in affected children versus matched febrile status controls
        description: >-
          Compare corpus callosum size and diffusion metrics between children who
          developed the syndrome and age-matched children who had prolonged febrile
          status without it, using imaging obtained as close to the event as
          possible.
        decision_criterion: >-
          A systematic difference in callosal maturation would support the
          interhemispheric-propagation hypothesis and would predict that the age
          window of the syndrome tracks callosal development. No difference would
          effectively close that line and redirect attention to vascular and
          pre-existing-asymmetry accounts.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          However, these factors cannot explain the elective involvement of an
          entire hemisphere.
        explanation: >-
          The explicit statement that the assembled mechanisms fail on the
          syndrome's defining feature, which makes this a genuine gap rather than a
          curator's doubt.
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          We draw new hypothesis that may explain the involvement of one
          hemisphere such as maturation of brain structure such as corpus callosum
          or genetic factors (CACNA1A gene) that are specifically discussed.
        explanation: >-
          Names the interhemispheric-maturation and genetic directions that two of
          the proposed experiments are designed to separate.
      - reference: PMID:25534340
        reference_title: Hemiconvulsion-hemiplegia-epilepsy syndrome.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The aetiology remains unclear. Several mechanisms may contribute to this
          condition. To improve the outcome, further studies are needed and early
          diagnosis is essential.
        explanation: >-
          Independent confirmation from a separate summary that the cause is
          unresolved and plural rather than settled, which is why this is curated
          as an open gap rather than a contested one.
  - discussion_id: hhe_immature_brain_resistance_paradox
    kind: CONTROVERSY
    status: UNDER_DISCUSSION
    prompt: >-
      Experimental work indicates the immature brain resists seizure-induced cell
      injury, yet this syndrome destroys a hemisphere precisely in that age group.
      Is the animal evidence not transferable, or is the human injury produced by
      something other than the seizure itself?
    attaches_to:
      - pathophysiology#Inflammation and Blood-Brain Barrier Breakdown
      - pathophysiology#Acute Unilateral Cytotoxic Oedema
    rationale: >-
      The review states that basic science data suggest the immature brain is
      relatively resistant to injury from status epilepticus. Taken at face value
      that is in direct tension with a syndrome whose entire clinical content is
      catastrophic injury from status epilepticus in children under four. Three
      readings are available. The first treats it as a translation failure: rodent
      models of status may not reproduce the human situation, and the resistance
      seen experimentally may not hold for a seizure of this duration in a febrile
      child. The second, which the review's own emphasis points toward, is that
      the seizure alone is not what does the damage; the injury requires the
      inflammatory context of the febrile illness, and the resistant immature
      brain becomes vulnerable only when inflammation and barrier breakdown are
      added. That reading is attractive because it explains why the syndrome
      follows febrile status specifically rather than status of any cause, and it
      makes fever a mechanistic participant rather than a trigger. The third is
      that the resistance is real and the syndrome occurs only in the minority of
      children in whom some additional factor overrides it, which converts the
      question into one about predisposition. Distinguishing these matters for
      whether anti-inflammatory treatment during the acute episode is worth
      studying, which on the second reading it clearly would be and on the first
      and third much less so.
    proposed_experiments:
      - experiment_id: exp_hhe_inflammatory_markers_in_febrile_status
        name: Inflammatory profiling in prolonged febrile status with and without the syndrome
        description: >-
          Measure serum and cerebrospinal fluid inflammatory markers during
          prolonged febrile status epilepticus in children, and compare those who
          go on to develop hemiplegia and hemiatrophy with those who recover
          without sequelae, matched for seizure duration.
        decision_criterion: >-
          A higher inflammatory burden in those who develop the syndrome, at
          matched seizure duration, would support inflammation as the necessary
          co-factor and would make acute immunomodulation a rational thing to
          trial. Comparable inflammation with outcome tracking seizure duration
          alone would place the weight back on the seizure and on how fast it is
          stopped.
    evidence:
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The basic science data suggest that immature brain is relatively
          resistant to SE-induced cell injury.
        explanation: >-
          States the experimental finding that stands in tension with the clinical
          syndrome. Tagged MODEL_ORGANISM because the resistance is a basic-science
          result rather than a human observation, which is itself the first
          interpretation this discussion weighs.
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          prolonged febrile seizure in which inflammation may worsen the level of
          cell injury; 2. inflammation and prolonged ictal activity that act on
          blood-brain-barrier permeability
        explanation: >-
          States the inflammatory co-factor reading, the second and most actionable
          of the three interpretations weighed here.
      - reference: PMID:22341151
        reference_title: >-
          Hemiconvulsion-hemiplegia-epilepsy syndrome: current understandings.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          predisposing factors facilitating prolonged seizure such as genetic
          factors or focal epileptogenic lesion
        explanation: >-
          Supports the predisposition reading. Marked PARTIAL because these factors
          are offered as facilitating the prolonged seizure rather than overriding a
          resistance to injury, so they bear on the third interpretation only
          indirectly.

    explanation: Establishes the CSF biochemical signature (elevated 3-O-methyldopa alongside low HVA and 5-HIAA) that differentiates AADC deficiency from DRD.
treatments:
- name: Low-dose Levodopa/Carbidopa Therapy
  description: >-
    Low-dose levodopa combined with a peripheral aromatic L-amino acid
    decarboxylase inhibitor (carbidopa or benserazide) is the first-line,
    disease-defining therapy across all DRD subtypes. By supplying L-dopa
    directly downstream of the BH4-dependent tyrosine hydroxylation step, it
    restores central dopamine synthesis in intact nigrostriatal terminals and
    achieves rapid, complete or near-complete, and durable resolution of
    dystonia and parkinsonism without the motor fluctuations typical of
    neurodegenerative parkinsonism.

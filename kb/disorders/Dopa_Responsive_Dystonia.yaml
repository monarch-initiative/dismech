differential_diagnoses:
- name: Hereditary Spastic Paraplegia
  description: >-
    Autosomal dominant GCH1-deficient DRD frequently presents with lower-limb
    dystonic hypertonia, gait disturbance, and brisk tendon reflexes that
    mimic hereditary spastic paraplegia (HSP) for decades before basal ganglia
    signs emerge.
  distinguishing_features:
  - Diurnal fluctuation of gait symptoms and dramatic response to low-dose levodopa
  - Pathogenic variant in GCH1 (or TH/SPR) rather than spastic paraplegia genes (e.g., SPAST)
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:

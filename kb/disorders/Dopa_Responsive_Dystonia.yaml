name: Dopa-Responsive Dystonia
creation_date: '2026-05-12T00:00:00Z'
description: >-
  Dopa-responsive dystonia (DRD) is a group of rare neurometabolic disorders
  in which inherited defects of dopamine and tetrahydrobiopterin (BH4)
  biosynthesis or recycling cause childhood-onset or infantile-onset dystonia
  that responds dramatically and durably to low-dose levodopa. Autosomal
  dominant DRD is caused by heterozygous pathogenic variants in GCH1 (Segawa
  disease / GTPCH1-deficient DRD, DYT/PARK-GCH1); it classically presents as
  childhood foot dystonia (equinovarus posture) with diurnal fluctuation and
  female predominance that may generalize and evolve into parkinsonism later
  in life. Autosomal recessive DRD is caused by biallelic pathogenic variants
  in TH (tyrosine hydroxylase deficiency, DYT/PARK-TH), SPR (sepiapterin
  reductase deficiency, DYT/PARK-SPR), GCH1, PTS, or QDPR; its phenotype spans
  classic levodopa-responsive childhood dystonia, sleep and psychiatric
  disturbances with oculogyric crises in SPR deficiency, infantile parkinsonism
  with motor delay, and progressive infantile encephalopathy. Subtype-specific
  detail is further curated in `Autosomal_Dominant_Dopa_Responsive_Dystonia`
  and `Autosomal_Recessive_Dopa_Responsive_Dystonia`.
synonyms:
- DRD
- Segawa syndrome
- DYT5
- hereditary progressive dystonia with marked diurnal fluctuation
categories:
- Movement Disorder
- Inborn Error of Metabolism
- Pediatric Neurological Disease
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: ENDOCRINOLOGY_METABOLISM
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  icimd_category:
  - classification_value: tetrahydrobiopterin_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      tetrahydrobiopterin metabolism" under category "Disorders of vitamin and
      cofactor metabolism" (GCH1, PTS, SPR, QDPR deficiencies).
  - classification_value: monoamine_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of
      monoamine neurotransmitter metabolism" under category "Neurotransmitter
      disorders" (TH deficiency).
has_subtypes:
- name: AD-DRD
  display_name: Autosomal Dominant Dopa-Responsive Dystonia
  curated_in: Autosomal_Dominant_Dopa_Responsive_Dystonia
  subtype_term:
    preferred_term: autosomal dominant dopa-responsive dystonia
    term:
      id: MONDO:0971063
      label: autosomal dominant dopa-responsive dystonia
  description: >-
    Caused by heterozygous GCH1 pathogenic variants (Segawa disease /
    GTPCH1-deficient DRD, DYT/PARK-GCH1; MONDO:0971063). Curated in
    `Autosomal_Dominant_Dopa_Responsive_Dystonia`.
  evidence:
  - reference: PMID:20301681
    reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GTP cyclohydrolase 1-deficient dopa-responsive dystonia (GTPCH1-deficient
      DRD) is characterized by childhood-onset dystonia and a dramatic and
      sustained response to low doses of oral administration of levodopa.
    explanation: GeneReviews characterizes autosomal dominant GTPCH1-deficient DRD as the classic childhood-onset subtype.
- name: AR-DRD
  display_name: Autosomal Recessive Dopa-Responsive Dystonia
  curated_in: Autosomal_Recessive_Dopa_Responsive_Dystonia
  subtype_term:
    preferred_term: TH-deficient dopa-responsive dystonia
    term:
      id: MONDO:0011551
      label: TH-deficient dopa-responsive dystonia
  description: >-
    Anchored in MONDO/Orphanet (MONDO:0011551 / ORPHA:101150) to autosomal
    recessive TH (tyrosine hydroxylase)-deficient DRD (DYT5b / DYT/PARK-TH),
    and curated in `Autosomal_Recessive_Dopa_Responsive_Dystonia` alongside
    recessive BH4-deficient forms due to biallelic GCH1, PTS, and QDPR
    variants. Phenotypic spectrum spans levodopa-responsive childhood dystonia,
    infantile parkinsonism with motor delay, and progressive infantile
    encephalopathy.
  evidence:
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with TH-deficient dopa-responsive dystonia (DYT5b,
      DYT-TH), onset is between age 12 months and 12 years; initial symptoms
      are typically lower-limb dystonia and/or difficulty in walking.
    explanation: GeneReviews characterizes TH-deficient dopa-responsive dystonia (DYT5b) as the core autosomal recessive subtype.
- name: SPR-DRD
  display_name: Sepiapterin Reductase-Deficient Dopa-Responsive Dystonia
  subtype_term:
    preferred_term: dopa-responsive dystonia due to sepiapterin reductase deficiency
    term:
      id: MONDO:0012994
      label: dopa-responsive dystonia due to sepiapterin reductase deficiency
  description: >-
    Autosomal recessive DRD caused by biallelic pathogenic variants in SPR,
    classified in MONDO as a distinct disease entity (MONDO:0012994) alongside
    TH-deficient AR-DRD (MONDO:0011551). Impairs terminal de novo BH4
    biosynthesis and recycling in the CNS, producing combined dopamine and
    serotonin deficiency with axial hypotonia, levodopa-responsive dystonia,
    oculogyric crises, and sleep and psychiatric disturbances without overt
    hyperphenylalaninemia.
  evidence:
  - reference: PMID:26131547
    reference_title: "Sepiapterin Reductase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The movement disorder phenotype can include axial hypotonia,
      levodopa-responsive dystonia (often presenting as oculogyric crises),
      parkinsonian signs (tremor, bradykinesia, and/or rigidity), and limb
      hypertonia and hyperreflexia that can be associated with clonus and may
      be misdiagnosed as cerebral palsy.
    explanation: GeneReviews establishes sepiapterin reductase deficiency as a distinct autosomal recessive levodopa-responsive dystonia subtype.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    Autosomal dominant GCH1-deficient DRD exhibits reduced, sex-influenced
    penetrance with marked female predominance among symptomatic individuals
    and a high proportion of males among asymptomatic heterozygous GCH1
    carriers.
  evidence:
  - reference: PMID:20301681
    reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GTPCH1-deficient DRD is inherited in an autosomal dominant manner."
    explanation: GeneReviews confirms autosomal dominant inheritance for GTPCH1-deficient DRD.
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While sex was equally distributed in autosomal recessive DRD, there was
      female predominance in autosomal dominant DYT/PARK-GCH1 patients
      accompanied by a lower median age at onset and more dystonia in females
      compared to males.
    explanation: MDSGene systematic review of 734 DRD patients documents female predominance and earlier median onset in autosomal dominant DYT/PARK-GCH1.
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of asymptomatic heterozygous GCH1 mutation carriers (>8
      years of age) were males.
    explanation: Confirms incomplete, sex-biased penetrance in heterozygous GCH1 carriers.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Autosomal recessive inheritance applies to TH deficiency, sepiapterin
    reductase (SPR) deficiency, biallelic GCH1 deficiency, PTS deficiency, and
    QDPR deficiency, with equal sex distribution.
  evidence:
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TH deficiency is inherited in an autosomal recessive manner."
    explanation: GeneReviews confirms autosomal recessive inheritance in TH-deficient DRD.
  - reference: PMID:26131547
    reference_title: "Sepiapterin Reductase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SRD is inherited in an autosomal recessive manner."
    explanation: GeneReviews confirms autosomal recessive inheritance in SPR-deficient DRD.
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While sex was equally distributed in autosomal recessive DRD, there was
      female predominance in autosomal dominant DYT/PARK-GCH1 patients
      accompanied by a lower median age at onset and more dystonia in females
      compared to males.
    explanation: Confirms equal sex distribution across autosomal recessive DRD subtypes.

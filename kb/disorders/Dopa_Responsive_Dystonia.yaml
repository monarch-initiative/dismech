      label: cerebral palsy
  evidence:
  - reference: PMID:26131547
    reference_title: "Sepiapterin Reductase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The movement disorder phenotype can include axial hypotonia,
      levodopa-responsive dystonia (often presenting as oculogyric crises),
      parkinsonian signs (tremor, bradykinesia, and/or rigidity), and limb
      hypertonia and hyperreflexia that can be associated with clonus and may
      be misdiagnosed as cerebral palsy.
    explanation: GeneReviews highlights frequent misdiagnosis of DRD with limb hypertonia, hyperreflexia, and clonus as cerebral palsy.
- name: Aromatic L-Amino Acid Decarboxylase Deficiency
  description: >-
    Aromatic L-amino acid decarboxylase (AADC) deficiency (DDC) shares
    infantile hypotonia, oculogyric crises, autonomic dysfunction, and combined
    CSF HVA and 5-HIAA depletion with recessive BH4/SPR-deficient DRD, but the
    enzymatic block is downstream of L-dopa and 5-HTP.
  distinguishing_features:
  - Elevated CSF 3-O-methyldopa, L-dopa, and 5-HTP with poor response to exogenous levodopa (requiring dopamine agonists, MAO inhibitors, and pyridoxine)
  - Biallelic pathogenic variants in DDC rather than GCH1, TH, or SPR

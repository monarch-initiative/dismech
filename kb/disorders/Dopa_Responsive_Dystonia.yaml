    In sepiapterin reductase-deficient DRD (DYT/PARK-SPR), biallelic pathogenic
    variants in SPR block the terminal step of de novo tetrahydrobiopterin
    (BH4) synthesis and pterin salvage in the brain (where alternative
    aldo-keto/carbonyl reductases cannot compensate as they do in peripheral

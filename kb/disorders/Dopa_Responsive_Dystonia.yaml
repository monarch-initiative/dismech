progression:
- phase: Childhood-Onset Diurnal Dystonia
  age_range: 1-12 years
  notes: >-
    Classic AD-DRD (GCH1) and mild AR-DRD (TH-deficient DRD / DYT5b) present in
    childhood with lower-limb (equinovarus foot) dystonia, gait difficulties,
    and diurnal worsening toward evening.
  evidence:
  - reference: PMID:20301681
    reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Initial symptoms are often gait difficulties attributable to
      flexion-inversion (equinovarus posture) of the foot.
    explanation: GeneReviews describes childhood onset with equinovarus foot dystonia and gait difficulties.
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with TH-deficient dopa-responsive dystonia (DYT5b,
      DYT-TH), onset is between age 12 months and 12 years; initial symptoms
      are typically lower-limb dystonia and/or difficulty in walking.
    explanation: GeneReviews defines the 12-month to 12-year onset window for TH-deficient DRD.
- phase: Infantile-Onset Parkinsonism and Encephalopathy
  age_range: 0-12 months
  notes: >-
    More severe autosomal recessive forms (TH-deficient infantile parkinsonism
    or progressive encephalopathy, biallelic GCH1 deficiency, and SPR
    deficiency) present in infancy with axial hypotonia, motor delay,
    oculogyric crises, and hypokinetic-rigid parkinsonism.
  evidence:
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In most individuals with TH-deficient infantile parkinsonism with motor
      delay, onset is between age three and 12 months.
    explanation: GeneReviews defines infantile onset (3-12 months) for TH-deficient infantile parkinsonism with motor delay.
  - reference: PMID:39001623
    reference_title: "Autosomal Recessive Guanosine Triphosphate Cyclohydrolase I Deficiency: Redefining the Phenotypic Spectrum and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three phenotypes were outlined: (1) early-infantile encephalopathic
      phenotype with profound disability (24 of 45 patients), (2)
      dystonia-parkinsonism phenotype with infantile/early-childhood onset of
      developmental stagnation/regression preceding the emergence of movement
      disorder (7 of 45), and (3) late-onset DRD phenotype (14 of 45).
    explanation: Defines the infantile-onset encephalopathic and dystonia-parkinsonism progression arms of autosomal recessive GCH1 deficiency.
- phase: Progressive Generalization and Adult Parkinsonism
  age_range: Adolescence to adulthood
  notes: >-
    Without treatment, focal childhood foot dystonia in classic DRD gradually
    generalizes to other limbs and the trunk and later develops parkinsonian
    features (bradykinesia, rigidity, postural tremor).
  evidence:
  - reference: PMID:20301681
    reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In general, gradual progression to generalized dystonia is observed."
    explanation: GeneReviews documents progression from focal foot dystonia to generalized dystonia when untreated.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Clinical burden ranges from mild, completely levodopa-responsive childhood
    foot dystonia in timely treated autosomal dominant GCH1 deficiency or mild
    TH deficiency (DYT5b) to high morbidity in infantile-onset encephalopathic
    autosomal recessive GCH1, TH, SPR, PTS, or QDPR deficiencies; furthermore,
    prolonged diagnostic delay (mean 14.6 years overall, 21.2 years in patients
    with residual motor signs) leaves 39% of early-onset AD-GCH1 patients with
    residual motor signs and exposes misdiagnosed patients to unnecessary
    orthopedic surgery.
  evidence:
  - reference: PMID:33875303
    reference_title: "Early-onset autosomal dominant GTP-cyclohydrolase I deficiency: Diagnostic delay and residual motor signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mean duration of diagnostic delay was 14.6 years overall: 12.0 years
      in RMS-negative patients and 21.2 years in RMS-positive patients.
    explanation: Quantifies mean diagnostic delay and its association with residual motor signs (RMS) in AD-GCH1 DRD.
  - reference: PMID:33875303
    reference_title: "Early-onset autosomal dominant GTP-cyclohydrolase I deficiency: Diagnostic delay and residual motor signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gait disturbance was reported in 92.7% of patients, diurnal fluctuation
      of symptoms in 91.9%, and RMS in 39%.
    explanation: Documents a 39% prevalence of residual motor signs in treated early-onset AD-GCH1 DRD.
  - reference: PMID:33875303
    reference_title: "Early-onset autosomal dominant GTP-cyclohydrolase I deficiency: Diagnostic delay and residual motor signs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients exhibited RMS, and four patients underwent orthopedic
      surgery.
    explanation: Documents orthopedic surgical interventions performed in patients with delayed diagnosis of GCH1-deficient DRD.
pathophysiology:
- name: Striatal Dopamine Biosynthesis Impairment
  description: >-
    The unifying mechanism across DRD subtypes is reduced dopamine
    biosynthesis in nigrostriatal dopaminergic neurons, arising either via
    tetrahydrobiopterin (BH4) cofactor limitation (GCH1, SPR, PTS, QDPR) or
    via direct loss of tyrosine hydroxylase catalytic activity (TH). Because
    nigrostriatal dopaminergic terminals remain structurally intact, this
    functional neurotransmitter deficit produces diurnal childhood dystonia,
    pyramidal-like signs, and parkinsonism that respond dramatically and
    durably to exogenous levodopa.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: dopamine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042416
      label: dopamine biosynthetic process
  - preferred_term: dopamine biosynthetic process from tyrosine
    modifier: DECREASED
    term:
      id: GO:0006585
      label: dopamine biosynthetic process from tyrosine
  - preferred_term: catecholamine biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0042423
      label: catecholamine biosynthetic process
  chemical_entities:
  - preferred_term: dopamine
    term:
      id: CHEBI:18243
      label: dopamine
    modifier: DECREASED
  - preferred_term: homovanillic acid
    term:
      id: CHEBI:545959
      label: homovanillic acid
    modifier: DECREASED
  downstream:
  - target: Limb Dystonia
    causal_link_type: DIRECT
    description: >-
      Reduced nigrostriatal dopamine synthesis produces the childhood foot and
      limb dystonia that defines the DRD motor presentation.
    evidence:
    - reference: PMID:34834538
      reference_title: "Personalized Medicine to Improve Treatment of Dopa-Responsive Dystonia-A Focus on Tyrosine Hydroxylase Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dopa-responsive dystonia (DRD) is a rare movement disorder associated
        with defective dopamine synthesis.
      explanation: Expert review links DRD to defective dopamine synthesis.
    - reference: PMID:20301681
      reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This disorder typically presents with gait disturbance caused by foot
        dystonia, later development of parkinsonism, and diurnal fluctuation of
        symptoms.
      explanation: GeneReviews supports foot dystonia as the typical DRD motor presentation.
  - target: Focal Dystonia
    causal_link_type: DIRECT
    description: >-
      The same central dopamine-synthesis deficit can present as focal dystonia,
      especially in the classic autosomal dominant subtype.
    evidence:
    - reference: PMID:34834538
      reference_title: "Personalized Medicine to Improve Treatment of Dopa-Responsive Dystonia-A Focus on Tyrosine Hydroxylase Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Dopa-responsive dystonia (DRD) is a rare movement disorder associated
        with defective dopamine synthesis.
      explanation: Expert review links the DRD movement-disorder spectrum to defective dopamine synthesis.
    - reference: ORPHA:98808
      reference_title: "Autosomal dominant dopa-responsive dystonia"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0004373 | Focal dystonia | Frequent (79-30%)"
      explanation: Orphanet lists focal dystonia as frequent in autosomal dominant DRD.
  - target: Generalized Dystonia
    causal_link_type: DIRECT
    description: >-
      Progressive depletion of striatal dopamine in untreated childhood-onset
      DRD causes focal lower-limb dystonia to spread to the trunk and all four
      limbs as generalized dystonia.
    evidence:
    - reference: PMID:20301681
      reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In general, gradual progression to generalized dystonia is observed."
      explanation: GeneReviews documents progression to generalized dystonia in GTPCH1-deficient DRD.
  - target: Equinovarus Deformity
    causal_link_type: DIRECT
    description: >-
      Striatal dopamine deficiency in childhood-onset DRD characteristically
      drives acquired dystonic flexion-inversion (equinovarus posture) of the
      foot.
    evidence:
    - reference: PMID:20301681
      reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Initial symptoms are often gait difficulties attributable to
        flexion-inversion (equinovarus posture) of the foot.
      explanation: GeneReviews identifies equinovarus foot posture as the classic initial manifestation of DRD.
    - reference: PMID:41965601
      reference_title: "Genetic analysis reveals phenotypic variability in three Colombian families with dopa-responsive dystonia: novel genotype-phenotype correlations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Tetrahydrobiopterin (BH4) deficiency impairs dopamine synthesis in the
        basal ganglia, leading to childhood-onset dystonia with excellent
        response to levodopa.
      explanation: Connects BH4-dependent basal ganglia dopamine synthesis impairment to childhood-onset foot and limb dystonia.
  - target: Parkinsonism
    causal_link_type: DIRECT
    description: >-
      Dopamine deficiency in motor circuits explains parkinsonian features in
      older classic DRD and in severe TH-deficient and SPR-deficient disease.
    evidence:
    - reference: PMID:20301681
      reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This disorder typically presents with gait disturbance caused by foot
        dystonia, later development of parkinsonism, and diurnal fluctuation of
        symptoms.
      explanation: GeneReviews supports later parkinsonism in classic DRD.
  - target: Bradykinesia
    causal_link_type: DIRECT
    description: >-
      Depletion of striatal dopamine impairs basal ganglia motor initiation and
      scaling, producing levodopa-responsive bradykinesia and hypokinesia.
    evidence:
    - reference: PMID:20301681
      reference_title: "GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Occasionally, initial symptoms are arm dystonia, postural tremor of the
        hand, or slowness of movements.
      explanation: GeneReviews documents slowness of movements (bradykinesia) in GTPCH1-deficient DRD.
    - reference: PMID:20301610
      reference_title: "Tyrosine Hydroxylase Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Affected infants demonstrate truncal hypotonia and parkinsonian symptoms
        and signs (hypokinesia, rigidity of extremities, and/or tremor).
      explanation: GeneReviews links TH-deficient central dopamine depletion to parkinsonian hypokinesia/bradykinesia.
    - reference: PMID:41215497
      reference_title: "Consensus Guideline for the Diagnosis and Treatment of Tyrosine Hydroxylase (TH) Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Autosomal recessive tyrosine hydroxylase deficiency (THD) leads to
        clinical phenotypes reflecting the deficiency of dopamine,
        norepinephrine, or epinephrine in the central nervous system (CNS),
        presenting along a continuous spectrum from mild to severe forms of the
        disease.
      explanation: Consensus guideline ties THD motor phenotypes directly to CNS dopamine and catecholamine deficiency.
    - reference: PMID:26131547
      reference_title: "Sepiapterin Reductase Deficiency."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The movement disorder phenotype can include axial hypotonia,

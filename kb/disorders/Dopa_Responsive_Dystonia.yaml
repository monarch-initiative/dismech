  and autosomal recessive forms of dopa-responsive dystonia (MONDO:0016812),
  including classic autosomal dominant GCH1-deficient DRD (DYT/PARK-GCH1),
  autosomal recessive TH-deficient DRD (DYT/PARK-TH), sepiapterin
  reductase-deficient DRD (DYT/PARK-SPR), and BH4-synthesis/recycling defects
  (PTS, QDPR, biallelic GCH1). Dopa-responsive dystonia encompasses enzymatic
  defects at two sequential stages of monoamine biosynthesis: (1)
  tetrahydrobiopterin (BH4) cofactor synthesis and recycling (GCH1, PTS, SPR,
  QDPR), which affects both catecholamine (tyrosine hydroxylase) and serotonin
  (tryptophan hydroxylase) synthesis, and (2) isolated catecholamine synthesis
  at tyrosine hydroxylase (TH). Subtype-specific molecular detail and
  variant-level curation are further elaborated in the child dismech records
  `Autosomal_Dominant_Dopa_Responsive_Dystonia` (which also notes provisional
  dominant dystonia-parkinsonism loci such as IMPDH2 and NR4A2) and
  `Autosomal_Recessive_Dopa_Responsive_Dystonia` (while TSPOAP1/DYT37 causes a
  distinct presynaptic recessive dystonia without classic DRD levodopa
  responsiveness).

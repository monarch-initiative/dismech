- name: CSF neurotransmitter and pterin metabolite profiling
  presence: Decreased CSF homovanillic acid with subtype-specific 5-HIAA and pterin pattern
  description: >-
    Lumbar puncture measurement of CSF homovanillic acid (HVA),
    5-hydroxyindoleacetic acid (5-HIAA), neopterin, biopterin, dihydrobiopterin
    (BH2), and sepiapterin distinguishes GCH1 deficiency (low HVA, low/normal
    5-HIAA, low neopterin and biopterin), TH deficiency (low HVA and MHPG with
    normal 5-HIAA and normal pterins), and SPR deficiency (low HVA and 5-HIAA
    with elevated total biopterin, BH2, and sepiapterin).
  results: Reduced CSF HVA across subtypes; normal 5-HIAA in TH deficiency vs reduced 5-HIAA in BH4/SPR deficiency
  markers: CSF HVA, 5-HIAA, neopterin, biopterin, sepiapterin
  evidence:
  - reference: PMID:34908184
    reference_title: "Relationship of Genotype, Phenotype, and Treatment in Dopa-Responsive Dystonia: MDSGene Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemically, homovanillic acid and 5-hydroxyindoleacetic acid in CSF
      were reduced in most DRDs, but neopterin and biopterin were increased
      only in DYT/PARK-PTS and DYT/PARK-SPR.
    explanation: MDSGene review defines the discriminatory CSF monoamine and pterin patterns across DRD genotypes.
  - reference: PMID:20430833
    reference_title: "Tyrosine hydroxylase deficiency: a treatable disorder of brain catecholamine biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Decreased cerebrospinal fluid concentrations of homovanillic acid and
      3-methoxy-4-hydroxyphenylethylene glycol, with normal

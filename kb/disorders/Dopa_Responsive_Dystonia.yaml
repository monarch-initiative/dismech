  association: Causative (Autosomal Dominant DYT/PARK-GCH1 and Autosomal Recessive GTPCH1 Deficiency)
  features: >-
    Heterozygous loss-of-function variants (missense, nonsense, frameshift,
    splice-site, and intragenic exon/whole-gene deletions) in GCH1 are the most
    common cause of DRD (Segawa disease), while biallelic variants cause a
    continuum from early-infantile encephalopathy with hyperphenylalaninemia to
    late-onset DRD.

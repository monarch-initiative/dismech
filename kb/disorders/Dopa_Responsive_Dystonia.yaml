- name: BH4 Cofactor Limitation
  description: >-
    GCH1-associated DRD (and rarer PTS and QDPR forms) reduces
    tetrahydrobiopterin (BH4) biosynthesis or regeneration, limiting cofactor
    availability for tyrosine hydroxylase and other aromatic amino acid
    hydroxylases and feeding the shared `Striatal Dopamine Biosynthesis
    Impairment` endpoint. Heterozygous GCH1 variants cause partial BH4
    deficiency that impairs nigrostriatal dopamine synthesis with only
    transient or phenylalanine-load-induced hyperphenylalaninemia, whereas
    biallelic GCH1, PTS, or QDPR variants cause more severe BH4 depletion
    accompanied by hyperphenylalaninemia.

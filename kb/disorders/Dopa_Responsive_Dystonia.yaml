    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GCH1 mutations may cause a phenotype initially resembling hereditary
      spastic paraplegia (HSP) rather than DRD, with basal ganglia signs
      developing only after decades.
    explanation: Directly documents initial misdiagnosis or clinical overlap between GCH1-related DRD and hereditary spastic paraplegia.
- name: Cerebral Palsy
  description: >-
    Infantile- and childhood-onset DRD (including GCH1, TH, and SPR
    deficiencies) with axial hypotonia, limb hypertonia, equinovarus foot
    posture, hyperreflexia, and clonus is frequently misdiagnosed as spastic
    diplegic or dyskinetic cerebral palsy.
  distinguishing_features:
  - Absence of perinatal hypoxic-ischemic brain injury on MRI and presence of diurnal symptom fluctuation
  - Dramatic improvement with levodopa and reduced CSF HVA or pathogenic DRD gene variants
  disease_term:

name: Autosomal Dominant Nonsyndromic Hearing Loss 50
category: Mendelian
creation_date: '2026-09-01T00:00:00Z'
synonyms:
- DFNA50
- autosomal dominant deafness 50
- autosomal dominant nonsyndromic deafness 50
- autosomal dominant nonsyndromic deafness type 50
- deafness, autosomal dominant 50
- deafness, autosomal dominant type 50
- MIR96-related hearing loss
description: 'DFNA50 is MIR96-associated autosomal dominant, usually postlingual progressive sensorineural hearing loss. The founding reports describe two Spanish families with seed-region substitutions and an Italian family with a precursor-hairpin substitution. Hearing loss is bilateral; onset, progression and vestibular symptoms vary across families. ClinGen classified the gene-disease relationship as Moderate in September 2023.

  MIR96 encodes a microRNA in the MIR183/MIR96/MIR182 cluster. The human alleles historically designated +13G>A and +14C>A alter the mature miR-96-5p seed and impair its biogenesis in transfected cells. Mouse transcriptomes support both loss of normal target repression and acquisition of allele-specific targets. The Italian +57T>C allele preserves the miR-96-5p sequence but impairs precursor processing and changes the companion miR-96-3p seed; its complete functional effect cannot be reduced to a purely quantitative defect.

  Model studies show disrupted hair-cell maturation, stereociliary and synaptic function, and later degeneration. Adult inducible deletion also demonstrates a maintenance requirement. These findings support an allele-dependent regulatory mechanism, but complete neonatal maturation arrest in homozygous diminuendo mice is not an established universal lesion in human carriers. Standard care addresses hearing and communication needs. Mutant-allele editing and pharmacological rescue remain preclinical approaches in the reviewed sources.'

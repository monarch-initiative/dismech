      id: UBERON:0002227
      label: spiral organ of cochlea
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In heterozygotes many outer hair cells had degenerated in the middle and basal turns but most inner hair cells remained intact"
    explanation: The cell type and cochlear location of the degeneration in heterozygotes.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "this and previous studies suggest that the degeneration is instead a correlate or consequence of a prior dysfunction of the hair cells"
    explanation: >-
      The authors' explicit ordering of dysfunction before degeneration, which is what
      places this node downstream of the maturation nodes rather than upstream of them.
  downstream:
  - target: Loss of Cochlear Amplification
- name: Loss of Cochlear Amplification
  biological_scale: TISSUE
  description: >-
    Active amplification by outer hair cells fails, from two directions: prestin, the
    motor protein that drives outer hair cell length changes, is among the most
    downregulated transcripts, and the outer hair cells that carry it degenerate. The
    endocochlear potential is normal, so this is a sensory-cell failure and not a
    stria vascularis or ionic-homeostasis failure - a useful discriminator against the
    other routes into the sensorineural hair cell loss module.
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Prestin is a voltage-sensitive motor molecule that mediates outer hair cell length changes responsible for amplification of sound within the cochlea"
    explanation: >-
      Identifies the function lost when Slc26a5 is downregulated, which is what connects
      the transcriptional node to amplification.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Endocochlear potentials were within the normal range"
    explanation: >-
      Excludes a strial or endolymph-potential mechanism, which is the alternative
      explanation for amplification loss in sensorineural deafness.
  downstream:
  - target: Progressive Sensorineural Hearing Loss
- name: Progressive Sensorineural Hearing Loss
  biological_scale: ORGANISM
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  description: >-
    The clinical endpoint: bilateral sensorineural hearing loss that begins after speech
    is acquired and worsens over decades. In the diminuendo mouse the heterozygote, the
    genotype that corresponds to a human carrier, has thresholds raised by around 60 dB
    while homozygotes have no cochlear responses at all.
  biological_processes:
  - preferred_term: sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0007605
      label: sensory perception of sound
  notes: >-
    Only this terminal node declares conformance to sensorineural_hair_cell_loss. The
    module's upstream nodes are framed as an insult to a formed sensory epithelium
    followed by ionic and oxidative stress; DFNA50 is a failure of that epithelium to
    mature in the first place, with a normal endocochlear potential, so substituting the
    module's upstream chain here would assert a mechanism this disease does not have.
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "in heterozygotes thresholds were raised by around 60dB"
    explanation: The magnitude of the functional deficit in the heterozygous mouse.
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations in the seed region of miR-96, a miRNA expressed in hair cells of the inner ear, result in autosomal dominant, progressive hearing loss"
    explanation: The human endpoint the mouse deficit corresponds to.
phenotypes:
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    The defining and, so far as the reported pedigrees show, the only feature. Loss is
    sensorineural and worsens over years to decades rather than being static.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations in the seed region of miR-96, a miRNA expressed in hair cells of the inner ear, result in autosomal dominant, progressive hearing loss"
    explanation: Progression stated in the founding description of the two Spanish families.
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, point mutations within the seed region of miR-96 were reported in two Spanish families with autosomal dominant non-syndromic sensorineural hearing loss (NSHL) and in a mouse model of NSHL."
    explanation: >-
      Independent confirmation that the loss is sensorineural and nonsyndromic, which the
      founding abstract does not state in those words.
- name: Postlingual Onset
  category: Auditory
  description: >-
    Hearing loss begins after speech has been acquired and deepens over decades, which is
    why DFNA50 presents as adult or adolescent hearing loss in a dominant pedigree rather
    than as congenital deafness. It also means a carrier can pass newborn hearing
    screening.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  notes: >-
    FREQUENT rather than OBLIGATE because the supporting sources describe the typical
    course of the disorder without giving a denominator of carriers in whom onset was
    postlingual. No congenital case has been reported, but that is weaker than a
    per-patient count.
  evidence:
  - reference: PMID:38985856
    reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with DFNA50, hearing loss starts postlingual and becomes severe over decades (11), suggesting a relatively long period within which editing therapy could be efficacious."
    explanation: >-
      Onset timing and the decades-long course. Graded OTHER because this is a mouse
      gene-editing paper restating the human natural history it cites, not reporting
      patients of its own.
  - reference: PMID:38985856
    reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in microRNA-96 (MIR96) cause autosomal dominant deafness-50 (DFNA50), a form of delayed-onset hearing loss."
    explanation: >-
      The delayed-onset characterisation of the disorder. Same grading rationale as the
      sentence above.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No prevalence estimate exists. Three families have been reported: two Spanish
    pedigrees carrying the seed alleles and one Italian pedigree carrying the precursor
    allele. Two systematic screens bound the rarity from above rather than measuring it -
    882 Italian nonsyndromic hearing loss patients yielded the single Italian family, and
    a separate screen of the miR-183 cluster and 24 predicted target genes across
    dominant and recessive deafness families found nothing at all. prevalence_class is
    the qualitative ULTRA_RARE tier and no rate_per_100000 is given, because none has
    been reported and a numeric band next to this note would be an invention.
  evidence:
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 882 NSHL patients and 836 normal-hearing Italian controls and identified one putative novel mutation within the miR-96 gene in a family with autosomal dominant NSHL."
    explanation: One family in a screen of 882 patients - the largest denominator published for MIR96.
  - reference: PMID:20186779
    reference_title: "miRNA mutations are not a common cause of deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening these miRNAs and target sequences in numerous families segregating either autosomal dominant non-syndromic deafness (ADNSHL) or ARNSHL did not identify any potential deafness-causing mutations."
    explanation: A second screen with no further MIR96 families found.
  - reference: PMID:20186779
    reference_title: "miRNA mutations are not a common cause of deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that mutations disrupting gene regulation by the miR-183 cluster are not a common cause of human hearing loss."
    explanation: The authors' own conclusion about how rare this class of allele is.
progression:
- phase: Presymptomatic
  notes: >-
    Hearing is normal through infancy and early childhood. The disorder is not congenital,
    so newborn hearing screening does not detect it, and speech is acquired normally.
  evidence:
  - reference: PMID:38985856
    reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In patients with DFNA50, hearing loss starts postlingual and becomes severe over decades (11), suggesting a relatively long period within which editing therapy could be efficacious."
    explanation: >-
      Establishes that there is a presymptomatic window. Graded OTHER for the reason
      given on the postlingual phenotype.
- phase: Progressive decline
  notes: >-
    Once established the loss deteriorates over decades to severe impairment. No published
    series is large enough to give a decibels-per-year rate, so the pace is described
    qualitatively here rather than quantified.
  evidence:
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations in the seed region of miR-96, a miRNA expressed in hair cells of the inner ear, result in autosomal dominant, progressive hearing loss"
    explanation: The progressive course in the founding families.
genetic:
- name: MIR96
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  notes: >-
    MIR96 is a microRNA gene, HGNC locus type "RNA, micro", at 7q32.2 in a small cluster
    with MIR183 and MIR182. It has no protein product, so the vocabulary usually
    attached to a Mendelian gene - missense, nonsense, truncating, protein misfolding,
    dominant negative - does not apply, and neither does a PDB structure or a molecular
    function term for a gene product. The unit of pathogenicity is a single nucleotide of
    a 22-nucleotide mature RNA.

    Two mechanistically distinct allele classes are known and they are curated as separate
    pathophysiology nodes. The seed alleles +13G>A and +14C>A change target specificity;
    the Italian precursor allele leaves the seed intact and reduces mature miR-96 yield.
    The mature miR-96 sequence is identical in human, mouse, rat and fish, and human and
    mouse MIR96 are 100 percent homologous, which is what makes the mouse models unusually
    faithful and lets a single guide RNA designed against a mouse allele apply to the
    human one.
  evidence:
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first study implicating a miRNA in a mendelian disorder."
    explanation: The gene-disease relationship as first established, and its novelty class.
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we provide further evidence of the involvement of miR-96 mutations in human deafness and demonstrate that a quantitative defect of this miRNA may contribute to NSHL."
    explanation: Independent replication of the gene-disease relationship in a third family.
  - reference: PMID:38985856
    reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Because mouse and human MIR96 sequences share 100% homology"
    explanation: >-
      The sequence identity that underpins the fidelity claims on the mouse models below
      and makes the editing reagents directly transferable.
diagnosis:
- name: MIR96 sequencing in dominant postlingual progressive hearing loss
  description: >-
    DFNA50 is reached by sequencing MIR96 in a family with dominantly inherited,
    postlingual, progressive sensorineural hearing loss. The practical trap is that MIR96
    is a short non-coding gene: a panel or exome pipeline built around coding exons will
    not cover it unless it has been added deliberately, and the causal change is a single
    nucleotide in a 22-nucleotide mature RNA rather than a protein-altering variant. The
    two systematic screens that have been published both sequenced the miRNA gene itself
    for this reason.
  evidence:
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 882 NSHL patients and 836 normal-hearing Italian controls and identified one putative novel mutation within the miR-96 gene in a family with autosomal dominant NSHL."
    explanation: The diagnostic route in practice - direct sequencing of the miRNA gene in an undiagnosed dominant cohort.
  - reference: PMID:20186779
    reference_title: "miRNA mutations are not a common cause of deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We extended our study to include the miR-183 genes themselves and 24 additional predicted target genes of the miRNA-183 cluster."
    explanation: >-
      The same approach applied to a second cohort, and the reason a negative MIR96 result
      is informative: this region has been looked at systematically.
animal_models:
- name: diminuendo (Mir96 Dmdo) ENU seed-mutant mouse
  species: Mouse
  genotype: Mir96 Dmdo (ENU-induced single-base substitution in the miR-96 seed region), heterozygous and homozygous
  background: recovered from an ENU mutagenesis screen for dominant deafness
  publication: PMID:19363478
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  description: >-
    The founding animal model and the one that supplied the mechanism. Heterozygotes lose
    the Preyer reflex between four and six weeks and have thresholds raised by about
    60 dB; homozygotes have no cochlear responses. The allele is not one of the two human
    alleles - it is a third seed position - but it is the model in which the loss of
    normal targeting and the gain of novel targeting were both demonstrated in one
    transcriptome.
  modeled_mechanisms:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The Sylamer analysis of the diminuendo organ of Corti is the primary evidence that a
      mutant miR-96 seed acquires targets, and it is the only place both halves of the
      mechanism have been shown in the same tissue.
    limitations: >-
      The seed position mutated in diminuendo is not one of the two positions mutated in
      human DFNA50 families, so the specific set of acquired targets is allele-specific
      and need not match a human carrier's. Enrichment of mutant-seed matches in human and
      rat orthologues of the downregulated genes was reported as barely above the
      significance threshold, unlike the wild-type-seed signal, so the acquired target set
      is the less conserved half of the mechanism.
    readouts:
    - name: Enrichment of the mutant-seed heptamer among downregulated 3-prime UTRs
      target: Repression of Novel Targets Acquired by the Mutant Seed
      direction: INCREASED
      interpretation: >-
        Transcripts carrying a match to the mutant seed are preferentially downregulated,
        which is what novel targeting predicts.
      evidence:
      - reference: PMID:19363478
        reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Different genes, with target sites complementary to the mutant seed, were downregulated."
        explanation: The measurement itself.
    evidence:
    - reference: PMID:33318051
      reference_title: "Hearing impairment due to Mir183/96/182 mutations suggests both loss and gain of function effects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "is likely to be mediated by the gain of novel target genes in addition to the loss of its normal targets"
      explanation: >-
        Establishes that this model is informative for the novel-target node specifically,
        by contrasting it against null alleles that lack that component.
  - target: Arrest of Hair Cell Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Single hair cell electrophysiology in this mutant is what established that the
      cellular lesion is arrested maturation at around the day of birth rather than
      degeneration of a differentiated cell.
    limitations: >-
      The arrest was characterised in neonatal mice; the corresponding human onset is
      postlingual, so the developmental timing of the mouse lesion is much earlier than
      the clinical presentation it is taken to explain. Homozygous mice, in which the
      arrest is complete, have no human counterpart - no homozygous DFNA50 patient has
      been reported.
    readouts:
    - name: Biophysical differentiation of inner versus outer hair cells
      target: Arrest of Hair Cell Maturation
      direction: ABOLISHED
      interpretation: >-
        Mutant hair cells never acquire the distinct inner and outer hair cell
        electrophysiological identities.
      evidence:
      - reference: PMID:21245307
        reference_title: "miR-96 regulates the progression of differentiation in mammalian cochlear inner and outer hair cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that the physiological development of mutant sensory hair cells is arrested at around the day of birth, before their biophysical differentiation into inner and outer hair cells."
        explanation: The readout and its direction.
    - name: Auditory brainstem or compound action potential threshold
      target: Arrest of Hair Cell Maturation
      direction: INCREASED
      interpretation: >-
        Thresholds rise by about 60 dB in heterozygotes - a higher threshold means worse
        hearing - and no response is obtainable in homozygotes.
      evidence:
      - reference: PMID:19363478
        reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "in heterozygotes thresholds were raised by around 60dB"
        explanation: The functional readout in the genotype that corresponds to a human carrier.
    evidence:
    - reference: PMID:21245307
      reference_title: "miR-96 regulates the progression of differentiation in mammalian cochlear inner and outer hair cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, maturation of the hair cell stereocilia bundle and remodelling of auditory nerve connections within the cochlea fail to occur in miR-96 mutants."
      explanation: Supports treating this model as informative for the maturation-arrest node.
- name: Mir96 +14C>A human-allele knock-in mouse
  species: Mouse
  genotype: Mir96 tm3.1Wtsi (Mir96 +14C>A knock-in), heterozygous and homozygous
  background: C57BL/6N
  publication: PMID:39434156
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  description: >-
    A knock-in of the actual human +14C>A allele from Spanish family s1334, and the model
    that most closely matches human DFNA50: heterozygotes develop progressive hearing loss
    from four weeks with rounded outer hair cell bundles, and homozygotes are profoundly
    deaf. It is also the model used for the gene-editing and drug-repurposing experiments.
  modeled_mechanisms:
  - target: Stereociliary Bundle Maturation Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Heterozygous carriers of the human allele show the same failure of outer hair cell
      bundle maturation - a U rather than a V - seen in diminuendo, on a genotype that is
      an exact match for a human patient.
    limitations: >-
      Bundle scoring was qualitative rather than a quantified morphometric, and the
      genotype was assessed on a single inbred background, C57BL/6N, which carries its own
      age-related hearing loss allele. The paired +13G>A line shows how much background
      and allele interact: the same experiment on a mixed background changed nothing for
      that allele, but the possibility that background modifies the +14C>A bundle
      phenotype was not tested.
    readouts:
    - name: Outer hair cell stereociliary bundle shape
      target: Stereociliary Bundle Maturation Failure
      direction: ALTERED
      interpretation: Bundles adopt a U shape instead of the mature V.
      evidence:
      - reference: PMID:39434156
        reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Mir96+14C>A heterozygotes, which have mild hearing loss by P28, some OHC stereocilia bundles have a U-shape, instead of the typical V-shape observed in wildtypes"
        explanation: The morphological readout and the age at which it is present.
    evidence:
    - reference: PMID:38985856
      reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Because mouse and human MIR96 sequences share 100% homology"
      explanation: >-
        The basis for a HIGH fidelity call: the mouse carries the identical allele in an
        identical sequence context, which is unusual for a knock-in model.
  - target: Progressive Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Heterozygotes lose hearing progressively from four weeks, starting at high
      frequencies and spreading, which is the same shape of course as the human disease.
    limitations: >-
      The mouse course runs over weeks and the human course over decades, so the model
      compresses the natural history rather than reproducing its timescale. Homozygotes,
      profoundly deaf from four weeks, have no human counterpart.
    readouts:
    - name: ABR and DPOAE thresholds across frequency and age
      target: Progressive Sensorineural Hearing Loss
      direction: INCREASED
      interpretation: >-
        Thresholds rise - worse hearing - beginning at 32 kHz at four weeks and extending
        to other frequencies by 8 and 12 weeks.
      evidence:
      - reference: PMID:38985856
        reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These results showed that Mir9614C>A/+ mice exhibit hearing loss starting at 4 weeks at the high frequency of 32 kHz, which becomes progressive with further elevation of ABR/DPOAE thresholds at 8 and 12 weeks across other frequencies."
        explanation: The progressive, high-frequency-first threshold elevation.
    evidence:
    - reference: PMID:39434156
      reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "while Mir96+13G>A heterozygotes have normal ABR thresholds"
      explanation: >-
        Cited here because it is the contrast that makes this line the informative one for
        the human endpoint: of the two human-allele knock-ins, only +14C>A reproduces
        dominant progressive hearing loss.
  - target: Progressive Sensorineural Hearing Loss
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Two independent preclinical rescue arms have been run in this line. AAV delivery of
      SaCas9-KKH with a guide RNA against the mutant allele into the cochleae of
      presymptomatic and symptomatic adult mice improved hearing long term, with better
      results from earlier injection. Separately, amitriptyline - selected by matching the
      mutant transcriptome against anti-correlated drug expression profiles - delayed
      progression at high frequencies.
    limitations: >-
      Neither arm is a treatment. Editing disrupts the mutant allele rather than correcting
      it, was delivered directly into the cochlea, and the reported long-term benefit is
      preservation and partial improvement rather than normal hearing. The amitriptyline
      effect is temporary, was obtained at doses far above human therapeutic exposure by
      body weight, and did not benefit homozygotes or improve when the dose was doubled;
      the authors state explicitly that it is a proof of concept and not a proposed human
      treatment. Neither has been tested in a person.
    readouts:
    - name: Hearing preservation after adult cochlear AAV-SaCas9-KKH editing
      target: Progressive Sensorineural Hearing Loss
      direction: RESTORED
      interpretation: >-
        Thresholds are held below the untreated trajectory long term after editing of the
        mutant allele in the adult cochlea.
      evidence:
      - reference: PMID:38985856
        reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "AAV delivery of the KKH variant of Staphylococcus aureus Cas9 (SaCas9-KKH) and sgRNA to the cochleae of presymptomatic (3-week-old) and symptomatic (6-week-old) adult Mir9614C>A/+ mutant mice improved hearing long term, with efficacy increased by injection at a younger age."
        explanation: The rescue result and its dependence on timing.
    - name: High-frequency threshold progression under oral amitriptyline
      target: Progressive Sensorineural Hearing Loss
      direction: ALTERED
      interpretation: >-
        Progression is delayed rather than halted or reversed, which is why the direction
        is ALTERED and not RESTORED.
      evidence:
      - reference: PMID:39434156
        reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We chose amitriptyline to test and found that it delays the progression of hearing impairment in Mir96+14C>A heterozygotes"
        explanation: The pharmacological result, stated as a delay.
    evidence:
    - reference: PMID:39434156
      reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This is a proof of concept rather than a suggestion that amitriptyline be used as a treatment for humans carrying the MIR96+14C>A mutation, for several reasons."
      explanation: >-
        The authors' own statement of how far the rescue claim reaches. Recorded on the
        link so the RESCUES relationship cannot be read as a therapy claim.
- name: Mir96 +13G>A human-allele knock-in mouse
  species: Mouse
  genotype: Mir96 tm2.1Wtsi (Mir96 +13G>A knock-in), heterozygous and homozygous
  background: C57BL/6N, and a 50 percent C3HeB/FeJ mixed background
  publication: PMID:39434156
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  description: >-
    A knock-in of the other human seed allele, from Spanish family s403. Homozygotes are
    profoundly deaf, but heterozygotes hear normally to a year old - the opposite of the
    human family, where the same heterozygous allele causes progressive hearing loss. The
    line also shows a distinct lesion from its +14C>A sibling: fewer inner hair cell
    ribbon synapses rather than a severe bundle phenotype.
  modeled_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      In heterozygosis - the genotype a human patient has - this model does not reproduce
      the disease. ABR thresholds stay normal to one year, and neither a different genetic
      background nor noise exposure unmasked a phenotype.
    limitations: >-
      This is the model's defining limitation and the reason it cannot be used to argue
      about human +13G>A carriers. The failure is genotype-specific rather than total: the
      homozygote is profoundly deaf and the line remains informative for the synaptic
      lesion and for the transcriptomic comparison against +14C>A. Whether the discrepancy
      reflects a species difference in the acquired target set, a threshold effect, or
      mouse lifespan being too short for a slowly progressive human phenotype has not been
      resolved.
    readouts:
    - name: ABR threshold in heterozygotes to one year
      target: Progressive Sensorineural Hearing Loss
      direction: UNCHANGED
      interpretation: >-
        A real negative result: thresholds do not differ from wild type, so the model
        carries a human dominant allele without the human dominant phenotype.
      evidence:
      - reference: PMID:39434156
        reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "while Mir96+13G>A heterozygotes have normal ABR thresholds"
        explanation: The negative readout itself.
    evidence:
    - reference: PMID:39434156
      reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "While the Mir96+14C>A heterozygotes mimic the phenotype observed in the family with the equivalent mutation, the Mir96+13G>A heterozygotes escape deafness while the same mutation causes progressive hearing loss in humans"
      explanation: >-
        The authors stating the human-model mismatch directly, which is the substantive
        negative claim this link records.
  - target: Dysregulation of the Hair Cell Maturation Gene Programme
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The line does reproduce a hair cell programme shift, but a different one from its
      sibling: the dominant lesion is a reduction in inner hair cell ribbon synapses
      rather than stereociliary bundle disruption, and the two mutants' differentially
      expressed gene sets are notably dissimilar.
    limitations: >-
      Only the homozygote shows the synaptic deficit, so the finding does not describe the
      genotype human patients carry. Because the two knock-in lines diverge this much, a
      programme change measured in this line cannot be assumed to hold for +14C>A or for
      the diminuendo allele.
    readouts:
    - name: Colocalised pre- and postsynaptic densities per inner hair cell
      target: Dysregulation of the Hair Cell Maturation Gene Programme
      direction: DECREASED
      interpretation: Fewer intact ribbon synapses per inner hair cell in homozygotes.
      evidence:
      - reference: PMID:39434156
        reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Mir96+13G>A homozygotes, we found significantly fewer colocalised pre- and postsynaptic densities per IHC, indicating synaptic defects"
        explanation: The synaptic readout and its direction.
    evidence:
    - reference: PMID:39434156
      reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Investigations of the structural phenotype showed that one mutation appears to lead to synaptic defects, while the other has a much more severe effect on the hair cell stereociliary bundles."
      explanation: >-
        Establishes that this line is informative for a different arm of the programme
        than its sibling, which is what PARTIALLY_RECAPITULATES records.
- name: Mir183/96 double-knockout mouse
  species: Mouse
  genotype: Mir183/96 null (Mir183 and Mir96 deleted together), heterozygous and homozygous
  publication: PMID:33318051
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  - preferred_term: MIR183
    term:
      id: hgnc:31554
      label: MIR183
  description: >-
    Not a model of DFNA50 but the control that defines it. Deleting the microRNAs
    outright gives normal hearing in heterozygotes and complete deafness in homozygotes,
    and produces fewer transcriptional changes than the seed point mutant does. It is the
    experiment that separates absence of miR-96 from presence of a mutant miR-96.
  modeled_mechanisms:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      A null allele cannot acquire targets, so this model reproduces only the abandoned
      half of the mechanism. That is precisely its value: because null heterozygotes hear
      normally while seed-mutant heterozygotes do not, the dominant phenotype cannot be
      explained by loss of normal targeting alone.
    limitations: >-
      The deletion removes Mir183 as well as Mir96, so a comparison against a seed mutant
      confounds the two microRNAs; and the transcriptomes were compared across studies
      rather than in one experiment. The conclusion is an inference from a phenotype and
      transcriptome contrast, not a direct demonstration that any particular acquired
      target drives the disease.
    readouts:
    - name: Hearing in null heterozygotes
      target: Repression of Novel Targets Acquired by the Mutant Seed
      direction: UNCHANGED
      interpretation: >-
        Heterozygous null mice hear normally, so halving wild-type miR-96 is not
        sufficient to cause the disease and the mutant product must be contributing
        something a deletion does not.
      evidence:
      - reference: PMID:33318051
        reference_title: "Hearing impairment due to Mir183/96/182 mutations suggests both loss and gain of function effects."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that Mir183/96 heterozygous mice had normal hearing and homozygotes were completely deaf with abnormal hair cell stereocilia bundles and reduced numbers of inner hair cell synapses at four weeks old."
        explanation: The negative heterozygous result together with the homozygous phenotype.
    evidence:
    - reference: PMID:33318051
      reference_title: "Hearing impairment due to Mir183/96/182 mutations suggests both loss and gain of function effects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We propose three mechanisms of action of mutant miRNAs; loss of targets that are normally completely repressed, loss of targets whose transcription is normally buffered by the miRNA, and gain of novel targets."
      explanation: >-
        The framework this model was built to test, and the reason a failure to
        recapitulate here is informative rather than a dead end.

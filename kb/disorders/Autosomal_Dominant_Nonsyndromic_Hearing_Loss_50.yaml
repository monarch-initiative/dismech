discussions:
- discussion_id: mir96_clic5_direction
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Repression of Normal miR-96 Targets
  prompt: >-
    Does CLIC5 change in DFNA50 hair cells, and in which direction? CLIC5 is a validated
    miR-96 target and is itself a deafness gene curated in this knowledge base as DFNB103,
    but no measurement of CLIC5 in a miR-96 seed-mutant cochlea has been reported.
  rationale: >-
    This is the one place where DFNA50 touches an existing dismech entry mechanistically,
    and it is worth being precise about what is and is not established.

    What is established: miR-96 represses CLIC5 directly, through a conserved site at
    nucleotides 760-766 of the CLIC5 3-prime UTR, shown by mimic transfection and a
    luciferase reporter in a cochlear cell line; and Clic5 is among the transcripts that
    rise in the cochlea of mice in which the whole miR-183/96/182 cluster has been
    inactivated.

    What does not follow: that DFNA50 acts through CLIC5. The directions are wrong for
    that reading. Losing miR-96 function de-represses CLIC5, so a seed mutation that
    abandons its normal targets should raise CLIC5, while DFNB103 is caused by biallelic
    loss of CLIC5. If anything the two diseases are inverse at this node rather than
    convergent.

    What is unknown is whether CLIC5 actually moves in a seed mutant. A seed mutation is
    not a null: it also acquires targets, and the diminuendo cochlea contains many
    hair-cell genes that go down without carrying a miR-96 site at all, so the sign of the
    CLIC5 change is an empirical question rather than a deduction. The hair-cell-specific
    Mir96 Dmdo transcriptome exists as GSE255796 but its publication does not report
    CLIC5.
  evidence:
  - reference: PMID:22889583
    reference_title: "MiR-183 family regulates chloride intracellular channel 5 expression in inner ear hair cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "miR-96 and miR-182 were found to be specifically overexpressed in HEI-OC1 cells into which mimics of these molecules had been transfected by liposomes causing the downregulation of CLIC5 at both the mRNA and protein levels"
    explanation: >-
      The direction of the regulation, which is what makes the naive "DFNA50 acts through
      CLIC5" reading untenable: more miR-96 means less CLIC5, so less functional miR-96
      should mean more CLIC5.
  - reference: PMID:30575790
    reference_title: "The microRNA-183/96/182 Cluster is Essential for Stereociliary Bundle Formation and Function of Cochlear Sensory Hair Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Several predicted target genes of the miR-183/96/182 cluster that are known to play important roles in HC development and function, including Clic5, Rdx, Ezr, Rac1, Myo1c, Pvrl3 and Sox2, are upregulated in the cochlea."
    explanation: The same direction confirmed in vivo, in a cluster-null cochlea.
  - reference: PMID:38826689
    reference_title: "A cell type-specific approach to elucidate the role of miR-96 in inner ear hair cells."
    supports: NO_EVIDENCE
    evidence_source: MODEL_ORGANISM
    snippet: "This Mir96Dmdo HC-specific RNA-seq data set is currently the only data set available for evaluating the regulatory cascade of Mir96Dmdo specifically in HCs."
    explanation: >-
      Identifies the dataset that could settle the question. Graded NO_EVIDENCE because
      the paper states the resource exists without reporting CLIC5 in it - it neither
      supports nor refutes the claim.
- discussion_id: mir96_13ga_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Sensorineural Hearing Loss
  prompt: >-
    Why does a mouse carrying the human MIR96 +13G>A allele in heterozygosis hear normally
    for a year, when the same heterozygous allele causes progressive hearing loss in the
    Spanish family it was taken from?
  rationale: >-
    The two human DFNA50 alleles were knocked into mice in the same laboratory, on the
    same background, using the same targeting strategy. The +14C>A line behaves like the
    human disease. The +13G>A line does not: homozygotes are profoundly deaf, but
    heterozygotes have normal ABR thresholds to one year, and neither a change of genetic
    background nor noise exposure revealed a latent phenotype.

    This is a mismatch rather than an absence of evidence. The experiment was done and the
    answer was negative, which is why it is filed as HUMAN_MODEL_MISMATCH rather than
    KNOWLEDGE_GAP. It matters for how any mouse result about MIR96 should be read: the
    seed alleles are not interchangeable, their transcriptomes are dissimilar, and the
    structural lesions differ - synaptic in one line, stereociliary in the other. A
    mechanism established in one allele does not transfer to the other by default, and
    two of the four mouse lines in this entry carry alleles no human patient has.

    Candidate explanations that have not been tested include a species difference in which
    transcripts carry a match to the +13G>A mutant seed, a dosage threshold that mouse
    hair cells clear and human ones do not, and a mouse lifespan too short for a phenotype
    that in humans takes decades.
  evidence:
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While the Mir96+14C>A heterozygotes mimic the phenotype observed in the family with the equivalent mutation, the Mir96+13G>A heterozygotes escape deafness while the same mutation causes progressive hearing loss in humans"
    explanation: The mismatch stated by the authors of the models.
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the heterozygous phenotypes differ markedly, with only one mutation resulting in hearing impairment in heterozygosis"
    explanation: The divergence between the two human-allele lines, summarised.
- discussion_id: dfna50_no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there any DFNA50-specific treatment to curate?
  rationale: >-
    No. This entry has no treatments block, deliberately. Nothing disease-modifying is
    approved or in trial for DFNA50, and no clinical trial keyed to MIR96 or DFNA50 was
    found. The two interventions in the literature - AAV-SaCas9-KKH editing of the mutant
    allele and oral amitriptyline - are both preclinical mouse work and are curated where
    they belong, as RESCUES links on the +14C>A knock-in model rather than as treatments.
    Amplification and cochlear implantation are the general management of sensorineural
    hearing loss, but no source describes their use or outcome in DFNA50 specifically, and
    importing a management statement from an unrelated cause of hair cell loss would
    attribute another disease's evidence to this one.
  evidence:
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Progressive hearing loss is a common problem in the human population with no effective therapeutics currently available."
    explanation: The absence of effective therapy for this class of hearing loss, stated by workers in the field.
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This is a proof of concept rather than a suggestion that amitriptyline be used as a treatment for humans carrying the MIR96+14C>A mutation, for several reasons."
    explanation: >-
      The authors declining to propose their own result as a treatment, which is the
      reason it is not curated as one here.
external_assertions:
- name: OMIM deafness, autosomal dominant 50 record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:613074
  url: https://omim.org/entry/613074
  description: >-
    The OMIM phenotype record for DFNA50, and the identifier the clinical literature uses
    for the disorder. Recorded here rather than under mappings because the DiseaseMappings
    class carries only ICD-10-CM, ICD-11, MONDO and NCIT slots.
notes: >-
  Scope decision: this is curated as a DISEASE, not a GROUPING or a subtype. One gene, one
  conserved pathograph running from a MIR96 point mutation to progressive sensorineural
  hearing loss, and no member diseases to unite. Its MONDO parent, MONDO:0019587
  autosomal dominant nonsyndromic hearing loss, is an ontology grouping of dozens of
  unrelated DFNA loci and is not a dismech entry.

  What is deliberately not curated. There is no treatments block; the reasoning is in the
  discussion dfna50_no_disease_modifying_therapy. There is no biochemical, histopathology,
  imaging or clinical_trials content, because no human material of that kind has been
  published for these three families. Detailed audiometric natural history - age at onset
  per allele, audiogram configuration, penetrance in the Italian pedigree - is described
  in the Soldà 2012 full text, which is not retrievable in this repository's reference
  cache; PubMed and Europe PMC return the abstract only, and the numbers are not quoted
  here rather than being taken second-hand from a review. A vestibular component reported
  in the Italian family is left out for the same reason.

  The deep-research report for this entry proposed three HPO terms that do not mean what
  it said: HP:0008527 was offered as "Postlingual sensorineural hearing impairment" when
  it is Congenital sensorineural hearing impairment, HP:0008607 as "Abnormality of the
  auditory threshold" when it is Progressive conductive hearing impairment, and HP:0000404
  does not resolve at all. Every term in this entry was resolved through OLS before use.

notes: On 2026-09-23, ClinicalTrials.gov searches returned no DFNA50 studies and one MIR96 hit, NCT02101437, an unrelated platelet/antiplatelet study. These bounded searches did not identify a DFNA50-directed clinical trial. Full-text clinical and experimental sources informed this review; the original Spanish report and the CLIC5 study remained abstract-only except for accessible Spanish figure captions. Model-derived anatomy and target networks are distinguished from human observations.
mechanistic_hypotheses:
- hypothesis_group_id: mir96_allele_specific_cochlear_dysfunction
  description: Altered miRNA targeting perturbs hair-cell maturation and maintenance, bundle function, synaptic function and survival. These routes are supported primarily in mice and vary by allele, zygosity and developmental stage. Their relative contributions in human carriers remain provisional.

- name: Arrest of Hair Cell Maturation
  biological_scale: CELLULAR
  description: >-
    Sensory hair cells stop developing around the day of birth, before inner and outer
    hair cells have diverged into their distinct biophysical identities. This is the
    central cellular lesion of the disease and it is a failure to finish maturing, not
    injury to a finished cell.
  biological_processes:

inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous MIR96 point mutations segregate with progressive hearing loss in the two
    original Spanish pedigrees and in a third Italian family. Dominance here is not
    haploinsufficiency: a heterozygous null allele of the Mir183/96 locus leaves mouse
    hearing normal, so one wild-type copy of miR-96 suffices, and it is the presence of a
    mutant mature miRNA rather than the absence of half the wild-type dose that produces
    the phenotype.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "point mutations in the seed region of miR-96, a miRNA expressed in hair cells of the inner ear, result in autosomal dominant, progressive hearing loss"
    explanation: The inheritance mode as established in the two founding families.
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 882 NSHL patients and 836 normal-hearing Italian controls and identified one putative novel mutation within the miR-96 gene in a family with autosomal dominant NSHL."
    explanation: An independent dominant pedigree, and the screening denominator behind it.
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Since we know that the Mir183/96dko heterozygotes have normal hearing, one copy of wildtype miR-96 is enough for normal hearing function."
    explanation: >-
      The mouse result that rules out haploinsufficiency as the basis of dominance and
      forces the mechanism onto the mutant miRNA product itself.
pathophysiology:
- name: MIR96 Seed-Region Point Mutation
  biological_scale: MOLECULAR
  description: >-
    A single-nucleotide substitution inside the seed of mature miR-96. Two such alleles
    are known in humans, +13G>A and +14C>A, each segregating in one Spanish family; the
    ENU-derived mouse allele diminuendo is a third, at a neighbouring seed position. The
    seed is nucleotides 2 to 7 of the mature strand and is what selects the target set,
    so a substitution there changes which transcripts miR-96 recognises rather than how
    much miR-96 there is - although mature-miRNA abundance is reduced as well.
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  genetic_context:
    genes:
    - preferred_term: MIR96
      term:
        id: hgnc:31648
        label: MIR96
    allele_type: single-nucleotide substitution within the seed region of the mature miR-96 strand
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Carriers are heterozygous. The two reported human seed alleles are +13G>A and
      +14C>A in the historical precursor-relative numbering used by the founding papers.
    notes: >-
      functional_impact_category is deliberately left absent. FunctionalImpactEnum is
      single-valued and none of its values describes this variant honestly. The mutation
      is simultaneously hypomorphic for the wild-type target set and neomorphic for a set
      of transcripts miR-96 never acted on, and the two halves are not separable claims
      about one activity - they are one substitution acting on two different target
      repertoires. LOSS_OF_FUNCTION is contradicted by the null-allele mice, which hear
      normally in heterozygosis; NEOMORPHIC records the acquired half while silently
      dropping the abandoned half, which is the half the founding papers argued was
      primary. A machine-readable value that half the prose beside it contradicts is
      worse than no value. The three-mechanism account is quoted in the evidence on the
      downstream nodes.
  evidence:
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first study implicating a miRNA in a mendelian disorder."
    explanation: >-
      The claim that gives this entry its mechanism class: a mutation inside a mature
      miRNA, not in a protein-coding sequence.
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified mutations have a strong impact on miR-96 biogenesis and result in a significant reduction of mRNA targeting."
    explanation: >-
      Both consequences measured in the founding paper - reduced mature miRNA and reduced
      targeting of the normal targets.
  - reference: PMID:38985856
    reference_title: "Targeted genome editing restores auditory function in adult mice with progressive hearing loss caused by a human microRNA mutation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Two mutations in the seed region, +13G>A (rs587776522) and +14C>A (rs587776523), have been identified as the cause of autosomal dominant nonsyndromic progressive hearing loss DFNA50"
    explanation: >-
      The two human seed alleles with their dbSNP identifiers. Graded OTHER because the
      sentence is this mouse gene-editing paper's introduction restating the human
      genetics it cites, not a result it generated.
  downstream:
  - target: Loss of Repression of Normal miR-96 Targets
  - target: Repression of Novel Targets Acquired by the Mutant Seed
- name: MIR96 Precursor Processing Defect
  biological_scale: MOLECULAR
  description: >-
    The third human allele, found in one Italian family, is not a seed mutation. It lies
    outside the mature miR-96 sequence, in the companion miR-96* strand of the precursor
    hairpin, and destabilises the hairpin so that Dicer cleavage is impaired. Mature
    miR-96 and miR-96* both fall while the precursor itself does not accumulate less, and
    a compensatory second mutation that restores hairpin pairing restores their levels.
    Because the mature seed is unchanged, this allele can only reduce repression of the
    normal target set; it cannot acquire novel targets. It is included as a separate
    initiating node for exactly that reason.
  biological_processes:
  - preferred_term: miRNA processing
    modifier: DECREASED
    term:
      id: GO:0035196
      label: miRNA processing
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  genetic_context:
    genes:
    - preferred_term: MIR96
      term:
        id: hgnc:31648
        label: MIR96
    allele_type: single-nucleotide substitution in the pre-miR-96 hairpin, within the miR-96* strand
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Unlike the seed alleles, this one has a controlled value that fits: the defect is
      purely quantitative, a reduced yield of an otherwise normal mature miR-96, which is
      what PARTIAL_LOSS_OF_FUNCTION describes.
  evidence:
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Although located outside the mature miR-96 sequence, the detected variant replaces a highly conserved nucleotide within the companion miR-96*, and is predicted to reduce the stability of the pre-miRNA hairpin."
    explanation: >-
      The location of the variant and the structural prediction. Graded COMPUTATIONAL
      because the destabilisation claim in this sentence is a secondary-structure
      prediction; the functional confirmation is quoted separately below.
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that both miR-96 and miR-96* levels were significantly reduced in the mutant, whereas the precursor levels were unaffected."
    explanation: >-
      The measurement that makes this a processing defect rather than a transcription
      defect - the precursor is made, but not converted.
  - reference: PMID:22038834
    reference_title: "A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrating that the mutation hinders precursor processing, probably interfering with Dicer cleavage"
    explanation: The compensatory-mutation rescue that identifies the step being blocked.
  downstream:
  - target: Loss of Repression of Normal miR-96 Targets
- name: Loss of Repression of Normal miR-96 Targets
  biological_scale: MOLECULAR
  description: >-
    Transcripts that carry a wild-type miR-96 site are no longer repressed and their
    levels rise. In the diminuendo organ of Corti the heptamer complementary to the
    wild-type seed is enriched in the 3-prime UTRs of hundreds of upregulated genes, and
    the same wild-type sites are enriched in the human and rat orthologues of those
    genes, so the target set is conserved rather than a mouse peculiarity. The
    quantitative reading is appropriate here: silencing of this particular target set is
    reduced, not qualitatively redirected, which is why the modifier is DECREASED.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing of the wild-type miR-96 target set
    modifier: DECREASED
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  notes: >-
    CLIC5 belongs to this target set, which creates a direct link to
    Autosomal_Recessive_Nonsyndromic_Hearing_Loss_103 (DFNB103), the CLIC5 deafness
    entry in this knowledge base. The link is real but it runs in the opposite direction
    to the obvious guess. miR-96 represses CLIC5 through a conserved site at nucleotides
    760-766 of the CLIC5 3-prime UTR, and Clic5 is among the transcripts that go up in
    the cochlea when the miR-183/96/182 cluster is inactivated. So the predicted
    consequence of a DFNA50 seed mutation is de-repression - more CLIC5, not less -
    whereas DFNB103 is a CLIC5 loss disease. DFNA50 is therefore not curated as acting
    through CLIC5; whether CLIC5 moves at all in seed-mutant hair cells has not been
    reported, and that gap is recorded in discussions as mir96_clic5_direction.
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hypergeometric P-value analysis showed that hundreds of genes were upregulated in mutants."
    explanation: >-
      The scale of de-repression in the diminuendo organ of Corti: hundreds of genes rise,
      which is what loss of normal targeting predicts.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This indicates that miR-96 normally modulates expression of a broad range of target genes, and that it affects mRNA levels rather than affecting translation alone."
    explanation: >-
      The Sylamer conclusion: the upregulated set carries wild-type miR-96 seed matches,
      so the effect is on this specific target set rather than a general one, and it is
      measurable as transcript abundance.
  - reference: PMID:19363479
    reference_title: "Mutations in the seed region of human miR-96 are responsible for nonsyndromic progressive hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that these mutations alter the regulatory role of miR-96 in maintaining gene expression profiles in hair cells required for their normal function."
    explanation: The founding paper's own framing of the consequence as a shifted expression profile.
  - reference: PMID:22889583
    reference_title: "MiR-183 family regulates chloride intracellular channel 5 expression in inner ear hair cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Our findings thus suggest that CLIC5 is directly regulated by miR-96 and miR-182 and that the target sequence in this regard is located between nucleotides 760-766 within the CLIC5 3'-UTR."
    explanation: >-
      Establishes CLIC5 as a member of the normal miR-96 target set, mapped to a specific
      site. Indirect for this node because it is a cell-line experiment on wild-type
      miR-96, not a measurement in a DFNA50 genotype.
  - reference: PMID:30575790
    reference_title: "The microRNA-183/96/182 Cluster is Essential for Stereociliary Bundle Formation and Function of Cochlear Sensory Hair Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Several predicted target genes of the miR-183/96/182 cluster that are known to play important roles in HC development and function, including Clic5, Rdx, Ezr, Rac1, Myo1c, Pvrl3 and Sox2, are upregulated in the cochlea."
    explanation: >-
      In vivo confirmation that losing cluster function de-represses this target set,
      Clic5 included, and the direction it moves. Indirect because the model is a
      gene-trap null of the whole cluster, not a miR-96 seed mutation.
  downstream:
  - target: Dysregulation of the Hair Cell Maturation Gene Programme
- name: Repression of Novel Targets Acquired by the Mutant Seed
  biological_scale: MOLECULAR
  description: >-
    The mutant seed is complementary to a different heptamer, so transcripts carrying
    that motif - which the wild-type miRNA ignored - are now repressed. The signature is
    visible in the same diminuendo transcriptome that shows the loss of normal targeting:
    the mutant seed match is enriched among the most downregulated genes. This is the
    half of the mechanism that a null allele cannot reproduce, and it is why null
    heterozygotes hear while seed-mutant heterozygotes do not.
  biological_processes:
  - preferred_term: miRNA-mediated post-transcriptional gene silencing of transcripts complementary to the mutant seed
    term:
      id: GO:0035195
      label: miRNA-mediated post-transcriptional gene silencing
  notes: >-
    modifier is deliberately left absent on this descriptor. What changed is the
    specificity of the silencing, not its level, and ModifierEnum has no value for that.
    INCREASED and DECREASED are the PATO-bound quantitative pair and would assert that an
    existing activity moved up or down, which is not the claim - these transcripts had no
    miR-96-mediated silencing to increase. GAIN_OF_FUNCTION is defined in this schema as
    a process being driven outside its normal regulatory constraints, which describes
    activation of the same process, not its redirection onto a different substrate set.
    DYSREGULATED ("regulation is impaired, may be increased or decreased") is the closest
    fit but still reads as a statement about level. Leaving the slot empty and saying why
    keeps the descriptor from asserting something the description contradicts.
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Different genes, with target sites complementary to the mutant seed, were downregulated."
    explanation: >-
      The direct transcriptomic signature of novel targeting: genes bearing the mutant
      seed match are the ones that go down, and they are a different set from the genes
      that carry wild-type sites.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "indicating that mutant miR-96 influences expression of newly-acquired target genes"
    explanation: The authors' reading of that enrichment, stated as acquisition of new targets.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the phenotype results from a lack of repression of normal targets even though we show a gain of repression of novel targets"
    explanation: >-
      The founding mouse paper's own weighting of the two halves, which at that time put
      the abandoned targets first. Recorded because the weighting later shifted, and both
      readings should be visible.
  - reference: PMID:33318051
    reference_title: "Hearing impairment due to Mir183/96/182 mutations suggests both loss and gain of function effects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose three mechanisms of action of mutant miRNAs; loss of targets that are normally completely repressed, loss of targets whose transcription is normally buffered by the miRNA, and gain of novel targets."
    explanation: >-
      The explicit three-mechanism account. It is the reason this entry splits the target
      repertoire into two nodes rather than collapsing it into one dysregulation node.
  - reference: PMID:33318051
    reference_title: "Hearing impairment due to Mir183/96/182 mutations suggests both loss and gain of function effects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "is likely to be mediated by the gain of novel target genes in addition to the loss of its normal targets"
    explanation: >-
      The comparison that isolates the novel-target contribution: the null mutant has
      fewer transcriptional changes and a milder phenotype than the seed mutant, which
      only the acquired targets can explain.
  downstream:
  - target: Dysregulation of the Hair Cell Maturation Gene Programme
- name: Dysregulation of the Hair Cell Maturation Gene Programme
  biological_scale: CELLULAR
  description: >-
    The two target-repertoire changes converge on a hair cell transcriptome that is
    shifted rather than simply damaged. In the diminuendo organ of Corti 96 transcripts
    are significantly altered, and the striking finding is which ones fall: Slc26a5
    (prestin), Ocm (oncomodulin), Gfi1, Ptprq and Pitpnm1, all required for hair cell
    maturation or function and none of them carrying a predicted miR-96 site. Their
    downregulation is therefore a network consequence, not direct de-repression, and it
    is specific to this mutant - the same genes stain normally in nine other mouse
    mutants with early hair cell degeneration.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  locations:

    snippet: "We found that the physiological development of mutant sensory hair cells is arrested at around the day of birth, before their biophysical differentiation into inner and outer hair cells."
    explanation: The timing and nature of the arrest, from single hair cell electrophysiology.
  downstream:
  - target: Stereociliary Bundle Maturation Failure
- name: Stereociliary Bundle Maturation Failure
  biological_scale: CELLULAR
  description: >-
    The stereociliary bundle does not acquire its mature form. In diminuendo heterozygotes
    outer hair cell bundles form a loose U rather than the precise V of controls, and
    inner hair cell bundles are smaller and more widely separated; homozygotes have
    irregular bundles and persistent clusters of ectopic stereocilia. The same rounding of
    the outer hair cell V is seen in mice carrying the human +14C>A allele. Bundle
    maturation and the remodelling of auditory nerve connections both fail.
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: ABNORMAL
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:21245307
    reference_title: "miR-96 regulates the progression of differentiation in mammalian cochlear inner and outer hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, maturation of the hair cell stereocilia bundle and remodelling of auditory nerve connections within the cochlea fail to occur in miR-96 mutants."
    explanation: The two maturation events that fail, stated together.
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Remaining outer hair cell stereocilia bundles formed a loose U-shape rather than the precise V-shape of controls"
    explanation: The morphological signature in heterozygotes, which are the genotype equivalent to human carriers.
  - reference: PMID:39434156
    reference_title: "Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In Mir96+14C>A heterozygotes, which have mild hearing loss by P28, some OHC stereocilia bundles have a U-shape, instead of the typical V-shape observed in wildtypes"
    explanation: >-
      The same lesion reproduced by a knock-in of an actual human DFNA50 allele rather
      than the ENU allele.
  downstream:
  - target: Outer Hair Cell Degeneration
- name: Outer Hair Cell Degeneration
  biological_scale: TISSUE
  description: >-
    Outer hair cells in the middle and basal turns degenerate while most inner hair cells
    survive. The ordering matters for how the disease should be read: hearing loss is
    already severe while many hair cells are still present, so degeneration follows the
    dysfunction rather than causing it.
  cell_types:
  - preferred_term: cochlear outer hair cell

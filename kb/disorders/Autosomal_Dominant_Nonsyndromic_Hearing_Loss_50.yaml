- discussion_id: mir96_13ga_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Progressive Sensorineural Hearing Loss
  prompt: Why does a mouse carrying the human MIR96 +13G>A allele in heterozygosis hear normally for a year, when the same heterozygous allele causes progressive hearing loss in the Spanish family it was taken from?
  rationale: The human +14C>A and +13G>A alleles produce distinct mouse phenotypes and transcriptomes. +13G>A heterozygotes retained normal thresholds through one year, while the corresponding human allele segregated with progressive hearing loss. The authors proposed species-specific acquired targets, including predicted +13G>A sites in human RAB11A that are absent from mouse Rab11a. This candidate has not been validated as the cause of the mismatch. Neither identical seed sequence nor a human-matched substitution guarantees conserved target repertoires. The discrepancy constrains transfer of mechanism and therapy between alleles.
  evidence:
  - reference: PMID:39434156
    reference_title: Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: While the Mir96+14C>A heterozygotes mimic the phenotype observed in the family with the equivalent mutation, the Mir96+13G>A heterozygotes escape deafness while the same mutation causes progressive hearing loss in humans
    explanation: The mismatch stated by the authors of the models.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  - reference: PMID:39434156
    reference_title: Pathological mechanisms and candidate therapeutic approaches in the hearing loss of mice carrying human MIR96 mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the heterozygous phenotypes differ markedly, with only one mutation resulting in hearing impairment in heterozygosis
    explanation: The divergence between the two human-allele lines, summarised.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- discussion_id: dfna50_preclinical_translation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Experimental AAV2 Mutant-Allele Editing
  - treatments#Experimental Amitriptyline
  prompt: Can allele-specific editing or transcriptome-guided drugs provide durable clinical benefit in DFNA50?
  rationale: The studies establish mouse proof of concept, not human efficacy. Editing benefit depends on the treatment window and surviving cells; safety is bounded by the assays and doses used. The amitriptyline effect was temporary at high experimental exposure. The multiplex guide construct targeted +13G>A, +14C>A and the mouse-derived +15A>T sequence in engineered cells; it did not demonstrate rescue of all human MIR96 alleles and did not include the Italian +57T>C allele. General hearing and communication care remains appropriate while these approaches are investigated.

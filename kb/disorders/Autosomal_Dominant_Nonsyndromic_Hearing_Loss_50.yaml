animal_models:
- name: diminuendo (Mir96 Dmdo) ENU seed-mutant mouse
  species: Mouse
  genotype: Mir96 Dmdo (ENU-induced single-base substitution in the miR-96 seed region), heterozygous and homozygous
  background: C3HeB/FeJ
  publication: PMID:19363478
  genes:
  - preferred_term: MIR96
    term:
      id: hgnc:31648
      label: MIR96
  description: ENU-derived Mir96 +15A>T seed mutant, distinct from the human alleles. Heterozygotes develop severe early auditory impairment and later hair-cell loss; homozygotes have profound impairment and complete neonatal maturation arrest. Transcriptomic motif enrichment supports both lost normal targeting and acquired targeting, subsequently also demonstrated in the human-seed knock-in models.
  modeled_mechanisms:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Diminuendo transcriptomes support an acquired-target signature alongside derepression of normal targets; the exact acquired repertoire is allele-specific.
    limitations: The seed position mutated in diminuendo is not one of the two positions mutated in human DFNA50 families, so the specific set of acquired targets is allele-specific and need not match a human carrier's. Enrichment of mutant-seed matches in human and rat orthologues of the downregulated genes was reported as barely above the significance threshold, unlike the wild-type-seed signal, so the acquired target set is the less conserved half of the mechanism.
    readouts:
    - name: Enrichment of the mutant-seed heptamer among downregulated 3-prime UTRs
      target: Repression of Novel Targets Acquired by the Mutant Seed
      direction: INCREASED
      interpretation: Transcripts carrying a match to the mutant seed are preferentially downregulated, which is what novel targeting predicts.
      evidence:
      - reference: PMID:19363478
        reference_title: An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice.
        supports: SUPPORT

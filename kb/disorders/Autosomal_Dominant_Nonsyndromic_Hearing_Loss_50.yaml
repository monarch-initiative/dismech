- name: MIR96 Precursor Processing Defect
  biological_scale: MOLECULAR
  description: The Italian +57T>C substitution lies in the precursor hairpin and the companion miR-96* (miR-96-3p) seed, while preserving the mature miR-96-5p sequence. In HeLa cells, mature miR-96 and miR-96* fell by approximately 85% and 77%, respectively, without reduced precursor abundance. A compensatory +23A>G change restored pairing, mature levels and MYRIP reporter repression. These results support defective processing, with impaired Dicer cleavage proposed rather than directly assayed. Altered targeting by the changed companion seed remains possible; it was not established by the tested reporters.

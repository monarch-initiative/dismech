name: Autosomal Dominant Nonsyndromic Hearing Loss 50
category: Mendelian
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- DFNA50
- autosomal dominant deafness 50
- autosomal dominant nonsyndromic deafness 50
- autosomal dominant nonsyndromic deafness type 50
- deafness, autosomal dominant 50
- deafness, autosomal dominant type 50
- MIR96-related hearing loss
description: >-
  DFNA50 is autosomal dominant, nonsyndromic, postlingual and progressive sensorineural
  hearing loss caused by heterozygous point mutations in MIR96. It is the disorder that
  established a microRNA as a Mendelian disease gene: before it, no pathogenic mutation
  inside the mature sequence of a miRNA had been described in any human disease.

  MIR96 does not encode a protein. It is one of three microRNAs - MIR183, MIR96, MIR182 -
  transcribed together at 7q32 and expressed in the sensory hair cells of the inner ear.
  A microRNA silences a target transcript by base-pairing to a complementary site in its
  3-prime untranslated region, and the specificity of that pairing is set almost entirely
  by the seed, nucleotides 2 to 7 of the mature strand. Both original DFNA50 alleles,
  +13G>A and +14C>A, sit in that seed.

  This makes the lesion a different kind of thing from the loss or gain of a protein
  function, and the distinction is not pedantic - it is what the mouse genetics shows.
  Changing one seed nucleotide does two things at once. It abandons the transcripts
  miR-96 is supposed to repress, which are then de-repressed; and it acquires new
  transcripts that carry a site complementary to the mutant seed, which are then
  repressed for the first time. Sylamer analysis of the diminuendo mouse organ of Corti
  shows both signatures in the same transcriptome: the wild-type seed match is enriched
  among the upregulated genes and the mutant seed match among the downregulated ones.
  Neither half alone accounts for the disease. Mice heterozygous for a Mir183/96 null
  allele - a clean loss of the microRNA - hear normally, while mice heterozygous for a
  seed point mutation go deaf, so simple haploinsufficiency is not the mechanism.

  A third human allele works a third way. The variant reported in an Italian family lies
  outside the mature miR-96 sequence, in the companion miR-96* strand of the precursor
  hairpin. It leaves the seed intact and instead destabilises the hairpin so that Dicer
  processing is impaired, cutting mature miR-96 without changing what miR-96 targets.
  That allele is a quantitative defect; the seed alleles are not.

  Downstream the picture is one of arrested maturation rather than degeneration of a
  formed organ. In the diminuendo mouse the physiological development of hair cells stops
  around the day of birth, before inner and outer hair cells have diverged biophysically,
  and stereociliary bundle maturation and the refinement of auditory nerve connections
  fail to happen. Genes needed for hair cell maturation - Slc26a5 (prestin), Ocm, Gfi1,
  Ptprq, Pitpnm1 - are markedly downregulated even though none of them carries a
  predicted miR-96 site, so this is an indirect consequence of a shifted regulatory
  network rather than direct target de-repression. Outer hair cell degeneration follows
  the dysfunction rather than preceding it.

  What reaches the clinic is a bilateral sensorineural loss that starts after speech is
  acquired and worsens over decades. There is no approved disease-modifying treatment.
  The therapeutic work is preclinical and is unusually concrete for a disease this rare,
  because human and mouse MIR96 are identical in sequence: adult cochlear AAV-SaCas9-KKH
  editing of the mutant allele preserves hearing long term in knock-in mice, and a
  transcriptome-derived drug candidate delays progression temporarily.

  notes: >-
    The five genes are bound to human HGNC identifiers, but every measurement behind this
    node is from mouse organ of Corti. The binding records gene identity across the
    orthologue pair; it does not assert that the same transcripts have been measured in
    human DFNA50 cochlea, which they have not.
  evidence:
  - reference: PMID:19363478
    reference_title: "An ENU-induced mutation of miR-96 associated with progressive hearing loss in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microarray analysis revealed 96 transcripts with significantly altered expression in homozygotes; notably, Slc26a5, Ocm, Gfi1, Ptprq and Pitpnm1 were downregulated."
    explanation: The named downregulated maturation genes and the size of the transcriptional shift.
  - reference: PMID:24446963
    reference_title: "A reduction in Ptprq associated with specific features of the deafness phenotype of the miR-96 mutant mouse diminuendo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The reduction in Ptprq observed in diminuendo mice appears to be a major contributor to the morphological, transcriptional and electrophysiological phenotype, but does not account for the complete diminuendo phenotype."
    explanation: >-
      Quantifies how much of the phenotype one downregulated gene carries, and states the
      limit. This is why the node is a programme rather than a single effector.
  downstream:

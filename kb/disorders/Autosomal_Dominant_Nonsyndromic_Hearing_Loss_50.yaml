    therapeutic_agent:
    - preferred_term: amitriptyline
      term:
        id: CHEBI:2666
        label: amitriptyline
  context: Preclinical Mir96 +14C>A mouse study
  description: Transcriptome-guided selection led to amitriptyline testing in drinking water, beginning with treated breeding parents and continuing in offspring. High-frequency threshold deterioration was temporarily delayed in heterozygotes. Homozygotes did not improve and doubling the dose did not add benefit. The exposure exceeded usual human dosing by body weight, and the authors explicitly did not propose clinical use for DFNA50. The responsible molecular target remains unresolved.

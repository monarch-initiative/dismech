      term:
        id: CL:0000589
        label: cochlear inner hair cell
    - preferred_term: cochlear outer hair cell
      term:
        id: CL:0000601
        label: cochlear outer hair cell
  target_mechanisms:
  - target: Repression of Novel Targets Acquired by the Mutant Seed
    treatment_effect: INHIBITS
    description: Allele-specific disruption reduces the mutant product; hearing rescue supports the strategy in +14C>A mice without establishing normalization of every target transcript.

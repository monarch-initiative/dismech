- name: Experimental AAV2 Mutant-Allele Editing
  therapeutic_modality: GENE_EDITING
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  context: Preclinical Mir96 +14C>A heterozygous mouse experiments
  description: AAV2 delivered SaCas9-KKH and an allele-specific sgRNA through the round window with canal fenestration, disrupting the mutant allele by end joining. Treatment at three or six weeks preserved hearing and hair cells; intervention at sixteen weeks did not improve thresholds. This is not correction of the nucleotide or an established human treatment. Editing and safety were assessed in selected mouse assays; low integration was detected at the standard dose and was below assay background at a lower dose.
  delivery_system:
    delivery_platform: VIRAL_VECTOR
    description: Local cochlear AAV2 delivery of SaCas9-KKH and sgRNA-4.
    target_cell_types:

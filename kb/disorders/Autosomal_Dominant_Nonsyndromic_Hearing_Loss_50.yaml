diagnosis:
- name: Audiologic and Molecular Diagnosis
  description: Assess bilateral thresholds, frequency configuration, speech understanding, onset, progression, vestibular symptoms and family history. Use a hearing-loss multigene panel or genomic testing with confirmed coverage of the noncoding MIR96 precursor, followed by pathogenicity interpretation. Coding-exon-focused assays can miss this locus. A pathogenic or likely pathogenic variant consistent with the phenotype supports diagnosis; a VUS alone does not. Once established, a familial variant permits targeted testing of relatives.
  evidence:
  - reference: PMID:22038834
    reference_title: A novel mutation within the MIR96 gene causes non-syndromic inherited hearing loss in an Italian family by altering pre-miRNA processing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We screened 882 NSHL patients and 836 normal-hearing Italian controls and identified one putative novel mutation within the miR-96 gene in a family with autosomal dominant NSHL.
    explanation: Targeted screening of miRNA loci found the Italian allele in a mixed sporadic/familial hearing-loss cohort.
    quote_role: PRIMARY_RESULT
    directness: DIRECT

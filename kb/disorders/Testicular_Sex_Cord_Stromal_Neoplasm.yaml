    term:
      id: UBERON:0000473
      label: testis
  downstream:
  - target: Wnt/Beta-Catenin Pathway Activation
    description: A subset of Sertoli and Leydig cell tumors are driven by CTNNB1 mutation.
  - target: cAMP/PKA Pathway Activation
    description: GNAS and PRKAR1A lesions activate cAMP/PKA signaling in tumor cells.
  - target: TGF-beta-Driven Sertoli-to-Granulosa Transdifferentiation
    description: >-
      In a subset of tumors, dysregulated TGF-beta signaling reprograms Sertoli cells
      toward a granulosa-like fate, contributing to granulosa-cell tumor formation.
  - target: Autonomous Gonadal Steroidogenesis
    description: Tumor cells secrete sex steroids independent of normal regulation.
  - target: Testicular Mass
    description: >-
      Clonal expansion of the gonadal stromal cells forms the intratesticular
      mass through which most of these tumors present.
- name: Wnt/Beta-Catenin Pathway Activation
  description: >-
    Recurrent activating (exon 3) mutations in CTNNB1 stabilize beta-catenin, leading to
    constitutive canonical Wnt signaling and nuclear beta-catenin accumulation in a subset
    of testicular Sertoli cell and Leydig cell tumors.
  genes:
  - preferred_term: CTNNB1
    description: >-
      The gene whose exon 3 activating mutation stabilizes beta-catenin in this
      node.
    term:
      id: hgnc:2514
      label: CTNNB1
  molecular_functions:
  - preferred_term: beta-catenin transcription coactivator activity
    modifier: GAIN_OF_FUNCTION
    description: >-
      Exon 3 mutations remove the sites through which the destruction complex
      targets beta-catenin for degradation, so the stabilized protein enters the
      nucleus and co-activates TCF/LEF target genes such as cyclin D1 without an
      upstream Wnt signal. The qualitative modifier records that the activity
      has escaped regulation, not merely risen.
    term:
      id: GO:0003713
      label: transcription coactivator activity
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  evidence:
  - reference: PMID:28204871
    reference_title: "The role of beta-catenin mutation and SOX9 expression in sex cord-stromal tumours of the testis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      β-catenin mutation in SCT results in nuclear β-catenin
      and cyclin-D1 expressions on immunohistochemical analysis.
    explanation: >-
      Exon 3 CTNNB1 (beta-catenin) mutation in testicular Sertoli cell tumors produces
      nuclear beta-catenin and cyclin D1 expression, the molecular hallmark of
      constitutive canonical Wnt pathway activation.
- name: cAMP/PKA Pathway Activation
  description: >-
    Activating GNAS mutations (constitutive Gs-alpha) and loss of the PKA regulatory
    subunit PRKAR1A (in Carney complex) both increase protein kinase A signaling, driving
    proliferation and steroidogenesis in Leydig and Sertoli cell tumors. PRKAR1A
    inactivation underlies large-cell calcifying Sertoli cell tumors in Carney complex.
  notes: >-
    GNAS and PRKAR1A reach this node by different lesions, a gained Gs-alpha
    activity upstream of cAMP and a lost PKA regulatory subunit downstream of
    it, and the one molecular function true of both is the resulting
    catalytic activity of protein kinase A, which is what is bound. The Sertoli
    cell is included beside the Leydig cell because the PRKAR1A evidence on
    this node is from large-cell calcifying Sertoli cell tumors.
  genes:
  - preferred_term: GNAS
    description: >-
      Somatic activating (gsp, e.g. R201C) mutation in Leydig cell tumors,
      producing a constitutively active Gs-alpha subunit.
    term:
      id: hgnc:4392
      label: GNAS
  - preferred_term: PRKAR1A
    description: >-
      Germline (Carney complex) or somatic inactivation of the PKA type I-alpha
      regulatory subunit in large-cell calcifying Sertoli cell tumors.
    term:
      id: hgnc:9388
      label: PRKAR1A
  molecular_functions:
  - preferred_term: protein kinase A catalytic activity
    modifier: INCREASED
    description: >-
      Both lesions converge on unrestrained PKA catalytic activity: more cAMP
      from constitutive Gs-alpha, or less inhibition of the catalytic subunit
      when the regulatory subunit is lost.
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: cAMP/PKA signal transduction
    modifier: INCREASED
    term:
      id: GO:0141156
      label: cAMP/PKA signal transduction
  evidence:
  - reference: PMID:38154678
    reference_title: "Molecular characterization of large cell calcifying sertoli cell tumors: A multi-institutional study of 6 benign and 2 malignant tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRKAR1A alterations were present in all cases and appear to
      be the major driver in LCCSCTs.
    explanation: >-
      Targeted sequencing of large-cell calcifying Sertoli cell tumors identified
      PRKAR1A alterations as the major molecular driver, supporting dysregulated
      cAMP/PKA signaling as the central mechanism in this Sertoli cell tumor variant.
  - reference: PMID:22016347
    reference_title: "A rare cause of hypertestosteronemia in a 68-year-old patient: a Leydig cell tumor due to a somatic GNAS (guanine nucleotide-binding protein, alpha-stimulating activity polypeptide 1)-activating mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous missense somatic gsp mutation (R201C)
      was found in tumoral tissue, whereas no mutation was found in the surrounding
      normal tissue or in leukocyte DNA.
    explanation: >-
      A tumour-restricted activating GNAS (gsp) mutation in a Leydig cell tumour,
      the Leydig-cell route into this node alongside PRKAR1A loss in Sertoli
      cell tumours.
  downstream:
  - target: Autonomous Gonadal Steroidogenesis
    description: >-
      Elevated cAMP/PKA signaling drives steroidogenic gene expression in Leydig cell
      tumors, promoting autonomous sex-steroid synthesis.
- name: TGF-beta-Driven Sertoli-to-Granulosa Transdifferentiation
  description: >-
    In a genetically engineered mouse model, sustained Sertoli cell-specific activation
    of the TGF-beta receptor TGFBR1 is sufficient to reprogram Sertoli cells toward a
    granulosa-like fate and to drive testicular granulosa cell tumor formation. This
    provides a mechanistic link between TGF-beta signaling dysregulation and the
    granulosa-cell phenotype of a subset of testicular sex cord-stromal tumors.
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
  evidence:
  - reference: PMID:38067144
    reference_title: "Sertoli Cell-Specific Activation of Transforming Growth Factor Beta Receptor 1 Leads to Testicular Granulosa Cell Tumor Formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      overactivation of TGFBR1 in Sertoli cells would promote their transdifferentiation
      into granulosa-like cells and the formation of TGCTs.
    explanation: >-
      A mouse model demonstrates that constitutive TGFBR1 activation in Sertoli cells
      drives their transdifferentiation into granulosa-like cells and testicular
      granulosa cell tumor formation, implicating TGF-beta signaling in SCST pathogenesis.
- name: LKB1 Loss in Sertoli Cells
  biological_scale: MOLECULAR
  subtypes:
  - Large-Cell Calcifying Sertoli Cell Tumor
  description: >-
    In boys with Peutz-Jeghers syndrome, the germline STK11 mutation is joined
    by loss of the second allele in Sertoli cells of the abnormal testicular
    cords, so those cells lack the LKB1 serine/threonine kinase. Loss of LKB1
    reduces phosphorylation of its target AMPK, and AMPK no longer holds the
    CRTC transcriptional coactivators out of the nucleus.
  genes:
  - preferred_term: STK11
    description: >-
      Germline heterozygous in Peutz-Jeghers syndrome, with loss of
      heterozygosity in the affected Sertoli cells.
    term:
      id: hgnc:11389
      label: STK11
  molecular_functions:
  - preferred_term: LKB1 serine/threonine kinase activity
    modifier: LOSS_OF_FUNCTION
    description: >-
      LKB1 protein is absent from the affected Sertoli cells after loss of the
      second allele, so its kinase activity toward AMPK is lost rather than
      reduced.
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  evidence:
  - reference: PMID:24037887
    reference_title: "Overexpression of aromatase associated with loss of heterozygosity of the STK11 gene accounts for prepubertal gynecomastia in boys with Peutz-Jeghers syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss of heterozygosity of STK11, measured by the absence of LKB1
      immunofluorescence, was observed in Sertoli cells of abnormal cords of
      testis samples from affected individuals.
    explanation: >-
      Testicular biopsies from two boys with Peutz-Jeghers syndrome show loss of
      the second STK11 allele and absent LKB1 protein in Sertoli cells.
  - reference: PMID:24037887
    reference_title: "Overexpression of aromatase associated with loss of heterozygosity of the STK11 gene accounts for prepubertal gynecomastia in boys with Peutz-Jeghers syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was associated with loss of p21 expression and decreased
      phosphorylation of AMPK, known downstream targets of LKB1
    explanation: >-
      Reduced AMPK phosphorylation in the same Sertoli cells is the functional
      readout of lost LKB1 kinase activity.
  downstream:
  - target: Sertoli Cell Aromatase Overexpression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Without LKB1-dependent AMPK activity, CRTC coactivators accumulate in the
      nucleus and stimulate aromatase (CYP19A1) expression.
    evidence:
    - reference: PMID:24037887
      reference_title: "Overexpression of aromatase associated with loss of heterozygosity of the STK11 gene accounts for prepubertal gynecomastia in boys with Peutz-Jeghers syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loss of heterozygosity of the STK11 gene leads to an increase in
        aromatase expression associated with an increase in CRTC nuclear
        localization
      explanation: >-
        States the step this edge asserts, from STK11 loss to aromatase
        overexpression, with CRTC nuclear localization as the intermediate.
- name: Sertoli Cell Aromatase Overexpression
  biological_scale: CELLULAR
  subtypes:
  - Large-Cell Calcifying Sertoli Cell Tumor
  description: >-
    Sertoli cell tumors arising in Peutz-Jeghers syndrome and Carney complex,
    typically the large-cell calcifying type, overexpress aromatase and so
    convert androgen to estrogen within the testis. This is how prepubertal
    boys with these tumors develop gynecomastia and advanced bone age while
    their gonadotropins and testosterone stay prepubertal, and why aromatase
    inhibitors control those signs.
  notes: >-
    The upstream edge from STK11 loss is sourced; a corresponding edge from
    PRKAR1A loss in Carney complex is not drawn, because the only source found
    for it (PMID:16944977) proposes it as a hypothesis for both syndromes
    rather than showing it.
  molecular_functions:
  - preferred_term: aromatase activity
    modifier: INCREASED
    term:
      id: GO:0070330
      label: aromatase activity
  biological_processes:
  - preferred_term: estrogen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006703
      label: estrogen biosynthetic process
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  evidence:
  - reference: PMID:16944977
    reference_title: "High TGFbeta1, estrogen receptor, and aromatase gene expression in a large cell calcifying sertoli cell tumor (LCCSCT): implications for the mechanism of oncogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mean expression of aromatase and TGFbeta1 mRNAs in Tu was 6- and 2.3-fold
      higher than in ExTu, respectively (P<0.05).
    explanation: >-
      In a large-cell calcifying Sertoli cell tumor from a boy with bilateral
      gynecomastia, aromatase mRNA was six-fold higher in tumor nodules than in
      the adjacent normal-looking testis.
  downstream:
  - target: Estrogen-Mediated Clinical Manifestations
    causal_link_type: DIRECT
    description: >-
      Estrogen made by the tumor's aromatase drives breast growth and skeletal
      advancement; blocking aromatase reverses both.
    evidence:
    - reference: PMID:30052520
      reference_title: "Prepubertal gynaecomastia in a boy with Peutz-Jeghers syndrome: managing the aromatase overexpression."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gynaecomastia, although rarely related to testicular tumours, in boys
        with Peutz-Jeghers syndrome (PJS) usually occurs due to large-cell
        calcifying Sertoli cell tumour (LCCSCT).
      explanation: >-
        Attributes gynecomastia in boys with Peutz-Jeghers syndrome to the
        large-cell calcifying Sertoli cell tumor.
    - reference: PMID:30052520
      reference_title: "Prepubertal gynaecomastia in a boy with Peutz-Jeghers syndrome: managing the aromatase overexpression."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The Testicular Juvenile Granulosa Cell Tumor (JGCT) is a rare testicular
      neoplasm that appears in the first months of life as a painless testicular mass.
    explanation: >-
      Juvenile granulosa cell tumor, a testicular sex cord-stromal tumor, classically
      presents as a painless testicular mass.
- name: Testicular Neoplasm
  category: Neoplastic
  description: >-

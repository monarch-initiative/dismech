genetic:
- name: CTNNB1
  association: >-
    Recurrent activating exon 3 mutations in CTNNB1 stabilize beta-catenin and drive
    canonical Wnt signaling in a subset of testicular Sertoli and Leydig cell tumors.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: CTNNB1
    term:
      id: hgnc:2514
      label: CTNNB1
  evidence:
  - reference: PMID:28204871
    reference_title: "The role of beta-catenin mutation and SOX9 expression in sex cord-stromal tumours of the testis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutation analyses of the β-catenin gene (exon 3;
      CTNNB1) were performed.
    explanation: >-
      Exon 3 CTNNB1 mutation analysis in testicular sex cord-stromal tumors identified
      recurrent beta-catenin mutations in Sertoli cell tumors.
- name: GNAS
  association: >-
    Activating GNAS mutations producing a constitutively active Gs-alpha subunit and
    elevated cAMP/PKA signaling occur in a subset of Leydig and Sertoli cell tumors.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: GNAS
    term:
      id: hgnc:4392
      label: GNAS
  evidence:
  - reference: PMID:22016347
    reference_title: "A rare cause of hypertestosteronemia in a 68-year-old patient: a Leydig cell tumor due to a somatic GNAS (guanine nucleotide-binding protein, alpha-stimulating activity polypeptide 1)-activating mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A heterozygous missense somatic gsp mutation (R201C)
      was found in tumoral tissue, whereas no mutation was found in the surrounding
      normal tissue or in leukocyte DNA.
    explanation: >-
      A somatic activating GNAS (gsp R201C) mutation was identified specifically in
      Leydig cell tumor tissue, implicating GNAS activation in tumorigenesis.
- name: PRKAR1A
  association: >-
    Germline inactivating PRKAR1A mutations cause Carney complex and predispose to
    large-cell calcifying Sertoli cell tumor through loss of PKA regulatory control.
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    RISK_FACTOR rather than CAUSATIVE for this entry: germline PRKAR1A
    inactivation (Carney complex) predisposes to one subtype, the large-cell
    calcifying Sertoli cell tumor, and is neither necessary nor sufficient for
    testicular sex cord-stromal neoplasia as a whole. Sporadic large-cell
    calcifying Sertoli cell tumors also carry PRKAR1A alterations, hence the
    combined variant origin.
  gene_term:
    preferred_term: PRKAR1A
    term:
      id: hgnc:9388
      label: PRKAR1A
  evidence:
  - reference: PMID:38619599
    reference_title: "Familial syndromes associated with testicular and paratesticular neoplasms: a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such examples include Carney complex and large cell
      calcifying Sertoli cell tumor
    explanation: >-
      Carney complex, caused by germline PRKAR1A inactivation, is a well-established
      predisposition syndrome for large cell calcifying Sertoli cell tumor.
- name: STK11
  association: >-
    Germline STK11 (LKB1) inactivation causes Peutz-Jeghers syndrome and predisposes to
    Sertoli cell tumors, including the large-cell calcifying variant.
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    RISK_FACTOR for the same reason as PRKAR1A: germline STK11 inactivation
    (Peutz-Jeghers syndrome) predisposes to Sertoli cell tumors in a minority
    of the entry's cases. The tumor-level event is loss of the second allele in
    Sertoli cells (see LKB1 Loss in Sertoli Cells).
  gene_term:
    preferred_term: STK11
    term:
      id: hgnc:11389
      label: STK11
  evidence:
  - reference: PMID:38619599
    reference_title: "Familial syndromes associated with testicular and paratesticular neoplasms: a comprehensive review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peutz-Jeghers syndrome and intratubular large
      cell hyalinizing Sertoli cell neoplasia
    explanation: >-
      Peutz-Jeghers syndrome, caused by germline STK11 inactivation, is associated with
      a distinctive intratubular large cell hyalinizing Sertoli cell neoplasia of the
      testis.
- name: FOXL2
  association: >-
    Adult-type granulosa cell tumors of the testis can harbor the FOXL2 C134W mutation,
    the same recurrent somatic variant characteristic of ovarian adult granulosa cell
    tumors, reflecting a shared granulosa-lineage oncogenic driver.
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  gene_term:
    preferred_term: FOXL2
    term:
      id: hgnc:1092
      label: FOXL2
  evidence:
  - reference: PMID:37565864
    reference_title: "Adult granulosa cell tumor of the testis with malignant tendency: A case report with genetic analysis using high-throughput sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A high-throughput sequencing of 520 cancer-related genes revealed FOXL2 C134W,
      CDKN2A E87Gfs*24, TP53 S183*, TERT c.-124C > T, and H3F3A K28R mutations in this
      case.
    explanation: >-
      Sequencing of an adult testicular granulosa cell tumor identified the FOXL2 C134W
      mutation, the hallmark driver of adult-type granulosa cell tumors.
treatments:
- name: Radical or Testis-Sparing Orchiectomy
  description: >-
    Surgical removal of the tumor is the mainstay of treatment. Most sex cord-stromal
    tumors are benign and cured by radical inguinal orchiectomy or, for small benign
    lesions, testis-sparing (partial) orchiectomy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301463
    reference_title: "Carney Complex."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      orchiectomy for boys with aggressive LCCSCT and gynecomastia to avoid premature
      epiphyseal fusion and induction of central precocious puberty
    explanation: >-
      Orchiectomy is indicated for aggressive Sertoli cell tumors with endocrine
      manifestations, supporting surgery as the mainstay of management.
- name: Retroperitoneal Lymph Node Dissection
  description: >-
    Considered for malignant sex cord-stromal tumors with features predictive of
    metastasis, since these tumors respond poorly to chemotherapy and radiotherapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:12910519
    reference_title: "Does retroperitoneal lymph node dissection have a curative role for patients with sex cord-stromal testicular tumors?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RPLND remains an option to be performed
      immediately after orchiectomy, especially in patients who have tumors with
      malignant features and/or small-volume metastatic disease.
    explanation: >-
      Retroperitoneal lymph node dissection is an option performed after orchiectomy
      for testicular sex cord-stromal tumors with malignant features or small-volume
      metastatic disease, directly supporting RPLND as a surgical management modality.
  - reference: PMID:40345119
    reference_title: "A Single Centre Review of the Management of Testicular Sex Cord-Stromal Cell Tumours."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been demonstrated that certain histopathological risk factors
      can be useful in identifying those with malignant potential.
    explanation: >-
      Histopathological risk factors identify sex cord-stromal tumors with malignant
      potential, guiding selection for patients who warrant more aggressive surgical
      management such as retroperitoneal lymph node dissection.

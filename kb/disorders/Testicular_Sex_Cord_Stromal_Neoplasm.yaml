    term:
      id: CL:0000178
      label: Leydig cell
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell

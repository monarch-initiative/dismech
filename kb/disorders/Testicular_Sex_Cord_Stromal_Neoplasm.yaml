- name: FOXL2 C134W Neomorphic Transcription Factor Activity
  biological_scale: MOLECULAR
  subtypes:
  - Granulosa Cell Tumor
  description: >-
    The recurrent somatic FOXL2 c.402C>G (p.C134W) variant of adult-type
    granulosa cell tumors, found also in the rare testicular adult granulosa
    cell tumor, changes what the FOXL2 transcription factor does rather than
    removing it. The mutant protein gains the ability to bind SMAD4 and, with
    SMAD2/3, occupies a hybrid DNA motif that wild-type FOXL2 does not bind,
    switching on genes for epithelial-to-mesenchymal transition, stemness and
    oncogenesis.
  notes: >-
    The mechanism was worked out in ovarian adult granulosa cell tumors and
    granulosa cell lines; for the testis there is the variant itself in
    sequenced tumors, so the node's testicular claim is that the same lesion is
    present. It is not placed on TGF-beta-Driven Sertoli-to-Granulosa
    Transdifferentiation, although both involve SMAD signalling: that node is
    TGFBR1 activation in Sertoli cells of a mouse model, a different lesion in
    a different starting cell, and none of the sources links the two. No
    downstream edge is drawn because this entry does not model granulosa cell
    proliferation as a separate node.
  genes:
  - preferred_term: FOXL2
    description: >-
      Somatic, typically monoallelic, p.C134W variant.
    term:
      id: hgnc:1092
      label: FOXL2
  molecular_functions:
  - preferred_term: FOXL2 C134W DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
    description: >-
      Neomorphic: the mutant binds SMAD4 and a hybrid DNA motif unique to it,
      so the change is a new activity rather than more of the old one.
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  evidence:
  - reference: PMID:37565864
    reference_title: "Adult granulosa cell tumor of the testis with malignant tendency: A case report with genetic analysis using high-throughput sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A high-throughput sequencing of 520 cancer-related genes revealed FOXL2 C134W,
      CDKN2A E87Gfs*24, TP53 S183*, TERT c.-124C > T, and H3F3A K28R mutations in this

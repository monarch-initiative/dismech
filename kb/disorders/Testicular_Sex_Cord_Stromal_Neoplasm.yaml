      AGHCAHAA, unique to the FOXL2C134W mutant.
    explanation: >-
      Establishes the gained activity in granulosa cell lines; indirect for the
      testis because the work is on ovarian tumor biology.
  - reference: PMID:36409821
    reference_title: "The Oncogenic FOXL2 C134W Mutation Is a Key Driver of Granulosa Cell Tumors."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The genes dysregulated in mouse AGCTs exhibited the hallmarks of cancer and
      were consistent with a gain-of-function of the mutated allele affecting
      TGFβ signaling.
    explanation: >-
      A knock-in mouse carrying the variant develops ovarian adult granulosa
      cell tumors whose transcriptome reads as a gain of function of the mutant
      allele, supporting the modifier on this node.
- name: Autonomous Gonadal Steroidogenesis
  description: >-
    Hormonally active Leydig cell tumors autonomously synthesize testosterone; peripheral
    and intratumoral aromatase converts androgens to estrogens. Excess sex steroids produce
    gynecomastia in adults and isosexual precocious puberty in prepubertal boys.
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  biological_processes:
  - preferred_term: androgen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006702
      label: androgen biosynthetic process
  - preferred_term: estrogen biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006703
      label: estrogen biosynthetic process
  evidence:
  - reference: PMID:22016347
    reference_title: "A rare cause of hypertestosteronemia in a 68-year-old patient: a Leydig cell tumor due to a somatic GNAS (guanine nucleotide-binding protein, alpha-stimulating activity polypeptide 1)-activating mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      activating gsp mutation in Leydig cells may result in tumor development, leading
      to overexpression of the inhibin alpha subunit and hyperactivity of the
      testosterone biosynthetic pathway.
    explanation: >-
      A somatic activating GNAS (gsp R201C) mutation in a Leydig cell tumor drove
      hyperactivity of the testosterone biosynthetic pathway, demonstrating autonomous
      tumoral steroidogenesis.
  downstream:
  - target: Estrogen-Mediated Clinical Manifestations
    description: Excess estrogen drives gynecomastia and feminization.
- name: Estrogen-Mediated Clinical Manifestations
  description: >-
    Tumor-derived estrogen excess produces gynecomastia and can suppress the
    hypothalamic-pituitary-gonadal axis, reducing spermatogenesis and fertility.
  biological_processes:
  - preferred_term: estrogen receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  notes: >-
    No estrogen receptor gene is bound on this node. It is ligand excess from
    the tumor acting on structurally normal receptors in two remote target
    tissues, the breast and the hypothalamic-pituitary axis, and the node
    carries no cell type that would fix which receptor is meant. None of the
    sources cited in this entry names a receptor. PubMed searches run for this
    decision: Leydig cell tumor with gynecomastia and estrogen receptor in the
    title or abstract returned nothing; sex cord-stromal with testis and
    estrogen receptor returned one record (PMID:21974818), which reports GPER
    expression in tumor and normal testis and states that testicular estrogen
    signaling runs through estrogen receptor beta isoforms, measuring the
    tumor tissue rather than the tissues where this node's manifestations
    arise; Sertoli cell tumor with estrogen receptor returned five, of which
    the one human testis report (PMID:16944977) describes aromatase and
    estrogen receptor expression within a large-cell calcifying Sertoli cell
    tumor as a mechanism of tumor development, again the tumor rather than the
    target tissue; and gynecomastia in the title with estrogen receptor alpha
    or ESR1 returned two, of which PMID:21597315 found estrogen receptor beta
    expressed above alpha in stromal cells of pubertal gynecomastia tissue and
    both barely detectable in epithelial cells, so even the breast arm of this
    node does not reduce to ESR1. Records for Leydig cell tumor with
    gynecomastia and estradiol are case reports of estradiol-producing tumors;
    the abstracts of those cited as evidence here report estradiol excess,
    gynecomastia and low gonadotropins but name no receptor. The INCREASED
    modifier on the pathway term carries the ligand-excess consequence.
  evidence:
  - reference: PMID:9235082
    reference_title: "[Gynecomastia and Leydig cell tumor]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The more frequent hormonal manifestations of these tumors are high
      plasmatic and urinary estrogen levels, low serum testosterone, low
      testosterone/estradiol index, and FSH or LH low levels as well.
    explanation: >-
      Summarises the endocrine picture of Leydig cell tumors as estrogen excess
      with suppressed FSH and LH, the two arms of this node.
  - reference: PMID:16671273
    reference_title: "[An uncommon cause of gynecomastia: testicular Leydig cell tumor. Hormonal profile before and after orchiectomy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endocrine function tests showed decreased gonadotropin concentrations, and
      reduction of testosterone/estradiol ratio.
    explanation: >-
      A man with bilateral gynecomastia and a Leydig cell tumor had a lowered
      testosterone-to-estradiol ratio with suppressed gonadotropins.
  - reference: PMID:16671273
    reference_title: "[An uncommon cause of gynecomastia: testicular Leydig cell tumor. Hormonal profile before and after orchiectomy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After surgery, the gynecomastia has completely disappeared and hormonal
      alterations returned to normal.
    explanation: >-
      Removing the tumor reversed both the gynecomastia and the hormonal
      changes, tying them to the tumor's output.
  - reference: PMID:29166332
    reference_title: "Testicular Estrogen-Secreting Leydig Cell Tumor in 18F-FDG PET/CT: An Incidental Detection in a Patient Treated by Chemotherapy for Hodgkin Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The serum estradiol level was abnormally elevated reflecting the
      estrogen-secreting profile.
    explanation: >-
      A benign Leydig cell tumor presenting with bilateral gynecomastia secreted
      estradiol.
  downstream:
  - target: Gynecomastia
    causal_link_type: DIRECT
    description: >-
      Tumor-derived estrogen stimulates male breast tissue growth; the
      gynecomastia regresses once the tumor is removed.
    evidence:
    - reference: PMID:12628123
      reference_title: "[Gynecomastia secondary to Leydig cell tumor]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two months after surgery, the gynecomastia diminished gradually and
        estrogen levels returned to normal.
      explanation: >-
        Gynecomastia and estrogen excess fell together after orchidectomy for a
        Leydig cell tumor, tying the breast growth to the tumor's estrogen.
phenotypes:
- name: Testicular Mass
  category: Neoplastic
  description: >-
    Painless unilateral testicular mass is the most common presentation of testicular
    sex cord-stromal tumors.
  phenotype_term:

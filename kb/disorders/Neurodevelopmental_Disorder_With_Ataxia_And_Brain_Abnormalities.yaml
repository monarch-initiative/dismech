    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subjects S1 and S2 fibroblasts harboured fragmented mitochondria, characterized by an increased number of cells with small round-shaped mitochondria and a decrease of mitochondrial length and area compared to controls"

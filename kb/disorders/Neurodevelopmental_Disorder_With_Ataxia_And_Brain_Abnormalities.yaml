name: Neurodevelopmental Disorder With Ataxia And Brain Abnormalities
creation_date: "2026-10-22T13:25:13Z"
category: Mendelian
parents:
- Primary mitochondrial disease
- Neurodevelopmental disorder
synonyms:
- NEDAXBA
- PTPMT1-related neurodevelopmental disorder
description: >-
  An autosomal recessive primary mitochondrial disease caused by biallelic
  variants in PTPMT1, the inner-mitochondrial-membrane phosphatase that
  dephosphorylates phosphatidylglycerophosphate to phosphatidylglycerol in de
  novo cardiolipin biosynthesis. Six individuals from three consanguineous
  families have been reported, homozygous for either the missense variant
  p.Tyr22Ser or the exon 2 splice-region variant c.255G>C. Onset is neonatal
  or infantile, with developmental delay (sometimes with regression),
  microcephaly, cerebellar ataxia, nystagmus, spasticity, epilepsy,
  sensorineural hearing loss, optic atrophy, bulbar dysfunction and facial
  dysmorphism. MRI shows a variable combination of corpus callosum thinning,
  cerebellar atrophy and white matter changes. Patient fibroblasts have
  reduced PTPMT1 protein and fragmented mitochondria that are rescued by
  wild-type PTPMT1; patient muscle and blood have reduced cardiolipin, and a
  ptpmt1 knockout zebrafish has small body and head size, reduced cardiolipin
  and complex I and IV deficiency. Management is supportive.

pathophysiology:
- name: PTPMT1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both PTPMT1 alleles are disrupted. The c.255G>C variant at the last
    nucleotide of exon 2 activates aberrant splicing and nonsense-mediated
    decay, so little or no protein is made; the p.Tyr22Ser missense variant
    lies in the mitochondrial-targeting N-terminus and lowers steady-state
    protein, which the authors read as a hypomorphic allele. The molecular
    function bound here is PTPMT1's GO annotation (phosphatidylglycerophosphatase
    activity, IBA/ISS, also shown biochemically for the mouse enzyme); it was
    not measured for either patient allele.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: PTPMT1
    term:
      id: hgnc:26965
      label: PTPMT1
  molecular_functions:
  - preferred_term: phosphatidylglycerophosphatase activity
    modifier: DECREASED
    term:
      id: GO:0008962
      label: phosphatidylglycerophosphatase activity
  evidence:
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis revealed decreased steady-state levels of PTPMT1 in all three probands, compared to three healthy controls"
    explanation: Patient fibroblasts from both genotypes have reduced PTPMT1 protein.
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There was extensive loss of PTPMT1 transcripts in both cases (Fig. 5A), confirming that the c.255G>C variant is associated with multiple splicing events and activation of nonsense-mediated decay (NMD)."
    explanation: Patient-fibroblast RNA shows the splice-region variant causes aberrant splicing and transcript loss.
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose the tissue-specific cardiolipin effects of the two PTPMT1 variants reflect a hypomorphic allele in Subject S1 (missense variant) and a more deleterious loss-of-function variant in Subjects S2 and S5."
    explanation: The authors distinguish a hypomorphic missense allele from a more severe splice loss-of-function allele.
  - reference: PMID:21641550
    reference_title: "Mitochondrial phosphatase PTPMT1 is essential for cardiolipin biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further demonstrate that PTPMT1 specifically dephosphorylates PGP in vitro."
    explanation: Biochemical evidence that PTPMT1 is the phosphatidylglycerophosphate phosphatase.
  downstream:
  - target: Cardiolipin Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21641550
      reference_title: "Mitochondrial phosphatase PTPMT1 is essential for cardiolipin biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Lipid analysis of Ptpmt1-deficient fibroblasts reveals an accumulation of phosphatidylglycerophosphate (PGP) along with a concomitant decrease in phosphatidylglycerol."
      explanation: Loss of the phosphatase blocks conversion of its substrate to phosphatidylglycerol, the cardiolipin precursor.
    - reference: PMID:39279645
      reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These results support the pathogenic effects of the PTPMT1 variants and confirm that protein loss is associated with a significant reduction in total cardiolipin levels."
      explanation: In patient material, reduced PTPMT1 protein goes with reduced total cardiolipin.
- name: Cardiolipin Deficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced cardiolipin in the inner mitochondrial membrane. In patients,
    total cardiolipin was low in dried blood spots and the main 72:8
    species was reduced by about 70% in muscle; fibroblast cardiolipin was
    low in one individual. In Ptpmt1-deficient mouse fibroblasts the
    substrate phosphatidylglycerophosphate accumulates and phosphatidylglycerol
    falls.
  biological_processes:
  - preferred_term: cardiolipin biosynthetic process
    modifier: DECREASED

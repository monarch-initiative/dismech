- name: Neural Precursor Bioenergetic Stress and Cell Cycle Arrest
  biological_scale: CELLULAR
  description: >-
    In neural-specific Ptpmt1 knockout mice, neural precursor and stem cells
    become energy-stressed, activate AMPK and arrest the cell cycle; apoptosis
    increases in the knockout cerebellum. Shown only in mice.

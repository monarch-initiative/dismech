      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "The altered morphological features observed in the PTPMT1 patient fibroblasts are consistent with the regulatory role of cardiolipin in mitochondria morphology and dynamics."
      explanation: The authors attribute the fibroblast morphology defect to cardiolipin's role in mitochondrial dynamics; the link is inferred, not tested.
  - target: Impaired Oxidative Phosphorylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39279645
      reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these data suggest that loss of ptpmt1 decreases total cardiolipin content, disrupting mitochondrial respiratory chain assembly and activity, resulting in developmental and cellular maturation abnormalities in zebrafish at 19 dpf."
      explanation: In the knockout zebrafish, cardiolipin loss is linked to defective respiratory chain assembly and activity.
- name: Mitochondrial Fragmentation
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts carrying either variant have small, round, fragmented
    mitochondria with reduced length and area, a shift in the fission-fusion
    balance. Stable expression of wild-type PTPMT1 restores normal morphology.
  biological_processes:
  - preferred_term: mitochondrion organization
    modifier: ABNORMAL
    term:
      id: GO:0007005
      label: mitochondrion organization
  evidence:
  - reference: PMID:39279645

animal_models:
- name: ptpmt1 knockout zebrafish
  species: Zebrafish
  genotype: CRISPR/Cas9 4-bp deletion in ptpmt1 exon 3, homozygous (ptpmt1Δ4bp/Δ4bp)
  publication: PMID:39279645
  description: >-
    At 19 days post-fertilization the homozygous fish have reduced body
    length and head area, fail to inflate the anterior swim bladder, and have
    reduced cardiolipin 72:8 and fewer assembled complexes I and IV.
  modeled_mechanisms:
  - target: Cardiolipin Deficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: The knockout fish have reduced cardiolipin 72:8.
    limitations: >-
      Whole-larva lipidomics at one time point; tissue-specific cardiolipin,
      including brain, was not measured.
    evidence:
    - reference: PMID:39279645
      reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Notably, cardiolipin analysis by mass-spectrometry revealed that cardiolipin (72:8) levels, the most abundant cardiolipin species, were significantly diminished in the ptpmt1Δ4bp/4bp zebrafish at 19 dpf"
      explanation: Cardiolipin is reduced in the knockout fish.
  - target: Impaired Oxidative Phosphorylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Fewer assembled complexes I and IV and reduced complex IV activity.
    limitations: >-
      Measured in whole-larva extracts, so the affected tissues are not
      resolved; the zebrafish allele is a null, more severe than the human
      missense allele.
    evidence:
    - reference: PMID:39279645
      reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To investigate the effects of impaired cardiolipin content on the mitochondrial respiratory chain complex in ptpmt1 knockout zebrafish, blue-native gel electrophoresis was undertaken on protein extracted from 19 dpf ptpmt1Δ4bp/4bp fish, which confirmed a reduction in fully assembled Complex I (NADH dehydrogenase) and Complex IV (cytochrome c oxidase) in the ptpmt1Δ4bp/4bp fish, compared with controls"
      explanation: Respiratory chain assembly defect in the knockout fish.
- name: Nestin-Cre Ptpmt1 conditional knockout mouse
  species: Mouse
  genotype: Ptpmt1 floxed, Nestin-Cre (neural-specific deletion)
  publication: PMID:30338292
  description: >-
    Deletion of Ptpmt1 in neural precursors blocks postnatal cerebellar
    development and the mice are ataxic; Nestin-Cre knockouts die by
    postnatal day 12. Whole-body Ptpmt1 knockout is embryonic lethal.
  modeled_mechanisms:
  - target: Neural Precursor Bioenergetic Stress and Cell Cycle Arrest
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: Neural precursor bioenergetic stress and AMPK-driven cell cycle arrest.
    limitations: >-
      Complete tissue-specific deletion, more severe than the human alleles;
      the authors attribute the defect to limited pyruvate utilization rather
      than to cardiolipin, and the step has not been examined in human cells.
    evidence:
    - reference: PMID:30338292
      reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistically, loss of PTPMT1 decreased mitochondrial aerobic metabolism by limiting utilization of pyruvate, which resulted in bioenergetic stress in neural precursor/stem cells but not in progenitor or mature cells, leading to cell cycle arrest through activation of the AMPK-p19/p21 pathway."
      explanation: The model shows the precursor bioenergetic stress and cell cycle arrest.
  - target: Impaired Postnatal Cerebellar Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Cerebellar development fails completely in the knockout.
    limitations: >-
      The mouse phenotype is far more severe than the human disease (early
      postnatal death, total failure of cerebellar development), whereas
      patients survive with variable, sometimes progressive cerebellar
      atrophy.
    evidence:
    - reference: PMID:30338292
      reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report that knockout of PTPMT1, a mitochondrial phosphoinositide phosphatase, completely blocked postnatal cerebellar development."
      explanation: The model shows failed cerebellar development.
discussions:
- discussion_id: nedaxba_phenotype_mechanisms
  prompt: >-
    How does PTPMT1 deficiency produce the sensory and corticospinal features
    of NEDAXBA (hearing loss, optic atrophy, spasticity, epilepsy, white
    matter changes)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Sensorineural Hearing Impairment
  - phenotypes#Optic Atrophy
  - phenotypes#Spasticity
  - phenotypes#Seizure
  - phenotypes#Cerebral White Matter Abnormality
  - phenotypes#Cerebellar Atrophy
  rationale: >-
    The cited human data reach the cellular level only: reduced protein,
    reduced cardiolipin, fragmented mitochondria in fibroblasts and complex I
    deficiency in muscle. The cited neural mechanism comes from a
    neural-specific knockout mouse and concerns cerebellar development. None of
    the sources cited here examines the auditory, visual, corticospinal or
    white-matter pathology, so these phenotypes are not connected to a
    mechanism in this entry. Patients show progressive cerebellar atrophy,
    while the mouse shows failed cerebellar development; whether the human
    atrophy is degenerative or developmental has not been studied. The defining
    study proposes patient-derived neuronal models to address this.
  evidence:
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A quantitative loss of OXPHOS subunit expression, including NDUFB8 (Complex I), SDHB (Complex II) and COXII (Complex IV), was observed in the cultured fibroblasts of Subjects S1 and S2 during early passages (Supplementary Fig. 4C); however, this phenotype was not retained into later passage numbers, consistent with the reported limitations of using fibroblasts to investigate mitochondrial function"
    explanation: Fibroblasts lose the OXPHOS defect with passage, which limits them as a model of the neurological disease.
notes: >-
  Six individuals in three families (Iraqi Kurdish, Turkish and Iraqi; the
  Turkish and Iraqi families share the c.255G>C allele on a common
  haplotype) are published (PMID:39279645); one died at 16 years after a
  lower respiratory tract infection. Feature frequencies are not given because the cohort is six
  people. No cardiac disease was found in these individuals although
  cardiolipin is abundant in heart and cardiac Ptpmt1 knockout mice have
  cardiac defects. The entry does not conform to complex_i_deficiency,
  which is scoped to isolated complex I deficiency; here complex I and IV
  are both affected, secondary to a membrane-lipid defect. No GeneReviews
  chapter exists.

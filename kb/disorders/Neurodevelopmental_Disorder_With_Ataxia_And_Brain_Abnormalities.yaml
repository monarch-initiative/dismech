      label: cardiolipin biosynthetic process
  chemical_entities:
  - preferred_term: cardiolipin
    modifier: DECREASED
    term:
      id: CHEBI:28494
      label: cardiolipin
  - preferred_term: phosphatidylglycerophosphate
    modifier: INCREASED
    term:
      id: CHEBI:17264
      label: phosphatidylglycerol phosphate
  evidence:
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A reduction of approximately 70% in the 72:8 cardiolipin molecular species compared to healthy controls was observed in the skeletal muscle tissue of Subject S1"
    explanation: Reduced cardiolipin in patient muscle.
  - reference: PMID:21641550
    reference_title: "Mitochondrial phosphatase PTPMT1 is essential for cardiolipin biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of PTPMT1 leads to dramatic diminution of cardiolipin, which can be partially reversed by the expression of catalytic active PTPMT1."
    explanation: Cardiolipin depends on PTPMT1 catalytic activity in mouse fibroblasts.
  downstream:

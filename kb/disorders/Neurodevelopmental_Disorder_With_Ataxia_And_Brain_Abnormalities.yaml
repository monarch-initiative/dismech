- name: Impaired Oxidative Phosphorylation
  biological_scale: CELLULAR
  description: >-
    Respiratory chain deficiency affecting complexes I and IV. Patient muscle
    had about 50% of normal complex I activity, early-passage patient
    fibroblasts had reduced OXPHOS subunits (not retained at later passages),
    and the knockout zebrafish had fewer fully assembled complexes I and IV
    with complex IV activity reduced by 30%.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain enzyme analysis of muscle tissue showed a reduction (∼50%) in Complex I activity (0.053, reference range 0.104 ± 0.036)."
    explanation: Complex I deficiency in patient muscle.
  - reference: PMID:39279645
    reference_title: "Biallelic PTPMT1 variants disrupt cardiolipin metabolism and lead to a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spectrophotometric activity confirmed that Complex IV activity was reduced by 30% in the ptpmt1Δ4bp/4bp fish"

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, loss of PTPMT1 decreased mitochondrial aerobic metabolism by limiting utilization of pyruvate, which resulted in bioenergetic stress in neural precursor/stem cells but not in progenitor or mature cells, leading to cell cycle arrest through activation of the AMPK-p19/p21 pathway."
    explanation: Bioenergetic stress and cell cycle arrest in mouse neural precursors.
  downstream:
  - target: Impaired Postnatal Cerebellar Development
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30338292
      reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This study suggests that mitochondrial oxidation of the carbohydrate fuel is required for postnatal cerebellar development, and identifies a bioenergetic stress-induced cell cycle checkpoint in neural precursor/stem cells."
      explanation: The authors connect the precursor bioenergetic checkpoint to failed postnatal cerebellar development.
- name: Impaired Postnatal Cerebellar Development
  biological_scale: TISSUE
  description: >-
    Neural-specific Ptpmt1 knockout blocks postnatal cerebellar development,
    including generation of Bergmann glia, and the mice are ataxic. Shown only
    in mice; whether the cerebellar atrophy in patients arises the same way is
    not known.
  biological_processes:
  - preferred_term: cerebellum development
    modifier: DECREASED
    term:
      id: GO:0021549
      label: cerebellum development
  cell_types:
  - preferred_term: Bergmann glial cell
    term:
      id: CL:0000644
      label: Bergmann glial cell
  evidence:
  - reference: PMID:30338292
    reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that knockout of PTPMT1, a mitochondrial phosphoinositide phosphatase, completely blocked postnatal cerebellar development."
    explanation: Postnatal cerebellar development fails in the knockout mice.
  - reference: PMID:30338292
    reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, generation of functional Bergmann glia from multipotent precursor cells (radial glia), which is essential for cerebellar corticogenesis, was totally disrupted."
    explanation: Bergmann glia are not generated in the knockout cerebellum.
  downstream:
  - target: Cerebellar Ataxia
    causal_link_type: DIRECT
    description: >-
      Ataxia is not specific to failed development: in the same study, deleting
      PTPMT1 in adult mice also produced ataxia within days, with only mild
      cerebellar histological change. This edge is one route to ataxia, not the
      only one.
    evidence:
    - reference: PMID:30338292
      reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "However, these mice subsequently displayed growth retardation and ataxia and invariably died before postnatal day 12 (P12)"
      explanation: Mice lacking PTPMT1 in neural precursors from development onward become ataxic; this is model evidence for the human phenotype.
  - target: Cerebellar Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30338292
      reference_title: "Mitochondrial oxidation of the carbohydrate fuel is required for neural precursor/stem cell function and postnatal cerebellar development."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we report that knockout of PTPMT1, a mitochondrial phosphoinositide phosphatase, completely blocked postnatal cerebellar development."
      explanation: >-
        Failed cerebellar development in the knockout is the closest model
        counterpart of the small, atrophic cerebellum seen on patient MRI;
        developmental failure and atrophy are not the same process, so the
        edge is inferred.

    explanation: >-
      Justifies neuroimaging-based grading as the prognostically informative
      diagnostic step.
- name: Molecular genetic testing
  description: >-
    Genetic testing establishes the aetiology and the recurrence risk. Because
    a large majority of craniofacial midline defects remain molecularly
    unsolved after routine testing, exome/genome sequencing is increasingly
    applied.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: clinicaltrials:NCT04691414
    reference_title: "EXOMEDIANE - Retrospective Study Using High Throughput Sequencing (HTS) on Biological Samples to Improve Genetic Counseling for Patients With Previously Explored Craniofacial Midline Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the recent identification of about 20 genes, 70% of cases of EHPE
      and craniofacial midline abnormalities of genetic origin do not have a
      molecular diagnosis.
    explanation: >-
      Quantifies the diagnostic gap that motivates sequencing-based testing in
      holoprosencephaly.
  - reference: PMID:30508070
    reference_title: "Integrated clinical and omics approach to rare diseases: novel genes and oligogenic inheritance in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conventional molecular testing approaches result in a very low diagnostic
      yield and most cases remain unsolved.
    explanation: >-
      Independently documents the low yield of conventional testing that drives
      exome-based reanalysis.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy for the structural malformation;
    management is supportive and complication-directed, coordinated across
    neurology, neurosurgery, endocrinology, and gastroenterology, with
    surveillance for hydrocephalus, seizures, oromotor dysfunction, and
    endocrine failure.

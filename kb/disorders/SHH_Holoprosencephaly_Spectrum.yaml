inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission with markedly incomplete penetrance and
    variable expressivity; obligate carriers may be clinically normal or show
    only a microform.
  evidence:
  - reference: PMID:11471164
    reference_title: "SHH mutation is associated with solitary median maxillary central incisor: a study of 13 patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been reported in holoprosencephaly (HPE) cases with severe facial
      anomalies or as a microform in autosomal dominant HPE (ADHPE).
    explanation: >-
      Establishes autosomal dominant inheritance pattern for SHH-related HPE
      including microform presentations.
  - reference: PMID:25339593
    reference_title: "Holoprosencephaly: signaling interactions between the brain and the face, the environment and the genes, and the phenotypic variability in animal models and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of incomplete penetrance and variable expressivity of HPE,
      patients carrying defined mutations may not manifest the disease at all,
      or have a spectrum of defects.
    explanation: >-
      Documents the incomplete penetrance and variable expressivity that
      qualify the autosomal dominant inheritance pattern.
  - reference: PMID:21940735
    reference_title: "New findings for phenotype-genotype correlations in a large European series of holoprosencephaly cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SHH, SIX3, and TGIF mutations were inherited in more than 70% of
      these cases, whereas 70% of the mutations in ZIC2 occurred de novo.
    explanation: >-
      European series of 645 probands showing that SHH variants are usually
      inherited from a parent rather than de novo, which is why carrier-parent
      testing is essential.
- name: Oligogenic
  inheritance_term:
    preferred_term: Oligogenic inheritance
    term:
      id: HP:0010983
      label: Oligogenic inheritance
  description: >-
    Holoprosencephaly is the only multi-locus claim in this knowledge base
    tested against control populations. Rather than a single pedigree, exome
    reanalysis of unsolved families found oligogenic events in ten families and
    showed the incidence of oligogenic combinations to be significantly higher
    in patients than in two independent control populations. That case-control
    comparison is what separates this from the many reports where two variants
    were simply observed together. It sits alongside, not instead of, the
    autosomal dominant SHH block above: the classic architecture is a dominant
    driver variant with markedly incomplete penetrance, and the oligogenic
    model addresses the substantial fraction of families in which no single
    driver accounts for the phenotype. Loci reported as recurrently mutated
    across the oligogenic families: FAT1, NDST1, COL2A1 and SCUBE2. The study's
    variants of clinical interest overall fell in 180 genes associated with
    forebrain-development pathways including SHH signalling and primary cilia;
    that pathway statement is about the whole variant set, not specifically
    about the four recurrent oligogenic genes, and is not asserted of them
    here.
  evidence:
  - reference: PMID:30508070
    reference_title: "Integrated clinical and omics approach to rare diseases: novel genes and oligogenic inheritance in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oligogenic events were observed in 10 families and involved both known and
      novel holoprosencephaly genes including recurrently mutated FAT1, NDST1,
      COL2A1 and SCUBE2.
    explanation: >-
      Reports oligogenic genotypes across ten families and names the recurrent
      contributing loci.
  - reference: PMID:30508070
    reference_title: "Integrated clinical and omics approach to rare diseases: novel genes and oligogenic inheritance in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of oligogenic combinations was significantly higher in
      holoprosencephaly patients compared to two control populations (P < 10-9).
    explanation: >-
      The case-control statistic. This is the claim that survives the objection
      that co-occurring variants are expected by chance in any exome.

genetic:
- name: SHH loss-of-function variants
  gene_term:
    preferred_term: SHH
    term:
      id: hgnc:10848
      label: SHH
  association: Causative
  features: >-
    Heterozygous loss-of-function and missense variants in SHH. Functional
    studies in zebrafish classify 104 clinically reported SHH variants into
    loss of function (31), hypomorphic (33), and nonpathogenic (40) categories.
    Incomplete penetrance and variable expressivity are hallmarks, consistent
    with oligogenic and environmental modifier effects. In the largest
    SHH-genotyped series (396 individuals, 157 kindreds), SHH variants more
    often produced a non-HPE (microform) presentation than frank HPE, and
    truncating variants were more likely than non-truncating variants to
    produce frank HPE - so SHH sits at the milder end of the HPE gene spectrum
    even though individual-level prediction remains unreliable.
  evidence:
  - reference: PMID:32939873
    reference_title: "Functional analysis of Sonic Hedgehog variants associated with holoprosencephaly in humans using a CRISPR/Cas9 zebrafish model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Genetic variation in the highly conserved Sonic Hedgehog (SHH) gene is
      one of the most common genetic causes for the malformations of the brain
      and face in humans described as the holoprosencephaly clinical spectrum.
    explanation: >-
      Zebrafish functional analysis of 104 SHH variants establishes
      loss-of-function as the disease mechanism for HPE spectrum.
  - reference: PMID:34576017
    reference_title: "The Role of Sonic Hedgehog in Human Holoprosencephaly and Short-Rib Polydactyly Syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SHH mutations were the first identified genetic causes of
      holoprosencephaly, but many other genes and environmental factors can
      cause malformations in the holoprosencephaly spectrum.
    explanation: >-
      Establishes SHH as the first known genetic cause of HPE and notes the
      wide variability in phenotype even with the same mutation.
  - reference: PMID:22791840
    reference_title: "Genotypic and phenotypic analysis of 396 individuals with mutations in Sonic Hedgehog."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SHH mutations more commonly resulted in non-HPE (64%) than frank HPE
      (36%), and non-HPE was significantly more common in patients with SHH
      than in those with mutations in the other common HPE related genes
      (p<0.0001 compared to ZIC2 or SIX3).
    explanation: >-
      SHH-genotyped cohort of 396 individuals establishing that SHH variants
      most often produce a microform rather than frank HPE, positioning SHH at
      the milder end of the HPE gene spectrum.
  - reference: PMID:22791840
    reference_title: "Genotypic and phenotypic analysis of 396 individuals with mutations in Sonic Hedgehog."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with truncating mutations were significantly more likely to
      have frank HPE than those with non-truncating mutations (49% vs 35%,
      respectively; p=0.012).
    explanation: >-
      Quantifies the truncating vs non-truncating genotype-severity gradient
      within SHH.
  - reference: PMID:22791840
    reference_title: "Genotypic and phenotypic analysis of 396 individuals with mutations in Sonic Hedgehog."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HPE is more frequent in individuals with truncating mutations, but
      clinical predictions at the individual level remain elusive.
    explanation: >-
      Records the explicit limit on individual-level genotype-phenotype
      prediction that qualifies the severity gradient above.
- name: GAS1 modifier interaction
  gene_term:
    preferred_term: GAS1
    term:
      id: hgnc:4165
      label: GAS1
  association: Modifier
  relationship_type: MODIFIER
  features: >-
    GAS1 encodes a membrane glycoprotein co-receptor that potentiates hedgehog
    signalling in the early face. Mouse genetics show a direct Shh-Gas1 genetic
    interaction, providing a mechanistic model for the second-site modifier
    effects invoked to explain the incomplete penetrance and variable
    expressivity of human SHH holoprosencephaly.
  evidence:
  - reference: PMID:17525797
    reference_title: "Gas1 is a modifier for holoprosencephaly and genetically interacts with sonic hedgehog."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of a single Shh allele in a Gas1(-/-) background significantly
      exacerbated the midline craniofacial phenotype, providing genetic
      evidence that Shh and Gas1 interact.
    explanation: >-
      Direct mouse genetic evidence that Gas1 dosage modifies the severity of
      Shh-dependent midline craniofacial malformation.
- name: Oligogenic background variation
  association: Contributory
  relationship_type: COOPERATING
  features: >-
    A substantial fraction of holoprosencephaly remains unexplained by a single
    driver variant. Exome reanalysis of unsolved families under an oligogenic
    model implicates combined inherited variants across SHH-pathway and primary
    cilium genes.
  evidence:
  - reference: PMID:30508070
    reference_title: "Integrated clinical and omics approach to rare diseases: novel genes and oligogenic inheritance in holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants of clinical interest were identified in 180 genes significantly
      associated with key pathways of forebrain development including sonic
      hedgehog (SHH) and primary cilia.
    explanation: >-
      Supports an oligogenic contribution converging on the SHH pathway in
      genetically unsolved holoprosencephaly families.
has_subtypes:
- name: Alobar HPE
  display_name: Alobar Holoprosencephaly
  description: >-
    Most severe form with complete failure of forebrain division, single
    ventricle, fused thalami, and severe midline facial defects including
    cyclopia or proboscis.
  evidence:
  - reference: PMID:20104615
    reference_title: "Management of children with holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it has been categorized into four types from most severe to least severe:
      alobar, semilobar, lobar, and middle interhemispheric (MIH) variant.
    explanation: >-
      Establishes alobar HPE as the most severe category of the classification.
- name: Semilobar HPE
  display_name: Semilobar Holoprosencephaly
  description: >-
    Partial hemispheric separation posteriorly with fused frontal lobes
    and variable facial dysmorphism.
  evidence:
  - reference: PMID:37189898
    reference_title: "Holoprosencephaly: Review of Embryology, Clinical Phenotypes, Etiology and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three classic subtypes of HPE are alobar, semilobar and lobar
    explanation: >-
      Establishes semilobar HPE as one of the three classic radiologic
      subtypes.
- name: Lobar HPE
  display_name: Lobar Holoprosencephaly
  description: >-
    Mildest intracranial form with near-complete hemispheric separation
    but residual midline fusion, often with milder craniofacial features.
  evidence:
  - reference: PMID:37189898
    reference_title: "Holoprosencephaly: Review of Embryology, Clinical Phenotypes, Etiology and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The three classic subtypes of HPE are alobar, semilobar and lobar
    explanation: >-
      Establishes lobar HPE as one of the three classic radiologic subtypes.
- name: Microform HPE
  display_name: Microform Holoprosencephaly (SMMCI, microphthalmia)
  description: >-
    Subclinical midline defects without overt holoprosencephaly. Includes
    solitary median maxillary central incisor (SMMCI), microphthalmia with
    coloboma, hypotelorism, and single central incisor as isolated findings.
    Often identified in mutation-positive relatives of HPE probands.
  evidence:
  - reference: PMID:11471164
    reference_title: "SHH mutation is associated with solitary median maxillary central incisor: a study of 13 patients and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been reported in holoprosencephaly (HPE) cases with severe facial
      anomalies or as a microform in autosomal dominant HPE (ADHPE).
    explanation: >-
      Establishes SMMCI and related findings as recognized HPE microforms in
      autosomal dominant HPE families.
  - reference: PMID:23112757
    reference_title: "High Intellectual Function in Individuals with Mutation-Positive Microform Holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present 5 patients with clear phenotypic signs of microform
      holoprosencephaly, all of whom have evidence of above-average
      intellectual function.
    explanation: >-
      Establishes that mutation-positive microform HPE is compatible with
      above-average intellect, so cognitive status cannot be used to identify
      carriers.

    best-established non-genetic risk factor for holoprosencephaly. The
    proposed mechanism is hyperglycaemia-driven oxidative stress in the
    neuroectoderm, particularly cranial neural crest cells, converging on the
    same midline developmental field that SHH dosage controls.

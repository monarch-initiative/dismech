      says outright that what drives manifestation in genetically at-risk
      individuals is currently unknown, which is why this is partial rather than
      supporting.
  downstream:
  - target: Reduced SHH Signaling in Forebrain Patterning
    description: >-
      Second-site modifiers act on the same hedgehog-dependent midline
      program as the primary SHH variant, shifting how far pathway output
      falls below the threshold required for midline patterning and thus
      where an individual lands on the microform-to-alobar spectrum.
    evidence:
    - reference: PMID:17525797
      reference_title: "Gas1 is a modifier for holoprosencephaly and genetically interacts with sonic hedgehog."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of a single Shh allele in a Gas1(-/-) background significantly

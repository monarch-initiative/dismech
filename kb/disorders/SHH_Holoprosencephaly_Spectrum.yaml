- name: Cumulative gene-environment insult
  influences_mechanisms:
  - target: Modifier-Dependent Variable Expressivity
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as modulating rather than predisposing, and pointed at the
      variable-expressivity node rather than at a developmental step, because
      that is exactly what this exposure claims to do: it is not an insult in
      its own right but the proposition that a partially penetrant genetic
      lesion can be pushed past a threshold by an independent one. The cited
      sentence is candid that this is speculation and that what drives
      manifestation in genetically at-risk individuals remains unknown, which
      is why the grade is as low as it is.
    evidence:

progression:
- phase: Embryonic origin
  age_range: Gestational weeks 3-4
  notes: >-
    The causal event is failure of midline differentiation and cleavage of the
    prosencephalon during the third and fourth weeks of gestation. The
    structural malformation is therefore a fixed developmental field defect
    rather than a progressive process.
  evidence:
  - reference: PMID:39726469
    reference_title: "Alobar Holoprosencephaly in a Newborn: A Case Report of Prenatal Diagnosis and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Holoprosencephaly (HPE) is defined as a set of structural brain
      abnormalities resulting from a midline differentiation and cleavage
      defect in the prosencephalon during the third and fourth weeks of
      gestation.
    explanation: >-
      Fixes the embryologic timing of the causal developmental event.
- phase: Neonatal period
  age_range: Birth to 1 month
  notes: >-
    Mortality is concentrated in the first month of life and is heavily
    weighted toward alobar disease; milder subtypes largely survive infancy.
  evidence:
  - reference: PMID:39726469
    reference_title: "Alobar Holoprosencephaly in a Newborn: A Case Report of Prenatal Diagnosis and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 33% of affected newborns die within the first 24 hours,
      and 58% die within the first month.
    explanation: >-
      Quantifies early neonatal mortality in the severe (alobar) form.
  - reference: PMID:20104615
    reference_title: "Management of children with holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With the most severely affected newborns, there is a high mortality rate
      in the first month of life, however, with milder forms of HPE, the
      majority survive beyond infancy.
    explanation: >-
      Establishes the subtype dependence of neonatal mortality.
- phase: Infancy and childhood
  age_range: 1 month onward
  notes: >-
    Around 29% of severely affected infants survive to one year. Survivors
    accrue complications requiring longitudinal multidisciplinary care
    (hydrocephalus, seizures, oromotor dysfunction, endocrine dysfunction)
    rather than progression of the structural malformation itself.
  evidence:
  - reference: PMID:39726469
    reference_title: "Alobar Holoprosencephaly in a Newborn: A Case Report of Prenatal Diagnosis and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, around 29% survive to the first year
    explanation: >-
      Quantifies one-year survival in severe holoprosencephaly.
  - reference: PMID:20104615
    reference_title: "Management of children with holoprosencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common medical problems include hydrocephalus, seizures, motor
      impairment, oromotor dysfunction with risk of poor nutrition and
      aspiration, chronic lung disease, gastroesophageal reflux, constipation,
      hypothalamic dysfunction with disturbed sleep-wake cycles and temperature
      dysregulation, as well as endocrine dysfunction.
    explanation: >-
      Enumerates the complication burden that accrues in surviving children.
diagnosis:
- name: Prenatal ultrasonography
  description: >-
    Fetal ultrasound is the principal population-level detection route for
    structural holoprosencephaly; severe forms may be identified in the first
    or second trimester, while microforms are frequently missed.
  diagnosis_term:
    preferred_term: fetal ultrasonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:25339593
    reference_title: "Holoprosencephaly: signaling interactions between the brain and the face, the environment and the genes, and the phenotypic variability in animal models and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HPE can be diagnosed in utero by a high-resolution prenatal ultrasound
      or a fetal magnetic resonance imaging, sometimes in combination with
      molecular testing from chorionic villi or amniotic fluid sampling.
    explanation: >-
      Establishes prenatal ultrasound as a primary in utero diagnostic
      modality for HPE.
  - reference: PMID:39726469
    reference_title: "Alobar Holoprosencephaly in a Newborn: A Case Report of Prenatal Diagnosis and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis, especially through fetal
      ultrasound, is crucial to optimize management and inform families regarding prognosis.
    explanation: >-
      Supports fetal ultrasound as the key early-detection modality guiding
      management and counselling.
- name: Brain magnetic resonance imaging
  description: >-
    MRI (fetal as a second-line prenatal study, and postnatally) resolves the
    degree of hemispheric non-separation and defines the HPE subtype, which is
    the dominant prognostic determinant.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:39726469
    reference_title: "Alobar Holoprosencephaly in a Newborn: A Case Report of Prenatal Diagnosis and a Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HPE is diagnosed prenatally through ultrasound and
      brain magnetic resonance imaging (MRI).
    explanation: >-
      Establishes MRI alongside ultrasound as a core diagnostic modality.
  - reference: PMID:12370462
    reference_title: "Neuroanatomy of holoprosencephaly as predictor of function: beyond the face predicting the brain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In general, the severity of clinical problems and neurologic
      dysfunctions correlated with the degree of hemispheric nonseparation

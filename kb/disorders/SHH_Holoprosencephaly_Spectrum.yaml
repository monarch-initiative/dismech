      require molecular rather than clinical assessment.
clinical_trials:
- name: NCT00645645
  status: COMPLETED
  description: >-
    NIH/NHGRI long-running observational cohort studying the complex genetics
    of brain development with an emphasis on holoprosencephaly, including
    mutational analysis of SHH and other hedgehog-pathway genes.
  evidence:
  - reference: clinicaltrials:NCT00645645
    reference_title: "Genetic Analysis of Brain Disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in one such gene, Sonic Hedgehog, have been shown by us to be
      responsible for approximately one quarter of familial cases of HPE.
    explanation: >-
      The registry summary quantifies the SHH contribution to familial
      holoprosencephaly that motivates the cohort.
- name: NCT04691414
  status: COMPLETED
  description: >-
    EXOMEDIANE (Rennes University Hospital) - retrospective high-throughput
    sequencing on biobanked samples from patients with previously explored
    craniofacial midline defects, aiming to identify new candidate genes and
    improve genetic counseling.
  evidence:
  - reference: clinicaltrials:NCT04691414
    reference_title: "EXOMEDIANE - Retrospective Study Using High Throughput Sequencing (HTS) on Biological Samples to Improve Genetic Counseling for Patients With Previously Explored Craniofacial Midline Defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Holoprosencephaly, or HPE, is the most common congenital cerebral
      malformation in humans and the most severe of a group of pathologies
      related to a deficiency of the SHH signalling pathway (Sonic Hedgehog
      SHH-D).
    explanation: >-
      Establishes the SHH-deficiency framing of the trial's target population,
      matching this entry's scope.
notes: >-
  This entry absorbs three MONDO entities: holoprosencephaly 3 (MONDO:0007733),
  microphthalmia isolated with coloboma 5 (MONDO:0012709), and solitary median
  maxillary central incisor syndrome (MONDO:0007819), reflecting the clinical
  understanding that these are part of a single SHH loss-of-function phenotypic
  continuum.

  Scope caveat on epidemiology and cohort-derived frequencies: the prevalence
  records, the survival statistics, and the complication frequencies (diabetes
  insipidus, hypothyroidism, hypocorticism, growth hormone deficiency,
  hydrocephalus, seizures) are drawn from all-cause holoprosencephaly cohorts,
  not from SHH-genotyped cohorts. SHH is the most commonly identified
  single-gene cause of nonsyndromic HPE, so these figures are the best available
  proxy but should not be read as SHH-specific rates. The genuinely
  SHH-genotyped figures in this entry are confined to the genetic and
  inheritance sections (PMID:22791840, 396 individuals across 157 SHH kindreds;
  PMID:21940735, European series). Those data indicate SHH sits at the milder
  end of the HPE gene spectrum - most SHH variant carriers have a microform
  rather than frank HPE - so the all-cause cohort frequencies above, which are
  weighted toward classic structural HPE, likely OVERSTATE the burden for an
  unselected SHH variant carrier.

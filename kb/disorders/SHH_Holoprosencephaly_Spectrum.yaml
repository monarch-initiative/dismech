environmental:
- name: Maternal pregestational diabetes mellitus
  influences_mechanisms:
  - target: Impaired Forebrain Midline Separation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The best-established non-genetic risk factor for this malformation, and
      one of the few exposures in this backfill whose intervening step is
      named by its own evidence rather than only by the entry's prose:
      periconceptional hyperglycaemia is proposed to act through oxidative
      stress in the neuroectoderm and cranial neural crest, converging on the
      midline field this node holds. That is why the intermediates are
      recorded as known.
    evidence:
    - reference: PMID:38088397
      reference_title: "The rare malformation holoprosencephaly: pathogenesis, association with pregestational diabetes and the possible link with food pollutants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pregestational diabetes, with periconceptional hyperglycaemia, is the main non-genetic risk factor; increased oxidative stress in neuroectoderm, in particular neural crest cells, appears as the main mechanism."
      explanation: >-
        Names pregestational diabetes with periconceptional hyperglycaemia as
        the main non-genetic risk factor and identifies oxidative stress in
        neuroectoderm, particularly neural crest cells, as the main mechanism.
        Exposure and route in one sentence.
    - reference: PMID:29761639
      reference_title: "Nongenetic risk factors for holoprosencephaly: An updated review of the epidemiologic literature."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "including maternal diabetes, twinning, and a predominance of females"
      explanation: >-
        Systematic epidemiologic review listing maternal diabetes among the
        factors consistently over-represented among cases.
        Over-representation, without a route.
  description: >-

    reference_title: "Holoprosencephaly: signaling interactions between the brain and the face, the environment and the genes, and the phenotypic variability in animal models and humans."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is currently unknown what drives manifestation of HPE in genetically

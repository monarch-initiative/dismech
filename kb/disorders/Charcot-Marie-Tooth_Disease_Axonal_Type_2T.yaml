    explanation: >-
      The antecedent is 12 samples from individuals with truncating or other serious heterozygous
      MME variants after outlier exclusion; the median was 0 ng/mL. Approximately 20% of comparison
      samples were below threshold. This measures circulating protein abundance, not nerve
      enzyme activity.

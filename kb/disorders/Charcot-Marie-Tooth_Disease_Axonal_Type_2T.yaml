notes: >-
  This entry concerns MME-related CMT2T (MONDO:0044640; OMIM:617017). The obsolete MONDO:0014866
  conflated MME with DNAJB2-associated disease under the historical CMT2T label; source identity
  must be checked by gene. The original recessive entity and selected incompletely penetrant
  heterozygous neuropathy associations are both discussed, with variant-specific limitations.
  The pathograph preserves a qualified Schwann cell–axon hypothesis, established axonal/motor-unit
  clinical substrates and observational test readouts; it does not assert a pathogenic peptide
  merely from substrate lists. Offspring alloimmune nephropathy remains separate from the
  mother’s neurological disease. The Japanese negative cognitive/PET observations are person-
  and cohort-scoped, and late-life dementia is retained with unresolved attribution.

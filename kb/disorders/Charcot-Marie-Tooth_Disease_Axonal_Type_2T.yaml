name: Charcot-Marie-Tooth disease, axonal, type 2T
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Charcot-Marie-Tooth disease type 2T (CMT2T) is a late-onset axonal
  sensorimotor polyneuropathy caused by loss-of-function variants in MME, which
  encodes the zinc metalloprotease neprilysin. It is unusual among the CMT
  subtypes in three ways. It presents in the fifth to sixth decade rather than
  in childhood, so it sits at the boundary between inherited neuropathy and the
  large population of unexplained axonal neuropathies of the elderly - MME is
  the most frequently implicated gene in that population, accounting for about a
  third of genetically solved late-onset cases in one series. Its mode of
  inheritance is genuinely unsettled: the entity was defined as recessive, but
  heterozygous variants segregate with late-onset neuropathy in an
  age-dependent, incompletely penetrant dominant pattern, and both accounts are
  supported by substantial independent cohorts. And the mechanism connecting
  neprilysin loss to axonal degeneration is unknown - the enzyme has many
  substrates, none has been shown to be the relevant one, and the mouse knockout
  is close to normal. A separate consequence of the same genotype is
  reproductive rather than neurological: neprilysin-null women alloimmunise
  against the antigen during pregnancy and their children can be born with
  antenatal membranous nephropathy.
category: Mendelian
parents:
- hereditary disease
synonyms:
- CMT2T
- AR-CMT2T
- Charcot-Marie-Tooth disease axonal type 2T
- MME-related Charcot-Marie-Tooth disease
- neprilysin deficiency neuropathy

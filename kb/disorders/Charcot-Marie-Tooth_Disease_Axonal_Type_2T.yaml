genetic:
- name: MME
  gene_term:
    preferred_term: MME
    term:
      id: hgnc:7154
      label: MME
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    MME encodes neprilysin, a membrane metallopeptidase with extracellular catalytic activity
    and multiple peptide substrates. Biallelic loss-of-function alleles establish recessive
    CMT2T; selected heterozygous variants confer incompletely penetrant neuropathy risk. RNA
    splicing and catalytic effects have been measured for particular alleles, while many truncation/NMD
    or structural effects remain predicted. Biallelic MME disease also includes a motor-predominant/dHMN
    spectrum, so sensory involvement is not obligatory. The 2024 Italian classifications describe
    8 patients with pathogenic, 13 with likely pathogenic, 10 with uncertain and one with
    likely benign variants; these are patient counts, not 32 distinct variants. Diagnostic
    yield estimates derive from selected cohorts and do not establish an MME-first testing
    algorithm.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME was most frequently involved and accounted for 34.8% of genetically
      solved cases.
    explanation: >-
      MME accounted for 8/23 solved cases among 126 WES-tested probands; the 34.8% figure
      does not use all 230 recruited patients as its denominator.
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary
      motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the patients showed late-onset phenotype of distal
      motor neuropathy without sensory involvement.
    explanation: >-
      The study establishes an allelic motor-predominant phenotype. Full case descriptions
      include one juvenile-onset patient, so the abstract wording does not establish universally
      late onset.
  - reference: PMID:31339187
    reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve
      injury."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Membrane metallo‐endopeptidase (MME) gene encodes a zinc‐dependent
      metalloprotease, a Type II transmembrane glycoprotein of 100 kDa with the
      catalytic site localized in the extracellular domain.
    explanation: >-
      Background description of neprilysin topology and catalytic orientation, not a result
      of the mouse repair experiment.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two additional families from Italy and Germany were subsequently reported
      with the same homozygous truncating mutation c.466delC (p.Pro156Leufs∗14).
    explanation: >-
      Establishes c.466delC as a recurrent allele across multiple unrelated
      European families.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the
      importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To classify their variants, the ACMG guidelines were followed, defining them
      as Pathogenic (P) in 8 patients, likely pathogenic (LP) in 13, a variant of
      unknown significance in 10 and likely benign (LB) in the remaining one
    explanation: >-
      These ACMG classes apply to patients in the 32-person cohort. Uncertain and likely benign
      findings limit disease-specific frequency and genotype-effect inferences.
prevalence:
- population: Patients with unexplained axonal neuropathy and onset at or after 35 years
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Population prevalence is not established. In the 2020 selected late-onset neuropathy study,
    23/126 WES-tested probands were genetically solved and 8/23 (34.8%) of the solved cases
    involved MME, equivalent to 8/126 (6.35%) of that WES cohort. The remaining 104 patients
    underwent targeted sequencing and are a separate ascertainment arm. These are diagnostic
    yields, not population prevalence.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the WES cohort, the overall detection rate for assumed disease-causing
      variants in genes for CMT or other conditions associated with neuropathies
      was 18.3% (familial cases 26.4%, apparently sporadic cases 12.3%).
    explanation: >-
      The 18.3% yield is 23/126 in the WES arm, not 23/230 across both sequencing arms.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME was most frequently involved and accounted for 34.8% of genetically
      solved cases.
    explanation: >-
      The MME share is 8/23 solved WES cases, giving 8/126 of the selected WES cohort. It
      is not a population frequency.
animal_models:
- name: Mme knockout mouse
  species: Mouse
  genotype: Mme-/- (MME knockout)
  publication: PMID:31339187
  description: >-
    Mme knockout mice provide a limited model of human CMT2T. Aged animals in the 2016 study
    showed mild myelin and Remak-bundle abnormalities without overt motor or conduction deficits.
    In the 2019 young-adult sciatic-crush study, axon regeneration, remyelination and motor
    recovery were comparable to wild type. Earlier pinprick responsiveness after injury did
    not demonstrate increased intraepidermal fiber regeneration.
  modeled_mechanisms:
  - target: Length-Dependent Axonal Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Young knockout mice lack a human-like axonal neuropathy; aged mice had mild myelin and
      Remak-ensheathment abnormalities without overt motor or conduction deficits.
    limitations: >-
      The young mouse injury paradigm does not reproduce the decades-long, variable human
      disease. Its negative regeneration/remyelination findings constrain that particular
      repair hypothesis; they neither exclude all glial support mechanisms in humans nor preclude
      use of the model for suitably limited mechanistic experiments.
    evidence:
    - reference: PMID:31339187
      reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve
        injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Peripheral nerve morphometry in mice lacking MME previously showed minor
        abnormalities in aged animals in comparison to CMT2 patients.
      explanation: >-
        The measured lack of a human-like deficit supports this FAILS_TO_RECAPITULATE model
        link, rather than refuting the human lesion.
  - target: Proposed Disruption of Schwann Cell–Axon Signaling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Young knockout mice show normal regeneration and remyelination after sciatic crush,
      constraining this repair-related component of the broader proposed glial-support mechanism.
    limitations: >-
      The young mouse injury paradigm does not reproduce the decades-long, variable human
      disease. Its negative regeneration/remyelination findings constrain that particular
      repair hypothesis; they neither exclude all glial support mechanisms in humans nor preclude
      use of the model for suitably limited mechanistic experiments.
    readouts:
    - name: Axon regeneration and remyelination after nerve injury
      target: Proposed Disruption of Schwann Cell–Axon Signaling
      direction: UNCHANGED
      interpretation: >-
        No difference from wild type, which is a real negative result rather than
        a missing measurement.
      evidence:
      - reference: PMID:31339187
        reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve
          injury."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          After nerve injury the morphological outcome in MME KO mice was
          indistinguishable from WT littermates in terms of axon regeneration and
          remyelination.
        explanation: >-
          The experiment found comparable regeneration and remyelination between young knockout
          and wild-type mice after sciatic nerve crush; this supports the unchanged readout.
    evidence:
    - reference: PMID:31339187
      reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve
        injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, although MME expression is dysregulated after nerve injury
        in a NRG1-dependent manner this gene is dispensable for axon regeneration
        and remyelination after injury.
      explanation: >-
        The measured lack of a human-like deficit supports this FAILS_TO_RECAPITULATE model
        link, rather than refuting the human lesion.
treatments:
- name: Orthotic Supportive Care
  therapeutic_modality: DEVICE
  description: >-
    Foot orthoses and walking aids provide symptomatic support. Moroccan patient II:4 had
    improvement in walking impairment, foot drop and falls after a foot orthosis. This is
    a case observation, not evidence of disease modification or a controlled efficacy estimate.
    General CMT management also recommends ankle/foot orthoses to compensate for foot drop
    and assist walking.
  treatment_term:
    preferred_term: orthotic supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      walking impairment, foot drops, and frequent falls. This was improved by
      foot orthosis.
    explanation: >-
      A direct before-and-after observation in a genotyped CMT2T patient, which
      is stronger than an extrapolation from CMT management in general.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Balance impairment, walking limitations, use of plantar orthesis
    explanation: >-
      The table documents orthosis use in selected patients, without independently measuring
      benefit in each user.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Affected individuals often require ankle/foot orthoses (AFOs) to correct foot drop and
      aid walking.
    explanation: >-
      This is general CMT management advice, paired with the separate observed orthotic response
      in the MME patient; it is not an MME-specific trial.
  target_mechanisms:
  - target: Foot Drop
    treatment_effect: BYPASSES
    description: >-
      Orthotic assistance compensates mechanically for impaired dorsiflexion; it does not
      restore neprilysin or prevent axonal degeneration.
    evidence:
    - reference: PMID:34307994
      reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
        With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
        and Pharmacovigilance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        walking impairment, foot drops, and frequent falls. This was improved by
        foot orthosis.
      explanation: >-
        The observed improvement followed orthotic assistance in Moroccan patient II:4.
- name: Intravenous Immunoglobulin for Superimposed Inflammatory Neuropathy
  therapeutic_modality: OTHER
  description: >-
    A homozygous MME patient with a suspected superimposed inflammatory demyelinating component
    improved clinically and electrophysiologically after intravenous immunoglobulin. This
    case does not establish immunoglobulin as a treatment for the underlying genetic axonal
    neuropathy. Other CMT2T patients initially labeled CIDP did not improve with immunomodulation.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  evidence:
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation
      superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoglobulin treatment was initiated considering the possibility of
      superimposed inflammation and demyelination, and immediate clinical as well
      as electrophysiological improvements were noted.
    explanation: >-
      Documents the response to immunoglobulin in the one reported patient with a
      superimposed inflammatory neuropathy.
  target_mechanisms:
  - target: Predisposition to Superimposed Inflammatory Demyelinating Neuropathy
    treatment_effect: INHIBITS
    description: >-
      Immunoglobulin addresses the inflammatory arm, not the underlying
      neprilysin deficiency. Nothing in this entry should be read as suggesting it
      modifies the genetic disease.
    evidence:
    - reference: PMID:28855494
      reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene
        mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunoglobulin treatment was initiated considering the possibility of
        superimposed inflammation and demyelination, and immediate clinical as well
        as electrophysiological improvements were noted.
      explanation: >-
        Links the intervention to the inflammatory node it targets.
- name: Prevention of Additional Neuropathy and Mobility Burden
  therapeutic_modality: OTHER
  description: >-
    General CMT care advises attention to medications with peripheral neurotoxicity, particularly
    vincristine, and avoidance of obesity that can worsen walking difficulty. These are general
    precautions, not observed MME-specific drug adverse events. The separate neprilysin-inhibitor
    pharmacovigilance discussion remains an unproven drug-risk hypothesis.
  treatment_term:
    preferred_term: Prevention of additional neuropathy and mobility burden
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Chemotherapy for cancer that includes vincristine may be especially damaging to peripheral
      nerves and severely worsen CMT
    explanation: >-
      GeneReviews highlights vincristine neurotoxicity as a general CMT precaution. No MME-specific
      exposure-response observation is claimed.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Obesity is to be avoided because it makes walking more difficult.
    explanation: >-
      General expert management advice to reduce additional walking burden, not an MME-specific
      intervention trial.
- name: Individualized Physical and Occupational Rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: General CMT management recommends multidisciplinary rehabilitation with physical
    and occupational therapy, daily heel-cord stretching to prevent Achilles tendon shortening,
    gripping exercises for hand weakness, and physical activity within individual capability.
    These are symptomatic care recommendations extrapolated to MME neuropathy; an MME-specific
    exercise response or disease-modifying effect is not established.
  treatment_term:
    preferred_term: Individualized physical and occupational rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Treatment is symptomatic. Affected individuals are often evaluated and managed
      by a multidisciplinary team that includes neurologists, physiatrists, orthopedic surgeons,
      and physical and occupational therapists
    explanation: GeneReviews describes multidisciplinary symptomatic care for CMT generally,
      not an MME-specific rehabilitation study.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Daily heel cord stretching exercises to prevent Achilles tendon shortening are
      desirable, as well as gripping exercises for hand weakness
    explanation: General CMT exercise advice supports preventive stretching and hand exercises;
      it does not establish Achilles contractures in MME patients.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Exercise is encouraged within the individual's capability and many individuals
      remain physically active
    explanation: General CMT guidance supports individually tolerable activity without a prescribed
      MME-specific training dose or demonstrated effect on axonal degeneration.
- name: Individualized Orthopedic Correction of Foot Deformity
  therapeutic_modality: SURGERY
  description: General CMT guidance supports orthopedic assessment and possible correction of
    severe pes cavus, with multidisciplinary input from neurology, physical therapy and orthopedics.
    Surgical planning must account for the individual pattern of weakness and flexible versus
    fixed deformity. Outcomes can deteriorate as motor function changes. This is CMT-wide guidance
    applicable to an affected MME patient with a suitable deformity, not evidence that all CMT2T
    patients require surgery or that correction treats neprilysin deficiency.
  treatment_term:
    preferred_term: Individualized orthopedic correction of severe pes cavus
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_phenotypes:
  - preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Orthopedic surgery may be required to correct severe <i>pes cavus</i> foot deformity
    explanation: GeneReviews recommends selective surgical correction in CMT generally; the
      indication is severe deformity rather than the MME genotype itself.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Management regarding surgery referral and intervention ideally involves multidisciplinary
      input (i.e., neurology, physical therapy, and orthopedics).
    explanation: Expert guidance supports multidisciplinary assessment rather than a uniform
      surgical protocol for MME neuropathy.
  - reference: PMID:11232233
    reference_title: The pathogenesis and surgical management of foot deformity in Charcot-Marie-Tooth
      disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: It is vital for the patient and physician to remember that CMT is an inexorably
      progressive disease, and an initially good result can deteriorate with changing motor
      function. With meticulous attention to the neurologic examination and the balance of supple
      and fixed deformities in the foot, very satisfying outcomes usually can be obtained.
    explanation: The CMT surgical review emphasizes individualized assessment and the possibility
      of later deterioration. This is expert interpretation, not an MME-specific surgical outcome
      estimate.
- name: Cause-Specific Pain Management
  therapeutic_modality: SMALL_MOLECULE
  description: General CMT guidance recommends identifying the cause of pain before selecting
    symptomatic treatment. Musculoskeletal pain may respond to acetaminophen or nonsteroidal
    anti-inflammatory agents, whereas neuropathic pain may respond to tricyclic antidepressants,
    carbamazepine or gabapentin. These options are extrapolated from CMT-wide care, with no
    MME-specific efficacy claim; a reported painful limb is not automatically assigned a neuropathic
    pain mechanism.
  treatment_term:
    preferred_term: Cause-specific pain management
    term:
      id: NCIT:C15180
      label: Pain Therapy
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: The cause of any pain should be identified as accurately as possible
    explanation: General CMT expert advice supports determining the pain mechanism before treatment
      and avoids assuming all MME-associated limb pain is neuropathic.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Musculoskeletal pain may respond to acetaminophen or nonsteroidal anti-inflammatory
      agents
    explanation: GeneReviews lists symptomatic options for musculoskeletal pain in CMT generally,
      not an observed MME-specific drug response.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI
      Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: Neuropathic pain may respond to tricyclic antidepressants or drugs such as carbamazepine
      or gabapentin.
    explanation: General CMT expert treatment advice provides options when pain is neuropathic;
      it does not establish that attribution or treatment efficacy in an MME cohort.
diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Nerve-conduction studies and EMG characterize axonal motor/sensory dysfunction and denervation.
    Reduced response amplitudes with relatively preserved velocities are typical, but some
    CMT2T nerves have intermediate or demyelinating-range velocities. Such values do not automatically
    point away from MME disease; the full clinical, electrophysiological and genetic picture
    is required.
  evidence:
  - reference: PMID:35212467
    reference_title: "A nonsense mutation in MME gene associates with autosomal recessive
      late-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CMT1 patients show severe reduction in motor nerve conduction velocities
      (NCV < 38 m/s) while CMT2 patients display normal or slightly decreased NCV
      (>38 m/s) but a relatively low action potential amplitude
    explanation: >-
      A conventional classification threshold provides context but is not an absolute CMT2T
      exclusion criterion; primary MME cohorts include intermediate and demyelinating-range
      measurements.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the
      importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe a relatively mild axonal sensory-motor neuropathy with a greater
      impairment of the lower extremities.
    explanation: >-
      Confirms the axonal character and lower-limb predominance in a CMT2T
      cohort specifically.
  - reference: 
      url:https://riunet.upv.es/bitstreams/73944312-a829-4377-80d5-922bd1d1b508/download
    reference_title: "https://riunet.upv.es/bitstreams/73944312-a829-4377-80d5-922bd1d1b508/download"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      An inter-
      mediate (35–45
       m/s) or even demyelinating (<38
       m/s) range 
      of MNCVs was recorded in some nerves although conduction 
      to pro
      ximal muscles produced higher MNCV values (table
       3
      ).
    explanation: >-
      The Spanish biallelic cohort included intermediate or demyelinating-range motor velocities
      in some nerves, with faster conduction to proximal muscles.
- name: MME Sequencing in Unexplained Late-Onset Axonal Neuropathy
  description: >-
    MME analysis can identify the cause of otherwise unexplained late-onset axonal neuropathy,
    including cases without a clear family history. The 2020 study used both WES and targeted
    testing. Test selection and interpretation require the differential diagnosis, variant
    classification and segregation; its diagnostic yield alone does not establish a universal
    MME-first algorithm. GeneReviews supports detailed family history and molecular genetic
    testing to identify the specific cause within the broader CMT differential.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recruited patients, collected clinical data, and conducted whole-exome
      sequencing (WES; n = 126) and MME single-gene sequencing (n = 104).
    explanation: >-
      Documents both testing strategies used to reach the diagnosis in this
      population.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a detailed family history and the use of molecular genetic testing are essential to
      establishing a specific genetic cause.
    explanation: >-
      The GeneReviews diagnostic recommendation concerns CMT generally; it supports family
      assessment and genetic testing, not a universal MME-first testing sequence.
- name: Blood Neprilysin Measurement
  description: >-
    Low blood neprilysin provides research support for some MME variants. Assay values overlap
    with controls, some controls fall below detection, and no validated individual diagnostic
    cutoff or functional classification rule is established. Measurement should not substitute
    for variant interpretation and family analysis.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7836667/
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 75% of these samples, levels were below the detection threshold of the assay.
    explanation: >-
      The antecedent is 12 samples from individuals with truncating or other serious heterozygous
      MME variants after outlier exclusion; the median was 0 ng/mL. Approximately 20% of comparison
      samples were below threshold. This measures circulating protein abundance, not nerve
      enzyme activity.
differential_diagnoses:
- name: Acquired axonal polyneuropathy of the elderly
  description: >-
    Diabetes, paraproteinemia, inflammatory disease and other acquired causes overlap clinically
    with MME-related late-onset axonal neuropathy. Some apparently idiopathic cases have an
    MME genetic contribution; variant classification, family segregation and the full clinical
    context remain necessary because a heterozygous finding alone does not establish causation.
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked
      to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axonal polyneuropathies are a frequent cause of progressive disability in
      the elderly. Common etiologies comprise diabetes mellitus,
      paraproteinaemia, and inflammatory disorders, but often the underlying
      causes remain elusive.
    explanation: >-
      States the population within which CMT2T is hidden.
- name: Chronic inflammatory demyelinating polyneuropathy
  description: >-
    CIDP is both a differential and, in at least one patient, a comorbidity. A
    genotyped CMT2T patient developed demyelinating electrophysiology and an
    inflammatory biopsy and responded to immunoglobulin. So a demyelinating
    feature in a patient with a confirmed MME genotype does not exclude CIDP -
    it may indicate a treatable second process superimposed on the genetic one.
  evidence:
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation
      superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report which documented the co-existence of CMT2 and
      chronic inflammatory demyelinating polyneuropathy (CIDP)
    explanation: >-
      Documents the coexistence that makes CIDP a comorbidity rather than only an
      alternative diagnosis.
- name: MME-related distal hereditary motor neuropathy
  description: >-
    Biallelic MME variants can produce a motor-predominant or dHMN phenotype with preserved
    clinical sensation and sensory responses. The 2019 series included both adult and juvenile
    onset. Sensory testing helps describe the presentation, but the broader MME spectrum is
    a continuum and no universal genotype-based boundary has been established.
  evidence:
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary
      motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the patients showed late-onset phenotype of distal
      motor neuropathy without sensory involvement.
    explanation: >-
      Establishes the purely motor MME entity and the feature that distinguishes
      it.
- name: DNAJB2-related Charcot-Marie-Tooth disease type 2
  description: >-
    Not a biological differential so much as a nomenclature hazard. The label
    "CMT2T" has been applied to two different gene-disease pairs, and until
    recently MONDO carried both under one term: MONDO:0014866 listed DNAJB2
    synonyms and cross-referenced two OMIM entries while naming MME as its causal
    gene. That term is now obsolete and replaced by MONDO:0044640, which
    cross-references only the MME entity. A "CMT2T" result or a citation
    predating that split must be checked for which gene it means.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease
      type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we propose that this new disease should be termed AR-CMT2T
    explanation: >-
      The naming proposal for the MME entity, which is the sense in which this
      entry uses CMT2T.
discussions:
- discussion_id: cmt2t_dominant_versus_recessive
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are heterozygous MME variants a dominant cause of late-onset neuropathy with
    age-dependent penetrance, or a susceptibility factor that requires something
    else to produce disease?
  attaches_to:
  - "pathophysiology#MME Loss-of-Function Variant"
  - "pathophysiology#Neprilysin Deficiency in Peripheral Nerve"
  rationale: >-
    Biallelic pathogenic MME variants establish recessive neuropathy, while selected heterozygous
    variants segregate with disease and are enriched among late-onset neuropathy cohorts.
    The 2020 study already framed the latter as dominantly inherited susceptibility and partly
    reused the 2016 cohort. The Spanish series showed nonsegregation for tested heterozygous
    variants, with an alternative AIFM1 diagnosis for neuropathy/deafness and a pathogenic
    SOD1 variant in an ALS family. These findings are not evidence that every heterozygous
    allele causes disease. The 2024 Italian cohort contained 13 biallelic, 18 monoallelic
    and one unphased case, including ten VUS and one likely benign classification. Its Results
    describe the greater severity after ten years as not statistically significant because
    of an outlier, whereas the Discussion calls it significant; this cross-sectional contrast
    cannot establish an individual longitudinal progression rate. Age- and population-specific
    penetrance, modifying factors and variant-specific mechanisms remain unresolved.
  proposed_experiments:
  - experiment_id: exp_cmt2t_carrier_penetrance_cohort
    name: Age-stratified penetrance in unselected heterozygous carriers
    description: >-
      Ascertain heterozygous MME loss-of-function carriers from population
      biobanks rather than from neuropathy clinics, and measure the age-specific
      prevalence of clinical and electrophysiological neuropathy against matched
      non-carriers. Clinic ascertainment cannot distinguish incomplete penetrance
      from susceptibility; population ascertainment can.
  - experiment_id: exp_cmt2t_neprilysin_activity_vs_phenotype
    name: Enzymatic activity as a quantitative predictor across zygosities
    description: >-
      Measure blood and, where available, nerve neprilysin activity across
      monoallelic and biallelic carriers and relate it to onset age and
      progression rate. If a dosage model holds, activity should predict
      phenotype continuously across zygosity rather than in two discrete groups.
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked
      to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME mutations segregated in an autosomal-dominant fashion with age-related
      incomplete penetrance and some affected individuals were isolated case
      subjects.
    explanation: >-
      The primary statement of the dominant mode and of its age-related
      incomplete penetrance.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission of MME variants was often consistent with an incompletely
      penetrant autosomal-dominant trait and less frequently with
      autosomal-recessive inheritance.
    explanation: >-
      The expanded cohort supports incompletely penetrant transmission; 51 patients overlapped
      with the original 2016 screening series.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the
      importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This indicates that the heterozygous MME variants may not be fully
      penetrant, or alternatively, that they may be a potential risk factor for
      neuropathy.
    explanation: >-
      The authors interpret the heterozygous findings as incomplete penetrance or susceptibility,
      rather than establishing causation for every variant.
  - reference: PMID:30415211
    reference_title: Characterising the phenotype and mode of inheritance of patients 
      with inherited peripheral neuropathies carrying MME mutations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and mutations did not segregate with the disease.
    explanation: >-
      The clause refers to tested heterozygous variants in the Spanish series. Nonsegregation
      directly challenges their causal interpretation; phenotypic diversity alone would not
      do so.
  - reference: PMID:30415211
    reference_title: "Characterising the phenotype and mode of inheritance of patients with
      inherited peripheral neuropathies carrying MME mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME mutations that segregate in an autosomal recessive pattern are
      associated with a late-onset CMT2 phenotype, yet we could not demonstrate
      that MME variants in heterozygosis cause neuropathy.
    explanation: >-
      The Spanish authors could not establish heterozygous causation in their families. This
      does not refute every allele in other populations.
- discussion_id: cmt2t_unidentified_substrate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which endogenous substrates and glial or axonal processes explain variable age-dependent
    neuropathy after neprilysin deficiency?
  attaches_to:
  - pathophysiology#Proposed Disruption of Schwann Cell–Axon Signaling
  rationale: >-
    Human genotype/nerve-protein evidence establishes an etiological link to neuropathy, and
    the authors explicitly propose impaired Schwann cell–axon interactions. The relevant substrates
    and intervening molecular pathway are not established. Peptide turnover and nociceptive
    signaling remain candidates. Normal young-mouse repair after sciatic crush does not exclude
    every chronic support mechanism in humans. Negative amyloid PET in one Japanese patient
    and absent deposits in selected peripheral tissues do not exclude future dementia or every
    amyloid-related pathway; one biallelic Spanish patient developed late-life Alzheimer dementia.
    Onset varies substantially rather than invariably taking five decades.
  proposed_experiments:
  - experiment_id: exp_cmt2t_nerve_peptidomics
    name: Peptidomic profiling of neprilysin-deficient peripheral nerve
    description: >-
      Compare the peptidome of sural nerve from genotyped CMT2T patients against
      age-matched controls, and of sciatic nerve from aged MME-null mice against
      wild type, to identify substrates that accumulate in the affected
      compartment rather than inferring from the known substrate list.
  - experiment_id: exp_cmt2t_long_axon_model
    name: A model with axons long enough to fail
    description: >-
      The mouse does not develop the disease and its axons are an order of
      magnitude shorter than a human's. Test whether neprilysin loss injures long
      axons specifically, using human induced-pluripotent-stem-cell-derived
      sensory neurons in microfluidic long-axon culture with MME knocked out, with
      distal axon integrity as the readout.
  evidence:
  - *id002
  - reference: url:https://push-zb.helmholtz-munich.de/deliver.php?id=16100
    reference_title: "https://push-zb.helmholtz-munich.de/deliver.php?id=16100"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      The pathological process may involve
      both C-ﬁber degeneration (such as in painful small ﬁber
      neuropathy
      54) and decreased neprilysin-dependent pro-
      cessing of mediators of nociceptive signals.
    explanation: >-
      The authors propose C-fiber dysfunction/degeneration and altered nociceptive-peptide
      processing as explanations for painful neuropathy. This is a qualified interpretation
      combining patient observations and mouse pathology.
    directness: INDIRECT
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, contrary to the glomerular disease, which is immune mediated, the pathophysiology
      of the neuropathy is unknown.
    explanation: >-
      This literature-status statement identifies the unresolved detailed mechanism, not absence
      of a causal association between MME deficiency and neuropathy.
- discussion_id: cmt2t_alloimmunisation_and_pharmacovigilance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the reproductive and pharmacological consequences of neprilysin
    deficiency, and should long-term neprilysin inhibition in heart failure carry
    neurological surveillance?
  attaches_to:
  - "pathophysiology#Neprilysin Deficiency in Peripheral Nerve"
  rationale: >-
    Maternal alloimmunization against neprilysin can cause membranous nephropathy in offspring
    of neprilysin-null women. The renal disease and neonatal deaths described in those pedigrees
    belong to the children and are not CMT2T maternal phenotypes. The source recommends family
    screening and long-term neurological vigilance during neprilysin-inhibitor therapy, while
    explicitly reporting no observed drug-associated adverse effect. These recommendations
    are not proof of treatment-induced neuropathy. The affected adults’ mild proteinuria in
    the Japanese cohort is a separate observation with unresolved attribution.
  evidence:
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Finally, we suggest that prolonged administration in patients with heart
      failure of an angiotensin receptor antagonist combined with a NEP inhibitor
      should include careful long-term neurological surveillance, although no
      adverse effect has been reported as yet, possibly for lack of sufficient
      hindsight.
    explanation: >-
      Author recommendation for pharmacovigilance, explicitly acknowledging that no adverse
      effect had been observed; not a clinical toxicity observation.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth
      With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening
      and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Identification of MME-related Charcot-Marie-Tooth disease in families should
      lead to early screening of women predisposed to feto-maternal
      allo-immunization and renal complications in their offspring.
    explanation: >-
      Author recommendation for reproductive family screening based on the established maternal
      alloimmunization context; not an outcome trial of screening.
  proposed_experiments:
  - experiment_id: exp_cmt2t_neprilysin_inhibitor_neuropathy_surveillance
    name: Long-term neurological outcomes in patients on neprilysin inhibitors
    description: >-
      Follow a cohort on combined angiotensin-receptor and neprilysin inhibition
      with serial nerve conduction studies over a decade or more, against matched
      heart-failure patients on other regimens, to determine whether
      pharmacological neprilysin inhibition produces any measurable axonal effect.
- discussion_id: cmt2t_cognitive_attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Dementia
  prompt: >-
    Does neprilysin deficiency alter late-life dementia risk in CMT2T?
  rationale: >-
    One biallelic Spanish patient had Alzheimer dementia beginning at 67, but a patient with
    the same homozygous variant had no cognitive impairment. Negative cohort screening and
    single-patient PET observations do not establish lifetime absence. Neither a specific
    MME-mediated brain lesion nor excess age-adjusted dementia risk is demonstrated, so no
    causal edge is asserted. The Spanish dementia patient also had extensive diffuse white-matter
    damage; that table wording does not establish the multifocal hyperintensity pattern described
    in Iranian VI.4.

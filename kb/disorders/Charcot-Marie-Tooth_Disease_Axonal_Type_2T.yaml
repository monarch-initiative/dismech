- category: Nervous System
  name: Axonal Sensorimotor Polyneuropathy
  description: >-
    Progressive peripheral axonal neuropathy generally affects distal lower limbs first and
    can spread to the hands and proximal muscles. Motor and sensory involvement vary, and
    symptoms can range from subclinical sensory abnormalities to severe walking disability.
    Secondary demyelinating-range measurements do not exclude the diagnosis.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy

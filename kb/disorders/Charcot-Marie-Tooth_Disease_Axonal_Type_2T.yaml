- name: Neprilysin Deficiency in Peripheral Nerve
  description: >-
    Absent or reduced neprilysin protein was demonstrated in sural nerve in recessive CMT2T.
    Reduction was mild in a sensory-nerve biopsy from a dHMN patient. Separate assays of selected
    mutant proteins in HEK293 cells establish impaired catalytic capacity, without demonstrating
    the activity of endogenous peptide substrates in patient nerve. Lower adipose-tissue and
    circulating protein levels in heterozygous cohorts provide additional, tissue-specific
    observations.

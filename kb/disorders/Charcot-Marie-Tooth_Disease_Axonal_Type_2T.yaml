biochemical:
- name: Blood Neprilysin Level
  notes: >-
    Circulating neprilysin is low in patients with MME variants, which was used
    as one of the independent lines of support for the gene's relevance to
    late-onset neuropathy. It is the only accessible biochemical correlate of the
    genotype, and unlike transcript level in lymphocytes - which is unchanged
    between patients and controls - it tracks the defect.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      retrieval of additional late-onset neuropathy patients with MME variants
      from WES repositories, and low neprilysin levels in patients' blood samples
    explanation: >-
      Establishes low blood neprilysin in patients carrying MME variants.
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transcript levels of MME in the lymphocytes showed no significant
      differences between the patients and controls.
    explanation: >-
      The contrasting negative that makes protein rather than transcript the
      informative measurement.
genetic:
- name: MME
  gene_term:
    preferred_term: MME
    term:
      id: hgnc:7154
      label: MME
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    MME sits at 3q25 and encodes neprilysin, a zinc-dependent type II
    transmembrane metalloprotease of about 100 kDa whose catalytic site faces the
    extracellular space. Its substrate list is long - enkephalins, substance P,
    beta-amyloid, gastrin, somatostatin, atrial natriuretic peptide, angiotensin
    II, endothelin-1 - and its expression is wide, covering kidney, breast,
    intestine, lymphoblasts and both the central and peripheral nervous systems.
    The same breadth is why the gene is better known outside neurology: as CD10,
    the marker on acute lymphoblastic leukaemia blasts, and as the target of the
    heart-failure drug class combining a neprilysin inhibitor with an angiotensin
    receptor antagonist.

    Allele classes reported in CMT2T span nonsense, frameshift, canonical splice
    and missense. They act by loss of function through more than one route:
    nonsense-mediated decay of the transcript, exon skipping, or loss of the
    carboxy-terminal zinc-binding and catalytic domain. One truncating allele,
    c.466delC (p.Pro156Leufs*14), recurs across Portuguese, Dutch, Moroccan,
    Italian and German families.

    Two further points bear on interpretation. The MME phenotype is not confined
    to CMT2T: biallelic variants also cause a late-onset distal hereditary motor
    neuropathy without sensory involvement, so the same gene spans a sensorimotor
    and a purely motor entity. And MME is not a rare finding in unexplained
    neuropathy - in a 230-patient study of late-onset axonal neuropathy it was
    the most frequently involved gene and accounted for 34.8 percent of
    genetically solved cases, which makes it a high-yield single-gene test in
    that population rather than a last resort.

    A caution on variant interpretation that bears on the inheritance question:
    in the Italian series of 32 patients, ACMG classification placed 8 variants
    as pathogenic and 13 as likely pathogenic, but 10 as variants of unknown
    significance and one as likely benign. A third of that cohort therefore
    carried a variant not established as disease-causing, which is worth holding
    in mind before treating cohort-level statements about monoallelic patients as
    statements about a proven monogenic cause.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME was most frequently involved and accounted for 34.8% of genetically
      solved cases.
    explanation: >-
      Quantifies the diagnostic yield of MME within unexplained late-onset axonal
      neuropathy.
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the patients showed late-onset phenotype of distal
      motor neuropathy without sensory involvement.
    explanation: >-
      Establishes the purely motor MME phenotype that sits alongside CMT2T.
  - reference: PMID:31339187
    reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Membrane metallo‐endopeptidase (MME) gene encodes a zinc‐dependent
      metalloprotease, a Type II transmembrane glycoprotein of 100 kDa with the
      catalytic site localized in the extracellular domain.
    explanation: >-
      States the protein's class, topology and catalytic orientation.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two additional families from Italy and Germany were subsequently reported
      with the same homozygous truncating mutation c.466delC (p.Pro156Leufs∗14).
    explanation: >-
      Establishes c.466delC as a recurrent allele across multiple unrelated
      European families.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To classify their variants, the ACMG guidelines were followed, defining them
      as Pathogenic (P) in 8 patients, likely pathogenic (LP) in 13, a variant of
      unknown significance in 10 and likely benign (LB) in the remaining one
    explanation: >-
      Curated as PARTIAL: a third of this cohort carried a variant not
      established as pathogenic, which limits how strongly the cohort's
      conclusions about monoallelic patients can be read.
prevalence:
- population: Patients with unexplained axonal neuropathy and onset at or after 35 years
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence is available and none can be inferred from what is
    published, because ascertainment for CMT2T runs through sequencing of
    unexplained late-onset neuropathy rather than through a recognisable clinical
    syndrome. The figures that do exist are diagnostic yields within selected
    cohorts: MME accounted for 34.8 percent of genetically solved cases in a
    230-patient study of unexplained axonal neuropathy with onset at 35 years or
    later, where the overall detection rate for a disease-causing variant in any
    neuropathy gene was 18.3 percent. Those two numbers together imply MME
    explained roughly six percent of that ascertained series, which is a yield
    and not a rate. The disorder is described as rare, but with age-dependent
    penetrance and a substantial pool of carriers found in exome repositories,
    how rare is genuinely unknown.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the WES cohort, the overall detection rate for assumed disease-causing
      variants in genes for CMT or other conditions associated with neuropathies
      was 18.3% (familial cases 26.4%, apparently sporadic cases 12.3%).
    explanation: >-
      The denominator against which the MME share is expressed.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME was most frequently involved and accounted for 34.8% of genetically
      solved cases.
    explanation: >-
      The MME share of solved cases within that cohort.
animal_models:
- name: Mme knockout mouse
  species: Mouse
  genotype: Mme-/- (MME knockout)
  publication: PMID:31339187
  description: >-
    The available mouse model, and its most important result is a negative one.
    Peripheral nerve morphometry in MME-null mice showed only minor abnormalities
    in aged animals, far short of the human neuropathy. When the hypothesis that
    neprilysin has a role in remyelination was tested directly - the hypothesis
    motivated by neprilysin's localisation to Schmidt-Lanterman clefts and
    paranodes and by its neuregulin-1-dependent regulation after injury - the
    knockout was indistinguishable from wild type in axon regeneration,
    remyelination and functional motor recovery.
  modeled_mechanisms:
  - target: Length-Dependent Axonal Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      MME-null mice do not develop a neuropathy comparable to the human disease,
      and show no myelination impairment in the naive adult state.
    limitations: >-
      Because the model does not reproduce the phenotype, it cannot be used to
      identify the pathogenic substrate or to test a therapy, and the negative
      remyelination result cannot be read as excluding a myelination role in
      humans - murine axons are far shorter, and the human disease takes five
      decades to appear.
    evidence:
    - reference: PMID:31339187
      reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Peripheral nerve morphometry in mice lacking MME previously showed minor
        abnormalities in aged animals in comparison to CMT2 patients.
      explanation: >-
        States directly that the murine phenotype falls short of the human one.
  - target: Loss of Peptidase Activity at Myelin-Associated Compartments
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Tests and rejects the most obvious candidate mechanism for this node - that
      neprilysin is needed for myelination or remyelination.
    limitations: >-
      A negative in mouse for one candidate mechanism, in an animal that does not
      develop the disease. It narrows the hypothesis space rather than settling
      it.
    readouts:
    - name: Axon regeneration and remyelination after nerve injury
      target: Loss of Peptidase Activity at Myelin-Associated Compartments
      direction: UNCHANGED
      interpretation: >-
        No difference from wild type, which is a real negative result rather than
        a missing measurement.
      evidence:
      - reference: PMID:31339187
        reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          After nerve injury the morphological outcome in MME KO mice was
          indistinguishable from WT littermates in terms of axon regeneration and
          remyelination.
        explanation: >-
          The measurement underlying this readout.
    evidence:
    - reference: PMID:31339187
      reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In conclusion, although MME expression is dysregulated after nerve injury
        in a NRG1-dependent manner this gene is dispensable for axon regeneration
        and remyelination after injury.
      explanation: >-
        The authors' conclusion rejecting a remyelination role, which is why this
        link is FAILS_TO_RECAPITULATE.
treatments:
- name: Intravenous Immunoglobulin for Superimposed Inflammatory Neuropathy
  therapeutic_modality: OTHER
  description: >-
    Not a treatment for CMT2T itself, which has none. Immunoglobulin was given to
    a homozygous MME patient whose course had acquired demyelinating features on
    electrophysiology and biopsy, and produced immediate clinical and
    electrophysiological improvement. It is curated because it identifies a
    treatable component in a disorder otherwise managed supportively, and because
    it depends on recognising that not all deterioration in a genotyped patient is
    genetic. This rests on a single reported patient.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  evidence:
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoglobulin treatment was initiated considering the possibility of
      superimposed inflammation and demyelination, and immediate clinical as well
      as electrophysiological improvements were noted.
    explanation: >-
      Documents the response to immunoglobulin in the one reported patient with a
      superimposed inflammatory neuropathy.
  target_mechanisms:
  - target: Predisposition to Superimposed Inflammatory Demyelinating Neuropathy
    treatment_effect: INHIBITS
    description: >-
      Immunoglobulin addresses the inflammatory arm, not the underlying
      neprilysin deficiency. Nothing in this entry should be read as suggesting it
      modifies the genetic disease.
    evidence:
    - reference: PMID:28855494
      reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunoglobulin treatment was initiated considering the possibility of
        superimposed inflammation and demyelination, and immediate clinical as well
        as electrophysiological improvements were noted.
      explanation: >-
        Links the intervention to the inflammatory node it targets.
diagnosis:
- name: MME Sequencing in Unexplained Late-Onset Axonal Neuropathy
  description: >-
    The diagnostic point of this entry. Because CMT2T presents in the fifth or
    sixth decade, often without family history and often without pes cavus, it is
    reached by sequencing rather than by clinical recognition. In a cohort of
    unexplained axonal neuropathy with onset at 35 years or later, MME was the
    most frequently implicated gene. Both whole-exome and MME single-gene
    sequencing were used in that study, so a targeted test is a reasonable first
    step where exome sequencing is not available.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We recruited patients, collected clinical data, and conducted whole-exome
      sequencing (WES; n = 126) and MME single-gene sequencing (n = 104).
    explanation: >-
      Documents both testing strategies used to reach the diagnosis in this
      population.
- name: Blood Neprilysin Measurement
  description: >-
    A supporting rather than a confirmatory test. Low blood neprilysin was one of
    the independent lines of evidence used to establish that MME variants found
    in late-onset neuropathy patients were consequential rather than incidental,
    which makes it useful for weighing a variant of uncertain significance.
  evidence:
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      preponderance of MME variants among patients compared to population
      frequencies, retrieval of additional late-onset neuropathy patients with MME
      variants from WES repositories, and low neprilysin levels in patients' blood
      samples
    explanation: >-
      Places the blood measurement among the lines of evidence supporting variant
      pathogenicity.
differential_diagnoses:
- name: Acquired axonal polyneuropathy of the elderly
  description: >-
    The differential that matters most, and the one CMT2T is routinely lost
    inside. Axonal polyneuropathy is a frequent cause of disability in older
    people, commonly attributed to diabetes, paraproteinaemia or an inflammatory
    cause, and often left unexplained. CMT2T is clinically indistinguishable at
    the bedside; what separates it is a genetic test. The practical implication
    runs the other way from most differentials - the question is not how to
    exclude CMT2T from an elderly neuropathy, but that a proportion of
    "idiopathic" elderly neuropathy is CMT2T.
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Axonal polyneuropathies are a frequent cause of progressive disability in
      the elderly. Common etiologies comprise diabetes mellitus,
      paraproteinaemia, and inflammatory disorders, but often the underlying
      causes remain elusive.
    explanation: >-
      States the population within which CMT2T is hidden.
- name: Chronic inflammatory demyelinating polyneuropathy
  description: >-
    CIDP is both a differential and, in at least one patient, a comorbidity. A
    genotyped CMT2T patient developed demyelinating electrophysiology and an
    inflammatory biopsy and responded to immunoglobulin. So a demyelinating
    feature in a patient with a confirmed MME genotype does not exclude CIDP -
    it may indicate a treatable second process superimposed on the genetic one.
  evidence:
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first report which documented the co-existence of CMT2 and
      chronic inflammatory demyelinating polyneuropathy (CIDP)
    explanation: >-
      Documents the coexistence that makes CIDP a comorbidity rather than only an
      alternative diagnosis.
- name: MME-related distal hereditary motor neuropathy
  description: >-
    The same gene, biallelic variants, and a late-onset neuropathy - but purely
    motor, with no sensory involvement. It is separated from CMT2T by sensory
    examination and sensory conduction studies rather than by genotype, and no
    genotype-phenotype rule distinguishing the two has been established.
  evidence:
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical features of the patients showed late-onset phenotype of distal
      motor neuropathy without sensory involvement.
    explanation: >-
      Establishes the purely motor MME entity and the feature that distinguishes
      it.
- name: DNAJB2-related Charcot-Marie-Tooth disease type 2
  description: >-
    Not a biological differential so much as a nomenclature hazard. The label
    "CMT2T" has been applied to two different gene-disease pairs, and until
    recently MONDO carried both under one term: MONDO:0014866 listed DNAJB2
    synonyms and cross-referenced two OMIM entries while naming MME as its causal
    gene. That term is now obsolete and replaced by MONDO:0044640, which
    cross-references only the MME entity. A "CMT2T" result or a citation
    predating that split must be checked for which gene it means.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we propose that this new disease should be termed AR-CMT2T
    explanation: >-
      The naming proposal for the MME entity, which is the sense in which this
      entry uses CMT2T.
discussions:
- discussion_id: cmt2t_dominant_versus_recessive
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are heterozygous MME variants a dominant cause of late-onset neuropathy with
    age-dependent penetrance, or a susceptibility factor that requires something
    else to produce disease?
  attaches_to:
  - "pathophysiology#MME Loss-of-Function Variant"
  - "pathophysiology#Neprilysin Deficiency in Peripheral Nerve"
  rationale: >-
    Two large, independent, well-conducted studies published months apart reached
    different conclusions about the same gene. Higuchi and colleagues found
    biallelic variants in ten patients and named the disease AR-CMT2T;
    Auer-Grumbach and colleagues found heterozygous variants in nineteen index
    subjects segregating dominantly with age-related incomplete penetrance.
    Neither is obviously wrong, and a later 230-patient cohort found dominant
    transmission the commoner pattern while still recording recessive families.

    A simple dosage model would predict that biallelic patients are more severely
    affected than monoallelic ones. The Italian 32-patient series tested that and
    found comparable severity overall, with biallelic patients differing only in
    earlier onset and, after ten years of disease, faster progression. That is a
    weaker dosage effect than a straightforward recessive-versus-dominant
    distinction would predict, and the same series raises the possibility that
    heterozygous variants are a risk factor rather than a monogenic cause - a
    third option that neither original study framed. That series also classified
    10 of its 32 patients' variants as of unknown significance and one as likely
    benign under ACMG criteria, so part of the apparent monoallelic signal may be
    variant-interpretation noise rather than biology.

    This entry curates both inheritance blocks and leaves `zygosity` unset on the
    trigger node's genetic context, because setting it would encode one side of
    the question. Resolving it matters clinically: whether a heterozygous
    relative is counselled as an at-risk carrier of a dominant disease, or as
    carrying a susceptibility allele, follows directly from the answer.
  proposed_experiments:
  - experiment_id: exp_cmt2t_carrier_penetrance_cohort
    name: Age-stratified penetrance in unselected heterozygous carriers
    description: >-
      Ascertain heterozygous MME loss-of-function carriers from population
      biobanks rather than from neuropathy clinics, and measure the age-specific
      prevalence of clinical and electrophysiological neuropathy against matched
      non-carriers. Clinic ascertainment cannot distinguish incomplete penetrance
      from susceptibility; population ascertainment can.
  - experiment_id: exp_cmt2t_neprilysin_activity_vs_phenotype
    name: Enzymatic activity as a quantitative predictor across zygosities
    description: >-
      Measure blood and, where available, nerve neprilysin activity across
      monoallelic and biallelic carriers and relate it to onset age and
      progression rate. If a dosage model holds, activity should predict
      phenotype continuously across zygosity rather than in two discrete groups.
- discussion_id: cmt2t_unidentified_substrate
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which neprilysin substrate accumulates in peripheral nerve to cause axonal
    degeneration, and why does it take five decades?
  attaches_to:
  - "pathophysiology#Loss of Peptidase Activity at Myelin-Associated Compartments"
  rationale: >-
    Neprilysin deficiency in patient nerve is established and axonal degeneration
    in patient nerve is established, and nothing published connects them. The
    authors of the alloimmunisation series say so directly - unlike the kidney
    disease, the pathophysiology of the neuropathy is unknown - and the causal
    edge in this entry is typed accordingly.

    Two candidate hypotheses have been tested and neither survived intact.
    Beta-amyloid is the best-known neprilysin substrate, but MME-null patients
    have neither dementia nor excess amyloid on PET, so amyloid accumulation is
    not the route. A myelination or remyelination role was the natural inference
    from neprilysin's localisation to Schmidt-Lanterman clefts and paranodes and
    its neuregulin-1-dependent regulation after injury, but MME-null mice
    regenerate and remyelinate indistinguishably from wild type. What remains is
    a long substrate list - enkephalins, substance P, endothelin-1, atrial
    natriuretic peptide among others - and no evidence singling one out.

    The five-decade latency is part of the puzzle rather than incidental to it. A
    mechanism that takes fifty years to injure an axon is more likely to be
    cumulative than acute, which argues for a substrate whose slow accumulation
    is tolerated until some reserve is exhausted; but that is reasoning from the
    clinical course, not from data.
  proposed_experiments:
  - experiment_id: exp_cmt2t_nerve_peptidomics
    name: Peptidomic profiling of neprilysin-deficient peripheral nerve
    description: >-
      Compare the peptidome of sural nerve from genotyped CMT2T patients against
      age-matched controls, and of sciatic nerve from aged MME-null mice against
      wild type, to identify substrates that accumulate in the affected
      compartment rather than inferring from the known substrate list.
  - experiment_id: exp_cmt2t_long_axon_model
    name: A model with axons long enough to fail
    description: >-
      The mouse does not develop the disease and its axons are an order of
      magnitude shorter than a human's. Test whether neprilysin loss injures long
      axons specifically, using human induced-pluripotent-stem-cell-derived
      sensory neurons in microfluidic long-axon culture with MME knocked out, with
      distal axon integrity as the readout.
- discussion_id: cmt2t_alloimmunisation_and_pharmacovigilance
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the reproductive and pharmacological consequences of neprilysin
    deficiency, and should long-term neprilysin inhibition in heart failure carry
    neurological surveillance?
  attaches_to:
  - "pathophysiology#Neprilysin Deficiency in Peripheral Nerve"
  rationale: >-
    Two consequences of neprilysin deficiency sit outside the neuropathy and are
    recorded here because an entry that omitted them would be clinically
    incomplete.

    The first is reproductive and is already established. A woman with no
    neprilysin protein is immunologically naive to it; exposure to fetal
    neprilysin at a first pregnancy or miscarriage immunises her, and
    anti-neprilysin antibodies crossing the placenta in a later pregnancy cause
    antenatal membranous nephropathy in the infant. This is not speculative - it
    is how the first four families were ascertained, and it was reproduced
    experimentally by infusing maternal serum into rabbits. The practical
    consequence runs in both directions: an MME-related neuropathy diagnosis
    should prompt screening of women in the family for alloimmunisation risk, and
    an infant with antenatal membranous nephropathy should prompt neurological
    surveillance of the mother and other biallelic relatives.

    The second is pharmacological and is genuinely open. Neprilysin is the target
    of an approved heart-failure drug class. If lifelong genetic neprilysin
    deficiency causes an axonal neuropathy after five decades, whether decades of
    pharmacological inhibition carries any comparable risk is a reasonable
    question, and the reporting authors raise it explicitly while noting that no
    adverse effect has been reported so far, possibly for lack of hindsight. This
    entry curates no treatment or contraindication on that basis - the evidence
    does not support one - but records the question.
  evidence:
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we suggest that prolonged administration in patients with heart
      failure of an angiotensin receptor antagonist combined with a NEP inhibitor
      should include careful long-term neurological surveillance, although no
      adverse effect has been reported as yet, possibly for lack of sufficient
      hindsight.
    explanation: >-
      The pharmacovigilance question stated by the authors, including their own
      caveat that no harm has been observed.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identification of MME-related Charcot-Marie-Tooth disease in families should
      lead to early screening of women predisposed to feto-maternal
      allo-immunization and renal complications in their offspring.
    explanation: >-
      The reproductive screening recommendation that follows from the
      alloimmunisation mechanism.
  proposed_experiments:
  - experiment_id: exp_cmt2t_neprilysin_inhibitor_neuropathy_surveillance
    name: Long-term neurological outcomes in patients on neprilysin inhibitors
    description: >-
      Follow a cohort on combined angiotensin-receptor and neprilysin inhibition
      with serial nerve conduction studies over a decade or more, against matched
      heart-failure patients on other regimens, to determine whether
      pharmacological neprilysin inhibition produces any measurable axonal effect.
notes: >-
  Ontology identity. This entry was claimed against MONDO:0014866, which is
  **obsolete** in the MONDO release the term validator uses and is replaced by
  MONDO:0044640 "Charcot-Marie-Tooth disease type 2T". The entry uses the
  replacement term. The obsoletion is not cosmetic: MONDO:0014866 carried both
  OMIM:616233 and OMIM:617017, and listed DNAJB2 synonyms alongside a
  definition and causal-gene relationship naming MME - that is, it conflated two
  distinct gene-disease pairs that share the label CMT2T. MONDO:0044640 carries
  only OMIM:617017 and the MME synonyms. Anyone reading older literature or an
  older ontology release should check which gene a "CMT2T" reference means.

  Note also that the locally built `sqlite:obo:mondo` adapter still had
  MONDO:0014866 active with the DNAJB2 synonyms at the time of curation, while
  the OLS-backed validator had it obsolete. The two disagreed, and the stub queue
  was built from the older view.

  Two inheritance modes, deliberately. This entry curates both an autosomal
  recessive and an incompletely penetrant autosomal dominant block, and leaves
  `zygosity` unset in the trigger node's genetic context. That is not
  indecision - the two modes are supported by separate large cohorts published
  months apart, a third series suggests heterozygous variants may be a
  susceptibility factor rather than a cause at all, and a dosage model does not
  fit cleanly because biallelic and monoallelic patients have comparable overall
  severity. Curating one mode would encode a resolution the literature has not
  reached.

  The mechanism node is a placeholder. `Loss of Peptidase Activity at
  Myelin-Associated Compartments` is marked HYPOTHETICAL and the edge from it to
  axonal degeneration is typed as having unknown intermediates. Both are
  deliberate: neprilysin deficiency in nerve and axonal loss in nerve are each
  well evidenced, and nothing published connects them. The two most obvious
  candidate mechanisms have been tested and neither held - beta-amyloid
  accumulation is excluded by the absence of dementia and of PET amyloid, and a
  remyelination role is excluded in mouse. Do not curate a substrate as the
  pathogenic one without evidence that it accumulates in affected nerve.

  What is outside the pathograph. The feto-maternal alloimmunisation route to
  antenatal membranous nephropathy is a real and well-established consequence of
  the same genotype, but the disease it causes occurs in the patient's offspring
  and is immune mediated rather than neurological. It is recorded in a discussion
  with its screening implications rather than as a pathophysiology node, so the
  pathograph stays a model of this disease in this patient.

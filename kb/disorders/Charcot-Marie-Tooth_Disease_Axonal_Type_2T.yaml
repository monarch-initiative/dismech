- category: Neurologic
  name: Absence of Dementia and Amyloid Accumulation
  description: >-
    A negative finding that is more informative than most. Neprilysin is one of
    the principal beta-amyloid-degrading enzymes, so the obvious prediction from
    a loss-of-function MME genotype is early-onset Alzheimer disease. It does not
    happen. None of the ten patients in the defining series had dementia, one had
    no excess amyloid on Pittsburgh-compound-B PET, and the independent dominant
    cohort found neither increased amyloid deposition nor increased incidence of
    dementia. The practical consequence is that an MME result should not trigger
    dementia counselling; the biological consequence is that beta-amyloid is
    unlikely to be the substrate whose accumulation drives the neuropathy either.

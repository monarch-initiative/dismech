name: Charcot-Marie-Tooth disease, axonal, type 2T
creation_date: "2026-08-27T00:00:00Z"
description: >-
  Charcot-Marie-Tooth disease type 2T (CMT2T) is an MME-related peripheral axonal neuropathy,
  usually beginning in adulthood with distal weakness, wasting and sensory disturbance. Biallelic
  loss-of-function variants establish the recessive disorder; selected heterozygous variants
  confer age-dependent, incompletely penetrant neuropathy susceptibility in other families.
  Variant interpretation and family segregation remain essential. The spectrum includes subclinical
  sensory abnormalities, motor-predominant presentations and severe walking disability. Neprilysin
  abundance is reduced in patient tissues, and selected variants impair catalytic activity
  in experimental systems. Proposed disturbances of peptide signaling and Schwann cell–axon
  interactions connect this deficiency to axonal injury, but the relevant endogenous substrates
  are unresolved. Neprilysin-null women can also develop maternal alloimmunization causing
  membranous nephropathy in their offspring; that reproductive complication is distinct from
  the neuropathy in the mother.
category: Mendelian
parents:
- hereditary disease
synonyms:
- CMT2T
- AR-CMT2T
- Charcot-Marie-Tooth disease axonal type 2T
- MME-related Charcot-Marie-Tooth disease
- neprilysin deficiency neuropathy

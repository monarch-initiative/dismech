inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic MME variants cause the defining recessive CMT2T phenotype. The original
    Japanese series contained ten affected patients, and segregation was confirmed in independent
    Spanish and Iranian families. Clinical expression is age dependent: the 2021 family follow-up
    included a 41-year-old biallelic woman with no significant neurological symptoms but sensory
    examination and nerve-conduction abnormalities. Complete symptomatic penetrance at every
    age is therefore not asserted. Counseling requires identifying the familial variants before
    predictive or reproductive testing. For two heterozygous parents, Mendelian segregation
    gives a one-in-four probability of a biallelic genotype at each conception; timing and
    severity of expression remain age and allele dependent. The general overview’s asymptomatic-carrier
    assumption is not applied to all MME alleles.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease
      type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified recessive mutations in MME in 10 patients.
    explanation: >-
      The defining recessive series.
  - reference: PMID:35212467
    reference_title: "A nonsense mutation in MME gene associates with autosomal recessive
      late-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was inherited in an autosomal recessive mode and further
      confirmed to co-segregate with the disease phenotype in the family
    explanation: >-
      Independent recessive co-segregation in a separate family.
  - reference: PMID:34480178
    reference_title: "A Novel Mutation of the Membrane Metallo-Endopeptidase Gene Related
      to Late-Onset Hereditary Polyneuropathy: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of the studies show that MME variants can be inherited as both
      fully penetrant autosomal-recessive and incompletely penetrant
      autosomal-dominant traits.
    explanation: >-
      The review summarizes both inheritance modes. Its fully-penetrant wording is not taken
      to establish symptoms at every age: primary family follow-up documents a biallelic woman
      with subclinical findings.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of being affected,
      a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected
      and not a carrier.
    explanation: >-
      This is the general recessive-CMT counseling model for two heterozygous parents. The
      genotype probabilities apply, but the asymptomatic-carrier wording and age-independent
      clinical expression are not assumed for MME, whose single-allele susceptibility varies.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Once the CMT-related pathogenic variant(s) have been identified in an affected family
      member, prenatal and preimplantation genetic testing are possible.
    explanation: >-
      General counseling guidance supports reproductive testing after the familial causal
      variants are established; it does not make uncertain MME variants diagnostic.
- name: Autosomal dominant inheritance with age-related incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Selected heterozygous MME loss-of-function and missense variants segregate with late-onset
    axonal neuropathy in an age-dependent, incompletely penetrant pattern. The 2020 study
    expanded the original 2016 cohort, including its 51 initial patients, and interpreted
    the heterozygous variants as dominantly inherited susceptibility alleles. The Spanish
    study found nonsegregation for tested heterozygous variants, including alternative genetic
    diagnoses in some families. These observations require variant- and family-specific counseling;
    a heterozygous MME finding alone does not establish causation. The 2024 Italian cohort
    included uncertain and likely benign findings, and its cross-sectional severity comparisons
    do not establish a longitudinal progression rate. A heterozygous parent has a 50% probability
    of transmitting that allele to each child; this transmission probability is distinct from
    the uncertain, age-dependent probability of neuropathy after inheriting it.
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked
      to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME mutations segregated in an autosomal-dominant fashion with age-related
      incomplete penetrance and some affected individuals were isolated case
      subjects.
    explanation: >-
      The primary statement of the dominant mode and of its age-related
      incomplete penetrance.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission of MME variants was often consistent with an incompletely
      penetrant autosomal-dominant trait and less frequently with
      autosomal-recessive inheritance.
    explanation: >-
      The expanded cohort supports incompletely penetrant transmission; 51 patients overlapped
      with the original 2016 screening series.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the
      importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This indicates that the heterozygous MME variants may not be fully
      penetrant, or alternatively, that they may be a potential risk factor for
      neuropathy.
    explanation: >-
      The authors interpret the heterozygous findings as incomplete penetrance or susceptibility,
      rather than establishing causation for every variant.
  - reference: PMID:30415211
    reference_title: Characterising the phenotype and mode of inheritance of patients 
      with inherited peripheral neuropathies carrying MME mutations.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and mutations did not segregate with the disease.
    explanation: >-
      The clause refers to tested heterozygous variants in the Spanish series. Nonsegregation
      directly challenges their causal interpretation; phenotypic diversity alone would not
      do so.
  - reference: PMID:30415211
    reference_title: "Characterising the phenotype and mode of inheritance of patients with
      inherited peripheral neuropathies carrying MME mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME mutations that segregate in an autosomal recessive pattern are
      associated with a late-onset CMT2 phenotype, yet we could not demonstrate
      that MME variants in heterozygosis cause neuropathy.
    explanation: >-
      The Spanish authors could not establish heterozygous causation in their families. This
      does not refute every allele in other populations.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® -
      NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with autosomal dominant CMT has a 50% chance of inheriting
      the pathogenic variant.
    explanation: >-
      This general Mendelian transmission statement is not a 50% MME disease-penetrance estimate.
      Variant causality and the family’s inheritance pattern must first be established.
pathophysiology:
- name: MME Loss-of-Function Variant
  description: >-
    Germline biallelic pathogenic MME variants establish recessive disease; selected single
    variants can confer incompletely penetrant neuropathy susceptibility. Molecular effects
    are allele specific: patient RNA demonstrates exon skipping, transfected-cell experiments
    support nonsense-mediated decay and reduced synthetic-substrate cleavage for selected
    alleles, and other stop-gain or missense consequences remain predicted. Normal total lymphocyte
    transcript measurements in three dHMN patients do not exclude allele-specific RNA processing
    or loss of protein in nerve.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  evidence:
  - &id001
    reference: PMID:26991897
    reference_title: Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth 
      disease type 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the MME mutations could be loss-of-function mutations, and we confirmed a lack/decrease
      of NEP protein expression in a peripheral nerve.
    explanation: >-
      The Japanese biallelic cohort included direct sural-nerve protein observations; functional
      consequences of every individual allele were not experimentally established.
  - reference: PMID:31429185
    reference_title: Variants in MME are associated with autosomal-recessive distal 
      hereditary motor neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The sequences of RT‐PCR products revealed aberrantly spliced mRNA lacking exon 13, resulting
      in a loss of 99‐bp fragment (Fig. 3A).
    explanation: >-
      Patient II:2 of the dHMN family B had the c.1416+2T>C splice allele. This is a blood-RNA
      observation in an allelic motor-predominant disorder.
  - reference: PMID:31429185
    reference_title: Variants in MME are associated with autosomal-recessive distal 
      hereditary motor neuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, the HEK293 cells transfected with c.1342C>T mutant contained only about 10%
      MME mRNA compared to that of wild‐type cells (Fig. 3D). Transcript levels could be increased
      after treatment with the translation inhibitor cycloheximide which blocks nonsense‐mediated
      mRNA decay.
    explanation: >-
      The c.1342C>T nonsense-mediated-decay experiment used transfected HEK293 cells, separately
      from the nonsignificant lymphocyte transcript comparison.
  - reference: PMID:35212467
    reference_title: A nonsense mutation in MME gene associates with autosomal recessive
      late-onset Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The identified mutation causes a complete loss of carboxy-terminal region of the NEP
      protein which contains the zinc binding site and the catalytic domain and thus considered
      to be a loss-of-function mutation.
    explanation: >-
      The p.Gln522* consequence was inferred from the stop-gain sequence and protein-domain
      location; this family study did not measure truncated protein or enzymatic activity.

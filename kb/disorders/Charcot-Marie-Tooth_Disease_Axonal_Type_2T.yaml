- name: Blood Neprilysin Level
  notes: >-
    Low circulating neprilysin was observed in selected heterozygous MME cohorts. In the 2020
    analysis, serious-variant samples had a median below detection, but some control samples
    were also below detection and distributions were variable. This is supporting research
    evidence, not a validated standalone pathogenicity or clinical diagnostic assay.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7836667/
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and
      elderly: Focus on MME - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

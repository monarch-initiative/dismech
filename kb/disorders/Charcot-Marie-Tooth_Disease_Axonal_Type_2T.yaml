inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The mode in which the entity was defined. Ten Japanese patients with
    biallelic loss-of-function MME variants were identified by exome sequencing
    of 303 unrelated patients with CMT and screening of 354 more, and the authors
    proposed the name AR-CMT2T on that basis. Independent recessive families have
    since been reported with a nonsense allele co-segregating in a consanguineous
    pedigree, and the four families ascertained through antenatal membranous
    nephropathy are all homozygous or compound heterozygous for truncating
    alleles. In recessive patients the trait is fully penetrant.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified recessive mutations in MME in 10 patients.
    explanation: >-
      The defining recessive series.
  - reference: PMID:35212467
    reference_title: "A nonsense mutation in MME gene associates with autosomal recessive late-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation was inherited in an autosomal recessive mode and further
      confirmed to co-segregate with the disease phenotype in the family
    explanation: >-
      Independent recessive co-segregation in a separate family.
  - reference: PMID:34480178
    reference_title: "A Novel Mutation of the Membrane Metallo-Endopeptidase Gene Related to Late-Onset Hereditary Polyneuropathy: Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of the studies show that MME variants can be inherited as both
      fully penetrant autosomal-recessive and incompletely penetrant
      autosomal-dominant traits.
    explanation: >-
      A systematic review's summary of both modes, which is why this entry
      curates two inheritance blocks rather than choosing one.
- name: Autosomal dominant inheritance with age-related incomplete penetrance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous rare loss-of-function and missense MME variants were found in 19
    index subjects with late-onset axonal polyneuropathy and segregated in a
    dominant fashion with age-related incomplete penetrance, some carriers
    presenting as isolated cases. A subsequent 230-patient study of unexplained
    late-onset axonal neuropathy found transmission more often consistent with an
    incompletely penetrant dominant trait than with a recessive one.

    This entry curates the dominant mode alongside the recessive one rather than
    choosing between them, because the choice is not settled and the two are not
    trivially reconcilable. It is tempting to read heterozygous carriers as
    simply having a milder allele dose, but a 32-patient Italian series found
    biallelic and monoallelic patients had comparable severity overall and
    differed only in onset age and in rate of progression once ten years had
    elapsed. The same series raises a third possibility that is not a mode of
    inheritance at all - that heterozygous variants are a risk factor for
    late-onset neuropathy rather than a monogenic cause.
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MME mutations segregated in an autosomal-dominant fashion with age-related
      incomplete penetrance and some affected individuals were isolated case
      subjects.
    explanation: >-
      The primary statement of the dominant mode and of its age-related
      incomplete penetrance.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Transmission of MME variants was often consistent with an incompletely
      penetrant autosomal-dominant trait and less frequently with
      autosomal-recessive inheritance.
    explanation: >-
      Independent cohort in which dominant transmission was the commoner pattern.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This indicates that the heterozygous MME variants may not be fully
      penetrant, or alternatively, that they may be a potential risk factor for
      neuropathy.
    explanation: >-
      Curated as PARTIAL because the source offers a genuine alternative to
      dominant inheritance - susceptibility rather than causation - which this
      entry does not resolve.
pathophysiology:
- name: MME Loss-of-Function Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  description: >-
    The initiating lesion is a loss-of-function variant in MME, present either
    biallelically or in the heterozygous state. Nonsense, frameshift, splice and
    missense alleles have all been reported, and they converge functionally
    rather than structurally: nonsense alleles are degraded by nonsense-mediated
    decay, a splice variant skips exon 13, and the missense alleles impair
    catalysis. One recurrent truncating allele, c.466delC
    (p.Pro156Leufs*14), is shared across four unrelated European families.
    Transcript levels in lymphocytes were unchanged between patients and
    controls, so the defect is not detectable as reduced message in an accessible
    tissue.
  genes:
  - preferred_term: MME
    term:
      id: hgnc:7154
      label: MME
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Germline loss of function. Zygosity is deliberately left unset here because
      it is the contested variable of this disorder: biallelic in the defining
      recessive series and in the alloimmunisation families, heterozygous in the
      dominant cohorts. Setting a single value would encode one side of an
      unresolved question.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the MME mutations could be loss-of-function mutations, and we confirmed
      a lack/decrease of NEP protein expression in a peripheral nerve.
    explanation: >-
      Establishes loss of function and confirms it at the protein level in the
      affected tissue.
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The splice site variant c.1416+2T>C results in skipping of exon 13. The
      stop variant c.1342C>T induces mRNA degradation via nonsense-mediated mRNA
      decay.
    explanation: >-
      Demonstrates two distinct molecular routes to loss of function for two
      different allele classes.
  - reference: PMID:35212467
    reference_title: "A nonsense mutation in MME gene associates with autosomal recessive late-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified mutation causes a complete loss of carboxy-terminal region
      of the NEP protein which contains the zinc binding site and the catalytic
      domain and thus considered to be a loss-of-function mutation.
    explanation: >-
      Ties a truncating allele to loss of the catalytic machinery specifically.
  downstream:
  - target: Neprilysin Deficiency in Peripheral Nerve
    causal_link_type: DIRECT
- name: Neprilysin Deficiency in Peripheral Nerve
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The functional consequence, and the step that is best evidenced in patients.
    Neprilysin protein is absent or reduced in peripheral nerve, tissue
    availability of the enzyme is strongly decreased, and measured enzymatic
    activity is significantly impaired. Blood neprilysin levels are low in
    carriers, which is why the enzyme doubles as a biomarker. Notably, the
    reduction was described as mild in sural nerve in one series while enzymatic
    activity was significantly impaired, so the deficit is better characterised
    as catalytic than as a simple absence of protein.
  molecular_functions:
  - preferred_term: neprilysin metalloendopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  evidence:
  - reference: PMID:27588448
    reference_title: "Rare Variants in MME, Encoding Metalloprotease Neprilysin, Are Linked to Late-Onset Autosomal-Dominant Axonal Polyneuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found that MME mutations resulted in strongly decreased tissue
      availability of neprilysin and impaired enzymatic activity.
    explanation: >-
      Establishes both reduced protein availability and impaired catalysis in
      patient tissue.
  - reference: PMID:31429185
    reference_title: "Variants in MME are associated with autosomal-recessive distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified that MME variants were associated with mild decrease in
      protein expression in the sural nerve and significant impairments of
      enzymatic activity.
    explanation: >-
      The dissociation that makes this a catalytic rather than an abundance
      deficit: protein down only mildly, activity down significantly.
  - reference: PMID:33144514
    reference_title: "The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus on MME."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      retrieval of additional late-onset neuropathy patients with MME variants
      from WES repositories, and low neprilysin levels in patients' blood samples
    explanation: >-
      Establishes low circulating neprilysin as a measurable correlate in
      patients.
  downstream:
  - target: Loss of Peptidase Activity at Myelin-Associated Compartments
    causal_link_type: DIRECT
- name: Loss of Peptidase Activity at Myelin-Associated Compartments
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    This node is where the mechanism stops being known. In peripheral nerve,
    neprilysin is not distributed uniformly: it is absent from central nervous
    system myelin but expressed at the inner and outer border of myelinated
    fibres, in the Schmidt-Lanterman clefts and at the paranodes - the
    non-compact myelin compartments where Schwann cell and axon exchange signals.
    Its expression is upregulated in sciatic nerve during the myelination window
    and downregulated after nerve cut. Those facts make a role in axon-glia
    signalling plausible.

    What is missing is the substrate. Neprilysin hydrolyses enkephalins,
    substance P, beta-amyloid, gastrin, somatostatin, atrial natriuretic peptide,
    angiotensin II and endothelin-1 among others, and no study has shown which -
    if any - accumulates to a damaging level in the nerve of a patient. The
    authors of the alloimmunisation series state the position plainly: unlike the
    kidney disease, which is immune mediated and understood, the pathophysiology
    of the neuropathy is unknown. This node is therefore HYPOTHETICAL and is a
    placeholder for a mechanism, not a description of one.
  molecular_functions:
  - preferred_term: peptide hydrolysis by neprilysin
    modifier: DECREASED
    term:
      id: GO:0008233
      label: peptidase activity
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  evidence:
  - reference: PMID:31339187
    reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cadoni et al. (1993) reported that MME was absent in the CNS myelin but
      expressed in the inner and outer border of myelinated fibers in the PNS, in
      the Schmidt‐Lantermann clefts and in the paranodal regions.
    explanation: >-
      Localises neprilysin to the non-compact myelin compartments of peripheral
      nerve, which is the anatomical basis for expecting an axon-glia role.
  - reference: PMID:31339187
    reference_title: "Membrane metallo-endopeptidase is dispensable for repair after nerve injury."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MME expression was found to be upregulated in the sciatic nerve between E18
      and P12 and down‐regulated after nerve cut
    explanation: >-
      Times neprilysin expression to peripheral myelination, supporting a
      myelination-related function.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, contrary to the glomerular disease, which is immune mediated, the
      pathophysiology of the neuropathy is unknown.
    explanation: >-
      The explicit statement that the neuropathy mechanism is unknown, which is
      why this node is HYPOTHETICAL.
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neprilysin/MME is a highly glycosylated protein able to hydrolyze numerous
      physiologically active peptides like enkephalins, P-substance, β-amyloid,
      gastrin, somatostatin, atrial natriuretic peptide, angiotensin II, and
      endothelin-1.
    explanation: >-
      Enumerates the substrate range, which is the reason no single accumulating
      peptide has been identified as the pathogenic one.
  downstream:
  - target: Length-Dependent Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Typed as having unknown intermediates because that is literally the state
      of the evidence: neprilysin deficiency is established in patient nerve and
      axonal degeneration is established in patient nerve, and nothing published
      connects them.
    evidence:
    - reference: PMID:34307994
      reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, contrary to the glomerular disease, which is immune mediated, the
        pathophysiology of the neuropathy is unknown.
      explanation: >-
        States that the intervening mechanism is unknown, which is what this edge
        type records.
  - target: Predisposition to Superimposed Inflammatory Demyelinating Neuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Length-Dependent Axonal Degeneration
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    The tissue lesion is axonal degeneration in a length-dependent distribution.
    Sural nerve from an affected patient shows focally diminished myelinated
    fibre density, axonal clusters of regenerating axons within single Schwann
    cells, and skinny axons with redundant myelin loops - the picture of repeated
    degeneration and regeneration rather than of a primary myelin defect.
    Electrodiagnostically this is impaired motor and sensory conduction, worse in
    the lower limbs than the upper.
  cell_types:
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  evidence:
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showing 2 axonal clusters (arrows) with respectively 3 and 5 regenerating
      axons in 2 adjacent Schwann cells. Myelin fiber density is focally
      diminished.
    explanation: >-
      Histological evidence of axonal loss with regeneration in patient sural
      nerve.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe a relatively mild axonal sensory-motor neuropathy with a greater
      impairment of the lower extremities.
    explanation: >-
      Establishes the axonal character and the lower-limb predominance across a
      32-patient series.
  downstream:
  - target: Late-Onset Axonal Sensorimotor Polyneuropathy
    causal_link_type: DIRECT
- name: Predisposition to Superimposed Inflammatory Demyelinating Neuropathy
  biological_scale: TISSUE
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A single but clinically consequential observation. A homozygous MME patient
    with AR-CMT2T developed electrophysiological demyelinating changes and a
    biopsy showing endoneurial oedema with thinly myelinated fibres unevenly
    distributed within and between fascicles - a pattern that is inflammatory
    rather than genetic - and improved rapidly on immunoglobulin. The reporting
    authors propose that neprilysin loss makes the myelin sheath fragile and
    thereby triggers an immune response against peripheral myelin.

    Curated despite resting on one patient because it changes management: an
    MME-positive patient whose course accelerates or whose conduction slows may
    have a treatable superimposed neuropathy, and the alternative reading -
    attributing the deterioration to the genetic disease - forecloses that. It is
    HYPOTHETICAL, and the proposed mechanism is the authors' own hypothesis, not
    a demonstrated one.
  evidence:
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that AR-CMT2T caused by MME mutation predisposes to a
      superimposed inflammatory demyelinating neuropathy.
    explanation: >-
      The authors' conclusion, which is the claim this node records.
  - reference: PMID:28855494
    reference_title: "[Charcot-Marie-Tooth disease type 2 caused by homozygous MME gene mutation superimposed by chronic inflammatory demyelinating polyneuropathy]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fragility of myelin sheath due to mutated neprilysin may trigger the
      detrimental immune response against peripheral myelin in this patient.
    explanation: >-
      Curated as PARTIAL because the proposed mechanism is explicitly hedged by
      the authors and rests on a single patient.
  downstream:
  - target: Late-Onset Axonal Sensorimotor Polyneuropathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Late-Onset Axonal Sensorimotor Polyneuropathy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  description: >-
    The clinical endpoint: a slowly progressive, relatively mild, distal
    sensorimotor axonal polyneuropathy with onset typically in the fifth to sixth
    decade. Patients present with lower-limb weakness, atrophy and sensory
    disturbance, and unsteady gait. Because onset is late and family history is
    often absent, the presentation is indistinguishable on clinical grounds from
    the common acquired axonal neuropathies of the elderly, which is why MME is
    the leading gene found when those patients are sequenced.
  evidence:
  - reference: PMID:26991897
    reference_title: "Mutations in MME cause an autosomal-recessive Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They showed muscle weakness, atrophy, and sensory disturbance in the lower
      extremities.
    explanation: >-
      The clinical picture in the defining series.
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CM2T has been definitively defined as a late-onset neuropathy, with a
      typical onset in the fifth to sixth decades of life and a more rapidly
      progressing worsening for biallelic patients.
    explanation: >-
      Dates onset and records the one severity difference the series found
      between biallelic and monoallelic patients.
phenotypes:
- category: Neurologic
  name: Axonal Sensorimotor Polyneuropathy
  description: >-
    The defining feature: a length-dependent axonal sensorimotor polyneuropathy,
    relatively mild in most patients, with the lower limbs more affected than the
    upper. Nerve conduction studies show impaired motor and sensory conduction;
    sural nerve biopsy shows axonal loss with regenerative clusters.
  phenotype_term:
    preferred_term: Peripheral axonal neuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:39251209
    reference_title: "Clinical and genetic features of CMT2T in Italian patients confirm the importance of MME pathogenic variants in idiopathic, late-onset axonal neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observe a relatively mild axonal sensory-motor neuropathy with a greater
      impairment of the lower extremities.
    explanation: >-
      Establishes the character, severity and distribution across 32 patients.
- category: Neurologic
  name: Late Onset in the Fifth to Sixth Decade
  description: >-
    Onset in the fifth to sixth decade is the single most distinctive feature of
    CMT2T and the reason it is misclassified as an acquired neuropathy. In the
    families ascertained through antenatal membranous nephropathy the point is
    made unusually sharply: the neprilysin-deficient women were healthy at 18 to
    24 years with no renal or neurological findings, and only more than a decade
    later did all of them develop progressive length-dependent polyneuropathy.
  phenotype_term:
    preferred_term: Middle-age onset
    onset:
      onset_category: MIDDLE_AGE
  notes: >-
    No `term:` is bound here. The natural HPO term, HP:0003581 Adult onset, sits
    under Clinical modifier rather than Phenotypic abnormality and so falls
    outside the `PhenotypeTerm` dynamic enum, which is reachable only from the
    phenotypic-abnormality root. The onset is carried by the structured `onset`
    descriptor instead, which is the slot the schema provides for it.
  evidence:
  - reference: PMID:34307994
    reference_title: "Antenatal Membranous Nephropathy and Type 2 (Axonal) Charcot-Marie-Tooth With Mutations in the Metallo-Membrane Endopeptidase Gene: A Call for Family Screening and Pharmacovigilance."

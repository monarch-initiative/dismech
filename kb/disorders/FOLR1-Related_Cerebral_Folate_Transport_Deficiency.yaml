differential_diagnoses:
- name: Hereditary folate malabsorption (SLC46A1/PCFT deficiency)
  description: >-
    Hereditary folate malabsorption is caused by biallelic SLC46A1 (proton-coupled
    folate transporter, PCFT) variants and causes systemic folate deficiency with
    megaloblastic anemia in addition to low CSF folate, distinguishing it from the
    brain-specific, hematologically normal FOLR1-CFTD. It is distinguished by
    molecular testing.
  distinguishing_features:
  - Systemic folate deficiency and megaloblastic anemia favor SLC46A1/PCFT hereditary folate malabsorption.
  - Normal systemic folate with isolated low CSF folate favors FOLR1-CFTD.
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least five distinct inherited disorders of folate transport and
      metabolism are presently known, all of which cause systemic folate
      deficiency.
    explanation: >-
      Contrasts the systemic folate-deficiency disorders with the brain-specific
      FOLR1 defect.
- name: Dihydrofolate reductase (DHFR) deficiency
  description: >-
    DHFR deficiency is a distinct autosomal recessive inborn error of folate
    metabolism (different gene, DHFR) that also lowers CSF folate but characteristically
    causes megaloblastic anemia; it is distinguished by gene testing.
  distinguishing_features:
  - Megaloblastic anemia with a DHFR variant favors DHFR deficiency.
  - A biallelic FOLR1 variant with normal hematology favors FOLR1-CFTD.
- name: Folate receptor alpha autoantibody cerebral folate deficiency
  description: >-
    Acquired cerebral folate deficiency due to blocking autoantibodies against
    folate receptor alpha produces a biochemically similar low CSF 5-MTHF but is
    not caused by FOLR1 variants and is diagnosed by autoantibody testing rather
    than molecular genetics.
  distinguishing_features:
  - FRalpha blocking autoantibodies with normal FOLR1 sequence favor autoantibody-mediated cerebral folate deficiency.
  - Biallelic pathogenic FOLR1 variants favor FOLR1-CFTD.
progression:
- phase: Late-infantile onset and progressive neurodegeneration
  age_range: Typically after the first year of life
  notes: >-

- phase: Response to folinic acid therapy
  age_range: After treatment initiation
  notes: >-
    Folinic acid restores CSF folate and biochemical markers and can precede and
    drive clinical improvement, with the greatest benefit when treatment starts
    early; later treatment may be less effective.
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF folate concentrations, as well as glial choline and inositol depletion,
      were restored by folinic acid therapy and preceded clinical improvements.
    explanation: >-
      Documents biochemical and clinical improvement with folinic acid.
treatments:
- name: High-dose folinic acid (leucovorin)
  description: >-
    Disease-specific therapy is high-dose folinic acid (5-formyltetrahydrofolate,
    also called leucovorin), which bypasses the FRalpha transport block and
    restores CSF folate into the normal range. Oral high-dose therapy is usually
    sufficient, with intramuscular or intermittent intravenous dosing as
    alternatives, and CSF folate is monitored to confirm adequacy. Benefit is
    greatest when started early; presymptomatic treatment of affected sibs can
    prevent or markedly mitigate disease. Plain folic acid is avoided because it
    binds FRalpha tightly and may interfere with any residual receptor function.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: CNS hypomyelination
    term:
      id: HP:0003429
      label: CNS hypomyelination
  - preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with 5-formyltetrahydrofolate (5-formylTHF; also known as folinic
      acid or leucovorin) can result in substantial improvement in neurologic
      findings, particularly when started at a young age.
    explanation: >-
      GeneReviews establishes folinic acid as the disease-specific therapy with
      early-treatment benefit.
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid is not used to treat FOLR1-CFTD because folic acid binds tightly
      to FOLR1, possibly interfering with FOLR1 function, which is a concern when
      treating individuals who may have residual FOLR1 activity.
    explanation: >-
      Captures the folic-acid caveat: plain folic acid is avoided in favor of
      folinic acid.

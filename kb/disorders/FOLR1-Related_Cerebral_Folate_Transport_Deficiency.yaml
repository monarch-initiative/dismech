biochemical:
- name: Cerebrospinal fluid 5-methyltetrahydrofolate (5-MTHF)
  presence: DECREASED
  context: >-
    Severely reduced CSF 5-MTHF in the setting of normal serum/systemic folate is
    the defining biochemical signature of cerebral folate deficiency and the key
    diagnostic finding in FOLR1-CFTD. Because the defect is brain-specific (a
    blood-CSF transport block rather than a systemic folate deficiency),
    peripheral folate indices are typically normal, so the diagnosis requires
    direct CSF folate measurement by lumbar puncture.
  evidence:
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened 72 children with low 5-methyltetrahydrofolate concentrations in
      the cerebrospinal fluid and neurological symptoms that developed after
      infancy.
    explanation: >-
      Low CSF 5-MTHF is the biochemical entry criterion for the FOLR1 cohort.
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified an inherited brain-specific folate transport defect
    explanation: >-
      The brain-specific nature of the defect explains low CSF folate with normal
      systemic folate.
genetic:
- name: FOLR1 loss-of-function variants
  gene_term:
    preferred_term: FOLR1
    term:
      id: hgnc:3791
      label: FOLR1
  association: Disease-causing
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic pathogenic FOLR1 variants (missense, splice-site, and other
    loss-of-function alleles) cause FOLR1-CFTD. Missense alleles are expressed but
    fail to reach the cell surface, so all characterized variants converge on
    functional loss of folate receptor alpha.
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      caused by mutations in the folate receptor 1 (FOLR1) gene coding for folate
      receptor alpha (FRalpha).
    explanation: >-
      FOLR1 is the causative gene encoding folate receptor alpha.
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results explain the functional loss of folate receptor alpha for all
      detected folate receptor 1 mutations.
    explanation: >-
      Functional studies show all detected FOLR1 variants cause loss of FRalpha
      function.

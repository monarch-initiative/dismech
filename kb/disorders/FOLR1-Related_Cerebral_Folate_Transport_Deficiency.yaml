prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Only a few dozen individuals have been reported worldwide since
    the disorder was first delineated in 2009; the true prevalence is unknown and
    the condition is likely underdiagnosed because of its treatable, initially
    asymptomatic course.
pathophysiology:
- name: FOLR1 Biallelic Loss of Function and Folate Receptor Alpha Deficiency
  description: >-
    Biallelic loss-of-function variants in FOLR1 abolish functional folate
    receptor alpha (FRalpha), a GPI-anchored high-affinity folate-binding
    receptor highly expressed at the apical surface of choroid-plexus epithelium.
    Missense variants are expressed but mislocalize away from the cell surface,
    eliminating cellular folate binding, so both truncating and missense alleles
    converge on functional FRalpha loss at the blood-CSF barrier.
  role: trigger
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  molecular_functions:
  - preferred_term: folic acid receptor activity
    term:
      id: GO:0061714
      label: folic acid receptor activity
    modifier: DECREASED
  locations:
  - preferred_term: choroid plexus
    term:
      id: UBERON:0001886
      label: choroid plexus
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified an inherited brain-specific folate transport defect that is
      caused by mutations in the folate receptor 1 (FOLR1) gene coding for folate
      receptor alpha (FRalpha).
    explanation: >-
      Establishes biallelic FOLR1 defect and loss of FRalpha as the molecular
      cause of this brain-specific folate transport disorder.
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Heterologous expression of the missense mutations, including previously
      described mutants, revealed minor decrease in protein expression but loss of
      cell surface localization, mistargeting to intracellular compartments and
      thus absence of cellular binding of folic acid.
    explanation: >-
      Shows FOLR1 missense variants abolish surface FRalpha and folate binding,
      the functional loss modeled by this trigger node.
  downstream:
  - target: Impaired Folate Transport Across the Blood-CSF Barrier and Low CSF 5-MTHF
    causal_link_type: DIRECT
- name: Impaired Folate Transport Across the Blood-CSF Barrier and Low CSF 5-MTHF
  description: >-
    FRalpha-mediated transcytosis moves 5-methyltetrahydrofolate from blood
    across the choroid-plexus epithelium into the cerebrospinal fluid. Loss of
    FRalpha blocks this blood-CSF folate transport, producing a severe isolated
    reduction of CSF 5-MTHF while serum/systemic folate remains normal, the
    biochemical hallmark of cerebral folate deficiency.
  role: intermediate
  cell_types:
  - preferred_term: choroid plexus epithelial cell
    term:
      id: CL:0000706
      label: choroid plexus epithelial cell
  biological_processes:
  - preferred_term: folate transmembrane transport
    term:
      id: GO:0098838
      label: folate transmembrane transport
    modifier: DECREASED
  evidence:
  - reference: PMID:23828504
    reference_title: "Choroid plexus transcytosis and exosome shuttling deliver folate into brain parenchyma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To clarify the mechanism of cerebral folate transport at the
      blood-cerebrospinal fluid barrier, we investigate the transport of
      5-methyltetrahydrofolate in polarized cells.
    explanation: >-
      Identifies FRalpha-dependent 5-MTHF transport at the blood-CSF barrier, the
      step abolished by FRalpha loss.
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients carrying FOLR1 mutations developed progressive movement
      disturbance, psychomotor decline, and epilepsy and showed severely reduced
      folate concentrations in the cerebrospinal fluid (CSF).
    explanation: >-
      Documents severely reduced CSF folate in patients with FOLR1 variants.
  downstream:
  - target: Deficient CNS One-Carbon Metabolism
    causal_link_type: DIRECT
- name: Deficient CNS One-Carbon Metabolism
  description: >-
    Low CNS folate starves brain one-carbon metabolism, impairing the
    folate-dependent methylation cycle (S-adenosylmethionine-dependent
    methylation of DNA, proteins, phospholipids, and myelin components) and
    monoamine neurotransmitter metabolism. MR spectroscopy in patients shows
    combined white-matter choline and inositol depletion, reflecting disturbed
    membrane and myelin-lipid methylation.
  role: intermediate
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: one-carbon metabolic process
    term:
      id: GO:0006730
      label: one-carbon metabolic process
    modifier: DECREASED
  - preferred_term: methylation
    term:
      id: GO:0032259
      label: methylation
    modifier: DECREASED
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging (MRI) demonstrated profound
      hypomyelination, and MR-based in vivo metabolite analysis indicated a
      combined depletion of white-matter choline and inositol.
    explanation: >-
      White-matter choline and inositol depletion reflects disturbed
      folate-dependent one-carbon/methylation metabolism in the brain.
  downstream:
  - target: Hypomyelination and Neurodegeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Deficient methylation and myelin-lipid synthesis in the developing brain.
- name: Hypomyelination and Neurodegeneration
  description: >-
    Sustained CNS folate and methylation deficiency during the period of
    postnatal myelination causes profound cerebral hypomyelination and
    progressive neurodegeneration with cerebellar atrophy. Clinically this drives
    the late-infantile onset syndrome of seizures, psychomotor regression,
    ataxia, and movement disorder that can progress to immobility if untreated.
  role: outcome
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    term:
      id: GO:0042552
      label: myelination
    modifier: DECREASED
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  evidence:
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified nucleotide alterations in the folate receptor 1 gene in 10
      individuals who shared developmental regression, ataxia, profound cerebral
      hypomyelination and cerebellar atrophy.
    explanation: >-
      Links FOLR1 loss to the shared clinical-radiologic outcome of regression,
      ataxia, hypomyelination, and cerebellar atrophy.
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with untreated FOLR1-CFTD have very low cerebrospinal fluid
      (CSF) levels and progressive neurologic deterioration with developmental
      delays and progressive cognitive impairment, behavioral issues, seizures,
      and movement disorders that may progress to immobility.
    explanation: >-
      Describes the progressive neurodegenerative outcome of untreated disease.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      children with low 5-methyltetrahydrofolate concentrations in the
      cerebrospinal fluid
    explanation: >-
      CSF 5-MTHF measurement is the biochemical screen used to ascertain cases.

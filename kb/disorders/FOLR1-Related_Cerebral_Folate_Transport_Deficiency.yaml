- name: CSF folate surveillance monitoring
  description: >-
    For individuals on 5-formyltetrahydrofolate therapy, CSF folate is monitored
    to confirm an adequate therapeutic dose: repeat CSF folate after treatment
    initiation, repeat with clinical change (developmental regression, new
    neurologic findings, seizures) or adherence concerns, and, optimally and if
    feasible, yearly CSF folate levels until age five years.

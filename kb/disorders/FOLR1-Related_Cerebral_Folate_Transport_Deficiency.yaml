treatments:
- name: High-dose folinic acid (leucovorin)
  description: >-
    Disease-specific therapy is high-dose folinic acid (5-formyltetrahydrofolate,
    also called leucovorin), which bypasses the FRalpha transport block and
    restores CSF folate into the normal range. Oral high-dose therapy is usually
    sufficient (a reported oral dose is 5.2 mg/kg/day), with intramuscular or
    intermittent intravenous dosing as alternatives, and CSF folate is monitored
    to confirm adequacy. Benefit is greatest when started early; presymptomatic
    treatment of affected sibs can prevent or markedly mitigate disease. Plain
    folic acid is avoided because it binds FRalpha tightly and may interfere with
    any residual receptor function.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  - preferred_term: CNS hypomyelination
    term:
      id: HP:0003429
      label: CNS hypomyelination
  - preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  target_mechanisms:
  - target: Impaired Folate Transport Across the Blood-CSF Barrier and Low CSF 5-MTHF
    treatment_effect: BYPASSES
    description: >-
      Folinic acid (5-formyltetrahydrofolate) is a reduced folate that enters the
      CNS independently of folate receptor alpha, bypassing the blocked
      FRalpha-mediated blood-CSF folate transport step and restoring CSF folate.
  evidence:
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with 5-formyltetrahydrofolate (5-formylTHF; also known as folinic
      acid or leucovorin) can result in substantial improvement in neurologic
      findings, particularly when started at a young age.
    explanation: >-
      GeneReviews establishes folinic acid as the disease-specific therapy with
      early-treatment benefit.
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid is not used to treat FOLR1-CFTD because folic acid binds tightly
      to FOLR1, possibly interfering with FOLR1 function, which is a concern when
      treating individuals who may have residual FOLR1 activity.
    explanation: >-
      Captures the folic-acid caveat: plain folic acid is avoided in favor of
      folinic acid.
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      restored by folinic acid therapy and preceded clinical improvements.
    explanation: >-
      Original description shows folinic acid restores CSF folate ahead of
      clinical improvement.
  - reference: PMID:40218241
    reference_title: "A Clinical and Genetic Evaluation of Cases with Folate Receptor α Gene Mutation: A Case Series from Türkiye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with folinic acid at a dose of 5.2 mg/kg/day of PO was started at
      the age of 9.8 years on average, and intravenous folinate was started at
      different doses.
    explanation: >-
      Case series reports a concrete oral folinic acid dose of 5.2 mg/kg/day.
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of asymptomatic or mildly symptomatic younger sibs at the time of
      diagnosis of their older sibs can prevent or markedly mitigate the

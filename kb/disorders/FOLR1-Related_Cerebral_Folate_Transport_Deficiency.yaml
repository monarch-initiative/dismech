discussions:
- discussion_id: gap_folr1_treatment_response_determinants
  prompt: >-
    What determines the degree and reversibility of neurologic recovery after
    folinic acid treatment in FOLR1-CFTD, and why do some deficits (particularly
    established hypomyelination and cognitive impairment) fail to reverse when
    treatment is started late despite normalization of CSF folate?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hypomyelination and Neurodegeneration
  - treatments#High-dose folinic acid (leucovorin)
  rationale: >-
    FOLR1-CFTD is a treatable disorder in which folinic acid can restore CSF
    folate and drive clinical improvement, yet clinical severity does not
    correlate cleanly with residual FRalpha function, and later-treated
    individuals may retain irreversible deficits. The determinants of treatment
    response, the therapeutic window relative to the postnatal myelination
    period, and whether irreversible deficits reflect a fixed developmental
    myelination defect versus ongoing correctable metabolic dysfunction remain
    unresolved, and are central to the case for early or newborn-screening-based
    diagnosis.
  evidence:
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      different clinical severities do not necessarily correlate with residual
      function of folate receptor alpha mutants and indicate that additional
      factors contribute to the clinical phenotype in cerebral folate transport
      deficiency.
    explanation: >-
      Documents that clinical severity is not explained by residual FRalpha
      function alone, motivating the open question about response determinants.

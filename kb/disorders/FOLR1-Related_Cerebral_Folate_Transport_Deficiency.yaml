differential_diagnoses:
- name: Hereditary folate malabsorption (SLC46A1/PCFT deficiency)
  description: >-
    Hereditary folate malabsorption is caused by biallelic SLC46A1 (proton-coupled
    folate transporter, PCFT) variants and causes systemic folate deficiency with
    megaloblastic anemia in addition to low CSF folate, distinguishing it from the
    brain-specific, hematologically normal FOLR1-CFTD. It is distinguished by
    molecular testing.
  distinguishing_features:
  - Systemic folate deficiency and megaloblastic anemia favor SLC46A1/PCFT hereditary folate malabsorption.
  - Normal systemic folate with isolated low CSF folate favors FOLR1-CFTD.
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least five distinct inherited disorders of folate transport and
      metabolism are presently known, all of which cause systemic folate
      deficiency.
    explanation: >-
      Contrasts the systemic folate-deficiency disorders with the brain-specific
      FOLR1 defect.
- name: Dihydrofolate reductase (DHFR) deficiency
  description: >-
    DHFR deficiency is a distinct autosomal recessive inborn error of folate
    metabolism (different gene, DHFR) that also lowers CSF folate but characteristically
    causes megaloblastic anemia; it is distinguished by gene testing.
  distinguishing_features:
  - Megaloblastic anemia with a DHFR variant favors DHFR deficiency.
  - A biallelic FOLR1 variant with normal hematology favors FOLR1-CFTD.
  evidence:
  - reference: PMID:21310276
    reference_title: "Identification and characterization of an inborn error of metabolism caused by dihydrofolate reductase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe three individuals from two families with a recessive inborn
      error of metabolism, characterized by megaloblastic anemia and/or
      pancytopenia, severe cerebral folate deficiency, and cerebral
      tetrahydrobiopterin deficiency due to a germline missense mutation in DHFR,
      resulting in profound enzyme deficiency.
    explanation: >-
      DHFR deficiency lowers cerebral folate but is distinguished from FOLR1-CFTD
      by megaloblastic anemia/pancytopenia and a DHFR mutation.
- name: Folate receptor alpha autoantibody cerebral folate deficiency
  description: >-
    Acquired cerebral folate deficiency due to blocking autoantibodies against
    folate receptor alpha produces a biochemically similar low CSF 5-MTHF but is
    not caused by FOLR1 variants and is diagnosed by autoantibody testing rather
    than molecular genetics.
  distinguishing_features:
  - FRalpha blocking autoantibodies with normal FOLR1 sequence favor autoantibody-mediated cerebral folate deficiency.
  - Biallelic pathogenic FOLR1 variants favor FOLR1-CFTD.
  evidence:
  - reference: PMID:15888699
    reference_title: "Autoantibodies to folate receptors in the cerebral folate deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum from 25 of the 28 patients and 0 of 28 control subjects contained
      high-affinity blocking autoantibodies against membrane-bound folate
      receptors that are present on the choroid plexus.
    explanation: >-
      Blocking autoantibodies against choroid-plexus folate receptors define the
      acquired autoantibody-mediated mimic that has normal FOLR1.
  - reference: PMID:15888699
    reference_title: "Autoantibodies to folate receptors in the cerebral folate deficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebral folate deficiency is a disorder in which autoantibodies can prevent
      the transfer of folate from the plasma to the cerebrospinal fluid.
    explanation: >-
      Establishes the autoantibody mechanism blocking blood-to-CSF folate
      transfer, biochemically mimicking FOLR1-CFTD without an FOLR1 variant.
progression:
- phase: Late-infantile onset and progressive neurodegeneration
  age_range: Typically after the first year of life
  notes: >-
    After a relatively normal early infancy, affected children develop
    progressive movement disturbance, psychomotor regression, ataxia, and
    epilepsy with a late-infantile onset.
  evidence:
  - reference: PMID:22586289
    reference_title: "Molecular characterization of folate receptor 1 mutations delineates cerebral folate transport deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This genetic defect gives rise to a progressive neurological disorder with
      late infantile onset.
    explanation: >-
      Establishes the late-infantile onset and progressive course.
- phase: Response to folinic acid therapy
  age_range: After treatment initiation
  notes: >-
    FOLR1-CFTD is treatable and its course can be reversed or stabilized:
    folinic acid restores CSF folate and biochemical markers and can precede and
    drive substantial clinical improvement, with the greatest benefit when
    treatment starts early. Because of the asymptomatic early period, diagnosis
    is often delayed and treatment started after symptom onset may be less
    effective.
  evidence:
  - reference: PMID:19732866
    reference_title: "Folate receptor alpha defect causes cerebral folate transport deficiency: a treatable neurodegenerative disorder associated with disturbed myelin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF folate concentrations, as well as glial choline and inositol depletion,
      were restored by folinic acid therapy and preceded clinical improvements.
    explanation: >-
      Documents biochemical and clinical improvement with folinic acid.
  - reference: PMID:38224559
    reference_title: "FOLR1-Related Cerebral Folate Transport Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with 5-formyltetrahydrofolate (5-formylTHF; also known as folinic
      acid or leucovorin) can result in substantial improvement in neurologic
      findings, particularly when started at a young age.
    explanation: >-
      GeneReviews states treatment can substantially improve neurologic findings,
      especially when started early.
  - reference: PMID:40218241
    reference_title: "A Clinical and Genetic Evaluation of Cases with Folate Receptor α Gene Mutation: A Case Series from Türkiye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to an asymptomatic early period, CFD diagnosis may be delayed, and
      treatment after symptom onset may be less effective.
    explanation: >-
      Case series notes delayed diagnosis and reduced efficacy of treatment
      started after symptom onset, underscoring the reversibility window.
- phase: Long-term survival despite neurologic disability
  age_range: Untreated natural history
  notes: >-
    Despite the incapacitating neurologic findings of untreated disease,
    affected individuals can survive well into adulthood, a clinically important
    and counterintuitive prognosis for a disorder classified as
    neurodegenerative.
  evidence:

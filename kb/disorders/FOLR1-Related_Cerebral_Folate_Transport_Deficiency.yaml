name: FOLR1-Related Cerebral Folate Transport Deficiency
category: Mendelian
creation_date: '2026-07-25T00:00:00Z'
synonyms:
- Cerebral folate transport deficiency
- Neurodegeneration due to cerebral folate transport deficiency
- FOLR1-CFTD
- Cerebral folate deficiency, FOLR1-related
description: >-
  FOLR1-related cerebral folate transport deficiency is an autosomal recessive,
  treatable metabolic epilepsy caused by biallelic loss-of-function variants in
  FOLR1, which encodes folate receptor alpha (FRalpha). FRalpha mediates folate
  transport across the choroid-plexus blood-cerebrospinal-fluid barrier, so its
  loss produces an isolated brain-specific folate deficiency: cerebrospinal-fluid
  5-methyltetrahydrofolate (5-MTHF) is severely reduced despite normal systemic
  folate status. Low CNS folate impairs one-carbon metabolism, methylation, and
  myelin synthesis, causing late-infantile onset seizures, psychomotor
  regression, ataxia, movement disorder, and profound hypomyelination with
  cerebellar atrophy on MRI. Crucially the disorder is treatable: high-dose
  folinic acid (5-formyltetrahydrofolate, leucovorin) restores CSF folate and can
  substantially improve or stabilize neurologic findings, particularly when
  started early. Plain folic acid is avoided because it binds FRalpha tightly and
  may interfere with residual receptor function.

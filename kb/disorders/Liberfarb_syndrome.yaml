notes: >-
  Liberfarb syndrome represents the severe multisystem end of the autosomal
  recessive PISD-related disorder spectrum, classically caused by the Portuguese
  founder splicing deletion NM_014338.3:c.904-12_904-3delCTATCACCAC and
  combining spondyloepimetaphyseal dysplasia, severe joint laxity with
  dislocations, early-onset retinal degeneration, sensorineural hearing loss,
  microcephaly, cerebellar atrophy, and intellectual disability.

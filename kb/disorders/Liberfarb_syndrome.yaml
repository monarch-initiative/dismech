- name: Lenz-Majewski hyperostotic dwarfism
  description: >-
    Lenz-Majewski hyperostotic dwarfism is a phospholipid-synthesis disorder
    caused by PTDSS1 variants that combines skeletal dysplasia with ocular,
    auditory, and intellectual involvement.
  distinguishing_features:
  - Caused by pathogenic variants in PTDSS1 (phosphatidylserine synthase 1) rather than PISD.
  disease_term:
    preferred_term: Lenz-Majewski hyperostotic dwarfism
    term:
      id: MONDO:0007892
      label: Lenz-Majewski hyperostotic dwarfism
  evidence:
  - reference: PMID:31263216
    reference_title: "The Liberfarb syndrome, a multisystem disorder affecting eye, ear, bone, and brain development, is caused by a founder pathogenic variant in thePISD gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, we must remark that variants in two other genes involved in the
      phospholipid synthesis pathway have also been linked to phenotypes
      combining skeletal dysplasia and sensory disturbances (eye and ear):
      biallelic PTDSS1 (phosphatidylserine synthase 1) variants determine
      Lenz-Majewski hyperostotic dwarfism (MIM 151050),32 and biallelic PCYT1A
      (CTP-phosphocholine cytidylyltransferase) variants are the cause of
      spondylometaphyseal dysplasia with cone-rod dystrophy (MIM 608940).33
    explanation: >-
      Identifies Lenz-Majewski hyperostotic dwarfism (PTDSS1) as a related
      phospholipid synthesis disorder combining skeletal dysplasia and sensory
      disturbances.

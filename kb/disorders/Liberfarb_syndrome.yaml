    reference_title: "Novel biallelic <i>PISD</i> missense variants cause spondyloepimetaphyseal dysplasia with disproportionate short stature and fragmented mitochondrial morphology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in PISD cause a phenotypic spectrum ranging from short stature with spondyloepimetaphyseal dysplasia (SEMD) to a multisystem disorder affecting eyes, ears, bones, and brain."
    explanation: This supports recessive disease caused by biallelic PISD variants.
pathophysiology:
- name: PISD deficiency
  description: >-
    Liberfarb syndrome is caused by pathogenic biallelic PISD variants that
    impair phosphatidylserine decarboxylase function in mitochondria. In the
    original Azorean, Portuguese, and Brazilian families, a homozygous 10-bp
    deletion in intron 8 (NM_014338.3:c.904-12_904-3delCTATCACCAC) disrupts the
    last splice acceptor site, causing intron 8 retention and reducing wild-type
    spliced PISD transcript levels to 5.7% in minigene assays.
  gene:
    preferred_term: PISD
    description: Mitochondrial phosphatidylserine decarboxylase.
    modifier: DECREASED

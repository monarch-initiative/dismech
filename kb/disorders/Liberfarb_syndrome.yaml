genetic:
- name: PISD
  gene_term:
    preferred_term: PISD
    term:
      id: hgnc:8999
      label: PISD
  association: Causal biallelic variant
  notes: >-
    Liberfarb syndrome is caused by biallelic pathogenic variants in PISD,
    which encodes mitochondrial phosphatidylserine decarboxylase, including the
    Portuguese founder splice-region deletion
    NM_014338.3:c.904-12_904-3delCTATCACCAC and compound heterozygous missense
    variants.
  evidence:
  - reference: PMID:31263216
    reference_title: "The Liberfarb syndrome, a multisystem disorder affecting eye, ear, bone, and brain development, is caused by a founder pathogenic variant in thePISD gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals shared a 3.36-Mb region of autozygosity on chromosome
      22q12.2, including a 10-bp deletion
      (NM_014338.3:c.904-12_904-3delCTATCACCAC), immediately upstream of the
      last exon of the PISD (phosphatidylserine decarboxylase) gene. Sequencing
      of PISD from paraffin-embedded tissue from the 1986 case revealed the
      identical homozygous variant.
    explanation: >-
      Identifies the homozygous founder 10-bp deletion in PISD across the
      Portuguese, Brazilian, and original 1986 Azorean Liberfarb syndrome
      patients.
  - reference: DOI:10.1111/cge.14549
    reference_title: "Novel biallelic <i>PISD</i> missense variants cause spondyloepimetaphyseal dysplasia with disproportionate short stature and fragmented mitochondrial morphology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic variants in PISD cause a phenotypic spectrum ranging from short stature with spondyloepimetaphyseal dysplasia (SEMD) to a multisystem disorder affecting eyes, ears, bones, and brain."
    explanation: This directly supports PISD as the causal disease gene.
  - reference: CGGV:assertion_c79d65c7-3c7b-42fa-a84b-894bc865316d-2024-10-02T160000.000Z
    reference_title: "PISD / Liberfarb syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PISD | HGNC:8999 | Liberfarb syndrome | MONDO:0030045 | AR | Moderate"
    explanation: ClinGen classifies the PISD-Liberfarb syndrome gene-disease relationship as moderate with autosomal recessive inheritance.

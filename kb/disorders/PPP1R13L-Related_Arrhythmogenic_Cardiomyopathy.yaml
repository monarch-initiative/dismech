    explanation: IVIG was chosen because of the imaging, without confirmed myocarditis.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two doses of 2 g/kg of intravenous immunoglobulin were administered."
    explanation: Records the IVIG course given.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had elevated cardiac enzymes, and cardiac MRI demonstrated
      findings consistent with myocarditis
    explanation: Suspected myocarditis on MRI was the reason for IVIG in a second child.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intermittent intravenous immunoglobulin administrations were given, yet
      troponin levels remained persistently elevated.
    explanation: Repeated IVIG did not normalise troponin.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, recurrent troponin peaks were observed during steroid treatment."

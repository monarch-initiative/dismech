      explanation: The ocular phenotype parallels the corneal clouding seen in patients.
  - target: Impaired Ectodermal Epithelial Adhesion and Appendage Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE

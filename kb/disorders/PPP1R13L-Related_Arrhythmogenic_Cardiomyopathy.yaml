- name: Derepressed NF-kappaB p65 Pro-inflammatory Transcription
  description: >-
    Without iASPP, nuclear p65 accumulates for longer after an inflammatory
    stimulus and binds the promoters of pro-inflammatory cytokine genes more
    strongly. Patient fibroblasts, iASPP-silenced human fibroblasts and murine
    cardiomyocytes all over-express IL1B, TNF, IL6 and chemokines in response to
    lipopolysaccharide, and the NF-kappaB target Icam1 is consistently raised
    in wa3 mutant mice.

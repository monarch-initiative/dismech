- name: Interleukin-1 Blockade
  description: >-
    Adjunctive interleukin-1 blockade given to two children with refractory
    ventricular arrhythmias and heart failure was followed by less ventricular
    ectopy and normal serum IL-1 and IL-10 levels, but contractile function did
    not recover. The agents used are not named in the abstract, and no
    controlled data exist.
  treatment_term:
    preferred_term: interleukin-1 blockade
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Heightened Cardiac Inflammatory Response to Intercurrent Stressors
    treatment_effect: INHIBITS
    description: >-
      IL-1 blockade damps the cytokine-driven inflammatory arm of the disease.
  evidence:
  - reference: PMID:41928611
    reference_title: Targeted Anti-IL-1 Immunomodulatory Therapy in Pediatric Onset PPP1R13L-Related Arrhythmogenic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL-1 blockade was associated with reduced ventricular ectopy and
      normalized serum cytokine levels (IL-1, IL-10) but without contractile
      recovery.
    explanation: >-
      Two-patient experience: an anti-arrhythmic and anti-inflammatory effect
      without recovery of pump function.
- name: Heart Transplantation
  description: >-
    Orthotopic heart transplantation is the only treatment reported to prevent
    death from end-stage heart failure; standard heart failure medication does
    not halt progression.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthotopic heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite targeted treatment, the severe systolic dysfunction persisted, and
      the general state progressively deteriorated and warranted the need for a
      cardiac transplant, which she underwent one year following the initial
      diagnosis.
    explanation: Medical treatment failed and the child was transplanted.
- name: Ventricular Assist Device Bridge to Transplantation

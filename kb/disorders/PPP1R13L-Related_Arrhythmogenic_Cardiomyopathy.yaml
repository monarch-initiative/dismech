differential_diagnoses:
- name: Naxos disease
  disease_term:
    preferred_term: Naxos disease
    term:
      id: MONDO:0011017
      label: Naxos disease
  description: >-
    Recessive JUP (plakoglobin) cardiocutaneous syndrome with woolly hair and
    palmoplantar keratoderma from early childhood and arrhythmogenic right
    ventricular cardiomyopathy that usually manifests in adolescence.
  distinguishing_features:
  - Causal gene JUP rather than PPP1R13L
  - Prominent palmoplantar keratoderma, a defining feature of Naxos disease
  - Cardiomyopathy typically from adolescence or young adulthood rather than infancy
  evidence:
  - reference: PMID:28069640
    reference_title: Sequence variation in PPP1R13L results in a novel form of cardio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      These CCSs are clinically characterized by woolly hair, palmoplantar
      keratoderma, and skin fragility, all of which appear in early childhood,
      and cardiac abnormality manifested from young adulthood
    explanation: >-
      Contrasts the desmosomal cardiocutaneous syndromes, with keratoderma and
      later cardiac onset, against the infantile PPP1R13L disease.
- name: Carvajal syndrome
  disease_term:
    preferred_term: Carvajal syndrome
    term:
      id: MONDO:0011581
      label: arrhythmogenic cardiomyopathy with wooly hair and keratoderma
  description: >-
    Recessive DSP (desmoplakin) cardiocutaneous syndrome with woolly hair,
    striate palmoplantar keratoderma and a predominantly left ventricular
    dilated cardiomyopathy, which overlaps PPP1R13L disease in its combined
    arrhythmogenic and dilated cardiac phenotype.
  distinguishing_features:
  - Causal gene DSP rather than PPP1R13L
  - Palmoplantar keratoderma and skin fragility
  evidence:
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This pathomechanism overlaps with that described in Naxos and Carvajal
      syndromes, in which desmosomal disruption leads to combined features of
      arrhythmogenic cardiomyopathy and dilated cardiomyopathy.
    explanation: The overlap that makes the desmosomal syndromes the main differential.
- name: Arrhythmogenic right ventricular cardiomyopathy
  disease_term:
    preferred_term: arrhythmogenic right ventricular cardiomyopathy
    term:
      id: MONDO:0016587
      label: arrhythmogenic right ventricular cardiomyopathy
  description: >-
    Non-syndromic, usually dominant desmosomal arrhythmogenic cardiomyopathy;
    a child with right ventricular-predominant PPP1R13L disease and no
    ectodermal signs can be indistinguishable without genetic testing.
  distinguishing_features:
  - Usually autosomal dominant, with adolescent or adult onset
  - Variants in desmosomal genes such as PKP2, DSP, DSG2 or DSC2
  evidence:
  - reference: PMID:35933355
    reference_title: Novel homozygous stop-gain pathogenic variant of PPP1R13L gene leads to arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings indicate that PPP1R13L should be included in ACM genetic
      testing to improve the identification of at-risk family members and the
      diagnostic yield.
    explanation: Recommends testing PPP1R13L in arrhythmogenic cardiomyopathy.
- name: Acute myocarditis
  disease_term:
    preferred_term: acute myocarditis
    term:
      id: MONDO:0002815
      label: acute myocarditis
  description: >-
    Because PPP1R13L cardiomyopathy often presents acutely after an infection,
    acute myocarditis is commonly suspected first. Cardiac MRI can suggest
    myocarditis, but endomyocardial biopsy in a reported child showed no
    inflammatory infiltrate.
  distinguishing_features:
  - Persistent, progressive systolic dysfunction without recovery
  - Ectodermal features or affected siblings
  - No inflammatory infiltrate on endomyocardial biopsy
  evidence:
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had elevated cardiac enzymes, and cardiac MRI demonstrated
      findings consistent with myocarditis
    explanation: Cardiac MRI in a child with PPP1R13L disease was read as myocarditis.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the endomyocardial biopsy showed no signs of inflammation, either acute or
      chronic, thus excluding an acute myocarditis or an inflammatory myocardial
      process
    explanation: Biopsy excluded myocarditis in another child.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the clinical presentation, the echocardiographic aspect, and the
      recent history of infectious disease, a diagnosis of acute myocarditis was
      taken into consideration.
    explanation: Acute myocarditis was the initial working diagnosis.
- name: Non-syndromic dilated cardiomyopathy
  disease_term:
    preferred_term: dilated cardiomyopathy
    term:
      id: MONDO:0005021
      label: dilated cardiomyopathy
  description: >-
    Other genetic and acquired causes of childhood dilated cardiomyopathy;
    PPP1R13L disease can look isolated when ectodermal features are subtle.
  distinguishing_features:
  - Absence of ectodermal, orofacial or ocular features
  - Variants in other cardiomyopathy genes
  evidence:
  - reference: PMID:37698259
    reference_title: Variable phenotype of a null PPP1R13L allele in children with dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the variability of the phenotype associated with PPP1R13-related
      DCM, a thorough evaluation of each case is highly recommended even in the
      presence of an apparently isolated DCM.
    explanation: Apparently isolated DCM can be PPP1R13L disease.
discussions:
- discussion_id: ppp1r13l_desmosomal_vs_inflammatory_mechanism
  prompt: >-
    How much of PPP1R13L cardiomyopathy is caused by loss of desmosome to
    intermediate filament anchorage in cardiomyocytes, how much by
    NF-kappaB-driven inflammation, and does loss of the p53-inhibitory activity
    of iASPP contribute at all?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of iASPP Anchoring of Desmoplakin and Desmin at Intercalated Discs
  - pathophysiology#Derepressed NF-kappaB p65 Pro-inflammatory Transcription
  - pathophysiology#PPP1R13L Biallelic Loss of Function
  rationale: >-
    The desmosomal model rests on an exon 8 deletion mouse and on desmin loss at
    the intercalated discs of explanted patient hearts; the inflammatory model rests
    on patient fibroblasts, knock-down cardiomyocytes and wa3 mouse hearts. IL-1
    blockade reduced ectopy without restoring contractility in two children,
    and NF-kappaB activation in explants was confined to non-cardiomyocytes.
    No study has tested patient-derived cardiomyocytes, compared the two arms
    in the same model, or examined p53 activity in iASPP-deficient hearts.

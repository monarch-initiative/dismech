name: PPP1R13L-Related Arrhythmogenic Cardiomyopathy
creation_date: "2026-11-11T21:48:18Z"
category: Mendelian
description: >-
  PPP1R13L-related arrhythmogenic cardiomyopathy is an ultra-rare autosomal
  recessive cardiocutaneous syndrome caused by biallelic loss-of-function
  variants in PPP1R13L, the gene encoding iASPP (inhibitor of
  apoptosis-stimulating protein of p53, also called RelA-associated inhibitor).
  Affected children develop a severe, rapidly progressive cardiomyopathy between
  early infancy and about nine years of age, most often reported as dilated
  cardiomyopathy and in some patients with marked right ventricular involvement.
  It is complicated by ventricular arrhythmias, heart failure and sudden cardiac
  death, decompensation often follows an intercurrent viral illness, and most
  reported children died or needed heart transplantation in early childhood. A
  variably expressed ectodermal phenotype (sparse, woolly or wiry hair, a high
  anterior hairline, dry skin, dystrophic nails and pointed or notched teeth)
  accompanies the cardiomyopathy in many but not all patients, and orofacial
  clefting, glaucoma, corneal opacity and anorectal anomalies have been reported
  in single families. iASPP binds desmoplakin and desmin at cardiomyocyte
  intercalated discs and restrains the transcriptional activity of the
  NF-kappaB subunit p65, so two overlapping mechanisms are proposed: loss of
  desmosome to intermediate filament anchorage in cardiomyocytes, and a lowered
  threshold for NF-kappaB-driven cardiac inflammation.
disease_term:
  preferred_term: arrhythmogenic cardiomyopathy with variable ectodermal abnormalities
  term:
    id: MONDO:0957795
    label: arrhythmogenic cardiomyopathy with variable ectodermal abnormalities
synonyms:
- arrhythmogenic cardiomyopathy with variable ectodermal abnormalities
- PPP1R13L cardiocutaneous syndrome
- PPP1R13L-associated cardiocutaneous syndrome
- PPP1R13L-related cardiomyopathy
notes: >-
  Named with the gene-related form used in recent primary literature
  (PPP1R13L-related arrhythmogenic cardiomyopathy, PMID:41928611;
  PPP1R13L-related cardiomyopathy, PMID:41919412). The MONDO and OMIM label
  (OMIM:620519) describes the phenotype only and would also cover the
  desmosomal cardiocutaneous syndromes caused by JUP (Naxos disease) and DSP
  (Carvajal syndrome), so it is kept as a synonym. Most reports describe the
  cardiac phenotype as dilated cardiomyopathy; the arrhythmogenic label follows
  the MONDO term and the prominent ventricular arrhythmias and right
  ventricular involvement in several patients.

- name: Impaired Ectodermal Epithelial Adhesion and Appendage Development
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  description: >-
    In keratinocytes junctional iASPP stabilises desmosomes, and its loss
    impairs cell adhesion and wound healing; keratinocyte-specific iASPP
    deletion is sufficient to produce the skin disorder in mice. iASPP also
    forms an autoregulatory loop with p63, and iASPP silencing accelerates
    keratinocyte differentiation, so altered epidermal stratification may
    contribute alongside the adhesion defect. In patients
    the result is a variable ectodermal phenotype of sparse, dry, woolly or
    wiry hair, dry skin, dystrophic nails and abnormally shaped teeth, which
    the discovery study described as mild.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: ABNORMAL
  - preferred_term: epidermis development
    term:
      id: GO:0008544
      label: epidermis development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29352264
    reference_title: Cell autonomous role of iASPP deficiency in causing cardiocutaneous disorders.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To address this, we developed cardiomyocyte-specific and
      keratinocyte-specific iASPP-deficient mouse models and show that the
      cell-type specific loss of iASPP in cardiomyocytes or keratinocytes is
      sufficient to induce cardiac or cutaneous disorders, respectively.
    explanation: >-
      The cutaneous phenotype is cell-autonomous to keratinocytes, as the
      cardiac phenotype is to cardiomyocytes.
  - reference: PMID:29352264
    reference_title: Cell autonomous role of iASPP deficiency in causing cardiocutaneous disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In keratinocytes, junctional iASPP is critical for stabilizing desmosomes
      and iASPP deficiency results in increased and disorganized cell migration,
      as well as impaired cell adhesion, consistent with delayed wound healing.
    explanation: >-
      Shows the keratinocyte desmosome and adhesion defect caused by iASPP
      loss.
  - reference: PMID:21897369
    reference_title: iASPP/p63 autoregulatory feedback loop is required for the homeostasis of stratified epithelia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Silencing of iASPP in keratinocytes by RNA interference promotes and
      accelerates a differentiation pathway, which also affects and slowdown
      cellular proliferation.
    explanation: >-
      iASPP also controls keratinocyte differentiation, a second route to
      abnormal epidermal and appendage development.
  downstream:
  - target: Woolly hair
    description: >-
      Abnormal hair follicle epithelium produces woolly or wiry hair.
  - target: Sparse hair
    description: >-
      Hair is sparse, thin and dry.
  - target: High anterior hairline
    description: >-
      A high anterior hairline accompanies the sparse scalp hair.
  - target: Dry skin
    description: >-
      Epidermal involvement presents as dry or finely scaling skin.
  - target: Nail dystrophy
    description: >-
      Nails are brittle or dystrophic.
  - target: Conical tooth
    description: >-
      Dental epithelium is affected, giving pointed, wedge-shaped or notched
      teeth.
- name: Failure of Embryonic Eyelid Closure and Anterior Eye Maldevelopment
  description: >-
    iASPP is expressed in the palpebral epidermis, conjunctiva, corneal
    epithelium and meibomian glands, and is required for the fusion of the
    embryonic eyelids. Ppp1r13l-mutant mice are born with open eyelids and
    develop corneal opacities and anterior segment abnormalities; a human fetus
    homozygous for a PPP1R13L variant had persistently open eyelids on
    prenatal ultrasound, and a child from the founder family had bilateral
    cloudy corneas.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: eyelid development in camera-type eye
    term:
      id: GO:0061029
      label: eyelid development in camera-type eye
    modifier: ABNORMAL
  evidence:
  - reference: PMID:22928477
    reference_title: Waved with open eyelids 2 (woe2) is a novel spontaneous mouse mutation in the protein phosphatase 1, regulatory (inhibitor) subunit 13 like (Ppp1r13l) gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Histological analysis of woe2 embryos identified the failure of embryonic
      eyelid closure.
    explanation: >-
      A Ppp1r13l deletion mouse fails to close its embryonic eyelids.
  - reference: PMID:42589643
    reference_title: Failure to Fuse Shut Eyelids, a Novel Unique Sign in Affected Fetus with Homozygous PPP1R13L Pathogenic Variant-A Case Report and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prompted by a fetus with a homozygous PPP1R13L pathogenic variant and
      persistent open eyelids on sonography, suggesting fusion failure, this
      study marks the first prenatal human description linking PPP1R13L to
      eyelid closure, mirroring waved with open eyelids 2(woe2) and waved 3
      (wa3) mouse models.
    explanation: >-
      The same eyelid fusion failure is seen in a human fetus with biallelic
      PPP1R13L variants.
  downstream:
  - target: Corneal opacity
    description: >-
      Exposure of the cornea and maldevelopment of the anterior segment lead to
      corneal opacity.

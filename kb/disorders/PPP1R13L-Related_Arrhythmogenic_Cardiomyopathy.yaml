diagnosis:
- name: Echocardiography
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Echocardiography is the first cardiac test at presentation and shows a
    dilated left ventricle with severely reduced systolic function, often with
    the right ventricle involved as well.
  results: >-
    Left ventricular dilatation with severe systolic dysfunction, or
    biventricular dysfunction.
  evidence:
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The echocardiography identified a dilated left ventricle (Z score > +2 for
      age) and severe systolic left ventricular dysfunction, and a positive
      diagnosis of dilated cardiomyopathy was confirmed by the cardiac magnetic
      resonance (CMR).
    explanation: Echocardiography detected the dilated cardiomyopathy that cardiac MRI then confirmed.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Echocardiographic evaluation revealed biventricular dysfunction with a
      severely reduced left ventricular ejection fraction of 20% and a left
      ventricular end-diastolic diameter of 52 mm (Z-score: +4.62).
    explanation: Echocardiography showed biventricular dysfunction and a dilated left ventricle at presentation.
- name: Cardiac magnetic resonance imaging
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with gadolinium enhancement
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  description: >-
    Cardiac MRI identifies the arrhythmogenic pattern: right ventricular
    dilatation with regional wall motion abnormalities and aneurysms of the
    outflow tract and sub-tricuspid region, biventricular systolic dysfunction,
    and subepicardial late gadolinium enhancement in the left ventricle. Early
    gadolinium enhancement can suggest myocarditis without meeting the Lake
    Louise criteria.
  results: >-
    Right ventricular aneurysms with dyskinesia, biventricular systolic
    dysfunction, and subepicardial left ventricular fibrosis on late gadolinium
    enhancement.
  evidence:
  - reference: PMID:35933355
    reference_title: Novel homozygous stop-gain pathogenic variant of PPP1R13L gene leads to arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the cardiac magnetic resonance features of regional wall motion
      abnormalities in the right ventricle and biventricular systolic
      dysfunction and fibrosis pattern in the left ventricle, the phenotype was
      compatible with ACM with biventricular involvement.
    explanation: Cardiac MRI features established the arrhythmogenic, biventricular phenotype.
  - reference: PMID:35933355
    reference_title: Novel homozygous stop-gain pathogenic variant of PPP1R13L gene leads to arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The right ventricular inflow-out flow cine images (Additional file 2)
      visualized segmental aneurysmal formations with dyskinesia in the right
      ventricular outflow tract and the sub-tricuspid region.
    explanation: Cine imaging showed right ventricular aneurysms with dyskinesia.
  - reference: PMID:35933355
    reference_title: Novel homozygous stop-gain pathogenic variant of PPP1R13L gene leads to arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Late gadolinium enhancement images demonstrated nearly-circumferential
      subepicardial fibrosis in the basal-to-mid inferior, inferolateral, and
      mid-anterolateral walls of the left ventricle
    explanation: Late gadolinium enhancement showed a subepicardial pattern of left ventricular fibrosis.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite the presence of early gadolinium enhancement on the T2 mapping CMR
      images, the clinical and paraclinical criteria (including the Lake Louise
      criteria) for diagnosing an acute myocarditis were not met.
    explanation: Early gadolinium enhancement raised, but did not establish, myocarditis.
- name: Ambulatory ECG monitoring
  diagnosis_term:
    preferred_term: 24-hour Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  description: >-
    Ambulatory ECG monitoring records the burden of ventricular ectopy and runs

  - target: Impaired Ectodermal Epithelial Adhesion and Appendage Development
    description: >-
      iASPP loss in keratinocytes destabilises their desmosomes and alters
      epidermal differentiation.
  - target: Failure of Embryonic Eyelid Closure and Anterior Eye Maldevelopment
    description: >-
      iASPP is expressed in the palpebral epidermis and conjunctival and corneal
      epithelia and is needed for embryonic eyelid closure.
- name: Loss of iASPP Anchoring of Desmoplakin and Desmin at Intercalated Discs
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  description: >-
    In cardiomyocytes iASPP localises to the intercalated discs and binds
    desmoplakin and desmin, maintaining desmosome integrity and the desmin
    intermediate filament network. iASPP deficiency disorganises desmosomes in
    vitro and in vivo, and explanted hearts from children with PPP1R13L
    cardiomyopathy show loss of desmin at the intercalated discs compared with
    other dilated cardiomyopathies. This substitutes cardiomyocytes for the
    keratinocyte of the module node.

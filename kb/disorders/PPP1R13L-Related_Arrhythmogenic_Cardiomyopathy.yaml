    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Embryonic eyelid closure fails and the anterior eye is malformed.
    evidence:
    - reference: PMID:22928477
      reference_title: Waved with open eyelids 2 (woe2) is a novel spontaneous mouse mutation in the protein phosphatase 1, regulatory (inhibitor) subunit 13 like (Ppp1r13l) gene.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Clinical and histological analysis of woe2 adult eyes identified severe

  species: Mouse
  genotype: Homozygous spontaneous recessive waved 3 (wa3) mutation in Ppp1r13l (Nkip1)
  publication: PMID:15661756
  description: >-
    Spontaneous recessive mouse mutant with a severe, rapidly progressive
    dilated cardiomyopathy and abnormal skin development; tissues show raised
    expression of the NF-kappaB target Icam1, and hearts show a rising
    inflammatory cytokine program as the cardiomyopathy develops.
  modeled_mechanisms:
  - target: Ventricular Myocardial Remodeling and Dilatation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Recapitulates the progressive dilated cardiomyopathy.
    limitations: >-
      The abstract describes contractile cardiomyopathy and skin changes; it
      does not report arrhythmia phenotyping.
    evidence:
    - reference: PMID:15661756
      reference_title: A mutation in NFkB interacting protein 1 results in cardiomyopathy and abnormal skin development in wa3 mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The cardiac defect results in a severe and rapidly progressive dilated
        cardiomyopathy.
      explanation: The wa3 mutant develops the human cardiac phenotype.
  - target: Derepressed NF-kappaB p65 Pro-inflammatory Transcription
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Shows raised NF-kappaB target gene expression in vivo.
    limitations: >-
      A single NF-kappaB target gene was measured in the original study, so the
      breadth of derepression in vivo is not established there.
    evidence:
    - reference: PMID:15661756
      reference_title: A mutation in NFkB interacting protein 1 results in cardiomyopathy and abnormal skin development in wa3 mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression analysis of genes known to be regulated by NFkB revealed that
        Intercellular adhesion molecule 1 (Icam1) expression is consistently
        elevated in mutant mice.
      explanation: NF-kappaB target expression is elevated in the mutant.
- name: Ppp1r13l exon 8 deletion mouse
  species: Mouse
  genotype: Ppp1r13l delta8/delta8 (exon 8 deletion, iASPP-deficient)
  publication: PMID:25691752
  description: >-
    iASPP-deficient mice that show right ventricular dilatation as embryos,
    disorganised cardiomyocyte desmosomes and intermediate filaments, and
    sudden cardiac death with features of arrhythmogenic right ventricular
    cardiomyopathy.
  modeled_mechanisms:
  - target: Ventricular Arrhythmogenic Substrate
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces arrhythmogenic sudden cardiac death.
    limitations: >-
      Murine cardiac electrophysiology and heart rate differ substantially from
      those of human children.
    evidence:
    - reference: PMID:25691752
      reference_title: iASPP, a previously unidentified regulator of desmosomes, prevents arrhythmogenic right ventricular cardiomyopathy (ARVC)-induced sudden death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        iASPP-deficient mice with exon 8 deletion (Ppp1r13l(Δ8/Δ8)) die of
        sudden cardiac death, displaying features of ARVC.
      explanation: The knockout dies suddenly with an arrhythmogenic phenotype.
  - target: Loss of iASPP Anchoring of Desmoplakin and Desmin at Intercalated Discs
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Shows the desmosome and intermediate filament defect in cardiomyocytes in vivo.
    evidence:
    - reference: PMID:25691752
      reference_title: iASPP, a previously unidentified regulator of desmosomes, prevents arrhythmogenic right ventricular cardiomyopathy (ARVC)-induced sudden death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        iASPP interacts with desmoplakin and desmin in cardiomyocytes to maintain
        the integrity of desmosomes and intermediate filament networks in vitro
        and in vivo.
      explanation: Junctional disruption is observed in the deficient mouse heart.
- name: Cardiomyocyte- and keratinocyte-specific iASPP-deficient mice
  species: Mouse
  genotype: Conditional Ppp1r13l deletion in cardiomyocytes or in keratinocytes
  publication: PMID:29352264
  description: >-
    Tissue-specific deletion shows that loss of iASPP in cardiomyocytes or in
    keratinocytes alone is enough to cause the cardiac or the cutaneous
    disorder, with delayed eyelid development and wound healing in the
    keratinocyte-specific line.
  modeled_mechanisms:
  - target: Impaired Ectodermal Epithelial Adhesion and Appendage Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Shows that the skin phenotype is intrinsic to keratinocytes rather than
      secondary to immune cells or cardiac disease.
    limitations: >-
      Mouse skin and pelage differ from human scalp hair, teeth and nails, so
      the specific human ectodermal features are not directly modelled.
    evidence:
    - reference: PMID:29352264
      reference_title: Cell autonomous role of iASPP deficiency in causing cardiocutaneous disorders.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To address this, we developed cardiomyocyte-specific and
        keratinocyte-specific iASPP-deficient mouse models and show that the
        cell-type specific loss of iASPP in cardiomyocytes or keratinocytes is
        sufficient to induce cardiac or cutaneous disorders, respectively.
      explanation: Cell-type specific deletion establishes cell autonomy.
- name: woe2 Ppp1r13l mutant mouse
  species: Mouse
  genotype: Homozygous spontaneous 1308 bp deletion in Ppp1r13l removing exons 9 to 11
  publication: PMID:22928477
  description: >-

    explanation: Apparently isolated dilated cardiomyopathy should still be evaluated for this cause.
treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    The two children whose treatment is reported in detail received standard
    heart failure medication: diuretics, an ACE inhibitor and inotropes in
    both, and an aldosterone antagonist and a beta-blocker in one. Diuretics
    relieved congestion, but medication did not halt progression: in one child,
    systolic function did not recover and she was listed for transplantation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: heart failure pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: furosemide
      term:
        id: CHEBI:47426
        label: furosemide
    - preferred_term: lisinopril
      term:
        id: CHEBI:43755
        label: lisinopril
    - preferred_term: spironolactone
      term:
        id: CHEBI:9241
        label: spironolactone
    - preferred_term: bisoprolol
      term:
        id: CHEBI:3127
        label: bisoprolol
    - preferred_term: dobutamine
      term:
        id: CHEBI:4670
        label: dobutamine
  target_mechanisms:
  - target: Progressive Systolic Dysfunction and Heart Failure
    treatment_effect: MODULATES
    description: >-
      Relieves congestion and supports cardiac output without arresting the
      progressive loss of systolic function.
  evidence:
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following the diagnosis, the patient received heart failure treatment,
      including a loop diuretic, (Furosemide initially administered
      intravenously for approximately one week and continued orally during
      admission and upon discharge and angiotensin converting enzyme (ACE)
      inhibitor (Lisinopril, oral, 0.1 mg/kg/day), aldosterone receptor blocker
      (Spironolactone, oral, 1 mg/kg/day), and beta blocker (Bisoprolol, oral
      0.1 mg/kg/day).
    explanation: Names the standard heart failure regimen given at diagnosis.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Following intensive diuretic treatment, she achieved significant
      symptomatic improvement, with minimal respiratory effort, resolution of
      peripheral edema, and complete disappearance of both pleural and
      pericardial effusions.
    explanation: Diuretics relieved congestion.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately two months after the initial diagnosis, the patient
      experienced a new episode of acute cardiac decompensation, requiring
      admission to the intensive care unit and initiation of inotropic support
      with Dobutamine (doses starting from 5 mcg/kg/min).
    explanation: Inotropic support with dobutamine was needed during decompensation.
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After two months, due to lack of improvement of echocardiographic
      parameters under mechanical assistance and pharmacological treatment for
      heart failure, the patient met the criteria for inclusion on the heart
      transplant list.
    explanation: Ventricular function did not recover on heart failure medication, and the child was listed for transplantation.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inotropic infusions, diuretics, ACE inhibitors, and antiplatelet therapy
      were initiated due to heart failure
    explanation: A second child received the same classes of heart failure medication.
- name: Beta-Blocker Therapy for Ventricular Tachycardia
  description: >-
    A beta-blocker was started after Holter monitoring recorded frequent
    multiform ventricular ectopy with non-sustained and sustained ventricular
    tachycardia. Its effect on the arrhythmia was not reported, and the child
    later died of cardiac arrest after ventricular fibrillation.
  notes: >-
    No implantable cardioverter-defibrillator use has been reported in this
    disease. The PubMed query PPP1R13L AND (defibrillator OR ICD OR
    cardioverter) returned no records on 2026-11-12, and none of the full-text
    reports cited here (PMID:28069640, PMID:35933355, PMID:41919412,
    PMID:42652917) mentions one. ICD therapy is therefore not modelled, and
    guidance for other arrhythmogenic cardiomyopathies is not cited for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: beta-blocker therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: beta-blocker
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Ventricular Arrhythmogenic Substrate
    treatment_effect: INHIBITS
    description: >-
      Beta-blockade is given to suppress adrenergically triggered ventricular
      ectopy and tachycardia; no PPP1R13L report measures how well it does so.
  evidence:
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      non-sustained and sustained ventricular tachycardia episodes, leading to
      initiation of beta-blocker therapy
    explanation: Ventricular tachycardia on Holter monitoring led to beta-blocker therapy.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient unfortunately died due to cardiac arrest following
      ventricular fibrillation during follow-up
    explanation: The child treated with a beta-blocker later died after ventricular fibrillation.
- name: Intravenous Immunoglobulin for Suspected Myocarditis
  description: >-
    Intravenous immunoglobulin was given empirically to two children whose
    acute presentation and cardiac MRI suggested myocarditis. In one, troponin
    stayed raised despite repeated courses and corticosteroids; in the other,
    acute myocarditis was never confirmed. It is not a disease-specific therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: intravenous immunoglobulin
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  evidence:
  - reference: PMID:42652917
    reference_title: Homozygous PPP1R13L Mutation Associated with Dilated Cardiomyopathy in a 1-Year-Old Child.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the context of the acute heart failure symptomatology, without a
      biological inflammatory syndrome, but with severe systolic dysfunction and
      the CMR aspect of early and late gadolinium enhancement, intravenous
      immunoglobulin was considered in this patient, even though acute

- name: Endomyocardial biopsy
  diagnosis_term:
    preferred_term: endomyocardial biopsy
    term:
      id: NCIT:C51674
      label: Endomyocardial Biopsy
  description: >-
    Endomyocardial biopsy separates this disease from myocarditis when imaging
    suggests inflammation. In a reported child it showed fibrosis and
    endocardial fibroelastosis without an inflammatory infiltrate.
  results: >-
    Mild interstitial fibrosis and marked endocardial fibroelastotic
    thickening, without inflammatory infiltrates meeting the thresholds for
    myocarditis.

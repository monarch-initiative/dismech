  results: >-
    Frequent multiform ventricular extrasystoles with non-sustained and
    sustained ventricular tachycardia.
  evidence:
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "24-hour Holter monitoring detected 18% multiform ventricular extrasystoles"
    explanation: Holter monitoring quantified a high burden of multiform ventricular ectopy.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

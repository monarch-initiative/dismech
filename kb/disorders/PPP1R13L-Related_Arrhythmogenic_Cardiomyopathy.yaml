      sequencing and inheritance-based variant filtering.
    explanation: Exome or genome sequencing identified the biallelic variants in five families.
  - reference: PMID:35933355
    reference_title: Novel homozygous stop-gain pathogenic variant of PPP1R13L gene leads to arrhythmogenic cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used whole-exome sequencing to determine a genetic explanation for an
      ACM-positive patient from a consanguineous family.
    explanation: Exome sequencing provided the molecular diagnosis.
  - reference: PMID:41919412
    reference_title: A novel homozygous PPP1R13L frameshift variant in a child with syndromic dilated cardiomyopathy and fatal arrhythmia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to the presence of sparse, dry hair, a high anterior hairline, a broad
      and flat nasal bridge, and pointed teeth, genetic evaluation was planned
    explanation: Ectodermal features in a child with cardiomyopathy prompted genetic testing.
  - reference: PMID:37698259

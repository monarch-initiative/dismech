mechanistic_hypotheses:
- hypothesis_group_id: desmosomal_anchoring_loss
  hypothesis_label: Loss of iASPP uncouples desmoplakin and desmin at cardiomyocyte intercalated discs
  status: EMERGING
  description: >-
    iASPP sits at cardiomyocyte intercalated discs, where it binds desmoplakin
    and the intermediate filament protein desmin. Without it the desmosome to
    intermediate filament linkage is lost, the same structural failure that
    underlies the desmoplakin and plakoglobin cardiocutaneous syndromes. This
    model rests on the Ppp1r13l exon 8 deletion mouse, which dies suddenly with
    an arrhythmogenic right ventricular phenotype, and on loss of desmin at the
    intercalated discs of explanted patient hearts.
  evidence:
  - reference: PMID:41928611
    reference_title: Targeted Anti-IL-1 Immunomodulatory Therapy in Pediatric Onset PPP1R13L-Related Arrhythmogenic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPP1R13L cardiomyopathy involves systemic inflammation, but loss of
      desmin-desmosome anchoring in cardiomyocytes appears to be the central
      mechanism of PPP1R13L cardiomyopathy.
    explanation: >-
      The authors' conclusion from explanted patient hearts favours the
      desmosomal anchoring defect as the primary cardiac mechanism.
- hypothesis_group_id: nfkb_inflammatory_threshold
  hypothesis_label: Loss of iASPP lowers the cardiac threshold for NF-kappaB-driven inflammation
  status: EMERGING
  description: >-
    iASPP binds the NF-kappaB subunit p65 (RelA) and represses its
    transcriptional activity. Patient fibroblasts and iASPP-deficient mouse
    hearts mount an exaggerated pro-inflammatory cytokine response, which would
    explain why cardiac decompensation so often follows an intercurrent
    infection and why some explanted or post-mortem hearts show myocarditis.
    Interleukin-1 blockade in two children reduced ventricular ectopy and
    normalised serum cytokines but did not restore contractility, which
    suggests that inflammation modulates the arrhythmic course rather than
    driving the contractile failure.
  evidence:
  - reference: PMID:28069640
    reference_title: Sequence variation in PPP1R13L results in a novel form of cardio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Our results determined PPP1R13L as the gene underlying a novel
      autosomal-recessive cardio-cutaneous syndrome in humans and strongly
      suggest that the fatal DCM during infancy is a consequence of failure to
      regulate transcriptional pathways necessary for tuning cardiac threshold
      response to common inflammatory stressors.
    explanation: >-
      The discovery study proposes an inflammatory-threshold mechanism, inferred
      from patient fibroblast and mouse data rather than shown in patient
      myocardium.
  - reference: PMID:41928611
    reference_title: Targeted Anti-IL-1 Immunomodulatory Therapy in Pediatric Onset PPP1R13L-Related Arrhythmogenic Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IL-1 blockade was associated with reduced ventricular ectopy and
      normalized serum cytokine levels (IL-1, IL-10) but without contractile
      recovery.
    explanation: >-
      A partial response to anti-inflammatory therapy supports a contribution of
      inflammation to the arrhythmic phenotype but not to contractile failure.
pathophysiology:
- name: PPP1R13L Biallelic Loss of Function
  description: >-
    Biallelic nonsense, frameshift or destabilising missense variants in
    PPP1R13L abolish functional iASPP. Patient fibroblasts with the founder
    p.Tyr747Ter allele contain no detectable iASPP protein, and disease-causing
    mutants either lose the C-terminal ankyrin-SH3 domain, become more
    auto-inhibited, or aggregate because that domain is destabilised. The
    C-terminal domain is the binding hub through which iASPP engages partners
    that include the NF-kappaB subunit p65. iASPP is named for its inhibition of
    p53, but no study has tested whether loss of that activity contributes to
    this disease.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION

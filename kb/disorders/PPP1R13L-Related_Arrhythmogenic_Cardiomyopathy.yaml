  - reference: PMID:28069640
    reference_title: Sequence variation in PPP1R13L results in a novel form of cardio-cutaneous syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blot (WB) analyses demonstrated the absence of iASPP in VI10, VI4,
      and VII1 PDFs.
    explanation: >-
      Patient-derived fibroblasts homozygous for p.Tyr747Ter contain no iASPP
      protein, so the founder allele is null.
  - reference: PMID:39695191
    reference_title: Cardiocutaneous syndrome is caused by aggregation of iASPP mutants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that three different mechanisms are responsible for loss of
      function of iASPP: loss of the complete C-terminal domain, mutations
      resulting in increased auto-inhibition and aggregation due to
      destabilization of the C-terminal domain.
    explanation: >-
      Biochemical analysis of patient mutants shows that all classes converge on
      loss of iASPP function.
  - reference: PMID:10336463
    reference_title: Identification of a novel inhibitor of nuclear factor-kappaB, RelA-associated inhibitor.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we report the identification and characterization of a novel
      protein, RelA-associated inhibitor (RAI), that binds to the NF-kappaB
      subunit p65 (RelA) and inhibits its transcriptional activity.
    explanation: >-
      Establishes the NF-kappaB binding and transcriptional repressor activities
      that are lost with iASPP (RAI is the C-terminal fragment of iASPP).
  downstream:

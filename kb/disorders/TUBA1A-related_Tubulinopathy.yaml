    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      LIS-associated mutations of TUBA1A operate via diverse mechanisms that
      include disruption of binding sites for microtubule-associated proteins
      (MAPs)
    explanation: >-
      Cellular and structural data show that TUBA1A mutations act through
      diverse mechanisms including disruption of microtubule-associated protein
      binding sites.
  - reference: PMID:30517687
    reference_title: "TUBA1A mutations identified in lissencephaly patients dominantly disrupt neuronal migration and impair dynein activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ectopic expression of TUBA1A-R402C and TUBA1A-R402H patient alleles is
      sufficient to dominantly disrupt cortical neuronal migration in the
      developing mouse brain
    explanation: >-
      Establishes that the recurrent Arg402 patient alleles act dominantly on
      cortical migration in vivo, which is the basis for the
      DOMINANT_NEGATIVE functional_impact_category on this node.
  - reference: PMID:30517687
    reference_title: "TUBA1A mutations identified in lissencephaly patients dominantly disrupt neuronal migration and impair dynein activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the level of dynein impairment scales with the expression level of the
      mutant in the cell, suggesting a 'poisoning' mechanism in which R402
      mutant α-tubulin acts dominantly by populating microtubules with
      defective binding sites for dynein
    explanation: >-
      Identifies the specific dominant-negative molecular mechanism - mutant
      subunits incorporate into microtubules and poison the dynein-binding
      surface - distinguishing this from haploinsufficiency.
  - reference: PMID:42213754
    reference_title: Comprehensive mutagenesis defines the functional landscape of human α-tubulin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Systematic profiling of microtubule assembly revealed distinct classes of
      mutations that disrupt folding, chaperone engagement, and protofilament
      geometry, defining structural constraints that govern tubulin function.
    explanation: >-
      A complete functional atlas of all TUBA1A coding variants resolves the
      lesion into distinct mechanistic classes, showing the trigger node is
      heterogeneous at the allele level rather than a single failure mode.
  downstream:
  - target: Impaired Microtubule-Dependent Neuronal Migration

animal_models:
- name: Tuba1a S140G ENU mouse (Jenna)
  species: Mouse
  genotype: Tuba1a p.S140G heterozygous (ENU-induced)
  publication: PMID:17218254
  description: >-
    The founding model of the disease. An ENU mutagenesis screen recovered a
    heterozygous alpha-1 tubulin mutation in the GTP-binding pocket that impairs
    tubulin heterodimer formation, producing abnormal lamination of hippocampus
    and cortex with impaired neuronal migration. Its historical importance is
    that the direction of discovery ran mouse-to-human: the phenotypic
    resemblance to existing lissencephaly models is what prompted screening
    TUBA1A in patients with developmental brain anomalies, which found the first
    human cases.
  modeled_mechanisms:
  - target: Altered Alpha-Tubulin (TUBA1A) Function
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the molecular lesion class: a heterozygous missense
      substitution in the alpha-tubulin GTP-binding pocket that impairs
      heterodimer formation.
    limitations: >-
      The murine S140G allele is not one of the recurrent human disease alleles,
      and is not at the Arg402 hotspot whose dominant dynein-poisoning mechanism
      is best resolved in human disease.
    readouts:
    - name: Tubulin heterodimer formation
      target: Altered Alpha-Tubulin (TUBA1A) Function
      direction: DECREASED
      interpretation: >-
        Biochemical correlate of the trigger node in this model.
      biological_processes:
      - preferred_term: tubulin heterodimer assembly
        term:
          id: GO:0007021
          label: tubulin complex assembly
        modifier: DECREASED
      evidence:
      - reference: PMID:17218254
        reference_title: "Mutations in alpha-tubulin cause abnormal neuronal migration in mice and lissencephaly in humans."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the causative mutation lies in the guanosine triphosphate (GTP)
          binding pocket of alpha-1 tubulin (Tuba1) and affects tubulin
          heterodimer formation
        explanation: Reports the measured biochemical defect behind this readout.
    evidence:
    - reference: PMID:17218254
      reference_title: "Mutations in alpha-tubulin cause abnormal neuronal migration in mice and lissencephaly in humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Phenotypic similarity with existing mouse models of lissencephaly led us
        to screen a cohort of patients with developmental brain anomalies.
      explanation: >-
        The model was informative enough for this node that it directed the
        human gene discovery.
  - target: Cortical Dyslamination and Lissencephaly Spectrum
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces abnormal laminar architecture of hippocampus and cortex with

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous, almost always de novo missense variants. Recurrence risk for
    the parents of a proband is correspondingly low but not zero, because
    germline mosaicism cannot be excluded.
  evidence:
  - reference: PMID:17584854
    reference_title: "Large spectrum of lissencephaly and pachygyria phenotypes resulting from de novo missense mutations in tubulin alpha 1A (TUBA1A)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The de novo occurrence was shown for all mutations
    explanation: >-
      Establishes de novo occurrence for every mutation in the founding cohort,
      the basis for autosomal dominant, typically sporadic inheritance.
epidemiology:
- name: Contribution of TUBA1A to lissencephaly cohorts
  description: >-
    TUBA1A is not a stand-alone prevalence figure so much as a share of the
    lissencephaly spectrum. It accounts for roughly 1% of classic lissencephaly
    but about 30% of lissencephaly with cerebellar hypoplasia, making it the
    first major gene identified for that rarer phenotype. Within cohorts
    ascertained specifically for complex cortical malformation with tubulin
    testing, TUBA1A is the most frequently mutated tubulin gene.
  evidence:
  - reference: PMID:20466733
    reference_title: "TUBA1A mutations cause wide spectrum lissencephaly (smooth brain) and suggest that multiple neuronal migration pathways converge on alpha tubulins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified novel and recurrent TUBA1A mutations in approximately 1% of
      children with classic LIS and in approximately 30% of children with LCH,
      making this the first major gene associated with the rare LCH phenotype
    explanation: >-
      Quantifies the TUBA1A share of two lissencephaly phenotypes, the closest
      available population-level measure for this gene.
  - reference: PMID:24860126
    reference_title: "The wide spectrum of tubulinopathies: what are the key features for the diagnosis?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      45 were found to carry mutations in TUBA1A (42.5%)
    explanation: >-
      In a cohort ascertained for complex cortical malformation, TUBA1A is the
      most frequently mutated tubulin gene.
diagnosis:
- name: Brain magnetic resonance imaging
  description: >-
    MRI is the diagnostic anchor. The recognisable pattern is a cortical
    malformation - ranging from microlissencephaly and agyria-pachygyria through
    dysgyria to polymicrogyria-like dysplasia - combined with a characteristic
    set of extracortical findings: dysmorphic basal ganglia with a fused
    striatum, dysgenesis of the internal capsule, corpus callosum hypoplasia or
    agenesis, ventriculomegaly, and brainstem and cerebellar hypoplasia. It is
    the combination rather than any single feature that raises tubulinopathy.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathomorphological manifestations of the disease include basal ganglia
      dysmorphism with a fused striatum (pathognomonic in approximately 75% of
      cases), dysgenesis of the internal capsule (most commonly involving the
      anterior limb), and a broad spectrum of cortical anomalies.
    explanation: >-
      Names the imaging pattern and its most discriminating element, basal
      ganglia dysmorphism with a fused striatum.
- name: Prenatal neurosonography
  description: >-
    Tubulinopathy was historically a postnatal diagnosis, but second- and early
    third-trimester anomaly scanning can now raise the suspicion in utero, with
    dedicated neurosonography and targeted genetic testing following recognition
    of red-flag patterns. Reported prenatal detection is most common at 28-34
    weeks, though a TUBA1A case has been characterised at 21 weeks on findings
    that were individually subtle - low-normal head circumference, cerebellar
    hypoplasia, partial callosal agenesis, interhemispheric fissure
    interdigitation, ventricular asymmetry and basal ganglia asymmetry. The
    clinical purpose is explicit: parental counselling and decisions about
    continuation of pregnancy.
  diagnosis_term:
    preferred_term: fetal neurosonography
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While historically diagnosed postnatally, advances in prenatal
      neurosonography now allow for the suspicion of this pathology in utero
      during routine second and early third-trimester anomaly scans.
    explanation: >-
      Establishes prenatal neurosonography as a current diagnostic modality for
      the tubulinopathies rather than an incidental finding.
  - reference: PMID:41171976
    reference_title: "Prenatal Diagnosis of Tubulinopathy: Case Report of Neurosonographic Features and a Novel <italic>TUBA1A</italic> Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Amniocentesis with trio genome sequencing detected a novel, de novo
      heterozygous c.799T>C variant in TUBA1A that has not been previously
      reported.
    explanation: >-
      A worked TUBA1A-specific prenatal diagnosis: sonographic suspicion
      confirmed by trio genome sequencing on amniocentesis.
- name: Molecular genetic testing
  description: >-
    Diagnosis is confirmed by identifying a heterozygous pathogenic TUBA1A
    variant, in practice by exome or genome sequencing (trio where possible,
    given the de novo mechanism) or by a targeted cortical-malformation panel.
    Variant interpretation is aided by a complete functional atlas of all 2,683
    TUBA1A coding variants, which assigns variants to classes acting on folding,
    chaperone engagement, or protofilament geometry.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42213754
    reference_title: Comprehensive mutagenesis defines the functional landscape of human α-tubulin.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This approach complements conservation-based predictors and enables
      functional reinterpretation of disease-associated variants.
    explanation: >-
      Provides a functional reference set for classifying TUBA1A variants of
      uncertain significance, directly supporting molecular diagnosis.
progression:
- phase: Prenatal onset of the malformation
  age_range: Second and third trimester
  notes: >-
    The malformation is established in utero during neuronal migration and is
    detectable on dedicated neurosonography, most commonly at 28-34 weeks and in
    at least one TUBA1A case at 21 weeks. There is no window in which the
    structural lesion can be prevented postnatally.
  evidence:
  - reference: PMID:41171976
    reference_title: "Prenatal Diagnosis of Tubulinopathy: Case Report of Neurosonographic Features and a Novel <italic>TUBA1A</italic> Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although scarce, prenatal diagnosis has been recently reported through
      expert neurosonography and magnetic resonance imaging, most commonly at
      28-34 weeks' gestation
    explanation: >-
      Establishes the gestational window in which the established malformation
      becomes detectable.
- phase: Infantile neurological presentation
  age_range: Infancy
  notes: >-
    Severe neurological impairment presents in infancy: profound intellectual
    disability, drug-resistant epilepsy (infantile spasms and focal seizures),
    spastic tetraparesis or diparesis with axial hypotonia, absent speech, and
    swallowing difficulty that may require gastrostomy. An evolving epileptic
    encephalopathy is described, with infantile epileptic spasms syndrome giving
    way to atypical absence seizures before one year.
  evidence:
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected children typically present with severe neurological impairment in
      infancy including profound intellectual disability (often non-verbal),
      drug-resistant epilepsy (such as infantile spasms and focal seizures),
      spastic tetraparesis or diparesis with axial hypotonia, absent speech,
      swallowing difficulties requiring gastrostomy, and sensorimotor
      polyneuropathy.
    explanation: >-
      Describes the infantile clinical presentation that follows the prenatally
      established malformation.
  - reference: PMID:40729534
    reference_title: TUBA1A-related tubulinopathy associated with the infantile epileptic spasms syndrome and atypical absence seizures.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, this patient presented with infantile epileptic spasms
      syndrome, with the eventual appearance of atypical absence seizures before
      the age of 1 year.
    explanation: >-
      Documents an evolving epilepsy phenotype within the first year, a
      specifically TUBA1A-reported seizure trajectory.
- phase: Non-progressive but lifelong course
  age_range: Childhood onward
  notes: >-
    The disorder is static rather than degenerative - the structural lesion does
    not worsen - but the resulting impairment is lifelong and care-dependent.
    Calling it non-progressive is a statement about the malformation, not about
    the burden, and should not be read as reassurance.
  evidence:
  - reference: PMID:41901019
    reference_title: The Role of Prenatal Neurosonography in Identification of Tubulinopathy-Narrative Review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tubulinopathies are severe, non-progressive neurodevelopmental disorders
      caused by mutations in tubulin genes, leading to profound intellectual
      disability, drug-resistant epilepsy, motor impairment, and lifelong
      dependence on care.
    explanation: >-
      States both halves of the course: non-progressive structurally, and
      lifelong care-dependent in effect.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Among the highest in the grouping. TUBA1A carries the
    lissencephaly-predominant end of the tubulinopathy spectrum, and the
    resulting impairment is severe across every domain measured. On
    caregiver-rated developmental profiling across the four curated
    tubulinopathy genes, challenges were
    observed in all domains with motor skills most severely affected, and
    co-occurring vision impairment - present in most of that cohort - tracked
    with greater overall delay. Burden extends to the family: quality-of-life
    scores in genetically confirmed lissencephaly are low, and a median of eight
    concurrent supportive therapies per patient is typical.
  evidence:
  - reference: PMID:42593952
    reference_title: "Developmental Profiles Associated with TUBA1A, TUBB2A, TUBB2B, and TUBB3 Tubulinopathy Conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group-level challenges were observed across all domains evaluated, and
      motor skills were most severely affected.
    explanation: >-
      Quantifies the domain profile of impairment across a cohort that includes
      TUBA1A, with motor function the worst-affected domain.
  - reference: PMID:42593952
    reference_title: "Developmental Profiles Associated with TUBA1A, TUBB2A, TUBB2B, and TUBB3 Tubulinopathy Conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with TUBB3 conditions demonstrated relatively milder degrees
      of delay, and those with cooccurring vision impairments (71%) showed
      greater overall delays than those without.
    explanation: >-
      Places TUBA1A on the more severe side of the grouping (TUBB3 is the
      milder member) and identifies vision impairment as a severity modifier.
  - reference: PMID:42177523
    reference_title: "Gene-specific long-term course, neurodevelopmental outcome and quality of life in patients with LIS1/PAFAH1B1-, DCX-, DYNC1H1-, TUBA1A- and TUBG1-related lissencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The scores obtained for health-related quality of life (HRQL) were low
      (parental HRQL mean 61.23; SD 16.79).
    explanation: >-
      Measures the family-level burden in a lissencephaly cohort that includes a
      TUBA1A patient.
pathophysiology:
- name: Altered Alpha-Tubulin (TUBA1A) Function
  description: >-
    Heterozygous de novo missense mutations in TUBA1A alter the brain-predominant
    alpha-1A tubulin subunit. Disease-associated substitutions map to functionally
    critical regions of the protein, including the GTP-binding pocket, and impair
    tubulin heterodimer formation and microtubule assembly. Additional
    mutations disrupt the binding surfaces for microtubule-associated proteins,
    so that the alpha-tubulin lesion compromises microtubule structure and the
    docking of the regulatory and motor proteins that act on microtubules. This
    establishes altered alpha-tubulin function as the initiating molecular lesion
    of the malformation.
  conforms_to: microtubule_dependent_neuronal_migration_failure#Microtubule Apparatus Perturbation
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Disease alleles are heterozygous, almost always de novo missense
      substitutions; no nonsense, frameshift, or whole-gene-deletion alleles are
      reported, so the mechanism is not haploinsufficiency. For the recurrent
      Arg402 alleles the mechanism has been resolved directly: mutant
      alpha-tubulin is incorporated into microtubules and poisons them by
      populating the polymer with defective dynein-binding sites, and the degree
      of dynein impairment scales with mutant expression level. Comprehensive
      mutagenesis of all 2,683 TUBA1A coding variants further separates the
      allele space into classes acting on folding, chaperone engagement, and
      protofilament geometry, so DOMINANT_NEGATIVE describes the best-resolved
      recurrent alleles rather than every reported variant.
  cell_types:
  - preferred_term: cortical progenitor and migrating neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:

- name: TUBA1A-R402C / R402H ectopic expression mouse
  species: Mouse
  genotype: In utero electroporation of TUBA1A p.R402C or p.R402H patient alleles
  publication: PMID:30517687
  description: >-
    Not a germline model but an allele-specific perturbation: patient Arg402
    alleles are expressed ectopically in the developing mouse brain. Arg402
    substitutions account for about 30% of all reported TUBA1A mutations, and
    this experiment is what established that they act dominantly rather than by
    loss of one gene copy.
  modeled_mechanisms:
  - target: Impaired Microtubule-Dependent Neuronal Migration
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Expression of the patient allele is by itself sufficient to disrupt
      cortical neuronal migration in vivo, in the presence of two wild-type
      mouse alleles - the definition of a dominant effect.
    limitations: >-
      Ectopic overexpression rather than physiological expression from the
      endogenous locus, so the dose is not the patient dose; and the paper's own
      finding that dynein impairment scales with mutant expression level means
      the magnitude of effect is dose-sensitive by construction.
    readouts:
    - name: Cortical neuronal migration after in utero expression
      target: Impaired Microtubule-Dependent Neuronal Migration
      direction: DECREASED
      interpretation: >-
        Dominant disruption of migration by the patient allele.

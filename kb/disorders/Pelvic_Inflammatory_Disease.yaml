name: Pelvic Inflammatory Disease
creation_date: "2026-08-16T15:40:00Z"
category: Infectious Disease
disease_term:
  preferred_term: pelvic inflammatory disease
  term:
    id: MONDO:0000922
    label: pelvic inflammatory disease
synonyms:
- PID
- acute pelvic inflammatory disease
- salpingitis
- upper genital tract infection
- endometritis-salpingitis-peritonitis syndrome
parents:
- Female reproductive system disorder
- Inflammatory disease
- Bacterial infectious disease
description: >
  Pelvic inflammatory disease is inflammation of the female upper genital tract that
  follows ascent of organisms from the cervix and vagina into the endometrium,
  fallopian tubes, and adjacent pelvic structures. Endometritis, salpingitis,
  tubo-ovarian abscess and pelvic peritonitis are points on one spectrum rather than
  separate diseases. Two features make PID mechanistically distinctive. First, the
  damage that matters clinically is inflicted by the host response, not by the
  organism: gonococcal cell-wall fragments and chlamydial antigens provoke a
  TNF-driven, neutrophil-dominant reaction that sloughs the multiciliated tubal
  epithelium, and the resulting fibrosis and luminal occlusion are irreversible.
  Second, the disease is frequently silent — a large share of tubal factor infertility
  arises in women who never had a symptomatic episode — so the interval between
  infection and diagnosis, rather than the organism's identity, is the strongest
  modifiable determinant of outcome. Neisseria gonorrhoeae and Chlamydia trachomatis
  are the classical pathogens, but fewer than half of contemporary cases yield either;
  Mycoplasma genitalium and the anaerobic consortium of bacterial vaginosis account for
  a substantial further fraction, and this etiological shift is not fully covered by
  the recommended regimen.
references:
- reference: PMID:34396413
  title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
  findings:
  - statement: >
      PID follows ascension of sexually transmitted pathogens from the lower genital
      tract, and both classical pathogens survive intracellularly and actively evade
      innate and adaptive immunity.
  - statement: >
      Endometrial transcriptional profiling in women with PID shows myeloid, cell death
      and innate inflammatory pathway activation alongside suppressed T-cell activation.
- reference: PMID:34396398
  title: "A Review of the Challenges and Complexities in the Diagnosis, Etiology, Epidemiology, and Pathogenesis of Pelvic Inflammatory Disease."
  findings:
  - statement: >
      Fewer than half of women diagnosed with PID have gonococcal or chlamydial
      infection; M. genitalium, respiratory pathogens and bacterial-vaginosis-associated
      bacteria account for a substantial fraction.
  - statement: >
      The clinical diagnosis is nonspecific and there is no validated noninvasive test.
- reference: PMID:25592078
  title: "Pathogenesis of fallopian tube damage caused by Chlamydia trachomatis infections."
  findings:
  - statement: >
      Permanent tubal damage in chlamydial infection is a consequence of the host innate
      and adaptive immune response to ongoing or repeated infection rather than of direct
      microbial cytotoxicity.
- reference: PMID:1411832
  title: "Pelvic inflammatory disease and fertility. A cohort study of 1,844 women with laparoscopically verified disease and 657 control women with normal laparoscopic results."
  findings:
  - statement: >
      The reference cohort quantifying tubal factor infertility and ectopic pregnancy
      after laparoscopically confirmed PID, and the dose-response with episode number
      and severity.
- reference: PMID:31524362
  title: "Pelvic Inflammatory Disease: Diagnosis, Management, and Prevention."
  findings:
  - statement: >
      Contemporary clinical review covering the empiric-treatment threshold, the
      outpatient cephalosporin-plus-doxycycline regimen, indications for hospitalization,
      and partner treatment.

prevalence:
- population: United States, sexually experienced women aged 18-44 years
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4400.0
  notes: >
    NHANES 2013-2014 self-reported lifetime diagnosis. This is a lifetime prevalence of
    a clinical diagnosis, not a point prevalence and not a measure of biopsy-confirmed
    upper tract inflammation; because clinical diagnosis is both insensitive and
    nonspecific, it is not interchangeable with the true burden of upper genital tract
    infection.
  evidence:
  - reference: PMID:34396398
    reference_title: "A Review of the Challenges and Complexities in the Diagnosis, Etiology, Epidemiology, and Pathogenesis of Pelvic Inflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 4.4% of all sexually experienced women and 10% of women with a previously diagnosed STI received a diagnosis of PID in their lifetime"
    explanation: >
      Gives the NHANES lifetime self-reported diagnosis prevalence used for this record.

pathophysiology:
- name: Lower Genital Tract Infection and Cervical Colonization
  biological_scale: TISSUE
  description: >
    Establishment of Neisseria gonorrhoeae, Chlamydia trachomatis, Mycoplasma genitalium
    or bacterial-vaginosis-associated anaerobes at the endocervix. This is the reservoir
    from which the upper tract is seeded, and it is where the disease is interruptible:
    detecting and treating cervical infection at this stage prevents PID, whereas nothing
    downstream reverses tubal damage once it has occurred. Most cervical infection is
    asymptomatic, which is why the node is usually crossed unobserved.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  locations:
  - preferred_term: uterine cervix
    term:
      id: UBERON:0000002
      label: uterine cervix
  evidence:
  - reference: PMID:34396413
    reference_title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neisseria gonorrhoeae and Chlamydia trachomatis are the 2 most commonly recognized PID pathogens."
    explanation: >
      Names the two classical organisms colonizing the lower tract before ascent.
  - reference: PMID:34396398
    reference_title: "A Review of the Challenges and Complexities in the Diagnosis, Etiology, Epidemiology, and Pathogenesis of Pelvic Inflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent studies of women with PID have reported that fewer than half of women receiving a diagnosis of PID have gonococcal or chlamydial infection, while Mycoplasma genitalium, respiratory pathogens, and the constellation of bacteria associated with bacterial vaginosis may account for a substantial fraction of PID cases."
    explanation: >
      Establishes that the causative organism pool is broader than the two classical
      pathogens, which is why this node is not named for a single species.
  downstream:
  - target: Ascension to the Upper Genital Tract
    causal_link_type: DIRECT
    description: >
      Organisms established at the cervix move upward into the endometrial cavity and
      fallopian tubes.
    evidence:
    - reference: PMID:34396413
      reference_title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pelvic inflammatory disease (PID) results from ascension of sexually transmitted pathogens from the lower genital tract to the uterus and/or fallopian tubes in women, with potential spread to neighboring pelvic organs."
      explanation: >
        States the ascent from lower to upper genital tract as the defining causal step.

- name: Loss of Vaginal Lactobacillus Dominance
  biological_scale: TISSUE
  description: >
    Replacement of a lactobacillus-dominated vaginal community by a diverse anaerobic
    consortium (Gardnerella vaginalis, Megasphaera, Atopobium). This is the bacterial
    vaginosis arm of PID: it supplies organisms that can themselves ascend, and it is the
    reason anaerobic coverage is part of the regimen. It is curated as a parallel entry
    route rather than as a step in the sexually transmitted chain, because it does not
    require acquisition of a classical STI pathogen.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
    modifier: ABNORMAL
  locations:
  - preferred_term: vagina
    term:
      id: UBERON:0000996
      label: vagina
  evidence:
  - reference: PMID:33091407
    reference_title: "Bacterial vaginosis and its association with infertility, endometritis, and pelvic inflammatory disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bacterial vaginosis is characterized by a lower prevalence of lactobacilli and a higher prevalence of anaerobic bacteria, including Gardnerella vaginalis, Megasphaera spp., and Atopobium vaginae."
    explanation: >
      Defines the microbial shift this node represents.
  - reference: PMID:32052831
    reference_title: "A Randomized Controlled Trial of Ceftriaxone and Doxycycline, With or Without Metronidazole, for the Treatment of Acute Pelvic Inflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anaerobic organisms are important pathogens in acute pelvic inflammatory disease (PID)."
    explanation: >
      Independent trial-based statement that anaerobes are genuine PID pathogens, not
      bystanders, supporting this as a causal node.
  downstream:
  - target: Ascension to the Upper Genital Tract
    causal_link_type: UNKNOWN
    description: >
      Anaerobes from the disturbed vaginal community reach the endometrium. The edge is
      typed UNKNOWN deliberately: the association with endometritis and PID is well
      documented, but the review that states it also states that the mechanism of ascent
      is unclear.
    evidence:
    - reference: PMID:33091407
      reference_title: "Bacterial vaginosis and its association with infertility, endometritis, and pelvic inflammatory disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Endometritis and pelvic inflammatory disease are caused by the ascension of pathogenic bacteria to the uterus, although the mechanisms by which they do so are unclear."
      explanation: >
        Supports the ascent while explicitly disclaiming knowledge of the mechanism, which
        is why the edge is typed UNKNOWN and the evidence marked PARTIAL.

- name: Ascension to the Upper Genital Tract
  biological_scale: TISSUE
  description: >
    Arrival of organisms in the endometrial cavity and fallopian tubes, producing the
    endometritis-salpingitis spectrum that is PID. Because the endometrium and tube are
    contiguous, the same event is named endometritis, salpingitis, tubo-ovarian abscess
    or pelvic peritonitis depending on how far it has extended, and these are not
    separate diseases.
  cell_types:
  - preferred_term: fallopian tube multiciliated epithelial cell
    term:
      id: CL:4030007
      label: fallopian tube multiciliated epithelial cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: endometrium
    term:
      id: UBERON:0001295
      label: endometrium
  - preferred_term: fallopian tube
    term:
      id: UBERON:0003889
      label: fallopian tube
  evidence:
  - reference: PMID:34396398
    reference_title: "A Review of the Challenges and Complexities in the Diagnosis, Etiology, Epidemiology, and Pathogenesis of Pelvic Inflammatory Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endometritis, salpingitis, tubo-ovarian abscess, and pelvic peritonitis are all on the spectrum of inflammatory processes comprising PID."
    explanation: >
      States that the named clinical entities are one spectrum, which is what this node
      represents.
  - reference: PMID:25592078
    reference_title: "Pathogenesis of fallopian tube damage caused by Chlamydia trachomatis infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If infections are either not resolved or left untreated, chlamydia can ascend to the upper FGT and infect the fallopian tubes (FTs) causing salpingitis that may lead to functional damage of the FTs and tubal factor infertility (TFI)."
    explanation: >
      Traces the chain from untreated lower tract infection through ascent to salpingitis
      and functional tubal damage.
  downstream:
  - target: Intracellular Survival and Innate Immune Evasion
    causal_link_type: DIRECT
    description: >
      Organisms that reach the upper tract invade and persist within tubal epithelium and
      recruited phagocytes.
  - target: Neutrophil-Dominant Innate Inflammation with Dampened T-Cell Activation
    causal_link_type: DIRECT
    description: >
      Upper tract infection provokes an innate, myeloid-dominated inflammatory response in
      the endometrium.
    evidence:
    - reference: PMID:34396413
      reference_title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A study of women with N. gonorrhoeae- and/or C. trachomatis-induced PID with histologic endometritis revealed activation of myeloid cell, cell death, and innate inflammatory pathways in conjunction with dampening of T-cell activation pathways."
      explanation: >
        Human endometrial-disease transcriptional evidence for the character of the
        response this edge produces.
  - target: Tubo-ovarian Abscess and Pelvic Peritonitis
    causal_link_type: DIRECT
    description: >
      Continued spread beyond the tubal lumen to the ovary and peritoneal cavity.
    evidence:
    - reference: PMID:34396398
      reference_title: "A Review of the Challenges and Complexities in the Diagnosis, Etiology, Epidemiology, and Pathogenesis of Pelvic Inflammatory Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Endometritis, salpingitis, tubo-ovarian abscess, and pelvic peritonitis are all on the spectrum of inflammatory processes comprising PID."
      explanation: >
        Places abscess and peritonitis at the extended end of the same spectrum.

- name: Intracellular Survival and Innate Immune Evasion
  biological_scale: CELLULAR
  description: >
    Both classical PID pathogens persist inside host epithelial cells and neutrophils and
    actively subvert the innate response, which is why the infection is chronic and why
    the therapeutic requirement is for an agent that reaches the intracellular
    compartment. This is the lifestyle-gating step: it constrains which drugs can work,
    independently of any organism's in vitro susceptibility.
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  role: intrinsic_resistance
  cell_types:
  - preferred_term: fallopian tube multiciliated epithelial cell
    term:
      id: CL:4030007
      label: fallopian tube multiciliated epithelial cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:34396413
    reference_title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their ability to survive within host epithelial cells and neutrophils highlights a need for T-cell-mediated production of interferon γ in protection."
    explanation: >
      States the intracellular niche in the two classical PID pathogens, which is the
      module's gating condition.
  - reference: PMID:34396413
    reference_title: "Pelvic Inflammatory Disease Due to Neisseria gonorrhoeae and Chlamydia trachomatis: Immune Evasion Mechanisms and Pathogenic Disease Pathways."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both pathogens exert multiple mechanisms of immune evasion that benefit themselves and each other at the expense of the host."
    explanation: >
      Supports the active immune-evasion component of this node, curated separately from
      the intracellular-niche claim because it is a distinct assertion.
  - reference: PMID:18611821
    reference_title: "Intracellular organisms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The intracellular location of some microorganisms allow them to resist antibiotics with poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam compounds."
    explanation: >
      The general principle the module encodes, cited here to justify the conformance
      rather than to assert anything PID-specific. Evidence source OTHER as this is a
      review.
  downstream:
  - target: Requirement for a Cell-Penetrant Antimicrobial
    causal_link_type: DIRECT
    description: >
      Because the organisms sit inside host cells, effective therapy is restricted to
      agents that accumulate intracellularly.

- name: Requirement for a Cell-Penetrant Antimicrobial
  biological_scale: MOLECULAR
  description: >
    The therapeutic consequence of the intracellular niche: efficacy tracks the
    intracellular concentration achieved rather than the in vitro MIC, so doxycycline
    rather than the cephalosporin is the component of the PID regimen that addresses
    chlamydial upper tract infection. This node exists to carry that constraint
    explicitly; it is why every recommended PID regimen pairs a cephalosporin with a
    tetracycline instead of escalating the cephalosporin.
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  role: therapeutic_vulnerability
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:28639230
    reference_title: "Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therapeutic efficacy against intracellular pathogens has been correlated mainly with the intracellular concentrations achieved by the different antimicrobial agents."
    explanation: >
      The pharmacokinetic principle the node encodes. Evidence source OTHER as this is a
      review.
  - reference: PMID:31524362
    reference_title: "Pelvic Inflammatory Disease: Diagnosis, Management, and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mild to moderate disease can be treated in an outpatient setting with a single intramuscular injection of a recommended cephalosporin followed by oral doxycycline for 14 days."
    explanation: >
      Shows the recommended regimen pairing a cephalosporin with the cell-penetrant
      tetracycline, which is the clinical expression of this requirement.

- name: Neutrophil-Dominant Innate Inflammation with Dampened T-Cell Activation
  biological_scale: TISSUE
  description: >
    The host response that actually causes the damage. Endometrial tissue from women with
    histologically confirmed PID shows activation of myeloid, cell death and innate
    inflammatory programmes together with suppression of T-cell activation — an
    inflammatory response that is intense but non-protective, which is consistent with the
    absence of durable immunity after natural infection and with the high rate of
    reinfection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
    modifier: DECREASED
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: tumor necrosis factor production
    term:
      id: GO:0032640
      label: tumor necrosis factor production
    modifier: INCREASED
  locations:

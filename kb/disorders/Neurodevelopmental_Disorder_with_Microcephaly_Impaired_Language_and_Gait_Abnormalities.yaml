name: Neurodevelopmental Disorder with Microcephaly, Impaired Language, and Gait Abnormalities
creation_date: '2026-08-18T00:00:00Z'
category: Mendelian
synonyms:
- NEDMILG
- NEDMILG, AR
- neurodevelopmental disorder with microcephaly, impaired language, and gait abnormalities,
  autosomal recessive
- NARS1-related neurodevelopmental disorder, autosomal recessive
- asparaginyl-tRNA synthetase 1 deficiency
description: >-
  Neurodevelopmental disorder with microcephaly, impaired language, and gait
  abnormalities (NEDMILG, OMIM:619091) is an ultra-rare autosomal recessive
  disorder caused by biallelic variants in NARS1, which encodes the cytoplasmic
  class IIa asparaginyl-tRNA synthetase (AsnRS). Affected children present in
  infancy with global developmental delay, and go on to show progressive
  microcephaly, impaired intellectual development with poor or absent speech and
  language, and delayed walking with variable gait abnormalities that may be
  ataxic, spastic, or both. Muscle tone may be low or high, early-onset seizures
  are common, and a demyelinating or axonal peripheral sensorimotor neuropathy
  affects a subset, so the clinical picture spans both the central and peripheral
  nervous systems. Many patients follow a neurodegenerative course, with
  progressive cerebral and cerebellar atrophy on serial imaging. Mechanistically
  the recessive alleles are hypomorphic: patient fibroblasts and induced neural
  progenitor cells carry reduced NARS1 protein and roughly half-normal
  tRNA-asparagine charging activity, global protein synthesis falls, and
  patient-derived cortical brain organoids fail to expand because radial glial
  progenitor proliferation is impaired — a direct cellular counterpart of the
  microcephaly. This is the recessive arm of the broader NARS1-related
  neurologic disorders spectrum; the dominant/de novo arm (NEDMILEG,
  OMIM:619092) and dominant NARS1 hereditary neuropathy are distinct entities
  driven by dominant-negative rather than hypomorphic alleles (see notes).

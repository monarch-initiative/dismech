    translational insufficiency in post-mitotic neurons superimposes a degenerative
    component on the developmental deficit. Brain MRI in affected individuals shows
    severe microcephaly with diffuse cerebral and cerebellar atrophy, loss of both
    grey and white matter volume, and ventriculomegaly, with milder cortical and

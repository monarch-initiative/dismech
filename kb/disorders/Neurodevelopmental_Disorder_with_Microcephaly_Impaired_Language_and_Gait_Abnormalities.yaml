  downstream:
  - target: Combined Central and Peripheral Nervous System Dysfunction
- name: Peripheral Nerve Involvement
  description: >-
    A subset of affected individuals develop a peripheral sensorimotor neuropathy,
    demyelinating or axonal, with atrophy predominantly of the distal lower limbs.
    Nerve conduction studies can be abnormal in early childhood. Peripheral nerve
    is a second high-demand compartment for the same reason as the cortex — long
    axons and myelinating Schwann cells sustain heavy biosynthetic loads — and its
    involvement is what makes NARS1 disease a combined CNS/PNS disorder rather

- name: Increased Cortical Progenitor Apoptosis
  description: >-
    Alongside reduced division, patient-derived cortical organoids show markedly
    elevated programmed cell death in the progenitor compartment. The founding
    organoid study attributes the size deficit to both routes rather than to
    proliferation failure alone, so the neuroepithelium is depleted by two

genetic:
- name: NARS1
  gene_term:
    preferred_term: NARS1
    term:
      id: hgnc:7643
      label: NARS1
  relationship_type: CAUSATIVE
  presence: PRESENT
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:32788587
      reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
        organoids and leads to microcephaly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Candidate variants were validated by Sanger sequencing in all available
        blood samples and reprogrammed iPS cells from MIC-1433 and MIC-2116 and segregated
        according to a recessive mode of inheritance.
      explanation: >-
        Segregation analysis confirming that the NARS1 alleles behave recessively in
        the reported families.
  notes: >-
    NARS1 (chromosome 18q21.31) encodes the cytoplasmic class IIa asparaginyl-tRNA
    synthetase, a 548-residue obligate homodimer with a eukaryote-specific unique
    N-terminal extension (UNE-N), an anticodon-binding domain and a C-terminal
    catalytic domain. It is the only enzyme charging asparagine onto cytoplasmic
    tRNA-Asn; the mitochondrial reaction is carried out by the separate gene NARS2.
    Biallelic variants causing this disorder are distributed across the UNE-N and
    catalytic domains, are conserved across mammals and most vertebrates, and act
    by partial loss of function.
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identify biallelic missense and frameshift mutations in NARS1
      in seven patients from three unrelated families with microcephaly and neurodevelopmental
      delay.
    explanation: Establishes NARS1 as the causal gene for the biallelic phenotype.
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'There are two NARS genes: NARS1 functions in the cytoplasm while NARS2
      functions in mitochondria, solely responsible for asparagine tRNA charging in
      these locations.'
    explanation: >-
      Distinguishes NARS1 from the mitochondrial paralogue NARS2, whose disorders are
      unrelated to this entry.
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequence alignment of NARS1 from vertebrates showed that the residues
      mutated in patients were conserved across all mammals and most vertebrates.
    explanation: Evolutionary conservation supporting pathogenicity of the recessive alleles.
  variants:
  - name: NM_004539.4:c.1633C>T (p.Arg545Cys)
    description: >-
      The recurrent biallelic missense allele, reported homozygous in a consanguineous
      Indian family and independently recognised as one of the two most recurrent
      NARS1 mutations across families. It lies in the catalytic domain, but its side
      chain points away from both the dimer interface and the active site, so it
      destabilises locally rather than poisoning the homodimer — the structural
      distinction from the recurrent dominant alleles.
    evidence:
    - reference: PMID:32738225
      reference_title: De Novo and Bi-allelic Pathogenic Variants in NARS1 Cause Neurodevelopmental
        Delay Due to Toxic Gain-of-Function and Partial Loss-of-Function Effects.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: Molecular modeling of the recessive c.1633C>T (p.Arg545Cys) variant
        shows weaker spatial positioning and tRNA selectivity.
      explanation: Names the allele and its modelled functional consequence.
    - reference: PMID:40914244
      reference_title: Dominant-negative NARS1 R534* mutation causes wild-type subunit
        poisoning and heterodimer predominance in cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Among them, the mono-allelic nonsense mutation R534∗ and bi-allelic        \ missense mutation R545C are the most recurrent mutations arising in multiple        \ independent families."
      explanation: >-
        Identifies p.Arg545Cys as one of the two most recurrent NARS1 alleles, arising
        in multiple independent families, and as the biallelic (recessive) member of
        the pair, distinct from the recurrent mono-allelic p.Arg534Ter.
  - name: NM_004539.4:c.50C>T (p.Thr17Met)
    description: >-
      Homozygous missense allele in the eukaryote-specific UNE-N domain, reported in
      a consanguineous Libyan family with three affected siblings who additionally
      showed progeroid facial features.
    evidence:
    - reference: PMID:32788587
      reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
        organoids and leads to microcephaly.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A homozygous missense variant (c.50C > T, p.T17M) was found in MIC-1433.
      explanation: Names the allele and the family in which it segregated.
  - name: NM_004539.4:c.662A>G (p.Asn221Ser) and c.1155dup (p.Arg386ThrfsTer19)
    description: >-
      Compound heterozygous pair reported in a patient presenting with failure to
      thrive, acquired microcephaly and progressive dysphagia, inherited one from each
      parent.
    evidence:
    - reference: PMID:38652341
      reference_title: 'Early-onset dysphagia and severe neurodevelopmental disorder
        as early signs in a patient with two novel variants in NARS1: a case report
        and brief review of the literature.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Exome sequencing (ES) was performed, detecting two novel compound
        heterozygous variants in the NARS1 gene
      explanation: >-
        Establishes that the patient carries two novel NARS1 variants in the compound
        heterozygous state. The quote is trimmed before the variant nomenclature
        because the bracketed HGVS spans are stripped by the reference validator.

experimental_models:
- name: Patient-derived cortical brain organoids (biallelic NARS1)
  description: >-
    Cortical organoids differentiated from induced pluripotent stem cells of two
    affected individuals and two unaffected relatives from the founding biallelic
    families. At 28 days in vitro the organoids are indistinguishable; by day 52 the
    patient organoids are visibly smaller, and by day 90 none exceed 5 mm whereas
    almost all control organoids do. Daily monitoring excluded shrinkage — patient
    organoids simply never grow. This is the flagship human model of the disorder and
    the reason the microcephaly can be attributed to a progenitor-proliferation defect
    rather than to postnatal degeneration alone.
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  cell_source: iPSC reprogrammed from patient fibroblasts (families MIC-1433 and MIC-2116)
  publication: PMID:32788587
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These results suggest that COs from NARS1 patients are reduced in size,
      modeling patient microcephaly.
    explanation: >-
      The authors' own statement that the organoid reproduces the patients' defining
      feature, which is what qualifies it as a disease model rather than an incidental
      cell system.
  modeled_mechanisms:
  - target: Radial Glial Progenitor Proliferation Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The organoid reproduces the human progenitor defect directly: reduced radial
      glial proliferation, fewer and smaller SOX2-positive neural rosettes, and
      depletion of TUJ1-positive post-mitotic neurons.
    limitations: >-
      Cortical organoids model fetal corticogenesis only. They cannot reproduce the
      postnatal neurodegenerative arm of the disease, the peripheral neuropathy, or
      the seizure phenotype, and they lack vasculature and microglia.
    readouts:
    - name: Organoid diameter at day 90 in vitro
      target: Radial Glial Progenitor Proliferation Failure
      direction: DECREASED
      interpretation: >-
        Tissue-level size deficit standing in for the reduced brain volume of the
        patients.
      evidence:
      - reference: PMID:32788587
        reference_title: Loss of NARS1 impairs progenitor proliferation in cortical
          brain organoids and leads to microcephaly.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: By div 90 the vast majority of unaffected COs were > 5 mm, whereas
          none of the affected COs were > 5 mm, and in fact most were <1 mm diameter.
        explanation: Reports the measured size difference at the terminal timepoint.
    - name: CTIP2-positive deep-layer cortical neuron output
      target: Radial Glial Progenitor Proliferation Failure
      direction: DECREASED
      interpretation: >-
        Layer-specific readout of the neuronal output lost when the progenitor pool
        fails to expand, more specific than bulk TUJ1 depletion.
      evidence:
      - reference: PMID:32788587
        reference_title: Loss of NARS1 impairs progenitor proliferation in cortical
          brain organoids and leads to microcephaly.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: COs from affected show less CTIP2+ deep layer neurons
        explanation: Reports the reduced deep-layer neuron output in patient organoids.
    - name: Number and diameter of SOX2-positive neural rosettes
      target: Radial Glial Progenitor Proliferation Failure
      direction: DECREASED
      interpretation: >-
        Structural readout of radial glial generation and neuroepithelial organisation.
      evidence:
      - reference: PMID:32788587
        reference_title: Loss of NARS1 impairs progenitor proliferation in cortical
          brain organoids and leads to microcephaly.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The number of typical spherical SOX2+ rosettes, as well as the thickness
          of SOX2+ rosettes, which were measured as the diameter, were significantly
          decreased in affected COs compared to unaffected COs
        explanation: Quantified rosette deficit in patient organoids.
    evidence:
    - reference: PMID:32788587
      reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
        organoids and leads to microcephaly.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Cortical brain organoid modeling shows reduced proliferation of radial
        glial cells (RGCs), leading to smaller organoids characteristic of microcephaly.
      explanation: >-
        Supports treating the organoid as informative for the progenitor-proliferation
        node.
  - target: Impaired Global Protein Synthesis
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      The same iPSC lines that seed the organoids were used to quantify bulk
      translation by puromycin pulse labelling.
    limitations: >-
      Measured in undifferentiated iPSCs rather than in the organoid neuroepithelium,
      so it establishes the translational deficit in the patient genotype but not its
      magnitude in radial glia specifically.
    readouts:
    - name: Puromycin incorporation into nascent protein
      target: Impaired Global Protein Synthesis
      direction: DECREASED
      interpretation: Direct measure of global protein synthesis rate.
      evidence:
      - reference: PMID:32788587
        reference_title: Loss of NARS1 impairs progenitor proliferation in cortical
          brain organoids and leads to microcephaly.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: Patient IPSCs showed reduced puromycin incorporation after 1 h pulse,
          indicating reduced protein synthesis.
        explanation: The measurement and its direction.
    evidence:
    - reference: PMID:32788587
      reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
        organoids and leads to microcephaly.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Patient cells show reduced NARS1 protein, impaired NARS1 activity and
        impaired global protein synthesis.
      explanation: Establishes the patient cell system as informative for the translation node.
- name: Patient-derived fibroblasts and induced neural progenitor cells
  description: >-
    Primary skin fibroblasts and induced neural progenitor cells from affected
    individuals, used to establish that the recessive alleles are hypomorphic. NARS1
    protein is reduced by about half and tRNA-charging activity by about half, while
    the charging activity of three other aminoacyl-tRNA synthetases measured in the
    same cells is normal.
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: Patient skin fibroblasts and iNPCs derived from them
  publication: PMID:32738225
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We conclude that NARS1 is expressed in the brain, that missense variants
      impact protein stability, and that patient cells display reduced NARS1 protein
      levels and activity.
    explanation: >-
      Establishes that the patient-derived cell system carries the biochemical defect,
      which is what makes it informative about the disease mechanism.
  modeled_mechanisms:
  - target: Reduced Cytoplasmic Asparaginyl-tRNA Charging
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Quantifies the residual enzyme level and aminoacylation activity that define the
      partial-loss-of-function mechanism.
    limitations: >-
      Fibroblasts are not a disease-relevant tissue; the iNPCs are closer but are a
      two-dimensional culture that does not reproduce the proliferative architecture
      of the cortical neuroepithelium.
    readouts:
    - name: NARS1 tRNA-charging activity
      target: Reduced Cytoplasmic Asparaginyl-tRNA Charging
      direction: DECREASED
      interpretation: >-
        Residual roughly half-normal activity, the quantitative basis for calling the
        recessive alleles hypomorphic rather than null.
      evidence:
      - reference: PMID:32738225
        reference_title: De Novo and Bi-allelic Pathogenic Variants in NARS1 Cause
          Neurodevelopmental Delay Due to Toxic Gain-of-Function and Partial Loss-of-Function
          Effects.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: We demonstrate a reduction in NARS1 mRNA expression as well as in
          NARS1 enzyme levels and activity in both individual fibroblasts and induced
          neural progenitor cells (iNPCs).
        explanation: The measurement and its direction in both cell types.
    evidence:
    - reference: PMID:32788587
      reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
        organoids and leads to microcephaly.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Both patient cell lines had activity reduced by about half.
      explanation: >-
        Independent replication quantifying the residual activity, supporting the cell
        system as informative for this node.
diagnosis:
- name: Molecular genetic testing for biallelic NARS1 variants
  description: >-
    There is no biochemical marker; diagnosis rests on recognising the clinical
    phenotype and demonstrating biallelic NARS1 pathogenic variants, in practice
    almost always by exome or genome sequencing or a broad developmental-delay
    multigene panel.
  presence: PRESENT
  evidence:
  - reference: PMID:40014750
    reference_title: NARS1-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of a NARS1-related neurologic disorder is established in
      a proband with suggestive findings and either biallelic or heterozygous NARS1
      pathogenic variants in those with NARS1-NDD or a NARS1 heterozygous pathogenic
      variant in those with NARS1-related hereditary neuropathy identified by molecular
      genetic testing.
    explanation: >-
      GeneReviews states the diagnostic standard; for this entity the relevant limb is
      the biallelic one.
  - reference: PMID:37393059
    reference_title: Genomic analysis of multiplex consanguineous families reveals
      causes of neurodevelopmental disorders with epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Previously reported homozygous variants of CNTNAP2, TRIT1 and NARS1 were
      found in individuals from three families.
    explanation: >-
      Illustrates exome sequencing recovering a homozygous NARS1 variant in a
      consanguineous neurodevelopmental-disorder cohort.
- name: Brain MRI
  description: >-
    Neuroimaging supports the diagnosis and documents progression: diffuse cerebral
    and cerebellar atrophy with grey and white matter volume loss and ventriculomegaly,
    milder on earlier scans.
  presence: PRESENT
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Brain MRI from the affected in 1433-III-3 showed severe microcephaly,
      diffuse cerebral and cerebellar atrophy, with both gray and white matter volume
      loss, and ventriculomegaly'
    explanation: Describes the characteristic imaging findings.
- name: Nerve conduction studies
  description: >-
    Nerve conduction studies characterise the peripheral arm where present, and can be
    abnormal in early childhood, showing a predominantly sensory demyelinating pattern
    in the recessive form.
  presence: PRESENT
  evidence:
  - reference: PMID:38652341
    reference_title: 'Early-onset dysphagia and severe neurodevelopmental disorder
      as early signs in a patient with two novel variants in NARS1: a case report and
      brief review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: NCV (Nerve Conduction Velocity) showed four limbs neuropathy, neurophysiological
      examination performed at 2 years of age mainly sensory and demyelinating.
    explanation: Nerve conduction studies establishing the neuropathy at age two.

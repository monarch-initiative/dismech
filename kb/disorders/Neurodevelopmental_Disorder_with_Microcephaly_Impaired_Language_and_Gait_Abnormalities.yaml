    snippet: Disruption of these interactions by the R545C mutation would thus likely
      result in local destabilization
    explanation: >-
      Structural analysis of the recurrent recessive p.Arg545Cys residue, whose
      side chain points away from both the dimer interface and the active site —
      the structural reason it destabilises locally rather than poisoning the
      dimer as the dominant alleles do.
  downstream:
  - target: Reduced Cytoplasmic Asparaginyl-tRNA Charging
- name: Reduced Cytoplasmic Asparaginyl-tRNA Charging
  description: >-
    NARS1 is the sole enzyme that charges asparagine onto cytoplasmic tRNA-Asn.
    Patient fibroblasts and induced neural progenitor cells carry roughly half the
    normal amount of NARS1 protein and about half the normal tRNA-charging
    activity, and overexpression of the patient missense alleles shows the mutant
    proteins are unstable. The defect is specific: charging activity of the
    arginyl-, lysyl- and threonyl-tRNA synthetases is unaffected in the same
    cells, so this is not a general collapse of the translational apparatus but a
    targeted shortfall in one aminoacylation reaction.

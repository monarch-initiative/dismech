    Counselling covers the 25% per-pregnancy recurrence risk for carrier couples, the
    unaffected status of heterozygous siblings, and the availability of prenatal and
    preimplantation genetic testing once the familial variant pair is known. Carrier
    testing of at-risk relatives requires prior identification of the familial
    variants.

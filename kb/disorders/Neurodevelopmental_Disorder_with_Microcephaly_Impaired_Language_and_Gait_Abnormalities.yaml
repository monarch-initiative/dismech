- name: Radial Glial Progenitor Proliferation Failure
  description: >-
    The developing cortical neuroepithelium is the tissue least able to tolerate a
    translational shortfall, because radial glial cells must sustain a very high
    biosynthetic rate through repeated rounds of division. In patient-derived
    cortical brain organoids, DNA synthesis is reduced, SOX2-positive neural
    rosettes are fewer, smaller and poorly organised, and the mature-neuron marker
    TUJ1 is depleted, indicating failed generation of radial glia and consequent
    loss of the post-mitotic neuronal output pool. Single-cell profiling shows the
    astrocytic and radial glial lineages are both altered.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

notes: >-
  Scope and naming. This entry covers ONLY the autosomal recessive entity
  MONDO:0100348 / OMIM:619091 (NEDMILG), caused by biallelic hypomorphic NARS1
  variants. Two allelic entities are deliberately out of scope and must not be
  merged into it: (1) NEDMILEG (MONDO:0030837 / OMIM:619092), the autosomal
  dominant / de novo form whose name additionally carries "epilepsy", and (2)
  dominant NARS1-related hereditary neuropathy, an adolescent- or adult-onset
  axonal/sensorimotor Charcot-Marie-Tooth-type neuropathy (PMID:38495304). The
  two arms differ mechanistically, not just clinically: recessive alleles act by
  partial loss of function, whereas the recurrent dominant alleles (p.Arg534Ter,
  p.Arg522Ter and catalytic-domain missense changes) act by poisoning the
  obligate homodimer (PMID:40968538, PMID:40914244). Where a source reports on
  the whole NARS1 spectrum without separating the arms, that is stated in the
  evidence explanation rather than silently attributed to the recessive form.

  Named-entity confusion risk. NARS1 (cytoplasmic, chromosome 18q21.31) is a
  different gene from NARS2 (mitochondrial); NARS2 causes combined oxidative
  phosphorylation deficiency 24 and NARS2-related hearing loss, which are
  unrelated to this entry. Separately, NARS1 is the anti-KS autoantigen in
  antisynthetase syndrome (already curated in this KB) — an autoimmune disease in
  which the protein is a target, not a mutated enzyme. A `just preflight-dr` NEC
  check of the deep-research report against MONDO:0100348 returned PASS
  (NARS1=38 mentions, report OMIM 619091 matching the MONDO xref).

  Datasets. `just discover-datasets` returns no GEO candidates for this disorder,
  which is the expected result for an entity with a few dozen reported individuals
  worldwide. No `datasets:` block is recorded rather than reaching for a gene-only
  NARS1 search, which would surface antisynthetase-syndrome and unrelated
  translation-biology series (the Named Entity Confusion trap the dataset SOP warns
  about).

  Findings recorded but not curated as phenotypes. The founding biallelic series
  reports cataracts in the two brothers homozygous for p.Arg545Cys and in none of the
  other five individuals, plus isolated single-patient findings (medullary sponge
  kidney, hepatic hemangioma, contractures). These come from a per-proband clinical
  table whose cells do not survive text extraction into a quotable sentence, so they
  are recorded here as prose rather than as evidence-backed phenotype entries. They
  are worth revisiting if a later series describes them in running text.

  Recurrent recessive allele. p.Arg545Cys (c.1633C>T) is the recurrent biallelic
  missense variant reported in multiple independent families; it is not the same
  as the recurrent dominant nonsense allele p.Arg534Ter, despite the adjacent
  residue numbers.
inheritance:
- name: Autosomal recessive
  description: >-
    NEDMILG requires biallelic (homozygous or compound heterozygous) NARS1
    variants. Heterozygous carrier parents and carrier siblings are unaffected.
    Much of the reported recessive case ascertainment comes from consanguineous
    families, in which homozygous variants segregate. Note that NARS1-related
    neurodevelopmental disease as a whole can also be dominant/de novo; only the
    biallelic form is this entity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40014750
    reference_title: NARS1-Related Neurologic Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: If both parents are known to be heterozygous for a NARS1 pathogenic variant,
      each sib of an individual with autosomal recessive NARS1-NDD has at conception
      a 25% chance of being affected, a 50% chance of being heterozygous, and a 25%
      chance of inheriting neither of the familial pathogenic variants.
    explanation: >-
      GeneReviews states the standard autosomal recessive recurrence risk for the
      biallelic form, which is this entity.
  - reference: PMID:40014750
    reference_title: NARS1-Related Neurologic Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: 'NARS1-NDD can be inherited in an autosomal recessive or autosomal dominant
      manner.'
    explanation: >-
      Confirms that recessive inheritance is one of two modes across NARS1-NDD as
      a whole; PARTIAL because the sentence covers both arms and only the
      recessive arm is in scope here.
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here, we identify biallelic missense and frameshift mutations in NARS1
      in seven patients from three unrelated families with microcephaly and neurodevelopmental
      delay.
    explanation: >-
      An independent series in which all affected individuals carry biallelic
      variants segregating recessively.
- name: Homozygosity in consanguineous families
  description: >-
    In consanguineous pedigrees the causative NARS1 variants are homozygous and
    fall within blocks of homozygosity; in the non-consanguineous family reported
    alongside them the variants were compound heterozygous. This is the expected
    ascertainment pattern for an ultra-rare recessive disorder rather than
    evidence of a founder allele.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the families with parental consanguinity, homozygous variants were
      identified, whereas in the family without parental consanguinity, a compound
      heterozygous mutation was identified.
    explanation: Directly states the homozygous-versus-compound-heterozygous split by pedigree.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence has ever been estimated, so no rate is
    recorded. The cumulative published literature covers 54 individuals from 30
    families across the whole NARS1-related neurologic disorder spectrum
    (recessive NEDMILG, dominant NEDMILEG, and dominant hereditary neuropathy
    together), of whom only a subset carry the biallelic genotype that defines
    this entity. Reported families span Libyan, Turkish, Indian and Pakistani
    ancestries with no evidence of a founder allele.
  evidence:
  - reference: PMID:40014750
    reference_title: NARS1-Related Neurologic Disorders.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: To date, 54 individuals from 30 families with NARS1 pathogenic variant(s)
      have been reported.
    explanation: >-
      Gives the cumulative published case count. PARTIAL because the figure spans
      the whole NARS1 spectrum, not the recessive entity alone.
  - reference: PMID:42381704
    reference_title: Therapeutic rescue of pathogenic asparaginyl-tRNA synthetase alleles.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: The prevalence of NARS1 disease is extremely low, with 54 cases across
      30 distinct families currently reported.
    explanation: >-
      Independent restatement of ultra-rarity and of the same cumulative count;
      PARTIAL for the same spectrum-level scope reason.
progression:
- age_range: Infancy
  notes: >-
    Global developmental delay is apparent in infancy. Head circumference may be
    within or near the normal range at birth and fall progressively thereafter,
    so the microcephaly is characteristically postnatal and acquired rather than
    congenital. Feeding difficulty, failure to thrive and hypotonia can be the
    presenting concerns.
  evidence:
  - reference: PMID:38652341
    reference_title: 'Early-onset dysphagia and severe neurodevelopmental disorder
      as early signs in a patient with two novel variants in NARS1: a case report and
      brief review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We present the case of a patient referred in infancy for failure to thrive
      and acquired microcephaly (head circumference: -5 SD).'
    explanation: >-
      Documents infantile presentation and explicitly describes the microcephaly
      as acquired.
- age_range: Childhood to adulthood
  notes: >-
    Many patients follow a degenerative rather than static course: serial imaging
    shows progressive cerebral and cerebellar atrophy with ventriculomegaly, and
    ataxia and dysarthria evolve over time. Survival into adulthood occurs — the
    founding organoid series included affected individuals followed to 17, 22 and
    33 years — but several affected children in that series died in the first or
    second decade.
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We conclude that biallelic loss of NARS1 leads to progressive loss of
      cortical volume, consistent with the neurodegenerative clinical course.
    explanation: >-
      States the progressive, neurodegenerative trajectory of the biallelic
      phenotype on serial neuroimaging.
pathophysiology:
- name: Biallelic Hypomorphic NARS1 Variants
  description: >-
    The initiating lesion is a pair of NARS1 alleles, in trans, that reduce but do
    not abolish asparaginyl-tRNA synthetase function. Reported recessive alleles
    include missense changes in the unique N-terminal extension (UNE-N) domain
    (p.Thr17Met), in the catalytic domain (p.Asp356Ala, the recurrent
    p.Arg545Cys), and frameshift alleles (p.Met69AspfsTer4,
    p.Arg386ThrfsTer19). Complete loss of the enzyme is not compatible with life,
    so disease-causing biallelic genotypes are necessarily partial-function rather
    than null. Structural modelling of p.Arg545Cys predicts weaker spatial
    positioning and reduced tRNA selectivity through local destabilisation near
    the N-terminal end of the catalytic domain.

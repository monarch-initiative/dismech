- name: Impaired Global Protein Synthesis
  description: >-
    Because asparagine charging is rate-limiting for any transcript containing
    asparagine codons, the shortfall in charged tRNA-Asn reduces bulk cytoplasmic
    translation. Puromycin pulse labelling of patient-derived induced pluripotent
    stem cells shows a marked fall in incorporation into nascent protein relative
    to cells from unaffected parents.

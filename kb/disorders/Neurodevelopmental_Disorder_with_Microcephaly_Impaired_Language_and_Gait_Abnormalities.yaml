differential_diagnoses:
- name: Neurodevelopmental disorder with microcephaly, impaired language, epilepsy,
    and gait abnormalities (NEDMILEG)
  description: >-
    The allelic autosomal dominant / de novo NARS1 entity. It shares the microcephaly,
    impaired language and gait abnormality of this disorder and adds epilepsy to its
    designation, so the two are separated by inheritance mode and variant mechanism
    rather than by any single clinical sign.
  disease_term:
    preferred_term: neurodevelopmental disorder with microcephaly, impaired language,
      epilepsy, and gait abnormalities
    term:
      id: MONDO:0030837
      label: neurodevelopmental disorder with microcephaly, impaired language, epilepsy,
        and gait abnormalities
  distinguishing_features:
  - >-
    Heterozygous de novo NARS1 variant rather than biallelic variants; the recurrent
    dominant alleles (p.Arg534Ter, p.Arg522Ter) act by dominant-negative poisoning of
    the wild-type subunit through the obligate homodimer, and the resulting loss of
    enzyme activity in patient cells is more severe than for the recessive
    p.Arg545Cys genotype. Onset is at birth for the recurrent dominant allele versus
    childhood for the recurrent biallelic one.
  evidence:
  - reference: PMID:40968538
    reference_title: Asparaginyl-tRNA synthetase (NARS1) variants implicated in dominant
      neurological phenotypes display dominant-negative properties.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These studies revealed that NARS1 variants interact with the wild-type
      subunit and that the majority of variants repress the ability of the wild-type
      allele to support cellular growth, consistent with a dominant-negative effect.
    explanation: >-
      Establishes the dominant-negative mechanism that distinguishes the dominant arm
      from the hypomorphic recessive arm curated here.
  - reference: PMID:40914244
    reference_title: Dominant-negative NARS1 R534* mutation causes wild-type subunit
      poisoning and heterodimer predominance in cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AsnRS activity is more severely reduced in patient cells with the mono-allelic      \ R534∗ mutation than in those with the bi-allelic R545C mutation"
    explanation: >-
      Contrasts residual enzyme activity directly between the recurrent dominant
      genotype and the recurrent biallelic one, the quantitative distinction between
      the two entities.
- name: NARS1-related hereditary neuropathy
  description: >-
    An adolescent- or early-adult-onset dominant peripheral neuropathy caused by
    heterozygous NARS1 variants, now recognised as axonal Charcot-Marie-Tooth disease.
    It lacks the microcephaly, developmental delay and intellectual disability that
    define this entity.
  distinguishing_features:
  - >-
    Isolated peripheral nervous system involvement with adolescent or adult onset and
    no central nervous system phenotype; heterozygous rather than biallelic variants;
    axonal rather than the demyelinating pattern typically seen in the
    neurodevelopmental form. Variants causing the isolated peripheral phenotype have a
    milder dominant-negative effect than those causing combined CNS and PNS disease.
  evidence:
  - reference: PMID:38495304
    reference_title: Dominant NARS1 mutations causing axonal Charcot-Marie-Tooth disease
      expand NARS1-associated diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thus, NARS1 is the seventh ARS implicated in dominant axonal Charcot-Marie-Tooth
      disease, further stressing that all dimeric ARSs should be evaluated for Charcot-Marie-Tooth
      disease.
    explanation: >-
      Establishes the dominant axonal neuropathy as a separate NARS1-associated
      entity.
  - reference: PMID:40968538
    reference_title: Asparaginyl-tRNA synthetase (NARS1) variants implicated in dominant
      neurological phenotypes display dominant-negative properties.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Furthermore, our data suggest that NARS1 variants associated with CNS
      and PNS phenotypes have a more severe dominant-negative effect compared with those
      associated with an isolated PNS phenotype.
    explanation: >-
      Provides the mechanistic gradient separating the isolated-neuropathy phenotype
      from the combined neurodevelopmental one.
- name: Asparagine synthetase deficiency
  description: >-
    An autosomal recessive neurometabolic disorder caused by biallelic ASNS variants
    (chromosome 7q21) that is the closest phenocopy of this entity: severe congenital
    microcephaly, severe global developmental delay, intractable seizures or
    hyperekplexia, and spastic quadriparesis, with brain atrophy and delayed
    myelination on MRI. The two disorders sit on opposite sides of the same amino
    acid - asparagine synthetase deficiency impairs asparagine synthesis, whereas
    NARS1 disease impairs the charging of asparagine onto its tRNA.
  distinguishing_features:
  - >-
    Microcephaly is congenital in asparagine synthetase deficiency rather than
    postnatal and progressive as in this entity, and a simplified gyral pattern is
    characteristic of the ASNS disorder but is not a reported feature of NARS1
    disease.
  - >-
    CSF asparagine is low in asparagine synthetase deficiency and plasma asparagine
    may be low, which is the biochemical hallmark of that disorder. Measuring
    asparagine has been proposed as the routine discriminator, on the reasoning that a
    tRNA-charging defect should leave asparagine levels intact, but no NARS1 cohort
    has been assayed to confirm that, so the discriminator is at present an untested
    inference in the NARS1 direction.
  - >-
    Molecular testing is definitive: biallelic ASNS variants versus biallelic NARS1
    variants.
  evidence:
  - reference: PMID:27422383
    reference_title: Hyperekplexia, microcephaly and simplified gyral pattern caused
      by novel ASNS mutations, case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Asparagine synthetase deficiency (OMIM# 615574) is a very rare newly
      described neurometabolic disorder characterized by congenital microcephaly and
      severe global developmental delay, associated with intractable seizures or hyperekplexia.'
    explanation: >-
      Establishes the phenocopy and specifies that the microcephaly is congenital, the
      clinical feature that separates it from the postnatal, progressive microcephaly
      of this entity.
  - reference: PMID:27422383
    reference_title: Hyperekplexia, microcephaly and simplified gyral pattern caused
      by novel ASNS mutations, case report.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain MRI typically shows cerebral atrophy with simplified gyral pattern
      and delayed myelination.
    explanation: >-
      The simplified gyral pattern is the imaging feature that distinguishes the ASNS
      disorder; NARS1 disease shows atrophy and ventriculomegaly without it.
  - reference: PMID:25663424
    reference_title: 'Asparagine Synthetase Deficiency: New Inborn Errors of Metabolism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CSF asparagine level is low in this disorder while plasma may be low.
    explanation: >-
      Gives the biochemical discriminator on the ASNS side. It says nothing about
      asparagine levels in NARS1 disease, which is why that half is recorded as an
      inference rather than a finding.
- name: Other aminoacyl-tRNA synthetase-related neurodevelopmental disorders
  description: >-
    Biallelic variants in other cytoplasmic aminoacyl-tRNA synthetase genes (for
    example QARS1, KARS1, VARS1, CARS1, AARS1, RARS1) produce overlapping
    microcephaly, developmental delay and epileptic-encephalopathy phenotypes through
    the same class of mechanism, so they are the main differential on a multigene
    panel.
  distinguishing_features:
  - >-
    Distinguished only by the gene involved; the shared pattern is that biallelic
    variants in cytoplasmic (ARS1) genes cause epileptic encephalopathies or systemic
    conditions, while biallelic variants in the mitochondrial (ARS2) counterparts —
    including NARS1's own mitochondrial paralogue NARS2 — instead cause mitochondrial
    encephalopathies.
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Biallelic damaging variants in ARS2 genes, encoding mitochondrial-localized
      enzymes, tend to cause mitochondrial encephalopathies, whereas biallelic damaging
      variants in ARS1 genes, encoding cytoplasm-localized enzymes, tend to cause epileptic
      encephalopathies or other systemic conditions
    explanation: >-
      States the cytoplasmic-versus-mitochondrial division that organises the ARS
      differential.
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Recently, QARS, KARS, VARS, and CARS ARS family genes were implicated in
      microcephaly, but mammalian model systems and mechanisms remain unexplored
    explanation: Names the other ARS genes implicated in microcephaly.
discussions:
- discussion_id: nars1_asparagine_supplementation
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  prompt: >-
    Can asparagine supplementation rescue the cellular phenotype of biallelic
    hypomorphic NARS1 genotypes, as it does for the dominant nonsense alleles?
  attaches_to:
  - pathophysiology#Reduced Cytoplasmic Asparaginyl-tRNA Charging
  rationale: >-
    A 2026 study built a human cell system for pathogenic NARS1 alleles and found that
    asparagine supplementation completely restored proliferation in patient-derived
    fibroblasts and prevented integrated stress response activation, with cognate tRNA
    supplementation and a GCN2 inhibitor giving partial benefit. This is the first
    credible disease-modifying strategy for any NARS1 genotype and is mechanistically
    plausible for the recessive form, since raising substrate availability should
    partially compensate a hypomorphic enzyme. Two things keep this an open hypothesis
    rather than a curated treatment. First, scope: the alleles tested were the dominant
    nonsense variants R534X and R522X, which act by dominant-negative poisoning, not
    the hypomorphic biallelic alleles that define this entity, and whether substrate
    supplementation helps when the defect is reduced enzyme abundance rather than a
    poisoned dimer has not been shown. Second, a safety signal from the nearest
    clinical analogue: in asparagine synthetase deficiency, where asparagine really is
    depleted and the rationale for replacing it is stronger, the single reported human
    trial of supplementation was followed by irritability, sleep disturbance and
    worsening seizures, and had to be stopped. No clinical trial exists in any NARS1
    genotype. A separate, related open question is whether circulating and CSF
    asparagine are in fact normal in NARS1 disease; that is widely assumed from the
    mechanism but has not been measured in a NARS1 cohort, and it matters both for the
    therapeutic rationale and for using asparagine as the discriminator against the
    ASNS phenocopy.
  proposed_experiments:
  - experiment_id: nars1_asparagine_level_cohort
    name: Measure plasma and CSF asparagine across a biallelic NARS1 cohort
    description: >-
      Assay asparagine in as many biallelic NARS1 individuals as can be assembled, to
      test the assumption that levels are normal. A normal result validates asparagine
      as the routine discriminator from asparagine synthetase deficiency; an abnormal
      one would reopen the mechanism.
  - experiment_id: nars1_asparagine_rescue_biallelic
    name: Asparagine supplementation in biallelic patient-derived cells and organoids
    description: >-
      Repeat the asparagine rescue in fibroblasts, iNPCs and cortical organoids
      carrying the recurrent biallelic p.Arg545Cys and p.Thr17Met genotypes, using
      organoid diameter and rosette number as the tissue-level readouts already
      validated for this disorder, and puromycin incorporation as the translational
      readout.
  evidence:
  - reference: PMID:42381704
    reference_title: Therapeutic rescue of pathogenic asparaginyl-tRNA synthetase alleles.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Asparagine supplementation completely restored cell proliferation defects
      in patient-derived fibroblasts and prevented activation of the ISR.
    explanation: >-
      The rescue result. PARTIAL for this entity because the alleles tested were
      dominant nonsense variants, not the biallelic hypomorphic alleles curated here.
  - reference: PMID:42381704
    reference_title: Therapeutic rescue of pathogenic asparaginyl-tRNA synthetase alleles.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: We found that two dominant NARS1 nonsense alleles, R534X and R522X, cause
      a cytotoxic phenotype and elicit the integrated stress response (ISR).
    explanation: >-
      Identifies exactly which alleles were tested, which is what limits the result's
      transfer to the recessive entity.
  - reference: PMID:27268761
    reference_title: Worsening of Seizures After Asparagine Supplementation in a Child
      with Asparagine Synthetase Deficiency.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: Asparagine supplementation may be not effective in controlling the seizures
      in asparagine synthetase deficiency, and it is likely to make them worse.
    explanation: >-
      A safety counterpoint by analogy, not a result in this disorder. The one human
      report of asparagine supplementation in the closest clinical phenocopy, where
      the substrate is genuinely depleted and supplementation therefore has the
      stronger rationale, describes worsening seizures requiring discontinuation.
      Since seizures are frequent in this entity too, any trial of supplementation
      here has to anticipate that signal. REFUTE is recorded against the therapeutic
      proposition, with the caveat that the disorder studied is asparagine synthetase
      deficiency rather than NARS1 disease.
- discussion_id: nars1_mouse_model_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is there any in vivo mammalian model of the biallelic hypomorphic NARS1 genotype,
    and can the postnatal neurodegenerative arm of this disorder be modelled at all?
  attaches_to:
  - pathophysiology#Progressive Reduction of Cortical Volume
  - pathophysiology#Peripheral Nerve Involvement
  rationale: >-
    The disorder's flagship model is a patient-derived cortical organoid, which
    recapitulates the developmental progenitor-proliferation defect with high fidelity
    but stops at fetal corticogenesis. It cannot model the postnatal neurodegenerative
    course, the peripheral neuropathy, or the seizures — precisely the features that
    make this a combined CNS/PNS degenerative disorder rather than a static
    microcephaly. The one published mammalian in vivo NARS1 model is a knock-in of the
    dominant p.Ser461Phe neuropathy allele, which models the wrong entity. Curators
    should not treat organoid evidence as covering the degenerative or peripheral arms,
    and the mechanism_confidence on the peripheral node is PROVISIONAL for this reason.
  proposed_experiments:
  - experiment_id: nars1_hypomorphic_knockin_mouse
    name: Hypomorphic Nars1 knock-in mouse carrying the recurrent recessive allele
    description: >-
      Generate a homozygous knock-in of the murine equivalent of p.Arg545Cys and
      follow head growth, cortical and cerebellar volume, motor and gait performance,
      and nerve conduction longitudinally into adulthood, to test whether a
      partial-function allele reproduces both the developmental and the degenerative
      arms.
  evidence:
  - reference: PMID:38495304
    reference_title: Dominant NARS1 mutations causing axonal Charcot-Marie-Tooth disease
      expand NARS1-associated diseases.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: 'Similarly, the homozygous knock-in mouse model (p.Ser461Phe/Ser472Phe
      in mouse) also demonstrated loss-of-function characteristics.'
    explanation: >-
      The only published mammalian NARS1 knock-in carries a dominant neuropathy allele,
      not a recessive neurodevelopmental one; PARTIAL because it evidences the absence
      of a matched model rather than the disorder itself.
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: Cortical brain organoid modeling shows reduced proliferation of radial
      glial cells (RGCs), leading to smaller organoids characteristic of microcephaly.
    explanation: >-
      The available model covers the developmental arm only, which is what leaves the
      degenerative and peripheral arms unmodelled.
- discussion_id: nars1_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the specific biallelic NARS1 genotype predict severity, the presence of
    seizures, or the presence of peripheral neuropathy?
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic NARS1 Variants
  - pathophysiology#Combined Central and Peripheral Nervous System Dysfunction
  rationale: >-
    Clinical variability within the recessive form is wide — tone may be low or high,
    seizures may be absent or refractory, neuropathy is present in only a subset — yet
    no genotype-phenotype correlation has been established. Some findings do track with
    family and genotype in the founding series (progeroid features in the p.Thr17Met
    siblings, cataracts in the p.Arg545Cys homozygotes), but with three families and
    seven individuals these are observations, not correlations. Because the total
    reported biallelic population is small, resolving this requires an international
    registry rather than another single-family report.
  proposed_experiments:
  - experiment_id: nars1_pooled_genotype_phenotype_reanalysis
    name: Pooled genotype-stratified reanalysis of all reported biallelic individuals
    description: >-
      Assemble every published biallelic NARS1 case with individual-level phenotype
      data, stratify by allele class (UNE-N missense, catalytic missense, frameshift)
      and by residual enzyme activity where measured, and test whether tone direction,
      seizure presence and neuropathy presence segregate with genotype.
  evidence:
  - reference: PMID:32788587
    reference_title: Loss of NARS1 impairs progenitor proliferation in cortical brain
      organoids and leads to microcephaly.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: 'Other DysmorphismMaxillary hypoplasia, progeroid features, arachnodactylyProgeroid
      appearance, arachnodactylyProgeroid features, arachnodactylyArachnodactyly, cubitus
      valgus, pes planovalgusArachnodactyly, cubitus valgus, pes planovalgus'
    explanation: >-
      The per-family dysmorphism pattern that hints at genotype-linked features while
      being far too small to establish one.

genetic:
- name: ID4 (6p22.3 regulatory landscape)
  gene_term:
    preferred_term: ID4
    term:
      id: hgnc:5363
      label: ID4
  relationship_type: CAUSATIVE
  notes: >-
    The causal unit is a genomic region rather than a gene, and ID4 is named as
    the effector on positional grounds only — its coding sequence is intact and
    it lies outside the smallest deleted interval. Diagnostically this means ID4
    sequencing is uninformative; copy-number analysis finds the deletion alleles
    and whole-genome sequencing can identify inversion alleles. The
    deleted interval itself contains MBOAT1, E2F3, CDKAL1 and SOX4. The proposed
    regulatory effect on ID4 is distinct from the loss of these coding genes.
  evidence:
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions encompass four known genes: MBOAT1, E2F3, CDKAL1 and SOX4.
    explanation: >-
      Names the genes actually removed, which are not the gene the disorder is
      attributed to.
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this case broadens the genetic spectrum in MDST and provides further
      support to the role of ID4 dysregulation as the main underlying molecular
      mechanism of this ultra-rare skeletal disorder.
    explanation: >-
      States the ID4-dysregulation attribution, at the strength the source gives
      it ("further support", not proof).
  variants:
  - name: 6p22.3 deletion spanning hg19 chr6:19974194-22013061
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intron
    - intergenic region
    regulatory_target_gene:
      preferred_term: ID4
      term:
        id: hgnc:5363
        label: ID4
    description: >-
      Heterozygous deletion reported as arr[hg19] 6p22.3
      (19974194-22013061)x1 in the 2015 series. These coordinates are the
      outermost deleted probes, not nucleotide-resolved breakpoints; Table 2
      gives flanking normal probes at chr6:19965294 and chr6:22016585.
      The interval removes MBOAT1, E2F3, CDKAL1 and SOX4, including coding,
      intronic and intervening intergenic sequence, while retaining ID4.
      ID4 is the proposed regulatory target, not a deleted coding gene.
      Parental samples were unavailable, so origin is unconfirmed for this
      allele despite the abstract's collective de novo wording.
    functional_effects:
    - function: Spatial regulation of ID4 expression during limb development
      type: predicted enhancer adoption
      regulatory_element_type: TAD_BOUNDARY
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        Deletion of regulatory boundaries is predicted to expose intact ID4
        to normally insulated limb enhancers.
      description: >-
        The proposed outcome is gain of ectopic ID4 expression in limb buds.
        This remains a positional hypothesis; expression was not measured.
    evidence:
    - reference: PMID:26032025
      reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The deletions encompass four known genes: MBOAT1, E2F3, CDKAL1 and SOX4.
      explanation: >-
        Establishes the coding-gene content of the disease-associated
        deletions. The Results and Table 2 identify this allele as patient 2
        and give the hg19 probe limits and unavailable parental testing.
    - reference: PMID:26032025
      reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Analysis of the genomic region showed that the deletion removes two
        regulatory boundaries and brings several potential limb enhancers into
        close proximity of ID4.
      explanation: >-
        Genomic-position analysis supports the enhancer-adoption hypothesis,
        not a directly observed ID4 expression change.
  - name: 6p22.3 deletion spanning hg19 chr6:19849280-21604600
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intron
    - intergenic region
    regulatory_target_gene:
      preferred_term: ID4
      term:
        id: hgnc:5363
        label: ID4
    description: >-
      De novo heterozygous deletion reported as arr[hg19] 6p22.3
      (19849280-21604600)x1 in the 2015 series. These are the outermost
      deleted probes; Table 2 gives flanking normal probes at chr6:19840492
      and chr6:21630684. The approximately 1.76 Mb minimum interval removes
      MBOAT1, E2F3, CDKAL1 and SOX4, including coding, intronic and intervening
      intergenic sequence, but leaves the proposed target ID4 intact.
      The deletion and its de novo origin were confirmed by qPCR.
    functional_effects:
    - function: Spatial regulation of ID4 expression during limb development
      type: predicted enhancer adoption
      regulatory_element_type: TAD_BOUNDARY
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        Removal of regulatory boundaries is predicted to place limb enhancers
        in the regulatory domain of ID4 without deleting its coding sequence.
      description: >-
        Ectopic ID4 expression is proposed to explain the limb phenotype;
        neither the expression change nor the causal enhancer contacts were
        measured in this allele.
    evidence:
    - reference: PMID:26032025
      reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We performed array comparative genomic hybridisation in three unrelated
        patients with mesomelic dysplasia Savarirayan type and identified 2 Mb
        overlapping de novo microdeletions on chromosome 6p22.3.
      explanation: >-
        The abstract summarizes the overlapping deletions. The Results and
        Table 2 identify this smaller allele as patient 3, give its hg19 probe
        limits and document parental qPCR confirmation of de novo origin.
    - reference: PMID:26032025
      reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Analysis of the genomic region showed that the deletion removes two
        regulatory boundaries and brings several potential limb enhancers into
        close proximity of ID4.
      explanation: >-
        The preserved ID4 coding sequence and altered regulatory boundaries
        support a predicted expression effect rather than ID4 haploinsufficiency.
  - name: 6p22.3 inversion with a breakpoint insertion
    variant_type: inversion
    regulatory_target_gene:
      preferred_term: ID4
      term:
        id: hgnc:5363
        label: ID4
    description: >-
      De novo inversion identified by whole-genome sequencing after a negative
      array in the 2026 report. The author-deposited LOVD record gives the hg38
      genomic description on chromosome 6 as
      g.19066060_21763046delins[CGAATTAACTGT;19066051_21763045inv].
      Supplementary Figure 2 documents a templated insertion at the telomeric
      breakpoint, so this is not represented as a completely balanced simple
      inversion. ID4 is a predicted regulatory target whose coding sequence is
      retained. Genomic contexts are omitted because the accessed abstract and
      supplement do not establish transcript-specific breakpoint overlaps.
    external_assertions:
    - name: LOVD 6p22.3 inversion record 0001070241
      source: Global Variome shared LOVD
      external_id: '0001070241'
      assertion_type: author-deposited variant record
      url: https://databases.lovd.nl/shared/individuals/00474045
      description: >-
        Variant linked from individual 00474045 in the publication's data
        availability statement. The record includes hg19 and hg38 descriptions
        and resolves the associated inversion junction insertion.
    functional_effects:
    - function: Spatial regulation of ID4 expression during limb development
      type: predicted enhancer adoption
      regulatory_element_type: TAD_BOUNDARY
      affected_developmental_stage: embryonic limb development
      regulatory_mechanism: >-
        The inversion is predicted to alter TAD organization and reposition
        intact ID4 relative to telomeric limb enhancers.
      description: >-
        The proposed gain of ectopic expression is supported by genomic
        position and POSTRE prediction, not by direct measurement of ID4 RNA
        or protein in developing limb tissue.
    evidence:
    - reference: PMID:42069959
      reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No deletion was identified by array. However, whole genome sequencing
        (WGS) revealed a de novo inversion at 6p22.3.
      explanation: >-
        Establishes the observed SV class and de novo origin. Supplementary
        Figure 2 and the linked LOVD deposition provide junction detail.
    - reference: PMID:42069959
      reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: COMPUTATIONAL
      snippet: >-
        we predict that the structural variant disrupts several topologically
        associated domains (TADs) in the region and is likely to place ID4 in
        closer proximity to more telomerically located limb enhancers, which could
        result in enhancer adoption and potentially lead to ID4 limb misexpression
      explanation: >-
        The authors predict altered enhancer access. This is mechanistic
        support by inference, not confirmation of an ectopic-expression phenotype.
diagnosis:
- name: Radiographic Recognition
  description: >-
    Suspected from severe lower-limb mesomelia with hypoplastic triangular
    tibiae and hypoplastic or abnormally shaped fibulae. Upper-limb involvement
    is variable. The radiographic picture is characteristic enough that the 2026
    inversion case was recognized clinically before any variant was found.
  diagnosis_term:
    preferred_term: diagnostic radiography
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a 9 year-old female with severe mesomelic lower limb shortening and
      characteristic radiographic findings, highly resembling those identified
      in previous MDST patients
    explanation: >-
      Supports radiographic recognizability: the diagnosis was made on imaging
      resemblance to prior cases.
- name: Structural-Variant Analysis of 6p22.3
  description: >-
    Array CGH identifies the microdeletion alleles. A negative array does not
    exclude the diagnosis: the fifth reported patient had a normal array and a
    de novo inversion found only on whole-genome sequencing. In a
    radiographically typical case with a negative array, WGS is the next step.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No deletion was identified by array. However, whole genome sequencing
      (WGS) revealed a de novo inversion at 6p22.3.
    explanation: >-
      Directly supports the recommendation to proceed to WGS after a negative
      array.
differential_diagnoses:
- name: Mesomelic dysplasia, Kantaputra type
  description: >-
    The same class of lesion — enhancer adoption after a structural rearrangement
    — at a different locus (HOXD, 2q31), with all four limbs affected and carpal
    and tarsal synostoses. The mechanistic parallel is close enough that the two
    disorders are best read together.
- name: KINSSHIP syndrome
  description: >-
    Named in the KINSSHIP acronym for its Savarirayan-like limb radiographs, but
    a different condition per the nosology's own comment: AFF3-related, and with
    horseshoe kidney, seizures, and intellectual disability that this disorder
    does not produce.
- name: Langer mesomelic dysplasia
  description: >-
    Biallelic SHOX deficiency, which affects the forearms as well as the lower
    legs and has no 6p22.3 lesion.
discussions:
- discussion_id: mdst_id4_misexpression_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has ID4 actually been shown to be misexpressed in the limb bud in this
    disorder, or is the attribution still entirely positional?
  attaches_to:
  - pathophysiology#Enhancer Adoption by ID4 in the Limb Bud
  rationale: >-
    Both papers state the model as a prediction from breakpoint position — "could
    result", "we predict", "likely to place" — and neither reports an expression
    measurement. The comparison case is instructive: at the HOXD locus the
    equivalent hypothesis was settled by an engineered mouse inversion plus an
    in-cis null rescue. Nothing equivalent exists here, and with five patients
    worldwide the route to it is a mouse model of the rearrangement rather than
    more human genetics.

name: Mesomelic Dysplasia, Savarirayan Type
synonyms:
- Mesomelic dysplasia (Savarirayan type), ID4-related
- MDST
- mesomelic dysplasia with absent fibulae and triangular tibiae
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Mesomelic dysplasia of the Savarirayan type is an ultra-rare skeletal
  dysplasia in which the middle segment of the lower limb is severely short,
  with hypoplastic triangular tibiae and hypoplastic or abnormally shaped
  fibulae. Lower-limb involvement predominates, although upper-limb abnormalities
  also occur. Associated structural variants at 6p22.3 include microdeletions
  and an inversion, with de novo origin confirmed in several cases. The proposed
  mechanism is disruption of regulatory boundaries followed by enhancer adoption
  and ectopic ID4 expression in the limb bud. The deletions encompass coding
  genes, but overlapping larger deletions that also remove ID4 can lack the
  characteristic skeletal phenotype. This comparison and the inversion support
  a regulatory mechanism; ID4 misexpression has not been demonstrated directly.
disease_term:
  preferred_term: mesomelic dysplasia, Savarirayan type
  term:
    id: MONDO:0011530
    label: mesomelic dysplasia, Savarirayan type
parents:
- Skeletal Dysplasia
- Mesomelic Dysplasia
notes: >-
  The gene attribution here needs reading carefully. ID4 is named in the ISDS
  row and in the disorder's dyadic name, but no ID4 coding variant has been
  reported in any patient: ID4 lies outside the smallest deleted interval, and
  its involvement is inferred from the position of the rearrangement breakpoints
  relative to limb enhancers and topological boundaries. The 2026 inversion case
  strengthens that inference because it produces the characteristic phenotype
  without an array-detectable deletion. Its breakpoint insertion does not
  establish a gene-dosage mechanism. The proposed ID4 expression consequence
  remains unmeasured. GOE classifies the proposed ectopic-expression mechanism
  on the HYPOTHETICAL pathophysiology node.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian skeletal dysplasia associated with structural variants;
      tagged on the genetics axis.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0150, listed as "Mesomelic dysplasia (Savarirayan type),
      ID4-related" (MIM 605274, AD), with the row's own comment recording the
      cause as microdeletions on 6p22.3. The KINSSHIP row in the same group
      (NOS 15-0160) names this type in its acronym but carries an explicit
      comment that it is a different condition. The 2019 revision (Mortier et
      al., PMID:31633310) numbered the same group 17.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Five reported patients as of the 2026 inversion case: four with 6p22.3
    microdeletions and one with an inversion. No denominator-based estimate
    exists.
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mesomelic dysplasia Savarirayan-type or ID4-related (MDST) is an
      ultra-rare skeletal dysplasia caused by chromosome 6p22.3 microdeletions.
      To date, only four cases have been reported. Here, we report a fifth case
    explanation: >-
      Gives the cumulative case count directly, the basis for the ULTRA_RARE
      band.
inheritance:
- name: Autosomal dominant, often de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous 6p22.3 rearrangements are associated with disease. De novo
    origin was confirmed for deletion alleles in patients 1 and 3 of the 2015
    series and for the 2026 inversion. The parents of patient 2 in the 2015
    series were unavailable for testing, so de novo origin cannot be assigned
    to every reported allele.
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, whole genome sequencing (WGS) revealed a de novo inversion at
      6p22.3.
    explanation: >-
      Documents the de novo origin of the inversion allele.
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed array comparative genomic hybridisation in three unrelated
      patients with mesomelic dysplasia Savarirayan type and identified 2 Mb
      overlapping de novo microdeletions on chromosome 6p22.3.
    explanation: >-
      The abstract summarizes the deletion series as de novo. The Results
      section specifies parental confirmation for patients 1 and 3 and states
      that the parents of patient 2 were unavailable for testing.
pathophysiology:
- name: 6p22.3 Deletion
  biological_scale: MOLECULAR
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intron
    - intergenic region
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  description: >-
    Overlapping deletions remove MBOAT1, E2F3, CDKAL1 and SOX4 while retaining
    ID4. De novo origin was confirmed in two of the three patients in the
    2015 series; parental samples were unavailable for the third.
  evidence:
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions encompass four known genes: MBOAT1, E2F3, CDKAL1 and SOX4.
    explanation: >-
      The deleted genes are distinct from the proposed regulatory target ID4.
      The Results and Table 2 document the individual deletion intervals and
      parental testing.
  downstream:
  - target: Enhancer Adoption by ID4 in the Limb Bud
    causal_link_type: DIRECT
    description: >-
      Removal of regulatory boundaries is predicted to expose intact ID4 to
      limb enhancers; the proposed contact change has not been measured.
- name: 6p22.3 Inversion
  biological_scale: MOLECULAR
  genetic_context:
    variant_type: inversion
    zygosity: HETEROZYGOUS
    variant_origin: DE_NOVO
  description: >-
    A de novo inversion, accompanied by a breakpoint insertion, was identified
    by whole-genome sequencing after a negative array. ID4 coding sequence is
    retained. The junction details are recorded in the individual variant entry.
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No deletion was identified by array. However, whole genome sequencing
      (WGS) revealed a de novo inversion at 6p22.3.
    explanation: >-
      Establishes the inversion and its de novo origin. The linked LOVD record
      additionally describes the insertion at the inversion junction.
  downstream:
  - target: Enhancer Adoption by ID4 in the Limb Bud
    causal_link_type: DIRECT
    description: >-
      Reorganization of regulatory boundaries is predicted to reposition ID4
      relative to limb enhancers; the proposed contact change remains unmeasured.
- name: Enhancer Adoption by ID4 in the Limb Bud
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  regulatory_category: GOE
  gene:
    preferred_term: ID4
    term:
      id: hgnc:5363
      label: ID4
  description: >-
    Both allele classes are predicted to disrupt topologically associating
    domains at 6p22.3 and place ID4 nearer to limb enhancers that normally
    cannot reach it. ID4 is an inhibitor-of-DNA-binding HLH protein — a
    dominant-negative regulator of bHLH transcription factors — so misexpressing
    it in the limb bud would be expected to interfere with, rather than augment,
    the differentiation programs those factors run. Both papers state this as a
    prediction from breakpoint position, not as a measured expression change.
  biological_processes:
  - preferred_term: Enhancer-driven regulation of ID4 transcription in the limb bud
    modifier: DYSREGULATED
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  - preferred_term: limb development
    modifier: DYSREGULATED
    term:
      id: GO:0060173
      label: limb development
  evidence:
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a fourth patient with intellectual disability and an
      overlapping slightly larger do novo deletion also encompassing the
      flanking gene ID4. Given the fact that the fourth patient had no skeletal
      abnormalities and none of the genes in the deleted interval are known to
      be associated with abnormalities in skeletal development, other mutational
      mechanisms than loss of function of the deleted genes have to be
      considered.
    explanation: >-
      The comparison motivates the enhancer-adoption hypothesis. It does not
      exclude variable expressivity or incomplete penetrance of effects from
      deleted genes.
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Analysis of the genomic region showed that the deletion removes two
      regulatory boundaries and brings several potential limb enhancers into
      close proximity of ID4. Thus, the deletion could result in the aberrant
      activation and misexpression of ID4 in the limb bud, thereby causing the
      mesomelic dysplasia.
    explanation: >-
      States the enhancer-adoption model. The source says "could result", and no
      expression measurement is reported; genomic-position analysis supports
      the proposed expression mechanism indirectly.
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      we predict that the structural variant disrupts several topologically
      associated domains (TADs) in the region and is likely to place ID4 in
      closer proximity to more telomerically located limb enhancers, which could
      result in enhancer adoption and potentially lead to ID4 limb misexpression
    explanation: >-
      The same model applied to the inversion allele, again explicitly as a
      prediction ("we predict", "likely", "could", "potentially").
  downstream:
  - target: Lower-Limb Mesomelic Shortening
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed ID4 misexpression could disrupt limb differentiation and produce
      mesomelia; the intervening cellular changes have not been demonstrated.
- name: Lower-Limb Mesomelic Shortening
  biological_scale: ORGANISM
  description: >-
    Severe shortness of the middle segment of the lower limb, with hypoplastic
    triangular tibiae and hypoplastic or abnormally shaped fibulae. The
    predominance in the lower limb is characteristic; upper-limb findings vary
    and included short radii and ulnae in one patient in the defining series.
  evidence:
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data indicate that the distinct deletion 6p22.3 is associated with
      mesomelic dysplasia Savarirayan type featuring hypoplastic,
      triangular-shaped tibiae and abnormally shaped or hypoplastic fibulae.
    explanation: >-
      Gives the defining radiographic phenotype.
  downstream:
  - target: Lower-Limb Mesomelia
    causal_link_type: DIRECT
    description: >-
      Shortening of the tibial and fibular segments produces lower-limb
      mesomelia.
  - target: Hypoplastic Triangular Tibia
    causal_link_type: DIRECT
    description: >-
      The triangular tibia is the characteristic radiographic form the shortened
      segment takes.
  - target: Fibular Hypoplasia
    causal_link_type: DIRECT
    description: >-
      The fibula is hypoplastic or abnormally shaped alongside the tibia.

genetic:
- name: ID4 (6p22.3 regulatory landscape)
  gene_term:
    preferred_term: ID4
    term:
      id: hgnc:5363
      label: ID4
  relationship_type: CAUSATIVE
  notes: >-
    The causal unit is a genomic region rather than a gene, and ID4 is named as
    the effector on positional grounds only — its coding sequence is intact and
    it lies outside the smallest deleted interval. Diagnostically this means ID4
    sequencing is uninformative; copy-number analysis finds the deletion alleles
    and whole-genome sequencing is needed for the copy-number-neutral ones. The
    deleted interval itself contains MBOAT1, E2F3, CDKAL1 and SOX4, none of them
    an established skeletal-development gene.
  evidence:
  - reference: PMID:26032025
    reference_title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletions encompass four known genes: MBOAT1, E2F3, CDKAL1 and SOX4.
    explanation: >-
      Names the genes actually removed, which are not the gene the disorder is
      attributed to.
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, this case broadens the genetic spectrum in MDST and provides further
      support to the role of ID4 dysregulation as the main underlying molecular
      mechanism of this ultra-rare skeletal disorder.
    explanation: >-
      States the ID4-dysregulation attribution, at the strength the source gives
      it ("further support", not proof).
diagnosis:
- name: Radiographic Recognition
  description: >-
    Suspected from severe lower-limb mesomelia with hypoplastic triangular
    tibiae and hypoplastic or abnormally shaped fibulae, with normal upper
    limbs. The radiographic picture is characteristic enough that the 2026
    inversion case was recognized clinically before any variant was found.
  diagnosis_term:
    preferred_term: diagnostic radiography
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a 9 year-old female with severe mesomelic lower limb shortening and
      characteristic radiographic findings, highly resembling those identified
      in previous MDST patients
    explanation: >-
      Supports radiographic recognizability: the diagnosis was made on imaging
      resemblance to prior cases.
- name: Structural-Variant Analysis of 6p22.3
  description: >-
    Array CGH identifies the microdeletion alleles. A negative array does not
    exclude the diagnosis: the fifth reported patient had a normal array and a
    de novo inversion found only on whole-genome sequencing. In a
    radiographically typical case with a negative array, WGS is the next step.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42069959
    reference_title: "Genomic inversion at 6p22.3 supports ID4 dysregulation as the pathogenic mechanism of Mesomelic dysplasia Savarirayan-type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No deletion was identified by array. However, whole genome sequencing
      (WGS) revealed a de novo inversion at 6p22.3.
    explanation: >-
      Directly supports the recommendation to proceed to WGS after a negative
      array.
differential_diagnoses:
- name: Mesomelic dysplasia, Kantaputra type
  description: >-
    The same class of lesion — enhancer adoption after a structural rearrangement
    — at a different locus (HOXD, 2q31), with all four limbs affected and carpal
    and tarsal synostoses. The mechanistic parallel is close enough that the two
    disorders are best read together.
- name: KINSSHIP syndrome
  description: >-
    Named in the KINSSHIP acronym for its Savarirayan-like limb radiographs, but
    a different condition per the nosology's own comment: AFF3-related, and with
    horseshoe kidney, seizures, and intellectual disability that this disorder
    does not produce.
- name: Langer mesomelic dysplasia
  description: >-
    Biallelic SHOX deficiency, which affects the forearms as well as the lower
    legs and has no 6p22.3 lesion.
discussions:
- discussion_id: mdst_id4_misexpression_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has ID4 actually been shown to be misexpressed in the limb bud in this
    disorder, or is the attribution still entirely positional?
  attaches_to:
  - pathophysiology#Enhancer Adoption by ID4 in the Limb Bud
  rationale: >-
    Both papers state the model as a prediction from breakpoint position — "could
    result", "we predict", "likely to place" — and neither reports an expression
    measurement. The comparison case is instructive: at the HOXD locus the
    equivalent hypothesis was settled by an engineered mouse inversion plus an
    in-cis null rescue. Nothing equivalent exists here, and with five patients
    worldwide the route to it is a mouse model of the rearrangement rather than
    more human genetics.
references:
- reference: PMID:26032025
  title: "Microdeletions on 6p22.3 are associated with mesomelic dysplasia Savarirayan type."
- reference: PMID:36779427
  title: "Nosology of genetic skeletal disorders: 2023 revision."

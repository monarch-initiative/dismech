  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    SPG70, attributed to MARS1 (methionyl-tRNA synthetase 1). This is the most thinly evidenced
    row on the entry: a PubMed search for the SPG70 designation and for MARS1/MARS together with
    spastic paraplegia returned no dedicated SPG70 report, and the human evidence cited here is a
    childhood-onset HSP case series in which MARS was the confirmed genetic etiology in two of
    sixteen patients. ClinGen has not curated MARS1 against any HSP entity; its only MARS1 record
    is Charcot-Marie-Tooth disease (Limited, autosomal dominant). The autosomal recessive
    designation follows the bound MONDO class label.
  evidence:
  - reference: PMID:35303589
    reference_title: 'Childhood-Onset Hereditary Spastic Paraplegia (HSP): A Case Series and Review of Literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetically confirmed etiologies included SPAST (3 patients), MARS (2), KIF1A (2), KIF5A (1),
      SACS (1), SPG7 (1), REEP1 (1), PNPT1 (1), MT-ATP6 (1), and ATL1 (1).
    explanation: >-
      MARS (now MARS1) was the confirmed genetic etiology in two patients of a childhood-onset
      hereditary spastic paraplegia cohort, which is the human evidence available for this
      gene-disease pair.
- name: SPG76
  display_name: Autosomal recessive spastic paraplegia type 76 (CAPN1)
  subtype_term:
    preferred_term: autosomal recessive spastic paraplegia type 76
    term:
      id: MONDO:0014827
      label: autosomal recessive spastic paraplegia type 76
  genes:
  - preferred_term: CAPN1
    term:
      id: hgnc:1476
      label: CAPN1
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    SPG76, caused by biallelic CAPN1 (calpain 1) variants. Rare homozygous and compound
    heterozygous nonsense, missense, frameshift and splice-site CAPN1 variants were identified in
    nine affected individuals from three autosomal recessive HSP families and segregated with
    disease. Calpain 1 is a CNS protease implicated in synaptic plasticity and in axon maturation
    and maintenance, which is why CAPN1 is also bound on the corticospinal-tract axonal
    degeneration node.
  evidence:
  - reference: PMID:27153400
    reference_title: 'Mutations in CAPN1 Cause Autosomal-Recessive Hereditary Spastic Paraplegia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mutations in CAPN1 were identified in all affected individuals, and sequencing in additional
      family members confirmed the segregation of these mutations with the disease (spastic
      paraplegia 76 [SPG76])
    explanation: >-
      Identifies biallelic CAPN1 variants as the cause of SPG76 in three autosomal recessive HSP
      families, with segregation confirmed.
- name: SPG78
  display_name: Autosomal recessive spastic paraplegia type 78 (ATP13A2)
  subtype_term:
    preferred_term: autosomal recessive spastic paraplegia type 78
    term:
      id: MONDO:0014975

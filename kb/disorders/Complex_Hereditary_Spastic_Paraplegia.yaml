- name: Mitochondrial Metabolic and Iron-Sulfur Cluster Assembly Failure
  description: >-
    A mitochondrial mechanism class. IBA57 is the mitochondrial iron-sulfur protein assembly
    factor, and the SPG74 splice-site variant reduces the levels and activities of several
    mitochondrial 4Fe-4S proteins including respiratory complexes I and II while leaving 2Fe-2S
    proteins normal. GPT2 is a transaminase whose biallelic loss-of-function variants impair
    mitochondrial metabolism, including anaplerotic replenishment of tricarboxylic-acid-cycle
    intermediates. This node is the complex-HSP counterpart of the SPG7/paraplegin mitochondrial
    mechanism already recorded on this entry.

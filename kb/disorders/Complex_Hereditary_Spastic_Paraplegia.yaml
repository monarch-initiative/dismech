- name: Endolysosomal, Autophagic and ESCRT Membrane-Traffic Failure
  description: >-
    A mechanism class shared by a large group of complex-HSP genes whose products act in vesicular
    sorting, endosome maturation and autophagosome biogenesis. Spastizin (ZFYVE26) localizes
    partly to endoplasmic reticulum and endosomal compartments; spartin (SPART) resembles
    molecules of endosomal trafficking; VPS37A is a subunit of the ESCRT system that matures
    multivesicular bodies; ATP13A2 is a lysosomal transport ATPase; and the AP-4 adaptor complex
    exports ATG9A from the trans-Golgi network, so that AP-4 loss impairs autophagosome formation.
    Every gene bound here causes a complex HSP recorded on this entry, so the shared downstream
    consequence is the length-dependent corticospinal-tract axonopathy of the entry's core node.
  genes:

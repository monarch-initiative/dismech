      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    Troyer syndrome (SPG20), caused by biallelic SPART (spartin) variants. The disease-defining
    report describes it as an autosomal recessive complicated hereditary spastic paraplegia
    occurring with high frequency in the Old Order Amish, mapped to chromosome 13q12.3, with a
    frameshift mutation in SPG20 (now SPART). ClinGen classifies the SPART-Troyer syndrome
    relationship as Definitive under autosomal recessive inheritance. The SPART record in
    `genetic` points at this row.
  evidence:
  - reference: PMID:12134148
    reference_title: 'SPG20 is mutated in Troyer syndrome, an hereditary spastic paraplegia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Troyer syndrome (TRS) is an autosomal recessive complicated hereditary spastic paraplegia
      (HSP) that occurs with high frequency in the Old Order Amish.
    explanation: >-
      Establishes Troyer syndrome as an autosomal recessive complicated (complex) HSP, which is why
      it is a subtype row on this entry rather than a separate entry.
  - reference: CGGV:assertion_5f0c5bcd-68a3-46f2-b632-82feb28381d4-2022-12-19T170000.000Z

      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    SPG78, caused by biallelic ATP13A2 variants. ATP13A2 is allelic with Kufor-Rakeb syndrome,
    which dismech curates as its own entry (Kufor-Rakeb_syndrome, MONDO:0011706); the SPG78
    presentation is recorded here because the defining report frames it as complicated hereditary
    spastic paraplegia added to the clinical continuum of ATP13A2-associated disorders, dominated
    by adult-onset lower-limb predominant spastic paraparesis. ClinGen's only ATP13A2 record is
    Kufor-Rakeb syndrome (Definitive), not SPG78.
  evidence:
  - reference: PMID:28137957
    reference_title: 'Loss-of-function mutations in the ATP13A2/PARK9 gene cause complicated hereditary spastic paraplegia (SPG78).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Bulgarian family with three siblings affected by complicated hereditary spastic
      paraplegia, we performed whole exome sequencing and homozygosity mapping and identified a
      homozygous p.Thr512Ile (c.1535C > T) mutation in ATP13A2.
    explanation: >-
      Identifies a homozygous ATP13A2 variant in a family with complicated HSP, the observation on
      which the SPG78 designation rests.
  - reference: PMID:28137957
    reference_title: 'Loss-of-function mutations in the ATP13A2/PARK9 gene cause complicated hereditary spastic paraplegia (SPG78).'
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular defects in this gene have been causally associated with Kufor-Rakeb syndrome
    explanation: >-
      Records the allelic relationship that makes the lump/split ruling necessary: the same gene
      underlies Kufor-Rakeb syndrome, which is a separate dismech entry.

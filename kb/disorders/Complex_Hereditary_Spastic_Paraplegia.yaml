      confirmed a loss of B4GALNT1 function with no synthesis of GM2 and other downstream
      gangliosides.
    explanation: >-
      Shows that disease-associated B4GALNT1 variants abolish complex ganglioside synthesis, which
      is the ganglioside arm of this node.
  - reference: PMID:20104589
    reference_title: 'Mutation of FA2H underlies a complicated form of hereditary spastic paraplegia (SPG35).'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abnormal hydroxylation of myelin galactocerebroside lipid components can lead to a severe
      progressive phenotype, with a clinical presentation of complicated HSP and radiological
      features of leukodystrophy
    explanation: >-
      Ties failure of a membrane-lipid hydroxylation step to complicated HSP with leukodystrophy,
      which is why FA2H (SPG35, recorded on the AR Complex HSP row) is bound on this node.

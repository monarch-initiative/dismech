      Six different truncating mutations were found to segregate with the disease in eight families
      with a phenotype that included variable clinical features of Kjellin syndrome.
    explanation: >-
      Establishes biallelic truncating ZFYVE26 variants as the cause of SPG15 across eight families,
      including the Kjellin-syndrome presentation.

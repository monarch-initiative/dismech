- name: IP3-Receptor-Dependent Endoplasmic Reticulum Calcium Release Dysregulation
  description: >-
    Calcium efflux from the endoplasmic reticulum into the cytoplasm is controlled by inositol
    1,4,5-trisphosphate binding to its receptor, and activated receptors are then degraded by the
    endoplasmic-reticulum-associated degradation pathway. Two complex-HSP genes on this entry act
    in that degradation step: ERLIN2, whose biallelic variants cause SPG18, and RNF170, the
    ubiquitin E3 ligase that targets the receptors and whose bi-allelic variants cause SPG85. The RNF170
    report names inositol 1,4,5-trisphosphate signalling as a candidate key pathway for the
    hereditary spastic paraplegias, which is the claim this node records.
  genes:
  - preferred_term: ERLIN2
    term:
      id: hgnc:1356
      label: ERLIN2
  - preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  biological_processes:
  - preferred_term: Release of sequestered calcium ion into cytosol
    term:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    modifier: DYSREGULATED
  - preferred_term: ERAD pathway
    term:
      id: GO:0036503
      label: ERAD pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:31636353
    reference_title: 'Bi-allelic variants in RNF170 are associated with hereditary spastic paraplegia.'
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Ca2+ efflux from the endoplasmic reticulum into the cytoplasm is controlled by binding of
      inositol 1,4,5-trisphosphate to its receptor. Activated inositol 1,4,5-trisphosphate receptors
      are then rapidly degraded by the endoplasmic reticulum-associated degradation pathway.
    explanation: >-
      States the calcium-release and receptor-degradation steps that this node names.
  - reference: PMID:31636353
    reference_title: 'Bi-allelic variants in RNF170 are associated with hereditary spastic paraplegia.'
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genes involved in inositol 1,4,5-trisphosphate receptor degradation (ERLIN1, ERLIN2) are known
      to cause hereditary spastic paraplegia (HSP) and cerebellar ataxia
    explanation: >-
      Places ERLIN2 in the receptor-degradation step and links it to HSP.
  - reference: PMID:31636353
    reference_title: 'Bi-allelic variants in RNF170 are associated with hereditary spastic paraplegia.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide evidence that mutations in the ubiquitin E3 ligase gene RNF170, which targets
      inositol 1,4,5-trisphosphate receptors for degradation, are the likely cause of autosomal
      recessive HSP in four unrelated families
    explanation: >-
      Places RNF170 in the same step and establishes its bi-allelic variants as a cause of recessive
      HSP.
  downstream:
  - target: Length-Dependent Corticospinal-Tract Axonal Degeneration
    evidence:
    - reference: PMID:31636353
      reference_title: 'Bi-allelic variants in RNF170 are associated with hereditary spastic paraplegia.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

        inositol 1,4,5-trisphosphate receptors for degradation, are the likely cause of autosomal
        recessive HSP in four unrelated families
      explanation: >-
        Disruption of this pathway produces hereditary spastic paraplegia, whose core lesion is the
        corticospinal-tract axonopathy.


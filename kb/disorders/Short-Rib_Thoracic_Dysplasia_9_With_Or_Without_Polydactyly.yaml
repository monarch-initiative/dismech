name: Short-Rib Thoracic Dysplasia 9 With or Without Polydactyly
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Short-rib thoracic dysplasia 9 is the skeletal ciliopathy caused by biallelic
  variants in IFT140. It covers the conditions described historically as
  Mainzer-Saldino syndrome and conorenal syndrome, and overlaps clinically with Jeune
  asphyxiating thoracic dystrophy - IFT140 variants were found in Jeune families in
  the same studies that established the Mainzer-Saldino association.

  IFT140 is a core subunit of intraflagellar transport complex A, which drives
  retrograde traffic from the ciliary tip back to the base and controls entry of
  membrane proteins into the cilium. Patient fibroblasts show altered ciliary
  abundance and mislocalised anterograde IFT components, and the mouse null is
  mid-gestation lethal with phenotypes attributable to disturbed Hedgehog signalling.
  So the mechanism is a retrograde transport failure that disturbs the signalling the
  primary cilium supports, rather than a defect in a single skeletal or renal protein.

  Clinically the entity is defined by the combination rather than by any one feature:
  cone-shaped phalangeal epiphyses, chronic renal failure, and early-onset severe
  retinal dystrophy. The thoracic narrowing is mild compared with the lethal short-rib
  polydactyly syndromes, so children survive, and renal and retinal disease dominate
  management - the IFT140 cohort reached end-stage renal failure before 13 years of
  age and all had retinal dystrophy when their eyes were examined. Polydactyly occurs
  but is not constant, which is what the qualifier in the current name records.

  One scope boundary matters and is easy to get wrong. Monoallelic IFT140
  loss-of-function causes a quite different, milder disease - autosomal dominant
  polycystic kidney disease with large cysts and limited kidney insufficiency - and is
  among the commonest causes of ADPKD after PKD1 and PKD2. That is not this entry.
  This entry is the biallelic syndromic ciliopathy.
category: Mendelian
synonyms:
- SRTD9
- Mainzer-Saldino syndrome
- conorenal syndrome
- renal dysplasia-retinal pigmentary dystrophy-cerebellar ataxia-skeletal dysplasia syndrome
- IFT140-related short-rib thoracic dysplasia

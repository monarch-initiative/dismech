genetic:
- name: IFT140
  gene_term:
    preferred_term: IFT140
    term:
      id: hgnc:29077
      label: IFT140
  relationship_type: CAUSATIVE
  notes: >-
    IFT140 sits about 0.5 Mb from PKD1 at 16p13.3, which is a recognised source of
    diagnostic confusion; PKD1 variants may also modify the IFT140 phenotype.
  evidence:
  - reference: PMID:22503633
    reference_title: "Mainzer-Saldino syndrome is a ciliopathy caused by IFT140 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified IFT140 mutations in six MSS families and in a family with the clinically overlapping Jeune syndrome"
    explanation: Establishes IFT140 as the causal gene across both the Mainzer-Saldino and overlapping Jeune presentations.
  - reference: PMID:34890546
    reference_title: "Monoallelic IFT140 pathogenic variants are an important cause of the autosomal dominant polycystic kidney-spectrum phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proximity of IFT140 to PKD1 (∼0.5 Mb) in 16p13.3 can cause diagnostic confusion, and PKD1 variants could modify the IFT140 phenotype."
    explanation: Documents the locus proximity that creates diagnostic confusion and a possible modifier effect.
animal_models:
- name: Cauli mouse (Ift140 ENU allele)
  species: Mouse
  genotype: Ift140 ENU-induced mutation, homozygous
  publication: PMID:24009529
  description: >-
    An ENU-induced Ift140 allele causing mid-gestation embryonic lethality in
    homozygotes, presented by its authors as a model of Jeune syndrome. The same
    report identified a homozygous recessive IFT140 variant in a Jeune syndrome
    patient.
  modeled_mechanisms:
  - target: Disturbed Hedgehog Signal Transduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mutant embryos show craniofacial dysmorphism, digit anomalies, cardiac anomalies
      and somite patterning defects, a number of which the authors attribute to altered
      Hedgehog signalling.
    limitations: >-
      Homozygotes die in mid-gestation with neural tube defects and cardiac anomalies
      that are not features of the human disease, so the model cannot report on the
      postnatal renal and retinal course that dominates human management. The authors
      also state that signalling systems other than Hedgehog are likely involved.
    evidence:
    - reference: PMID:24009529
      reference_title: "Cauli: a mouse strain with an Ift140 mutation that results in a skeletal ciliopathy modelling Jeune syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A number of these phenotypes can be attributed to alterations in Hedgehog signalling, although additional signalling systems are also likely to be involved."
      explanation: Supports treating this model as informative for the Hedgehog node while recording that it is not the whole mechanism.
  evidence:
  - reference: PMID:24009529
    reference_title: "Cauli: a mouse strain with an Ift140 mutation that results in a skeletal ciliopathy modelling Jeune syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We have identified a novel ENU mutant allele of Ift140, which causes a mid-gestation embryonic lethal phenotype in homozygous mutant mice."
    explanation: Establishes the model's genotype and its lethality, which bounds what it can be used for.
diagnosis:
- name: Molecular genetic testing
  description: >-
    IFT140 should be screened in skeletal ciliopathy patients who have kidney disease
    and/or retinal dystrophy.
  evidence:
  - reference: PMID:23418020
    reference_title: "Combined NGS approaches identify mutations in the intraflagellar transport gene IFT140 in skeletal ciliopathies with early progressive kidney Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study strengthens the rationale for IFT140 screening in skeletal ciliopathy spectrum patients that have kidney disease and/or retinal dystrophy."
    explanation: States the testing indication derived from the cohort.
discussions:
- discussion_id: srtd9_vs_monoallelic_ift140_adpkd
  kind: INTERPRETATION
  attaches_to:
  - disease#
  - genetic#IFT140
  prompt: >-
    How should biallelic SRTD9 be kept separate from the monoallelic IFT140 cystic
    kidney phenotype?
  rationale: >-
    Monoallelic IFT140 loss of function causes a mild autosomal dominant polycystic
    kidney phenotype that is common enough to rank behind only PKD1 and PKD2 among
    cystic kidney disease probands. It shares a gene with this entry but is a
    different disease with different inheritance, severity and organ involvement, and
    the two are easy to conflate in a gene-first search. This entry is the biallelic
    syndromic ciliopathy only.
  evidence:
  - reference: PMID:34890546
    reference_title: "Monoallelic IFT140 pathogenic variants are an important cause of the autosomal dominant polycystic kidney-spectrum phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distinctive monoallelic phenotype is mild PKD with large cysts, limited kidney insufficiency, and few liver cysts."
    explanation: Characterises the separate monoallelic phenotype that must not be merged into this entry.

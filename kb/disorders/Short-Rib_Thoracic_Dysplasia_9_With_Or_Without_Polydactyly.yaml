inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic IFT140 variants are required for the syndromic skeletal ciliopathy.
    Monoallelic loss of function produces a separate dominant cystic kidney phenotype.
  evidence:
  - reference: PMID:34890546
    reference_title: "Monoallelic IFT140 pathogenic variants are an important cause of the autosomal dominant polycystic kidney-spectrum phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bi-allelic IFT140 variants cause the syndromic ciliopathy, short-rib thoracic dysplasia (SRTD9)"
    explanation: States the biallelic requirement for SRTD9 and distinguishes it from the monoallelic cystic kidney phenotype described in the same paper.
pathophysiology:
- name: Biallelic IFT140 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic IFT140 variants impair a core subunit of intraflagellar transport
    complex A, the complex that regulates retrograde protein transport in ciliated
    cells.
  genetic_context:
    gene:
      preferred_term: IFT140
      term:
        id: hgnc:29077
        label: IFT140
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:22503633
    reference_title: "Mainzer-Saldino syndrome is a ciliopathy caused by IFT140 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IFT140 is one of the six currently known components of the intraflagellar transport complex A (IFT-A) that regulates retrograde protein transport in ciliated cells."
    explanation: Establishes IFT140's role in the IFT-A complex, which is the function lost in this disease.
  downstream:
  - target: Failed Retrograde Intraflagellar Transport
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22503633
      reference_title: "Mainzer-Saldino syndrome is a ciliopathy caused by IFT140 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Ciliary abundance and localization of anterograde IFTs were altered in fibroblasts of affected individuals"
      explanation: Directly demonstrates the ciliary transport consequence in patient cells, which is what makes this edge causal rather than inferred.
- name: Failed Retrograde Intraflagellar Transport
  biological_scale: CELLULAR
  description: >-
    Without functional IFT-A, cargo is not returned from the ciliary tip to the base.
    Patient fibroblasts show altered ciliary abundance and mislocalisation of
    anterograde IFT components.
  biological_processes:
  - preferred_term: intraciliary retrograde transport
    term:
      id: GO:0035721
      label: intraciliary retrograde transport
    modifier: DECREASED
  cellular_components:
  - preferred_term: primary cilium
    term:
      id: GO:0005929
      label: cilium
  evidence:
  - reference: PMID:22503633
    reference_title: "Mainzer-Saldino syndrome is a ciliopathy caused by IFT140 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Ciliary abundance and localization of anterograde IFTs were altered in fibroblasts of affected individuals, a result that supports the pivotal role of IFT140 in proper development and function of ciliated cells."
    explanation: Documents the ciliary transport phenotype in patient-derived cells.
  - reference: PMID:34890546
    reference_title: "Monoallelic IFT140 pathogenic variants are an important cause of the autosomal dominant polycystic kidney-spectrum phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IFT140 is a core component of the intraflagellar transport-complex A, responsible for retrograde ciliary trafficking and ciliary entry of membrane proteins"
    explanation: Independently states the retrograde trafficking and membrane-protein entry functions that fail here.
  downstream:
  - target: Disturbed Hedgehog Signal Transduction
    causal_link_type: DIRECT
- name: Disturbed Hedgehog Signal Transduction
  biological_scale: CELLULAR
  description: >-
    The primary cilium is the platform on which Hedgehog signalling is transduced, and
    a substantial part of the Ift140 mutant phenotype in mouse is attributable to
    altered Hedgehog signalling. Other ciliary signalling systems are also implicated,
    so this node is not curated as the sole downstream route.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24009529
    reference_title: "Cauli: a mouse strain with an Ift140 mutation that results in a skeletal ciliopathy modelling Jeune syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A number of these phenotypes can be attributed to alterations in Hedgehog signalling, although additional signalling systems are also likely to be involved."
    explanation: Supports Hedgehog disturbance as a mechanism while stating, in the source's own terms, that it is not the only one - which is why this node is not curated as the exclusive route.
  downstream:
  - target: Cone-shaped epiphysis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Narrow chest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nephronophthisis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Retinal dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

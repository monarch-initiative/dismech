    description: >-
      Complete Lef1 loss abolishes tooth, hair, whisker and mammary gland
      formation.
    limitations: >-
      The model is a homozygous null with postnatal lethality, more severe
      than the heterozygous human disease, and it was not reported to have
      limb malformations.

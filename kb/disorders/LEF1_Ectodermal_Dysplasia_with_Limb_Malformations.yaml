- name: Biallelic
  display_name: Biallelic LEF1 (autosomal recessive, severe)
  description: >-
    Biallelic LEF1 variant abolishing the interaction with beta-catenin,
    reported in one individual from a consanguineous family. Inherited as an
    autosomal recessive trait and associated with a severe phenotype.
  genes:
  - preferred_term: LEF1
    term:
      id: hgnc:6551
      label: LEF1
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "loss of β-catenin binding caused by biallelic variants is associated with a severe phenotype"
    explanation: >-
      Defines the biallelic stratum by its distinct molecular mechanism and
      greater severity.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic LEF1 variants were found in 11 affected individuals from 4
    families, and the two 4q25 deletions encompassing LEF1 arose de novo.
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Depending on the type and location of LEF1 variants, the inheritance of this novel Mendelian condition can be either autosomal dominant or recessive."
    explanation: >-
      States that the condition can be inherited as an autosomal dominant
      trait, for the monoallelic variants.
  - reference: PMID:32022899
    reference_title: LEF1 haploinsufficiency causes ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two unrelated patients with 4q25 de novo deletion encompassing LEF1, associated with severe oligodontia of primary and permanent dentition, hypotrichosis and hypohidrosis compatible with hypohidrotic ectodermal dysplasia."
    explanation: >-
      De novo heterozygous deletions in two unrelated patients are consistent
      with a dominant mode of inheritance.

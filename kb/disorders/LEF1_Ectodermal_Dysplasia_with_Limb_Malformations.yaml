    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "haploinsufficiency or loss of DNA binding are responsible for a mild to moderate phenotype"
    explanation: >-
      Functional characterisation of the monoallelic variants identifies
      haploinsufficiency or loss of DNA binding as their mechanism.
  - reference: PMID:32022899
    reference_title: LEF1 haploinsufficiency causes ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report two unrelated patients with 4q25 de novo deletion encompassing LEF1, associated with severe oligodontia of primary and permanent dentition, hypotrichosis and hypohidrosis compatible with hypohidrotic ectodermal dysplasia."
    explanation: >-
      Heterozygous deletions removing one copy of LEF1 cause hypohidrotic
      ectodermal dysplasia, consistent with haploinsufficiency.
  - reference: PMID:32022899
    reference_title: LEF1 haploinsufficiency causes ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide further evidence for LEF1 haploinsufficiency role in ectodermal dysplasia and delineate its clinical phenotype."
    explanation: >-
      The authors interpret the deletion phenotype as LEF1 haploinsufficiency;
      because the deletions are contiguous, other deleted genes could
      contribute.
  downstream:
  - target: Reduced TCF/LEF-Dependent WNT Target Gene Transcription
    causal_link_type: DIRECT
- name: Loss of LEF1-beta-catenin Binding
  description: >-
    A biallelic LEF1 variant abolishes the interaction between LEF1 and
    beta-catenin, so WNT-stabilised nuclear beta-catenin cannot recruit LEF1
    to activate target genes.
  biological_scale: MOLECULAR
  subtypes:
  - Biallelic
  genes:
  - preferred_term: LEF1
    term:
      id: hgnc:6551
      label: LEF1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Zygosity is not recorded. The abstract reports a single biallelic
      variant in a child of a consanguineous family, which suggests
      homozygosity, but does not state it.
  molecular_functions:
  - preferred_term: beta-catenin binding
    term:
      id: GO:0008013
      label: beta-catenin binding
    modifier: DECREASED
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "loss of β-catenin binding caused by biallelic variants is associated with a severe phenotype"
    explanation: >-
      Pulldown assays of the biallelic variant show loss of beta-catenin
      binding, the mechanism of the severe recessive form.
  downstream:
  - target: Reduced TCF/LEF-Dependent WNT Target Gene Transcription
    causal_link_type: DIRECT
- name: Reduced TCF/LEF-Dependent WNT Target Gene Transcription
  description: >-
    LEF1 is the nuclear effector that converts canonical WNT/beta-catenin
    signalling into target-gene expression. Loss of LEF1 dosage, DNA binding
    or beta-catenin binding reduces canonical WNT transcriptional output in
    the developing ectoderm and limb.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptomic studies reveal an alteration of WNT signaling."
    explanation: >-
      RNA sequencing of variant-expressing cells shows altered WNT signalling.
      The abstract gives no direction for the change, so the process is
      marked DYSREGULATED; reduced target-gene output is the expectation from
      loss of function, not a reported result.
  - reference: PMID:32022899
    reference_title: LEF1 haploinsufficiency causes ectodermal dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Wnt/β-catenin pathway requires the lymphoid enhancer-binding factor 1 (LEF1), a nuclear mediator, to activate target gene expression."
    explanation: >-
      Background statement of LEF1's role as the nuclear mediator of
      WNT/beta-catenin target-gene activation.
  downstream:
  - target: Failed Epithelial-Mesenchymal Induction of Ectodermal Appendages
    causal_link_type: DIRECT
  - target: Abnormal Limb Patterning
    causal_link_type: DIRECT
    description: >-
      The developmental step between reduced LEF1-dependent transcription and
      the limb malformations has not been characterised in patients; the
      edge rests on the co-occurrence of limb defects with LEF1 variants and
      on the altered WNT signalling shown in variant-expressing cells.
- name: Failed Epithelial-Mesenchymal Induction of Ectodermal Appendages
  description: >-
    Tooth, hair follicle and sweat gland development depend on reciprocal
    epithelial-mesenchymal signalling in which LEF1 is required in the
    epithelium and mesenchyme at successive stages. Reduced LEF1 activity
    impairs the formation of these ectodermal appendages, producing
    oligodontia, sparse hair and hypohidrosis.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: ectodermal cell
    term:
      id: CL:0000221
      label: ectodermal cell
  - preferred_term: dental and dermal papilla mesenchymal cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  biological_processes:
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: DECREASED
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: DECREASED
  - preferred_term: ectodermal placode formation
    term:
      id: GO:0060788
      label: ectodermal placode formation
    modifier: DECREASED
  evidence:
  - reference: PMID:7958926
    reference_title: Development of several organs that require inductive epithelial-mesenchymal interactions is impaired in LEF-1-deficient mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mutant mice lack teeth, mammary glands, whiskers, and hair but show no obvious defects in lymphoid cell populations at birth."
    explanation: >-
      Lef1-null mice fail to form teeth, hair and other ectodermal
      appendages, the organs affected in the human disease.
  - reference: PMID:8647435
    reference_title: Lef1 expression is activated by BMP-4 and regulates inductive tissue interactions in tooth and hair development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Subsequent formation of a whisker and tooth mesenchymal papilla and completion of organogenesis require transient expression of Lef1 in the epithelium."
    explanation: >-
      Tissue recombination experiments place LEF1 in the epithelial-mesenchymal
      induction that tooth and hair follicle development require.
  downstream:
  - target: Oligodontia
    causal_link_type: DIRECT
  - target: Taurodontism
    causal_link_type: DIRECT
    description: >-
      Taurodontism is a defect of root and pulp-chamber shape rather than a
      failure to form the tooth; attributing it to the same LEF1-dependent
      odontogenic signalling is an inference from its co-occurrence with
      oligodontia in the deletion carriers.
  - target: Sparse Hair
    causal_link_type: DIRECT
  - target: Hypohidrosis
    causal_link_type: DIRECT
    description: >-
      Sweat glands are ectodermal appendages, but the cited Lef1 mouse
      studies describe teeth, hair, whiskers and mammary glands, not sweat
      glands; the edge rests on hypohidrosis in patients and on the general
      appendage-induction role of LEF1.
- name: Abnormal Limb Patterning
  description: >-
    Limb malformations of the radial ray and the hand and foot rays,
    including radial ray defects, polydactyly and split hand/foot, occur in
    part of the affected individuals.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: embryonic limb morphogenesis
    term:
      id: GO:0030326
      label: embryonic limb morphogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:35583550
    reference_title: Monoallelic and biallelic variants in LEF1 are associated with a new syndrome combining ectodermal dysplasia and limb malformations caused by altered WNT signaling.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic spectrum includes various limb malformations, such as radial ray defects, polydactyly or split hand/foot, and ectodermal dysplasia."
    explanation: >-
      Documents limb malformations as part of the LEF1-related phenotype.
  downstream:
  - target: Radial Ray Defects
    causal_link_type: DIRECT
  - target: Polydactyly
    causal_link_type: DIRECT
  - target: Split Hand
    causal_link_type: DIRECT
  - target: Split Foot
    causal_link_type: DIRECT

name: LEF1 Ectodermal Dysplasia with Limb Malformations
creation_date: '2026-10-16T12:00:00Z'
category: Mendelian
description: >-
  Ectodermal dysplasia 17 with or without limb malformations is a rare
  WNT-pathway ectodermal dysplasia caused by germline variants in LEF1, the
  TCF/LEF transcription factor that partners with nuclear beta-catenin to
  activate canonical WNT target genes. Affected individuals have hypohidrotic
  ectodermal dysplasia (severe oligodontia, taurodontism, sparse hair,
  reduced sweating) with or without limb malformations such as radial ray
  defects, polydactyly and split hand/foot. Inheritance is autosomal dominant
  or autosomal recessive depending on the variant: heterozygous
  haploinsufficiency or loss of DNA binding gives a mild to moderate
  phenotype, while a biallelic variant abolishing beta-catenin binding gives a
  severe one.
synonyms:
- ectodermal dysplasia 17 with or without limb malformations
- LEF1-related ectodermal dysplasia
- LEF1-related ectodermal dysplasia and limb malformation syndrome
notes: >-
  No GeneReviews chapter exists for this disease (just check-genereviews
  reports NO_CHAPTER). MONDO:0979228 carries no Orphanet cross-reference, and
  ClinGen lists LEF1 as not curated for any gene-disease validity assertion
  (ClinGen search and gene-validity export, checked 2026-10-16). The human literature is small: the
  two 4q25 de novo deletions encompassing LEF1 reported by Levy et al. 2020
  (contiguous deletions, so other deleted genes may contribute) and the 12
  individuals from five families with intragenic LEF1 variants reported by
  Dufour et al. 2022. The Dufour abstract places the earlier deletions at
  4q35; LEF1 lies at 4q25, which is where Levy et al. map them.

  HPOA-annotated features not separately modeled here. The HPO
  disease-annotation file (phenotype.hpoa, checked directly against the
  current release) lists further features for OMIM:621224, curated from the
  full texts of PMID:35583550 and PMID:32022899 and not stated in either
  abstract, so they carry no quotable evidence here. They include Sparse
  eyebrow (HP:0045075) 6/12, Dry skin
  (HP:0000958) 5/13, Short thumb (HP:0009778) 4/11, Small thenar eminence
  (HP:0001245) 4/12, Hypoplastic nipples (HP:0002557) 4/10, Abnormal nail
  morphology (HP:0001597) 3/12, Eczematoid dermatitis (HP:0000964) 3/12 and
  Breast hypoplasia (HP:0003187) 2/10, 3-4 finger osseous syndactyly
  (HP:0006097) 2/3, Sparse eyelashes (HP:0000653) 2/4, Pectus excavatum
  (HP:0000767) 2/12, Short palm (HP:0004279) 2/12, Slow-growing scalp hair
  (HP:0100038) 2/10, Microdontia (HP:0000691) 1/1 and Delayed eruption of teeth
  (HP:0000684) 1/1, with single cases of patent ductus arteriosus, atrial
  septal defect, short stature and cryptorchidism among others. The polydactyly
  HPOA records is preaxial hand polydactyly (HP:0001177); the entry binds the
  broader Polydactyly term because that is what the cited abstract states.

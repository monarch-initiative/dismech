pathophysiology:
- name: LEF1 Haploinsufficiency or Loss of DNA Binding
  description: >-
    Heterozygous deletion of LEF1, or intragenic variants that reduce LEF1
    dosage or abolish binding of its HMG box to WNT-responsive enhancers,
    reduce the amount of functional LEF1 available to activate WNT target
    genes.
  biological_scale: MOLECULAR
  subtypes:
  - Monoallelic
  genes:
  - preferred_term: LEF1
    term:
      id: hgnc:6551
      label: LEF1
  genetic_context:

- category: Immunological
  name: HLH-Like Hyperinflammatory Syndrome
  description: >
    One of the two reported patients developed a hyperinflammatory episode fourteen
    months after the diagnosis of BCG-osis: prolonged unremitting high fever,
    splenomegaly, pancytopenia, very high ferritin and high fasting triglycerides.
    Hemophagocytic lymphohistiocytosis was suspected and treated as such, and it later
    relapsed with CNS involvement, prompting transplantation. No infectious cause was
    found and no mutation in a known HLH gene was identified.
  phenotype_term:
    preferred_term: Hemophagocytic lymphohistiocytosis-like syndrome
  notes: >-
    Deliberately left without a `term:` binding. HPO has no hemophagocytic
    lymphohistiocytosis class (searched via OAK), and HP:0012156 Hemophagocytosis would
    be positively wrong here: the source states explicitly that HLH was suspected but
    that no evidence of hemophagocytosis was found in the bone marrow. The evidenced
    component features are curated as separate phenotypes below.

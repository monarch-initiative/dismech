treatments:
- name: Antimycobacterial Therapy
  description: >
    Multidrug antimycobacterial treatment is the mainstay of management of the
    mycobacterial disease itself. One reported patient was treated with isoniazid,
    rifampicin and ethambutol for BCG-osis; therapy was complicated by conjugated
    hyperbilirubinaemia and raised liver enzymes that normalized on withdrawal, and the
    drugs were then sequentially reintroduced without further adverse effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  notes: >-
    The specific drug regimen and its hepatic adverse-effect course are reported in the
    case description of PMID:32163377. No exact-quote snippet is attached here because
    the relevant sentence is broken across lines by hyphenation in the cached full text;
    per the evidence SOP the claim is recorded in prose rather than with a paraphrased
    snippet.
- name: Recombinant Interferon Gamma
  description: >
    Subcutaneous recombinant IFN-gamma is the mechanistically rational therapy for this
    specific MSMD etiology. Because the defect is in the cytokine and not in its
    receptor or in the downstream JAK-STAT1 machinery, exogenous IFN-gamma can engage an
    intact receptor and restore macrophage activation. This is the therapeutic
    distinction between IFNG deficiency and complete IFN-gamma receptor deficiency, in
    which the cytokine cannot act. Recombinant IFN-gamma has already proven useful in
    other MSMD etiologies with impaired IFN-gamma production, such as IL-12Rbeta1
    deficiency.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  target_mechanisms:
  - target: Defective IFN-gamma-Dependent Macrophage Activation
    treatment_effect: ACTIVATES
    description: >-
      Exogenous recombinant IFN-gamma supplies the missing ligand to a structurally
      intact IFN-gamma receptor, restoring the macrophage-activating signal that the
      IFNG-null genotype abolishes.
  notes: >-
    Predicted benefit based on the intact receptor and on established efficacy in other
    MSMD etiologies with impaired IFN-gamma production; it is not a reported treatment
    outcome in the two IFNG-deficient patients themselves.
discussions:
- discussion_id: ifng_cytokine_replacement_efficacy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does recombinant IFN-gamma replacement prevent mycobacterial disease in patients
    with complete IFN-gamma deficiency, and at what dose and schedule?
  attaches_to:
  - "pathophysiology#Defective IFN-gamma-Dependent Macrophage Activation"
  rationale: >-
    The rationale for treating this etiology with the recombinant cytokine is strong and
    mechanistically explicit — the receptor and its signalling cascade are intact — but
    it rests on inference from the genotype and on efficacy demonstrated in other MSMD
    etiologies with impaired IFN-gamma production. Only two patients with IFNG deficiency
    have been reported, and no treatment outcome for cytokine replacement in this
    genotype has been published. Curators should not record recombinant IFN-gamma as an
    evidenced-effective therapy in this disorder.
  proposed_experiments:
  - experiment_id: ifng_replacement_registry_protocol
    name: Cytokine replacement in genotype-confirmed IFN-gamma deficiency
    description: >-
      Prospective observation of recombinant IFN-gamma-1b in genotype-confirmed IFNG-null
      patients, with mycobacterial disease recurrence and macrophage activation markers
      as endpoints. Given the rarity, an international MSMD registry protocol rather than
      a randomized trial is the realistic design.
- discussion_id: ifng_ligand_vs_receptor_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the clinical phenotype of complete IFN-gamma deficiency milder than that of
    complete IFN-gamma receptor 1 deficiency, and if so why?
  attaches_to:
  - "pathophysiology#Complete Loss of IFN-gamma Production"
  rationale: >-
    Complete IFN-gammaR1 deficiency is characteristically severe and often fatal without
    transplantation. Whether abolishing the ligand produces the same severity as
    abolishing the receptor cannot be settled from two patients, and any apparent
    difference could equally reflect ascertainment, BCG exposure, or residual
    receptor-mediated signalling by an as-yet-unidentified agonist — a possibility the
    original report raised explicitly before excluding it.
notes: >-
  Curated from the primary report of the IFNG etiology (PMID:32163377) together with two
  comprehensive MSMD reviews (PMID:25453225, PMID:30264912). Only two patients have been
  reported worldwide, so prevalence, progression, and treatment-outcome sections are
  deliberately omitted rather than extrapolated from the broader MSMD literature, whose
  figures describe a genetically heterogeneous population and not this etiology.

  Scope note: this entry is the IFNG (cytokine) etiology specifically. MSMD as a whole is
  genetically heterogeneous — 11 genes and 21 disorders as of the 2019 update — and would
  be a Grouping over the individual etiologies, not a single disease entry.

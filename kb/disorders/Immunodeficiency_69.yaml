inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Both reported patients are homozygous for the same IFNG frameshift deletion and
    are the offspring of consanguineous Lebanese families. Heterozygous carriers are
    healthy. IFNG has evolved under stronger negative selection than IFNGR1 or IFNGR2,
    which is the proposed explanation for why complete IFN-gamma deficiency is much
    rarer than complete IFN-gamma receptor deficiency.
  evidence:
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 2 Lebanese cousins with MSMD, living in Kuwait, who are both
      homozygous for a small deletion within the IFNG gene (c.354_357del), causing a
      frameshift that generates a premature stop codon (p.T119Ifs4*).
    explanation: >-
      Establishes homozygosity for a single IFNG frameshift allele in two related
      patients, the basis for autosomal recessive inheritance.
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Finally, we show that human IFNG has evolved under stronger negative selection
      than IFNGR1 or IFNGR2, suggesting that it is less tolerant to heterozygous
      deleterious mutations than IFNGR1 or IFNGR2.
    explanation: >-
      Population-genetic analysis explaining the rarity of the recessive IFNG
      etiology relative to the receptor etiologies of MSMD.
genetic:
- name: IFNG
  gene_term:
    preferred_term: IFNG
    term:
      id: hgnc:5438
      label: IFNG
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    Homozygous four-nucleotide deletion c.354_357del in IFNG, generating a frameshift
    and a premature stop codon (p.T119Ifs4*). The allele is both loss of expression and
    loss of function: patient-derived T lymphocytes produce no IFN-gamma, and the defect
    is corrected by retrotransduction with wild-type IFNG cDNA, establishing that the
    IFNG lesion is causal rather than coincidental.
  evidence:
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutant allele is loss of expression and loss of function."
    explanation: >-
      States the functional consequence of the c.354_357del IFNG allele.
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also show that the patients' herpesvirus Saimiri-immortalized T lymphocytes
      did not produce IFN-γ, a phenotype that can be rescued by retrotransduction with
      WT IFNG cDNA.
    explanation: >-
      Complementation of the patient cellular phenotype by wild-type IFNG cDNA
      establishes causality of the IFNG lesion.
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents of both patients and the siblings of P1 were heterozygous for the
      same variant, consistent with an AR trait having complete penetrance in each
      family.
    explanation: >-
      Establishes complete penetrance of the biallelic genotype and confirms carrier
      parents, supporting autosomal recessive transmission.
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      This variant was not found in our WES database (>6000 patients with various
      infectious diseases) or in public databases (gnomAD, version 2.1 and TOPMed
      BRAVO).
    explanation: >-
      Population-database absence of the allele, supporting its rarity and
      pathogenicity.
pathophysiology:
- name: Complete Loss of IFN-gamma Production
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: FRAMESHIFT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    The homozygous IFNG frameshift allele is a loss-of-expression, loss-of-function
    allele, so no functional interferon gamma is made. This is the initiating lesion:
    every downstream step follows from the absence of the cytokine, not from any defect
    in its receptor or in downstream signal transduction.

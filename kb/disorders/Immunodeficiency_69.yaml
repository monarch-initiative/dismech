  description: >
    The homozygous IFNG frameshift allele is a loss-of-expression, loss-of-function
    allele, so no functional interferon gamma is made. This is the initiating lesion:
    every downstream step follows from the absence of the cytokine, not from any defect
    in its receptor or in downstream signal transduction.

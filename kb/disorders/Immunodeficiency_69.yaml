progression:
- phase: Reported course of patient 1
  notes: >-
    The only published disease course in this genotype. BCG-osis diagnosed in infancy
    and treated with isoniazid, rifampicin and ethambutol; recombinant IFN-gamma
    (IMUKIN) started 18 months after initial presentation; an HLH-like hyperinflammatory
    syndrome fourteen months after the BCG-osis diagnosis, remitting on the HLH-04
    protocol; CNS relapse two weeks after completing the 40-week protocol; allogeneic
    HSCT from a matched sister at age 3; death nine days after transplantation. This is
    a single patient's course, not a natural history for the disorder.
  evidence:
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nine days after HSCT, the patient experienced a prolonged convulsion and died.
    explanation: >-
      Records the fatal outcome that terminates the only published disease course.
environmental:
- name: Bacille Calmette-Guerin (BCG) vaccination
  description: >
    Routine BCG immunisation is the sentinel environmental exposure in this disorder.
    The attenuated Mycobacterium bovis BCG strain is harmless to immunocompetent
    infants but disseminates in patients who cannot mount IFN-gamma-dependent macrophage
    activation, which is how MSMD patients typically come to attention.
  exposure_term:
    preferred_term: exposure to Bacille Calmette-Guerin vaccine
  effect: Triggers disseminated mycobacterial disease in IFN-gamma-deficient hosts.
  notes: >-
    `exposure_term` is deliberately left without a `term:` binding. ECTO was searched via
    OAK for vaccination, vaccine, BCG and Mycobacterium exposure classes and has none;
    the nearest hits are unrelated (e.g. ECTO:0070000 exposure to probiotic or bacteria
    supplement via ingestion). Recorded so a later curator does not repeat the search.
  evidence:
  - reference: PMID:32163377
    reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mendelian susceptibility to mycobacterial disease (MSMD) is characterized by a
      selective predisposition to clinical disease caused by the Bacille Calmette-Guérin
      (BCG) vaccine and environmental mycobacteria.
    explanation: >-
      Establishes BCG vaccine exposure as a defining trigger of clinical disease in this
      disease family.
  influences_mechanisms:
  - target: Uncontrolled Intramacrophagic Mycobacterial Replication
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      BCG vaccination introduces the live attenuated mycobacterium that then replicates
      unchecked in macrophages that cannot be activated without IFN-gamma.
    evidence:
    - reference: PMID:32163377
      reference_title: "Inherited human IFN-γ deficiency underlies mycobacterial disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mendelian susceptibility to mycobacterial disease (MSMD) is characterized by a
        selective predisposition to clinical disease caused by the Bacille Calmette-Guérin
        (BCG) vaccine and environmental mycobacteria.
      explanation: >-
        Links the BCG exposure to the failure of mycobacterial containment modelled by
        this node.
discussions:
- discussion_id: ifng_cytokine_replacement_efficacy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does recombinant IFN-gamma replacement prevent mycobacterial disease in patients
    with complete IFN-gamma deficiency, and at what dose and schedule?
  attaches_to:
  - "pathophysiology#Defective IFN-gamma-Dependent Macrophage Activation"
  rationale: >-
    The mechanistic rationale is strong and explicit — the receptor and its signalling
    cascade are intact, so exogenous cytokine can act. Exposure is also documented:
    patient 1 received IMUKIN at 50 micrograms/m2 three times weekly from 18 months
    after presentation. What cannot be concluded is efficacy. This is n=1, the course
    was confounded by a subsequent HLH-like syndrome treated with dexamethasone and
    etoposide, by a CNS relapse, and by allogeneic HSCT, and the patient died nine days
    after transplantation. No dose, schedule or endpoint has been evaluated in a second
    patient. Curators should therefore record recombinant IFN-gamma as administered but
    NOT as an evidenced-effective therapy in this disorder.
  proposed_experiments:
  - experiment_id: ifng_replacement_registry_protocol
    name: Cytokine replacement in genotype-confirmed IFN-gamma deficiency
    description: >-
      Prospective observation of recombinant IFN-gamma-1b in genotype-confirmed IFNG-null
      patients, with mycobacterial disease recurrence and macrophage activation markers
      as endpoints. Given the rarity, an international MSMD registry protocol rather than
      a randomized trial is the realistic design.
- discussion_id: ifng_ligand_vs_receptor_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the clinical phenotype of complete IFN-gamma deficiency milder than that of
    complete IFN-gamma receptor 1 deficiency, and if so why?
  attaches_to:
  - "pathophysiology#Complete Loss of IFN-gamma Production"
  rationale: >-
    Complete IFN-gammaR1 deficiency is characteristically severe and often fatal without
    transplantation. Whether abolishing the ligand produces the same severity as
    abolishing the receptor cannot be settled from two patients, and any apparent
    difference could equally reflect ascertainment, BCG exposure, or residual
    receptor-mediated signalling by an as-yet-unidentified agonist — a possibility the
    original report raised explicitly before excluding it.
notes: >-
  Curated from the primary report of the IFNG etiology (PMID:32163377) together with two
  comprehensive MSMD reviews (PMID:25453225, PMID:30264912).

  `progression` and the treatment outcomes ARE curated, from the individual course
  reported for patient 1 in the primary source. What remains deliberately absent is
  `prevalence`: the population figures in the MSMD literature describe a genetically
  heterogeneous group of 11 genes and 21 disorders, not this etiology, and only two
  patients with IFNG deficiency have been reported worldwide. An earlier version of this
  note also claimed progression and treatment outcomes were omitted; that was true of the
  first draft and is no longer true.

  Scope note: this entry is the IFNG (cytokine) etiology specifically. MSMD as a whole is
  genetically heterogeneous — 11 genes and 21 disorders as of the 2019 update — and would
  be a Grouping over the individual etiologies, not a single disease entry.

- name: Defective IFN-gamma-Dependent Macrophage Activation
  biological_scale: CELLULAR
  description: >
    IFN-gamma is the principal macrophage-activating cytokine. Without it, the
    IFN-gamma receptor on mononuclear phagocytes is never engaged, the JAK1/JAK2-STAT1
    cascade is not triggered, and the antimicrobial programme that allows macrophages to
    restrict intracellular mycobacteria is not induced. The receptor and its signalling
    machinery are structurally intact here, which is what distinguishes this etiology
    from the IFN-gamma receptor deficiencies and makes it pharmacologically addressable
    with the recombinant cytokine.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: cellular response to type II interferon
    term:
      id: GO:0071346
      label: cellular response to type II interferon
    modifier: DECREASED
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  downstream:
  - target: Uncontrolled Intramacrophagic Mycobacterial Replication
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nine gene products are physiologically related, as all are involved in
      IFN-γ-dependent immunity.
    explanation: >-
      Establishes that the shared final common pathway of all MSMD etiologies is
      IFN-gamma-dependent immunity, the step abolished here.
- name: Uncontrolled Intramacrophagic Mycobacterial Replication
  biological_scale: TISSUE
  description: >
    Weakly virulent mycobacteria — BCG vaccine strains and environmental non-tuberculous
    mycobacteria — persist and replicate inside macrophages that cannot be activated.
    Containment fails at the level of the granuloma, permitting local and then
    disseminated infection with organisms that immunocompetent hosts control without
    clinical disease.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: Mycobacterial and Salmonella Disease
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mendelian susceptibility to mycobacterial disease (MSMD) is a rare condition
      characterized by predisposition to clinical disease caused by weakly virulent
      mycobacteria, such as BCG vaccines and environmental mycobacteria, in otherwise
      healthy individuals with no overt abnormalities in routine hematological and
      immunological tests.
    explanation: >-
      Defines the selective susceptibility to weakly virulent mycobacteria that
      results from failure of IFN-gamma-dependent macrophage control.
- name: Mycobacterial and Salmonella Disease
  biological_scale: ORGANISM
  description: >
    The clinical phenotype. Disease ranges from localized BCG-itis at the vaccination
    site to disseminated BCG-osis and infection with environmental mycobacteria, and
    extends beyond mycobacteria: roughly half of MSMD patients also suffer clinical
    disease caused by non-typhoidal Salmonella, and milder chronic mucocutaneous
    candidiasis and other intramacrophagic infections are reported. One of the two
    reported IFN-gamma-deficient patients was diagnosed with BCG-osis after lymph node
    biopsy confirmed acid-fast bacilli.
  biological_processes:
  - preferred_term: response to bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: DECREASED
  evidence:
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD designation does not recapitulate all the clinical features, as patients are
      also prone to salmonellosis, candidiasis and tuberculosis, and more rarely to
      infections with other intramacrophagic bacteria, fungi, or parasites, and even,
      perhaps, a few viruses.
    explanation: >-
      Documents that the clinical phenotype extends beyond mycobacteria to other
      intramacrophagic organisms.

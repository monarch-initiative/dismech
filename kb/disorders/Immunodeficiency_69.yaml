name: Immunodeficiency 69
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
synonyms:
- IMD69
- Immunodeficiency 69, mycobacteriosis
- Immunodeficiency 69, mycobacteriosis, autosomal recessive
- IFNG deficiency, autosomal recessive
- Autosomal recessive complete IFN-gamma deficiency
description: >
  Immunodeficiency 69 is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function mutations in IFNG, the gene encoding interferon gamma
  itself. It presents as Mendelian susceptibility to mycobacterial disease (MSMD):
  a selective predisposition to clinical disease caused by weakly virulent
  mycobacteria, in particular the Bacille Calmette-Guerin (BCG) vaccine strain and
  environmental non-tuberculous mycobacteria, in individuals who are otherwise
  healthy and have no overt abnormality on routine haematological and immunological
  testing.

  MSMD is genetically heterogeneous and is caused by inborn errors of the IL-12/IFN-gamma
  circuit. Until 2020 every known genetic etiology affected a gene controlling the
  production of, or the response to, IFN-gamma — but not the cytokine gene itself.
  Immunodeficiency 69 closed that gap: two consanguineous Lebanese cousins living in
  Kuwait were found to be homozygous for a four-nucleotide deletion in IFNG
  (c.354_357del, p.T119Ifs4*) causing loss of expression and loss of function, with T
  and NK lymphocytes unable to produce or secrete detectable IFN-gamma.

  Because the lesion is in the ligand rather than in its receptor or in the downstream
  signalling machinery, the IFN-gamma receptor and the JAK-STAT1 pathway remain intact.
  This is the mechanistic basis for treating this specific etiology with recombinant
  IFN-gamma, an option that is not available in the complete IFN-gamma receptor
  deficiencies.

- name: Failure of T and NK Cell IFN-gamma Secretion
  biological_scale: CELLULAR
  description: >
    T lymphocytes and natural killer cells are the physiological sources of IFN-gamma in
    the IL-12/IFN-gamma circuit. In these patients both compartments fail to produce or
    secrete detectable IFN-gamma, so the effector limb of the circuit is silent even
    though IL-12 production and IL-12 receptor signalling are intact.

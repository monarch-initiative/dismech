- name: Caseating granulomatosis
  description: >-
    Caseating epithelioid granulomas with Langhans giant cells in laryngeal
    biopsy, the basis of most diagnoses.
  phenotype_term:
    preferred_term: Caseating granulomatosis
    term:
      id: HP:5210339
      label: Caseating granulomatosis
  evidence:
  - reference: PMID:42185811

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The typical histopathological features observed were the formation of
      epithelioid cell granulomas accompanied by varying degrees of caseous
      necrosis, surrounded by lymphocytes and Langhans giant cells.
    explanation: >-
      Caseating granulomas in laryngeal biopsies.
histopathology:
- name: Caseating epithelioid granulomas
  description: >-
    Epithelioid cell granulomas with caseous necrosis, Langhans giant cells and
    lymphocytes; some lesions show granulomas without necrosis.
  evidence:
  - reference: PMID:29201220
    reference_title: "Rigid laryngoscope manifestations of 61 cases of modern laryngeal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Pathological analysis indicated that there were a large number of
      phagocytes and giant cell reactions, stroma hyperplasia of epithelioid
      cells, and the Langhans cells constituted of granuloma and necrotic
      tissue, with caseous necrosis as a typical manifestation.
    explanation: >-
      Histopathology in 61 patients.
- name: Ulcerative versus exophytic lesion histology
  description: >-
    Biopsies of ulcerative lesions show mainly caseous necrosis with fewer
    granulomas and more often contain acid-fast bacilli; exophytic lesions
    show epithelioid granulomas and rarely detectable bacilli.
  evidence:
  - reference: PMID:42185811
    reference_title: "The evolving clinical profile of laryngeal tuberculosis: a 10-year retrospective study from a tertiary hospital in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In biopsies from ulcerative lesions, the predominant feature was caseous
      necrosis with reduced granuloma formation. Conversely, biopsies from
      exophytic lesions primarily revealed epithelioid granulomas with or
      without distinct caseous necrotic foci
    explanation: >-
      Contrasts the histology of ulcerative and exophytic lesions.
- name: Pseudoepitheliomatous hyperplasia
  description: >-
    Reactive hyperplasia of the overlying squamous epithelium that can be
    mistaken for squamous cell carcinoma in a superficial biopsy.
  evidence:
  - reference: PMID:10758999
    reference_title: "Laryngeal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      making the diagnosis difficult can be the presence of
      pseudoepitheliomatous hyperplasia, which mimics squamous cell
      carcinoma
    explanation: >-
      A case report's literature review describing the epithelial mimic.
progression:
- phase: Seeding of the larynx
  notes: >-
    Bacilli reach the larynx in sputum from active pulmonary disease or, in
    primary disease, directly from inhaled air.
  evidence:
  - reference: PMID:26628760
    reference_title: "Secondary laryngeal tuberculosis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Primary TB is caused by direct seeding of inhaled Mycobacteria Bacilli
      and secondary TB is caused by the seeding of bacilli in the larynx, from
      the lungs.
    explanation: >-
      States the two routes of seeding.
- phase: Active granulomatous laryngitis
  notes: >-
    Months of hoarseness and throat symptoms before diagnosis are typical; in
    case reports the median time to diagnosis is about three months.
  evidence:
  - reference: PMID:38238187
    reference_title: "Laryngeal tuberculosis in the early 21st century. Literature review of clinical, diagnostic and therapeutic data, according to SWiM guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Time to diagnosis varied from less than 1month to 36months, for a median
      3months, in case reports.
    explanation: >-
      Pooled time to diagnosis across case reports.
- phase: Treatment response and healing
  notes: >-
    Symptoms improve within days to months of starting chemotherapy and most
    lesions heal to a normal or scar-like mucosa.
  evidence:
  - reference: PMID:37979215
    reference_title: "Clinical characteristics and prognosis of laryngeal tuberculosis combined with respiratory tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The morphology of the pharyngeal and laryngeal mucosa returned to
      basically normal (59.4 %) or scar-like (34.4 %).
    explanation: >-
      Post-treatment mucosal appearance in followed patients.
- phase: Laryngeal sequelae
  notes: >-
    A small minority are left with scar adhesion, vocal fold fixation,
    persistent dysphonia or stenosis.
  evidence:
  - reference: PMID:38238187
    reference_title: "Laryngeal tuberculosis in the early 21st century. Literature review of clinical, diagnostic and therapeutic data, according to SWiM guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Overall rates of cure, death, treatment resistance, adverse events, and
      laryngeal sequelae were 99%, 0.5%, 0.5%, 6% and 5%, respectively.
    explanation: >-
      Laryngeal sequelae in about 5% of pooled cases.
diagnosis:
- name: Laryngoscopy
  description: >-
    Flexible, rigid or video laryngoscopy shows the site, extent and
    morphology of the lesions (inflammatory-infiltrative, ulcerative-necrotic,
    granulomatous-proliferative or mixed). No appearance is pathognomonic, but
    polymorphic, multi-site lesions should raise suspicion.
  diagnosis_term:
    preferred_term: laryngoscopy
    term:
      id: NCIT:C16781
      label: Laryngoscopy
  evidence:
  - reference: PMID:42185811
    reference_title: "The evolving clinical profile of laryngeal tuberculosis: a 10-year retrospective study from a tertiary hospital in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Otorhinolaryngologists should consistently consider LTB in the
      differential diagnosis, particularly for patients with high-risk factors
      for tuberculosis who present with polymorphic lesions involving multiple
      laryngeal sites on laryngoscopy.
    explanation: >-
      The series' conclusion on the laryngoscopic pattern that should prompt
      suspicion.
- name: Laryngeal Biopsy Histopathology
  description: >-
    Biopsy is required to confirm the diagnosis and to exclude carcinoma and
    other granulomatous diseases. Series define the diagnosis as a laryngeal
    lesion with granulomatous inflammation (with or without caseation),
    acid-fast bacilli or PCR positivity in tissue, or M. tuberculosis in sputum,
    or as granulomatous inflammation that responds completely to therapy.
  diagnosis_term:
    preferred_term: histopathology of laryngeal biopsy
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:42185811
    reference_title: "The evolving clinical profile of laryngeal tuberculosis: a 10-year retrospective study from a tertiary hospital in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The diagnostic criteria for LTB infection required, in addition to the
      identification of a laryngeal lesion, at least one of the following:
      histopathology consistent with chronic granulomatous inflammation with
      or without caseous necrosis; positive acid-fast staining or polymerase
      chain reaction (PCR) on histopathological sections; or detection of
      Mycobacterium tuberculosis in sputum smear.
    explanation: >-
      The case definition used in a 49-patient series.
  - reference: PMID:29201220
    reference_title: "Rigid laryngoscope manifestations of 61 cases of modern laryngeal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, pathological biopsies and acid-fast bacilli examinations are
      required for the final diagnosis.
    explanation: >-
      States that biopsy is required for the final diagnosis.
- name: Mycobacterial Culture and Xpert MTB/RIF on Laryngeal Tissue
  description: >-
    Tissue culture and nucleic acid testing add to histology. In a South
    African prospective series Xpert MTB/RIF on laryngeal biopsies was
    insensitive, and a combination of histology, culture and PCR was needed.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:32328767
    reference_title: "Diagnosis of laryngeal tuberculosis in a high TB burden area."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The results suggest that the diagnosis of laryngeal TB required a
      combination of histopathology, culture and PCR and that the Xpert
      MTB/RIF assay is not a sensitive test for the diagnosis of laryngeal TB.
    explanation: >-
      Prospective series of 80 laryngeal biopsies in a high-burden area.
- name: Sputum Acid-Fast Bacilli Smear and Culture
  description: >-
    Sputum examination supports the diagnosis and is more often positive than
    laryngeal tissue in patients with pulmonary disease, but a positive sputum
    does not show that the larynx is involved.
  diagnosis_term:
    preferred_term: sputum mycobacterial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:27077734
    reference_title: "Factors Associated with Clinical and Topographical Features of Laryngeal Tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We emphasize the need for histopathologic confirmation, once positive
      sputum bacteriological examinations seem not to necessarily reflect
      laryngeal involvement.
    explanation: >-
      Sputum positivity does not localize disease to the larynx.
- name: Chest Computed Tomography
  description: >-
    Chest CT detects concurrent pulmonary tuberculosis much more often than
    chest radiography and separates secondary from primary disease.
  diagnosis_term:
    preferred_term: chest computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:37979215
    reference_title: "Clinical characteristics and prognosis of laryngeal tuberculosis combined with respiratory tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 75 patients (56.0 %) were finally diagnosed with combined
      pulmonary tuberculosis (PTB), with a positive chest X-ray rate of 25.6 %
      and a positive chest CT rate of 71.2 %.
    explanation: >-
      Chest CT detected pulmonary TB far more often than radiography.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard four-drug antituberculous chemotherapy (isoniazid, rifampicin,
    pyrazinamide and ethambutol for two months, then isoniazid and rifampicin)
    for at least six months, longer in some series, cures nearly all
    patients with few laryngeal sequelae.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Laryngitis
    treatment_effect: INHIBITS
    description: >-
      Bactericidal therapy kills the bacilli driving the granulomatous
      laryngitis, and lesions heal.
    evidence:
    - reference: PMID:30251032
      reference_title: "Primary Laryngeal Tuberculosis: A Series of 15 Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        The response to anti-tuberculosis therapy was desirable in all
        patients.
      explanation: >-
        All 15 patients responded to chemotherapy.
  evidence:
  - reference: PMID:26628760
    reference_title: "Secondary laryngeal tuberculosis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Category 1 consisted of isoniazid, rifampicin, pyrazinamide, and
      ethambutol for two months followed by isoniazid and rifampicin for
      another four months.
    explanation: >-
      The regimen given to four patients, whose laryngeal findings resolved.
  - reference: PMID:38238187
    reference_title: "Laryngeal tuberculosis in the early 21st century. Literature review of clinical, diagnostic and therapeutic data, according to SWiM guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Quadritherapy is highly effective, with a low resistance rate and few
      adverse effects or laryngeal sequelae.
    explanation: >-
      Pooled review conclusion on four-drug therapy.
- name: Tracheotomy for Airway Compromise
  description: >-
    Surgery is reserved for airway compromise; emergency tracheotomy secures
    the airway in critical obstruction, and the patient can be decannulated
    after chemotherapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: tracheotomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  target_mechanisms:
  - target: Upper airway obstruction
    treatment_effect: INHIBITS
    description: >-
      A tracheotomy bypasses the obstructed larynx.
  evidence:
  - reference: PMID:10758999
    reference_title: "Laryngeal tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment is primarily with antituberculous medications with surgery
      reserved for those cases of airway compromise.
    explanation: >-
      A case report's literature review on the place of surgery.
  - reference: PMID:29348284
    reference_title: "Laryngeal tuberculosis: a rare cause of critical airway obstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient was commenced on a 24-week course of anti-tuberculous
      treatment and was successfully decannulated 6 months after the
      emergency airway was established.
    explanation: >-
      Decannulation after chemotherapy in a case of critical obstruction.

name: Laryngeal Tuberculosis
creation_date: "2026-11-26T03:49:03Z"
description: >-
  Laryngeal tuberculosis is tuberculosis of the larynx and the most common
  granulomatous disease of that organ. Mycobacterium tuberculosis reaches the
  laryngeal mucosa either in bacilli-laden sputum from active, often cavitary,
  pulmonary tuberculosis (secondary laryngeal tuberculosis) or by direct
  seeding of inhaled bacilli without lung disease (primary laryngeal
  tuberculosis). In the pre-chemotherapy era it was a late complication of
  advanced pulmonary disease that mainly affected the posterior larynx. Modern
  series describe patients with mainly laryngeal symptoms, frequent lesions of
  the true vocal folds and the anterior larynx, multi-site involvement, and a
  substantial share with no active lung disease. Caseating granulomatous
  inflammation produces inflammatory-infiltrative, ulcerative, exophytic or
  leukoplakic lesions that can mimic laryngeal carcinoma. Hoarseness is the
  main symptom, with odynophagia, dysphagia, cough and, with extensive disease,
  dyspnea, stridor and airway obstruction. Diagnosis rests on biopsy
  histopathology with mycobacterial staining, culture or nucleic acid testing,
  supported by chest imaging and sputum examination. The disease is highly
  contagious. Standard antituberculous chemotherapy cures nearly all patients;
  scarring, vocal fold fixation, persistent dysphonia and laryngeal stenosis
  are uncommon sequelae.
category: Infectious Disease
disease_term:
  preferred_term: laryngeal tuberculosis
  term:
    id: MONDO:0005819
    label: laryngeal tuberculosis
parents:
- Tuberculosis
- Extrapulmonary tuberculosis
- Laryngitis
synonyms:
- tuberculous laryngitis
- tuberculosis of the larynx
notes: >-
  The literature on this disease is single-centre retrospective case series
  (the largest cited here has 134 patients) and case reports, plus one
  structured literature review of 119 articles. No prospective or controlled
  study defines its pathogenesis; the routes of laryngeal seeding are stated
  in case-series discussions rather than demonstrated. Symptom frequencies
  differ widely between series, partly because the share of patients with
  concurrent pulmonary tuberculosis differs (from about a third in a Shanghai
  series to nearly all patients in a Brazilian series), so frequencies are set
  only where a cited series quotes a figure. The primary and secondary forms
  are recorded as subtypes because one series compared them directly and
  reported different lesion patterns; the boundary between them depends on how
  thoroughly the chest is imaged. Seeded from PubMed searches and
  `research/Laryngeal_Tuberculosis-deep-research-claude_code.md`.
review_notes: >-
  Deliberately lumped. All laryngeal tuberculosis is kept in one entry
  regardless of the infecting Mycobacterium tuberculosis complex organism or
  lineage. PubMed was searched for laryngeal tuberculosis titles and for
  laryngeal disease with Mycobacterium bovis; the laryngeal literature found
  identifies M. tuberculosis as the agent and no source reports a species,
  lineage or drug-resistance stratum with its own presentation, diagnostic
  pathway or first-line therapy, so no organism subtype is recorded. The
  primary and secondary clinical forms are kept as subtypes on the strength
  of a direct comparison of their lesion patterns, not as separate entries.

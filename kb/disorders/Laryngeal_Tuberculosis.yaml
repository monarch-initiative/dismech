    recorded predisposing factors; the rise in tuberculosis linked to the HIV
    epidemic is cited as a reason laryngeal involvement may be increasing.
  influences_mechanisms:
  - target: Caseating Granulomatous Laryngitis
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

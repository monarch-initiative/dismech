- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes pulmonary tuberculosis
    and, when it reaches the larynx, a chronic granulomatous laryngitis.
  evidence:
  - reference: PMID:42185811
    reference_title: "The evolving clinical profile of laryngeal tuberculosis: a 10-year retrospective study from a tertiary hospital in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Laryngeal tuberculosis (LTB) is a chronic granulomatous disease caused
      by Mycobacterium tuberculosis, characterized by the formation of
      granulomas in laryngeal tissue and a cell-mediated immune response
    explanation: >-
      Names M. tuberculosis as the cause of laryngeal tuberculosis.
agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by airborne droplet nuclei.
    It reaches the larynx in sputum coughed up from pulmonary lesions or by
    direct deposition of inhaled bacilli, and bacilli shed from laryngeal
    lesions are expelled into the air again. No non-human reservoir is
    described in the laryngeal tuberculosis literature.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition
  description: >-
    Infection is acquired by inhaling airborne bacilli. Laryngeal tuberculosis
    is itself highly contagious; in a Japanese registry analysis patients with
    laryngeal tuberculosis were index cases of transmission clusters more
    often than patients with bronchial tuberculosis.
  evidence:
  - reference: PMID:16838680
    reference_title: "[Difference in transmissibility between bronchial and laryngeal tuberculosis--a retrospective epidemiological study of TB patients newly registered in recent 19 years in Aichi Prefecture, Japan]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The proportion of the index patients among overall bronchial and
      laryngeal TB patients was 2.0% and 10.7% (p<0.05)
    explanation: >-
      In a 19-year registry, laryngeal TB patients were more often the index
      case of a transmission group than bronchial TB patients.
  - reference: PMID:16838680
    reference_title: "[Difference in transmissibility between bronchial and laryngeal tuberculosis--a retrospective epidemiological study of TB patients newly registered in recent 19 years in Aichi Prefecture, Japan]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      These findings suggest that bronchial TB is less infectious than
      laryngeal TB.
    explanation: >-
      The authors' conclusion that laryngeal TB is the more infectious form.
  - reference: PMID:8527545
    reference_title: "Infectiousness of a university student with laryngeal and cavitary tuberculosis. Investigative team."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The source case was highly infectious; transmission following only a
      few hours of exposure was documented.
    explanation: >-
      An outbreak investigation traced six active cases and many tuberculin
      conversions to one student with laryngeal and cavitary TB; the
      laryngeal and pulmonary contributions cannot be separated.
  - reference: PMID:33371143
    reference_title: "Appearance and morphologic features of laryngeal tuberculosis using laryngoscopy: A retrospective cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Similar to pulmonary TB, LTB is highly contagious; and therefore, early
      diagnoses are imperative to plan both therapeutic and public health
      strategies.
    explanation: >-
      A case series' introduction restating the high contagiousness of the
      disease.
has_subtypes:
- name: Secondary
  display_name: Secondary laryngeal tuberculosis
  classification: clinical_form
  description: >-
    Laryngeal tuberculosis in a patient with active pulmonary tuberculosis,
    caused by sputum-borne seeding of the larynx from the lungs. Compared with
    the primary form, a direct comparison found ulcerative, edematous and
    multi-site lesions, and ulcerative extensive lesions go with positive
    sputum smears and cultures, which bears on infectiousness and on how the
    diagnosis is made.
  evidence:
  - reference: PMID:26628760
    reference_title: "Secondary laryngeal tuberculosis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Primary TB is caused by direct seeding of inhaled Mycobacteria Bacilli
      and secondary TB is caused by the seeding of bacilli in the larynx, from
      the lungs.
    explanation: >-
      A case series' discussion defining the two forms by route of seeding.
  - reference: PMID:33540970
    reference_title: "[Comparative analysis of clinical features of primary and secondary laryngeal tuberculosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Secondary laryngeal TB of larynx was characterized by ulcers, edema
      effusive, multiple sites lesions.
    explanation: >-
      In 39 secondary cases compared with 64 primary cases, secondary disease
      showed ulcerative, edematous, multi-site lesions.
  - reference: PMID:33371143
    reference_title: "Appearance and morphologic features of laryngeal tuberculosis using laryngoscopy: A retrospective cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In LTB patients with extensive lesions, ulcerative lesions were most
      common, and the proportion of cases with concurrent pulmonary
      tuberculosis (86.4%, P = .033) infection was higher, as were the
      positive rates of sputum smears (72.7%, P = .011) and cultures (86.4%,
      P = .002) than patients without concurrent pulmonary TB and with more
      localized and exophytic lesions.
    explanation: >-
      Links extensive ulcerative lesions with concurrent pulmonary TB and
      sputum positivity.
- name: Primary
  display_name: Primary laryngeal tuberculosis
  classification: clinical_form
  description: >-
    Laryngeal tuberculosis without evidence of pulmonary tuberculosis,
    attributed to direct seeding of inhaled bacilli. A direct comparison found
    mostly single, hyperplastic lesions. Chest imaging and sputum tests are
    negative, so the diagnosis depends on biopsy of the laryngeal lesion.
  evidence:
  - reference: PMID:33540970
    reference_title: "[Comparative analysis of clinical features of primary and secondary laryngeal tuberculosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Most patients with primary tuberculosis of the larynx present a single,
      hyperplastic lesion
    explanation: >-
      Reports the predominant lesion pattern of primary laryngeal TB in 64
      patients.
  - reference: PMID:30251032
    reference_title: "Primary Laryngeal Tuberculosis: A Series of 15 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Any evidence of pulmonary tuberculosis was ruled out by chest X-ray
      findings.
    explanation: >-
      Defines a series of primary laryngeal TB by the absence of pulmonary
      disease on chest X-ray.
  - reference: PMID:38440428
    reference_title: "Laryngeal Tuberculosis: Current Patterns of Presentation and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      surgical excision with histopathological testing is essential for
      accurate diagnosis in primary laryngeal TB and the "dirty larynx" picture
      aids in the diagnosis of secondary laryngeal TB
    explanation: >-
      Reports a different diagnostic route for the two forms in a small
      series.
prevalence:
- population: Newly registered tuberculosis patients, Aichi Prefecture, Japan, 1985-2003
  measure_type: UNKNOWN
  notes: >-
    Laryngeal tuberculosis made up 0.10% of all registered tuberculosis
    patients. This is a share of tuberculosis cases, not a population
    prevalence or incidence, so no rate or band is asserted. Case-series
    reviews put laryngeal tuberculosis at under 2% of extrapulmonary
    tuberculosis and at 0.08-5.1% of patients with pulmonary tuberculosis, and
    note that it is probably underdiagnosed because patients with pulmonary
    tuberculosis are rarely examined by an otorhinolaryngologist.
  evidence:
  - reference: PMID:16838680
    reference_title: "[Difference in transmissibility between bronchial and laryngeal tuberculosis--a retrospective epidemiological study of TB patients newly registered in recent 19 years in Aichi Prefecture, Japan]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bronchial TB patients occupied 0.55% of total TB patients, and laryngeal
      TB patients occupied 0.10%.
    explanation: >-
      Registry share of laryngeal TB among all TB patients.
  - reference: PMID:27077734
    reference_title: "Factors Associated with Clinical and Topographical Features of Laryngeal Tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Literature data indicates that LTB incidence rate among patients
      diagnosed with pulmonary TB varies between 0.08 and 5.1%
    explanation: >-
      A case series' introduction restating the reported range of laryngeal
      involvement in pulmonary TB.

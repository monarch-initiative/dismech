      contributors.
pathophysiology:
- name: Active Pulmonary Tuberculosis with Bacilliferous Sputum
  role: trigger
  description: >-
    Active, often cavitary, pulmonary tuberculosis produces sputum laden with
    bacilli. Most patients in several modern series still have concurrent
    active or inactive pulmonary disease on chest CT.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:42185811
    reference_title: "The evolving clinical profile of laryngeal tuberculosis: a 10-year retrospective study from a tertiary hospital in northern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Chest CT findings indicated that 73.47% of patients had concomitant
      active or inactive pulmonary tuberculous foci.
    explanation: >-
      Most laryngeal TB patients in this series had pulmonary tuberculous
      foci.
  - reference: PMID:26628760
    reference_title: "Secondary laryngeal tuberculosis revisited."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Chest x-ray and high-resolution computed tomography (HRCT) chest
      revealed cavitatory lesions
    explanation: >-
      Patients with secondary laryngeal TB had cavitary pulmonary lesions.
  downstream:
  - target: Sputum-Borne Seeding of the Laryngeal Mucosa
    causal_link_type: DIRECT
    description: >-
      Bacilli in sputum from the lungs seed the laryngeal mucosa.
    evidence:
    - reference: PMID:26628760
      reference_title: "Secondary laryngeal tuberculosis revisited."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        all four patients were diagnosed to have secondary laryngeal
        tuberculosis, due to the seedlings of the bacilli in the larynx from
        the pulmonary lesion
      explanation: >-
        Attributes laryngeal disease in four patients with cavitary pulmonary
        TB to seeding from the lung lesion.
- name: Sputum-Borne Seeding of the Laryngeal Mucosa
  description: >-
    Bacilli carried in sputum from pulmonary lesions deposit on and invade the

  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Electron microscopy revealed that demyelinating fibers and internodal lengths were
      shortened in both transgenic mice.'
    explanation: Ultrastructural demonstration of the myelin defect in the mouse model. Note the
      finding is present in both mutant and wild-type-overexpressing animals, which is what the
      dosage node below rests on.
  downstream:
  - target: Segmental Demyelination and Remyelination
    causal_link_type: DIRECT
    description: An unstable sheath is repeatedly lost and rebuilt along the internode.
- name: PMP2 Dosage Sensitivity
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    A parallel mechanistic claim, and the most surprising finding in this
    literature. In the transgenic experiment, mice overexpressing wild-type P2
    developed abnormal motor function, reduced motor nerve conduction velocity and
    shortened internodes just as the p.I43N animals did. That is the same pattern
    PMP22 shows, where duplication rather than a coding change causes CMT1A, and
    it suggests myelin is sensitive to P2 dose as such.

    Graded HYPOTHETICAL for human CMT1G because no patient has been reported with
    a PMP2 duplication or with overexpression - the finding is a property of a
    transgenic overexpression system, and the authors themselves call for further
    mechanistic work. It is curated because it is the strongest available
    constraint on how the human missense alleles act.
  genes:
  - preferred_term: PMP2
    term:
      id: hgnc:9117
      label: PMP2
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Transgenic mice expressing wild type or mutant (p.I43N) PMP2 exhibited abnormal motor
      function.'
    explanation: The result itself - both transgenes produce the phenotype, so the mutation is not
      required for it in this system.
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'These data imply that overexpression of wild type as well as mutant PMP2 also causes
      the CMT1 phenotype, which has been documented in the PMP22.'
    explanation: The authors' own interpretation, and their explicit analogy to PMP22 dosage
      disease, which is why this is modelled as a dosage mechanism rather than as a failed control.
  downstream:
  - target: Schwann Cell Myelin Sheath Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Route by which excess P2, independent of any coding change, produces the
      same sheath defect in the mouse model.
- name: Segmental Demyelination and Remyelination
  biological_scale: TISSUE
  description: >-
    Repeated cycles of myelin loss and repair along the nerve. The histological
    signature is the onion bulb - concentric layers of Schwann cell processes
    around an axon - together with reduced numbers of myelinated fibres and varied
    myelin abnormalities on sural nerve biopsy.
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Sural nerve biopsy showed onion bulbs and degenerating fibers with various myelin
      abnormalities.'
    explanation: The human histopathology, which is what makes this a tissue-level node rather than
      an inference from the mouse.
  downstream:
  - target: Slowed Motor Nerve Conduction
    causal_link_type: DIRECT
    description: Loss of saltatory conduction across demyelinated and remyelinated segments slows
      the nerve.
- name: Slowed Motor Nerve Conduction
  biological_scale: TISSUE
  description: >-
    Motor nerve conduction velocities fall into the demyelinating range, below the
    38 m/s threshold that defines CMT1 against the axonal forms. This is the
    measurement that classifies the disease.
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'CMT is broadly classified into the demyelinating type (CMT1) with slowed motor nerve
      conduction velocity (MNCV) of <38m/s, and the axonal defective type (CMT2) with reduced
      conduction velocity, >38m/s'
    explanation: Gives the numeric threshold that places this disease among the demyelinating
      neuropathies. Background classification rather than a finding in these patients.
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Electrophysiological data revealed that both mice had reduced motor nerve conduction
      velocities (MNCV).'
    explanation: The same electrophysiological abnormality reproduced in the transgenic model.
  downstream:
  - target: Length-Dependent Distal Motor and Sensory Deficit
    causal_link_type: DIRECT
    description: Chronically impaired conduction, worst in the longest fibres, produces the
      length-dependent clinical picture.
- name: Length-Dependent Distal Motor and Sensory Deficit
  biological_scale: ORGANISM
  description: >-
    The clinical syndrome. Weakness and wasting begin in the distal leg and
    progress slowly and predominantly in the lower limbs, with sensory loss, foot
    deformity and depressed reflexes. Muscle imaging shows fatty replacement
    concentrated in the anterior and lateral compartments, the same distribution
    seen in CMT1A.
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The age at onset was the first to second decades and muscle atrophy started in the
      distal portion of the leg.'
    explanation: Gives both the age of onset and the distal-first distribution that defines the
      length-dependent pattern.
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Predominant fatty replacement in the anterior and lateral compartment was similar to
      that in CMT1A caused by PMP22 duplication.'
    explanation: Documents the muscle imaging pattern and its indistinguishability from CMT1A, which
      is the basis for the diagnostic difficulty this entry records.
  downstream:
  - target: Distal muscle weakness
    causal_link_type: DIRECT
  - target: Distal amyotrophy
    causal_link_type: DIRECT
  - target: Pes cavus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Long-standing imbalance between weakened and preserved foot muscles deforms the
      arch.

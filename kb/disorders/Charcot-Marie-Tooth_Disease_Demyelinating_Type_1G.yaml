  evidence:
  - reference: PMID:34758297
    reference_title: PMP2/FABP8 induces PI(4,5)P(2)-dependent transbilayer reorganization of sphingomyelin
      in the plasma membrane.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'We show that peripheral myelin protein 2 (PMP2), a member of the fatty-acid-binding
      protein (FABP) family, can localize at the PM and controls the transbilayer distribution of
      SM.'
    explanation: Establishes the normal function whose disturbance this node describes.
  - reference: PMID:34758297
    reference_title: PMP2/FABP8 induces PI(4,5)P(2)-dependent transbilayer reorganization of sphingomyelin
      in the plasma membrane.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'PMP2 induces the tubulation of model membranes in a PI(4,5)P2-dependent manner,
      accompanied by the modification of the transbilayer membrane distribution of lipids.'
    explanation: Names the mechanism - PI(4,5)P2-dependent tubulation with leaflet redistribution -
      that the disease allele amplifies.
  downstream:
  - target: Schwann Cell Myelin Sheath Instability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Compact myelin is an extreme lipid structure, so a protein that sets leaflet
      lipid distribution within it is expected to affect sheath integrity. The
      intervening steps between altered lipid handling and an unstable sheath are
      not established in these sources.
- name: Schwann Cell Myelin Sheath Instability
  biological_scale: CELLULAR
  description: >-
    Myelinating Schwann cells fail to build or maintain a normal sheath.
    Transgenic mice show shortened internodes and demyelinating fibres by electron
    microscopy, which is the cellular readout of the defect.
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell

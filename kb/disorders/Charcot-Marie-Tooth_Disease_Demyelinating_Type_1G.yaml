inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous PMP2 variants segregating with disease across generations. Both
    inherited and de novo alleles are reported; one family was ascertained
    through a de novo variant that the proband then transmitted to an affected
    son.
  evidence:
  - reference: PMID:27009151
    reference_title: De novo PMP2 mutations in families with type 1 Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This mutation (p.Ile52Thr) was passed from the proband to his one affected son, and
      segregates with clinical and electrophysiological evidence of demyelinating neuropathy.'
    explanation: Transmission from proband to affected son with electrophysiological confirmation,
      which is the segregation evidence for dominant inheritance.
epidemiology:
- name: Frequency among CMT1
  description: >-
    A rare cause of CMT1. PMP2 was found in one of a screened cohort of 136
    European probands whose CMT had no identified genetic cause after standard
    testing, which places it well below the common CMT1 genes.
  evidence:
  - reference: PMID:27009151
    reference_title: De novo PMP2 mutations in families with type 1 Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We then screened a cohort of 136 European probands with uncharacterized genetic cause
      of Charcot-Marie-Tooth disease and identified another family with Charcot-Marie-Tooth disease
      type 1 that has a mutation affecting an adjacent amino acid (p.Thr51Pro), which segregates
      with disease.'
    explanation: One additional family from 136 genetically unexplained probands, which is the only
      denominator-bearing frequency statement available for this gene.
genetic:
- name: PMP2
  gene_term:
    preferred_term: PMP2
    term:
      id: hgnc:9117
      label: PMP2
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense and small in-frame deletion alleles. Reported variants
    include p.Ile43Asn, p.Thr51Pro, p.Ile52Thr, p.Ile50del, p.Met114Thr and
    p.Val115Ala. The first four cluster in the lipid-binding cavity of the
    beta-barrel, and p.Ile50del is recurrent across unrelated families. No
    truncating or whole-gene-deletion allele has been reported, which is
    consistent with a mechanism that needs an expressed protein rather than
    simple haploinsufficiency.
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In this study, we identified p.I43N mutation in PMP2 from a family exhibiting
      autosomal dominant demyelinating CMT neuropathy by whole exome sequencing and characterized
      the clinical features.'
    explanation: The first report establishing PMP2 as a CMT1 gene, and the source of the p.I43N
      allele.
  - reference: PMID:32277537
    reference_title: Early onset demyelinating Charcot-Marie-Tooth disease caused by a novel in-frame isoleucine
      deletion in peripheral myelin protein 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A novel PMP2: p.I50del has been identified in a child with early onset CMT1 and in
      three affected family members.'
    explanation: The in-frame deletion allele, in four affected members of one family, which
      broadens the allelic spectrum beyond missense.
pathophysiology:
- name: PMP2 Variant Altering P2 Lipid Handling
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Heterozygous PMP2 variants sit in or beside the
    fatty-acid-binding cavity of the P2 beta-barrel. Structural work across three
    variants found only minor changes to the fold and to solution structure, but
    reduced thermal stability and altered fatty acid binding - so the protein is
    made and folded, and what changes is what it binds.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
  genes:
  - preferred_term: PMP2
    term:
      id: hgnc:9117
      label: PMP2
  molecular_functions:
  - preferred_term: fatty acid binding
    modifier: DYSREGULATED
    term:
      id: GO:0005504
      label: fatty acid binding
  evidence:
  - reference: PMID:34138518
    reference_title: 'Human myelin protein P2: from crystallography to time-lapse membrane imaging and
      neuropathy-associated variants.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'The crystal and solution structures of the I50del, M114T and V115A variants of P2
      showed minor differences to the wild-type protein, whereas their thermal stability was
      reduced.'
    explanation: Establishes that the variants do not grossly misfold - the barrel is intact and
      only its stability is reduced, which is why the mechanism is modelled as altered ligand
      handling rather than loss of the protein.
  - reference: PMID:34138518
    reference_title: 'Human myelin protein P2: from crystallography to time-lapse membrane imaging and
      neuropathy-associated variants.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Vesicle aggregation assays revealed no change in membrane stacking characteristics,
      while the variants showed altered fatty acid binding.'
    explanation: The key dissociation. Membrane stacking is preserved and fatty acid binding is
      not, which is what makes lipid handling rather than stacking the affected function.
  - reference: PMID:32277537
    reference_title: Early onset demyelinating Charcot-Marie-Tooth disease caused by a novel in-frame isoleucine
      deletion in peripheral myelin protein 2.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: 'Molecular modeling analysis and in silico evaluations do not suggest a strong impact
      on the overall protein structure, but a most likely altered protein function.'
    explanation: An independent, computational route to the same conclusion for the p.I50del allele.
      Graded COMPUTATIONAL because it is modelling, not measurement.
  downstream:
  - target: Disturbed Myelin Lipid Homeostasis
    causal_link_type: DIRECT
    description: >-
      P2 binds fatty acids and PI(4,5)P2 and moves lipid between leaflets of the
      membrane; an allele that changes what it binds changes the lipid
      distribution it maintains.
    evidence:
    - reference: PMID:34758297
      reference_title: PMP2/FABP8 induces PI(4,5)P(2)-dependent transbilayer reorganization of sphingomyelin
        in the plasma membrane.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'A mutation in PMP2 associated with CMT increases its affinity for PI(4,5)P2,
        inducing membrane tubulation and the subsequent transbilayer movement of lipids.'
      explanation: Ties a disease-associated allele directly to a measured change in lipid handling,
        which is the specific edge rather than a general statement about P2.
- name: Disturbed Myelin Lipid Homeostasis
  biological_scale: MOLECULAR
  description: >-
    P2 controls the transbilayer distribution of sphingomyelin in a
    PI(4,5)P2-dependent way and can tubulate membranes. A CMT-associated variant
    binds PI(4,5)P2 more tightly and drives more of this activity, so the defect
    is an altered, arguably excessive lipid-handling function rather than its
    absence.
  cell_types:
  - preferred_term: myelinating Schwann cell
    term:
      id: CL:0000218
      label: myelinating Schwann cell
  biological_processes:
  - preferred_term: phospholipid translocation
    modifier: DYSREGULATED

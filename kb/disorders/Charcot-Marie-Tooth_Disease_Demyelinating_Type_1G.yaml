name: Charcot-Marie-Tooth Disease, Demyelinating, Type 1G
creation_date: '2026-09-10T18:40:00Z'
category: Mendelian
description: >-
  An autosomal dominant demyelinating hereditary motor and sensory neuropathy
  caused by variants in PMP2, which encodes peripheral myelin protein 2 (P2, also
  FABP8) - a small fatty-acid-binding protein on the cytoplasmic face of compact
  peripheral myelin. Clinically it is ordinary CMT1: childhood or adolescent
  onset, slowly progressive distal weakness and wasting worst in the legs, pes
  cavus, depressed reflexes and motor nerve conduction velocities in the
  demyelinating range, with onion bulbs on sural nerve biopsy. There is nothing
  at the bedside that separates it from CMT1A, which is the practical point of
  the entry: PMP2 is reached by sequencing after the common CMT1 genes are
  excluded, not by recognising a phenotype.

  Mechanistically it is the more interesting half. P2 is not a structural
  scaffold in the way PMP22 or MPZ are; it binds fatty acids and PI(4,5)P2, moves
  lipid between membrane leaflets, and stacks apposed membrane surfaces. The
  CMT1G variants cluster in and around the lipid-binding cavity and leave the
  fold essentially intact while changing what the protein binds and how tightly.
  The strongest constraint on how they act comes from the transgenic mice:
  overexpressing wild-type P2 produces the same neuropathy as overexpressing the
  mutant.

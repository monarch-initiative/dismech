    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'we identified p.Ile50del in PMP2 in all the nine affected members'
    explanation: Nine affected members across three generations of one family, which is the
      transmission pattern counselling has to convey.
diagnosis:
- name: Molecular genetic testing after exclusion of common CMT1 genes
  description: >-
    PMP2 is not on every CMT panel and has no distinguishing clinical feature to
    prompt it, so it is reached either by a panel that happens to include it or by
    exome sequencing after PMP22, MPZ and the other common CMT1 genes are
    excluded. The primary literature argues explicitly for adding it to panels.
  evidence:
  - reference: PMID:32277537
    reference_title: Early onset demyelinating Charcot-Marie-Tooth disease caused by a novel in-frame isoleucine
      deletion in peripheral myelin protein 2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'This study suggests the importance to add PMP2 in CMT NGS genes panels or, at most, to
      test it after major CMT1 genes exclusion, due to the lack of diagnostic-addressing additional
      features.'
    explanation: States both the recommendation and its reason - there is no clinical feature that
      points at PMP2 - which is the diagnostic problem this entry records.
- name: Nerve conduction studies
  description: >-
    Motor nerve conduction velocity separates CMT1 from CMT2 at 38 m/s and is the
    first test that places a patient in the demyelinating group.
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'CMT is broadly classified into the demyelinating type (CMT1) with slowed motor nerve
      conduction velocity (MNCV) of <38m/s, and the axonal defective type (CMT2) with reduced
      conduction velocity, >38m/s'
    explanation: Gives the numeric decision threshold this test turns on.
animal_models:
- name: PMP2 p.I43N transgenic mouse
  species: Mouse
  genotype: Transgenic overexpression of human PMP2 carrying p.I43N
  publication: PMID:26828946
  description: >-
    Overexpression transgenic used to establish that PMP2 variants cause
    demyelinating neuropathy. It reproduces the motor, electrophysiological and
    ultrastructural features of CMT1.
  modeled_mechanisms:
  - target: Schwann Cell Myelin Sheath Instability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Shortened internodes and demyelinating fibres on electron microscopy.
    limitations: >-
      This is a transgenic overexpression model, not a knock-in of the patient
      allele at its own locus and dosage, so the amount of P2 present is not the
      heterozygous human situation. The wild-type transgenic arm produces the same
      phenotype, which means the model cannot by itself separate an effect of the
      p.I43N substitution from an effect of excess P2.
    readouts:
    - name: Internodal length on electron microscopy
      target: Schwann Cell Myelin Sheath Instability
      direction: DECREASED
      interpretation: Structural correlate of unstable myelin in this model.
      evidence:
      - reference: PMID:26828946
        reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: 'Electron microscopy revealed that demyelinating fibers and internodal lengths were
          shortened in both transgenic mice.'
        explanation: Reports the ultrastructural measurement behind this readout, in both transgenic
          lines.
  - target: Slowed Motor Nerve Conduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced motor nerve conduction velocity, the defining electrophysiological feature
      of CMT1.
    limitations: >-
      Same overexpression caveat as above; the wild-type transgenic arm is equally
      affected, so reduced conduction velocity here is not specific to the disease
      allele.
    readouts:
    - name: Motor nerve conduction velocity
      target: Slowed Motor Nerve Conduction
      direction: DECREASED
      interpretation: Electrophysiological correlate of the demyelinating phenotype.
      evidence:
      - reference: PMID:26828946
        reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: 'Electrophysiological data revealed that both mice had reduced motor nerve
          conduction velocities (MNCV).'
        explanation: The conduction measurement itself.
  evidence:
  - reference: PMID:26828946
    reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'The relevance of PMP2 mutation as a genetic cause of dominant CMT1 was assessed using
      transgenic mouse models.'
    explanation: States the purpose the model was built for, which is what makes it informative for
      these nodes.
- name: Wild-type PMP2 overexpression transgenic mouse
  species: Mouse
  genotype: Transgenic overexpression of wild-type human PMP2
  publication: PMID:26828946
  description: >-
    Intended as the control arm for the p.I43N transgenic, this line developed the
    same neuropathy. It is curated as a model in its own right because that result
    is the evidence for PMP2 dosage sensitivity.
  modeled_mechanisms:
  - target: PMP2 Dosage Sensitivity
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Overexpression of the wild-type protein alone produces abnormal motor
      function and reduced conduction velocity, which is the observation the
      dosage hypothesis rests on.
    limitations: >-
      Fidelity is LOW as a model of human CMT1G because no patient has been
      reported with PMP2 overexpression or duplication - every human allele is a
      missense or in-frame deletion. The model demonstrates that excess P2 is
      sufficient to cause neuropathy in mouse; it does not show that this is the
      mechanism in patients.
    evidence:
    - reference: PMID:26828946
      reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'These data imply that overexpression of wild type as well as mutant PMP2 also causes
        the CMT1 phenotype, which has been documented in the PMP22.'
      explanation: The authors' statement that the wild-type arm phenocopies the mutant, which is
        what this model is cited for.
- name: PMP2+ Schwann cell ablation mouse
  species: Mouse
  genotype: Pmp2-CreERT2 with inducible diphtheria toxin expression in PMP2+ Schwann cells
  publication: PMID:39880678
  description: >-
    Not a model of CMT1G. It ablates the PMP2-expressing Schwann cell subtype
    entirely, and is curated here because it establishes what that cell population
    is for - and because the loss is reversible.
  modeled_mechanisms:
  - target: Schwann Cell Myelin Sheath Instability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Ablating PMP2+ Schwann cells causes loss of large-caliber motor axons with
      behavioural, electrophysiological and ultrastructural deficits, and
      restoring the cells reverses much of it.
    limitations: >-
      This is cell ablation, not a PMP2 variant: the Schwann cells are killed
      rather than made to express a mutant protein, so it models the consequence
      of losing the cell type, not the consequence of the human allele. It also
      speaks to motor axon survival rather than to the demyelination that defines
      CMT1G, and the paper's framing is ALS rather than CMT.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is the presence or absence of an entire Schwann cell
        subtype. The node's quantity is the functional competence of myelinating
        Schwann cells that are present but carry a variant P2.
    readouts:
    - name: Large-caliber motor axon number
      target: Schwann Cell Myelin Sheath Instability
      direction: DECREASED
      interpretation: Shows the PMP2+ Schwann cell subtype is required for survival of the axons it
        myelinates.
      evidence:
      - reference: PMID:39880678
        reference_title: Pmp2+ Schwann Cells Maintain the Survival of Large-Caliber Motor Axons.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: 'Loss of PMP2+ SCs led to significant loss of large-caliber motor axons with
          concomitant behavioral, electrophysiological, and ultrastructural defects.'
        explanation: The ablation result, measured across behaviour, electrophysiology and
          ultrastructure.
  evidence:
  - reference: PMID:39880678
    reference_title: Pmp2+ Schwann Cells Maintain the Survival of Large-Caliber Motor Axons.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Subsequent withdrawal of tamoxifen restored both PMP2+ SCs and large-caliber motor
      axons and improved behavioral and electrophysiological readouts.'
    explanation: The reversibility arm. It is the reason this model is worth curating against a
      disease with no treatment - the axonal loss it produces is not immediately permanent.
discussions:
- discussion_id: pmp2_dosage_versus_allele
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#PMP2 Dosage Sensitivity
  prompt: >-
    Do human CMT1G missense and in-frame-deletion alleles act by altering P2 lipid
    handling, or by effectively increasing functional P2 dose in the manner that
    the wild-type-overexpressing mouse demonstrates?
  rationale: >-
    The two accounts are not the same and the literature currently supports both
    halves without joining them. Structural work shows the variants leave the fold
    intact and change fatty acid binding, which argues for altered function. The
    transgenic experiment shows that overexpressing wild-type P2 causes the same
    neuropathy as overexpressing the mutant, which argues that dose alone is
    sufficient and that the substitution may be incidental in that system. No
    patient has been reported with a PMP2 duplication, so the dosage route has no
    human counterpart; and no knock-in of a patient allele at endogenous dosage
    has been reported, so the allele route has no in vivo test. A knock-in mouse
    would separate them directly.
notes: >-
  Curated de novo. Evidence rests on the two founding reports (PMID:26828946,
  PMID:27009151), two later families (PMID:32277537, PMID:37238449), and the
  biophysical and cell-biological work on P2 itself (PMID:34138518,
  PMID:34758297). PMID:39880678 is included for the PMP2+ Schwann cell subtype
  even though its framing is ALS rather than CMT, and the animal-model entry says
  so.

  Three deliberate modelling choices a reviewer may want to check:

  First, `functional_impact_category` on the initiating node is UNKNOWN rather
  than LOSS_OF_FUNCTION or GAIN_OF_FUNCTION. The structural work shows the fold is
  intact with altered ligand binding, and the transgenic result points at dosage;
  neither directional category is supported, and the open question is recorded as
  a discussion instead. For the same reason the lipid-handling processes carry
  `modifier: DYSREGULATED` rather than INCREASED or DECREASED - the reported
  change is in what P2 binds and how tightly, not a simple more-or-less.

  Second, `PMP2 Dosage Sensitivity` is curated as a node rather than dropped. It
  comes from what was intended as a control arm, and it is graded HYPOTHETICAL
  because no human has been reported with PMP2 overexpression. It is kept because
  it is the strongest available constraint on how the human alleles act, and
  because discarding an inconvenient control arm would misrepresent the source.

  Third, Areflexia (HP:0001284) is used rather than Hyporeflexia (HP:0001265).
  The cited source says areflexia; these are clinically distinct terms and the
  entry follows the source rather than the softer reading.

  No GeneReviews chapter exists specifically for CMT1G. The general
  Charcot-Marie-Tooth Hereditary Neuropathy Overview (PMID:20301532) was retrieved
  and read, but its abstract does not discuss PMP2, so nothing is cited from it.
  Its cache file was already committed for other CMT entries and is untouched here.

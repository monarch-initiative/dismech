    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Length-Dependent Distal Motor and Sensory Deficit
    description: Maintains range and function against the distal deficit. It does not act on the
      myelin defect and does not alter progression.
  evidence:
  - reference: PMID:37238449
    reference_title: 'A Novel Family with Demyelinating Charcot-Marie-Tooth Disease Caused by a Mutation
      in the PMP2 Gene: A Case Series of Nine Patients and a Brief Review of the Literature.'

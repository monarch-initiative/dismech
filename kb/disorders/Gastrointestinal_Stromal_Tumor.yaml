datasets:
- accession: massive:MSV000086739
  title: Combined Inhibition of AKT and KIT Restores Expression of Programmed Cell Death 4 (PDCD4) in Gastrointestinal Stromal Tumor
  description: AKT activation is a hallmark of IM resistance in GIST. The presence of an additional therapeutic agent could potentially suppress the growth and survival of a clone of cancer cells, which have developed resistance to IM. Simultaneous targeting of AKT in addition to inhibiting KIT with IM has potential to be a promising strategy to prevent the development of secondary resistance to IM.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Gastrointestinal Stromal Tumor"). Retrieved 2026-08-02.
- accession: massive:MSV000081625
  title: Proteome of Gastrointestinal Stromal Tumor-Derived Exosomes
  description: Proteomic study of GIST-derived exosomes (GDEs) and identified 1,060 proteins composing the core GDE proteome (cGDEp). The cGDEp was enriched in diagnostic markers (e.g., KIT, CD34, ANO1, PROM1, PRKCQ, and ENG), as well as proteins encoded by genes previously reported expressed in GIST (e.g., DPP4, FHL1, CDH11, and KCTD12). Many of these proteins were validated using cell lines, patient-derived KIT+ exosomes, and GIST tissues.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Gastrointestinal Stromal Tumor"). Retrieved 2026-08-02.

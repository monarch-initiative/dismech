treatments:
- name: Imatinib
  description: >-
    First-line treatment for unresectable or metastatic GIST. Targets KIT and PDGFRA
    kinases. Standard dose is 400 mg daily, but exon 9 KIT mutations require 800 mg.
    Dramatically transformed outcomes for advanced GIST patients.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  evidence:
  - reference: PMID:12181401
    reference_title: "Efficacy and safety of imatinib mesylate in advanced gastrointestinal stromal tumors."
    supports: SUPPORT
    snippet: "Imatinib induced a sustained objective response in more than half of patients with an advanced unresectable or metastatic gastrointestinal stromal tumor. Inhibition of the KIT signal-transduction pathway is a promising treatment for advanced gastrointestinal stromal tumors, which resist conventional chemotherapy."
    explanation: The Demetri et al. NEJM study demonstrated that imatinib achieves objective responses in 53.7% of advanced GIST patients by inhibiting the KIT signaling pathway.
- name: Sunitinib
  description: >-
    Second-line treatment after imatinib failure or intolerance. Multi-kinase
    inhibitor targeting KIT, PDGFRA, and VEGFR. Active against some imatinib-resistant
    secondary mutations.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: sunitinib
      term:
        id: CHEBI:38940
        label: sunitinib
  evidence:
  - reference: PMID:17046465
    reference_title: "Efficacy and safety of sunitinib in patients with advanced gastrointestinal stromal tumour after failure of imatinib: a randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median time to tumour progression was 27.3 weeks (95% CI 16.0-32.1) in
      patients receiving sunitinib and 6.4 weeks (4.4-10.0) in those on placebo
      (hazard ratio 0.33; p<0.0001).
    explanation: >-
      This randomised placebo-controlled trial showed sunitinib significantly
      prolonged time to tumour progression after imatinib failure, establishing
      it as second-line therapy for advanced GIST.
- name: Avapritinib
  description: >-
    Selective KIT/PDGFRA inhibitor specifically designed to target PDGFRA D842V
    mutations and KIT exon 17 mutations. First agent to show efficacy in D842V
    mutant GIST, which is resistant to imatinib.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: avapritinib
      term:
        id: NCIT:C123827
        label: Avapritinib
  evidence:
  - reference: PMID:32615108
    reference_title: "Avapritinib in advanced PDGFRA D842V-mutant gastrointestinal stromal tumour (NAVIGATOR): a multicentre, open-label, phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Avapritinib has a manageable safety profile and has preliminary antitumour
      activity in patients with advanced PDGFRA D842V-mutant gastrointestinal
      stromal tumours.
    explanation: >-
      The NAVIGATOR phase 1 trial demonstrated antitumour activity of avapritinib
      in imatinib-resistant PDGFRA D842V-mutant GIST, the mutation-specific
      indication for this selective KIT/PDGFRA inhibitor.
- name: Surgical Resection
  description: >-
    Primary treatment for localized GIST. Complete resection with negative margins
    is the goal. Neoadjuvant imatinib may reduce tumor size and facilitate
    organ-preserving surgery.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection

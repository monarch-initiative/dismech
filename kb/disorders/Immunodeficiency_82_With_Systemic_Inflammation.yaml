genetic:
- name: SYK
  gene_term:
    preferred_term: SYK
    term:
      id: hgnc:11491
      label: SYK
  relationship_type: CAUSATIVE
  notes: >-
    SYK and ZAP70 are the two tandem-SH2 kinases recruited to phosphorylated ITAMs
    and are functionally paired: ZAP70 acts principally in T and NK cells, SYK in
    mononuclear phagocytes and B cells. The two diseases are mirror images -
    biallelic ZAP70 loss of function gives a selective T cell defect, monoallelic
    SYK gain of function gives this disorder. dismech already carries a
    ZAP70_Deficiency entry; the pairing is why this entry's cell types are
    phagocyte and B cell rather than T cell.

    The variant modelled in mouse is the human p.Ser550Tyr, corresponding to mouse
    Ser544Tyr.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function biallelic variants in ZAP70 result in human immunodeficiency characterized by a selective T cell defect (OMIM 269840) 6, while pathogenic variation of SYK has not been described in humans."
    explanation: >-
      States the ZAP70 contrast described in the notes and, in the same sentence,
      that SYK disease was previously unknown.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study we identify monoallelic gain-of-function variants in SYK that result in immunodeficiency and systemic inflammatory disease in humans and show that the expression of one of these variants in a mouse model replicates major aspects of the human immunopathology."
    explanation: >-
      States the causative relationship and the human-plus-mouse basis for it.
animal_models:
- name: SYK Ser544Tyr knock-in mouse
  species: Mouse
  genotype: Syk p.Ser544Tyr knock-in, corresponding to human p.Ser550Tyr
  publication: PMID:33782605
  description: >-
    A knock-in of the mouse residue equivalent to a patient variant, made in the
    defining study. Unlike many immunodeficiency models it reproduces substantial
    parts of the human disease, which is what makes the treatment experiments in
    it interpretable.
  modeled_mechanisms:
  - target: Multi-Organ Inflammatory Disease
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces aspects of the human inflammatory disease from the orthologous
      point variant, at the whole-organism scale.
    limitations: >-
      The authors' own wording is that the model recapitulates "aspects of" the
      human disease, not the whole of it, and the report does not claim the
      lymphoma phenotype is reproduced. It is one knock-in of one of the several
      patient variants, so it does not speak to allelic heterogeneity.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The engineered residue is the mouse equivalent (Ser544) of the human
        residue (Ser550), so the model tests the orthologous substitution rather
        than the human allele itself. Global Syk knockout is perinatally lethal in
        mouse, indicating that murine SYK dosage requirements are not identical to
        human.
    evidence:
    - reference: PMID:33782605
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A knock-in (SYK-Ser544Tyr) mouse model of a patient variant (p.Ser550Tyr) recapitulated aspects of the human disease that could be partially treated with a SYK inhibitor or transplantation of bone marrow from wild-type mice."
      explanation: >-
        States both the recapitulation and its limits, and is the source for the
        two treatment records below.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "show that the expression of one of these variants in a mouse model replicates major aspects of the human immunopathology"
    explanation: >-
      Attests that this model is informative for the human disease.
treatments:
- name: SYK kinase inhibition
  description: >-
    Pharmacological inhibition of the hyperactive kinase, the mechanistically
    obvious treatment and the one the defining study tested. R406, the active
    metabolite of fostamatinib, occupies the ATP-binding pocket and competes with
    free ATP. In the knock-in mouse this partially treated the disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: SYK kinase inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fostamatinib
      term:
        id: NCIT:C95222
        label: Fostamatinib
  target_mechanisms:
  - target: Constitutive SYK Kinase Hyperactivation
    description: >-
      Competitive ATP-site inhibition reduces the kinase activity at the node
      immediately downstream of the genetic lesion. This is the one treatment here
      that acts on the causal node rather than on its consequences.
  notes: >-
    Efficacy is demonstrated in the knock-in mouse and was partial there. This
    entry records no human trial evidence, because the defining report describes
    none. The phrase "potentially treatable" is the authors' own and is quoted
    below rather than upgraded.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A knock-in (SYK-Ser544Tyr) mouse model of a patient variant (p.Ser550Tyr) recapitulated aspects of the human disease that could be partially treated with a SYK inhibitor or transplantation of bone marrow from wild-type mice."
    explanation: >-
      Reports partial treatment response in the mouse model. Graded
      MODEL_ORGANISM, and the word "partially" is retained in the quote rather
      than paraphrased away.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "R406, the active metabolite of fostamatinib, attaches to the ATP-binding pocket of SYK and sterically competes with free ATP to inhibit SYK kinase activity9."
    explanation: >-
      Establishes the molecular mechanism by which the agent acts on the target
      node.
  - reference: PMID:33782605
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our studies demonstrate that SYK gain-of-function variants result in a potentially treatable form of inflammatory disease."
    explanation: >-
      The authors' own summary claim. Marked INDIRECT deliberately: "potentially
      treatable" is a forward-looking statement resting on the mouse experiment,
      not a report of human treatment.
- name: Allogeneic hematopoietic cell transplantation
  description: >-
    Replacement of the affected haematopoietic compartment. Because SYK acts in
    mononuclear phagocytes and B cells, which are haematopoietic, transplantation
    is mechanistically curative in principle. Transplantation of wild-type bone
    marrow partially treated the knock-in mouse.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Monoallelic SYK Gain-of-Function Variants
    description: >-
      Replaces the variant-carrying haematopoietic cells with wild-type cells,
      removing the lesion from the lineages in which it acts. Unlike kinase
      inhibition this addresses the genetic node itself, but only in the
      haematopoietic compartment - the report notes SYK expression in intestinal
      epithelium as well.
  notes: >-
    Shown in the mouse model, not in a reported human series. The mechanistic
    caveat above is real: the same report records SYK expression in intestinal
    epithelium, which a haematopoietic transplant would not replace.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "could be partially treated with a SYK inhibitor or transplantation of bone marrow from wild-type mice"
    explanation: >-
      Reports the partial response to wild-type bone marrow transplantation in the
      knock-in mouse.
  - reference: PMID:33782605
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "which is primarily expressed in mononuclear phagocytes (MNPs), B cells and, to a lesser extent, the intestinal epithelium"
    explanation: >-
      Supports the rationale for a haematopoietic transplant while naming the
      non-haematopoietic compartment it would not address. Marked INDIRECT because
      it describes expression rather than a treatment result.
discussions:
- discussion_id: syk_gof_inflammation_and_deficiency_together
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How does a single activating kinase variant produce immunodeficiency and
    systemic inflammation at the same time?
  attaches_to:
  - pathophysiology#Constitutive SYK Kinase Hyperactivation
  - pathophysiology#Impaired Humoral Immunity
  rationale: >-
    A gain-of-function variant in a proximal immunoreceptor kinase predicts
    inflammation, and that is observed. It does not obviously predict reduced
    memory B cells, low IgM and IgG, and fatal infection, and those are observed
    too, in the same patients.

    Several accounts are compatible with the curated evidence and none is
    established by it. Chronically hyperactive B cell receptor signalling could
    drive anergy or deletion rather than productive responses, in which case the
    deficiency is a downstream consequence of the same excess. The deficiency
    could instead be secondary to the inflammatory disease itself - protein loss
    through an ulcerated colon, or the effect of chronic inflammation on
    lymphopoiesis. Or the two could be genuinely independent effects of SYK in
    different lineages. The distinction matters for treatment: if the deficiency
    is driven by excess signalling then kinase inhibition should improve it,
    whereas if it is a consequence of tissue damage it should follow the colitis
    instead.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified damaging monoallelic SYK variants in six patients with immune deficiency, multi-organ inflammatory disease such as colitis, arthritis and dermatitis, and diffuse large B cell lymphomas."
    explanation: >-
      Establishes that deficiency and inflammation co-occur in the same patients,
      which is the fact this question is about.
- discussion_id: syk_gof_single_defining_series
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the phenotypic spectrum of SYK gain-of-function disease beyond the six
    patients of the defining series?
  attaches_to:
  - disease#Immunodeficiency 82 With Systemic Inflammation
  rationale: >-
    Essentially every mechanistic and clinical claim in this entry traces to one
    2021 report of six patients. That is enough to establish the disease and not
    enough to establish its range: penetrance, the proportion of carriers who
    develop lymphoma, whether milder adult-onset presentations exist, and whether
    the other patient variants behave like the one modelled in mouse are all
    unaddressed.

    This is recorded as a knowledge gap rather than left implicit because it
    changes how the rest of the entry should be read. A reader should treat the
    phenotype list here as the presentation of one ascertained series, not as a
    frequency distribution over the disease.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while pathogenic variation of SYK has not been described in humans"
    explanation: >-
      Records that this report was the first description, which is why no
      independent series exists to compare against.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic variants are sufficient. Transmission from an affected parent to
    an affected child is documented in the defining report, in which patient 3 is
    the father of patient 2 and had the same disease from two weeks of life.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified damaging monoallelic SYK variants in six patients with immune deficiency, multi-organ inflammatory disease such as colitis, arthritis and dermatitis, and diffuse large B cell lymphomas."
    explanation: >-
      States the monoallelic genotype across the patient series.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her father (Patient 3, age 35) had a similar disease that started at two weeks of life and was characterized by oral ulcers, fever, rash, diarrhea and failure to thrive."
    explanation: >-
      Documents parent-to-child transmission with a concordant phenotype.
pathophysiology:
- name: Monoallelic SYK Gain-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense variants in SYK that increase kinase activity. The
    defining series identified six patients; the variant modelled in mouse,
    p.Ser550Tyr, corresponds to mouse Ser544Tyr.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
  cell_types:
  - preferred_term: mononuclear phagocyte
    term:
      id: CL:0000113
      label: mononuclear phagocyte
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Constitutive SYK Kinase Hyperactivation
    description: >-
      The variant protein is more readily phosphorylated and signals more
      strongly than wild-type SYK.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified damaging monoallelic SYK variants in six patients with immune deficiency, multi-organ inflammatory disease such as colitis, arthritis and dermatitis, and diffuse large B cell lymphomas."
    explanation: >-
      Establishes the causative variants and the size of the defining series.
  - reference: PMID:33782605
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function biallelic variants in ZAP70 result in human immunodeficiency characterized by a selective T cell defect (OMIM 269840) 6, while pathogenic variation of SYK has not been described in humans."
    explanation: >-
      Records that no pathogenic SYK variation was known before this report, which
      is why the disease rests on a single defining series. Marked INDIRECT
      because it establishes the novelty of the finding rather than the variants
      themselves.
- name: Constitutive SYK Kinase Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    The pivotal node. SYK is the tandem-SH2 kinase recruited to phosphorylated
    ITAMs of B cell receptors, Fc receptors and other immunoreceptors, and it also
    transduces signals from C-type lectin receptors, Toll-like receptors and
    integrins. The disease variants raise its phosphorylation and downstream
    output. The modifier here is GAIN_OF_FUNCTION rather than INCREASED because
    the claim is qualitative: the kinase escapes its normal regulatory constraint,
    not merely that there is more signalling.
  molecular_functions:
  - preferred_term: SYK protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
  biological_processes:
  - preferred_term: immune response-regulating cell surface receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0002768
      label: immune response-regulating cell surface receptor signaling pathway
  downstream:
  - target: Multi-Organ Inflammatory Disease
    description: >-
      Excess ITAM-proximal signalling in mononuclear phagocytes drives cytokine
      production and tissue inflammation.
  - target: Impaired Humoral Immunity
    description: >-
      The same hyperactive kinase in the B cell lineage is associated with reduced
      memory B cells and low immunoglobulins, so the inflammatory and deficiency
      branches share one upstream node.
  - target: B Cell Lymphomagenesis
    description: >-
      Sustained SYK signalling in the B cell lineage is the proposed route to
      diffuse large B cell lymphoma in these patients.
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SYK variants increased phosphorylation and enhanced downstream signaling, indicating gain of function."
    explanation: >-
      The direct functional demonstration that these variants are activating,
      which is the claim of this node.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These kinases are (1) the ζ-chain-associated protein kinase of 70 kDa (ZAP70), which is primarily expressed in T cells and natural killer cells, and (2) the spleen tyrosine kinase (SYK), which is primarily expressed in mononuclear phagocytes (MNPs), B cells and, to a lesser extent, the intestinal epithelium."
    explanation: >-
      Establishes where SYK acts, which is what makes the mononuclear phagocyte
      and B cell branches downstream of this node the expected ones.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SYK is also involved in signaling cascades from receptors without ITAMs, including C-type lectin receptors, Toll-like receptors and integrins 1,2."
    explanation: >-
      Supports the breadth of receptor input described in this node, which bears
      on why the inflammation is multi-organ rather than restricted to one
      receptor system.
- name: Multi-Organ Inflammatory Disease
  biological_scale: ORGANISM
  description: >-
    Systemic and tissue-specific inflammation from the first weeks of life: colitis
    with colonic ulceration and chronic inflammatory histology, arthritis,
    dermatitis and rash, vasculitis, and a raised acute-phase response with
    elevated C-reactive protein and interleukin-6.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  cell_types:
  - preferred_term: mononuclear phagocyte
    term:
      id: CL:0000113
      label: mononuclear phagocyte
  downstream:
  - target: Colitis
  - target: Arthritis
  - target: Skin rash
  - target: Vasculitis
  - target: Elevated circulating C-reactive protein concentration
  - target: Diarrhea
  - target: Fever
  - target: Anal fistula
  - target: Failure to thrive
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Colonoscopy at 17 months of age revealed multiple ulcers in the colon (Fig. 1a) with histologic features consistent with chronic colitis (Fig. 1b)."
    explanation: >-
      Documents the colitis with endoscopic and histological confirmation.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory tests showed normal white blood cell (WBC) counts but elevated C-reactive protein (CRP), high level of serum Interleukin (IL)-6, and reduced serum levels of immunoglobulin (Ig) M and IgG (Fig. 1e and Supplementary Table 1)."
    explanation: >-
      Documents the acute-phase response and, in the same sentence, the
      immunoglobulin deficiency that defines the other branch.
- name: Impaired Humoral Immunity
  biological_scale: ORGANISM
  description: >-
    The immunodeficiency branch, and the part of this disease that is least
    intuitive given an activating kinase variant. Patients have reduced memory B
    cells and low serum IgM and IgG, with recurrent infections; one patient in the
    defining series died of infectious complications before her third birthday.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Decreased circulating IgG concentration
  - target: Decreased circulating IgM concentration
  - target: Recurrent infections
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 2 and 3 both have reduced memory B cells (Supplementary Table 4)."
    explanation: >-
      Documents the memory B cell deficit underlying this node.
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient passed away before her 3rd birthday due to complications from an infection."
    explanation: >-
      Records the clinical consequence of the immunodeficiency, which is what
      makes this branch more than a laboratory observation.
- name: B Cell Lymphomagenesis
  biological_scale: CELLULAR
  description: >-
    Diffuse large B cell lymphoma occurred in the defining series. SYK is a
    known oncogenic driver in B cell malignancy, so sustained hyperactive
    signalling in the B cell lineage is the proposed route. This entry records the
    association and the proposed mechanism; the causal step from the germline
    variant to the lymphoma is not separately demonstrated in that report, and the
    node description says so rather than implying it.
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  evidence:
  - reference: PMID:33782605
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multi-organ inflammatory disease such as colitis, arthritis and dermatitis, and diffuse large B cell lymphomas"
    explanation: >-
      Records the lymphoma occurring within the defining patient series.

name: Immunodeficiency 82 With Systemic Inflammation
creation_date: "2026-09-12T13:35:00Z"
category: Mendelian
synonyms:
- IMD82
- SYK gain-of-function disease
- SYK-associated immune dysregulation
- immunodeficiency 82 with systemic inflammation, autosomal dominant
description: >-
  A monoallelic gain-of-function disorder of SYK, the spleen tyrosine kinase,
  presenting in the first weeks of life with colitis, arthritis, dermatitis and
  systemic inflammation alongside an immune deficiency, and carrying a risk of
  diffuse large B cell lymphoma.

  Two things make this entry unusual and both are worth stating up front.

  First, the direction of the lesion is counter-intuitive. SYK sits immediately
  downstream of ITAM-bearing immunoreceptors in mononuclear phagocytes and B
  cells, and one would expect a hyperactive kinase to produce inflammation alone.
  It produces inflammation and immunodeficiency together, with reduced memory B
  cells and low immunoglobulins. The entry curates that as two branches from one
  node rather than picking the half that fits the intuition.

  Second, this is the mirror image of the ZAP70 disease already in the knowledge
  base. ZAP70 and SYK are the two tandem-SH2 kinases recruited to phosphorylated
  ITAMs; ZAP70 acts in T and NK cells, SYK in mononuclear phagocytes and B cells.
  Biallelic loss of ZAP70 gives a selective T cell defect. Monoallelic gain of
  SYK gives this. The pairing is a genuine structural fact about the pathway and
  is recorded in the genetic notes.

  The evidence base is narrow and this entry does not disguise that. The disease
  was defined by a single 2021 report of six patients across several families,
  which also built the knock-in mouse. Almost every mechanistic claim here traces
  to that one paper. Where a claim rests on the mouse rather than on patients,
  the evidence item says so through evidence_source: MODEL_ORGANISM, and the
  treatments section is explicit that SYK inhibition and bone marrow
  transplantation were shown in mice and not in a human trial.

  The gain-of-function is recorded in two places because they are two different
  claims, per the CLAUDE.md rule: functional_impact_category: GAIN_OF_FUNCTION on
  the variant's genetic_context, and modifier: GAIN_OF_FUNCTION on the kinase
  activity descriptor. The latter is the qualitative choice rather than
  INCREASED, because the variants remove the kinase from its normal
  autoinhibitory constraint rather than merely raising its level.

  No pathophysiology node declares conforms_to. kb/modules/ was searched; no
  module covers ITAM-proximal kinase hyperactivation.

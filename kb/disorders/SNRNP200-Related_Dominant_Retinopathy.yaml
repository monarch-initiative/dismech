notes: >-
  A homozygous SNRNP200 missense variant (p.Arg545His) causing recessive
  retinitis pigmentosa with distinct dot-like hypopigmentation is described in
  PMID:31260034; this entry covers the dominant disease only, and the
  photophobia that study reports pools the dominant family with the recessive
  patient, so it is not curated here. In an Irish cohort, variants in the PRPF
  genes caused more severe retinal degeneration than SNRNP200 variants
  (PMID:42405195). ClinGen's evidence summary lists attenuated vessels, optic
  disc pallor and macular degeneration among general retinitis pigmentosa
  features; they are not curated here without an SNRNP200 patient source. No GeneReviews
  chapter is specific to SNRNP200.

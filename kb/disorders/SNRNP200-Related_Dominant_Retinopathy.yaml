name: SNRNP200-Related Dominant Retinopathy
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
description: >-
  SNRNP200-related dominant retinopathy (retinitis pigmentosa 33, RP33) is an
  autosomal dominant rod-cone degeneration caused by heterozygous missense
  variants in SNRNP200, which encodes Brr2, the U5 snRNP RNA helicase that
  unwinds the U4/U6 snRNA duplex to activate the spliceosome. Recurrent
  variants such as p.Ser1087Leu and p.Arg1090Leu sit in the ratchet helix of
  the first helicase cassette. The mutant helicase still assembles into
  spliceosomes but unwinds U4/U6 poorly, and its loss of function at 5'
  splice-site recognition lets cryptic sites be used. Patients present with
  night blindness, usually in the first two decades, and a rod-predominant
  dystrophy that later involves cones. Onset and severity vary widely and
  penetrance is incomplete. SNRNP200 accounts for about 1.6 percent of
  autosomal dominant retinitis pigmentosa, and its course is milder on
  average than PRPF-gene retinopathy.

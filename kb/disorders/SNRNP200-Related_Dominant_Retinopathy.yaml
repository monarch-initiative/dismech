  description: >-
    Heterozygous variants with variable onset and severity and occasional
    non-penetrance.
  evidence:
  - reference: PMID:19878916
    reference_title: "Autosomal-dominant retinitis pigmentosa caused by a mutation in SNRNP200, a gene required for unwinding of U4/U6 snRNAs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.3260C>T substitution showed complete cosegregation with the retinitis pigmentosa (RP) phenotype over four generations, but was absent in a panel of 400 controls."
    explanation: Dominant segregation over four generations in the founding family.
  - reference: PMID:24319334
    reference_title: "Mutations in the small nuclear riboprotein 200 kDa gene (SNRNP200) cause 1.6% of autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical examination of patients with SNRNP200 mutations showed a wide range of clinical symptoms and severity, including one instance of non-penetrance."
    explanation: Variable expressivity and non-penetrance.
pathophysiology:
- name: SNRNP200 Missense Variant in the Brr2 Helicase Cassette
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    Heterozygous missense variants concentrate in exons 16 and 25. The
    recurrent p.Ser1087Leu and p.Arg1090Leu lie in the ratchet helix of the
    first Sec63 domain, which governs directional unwinding.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SNRNP200
    term:
      id: hgnc:30859
      label: SNRNP200
  molecular_functions:
  - preferred_term: RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
  cellular_components:
  - preferred_term: U4/U6.U5 tri-snRNP
    term:
      id: GO:0046540
      label: U4/U6 x U5 tri-snRNP complex
  evidence:
  - reference: PMID:19878916
    reference_title: "Autosomal-dominant retinitis pigmentosa caused by a mutation in SNRNP200, a gene required for unwinding of U4/U6 snRNAs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.S1087L mutation and p.R1090L, another adRP-associated allele, reside in the \"ratchet\" helix of the first of two Sec63 domains implicated in the directionality and processivity of nucleic acid unwinding."
    explanation: Locates the recurrent variants in the helicase ratchet helix.
  - reference: PMID:24319334
    reference_title: "Mutations in the small nuclear riboprotein 200 kDa gene (SNRNP200) cause 1.6% of autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic mutations were found primarily in exons 16 and 25"
    explanation: Variant clustering in a US cohort.
  downstream:
  - target: Impaired Brr2 U4/U6 Unwinding
    causal_link_type: DIRECT
- name: Impaired Brr2 U4/U6 Unwinding
  description: >-
    RP variants weaken Brr2 RNA binding, ATPase and helicase activity and alter
    how Brr2 contacts U4 and U6 in the spliceosome, so U4/U6 is unwound
    inefficiently at activation. The mutant protein still assembles into snRNPs
    and spliceosomes, so this is an altered-function defect within the
    machine rather than a shortage of it.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: Brr2 RNA helicase activity
    term:
      id: GO:0003724
      label: RNA helicase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: U4/U6 release during spliceosome activation
    term:
      id: GO:0000388
      label: spliceosome conformational change to release U4 (or U4atac) and U1 (or U11)
    modifier: DECREASED
  evidence:
  - reference: PMID:27072132
    reference_title: "Retinitis Pigmentosa Mutations in Bad Response to Refrigeration 2 (Brr2) Impair ATPase and Helicase Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Δ247-Brr2 RP mutants exhibit a gradient of severity of weakened RNA binding, reduced helicase activity, and reduced ATPase activity compared with wild type Δ247-Brr2."
    explanation: Purified Brr2 RP mutants are deficient helicases.
  - reference: PMID:40045025
    reference_title: "Retinitis pigmentosa-linked mutations impair the snRNA unwinding activity of SNRNP200 and reduce pre-mRNA binding of PRPF8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The significantly broader binding profile of mutated SNRNP200 within the U4 region upstream of the U4/U6 stem I strongly suggests that its activity to unwind snRNAs is impaired."
    explanation: iCLIP in HeLa and RPE cells shows altered U4 binding by mutant SNRNP200.
  - reference: PMID:19878916
    reference_title: "Autosomal-dominant retinitis pigmentosa caused by a mutation in SNRNP200, a gene required for unwinding of U4/U6 snRNAs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "marked defects in U4/U6 unwinding, but not U4/U6-U5 snRNP assembly, were observed in budding yeast for the analogous mutations (N1104L and R1107L) of the corresponding Brr2p residues"
    explanation: Yeast equivalents unwind poorly but assemble normally.
  - reference: PMID:24302620
    reference_title: "Retinitis pigmentosa mutations of SNRNP200 enhance cryptic splice-site recognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in BRR2 did not compromise snRNP assembly and both mutants were incorporated into the spliceosome just as the wild-type (wt) protein."
    explanation: Mutant Brr2 is incorporated normally in human cells.
  downstream:
  - target: Defective 5' Splice-Site Recognition with Cryptic Site Use
    causal_link_type: DIRECT
- name: Defective 5' Splice-Site Recognition with Cryptic Site Use
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    In human cells, losing wild-type Brr2 increases use of a cryptic 5' splice
    site at the expense of the correct one, and the RP mutants cannot restore
    correct site choice, so the variants impair Brr2's role in 5' splice-site
    recognition. Which retinal transcripts are affected has not been mapped.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA 5'-splice site recognition
    term:
      id: GO:0000395
      label: mRNA 5'-splice site recognition
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24302620
    reference_title: "Retinitis pigmentosa mutations of SNRNP200 enhance cryptic splice-site recognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Proper splicing of optimal and cryptic splice sites was restored in cells expressing BRR2-wt but not in cells expressing RP mutants."
    explanation: RP mutants fail to restore correct splice-site choice.
  - reference: PMID:24302620
    reference_title: "Retinitis pigmentosa mutations of SNRNP200 enhance cryptic splice-site recognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Taken together, our data suggest that BRR2 is an important factor in 5'-splice-site recognition and that the RP-linked mutations c.3260C>T (p.S1087L) and c.3269G>T (p.R1090L) affect this BRR2 function."
    explanation: Places the defect at 5' splice-site recognition.
  downstream:
  - target: Photoreceptor Dysfunction and Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Photoreceptor Dysfunction and Degeneration
  conforms_to: "spliceosome_component_dysfunction#Failure of Splicing-Sensitive Cell Populations"
  description: >-
    Rods fail first and cones later. In Drosophila carrying human RP
    substitutions in Snrnp200, photoreceptors are mispatterned and
    electrophysiologically abnormal, with mitochondrial defects and altered
    redox-gene expression; in zebrafish, the mutant but not the wild-type
    human protein injures the retina.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: rod photoreceptor
    term:
      id: CL:0000604
      label: retinal rod cell
  - preferred_term: cone photoreceptor
    term:
      id: CL:0000573
      label: retinal cone cell
  evidence:
  - reference: PMID:42593897
    reference_title: "N-acetylcysteine suppresses retinal defects in Drosophila models of SNRNP200-associated retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "When human RP-causing mutations were modeled in Drosophila Snrnp200, they resulted in abnormal retinal electrophysiology and defective patterning of photoreceptors."
    explanation: Photoreceptor defects from RP substitutions in the fly orthologue.
  - reference: PMID:42593897
    reference_title: "N-acetylcysteine suppresses retinal defects in Drosophila models of SNRNP200-associated retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further analysis of the photoreceptors revealed mitochondrial defects and altered expression of genes related to redox homeostasis."
    explanation: Mitochondrial and redox changes in mutant photoreceptors.
  - reference: PMID:33553197
    reference_title: "SNRNP200 Mutations Cause Autosomal Dominant Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of SNRNP200Arg2030Cys, but not SNRNP200WT caused systemic deformities in the wild-type zebrafish embryos with the retina primarily injured"
    explanation: >-
      The mutant protein is harmful on a wild-type background, consistent with
      an altered-function or dominant-negative effect.
  downstream:
  - target: Night blindness
  - target: Rod-cone dystrophy
  - target: Abnormal electroretinogram

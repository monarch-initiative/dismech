discussions:
- discussion_id: snrnp200_altered_function_or_dominant_negative
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Brr2 U4/U6 Unwinding
  prompt: >-
    Does mutant Brr2 cause disease by sitting in spliceosomes as a weak
    helicase, or by actively interfering with the wild-type protein?
  rationale: >-
    The RP mutants assemble into spliceosomes like wild type yet unwind U4/U6
    poorly and fail at 5' splice-site recognition, which fits a partly active
    helicase competing for spliceosome slots. In zebrafish the mutant human
    protein, but not the wild-type one, injures the retina on a normal
    background, which suggests a toxic or dominant-negative effect. No study has
    titrated mutant against wild-type Brr2 in human retinal cells, which is
    what would decide whether lowering the mutant allele could help.
  evidence:
  - reference: PMID:33553197
    reference_title: "SNRNP200 Mutations Cause Autosomal Dominant Retinitis Pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of SNRNP200Arg2030Cys, but not SNRNP200WT caused systemic deformities in the wild-type zebrafish embryos with the retina primarily injured"
    explanation: Evidence for a harmful effect of the mutant protein itself.
references:
- reference: PMID:19878916

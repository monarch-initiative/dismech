notes: >
  Ethylmalonic encephalopathy is a paradigm of a "gasotransmitter intoxication"
  disorder: the primary defect is not in amino-acid catabolism per se but in the
  mitochondrial detoxification of hydrogen sulfide, so the pathogenic species is H2S
  (and its metabolite thiosulfate) rather than a classic amino/organic acid. This
  explains two otherwise puzzling features — the therapeutic value of gut-directed
  antibiotics (metronidazole reduces bacterial H2S production) and the microvascular
  (petechiae, acrocyanosis) and gastrointestinal involvement alongside the
  mitochondrial encephalopathy. The ethylmalonic aciduria and C4/C5 acylcarnitine
  elevation are downstream consequences of sulfide inhibition of short-chain fatty
  acid oxidation, not the primary lesion. Most mechanistic detail derives from the
  Ethe1-/- mouse and tissue-specific conditional knockouts (Tiranti 2009; Di Meo
  2011), corroborated by patient biochemistry and the human treatment response.

pathophysiology:
- name: ETHE1 sulfur dioxygenase deficiency
  biological_scale: MOLECULAR
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  description: >
    Biallelic loss-of-function ETHE1 variants abolish the activity of the
    mitochondrial matrix sulfur (persulfide) dioxygenase, the enzyme that oxidizes
    sulfide within the mitochondrial pathway of H2S catabolism. The ETHE1 gene
    (formerly HSCO, GenBank D83198) encodes a beta-lactamase-like iron-coordinating
    metalloprotein imported into the mitochondrial matrix.

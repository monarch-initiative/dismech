      explanation: States autosomal recessive inheritance.
  features: >
    ETHE1 encodes a beta-lactamase-like, iron-coordinating metalloprotein imported
    into the mitochondrial matrix that functions as a sulfur dioxygenase. Recurrent
    pathogenic variants reported in the literature include the homozygous p.R163Q,
    p.R163W, exon 4 deletion, p.Glu44ValfsTer62 and p.M1I alleles.
  evidence:
  - reference: PMID:19136963
    reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ETHE1, a gene encoding a beta-lactamase-like, iron-coordinating metalloprotein, is mutated in ethylmalonic encephalopathy."
    explanation: Describes the ETHE1 gene product mutated in the disease.
  - reference: PMID:37458841
    reference_title: "Ethylmalonic Encephalopathy: a literature review and two new cases of mild phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common ETHE1 gene homozygous state mutations were (p.R163Q) (c.488G>A), exon 4 deletion, (p.R163W)(c.487C>T), (p.Glu44ValfsTer62)(c.131_132delAG) and (p.M1I)(c.3G>T) mutations, respectively."
    explanation: Lists the most common recurrent ETHE1 pathogenic variants across reported cases.
treatments:
- name: Metronidazole plus N-acetylcysteine
  description: >
    Combined oral metronidazole (a bactericide that lowers the population of
    H2S-producing anaerobic gut bacteria) and N-acetylcysteine (a precursor of
    sulfide-buffering glutathione) is the mainstay disease-modifying therapy. The
    combination prolonged survival of Ethe1-deficient mice additively and produced
    marked clinical improvement in affected children.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metronidazole
      term:
        id: CHEBI:6909
        label: metronidazole
    - preferred_term: N-acetylcysteine
      term:
        id: CHEBI:22198
        label: acetylcysteine
  evidence:
  - reference: PMID:20657580
    reference_title: "Combined treatment with oral metronidazole and N-acetylcysteine is effective in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The same dual treatment caused marked clinical improvement in five affected children, with hardly any adverse or side effects."
    explanation: Demonstrates clinical benefit of the combined metronidazole/NAC therapy in affected children.
  - reference: PMID:20657580
    reference_title: "Combined treatment with oral metronidazole and N-acetylcysteine is effective in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Metronidazole, a bactericide, or N-acetylcysteine, a precursor of sulfide-buffering glutathione, substantially prolonged the lifespan of Ethe1-deficient mice, with the combined treatment being additive."
    explanation: Establishes the mechanistic rationale (reducing/buffering sulfide) and additive survival benefit in the mouse model.
- name: Liver transplantation
  description: >
    Liver transplantation has been used in EE to restore hepatic sulfur dioxygenase
    activity and lower systemic sulfide, with reported clinical benefit in some
    patients.
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: MAXO:0010039
      label: organ transplantation
  evidence:
  - reference: PMID:37458841
    reference_title: "Ethylmalonic Encephalopathy: a literature review and two new cases of mild phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reducing the accumulation and inducing detoxification of sulfide is the main long-term treatment strategy for EE, including metronidazole, N-acetylcysteine (NAC), dietary modification, liver transplantation and continuous renal replacement therapy (CRRT)."
    explanation: Lists liver transplantation among the long-term sulfide-reducing treatment strategies.
notes: >
  Ethylmalonic encephalopathy is a paradigm of a "gasotransmitter intoxication"
  disorder: the primary defect is not in amino-acid catabolism per se but in the
  mitochondrial detoxification of hydrogen sulfide, so the pathogenic species is H2S
  (and its metabolite thiosulfate) rather than a classic amino/organic acid. This
  explains two otherwise puzzling features — the therapeutic value of gut-directed
  antibiotics (metronidazole reduces bacterial H2S production) and the microvascular
  (petechiae, acrocyanosis) and gastrointestinal involvement alongside the
  mitochondrial encephalopathy. The ethylmalonic aciduria and C4/C5 acylcarnitine
  elevation are downstream consequences of sulfide inhibition of short-chain fatty
  acid oxidation, not the primary lesion. Most mechanistic detail derives from the
  Ethe1-/- mouse and tissue-specific conditional knockouts (Tiranti 2009; Di Meo
  2011), corroborated by patient biochemistry and the human treatment response.

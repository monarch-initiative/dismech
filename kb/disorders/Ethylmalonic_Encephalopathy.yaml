inheritance:
- name: Autosomal recessive
  description: >
    Ethylmalonic encephalopathy is caused by biallelic pathogenic variants in ETHE1;
    heterozygous carriers are asymptomatic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:19136963
    reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ethylmalonic encephalopathy is an autosomal recessive, invariably fatal disorder characterized by early-onset encephalopathy, microangiopathy, chronic diarrhea, defective cytochrome c oxidase (COX) in muscle and brain, high concentrations of C4 and C5 acylcarnitines in blood and high excretion of ethylmalonic acid in urine."
    explanation: States the autosomal recessive inheritance and the defining multisystem/biochemical phenotype.
prevalence:
- population: Reported cases in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ethylmalonic encephalopathy is ultra-rare; a 2023 systematic review compiled the
    features of 70 reported cases worldwide.
  evidence:
  - reference: PMID:37458841
    reference_title: "Ethylmalonic Encephalopathy: a literature review and two new cases of mild phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review focuses on the clinical, metabolic, genetic and neuroradiological features of 70 reported cases, including two new cases."
    explanation: Documents that only ~70 cases have been reported, consistent with an ultra-rare disorder.
pathophysiology:
- name: ETHE1 sulfur dioxygenase deficiency
  description: >
    Biallelic loss-of-function ETHE1 variants abolish the activity of the
    mitochondrial matrix sulfur (persulfide) dioxygenase, the enzyme that oxidizes
    sulfide within the mitochondrial pathway of H2S catabolism. The ETHE1 gene
    (formerly HSCO, GenBank D83198) encodes a beta-lactamase-like iron-coordinating
    metalloprotein imported into the mitochondrial matrix.
  genes:
  - preferred_term: ETHE1
    term:
      id: hgnc:23287
      label: ETHE1
  molecular_functions:
  - preferred_term: sulfur dioxygenase activity
    term:
      id: GO:0050313
      label: sulfur dioxygenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: sulfide oxidation
    term:
      id: GO:0019418
      label: sulfide oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:14732903
    reference_title: "Ethylmalonic encephalopathy is caused by mutations in ETHE1, a gene encoding a mitochondrial matrix protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified GenBank D83198 as the gene responsible for EE"
    explanation: Identifies ETHE1 (GenBank D83198) as the gene mutated in ethylmalonic encephalopathy.
  - reference: PMID:14732903
    reference_title: "Ethylmalonic encephalopathy is caused by mutations in ETHE1, a gene encoding a mitochondrial matrix protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the D83198 protein product is targeted to mitochondria and internalized into the matrix after energy-dependent cleavage of a short leader peptide"
    explanation: Establishes that the ETHE1 product is a mitochondrial matrix protein.
  - reference: PMID:19136963
    reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ETHE1 is a mitochondrial sulfur dioxygenase involved in catabolism of sulfide that accumulates to toxic levels in ethylmalonic encephalopathy."
    explanation: Defines ETHE1 as the mitochondrial sulfur dioxygenase of the sulfide catabolic pathway (demonstrated via the Ethe1-/- mouse and enzyme assays).
  downstream:
  - target: Hydrogen sulfide accumulation
    description: >
      Loss of sulfur dioxygenase activity prevents catabolism of sulfide, so H2S and
      its metabolite thiosulfate accumulate to toxic levels.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19136963
      reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "ETHE1 is a mitochondrial sulfur dioxygenase involved in catabolism of sulfide that accumulates to toxic levels in ethylmalonic encephalopathy."
      explanation: Directly links loss of ETHE1 sulfur dioxygenase to toxic sulfide accumulation.
- name: Hydrogen sulfide accumulation
  description: >
    In the absence of ETHE1-sulfur dioxygenase, hydrogen sulfide (H2S) accumulates in
    critical tissues — colonic mucosa, liver, muscle, and brain — and thiosulfate is
    excreted in massive amounts in urine. H2S is a powerful inhibitor of cytochrome c
    oxidase and of short-chain fatty acid oxidation and has vasoactive/vasotoxic
    effects, making it the central toxic species of the disease.
  chemical_entities:
  - preferred_term: hydrogen sulfide
    term:
      id: CHEBI:16136
      label: hydrogen sulfide
    modifier: INCREASED
  - preferred_term: thiosulfate
    term:
      id: CHEBI:26977
      label: thiosulfate
    modifier: INCREASED
  evidence:
  - reference: PMID:20812865
    reference_title: "Chronic exposure to sulfide causes accelerated degradation of cytochrome c oxidase in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The main consequence of the absence of Ethe1-SDO is the accumulation of sulfide (H(2)S) in critical tissues, including colonic mucosa, liver, muscle, and brain."
    explanation: Establishes tissue H2S accumulation as the direct consequence of ETHE1-SDO loss.
  - reference: PMID:19136963
    reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thiosulfate was excreted in massive amounts in urine of both Ethe1(-/-) mice and humans with ethylmalonic encephalopathy"
    explanation: Documents massive thiosulfate excretion (the H2S metabolite) in both mice and affected humans.
  downstream:
  - target: Cytochrome c oxidase deficiency
    description: >
      H2S inhibits and accelerates degradation of cytochrome c oxidase (complex IV).
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19136963
      reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sulfide is a powerful inhibitor of COX and short-chain fatty acid oxidation, with vasoactive and vasotoxic effects that explain the microangiopathy in ethylmalonic encephalopathy patients."
      explanation: Links sulfide to COX inhibition (and to short-chain fatty acid oxidation inhibition and microangiopathy).
  - target: Ethylmalonic aciduria and acylcarnitine elevation
    description: >
      H2S inhibition of short-chain acyl-CoA dehydrogenase / short-chain fatty acid
      oxidation produces the ethylmalonic aciduria and C4/C5 acylcarnitine elevation
      that define the biochemical phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19136963
      reference_title: "Loss of ETHE1, a mitochondrial dioxygenase, causes fatal sulfide toxicity in ethylmalonic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Sulfide is a powerful inhibitor of COX and short-chain fatty acid oxidation, with vasoactive and vasotoxic effects that explain the microangiopathy in ethylmalonic encephalopathy patients."
      explanation: Sulfide inhibition of short-chain fatty acid oxidation underlies the ethylmalonic acid / acylcarnitine biomarker profile.
  - target: Microangiopathy and endothelial toxicity
    description: >
      The vasoactive/vasotoxic action of H2S on the endothelium of small vessels
      produces the microangiopathy underlying petechiae and orthostatic acrocyanosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20812865
      reference_title: "Chronic exposure to sulfide causes accelerated degradation of cytochrome c oxidase in ethylmalonic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "several toxic actions on a number of enzymatic activities in different tissues, including endothelial lining of the small vessels, leading to multiorgan failure."
      explanation: Attributes the small-vessel/endothelial injury to H2S toxicity.
  - target: Chronic diarrhea
    description: >
      Accumulation of H2S in the colonic mucosa drives the chronic diarrhea
      characteristic of the disease.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20812865
      reference_title: "Chronic exposure to sulfide causes accelerated degradation of cytochrome c oxidase in ethylmalonic encephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The main consequence of the absence of Ethe1-SDO is the accumulation of sulfide (H(2)S) in critical tissues, including colonic mucosa, liver, muscle, and brain."
      explanation: Colonic-mucosa H2S accumulation underlies the gastrointestinal (chronic diarrhea) involvement.
- name: Cytochrome c oxidase deficiency
  description: >
    Chronic sulfide exposure causes cytochrome c oxidase (complex IV) deficiency by
    rapid heme a inhibition and accelerated long-term degradation of COX subunits;
    COX activity is decreased in skeletal muscle and brain.
  evidence:
  - reference: PMID:20812865
    reference_title: "Chronic exposure to sulfide causes accelerated degradation of cytochrome c oxidase in ethylmalonic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The mechanism by which H(2)S causes COX deficiency consists of rapid heme a inhibition and accelerated long-term degradation of COX subunits."
    explanation: Describes the mechanism of the acquired complex IV deficiency.
  - reference: PMID:14732903
    reference_title: "Ethylmalonic encephalopathy is caused by mutations in ETHE1, a gene encoding a mitochondrial matrix protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cytochrome c oxidase activity is decreased in skeletal muscle"
    explanation: Documents decreased COX activity in patient skeletal muscle.
  downstream:
  - target: Neurodevelopmental regression and encephalopathy
    description: >
      Cerebral energy failure from complex IV deficiency (together with direct
      neurotoxicity of sulfide) drives the encephalopathy, psychomotor regression and
      symmetric basal ganglia lesions.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "characterized by early-onset encephalopathy, microangiopathy, chronic diarrhea, defective cytochrome c oxidase (COX) in muscle and brain"
      explanation: Links the brain COX defect to the early-onset encephalopathy.

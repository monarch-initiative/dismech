name: Ethylmalonic Encephalopathy
category: Mendelian
creation_date: '2026-07-08T00:00:00Z'
synonyms:
- EE
- EPEMA syndrome
- Encephalopathy, petechiae, and ethylmalonic aciduria
- ETHE1 deficiency
- Mitochondrial sulfur dioxygenase deficiency
description: >
  Ethylmalonic encephalopathy (EE) is a rare, autosomal recessive, "intoxication-type"
  inborn error of metabolism caused by loss-of-function mutations in ETHE1, which
  encodes a mitochondrial matrix sulfur dioxygenase (persulfide dioxygenase). ETHE1
  is a key enzyme in the mitochondrial pathway that detoxifies hydrogen sulfide
  (H2S), a signalling gasotransmitter produced both endogenously in tissues and, in
  large amounts, by anaerobic bacteria of the gut. When ETHE1 activity is lost, H2S
  and its metabolite thiosulfate accumulate to toxic concentrations in critical
  tissues including colonic mucosa, liver, muscle, brain, and the endothelium of
  small blood vessels. H2S is a potent inhibitor of cytochrome c oxidase (COX,
  respiratory chain complex IV) and of short-chain fatty acid oxidation, and exerts
  vasoactive and vasotoxic effects. The result is the characteristic multisystem
  phenotype: early-onset encephalopathy with psychomotor regression, hypotonia and
  pyramidal signs, symmetric basal ganglia lesions on MRI, relapsing petechiae,
  orthostatic acrocyanosis and chronic diarrhea, together with the diagnostic
  biochemical signature of high urinary ethylmalonic acid and elevated C4 and C5
  acylcarnitines. Classically fatal in early childhood, EE can be ameliorated by
  combined metronidazole (to lower colonic H2S-producing anaerobes) and
  N-acetylcysteine (to buffer sulfide via glutathione), with liver transplantation
  reported in some cases.

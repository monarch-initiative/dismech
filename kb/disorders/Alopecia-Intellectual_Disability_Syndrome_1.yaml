diagnosis:
- name: Clinical and developmental assessment
  description: >-
    Document the onset and distribution of alopecia together with intellectual and adaptive functioning,
    pedigree and other ectodermal or neurologic findings. Clinical overlap requires consideration of
    other inherited alopecia-intellectual disability syndromes.
  evidence:
  - reference: PMID:16273389
    reference_title: Localization of a novel locus for alopecia with mental retardation syndrome to chromosome 3q26.33-q27.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In individuals affected with APMR syndrome, hairs were completely absent by birth from all areas of normal hair growth including scalp, eyebrows, eyelashes, axillary and pubic hair.
    explanation: >-
      Directly documents the hair phenotype of the original linkage family.
  - reference: PMID:30745696
    reference_title: Clinical Practice Guidelines for Assessment and Management of intellectual disability.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnostic process involves history taking, observation including medical examination, intellectual and adaptive behavioral assessment, identification of comorbid psychiatric disorders, and need-based laboratory investigations for other medical conditions.
    explanation: >-
      General ID assessment guidance; no APMR1-specific diagnostic score is established.
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
- name: Molecular genetic evaluation
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing and family segregation analysis identified AHSG p.Arg317His in the reported family.
    In a new patient, assess the full clinical and genetic differential and interpret AHSG variants
    in light of the limited association evidence. The altered protein migration is a research finding
    rather than a validated standalone diagnostic assay.
  results: A compatible phenotype with a carefully interpreted familial AHSG finding may support APMR1; rare biallelic variants alone are insufficient.
  evidence:
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study is the first report to identify a homozygous missense mutation for APMR syndrome through whole-exome sequencing.
    explanation: >-
      Describes the research identification method, not diagnostic sensitivity or universal confirmatory
      criteria.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Previous families with APMR syndrome have been studied through linkage analyses and the linkage resolution did not allow pointing out to a single gene candidate.
    explanation: >-
      Explains why historical linkage families cannot automatically be treated as molecularly confirmed
      AHSG cases.
    quote_role: BACKGROUND

name: Alopecia-Intellectual Disability Syndrome 1
synonyms:
- APMR1
- Alopecia with mental retardation syndrome 1
- AHSG-related alopecia-intellectual disability syndrome
- Alopecia-intellectual disability syndrome type 1
creation_date: '2026-08-26T09:00:00Z'
category: Mendelian
description: >-
  Alopecia-intellectual disability syndrome 1 (APMR1) is a rare autosomal recessive neurocutaneous condition
  combining total or partial scalp and body hair loss with intellectual disability. The original Pakistani
  linkage family had congenital generalized alopecia and severe intellectual disability; a later Iranian
  family with seven affected relatives carried homozygous AHSG p.Arg317His. The historical linkage family
  was not molecularly resolved in its report, so its complete phenotype is not automatically an AHSG-specific
  spectrum.

  AHSG encodes fetuin-A. The reported variant segregates with the phenotype and is associated with altered
  protein migration, but its biochemical effect and the routes to hair loss and intellectual disability
  remain unresolved. TGF-beta antagonism and keratinocyte migration are candidate explanations drawn from
  experiments outside APMR1. The numbered APMR forms are genetically heterogeneous: AHSG is associated
  with APMR1, LSS with APMR4, and APMR2 and APMR3 denote separate linkage loci. An APMR1-specific population
  prevalence has not been established.

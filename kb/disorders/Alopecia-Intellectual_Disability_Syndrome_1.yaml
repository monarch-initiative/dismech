notes: >-
  Curated against issue #8364, which targeted the APMR root (MONDO:0008756) as
  CURATE_ROOT_WITH_SUBTYPES. That instruction was not followed literally: the four
  numbered forms have different genes on different chromosomes, so has_subtypes would
  assert a single-gene severity spectrum that does not exist. The root is modelled as a
  Grouping instead, in line with the modelling note already recorded in the APMR4 entry.

  The issue body's gene hints ("APMR1 (LSS/HR locus, 3q26-q27) ... APMR3 (LSS)") are
  incorrect and were not used. See the apmr1_locus_series_confusion discussion for the
  primary-source trace.

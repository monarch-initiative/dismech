- name: Reduced Fetuin-A TGF-beta Antagonism
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Reduced antagonism of TGF-beta ligands is a proposed consequence of the APMR1 allele. Normal fetuin
    binds TGF-beta/BMP ligands in vitro, but deficient binding or neutralization has not been demonstrated
    for p.Arg317His. This node is conditional on the stated hypothesis.
  biological_processes:
  - preferred_term: negative regulation of transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0030512
      label: negative regulation of transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:8662721
    reference_title: Fetuin/alpha2-HS glycoprotein is a transforming growth factor-beta type II receptor mimic and cytokine antagonist.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Surface plasmon resonance measurements show that fetuin binds directly to TGF-beta1 and TGF-beta2 and with greater affinity to the TGF-beta-related bone morphogenetic proteins (BMP-2, BMP-4, and BMP-6).
    explanation: >-
      Establishes normal ligand binding, not a loss of this activity in APMR1.
    directness: INDIRECT
  downstream:
  - target: Premature Hair Follicle Catagen Entry
    description: >-
      Reduced restraint of the experimentally catagen-promoting TGF-beta2 signal could favor premature
      catagen. Both the loss of restraint and the resulting timing defect remain untested in APMR1.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:12060393
      reference_title: Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These results strongly suggest that transforming growth factor-beta2 plays an essential part in the induction of the catagen phase of the human hair cycle.
      explanation: >-
        Supports the TGF-beta2/catagen relationship in human follicles; its disruption by AHSG p.Arg317His
        is inferred.
      directness: INDIRECT
- name: Premature Hair Follicle Catagen Entry
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Premature follicular regression is a candidate explanation for hair loss based on human hair-cycle
    experiments. TGF-beta2 suppressed elongation, whereas fetuin and neutralizing antibody promoted
    elongation in organ culture. These experiments did not study an AHSG-variant follicle or demonstrate
    premature catagen in APMR1 skin.
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  evidence:
  - reference: PMID:12060393
    reference_title: Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Elongation of hair was significantly suppressed by transforming growth factor-beta2.
    explanation: >-
      Shows the direction of the experimental ligand effect, not the cause of congenital APMR1 alopecia.
    directness: INDIRECT
  downstream:
  - target: Alopecia of Scalp
    description: >-
      Premature regression could contribute to hair loss if the candidate mechanism operates in APMR1.
      The congenital phenotype could instead involve follicle formation or another fetuin-A function.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:12060393

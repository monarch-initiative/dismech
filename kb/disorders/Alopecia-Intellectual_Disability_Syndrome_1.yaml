      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In the presence of the antibody as well as fetuin, hair follicles were markedly elongated in a concentration-dependent manner.
      explanation: >-
        Provides experimental hair-growth evidence for the hypothesis only.
      directness: INDIRECT

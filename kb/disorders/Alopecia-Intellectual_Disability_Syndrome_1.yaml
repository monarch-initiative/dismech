    explanation: Predictive prevalence estimate for the APMR group, supporting the BELOW_1_IN_1000000 class.
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, approximately 14 families (i.e., Iranian, Pakistani, and Swiss) with APMR have been reported in the scientific literature."
    explanation: Quantifies the total reported APMR literature, supporting the ultra-rare classification.
mechanistic_hypotheses:
- hypothesis_group_id: fetuin_tgfb_antagonism_model
  hypothesis_label: Loss of fetuin-A TGF-beta antagonism model
  status: EMERGING
  description: >
    A candidate explanatory model in which the APMR1 phenotype follows from loss of
    fetuin-A's function as an antagonist of TGF-beta family signalling. Fetuin-A is a
    potent TGF-beta antagonist, and TGF-beta2 is the isoform that induces catagen (the
    regression phase) of the human hair cycle: in human hair follicle organ culture,
    adding fetuin markedly elongates follicles in a concentration-dependent manner.
    Reduced fetuin-A antagonism would therefore be expected to leave TGF-beta2 signalling
    unopposed in the follicle. AHSG is separately reported to be expressed in the fetal
    human brain and believed to be involved in embryonic neocortical development,
    offering a parallel route to the neurodevelopmental arm.

    This model is EMERGING, not canonical. Every step downstream of the AHSG variant is
    inferred from fetuin-A biology studied outside APMR1 — none of it has been shown in
    APMR1 patient tissue, and no functional rescue experiment has been reported for
    p.Arg317His. The competing possibility that the phenotype arises from a
    fetuin-A function unrelated to TGF-beta antagonism, or from a second variant in
    linkage disequilibrium within the run of homozygosity, has not been excluded.
  evidence:
  - reference: PMID:12060393
    reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the presence of the antibody as well as fetuin, hair follicles were markedly elongated in a concentration-dependent manner."
    explanation: >-
      Fetuin promotes human hair follicle elongation in organ culture, which is the
      observation the loss-of-antagonism model is built on.
  - reference: PMID:12853704
    reference_title: "Elevated levels of alpha-2-Heremans-Schmid glycoprotein in CSF of patients with low-grade gliomas."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "This glycoprotein is expressed in the fetal human brain and is believed to be involved in the embryonic development of the neocortex."
    explanation: >-
      Supports a plausible neurodevelopmental role for AHSG, but is a background
      statement in a glioma proteomics paper rather than a primary developmental result,
      so it is graded PARTIAL.
pathophysiology:
- name: Biallelic AHSG Missense Variant
  role: trigger
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >
    A homozygous missense variant in AHSG (NM_001622:exon7:c.950G>A, p.Arg317His) was
    identified by whole-exome sequencing as the candidate cause of APMR1. The residue
    lies in a region of the protein required for protein processing and the substitution
    disrupts a phosphorylation motif. AHSG maps within the previously reported APMR1
    linkage interval and the variant falls within a run of homozygosity.

    Confidence is PROVISIONAL rather than ESTABLISHED: the assertion rests on a single
    consanguineous family, a single predicted-pathogenic missense allele, and no
    reported functional rescue. No independent family with a second AHSG allele has been
    published, and ClinGen has not curated an AHSG gene-disease validity assertion.
  gene:
    preferred_term: AHSG
    term:
      id: hgnc:349
      label: AHSG
  evidence:
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study revealed a novel predicted pathogenic, homozygous missense mutation in the AHSG (OMIM 138680) gene (AHSG: NM_001622:exon7:c.950G>A:p.Arg317His)."
    explanation: Identifies the specific causal allele and its zygosity.
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with the phenotype, AHSG maps within APMR linkage region 1 (APMR 1) as reported before, and falls within runs of homozygosity (ROH)."
    explanation: Positional concordance with the independently mapped APMR1 locus supports the gene assignment.
  - reference: PMID:16273389
    reference_title: "Localization of a novel locus for alopecia with mental retardation syndrome to chromosome 3q26.33-q27.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recombination events observed in affected individuals localized the disease locus between markers D3S1232 and D3S2436, spanning 11.49-cM region on chromosome 3q26.33-q27.3."
    explanation: The original linkage interval that AHSG was later found to lie within.
  downstream:
  - target: Aberrant Fetuin-A Protein Processing
    description: >-
      The substituted residue lies in a region required for protein processing and
      disrupts a phosphorylation motif, and the mutant protein migrates aberrantly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28054173
      reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The variant is predicted to affect a region of the protein required for protein processing and disrupts a phosphorylation motif."
      explanation: Predicts the proximal molecular consequence of the p.Arg317His substitution.
- name: Aberrant Fetuin-A Protein Processing
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >
    The p.Arg317His protein migrates with an aberrant size relative to that of healthy
    individuals, the only direct experimental evidence that the variant alters the
    protein product. Whether this reflects altered post-translational modification,
    reduced secretion, or reduced functional activity was not determined, and no
    quantitative assay of circulating fetuin-A in affected individuals has been reported.
  gene:
    preferred_term: AHSG
    term:
      id: hgnc:349
      label: AHSG
  evidence:
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the altered protein migrates with an aberrant size relative to healthy individuals."
    explanation: Direct observation that the variant changes the fetuin-A protein product.
  downstream:
  - target: Reduced Fetuin-A TGF-beta Antagonism
    description: >-
      A processing-defective fetuin-A is postulated to provide less TGF-beta antagonism.
      This step is inferred, not measured, in APMR1.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:12060393
      reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Next, a neutralizing antibody and fetuin, a potent transforming growth factor-beta antagonist was tested."
      explanation: >-
        Establishes fetuin as a TGF-beta antagonist, the function whose loss this edge
        postulates; it does not itself demonstrate reduced antagonism in APMR1.
- name: Reduced Fetuin-A TGF-beta Antagonism
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >
    Fetuin-A is a potent antagonist of TGF-beta family signalling. The model proposes
    that a processing-defective fetuin-A antagonises TGF-beta less effectively, leaving
    TGF-beta signalling relatively unopposed in tissues that depend on fetuin-A for this
    restraint. No measurement of TGF-beta pathway activity has been reported in APMR1
    patient tissue, so this node is HYPOTHETICAL.
  biological_processes:
  - preferred_term: negative regulation of transforming growth factor beta receptor signaling pathway
    term:
      id: GO:0030512
      label: negative regulation of transforming growth factor beta receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:8662721
    reference_title: "Fetuin/alpha2-HS glycoprotein is a transforming growth factor-beta type II receptor mimic and cytokine antagonist."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Surface plasmon resonance measurements show that fetuin binds directly to TGF-beta1 and TGF-beta2 and with greater affinity to the TGF-beta-related bone morphogenetic proteins (BMP-2, BMP-4, and BMP-6)."
    explanation: >-
      Direct binding measurements establishing the ligand-sequestration mechanism of
      fetuin-A that this node describes losing.
  - reference: PMID:8662721
    reference_title: "Fetuin/alpha2-HS glycoprotein is a transforming growth factor-beta type II receptor mimic and cytokine antagonist."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggest that fetuin is a natural antagonist of TGF-beta and BMP activities"
    explanation: The authors' summary of fetuin as a physiological TGF-beta/BMP antagonist.
  - reference: PMID:12060393
    reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Next, a neutralizing antibody and fetuin, a potent transforming growth factor-beta antagonist was tested."
    explanation: Independent confirmation of the antagonist function, in the hair-follicle context.
  downstream:
  - target: Premature Hair Follicle Catagen Entry
    description: >-
      Unopposed TGF-beta2 signalling in the follicle is proposed to drive premature or
      persistent catagen entry.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:12060393
      reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results strongly suggest that transforming growth factor-beta2 plays an essential part in the induction of the catagen phase of the human hair cycle."
      explanation: TGF-beta2 is the catagen-inducing signal that fetuin-A loss would leave unopposed.
  - target: Impaired Neocortical Development
    description: >-
      A parallel route to the neurodevelopmental arm, resting on AHSG expression in the
      fetal human brain rather than on any measurement in APMR1.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:12853704
      reference_title: "Elevated levels of alpha-2-Heremans-Schmid glycoprotein in CSF of patients with low-grade gliomas."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "This glycoprotein is expressed in the fetal human brain and is believed to be involved in the embryonic development of the neocortex."
      explanation: >-
        The only published statement placing AHSG in human neocortical development; it is
        an introductory claim in a glioma paper, hence PARTIAL.
- name: Premature Hair Follicle Catagen Entry
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >
    TGF-beta2 induces catagen, the regression phase of the human hair cycle: it is
    strongly immunoreactive in lower bulb matrix cells at the anagen-catagen transition
    and colocalises with its type II receptor in regressing epithelial strands
    containing apoptotic cells. Exogenous TGF-beta2 suppresses hair elongation in organ
    culture, while fetuin markedly elongates follicles. The model proposes that failure
    of fetuin-A antagonism shifts follicles toward catagen, but this has not been shown
    in APMR1 skin, and no scalp biopsy or follicle histology has been reported for an
    AHSG-variant patient.
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: DECREASED
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  evidence:
  - reference: PMID:12060393
    reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Elongation of hair was significantly suppressed by transforming growth factor-beta2."
    explanation: Direct demonstration that TGF-beta2 suppresses human hair growth in organ culture.
  - reference: PMID:12060393
    reference_title: "Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During the anagen-catagen transition phase, strong transforming growth factor-beta2 immunoreactivity appeared in the lower bulb matrix cells adjacent to the dermal papilla."
    explanation: Localises the catagen-inducing TGF-beta2 signal to the follicle compartment.
  downstream:
  - target: Alopecia
    description: >-
      Failure to sustain anagen manifests clinically as absent or sparse hair.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:28054173
      reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "associated with total or partial absence of hair from the scalp and other parts of the body"
      explanation: The clinical hair phenotype that the follicle-level node is proposed to produce.
- name: Impaired Neocortical Development
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >
    AHSG is reported to be expressed in the fetal human brain and believed to be involved
    in embryonic neocortical development. The model proposes that a processing-defective
    fetuin-A perturbs this role, producing the intellectual disability component. No
    neuroimaging series, neuropathology, or patient-derived neural model has been
    reported for AHSG-variant individuals, so the node rests entirely on background
    expression data from an unrelated study population.
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12853704
    reference_title: "Elevated levels of alpha-2-Heremans-Schmid glycoprotein in CSF of patients with low-grade gliomas."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "This glycoprotein is expressed in the fetal human brain and is believed to be involved in the embryonic development of the neocortex."
    explanation: >-
      The sole published basis for a neocortical role of AHSG; a background statement,
      not a primary developmental finding, so graded PARTIAL.
  downstream:
  - target: Intellectual Disability
    description: >-
      Disturbed neocortical development is proposed to underlie the variable intellectual
      disability.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - fetuin_tgfb_antagonism_model
    evidence:
    - reference: PMID:33881165
      reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "absence of hair on the scalp, eyelashes, and eyebrows and mild to severe intellectual disability"
      explanation: The clinical neurodevelopmental phenotype the node is proposed to produce.
phenotypes:
- name: Alopecia
  category: Clinical
  description: >
    Total or partial absence of hair from the scalp and other parts of the body,
    including eyelashes and eyebrows. The hair phenotype is the presenting feature and
    is present from early life.
  phenotype_term:
    preferred_term: Alopecia
    term:
      id: HP:0001596
      label: Alopecia
  evidence:
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated with total or partial absence of hair from the scalp and other parts of the body"
    explanation: Documents the extent and distribution of the hair loss.
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "absence of hair on the scalp, eyelashes, and eyebrows and mild to severe intellectual disability"
    explanation: Extends the hair phenotype to eyelashes and eyebrows.
- name: Intellectual Disability
  category: Clinical
  description: >
    Intellectual disability of variable degree, reported across the APMR series as ranging
    from mild to severe. Severity is not uniform across the families that define APMR1:
    the original 3q26.33-q27.3 linkage family was described as severely affected, while
    later comparative literature characterises APMR1 as mild-to-moderate. Since only the
    AHSG-solved family has a molecular diagnosis, it is not established that both
    families represent the same genetic entity. Formal cognitive testing data are
    reported in the primary papers but their full texts are not quotable from this
    repository's reference cache, so the severity range is curated qualitatively here.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as well as variable intellectual disability"
    explanation: Documents the neurodevelopmental component and its variability.
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mild to severe intellectual disability"
    explanation: Gives the reported severity range across the APMR series.
  - reference: PMID:17451405
    reference_title: "Mapping of a gene for alopecia with mental retardation syndrome (APMR3) on chromosome 18q11.2-q12.2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals with APMR syndrome show loss of hair on the scalp, absence of eyebrows, eyelashes, axillary and pubic hair, and mild to severe mental retardation."
    explanation: >-
      Gives the full hair distribution (including axillary and pubic hair) alongside the
      mild-to-severe cognitive range for the APMR series.
genetic:
- name: AHSG
  gene_term:
    preferred_term: AHSG
    term:
      id: hgnc:349
      label: AHSG
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  variants:
  - name: 'NM_001622:c.950G>A (p.Arg317His)'
    description: >-
      Germline homozygous missense substitution in AHSG exon 7, reported as predicted
      pathogenic, affecting a region required for protein processing and disrupting a
      phosphorylation motif. Curated as LIKELY_PATHOGENIC rather than PATHOGENIC: the
      supporting data are segregation in one consanguineous family plus in silico
      prediction, with the only experimental readout an altered protein migration on
      Western blot. No functional assay establishes the direction of effect, so whether
      the allele is loss-of-function, dominant-negative, or neomorphic is unresolved.
      A simple loss-of-function reading is actively disfavoured by the human allelic
      series: a homozygous AHSG nonsense allele (p.Lys2Ter) causing complete fetuin-A
      deficiency on ELISA has been reported to cause infantile cortical hyperostosis
      (Caffey disease), not alopecia with intellectual disability. If total absence of
      fetuin-A gives a skeletal phenotype, p.Arg317His is unlikely to act by simple
      absence of protein.
      Note that the schema's ClinicalSignificanceEnum offers no uncertain-significance
      (VUS) tier, so LIKELY_PATHOGENIC is the closest available grade rather than an
      exact reflection of the ACMG evidence here.
    gene:
      preferred_term: AHSG
      term:
        id: hgnc:349
        label: AHSG
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:28054173
      reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our study revealed a novel predicted pathogenic, homozygous missense mutation in the AHSG (OMIM 138680) gene (AHSG: NM_001622:exon7:c.950G>A:p.Arg317His)."
      explanation: The primary report of the allele, its zygosity, and its predicted pathogenicity.
  evidence:
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, AHSG was reported in a consanguineous Iranian family and LSS gene in a Swiss origin family, while the remaining two uncharacterized loci, that is, APMR2 and APMR3, are reported in the Pakistani population."
    explanation: >-
      Independent review confirming AHSG as the APMR1 gene and, importantly, that only
      APMR1 and APMR4 are molecularly characterised.
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study is the first report to identify a homozygous missense mutation for APMR syndrome through whole-exome sequencing."
    explanation: >-
      The authors' own framing as a first report is the reason this gene-disease
      assertion is curated as PROVISIONAL rather than ESTABLISHED.
  notes: >-
    AHSG (alpha-2-HS-glycoprotein, fetuin-A) at 3q27.3 is the causal gene assigned to
    APMR1. The assignment rests on a single homozygous missense allele, p.Arg317His,
    identified by whole-exome sequencing in one large consanguineous family with seven
    affected members, supported by positional concordance with the independently mapped
    3q26.33-q27.3 linkage interval and by aberrant migration of the mutant protein.

    Do NOT attribute LSS to APMR1. LSS (21q22.3) causes APMR4, a different disease on a
    different chromosome. Do NOT attribute the HR (hairless) gene to APMR1 either: HR is
    at 8p21.3 and causes atrichia with papular lesions, a separate condition in the
    differential. Both conflations appear in secondary sources describing this numbered
    series and are the documented Named Entity Confusion risk for this target.
animal_models:
- name: Ahsg-null mouse
  species: Mouse
  genotype: Ahsg-/- (targeted null)
  background: C57BL/6 and DBA/2
  publication: PMID:12897203
  description: >
    The constitutive Ahsg knockout mouse was generated and characterised as a model of
    ectopic calcification, not of APMR1. It is reported as phenotypically normal at
    baseline, developing severe organ calcification only on a mineral- and vitamin
    D-rich diet or on a DBA/2 background. No alopecia or neurodevelopmental phenotype is
    reported.
  genes:
  - preferred_term: AHSG
    term:
      id: hgnc:349
      label: AHSG
  modeled_mechanisms:
  - target: Premature Hair Follicle Catagen Entry
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Complete loss of Ahsg in the mouse does not produce the hair phenotype that a
      human biallelic AHSG variant produces, which is the central difficulty for any
      loss-of-function model of APMR1.
    limitations: >-
      The report is a calcification study and did not set out to phenotype hair or
      behaviour, so "phenotypically normal" is a general statement rather than the
      result of a targeted dermatological or neurodevelopmental assessment; absence of a
      reported hair phenotype is therefore weaker than a documented negative. Two
      further caveats apply: the human allele is a missense substitution rather than a
      null, so a mouse null is not the matched genotype and a dominant-negative or
      neomorphic mechanism would not be modelled by it; and mouse and human hair-cycle
      biology differ, with the human catagen data underpinning this node coming from
      human follicle organ culture rather than mouse.
    evidence:
    - reference: PMID:12897203
      reference_title: "The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Ahsg-deficient mice are phenotypically normal, but develop severe calcification of various organs on a mineral and vitamin D-rich diet and on a normal diet when the deficiency is combined with a DBA/2 genetic background."
      explanation: >-
        A constitutive Ahsg null is reported as otherwise phenotypically normal, so the
        mouse does not reproduce the human hair phenotype.
  evidence:
  - reference: PMID:12897203
    reference_title: "The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, our data demonstrate a critical role of Ahsg as an inhibitor of unwanted mineralization"
    explanation: >-
      Establishes what the Ahsg-null mouse does model — systemic calcification control —
      which is not the APMR1 phenotype.
  notes: >-
    Listed because its negative result constrains the mechanism model, not because it is
    a validated APMR1 model. No mouse carrying the orthologous p.Arg317His substitution
    has been reported.
differential_diagnoses:
- name: Alopecia-Intellectual Disability Syndrome 4
  description: >-
    APMR4, caused by biallelic LSS variants at 21q22.3, presents with the same core
    combination of congenital alopecia and intellectual disability and is the main
    within-series differential. It is distinguished by frequent early-onset epilepsy and
    additional dermatological features, and is separated definitively by gene testing.
  disease_term:
    preferred_term: alopecia-intellectual disability syndrome 4
    term:
      id: MONDO:0030009
      label: alopecia-intellectual disability syndrome 4
  evidence:
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, AHSG was reported in a consanguineous Iranian family and LSS gene in a Swiss origin family"
    explanation: Establishes APMR1 and APMR4 as distinct gene-defined entities within the series.
- name: Infantile Cortical Hyperostosis (Caffey Disease)
  description: >-
    Not a clinical mimic but the key allelic comparator. A homozygous AHSG nonsense
    variant (c.A4T, p.Lys2Ter) producing complete serum fetuin-A deficiency has been
    reported in an infant with classical infantile cortical hyperostosis — subperiosteal
    bone hyperplasia, with no alopecia or intellectual disability described. The
    autosomal dominant form of Caffey disease is caused by COL1A1. Because a human AHSG
    null gives a skeletal rather than a neurocutaneous phenotype, the APMR1 missense
    allele is unlikely to act by simple loss of protein; this is the strongest available
    constraint on the APMR1 mechanism and is stronger than the mouse knockout evidence
    because it is human.
  disease_term:
    preferred_term: infantile cortical hyperostosis
    term:
      id: MONDO:0007244
      label: Caffey disease
  evidence:
  - reference: PMID:31288248
    reference_title: "Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES analysis revealed a novel homozygous nonsense mutation in lysine 2 of fetuin-A, encoded by the ALPHA-2-HS-GLYCOPROTEIN (AHSG) gene (c.A4T; p.K2X)."
    explanation: Identifies the human AHSG null allele and the disease it causes.
  - reference: PMID:31288248
    reference_title: "Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By enzyme-linked immunosorbent assay (ELISA), we show a complete deficiency of this protein in the patient's serum, compared to controls."
    explanation: >-
      Confirms the allele produces complete fetuin-A deficiency, which is what makes the
      phenotypic contrast with APMR1 informative.
- name: Atrichia with Papular Lesions
  description: >-
    HR-related atrichia with papular lesions also presents with near-total congenital
    hair loss but is caused by variants in HR at 8p21.3, is not accompanied by
    intellectual disability as a defining feature, and shows characteristic follicular
    papules. It is named here explicitly because the HR gene has been erroneously
    attributed to APMR1 in secondary sources.
  disease_term:
    preferred_term: atrichia with papular lesions
    term:
      id: MONDO:0008847
      label: atrichia with papular lesions
  evidence:
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The current mini-report discusses the molecular genetics and mutational spectrum of APMR syndrome, its differential diagnosis from related disorders"
    explanation: >-
      The cited review is the source that works through the APMR differential; the
      specific HR distinction is recorded in the description rather than quoted.
discussions:
- discussion_id: apmr1_ahsg_gene_validity
  prompt: >-
    Is AHSG established as the APMR1 gene, given that the assignment rests on one
    consanguineous family, one predicted-pathogenic missense allele, and no functional
    rescue?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic AHSG Missense Variant
  - genetic#AHSG
  rationale: >-
    The AHSG assignment has real positional support: the gene lies inside the
    independently mapped 3q26.33-q27.3 interval and within a run of homozygosity, and
    the mutant protein migrates aberrantly. But it is a single-family, single-allele
    report from 2017 and, as of this curation, no second family with an independent AHSG
    allele has been published, no functional assay establishes the direction of effect,
    and ClinGen has curated no gene-disease validity assertion for AHSG. The Ahsg-null
    mouse being phenotypically normal cuts against a simple loss-of-function model. The
    entry therefore records mechanism_confidence PROVISIONAL on the trigger node and
    PROVISIONAL on the trigger node and LIKELY_PATHOGENIC rather than PATHOGENIC on the
    variant. A further complication, surfaced by the Edison deep-research run: a
    different homozygous AHSG allele — the nonsense p.Lys2Ter, with complete serum
    fetuin-A deficiency confirmed by ELISA — has been reported to cause infantile
    cortical hyperostosis rather than APMR1. Two AHSG genotypes, two unrelated
    phenotypes, one family each. This is either an allelic series in which the missense
    acts by a non-null mechanism, or a sign that one of the two assignments is wrong.
    Resolving it needs a second unrelated APMR1 family or a functional readout, not more
    reviews restating the 2017 result.
  evidence:
  - reference: PMID:28054173
    reference_title: "Association of AHSG with alopecia and mental retardation (APMR) syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous families with APMR syndrome have been studied through linkage analyses and the linkage resolution did not allow pointing out to a single gene candidate."
    explanation: >-
      The authors note that prior linkage work could not resolve a single candidate,
      underlining that this is the first and so far only gene-level report.
  - reference: PMID:31288248
    reference_title: "Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease)."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous nonsense mutation in AHSG gene has been found in ICH patient with a typical phenotype, resulting in fetuin-A deficiency."
    explanation: >-
      A second, independent biallelic AHSG genotype associated with an entirely different
      phenotype, which complicates the APMR1 gene-disease assertion.
- discussion_id: apmr1_ahsg_mouse_mismatch
  prompt: >-
    Why is the Ahsg-null mouse phenotypically normal when biallelic human AHSG variants
    cause alopecia and intellectual disability?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Fetuin-A TGF-beta Antagonism
  - animal_models#Mouse
  rationale: >-
    Model-system evidence for AHSG exists and is substantial, but it is about the wrong
    thing: the Ahsg-null mouse was built and characterised as a calcification model and
    is otherwise reported as phenotypically normal, with no hair or neurodevelopmental
    phenotype. This is a genuine mismatch rather than merely missing evidence, and it
    admits at least three readings that current data cannot separate. First, the human
    allele is a missense, not a null, so APMR1 may act by a dominant-negative or
    neomorphic mechanism that a knockout cannot model. Second, mouse and human may
    differ in how far hair-follicle cycling and cortical development depend on
    fetuin-A — notably, the human catagen evidence underpinning this model comes from
    human follicle organ culture, not mouse. Third, the mouse may simply never have been
    examined for the relevant phenotypes, since the study's endpoints were mineral.

    The human allelic series makes the first reading the most likely one. A homozygous
    AHSG nonsense allele with ELISA-confirmed complete fetuin-A deficiency causes
    infantile cortical hyperostosis, not APMR1 — so in humans, as in mice, absence of
    fetuin-A does not produce alopecia with intellectual disability. That converts the
    mouse result from an awkward species difference into a consistent cross-species
    signal that APMR1 is not a simple null phenotype. Until an allele-specific model
    exists, every node downstream of the variant stays HYPOTHETICAL.
  proposed_experiments:
  - experiment_id: apmr1_ahsg_ko_targeted_phenotyping
    name: Targeted dermatological and neurobehavioural phenotyping of Ahsg-/- mice
    description: >-
      Phenotype an existing Ahsg-null line specifically for hair-cycle staging (anagen/
      catagen distribution on synchronised depilation), follicle histology, and standard
      neurobehavioural and cortical-layering assays, rather than relying on the absence
      of a reported phenotype in a calcification study.
    would_support:
    - pathophysiology#Premature Hair Follicle Catagen Entry
    supporting_outcome:
    - >-
      Ahsg-/- mice show accelerated catagen entry after depilation-synchronised anagen,
      reduced follicle length, or cortical layering abnormalities.
    would_refute:
    - pathophysiology#Reduced Fetuin-A TGF-beta Antagonism
    refuting_outcome:
    - >-
      Systematic hair-cycle staging and neurobehavioural testing find no difference from
      wild-type, indicating that simple loss of fetuin-A is insufficient and directing
      attention to an allele-specific mechanism.
  - experiment_id: apmr1_ahsg_r317h_knockin
    name: Knock-in mouse carrying the orthologous p.Arg317His allele
    description: >-
      Generate a knock-in of the orthologous Ahsg missense substitution rather than a
      null, to test whether the human phenotype depends on the specific allele rather
      than on absence of the protein.
    would_support:
    - pathophysiology#Biallelic AHSG Missense Variant
    supporting_outcome:
    - >-
      Homozygous knock-in mice develop hair loss and/or cognitive impairment that the
      null does not, supporting an allele-specific (dominant-negative or neomorphic)
      mechanism.
    would_refute:
    - pathophysiology#Biallelic AHSG Missense Variant
    refuting_outcome:
    - >-
      Homozygous knock-in mice are indistinguishable from both wild-type and Ahsg-null
      mice, which would weaken the case for AHSG as the causal gene and revive the
      possibility of another variant within the run of homozygosity.
  evidence:
  - reference: PMID:12897203
    reference_title: "The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Ahsg-deficient mice are phenotypically normal, but develop severe calcification of various organs on a mineral and vitamin D-rich diet and on a normal diet when the deficiency is combined with a DBA/2 genetic background."
    explanation: The negative mouse result that creates the mismatch.
  - reference: PMID:31288248
    reference_title: "Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "By enzyme-linked immunosorbent assay (ELISA), we show a complete deficiency of this protein in the patient's serum, compared to controls."
    explanation: >-
      A human with no fetuin-A at all has a skeletal phenotype, not APMR1, which refutes
      the simple loss-of-function reading in the species that matters.
- discussion_id: apmr1_locus_series_confusion
  prompt: >-
    Which gene belongs to which numbered APMR form, and how should the series be modelled
    in dismech?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - disease#Alopecia-Intellectual Disability Syndrome 1
  rationale: >-
    Secondary sources describing this numbered series have attributed LSS to APMR1 and to
    APMR3, and have introduced an "HR locus" that belongs to a different disease
    entirely. Tracing the primary papers separates them cleanly: APMR1 maps to
    3q26.33-q27.3 with AHSG at 3q27.3; APMR2 maps to a distinct, non-overlapping
    3q26.2-q26.31 interval; APMR3 maps to chromosome 18q11.2-q12.2, nowhere near LSS; and
    LSS is at 21q22.3 and belongs to APMR4 only. Because the four forms have different
    genes on different chromosomes, they are separate diseases and the series is modelled
    as a Grouping over member Disease entries rather than as one Disease with
    has_subtypes.
  resolution_note: >-
    Resolved for this entry by curating APMR1 as its own Disease bound to MONDO:0021035
    and creating kb/groupings/Alopecia-Intellectual_Disability_Syndromes.yaml as the
    union over APMR1 and APMR4. APMR2 and APMR3 stay uncurated because they have no gene.
  evidence:
  - reference: PMID:16922726
    reference_title: "A novel locus for alopecia with mental retardation syndrome (APMR2) maps to chromosome 3q26.2-q26.31."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The linkage interval of the APMR locus identified here does not overlap with the one described previously; therefore, this locus has been designated as APMR2."
    explanation: Establishes APMR2 as a locus distinct from and non-overlapping with APMR1.
  - reference: PMID:33881165
    reference_title: "Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "while the remaining two uncharacterized loci, that is, APMR2 and APMR3, are reported in the Pakistani population"
    explanation: Confirms APMR2 and APMR3 have no assigned gene, so neither can be curated as a Disease.

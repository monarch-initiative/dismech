name: Alopecia-Intellectual Disability Syndrome 1
synonyms:
- APMR1
- Alopecia with mental retardation syndrome 1
- AHSG-related alopecia-intellectual disability syndrome
- Alopecia-intellectual disability syndrome type 1
creation_date: '2026-08-26T09:00:00Z'
category: Mendelian
description: >
  Alopecia-intellectual disability syndrome 1 (APMR1; OMIM #203650) is a very rare
  autosomal recessive neuroectodermal syndrome combining total or partial absence of
  hair from the scalp and other body sites with variable intellectual disability. The
  APMR1 locus was mapped by genome-wide linkage to chromosome 3q26.33-q27.3 in a
  large consanguineous Pakistani kindred, and a homozygous AHSG missense variant
  (NM_001622:c.950G>A, p.Arg317His) segregating in a large consanguineous family with
  seven affected members subsequently identified AHSG — alpha-2-HS-glycoprotein, the
  gene encoding the plasma glycoprotein fetuin-A — as the causal gene. AHSG maps to
  3q27.3, inside the original linkage interval.

  The mechanism connecting fetuin-A to hair and brain development is not established.
  Fetuin-A's best-characterised roles — systemic inhibition of ectopic calcification
  and antagonism of TGF-beta/BMP family signalling — do not obviously predict this
  phenotype, and the Ahsg-null mouse is reported as phenotypically normal apart from
  ectopic calcification on a mineralising diet. This entry therefore models the
  proximal molecular lesion as established and the route from it to alopecia and
  intellectual disability as an explicitly hypothetical TGF-beta-antagonism model,
  flagged with a HUMAN_MODEL_MISMATCH discussion.

  APMR1 is one of four numbered forms in the alopecia-intellectual disability syndrome
  (APMR) series (MONDO:0008756). Only two are molecularly characterised — APMR1 (AHSG,
  3q27.3) and APMR4 (LSS, 21q22.3, curated at
  kb/disorders/Alopecia-Intellectual_Disability_Syndrome_4.yaml) — while the APMR2
  (3q26.2-q26.31) and APMR3 (18q11.2-q12.2) loci remain uncharacterised. Because the
  numbered forms are separate diseases with different genes on different chromosomes
  rather than a single-gene severity spectrum, the series is modelled as a Grouping
  (kb/groupings/Alopecia-Intellectual_Disability_Syndromes.yaml) over the member
  Disease entries, NOT as one umbrella Disease with has_subtypes.

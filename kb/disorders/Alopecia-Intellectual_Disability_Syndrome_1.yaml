  rate_per_100000: 0.1
  notes: >-
    The estimate is for the APMR group as a whole, not for APMR1 specifically. APMR1
    itself is documented in a small number of consanguineous kindreds (predominantly
    Pakistani and Iranian) rather than by any formal epidemiological study.
  evidence:
  - reference: PMID:33881165

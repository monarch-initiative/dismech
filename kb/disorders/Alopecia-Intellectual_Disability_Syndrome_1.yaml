discussions:
- discussion_id: apmr1_ahsg_gene_validity
  prompt: Which functional change connects AHSG p.Arg317His to alopecia and intellectual disability?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic AHSG Missense Variant
  - genetic#AHSG
  rationale: >-
    The association is supported by one extensively segregating family, positional concordance and altered
    protein migration. The reviewed evidence does not determine whether the variant changes processing,
    ligand antagonism, cell migration or another function. ClinVar submissions and later reviews are
    not independent mechanistic replication. The historical linkage family was unresolved at gene level.
  evidence:
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we present whole-exome sequencing results of a large consanguineous family segregating APMR syndrome with seven affected family members.
    explanation: >-
      Defines the reported association.
    quote_role: PRIMARY_RESULT
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, the altered protein migrates with an aberrant size relative to healthy individuals.
    explanation: >-
      Defines the measured biochemical difference without assigning its mechanism.
    quote_role: PRIMARY_RESULT
- discussion_id: apmr1_ahsg_model_scope
  prompt: What do the AHSG-null observations establish about the APMR1 allele?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#AHSG
  - animal_models#Ahsg-null mouse
  rationale: >-
    Ahsg-null mice were assessed principally for calcification, not hair cycling or cognition. A separate
    nine-week-old infant with homozygous p.Lys2Ter and undetectable circulating fetuin-A had infantile
    cortical hyperostosis and was followed for one year. The authors explicitly described an association
    without experimental proof of ICH causation. Neither study provides dedicated negative hair or cognitive
    testing that rules out loss of function in APMR1 or establishes a neomorphic mechanism. Targeted
    allele-matched functional and developmental studies are needed.
  evidence:
  - reference: PMID:31288248
    reference_title: Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After 1 year of follow-up, the patient was completely well with no bone deformity and/or elevated inflammatory markers.
    explanation: >-
      Defines the limited clinical follow-up; no formal normal cognition or alopecia exclusion follows
      from this statement.
  - reference: PMID:31288248
    reference_title: Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our study has several limitations; we report only an association between fetuin-A deficiency and ICH phenotype, but no in vivo experiment was conducted in order to prove causation.
    explanation: >-
      The primary authors limit the disease-causation interpretation.
  - reference: PMID:31288248
    reference_title: Fetuin-A deficiency is associated with infantile cortical hyperostosis (Caffey disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By enzyme-linked immunosorbent assay (ELISA), we show a complete deficiency of this protein in the patient's serum, compared to controls.
    explanation: >-
      Directly establishes absent circulating protein in this separate infant case.
  - reference: PMID:12897203
    reference_title: The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taken together, our data demonstrate a critical role of Ahsg as an inhibitor of unwanted mineralization
    explanation: >-
      Identifies what the mouse experiments establish.
- discussion_id: apmr1_developmental_routes
  prompt: Do fetuin-A expression and keratinocyte migration explain the congenital hair and cognitive findings?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Alopecia of Scalp
  - phenotypes#Intellectual Disability
  rationale: >-
    Normal fetal plasma/CSF concentrations and skin-cell migration effects support developmental plausibility,
    but neither demonstrates a necessary role in human neocortical development or follicular placode
    formation. The primary keratinocyte study examined newborn foreskin and adult skin, not human fetal
    placode development. Its primary-cell and HaCaT responses to EGFR blockade differ. These observations
    motivate alternatives to the hair-cycle hypothesis without establishing an APMR1-specific route.
  evidence:
  - reference: PMID:7680865
    reference_title: alpha 2HS-glycoprotein is expressed at high concentration in human fetal plasma and cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The concentration of alpha 2HS-glycoprotein (alpha 2HS), a human homologue of the fetal protein fetuin, has been measured in plasma and cerebrospinal fluid (CSF) of fetuses from 14 to 37 weeks of gestation and in cord blood from newborn babies.
    explanation: >-
      Primary developmental concentration study; expression is not causal evidence of neocortical
      malformation.
  - reference: PMID:7680865
    reference_title: alpha 2HS-glycoprotein is expressed at high concentration in human fetal plasma and cerebrospinal fluid.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The levels were highest in both plasma and CSF in the younger fetuses, but even in the newborn the concentration of alpha 2HS in plasma was nearly twice the adult level.
    explanation: >-
      Defines the observed age-related concentration pattern.
  - reference: PMID:19758338
    reference_title: 'Fetuin-A promotes primary keratinocyte migration: independent of epidermal growth factor receptor signalling.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, we found that in human newborn foreskin, a high level of fetuin-A protein is detected throughout the dermis.
    explanation: >-
      Identifies the actual human tissue and stage studied.
  - reference: PMID:19758338
    reference_title: 'Fetuin-A promotes primary keratinocyte migration: independent of epidermal growth factor receptor signalling.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fetuin-A significantly induces actin-rich protrusions in human primary keratinocytes.
    explanation: >-
      Provides a culture result rather than proof of placode formation.
- discussion_id: apmr1_locus_series_confusion
  prompt: Which gene or locus belongs to each numbered APMR form?
  kind: INTERPRETATION
  status: RESOLVED
  attaches_to:
  - disease#Alopecia-Intellectual Disability Syndrome 1
  rationale: >-
    APMR1 was mapped to 3q26.33-q27.3 and later associated with AHSG at 3q27.3. APMR2 is a non-overlapping
    chromosome 3 locus; APMR3 maps to chromosome 18; LSS-related APMR4 maps to chromosome 21. Findings
    from the different families require their own subtype and gene attribution.
  resolution_note: The entry retains APMR1 as a distinct disease and the existing APMR grouping. Unidentified genes do not prevent disease curation, and the numbered forms are not all on different chromosomes.
  evidence:
  - reference: PMID:16922726
    reference_title: A novel locus for alopecia with mental retardation syndrome (APMR2) maps to chromosome 3q26.2-q26.31.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The linkage interval of the APMR locus identified here does not overlap with the one described previously; therefore, this locus has been designated as APMR2.
    explanation: >-
      Separates the two chromosome 3 loci.
  - reference: PMID:33881165
    reference_title: 'Alopecia-mental retardation syndrome: Molecular genetics of a rare neuro-dermal disorder.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Among them, AHSG was reported in a consanguineous Iranian family and LSS gene in a Swiss origin family, while the remaining two uncharacterized loci, that is, APMR2 and APMR3, are reported in the Pakistani population.
    explanation: >-
      Review of the distinct gene/locus assignments.
    quote_role: REVIEW_SYNTHESIS

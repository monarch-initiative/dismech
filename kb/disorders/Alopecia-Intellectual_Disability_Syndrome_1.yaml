inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive inheritance is supported by consanguineous pedigrees. In the AHSG-associated
    Iranian family, affected relatives were homozygous for p.Arg317His and the variant segregated with
    the disorder. The earlier Pakistani family established the APMR1 linkage interval without identifying
    its causal variant.
  evidence:
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Alopecia with mental retardation syndrome (APMR) is a very rare autosomal recessive condition that is associated with total or partial absence of hair from the scalp and other parts of the body as well as variable intellectual disability.
    explanation: States both the recessive inheritance pattern and the cardinal two-component phenotype.
    quote_role: BACKGROUND
  - reference: PMID:28054173
    reference_title: Association of AHSG with alopecia and mental retardation (APMR) syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we present whole-exome sequencing results of a large consanguineous family segregating APMR syndrome with seven affected family members.
    explanation: Segregation across seven affected members of one consanguineous kindred is the basis for the recessive model.
    quote_role: PRIMARY_RESULT
  - reference: PMID:16273389
    reference_title: Localization of a novel locus for alopecia with mental retardation syndrome to chromosome 3q26.33-q27.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A large seven-generation Pakistani family (Fig. 1), segregating an autosomal recessive form of APMR syndrome, was ascertained in which four males and three females were affected.
    explanation: >-
      Documents the seven affected relatives in the original linkage family.
mechanistic_hypotheses:
- hypothesis_group_id: fetuin_tgfb_antagonism_model
  hypothesis_label: Reduced fetuin-A antagonism of hair-cycle TGF-beta signaling
  status: EMERGING
  description: >-
    This candidate model links a possible reduction in fetuin-A antagonism to excessive TGF-beta2 activity
    and premature follicular catagen. It is an inference from biochemical binding experiments and human
    follicle organ culture, not an observed effect of p.Arg317His. Neither mutant TGF-beta binding nor
    excess pathway activity or premature catagen was measured in APMR1. Adult follicle cycling also
    does not directly explain failure to establish hair at birth. This model addresses the hair phenotype
    only; fetal fetuin-A expression does not establish a TGF-beta-dependent route to intellectual disability.
  evidence:
  - reference: PMID:12060393
    reference_title: Involvement of transforming growth factor-beta2 in catagen induction during the human hair cycle.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In the presence of the antibody as well as fetuin, hair follicles were markedly elongated in a concentration-dependent manner.
    explanation: >-
      Supports the candidate hair-cycle mechanism in non-APMR1 organ culture.
    directness: INDIRECT

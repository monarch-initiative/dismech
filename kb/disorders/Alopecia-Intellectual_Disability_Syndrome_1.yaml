animal_models:
- name: Ahsg-null mouse
  species: Mouse
  genotype: Ahsg-/- (targeted null)
  background: C57BL/6 and DBA/2
  publication: PMID:12897203
  description: >-
    Constitutive Ahsg-null mice were studied for ectopic mineralization. Severe systemic calcification
    depended strongly on DBA/2 genetic background or a mineral/vitamin-D challenge, while the mixed
    or C57BL/6 background had less marked spontaneous disease. The study did not perform targeted follicle,
    hair-cycle or cognitive testing and is not a matched p.Arg317His APMR1 model.
  genes:
  - preferred_term: AHSG
    term:
      id: hgnc:349
      label: AHSG
  evidence:
  - reference: PMID:12897203
    reference_title: The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Ahsg-deficient mice are phenotypically normal, but develop severe calcification of various organs on a mineral and vitamin D-rich diet and on a normal diet when the deficiency is combined with a DBA/2 genetic background.
    explanation: >-
      Captures the background- and exposure-dependent mineralization phenotype; it supplies no dedicated
      hair or cognitive assessment.
  - reference: PMID:12897203
    reference_title: The serum protein alpha 2-Heremans-Schmid glycoprotein/fetuin-A is a systemically acting inhibitor of ectopic calcification.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These mice in the untreated state have no obvious abnormalities, but alizarin red staining of skeletal preparations revealed the existence of soft-tissue calcification in some female Ahsg-deficient ex-breeders.
    explanation: >-
      The reported baseline assessment is general and already includes subtle mineralization.
  notes: >-
    A general description of untreated mice as having no obvious abnormalities is not a measured negative
    result for alopecia or intellectual disability. These data establish fetuin-A mineralization biology
    without choosing among possible APMR1 mechanisms.

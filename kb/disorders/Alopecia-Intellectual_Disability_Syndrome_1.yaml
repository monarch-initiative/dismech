      label: Autosomal recessive inheritance
  description: >
    APMR1 segregates as an autosomal recessive trait in large consanguineous kindreds.
    Affected individuals in the AHSG-solved family are homozygous for p.Arg317His and
    the variant falls within runs of homozygosity; heterozygous carriers are
    unaffected.
  evidence:

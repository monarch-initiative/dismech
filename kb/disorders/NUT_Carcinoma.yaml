notes: >-
  The two phenotypes carry no ontology binding, and the reason is the slot's two halves. HPO has no
  term for nodal involvement or distant metastasis: searches of the HP branch for metasta, metastatic,
  tumor spread and invasion return only Metastatic angiosarcoma, a different disease, and the nearest
  lymph-node terms describe enlargement or altered morphology, which is not what nodal involvement by
  tumour means - a node can be involved without being enlarged. MONDO is the other half of the slot
  and does have candidates, MONDO:0005438 metastatic malignant neoplasm in the lymph nodes and
  MONDO:0024880 metastatic malignant neoplasm, both of which would validate. They are declined
  deliberately: the entries that bind MONDO in a phenotype slot do so for a comorbid distinct disease,
  whereas a metastasis is this same tumour in another site, so binding one would assert a separate
  disease entity. The precedent for leaving such a row unbound is Alveolar_Rhabdomyosarcoma, whose
  Metastatic Disease and Regional Nodal Disease phenotypes both carry a preferred term and no binding.
  The practice is not uniform: Ewing_Sarcoma binds its own Metastatic Disease phenotype to HP:0002664
  Neoplasm, which is a coarse term and would need a coarse_binding_basis here.


  Beyond those two, no cached source gives a presenting symptom list - the one list the
  research report quotes comes from a full text that is not cached - and the entry does not invent one
  from the sites involved.


  Two things worth keeping straight when reading the pathophysiology. First, the two cached readings of
  what the fusion does to acetylation look contradictory and are not: bulk acetylation falls while the
  megadomains are hyperacetylated, and both are cited on the node that records them. Second, the mechanism
  is not BRD4-specific. A variant-fusion study found NSD3-NUT necessary and sufficient for the differentiation
  block, so the nodes are written for the entity rather than for the common partner.


  The three prognostic strata are recorded with a cached disagreement attached. A 40-patient head and
  neck series found no association between fusion type and outcome, and head and neck sits inside the
  nonthoracic group where the registry's A versus B split lives, so the two bear on the same comparison.
  Both are recorded; neither settles it.
review_notes: >-
  Every ontology identifier here was read from the local MONDO, NCIT or HGNC build, or from the committed
  CL and GO caches, in the step the line was written. MONDO's canonical label for MONDO:0005563 is the
  superseded name, nut midline carcinoma; it is copied exactly into the binding, and NUT Carcinoma is
  used as the entry name because MONDO itself carries it as an exact synonym of that class, alongside
  NUT Midline carcinoma and NMC. The entry name is therefore MONDO's own term rather than a curator's
  preference, and the stale canonical label is a candidate MONDO term request rather than something to
  correct here.



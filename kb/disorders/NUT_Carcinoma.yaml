animal_models:
- name: Brd4::Nutm1 syntenic translocation mouse
  species: Mouse
  genotype: Brd4::Nutm1 fusion formed by a syntenic mouse t(2;17) chromosome translocation
  publication: PMID:38724194
  genes:
  - preferred_term: Brd4
    term:
      id: MGI:1888520
      label: Brd4
  - preferred_term: Nutm1
    term:
      id: MGI:2661384
      label: Nutm1
  description: >-
    The first genetically engineered mouse for this disease. The fusion is made by engineering the
    mouse t(2;17) translocation syntenic to the human t(15;19), rather than by expressing the fusion
    from a transgene - which matters here, because the report says the model was needed precisely
    because ectopic expression of the fusion is cytotoxic in cell lines.
  modeled_mechanisms:
  - target: NUTM1 Rearrangement
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model reproduces the lesion this node records, and shows it is sufficient to start the
      disease in a whole animal.
    limitations: >-
      The fusion is formed by the mouse syntenic t(2;17), not the human t(15;19), and only the BRD4
      partner is modelled - the report covers no BRD3 or NSD3 fusion, so it says nothing about
      the two partners this entry curates separately.
    evidence:
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we report the first genetically engineered mouse model for NUT carcinoma that
        recapitulates the human t(15;19) chromosome translocation in mice.
      explanation: >-
        The authors' own word for what the model does to the human lesion, which is why this link is
        RECAPITULATES rather than a weaker value.
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrated that the mouse t(2;17) syntenic chromosome translocation, forming the
        Brd4::Nutm1 fusion gene, could induce aggressive carcinomas in mice.
      explanation: >-
        The sufficiency half of this link's description, which the sentence above does not carry: the
        engineered translocation produces tumours. It also names the syntenic t(2;17) that the
        limitations distinguish from the human t(15;19).
  - target: Block to Squamous Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The mouse tumours are poorly differentiated and carry areas of squamous differentiation and
      keratinization in variable proportion, which is the human pattern this node records - a block
      to complete squamous differentiation rather than an absence of it. Fifty mouse tumours were
      scored for that by a veterinary pathologist.
    limitations: >-
      The scoring covers head-and-neck and skin tumours, the sites a basal-keratinocyte Cre driver
      produces, so the squamous reading is strongest where the driver put the tumour. Whether the
      same holds at the mediastinal and other midline sites this disease occupies in people is not
      addressed.
    evidence:
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The tumors present histopathological and molecular features similar to human NC, with
        enrichment of undifferentiated cells.
      explanation: >-
        The general statement of similarity to human NC, carrying the undifferentiated-cell
        enrichment that is the block half of this node. INDIRECT on its own because it names no
        lineage; the two items below supply that.
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, a board-certified veterinary pathologist scored 50 cases of mouse NC arising in
        the head-and-neck and skin sites and concluded that the mouse NCs present a wide range of
        degrees of squamous cell differentiation (Fig 2B), recapitulating the human pattern.
      explanation: >-
        The lineage half, scored across fifty tumours, with the authors' own word for the comparison.
        This is why the link is RECAPITULATES rather than a weaker value.
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Many tumors exhibit areas of squamous cell differentiation and keratinization that occupy
        variable proportions of the tumor
      explanation: >-
        The histological form the block takes: squamous differentiation and keratinization in
        patches rather than throughout, which is what a partial block looks like.
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The consistent induction of poorly differentiated carcinoma demonstrated a strong
        reprogramming activity of BRD4::NUTM1.
      explanation: >-
        The consistency half of the claim: the model produced poorly differentiated carcinoma
        consistently, which the authors read as strong reprogramming activity of the fusion.
        INDIRECT because poorly differentiated names no lineage; that the blocked differentiation is
        squamous comes from the items above.
- name: Sox2 conditional deletion in the NUT carcinoma mouse
  species: Mouse
  genotype: Lineage-specific conditional deletion of Sox2 in a genetically engineered NUT carcinoma model
  publication: PMID:41266112
  description: >-
    Recorded separately from the model above rather than as a second arm of it. Its own report says
    only that it used a genetically engineered mouse model that faithfully recapitulates human NC; it
    does not name the strain and does not cite the model above, so treating the two as one would
    assert an identity no cited source states. This repository's deep-research report for the disease
    does assert they are one strain, which is a lead rather than a source, and is the thing to settle
    before these two records are ever merged.
  modeled_mechanisms:
  - target: MYC, TP63 and SOX2 Transcription Factor Activation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A lineage-specific deletion of one of the three transcription factors this node names, which is
      a manipulation of the node rather than a reproduction of it. The result is that the SOX2 limb is
      not required for the disease to start or progress.
    limitations: >-
      Only SOX2 was deleted. MYC and TP63 remained expressed in the SOX2-deficient tumours, so the
      experiment tests one of the node's three limbs and leaves the other two untouched.
    readouts:
    - name: Histology and oncogenic driver expression in SOX2-deficient tumours
      target: MYC, TP63 and SOX2 Transcription Factor Activation
      direction: UNCHANGED
      interpretation: >-
        Tumours still formed, kept their histology, and kept expressing BRD4::NUTM1, MYC and TP63. A
        real negative result, and the basis for calling SOX2 dispensable here. The direction applies
        to those readouts and not to the node as a whole: SOX2 is one of the three transcription
        factors this node binds, and in this model it is deleted rather than unchanged.
      evidence:
      - reference: PMID:41266112
        reference_title: SOX2 is a dispensable modulator of NUT carcinoma oncogenesis in mice.
        supports: SUPPORT
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that SOX2 is dispensable for NC initiation and progression, and that tumors lacking
          SOX2 retain characteristic histological features and expression of key oncogenic drivers,
          including BRD4::NUTM1, MYC, and TP63.
        explanation: >-
          States the measurement and its direction: the readouts were retained rather than lost.
    evidence:
    - reference: PMID:41266112
      reference_title: SOX2 is a dispensable modulator of NUT carcinoma oncogenesis in mice.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Using a genetically engineered mouse model that faithfully recapitulates human NC, we performed
        lineage-specific conditional deletion of Sox2 in both squamous and non-squamous tissues during
        NC oncogenesis.
      explanation: >-
        Establishes that the model manipulates this node, which is what a PERTURBS link claims.
discussions:
- discussion_id: nut_tf_requirement
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Of the three transcription factors this entry records as megadomain targets, which are actually
    required for the tumour, and required for what?
  rationale: >-
    SOX2 had been proposed as a critical driver, and a conditional deletion in vivo found it
    dispensable for initiation and progression; the paper states that twice without qualification.
    One of its sentences is narrower, saying the findings challenge the assumption that SOX2 is
    universally required, and the deletions were lineage-specific. Reading a context-dependent
    requirement as still open is therefore this entry's inference from the design, not a scoping the
    authors state.
    MYC and TP63 remained expressed in those tumours, which means the same experiment tested neither:
    whether either is individually required is open, and no cited source has deleted them.
  attaches_to:
  - pathophysiology#MYC, TP63 and SOX2 Transcription Factor Activation
  evidence:
  - reference: PMID:41266112
    reference_title: SOX2 is a dispensable modulator of NUT carcinoma oncogenesis in mice.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings challenge the assumption that SOX2 is universally required for NC oncogenesis and
      highlight the autonomy of BRD4::NUTM1 in establishing and maintaining the NC phenotype.
    explanation: >-
      The narrowest of this paper's three statements about SOX2, and the reason the question is
      recorded as open rather than closed. Elsewhere it says dispensable without qualification; here
      it says the assumption of universal requirement is challenged. Reading the gap off the narrower
      sentence is this entry's choice, and the rationale says so.
  - reference: PMID:41266112
    reference_title: SOX2 is a dispensable modulator of NUT carcinoma oncogenesis in mice.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: However, its role in NC initiation and progression has not been investigated in vivo.
    explanation: >-
      The gap as the same paper stated it before closing half of it. Recorded because it establishes
      that the question was open and that in vivo deletion is what settles it, which is exactly what
      MYC and TP63 still lack.


      a disagreement from a small series, not as a disconfirmation.
- name: Radiotherapy
  description: >-
    Initial radiotherapy was the other independent predictor in the same analysis. In a review that
    pooled published case reports of primary pulmonary NUT carcinoma, the patients given first-line
    chemoradiotherapy had a mean survival of 13.2 months among the six of eight whose survival was
    recorded, against 5.58 months for chemotherapy alone, a mean over 13 of the 16 so treated, which
    the chemotherapy row quotes, and the review concludes that the disease is sensitive to
    radiotherapy and that chemoradiotherapy was the most efficient regimen. That comparison is of
    means across case reports, and the cached text gives no test of it.

- name: BET bromodomain inhibition
  description: >-
    The mechanism-directed approach. Three agents have cached clinical data in this disease, all early
    phase and all modest: two of four compassionate-use patients responded to OTX015; four of nineteen
    reached a confirmed or unconfirmed partial response on molibresib; two of eight on RO6870810. A consensus
    review grades first-generation BET inhibitors as modestly effective in a minority of cases, with a
    narrow therapeutic window.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: NUTM1 Rearrangement
    treatment_effect: INHIBITS
    description: >-
      The node records the fusion protein's bromodomain-mediated chromatin binding as its molecular
      function, and that is what this drug class blocks. The link is to the lesion node because the
      drug acts on the fusion protein itself rather than on anything downstream of it.
    evidence:
    - reference: PMID:26976114
      reference_title: >-
        Clinical Response of Carcinomas Harboring the BRD4-NUT Oncoprotein to the Targeted Bromodomain
        Inhibitor OTX015/MK-8628.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We present the first clinical proof-of-concept that targeting BRD4-NUT with a BET inhibitor
        results in impressive and rapid antitumor activity in NMC.
      explanation: >-
        Names BRD4-NUT as what the drug targets, which is what makes this a mechanism link rather than
        an outcome association.
  - target: Block to Squamous Differentiation
    treatment_effect: INHIBITS
    description: >-
      The drug releases the block, so it inhibits the node rather than restoring it - the node is the
      block, not the differentiation. Shown in cell lines, and in a variant-fusion line rather than a
      BRD4-NUT one, which is why this is in vitro evidence and not clinical.
    evidence:
    - reference: PMID:24875858
      reference_title: >-
        NSD3-NUT fusion oncoprotein in NUT midline carcinoma: implications for a novel oncogenic mechanism.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        NSD3-NUT binds to BRD4, and BRD bromodomain inhibitors induce differentiation and arrest
        proliferation of 1221 cells.
      explanation: >-
        The differentiation result the link claims, in the one cached source that states it for this
        drug class. The cells carry an NSD3-NUT fusion, so the effect is not BRD4-partner-specific.
  evidence:
  - reference: PMID:26976114
    reference_title: >-
      Clinical Response of Carcinomas Harboring the BRD4-NUT Oncoprotein to the Targeted Bromodomain Inhibitor
      OTX015/MK-8628.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

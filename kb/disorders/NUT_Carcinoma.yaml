    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No statistically significant associations were found between OS and clinicopathological
      features, including age (p = 0.14), sex (p = 0.39), tumor size (p = 0.65), AJCC stage (p =
      0.55), treatment modality (p = 0.47), and NUTM1 fusion partner (p = 0.16).
    explanation: >-
      A small series that found no statistically significant survival difference by treatment
      modality. Indirect: it tested treatment modality as a whole rather than the extent of
      resection, and does not say how it grouped treatment for the test; every one of its 18

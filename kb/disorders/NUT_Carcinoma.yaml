differential_diagnoses:
- name: SMARCB1 (INI-1)-deficient sinonasal carcinoma
  description: >-
    A SWI/SNF-deficient sinonasal carcinoma that overlaps this tumour morphologically and is
    separated from it by the stain this entry already records. The histopathology row notes that
    INI1 was retained in every case of the 57-case series; INI1 is SMARCB1's protein product, so
    retention is what excludes a SMARCB1-deficient tumour.
  distinguishing_features:
  - Loss of SMARCB1 (INI-1) nuclear expression, where this tumour retains it in every case of the cited series.
  - A variable squamous immunophenotype is shared rather than discriminating. The cited review
    contrasts it with the SMARCA4-deficient tumours, not with this entity, and a source cited on the
    squamous cell carcinoma row below argues that this entity is itself a squamous cell carcinoma.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: BRG1 and INI1 were retained in all cases.
    explanation: The retention that does the separating, in every case assessed.
  - reference: DOI:10.1007/s12105-022-01416-x
    reference_title: >-
      Proceedings of the North American Society of Head and Neck Pathology, Los Angeles, CA, March
      20, 2022: SWI/SNF-deficient Sinonasal Neoplasms: An Overview
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Identification and precise classification of these entities and separating them from SNUC, NUT
      carcinoma and other poorly differentiated neoplasms of epithelial melanocytic, hematolymphoid
      or mesenchymal origin is mandatory for appropriate prognostication and tailored therapies.
    explanation: >-
      Names this tumour among the entities the SWI/SNF-deficient sinonasal carcinomas must be
      separated from, which is what makes this a differential rather than an incidental neighbour.
  notes: >-
    No disease_term. Searched the same MONDO build for SMARCB1 and for INI1 across labels and
    synonyms: the only SMARCB1-deficient carcinoma class is MONDO:0100534 SMARCB1-deficient kidney
    medullary carcinoma, a different site, and INI1 matches no MONDO class at all. The three
    sinonasal labels are MONDO:0002831, MONDO:0006411 and a non-human-animal chondrosarcoma. MONDO
    has no class for this entity, which is the gap Sinonasal_Undifferentiated_Carcinoma also
    records on its own row.
- name: SMARCA4-deficient undifferentiated thoracic tumour
  description: >-
    The mimic the cited immunohistochemistry series names first among its own diagnostic challenges,
    and the one the retained BRG1 stain excludes - BRG1 being SMARCA4's protein product.
  distinguishing_features:
  - Loss of BRG1 (SMARCA4) nuclear expression, where this tumour retains it in every case of the cited series.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic challenges include morphologic overlap with poorly differentiated squamous cell
      carcinoma, small cell carcinoma, thoracic SMARCA4-deficient undifferentiated tumor, and other
      small round blue cell tumors.
    explanation: >-
      The series' own list of what this tumour is confused with, and the source of three of the rows
      in this block.
  disease_term:
    preferred_term: thoracic SMARCA4-deficient undifferentiated tumour
    term:
      id: MONDO:0018761
      label: SMARCA4-deficient sarcoma of thorax
  notes: >-
    The SWI/SNF review cited on the SMARCB1 row is deliberately not cited here. Its immunophenotype
    sentence opens "These different tumor types", whose antecedent is the four SWI/SNF-driven
    sinonasal types it has just listed, so its SMARCA4-related counterparts are the sinonasal
    SMARCA4 entities rather than this thoracic one. Citing it here would attribute to the thoracic
    tumour a phenotype the source states of different entities.

    MONDO names this entity under its older sarcoma name, and its NCIT cross-reference carries the
    name the cited series uses, so the bound label and the preferred term differ on purpose.
- name: NUT-rearranged sarcoma
  description: >-
    The differential that the entry's first-line test cannot settle. Nuclear NUT staining is what the
    diagnosis of this carcinoma requires, and it is also what the 2026 WHO classification reports for
    a mesenchymal tumour carrying NUTM1 fusions. So a positive NUT stain establishes a NUTM1-driven
    tumour and not which one, and the separation here is the lineage rather than the stain.
  distinguishing_features:
  - A malignant mesenchymal neoplasm with heterogeneous morphology, where this entity is a carcinoma.
  - Nuclear NUT staining is reported for both, so NUT immunohistochemistry does not separate them. The classification calls the sarcoma's staining uniform; no cited source uses that word of this carcinoma.
  evidence:
  - reference: PMID:42839882
    reference_title: >-
      The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      NUT-rearranged sarcoma | Malignant | Uncertain differentiation | NUT family (mainly NUTM1)
      rearrangement (various partners)
    explanation: >-
      The classification's own table row, carrying the entity, its malignancy and the NUTM1
      rearrangement in one self-contained string. The prose sentence names the entity and its
      mesenchymal lineage but stops before the fusion, which is the half this row rests on.
  - reference: PMID:42839882
    reference_title: >-
      The 2026 World Health Organization Classification of Tumors of Soft Tissue and Bone: 6th Edition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: Tumor cells typically display uniform nuclear staining for the NUT protein.
    explanation: >-
      The reason this row exists. The same stain this entry's diagnosis section requires is reported
      for a different NUTM1-driven tumour, so the stain is necessary for the diagnosis without being
      sufficient for it.
  notes: >-
    No disease_term. Searched the local MONDO build - release 2026-09-01, downloaded 2026-10-21 -
    rather than this repository's term cache, which holds only CURIEs something in kb/ has already
    bound. Labels and synonyms containing NUTM1 return one class, MONDO:0975864 B-lymphoblastic
    leukemia with NUTM1 rearrangement. Labels containing NUT return no carcinoma class but
    MONDO:0005563, which this entry holds, and two obsolete duplicates of it. NUT-rearranged, NUT
    sarcoma, BRD3 and NSD3 each return nothing, and nuclear protein in testis returns only
    MONDO:0005563's own synonym. MONDO has no sarcoma class for a NUTM1 rearrangement, which is
    unsurprising: the source cited on this row lists NUT-rearranged sarcoma among the tumour types
    included for the first time in the 2026 WHO volume.
- name: Poorly differentiated squamous cell carcinoma
  description: >-
    The commonest mimic, and the one this entry should be most careful about, because a cited source
    argues the two should not be separated at all: it proposes that this tumour be reclassified as a
    squamous cell carcinoma. On that reading the distinction is molecular rather than one of lineage,
    which is why no squamous marker appears in the distinguishing features below.
  distinguishing_features:
  - A NUTM1 rearrangement, which this entity is defined by and which squamous cell carcinoma does not carry.
  - Squamous markers do not separate them, and p40 is less sensitive than p63 in this entity, so a negative p40 does not exclude it.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic challenges include morphologic overlap with poorly differentiated squamous cell
      carcinoma, small cell carcinoma, thoracic SMARCA4-deficient undifferentiated tumor, and other
      small round blue cell tumors.
    explanation: Names this mimic first among the series' own diagnostic challenges.
  - reference: PMID:39900969
    reference_title: "Hiding in plain sight: NUT carcinoma is an unrecognized subtype of squamous
      cell carcinoma of the lungs and head and neck."
    supports: REFUTE
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Data emerging over the past two decades suggest that NUT carcinoma, a highly aggressive
      malignancy driven by a NUT fusion oncoprotein and arising in the lungs, head and neck, and
      rarely in other sites, is a squamous cell carcinoma (SCC) based on transcriptional,
      histopathological, cell-of-origin and molecular characteristics.
    explanation: >-
      Recorded as a refutation of this row's premise rather than left out: the cited argument is that
      this carcinoma is a subtype of squamous cell carcinoma rather than a separate entity, so a
      reader should not take this differential as settled nosology.
  disease_term:
    preferred_term: poorly differentiated squamous cell carcinoma
    term:
      id: MONDO:0005096
      label: squamous cell carcinoma
  notes: >-
    MONDO has no grade-qualified class, so the binding is the ungraded one and the grade is carried
    in the preferred term and the description. The cited series names the mimic without a site, so
    the siteless class is the right level rather than head and neck squamous cell carcinoma.
- name: Small cell carcinoma
  description: >-
    Named among the cited series' diagnostic challenges. The neuroendocrine markers that would settle
    it do not: the series reports INSM1 positivity in over half of its cases and calls it a pitfall.
  distinguishing_features:
  - TTF-1 was mostly negative in this entity, with focal positivity in about a quarter of cases assessed.
  - INSM1 does not separate them - it was positive in 54 per cent of the cases tested here, which the series itself calls a diagnostic pitfall.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: TTF-1 was mostly negative with focal positivity in 26% (10 of 38) of cases.
    explanation: The one marker in the series that points away from small cell carcinoma, with its figure.
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: INSM1 was positive in 54% (7 of 13) of cases, indicating a possible diagnostic pitfall.
    explanation: >-
      Supports the row rather than refuting it: a neuroendocrine marker positive in more than half
      the cases tested makes this differential harder, not less real, which is why the authors call
      it a pitfall. It cuts against the assumption that INSM1 discriminates, and this row does not
      make that assumption - its distinguishing feature says the opposite.
  disease_term:
    preferred_term: small cell carcinoma
    term:
      id: MONDO:0000402
      label: small cell carcinoma
  notes: >-
    Bound to the siteless class rather than to small cell lung carcinoma, which is its child. The
    cited series names small cell carcinoma without a site, and this tumour arises in the mediastinum
    and head and neck as well as the lung, so binding the lung class would assert a site the source
    does not.
- name: Sinonasal undifferentiated carcinoma
  description: >-
    Grouped with this tumour in the sinonasal differential by a review of the SWI/SNF-deficient
    carcinomas, which treats separating the two as a requirement rather than a refinement.
  distinguishing_features:
  - A NUTM1 rearrangement, absent from sinonasal undifferentiated carcinoma.
  - Oncogenic IDH2 mutations are characteristic of genuine sinonasal undifferentiated carcinoma.
    That is a positive feature of the other entity rather than a tested discriminator between the
    two. The sentence reporting their absence is about the four SWI/SNF-deficient sinonasal tumour
    types the review surveys, and this carcinoma is not one of them - the next sentence names it
    among the entities those four must be separated from. No cited source reports IDH2 status in
    this carcinoma.
  evidence:
  - reference: DOI:10.1007/s12105-022-01416-x
    reference_title: >-
      Proceedings of the North American Society of Head and Neck Pathology, Los Angeles, CA, March
      20, 2022: SWI/SNF-deficient Sinonasal Neoplasms: An Overview
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Identification and precise classification of these entities and separating them from SNUC, NUT
      carcinoma and other poorly differentiated neoplasms of epithelial melanocytic, hematolymphoid
      or mesenchymal origin is mandatory for appropriate prognostication and tailored therapies.
    explanation: Names both entities as things that must be told apart in the sinonasal tract.
  - reference: DOI:10.1007/s12105-022-01416-x
    reference_title: >-
      Proceedings of the North American Society of Head and Neck Pathology, Los Angeles, CA, March
      20, 2022: SWI/SNF-deficient Sinonasal Neoplasms: An Overview
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Notably, all studied cases lacked oncogenic IDH2 mutations characteristic of genuine SNUC.
    explanation: >-
      Sources the IDH2 half of the feature above, that the mutations are characteristic of genuine
      sinonasal undifferentiated carcinoma. The absence the same sentence reports is of the four
      SWI/SNF-deficient sinonasal tumour types, which do not include this carcinoma, so the sentence
      establishes no discriminator between the two entities and the feature says so.
  disease_term:
    preferred_term: sinonasal undifferentiated carcinoma
    term:
      id: MONDO:0006411
      label: sinonasal undifferentiated carcinoma

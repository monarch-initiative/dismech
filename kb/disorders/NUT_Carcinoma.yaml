- name: Recognition of the entity at all
  description: >-
    The commonest diagnostic failure is not a test result but not considering the diagnosis. Half
    the patients in one series were initially misdiagnosed, and in the NUT Carcinoma Registry 78%
    were first diagnosed as something other than NUT carcinoma. Under the microscope the tumour
    overlaps with poorly differentiated squamous cell carcinoma, small cell carcinoma, thoracic
    SMARCA4-deficient undifferentiated tumour and other small round blue cell tumours, and it can be
    morphologically indistinguishable from other poorly differentiated carcinomas.

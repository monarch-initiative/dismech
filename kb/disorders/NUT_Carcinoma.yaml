treatments:
- name: Surgical resection
  description: >-
    Extent of resection was an independent predictor of survival among the 54 patients with outcome
    data in the cached clinical database, and complete resection with negative margins in a registry
    series of 40 head and neck patients with outcome data. An 18-patient head and neck series found
    no statistically significant association between survival and treatment modality; every patient
    in it had radiotherapy, so its null result says nothing about radiotherapy itself, and it does
    not say how it grouped treatment for the test.
  treatment_term:

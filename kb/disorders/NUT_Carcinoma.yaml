name: NUT Carcinoma
creation_date: '2026-11-11T19:45:00Z'
categories:
- Carcinoma
- Molecularly Defined Tumor
parents:
- carcinoma
disease_term:
  preferred_term: NUT carcinoma
  term:
    id: MONDO:0005563
    label: nut midline carcinoma
description: >-
  A poorly differentiated carcinoma defined by rearrangement of NUTM1, arising mostly in adolescents and
  young adults and mostly in midline structures of the thorax and the head and neck. The fusion partner
  is BRD4 in most cases, BRD3 or NSD3 in most of the rest. The NUT half recruits and activates the histone
  acetyltransferase p300, and in BRD4-NUT - the only fusion any cached source has mapped - the complex
  builds megabase-scale hyperacetylated chromatin domains over a small, recurrent set of stem-cell transcription
  factors. The block to squamous differentiation is the one step a cached source demonstrates for a non-BRD4
  partner too. It is aggressive and is widely underdiagnosed.
synonyms:
- NUT midline carcinoma
- NMC
- NUTM1-rearranged carcinoma
pathophysiology:
- name: NUTM1 Rearrangement
  description: >-
    The defining lesion: a translocation fusing NUTM1 to a partner gene. BRD4 is the partner in about
    70 to 80 per cent of cases, BRD3 in 15 to 20 and NSD3 in about 6. The normal NUTM1 product is expressed
    only in testis, so the fusion puts a germ-cell protein under a ubiquitously expressed partner's control.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
  molecular_functions:
  - preferred_term: chromatin binding by the fusion protein's bromodomain half
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003682
      label: chromatin binding
  genes:
  - preferred_term: NUTM1
    term:
      id: hgnc:29919
      label: NUTM1
  - preferred_term: BRD4
    term:
      id: hgnc:13575
      label: BRD4
  - preferred_term: BRD3
    term:
      id: hgnc:1104
      label: BRD3
  - preferred_term: NSD3
    term:
      id: hgnc:12767
      label: NSD3
  downstream:
  - target: p300 Recruitment and Megadomain Formation
    description: The fusion protein brings a histone acetyltransferase onto chromatin.
    evidence:
    - reference: PMID:33452461
      reference_title: Supercharging BRD4 with NUT in carcinoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        BRD4-NUT combines the chromatin-binding bromo- and extraterminal domain-containing (BET) protein,
        BRD4, with an unstructured, poorly understood protein, NUT, which recruits and activates the histone
        acetyltransferase p300.
      explanation: >-
        Names both halves of the fusion and the acetyltransferase the NUT half recruits, which is this
        edge.
  evidence:
  - reference: PMID:35372003
    reference_title: 'NUT Carcinoma: Clinicopathologic Features, Molecular Genetics and Epigenetics.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUT carcinoma is defined by the presence of a NUTM1 (15q14) rearrangement with multiple other genes.
    explanation: That the rearrangement is what defines the entity.
  - reference: PMID:12543779
    reference_title: 'BRD4-NUT fusion oncogene: a novel mechanism in aggressive carcinoma.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we demonstrate that BRD4 is fused with nearly the entire transcript of the novel 15q13 gene,
      NUT (nuclear protein in testis), forming a 6.4-kb fusion oncogene, BRD4-NUT.
    explanation: The original description of the fusion.
  - reference: PMID:12543779
    reference_title: 'BRD4-NUT fusion oncogene: a novel mechanism in aggressive carcinoma.'
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUT, like BRD4, is predicted to encode a nuclear protein but, unlike the ubiquitous BRD4 transcript,
      is expressed only in testis.
    explanation: >-
      Why the fusion is neomorphic rather than a gain in an existing pathway: the NUT half is normally
      testis-restricted.
  - reference: PMID:32328562
    reference_title: >-
      An Anatomical Site and Genetic-Based Prognostic Model for Patients With Nuclear Protein in Testis
      (NUT) Midline Carcinoma: Analysis of 124 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had the BRD4-NUTM1 fusion (78%), followed by BRD3-NUTM1 (15%) and NSD3-NUTM1 (6%).
    explanation: The partner distribution in the largest cached registry cohort.
  - reference: PMID:24875858
    reference_title: >-
      NSD3-NUT fusion oncoprotein in NUT midline carcinoma: implications for a novel oncogenic mechanism.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: In 20% of cases, NUT is fused to uncharacterized non-BRD gene(s).
    explanation: >-
      That a fifth of cases carry a partner outside the BRD family, which bears on why a partner-targeted
      assay can miss a case that NUT immunohistochemistry catches.
  notes: >-
    The molecular function bound here is the chromatin binding the partner gene already has in its wild-type
    form, which is the pattern CLAUDE.md describes for a lesion node - classify the claim, not the gene.
    It is graded GAIN_OF_FUNCTION rather than INCREASED because the departure is qualitative: in the fusion
    that binding tethers NUT, and through it p300, to the sites the bromodomain reaches, which is not
    something the activity does outside the fusion. Only BRD4, BRD3 and NSD3 are named here. Rarer partners
    are reported in the literature but no source cached for this entry names one, so none is recorded.
    This node binds no cell type, and that is deliberate. Because it carries a somatic genetic_context,
    anything in its cell_types is read as the cell of origin by the derivation in design decisions 3d.
    No cached source identifies the cell the fusion arises in, so asserting one here would publish a claim
    the entry cannot support. The squamous binding records the lineage the tumour differentiates towards
    and has moved to the node that makes that claim, which leaves this entry reporting ORIGIN_WITHOUT_CELL
    - the honest answer to a question its sources do not settle.
- name: p300 Recruitment and Megadomain Formation
  description: >-
    The NUT half recruits and activates p300, and the complex builds contiguous hyperacetylated chromatin
    domains that reach two megabases. These megadomains are mostly lineage-specific, but three stem-cell
    transcription factors are targeted across tumours and tissues.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: p300 recruitment by the fusion protein
    term:
      id: GO:0035035
      label: histone acetyltransferase binding
  - preferred_term: p300 histone acetyltransferase activity
    modifier: INCREASED
    term:
      id: GO:0004402
      label: histone acetyltransferase activity
  genes:
  - preferred_term: EP300
    term:
      id: hgnc:3373
      label: EP300
  downstream:
  - target: Global Hypoacetylation with Local Hyperacetylation
    description: Acetylation is concentrated into the megadomains and depleted elsewhere.
    evidence:
    - reference: PMID:21447744
      reference_title: Differentiation of NUT midline carcinoma by epigenomic reprogramming.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        In both gain-of and loss-of-expression assays, we find that expression of BRD4-NUT is associated
        with globally decreased histone acetylation and transcriptional repression.
      explanation: >-
        The bulk depletion, measured both ways. Indirect for the edge because the experiment measures
        the global consequence rather than the redistribution.
  evidence:
  - reference: PMID:33452461
    reference_title: Supercharging BRD4 with NUT in carcinoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BRD4-NUT nuclear foci correspond with massive contiguous regions of chromatin co-enriched with BRD4-NUT,
      p300, and acetylated histones, termed "megadomains" (MD).
    explanation: What a megadomain is, and what it is co-enriched with.
  - reference: PMID:26220994
    reference_title: >-
      The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large topological
      domains.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      BRD4-NUT forms distinctive nuclear foci in patient tumors, which we found correlate with ∼100 unprecedented,
      hyperacetylated expanses of chromatin that reach up to 2 Mb in size.
    explanation: The foci in patient tumours and their size, from the study that mapped them.
  - reference: PMID:26220994
    reference_title: >-
      The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large topological
      domains.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Megadomains appear to originate from select pre-existing enhancers that progressively broaden but
      are ultimately delimited by topologically associating domain (TAD) boundaries.
    explanation: How a megadomain grows and what stops it, stated with the authors' own hedge.
  notes: >-
    Every cached result on this node is from BRD4-NUT. No cached source shows that a BRD3-NUT or NSD3-NUT
    fusion recruits p300 or builds megadomains, and the node is not written as though one did. What generalises
    is weaker and is cited on the edge below: p300 is recruited by the NUT half, which every fusion carries.
    The differentiation block is the one step a cached source does show for a non-BRD4 partner.
- name: Global Hypoacetylation with Local Hyperacetylation
  description: >-
    The two cached readings of what the fusion does to acetylation are not in conflict and both are recorded.
    Bulk histone acetylation falls and transcription is repressed, while the megadomains are hyperacetylated
    expanses. An entry quoting either alone would read as contradicting the other.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: redistribution of chromatin acetylation
    term:
      id: GO:0006325
      label: chromatin organization
  downstream:
  - target: MYC, TP63 and SOX2 Transcription Factor Activation
    description: The megadomains sit over a small recurrent set of transcription factor loci.
    evidence:
    - reference: PMID:33452461
      reference_title: Supercharging BRD4 with NUT in carcinoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Common targets of MDs across multiple NCs and tissues are three stem cell-related transcription
        factors frequently implicated in cancer: MYC, SOX2, and TP63.
      explanation: Names the three recurrent targets, which is this edge.
  evidence:
  - reference: PMID:21447744
    reference_title: Differentiation of NUT midline carcinoma by epigenomic reprogramming.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      In both gain-of and loss-of-expression assays, we find that expression of BRD4-NUT is associated
      with globally decreased histone acetylation and transcriptional repression.
    explanation: The global depletion.
  - reference: PMID:26220994
    reference_title: >-
      The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large topological
      domains.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      BRD4-NUT forms distinctive nuclear foci in patient tumors, which we found correlate with ∼100 unprecedented,
      hyperacetylated expanses of chromatin that reach up to 2 Mb in size.
    explanation: The local hyperacetylation, in the same tumours.
  notes: >-
    As with the node above, both cached readings are BRD4-NUT results and the node is not generalised
    past them. The process is bound to chromatin organization without a modifier, because the node's claim
    is a redistribution rather than a direction: bulk acetylation falls while the megadomains rise. An
    earlier version bound regulation of transcription by RNA polymerase II with modifier INCREASED, which
    named the wrong process and asserted the opposite of what this node's own first evidence item says,
    since that sentence reports transcriptional repression. GO:0016573 histone acetylation is obsolete,
    so no acetylation term was available.
- name: MYC, TP63 and SOX2 Transcription Factor Activation
  description: >-
    Three stem-cell transcription factors are the megadomain targets common across tumours and tissues.
    A mouse study found SOX2 dispensable for initiation and progression, so the three are not interchangeable
    in weight.
  biological_scale: CELLULAR
  genes:
  - preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  - preferred_term: TP63
    term:
      id: hgnc:15979
      label: TP63
  - preferred_term: SOX2
    term:
      id: hgnc:11195
      label: SOX2
  downstream:
  - target: Block to Squamous Differentiation
    description: The fusion protein holds the cell in an undifferentiated state.
    evidence:
    - reference: PMID:26220994
      reference_title: >-
        The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large topological
        domains.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        NMC is driven by the creation of a translocation oncoprotein, BRD4-NUT, which blocks differentiation
        and drives growth of NMC cells.
      explanation: States the differentiation block and the growth drive together.
  evidence:
  - reference: PMID:33452461
    reference_title: Supercharging BRD4 with NUT in carcinoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common targets of MDs across multiple NCs and tissues are three stem cell-related transcription
      factors frequently implicated in cancer: MYC, SOX2, and TP63.
    explanation: The three factors, and that they recur across tumours and tissues.
  - reference: PMID:41266112
    reference_title: SOX2 is a dispensable modulator of NUT carcinoma oncogenesis in mice.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that SOX2 is dispensable for NC initiation and progression, and that tumors lacking SOX2
      retain characteristic histological features and expression of key oncogenic drivers, including BRD4::NUTM1,
      MYC, and TP63.
    explanation: >-
      That the three factors are not interchangeable in weight: removing one leaves the tumour's histology
      and its other drivers intact.
- name: Block to Squamous Differentiation
  description: >-
    The defining cellular consequence. Releasing the block is what the targeted agents aim at: both bromodomain
    inhibition and histone deacetylase inhibition induce differentiation in cell lines. A variant-fusion
    study found its own fusion necessary and sufficient for the block, so this is not a BRD4-only mechanism.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: squamous epithelial cell differentiation
    modifier: DECREASED
    term:
      id: GO:0030855
      label: epithelial cell differentiation
  evidence:
  - reference: PMID:26220994
    reference_title: >-
      The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large topological
      domains.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: >-
      NMC is driven by the creation of a translocation oncoprotein, BRD4-NUT, which blocks differentiation
      and drives growth of NMC cells.
    explanation: The block, named as what drives the disease.
  - reference: PMID:24875858
    reference_title: >-
      NSD3-NUT fusion oncoprotein in NUT midline carcinoma: implications for a novel oncogenic mechanism.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      We find that NSD3-NUT is both necessary and sufficient for the blockade of differentiation and maintenance
      of proliferation in NMC cells.
    explanation: >-
      That a non-BRD4 fusion produces the same block, which is why the node is written for the entity
      rather than for one partner.
  - reference: PMID:21447744
    reference_title: Differentiation of NUT midline carcinoma by epigenomic reprogramming.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: >-
      Bulk chromatin acetylation can be restored by treatment of NMC cells with histone deacetylase inhibitors
      (HDACi), engaging a program of squamous differentiation and arrested growth in vitro that closely
      mimics the effects of siRNA-mediated attenuation of BRD4-NUT expression.
    explanation: That releasing the block is achievable in vitro, and by what.
  - reference: PMID:38724194
    reference_title: Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We demonstrated that the mouse t(2;17) syntenic chromosome translocation, forming the Brd4::Nutm1
      fusion gene, could induce aggressive carcinomas in mice.
    explanation: That the fusion is sufficient to initiate the tumour in a whole animal.
  cell_types:
  - preferred_term: squamous epithelial cell
    term:
      id: CL:0000076
      label: squamous epithelial cell
  notes: >-
    GO has no squamous-specific differentiation term - the one class matching squamous is a prostate-development
    term - so epithelial cell differentiation is the most specific accurate binding and the preferred_term
    carries the rest. Keratinocyte differentiation would over-reach: this entry's own histopathology records
    keratin entirely negative in 8 of 55 cases assessed.
phenotypes:
- name: Regional lymph node involvement
  category: Neoplastic
  description: >-
    Nodal spread is usual at presentation: nine of the twelve patients in the cached multicentre
    series had it. No ontology term is bound; the entry-level notes say why.
  phenotype_term:
    preferred_term: regional lymph node involvement
  evidence:
  - reference: PMID:28643357
    reference_title: >-
      NUT carcinoma in children and adults: A multicenter retrospective study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Nine patients presented regional lymph node involvement and eight distant metastases.
    explanation: >-
      The count for this row, out of the twelve patients the same abstract gives as the series size.
- name: Distant metastasis
  category: Neoplastic
  description: >-
    Eight of the same twelve patients had distant metastases at presentation, which is the stage this
    disease is usually found at. No cached source attributes the short course to metastatic stage, so
    this row does not. No ontology term is bound; the entry-level notes say why.
  phenotype_term:
    preferred_term: distant metastasis
  evidence:
  - reference: PMID:28643357
    reference_title: >-
      NUT carcinoma in children and adults: A multicenter retrospective study.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Nine patients presented regional lymph node involvement and eight distant metastases.
    explanation: >-
      The distant-metastasis count, from the same sentence and the same twelve-patient series.
histopathology:
- name: Variable and sometimes absent keratin staining
  description: >-
    Keratin was entirely negative in 8 of the 55 cases in which it was assessed, in a 57-case immunohistochemistry
    series.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases
      With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Keratin stains showed variable positivity and were entirely negative in 15% (8 of 55) of
      cases.
    explanation: The finding and its frequency.
- name: p63 more sensitive than p40 for squamous lineage
  description: >-
    In the same series p40 was positive in 65 per cent of cases against p63's 87 per cent, so the two
    squamous markers are not interchangeable here.
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases
      With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      p40 was only positive in 65% (24 of 37) of cases, implying inferior sensitivity when compared to
      p63 (87% sensitivity, 20 of 23 cases) and other squamous cell markers.
    explanation: Both figures, with the authors' own reading that p40 is the less sensitive of the two.
- name: BRG1 and INI1 retained
  description: >-
    Retention separates this tumour from the SMARCA4-deficient undifferentiated thoracic tumour, which
    the cited series names in its own differential. No cached source mentions SMARCB1, so no claim is
    made about INI1's gene or about SMARCB1-deficient tumours.
  diagnostic: true
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases
      With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: BRG1 and INI1 were retained in all cases.
    explanation: Retention across every case of the series.
- name: High proliferation index
  description: Median Ki-67 of 60 per cent in the cached series.
  finding_term:
    preferred_term: high Ki-67 proliferation index
  evidence:
  - reference: PMID:38059551
    reference_title: >-
      Nuclear Protein in Testis (NUT) Carcinoma: A Comprehensive Immunohistochemical Analysis of 57 Cases
      With Consideration of Interpretation and Pitfall Recognition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: Ki-67 proliferative index was high (median, 60%).
    explanation: The figure.
  notes: >-
    NCIT does have Ki-67 terms inside the HistopathologyFindingTerm enum - 21 of them, reaching it through
    NCIT:C40998 Immunophenotypic Finding - but every one is a threshold predicate such as Ki-67 Positive
    Cells Greater than or Equal to 50 Percent. The cited series gives a median of 60 per cent, and a threshold
    term would assert that every case cleared it, which the source does not say. The one NCIT term that
    names the concept itself, Ki-67 Labeling Index, sits outside the enum under Quantitative Concept.
    So nothing is bound here: the free-text preferred term carries the finding and the median figure is
    in the description. An earlier version of this row bound Increased Mitotic Activity as the
    least-bad in-enum option; that was wrong, because a Ki-67 index counts nuclei positive across the
    cycle while a mitotic count counts figures in M phase only.

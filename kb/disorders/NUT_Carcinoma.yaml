- name: Rapidly Enlarging Primary Mass
  description: >-
    The tumour presents as a rapidly growing mass, which Orphanet says usually arises along the
    midline. In the NUT Carcinoma Registry, 64% of patients had a thoracic primary and 33% a head
    and neck primary. A review of published pulmonary cases names rapid enlargement of the mass
    among the signs that should raise the diagnosis. Orphanet puts the presenting symptoms down to
    the mass's effect where it sits, and in the registry 32% of patients with a non-thoracic primary
    presented with swelling or a palpable mass, at a site the sentence does not give. The edge into
    this node rests on cell and mouse studies; none measures the mass in a patient.
  biological_scale: TISSUE
  evidence:
  - reference: ORPHA:443167
    reference_title: "NUT midline carcinoma"
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      A rare tumor characterized by a rapidly growing mass usually arising along the midline
    explanation: >-
      The definition: a rapidly growing mass, usually along the midline.
  - reference: PMID:41348986
    reference_title: >-
      Presenting Features and Causes of Diagnostic Delays: A Report From the NUT Carcinoma Registry.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 64% of patients had a thoracic primary and 33% had a head and neck primary.
    explanation: >-
      The registry's shares of thoracic and head and neck primaries. Indirect: it gives the sites,
      not the mass's growth.
  - reference: PMID:36290813
    reference_title: >-

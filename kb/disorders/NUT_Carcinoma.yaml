diagnosis:
- name: NUT immunohistochemistry
  description: >-
    The defining NUTM1 rearrangement is usually shown by nuclear NUT staining (79% of the registry's
    diagnoses, quoted on the testing row). The review's abstract makes nuclear NUT expression the
    requirement; its body asks for a demonstrated NUTM1 rearrangement, which staining can confirm,
    and allows molecular testing as an alternative. In the antibody study (1068 tissues stained,
    FISH as the reference), C52 staining had a sensitivity of 87%, a specificity of 100%, a negative
    predictive value of 99% and a positive predictive value of 100% for NUT carcinoma among
    non-germ-cell tumours; among 919 non-germ-cell malignancies it gave 4 false negatives and no
    false positive. Some germ cell tumours stain weakly (see histopathology).
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:35372003
    reference_title: 'NUT Carcinoma: Clinicopathologic Features, Molecular Genetics and Epigenetics.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of NUT carcinoma requires the detection of nuclear expression of the NUT protein by
      immunohistochemistry.
    explanation: >-
      The requirement as the review's abstract states it; its body, quoted next, frames it as the
      rearrangement.
  - reference: PMID:35372003
    reference_title: >-
      NUT Carcinoma: Clinicopathologic Features, Molecular Genetics and Epigenetics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A definitive diagnosis of NC requires demonstrating the presence of NUTM1 gene rearrangement,
      which can be confirmed by immunohistochemistry with a NUT specific monoclonal antibody (clone
      C52) ( Figure 1D ).
    explanation: >-
      The review body's statement: the rearrangement is what is required, and staining can confirm
      it.
  - reference: PMID:35372003
    reference_title: >-
      NUT Carcinoma: Clinicopathologic Features, Molecular Genetics and Epigenetics.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An alternative to NUT immunohistochemistry is molecular analysis to detect a NUTM1 gene
      rearrangement using fluorescence in situ hybridization, reverse-transcriptase polymerase chain
      reaction, cytogenetics, next generation sequencing, or whole-exome sequencing-based
      approaches.
    explanation: >-
      That molecular testing is an alternative to staining.
  - reference: PMID:19363441
    reference_title: "Diagnosis of NUT midline carcinoma using a NUT-specific monoclonal antibody."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IHC staining had a sensitivity of 87%, a specificity of 100%, a negative predictive value of
      99%, and a positive predictive value of 100%.
    explanation: >-
      The antibody's accuracy against FISH, as the abstract gives it.
  - reference: PMID:19363441
    reference_title: "Diagnosis of NUT midline carcinoma using a NUT-specific monoclonal antibody."

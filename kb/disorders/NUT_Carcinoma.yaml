treatments:
- name: Surgical resection
  description: >-
    Extent of resection was an independent predictor of survival among the 54 patients with outcome
    data in the cached clinical database, and complete resection with negative margins in a registry
    series of 40 head and neck patients with outcome data. An 18-patient head and neck series found
    no statistically significant association between survival and treatment modality; every patient
    in it had radiotherapy, so its null result says nothing about radiotherapy itself, and it does
    not say how it grouped treatment for the test.
  treatment_term:
    preferred_term: surgical resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:22896655
    reference_title: Clinicopathologic features and long-term outcomes of NUT midline carcinoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis suggested that extent of surgical resection and initial radiotherapy were
      independent predictors of PFS and OS.
    explanation: >-
      Resection and radiotherapy as independent predictors, from that database's multivariate analysis.
  - reference: PMID:27509377
    reference_title: Intensive treatment and survival outcomes in NUT midline carcinoma of the head and
      neck.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial surgery with or without postoperative chemoradiation or radiation (P = .04) and complete
      resection with negative margins (P = .01) were significant predictors of improved OS even after
      adjustments for age, tumor size, and neck lymphadenopathy.
    explanation: >-
      The same finding in a head and neck series, where complete resection with negative margins predicted
      improved survival after adjustment.
  - reference: PMID:41160255
    reference_title: >-
      NUT Carcinoma of the Head and Neck: Clinicopathologic and Molecular Analysis of 18 Cases.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No statistically significant associations were found between OS and clinicopathological
      features, including age (p = 0.14), sex (p = 0.39), tumor size (p = 0.65), AJCC stage (p =
      0.55), treatment modality (p = 0.47), and NUTM1 fusion partner (p = 0.16).
    explanation: >-
      A small series that found no statistically significant survival difference by treatment
      modality. Indirect: it tested treatment modality as a whole rather than the extent of
      resection, and does not say how it grouped treatment for the test; every one of its 18
      patients had radiotherapy, six as chemoradiotherapy alone and twelve with surgery. Recorded as
      a disagreement from a small series, not as a disconfirmation.
- name: Radiotherapy
  description: >-
    Initial radiotherapy was the other independent predictor in the same analysis. In a review that
    pooled published case reports of primary pulmonary NUT carcinoma, the patients given first-line
    chemoradiotherapy had a mean survival of 13.2 months among the six of eight whose survival was
    recorded, against 5.58 months for chemotherapy alone, a mean over 13 of the 16 so treated, which
    the chemotherapy row quotes, and the review concludes that the disease is sensitive to
    radiotherapy and that chemoradiotherapy was the most efficient regimen. That comparison is of
    means across case reports, and the cached text gives no test of it.
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  therapeutic_modality: RADIOTHERAPY
  evidence:
  - reference: PMID:22896655
    reference_title: Clinicopathologic features and long-term outcomes of NUT midline carcinoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis suggested that extent of surgical resection and initial radiotherapy were
      independent predictors of PFS and OS.
    explanation: The same sentence names radiotherapy.
  - reference: PMID:27509377
    reference_title: >-
      Intensive treatment and survival outcomes in NUT midline carcinoma of the head and neck.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial radiation or chemotherapy and the NUT translocation type were not associated with
      outcomes.
    explanation: >-
      A cohort that did not reproduce the radiotherapy benefit this row records, and it is recorded
      as a refutation rather than left in prose. The same study did find aggressive initial surgical
      resection associated with enhanced survival, so it is not a null study - it separates surgery
      from radiotherapy where the cited multivariate analysis did not. Read it as a disagreement
      rather than as independent disconfirmation. These 40 head and neck patients come from the
      International NUT Midline Carcinoma Registry; the 63-patient study above does not name a
      registry in its abstract, saying only that a clinical database was built from all known cases,
      so the two almost certainly draw on overlapping patients even though neither abstract states the
      overlap outright.
  - reference: PMID:36290813
    reference_title: >-
      Diagnosis, Treatment and Prognosis of Primary Pulmonary NUT Carcinoma: A Literature Review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight patients opted for chemoradiotherapy (applied concurrent chemoradiotherapy or sequential
      chemoradiotherapy as the first-line therapy), with a mean OS of 13.2 months for the six
      patients who recorded the survival time, and four of them reported an OS more than 12 months
      (12.9, 16, 18 and 26.7 months, respectively).
    explanation: >-
      The chemoradiotherapy group's mean survival, over the six of eight with survival recorded.
      Indirect for this row: the treatment combined radiotherapy with chemotherapy.
  - reference: PMID:36290813
    reference_title: >-
      Diagnosis, Treatment and Prognosis of Primary Pulmonary NUT Carcinoma: A Literature Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to our results, this disease is sensitive to radiotherapy, and chemoradiotherapy
      (either concurrent chemoradiotherapy or sequential chemoradiotherapy) was the most efficient
      therapeutic regimen to prolong the OS of patients with pulmonary NC.
    explanation: >-
      The review's conclusion that the disease is sensitive to radiotherapy, which is this row's
      subject, drawn from the means above.
  notes: >-
    The chemoradiotherapy figures are recorded with their limits. The review pooled published case
    reports of primary pulmonary NUT carcinoma diagnosed by pathology, computes each mean over the
    patients whose survival was recorded, and gives no test of the comparison. Whether the patients
    fit for combined treatment were the ones who lived longer is this entry's caveat: no cached
    source says why patients received chemoradiotherapy, and the review notes that some patients'
    first-line treatment was for a disease they had been misdiagnosed with.
- name: Conventional chemotherapy
  description: >-
    Recorded with its negative result. No regimen was associated with improved outcome among the 54
    patients with outcome data in the cached clinical database, and in a SEER analysis the
    chemotherapy association did not survive landmark and time-dependent methods, where surgery and
    radiotherapy did, depending on the analytic framework. Platinum doublets were the commonest
    regimens among NUT Carcinoma Registry patients treated before diagnosis and in published primary
    pulmonary cases, where a taxane or etoposide was the partner in the two commonest regimens, and
    two registry patients received ifosfamide; in a sinonasal series each of three patients received
    cisplatin with one other agent. A review says responses, though rapid, give way to early
    progression, and the report of an international symposium on NUT carcinoma concludes that
    standard chemotherapy is only modestly effective in a minority of cases. In published primary
    pulmonary cases 16 patients were given chemotherapy alone; leaving out the two still alive at
    reporting and the one with no recorded survival time, their mean survival was 5.58 months, which
    the review that pooled them reads as chemotherapy lengthening survival to a certain degree, a
    reading recorded as a refutation of the negative result. Two items are recorded as indirect
    refutations of it: the list of agents used with some success in the review that reports early
    progression, which carries no figures, and one cure with a regimen designed for Ewing sarcoma,
    which an antibody study cites from another report. A larger cohort's 75% response rate to
    ifosfamide in metastatic disease, which an 18-patient head and neck series restates together
    with its lack of durability and of an overall-survival benefit, is recorded as background
    support for the negative result.

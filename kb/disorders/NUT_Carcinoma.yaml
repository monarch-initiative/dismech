- name: NUTM1 rearrangement testing
  description: >-
    Fluorescence in situ hybridization with NUTM1 split-apart probes, reverse transcriptase PCR and
    RNA or DNA sequencing have all been used to make the diagnosis, although standard DNA sequencing
    misses most cases. In the NUT Carcinoma Registry the diagnosis was made by NUT
    immunohistochemistry in 79% of cases (104 patients), by RNA sequencing in 12% (16), by NUTM1
    FISH in 8% (10) and by DNA sequencing in 1% (2). Split-apart FISH can miss a cryptic BRD4-NUTM1
    rearrangement: in the antibody study two such tumours were found by immunohistochemistry and
    confirmed with a refined set of probes, which lowered the sensitivity of FISH to 93%, and only
    FISH and immunohistochemistry together reached 100%. The authors advise FISH when
    immunohistochemistry is negative and the diagnosis is still suspected.

    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of NUT carcinoma requires the detection of nuclear expression of the NUT protein by
      immunohistochemistry.
    explanation: >-
      The requirement as the review's abstract states it; its body, quoted next, frames it as the
      rearrangement.

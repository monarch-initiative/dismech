disease_term:
  preferred_term: NUT carcinoma
  term:
    id: MONDO:0005563
    label: nut midline carcinoma
description: >-
  A poorly differentiated carcinoma defined by rearrangement of NUTM1, arising across a wide age
  range, from children to older adults, mostly in the thorax and in the head and neck. The fusion
  partner is BRD4 in most cases, BRD3 or NSD3 in most of the rest. The NUT half recruits and
  activates the histone acetyltransferase p300, and in BRD4-NUT - the only fusion any cached primary
  study has mapped - the complex builds megabase-scale hyperacetylated chromatin domains over a
  small, recurrent set of stem-cell transcription factors. For a non-BRD4 fusion, NSD3-NUT, a cached
  primary study shows the fusion is necessary and sufficient both to block differentiation and to
  maintain proliferation. It is aggressive and thought to be widely underdiagnosed.
synonyms:
- NUT midline carcinoma
- NMC
- NUTM1-rearranged carcinoma

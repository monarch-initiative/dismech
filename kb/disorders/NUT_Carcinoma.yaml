- name: Early Metastatic Spread
  description: >-
    Spread is often present at diagnosis, by local invasion of adjacent structures and to lymph
    nodes and distant sites, though how often depends on the primary site. 55% of the NUT Carcinoma
    Registry's patients had metastatic disease at their first cancer diagnosis, and at the NUT
    carcinoma diagnosis 72% of those with a thoracic primary had it, against 32% of those with a
    non-thoracic primary. In an 18-patient head and neck series, imaging showed the mass invading
    adjacent structures, frequently the orbit or the anterior cranial base, and 7 patients developed
    distant metastasis during follow-up, most often to the lungs. No cached source ties the spread
    to a particular step in this entry, so no edge runs into this node.
  biological_scale: ORGANISM
  evidence:
  - reference: ORPHA:443167
    reference_title: "NUT midline carcinoma"
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Extensive local invasion of adjacent structures, lymph node involvement, and distant
      metastatic disease are often present at the time of diagnosis.
    explanation: >-
      That local invasion, nodal involvement and distant metastasis are often present at diagnosis.
  - reference: PMID:41160255
    reference_title: >-
      NUT Carcinoma of the Head and Neck: Clinicopathologic and Molecular Analysis of 18 Cases.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The locoregional recurrence rate was 33.3% (6/18), and 38.9% (7/18) of patients developed
      distant metastasis, most commonly to the lungs.
    explanation: >-
      Distant metastasis during follow-up in the head and neck series, most often to the lungs.
      Indirect for a node about early spread: these metastases arose after diagnosis.
  - reference: PMID:41348986
    reference_title: >-

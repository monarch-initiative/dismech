- name: BET bromodomain inhibition
  description: >-
    The mechanism-directed approach. Three agents have cached clinical data in this disease, all
    early phase and all modest: two of four compassionate-use patients responded to OTX015; four of
    nineteen reached a confirmed or unconfirmed partial response on molibresib; two of eight on
    RO6870810. The report of an international symposium on NUT carcinoma grades first-generation BET
    inhibitors as modestly effective in a minority of cases, with a narrow therapeutic window.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: NUTM1 Rearrangement
    treatment_effect: INHIBITS
    description: >-
      The node records the fusion protein's bromodomain-mediated chromatin binding as its molecular
      function, and that is what this drug class blocks. The link is to the lesion node because the
      drug acts on the fusion protein itself rather than on anything downstream of it.
    evidence:
    - reference: PMID:26976114
      reference_title: >-
        Clinical Response of Carcinomas Harboring the BRD4-NUT Oncoprotein to the Targeted Bromodomain
        Inhibitor OTX015/MK-8628.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-

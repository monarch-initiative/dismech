notes: >-
  The Regional lymph node involvement and Distant metastasis phenotypes carry no ontology binding,
  and the reason is the slot's two halves. HPO has no term for nodal involvement or distant
  metastasis: searches of the HP branch for metasta, metastatic, tumor spread and invasion return
  only Metastatic angiosarcoma, a different disease, and the nearest lymph-node terms describe
  enlargement or altered morphology, which is not what nodal involvement by tumour means - a node
  can be involved without being enlarged. MONDO is the other half of the slot and does have
  candidates, MONDO:0005438 metastatic malignant neoplasm in the lymph nodes and MONDO:0024880
  metastatic malignant neoplasm, both of which would validate. They are declined deliberately: the
  entries that bind MONDO in a phenotype slot do so for a comorbid distinct disease, whereas a
  metastasis is this same tumour in another site, so binding one would assert a separate disease
  entity. The precedent for leaving such a row unbound is Alveolar_Rhabdomyosarcoma, whose
  Metastatic Disease and Regional Nodal Disease phenotypes both carry a preferred term and no
  binding. The practice is not uniform: Ewing_Sarcoma binds its own Metastatic Disease phenotype to
  HP:0002664 Neoplasm, which is a coarse term and would need a coarse_binding_basis here.


  The presenting symptoms are recorded by primary site, from cached full texts. For a thoracic
  primary they come from the NUT Carcinoma Registry's report (PMID:41348986) and from a review of 55
  published cases of primary pulmonary NUT carcinoma, 44 of them with their symptoms recorded
  (PMID:36290813). For other sites they come from the registry's patients with a non-thoracic
  primary, a group not limited to the head and neck, and from an 18-patient head and neck series,
  mostly sinonasal (PMID:41160255). The registry counts dyspnoea together with fatigue, and its
  cached text does not say where the congestion it reports was, so its figures for those two are
  graded indirect. Orphanet puts the symptoms down to the mass's effect where it sits, and a
  representative endoscopy image in the head and neck series shows tumour obstructing the nasal
  meatus, so the edge from the mass to nasal congestion is marked as a direct link, since no
  mechanism node of this entry sits between them. Its three quotes are each graded indirect: the
  image names no symptom, the series' summary reports the symptom but not its cause, and Orphanet's
  mass-effect sentence names no particular symptom. The four edges to the thoracic symptoms carry an
  unknown link type.


  Three of the five treatment rows carry no target_mechanisms link, and that is a decision rather
  than an omission. Every cached sentence about surgery, radiotherapy and cytotoxic chemotherapy in
  this disease reports an outcome, a response or how often a treatment was used - extent of resection
  and initial radiotherapy as independent predictors of survival, no chemotherapy regimen associated
  with improved outcome - and none says which mechanism the treatment acts on. A link drawn from one
  would assert a mechanism no source states.


  No claim of resistance to BET or HDAC inhibitors is curated. Four cached sentences pair therapy
  resistance with these drugs or their targets, and each frames its paper's question or restates
  other work rather than reporting the paper's own result: a trial report's opening line that BET
  proteins can drive therapy resistance (PMID:33311588); a statement, citing a recent study, that
  CDK4/6 inhibition could overcome resistance to BET inhibition and that the combination improved
  survival in a mouse xenograft model (PMID:34285087); an introduction's remark, citing other work,
  that KLF4 expression helps maintain c-MYC levels in cells resistant to JQ1 (PMID:37119804); and an
  18-patient head and neck series' discussion of drug toxicity and resistance limiting HDAC and BET
  inhibitors (PMID:41160255). The entry records no resistance mechanism from them.


  Three claims in circulation about these agents do not survive a check against the cached abstracts,
  and each is the kind a later curator would copy. Two are from the molibresib trial, PMID:32328561.
  The 11% reported for it is its dose-limiting-toxicity rate, not a response rate - the response
  figure in the same abstract is four of nineteen. Its thrombocytopenia figures, six grade 4 events
  and 51% at any grade, are over all 65 patients on that trial rather than over its nineteen with
  this disease, which the abstract gives no separate breakdown for. The third concerns vorinostat:
  the single child treated with it is reported only as having an objective response after five weeks,
  and no cached source says treatment stopped for thrombocytopenia.


  Two things worth keeping straight when reading the pathophysiology. First, the two cached readings of
  what the fusion does to acetylation look contradictory and are not: bulk acetylation falls while the
  megadomains are hyperacetylated, and both are cited on the node that records them. Second, the mechanism
  is not BRD4-specific. A variant-fusion study found NSD3-NUT necessary and sufficient for the differentiation
  block, so the nodes are written for the entity rather than for the common partner.


  The three prognostic strata are recorded with a cached disagreement attached. A 40-patient head and
  neck series found no association between fusion type and outcome, and head and neck sits inside the
  nonthoracic group where the registry's A versus B split lives, so the two bear on the same comparison.
  Both are recorded; neither settles it.


  Orphanet's record for this disease, ORPHA:443167, carries nine phenotype rows, and none of them is
  transcribed here. Seven are Frequent (79-30%): Leukemia, Squamous cell carcinoma, Neuroblastoma,
  Oropharyngeal squamous cell carcinoma, Ewing sarcoma, Abnormal mediastinum morphology and
  Pancreatoblastoma. Neoplasm is Very frequent (99-80%) and Pancreatic squamous cell carcinoma is
  Occasional (29-5%). Read as phenotypes of one disease the Frequent rows would say that 30 to 79% of
  patients with NUT carcinoma have leukaemia, neuroblastoma and Ewing sarcoma, which no cached source
  states and which none of the entry's cohorts reports. Read instead as the set of tumours in which a NUTM1
  rearrangement has been reported they are coherent, and that is the reading taken here: the rows
  describe the NUTM1 rearrangement's tumour spectrum rather than this disease's clinical features.
  The anomaly is recorded rather than repaired, because it is an Orphanet question before it is a
  dismech one.


  Five of Orphanet's six cross-reference rows are not carried in this entry's mappings, and they fail
  for two different reasons. Three name a vocabulary this schema does have a slot for, and are left
  out because the identifier does not fit that slot. The ICD-10 code C80.9, which Orphanet lists as Narrower,
  is a WHO ICD-10 code and this schema's slot is icd10cm_mappings: asking the local ICD-10-CM build
  for it returns no label (`runoak -i sqlite:obo:icd10cm info ICD10CM:C80.9` gives
  `ICD10CM:C80.9 ! None`, where C80.0, C80.1 and C80.2 all resolve), so the clinical modification has
  no such code and binding it would invent one. The two ICD-11 references, 2D3Y as Narrower and
  XH2855 as Exact, are linearisation codes, where every icd11f binding in this knowledge base is a
  numeric foundation identifier; the local foundation build answers neither code as text
  (`search 't~2D3Y'` and `search 't~XH2855'` both return nothing) and none of the 213 entities it
  returns for `search 'l~NUT'` is a carcinoma or a midline tumour. The remaining two rows, MedDRA and
  UMLS, fail for the simpler reason that this schema has no slot for either vocabulary. So the
  mappings block carries Orphanet's MONDO exact match and an NCIT class resolved at NCIT, and the
  five uncarried rows are recorded here instead.
review_notes: >-
  Every ontology identifier bound here was read from the local MONDO, NCIT or HGNC build, or from
  the committed CL, GO, HP, CHEBI and NCBITaxon caches, in the step the line was written. MONDO's
  canonical label for MONDO:0005563 is the superseded name, nut midline carcinoma; it is copied
  exactly into the binding, and NUT Carcinoma is used as the entry name because MONDO itself carries
  it as an exact synonym of that class, alongside NUT Midline carcinoma and NMC. The entry name is
  therefore MONDO's own term rather than a curator's preference, and the stale canonical label is a
  candidate MONDO term request rather than something to correct here.


  Many of the research report's block quotations are not in the cache they are attributed to, and
  the caches concerned hold abstracts only; nothing from that set is used. Several claims that look
  standard for this disease were therefore left out, each because no cached source then carried it:
  abrupt squamous differentiation and round-cell morphology; the NUT antibody's sensitivity and
  specificity figures; the rarer fusion partners beyond BRD4, BRD3 and NSD3; a presenting symptom
  list; and any statement about environmental risk factors. Abrupt keratinisation, the antibody's
  accuracy and a presenting symptom list have since been recorded, from cached full texts. Sources
  cached since also carry round-cell morphology, rarer partners and a statement that a smoking
  history appears to make the diagnosis highly unlikely in the aerodigestive tract; none of these is
  recorded yet. The NUT antibody's sensitivity against FISH and p63's sensitivity in the 57-case
  series are both 87 per cent, but they are separate figures from separate studies and must not be
  merged.


  When first curated, no cached source mentioned the thymus. The registry report cached since
  (PMID:41348986) says the WHO classification lists the disease under thymic malignancies on the
  strength of the first case reports, and that a thymic origin is rare in its experience; the
  antibody study lists one case sited in the thymus; and an 18-patient head and neck series cached
  since recalls that the disease was first described as a mediastinal or thymic malignancy. None of
  these is curated here as a thymic presentation. Thymic_Carcinoma already carries a NUT subtype
  row, bound to NCIT:C146706 Mediastinal/Thymus NUT Carcinoma, and that row points here with
  curated_in: NUT_Carcinoma. Nothing here should be read as asserting a thymic presentation on this
  entry's own evidence.


  When first curated, the entry cited 21 of the 33 references then cached. Two of the other 12 are
  not usable at all - one has an empty body, and one is the same paper as another uncited file,
  cached once under a DOI and once under a PMID - and the rest are simply not cited. Neither
  unusable file is committed.

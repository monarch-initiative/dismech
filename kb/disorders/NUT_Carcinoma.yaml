progression:
- phase: Group A - nonthoracic primary with a non-BRD4 fusion
  duration: median 36.5 months
  notes: >-
    12 of the 124 patients the registry's survival-tree analysis classified. The best-prognosis band.
  evidence:
  - reference: PMID:32328562
    reference_title: >-
      An Anatomical Site and Genetic-Based Prognostic Model for Patients With Nuclear Protein in Testis
      (NUT) Midline Carcinoma: Analysis of 124 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival tree regression identified three statistically distinct risk groups among 124 patients
      classified by anatomical site and genetics: group A is nonthoracic primary, BRD3-, or NSD3-NUT (n
      = 12, median OS = 36.5 months, 95% CI = 12.5 to not reported months); group B is nonthoracic primary,
      BRD4-NUT (n = 45, median OS = 10 months, 95% CI = 7 to 14.6 months); and group C is thoracic primary
      (n = 67, median OS = 4.4 months, 95% CI = 3.5 to 5.6 months).
    explanation: The three strata, their sizes and their median survivals, in one sentence.
  review_notes: >-
    A cached source reports the opposite of the partner half of this stratification, and the two are not
    independent. A 40-patient head and neck series found that the NUT translocation type was not associated
    with outcomes, and head and neck sits inside the nonthoracic group where the A versus B split lives,
    so the two bear on the same comparison. But both analyses draw on the same International NUT Midline
    Carcinoma Registry, the head and neck series at an earlier cut-off, so its 40 patients are largely
    a subset of the 141. And 86 per cent of those 40 carried a BRD4-NUT fusion, leaving roughly five or
    six non-BRD4 cases - too few to detect the difference the larger analysis found. The null is recorded
    because it is real, not because it is independent corroboration.


    One further reason it is not recorded as a refutation on these rows: that series is head and neck
    only, so it contains no thoracic patients at all and cannot bear in either direction on group C,
    which is defined by a thoracic primary. For groups A and B the claim each row makes is its own
    stratum median survival, which the head and neck series never computed. What the null does bear on
    is the A-versus-B split, a claim neither row asserts by itself, which is why it sits here rather
    than as evidence on any one of them.

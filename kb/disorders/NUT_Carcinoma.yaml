pathophysiology:
- name: NUTM1 Rearrangement
  description: >-
    The defining lesion: a translocation fusing NUTM1 to a partner gene. BRD4 is the partner in about
    70 to 80 per cent of cases, BRD3 in 15 to 20 and NSD3 in about 6. The normal NUTM1 product is expressed
    only in testis, so the fusion puts a germ-cell protein under a ubiquitously expressed partner's control.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: NEOMORPHIC
  molecular_functions:
  - preferred_term: chromatin binding by the fusion protein's bromodomain half
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003682
      label: chromatin binding
  genes:
  - preferred_term: NUTM1
    term:
      id: hgnc:29919
      label: NUTM1
  - preferred_term: BRD4
    term:
      id: hgnc:13575
      label: BRD4
  - preferred_term: BRD3
    term:
      id: hgnc:1104
      label: BRD3
  - preferred_term: NSD3
    term:
      id: hgnc:12767
      label: NSD3
  downstream:
  - target: Rapidly Enlarging Primary Mass
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The fusion drives the tumour's growth: BRD4-NUT and NSD3-NUT each keep NUT carcinoma cells
      proliferating, and the mouse Brd4::Nutm1 fusion induces aggressive carcinomas in mice. How
      that growth becomes a rapidly enlarging mass in a patient is not in the cited sources.
    evidence:
    - reference: PMID:26220994
      reference_title: >-
        The oncogenic BRD4-NUT chromatin regulator drives aberrant transcription within large
        topological domains.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: IN_VITRO
      snippet: >-
        NMC is driven by the creation of a translocation oncoprotein, BRD4-NUT, which blocks
        differentiation and drives growth of NMC cells.
      explanation: >-
        That the BRD4-NUT fusion drives the growth of NUT carcinoma cells, as the study's framing
        sentence states it. Indirect: it concerns the tumour cells' growth, not the mass.
    - reference: PMID:24875858
      reference_title: >-
        NSD3-NUT fusion oncoprotein in NUT midline carcinoma: implications for a novel oncogenic
        mechanism.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        We find that NSD3-NUT is both necessary and sufficient for the blockade of differentiation
        and maintenance of proliferation in NMC cells.
      explanation: >-
        That a non-BRD4 fusion is necessary and sufficient to keep NUT carcinoma cells
        proliferating. Indirect for the same reason.
    - reference: PMID:38724194
      reference_title: "Brd4::Nutm1 fusion gene initiates NUT carcinoma in vivo."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We demonstrated that the mouse t(2;17) syntenic chromosome translocation, forming the
        Brd4::Nutm1 fusion gene, could induce aggressive carcinomas in mice.
      explanation: >-
        That the fusion produces aggressive carcinomas in a whole animal. Indirect: a mouse model,
        not a patient's mass.
  - target: p300 Recruitment and Megadomain Formation
    description: The fusion protein brings a histone acetyltransferase onto chromatin.
    evidence:
    - reference: PMID:33452461
      reference_title: Supercharging BRD4 with NUT in carcinoma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        BRD4-NUT combines the chromatin-binding bromo- and extraterminal domain-containing (BET) protein,
        BRD4, with an unstructured, poorly understood protein, NUT, which recruits and activates the histone
        acetyltransferase p300.
      explanation: >-
        Names both halves of the fusion and the acetyltransferase the NUT half recruits, which is this
        edge.
  evidence:
  - reference: PMID:35372003
    reference_title: 'NUT Carcinoma: Clinicopathologic Features, Molecular Genetics and Epigenetics.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUT carcinoma is defined by the presence of a NUTM1 (15q14) rearrangement with multiple other genes.
    explanation: That the rearrangement is what defines the entity.
  - reference: PMID:12543779
    reference_title: 'BRD4-NUT fusion oncogene: a novel mechanism in aggressive carcinoma.'
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Herein we demonstrate that BRD4 is fused with nearly the entire transcript of the novel 15q13 gene,
      NUT (nuclear protein in testis), forming a 6.4-kb fusion oncogene, BRD4-NUT.
    explanation: The original description of the fusion.
  - reference: PMID:12543779
    reference_title: 'BRD4-NUT fusion oncogene: a novel mechanism in aggressive carcinoma.'
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NUT, like BRD4, is predicted to encode a nuclear protein but, unlike the ubiquitous BRD4 transcript,
      is expressed only in testis.
    explanation: >-
      Why the fusion is neomorphic rather than a gain in an existing pathway: the NUT half is normally
      testis-restricted.
  - reference: PMID:32328562
    reference_title: >-
      An Anatomical Site and Genetic-Based Prognostic Model for Patients With Nuclear Protein in Testis
      (NUT) Midline Carcinoma: Analysis of 124 Patients.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients had the BRD4-NUTM1 fusion (78%), followed by BRD3-NUTM1 (15%) and NSD3-NUTM1 (6%).
    explanation: The partner distribution in the largest cached registry cohort.
  - reference: PMID:24875858
    reference_title: >-
      NSD3-NUT fusion oncoprotein in NUT midline carcinoma: implications for a novel oncogenic mechanism.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: In 20% of cases, NUT is fused to uncharacterized non-BRD gene(s).
    explanation: >-
      That a fifth of cases carry a partner outside the BRD family, which bears on why a partner-targeted
      assay can miss a case that NUT immunohistochemistry catches.
  notes: >-
    The molecular function bound here is the chromatin binding the partner gene already has in its
    wild-type form, which is the pattern CLAUDE.md describes for a lesion node - classify the claim,
    not the gene. It is graded GAIN_OF_FUNCTION rather than INCREASED because the departure is
    qualitative: in the fusion that binding tethers NUT, and through it p300, to the sites the
    bromodomain reaches, which is not something the activity does outside the fusion. Only BRD4,
    BRD3 and NSD3 are named here. Rarer partners are reported in the literature: between them, a
    review (PMID:35372003) and the registry report cached since (PMID:41348986) name ZNF532, ZNF592
    and BRD2, and a review of published pulmonary cases (PMID:36290813) names CHRM5. The entry does
    not yet record them.
    This node binds no cell type, and that is deliberate. Because it carries a somatic
    genetic_context, anything in its cell_types is read as the cell of origin by the derivation in
    design decisions 3d. No cached source identifies the cell the fusion arises in, so asserting one
    here would publish a claim the entry cannot support. The squamous binding records the lineage
    the tumour differentiates towards and has moved to the node that makes that claim, which leaves
    this entry reporting ORIGIN_WITHOUT_CELL - the honest answer to a question its sources do not
    settle.
- name: p300 Recruitment and Megadomain Formation
  description: >-
    The NUT half recruits and activates p300, and the complex builds contiguous hyperacetylated chromatin
    domains that reach two megabases. These megadomains are mostly lineage-specific, but three stem-cell
    transcription factors are targeted across tumours and tissues.

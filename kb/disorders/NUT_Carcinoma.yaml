- name: Conventional chemotherapy
  description: >-
    Recorded with its negative result. No regimen was associated with improved outcome among the 54
    patients with outcome data in the cached clinical database, and in a SEER analysis the
    chemotherapy association did not survive landmark and time-dependent methods, where surgery and
    radiotherapy did, depending on the analytic framework. Platinum doublets were the commonest
    regimens among NUT Carcinoma Registry patients treated before diagnosis and in published primary
    pulmonary cases, where a taxane or etoposide was the partner in the two commonest regimens, and
    two registry patients received ifosfamide; in a sinonasal series each of three patients received
    cisplatin with one other agent. A review says responses, though rapid, give way to early
    progression, and the report of an international symposium on NUT carcinoma concludes that
    standard chemotherapy is only modestly effective in a minority of cases. In published primary
    pulmonary cases 16 patients were given chemotherapy alone; leaving out the two still alive at
    reporting and the one with no recorded survival time, their mean survival was 5.58 months, which
    the review that pooled them reads as chemotherapy lengthening survival to a certain degree, a
    reading recorded as a refutation of the negative result. Two items are recorded as indirect
    refutations of it: the list of agents used with some success in the review that reports early
    progression, which carries no figures, and one cure with a regimen designed for Ewing sarcoma,
    which an antibody study cites from another report. A larger cohort's 75% response rate to
    ifosfamide in metastatic disease, which an 18-patient head and neck series restates together
    with its lack of durability and of an overall-survival benefit, is recorded as background
    support for the negative result.

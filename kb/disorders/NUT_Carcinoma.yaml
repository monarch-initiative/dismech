diagnosis:
- name: NUT immunohistochemistry
  description: >-
    The defining NUTM1 rearrangement is usually shown by nuclear NUT staining (79% of the registry's
    diagnoses, quoted on the testing row). The review's abstract (PMID:35372003) makes nuclear NUT
    expression the requirement; its body asks for a demonstrated NUTM1 rearrangement, which staining
    can confirm, and allows molecular testing as an alternative. In the antibody study (1068 tissues
    stained, FISH as the reference), C52 staining had a sensitivity of 87%, a specificity of 100%, a
    negative predictive value of 99% and a positive predictive value of 100% for NUT carcinoma among
    non-germ-cell tumours; among 919 non-germ-cell malignancies it gave 4 false negatives and no
    false positive. Some germ cell tumours stain weakly (see histopathology).
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:35372003

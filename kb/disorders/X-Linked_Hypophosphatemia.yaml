- name: Genetic Counseling and Cascade Evaluation
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling explains X-linked transmission, variable expressivity, testing of
    at-risk relatives, and reproductive options. Molecular testing of relatives
    is preferred when the familial PHEX variant is known; biochemical evaluation
    is an alternative for first-degree relatives at risk.

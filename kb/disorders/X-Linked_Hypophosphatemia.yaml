inheritance:
- name: X-linked dominant inheritance
  inheritance_term:
    preferred_term: X-linked dominant inheritance
    term:
      id: HP:0001423
      label: X-linked dominant inheritance
  expressivity: VARIABLE
  description: >-
    Hemizygous males and heterozygous females can both be clinically affected,
    and intrafamilial severity is variable rather than reliably predicted by
    sex. An affected male transmits the PHEX variant to all daughters and no
    sons; an affected female has a 50% chance of transmission to each child.
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLH is inherited in an X-linked manner; hemizygous males and heterozygous females are similarly affected."
    explanation: GeneReviews explicitly describes the X-linked inheritance pattern and clinical involvement of both sexes.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected males transmit the PHEX pathogenic variant to all of their daughters (who will be heterozygotes and will be affected) and none of their sons."
    explanation: This directly supports father-to-daughter and absent father-to-son transmission.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Affected females have a 50% chance of transmitting the pathogenic variant to each child: male and female offspring who inherit the pathogenic variant will be affected."
    explanation: This directly supports the one-in-two transmission risk from an affected heterozygous female to each child.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The severity of manifestations can differ among family members who inherit a PHEX pathogenic variant; intrafamilial clinical variability does not correlate with the sex of the affected family member."
    explanation: This supports variable expressivity and avoids a categorical claim that males are always more severely affected.

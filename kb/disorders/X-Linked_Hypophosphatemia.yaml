name: X-Linked Hypophosphatemia
synonyms:
- XLH
- X-linked hypophosphataemia
- X-linked dominant hypophosphatemic rickets
- X-linked hypophosphatemic rickets
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >-
  X-linked hypophosphatemia (XLH) is a PHEX-related, X-linked renal
  phosphate-wasting disorder. Germline loss-of-function PHEX variants cause
  excess bone-derived FGF23 through an incompletely resolved molecular link;
  FGF23 reduces renal phosphate reabsorption and dysregulates calcitriol,
  producing lifelong hypophosphatemia, childhood rickets, adult osteomalacia,
  skeletal deformity, dental disease, and progressive musculoskeletal burden.

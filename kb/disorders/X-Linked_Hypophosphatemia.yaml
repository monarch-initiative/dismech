discussions:
- discussion_id: gap_xlh_phex_to_fgf23_coupling
  prompt: What molecular intermediates connect PHEX loss in mineralizing cells to increased FGF23 synthesis and secretion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PHEX Loss of Function in Mineralizing Cells
  - pathophysiology#Excess Bone-Derived FGF23 Signaling
  rationale: >-
    The causal PHEX gene and downstream FGF23 excess are well established, but
    treating PHEX as though it directly degrades FGF23 would overstate current
    evidence. Resolving the intervening osteocyte pathways could expose upstream
    targets that complement systemic FGF23 neutralization.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathogenesis of XLH is complex and incompletely understood. Many features of the disease can be explained by increased secretion of the phosphaturic hormone fibroblast growth factor 23 (FGF23) from bone."
    explanation: The guideline explicitly separates established FGF23 consequences from the incompletely understood upstream pathogenesis.
- discussion_id: gap_xlh_long_term_structural_response
  prompt: >-
    Does long-term correction of FGF23-mediated phosphate wasting prevent or
    reverse enthesopathy, osteoarthritis, adult dental disease or neurosurgical
    complications?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Burosumab
  - phenotypes#Enthesopathy
  - phenotypes#Osteoarthritis
  rationale: >-
    Short-term trials establish biochemical correction and healing of active
    fractures, but irreversible or slowly evolving structural outcomes have not
    been shown to respond. This distinction matters when counseling adults about
    which symptoms are plausibly treatment-responsive.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Evaluate the long-term efficacy and safety of treatment with burosumab in patients with XLH with respect to critical outcomes such as growth, body weight and composition, bone shape, physical function, hyperparathyroidism, tooth mineralization, hearing function, neurosurgical complications and prevention of pseudofractures, enthesopathies, oral manifestations (dental infections, periodontitis, implant loss), mental wellbeing, quality of life and osteoarthritis"
    explanation: The guideline's future-research agenda directly identifies these long-term structural and functional outcomes as unresolved.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Thus, the trial showed no evidence of an effect of burosumab on enthesopathy burden"
    explanation: The pivotal adult trial did not demonstrate a short-term enthesopathy effect.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No data are available on the impact of treatment with burosumab or oral phosphate and active vitamin D on osteoarthritis structural damage on X-rays or the course of osteoarthritis."
    explanation: The guideline explicitly identifies effects on osteoarthritis structure and course as unproven.
- discussion_id: gap_xlh_infant_burosumab_comparative_outcomes
  prompt: >-
    What are the comparative efficacy, optimal dosing and long-term developmental
    outcomes of starting burosumab before 12 months of age?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Burosumab
  rationale: >-
    The first infant study included only 16 participants without randomization or
    a control group. It expands safety experience but cannot establish
    comparative clinical benefit, durable prevention of deformity or a universal
    regulatory age threshold.
  evidence:
  - reference: PMID:42044650
    reference_title: "Safety, tolerability, pharmacokinetics, and efficacy of burosumab in infants with X-linked hypophosphataemia: an open-label, multicentre, non-randomised study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This open-label, non-randomised, phase 1/2 study included infants from clinical sites in Austria, France, Italy, Spain and the UK."
    explanation: The design supports only preliminary non-comparative inference in infants.

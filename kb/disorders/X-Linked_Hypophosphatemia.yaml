progression:
- phase: Infancy and early childhood
  age_range: Birth to approximately 2 years
  notes: >-
    Infants may be identified through an affected family before skeletal signs
    appear. In clinically presenting children, lower-extremity bowing commonly
    emerges after weight bearing begins during the first two years, accompanied
    by active rickets and impaired growth.
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLH typically manifests in the first two years of life with lower extremity bowing due to the onset of weight-bearing"
    explanation: GeneReviews anchors the typical onset of skeletal manifestations to weight bearing in the first two years.
- phase: Childhood and adolescence
  age_range: Growing years
  notes: >-
    Persistent phosphate wasting sustains radiographic rickets, lower-limb
    deformity and disproportionate growth impairment. Dental infection can
    develop in structurally abnormal teeth, and a subset of children develop
    craniosynostosis or related intracranial complications.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The clinical consequences of XLH can include rickets, osteomalacia, bone pain, leg deformities (Fig. 1), premature fusion of the cranial sutures and disproportionate short stature that usually develops during the first 2 years of life"
    explanation: The recommendations summarize the major pediatric skeletal trajectory and early growth impairment.
  - reference: PMID:40220947
    reference_title: "Craniosynostosis among children with X-linked hypophosphatemia: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of craniosynostosis among children with XLH was 22 % (95 % confidence interval (CI) 9.0 % to 44 %)"
    explanation: Meta-analysis establishes craniosynostosis as an important but non-universal pediatric manifestation.
- phase: Adulthood and later life
  age_range: Adulthood
  notes: >-
    Adult disease is not simply residual childhood deformity: osteomalacia and
    pseudofractures can remain active while pain, stiffness, enthesopathy,
    osteoarthritis, dental-periodontal disease and impaired mobility accumulate.
    A 2026 untreated cohort illustrates substantial burden but should not be
    read as a population prevalence study or as proof of sex-determined severity.
  evidence:
  - reference: PMID:37752558
    reference_title: "The International X-Linked Hypophosphatemia (XLH) Registry: first interim analysis of baseline demographic, genetic and clinical data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a chronic disease resulting in progressive accumulation of musculoskeletal manifestations, it is important to understand the natural history of XLH over the patient's lifetime"
    explanation: The international registry frames XLH as a lifelong disorder with accumulating musculoskeletal manifestations.
  - reference: PMID:42429952
    reference_title: Insight into Natural History and Phenotype in Untreated Adults with X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype in adult individuals with XLH was characterized by severe and disproportionate short stature, overweight/obesity, severe skeletal deformities with difficulty walking, osteoarticular pain, poor dental health, and reduced quality of life."
    explanation: A contemporary untreated adult cohort documents the combined skeletal, mobility, pain, dental and quality-of-life burden.
  - reference: PMID:42429952
    reference_title: Insight into Natural History and Phenotype in Untreated Adults with X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pseudofractures were documented in 17 patients (33%)."
    explanation: The untreated cohort quantifies active pseudofracture burden without attributing it to treatment exposure.
pathophysiology:
- name: PHEX Loss of Function in Mineralizing Cells
  biological_scale: MOLECULAR
  description: >-
    Germline inactivating PHEX variants are the proximal defect. PHEX is
    expressed mainly in osteoblasts, osteocytes and odontoblasts, but the exact
    molecular route from PHEX deficiency to increased FGF23 production remains
    unresolved.
  genetic_context:
    gene:
      preferred_term: PHEX
      term:
        id: hgnc:8918
        label: PHEX
    functional_impact_category: LOSS_OF_FUNCTION
    description: Germline loss of PHEX function underlies the X-linked disorder.
  genes:
  - preferred_term: PHEX
    term:
      id: hgnc:8918
      label: PHEX
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: osteocyte
    term:
      id: CL:0000137
      label: osteocyte
  downstream:
  - target: Excess Bone-Derived FGF23 Signaling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: PHEX loss is upstream of increased FGF23 synthesis, but the intervening molecular coupling is incompletely understood.
  evidence:
  - reference: PMID:11062477
    reference_title: Autosomal dominant hypophosphataemic rickets is associated with mutations in FGF23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivating mutations of the gene PHEX, encoding a member of the neutral endopeptidase family of proteins, are responsible for XLH"
    explanation: This establishes inactivating PHEX variants as the disease cause without using the ADHR finding as evidence for the unresolved PHEX-to-FGF23 coupling step.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "X-linked hypophosphataemia (XLH) is a rare metabolic bone disorder caused by pathogenic variants in the PHEX gene, which is predominantly expressed in osteoblasts, osteocytes and odontoblasts."
    explanation: The guideline supports the causal gene and its principal mineralizing-cell expression sites.
- name: Excess Bone-Derived FGF23 Signaling
  biological_scale: ORGANISM
  description: >-
    PHEX loss produces excess synthesis and circulating activity of the
    bone-derived phosphaturic hormone FGF23. This endocrine signal acts on the
    kidney to reduce phosphate reclamation and alter vitamin D metabolism.
  biological_processes:
  - preferred_term: phosphate ion homeostasis
    term:
      id: GO:0055062
      label: phosphate ion homeostasis
    modifier: ABNORMAL
  downstream:
  - target: Reduced Proximal Tubular Phosphate Reabsorption
    causal_link_type: DIRECT
    description: Excess FGF23 downregulates proximal tubular sodium-phosphate transport and causes phosphaturia.
  - target: FGF23-Driven Calcitriol Dysregulation
    causal_link_type: DIRECT
    description: Excess FGF23 decreases calcitriol synthesis and increases its degradation in proximal renal tubules.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLH is characterized by increased synthesis of the bone-derived phosphaturic hormone fibroblast growth factor 23 (FGF23), which results in renal phosphate wasting with consecutive hypophosphataemia"
    explanation: This directly supports the endocrine FGF23 excess and its renal phosphate-wasting consequence.
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "inherited loss-of-function mutations in the PHEX gene cause excess circulating levels of fibroblast growth factor 23 (FGF23), leading to lifelong renal phosphate wasting and hypophosphatemia"
    explanation: The adult trial background independently states the PHEX-FGF23-phosphate axis in XLH.
- name: Reduced Proximal Tubular Phosphate Reabsorption
  biological_scale: CELLULAR
  description: >-
    FGF23 signaling in renal proximal tubules downregulates the NPT2a and NPT2c
    sodium-phosphate transporters, lowering tubular phosphate reabsorption and
    causing persistent urinary phosphate loss despite hypophosphatemia.
  biological_processes:
  - preferred_term: phosphate ion transport
    term:
      id: GO:0006817
      label: phosphate ion transport
    modifier: DECREASED
  chemical_entities:
  - preferred_term: phosphate
    term:
      id: CHEBI:26020
      label: phosphate
    modifier: DECREASED
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  downstream:
  - target: Reduced Circulating Phosphate
    causal_link_type: DIRECT
    description: Ongoing renal phosphate loss lowers the circulating phosphate concentration.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "downregulation of the sodium-dependent phosphate transporters NPT2a (encoded by SLC34A1) and NPT2c (encoded by SLC34A3)"
    explanation: The updated recommendations specify the proximal tubular transporter mechanism.
  - reference: PMID:7550339
    reference_title: "A gene (PEX) with homologies to endopeptidases is mutated in patients with X-linked hypophosphatemic rickets. The HYP Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "impaired phosphate uptake in the kidney, which is likely to be caused by abnormal regulation of sodium phosphate cotransport in the proximal tubules"
    explanation: The original PHEX report links XLH to abnormal proximal tubular sodium-phosphate cotransport.
- name: FGF23-Driven Calcitriol Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Excess FGF23 decreases renal production and increases degradation of
    1,25-dihydroxyvitamin D. Calcitriol is therefore inappropriately low or
    normal for the degree of hypophosphatemia, limiting compensatory intestinal
    mineral absorption.
  biological_processes:
  - preferred_term: vitamin D metabolic process
    term:
      id: GO:0042359
      label: vitamin D metabolic process
    modifier: ABNORMAL
  downstream:
  - target: Skeletal Mineralization Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced vitamin D-dependent intestinal calcium and phosphate absorption
    description: An inadequate calcitriol response compounds the substrate deficit for mineralization.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a decrease in 1,25-dihydroxyvitamin D (1,25(OH)2D) synthesis and an increase in 1,25(OH)2D degradation in the proximal renal tubules"
    explanation: This directly supports both directions of FGF23-mediated calcitriol dysregulation.
- name: Reduced Circulating Phosphate
  conforms_to: "defective_skeletal_mineralization#Phosphopenic Substrate Deficiency"
  biological_scale: ORGANISM
  description: >-
    Lifelong renal phosphate wasting produces serum phosphate below the
    age-adjusted reference range. This is a causally active systemic substrate
    deficit as well as the central biochemical finding used in diagnosis and
    treatment monitoring.
  chemical_entities:
  - preferred_term: phosphate
    term:
      id: CHEBI:26020
      label: phosphate
    modifier: DECREASED
  downstream:
  - target: Skeletal Mineralization Failure
    causal_link_type: DIRECT
    description: Insufficient extracellular phosphate impairs growth-plate and osteoid mineralization.
  - target: Dentoalveolar Mineralization Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic hypophosphatemia contributes to dental mineralization failure, with additional local PHEX-dependent mechanisms not fully resolved.
  - target: Hypophosphatemia
    causal_link_type: DIRECT
    description: The reduced circulating-phosphate state is expressed clinically as hypophosphatemia below the age-adjusted reference range.
    evidence:
    - reference: PMID:29947083
      reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "leading to lifelong renal phosphate wasting and hypophosphatemia"
      explanation: The adult trial background directly connects persistent renal phosphate wasting with the hypophosphatemic state.
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to lifelong renal phosphate wasting and hypophosphatemia"
    explanation: The adult trial explicitly identifies the lifelong systemic phosphate deficit.
- name: Skeletal Mineralization Failure
  conforms_to: "defective_skeletal_mineralization#Impaired Hydroxyapatite Deposition at the Mineralization Front"
  biological_scale: TISSUE
  description: >-
    Chronic phosphate deficiency impairs mineralization at open growth plates
    and in bone osteoid. The age-dependent tissue expressions are rickets in
    growing children and osteomalacia, insufficiency fractures and
    pseudofractures after growth-plate closure.
  biological_processes:
  - preferred_term: bone mineralization
    term:
      id: GO:0030282
      label: bone mineralization
    modifier: DECREASED
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Rickets
    causal_link_type: DIRECT
    description: Failure to mineralize the growing skeleton produces rickets.
  - target: Osteomalacia
    causal_link_type: DIRECT
    description: Failure to mineralize osteoid produces adult osteomalacia.
  - target: Lower-Limb Deformity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - weight bearing on rachitic bone
    description: Weight bearing on undermineralized growing bone promotes varus or valgus deformity.
  - target: Short Stature
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - growth-plate rickets and lower-limb shortening
    description: Persistent growth-plate disease impairs linear growth and disproportionately shortens the legs.
  - target: Pseudofractures and Insufficiency Fractures
    causal_link_type: DIRECT
    description: Osteomalacic bone develops non-traumatic pseudofractures and insufficiency fractures.
  - target: Bone and Musculoskeletal Pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - adult osteomalacia and insufficiency injury
    description: Active osteomalacia and insufficiency injury contribute to bone and musculoskeletal pain, although structural joint disease can add other pain generators.
    evidence:
    - reference: PMID:39814982
      reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Treatment with active vitamin D and phosphate supplements has been shown to improve musculoskeletal ... pain and stiffness, to ameliorate osteomalacia"
      explanation: Concurrent improvement of pain and osteomalacia supports a mineralization-mediated pain component but does not exclude structural pain generators.
  - target: Joint Stiffness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Mineralization disease can contribute to adult stiffness, but coexisting osteoarthritis and enthesopathy prevent assignment of a single settled intermediate mechanism.
    evidence:
    - reference: PMID:39814982
      reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Treatment with active vitamin D and phosphate supplements has been shown to improve musculoskeletal ... pain and stiffness, to ameliorate osteomalacia"
      explanation: Treatment-associated improvement supports a mineralization-responsive stiffness component while the unknown-intermediate edge preserves competing structural causes.
  - target: Gait Disturbance and Impaired Mobility
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - lower-limb deformity, pain, stiffness and insufficiency-fracture burden
    description: The combined skeletal consequences restrict walking and mobility.
    evidence:
    - reference: PMID:42429952
      reference_title: Insight into Natural History and Phenotype in Untreated Adults with X-Linked Hypophosphatemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "severe skeletal deformities with difficulty walking"
      explanation: The untreated adult cohort directly links severe skeletal deformity with walking difficulty.
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fractures, and pseudofractures due to osteomalacia"
    explanation: The adult trial directly attributes fractures and pseudofractures to osteomalacia.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "XLH is characterized by increased synthesis of the bone-derived phosphaturic hormone fibroblast growth factor 23 (FGF23), which results in renal phosphate wasting with consecutive hypophosphataemia, rickets, osteomalacia, disproportionate short stature"
    explanation: The guideline supports the systemic mechanism and principal skeletal consequences.
- name: Dentoalveolar Mineralization Defect
  biological_scale: TISSUE
  description: >-
    Impaired dentin and alveolar-bone mineralization creates structurally weak
    teeth with enlarged or exposed pulp pathways and susceptibility to
    endodontic infection, including abscesses in teeth that can appear sound.
  downstream:
  - target: Dental Abscesses and Periodontal Disease
    causal_link_type: DIRECT
    description: Intrinsic dental structural defects predispose to pulpal and periapical infection and early tooth loss.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients also show hypomineralization of teeth and are prone to tooth abscesses and periodontitis"
    explanation: The guideline directly links tooth hypomineralization with abscess and periodontal susceptibility.
  - reference: PMID:42409089
    reference_title: "Diagnosis and management of X-linked hypophosphatemia in dental practice: A scoping review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "X-linked hypophosphatemia (XLH) is a PHEX-related disorder causing elevated FGF23, chronic hypophosphatemia, and impaired skeletal and dental mineralization, leading to frequent endodontic abscess in clinically sound teeth due to intrinsic structural failure, periapical lesions and early tooth loss."
    explanation: The dental scoping review supports the structural basis and characteristic infection pattern.
phenotypes:
- name: Rickets
  description: >-
    Active growth-plate mineralization failure in children, often accompanied by
    metaphyseal changes, leg bowing and impaired growth.
  phenotype_term:
    preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  evidence:
  - reference: PMID:31104833
    reference_title: "Burosumab versus conventional therapy in children with X-linked hypophosphataemia: a randomised, active-controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "X-linked hypophosphataemia in children is characterised by elevated serum concentrations of fibroblast growth factor 23 (FGF23), hypophosphataemia, rickets, lower extremity bowing, and growth impairment."
    explanation: The pediatric phase 3 trial identifies rickets as a cardinal childhood manifestation.
- name: Osteomalacia
  description: >-
    Persistent adult osteoid mineralization failure, clinically expressed by
    bone pain, insufficiency fractures and pseudofractures.
  phenotype_term:
    preferred_term: Osteomalacia
    term:
      id: HP:0002749
      label: Osteomalacia
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fractures, and pseudofractures due to osteomalacia"
    explanation: This directly supports active adult osteomalacia and its fracture manifestations.
- name: Lower-Limb Deformity
  description: >-
    Varus or valgus lower-limb deformity develops under weight bearing and may
    persist despite medical treatment.
  phenotype_term:
    preferred_term: Bowing of the legs
    term:
      id: HP:0002979
      label: Bowing of the legs
  evidence:
  - reference: PMID:31104833
    reference_title: "Burosumab versus conventional therapy in children with X-linked hypophosphataemia: a randomised, active-controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rickets, lower extremity bowing, and growth impairment"
    explanation: The pediatric trial supports lower-extremity bowing as a characteristic manifestation.
- name: Short Stature
  description: >-
    Disproportionate short stature, especially lower-limb shortening, originates
    in the growing years and commonly persists in adults.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults with XLH present with chronic musculoskeletal pain and stiffness, short stature, lower limb deformities"
    explanation: The adult trial supports persistent short stature and lower-limb deformity.
- name: Pseudofractures and Insufficiency Fractures
  description: >-
    Non-traumatic Looser-zone pseudofractures and insufficiency fractures are
    manifestations of adult osteomalacia and can remain unhealed without
    effective metabolic treatment.
  phenotype_term:
    preferred_term: Pathologic fracture
    term:
      id: HP:0002756
      label: Pathologic fracture
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fractures, and pseudofractures due to osteomalacia"
    explanation: The trial directly supports both fracture categories while the HPO mapping captures fractures arising in metabolically weakened bone.
- name: Bone and Musculoskeletal Pain
  description: >-
    Chronic pain is a major adult burden; etiologies can include active
    osteomalacia as well as structural osteoarthritis, enthesopathy and
    deformity, which should not be assumed to share one mechanism.
  phenotype_term:
    preferred_term: Bone pain
    term:
      id: HP:0002653
      label: Bone pain
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults with XLH present with chronic musculoskeletal pain and stiffness"
    explanation: This directly supports chronic musculoskeletal pain in adults.
- name: Joint Stiffness
  description: >-
    Stiffness is common in symptomatic adults and can reflect several coexisting
    skeletal and joint processes rather than a single modeled causal mechanism.
  phenotype_term:
    preferred_term: Joint stiffness
    term:
      id: HP:0001387
      label: Joint stiffness
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adults with XLH present with chronic musculoskeletal pain and stiffness"
    explanation: This directly supports stiffness as a characteristic adult symptom.
- name: Gait Disturbance and Impaired Mobility
  description: >-
    Lower-limb deformity, pain, stiffness and fracture burden can produce an
    abnormal gait and reduced mobility across adult life.
  phenotype_term:
    preferred_term: Gait disturbance
    term:
      id: HP:0001288
      label: Gait disturbance
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adults may present with calcification of the tendons, ligaments, and joint capsules, joint pain, fatigue, insufficiency fractures, and impaired mobility."
    explanation: GeneReviews explicitly includes impaired mobility among adult manifestations.
  - reference: PMID:42429952
    reference_title: Insight into Natural History and Phenotype in Untreated Adults with X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe skeletal deformities with difficulty walking"
    explanation: The untreated adult cohort corroborates clinically important walking difficulty.
- name: Dental Abscesses and Periodontal Disease
  description: >-
    Endodontic abscesses may occur in clinically sound teeth; periapical disease,
    periodontitis and early tooth loss contribute substantial lifelong burden.
  phenotype_term:
    preferred_term: Tooth abscess
    term:
      id: HP:0030757
      label: Tooth abscess
  evidence:
  - reference: PMID:42409089
    reference_title: "Diagnosis and management of X-linked hypophosphatemia in dental practice: A scoping review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "frequent endodontic abscess in clinically sound teeth due to intrinsic structural failure, periapical lesions and early tooth loss"
    explanation: The dental review describes the characteristic infection pattern and consequences.
- name: Enthesopathy
  description: >-
    Calcification and ossification at tendon, ligament and joint-capsule
    attachments accumulate in adults. Its pathogenesis and relationship to
    primary XLH mechanisms remain unresolved, so it is not assigned a causal
    edge from osteomalacia.
  review_notes: >-
    NEEDS_TERM: HP:0100686 denotes inflammatory enthesitis and would misrepresent
    the calcific or ossifying enthesopathy of XLH; no suitably specific HPO term
    is assigned pending a dedicated ontology term.
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accelerated osteoarthritis, dental abscesses, and enthesopathy"
    explanation: The adult trial establishes the association without resolving causation.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "enthesopathies and to what extent these are sequelae of certain primary manifestations of XLH is poorly understood"
    explanation: The guideline explicitly marks the underlying causal interpretation as uncertain.
- name: Osteoarthritis
  description: >-
    Premature and progressive degenerative joint disease is common in adults,
    but whether it is a primary PHEX/FGF23 effect or secondary to altered
    biomechanics and deformity remains uncertain.
  phenotype_term:
    preferred_term: Premature osteoarthritis
    term:
      id: HP:0003088
      label: Premature osteoarthritis
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Adult patients with XLH may show pseudofractures due to osteomalacia as well as osteoarthritis, enthesopathies, spinal stenosis, hearing loss, depression and reduced quality of life"
    explanation: The guideline supports osteoarthritis as part of adult XLH burden.
- name: Craniosynostosis
  description: >-
    Premature cranial-suture fusion occurs in a subset of children and can be
    associated with abnormal skull shape or intracranial complications.
  phenotype_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  evidence:
  - reference: PMID:40220947
    reference_title: "Craniosynostosis among children with X-linked hypophosphatemia: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of craniosynostosis among children with XLH was 22 % (95 % confidence interval (CI) 9.0 % to 44 %)"
    explanation: Meta-analysis supports the association and its non-universal frequency.
- name: Hearing Impairment
  description: >-
    Sensorineural or other hearing impairment is reported, especially in adults;
    the direct inner-ear mechanism is not established here.
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "sensorineural hearing loss has also been reported"
    explanation: GeneReviews supports hearing loss as an associated manifestation without implying a settled mechanism.
- name: Spinal Canal Stenosis
  description: >-
    Spinal canal stenosis is a rare adult structural complication. Because its
    causal relationship to osteomalacia, enthesopathy and degenerative change is
    not resolved, it is not assigned a single pathophysiology edge.
  phenotype_term:
    preferred_term: Spinal canal stenosis
    term:
      id: HP:0003416
      label: Spinal canal stenosis
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rarely, individuals with XLH can suffer from spinal stenosis, Chiari I malformation, syringomyelia, and/or raised intracranial pressure."
    explanation: GeneReviews directly identifies spinal stenosis as a rare XLH manifestation.
- name: Hypophosphatemia
  description: >-
    Serum phosphate remains chronically below the age-related reference range
    because renal phosphate wasting persists throughout life.
  phenotype_term:
    preferred_term: Hypophosphatemia
    term:
      id: HP:0002148
      label: Hypophosphatemia
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "leading to lifelong renal phosphate wasting and hypophosphatemia"
    explanation: This establishes lifelong low serum phosphate as the core biochemical phenotype.
- name: Nephrocalcinosis
  description: >-
    Renal calcium deposition is observed in XLH cohorts and is particularly
    relevant as a treatment-associated complication during conventional oral
    phosphate and active vitamin D therapy. Cohort association alone does not
    establish that every case is treatment-caused.
  phenotype_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
  evidence:
  - reference: PMID:29460029
    reference_title: Outcome of adult patients with X-linked hypophosphatemia caused by PHEX gene mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dental disease (63%), nephrocalcinosis (42%), and hearing impairment (14%) were also common"
    explanation: The adult cohort supports prevalence of nephrocalcinosis but is not used alone to infer treatment causality.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Oral phosphate supplements and active vitamin D can also promote hyperparathyroidism and cause nephrocalcinosis in a dose-dependent manner"
    explanation: The guideline specifically identifies nephrocalcinosis as an adverse effect associated with conventional therapy.
genetic:
- name: Germline PHEX Pathogenic Variants
  gene_term:
    preferred_term: PHEX
    term:
      id: hgnc:8918
      label: PHEX
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Inactivating PHEX variants include deletions, splice variants, frameshifts,
    nonsense and missense alleles. Allelic heterogeneity is extensive. The
    causal gene-disease relationship is definitive, whereas the downstream
    molecular route to FGF23 excess remains incompletely resolved.
  evidence:
  - reference: PMID:7550339
    reference_title: "A gene (PEX) with homologies to endopeptidases is mutated in patients with X-linked hypophosphatemic rickets. The HYP Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intragenic non-overlapping deletions from four different families and three mutations (two splice sites and one frameshift) have been detected in HYP patients"
    explanation: The original positional-cloning study documents multiple independent disruptive PHEX alleles in affected families.
  - reference: PMID:11062477
    reference_title: Autosomal dominant hypophosphataemic rickets is associated with mutations in FGF23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivating mutations of the gene PHEX, encoding a member of the neutral endopeptidase family of proteins, are responsible for XLH"
    explanation: This independently states the inactivating PHEX disease mechanism.
  - reference: CGGV:assertion_7b966545-e9dc-4a75-8d6a-91b328bc4854-2025-05-15T060000.000Z
    reference_title: PHEX / X-linked dominant hypophosphatemic rickets (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PHEX | HGNC:8918 | X-linked dominant hypophosphatemic rickets | MONDO:0010619 | XL | Definitive"
    explanation: ClinGen classifies the PHEX-XLH gene-disease relationship as definitive with X-linked inheritance.
diagnosis:
- name: Integrated Clinical, Biochemical and Radiographic Evaluation
  diagnosis_term:
    preferred_term: Clinical Evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    In a growing child, consider XLH when rickets or impaired growth coexists
    with phosphate below the age-related reference range and isolated renal
    phosphate wasting after calcium and vitamin D deficiency are excluded. In
    adults, historical lower-limb deformity, osteomalacia or pseudofractures,
    early osteoarthritis, spinal disease, dental abscesses or enthesopathy can
    prompt the same biochemical evaluation.
  results: >-
    A compatible phenotype plus hypophosphatemia and renal phosphate wasting;
    non-suppressed intact FGF23 and an X-linked family history support the
    diagnosis but neither feature is individually specific.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In children and growing adolescents, a diagnosis of X-linked hypophosphataemia (XLH) should be considered in the presence of or if there is a history of clinical, biochemical, and/or radiological signs of rickets, impaired growth velocity and serum levels of phosphate below the age-related reference range associated with isolated renal phosphate wasting and in the absence of vitamin D or calcium deficiency"
    explanation: The guideline supplies the age-specific integrated diagnostic pattern for growing patients.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If molecular genetic analysis is not available, a family history of X-linked inheritance, as well as non-suppressed plasma levels of intact FGF23 in association with hypophosphataemia support the diagnosis of XLH"
    explanation: This supports a clinical-biochemical diagnosis when molecular confirmation is unavailable.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In adults and adolescents with closed growth plates, diagnosis of XLH should be considered in the presence of or if there is a history of lower-limb deformities, clinical, biochemical and/or radiological signs of osteomalacia (including pseudofractures, early osteoarthritis, spinal degeneration and stenosis, dental abscesses and enthesopathies) in the context of serum levels of phosphate below the age-related reference range associated with isolated renal phosphate wasting"
    explanation: The guideline supplies the adult integrated diagnostic pattern and its major historical clues.
- name: PHEX Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Molecular analysis of PHEX confirms the suspected diagnosis when a
    pathogenic hemizygous variant in a male or heterozygous variant in a female
    is identified. If PHEX testing is negative, reassess the phenotype and test
    for alternative genetic or acquired FGF23-mediated disorders rather than
    treating the negative result as exclusion of all hypophosphatemic disease.
  results: Pathogenic or likely pathogenic germline PHEX variant.
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis is established in a proband with characteristic clinical, biochemical, and radiographic findings by identification of a hemizygous PHEX pathogenic variant in a male proband or a heterozygous PHEX pathogenic variant in a female proband on molecular genetic testing."
    explanation: GeneReviews defines the molecular confirmation pattern in the context of compatible clinical findings.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend that other causes of genetic (DMP1, ENPP1, FGF23) or acquired forms of hypophosphataemia (such as tumour-induced osteomalacia) be considered if the analysis of the PHEX gene yields a negative result"
    explanation: The updated guideline defines the required next step after negative PHEX testing.
biochemical:
- name: Low Serum Phosphate
  presence: Decreased below the age-related reference range
  context: >-
    Interpret phosphate using age-appropriate reference intervals and sampling
    context; fasting sampling is recommended in adults.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "serum levels of phosphate below the age-related reference range associated with isolated renal phosphate wasting"
    explanation: This is the core biochemical diagnostic combination.
- name: Reduced TmP/GFR and Renal Phosphate Wasting
  presence: Decreased tubular phosphate reabsorption
  context: >-
    Calculate TmP/GFR from paired serum and urine phosphate and creatinine;
    interpret with age-adjusted reference values, especially in children.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "urinary levels of calcium, phosphate and creatinine for calculation of the tubular maximum reabsorption of phosphate per glomerular filtration rate (TmP/GFR) and urinary calcium to creatinine ratio"
    explanation: The guideline specifies the measurements used to establish renal phosphate wasting and assess calcium excretion.
- name: Intact FGF23
  presence: Inappropriately non-suppressed or elevated during hypophosphatemia
  specificity: >-
    Supports an FGF23-mediated process but does not by itself distinguish XLH
    from ADHR, ARHR, tumor-induced osteomalacia or other FGF23-mediated causes.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "If FGF23 levels are not suppressed, the differential diagnosis is limited to a few diseases, with XLH (OMIM#307800) being the most frequent"
    explanation: The guideline supports inappropriately non-suppressed FGF23 as a discriminant for an FGF23-mediated differential, not as an XLH-specific test.
- name: Alkaline Phosphatase
  presence: Elevated with active rickets or osteomalacia
  context: >-
    Total ALP in children and total or bone-specific ALP in adults is used to
    assess mineralization disease activity and response; interpret against
    age-related ranges.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "children and adolescents (aged 1-17 years) with X-linked hypophosphataemia (XLH) and signs of rickets including leg deformities, elevated total ALP, and/or radiological evidence of rickets"
    explanation: The guideline identifies elevated ALP as one indicator of active pediatric rickets.
- name: 1,25-Dihydroxyvitamin D
  presence: Inappropriately low or normal for the degree of hypophosphatemia
  context: >-
    FGF23 suppresses synthesis and increases degradation, blunting the usual
    calcitriol response to low phosphate.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a decrease in 1,25-dihydroxyvitamin D (1,25(OH)2D) synthesis and an increase in 1,25(OH)2D degradation in the proximal renal tubules"
    explanation: This directly supports the direction of calcitriol dysregulation.
imaging_findings:
- name: Radiographic Rickets
  modality: XRAY
  imaging_finding_term:
    preferred_term: Rickets
    term:
      id: HP:0002748
      label: Rickets
  diagnostic: false
  context: Growing children with suspected or active rickets
  description: >-
    Wrist, knee or ankle radiographs demonstrate and grade active rickets;
    radiographic severity is supportive but not specific for XLH.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Wrist and/or knee and/or ankle radiographs (rickets) in growing patients"
    explanation: The guideline specifies the radiographic sites used to evaluate pediatric rickets.
- name: Lower-Limb Malalignment
  modality: XRAY
  imaging_finding_term:
    preferred_term: Bowing of the legs
    term:
      id: HP:0002979
      label: Bowing of the legs
  diagnostic: false
  context: Standing alignment assessment in children or adults with deformity
  description: >-
    A standardized standing anteroposterior limb-alignment radiograph defines

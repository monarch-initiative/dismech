  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Standardized, well-positioned anterior-posterior standing limb alignment radiograph"
    explanation: The guideline directly recommends standardized limb-alignment imaging.
- name: Pseudofracture or Insufficiency-Fracture Line
  modality: XRAY
  diagnostic: false
  context: Adults with focal bone pain or suspected osteomalacia
  description: >-
    Plain radiographs of symptomatic sites can reveal unhealed fracture or
    Looser-zone pseudofracture lines, indicating active osteomalacia rather than
    a pathognomonic XLH finding.
  evidence:
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, 43.1% (burosumab) and 7.7% (placebo) of baseline active fractures were fully healed"
    explanation: Trial radiographic assessment documents active baseline fracture and pseudofracture lesions and their healing.
- name: Cranial-Suture Fusion
  imaging_finding_term:
    preferred_term: Craniosynostosis
    term:
      id: HP:0001363
      label: Craniosynostosis
  diagnostic: false
  context: Abnormal skull shape or symptoms of intracranial hypertension
  description: >-
    Skull or brain imaging confirms craniosynostosis and evaluates associated
    intracranial or craniocervical complications when clinical signs warrant it.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend a complete evaluation with fundoscopy and brain or skull imaging in any patient with XLH presenting with a skull morphology suggestive of craniosynostosis or clinical symptoms of intracranial hypertension"
    explanation: The guideline limits cranial imaging to a clinically indicated setting rather than routine imaging of every patient.
- name: Nephrocalcinosis on Renal Ultrasound
  modality: ULTRASOUND
  imaging_finding_term:
    preferred_term: Nephrocalcinosis
    term:
      id: HP:0000121
      label: Nephrocalcinosis
  diagnostic: false
  context: Surveillance during conventional therapy or when hypercalciuria is present
  description: >-
    Renal ultrasonography detects calcium deposition as a complication relevant
    to long-term phosphate and active vitamin D exposure; it is not a diagnostic
    criterion for XLH.
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "periodic renal ultrasound examination to assess for nephrocalcinosis"
    explanation: GeneReviews supports renal ultrasound surveillance in conventionally treated patients.
differential_diagnoses:
- name: Autosomal Dominant Hypophosphatemic Rickets
  disease_term:
    preferred_term: autosomal dominant hypophosphatemic rickets
    term:
      id: MONDO:0008660
      label: autosomal dominant hypophosphatemic rickets
  description: >-
    ADHR is another FGF23-mediated phosphate-wasting rickets disorder and can
    overlap biochemically with XLH.
  distinguishing_features:
  - Autosomal dominant rather than X-linked transmission.
  - Pathogenic FGF23 variants rather than PHEX variants.
  - Non-suppressed FGF23 does not distinguish ADHR from XLH, so pedigree and molecular testing are important.
  evidence:
  - reference: PMID:11062477
    reference_title: Autosomal dominant hypophosphataemic rickets is associated with mutations in FGF23.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified missense mutations in a gene encoding a new member of the fibroblast growth factor (FGF) family, FGF23"
    explanation: The ADHR discovery study identifies FGF23 as its disease gene; it is not used as proof of the PHEX-to-FGF23 molecular link.
- name: Autosomal Recessive Hypophosphatemic Rickets
  disease_term:
    preferred_term: autosomal recessive hypophosphatemic rickets
    term:
      id: MONDO:0017324
      label: autosomal recessive hypophosphatemic rickets
  description: >-
    DMP1- and ENPP1-related recessive disorders can produce FGF23-mediated renal
    phosphate wasting, rickets and osteomalacia similar to XLH.
  distinguishing_features:
  - Autosomal recessive pedigree rather than X-linked transmission.
  - Biallelic DMP1 or ENPP1 pathogenic variants rather than a PHEX variant.
  - Extra-skeletal features of the specific recessive disorder may redirect testing.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "autosomal-recessive hypophosphataemic rickets 1 (OMIM#241520)"
    explanation: The updated recommendations explicitly include autosomal-recessive hypophosphataemic rickets in the non-suppressed-FGF23 differential.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "other causes of genetic (DMP1, ENPP1, FGF23) or acquired forms of hypophosphataemia (such as tumour-induced osteomalacia) be considered if the analysis of the PHEX gene yields a negative result"
    explanation: This directs gene-specific evaluation of DMP1- and ENPP1-related alternatives after negative PHEX testing.
- name: Tumor-Induced Osteomalacia
  disease_term:
    preferred_term: Oncogenic osteomalacia
    term:
      id: MONDO:0018124
      label: Oncogenic osteomalacia
  description: >-
    An acquired FGF23-secreting tumor can reproduce the adult biochemical and
    osteomalacic phenotype of XLH.
  distinguishing_features:
  - Acquired FGF23-mediated presentation rather than X-linked transmission.
  - No causative germline PHEX variant.
  - Identification of an FGF23-secreting tumor establishes the acquired cause.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "other causes of genetic (DMP1, ENPP1, FGF23) or acquired forms of hypophosphataemia (such as tumour-induced osteomalacia) be considered if the analysis of the PHEX gene yields a negative result"
    explanation: The guideline specifically directs consideration of tumor-induced osteomalacia after negative PHEX testing.
- name: Hereditary Hypophosphatemic Rickets with Hypercalciuria
  disease_term:
    preferred_term: hereditary hypophosphatemic rickets with hypercalciuria
    term:
      id: MONDO:0009431
      label: hereditary hypophosphatemic rickets with hypercalciuria
  description: >-
    HHRH is a primary renal tubular phosphate-transport disorder rather than an
    FGF23-excess disorder.
  distinguishing_features:
  - Low or suppressed FGF23 during hypophosphatemia.
  - Hypercalciuria and an increased calcitriol response favor HHRH over XLH.
  - Biallelic SLC34A3 variants establish the common genetic form.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary hypophosphataemic rickets with hypercalciuria ... These diseases are characterized by low or suppressed levels of FGF23."
    explanation: The guideline places HHRH among primary transporter-mediated disorders and describes the group as having low or suppressed FGF23.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "urinary calcium excretion and 1,25(OH) 2D levels help to distinguish between FGF23-mediated diseases and primary tubular phosphate wasting ... increased levels of 1,25(OH)2D and hypercalciuria"
    explanation: This directly supports the high-calcitriol, hypercalciuric and suppressed-FGF23 pattern of transporter-mediated phosphate wasting.
- name: Fanconi Renotubular Syndrome
  disease_term:
    preferred_term: Fanconi renotubular syndrome
    term:
      id: MONDO:0001083
      label: Fanconi renotubular syndrome
  description: >-
    Generalized proximal tubular dysfunction can cause hypophosphatemic rickets
    but is not isolated to phosphate handling.
  distinguishing_features:
  - Metabolic acidosis or bicarbonate wasting.
  - Urinary glucose, amino acids and low-molecular-weight proteins in addition to phosphate.
  - Low or suppressed FGF23 during hypophosphatemia.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "metabolic acidosis, hypercalciuria and renal Fanconi syndrome (that is, proximal renal tubular wasting that is not restricted to phosphate) should be excluded by measuring serum bicarbonate levels, and urinary excretion of calcium, amino acids, glucose and low-molecular-weight protein markers"
    explanation: This provides the specific biochemical tests that distinguish generalized Fanconi wasting from isolated XLH phosphate wasting.
- name: Calcipenic or Nutritional Rickets
  description: >-
    Vitamin D or calcium deficiency can produce rickets and elevated alkaline
    phosphatase without the isolated FGF23-mediated renal phosphate-wasting
    pattern of XLH.
  distinguishing_features:
  - Vitamin D or calcium deficiency and high PTH activity favor calcipenic rickets.
  - Renal phosphate loss is secondary to PTH rather than inappropriately non-suppressed FGF23.
  - Correction of the nutritional or mineral deficiency separates it from inherited XLH.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The differential diagnosis of XLH is based on the mechanisms leading to hypophosphataemia ... high parathyroid hormone (PTH) activity (leading to calcipenic rickets)"
    explanation: The guideline distinguishes calcipenic from phosphopenic mechanisms at the start of the diagnostic work-up.
treatments:
- name: Burosumab
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Burosumab is a fully human monoclonal antibody that neutralizes FGF23. The
    comparative pediatric phase 3 evidence enrolled children aged 1-12 years
    with persistent rickets (RSS at least 2), hypophosphatemia and substantial
    prior conventional therapy; it did not directly establish superiority in
    mild rickets or adolescents. Updated recommendations support use in children
    and adolescents aged 1-17 years with signs of rickets. The adult placebo
    trial enrolled symptomatic adults with hypophosphatemia and pain and showed
    phosphate correction, greater fracture healing and reduced stiffness, while
    pain and physical-function comparisons did not survive multiplicity
    adjustment. A 2026 study in 16 infants younger than 12 months provides small,
    open-label, non-randomized safety evidence, not comparative efficacy or a
    universal authorization boundary; eligibility and labeling remain
    jurisdiction-specific. Burosumab is not co-administered with oral phosphate
    or active vitamin D and is avoided when baseline phosphate is normal or
    renal impairment is severe. Guidance recommends contraception during
    treatment for patients who could become pregnant and stopping burosumab
    when pregnancy is planned or identified. During lactation, the updated
    guideline does not treat burosumab as categorically contraindicated, but
    limits consideration to severe manifestations after individualized
    counselling.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: burosumab
      term:
        id: NCIT:C119744
        label: Burosumab
  target_mechanisms:
  - target: Excess Bone-Derived FGF23 Signaling
    treatment_effect: INHIBITS
    description: Burosumab binds circulating FGF23 and reduces its phosphaturic signaling.
    evidence:
    - reference: PMID:29947083
      reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Burosumab, a fully human monoclonal antibody, binds and inhibits FGF23 to correct hypophosphatemia."
      explanation: This directly supports the on-target antibody mechanism.
  evidence:
  - reference: PMID:31104833
    reference_title: "Burosumab versus conventional therapy in children with X-linked hypophosphataemia: a randomised, active-controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we enrolled children with X-linked hypophosphataemia aged 1-12 years. Key eligibility criteria were a total Thacher rickets severity score of at least 2.0, fasting serum phosphorus lower than 0.97 mmol/L (3.0 mg/dL), confirmed PHEX (phosphate-regulating endopeptidase homolog, X-linked) mutation or variant of unknown significance in the patient or a family member with appropriate X-linked dominant inheritance, and receipt of conventional therapy for at least 6 consecutive months for children younger than 3 years or at least 12 consecutive months for children older than 3 years."
    explanation: This records the pediatric comparative trial's actual severity, biochemical, genetic and prior-treatment enrollment boundaries.
  - reference: PMID:31104833
    reference_title: "Burosumab versus conventional therapy in children with X-linked hypophosphataemia: a randomised, active-controlled, open-label, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significantly greater clinical improvements were shown in rickets severity, growth, and biochemistries among children with X-linked hypophosphataemia treated with burosumab compared with those continuing conventional therapy."
    explanation: This supports superiority within the enrolled pediatric trial population.
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At week 24, 43.1% (burosumab) and 7.7% (placebo) of baseline active fractures were fully healed; the odds of healed fracture in the burosumab group was 16.8-fold greater than that in the placebo group"
    explanation: This quantifies adult fracture healing without qualitative overstatement.
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Burosumab significantly reduced the Western Ontario and the McMaster Universities Osteoarthritis Index (WOMAC) stiffness subscale compared with placebo"
    explanation: This directly supports the adult stiffness outcome within the 24-week trial setting.
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reductions in WOMAC physical function subscale (-4.9 +/- 2.48; p = 0.048) and Brief Pain Inventory worst pain (-0.5 +/- 0.28; p = 0.092) did not achieve statistical significance after Hochberg multiplicity adjustment."
    explanation: This preserves the adult trial's negative multiplicity-adjusted pain and physical-function results.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "As children with XLH and mild-moderate rickets (RSS <2.0) and adolescent patients with XLH were excluded from the RCT, whether burosumab treatment is also superior to oral phosphate and active vitamin D in these groups is unclear."
    explanation: The guideline explicitly limits extrapolation of pediatric comparative superiority.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend treating children and adolescents (aged 1-17 years) with X-linked hypophosphataemia (XLH) and signs of rickets including leg deformities, elevated total ALP, and/or radiological evidence of rickets with burosumab as soon as the diagnosis is established"
    explanation: This supplies the guideline's recommended pediatric age and disease-activity setting, distinct from the narrower RCT population.
  - reference: PMID:29947083
    reference_title: "A Randomized, Double-Blind, Placebo-Controlled, Phase 3 Trial Evaluating the Efficacy of Burosumab, an Anti-FGF23 Antibody, in Adults With X-Linked Hypophosphatemia: Week 24 Primary Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants with hypophosphatemia and pain were assigned 1:1 to burosumab 1 mg/kg (n = 68) or placebo (n = 66) subcutaneously every 4 weeks (Q4W)"
    explanation: This records the symptomatic, hypophosphatemic adult setting of the placebo-controlled trial.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Burosumab must not be given in conjunction with oral phosphate or active vitamin D, when fasting phosphate levels are within the age-related normal reference range before initiation of treatment or when severe renal impairment is present"
    explanation: The guideline states the principal co-treatment, biochemical and renal boundaries for burosumab use.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend contraceptive measures in sexually active fertile women on burosumab treatment ... Treatment with burosumab should be stopped when a woman plans pregnancy or when pregnancy is identified"
    explanation: The guideline directly supplies contraception and planned or identified pregnancy boundaries.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Burosumab is not recommended during pregnancy."
    explanation: GeneReviews independently advises against burosumab use during pregnancy.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Burosumab is not contraindicated in breast-feeding women. Burosumab treatment may be considered in breast-feeding women with severe manifestations including pseudofractures on an individual basis after counselling"
    explanation: This records the guideline's conditional lactation position without generalizing it to routine use.
  - reference: PMID:42044650
    reference_title: "Safety, tolerability, pharmacokinetics, and efficacy of burosumab in infants with X-linked hypophosphataemia: an open-label, multicentre, non-randomised study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This open-label, non-randomised, phase 1/2 study included infants from clinical sites in Austria, France, Italy, Spain and the UK."
    explanation: This establishes the non-comparative design and European clinical setting of the infant study.
  - reference: PMID:42044650
    reference_title: "Safety, tolerability, pharmacokinetics, and efficacy of burosumab in infants with X-linked hypophosphataemia: an open-label, multicentre, non-randomised study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 17 participants assessed for eligibility, 16 were enrolled and assigned to cohorts 1, 2, and 3"
    explanation: The very small sample bounds inference about infant safety and does not establish comparative efficacy.
  - reference: PMID:42044650
    reference_title: "Safety, tolerability, pharmacokinetics, and efficacy of burosumab in infants with X-linked hypophosphataemia: an open-label, multicentre, non-randomised study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No TEAEs led to treatment discontinuation or death."
    explanation: This supplies a bounded short-term safety observation from the 16-infant study without implying long-term or comparative safety.
  - reference: PMID:42044650
    reference_title: "Safety, tolerability, pharmacokinetics, and efficacy of burosumab in infants with X-linked hypophosphataemia: an open-label, multicentre, non-randomised study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Burosumab, a human anti-fibroblast growth factor 23 monoclonal antibody, is approved in Europe for treating X-linked hypophosphataemia (XLH) in patients aged at least 1 year."
    explanation: The study background records the European age boundary while the description avoids universalizing it across jurisdictions.
- name: Oral Phosphate with Active Vitamin D
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Conventional therapy combines divided oral phosphate with calcitriol or
    alfacalcidol. It can improve rickets, some manifestations of osteomalacia
    and pain but only partially corrects disease and does not make fasting serum
    phosphate the dosing target. Dose adjustment follows clinical and
    radiographic response, alkaline phosphatase and PTH while balancing
    gastrointestinal intolerance, hyperparathyroidism, hypercalciuria and
    nephrocalcinosis. Phosphate should not be given without active vitamin D;
    active vitamin D alone can cause
    hypercalcemia, hypercalciuria and nephrocalcinosis. It remains an important
    option when burosumab is unavailable or unsuitable and for selected
    symptomatic adults.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phosphate
      term:
        id: CHEBI:26020
        label: phosphate
    - preferred_term: calcitriol
      term:
        id: CHEBI:17823
        label: calcitriol
    - preferred_term: alfacalcidol
      term:
        id: CHEBI:31186
        label: alfacalcidol
  target_mechanisms:
  - target: Reduced Circulating Phosphate
    treatment_effect: MODULATES
    description: Divided phosphate doses transiently increase available phosphate without correcting upstream FGF23 excess.
  - target: Skeletal Mineralization Failure
    treatment_effect: MODULATES
    description: Active vitamin D promotes intestinal mineral absorption and, with phosphate, partially improves rickets and osteomalacia.
    evidence:
    - reference: PMID:39814982
      reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "oral medication improves bone pain, radiological signs of rickets and serum ALP levels within 12 months"
      explanation: The guideline supports partial downstream skeletal and biochemical improvement with conventional oral treatment.
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Serum phosphate levels remain low despite oral supplementation and are not a target for adjusting therapy, which requires the primary goal of achieving a satisfactory clinical response to be balanced with the risk of developing nephrocalcinosis and hyperparathyroidism"
    explanation: This defines both the response target and principal monitoring trade-off for conventional therapy.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment with phosphate without 1,25-dihydroxyvitamin D, because of the increased risk for secondary hyperparathyroidism."
    explanation: GeneReviews explicitly warns against phosphate monotherapy.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although 1,25-dihydroxyvitamin D has been used as a single agent, this may increase the risk for hypercalcemia, hypercalciuria, and nephrocalcinosis."
    explanation: This supports the risks of active vitamin D monotherapy.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend beginning treatment with active vitamin D together with oral phosphorus (phosphate salts) in patients with biochemical and/or clinical signs of osteomalacia, musculoskeletal pain or stiffness"
    explanation: This directly defines the symptomatic adult setting for conventional phosphate and active-vitamin-D therapy.
- name: Avoid Unindicated Bisphosphonate or Osteoporosis Medication
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    GeneReviews cautions that bisphosphonates and other osteoporosis medicines
    can worsen osteomalacia in some individuals with XLH. Low bone density or
    fractures should therefore not prompt empiric osteoporosis treatment
    without first distinguishing active osteomalacia and establishing a
    separate indication; this is a caution rather than a universal
    contraindication in every clinical context.
  treatment_term:
    preferred_term: avoidance of contraindicated medications
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bisphosphonates or osteoporosis medications may cause deterioration of osteomalacia in some individuals."
    explanation: GeneReviews supplies the direct agents-to-avoid caution while retaining its conditional wording.
- name: Multidisciplinary Surveillance
  action_category: MONITORING
  description: >-
    Follow-up should be coordinated by a metabolic-bone team and include growth,
    lower-limb alignment, pain, mobility and dental review; serum phosphate,
    calcium, creatinine, ALP, PTH and vitamin D measures; and treatment-specific
    monitoring. Conventional therapy requires urinary calcium and renal
    ultrasonography for hypercalciuria/nephrocalcinosis. Burosumab dosing uses
    timed phosphate and TmP/GFR rather than FGF23 assays. Imaging is driven by
    rickets response, deformity, focal pain or neurological concern, and dental
    evaluation is recommended every six months.
  evidence:
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For individuals on burosumab therapy, regular monitoring of serum concentrations of phosphate, calcium, creatinine, alkaline phosphatase, and intact parathyroid hormone."
    explanation: GeneReviews specifies the core biochemical surveillance during burosumab treatment.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For those on conventional treatment with active vitamin D and phosphate supplementation, additional testing includes urinary calcium and creatinine to assess for hypercalciuria; periodic renal ultrasound examination to assess for nephrocalcinosis."
    explanation: This supports the additional renal safety surveillance required with conventional therapy.
  - reference: PMID:22319799
    reference_title: X-Linked Hypophosphatemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "dental evaluation every six months; hearing evaluation and evaluation for Chiari I malformation performed based on clinical suspicion"
    explanation: This supports six-month dental review and symptom-directed hearing or neurological evaluation.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Measuring FGF23 concentrations to monitor treatment efficacy is not recommended because burosumab interferes with the analytical assays"
    explanation: This supports avoiding FGF23 assays for burosumab response monitoring.
- name: Orthopedic and Joint Surgery
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Persistent mechanically important lower-limb deformity or functional
    symptoms can require guided growth or corrective osteotomy after metabolic
    therapy has been optimized for at least 3-6 months. In growing children on
    burosumab, elective surgery may be delayed because alignment can continue to
    improve; guided growth requires adequate growth remaining, whereas later
    osteotomy has fewer recurrence concerns. Adults require the same metabolic
    optimization and expert multidisciplinary planning; joint replacement is
    reserved for function-limiting osteoarthritis despite medical treatment and
    rehabilitation. Emergency fracture fixation should not be delayed when
    necessary.
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "elective surgical treatment should be performed only in children in whom medical treatment either with oral phosphate and active vitamin D or burosumab has been optimized for at least 3-6 months"
    explanation: The guideline establishes preoperative metabolic optimization for children.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "persisting deformity (mechanical axis deviation zone 2 or greater) despite optimized medical treatment and/or the presence of symptoms interfering with function should be considered for surgical treatment"
    explanation: This defines the deformity and functional setting for elective pediatric surgery.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend considering postponing surgery in children on burosumab, if possible, because sustained straightening of legs is expected for at least 3 years after initiation of this treatment in patients with growth potential"
    explanation: This supports allowing time for continued alignment response in growing children receiving burosumab.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Guided growth techniques depend on the remaining growth potential of the child and must therefore be carried out at least 2-3 years before skeletal maturity"
    explanation: This supports age-sensitive selection of guided-growth surgery rather than a blanket near-maturity rule.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Joint replacement by prosthesis should be performed in case of physical function impairment due to osteoarthritis despite optimal medical treatment and rehabilitation"
    explanation: This defines the adult joint-replacement setting.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "surgical treatment should be performed in adults in whom medical treatment either with oral phosphate and active vitamin D or burosumab has been optimized for at least several months ... surgery should be performed by a surgeon with expertise in metabolic bone diseases"
    explanation: This supports adult metabolic optimization and specialist surgical planning.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We recommend that emergency surgical treatment such as fracture fixation should occur when necessary"
    explanation: This distinguishes urgent fracture fixation from elective deformity correction that can await metabolic optimization.
- name: Preventive and Specialist Dental Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  description: >-
    Dental management complements systemic metabolic therapy. Children need
    standard prevention plus six-month visits and repeated pit-and-fissure
    sealing as needed; discoloration, fistula, swelling, abscess, cellulitis or
    pain prompts pulpal and periapical assessment. Adults need twice-yearly
    periodontal risk assessment and debridement when indicated. Systemic therapy
    should be optimized before orthodontic treatment or implant surgery, with
    prolonged healing plans for implants.
  treatment_term:
    preferred_term: Dental Procedure
    term:
      id: NCIT:C38052
      label: Dental Procedure
  target_phenotypes:
  - preferred_term: Tooth abscess
    term:
      id: HP:0030757
      label: Tooth abscess
  evidence:
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In children, in addition to standard preventive care, we recommend dental visits every 6 months and suggest sealing pits and fissures with flowable resin composite on both temporary and permanent teeth as soon and as frequently as required"
    explanation: This directly supports the pediatric preventive schedule and sealing intervention.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We suggest a thorough clinical investigation searching for pulp infection (colour changes, fistula, swelling, abscess, cellulitis or pain) and performing retrocoronal and/or periapical radiographs or orthopantomogram"
    explanation: This directly supports symptom-triggered pulpal and periapical assessment.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In children, we suggest optimizing therapy with phosphate and active vitamin D or burosumab before initiation of orthodontic treatment"
    explanation: This supports metabolic optimization before pediatric orthodontic treatment.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In adults, we recommend twice-yearly visits to perform conventional supportive periodontal therapy, which should include periodontal risk assessment and supragingival and subgingival debridement if necessary"
    explanation: This directly supports adult periodontal surveillance and treatment.
  - reference: PMID:42409089
    reference_title: "Diagnosis and management of X-linked hypophosphatemia in dental practice: A scoping review."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Key recommendations highlight that interdisciplinary management is critical to reducing complications and improving long-term oral health."
    explanation: The 2026 scoping review supports interdisciplinary dental management but is not treated as comparative trial evidence.
  - reference: PMID:39814982
    reference_title: Clinical practice recommendations for the diagnosis and management of X-linked hypophosphataemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In adults, we suggest that dental implant surgery should be performed after at least 3 months of medical treatment, which should be continued for 6 months following implant surgery; healing time should be extended up to 6 months"
    explanation: This supplies the guideline's medical-optimization and healing-time boundaries for adult implant surgery.
- name: Rehabilitation and Symptom-Directed Support
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physiotherapy, rehabilitation, adapted activity and analgesic or pain-clinic
    support address weakness, deconditioning, impaired mobility and chronic pain.
    These interventions are adjunctive and do not correct FGF23-mediated
    phosphate wasting.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care

pathophysiology:
- name: PLPHP Deficiency
  description: >-
    Biallelic loss-of-function variants in PLPBP reduce or abolish the
    pyridoxal 5'-phosphate homeostasis protein (PLPHP). Most reported missense
    variants misfold or destabilize the protein, or reduce its bound PLP.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PLPBP
    term:
      id: hgnc:9457
      label: PLPBP
  molecular_functions:
  - preferred_term: pyridoxal phosphate binding
    term:
      id: GO:0030170
      label: pyridoxal phosphate binding
    modifier: DECREASED
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent sequencing of 29 unrelated indivduals with pyridoxine-responsive epilepsy identified four additional children with biallelic PROSC mutations."
    explanation: >-
      The founding study found biallelic PROSC (now PLPBP) variants in children
      with pyridoxine-responsive epilepsy. The snippet keeps the abstract's
      own spelling of "indivduals".
  - reference: PMID:29689137
    reference_title: "Insight into vitamin B(6) -dependent epilepsy due to PLPBP (previously PROSC) missense mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, the six missense mutations caused ill effects and five of them impaired folding or decreased stability"
    explanation: >-
      Recombinant protein studies show that patient missense variants damage
      PLPHP folding or stability.
  downstream:
  - target: Disturbed Intracellular PLP Homeostasis
    causal_link_type: DIRECT
    description: >-
      Without PLPHP, cells cannot keep intracellular PLP at its normal level.
    evidence:
    - reference: PMID:37451483
      reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "intracellular pyridoxal 5'-phosphate (PLP) was lower in PLPHP-deficient fibroblasts and HEK293 cells than controls"
      explanation: >-
        PLPHP-deficient patient fibroblasts and knockout HEK293 cells have lower
        intracellular PLP than controls, whatever B6 vitamer they are given.
- name: Disturbed Intracellular PLP Homeostasis
  description: >-
    PLPHP-deficient cells have lower intracellular PLP, accumulate pyridoxine
    5'-phosphate and pyridoxamine 5'-phosphate, and turn PLP over faster
    through hydrolysis to pyridoxal. The exact function of PLPHP is not settled,
    and the first fibroblast study found PLP accumulation rather than depletion,
    so the direction of the cellular change depends on the system measured.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: vitamin B6 metabolic process
    term:
      id: GO:0042816
      label: vitamin B6 metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "revealed increased fractional turnovers of PLP and pyridoxal, indicating increased PLP hydrolysis to pyridoxal in PLPHP-deficient cells"
    explanation: >-
      Isotope tracing in PLPHP-deficient cells shows faster PLP turnover by
      hydrolysis, one of the homeostatic changes this node describes.
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, cultured fibroblasts showed excessive PLP accumulation."
    explanation: >-
      The founding study found too much, not too little, PLP in cultured patient
      fibroblasts. It contradicts the direction of the cellular change, though
      not the claim that PLP homeostasis is disturbed.
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using mass spectrometry, we observed significant B6 vitamer level changes in plpbp-/- zebrafish, patient fibroblasts and PLPHP-deficient HEK293 cells."
    explanation: >-
      B6 vitamer levels change in the zebrafish knockout as well as in patient
      and engineered human cells. Graded MODEL_ORGANISM for the zebrafish
      measurement.
  downstream:
  - target: Cerebral PLP Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The disturbed cellular PLP handling results in low PLP in the central
      nervous system. How the cellular change produces the CSF deficit is not
      established.
  - target: Glycine Cleavage System Inhibition by Pyridoxine 5'-Phosphate
    causal_link_type: DIRECT
    description: >-
      Loss of PLPHP lets pyridoxine 5'-phosphate (PNP), which is normally
      undetectable, accumulate inside cells.
    evidence:
    - reference: PMID:34978460
      reference_title: "Mechanism of Pyridoxine 5'-Phosphate Accumulation in Pyridoxal 5'-Phosphate-Binding Protein Deficiency."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: OTHER
      snippet: "Loss of this protein in organisms such as Escherichia coli and humans disrupts the vitamin B6 pool and induces intracellular accumulation of pyridoxine 5'-phosphate (PNP), which is normally undetectable in wild-type cells."
      explanation: >-
        States that PLPBP loss causes PNP accumulation in E. coli and human
        cells. The sentence summarizes earlier work in the paper's
        introduction, so it is graded OTHER with quote_role BACKGROUND.
    - reference: PMID:37451483
      reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Culturing cells with pyridoxine or pyridoxamine led to the concentration-dependent accumulation of pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate (PMP), respectively"
      explanation: PLPHP-deficient human cells given pyridoxine accumulate PNP.
  - target: Impaired Mitochondrial Oxidative Metabolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PLPHP deficiency alters mitochondrial PLP and pyridoxamine 5'-phosphate,
      which may impair PLP-dependent mitochondrial transaminases and, through
      them, oxidative metabolism.
    evidence:
    - reference: PMID:37451483
      reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PLPHP deficiency had a distinct effect on mitochondrial PLP and PMP, suggesting impaired activity of mitochondrial transaminases."
      explanation: >-
        Links the PLPHP-dependent change in mitochondrial B6 vitamers to the
        mitochondrial enzymes the authors propose are impaired. The authors
        frame the transaminase step as a hypothesis.
- name: Cerebral PLP Deficiency
  description: >-
    Before treatment, cerebrospinal fluid PLP is low, with biochemical signs of
    reduced activity of PLP-dependent enzymes.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-treatment cerebrospinal fluid samples showed low PLP concentrations and evidence of reduced activity of PLP-dependent enzymes."
    explanation: Patient CSF shows low PLP before vitamin B6 treatment.
  downstream:
  - target: Impaired PLP-Dependent Neurotransmitter Synthesis
    causal_link_type: DIRECT
    description: >-
      PLP is the cofactor for glutamate decarboxylase (GABA synthesis) and
      aromatic L-amino acid decarboxylase (catecholamine and serotonin
      synthesis), so a PLP shortfall lowers neurotransmitter synthesis.
    evidence:
    - reference: PMID:27912044
      reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Pre-treatment cerebrospinal fluid samples showed low PLP concentrations and evidence of reduced activity of PLP-dependent enzymes."
      explanation: >-
        The same patient CSF samples show both the PLP deficit and reduced
        activity of the PLP-dependent enzymes downstream of it.
- name: Impaired PLP-Dependent Neurotransmitter Synthesis
  description: >-
    GABA and catecholamine biosynthesis fall when PLP-dependent decarboxylases
    lack their cofactor. Loss of GABA synthesis reduces inhibitory tone in
    developing cortical circuits.
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: GABA biosynthetic process
    term:
      id: GO:0009449
      label: GABA biosynthetic process
    modifier: DECREASED
  - preferred_term: catecholamine biosynthetic process
    term:
      id: GO:0042423
      label: catecholamine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Larvae had disruptions in amino acid metabolism as well as GABA and catecholamine biosynthesis, indicating impairment of PLP-dependent enzymatic activities."
    explanation: >-
      plpbp knockout zebrafish larvae show reduced GABA and catecholamine
      synthesis, attributed to impaired PLP-dependent enzymes.
  downstream:
  - target: Neuronal Hyperexcitability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced inhibitory tone renders neonatal networks hyperexcitable.
    evidence:
    - reference: PMID:30671974
      reference_title: "Disorders affecting vitamin B(6) metabolism."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Because of the vital role of PLP in neurotransmitter metabolism, particularly synthesis of the inhibitory transmitter γ-aminobutyric acid, it is not surprising that various inborn errors leading to PLP deficiency manifest as B6 -responsive epilepsy, usually of early onset."
      explanation: >-
        Review linking PLP-dependent GABA synthesis to the epilepsy of PLP
        deficiency disorders. Evidence source is OTHER because this is a
        review article.
- name: Neuronal Hyperexcitability
  description: >-
    Networks with reduced GABAergic inhibition become hyperexcitable and
    hypersynchronous, generating seizures.
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our model recapitulates the disease, with plpbp-/- larvae showing behavioural, biochemical, and electrophysiological signs of seizure activity by 10 days post-fertilization and early death by 16 days post-fertilization."
    explanation: >-
      plpbp knockout zebrafish develop electrophysiological seizure activity.
  downstream:
  - target: Neonatal-Onset Seizures
    causal_link_type: DIRECT
    description: Hyperexcitable networks generate the neonatal-onset seizures.
- name: Glycine Cleavage System Inhibition by Pyridoxine 5'-Phosphate
  description: >-
    Accumulated PNP competes with PLP for the P-protein of the glycine cleavage
    system and inhibits glycine breakdown. This is shown in E. coli lacking the
    PLPBP ortholog yggS and has not been tested in patients; it is a candidate
    explanation for the hyperglycinemia seen in PLPBP deficiency.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: glycine decarboxylation via glycine cleavage system
    term:
      id: GO:0019464
      label: glycine decarboxylation via glycine cleavage system
    modifier: DECREASED
  evidence:
  - reference: PMID:31677193
    reference_title: "Inhibition of glycine cleavage system by pyridoxine 5'-phosphate causes synthetic lethality in glyA yggS and serA yggS in Escherichia coli."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical assays confirmed that PNP disrupts the GCV system by competing with PLP in GcvP protein."
    explanation: >-
      Biochemical assays show PNP inhibiting the glycine cleavage system by
      competing with PLP. The study is bacterial, so the relevance to human
      disease is inferred.
  downstream:
  - target: Hyperglycinemia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced glycine cleavage would raise glycine. The link is inferred from
      the bacterial mechanism and the patient finding; no human study has
      measured glycine cleavage activity in PLPBP deficiency.
- name: Impaired Mitochondrial Oxidative Metabolism
  description: >-
    PLPHP-deficient human cells accumulate lactate and pyruvate and have fewer
    tricarboxylic acid cycle intermediates downstream of alpha-ketoglutarate.
    Patients often have raised lactate early in life, which has led to
    misdiagnosis as a mitochondrial encephalopathy.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:37451483
    reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lactate and pyruvate accumulation along with the decrease of tricarboxylic acid cycle intermediates downstream of α-ketoglutarate suggested impaired mitochondrial oxidative metabolism in PLPHP-deficient HEK293 cells."
    explanation: >-
      PLPHP-deficient HEK293 cells show the metabolite pattern of impaired
      mitochondrial oxidative metabolism.
  downstream:
  - target: Lactic Acidosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired oxidative metabolism is a plausible source of the
      hyperlactatemia seen in patients; the link is shown in cells, not in
      patients.
    evidence:
    - reference: PMID:37451483
      reference_title: "Maintenance of cellular vitamin B(6) levels and mitochondrial oxidative function depend on pyridoxal 5'-phosphate homeostasis protein."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Lactate and pyruvate accumulation along with the decrease of tricarboxylic acid cycle intermediates downstream of α-ketoglutarate suggested impaired mitochondrial oxidative metabolism in PLPHP-deficient HEK293 cells."
      explanation: >-
        Cells, not patients, show lactate accumulating together with impaired
        oxidative metabolism, so the link to patient lactic acidosis is an
        inference.
phenotypes:
- name: Neonatal-Onset Seizures
  description: >-
    Seizures begin in the neonatal period in almost all reported individuals,
    most often in the first day or week of life, and rarely later in infancy or
    childhood. They are unresponsive or only partly responsive to antiseizure
    medication and respond to pyridoxine or pyridoxal 5'-phosphate.
  category: Neurological
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Neonatal seizure
    term:
      id: HP:0032807
      label: Neonatal seizure
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure onset is typically in the neonatal period (i.e., within the first 28 days after birth), and rarely in childhood after the neonatal period."
    explanation: GeneReviews places onset in the neonatal period.
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals in the reviewed studies presented with early neonatal seizures, with the majority occurring within the first 24 h of life (55.5%) or the first week of life (76%)."
    explanation: >-
      A systematic review of 54 individuals found neonatal seizures in all of
      them, most within the first day of life.
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures are unresponsive to (or only partly responsive to) anti-seizure medications (ASMs) but typically show an immediate positive response to vitamin B6, given as either pyridoxine (PN) or pyridoxal 5'-phosphate (PLP)."
    explanation: >-
      GeneReviews describes the defining treatment response: resistance to
      antiseizure medication and response to either B6 vitamer.

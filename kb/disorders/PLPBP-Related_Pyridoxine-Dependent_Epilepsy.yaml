  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to vitamin B6 treatment, almost 60% of individuals require adjunct ASMs to achieve optimal seizure control."
    explanation: GeneReviews gives the proportion needing adjunct antiseizure medication.
animal_models:

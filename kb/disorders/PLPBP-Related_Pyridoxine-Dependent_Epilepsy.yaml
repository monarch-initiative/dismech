  species: Zebrafish
  genotype: plpbp-/- (CRISPR/Cas9)
  publication: PMID:30668673
  description: >-
    CRISPR/Cas9 plpbp knockout larvae develop seizure activity by 10 days
    post-fertilization and die by 16 days; pyridoxine improves the epileptic
    phenotype and extends survival.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockout larvae show behavioural, biochemical and electrophysiological
      signs of seizure activity that respond to pyridoxine.
    limitations: >-
      Larval zebrafish brain development and lifespan differ from the human
      neonatal brain, and the model covers early larval stages only.
    evidence:
    - reference: PMID:30668673
      reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treatment with pyridoxine significantly improved the epileptic phenotype and extended lifespan in plpbp-/- animals."
      explanation: The model reproduces the pyridoxine-responsive seizures.
  evidence:
  - reference: PMID:30668673
    reference_title: "PLPHP deficiency: clinical, genetic, biochemical, and mechanistic insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our model recapitulates the disease, with plpbp-/- larvae showing behavioural, biochemical, and electrophysiological signs of seizure activity by 10 days post-fertilization and early death by 16 days post-fertilization."
    explanation: Describes the zebrafish model and its seizure phenotype.

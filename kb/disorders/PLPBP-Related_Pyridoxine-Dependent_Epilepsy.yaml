biochemical:
- name: Low Cerebrospinal Fluid Pyridoxal 5'-Phosphate
  biomarker_term:
    preferred_term: pyridoxal 5'-phosphate
    term:
      id: CHEBI:18405
      label: pyridoxal 5'-phosphate
  presence: DECREASED
  notes: >-
    Low pre-treatment CSF PLP is not specific to this disease. There is no
    metabolite biomarker that identifies PLPBP deficiency, and the plasma
    vitamin B6 profile on pyridoxine does not distinguish it, so diagnosis rests
    on molecular testing.
  evidence:
  - reference: PMID:27912044
    reference_title: "Mutations in PROSC Disrupt Cellular Pyridoxal Phosphate Homeostasis and Cause Vitamin-B(6)-Dependent Epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pre-treatment cerebrospinal fluid samples showed low PLP concentrations and evidence of reduced activity of PLP-dependent enzymes."
    explanation: Patient CSF PLP was low before treatment.
genetic:
- name: PLPBP
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PLPBP
    term:
      id: hgnc:9457
      label: PLPBP
  relationship_type: CAUSATIVE
  notes: >-
    PLPBP (8p11.23, formerly PROSC) encodes the pyridoxal 5'-phosphate
    homeostasis protein. Missense variants are the commonest type (48% of
    reported individuals) and, with compound heterozygosity, are associated
    with milder disease; biallelic truncating and homozygous variants are
    associated with severe disease or early death. ClinGen has not classified
    the PLPBP-disease relationship.
  evidence:
  - reference: PMID:41671913
    reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-phenotype analysis revealed an association of missense variants and compound heterozygous variants with an attenuated phenotype, while biallelic truncating variants and homozygous variants were linked to severe phenotypes and/or early mortality."
    explanation: Reports the genotype-phenotype correlation across 54 individuals.
  variants:
  - name: c.370_373del (p.Asp124fs)
    description: >-
      Recurrent frameshift variant, the most frequently reported PLPBP variant
      (18.5% of reported individuals) and a founder variant in the
      Saguenay-Lac-St-Jean region of Quebec.
    evidence:
    - reference: PMID:33977028
      reference_title: "A founder mutation in the PLPBP gene in families from Saguenay-Lac-St-Jean region affected by a pyridoxine-dependent epilepsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Haplotype analysis showed a single shared profile for the affected persons and their parents, leading to a hypothesis about founder effect of the mutation in Saguenay-Lac-St-Jean region of French Canadians."
      explanation: Haplotype sharing supports a founder origin in Quebec.
    - reference: PMID:41671913
      reference_title: "Exploring the clinical, neuroimaging, and genetic spectrum of PLPBP deficiency: multicenter case series and systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with the variant c.370-373del being the most frequently reported (18.5%)"
      explanation: The variant is the most frequently reported in the literature.
diagnosis:
- name: Molecular Genetic Testing for PLPBP
  description: >-
    The diagnosis is established by biallelic pathogenic PLPBP variants in a
    proband with suggestive findings. No metabolite biomarker distinguishes
    PLPBP deficiency from other vitamin B6-dependent epilepsies, and raised
    lactate and glycine are diagnostic pitfalls.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PLPBP deficiency is established in a proband with suggestive findings and biallelic pathogenic variants in PLPBP identified by molecular genetic testing."
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:31741821
    reference_title: "Diagnostic pitfalls in vitamin B6-dependent epilepsy caused by mutations in the PLPBP gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, metabolic biomarkers for early detection and prognosis of PLPBP deficiency are currently still lacking."
    explanation: Records the absence of a metabolite biomarker.
treatments:
- name: Vitamin B6 Therapy
  description: >-
    Lifelong pharmacologic vitamin B6, as pyridoxine or pyridoxal
    5'-phosphate, is the targeted therapy. Controlled pyridoxine withdrawal has
    produced encephalopathy within days. Several antiseizure medications
    (carbamazepine, valproate, phenytoin, phenobarbital) can lower plasma PLP
    and are listed by GeneReviews as agents to avoid.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
    - preferred_term: pyridoxal 5'-phosphate
      term:
        id: CHEBI:18405
        label: pyridoxal 5'-phosphate
  target_mechanisms:
  - target: Cerebral PLP Deficiency
    description: Supplying B6 in pharmacologic doses restores the PLP supply.
  evidence:
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted therapy is lifelong pharmacologic treatment with either PN or PLP, and often with additional ASMs."
    explanation: GeneReviews names lifelong PN or PLP as the targeted therapy.
  - reference: PMID:28391250
    reference_title: "Confirmation of mutations in PROSC as a novel cause of vitamin B ((6)) -dependent epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients underwent a controlled pyridoxine withdrawal with signs of encephalopathy within a couple of days."
    explanation: Withdrawal produced encephalopathy, showing dependency on pyridoxine.
  - reference: PMID:36795901
    reference_title: "PLPBP Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several ASMs (such as carbamazepine, valproate, phenytoin, and phenobarbitone) can cause a low plasma concentration of PLP."
    explanation: GeneReviews agents/circumstances to avoid.
- name: Adjunct Antiseizure Medication
  description: >-
    Almost 60% of individuals need antiseizure medication in addition to

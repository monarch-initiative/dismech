name: PLPBP-Related Pyridoxine-Dependent Epilepsy
creation_date: "2026-10-20T00:00:00Z"
category: Mendelian
description: >-
  PLPBP-related pyridoxine-dependent epilepsy (PLPBP deficiency, PLPHP
  deficiency) is an autosomal recessive vitamin B6-dependent epilepsy caused by
  biallelic pathogenic variants in PLPBP, which encodes the pyridoxal
  5'-phosphate homeostasis protein (PLPHP). PLPHP binds pyridoxal 5'-phosphate
  (PLP), the active form of vitamin B6, and is thought to regulate free
  intracellular PLP and its delivery to PLP-dependent enzymes. Loss of PLPHP
  leaves the brain short of PLP: cerebrospinal fluid PLP is low and
  PLP-dependent neurotransmitter synthesis is impaired. Seizures begin in the
  neonatal period in almost all reported individuals, resist standard
  antiseizure medication, and respond to pyridoxine or pyridoxal
  5'-phosphate, which must be continued lifelong. More than half of affected
  individuals have neurodevelopmental impairment despite treatment, and
  biallelic truncating variants are associated with the most severe course.
  It is the second gene-defined form of pyridoxine-dependent epilepsy in MONDO,
  after ALDH7A1-related PDE, and has no metabolite biomarker of its own.
parents:
- Pyridoxine-Dependent Epilepsy
- Epilepsy
- Inborn Errors of Metabolism
synonyms:
- PLPBP deficiency
- PLPHP deficiency
- PDE-PLPBP
- Epilepsy, early-onset, vitamin B6-dependent
- EPVB6D
- PROSC deficiency

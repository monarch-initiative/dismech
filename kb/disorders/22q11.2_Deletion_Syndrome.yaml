- accession: ega:EGAS50000000601
  title: Multiple paralogues and recombination mechanisms contribute to the high incidence of 22q11.2 Deletion Syndrome
  description: To enable haplotype-specific assembly and rearrangement mapping in LCR22 clusters, we combined fiber-FISH optical mapping with whole genome (ultra-)long read sequencing or rearrangement-specific long-range PCR on 254 duos families (22q11.2DS patient and parent-of-origin) comprising several different LCR22-mediated rearrangements.

- accession: geo:GSE236595
  title: An antisense oligonucleotide-based strategy to ameliorate cognitive dysfunction in the 22q11.2 Deletion Syndrome [RNA-seq]
  description: Adults and children with the 22q11.2 Deletion Syndrome demonstrate cognitive, social and emotional impairments and high risk for schizophrenia. Work in mouse model of the 22q11.2 deletion provided compelling evidence for abnormal expression and processing of microRNAs. A major transcriptional effect of the microRNA dysregulation is up-regulation of Emc10, a component of the ER membrane complex, which promotes membrane insertion of a subset of polytopic and tail-anchored membrane proteins. We previously uncovered a key contribution of EMC10 in mediating the behavioral phenotypes observed in 22q11.2 deletion mouse models.

- accession: dbgap:phs000987
  title: Whole Exome Sequence of 184 Individuals with 22q11.2 Deletion Syndrome
  description:  Our goal is to find genetic modifiers of major phenotypes in patients with 22q11.2 deletion syndrome, also known as DiGeorge syndrome or velo-cardio-facial syndrome. Whole exome sequencing was performed as part of a contract to the NHLBI, Resequencing and Genotyping Service. We have obtained cardiac phenotype information from the de-identified subjects enrolled in the study, either by echocardiography report or medical doctor report. All of the subjects have a 3 million base pair 22q11.2 deletion flanked by low copy repeats, LCR22, A-D.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("22q11.2 Deletion Syndrome"). Retrieved 2026-08-02.

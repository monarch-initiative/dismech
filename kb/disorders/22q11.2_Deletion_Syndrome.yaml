genetic:
- name: Recurrent 22q11.2 deletion
  association: Causal heterozygous copy-number loss spanning multiple dosage-sensitive genes
  features: >-
    The common proximal deletion is bounded by LCR22A-D; smaller A-B and A-C
    recurrent deletions also occur. Standard G-banded karyotyping does not
    resolve the microdeletion. Deletion size alone does not reliably predict the
    overall phenotype, although lesion-specific associations are emerging.
  evidence:
  - reference: PMID:41891037
    reference_title: >-
      Deletion size and background genetic variation shape congenital heart disease phenotypes in 3,016 individuals with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical 3 Mb LCR22 A-D deletion was present in 2,788 individuals (92.4%), with smaller A-B (n=172, 5.7%) and A-C (n=56, 1.9%) deletions comprising the remaining cohort.
    explanation: This large cohort quantifies the proximal recurrent deletion classes represented in the study.
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: too small to be visualized on standard G-banded karyotype analysis
    explanation: This supports the limitation of routine karyotyping.
- name: TBX1 dosage contribution
  gene_term:
    preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  association: >-
    Major contributor to pharyngeal-apparatus and cardiovascular developmental
    phenotypes; not sufficient to explain the full deletion syndrome.
  features: >-
    Mouse and rare single-gene observations support TBX1 dosage sensitivity,
    while deletion cohorts and rescue models support contributions from
    additional interval genes and background modifiers.
  evidence:
  - reference: PMID:11242110
    reference_title: DiGeorge syndrome phenotype in mice mutant for the T-box gene, Tbx1.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: we propose that TBX1 in humans is a key gene in the etiology of DGS/VCFS
    explanation: The mouse study supports TBX1 as a key contributor, not as the sole cause of the human syndrome.

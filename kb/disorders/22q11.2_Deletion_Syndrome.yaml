name: 22q11.2 Deletion Syndrome
creation_date: '2026-02-06T03:39:54Z'
category: Genetic
synonyms:
- DiGeorge syndrome
- Velocardiofacial syndrome
- VCFS
- Shprintzen syndrome
- Conotruncal anomaly face syndrome
- CATCH22
description: >-
  22q11.2 deletion syndrome is a variably expressive chromosomal disorder caused
  by a heterozygous, usually recurrent deletion that removes multiple
  dosage-sensitive genes at chromosome 22q11.2. Major manifestations include
  congenital heart disease, palatal abnormalities, characteristic facial
  features, immune deficiency, hypocalcemia related to parathyroid dysfunction,
  hearing loss, and learning or psychiatric disorders, but no single feature is
  universal. TBX1 is an
  important developmental contributor rather than a sufficient explanation for
  the full contiguous-gene syndrome. DiGeorge syndrome, velocardiofacial
  syndrome, and CATCH22 are historical labels; DiGeorge syndrome can also refer
  to phenocopies caused by other defects of thymic and pharyngeal development.
disease_term:
  preferred_term: 22q11.2 deletion syndrome
  term:
    id: MONDO:0018923
    label: 22q11.2 deletion syndrome
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008564
      label: DiGeorge syndrome
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:0008564 (OMIM:188400, RO:0004003 HGNC:11592 TBX1) is_a the
      MONDO:0018923 anchor of this entry. DiGeorge syndrome is the historical
      label for the thymic/parathyroid/conotruncal presentation of the same
      22q11.2 deletion this entry curates, and the entry already models the
      immunodeficiency and cardiac arms. narrowMatch because MONDO models
      DiGeorge as a child of the deletion syndrome rather than as an equivalent
      term - the same treatment already applied here to velocardiofacial
      syndrome.
  - term:
      id: MONDO:0008644
      label: velocardiofacial syndrome
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0008644 (velocardiofacial syndrome) is a subclass of MONDO:0018923
      (22q11.2 deletion syndrome) and carries "22q11 deletion syndrome" and
      "deletion 22q11.2 syndrome" as exact synonyms; it is the Shprintzen/VCF
      historical label already listed in this entry's synonyms. narrowMatch
      because MONDO models VCF as a child of the deletion syndrome rather than
      an equivalent class.

discussions:
- discussion_id: gap_22q11_multigene_genotype_phenotype_prediction
  prompt: >-
    Which deleted genes, remaining-allele variants, deletion boundaries, and
    genome-wide modifiers causally determine the major cardiac, immune,
    neurodevelopmental, and psychiatric phenotypes of 22q11.2 deletion syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent LCR22-mediated multigene deletion
  - pathophysiology#TBX1-associated pharyngeal developmental vulnerability
  - pathophysiology#DGCR8-associated miRNA-processing disruption
  rationale: >-
    TBX1 is a major developmental contributor but does not explain the full
    contiguous-gene syndrome. A large cohort now links deletion size and
    background variation to lesion-specific cardiac outcomes, while overall
    genotype-phenotype prediction remains weak. Resolving gene- and
    tissue-specific contributions is necessary to avoid both singular-TBX1
    attribution and untestable multigene narratives.
  evidence:
  - reference: PMID:41891037
    reference_title: >-
      Deletion size and background genetic variation shape congenital heart disease phenotypes in 3,016 individuals with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These lesion-specific findings suggest the hypothesis that deletion interval and broader genetic background may contribute to CHD variability in 22q11.2DS, pending future replication.
    explanation: The large human cohort identifies deletion interval and background variation as testable contributors while calling for replication.
  proposed_experiments:
  - experiment_id: exp_22q11_multicenter_genotype_phenotype_modifier_cohort
    name: Deletion-resolved longitudinal genotype-phenotype modifier cohort
    description: >-
      Combine precisely mapped deletion intervals, long-read or whole-genome
      remaining-allele data, longitudinal cardiac/immune/neuropsychiatric
      phenotypes, and ancestry-aware analyses across multiple centers to test
      reproducible gene- and background-modifier effects.
- discussion_id: gap_22q11_human_model_dosage_mismatch
  prompt: >-
    Which mechanisms observed after homozygous Tbx1 or Ranbp1 loss remain valid
    in human cells carrying a heterozygous multigene 22q11.2 deletion?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#TBX1-associated pharyngeal developmental vulnerability
  - pathophysiology#Candidate cortical and neurotransmitter mechanisms
  rationale: >-
    Homozygous mouse knockouts reproduce striking developmental phenotypes but
    differ in gene dosage, deleted interval, species, and sometimes viability
    from affected humans. The COMT/proline observation is also a small,
    phenotype-specific association. Human isogenic models are needed before
    these findings are promoted to syndrome-wide causal pathways.
  proposed_experiments:
  - experiment_id: exp_22q11_isogenic_human_dosage_series
    name: Isogenic human 22q11.2 dosage-series comparison
    description: >-
      Compare human induced pluripotent stem cell-derived pharyngeal, cardiac,
      thymic, and cortical lineages carrying the recurrent heterozygous deletion,
      individual-gene heterozygous edits, homozygous knockouts, and corrected
      controls to separate dosage and interval effects.
datasets:
- accession: geo:GSE289984
  title: Next-generation sequencing profiling of miRNAs in individuals with 22q11.2 deletion syndrome revealed altered expression of miR-185-5p
  description: 'Background: The 22q11.2 deletion syndrome (22q11.2DS) is a microdeletion syndrome with highly variable phenotypic manifestations, even though most patients present the typical 3 Mb microdeletion, usually affecting the same ~ 106 genes. One of the genes affected by this deletion is DGCR8, which plays a crucial role in miRNA biogenesis. Therefore, the haploinsufficiency of DGCR8 due to this microdeletion can alter the modulation of the expression of several miRNAs involved in a range of biological processes.'

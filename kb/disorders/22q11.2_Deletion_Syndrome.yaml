    Congenital heart disease is heterogeneous and often conotruncal, including
    tetralogy of Fallot, interrupted aortic arch, truncus arteriosus, and septal
    defects. A recent 3,016-person specialist-center cohort found congenital
    heart disease in 59% and conotruncal defects in 40%.
  phenotype_term:
    preferred_term: Conotruncal defect
    term:
      id: HP:0001710
      label: Conotruncal defect
  evidence:
  - reference: PMID:41891037
    reference_title: >-
      Deletion size and background genetic variation shape congenital heart disease phenotypes in 3,016 individuals with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most frequent class of defects in 22q11.2DS are CTDs; they occurred in 40% of this cohort.
    explanation: The 40% conotruncal-defect estimate supports the FREQUENT band.
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      congenital heart disease, particularly conotruncal malformations (ventricular septal defect, tetralogy of Fallot, interrupted aortic arch, and truncus arteriosus)
    explanation: GeneReviews documents the characteristic lesion spectrum.

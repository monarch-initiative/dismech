    explanation: GeneReviews directly supports calcium replacement and specialist follow-up.
- name: Immune phenotyping and vaccine planning
  action_category: MONITORING
  description: >-
    At diagnosis, assess T-, B-, and NK-cell numbers and naïve/memory T-cell
    subsets. Subsequent immunoglobulin, vaccine-response, and lymphocyte testing
    should be individualized. Live MMR and varicella vaccines require adequate
    immune-function criteria rather than a syndromic label alone.

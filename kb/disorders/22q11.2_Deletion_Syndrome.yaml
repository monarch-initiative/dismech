diagnosis:
- name: Chromosomal microarray confirmation
  description: >-
    Establish the diagnosis by detecting a heterozygous 22q11.2 deletion with
    chromosomal microarray or another validated genome-wide copy-number method.
    Routine G-banded karyotyping is not sufficiently sensitive.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: A heterozygous pathogenic deletion at 22q11.2 establishes the molecular diagnosis.
  evidence:
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of 22q11.2DS is established by identification of a heterozygous deletion at chromosome 22q11.2 on chromosomal microarray analysis or other genomic analyses.
    explanation: GeneReviews directly defines molecular confirmation.
- name: Targeted familial or prenatal deletion testing
  description: >-
    FISH, MLPA, or other targeted testing can evaluate a known familial deletion,
    but common proximal FISH probes may miss atypical or distal deletions. Use a
    genome-wide microarray when the familial interval is not already defined.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      FISH is specific for identification of 22q11.2 dele-
      tion but may not detect individuals with an atypical or
      distal deletion that does not include the more proximal
      part of the commonly deleted region (LCR A-B).
    explanation: This supports the stated limitation of common targeted FISH testing.
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the 22q11.2 deletion has been identified in an affected family member, prenatal testing using FISH, MLPA, or array studies for a pregnancy at increased risk and preimplantation genetic testing are possible.
    explanation: GeneReviews supports targeted familial and reproductive testing after the deletion is defined.
- name: Prenatal screening followed by diagnostic confirmation
  description: >-
    Cell-free-DNA/NIPS is a screening test, not a molecular diagnosis. A positive
    screen or suggestive fetal imaging finding should be followed by genetic
    counseling and diagnostic testing of chorionic villi or amniocytes using
    chromosomal microarray.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36672900
    reference_title: Prenatal Screening and Diagnostic Considerations for 22q11.2 Microdeletions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Definitive diagnosis by genetic testing of chorionic villi or amniocytes using a chromosomal microarray will detect clinically relevant microdeletions. Screening options include noninvasive prenatal screening (NIPS) and imaging.
    explanation: The prenatal guidance clearly separates screening from diagnostic CMA.
- name: Second-diagnosis sequencing for atypical metabolic crises
  description: >-
    Recurrent or otherwise unexplained metabolic crises with severe
    rhabdomyolysis, especially when accompanied by cardiac arrhythmias or
    neurodegeneration, should prompt evaluation for a second diagnosis. When
    the deletion includes TANGO2, evaluate for a pathogenic variant on the
    remaining allele.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42420940
    reference_title: >-
      TANGO2-related metabolic encephalopathy-arrhythmia syndrome unmasked in 22q11.2 deletion syndrome: hemizygous pathogenic variant, complex phenotype modified by two genetic conditions, and implications for proactive crisis prevention: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At age 5, she experienced her first metabolic crisis during pneumonia with severe rhabdomyolysis (creatine kinase >100,000 U/L), features inconsistent with isolated 22q11.2 deletion syndrome.
    explanation: A single case supports this as a diagnostic red flag, not as a routine feature or universal testing mandate.
  - reference: PMID:42420940
    reference_title: >-
      TANGO2-related metabolic encephalopathy-arrhythmia syndrome unmasked in 22q11.2 deletion syndrome: hemizygous pathogenic variant, complex phenotype modified by two genetic conditions, and implications for proactive crisis prevention: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TANGO2 deficiency disorder is an ultra-rare autosomal recessive condition characterized by life-threatening metabolic crises with rhabdomyolysis and cardiac arrhythmias.
    explanation: This supports the combined metabolic-crisis, rhabdomyolysis, and arrhythmia red-flag pattern.
differential_diagnoses:
- name: CHARGE syndrome
  description: >-
    CHD7-related CHARGE syndrome can overlap through conotruncal disease,
    cleft/palatal abnormalities, hearing loss, renal anomalies, developmental
    delay, thymic hypoplasia, and T-cell lymphopenia. CHD7 testing and the CHARGE
    feature pattern distinguish it from a confirmed 22q11.2 deletion.
  disease_term:
    preferred_term: CHARGE syndrome
    term:
      id: MONDO:0008965
      label: CHARGE syndrome
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Clinical features of CHARGE syndrome can overlap with those of 22q11.2del
    explanation: The guideline directly describes the overlapping presentation.
- name: 10p13-p14 deletion syndrome
  description: >-
    A 10p deletion can produce a DiGeorge-like presentation with
    hypoparathyroidism, hearing loss, and renal dysplasia. Genome-wide
    copy-number testing distinguishes the deleted interval.
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      Since then, evidence has accumulated that 10p dele-
      tions are associated with GATA3 haploinsufficiency, which
      can result in hypoparathyroidism, sensory neural hearing
      loss, and renal dysplasia [64].
    explanation: The guideline supports the overlapping 10p-deletion phenotype.
- name: Alagille syndrome
  description: >-
    Alagille syndrome can overlap through congenital heart disease and facial
    features; cholestasis or bile-duct paucity, posterior embryotoxon, butterfly
    vertebrae, and a JAG1 or NOTCH2 variant favor Alagille syndrome.
  disease_term:
    preferred_term: Alagille syndrome
    term:
      id: MONDO:0007318
      label: Alagille syndrome
- name: TANGO2-related metabolic encephalopathy-arrhythmia syndrome
  description: >-
    In an individual whose 22q11.2 deletion includes TANGO2, a pathogenic variant
    on the remaining allele creates an unmasked autosomal-recessive second
    diagnosis. Metabolic crises, rhabdomyolysis, and arrhythmia distinguish this
    dual diagnosis from isolated 22q11.2 deletion syndrome.
  evidence:
  - reference: PMID:42420940
    reference_title: >-
      TANGO2-related metabolic encephalopathy-arrhythmia syndrome unmasked in 22q11.2 deletion syndrome: hemizygous pathogenic variant, complex phenotype modified by two genetic conditions, and implications for proactive crisis prevention: a case report.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with 22q11.2 deletion syndrome are at increased risk when a pathogenic variant occurs in the remaining allele, yet this dual diagnosis remains underrecognized as clinicians often attribute all manifestations to the primary genetic condition.
    explanation: The case report supports the remaining-allele dual-diagnosis mechanism while requiring cautious generalization.

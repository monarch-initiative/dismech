inheritance:
- name: Autosomal dominant contiguous-gene deletion
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    More than 90% of typical 3.0 (2.54)-Mb deletions are de novo, whereas nested
    deletions are inherited much more often.
  expressivity: VARIABLE
  description: >-
    Parental testing is important because inheritance depends on deletion class.
    An affected individual has a 50% chance of transmitting the deletion in each
    pregnancy, but severity cannot be predicted from an affected parent.
  evidence:
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 22q11.2DS is an autosomal dominant contiguous gene deletion syndrome.
    explanation: GeneReviews establishes the inheritance mode.
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 22q11.2DS caused by a 3.0 (2.54)-Mb deletion, the deletion is de novo in more than 90% of individuals and inherited from a heterozygous parent in about 10% of individuals.
    explanation: This gives the deletion-class-specific de novo rate for the typical deletion.
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty percent of individuals with 22q11.2DS caused by a nested 22q11.2 deletion inherited the deletion from an affected parent. Offspring of affected individuals have a 50% chance of inheriting the 22q11.2 deletion.
    explanation: This supports the higher inherited fraction for nested deletions and the 50% transmission risk.
prevalence:
- population: Country-level population-based live-birth cohorts
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 10.2
  rate_high: 16.8
  notes: >-
    A systematic review found country-specific estimates of 1.02-1.68 per
    10,000 live births. These clinically ascertained estimates may undercount
    mild, prenatally lost, or later-diagnosed cases. The same review's higher
    1-in-4,000 to 1-in-7,092 estimates came from cardiovascular-malformation
    cohorts and are not treated here as a general-population range.
  evidence:
  - reference: PMID:29906080
    reference_title: >-
      Birth Prevalence of Chromosome 22q11.2 Deletion Syndrome: A Systematic Review of Population-Based Studies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      According to countries, the birth prevalence of this deletion syndrome (95% confidence interval) from United States, Belgium, Sweden, United Kingdom, France, and Singapore were 1.68 (1.22-2.26), 1.56 (1.33-1.72), 1.36 (0.91-2.08), 1.30 (0.45-2.15), 1.03 (0.53-2.23), and 1.02 per 10,000 live births, respectively.
    explanation: The published country estimates convert to 10.2-16.8 per 100,000 live births.
- population: Births at or beyond 20 weeks in Victoria, Australia
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 21.94
  notes: >-
    This is a minimum combined prenatal and infant estimate from a two-year
    statewide diagnostic cohort, not a universal population rate.
  evidence:
  - reference: PMID:32207823
    reference_title: >-
      A minimum estimate of the prevalence of 22q11 deletion syndrome and other chromosome abnormalities in a combined prenatal and postnatal cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After excluding the miscarriage case and accounting for duplicate testing, the estimated prevalence of 22q11 DS was 1 in 4558 Victorian births.
    explanation: One in 4,558 converts to 21.94 per 100,000 births.
progression:
- phase: Congenital multisystem presentation
  age_range: Prenatal period through infancy
  notes: >-
    Developmental anomalies may be recognized prenatally or at birth, but
    presentation varies widely and some individuals are diagnosed later.
  evidence:
  - reference: PMID:20301696
    reference_title: 22q11.2 Deletion Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major clinical manifestations of 22q11.2DS include congenital heart disease, particularly conotruncal malformations (ventricular septal defect, tetralogy of Fallot, interrupted aortic arch, and truncus arteriosus), palatal abnormalities (velopharyngeal incompetence, submucosal cleft palate, bifid uvula, and cleft palate), immune deficiency, characteristic facial features, and learning difficulties.
    explanation: GeneReviews summarizes the characteristic early multisystem presentation.
- phase: Age-dependent immune course
  age_range: Infancy through adulthood
  notes: >-
    T-cell counts often rise during infancy and may approach population ranges
    later, while naïve-to-memory skewing, humoral abnormalities, infection risk,
    and autoimmunity can still evolve. Congenital athymia is a rare, distinct
    severe presentation.
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Specific to 22q11.2del, T cell numbers may increase more rapidly over the first 6 to 12 months of life and have been shown to have a slower rate of age-related decline compared to unaffected individuals.
    explanation: The immune-management guideline documents an age-dependent T-cell trajectory.
- phase: Adolescent and adult psychiatric risk
  age_range: Adolescence through adulthood
  notes: >-
    Psychotic-disorder prevalence is higher in adult than pediatric samples,
    supporting anticipatory psychiatric assessment across the transition to
    adulthood.
  evidence:
  - reference: PMID:36786112
    reference_title: >-
      Prevalence and incidence of psychotic disorders in 22q11.2 deletion syndrome: a meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prevalence was significantly higher in samples with a mean age over 18 years, with both psychiatric and non-psychiatric comorbidities and recruited from healthcare services (compared to the community).
    explanation: Meta-analysis supports an age-associated increase in observed psychotic-disorder prevalence.
pathophysiology:
- name: Recurrent LCR22-mediated multigene deletion
  description: >-
    Low-copy repeats at 22q11.2 predispose to non-allelic homologous
    recombination and recurrent deletions. The common A-D interval removes more
    than 40 coding genes, so the syndrome reflects combined dosage effects and
    background modifiers rather than a single-gene lesion.
  genes:
  - preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  - preferred_term: DGCR8
    term:
      id: hgnc:2847
      label: DGCR8
  downstream:
  - target: TBX1-associated pharyngeal developmental vulnerability
    causal_link_type: DIRECT
    description: The recurrent proximal deletion makes TBX1 hemizygous.
  - target: DGCR8-associated miRNA-processing disruption
    causal_link_type: DIRECT
    description: The recurrent proximal deletion makes DGCR8 hemizygous.
  - target: Thymic developmental impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Combined deleted-region dosage effects can impair thymic development, but
      individual-gene attribution and modifiers remain incompletely resolved.
  - target: Candidate cortical and neurotransmitter mechanisms
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deleted-region dosage creates several candidate neurodevelopmental
      mechanisms whose human causal contributions remain uncertain.
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      These LCRs mediate meiotic non-
      allelic homologous recombination and are susceptible to
      either deletion or duplication of these intervals.
    explanation: This supports the recurrent LCR-mediated deletion mechanism.
  - reference: PMID:41891037
    reference_title: >-
      Deletion size and background genetic variation shape congenital heart disease phenotypes in 3,016 individuals with 22q11.2 deletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The typical 3 Mb LCR22 A-D deletion was present in 2,788 individuals (92.4%), with smaller A-B (n=172, 5.7%) and A-C (n=56, 1.9%) deletions comprising the remaining cohort.
    explanation: A large contemporary cohort documents the dominant recurrent deletion and smaller proximal classes.
  - reference: DOI:10.3390/genes15030321
    reference_title: >-
      Understanding the Variability of 22q11.2 Deletion Syndrome: The Role of Epigenetic Factors
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The review of the literature confirms the hypothesis that the 22q11.2DS phenotype results from a network of interactions between deleted protein-coding genes and altered epigenetic regulation.
    explanation: This supports a multigene and regulatory-network model rather than singular TBX1 causation.
- name: TBX1-associated pharyngeal developmental vulnerability
  description: >-
    TBX1 dosage is an important contributor to pharyngeal-apparatus and cardiac
    outflow development. Heterozygous Tbx1 mice model aortic/outflow anomalies,
    whereas the broader phenotype occurs mainly after homozygous loss; those
    dosage differences limit extrapolation to the human multigene deletion.
  genes:
  - preferred_term: TBX1
    term:
      id: hgnc:11592
      label: TBX1
  locations:
  - preferred_term: pharyngeal arch
    term:
      id: UBERON:0002539
      label: pharyngeal arch
  biological_processes:
  - preferred_term: pharyngeal system development
    term:
      id: GO:0060037
      label: pharyngeal system development
  downstream:
  - target: Conotruncal heart defect
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Pharyngeal arch artery, second-heart-field, and outflow-tract development.
    description: >-
      TBX1 dosage contributes to conotruncal and aortic-arch susceptibility, but
      other deleted genes and genome-wide modifiers also shape the human lesion.
    evidence:
    - reference: PMID:11242110
      reference_title: DiGeorge syndrome phenotype in mice mutant for the T-box gene, Tbx1.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mice heterozygous for the mutation had a high incidence of cardiac outflow tract anomalies, thus modeling one of the major abnormalities of the human syndrome
      explanation: Heterozygous mouse evidence supports a cardiac contribution but not the full human contiguous-gene syndrome.
  evidence:
  - reference: PMID:11242110
    reference_title: DiGeorge syndrome phenotype in mice mutant for the T-box gene, Tbx1.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Tbx1-/- mice displayed a wide range of developmental anomalies encompassing almost all of the common DGS/VCFS features, including hypoplasia of the thymus and parathyroid glands, cardiac outflow tract abnormalities, abnormal facial structures, abnormal vertebrae and cleft palate
    explanation: >-
      Homozygous knockout supports developmental plausibility, but it is not dosage-equivalent to a heterozygous human multigene deletion.
- name: DGCR8-associated miRNA-processing disruption
  description: >-
    DGCR8 hemizygosity can perturb microRNA biogenesis and downstream gene
    regulation. This is a candidate contributor to variable expression, not a
    proven explanation for any single clinical feature.
  genes:
  - preferred_term: DGCR8
    term:
      id: hgnc:2847
      label: DGCR8
  biological_processes:
  - preferred_term: miRNA processing
    term:
      id: GO:0035196
      label: miRNA processing
  evidence:
  - reference: DOI:10.3390/genes15030321
    reference_title: >-
      Understanding the Variability of 22q11.2 Deletion Syndrome: The Role of Epigenetic Factors
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Typical miRNA expression patterns have been identified in 22q11.2DS, due to an alteration in miRNA biogenesis, affecting the expression of several target genes.
    explanation: The review supports altered miRNA biogenesis while leaving phenotype-level causality unresolved.
- name: Thymic developmental impairment
  description: >-
    Reduced thymic tissue can lower thymic T-cell output. Most immune phenotypes
    are milder T-cell lymphopenia rather than congenital athymia, and clinical
    appearance alone does not reliably identify the immune severity.
  cell_types:
  - preferred_term: cortical thymic epithelial cell
    term:
      id: CL:0002364
      label: cortical thymic epithelial cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  locations:
  - preferred_term: thymus
    term:
      id: UBERON:0002370
      label: thymus
  biological_processes:
  - preferred_term: thymus development
    term:
      id: GO:0048538
      label: thymus development
  downstream:
  - target: Cellular immunodeficiency
    causal_link_type: DIRECT
    description: Reduced thymic tissue lowers T-cell output.
    evidence:
    - reference: PMID:36648576
      reference_title: >-
        Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Thus, barring a specific T cell defect such as SCID, a normal thymic volume in 22q11.2del, results in a normal number of T cells, whereas a small thymus can result in a quantitative T cell deficiency.
      explanation: The guideline directly links thymic size to quantitative T-cell deficiency.
  - target: Congenital athymia
    causal_link_type: DIRECT
    description: Complete absence of thymic function is the rare severe end of the developmental defect.
    evidence:
    - reference: PMID:36648576
      reference_title: >-
        Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: |-
        Stud-
        ies suggest that approximately 0.5% of those diagnosed
        with 22q11.2del have a severe immune deficiency with
        very few T cells due to the absence of a thymus at birth,
        termed congenital athymia [14, 15].
      explanation: This identifies and quantifies congenital athymia specifically in 22q11.2 deletion syndrome.
  evidence:
  - reference: PMID:36648576
    reference_title: >-
      Clinical Practice Guidelines for the Immunological Management of Chromosome 22q11.2 Deletion Syndrome and Other Defects in Thymic Development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An estimated 67–80% of individuals affected with 22q11.2del have some degree of T cell lymphopenia (TCL).
    explanation: This establishes T-cell lymphopenia as the common immune presentation.
- name: Candidate cortical and neurotransmitter mechanisms
  description: >-
    RANBP1-null mice show impaired upper-layer cortical neuron generation, and a
    small human study found a COMT-genotype-by-proline association with selected
    neurophysiologic measures. These observations are candidate mechanisms; they
    do not establish a causal path from an individual interval gene to human
    learning difficulties or schizophrenia.
  genes:
  - preferred_term: RANBP1
    term:
      id: hgnc:9847
      label: RANBP1
  - preferred_term: COMT
    term:
      id: hgnc:2228
      label: COMT
  - preferred_term: PRODH
    term:
      id: hgnc:9453
      label: PRODH
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  biological_processes:
  - preferred_term: neurogenesis
    term:
      id: GO:0022008
      label: neurogenesis
  evidence:
  - reference: PMID:25452572
    reference_title: >-
      Ranbp1, Deleted in DiGeorge/22q11.2 Deletion Syndrome, is a Microcephaly Gene That Selectively Disrupts Layer 2/3 Cortical Projection Neuron Generation.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ranbp1(-/-)-dependent proliferative deficits substantially diminish the frequency of layer 2/3, but not layer 5/6 cortical projection neurons.
    explanation: Homozygous mouse knockout supports a candidate cortical mechanism but is not equivalent to human hemizygosity.
  - reference: PMID:18769474
    reference_title: Proline affects brain function in 22q11DS children with the low activity COMT 158 allele.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With regard to the SPEM performance, there was a significant interaction between the COMT158 genotype and proline level with significantly decreased SPEM performance in children with high plasma proline levels and the low activity COMTmet allele.
    explanation: >-
      The small human study supports a limited genotype-by-metabolite association, not a general mechanism for psychosis.
phenotypes:
- name: Conotruncal heart defect
  frequency: FREQUENT

- name: Motor endplate recovery by sprouting and terminal restoration
  description: >-
    After BoNT/A-induced functional denervation, nerve-terminal sprouts
    transiently support transmission. Vesicle cycling later returns to original
    terminals and the superfluous sprouts regress. This detailed sequence is
    established primarily in a locally injected mouse neuromuscular-junction
    model.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  mechanism_confidence: ESTABLISHED
  biological_scale: TISSUE
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recovery, which takes weeks to months, occurs after sprouting of new nerve terminals."
    explanation: The clinical guideline provides human clinical support for recovery by terminal sprouting.
  - reference: DOI:10.1073/pnas.96.6.3200
    reference_title: "Functional repair of motor endplates after botulinum neurotoxin type A poisoning: Biphasic switch of synaptic activity between nerve sprouts and their parent terminals"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, a second, distinct phase of the rehabilitation process followed
      with a return of vesicle turnover to the original terminals, accompanied
      by an elimination of the by then superfluous sprouts.
    explanation: The mouse model demonstrates restoration at parent terminals after a temporary sprouting phase.
- name: Serotype-specific light-chain persistence through ubiquitin-proteasome turnover
  description: >-
    Differential ubiquitin-dependent proteasomal turnover of intracellular
    botulinum neurotoxin light chains helps determine paralysis duration:
    BoNT/E light chain is promoted toward degradation by TRAF2, while BoNT/A
    light chain is stabilized by VCIP135 despite HECTD2-mediated ubiquitination.
  mechanism_confidence: PROVISIONAL
  biological_scale: MOLECULAR
  downstream:
  - target: Motor endplate recovery by sprouting and terminal restoration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - duration of intracellular light-chain protease activity
    - restoration of presynaptic SNARE function
    description: More persistent light-chain activity delays restoration of transmitter release and terminal recovery.
    evidence:
    - reference: PMID:28584101
      reference_title: "Deubiquitinating enzyme VCIP135 dictates the duration of botulinum neurotoxin type A intoxication."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        BoNT serotype A (BoNT/A) has the most prolonged or persistent effects,
        which can last several months, and exerts its effects by specifically
        cleaving and inactivating SNAP25.
      explanation: The study connects prolonged BoNT/A action to the molecular persistence question relevant to recovery duration.
  evidence:
  - reference: PMID:20823219
    reference_title: "Targeting botulinum neurotoxin persistence by the ubiquitin-proteasome system."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      TRAF2, a RING finger protein implicated in ubiquitylation, selectively
      associates with BoNT/E LC and promotes its proteasomal degradation.
    explanation: The cellular study identifies TRAF2-mediated degradation of BoNT/E light chain.
  - reference: PMID:28584101
    reference_title: "Deubiquitinating enzyme VCIP135 dictates the duration of botulinum neurotoxin type A intoxication."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BoNT/A catalytic light chain binds to, and is a substrate for, the ubiquitin
      ligase HECTD2. However, the light chain evades proteasomal degradation by the
      dominant effect of a deubiquitinating enzyme, VCIP135/VCPIP1.
    explanation: The cellular study identifies the opposing HECTD2 and VCIP135 mechanisms that stabilize BoNT/A light chain.

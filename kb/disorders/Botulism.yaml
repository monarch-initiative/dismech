- name: Cholinergic-terminal receptor binding and endocytosis
  description: >-
    The toxin heavy chain uses gangliosides together with serotype-dependent
    synaptic-vesicle protein receptors. BoNT/A binds SV2, while other serotypes
    use related receptor combinations; vesicle cycling exposes these receptors
    and enables receptor-mediated endocytosis.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:

  infectious_agent_term:
    preferred_term: Clostridium botulinum
    term:
      id: NCBITaxon:1491
      label: Clostridium botulinum
  description: >-
    Anaerobic, spore-forming bacterium responsible for most naturally occurring
    botulism. Disease may follow ingestion of preformed toxin or toxin
    production after wound or intestinal colonization.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulinum neurotoxin, which inhibits acetylcholine release at the
      neuromuscular junction, is produced by the anaerobic, gram-positive
      bacterium Clostridium botulinum and, rarely, by related species (C.
      baratii and C. butyricum).
    explanation: The clinical guideline identifies the principal toxin-producing species.

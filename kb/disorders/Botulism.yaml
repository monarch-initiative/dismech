clinical_burden:
  burden_level: HIGH
  rationale: >-
    Botulism can progress quickly to respiratory failure and prolonged
    paralysis, requiring ventilation, intensive monitoring, nutritional
    support, and weeks to months of recovery. Modern supportive care has
    reduced mortality to below 5%, but resource and disability burdens remain
    substantial.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulism produces a protracted flaccid paralysis that lasts for weeks to
      months.
    explanation: The guideline directly supports prolonged severe motor disability.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mortality rates decreased beginning in the 1940s and 1950s to their
      current rate of <5%, with improvement corresponding to the development of
      modern intensive care techniques, particularly mechanical ventilation
    explanation: Modern survival depends heavily on intensive respiratory support.
diagnosis:
- name: Urgent clinical and public-health diagnosis
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Recognize a compatible cranial-palsy and flaccid-paralysis syndrome,
    assess exposure history and respiratory status, and immediately consult
    public-health authorities. Treatment decisions are clinical and should not
    wait for laboratory confirmation.
  results: A compatible syndrome with an appropriate exposure pattern warrants urgent treatment and public-health consultation.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis of botulism depends on high clinical suspicion and a thorough neurologic examination."
    explanation: The guideline makes clinical recognition the diagnostic foundation.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The critical initial treatment and management decisions for patients with
      suspected botulism must be made based on clinical findings.
    explanation: Initial management cannot be deferred pending laboratory confirmation.
- name: Public-health toxin detection and toxigenic-organism testing
  diagnosis_term:
    preferred_term: clinical laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Public-health laboratories test serum, stool, gastric fluid, wound
    material, or implicated food for toxin and may culture stool or wound
    specimens for toxin-producing C. botulinum, C. baratii, or C. butyricum.
    Specimens should be collected promptly without delaying antitoxin.
  results: Detection of toxin in an appropriate specimen or food, or isolation of a toxin-producing species from stool or wound, confirms a compatible case.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Botulism is confirmed in symptomatic persons by detecting one of the
      following: 1) botulinum neurotoxin in serum, stool, or gastric fluid; 2)
      botulinum neurotoxin–producing species of Clostridium (i.e., C. botulinum,
      C. baratii, or C. butyricum) in a stool or wound culture
    explanation: The guideline defines laboratory confirmation routes and specimens.
- name: Electrodiagnostic testing as a diagnostic adjunct
  diagnosis_term:
    preferred_term: electromyography procedure
    term:
      id: NCIT:C38056
      label: Electromyography
  description: >-
    EMG, repetitive nerve stimulation, and nerve-conduction studies can support
    an uncertain diagnosis, but early results may be normal and diagnostic
    sensitivity and specificity are unknown.
  results: A compatible presynaptic neuromuscular-junction pattern can support but does not independently establish botulism.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, early in the disease course, electrodiagnostic studies might be
      normal or almost normal and therefore not helpful.
    explanation: The guideline cautions that early electrodiagnostic testing can be falsely unrevealing.
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sensitivity and specificity of EMG, RNS, and NCSs for diagnosing botulism are unknown."
    explanation: Test-performance limitations preclude use as a definitive standalone test.
differential_diagnoses:
- name: Guillain-Barre syndrome
  disease_term:
    preferred_term: Guillain-Barre syndrome
    term:
      id: MONDO:0016218
      label: Guillain-Barre syndrome
  description: >-
    Guillain-Barre syndrome can cause acute weakness, bulbar dysfunction, and
    respiratory failure and may have overlapping cerebrospinal-fluid or
    electrodiagnostic findings.
  distinguishing_features:
  - Botulism more often begins with prominent ocular and bulbar palsies and autonomic secretory findings.
  - Ascending weakness, sensory involvement, and classic demyelinating or axonal studies favor Guillain-Barre syndrome, but atypical botulism findings occur.
  - Exposure history and toxin or culture confirmation support botulism.
  evidence:
  - reference: PMID:29293936
    reference_title: "Clinical Characteristics and Ancillary Test Results Among Patients With Botulism-United States, 2002-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Illnesses on the physician differential included Guillain-Barré syndrome
      (99 cases) and myasthenia gravis (76 cases)
    explanation: Guillain-Barre syndrome was the most commonly reported physician differential.
- name: Myasthenia gravis
  disease_term:
    preferred_term: myasthenia gravis
    term:
      id: MONDO:0009688
      label: myasthenia gravis
  description: >-
    Myasthenia gravis can produce ocular, bulbar, generalized, and respiratory
    fatigable weakness resembling botulism.
  distinguishing_features:
  - Fluctuating fatigability, preserved pupils, relevant antibodies, and a postsynaptic electrophysiologic pattern favor myasthenia gravis.
  - Dry mouth, fixed or poorly reactive dilated pupils, acute exposure clustering, and toxin detection favor botulism.
  - Treatment should not be delayed solely because the distinction remains uncertain.
  evidence:
  - reference: PMID:29293936
    reference_title: "Clinical Characteristics and Ancillary Test Results Among Patients With Botulism-United States, 2002-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Illnesses on the physician differential included Guillain-Barré syndrome
      (99 cases) and myasthenia gravis (76 cases)
    explanation: Myasthenia gravis was a frequent physician differential in confirmed cases.
treatments:
- name: Equine-derived heptavalent botulinum antitoxin for noninfant botulism
  action_category: THERAPEUTIC
  description: >-
    Request and administer heptavalent BAT as soon as clinically suspected
    symptomatic noninfant botulism is recognized; do not wait for laboratory
    confirmation. BAT neutralizes circulating unbound toxin and can limit
    progression but cannot reverse paralysis already established by
    intracellular toxin.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Circulating botulinum neurotoxin reaches peripheral cholinergic terminals
    treatment_effect: INHIBITS
    description: Antitoxin binds circulating toxin before irreversible synaptic-receptor binding.
    evidence:
    - reference: PMID:29293928
      reference_title: Safety and Improved Clinical Outcomes in Patients Treated With New Equine-Derived Heptavalent Botulinum Antitoxin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It binds circulating botulinum toxin and halts illness progression, but
        does not reverse deficits that have already developed.
      explanation: The source directly defines the extracellular neutralization mechanism and its limit.
  evidence:
  - reference: PMID:29293928
    reference_title: Safety and Improved Clinical Outcomes in Patients Treated With New Equine-Derived Heptavalent Botulinum Antitoxin.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HBAT administration within 2 days of symptom onset was associated with
      shorter hospital and intensive care stays.
    explanation: Prospective expanded-access data associate earlier HBAT with shorter acute-care use.
  - reference: PMID:29293927
    reference_title: "Efficacy of Antitoxin Therapy in Treating Patients With Foodborne Botulism: A Systematic Review and Meta-analysis of Cases, 1923-2016."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not identify an interval beyond which antitoxin was not beneficial."
    explanation: The systematic review supports prompt treatment without imposing a hard late-treatment cutoff.
- name: Human botulism immune globulin intravenous for infant type A or B botulism
  action_category: THERAPEUTIC
  description: >-
    BIG-IV (BabyBIG) is the form-specific antitoxin for infant intestinal
    botulism caused by toxin type A or B. Prompt administration shortens
    hospital, intensive-care, ventilation, and assisted-feeding duration.
  treatment_term:
    preferred_term: immunoglobulin infusion
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Circulating botulinum neurotoxin reaches peripheral cholinergic terminals
    treatment_effect: INHIBITS
    description: BIG-IV neutralizes circulating botulinum toxin in infant intestinal-toxemia disease.
    evidence:
    - reference: PMID:16452558
      reference_title: Human botulism immune globulin for the treatment of infant botulism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We created the orphan drug Human Botulism Immune Globulin Intravenous
        (Human) (BIG-IV), which neutralizes botulinum toxin, and evaluated its
        safety and efficacy in treating infant botulism, the intestinal-toxemia
        form of human botulism.
      explanation: The randomized-trial report defines both the form and toxin-neutralizing mechanism.
  evidence:
  - reference: PMID:16452558
    reference_title: Human botulism immune globulin for the treatment of infant botulism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As compared with the control group in the randomized trial, infants
      treated with BIG-IV had a reduction in the mean length of the hospital
      stay, the primary efficacy outcome measure, from 5.7 weeks to 2.6 weeks
      (P<0.001).
    explanation: Randomized evidence demonstrates a substantial reduction in hospital duration.
- name: Airway protection, invasive ventilation, and intensive supportive care
  action_category: THERAPEUTIC
  description: >-
    Serial respiratory and bulbar monitoring, timely airway protection,
    mechanical ventilation, nutrition, complication prevention,
    communication support, and rehabilitation sustain patients while
    neuromuscular transmission recovers.
  treatment_term:
    preferred_term: artificial respiration
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory neuromuscular transmission failure
    treatment_effect: BYPASSES
    description: Assisted ventilation replaces inadequate respiratory-muscle output without reversing intracellular toxin action.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Treatment involves supportive care, intubation and mechanical
        ventilation when necessary, and administration of botulinum antitoxin.
      explanation: The guideline identifies ventilation and supportive care as core management.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Almost all patients with botulism can survive, even without antitoxin, if
      they receive supportive care, including mechanical ventilation, when
      required.
    explanation: Clinical guidance underscores the survival contribution of respiratory supportive care.
- name: Wound debridement and source control
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    For wound botulism, debride and control the colonized anaerobic wound in
    addition to antitoxin and supportive care. Antimicrobials do not treat the
    toxin-mediated neurologic syndrome and must be individualized to the wound
    context.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Route-specific toxin exposure or production
    treatment_effect: INHIBITS
    description: Wound source control reduces ongoing local clostridial toxin production.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Wound botulism is caused by clostridial colonization of an anaerobic

    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "After 2 days he noted diplopia and blurred vision and so consulted an
      ophthalmologist"
    explanation: Diplopia is a classic early cranial nerve manifestation of botulism,
      reflecting extraocular muscle weakness from neuromuscular junction blockade.
- name: Ptosis
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Ptosis
    term:

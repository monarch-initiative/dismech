    supports: SUPPORT
    snippet: "The clinical manifestations are flaccid, symmetrical, descending paralysis
      affecting cranial and peripheral nerves."
    explanation: Describes descending paralysis as the key clinical manifestation
      of botulism.
- name: Diplopia
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Diplopia
    term:
      id: HP:0000651

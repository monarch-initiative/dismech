treatments:
- name: Botulinum Antitoxin
  description: >-
    Administration of botulinum antitoxin to neutralize circulating toxin
    molecules not yet bound to nerve endings. Must be given early in the disease
    course (ideally within 24 hours of symptom onset) as it cannot reverse
    paralysis once toxin is internalized and has cleaved intracellular SNARE
    proteins.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The only specific treatment is botulinum antitoxin."
    explanation: The abstract identifies botulinum antitoxin as the specific
      treatment.
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The only specific treatment is botulinum antitoxin, which neutralizes toxin molecules that have not yet bound to nerve endings, preventing their binding to the neuromuscular junction."
    explanation: Confirms antitoxin works only against circulating unbound toxin;
      once toxin binds nerve endings and is internalized it cannot be neutralized,
      making early administration critical.
- name: Mechanical Ventilation and Intensive Care Support
  description: >-
    Mechanical ventilatory support for respiratory failure from diaphragm and
    intercostal muscle paralysis; intensive care monitoring for autonomic
    instability. Supportive care is the mainstay of management while awaiting
    spontaneous recovery via axonal sprouting and new neuromuscular junction
    formation.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: DOI:10.1007/s44197-024-00255-z
    reference_title: "The First Reported Foodborne Botulism Outbreak in Riyadh, Saudi Arabia: Lessons Learned"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the eight cases, six required intubation, one mimicked brain death, and two were stable."
    explanation: Majority of confirmed botulism cases required intubation for
      respiratory support, reflecting the central role of supportive ventilatory
      care in management.

epidemiology:
- name: United States national surveillance, 2021
  description: >-
    U.S. health departments reported 273 cases in 2021: 181 infant, 66 wound,
    22 foodborne, and four other. These are annual surveillance counts, not a
    population prevalence estimate or a universal subtype distribution.
  unit: reported cases in the United States during 2021
  evidence:
  - reference: url:https://www.cdc.gov/botulism/php/national-botulism-surveillance/2021.html
    reference_title: "National Botulism Surveillance Summary, 2021 | Botulism | CDC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2021, health departments reported 273 cases of botulism to CDC. Of
      those, 243 cases were laboratory-confirmed and 30 were probable (Table
      1). The cases were of the following types: 181 (66%) infant, 66 (24%)
      wound, 22 (8%) foodborne, and 4 (1%) other.
    explanation: CDC provides a year- and geography-specific national surveillance count.
progression:
- phase: Exposure to symptom onset
  incubation_days: '1'
  notes: >-
    The median incubation period was one day in a systematic review of 402
    foodborne and wound cases; timing varies with route and exposure.
  evidence:
  - reference: PMID:29293923
    reference_title: "Clinical Features of Foodborne and Wound Botulism: A Systematic Review of the Literature, 1932-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median incubation period was 1 day, and the median time from illness
      onset to hospital admission was 2 days.
    explanation: The systematic review quantifies early timing in foodborne and wound disease.
- phase: Early neurologic progression
  duration: First two hospital days are a high-risk interval for respiratory deterioration
  notes: >-
    Respiratory involvement can occur before reported extremity weakness, so a
    simple cranial-to-limb sequence should not be treated as absolute.
  evidence:
  - reference: PMID:29293923
    reference_title: "Clinical Features of Foodborne and Wound Botulism: A Systematic Review of the Literature, 1932-2015."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 154 patients for whom the hospital day of intubation was reported,
      134 (87%) were intubated on the first or second hospital day.
    explanation: Most reported intubations occurred very early after admission.
- phase: Recovery
  duration: Weeks to months
  notes: >-
    Recovery follows restoration of neuromuscular transmission; model evidence
    indicates a temporary contribution from sprouts followed by return of
    function to original terminals.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recovery, which takes weeks to months, occurs after sprouting of new nerve terminals."
    explanation: The guideline describes the prolonged recovery interval and sprouting response.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_endosomal_translocation
  hypothesis_label: Canonical acidified-endosome translocation route
  status: CANONICAL
  description: >-
    After receptor-mediated endocytosis at a cholinergic terminal, acidification
    drives heavy-chain channel formation and light-chain delivery directly from
    an endosomal compartment into the neuronal cytosol.
  evidence:
  - reference: PMID:17666397
    reference_title: Crucial role of the disulfide bridge between botulinum neurotoxin light and heavy chains in protease translocation across membranes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Intoxication requires the disulfide-linked, di-chain protein to undergo
      conformational changes in response to pH and redox gradients across the
      endosomal membrane with consequent formation of a protein-conducting
      channel by the heavy chain (HC) that translocates the light chain (LC)
      protease into the cytosol.
    explanation: Experimental work supports pH-driven endosomal channel formation and translocation.
- hypothesis_group_id: alternative_golgi_er_translocation
  hypothesis_label: Alternative retrograde Golgi-ER trafficking route
  status: EMERGING
  description: >-
    In engineered RenVM neurons exposed to BoNT/A, toxin was reported to travel
    from synapse to soma-localized Golgi and endoplasmic reticulum before
    Sec61-associated cytosolic retrotranslocation. Generalization to human
    peripheral motor and autonomic terminals remains unresolved.
  evidence:
  - reference: PMID:39196607
    reference_title: Botulinum toxin intoxication requires retrograde transport and membrane translocation at the ER in RenVM neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      An organelle-specific split-mNG complementation indicates BoNT/A traffic
      from the synapse to the soma-localized Golgi in a retromer-dependent
      fashion. The toxin then moves to the ER and appears to require the Sec61
      complex for retro-translocation to the cytosol.
    explanation: The study directly supports the alternative itinerary in its engineered neuron system.
- hypothesis_group_id: foodborne_gastrointestinal_mechanism
  hypothesis_label: Mechanism of the foodborne gastrointestinal prodrome
  status: EMERGING
  description: >-
    Nausea, vomiting, and abdominal pain occur in clinical cohorts, but the
    relative contributions of contaminated food, co-ingested products, local
    toxin effects, and autonomic dysfunction have not been resolved.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nausea 43"
    explanation: Clinical data establish occurrence but do not identify the causal mechanism.
pathophysiology:
- name: Route-specific toxin exposure or production
  description: >-
    Preformed toxin is ingested, inhaled, or injected in intoxication forms,
    whereas wound and intestinal forms generate toxin after local bacterial
    colonization. These distinct routes converge on absorption into the
    vascular circulation.
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  downstream:
  - target: Circulating botulinum neurotoxin reaches peripheral cholinergic terminals
    causal_link_type: DIRECT
    description: Toxin entering from any clinically recognized route is distributed through the circulation to peripheral cholinergic terminals.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Botulinum neurotoxin enters the vascular circulation (through ingestion,
        absorption from colonized wound or intestine, inhalation, or injection)
        and is transported to peripheral cholinergic nerve terminals, including
        neuromuscular junctions, postganglionic parasympathetic nerve endings,
        and peripheral ganglia
      explanation: The guideline explicitly connects each route to circulation and peripheral targets.
  - target: Foodborne gastrointestinal prodrome with unresolved mechanism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - foodborne_gastrointestinal_mechanism
    description: >-
      Gastrointestinal symptoms occur in botulism cohorts, particularly in the

    explanation: The guideline separates infant and adult intestinal colonization forms.
- name: Iatrogenic high-concentration toxin exposure
  description: >-
    Systemic botulism can follow excessive or otherwise clinically significant
    exposure during cosmetic or therapeutic toxin injection.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."

name: Botulism
creation_date: '2026-02-02T00:16:36Z'
category: Infectious Disease
parents:
- Bacterial Infection
disease_term:
  preferred_term: botulism
  term:
    id: MONDO:0005498
    label: botulism
description: >-
  Botulism is a neuroparalytic illness caused by botulinum neurotoxin (BoNT) produced
  by Clostridium botulinum and related clostridia. There are eight serotypes (A through
  H), all zinc-dependent endopeptidases (~150 kDa) composed of a ~100 kDa heavy chain
  (HC) and a ~50 kDa light chain (LC). Clinical forms include foodborne botulism
  (ingestion of preformed toxin), infant botulism (intestinal colonization), wound
  botulism (local infection), and iatrogenic botulism. The toxin is transported via
  the bloodstream to peripheral cholinergic nerve terminals, where it blocks
  acetylcholine release, causing the characteristic descending flaccid paralysis.
pathophysiology:
- name: BoNT Receptor Binding and Presynaptic Endocytosis
  description: >-
    Botulinum neurotoxin binds to the presynaptic membrane of peripheral cholinergic
    motor neurons through its heavy chain (HC). Binding requires a dual-receptor system:
    gangliosides on the plasma membrane accumulate the toxin, and a specific synaptic
    vesicle protein mediates endocytosis. Serotypes A and E use synaptic vesicle
    glycoprotein 2 (SV2); serotypes B and G use synaptotagmin. The toxin is internalized
    by endocytosis during synaptic vesicle recycling, entering the nerve terminal inside
    an endosome.
  cell_types:
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:23621114
    reference_title: "Identification of the SV2 protein receptor-binding site of botulinum neurotoxin type E."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SV2 (synaptic vesicle glycoprotein 2) mediates the uptake of BoNT/A and
      /E, whereas Syt (synaptotagmin) is responsible for the endocytosis of BoNT/B and /G."
    explanation: Identifies the serotype-specific dual-receptor system (SV2 or synaptotagmin)
      by which different BoNT serotypes are endocytosed into presynaptic nerve terminals.
  downstream:
  - target: Light Chain Translocation to Cytosol
    description: Endosomal acidification triggers HC conformational change enabling LC
      delivery to the cytosol

- name: Light Chain Translocation to Cytosol
  description: >-
    In the acidified endosome, the heavy chain (HC) undergoes conformational changes
    in response to pH and redox gradients across the endosomal membrane, forming a
    protein-conducting channel. This channel translocates the light chain (LC) zinc
    metalloprotease into the neuronal cytosol. Translocation depends on the intact
    disulfide bridge between LC and HC throughout the process; premature reduction
    aborts translocation. Once the LC is in the cytosol, the disulfide bridge is
    reduced, releasing the active protease.
  evidence:
  - reference: PMID:17666397
    reference_title: "Crucial role of the disulfide bridge between botulinum neurotoxin light and heavy chains in protease translocation across membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Intoxication requires the disulfide-linked, di-chain protein to undergo
      conformational changes in response to pH and redox gradients across the endosomal
      membrane with consequent formation of a protein-conducting channel by the heavy
      chain (HC) that translocates the light chain (LC) protease into the cytosol."
    explanation: Documents the mechanism by which the BoNT LC protease is delivered
      into the neuronal cytosol via an HC-formed endosomal channel, establishing the
      critical role of the LC/HC disulfide bridge in productive translocation.
  downstream:
  - target: SNARE Complex Cleavage by Light Chain Metalloprotease
    description: Translocated LC zinc metalloprotease cleaves SNARE proteins required
      for synaptic vesicle fusion

- name: SNARE Complex Cleavage by Light Chain Metalloprotease
  description: >-
    The translocated LC zinc-endopeptidase specifically cleaves SNARE proteins required
    for synaptic vesicle fusion with the presynaptic membrane. Different serotypes target
    different SNARE components: serotypes A, C, and E cleave SNAP-25
    (synaptosomal-associated protein of 25 kDa); serotypes B, D, F, and G cleave
    VAMP/synaptobrevin; serotype C also cleaves syntaxin. Cleavage of any component of
    the ternary SNARE complex (VAMP, SNAP-25, syntaxin) prevents functional complex
    assembly and therefore blocks synaptic vesicle fusion with the presynaptic membrane,
    arresting neurotransmitter exocytosis.
  biological_processes:
  - preferred_term: Proteolysis of SNARE complex proteins
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  - preferred_term: SNARE complex assembly inhibition
    term:
      id: GO:0035493
      label: SNARE complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:10601338
    reference_title: "Botulinum neurotoxin A blocks synaptic vesicle exocytosis but not endocytosis at the nerve terminal."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Tetanus and botulinum neurotoxins block neurotransmitter release by the
      enzymatic cleavage of proteins identified as critical for synaptic vesicle exocytosis."
    explanation: Establishes enzymatic cleavage of SNARE proteins (VAMP, SNAP-25,
      syntaxin) as the molecular mechanism by which botulinum neurotoxins block
      neurotransmitter release and prevent synaptic vesicle fusion.
  downstream:
  - target: Acetylcholine Release Inhibition
    description: Loss of functional SNARE complex prevents vesicle-membrane fusion
      and ACh exocytosis at the neuromuscular junction

- name: Acetylcholine Release Inhibition
  description: >-
    Botulinum toxin blocks stimulus-induced acetylcholine release at presynaptic nerve
    terminals, impairing neuromuscular transmission. Because SNARE cleavage prevents
    vesicle fusion, acetylcholine-loaded synaptic vesicles accumulate at the active
    zone but cannot release their contents, silencing the neuromuscular junction.
  biological_processes:
  - preferred_term: Neurotransmitter secretion inhibition
    term:
      id: GO:0007269
      label: neurotransmitter secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:8331029
    reference_title: "Botulinum toxin A inhibits acetylcholine release from cultured neurons in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clostridium botulinum type toxin A (BoTx) blocks stimulus-induced acetylcholine
      (ACh) release from presynaptic nerve terminals at peripheral neuromuscular junctions."
    explanation: Reports botulinum toxin inhibition of acetylcholine release at
      neuromuscular junctions, the direct consequence of SNARE protein cleavage.
  downstream:
  - target: Botulinum Neurotoxin-Mediated Neuromuscular Blockade
    description: Loss of ACh release at NMJ produces flaccid paralysis of innervated muscle

- name: Botulinum Neurotoxin-Mediated Neuromuscular Blockade
  description: >-
    Loss of acetylcholine release at neuromuscular junctions produces the characteristic
    descending, symmetrical flaccid paralysis of botulism. Cranial nerves are affected
    first (diplopia, ptosis, dysphagia, dysarthria), followed by descending weakness of
    truncal and limb muscles. Autonomic cholinergic terminals (postganglionic
    parasympathetic nerve endings) are also affected, producing xerostomia, constipation,
    and mydriasis. Paralysis of respiratory muscles can cause life-threatening respiratory
    failure. The central nervous system is not directly involved.
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "All forms of botulism manifest as a distinct clinical syndrome of symmetrical
      cranial nerve palsies followed by descending symmetrical flaccid paralysis of
      voluntary muscles, which may progress to respiratory failure and death"
    explanation: Documents the clinical syndrome of descending flaccid paralysis beginning
      with cranial nerve involvement and progressing to potentially fatal respiratory
      failure, the direct result of neuromuscular junction blockade.
phenotypes:
- name: Paralysis
  category: Neurologic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Paralysis
    term:

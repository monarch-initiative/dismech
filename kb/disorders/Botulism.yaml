name: Botulism
creation_date: '2026-02-02T00:16:36Z'
category: Infectious Disease
parents:
- Bacterial Infection
disease_term:
  preferred_term: botulism
  term:
    id: MONDO:0005498
    label: botulism
description: >-
  Botulism is a neuroparalytic illness caused by botulinum neurotoxin (BoNT),
  produced by Clostridium botulinum and related anaerobic bacteria. BoNT is a
  dichain zinc-endopeptidase (heavy chain ~100 kDa + light chain ~50 kDa) that
  binds presynaptic cholinergic nerve terminals, is endocytosed, and translocates
  its light chain into the cytosol where it cleaves SNARE proteins (SNAP-25,
  VAMP/synaptobrevin, or syntaxin in a serotype-specific manner), blocking
  acetylcholine vesicle fusion and causing descending flaccid paralysis.
  Clinical forms include foodborne, wound, and infant botulism; the toxin
  comprises at least eight antigenically distinct serotypes (A-H).
infectious_agent:
- name: Clostridium botulinum
  description: >-
    A gram-positive, spore-forming, obligate anaerobic bacterium found in soil
    and intestinal flora of animals. C. botulinum and rare related species
    (Clostridium baratii, Clostridium butyricum) produce botulinum neurotoxin,
    the most lethal biological substance known by weight. Heat-resistant spores
    survive boiling (100 degrees C) but are destroyed at 120 degrees C under
    pressure, enabling survival in inadequately processed food.
pathophysiology:
- name: Presynaptic Cholinergic Nerve Terminal Targeting and Endocytosis
  description: >-
    The heavy chain (HC) of BoNT binds with high affinity to gangliosides
    accumulated on the plasma membrane and to protein receptors on synaptic
    vesicle membranes (SV2 for serotypes A and E; synaptotagmin for serotypes B
    and G) exposed during vesicle exocytosis. This dual-receptor interaction
    clusters BoNT at cholinergic nerve terminals and triggers receptor-mediated
    endocytosis into synaptic vesicle-enriched endosomes.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: receptor-mediated endocytosis
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  downstream:
  - target: Light Chain Endosomal Translocation
    causal_link_type: DIRECT
    description: >-
      Endocytosis delivers the BoNT dichain into the endosomal lumen, where
      acidification drives the translocation step.
  evidence:
  - reference: PMID:23621114
    reference_title: "Identification of the SV2 protein receptor-binding site of botulinum neurotoxin type E."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SV2 (synaptic vesicle glycoprotein 2) mediates the uptake of BoNT/A and /E, whereas Syt (synaptotagmin) is responsible for the endocytosis of BoNT/B and /G."
    explanation: Identifies the dual-receptor basis for serotype-specific BoNT endocytosis
      at cholinergic terminals; SV2 for serotypes A/E, synaptotagmin for B/G.
  - reference: DOI:10.1111/jnc.70187
    reference_title: "Botulinum Neurotoxins: History, Mechanism, and Applications. A Narrative Review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BoNTs consist of a heavy chain that mediates high-affinity neuronal binding and endocytosis, and a light chain that, once translocated into the cytosol, acts as a zinc-dependent metalloprotease."
    explanation: Confirms the functional HC (binding/endocytosis) and LC (metalloprotease)
      domain architecture of BoNT.
- name: Light Chain Endosomal Translocation
  description: >-
    Endosomal acidification induces a pH-dependent conformational change in the
    heavy chain translocation domain, inserting it into the endosomal membrane
    to form a protein-conducting channel. The disulfide-linked light chain (LC)
    is translocated in an N-to-C-terminus orientation through this channel into
    the neuronal cytosol; reduction of the interchain disulfide bridge on the
    cytosolic face releases the LC as an active zinc-metalloprotease.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  downstream:
  - target: SNARE Protein Proteolytic Cleavage
    causal_link_type: DIRECT
    description: >-
      Released LC metalloprotease gains access to cytosolic SNARE proteins at
      the presynaptic membrane.
  evidence:
  - reference: PMID:17666397
    reference_title: "Crucial role of the disulfide bridge between botulinum neurotoxin light and heavy chains in protease translocation across membranes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Intoxication requires the disulfide-linked, di-chain protein to undergo conformational changes in response to pH and redox gradients across the endosomal membrane with consequent formation of a protein-conducting channel by the heavy chain (HC) that translocates the light chain (LC) protease into the cytosol."
    explanation: Directly demonstrates pH-driven HC channel formation and LC protease
      translocation across the endosomal membrane; shows the disulfide bridge must remain
      intact throughout translocation and be cleaved on the cytosolic face.
- name: SNARE Protein Proteolytic Cleavage
  description: >-
    The cytosolic light chain acts as a zinc-endopeptidase with strict
    serotype-specific SNARE substrate selectivity: serotypes A and E cleave SNAP-25;
    serotypes B, D, F, and G cleave VAMP/synaptobrevin; serotype C cleaves
    syntaxin and SNAP-25. Cleavage of any one SNARE component prevents
    assembly of the ternary SNARE complex required for synaptic vesicle
    membrane fusion, thereby blocking neurotransmitter exocytosis.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: proteolysis
    term:
      id: GO:0006508
      label: proteolysis
  - preferred_term: negative regulation of neurotransmitter secretion
    term:
      id: GO:0046929
      label: negative regulation of neurotransmitter secretion
  downstream:
  - target: Acetylcholine Release Inhibition
    causal_link_type: DIRECT
    description: >-
      SNARE cleavage abolishes the molecular machinery for synaptic vesicle
      fusion, selectively blocking acetylcholine release at cholinergic synapses.
  evidence:
  - reference: PMID:1331807
    reference_title: "Tetanus and botulinum-B neurotoxins block neurotransmitter release by proteolytic cleavage of synaptobrevin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tetanus and botulinum toxins serotype B are zinc endopeptidases, the activation of which requires reduction of the interchain disulphide bond. The protease activity is localized on the light chain and is specific for synaptobrevin, an integral membrane protein of small synaptic vesicles."
    explanation: Seminal demonstration that BoNT light chain is a zinc endopeptidase
      that specifically cleaves the SNARE protein synaptobrevin (VAMP) to block
      neurotransmitter release.
  - reference: PMID:35333944
    reference_title: "Toxicology and pharmacology of botulinum and tetanus neurotoxins: an update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tetanus and botulinum neurotoxins cause the neuroparalytic syndromes of tetanus and botulism, respectively, by delivering inside different types of neurons, metalloproteases specifically cleaving the SNARE proteins that are essential for the release of neurotransmitters."
    explanation: Confirms BoNT light chain acts as a metalloprotease cleaving SNARE
      proteins to block neurotransmitter release; applies across all serotypes.
  - reference: DOI:10.3390/ijms26020777
    reference_title: "Botulinum Toxin: A Comprehensive Review of Its Molecular Architecture and Mechanistic Action"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The toxin's mechanism of action involves a multi-step process: recognition, binding, and catalysis, ultimately blocking neurotransmitter release by cleaving proteins like SNAP-25, VAMP, and syntaxin."
    explanation: Explicitly names SNAP-25, VAMP, and syntaxin as the three serotype-specific
      SNARE substrates cleaved by BoNT.
- name: Acetylcholine Release Inhibition
  description: >-
    SNARE complex disruption prevents fusion of acetylcholine-containing synaptic
    vesicles with the presynaptic membrane at the neuromuscular junction and at
    autonomic cholinergic synapses. Vesicles accumulate but cannot release their
    contents, producing persistent blockade of acetylcholine transmission.
  cell_types:
  - preferred_term: cholinergic neuron
    term:
      id: CL:0000108
      label: cholinergic neuron
  biological_processes:
  - preferred_term: negative regulation of acetylcholine secretion, neurotransmission
    term:
      id: GO:0014058
      label: negative regulation of acetylcholine secretion, neurotransmission
  downstream:
  - target: Botulinum Neurotoxin-Mediated Neuromuscular Blockade
    causal_link_type: DIRECT
    description: >-
      Loss of acetylcholine at neuromuscular junctions produces complete motor
      blockade and descending flaccid paralysis.
  evidence:
  - reference: PMID:8331029
    reference_title: "Botulinum toxin A inhibits acetylcholine release from cultured neurons in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Clostridium botulinum type toxin A (BoTx) blocks stimulus-induced acetylcholine
      (ACh) release from presynaptic nerve terminals at peripheral neuromuscular junctions."
    explanation: Demonstrates botulinum toxin A specifically blocks stimulus-induced
      ACh release from presynaptic nerve terminals.
- name: Botulinum Neurotoxin-Mediated Neuromuscular Blockade
  description: >-
    Persistent blockade of acetylcholine release at motor nerve terminals and
    postganglionic parasympathetic synapses produces the characteristic
    syndrome: symmetrical, descending flaccid paralysis beginning with cranial
    nerve involvement (diplopia, ptosis, dysphagia, dysarthria) and progressing
    caudally to limb and trunk weakness; autonomic features (dry mouth, mydriasis,
    constipation, urinary retention) reflect parasympathetic blockade. Progressive
    respiratory muscle weakness may cause fatal apnea. Toxin type A causes
    the most severe syndrome with highest rates of ventilatory failure; recovery
    requires weeks to months via axonal sprouting and formation of new neuromuscular
    junctions.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: synaptic transmission, cholinergic
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "Botulism is rare neuroparalytic disease caused by botulinum toxin, one
      of the most toxic substances known."
    explanation: The abstract identifies botulinum toxin as the cause of the
      neuroparalytic disease.
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "All forms of botulism manifest as a distinct clinical syndrome of symmetrical cranial nerve palsies followed by descending symmetrical flaccid paralysis of voluntary muscles, which may progress to respiratory failure and death."
    explanation: Describes the characteristic descending cranial-nerve-to-peripheral
      progression of flaccid paralysis across all clinical forms of botulism.

      intestines (infant botulism and adult intestinal colonization botulism),
      and high-concentration cosmetic or therapeutic injections of toxin
      (iatrogenic botulism).
    explanation: The guideline distinguishes ingestion of toxin from colonization routes.
- name: Wound colonization with in-situ toxin production
  description: >-
    Toxigenic clostridia colonize an anaerobic wound and release toxin that is
    absorbed into the circulation.
  evidence:
  - reference: PMID:33956777

      explanation: This evidence supports the emerging alternative route only in the tested neuron model.
  evidence:
  - reference: PMID:16543415
    reference_title: SV2 is the protein receptor for botulinum neurotoxin A.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, SV2 acts as the protein receptor for BoNT/A."
    explanation: Genetic and cell-biological experiments identify SV2 as the BoNT/A protein receptor.
  - reference: PMID:23621114
    reference_title: Identification of the SV2 protein receptor-binding site of botulinum neurotoxin type E.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SV2 (synaptic vesicle glycoprotein 2) mediates the uptake of BoNT/A and /E, whereas Syt (synaptotagmin) is responsible for the endocytosis of BoNT/B and /G."
    explanation: The study supports serotype-dependent synaptic-vesicle protein receptors.
- name: Canonical acidified-endosome light-chain translocation
  description: >-
    Endosomal acidification induces a heavy-chain membrane channel. The
    disulfide-linked catalytic light chain crosses the membrane and is released
    into the cytosol after translocation.
  cell_types:

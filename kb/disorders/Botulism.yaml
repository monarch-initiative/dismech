    explanation: The review describes the upstream intestinal-colonization mechanism of infant botulism.
- name: Circulating botulinum neurotoxin reaches peripheral cholinergic terminals
  description: >-
    Absorbed toxin distributes to peripheral cholinergic sites, including
    skeletal neuromuscular junctions and postganglionic parasympathetic
    terminals. Direct central nervous system effects have not been documented
    in humans.
  cell_types:

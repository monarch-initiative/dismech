animal_models:
- species: Mus musculus
  background: Mouse sternomastoid neuromuscular junction after a single local BoNT/A injection
  category: Local intoxication and motor-endplate recovery model
  description: >-
    Repeated in-vivo imaging after a single intramuscular BoNT/A injection
    follows loss of parent-terminal vesicle cycling, temporary transmission by
    new sprouts, later recovery of the original terminal, and elimination of
    superfluous sprouts. It models local neuromuscular repair rather than
    route-specific systemic human botulism.
  associated_phenotypes:
  - Paralysis
  - Muscle weakness
  evidence:
  - reference: DOI:10.1073/pnas.96.6.3200
    reference_title: "Functional repair of motor endplates after botulinum neurotoxin type A poisoning: Biphasic switch of synaptic activity between nerve sprouts and their parent terminals"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By repeated in vivo imaging of
      N
      -(3-triethyl ammonium propyl)-4-(4-(dibutylamino)styryl) pyridinium
      dibromide uptake into identified nerve endings of the mouse sternomastoid
      muscle after a single intramuscular injection of the toxin, inhibition of
      stimulated uptake of the dye at the terminals was detected within a few
      days, together with an increase in staining of the newly formed sprouts.
    explanation: The source describes the species, local exposure, imaging method, and sprouting response.

transmission:
- name: Foodborne preformed-toxin ingestion
  description: >-
    Ingestion of toxin already produced in food causes an intoxication; the
    patient need not be colonized by the organism.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

    term:
      id: CL:0000108
      label: cholinergic neuron
  mechanism_confidence: ESTABLISHED
  biological_scale: ORGANISM
  downstream:
  - target: Cholinergic-terminal receptor binding and endocytosis
    causal_link_type: DIRECT
    description: Circulating toxin binds neuronal surface receptors at susceptible peripheral cholinergic terminals and is internalized.
    evidence:
    - reference: PMID:33956777
      reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The sequence of botulinum neurotoxin activity at the neuromuscular
        junction includes heavy-chain binding to a neuronal cell followed by

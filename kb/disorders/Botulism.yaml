discussions:
- discussion_id: botulism_er_route_human_relevance
  prompt: >-
    Does the retrograde Golgi-ER-Sec61 route observed in engineered RenVM
    neurons operate in human peripheral motor and autonomic terminals during
    naturally acquired botulism?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Alternative retrograde Golgi-ER trafficking in RenVM neurons
  - experimental_models#Engineered RenVM neuron trafficking model
  rationale: >-
    The reported itinerary challenges the canonical direct-endosomal model,
    but cell identity, reporter design, toxin subtype, and culture geometry may
    constrain generalization to human disease.
  evidence:
  - reference: PMID:39196607
    reference_title: Botulinum toxin intoxication requires retrograde transport and membrane translocation at the ER in RenVM neurons.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The toxin then moves to the ER and appears to require the Sec61 complex
      for retro-translocation to the cytosol.
    explanation: The wording "appears to require" and model context motivate explicit uncertainty.
- discussion_id: botulism_gastrointestinal_symptom_mechanism
  prompt: >-
    What causes nausea, vomiting, and abdominal pain in foodborne botulism, and
    how much is attributable to toxin action versus the contaminated meal or
    other co-exposures?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Foodborne gastrointestinal prodrome with unresolved mechanism
  rationale: >-
    Aggregate clinical data establish these manifestations but do not establish
    route-specific frequency or a causal molecular or autonomic pathway.
  evidence:
  - reference: PMID:33956777
    reference_title: "Clinical Guidelines for Diagnosis and Treatment of Botulism, 2021."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Nausea 43"
    explanation: The clinical cohort establishes frequency but not mechanism.
- discussion_id: botulism_toxin_and_organism_nomenclature
  prompt: >-
    How should new BoNT sequences, subtypes, and toxin-producing clostridial
    species be represented without treating a changing nomenclature as a fixed
    list of human disease serotypes?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - disease#Botulism
  rationale: >-
    Toxin nomenclature and bacterial taxonomy are evolving; genetic detection
    of a BoNT-like sequence does not by itself establish an agent of human
    botulism.
  evidence:
  - reference: PMID:37755971
    reference_title: Navigating the Complexities Involving the Identification of Botulinum Neurotoxins (BoNTs) and the Taxonomy of BoNT-Producing Clostridia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The nomenclature surrounding these toxins and associated bacteria has
      been evolving as new isolations and discoveries have arisen, resulting in
      challenges in diagnostic reporting, epidemiology and food safety studies,
      and in the application of therapeutic products.
    explanation: The review explicitly describes the nomenclature as evolving and operationally consequential.

description: >-
  Botulism is a rare, life-threatening neuroparalytic syndrome caused by
  botulinum neurotoxin (BoNT). Foodborne, inhalational, and many iatrogenic
  cases are intoxications with preformed toxin rather than bacterial
  infections; wound and intestinal forms instead involve colonization and
  toxin production in situ. Circulating toxin reaches peripheral cholinergic
  terminals, undergoes receptor-mediated uptake and intracellular
  translocation, and uses a zinc-endopeptidase light chain to cleave
  serotype-specific SNARE substrates. The resulting presynaptic acetylcholine
  blockade produces cranial-nerve palsies, descending flaccid paralysis,
  autonomic dysfunction, and potentially respiratory failure. Human disease is
  caused chiefly by toxin types A, B, and E and more rarely F; toxin and
  organism nomenclature continues to evolve and should not be reduced to a
  fixed A-H scheme.

      label: Ptosis
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The physical examination showed bilateral ptosis, mydriasis and sluggish
      pupillary response to light."
    explanation: Bilateral ptosis is a characteristic finding on physical examination
      in foodborne botulism, reflecting levator palpebrae muscle weakness.
- name: Mydriasis
  category: Ophthalmologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Mydriasis
    term:
      id: HP:0011499
      label: Mydriasis
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The physical examination showed bilateral ptosis, mydriasis and sluggish
      pupillary response to light."
    explanation: Pupillary dilation (mydriasis) and impaired pupillary light reflex
      reflect blockade of postganglionic parasympathetic cholinergic terminals
      innervating the iris sphincter.
- name: Dysphagia
  category: Gastrointestinal
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "progressive onset of dysphagia and xerostomia"
    explanation: Dysphagia (difficulty swallowing) is a cranial nerve manifestation
      of botulism reflecting pharyngeal and esophageal muscle weakness.
- name: Xerostomia
  category: Oral
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Xerostomia
    term:
      id: HP:0000217
      label: Xerostomia
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "progressive onset of dysphagia and xerostomia"
    explanation: Dry mouth (xerostomia) is an autonomic manifestation of botulism
      reflecting blockade of parasympathetic cholinergic innervation of the salivary
      glands.
- name: Respiratory Failure
  category: Respiratory
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Respiratory failure
    term:
      id: HP:0002878
      label: Respiratory failure
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "descending symmetrical flaccid paralysis of voluntary muscles, which may
      progress to respiratory failure and death"
    explanation: Respiratory failure is the most life-threatening complication of
      botulism, caused by paralysis of diaphragmatic and accessory respiratory muscles.
treatments:
- name: Botulinum Antitoxin
  description: >-
    Administration of botulinum antitoxin to neutralize circulating toxin. Must be
    given early — antitoxin only neutralizes toxin not yet bound to nerve endings and
    cannot reverse existing paralysis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The only specific treatment is botulinum antitoxin."
    explanation: Identifies botulinum antitoxin as the only specific treatment
      for botulism.
- name: Intensive Supportive Care
  description: >-
    Supportive management in an intensive care unit, including mechanical ventilation
    for respiratory failure, is a mainstay of therapy alongside antitoxin. Recovery
    requires weeks due to the time needed for new nerve terminal growth and
    neuromuscular junction reestablishment.
  treatment_term:
    preferred_term: Supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  evidence:
  - reference: PMID:31157190
    reference_title: "Foodborne Botulism: Neglected Diagnosis."
    supports: SUPPORT
    snippet: "The mainstays of therapy are meticulous intensive care and timely treatment
      with botulinum antitoxin, which may limit the extent of paralysis."
    explanation: Intensive care (including ventilatory support for respiratory failure)
      is identified as a mainstay of botulism management alongside antitoxin.

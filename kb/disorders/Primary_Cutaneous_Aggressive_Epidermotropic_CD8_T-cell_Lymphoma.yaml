inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Primary cutaneous aggressive epidermotropic CD8+ T-cell lymphoma arises
    sporadically through acquired somatic genomic rearrangements, copy-number
    alterations, and point mutations in cytotoxic T cells.
  evidence:
  - reference: PMID:33792220
    reference_title: "Deregulation of JAK2 signaling underlies primary cutaneous CD8(+) aggressive epidermotropic cytotoxic T-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study provides a comprehensive description of genetic alterations
      (i.e., genomic rearrangements, copy number alterations and small-scale
      mutations) with pathogenic relevance in this lymphoma, including events
      that recurrently impact genes with important roles in the cell cycle,
      chromatin regulation and the JAKSTAT pathway.
    explanation: >-
      Whole-genome and RNA sequencing demonstrate that the lymphoma is driven
      by acquired somatic genomic alterations rather than germline mendelian
      inheritance.

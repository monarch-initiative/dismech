differential_diagnoses:
- name: Mycosis Fungoides (CD8+ Variant)
  disease_term:
    preferred_term: mycosis fungoides
    term:
      id: MONDO:0009691
      label: mycosis fungoides
  description: >-
    CD8-positive mycosis fungoides shares epidermotropic CD8+ T-cell
    histopathology with PCAE-TCL, but presents with a prolonged, indolent
    course of patches and plaques rather than abrupt onset of rapidly
    progressive ulcerating tumors.
  distinguishing_features:
  - Prolonged history of patches and plaques rather than acute onset of ulcerating plaques and tumors
  - Indolent clinical progression rather than rapid extracutaneous dissemination
  evidence:
  - reference: PMID:29719018
    reference_title: "NK/T-cell lymphoma, nasal type, γδ T-cell lymphoma, and CD8-positive epidermotropic T-cell lymphoma-clinical and histopathologic features, differential diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CD8+ MF patients present with a history of a prolonged course of patches
      and plaques unlike the more common acute onset and rapid progression in
      PCAE-TCL.
    explanation: >-
      Contrasts the prolonged patch/plaque clinical course of CD8+ mycosis
      fungoides with the acute, rapidly progressive presentation of PCAE-TCL.
- name: Type D Lymphomatoid Papulosis
  disease_term:
    preferred_term: lymphomatoid papulosis
    term:
      id: MONDO:0020326
      label: lymphomatoid papulosis
  description: >-
    Type D lymphomatoid papulosis is a CD30-positive cytotoxic variant showing
    medium-sized pleomorphic CD8+ lymphocytes infiltrating the epidermis in a
    pagetoid pattern that mimics PCAE-TCL histologically, but follows a waxing
    and waning course with a favorable prognosis.
  distinguishing_features:
  - Self-healing waxing and waning papules and small nodules with favorable prognosis
  - Uniformly strong CD30 expression in a primary cutaneous CD30+ lymphoproliferative disorder
  evidence:
  - reference: PMID:29719018
    reference_title: "NK/T-cell lymphoma, nasal type, γδ T-cell lymphoma, and CD8-positive epidermotropic T-cell lymphoma-clinical and histopathologic features, differential diagnosis, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphomatoid papulosis (LyP) is a CD30+ lymphoproliferative disorder
      characterized by waxing and waning papules and small nodules that can
      centrally ulcerate but overall has a favorable prognosis. Type D LyP2,29
      is a cytotoxic variant of LyP often composed of medium-sized pleomorphic
      CD8+ lymphocytes infiltrating the epidermis in a pagetoid pattern.
    explanation: >-
      Establishes Type D lymphomatoid papulosis as a close histopathologic
      mimic of PCAE-TCL distinguished by waxing-and-waning self-resolving
      lesions and favorable prognosis.

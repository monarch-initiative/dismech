datasets:
- accession: geo:GSE266862
  title: Single-cell RNA sequencing comparison of CD4+, CD8+ and T-cell receptor γδ+ cutaneous T-cell lymphomas reveals subset-specific molecular phenotypes
  description: 'Background: Malignant clones of primary cutaneous T-cell lymphomas (CTCL) can show a CD4+, CD8+ or T-cell receptor γδ+ phenotype, but their individual impact on tumor biology and skin lesion formation remains ill-defined. We perform a comprehensive molecular characterization of CD4+ vs. CD8+ and TCR-γ/δ+ CTCL lesions. Methods: We performed scRNA-seq of 18 CTCL skin biopsies to compare classic CD4+ advanced-stage mycosis fungoides (MF) with TCR-γ/δ+ MF and primary cutaneous CD8+ aggressive epidermotropic cytotoxic T-cell lymphoma (Berti’s lymphoma).'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SINGLE_CELL_RNA_SEQ
  sample_count: 44
  publication: PMID:39133553
  notes: Identified by GEO DataSets index search for Primary Cutaneous Aggressive Epidermotropic CD8+ T-cell Lymphoma (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.

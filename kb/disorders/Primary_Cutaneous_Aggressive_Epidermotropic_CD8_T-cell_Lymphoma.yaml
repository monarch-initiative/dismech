    explanation: >-
      This human tumor genomic study identifies JAK2 and SH2B3 structural
      alterations as predominant molecular lesions.
  - reference: PMID:33792220
    reference_title: "Deregulation of JAK2 signaling underlies primary cutaneous CD8(+) aggressive epidermotropic cytotoxic T-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Besides the seven patients with structural alterations impacting the
      JAK2-SH2B3 signaling axis, four additional patients were found to carry
      bona fide gain-of-function SNV either in JAK3 (i.e., AEC5: p.R657W 12;
      AEC12: p.M511I13) or STAT5B (i.e., AEC1 and AEC6: p.N642H 14).
    explanation: >-
      Documents gain-of-function mutations in JAK3 and STAT5B in cases without
      JAK2-SH2B3 structural alterations, converging on JAK-STAT pathway
      activation.

histopathology:
- name: Nests, Cords and Trabeculae in a Fibromyxoid Background
  finding_term:
    preferred_term: uniform round to ovoid cells in nests, cords or trabeculae within a fibrous or myxoid background
  description: >-
    The architecture is the diagnostic clue. Uniform small round or ovoid
    cells sit in nests, cords or trabeculae within fibrous or myxoid stroma,
    with a variable eosinophilic infiltrate. That pattern is unlike Ewing
    sarcoma's sheets and brings myoepithelial tumours into the differential.
    In the PATZ1 stratum the picture differs: spindle and round cells with
    thick bands of intratumoral fibrosis.
  notes: >-
    No finding term is bound. A label search of NCIT through the OLS4 API on
    30 Oct 2026 for Small Round Cell, Round Cell Pattern and Myxoid returned
    disease concepts such as NCIT:C8300 Desmoplastic Small Round Cell Tumor
    and NCIT:C27781 Myxoid Liposarcoma rather than morphology findings.
    NCIT:C53643 Spindle Cell Pattern exists but describes the PATZ1 stratum
    rather than the architecture this item records.
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "A variable eosinophilic infiltrate was common."
    explanation: >-
      Records the eosinophilic infiltrate seen alongside the growth pattern in
      the eleven cases of this study.
  - reference: PMID:30379650
    reference_title: "Spindle and Round Cell Sarcoma With EWSR1-PATZ1 Gene Fusion: A Sarcoma With Polyphenotypic Differentiation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both tumors showed sheets and nests of round to spindle cells, fine chromatin, tiny conspicuous nucleoli, moderate cytoplasm, and thick bands of intratumoral fibrosis."
    explanation: >-
      The contrasting morphology of the PATZ1 stratum, from the two-case
      report, which is why this item describes the two strata separately
      rather than as one appearance.

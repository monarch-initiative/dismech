name: Round Cell Sarcoma with EWSR1-non-ETS Fusion
creation_date: '2026-10-30T15:40:00Z'
description: >-
  Round cell sarcoma with EWSR1-non-ETS fusion is the fourth and least settled
  entity of the undifferentiated small round cell sarcoma category introduced
  in the 2020 fifth edition of the World Health Organization classification of
  bone and soft tissue tumours, alongside Ewing sarcoma, CIC-rearranged
  sarcoma and sarcoma with BCOR genetic alterations. It is defined by what the
  fusion partner is not. Ewing sarcoma requires EWSR1 or FUS fused to a member
  of the ETS transcription factor family; these tumours carry EWSR1, or FUS,
  fused to something else.

  Two partners account for the described cases. EWSR1::NFATC2, and its FUS
  counterpart, is the better characterised: the fusion removes the
  N-terminal, calcineurin-dependent control region of NFATC2 and leaves its
  active domain under the EWSR1 transactivation domains, so a transcription
  factor normally held in check by calcium signalling becomes constitutively
  driven. These tumours arise mostly in the long bones of adults, form nests,
  cords or trabeculae in a fibrous or myxoid stroma, and express NKX3-1.
  EWSR1::PATZ1 is the second, a spindle and round cell sarcoma with
  polyphenotypic differentiation that coexpresses myogenic and neural markers.

  The grouping is provisional, and this entry says so rather than smoothing it
  over. DNA methylation profiling places EWSR1::NFATC2 tumours in a
  homogeneous cluster clearly separate from Ewing sarcoma, which is good
  evidence that they are not Ewing sarcoma; it is not evidence that they
  belong with EWSR1::PATZ1 tumours, which were themselves found to cluster
  away from other EWSR1-fusion sarcomas. The entity is a residual category
  held together by a negative criterion.
categories:
- Sarcoma
- Bone Cancer
parents:
- undifferentiated small round cell sarcoma
synonyms:
- sarcoma with EWSR1-non-ETS fusion
- EWSR1::NFATC2 sarcoma
- EWSR1::PATZ1 sarcoma
notes: >-
  Scope and its limits. This entry follows the 2020 World Health Organization
  category, which the reviewing literature describes as provisional and still
  evolving. Treat the two strata below as separately evidenced rather than as
  two faces of one mechanism: nothing cited here shows that EWSR1::NFATC2 and
  EWSR1::PATZ1 tumours share a programme, and the PATZ1 report that founded
  that stratum notes its cases clustered away from other EWSR1-fusion round
  cell sarcomas.

  A benign lesion carries the same fusion. FUS::NFATC2 or EWSR1::NFATC2
  fusions were found in a large proportion of simple bone cysts, a benign bone
  lesion. The authors state that the relationship of those lesions to sarcoma
  with the same fusion remains to be elucidated. So the fusion is not by
  itself diagnostic of malignancy, and a fusion result has to be read with the
  radiology and histology rather than instead of them. This is recorded as a
  differential diagnosis.

  EWSR1::PATZ1 also occurs in neuroepithelial tumours of the central nervous
  system, which are not covered by this entry.

  No cell of origin is marked, as in the sibling CIC and BCOR entries: the
  somatic lesion is recorded in the genetic section rather than as a
  genetic_context on a pathophysiology node, because no cell of origin is
  established for either stratum.

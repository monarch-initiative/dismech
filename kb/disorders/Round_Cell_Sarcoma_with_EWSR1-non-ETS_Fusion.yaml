diagnosis:
- name: NKX3-1 Immunohistochemistry
  description: >-
    NKX3-1, better known as a prostatic adenocarcinoma marker, is expressed in
    most EWSR1::NFATC2 sarcomas and was negative in all 20 Ewing sarcomas
    tested, so it separates the two immunohistochemically. Two caveats are
    part of the same study: every mesenchymal chondrosarcoma tested was also
    positive, and the one FUS::NFATC2 sarcoma tested was negative, so the
    stain does not cover the FUS form on this evidence.
  diagnosis_term:
    preferred_term: immunohistochemistry
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "NKX3-1 was expressed in 9 of 11 (82%) EWSR1-NFATC2 sarcomas, often diffuse and of moderate or strong intensity."
    explanation: >-
      The sensitivity figure, from eleven cases. Two of eleven were negative,
      so a negative stain does not exclude the diagnosis.
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although 1 of 30 osteosarcomas showed focal NKX3-1 positivity, all the remaining 155 cases tested, including 20 Ewing sarcomas, 20 myoepithelial tumors, 11 ossifying fibromyxoid tumors, and 1 FUS-NFATC2 sarcoma were negative for NKX3-1."
    explanation: >-
      The specificity result, and two bounds on it: the single FUS::NFATC2
      case tested was negative, so the stain is evidenced for the EWSR1 form
      only, and the mesenchymal chondrosarcomas reported elsewhere in the same
      study were all positive, so a positive stain does not identify this
      entity by itself.
imaging_findings:
- name: Osteolytic Diaphyseal Lesion with Cortical Expansion
  description: >-
    A radiologic-pathologic review of the whole undifferentiated small round
    cell sarcoma category describes these tumours as presenting with
    osteolytic lesions showing cortical expansion and saucer-like surface
    erosion in long bone diaphyses. The description is for the category as a
    whole rather than for either stratum, and the review hedges it as what
    such tumours may show, so it is an aid to recognition rather than a
    diagnostic criterion.
  evidence:
  - reference: PMID:41886300
    reference_title: "Undifferentiated Small Round Cell Sarcomas: Radiologic-Pathologic Correlation for the Updated WHO Classification Fifth Edition (2020)."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Sarcomas with EWSR1-non-ETS fusion genes may manifest as osteolytic lesions with cortical expansion and saucer-like surface erosion in long bone diaphyses."
    explanation: >-
      The imaging description for this entity from a review that sets out the
      radiologic-pathologic correlates of all four entities in the category.
      It is the review's synthesis rather than a measured series, and it is
      hedged as what these tumours may show.
differential_diagnoses:
- name: Ewing Sarcoma
  disease_term:
    preferred_term: Ewing sarcoma
    term:
      id: MONDO:0012817
      label: Ewing sarcoma
  description: >-
    The entity these tumours were separated from, and the differential the
    whole category exists to draw. CD99, NKX2-2 and PAX7 are frequently
    coexpressed here as well, so the usual Ewing immunoprofile does not
    exclude this diagnosis.
  distinguishing_features:
  - A non-ETS fusion partner, which is the defining criterion
  - A homogeneous DNA methylation cluster clearly segregating from Ewing sarcoma
  - Nests, cords or trabeculae in a fibromyxoid stroma, rather than sheets
  - NKX3-1 expression in most EWSR1::NFATC2 cases and in none of 20 Ewing sarcomas tested
  - Recurrent 9q losses with segmental gains at 20q13 and 22q12
  - CD99, NKX2-2 and PAX7 are coexpressed in both, so the usual Ewing panel does not separate them
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "EWSR1-NFATC2 sarcoma shares with classic Ewing sarcoma the small round cell cytology and co-expression of CD99, NKX2-2, and PAX7."
    explanation: >-
      Why the routine Ewing immunoprofile does not settle this differential:
      the two share the cytology and all three of the markers usually used to
      support a Ewing diagnosis. An introduction sentence summarising the
      cited literature rather than this paper's own result.
  - reference: PMID:30895378
    reference_title: "DNA methylation profiling distinguishes Ewing-like sarcoma with EWSR1-NFATc2 fusion from Ewing sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, URCS with EWSR1-NFATc2 fusion share a distinct DNA methylation signature and carry characteristic copy number alterations, which emphasizes that these sarcomas should be considered separately from EwS."
    explanation: >-
      The study's conclusion that these tumours should be considered
      separately from Ewing sarcoma, on methylation and copy number grounds.
  - reference: PMID:31049020
    reference_title: "EWSR1-NFATC2 and FUS-NFATC2 Gene Fusion-Associated Mesenchymal Tumors: Clinicopathologic Correlation and Literature Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both ESWSR1-NFATC2 and FUS-NFATC2 fusion-carrying tumors do not show microscopical or clinical features of Ewing sarcoma."
    explanation: >-
      A clinicopathological series reaching the same separation on
      morphological and clinical grounds. Four patients, so it is a small
      series, and the sentence contains the authors' own typographical slip in
      the gene name, quoted as printed.
- name: Simple Bone Cyst
  description: >-
    Not a malignant differential but a diagnostic trap, and the reason a
    fusion result cannot be read on its own. FUS::NFATC2 or EWSR1::NFATC2
    fusions were found in 6 of 11 simple bone cysts in one series, a benign
    bone lesion arising in the same bones. The authors state that the
    relationship between those lesions and sarcoma with the same fusion
    remains to be elucidated.
  distinguishing_features:
  - Radiologic and histopathologic features of a cyst, which is what the diagnosis rests on
  - The NFATC2 fusion is shared and therefore does not distinguish them
  evidence:
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted RNA sequencing showed a FUS-NFATC2 fusion in 4 of 11 SBCs and an EWSR1-NFATC2 fusion in 2 of 11 SBCs."
    explanation: >-
      The frequency of the fusions in simple bone cysts, which is what makes
      this a real pitfall rather than a curiosity. Eleven cysts, selected
      after radiologic-pathologic correlation.
  - reference: PMID:32991339
    reference_title: "FUS-NFATC2 or EWSR1-NFATC2 Fusions Are Present in a Large Proportion of Simple Bone Cysts."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although they can recur locally in a nondestructive manner, their clinical course and possible relation to sarcoma with EWSR1-NFATC2 or FUS-NFATC2 fusion remains to be elucidated."
    explanation: >-
      The authors' own statement that the relationship between these benign
      lesions and the sarcoma is unresolved, which is the limit on what this
      differential can claim.
- name: Mesenchymal Chondrosarcoma
  description: >-
    Relevant specifically because it shares the NKX3-1 stain. Every
    mesenchymal chondrosarcoma tested in the study that introduced NKX3-1 for
    this entity was positive, with staining confined to the primitive small
    round cell component. A positive NKX3-1 therefore narrows the
    differential without settling it.
  distinguishing_features:
  - PAX7, which mesenchymal chondrosarcoma consistently lacks and which this tumour expresses, so it resolves what NKX3-1 leaves open
  - A cartilaginous component, which is mostly NKX3-1 negative, beside the primitive round cell component
  - An EWSR1-non-ETS fusion, which mesenchymal chondrosarcoma does not carry
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 12 mesenchymal chondrosarcomas tested were also positive for NKX3-1, with over half showing diffuse staining and moderate or strong intensity. The positive staining was seen only in the primitive small round cell component, whereas the cartilaginous component was mostly negative."
    explanation: >-
      Establishes the overlap in the stain and localises it to the primitive
      round cell component, which is both the reason for the pitfall and the
      clue to resolving it.
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "consistently lacks PAX7 expression unlike EWSR1-NFATC2 sarcoma"
    explanation: >-
      What actually separates the two once NKX3-1 has failed to: mesenchymal
      chondrosarcoma consistently lacks PAX7, which this tumour expresses.
      The clause is in the paper's discussion of the literature rather than a
      result of its own, so it is graded BACKGROUND.
treatments:
- name: Ewing Sarcoma-Type Multiagent Chemotherapy
  description: >-
    These tumours are generally treated on Ewing sarcoma protocols, because
    the category was carved out of Ewing-like sarcoma and nothing has been
    developed for it. The literature describes the response as poor. No
    prospective trial has tested a regimen in this entity, and the published
    series are small enough that the evidence is experience rather than
    comparison.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Round Cell Sarcomatous Proliferation in a Fibromyxoid Stroma
    description: >-
      Cytotoxic chemotherapy is directed at the proliferating tumour cell
      population. The link records the target, not an established benefit.
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "despite poor responsiveness to Ewing-type chemotherapy regimens"
    explanation: >-
      An introduction clause summarising the reported response to Ewing-type
      regimens in this entity. It restates work the authors cite rather than
      their own result, and it gives no response rate, so it supports the
      qualitative statement only.

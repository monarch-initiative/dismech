- name: EWSR1-PATZ1
  display_name: EWSR1::PATZ1 spindle and round cell sarcoma
  subtype_term:
    preferred_term: round cell sarcoma with EWSR1-PATZ1 gene fusion
    term:
      id: MONDO:0958300
      label: round cell sarcoma with EWSR1-PATZ1 gene fusion
  description: >-
    A spindle and round cell sarcoma with polyphenotypic differentiation,
    coexpressing myogenic markers (desmin, myogenin, MyoD1) and neural markers
    (S100, SOX10, GFAP) together with CD99, alongside abundant intratumoral
    fibrosis. The combination mimics several other tumours, desmoplastic small
    round cell tumour among them. Its relationship to Ewing sarcoma and to the
    NFATC2 stratum is unresolved.
  evidence:
  - reference: PMID:30379650
    reference_title: "Spindle and Round Cell Sarcoma With EWSR1-PATZ1 Gene Fusion: A Sarcoma With Polyphenotypic Differentiation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "On immunohistochemistry, both tumors showed positivity for CD99, desmin, myogenin, MyoD1, S100, Sox10, CD34, and GFAP and were negative for keratin."
    explanation: >-
      The polyphenotypic immunoprofile that characterises this stratum, from
      the two-case report that described it. Two cases, so the profile is a
      description rather than an established frequency.
  - reference: PMID:30379650
    reference_title: "Spindle and Round Cell Sarcoma With EWSR1-PATZ1 Gene Fusion: A Sarcoma With Polyphenotypic Differentiation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The precise classification of this spindle and round cell sarcoma and its relationship to the Ewing sarcoma family of tumors remains to be determined."
    explanation: >-
      The authors' own statement that the classification is unsettled, which
      is why this entry presents the stratum as provisional rather than as an
      established member of a single entity.
pathophysiology:
- name: EWSR1 Fusion to a Non-ETS Partner
  description: >-
    A somatic in-frame fusion joining EWSR1, or FUS, to a transcription factor
    outside the ETS family. In the NFATC2 fusion the breakpoint removes the
    N-terminal, calcineurin-dependent control region of NFATC2 and leaves its
    active domain under the EWSR1 transactivation domains. The fusion is
    accompanied by amplification: the founding study described a ring
    chromosome and translocation and amplification of regions of 20q13 and
    22q12, the NFATC2 and EWSR1 loci.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: EWSR1
    term:
      id: hgnc:3508
      label: EWSR1
  - preferred_term: NFATC2
    term:
      id: hgnc:7776
      label: NFATC2
  - preferred_term: PATZ1
    term:
      id: hgnc:13071
      label: PATZ1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  notes: >-
    GAIN_OF_FUNCTION rather than INCREASED because the change is qualitative:
    in the NFATC2 fusion a transcription factor normally held under
    calcineurin control loses that control region, so the product is no longer
    the regulated molecule running faster but a different one. FUS is not
    listed as a gene descriptor here even though FUS::NFATC2 exists, because
    the node is named for the EWSR1 fusion that defines the entity and the
    FUS form is recorded in the subtype and in the genetic section.
  evidence:
  - reference: PMID:19318479
    reference_title: "The NFATc2 gene is involved in a novel cloned translocation in a Ewing sarcoma variant that couples its function in immunology to oncology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cloning of the breakpoint showed an in-frame fusion between the EWSR1 and NFATc2 genes, resulting in loss of the NH(2)-terminal, calcineurin-dependent control region and an intact active domain of NFATc2 controlled by the transactivation domains of EWSR1."
    explanation: >-
      The study that identified the fusion and defined its structural
      consequence: the regulatory region is lost and the active domain is
      driven by EWSR1. This is the basis for the constitutive-activity node
      below.
  - reference: PMID:19318479
    reference_title: "The NFATc2 gene is involved in a novel cloned translocation in a Ewing sarcoma variant that couples its function in immunology to oncology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular karyotyping showed the translocation and amplification of regions of chromosomes 20q13 and 22q12."
    explanation: >-
      Records that the fusion arose with amplification of both partner loci in
      the four cases studied, through a ring chromosome, rather than as a
      simple balanced translocation.
  downstream:
  - target: Constitutive NFATC2 Transcriptional Activity
    causal_link_type: DIRECT
    description: >-
      Removing the calcineurin-dependent control region leaves the active
      domain driven by the EWSR1 transactivation domains.
- name: Constitutive NFATC2 Transcriptional Activity
  description: >-
    NFATC2 is normally activated by calcineurin in response to calcium
    signalling, which is how the immune system controls it. The fusion
    protein retains the active domain but not that control region, so the
    transcriptional output is no longer conditional. This node covers the
    NFATC2 stratum only; no equivalent mechanism is recorded here for
    EWSR1::PATZ1, because the cited literature does not establish one.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0000981
      label: "DNA-binding transcription factor activity, RNA polymerase II-specific"
  evidence:
  - reference: PMID:19318479
    reference_title: "The NFATc2 gene is involved in a novel cloned translocation in a Ewing sarcoma variant that couples its function in immunology to oncology."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in loss of the NH(2)-terminal, calcineurin-dependent control region and an intact active domain of NFATc2 controlled by the transactivation domains of EWSR1"
    explanation: >-
      INDIRECT because the step from this structure to constitutive activity
      is an inference, the authors' own, rather than a measurement: the word
      constitutive does not appear in the source and no activity assay is
      reported. The structural basis for calling the activity constitutive is
      that the
      regulatory region that makes NFATC2 conditional on calcineurin is absent
      from the fusion, while the active domain is intact and driven by EWSR1.
      The inference from structure to constitutive activity is the authors',
      and the paper reports no activity assay in the abstract.
  downstream:
  - target: Distinct Transcriptional and Epigenetic Programme
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      These tumours carry a methylation and expression programme that
      separates them from Ewing sarcoma. The cited work shows the programme
      exists and is distinctive, not that the fusion produces it, so the
      steps between are unestablished.
- name: Distinct Transcriptional and Epigenetic Programme
  description: >-
    Tumours with the NFATC2 fusion form a homogeneous DNA methylation cluster
    that segregates clearly from Ewing sarcoma and from the CIC and BCOR
    groups, and they carry recurrent copy number changes: losses on 9q and
    segmental gains on 20q13 and 22q12 at the two partner loci. This is the
    strongest single argument that they are not Ewing sarcoma.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:30895378
    reference_title: "DNA methylation profiling distinguishes Ewing-like sarcoma with EWSR1-NFATc2 fusion from Ewing sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unsupervised hierarchical clustering and t-distributed stochastic neighbor embedding analysis of DNA methylation data revealed a homogeneous methylation cluster for URCS with EWSR1-NFATc2 fusion, which clearly segregated from EwS and the other subtypes."
    explanation: >-
      The methylation evidence separating this group from Ewing sarcoma and
      from the CIC and BCOR groups. Five cases of the fusion against large
      comparison groups, so the cluster is tight but small.
  - reference: PMID:30895378
    reference_title: "DNA methylation profiling distinguishes Ewing-like sarcoma with EWSR1-NFATc2 fusion from Ewing sarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Copy number profiles of EWSR1-NFATc2 cases showed recurrent losses on chromosome 9q and segmental gains on 20q13 and 22q12 involving the EWSR1 and NFATc2 loci, respectively."
    explanation: >-
      The recurrent copy number changes in the same five cases, including
      gains at both partner loci, which is consistent with the amplification
      described in the founding study.
  downstream:
  - target: Round Cell Sarcomatous Proliferation in a Fibromyxoid Stroma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The programme produces the tumour; the intervening steps are not
      established.
- name: Round Cell Sarcomatous Proliferation in a Fibromyxoid Stroma
  description: >-
    Uniform small round or ovoid cells, almost always showing at least focally
    a growth pattern of nests, cords or trabeculae within a fibrous or myxoid
    background, often with a variable eosinophilic infiltrate. That
    architecture, rather than the cytology, is what separates these tumours
    from Ewing sarcoma on a slide, and it is why they can be mistaken for
    myoepithelial tumours.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: positive regulation of cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008284
      label: positive regulation of cell population proliferation
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "All EWSR1-NFATC2 sarcomas consisted of uniform small round or ovoid cells, all except 1 showing at least focally the typical growth pattern of nests, cords, or trabeculae within a fibrous/myxoid background."
    explanation: >-
      The morphological description from the eleven cases in this study, and
      the basis for the architecture this node records. One of the eleven
      lacked the pattern even focally.
  downstream:
  - target: Bone or Soft Tissue Sarcoma of Adults
    causal_link_type: DIRECT
    description: >-
      The proliferating tumour presents as a bone or soft tissue mass, most
      often in a long bone.
  - target: Poor Response to Ewing Sarcoma Chemotherapy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      These tumours are treated on Ewing sarcoma protocols and respond poorly,
      although the overall course is reported as more indolent.
- name: Poor Response to Ewing Sarcoma Chemotherapy
  description: >-
    The reported picture is unusual: a more indolent clinical course than
    Ewing sarcoma, together with poor responsiveness to Ewing-type
    chemotherapy. Those two are not in tension, but they do mean that outcome
    here reflects tumour behaviour more than treatment effect. This node
    records an outcome; no resistance mechanism is established.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Some data suggest that EWSR1-NFATC2 sarcoma follows a more indolent clinical course than Ewing sarcoma"
    explanation: >-
      An introduction sentence summarising the clinical literature, hedged by
      its own authors as what some data suggest. It describes human clinical
      outcomes but is not this paper's result, and the hedge is the reason the
      node does not state the course more firmly.
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "despite poor responsiveness to Ewing-type chemotherapy regimens"
    explanation: >-
      The clause that carries the poor-response half of this node, from the
      same introduction sentence as the indolent-course clause above. It
      summarises the cited literature rather than reporting this paper's own
      result and gives no response rate, so it supports the qualitative
      statement only.

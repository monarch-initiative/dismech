  description: >-
    The better characterised stratum. It arises more often in bone than soft
    tissue, in adults with a peak in the third and fourth decades and a male
    predilection, and shows uniform small round or ovoid cells in nests, cords
    or trabeculae within a fibrous or myxoid background. NKX3-1 is expressed
    in most cases and is the practical marker.
  evidence:
  - reference: PMID:31972596
    reference_title: "NKX3-1 Is a Useful Immunohistochemical Marker of EWSR1-NFATC2 Sarcoma and Mesenchymal Chondrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature suggests that EWSR1-NFATC2 sarcoma occurs more commonly in bone than in soft tissue of adult patients with a peak incidence of third to fourth decades and a male predilection."
    explanation: >-
      The demographic and site profile of this stratum. The sentence is in the
      paper's introduction and summarises the literature the authors cite
      rather than their own series, so it is graded BACKGROUND while still
      describing human clinical data.
  - reference: PMID:31049020
    reference_title: "EWSR1-NFATC2 and FUS-NFATC2 Gene Fusion-Associated Mesenchymal Tumors: Clinicopathologic Correlation and Literature Review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In various mesenchymal tumors (e.g., myxoid/round cell liposarcoma, low-grade fibromyxoid sarcoma, or angiomatoid fibrous histiocytoma), the FUS gene, as a member of the TET family, may be alternatively rearranged instead of the EWSR1 gene without any noticeable influence on the microscopical appearance or clinical outcome. This fact seems not to apply to mesenchymal tumors with the involvement of the NFATC2 gene because both in our experience and according to the extensive literature review, they have different properties on the morphological and molecular level."
    explanation: >-
      Records that the usual interchangeability of FUS and EWSR1 in TET-family
      fusions does not hold for NFATC2 tumours. The claim rests on four
      reported patients plus the authors' literature review, so it is an
      observation from a small series rather than a comparative study.
- name: FUS-NFATC2
  display_name: FUS::NFATC2 sarcoma
  subtype_term:
    preferred_term: round cell sarcoma with FUS-NFATC2 gene fusion
    term:
      id: MONDO:0958301
      label: round cell sarcoma with FUS-NFATC2 gene fusion
  description: >-
    Kept separate from the EWSR1 form rather than folded into it, because the
    evidence here does not support treating them as interchangeable. In other
    TET-family tumours substituting FUS for EWSR1 changes neither appearance
    nor outcome; the series that looked at NFATC2 tumours specifically
    reported that this does not hold for them. The single FUS::NFATC2 case in
    the NKX3-1 study lacked the nested or corded pattern and was negative for
    CD99, NKX2-2 and NKX3-1, so neither the architecture nor the marker that
    characterise the EWSR1 form is established for this one. That rests on one
    case, which is the reason to keep the strata apart rather than to assert a
    difference.

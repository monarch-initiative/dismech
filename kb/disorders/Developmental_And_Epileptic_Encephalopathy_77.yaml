        the other way; the clinical association is nonetheless reported.

- name: Disrupted Neurodevelopment and Cortical Network Excitability
  biological_scale: TISSUE
  description: >
    Reducing the surface density of the GPI-anchored proteome during brain
    development yields a network that is both developmentally impaired and
    abnormally excitable. The epilepsy and the developmental impairment are two
    outputs of one lesion rather than a cause and its consequence, which is what
    a developmental and epileptic encephalopathy means. In the inherited GPI
    deficiencies as a group the process is progressive, with serial imaging
    showing cerebral and cerebellar volume loss over time.

biochemical:
- name: Serum alkaline phosphatase
  notes: >-
    Elevated serum alkaline phosphatase is reported in 62% of the 13 published
    PIGQ patients. This is worth stating carefully, because it cuts against the
    usual pathway-position reasoning for the inherited GPI deficiencies:
    hyperphosphatasia is the biochemical hallmark of the Mabry/HPMRS arm, whose
    lesions sit at the mannosyltransferase and later steps, and cell lines
    blocked before mannose addition degrade alkaline phosphatase rather than
    secreting it. PIGQ acts earlier than any of those. The observation
    nonetheless stands, and it is not unique to PIGQ within the first-step
    complex — elevated alkaline phosphatase has also been documented in PIGA
    patients. Two caveats: the enzyme was not measured in every published
    patient, so the 62% denominator is soft, and a normal alkaline phosphatase
    does not exclude the diagnosis, since hyperphosphatasia is a variable
    feature across GPI biosynthesis defects generally.
  evidence:
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alkaline phosphatase (ALP) is elevated only in 62% of cases."
    explanation: >-
      The PIGQ-specific frequency of the finding.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT

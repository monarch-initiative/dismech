description: >
  Developmental and epileptic encephalopathy 77 (DEE77; also catalogued as
  multiple congenital anomalies-hypotonia-seizures syndrome 4, OMIM #618548,
  and nosologically as PIGQ-CDG) is an autosomal recessive inherited
  glycosylphosphatidylinositol (GPI) deficiency caused by biallelic variants in
  PIGQ. PIGQ is a component of the GPI-N-acetylglucosaminyltransferase complex
  that performs the first, committed step of GPI anchor biosynthesis on the
  cytoplasmic face of the endoplasmic reticulum, transferring
  N-acetylglucosamine from UDP-GlcNAc onto phosphatidylinositol. At least 150
  human proteins reach the cell surface tethered by a GPI anchor, so reducing
  flux at the entry point of the pathway lowers the surface density of that
  whole protein class rather than removing one gene product.

  Clinically the disorder is a severe, early-onset developmental and epileptic
  encephalopathy. Across the 13 genetically confirmed patients reported to
  date, hypotonia, psychomotor delay, epilepsy, brain MRI abnormality, ocular
  abnormality and craniofacial dysmorphism were present in all; gastrointestinal
  problems and abnormal movements in about 90%. Seizure onset in the largest
  single series fell between 2.5 and 7 months of age and ranged from treatable
  seizures to recurrent status epilepticus. Multisystem involvement is
  prominent and can be life-threatening: two children in that series had midgut
  volvulus requiring surgery, cardiac anomalies including arrhythmias occur, and
  one patient had recurrent febrile-infection-triggered rhabdomyolysis. Mortality
  is high, with a median survival age of 5.5 years across the reported cohort.

  The functional lesion is demonstrable: flow cytometry of patient granulocytes,
  leukocytes and fibroblasts shows reduced surface GPI-anchored proteins, and
  transfection of wild-type PIGQ cDNA into patient fibroblasts restores them.
  Unlike its first-step-complex sibling PIGP, PIGQ deficiency is reported with
  elevated serum alkaline phosphatase in a majority of cases, which is
  mechanistically unexpected for a block this early in the pathway and is
  discussed below.
notes: >
  **Counts, not frequencies.** Only 13 genetically confirmed PIGQ-deficient
  patients had been published as of the 2025 review that assembled them, so
  every proportion in this entry is a fraction of a cohort of that size. Where a
  percentage is quoted it is quoted as the source states it, and no
  `frequency:` band has been derived from it.

  **Hyperphosphatasia: the point on which this entry departs from the
  pathway-position argument.** The received account, stated in the literature on
  inherited GPI deficiency and reproduced in this knowledge base's PIGP entry, is
  that hyperphosphatasia arises from defects in the *later* steps of GPI
  biosynthesis (Mabry syndrome / HPMRS being the type case), because GPI
  transamidase recognises an incomplete GPI that already bears mannose, cleaves
  the signal peptide, and releases soluble alkaline phosphatase into serum. In
  cell lines blocked *before* the first mannose is added — PIGL, DPM2, PIGX —
  alkaline phosphatase is degraded instead, so no hyperphosphatasia is predicted.
  PIGQ acts earlier still, at the very first GlcNAc transfer, so the pathway
  argument predicts a normal serum alkaline phosphatase.

  The reported data do not follow that prediction. The 2025 review of all 13
  published PIGQ patients states that alkaline phosphatase is elevated in 62% of
  cases, and its own new patient in whom the enzyme was measured had a level of
  632 U/l against a reference interval of 82-383. This is not an isolated
  anomaly: a 91-individual GPI-biosynthesis-defect series had already found
  elevated alkaline phosphatase in individuals with PIGA mutations — PIGA being
  the catalytic subunit of the same first-step GlcNAc transferase complex that
  PIGQ belongs to — and concluded that hyperphosphatasia is a variable feature
  that is not suitable for classifying these disorders.

  This entry therefore curates the observation and not the inference: elevated
  alkaline phosphatase is recorded as a documented biochemical and phenotypic
  feature of PIGQ deficiency, the mechanistic conflict is recorded as a
  knowledge gap, and no claim is made here that PIGQ deficiency spares alkaline
  phosphatase. Two honest caveats attach to the 62% figure. It is a proportion
  of a cohort of 13 assembled retrospectively from published reports, in which
  the enzyme was not measured in every patient — the review itself notes that
  among its own two new cases the measurement was made in only one — so the
  denominator is soft. And the review lists elevated alkaline phosphatase among
  the "less common" features, which is how it reads a 62% figure with missing
  data rather than a contradiction of the number.

  **What is deliberately not asserted.** The chain from reduced GPI-anchored
  protein surface density to a seizing, developmentally impaired cortex is a
  class-level argument. No study identifies which of the >150 GPI-anchored
  proteins mediates the neurological phenotype in PIGQ deficiency, so the edge
  into the neurodevelopmental node carries unknown intermediates and no
  individual client protein is named as the culprit. CD14, CD16, CD59, DAF,
  uPAR, CD90, CD109 and FLAER appear in this entry as measured readouts, not as
  pathogenic effectors. Likewise, the 2025 review states plainly that
  genotype-phenotype correlation cannot yet be established at this sample size,
  so none is asserted.

  Three further features reported by the pooled inherited-GPI-deficiency cohort
  (PMID:38456468) were considered and excluded on the same principle: corpus
  callosum anomalies (57%), symmetric restricted diffusion of the central
  tegmental tracts (60%), and renal anomalies (14%). These are frequencies
  across the whole IGD cohort, not PIGQ frequencies, and no PIGQ-specific source
  documents any of them. The callosal statements in this entry's other cached
  references all belong to other genes. PMID:29310717 is a six-column HPMRS
  comparison table and carries three separate ones: "thin corpus callosum"
  beside "Hearing impairment (5/16)" in the HPMRS2 (PIGO) column, where the /16
  denominator matches that column's n; the same phrase inside the "Further
  anomalies (rare)" list in the HPMRS1 (PIGV) column; and "Thin corpus callosum
  (9/26)" in the HPMRS4 (PGAP3) column. PMID:35562242 attributes its callosal
  sentence to GFUS-CDG, the GDP-L-fucose synthase disorder, not to the
  SLC35C1 transporter disorder discussed in the preceding paragraph. None of
  PIGV, PIGO, PGAP3 or GFUS is PIGQ. Pooled data supports a PIGQ-documented
  feature as INDIRECT evidence in this entry; it does not originate a phenotype
  here, so none of the three is curated.

  **No `conforms_to` was declared.** There is no GPI-anchor-biosynthesis module
  in `kb/modules/`, and the existing `congenital_disorder_of_glycosylation`
  module is scoped to the N-glycosylation machinery (LLO assembly, Golgi
  N-glycan processing, protein hypoglycosylation), which is a different lesion.
  None of the sibling inherited-GPI-deficiency entries (DEE38/ARV1, DEE55/PIGP,
  Mabry syndrome, CHIME syndrome, MCAHS) declares a conformance either. The gap
  is recorded as a discussion rather than papered over with a mismatched target.

  **Deep-research provenance.** Falcon (Edison) was requested and returned HTTP
  402 (account out of credits), so the run fell back to OpenScientist and the
  committed report is named for the provider that actually produced it
  (`research/Developmental_And_Epileptic_Encephalopathy_77-deep-research-openscientist.md`;
  `fell_back: true`, `requested_provider: falcon` in its frontmatter). Its
  reference validation resolved 12 of 12 citations with a confabulation rate of
  0.0 and no unresolved references; of the 12 assessed for relevance, 7 scored
  on topic and the rest were left unscored rather than judged off topic. Its
  term validation carries `needs_review: true` for one obsolete CURIE
  (GO:0031225, "anchored component of membrane") and four label mismatches,
  three of which are the report labelling an identifier with its ontology's name
  ("MONDO", "DOID") rather than the term's. Nothing from that list is bound
  here; GO:0031225 in particular is not used.

  `just preflight-dr` returns WARN because "GPI" is counted as a rival gene
  mentioned 82 times. That is a false positive of the same kind recorded on the
  PIGP entry: "GPI" here is glycosylphosphatidylinositol, the anchor, not GPI
  the glucose-6-phosphate isomerase gene. The report's disease identity checks
  out — MONDO's OMIM xref for MONDO:0032808 is 618548, which is the MCAHS4
  number the primary literature uses for PIGQ.

  The report contributed four sources that first-pass curation from the primary
  PIGQ papers had missed: the original GPI1/PIGQ characterisation with its
  antisense knockdown (PMID:11418246), the neuronal Piga conditional-knockout
  mouse (PMID:33607654), the prospective vitamin B6 cohort in GPI deficiency
  (PMID:35080266) and the PIGM/butyrate proof of concept (PMID:17442906). Two of
  its citations were deliberately not used. PMID:19732866 is about FOLR1
  mutations causing cerebral folate transport deficiency; the report itself
  labels the folinic-acid inference for PIGQ "mechanistic conjecture", and
  nothing cited here connects GPI deficiency to cerebral folate deficiency, so
  the claim was dropped rather than curated as a treatment. PMID:40126049, a
  266-patient cannabidiol study in monogenic epilepsies, mentions no PIG gene
  and no GPI anchor, so it cannot support anything specific to this disorder.
  The two 2025 case reports and the Starr phenotype paper (PMID:40718141,
  PMID:31148362) were found outside the report, by PubMed search.

  Every quote used in this entry was extracted programmatically from the fetched
  reference cache rather than copied from the report or retyped; several of the
  sources carry non-breaking spaces, en dashes and hard line wraps that
  hand-copying would have corrupted.

  **No `datasets:` block.** Searching a causal gene for expression datasets is
  the documented route into Named Entity Confusion, and for a disorder with 13
  published patients there is no disease-specific dataset to find. None was
  added rather than attaching a PIGQ-keyed accession about an unrelated disease.
classifications:
  icimd_category:
  - classification_value: lipid_glycosylation
    notes: >-
      ICIMD (Ferreira et al. 2021) group "Disorders of lipid glycosylation",
      which the classification explicitly scopes to include
      glycosylphosphatidylinositol biosynthesis. PIGQ acts at the first step of
      GPI anchor assembly.
    evidence:
    - reference: PMID:33340416
      reference_title: "An international classification of inherited metabolic disorders (ICIMD)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "glycolipids (glycosylphosphatidylinositol and glycosphingolipids) are included under the category of congenital disorders of glycosylation"
      explanation: >-
        The ICIMD paper places glycosylphosphatidylinositol among the glycolipids
        it files under congenital disorders of glycosylation, which is the group
        the `lipid_glycosylation` value names.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    All reported patients carry biallelic PIGQ variants, homozygous or compound
    heterozygous. Inherited GPI deficiencies are autosomal recessive as a group,
    with PIGA the single X-linked exception. Penetrance and expressivity slots
    are left unset: with 13 published patients and no reported unaffected
    biallelic carrier, neither has been assessed, and the 2025 review states
    explicitly that genotype-phenotype correlation cannot be established at this
    sample size.
  evidence:
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic biallelic PIGQ variants were associated with increased mortality. Epileptic seizures, axial hypotonia, developmental delay and multiple congenital anomalies were consistently observed."
    explanation: >
      Establishes biallelic PIGQ variants as the disease genotype and names the
      consistently observed core features.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, it is not possible to establish genotype–phenotype correlations due to limited phenotype data and small sample size."
    explanation: >
      The reason this entry records no genotype-phenotype correlation and leaves
      penetrance and expressivity unassessed.

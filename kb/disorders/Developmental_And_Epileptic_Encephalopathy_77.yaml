pathophysiology:
- name: Biallelic PIGQ Variants
  biological_scale: MOLECULAR
  description: >
    Germline biallelic PIGQ variants — homozygous or, more often, compound
    heterozygous. Reported alleles span splice-disrupting changes causing exon
    skipping, frameshifts, an in-frame single-codon deletion and missense
    substitutions. The recurrent allele is the in-frame deletion c.1199_1201del,
    p.(Tyr400del), found in six of the thirteen published patients and always in
    trans with a second variant — a pattern consistent with residual rather than
    absent PIGQ function, which is also what the group-level constraint on
    inherited GPI deficiency requires.
  genes:
  - preferred_term: PIGQ
    term:
      id: hgnc:14135
      label: PIGQ
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic PIGQ alleles. Both homozygous and compound heterozygous
      families are reported, so `zygosity` is deliberately left unset — the slot
      is single-valued and either value would misdescribe part of the cohort.
      `functional_impact_category` is PARTIAL_LOSS_OF_FUNCTION rather than
      LOSS_OF_FUNCTION because complete GPI deficiency is embryonically lethal,
      so every viable patient genotype must retain some activity; the recurrent
      Tyr400del allele was shown to restore GPI-anchored protein expression only
      mildly less efficiently than wild type.
    allelic_events:
    - MISSENSE_VARIANT
    - FRAMESHIFT_VARIANT
    - SPLICE_SITE_VARIANT
    - DELETION
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:24463883
    reference_title: "Clinical whole-genome sequencing in severe early-onset epilepsy reveals new genes and improves molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth OS patient had a recessive mutation in PIGQ that led to exon skipping and defective glycophosphatidyl inositol biosynthesis."
    explanation: >
      The founding observation linking a recessive PIGQ variant to
      early-onset epilepsy, and the first demonstration that the variant
      impairs GPI biosynthesis.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequent variant is in-frame pathogenic (PP5+PM4+PM2) deletion c.1199_1201del, p.(Tyr400del), placed in exon 6. This variant was found in six patients, in all cases in compound heterozygosity with other PIGQ variants."
    explanation: >
      Documents the recurrent p.(Tyr400del) allele and that it is always seen in
      compound heterozygosity, which is the basis for describing the genotype as
      partial rather than complete loss of function.
  - reference: PMID:34089469
    reference_title: "PIGQ-Related Glycophosphatidylinositol Deficiency Associated with Nonprogressive Congenital Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a novel homozygous variant in PIGQ (NM_004204.5: c.1631dupA; p.Tyr544fs*79) by WES trio-analysis of a male patient with a neurodevelopmental disorder characterized by nonprogressive congenital ataxia, intellectual disability, generalized epilepsy, and cerebellar atrophy."
    explanation: >
      A homozygous frameshift allele at the milder end of the reported spectrum,
      showing that the same gene can give a non-encephalopathic cerebellar
      presentation.
  - reference: PMID:25803904
    reference_title: "[Inherited GPI deficiencies:a new disease with intellectual disability and epilepsy]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with IGD have only a partial deficiency because complete GPI deficiency causes embryonic death."
    explanation: >
      The group-level constraint that makes every viable patient genotype
      hypomorphic, and therefore the reason this node is a reduction rather than
      an abolition of PIGQ function.
  downstream:
  - target: Reduced GPI-N-Acetylglucosaminyltransferase Activity
    description: >-
      PIGQ is a required component of the GPI-GlcNAc transferase complex, so
      biallelic hypomorphic alleles lower the complex's activity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31148362
      reference_title: "PIGQ glycosylphosphatidylinositol-anchored protein deficiency: Characterizing the phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PIGQ (OMIM *605754) encodes phosphatidylinositol glycan biosynthesis class Q (PIGQ) and is required for proper functioning of an N-acetylglucosamine transferase complex in a similar manner to the more established PIGA, PIGC, and PIGH."
      explanation: >-
        States that PIGQ is required for proper functioning of the
        N-acetylglucosamine transferase complex, which is the edge from the
        genotype to the enzymatic deficit.

- name: Reduced GPI-N-Acetylglucosaminyltransferase Activity
  biological_scale: MOLECULAR
  description: >
    The GPI-N-acetylglucosaminyltransferase (GPI-GnT) complex transfers
    N-acetylglucosamine from UDP-GlcNAc onto phosphatidylinositol on the
    cytoplasmic face of the endoplasmic reticulum. PIGQ is one of its
    components, alongside PIGA, PIGC, PIGH, PIGP, PIGY and DPM2 — which is why
    the PIGQ phenotype resembles those of its complex partners rather than those
    of the later assembly or remodelling genes.
  molecular_functions:
  - preferred_term: GPI-N-acetylglucosaminyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0017176
      label: phosphatidylinositol N-acetylglucosaminyltransferase activity
  evidence:
  - reference: PMID:34089469
    reference_title: "PIGQ-Related Glycophosphatidylinositol Deficiency Associated with Nonprogressive Congenital Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIGQ encodes the phosphatidylinositol glycan class Q protein and is part of the GPI-N-acetylglucosaminyltransferase complex that initiates GPI biosynthesis from phosphatidylinositol (PI) and N-acetylglucosamine (GlcNAc) on the cytoplasmic side of the endoplasmic reticulum (ER)."
    explanation: >
      Places PIGQ in the GPI-N-acetylglucosaminyltransferase complex and names
      the reaction and its subcellular location.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concretely, the PIGQ gene encodes an N-acetylglucosaminyl transferase component. As a part of a molecular complex, its function is to catalyze the transfer of N-acetylglucosamine (GlcNAc) from UDP-GlcNAc to phosphatidylinositol (PI) (Watanabe et al."
    explanation: >
      Names the substrate and product of the reaction PIGQ participates in.
  - reference: PMID:11418246
    reference_title: The human GPI1 gene is required for efficient glycosylphosphatidylinositol biosynthesis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Six human genes encode subunits of this enzyme, namely PIG-A, PIG-C, PIG-H, PIG-P, GPI1, and DPM2."
    explanation: >
      Enumerates the six subunits of the GPI-GlcNAc transferase complex. GPI1 is
      the former name of PIGQ (HGNC alias), so this is the composition claim for
      the complex this node describes.
  - reference: PMID:11418246
    reference_title: The human GPI1 gene is required for efficient glycosylphosphatidylinositol biosynthesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfectants exhibited a marked but incomplete decrease in the expression of a GPI-linked reporter protein, confirming that GPI1 is required for efficient GPI biosynthesis."
    explanation: >
      Antisense knockdown of GPI1/PIGQ in HEK293 cells reduced GPI-linked
      reporter expression, and did so incompletely — direct experimental support
      both for PIGQ being required for the reaction and for the deficit being
      partial rather than absolute.
  downstream:
  - target: Impaired Initiation of GPI Anchor Biosynthesis
    description: >-
      The GlcNAc transfer this complex performs is the first committed step of
      the pathway, so lowering its activity throttles the pathway at its
      entry point.
    causal_link_type: DIRECT

- name: Impaired Initiation of GPI Anchor Biosynthesis
  biological_scale: MOLECULAR
  description: >
    GPI anchor precursors are assembled stepwise in the endoplasmic reticulum
    and transferred en bloc to nascent proteins by the GPI transamidase, then
    remodelled before reaching the cell surface. Because PIGQ acts at the
    pathway's entry point, less precursor is available to every downstream step,
    and the deficit is felt by the whole GPI-anchored proteome rather than by a
    subset of clients.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
  evidence:
  - reference: PMID:24463883
    reference_title: "Clinical whole-genome sequencing in severe early-onset epilepsy reveals new genes and improves molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fourth OS patient had a recessive mutation in PIGQ that led to exon skipping and defective glycophosphatidyl inositol biosynthesis."
    explanation: >
      Directly reports defective GPI biosynthesis as the consequence of the
      PIGQ variant in the index patient.
  - reference: PMID:34089469
    reference_title: "PIGQ-Related Glycophosphatidylinositol Deficiency Associated with Nonprogressive Congenital Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The glycophosphatidylinositol (GPI) anchor pathway plays an essential role in posttranslational modification of proteins to facilitate proper membrane anchoring and trafficking to lipid rafts, which is critical for many cell functions, including embryogenesis and neurogenesis."
    explanation: >
      States what the GPI anchor pathway does for its client proteins, which is
      what is lost when the pathway is throttled at its first step.
  downstream:
  - target: Reduced GPI-Anchored Protein Surface Expression
    description: >-
      Less GPI precursor is available for transamidase-mediated attachment, so
      fewer client proteins reach the plasma membrane.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32588908
      reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Flow cytometry using granulocytes and fibroblasts from affected individuals showed reduced expression of glycosylphosphatidylinositol (GPI)-anchored proteins. Transfection of wildtype PIGQ cDNA into patient fibroblasts rescued this phenotype."
      explanation: >-
        The rescue by wild-type PIGQ cDNA is what makes this an edge rather than
        a coincidence: restoring PIGQ restores surface GPI-anchored proteins.

- name: Reduced GPI-Anchored Protein Surface Expression
  biological_scale: CELLULAR
  description: >
    The measurable cellular lesion. Granulocytes, leukocytes and fibroblasts
    from PIGQ patients show reduced surface levels of GPI-anchored proteins —
    CD16, CD14, FLAER, CD59, DAF, uPAR, CD90 and CD109 have all been used as
    readouts — and transduction of wild-type PIGQ restores them. Because at
    least 150 human proteins are GPI-anchored, the effect is a class-wide
    reduction in surface density rather than the loss of any single client.
    This entry names no culprit protein, because no experiment has identified
    one.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  - preferred_term: leukocyte
    term:
      id: CL:0000738
      label: leukocyte
  evidence:
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flow cytometry using granulocytes and fibroblasts from affected individuals showed reduced expression of glycosylphosphatidylinositol (GPI)-anchored proteins. Transfection of wildtype PIGQ cDNA into patient fibroblasts rescued this phenotype."
    explanation: >
      Demonstrates the cellular lesion in patient cells and shows it is
      PIGQ-dependent by rescue.
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We expand the phenotypic spectrum of PIGQ-related disease and provide the first functional evidence in human cells of defective GPI-anchoring due to pathogenic variants in PIGQ."
    explanation: >
      States that this was the first functional evidence in human cells of
      defective GPI-anchoring due to PIGQ variants.
  - reference: PMID:34089469
    reference_title: "PIGQ-Related Glycophosphatidylinositol Deficiency Associated with Nonprogressive Congenital Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry confirmed deficiency of several GPI-anchored proteins on leukocytes (CD14, FLAER)."
    explanation: >
      Independent confirmation in an unrelated patient, using different marker
      proteins.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression of CD109 and uPAR was slightly decreased in the patient’s fibroblasts (70% for uPAR, 32% for CD109, compared to the control), which was restored to the control level by retroviral transduction of wild-type PIGQ cDNA, suggesting that the reduction is due to PIGQ deficiency (Supplementary Figure S2)."
    explanation: >
      A third demonstration with retroviral rescue, and a quantified magnitude

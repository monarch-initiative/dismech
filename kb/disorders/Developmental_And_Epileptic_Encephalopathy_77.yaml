animal_models:
- name: Neuron-type-specific Piga conditional knockout mouse
  species: Mouse
  genotype: Piga conditional knockout, restricted to telencephalon excitatory, inhibitory, or thalamic neurons
  description: >
    There is no reported PIGQ mouse. This is a **Piga** model, and it is listed
    here for what it can and cannot do. Piga and Pigq are subunits of the same
    GPI-N-acetylglucosaminyltransferase complex, so a neuronal Piga knockout
    reproduces the shared upstream lesion — loss of GPI anchoring in neurons —
    rather than the PIGQ genotype. Three cell-type-restricted lines were made;
    the excitatory- and inhibitory-neuron lines showed impaired long-term fear
    memory and increased susceptibility to kainic-acid-induced seizures, with
    hippocampal synapse changes in the excitatory line. That is the closest
    experimental demonstration available that reducing neuronal GPI anchoring is
    sufficient to produce seizure susceptibility and cognitive impairment.
  publication: PMID:33607654
  modeled_mechanisms:
  - target: Disrupted Neurodevelopment and Cortical Network Excitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Neuronal GPI deficiency produces cognitive impairment, altered hippocampal
      synapses and lowered seizure threshold, which is the mechanism this node
      asserts.
    limitations: >-
      The disrupted gene is Piga, not Pigq: the model shares the complex and the
      pathway step but not the human genotype, and PIGA disease in humans is
      X-linked while PIGQ disease is autosomal recessive. The knockout is
      conditional and cell-type-restricted, so it models neuronal GPI loss
      rather than the constitutive partial deficiency of a patient, and it does
      not reproduce the multisystem congenital anomalies of PIGQ deficiency at
      all. `fidelity: LOW` reflects the gene mismatch, not a defect in the
      experiment.
    evidence:
    - reference: PMID:33607654
      reference_title: "Limb-clasping, cognitive deficit and increased vulnerability to kainic acid-induced seizures in neuronal glycosylphosphatidylinositol deficiency mouse models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Both Ex-M-cko and In-M-cko mice showed impaired long-term fear memory and were more susceptible to kainic acid-induced seizures."
      explanation: >-
        The behavioural and seizure-threshold result. INDIRECT because the gene
        disrupted is Piga, a partner subunit, and not PIGQ.
    - reference: PMID:33607654
      reference_title: "Limb-clasping, cognitive deficit and increased vulnerability to kainic acid-induced seizures in neuronal glycosylphosphatidylinositol deficiency mouse models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Hippocampal synapse changes were observed in Ex-M-cko mice."
      explanation: >-
        The synaptic correlate underlying the network claim in this node.
        INDIRECT for the same reason.
  evidence:
  - reference: PMID:33607654
    reference_title: "Limb-clasping, cognitive deficit and increased vulnerability to kainic acid-induced seizures in neuronal glycosylphosphatidylinositol deficiency mouse models."
    supports: SUPPORT

genetic:
- name: PIGQ
  gene_term:
    preferred_term: PIGQ
    term:
      id: hgnc:14135
      label: PIGQ
  relationship_type: CAUSATIVE
  notes: >
    PIGQ (OMIM *605754, 16p13.3) encodes a component of the
    GPI-N-acetylglucosaminyltransferase complex, which also contains PIGA, PIGC,
    PIGH, PIGP, PIGY and DPM2 and performs the first committed step of GPI
    anchor biosynthesis. That shared complex membership is why the PIGQ
    phenotype resembles those of PIGA, PIGP and PIGY deficiency more than those
    of the later assembly or remodelling genes. All 13 published patients have
    biallelic variants; the recurrent allele is the in-frame p.(Tyr400del),
    found in six of them and always in trans with a second variant.
  evidence:
  - reference: PMID:24463883
    reference_title: "Clinical whole-genome sequencing in severe early-onset epilepsy reveals new genes and improves molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work reveals two novel genes for OS, KCNT1 and PIGQ."
    explanation: >
      The paper that established PIGQ as a disease gene for this phenotype.
  - reference: PMID:31148362
    reference_title: "PIGQ glycosylphosphatidylinositol-anchored protein deficiency: Characterizing the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIGQ (OMIM *605754) encodes phosphatidylinositol glycan biosynthesis class Q (PIGQ) and is required for proper functioning of an N-acetylglucosamine transferase complex in a similar manner to the more established PIGA, PIGC, and PIGH."
    explanation: >
      Places PIGQ in the N-acetylglucosamine transferase complex alongside PIGA,
      PIGC and PIGH, which grounds the phenotypic comparison to its complex
      partners.
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequent variant is in-frame pathogenic (PP5+PM4+PM2) deletion c.1199_1201del, p.(Tyr400del), placed in exon 6. This variant was found in six patients, in all cases in compound heterozygosity with other PIGQ variants."
    explanation: >

mechanistic_hypotheses:
- hypothesis_group_id: canonical_gpi_initiation_flux_reduction_model
  hypothesis_label: Canonical GPI Initiation Flux Reduction Model
  status: CANONICAL
  description: >-
    Biallelic hypomorphic PIGQ variants lower the activity of the
    GPI-N-acetylglucosaminyltransferase complex, reducing flux through the first
    committed step of GPI anchor biosynthesis and thereby the surface density of
    the whole GPI-anchored proteome. Because that class is disproportionately
    important in neurogenesis and synaptic function, the result is a
    developmental and epileptic encephalopathy with multisystem congenital
    anomalies. The model rests on the rescue of GPI-anchored protein surface
    expression by wild-type PIGQ in patient fibroblasts and on independent
    demonstration of the cellular lesion in three unrelated patient sets.
discussions:
- discussion_id: pigq_hyperphosphatasia_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why is serum alkaline phosphatase elevated in most reported PIGQ patients
    when the pathway position of PIGQ predicts that alkaline phosphatase should
    be degraded rather than secreted?
  attaches_to:
  - pathophysiology#Reduced GPI-Anchored Protein Surface Expression
  - phenotypes#Elevated Circulating Alkaline Phosphatase Concentration
  - biochemical#Serum alkaline phosphatase
  rationale: >-
    The accepted mechanism of hyperphosphatasia in inherited GPI deficiency is
    that GPI transamidase recognises an incomplete GPI anchor already bearing
    mannose, cleaves the signal peptide, and releases soluble alkaline
    phosphatase into serum — which is why the Mabry/HPMRS arm, with lesions at
    the mannosyltransferase and later steps, is the hyperphosphatasia arm. In
    CHO lines blocked before mannose addition the enzyme is degraded instead.
    PIGQ acts earlier than any of those, so the prediction is a normal serum
    alkaline phosphatase. The clinical data disagree: the 2025 review of all 13
    published PIGQ patients reports elevation in 62%, and elevated alkaline
    phosphatase had already been documented in PIGA patients, PIGA being another
    subunit of the same first-step complex. Either the cell-line model does not
    capture what a partial first-step block does in vivo, or the elevation in
    these patients has a different source. Resolving it matters practically,
    because a normal alkaline phosphatase is currently treated as evidence
    against the Mabry arm and not against the MCAHS arm, and PIGQ sits awkwardly
    across that line.
- discussion_id: pigq_which_gpi_anchored_protein
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the more than 150 GPI-anchored proteins, or which combination,
    mediates the epilepsy and the developmental impairment in PIGQ deficiency?
  attaches_to:
  - pathophysiology#Reduced GPI-Anchored Protein Surface Expression
  - pathophysiology#Disrupted Neurodevelopment and Cortical Network Excitability
  rationale: >-
    The chain from reduced GPI anchor synthesis to a seizing, developmentally
    impaired cortex is a class-level argument: GPI-anchored proteins matter in
    neurogenesis, so reducing all of them must matter. The markers used in
    patients — CD14, CD16, CD59, DAF, uPAR, CD90, CD109, FLAER — were chosen
    because they are easy to stain, not because they are implicated in the
    phenotype. Until a responsible client is identified the edge into the
    neurodevelopmental node has unknown intermediates, and no protein-specific
    therapeutic target can be named.
- discussion_id: pigq_rhabdomyolysis_causality
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is febrile-infection-triggered rhabdomyolysis a feature of PIGQ deficiency,
    or a coincidental finding in one patient?
  attaches_to:
  - phenotypes#Rhabdomyolysis
  - pathophysiology#Multisystem GPI-Anchored Protein Dysfunction
  rationale: >-
    It has been reported once. The argument for causality is that reanalysis of
    that patient's exome found no other genetic explanation, and that
    persistent hyperCKemia has been reported in PIGY deficiency, another
    first-stage GPI gene. The argument against is a cohort of one. The reporting
    authors nonetheless recommend anticipating it because the episodes are
    life-threatening, so the clinical consequence of being wrong is asymmetric —
    which is why it is curated here with an explicit gap rather than omitted.
- discussion_id: pigq_pharmacological_upregulation
  kind: OPEN_QUESTION
  prompt: >-
    Can residual PIGQ expression be increased pharmacologically, as PIGM
    expression was by an HDAC inhibitor?
  attaches_to:
  - pathophysiology#Biallelic PIGQ Variants
  - pathophysiology#Reduced GPI-Anchored Protein Surface Expression
  rationale: >-
    Every viable PIGQ genotype is hypomorphic, so the disease is a
    residual-activity disorder rather than a null state — which makes raising
    residual output a coherent therapeutic target rather than a wish. There is
    one precedent within inherited GPI deficiency: in PIGM deficiency, where the
    lesion is a promoter mutation that disrupts Sp1 binding and leaves the
    coding sequence intact, the HDAC inhibitor butyrate raised PIGM
    transcription and surface GPI expression and stopped intractable seizures in
    a child. The mechanism does not transfer directly: the reported PIGQ alleles
    are coding, not promoter, so there is no hypoacetylated promoter to
    de-repress, and nothing suggests HDAC inhibition would help here. What the
    precedent establishes is the weaker and still useful claim that restoring
    GPI-anchored protein surface expression can control seizures in a patient —
    that the pathway is pharmacologically modifiable in principle. Whether any
    approach reaches PIGQ is untested.
  evidence:
  - reference: PMID:17442906
    reference_title: Targeted therapy for inherited GPI deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "the drug caused complete cessation of intractable seizures in a child with inherited GPI deficiency."
    explanation: >-
      The clinical result behind the proof-of-concept claim. INDIRECT because
      the treated child had PIGM deficiency, a promoter lesion in a different
      gene, not PIGQ deficiency.
  - reference: PMID:17442906
    reference_title: Targeted therapy for inherited GPI deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The histone deacetylase inhibitor butyrate increases PIGM transcription and surface GPI expression in vitro as well as in vivo through enhanced histone acetylation in an Sp1-dependent manner."
    explanation: >-
      The mechanism, which is also the reason it does not transfer to PIGQ: it
      works through Sp1-dependent transcription at a mutated promoter, and the
      reported PIGQ alleles are coding. INDIRECT because the gene is PIGM.
- discussion_id: pigq_gpi_module_absent
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should the shared GPI-anchor-biosynthesis lesion across PIGQ, PIGA, PIGP,
    PIGV, ARV1 and related deficiencies be factored out as a mechanism module?
  attaches_to:
  - pathophysiology#Impaired Initiation of GPI Anchor Biosynthesis
  rationale: >-
    This knowledge base already carries several inherited GPI deficiencies
    curated independently — Mabry syndrome, CHIME syndrome, MCAHS, DEE38 (ARV1),
    DEE55 (PIGP) and now this entry — each restating the same upstream chain.
    That is the pattern `kb/modules/` exists for. The existing
    `congenital_disorder_of_glycosylation` module is not a substitute: it is
    scoped to the N-glycosylation machinery, a different lesion. No GPI module
    exists, so this entry declares no `conforms_to`; recording the gap makes the
    omission visible rather than looking like an oversight.

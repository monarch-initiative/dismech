    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Hyperphosphatasia resulted \nfrom secretion of ALP, a GPI-anchored protein normally expressed on the cell \nsurface, into serum due to PIGV deficiency."
    explanation: >-
      Establishes the accepted mechanism of hyperphosphatasia in GPI deficiency
      — transamidase-mediated release of soluble alkaline phosphatase. INDIRECT
      because the experiment is in PIGV, not PIGQ.
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "In contrast, ALP \nwas degraded in PIGL-, DPM2-, or PIGX-deficient CHO cells, in which incomplete \nshorter GPIs that lacked mannose were accumulated."
    explanation: >-
      The counterpart result: cell lines blocked before mannose addition degrade
      alkaline phosphatase instead. This is the basis for saying the PIGQ
      observation is mechanistically unexpected. INDIRECT because the blocked
      genes are PIGL, DPM2 and PIGX rather than PIGQ.
  - reference: PMID:29310717
    reference_title: "Characterization of glycosylphosphatidylinositol biosynthesis defects by clinical features, flow cytometry, and automated image analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Elevation of AP has also been documented in some of the individuals with MCAHS, \nnamely those with PIGA mutations."
    explanation: >-
      Elevated alkaline phosphatase in patients with PIGA variants — another
      subunit of the same first-step complex — showing the PIGQ observation is
      not an isolated anomaly. INDIRECT because the patients are PIGA, not PIGQ.
  - reference: PMID:29310717
    reference_title: "Characterization of glycosylphosphatidylinositol biosynthesis defects by clinical features, flow cytometry, and automated image analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "hyperphosphatasia is a \nvariable feature that is not ideal for a clinical classification"
    explanation: >-
      Why a normal alkaline phosphatase does not exclude the diagnosis.
      INDIRECT because it is a statement about GPI biosynthesis defects as a
      group.
  - reference: PMID:25803904
    reference_title: "[Inherited GPI deficiencies:a new disease with intellectual disability and epilepsy]."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Hyperphosphatasia is observed in some patients with IGDs, such as hyperphosphatasia mental retardation syndrome or Mabry syndrome, caused by mutations in genes in the later stage of GPI biosynthesis."
    explanation: >-
      The received pathway-position account that the PIGQ data sit awkwardly
      with. INDIRECT because it is a group-level statement naming other genes.
- name: Serum creatine kinase
  notes: >-
    Normal between episodes, and above 5000 U/l during rhabdomyolysis triggered
    by febrile infection, in the single patient in whom this was documented.
    Not a screening test for PIGQ deficiency; recorded because the episodes are
    life-threatening and the reporting authors recommend anticipating them.
  evidence:
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HyperCKemia was found only in P1, with creatine kinase (CK) levels higher than 5000 U/l (N: <170) during episodes of rhabdomyolysis."
    explanation: >-
      The measured values, reference interval and their episodic restriction.
diagnosis:
- name: Whole exome sequencing
  description: >
    Molecular diagnosis. Every published patient was ascertained by exome or
    genome sequencing; the phenotype is not distinctive enough among the
    inherited GPI deficiencies to point at PIGQ clinically. The index case was
    found by whole-genome sequencing after conventional candidate-gene testing
    failed.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic biallelic PIGQ variants were associated with increased mortality. Epileptic seizures, axial hypotonia, developmental delay and multiple congenital anomalies were consistently observed."
    explanation: >
      This series established the genotype that sequencing is looking for.
  - reference: PMID:24463883
    reference_title: "Clinical whole-genome sequencing in severe early-onset epilepsy reveals new genes and improves molecular diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work reveals two novel genes for OS, KCNT1 and PIGQ."
    explanation: >
      The index case was identified by unbiased genome sequencing, which is why
      an untargeted approach rather than an epilepsy panel is the diagnostic
      route.
- name: Flow cytometry for GPI-anchored protein surface expression
  description: >
    Measurement of GPI-anchored protein levels on patient granulocytes,
    leukocytes or fibroblasts by flow cytometry. CD16, CD14, FLAER, CD59, DAF,
    uPAR, CD90 and CD109 have all been used. This is the standard functional
    assay for inherited GPI deficiency as a group rather than a PIGQ-specific
    test: it establishes that the GPI pathway is impaired, and sequencing
    establishes which gene. Its practical value is in resolving variants of
    uncertain significance — the 2025 report reclassified a PIGQ missense VUS to
    likely pathogenic on the strength of a flow-cytometry rescue experiment.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flow cytometry using granulocytes and fibroblasts from affected individuals showed reduced expression of glycosylphosphatidylinositol (GPI)-anchored proteins. Transfection of wildtype PIGQ cDNA into patient fibroblasts rescued this phenotype."
    explanation: >
      Establishes the assay and its rescue-based interpretation in PIGQ
      patients.
  - reference: PMID:34089469
    reference_title: "PIGQ-Related Glycophosphatidylinositol Deficiency Associated with Nonprogressive Congenital Ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry confirmed deficiency of several GPI-anchored proteins on leukocytes (CD14, FLAER)."
    explanation: >
      Independent diagnostic use of the same assay on leukocytes, with different
      markers.
  - reference: PMID:25803904
    reference_title: "[Inherited GPI deficiencies:a new disease with intellectual disability and epilepsy]."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Flow cytometric analysis of GPI-APs on granulocytes is also useful for the detection of IGD."
    explanation: >
      States the assay's role as a detection method for inherited GPI deficiency
      as a group. INDIRECT because it is a group-level recommendation, not a
      PIGQ-specific one.
- name: Serum alkaline phosphatase (supportive, not discriminating)
  description: >
    Elevated in 62% of published PIGQ patients, so a raised value supports the
    diagnosis. It does not discriminate within the inherited GPI deficiencies —
    hyperphosphatasia is a variable feature across the group and was explicitly
    judged unsuitable for classifying them — and a normal value does not exclude
    PIGQ deficiency. It is listed here because the combination of the core
    clinical features with a raised alkaline phosphatase is what should prompt
    testing for a GPI biosynthesis defect.
  evidence:
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alkaline phosphatase (ALP) is elevated only in 62% of cases."
    explanation: >
      The frequency that makes a raised value supportive rather than expected.
  - reference: PMID:29310717
    reference_title: "Characterization of glycosylphosphatidylinositol biosynthesis defects by clinical features, flow cytometry, and automated image analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "hyperphosphatasia is a \nvariable feature that is not ideal for a clinical classification"
    explanation: >
      Why it cannot be used to discriminate within the group. INDIRECT because
      the statement is about GPI biosynthesis defects generally.
treatments:
- name: Antiseizure Medication
  description: >
    Seizure control is the mainstay of management. Response is variable — the
    largest series describes a range from treatable seizures to recurrent status
    epilepticus — and in the more severely affected patients lifelong
    combination therapy achieves only partial control. No specific
    anticonvulsant has been shown to work better than others in PIGQ deficiency,
    and no such claim is made here. It is symptomatic: it does not address the
    GPI-anchor lesion.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  target_mechanisms:
  - target: Drug-Resistant Early-Onset Epilepsy
    treatment_effect: MODULATES
    description: >-
      Symptomatic seizure suppression, often incomplete. It does not alter the
      developmental trajectory.
  evidence:
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy in P1 started at age 3 months (infantile onset) and presented as infantile spasms with lifelong combined antiseizure medication needed to partially control the seizures."
    explanation: >
      Documents lifelong combination antiseizure medication achieving only
      partial control, which is both the treatment and the evidence for calling
      the epilepsy drug-resistant.
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizure onset occurred between 2.5 months and 7 months of age and varied from treatable seizures to recurrent episodes of status epilepticus."
    explanation: >
      Establishes that seizure response spans treatable disease to recurrent
      status epilepticus, which is why no uniform claim about efficacy is made.
- name: Pyridoxine or Pyridoxal 5-Phosphate
  description: >
    High-dose vitamin B6 (pyridoxine 20-30 mg/kg/day, switched to pyridoxal
    5-phosphate if unresponsive) is the one intervention that has been
    prospectively tested in inherited GPI deficiency epilepsy. The result was
    modest and is reported honestly here: in a seven-participant cohort, two had
    a more than 50% reduction in seizure frequency and three a smaller
    reduction, none became seizure-free, and EEG did not improve in six of
    seven. The participants had PIGA, PIGT or PIGV deficiency, not PIGQ
    deficiency — PIGA is a partner subunit in the same first-step complex as
    PIGQ, which is the closest the evidence comes, and it is still an
    extrapolation. No PIGQ patient has been reported on this regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
    - preferred_term: pyridoxal 5'-phosphate
      term:
        id: CHEBI:18405
        label: pyridoxal 5'-phosphate
  target_mechanisms:
  - target: Drug-Resistant Early-Onset Epilepsy
    treatment_effect: MODULATES
    description: >-
      Partial reduction in seizure frequency in some patients with inherited GPI
      deficiency. It does not address the GPI-anchor lesion and did not produce
      seizure freedom in anyone studied.
  evidence:
  - reference: PMID:35080266
    reference_title: "Pyridoxine or pyridoxal-5-phosphate treatment for seizures in glycosylphosphatidylinositol deficiency: A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "AIM: To investigate the short-term efficacy and safety of high-dose pyridoxine \nand pyridoxal 5-phosphate (P5P) in the treatment of inherited \nglycosylphosphatidylinositol (GPI) deficiency-associated epilepsy."
    explanation: >
      Establishes that this regimen was tested prospectively in inherited GPI
      deficiency epilepsy. INDIRECT because the cohort is the GPI-deficiency
      group and contains no PIGQ patient.
  - reference: PMID:35080266
    reference_title: "Pyridoxine or pyridoxal-5-phosphate treatment for seizures in glycosylphosphatidylinositol deficiency: A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We observed more than 50% seizure \nfrequency reduction in 2 out of 7 and less than 50% reduction in another 3 out \nof 7 participants. No participants reached seizure freedom."
    explanation: >
      The actual outcome, including that no participant reached seizure freedom
      — which is why this entry describes the benefit as partial rather than as
      a treatment. INDIRECT for the same reason.
  - reference: PMID:35080266
    reference_title: "Pyridoxine or pyridoxal-5-phosphate treatment for seizures in glycosylphosphatidylinositol deficiency: A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The genetic causes of \ninherited GPI deficiency were phosphatidylinositol \nN-acetylglucosaminyltransferase subunit A/T/V deficiency."
    explanation: >
      Names the genes the participants carried, which is the fact that makes
      every claim from this study an extrapolation to PIGQ. INDIRECT for that
      reason.
- name: Ketogenic Diet
  description: >
    The ketogenic diet is the empiric dietary intervention most often used in
    GPI anchor defects. The evidence is at the level of that subgroup of
    congenital disorders of glycosylation, not of PIGQ: no study has tested it
    in PIGQ deficiency, and this entry does not imply one has.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Ketogenic diet is most frequently used in GPI anchor defects"
    explanation: >
      States that the ketogenic diet is the intervention most often used in the
      GPI anchor defects, the subgroup PIGQ deficiency belongs to. INDIRECT
      because the claim reaches PIGQ only through subgroup membership.
- name: Surgical Correction of Midgut Volvulus
  description: >
    Emergency surgical correction of midgut volvulus, performed in two of the
    seven children in the largest single series. This is management of a
    life-threatening complication rather than treatment of the disorder, and it
    is the reason gastrointestinal symptoms in a patient with this diagnosis
    warrant a low threshold for imaging.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Volvulus
    treatment_effect: MODULATES
    description: >-
      Relieves the volvulus. It does not address the underlying developmental
      anomaly or the GPI-anchor lesion.
  evidence:
  - reference: PMID:32588908
    reference_title: "Early infantile epileptic encephalopathy due to biallelic pathogenic variants in PIGQ: Report of seven new subjects and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gastrointestinal issues were common and severe, two affected individuals had midgut volvulus requiring surgical correction."
    explanation: >
      Documents the surgical correction in two affected individuals.
- name: Enteral Feeding Support
  description: >
    Tube feeding for the feeding difficulties that follow the neurological
    impairment. For a disorder in which no reported patient achieves independent
    development and antiseizure medication is only partly effective, supportive
    care of this kind is most of what management consists of.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Feeding Difficulties
    treatment_effect: MODULATES
    description: >-
      Supportive management of feeding failure. It does not address the
      underlying lesion.
  evidence:
  - reference: PMID:40718141
    reference_title: "Two novel cases with PIGQ-CDG: expansion of the genotype-phenotype spectrum and evaluation of GestaltMatcher as a diagnostic tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P2 had to be fed via a nasogastric tube because of feeding difficulties."
    explanation: >
      Documents nasogastric tube feeding in a reported patient.

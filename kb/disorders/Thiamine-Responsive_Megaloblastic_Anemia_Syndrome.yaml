diagnosis:
- name: Thiamine-responsive megaloblastic anemia with normal B12 and folate
  description: >-
    The diagnosis turns on a negative as much as a positive: megaloblastic anemia with
    normal vitamin B12 and folate excludes the two common causes and points at a
    transport defect, and the response to oral thiamine is itself diagnostic. Biallelic
    SLC19A2 variants confirm it.
  evidence:
  - reference: PMID:20301459
    reference_title: Thiamine-Responsive Megaloblastic Anemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      megaloblastic anemia with normal vitamin B12 / folic acid levels, with or without
      diabetes or hearing loss, in whom there is a response to oral thiamine; and/or
      biallelic pathogenic variants in SLC19A2 identified by molecular genetic testing
    explanation: >-
      The GeneReviews Diagnosis/Testing criterion, giving both the biochemical-response
      route and the molecular one.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Recorded as a case count rather than a rate because no rate exists. The most recent
    review that says anything quantitative says two things: 183 patients in as many
    families worldwide, and that the prevalence and incidence remain unknown. Those are
    not in tension - the count is an ascertainment floor, not an estimate, and the same
    source notes that next-generation sequencing has been increasing it. One case in
    the same literature was carried as myelodysplastic neoplasm for years before the
    molecular diagnosis, which is a concrete reason to read the count as a floor.
  evidence:
  - reference: PMID:38037112
    reference_title: "An Italian case series' description of thiamine responsive megaloblastic anemia syndrome: importance of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent literature review conducted by Zhang et al. showed 183 patients with TRMA
      belonging to as many families from around the world
    explanation: >-
      The case count behind this record, and the one-family-per-patient detail that
      makes it a count of independent families rather than of related cases.
  - reference: PMID:38037112
    reference_title: "An Italian case series' description of thiamine responsive megaloblastic anemia syndrome: importance of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TRMA is an extremely rare syndrome, and to date, its prevalence and incidence are
      still unknown
    explanation: >-
      States directly that no rate is available, which is why this record carries a
      qualitative class and a case count rather than rate_per_100000.

histopathology:
- name: Dysplastic Erythropoiesis with Megaloblastic Changes
  finding_term:
    preferred_term: dysplastic erythropoiesis with megaloblastic changes
    term:
      id: NCIT:C35825
      label: Megaloblastic Erythroid Hyperplasia
  frequency: FREQUENT
  diagnostic: false
  description: >-
    The marrow finding, and the reason this entry needs one: it looks like
    myelodysplastic neoplasm. Dysplastic erythropoiesis with megaloblastic change,
    against normal serum folate and B12, is the picture that gets a TRMA patient
    diagnosed with MDS - one reported patient carried that diagnosis from age 26. What
    separates them is not the smear but what surrounds it: cytogenetics and molecular
    testing are normal, and the morphology reverts on thiamine. Marked not diagnostic
    for that reason: a finding that misdirects the diagnosis cannot be pathognomonic
    for the disease it disguises.
  context: >-
    The NCIT term is the closest available fit rather than an exact one. NCIT:C206357
    (Dyserythropoiesis) is the better label for the dysplastic component but is not
    reachable from any HistopathologyFindingTerm source node, so it cannot be bound
    here; NCIT:C82929 (Megaloblastoid Changes Present) is reachable but "megaloblastoid"
    is conventionally the hedged form of the word and the source says megaloblastic. The
    preferred_term therefore carries the finding as reported.
  evidence:
  - reference: PMID:39467528
    reference_title: >-
      Thiamine-Responsive Megaloblastic Anemia Syndrome Mimicking Myelodysplastic
      Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The bone marrow smear showed dysplastic erythropoiesis with megaloblastic changes,
      and normal findings in cytogenetic and molecular genetic examinations
    explanation: >-
      The finding itself, together with the normal cytogenetics that is half of what
      distinguishes it from a myelodysplastic neoplasm.
  - reference: PMID:39467528
    reference_title: >-
      Thiamine-Responsive Megaloblastic Anemia Syndrome Mimicking Myelodysplastic
      Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Folic acid and vitamin B12 in serum are normal with dysplastic erythropoiesis in
      the bone marrow often mimicking myelodysplastic neoplasms (MDS) as a potential
      differential diagnosis
    explanation: >-
      Generalizes the mimicry beyond the single case, and names the two normal
      laboratory values that make the marrow picture surprising in the first place.
  - reference: PMID:39467528
    reference_title: >-
      Thiamine-Responsive Megaloblastic Anemia Syndrome Mimicking Myelodysplastic
      Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with oral thiamine 100 mg daily was initiated, and 12 weeks later
      hemoglobin levels and bone marrow morphology had normalized
    explanation: >-
      The other half of the discrimination, and the one that matters mechanistically:
      the morphology is a cofactor-supply state rather than a clonal lesion, so it
      reverts.

- name: Ring Sideroblasts
  finding_term:
    preferred_term: ring sideroblasts present
    term:
      id: NCIT:C35995
      label: Ring Sideroblasts Present
  frequency: FREQUENT
  diagnostic: false
  description: >-
    Iron-laden mitochondria ringing the erythroblast nucleus, reported as a frequent
    finding on TRMA marrow smears. This is the second half of the resemblance to
    myelodysplastic neoplasm and arguably the more misleading half, because ring
    sideroblasts are a defining feature of one MDS subtype rather than a generic
    dysplastic change. Like the megaloblastic change above, it is not diagnostic of
    TRMA - it is what makes the wrong diagnosis plausible.

    Mechanistically it fits: thiamine pyrophosphate is a cofactor for the
    transketolase step this disease loses, and the mitochondrial iron accumulation
    reported here is the same lesion seen in the thiamine-responsive sideroblastic
    anaemias more broadly.
  evidence:
  - reference: PMID:39467528
    reference_title: >-
      Thiamine-Responsive Megaloblastic Anemia Syndrome Mimicking Myelodysplastic
      Neoplasm.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      bone marrow smears frequently show ring sideroblasts
    explanation: >-
      Reports the finding as frequent, in the sentence that names it as the specific
      reason distinguishing TRMA from MDS is difficult.

genetic:
- name: SLC19A2
  gene_term:
    preferred_term: SLC19A2
    term:
      id: hgnc:10938
      label: SLC19A2
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants. The gene was identified by positional cloning in six TRMA
    families and encodes THTR-1, a transmembrane protein homologous to the reduced
    folate carriers. Characterized patient variants act by disrupting plasma-membrane
    localization. Roughly half of the approximately sixty reported SLC19A2 variants are
    missense and few have been functionally characterized, so the mislocalization
    mechanism established for three of them is load-bearing rather than representative.
  evidence:
  - reference: PMID:10391221
    reference_title: "Mutations in SLC19A2 cause thiamine-responsive megaloblastic anaemia associated with diabetes mellitus and deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in a new gene, SLC19A2, encoding a putative transmembrane protein
      homologous to the reduced folate carrier proteins, were found in all affected
      individuals in six TRMA families
    explanation: The original gene identification across six families.
  - reference: PMID:33649974
    reference_title: >-
      The Effects of Genetic Mutations and Drugs on the Activity of the Thiamine
      Transporter, SLC19A2.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Approximately half of the 60 SLC19A2 mutations associated with TRMA are missense
      variants (Supplemental Table 1) (5, 25), yet few have been functionally
      characterized.
    explanation: >-
      Gives the variant-class distribution and, importantly, how little of it has been
      functionally tested. Graded OTHER because the sentence is a Discussion-section
      summary of prior reports rather than a result of this study - the same construct
      this entry already grades OTHER elsewhere.


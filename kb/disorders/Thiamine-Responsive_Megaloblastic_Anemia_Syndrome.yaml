environmental:
- name: Erythromycin exposure
  description: >-
    Erythromycin inhibits SLC19A2-mediated thiamine transport at clinically relevant
    unbound plasma concentrations, and prescribed patients show reduced thiamine
    pyrophosphate. In a patient who already has only residual low-affinity uptake, a
    drug acting on the same transporter is a plausible additional insult, which makes
    this worth recording even though it was identified in the general population rather
    than in TRMA.
  influences_mechanisms:
  - target: Loss of High-Affinity Thiamine Transport
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Pharmacological inhibition of the same transporter compounds the genetic loss of
      its function.
    evidence:
    - reference: PMID:33649974
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ten of 63 drugs inhibited SLC19A2-mediated thiamine transport ≥ 50% at
        screening concentrations; however, with the exception of erythromycin, none was
        predicted to inhibit SLC19A2 at clinically relevant unbound plasma
        concentrations.
      explanation: >-
        Identifies erythromycin as the one screened drug expected to inhibit the
        transporter at achievable concentrations.
  evidence:
  - reference: PMID:33649974
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data from electronic health records revealed reduced levels of thiamine
      pyrophosphate (TPP) in patients prescribed erythromycin, consistent with
      inhibition of SLC19A2-mediated thiamine transport.
    explanation: >-
      Confirms the inhibition has a measurable consequence for cofactor levels in
      people.

treatments:
- name: Pharmacologic Oral Thiamine
  description: >-
    Lifelong oral thiamine at 50-100 mg/day. It does not replace the missing
    transporter; it raises extracellular thiamine far enough that the residual
    low-affinity routes carry sufficient flux. The three disease arms respond
    differently, and the response is maintained only while treatment continues.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiamine
      term:
        id: CHEBI:26948
        label: vitamin B1
  target_mechanisms:
  - target: Intracellular Thiamine Pyrophosphate Deficiency
    treatment_effect: RESTORES
    description: >-
      Mass action through the residual uptake routes restores the intracellular
      cofactor pool. This is the step the treatment actually acts on.
    evidence:
    - reference: PMID:12393806
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The diabetes mellitus resolved after 6 weeks of thiamin repletion.
      explanation: >-
        Repletion reverses an established arm of the phenotype in the model, which is
        the clearest demonstration that raising substrate is sufficient.
  - target: Megaloblastic Anemia
    treatment_effect: RESTORES
    description: >-
      The anemia corrects, though macrocytosis persists and the anemia recurs if
      treatment stops.
    evidence:
    - reference: PMID:20301459
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The anemia is corrected with thiamine treatment, but the red cells remain
        macrocytic and anemia can recur if treatment is withdrawn.
      explanation: States both the response and its limits.
  - target: Diabetes Mellitus
    treatment_effect: MODULATES
    description: >-
      Partial: insulin requirement may fall and onset may be delayed, but not in
      everyone.
    evidence:
    - reference: PMID:20301459
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thiamine treatment may reduce insulin requirement and delay onset of diabetes
        in some individuals.
      explanation: >-
        Graded PARTIAL because the source itself hedges both the effect and the
        proportion of patients showing it.
  evidence:
  - reference: PMID:20301459
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lifelong use of pharmacologic doses (50-100 mg/day) of oral thiamine (vitamin B1)
      in affected individuals regardless of age.
    explanation: The GeneReviews Management recommendation, including dose and duration.

- name: Audiological and Metabolic Surveillance
  description: >-
    Annual monitoring of the efficacy of thiamine therapy and of progression across all
    three arms, since the hearing loss progresses independently of the treated arms.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: MODULATES
    description: >-
      Surveillance and standard hearing-loss management address the arm that treatment
      does not correct.
  evidence:
  - reference: PMID:20301459
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At least annual monitoring of the efficacy of the oral thiamine therapy and of
      disease progression
    explanation: The GeneReviews surveillance recommendation.

animal_models:
- name: Slc19a2-null mouse on thiamine-restricted diet
  species: Mouse
  genotype: Slc19a2 -/-
  publication: PMID:12393806
  description: >-
    Reproduces all three arms of the human triad, but only when dietary thiamine is
    withdrawn. That conditionality is the model's most informative feature: it shows
    the phenotype is a function of transport capacity relative to substrate supply, not
    of the genotype alone.
  modeled_mechanisms:
  - target: Pancreatic Beta Cell Dysfunction
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Develops diabetes with reduced insulin secretion on a thiamine-free diet, and the
      diabetes resolves on repletion.
    limitations: >-
      Requires dietary thiamine restriction to manifest, whereas human patients become
      symptomatic on a normal diet; the mouse therefore models the mechanism faithfully
      but not the human threshold.
    readouts:
    - name: Insulin secretion
      target: Pancreatic Beta Cell Dysfunction
      direction: DECREASED
      interpretation: Secretory failure is the proximate cause of the hyperglycaemia.
      evidence:
      - reference: PMID:12393806
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          On a thiamin-free diet, Slc19a2(-/-) mice developed diabetes mellitus with
          reduced insulin secretion and an enhanced response to insulin.
        explanation: Measures the secretory defect and distinguishes it from resistance.
    - name: Glycaemic status after thiamine repletion
      target: Pancreatic Beta Cell Dysfunction
      direction: RESTORED
      interpretation: >-
        Reversibility on repletion establishes that the defect is a substrate-supply
        problem rather than fixed damage.
      evidence:
      - reference: PMID:12393806
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The diabetes mellitus resolved after 6 weeks of thiamin repletion.
        explanation: The rescue arm of the experiment.
    evidence:
    - reference: PMID:12393806
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, Slc19a2(-/-) mice have provided new insights into the TRMA disease
        pathogenesis and will provide a tool for studying the role of thiamin
        homeostasis in diabetes mellitus more broadly.
      explanation: The authors' own statement of the model's relevance to the disease.
  - target: Selective Inner Hair Cell Loss
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the hearing loss and localizes it to selective inner hair cell loss,
      which explains the auditory-neuropathy pattern seen clinically.
    limitations: >-
      As with the diabetes, manifests only under dietary thiamine restriction; and the
      histology was obtained after defined low-thiamine challenges rather than across a
      lifetime of partial deficiency.
    readouts:
    - name: Auditory brainstem response versus otoacoustic emission thresholds
      target: Selective Inner Hair Cell Loss
      direction: INCREASED
      interpretation: >-
        The discrepancy between the two measures is the functional signature of a
        lesion at the inner hair cell rather than the outer.
      evidence:
      - reference: PMID:16642288
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Slc19a2-null mice showed 40-60 dB threshold elevations by auditory brainstem
          response (ABR), but only 10-20 dB elevation by otoacoustic emission (OAE)
          measures.
        explanation: Quantifies the discrepancy that identifies the site of the lesion.
    evidence:
    - reference: PMID:16642288
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cochlear function is normal in these mutants when maintained on a high-thiamine
        diet.
      explanation: >-
        The control condition that makes the model interpretable: genotype alone is not
        sufficient.

discussions:
- discussion_id: trma_why_hearing_does_not_respond
  kind: INTERPRETATION
  prompt: >-
    Why does thiamine rescue the anemia and the diabetes but not the hearing loss?
  attaches_to:
  - pathophysiology#Selective Inner Hair Cell Loss
  - treatments#Pharmacologic Oral Thiamine
  rationale: >-
    The three arms differ in whether the affected cells persist. Erythroid precursors
    are continuously replaced, so restoring the cofactor restores production. Beta cell
    dysfunction is at least partly functional, and the mouse diabetes resolved on
    repletion. Inner hair cells, by contrast, are lost - the mouse shows selective
    death of those cells under thiamine restriction - and mammalian cochlear hair cells
    do not regenerate. On that reading the deafness is irreversible not because the arm
    is thiamine-independent but because its endpoint is cell death rather than cell
    dysfunction, which predicts that treatment started before hair cell loss would
    preserve hearing while treatment started after would not. Whether that prediction
    holds in patients is the practical question, and the case-series emphasis on early
    diagnosis is consistent with it without establishing it.

- discussion_id: trma_residual_transport_threshold
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines the thiamine concentration at which residual transport becomes
    sufficient, and does it differ between the affected tissues?
  attaches_to:
  - pathophysiology#Loss of High-Affinity Thiamine Transport
  rationale: >-
    Pharmacologic thiamine works by driving flux through low-affinity routes, so each
    tissue's threshold depends on its residual transporter expression and its cofactor
    demand. The mouse becomes normal on a high-thiamine diet and sick on a thiamine-free
    one, which brackets the threshold in that model but not in patients. If the
    thresholds differ between marrow, islet and cochlea, that would explain the
    differing arm responses as a dosing problem rather than an intrinsic one - and
    would imply the standard 50-100 mg/day is adequate for some tissues and not others.
    No tissue-level threshold data were found in the sources used here.

notes: >-
  Relationship to the SLC19A3 disease. kb/disorders/Biotin_Thiamine_Responsive_Basal_Ganglia_Disease.yaml
  covers the disease of THTR-2, the low-affinity transporter encoded by SLC19A3. The two
  are transporter paralogues with non-overlapping phenotypes, and the relationship is
  mechanistically informative: the residual uptake that makes TRMA treatable is carried
  substantially by the very transporter whose own loss causes the other disease.

  Named Entity Confusion. The preflight returned WARN on a rival gene "HP" at 26% of
  SLC19A2 mentions. That is a false positive of the gene-symbol matcher: the report
  contains 26 HP:NNNNNNN HPO CURIEs and no mention of haptoglobin. Checked rather than
  assumed before proceeding.

  Treatment modelling. The thiamine treatment carries three separate target_mechanisms
  with different effects rather than one link to the disease, because the arms genuinely
  differ: RESTORES on the cofactor deficiency and on the anemia, MODULATES on the
  diabetes. There is deliberately no link from thiamine to the hearing-loss node; the
  source says the deafness is irreversible and may not be prevented, and a link there
  would assert a benefit the evidence denies. The surveillance treatment carries that
  arm instead.

  Erythromycin. Recorded as an environmental exposure acting on the transport node. The
  evidence comes from the general population rather than from TRMA patients, and the
  entry says so; it is included because a drug that inhibits the same transporter is a
  mechanistically specific hazard for someone already dependent on residual transport.

pathophysiology:
- name: Biallelic SLC19A2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous SLC19A2 variants. Characterized variants
    disrupt trafficking of THTR-1 to the plasma membrane rather than only its catalytic
    behaviour, so the transporter is absent from the site where it would act.
  evidence:
  - reference: PMID:33649974
    reference_title: "The Effects of Genetic Mutations and Drugs on the Activity of the Thiamine Transporter, SLC19A2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Three previously uncharacterized SLC19A2 variants identified in TRMA patients
      exhibited disrupted localization to the plasma membrane along with
      near-complete loss-of-function.
    explanation: >-
      Establishes mislocalization as the molecular consequence of patient variants,
      measured directly rather than predicted.
  downstream:
  - target: Loss of High-Affinity Thiamine Transport
    causal_link_type: DIRECT
    description: Absent functional THTR-1 removes the high-affinity uptake route.

- name: Loss of High-Affinity Thiamine Transport
  biological_scale: CELLULAR
  description: >-
    The high-affinity component of thiamine uptake is lost. Crucially, uptake is not
    abolished: the low-affinity transporter and passive diffusion remain, which is why
    the defect is one of capacity at physiological thiamine concentrations rather than
    an absolute block.
  molecular_functions:
  - preferred_term: thiamine transmembrane transporter activity
    modifier: DECREASED
    term:
      id: GO:0015234
      label: thiamine transmembrane transporter activity
  biological_processes:
  - preferred_term: thiamine transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0071934
      label: thiamine transmembrane transport
  evidence:
  - reference: PMID:12393806
    reference_title: "Targeted disruption of Slc19a2, the gene encoding the high-affinity thiamin transporter Thtr-1, causes diabetes mellitus, sensorineural deafness and megaloblastosis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Erythrocytes from Slc19a2(-/-) mice lacked the high-affinity component of thiamin
      transport.
    explanation: >-
      Demonstrates that specifically the high-affinity component is lost, which is the
      basis for the residual-capacity model.
  downstream:
  - target: Intracellular Thiamine Pyrophosphate Deficiency
    causal_link_type: DIRECT
    description: >-
      At physiological extracellular thiamine, residual uptake is insufficient to
      maintain the intracellular cofactor pool.

- name: Intracellular Thiamine Pyrophosphate Deficiency
  biological_scale: MOLECULAR
  description: >-
    Thiamine pyrophosphate, the active cofactor for transketolase, pyruvate
    dehydrogenase and alpha-ketoglutarate dehydrogenase, falls below requirement in the
    cells that depend most on high-affinity uptake.

    This node is the branch point for the whole disease, and it branches wider than the
    triad. The three classic arms - erythroid, beta cell, inner hair cell - are the
    tissues whose demand exceeds what low-affinity transport can supply. But THTR-1 is
    expressed elsewhere too, which is the entry's stated mechanistic reason for the
    cardiac, neurologic and ocular manifestations, so those hang off this node as well.
    For the cardiac, neurologic and ocular arms the cofactor requirement is
    established while the route from it to any particular organ failure is not.
  evidence:
  - reference: PMID:33649974
    reference_title: "The Effects of Genetic Mutations and Drugs on the Activity of the Thiamine Transporter, SLC19A2."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data from electronic health records revealed reduced levels of thiamine
      pyrophosphate (TPP) in patients prescribed erythromycin, consistent with
      inhibition of SLC19A2-mediated thiamine transport.
    explanation: >-
      Graded PARTIAL: this demonstrates that reducing SLC19A2 function lowers TPP in
      humans, but does so via pharmacological inhibition rather than in TRMA patients,
      so it supports the mechanism by analogy rather than directly.
  downstream:
  - target: Impaired Nucleotide Synthesis in Erythroid Precursors
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Transketolase supplies ribose-5-phosphate for nucleotide synthesis; rapidly
      dividing erythroid precursors are the first to decompensate.
  - target: Pancreatic Beta Cell Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Insulin secretion falls. The intermediate steps between cofactor shortfall and
      secretory failure are not established.
  - target: Selective Inner Hair Cell Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cochlear inner hair cells are lost preferentially, by a route that has not been
      resolved beyond the cofactor requirement.
  - target: Cardiac Rhythm Disturbance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      THTR-1 is expressed in cardiac tissue, so the cofactor shortfall is not confined
      to the three classic target organs. The route from a thiamine pyrophosphate
      deficit to a conduction disturbance is not established, and the manifestation is
      less frequent than the triad.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The neurologic arm of the same expression argument. GeneReviews names neurologic
      manifestations as a managed domain of the disease; the intermediate steps between
      cofactor shortfall and seizure are not established.
  - target: Stroke
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported alongside seizures in the wider literature, as a distinct cerebrovascular
      consequence rather than a variant of the seizure arm.
  - target: Optic Atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The ocular arm. This edge carries a treatment-timing consequence the others do
      not: early thiamine appears to prevent it, so the link is between a cofactor
      shortfall and a preventable structural loss rather than a fixed one.
  - target: Retinal Dystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated separately from optic atrophy because the source series separates them -
      one patient had both, another peripheral pigmentary retinal alterations only.

- name: Impaired Nucleotide Synthesis in Erythroid Precursors
  biological_scale: CELLULAR
  description: >-
    Ineffective DNA synthesis in dividing haematopoietic precursors, producing the
    megaloblastic morphology. In the mouse the defect extends beyond the erythroid line.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  molecular_functions:
  - preferred_term: transketolase activity
    modifier: DECREASED
    term:
      id: GO:0004802
      label: transketolase activity
  evidence:
  - reference: PMID:12393806
    reference_title: "Targeted disruption of Slc19a2, the gene encoding the high-affinity thiamin transporter Thtr-1, causes diabetes mellitus, sensorineural deafness and megaloblastosis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bone marrows from thiamin-deficient Slc19a2(-/-) mice were abnormal, with a
      megaloblastosis affecting the erythroid, myeloid and megakaryocyte lines.
    explanation: >-
      Shows the marrow lesion and, notably, that it is not confined to the erythroid
      line even though anemia is what presents clinically.
  downstream:
  - target: Persistent Macrocytosis
    causal_link_type: DIRECT
    description: >-
      The erythroid lesion outlives the anaemia it causes: red cells stay macrocytic on
      thiamine even after the haemoglobin corrects, so correcting the blood count is not
      the same as correcting the defect behind it.
  - target: Megaloblastic Anemia
    causal_link_type: DIRECT
    description: Ineffective erythropoiesis produces the anemia.

- name: Pancreatic Beta Cell Dysfunction
  biological_scale: CELLULAR
  description: Reduced insulin secretion, without the autoimmune features of type 1 diabetes.
  cell_types:
  - preferred_term: type B pancreatic cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:12393806
    reference_title: "Targeted disruption of Slc19a2, the gene encoding the high-affinity thiamin transporter Thtr-1, causes diabetes mellitus, sensorineural deafness and megaloblastosis in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      On a thiamin-free diet, Slc19a2(-/-) mice developed diabetes mellitus with
      reduced insulin secretion and an enhanced response to insulin.
    explanation: >-
      Localizes the defect to secretion rather than to insulin resistance, matching the
      non-type-1 character of the human diabetes.
  downstream:
  - target: Diabetes Mellitus
    causal_link_type: DIRECT
    description: Insufficient insulin secretion produces hyperglycaemia.

- name: Selective Inner Hair Cell Loss
  biological_scale: TISSUE
  description: >-
    Cochlear inner hair cells are lost while outer hair cells are relatively spared -
    an unusual pattern for sensorineural hearing loss, and the reason the deficit
    behaves as an auditory neuropathy with a discrepancy between brainstem-response and
    otoacoustic-emission thresholds.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  evidence:
  - reference: PMID:16642288
    reference_title: "Deletion of SLC19A2, the high affinity thiamine transporter, causes selective inner hair cell loss and an auditory neuropathy phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cochlear histological analysis showed a pattern uncommon for sensorineural
      hearing loss: selective loss of inner hair cells after 1-2 weeks on low thiamine
      and significantly greater inner than outer hair cell loss after longer
      low-thiamine challenges.
    explanation: >-
      Establishes the specific cellular lesion and its selectivity, which is what
      distinguishes this deafness mechanistically.
  downstream:
  - target: Progressive Sensorineural Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Loss of the primary sensory receptor cells produces the hearing deficit; because
      the cells do not regenerate, the deficit does not recover.

- name: Megaloblastic Anemia
  biological_scale: ORGANISM
  description: >-
    Onset between infancy and adolescence, with normal vitamin B12 and folate - the
    combination that distinguishes it from the common megaloblastic anemias.
  evidence:
  - reference: PMID:20301459
    reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      megaloblastic anemia with normal vitamin B12 / folic acid levels, with or without
      diabetes or hearing loss, in whom there is a response to oral thiamine
    explanation: >-
      The GeneReviews diagnostic criterion, which states both the finding and what
      excludes the common alternatives.

- name: Diabetes Mellitus
  biological_scale: ORGANISM
  description: Non-type-1 diabetes with onset from infancy to adolescence.
  evidence:
  - reference: PMID:20301459
    reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diabetes mellitus is non-type I in nature, with age of onset from infancy to
      adolescence.
    explanation: Characterizes the diabetes and its timing.

- name: Progressive Sensorineural Hearing Loss
  biological_scale: ORGANISM
  description: >-
    Often detectable in toddlers, progressive, and irreversible. This is the arm that
    thiamine does not rescue.
  evidence:
  - reference: PMID:20301459
    reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive sensorineural hearing loss often occurs early and can be detected in
      toddlers; hearing loss is irreversible and may not be prevented by thiamine
      treatment.
    explanation: >-
      States both the natural history and the crucial negative: treatment does not
      reliably prevent it.
  - reference: PMID:38037112
    reference_title: "An Italian case series' description of thiamine responsive megaloblastic anemia syndrome: importance of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In all Cases, thiamine therapy did not resolve the clinical manifestation of
      deafness.
    explanation: >-
      A four-patient series in which every treated patient's deafness persisted,
      converting the GeneReviews hedge into a direct observation.


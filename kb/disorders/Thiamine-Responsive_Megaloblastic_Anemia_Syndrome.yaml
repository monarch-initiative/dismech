name: Thiamine-Responsive Megaloblastic Anemia Syndrome
description: >-
  Thiamine-responsive megaloblastic anemia syndrome (TRMA, Rogers syndrome) is an
  autosomal recessive disorder caused by biallelic variants in SLC19A2, which encodes
  THTR-1, the high-affinity thiamine transporter. Losing it does not abolish thiamine
  uptake - the low-affinity transporter THTR-2 and passive diffusion remain - so the
  disease is a defect of transport capacity rather than of the vitamin itself. That
  distinction is the whole of its pathophysiology and its treatment: raising
  extracellular thiamine to pharmacologic concentrations drives enough through the
  residual routes to restore intracellular thiamine pyrophosphate. The clinical triad
  is megaloblastic anemia, non-type-1 diabetes mellitus and progressive sensorineural
  hearing loss, corresponding to the three cell populations least able to tolerate the
  shortfall. The three arms respond to thiamine differently, and the hearing loss does
  not recover.

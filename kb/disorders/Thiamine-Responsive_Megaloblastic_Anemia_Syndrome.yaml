environmental:
- name: Erythromycin exposure
  description: >-
    Erythromycin inhibits SLC19A2-mediated thiamine transport at clinically relevant
    unbound plasma concentrations, and prescribed patients show reduced thiamine
    pyrophosphate. In a patient who already has only residual low-affinity uptake, a
    drug acting on the same transporter is a plausible additional insult, which makes
    this worth recording even though it was identified in the general population rather
    than in TRMA.
  influences_mechanisms:
  - target: Loss of High-Affinity Thiamine Transport
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      Pharmacological inhibition of the same transporter compounds the genetic loss of
      its function.
    evidence:
    - reference: PMID:33649974
      reference_title: "The Effects of Genetic Mutations and Drugs on the Activity of the Thiamine Transporter, SLC19A2."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Ten of 63 drugs inhibited SLC19A2-mediated thiamine transport ≥ 50% at
        screening concentrations; however, with the exception of erythromycin, none was
        predicted to inhibit SLC19A2 at clinically relevant unbound plasma
        concentrations.
      explanation: >-
        Identifies erythromycin as the one screened drug expected to inhibit the
        transporter at achievable concentrations. Graded IN_VITRO because both halves of
        the sentence are non-clinical: the screen is an isotopic thiamine-uptake assay in
        HEK293 cells, and "predicted ... at clinically relevant unbound plasma
        concentrations" is an FDA (fu*Cmax)/IC50 calculation over literature
        pharmacokinetics, not a human observation. The word "clinically" qualifies the
        concentration threshold, not the study design. The human half of this paper is
        cited separately, from its electronic-health-record result.
  evidence:
  - reference: PMID:33649974
    reference_title: "The Effects of Genetic Mutations and Drugs on the Activity of the Thiamine Transporter, SLC19A2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Data from electronic health records revealed reduced levels of thiamine
      pyrophosphate (TPP) in patients prescribed erythromycin, consistent with
      inhibition of SLC19A2-mediated thiamine transport.
    explanation: >-
      Confirms the inhibition has a measurable consequence for cofactor levels in
      people.

treatments:
- name: Pharmacologic Oral Thiamine
  description: >-
    Lifelong oral thiamine at 50-100 mg/day. It does not replace the missing
    transporter; it raises extracellular thiamine far enough that the residual
    low-affinity routes carry sufficient flux. The three disease arms respond
    differently, and the response is maintained only while treatment continues.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: thiamine
      term:
        id: CHEBI:26948
        label: vitamin B1
  target_mechanisms:
  - target: Intracellular Thiamine Pyrophosphate Deficiency
    treatment_effect: RESTORES
    description: >-
      Mass action through the residual uptake routes restores the intracellular
      cofactor pool. This is the step the treatment actually acts on.
    evidence:
    - reference: PMID:12393806
      reference_title: "Targeted disruption of Slc19a2, the gene encoding the high-affinity thiamin transporter Thtr-1, causes diabetes mellitus, sensorineural deafness and megaloblastosis in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The diabetes mellitus resolved after 6 weeks of thiamin repletion.
      explanation: >-
        Repletion reverses an established arm of the phenotype in the model, which is
        the clearest demonstration that raising substrate is sufficient.
  - target: Megaloblastic Anemia
    treatment_effect: RESTORES
    description: >-
      The anemia corrects, though macrocytosis persists and the anemia recurs if
      treatment stops.
    evidence:
    - reference: PMID:20301459
      reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The anemia is corrected with thiamine treatment, but the red cells remain
        macrocytic and anemia can recur if treatment is withdrawn.
      explanation: States both the response and its limits.
  - target: Diabetes Mellitus
    treatment_effect: MODULATES
    description: >-
      Partial: insulin requirement may fall and onset may be delayed, but not in
      everyone.
    evidence:
    - reference: PMID:20301459
      reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thiamine treatment may reduce insulin requirement and delay onset of diabetes
        in some individuals.
      explanation: >-
        Graded PARTIAL because the source itself hedges both the effect and the
        proportion of patients showing it.
  evidence:
  - reference: PMID:20301459
    reference_title: "Thiamine-Responsive Megaloblastic Anemia Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lifelong use of pharmacologic doses (50-100 mg/day) of oral thiamine (vitamin B1)
      in affected individuals regardless of age.
    explanation: The GeneReviews Management recommendation, including dose and duration.

- name: Cochlear Implantation
  description: >-
    The intervention that actually addresses the hearing arm. Thiamine does not rescue
    it, but that does not mean nothing can be done: implantation bypasses the lost inner
    hair cells rather than treating the metabolic lesion, and it is what is done in
    practice.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Progressive Sensorineural Hearing Loss
    treatment_effect: BYPASSES
    description: >-
      Stimulates the auditory nerve directly, bypassing the inner hair cells whose loss
      causes the deficit.
  evidence:
  - reference: PMID:38037112
    reference_title: "An Italian case series' description of thiamine responsive megaloblastic anemia syndrome: importance of early diagnosis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 13 months, the patient underwent cochlear implantation due to sensorineural
      hearing loss.
    explanation: Documents implantation as the management of the hearing arm in a reported patient.

- name: Red Blood Cell Transfusion
  description: >-
    For severe anemia, ahead of or alongside thiamine.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Megaloblastic Anemia
    treatment_effect: MODULATES
    description: >-
      Replaces circulating red cells; does not address the transport defect.
  evidence:
  - reference: PMID:20301459
    reference_title: Thiamine-Responsive Megaloblastic Anemia Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Red blood cell transfusion for severe anemia.
    explanation: The GeneReviews Management recommendation for the acute anaemia.

- name: Periconceptional and Pregnancy Glycaemic Control
  description: >-
    Good diabetic control before and during pregnancy. This carries more weight here

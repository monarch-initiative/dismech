name: Developmental and Epileptic Encephalopathy 55
creation_date: "2026-08-31T21:45:00Z"
category: Mendelian
synonyms:
- DEE55
- early infantile epileptic encephalopathy 55
- EIEE55
- PIGP deficiency
- PIGP-related inherited GPI deficiency
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 55
  term:
    id: MONDO:0033364
    label: developmental and epileptic encephalopathy, 55
parents:
- Congenital Disorder of Glycosylation
- Inborn Error of Metabolism

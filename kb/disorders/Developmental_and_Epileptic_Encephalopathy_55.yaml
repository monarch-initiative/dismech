mechanistic_hypotheses:
- hypothesis_group_id: canonical_gpi_anchor_flux_reduction_model
  hypothesis_label: Canonical GPI Anchor Flux Reduction Model
  status: CANONICAL
  description: >-
    Biallelic hypomorphic PIGP variants reduce flux through the first
    committed step of GPI anchor biosynthesis, lowering the surface density of
    the whole class of GPI-anchored proteins; because that class is
    disproportionately important in neurogenesis and synaptic function, the
    result is a developmental and epileptic encephalopathy. The model is
    supported by the rescue of GPI-anchored protein surface expression by
    wild-type PIGP in patient cells, and by the independent demonstration of
    reduced granulocyte CD16 in a second cohort.
discussions:
- discussion_id: pigp_which_gpi_anchored_protein
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the more than 150 GPI-anchored proteins, or which combination of
    them, mediates the epilepsy and the developmental impairment in PIGP
    deficiency?
  attaches_to:
  - pathophysiology#Reduced GPI-Anchored Protein Surface Expression
  - pathophysiology#Disrupted Neurodevelopment and Cortical Network Excitability
  rationale: >-
    The chain from reduced GPI anchor synthesis to a seizing, developmentally
    impaired cortex is currently a class-level argument: GPI-anchored proteins
    matter in neurogenesis, so reducing them all must matter. No study has
    identified the responsible protein or proteins. Until one does, the edge
    into the neurodevelopmental node has unknown intermediates, and no
    protein-specific therapeutic target can be named.
- discussion_id: pigp_genotype_phenotype_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does residual PIGP activity predict where a patient falls on the spectrum
    from DEE55 to the multiple congenital anomalies-hypotonia-seizures
    presentation?
  attaches_to:
  - pathophysiology#Biallelic PIGP Variants
  rationale: >-
    The 2023 siblings, one of whom was a fetus with a severe malformation
    disorder terminated at 17 weeks, carried a start-codon variant in trans
    with a whole-gene deletion — plausibly the lowest residual activity
    reported. If severity tracks residual activity, that would both explain
    the phenotypic range within one gene and make a quantitative flow-cytometry
    readout prognostic rather than merely diagnostic. With fewer than a dozen
    patients published, the correlation cannot yet be tested.
- discussion_id: pigp_gpi_module_absent
  kind: KNOWLEDGE_GAP
  prompt: >-
    Should the shared GPI-anchor-biosynthesis lesion across PIGP, PIGA, PIGV,
    PIGQ, PIGY and related deficiencies be factored out as a mechanism module?
  attaches_to:
  - pathophysiology#Impaired First Step of GPI Anchor Biosynthesis
  rationale: >-
    The knowledge base already carries several inherited GPI deficiencies
    curated independently, each restating the same upstream chain. That is the
    pattern `kb/modules/` exists for. No such module exists yet, so this entry
    declares no `conforms_to`; recording the gap here is what makes the
    omission visible rather than looking like an oversight.

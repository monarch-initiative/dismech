progression:
- phase: Infancy
  age_range: 0-12 months
  notes: >-
    Onset of refractory seizures with severe hypotonia and, in the largest
    family, early dyskinetic movements.
- phase: Childhood
  age_range: 1-12 years
  notes: >-
    Dyskinesia progressing to quadriplegia with profound developmental
    disability. Two of the four affected children in the largest reported
    family died prematurely between ages 2 and 12 years; the surviving two
    were aged 2 years 7 months and 7 years 4 months at report.
  evidence:
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of the children died prematurely between age 2 and 12 years; the remaining 2 children are aged 2 years 7 months and 7 years 4 months."
    explanation: >-
      Documents childhood mortality and the ages of the surviving patients.
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "for all individuals, 15 of whom were deceased at the time of writing"
    explanation: >-
      Group-level mortality across 83 inherited GPI deficiency patients,
      giving a denominator the PIGP-specific reports cannot. INDIRECT because
      it is an inherited-GPI-deficiency figure rather than a PIGP one.
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Individuals with variants in synthesis stage \ngenes of the GPI-AP exhibited a significantly shorter time to seizure onset than \nindividuals with variants in transamidase and remodelling stage genes"
    explanation: >-
      The cohort found that variants in synthesis-stage GPI genes give a
      significantly shorter time to seizure onset than transamidase- or
      remodelling-stage genes. PIGP is a synthesis-stage gene, which is a
      group-level reason to expect the early onset this entry describes.

genetic:
- name: PIGP
  gene_term:
    preferred_term: PIGP
    term:
      id: hgnc:3046
      label: PIGP
  relationship_type: CAUSATIVE
  notes: >
    PIGP encodes a subunit of the GPI-GlcNAc transferase complex catalysing
    the first step of GPI anchor biosynthesis. It is one of seven genes
    (PIGA, PIGC, PIGH, PIGP, PIGQ, PIGY, DPM2) mediating that initial stage,
    which is why the PIGP phenotype resembles those of PIGA, PIGQ and PIGY
    deficiency rather than those of later-step genes.
  evidence:
  - reference: PMID:37125481
    reference_title: "Expanding the phenotype of PIGP deficiency to multiple congenital anomalies-hypotonia-seizures syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the initial stage of their biosynthesis is mediated by PIGA, PIGC, PIGH, PIGP, PIGQ, PIGY, and DMP2 genes, which have been linked to a wide spectrum of phenotypes depending on the gene damaged"
    explanation: >
      Places PIGP among the genes of the first stage of GPI biosynthesis and
      grounds the phenotypic comparison to its complex partners.
diagnosis:
- name: Flow cytometry for GPI-anchored protein surface expression
  description: >
    Measurement of GPI-anchored protein levels on circulating granulocytes by
    flow cytometry. CD16 was proposed as a marker on the strength of its
    reduction in affected individuals; note this is a screening test for
    inherited GPI deficiency as a group, not a PIGP-specific test.
  evidence:
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD16 is a valuable marker to support a genetic diagnosis of inherited GPI deficiencies."
    explanation: >
      States the diagnostic proposal in the authors' own words, including
      that it supports rather than establishes the genetic diagnosis.
  - reference: PMID:31139695
    reference_title: "Biallelic mutations in PIGP cause developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry of patient granulocytes confirmed reduced expression of glycosylphosphatidylinositol-anchored proteins as functional consequence."
    explanation: >
      Second independent use of the same granulocyte assay to confirm a PIGP
      diagnosis.
- name: Serum alkaline phosphatase (a negative, not a screen)
  description: >
    Hyperphosphatasia is strong evidence of an inherited GPI deficiency when
    present, but it arises from defects in the *later* steps of GPI
    biosynthesis and anchor remodelling — Mabry syndrome being the type case.
    PIGP acts at the first step, so a normal alkaline phosphatase does not
    argue against this diagnosis. Recorded here because using
    hyperphosphatasia as a screening test would systematically miss
    early-pathway defects like this one.
  evidence:
  - reference: PMID:25803904
    reference_title: "[Inherited GPI deficiencies:a new disease with intellectual disability and epilepsy]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hyperphosphatasia is observed in some patients with IGDs, such as hyperphosphatasia mental retardation syndrome or Mabry syndrome, caused by mutations in genes in the later stage of GPI biosynthesis."
    explanation: >
      Localizes hyperphosphatasia to late-stage pathway defects, which is why
      it is unreliable for an early-step gene such as PIGP.
- name: Whole-exome sequencing
  description: >
    Molecular diagnosis. Every reported family was ascertained by exome
    sequencing; the phenotype is not distinctive enough among the inherited
    GPI deficiencies to point at PIGP without sequencing.
  evidence:
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied clinical features, EEG, brain MRI scans, whole-exome sequencing (WES), and measured the expression of a subset of GPI-anchored proteins (GPI-APs) in circulating granulocytes using flow cytometry."
    explanation: >
      Describes the diagnostic workup used to establish the diagnosis.
  - reference: PMID:31139695
    reference_title: "Biallelic mutations in PIGP cause developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "panel for epileptic encephalopathies (100 genes including PIGA, PIGG, PIGN, and PIGT) did not reveal an underlying pathogenic mutation"
    explanation: >
      A targeted epilepsy panel that carried four other PIG genes but not
      PIGP returned negative in a patient who turned out to have PIGP
      deficiency. This is the practical reason exome or genome sequencing is
      required rather than a panel — a negative epilepsy panel does not
      exclude this diagnosis.

treatments:
- name: Antiseizure Medication
  description: >
    Seizure control is the mainstay of management, and it is difficult: the
    epilepsy is described as refractory in every reported patient. No
    anticonvulsant has been shown to work better than others in PIGP
    deficiency specifically, and no such claim is made here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Refractory Early-Onset Epilepsy
    treatment_effect: MODULATES
    description: >-
      Symptomatic seizure suppression. It does not address the GPI-anchor
      lesion and does not alter the developmental trajectory.
  evidence:
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several combinations of antiepileptic drugs (including valproate, phenobarbital, phenytoin, topiramate, carbamazepine, vigabatrin, levetiracetam, rufinamide, clonazepam, and lorazepam) failed to control seizures"
    explanation: >
      Documents both that antiseizure medication is the treatment attempted
      and that it fails — which is also the evidence for calling the epilepsy
      refractory, a claim this entry makes in a node name.
- name: Pyridoxine Supplementation
  description: >
    Pyridoxine (vitamin B6) supplementation, named among the nutritional
    options across congenital disorders of glycosylation. The evidence is at
    the level of the CDG group, not of PIGP: no trial or case series has
    tested it in PIGP deficiency, and this entry does not imply one has.
    Recorded as a small molecule rather than a dietary measure, because that
    is what it is.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We review the dietary management in CDG with a focus on two subgroups: N-linked glycosylation defects and GPI-anchor disorders."
    explanation: >
      Establishes that dietary management is discussed for the GPI-anchor
      subgroup that PIGP deficiency belongs to. Graded INDIRECT because the
      claim reaches PIGP only through subgroup membership, not through data
      in PIGP patients.
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Specific nutritional treatment options for certain CDG types include oral supplementation of monosaccharide sugars, manganese, uridine, or pyridoxine."
    explanation: >
      Names pyridoxine among the nutritional options in congenital disorders
      of glycosylation. Note the sentence says "certain CDG types" — it does
      not say PIGP is one of them, which is why this is INDIRECT.
- name: Ketogenic Diet
  description: >
    The ketogenic diet, the other empiric intervention discussed for the
    GPI-anchor subgroup of congenital disorders of glycosylation. Same
    caveat as pyridoxine: the evidence is group-level, and no study has
    tested it in PIGP deficiency.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:35562242
    reference_title: "Nutrition interventions in congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Ketogenic diet is most frequently used in GPI anchor defects"
    explanation: >
      States that the ketogenic diet is the intervention most often used in
      the GPI-anchor defects, the subgroup PIGP deficiency belongs to.
      INDIRECT because the claim reaches PIGP only through subgroup
      membership — the sentence names the group, not this gene.
- name: Gastrostomy and Feeding Support
  description: >
    Enteral feeding support. For a disorder in which no reported patient
    achieves independent development and antiseizure medication fails, this
    and rehabilitative care are most of what management actually consists of,
    so leaving it out would misrepresent the clinical picture.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Profound Developmental Impairment
    treatment_effect: MODULATES
    description: >-
      Supportive management of the feeding difficulty that follows the
      neurological impairment. It does not address the underlying lesion.
  evidence:
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "percutaneous endoscopic gastrostomy was performed at age 7 months"
    explanation: >
      Documents gastrostomy in a reported patient.

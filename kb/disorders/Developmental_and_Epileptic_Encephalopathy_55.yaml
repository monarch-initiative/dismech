description: >
  Developmental and epileptic encephalopathy 55 (DEE55) is an autosomal
  recessive inherited GPI deficiency caused by biallelic variants in PIGP.
  PIGP encodes a subunit of the GPI-GlcNAc transferase complex, the enzyme
  that catalyses the first step of glycosylphosphatidylinositol (GPI) anchor
  biosynthesis in the endoplasmic reticulum. More than 150 human proteins
  reach the cell surface tethered by a GPI anchor, many of them with roles in
  neurogenesis and synaptic function, so a partial block at the first
  committed step reduces the surface density of that whole protein class
  rather than removing a single gene product. The clinical result is
  early-onset refractory epilepsy — infantile spasms, focal, tonic and
  tonic-clonic seizures, often with a burst-suppression EEG — together with
  severe hypotonia and profound global developmental delay. Dyskinetic
  movement progressing to quadriplegia was prominent in the largest reported
  family, and premature death in childhood has been reported. The phenotype
  has since been extended to a presentation of multiple congenital
  anomalies with hypotonia and seizures, matching what is seen for other
  genes in the same first-step complex. Reduced surface expression of a GPI-anchored protein —
  CD16 on granulocytes — is measurable by flow cytometry and supports the
  diagnosis. The disorder is ultra-rare: fewer than a dozen patients have been
  published since the gene was first linked to human disease in 2017.
notes: >
  Ultra-rare, and the counts matter. The disease-defining report is two
  siblings with compound heterozygous PIGP variants (Johnstone et al., Hum Mol
  Genet 2017); a large consanguineous family added four affected children
  homozygous for c.384del (Vetro et al., Neurol Genet 2020); a 2023 report
  states that PIGP had been related to DEE55 in just seven patients at that
  point and adds two more siblings with a multiple congenital
  anomalies-hypotonia-seizures presentation. Every number in this entry is
  therefore a count of patients, not a frequency, and `frequency` is left
  unset throughout rather than computed from a cohort this size.

  Two things this entry is deliberately careful about:

  First, the mechanism is a *reduction* in the surface density of a whole
  class of proteins, not the loss of one effector. That is why the
  pathophysiology chain runs through "reduced GPI-anchored protein surface
  expression" as a single node rather than naming individual GPI-anchored
  proteins: with over 150 of them, and no experiment attributing the seizure
  phenotype to any particular one, naming a culprit would assert more than
  the sources do. CD16 appears in the entry as a measured readout and
  diagnostic marker, not as the pathogenic protein.

  Second, complete PIGP loss is probably not a viable disease state. The
  reported alleles are hypomorphic in effect — the founding siblings retained
  reduced but detectable PIGP mRNA, and the recurrent c.384del is predicted to
  produce a longer-than-wild-type protein with impaired rather than absent
  functionality. The entry says "reduced", not "abolished", throughout.

  No `conforms_to` was declared. `kb/` covers several other inherited GPI
  deficiencies (Mabry syndrome, CHIME syndrome, multiple congenital
  anomalies-hypotonia-seizures syndrome) but there is no GPI-anchor
  biosynthesis module to conform to. Those entries plus this one are the
  natural first conformers if such a module is created; see the knowledge gap
  recorded below.

  **Deep-research provenance.** An OpenScientist run
  (`research/Developmental_and_Epileptic_Encephalopathy_55-deep-research-openscientist.md`,
  12/12 references resolved with a confabulation rate of 0.0; of the 12
  assessed for relevance the validator scored 7 as on topic and left the
  remaining 5 unscored rather than judging them off topic) is committed
  alongside this entry and contributed four sources that first-pass curation from the primary
  papers had missed: the second family with the recurrent c.456delA allele
  (PMID:31139695), the group-level constraint that complete GPI deficiency is
  embryonic lethal (PMID:25803904), the large inherited-GPI-deficiency cohort
  (PMID:38456468), and the nutritional-intervention review behind the
  treatments block (PMID:35562242). Every quote used was re-verified against
  the fetched reference cache rather than taken from the report.

  One preflight note for whoever reads that report next: `just preflight-dr`
  warns that "GPI" is a rival gene mentioned 72 times. That is a false
  positive — "GPI" here is glycosylphosphatidylinositol, the anchor, not GPI
  the glucose-6-phosphate isomerase gene. The report's OMIM number matches
  MONDO's.
classifications:
  icimd_category:
  - classification_value: lipid_glycosylation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) group "Disorders of lipid
      glycosylation", which the classification explicitly scopes to include
      glycosylphosphatidylinositol biosynthesis. PIGP acts at the first step
      of GPI anchor assembly.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Reported patients are compound heterozygous or, in a consanguineous
    family, homozygous for PIGP variants. Inherited GPI deficiencies as a
    group are autosomal recessive, with PIGA the single X-linked exception.
  evidence:
  - reference: PMID:28334793
    reference_title: "Compound heterozygous mutations in the gene PIGP are associated with early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work associates mutations in the PIGP gene with a novel autosomal recessive IGD, and expands our knowledge of the role of PIG genes in human development."
    explanation: >
      States the inheritance mode and places the disorder in the inherited
      GPI deficiency group.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients had been reported as of the 2023 report that states this
    count, with two further siblings added by that paper. No incidence or
    prevalence estimate exists for PIGP deficiency specifically.
  evidence:
  - reference: PMID:37125481
    reference_title: "Expanding the phenotype of PIGP deficiency to multiple congenital anomalies-hypotonia-seizures syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the PIGP gene has only been related to Developmental and Epileptic Encephalopathy 55 (MIM#617599) in just seven patients."
    explanation: >-
      Gives the size of the published cohort at the time of that report.
- population: Patients with developmental delay (inherited GPI deficiencies as a group)
  measure_type: UNKNOWN
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 150.0
  notes: >-
    This is the figure for inherited GPI deficiencies as a whole within a
    developmental-delay cohort, not for PIGP deficiency, which is a small
    fraction of that group. It is recorded because it is the only
    denominator-bearing estimate available anywhere near this disorder, and
    should not be read as a PIGP-specific rate.

    Two grading notes. `ABOVE_1_IN_1000` is the band that contains 150 per
    100,000 (the schema puts 10-99 per 100,000 in BAND_1_5_PER_10000).
    `measure_type` is UNKNOWN rather than POINT_PREVALENCE or ANNUAL_INCIDENCE
    because the quoted source calls it an "incidence" while the figure is
    really a diagnostic yield within an ascertained cohort, and neither
    prevalence nor incidence describes that honestly.
  evidence:

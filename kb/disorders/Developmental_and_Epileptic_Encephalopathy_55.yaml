    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A ∼0.15% incidence of IGDs in patients with developmental delay has been reported in the large Deciphering Developmental Disorders study cohort."
    explanation: >-
      Provides the group-level frequency of inherited GPI deficiencies in a
      developmental-delay cohort.
pathophysiology:
- name: Biallelic PIGP Variants
  biological_scale: MOLECULAR
  description: >
    Compound heterozygous or homozygous PIGP variants. Reported alleles
    include c.74T>C (p.Met25Thr) with c.456delA (p.Glu153AsnFs*34) in the
    founding siblings, a recurrent homozygous c.384del in a large inbred
    family, and a start-codon variant in trans with a 136 kb deletion removing
    the whole gene. The effect is reduction rather than abolition of PIGP
    function: patient cells retained reduced PIGP mRNA, and c.384del is
    predicted to yield a longer-than-wild-type protein with impaired
    functionality rather than no protein at all.
  genes:
  - preferred_term: PIGP
    term:
      id: hgnc:3046
      label: PIGP
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic PIGP alleles spanning missense, frameshift,
      start-loss and a 136 kb whole-gene deletion. Both compound heterozygous
      and homozygous families are reported, so `zygosity` is deliberately
      left unset rather than picking one — the slot is single-valued and
      either value would misdescribe half the cohort. The disease state is a
      partial rather than complete loss of function.
    allelic_events:
    - MISSENSE_VARIANT
    - FRAMESHIFT_VARIANT
    - DELETION
    - COPY_NUMBER_LOSS
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28334793
    reference_title: "Compound heterozygous mutations in the gene PIGP are associated with early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report two siblings with compound heterozygous variants in the gene phosphatidylinositol glycan anchor biosynthesis, class P (PIGP) (NM_153681.2: c.74T > C;p.Met25Thr and c.456delA;p.Glu153AsnFs*34)."
    explanation: >
      Establishes the founding genotype.
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The homozygous c.384del variant of PIGP, present in the 4 patients, introduces a frame shift 6 codons before the expected stop signal and is predicted to result in the synthesis of a protein longer than the wild type, with impaired functionality."
    explanation: >
      Documents the recurrent homozygous allele and its predicted partial
      rather than null consequence, which is why this node is a reduction
      rather than an abolition.
  - reference: PMID:31139695
    reference_title: "Biallelic mutations in PIGP cause developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the second family with a markedly overlapping phenotype due to a homozygous frameshift mutation (c.456delA;p.Glu153Asnfs*34) in PIGP."
    explanation: >
      Independent replication in a second family, and the same c.456delA
      allele the founding siblings carried in compound heterozygous state —
      making it a recurrent loss-of-function allele across a very small
      patient population.
  - reference: PMID:25803904
    reference_title: "[Inherited GPI deficiencies:a new disease with intellectual disability and epilepsy]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients with IGD have only a partial deficiency because complete GPI deficiency causes embryonic death."
    explanation: >
      Establishes at the group level why every viable patient genotype must
      be hypomorphic, which is the constraint that makes this node a
      reduction rather than an abolition.
  downstream:
  - target: Impaired First Step of GPI Anchor Biosynthesis
    description: >-
      PIGP is a subunit of the enzyme catalysing the first committed step of
      GPI anchor assembly.
    causal_link_type: DIRECT

- name: Impaired First Step of GPI Anchor Biosynthesis
  biological_scale: MOLECULAR
  description: >
    GPI anchor precursors are assembled in the endoplasmic reticulum through a
    multistep pathway and then transferred to target proteins, which are
    further remodelled in the ER and Golgi before reaching the cell surface.
    PIGP is a subunit of the complex that performs the first step of that
    pathway; reduced PIGP function throttles flux at the entry point, so the
    deficit is felt by every downstream GPI-anchored protein rather than by a
    subset.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
  evidence:
  - reference: PMID:28334793
    reference_title: "Compound heterozygous mutations in the gene PIGP are associated with early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIGP encodes a subunit of the enzyme that catalyzes the first step of GPI anchor biosynthesis."
    explanation: >
      Places PIGP at the first step of the pathway, which is what makes the
      downstream effect class-wide.
  downstream:
  - target: Reduced GPI-Anchored Protein Surface Expression
    description: >-
      Less GPI anchor precursor is available to tether target proteins to the
      plasma membrane.
    causal_link_type: DIRECT

- name: Reduced GPI-Anchored Protein Surface Expression
  biological_scale: CELLULAR
  description: >
    The measurable cellular lesion. Patient cells show reduced surface levels
    of GPI-anchored proteins, and this is restored by exogenous expression of
    wild-type PIGP — the rescue that establishes causation rather than
    correlation. Because over 150 human proteins are GPI-anchored, the effect
    is a class-wide reduction in surface density. This entry deliberately does
    not name a single culprit protein: no experiment attributes the
    neurological phenotype to any particular GPI-anchored protein, and the
    sources do not.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:28334793
    reference_title: "Compound heterozygous mutations in the gene PIGP are associated with early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies with patient cells showed reduced PIGP mRNA levels, and an associated reduction of GPI-anchored cell surface proteins, which was rescued by exogenous expression of wild-type PIGP."
    explanation: >
      The rescue experiment establishes that reduced PIGP is what lowers
      GPI-anchored protein surface expression.
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated a reduced expression of the GPI-AP CD16 in the granulocytic membrane in affected individuals."
    explanation: >
      Independent confirmation of the cellular lesion in a second cohort,
      using a specific GPI-anchored protein as the readout.
  - reference: PMID:32156170
    reference_title: "Biosynthesis and biology of mammalian GPI-anchored proteins."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At least 150 human proteins are glycosylphosphatidylinositol-anchored proteins (GPI-APs)."
    explanation: >
      Sources the size of the affected protein class, which is the claim that
      makes this node a class-wide reduction rather than the loss of any one
      protein — and therefore the reason the edge out of it carries unknown
      intermediates.
  - reference: PMID:31139695
    reference_title: "Biallelic mutations in PIGP cause developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry of patient granulocytes confirmed reduced expression of glycosylphosphatidylinositol-anchored proteins as functional consequence."
    explanation: >
      A third independent demonstration of the cellular lesion, in a family
      unrelated to either of the other two.
  downstream:
  - target: Disrupted Neurodevelopment and Cortical Network Excitability
    description: >-
      GPI-anchored proteins have prominent roles in neurogenesis and synaptic
      function; reduced surface density of the class disturbs both.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Which of the >150 GPI-anchored proteins mediates the neurological phenotype has not been determined

- name: Disrupted Neurodevelopment and Cortical Network Excitability
  biological_scale: TISSUE
  description: >
    GPI-anchored proteins play a variety of important roles in development and
    particularly in neurogenesis, and in synaptic function and plasticity.
    Reducing the surface density of that class during brain development
    produces a network that is both developmentally impaired and abnormally
    excitable — which is what a developmental and epileptic encephalopathy
    is: the epilepsy and the developmental impairment are two outputs of one
    lesion, not a cause and its consequence.
  biological_processes:
  - preferred_term: nervous system development
    modifier: DECREASED
    term:
      id: GO:0007399
      label: nervous system development
  - preferred_term: synaptic signaling
    modifier: DYSREGULATED
    term:
      id: GO:0099536
      label: synaptic signaling
  evidence:
  - reference: PMID:28334793
    reference_title: "Compound heterozygous mutations in the gene PIGP are associated with early infantile epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These proteins play a variety of important roles in development, and particularly in neurogenesis."
    explanation: >
      Establishes the developmental role of the affected protein class, which
      is the basis for this node.
  - reference: PMID:32042915
    reference_title: "Early infantile epileptic-dyskinetic encephalopathy due to biallelic PIGP mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often playing a role in CNS development and synaptic function and plasticity"
    explanation: >
      Names both the developmental and the synaptic roles that this node
      combines.
  downstream:
  - target: Refractory Early-Onset Epilepsy
    description: >-
      An abnormally excitable immature cortical network generates
      pharmacoresistant seizures from early infancy.
    causal_link_type: DIRECT
  - target: Thin Corpus Callosum
    description: Reduced white matter bulk from disturbed neurodevelopment.
    causal_link_type: DIRECT
  - target: Ventriculomegaly
    description: Ex vacuo ventricular enlargement accompanying reduced parenchymal volume.
    causal_link_type: DIRECT
  - target: Cerebral Atrophy
    description: >-
      Progressive loss of cerebral volume with frontal predominance,
      developing over the first months of life.
    causal_link_type: DIRECT
  - target: Progressive Microcephaly
    description: >-
      Acquired microcephaly, the head-growth correlate of the parenchymal
      loss above.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Progressive loss of cerebral parenchymal volume
  - target: Profound Developmental Impairment
    description: >-
      Disturbed neurogenesis produces profound global developmental delay
      independent of, and in addition to, the seizure burden.
    causal_link_type: DIRECT


- name: Inner Hair Cell and Ribbon Synapse Disorganisation
  description: 'Heterozygous p.Val61Leu mice show shortened inner hair cells and abnormal perinuclear positioning of ribbon synapses. Early abnormalities occurred without overt hair-cell loss; ribbon counts were increased at four months rather than simply depleted. Later degeneration was documented in the genome-editing study. These model findings are not established human temporal-bone pathology.

    The knockout noise experiments independently measured loss of ribbon-synapse puncta and afferent terminals after intense exposure. Noise-induced synapse attrition and spontaneous knock-in ribbon mislocalization are distinct findings. Their molecular connection to altered P2X2 gating remains uncertain.'
  biological_scale: CELLULAR

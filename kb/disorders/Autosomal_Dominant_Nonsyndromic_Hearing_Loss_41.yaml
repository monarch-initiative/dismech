genetic:
- name: P2RX2
  notes: >-
    P2RX2 on 12q24.33 encodes the P2X2 subunit of an ATP-gated cation channel permeable to
    sodium, potassium and particularly calcium. Channels assemble as trimers, which is what
    makes a heterozygous defective subunit dominant. The receptor is expressed on sensory
    and supporting cells of the cochlea and broadly on the epithelium lining the
    endolymphatic compartment.

    Reported disease alleles are p.Val60Leu, p.Asp201Tyr, p.Gly353Arg and the stop-loss
    p.Ter350Glu. Only p.Val60Leu has been characterised functionally and only it has an
    allele-matched mouse; conclusions in this entry that rest on functional data rest on
    that one allele.

    The gene-disease relationship is classified Moderate by ClinGen's Hearing Loss Gene
    Curation Expert Panel, reaffirmed in 2022, on three missense variants in four probands.
    That is a real limit on how confidently this entry should be read, and it is not
    contradicted by anything here: the mechanism is well worked out in model systems, but
    the human genetic evidence is thin in the specific sense ClinGen measures.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: P2RX2
    term:
      id: hgnc:15459
      label: P2RX2
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we used genetics and functional studies to show that a shared cause of these disorders may be loss of function of the ATP-gated P2X(2) receptor (ligand-gated ion channel, purinergic receptor 2) that is expressed in sensory and supporting cells of the cochlea."
    explanation: The gene-disease relationship and the cell types in which the receptor acts.
  - reference: PMID:24211385
    reference_title: "A novel P2RX2 mutation in an Italian family affected by autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identification of a second most likely causative mutation in P2RX2 gene further supports the possible role of this gene in causing autosomal dominant HHL."
    explanation: >-
      The first independent replication, and its hedged wording is preserved because at
      that point the gene rested on two families.
  - reference: PMID:25788561
    reference_title: "Hearing loss caused by a P2RX2 mutation identified in a MELAS family with a coexisting mitochondrial 3243AG mutation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients carried the mutation and had severe sensorineural hearing loss, while other members with MELAS (who did not carry the P2RX2 mutation) had normal hearing."
    explanation: >-
      Reads as a clean natural experiment within a family segregating the MELAS 3243A>G
      variant, with hearing loss tracking the P2RX2 allele rather than the mitochondrial
      one. Graded PARTIAL rather than SUPPORT because ClinGen's Hearing Loss expert panel
      reviewed this family and did not accept it, on the grounds that the evidence for
      pathogenicity was not strong and the variant is present in gnomAD. Curated with that
      disagreement visible rather than silently dropped or silently believed.

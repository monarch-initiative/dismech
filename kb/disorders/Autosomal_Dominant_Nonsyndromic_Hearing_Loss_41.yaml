    snippet: Here we used genetics and functional studies to show that a shared cause of these disorders may be loss of function of the ATP-gated P2X(2) receptor (ligand-gated ion channel, purinergic receptor 2) that is expressed in sensory and supporting cells of the cochlea.
    explanation: The gene-disease relationship and the cell types in which the receptor acts.

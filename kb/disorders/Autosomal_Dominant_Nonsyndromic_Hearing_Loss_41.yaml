- name: Noise-Exacerbated High-Frequency Hearing Impairment
  category: Auditory
  description: >-
    High-frequency hearing loss that appears earlier and is worse in carriers who have had
    noise exposure. This is the clinically actionable feature of DFNA41 and it is
    supported symmetrically in mice and in people: null mice exposed early to continuous
    moderate noise had high-frequency loss as young adults, and among family members
    heterozygous for p.Val60Leu, noise exposure exacerbated high-frequency hearing loss in
    young adulthood.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0001757
      label: High-frequency sensorineural hearing impairment
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, among family members heterozygous for P2RX2 p.V60L, noise exposure exacerbated high-frequency hearing loss in young adulthood."
    explanation: The human observation of the gene-environment interaction.
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "P2RX2-null mice developed severe progressive hearing loss, and their early exposure to continuous moderate noise led to high-frequency hearing loss as young adults."
    explanation: >-
      The matching result in mice, where exposure could be controlled rather than
      recalled.
  notes: >-
    Frequency is FREQUENT rather than higher because it is conditional on exposure: the
    phenotype is reported in family members who had noise exposure, and no reported series
    quantifies what fraction of all carriers that is.
environmental:
- name: Occupational and recreational noise exposure
  description: >-
    Exposure to elevated sound levels, which in DFNA41 is not a separate risk factor
    layered on top of the genetic disease but an interaction with the exact mechanism the
    disease disables. P2X2-mediated purinergic adaptation is what normally limits cochlear
    amplifier gain as sound levels rise; a carrier has less of that protection, so the same
    exposure does more damage.
  exposure_term:
    preferred_term: exposure to sound radiation
    term:
      id: ECTO:8000044

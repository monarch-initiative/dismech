discussions:
- discussion_id: dfna41_carrier_noise_dose_response
  kind: KNOWLEDGE_GAP
  prompt: How much noise is too much for a P2RX2 carrier? Is there a dose below which a carrier is no worse off than a non-carrier, and does hearing conservation started before onset change the trajectory?
  attaches_to:
  - environmental#Occupational and recreational noise exposure
  - treatments#Hearing Conservation and Noise Avoidance
  - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
  rationale: Human evidence relates recalled occupational exposure to hearing thresholds. Mouse experiments establish protocol-specific susceptibility but do not define a safe human carrier dose or show the benefit of a conservation program. A longitudinal cohort with dosimetry, audiometry and genotype-negative relatives could quantify the interaction.
  evidence:
  - reference: PMID:23345450
    reference_title: Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Similarly, among family members heterozygous for P2RX2 p.V60L, noise exposure exacerbated high-frequency hearing loss in young adulthood.
    explanation: Observational association motivates, but does not answer, the prospective exposure-response question.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  proposed_experiments:
  - experiment_id: exp_dfna41_carrier_noise_dosimetry_cohort
    name: Longitudinal noise dosimetry in P2RX2 carriers and non-carrier relatives
    description: Enrol carriers and genotype-negative relatives from known DFNA41 kindreds, measure cumulative noise exposure by personal dosimetry rather than by questionnaire, and follow pure tone and extended high-frequency audiometry annually. Model threshold change against cumulative dose separately by genotype to estimate whether the exposure-response curve is shifted and by how much.
    would_support:
    - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
    supporting_outcome:
    - Carriers show a steeper threshold-versus-dose slope than non-carrier relatives, with separation beginning at exposures within current occupational limits, which would justify genotype-specific exposure advice and give a number to give patients.
    would_refute:
    - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
    refuting_outcome:
    - No association between measured exposure and excess carrier decline would weaken a genotype-specific exposure-response claim; general hearing-conservation advice would still apply.
- discussion_id: dfna41_null_versus_heterozygous_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: How do allele-specific channel changes in heterozygous carriers affect purinergic adaptation, and which mechanisms explain progressive loss?
  attaches_to:
  - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
  - animal_models#P2rx2 null mouse
  rationale: 'Null-mouse physiology establishes an adaptive P2X2 pathway. Dominant missense disease is not equivalent to partial gene deletion: heterozygous null mice retained adaptation, p.Val60Leu shows assay-dependent gating abnormalities, and dominant-negative effects on wild-type P2X2 are contested. Editing improves noise-susceptibility endpoints without directly testing temporary-threshold adaptation.'
  evidence:
  - *id006
  - *id007
  - *id008
  - reference: PMID:41090360
    reference_title: Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Editing further protects P2rx2V61L/+ mice from hypersensitivity to noise-induced hearing loss, a phenotype also observed in patients with DFNA41.
    explanation: Noise-susceptibility rescue is indirect evidence for the adaptation hypothesis, not measurement of the mechanism itself.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
  proposed_experiments:
  - experiment_id: exp_dfna41_tts_in_heterozygous_knockin
    name: Temporary threshold adaptation in P2rx2 V61L heterozygous mice
    description: Compare genotype-matched and background-matched knock-in, null, heterozygous-null and wild-type mice using baseline-adjusted ABR/DPOAE noise protocols and ATP-evoked cochlear measurements. Include edited knock-in ears to test whether endpoint rescue accompanies restoration of purinergic adaptation.
    would_support:
    - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
    supporting_outcome:
    - Reduced adaptation in knock-in mice, accompanied by correction after editing, would support the proposed link between allele dysfunction and loss of noise protection.
    would_refute:
    - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
    refuting_outcome:
    - Normal adaptation despite progressive knock-in hearing loss would argue against this being the sole disease mechanism.
- discussion_id: dfna41_gene_disease_validity
  kind: KNOWLEDGE_GAP
  prompt: P2RX2 is classified Moderate rather than Definitive for dominant nonsyndromic hearing loss. What would move it, and does the strength of the mechanistic evidence make the human genetic evidence look better than it is?
  attaches_to:
  - genetic#P2RX2
  - disease#Autosomal Dominant Nonsyndromic Hearing Loss 41
  rationale: ClinGen's September 2022 evaluation scored three variants in four probands and retained Moderate validity. New segregation and population data require allele-level assessment. Functional results support biological relevance but cannot substitute for independent human genetic evidence, especially for p.Asp273Tyr with conflicting population data.
  evidence:
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: P2RX2 / nonsyndromic genetic hearing loss (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In summary, there is moderate evidence to support this gene-disease relationship. While more evidence is needed to establish this relationship definitively, no convincing contradictory evidence has emerged.
    explanation: The panel's summary judgement, in its own words.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: P2RX2 / nonsyndromic genetic hearing loss (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Three missense variants that have been reported in four probands in four publications are included in this curation
    explanation: The size of the human genetic evidence base, which is the specific thing that is thin - not the mechanism.
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: P2RX2 / nonsyndromic genetic hearing loss (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Although a new case with hearing loss (29986705) and a new knock-in mouse model with progressive hearing loss (33791800) were scored, the classification did not change (SOP Version 9).
    explanation: 'The 2022 reevaluation, which is informative about what does not move a classification: an additional case and the allele-matched knock-in this entry relies on were both scored and left it at Moderate.'
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: P2RX2 / nonsyndromic genetic hearing loss (Moderate)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Loss of the P2RX2 receptor in mice increases susceptibility to noise-induced hearing loss, and a significant correlation was found in a large Chinese family between noise exposure during adolescence and severity of hearing loss (PMIDs: 23345450, 33791800).'
    explanation: 'An independent restatement of the gene-environment interaction, and a more specific one than the source papers give: the human correlation is with noise exposure during adolescence and with severity, in a large family.'
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
mechanistic_hypotheses:
- hypothesis_group_id: dfna41_channel_to_cochlear_injury
  description: Allele-specific channel abnormalities may impair cochlear adaptation and contribute to cellular/synaptic injury. Null-mouse adaptation physiology and heterozygous knock-in pathology support this proposal, but the complete causal route has not been established in human carriers.
notes: Scope is Mendelian P2RX2-associated hearing loss; noise is a modifier, not the primary disease category. ClinicalTrials.gov queries for P2RX2 and DFNA41 returned no studies on 2026-09-23. The current trial search is bounded to those queries. Abstract-only clinical sources were used within their available scope; accessible primary full text informed mechanism, onset, transcript annotation and experimental limitations.

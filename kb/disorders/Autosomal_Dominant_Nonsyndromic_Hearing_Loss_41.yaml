  - target: Loss of Purinergic Adaptation to Elevated Sound Levels
    environmental_effect: MODULATES
    causal_link_type: DIRECT
    description: >-
      Sound level is the input to the adaptation system, not merely a hazard acting on it.
      Elevated sound is what drives ATP release and P2X2 activation in the first place, so
      the node has no output at all without this exposure - which is why a carrier is
      indistinguishable from a non-carrier on this axis in quiet conditions and diverges
      under noise. Recorded as MODULATES rather than EXACERBATES because sound is the
      physiological stimulus for the mechanism rather than an aggravating agent applied to
      it.

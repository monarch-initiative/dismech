    explanation: Population-frequency evidence supporting pathogenicity of the founding allele.
  - reference: PMID:24211385
    reference_title: "A novel P2RX2 mutation in an Italian family affected by autosomal dominant nonsyndromic hearing loss."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Visual inspection of the protein structure as obtained from comparative modeling suggests that substitution of the small glycine residue with a charged bulky residue such as an arginine that is close to the 'neck' of the region responsible for ion channel gating should have a high energetic cost and should lead to a severely destabilization of the fold."
    explanation: >-
      The structural rationale for the second reported allele. Graded COMPUTATIONAL because
      it is comparative modelling, not a functional assay.
  - reference: PMID:34425661
    reference_title: "Identification of a Novel Stop Loss Mutation in P2RX2 Gene in an Iranian Family with Autosomal Nonsyndromic Hearing Loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This event would lead to continued translation into the 3' UTR of the gene, which in turn may result in a longer protein product."
    explanation: >-
      A mechanistically distinct allele class - stop loss producing an extended protein
      rather than a substitution - which is why the entry describes the spectrum by
      consequence rather than by variant type.
- name: Loss of Purinergic Adaptation to Elevated Sound Levels
  description: >-
    The core mechanism, and the one that makes DFNA41 unlike the structural deafness genes.
    As sound level rises, ATP is released from the tissues of the cochlear partition and
    activates P2X2 receptors distributed on the epithelial cells lining the endolymphatic
    compartment. The resulting conductance reduces the gain of the cochlear amplifier,
    which appears in auditory brainstem responses as a temporary threshold shift. This is
    an adaptive response to loud sound rather than injury.

    P2RX2-null mice do not develop that shift under sustained 85 dB noise, and the
    supporting measurements show the failure is upstream in the intended place: outer hair
    cell distortion product emissions are suppressed by noise significantly more in
    wild-type than in null mice, and suprathreshold response gain falls more in wild-type
    animals. Losing the adaptation is not protective; it removes a brake. At 95 dB and
    above the nulls are more vulnerable than wild-type mice to permanent hearing loss
    through hair cell synapse disruption.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: supporting cell

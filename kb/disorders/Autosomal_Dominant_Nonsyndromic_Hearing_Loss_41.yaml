    Heterozygous P2RX2 variants, fully penetrant in the founding six-generation kindred.
    Dominance is mechanistically accounted for rather than merely observed: P2X2 receptors
    are trimeric, so a mutant subunit incorporated into a heteromeric channel reduces the
    function of the whole assembly, and this was measured directly in coexpression
    experiments.

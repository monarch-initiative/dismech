pathophysiology:
- name: Variant-Specific P2X2 Channel Dysfunction
  description: 'P2RX2 p.Val60Leu and p.Gly353Arg alter P2X2 channel function. Early p.Val60Leu experiments found absent ATP-evoked current and reduced ATP-stimulated dye uptake. Subsequent studies found constitutive ATP-insensitive conductance for p.Val60Leu and ATP-responsive p.Gly353Arg channels with altered sensitivity, rectification and ion selectivity. In 2025, p.Val60Leu showed fluorescent-ATP binding, small ATP-evoked currents and reduced cell viability; constitutive activity was not reproduced under those conditions. These findings support abnormal gating and coupling rather than universally absent channels or ATP binding.

    Wild-type/mutant coexpression reduced permeability in the original study, but a later coexpression study retained robust ATP responses and argued against poisoning of wild-type P2X2. The dominant clinical inheritance is established for these alleles; its precise molecular basis remains disputed. P2X2/P2X3 heteromer experiments are distinct from mutant/wild-type P2X2 coexpression. Functional abnormalities of the uncertain p.Asp201Tyr/p.Asp273Tyr variant do not independently prove human disease causality.'

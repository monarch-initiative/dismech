- autosomal dominant nonsyndromic deafness 41
description: 'DFNA41 is autosomal dominant progressive sensorineural hearing loss associated with heterozygous P2RX2 variants. The best-supported alleles include p.Val60Leu and p.Gly353Arg. Age at recognition varies across families and publications; childhood/adolescent presentations preclude treating it as exclusively adult-onset. Occupational noise exposure was associated with poorer high-frequency hearing among p.Val60Leu carriers. Hyperalgesia was reported in one additional family, and a profoundly deaf proband benefited from cochlear implantation.

  P2X2 is an ATP-gated cation channel. The functional defect is allele- and assay-dependent: p.Val60Leu has markedly impaired ATP-evoked responses, with constitutive activity in a 2019 study but small ATP-triggered currents and reduced cell viability in a 2025 study. p.Gly353Arg retains channel activity with altered ATP sensitivity, rectification and ion selectivity. A universal dominant-negative mechanism is not established. P2rx2-null mice demonstrate a protective purinergic component of adaptation to sustained sound; this does not mean all temporary threshold shifts are harmless. The connection between specific human channel defects, adaptation and progressive cochlear injury remains incompletely resolved.

  Allele-selective genome editing preserved hearing at selected frequencies and reduced noise susceptibility in heterozygous p.Val61Leu mice, the mouse counterpart of human p.Val60Leu. This is preclinical evidence, supplemented by editing in human patient-derived cells. ClinGen''s September 2022 gene-disease classification remains Moderate in the reviewed assertion; variant-specific interpretation is essential.'

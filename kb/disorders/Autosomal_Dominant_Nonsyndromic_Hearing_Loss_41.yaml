    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that ATP-gated ion channels assembled from P2X2 receptor subunits in the cochlea are necessary for the development of temporary threshold shift (TTS), evident in auditory brainstem response recordings as sound levels rise."
    explanation: The central claim of this node, established in the null mouse.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice null for the P2RX2 gene (encoding the P2X2 receptor subunit), sustained 85-dB noise failed to elicit the TTS that wild-type (WT) mice developed."
    explanation: The specific loss-of-adaptation result at a moderate, non-damaging sound level.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ATP released from the tissues of the cochlear partition with elevation of sound levels likely activates the broadly distributed P2X2 receptors on epithelial cells lining the endolymphatic compartment."
    explanation: >-
      The proposed signalling route. Recorded with the authors' own hedge intact, since
      the release step is inferred rather than directly imaged.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At higher sound levels (≥95 dB), additional processes dominated TTS, and P2RX2-null mice were more vulnerable than WT mice to permanent hearing loss due to hair cell synapse disruption."
    explanation: >-
      The consequence of losing the brake, and the link from this node to the synaptic one:
      above the adaptive range, absence of P2X2 converts a survivable exposure into
      permanent loss.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data indicate that a significant component of TTS represents P2X2 receptor-dependent purinergic hearing adaptation that underpins the upper physiological range of hearing."
    explanation: >-
      The reframing this entry depends on: temporary threshold shift as physiology rather
      than as early damage.
- name: Inner Hair Cell and Ribbon Synapse Disorganisation
  description: >-
    The structural correlate seen in the knock-in mouse carrying the human founding allele.
    Abnormal inner hair cell and ribbon synapse morphology appears progressively, which the
    authors read as P2rx2 having a role in where ribbon synapses sit in the membrane. This
    is consistent with the finding in null mice that above the adaptive range, permanent
    loss occurs through hair cell synapse disruption.

    The node is drawn with an unknown-intermediate link from the channel defect because
    nothing connects loss of ATP-gated conductance to synaptic placement mechanistically;
    the two are observed in the same animals, not shown to be steps in one chain.

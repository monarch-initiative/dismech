    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "P2RX2 p.V60L abolishes two hallmark features of P2X(2) receptors: ATP-evoked inward current response and ATP-stimulated macropore permeability, measured as loss of ATP-activated FM1-43 fluorescence labeling."
    explanation: The direct electrophysiological and permeability measurement of the founding allele.
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT

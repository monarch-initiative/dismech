- name: Loss of Purinergic Adaptation to Elevated Sound Levels
  description: 'P2rx2-null mice lack the purinergic component of adaptation to sustained sound. Under the studied 85 dB SPL noise protocols, wild-type mice developed temporary ABR threshold shifts and reduced cochlear gain, whereas null mice showed greatly reduced adaptation. At higher levels, other processes contributed to temporary threshold shifts and null mice were more susceptible to permanent loss. These protocols do not establish a human safe-exposure threshold or imply that all temporary hearing changes are noninjurious.

    ATP-induced cochlear partition conductance and endocochlear-potential changes were absent in null mice. The acute cation shunt alone does not explain the prolonged threshold recovery; downstream processes remain incompletely defined. Heterozygous null littermates retained adaptation, supporting haplosufficiency in this assay. Extrapolation to heterozygous human missense disease therefore requires allele-specific testing.'

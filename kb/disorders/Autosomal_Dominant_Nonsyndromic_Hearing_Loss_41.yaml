  genotype: P2rx2 V61L/+ knock-in treated with AAV2 SaCas9-sgRNA targeting the mutant allele
  publication: PMID:41090360
  description: Local AAV2–SaCas9 editing of heterozygous p.Val61Leu mice preserved hearing at selected frequencies and attenuated noise-induced loss. Four-week treatment preserved low/mid-frequency responses for nine months; juvenile treatment broadened benefit. Cell survival and vestibular readouts also improved. Assays found no detectable cochlear target-site AAV integration at the tested dose, but cultured cells showed dose-dependent integration.

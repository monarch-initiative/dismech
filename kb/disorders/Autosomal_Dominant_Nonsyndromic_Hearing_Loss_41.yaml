name: Autosomal Dominant Nonsyndromic Hearing Loss 41
category: Mendelian
creation_date: "2026-08-28T00:00:00Z"
synonyms:
- DFNA41
- deafness, autosomal dominant 41
- P2RX2 autosomal dominant nonsyndromic deafness
- autosomal dominant nonsyndromic deafness caused by mutation in P2RX2
- autosomal dominant nonsyndromic deafness type 41
- deafness, autosomal dominant type 41
- autosomal dominant deafness 41
- autosomal dominant nonsyndromic deafness 41
description: >-
  DFNA41 is dominantly inherited, delayed-onset, progressive sensorineural hearing loss
  caused by heterozygous variants in P2RX2, which encodes the P2X2 subunit of an
  ATP-gated cation channel expressed on sensory and supporting cells of the cochlea.
  Onset in the original six-generation kindred was between 25 and 35 years, and hearing
  loss was fully penetrant and involved all frequencies.

  The reason to curate this entry rather than treat it as one more dominant deafness locus
  is that P2X2 is not a structural protein of the hair bundle. It is part of a feedback
  system. Rising sound levels cause ATP release into the endolymphatic compartment, ATP
  opens P2X2 channels on the epithelium lining that compartment, and the resulting
  conductance turns down the gain of the cochlear amplifier. That is what a temporary
  threshold shift is: not damage, but a protective adaptation to loud sound. P2RX2-null
  mice do not develop the temporary threshold shift that wild-type mice develop under
  sustained 85 dB noise, and at higher levels they sustain more permanent damage than
  wild-type mice do.

  So DFNA41 is a disorder of a protective mechanism, and its clinical signature follows
  from that. Hearing declines on its own, but noise exposure makes it worse, and this has
  been observed on both sides of the same experiment: P2RX2-null mice exposed early to
  continuous moderate noise had high-frequency hearing loss as young adults, and among
  heterozygous family members carrying p.Val60Leu, noise exposure exacerbated
  high-frequency hearing loss in young adulthood. The environmental interaction is
  therefore modelled here as a pathograph edge rather than left as prose, because for this
  disease it is a mechanism rather than a lifestyle note.

  The molecular defect for the founding allele is well characterised. P2RX2 p.Val60Leu
  abolishes both hallmark properties of the receptor, the ATP-evoked inward current and
  the ATP-stimulated macropore permeability, and coexpressing mutant with wild-type
  subunits significantly reduces ATP-activated membrane permeability - which is what makes
  a heterozygous allele dominant in a channel assembled from three subunits.

  There is a genome-editing proof of concept. AAV-delivered SaCas9 disrupting the mutant
  allele in the mature inner ear of a knock-in mouse restored auditory and vestibular
  function long-term, and specifically protected against noise hypersensitivity - the
  first demonstration that the environmental arm of this disease is itself treatable.
  Intervention at a juvenile stage widened the frequency range rescued.

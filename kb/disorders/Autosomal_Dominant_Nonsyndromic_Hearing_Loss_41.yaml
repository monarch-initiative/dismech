diagnosis:
- name: Take a noise history, and do not let it explain the audiogram away
  description: >-
    The diagnostic trap in DFNA41 is that its phenotype resembles the two commonest
    acquired causes of adult sensorineural hearing loss. Onset at 25 to 35 years with
    progressive high-frequency loss in someone with an occupational or recreational noise
    history looks like noise-induced hearing loss, and later it looks like early
    presbycusis. A dominant family history is the signal that should prompt sequencing.

    The noise history still matters, but as a modifier rather than as an alternative
    explanation: in a carrier, noise exposure and the genetic defect are the same story,
    because the gene encodes the protection against the noise. Diagnosis is by gene panel
    or exome sequencing; P2RX2 has been found through targeted enrichment panels of known
    nonsyndromic hearing loss genes.
  evidence:
  - reference: PMID:31593348
    reference_title: "Progressive Dominant Hearing Loss (Autosomal Dominant Deafness-41) and P2RX2 Gene Mutations: A Phenotype-Genotype Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study and the review of the literature suggest that P2RX2 plays a crucial role in predisposition to noise-induced and age-related hearing loss."
    explanation: >-
      The overlap with the two acquired causes that DFNA41 is most likely to be
      misattributed to.
  - reference: PMID:25788561
    reference_title: "Hearing loss caused by a P2RX2 mutation identified in a MELAS family with a coexisting mitochondrial 3243AG mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Targeted genomic enrichment and massively parallel sequencing of all known nonsyndromic hearing loss genes were performed to identify the genetic causes of hearing loss."
    explanation: >-
      The diagnostic route by which a P2RX2 family was found, and a reminder that a
      coexisting explanation for deafness in the family did not preclude a second one.
treatments:
- name: Hearing Conservation and Noise Avoidance
  description: >-
    The one intervention that follows directly from the mechanism. A DFNA41 carrier has
    lost the purinergic adaptation that limits cochlear amplifier gain under loud sound,
    so the ordinary advice about hearing protection carries more weight for them than for
    the general population. Noise exposure has been shown to exacerbate high-frequency
    hearing loss in carriers, and in the allele-matched mouse the noise hypersensitivity is
    a distinct, separately rescuable phenotype.

    This is behavioural rather than pharmacological, and no trial has tested whether noise
    avoidance changes the trajectory in carriers - the recommendation is inferred from the
    exposure-outcome association and from the mechanism, not from an intervention study.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: noise exposure avoidance and hearing protection
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, among family members heterozygous for P2RX2 p.V60L, noise exposure exacerbated high-frequency hearing loss in young adulthood."
    explanation: >-
      Graded PARTIAL because it establishes the exposure-outcome association that motivates
      avoidance, not that avoidance improves outcomes; no interventional evidence exists.
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results suggest that P2X(2) function is required for life-long normal hearing and for protection from exposure to noise."
    explanation: The protective role whose loss is the rationale for conservation advice.
  notes: >-
    treatment_term carries no NCIT binding. NCIT has no clinical-action term for hearing
    conservation or noise avoidance that is reachable from NCIT:C25218, so per the ontology
    contract a free-text preferred_term is correct here rather than a forced broader
    binding.
- name: Genetic Counselling with Audiologic Surveillance
  description: >-
    Counselling for a fully penetrant dominant condition with a 50 percent transmission
    risk, and serial audiometry in at-risk relatives. Onset between 25 and 35 years means a
    normal audiogram in a young adult relative is not reassurance, and it also means there
    is a long presymptomatic window in which noise conservation could in principle matter
    most.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which cosegregated with fully penetrant hearing loss in the index family"
    explanation: Full penetrance, which is what makes the transmission risk counselling definite.
  - reference: PMID:31593348
    reference_title: "Progressive Dominant Hearing Loss (Autosomal Dominant Deafness-41) and P2RX2 Gene Mutations: A Phenotype-Genotype Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of hearing loss was between age 25 and 35 years."
    explanation: >-
      The onset window that determines when surveillance of an at-risk relative becomes
      informative.
  notes: >-
    Hearing amplification and cochlear implantation are standard management for progressive
    adult sensorineural hearing loss, but no DFNA41-specific report documents either in a
    molecularly confirmed patient, so neither is curated here. This is a deliberate scoping
    decision. Genome editing is likewise not curated as a treatment: the published work is
    preclinical and is recorded under animal_models with its limitations stated.
animal_models:
- name: P2rx2 V60L knock-in mouse
  species: Mouse
  genotype: P2rx2 V60L knock-in, heterozygous
  publication: PMID:33791800
  description: >-
    An allele-matched model of the human founding variant, and the one that makes DFNA41
    unusually well served among dominant deafness loci - the mouse carries the same
    substitution as the patients rather than a null. Heterozygotes begin to lose hearing at
    21 days and are deaf by six months, with progressive abnormality of inner hair cell and
    ribbon synapse morphology, and vestibular dysfunction.
  genes:
  - preferred_term: P2RX2
    term:
      id: hgnc:15459
      label: P2RX2
  modeled_mechanisms:
  - target: Inner Hair Cell and Ribbon Synapse Disorganisation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The only system in which the cellular lesion of DFNA41 has been observed. It is
      allele-matched and heterozygous, so it reproduces the human genetic state rather than
      approximating it with a null.
    limitations: >-
      The time course is compressed to an extent that changes its meaning: mice are deaf by
      six months, while patients begin to lose hearing at 25 to 35 years and decline over
      decades. A phenotype that in mice looks like early-onset progressive deafness is in
      humans an adult-onset one. Synapse morphology has also not been examined in any
      human DFNA41 temporal bone, so the correspondence is assumed rather than checked.
      The vestibular dysfunction seen in these mice has no curated human counterpart: no
      vestibular testing is reported for any molecularly confirmed DFNA41 carrier, so it
      stays a model finding here rather than becoming a disease phenotype.
    readouts:
    - name: Inner hair cell and ribbon synapse morphology
      target: Inner Hair Cell and Ribbon Synapse Disorganisation
      direction: ALTERED
      interpretation: >-
        Progressive morphological abnormality rather than an all-or-none defect, appearing
        over the same period as the hearing decline.
      evidence:
      - reference: PMID:33791800
        reference_title: "Generation and characterization of a P2rx2 V60L mouse model for DFNA41."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Abnormal morphology of the inner hair cells and ribbon synapses was progressively observed in KI animals suggesting that P2rx2 plays a role in the membrane spatial location of the ribbon synapses."
        explanation: The structural measurement behind this readout.
    - name: Auditory function over time
      target: Inner Hair Cell and Ribbon Synapse Disorganisation
      direction: DECREASED
      interpretation: >-
        Progressive hearing loss from 21 days to deafness by six months. The readout is
        named for function rather than for threshold because the cited sentence reports
        hearing loss, and a threshold moves in the opposite direction to the function it
        measures.
      evidence:
      - reference: PMID:33791800
        reference_title: "Generation and characterization of a P2rx2 V60L mouse model for DFNA41."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Heterozygous KI mice started to exhibit hearing loss at 21-day-old and progressed to deafness by 6-month-old."
        explanation: The functional time course in the allele-matched heterozygote.
    evidence:
    - reference: PMID:33791800
      reference_title: "Generation and characterization of a P2rx2 V60L mouse model for DFNA41."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We generated and characterized a knock-in mouse model based on human p.V60L mutation that recapitulates the human phenotype."
      explanation: The authors' claim of recapitulation, on the same allele as the patients.
- name: P2rx2 null mouse
  species: Mouse
  genotype: P2rx2 null, homozygous
  publication: PMID:23592720
  description: >-
    The model in which the purinergic adaptation mechanism was established. Nulls lack
    ATP-gated conductance across the cochlear partition including ATP-gated inward current
    in hair cells, fail to develop the temporary threshold shift that wild-type mice
    develop under sustained 85 dB noise, and are more vulnerable than wild-type mice to
    permanent loss at 95 dB and above.
  genes:
  - preferred_term: P2RX2
    term:
      id: hgnc:15459
      label: P2RX2
  modeled_mechanisms:
  - target: Loss of Purinergic Adaptation to Elevated Sound Levels
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Defines the mechanism, with the conductance measurement, the behavioural threshold
      measurement and the supporting emission and gain data all in one system. Nothing
      equivalent can be measured in patients.
    limitations: >-
      A homozygous null against a human heterozygous state, so it models complete loss of
      the mechanism rather than the partial loss a carrier has - and partial is the
      clinically relevant condition, since the dominant allele degrades but does not
      abolish the function of channels containing wild-type subunits. Sound levels and
      exposure schedules are also experimental rather than matched to any human exposure
      history.
    readouts:
    - name: Noise-induced temporary threshold shift
      target: Loss of Purinergic Adaptation to Elevated Sound Levels
      direction: ABOLISHED
      interpretation: >-
        The adaptive response to moderate sustained noise does not occur in the absence of
        P2X2. This is the defining measurement of the node.
      evidence:
      - reference: PMID:23592720
        reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mice null for the P2RX2 gene (encoding the P2X2 receptor subunit), sustained 85-dB noise failed to elicit the TTS that wild-type (WT) mice developed."
        explanation: The threshold-shift measurement in the null.
    - name: ATP-gated conductance across the cochlear partition
      target: Loss of Purinergic Adaptation to Elevated Sound Levels
      direction: ABOLISHED
      interpretation: >-
        The electrophysiological substrate of the adaptation is absent, which is what makes
        the behavioural result mechanistic rather than merely correlated.
      evidence:
      - reference: PMID:23592720
        reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "P2RX2-null mice lacked ATP-gated conductance across the cochlear partition, including loss of ATP-gated inward current in hair cells."
        explanation: The direct conductance measurement in the null.
    evidence:
    - reference: PMID:23592720
      reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data indicate that a significant component of TTS represents P2X2 receptor-dependent purinergic hearing adaptation that underpins the upper physiological range of hearing."
      explanation: The conclusion this node curates, drawn from this model.
  - target: Noise-Exacerbated High-Frequency Hearing Impairment
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The gene-environment interaction reproduced under controlled exposure, which is the
      thing human observation cannot deliver because noise history in a family is recalled
      rather than measured.
    limitations: >-
      Homozygous null rather than the human heterozygous state, and the exposure is a
      defined laboratory protocol rather than a lifetime of variable occupational and
      recreational sound. The direction and the interaction are reproduced; the dose is not
      comparable.
    readouts:
    - name: High-frequency hearing after early continuous moderate noise
      target: Noise-Exacerbated High-Frequency Hearing Impairment
      direction: DECREASED
      interpretation: >-
        Controlled early exposure produces the same high-frequency loss reported in exposed
        human carriers.
      evidence:
      - reference: PMID:23345450
        reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "P2RX2-null mice developed severe progressive hearing loss, and their early exposure to continuous moderate noise led to high-frequency hearing loss as young adults."
        explanation: The controlled-exposure measurement.
    evidence:
    - reference: PMID:23592720
      reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At higher sound levels (≥95 dB), additional processes dominated TTS, and P2RX2-null mice were more vulnerable than WT mice to permanent hearing loss due to hair cell synapse disruption."
      explanation: >-
        Vulnerability to permanent noise damage measured in the same null line, which is
        what makes it informative for the noise-exacerbated phenotype rather than only for
        the adaptation node.
- name: P2rx2 V61L knock-in mouse treated with AAV-delivered SaCas9
  species: Mouse
  genotype: P2rx2 V61L/+ knock-in treated with AAV2 SaCas9-sgRNA targeting the mutant allele
  publication: PMID:41090360
  description: >-
    Allele-specific genome editing in the mature inner ear of the knock-in heterozygote.
    Local injection produced efficient and specific editing that abolished the mutation
    without notable off-target effects or AAV genome integration, restored long-term
    auditory and vestibular function, and protected the animals from noise
    hypersensitivity. Intervention at a juvenile stage broadened the frequency range
    rescued. A gRNA effective against the human V60L allele was also identified.
  genes:
  - preferred_term: P2RX2
    term:
      id: hgnc:15459
      label: P2RX2
  modeled_mechanisms:
  - target: Loss of Purinergic Adaptation to Elevated Sound Levels
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      The forward test of the mechanism. Removing the mutant allele restores not just
      hearing but specifically the resistance to noise, which is the functional signature
      of the purinergic adaptation this entry places at the centre of the disease. That the
      noise phenotype rescues separately is the strongest available evidence that it is
      mechanistically distinct from the baseline progressive loss rather than a
      consequence of it.
    limitations: >-
      Editing removes the dominant allele in a mouse whose own P2rx2 numbering differs
      (V61L against human V60L) and whose disease runs its course in months rather than
      decades, so the treated window has no clear human equivalent. The authors show that
      juvenile intervention broadens the rescued frequency range, which implies that later
      treatment does less - and human DFNA41 is not diagnosable until adulthood, well past
      any comparable stage. The human gRNA was identified, not tested in patients.
    readouts:
    - name: Resistance to noise-induced hearing loss after editing
      target: Loss of Purinergic Adaptation to Elevated Sound Levels
      direction: RESTORED
      interpretation: >-
        Protection against noise is restored, not merely baseline hearing, which maps the
        rescue onto the adaptation mechanism specifically. Named for resistance rather
        than susceptibility so that RESTORED reads in the same direction as the measure.
      evidence:
      - reference: PMID:41090360
        reference_title: "Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Editing further protects P2rx2V61L/+ mice from hypersensitivity to noise-induced hearing loss, a phenotype also observed in patients with DFNA41."
        explanation: >-
          The noise-specific rescue, and the authors' own statement that the phenotype
          rescued is one patients have.
    - name: Auditory and vestibular function after editing
      target: Loss of Purinergic Adaptation to Elevated Sound Levels
      direction: RESTORED
      interpretation: Long-term restoration of both systems from a single dose.
      evidence:
      - reference: PMID:41090360
        reference_title: "Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Editing effectively restores long-term auditory and vestibular function."
        explanation: The primary functional outcome of the intervention.
    evidence:
    - reference: PMID:41090360
      reference_title: "Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We demonstrate that local injection in adult mice results in efficient and specific editing that abolishes the mutation without notable off-target effects or AAV genome integration."
      explanation: >-
        Establishes that the intervention did what it was supposed to at the molecular
        level, which is what licenses reading the functional rescue as mechanism-specific.
  evidence:
  - reference: PMID:41090360
    reference_title: "Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Intervention in mice at a juvenile stage broadens the frequency range rescued, highlighting the importance of early intervention."
    explanation: >-
      Graded PARTIAL because it qualifies the rescue rather than supporting it: the benefit
      is timing-dependent, and the timing that works best has no counterpart in a disease
      diagnosed in adults.
discussions:
- discussion_id: dfna41_carrier_noise_dose_response
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much noise is too much for a P2RX2 carrier? Is there a dose below which a carrier
    is no worse off than a non-carrier, and does hearing conservation started before onset
    change the trajectory?
  attaches_to:
  - environmental#Occupational and recreational noise exposure
  - treatments#Hearing Conservation and Noise Avoidance
  - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
  rationale: >-
    This entry curates noise avoidance as a treatment on the strength of an association and
    a mechanism, and that is the weakest treatment claim in the file. The evidence is that
    exposed carriers did worse than unexposed ones in one family, and that null mice
    exposed to a laboratory protocol lost high frequencies. Neither tells a 22-year-old
    carrier whether to change career, and neither establishes that protection helps.

    The gap is quantitative and it is answerable. Occupational noise exposure limits are
    built on population dose-response data in people with intact purinergic adaptation; a
    carrier has, by hypothesis, a left-shifted curve, but nobody has measured where. The
    mouse work gives a hint that the shift is real at moderate levels, since the difference
    between null and wild-type appears at 85 dB - below the level at which additional
    damage processes take over - which is squarely inside the range of ordinary
    occupational exposure rather than at the extremes.

    What would settle it is a carrier cohort with dosimetry rather than recalled exposure,
    audiometry over years, and non-carrier relatives as controls. The founding kindred is
    six generations deep and has already been followed for ten years, so the ascertainment
    problem is mostly solved. Until then the counselling advice in this entry should be
    read as mechanistically motivated rather than evidence-based, which is how the
    treatment entry states it.
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, among family members heterozygous for P2RX2 p.V60L, noise exposure exacerbated high-frequency hearing loss in young adulthood."
    explanation: >-
      Graded PARTIAL: an exposure-outcome association without exposure quantification,
      which is exactly the limitation the gap is about.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice null for the P2RX2 gene (encoding the P2X2 receptor subunit), sustained 85-dB noise failed to elicit the TTS that wild-type (WT) mice developed."
    explanation: >-
      Locates the divergence at a specific, ordinary sound level, which is what makes the
      dose question concrete rather than abstract.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At higher sound levels (≥95 dB), additional processes dominated TTS, and P2RX2-null mice were more vulnerable than WT mice to permanent hearing loss due to hair cell synapse disruption."
    explanation: >-
      Shows that the relationship between genotype and sound level is not monotonic in
      kind: different processes dominate at different intensities, so a single exposure
      limit may not be the right answer.
  - reference: PMID:31593348
    reference_title: "Progressive Dominant Hearing Loss (Autosomal Dominant Deafness-41) and P2RX2 Gene Mutations: A Phenotype-Genotype Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive hearing impairment was confirmed by history and by audiological follow-up testing in all the patients."
    explanation: >-
      Evidence that longitudinal follow-up of this kindred is already established, which is
      what makes the proposed dosimetry study feasible rather than hypothetical.
  proposed_experiments:
  - experiment_id: exp_dfna41_carrier_noise_dosimetry_cohort
    name: Longitudinal noise dosimetry in P2RX2 carriers and non-carrier relatives
    description: >-
      Enrol carriers and genotype-negative relatives from known DFNA41 kindreds, measure
      cumulative noise exposure by personal dosimetry rather than by questionnaire, and
      follow pure tone and extended high-frequency audiometry annually. Model threshold
      change against cumulative dose separately by genotype to estimate whether the
      exposure-response curve is shifted and by how much.
    would_support:
    - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
    supporting_outcome:
    - >-
      Carriers show a steeper threshold-versus-dose slope than non-carrier relatives, with
      separation beginning at exposures within current occupational limits, which would
      justify genotype-specific exposure advice and give a number to give patients.
    would_refute:
    - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
    refuting_outcome:
    - >-
      Carrier and non-carrier slopes are indistinguishable and the carrier decline is
      independent of measured dose, which would mean the reported exacerbation reflects
      recall bias or confounding and that noise avoidance should be dropped from this
      entry as a mechanism-specific recommendation.
- discussion_id: dfna41_null_versus_heterozygous_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The purinergic adaptation mechanism was established in homozygous P2rx2 null mice,
    but DFNA41 patients are heterozygous for a subunit that poisons trimeric channels
    partially. Is adaptation abolished in carriers, or merely reduced, and does that
    difference change what noise does to them?
  attaches_to:
  - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
  - animal_models#Mouse
  rationale: >-
    The two halves of this entry's mechanism come from different genotypes. The adaptation
    node rests on null mice, where the conductance is absent outright. Patients carry one
    mutant allele in a channel built from three subunits, and the measured consequence of
    that is a significant reduction in ATP-activated permeability on coexpression - a
    reduction, not an abolition. So the human condition is a partial loss of a graded
    protective mechanism, and the model that defined the mechanism is a complete loss of it.

    This matters for more than tidiness. If adaptation in carriers is reduced but present,
    there may be a sound level below which it still engages, which is precisely the dose
    question a carrier needs answered. If it is effectively abolished at ordinary sound
    levels despite the residual wild-type channels, the carrier is in the same position as
    the null mouse and the advice is simpler and stricter. Nobody has measured
    noise-induced temporary threshold shift in a P2rx2 V60L heterozygous mouse, which is
    the obvious experiment and uses a model that already exists.

    The gene-editing study bears on this indirectly and encouragingly: rescuing the
    heterozygote restored noise resistance, which implies the heterozygous state does have
    a noise phenotype to rescue. But that is an endpoint measurement, not a measurement of
    the adaptation itself.
  evidence:
  - reference: PMID:23345450
    reference_title: "Mutation of the ATP-gated P2X(2) receptor leads to progressive hearing loss and increased susceptibility to noise."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of mutant and WT P2X(2) receptor subunits significantly reduced ATP-activated membrane permeability."
    explanation: >-
      The human genetic state is partial loss, quantified. That is the mismatch with the
      null model.
  - reference: PMID:23592720
    reference_title: "ATP-gated ion channels mediate adaptation to elevated sound levels."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "P2RX2-null mice lacked ATP-gated conductance across the cochlear partition, including loss of ATP-gated inward current in hair cells."
    explanation: >-
      The model state is complete loss, also measured. Setting the two quotes side by side
      is the substance of the mismatch.
  - reference: PMID:41090360
    reference_title: "Single-dose genome editing therapy rescues auditory and vestibular functions in adult mice with DFNA41 deafness."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Editing further protects P2rx2V61L/+ mice from hypersensitivity to noise-induced hearing loss, a phenotype also observed in patients with DFNA41."
    explanation: >-
      Graded PARTIAL: indirect evidence that the heterozygote does have a noise phenotype,
      since it can be rescued, but it does not measure purinergic adaptation in that
      genotype.
  proposed_experiments:
  - experiment_id: exp_dfna41_tts_in_heterozygous_knockin
    name: Temporary threshold shift measurement in P2rx2 V60L heterozygous mice
    description: >-
      Run the same graded sound-level protocol used in the null study - sustained exposure
      at 85 dB and at 95 dB with auditory brainstem response and distortion product
      otoacoustic emission recordings before, during and after - in P2rx2 V60L heterozygous
      knock-in mice, wild-type littermates, and P2rx2 nulls in the same experiment, at an
      age before the knock-in has lost baseline hearing.
    would_support:
    - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
    supporting_outcome:
    - >-
      Heterozygotes show a reduced but measurable temporary threshold shift, intermediate
      between wild-type and null, which would establish adaptation as graded with gene
      dosage and would give a sound level at which carrier protection still engages.
    would_refute:
    - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
    refuting_outcome:
    - >-
      Heterozygotes are indistinguishable from wild-type in threshold shift while still
      developing progressive hearing loss, which would mean the adaptation defect is not
      the mechanism of DFNA41 in carriers and would push the entry's centre of gravity
      toward the synaptic node instead.
- discussion_id: dfna41_gene_disease_validity
  kind: KNOWLEDGE_GAP
  prompt: >-
    P2RX2 is classified Moderate rather than Definitive for dominant nonsyndromic hearing
    loss. What would move it, and does the strength of the mechanistic evidence make the
    human genetic evidence look better than it is?
  attaches_to:
  - genetic#P2RX2
  - disease#Autosomal Dominant Nonsyndromic Hearing Loss 41
  rationale: >-
    This entry is mechanistically rich and genetically thin, and the two can be mistaken
    for one another. The purinergic adaptation story rests on a null mouse, a knock-in
    mouse, a genome-editing rescue and direct electrophysiology - as good a mechanistic
    case as most deafness genes have. The human case rests on three missense variants in
    four probands, which is why ClinGen's Hearing Loss expert panel classified the
    gene-disease relationship Moderate in 2018 and left it at Moderate on reevaluation in
    2022 even after adding a new case and a new mouse model.

    The panel's own framing is worth keeping in view: more evidence is needed to establish
    the relationship definitively, and no convincing contradictory evidence has emerged.
    That is not scepticism about the gene, it is a statement that segregation and case
    counts have not accumulated. What would move the classification is more independent
    probands with segregation, which for an adult-onset dominant condition means finding
    families rather than waiting for them.

    Practically, the caution belongs at the point of variant interpretation rather than in
    the mechanism. A novel P2RX2 missense variant in an isolated adult with progressive
    high-frequency loss and a noise history is exactly the situation in which a Moderate
    gene-disease classification should restrain a pathogenic call - and it is also the
    situation this entry's diagnosis section warns is easy to misattribute in the other
    direction. Both errors are available, and this entry deliberately does not resolve
    that tension by hiding either half.
  evidence:
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: "P2RX2 / nonsyndromic genetic hearing loss (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is moderate evidence to support this gene-disease relationship. While more evidence is needed to establish this relationship definitively, no convincing contradictory evidence has emerged."
    explanation: The panel's summary judgement, in its own words.
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: "P2RX2 / nonsyndromic genetic hearing loss (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Three missense variants that have been reported in four probands in four publications are included in this curation"
    explanation: >-
      The size of the human genetic evidence base, which is the specific thing that is
      thin - not the mechanism.
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: "P2RX2 / nonsyndromic genetic hearing loss (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although a new case with hearing loss (29986705) and a new knock-in mouse model with progressive hearing loss (33791800) were scored, the classification did not change (SOP Version 9)."
    explanation: >-
      The 2022 reevaluation, which is informative about what does not move a
      classification: an additional case and the allele-matched knock-in this entry relies
      on were both scored and left it at Moderate.
  - reference: CGGV:assertion_c1dae6b6-4ed7-4c5a-ba4e-bcfaba026be8-2022-09-21T160000.000Z
    reference_title: "P2RX2 / nonsyndromic genetic hearing loss (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loss of the P2RX2 receptor in mice increases susceptibility to noise-induced hearing loss, and a significant correlation was found in a large Chinese family between noise exposure during adolescence and severity of hearing loss (PMIDs: 23345450, 33791800)."
    explanation: >-
      An independent restatement of the gene-environment interaction, and a more specific
      one than the source papers give: the human correlation is with noise exposure during
      adolescence and with severity, in a large family.

pathophysiology:
- name: P2X2 Receptor Loss of Function
  description: >-
    Heterozygous P2RX2 alleles that cripple the ATP-gated channel. The best-characterised
    is p.Val60Leu, which abolishes both defining properties of P2X2 receptors: the
    ATP-evoked inward current and the ATP-stimulated macropore permeability measured as
    loss of ATP-activated FM1-43 labelling. Other reported alleles are p.Gly353Arg in an
    Italian family, predicted by comparative modelling to destabilise the fold near the
    region controlling channel gating, p.Asp201Tyr in a Japanese family, and a stop-loss
    variant p.Ter350Glu in an Iranian family that would extend translation into the
    3-prime untranslated region and yield a longer protein.

    The dominant mechanism is subunit poisoning rather than simple haploinsufficiency.
    P2X2 channels assemble from three subunits, and coexpressing mutant with wild-type
    subunits significantly reduced ATP-activated permeability, so a single mutant allele
    degrades the function of channels that also contain wild-type subunits.
  biological_scale: MOLECULAR

- name: Skin barrier disruption and atopic inflammation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Severe, treatment-resistant atopic dermatitis-like skin inflammation with
    intractable pruritus is a hallmark, present in the mother since birth.
    Mouse models carrying a Jak1 gain-of-function substitution recapitulate the
    phenotype: JAK1 hyperactivation drives skin serine-protease overexpression,
    skin-barrier disruption, and a Th2-biased pruritic dermatitis that is delayed
    by pharmacologic JAK1 inhibition, mirroring the JAK-inhibitor response in
    patients.
  biological_processes:

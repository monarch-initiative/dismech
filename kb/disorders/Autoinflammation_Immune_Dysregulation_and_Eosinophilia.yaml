- name: Eosinophil expansion and tissue infiltration
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Patients develop marked peripheral eosinophilia and eosinophilic precursors,
    with tissue infiltration reported in the liver and gastrointestinal tract.
    Modeling p.A634D in zebrafish and human iPSCs reveals enhanced myelopoiesis,
    linking the activating lesion to expansion of the myeloid/eosinophil
    lineage. Ruxolitinib markedly decreases eosinophil counts, although residual
    elevation can persist.

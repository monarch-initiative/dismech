diagnosis:
- name: Molecular identification of an activating JAK1 variant
  description: >-
    Sequence JAK1 in patients with otherwise unexplained early-onset
    eosinophilia plus multisystem atopy, autoinflammation, colitis, renal disease,
    or autoimmunity. Analysis should allow detection of constitutional
    heterozygous variants and lower-allele-fraction post-zygotic mosaic variants.
  results: >-
    A clinically concordant activating JAK1 variant; p.A634D and mosaic p.S703I
    have the strongest case-level causal evidence.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing revealed a heterozygous gain-of-function (GOF) variant in the regulatory pseudokinase domain"
    explanation: Exome sequencing identified the causal p.A634D variant in the affected family.
  - reference: PMID:32750333
    reference_title: "Complex Autoinflammatory Syndrome Unveils Fundamental Principles of JAK1 Kinase Transcriptional and Biochemical Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe a patient with early-onset multi-organ immune dysregulation resulting from a mosaic, gain-of-function mutation (S703I) in JAK1, encoding a kinase essential for signaling downstream of >25 cytokines."
    explanation: A mosaic-aware diagnostic approach is required because a pathogenic post-zygotic variant has been reported.
- name: Functional JAK-STAT signaling assessment
  description: >-
    Baseline and cytokine-stimulated STAT phosphorylation and interferon-stimulated
    gene expression can provide functional support for a candidate variant, but
    results must be interpreted with segregation, phenotype, frequency, and
    penetrance data.
  results: Hyperactive baseline or cytokine-induced STAT phosphorylation relative to wild-type controls
  evidence:
  - reference: PMID:38563820
    reference_title: "Individuals with JAK1 variants are affected by syndromic features encompassing autoimmunity, atopy, colitis, and dermatitis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro and ex vivo analysis of these variants revealed hyperactive baseline and cytokine-induced STAT phosphorylation and interferon-stimulated gene (ISG) levels compared with wild-type JAK1."
    explanation: This defines the shared functional readout used to evaluate the four broader JAACD variants.
  notes: >-
    Functional gain of signaling does not by itself prove full clinical
    penetrance or justify upgrading a population-observed variant to pathogenic.
differential_diagnoses:
- name: Reactive or clonal hypereosinophilic disorders
  description: >-
    Infection, drug reaction, allergic disease, eosinophilic neoplasia, and other
    reactive or clonal hypereosinophilic syndromes can resemble AIIDE.
  distinguishing_features:
  - A pathogenic or clinically concordant activating JAK1 variant favors AIIDE.
  - Congenital or early multisystem atopy, autoimmunity, growth failure, and JAK-STAT hyperphosphorylation support AIIDE over isolated reactive eosinophilia.
  evidence:
  - reference: PMID:36546480
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline gain-of-function (GOF) variants in JAK1 are a cause of severe atopy and eosinophilia."
    explanation: The defining genetic cause distinguishes AIIDE from acquired and clonal eosinophilic conditions.
- name: Severe atopic dermatitis or eosinophilic gastrointestinal disease
  description: >-
    Organ-limited atopy and eosinophilic gastrointestinal disease overlap with
    the cutaneous, allergic, and gastrointestinal manifestations of AIIDE.
  distinguishing_features:
  - Multisystem autoimmunity, growth failure, renal or hepatic disease, and marked JAK-STAT hyperactivation favor AIIDE.
  - Molecular evidence of an activating JAK1 variant supports a syndromic diagnosis.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2017, an IEI was discovered in a family with severe atopic dermatitis, asthma, food allergy, failure to thrive, autoimmune thyroiditis, and markedly elevated peripheral blood eosinophil counts"
    explanation: The combination of atopy with growth, endocrine, and hematologic findings demonstrates the syndromic pattern.
- name: Other inborn errors of immunity with immune dysregulation
  description: >-
    Combined variable immune deficiency, STAT gain-of-function disorders, and
    other monogenic immune-dysregulation syndromes can present with infection,
    enteropathy, autoimmunity, eczema, and poor growth.
  distinguishing_features:
  - Gene-panel or exome analysis differentiates JAK1 gain-of-function from other monogenic immune disorders.
  - Variant-specific STAT phosphorylation patterns and segregation can support interpretation.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10986756/fullTextXML
    reference_title: "Individuals with JAK1 variants are affected by syndromic features encompassing autoimmunity, atopy, colitis, and dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented in adulthood with nonspecific colitis, recurrent respiratory infections, autoimmune thrombocytopenia, and autoimmune hepatitis, suggesting a diagnosis of combined variable immune deficiency (CVID)."
    explanation: A JAACD proband initially resembled CVID, documenting this clinically relevant overlap.

treatments:
- name: Ruxolitinib
  description: >-
    Oral JAK1/2 inhibitor used as precision therapy targeting the exaggerated
    JAK1 signaling. Long-term treatment of the two affected children produced
    rapid improvement in pruritus and dermatitis and sustained improvement in
    growth, gastrointestinal symptoms, liver markers, and eosinophilia. Residual
    eosinophilia and airway disease can persist. Dose-dependent anemia improved
    with dose adjustment.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ruxolitinib
      term:
        id: CHEBI:66919
        label: ruxolitinib
  target_phenotypes:
  - preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  - preferred_term: Atopic dermatitis
    term:
      id: HP:0001047
      label: Atopic dermatitis
  target_mechanisms:
  - target: Constitutive JAK-STAT pathway activation
    treatment_effect: INHIBITS
    description: Ruxolitinib inhibits the hyperactive JAK1/2-STAT signaling that drives the disorder.
    evidence:
    - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
      reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "patients experienced rapid and sustained improvements in growth and allergic immune dysregulation on ruxolitinib."
      explanation: Clinical improvement after direct pathway inhibition supports excess JAK-STAT signaling as the therapeutic target.
  evidence:
  - reference: PMID:36546480
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "long-term ruxolitinib treatment of 2 children carrying the JAK1GOF (p.A634D) variant remarkably improved their growth, eosinophilia, and clinical features of allergic inflammation."
    explanation: >-
      Longer-term follow-up of the index children documents sustained
      improvement in growth, eosinophilia, and allergic inflammation on
      ruxolitinib.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ruxolitinib therapy dramatically improved eosinophil counts; however, they remained above the normal upper limit"

notes: >-
  Classic AIIDE caused by p.A634D and the severe mosaic p.S703I case should be
  distinguished from the broader JAACD association spectrum. The E139K, R506C,
  S700N, and V985I variants show increased signaling in experimental systems,
  but population frequency, genotype-first ascertainment, variable expressivity,
  and reduced penetrance require variant-level caution. Published JAK-inhibitor
  outcomes are uncontrolled and patient-specific. Systemic corticosteroids and
  other immunosuppressants were ineffective for important manifestations in the
  severe reported cases, but this does not establish universal treatment failure.
review_notes: >-
  Full review completed 2026-07-21. Primary-source evidence was checked for the
  p.A634D family, mosaic p.S703I case, and JAACD cohort. ClinicalTrials.gov
  searches for JAK1 gain-of-function, JAK1-associated autoimmunity, AIIDE, and
  JAACD returned no registered disease-specific studies, so clinical_trials is
  explicitly empty. Population prevalence and formal diagnostic criteria remain
  unavailable. GSE142599 is the only clearly public disease-specific omics
  accession identified; protected or on-request human data were not represented
  as public datasets.

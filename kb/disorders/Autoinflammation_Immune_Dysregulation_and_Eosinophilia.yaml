name: Autoinflammation, immune dysregulation, and eosinophilia
creation_date: "2026-06-27T00:00:00Z"
category: Mendelian
synonyms:
- AIIDE
- JAK1 gain-of-function syndrome
- JAACD syndrome
- JAK1-associated autoimmunity, atopy, colitis, and dermatitis syndrome
- Autosomal dominant immune dysregulatory and hypereosinophilic syndrome
- Germline JAK1 gain-of-function disorder
disease_term:
  preferred_term: Autoinflammation, immune dysregulation, and eosinophilia
  term:
    id: MONDO:0033558
    label: autoinflammation, immune dysregulation, and eosinophilia
parents:
- hereditary disease
- Primary Immunodeficiency
description: >-
  Autoinflammation, immune dysregulation, and eosinophilia (AIIDE; OMIM 618999)
  is a very rare immune-dysregulation disorder caused by activating JAK1
  variants. The prototypic heterozygous germline c.1901C>A (p.A634D) variant in
  the regulatory pseudokinase domain causes severe early-onset atopy,
  eosinophilia, growth failure, gastrointestinal and hepatic involvement, and
  autoimmunity. A post-zygotic mosaic p.S703I variant caused a severe
  autoinflammatory, gastrointestinal, and renal phenotype. Additional
  heterozygous variants across the FERM, SH2, pseudokinase, and kinase domains
  have been associated with a broader JAK1-associated autoimmunity, atopy,
  colitis, and dermatitis (JAACD) spectrum. These later variants show functional
  gain of signaling but variable expressivity and reduced penetrance, so they
  should not all be interpreted as equivalent to the fully penetrant p.A634D
  syndrome. Hyperactive baseline and cytokine-induced STAT phosphorylation is
  the shared molecular readout. Published patient-level responses to
  ruxolitinib, tofacitinib, baricitinib, and upadacitinib support pathway-directed
  therapy, but evidence remains limited to a family, individual cases, and a
  small genotype-first series rather than controlled trials.

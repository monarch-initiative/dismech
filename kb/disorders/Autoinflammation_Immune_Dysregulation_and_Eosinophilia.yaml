epidemiology:
- name: Reported-case frequency
  description: >-
    Population prevalence has not been established. The literature began with
    one three-member p.A634D family and one patient with mosaic p.S703I. A later
    forward- and reverse-genetics study described 59 heterozygous variant
    carriers, but ascertainment included genotype-first biobank participants
    and does not mean that all 59 had clinically penetrant AIIDE.
  notes: >-
    The disorder is best treated as ultra-rare; no incidence or population
    prevalence estimate is available.
  evidence:
  - reference: PMID:38563820
    reference_title: "Individuals with JAK1 variants are affected by syndromic features encompassing autoimmunity, atopy, colitis, and dermatitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we use forward and reverse genetics to identify 59 individuals harboring one of four heterozygous JAK1 variants."
    explanation: >-
      This is the largest reported variant-carrier series, but its combined
      phenotype-first and genotype-first design precludes using 59 as a count of
      clinically affected classic AIIDE cases.
progression:
- phase: Antenatal to early childhood onset
  age_range: Antenatal to early childhood
  notes: >-
    Severe p.A634D disease can begin with poor intrauterine growth and hepatic
    cysts, followed in infancy or childhood by dermatitis, eosinophilia,
    gastrointestinal disease, hypothyroidism, and growth failure. The mosaic
    p.S703I case had a pustular rash at birth and gastrointestinal inflammation
    from approximately one year of age.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "poor intrauterine growth, hepatic cysts, respiratory distress at birth"
    explanation: Longitudinal follow-up documents antenatal and neonatal manifestations in the p.A634D family.
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7398039/fullTextXML
    reference_title: "Complex Autoinflammatory Syndrome Unveils Fundamental Principles of JAK1 Kinase Transcriptional and Biochemical Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, the patient was noted to have a widespread pustular rash in a linear pattern that predominantly affected the left side of the body"
    explanation: The mosaic p.S703I phenotype was clinically apparent at birth.
- phase: Persistent multisystem disease with treatment-modifiable activity
  age_range: Childhood through adulthood
  notes: >-
    Untreated disease can remain active across skin, blood, gastrointestinal,
    endocrine, hepatic, and renal systems. Targeted JAK inhibition can produce
    rapid and sustained improvement, although residual eosinophilia or other
    manifestations may persist.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9869972/fullTextXML
    reference_title: "Human JAK1 gain of function causes dysregulated myelopoeisis and severe allergic inflammation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients experienced rapid and sustained improvements in growth and allergic immune dysregulation on ruxolitinib."
    explanation: Long-term follow-up shows that the course is substantially modified by pathway-directed therapy.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Classic and mosaic severe JAK1 gain-of-function disease causes congenital or
    early-childhood multisystem inflammation, growth failure, severe dermatitis,
    tissue eosinophilia, and potentially organ failure. The p.S703I case
    developed refractory membranous nephropathy requiring transplantation and
    later hemodialysis. Burden is more variable in the broader JAACD spectrum.
  evidence:
  - reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7398039/fullTextXML
    reference_title: "Complex Autoinflammatory Syndrome Unveils Fundamental Principles of JAK1 Kinase Transcriptional and Biochemical Function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Kidney transplantation was performed at age 11, but MN recurred within 1 year, followed by antibody-mediated rejection, requiring subsequent hemodialysis."
    explanation: The mosaic case demonstrates major irreversible renal morbidity and intensive long-term care burden.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous germline JAK1 gain-of-function variants segregate with disease
    in an autosomal dominant pattern. In the index family the variant arose de
    novo in the mother and was transmitted to both of her affected sons; it was
    absent in the unaffected maternal grandparents. Across the broader cohort,
    activating JAK1 variants are heterozygous, and one reported patient carried
    a post-zygotic mosaic variant.
  evidence:

phenotypes:
- name: Aplasia cutis congenita
  category: Integumentary
  description: >-
    Congenital absence of skin, usually over the scalp vertex or occiput,
    single or multiple, healing with scarring. It can be the only feature in
    some carriers. The 2021 cohort study (PMID:34040189, full text) reports
    aplasia cutis congenita in 61% of affected individuals.
  phenotype_term:
    preferred_term: Aplasia cutis congenita
    term:
      id: HP:0001057
      label: Aplasia cutis congenita
  evidence:

mechanistic_hypotheses:
- hypothesis_group_id: neural_crest_hyposumoylation
  hypothesis_label: >-
    Reduced SUMOylation during early embryogenesis represses neural crest
    differentiation genes, producing the craniofacial features
  status: EMERGING
  description: >-
    Transient pharmacological inhibition of the SUMO E1 enzyme in pregnant
    mice gives offspring with craniofacial deformities and repressed neural
    crest differentiation genes. Whether partial loss of UBA2 in humans acts
    through the same neural crest step has not been tested in patient cells or
    in a genetic Uba2 model. Edges that belong to it carry
    hypothesis_groups: [neural_crest_hyposumoylation].
  evidence:
  - reference: PMID:39985830
    reference_title: "Transient pharmacological inhibition of SUMOylation during pregnancy induces craniofacial malformations in offspring mice."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptomic analysis revealed the repression of genes involved in neural crest differentiation in the TAK981-treated embryos"
    explanation: Source of the neural crest hypothesis, from a pharmacological mouse model.
pathophysiology:
- name: UBA2 Loss of Function
  description: >-
    Heterozygous truncating, splice-site and missense UBA2 variants reduce the
    activity of SAE2, the catalytic subunit of the UBA2-SAE1 SUMO-activating E1
    enzyme. Truncating alleles are predicted to undergo nonsense-mediated
    decay, and human missense alleles fail to rescue uba2-null zebrafish, so
    the published mechanism is loss of function. Whole-gene deletion of UBA2
    in the 19q13.11 deletion syndrome gives overlapping features, consistent
    with haploinsufficiency. No dominant-negative or gain-of-function effect
    has been reported.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: UBA2
    term:
      id: hgnc:30661
      label: UBA2
  genetic_context:

    evidence_source: HUMAN_CLINICAL
    snippet: "While SUMOylation deficiency is incompatible with mammalian embryonic development, haploinsufficiency for the SUMOylation machinery's E1 enzyme, UBA2, leads to various phenotypic traits in humans, including craniofacial malformations and aplasia cutis congenita."
    explanation: Places the human UBA2 phenotype as partial SUMOylation deficiency, short of the lethal complete loss.

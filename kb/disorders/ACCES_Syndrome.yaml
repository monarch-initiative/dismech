name: ACCES Syndrome
creation_date: "2026-10-16T12:00:00Z"
category: Mendelian
description: >-
  ACCES syndrome (aplasia cutis congenita and ectrodactyly skeletal syndrome)
  is a rare autosomal dominant multiple congenital anomaly disorder caused by
  heterozygous UBA2 variants that are thought to act through loss of function.
  UBA2 encodes the catalytic subunit of the SUMO-activating E1 enzyme, a
  heterodimer with SAE1 that starts the SUMOylation cascade. The phenotype is
  highly variable, even within one family: aplasia cutis congenita, split hand
  or split foot and other digital anomalies, hip dysplasia and other skeletal
  findings, early growth deficiency, neurodevelopmental delay, and less often
  genital, renal, cardiac and ocular anomalies. Some carriers have only
  isolated aplasia cutis congenita or isolated split-hand/foot malformation.
  Variants are often de novo but are also transmitted through families.
synonyms:
- aplasia cutis congenita with ectrodactyly skeletal syndrome
- aplasia cutis congenita and ectrodactyly skeletal syndrome
- UBA2-related neurodevelopmental disorder
- UBA2-related disorder
disease_term:
  preferred_term: ACCES syndrome
  term:
    id: MONDO:0859262
    label: ACCES syndrome
parents:
- Multiple Congenital Anomalies Syndrome
notes: >-
  UBA2 lies at 19q13.11, next to the minimal overlap region of the chromosome
  19q13.11 deletion syndrome (MONDO:0013090), whose aplasia cutis,
  ectrodactyly, hypospadias and growth deficiency were attributed to UBA2
  haploinsufficiency before intragenic UBA2 variants were reported. That
  contiguous gene deletion syndrome removes neighbouring genes as well and is
  a separate concept; it is not curated in this entry and had no
  kb/disorders entry or stub when this entry was written. No GeneReviews
  chapter covers this disease.

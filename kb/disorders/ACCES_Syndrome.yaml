diagnosis:
- name: Exome or genome sequencing
  description: >-
    Detects the intragenic UBA2 truncating, splice-site and missense variants
    that define the disease; the disorder was delineated by exome sequencing,
    and genome sequencing of limb malformation cohorts found it
    independently. Because the phenotype overlaps TP63-related
    ectrodactyly-ectodermal dysplasia-clefting syndrome, Adams-Oliver
    syndrome, isolated split-hand/foot malformation and, in one family,
    dominant spondyloepiphyseal dysplasia tarda, broad sequencing rather than
    a single-gene test is the usual route to diagnosis.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34040189
    reference_title: "UBA2 variants underlie a recognizable syndrome with variable aplasia cutis congenita and ectrodactyly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing was used to detect UBA2 sequence variants in 16 subjects in 7 unrelated families."
    explanation: The defining cohort was identified by exome sequencing.
  - reference: PMID:34159400
    reference_title: "Genome sequencing in families with congenital limb malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In three unrelated cases with ectrodactyly, we identified likely pathogenic variants in UBA2, establishing it as a novel disease gene."
    explanation: Genome sequencing of unsolved limb malformation cases found UBA2 variants.
  - reference: PMID:39149811
    reference_title: "Atypical presentation of ACCES syndrome resembling dominant Spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dominant inheritance pattern in the pedigree suggested a pre-diagnosis of spondyloepiphyseal dysplasia tarda."
    explanation: A skeletal-dysplasia presentation was only recognized as ACCES syndrome by exome sequencing.
- name: Chromosomal microarray
  description: >-
    Detects 19q13.11 deletions that include UBA2. These cause the broader
    chromosome 19q13.11 deletion syndrome rather than ACCES syndrome itself,
    but a microarray is the test that separates the two when aplasia cutis or
    ectrodactyly is accompanied by features of the deletion syndrome.
  diagnosis_term:
    preferred_term: chromosomal microarray analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  evidence:
  - reference: PMID:29988626
    reference_title: "19q13.11 microdeletion: Clinical features overlapping ectrodactyly ectodermal dysplasia-clefting syndrome phenotype."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient who was followed for a long time under an ectrodactyly ectodermal dysplasia-clefting (EEC) syndrome and was subsequently diagnosed with a 19q13.11 microdeletion."
    explanation: >-
      A 19q13.11 deletion including UBA2 mimicked EEC syndrome until detected;
      INDIRECT because it concerns the deletion syndrome, not intragenic UBA2
      variants.
- name: Prenatal diagnosis
  description: >-
    Split hand and foot can be seen on prenatal ultrasound, and molecular
    testing can identify a familial or new UBA2 variant before birth.
  notes: >-
    No NCIT clinical-action term for prenatal genetic diagnosis was bound;
    the row is unbound rather than given a broader procedure term.
  evidence:
  - reference: PMID:42557106
    reference_title: "Prenatal Diagnosis of a Splice-Site Variant in UBA2: Expanding the Clinical Spectrum of UBA2-Related Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a case of a paternally inherited novel splice site variant in a patient prenatally diagnosed with Aplasia Cutis Congenita and Ectrodactyly (ACCES) syndrome with isolated split hand and foot malformations confirmed at birth."
    explanation: A prenatal diagnosis of ACCES syndrome confirmed at birth.
animal_models:
- name: uba2-null zebrafish with human mRNA rescue
  species: Zebrafish
  genotype: uba2-/- (CRISPR/Cas9 knockout)
  publication: PMID:34040189
  description: >-
    Homozygous uba2 knockout zebrafish develop small eyes, microcephaly,
    mandibular hypoplasia, abnormal fins and deficient growth, and die by 12
    days post fertilization. Injected wild-type human UBA2 mRNA partly
    rescues the gross phenotype, while mRNAs carrying patient missense
    variants rescue it less well, which is the main functional evidence that
    the missense alleles lose function.
  modeled_mechanisms:
  - target: UBA2 Loss of Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Tests whether patient missense alleles can replace uba2 function in
      vivo, which places them with the truncating alleles as loss of function.
    limitations: >-
      The fish are homozygous null, while patients carry one variant allele, so
      the model shows what UBA2 is needed for rather than what halving it does;
      heterozygous fish were not reported to have the phenotype. Wild-type
      human mRNA rescued only part of the phenotype, and in the full text three
      of the four patient missense mRNAs, not all, failed to rescue to a
      significant degree.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The disease lesion is a single heterozygous UBA2 variant; the model is a
        biallelic uba2 null, so the patient dosage state is not encoded and the
        patient alleles are tested only by transient mRNA injection.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Zebrafish uba2 function and the readouts used (gross head, eye, tail and
        swim bladder morphology) may not reflect how human SAE2 variants act in
        human development.
    readouts:
    - name: Rescue of uba2-null phenotype by human missense UBA2 mRNA
      target: UBA2 Loss of Function
      direction: DECREASED
      interpretation: >-
        Patient missense mRNAs rescue the null phenotype less than wild-type
        mRNA, the signature of loss-of-function alleles.
      evidence:
      - reference: PMID:34040189
        reference_title: "UBA2 variants underlie a recognizable syndrome with variable aplasia cutis congenita and ectrodactyly."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "uba2-mRNAs with human missense variants failed to rescue nullizygous zebrafish phenotypes."
        explanation: The measured outcome of the rescue assay.
  - target: Disrupted Distal Limb Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      uba2 is expressed in the developing pectoral fins and the null fish have
      abnormal fins, the fish counterpart of the limb defect.
    limitations: >-
      Fins are not autopods, so the fin defect does not show a split hand or
      foot; it shows only that uba2 is needed for appendage development, and in
      a homozygous null rather than at patient dosage.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The zebrafish pectoral fin lacks the digit rays of the tetrapod autopod,
        so central ray deficiency cannot be modelled directly.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Biallelic null rather than heterozygous loss of function.
    readouts:
    - name: Fin morphology
      target: Disrupted Distal Limb Morphogenesis
      direction: ALTERED
      interpretation: Abnormal fins in the null fish.
      evidence:
      - reference: PMID:34040189
        reference_title: "UBA2 variants underlie a recognizable syndrome with variable aplasia cutis congenita and ectrodactyly."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "uba2-null fish showed deficient growth, microcephaly, microphthalmia, mandibular hypoplasia, and abnormal fins."
        explanation: Reports the fin phenotype of the null fish.
  evidence:
  - reference: PMID:34040189
    reference_title: "UBA2 variants underlie a recognizable syndrome with variable aplasia cutis congenita and ectrodactyly."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "uba2 was expressed in zebrafish eye, brain, and pectoral fins; uba2-null fish showed deficient growth, microcephaly, microphthalmia, mandibular hypoplasia, and abnormal fins."
    explanation: Expression and null phenotype overlap the affected human tissues.
- name: TAK-981 prenatally exposed mouse
  species: Mouse
  genotype: Wild type; transient pharmacological SUMO E1 inhibition in utero
  publication: PMID:39985830
  description: >-
    Pregnant mice given the selective SUMO E1 inhibitor TAK-981 during the
    early post-implantation stage. A high dose is embryonic lethal; lower
    doses give viable offspring with craniofacial deformities, hydrocephalus,
    syndactyly and an aplasia cutis-like skin defect, and the treated embryos
    show repressed neural crest differentiation genes. No genetic Uba2
    heterozygous mouse phenotype has been reported.
  modeled_mechanisms:
  - target: Reduced Protein SUMOylation
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Lowers SUMOylation directly with an E1 inhibitor and records the
      developmental consequences.
    limitations: >-
      The inhibitor blocks the whole SUMO E1 enzyme for a short embryonic
      window, whereas patients carry a lifelong heterozygous UBA2 variant;
      the size of the SUMOylation reduction in the embryos is not reported in
      the abstract, and the drug may have effects beyond SUMO E1.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The genetic lesion is absent: SUMOylation is lowered by a drug acting
        on the SAE1-UBA2 enzyme, not by a Uba2 variant, so dosage and any
        allele-specific effect are not represented.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        A transient exposure during early post-implantation development stands
        for a constitutive reduction present throughout development and life.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse embryogenesis; the human disease is not studied in this model.
  - target: Impaired Neural Crest Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Embryo transcriptomics show repression of neural crest differentiation
      genes after SUMOylation inhibition; this is the evidence behind the
      neural crest hypothesis.
    limitations: >-
      The readout is gene expression in drug-treated embryos; differentiation
      of neural crest cells themselves was not shown in the abstract, and no
      human UBA2 carrier tissue has been examined.
    divergences:
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        Transcript levels (molecular) are used to infer a defect in neural
        crest cell differentiation (cellular).
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Pharmacological whole-pathway inhibition rather than a Uba2 variant.
    readouts:
    - name: Neural crest differentiation gene expression
      target: Impaired Neural Crest Differentiation
      direction: DECREASED
      interpretation: Repression of neural crest differentiation genes in treated embryos.
      evidence:
      - reference: PMID:39985830
        reference_title: "Transient pharmacological inhibition of SUMOylation during pregnancy induces craniofacial malformations in offspring mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Transcriptomic analysis revealed the repression of genes involved in neural crest differentiation in the TAK981-treated embryos"
        explanation: The transcriptomic measurement behind this link.
  - target: Disrupted Distal Limb Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Offspring of treated dams have syndactyly, a digit malformation seen in
      ACCES syndrome.
    limitations: >-
      Syndactyly, not split hand or foot, is reported, so the model reproduces
      part of the digital spectrum but not ectrodactyly.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Pharmacological whole-pathway inhibition rather than a Uba2 variant.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse limb development; central ray deficiency was not reported.
    readouts:
    - name: Syndactyly in exposed offspring
      target: Disrupted Distal Limb Morphogenesis
      direction: INCREASED
      interpretation: Digit fusion appears in offspring of treated dams.
      evidence:
      - reference: PMID:39985830
        reference_title: "Transient pharmacological inhibition of SUMOylation during pregnancy induces craniofacial malformations in offspring mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lower-concentration injections resulted in viable mice with craniofacial deformities often accompanied by hydrocephalus, syndactyly and an aplasia cutis-like phenotype."
        explanation: Reports syndactyly in exposed offspring.
  evidence:
  - reference: PMID:39985830
    reference_title: "Transient pharmacological inhibition of SUMOylation during pregnancy induces craniofacial malformations in offspring mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In conclusion, the SUMO inhibitor TAK981 has teratogenic effects, disrupting normal fetal development and causing congenital disabilities reminiscent of traits observed in UBA2-related syndrome."
    explanation: The authors relate the exposed offspring to the UBA2-related syndrome.

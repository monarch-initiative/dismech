    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UBA2-phenotypes included ACC, ectrodactyly, neurodevelopmental abnormalities, ectodermal, skeletal, craniofacial, cardiac, renal, and genital anomalies."
    explanation: Aplasia cutis congenita is part of the UBA2 phenotype in a 16-person cohort.
  - reference: PMID:28110515
    reference_title: "Missense variant in UBA2 associated with aplasia cutis congenita, duane anomaly, hip dysplasia and other anomalies: A possible new disorder involving the SUMOylation pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with aplasia cutis congenita, Duane anomaly, hip dysplasia, and other anomalies who had a de novo missense variant in UBA2, which encodes for a protein involved in the SUMOylation pathway."
    explanation: First reported intragenic UBA2 patient had aplasia cutis congenita.
  - reference: PMID:42180706
    reference_title: "Case Report: A new UBA2 variant in a Chinese family with aplasia cutis congenita."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a Chinese family with isolated ACC involving a 6-month-old male proband and his mother, both harboring a novel heterozygous missense variant in the UBA2 gene"
    explanation: Aplasia cutis congenita can be the only manifestation.
- name: Ectrodactyly
  category: Skeletal
  description: >-
    Split hand and/or split foot with a central cleft and absent or malformed
    central rays, unilateral or affecting up to all four limbs. It can occur
    without aplasia cutis congenita, including as isolated split-hand/foot
    malformation. The 2021 cohort study (PMID:34040189, full text) reports
    ectrodactyly in 37% of affected individuals, with subtler digital
    anomalies (clinodactyly, syndactyly, camptodactyly) more common.
  phenotype_term:
    preferred_term: Split hand/foot malformation

    snippet: "Interstitial 19q13.11 deletions are associated with ectrodactyly, which has recently been linked to loss-of-function of the UBA2 gene."
    explanation: Links the deletion phenotype and intragenic variants through UBA2 loss of function.
  downstream:
  - target: Reduced Protein SUMOylation
    description: >-
      Less SAE2 activity is expected to reduce activation of SUMO and its
      transfer to substrates. A reduction in global SUMOylation has not been
      measured in patient cells in the cited sources.
    evidence:
    - reference: PMID:28110515
      reference_title: "Missense variant in UBA2 associated with aplasia cutis congenita, duane anomaly, hip dysplasia and other anomalies: A possible new disorder involving the SUMOylation pathway."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that disturbance of the SUMOylation pathway, mediated by pathogenic variants in UBA2, is a novel mechanism for aplasia cutis congenita and other phenotypic abnormalities."
      explanation: Proposes that UBA2 variants act by disturbing the SUMOylation pathway.
- name: Reduced Protein SUMOylation
  description: >-
    The UBA2-SAE1 heterodimer is the only E1 enzyme for SUMO, so reduced UBA2
    activity is expected to lower SUMO conjugation of developmental
    transcription factors and chromatin regulators. Complete loss of
    SUMOylation is embryonic lethal; the partial reduction from a single
    affected allele is compatible with life but disturbs the development of
    the scalp skin, the distal limbs and other tissues.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein sumoylation
    term:
      id: GO:0016925
      label: protein sumoylation
    modifier: DECREASED

- name: Impaired Neural Crest Differentiation
  description: >-
    In mouse embryos exposed to a SUMO E1 inhibitor, genes driving neural
    crest differentiation are repressed, and the offspring have craniofacial
    deformities. Neural crest cells form much of the facial skeleton, so this
    step is proposed to link reduced SUMOylation to the facial features of
    ACCES syndrome. It has not been shown in human UBA2 carriers.

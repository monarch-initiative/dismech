- name: Disrupted Distal Limb Morphogenesis
  description: >-
    Uba2 is strongly expressed in the developing mouse limb bud and uba2 in
    zebrafish pectoral fins. Reduced UBA2 activity disturbs formation of the
    central rays of the hands and feet, giving split hand or split foot,
    syndactyly and other digit anomalies. The patterning step that UBA2
    affects (for example maintenance of the central apical ectodermal ridge)
    has not been identified.
  biological_scale: TISSUE

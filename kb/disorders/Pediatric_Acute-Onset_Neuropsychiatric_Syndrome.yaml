differential_diagnoses:
- name: Sydenham chorea
  description: >-
    The post-streptococcal movement disorder with which PANDAS, and therefore
    the streptococcal end of the PANS spectrum, shares an anti-basal-ganglia
    antibody mechanism.
  disease_term:
    preferred_term: Sydenham chorea
    term:
      id: MONDO:0017648
      label: Sydenham chorea
  distinguishing_features:
  - >-
    Sydenham chorea is defined by chorea as its motor presentation and is a
    major criterion of acute rheumatic fever; PANS is defined by abrupt
    obsessive-compulsive symptoms or restricted eating without requiring chorea
    or rheumatic fever.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptoms are not better explained by a known neurologic or medical disorder, such as Sydenham chorea, systemic lupus erythematosus, Tourette syndrome, or others.
    explanation: >-
      Consensus exclusion criterion explicitly requiring Sydenham chorea to be
      excluded before diagnosing PANS.
- name: Tourette Syndrome
  description: >-
    A primary chronic tic disorder of childhood.
  disease_term:
    preferred_term: Tourette syndrome
    term:
      id: MONDO:0007661
      label: Tourette syndrome
  distinguishing_features:
  - >-
    Tourette syndrome has a gradual onset and a chronic waxing-and-waning course
    from early childhood; PANS requires an abrupt, dramatic onset and is not a
    tic disorder by definition.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Symptoms are not better explained by a known neurologic or medical disorder, such as Sydenham chorea, systemic lupus erythematosus, Tourette syndrome, or others.
    explanation: >-
      Consensus exclusion criterion explicitly requiring Tourette syndrome to be
      distinguished from PANS.
- name: Obsessive-Compulsive Disorder
  description: >-
    Primary childhood obsessive-compulsive disorder without an acute onset or an
    identified infectious or immune trigger.
  disease_term:
    preferred_term: obsessive-compulsive disorder
    term:
      id: MONDO:0008114
      label: obsessive-compulsive disorder
  distinguishing_features:
  - >-
    Primary OCD typically has an insidious onset and lacks the concurrent
    neuropsychiatric and somatic signs that the PANS criteria require alongside
    the obsessive-compulsive presentation.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PANS symptoms overlap with a variety of psychiatric disorders, such as OCD, Tourette's syndrome, ADHD, depression, and bipolar disorder.
    explanation: >-
      Documents symptom overlap between PANS and primary pediatric OCD.
- name: Autoimmune encephalitis
  description: >-
    Antibody-mediated or inflammatory encephalitis of childhood presenting with
    subacute neuropsychiatric symptoms, seizures, focal neurologic signs, CSF
    pleocytosis, or MRI encephalitis changes.
  disease_term:
    preferred_term: autoimmune encephalitis
    term:
      id: MONDO:0020640
      label: autoimmune encephalitis
  distinguishing_features:
  - >-
    Autoimmune encephalitis typically features working-memory deficits, altered
    mental status, seizures, focal CNS signs, CSF pleocytosis, or MRI
    abnormalities requiring lumbar puncture and antineuronal antibody testing.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnostic criteria for possible autoimmune encephalitis include a subacute onset of working memory deficits, altered mental status or psychiatric symptoms associated at least to one of the following: (1) new focal CNS findings, (2) seizures not explained by a previously known seizure disorder, (3) CSF pleocytosis, and (4) MRI features suggestive of encephalitis.
    explanation: >-
      Distinguishes pediatric autoimmune encephalitis from PANS during
      neurodiagnostic evaluation.
discussions:
- discussion_id: pans_no_confirmatory_biomarker
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Clinical diagnostic criteria
  prompt: >-
    Is there any laboratory or imaging measurement that confirms PANS, rather
    than only excluding alternatives?
  rationale: >-
    PANS is defined entirely by clinical phenotype and time course. The entry's
    own pathophysiology nodes propose a post-infectious immune-mediated basal
    ganglia process, but the sequencing study cited here says in as many words
    that direct evidence of autoimmunity is often lacking, and no cited source
    offers a confirmatory test. Until one exists, every mechanistic node in this
    entry rests on a diagnosis that cannot be independently verified, which
    bounds what the entry can claim.
  evidence:
  - reference: PMID:37251418
    reference_title: "Pediatric Acute-Onset Neuropsychiatric Syndrome: Current Perspectives"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although several biomarkers (particularly those related to the post-infectious and auto-immune mechanism response) are regularly used in PANS diagnostic process, more information is needed about their correlation with specific clinical features and with PANS symptoms severity.
    explanation: >-
      A review of the PANS biomarker literature concluding that the markers in
      diagnostic use are not yet correlated with clinical features or severity,
      which is the gap this discussion records.
  - reference: PMID:30996598
    reference_title: "PANDAS/PANS in childhood: Controversies and evidence"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Notably, however, to date, biological studies have failed to show children satisfying PANDAS/PANS criteria to have a clear immune basis.
    explanation: >-
      States that biological studies have not shown a clear immune basis in
      children meeting the criteria, which is what leaves the mechanistic nodes
      in this entry resting on a clinically defined diagnosis. Chosen over the
      same paper's "definitive proof of the autoimmune hypothesis of PANDAS is
      lacking" because that sentence is scoped to PANDAS while this gap is on
      the PANS entry; this one is scoped to PANDAS/PANS criteria together.
notes: >-
  Four things about this entry are deliberate.

  First, **the restricted-eating phenotype is bound to `HP:0020302` Restrictive
  eating, not `HP:0002039` Anorexia.** The reasoning is on the phenotype itself:
  HPO defines Anorexia as loss of appetite, and this entry's own description says
  the restriction is intentional and fear-driven.

  Second, **eleven candidate genes are typed `SUSCEPTIBILITY`, not `CAUSATIVE`.**
  They come from a single exome/genome study, were found in 21 of 396 cases, and
  more than half of those cases already carried a neurodevelopmental diagnosis.
  The source calls them candidates; so does this entry.

  Third, **the somatic criterion-G signs (`Sleep disturbance`, `Enuresis`, and
  `Urinary frequency`) are deliberately unwired** and say so in their own
  `notes`: the consensus lists them as supporting somatic signs, and nothing
  cited here connects them directly to the basal ganglia process the
  neuropsychiatric and motor phenotypes hang off.

  Fourth, **the "Broadened diagnostic construct beyond streptococcus" node is a
  nosological statement kept inside `pathophysiology` on purpose**, with the
  reasoning recorded on the node. It is the boundary that separates this entry
  from the PANDAS one.

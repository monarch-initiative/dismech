diagnosis:
- name: Clinical diagnostic criteria
  presence: >-
    PANS is a clinical diagnosis requiring abrupt, dramatic onset of OCD or
    severely restricted food intake plus at least two concurrent
    neuropsychiatric symptoms, with symptoms not better explained by a known
    neurologic or medical disorder.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:25325534
    reference_title: "Clinical evaluation of youth with pediatric acute-onset neuropsychiatric syndrome (PANS): recommendations from the 2013 PANS Consensus Conference."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Presented here is a consensus statement proposing recommendations for the
      diagnostic evaluation of youth presenting with PANS.
    explanation: >-
      The 2013 PANS Consensus Conference statement provides the clinical
      diagnostic-evaluation framework for PANS.
- name: Infectious trigger microbiological and serologic workup
  presence: >-
    Microbiological and serologic testing for group A streptococcus, Mycoplasma
    pneumoniae, influenza, Epstein-Barr virus, and Borrelia burgdorferi is used
    to identify treatable infectious precipitants, though no infectious test is
    diagnostic of PANS itself.
  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  notes: >-
    Bound to NCIT:C25294 (Laboratory Procedure) rather than the narrower
    NCIT:C25300 (Microbial Culture Procedure) because the infectious-trigger
    evaluation combines throat/nasopharyngeal culture, molecular viral/bacterial
    assays, and serologic testing for atypical bacteria and Borrelia.
  evidence:
  - reference: PMID:34778136
    reference_title: "Diagnostic Approach to Pediatric Autoimmune Neuropsychiatric Disorders Associated With Streptococcal Infections (PANDAS): A Narrative Review of Literature Data"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycoplasma pneumoniae, viruses including influenza and Epstein–Barr virus, and Borrelia burgdorferi (Lyme disease) have also been reported as a potential infectious trigger and should be included in the infectious agent's evaluation for PANS
    explanation: >-
      Supports infectious-agent workup for bacterial and viral precipitants
      during the diagnostic evaluation of suspected PANS.
treatments:
- name: Anti-infective Treatment of the Identified Trigger
  description: >-
    Where an infectious trigger is identified, treating it is the first
    therapeutic priority. For group A streptococcus the consensus names an
    initial 6-10 day course of amoxicillin, penicillin, or a cephalosporin where
    allergy is documented.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: amoxicillin
      term:
        id: CHEBI:2676
        label: amoxicillin
  target_mechanisms:
  - target: Post-infectious / immune-mediated basal ganglia neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Eradicating an active bacterial precipitant removes the ongoing antigenic
      stimulus thought to sustain post-infectious immune activation.
    evidence:
    - reference: PMID:39512340
      reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Neuropsychiatric symptoms (especially the obsessive-compulsive ones) improve rapidly with an effective antibiotic treatment in eradicating the infection.
      explanation: >-
        Links eradication of the infectious trigger to resolution of the
        post-infectious neuropsychiatric flare, indirectly supporting inhibition
        of the hypothesized post-infectious neuroinflammatory process.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Concerning GAS infections, an initial course with an effective treatment on GAS (amoxicillin, penicillin, cephalosporin in case of documented allergic reactions) for 6-10 days is recommended
    explanation: >-
      The consensus antibiotic regimen for the streptococcal trigger, which is
      the agent this record binds.
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neuropsychiatric symptoms (especially the obsessive-compulsive ones) improve rapidly with an effective antibiotic treatment in eradicating the infection.
    explanation: >-
      States the claimed neuropsychiatric effect of eradicating the infection.
  notes: >-
    The quote names amoxicillin, penicillin and cephalosporins; only amoxicillin
    is bound as a `therapeutic_agent` because the slot takes specific agents and
    "cephalosporin" is a class the consensus offers as an allergy alternative
    rather than a named drug. The consensus is explicit that the antibiotic
    evidence base is small and not conclusive, and long-term antibiotic
    prophylaxis without active infection lacks conclusive supporting evidence in
    PANS.
- name: Nonsteroidal Anti-inflammatory Drug Therapy
  description: >-
    Oral nonsteroidal anti-inflammatory drugs (naproxen, ibuprofen, sulindac,
    or celecoxib) are used to shorten acute PANS neuropsychiatric flares and as
    maintenance anti-inflammatory therapy in observational cohorts, although
    randomized placebo-controlled trial evidence is still lacking.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naproxen
      term:
        id: CHEBI:7476
        label: naproxen
    - preferred_term: ibuprofen
      term:
        id: CHEBI:5855
        label: ibuprofen
    - preferred_term: sulindac
      term:
        id: CHEBI:9352
        label: sulindac
    - preferred_term: celecoxib
      term:
        id: CHEBI:41423
        label: celecoxib
  target_mechanisms:
  - target: Post-infectious / immune-mediated basal ganglia neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Cyclooxygenase inhibition dampens systemic and neurovascular prostaglandin
      signaling hypothesized to sustain acute PANS flares.
    evidence:
    - reference: PMID:39512340
      reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        The drugs which were used in the study included Naproxen, Ibuprofen, Sulindac and Celecoxib. The study found out that the use of NSAIDS was associated to a signi ﬁcantly shortened duration of ﬂares, also when the NSAIDS were used as prophylactic agents in maintenance therapy.
      explanation: >-
        Observational shortening of acute flares with NSAIDs indirectly supports
        anti-inflammatory attenuation of the hypothesized neuroinflammatory
        flare mechanism.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The drugs which were used in the study included Naproxen, Ibuprofen, Sulindac and Celecoxib. The study found out that the use of NSAIDS was associated to a signi ﬁcantly shortened duration of ﬂares, also when the NSAIDS were used as prophylactic agents in maintenance therapy.
    explanation: >-

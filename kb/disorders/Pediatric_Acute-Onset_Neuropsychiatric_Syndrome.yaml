pathophysiology:
- name: Post-infectious / immune-mediated basal ganglia neuroinflammation
  description: >-
    PANS is hypothesized to arise when an infectious or immune trigger provokes a
    dysregulated immune response that, via molecular mimicry and/or
    neuroinflammation, targets the basal ganglia, thalamus, and amygdala,
    disrupting cortico-striato-thalamo-cortical circuits and producing
    acute-onset obsessive-compulsive and neuropsychiatric symptoms. Unlike
    PANDAS, PANS does not require a demonstrated streptococcal trigger and may
    follow other infections (e.g., Mycoplasma, viral) or non-infectious immune
    activation.
  biological_scale: TISSUE
  locations:
  - preferred_term: basal ganglion
    term:
      id: UBERON:0002420
      label: basal ganglion
  - preferred_term: dorsal plus ventral thalamus
    term:
      id: UBERON:0001897
      label: dorsal plus ventral thalamus
  - preferred_term: amygdala
    term:
      id: UBERON:0001876
      label: amygdala
  biological_processes:

      Consequently, we conducted whole exome sequencing (WES) on a U.S. cohort of 386 cases, and whole genome sequencing (WGS) on ten cases from the European Union who were selected because of severe PANS.
    explanation: >-
      The cohorts the 21 variant-carrying cases are drawn from, so the
      denominator behind this candidate list is quotable rather than derived.
  - reference: PMID:35773312
    reference_title: "Identification of ultra-rare genetic variants in pediatric acute onset neuropsychiatric syndrome (PANS) by exome and whole genome sequencing"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These genes converge into two broad functional categories. One regulates peripheral immune responses and microglia (PPM1D, CHK2, NLRC4, RAG1, PLCG2). The other is expressed primarily at neuronal synapses (SHANK3, SYNGAP1, GRIN2A, GABRG2, CACNA1B, SGCE).
    explanation: >-
      The two functional categories the eleven genes partition into.
  - reference: PMID:35773312
    reference_title: "Identification of ultra-rare genetic variants in pediatric acute onset neuropsychiatric syndrome (PANS) by exome and whole genome sequencing"

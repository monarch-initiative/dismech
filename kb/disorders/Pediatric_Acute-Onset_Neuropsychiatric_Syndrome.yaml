  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Similarly to their previous study, the authors concluded that randomized placebo-controlled trials are needed to strengthen their recommendations ( 87).
    explanation: >-
      Records the explicit consensus caveat that randomized placebo-controlled
      trials of NSAIDs in PANS are still lacking.
  - reference: PMID:37251418
    reference_title: "Pediatric Acute-Onset Neuropsychiatric Syndrome: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nevertheless, the whole set of steroids (Prednisone, Dexamethasone and Methylprednisolone) and of NSAIDs (Ibuprofen, Naproxen, Sulindac, and Celecoxib) received the largest amount of studies (see Table 3).
    explanation: >-
      Confirms ibuprofen, naproxen, sulindac, and celecoxib as the principal
      NSAIDs evaluated in PANS clinical management literature.
- name: Corticosteroid and Immunomodulatory Therapy
  description: >-
    Immunomodulatory treatment is reserved for severe or selected cases. The
    consensus reports good responses to corticosteroids in some
    virus-triggered presentations while stating that the literature is thin and
    that routine use cannot be recommended.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Systemic Corticosteroid Therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Post-infectious / immune-mediated basal ganglia neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Systemic corticosteroids suppress neuroinflammatory and immune-mediated
      signaling in severe flares.
    evidence:
    - reference: PMID:39512340
      reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        In the case of PANS triggered by viral infections, some patients showed a good response to antivirals and to corticosteroid therapy, but there is little evidence in literature.
      explanation: >-
        Clinical response to corticosteroids in selected post-infectious flares
        indirectly supports suppression of the hypothesized neuroinflammatory
        process while noting limited published evidence.

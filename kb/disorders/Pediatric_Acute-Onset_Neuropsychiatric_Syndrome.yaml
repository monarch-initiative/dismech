name: Pediatric Acute-onset Neuropsychiatric Syndrome
creation_date: "2026-07-25T00:00:00Z"
category: Autoimmune
description: >-
  Pediatric acute-onset neuropsychiatric syndrome (PANS) is a clinically defined
  neuropsychiatric condition of childhood characterized by the abrupt, dramatic
  onset of obsessive-compulsive disorder or severely restricted food intake,
  accompanied by at least two concurrent neuropsychiatric symptoms such as
  anxiety, emotional lability or depression, irritability/aggression, behavioral
  regression, deterioration in school performance, sensory or motor
  abnormalities, and somatic signs including sleep disturbance or enuresis. PANS
  is defined by its clinical phenotype and time course rather than by a single
  trigger: it is proposed to reflect a post-infectious and/or immune-mediated
  neuroinflammatory process affecting the basal ganglia, of which streptococcal
  infection (PANDAS) is one well-studied precipitant. The concept was introduced
  in 2012 to broaden the earlier PANDAS criteria beyond group A streptococcus to
  encompass other infectious, immune, and metabolic triggers. It remains a
  clinically defined and debated entity without a validated confirmatory
  biomarker.
disease_term:
  preferred_term: pediatric acute-onset neuropsychiatric syndrome
  term:
    id: MONDO:1060178
    label: pediatric acute-onset neuropsychiatric syndrome
parents:
- Autoimmune Disease
- Mental Health Disorder
pathophysiology:
- name: Post-infectious / immune-mediated basal ganglia neuroinflammation
  description: >-
    PANS is hypothesized to arise when an infectious or immune trigger provokes a
    dysregulated immune response that, via molecular mimicry and/or
    neuroinflammation, targets the basal ganglia, disrupting
    cortico-striato-thalamo-cortical circuits and producing acute-onset
    obsessive-compulsive and neuropsychiatric symptoms. Unlike PANDAS, PANS does
    not require a demonstrated streptococcal trigger and may follow other
    infections (e.g., Mycoplasma, viral) or non-infectious immune activation.
  downstream:
  - target: Acute-onset obsessive-compulsive and neuropsychiatric symptoms
    description: >-
      Basal ganglia dysfunction is modeled upstream of the abrupt OCD, food
      restriction, and comorbid neuropsychiatric manifestations that define the
      syndrome.
  evidence:
  - reference: PMID:35773312
    reference_title: "Identification of ultra-rare genetic variants in pediatric acute onset neuropsychiatric syndrome (PANS) by exome and whole genome sequencing"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symptom onset is often temporally associated with infections, suggesting
      an underlying autoimmune/autoinflammatory etiology, although direct
      evidence is often lacking.
    explanation: >-
      Supports the post-infectious/immune-mediated framing while noting that
      direct proof of autoimmunity is frequently lacking.
- name: Broadened diagnostic construct beyond streptococcus
  description: >-
    PANS was defined to capture children with an abrupt-onset PANDAS-like
    presentation in whom a streptococcal trigger cannot be established,
    reframing the condition around its acute neuropsychiatric phenotype and
    time course rather than a specific pathogen. PANDAS is the subset in which
    group A streptococcal infection is the identified precipitant.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike PANDAS, PANS is not strictly linked to group A streptococcal
      infections but can be triggered by various infectious or environmental
      factors.
    explanation: >-
      The 2024 Delphi consensus states that PANS, unlike PANDAS, is not
      restricted to streptococcal triggers, supporting the broadened construct.
- name: Candidate susceptibility genes converging on immune and synaptic pathways
  description: >-
    PANS has no established causal gene. A 2022 exome/genome sequencing study of
    a US cohort (386 cases) plus 10 severe European cases identified de novo or
    ultra-rare candidate variants in 11 genes (PPM1D, SGCE, PLCG2, NLRC4,
    CACNA1B, SHANK3, CHEK2, GRIN2A, RAG1, GABRG2, SYNGAP1) in 21 cases,
    partitioning into peripheral-immune/microglial and neuronal/synaptic
    functional categories. These are hypothesis-generating susceptibility
    candidates rather than diagnostic markers, and many cases arose on a
    pre-existing neurodevelopmental disorder.
  evidence:
  - reference: PMID:35773312
    reference_title: "Identification of ultra-rare genetic variants in pediatric acute onset neuropsychiatric syndrome (PANS) by exome and whole genome sequencing"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic variation in PANS candidate genes may function by disrupting
      peripheral and central immune functions, neurotransmission, and/or the
      blood-CSF/brain barriers following stressors such as infection
    explanation: >-
      Supports the candidate-gene convergence on immune and synaptic/barrier
      functions as a susceptibility mechanism.
phenotypes:
- name: Acute-onset obsessive-compulsive behavior
  description: >-
    Abrupt, dramatic onset of obsessions and compulsions is one of the two
    cardinal presenting features of PANS.
  phenotype_term:
    preferred_term: Compulsive behaviors
    term:
      id: HP:0000722
      label: Compulsive behaviors
  evidence:
  - reference: PMID:35773312
    reference_title: "Identification of ultra-rare genetic variants in pediatric acute onset neuropsychiatric syndrome (PANS) by exome and whole genome sequencing"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      tics, anxiety, mood swings, irritability, and restricted eating is
      described in children with Pediatric Acute-Onset Neuropsychiatric Syndrome
      (PANS)
    explanation: >-
      Describes the abrupt-onset obsessive-compulsive and neuropsychiatric
      symptom cluster characteristic of PANS.
- name: Restricted food intake
  description: >-
    Severely restricted food intake is an alternative cardinal presenting
    feature of PANS, sometimes driven by contamination fears, sensory changes,
    or fear of choking rather than body-image concerns.
  phenotype_term:
    preferred_term: Anorexia
    term:
      id: HP:0002039
      label: Anorexia
- name: Anxiety
  description: >-
    Acute, often severe anxiety (including separation anxiety) is a common
    concurrent neuropsychiatric symptom.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
- name: Emotional lability
  description: >-
    Rapid mood swings and emotional lability or depression are frequent
    concurrent symptoms.
  phenotype_term:
    preferred_term: Emotional lability
    term:
      id: HP:0000712
      label: Emotional lability
- name: Enuresis
  description: >-
    Urinary frequency or new-onset enuresis is among the somatic signs
    supporting the diagnosis.
  phenotype_term:
    preferred_term: Enuresis
    term:
      id: HP:0000805
      label: Enuresis
diagnosis:
- name: Clinical diagnostic criteria
  presence: >-
    PANS is a clinical diagnosis requiring abrupt, dramatic onset of OCD or
    severely restricted food intake plus at least two concurrent
    neuropsychiatric symptoms, with symptoms not better explained by a known
    neurologic or medical disorder.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C15220
      label: Diagnosis Assessment
  evidence:
  - reference: PMID:25325534
    reference_title: "Clinical evaluation of youth with pediatric acute-onset neuropsychiatric syndrome (PANS): recommendations from the 2013 PANS Consensus Conference."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Presented here is a consensus statement proposing recommendations for the
      diagnostic evaluation of youth presenting with PANS.
    explanation: >-
      The 2013 PANS Consensus Conference statement provides the clinical
      diagnostic-evaluation framework for PANS.

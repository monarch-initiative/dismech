- name: Intravenous Immunoglobulin
  description: >-
    IVIG is positioned as a later-line immunomodulatory option, restricted to
    severely affected children in whom steroid therapy has failed or is not
    feasible.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Post-infectious / immune-mediated basal ganglia neuroinflammation
    treatment_effect: MODULATES
    description: >-
      Pooled intravenous immunoglobulin modulates humoral and inflammatory
      immune responses in severely affected, steroid-refractory cases.
    evidence:
    - reference: PMID:39512340
      reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Their indications for the use of IVIG in PANS patients state that this treatment should only be implied in children who are severely affected and if there is no effect by steroid therapy or if this therapy is not feasible.
      explanation: >-
        Clinical restriction of IVIG to severe, steroid-refractory PANS
        indirectly supports immunomodulation of the hypothesized immune-mediated
        neuroinflammatory process.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Their indications for the use of IVIG in PANS patients state that this treatment should only be implied in children who are severely affected and if there is no effect by steroid therapy or if this therapy is not feasible.
    explanation: >-
      States the restriction of IVIG to severely affected, steroid-refractory
      children, which is what this record's description asserts.
  notes: >-
    `therapeutic_modality: OTHER` because polyclonal pooled immunoglobulin is
    none of the enum's named platforms - it is not a monoclonal antibody and not
    protein replacement for a missing gene product.
- name: Therapeutic Plasma Exchange
  description: >-
    Therapeutic plasma exchange (plasmapheresis) is a second-line apheresis
    intervention used in severe acute PANS/PANDAS exacerbations; while consensus
    reviewers note promising acute symptom improvement, randomized trial
    evidence remains controversial and Nordic guidance restricts plasma exchange
    to confirmed autoimmune encephalitis, alongside procedural vascular-access
    and sedation constraints in children.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Post-infectious / immune-mediated basal ganglia neuroinflammation
    treatment_effect: INHIBITS
    description: >-
      Extracorporeal plasma exchange removes putative circulating
      anti-neuronal autoantibodies and inflammatory mediators during severe
      acute flares.
    evidence:
    - reference: PMID:39512340
      reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Regarding plasma exchange, it offers a promising intervention for managing acute exacerbations in PANS and PANDAS, contributing to improved patient outcomes and quality of life.
      explanation: >-
        Reported clinical improvement during acute exacerbations indirectly
        supports apheresis-mediated removal of circulating humoral/inflammatory
        effectors driving PANS flares.
  evidence:
  - reference: PMID:39512340
    reference_title: "Pediatric acute-onset neuropsychiatric syndrome and pediatric autoimmune neuropsychiatric disorder associated with streptococcal infections: a delphi study and consensus document about definition, diagnostic criteria, treatment and follow-up"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Regarding plasma exchange, it offers a promising intervention for managing acute exacerbations in PANS and PANDAS, contributing to improved patient outcomes and quality of life.
    explanation: >-
      Consensus statement describing plasma exchange for acute exacerbations in
      severe PANS and PANDAS.
  - reference: PMID:37251418
    reference_title: "Pediatric Acute-Onset Neuropsychiatric Syndrome: Current Perspectives."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unfortunately, only a few RCTs in children with PANDAS have been conducted so far, which demonstrated IVIGs/plasma exchange and/or azithromycin to be only dubitatively more effective than placebo,65,90
    explanation: >-
      Records the explicit controversy and limited randomized trial efficacy
      surrounding IVIG and plasma exchange in PANS/PANDAS.
  notes: >-
    Rituximab and cytostatic agents (such as mycophenolate mofetil) are omitted
    as standalone routine PANS treatments because European Nordic guidance
    explicitly advises against their use outside probable or definite autoimmune
    encephalitis (PMID:37251418).

animal_models:
- name: Drosophila neural Prp19 knockdown
  species: Fruit fly
  genotype: elav-Gal4 driven Prp19 RNAi, with or without UAS-PRPF19 WT, Gly404Ser, Leu499Phe or His273Thrfs*37
  publication: PMID:37962958
  description: >-
    Pan-neural knockdown of the fly PRPF19 ortholog with two independent RNAi
    lines, and rescue by wild-type or patient-variant human PRPF19.
  modeled_mechanisms:
  - target: Reduced Neural Precursor Proliferation and Mushroom Body Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Knockdown reduces brain cell proliferation and mushroom body size and is
      lethal; patient missense variants rescue lethality and structure but not
      social behaviour.
    limitations: >-
      RNAi knockdown (77% reduction) models reduced dosage, which corresponds
      to the truncating allele but not directly to the heterozygous missense
      variants; the mushroom body has no direct human counterpart, and
      locomotor and social readouts are analogies to the human phenotypes.
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neural loss of function (LoF) of the Drosophila orthologs U2af50 and Prp19 led to lethality, abnormal mushroom body (MB) patterning, and social deficits, which were differentially rescued by wild-type and mutant U2AF2 or PRPF19."
      explanation: Summary of the fly model results.

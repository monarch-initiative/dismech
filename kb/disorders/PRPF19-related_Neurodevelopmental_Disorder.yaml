pathophysiology:
- name: Germline PRPF19 Variant Disrupting the Prp19 Complex Subunit
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    A heterozygous de novo PRPF19 variant alters PRPF19, the U-box E3 ubiquitin
    ligase that forms the core of the Prp19 (NTC) complex with CDC5L and BCAS2
    and assembles the other NTC-associated proteins through its C-terminal WD40
    domain. Missense variants cluster in the WD40 beta-propeller and are
    predicted from structural modelling to destabilize propeller folding; the
    frameshift p.(His273Thrfs*37) truncates the WD40 domain. The ubiquitin
    ligase activity is bound here as the protein's own molecular function; no
    study has measured the effect of a patient variant on it.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PRPF19
    term:
      id: hgnc:17896
      label: PRPF19
  molecular_functions:
  - preferred_term: U-box E3 ubiquitin ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  cellular_components:
  - preferred_term: Prp19 complex
    term:
      id: GO:0000974
      label: Prp19 complex
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "By GeneMatcher, we identified 5 more patients with heterozygous de novo PRPF19 variants"
    explanation: Establishes heterozygous de novo PRPF19 variants as the disease trigger.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in U2AF2 and RBFOX1 clustered predominantly in RNA recognition motifs, while a majority of PRPF19 variants were in the WD40 domain."
    explanation: Locates most disease variants in the WD40 domain.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "are expected to destabilize the beta-propeller folding and in turn impair association with NTC-associated proteins"
    explanation: >-
      Structural modelling predicts, without measurement, that the missense
      substitutions destabilize the WD40 propeller.
  - reference: PMID:15660529
    reference_title: "Interaction of U-box E3 ligase SNEV with PSMB4, the beta7 subunit of the 20 S proteasome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "SNEV has E3 ligase activity in vitro, when tested with Ubc3 (cdc34) as E2 enzyme, and that the ubiquitin transfer is dependent on the U-box"
    explanation: >-
      SNEV is a synonym of PRPF19; the sentence restates earlier biochemical
      work showing U-box-dependent E3 ubiquitin ligase activity.
  downstream:
  - target: Impaired Prp19 Complex Assembly
    description: >-
      Loss or destabilization of the WD40 domain prevents PRPF19 from
      assembling with its NTC partners.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "cells transfected with PRPF19His273Thrfs*37 showed a complete loss of binding with CDC5L"
      explanation: Shown for the frameshift allele only.
- name: Impaired Prp19 Complex Assembly
  description: >-
    The truncating PRPF19 allele cannot bind CDC5L and so cannot form the Prp19
    complex that drives spliceosome activation. For the missense alleles an
    assembly defect is predicted from modelling but was not demonstrated, and
    in the fly they largely replaced the endogenous protein.
  role: central_effector
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Prp19 complex
    term:
      id: GO:0000974
      label: Prp19 complex
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The frameshift variant truncated the WD40 domain, leading to a complete loss of hPrp19 complex formation with CDC5L, which highly suggested that its canonical splicing function may have been lost."
    explanation: Co-immunoprecipitation of the truncated protein in HEK293T cells.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The Prp19 complex, also known as NTC, has PRPF19 as one of the core subunits (i.e., PRPF19, CDC5L, and BCAS2) assembling the other Prp19 complex–associated proteins via C-terminal WD40 domains"
    explanation: >-
      Background on the complex the WD40 domain assembles, restating prior
      biochemical and structural work.
  downstream:
  - target: Altered Exon Usage in Neural Transcripts
    description: >-
      Reduced Prp19 complex function, modelled by knockdown of the fly
      ortholog, changes exon usage in a subset of neural transcripts.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Prp19 RNAi (77% knockdown efficiency) led to 1,090 diffUEs in 727 unique genes"
      explanation: >-
        Knockdown reduces dosage, which models the truncating allele rather
        than the missense alleles.
- name: Altered Exon Usage in Neural Transcripts
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    Pan-neural knockdown of Drosophila Prp19 changes exon usage in several
    hundred genes in larval brain, including increased inclusion of exons in
    Iswi, Brm, RpS19a and Rbfox1, rather than abolishing splicing. The
    evidence is from ortholog knockdown only; no splicing assay of a patient
    PRPF19 variant or of patient-derived cells has been reported, and restoring
    Iswi or Rbfox1 did not rescue the Prp19 knockdown brain phenotype, so the
    disease-relevant splicing targets are unknown. Knockdown models loss of
    function, while most patient variants are WD40 missense changes whose
    effect on PRPF19 dosage or activity is not known.
  role: central_effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Prp19 RNAi (77% knockdown efficiency) led to 1,090 diffUEs in 727 unique genes"
    explanation: Differential exon usage in fly larval brain after Prp19 knockdown.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "However, Iswi and Rbfox1 failed to rescue the mushroom defects in Prp19-knockdown flies"
    explanation: >-
      The candidate splicing effectors shared with U2AF2 do not explain the
      Prp19 phenotype, so its relevant targets remain unidentified.
  downstream:
  - target: Reduced Neural Precursor Proliferation and Mushroom Body Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "As expected, all pan-neural Prp19–knockdown flies died before eclosion (Supplemental Figure 5A) and resulted in a generalized reduction in brain cell proliferation"
      explanation: >-
        The same knockdown that alters exon usage reduces brain cell
        proliferation; which splicing changes cause it is not shown.
- name: Reduced Neural Precursor Proliferation and Mushroom Body Development
  description: >-
    Pan-neural knockdown of fly Prp19 reduces larval brain cell proliferation,
    shrinks both lobes of the mushroom body, causes larval hypoactivity and is
    lethal before eclosion. Wild-type human PRPF19 and the two tested missense
    variants rescue lethality and the mushroom body defect, with
    p.(Gly404Ser) rescuing proliferation less completely, while the truncated
    p.(His273Thrfs*37) protein rescues neither. Both missense variants fail
    to restore normal social spacing in adult flies.
  role: downstream_consequence
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Similar to the phenotype caused by U2af50 knockdown, both the vertical and horizontal lobes of the MB exhibited remarkable area reduction in Prp19 RNAi larvae"
    explanation: Mushroom body structural defect after neural knockdown.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "In the fly rescue study, the truncated form failed to reinstate normal MB patterning."
    explanation: The truncating allele behaves as a complete loss of function in vivo.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, compared with PRPF19WT and PPRF19Leu499Phe, which fully rescued the proliferation deficit, PRPF19Gly404Ser had reduced rescuing of larval brain proliferation"
    explanation: One missense variant is a partial loss-of-function allele for proliferation.
  downstream:
  - target: Motor Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We assessed the total crawling length, distance, and speed and found that RNAi larvae had overt hypoactivity"
      explanation: >-
        Larval locomotor deficit, tested because patients with missense
        variants have motor deficits; the correspondence is by analogy.
  - target: Autism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "This result indicated that, although the 2 PRPF19 missense variants drastically extended the lifespan of Prp19-knockdown flies, they did not completely rescue their social behaviors."
      explanation: >-
        Social-spacing deficit in flies expressing patient missense variants,
        the experimental counterpart of the autism diagnoses.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of U2af50 or Prp19 may lead to compromised MB function in neural processing and in the regulation of higher-order social behavior, mimicking the patients with impaired intellectual functions."
      explanation: Stated by the authors as a possibility.
- name: PRPF19 Whole-Gene Duplication
  description: >-
    A de novo 400 kb duplication spanning PRPF19 increases gene dosage. In the
    fly, overexpression of wild-type human PRPF19 increases brain cell
    proliferation, which the authors relate to the macrocephaly and tall
    stature of the individual carrying the duplication. The duplication spans
    other genes, so attribution of the phenotype to PRPF19 is not certain.
    This node is not declared conformant to the spliceosome module's variant
    node, which describes reduced dosage or altered sequence.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 400 kb duplication spanning PRPF19 (P3)"
    explanation: The duplication carrier in the cohort.
  downstream:
  - target: Increased Neural Precursor Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Of note, overexpression of PRPF19WT significantly increased cell proliferation"
      explanation: Overexpression in the fly brain models increased dosage.
- name: Increased Neural Precursor Proliferation
  description: >-
    Elevated proliferation of brain mitotic cells with increased PRPF19 dosage,
    shown in the fly overexpression model.
  role: downstream_consequence
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The whole gene duplication resulted in elevated proliferation in brain mitotic neurons, which correlated with an NDD phenotype with macrocephaly and tall stature in participant P3."
    explanation: >-
      The authors connect the fly overexpression result to the duplication
      carrier's phenotype.
  downstream:
  - target: Macrocephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The whole gene duplication resulted in elevated proliferation in brain mitotic neurons, which correlated with an NDD phenotype with macrocephaly and tall stature in participant P3."
      explanation: A correlation in one individual, linked to the fly result by the authors.

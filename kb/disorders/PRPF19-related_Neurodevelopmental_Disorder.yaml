  - pathophysiology#Altered Exon Usage in Neural Transcripts
  prompt: >-
    How do the PRPF19 WD40 missense variants cause disease, given that they
    largely rescue the fly knockdown, and do PRPF19's ubiquitin ligase and DNA
    damage response roles, rather than splicing alone, contribute to the
    phenotype?
  rationale: >-
    The disorder rests on six individuals from one report. Only the frameshift
    has a demonstrated molecular defect (loss of CDC5L binding); the missense
    variants are predicted to destabilize the WD40 propeller but were not
    tested for complex assembly, and in the fly they rescue lethality and brain
    structure while failing to restore social behaviour, which suggests a
    subtler or tissue-specific defect. All splicing evidence comes from
    ortholog knockdown, the shared U2AF2 effectors Iswi and Rbfox1 do not
    rescue the Prp19 phenotype, and no patient-derived cells have been
    profiled. PRPF19 also forms complexes in the DNA damage response,
    transcription elongation, mRNA export and protein degradation, and the
    authors leave their contribution open. The duplication carrier raises a
    separate dosage-gain question.
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "In addition to the essential role in splicing, PRPF19 could form different complexes that are implicated in the DNA damage response, transcription elongation, mRNA export, and protein degradation"
    explanation: The authors' own statement of the untested non-splicing roles.
  - reference: PMID:20595234
    reference_title: "The Prp19 complex and the Usp4Sart3 deubiquitinating enzyme control reversible ubiquitination at the spliceosome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "the spliceosomal Prp19 complex modifies Prp3, a component of the U4 snRNP, with nonproteolytic K63-linked ubiquitin chains"
    explanation: >-
      The ligase activity is itself used within the spliceosome, so a
      ubiquitination defect and a splicing defect need not be separable.

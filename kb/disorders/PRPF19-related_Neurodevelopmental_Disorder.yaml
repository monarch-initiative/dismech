genetic:
- name: PRPF19
  gene_term:
    preferred_term: PRPF19
    term:
      id: hgnc:17896
      label: PRPF19
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Pre-mRNA processing factor 19 (also known as SNEV or PSO4), a U-box E3
    ubiquitin ligase and core subunit of the Prp19/NTC complex. The defining
    series reports six individuals with de novo variants: missense
    p.(Gly404Ser), p.(Leu499Phe), p.(Arg422Cys) and p.(Arg128Gln), the
    frameshift p.(His273Thrfs*37), and a 400 kb duplication spanning the gene.
    The paper's results and discussion assign the frameshift to different
    participant labels (P6 and P4), so this entry does not tie variants to
    participant labels beyond what is quoted. PRPF19 is constrained against
    both loss-of-function (pLI = 1) and missense variation in gnomAD. Mouse
    knockout is early embryonic lethal. No ClinGen gene-disease validity
    record for PRPF19 is present in the local structured-source cache, so
    gene_disease_validity is left absent.
  evidence:
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We implicated pathogenic variants in U2AF2 and PRPF19, encoding spliceosome subunits in neurodevelopmental disorders (NDDs), by identifying 46 unrelated individuals with 23 de novo U2AF2 missense variants (including 7 recurrent variants in 30 individuals) and 6 individuals with de novo PRPF19 variants."
    explanation: Defining series for the gene-disease association.
  - reference: PMID:37962958
    reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "and missense (Z = 3.89) variants according to the gnomAD population database"
    explanation: >-
      Missense constraint in gnomAD; the same sentence reports loss-of-function
      intolerance (pLI = 1), which sits inside a bracketed span the validator
      strips.
  - reference: PMID:26663487
    reference_title: "SNEV(Prp19/PSO4) deficiency increases PUVA-induced senescence in mouse skin."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "SNEV-knockout results in early embryonic lethality"
    explanation: The gene is essential in the mouse.
  variants:
  - name: p.(Gly404Ser)
    description: >-
      c.1210G>A, a de novo missense variant in the WD40 beta-propeller. In the
      fly it rescues lethality and the mushroom body defect but only partly
      rescues brain proliferation and does not restore normal social spacing.
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 1 previously negative clinical exome, we identified a de novo variant, c.1210G>A, p.(Gly404Ser), in PRPF19"
      explanation: Index case.
  - name: p.(His273Thrfs*37)
    description: >-
      c.816delT, a frameshift truncating the WD40 domain, found in a fetus with
      multiple congenital malformations. It abolishes binding to CDC5L and
      fails to rescue the fly knockdown, behaving as a complete loss of
      function.
    evidence:
    - reference: PMID:37962958
      reference_title: "Spliceosome malfunction causes neurodevelopmental disorders with overlapping features."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "corroborating the fact that the variant c.816delT, p.(His273Thrfs*37) is indeed a complete LoF allele"
      explanation: Loss of function shown by failed rescue in the fly and loss of CDC5L binding.

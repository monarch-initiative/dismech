name: PRPF19-related neurodevelopmental disorder
creation_date: "2026-10-28T05:10:00Z"
category: Mendelian
description: >-
  PRPF19-related neurodevelopmental disorder is a spliceosomopathy caused by
  heterozygous de novo variants in PRPF19, which encodes the U-box E3 ubiquitin
  ligase that is a core subunit of the Prp19 (NineTeen, NTC) complex required
  for catalytic activation and stabilization of the spliceosome. The
  disorder was defined in a series of six individuals carrying missense
  variants (mostly in the C-terminal WD40 beta-propeller), a frameshift, or a
  400 kb duplication spanning the gene. Speech and language delay and motor
  delay were present in every individual old enough to assess, autism was
  diagnosed in four, and intellectual disability and hypotonia each occurred in
  three; the individual with the duplication had macrocephaly and tall
  stature, and the frameshift was found in a fetus with multiple congenital
  malformations. Functional data are limited: the frameshift abolishes binding
  to the NTC core partner CDC5L, and knockdown of the Drosophila ortholog
  reduces brain cell proliferation, disrupts mushroom body development, changes
  exon usage in several hundred genes and impairs social behaviour, which
  patient missense variants rescue only partly.

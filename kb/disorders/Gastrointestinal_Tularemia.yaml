name: Gastrointestinal Tularemia
creation_date: "2026-09-29T23:19:27Z"
description: >-
  Gastrointestinal tularemia is the enteric form of Francisella tularensis
  infection in which ingestion of contaminated food or water exposes the
  gastrointestinal tract to the intracellular bacterium and produces
  inflammatory disease of the alimentary tract and its draining lymph nodes.
category: Infectious Disease
disease_term:
  preferred_term: gastrointestinal tularemia
  term:
    id: MONDO:0001916
    label: gastrointestinal tularemia
parents:
- Tularemia
synonyms:
- Enteric tularemia
notes: >-
  No deep-research report for this entry is committed under research/, so every
  claim here rests on the cited references, each cached in references_cache/
  and quoted exactly. HP:0100776, HP:0004299, HP:0002846 and NCIT:C2814 leads
  considered while drafting were rejected as naming other concepts.

  Read the disease-specific evidence narrowly. PMID:24911857, which carries the
  Abdominal lymphadenopathy and Fever phenotypes and the enteric inflammation
  node, reports two paediatric cases of *oropharyngeal* tularemia in which
  abdominal lymphadenopathy was found, and concludes that oropharyngeal
  tularemia can cause lymphadenopathy in any part of the gastrointestinal
  tract. It is therefore evidence for gastrointestinal nodal involvement by the
  ingestion route, not a series of lower-GI primary cases. PMID:18810348 and
  PMID:31071480 are cited only for the shared ingestion route.

  The manifestations that would distinguish a lower-GI primary form -
  intestinal ulceration, abdominal pain, diarrhea, nausea and vomiting, GI
  bleeding - are deliberately absent: no reference cited in this entry states
  any of them, and none was curated from an uncited source. They remain the
  stated follow-up for this entry.

  HPO has no abdominal lymphadenopathy term. Searching HPO through OLS for
  "abdominal lymphadenopathy" returns nothing; "lymphadenopathy" returns the
  anatomically qualified siblings cervical (HP:0025289), axillary (HP:0034752),
  mediastinal (HP:0100721), hilar (HP:0034388), submandibular (HP:0033176),
  paratracheal (HP:0033280), supraclavicular (HP:0034750), inguinal
  (HP:0034751) and preauricular (HP:6001188), none of them abdominal.
  "mesenteric lymph node enlargement" returns HP:0025043 Enlarged mesenteric
  lymph node, which is narrower than the source states - PMID:24911857 says
  abdominal, never mesenteric - so binding it would assert a nodal distribution
  the source does not. HP:0002716 Lymphadenopathy with located_in the abdominal
  cavity is bound instead.
infectious_agent:
- name: Francisella tularensis
  infectious_agent_term:
    preferred_term: Francisella tularensis
    term:
      id: NCBITaxon:263
      label: Francisella tularensis
  description: >-
    Intracellular Gram-negative coccobacillus that causes tularemia, including
    enteric disease after ingestion of contaminated food or water.
  evidence:
  - reference: PMID:19835784
    reference_title: >-
      Effect of dehydrated storage on the survival of Francisella tularensis in
      infant formula.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Francisella tularensis is a Gram-negative bacterium that can cause
      gastrointestinal or oropharyngeal tularemia in humans from ingestion of
      contaminated food or water.
    explanation: >-
      Identifies F. tularensis as the bacterium that can cause gastrointestinal
      tularemia after contaminated food or water is ingested.
agent_life_cycle:
  description: >-
    F. tularensis is maintained outside humans in wildlife and environmental
    cycles that can contaminate food or water. Humans are incidental clinical
    hosts at the end of the ingestion route and are not known to maintain
    person-to-person transmission.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host for the ingestion-route disease endpoint
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Ingestion of contaminated food or water
  description: >-
    Humans acquire gastrointestinal tularemia when they swallow F. tularensis
    in contaminated food, water, or infected animal tissue.
  evidence:
  - reference: PMID:19835784
    reference_title: >-
      Effect of dehydrated storage on the survival of Francisella tularensis in
      infant formula.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Francisella tularensis is a Gram-negative bacterium that can cause
      gastrointestinal or oropharyngeal tularemia in humans from ingestion of
      contaminated food or water.
    explanation: >-
      Supports the foodborne and waterborne ingestion route for
      gastrointestinal and oropharyngeal tularemia.
  - reference: PMID:18810348
    reference_title: Tularemia in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The epidemic was thought to be waterborne. The vehicle of the infections
      was inadequately treated water which was used by the patient in the
      village.
    explanation: >-
      A pediatric Bursa outbreak attributed alimentary tularemia transmission
      to inadequately treated village water.
  - reference: PMID:31071480
    reference_title: >-
      Clinical characteristics in a sentinel case as well as in a cluster of
      tularemia patients associated with grape harvest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During a must-tasting, five other individuals became infected with
      tularemia by ingestion of contaminated must.
    explanation: >-
      Documents foodborne tularemia after ingestion of a contaminated
      agricultural product.
pathophysiology:
- name: Ingested Francisella tularensis Exposure
  role: trigger
  description: >-
    F. tularensis is ingested and contacts the gastrointestinal mucosa,
    establishing the enteric portal of entry that defines gastrointestinal
    tularemia.
  biological_scale: TISSUE
  locations:
  - preferred_term: gastrointestinal tract
    term:
      id: UBERON:0005409
      label: alimentary part of gastrointestinal system
  downstream:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    causal_link_type: DIRECT
    description: >-
      Enteric F. tularensis enters phagocytes and establishes an intracellular
      cytosolic niche.
  evidence:
  - reference: PMID:29183485
    reference_title: >-
      Bichat guidelines for the clinical management of tularaemia and
      bioterrorism-related tularaemia.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Seven clinical forms, according to route of inoculation (skin, mucous
      membranes, gastrointestinal tract, eyes, respiratory tract), dose of the
      inoculum and virulence of the organism (types A or B) are identified.
    explanation: >-
      The guideline identifies the gastrointestinal tract as one inoculation
      route that defines a tularemia clinical form.
- name: Macrophage Phagosomal Escape and Cytosolic Replication
  description: >-
    F. tularensis uses its Francisella Pathogenicity Island-encoded type VI
    secretion system to escape the macrophage phagosome and replicate in the
    cytosol.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: symbiont-mediated disruption of host phagosome
    term:
      id: GO:0141160
      label: symbiont-mediated disruption of host phagosome
  downstream:
  - target: Enteric and Abdominal Nodal Inflammation
    causal_link_type: DIRECT
    description: >-
      Intracellular Francisella replication triggers inflammatory injury in the
      alimentary tract and its draining lymph nodes.
  evidence:
  - reference: PMID:20054881
    reference_title: >-
      The Francisella tularensis pathogenicity island encodes a secretion system
      that is required for phagosome escape and virulence.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      VgrG and IglI are required for F. tularensis phagosomal escape,
      intramacrophage growth, inflammasome activation and virulence in mice.
    explanation: >-
      Demonstrates that FPI-encoded secretion components enable Francisella
      phagosomal escape and macrophage replication. Graded MODEL_ORGANISM
      because the quoted sentence's final clause is in-vivo mouse virulence;
      the purely cell-based part of the same result is the item below.
  - reference: PMID:20054881
    reference_title: >-
      The Francisella tularensis pathogenicity island encodes a secretion system
      that is required for phagosome escape and virulence.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that two FPI proteins, VgrG and IglI, are secreted into the
      cytosol of infected macrophages.
    explanation: >-
      Cell-based evidence that the FPI effectors reach the macrophage cytosol,
      which is the cytosolic-replication half of this node.
- name: Enteric and Abdominal Nodal Inflammation
  description: >-
    Innate immune activation after ingested F. tularensis produces
    inflammatory disease of the alimentary tract and abdominal lymph nodes,
    presenting rarely as abdominal lymphadenopathy.
  biological_scale: TISSUE
  locations:
  - preferred_term: gastrointestinal tract
    term:
      id: UBERON:0005409
      label: alimentary part of gastrointestinal system
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Abdominal Lymphadenopathy
    causal_link_type: DIRECT
    description: >-
      Inflammation of the alimentary tract and its draining nodes presents as
      abdominal lymphadenopathy.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      The innate inflammatory response to ingested F. tularensis produces the
      acute febrile illness.
  evidence:
  - reference: PMID:24911857
    reference_title: >-
      A rare cause of abdominal lymphadenopathy--tularemia: report of two
      pediatric cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is necessary to consider tularemia in the differential diagnosis of
      abdominal lymphadenopathy in tularemia regions.
    explanation: >-
      Supports abdominal lymphadenopathy as a rare enteric manifestation of
      tularemia.
phenotypes:
- name: Abdominal Lymphadenopathy
  description: >-
    Gastrointestinal nodal involvement by the ingestion route can present as
    abdominal lymphadenopathy, documented in paediatric tularemia case reports.
  phenotype_term:
    preferred_term: Abdominal lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
    located_in:
      preferred_term: abdominal cavity
      term:
        id: UBERON:0003684
        label: abdominal cavity
  frequency: RARE
  evidence:
  - reference: PMID:24911857
    reference_title: >-
      A rare cause of abdominal lymphadenopathy--tularemia: report of two
      pediatric cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, these are the firstly described abdominal
      lymphadenopathy cases from Turkey.
    explanation: >-
      Establishes abdominal lymphadenopathy as a rare tularemia presentation.
- name: Fever
  description: >-
    Enteric tularemia shares the acute febrile systemic illness seen across
    tularemia clinical forms.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:24911857
    reference_title: >-
      A rare cause of abdominal lymphadenopathy--tularemia: report of two
      pediatric cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It generally presents as an acute febrile disease with the major clinical
      presentations including the six classic forms of tularemia:
      ulceroglandular, glandular, oculoglandular, oropharyngeal, typhoidal, and
      pneumonic.
    explanation: >-
      Describes tularemia as an acute febrile disease. The quoted list of six
      classic forms does not include an alimentary form and carries no
      frequency, so no frequency band is claimed here.
diagnosis:
- name: Serology or direct Francisella tularensis PCR
  description: >-
    Suspected alimentary tularemia is supported by serologic detection of F.
    tularensis antibodies and, when available from throat, node, or
    environmental material, direct PCR confirmation and subspecies typing.
  results: >-
    Francisella-specific seroreactivity or F. tularensis DNA detected in a
    compatible alimentary clinical syndrome.
  evidence:
  - reference: PMID:20220165
    reference_title: >-
      Evaluation of an immunochromatographic test for rapid and reliable
      serodiagnosis of human tularemia and detection of Francisella
      tularensis-specific antibodies in sera from different mammalian species.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serology is still considered to be a cornerstone in tularemia diagnosis
      due to the low sensitivity of bacterial culture and the lack of
      standardization in PCR methodology for the direct identification of the
      pathogen.
    explanation: >-
      Supports serology as a main diagnostic approach for human tularemia.
  - reference: PMID:22859584
    reference_title: >-
      A multiplex real-time PCR assay for the detection and differentiation of
      Francisella tularensis subspecies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The purpose of this study was to develop a multiplex real-time PCR assay
      for the identification and discrimination of type A.I, type A.II, type B
      and novicida subspecies of F. tularensis.
    explanation: >-
      Establishes PCR as a direct Francisella identification and subspecies
      discrimination method.
treatments:
- name: Ciprofloxacin
  description: >-
    Ciprofloxacin is a fluoroquinolone option for tularemia antimicrobial
    therapy, including ingestion-route disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  target_mechanisms:
  - target: Macrophage Phagosomal Escape and Cytosolic Replication
    treatment_effect: INHIBITS
    description: >-
      Ciprofloxacin reduces the intracellular F. tularensis burden that drives
      gastrointestinal tularemia.
  evidence:
  - reference: PMID:38294108
    reference_title: >-
      Systematic Review: Clinical Features, Antimicrobial Treatment, and
      Outcomes of Human Tularemia, 1993-2023.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Aminoglycosides, fluoroquinolones, and tetracyclines are effective
      antimicrobials for treatment of tularemia, regardless of clinical
      manifestation.
    explanation: >-
      Supports fluoroquinolones as an effective antimicrobial class across
      tularemia clinical manifestations.
epidemiology:
- name: Waterborne alimentary tularemia in Turkey
  description: >-
    Waterborne outbreaks in Turkey are dominated by the oropharyngeal arm of
    alimentary tularemia, but they document ingestion as the shared exposure
    behind foodborne and waterborne forms.
  evidence:
  - reference: PMID:10870943
    reference_title: "Tularemia in Bursa, Turkey: 205 cases in ten years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a result, the main mode of transmission of F. tularensis is waterborne
      in our region.
    explanation: >-
      Documents the regional waterborne pattern that underlies many alimentary
      tularemia outbreaks.

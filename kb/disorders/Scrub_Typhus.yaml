infectious_agent:
- name: Orientia tsutsugamushi
  description: >-
    Obligately intracellular, cytosol-dwelling bacterium of the family
    Rickettsiaceae, reclassified out of the genus Rickettsia into its own genus on
    the basis of its divergent envelope chemistry and genome. Its major outer
    membrane protein, the 56-kDa type-specific antigen (TSA56), is both the principal
    adhesin and the antigen on which strain typing is based.
  infectious_agent_term:
    preferred_term: Orientia tsutsugamushi
    term:
      id: NCBITaxon:784
      label: Orientia tsutsugamushi
  evidence:
  - reference: PMID:21610853
    reference_title: >-
      Orientia tsutsugamushi stimulates an original gene expression program in
      monocytes: relationship with gene expression in patients with scrub typhus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      O. tsutsugamushi is an obligate intracellular bacterium that mainly infects
      endothelial cells.
    explanation: >-
      Identifies the causative organism and its obligately intracellular,
      endotheliotropic lifestyle.
  - reference: PMID:32620750
    reference_title: >-
      Dual RNA-seq of Orientia tsutsugamushi informs on host-pathogen interactions
      for this neglected intracellular human pathogen.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Orientia tsutsugamushi (Ot), an obligate intracellular bacterium that causes
      the vector-borne human disease scrub typhus
    explanation: >-
      Names O. tsutsugamushi as the agent of scrub typhus and confirms the obligately
      intracellular, vector-borne character of the infection.

transmission:
- name: Chigger-borne (trombiculid mite larva) transmission
  description: >-
    Orientia tsutsugamushi is transmitted by the larval stage - the chigger - of
    trombiculid mites of the genus Leptotrombidium, which is the only stage of the
    mite life cycle that feeds on a vertebrate. The mite is both vector and reservoir,
    maintaining the organism transovarially, so humans are incidental hosts. Human
    volunteer studies with laboratory-reared infected chiggers reproduce the full
    syndrome, establishing the route causally rather than by association.
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Human volunteers fed on laboratory-reared infected chiggers developed the
      complete scrub typhus syndrome, establishing chigger attachment as a sufficient
      route of transmission.
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsemias were detected in all three volunteers beginning on day 7 PCA, 1-3
      days before the onset of clinical disease.
    explanation: >-
      Documents the incubation interval between chigger attachment and detectable
      bacteraemia, which precedes symptom onset - the temporal basis of the
      dissemination node.

pathophysiology:
- name: Chigger-Borne Dermal Inoculation of Orientia tsutsugamushi
  biological_scale: ORGANISM
  role: trigger
  description: >-
    A feeding Leptotrombidium larva deposits Orientia tsutsugamushi into the dermis
    at its attachment site. This is the initiating event of the disease and the only
    natural route of human infection; the mite feeds once, so a single attachment is
    sufficient. Bacteraemia becomes detectable roughly a week after attachment, one to
    three days before clinical illness begins.
  cell_types:
  - preferred_term: dermal fibroblast at the inoculation site
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: TSA56-Fibronectin Binding and Integrin-Mediated Host Cell Entry
    causal_link_type: DIRECT
    description: >-
      Inoculated organisms encounter and attach to resident dermal cells, which is
      the first molecular step of infection.
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsemias were detected in all three volunteers beginning on day 7 PCA, 1-3
      days before the onset of clinical disease.
    explanation: >-
      Establishes chigger attachment as the initiating event and quantifies the delay
      to detectable bacteraemia in deliberately infected human volunteers.

- name: TSA56-Fibronectin Binding and Integrin-Mediated Host Cell Entry
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    The 56-kDa type-specific antigen (TSA56), the major outer membrane protein of
    O. tsutsugamushi, binds host fibronectin. Fibronectin bridges the bacterium to
    integrin alpha5beta1, and the bacterium then activates the integrin signalling
    machinery - focal adhesion kinase, Src kinase and RhoA GTPase, with recruitment of
    talin and paxillin - to drive actin reorganisation and membrane protrusion that
    engulfs it. This is an induced uptake: the organism forces its own entry into
    cells that are not professional phagocytes. Blocking tyrosine kinases or RhoA, or
    competing with the fibronectin-binding region of TSA56, reduces invasion, which is
    what makes this a causal step rather than a correlate.
  biological_processes:
  - preferred_term: integrin-mediated signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007229
      label: integrin-mediated signaling pathway
  - preferred_term: actin cytoskeleton organization
    modifier: INCREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Cytosolic Replication in an Obligate Intracellular Niche
    causal_link_type: DIRECT
    description: >-
      Induced endocytosis delivers the organism into the host cell, the prerequisite
      for its intracellular replication.
  evidence:
  - reference: PMID:20160019
    reference_title: >-
      Intracellular invasion by Orientia tsutsugamushi is mediated by integrin
      signaling and actin cytoskeleton rearrangements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the 56-kDa type-specific antigen (TSA56), a major outer membrane protein of O.
      tsutsugamushi, binds to fibronectin and facilitates bacterial entry into the
      host cell
    explanation: >-
      Identifies TSA56-fibronectin binding as the adhesion event that initiates host
      cell entry.
  - reference: PMID:20160019
    reference_title: >-
      Intracellular invasion by Orientia tsutsugamushi is mediated by integrin
      signaling and actin cytoskeleton rearrangements.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      these results clearly indicate that O. tsutsugamushi exploits integrin-mediated
      signaling and the actin cytoskeleton for invasion of eukaryotic host cells
    explanation: >-
      States the paper's conclusion that integrin signalling and actin remodelling are
      the mechanism of invasion, which is the molecular content of this node.

- name: Cytosolic Replication in an Obligate Intracellular Niche
  biological_scale: CELLULAR
  role: central_effector
  conforms_to: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
  description: >-
    Having entered the cell, Orientia escapes the endocytic vacuole into the cytosol
    and replicates free in the cytoplasm. It cannot replicate outside a host cell at
    all. This niche is simultaneously the engine of the disease and the constraint on
    its treatment: an antibiotic must cross the host plasma membrane and accumulate
    intracellularly to reach the organism, which excludes the poorly cell-penetrant
    beta-lactams.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Eschar Formation at the Inoculation Site
    causal_link_type: DIRECT
    description: >-
      Local replication and the ensuing inflammatory and necrotic response at the bite
      site produce the eschar.
  - target: Lymphatic and Haematogenous Dissemination
    causal_link_type: DIRECT
    description: >-
      Replication at the inoculation site seeds draining lymphatics and then the
      bloodstream.
  - target: Requirement for Cell-Penetrant Antimicrobials
    causal_link_type: DIRECT
    description: >-
      Because the replicating organism sits in the host cytosol, only agents that
      accumulate intracellularly can reach it.
  evidence:
  - reference: PMID:21610853
    reference_title: >-
      Orientia tsutsugamushi stimulates an original gene expression program in
      monocytes: relationship with gene expression in patients with scrub typhus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      O. tsutsugamushi is an obligate intracellular bacterium that mainly infects
      endothelial cells.
    explanation: >-
      Establishes the obligately intracellular lifestyle that this node represents and
      that gates drug choice.

- name: Ank13-Mediated p53 Suppression and Host Cell Cycle Arrest
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Orientia does not merely occupy the host cell, it reconfigures it. The
    nucleomodulatory effector Ank13 blocks transcription of TP53, nearly depleting p53
    and disabling the DNA-damage-triggered apoptosis that would otherwise destroy the
    infected cell and with it the bacterial niche. Rather than releasing the cell into
    unrestricted proliferation, the organism arrests the cycle at S phase in a way that
    favours its own replication, and delays genotoxic apoptosis until a high bacterial
    load has accumulated. This is niche maintenance, and it explains why infected
    endothelium survives long enough to support the bacterial burden that drives
    systemic disease.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    modifier: INCREASED
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Cytosolic Replication in an Obligate Intracellular Niche
    causal_link_type: DIRECT
    description: >-
      Suppressing host apoptosis and arresting the cell cycle preserves and extends the
      intracellular niche in which the organism replicates.
  evidence:
  - reference: PMID:40830139
    reference_title: >-
      Orientia tsutsugamushi modulates p53, the cell cycle, and genotoxicity to
      maintain its intracellular niche.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the endotheliotropic obligate intracellular bacterium Orientia tsutsugamushi
      blocks transcription of TP53 to nearly deplete p53 levels
    explanation: >-
      Establishes the molecular event of this node - transcriptional blockade of TP53
      by the organism in host endothelial cells.
  - reference: PMID:40830139
    reference_title: >-
      Orientia tsutsugamushi modulates p53, the cell cycle, and genotoxicity to
      maintain its intracellular niche.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Orientia arrests the cell cycle at S phase to promote bacterial replication.
    explanation: >-
      States that the cell-cycle arrest is directed at promoting bacterial replication,
      which is the causal claim of the downstream edge to the replication node.

- name: Eschar Formation at the Inoculation Site
  biological_scale: TISSUE
  role: consequence
  description: >-
    Replication at the chigger attachment site produces a localised necrotic papule
    that ulcerates and forms a black crust surrounded by an erythematous halo - the
    eschar - typically with regional lymphadenopathy in the draining basin. It is the
    single most useful diagnostic sign, but it is not universal, is frequently
    concealed in the axilla, groin or under clothing, and is easily missed on darker
    skin, which is a recurring cause of delayed diagnosis. The eschar is the visible
    correlate of the initiating focus rather than a cause of the systemic disease, so it
    is deliberately a terminal node carrying no outgoing causal edge.
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Human volunteer infections produced eschar together with regional
      lymphadenopathy, tying the local lesion to the inoculation site.

- name: Lymphatic and Haematogenous Dissemination
  biological_scale: ORGANISM
  role: consequence
  description: >-
    From the inoculation site the organism travels through draining lymphatics to
    regional nodes and then into the bloodstream, producing the rickettsaemia that
    precedes clinical illness by one to three days. Dissemination is what converts a
    localised skin lesion into a systemic vasculotropic disease, and it is why the
    organ complications of scrub typhus are simultaneous rather than sequential.
  downstream:
  - target: Endothelial and Mononuclear Phagocyte Infection
    causal_link_type: DIRECT
    description: >-
      Blood-borne organisms reach and infect vascular endothelium and circulating
      mononuclear phagocytes throughout the body.
  evidence:
  - reference: PMID:40747630
    reference_title: Neurological complications of scrub typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      with Orientia tsutsugamushi selectively targeting dermal and endothelial cells,
      facilitating systemic dissemination and subsequent neurological implications
    explanation: >-
      States the progression from dermal infection to systemic dissemination and
      thence to distant organ involvement. Evidence source is OTHER as this is a
      review article.

- name: Endothelial and Mononuclear Phagocyte Infection
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Orientia is endotheliotropic: vascular endothelial cells are its principal target
    throughout the body, and infection of the endothelium is the anatomical basis of
    the disease's small-vessel character. Monocytes, macrophages and dendritic cells
    are also productively infected - monocytes support bacterial replication, not
    merely uptake - which supplies the second, immunological arm of the lesion.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  downstream:
  - target: Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
    causal_link_type: DIRECT
    description: >-
      Infection of monocytes and macrophages triggers the interferon-dominated
      transcriptional programme that drives systemic inflammation.
  - target: Disseminated Small-Vessel Vasculitis and Endothelial Barrier Failure
    causal_link_type: DIRECT
    description: >-
      Direct infection of endothelium injures the vessel wall and initiates the
      vasculitic lesion.
  evidence:
  - reference: PMID:21610853
    reference_title: >-
      Orientia tsutsugamushi stimulates an original gene expression program in
      monocytes: relationship with gene expression in patients with scrub typhus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrated here that O. tsutsugamushi also replicated in monocytes isolated
      from healthy donors.
    explanation: >-
      Shows the organism replicates in monocytes as well as endothelium, establishing
      the mononuclear phagocyte arm of this node.

- name: Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Infection reprogrammes the mononuclear phagocyte compartment on a large scale:
    more than 4,500 genes change in infected healthy-donor monocytes, with
    upregulation of type I interferon and interferon-stimulated genes, M1
    macrophage-polarisation genes, and apoptosis-related genes. Live organisms are
    required for the interferon response, so this is an active host response to
    replicating bacteria rather than a reaction to bacterial debris. Critically, the
    same interferon-dominated signature is recovered from the mononuclear cells of
    patients with scrub typhus, so this is not a cell-culture artefact.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  - preferred_term: M1-polarised macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Disseminated Small-Vessel Vasculitis and Endothelial Barrier Failure
    causal_link_type: DIRECT
    description: >-
      The cytokine and interferon response amplifies endothelial activation and
      permeability beyond the injury caused by direct infection alone.
  evidence:
  - reference: PMID:21610853
    reference_title: >-
      Orientia tsutsugamushi stimulates an original gene expression program in
      monocytes: relationship with gene expression in patients with scrub typhus.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The expression of type I interferon, interferon-stimulated genes and genes
      associated with the M1 polarization of macrophages was significantly upregulated.
    explanation: >-
      Establishes the interferon-dominated, M1-polarising transcriptional programme
      that defines this node.
  - reference: PMID:21610853
    reference_title: >-
      Orientia tsutsugamushi stimulates an original gene expression program in
      monocytes: relationship with gene expression in patients with scrub typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the microarray analyses revealed the upregulation of 613 genes, which included
      interferon-related genes, and some features of M1 polarization were observed in
      these patients
    explanation: >-
      Recovers the same signature from patients with scrub typhus, which is what makes
      the in-vitro programme relevant to human disease rather than a culture artefact.

- name: Disseminated Small-Vessel Vasculitis and Endothelial Barrier Failure
  biological_scale: TISSUE
  role: central_effector
  description: >-
    Direct endothelial infection plus the interferon- and cytokine-rich inflammatory
    response produce a disseminated small-vessel vasculitis with perivascular
    mononuclear infiltration and loss of endothelial barrier integrity. This is the
    single unifying lesion of scrub typhus. Because the vascular bed is everywhere,
    one lesion expressed in different organs generates the entire severe phenotype,
    which is why respiratory, hepatic, cardiac, renal and neurological complications
    appear together rather than in sequence.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  downstream:
  - target: Multi-Organ Vascular Leak and End-Organ Dysfunction
    causal_link_type: DIRECT
    description: >-
      Loss of endothelial barrier function permits the capillary leak and tissue
      hypoperfusion that manifest as organ dysfunction.
  evidence:
  - reference: PMID:42126901
    reference_title: >-
      Eschars and estate fever: A case series from the Johorean oil palm heartland
      highlighting the changing face of scrub typhus in Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rapidly progressive multiorgan dysfunction driven by smallvessel vasculitis,
      including pneumonitis, acute kidney injury, hepatitis, encephalitis and
      circulatory shock
    explanation: >-
      Names small-vessel vasculitis as the driver of the multi-organ syndrome and
      enumerates the organ manifestations that follow from it.

- name: Multi-Organ Vascular Leak and End-Organ Dysfunction
  biological_scale: ORGANISM
  role: consequence
  description: >-
    Capillary leak and microvascular injury across multiple beds produce the severe
    end of the disease: pneumonitis and acute respiratory distress syndrome,
    hepatitis, myocarditis and circulatory shock, acute kidney injury, and
    meningoencephalitis. In the INTREST trial of severe scrub typhus - a hospitalised
    cohort selected for having at least one organ involved, so these proportions
    describe severe disease and are not population frequencies - complications were
    respiratory in 62%, hepatic in 54%, cardiovascular in 42%, renal in 30% and
    neurologic in 20% of patients.
  evidence:
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complications included those that were respiratory (in 62%), hepatic (in 54%),
      cardiovascular (in 42%), renal (in 30%), and neurologic (in 20%)
    explanation: >-
      Quantifies the organ-system distribution of severe scrub typhus in a
      794-patient randomised trial cohort, showing the simultaneous multi-organ
      pattern this node represents.
  - reference: PMID:40747630
    reference_title: Neurological complications of scrub typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurological complications, notably encephalitis and meningitis, have emerged as
      significant clinical manifestations, considerably affecting morbidity and
      mortality rates among affected individuals.
    explanation: >-
      Supports the neurological arm of the end-organ node and its contribution to
      mortality. Evidence source is OTHER as this is a review article.

- name: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
  description: >-
    Like other bacteria, Orientia tsutsugamushi depends on translation of its mRNA by
    the 70S ribosome, and that ribosome is the target of every antibiotic with
    established activity in scrub typhus. Doxycycline binds the 30S subunit and blocks
    aminoacyl-tRNA delivery to the A site; azithromycin binds the 50S subunit and
    blocks nascent-chain elongation. The target is the ribosome and not the cell wall,
    which - together with the intracellular niche - is why a tetracycline or macrolide
    rather than a beta-lactam is used.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  downstream:
  - target: Cytosolic Replication in an Obligate Intracellular Niche
    causal_link_type: DIRECT
    description: >-
      Bacterial protein synthesis sustains intracellular replication, so inhibiting
      translation arrests the replicating organism.
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as the target of tetracyclines and
      macrolides, the step this node represents. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we compared the efficacy of intravenous doxycycline, azithromycin, or a
      combination of both in treating severe scrub typhus
    explanation: >-
      Confirms that the agents used in scrub typhus are a tetracycline and a macrolide,
      both of which act on the bacterial ribosome represented by this node.

- name: Requirement for Cell-Penetrant Antimicrobials
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials
  description: >-
    Because the organism replicates free in the host cytosol, effective therapy
    requires an antibiotic that crosses the host plasma membrane and accumulates
    intracellularly. Doxycycline and azithromycin do; beta-lactams do not reach the
    cytosolic organism regardless of dose. This is pharmacokinetic gating rather than
    a molecular target, and it operates alongside - not instead of - the ribosomal
    target node. The clinical urgency of the constraint follows from the multi-organ node,
    since untreated disease progresses to organ failure - but that is a statement about why
    the constraint matters, not a causal relationship, so it is recorded here rather than
    encoded as an edge.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:18611821
    reference_title: Intracellular organisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist
      antibiotics with poor ability to penetrate eukaryotic cell membranes, such as the
      beta-lactam compounds.
    explanation: >-
      States the gating principle this node represents: an intracellular niche excludes
      poorly cell-penetrant antibiotics. Evidence source is OTHER as this is a review
      article.

- name: Peptidoglycan-Poor Atypical Cell Envelope
  biological_scale: MOLECULAR
  role: modifier
  description: >-
    Orientia's envelope chemistry diverges sharply from that of the rickettsiae it was
    once classified with, and this divergence was the basis for erecting the genus
    Orientia. Chemical analysis found no detectable muramic acid, glucosamine, heptose
    or KDO and no lipopolysaccharide bands, concluding the organism has little or no
    peptidoglycan or LPS. A later structural study qualified this: it found evidence
    for a peptidoglycan-LIKE structure together with a cross-linked outer-membrane
    protein network that confers envelope stability. The two results are curated here
    together, unresolved, because the difference matters mechanistically - it
    determines whether beta-lactam inactivity in scrub typhus is target absence or
    only drug exclusion. See the `orientia-peptidoglycan-status` discussion; this entry
    deliberately does NOT declare conformance to
    `bacterial_cell_wall_synthesis_inhibition#Intrinsic Resistance in Cell-Wall-Deficient
    Organisms` while that question is open.
  downstream:
  - target: Requirement for Cell-Penetrant Antimicrobials
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Whatever the residual peptidoglycan status, the envelope offers no validated
      cell-wall target in this organism, leaving cell-penetrant ribosome-active agents
      as the therapeutic route.
  evidence:
  - reference: PMID:3114150
    reference_title: >-
      Deficiency of peptidoglycan and lipopolysaccharide components in Rickettsia
      tsutsugamushi.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It is concluded that R. tsutsugamushi has little or no peptidoglycan or
      lipopolysaccharide.
    explanation: >-
      The original chemical analysis concluding the organism lacks the classical
      Gram-negative envelope components, including the peptidoglycan that is the
      beta-lactam target.
  - reference: PMID:28513097
    reference_title: Evidence for a peptidoglycan-like structure in Orientia tsutsugamushi.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      This bacterium was previously reported to completely lack peptidoglycan, but here
      we present evidence supporting the existence of a peptidoglycan-like structure in
      Orientia
    explanation: >-
      Directly qualifies the earlier conclusion by presenting structural evidence for a
      peptidoglycan-like layer. Recorded as PARTIAL because it supports an atypical,
      peptidoglycan-poor envelope while contradicting the stronger claim of complete
      absence.

phenotypes:
- category: Clinical
  name: Fever
  description: >-
    Acute fever is the presenting feature and the reason scrub typhus is a leading
    cause of undifferentiated febrile illness in endemic areas. Onset follows chigger
    attachment by roughly 8-10 days. No frequency band is asserted: the sources
    available here are a three-volunteer challenge study and a four-patient case
    series, neither of which supports a population estimate.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
    temporality: ACUTE
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Fever was part of the syndrome reproduced in deliberately infected human
      volunteers.

- category: Clinical
  name: Eschar
  frequency: OCCASIONAL
  description: >-
    A necrotic, black-crusted ulcer with an erythematous halo at the chigger
    attachment site. It is pathognomonic when present, but present in a minority of
    patients: a meta-analysis of 107 studies and 34,002 Indian cases pooled eschar
    positivity at 28.5% (95% CI 24.1-32.9%), which places it in the OCCASIONAL band.
    The band should be read as region-specific rather than global - the same
    meta-analysis found pooled positivity ranging from under 12% in some Indian states
    to 46% or more in others, and series from elsewhere in the endemic zone report
    higher rates still. Eschars concentrate on the trunk, groin and axilla, which is
    why they are missed without deliberate examination of covered areas.
  phenotype_term:
    preferred_term: Eschar
    term:
      id: HP:6000793
      label: Eschar
  evidence:
  - reference: PMID:39282546
    reference_title: >-
      Frequency and distribution of eschar in patients with scrub typhus in India:
      systematic review of literature and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall pooled proportion of eschar positivity was 28.5% (95% CI: 24.1 to
      32.9%).
    explanation: >-
      Pooled proportion across 34,002 cases; 28.5% falls in the OCCASIONAL band (5-29%)
      and is the quantitative basis for the frequency asserted here.
  - reference: PMID:39282546
    reference_title: >-
      Frequency and distribution of eschar in patients with scrub typhus in India:
      systematic review of literature and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pooled proportion of eschar positivity in the 'trunk' (39.3%), 'groin'
      (23.8%), and 'axilla' (16.5%) was higher than in the 'limbs' (9.9%) and 'head'
      (11.3%).
    explanation: >-
      Documents the anatomical distribution that explains why the eschar is so often
      overlooked on routine examination.

- category: Clinical
  name: Headache
  description: >-
    Severe headache accompanies the febrile onset and is one of the features
    reproduced in human challenge infection.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
    severity: SEVERE
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Severe headache was among the signs produced by controlled chigger transmission
      in human volunteers.

- category: Clinical
  name: Myalgia
  description: >-
    Diffuse muscle pain is part of the early nonspecific syndrome that makes scrub
    typhus difficult to distinguish clinically from dengue and other tropical febrile
    illnesses.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Myalgia was among the signs produced by controlled chigger transmission in human
      volunteers.

- category: Clinical
  name: Regional lymphadenopathy
  description: >-
    Enlargement of the lymph nodes draining the eschar, reflecting lymphatic spread
    from the inoculation site; generalised lymphadenopathy may follow dissemination.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these included fever, severe headache, myalgia, regional lymphadenopathy, and
      eschar
    explanation: >-
      Regional lymphadenopathy in the basin draining the eschar was reproduced in human
      volunteer infection, supporting lymphatic spread from the inoculation site.

- category: Clinical
  name: Maculopapular rash
  description: >-
    A transient generalised maculopapular eruption appearing a few days after fever
    onset, typically beginning on the trunk. It is inconstant and short-lived, which
    limits its diagnostic value.
  phenotype_term:
    preferred_term: Maculopapular exanthema
    term:
      id: HP:0040186
      label: Maculopapular exanthema
    temporality: TRANSIENT
  evidence:
  - reference: PMID:6808205
    reference_title: Transmission of scrub typhus to human volunteers by laboratory-reared chiggers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The two L. fletcheri subjects developed a transient generalized rash on days 3-4
      after the onset of fever
    explanation: >-
      Documents the rash, its transient character, and its timing relative to fever
      onset in controlled human infection.

- category: Laboratory
  name: Elevated hepatic transaminases
  description: >-
    Transaminitis reflects the hepatic arm of the disseminated vasculitic lesion and is
    among the commonest laboratory abnormalities; hepatic complications occurred in 54%
    of patients in a severe-disease trial cohort.
  phenotype_term:
    preferred_term: Elevated circulating hepatic transaminase concentration
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:42126901
    reference_title: >-
      Eschars and estate fever: A case series from the Johorean oil palm heartland
      highlighting the changing face of scrub typhus in Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia and acute kidney injury occurred in 50%, while 75% demonstrated
      transaminitis.
    explanation: >-
      Reports transaminitis as the commonest laboratory abnormality in a confirmed
      scrub typhus case series.

- category: Laboratory
  name: Thrombocytopenia
  description: >-
    Platelet consumption and marrow suppression accompany the systemic infection;
    thrombocytopenia is one of the features that leads to scrub typhus being mistaken
    for dengue in co-endemic areas.
  phenotype_term:
    preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  evidence:
  - reference: PMID:42126901
    reference_title: >-
      Eschars and estate fever: A case series from the Johorean oil palm heartland
      highlighting the changing face of scrub typhus in Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thrombocytopenia and acute kidney injury occurred in 50%, while 75% demonstrated
      transaminitis.
    explanation: >-
      Reports thrombocytopenia in half of a confirmed scrub typhus case series.

- category: Clinical
  name: Acute kidney injury
  description: >-
    Renal involvement follows microvascular injury and hypoperfusion; renal
    complications were present in 30% of patients in a randomised trial cohort of
    severe scrub typhus.
  phenotype_term:
    preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
    temporality: ACUTE
  evidence:
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complications included those that were respiratory (in 62%), hepatic (in 54%),
      cardiovascular (in 42%), renal (in 30%), and neurologic (in 20%)
    explanation: >-
      Quantifies renal involvement in a 794-patient severe scrub typhus trial cohort.
      No frequency band is asserted because the cohort was selected for severity.

- category: Clinical
  name: Acute respiratory distress syndrome
  description: >-
    Pulmonary capillary leak produces interstitial pneumonitis progressing to ARDS, the
    commonest organ complication of severe scrub typhus and a major contributor to
    mortality; respiratory complications affected 62% of a severe-disease trial cohort.
  phenotype_term:
    preferred_term: Acute respiratory distress syndrome
    term:
      id: HP:0033677
      label: Acute respiratory distress syndrome
    temporality: ACUTE
  evidence:
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complications included those that were respiratory (in 62%), hepatic (in 54%),
      cardiovascular (in 42%), renal (in 30%), and neurologic (in 20%)
    explanation: >-
      Respiratory complications were the most frequent organ involvement in the
      severe-disease trial cohort. No frequency band is asserted because the cohort was
      selected for severity.

- category: Clinical
  name: Meningoencephalitis
  description: >-
    Central nervous system involvement presents as encephalitis or meningitis and is a
    recognised cause of acute encephalitis syndrome in endemic areas. Neurologic
    complications affected 20% of a severe-disease trial cohort and contribute
    substantially to morbidity and mortality.
  phenotype_term:
    preferred_term: Bacterial encephalitis
    term:
      id: HP:0034387
      label: Bacterial encephalitis
    temporality: ACUTE
  evidence:
  - reference: PMID:40747630
    reference_title: Neurological complications of scrub typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurological complications, notably encephalitis and meningitis, have emerged as
      significant clinical manifestations, considerably affecting morbidity and
      mortality rates among affected individuals.
    explanation: >-
      Establishes encephalitis and meningitis as significant manifestations affecting
      outcome. Evidence source is OTHER as this is a review article.

- category: Clinical
  name: Meningitis
  description: >-
    Meningeal inflammation, typically with a lymphocytic cerebrospinal fluid picture,
    occurring alone or with encephalitis as part of the CNS arm of the vasculitic
    lesion.
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  evidence:
  - reference: PMID:40747630
    reference_title: Neurological complications of scrub typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Neurological complications, notably encephalitis and meningitis, have emerged as
      significant clinical manifestations, considerably affecting morbidity and
      mortality rates among affected individuals.
    explanation: >-
      Names meningitis alongside encephalitis as a significant neurological
      manifestation. Evidence source is OTHER as this is a review article.

- category: Clinical
  name: Circulatory shock
  description: >-
    Distributive and cardiogenic shock at the severe end of the spectrum, arising from
    capillary leak, myocardial involvement and systemic inflammation; cardiovascular
    complications affected 42% of a severe-disease trial cohort.
  phenotype_term:
    preferred_term: Shock
    term:
      id: HP:0031273
      label: Shock
    temporality: ACUTE
  evidence:
  - reference: PMID:42126901
    reference_title: >-
      Eschars and estate fever: A case series from the Johorean oil palm heartland
      highlighting the changing face of scrub typhus in Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rapidly progressive multiorgan dysfunction driven by smallvessel vasculitis,
      including pneumonitis, acute kidney injury, hepatitis, encephalitis and
      circulatory shock
    explanation: >-
      Lists circulatory shock among the multiorgan manifestations driven by the
      small-vessel vasculitis.

- category: Clinical
  name: Hepatomegaly
  frequency: FREQUENT
  description: >-
    Liver enlargement, the commonest liver-related finding at 46% pooled prevalence and the
    clinical counterpart of the hepatic arm of the disseminated vasculitis. Hepatic symptoms
    overall pool at 44%. These are meta-analytic prevalences across the Indian literature
    rather than severity-selected cohort figures, so they support a frequency band directly.
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub
      typhus in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      O. tsutsugamushi parasite invades the hepatocyte cells, leading to hepatic symptoms like
      hepatomegaly and hepatic dysfunction, with an overall pooled prevalence rate of 44%
      (figure 6). Hepatomegaly was the most common liver-related symptom (46%)
    explanation: >-
      Pooled prevalence of 46% for hepatomegaly across a systematic review places it in the
      FREQUENT band (30-79%) and is the quantitative basis for the band asserted here.

- category: Clinical
  name: Splenomegaly
  frequency: FREQUENT
  description: >-
    Splenic involvement at 34% pooled prevalence, part of the reticuloendothelial response to
    disseminated infection. Hepatosplenomegaly together with fever and thrombocytopenia is a
    recognised presenting pattern, including in neonates.
  phenotype_term:
    preferred_term: Splenomegaly
    term:
      id: HP:0001744
      label: Splenomegaly
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub
      typhus in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inflammation (31%) in scrub typhus affects the spleen (34%), lymph nodes (33%), meninges
      (24%) and pancreas (6%)
    explanation: >-
      Pooled prevalence of 34% for splenic involvement places it in the FREQUENT band (30-79%).

- category: Clinical
  name: Nausea
  frequency: FREQUENT
  description: >-
    Nausea at 43% pooled prevalence, part of the gastrointestinal symptom cluster that
    contributes to scrub typhus being mistaken for other tropical febrile illnesses.

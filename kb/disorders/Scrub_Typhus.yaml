name: Scrub typhus
creation_date: '2026-08-19T22:40:00Z'
category: Infectious Disease
description: >-
  Scrub typhus is an acute, mite-borne rickettsial illness caused by Orientia
  tsutsugamushi, an obligately intracellular bacterium transmitted by the larval
  stage (chigger) of trombiculid mites of the genus Leptotrombidium. It is one of
  the commonest causes of non-malarial undifferentiated febrile illness across the
  Asia-Pacific "tsutsugamushi triangle", and its reported range is expanding.

  The mechanism is a single lesion with systemic consequences. A feeding chigger
  inoculates Orientia into the dermis; the organism uses its major outer-membrane
  protein TSA56 to bind host fibronectin and co-opt integrin alpha5beta1 signalling
  and the actin cytoskeleton to force its own uptake into non-phagocytic cells. It
  then escapes into the cytosol and replicates there, remodelling the host cell to
  protect its niche. Local replication produces the diagnostic eschar; lymphatic and
  haematogenous spread carries the organism to vascular endothelium and to monocytes,
  macrophages and dendritic cells throughout the body. The resulting type I
  interferon-dominated, M1-polarised inflammatory response together with direct
  endothelial infection produces a disseminated small-vessel vasculitis and loss of
  endothelial barrier function. That one lesion, expressed in different organs,
  accounts for the whole severe phenotype - pneumonitis and ARDS, hepatitis,
  myocarditis and shock, acute kidney injury, and meningoencephalitis.

  Two features of the organism gate treatment and are curated here as explicit
  mechanism nodes rather than as prose. Orientia is obligately intracellular and
  cytosolic, so only cell-penetrant agents reach it; and its drug target is the
  bacterial ribosome, not the cell wall. Doxycycline and azithromycin therefore work
  and beta-lactams do not. The entry conforms to
  `intracellular_pathogen_persistence` (both nodes) and to
  `bacterial_protein_synthesis_inhibition`, the same multi-module shape used by
  `Murine_Typhus` and `Oroya_Fever`.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gastrointestinal symptoms noted were nausea (43%), diarrhoea (11%), vomiting (35%),
      abdominal pain (26%), jaundice/icterus (18%), gastrointestinal bleeding (15%) and other
      gastric abnormalities (43%)
    explanation: >-
      Pooled prevalence of 43% for nausea places it in the FREQUENT band (30-79%).


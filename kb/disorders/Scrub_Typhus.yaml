discussions:
- discussion_id: orientia-peptidoglycan-status
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Peptidoglycan-Poor Atypical Cell Envelope
  - pathophysiology#Requirement for Cell-Penetrant Antimicrobials
  prompt: >-
    Does Orientia tsutsugamushi possess a peptidoglycan layer capable of serving as a
    beta-lactam target? The 1987 chemical analysis that underpinned the reclassification
    out of Rickettsia found no detectable muramic acid or glucosamine and concluded the
    organism has little or no peptidoglycan; a 2017 structural study reported evidence
    for a peptidoglycan-like structure alongside a cross-linked outer-membrane protein
    network. The two results have not been reconciled.
  rationale: >-
    The answer determines how beta-lactam inactivity in scrub typhus should be modelled.
    If peptidoglycan is genuinely absent, the correct model is target absence and this
    entry should conform to
    `bacterial_cell_wall_synthesis_inhibition#Intrinsic Resistance in Cell-Wall-Deficient
    Organisms` alongside the Mollicutes. If a functional peptidoglycan-like layer exists,
    the exclusion of beta-lactams is purely pharmacokinetic - they cannot reach a
    cytosolic organism - and belongs entirely to
    `intracellular_pathogen_persistence`. This entry currently declares only the latter,
    because asserting target absence on contested evidence would be the stronger and
    less defensible claim. The distinction is not merely taxonomic: it bears on whether
    any cell-wall-active agent could ever be made to work if delivery were solved.
  proposed_experiments:
  - experiment_id: orientia-pg-muropeptide-analysis
    name: Direct muropeptide analysis of purified Orientia
    description: >-
      Apply quantitative muropeptide profiling (LC-MS of mutanolysin digests) and
      D-amino-acid metabolic labelling to highly purified Orientia tsutsugamushi from
      several strains, with Chlamydia and a Mollicute as positive and negative controls,
      to determine whether cross-linked peptidoglycan is present and at what abundance.
    readouts:
    - name: Cross-linked muropeptide abundance
      target: pathophysiology#Peptidoglycan-Poor Atypical Cell Envelope
    would_support:
    - pathophysiology#Peptidoglycan-Poor Atypical Cell Envelope

- discussion_id: orientia-doxycycline-susceptibility
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
  prompt: >-
    Do clinically significant doxycycline-resistant strains of Orientia tsutsugamushi
    exist, and if so what is the molecular basis? Poor clinical response to doxycycline
    has been reported from parts of northern Thailand and has motivated dedicated
    trials, but the organism is genetically intractable and cannot be susceptibility
    tested by routine methods, so the phenotype has not been tied to a ribosomal target
    mutation, an efflux mechanism, or to host and pharmacokinetic factors instead.
  rationale: >-
    The module `bacterial_protein_synthesis_inhibition` models ribosomal target
    resistance as a distinct node, and whether scrub typhus conforms to it is currently
    unanswerable. Because every agent with established activity in scrub typhus acts on
    the same ribosome, a true target-level resistance mechanism would threaten the entire
    therapeutic repertoire at once, which is why the question matters more here than in
    infections with several independent drug targets. Until it is resolved this entry
    does not curate a resistance node.
  proposed_experiments:
  - experiment_id: orientia-resistance-genotype-phenotype
    name: Genotype-phenotype study of poor doxycycline responders
    description: >-
      Couple a prospective treatment-response cohort in a reported low-response area with
      whole-genome sequencing of infecting strains and measurement of plasma and
      intracellular doxycycline exposure, to separate ribosomal or efflux-mediated
      bacterial resistance from inadequate drug exposure.
    readouts:
    - name: Association of ribosomal or efflux variants with delayed defervescence
      target: pathophysiology#Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
    would_support:
    - pathophysiology#Orientia Ribosomal Translation (Tetracycline and Macrolide Target)

- discussion_id: scrub-typhus-neuroinflammation-model-fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
  - pathophysiology#Multi-Organ Vascular Leak and End-Organ Dysfunction
  prompt: >-
    The mechanistic account of scrub typhus neuroinflammation - excessive interferon
    responses, microglial activation and blood-brain-barrier disruption - rests on brain
    RNA-seq and immunostaining in a murine model of severe infection. Do these pathways
    operate the same way in human scrub typhus encephalitis, where the CNS is rarely
    sampled?
  rationale: >-
    Evidence for the CNS arm exists and is internally coherent, but it is predominantly
    murine, so its translational validity rather than its existence is the open question
    - which is what distinguishes this from a plain knowledge gap. The monocyte arm of
    this entry is anchored partly in patient mononuclear cells and so is on firmer human
    ground; the brain-specific mechanism is not. Human CNS validation matters because
    interferon-directed or barrier-directed adjunctive therapy would be prescribed on the
    strength of exactly these pathways.
  evidence:
  - reference: PMID:37426673
    reference_title: >-
      Brain transcriptomics reveal the activation of neuroinflammation pathways during
      acute Orientia tsutsugamushi infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This study provides new insights into neuroinflammation in scrub typhus,
      highlighting the impact of excessive IFN responses, microglial activation, and BBB
      dysregulation on disease pathogenesis.
    explanation: >-
      The murine brain RNA-seq study that is the source of the interferon, microglial
      and blood-brain-barrier mechanism whose human validity this discussion questions.
      Evidence source is MODEL_ORGANISM, which is precisely the mismatch at issue.
  - reference: PMID:37426673
    reference_title: >-
      Brain transcriptomics reveal the activation of neuroinflammation pathways during
      acute Orientia tsutsugamushi infection in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By using a well-established murine model of severe scrub typhus and brain RNA-seq,
      we studied the brain transcriptome dynamics and identified the activated
      neuroinflammation pathways.
    explanation: >-
      States explicitly that the evidence base for this mechanism is a murine model and
      mouse brain transcriptomics, establishing the model-to-human gap.
  proposed_experiments:
  - experiment_id: scrub-typhus-human-csf-validation
    name: Human CSF and neuroimaging validation of the murine neuroinflammation programme
    description: >-
      In patients with scrub typhus-associated acute encephalitis syndrome, measure CSF
      interferon-stimulated protein signatures, microglial activation markers and
      barrier-integrity indices, and compare the pattern against the murine brain
      transcriptome programme.
    readouts:
    - name: Concordance of human CSF interferon and barrier markers with the murine programme
      target: pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
    would_support:
    - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response

- discussion_id: orientia-strain-variation
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#TSA56-Fibronectin Binding and Integrin-Mediated Host Cell Entry
  - pathophysiology#Eschar Formation at the Inoculation Site
  - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response
  prompt: >-
    Orientia tsutsugamushi is antigenically extremely diverse - Karp-like, Kato-like,
    Gilliam-like and JG-like strains circulate in different proportions across India alone, and
    the diversity is defined by the very TSA56 protein this entry models as the adhesin. Two
    strain-dependent observations are unexplained: it is postulated that some strains produce
    eschars less commonly than other antigenic types, and dual RNA-seq of two clinical isolates
    found them driving divergent host programmes, with the Karp strain associated with
    IL33-linked responses and UT176 with IL6-mediated inflammation, differences that tracked
    relative virulence in mice. Does strain genotype determine eschar formation, host
    inflammatory programme, and severity in humans?
  rationale: >-
    This bears directly on three curated nodes. If TSA56 variation alters adhesion or entry,
    that is a property of this entry's molecular node, not a bystander observation. If it
    determines whether an eschar forms, then eschar frequency is not a single number at all -
    which would explain the wide geographic variation this entry already records (under 12% to
    over 46% between Indian states) as strain composition rather than examination technique,
    and would change how the diagnostic sign should be weighted regionally. And if strains
    drive different cytokine programmes, the interferon/M1 node is strain-conditioned rather
    than uniform. The practical obstacle is that most surveillance genotyping is done on the
    same TSA56 gene used for diagnosis, so genotype and detection are not independent.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is postulated that some strains produce eschars less commonly than other antigenic
      types.
    explanation: >-
      The eschar-strain link is stated as a postulate rather than a finding, which is the gap.
      Recorded as PARTIAL for that reason.
  - reference: PMID:32620750
    reference_title: >-
      Dual RNA-seq of Orientia tsutsugamushi informs on host-pathogen interactions for this
      neglected intracellular human pathogen.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Comparing the host response to two clinical isolates, we identify distinct immune
      response networks for each strain, leading to predictions of relative virulence that are
      validated in a mouse infection model.
    explanation: >-
      Establishes that different clinical isolates drive distinct host immune programmes with
      differing virulence. Evidence source is MODEL_ORGANISM because the virulence prediction
      was validated in mice.
  proposed_experiments:
  - experiment_id: orientia-genotype-phenotype-cohort
    name: Strain genotype versus eschar, cytokine programme and severity
    description: >-
      A prospective multi-site cohort in regions with differing circulating genotypes, in which
      infecting strain is typed by whole-genome sequencing rather than TSA56 alone, and
      correlated with eschar presence, host cytokine profile and severity - separating strain
      effects from examination technique and from host factors.
    readouts:
    - name: Eschar presence and host cytokine programme by infecting strain genotype
      target: pathophysiology#Eschar Formation at the Inoculation Site
    would_support:
    - pathophysiology#Eschar Formation at the Inoculation Site
    - pathophysiology#Type I Interferon-Driven M1 Monocyte Polarisation and Cytokine Response

notes: >-
  Pathograph edge semantics. Two edges were removed in review because they encoded clinical
  motivation rather than causation, which would export to KGX/cx2 as false causal assertions:
  eschar formation to multi-organ dysfunction (the eschar marks where disease began, it does
  not cause organ failure - its own description had conceded as much), and multi-organ
  dysfunction to the cell-penetrant-drug requirement (organ failure makes therapy urgent, it
  does not create the pharmacokinetic constraint). Both rationales are retained in the
  relevant node descriptions. All 13 nodes remain connected.

  The graph deliberately has four directed roots rather than one. Besides the trigger, the
  Ank13 effector, the bacterial ribosome and the bacterial envelope have no incoming edge
  because they are properties of the organism rather than consequences of the disease
  process - nothing in a human pathograph causes a bacterium to have a ribosome. That is a
  different situation from an orphaned host node and is intentional.

  Frequency discipline. Bands in this entry come only from pooled meta-analytic proportions,
  never from severity-selected cohorts. Eschar is banded from a 34,002-case eschar-specific
  meta-analysis; thirteen further phenotypes are banded from the pooled prevalences of a
  systematic review of two decades of Indian literature. The INTREST organ-involvement
  percentages (respiratory 62%, hepatic 54%, cardiovascular 42%, renal 30%, neurologic 20%)
  are quoted in phenotype descriptions for their clinical value but are deliberately NOT
  mapped to FrequencyEnum, because that cohort was selected for severe disease with at least
  one organ involved.

  The cardiac phenotypes make the reason for that rule concrete. The severity-selected trial
  reports cardiovascular complications in 42% of patients; the population-representative
  systematic review reports myocarditis in 4%. Both numbers are curated, each labelled with
  its cohort, and the frequency band is taken from the population figure - so the entry
  records myocarditis as VERY_RARE while still carrying the severe-disease number in prose.
  Banding from the trial arm would have overstated cardiac involvement roughly tenfold.

  All banded percentages remain India-weighted, and several (eschar most clearly) vary
  substantially by region and possibly by circulating strain - see the
  `orientia-strain-variation` discussion.

  Module conformance: this entry conforms to both nodes of
  `intracellular_pathogen_persistence` and to the translation node of
  `bacterial_protein_synthesis_inhibition`, following the pattern established by
  `Murine_Typhus` and `Oroya_Fever`. It deliberately does NOT conform to
  `bacterial_cell_wall_synthesis_inhibition#Intrinsic Resistance in Cell-Wall-Deficient
  Organisms` despite the classic report that Orientia lacks peptidoglycan, because that
  finding is contested by later structural work - see the `orientia-peptidoglycan-status`
  discussion.

  Orphanet: ORPHA:83317 is the Orphanet concept for scrub typhus and would be a natural
  additional evidence source for epidemiology and clinical description. It is not cited
  here because `just refresh-orphadata` currently fails with a drifted bulk-file sha256
  against the pinned manifest, so no fresh ORPHA cache entry could be produced.

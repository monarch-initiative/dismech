prevalence:
- population: India (pooled published case reports and series, 2003-2023)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    A systematic review of two decades of Indian literature accumulated 47,650
    reported cases with a 5% case-fatality rate across the 35,243 cases for which
    outcome was evaluable, and found infections rising since 2010. This is a count of
    cases appearing in the literature, not a rate against a population denominator, so
    no prevalence class or normalised rate is asserted.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub
      typhus in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The case fatality rate was 5% out of 35 243 cases.
    explanation: >-
      Pooled case-fatality across the Indian literature. Recorded as a literature case
      count rather than a population prevalence because the review has no denominator.
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub
      typhus in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there has been a notable increase in infections since 2010, peaking in 2019 and
      2022
    explanation: >-
      Documents the rising trend in reported scrub typhus in India over the review
      window.
- population: Asia-Pacific region (population at risk)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    More than one billion people live in the Asia-Pacific area where scrub typhus is
    endemic. This is a population-at-risk figure, not an occurrence measure, and is
    recorded here only to scale the public-health importance of the disease.
  evidence:
  - reference: PMID:36339235
    reference_title: >-
      How meteorological factors impacting on scrub typhus incidences in the main
      epidemic areas of 10 provinces, China, 2006-2018.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Scrub typhus, caused by Orientia tsutsugamushi, is a serious public health
      problem in the Asia-Pacific region, threatening the health of more than one
      billion people.
    explanation: >-
      Supports the scale of the at-risk population. Explicitly not curated as a
      prevalence or incidence measure.

environmental:
- name: Agricultural and forest-dependent occupational exposure to chigger habitat
  description: >-
    Scrub typhus is fundamentally an exposure disease: risk is set by contact with the
    vegetation where infected Leptotrombidium larvae wait for a host. Agricultural practice
    and work in or near forested land are the dominant behavioural determinants, and Indian
    states with agricultural and forest-dependent lifestyles show correspondingly high
    prevalence. This is why the disease clusters occupationally and seasonally rather than
    person-to-person - there is no human-to-human transmission at all.
  exposure_term:
    preferred_term: occupational exposure to chigger-infested vegetation through agricultural
      and forest work
  notes: >-
    Deliberately left unbound to an ontology term. ECTO was searched for arthropod-vector,
    agricultural and occupational exposure concepts and no adequate match was found; per the
    project rule that no term beats a bad one, a free-text preferred_term is retained rather
    than forcing an approximate CURIE.
  influences_mechanisms:
  - target: Chigger-Borne Dermal Inoculation of Orientia tsutsugamushi
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Entering chigger habitat is the route by which a larval mite reaches human skin and
      inoculates the organism; without that contact the initiating event cannot occur.
    evidence:
    - reference: PMID:40754340
      reference_title: >-
        Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
        in India: a systematic review and meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Behavioural aspects of human activities that are linked to the danger of chigger
        infestation include agricultural practices and exposure to forested regions.
      explanation: >-
        Names agricultural practice and forest exposure as the behavioural determinants of
        chigger contact, which is the initiating event of this entry's pathograph.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      possibly due to agricultural and forest-dependent lifestyles, which increase exposure to
      vector habitats
    explanation: >-
      Links high regional prevalence to agricultural and forest-dependent lifestyles through
      increased vector-habitat exposure.

- name: Peridomestic exposure through firewood storage and livestock proximity
  description: >-
    Beyond occupational exposure, domestic living conditions that bring rodent and mite
    habitat up against the house - stored firewood, close proximity to livestock - are
    associated with moderate regional prevalence. This matters practically because it is the
    arm of exposure that is modifiable by household measures rather than by changing
    someone's occupation.
  exposure_term:
    preferred_term: peridomestic exposure to chigger habitat through firewood storage and
      livestock proximity
  notes: >-
    Unbound for the same reason as the occupational exposure above; ECTO has no adequate
    peridomestic-vector-habitat concept.
  influences_mechanisms:
  - target: Chigger-Borne Dermal Inoculation of Orientia tsutsugamushi
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Peridomestic mite habitat raises the probability of chigger contact at home rather than
      at work, but the intermediate step - mite population density around the dwelling - is
      inferred rather than measured in the cited source.
    evidence:
    - reference: PMID:40754340
      reference_title: >-
        Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
        in India: a systematic review and meta-analysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moderate prevalence in Odisha-30%, Haryana-23% and Uttar Pradesh-16% links scrub typhus
        to living conditions such as firewood storage and proximity to livestock.
      explanation: >-
        Associates regional prevalence with specific peridomestic living conditions.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moderate prevalence in Odisha-30%, Haryana-23% and Uttar Pradesh-16% links scrub typhus
      to living conditions such as firewood storage and proximity to livestock.
    explanation: >-
      Documents the peridomestic exposure association at population level.

- name: Ecological amplification of mite populations by bamboo flowering
  description: >-
    Mass bamboo flowering is followed by a rodent population surge and a corresponding
    increase in chigger abundance, and has been invoked to explain outbreak surges in
    north-east India. It is an unusually clean illustration of how the disease's epidemiology
    is driven by vector ecology rather than by anything about human immunity.
  exposure_term:
    preferred_term: ecological amplification of Leptotrombidium mite populations following
      bamboo flowering
  notes: >-
    Unbound; ECTO has no concept for a vector-population ecological event of this kind.
  influences_mechanisms:
  - target: Chigger-Borne Dermal Inoculation of Orientia tsutsugamushi
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A larger infected-mite population raises the community-level probability of inoculation;
      the intermediate rodent-host amplification step is described in the source as a link
      rather than demonstrated.
    evidence:
    - reference: PMID:40754340
      reference_title: >-
        Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
        in India: a systematic review and meta-analysis.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This surge may be linked to ecological changes like bamboo flowering, which boost mite
        populations.
      explanation: >-
        The source states the bamboo-flowering link as a possible explanation for a case surge.
        Recorded as PARTIAL because it is offered as a hypothesis rather than a demonstrated
        association.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This surge may be linked to ecological changes like bamboo flowering, which boost mite
      populations.
    explanation: >-
      Hedged in the source as a possible link, and recorded as PARTIAL for that reason.

diagnosis:
- name: Indirect immunofluorescence assay (reference standard serology)
  description: >-
    IFA for anti-Orientia antibodies is the CDC reference standard. Its practical problem is
    an availability inversion that shapes the whole diagnostic landscape of this disease: the
    reference test is rarely available in exactly the developing-country settings where scrub
    typhus is most prevalent. Paired acute and convalescent sera are needed for a definitive
    serological diagnosis, so IFA rarely informs the decision to treat.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Seroconversion or a fourfold rise in anti-Orientia tsutsugamushi antibody titre between
    paired acute and convalescent samples supports the diagnosis.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As per the Centre for Disease Control and Prevention, indirect immunofluorescence assay
      (IFA) is the reference standard, though it is rarely available in developing nations
      where prevalence is high.
    explanation: >-
      Establishes IFA as the reference standard and states the availability inversion that
      limits its practical use.

- name: Immunochromatographic rapid antibody tests
  description: >-
    Rapid ICTs using pooled Orientia cell lysates or recombinant p56 outer-membrane protein as
    antigen detect IgG, IgM and IgA with better sensitivity and specificity than IFA in field
    conditions and may eventually replace it. Sensitivity is only moderate at around 70% and
    rises with fever duration, so a negative test early in illness carries a substantial
    false-negative rate - which is precisely when the treatment decision has to be made.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Detection of IgM, IgG or IgA against O. tsutsugamushi supports the diagnosis; a negative
    result early in the febrile course does not exclude it.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ICTs detect IgG, IgM and IgA antibodies against O. tsutsugamushi with moderate
      sensitivity (~70%). Sensitivity increases with fever duration but has a substantial
      number of false negative results.
    explanation: >-
      Quantifies ICT sensitivity and states the time-dependence and false-negative rate that
      bound its clinical use.

- name: PCR detection of Orientia tsutsugamushi DNA
  description: >-
    PCR assays usually target outer-membrane-protein genes and may be more sensitive than
    serology, detecting Orientia DNA in blood even during persistent phases of infection
    without obvious clinical symptoms. PCR is best early, during the rickettsaemic phase that
    precedes seroconversion, which makes it complementary to serology rather than an
    alternative to it. It accounted for only 4.6% of diagnoses in the reviewed Indian
    literature.
  diagnosis_term:
    preferred_term: molecular diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Detection of O. tsutsugamushi DNA, commonly by amplification of the 56-kDa type-specific
    antigen gene, confirms infection.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCRs usually target the genes of outer membrane proteins. They may be more sensitive
      than serological tests detecting Orientia DNA in blood even during persistent phases of
      infection with no obvious clinical symptoms.
    explanation: >-
      Establishes the molecular target and the sensitivity advantage of PCR over serology.
  - reference: PMID:27645781
    reference_title: Comparison of Preferred Bite Sites Between Mites and Ticks on Humans in Korea.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      confirmed by indirect immunofluorescence assay or nested polymerase chain reaction on
      the 56-kDa type-specific antigen gene of Orientia tsutsugamushi
    explanation: >-
      Documents the 56-kDa type-specific antigen gene as the routine nested-PCR target, the
      same TSA56 gene that this entry models as the adhesin.

- name: Weil-Felix agglutination test
  description: >-
    An old, cheap OXK-antigen agglutination test with poor sensitivity of about 15% and
    specificity of about 96%, which is therefore not the preferred method. It is recorded here
    because of an implementation gap that is itself a finding: despite being the least reliable
    option, Weil-Felix was the primary diagnostic method in about 61% of cases across two
    decades of Indian literature, while PCR accounted for 4.6%. Any epidemiological figure
    drawn from that literature inherits the misclassification of a 15%-sensitivity test, which
    is a reason to treat reported case counts as underestimates.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Agglutination against Proteus OXK antigen; a positive result is suggestive but a negative
    result excludes very little given approximately 15% sensitivity.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While providing a cheap option for identifying rickettsial infections in resource-poor
      settings, the Weil-Felix agglutination test has poor sensitivity (~15%) and specificity
      (~96%) and is thus not preferred.
    explanation: >-
      Quantifies the poor performance of the Weil-Felix test and states that it is not the
      preferred method.
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary choice of diagnosis in the reviewed studies was the Weil-Felix test, based on
      ~61% of the cases
    explanation: >-
      Documents the implementation gap - the least reliable test was the most used - which is
      why reported case counts from this literature should be read as underestimates.

- name: Clinical recognition of the eschar
  description: >-
    Careful whole-body examination for an eschar remains a decisive bedside step because the
    lesion is pathognomonic when found. It is present in only a minority of patients and
    concentrates on the trunk, groin and axilla, so it is missed unless covered areas are
    deliberately examined; eliciting it by directed history and examination is associated with
    correct diagnosis at the first visit.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A necrotic, black-crusted ulcer with an erythematous halo at a chigger attachment site is
    pathognomonic; its absence does not exclude the diagnosis.
  evidence:
  - reference: PMID:42160320
    reference_title: How rash and eschar came to clinical attention in scrub typhus and Japanese spotted fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In endemic settings, patients correctly diagnosed at the first visit to a participating
      site more often had rash and eschar brought to clinical attention in specific ways.
      Directed inquiry about skin symptoms and careful examination for eschar may help
      recognition in routine care.
    explanation: >-
      States the study's finding that deliberately eliciting rash and eschar is associated with
      correct diagnosis at the first visit, and the practice recommendation that follows.
  - reference: PMID:39282546
    reference_title: >-
      Frequency and distribution of eschar in patients with scrub typhus in India: systematic
      review of literature and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a need to create awareness amongst physicians of the need for thorough physical
      examination.
    explanation: >-
      States the practical conclusion that follows from eschars concentrating on covered body
      areas.

treatments:
- name: Doxycycline
  description: >-
    A tetracycline and the standard first-line agent for scrub typhus in adults and
    children. It satisfies both mechanistic constraints simultaneously: it binds the
    30S ribosomal subunit, which is the drug target in this organism, and it
    accumulates intracellularly, so it reaches an organism replicating free in the host
    cytosol. Because laboratory confirmation is usually retrospective, treatment is
    started empirically on clinical suspicion.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the 30S ribosomal subunit and arrests bacterial protein
      synthesis, the molecular target that makes a tetracycline first-line.
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      Doxycycline accumulates intracellularly and therefore reaches the cytosolic
      organism that beta-lactams cannot.
  evidence:
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we compared the efficacy of intravenous doxycycline, azithromycin, or a
      combination of both in treating severe scrub typhus
    explanation: >-
      Establishes doxycycline as one of the two standard agents evaluated in the
      definitive randomised trial of severe scrub typhus.
  - reference: PMID:42126901
    reference_title: >-
      Eschars and estate fever: A case series from the Johorean oil palm heartland
      highlighting the changing face of scrub typhus in Malaysia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients achieved clinical defervescence and symptomatic improvement within
      24-48 hours of doxycycline initiation, consistent with the characteristic brisk
      antimicrobial response.
    explanation: >-
      Documents the rapid defervescence on doxycycline that is characteristic of
      treated scrub typhus.

- name: Azithromycin
  description: >-
    A macrolide with efficacy equivalent to doxycycline in adults and in children, and
    the preferred agent in pregnancy where tetracyclines are avoided. It acts on the
    50S ribosomal subunit - a different site on the same target - and, like
    doxycycline, concentrates intracellularly.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Azithromycin binds the 50S ribosomal subunit and blocks nascent-chain elongation,
      acting on the same ribosomal target as doxycycline by a different mechanism.
  - target: Requirement for Cell-Penetrant Antimicrobials
    description: >-
      Azithromycin achieves high intracellular concentrations, satisfying the
      cell-penetration requirement imposed by the cytosolic niche.
  evidence:
  - reference: PMID:37773623
    reference_title: >-
      Open-labeled Randomized Controlled Trial on Efficacy of Azithromycin Versus
      Doxycycline in Pediatric Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AZ and DX had comparable rates of defervescence among children with scrub typhus.
    explanation: >-
      Randomised comparison establishing azithromycin as equivalent to doxycycline in
      paediatric scrub typhus.
  - reference: PMID:37773623
    reference_title: >-
      Open-labeled Randomized Controlled Trial on Efficacy of Azithromycin Versus
      Doxycycline in Pediatric Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Macrolides, especially azithromycin (AZ), have been found to be equally
      efficacious as DX for treating scrub typhus in adults.
    explanation: >-
      States the prior adult equivalence that motivates azithromycin as an alternative
      first-line agent.

- name: Combination intravenous doxycycline plus azithromycin for severe disease
  description: >-
    In severe scrub typhus with organ involvement, combining the two ribosome-active
    agents outperformed either alone. In a 794-patient double-blind randomised trial
    the composite outcome of death, persistent complications or persistent fever
    occurred in 33% with combination therapy versus 47% with doxycycline and 48% with
    azithromycin, with no difference between the two monotherapies and no excess of
    adverse events. This is the current evidence-based regimen for severe disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Both agents inhibit the same bacterial ribosome at different subunits, which is
      the mechanistic rationale for combining them.
  - target: Multi-Organ Vascular Leak and End-Organ Dysfunction
    description: >-
      Faster and more complete bacterial clearance limits progression of the
      vasculitic organ injury that defines severe disease.
  evidence:
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combination therapy with intravenous doxycycline and azithromycin was a better
      therapeutic option for the treatment of severe scrub typhus than monotherapy with
      either drug alone.
    explanation: >-
      The trial's primary conclusion, establishing combination therapy as superior in
      severe scrub typhus.
  - reference: PMID:36856615
    reference_title: Intravenous Doxycycline, Azithromycin, or Both for Severe Scrub Typhus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of combination therapy resulted in a lower incidence of the composite
      primary outcome than the use of doxycycline (33% and 47%, respectively)
    explanation: >-
      Quantifies the benefit of combination therapy over doxycycline monotherapy on the
      composite primary outcome.

- name: Chloramphenicol
  description: >-
    The historical treatment for scrub typhus and still an option where the first-line agents
    cannot be used. Its role is now limited by toxicity in exactly the groups that most need an
    alternative: it is avoided in pregnancy and not prescribed to neonates. That constraint,
    together with the teratogenicity of tetracyclines in pregnancy and their effect on
    children's teeth, is what makes azithromycin the agent of choice in pregnancy rather than
    a mere alternative.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: chloramphenicol
      term:
        id: CHEBI:17698
        label: chloramphenicol
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Orientia Ribosomal Translation (Tetracycline and Macrolide Target)
    treatment_effect: INHIBITS
    description: >-
      Chloramphenicol binds the 50S ribosomal subunit and blocks peptidyl transferase, acting
      on the same bacterial ribosome as the first-line agents.
  evidence:
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Historically, scrub typhus has been treated with chloramphenicol. However, its use in
      pregnant women and infants is fraught with complications, due to which it is avoided in
      pregnancy and not prescribed to neonates.
    explanation: >-
      Establishes chloramphenicol as an effective historical agent while stating the toxicity
      constraints that limit it. Recorded as PARTIAL because the same sentence both supports
      and restricts the treatment.
  - reference: PMID:40754340
    reference_title: >-
      Spatiotemporal epidemiology and clinical manifestations of two decades of scrub typhus
      in India: a systematic review and meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the same time, tetracycline is contraindicated during pregnancy due to teratogenicity,
      and it can discolour children's teeth.
    explanation: >-
      Supplies the counterpart constraint on tetracyclines that jointly determines agent choice
      in pregnancy and childhood.

clinical_trials:
- name: NCT03083197
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    The Scrub Typhus Antibiotic Resistance Trial (START): an open-label randomised
    comparison of 7 days of oral doxycycline, 3 days of oral doxycycline and 3 days of
    oral azithromycin in patients with acute scrub typhus, conducted in an area of
    reported antimicrobial resistance. It is the trial that directly addresses the
    reduced-susceptibility question recorded in the
    `orientia-doxycycline-susceptibility` discussion.
  target_phenotypes:
  - preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: clinicaltrials:NCT03083197
    reference_title: "The Scrub Typhus Antibiotic Resistance Trial (START) Comparing Doxycycline and Azithromycin Treatment Modalities in Areas of Reported Antimicrobial Resistance for Scrub Typhus"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary Objective: To evaluate the clinical and microbiological responses in
      scrub typhus patients to three oral treatment regimens: 7 days of doxycycline, 3
      days of doxycycline, and 3 days of azithromycin
    explanation: >-
      States the trial's objective, which is to compare the two ribosome-active
      first-line agents and duration in an area of reported resistance.

- name: NCT00351182
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    A controlled trial of a 5-day course of telithromycin versus doxycycline for mild
    to moderate scrub typhus, motivated by the need for agents usable in pregnancy and
    childhood and active against strains with reduced doxycycline susceptibility.
    Telithromycin is a ketolide and therefore also acts on the bacterial ribosome.
  target_phenotypes:
  - preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: clinicaltrials:NCT00351182
    reference_title: "Phase 3 Study of Controlled Trial: 5-day Course of Telithromycin Versus Doxycycline for the Treatment of Mild to Moderate Scrub Typhus"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study was designed to prove the clinical usefulness of telithromycin by
      comparing it with doxycycline for treating mild or moderate scrub typhus.
    explanation: >-
      States the trial's design and comparator, supporting telithromycin as an

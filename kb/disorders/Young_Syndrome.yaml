name: Young Syndrome
creation_date: "2026-10-14T16:50:49Z"
category: Complex
disease_term:
  preferred_term: Young syndrome
  term:
    id: MONDO:0010220
    label: Young syndrome
synonyms:
- Young's syndrome
- sinusitis-infertility syndrome
- Barry-Perkins-Young syndrome
description: >-
  Young syndrome is the combination of obstructive azoospermia with chronic sinusitis,
  bronchitis or bronchiectasis in men whose spermatogenesis is normal, whose sweat chloride
  is normal, and whose respiratory cilia are structurally normal. The azoospermia is caused
  by obstruction of the head (caput) of the epididymis by inspissated secretions, and lung
  mucociliary clearance is reduced although ciliary beat frequency and axonemal ultrastructure
  are normal, which points to abnormal secretions rather than a primary ciliary defect. The
  only documented aetiological factor is childhood mercury intoxication (pink disease), and
  the frequency of the syndrome fell in men born after mercurous chloride was withdrawn from
  teething powders. A single CFAP221 compound-heterozygous patient with the full triad has
  been reported and classified as primary ciliary dyskinesia, which is the basis of the
  MONDO causal-gene link; whether Young syndrome is a distinct entity or a phenotype shared
  by mercury injury and mild central-apparatus primary ciliary dyskinesia is unresolved.
notes: >-
  Curated as a Disease for the clinical triad named by MONDO:0010220. The upstream cause is
  heterogeneous (historical childhood mercury exposure; one CFAP221 case), but the
  tissue-level mechanism that defines the syndrome (inspissated secretions obstructing the
  caput epididymidis and impairing mucociliary clearance with structurally normal cilia) is
  shared. CFAP221 is curated as a Definitive primary ciliary dyskinesia gene in
  Primary_Ciliary_Dyskinesia; it is recorded here with relationship_type UNKNOWN because the
  only patient with the Young syndrome phenotype and CFAP221 variants was diagnosed with PCD
  by the reporting authors. CFTR is not causal in typical Young syndrome (no excess of CFTR
  mutations over the carrier frequency in two screened series).
references:
- reference: PMID:30969689
  title: Young Syndrome.
  tags:
  - StatPearls
mechanistic_hypotheses:
- hypothesis_group_id: abnormal_secretions
  hypothesis_label: Abnormal viscous secretions with normal cilia
  status: CANONICAL
  description: >-
    The classical account of the syndrome: abnormally viscous airway and epididymal
    secretions impair mucociliary clearance and obstruct the caput epididymidis, while the
    cilia are normal. The secretion defect itself has been inferred rather than measured.
    Childhood mercury exposure is the proposed upstream cause within this account.
  evidence:
  - reference: PMID:6689737
    reference_title: "Young's syndrome. Obstructive azoospermia and chronic sinopulmonary infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the azoospermia is due to obstruction of the epididymis by inspissated secretions"
    explanation: The founding clinical series attributes the obstruction to inspissated secretions.
- hypothesis_group_id: mercury_secretory_injury
  hypothesis_label: Childhood mercury intoxication leading to abnormal airway and epididymal secretions
  status: ALTERNATIVE
  description: >-
    Young syndrome as a late consequence of infant exposure to mercurous chloride (pink
    disease). Supported only by birth-cohort epidemiology; no histological or experimental
    study shows how the exposure alters secretions.
  evidence:
  - reference: PMID:19128521
    reference_title: "Does Young's syndrome exist?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The only documented aetiological factor is mercury exposure in childhood, an event that is seldom currently encountered; this would support our theory of the extinction of the condition."
    explanation: Literature review identifying childhood mercury exposure as the only documented cause.
- hypothesis_group_id: c1d_central_apparatus_pcd
  hypothesis_label: Unrecognized C1d central-apparatus primary ciliary dyskinesia
  status: EMERGING
  description: >-
    Some patients given the Young syndrome diagnosis may have primary ciliary dyskinesia
    caused by defects of the C1d projection (CFAP221 and related genes), which leaves ciliary
    ultrastructure, situs and nasal nitric oxide normal and so evades the tests used to
    exclude PCD. Supported by one CFAP221 patient with the triad.
  evidence:
  - reference: PMID:38960684
    reference_title: "Primary Ciliary Dyskinesia Due to Compound Heterozygous Variants in CFAP221 with Obstructive Azoospermia: Young's Syndrome May Be a Phenotype of Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinguishing PCD from Young's syndrome in patients with the triad of obstructive azoospermia, sinusitis, and bronchiectasis is challenging. Young's syndrome may be a phenotype of PCD."
    explanation: The reporting authors propose Young syndrome as a PCD phenotype after finding CFAP221 variants.
prevalence:
- population: Men with obstructive azoospermia (historical clinical series)
  measure_type: UNKNOWN
  notes: >-
    No population estimate exists. The founding series suggested a frequency comparable
    to Klinefelter syndrome, and later birth-cohort data show the syndrome becoming much
    rarer in men born after 1955.
  evidence:
  - reference: PMID:6689737
    reference_title: "Young's syndrome. Obstructive azoospermia and chronic sinopulmonary infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest that Young's syndrome has a prevalence comparable to that of Klinefelter's syndrome and is a common cause of both chronic sinopulmonary infection and azoospermia."
    explanation: The only stated frequency estimate, offered as a suggestion rather than a measurement.
  - reference: PMID:8292944
    reference_title: "Was Young's syndrome caused by exposure to mercury in childhood?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of Young's syndrome fell significantly from 114 (50%) of 227 men born up to 1955 to eight (17%) of 47 men born since then."
    explanation: Proportion of men with epididymal obstruction who had Young syndrome, by birth cohort.
diagnosis:
- name: Sweat chloride and pancreatic function testing
  description: Normal sweat chloride and pancreatic function exclude cystic fibrosis.
  evidence:
  - reference: PMID:7551394
    reference_title: "Screening Young syndrome patients for CFTR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The sweat chloride concentration was normal in all patients (mean = 29 mEq/L; range, 8 to 43 mEq/L)."
    explanation: Sweat chloride was normal in all 13 patients.
- name: Nasal potential difference
  description: Normal nasal potential difference argues against a CFTR-related disorder.
  evidence:
  - reference: PMID:7551394
    reference_title: "Screening Young syndrome patients for CFTR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young syndrome is characterized by obstructive azoospermia associated with chronic sinobronchial disease of an infectious nature, but normal sweat-gland and pancreatic function as well as normal nasal potential differences."
    explanation: Normal nasal potential difference is part of the characterization.
- name: Ciliary electron microscopy and genetic testing
  description: >-
    Normal ciliary ultrastructure is expected, but it does not exclude C1d-defective
    primary ciliary dyskinesia, which needs genetic testing.
  evidence:
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with C1d-defective primary ciliary dyskinesia elude diagnosis when using the current diagnostic algorithm. To enable diagnosis, genetic testing should be prioritised in future diagnostic guidelines."
    explanation: Standard PCD tests miss C1d defects, so genetic testing is required to separate them from Young syndrome.
pathophysiology:
- name: Central Apparatus C1d Projection Defect
  description: >-
    Biallelic loss-of-function CFAP221 variants disturb the C1d projection of the ciliary
    central apparatus. Ultrastructure by electron microscopy, situs and nasal nitric oxide are
    normal, but beating is asynchronous and ciliary transport is insufficient. Recorded as
    the upstream lesion of the PCD hypothesis only.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP221
    term:
      id: hgnc:33720
      label: CFAP221
  evidence:
  - reference: PMID:39362668
    reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C1d-defective primary ciliary dyskinesia is associated with normal situs composition, normal nasal nitric oxide production rates, normal ciliary ultrastructure by transmission electron microscopy and normal ciliary beating by high-speed videomicroscopy analysis."
    explanation: Explains why C1d defects evade the tests used to separate Young syndrome from PCD.
  - reference: PMID:40250778
    reference_title: "A novel pathogenic variant of CFAP221 is a cause of a mild form of primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subtle abnormalities in the protein composition of the ciliary central apparatus were consistent with the asynchronous, circular motion of cilia and reduced ciliary beat frequency in the proband"
    explanation: Central-apparatus composition defect and abnormal beating in a CFAP221 patient.
  downstream:
  - target: Impaired Mucociliary Clearance
    causal_link_type: DIRECT
    hypothesis_groups:
    - c1d_central_apparatus_pcd
    evidence:
    - reference: PMID:39362668
      reference_title: "Pathogenic variants in CFAP46, CFAP54, CFAP74 and CFAP221 cause primary ciliary dyskinesia with a defective C1d projection of the central apparatus."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we could show by in vitro ciliary transport assays that affected individuals exhibit insufficient ciliary clearance"
      explanation: Patient-cell transport assays show the C1d defect impairs clearance.
  - target: Inspissated Secretion Obstruction of the Caput Epididymidis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - c1d_central_apparatus_pcd
    description: >-
      Proposed route: failure of motile cilia in the efferent ducts impairs sperm transport
      and produces a proximal obstruction. Not demonstrated for CFAP221; the reported
      CFAP221 patient had obstructive azoospermia with normal sperm structure.
    evidence:
    - reference: PMID:38960684
      reference_title: "Primary Ciliary Dyskinesia Due to Compound Heterozygous Variants in CFAP221 with Obstructive Azoospermia: Young's Syndrome May Be a Phenotype of Primary Ciliary Dyskinesia."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "recent suggestions indicate that the impairment of efferent duct ciliary motility is also a factor in male infertility"
      explanation: >-
        Background statement that efferent-duct ciliary dysfunction can cause male
        infertility, offered by the authors as the link between PCD and obstructive
        azoospermia in their CFAP221 patient; inference, not a CFAP221-specific result.
- name: Abnormally Viscous Respiratory and Reproductive Secretions
  description: >-
    Respiratory and epididymal secretions are abnormally thick and viscous. The defect has
    been inferred from the combination of impaired clearance with structurally and
    functionally normal cilia; no specific mucin or ion-transport lesion has been identified.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: mucus secretion
    term:
      id: GO:0070254
      label: mucus secretion
  evidence:
  - reference: PMID:30969689
    reference_title: "Young Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Individuals with Young syndrome have structurally normal lung parenchyma and cilia but produce abnormally thick, viscous respiratory and reproductive secretions."
    explanation: StatPearls synthesis stating the secretion abnormality as the core lesion of the syndrome.
  - reference: PMID:1387740
    reference_title: "Mucociliary function, ciliary ultrastructure, and ciliary orientation in Young's syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be due to a structural defect but is more likely to be a consequence of abnormal mucus"
    explanation: >-
      In 20 patients, the only ciliary finding (distal axoneme disorientation) was attributed
      by the authors to abnormal mucus rather than a ciliary defect; the abnormal-mucus claim
      is an inference from this observation.
  - reference: PMID:1387740
    reference_title: "Mucociliary function, ciliary ultrastructure, and ciliary orientation in Young's syndrome."
    supports: REFUTE
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "No defect of cilia or mucus has been detected in Young's syndrome."
    explanation: >-
      No mucus defect had been directly demonstrated when this study was published; the
      viscous-secretion lesion remains inferred rather than measured.
  downstream:
  - target: Impaired Mucociliary Clearance
    causal_link_type: DIRECT
    hypothesis_groups:
    - abnormal_secretions
    evidence:
    - reference: PMID:30969689
      reference_title: "Young Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the lungs, this thick and tenacious mucus impairs mucociliary clearance, predisposing patients to recurrent lower respiratory tract infections and progressive bronchiectasis."
      explanation: States that the viscous mucus is what impairs mucociliary clearance.
  - target: Inspissated Secretion Obstruction of the Caput Epididymidis
    causal_link_type: DIRECT
    hypothesis_groups:
    - abnormal_secretions
    evidence:
    - reference: PMID:6689737
      reference_title: "Young's syndrome. Obstructive azoospermia and chronic sinopulmonary infections."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the azoospermia is due to obstruction of the epididymis by inspissated secretions"
      explanation: In 29 men, the epididymal obstruction was attributed to inspissated secretions.
- name: Impaired Mucociliary Clearance
  description: >-
    Lung mucociliary transport is reduced. In classic series ciliary beat frequency,
    microtubular structure and dynein arm number are normal, so the defect was attributed to
    the secretions rather than the cilia; a C1d central-apparatus defect would also impair
    clearance without visible ultrastructural change.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: respiratory tract multiciliated cell
    term:
      id: CL:4030034
      label: respiratory tract multiciliated cell
  biological_processes:
  - preferred_term: mucociliary clearance
    modifier: DECREASED
    term:
      id: GO:0120197
      label: mucociliary clearance
  evidence:
  - reference: PMID:7307631
    reference_title: "Lung mucociliary clearance in patients wit Young's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lung mucociliary transport was significantly reduced in patients with Young's syndrome compared to 14 control subjects matched for physical characteristics, tobacco consumption and initial topographic distribution of tracer particles within the lungs."
    explanation: Radioaerosol measurement of reduced lung mucociliary transport in 14 patients versus matched controls.
  - reference: PMID:1387740
    reference_title: "Mucociliary function, ciliary ultrastructure, and ciliary orientation in Young's syndrome."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Mucociliary clearance is impaired in patients with Young's syndrome (obstructive azoospermia with recurrent sinobronchial disease), cystic fibrosis, and primary ciliary dyskinesia."
    explanation: States the clearance impairment as established background to the study.
  - reference: PMID:1387740
    reference_title: "Mucociliary function, ciliary ultrastructure, and ciliary orientation in Young's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ciliary beat frequency and the incidence of microtubular defects and numbers of dynein arms did not differ between patients with Young's syndrome and control subjects."
    explanation: Rules out a ciliary cause in classic cases; the cilia beat normally and are ultrastructurally normal.
  - reference: PMID:9213847
    reference_title: "[Clinical features and ultrastructure of primary ciliary dyskinesia and Young syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with YS did not have pathognomonic ultrastructural changes, whereas patients with PCD had a large number of ciliary abnormalities"
    explanation: Rules out a ciliary ultrastructural lesion; electron microscopy separates Young syndrome from primary ciliary dyskinesia.
  downstream:
  - target: Chronic sinusitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Recurrent lower respiratory tract infections
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30969689
      reference_title: "Young Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In the lungs, this thick and tenacious mucus impairs mucociliary clearance, predisposing patients to recurrent lower respiratory tract infections and progressive bronchiectasis."
      explanation: Links impaired clearance to recurrent lower respiratory tract infections.
- name: Inspissated Secretion Obstruction of the Caput Epididymidis
  description: >-
    The block lies in the head of the epididymis (a "capital" block), with lipid
    accumulation in the ductuli efferentes. Spermatogenesis is intact. Capital blocks
    respond poorly to reconstructive surgery.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: epididymis secretory cell
    term:
      id: CL:1001590
      label: epididymis secretory cell
  evidence:
  - reference: PMID:8292944
    reference_title: "Was Young's syndrome caused by exposure to mercury in childhood?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "146 men had hold up in the head of the epididymis (capital blocks): 119 (82%) had Young's syndrome"
    explanation: In 274 men with obstructive azoospermia, Young syndrome concentrated in obstruction of the epididymal head.
  - reference: PMID:2241062
    reference_title: "Testicular obstruction: clinicopathological studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor results were obtained with capital blocks (patency 12%, pregnancy 3%), in which substantial lipid accumulation was demonstrated in the ductuli efferentes; three-quarters of these patients had sinusitis, bronchitis or bronchiectasis (Young's syndrome)."
    explanation: Histology of capital blocks (lipid accumulation in the efferent ducts) in a cohort mostly with Young syndrome.
  - reference: PMID:15204683
    reference_title: "Young's syndrome associated with situs inversus totalis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "scrotal exploration revealed the distended caput, but atrophic body to tail, of the epididymis. Light microscopy of testicular biopsy showed normal spermatogensis"
    explanation: Case-level anatomy of a caput epididymidis block with normal spermatogenesis.
  downstream:
  - target: Obstructive azoospermia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30969689
      reference_title: "Young Syndrome."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Spermatogenesis itself is intact, and functional obstruction prevents sperm from reaching the ejaculate, resulting in obstructive azoospermia."
      explanation: Obstruction rather than failed spermatogenesis produces the azoospermia.

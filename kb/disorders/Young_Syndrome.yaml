      id: hgnc:1884
      label: CFTR
  relationship_type: DISPUTED
  notes: >-
    Screened because CFTR causes congenital bilateral absence of the vas deferens; no excess
    of CFTR mutations was found in two series of Young syndrome patients. Both screened
    panels of common mutations or selected exons rather than the whole gene, so rare CFTR
    alleles are not excluded.
  evidence:
  - reference: PMID:7551394
    reference_title: "Screening Young syndrome patients for CFTR mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of CFTR mutations (1 in 26) did not differ significantly from the expected carrier frequency in this population. In summary, it is unlikely that the typical Young syndrome patient has a clinical disease associated with CFTR mutation on both alleles."
    explanation: CFTR mutation frequency at carrier background in 13 patients.
  - reference: PMID:7539448
    reference_title: "Obstructive azoospermia with agenesis of vas deferens or with bronchiectasia (Young's syndrome): a genetic approach."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In Young's syndrome, no CF mutations were detected."
    explanation: No CFTR mutations in 12 patients screened, in contrast to 77% in congenital absence of the vas deferens.
environmental:
- name: Childhood mercury intoxication (pink disease)
  description: >-
    Exposure in infancy to mercurous chloride (calomel) in teething powders and worm
    medication. The frequency of Young syndrome among men with obstructive azoospermia fell
    for those born after calomel was removed from these products in the United Kingdom,
    in parallel with the decline of pink disease.
  exposure_term:
    preferred_term: exposure to mercury
    term:
      id: ECTO:0001571
      label: exposure to mercury
  evidence:
  - reference: PMID:8292944
    reference_title: "Was Young's syndrome caused by exposure to mercury in childhood?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of Young's syndrome fell significantly from 114 (50%) of 227 men born up to 1955 to eight (17%) of 47 men born since then."
    explanation: Birth-cohort decline coinciding with withdrawal of calomel from teething powders.
  - reference: PMID:40287162
    reference_title: "Mercury exposure, pink disease and Young's syndrome: a forgotten public health disaster."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report details a case of a man who suffered from pink disease as a child following his mother applying teething powder containing inorganic mercury to his gums for 12 weeks, from the age of 6 months."
    explanation: >-
      Case of childhood mercury intoxication followed by infertility and bronchiectasis; the
      authors leave open whether the later disease is Young syndrome.
  influences_mechanisms:
  - target: Abnormally Viscous Respiratory and Reproductive Secretions
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Epidemiological association only; the mechanism by which childhood mercury exposure
      would alter secretions in adulthood is unknown.
    evidence:
    - reference: PMID:8292944
      reference_title: "Was Young's syndrome caused by exposure to mercury in childhood?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The decline in incidence of Young's syndrome in those born after 1955 is similar to that observed with pink disease, suggesting that both conditions may have had a similar aetiology--mercury intoxication."
      explanation: The authors' inference of a shared mercury aetiology from parallel birth-cohort declines.
treatments:
- name: Epididymovasostomy
  description: >-
    Microsurgical bypass of the epididymal obstruction. Results are poor for the capital
    blocks typical of Young syndrome.
  therapeutic_modality: SURGERY
  notes: >-
    Bound to the bilateral NCIT term because NCIT has no unqualified epididymovasostomy
    concept (OLS search "epididymovasostomy" in ncit returned only NCIT:C219825); the
    obstruction in Young syndrome is bilateral.
  treatment_term:
    preferred_term: epididymovasostomy
    term:
      id: NCIT:C219825
      label: Bilateral Epididymovasostomy
  target_phenotypes:
  - preferred_term: Obstructive azoospermia
    term:
      id: HP:0011962
      label: Obstructive azoospermia
  evidence:
  - reference: PMID:2241062
    reference_title: "Testicular obstruction: clinicopathological studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Poor results were obtained with capital blocks (patency 12%, pregnancy 3%)"
    explanation: Low patency and pregnancy rates after reconstruction of capital blocks, the block type of Young syndrome.
  - reference: PMID:753515
    reference_title: "Obstructive azoospermia: respiratory function tests, electron microscopy and the results of surgery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty had epididymovasostomy, and in only 2 (6.5%) did the sperm count become normal"
    explanation: Low success of epididymovasostomy in a series where half the obstructions were Young syndrome.
- name: Testicular sperm extraction with intracytoplasmic sperm injection
  description: Spermatogenesis is normal, so sperm can be retrieved surgically for ICSI.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: testicular sperm extraction with intracytoplasmic sperm injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_phenotypes:
  - preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:15204683
    reference_title: "Young's syndrome associated with situs inversus totalis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "motile sperms were easily obtained by testicular sperm extraction"
    explanation: Sperm retrievable by testicular extraction because spermatogenesis is intact.
  - reference: PMID:38960684
    reference_title: "Primary Ciliary Dyskinesia Due to Compound Heterozygous Variants in CFAP221 with Obstructive Azoospermia: Young's Syndrome May Be a Phenotype of Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He later successfully fathered a baby through intracytoplasmic sperm injection using his wife's egg."
    explanation: Successful ICSI with testicular sperm in a patient with the triad.
- name: Antibiotic therapy
  description: Treatment of sinus and lower respiratory infections.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_phenotypes:
  - preferred_term: Recurrent lower respiratory tract infections
    term:
      id: HP:0002783
      label: Recurrent lower respiratory tract infections
  evidence:
  - reference: PMID:39119117
    reference_title: "Barry-Perkins-Young syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment involves control of sinus, lung infection and surgical/assisted measures for reproduction."
    explanation: Management is directed at infection control and assisted reproduction.
- name: Mucoregulatory agents
  description: Mucolytic and mucoregulatory drugs did not improve clearance, lung function or sperm count.
  treatment_term:
    preferred_term: mucoregulatory pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:3047900
    reference_title: "Efficacy of \"mucoregulatory\" agents in Young's syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no improvement in tracheobronchial clearance, pulmonary function, or sperm count."
    explanation: Randomised open crossover of four agents in eight patients showed no benefit.
differential_diagnoses:
- name: Cystic fibrosis
  disease_term:
    preferred_term: cystic fibrosis
    term:
      id: MONDO:0009061
      label: cystic fibrosis
  distinguishing_features:
  - Normal sweat chloride, normal pancreatic function and normal nasal potential difference in Young syndrome.
  evidence:
  - reference: PMID:7551394
    reference_title: "Screening Young syndrome patients for CFTR mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young syndrome is characterized by obstructive azoospermia associated with chronic sinobronchial disease of an infectious nature, but normal sweat-gland and pancreatic function as well as normal nasal potential differences."
    explanation: Features that separate Young syndrome from cystic fibrosis.
- name: Primary ciliary dyskinesia
  disease_term:
    preferred_term: primary ciliary dyskinesia
    term:
      id: MONDO:0016575
      label: primary ciliary dyskinesia
  distinguishing_features:
  - Normal ciliary ultrastructure and beat frequency in Young syndrome.
  - Azoospermia rather than immotile sperm.
  - Central-apparatus forms of PCD (CFAP221) can also show normal ultrastructure and normal nasal nitric oxide, so genetic testing is needed to separate them.
  evidence:
  - reference: PMID:9213847
    reference_title: "[Clinical features and ultrastructure of primary ciliary dyskinesia and Young syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The seminogram showed azoospermia in cases with YS and hypospermia with marked hypomotility in cases with PCD."
    explanation: Semen findings separate the two conditions.
  - reference: PMID:38960684
    reference_title: "Primary Ciliary Dyskinesia Due to Compound Heterozygous Variants in CFAP221 with Obstructive Azoospermia: Young's Syndrome May Be a Phenotype of Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Distinguishing PCD from Young's syndrome in patients with the triad of obstructive azoospermia, sinusitis, and bronchiectasis is challenging. Young's syndrome may be a phenotype of PCD."
    explanation: Overlap with central-apparatus PCD.

genetic:
- name: CFAP221
  gene_term:
    preferred_term: CFAP221
    term:
      id: hgnc:33720
      label: CFAP221
  relationship_type: UNKNOWN
  notes: >-
    MONDO's causal-gene assertion. The only reported patient with the Young syndrome triad
    and CFAP221 variants carried compound heterozygous loss-of-function alleles, had normal
    ciliary ultrastructure and normal nasal nitric oxide, and was diagnosed with primary
    ciliary dyskinesia by the reporting authors. CFAP221 is a component of the C1d projection
    of the ciliary central apparatus.
  evidence:
  - reference: PMID:38960684
    reference_title: "Primary Ciliary Dyskinesia Due to Compound Heterozygous Variants in CFAP221 with Obstructive Azoospermia: Young's Syndrome May Be a Phenotype of Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Young's syndrome was suspected based on the triad of obstructive azoospermia, sinusitis, and bronchiectasis. He had normal electron microscopy findings, normal nasal nitric oxide levels (116 nL/min), and no situs inversus. However, we found compound heterozygous variants considered pathogenic in CFAP221. This led to a diagnosis of primary ciliary dyskinesia (PCD)."
    explanation: Single case linking CFAP221 to the Young syndrome triad; the authors classify it as PCD.

name: Marinesco-Sjogren Syndrome
creation_date: "2026-08-30T06:20:00Z"
category: Mendelian
parents:
- Hereditary Ataxia
- Congenital Myopathy
- Protein Misfolding Disease
synonyms:
- MSS
- Marinesco-Sjogren-Garland syndrome
- cerebellar ataxia-cataract-myopathy syndrome
- hereditary oligophrenic cerebellolental degeneration
disease_term:
  preferred_term: Marinesco-Sjogren syndrome
  term:
    id: MONDO:0009567
    label: Marinesco-Sjogren syndrome
description: >-
  Marinesco-Sjogren syndrome (MSS) is an autosomal recessive multisystem
  disorder defined by the triad of cerebellar ataxia with cerebellar atrophy,
  early-onset cataracts, and chronic progressive vacuolar myopathy, with
  variable intellectual disability, hypergonadotropic hypogonadism, short
  stature and skeletal abnormalities. It is a disease of endoplasmic reticulum
  proteostasis: biallelic loss-of-function variants in SIL1 remove the adenine
  nucleotide exchange factor that drives the ATPase cycle of BiP/HSPA5, the
  master ER chaperone. Without nucleotide exchange, BiP cannot release its
  folded clients, unfolded protein accumulates in the ER lumen, and the
  unfolded protein response — particularly its PERK branch — is chronically
  engaged. Cerebellar Purkinje neurons, skeletal muscle fibres and the lens are
  the cells that fail first. The mechanism is well enough understood that the
  key experiments are already genetic rescues rather than descriptive studies:
  overexpressing the parallel exchange factor HYOU1/ORP150 rescues
  neurodegeneration in Sil1-null mice, and pharmacological PERK inhibition
  delays Purkinje cell loss. What is not settled is the disease's own
  boundaries — SIL1 variants are found in only about 60% of patients with the
  full triad.
definitions:
- name: Clinical triad and molecular case definition
  definition_type: CASE_DEFINITION
  description: >-
    Diagnosis rests on typical clinical findings — cerebellar ataxia,
    early-onset cataracts and myopathy — and/or biallelic pathogenic SIL1
    variants. Cataracts are essentially universal beyond age 7 but may be
    absent in infants, so their absence in a young child does not exclude the
    diagnosis.
  scope: Disease-level case ascertainment for MSS.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of MSS is established in an individual with typical clinical
      findings and/or biallelic pathogenic variants in SIL1 identified by
      molecular genetic testing.
    explanation: >-
      The GeneReviews chapter states the diagnostic criteria directly.
  - reference: PMID:24176978
    reference_title: SIL1 mutations and clinical spectrum in patients with Marinesco-Sjogren syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cataracts were observed in all patients beyond the age of 7 years, but
      might be missing in infants.
    explanation: >-
      Qualifies the age-dependence of the cataract criterion, which is what makes
      the triad unreliable in young children.
progression:
- phase: Infantile hypotonia and motor delay
  age_range: Early infancy
  notes: >-
    Children usually present first with muscular hypotonia in early infancy,
    before any cerebellar sign is apparent.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with MSS usually present with muscular hypotonia in early
      infancy; distal and proximal muscular weakness is noticed during the first
      decade of life.
    explanation: >-
      GeneReviews states the earliest presenting feature and the timing of
      weakness.
- phase: First-decade weakness and emerging cerebellar signs
  age_range: First decade of life
  notes: >-
    Distal and proximal weakness appears through the first decade, after which
    truncal ataxia, dysdiadochokinesia, nystagmus and dysarthria become
    apparent. Cataracts typically require lens extraction within the same
    decade.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Later, cerebellar findings of truncal ataxia, dysdiadochokinesia,
      nystagmus, and dysarthria become apparent.
    explanation: >-
      Establishes that cerebellar signs follow the neuromuscular presentation.
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cataracts can develop rapidly and typically require lens extraction in the
      first decade of life.
    explanation: >-
      Establishes the timing and surgical consequence of the cataract phenotype.
- phase: Progression then plateau, with near-normal life span
  notes: >-
    Motor function worsens for some years and then stabilises at an
    unpredictable age and degree of severity. This plateau is an important and
    somewhat counterintuitive feature: despite severe disability in many adults,
    life span appears near normal, which makes MSS a chronic disability disorder
    rather than a progressive fatal neurodegeneration.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Motor function worsens progressively for some years, then stabilizes at an
      unpredictable age and degree of severity.
    explanation: >-
      GeneReviews documents the progression-then-plateau course.
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although many adults have severe disabilities, life span in MSS appears to
      be near normal.
    explanation: >-
      Supports the near-normal life expectancy despite severe disability.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry homozygous or compound heterozygous SIL1
    variants; parents are presumed heterozygous carriers with a 25% recurrence
    risk per pregnancy.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSS is inherited in an autosomal recessive manner.
    explanation: >-
      GeneReviews states the mode of inheritance.
genetic:
- name: SIL1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SIL1
    term:
      id: hgnc:24624
      label: SIL1
  notes: >-
    SIL1 encodes an adenine nucleotide exchange factor for the ER chaperone
    HSPA5/BiP. Pathogenic variants are predominantly loss-of-function —
    nonsense, frameshift, splice-site, and single- or multi-exon deletions —
    and, notably, produce severely reduced SIL1 protein regardless of variant
    type or position. That uniform effect on protein level is the proposed
    explanation for why an allelically heterogeneous disease has a relatively
    homogeneous phenotype.
  evidence:
  - reference: PMID:16282978
    reference_title: The gene disrupted in Marinesco-Sjögren syndrome encodes SIL1, an HSPA5 cochaperone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four disease-associated, predicted loss-of-function
      mutations in SIL1, which encodes a nucleotide exchange factor for the
      heat-shock protein 70 (HSP70) chaperone HSPA5.
    explanation: >-
      One of the two independent 2005 gene-discovery studies, establishing the
      causal gene and its molecular role.
  - reference: PMID:16282977
    reference_title: Mutations in SIL1 cause Marinesco-Sjögren syndrome, a cerebellar ataxia with cataract and myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found nine distinct mutations that would disrupt the SIL1 protein in
      individuals with Marinesco-Sjögren syndrome, an autosomal recessive
      cerebellar ataxia complicated by cataracts, developmental delay and
      myopathy.
    explanation: >-
      The independently published companion gene-discovery study.
  - reference: PMID:24176978
    reference_title: SIL1 mutations and clinical spectrum in patients with Marinesco-Sjogren syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examination of mutant SIL1 expression in cultured patient lymphoblasts
      suggested that SIL1 mutations result in severely reduced SIL1 protein
      levels irrespective of the type and position of mutations.
    explanation: >-
      Supports the uniform loss-of-protein consequence across a heterogeneous
      allelic spectrum.
- name: HYOU1
  relationship_type: MODIFIER
  gene_term:
    preferred_term: HYOU1
    term:
      id: hgnc:16931
      label: HYOU1
  notes: >-
    HYOU1/ORP150 is a nucleotide exchange factor that works in parallel to SIL1.
    Its dosage modifies the phenotype bidirectionally in Sil1-null mice, which
    is what makes it a modifier rather than an incidental correlate:
    overexpression prevents ER stress and rescues neurodegeneration, and
    reduced expression makes it worse. Established in mouse; no human modifier
    effect has been demonstrated.
  evidence:
  - reference: PMID:19801575
    reference_title: Alteration of the unfolded protein response modifies neurodegeneration in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      overexpression of HYOU1/ORP150, an exchange factor that works in parallel
      to SIL1, prevents ER stress and rescues neurodegeneration in Sil1(-/-)
      mice, whereas decreasing expression of HYOU1 exacerbates these phenotypes.
    explanation: >-
      The bidirectional dosage effect that establishes HYOU1 as a modifier.
- name: DNAJC3
  relationship_type: MODIFIER
  gene_term:
    preferred_term: DNAJC3
    term:
      id: hgnc:9439
      label: DNAJC3
  notes: >-
    DNAJC3/p58IPK is an ER co-chaperone that promotes ATP hydrolysis by BiP.
    Its loss ameliorates ER stress and neurodegeneration in Sil1-null mice.
    Note the direction: losing a second chaperone component improves the
    phenotype, which is what points to the nucleotide-exchange cycle itself
    rather than chaperone capacity as the thing that is broken. Established in
    mouse only.
  evidence:
  - reference: PMID:19801575
    reference_title: Alteration of the unfolded protein response modifies neurodegeneration in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, loss of DNAJC3/p58(IPK), a co-chaperone that promotes ATP
      hydrolysis by BiP, ameliorates ER stress and neurodegeneration in
      Sil1(-/-) mice.
    explanation: >-
      The rescue-by-loss result establishing DNAJC3 as a modifier.
  - reference: PMID:19801575
    reference_title: Alteration of the unfolded protein response modifies neurodegeneration in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings suggest that alterations in the nucleotide exchange cycle
      of BiP cause ER stress and neurodegeneration in Sil1-deficient mice.
    explanation: >-
      States the interpretation that makes both modifier effects coherent.
pathophysiology:
- name: SIL1 Loss of Nucleotide Exchange Factor Activity
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: SIL1
      term:
        id: hgnc:24624
        label: SIL1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic loss-of-function variants leave severely reduced SIL1 protein,
      abolishing its adenine nucleotide exchange activity toward BiP/HSPA5.
      Reported alleles are nonsense, frameshift, splice-site and single- or
      multi-exon deletions; patients are homozygous or compound heterozygous.
  molecular_functions:
  - preferred_term: adenine nucleotide exchange factor activity toward BiP
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000774
      label: adenyl-nucleotide exchange factor activity
  evidence:
  - reference: PMID:16282977
    reference_title: Mutations in SIL1 cause Marinesco-Sjögren syndrome, a cerebellar ataxia with cataract and myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SIL1 (also called BAP) acts as a nucleotide exchange factor for the Hsp70
      chaperone BiP (also called GRP78), which is a key regulator of the main
      functions of the endoplasmic reticulum.
    explanation: >-
      States the molecular function that is lost, and its target chaperone.
  downstream:
  - target: Stalled BiP Chaperone Cycle
    causal_link_type: DIRECT
    description: >-
      Without nucleotide exchange, BiP cannot complete its ATPase cycle and
      remains bound to client proteins.
    evidence:
    - reference: PMID:39180052
      reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The folding of newly synthesised proteins involves the ATPase cycle of
        BiP, therefore the loss of Sil1 impairs both the BiP cycle and protein
        folding
      explanation: >-
        States the direct mechanistic consequence of SIL1 loss for the BiP
        cycle.
- name: Stalled BiP Chaperone Cycle
  biological_scale: MOLECULAR
  description: >-
    BiP remains associated with its client proteins instead of releasing folded
    cargo, so the chaperone pool is functionally sequestered. This is the step
    that converts a nucleotide-exchange defect into a folding defect.
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  evidence:
  - reference: PMID:39180052
    reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Specifically, BiP remains associated with its client proteins, causing the
      accumulation of unfolded proteins, endoplasmic reticulum (ER) stress and
      activation of the unfolded protein response (UPR).
    explanation: >-
      Names the sequestration step and its immediate consequences.
  downstream:
  - target: ER Accumulation of Unfolded Protein and ER Stress
    causal_link_type: DIRECT
    description: >-
      Client proteins that BiP cannot release accumulate unfolded in the ER
      lumen, producing ER stress.
    evidence:
    - reference: PMID:16282978
      reference_title: The gene disrupted in Marinesco-Sjögren syndrome encodes SIL1, an HSPA5 cochaperone.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data, together with the similar spatial and temporal patterns of
        tissue expression of Sil1 and Hspa5, suggest that disturbed SIL1-HSPA5
        interaction and protein folding is the primary pathology in
        Marinesco-Sjögren syndrome.
      explanation: >-
        The gene-discovery paper identifies disturbed folding as the primary
        pathology.
- name: ER Accumulation of Unfolded Protein and ER Stress
  biological_scale: CELLULAR
  description: >-
    Unfolded protein accumulates in the ER lumen and intracellular protein
    inclusions form. In woozy mouse Purkinje cells the inclusions are found in
    both ER and nucleus, and the unfolded protein response is upregulated.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:16116427
    reference_title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Affected cells have intracellular protein accumulations reminiscent of
      protein inclusions in both the ER and the nucleus. In addition,
      upregulation of the unfolded protein response, suggestive of ER stress,
      occurs in mutant Purkinje cells.
    explanation: >-
      Directly observes protein accumulation and UPR activation in the affected
      cell type in the Sil1-mutant mouse.
  downstream:
  - target: PERK-Branch Unfolded Protein Response Activation
    causal_link_type: DIRECT
    description: >-
      Sustained ER stress engages the UPR, with the PERK branch activated in
      degenerating neurons.
    evidence:
    - reference: PMID:29718201
      reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Because the PERK branch of the unfolded protein response is activated in
        degenerating neurons of woozy mice
      explanation: >-
        States that the PERK branch specifically is activated in the degenerating
        cells.
  - target: Secretory Pathway Trafficking Failure
    causal_link_type: DIRECT
    description: >-
      Impaired ER folding delays ER-to-plasma-membrane transport, with cargo
      retained in ER and Golgi.
    evidence:
    - reference: PMID:30293566
      reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SIL1-interefered cells also had delayed ER-to-plasma membrane transport
        with retention of Na+/K+-ATPase and procollagen-I in the ER and Golgi,
        and increased apoptosis.
      explanation: >-
        Directly measures the trafficking defect and names the retained cargoes.
- name: PERK-Branch Unfolded Protein Response Activation
  biological_scale: CELLULAR
  description: >-
    The PERK arm of the UPR is the branch that drives degeneration in this
    disease. Its causal role is established by rescue rather than correlation:
    the PERK inhibitor GSK2606414 delays Purkinje cell degeneration and motor
    deficits in woozy mice, and attenuates secretory-pathway abnormalities and
    cell death in SIL1-knockdown cells.
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
  evidence:
  - reference: PMID:29718201
    reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GSK2606414 delayed Purkinje cell degeneration and the onset of motor
      deficits, prolonging the asymptomatic phase of the disease; it also reduced
      the skeletal muscle abnormalities and improved motor performance during the
      symptomatic phase.
    explanation: >-
      Pharmacological inhibition of this node rescues the downstream phenotype,
      which is what places it on the causal path rather than beside it.
  downstream:
  - target: Cerebellar Purkinje Neuron Degeneration
    causal_link_type: DIRECT
    description: >-
      Chronic PERK-branch signalling in Purkinje neurons, terminally
      differentiated cells with a high secretory load, culminates in apoptotic
      degeneration.
    evidence:
    - reference: PMID:30293566
      reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The PERK pathway of the unfolded protein response was activated in
        SIL1-interfered cells, and the PERK inhibitor GSK2606414 attenuated the
        morphological and functional alterations of the secretory pathway, and
        significantly reduced cell death.
      directness: INDIRECT
      explanation: >-
        Inhibiting PERK reduces cell death in a SIL1-deficient cell model, which
        supports PERK signalling as the route from ER stress to cell loss. The
        model is HeLa rather than a vulnerable MSS cell type.
  - target: Skeletal Muscle Fibre Degeneration
    causal_link_type: DIRECT
    description: >-
      The same PERK-branch signalling drives the muscle arm. The evidence is the
      same rescue argument used for Purkinje cells: PERK inhibition reduced the
      skeletal muscle abnormalities and improved motor performance, so the
      branch is on the causal path to muscle degeneration too, not only to
      neurodegeneration.
    evidence:
    - reference: PMID:29718201
      reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        it also reduced the skeletal muscle abnormalities and improved motor
        performance during the symptomatic phase
      explanation: >-
        A rescue result covering the muscle arm specifically, which is what
        places PERK upstream of this node rather than only of the Purkinje one.
- name: Secretory Pathway Trafficking Failure
  biological_scale: CELLULAR
  description: >-
    Beyond folding failure, SIL1 loss disorganises the secretory route itself:
    ER chaperone aggregation, an enlarged Golgi, accumulated autophagic vacuoles
    and mitochondrial swelling. This is the node that connects a chaperone
    defect to the extracellular matrix and connective-tissue features, since
    procollagen is one of the retained cargoes.
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30293566
    reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence and ultrastructural analysis of SIL1-knocked-down cells
      detected ER chaperone aggregation, enlargement of the Golgi complex,
      increased autophagic vacuoles, and mitochondrial swelling.
    explanation: >-
      Catalogues the organelle-level lesions defining this node.
  downstream:
  - target: Aberrant Extracellular Matrix Assembly
    causal_link_type: DIRECT
    description: >-
      Impaired secretion of matrix cargo yields an abnormal extracellular
      matrix, reduced matrix remodelling capacity and disorganised collagen.
    evidence:
    - reference: PMID:39180052
      reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional assays showed that patient fibroblasts have a reduced capacity
        of ECM remodelling, reduced motility, and slower spreading during
        adhesion to Petri dishes.
      explanation: >-
        Measures the matrix consequence in patient-derived cells.
- name: Aberrant Extracellular Matrix Assembly
  biological_scale: TISSUE
  description: >-
    Patient fibroblasts produce structurally abnormal matrix filaments, and the
    woozy mouse shows disorganised collagen at the myotendinous junction and
    Achilles tendon. The authors propose aberrant ECM as a unifying explanation
    for the skeletal, muscular, lens and connective-tissue features — a claim
    about scope that goes beyond what has been demonstrated, and is recorded
    here as their proposal rather than as established fact.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:39180052
    reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      structural analysis of the myotendinous junction of the soleus muscle and
      surrounding regions of the Achilles tendon revealed a disorganization of
      collagen fibres in the mouse model of MSS (woozy).
    explanation: >-
      Demonstrates the tissue-level matrix lesion in the animal model.
- name: Cerebellar Purkinje Neuron Degeneration
  biological_scale: TISSUE
  description: >-
    Purkinje neurons are terminally differentiated cells with a heavy
    protein-folding load and are the first population to fail. Their loss
    produces the cerebellar syndrome.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:16116427
    reference_title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings provide evidence that perturbation of ER chaperone function
      in terminally differentiated neurons leads to protein accumulation, ER
      stress and subsequent neurodegeneration.
    explanation: >-
      Establishes the causal sequence from chaperone perturbation to
      neurodegeneration in terminally differentiated neurons.
  downstream:
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
    description: >-
      Loss of Purkinje neurons produces the ataxic phenotype.
    evidence:
    - reference: PMID:16116427
      reference_title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice homozygous with respect to the woozy (wz) mutation develop
        adult-onset ataxia with cerebellar Purkinje cell loss.
      directness: INDIRECT
      explanation: >-
        Couples Purkinje cell loss to ataxia in the model organism; the human
        cerebellar syndrome is evidenced on the phenotype itself.
- name: Skeletal Muscle Fibre Degeneration
  biological_scale: TISSUE
  description: >-
    A chronic vacuolar myopathy with sarcoplasmic reticulum alterations,
    autophagic vacuoles, mitochondrial changes and prominent myonuclear
    pathology including nuclear envelope and lamina alterations.
  cell_types:
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  evidence:
  - reference: PMID:24362440
    reference_title: Myopathy in Marinesco-Sjögren syndrome links endoplasmic reticulum chaperone dysfunction to nuclear envelope pathology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found severe, progressive myopathy characterized by alterations of the
      sarcoplasmic reticulum, accumulation of autophagic vacuoles,
      mitochondrial changes, and prominent myonuclear pathology including
      nuclear envelope and nuclear lamina alterations.
    explanation: >-
      Characterises the muscle lesion in the Sil1-mutant mouse.
  downstream:
  - target: Muscle weakness
    causal_link_type: DIRECT
    description: >-
      Progressive myopathy produces the distal and proximal weakness.
    evidence:
    - reference: PMID:24362440
      reference_title: Myopathy in Marinesco-Sjögren syndrome links endoplasmic reticulum chaperone dysfunction to nuclear envelope pathology.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Marinesco-Sjögren syndrome (MSS) features cerebellar ataxia, mental
        retardation, cataracts, and progressive vacuolar myopathy with peculiar
        myonuclear alterations.
      directness: INDIRECT
      explanation: >-

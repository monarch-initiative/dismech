  title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
notes: >-
  Named Entity Confusion notes, two of which are load-bearing.

  First, the MONDO stub for this disease carries "Marshall Smith Syndrome" as a
  synonym. That is a different disorder (NFIX-related) and it is not used
  anywhere in this entry; it was also kept out of literature searches. The
  synonyms recorded here are the ones that genuinely name MSS.

  Second, kb/disorders/Autosomal_Recessive_Cerebellar_Ataxia_With_Late_Onset_Spasticity.yaml
  curates a GBA2-related "Marinesco-Sjogren-LIKE syndrome". That is a
  phenocopy with a different gene and a different mechanism, not this disease,
  and no evidence was taken from it or cited into this entry.

  Deep research. One OpenScientist report was generated for this entry
  (research/Marinesco-Sjogren_Syndrome-deep-research-openscientist.md). Its
  reference validation was clean (16/16 verified), but its term validation set
  needs_review: true, and two of the flagged bindings were real errors that
  would have propagated into this entry had they been copied:

  - The report gives MONDO:0008541 as the MONDO ID for MSS. That CURIE resolves
    to "spermatic cord torsion". The correct term, MONDO:0009567, is the one
    used here and is the one the curation stub carries.
  - The report binds cerebellar/vermian atrophy to HP:0002151, which is
    "Increased circulating lactate concentration". Cerebellar atrophy is bound
    here to HP:0001272 instead.
  - The report also names GO:0036498 as PERK-mediated UPR; that CURIE is
    IRE1-mediated UPR. GO:0036499 is the PERK term and is what this entry uses.

  Review round 2 fixed two defects the round-1 node split had itself created:
  the muscle node was left without an incoming edge (it is now downstream of
  the PERK node, on the same rescue evidence that places PERK upstream of the
  Purkinje node), and the woozy model's muscle-phenocopy evidence was still
  attached to the Purkinje-only link, describing an arm that node no longer
  had. That evidence now supports its own RECAPITULATES link on the muscle
  node, with the perinuclear-membranous-structure readout. Splitting a bundled
  node is not finished when the node is split; every edge and every piece of
  evidence that pointed at the old node has to be re-aimed.

  Review round 1 (PR #10142) additionally corrected: one reference_title that
  belonged to a different paper; a folded scalar that split
  prenatal/preimplantation across a line break, which check-folded-hyphens does
  not catch because the break is at a slash rather than a hyphen; a
  pathophysiology node that bundled Purkinje, muscle and lens degeneration into
  one, whose lens arm had no evidence at all (it is now three nodes, and no lens
  node is modelled since nothing supports one); the absence of any edge from the
  pathograph into the phenotype layer; two treatment terms bound more generically
  than NCIT supports; and the HYOU1/DNAJC3 modifiers, which were prose in a notes
  field and are now genetic entries with relationship_type: MODIFIER.

  Most of the report's other "mislabelled" flags were an artefact of its
  phenotype table, whose "Type" column (Clinical sign, Lab abnormality) was
  parsed as the term label. Those CURIEs themselves resolve correctly and were
  used after checking each against the committed term cache.

  Prevalence is still omitted, and the reason has changed. The reviewer
  correctly pointed out that ORPHA is a structured source, so the route is
  `just structured-rebuild-orphanet --id 559` rather than `just
  fetch-reference`. That was tried. It needs data/orphadata/en_product1.xml,
  which is gitignored, and `just refresh-orphadata` fails with a checksum
  mismatch against the pinned MANIFEST — Orphadata has republished the file
  since the pin. Filed separately. So the prevalence is unobtainable in this
  environment rather than unattempted, and no record is invented in its place.

  Other deliberate omissions. Serum creatine kinase elevation: universally described but not stated
  in any abstract cached for this entry, so no biochemical record. Peripheral
  neuropathy and pyramidal signs: named in the deep-research phenotype table but
  not in a cached quotable source at the frequency asserted.

  Frequency bands are given only for ataxia, cataract and weakness, where the
  cited text supports "invariably associated" or "all patients beyond the age of
  7". Everything else is left unbanded rather than guessed.

genetic:
- name: SIL1
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SIL1
    term:
      id: hgnc:24624
      label: SIL1
  notes: >-
    SIL1 encodes an adenine nucleotide exchange factor for the ER chaperone
    HSPA5/BiP. Pathogenic variants are predominantly loss-of-function —
    nonsense, frameshift, splice-site, and single- or multi-exon deletions —
    and, notably, produce severely reduced SIL1 protein regardless of variant
    type or position. That uniform effect on protein level is the proposed
    explanation for why an allelically heterogeneous disease has a relatively
    homogeneous phenotype. HYOU1/ORP150 and DNAJC3/p58IPK are established
    genetic modifiers in the mouse.
  evidence:
  - reference: PMID:16282978
    reference_title: The gene disrupted in Marinesco-Sjögren syndrome encodes SIL1, an HSPA5 cochaperone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four disease-associated, predicted loss-of-function
      mutations in SIL1, which encodes a nucleotide exchange factor for the
      heat-shock protein 70 (HSP70) chaperone HSPA5.
    explanation: >-
      One of the two independent 2005 gene-discovery studies, establishing the
      causal gene and its molecular role.
  - reference: PMID:16282977
    reference_title: Mutations in SIL1 cause Marinesco-Sjögren syndrome, a cerebellar ataxia with cataract and myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found nine distinct mutations that would disrupt the SIL1 protein in
      individuals with Marinesco-Sjögren syndrome, an autosomal recessive
      cerebellar ataxia complicated by cataracts, developmental delay and
      myopathy.
    explanation: >-
      The independently published companion gene-discovery study.
  - reference: PMID:24176978
    reference_title: SIL1 mutations and clinical spectrum in patients with Marinesco-Sjogren syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Examination of mutant SIL1 expression in cultured patient lymphoblasts
      suggested that SIL1 mutations result in severely reduced SIL1 protein
      levels irrespective of the type and position of mutations.
    explanation: >-
      Supports the uniform loss-of-protein consequence across a heterogeneous
      allelic spectrum.
pathophysiology:
- name: SIL1 Loss of Nucleotide Exchange Factor Activity
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: SIL1
      term:
        id: hgnc:24624
        label: SIL1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic loss-of-function variants leave severely reduced SIL1 protein,
      abolishing its adenine nucleotide exchange activity toward BiP/HSPA5.
  molecular_functions:
  - preferred_term: adenine nucleotide exchange factor activity toward BiP
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000774
      label: adenyl-nucleotide exchange factor activity
  evidence:
  - reference: PMID:16282977
    reference_title: Mutations in SIL1 cause Marinesco-Sjögren syndrome, a cerebellar ataxia with cataract and myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SIL1 (also called BAP) acts as a nucleotide exchange factor for the Hsp70
      chaperone BiP (also called GRP78), which is a key regulator of the main
      functions of the endoplasmic reticulum.
    explanation: >-
      States the molecular function that is lost, and its target chaperone.
  downstream:
  - target: Stalled BiP Chaperone Cycle
    causal_link_type: DIRECT
    description: >-
      Without nucleotide exchange, BiP cannot complete its ATPase cycle and
      remains bound to client proteins.
    evidence:
    - reference: PMID:39180052
      reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The folding of newly synthesised proteins involves the ATPase cycle of
        BiP, therefore the loss of Sil1 impairs both the BiP cycle and protein
        folding
      explanation: >-
        States the direct mechanistic consequence of SIL1 loss for the BiP
        cycle.
- name: Stalled BiP Chaperone Cycle
  biological_scale: MOLECULAR
  description: >-
    BiP remains associated with its client proteins instead of releasing folded
    cargo, so the chaperone pool is functionally sequestered. This is the step
    that converts a nucleotide-exchange defect into a folding defect.
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  evidence:
  - reference: PMID:39180052
    reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Specifically, BiP remains associated with its client proteins, causing the
      accumulation of unfolded proteins, endoplasmic reticulum (ER) stress and
      activation of the unfolded protein response (UPR).
    explanation: >-
      Names the sequestration step and its immediate consequences.
  downstream:
  - target: ER Accumulation of Unfolded Protein and ER Stress
    causal_link_type: DIRECT
    description: >-
      Client proteins that BiP cannot release accumulate unfolded in the ER
      lumen, producing ER stress.
    evidence:
    - reference: PMID:16282978
      reference_title: The gene disrupted in Marinesco-Sjögren syndrome encodes SIL1, an HSPA5 cochaperone.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        These data, together with the similar spatial and temporal patterns of
        tissue expression of Sil1 and Hspa5, suggest that disturbed SIL1-HSPA5
        interaction and protein folding is the primary pathology in
        Marinesco-Sjögren syndrome.
      explanation: >-
        The gene-discovery paper identifies disturbed folding as the primary
        pathology.
- name: ER Accumulation of Unfolded Protein and ER Stress
  biological_scale: CELLULAR
  description: >-
    Unfolded protein accumulates in the ER lumen and intracellular protein
    inclusions form. In woozy mouse Purkinje cells the inclusions are found in
    both ER and nucleus, and the unfolded protein response is upregulated.
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:16116427
    reference_title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Affected cells have intracellular protein accumulations reminiscent of
      protein inclusions in both the ER and the nucleus. In addition,
      upregulation of the unfolded protein response, suggestive of ER stress,
      occurs in mutant Purkinje cells.
    explanation: >-
      Directly observes protein accumulation and UPR activation in the affected
      cell type in the Sil1-mutant mouse.
  downstream:
  - target: PERK-Branch Unfolded Protein Response Activation
    causal_link_type: DIRECT
    description: >-
      Sustained ER stress engages the UPR, with the PERK branch activated in
      degenerating neurons.
    evidence:
    - reference: PMID:29718201
      reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Because the PERK branch of the unfolded protein response is activated in
        degenerating neurons of woozy mice
      explanation: >-
        States that the PERK branch specifically is activated in the degenerating
        cells.
  - target: Secretory Pathway Trafficking Failure
    causal_link_type: DIRECT
    description: >-
      Impaired ER folding delays ER-to-plasma-membrane transport, with cargo
      retained in ER and Golgi.
    evidence:
    - reference: PMID:30293566
      reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        SIL1-interefered cells also had delayed ER-to-plasma membrane transport
        with retention of Na+/K+-ATPase and procollagen-I in the ER and Golgi,
        and increased apoptosis.
      explanation: >-
        Directly measures the trafficking defect and names the retained cargoes.
- name: PERK-Branch Unfolded Protein Response Activation
  biological_scale: CELLULAR
  description: >-
    The PERK arm of the UPR is the branch that drives degeneration in this
    disease. Its causal role is established by rescue rather than correlation:
    the PERK inhibitor GSK2606414 delays Purkinje cell degeneration and motor
    deficits in woozy mice, and attenuates secretory-pathway abnormalities and
    cell death in SIL1-knockdown cells.
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    modifier: INCREASED
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
  evidence:
  - reference: PMID:29718201
    reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GSK2606414 delayed Purkinje cell degeneration and the onset of motor
      deficits, prolonging the asymptomatic phase of the disease; it also reduced
      the skeletal muscle abnormalities and improved motor performance during the
      symptomatic phase.
    explanation: >-
      Pharmacological inhibition of this node rescues the downstream phenotype,
      which is what places it on the causal path rather than beside it.
  downstream:
  - target: Degeneration of Purkinje Neurons, Muscle Fibres and Lens
    causal_link_type: DIRECT
    description: >-
      Chronic PERK-branch signalling in cells with high secretory load
      culminates in apoptotic degeneration.
    evidence:
    - reference: PMID:30293566
      reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The PERK pathway of the unfolded protein response was activated in
        SIL1-interfered cells, and the PERK inhibitor GSK2606414 attenuated the
        morphological and functional alterations of the secretory pathway, and
        significantly reduced cell death.
      directness: INDIRECT
      explanation: >-
        Inhibiting PERK reduces cell death in a SIL1-deficient cell model, which
        supports PERK signalling as the route from ER stress to cell loss. The
        model is HeLa rather than a vulnerable MSS cell type.
- name: Secretory Pathway Trafficking Failure
  biological_scale: CELLULAR
  description: >-
    Beyond folding failure, SIL1 loss disorganises the secretory route itself:
    ER chaperone aggregation, an enlarged Golgi, accumulated autophagic vacuoles
    and mitochondrial swelling. This is the node that connects a chaperone
    defect to the extracellular matrix and connective-tissue features, since
    procollagen is one of the retained cargoes.
  biological_processes:
  - preferred_term: autophagy
    modifier: INCREASED
    term:
      id: GO:0006914
      label: autophagy
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:30293566
    reference_title: PERK inhibition attenuates the abnormalities of the secretory pathway and the increased apoptotic rate induced by SIL1 knockdown in HeLa cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence and ultrastructural analysis of SIL1-knocked-down cells
      detected ER chaperone aggregation, enlargement of the Golgi complex,
      increased autophagic vacuoles, and mitochondrial swelling.
    explanation: >-
      Catalogues the organelle-level lesions defining this node.
  downstream:
  - target: Aberrant Extracellular Matrix Assembly
    causal_link_type: DIRECT
    description: >-
      Impaired secretion of matrix cargo yields an abnormal extracellular
      matrix, reduced matrix remodelling capacity and disorganised collagen.
    evidence:
    - reference: PMID:39180052
      reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Functional assays showed that patient fibroblasts have a reduced capacity
        of ECM remodelling, reduced motility, and slower spreading during
        adhesion to Petri dishes.
      explanation: >-
        Measures the matrix consequence in patient-derived cells.
- name: Aberrant Extracellular Matrix Assembly
  biological_scale: TISSUE
  description: >-
    Patient fibroblasts produce structurally abnormal matrix filaments, and the
    woozy mouse shows disorganised collagen at the myotendinous junction and
    Achilles tendon. The authors propose aberrant ECM as a unifying explanation
    for the skeletal, muscular, lens and connective-tissue features — a claim
    about scope that goes beyond what has been demonstrated, and is recorded
    here as their proposal rather than as established fact.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  evidence:
  - reference: PMID:39180052
    reference_title: Sil1-deficient fibroblasts generate an aberrant extracellular matrix leading to tendon disorganisation in Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      structural analysis of the myotendinous junction of the soleus muscle and
      surrounding regions of the Achilles tendon revealed a disorganization of
      collagen fibres in the mouse model of MSS (woozy).
    explanation: >-
      Demonstrates the tissue-level matrix lesion in the animal model.
- name: Degeneration of Purkinje Neurons, Muscle Fibres and Lens
  biological_scale: TISSUE
  description: >-
    The three cell populations that fail are those with the heaviest
    protein-folding and secretory burden. Purkinje cell loss produces the
    cerebellar syndrome, vacuolar myopathy with autophagic vacuoles and
    myonuclear pathology produces the weakness, and lens involvement produces
    the cataracts.
  cell_types:
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  - preferred_term: skeletal muscle fibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: lens fibre cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:16116427
    reference_title: Protein accumulation and neurodegeneration in the woozy mutant mouse is caused by disruption of SIL1, a cochaperone of BiP.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings provide evidence that perturbation of ER chaperone function
      in terminally differentiated neurons leads to protein accumulation, ER
      stress and subsequent neurodegeneration.
    explanation: >-
      Establishes the causal sequence from chaperone perturbation to
      neurodegeneration in vivo.
  - reference: PMID:24362440
    reference_title: Myopathy in Marinesco-Sjögren syndrome links endoplasmic reticulum chaperone dysfunction to nuclear envelope pathology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found severe, progressive myopathy characterized by alterations of the
      sarcoplasmic reticulum, accumulation of autophagic vacuoles, mitochondrial
      changes, and prominent myonuclear pathology including nuclear envelope and
      nuclear lamina alterations.
    explanation: >-
      Characterises the muscle arm of this node in the mouse model.

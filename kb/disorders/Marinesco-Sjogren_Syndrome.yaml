histopathology:
- name: Vacuolar myopathy with myonuclear and nuclear envelope pathology
  description: >-
    Muscle shows a chronic vacuolar myopathy with sarcoplasmic reticulum
    alterations, autophagic vacuoles, mitochondrial changes and distinctive
    perinuclear membranous structures derived from the nuclear envelope and
    lamina. GeneReviews regards the electron-microscopic ultrastructural changes
    as specific to MSS, which makes muscle biopsy diagnostically informative
    rather than merely confirmatory.
  evidence:
  - reference: PMID:20301371
    reference_title: Marinesco-Sjögren Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopic ultrastructural changes on muscle biopsy are thought
      to be specific to MSS.
    explanation: >-
      Establishes the diagnostic specificity claim for the muscle ultrastructure.
  - reference: PMID:24362440
    reference_title: Myopathy in Marinesco-Sjögren syndrome links endoplasmic reticulum chaperone dysfunction to nuclear envelope pathology.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In particular, the presence of perinuclear membranous structures which
      have been reported as an ultrastructural hallmark of MSS-related myopathy
      could be confirmed in woozy muscles.
    explanation: >-
      Identifies the specific ultrastructural hallmark and confirms it in the
      animal model.

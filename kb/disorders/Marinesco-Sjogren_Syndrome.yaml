discussions:
- discussion_id: sil1_negative_mss_locus_heterogeneity
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes Marinesco-Sjogren syndrome in the 40% of patients with the full
    clinical triad who have no detectable SIL1 variant?
  attaches_to:
  - pathophysiology#SIL1 Loss of Nucleotide Exchange Factor Activity
  rationale: >-
    The mutation detection rate is 60% (15/25) among patients with the
    characteristic triad. That leaves a substantial minority whose disease is
    clinically indistinguishable but molecularly unexplained. Two readings are
    possible and the data do not separate them: either a second locus in the
    same BiP nucleotide-exchange pathway, or non-coding and structural SIL1
    variation missed by the screening used. The contrast with the sub-3%
    detection rate in patients with variable, non-triad phenotypes matters here
    — it says the triad is a sharp clinical entity, which makes an unexplained
    40% within it harder to dismiss as phenotypic overlap.
  evidence:
  - reference: PMID:24176978
    reference_title: SIL1 mutations and clinical spectrum in patients with Marinesco-Sjogren syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We obtained a mutation detection rate of 60% (15/25) among patients with
      the characteristic Marinesco-Sjögren syndrome triad (ataxia, cataracts,
      myopathy) whereas the detection rate in the group of patients with more
      variable phenotypic presentation was below 3% (1/37).
    explanation: >-
      Quantifies both the unexplained fraction within the triad and the
      specificity of the triad itself.
- discussion_id: perk_inhibition_translational_ceiling
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    PERK inhibition and HYOU1 overexpression both rescue Sil1-null mice. Does
    either represent a viable path in human MSS, given that the PERK inhibitor
    is pancreatotoxic and the human disease has already caused most of its
    damage by the time it is diagnosed?
  attaches_to:
  - pathophysiology#PERK-Branch Unfolded Protein Response Activation
  rationale: >-
    The mechanistic case is strong on the mouse side: GSK2606414 delays Purkinje
    degeneration and motor deficits and prolongs the asymptomatic phase, and
    genetic modulation of HYOU1 moves the phenotype in both directions. But the
    mouse benefit is measured largely as a delay in an asymptomatic phase, and
    treatment was started presymptomatically. Human MSS presents with hypotonia
    in infancy and cataracts within the first decade, so the equivalent window
    is one clinicians do not currently have access to. Whether a
    proteostasis-directed intervention started after diagnosis modifies the
    human course is untested, and is a different question from whether the
    pathway is causal — which the mouse work establishes.

    The 2025 follow-up sharpens this considerably, in a discouraging direction.
    Three agents chosen specifically to keep the mechanism while losing
    GSK2606414's pancreatic toxicity — trazodone and dibenzoylmethane as partial
    PERK inhibitors, TUDCA as a chemical chaperone — produced no benefit at all
    in the same model, on the same presymptomatic schedule, at doses active in
    other neurodegeneration models, and pharmacokinetics excluded altered drug
    metabolism as the explanation. So the failure is not obviously about
    exposure or timing, and the open question narrows: is anything short of full
    PERK inhibition sufficient, and if not, does a therapeutic window between
    efficacy and pancreatic toxicity exist at all?
  evidence:
  - reference: PMID:29718201
    reference_title: PERK inhibition delays neurodegeneration and improves motor function in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice were chronically treated with GSK2606414 starting from a
      presymptomatic stage, and the effects were evaluated on biochemical,
      histopathological and clinical readouts.
    explanation: >-
      The presymptomatic start is exactly the design feature that limits
      translation to a disease diagnosed after symptom onset.
  - reference: PMID:19801575
    reference_title: Alteration of the unfolded protein response modifies neurodegeneration in a mouse model of Marinesco-Sjögren syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      overexpression of HYOU1/ORP150, an exchange factor that works in parallel
      to SIL1, prevents ER stress and rescues neurodegeneration in Sil1(-/-)
      mice, whereas decreasing expression of HYOU1 exacerbates these phenotypes.
    explanation: >-
      Establishes the bidirectional genetic modifier effect that motivates the
      therapeutic hypothesis, in mice.
  - reference: PMID:39804912
    reference_title: "Trazodone, dibenzoylmethane and tauroursodeoxycholic acid do not prevent motor dysfunction and neurodegeneration in Marinesco-Sjögren syndrome mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      None of the treatments prevented motor dysfunction or PC degeneration in
      woozy mice, as assessed by beam walking, rotarod test, and calbindin
      immunohistochemistry.
    explanation: >-
      A directly relevant negative result. Three agents chosen precisely to
      avoid GSK2606414's pancreatic toxicity all failed in the same model and
      the same presymptomatic design in which GSK2606414 succeeded. Graded
      REFUTE because it argues against the proposition that the proteostasis
      strategy translates readily.
  - reference: PMID:39804912
    reference_title: "Trazodone, dibenzoylmethane and tauroursodeoxycholic acid do not prevent motor dysfunction and neurodegeneration in Marinesco-Sjögren syndrome mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pharmacokinetic studies excluded that the lack of effect was due to
      altered drug metabolism in woozy mice.
    explanation: >-
      Rules out the obvious confound, which is what makes the negative result
      informative rather than uninterpretable.
  - reference: PMID:39804912
    reference_title: "Trazodone, dibenzoylmethane and tauroursodeoxycholic acid do not prevent motor dysfunction and neurodegeneration in Marinesco-Sjögren syndrome mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This underscores the difficulty of translating neuroprotective strategies
      from other conditions to MSS, highlighting the need for more targeted
      therapeutic approaches.
    explanation: >-
      The authors' own reading, which is the substance of this discussion.

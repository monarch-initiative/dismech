name: Peroxisome Biogenesis Disorder 11B
creation_date: "2026-09-02T00:00:00Z"
description: >-
  Peroxisome biogenesis disorder 11B is the OMIM designation for the milder end of the
  PEX13 disease spectrum, corresponding to the presentations historically called
  neonatal adrenoleukodystrophy and infantile Refsum disease rather than classic
  Zellweger syndrome. It shares its gene and its core mechanism with peroxisome
  biogenesis disorder 11A and is separated from it by disease severity, not by a
  different lesion.

  PEX13 encodes a peroxin of the docking/translocation module. It first homodimerises
  and then binds PEX14 to assemble the module at the peroxisomal membrane, which is
  where a cargo-loaded PTS receptor arrives. Loss of function therefore blocks import
  of peroxisomal matrix proteins, and the downstream metabolic consequences run in two
  directions: very-long-chain fatty acids, phytanic and pipecolic acid and bile acid
  intermediates accumulate because peroxisomal oxidation fails, while plasmalogens are
  not made. PEX13 is one of the rarest ZSD genes - PEX1 and PEX6 together account for
  about three quarters of cases.

  Two mechanistic findings specific to this locus are worth curating rather than
  generalising from the wider ZSD literature. The recurrent p.Arg294Trp variant sits in
  the SH3 domain at a residue implicated in homodimerisation, and docking analysis
  predicts it destabilises the PEX13/PEX14 translocation module rather than abolishing
  the protein. And patient muscle and fibroblasts show mitochondrial mislocalisation
  and biochemical abnormalities of mitochondrial function alongside a reduced number of
  peroxisomes, which has raised secondary mitochondrial dysfunction as a contributing
  mechanism rather than an incidental finding.

  The clinical picture at this end of the spectrum lacks the congenital malformations
  of severe ZSD. Instead there is progressive peroxisomal failure: sensorineural
  hearing loss and retinal dystrophy, ataxia, polyneuropathy and leukodystrophy,
  hepatic dysfunction, adrenal insufficiency and renal oxalate stones. Hypotonia and
  developmental delay are usual, but intellect can be normal.

  A nosological caveat belongs on the front of this entry rather than buried in it.
  GeneReviews states that the term Zellweger spectrum disorder is now used for all
  individuals with a ZSD-PEX gene defect regardless of phenotype, precisely because the
  Zellweger syndrome / neonatal adrenoleukodystrophy / infantile Refsum disease
  divisions predate the biochemical and molecular understanding of the spectrum. The
  11A versus 11B split preserved by OMIM and MONDO is that superseded division applied
  to one gene. This entry is curated as the milder-end entity to match the ontology and
  the existing 11A entry, and the alternative - a single PEX13-related ZSD entry with
  severity subtypes - is recorded as an open question rather than silently taken.
category: Mendelian
synonyms:
- PBD11B
- peroxisome biogenesis disorder type 11B
- PEX13-related neonatal adrenoleukodystrophy
- PEX13-related Zellweger spectrum disorder, milder end

genetic:
- name: PEX13
  gene_term:
    preferred_term: PEX13
    term:
      id: hgnc:8855
      label: PEX13
  relationship_type: CAUSATIVE
  notes: >-
    PEX13 is one of the rarest ZSD genes. PEX1 and PEX6 account for about 60.5% and
    14.5% of ZSD respectively; only a few PEX13 variants had been reported before the
    2022 series. The recurrent p.Arg294Trp allele occurred in three of five families.
  evidence:
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PEX1 and PEX6 are the most commonly mutated genes in ZSDs, with a frequency of 60.5 and 14.5%, respectively. Conversely, only a few mutations have been identified so far in PEX13"
    explanation: Quantifies how rare this genetic subtype is relative to the common ZSD genes.
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three out of five families carried a recurrent p.Arg294Trp non-synonymous variant."
    explanation: Documents the recurrent allele that dominates the reported PEX13 cohort.
biochemical:
- name: Very-long-chain fatty acids
  context: >-
    VLCFA accumulate because peroxisomal beta-oxidation fails, and are the first-line
    biochemical screen for the Zellweger spectrum.
  evidence:
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "very long-chain fatty acids (VLCFA) metabolism, phytanic and pipecolic acid oxidation, or bile acid biosynthesis"
    explanation: Names VLCFA metabolism among the peroxisomal pathways that fail.
  notes: >-
    The PEX13 series reports VLCFA alterations as absent or not assessed in several
    affected individuals, so a normal VLCFA result does not exclude PEX13 disease at
    the milder end of the spectrum. That caveat is diagnostically important and is
    recorded here rather than as an evidenced claim, because it rests on a table of
    per-patient findings rather than on a quotable sentence.

    explanation: The recurrence risk quoted to families in genetic counselling.
pathophysiology:
- name: PEX13 Hypomorphic Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic PEX13 variants retaining partial function. The exemplar allele for this
    milder end is p.Ile326Thr: it is the one PEX13 variant reported in a patient
    labelled neonatal adrenoleukodystrophy rather than Zellweger spectrum, and it too
    sits in the SH3 domain.

    The recurrent p.Arg294Trp allele is described here as well because it carries the
    only mechanistic characterisation available for this gene - docking analysis
    predicting destabilised homodimerisation - but it is not the 11B exemplar: every
    reported p.Arg294Trp patient is labelled ZSD rather than NALD. The mechanism and
    the severity label come from different alleles, and this entry does not merge them.

    Severity does not track allele dose in the naive direction either. Compound
    heterozygotes carrying a missense allele opposite a loss-of-function allele were
    milder than missense homozygotes, which is the opposite of what a simple dosage
    model predicts.
  genetic_context:
    gene:
      preferred_term: PEX13
      term:
        id: hgnc:8855
        label: PEX13
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational predictions highlighted the involvement of the Arg294 residue in PEX13 homodimerization, and the analysis of blind docking predicted that the p.Arg294Trp variant alters the formation of dimers, impairing the stability of the PEX13/PEX14 translocation module."
    explanation: Supports a destabilising rather than abolishing lesion, and is graded COMPUTATIONAL because the claim rests on modelling and docking rather than on a functional assay.
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a more mildly affected patient with neonatal adrenoleukodystrophy (NALD), homozygous for a missense variant affecting a conserved residue (p.Ile326Thr) within the SH3 domain of PEX13"
    explanation: Identifies the one reported PEX13 allele associated with the milder NALD label rather than with ZSD, which is why it is named as the exemplar for this entry.
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "displayed a milder clinical severity, characterized by psychomotor regression and late-onset leukodystrophy, compared to Individual B."
    explanation: Records that compound heterozygotes were milder than missense homozygotes, which contradicts a naive dosage expectation and is why the description does not assert one.
  downstream:
  - target: Impaired Docking Translocation Module Assembly
    causal_link_type: DIRECT
- name: Impaired Docking Translocation Module Assembly
  biological_scale: MOLECULAR
  description: >-
    PEX13 homo-oligomerises and then binds PEX14 to complete the docking/translocation
    module at the peroxisomal membrane. A destabilised module cannot receive
    cargo-loaded PTS receptors efficiently.
  cellular_components:

discussions:
- discussion_id: pbd11a_vs_11b_split
  kind: CONTROVERSY
  attaches_to:
  - disease#
  prompt: >-
    Should PEX13-related disease be curated as separate 11A and 11B entries, or as one
    PEX13-related Zellweger spectrum disorder entry with severity subtypes?
  rationale: >-
    11A and 11B are the same gene and the same lesion, separated only by residual
    function and therefore by severity. GeneReviews states that the Zellweger syndrome
    / neonatal adrenoleukodystrophy / infantile Refsum disease divisions predate the
    biochemical and molecular understanding of the spectrum and that ZSD is now used
    for all individuals with a ZSD-PEX gene defect regardless of phenotype - so the
    11A/11B split is that superseded division applied to one gene. Against that, OMIM
    and MONDO both maintain the split, and the knowledge base already curates 11A as
    its own entry, so merging would mean revisiting that entry too. This entry follows
    the existing precedent and records the alternative here rather than taking it
    silently. Note that the reported PEX13 cohort spans both severities within single
    publications, which is itself an argument that the split does not carve the
    literature at a joint.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While individual phenotypes (e.g., Zellweger syndrome [ZS], neonatal adrenoleukodystrophy [NALD], and infantile Refsum disease [IRD]) were described in the past before the biochemical and molecular bases of this spectrum were fully determined, the term \"ZSD\" is now used to refer to all individuals with a defect in one of the ZSD-PEX genes regardless of phenotype."
    explanation: The authoritative clinical resource states that the phenotype divisions this split rests on have been superseded.
diagnosis:
- name: Biochemical and molecular testing
  description: >-
    Suggestive clinical and biochemical findings followed by identification of biallelic
    pathogenic variants in a ZSD-PEX gene.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ZSD is established in a proband with the suggestive clinical and biochemical findings above by identification of biallelic pathogenic variants in one of the 13 known ZSD-PEX genes."
    explanation: States the diagnostic criterion.

  evidence:
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, PEX13 interacts with itself to form dimers of proteins, a process called homo-oligomerization and then interacts with the PEX14 protein to complete the assembly of the DTM complex at the peroxisomal membrane"
    explanation: States the two-step assembly that this lesion disrupts.
  downstream:

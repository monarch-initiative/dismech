- name: Pexophagy of Import-Incompetent Peroxisomes
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PEX13 is required to prevent degradation of otherwise healthy peroxisomes. Losing
    it lets ubiquitinated PEX5 accumulate on the peroxisomal membrane and raises
    peroxisome-dependent reactive oxygen species, and the two together trigger
    selective autophagy of the organelle. This matters more for a hypomorphic allele
    than for a null: it is a route by which residual, partly functional peroxisomes are
    cleared rather than retained, and it offers an account of the reduced peroxisome
    numbers seen in patient fibroblasts.
  biological_processes:
  - preferred_term: pexophagy
    term:
      id: GO:0030242
      label: autophagy of peroxisome
    modifier: INCREASED
  - preferred_term: PEX5 ubiquitination
    term:
      id: GO:0016567
      label: protein ubiquitination
    modifier: INCREASED
  evidence:
  - reference: PMID:36541703
    reference_title: "PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal ROS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PEX13, a component of the peroxisomal matrix import system, is required to prevent the degradation of otherwise healthy peroxisomes"
    explanation: Establishes the protective role of PEX13 that is lost here.
  - reference: PMID:36541703
    reference_title: "PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal ROS."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The loss of PEX13 caused an accumulation of ubiquitinated PEX5 on peroxisomes and an increase in peroxisome-dependent reactive oxygen species that coalesce to induce pexophagy."
    explanation: Gives the two-step mechanism - ubiquitinated PEX5 plus raised ROS - by which PEX13 loss induces pexophagy.
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "a reduced number of peroxisomes with abnormal PEX13 concentration"
    explanation: The reduced peroxisome count in patient fibroblasts is consistent with this route, but the patient study did not measure autophagy, so the link to pexophagy is inferred rather than demonstrated in patient cells.
- name: Plasmalogen Deficiency
  biological_scale: ORGANISM
  description: >-
    Plasmalogen synthesis begins in the peroxisome, so import failure removes the
    biosynthetic capacity rather than merely slowing degradation. This is the
    subtractive half of the biochemical lesion and runs in the opposite direction to
    the accumulating metabolites, which is why the two are curated as separate nodes.
  biological_processes:
  - preferred_term: ether lipid biosynthetic process
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:12897163
    reference_title: "Pex13 inactivation in the mouse disrupts peroxisome biogenesis and leads to a Zellweger syndrome phenotype."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "severe impairment of peroxisomal fatty acid oxidation and plasmalogen synthesis"
    explanation: Names plasmalogen synthesis failure directly, in the Pex13 mouse. The previous snippet on this node quoted a general statement about downstream peroxisomal pathways whose own list does not include plasmalogens, so it did not support the claim.
  downstream:
  - target: Leukodystrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Secondary Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Patient muscle and fibroblasts show mitochondrial mislocalisation and biochemical
    abnormalities of mitochondrial function. Peroxisomes and mitochondria share
    convergent metabolic processes including reactive oxygen species handling, and
    similar findings have been reported for other PEX genes and in ZSD animal models.
    The contribution is described by its authors as potential and not fully understood,
    so this node is curated as contributory rather than as an established arm of the
    mechanism.
  evidence:
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "identified mislocalized mitochondria and a reduced number of peroxisomes with abnormal PEX13 concentration"
    explanation: Documents the mitochondrial abnormality in patient-derived material alongside the peroxisomal deficit.
  - reference: PMID:35854306
    reference_title: "Genotype-phenotype correlations and disease mechanisms in PEX13-related Zellweger spectrum disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "These findings from cellular and animal studies highlight a potential, and not yet fully understood, contributory role of mitochondrial dysfunction to pathophysiology of peroxisome biogenesis disorders (PBDs) and ZSD clinical phenotypes."
    explanation: Supports the node while recording, in the authors' own hedged terms, that the contribution is not established - which is why the upstream edge is INDIRECT_UNKNOWN_INTERMEDIATES.

      (immunodeficiencies affecting cellular and humoral immunity): listed as
      "MHC class II deficiency group A, B, C, D" with the four causal genes
      CIITA, RFXANK, RFX5, and RFXAP. The quoted row comes from the
      classification tables in the cached full text rather than from the
      abstract.
    evidence:
    - reference: PMID:35748970
      reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MHC class II deficiency group A, B, C, D"
      explanation: >-
        Table 1 disease-row text naming MHC class II deficiency (complementation
        groups A-D) among the immunodeficiencies affecting cellular and humoral
        immunity.
    - reference: ORPHA:572
      reference_title: "Immunodeficiency by defective expression of MHC class II (Orphanet structured-database record)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "severely impaired cellular and humoral immune response to foreign antigens, severe CD4+ T-cell lymphopenia, and hypogammaglobulinemia"
      explanation: >-
        Orphanet's definition characterizes the disorder as impairing both
        cellular and humoral immunity, matching the scope of IUIS Table 1.

progression:
- phase: Neonatal or infantile onset
  age_range: Neonatal to infancy
  notes: >-
    Clinical onset is usually in infancy, with severe infections and chronic
    diarrhea emerging in the first year of life.
  evidence:
  - reference: ORPHA:572
    reference_title: "Immunodeficiency by defective expression of MHC class II"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Infancy"
    explanation: Orphanet records infantile onset.
  - reference: ORPHA:572
    reference_title: "Immunodeficiency by defective expression of MHC class II"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: Neonatal"
    explanation: Orphanet also records neonatal onset.
  - reference: PMID:8229525
    reference_title: "Major histocompatibility complex class II deficiency: clinical manifestations, immunologic features, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical onset occurred in the first year of life, usually involving recurrent bronchopulmonary infections and chronic diarrhea."
    explanation: The 30-patient clinical series supports infantile onset with respiratory and gastrointestinal presentations.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The median age of diagnosis was 5.5 months (range, 3–7 months)."
    explanation: Gives a median age at diagnosis within the first year in a contemporary series.
- phase: Later diagnosis in milder presentations
  age_range: Up to 15 years
  notes: >-
    The disorder is not uniformly infantile. A minority present mildly enough to
    be diagnosed well into childhood or adolescence, which is one reason the
    diagnosis is missed when HLA-DR expression is not specifically checked.
  evidence:
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there are some reports with a milder clinical presentation and diagnosis later up to 15 years of age"
    explanation: Documents the milder, later-diagnosed end of the presentation spectrum.
- phase: Progressive infectious and hepatobiliary complications
  age_range: Childhood
  notes: >-
    The clinical course accumulates viral meningoencephalitis, hepatitis,
    cholangitis, and autoimmune phenomena on top of the recurrent respiratory
    and gastrointestinal infection burden.
  evidence:
  - reference: PMID:8229525
    reference_title: "Major histocompatibility complex class II deficiency: clinical manifestations, immunologic features, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course was complicated by viral meningoencephalitis, hepatitis, cholangitis, and various autoimmune phenomena."
    explanation: Enumerates the complications that define the intermediate course in the 30-patient series.
- phase: Death in childhood without transplantation
  age_range: Mean age at death 4 years
  notes: >-
    In the pre-modern-transplant natural history the mean age at death was 4
    years, with overwhelming viral infection the leading cause. Contemporary
    transplant results are far better (94% overall survival after 2008), so this
    phase describes the untransplanted course rather than the current
    expectation for a transplanted child.
  evidence:
  - reference: PMID:8229525
    reference_title: "Major histocompatibility complex class II deficiency: clinical manifestations, immunologic features, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognosis was very poor: the mean age at the time of death was 4 years. The main cause of death was overwhelming viral infection."
    explanation: Gives the untreated natural-history mortality and its leading cause.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untransplanted MHC class II deficiency killed patients at a mean age of four
    years, usually from overwhelming viral infection, on a background of
    recurrent respiratory and gastrointestinal infection, protracted diarrhoea,
    failure to thrive, and hepatobiliary disease. Transplantation is the only
    cure and was itself historically poor (33% survival before 2008), though
    contemporary strategies reach 94%. Burden is therefore high but sharply
    era- and access-dependent, and survivors still carry a residual CD4 deficit
    from the non-haematopoietic thymic epithelial component of the disease.
  evidence:
  - reference: PMID:8229525
    reference_title: "Major histocompatibility complex class II deficiency: clinical manifestations, immunologic features, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prognosis was very poor: the mean age at the time of death was 4 years. The main cause of death was overwhelming viral infection."
    explanation: Quantifies the untransplanted mortality underpinning the high burden assessment.
  - reference: PMID:31932845
    reference_title: Improved transplant survival and long-term disease outcome in children with MHC class II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With a 2.9-year median follow-up, OS improved from 33% (46-68%) for HCT before 2008 (n = 6) to 94% (66-99%) for HCT after 2008"
    explanation: Supports the era dependence of the burden — the same disease, transplanted, now has very different survival.

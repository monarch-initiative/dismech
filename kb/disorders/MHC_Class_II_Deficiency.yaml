  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Over 150 patients reported worldwide as of 2018, about two-thirds of North
    African descent (Algeria, Morocco, Tunisia). The disorder is concentrated in
    the Mediterranean region and in populations with high consanguinity, so the
    case series are geographically clustered and the worldwide point-prevalence
    band above should not be read as a uniform rate.

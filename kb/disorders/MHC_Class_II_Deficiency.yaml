differential_diagnoses:
- name: T-B+ severe combined immunodeficiency
  description: >-
    The most consequential confusion, and it goes in one direction: MHC class II
    deficiency is misread as a T-B+ SCID. Both present in infancy with severe
    respiratory and gastrointestinal infection, failure to thrive,
    hypogammaglobulinaemia, and a low CD4 count with preserved B cells. In MHC
    class II deficiency the absolute lymphocyte and B-cell counts are normal or
    even elevated, and TRECs are detectable, so neither a routine subset panel
    nor newborn screening separates the two. Only HLA-DR staining on B cells and
    monocytes does.
  distinguishing_features:
  - Absent HLA-DR expression on B lymphocytes and monocytes is obligate in MHC class II deficiency and is the single discriminating test; it is normal in T-B+ SCID.
  - TRECs are detectable and above the newborn-screening cut-off in MHC class II deficiency because the block is downstream of T-cell receptor recombination; typical SCID has very low or undetectable TRECs.
  - Absolute B-lymphocyte counts are normal or elevated in MHC class II deficiency, and the total lymphocyte count is often preserved with a selectively low CD4 count and inverted CD4:CD8 ratio.
  - The causal genes are the MHC-II regulatory factors CIITA, RFXANK, RFX5, and RFXAP, none of which are SCID genes.
  evidence:
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these patients presented with normal or elevated absolute B lymphocyte count that could potentially lead to misdiagnosis of MHC class II deficiency as T−B+ form of severe combined immunodeficiency (SCID)"
    explanation: States the misdiagnosis risk and the specific finding that causes it.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, diagnosis of MHC class II deficiency may be confounded unless HLA-DR expression is evaluated on the immune cells."
    explanation: Identifies HLA-DR immunophenotyping as the discriminating test.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detectable level of T cell receptor excision circles (TRECs) were measured in our patients, highlighting that this form of PID may be missed by TREC-based newborn screening program for severe combined immunodeficiency."
    explanation: Supports the TREC-based distinguishing feature and the screening blind spot.

diagnosis:
- name: HLA-DR flow-cytometric immunophenotyping
  description: >-
    Flow cytometry demonstrating absent or reduced HLA-DR expression on B cells
    and monocytes supports the diagnosis and distinguishes MHC class II
    deficiency from other T-B+ severe combined immunodeficiencies.
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, patients displayed a reduced absolute CD4+ Th cell count and absent HLA-DR expression on B lymphocytes and monocytes."
    explanation: This directly supports flow-cytometric HLA-DR immunophenotyping for diagnosis.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, diagnosis of MHC class II deficiency may be confounded unless HLA-DR expression is evaluated on the immune cells."
    explanation: >-
      States why this specific test is required rather than optional: without
      it the disorder is confounded with other T-B+ immunodeficiencies.
  notes: >-
    The test has to be asked for. Total lymphocyte and B-cell counts are normal
    or even elevated, so nothing on a routine subset panel forces the question;
    only HLA-DR staining on B cells and monocytes distinguishes this disorder
    from a T-B+ SCID.
- name: TREC newborn screening (does not detect this disorder)
  description: >-
    TREC-based newborn screening for SCID does not reliably detect MHC class II
    deficiency. The block lies downstream of T-cell receptor recombination, so
    excision circles are still produced: measured TREC levels in these patients
    sit above the screening cut-off, and affected infants screen normal. This is
    recorded here as a negative diagnostic finding rather than as a usable test.
  presence: ABSENT
  diagnosis_term:
    preferred_term: newborn screening
    term:
      id: NCIT:C81178
      label: Newborn Screening
  evidence:
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detectable level of T cell receptor excision circles (TRECs) were measured in our patients, highlighting that this form of PID may be missed by TREC-based newborn screening program for severe combined immunodeficiency."
    explanation: Directly documents detectable TRECs in affected patients and the resulting screening blind spot.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TREC levels in MHC class II patients have been reported to be higher than the NBS TREC cut-off for SCID and other T cell lymphopenia conditions"
    explanation: Explains the mechanism of the false-negative — TREC levels exceed the screening threshold.
- name: Molecular genetic testing for MHC-II regulatory genes
  description: >-
    Molecular genetic testing of CIITA, RFXANK, RFX5, and RFXAP confirms the
    causative regulatory-gene defect and defines the genetic subtype.
  diagnosis_term:

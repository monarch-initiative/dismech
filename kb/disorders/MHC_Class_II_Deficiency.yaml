- name: RFXANK
  association: Causative
  gene_term:
    preferred_term: RFXANK
    term:
      id: hgnc:9987
      label: RFXANK
  features: >-
    RFXANK encodes an ankyrin-containing subunit of the RFX complex that binds
    conserved MHC-II promoter elements. RFXANK (complementation group B) is by a
    wide margin the most frequently mutated of the four genes, accounting for
    more than two-thirds of reported cases — a figure driven by a North African
    founder effect rather than by any special vulnerability of the gene.
  case_fractions:
  - population: Worldwide reported cases
    case_fraction_percent: 67.0
    case_fraction_low: 67.0
    notes: >-
      Reported as "more than two-thirds of all reported cases", so 67% is a
      lower bound rather than a point estimate. Concentrated in patients of
      North African descent; notably, RFXANK was absent from the five-patient
      Indian series that reports this figure, which found RFXAP, RFX5, and CIITA
      instead.
    evidence:
    - reference: PMID:29527204
      reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RFXANK gene mutation that accounts for more than two-thirds of all reported cases (1) was not identified in our series."
      explanation: Gives the RFXANK share of reported cases and notes its absence from this non-Mediterranean cohort.
    - reference: PMID:29527204
      reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Worldwide, over 150 patients have been reported with this deficiency (1). About two-third of these patients have a North African descent (Algeria, Morocco, and Tunisia)"
      explanation: >-
        Supplies the ancestry concentration behind the RFXANK share and the
        total reported-case denominator.

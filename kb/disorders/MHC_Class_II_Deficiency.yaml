    description: Donor hematopoietic cells can restore MHC-II expression in hematopoietic antigen-presenting cells.
  evidence:
  - reference: PMID:31932845
    reference_title: Improved transplant survival and long-term disease outcome in children with MHC class II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic cell transplantation (HCT) remains the only curative treatment for this condition, but transplant survival in the previously published result was poor."
    explanation: Contemporary transplant cohort identifies HCT as the curative treatment.
  - reference: PMID:31932845
    reference_title: Improved transplant survival and long-term disease outcome in children with MHC class II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With a 2.9-year median follow-up, OS improved from 33% (46-68%) for HCT before 2008 (n = 6) to 94% (66-99%) for HCT after 2008"
    explanation: The cohort provides human outcome evidence for improved modern HCT survival.
  - reference: PMID:31932845
    reference_title: Improved transplant survival and long-term disease outcome in children with MHC class II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All survivors were off immunoglobulin replacement and had protective vaccine responses to tetanus and Haemophilus influenzae. None had any significant infection or autoimmunity."
    explanation: >-
      Gives the functional outcome, not just survival: restored T-cell-dependent
      antibody responses sufficient to stop immunoglobulin replacement, and
      resolution of the autoimmune manifestations.
  - reference: PMID:31932845
    reference_title: Improved transplant survival and long-term disease outcome in children with MHC class II deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Latest CD4+ T-lymphocyte number was significantly lower in transplant survivors (n = 14) compared with posttransplant disease controls (P = .01)."
    explanation: >-
      Substantiates the residual non-haematopoietic defect asserted in this
      treatment's description: donor cells cannot restore MHC-II expression on
      recipient thymic epithelium, so CD4 reconstitution stays subnormal
      relative to other transplanted immunodeficiencies.
  - reference: PMID:34211466
    reference_title: Thymic Epithelial Cell Alterations and Defective Thymopoiesis Lead to Central and Peripheral Tolerance Perturbation in MHCII Deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, our findings reveal disease-specific TEC defects resulting in perturbation of central tolerance and limiting the potential benefits of hematopoietic stem cell transplantation in MHCII deficiency."
    explanation: >-
      States the mechanistic reason the benefit of transplantation is capped —
      the thymic epithelial compartment is not of donor origin and is not
      corrected.
  - reference: PMID:8229525
    reference_title: "Major histocompatibility complex class II deficiency: clinical manifestations, immunologic features, and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-term survival after human leukocyte antigen-identical and haploidentical bone marrow transplantation seemed to depend primarily on the presence of preexisting viral infections."
    explanation: >-
      Identifies pre-existing viral infection, rather than donor type, as the
      dominant determinant of transplant survival — the argument for
      transplanting before infection accrues.
  - reference: PMID:29527204
    reference_title: "Clinical, Immunological, and Molecular Findings in Five Patients with Major Histocompatibility Complex Class II Deficiency from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even with immunosuppression, residual host immunity in these patients is reported to be adequate to cause graft rejection."
    explanation: >-
      Records graft rejection driven by residual host immunity as a
      disorder-specific transplant obstacle.
  notes: >-
    Two obstacles are specific to this disorder rather than generic to
    transplantation. First, graft rejection: residual host immunity is adequate
    to reject even under immunosuppression, and donor antigen-presenting cells
    presenting donor antigen to recipient T cells has been proposed as the
    mechanism, so second transplants have been needed. Second, an irreducible
    ceiling: the thymic epithelium is not haematopoietic, so donor cells cannot
    restore MHC-II expression there. Survivors' CD4 counts stay significantly
    below those of other transplanted patients, and mouse work frames this as
    the reason the benefit of transplantation is limited rather than complete.
    Neither obstacle prevents cure — post-2008 survival is 94%, with survivors
    off immunoglobulin and making protective vaccine responses.

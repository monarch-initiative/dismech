genetic:
- name: TTLL5
  gene_term:
    preferred_term: TTLL5
    term:
      id: hgnc:19963
      label: TTLL5
  association: Causative
  relationship_type: CAUSATIVE
  features: >-
    Biallelic variants across the gene, including frameshift, nonsense,
    splice-site, missense and multiexon deletion alleles; large deletions are
    missed by standard sequencing and need copy-number analysis. The missense
    variant p.Gly146Glu was the most frequent allele in a Chinese cohort and
    associated with cone-rod dystrophy. Truncating, but not missense, alleles
    were associated with male infertility in one series.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_db2083b7-fe3d-459e-8874-35ed9ebb0785-2023-10-05T160000.000Z
    evidence:
    - reference: CGGV:assertion_db2083b7-fe3d-459e-8874-35ed9ebb0785-2023-10-05T160000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "TTLL5 | HGNC:19963 | TTLL5-related retinopathy | MONDO:1040038 | AR | Definitive"
      explanation: >-
        ClinGen's Retina GCEP classifies TTLL5 as definitive for this disease
        under autosomal recessive inheritance.
  evidence:
  - reference: PMID:34203883
    reference_title: "Novel TTLL5 Variants Associated with Cone-Rod Dystrophy and Early-Onset Severe Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified eight variants, of which six were novel, including two large multiexon deletions in patients with COD or CORD"
    explanation: >-
      Multiexon deletions are part of the allelic spectrum.
  - reference: PMID:41933583
    reference_title: "Expanding the Clinical and Genetic Spectrum of TTLL5-Associated Retinal Dystrophy: A Single-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The recurrent missense variant c.437G>A (p.Gly146Glu) was the most frequent allele in this cohort and was consistently associated with a CRD phenotype."
    explanation: >-
      Identifies a recurrent missense allele and its phenotype association.
  - reference: PMID:28173158
    reference_title: "Mutations in the polyglutamylase gene TTLL5, expressed in photoreceptor cells and spermatozoa, are associated with cone-rod degeneration and reduced male fertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together, our data indicate that mutations in TTLL5 delineate a novel, allele-specific syndrome causing defects in two as yet pathogenically unrelated functions, reproduction and vision."
    explanation: >-
      Allele-specific involvement of vision and male fertility.
animal_models:
- name: Ttll5 mutant mouse (RPGR glutamylation)
  species: Mouse
  genotype: Ttll5 mutant
  publication: PMID:27162334
  description: >-
    A Ttll5 mutant mouse used to test whether TTLL5 loss acts through RPGR.
    It loses RPGR glutamylation while tubulin glutamylation is largely
    preserved, and develops slow photoreceptor degeneration resembling the
    Rpgr-null mouse.
  modeled_mechanisms:
  - target: Loss of RPGR-ORF15 Glutamylation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Complete loss of RPGR glutamylation in vivo.
    evidence:
    - reference: PMID:27162334
      reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a Ttll5 mutant mouse displays a complete loss of RPGR glutamylation without marked changes in tubulin glutamylation levels"
      explanation: >-
        Direct measurement of the molecular lesion in the model.
  - target: Cone-Predominant Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Slow photoreceptor degeneration with early cone opsin mislocalization.
    limitations: >-
      The mouse retina is rod-dominant and has no macula, so the macular-onset,
      cone-first pattern seen in patients cannot be reproduced directly, and
      the degeneration is slow.
    evidence:
    - reference: PMID:27162334
      reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Ttll5 mutant mouse develops slow photoreceptor degeneration with early mislocalization of cone opsins, features resembling those of Rpgr-null mice."
      explanation: >-
        The model develops photoreceptor degeneration following the RPGR
        lesion.
- name: Stamp(tm/tm) mouse (Ttll5 internal deletion)
  species: Mouse
  genotype: Stamp(tm/tm), internal deletion causing reduced mRNA and C-terminal truncation of TTLL5/STAMP
  publication: PMID:23558686
  description: >-
    Homozygous targeted mutant mice with an internal Ttll5 deletion. Males have
    markedly reduced fertility from defective progressive sperm motility, with
    abnormal axonemes and reduced alpha-tubulin polyglutamylation in sperm.
  modeled_mechanisms:
  - target: Reduced Sperm Axonemal Tubulin Polyglutamylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reduced sperm alpha-tubulin polyglutamylation with axonemal defects and
      impaired motility.
    limitations: >-
      The retina was not examined in this study, and the allele differs from
      human truncating variants.
    evidence:
    - reference: PMID:23558686
      reference_title: "Disruption of Ttll5/stamp gene (tubulin tyrosine ligase-like protein 5/SRC-1 and TIF2-associated modulatory protein gene) in male mice causes sperm malformation and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Abnormal axonemal structures with loss of tubulin doublets occur in most Stamp(tm/tm) sperm tails in conjunction with substantial reduction in α-tubulin polyglutamylation"
      explanation: >-
        The sperm defect in the model matches the cellular node.

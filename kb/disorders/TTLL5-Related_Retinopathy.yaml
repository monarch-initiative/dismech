- name: Reduced Sperm Axonemal Tubulin Polyglutamylation
  biological_scale: CELLULAR
  description: >-
    In spermatozoa, TTLL5 polyglutamylates axonemal alpha-tubulin. Truncating
    Ttll5 loss in mice reduces this modification and leaves most sperm tails
    with abnormal axonemes lacking microtubule doublets. The human counterpart
    is reduced sperm motility in males carrying truncating, but not missense,
    TTLL5 alleles.
  biological_processes:
  - preferred_term: protein polyglutamylation
    modifier: DECREASED
    term:
      id: GO:0018095
      label: protein polyglutamylation
  - preferred_term: flagellated sperm motility
    modifier: DECREASED
    term:
      id: GO:0030317
      label: flagellated sperm motility
  cell_types:
  - preferred_term: sperm
    term:
      id: CL:0000019
      label: sperm
  evidence:
  - reference: PMID:23558686
    reference_title: "Disruption of Ttll5/stamp gene (tubulin tyrosine ligase-like protein 5/SRC-1 and TIF2-associated modulatory protein gene) in male mice causes sperm malformation and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous targeted mutant (Stamp(tm/tm)) mice appear normal except for marked decreases in male fertility associated with defects in progressive sperm motility."
    explanation: >-
      The mouse mutant shows male subfertility from defective progressive
      sperm motility.
  - reference: PMID:28173158
    reference_title: "Mutations in the polyglutamylase gene TTLL5, expressed in photoreceptor cells and spermatozoa, are associated with cone-rod degeneration and reduced male fertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "antibodies against TTLL5 stained the basal body of photoreceptor cells in rat and the centrosome of the spermatozoon flagellum in humans, suggesting a common mechanism of action in these two cell types"
    explanation: >-
      TTLL5 sits at the base of both the photoreceptor cilium and the sperm
      flagellum, supporting a shared ciliary mechanism in the two cell types.
  downstream:
  - target: Reduced sperm motility
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23558686
      reference_title: "Disruption of Ttll5/stamp gene (tubulin tyrosine ligase-like protein 5/SRC-1 and TIF2-associated modulatory protein gene) in male mice causes sperm malformation and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "STAMP appears to participate in a unique, tissue-selective TTLL-mediated pathway for α-tubulin polyglutamylation that is required for sperm maturation and motility"
      explanation: >-
        Links the tubulin polyglutamylation defect to impaired sperm
        maturation and motility.
  - target: Male infertility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
phenotypes:

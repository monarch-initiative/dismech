      preferred_term: TTLL5
      term:
        id: hgnc:19963
        label: TTLL5
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous presumed loss-of-function alleles;
      zygosity is recorded as homozygous for the consanguineous discovery
      families, and compound heterozygous cases are also reported.
  molecular_functions:

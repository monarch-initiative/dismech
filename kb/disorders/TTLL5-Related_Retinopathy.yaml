    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TTLL5, encoding a tubulin glutamylase, was highlighted as the most likely disease-associated gene; 2 of 28 affected subjects harbored presumed loss-of-function variants"
    explanation: >-
      The discovery exome study identified presumed loss-of-function TTLL5
      variants in cone-first retinal disease.
  - reference: PMID:24791901
    reference_title: "Biallelic variants in TTLL5, encoding a tubulin glutamylase, cause retinal dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In human and murine retinae, TTLL5 localized to the centrioles at the base of the connecting cilium."
    explanation: >-
      Places TTLL5 at the ciliary base of photoreceptors, the site where its
      substrate RPGR acts.
  - reference: PMID:28173158
    reference_title: "Mutations in the polyglutamylase gene TTLL5, expressed in photoreceptor cells and spermatozoa, are associated with cone-rod degeneration and reduced male fertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this gene has multiple viable isoforms, being highly expressed in testis and retina"
    explanation: >-
      Expression concentrated in retina and testis matches the two tissues
      affected in patients.
  downstream:
  - target: Loss of RPGR-ORF15 Glutamylation
    causal_link_type: DIRECT
    description: >-
      TTLL5 is the glutamylase for RPGR-ORF15, so loss of TTLL5 activity
      abolishes the modification.
    evidence:
    - reference: PMID:27162334
      reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a Ttll5 mutant mouse displays a complete loss of RPGR glutamylation without marked changes in tubulin glutamylation levels"
      explanation: >-
        In vivo, loss of Ttll5 removes RPGR glutamylation while sparing
        photoreceptor tubulin glutamylation, isolating RPGR as the relevant
        retinal substrate.
    - reference: PMID:27162334
      reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "TTLL5 disease mutants that cause human retinal dystrophy show impaired glutamylation of RPGR(ORF15)"
      explanation: >-
        Human disease alleles fail to glutamylate RPGR-ORF15, tying the patient
        variants to this edge.
  - target: Reduced Sperm Axonemal Tubulin Polyglutamylation
    causal_link_type: DIRECT
    description: >-
      In sperm, TTLL5 polyglutamylates axonemal alpha-tubulin; truncating
      loss removes this activity.
    evidence:
    - reference: PMID:23558686
      reference_title: "Disruption of Ttll5/stamp gene (tubulin tyrosine ligase-like protein 5/SRC-1 and TIF2-associated modulatory protein gene) in male mice causes sperm malformation and infertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Abnormal axonemal structures with loss of tubulin doublets occur in most Stamp(tm/tm) sperm tails in conjunction with substantial reduction in α-tubulin polyglutamylation"
      explanation: >-
        A Ttll5 mutant mouse shows reduced axonemal alpha-tubulin
        polyglutamylation in sperm.
- name: Loss of RPGR-ORF15 Glutamylation
  biological_scale: MOLECULAR
  description: >-
    TTLL5 glutamylates the glutamate- and glycine-rich repeat region of the
    photoreceptor-specific RPGR-ORF15 isoform. The RPGR C-terminal basic domain
    binds TTLL5's cofactor interaction domain, which targets the enzyme to
    RPGR; disease mutations at that interface abolish the interaction. Without
    TTLL5, RPGR-ORF15 is not glutamylated.
  genes:
  - preferred_term: RPGR
    term:
      id: hgnc:10295
      label: RPGR
  biological_processes:
  - preferred_term: protein polyglutamylation
    modifier: DECREASED
    term:
      id: GO:0018095
      label: protein polyglutamylation
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  - preferred_term: retinal rod cell
    term:
      id: CL:0000604
      label: retinal rod cell
  evidence:
  - reference: PMID:27162334
    reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that tubulin tyrosine ligase like-5 (TTLL5) glutamylates RPGR(ORF15) in its Glu-Gly-rich repetitive region containing motifs homologous to the α-tubulin C-terminal tail."
    explanation: >-
      Identifies RPGR-ORF15 as the TTLL5 substrate and the repeat region as
      the modified site.
  - reference: PMID:41941273
    reference_title: "Insights into retinal disease and non-tubulin glutamylation from a RPGR-TTLL5 complex structure."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Key mutations at this interface abolish RPGR-TTLL5 interaction in vitro and RPGR glutamylation in mouse photoreceptors."
    explanation: >-
      Structural work shows that disrupting the TTLL5-RPGR interface removes
      RPGR glutamylation, the molecular lesion this node asserts.
  downstream:
  - target: Impaired Connecting Cilium Trafficking and Cone Opsin Mislocalization
    causal_link_type: DIRECT
    description: >-
      Glutamylation is required for RPGR-ORF15 function at the connecting
      cilium; without it, cone opsins mislocalize as in RPGR-null mice.
    evidence:
    - reference: PMID:27162334
      reference_title: "Loss of RPGR glutamylation underlies the pathogenic mechanism of retinal dystrophy caused by TTLL5 mutations."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The Ttll5 mutant mouse develops slow photoreceptor degeneration with early mislocalization of cone opsins, features resembling those of Rpgr-null mice."
      explanation: >-
        The Ttll5 mutant phenocopies Rpgr loss, with cone opsin mislocalization
        as the early lesion downstream of absent RPGR glutamylation.
- name: Impaired Connecting Cilium Trafficking and Cone Opsin Mislocalization
  conforms_to: "ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration"
  biological_scale: CELLULAR
  description: >-
    Unglutamylated RPGR-ORF15 fails to support cargo delivery through the
    connecting cilium, and cone opsins accumulate outside the outer segment.
    This ciliary trafficking defect is shared with RPGR-related retinopathy,
    which explains the overlapping cone-predominant phenotype and the tapetal
    sheen reported in both.
  biological_processes:

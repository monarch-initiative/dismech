    reference_title: "Novel TTLL5 Variants Associated with Cone-Rod Dystrophy and Early-Onset Severe Retinal Dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four adult patients presented either COD or CORD with onset in the late teenage years."
    explanation: >-
      Cone or cone-rod dystrophy with onset in the late teens in four of five
      patients.
  - reference: PMID:41933583
    reference_title: "Expanding the Clinical and Genetic Spectrum of TTLL5-Associated Retinal Dystrophy: A Single-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on phenotypic classification, 2 patients were diagnosed with cone dystrophy (CD), 12 with cone-rod dystrophy (CRD), and 7 with rod-cone dystrophy (RCD)."
    explanation: >-
      Fourteen of 21 patients in the largest cohort had cone or cone-rod
      dystrophy.
  - reference: PMID:24791901
    reference_title: "Biallelic variants in TTLL5, encoding a tubulin glutamylase, cause retinal dystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The retinal phenotype was highly similar in three of four families; the sibling pair had a more severe, early-onset disease."
    explanation: >-

    The defining presentation is a cone-dominated retinal dystrophy, either
    restricted to cones or with later rod involvement. Onset is usually in
    adolescence or adulthood, with a more severe early-onset course in some
    families.
  phenotype_term:
    preferred_term: Cone/cone-rod dystrophy
    term:

name: TTLL5-Related Retinopathy
creation_date: "2026-11-09T00:22:25Z"
category: Mendelian
description: >-
  Autosomal recessive inherited retinal dystrophy caused by biallelic variants
  in TTLL5, which encodes a tubulin tyrosine ligase-like glutamylase. TTLL5
  localizes to the base of the photoreceptor connecting cilium, where it
  glutamylates the retina-specific ORF15 isoform of RPGR; loss of that
  modification impairs RPGR function and produces a cone-predominant
  photoreceptor degeneration. Most patients present in adolescence or adult
  life with a cone or cone-rod dystrophy, reduced central vision, macular
  autofluorescence and outer-retinal changes, and frequently myopia; rod-cone
  and sectoral presentations are also described. Males carrying truncating
  alleles can additionally have reduced sperm motility and infertility,
  reflecting a second TTLL5 role in polyglutamylating sperm axonemal tubulin.
disease_term:
  preferred_term: TTLL5-related retinopathy
  term:
    id: MONDO:1040038
    label: TTLL5-related retinopathy
synonyms:
- Cone-rod dystrophy 19
- CORD19
- TTLL5-associated retinal dystrophy
- TTLL5-associated cone dystrophy
- TTLL5-associated cone-rod dystrophy
parents:
- Inherited Retinal Dystrophy
- Cone-Rod Dystrophy
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014372
      label: cone-rod dystrophy 19
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      Cone-rod dystrophy 19 (CORD19) is the sole MONDO descendant of
      MONDO:1040038 and names the cone-rod presentation of the same
      TTLL5-caused disease. The entry covers it together with the cone-only,
      rod-cone and sectoral presentations reported for the same gene.
notes: >-
  Modeled as one entity without has_subtypes. The reported presentations (cone
  dystrophy, cone-rod dystrophy, rod-cone dystrophy, sectoral disease, and one
  early-onset severe retinal dystrophy) arise from the same biallelic TTLL5
  loss of function and are not partitioned by gene or by a recurrent variant
  class; the largest cohort (PMID:41933583) reports all three main patterns
  among 21 patients. The one allele-level correlation that is reported, male
  infertility with truncating but not missense alleles (PMID:28173158), is
  recorded on the phenotype and the genetic record rather than as a subtype.
  Isolated sensorineural hearing loss has been reported in single patients
  (PMID:35365235, PMID:41933583) without an established mechanism, so it is
  not listed as a phenotype. TTLL5 is also among the genes reported in a
  central areolar choroidal dystrophy-like maculopathy, curated separately in
  kb/disorders/Central_Areolar_Choroidal_Dystrophy.yaml. There is no
  GeneReviews chapter for this disease or for TTLL5, so the phenotype baseline
  comes from the published case series and the 21-patient cohort.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic TTLL5 variants, homozygous in consanguineous
    families or compound heterozygous, including truncating, splice-site,
    missense and multiexon deletion alleles.
  evidence:
  - reference: PMID:28173158
    reference_title: "Mutations in the polyglutamylase gene TTLL5, expressed in photoreceptor cells and spermatozoa, are associated with cone-rod degeneration and reduced male fertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following next-generation sequencing and autozygome-based screening of patients presenting with a peculiar, recessive form of cone-dominated retinopathy, we identified five homozygous variants"
    explanation: >-
      Homozygous TTLL5 variants in eight patients from six families establish
      a recessive cone-dominated retinopathy.
  - reference: PMID:41933583
    reference_title: "Expanding the Clinical and Genetic Spectrum of TTLL5-Associated Retinal Dystrophy: A Single-Center Cohort Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one affected individuals from 19 unrelated families carrying biallelic TTLL5 variants."
    explanation: >-
      The largest cohort is defined by biallelic TTLL5 variants, consistent
      with autosomal recessive inheritance.
pathophysiology:
- name: Biallelic TTLL5 Loss of Function
  conforms_to: "photoreceptor_degeneration#Photoreceptor Gene Defect"
  biological_scale: MOLECULAR
  description: >-
    Biallelic TTLL5 variants, most of them presumed loss of function
    (frameshift, nonsense, splice-site and multiexon deletions, with some
    missense changes), remove or impair the protein's glutamylase activity.
    TTLL5 is expressed highly in retina and testis and localizes to the
    centrioles at the base of the photoreceptor connecting cilium.
  genes:
  - preferred_term: TTLL5
    term:
      id: hgnc:19963
      label: TTLL5
  genetic_context:

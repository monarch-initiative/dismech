treatments:
- name: Treatment of the Underlying Neoplasm
  description: Definitive management targets the driving tumour. In Castleman disease, resection
    of the causative lesion can be followed by improvement of the mucocutaneous disease, though
    bronchiolitis obliterans may progress independently.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Associated Neoplasm
    treatment_effect: INHIBITS
    description: Removing or treating the driving neoplasm addresses the upstream trigger of
      the autoimmune response.
    evidence:
    - reference: PMID:37597771
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The condition occurs in patients with underlying benign or malignant neoplasms,
        most commonly lymphoproliferative disorders.
      explanation: The neoplastic driver is the rationale for directing treatment at the tumour.
- name: Systemic Corticosteroid Therapy
  description: High-dose systemic corticosteroids are the usual first-line immunosuppressive
    treatment, though the mucosal disease is characteristically resistant compared with pemphigus
    vulgaris.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients typically present with severe stomatitis and polymorphous skin lesions,
      which are often resistant to treatment.
    explanation: Records the treatment resistance that shapes expectations for immunosuppressive
      therapy.
- name: Anti-CD20 B-Cell Depletion
  description: Rituximab depletes the B-cell compartment producing the anti-plakin and anti-desmoglein
    autoantibodies, and is also active against the B-lymphoproliferative disorders that most
    often drive the disease.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Anti-Plakin and Anti-Desmoglein Autoantibody Production
    treatment_effect: INHIBITS
    description: B-cell depletion targets the humoral arm producing the characteristic anti-plakin
      autoantibodies.
    evidence:
    - reference: PMID:37597771
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Both humoral and cell-mediated immunities contribute to the pathogenesis, and
        autoantibodies against plakin family proteins are characteristic.
      explanation: The humoral arm is the target of B-cell depletion; the parallel cell-mediated
        arm is not addressed by it.

  name: Cutaneous Blistering
  description: >-
    Polymorphous skin lesions - the polymorphism itself is diagnostically important, since
    the eruption can be lichenoid, bullous, or erythema-multiforme-like in the same patient.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormal blistering of the skin
    term:

pathophysiology:
- name: Associated Neoplasm
  description: 'An underlying neoplasm, most often lymphoproliferative, drives the autoimmune
    response. Malignant lymphoma, malignant solid tumours and Castleman disease are the commonest
    associations, and the driving neoplasm may be benign as well as malignant - Castleman disease
    being the archetype. The association is causal rather than incidental, but it is not universally
    demonstrable: in the largest reported cohort 12 of 104 patients had no detectable tumour,
    so absence of an identified neoplasm does not exclude the diagnosis and should prompt continued
    surveillance rather than reclassification.'
  downstream:
  - target: Anti-Plakin and Anti-Desmoglein Autoantibody Production
    causal_link_type: DIRECT
  - target: Cell-Mediated Cytotoxic Interface Attack
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The condition occurs in patients with underlying benign or malignant neoplasms,
      most commonly lymphoproliferative disorders.
    explanation: States the defining neoplastic association and that the driving tumour may
      be benign.
  - reference: PMID:26358412
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common associated neoplasms included malignant lymphomas, malignant solid
      tumours and Castleman disease, in that order, while 12 patients had no detectable tumours.
    explanation: Ranks the associated neoplasms in a 104-patient cohort and quantifies the subset
      with no detectable tumour.
- name: Anti-Plakin and Anti-Desmoglein Autoantibody Production
  description: The tumour drives a humoral autoimmune response against plakin-family proteins
    that cross-link desmosomes and hemidesmosomes to the intermediate filament cytoskeleton
    - envoplakin and periplakin most characteristically, with desmoplakin, BP230, plectin, and
    the protease inhibitor alpha-2-macroglobulin-like-1 also targeted. Anti-desmoglein reactivity
    accompanies it. This broad multi-antigen profile, rather than the restricted anti-desmoglein
    reactivity of pemphigus vulgaris, is what distinguishes the disease serologically.
  downstream:
  - target: Suprabasal Acantholysis and Interface Dermatitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both humoral and cell-mediated immunities contribute to the pathogenesis, and autoantibodies
      against plakin family proteins are characteristic.
    explanation: Establishes anti-plakin autoantibodies as the characteristic humoral arm.
  - reference: PMID:2247105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 250-kd polypeptide comigrated with desmoplakin I (a protein found in the desmosomes
      of all epithelia), and the 230-kd antigen comigrated with the antigen of bullous pemphigoid.
    explanation: Original identification of desmoplakin I and BP230 within the autoantigen complex.
  - reference: PMID:26358412
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Thirty-two (60%) of 53 patients had antibodies to alpha-2-macroglobulin-like protein
      1 (A2ML1).
    explanation: Quantifies A2ML1 reactivity, one of the non-plakin autoantigens distinguishing
      this disease.
- name: Cell-Mediated Cytotoxic Interface Attack
  description: A cytotoxic T-cell and NK-cell mediated attack on basal keratinocytes acts in
    parallel with the autoantibody response, producing the lichenoid interface component that
    is absent from the classical pemphigus variants. This dual humoral-plus-cellular mechanism
    is the reason the disease behaves more aggressively and responds less predictably to the
    immunosuppression that controls pemphigus vulgaris.
  downstream:
  - target: Suprabasal Acantholysis and Interface Dermatitis
    causal_link_type: DIRECT
  - target: Bronchiolitis Obliterans
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both humoral and cell-mediated immunities contribute to the pathogenesis, and autoantibodies
      against plakin family proteins are characteristic.
    explanation: States that cell-mediated immunity contributes alongside the humoral arm, which
      is the basis for the interface component.
- name: Suprabasal Acantholysis and Interface Dermatitis
  description: Loss of desmosomal adhesion produces suprabasal acantholysis, while the cytotoxic
    interface attack produces vacuolar change and dyskeratosis at the dermal-epidermal junction.
    The combination of both patterns in one biopsy is characteristic and is what separates the
    histology from pemphigus vulgaris.
  downstream:
  - target: Intractable Stomatitis and Mucosal Erosion
    causal_link_type: DIRECT
  - target: Polymorphous Cutaneous Eruption
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:2247105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histologic examination showed vacuolization of epidermal basal cells, keratinocyte
      necrosis, and acantholysis.
    explanation: Records the combined interface (basal vacuolization, keratinocyte necrosis)
      and acantholytic histology in one biopsy.
  - reference: PMID:2247105
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Cutaneous blisters, a positive Nikolsky's sign, and epidermal and esophageal acantholysis
      developed in all mice into which the autoantibody was injected.
    explanation: Passive transfer of patient IgG reproduced acantholysis, establishing the autoantibodies
      as pathogenic rather than epiphenomenal.
- name: Intractable Stomatitis and Mucosal Erosion
  description: Severe, painful, treatment-refractory mucosal erosion is the most consistent
    feature and usually the presenting one. It characteristically involves the oral mucosa and
    vermilion border, and frequently the conjunctiva and other mucosal surfaces. Its persistence
    despite therapy that would control pemphigus vulgaris is a diagnostic clue.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients typically present with severe stomatitis and polymorphous skin lesions,
      which are often resistant to treatment.
    explanation: Establishes severe, treatment-resistant stomatitis as the typical presentation.
  - reference: PMID:2247105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe five patients with underlying neoplasms in whom painful mucosal ulcerations
      and polymorphous skin lesions developed, usually with progression to blistering eruptions
      on the trunk and extremities.
    explanation: Original description of the painful mucosal ulceration that opens the illness.
- name: Polymorphous Cutaneous Eruption
  description: The skin eruption is heterogeneous within and between patients, spanning flaccid
    blisters and erosions, lichenoid papules, and targetoid erythema-multiforme-like lesions.
    This polymorphism reflects the parallel acantholytic and interface mechanisms.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients typically present with severe stomatitis and polymorphous skin lesions,
      which are often resistant to treatment.
    explanation: Establishes the polymorphous, treatment-resistant character of the cutaneous
      eruption.
  - reference: PMID:2247105
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We describe five patients with underlying neoplasms in whom painful mucosal ulcerations
      and polymorphous skin lesions developed, usually with progression to blistering eruptions
      on the trunk and extremities.
    explanation: Describes progression from polymorphous lesions to frank blistering.
- name: Bronchiolitis Obliterans
  description: Progressive obliterative small-airways disease develops when the same autoimmune
    attack involves respiratory epithelium, producing irreversible airflow obstruction. It is
    the distinguishing complication of this disease among the pemphigus group and the leading
    cause of death; it may progress even when the mucocutaneous disease is controlled.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Bronchiolitis obliterans (BO) is a frequent complication which contributes to the
      high mortality rate of PNP/PAMS.
    explanation: Establishes bronchiolitis obliterans as a frequent complication driving mortality.
  - reference: PMID:26358412
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found statistically significant correlations between positive desmoglein 3 reactivity
      and genital lesions, and between positive desmoglein 3 reactivity and bronchiolitis obliterans.
    explanation: Links the autoantibody profile to bronchiolitis obliterans, supporting a shared
      autoimmune mechanism rather than an incidental comorbidity.

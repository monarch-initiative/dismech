name: Paraneoplastic Pemphigus
creation_date: "2026-08-22T04:20:00Z"
category: Autoimmune
disease_term:
  preferred_term: paraneoplastic pemphigus
  term:
    id: MONDO:0018974
    label: paraneoplastic pemphigus
description: >-
  A highly fatal autoimmune blistering disease arising in patients with an underlying
  neoplasm, most often a lymphoproliferative disorder. Also called paraneoplastic
  autoimmune multiorgan syndrome, and the second name is the more accurate one: the
  disease is not confined to skin.

  What distinguishes it from the other paraneoplastic autoimmune syndromes is where the
  antibody comes from. In most of them the immune system mounts a response against a
  tumour antigen and that response cross-reacts with a host protein. Here, tumour cells of
  Castleman disease have been shown to secrete antibodies against plakin family proteins
  directly, and those antibodies detach cultured keratinocytes. The neoplasm is not the
  provocation for an autoimmune response; it is, at least in that setting, the factory.

  Two things follow that the entry is built around. Removing the tumour removes the
  antibody source, which is why tumour control is the first therapeutic move. And it does
  not reverse bronchiolitis obliterans, the airway complication that drives the mortality -
  once the small airways have scarred, lung transplantation is often the only option left.

parents:
- Pemphigus
- Autoimmune Bullous Disease
- Paraneoplastic Syndrome

pathophysiology:

- name: Underlying Neoplasm with Autoantibody Production
  role: trigger
  biological_scale: ORGANISM
  description: >-
    The disease requires a neoplasm, benign or malignant, most commonly lymphoproliferative.
    Castleman disease and non-Hodgkin lymphoma are the two that matter most, and they sit
    at opposite ends of the prognosis.

    The mechanistic claim here is stronger than association. Tumour cells from Castleman
    disease occurring with paraneoplastic pemphigus were shown to secrete antibodies
    against plakin family proteins, and those antibodies caused detachment of cultured
    keratinocytes. That makes the tumour an antibody source rather than merely the stimulus
    for one - which is the mechanistic difference between this disease and the
    cross-reactivity paraneoplastic syndromes.
  evidence:
  - reference: PMID:37597771
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part I. Clinical overview and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition occurs in patients with underlying benign or malignant neoplasms, most
      commonly lymphoproliferative disorders.
    explanation: >-
      Establishes the neoplasm as a requirement and names the dominant tumour class.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we investigated the role of the plakin family in PNP and proved that tumor cells of
      Castleman disease with PNP could secrete antibodies against plakin family proteins
      and cause detachment of cultured keratinocytes
    explanation: >-
      The tumour-as-antibody-source claim, which is the specific mechanism this node
      asserts and the reason it is curated as a trigger rather than a comorbidity.
  - reference: ORPHA:63455
    reference_title: "Paraneoplastic pemphigus"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      generally associated with lymphoma or chronic lymphoid leukemia
    explanation: >-
      Orphanet's own characterisation of the tumour association. Note that ORPHA:63455
      carries a definition and cross-references but no epidemiology or phenotype table, so
      it contributes nothing to prevalence for this disorder.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Castleman disease, which has been observed in up to 56% of PNP/PAMS patients, is more
      frequent in Asian countries
    explanation: >-
      The frequency of the tumour type in which the antibody-secretion mechanism was
      demonstrated, plus the geographic variation - which means the flagship mechanistic
      case is drawn from the commonest association in some populations and an uncommon one
      in others.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Solid tumors have been found in 14.8%−17% of PNP/PAMS patients
    explanation: >-
      The minority of cases in which the tumour is not lymphoproliferative, which bounds
      how far the B-cell-directed treatment rationale extends.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Few cases of PNP/PAMS have been diagnosed in the absence of an underlying malignancy
    explanation: >-
      PARTIAL, and the reason this node says the disease requires a neoplasm rather than
      that it always has one. The guideline reads these cases as a possible marker of
      occult malignancy requiring extended follow-up rather than as a tumour-free form of
      the disease, but it does not settle that.
  - reference: PMID:41483625
    reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resection of the paratracheal mass revealed lymphoid tissue with follicular and
      interfollicular stromal changes, atretic germinal centers and thickened mantle zones,
      consistent with unicentric Castleman disease, stroma-rich hyaline vascular variant.
    explanation: >-
      A worked case in which the causative neoplasm was identified and resected, with the
      Castleman histology that characterises it.
  downstream:
  - target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
    causal_link_type: DIRECT
    description: >-
      The antibodies the tumour produces are the ones that bind epithelial adhesion
      proteins.
  - target: Cell-Mediated Interface Mucositis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cellular arm. Curated with unknown intermediates because the sources establish
      that cell-mediated immunity contributes to pathogenesis and that interface mucositis
      is seen histologically, without demonstrating the steps from the neoplasm to the
      T-cell attack.

- name: Autoantibody Binding to Desmosomal Plakins and Desmogleins
  conforms_to: "desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade"
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Autoantibodies against plakin family proteins are the serological signature of the
    disease, alongside antibodies against desmoglein 3 and desmoglein 1. Direct
    immunofluorescence shows IgG and complement deposited both between epithelial cells and
    along the basement membrane zone - the two-compartment pattern that distinguishes this
    from pemphigus vulgaris.

    Which of these antibodies actually does the damage is not settled, and the entry treats
    that as an open question rather than smoothing it over. See the knowledge gap below.
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:37597771
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part I. Clinical overview and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both humoral and cell-mediated immunities contribute to the pathogenesis, and
      autoantibodies against plakin family proteins are characteristic.
    explanation: >-
      Names the plakin autoantibodies as characteristic and, in the same sentence,
      establishes that the humoral arm is not the whole story.
  - reference: PMID:41483625
    reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunofluorescence and serologic studies revealed IgG and complement deposition
      within intercellular epithelial spaces and along the basement membrane zone, together
      with circulating anti-plakin antibodies, establishing a diagnosis of paraneoplastic
      pemphigus.
    explanation: >-
      The deposition pattern in tissue plus the circulating antibody, which together are
      diagnostic.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paraneoplastic pemphigus (PNP) is an autoimmune bullous disease associated with
      underlying neoplasms and characterized by antibodies against desmoglein 3 (Dsg 3) and
      plakins.
    explanation: >-
      The two antibody families this node covers.
  downstream:
  - target: Desmosome Disruption and Keratinocyte Acantholysis
    causal_link_type: DIRECT
    description: >-
      Antibody binding to desmosomal components disrupts the junction.

- name: Desmosome Disruption and Keratinocyte Acantholysis
  conforms_to: "desmosomal_adhesion_failure#Acantholysis and Mechanical Failure of Desmosome-Dependent Tissues"
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The rate-limiting lesion, and the one with direct experimental support. Passive
    transfer of purified anti-desmoplakin C-terminus IgG into neonatal mice produced
    blisters and acantholysis in a dose-dependent way. Electron microscopy showed what the
    antibody actually does: keratin intermediate filaments disconnect from the desmosome,
    so the junction loses its cytoskeletal anchorage rather than being dissolved.
    Keratinocyte apoptosis followed on TUNEL staining.

    Anti-desmoglein 3 antibodies from patient sera had already been shown to cause
    acantholysis in the same model, so at least two distinct autoantibody specificities are
    independently pathogenic.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that anti-C terminus of desmoplakin autoantibodies caused blisters and
      acantholysis in mice skin at a dose-dependent manner.
    explanation: >-
      Passive transfer with a dose-response, which is the strongest form of evidence
      available for an autoantibody-mediated disease.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The electronic microscopy examination showed the disconnection of keratin
      intermediate filaments from desmosomes.
    explanation: >-
      The ultrastructural mechanism - loss of cytoskeletal anchorage rather than
      dissolution of the junction - which is what this node claims.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lastly, apoptosis of keratinocytes in the TUNEL assay was all detected in the skins of
      neonatal mice after injection of the anti-C terminus of desmoplakin autoantibodies.
    explanation: >-
      The apoptotic component, which is why this node carries an apoptosis process
      annotation alongside the adhesion one.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Autoantibodies against desmoglein 3 in sera of patients with PNP have been proven to
      cause acantholysis in vivo in neonatal mice.
    explanation: >-
      The prior demonstration for a different antibody specificity, establishing that more
      than one is pathogenic.
  downstream:
  - target: Severe Stomatitis
    causal_link_type: DIRECT
    description: >-
      Mucosal acantholysis, which is where the disease characteristically begins.
  - target: Cutaneous Blistering
    causal_link_type: DIRECT
    description: >-
      The same lesion in skin.
  - target: Acantholysis
    causal_link_type: DIRECT
    description: >-
      The histopathological expression of this node.
  - target: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The respiratory arm. Curated with unknown intermediates deliberately: the sources
      establish that bronchiolitis obliterans is a frequent complication driving mortality,
      and a lung wedge resection in one case showed bronchiolar scarring, but nothing cited
      here demonstrates that the airway lesion is produced by the same autoantibodies
      acting on respiratory epithelium.

- name: Cell-Mediated Interface Mucositis
  role: amplifier
  biological_scale: TISSUE
  description: >-
    The cellular arm, which the humoral account alone does not cover. Biopsies show
    intraepithelial clefting together with interface mucositis - a lichenoid,
    T-cell-mediated pattern of injury at the epithelial-stromal junction that antibody
    deposition does not explain.

    Its prognostic behaviour is counterintuitive and worth curating for that reason:
    lichenoid or interface dermatitis is associated with *longer* survival, and remains so
    in multivariable analysis. A histological pattern that indicates more immune attack
    predicts a better outcome, which is the kind of finding a purely antibody-centred model
    of this disease would not anticipate.
  evidence:
  - reference: PMID:37597771
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part I. Clinical overview and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both humoral and cell-mediated immunities contribute to the pathogenesis, and
      autoantibodies against plakin family proteins are characteristic.
    explanation: >-
      Establishes the cell-mediated contribution this node models.
  - reference: PMID:41483625
    reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsy of the oral lesions showed intraepithelial clefting and interface mucositis.
    explanation: >-
      The histology, showing the acantholytic and the interface patterns together in the
      same lesion.
  - reference: PMID:39426525
    reference_title: "A systematic review of paraneoplastic pemphigus and paraneoplastic autoimmune multiorgan syndrome: Clinical features and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the multifactorial Cox proportional hazards regression model, non-Hodgkin lymphoma
      (hazard ratio, 1.959; 95% CI, 1.286-2.985; P = .002) and lichenoid/interface
      dermatitis (hazard ratio, 0.555; 95% CI, 0.362-0.850; P = .007) remained associated
      with the prognosis of PNP/PAMS patients.
    explanation: >-
      The protective association of the interface pattern, surviving multivariable
      adjustment, which is the counterintuitive finding this node's description flags.
  downstream:
  - target: Severe Stomatitis
    causal_link_type: DIRECT
    description: >-
      Interface mucositis is an oral lesion in its own right, and oral involvement is where
      the disease characteristically starts.

- name: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
  role: consequence
  biological_scale: TISSUE
  description: >-
    The complication that determines survival. Small airways scar and obliterate, producing
    progressive dyspnoea and respiratory failure.

    It is curated as a node rather than only as a phenotype because of what it implies for
    treatment. The scarring is structural and does not reverse when the antibody source is
    removed, so controlling the neoplasm - which is otherwise the definitive move in this
    disease - leaves this arm behind. Lung transplantation is often the only option once
    the tumour is controlled.
  evidence:
  - reference: PMID:37597771
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part I. Clinical overview and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchiolitis obliterans (BO) is a frequent complication which contributes to the high
      mortality rate of PNP/PAMS.
    explanation: >-
      Frequency and mortality contribution, which is what makes this node the prognostically
      decisive one.
  - reference: PMID:41483625
    reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wedge resection of the lung showed focal bronchiolar scarring supporting the clinical
      impression of bronchiolitis obliterans.
    explanation: >-
      Tissue confirmation of the airway lesion, rather than a clinical impression alone.
  - reference: PMID:41483625
    reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchiolitis obliterans, in particular, has been identified as a marker of poor
      prognosis in patients with PAMS and lung transplantation often represents the only
      viable treatment option once the underlying neoplasm has been controlled.
    explanation: >-
      The irreversibility claim on which this node's therapeutic significance rests, in the
      source's own words.
  downstream:
  - target: Bronchiolitis Obliterans
    causal_link_type: DIRECT
    description: >-
      The clinical and radiological expression of this node.

phenotypes:

- category: Mucosal
  name: Severe Stomatitis
  description: >-
    Intractable oral mucosal involvement, characteristically the presenting feature and
    often the most treatment-resistant. Initial oral involvement is associated with longer
    survival, probably because it brings patients to attention earlier.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Stomatitis
    term:
      id: HP:0010280
      label: Stomatitis
    severity: SEVERE
  evidence:
  - reference: PMID:37597771
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part I. Clinical overview and pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients typically present with severe stomatitis and polymorphous skin lesions, which
      are often resistant to treatment.
    explanation: >-
      The presenting picture and its treatment resistance. "Typically present" supports the
      VERY_FREQUENT band for a presenting feature.


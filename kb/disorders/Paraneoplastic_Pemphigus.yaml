    explanation: >-
      Names the outcome of the airway disease.

animal_models:

- name: Neonatal mouse passive transfer (anti-desmoplakin C-terminus IgG)
  species: Mouse
  genotype: >-
    Wild-type neonatal mouse; passive transfer of patient IgG purified against the
    desmoplakin C-terminus
  background: Neonatal mice
  publication: PMID:35911677
  description: >-
    The experiment this entry's central effector rests on. Serum was obtained by
    plasmapheresis from a 16-year-old patient with paraneoplastic pemphigus, the
    anti-desmoplakin C-terminus IgG purified from it, and injected into neonatal mice.

    The donor's tumour was never characterised, and the entry does not claim otherwise. She
    met the study's inclusion criterion of an underlying lymphoproliferative neoplasm on the
    strength of a 5 x 4 cm mediastinal mass, and died of sepsis while being prepared for
    surgery, so no histology was obtained. A mediastinal mass in an adolescent with this
    disease is suggestive of Castleman disease, but that is an inference, not the reported
    diagnosis - and the distinction matters here, because this entry's organising thesis is
    that Castleman tumour cells are the antibody factory. That thesis rests on the group's
    separate earlier work on Castleman tumour cells, not on this donor.

    It is also a passive-transfer model rather than a disease model: it reproduces the
    effector step, not the disease. There is no tumour, no antibody production, and no
    airway involvement - so it speaks to whether an antibody specificity is pathogenic and
    to nothing else.
  modeled_mechanisms:
  - target: Desmosome Disruption and Keratinocyte Acantholysis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the node's three curated components - blistering, ultrastructural loss of
      keratin anchorage, and keratinocyte apoptosis - from purified antibody alone, with a
      dose-response.
    limitations: >-
      Neonatal mouse skin, a single donor patient, and an effector step isolated from its
      cause. The model cannot address the airway arm, which is where this disease's
      mortality sits, and it says nothing about which specificities dominate in unselected
      patients.
    readouts:
    - name: Blister formation and acantholysis in skin
      target: Desmosome Disruption and Keratinocyte Acantholysis
      direction: INCREASED
      interpretation: >-
        Dose-dependence is what raises this from association to causation for this
        specificity.
      evidence:
      - reference: PMID:35911677
        reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that anti-C terminus of desmoplakin autoantibodies caused blisters and
          acantholysis in mice skin at a dose-dependent manner.
        explanation: >-
          The measurement and its dose-response.
    - name: Keratin intermediate filament attachment to desmosomes on electron microscopy
      target: Desmosome Disruption and Keratinocyte Acantholysis
      direction: DECREASED
      interpretation: >-
        Identifies the lesion as loss of cytoskeletal anchorage rather than dissolution of
        the junction itself.
      evidence:
      - reference: PMID:35911677
        reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The electronic microscopy examination showed the disconnection of keratin
          intermediate filaments from desmosomes.
        explanation: >-
          The ultrastructural readout.
    - name: Keratinocyte apoptosis by TUNEL assay
      target: Desmosome Disruption and Keratinocyte Acantholysis
      direction: INCREASED
      interpretation: >-
        The apoptotic component, which is why the node carries an apoptosis annotation
        alongside the adhesion one.
      evidence:
      - reference: PMID:35911677
        reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Lastly, apoptosis of keratinocytes in the TUNEL assay was all detected in the skins
          of neonatal mice after injection of the anti-C terminus of desmoplakin
          autoantibodies.
        explanation: >-
          The apoptosis readout in the same model.
    evidence:
    - reference: PMID:35911677
      reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Autoantibodies against desmoglein 3 in sera of patients with PNP have been proven to
        cause acantholysis in vivo in neonatal mice.
      explanation: >-
        Establishes the model as an accepted assay for this node before this study used it,
        which is what makes it informative rather than bespoke.

- name: Neonatal mouse passive transfer (anti-envoplakin / anti-periplakin IgG)
  species: Mouse
  genotype: >-
    Wild-type neonatal mouse; passive transfer of patient IgG purified against envoplakin
    and periplakin
  background: Neonatal mice
  publication: PMID:35911677
  description: >-
    The same assay, the same species, a different antibody specificity - and no disease.

    This is curated as its own model entry rather than as a caveat on the one above because
    it is a substantive negative claim, and because the specificity that failed here is the
    one that is almost universally detectable in patients and independently predicts death.
    A negative result in a model that demonstrably works for other specificities is
    informative in a way that a negative result in an untested model is not.
  modeled_mechanisms:
  - target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
    relationship: FAILS_TO_RECAPITULATE
    fidelity: MODERATE
    description: >-
      Purified anti-envoplakin and anti-periplakin patient antibodies produced no
      pathological change. The model therefore does not support these specificities as
      pathogenic effectors, while supporting anti-desmoplakin and anti-desmoglein 3 in the
      same system.

      This is the structural form of the entry's sharpest open question: the marker that
      predicts mortality is not the one that reproduces disease. Either it reports on
      something else that kills, or the model misses how it acts.
    limitations: >-
      A negative passive-transfer result cannot distinguish a non-pathogenic antibody from
      one whose pathogenicity requires a cofactor the model lacks - a second specificity, a
      cell-mediated arm, a target the neonatal mouse does not express in the same form, or a
      duration longer than the assay. The result constrains the claim; it does not settle
      it.
    evidence:
    - reference: PMID:35911677
      reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Still, our previous study failed in observing any phenotype in mouse skin to prove
        the pathogenesis of antibodies against envoplakin and periplakin.
      explanation: >-
        The negative result, in the source's species-specific phrasing - mouse skin rather
        than "animal models" - which is what this entry's species assertion actually needs.
        The broader statement of the same result is curated on the envoplakin/periplakin
        biomarker record.

biochemical:

- name: Anti-envoplakin and anti-periplakin autoantibodies
  context: >-
    The serological hallmark of the disease and the basis of its diagnostic criteria -
    almost universally detectable by immunoblotting, with epitopes mapped.

    They are also the sharpest thing in the entry, because two findings about them point in
    opposite directions. Their presence is independently associated with death in the
    largest series of haematologic-malignancy-associated cases; and purified patient
    antibodies against them failed to produce any pathological change in animal models. A
    marker that predicts mortality without being demonstrably pathogenic is either a
    reporter of something else or a pathogenic mechanism the models do not capture, and
    nothing curated here distinguishes those.
  presence: Present in almost all patients by immunoblotting
  specificity: >-
    Highly specific for paraneoplastic pemphigus among the pemphigus group; anti-plakin
    reactivity is one of the consensus diagnostic characteristics.
  biomarker_term:
    preferred_term: circulating anti-envoplakin and anti-periplakin IgG autoantibodies
  evidence:
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      especially envoplakin and periplakin (5), which were almost universally detected by
      immunoblotting (IB)
    explanation: >-
      Establishes near-universal detectability, and the assay it depends on.
  - reference: PMID:30981429
    reference_title: "Risk factors for death and survival in paraneoplastic pemphigus associated with hematologic malignancies in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis showed that (1) the presence of antienvoplakin antibodies and BO
      were significantly associated with death
    explanation: >-
      The prognostic half of the tension described in the context field, from a systematic
      review of 144 patients and surviving multivariable adjustment.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, patients’ antibodies purified by these two proteins failed to cause any
      pathological changes in animal models.
    explanation: >-
      REFUTE against pathogenicity, not against the marker. This is the other half of the
      tension: the antibody that predicts death did nothing when transferred.

- name: Anti-desmoglein 3 autoantibodies
  context: >-
    The one specificity whose pathogenic role is established by passive transfer, and the
    one that cannot serve as the general explanation - it is absent or low in a significant
    proportion of patients who nonetheless have the disease.
  presence: Variably present; absent or low in a significant proportion of patients
  biomarker_term:
    preferred_term: circulating anti-desmoglein 3 IgG autoantibodies
  evidence:
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it cannot explain the absence or low levels of anti-desmoglein 3 antibodies in a
      significant portion of PNP patients
    explanation: >-
      The coverage problem, quoted separately from the animal-model half of the same
      sentence so each evidence item carries a single evidence_source.

- name: Anti-desmoplakin autoantibodies
  context: >-
    Most frequently detected by immunoprecipitation. Pathogenicity of the C-terminal
    specificity was only demonstrated in 2022, by passive transfer with dose-dependent
    blistering - which is why this entry's central effector node rests on desmoplakin
    rather than on the more commonly assayed plakins.
  biomarker_term:
    preferred_term: circulating anti-desmoplakin IgG autoantibodies
  evidence:
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the plakin family, DP, most frequently detected by immunoprecipitation (IP),
      shares high homology with the others
    explanation: >-
      The assay by which this specificity is usually found, and its homology to the others -
      which is what makes specificity-resolved passive transfer the experiment the knowledge
      gap asks for.

- name: Anti-alpha-2-macroglobulin-like protein 1 (A2ML1) autoantibodies
  context: >-
    Reported in up to 70% of sera, originally described as the p170 kDa antigen of the
    classical five-antigen immunoprecipitation complex. Curated because it is the one
    frequent target that is not a plakin or a cadherin, so a purely desmosomal account of
    the serology is incomplete.
  biomarker_term:
    preferred_term: circulating anti-A2ML1 IgG autoantibodies
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to 70% of PNP/PAMS sera show reactivity to
    explanation: >-
      The frequency. The antigen name in the source uses a mathematical minus sign in
      "α−2-macroglobulin-like protein 1", so the quote stops before it rather than risk a
      character-level mismatch; the antigen is named in this record's own name field.

- name: Anti-bullous pemphigoid 230 (BP230) autoantibodies
  context: >-
    A less frequent target, curated because it is an adverse prognostic factor rather than
    a diagnostic one - it predicted shorter survival in the 504-patient systematic review.
    Previously this fact existed only as prose inside a progression note, where nothing
    could query it.
  biomarker_term:
    preferred_term: circulating anti-BP230 IgG autoantibodies
  evidence:
  - reference: PMID:39426525
    reference_title: "A systematic review of paraneoplastic pemphigus and paraneoplastic autoimmune multiorgan syndrome: Clinical features and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it was found that older age, circulating bullous pemphigoid 230 autoantibodies,
      non-Hodgkin lymphoma, and possible history of causative drugs were associated with
      shorter survival time
    explanation: >-
      The prognostic association, as a structured biomarker rather than as free text.

prevalence:

- population: Worldwide
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_high: 0.1
  notes: >-
    An upper bound, not a point estimate, and the guideline says so in the preceding
    sentence: there is little data allowing an estimate at all. Recorded as rate_high only,
    since "less than one new case per million inhabitants per year" gives a ceiling of 0.1
    per 100,000 per year and no lower bound.

    Note that Orphanet has no epidemiology record for this disorder. ORPHA:63455 carries a
    definition and cross-references but no prevalence table and no HPO frequency table, so
    this figure comes from the EADV S2k guideline instead.
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on published reports, one may nevertheless estimate that the incidence of
      PNP/PAMS is less than one new case per million inhabitants per year.
    explanation: >-
      The figure and its epistemic status - an estimate from published reports, in a
      consensus guideline rather than a population study. Tagged OTHER for that reason.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It is a very rare disease and there is little data allowing an estimation of its
      incidence and prevalence
    explanation: >-
      The guideline's own qualification of the figure above, curated so the limitation
      travels with the number.

progression:

- phase: Survival and prognostic determinants
  notes: >-
    A systematic review of 290 articles covering 504 patients, with survival data on 281,
    is the largest synthesis available and the source of what is known about prognosis.
    Older age, circulating bullous pemphigoid 230 autoantibodies, non-Hodgkin lymphoma and
    a possible history of causative drugs predicted shorter survival; initial oral mucosal
    involvement, lichenoid or interface dermatitis, Castleman disease and epithelial-derived
    tumours predicted longer survival. Only two survived multivariable adjustment:
    non-Hodgkin lymphoma as a hazard, and lichenoid/interface dermatitis as a protective
    factor.

    The tumour type is therefore the dominant prognostic variable, which is consistent with
    the entry's framing of the neoplasm as the driver rather than the setting.
  evidence:
  - reference: PMID:39426525
    reference_title: "A systematic review of paraneoplastic pemphigus and paraneoplastic autoimmune multiorgan syndrome: Clinical features and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After drawing the Kaplan-Meier survival curves for 281 patients with available survival
      information, it was found that older age, circulating bullous pemphigoid 230
      autoantibodies, non-Hodgkin lymphoma, and possible history of causative drugs were
      associated with shorter survival time.
    explanation: >-
      The adverse prognostic factors, with the cohort size behind them.
  - reference: PMID:39426525
    reference_title: "A systematic review of paraneoplastic pemphigus and paraneoplastic autoimmune multiorgan syndrome: Clinical features and prognostic factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial oral mucosal involvement, lichenoid/interface dermatitis, Castleman disease,
      and epithelial-derived tumors were associated with longer survival time.
    explanation: >-
      The favourable factors, including the Castleman-versus-lymphoma split this entry's
      trigger node describes.

- phase: Mortality
  notes: >-
    Three independent estimates, and they do not agree - which is itself the finding, since
    all three are syntheses of case reports rather than cohorts.

    The earliest review put mortality at 90% of 33 patients within two years. A French
    multicentre series of 53 patients gave one-year and five-year overall survival of 49%
    and 38%. A systematic review restricted to haematologic-malignancy-associated disease
    (144 patients) gave 57%, with most deaths in the first year.

    What is consistent across them is the timing rather than the rate: death is
    concentrated early, and the causes named are infection under immunosuppression,
    bronchiolitis obliterans-related respiratory failure, and progression of the underlying
    malignancy - in that order in the French series. So the disease, its treatment and its
    tumour each kill a share of patients, which is why no single node in the pathograph
    carries the prognosis.
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While in a first review by Anhalt et al45, 90% of 33 PNP/PAMS patients died within two
      years after diagnosis
    explanation: >-
      The earliest and highest estimate. Tagged OTHER because it is a guideline's citation
      of a historical review rather than primary data.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the latter study, the main cause of death was severe infection due to the
      immunosuppressive treatment, followed by bronchiolitis obliterans-related respiratory
      failure and progression of the underlying malignancy
    explanation: >-
      The ranked causes of death, which is what makes the prognosis multi-causal rather
      than attributable to one arm of the pathograph.
  - reference: PMID:30981429
    reference_title: "Risk factors for death and survival in paraneoplastic pemphigus associated with hematologic malignancies in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mortality rate was 57%, and most deaths occurred within the first year after the
      diagnosis of PNP.
    explanation: >-
      The haematologic-malignancy-restricted estimate and the timing, from 144 patients.

- phase: Bronchiolitis obliterans as an independent survival factor
  notes: >-
    The airway arm is not merely a complication that happens to be serious - it survives
    multivariable adjustment as a determinant of both death and shortened survival,
    alongside a toxic-epidermal-necrolysis-like and a bullous-pemphigoid-like clinical
    pattern.

    This is the quantitative support for the entry's second spine: the consequence that
    tumour control does not reverse is also the consequence that decides the outcome.
  evidence:
  - reference: PMID:30981429
    reference_title: "Risk factors for death and survival in paraneoplastic pemphigus associated with hematologic malignancies in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a toxic epidermal necrolysis-like clinical pattern, bullous pemphigoid-like clinical
      pattern, and BO were significantly associated with decreased survival
    explanation: >-
      The multivariable result for the airway arm and the two cutaneous patterns.
  - reference: PMID:30981429
    reference_title: "Risk factors for death and survival in paraneoplastic pemphigus associated with hematologic malignancies in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The toxic epidermal necrolysis-like and BO-associated forms are independent survival
      factors in PNP associated with HMs.
    explanation: >-
      The authors' own conclusion, stating independence explicitly.

diagnosis:

- name: Consensus diagnostic characteristics (EADV S2k)
  description: >-
    There is no validated diagnostic criterion set for this disease, and the guideline that
    proposes one says so about its own proposal. What most patients share is a combination:
    severe chronic stomatitis with multi-site mucosal involvement and variable skin lesions,
    an underlying neoplasm known or later found, a mixed histology, immunoreactant deposits
    on direct immunofluorescence, rat-bladder reactivity on indirect immunofluorescence, and
    binding to a variable set of autoantigens.

    The variability is the point. No single test defines the disease, and the antigen panel
    is explicitly "a variable set" - which is the diagnostic face of the same problem the
    knowledge gap below states mechanistically.
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      severe chronic stomatitis with multi-site mucosal involvement accompanied by variable
      cutaneous lesions
    explanation: >-
      The first and most constant of the six consensus characteristics.
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      these criteria have been proposed by consensus agreement among experts, and thereby
      will require validation by large multicentric prospective investigations in the near
      future
    explanation: >-
      PARTIAL, and deliberately curated alongside the criteria rather than after them: the
      guideline states that its own criteria are unvalidated.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The criteria we applied included progressive stomatitis, histologic features of
      acantholysis or lichenoid or interface dermatitis, demonstration of serum antiplakin
      autoantibodies by immunoblotting or immunoprecipitation, and the presence of an
      underlying lymphoproliferative neoplasm
    explanation: >-
      An independent group's applied criteria, which agree with the consensus set on
      stomatitis, histology, antiplakin serology and the neoplasm - useful because it shows
      the criteria in operational use rather than only as a proposal.

- name: Indirect immunofluorescence on rat bladder epithelium
  description: >-
    The test that most specifically separates this disease from the other pemphigus
    variants. Rat bladder transitional epithelium expresses plakins but little desmoglein,
    so a serum that binds it is reporting anti-plakin reactivity rather than the
    anti-desmoglein reactivity of pemphigus vulgaris.
  diagnosis_term:
    preferred_term: indirect immunofluorescence on rat bladder epithelium
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Positive on rat bladder substrate; titre 1:160 in the flagship case
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      reactivity with rat bladder transitional epithelia by indirect immunofluorescence
      (IIF) studies
    explanation: >-
      The consensus characteristic naming the substrate.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IIF using rat bladder as substrate was also positive and the titer was 1:160
    explanation: >-
      The test in use, with a titre, in the patient whose serum supplied the passive-transfer
      experiment this entry's central effector rests on.

- name: Immunoblotting and immunoprecipitation for antiplakin autoantibodies
  description: >-
    The assays that identify the antigen panel, and the practical bottleneck in diagnosing
    this disease - the guideline names their limited availability as one of three reasons
    diagnosis remains challenging.
  diagnosis_term:
    preferred_term: immunoblotting and immunoprecipitation for antiplakin autoantibodies
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: envoplakin, periplakin, desmoplakin, desmoglein 3, A2ML1
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the fact that the detection of circulating autoantibodies may require highly
      specialized tools, such as IB/IP, which are not broadly available
    explanation: >-
      The availability constraint, which is a fact about diagnosing the disease rather than
      about the disease.
  - reference: PMID:37714216
    reference_title: "Paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome: Part II. Diagnosis and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Evaluating PNP/PAMS requires knowledge of its findings on histopathology, direct
      immunofluorescence, indirect immunofluorescence, and enzyme-linked immunosorbent
      assay.
    explanation: >-
      The full modality list, and the one thing the CME review adds that the guideline
      section above does not name: ELISA alongside the immunoblot and immunoprecipitation
      assays. No single test defines the disease, which is why this entry curates the
      workup as a set rather than as a gold standard.

differential_diagnoses:

- name: Good syndrome
  description: >-
    The closest mimic in the thymoma setting, and the one distinguished by a negative rather
    than a positive: both direct and indirect immunofluorescence are negative. Curated
    because a thymoma plus lichenoid oral and cutaneous lesions is otherwise a plausible
    presentation of this disease.
  distinguishing_features:
  - Combined B-cell and T-cell immunodeficiency of adult onset
  - Direct and indirect immunofluorescence both negative, where paraneoplastic pemphigus
    requires immunoreactant deposition and rat-bladder reactivity
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These patients have thymoma and combined B-cell and T-cell immunodeficiency of adult
      onset and may present with lichenoid oral and cutaneous lesions. Both DIF and IIF are
      negative in this syndrome.
    explanation: >-
      The presentation and the discriminating test result.

- name: Oral lichen planus
  description: >-
    The mucosal lesions can mimic true oral lichen planus both clinically and
    histopathologically, in erosive and reticular forms alike - which matters because the
    lichenoid/interface pattern is simultaneously a favourable prognostic factor in this
    disease and the feature that makes it look like something else.
  distinguishing_features:
  - No underlying neoplasm
  - No antiplakin serology
  - No rat-bladder indirect immunofluorescence reactivity
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mucous membrane lesions of PNP/PAMS may closely mimic “true” oral lichen planus both
      clinically and histopathologically with both erosive and lichenoid reticular lesions
    explanation: >-
      The clinical and histological overlap.

- name: Anti-plakin dermatosis
  description: >-
    A reported eruption with envoplakin and periplakin antibodies but negative
    immunofluorescence and no malignancy, read by the guideline as a variant of relapsing
    erythema multiforme rather than as this disease. It matters to the entry's central
    claim: antiplakin antibodies without a tumour do not reproduce the syndrome, which is
    consistent with the tumour being the source rather than a bystander.
  distinguishing_features:
  - Negative immunofluorescence
  - No underlying malignancy
  - Transient rather than chronic course
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, these disorders are usually transient, compared to the chronic course of
      PNP/PAMS.
    explanation: >-
      The distinguishing course.

- name: Acute cutaneous graft-versus-host disease
  description: >-
    Clinically and pathologically similar, and separated by history and timing rather than
    by any test. Worth curating because both are immune attacks on stratified epithelium
    with mucosal and cutaneous involvement.
  distinguishing_features:
  - Clinical history and timing after allogeneic haematopoietic stem cell transplantation
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GVHD is differentiated from PNP/PAMS on the ground of the clinical history and timing
      after allogeneic hematopoietic stem cell transplantation
    explanation: >-
      The basis of the distinction, which is circumstantial rather than serological.

treatments:

- name: Treatment of the Underlying Neoplasm
  description: >-
    The move that follows from the mechanism: if the tumour is producing the autoantibody,
    removing it removes the source. In the worked Castleman case the paratracheal mass was
    resected.

    That reasoning holds much less often than the mechanism suggests, and the entry now
    says so rather than letting the inference stand. The EADV guideline states that
    treatment of the underlying neoplasia *rarely* has a favourable impact on the clinical
    course - while also stating, in a later section, that treating the malignancy is always
    recommended because it can result in improvement. Those two sentences are in tension
    within one document, and the reconciliation the guideline implies is anatomical rather
    than immunological: a *resectable* tumour, such as Castleman disease or thymoma, can be
    removed outright and remission follows in up to half of such patients, whereas a
    disseminated haematological malignancy is controlled rather than eliminated and the
    antibody source persists.

    So the tumour-as-factory model predicts the outcome of surgery, not the outcome of
    chemotherapy. The entry curates the distinction because a reader who took the mechanism
    at face value would over-predict benefit.

    A second limit is mechanistic in the other direction. Tumour control does not reverse
    established airway scarring, so even when it works it treats the cause without treating
    the complication that determines survival.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: tumour-directed therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Underlying Neoplasm with Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Removes or controls the source of the pathogenic autoantibodies. Acts on the trigger
      node, which is why it is the only treatment here that is disease-modifying rather
      than suppressive.
    evidence:
    - reference: PMID:41483625
      reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchiolitis obliterans, in particular, has been identified as a marker of poor
        prognosis in patients with PAMS and lung transplantation often represents the only
        viable treatment option once the underlying neoplasm has been controlled.
      explanation: >-
        PARTIAL because it establishes tumour control as the expected first step while
        stating in the same sentence what that step does not achieve.
    - reference: PMID:36965110
      reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Despite the strong association with malignancy, treatment of the underlying
        neoplasia rarely has a favorable impact on the clinical course of PNP/PAMS
      explanation: >-
        The qualification that keeps this treatment from being read as curative. PARTIAL
        rather than REFUTE because the same guideline recommends treating the malignancy
        anyway, and the next quote gives the setting in which it does work.
    - reference: PMID:36965110
      reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        in patients with an underlying resectable tumor, curative surgery may result in
        remission in up to half of patients
      explanation: >-
        The setting in which removing the source does remit the disease, which is what
        makes the split above anatomical rather than arbitrary.
    - reference: PMID:36965110
      reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Early detection and radical resection of tumors such as Castleman’s disease or
        thymoma have occasionally been shown to have a beneficial effect and lead to
        PNP/PAMS resolution
      explanation: >-
        Names the two tumours for which resection is documented to resolve the syndrome -
        including the one in this entry's flagship mechanistic case.

- name: Rituximab
  description: >-
    Anti-CD20 B-cell depletion, and the treatment whose rationale fits this disease's
    mechanism most exactly: in lymphoproliferative-associated disease the same drug depletes
    the neoplastic B cells and the autoreactive ones, which in the tumour-as-factory model
    are largely the same cells. The guideline calls it the preferred strategy in that
    setting for precisely this dual action.

    Split from corticosteroids, which were previously bundled with it. The two act on
    different things and have different evidence, and the guideline reports a differential
    organ response for steroids that would be hidden by a combined entry.

    The overarching caveat is the guideline's own: there is no evidence supporting any
    specific therapy in this disease, because it is too rare for any to have been tested.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Underlying Neoplasm with Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      The dual action. In B-cell-malignancy-associated disease rituximab depletes the
      neoplastic compartment that is producing the antibody, so it acts on the trigger node
      and not only on the antibody it makes.
    evidence:
    - reference: PMID:36965110
      reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        B-cell depleting therapies such as rituximab represent the preferred strategy by
        targeting both neoplastic and autoaggressive lymphocytes
      explanation: >-
        States the dual target explicitly, which is what justifies wiring this drug to the
        trigger node as well as to the antibody node.
  - target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
    treatment_effect: INHIBITS
    description: >-
      B-cell depletion reduces production of the pathogenic autoantibodies themselves.
    evidence:
    - reference: PMID:41483625
      reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient was treated with steroids and rituximab and recently underwent bilateral
        lung transplantation due to progressive respiratory symptoms.
      explanation: >-
        Establishes the regimen in use. Note the same sentence records that the respiratory
        disease progressed regardless.
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      There is no evidence supporting the use of any specific therapy due to the rarity of
      the condition
    explanation: >-
      The guideline's blanket statement about therapy in this disease, curated on the
      treatment rather than only in notes so the limitation travels with it. PARTIAL
      because it neither supports nor refutes this drug - it says the question is
      unanswered.

- name: Systemic Corticosteroids
  description: >-
    First-line despite inconsistent responses, and curated separately from rituximab
    because the guideline reports something a combined entry would hide: steroids usually
    help the skin, while the mucositis and the bronchiolitis obliterans - the two features
    that drive morbidity and mortality - may be less responsive.

    That differential maps onto the pathograph. Steroids act on the arm this entry curates
    as reversible and not on the arm it curates as irreversible, which is the same shape as
    the lung transplantation entry below.

    Prednisolone 0.5 to 1.5 mg/kg/day, usually with a steroid-sparing agent, and at the
    cost of infection risk in a disease whose commonest cause of death is infection under
    immunosuppression.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: prednisolone
      term:
        id: CHEBI:8378
        label: prednisolone
  target_mechanisms:
  - target: Cell-Mediated Interface Mucositis
    treatment_effect: INHIBITS
    description: >-
      Broad suppression of the inflammatory response. Curated as acting on the
      cell-mediated arm rather than on antibody production, and the guideline's own report
      that mucositis is among the less responsive features is attached rather than omitted.
    evidence:
    - reference: PMID:36965110
      reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        Systemic steroids usually have a beneficial effect on cutaneous lesions, while
        PNP/PAMS-associated mucositis and bronchiolitis obliterans may be less responsive.
      explanation: >-
        PARTIAL, and the reason this treatment is split out: the same sentence supports
        benefit in skin and reports its absence in the two features that matter most.
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      systemic corticosteroids still remain the first line of treatment for patients with
      PNP/PAMS
    explanation: >-
      Establishes first-line status. PARTIAL because the guideline states it immediately
      after conceding that responses are inconsistent and may carry life-threatening
      complications.

- name: Intravenous Immunoglobulin
  description: >-
    Curated at the strength the guideline states it, which is low: high doses have "also
    been employed", with no efficacy claim and no comparison. It is listed here rather than
    omitted because a reader looking for what has been tried should find it, and because
    the alternative - leaving it out - would imply it has not been.

    Deliberately carries no target_mechanisms. IVIG in autoantibody-mediated disease is
    usually rationalised as accelerating IgG catabolism and blocking Fc receptors, but
    nothing cited here says which node it acts on in this disease, and inventing an edge
    would assert a mechanism the sources do not.

    A peri-operative rationale - giving IVIG around tumour resection to blunt
    antibody-mediated bronchiolar injury at the moment of tumour lysis - was raised by the
    deep-research report and is NOT curated. It would bear directly on this entry's second
    knowledge gap, which is exactly why it needs a primary source; the EADV guideline does
    not make the claim, and a PubMed search for it did not surface one. Recorded so the
    lead is not lost.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  evidence:
  - reference: PMID:36965110
    reference_title: "S2k guidelines on the management of paraneoplastic pemphigus/paraneoplastic autoimmune multiorgan syndrome initiated by the European Academy of Dermatology and Venereology (EADV)."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      High doses of intravenous immunoglobulins (IVIG) have also been employed
    explanation: >-
      PARTIAL because it establishes use and nothing else - no dose comparison, no outcome,
      no control. That is the whole of what the guideline says about IVIG.

- name: Lung Transplantation
  description: >-
    The salvage option for established bronchiolitis obliterans, and one that only makes
    sense once the neoplasm is controlled - transplanting into an uncontrolled antibody
    source would reproduce the disease in the graft.

    That it is described as often the only viable option is the clearest statement of this
    disease's shape: the cause is treatable and one of its consequences is not.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lung transplantation
    term:
      id: NCIT:C15274
      label: Lung Transplantation
  target_mechanisms:
  - target: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
    treatment_effect: BYPASSES
    description: >-
      Replaces the scarred airways rather than reversing the scarring. Curated as BYPASSES
      rather than INHIBITS because it does not act on the mechanism at all - it substitutes
      the organ the mechanism destroyed.
    evidence:
    - reference: PMID:41483625
      reference_title: "From the archives of MD Anderson Cancer Center: Paraneoplastic autoimmune multiorgan syndrome (PAMS) associated with stroma-rich Castleman disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchiolitis obliterans, in particular, has been identified as a marker of poor
        prognosis in patients with PAMS and lung transplantation often represents the only
        viable treatment option once the underlying neoplasm has been controlled.
      explanation: >-
        States both the indication and its precondition, which is why this treatment is
        curated as acting on the airway node and sequenced after tumour control.

discussions:

- discussion_id: gap_which_autoantibody_is_pathogenic
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the many autoantibodies in paraneoplastic pemphigus actually cause the
    disease, given that the most reliably detected ones are not the demonstrably pathogenic
    ones?
  attaches_to:
  - pathophysiology#Autoantibody Binding to Desmosomal Plakins and Desmogleins
  - pathophysiology#Desmosome Disruption and Keratinocyte Acantholysis
  rationale: >-
    Patients carry autoantibodies against desmoglein 1 and 3, alpha-2-macroglobulin-like-1,
    and a long list of plakins - epiplakin, plectin, desmoplakin, bullous pemphigoid antigen
    1, envoplakin and periplakin. Detectability and pathogenicity do not line up.

    Envoplakin and periplakin are almost universally detected by immunoblotting, and their
    major epitopes have been mapped - yet patient antibodies purified against those two
    proteins failed to produce any pathological change in animal models. Anti-desmoglein 3
    antibodies are demonstrably pathogenic by passive transfer, but a significant proportion
    of patients have low or absent anti-desmoglein 3, so they cannot be the general
    explanation. Anti-desmoplakin C-terminus antibodies were shown pathogenic only in 2022,
    and desmoplakin is the plakin most frequently detected by immunoprecipitation.

    So the serological profile that defines the disease diagnostically is not the profile
    that explains it mechanistically, and the entry curates the antibody node without
    claiming to know which specificity drives which lesion. This matters for treatment: a
    therapy targeting one specificity would be expected to work only in the subset it
    explains, and there is currently no way to identify that subset prospectively.
  evidence:
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, patients’ antibodies purified by these two proteins failed to cause any
      pathological changes in animal models.
    explanation: >-
      The negative result for envoplakin and periplakin, which is the crux of this gap and
      is easy to miss because it is a negative.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the animal model has demonstrated the pathogenetic role of anti-desmoglein 3
      antibodies
    explanation: >-
      The established half: this specificity is pathogenic by passive transfer. Split from
      the human-serology half of the same sentence so each item carries one evidence_source.
  - reference: PMID:35911677
    reference_title: "Paraneoplastic Pemphigus Autoantibodies Against C-terminus of Desmoplakin Induced Acantholysis In Vitro and In Vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it cannot explain the absence or low levels of anti-desmoglein 3 antibodies in a
      significant portion of PNP patients
    explanation: >-
      The coverage problem in patients, which is a serological observation rather than a
      model-organism one.
  - reference: PMID:30981429
    reference_title: "Risk factors for death and survival in paraneoplastic pemphigus associated with hematologic malignancies in adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multivariate analysis showed that (1) the presence of antienvoplakin antibodies and BO
      were significantly associated with death
    explanation: >-
      Sharpens the gap rather than narrowing it. The specificity that is almost universally
      present and independently predicts death is the same one whose purified antibodies did
      nothing in animal models. Either it reports something else that kills, or the models
      miss how it acts.
  proposed_experiments:
  - experiment_id: specificity_resolved_passive_transfer_panel
    name: Passive transfer of individually purified autoantibody specificities from stratified patient sera
    description: >-
      Purify each major specificity separately from sera of patients stratified by
      anti-desmoglein 3 status, and passively transfer each into the neonatal mouse model
      with the dose-response and electron-microscopy readouts already validated for
      desmoplakin. The question is not whether any antibody is pathogenic but which ones
      account for disease in the anti-desmoglein-3-negative subset.

- discussion_id: gap_irreversible_airway_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does bronchiolitis obliterans not remit when the neoplasm producing the
    autoantibodies is controlled?
  attaches_to:
  - pathophysiology#Bronchiolar Epithelial Injury and Obliterative Airway Scarring
  - treatments#Treatment of the Underlying Neoplasm
  rationale: >-
    This entry's mechanism predicts that removing the tumour should remove the disease,
    because the tumour is the antibody source. Mucocutaneous disease does behave roughly
    that way. The airways do not: bronchiolitis obliterans is described as leaving lung
    transplantation as often the only viable option specifically once the neoplasm has been
    controlled.

    The possibilities are not distinguished by anything curated here. The scarring may
    simply be structurally irreversible once established, in which case the failure is one
    of timing rather than of mechanism and the implication is that airway disease must be
    detected earlier. Or the airway lesion may be sustained by a process that outlives the
    antibody - the cell-mediated arm, or a self-perpetuating fibrotic response of the kind
    seen in obliterative bronchiolitis after transplantation, which would make it a
    different disease from the mucocutaneous one sharing a trigger.

    Nothing in the cited work establishes even that the airway lesion is antibody-mediated
    at all, which is why the edge to this node is curated with unknown intermediates.
  proposed_experiments:
  - experiment_id: serial_airway_assessment_after_tumour_control
    name: Serial physiological and histological airway assessment through tumour control
    description: >-
      Follow lung function and, where tissue is available, airway histology in patients from
      before tumour control through remission, to establish whether early airway disease is
      reversible and at what point it ceases to be. If early disease remits, the failure is
      one of detection; if it never remits at any stage, the airway arm is driven by
      something the antibody does not control.

notes: >-
  Naming. The disease has two names and the entry uses both: paraneoplastic pemphigus is
  the MONDO label and the term clinicians reach for, paraneoplastic autoimmune multiorgan
  syndrome is the more accurate description of a disease whose fatal complication is in the
  lungs. MONDO places the term under both autoimmune bullous skin disease and paraneoplastic
  cutaneous syndrome, and that dual parentage is right.

  Contrast with the other paraneoplastic autoimmune syndromes. In Lambert-Eaton myasthenic
  syndrome, also curated in this knowledge base, small-cell lung carcinoma expresses a
  neuronal antigen ectopically and the anti-tumour immune response cross-reacts with the
  same antigen at the nerve terminal - the tumour provokes the response. Here, tumour cells
  of Castleman disease were shown to secrete anti-plakin antibodies themselves. Those are
  different mechanisms with the same clinical shape, and the difference has a therapeutic
  consequence: removing the tumour removes the antibody source directly rather than removing
  the stimulus for an established autoimmune response.

  What is deliberately not claimed. The link from the mucocutaneous mechanism to the airway
  disease is curated INDIRECT_UNKNOWN_INTERMEDIATES because no cited source shows the airway
  lesion is produced by the same autoantibodies. Respiratory epithelium does express
  plakins, and that is the obvious hypothesis, but obvious is not the same as demonstrated
  and the entry does not assert it.

  Frequency bands. Two are assigned, both from direct qualitative statements in the cited
  review - "typically present" for the mucocutaneous features and "a frequent complication"
  for bronchiolitis obliterans. Acantholysis carries no band because it is a histological
  finding reported in individual cases rather than a frequency in a series.

  No GeneReviews baseline applies. This is an acquired paraneoplastic autoimmune disease
  with no Mendelian form; a GeneReviews search returns nothing relevant.

  Prognostic data are syntheses of case reports, not cohorts. Three sources are curated -
  a 504-patient systematic review, a 144-patient review restricted to haematologic
  malignancy, and the EADV guideline's citation of a 53-patient French multicentre series -
  and their mortality estimates do not agree (90% at two years, 57%, one-year survival
  49%). These are the largest syntheses available for a disease this rare and they are
  still built from case reports with the selection biases that implies. The hazard ratios
  and rates are curated because they are the best available, not because they are robust.

  Castleman disease is curated as a tumour type, not cross-linked as a comorbidity. The
  Disease class has no comorbidities slot, and the relationship here is not comorbidity in
  any case - the tumour is this entry's trigger node. Castleman_Disease and
  Multicentric_Castleman_Disease both exist in this knowledge base and neither is
  referenced from here, because there is no slot in which such a reference would mean
  anything more than the prose already does. The quantitative link is instead curated as
  evidence on the trigger node: Castleman disease in up to 56% of patients, more frequent
  in Asian countries, and a favourable prognostic factor.

  Orphanet has no epidemiology for this disorder. ORPHA:63455 was built from the pinned
  Orphadata snapshot and carries a definition and five cross-references, but no prevalence
  table and no HPO frequency table - so the incidence figure comes from the EADV S2k
  guideline, and the frequency bands remain hand-assigned from qualitative statements as
  described above. Recorded because the absence is easy to assume away.

  Two things the review suggested and this entry does not do, recorded so the decisions are
  explicit rather than silent. The five polymorphous cutaneous patterns (pemphigus-like,
  pemphigoid-like, erythema-multiforme-like, GVHD-like, lichen-planus-like) are curated as
  a single Cutaneous Blistering phenotype. The polymorphism is diagnostically load-bearing -
  it is part of why this disease is misdiagnosed - and two of the patterns
  (toxic-epidermal-necrolysis-like and bullous-pemphigoid-like) are independent adverse
  survival factors, so they arguably deserve separate phenotypes. Deferred rather than
  dismissed: doing it properly means deciding whether they are phenotypes, subtypes, or
  severity strata, and that decision should not be made in a review-response commit. The
  other is peri-operative IVIG, discussed on the treatment entry.

  Deep research. A claude_code provider run
  (research/Paraneoplastic_Pemphigus-deep-research-claude_code.md) was performed after the
  first draft. Its own reference validation reports 16 of 16 identifiers resolved, none
  unresolved, 11 of 16 scored on topic and none off topic - so five are undecided rather
  than cleared. It surfaced two references this entry now uses: the JAAD CME Part II and
  the 144-patient risk-factor review. It did not surface the EADV S2k guideline, which is
  the single most productive source in the entry and was found instead by following a
  corrigendum in a PubMed title search.

  A veterinary review of deep pemphigus in dogs, cats and horses (PMID:33228633) was
  surfaced and fetched but is not curated. Naturally occurring paraneoplastic pemphigus in
  companion animals would be a genuine animal_models entry rather than an induced model,
  which is exactly why it should not be added on the strength of a title - it needs the
  same reading of the primary text that everything else here got, and that is left for a
  follow-up.


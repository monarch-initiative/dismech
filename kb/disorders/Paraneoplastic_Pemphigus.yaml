name: Paraneoplastic Pemphigus
creation_date: '2026-08-20T06:20:00Z'
category: Autoimmune
description: Paraneoplastic pemphigus is a rare, frequently fatal autoimmune blistering disease
  that arises in the setting of an underlying neoplasm, most often a lymphoproliferative disorder
  such as Castleman disease, chronic lymphocytic leukaemia, or non-Hodgkin lymphoma. The tumour
  drives production of autoantibodies against plakin-family desmosomal and hemidesmosomal proteins
  alongside anti-desmoglein reactivity, and a cell-mediated cytotoxic interface attack acts
  in parallel. The result is suprabasal acantholysis combined with lichenoid interface dermatitis,
  producing intractable stomatitis, a polymorphous cutaneous eruption, and involvement of respiratory
  epithelium. Bronchiolitis obliterans is the distinguishing complication and the leading cause
  of death.
disease_term:
  preferred_term: paraneoplastic pemphigus
  term:
    id: MONDO:0018974
    label: paraneoplastic pemphigus
synonyms:
- PNP
- Paraneoplastic autoimmune multiorgan syndrome
- PAMS
parents:
- Autoimmune bullous skin disease
- Paraneoplastic cutaneous syndrome

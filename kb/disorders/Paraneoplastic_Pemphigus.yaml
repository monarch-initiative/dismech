name: Paraneoplastic Pemphigus
creation_date: "2026-08-22T04:20:00Z"
category: Autoimmune
disease_term:
  preferred_term: paraneoplastic pemphigus
  term:
    id: MONDO:0018974
    label: paraneoplastic pemphigus
description: >-
  A highly fatal autoimmune blistering disease arising in patients with an underlying
  neoplasm, most often a lymphoproliferative disorder. Also called paraneoplastic
  autoimmune multiorgan syndrome, and the second name is the more accurate one: the
  disease is not confined to skin.

  What distinguishes it from the other paraneoplastic autoimmune syndromes is where the
  antibody comes from. In most of them the immune system mounts a response against a
  tumour antigen and that response cross-reacts with a host protein. Here, tumour cells of
  Castleman disease have been shown to secrete antibodies against plakin family proteins
  directly, and those antibodies detach cultured keratinocytes. The neoplasm is not the
  provocation for an autoimmune response; it is, at least in that setting, the factory.

  Two things follow that the entry is built around. Removing the tumour removes the
  antibody source, which is why tumour control is the first therapeutic move. And it does
  not reverse bronchiolitis obliterans, the airway complication that drives the mortality -
  once the small airways have scarred, lung transplantation is often the only option left.

parents:
- Pemphigus
- Autoimmune Bullous Disease
- Paraneoplastic Syndrome

pathophysiology:

- name: Underlying Neoplasm with Autoantibody Production
  role: trigger
  biological_scale: ORGANISM
  description: >-
    The disease requires a neoplasm, benign or malignant, most commonly lymphoproliferative.
    Castleman disease and non-Hodgkin lymphoma are the two that matter most, and they sit
    at opposite ends of the prognosis.

    The mechanistic claim here is stronger than association. Tumour cells from Castleman
    disease occurring with paraneoplastic pemphigus were shown to secrete antibodies
    against plakin family proteins, and those antibodies caused detachment of cultured
    keratinocytes. That makes the tumour an antibody source rather than merely the stimulus
    for one - which is the mechanistic difference between this disease and the
    cross-reactivity paraneoplastic syndromes.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The condition occurs in patients with underlying benign or malignant neoplasms, most
      commonly lymphoproliferative disorders.
    explanation: >-
      Establishes the neoplasm as a requirement and names the dominant tumour class.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we investigated the role of the plakin family in PNP and proved that tumor cells of
      Castleman disease with PNP could secrete antibodies against plakin family proteins
      and cause detachment of cultured keratinocytes
    explanation: >-
      The tumour-as-antibody-source claim, which is the specific mechanism this node
      asserts and the reason it is curated as a trigger rather than a comorbidity.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Resection of the paratracheal mass revealed lymphoid tissue with follicular and
      interfollicular stromal changes, atretic germinal centers and thickened mantle zones,
      consistent with unicentric Castleman disease, stroma-rich hyaline vascular variant.
    explanation: >-
      A worked case in which the causative neoplasm was identified and resected, with the
      Castleman histology that characterises it.
  downstream:
  - target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
    causal_link_type: DIRECT
    description: >-
      The antibodies the tumour produces are the ones that bind epithelial adhesion
      proteins.
  - target: Cell-Mediated Interface Mucositis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cellular arm. Curated with unknown intermediates because the sources establish
      that cell-mediated immunity contributes to pathogenesis and that interface mucositis
      is seen histologically, without demonstrating the steps from the neoplasm to the
      T-cell attack.

- name: Autoantibody Binding to Desmosomal Plakins and Desmogleins
  role: amplifier
  biological_scale: MOLECULAR
  description: >-
    Autoantibodies against plakin family proteins are the serological signature of the
    disease, alongside antibodies against desmoglein 3 and desmoglein 1. Direct
    immunofluorescence shows IgG and complement deposited both between epithelial cells and
    along the basement membrane zone - the two-compartment pattern that distinguishes this
    from pemphigus vulgaris.

    Which of these antibodies actually does the damage is not settled, and the entry treats
    that as an open question rather than smoothing it over. See the knowledge gap below.
  cellular_components:
  - preferred_term: desmosome
    term:
      id: GO:0030057
      label: desmosome
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both humoral and cell-mediated immunities contribute to the pathogenesis, and
      autoantibodies against plakin family proteins are characteristic.
    explanation: >-
      Names the plakin autoantibodies as characteristic and, in the same sentence,
      establishes that the humoral arm is not the whole story.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunofluorescence and serologic studies revealed IgG and complement deposition
      within intercellular epithelial spaces and along the basement membrane zone, together
      with circulating anti-plakin antibodies, establishing a diagnosis of paraneoplastic
      pemphigus.
    explanation: >-
      The deposition pattern in tissue plus the circulating antibody, which together are
      diagnostic.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Paraneoplastic pemphigus (PNP) is an autoimmune bullous disease associated with
      underlying neoplasms and characterized by antibodies against desmoglein 3 (Dsg 3) and
      plakins.
    explanation: >-
      The two antibody families this node covers.
  downstream:
  - target: Desmosome Disruption and Keratinocyte Acantholysis
    causal_link_type: DIRECT
    description: >-
      Antibody binding to desmosomal components disrupts the junction.

- name: Desmosome Disruption and Keratinocyte Acantholysis
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The rate-limiting lesion, and the one with direct experimental support. Passive
    transfer of purified anti-desmoplakin C-terminus IgG into neonatal mice produced
    blisters and acantholysis in a dose-dependent way. Electron microscopy showed what the
    antibody actually does: keratin intermediate filaments disconnect from the desmosome,
    so the junction loses its cytoskeletal anchorage rather than being dissolved.
    Keratinocyte apoptosis followed on TUNEL staining.

    Anti-desmoglein 3 antibodies from patient sera had already been shown to cause
    acantholysis in the same model, so at least two distinct autoantibody specificities are
    independently pathogenic.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: cell-cell adhesion
    term:
      id: GO:0098609
      label: cell-cell adhesion
    modifier: DECREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that anti-C terminus of desmoplakin autoantibodies caused blisters and
      acantholysis in mice skin at a dose-dependent manner.
    explanation: >-
      Passive transfer with a dose-response, which is the strongest form of evidence
      available for an autoantibody-mediated disease.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The electronic microscopy examination showed the disconnection of keratin
      intermediate filaments from desmosomes.
    explanation: >-
      The ultrastructural mechanism - loss of cytoskeletal anchorage rather than
      dissolution of the junction - which is what this node claims.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Lastly, apoptosis of keratinocytes in the TUNEL assay was all detected in the skins of
      neonatal mice after injection of the anti-C terminus of desmoplakin autoantibodies.
    explanation: >-
      The apoptotic component, which is why this node carries an apoptosis process
      annotation alongside the adhesion one.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Autoantibodies against desmoglein 3 in sera of patients with PNP have been proven to
      cause acantholysis in vivo in neonatal mice.
    explanation: >-
      The prior demonstration for a different antibody specificity, establishing that more
      than one is pathogenic.
  downstream:
  - target: Severe Stomatitis
    causal_link_type: DIRECT
    description: >-
      Mucosal acantholysis, which is where the disease characteristically begins.
  - target: Cutaneous Blistering
    causal_link_type: DIRECT
    description: >-
      The same lesion in skin.
  - target: Acantholysis
    causal_link_type: DIRECT
    description: >-
      The histopathological expression of this node.
  - target: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The respiratory arm. Curated with unknown intermediates deliberately: the sources
      establish that bronchiolitis obliterans is a frequent complication driving mortality,
      and a lung wedge resection in one case showed bronchiolar scarring, but nothing cited
      here demonstrates that the airway lesion is produced by the same autoantibodies
      acting on respiratory epithelium.

- name: Cell-Mediated Interface Mucositis
  role: amplifier
  biological_scale: TISSUE
  description: >-
    The cellular arm, which the humoral account alone does not cover. Biopsies show
    intraepithelial clefting together with interface mucositis - a lichenoid,
    T-cell-mediated pattern of injury at the epithelial-stromal junction that antibody
    deposition does not explain.

    Its prognostic behaviour is counterintuitive and worth curating for that reason:
    lichenoid or interface dermatitis is associated with *longer* survival, and remains so
    in multivariable analysis. A histological pattern that indicates more immune attack
    predicts a better outcome, which is the kind of finding a purely antibody-centred model
    of this disease would not anticipate.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both humoral and cell-mediated immunities contribute to the pathogenesis, and
      autoantibodies against plakin family proteins are characteristic.
    explanation: >-
      Establishes the cell-mediated contribution this node models.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsy of the oral lesions showed intraepithelial clefting and interface mucositis.
    explanation: >-
      The histology, showing the acantholytic and the interface patterns together in the
      same lesion.
  - reference: PMID:39426525
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the multifactorial Cox proportional hazards regression model, non-Hodgkin lymphoma
      (hazard ratio, 1.959; 95% CI, 1.286-2.985; P = .002) and lichenoid/interface
      dermatitis (hazard ratio, 0.555; 95% CI, 0.362-0.850; P = .007) remained associated
      with the prognosis of PNP/PAMS patients.
    explanation: >-
      The protective association of the interface pattern, surviving multivariable
      adjustment, which is the counterintuitive finding this node's description flags.
  downstream:
  - target: Severe Stomatitis
    causal_link_type: DIRECT
    description: >-
      Interface mucositis is an oral lesion in its own right, and oral involvement is where
      the disease characteristically starts.

- name: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
  role: consequence
  biological_scale: TISSUE
  description: >-
    The complication that determines survival. Small airways scar and obliterate, producing
    progressive dyspnoea and respiratory failure.

    It is curated as a node rather than only as a phenotype because of what it implies for
    treatment. The scarring is structural and does not reverse when the antibody source is
    removed, so controlling the neoplasm - which is otherwise the definitive move in this
    disease - leaves this arm behind. Lung transplantation is often the only option once
    the tumour is controlled.
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchiolitis obliterans (BO) is a frequent complication which contributes to the high
      mortality rate of PNP/PAMS.
    explanation: >-
      Frequency and mortality contribution, which is what makes this node the prognostically
      decisive one.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Wedge resection of the lung showed focal bronchiolar scarring supporting the clinical
      impression of bronchiolitis obliterans.
    explanation: >-
      Tissue confirmation of the airway lesion, rather than a clinical impression alone.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchiolitis obliterans, in particular, has been identified as a marker of poor
      prognosis in patients with PAMS and lung transplantation often represents the only
      viable treatment option once the underlying neoplasm has been controlled.
    explanation: >-
      The irreversibility claim on which this node's therapeutic significance rests, in the
      source's own words.
  downstream:
  - target: Bronchiolitis Obliterans
    causal_link_type: DIRECT
    description: >-
      The clinical and radiological expression of this node.

phenotypes:

- category: Mucosal
  name: Severe Stomatitis
  description: >-
    Intractable oral mucosal involvement, characteristically the presenting feature and
    often the most treatment-resistant. Initial oral involvement is associated with longer
    survival, probably because it brings patients to attention earlier.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Stomatitis
    term:
      id: HP:0010280
      label: Stomatitis
    severity: SEVERE
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients typically present with severe stomatitis and polymorphous skin lesions, which
      are often resistant to treatment.
    explanation: >-
      The presenting picture and its treatment resistance. "Typically present" supports the
      VERY_FREQUENT band for a presenting feature.

- category: Dermatological
  name: Cutaneous Blistering
  description: >-
    Polymorphous skin lesions - the polymorphism itself is diagnostically important, since
    the eruption can be lichenoid, bullous, or erythema-multiforme-like in the same patient.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Abnormal blistering of the skin
    term:
      id: HP:0008066
      label: Abnormal blistering of the skin
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients typically present with severe stomatitis and polymorphous skin lesions, which
      are often resistant to treatment.
    explanation: >-
      The cutaneous half of the presenting picture.

- category: Histopathological
  name: Acantholysis
  description: >-
    Loss of keratinocyte-keratinocyte adhesion producing intraepithelial clefting, seen on
    biopsy alongside the interface pattern.
  phenotype_term:
    preferred_term: Acantholysis
    term:
      id: HP:0100792
      label: Acantholysis
  evidence:
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biopsy of the oral lesions showed intraepithelial clefting and interface mucositis.
    explanation: >-
      The histological finding in a patient, which is what this phenotype records.

- category: Respiratory
  name: Bronchiolitis Obliterans
  description: >-
    Small airway obliteration causing progressive dyspnoea and respiratory failure. The
    single most prognostically important feature of the disease, and the one that survives
    control of the underlying tumour.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Bronchiolitis obliterans
    term:
      id: HP:0011946
      label: Bronchiolitis obliterans
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:37597771
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bronchiolitis obliterans (BO) is a frequent complication which contributes to the high
      mortality rate of PNP/PAMS.
    explanation: >-
      Direct support for the FREQUENT band ("a frequent complication") and for the mortality
      significance.
  - reference: PMID:41483625
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PAMS often presents as paraneoplastic pemphigus, an autoimmune bullous disease
      affecting the skin and mucosal surfaces and bronchiolitis obliterans, a small airway
      disease that can result in respiratory failure and death.
    explanation: >-
      Names the outcome of the airway disease.

progression:

- phase: Survival and prognostic determinants
  notes: >-
    A systematic review of 290 articles covering 504 patients, with survival data on 281,
    is the largest synthesis available and the source of what is known about prognosis.
    Older age, circulating bullous pemphigoid 230 autoantibodies, non-Hodgkin lymphoma and
    a possible history of causative drugs predicted shorter survival; initial oral mucosal
    involvement, lichenoid or interface dermatitis, Castleman disease and epithelial-derived
    tumours predicted longer survival. Only two survived multivariable adjustment:
    non-Hodgkin lymphoma as a hazard, and lichenoid/interface dermatitis as a protective
    factor.

    The tumour type is therefore the dominant prognostic variable, which is consistent with
    the entry's framing of the neoplasm as the driver rather than the setting.
  evidence:
  - reference: PMID:39426525
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After drawing the Kaplan-Meier survival curves for 281 patients with available survival
      information, it was found that older age, circulating bullous pemphigoid 230
      autoantibodies, non-Hodgkin lymphoma, and possible history of causative drugs were
      associated with shorter survival time.
    explanation: >-
      The adverse prognostic factors, with the cohort size behind them.
  - reference: PMID:39426525
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initial oral mucosal involvement, lichenoid/interface dermatitis, Castleman disease,
      and epithelial-derived tumors were associated with longer survival time.
    explanation: >-
      The favourable factors, including the Castleman-versus-lymphoma split this entry's
      trigger node describes.

treatments:

- name: Treatment of the Underlying Neoplasm
  description: >-
    The definitive move, and the one that follows directly from the mechanism: if the
    tumour is producing the autoantibody, removing it removes the source. In the worked
    Castleman case the paratracheal mass was resected.

    Its limit is equally mechanistic. Tumour control does not reverse established airway
    scarring, so it treats the cause without treating the complication that determines
    survival.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: tumour-directed therapy
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Underlying Neoplasm with Autoantibody Production
    treatment_effect: INHIBITS
    description: >-
      Removes or controls the source of the pathogenic autoantibodies. Acts on the trigger
      node, which is why it is the only treatment here that is disease-modifying rather
      than suppressive.
    evidence:
    - reference: PMID:41483625
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchiolitis obliterans, in particular, has been identified as a marker of poor
        prognosis in patients with PAMS and lung transplantation often represents the only
        viable treatment option once the underlying neoplasm has been controlled.
      explanation: >-
        PARTIAL because it establishes tumour control as the expected first step while
        stating in the same sentence what that step does not achieve.

- name: Rituximab and Corticosteroids
  description: >-
    B-cell depletion and immunosuppression, directed at the antibody-producing compartment
    and the inflammatory response rather than at the tumour. Used in the worked case
    alongside tumour resection.

    The cached sources establish that this combination is used, not that it is effective;
    the disease's mucocutaneous lesions are repeatedly described as treatment-resistant. No
    efficacy claim is curated here.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: immunosuppression
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Autoantibody Binding to Desmosomal Plakins and Desmogleins
    treatment_effect: INHIBITS
    description: >-
      B-cell depletion reduces autoantibody production; corticosteroids suppress the
      inflammatory response to the resulting injury.
    evidence:
    - reference: PMID:41483625
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient was treated with steroids and rituximab and recently underwent bilateral
        lung transplantation due to progressive respiratory symptoms.
      explanation: >-
        Establishes the regimen in use. Note the same sentence records that the respiratory
        disease progressed regardless.

- name: Lung Transplantation
  description: >-
    The salvage option for established bronchiolitis obliterans, and one that only makes
    sense once the neoplasm is controlled - transplanting into an uncontrolled antibody
    source would reproduce the disease in the graft.

    That it is described as often the only viable option is the clearest statement of this
    disease's shape: the cause is treatable and one of its consequences is not.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: lung transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Bronchiolar Epithelial Injury and Obliterative Airway Scarring
    treatment_effect: BYPASSES
    description: >-
      Replaces the scarred airways rather than reversing the scarring. Curated as BYPASSES
      rather than INHIBITS because it does not act on the mechanism at all - it substitutes
      the organ the mechanism destroyed.
    evidence:
    - reference: PMID:41483625
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Bronchiolitis obliterans, in particular, has been identified as a marker of poor
        prognosis in patients with PAMS and lung transplantation often represents the only
        viable treatment option once the underlying neoplasm has been controlled.
      explanation: >-
        States both the indication and its precondition, which is why this treatment is
        curated as acting on the airway node and sequenced after tumour control.

discussions:

- discussion_id: gap_which_autoantibody_is_pathogenic
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which of the many autoantibodies in paraneoplastic pemphigus actually cause the
    disease, given that the most reliably detected ones are not the demonstrably pathogenic
    ones?
  attaches_to:
  - pathophysiology#Autoantibody Binding to Desmosomal Plakins and Desmogleins
  - pathophysiology#Desmosome Disruption and Keratinocyte Acantholysis
  rationale: >-
    Patients carry autoantibodies against desmoglein 1 and 3, alpha-2-macroglobulin-like-1,
    and a long list of plakins - epiplakin, plectin, desmoplakin, bullous pemphigoid antigen
    1, envoplakin and periplakin. Detectability and pathogenicity do not line up.

    Envoplakin and periplakin are almost universally detected by immunoblotting, and their
    major epitopes have been mapped - yet patient antibodies purified against those two
    proteins failed to produce any pathological change in animal models. Anti-desmoglein 3
    antibodies are demonstrably pathogenic by passive transfer, but a significant proportion
    of patients have low or absent anti-desmoglein 3, so they cannot be the general
    explanation. Anti-desmoplakin C-terminus antibodies were shown pathogenic only in 2022,
    and desmoplakin is the plakin most frequently detected by immunoprecipitation.

    So the serological profile that defines the disease diagnostically is not the profile
    that explains it mechanistically, and the entry curates the antibody node without
    claiming to know which specificity drives which lesion. This matters for treatment: a
    therapy targeting one specificity would be expected to work only in the subset it
    explains, and there is currently no way to identify that subset prospectively.
  evidence:
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, patients’ antibodies purified by these two proteins failed to cause any
      pathological changes in animal models.
    explanation: >-
      The negative result for envoplakin and periplakin, which is the crux of this gap and
      is easy to miss because it is a negative.
  - reference: PMID:35911677
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, the animal model has demonstrated the pathogenetic role of anti-desmoglein 3
      antibodies (4), but it cannot explain the absence or low levels of anti-desmoglein 3
      antibodies in a significant portion of PNP patients.
    explanation: >-
      States the coverage problem for the one antibody whose pathogenicity was already
      established.
  proposed_experiments:
  - experiment_id: specificity_resolved_passive_transfer_panel
    name: Passive transfer of individually purified autoantibody specificities from stratified patient sera
    description: >-
      Purify each major specificity separately from sera of patients stratified by
      anti-desmoglein 3 status, and passively transfer each into the neonatal mouse model
      with the dose-response and electron-microscopy readouts already validated for
      desmoplakin. The question is not whether any antibody is pathogenic but which ones
      account for disease in the anti-desmoglein-3-negative subset.

- discussion_id: gap_irreversible_airway_disease
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does bronchiolitis obliterans not remit when the neoplasm producing the
    autoantibodies is controlled?
  attaches_to:
  - pathophysiology#Bronchiolar Epithelial Injury and Obliterative Airway Scarring
  - treatments#Treatment of the Underlying Neoplasm
  rationale: >-
    This entry's mechanism predicts that removing the tumour should remove the disease,
    because the tumour is the antibody source. Mucocutaneous disease does behave roughly
    that way. The airways do not: bronchiolitis obliterans is described as leaving lung
    transplantation as often the only viable option specifically once the neoplasm has been
    controlled.

    The possibilities are not distinguished by anything curated here. The scarring may
    simply be structurally irreversible once established, in which case the failure is one
    of timing rather than of mechanism and the implication is that airway disease must be
    detected earlier. Or the airway lesion may be sustained by a process that outlives the
    antibody - the cell-mediated arm, or a self-perpetuating fibrotic response of the kind
    seen in obliterative bronchiolitis after transplantation, which would make it a
    different disease from the mucocutaneous one sharing a trigger.

    Nothing in the cited work establishes even that the airway lesion is antibody-mediated
    at all, which is why the edge to this node is curated with unknown intermediates.
  proposed_experiments:
  - experiment_id: serial_airway_assessment_after_tumour_control
    name: Serial physiological and histological airway assessment through tumour control
    description: >-
      Follow lung function and, where tissue is available, airway histology in patients from
      before tumour control through remission, to establish whether early airway disease is
      reversible and at what point it ceases to be. If early disease remits, the failure is
      one of detection; if it never remits at any stage, the airway arm is driven by
      something the antibody does not control.

notes: >-
  Naming. The disease has two names and the entry uses both: paraneoplastic pemphigus is
  the MONDO label and the term clinicians reach for, paraneoplastic autoimmune multiorgan
  syndrome is the more accurate description of a disease whose fatal complication is in the
  lungs. MONDO places the term under both autoimmune bullous skin disease and paraneoplastic
  cutaneous syndrome, and that dual parentage is right.

  Contrast with the other paraneoplastic autoimmune syndromes. In Lambert-Eaton myasthenic
  syndrome, also curated in this knowledge base, small-cell lung carcinoma expresses a
  neuronal antigen ectopically and the anti-tumour immune response cross-reacts with the
  same antigen at the nerve terminal - the tumour provokes the response. Here, tumour cells
  of Castleman disease were shown to secrete anti-plakin antibodies themselves. Those are
  different mechanisms with the same clinical shape, and the difference has a therapeutic
  consequence: removing the tumour removes the antibody source directly rather than removing
  the stimulus for an established autoimmune response.

  What is deliberately not claimed. The link from the mucocutaneous mechanism to the airway
  disease is curated INDIRECT_UNKNOWN_INTERMEDIATES because no cited source shows the airway
  lesion is produced by the same autoantibodies. Respiratory epithelium does express
  plakins, and that is the obvious hypothesis, but obvious is not the same as demonstrated
  and the entry does not assert it.

  Frequency bands. Two are assigned, both from direct qualitative statements in the cited
  review - "typically present" for the mucocutaneous features and "a frequent complication"
  for bronchiolitis obliterans. Acantholysis carries no band because it is a histological
  finding reported in individual cases rather than a frequency in a series.

  No GeneReviews baseline applies. This is an acquired paraneoplastic autoimmune disease
  with no Mendelian form; a GeneReviews search returns nothing relevant.

  Prognostic data are from a single systematic review of 504 patients. That is the largest
  synthesis available for a disease this rare, and it is still a synthesis of case reports
  and small series with the selection biases that implies. The hazard ratios are curated
  because they are the best available, not because they are robust.


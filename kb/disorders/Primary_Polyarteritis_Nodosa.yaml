differential_diagnoses:
- name: Deficiency of adenosine deaminase 2
  disease_term:
    preferred_term: deficiency of adenosine deaminase 2
    term:
      id: MONDO:0014306
      label: deficiency of adenosine deaminase 2
  description: >-
    Autosomal recessive vasculopathy caused by biallelic loss-of-function
    variants in ADA2 (CECR1) that closely mimics systemic or cutaneous
    polyarteritis nodosa, typically with childhood onset and reduced serum ADA2
    enzymatic activity.
  distinguishing_features:
  - Autosomal recessive inheritance due to biallelic ADA2 (CECR1) loss-of-function mutations with markedly reduced serum ADA2 enzyme activity
  - Typically childhood-onset systemic or cutaneous PAN-like necrotizing vasculopathy, often familial, rather than sporadic adult idiopathic PAN
  evidence:
  - reference: PMID:24552285
    reference_title: "Mutant adenosine deaminase 2 in a polyarteritis nodosa vasculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six families with multiple cases of systemic and cutaneous polyarteritis nodosa, consistent with autosomal recessive inheritance. In most cases, onset of the disease occurred during childhood."
    explanation: "Demonstrates that hereditary ADA2 deficiency presents clinically as childhood-onset systemic or cutaneous polyarteritis nodosa."
  - reference: PMID:24552285
    reference_title: "Mutant adenosine deaminase 2 in a polyarteritis nodosa vasculopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all the families, vasculitis was caused by recessive mutations in CECR1, the gene encoding adenosine deaminase 2 (ADA2)."
    explanation: "Establishes biallelic ADA2 (CECR1) mutations and reduced serum ADA2 activity as the molecular basis distinguishing DADA2 from primary idiopathic PAN."

pathophysiology:
- name: Idiopathic immune-mediated vascular injury
  biological_scale: CELLULAR
  description: >-
    In primary (idiopathic, non-HBV) PAN, an incompletely defined immune trigger
    recruits T lymphocytes, macrophages, and neutrophils into the walls of
    medium-sized muscular arteries in the absence of anti-neutrophil
    cytoplasmic antibodies or immune-complex glomerulonephritis; responsiveness
    to systemic immunosuppression supports an active immunopathogenic process.

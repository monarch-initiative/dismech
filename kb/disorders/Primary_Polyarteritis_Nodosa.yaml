name: Primary Polyarteritis Nodosa
creation_date: "2026-05-05T11:41:54Z"
description: >-
  Primary polyarteritis nodosa is idiopathic, non-hepatitis B-related systemic
  polyarteritis nodosa, a rare ANCA-negative necrotizing vasculitis that
  predominantly targets medium-sized muscular arteries while sparing
  arterioles, capillaries, venules, and the pulmonary circulation. Segmental
  transmural arterial inflammation produces fibrinoid necrosis, microaneurysms,
  stenosis, thrombosis, and downstream organ ischemia, manifesting clinically
  with constitutional symptoms, peripheral neuropathy, myalgias, cutaneous
  vasculitis or livedo reticularis, renovascular hypertension, gastrointestinal
  ischemia, and heterogeneous organ involvement ranging from single-organ
  disease to polyvisceral failure.

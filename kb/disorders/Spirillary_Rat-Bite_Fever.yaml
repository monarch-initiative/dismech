treatments:
- name: Antibiotic therapy
  description: >-
    Antibiotic therapy treats S. minus rat-bite fever; reported cases recovered
    after beta-lactam-containing regimens.
  treatment_term:
    preferred_term: antibiotic therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Spirillum Minus Systemic Infection
    treatment_effect: INHIBITS
    description: >-
      A penicillin-class agent (ampicillin) is first-line, with doxycycline as
      the key alternative, clearing the systemic infection.
    evidence:
    - reference: PMID:41480582
      reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Penicillin-based drugs like ampicillin are first-line, with doxycycline
        as a key alternative
      explanation: Names the first-line penicillin-class agent and doxycycline alternative.
  evidence:
  - reference: PMID:1286642
    reference_title: "Rat bite fever: a case report of a Kenyan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient recovered completely after a course of penicillin and
      gentamicin.
    explanation: >-
      A human rat-bite fever case with spirillum-like organisms recovered after
      combination antibiotic therapy.
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She was treated with a combination of intravenous ampicillin, doxycycline
      and surgical wound debridement. She completed a course of oral antibiotics
      and recovered fully.
    explanation: >-
      A presumptive S. minus rat-bite fever case recovered after parenteral and
      oral antibiotic therapy plus wound debridement.
- name: Surgical wound debridement
  description: >-
    Debridement of the infected bite wound was essential to recovery in a
    reported case, alongside antibiotic therapy.
  treatment_term:
    preferred_term: surgical wound debridement
    term:
      id: NCIT:C51682
      label: Debridement
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      debridement was essential for her recovery
    explanation: Surgical wound debridement was essential to recovery in a reported case.
diagnosis:
- name: Clinical recognition and rodent-exposure history
  description: >-
    Because the organism is fastidious and cannot be cultured on standard media,
    diagnosis rests on recognizing the clinical features together with a history
    of rodent exposure.
  evidence:
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      diagnosis depends on recognizing the clinical features and a history of
      rodent exposure
    explanation: States that diagnosis rests on clinical recognition plus exposure history.
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fastidious and cannot be cultured on standard media
    explanation: Records that the organism cannot be recovered on standard culture, the reason clinical recognition is central.
- name: Thick blood-film microscopy
  description: >-
    Demonstration of spirillum-like organisms on a thick blood film supports the
    diagnosis of the S. minus form. No admissible NCIT diagnosis-action term for
    blood-film microscopy is reachable from the diagnosis enum root, so this
    entry is left with a free-text preferred_term.
  evidence:
  - reference: PMID:1286642
    reference_title: "Rat bite fever: a case report of a Kenyan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The history, clinical features and demonstration of spirillum like
      organisms from a thick blood film suggest infection due to spirillum minus.
    explanation: >-
      Blood-film demonstration of spirillum-like organisms supported the S. minus
      diagnosis in a reported case.
transmission:
- name: Rat-Bite Exposure
  description: >-
    S. minus can cause rat-bite fever after domestic-rat bites; transmission is
    primarily through rodent bites, scratches, or contact with rodent secretions.
  evidence:
  - reference: PMID:1286642
    reference_title: "Rat bite fever: a case report of a Kenyan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A case of 17 year old Kenyan male who was diagnosed to have rat bite fever
      after a bite of domestic rat is described.
    explanation: >-
      A domestic-rat bite is the exposure that initiated this rat-bite fever case.
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Transmission occurs primarily through rodent bites, scratches, or contact
      with rodent secretions
    explanation: >-
      Names rodent bites, scratches, and secretion contact as the primary
      transmission routes.

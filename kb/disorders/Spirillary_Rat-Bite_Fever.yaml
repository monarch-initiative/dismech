- name: Skin Rash
  category: Dermatologic
  description: >-
    Rat-bite fever in general can produce a petechial-purpuric rash on the
    extremities, but rash is the streptobacillary pattern and is rare in the
    spirillary form.
  phenotype_term:
    preferred_term: Skin rash
    term:
      id: HP:0000988
      label: Skin rash
  evidence:
  - reference: PMID:21358889
    reference_title: "The rise of the rats: A growing paediatric issue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat bite fever (RBF), a systemic infection of Streptobacillus moniliformis
      or Spirillum minus characterized by fever, arthralgias and
      petechial-purpuric rash on the extremities
    explanation: >-
      Identifies petechial-purpuric rash on the extremities as a feature of
      rat-bite fever in general (either organism).
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Rash | Common | Rare |"
    explanation: >-
      The S. minus-versus-S. moniliformis comparison records rash as rare in the

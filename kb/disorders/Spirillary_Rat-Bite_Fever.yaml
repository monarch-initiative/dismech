  evidence:
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Lymphadenopathy | Rare | Common |"
    explanation: >-
      Records lymphadenopathy as common in the spirillary form (right column).
- name: Relapsing fever

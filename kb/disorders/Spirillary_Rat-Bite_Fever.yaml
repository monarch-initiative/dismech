name: Spirillary Rat-Bite Fever
creation_date: "2026-09-25T16:46:44Z"
category: Infectious Disease
disease_term:
  preferred_term: spirillary rat-bite fever
  term:
    id: MONDO:0020532
    label: spirillary rat-bite fever
description: >-
  Spirillary rat-bite fever, or sodoku, is a zoonotic rat-bite fever syndrome
  caused by Spirillum minus in which rat-bite exposure can produce a systemic
  febrile illness with rash.
parents:
- Rat-Bite Fever
synonyms:
- sodoku
- sodoku disease
- Spirillary fever
infectious_agent:
- name: Spirillum minus
  infectious_agent_term:
    preferred_term: Spirillum minus
    term:
      id: NCBITaxon:967
      label: Spirillum
  description: >-
    Genus-level Spirillum binding for the S. minus organism that causes
    spirillary rat-bite fever.
  evidence:
  - reference: PMID:19008054
    reference_title: Rat bite fever.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rat bite fever (RBF) is a bacterial zoonosis for which two causal bacterial
      species have been identified: Streptobacillis moniliformis and Spirillum
      minus.
    explanation: >-
      Identifies Spirillum minus as one of the two bacterial agents of rat-bite
      fever.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:19008054
      reference_title: Rat bite fever.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rat bite fever (RBF) is a bacterial zoonosis for which two causal
        bacterial species have been identified: Streptobacillis moniliformis and
        Spirillum minus.
      explanation: >-
        Spirillary rat-bite fever is a bacterial zoonosis under the rat-bite
        fever umbrella.
pathophysiology:
- name: Rat-Bite Spirillum Minus Inoculation
  description: >-
    A rat bite exposes broken skin to S. minus and initiates spirillary
    rat-bite fever.
  biological_scale: TISSUE
  downstream:
  - target: Spirillum Minus Systemic Infection
    causal_link_type: DIRECT
    description: >-
      S. minus can spread beyond the bite exposure to produce systemic rat-bite
      fever.
  evidence:
  - reference: PMID:1286642
    reference_title: "Rat bite fever: a case report of a Kenyan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The history, clinical features and demonstration of spirillum like
      organisms from a thick blood film suggest infection due to spirillum minus.
    explanation: >-
      In a rat-bite fever case after a domestic-rat bite, spirillum-like
      organisms in a blood film supported S. minus as the infectious agent.
- name: Spirillum Minus Systemic Infection
  description: >-
    S. minus infection can disseminate systemically and produce fever and an
    acral petechial-purpuric rash.
  biological_scale: ORGANISM
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: S. minus infection produces the febrile syndrome of sodoku.
  - target: Skin Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic rat-bite fever inflammation produces the acral
      petechial-purpuric rash.
  evidence:
  - reference: PMID:21358889
    reference_title: "The rise of the rats: A growing paediatric issue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat bite fever (RBF), a systemic infection of Streptobacillus moniliformis
      or Spirillum minus characterized by fever, arthralgias and
      petechial-purpuric rash on the extremities
    explanation: >-
      Identifies fever and acral petechial-purpuric rash as manifestations of
      systemic rat-bite fever due to either S. moniliformis or S. minus.

name: Spirillary Rat-Bite Fever
creation_date: "2026-09-25T16:46:44Z"
category: Infectious Disease
disease_term:
  preferred_term: spirillary rat-bite fever
  term:
    id: MONDO:0020532
    label: spirillary rat-bite fever
description: >-
  Spirillary rat-bite fever, or sodoku, is a zoonotic rat-bite fever syndrome
  caused by Spirillum minus in which rat-bite exposure can produce a systemic
  febrile illness with rash.
parents:
- Rat-Bite Fever
synonyms:
- sodoku
- sodoku disease
- Spirillary fever
infectious_agent:
- name: Spirillum minus
  infectious_agent_term:
    preferred_term: Spirillum minus
    term:
      id: NCBITaxon:967
      label: Spirillum
  description: >-
    Genus-level Spirillum binding for the S. minus organism that causes
    spirillary rat-bite fever.
  evidence:
  - reference: PMID:19008054
    reference_title: Rat bite fever.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rat bite fever (RBF) is a bacterial zoonosis for which two causal bacterial
      species have been identified: Streptobacillis moniliformis and Spirillum
      minus.
    explanation: >-
      Identifies Spirillum minus as one of the two bacterial agents of rat-bite
      fever.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:19008054
      reference_title: Rat bite fever.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Rat bite fever (RBF) is a bacterial zoonosis for which two causal
        bacterial species have been identified: Streptobacillis moniliformis and
        Spirillum minus.
      explanation: >-
        Spirillary rat-bite fever is a bacterial zoonosis under the rat-bite
        fever umbrella.
pathophysiology:
- name: Rat-Bite Spirillum Minus Inoculation
  description: >-
    A rat bite exposes broken skin to S. minus and initiates spirillary
    rat-bite fever.
  biological_scale: TISSUE
  downstream:
  - target: Local Bite-Site Reactivation
    causal_link_type: DIRECT
    description: >-
      The initial bite wound heals, then reactivates into an indurated or
      ulcerated lesion as the S. minus form declares itself.
  - target: Spirillum Minus Systemic Infection
    causal_link_type: DIRECT
    description: >-
      S. minus can spread beyond the bite exposure to produce systemic rat-bite
      fever.
  evidence:
  - reference: PMID:1286642
    reference_title: "Rat bite fever: a case report of a Kenyan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A case of 17 year old Kenyan male who was diagnosed to have rat bite fever
      after a bite of domestic rat is described.
    explanation: >-
      A domestic-rat bite initiated a rat-bite fever case later supported as
      S. minus by blood-film microscopy.
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Transmission occurs primarily through rodent bites, scratches, or contact
      with rodent secretions
    explanation: >-
      Names rodent bites and scratches as the primary transmission route.
- name: Local Bite-Site Reactivation
  description: >-
    A hallmark of the spirillary form: the bite wound heals initially, then the
    site becomes indurated or ulcerated, distinguishing sodoku from the
    streptobacillary form.
  biological_scale: TISSUE
  downstream:
  - target: Bite-site ulcer
    causal_link_type: DIRECT
    description: Reactivation produces an indurated or ulcerated bite-site lesion.
  - target: Regional Lymphatic Spread
    causal_link_type: DIRECT
    description: The reactivated lesion spreads to regional lymphatics.
  evidence:
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Bite Site Lesion | Often Healed | Indurated/Ulcerated |"
    explanation: >-
      The S. minus-versus-S. moniliformis comparison records an indurated or
      ulcerated bite-site lesion as the spirillary-form finding.
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      persistent and worsening wound at the bite site
    explanation: The bite wound persists and worsens rather than resolving.
- name: Regional Lymphatic Spread
  description: >-
    Spread from the reactivated bite site to regional lymph nodes produces
    lymphadenopathy, common in the spirillary form.
  biological_scale: TISSUE
  downstream:
  - target: Regional lymphadenopathy
    causal_link_type: DIRECT
    description: Regional lymphatic spread produces lymphadenopathy.
  evidence:
  - reference: PMID:41480582
    reference_title: "Rat bite fever presenting as localized cellulitis: The first documented presumptive case from Nepal and a call for clinical awareness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| Lymphadenopathy | Rare | Common |"
    explanation: >-
      The comparison records lymphadenopathy as common in the spirillary form
      (right column) and rare in the streptobacillary form.
- name: Spirillum Minus Systemic Infection
  description: >-
    S. minus infection can disseminate systemically and produce a febrile
    illness that may relapse; rash occurs but is rare in the spirillary form.
  biological_scale: ORGANISM
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: S. minus infection produces the febrile syndrome of sodoku.
  - target: Relapsing fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The febrile illness may relapse in the spirillary form.
  - target: Skin Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Systemic rat-bite fever inflammation can produce a rash, though rash is
      rare in the spirillary form.
  evidence:
  - reference: PMID:21358889
    reference_title: "The rise of the rats: A growing paediatric issue."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rat bite fever (RBF), a systemic infection of Streptobacillus moniliformis
      or Spirillum minus characterized by fever, arthralgias and
      petechial-purpuric rash on the extremities
    explanation: >-
      Identifies fever as a manifestation of systemic rat-bite fever due to
      either S. moniliformis or S. minus.

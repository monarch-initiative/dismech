name: SOCS1 Haploinsufficiency
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Autoinflammatory syndrome with immunodeficiency (OMIM 619375) is an autosomal
  dominant inborn error of immunity caused by heterozygous loss-of-function variants
  in SOCS1, with incomplete penetrance.

  SOCS1 is the negative-feedback brake on JAK-STAT signalling. Losing one functional
  copy does not remove a cytokine or a receptor - it removes the off-switch, so cells
  respond excessively to cytokines that are present at ordinary levels. Patient
  lymphocytes show increased STAT activation to interferon-gamma, IL-2 and IL-4, and
  the excess is reversed in vitro by a JAK1/JAK2 inhibitor.

  The resulting disease is simultaneously autoimmune and immunodeficient, which is
  the feature that makes it worth curating as its own entity rather than as an
  autoimmunity syndrome. The reported spectrum runs from autoimmune cytopenias,
  thyroiditis, nephritis and lupus-like disease through hypogammaglobulinaemia and
  recurrent infection to malignancy - all from one gene, in a dosage-sensitive
  pathway whose job is restraint rather than activation.
disease_term:
  preferred_term: autoinflammatory syndrome with immunodeficiency
  term:
    id: MONDO:0800130
    label: autoinflammatory syndrome with immunodeficiency
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with incomplete penetrance. Disease arises from haploinsufficiency
    - one functional allele does not supply enough SOCS1 to restrain JAK-STAT signalling -
    rather than from a dominant-negative effect.
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by whole-exome/genome sequencing we identify heterozygous, autosomal-dominant,
      germline loss-of-function mutations in the SOCS1 gene in ten patients from five
      unrelated families with early onset autoimmune manifestations"
    explanation: >-
      Establishes the inheritance pattern, the variant class, and the size of the founding
      cohort.

pathophysiology:
- name: Heterozygous SOCS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous loss-of-function variants in SOCS1. Reported alleles include
    frameshifts producing complete loss of protein expression from the affected allele;
    one such variant, c.202_203delAC (p.Thr68fsAla*49), was shown to abolish the
    protein's ability to inhibit JAK-STAT signalling when expressed in vitro.
  downstream:
  - target: Loss of JAK-STAT Negative Feedback
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38157076
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variant, c.202_203delAC, generates a frameshift in SOCS1,
      p.Thr68fsAla*49, which leads to complete loss of protein expression."
    explanation: Documents a specific frameshift allele and confirms it is a true null.

- name: Loss of JAK-STAT Negative Feedback
  biological_scale: MOLECULAR
  description: >-
    SOCS1 is an intracellular inhibitor of the JAK-STAT pathway - a brake, not a signal.
    Haploinsufficiency therefore does not alter what cytokines are present; it alters how
    strongly cells answer them. The mutant protein fails to perform the inhibition that
    wild-type SOCS1 does.
  biological_processes:
  - preferred_term: negative regulation of cytokine-mediated signaling pathway
    term:
      id: GO:0001960
      label: negative regulation of cytokine-mediated signaling pathway
    modifier: DECREASED
  downstream:
  - target: Cytokine Hypersensitivity with Increased STAT Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intracellular protein SOCS1 is known to downregulate cytokine signaling
      by inhibiting the JAK-STAT pathway."
    explanation: Establishes SOCS1's normal function as the brake whose loss defines this disease.
  - reference: PMID:38157076
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike WT SOCS1, Thr68fs SOCS1 fails to inhibit JAK-STAT signaling when
      expressed in vitro."
    explanation: Direct functional demonstration that the variant protein cannot inhibit the pathway.

- name: Cytokine Hypersensitivity with Increased STAT Activation
  biological_scale: CELLULAR
  description: >-
    The central defect, and the one that is directly measurable in patients. Patient
    lymphocytes show increased STAT activation in response to interferon-gamma, IL-2 and
    IL-4 - three cytokines with different receptors and different downstream programmes,
    which is why the disease is pleiotropic rather than confined to one axis. Monocyte
    subpopulations are redistributed and hyper-responsive across multiple cytokine
    pathways.
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  downstream:
  - target: Lymphocyte Hyperactivity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient-derived lymphocytes exhibit increased STAT activation in vitro in
      response to interferon-γ, IL-2 and IL-4 that is reverted by the JAK1/JAK2 inhibitor
      ruxolitinib"
    explanation: >-
      Demonstrates the hypersensitivity across three distinct cytokines and establishes its
      pharmacological reversibility, which is the basis of the treatment link below.
  - reference: PMID:38157076
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The peripheral immune signature from this patient was marked by a
      redistribution of monocyte sub-populations and hyper-responsiveness to multiple
      cytokines."
    explanation: Extends the hypersensitivity beyond lymphocytes to the monocyte compartment.

- name: Lymphocyte Hyperactivity
  biological_scale: CELLULAR
  description: >-
    Cytokine hypersensitivity translates into a broad set of immune abnormalities
    consistent with lymphocytes that are too easily activated. This is the node from
    which the disease's two apparently opposite arms both descend.
  downstream:
  - target: Loss of Self-Tolerance and Autoimmunity
    causal_link_type: DIRECT
  - target: Humoral Immunodeficiency and Infection Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This effect is associated with a series of in vitro and in vivo immune
      abnormalities consistent with lymphocyte hyperactivity."
    explanation: Establishes lymphocyte hyperactivity as the consequence of cytokine hypersensitivity.

- name: Loss of Self-Tolerance and Autoimmunity
  biological_scale: ORGANISM
  description: >-
    The autoimmune arm. Early-onset autoimmune disease is the presenting problem in most
    reported patients - autoimmune cytopenias prominently, with thyroiditis, nephritis,
    hepatitis and lupus-like features also described. The founding study frames the
    disease explicitly as a failure of a self-tolerance checkpoint.
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, SOCS1 haploinsufficiency causes a dominantly inherited predisposition
      to early onset autoimmune diseases related to cytokine hypersensitivity of immune
      cells."
    explanation: >-
      The authors' concluding statement linking the molecular defect to the autoimmune
      phenotype.

- name: Humoral Immunodeficiency and Infection Susceptibility
  biological_scale: ORGANISM
  description: >-
    The immunodeficient arm, and the reason the disease is named for both. Reported
    patients include a common variable immunodeficiency-like phenotype with
    hypogammaglobulinaemia. The route from a hyperactive immune system to an
    inadequate one is not established in patients, so the incoming edge is curated as
    having unknown intermediates rather than asserting exhaustion or consumption.
  evidence:
  - reference: PMID:34421895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which demonstrates the clinical spectrum spans from autoimmunity to
      infections and malignancy"
    explanation: >-
      Establishes that infection susceptibility, not only autoimmunity, is part of the
      reported spectrum.

phenotypes:
- category: Hematological
  name: Autoimmune Cytopenia
  description: >-
    Autoimmune cytopenias including immune thrombocytopenia and autoimmune haemolytic
    anaemia, frequently the presenting problem.
  phenotype_term:
    preferred_term: Autoimmune hemolytic anemia
    term:
      id: HP:0001890
      label: Autoimmune hemolytic anemia
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify heterozygous, autosomal-dominant, germline loss-of-function
      mutations in the SOCS1 gene in ten patients from five unrelated families with early
      onset autoimmune manifestations"
    explanation: >-
      Establishes early-onset autoimmune manifestations in the founding cohort. The
      specific cytopenia types are named in the OMIM/MONDO disease definition rather than
      in this abstract.

- category: Immunological
  name: Recurrent Infections
  description: >-
    Susceptibility to infection, including in patients with a CVID-like picture. Present
    in part of the reported spectrum rather than in all patients.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:34421895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which demonstrates the clinical spectrum spans from autoimmunity to
      infections and malignancy"
    explanation: Documents infection as part of the reported clinical spectrum.

- category: Dermatological
  name: Severe Dermatitis
  description: >-
    Severe dermatitis with recurrent skin infections, reported alongside psoriatic
    arthritis in a patient whose disease responded to IL4Rα and IL-17 blockade.
  phenotype_term:
    preferred_term: Dermatitis
    term:
      id: HP:0011123
      label: Inflammatory abnormality of the skin
  evidence:
  - reference: PMID:38157076
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a patient with severe dermatitis, recurrent skin infections, and
      psoriatic arthritis that harbors a novel heterozygous mutation in SOCS1"
    explanation: Documents the dermatological and articular presentation in a confirmed patient.

genetic:
- name: SOCS1
  gene_term:
    preferred_term: SOCS1
    term:
      id: hgnc:19383
      label: SOCS1
  relationship_type: CAUSATIVE
  association: >-
    Heterozygous germline loss-of-function variants in SOCS1 cause this syndrome. The
    gene is dosage-sensitive: because its product is an inhibitor, halving it releases
    signalling rather than reducing it, which is why a heterozygous null is sufficient
    and why the phenotype is one of excess. Penetrance is incomplete, so an identified
    variant does not by itself predict disease in a relative.
  evidence:
  - reference: PMID:34421895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Suppressor of cytokine signaling 1 (SOCS1) is a key negative regulator of
      cytokine signaling, and has recently been associated with a novel IEI."
    explanation: Establishes the gene-disease relationship and SOCS1's regulatory role.
  - reference: PMID:34421895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of patients described to date, it is apparent that SOCS1 haploinsufficiency
      has a pleiotropic effect in humans."
    explanation: >-
      Supports the pleiotropy that follows from disinhibiting a pathway shared by many
      cytokines.

diagnosis:
- name: Molecular Genetic Testing of SOCS1
  description: >-
    Sequencing of SOCS1. Worth considering in early-onset autoimmunity - particularly
    autoimmune cytopenias with a family history - and in immunodeficiency that sits
    oddly alongside autoimmune disease, since it is the combination rather than either
    half that points here. Incomplete penetrance means a variant found in an
    asymptomatic parent does not exclude causation.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33087723
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study of familial autoimmune diseases can reveal pathophysiological
      mechanisms involved in more common autoimmune diseases."
    explanation: >-
      Supports genetic testing of familial early-onset autoimmunity as the route by which
      this disease is identified.

treatments:
- name: JAK Inhibition
  description: >-
    The mechanistically matched therapy. Ruxolitinib, a JAK1/JAK2 inhibitor, reverses the
    increased STAT activation of patient lymphocytes in vitro - it substitutes
    pharmacologically for the brake the patient's genome no longer supplies. Curated
    against the cytokine-hypersensitivity node because that is the step it acts on. Note
    the evidence cited here is the in vitro reversal, not a clinical trial outcome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cytokine Hypersensitivity with Increased STAT Activation
    treatment_effect: INHIBITS
    description: >-
      JAK1/JAK2 inhibition blocks the signalling step that SOCS1 normally restrains,
      returning STAT activation toward normal.
    evidence:
    - reference: PMID:33087723
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "patient-derived lymphocytes exhibit increased STAT activation in vitro in
        response to interferon-γ, IL-2 and IL-4 that is reverted by the JAK1/JAK2 inhibitor
        ruxolitinib"
      explanation: >-
        Demonstrates that JAK inhibition reverses the specific defect in patient cells,
        which is the mechanistic basis for the treatment link.

- name: Targeted Cytokine Blockade
  description: >-
    A narrower alternative, and an instructive one. Despite a broad hyper-response across
    multiple cytokine pathways, one reported patient's disease responded markedly to
    IL4Rα and IL-17 blockade. That a two-cytokine intervention controls a
    pan-cytokine signalling defect suggests the clinical phenotype in a given patient is
    driven by a narrower set of axes than the laboratory abnormality implies - which
    matters, because targeted biologics avoid the broad immunosuppression of JAK
    inhibition.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of Self-Tolerance and Autoimmunity
    treatment_effect: INHIBITS
    description: >-
      Blocking IL4Rα and IL-17 signalling suppressed the autoinflammatory manifestations
      without correcting the underlying signalling defect.
    evidence:
    - reference: PMID:38157076
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Despite this broad hyper-response across multiple cytokine pathways in
        SOCS1 haploinsufficiency, the patient's clinical disease was markedly responsive to
        targeted IL4Rα- and IL17-blocking therapy."
      explanation: Documents clinical response to targeted blockade in a confirmed patient.

differential_diagnoses:
- name: Common variable immunodeficiency
  description: >-
    Part of the reported SOCS1 spectrum resembles CVID - hypogammaglobulinaemia with
    infection susceptibility - so a CVID label can be where these patients stop rather
    than where they should. The discriminator is the accompanying early-onset
    autoimmunity and the family history, since CVID is a clinical diagnosis of exclusion.
  distinguishing_features:
  - SOCS1 haploinsufficiency pairs immunodeficiency with prominent early-onset autoimmunity
  - Autosomal dominant transmission with incomplete penetrance, versus mostly sporadic CVID
  - Patient cells show increased STAT activation to multiple cytokines, reversible by JAK inhibition
  evidence:
  - reference: PMID:34421895
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which demonstrates the clinical spectrum spans from autoimmunity to
      infections and malignancy"
    explanation: Establishes that the spectrum includes the infection-prone presentations that overlap CVID.

- name: Other JAK-STAT pathway inborn errors of immunity
  description: >-
    STAT1 and STAT3 gain-of-function disorders reach a similar place from the other
    direction - by activating the signal rather than removing its brake - and also present
    with combined autoimmunity and immunodeficiency responsive to JAK inhibition. The
    KB's PTPN2-haploinsufficiency literature describes an analogous brake-loss disease.
    Distinguishing them is molecular rather than clinical.
  distinguishing_features:
  - STAT1/STAT3 GOF activate the signalling molecule; SOCS1 haploinsufficiency removes its inhibitor
  - All can respond to JAK inhibition, so treatment response does not discriminate between them
  evidence:
  - reference: PMID:33087723
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The intracellular protein SOCS1 is known to downregulate cytokine signaling
      by inhibiting the JAK-STAT pathway."
    explanation: >-
      Curated as PARTIAL because it establishes where SOCS1 sits in the pathway - the basis
      for the comparison - without itself comparing the diseases.

discussions:
- discussion_id: gap_autoimmunity_and_immunodeficiency_from_one_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Humoral Immunodeficiency and Infection Susceptibility
  prompt: >-
    How does a single defect that makes immune cells hypersensitive to cytokines produce
    immunodeficiency and hypogammaglobulinaemia alongside autoimmunity?
  rationale: >-
    The autoimmune arm follows straightforwardly from lymphocyte hyperactivity. The
    immunodeficient arm does not: a system that responds too strongly ought not to
    respond too little. Candidate explanations include activation-induced exhaustion or
    death of chronically stimulated lymphocytes, disruption of B-cell maturation by
    excess interferon signalling, or the immunodeficiency being partly iatrogenic in
    patients treated with immunosuppression for their autoimmunity - a confound that is
    hard to exclude in a disease whose autoimmune manifestations usually present first.
    Distinguishing these matters for whether JAK inhibition would be expected to improve
    or worsen the infection susceptibility.
  proposed_experiments:
  - experiment_id: exp_socs1_bcell_maturation_untreated
    name: B-cell maturation phenotyping in treatment-naive SOCS1 haploinsufficient patients
    description: >-
      Characterise B-cell subsets, class-switching and immunoglobulin levels in patients
      before any immunosuppressive therapy, and again on JAK inhibition. If
      hypogammaglobulinaemia is present pre-treatment it is intrinsic to the disease; if it
      emerges only after immunosuppression, the immunodeficient arm is substantially
      iatrogenic and the entry's causal chain should be revised.

- discussion_id: gap_broad_defect_narrow_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Cytokine Hypersensitivity with Increased STAT Activation
  prompt: >-
    Why did blocking just two cytokine axes control disease in a patient whose cells were
    hyper-responsive to many?
  rationale: >-
    Patient cells show excess STAT activation to interferon-gamma, IL-2, IL-4 and more,
    yet one patient's clinical disease responded markedly to IL4Rα and IL-17 blockade
    alone. Either the laboratory hyper-responsiveness overstates which axes actually drive
    tissue pathology, or the driving axes differ between patients and this patient's
    happened to be those two. The distinction is directly actionable: the first would
    justify trying targeted biologics before broad JAK inhibition, the second would mean
    the choice has to be made per patient from the phenotype. With single-patient
    evidence, neither is established.
  proposed_experiments:
  - experiment_id: exp_socs1_axis_to_phenotype_mapping
    name: Map per-patient cytokine hyper-responsiveness against clinical manifestations
    description: >-
      Across a SOCS1 cohort, measure STAT activation per cytokine axis and score it against
      each patient's dominant clinical features. A consistent axis-to-phenotype mapping
      would support choosing targeted blockade rationally rather than defaulting to JAK
      inhibition.

notes: >-
  No GeneReviews chapter exists for SOCS1 or for this disease. Verified by search:
  "SOCS1 GeneReviews[All Fields]" returns zero results.

  No frequency bands are assigned to any phenotype. The founding cohort is ten patients
  from five families, the literature since is case reports and small series, and the
  reviews describe the phenotype as pleiotropic and variable rather than giving
  proportions.

  PMID:36890397 ("Phenotypic Variability of SOCS1 Haploinsufficiency") was fetched and is
  topically central, but it caches with an empty abstract, so nothing in this entry is
  quoted from it and it is not listed in references. It is a good candidate for
  re-fetching if full text becomes available.

  Deep-research provenance: the claude_code report resolved 16 of 17 references
  (confabulation_rate 0.059). The single unresolved identifier is a markdown-link parsing
  artefact - "DOI:10.1371/journal.pone.0162111](https://journals.plos.org" - rather than a
  fabricated DOI, and the report also carried one unsupported quote attributed to
  PMC:PMC11070515. Neither is used here; the reference set was assembled by direct PubMed
  search and every snippet is quoted from the cached record.


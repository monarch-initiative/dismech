name: SOCS1 Haploinsufficiency
creation_date: "2026-08-21T00:00:00Z"
category: Mendelian
description: >-
  Autoinflammatory syndrome with immunodeficiency (OMIM 619375) is an autosomal
  dominant inborn error of immunity caused by heterozygous loss-of-function variants
  in SOCS1, with incomplete penetrance.

  SOCS1 is the negative-feedback brake on JAK-STAT signalling. Losing one functional
  copy does not remove a cytokine or a receptor - it removes the off-switch, so cells
  respond excessively to cytokines that are present at ordinary levels. Patient
  lymphocytes show increased STAT activation to interferon-gamma, IL-2 and IL-4, and
  the excess is reversed in vitro by a JAK1/JAK2 inhibitor.

  The resulting disease is simultaneously autoimmune and immunodeficient, which is
  the feature that makes it worth curating as its own entity rather than as an
  autoimmunity syndrome. The reported spectrum runs from autoimmune cytopenias,
  thyroiditis, nephritis and lupus-like disease through hypogammaglobulinaemia and
  recurrent infection to malignancy - all from one gene, in a dosage-sensitive
  pathway whose job is restraint rather than activation.
disease_term:
  preferred_term: autoinflammatory syndrome with immunodeficiency
  term:
    id: MONDO:0800130
    label: autoinflammatory syndrome with immunodeficiency
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant with incomplete penetrance. Disease arises from haploinsufficiency
    - one functional allele does not supply enough SOCS1 to restrain JAK-STAT signalling -
    rather than from a dominant-negative effect.
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "by whole-exome/genome sequencing we identify heterozygous, autosomal-dominant,
      germline loss-of-function mutations in the SOCS1 gene in ten patients from five
      unrelated families with early onset autoimmune manifestations"
    explanation: >-
      Establishes the inheritance pattern, the variant class, and the size of the founding
      cohort.

pathophysiology:
- name: Heterozygous SOCS1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Germline heterozygous loss-of-function variants in SOCS1. Reported alleles include
    frameshifts producing complete loss of protein expression from the affected allele;
    one such variant, c.202_203delAC (p.Thr68fsAla*49), was shown to abolish the
    protein's ability to inhibit JAK-STAT signalling when expressed in vitro.
  downstream:
  - target: Loss of JAK-STAT Negative Feedback
    causal_link_type: DIRECT
  - target: Loss of SOCS-Box E3 Ligase Function
    causal_link_type: DIRECT
    description: >-
      The same halved gene relieves both of SOCS1's activities. The SH2 domain stops
      inhibiting JAK and the SOCS-box stops assembling its E3 ligase; neither arm is
      downstream of the other.
  evidence:
  - reference: PMID:38157076
    reference_title: "IL4Rα and IL17A Blockade Rescue Autoinflammation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The variant, c.202_203delAC, generates a frameshift in SOCS1,
      p.Thr68fsAla*49, which leads to complete loss of protein expression."
    explanation: Documents a specific frameshift allele and confirms it is a true null.

- name: Loss of JAK-STAT Negative Feedback
  biological_scale: MOLECULAR
  description: >-
    SOCS1 is an intracellular inhibitor of the JAK-STAT pathway - a brake, not a signal.
    Haploinsufficiency therefore does not alter what cytokines are present; it alters how
    strongly cells answer them. The mutant protein fails to perform the inhibition that
    wild-type SOCS1 does.
  biological_processes:
  - preferred_term: negative regulation of cytokine-mediated signaling pathway
    term:
      id: GO:0001960
      label: negative regulation of cytokine-mediated signaling pathway
    modifier: DECREASED
  downstream:
  - target: Cytokine Hypersensitivity with Increased STAT Activation
    causal_link_type: DIRECT
  - target: Reduced STAT3 Phosphorylation
    causal_link_type: DIRECT
    description: >-
      The same loss of feedback that raises STAT1 lowers STAT3. Both are downstream of the
      brake rather than of each other, which is why they are drawn as sibling arms.
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intracellular protein SOCS1 is known to downregulate cytokine signaling
      by inhibiting the JAK-STAT pathway."
    explanation: Establishes SOCS1's normal function as the brake whose loss defines this disease.
  - reference: PMID:38157076
    reference_title: "IL4Rα and IL17A Blockade Rescue Autoinflammation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unlike WT SOCS1, Thr68fs SOCS1 fails to inhibit JAK-STAT signaling when
      expressed in vitro."
    explanation: Direct functional demonstration that the variant protein cannot inhibit the pathway.

- name: Cytokine Hypersensitivity with Increased STAT Activation
  biological_scale: CELLULAR
  description: >-
    The central defect, and the one that is directly measurable in patients. Patient
    lymphocytes show increased STAT activation in response to interferon-gamma, IL-2 and
    IL-4 - three cytokines with different receptors and different downstream programmes,
    which is why the disease is pleiotropic rather than confined to one axis. Monocyte
    subpopulations are redistributed and hyper-responsive across multiple cytokine
    pathways.

    The hypersensitivity is not uniform across STATs, and that matters. STAT1
    phosphorylation is enhanced to a degree comparable with STAT1 gain-of-function
    disease, but STAT3 phosphorylation is REDUCED, with a concurrent fall in Th17 cells.
    So losing the brake does not simply turn everything up: the disease overlaps
    clinically with both STAT1 gain-of-function and STAT3 loss-of-function, and a
    description of it as global cytokine hyper-responsiveness is incomplete.
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: INCREASED
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  downstream:
  - target: Lymphocyte Hyperactivity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patient-derived lymphocytes exhibit increased STAT activation in vitro in
      response to interferon-γ, IL-2 and IL-4 that is reverted by the JAK1/JAK2 inhibitor
      ruxolitinib"
    explanation: >-
      Demonstrates the hypersensitivity across three distinct cytokines and establishes its
      pharmacological reversibility, which is the basis of the treatment link below.
  - reference: PMID:38157076
    reference_title: "IL4Rα and IL17A Blockade Rescue Autoinflammation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The peripheral immune signature from this patient was marked by a
      redistribution of monocyte sub-populations and hyper-responsiveness to multiple
      cytokines."
    explanation: Extends the hypersensitivity beyond lymphocytes to the monocyte compartment.
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT1 phosphorylation is enhanced, comparably with STAT1 gain-of-function
      mutations, and STAT3 phosphorylation is similarly reduced with concurrent reduction
      of Th17 cells."
    explanation: >-
      Curated as PARTIAL against the node's framing rather than as plain support: it
      establishes the hypersensitivity for STAT1 while showing the opposite for STAT3, so
      it qualifies the node as much as it supports it.
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduced SOCS1 shows clinical overlaps with different monogenic IEIs, such as
      STAT3LOF and STAT1GOF"
    explanation: >-
      The clinical corollary of the split STAT phenotype, and the reason the disease
      resembles two opposite monogenic disorders at once.

- name: Lymphocyte Hyperactivity
  biological_scale: CELLULAR
  description: >-
    Cytokine hypersensitivity translates into a broad set of immune abnormalities
    consistent with lymphocytes that are too easily activated. This is the node from
    which the disease's two apparently opposite arms both descend.
  downstream:
  - target: Defective Regulatory T Cell Compartment
    causal_link_type: DIRECT
  - target: Impaired B Cell Maturation
    causal_link_type: DIRECT
  - target: Loss of Self-Tolerance and Autoimmunity
    causal_link_type: DIRECT
  - target: Humoral Immunodeficiency and Infection Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This effect is associated with a series of in vitro and in vivo immune
      abnormalities consistent with lymphocyte hyperactivity."
    explanation: Establishes lymphocyte hyperactivity as the consequence of cytokine hypersensitivity.

- name: Defective Regulatory T Cell Compartment
  biological_scale: CELLULAR
  description: >-
    The cellular mechanism for the tolerance failure, which the hyperactivity node cannot
    supply on its own. Patients have a reduced frequency of CD4+CD25+FOXP3+ Tregs, lower
    expression of FOXP3 and HELIOS, and moderately but significantly reduced suppressive
    activity. The reduction is not an artefact of memory CD4 expansion. This matters
    directionally: a disease of excess signalling also removes the cells whose job is to
    restrain it, so the two arms compound rather than merely coexist.
  cell_types:
  - preferred_term: CD4+CD25+FOXP3+ regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
    modifier: DECREASED
  downstream:
  - target: Loss of Self-Tolerance and Autoimmunity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This reduction in T regs frequency was not due to the expansion of memory
      CD4 T cells"
    explanation: >-
      Establishes the Treg frequency reduction in patients and excludes the trivial
      explanation that it reflects expansion of another CD4 compartment.
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally regulatory T cells are reduced in most SOCS1"
    explanation: >-
      Independent corroboration in a second patient series, which is why this is curated
      as a mechanism node rather than a single-cohort observation.

- name: Reduced STAT3 Phosphorylation
  biological_scale: MOLECULAR
  description: >-
    The finding that breaks the uniform-hypersensitivity framing. Losing a JAK-STAT brake
    does not raise every STAT equally: STAT1 phosphorylation is enhanced, comparably with
    STAT1 gain-of-function mutations, but STAT3 phosphorylation is reduced. A brake whose
    removal lowers one of its own substrates is not behaving as a simple brake, which is
    why this arm is modelled separately from the hypersensitivity node rather than as part
    of it.
  biological_processes:
  - preferred_term: STAT3 tyrosine phosphorylation
    term:
      id: GO:0007260
      label: tyrosine phosphorylation of STAT protein
    modifier: DECREASED
  downstream:
  - target: Th17 Compartment Reduction
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT1 phosphorylation is enhanced, comparably with STAT1 gain-of-function
      mutations, and STAT3 phosphorylation is similarly reduced with concurrent reduction
      of Th17 cells."
    explanation: >-
      States both halves of the asymmetry, which is what makes "cytokine hypersensitivity"
      an incomplete description of the molecular phenotype.
- name: Th17 Compartment Reduction
  biological_scale: CELLULAR
  description: >-
    The cellular consequence of the reduced STAT3 signal, STAT3 being required for Th17
    differentiation. A reduced Th17 compartment is a plausible route to the
    infection-susceptibility arm whose intermediates the entry otherwise leaves unknown,
    so the edge below is curated as a candidate explanation rather than an established
    one: the two cohorts disagree about Th17, which is recorded as a discussion rather
    than resolved here.
  cell_types:
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
    modifier: DECREASED
  biological_processes:
  - preferred_term: T-helper 17 cell differentiation
    term:
      id: GO:0072539
      label: T-helper 17 cell differentiation
    modifier: DECREASED
  downstream:
  - target: Humoral Immunodeficiency and Infection Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated as a candidate route, not an established one. Th17 cells defend mucosal
      surfaces against extracellular bacteria and fungi, so their loss is a mechanistically
      coherent contributor to the infection arm - but the Th17 finding itself is disputed
      between the two cohorts, so the edge is left indirect rather than asserted as the
      explanation.
  evidence:
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "STAT3 phosphorylation is similarly reduced with concurrent reduction
      of Th17 cells."
    explanation: >-
      Ties the Th17 fall to the reduced STAT3 signal in the same patients.

- name: Loss of SOCS-Box E3 Ligase Function
  biological_scale: MOLECULAR
  description: >-
    The second of SOCS1's two domains, and the arm the entry previously omitted entirely -
    modelling a two-domain protein as a one-domain brake. Beyond the SH2-mediated JAK
    inhibition, SOCS1 uses its C-terminal SOCS-box to assemble a Cullin5-Rbx2 E3 ligase
    that ubiquitinates substrates for degradation, including FAK1 and the TLR adaptor
    TIRAP. Halving SOCS1 therefore also relieves that degradation: FAK1 rises, AKT and
    p70S6K phosphorylation increase, and TLR responses are elevated. This is a
    JAK-STAT-independent route to immune dysregulation, which is part of why the clinical
    picture is as pleiotropic as it is.
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
    modifier: DECREASED
  downstream:
  - target: Lymphocyte Hyperactivity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "reduced SOCS1 E3 ligase function was associated with increased FAK1 in
      immune cells, and increased AKT and p70 ribosomal protein S6 kinase phosphorylation"
    explanation: Establishes the E3-ligase arm and its two measured downstream consequences.
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found Toll-like receptor responses are increased in SOCS1
      haploinsufficiency patients."
    explanation: >-
      The innate-immune consequence of losing TIRAP degradation, and the reason this arm
      is not reducible to the T-cell phenotype.

- name: Impaired B Cell Maturation
  biological_scale: CELLULAR
  description: >-
    Low marginal zone and/or switched memory B cell counts in seven of ten patients, with
    IgG levels normal. The dissociation is the informative part: a normal IgG cannot be
    used to rule out the B-cell defect, and the defect is a maturation problem rather than
    a production one.
  cell_types:
  - preferred_term: switched memory B cell
    term:
      id: CL:0000972
      label: class switched memory B cell
    modifier: DECREASED
  downstream:
  - target: Humoral Immunodeficiency and Infection Susceptibility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The marginal zone and/or switched memory B cell counts were both low in
      seven patients"
    explanation: >-
      Establishes the B-cell maturation defect with an explicit denominator in the
      founding ten-patient cohort.

- name: Loss of Self-Tolerance and Autoimmunity
  biological_scale: ORGANISM
  description: >-
    The autoimmune arm. Early-onset autoimmune disease is the presenting problem in most
    reported patients - autoimmune cytopenias prominently, with thyroiditis, nephritis,
    hepatitis and lupus-like features also described. The founding study frames the
    disease explicitly as a failure of a self-tolerance checkpoint.
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hence, SOCS1 haploinsufficiency causes a dominantly inherited predisposition
      to early onset autoimmune diseases related to cytokine hypersensitivity of immune
      cells."
    explanation: >-
      The authors' concluding statement linking the molecular defect to the autoimmune
      phenotype.

- name: Humoral Immunodeficiency and Infection Susceptibility
  biological_scale: ORGANISM
  description: >-
    The immunodeficient arm - real, but narrower than the disease name suggests, and
    this entry initially overstated it. In the founding cohort of ten patients, none had
    infectious complications except one with recurrent bronchopulmonary infection, and
    IgG levels were normal. What that cohort does show is a maturation defect without a
    functional antibody deficit: marginal zone and/or switched memory B cells were low in
    seven of ten. Hypogammaglobulinaemia and CVID-like presentations are reported
    elsewhere in the literature and in the OMIM definition, so the arm is not fictional -
    but it is not the founding cohort's finding, and the entry should not read as if it
    were.

    A candidate route now exists for the part that is real: reduced STAT3 phosphorylation
    with falling Th17 cells is the same axis whose loss causes infection susceptibility in
    STAT3 loss-of-function disease. The incoming edge stays
    INDIRECT_UNKNOWN_INTERMEDIATES because that link is inferred from the shared signalling
    lesion rather than demonstrated in these patients.
  evidence:
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which demonstrates the clinical spectrum spans from autoimmunity to
      infections and malignancy"
    explanation: >-
      Establishes that infection susceptibility, not only autoimmunity, is part of the
      reported spectrum.
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas one (B2) developed Hodgkin lymphoma. None had infectious
      complications"
    explanation: >-
      Qualifies the arm rather than supporting it: infection was absent in nine of ten
      founding patients, which is why this is PARTIAL and why the entry does not read as
      if infection were a general feature. The cached sentence continues "with the
      exception of recurrent bronchopulmonary infections in B1", hyphen-split across a
      line in the PDF extraction, so the quote is extended backward into the preceding
      clause rather than forward across the break.
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The marginal zone and/or switched memory B cell counts were both low in
      seven patients"
    explanation: >-
      The B-cell maturation defect - low marginal zone and/or switched memory B cells in
      seven of ten - which is what the founding cohort shows in place of a functional
      antibody deficiency. Extended from a fragment that began mid-sentence and did not
      say which counts were low.

phenotypes:
- category: Hematological
  name: Autoimmune Cytopenia
  frequency: FREQUENT
  description: >-
    Autoimmune cytopenias including immune thrombocytopenia and autoimmune haemolytic
    anaemia, frequently the presenting problem. Five of the ten patients in the founding
    cohort had autoimmune cytopenia - the explicit denominator this band is derived from,
    and the highest single-manifestation count in that series.
  phenotype_term:
    preferred_term: Autoimmune hemolytic anemia
    term:
      id: HP:0001890
      label: Autoimmune hemolytic anemia
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identify heterozygous, autosomal-dominant, germline loss-of-function
      mutations in the SOCS1 gene in ten patients from five unrelated families with early
      onset autoimmune manifestations"
    explanation: >-
      Establishes early-onset autoimmune manifestations in the founding cohort. The
      specific cytopenia types are named in the OMIM/MONDO disease definition rather than
      in this abstract.
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients (A1, A2, B1, C1, and E2) had autoimmune cytopenia"
    explanation: >-
      The explicit denominator behind the FREQUENT band - five of the ten founding
      patients. Carried as its own evidence item because a frequency is a separate
      quantitative claim from the disease-phenotype association above it.

      Granularity caveat, recorded here because this is where the band is justified: the
      count of five is for autoimmune cytopenia as a composite category, which includes
      immune thrombocytopenia, while this phenotype is bound to the narrower HP:0001890
      Autoimmune hemolytic anemia. HPO has no autoimmune-cytopenia term, so 50% is a
      ceiling for AIHA specifically rather than its measured frequency, and the source
      does not decompose the five.

- category: Immunological
  name: Recurrent Infections
  description: >-
    Infection susceptibility is part of the reported spectrum but is the minor arm of it,
    and the entry should not read otherwise. In the founding ten-patient cohort only one
    patient had infectious complications at all - recurrent bronchopulmonary infections -
    and IgG levels were normal, while autoimmunity was near-universal. The disease is named
    for both arms because the spectrum spans them, not because they are equally frequent.

    The frequency band is derived from that explicit denominator (1 of 10). Bands are
    assigned in this entry only where a source gives an explicit count of that kind, which
    is the case for four phenotypes; everything else carries none.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:34421895
    reference_title: "One Gene, Many Facets: Multiple Immune Pathway Dysregulation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which demonstrates the clinical spectrum spans from autoimmunity to
      infections and malignancy"
    explanation: Documents infection as part of the reported clinical spectrum.
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas one (B2) developed Hodgkin lymphoma. None had infectious
      complications"
    explanation: >-
      Curated as PARTIAL because it qualifies rather than supports the phenotype: 1 of 10
      patients in the founding cohort had infections at all, which is the basis for the
      OCCASIONAL band and for the description's caveat.

- category: Immunological
  name: Systemic Lupus Erythematosus
  description: >-
    Two of ten patients met full diagnostic criteria for SLE, with discoid lupus and
    lupus glomerulonephritis. Curated separately from the generic autoimmunity node
    because meeting classification criteria for a defined autoimmune disease is a
    stronger and differently actionable claim than "organ-specific autoimmunity".
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two patients (D1 and E1) met the diagnostic criteria for systemic lupus
      erythematosus"
    explanation: >-
      Explicit 2/10 denominator, which maps to the OCCASIONAL band.

- category: Hematological
  name: Benign Lymphoproliferation
  description: >-
    Lymphadenopathy and/or hepatosplenomegaly in two of ten patients - the reactive,
    non-malignant end of the lymphoproliferative spectrum this disease sits on, and the
    reason a node is not automatically a lymphoma here.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two patients (B1, and C1) had benign lymphoproliferation"
    explanation: >-
      Explicit 2/10 denominator for benign lymphoproliferation in the founding cohort.

- category: Neoplastic
  name: Hodgkin Lymphoma
  description: >-
    One patient in the founding cohort developed Hodgkin lymphoma. Curated because the
    malignant end of the lymphoproliferative spectrum changes surveillance, and because
    it is the clinical counterweight to treating this disease purely as autoimmunity.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Hodgkin lymphoma
    term:
      id: HP:0012189
      label: Hodgkin lymphoma
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whereas one (B2) developed Hodgkin lymphoma. None had infectious
      complications"
    explanation: >-
      Explicit 1/10 denominator for Hodgkin lymphoma. The same sentence carries the
      infection denominator used above.

- category: Immunological
  name: Reduced Marginal Zone and Switched Memory B Cells
  description: >-
    Low marginal zone and/or switched memory B-cell counts, present in seven of the ten
    founding patients while IgG remained normal - a maturation defect that does not
    translate into a measured antibody deficiency in that cohort. The same abnormality was
    found in three of four asymptomatic carriers phenotyped, so it is not by itself
    sufficient for disease.
  phenotype_term:
    preferred_term: Decreased proportion of marginal zone B cells
    term:
      id: HP:0030384
      label: Decreased marginal zone B cell proportion
  evidence:
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "counts were both low in seven patients"
    explanation: Documents the B-cell maturation defect in seven of ten founding patients.
  - reference: PMID:33087723
    reference_title: "Early-onset autoimmunity associated with SOCS1 haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "low marginal zone and/or switch memory B-cell counts in three"
    explanation: >-
      The same abnormality in asymptomatic carriers, which is why it is curated as a
      laboratory feature rather than as a disease-defining one.

- category: Dermatological
  name: Severe Dermatitis
  description: >-
    Severe dermatitis with recurrent skin infections, reported alongside psoriatic
    arthritis in a patient whose disease responded to IL4Rα and IL-17 blockade.
  phenotype_term:
    preferred_term: Dermatitis
    term:
      id: HP:0011123
      label: Inflammatory abnormality of the skin
  evidence:
  - reference: PMID:38157076
    reference_title: "IL4Rα and IL17A Blockade Rescue Autoinflammation in SOCS1 Haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we describe a patient with severe dermatitis, recurrent skin infections, and
      psoriatic arthritis that harbors a novel heterozygous mutation in SOCS1"
    explanation: Documents the dermatological and articular presentation in a confirmed patient.

- category: Immunological
  name: Hypogammaglobulinaemia
  description: >-
    Reduced circulating immunoglobulin, reported as part of a CVID-like presentation
    together with T-cell lymphopenia and granulomatous lymphocytic interstitial lung
    disease. This is the phenotype the Humoral Immunodeficiency node is named for, and
    it is what makes the immunodeficiency arm more than an inference from infection
    counts: a measurable antibody deficit sits alongside the hyperactivity elsewhere.
    Recorded without a frequency band - the source describes it in a single patient of
    a small series as one of several alternative presentations, not as a proportion of
    the cohort.
  phenotype_term:
    preferred_term: Hypogammaglobulinaemia
    term:

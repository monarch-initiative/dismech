name: PPP1R21-Related Neurodevelopmental Disorder
creation_date: "2026-11-22T07:30:00Z"
category: Mendelian
synonyms:
- neurodevelopmental disorder with hypotonia, facial dysmorphism, and brain abnormalities
- NEDHFBA
- PPP1R21-related El-Hattab-Schmidts syndrome
- El-Hattab-Schmidts syndrome
- PPP1R21-NDD
- PPP1R21-related syndromic intellectual disability
- PPP1R21-related intellectual disability
description: >-
  PPP1R21-related neurodevelopmental disorder (OMIM:619383, titled there
  neurodevelopmental disorder with hypotonia, facial dysmorphism, and brain
  abnormalities, NEDHFBA; GeneReviews title PPP1R21-related El-Hattab-Schmidts
  syndrome) is an ultra-rare autosomal recessive encephalopathy caused by
  biallelic loss-of-function variants in PPP1R21. About two dozen individuals
  have been reported, almost all homozygous and from consanguineous families.
  Affected children have profound global developmental delay and intellectual
  disability, hypotonia and weakness, minimal or absent expressive speech,
  delayed and ataxic walking when walking is achieved, and a recognizable coarse
  facial gestalt with thick eyebrows, a broad nasal bridge, thick lips and
  low-set ears. Brain MRI shows thinning of the corpus callosum, reduced white
  matter volume, delayed myelination, ventricular enlargement and cerebellar
  vermis hypoplasia. Strabismus, nystagmus, optic atrophy, feeding difficulty,
  apnea, recurrent respiratory infections and laryngomalacia are common, and
  cardiomyopathy, atrial septal defect, seizures and hepatomegaly are reported.

  PPP1R21 localizes to early endosomes and forms the backbone of the
  five-subunit endosomal Rab5 and RNA/ribosome intermediary (FERRY) complex,
  which binds active Rab5 and carries mRNA on early endosomes; with TBCK and
  FERRY3 it also forms a RAB5 GTPase-activating heterotrimer. Patient
  fibroblasts lack PPP1R21 protein, clear endocytosed transferrin slowly,
  accumulate myelin-like bodies and show activation of the ubiquitin-proteasome
  system. How these cellular defects produce the brain malformations is not
  established, so the link from endosomal dysfunction to abnormal brain
  development is curated as an inferred, indirect edge.

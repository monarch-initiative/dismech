    reference_title: "Biallelic loss of function variants in PPP1R21 cause a neurodevelopmental syndrome with impaired endocytic function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we delineate a novel neurodevelopmental syndrome caused by biallelic
      PPP1R21 loss of function variants
    explanation: Establishes PPP1R21 as the causal gene.
  - reference: PMID:41570170
    reference_title: "PPP1R21-Related El-Hattab-Schmidts Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PPP1R21-related El-Hattab-Schmidts syndrome is established
      in a proband by identification of biallelic pathogenic variants in PPP1R21
      by molecular genetic testing.
    explanation: GeneReviews states the molecular diagnostic criterion.
  features: >-
    Reported variants are predominantly loss of function (nonsense, frameshift
    and splice-site), with two missense variants; all affected individuals are
    homozygous. Founding alleles include c.347delT p.(Ile116Lysfs*25),
    c.2170_2171insGGTA p.(Ile724Argfs*8), c.1607dupT p.(Leu536Phefs*7),
    c.2063delA p.(Lys688Serfs*26), c.2089C>T p.(Arg697*), c.427C>T p.(Arg143*)
    and c.87_88delAG p.(Gly30Cysfs*4).

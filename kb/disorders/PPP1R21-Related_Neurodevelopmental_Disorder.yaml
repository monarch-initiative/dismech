progression:
- phase: Infantile onset
  age_range: Infancy
  notes: >-
    Hypotonia, weakness, poor feeding and profound developmental delay are
    evident in infancy, with recurrent chest infections and respiratory
    compromise in the most severely affected children.
  evidence:
  - reference: PMID:29808498
    reference_title: "PPP1R21 homozygous null variants associated with developmental delay, muscle weakness, distinctive facial features, and brain abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 3-year-old girl had profound developmental delay, hypotonia and weakness,
      poor feeding, recurrent chest infections and respiratory failure
    explanation: Describes the early presentation in a young child.
- phase: Childhood and adulthood
  notes: >-
    Developmental impairment persists; walking, when achieved, is delayed and
    ataxic. The oldest reported patient, an adult, had a progressively coarser
    appearance, and mortality across the reported cohort was 17%.
  evidence:
  - reference: PMID:32985083
    reference_title: "PPP1R21-related syndromic intellectual disability: Report of an adult patient and review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The oldest patients could display a more severe clinical outcome, due to
      accumulation of metabolites or damage secondary to an alteration of the
      autophagy pathway.
    explanation: >-
      The authors of the adult case report raise the possibility of a more severe
      outcome with age; this is a hypothesis, not an observed natural history.
  - reference: PMID:42570139
    reference_title: "PPP1R21-Related neurodevelopmental disorder: Phenotypic delineation, variant spectrum, and pathophysiological mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic features included feeding dysfunction and respiratory morbidity
      requiring gastrostomy or tracheostomy in severe cases. Mortality was 17%
      (4/24).
    explanation: Reports mortality across the reported cohort.
pathophysiology:
- name: Biallelic PPP1R21 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous truncating variants (nonsense, frameshift and splice-site), and
    rarely missense variants, abolish PPP1R21 function. PPP1R21 protein is
    absent from patient fibroblasts.

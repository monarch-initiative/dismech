    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PPP1R21-related neurodevelopmental disorder (PPP1R21-NDD) is an ultra-rare
      autosomal-recessive encephalopathy caused by dysfunction of the
      Five-subunit Endosomal Rab5 and RNA/ribosome intermediarY (FERRY) complex.
    explanation: The disease is framed as a FERRY-complex disorder.
  - reference: PMID:40062705
    reference_title: "Neurogenetic disorders associated with mutations in the FERRY complex: a novel disease class?"
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The backbone of the FERRY complex is formed by PPP1R21, which binds Rab5
      on early endosomes when Rab5 is active and bound to GTP
    explanation: Summarizes the structural role of PPP1R21 in the complex.
  - reference: PMID:41789809
    reference_title: "The TBCK-PPP1R21-FERRY3/C12orf4 complex: a RAB5-GAP brake essential for endo-lysosomal homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      we identify TBCK as the catalytic core of a heterotrimeric complex
      comprising TBCK, PPP1R21, and FERRY3/C12orf4. This complex functions as a
      specific GTPase-activating protein (GAP) for RAB5.
    explanation: >-
      Places PPP1R21 in a RAB5-GAP heterotrimer. The study perturbed TBCK, not
      PPP1R21, so the consequence of PPP1R21 loss for RAB5 activity is inferred.

  - reference: PMID:41570170
    reference_title: "PPP1R21-Related El-Hattab-Schmidts Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a PPP1R21 pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being an asymptomatic carrier, and a 25%
      chance of being unaffected and not a carrier.
    explanation: GeneReviews states the sib recurrence risk.
discussions:
- discussion_id: no_neural_model_of_ppp1r21_deficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of PPP1R21, demonstrated so far only as an endocytic and
    proteostatic defect in fibroblasts, produce white matter loss, callosal
    thinning and cerebellar vermis hypoplasia?
  rationale: >-
    The only published animal model is a zebrafish ppp1r21 mutant studied for
    bile duct formation, in which neurological phenotypes were not examined, so
    the link from the cellular defect to the brain phenotype rests on inference.
  attaches_to:
  - pathophysiology#Impaired Endosomal Cargo Clearance
  - pathophysiology#Abnormal Brain Development
  evidence:
  - reference: PMID:40062705
    reference_title: "Neurogenetic disorders associated with mutations in the FERRY complex: a novel disease class?"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These larvae die by 15 days post fertilization and have notable bile duct,
      gallbladder, and liver disruptions; however, no neurological phenotypes
      were examined in that study.
    explanation: Records that the only animal model has no neurological readout.
notes: >-
  Naming: the entry is named PPP1R21-Related Neurodevelopmental Disorder rather
  than the MONDO/OMIM label, which names a phenotype and does not mention the
  gene. The dyadic name is used in recent primary literature
  (PMID:38356149, "Expanding the phenotype of PPP1R21-related
  neurodevelopmental disorder"; PMID:42570139, "PPP1R21-Related
  neurodevelopmental disorder: Phenotypic delineation, variant spectrum, and
  pathophysiological mechanisms"), and GeneReviews titles the same disease
  PPP1R21-Related El-Hattab-Schmidts Syndrome (PMID:41570170). The similarly
  named WBP4-related disorder with feeding difficulties (OMIM:620852) is a
  different disease and is not covered here.

      evidence_source: IN_VITRO
      snippet: >-
        Proteomic findings and further functional studies demonstrate a profound
        activation of the ubiquitin-proteasome system with presence of protein
        aggregates and impact on cellular fitness
      explanation: Proteomic and functional study of PPP1R21-mutant fibroblasts.
- name: FERRY Complex Disruption
  biological_scale: MOLECULAR
  description: >-
    PPP1R21 forms the backbone of the five-subunit endosomal Rab5 and
    RNA/ribosome intermediary (FERRY) complex (TBCK, PPP1R21, FERRY3/C12orf4,
    CRYZL1, GATD1), which binds GTP-bound Rab5 on early endosomes and is
    proposed to carry mRNA for local translation. With TBCK and FERRY3, PPP1R21
    also forms a heterotrimer with RAB5 GTPase-activating activity. Whether the
    endocytic defect in patient cells is mediated through the FERRY complex is
    not established.

    Biallelic pathogenic PPP1R21 variants are required. All reported affected
    individuals are homozygous, reflecting the high rate of parental
    consanguinity; heterozygous carriers are asymptomatic.
  inheritance_term:
    preferred_term: autosomal recessive inheritance

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we found patient fibroblasts exhibited a delay in clearance of
        transferrin-488 while uptake was normal
      explanation: Directly measures the endocytic defect in PPP1R21-null cells.
  - target: Ubiquitin-Proteasome System Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fibroblasts from a patient homozygous for a PPP1R21 splice variant show
      activated proteasome function and protein aggregates; the steps between

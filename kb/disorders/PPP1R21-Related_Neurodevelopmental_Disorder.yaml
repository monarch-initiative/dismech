    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PPP1R21-related El-Hattab-Schmidts syndrome is inherited in an autosomal
      recessive manner.
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:42570139
    reference_title: "PPP1R21-Related neurodevelopmental disorder: Phenotypic delineation, variant spectrum, and pathophysiological mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-five individuals from 21 families harbored 17 distinct variants (15
      loss-of-function, 2 missense), all homozygous, reflecting high
      consanguinity.
    explanation: >-
      A literature-wide review of individual-level data finds every reported
      individual homozygous, consistent with recessive inheritance.

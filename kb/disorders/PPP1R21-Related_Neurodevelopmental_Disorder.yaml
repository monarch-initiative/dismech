    explanation: Independent cohort of three children with homozygous null variants.
  downstream:
  - target: FERRY Complex Disruption
    causal_link_type: DIRECT
    description: >-
      PPP1R21 is the structural backbone of the FERRY complex; a disease-causing
      truncation removes the binding site for TBCK and FERRY3 and the truncated
      complex no longer binds Rab5.
    evidence:
    - reference: PMID:40062705
      reference_title: "Neurogenetic disorders associated with mutations in the FERRY complex: a novel disease class?"
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        following truncation of PPP1R21 that abolished TBCK and FERRY3 binding,
        the FERRY complex was also unable to bind Rab5
      explanation: >-
        The review summarizes structural work on a pathogenic PPP1R21 truncation,
        which loses Rab5 binding by the complex.
  - target: Impaired Endosomal Cargo Clearance
    causal_link_type: DIRECT
    description: >-
      Loss of PPP1R21 slows the clearance of endocytosed transferrin from patient
      fibroblasts without affecting its uptake.
    evidence:
    - reference: PMID:30520571

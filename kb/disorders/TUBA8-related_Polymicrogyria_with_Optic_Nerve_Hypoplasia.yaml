name: TUBA8-related Polymicrogyria with Optic Nerve Hypoplasia
creation_date: "2026-08-20T18:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Polymicrogyria with optic nerve hypoplasia
  term:
    id: MONDO:0013172
    label: polymicrogyria with optic nerve hypoplasia
description: >-
  Polymicrogyria with optic nerve hypoplasia (PMGOH; MONDO:0013172) is a
  recognized clinical entity, but its originally proposed relationship to TUBA8
  is DISPUTED. ClinGen's Brain Malformations Gene Curation Expert Panel reached
  that classification in 2023 and concluded that no valid evidence remained to
  support the TUBA8-PMGOH claim. In 2009 an autosomal recessive syndrome of generalized
  polymicrogyria with optic nerve hypoplasia was mapped by autozygosity to
  a 7.42-Mb interval containing TUBA8, and a homozygous hypomorphic splice
  variant in TUBA8 was prioritized. The proposed mechanism drew on TUBA8's
  unusual alanine at position 40, where other alpha-tubulins carry a modifiable
  lysine, and on an apparent expression pattern in developing cerebral cortex.
  The latter evidence was subsequently weakened when TUBA8-specific probes
  found only very low expression in developing mouse and human brain.

  That relationship has since been substantially undercut, and by the original
  authors. A Tuba8 knockout mouse confirmed to lack Tuba8 protein did not display
  polymicrogyria and appeared neurologically normal. In response, the authors
  re-analysed the original human subjects by whole exome sequencing and found an
  additional homozygous loss-of-function mutation in SNAP29 - concluding that
  SNAP29 deficiency, rather than TUBA8 deficiency, may underlie most or all of
  the neurodevelopmental anomalies in those subjects. That is not a failure to
  replicate; it is a competing causal variant identified in the founding
  subjects on whom the gene-disease claim rests.

  Tuba8 nevertheless has demonstrable neurodevelopmental roles that should not
  be mistaken for evidence of PMGOH causality. It drives differentiation of
  cortical radial glia into apical intermediate progenitors by tuning tubulin
  C-terminal modifications. A 2026 Purkinje-cell-specific knockout also showed
  impaired dendrite development and maintenance with age-dependent locomotor
  and anxiety-like changes. These findings establish biological function in
  particular neural contexts, not a generalized cortical polymicrogyria
  mechanism or a human TUBA8-PMGOH association.

  This entry binds the MONDO disease identity while keeping the gene-disease
  claim explicitly disputed: ontology identity and causal validity are separate
  assertions. It exists so that a curator meeting TUBA8 on a polymicrogyria
  panel finds the expert-panel classification and competing SNAP29 explanation
  rather than an apparent gap or an unqualified causal claim.

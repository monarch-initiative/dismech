genetic:
- name: TUBA8
  association: Disputed
  relationship_type: DISPUTED
  gene_term:
    preferred_term: TUBA8 (atypical alpha-tubulin 8)
    term:
      id: hgnc:12410
      label: TUBA8
  notes: >-
    Recorded as Disputed, matching the 2023 ClinGen Brain Malformations GCEP
    classification. The 2009 autozygosity mapping and molecularly hypomorphic
    TUBA8 splice variant are real observations, but the shared interval contained
    a homozygous SNAP29 loss-of-function variant, global Tuba8 knockout did not
    produce PMG, the original broad cortical expression result was not reproduced
    with TUBA8-specific probes, and an additional proband with compound
    heterozygous TUBA8 missense variants lacked both PMG and optic nerve
    hypoplasia. TUBA8 has experimentally supported neural functions, but those do
    not establish this human gene-disease relationship.
  evidence:
  - reference: CGGV:assertion_9bd5681e-2a42-4bbb-be5f-dabe6efa5334-2023-12-19T170000.000Z
    reference_title: TUBA8 / polymicrogyria with optic nerve hypoplasia (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      TUBA8 | HGNC:12410 | polymicrogyria with optic nerve hypoplasia |
      MONDO:0013172 | AR | Disputed
    explanation: >-
      ClinGen's expert-panel classification directly supports recording this
      association as Disputed.
  - reference: CGGV:assertion_9bd5681e-2a42-4bbb-be5f-dabe6efa5334-2023-12-19T170000.000Z
    reference_title: TUBA8 / polymicrogyria with optic nerve hypoplasia (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Another proband, who had compound heterozygous missense variants in trans
      in TUBA8, had epilepsy but no brain structural anomalies or optic nerve
      hypoplasia
    explanation: >-
      The only additional reported proband was phenotypically discordant with
      PMGOH, so it does not provide replication of the founding association.
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By autozygosity mapping, we show that the molecular basis for this
      condition is mutation of the TUBA8 gene
    explanation: The founding human genetic evidence for the association.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mice were confirmed to lack Tuba8 protein in the testis, but

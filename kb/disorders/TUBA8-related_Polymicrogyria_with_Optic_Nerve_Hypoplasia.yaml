genetic:
- name: TUBA8
  association: Suspected
  gene_term:
    preferred_term: TUBA8 (atypical alpha-tubulin 8)
    term:
      id: hgnc:12410
      label: TUBA8
  notes: >-
    Recorded as Suspected rather than Causative. The 2009 autozygosity mapping is
    real human genetic evidence, but the mouse knockout does not support a brain
    developmental role and a companion study argues the isotype cannot substitute
    for TUBA1A in migration. No ClinGen-style gene-disease validity assessment is
    cited in the sources available here.
  evidence:
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT

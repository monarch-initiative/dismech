discussions:
- discussion_id: gap_tuba8_gene_disease_validity
  prompt: >-
    Is TUBA8 a genuine cause of polymicrogyria with optic nerve hypoplasia, or
    was the 2009 autozygosity finding a linked bystander?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Altered Atypical Alpha-Tubulin (TUBA8) Function
  - pathophysiology#Disrupted Cortical Development
  rationale: >-
    The evidence points both ways and has not been reconciled. FOR the
    association: autozygosity mapping in a consanguineous family identified TUBA8,
    the gene has a distinctive expression pattern in developing cortex, and it
    uniquely lacks the lysine 40 acetylation site that regulates migration - a
    specific, testable mechanistic hypothesis. AGAINST: a Tuba8 mouse knockout
    shows a likely role in spermatogenesis but not in brain development, which is
    close to a direct refutation, and a companion paper argues explicitly that
    Tuba8 cannot substitute for Tuba1a in neuronal migration. Complicating both:
    Tuba8 does have cortical developmental functions - driving radial glia
    differentiation into apical intermediate progenitors, and promoting dendrite
    development - but those are progenitor and post-migratory roles, not the
    migration defect polymicrogyria would imply.

    Decisively, the linked-bystander possibility is not hypothetical here - it
    was found. Autozygosity mapping identifies a homozygous REGION, not a
    variant, and when the knockout mouse came back neurologically normal the
    authors re-analysed the original human subjects by whole exome sequencing and
    identified an additional homozygous loss-of-function mutation in SNAP29,
    concluding that SNAP29 deficiency rather than TUBA8 deficiency may underlie
    most or all of the neurodevelopmental anomalies. A competing causal variant in
    the founding family is the strongest form this objection can take.

    What would nonetheless settle the question in TUBA8's favour has not been
    done: additional unrelated families with biallelic TUBA8 variants and the same
    phenotype, without a SNAP29 or other candidate second hit. A single family is
    a single family, and seventeen years without a second one is itself
    informative. The residual case for a TUBA8 contribution is narrow and specific
    - Tuba8 localises to cerebellar Purkinje cells in mouse brain, which the
    knockout authors suggest could mean the human variants modify motor control
    even if they do not cause the polymicrogyria.

    Until then this entry deliberately carries no disease_term and records the
    gene association as Suspected. Curators should not promote it on the strength
    of the gene appearing in polymicrogyria panel lists - panel membership
    reflects historical reporting, not validity assessment.
  proposed_experiments:
  - experiment_id: exp_tuba8_independent_family_ascertainment
    name: Ascertainment of additional biallelic TUBA8 families
    description: >-
      Query large polymicrogyria and cortical malformation sequencing cohorts for
      biallelic TUBA8 variants, and where found, assess segregation and phenotype
      concordance with the reported PMGOH syndrome.
    decision_criterion: >-
      Two or more unrelated families with biallelic TUBA8 variants and concordant
      polymicrogyria with optic nerve hypoplasia would establish the association
      and justify a disease_term plus grouping consideration. Continued absence
      across well-powered cohorts would argue the original finding was a linked
      bystander and this entry should be retired to a note.
    would_support:
    - pathophysiology#Altered Atypical Alpha-Tubulin (TUBA8) Function
  evidence:
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By autozygosity mapping, we show that the molecular basis for this
      condition is mutation of the TUBA8 gene, encoding a variant alpha-tubulin of
      unknown function that is not susceptible to the lysine 40 acetylation that
      regulates microtubule function during cortical neuron migration.
    explanation: >-
      The case for the association, including the specific mechanistic
      hypothesis.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mice were confirmed to lack Tuba8 protein in the testis, but
      did not display PMG and appeared to be neurologically normal.
    explanation: >-
      The negative brain phenotype in a confirmed protein-null animal, which is
      the strongest single piece of evidence against the association.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This resulted in identification of an additional homozygous
      loss-of-function mutation in SNAP29, suggesting that SNAP29 deficiency,
      rather than TUBA8 deficiency, may underlie most or all of the
      neurodevelopmental anomalies in these subjects.
    explanation: >-
      A competing causal variant identified in the founding family itself - the
      linked-bystander scenario confirmed rather than merely hypothesized.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, in the mouse brain, Tuba8 specifically localised to the
      cerebellar Purkinje cells, suggesting that the human mutations may affect
      or modify motor control.
    explanation: >-
      The narrow residual case for a TUBA8 neurological contribution, offered by
      the same authors who undercut the primary claim.
  - reference: PMID:32097653
    reference_title: Tuba8 Drives Differentiation of Cortical Radial Glia into Apical Intermediate Progenitors by Tuning Modifications of Tubulin C Termini.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that the non-canonical tubulin Tuba8, transiently expressed in
      cortical progenitors, drives differentiation of RGs into apical
      intermediate progenitors, a more restricted progenitor type lacking
      attachment to the basal lamina.
    explanation: >-
      Shows Tuba8 does have a cortical developmental role - but a
      progenitor-differentiation one rather than the migration role the disease
      attribution would require.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md, which flagged TUBA8
  as a contested candidate that should be recorded rather than silently omitted.

  NO disease_term is bound, deliberately. MONDO does have concepts in this space,
  but binding one would assert a disease entity whose gene-disease validity is
  unresolved. This is the honest representation of a contested association: the
  phenotype is real and the genetic finding is real, but the causal link between
  them is not established. If additional unrelated biallelic families are
  reported, the disease_term should be added and membership of the
  Tubulinopathies grouping reconsidered at the same time.

  NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure. Conformance would assert
  exactly the migration mechanism that the mouse knockout fails to support, so
  declaring it would smuggle the contested claim in through the module layer.

  genetic[].association is Suspected rather than Causative, and the negative mouse
  evidence is curated with supports REFUTE so the contradiction is machine-visible
  rather than buried in prose.

  All evidence snippets are quoted from cached abstracts, none from titles.

  Reading the full PMID:28388629 abstract during curation materially strengthened
  the case against this gene-disease relationship: the authors did not merely fail
  to replicate in mouse, they went back to the original human subjects and found a
  homozygous loss-of-function SNAP29 variant, concluding it may explain most or
  all of the neurodevelopmental phenotype. That competing variant is curated with
  supports REFUTE. If this entry is revisited, the question is not whether TUBA8
  is a weak cortical malformation gene but whether it is one at all.

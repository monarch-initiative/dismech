name: TUBA8-related Polymicrogyria with Optic Nerve Hypoplasia
creation_date: "2026-08-20T18:00:00Z"
category: Mendelian
description: >-
  TUBA8-related polymicrogyria with optic nerve hypoplasia (PMGOH) is curated
  here as a CONTESTED gene-disease relationship, and the contest is the point of
  the entry. In 2009 an autosomal recessive syndrome of generalized
  polymicrogyria with optic nerve hypoplasia was mapped by autozygosity to
  TUBA8, which encodes an atypical alpha-tubulin of unknown function. The
  mechanistic argument was elegant: TUBA8 uniquely lacks the lysine 40 residue
  whose acetylation regulates microtubule function during cortical neuron
  migration, and it has a distinctive expression pattern in the developing
  cerebral cortex.

  That relationship has since been substantially undercut, and by the original
  authors. A Tuba8 knockout mouse confirmed to lack Tuba8 protein did not display
  polymicrogyria and appeared neurologically normal. In response, the authors
  re-analysed the original human subjects by whole exome sequencing and found an
  additional homozygous loss-of-function mutation in SNAP29 - concluding that
  SNAP29 deficiency, rather than TUBA8 deficiency, may underlie most or all of
  the neurodevelopmental anomalies in those subjects. That is not a failure to
  replicate; it is a competing causal variant identified in the very family the
  gene-disease claim rests on. A companion study separately argued that Tuba8
  cannot substitute for Tuba1a in neuronal migration.

  Two qualifications keep this from being a clean retraction. Tuba8 does have
  demonstrable neurodevelopmental roles - it drives differentiation of cortical
  radial glia into apical intermediate progenitors by tuning tubulin C-terminal
  modifications - and in mouse brain it localises specifically to cerebellar
  Purkinje cells, which led the knockout authors to suggest the human variants
  might still affect or modify motor control. So the gene is not
  neurodevelopmentally inert; what is doubtful is that it causes this
  polymicrogyria syndrome.

  This entry therefore records the association without asserting it. It carries no
  disease_term, because binding a MONDO identifier would assert an entity whose
  gene-disease validity is unresolved, and the open discussion states exactly what
  evidence would settle it. It exists so that a curator meeting TUBA8 on a
  polymicrogyria panel finds the controversy rather than an apparent gap.
parents:
- congenital nervous system disorder
- disorder of development or morphogenesis

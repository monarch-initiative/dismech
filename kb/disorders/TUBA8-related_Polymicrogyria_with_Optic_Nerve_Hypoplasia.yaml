diagnosis:
- name: Exome-scale reanalysis including SNAP29
  description: >-
    A TUBA8 finding in a patient with PMG and optic nerve hypoplasia should not
    be treated as diagnostic. Exome-scale analysis must evaluate SNAP29 and
    other causes of cortical malformation; reanalysis of the founding subjects
    identified homozygous SNAP29 loss of function consistent with CEDNIK.
  evidence:
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In response to this finding, we re-analyzed the human PMG subjects using
      whole exome sequencing. This resulted in identification of an additional
      homozygous loss-of-function mutation in SNAP29
    explanation: >-
      Directly supports broad molecular reanalysis and explicit assessment of
      SNAP29 rather than diagnosis from the historical TUBA8 finding alone.
- name: Apply the ClinGen disputed validity classification
  description: >-
    Variant interpretation and panel reporting should state that the
    TUBA8-PMGOH relationship is disputed and that no valid supporting evidence
    remained in the 2023 expert-panel assessment.
  evidence:
  - reference: CGGV:assertion_9bd5681e-2a42-4bbb-be5f-dabe6efa5334-2023-12-19T170000.000Z
    reference_title: TUBA8 / polymicrogyria with optic nerve hypoplasia (Disputed)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      no valid evidence remains to support the claim
    explanation: >-
      Establishes the evidence-status warning required when interpreting a
      TUBA8 variant in this phenotype.
animal_models:
- name: Global Tuba8 exon-3 knockout mouse
  species: Mouse (Mus musculus)
  genotype: Homozygous deletion of Tuba8 exon 3 with nonsense-mediated transcript decay and absent Tuba8 protein
  publication: PMID:28388629
  description: >-
    A validated global Tuba8-null mouse developed normally, showed no
    polymicrogyria or cortical-layering defect, and appeared neurologically
    normal. It is the principal negative model for the proposed human cortical
    mechanism, although species differences and the distinction between a mouse
    null and the human hypomorphic splice allele limit complete refutation.
  evidence:
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mice were confirmed to lack Tuba8 protein in the testis, but
      did not display PMG and appeared to be neurologically normal.
    explanation: Defines the null model and its negative neurological phenotype.
  modeled_mechanisms:
  - target: Disrupted Cortical Development
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The null model fails to reproduce polymicrogyria or abnormal cortical
      development, weakening the proposed TUBA8-to-PMGOH mechanism.
    limitations: >-
      A negative mouse result cannot by itself exclude a human-specific effect,
      and the human allele retained some full-length transcript rather than
      being a proven null. The competing SNAP29 variant makes the negative model
      more probative but does not eliminate those cross-species limitations.
    evidence:
    - reference: PMID:28388629
      reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        No consistent differences in the embryonic cortex was detected between
        the control and knockout samples
      explanation: >-
        The embryonic cortical analysis did not reproduce the proposed human
        cortical-development defect.
- name: Purkinje-cell-specific Tuba8 conditional knockout mouse
  species: Mouse (Mus musculus)
  genotype: Pcp2-Cre/Tuba8fl/fl with Tuba8 ablated in Purkinje cells from P6
  publication: PMID:41105144
  description: >-
    This postnatal, cell-restricted knockout resolves a real Tuba8 function that
    the earlier global study did not detect: impaired Purkinje-cell dendrite
    development and maintenance, followed by age-dependent locomotor and
    anxiety-like changes. It supports a narrow cerebellar role but is not a
    model of PMG, optic nerve hypoplasia, the human splice allele, or the
    prenatal generalized cortical phenotype.
  evidence:
  - reference: PMID:41105144
    reference_title: TUBA8 promotes neuronal dendrite development through its 40th alanine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      With Pcp2-driven conditional knockout (cKO) of TUBA8 and TUBA4A in
      Purkinje cells, we found that loss of TUBA8 resulted in developmental
      defects in dendritic morphology and function
    explanation: Defines the conditional model and its principal neural result.
  modeled_mechanisms:
  - target: Reported Hypomorphic TUBA8 Splice Defect
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Purkinje-cell Tuba8 loss perturbs a genuine neural function of the gene,
      separating biological plausibility from evidence for the disputed human
      syndrome.
    limitations: >-
      The model deletes Tuba8 after birth in one cerebellar cell type; it neither
      carries the human hypomorphic splice allele nor tests prenatal cerebral
      cortical organization or optic nerve development.
    evidence:
    - reference: PMID:41105144
      reference_title: TUBA8 promotes neuronal dendrite development through its 40th alanine.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of TUBA8 in Purkinje cells induces global dendritic height defects
        in multiple lobules during development and aging.
      explanation: >-
        Demonstrates a Tuba8-dependent neural phenotype while remaining
        mechanistically remote from human PMGOH.
discussions:
- discussion_id: gap_tuba8_gene_disease_validity
  prompt: >-
    Is TUBA8 a genuine cause of polymicrogyria with optic nerve hypoplasia, or
    was the 2009 autozygosity finding a linked bystander?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reported Hypomorphic TUBA8 Splice Defect
  - pathophysiology#Competing Homozygous SNAP29 Loss of Function
  - pathophysiology#Disrupted Cortical Development
  rationale: >-
    ClinGen's 2023 Brain Malformations GCEP assessment is the controlling
    validity judgment: the TUBA8-PMGOH relationship is Disputed and no valid
    evidence remained to support it. The founding observation still deserves
    accurate representation. Two consanguineous Pakistani families, probably
    sharing an ancestral autozygous interval, carried the same molecularly
    hypomorphic TUBA8 splice variant, and TUBA8 has experimentally supported
    functions in radial-glial differentiation and Purkinje-cell dendrite
    development.

    Those observations do not establish the syndrome relationship. The 7.42-Mb
    autozygous interval contained more than TUBA8, and exome reanalysis found a
    homozygous SNAP29 frameshift that the original authors judged likely to
    explain most or all of the neurodevelopmental phenotype. A validated global
    Tuba8 knockout had no PMG or consistent cortical defect. The founding broad
    cortical expression pattern was not reproduced by later TUBA8-specific
    probes, which found very low expression during mouse and human neuronal
    migration. ClinGen also considered a fifth proband with compound
    heterozygous TUBA8 missense variants; that individual had epilepsy but no
    brain structural anomaly or optic nerve hypoplasia and therefore did not
    replicate PMGOH.

    The remaining question is narrow: whether independently ascertained,
    phenotypically concordant families without a competing cause could overturn
    the disputed classification, or whether TUBA8 only modifies particular
    neural functions while SNAP29 explains the founding syndrome. The MONDO
    disease identity is bound because the clinical entity exists; the TUBA8
    association remains Disputed and the entry is not a Tubulinopathies grouping
    member.
  proposed_experiments:
  - experiment_id: exp_tuba8_independent_family_ascertainment
    name: Ascertainment of additional biallelic TUBA8 families
    description: >-
      Query large polymicrogyria and cortical malformation sequencing cohorts for
      biallelic TUBA8 variants, and where found, assess segregation and phenotype
      concordance with the reported PMGOH syndrome.
    decision_criterion: >-
      Two or more unrelated families with biallelic TUBA8 variants and concordant
      polymicrogyria with optic nerve hypoplasia, no competing causal variant,
      convincing segregation, and variant-level functional evidence would
      materially support re-evaluation by ClinGen and reconsideration for the
      Tubulinopathies grouping. Continued absence across well-powered cohorts
      would reinforce the disputed classification.
    would_support:
    - pathophysiology#Reported Hypomorphic TUBA8 Splice Defect
  evidence:
  - reference: CGGV:assertion_9bd5681e-2a42-4bbb-be5f-dabe6efa5334-2023-12-19T170000.000Z
    reference_title: TUBA8 / polymicrogyria with optic nerve hypoplasia (Disputed)
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In summary, the evidence supporting the relationship between TUBA8 and
      autosomal recessive PMGOH has been disputed and no valid evidence remains
      to support the claim.
    explanation: >-
      The expert-panel synthesis establishes the current gene-disease validity
      state around which the knowledge gap is framed.
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By autozygosity mapping, we show that the molecular basis for this
      condition is mutation of the TUBA8 gene, encoding a variant alpha-tubulin of
      unknown function that is not susceptible to the lysine 40 acetylation that
      regulates microtubule function during cortical neuron migration.
    explanation: >-
      The case for the association, including the specific mechanistic
      hypothesis.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous mice were confirmed to lack Tuba8 protein in the testis, but
      did not display PMG and appeared to be neurologically normal.
    explanation: >-
      The negative brain phenotype in a confirmed protein-null animal, which is
      the strongest single piece of evidence against the association.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This resulted in identification of an additional homozygous
      loss-of-function mutation in SNAP29, suggesting that SNAP29 deficiency,
      rather than TUBA8 deficiency, may underlie most or all of the
      neurodevelopmental anomalies in these subjects.
    explanation: >-
      A competing causal variant identified in the founding family itself - the
      linked-bystander scenario confirmed rather than merely hypothesized.
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Nonetheless, in the mouse brain, Tuba8 specifically localised to the
      cerebellar Purkinje cells, suggesting that the human mutations may affect
      or modify motor control.
    explanation: >-
      The narrow residual case for a TUBA8 neurological contribution, offered by
      the same authors who undercut the primary claim.
  - reference: PMID:41105144
    reference_title: TUBA8 promotes neuronal dendrite development through its 40th alanine.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A previous study using in situ hybridization with an optimized Tuba8 RNA
      probe showed that a very low level of Tuba8 was expressed in the
      developing cerebral cortex and specifically localized in cerebellar
      Purkinje cells (Braun et al., 2010).
    explanation: >-
      Provides a quotable full-text restatement of the TUBA8-specific expression
      result that weakened the founding broad cortical-expression rationale.
  - reference: PMID:32097653
    reference_title: Tuba8 Drives Differentiation of Cortical Radial Glia into Apical Intermediate Progenitors by Tuning Modifications of Tubulin C Termini.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that the non-canonical tubulin Tuba8, transiently expressed in
      cortical progenitors, drives differentiation of RGs into apical
      intermediate progenitors, a more restricted progenitor type lacking
      attachment to the basal lamina.
    explanation: >-
      Shows Tuba8 does have a cortical developmental role - but a
      progenitor-differentiation one rather than the migration role the disease
      attribution would require.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md, which flagged TUBA8
  as a contested candidate that should be recorded rather than silently omitted.

  Review on 2026-08-26 found that ClinGen had already classified the exact
  TUBA8-polymicrogyria with optic nerve hypoplasia relationship as Disputed in
  2023. The entry now binds MONDO:0013172 because disease identity does not assert
  gene causality, records genetic[].relationship_type as DISPUTED, and exposes
  the expert-panel assertion structurally.

  NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure. Conformance would assert
  exactly the migration mechanism that the mouse knockout fails to support, so
  declaring it would import the disputed claim through the module layer.

  Molecular function and disease validity are kept separate. The founding TUBA8
  allele is a demonstrated hypomorphic splice defect, and newer models support
  radial-glial and Purkinje-cell functions, but none of that establishes PMGOH
  causality. Conversely, the competing SNAP29 variant and negative global mouse
  model are machine-visible rather than buried in prose. The central unresolved
  question is whether any independently ascertained, phenotypically concordant
  TUBA8 families without a second diagnosis exist.

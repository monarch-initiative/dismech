pathophysiology:
- name: Reported Hypomorphic TUBA8 Splice Defect
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    The reported allele is a homozygous 14-bp deletion in the intron-1 splice
    acceptor polypyrimidine tract. Patient lymphoblastoid cells retained a low
    level of full-length transcript, so the allele is hypomorphic rather than a
    proven null. Its molecular effect can be classified independently of the
    disputed disease attribution: partial loss of TUBA8 function is supported,
    but causation of PMGOH is not. TUBA8 is an unusual alpha-tubulin with alanine
    rather than the modifiable lysine found at position 40 in other isotypes.
    Later experiments confirm that this alanine contributes to Purkinje-cell
    dendrite development, but they do not demonstrate the generalized cortical
    migration failure proposed for PMGOH.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: intronic 14-bp splice-altering deletion
    description: >-
      A shared homozygous splice-altering deletion was reported in two
      consanguineous Pakistani families whose autozygous intervals indicated a
      likely common ancestral background. The allele reduced correctly spliced
      transcript but did not eliminate it. This molecular classification does
      not imply that the allele caused the subjects' PMGOH phenotype.
  genes:
  - preferred_term: TUBA8
    term:
      id: hgnc:12410
      label: TUBA8
  biological_processes:
  - preferred_term: microtubule cytoskeleton organization
    term:
      id: GO:0000226
      label: microtubule cytoskeleton organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously identified homozygous hypomorphic TUBA8 mutations in human
      subjects with a polymicrogyria (PMG) syndrome
    explanation: >-
      Establishes that the reported human TUBA8 allele was hypomorphic; this
      supports partial loss of molecular function, not PMGOH causality.
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By autozygosity mapping, we show that the molecular basis for this
      condition is mutation of the TUBA8 gene, encoding a variant alpha-tubulin of
      unknown function that is not susceptible to the lysine 40 acetylation that
      regulates microtubule function during cortical neuron migration.
    explanation: >-
      The founding genetic and mechanistic claim, including the distinctive
      absence of the lysine 40 acetylation site.
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Together with the unique expression pattern of TUBA8 within the developing
      cerebral cortex, these observations suggest a role for this atypical
      microtubule component in regulating mammalian brain development.
    explanation: >-
      The authors' own framing is that the observations SUGGEST a role - recorded
      as PARTIAL because a suggested role is not a demonstrated mechanism.
  - reference: PMID:41105144
    reference_title: TUBA8 promotes neuronal dendrite development through its 40th alanine.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of TUBA8 in Purkinje cells induces global dendritic height defects in
      multiple lobules during development and aging.
    explanation: >-
      Demonstrates a genuine cell-restricted neural function for TUBA8, but not
      generalized cortical polymicrogyria or human disease causality.
  - reference: PMID:32097653
    reference_title: Tuba8 Drives Differentiation of Cortical Radial Glia into Apical Intermediate Progenitors by Tuning Modifications of Tubulin C Termini.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show that the non-canonical tubulin Tuba8, transiently expressed in
      cortical progenitors, drives differentiation of RGs into apical
      intermediate progenitors, a more restricted progenitor type lacking
      attachment to the basal lamina.
    explanation: >-
      Reports a genuine cortical developmental role for Tuba8 - though a
      progenitor differentiation role, not the neuronal migration role the
      disease attribution assumes.
  downstream:
  - target: Disrupted Cortical Development
    description: >-
      Founding proposed consequence: partial TUBA8 loss was asserted to perturb
      cortical development and produce polymicrogyria. ClinGen now classifies
      that gene-disease link as disputed with no valid supporting evidence.
    evidence:
    - reference: PMID:19896110
      reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By autozygosity mapping, we show that the molecular basis for this
        condition is mutation of the TUBA8 gene
      explanation: The original paper's causal assertion for this edge.
    - reference: CGGV:assertion_9bd5681e-2a42-4bbb-be5f-dabe6efa5334-2023-12-19T170000.000Z
      reference_title: TUBA8 / polymicrogyria with optic nerve hypoplasia (Disputed)
      supports: REFUTE
      evidence_source: OTHER
      snippet: >-
        no valid evidence remains to support the claim
      explanation: >-
        ClinGen's expert review refutes treating the proposed TUBA8-to-PMGOH
        edge as established.
- name: Competing Homozygous SNAP29 Loss of Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Exome reanalysis of two founding subjects identified a homozygous SNAP29
    frameshift within the same autozygous interval. Biallelic SNAP29 loss causes
    CEDNIK syndrome and provides a direct competing explanation for most or all
    of the neurodevelopmental findings originally attributed to TUBA8.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: frameshift variant (c.487dupA; p.Ser163Lysfs*6)
    description: >-
      Homozygous SNAP29 frameshift identified by whole-exome reanalysis in two
      of the original TUBA8-mutated subjects.
  genes:
  - preferred_term: SNAP29
    term:
      id: hgnc:11133
      label: SNAP29
  evidence:
  - reference: PMID:28388629
    reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This resulted in identification of an additional homozygous
      loss-of-function mutation in SNAP29, suggesting that SNAP29 deficiency,
      rather than TUBA8 deficiency, may underlie most or all of the
      neurodevelopmental anomalies in these subjects.
    explanation: >-
      Directly establishes the competing biallelic SNAP29 finding and the
      original authors' revised causal interpretation.
  downstream:
  - target: Disrupted Cortical Development
    description: >-
      Competing explanation for the founding subjects' polymicrogyria and
      broader neurodevelopmental phenotype.
    evidence:
    - reference: PMID:28388629
      reference_title: A tubulin alpha 8 mouse knockout model indicates a likely role in spermatogenesis but not in brain development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This new data indicated that the PMG in our patients was likely to be
        due, in whole or in part, to the SNAP29 rather than the TUBA8 mutation.
      explanation: >-
        The full-text interpretation explicitly links the SNAP29 frameshift to
        the observed polymicrogyria.
- name: Disrupted Cortical Development
  biological_scale: TISSUE
  description: >-
    The reported tissue phenotype: generalized polymicrogyria - a cortex of
    normal thickness with excessive, abnormally small gyri - together with optic
    nerve hypoplasia. The combination is described as a recognizable syndrome.
    Whether it is caused by the TUBA8 variant is the open question this entry
    records; the phenotype itself is not in dispute.
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:19896110
    reference_title: Mutation of the variant alpha-tubulin TUBA8 results in polymicrogyria with optic nerve hypoplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a recognizable autosomal recessive syndrome,
      characterized by generalized polymicrogyria in association with optic nerve
      hypoplasia (PMGOH).
    explanation: Defines the reported clinical-radiological syndrome.
  downstream:
  - target: Polymicrogyria
    description: The cortical malformation.
  - target: Optic Nerve Hypoplasia
    description: The ocular component that names the syndrome.
  - target: Severe Global Developmental Delay
    description: The severe neurodevelopmental outcome in the founding cohort.
  - target: Neonatal Hypotonia
    description: Early low muscle tone reported in the syndrome.
  - target: Seizures
    description: Epileptic manifestations reported in the founding cohort.
  - target: Agenesis of Corpus Callosum
    description: Absent corpus callosum accompanying the PMG in most subjects.
  - target: Dysplastic Corpus Callosum
    description: Dysplastic corpus callosum in part of the reported spectrum.
  - target: Absent Speech
    description: Lack of speech accompanying the profound developmental impairment.
  - target: Hyporeflexia
    description: Reduced reflexes reported in the founding cohort.
  - target: Bilateral Tonic-Clonic Seizures
    description: A reported seizure subtype.
  - target: Infantile Spasms
    description: A reported early-life seizure subtype.
  - target: Brainstem Hypoplasia
    description: Hypoplastic and malformed brainstem in part of the syndrome.
  - target: Colpocephaly
    description: Ventricular configuration accompanying callosal agenesis.

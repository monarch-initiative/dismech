- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic hematopoietic stem cell transplantation is the only established
    curative therapy for PNH but carries substantial treatment-related morbidity
    and mortality, and is generally reserved for severe bone marrow failure or
    clonal evolution rather than uncomplicated complement-responsive hemolysis.
  treatment_term:
    preferred_term: Hematopoietic Cell Transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biology of PNH has been progressively elucidated in the past few years, but therapeutic strategies remained unsatisfactory for decades, the only exception being stem cell transplantation, which is restricted to selected patients and retains significant morbidity and mortality."
    explanation: >-
      Identifies stem cell transplantation as the only curative option, restricted

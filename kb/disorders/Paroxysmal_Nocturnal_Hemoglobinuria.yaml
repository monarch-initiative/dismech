- name: Iptacopan
  description: >-
    First-in-class oral factor B inhibitor of the alternative complement pathway.
    In phase 3 trials, iptacopan monotherapy improved hemoglobin and reduced
    transfusion dependence in both anti-C5-experienced and
    complement-inhibitor-naive PNH patients with persistent anemia.

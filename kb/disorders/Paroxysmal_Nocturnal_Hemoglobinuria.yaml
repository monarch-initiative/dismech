diagnosis:
- name: High-Sensitivity Flow Cytometry
  description: >-
    High-sensitivity multiparameter flow cytometry of peripheral blood is the
    diagnostic gold standard for PNH, demonstrating GPI-anchor-deficient cell
    populations across at least two blood cell lineages. Granulocyte and monocyte
    assays commonly combine fluorescent aerolysin (FLAER) with lineage markers,
    while red cell assays detect CD59 (and CD55) deficiency; granulocyte and
    monocyte clone sizes best estimate the underlying hematopoietic stem-cell clone.
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:40986193
    reference_title: "Pharmacological Therapies in Paroxysmal Nocturnal Haemoglobinuria: Focus on Complement Inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Flow cytometry is the preferred technique to diagnose PNH"
    explanation: >-
      Identifies flow cytometry as the preferred diagnostic technique for PNH.

inheritance:
- name: Somatic mosaicism (acquired clonal disorder, not inherited)
  inheritance_term:
    preferred_term: Somatic mosaicism
    term:
      id: HP:0001442
      label: Typified by somatic mosaicism
  description: >-
    PNH is an acquired clonal disorder, not a germline disease. A loss-of-function PIGA variant arises
    somatically in a single hematopoietic stem cell after birth and the mutant clone expands under
    selective pressure, so the variant is confined to the hematopoietic lineage and the patient is a
    somatic mosaic of GPI-deficient and normal blood cells. The disease is not transmitted to offspring.
  evidence:
  - reference: PMID:41002734
    reference_title: "Paroxysmal Nocturnal Hemoglobinuria: Unraveling Its Molecular Pathogenesis and Advancing Targeted Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paroxysmal nocturnal hemoglobinuria (PNH) is a rare, acquired clonal hematologic disorder caused by somatic mutations in the PIGA gene of hematopoietic stem cells, leading to the absence of GPI-anchored proteins, including the complement regulators CD55 and CD59."
    explanation: Defines PNH as an acquired clonal disorder from a somatic stem-cell mutation, which is the hematopoietic form of somatic mosaicism.
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant, likely immune-mediated, selective pressure."
    explanation: Identifies the acquired somatic origin of the PIGA lesion and the clonal expansion that produces the mosaic blood compartment.
genetic:
- name: PIGA Somatic Mutation
  gene_term:
    preferred_term: PIGA
    term:
      id: hgnc:8957
      label: PIGA
  association: Somatic Loss-of-Function Variants
  relationship_type: CAUSATIVE
  features: >-
    Acquired somatic loss-of-function mutations in the X-linked PIGA gene within a
    hematopoietic stem cell are the invariable cause of PNH. Because PIGA is on the
    X chromosome and only one allele is active per cell, a single inactivating
    mutation abolishes GPI-anchor biosynthesis. Mutations are diverse (frameshift,
    nonsense, missense, splice) and distributed throughout the gene, and are somatic
    rather than germline, so PNH is not inherited.
  frequency: OBLIGATE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:41002734
    reference_title: "Paroxysmal Nocturnal Hemoglobinuria: Unraveling Its Molecular Pathogenesis and Advancing Targeted Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paroxysmal nocturnal hemoglobinuria (PNH) is a rare, acquired clonal hematologic disorder caused by somatic mutations in the PIGA gene of hematopoietic stem cells, leading to the absence of GPI-anchored proteins, including the complement regulators CD55 and CD59."
    explanation: >-
      Confirms somatic PIGA mutation in hematopoietic stem cells as the cause of
      GPI-anchor and CD55/CD59 deficiency.
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant, likely immune-mediated, selective pressure."
    explanation: >-
      Establishes the acquired, X-linked, somatic nature of the causative PIGA
      mutation.
  - reference: ORPHA:447
    reference_title: "Paroxysmal nocturnal hemoglobinuria"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "| PIGA | phosphatidylinositol glycan anchor biosynthesis class A | hgnc:8957 | Disease-causing somatic mutation(s) in |"
    explanation: Orphanet classifies somatic PIGA mutations as disease-causing in paroxysmal nocturnal hemoglobinuria.

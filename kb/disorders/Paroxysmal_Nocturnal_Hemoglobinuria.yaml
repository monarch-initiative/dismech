name: Paroxysmal Nocturnal Hemoglobinuria
creation_date: "2026-07-24T00:00:00Z"
category: Hematologic
parents:
- Hematologic Disease
- Complement Disorder
disease_term:
  preferred_term: Paroxysmal Nocturnal Hemoglobinuria
  term:
    id: MONDO:0100244
    label: paroxysmal nocturnal hemoglobinuria
description: >-
  Paroxysmal nocturnal hemoglobinuria (PNH) is a rare, acquired clonal
  hematopoietic stem cell disorder caused by somatic loss-of-function mutations in
  the X-linked PIGA gene, which encodes an enzyme required for the first step of
  glycosylphosphatidylinositol (GPI) anchor biosynthesis. Loss of GPI-anchor
  assembly renders affected blood cells deficient in the GPI-anchored
  complement-regulatory proteins CD55 (decay-accelerating factor) and CD59
  (membrane inhibitor of reactive lysis). Without these regulators, red cells are
  susceptible to complement-mediated intravascular hemolysis, producing chronic
  hemolytic anemia, hemoglobinuria, disabling fatigue, smooth-muscle dystonia
  (dysphagia, abdominal pain, erectile dysfunction) from nitric-oxide depletion by
  cell-free hemoglobin, and a markedly increased risk of thrombosis, which is the
  leading cause of death. PNH characteristically arises in the setting of bone
  marrow failure, and clonal expansion of the PIGA-mutant stem cell is required for
  clinically significant disease. Diagnosis is established by high-sensitivity flow
  cytometry demonstrating GPI-anchor-deficient blood cell populations, and terminal
  complement inhibitors (eculizumab, ravulizumab) and proximal complement
  inhibitors (pegcetacoplan, iptacopan, danicopan) have transformed prognosis.
pathophysiology:
- name: PIGA Mutation and GPI-Anchor Deficiency
  description: >-
    PNH originates from an acquired somatic loss-of-function mutation in the
    X-linked PIGA gene in a hematopoietic stem cell. PIGA encodes a subunit of the
    enzyme complex that catalyzes the first committed step of GPI-anchor
    biosynthesis. Because PIGA is X-linked and only one allele is active per cell, a
    single inactivating mutation abolishes GPI-anchor assembly, and
    GPI-anchor-deficient progeny cannot display the roughly 150 GPI-linked surface
    proteins, including the complement regulators CD55 and CD59.
  genes:
  - preferred_term: PIGA
    term:
      id: hgnc:8957
      label: PIGA
  cell_types:
  - preferred_term: Hematopoietic Stem Cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: GPI Anchor Biosynthetic Process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Loss of CD55 and CD59 Complement Regulation
    description: >-
      Loss of GPI-anchor assembly removes the GPI-linked complement regulators
      CD55 and CD59 from the blood cell surface.
  - target: Clonal Expansion and Bone Marrow Failure
    description: >-
      The PIGA-mutant hematopoietic stem cell undergoes clonal expansion under
      immune-mediated selective pressure, producing the GPI-deficient blood cell
      population responsible for clinical disease.
  evidence:
  - reference: PMID:35154088
    reference_title: "Insights Into the Emergence of Paroxysmal Nocturnal Hemoglobinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PNH patients develop somatic loss-of-function mutations in phosphatidylinositol N-acetylglucosaminyltransferase subunit A gene (PIGA), required for the biosynthesis of glycosylphosphatidylinositol (GPI) anchors."
    explanation: >-
      Establishes that PNH is caused by acquired somatic PIGA loss-of-function
      mutations that block GPI-anchor biosynthesis.
  - reference: PMID:35154088
    reference_title: "Insights Into the Emergence of Paroxysmal Nocturnal Hemoglobinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ubiquitous in eukaryotes, GPI anchors are a group of conserved glycolipid molecules responsible for attaching nearly 150 distinct proteins to the surface of cell membranes."
    explanation: >-
      Documents that GPI anchors attach ~150 surface proteins, so their loss
      strips many GPI-linked proteins including complement regulators.
- name: Loss of CD55 and CD59 Complement Regulation
  description: >-
    CD55 (decay-accelerating factor) accelerates decay of the C3 and C5
    convertases, while CD59 (membrane inhibitor of reactive lysis) blocks assembly
    of the terminal C5b-9 membrane attack complex. Their absence on PNH
    erythrocytes permits unrestrained amplification of the alternative complement
    pathway on the cell surface and unchecked membrane attack complex formation.
  biological_processes:
  - preferred_term: Regulation of Complement Activation
    term:
      id: GO:0030449
      label: regulation of complement activation
    modifier: DECREASED
  - preferred_term: Complement Activation, Alternative Pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: INCREASED
  downstream:
  - target: Complement-Mediated Intravascular Hemolysis
    description: >-
      Unopposed membrane attack complex assembly lyses erythrocytes within the
      circulation.
  evidence:
  - reference: PMID:35154088
    reference_title: "Insights Into the Emergence of Paroxysmal Nocturnal Hemoglobinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of two GPI-anchored surface proteins, CD55 and CD59, from red blood cells causes unregulated complement activation and hemolysis in classical PNH disease."
    explanation: >-
      Directly links loss of the GPI-anchored regulators CD55 and CD59 to
      unregulated complement activation and hemolysis.
  - reference: PMID:39273426
    reference_title: "Navigating the Complement Pathway to Optimize PNH Treatment with Pegcetacoplan and Other Currently Approved Complement Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation of the phosphatidylinositol glycan biosynthesis class A (PIGA) gene prevents the expression of cell-surface proteins, including the complement regulatory proteins CD55 and CD59."
    explanation: >-
      Confirms that PIGA mutation removes the complement regulatory proteins CD55
      and CD59 from the cell surface.
- name: Complement-Mediated Intravascular Hemolysis
  description: >-
    Deposition of the terminal membrane attack complex on
    complement-regulator-deficient erythrocytes causes intravascular hemolysis
    with release of cell-free hemoglobin and hemoglobinuria. Chronic
    complement-mediated destruction produces
    anemia, elevated lactate dehydrogenase, reduced haptoglobin, and reticulocytosis.
  cell_types:
  - preferred_term: Erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: Complement-Dependent Cytotoxicity
    term:
      id: GO:0097278
      label: complement-dependent cytotoxicity
    modifier: INCREASED
  downstream:
  - target: Nitric Oxide Depletion and Smooth Muscle Dystonia
    description: >-
      Cell-free hemoglobin released during intravascular hemolysis scavenges nitric
      oxide, producing smooth muscle dysfunction and contributing to thrombosis.
  - target: Hemolytic Anemia
    description: Chronic destruction of erythrocytes produces hemolytic anemia.
  - target: Hemoglobinuria
    description: Release of hemoglobin into plasma leads to hemoglobinuria.
  - target: Elevated Lactate Dehydrogenase
    description: Erythrocyte lysis releases lactate dehydrogenase into the circulation.
  - target: Fatigue
    description: Anemia and nitric-oxide depletion produce disabling fatigue.
  - target: Dyspnea
    description: Anemia and hemolysis contribute to exertional dyspnea.
  - target: Renal Insufficiency
    description: >-
      Filtration and tubular deposition of cell-free hemoglobin impair renal
      function.
  evidence:
  - reference: PMID:39371251
    reference_title: "Paroxysmal Nocturnal Hemoglobinuria, Pathophysiology, Diagnostics, and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paroxysmal nocturnal hemoglobinuria (PNH) is characterized by intravascular hemolysis (IVH) due to diminished or absent inhibition of the complement system because of deficient expression of cell-anchored complement regulating surface proteins."
    explanation: >-
      Confirms intravascular hemolysis driven by deficient complement regulation as
      the central mechanism.
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is characterized by complement-mediated chronic intravascular hemolysis, resulting in hemolytic anemia and hemosiderinuria; capricious exacerbations lead to recurrent gross hemoglobinuria."
    explanation: >-
      Links complement-mediated intravascular hemolysis to hemolytic anemia and
      episodic gross hemoglobinuria.
- name: Nitric Oxide Depletion and Smooth Muscle Dystonia
  description: >-
    Cell-free plasma hemoglobin released during intravascular hemolysis scavenges
    nitric oxide. Regional nitric-oxide deficiency causes smooth-muscle dystonia
    manifesting as dysphagia, esophageal spasm, abdominal pain, and erectile
    dysfunction, and contributes to platelet activation and the prothrombotic state.
  biological_processes:
  - preferred_term: Nitric Oxide Metabolic Process
    term:
      id: GO:0046209
      label: nitric oxide metabolic process
    modifier: DECREASED
  downstream:
  - target: Prothrombotic State
    description: >-
      Nitric-oxide depletion promotes platelet activation and vasoconstriction,
      reinforcing the prothrombotic state.
  - target: Abdominal Pain
    description: Smooth-muscle dystonia from nitric-oxide depletion causes abdominal pain.
  - target: Dysphagia
    description: Esophageal smooth-muscle dystonia from nitric-oxide depletion causes dysphagia.
  evidence:
  - reference: PMID:39273426
    reference_title: "Navigating the Complement Pathway to Optimize PNH Treatment with Pegcetacoplan and Other Currently Approved Complement Inhibitors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With decreased or a lack of CD55 and CD59 expression on their membranes, PNH red blood cells become susceptible to complement-mediated hemolysis (symptoms of which include anemia, dysphagia, abdominal pain, and fatigue), leading to thrombosis."
    explanation: >-
      Documents the smooth-muscle dystonia symptom cluster (dysphagia, abdominal
      pain) alongside anemia and fatigue arising from complement-mediated hemolysis.
- name: Prothrombotic State
  description: >-
    Thrombosis is the leading cause of death in PNH and characteristically occurs
    at unusual sites such as the hepatic (Budd-Chiari syndrome), portal, mesenteric,
    and cerebral veins. Complement-mediated platelet activation, nitric-oxide
    depletion, release of prothrombotic microparticles, and impaired fibrinolysis
    all contribute.
  biological_processes:
  - preferred_term: Platelet Activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: INCREASED
  - preferred_term: Blood Coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  downstream:
  - target: Venous Thrombosis
    description: >-
      The prothrombotic state manifests clinically as venous thrombosis, often at
      unusual sites.
  evidence:
  - reference: PMID:40986193
    reference_title: "Pharmacological Therapies in Paroxysmal Nocturnal Haemoglobinuria: Focus on Complement Inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These agents significantly modify the natural history of the disease by reducing the risk of thrombosis, the most lethal complication of PNH, as well as reducing transfusion dependence and improving renal function, quality of life and probably, survival."
    explanation: >-
      Identifies thrombosis as the most lethal complication of PNH, supporting its
      central role in the prothrombotic state.
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional cardinal manifestations of PNH are a variable degree of bone marrow failure and an intrinsic propensity to thromboembolic events."
    explanation: >-
      Documents the intrinsic propensity to thromboembolic events as a cardinal
      manifestation of PNH.
- name: Clonal Expansion and Bone Marrow Failure
  description: >-
    PNH clones arise in the setting of bone marrow failure and are closely linked
    to aplastic anemia. A prevailing model holds that immune-mediated selective
    pressure against normal GPI-positive hematopoietic stem cells provides a
    relative survival advantage to GPI-deficient PIGA-mutant clones, allowing their
    expansion to clinically significant size.
  cell_types:
  - preferred_term: Hematopoietic Stem Cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: Hematopoietic Stem Cell Proliferation
    term:
      id: GO:0071425
      label: hematopoietic stem cell proliferation
    modifier: DYSREGULATED
  downstream:
  - target: Pancytopenia
    description: >-
      Bone marrow failure underlying the PNH clone produces reduction of all blood
      cell lineages.
  - target: Aplastic Anemia
    description: >-
      PNH clones characteristically emerge in the setting of aplastic anemia.
  evidence:
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant, likely immune-mediated, selective pressure."
    explanation: >-
      Supports immune-mediated selective pressure driving clonal expansion of
      PIGA-mutant hematopoietic stem cells.
  - reference: PMID:35154088
    reference_title: "Insights Into the Emergence of Paroxysmal Nocturnal Hemoglobinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In PNH patients, PIGA-mutant, GPI (-) hematopoietic cells clonally expand to make up a large portion of patients' blood production, yet mechanisms leading to clonal expansion of GPI (-) cells remain enigmatic."
    explanation: >-
      Confirms that PIGA-mutant GPI-deficient cells clonally expand to dominate
      hematopoiesis in PNH patients.

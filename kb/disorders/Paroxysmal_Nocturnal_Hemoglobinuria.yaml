name: Paroxysmal Nocturnal Hemoglobinuria
creation_date: "2026-07-24T00:00:00Z"
updated_date: "2026-07-24T00:00:00Z"
category: Hematologic
parents:
- Hematologic Disease
- Complement Disorder
disease_term:
  preferred_term: Paroxysmal Nocturnal Hemoglobinuria
  term:
    id: MONDO:0100244
    label: paroxysmal nocturnal hemoglobinuria
description: >-
  Paroxysmal nocturnal hemoglobinuria (PNH) is an acquired clonal hematopoietic
  stem cell disorder caused by somatic loss-of-function mutations in the X-linked
  PIGA gene, which encodes an enzyme required for the first step of
  glycosylphosphatidylinositol (GPI) anchor biosynthesis. Loss of GPI-anchor
  assembly renders affected blood cells deficient in the GPI-anchored
  complement-regulatory proteins CD55 (decay-accelerating factor) and CD59
  (membrane inhibitor of reactive lysis). Without these regulators, red cells are
  exquisitely sensitive to complement-mediated intravascular hemolysis, producing
  chronic hemolytic anemia, hemoglobinuria, disabling fatigue, smooth-muscle
  dystonia (dysphagia, abdominal pain, erectile dysfunction) from nitric-oxide
  depletion by cell-free hemoglobin, and a markedly increased risk of thrombosis,
  which is the leading cause of death. PNH characteristically arises in the setting
  of bone marrow failure, and clonal expansion of the PIGA-mutant stem cell is
  required for clinically significant disease. Diagnosis is established by flow
  cytometry demonstrating GPI-anchor-deficient blood cell populations, and terminal
  complement inhibitors (eculizumab, ravulizumab) and proximal complement
  inhibitors (pegcetacoplan, iptacopan) have transformed prognosis.
pathophysiology:
- name: PIGA Mutation and GPI-Anchor Deficiency
  description: >-
    PNH originates from an acquired somatic loss-of-function mutation in the
    X-linked PIGA gene in a hematopoietic stem cell. PIGA encodes the catalytic
    subunit of the GPI-N-acetylglucosaminyltransferase complex that catalyzes the
    first committed step of GPI-anchor biosynthesis. Because PIGA is X-linked and
    subject to X-inactivation, a single inactivating mutation abolishes GPI-anchor
    assembly in male and female cells alike. GPI-anchor-deficient progeny cannot
    display the roughly two dozen GPI-linked surface proteins, including the
    complement regulators CD55 and CD59.
  cell_types:
  - preferred_term: Hematopoietic Stem Cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: GPI Anchor Biosynthetic Process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Complement-Mediated Intravascular Hemolysis
    description: >-
      Loss of surface CD55 and CD59 leaves erythrocytes unprotected against
      autologous complement.
- name: Loss of CD55 and CD59 Complement Regulation
  description: >-
    CD55 (decay-accelerating factor) accelerates decay of the C3 and C5
    convertases, while CD59 (membrane inhibitor of reactive lysis) blocks assembly
    of the terminal C5b-9 membrane attack complex. Their absence on PNH
    erythrocytes permits unrestrained amplification of the alternative complement
    pathway on the cell surface and unchecked membrane attack complex formation.
  biological_processes:
  - preferred_term: Regulation of Complement Activation
    term:
      id: GO:0030449
      label: regulation of complement activation
    modifier: DECREASED
  - preferred_term: Complement Activation, Alternative Pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: INCREASED
  downstream:
  - target: Complement-Mediated Intravascular Hemolysis
    description: >-
      Unopposed membrane attack complex assembly lyses erythrocytes within the
      circulation.
- name: Complement-Mediated Intravascular Hemolysis
  description: >-
    Deposition of the terminal membrane attack complex on complement-regulator-
    deficient erythrocytes causes intravascular hemolysis with release of cell-free
    hemoglobin and hemoglobinuria. Chronic complement-mediated destruction produces
    anemia, elevated lactate dehydrogenase, reduced haptoglobin, and reticulocytosis.
  cell_types:
  - preferred_term: Erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  biological_processes:
  - preferred_term: Complement-Dependent Cytotoxicity
    term:
      id: GO:0097278
      label: complement-dependent cytotoxicity
    modifier: INCREASED
  downstream:
  - target: Nitric Oxide Depletion and Smooth Muscle Dystonia
    description: >-
      Cell-free hemoglobin scavenges nitric oxide, producing smooth muscle
      dysfunction and contributing to thrombosis.
- name: Nitric Oxide Depletion and Smooth Muscle Dystonia
  description: >-
    Cell-free plasma hemoglobin released during intravascular hemolysis avidly
    scavenges nitric oxide, and released arginase depletes L-arginine. Regional
    nitric-oxide deficiency causes smooth-muscle dystonia manifesting as dysphagia,
    esophageal spasm, abdominal pain, and erectile dysfunction, and contributes to
    platelet activation and the prothrombotic state.
  biological_processes:
  - preferred_term: Nitric Oxide Metabolic Process
    term:
      id: GO:0046209
      label: nitric oxide metabolic process
    modifier: DECREASED
- name: Prothrombotic State
  description: >-
    Thrombosis is the leading cause of death in PNH and characteristically occurs
    at unusual sites such as the hepatic (Budd-Chiari syndrome), portal, mesenteric,
    and cerebral veins. Complement-mediated platelet activation, nitric-oxide
    depletion, release of prothrombotic microparticles, and impaired fibrinolysis
    all contribute.
  biological_processes:
  - preferred_term: Platelet Activation
    term:
      id: GO:0030168
      label: platelet activation
    modifier: INCREASED
  - preferred_term: Blood Coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
- name: Clonal Expansion and Bone Marrow Failure
  description: >-
    PNH clones arise in the setting of bone marrow failure and are closely linked
    to aplastic anemia. A prevailing model holds that immune-mediated attack on
    normal GPI-positive hematopoietic stem cells provides a relative survival
    advantage to GPI-deficient PIGA-mutant clones, allowing their expansion to
    clinically significant size.
  cell_types:
  - preferred_term: Hematopoietic Stem Cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: Hematopoietic Stem Cell Proliferation
    term:
      id: GO:0071425
      label: hematopoietic stem cell proliferation
    modifier: DYSREGULATED
phenotypes:
- name: Hemoglobinuria
  category: Clinical
  description: >-
    Passage of hemoglobin in the urine from intravascular hemolysis, classically
    producing dark or cola-colored urine that is most concentrated in the morning.
  phenotype_term:
    preferred_term: Hemoglobinuria
    term:
      id: HP:0003641
      label: Hemoglobinuria
  frequency: FREQUENT
- name: Hemolytic Anemia
  category: Clinical
  description: >-
    Chronic complement-mediated intravascular hemolysis produces anemia with
    reticulocytosis, elevated lactate dehydrogenase, and reduced haptoglobin.
  phenotype_term:
    preferred_term: Hemolytic Anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  frequency: VERY_FREQUENT
- name: Venous Thrombosis
  category: Clinical
  description: >-
    Thrombosis, often at unusual sites such as hepatic, portal, mesenteric, and
    cerebral veins, is the leading cause of death in PNH.
  phenotype_term:
    preferred_term: Venous Thrombosis
    term:
      id: HP:0004936
      label: Venous thrombosis
  frequency: FREQUENT
- name: Fatigue
  category: Clinical
  description: >-
    Disabling fatigue disproportionate to the degree of anemia, related to chronic
    hemolysis and nitric-oxide depletion.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  frequency: VERY_FREQUENT
- name: Abdominal Pain
  category: Clinical
  description: >-
    Recurrent abdominal pain attributed to smooth-muscle dystonia from
    nitric-oxide depletion and to mesenteric venous thrombosis.
  phenotype_term:
    preferred_term: Abdominal Pain
    term:
      id: HP:0002027
      label: Abdominal pain
  frequency: FREQUENT
- name: Dysphagia
  category: Clinical
  description: >-
    Difficulty swallowing and esophageal spasm from smooth-muscle dystonia
    secondary to nitric-oxide scavenging by cell-free hemoglobin.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  frequency: OCCASIONAL
- name: Erectile Dysfunction
  category: Clinical
  description: >-
    Erectile dysfunction in men related to episodic nitric-oxide depletion during
    hemolytic paroxysms.
  phenotype_term:
    preferred_term: Erectile Dysfunction
    term:
      id: HP:0100639
      label: Erectile dysfunction
  frequency: OCCASIONAL
- name: Pancytopenia
  category: Clinical
  description: >-
    Reduction of all three blood cell lineages reflecting the associated bone
    marrow failure in which many PNH clones arise.
  phenotype_term:
    preferred_term: Pancytopenia
    term:
      id: HP:0001876
      label: Pancytopenia
  frequency: OCCASIONAL
- name: Aplastic Anemia
  category: Clinical
  description: >-
    PNH is closely associated with aplastic anemia and other bone marrow failure
    syndromes, in which GPI-deficient clones expand.
  phenotype_term:
    preferred_term: Aplastic Anemia
    term:
      id: HP:0001915
      label: Aplastic anemia
  frequency: OCCASIONAL
genetic:
- name: PIGA Somatic Mutation
  gene_term:
    preferred_term: PIGA
    term:
      id: HGNC:8957
      label: PIGA
  features: >-
    Acquired somatic loss-of-function mutations in the X-linked PIGA gene within a
    hematopoietic stem cell are the invariable cause of PNH. Because PIGA is on the
    X chromosome and only one allele is active per cell (male hemizygosity or
    female X-inactivation), a single inactivating mutation abolishes GPI-anchor
    biosynthesis. Mutations are diverse (frameshift, nonsense, missense, splice)
    and distributed throughout the gene.
  frequency: OBLIGATE
  evidence: []
treatments:
- name: Eculizumab
  description: >-
    Humanized monoclonal antibody against complement component C5 that blocks
    cleavage to C5a and C5b, preventing membrane attack complex formation and
    terminal complement-mediated intravascular hemolysis. First disease-modifying
    therapy for PNH, reducing hemolysis, transfusion requirements, and thrombotic
    risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
- name: Ravulizumab
  description: >-
    Long-acting anti-C5 monoclonal antibody engineered from eculizumab with an
    every-8-week dosing interval, providing non-inferior control of intravascular
    hemolysis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ravulizumab
      term:
        id: NCIT:C124657
        label: Ravulizumab
- name: Pegcetacoplan
  description: >-
    Pegylated C3-targeted peptide inhibitor that acts proximally in the complement
    cascade, controlling both intravascular and extravascular hemolysis and
    improving hemoglobin in patients with residual anemia on C5 inhibitors.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pegcetacoplan
      term:
        id: NCIT:C158228
        label: Pegcetacoplan

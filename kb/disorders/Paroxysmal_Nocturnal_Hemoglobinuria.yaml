  presence: INCREASED
  biomarker_term:
    preferred_term: Lactate Dehydrogenase
    term:
      id: NCIT:C25184
      label: Lactate Dehydrogenase
  context: >-
    Elevated serum lactate dehydrogenase (LDH) is a hallmark biochemical marker of
    intravascular hemolysis in PNH and is used to gauge hemolytic activity;
    untreated hemolytic PNH patients characteristically have LDH more than 1.5
    times the upper limit of normal.
  evidence:
  - reference: PMID:38477987
    reference_title: "Oral Iptacopan Monotherapy in Paroxysmal Nocturnal Hemoglobinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients who had not received complement inhibitors and who had lactate dehydrogenase (LDH) levels more than 1.5 times the upper limit of the normal range received iptacopan."
    explanation: >-
      Documents that untreated PNH patients characteristically have LDH more than
      1.5 times the upper limit of normal, reflecting intravascular hemolysis.
notes: >-
  No ClinGen gene-disease validity assertion exists for somatic PIGA in
  paroxysmal nocturnal hemoglobinuria (MONDO:0100244); ClinGen's PIGA curation
  covers germline X-linked neurodevelopmental disease (MONDO:0100038). No
  dedicated GeneReviews chapter covers acquired paroxysmal nocturnal
  hemoglobinuria.

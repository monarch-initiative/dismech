        id: NCIT:C48386
        label: Eculizumab
  target_mechanisms:
  - target: Complement-Mediated Intravascular Hemolysis
    treatment_effect: INHIBITS
    description: >-
      Terminal C5 blockade prevents membrane attack complex assembly on
      CD59-deficient erythrocytes and inhibits intravascular hemolysis.

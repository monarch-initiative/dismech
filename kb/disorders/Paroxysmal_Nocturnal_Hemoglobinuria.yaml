genetic:
- name: PIGA Somatic Mutation
  gene_term:
    preferred_term: PIGA
    term:
      id: hgnc:8957
      label: PIGA
  features: >-
    Acquired somatic loss-of-function mutations in the X-linked PIGA gene within a
    hematopoietic stem cell are the invariable cause of PNH. Because PIGA is on the
    X chromosome and only one allele is active per cell, a single inactivating
    mutation abolishes GPI-anchor biosynthesis. Mutations are diverse (frameshift,
    nonsense, missense, splice) and distributed throughout the gene, and are somatic
    rather than germline, so PNH is not inherited.
  frequency: OBLIGATE
  evidence:
  - reference: PMID:41002734
    reference_title: "Paroxysmal Nocturnal Hemoglobinuria: Unraveling Its Molecular Pathogenesis and Advancing Targeted Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Paroxysmal nocturnal hemoglobinuria (PNH) is a rare, acquired clonal hematologic disorder caused by somatic mutations in the PIGA gene of hematopoietic stem cells, leading to the absence of GPI-anchored proteins, including the complement regulators CD55 and CD59."
    explanation: >-
      Confirms somatic PIGA mutation in hematopoietic stem cells as the cause of
      GPI-anchor and CD55/CD59 deficiency.
  - reference: PMID:19707355
    reference_title: "Paroxysmal nocturnal hemoglobinuria: pathophysiology, natural history and treatment options in the era of biological agents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This defect arises from an acquired somatic mutation in the X-linked phosphatidylinositol glycan class A gene, with subsequent clonal expansion of the mutated HSCs as a result of a concomitant, likely immune-mediated, selective pressure."
    explanation: >-
      Establishes the acquired, X-linked, somatic nature of the causative PIGA
      mutation.
treatments:
- name: Eculizumab
  description: >-
    Humanized monoclonal antibody against complement component C5 that blocks
    cleavage to C5a and C5b, preventing membrane attack complex formation and
    terminal complement-mediated intravascular hemolysis. First disease-modifying
    therapy for PNH, reducing hemolysis, transfusion requirements, and thrombotic
    risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eculizumab
      term:
        id: NCIT:C48386
        label: Eculizumab
  evidence:
  - reference: PMID:38622956
    reference_title: "Complement inhibition in paroxysmal nocturnal hemoglobinuria: From biology to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The anti-C5 monoclonal antibody eculizumab was the first treatment to improve hemolysis, thrombotic risk, and survival in PNH although at the price of a life-long intravenous fortnightly drug."
    explanation: >-
      Establishes eculizumab as the first anti-C5 therapy improving hemolysis,
      thrombotic risk, and survival in PNH.
  - reference: PMID:41002734
    reference_title: "Paroxysmal Nocturnal Hemoglobinuria: Unraveling Its Molecular Pathogenesis and Advancing Targeted Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eculizumab, the first approved C5 inhibitor, significantly reduced thrombotic risk and improved survival but did not eliminate anemia due to extravascular hemolysis."
    explanation: >-
      Confirms eculizumab reduces thrombotic risk and improves survival, while
      noting residual extravascular hemolysis.
- name: Ravulizumab
  description: >-
    Long-acting anti-C5 monoclonal antibody engineered from eculizumab with an
    every-8-week dosing interval, providing non-inferior control of intravascular
    hemolysis with reduced pharmacokinetic breakthrough hemolysis.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ravulizumab
      term:
        id: NCIT:C124657
        label: Ravulizumab
  evidence:
  - reference: PMID:38622956
    reference_title: "Complement inhibition in paroxysmal nocturnal hemoglobinuria: From biology to therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ravulizumab, a longer half-life anti-C5 developed from eculizumab, administered every 8 weeks, improved patient convenience, and reduced pharmacokinetic breakthrough hemolysis (BTH) by establishing more stable anti-C5 concentrations."
    explanation: >-
      Documents ravulizumab as a long-acting anti-C5 with every-8-week dosing and
      reduced breakthrough hemolysis.
- name: Pegcetacoplan
  description: >-
    Pegylated C3-targeted peptide inhibitor that acts proximally in the complement

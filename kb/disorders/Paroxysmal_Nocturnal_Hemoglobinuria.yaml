    snippet: "In the first trial, 51 of the 60 patients who received iptacopan had an increase in the hemoglobin level of at least 2 g per deciliter from baseline, and 42 had a hemoglobin level of at least 12 g per deciliter, each without transfusion; none of the 35 anti-C5-treated patients attained the end-point levels."
    explanation: >-

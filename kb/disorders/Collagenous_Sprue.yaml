      label: lamina propria
  evidence:
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased numbers of plasma cells, neutrophils and/or eosinophils can be present in the lamina propria."
    explanation: >-
      Names the lamina propria infiltrate curated on this node, in a review of the
      collagenous sprue literature written by the authors of a dedicated case series.
  - reference: PMID:19641452
    reference_title: "Collagenous sprue: a clinicopathologic study of 12 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Small intestinal biopsies showed subepithelial collagen deposition with varying degrees of villous atrophy and varying numbers of intraepithelial lymphocytes."
    explanation: >-
      Twelve-case series reporting intraepithelial lymphocytosis in collagenous sprue
      biopsies directly, rather than in a sibling collagenous disease.
  - reference: PMID:19641452
    reference_title: "Collagenous sprue: a clinicopathologic study of 12 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clonal T-cell populations were identified in 5 of 6 cases tested."
    explanation: >-
      Supports a T-cell-driven process in collagenous sprue; note the same series found
      no lymphoma on follow-up, so clonality here is not itself a malignancy finding.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the 6-TG metabolites is 6-thioguanine-triphosphate, which is part of the 6-thioguaninenucleotides (6-TGN), and induces T-cell apoptosis, using a mitochondrial pathway"
    explanation: >-
      The authors' stated rationale for treating collagenous sprue with thioguanine.
      Graded INDIRECT: the mechanism is the drug's, and the inference that T cells drive
      the disease follows from the clinical response rather than from a measurement.
- name: Subepithelial collagen deposition with entrapment of lamina propria elements
  description: >-
    The defining lesion is a thickened band of collagen beneath the surface epithelium
    of the small bowel, confirmed as collagen by histochemical and ultrastructural
    study, which entraps capillaries, inflammatory cells and fibroblasts. Band
    thickness varies widely between cases and does not track symptom severity. The
    cellular and molecular drivers of the deposition — the fibroblast or myofibroblast
    population responsible, and the balance of collagen synthesis against matrix
    turnover — have not been characterized in collagenous sprue itself; see the
    `fibrogenic_mediators_uncharacterized` discussion.
  cell_types:

  - reference: PMID:35945664
    reference_title: The histological spectrum of ARB-induced gastritis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Following drug cessation, symptomatic improvement occurred in all 11 cases for which follow-up data were available. Histological resolution occurred in five of eight cases with follow-up gastric biopsies"
    explanation: >-
      Dechallenge outcome in an ARB-injury cohort in which 11 of 13 patients with
      duodenal biopsies had duodenal involvement including collagenous sprue. Graded
      INDIRECT because the reported follow-up biopsies are gastric, so the histologic
      resolution figure is not a collagenous sprue measurement.
  treatment_term:
    preferred_term: medication management
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Nutritional support and supplementation
  description: >-
    Nutritional rehabilitation, frequently including parenteral nutrition, is a routine
    part of management and is needed more often than in celiac disease or collagenous
    colitis.
  evidence:
  - reference: PMID:41854086
    reference_title: "Collagenous sprue across five decades (1970-2025): a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment commonly combined nutritional rehabilitation (often parenteral nutrition), gluten-free diet, withdrawal of suspected medications and corticosteroids."
    explanation: >-
      Establishes nutritional rehabilitation, often parenteral, as a usual component of
      collagenous sprue treatment.
  - reference: PMID:27620860
    reference_title: Comparison of clinical features, treatment, and outcomes of collagenous sprue, celiac disease, and collagenous colitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CS patients had higher rates for disease-related temporary total parenteral nutrition (TPN) use (38.1% vs. 1.1% vs. 1.0%, P < 0.0001) and disease-related hospitalization (52.4% vs. 3.3% vs. 8.2%, P < 0.0001) than that in CD and CC patients."
    explanation: >-
      Quantifies parenteral nutrition use in collagenous sprue against its two closest
      differentials, which is the evidence that this is a disease-specific need.
  treatment_term:
    preferred_term: nutritional supplementation
    term:
      id: NCIT:C15433

- name: Medication discontinuation (Olmesartan withdrawal)
  description: >-
    Reviewing the medication list and withdrawing a suspected culprit — in practice
    usually an ARB — is part of first-line management, and symptomatic improvement
    after withdrawal is the rule in drug-associated cases.
  evidence:
  - reference: PMID:41854086
    reference_title: "Collagenous sprue across five decades (1970-2025): a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CS is profoundly morbid but frequently improves with early recognition, medication review and withdrawal, aggressive nutritional support and steroid-based therapy, although relapse and mortality remain substantial."
    explanation: >-
      Places medication review and withdrawal in the management of collagenous sprue, and
      keeps the authors' caveat about relapse and mortality attached.
  - reference: PMID:39606500
    reference_title: Pathognomonic Features of Olmesartan-Induced Collagenous Sprue Resulting in Severe Small Bowel Malabsorption.
    supports: SUPPORT

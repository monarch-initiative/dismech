  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subepithelial collagen thickness was mildly (n=6), moderately (n=10), or markedly (n=3) increased and villous atrophy was total (n=13) or subtotal (n=6)."
    explanation: >-
      Quantifies the range of collagen thickening and villous atrophy across a
      19-patient collagenous sprue series.
- name: Epithelial detachment and villous atrophy
  description: >-
    The collagen band is accompanied by epithelial detachment from the basement
    membrane and by villous atrophy that is total in roughly half of reported cases,
    producing the flattened mucosal lesion responsible for malabsorption. Histologic
    severity does not correlate with symptom severity, and histologic recovery lags
    clinical response to treatment — in one series the villous architecture normalized
    fully in only one of four clinically improved patients. Whether tight-junction
    proteins are involved has not been examined in collagenous sprue.
  biological_processes:

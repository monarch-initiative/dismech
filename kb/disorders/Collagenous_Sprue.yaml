notes: >-
  Collagenous sprue is defined by a histologic lesion rather than by an aetiology, and
  more than one route appears to lead to it: an ARB or other drug exposure, a
  background of celiac disease, and — in patients who are celiac-seronegative and
  HLA-DQ2/DQ8-negative — neither. The entry therefore records the drug trigger and the
  celiac association as separate, non-exclusive contributions rather than as one causal
  chain. Prognosis is not uniform: a referral series reported good outcomes with only
  one death, while the pooled five-decade analysis reports 23% mortality among patients
  with known vital status, and the difference is likely ascertainment.
review_notes: >-
  Evidence re-curated 2026-09-16 against monarch-initiative/dismech#10630, which found
  that only 9 of 35 evidence items supported the claim they were attached to; the rest
  quoted real papers about collagenous gastritis, collagenous colitis, microscopic
  colitis or ARB-induced gastritis and asserted the finding for collagenous sprue. All
  six DOI:10.1093/ecco-jcc/jjab123 items and the PMID:34272945 duplicate of the same
  microscopic colitis review are gone, so the citation is no longer split across a
  gate-covered and a skip_prefixes form. Five gene records with no molecular evidence
  (TGFB1, MMP1, MMP9, TIMP1, TJP1) were removed and the open question recorded as the
  `fibrogenic_mediators_uncharacterized` discussion; the `Pulmonary hemosiderosis`
  differential was removed and the reasoning recorded as
  `pulmonary_hemosiderosis_differential_removed`. A `Serum iron` biochemical record
  whose quote reported neither iron nor a deficiency was replaced by `Serum potassium`,
  which the pooled series measures. The one remaining sibling-disease citation
  (PMID:35945664, ARB-induced gastritis) is kept only on medication withdrawal, graded
  INDIRECT, with the gastric-versus-duodenal limitation stated in its explanation.

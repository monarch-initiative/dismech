phenotypes:
- name: Chronic watery diarrhea
  category: Gastrointestinal
  frequency: VERY_FREQUENT
  description: >-
    Prolonged watery diarrhea is the dominant presenting symptom, reported in roughly
    four out of five patients, with a median symptom duration of months before
    diagnosis. A minority of patients present without diarrhea.
  evidence:
  - reference: PMID:41854086
    reference_title: "Collagenous sprue across five decades (1970-2025): a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms were prolonged (median 36 weeks) with prominent diarrhea (median 6.5 stools/day) and frequent malnutrition and edema."
    explanation: >-
      Pooled patient-level analysis of 99 collagenous sprue cases quantifying diarrhea
      frequency and duration.
  - reference: PMID:27620860
    reference_title: Comparison of clinical features, treatment, and outcomes of collagenous sprue, celiac disease, and collagenous colitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall CS patients were more symptomatic with 17 (81.0%) patients with diarrhea and 15 (71.4%) with unintentional weight loss."
    explanation: >-
      Gives the proportion with diarrhea in a 21-patient collagenous sprue cohort
      compared directly against celiac disease and collagenous colitis.
  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "5 of 15 (33%) lacked diarrhea (atypical presentation), including 2 of 6 (33%) with active (untreated) celiac disease and 3 of 9 (33%) with refractory celiac disease"
    explanation: >-
      Records the diarrhea-negative presentation, so the VERY_FREQUENT frequency band is
      not read as universal.

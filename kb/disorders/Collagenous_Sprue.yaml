- name: Protein-losing enteropathy
  category: Gastrointestinal
  frequency: FREQUENT
  description: >-
    Enteric protein loss with consequent hypoalbuminemia and edema. Note the
    curation caveat: the pooled series reports edema and a median albumin of 2.9 g/dL

- name: Thiopurines (Azathioprine/6-Thioguanine)
  description: >-
    Thiopurines are used for collagenous sprue that does not respond to diet and
    steroids. Thioguanine with or without budesonide produced clinical improvement in
    all four patients of the only dedicated series, with histologic normalization of
    the collagen band in two and full villous recovery in one; symptoms recurred on
    withdrawal in one patient and remitted again on rechallenge.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Normalisation of the thickened basement membrane was found in 2 patients and complete histological improvement including full recovery of villi was found in 1 patient."
    explanation: >-
      Histologic outcome of thioguanine treatment in biopsy-confirmed collagenous sprue.
      This replaces a quote that described a patient's presentation and mentioned no
      thiopurine.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "At least one positive experience with another thiopurine, azathiopurine, together with steroids is described in the literature, with clinical and total histological improvement."
    explanation: >-

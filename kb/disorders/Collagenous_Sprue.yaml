genetic:
- name: HLA-DQA1
  gene_term:
    preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  association: Contested susceptibility locus, inherited through the celiac association
  relationship_type: SUSCEPTIBILITY
  notes: >-
    The HLA link to collagenous sprue is entirely indirect: it is inherited from the
    frequent co-occurrence with celiac disease, which is HLA-DQ2/DQ8-restricted. No
    study has typed HLA in an unselected collagenous sprue cohort and found an
    association independent of celiac disease, and the one series that typed all its
    patients found them uniformly DQ2/DQ8-negative. Both directions are cited below.
  evidence:
  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen (89%) had celiac disease and two had unclassified sprue; 9 of 17 (53%) celiac disease patients had refractory disease"
    explanation: >-
      In this referral series almost all collagenous sprue patients had celiac disease,
      which carries the HLA-DQ2/DQ8 restriction. Graded INDIRECT: the HLA claim follows
      from the celiac diagnosis rather than from HLA typing reported here.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients had ever had coeliac-specific antibodies, and all were negative for HLA-DQ2 and HLA-DQ8 phenotype."
    explanation: >-
      Four consecutive biopsy-confirmed collagenous sprue patients were all
      HLA-DQ2/DQ8-negative, so the haplotypes are not required for the disorder. This is
      the direct refutation of an HLA-restricted model of collagenous sprue.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluating the cases in this study, all four patients were negative for HLA-DQ2 and HLA-DQ8, with negative coeliac serology, which proves that CS can occur in the absence of CD."
    explanation: >-
      The authors' own statement that collagenous sprue occurs without celiac disease,
      which is the link the HLA association depends on.
environmental:
- name: Medications (Angiotensin II Receptor Blockers)
  notes: >-
    ARB exposure, olmesartan most often, is the best-characterized trigger. Drug
    withdrawal is part of first-line management.
  effect: Triggers collagenous sprue in exposed patients; withdrawal is followed by
    clinical improvement
  evidence:
  - reference: PMID:41854086
    reference_title: "Collagenous sprue across five decades (1970-2025): a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to medications associated with sprue-like enteropathy was common when reported (30/38, 79%), most often angiotensin receptor blockers."
    explanation: >-
      Quantifies how often a drug exposure — usually an ARB — is present in reported
      collagenous sprue cases.
  - reference: PMID:39606500
    reference_title: Pathognomonic Features of Olmesartan-Induced Collagenous Sprue Resulting in Severe Small Bowel Malabsorption.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case report highlights the diagnostic challenges and clinical features of CS in a 74-year-old woman, whose symptoms resolved following cessation of olmesartan. The case emphasizes the importance of recognizing medication-induced forms of the disease"
    explanation: >-
      Dechallenge case demonstrating olmesartan as a direct trigger, with resolution
      after withdrawal.
  - reference: PMID:26997446
    reference_title: "Olmesartan-associated sprue-like enteropathy: a systematic review with emphasis on histopathology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "This syndrome is characterized by severe diarrhea and sprue-like histopathologic findings in the intestine, often with increased subepithelial collagen."
    explanation: >-
      Links the ARB-associated enteropathy to increased subepithelial collagen, which is
      the lesion that defines collagenous sprue.
  - reference: PMID:26997446
    reference_title: "Olmesartan-associated sprue-like enteropathy: a systematic review with emphasis on histopathology."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also not well established if other ARBs cause such a syndrome, although case reports suggest they can."
    explanation: >-
      Qualifies the class-wide claim: the evidence outside olmesartan is case-level, so
      "and other ARBs" is weaker than the olmesartan association.
- name: Medications (NSAIDs and clofazimine)
  notes: >-
    Reported as suggested associations only. This record was previously titled
    "Proton Pump Inhibitors and NSAIDs" and cited a quote that named neither; PPIs are
    dropped because the same literature lists high-dose PPI as an attempted
    *treatment* for collagenous sprue, not as a trigger.

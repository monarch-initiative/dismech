differential_diagnoses:
- name: Celiac disease
  disease_term:
    preferred_term: celiac disease
    term:
      id: MONDO:0005130
      label: celiac disease
  description: >-
    Celiac disease shares chronic diarrhea, weight loss and villous atrophy with
    collagenous sprue and frequently co-occurs with it, so the two are separated
    histologically by the subepithelial collagen band rather than clinically. Most
    collagenous sprue patients are celiac-seronegative, and collagenous sprue patients
    are more symptomatic and need parenteral nutrition and hospitalization far more
    often than celiac patients.
  distinguishing_features:
  - Subepithelial collagen band present in collagenous sprue, absent in celiac disease
  - Positive tTG and endomysial antibodies in most celiac patients; positive in about a
    quarter of collagenous sprue patients
  - HLA-DQ2/DQ8 restriction in celiac disease; collagenous sprue occurs in DQ2/DQ8-negative
    patients
  - Sustained response to gluten-free diet in celiac disease; fewer than half of
    collagenous sprue patients respond to diet alone
  evidence:
  - reference: PMID:27620860
    reference_title: Comparison of clinical features, treatment, and outcomes of collagenous sprue, celiac disease, and collagenous colitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collagenous sprue patients had more severe clinical presentation than patients with CD and CC and therefore had higher demand for temporary TPN and hospitalization."
    explanation: >-
      Head-to-head comparison of collagenous sprue against celiac disease and collagenous
      colitis, which is the discriminating clinical observation curated here.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "CS should be separated from coeliac disease."
    explanation: >-
      The authors' conclusion that the two are distinct entities, reached from uniformly
      negative celiac serology and HLA typing in their patients.
  - reference: PMID:40177217
    reference_title: "Coexisting Collagenous Sprue and Celiac Disease: A Case Report."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of a subepithelial collagen band on histology differentiates CS from celiac disease, as both have villous blunting."
    explanation: >-
      States the histologic discriminator. Marked BACKGROUND: the sentence is the case
      report's framing of established practice, not its own finding.
- name: Microscopic colitis
  disease_term:
    preferred_term: microscopic colitis
    term:
      id: MONDO:0000702
      label: microscopic colitis
  description: >-
    Collagenous colitis, the collagen-band subtype of microscopic colitis, is the
    colonic counterpart of the same lesion and co-occurs with collagenous sprue in a
    substantial fraction of cases, so the distinction is one of site and extent rather
    than of a different process. Colonic biopsies are therefore part of the workup
    rather than an alternative to small-bowel biopsy.
  distinguishing_features:
  - Collagen band in colonic mucosa in collagenous colitis, small-bowel mucosa in
    collagenous sprue
  - Villous atrophy is intrinsic to collagenous sprue and absent from a purely colonic
    process
  - Concurrent collagenous colitis is present in a large minority of collagenous sprue
    patients, so the two are not mutually exclusive
  evidence:
  - reference: PMID:19641452
    reference_title: "Collagenous sprue: a clinicopathologic study of 12 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven cases were associated with collagenous colitis and 1 also had features of lymphocytic colitis."
    explanation: >-
      Quantifies the overlap with microscopic colitis in a collagenous sprue series,
      replacing a quote taken from a collagenous colitis review.
  - reference: PMID:21523258
    reference_title: Collagenous sprue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "In collagenous sprue, concomitant collagen deposits may also occur in gastric or colonic mucosal sites (or both), indicating that this unusual mucosal process may be very heterogeneous and far more extensive in the intestinal tract than previously appreciated."
    explanation: >-
      Supports treating the gastric and colonic collagenous lesions as extensions of the
      same process rather than as separate diseases to be excluded.
- name: Refractory celiac disease
  disease_term:
    preferred_term: refractory celiac disease
    term:
      id: MONDO:0018353
      label: refractory celiac disease
  description: >-
    Refractory celiac disease and collagenous sprue both present as villous atrophy
    that does not respond to a gluten-free diet, and they overlap: about half of the
    celiac patients in one collagenous sprue series had refractory disease. The
    collagen band separates them histologically, and aberrant intraepithelial
    lymphocyte phenotypes — the hallmark of type II refractory celiac disease — were
    absent throughout that series.
  distinguishing_features:
  - Subepithelial collagen band present in collagenous sprue
  - Phenotypically aberrant intraepithelial lymphocytes in type II refractory celiac
    disease, not found in collagenous sprue
  - Documented celiac disease with initial gluten-free diet response precedes refractory
    celiac disease
  evidence:
  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen (89%) had celiac disease and two had unclassified sprue; 9 of 17 (53%) celiac disease patients had refractory disease"
    explanation: >-
      Quantifies the overlap between collagenous sprue and refractory celiac disease.
  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypically aberrant intraepithelial lymphocytes were not detected in any case."
    explanation: >-
      Supports the distinguishing feature: the aberrant IEL phenotype that defines type
      II refractory celiac disease was absent from every collagenous sprue case here.
  - reference: PMID:41341547
    reference_title: "[Collagenous Sprue, Collagenous Gastritis, and an Uncommon Association with Inflammatory Bowel Disease: A Case Report]."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical course of celiac disease may be complicated by the development of additional conditions such as microscopic colitis, refractory celiac disease or collagenous sprue."
    explanation: >-
      Places the three conditions as alternative complications of celiac disease, which
      is why they must be differentiated. Marked BACKGROUND: the sentence is this case
      report's framing of established knowledge.
discussions:
- discussion_id: fibrogenic_mediators_uncharacterized
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Subepithelial collagen deposition with entrapment of lamina propria
    elements
  - genetic#
  prompt: >-
    Which cells deposit the collagen band in collagenous sprue, and what shifts the
    balance between matrix synthesis and matrix turnover in favour of accumulation?
  rationale: >-
    This entry previously carried five gene records — TGFB1, MMP1, MMP9, TIMP1 and
    TJP1 — each asserting a direction of change (TGF-beta driven fibroblast activation,
    reduced MMP activity, elevated TIMP1, reduced ZO-1). Every one of them was
    supported only by a histology sentence that named no gene, transcript or protein,
    and two of those sentences came from papers about collagenous gastritis and
    ARB-induced gastritis rather than about collagenous sprue. The records have been
    removed rather than re-sourced, because the searches run for this re-curation found
    no study that measures any of these mediators in collagenous sprue tissue. The
    model is plausible and is imported wholesale from collagenous colitis and from
    general gut-fibrosis biology; importing it was how the entity confusion this issue
    tracks got in. It is recorded here as an open question so that a future study can
    reinstate the nodes with real measurements.
  evidence:
  - reference: PMID:21523258
    reference_title: Collagenous sprue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Future studies are needed to more precisely define molecular and genetic biomarkers that identify homogeneous groups and permit the development of improved treatment strategies for this increasingly recognized disorder."
    explanation: >-
      A review of collagenous sprue stating that the molecular and genetic biomarkers
      are still undefined, which is the gap recorded here.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Little is known about the aetiology and pathogenesis of this disease."
    explanation: >-
      Independent statement that the pathogenesis is uncharacterized.
  notes: >-
    Resolving this needs tissue-level work — immunohistochemistry or transcriptomics on
    collagenous sprue duodenal biopsies against celiac and normal controls — not another
    literature pass.
- discussion_id: hla_association_is_inherited_from_celiac
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#HLA-DQA1
  prompt: >-
    Is there an HLA association with collagenous sprue that is independent of its
    co-occurrence with celiac disease?
  rationale: >-
    Referral series report celiac disease in up to 89% of collagenous sprue patients,
    which makes an HLA-DQ2/DQ8 enrichment inevitable without implying that HLA
    predisposes to the collagen band. The one series that typed all its patients found
    them uniformly DQ2/DQ8-negative and celiac-seronegative, and concluded that
    collagenous sprue should be separated from celiac disease. The two positions are
    both cited on the HLA-DQA1 record, one as SUPPORT and one as REFUTE. Ascertainment
    is the likely explanation for the difference — the 89% figure comes from a celiac
    referral centre's pathology database — but no study has tested that.
  evidence:
  - reference: PMID:19641452
    reference_title: "Collagenous sprue: a clinicopathologic study of 12 cases."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collagenous sprue evolved on a background of CD in 4 cases. There was no history of CD in others and these cases may be the result of a biologic insult other than gluten sensitivity."
    explanation: >-
      A series in which only a third of cases arose on a celiac background, supporting a
      celiac-independent route into the disorder.
  - reference: PMID:21631278
    reference_title: "Collagenous sprue: a rare, severe small-bowel malabsorptive disorder."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Its exact etiology is still under investigation, and its relationship with classic celiac disease and other refractory, spruelike intestinal disorders remains controversial."
    explanation: >-
      States that the relationship to celiac disease is itself contested, which is the
      controversy recorded here.
- discussion_id: pulmonary_hemosiderosis_differential_removed
  kind: CURATION_TODO
  status: RESOLVED
  attaches_to:
  - differential_diagnoses#
  prompt: >-
    Should pulmonary hemosiderosis be listed as a differential diagnosis of collagenous
    sprue?
  rationale: >-
    No. The record has been removed. It claimed that "collagenous sprue can have
    pulmonary manifestations through shared immune mechanisms" and cited a sentence
    about collagenous colitis that mentions no lung disease; nothing in the collagenous
    sprue literature reviewed for this re-curation reports pulmonary involvement. The
    entry is almost certainly a confusion with the celiac disease / idiopathic
    pulmonary hemosiderosis (Lane-Hamilton syndrome) association, which belongs to
    celiac disease and not to collagenous sprue, and which is not a differential
    diagnosis in either case — it is a comorbidity. Recorded rather than silently
    dropped so the concept is not re-nominated.
  resolution_note: >-
    Removed in the #10630 re-curation. If a collagenous sprue case with pulmonary
    hemosiderosis is ever reported, it belongs in a comorbidity or association record,
    not in differential_diagnoses.

name: Collagenous Sprue
creation_date: '2026-01-19T21:03:46Z'
description: >-
  Collagenous sprue is a rare malabsorptive small-bowel disorder defined
  histologically by abnormal deposition of a thickened subepithelial collagen band
  beneath the surface epithelium, accompanied by villous atrophy and intraepithelial
  lymphocytosis, with entrapment of lamina propria cellular elements within the band.
  Patients present with prolonged watery diarrhea, weight loss, malnutrition and
  severe malabsorption, and laboratory evidence of hypoalbuminemia, hypokalemia and
  anemia. Exposure to a drug associated with sprue-like enteropathy — most often an
  angiotensin receptor blocker — is common in reported cases. The disorder is
  associated with, but not equivalent to, celiac disease: it is frequently refractory
  to a gluten-free diet and occurs in patients who are celiac-seronegative and
  HLA-DQ2/DQ8-negative. Its aetiology and molecular pathogenesis remain
  uncharacterized.
category: Complex
disease_term:
  preferred_term: collagenous sprue
  term:
    id: MONDO:0044092
    label: collagenous sprue
parents:
- Enteropathy
- Malabsorption disorder
has_subtypes: []
pathophysiology:
- name: Mucosal immune activation with intraepithelial lymphocytosis
  description: >-
    Small-bowel biopsies in collagenous sprue show intraepithelial lymphocytosis and a
    lamina propria infiltrate that may include plasma cells, neutrophils and
    eosinophils, alongside the collagen band and villous atrophy. Clonal T-cell
    populations are detectable in a majority of tested cases, and clinical response to
    thiopurines — whose active metabolite induces T-cell apoptosis — is the main
    functional argument for a T-cell-driven process. The immune activation is
    dissociable from celiac disease: it occurs in patients with negative celiac
    serology and without the HLA-DQ2/DQ8 haplotypes. The upstream trigger is unknown.
  cell_types:
  - preferred_term: intraepithelial lymphocyte
    term:
      id: CL:0002496
      label: intraepithelial lymphocyte
  - preferred_term: plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  - preferred_term: eosinophil
    term:
      id: CL:0000041
      label: mature eosinophil
  biological_processes:

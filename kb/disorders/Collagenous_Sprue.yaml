treatments:
- name: Gluten-free diet
  description: >-
    A gluten-free diet is standard first-line management, reflecting both the frequent
    co-occurrence with celiac disease and the fact that collagenous sprue is often
    first mistaken for it. Response is partial: fewer than half of patients improve on
    diet alone, and failure to respond is one of the features that raises the
    diagnosis.
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:19855376
    reference_title: "Collagenous sprue is not always associated with dismal outcomes: a clinicopathological study of 19 patients."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 8 of 19 (42%) responded to gluten-free diet, including 2 of 9 (22%) with refractory celiac disease and 10 responded to immunomodulatory therapy, including 6 of 9 (67%) with refractory celiac disease."
    explanation: >-
      Quantifies gluten-free diet response, and the larger response to immunomodulatory
      therapy, in a collagenous sprue series.
  - reference: PMID:20082473
    reference_title: Update on collagenous sprue.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Often, an initial diagnosis of celiac disease is considered but no continued response to treatment with a gluten-free diet occurs."
    explanation: >-
      States the characteristic loss of response to a gluten-free diet, which is why
      diet alone is not sufficient management.
  treatment_term:
    preferred_term: gluten-free diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
- name: Corticosteroids (Budesonide)
  description: >-
    Corticosteroids, alone or combined with a gluten-free diet, are the mainstay of
    treatment, and budesonide is the agent used when topical gastrointestinal activity
    is wanted. Symptomatic response is common and often rapid.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:27620860
    reference_title: Comparison of clinical features, treatment, and outcomes of collagenous sprue, celiac disease, and collagenous colitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty CS patients received treatments, including the combination of gluten-free diet (GFD) and corticosteroids (n = 12), GFD only (n = 2), and corticosteroids only (n = 6). All CS patients showed symptomatic reliefs with treatment."
    explanation: >-
      Direct treatment-outcome data for corticosteroids in a collagenous sprue cohort.
      This replaces a microscopic colitis pathogenesis sentence that named no treatment.
  - reference: PMID:41854086
    reference_title: "Collagenous sprue across five decades (1970-2025): a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment commonly combined nutritional rehabilitation (often parenteral nutrition), gluten-free diet, withdrawal of suspected medications and corticosteroids."
    explanation: >-
      Establishes corticosteroids as part of the usual regimen across five decades of
      reported cases.
  - reference: PMID:27486523
    reference_title: The first cases of collagenous sprue successfully treated with thioguanine.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients were treated with a combination of 6-TG and budesonide, and 1 patient received 6-TG only. All patients improved remarkably."
    explanation: >-
      Names budesonide specifically as the corticosteroid used in collagenous sprue.
  treatment_term:

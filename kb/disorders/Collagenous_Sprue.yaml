    of enteric protein loss, so the protein-losing mechanism is inferred from the
    albumin-plus-edema picture rather than measured. A dedicated case report of
    collagenous sprue presenting as protein-losing enteropathy exists (PMID:25514205)
    but its abstract carries no quotable finding beyond the title.
  evidence:
  - reference: PMID:41854086

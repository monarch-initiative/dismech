discussions:
- discussion_id: interpretation_periodontitis_is_immunopathology_not_infection
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#Inflammatory Periodontal Bone Loss
  - pathophysiology#Dysregulated IL-23/IL-17 Axis at Barrier Sites
  - treatments#Antimicrobial Prophylaxis and Aggressive Infection Management
  prompt: Is LAD1 periodontitis a failure of neutrophil surveillance against periodontal infection, or an inflammatory response that has lost its neutrophil-dependent brake?
  rationale: >-
    For decades the answer was assumed to be the first, and it is the intuitive reading -
    neutrophils cannot reach the gingival sulcus, so the bacteria win. Three observations
    do not fit. Bacterial load inside the diseased gingival tissue is comparable to or lower
    than in healthy controls. The infiltrate is dense but lymphocytic, with neutrophils
    visible confined inside vessels. And prophylactic antibiotics from infancy plus dental
    care did not prevent progression in any patient evaluated.

    The alternative reading explains all three. Efferocytosis of transmigrated apoptotic
    neutrophils is the signal that tells tissue macrophages to stop making IL-23. Remove the
    transmigration and the signal never arrives, so a physiological response to the oral
    microbiome runs without a brake and IL-17 drives osteoclastic bone loss. On this reading
    the bacteria are the stimulus rather than the agent, which is why suppressing them
    incompletely - as antibiotics do at a mucosal surface - changes nothing.

    The distinction is not academic. It predicts that blocking the axis should work where
    antimicrobials do not, and blocking it did: anti-IL-17 and anti-IL-23 prevented bone loss
    in LFA-1-deficient mice, and ustekinumab resolved refractory periodontal inflammation in
    a patient. It also suggests the same logic may apply at other barrier sites in this
    disease, and in other conditions where neutrophils fail to reach tissue.
- discussion_id: gap_moderate_lad1_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Moderate
  - phenotypes#Autoimmune Complications
  prompt: What is the natural history of moderate LAD-I, and which moderate patients will progress to meet severe criteria?
  rationale: >-
    The severe subtype has a defined prognosis and a definitive treatment recommendation.
    Moderate LAD-I has neither. The consensus asks for routine reassessment precisely because
    severity is understood to sit on a spectrum and to be able to progress, but it offers no
    predictor of who progresses, over what interval, or what should trigger a move to
    definitive therapy.

    Two observations make this more than a bookkeeping gap. Residual CD18 does not protect
    the periodontium proportionally - attachment loss scales inversely with remaining CD18,
    so moderate patients still lose their dentition. And the autoimmune complications
    reported in long-term follow-up occurred in patients whose beta-2 integrin expression was
    partially conserved, which is to say in the moderate range. A subtype defined by a
    laboratory threshold that does not predict its own major morbidities is a subtype whose
    boundary needs re-examining.

    Answering this needs prospective follow-up of a moderate cohort with periodontal,
    autoimmune and infection endpoints, which no published series provides.
- discussion_id: gap_gene_therapy_versus_allogeneic_hsct
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Autologous Lentiviral ITGB2 Gene Therapy (Marnetegragene Autotemcel)
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
  prompt: How does autologous lentiviral ITGB2 gene therapy compare with allogeneic HSCT over a horizon long enough to matter, and what level of gene-corrected chimerism is sufficient?
  rationale: >-
    The phase 1-2 gene therapy result is striking on its own terms - nine children, no graft
    failure, 100% HSCT-free survival at one year - and it removes the two things that make
    allogeneic transplantation difficult here, donor availability and alloreactivity. But the
    comparison that clinicians need has not been made. The allogeneic registry cohort is 84
    patients with three-year outcomes; the gene therapy cohort is nine with two years of
    follow-up, and a cross-study comparison of those two is not a comparison.

    Two specific questions are open. First, durability: beta-2 integrin expression must be
    maintained in the myeloid compartment for life, and the threshold fraction of corrected
    cells needed to hold the phenotype is not established from human data. Second, whether
    gene therapy addresses the non-infectious arms of the disease - the autoimmune
    complications seen after allogeneic transplantation, and the periodontal disease - or
    only the infection burden that both the primary endpoint and the reported outcomes
    emphasise.
notes: >-
  GeneReviews. A PubMed search for a GeneReviews chapter on leukocyte adhesion deficiency or
  ITGB2 returns no hits, so the GeneReviews phenotype baseline does not apply to this entry.
  The 2026 international Delphi consensus (PMID:42011429) is used as the equivalent
  expert-curated clinical baseline, since it supplies diagnostic criteria, a severity
  algorithm, and standard-of-care recommendations in the form a GeneReviews chapter would.

  Orphanet. No ORPHA reference is cited. The Orphadata bulk XML is not present in this
  checkout (data/orphadata/ holds only MANIFEST.yaml), so no ORPHA cache file could be
  generated or quoted, and fabricating an ORPHA code from memory is exactly the failure the
  reference policy forbids. The prevalence record is therefore anchored to the consensus
  statement instead.

  OMIM numbering. The IUIS Table 5 row gives OMIM 600065 for LAD1. That is the ITGB2 gene
  entry; the phenotype MIM number for the disease is 116920. Both are correct in their own
  right and the IUIS table uses the gene number throughout its OMIM column, so the row is not
  in error - but the two should not be conflated when reading the classification evidence.

  Relationship to LAD2 and LAD3. This entry covers the adhesion arm of the family only.
  Leukocyte Adhesion Deficiency Type II (SLC35C1) fails one step earlier in the same cascade
  - absent fucosylated selectin ligands abolish rolling - and carries the Bombay blood
  phenotype and neurodevelopmental features that LAD1 does not. LAD3 (FERMT3) leaves the
  integrins present but unable to be conformationally activated, and adds a bleeding
  tendency from the same defect in platelets.

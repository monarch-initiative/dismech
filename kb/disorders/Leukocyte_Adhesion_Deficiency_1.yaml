prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Roughly 1 per million, as stated by the 2026 international consensus. Read this as an
    order-of-magnitude figure rather than a measured rate - the same consensus notes only
    about 300 published cases before 2018, and the literature contains no population-based
    ascertainment. Reported series are heavily weighted toward consanguineous populations,
    so the true figure almost certainly varies by an order of magnitude between populations.
  evidence:

    explanation: The consensus statement's own occurrence estimate, which is the basis for the band recorded here.
pathophysiology:
- name: Biallelic ITGB2 Loss-of-Function Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Both copies of ITGB2 at 21q22.3 carry variants that abolish or cripple CD18. The
    original molecular study resolved five distinct beta-subunit phenotypes across patients -
    absent mRNA and precursor, low mRNA and precursor, an aberrantly large precursor, an
    aberrantly small precursor, and a grossly normal precursor - which is why surface
    expression ranges from undetectable to near-normal-but-nonfunctional. Most missense
    variants cluster in the conserved betaI domain encoded by exons 5-9, the ligand-binding
    face of the receptor.
  genetic_context:
    gene:
      preferred_term: ITGB2
      term:
        id: hgnc:6155
        label: ITGB2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous. Loss of function is established at the protein
      level rather than inferred from variant class - mutant beta precursors fail to
      associate with the alpha subunit, which is the defining biochemical result.
  downstream:
  - target: Failed Beta-2 Integrin Heterodimer Assembly
    causal_link_type: DIRECT
    description: The gene product is the shared beta chain, so a disabling variant removes the assembly partner directly.
    evidence:
    - reference: PMID:3594570
      reference_title: Heterogeneous mutations in the beta subunit common to the LFA-1, Mac-1, and p150,95 glycoproteins cause leukocyte adhesion deficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Mutant beta subunit precursors from LAD patients failed to associate with the LFA-1 alpha subunit.
      explanation: The assembly failure itself, measured on patient-derived precursors - this is the step that connects the genotype to the receptor-family defect.
  evidence:
  - reference: PMID:3594570
    reference_title: Heterogeneous mutations in the beta subunit common to the LFA-1, Mac-1, and p150,95 glycoproteins cause leukocyte adhesion deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we demonstrate that the primary defect in LAD is in the beta subunit gene.
    explanation: Assigns the primary lesion to the shared beta subunit gene rather than to any individual alpha chain.
  - reference: PMID:3594570
    reference_title: Heterogeneous mutations in the beta subunit common to the LFA-1, Mac-1, and p150,95 glycoproteins cause leukocyte adhesion deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified five distinct beta subunit phenotypes in LAD patients: undetectable beta subunit mRNA and protein precursor; low levels of beta subunit mRNA and precursor; an aberrantly large beta subunit precursor, probably due to an extra glycosylation site; an aberrantly small precursor; and a grossly normal precursor."
    explanation: The allelic heterogeneity that underlies the severe-versus-moderate split curated below, including the case where protein is made but does not work.
- name: Failed Beta-2 Integrin Heterodimer Assembly
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    CD18 is the common beta chain of four heterodimers - LFA-1 (CD11a/CD18), Mac-1
    (CD11b/CD18), p150,95 (CD11c/CD18) and CD11d/CD18. The alpha and beta subunits pair
    inside the cell before trafficking to the surface, so when the beta chain is absent or
    malformed the alpha chains cannot reach the membrane either. One gene defect therefore
    removes a whole receptor family, which is why the phenotype is broader than any
    single-integrin knockout would predict.
  cellular_components:
  - preferred_term: beta-2 integrin complex
    term:
      id: GO:0008305
      label: integrin complex
    modifier: DECREASED
  - preferred_term: LFA-1 (CD11a/CD18)
    term:
      id: GO:0034687
      label: integrin alphaL-beta2 complex
    modifier: DECREASED
  molecular_functions:
  - preferred_term: alpha/beta integrin subunit pairing
    term:
      id: GO:0046982
      label: protein heterodimerization activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Defective Neutrophil Firm Adhesion to Endothelium
    causal_link_type: DIRECT
    description: The absent heterodimers are the receptors that mediate firm arrest, so losing them removes the interaction.
    evidence:
    - reference: PMID:28328326
      reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the β2 integrins are required for the adhesion of neutrophils to endothelium and the transmigration of neutrophils into tissues"
      explanation: States that the receptors lost at this node are the ones required for the adhesion and transmigration steps below it.
  evidence:
  - reference: PMID:35408940
    reference_title: "Understanding the Role of LFA-1 in Leukocyte Adhesion Deficiency Type I (LAD I): Moving towards Inflammation?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since the β and α subunits pair intracellularly, a decreased or mutated β subunit also leads to a decreased expression of the α subunit at the cell surface."
    explanation: The intracellular-pairing requirement that makes a beta-chain defect take all four alpha chains down with it.
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Decreased expression of the common β2 subunit leads to a similar decrease in the expression of all four α subunits on the leukocyte surface."
    explanation: Confirms the loss spans all four alpha subunits rather than being restricted to LFA-1.
  - reference: PMID:3555290
    reference_title: "Leukocyte adhesion deficiency: an inherited defect in the Mac-1, LFA-1, and p150,95 glycoproteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include Mac-1 (complement receptor type 3), lymphocyte function-associated antigen-1 (LFA-1), and p150,95."
    explanation: Names the receptor family lost, from the classic clinical-molecular description of the disease.
- name: Defective Neutrophil Firm Adhesion to Endothelium
  role: effector
  biological_scale: CELLULAR
  description: >-
    Selectin-mediated rolling is intact in LAD1 - the selectins and their ligands are
    untouched - but the neutrophil cannot convert rolling into integrin-mediated firm arrest
    on the inflamed vessel wall. LFA-1 binding to endothelial ICAM-1 and ICAM-2 is the step
    that fails. No other adhesion system substitutes: VLA-4, which lets monocytes and T cells
    arrest through a beta-1 route, is not expressed on neutrophils, so the neutrophil has no
    fallback.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: leukocyte adhesion to vascular endothelial cell
    term:
      id: GO:0061756
      label: leukocyte adhesion to vascular endothelial cell
    modifier: DECREASED
  - preferred_term: leukocyte cell-cell adhesion
    term:
      id: GO:0007159
      label: leukocyte cell-cell adhesion
    modifier: DECREASED
  - preferred_term: integrin-mediated signaling pathway
    term:
      id: GO:0007229
      label: integrin-mediated signaling pathway
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Neutrophil Transmigration into Tissue
    causal_link_type: DIRECT
    description: Transmigration is downstream of firm arrest in the adhesion cascade, so a cell that never arrests never crosses.
    evidence:
    - reference: PMID:24670684
      reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The LFA-1 integrin (CD11a/CD18) plays a crucial role in firm adhesion, which is essential to the subsequent extravasation of the neutrophils to peripheral tissues
      explanation: States the ordering explicitly - firm adhesion is the prerequisite for extravasation, which is what makes this an edge rather than two parallel defects.
  evidence:
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This deficiency leads to severe impairment of leukocyte adhesion to the vascular wall and leukocyte migration to sites of infection and inflammation.
    explanation: The adhesion defect at the vessel wall, stated for CD18 deficiency directly.
  - reference: PMID:35408940
    reference_title: "Understanding the Role of LFA-1 in Leukocyte Adhesion Deficiency Type I (LAD I): Moving towards Inflammation?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Since VLA-4 is mainly expressed on monocytes and T cells, but not on neutrophils, it is not able to compensate for the loss of β2 integrins in LAD I"
    explanation: Explains why the neutrophil has no redundant arrest mechanism, which is why this node is absolute rather than partial in the neutrophil lineage.
- name: Failure of Neutrophil Transmigration into Tissue
  role: effector
  biological_scale: TISSUE
  description: >-
    Neutrophils remain confined within the vessel lumen and do not cross into infected or
    inflamed tissue. Histology of LAD1 lesions makes the point plainly - the inflammatory
    infiltrate is dense but composed of lymphocytes, with neutrophils visible inside vessels
    and absent from the tissue around them.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil extravasation
    term:
      id: GO:0072672
      label: neutrophil extravasation
    modifier: DECREASED
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: DECREASED
  downstream:
  - target: Tissue Neutropenia with Blood Neutrophilia
    causal_link_type: DIRECT
    description: Neutrophils that cannot leave the circulation accumulate in the compartment they are counted in and are missing from the one they are needed in.
  - target: Impaired Wound Healing
    causal_link_type: DIRECT
    description: Wound repair requires neutrophil recruitment into the wound bed, which does not occur.
  evidence:
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The infiltrate comprised primarily lymphocytes, whereas neutrophils were confined within vessels.
    explanation: Direct histological demonstration in patient tissue that neutrophils do not cross the vessel wall, which is the node's claim.
- name: Tissue Neutropenia with Blood Neutrophilia
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The signature inversion of this disease. Granulopoiesis is normal and unrestrained, so
    the circulating neutrophil count is high - markedly so during infection - while the
    tissue compartment behaves as if the patient were neutropenic. Every downstream
    consequence of the disease flows from this dissociation, and it is also why the blood
    count is actively misleading at the bedside: the one number a clinician reaches for moves
    in the opposite direction to the deficit.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  downstream:
  - target: Pus-Free Necrotic Bacterial and Fungal Infection
    causal_link_type: DIRECT
    description: Pus is accumulated tissue neutrophils; with none arriving, infection proceeds without it.
  - target: Dysregulated IL-23/IL-17 Axis at Barrier Sites
    causal_link_type: DIRECT
    description: The absent tissue neutrophils are the input to the efferocytosis feedback loop that normally restrains IL-23 production.
    evidence:
    - reference: PMID:28328326
      reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The disruption of this circuit as a result of the paucity of tissue neutrophils in LAD1 leads to exaggerated interleukin-23 and interleukin-17 responses, which appear to account for local LAD1 immunopathologic processes.
      explanation: Names tissue neutrophil paucity as the cause of the cytokine dysregulation, which is exactly this edge.
  evidence:
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Characteristic features are delayed separation of the umbilical cord and strong leukocytosis, especially neutrophilia, during periods of infection."
    explanation: The blood side of the inversion, described as characteristic of the disease.
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-17-induced granulopoiesis factors and chemokines were readily detected in blood plasma of LAD-I patients"
    explanation: Ties the circulating neutrophilia to sustained granulopoietic drive rather than to a marrow abnormality, which is why the two compartments diverge.
- name: Pus-Free Necrotic Bacterial and Fungal Infection
  role: effector
  biological_scale: ORGANISM
  description: >-
    Recurrent, severe, often life-threatening bacterial and fungal infection of skin and
    mucosal surfaces, with the diagnostically important feature that lesions do not suppurate.
    Necrotic skin lesions in LAD1 are frequently labelled pyoderma gangrenosum, which is a
    misreading - the biopsy characteristically contains no neutrophils at all, which is the
    opposite of what that diagnosis implies.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DECREASED
  evidence:
  - reference: PMID:3555290
    reference_title: "Leukocyte adhesion deficiency: an inherited defect in the Mac-1, LFA-1, and p150,95 glycoproteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by recurrent bacterial infections, impaired pus formation and wound healing"
    explanation: The classic description, which names impaired pus formation alongside the infections rather than as an afterthought.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children can also present with severe/recurrent bacterial or fungal infections, recalcitrant periodontitis, and/or necrotic skin wounds/lesions absent pus formation."
    explanation: Contemporary consensus statement of the same presentation, and the source for including fungal infection rather than bacterial alone.
  - reference: PMID:28328326
    reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic necrotic skin lesions, often incorrectly described as pyoderma gangrenosum (biopsy samples characteristically show no neutrophils), are common in LAD1"
    explanation: The histological point that the lesions are neutrophil-free, which both supports the node and corrects a common misdiagnosis.
- name: Dysregulated IL-23/IL-17 Axis at Barrier Sites
  role: effector
  biological_scale: TISSUE
  description: >-
    Tissue macrophages normally down-regulate IL-23 production when they phagocytose
    transmigrated apoptotic neutrophils. In LAD1 those neutrophils never arrive, so the
    brake is never applied and an otherwise physiological IL-23 response to the local
    microbiome runs unchecked, driving T-cell-derived IL-17 to high levels at the gingiva
    and skin. The elevation is compartmentalised rather than systemic - plasma IL-17 and
    IL-23 are low or absent - which matters because it means this is a local
    immunopathology, not a circulating inflammatory syndrome.
  cell_types:
  - preferred_term: gingival CD4+ T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: interleukin-17 production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: INCREASED
  downstream:
  - target: Inflammatory Periodontal Bone Loss
    causal_link_type: DIRECT
    description: IL-17 is an osteoclastogenic cytokine, and blocking it or its IL-23 driver prevents the bone loss in the corresponding mouse model.
    evidence:
    - reference: PMID:24670684
      reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Local treatment with antibodies to IL-17 or IL-23 in LFA-1-deficient mice not only blocked inflammatory periodontal bone loss but also caused a reduction in the total bacterial burden"
      explanation: An intervention result, which is what establishes the link as causal rather than correlative. Graded MODEL_ORGANISM because the intervention was done in mice - the equivalent experiment has not been run in patients.
  evidence:
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defective neutrophil recruitment in LAD-I patients or in LFA-1 (CD11a/CD18)-deficient mice--which exhibit the LAD-I periodontal phenotype--was associated with excessive production of predominantly T cell-derived IL-17 in the periodontal tissue"
    explanation: The human observation of excess T-cell-derived IL-17 in LAD-I periodontal tissue, and its attribution to the recruitment defect.
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data reveal that the elevated expression of IL-17 in LAD-I is compartmentalized rather than systemic."
    explanation: The compartmentalisation, which is why this node is tagged TISSUE and not ORGANISM.
  - reference: PMID:28328326
    reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phagocytosis of apoptotic neutrophils (efferocytosis) by tissue macrophages acts as a signal to down-regulate the production of interleukin-23 and therefore the downstream cytokines interleukin-17 and granulocyte colony-stimulating factor (G-CSF)."
    explanation: States the feedback circuit whose input is missing here, which is the mechanism this node asserts.
- name: Inflammatory Periodontal Bone Loss
  role: effector
  biological_scale: TISSUE
  description: >-
    Early-onset, generalised, severe periodontitis with destruction of tooth-supporting
    connective tissue and alveolar bone, ending in loss of both primary and permanent
    dentition. Historically read as unpoliced periodontal infection, but the evidence does
    not support that: bacterial load within the diseased gingival tissue is comparable to or
    lower than in healthy controls, and the disease is refractory to antibiotics and to
    mechanical biofilm removal. The severity scales inversely with residual CD18, tying the
    dental phenotype quantitatively to the molecular lesion.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  evidence:
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals display neutrophilia, suffer from recurrent infections, and invariably develop early-onset generalized aggressive periodontitis featuring severe bone loss and premature loss of primary and permanent teeth"
    explanation: States the periodontal phenotype and its invariability in this disease.
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "quantification of bacterial counts in gingival tissue sections from LAD-I patients and healthy controls, using real-time PCR of the 16S rRNA gene, revealed that the bacterial load within the tissue of LAD-I patients was comparable to (if not less than) that of healthy controls"
    explanation: The measurement that refutes the tissue-invasive-infection reading of this phenotype, and so supports curating it as an immunopathology.
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed progressive periodontal disease in all patients evaluated, despite prophylactic antibiotic use since infancy and access to dental care."
    explanation: The clinical refractoriness to antimicrobial and mechanical management, which is the practical consequence of the mechanism.
- name: Impaired Wound Healing
  role: effector
  biological_scale: TISSUE
  description: >-
    Wounds fail to repair and skin ulcers persist, because the neutrophil influx that
    initiates the repair programme does not occur. Clinically this appears as
    non-healing lesions that progress through repeated antibiotic courses and surgical
    debridement, and it is one of the features that resolves when the adhesion defect is
    corrected.
  biological_processes:
  - preferred_term: wound healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DECREASED
  evidence:
  - reference: PMID:3555290
    reference_title: "Leukocyte adhesion deficiency: an inherited defect in the Mac-1, LFA-1, and p150,95 glycoproteins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by recurrent bacterial infections, impaired pus formation and wound healing"
    explanation: Names impaired wound healing as a defining feature of the disease.
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The patients suffer from recurrent, life-threatening bacterial and fungal infections and from impaired wound healing."
    explanation: Independent statement of the wound-healing defect alongside the infection phenotype.
phenotypes:
- category: Neonatal
  name: Delayed Umbilical Cord Separation
  frequency: FREQUENT
  diagnostic: true
  description: >-
    Separation of the umbilical cord later than 21 days of life, often with omphalitis. This
    is frequently the first clinical sign and is one of the presenting features that should
    prompt integrin flow cytometry. It is not universal - a 69-patient series recorded it in
    36.2% - so its absence does not exclude the diagnosis, which is the reverse of how the
    sign is often taught.
  phenotype_term:
    preferred_term: Delayed umbilical cord separation
    term:

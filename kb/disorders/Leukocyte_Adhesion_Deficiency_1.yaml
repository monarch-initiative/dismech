name: Leukocyte Adhesion Deficiency 1
creation_date: '2026-09-14T02:59:37Z'
category: Mendelian
disease_term:
  preferred_term: leukocyte adhesion deficiency 1
  term:
    id: MONDO:0007293
    label: leukocyte adhesion deficiency 1
synonyms:
- LAD1
- LAD-I
- leukocyte adhesion deficiency type 1
- CD18 deficiency
- LFA-1 immunodeficiency
description: 'An autosomal recessive inborn error of immunity in which biallelic loss-of-function variants in ITGB2 remove or cripple CD18, the beta subunit shared by every member of the beta-2 integrin family. Because the alpha and beta chains pair intracellularly before reaching the plasma membrane, losing the common beta chain takes all four heterodimers down together - LFA-1, Mac-1, p150,95 and CD11d/CD18 - so a single gene defect removes an entire receptor family rather than one receptor.

  The consequence is specific and unusually legible. Neutrophils are made and released normally, and they still roll along activated endothelium, because rolling is selectin-mediated and selectins are untouched here. What they cannot do is convert that rolling into firm arrest and then cross the vessel wall. The cell therefore stays in the lumen. That produces the inversion this disease is known for: a marked and persistent blood neutrophilia sitting alongside a tissue compartment that is effectively neutropenic, so infections are severe and necrotic yet form no pus, and wounds do not repair. Delayed separation of the umbilical cord with omphalitis is often the first sign.

  Severity tracks residual CD18 quantitatively rather than categorically - under 2% of expected neutrophil CD18 expression defines the severe phenotype and 2-30% the moderate one - and the periodontal literature shows attachment loss scaling inversely with whatever CD18 remains. The periodontal arm is curated as its own branch because the mechanism is not the one that was assumed for decades. It is not unchecked infection in a tissue no neutrophil can police; it is an IL-23/IL-17 response that has lost its off switch, because the signal that normally damps it - tissue macrophages clearing transmigrated apoptotic neutrophils - never arrives. That distinction is therapeutic, not semantic: antibiotics and mechanical debridement do not control it, while blocking the axis with ustekinumab did.

  Allogeneic HSCT is the established curative option for severe disease, and autologous lentiviral ITGB2 gene therapy has now reported a phase 1-2 result. LAD1 is the adhesion arm of the leukocyte adhesion deficiency family; the sibling entry Leukocyte Adhesion Deficiency Type II is a different lesion entirely - an SLC35C1 Golgi GDP-fucose transport failure that removes the selectin ligands and so blocks the rolling step upstream of the one that fails here.'

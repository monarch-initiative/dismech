genetic:
- name: ITGB2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ITGB2
    term:
      id: hgnc:6155
      label: ITGB2
  notes: >-
    ITGB2 at 21q22.3 encodes CD18, the beta-2 integrin subunit. Two things about the
    allelic spectrum matter clinically. First, the severity gradient is quantitative -
    residual surface CD18 sets the phenotype, and the same gene produces everything from
    neonatal lethal disease to a presentation deferred into adolescence. Second, reduced
    surface expression is the usual but not the only mechanism: a normal amount of
    non-functional protein occurs, which is why the consensus recommends CD11a/CD11b
    measurement and ITGB2 sequencing alongside CD18 flow cytometry rather than relying on
    the CD18 number alone. Most missense variants fall in the conserved betaI domain encoded
    by exons 5-9, which carries the ligand-binding MIDAS motif.
  evidence:
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In LAD-I, mutations are found in ITGB2, the gene that encodes the β subunit of the β(2) integrins."
    explanation: The gene-disease assignment from the curated mutation compendium for this disease.
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Usually, this leads to the absence or decreased expression of the β2 integrins on the leukocyte surface, but sometimes a normal expression of nonfunctional β2 integrins is found."
    explanation: The exception that makes CD18 flow cytometry alone insufficient - normal expression of non-functional receptor.
  - reference: PMID:22134107
    reference_title: "Hematologically important mutations: leukocyte adhesion deficiency (first update)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most of the point mutations are found in a ~240-residue domain that is highly conserved in all β integrin subunits and coded for by exons 5 – 9 of ITGB2"
    explanation: The variant distribution across the gene, which is what makes exons 5-9 the high-yield region on sequencing.

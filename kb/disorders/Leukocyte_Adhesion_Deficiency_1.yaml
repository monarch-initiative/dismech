has_subtypes:
- name: Severe
  display_name: Severe LAD-I (<2% CD18)
  description: >-
    Under 2% of expected neutrophil CD18 expression, or at least 2% CD18 with under 2% CD11a
    and/or CD11b. About two thirds of patients in the largest series. Without definitive
    therapy the annual risk of life-threatening infection persists or increases year on year,
    and the consensus is explicit that surviving past two years on supportive care alone is
    not a marker of milder disease. This is the group for whom allogeneic HSCT or gene
    therapy is recommended.
  evidence:
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe LAD-I is defined as <2% of expected PMN CD18 expression, or ≥2% of expected PMN CD18 expression and <2% of expected PMN CD11a and/or CD11b expression."
    explanation: The consensus definition of this subtype, including the CD11a/CD11b arm that catches patients whose CD18 number alone would misclassify them.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with severe LAD-I with history of significant morbidity and who receive BSC alone (ie, in absence of definitive therapy), survival beyond 2 years of age is not marker of milder disease."
    explanation: The prognostic point that distinguishes this subtype from moderate disease - survival is not evidence of a milder phenotype.
- name: Moderate
  display_name: Moderate LAD-I (2-30% CD18)
  description: >-
    2-30% of expected neutrophil CD18 expression with at least 2% CD11a and/or CD11b. About
    a third of patients. The clinical course is milder and can be deferred - splice-site
    variants with delayed symptom onset are described - but it is not static, and the
    consensus asks for routine reassessment because a moderate patient can progress to meet
    severe criteria. Residual CD18 does not spare the periodontium proportionally: attachment
    loss scales inversely with whatever CD18 remains, so moderate patients still develop
    severe periodontal disease.
  evidence:
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Moderate LAD-I is defined as 2-30% of expected PMN CD18 expression.
    explanation: The consensus definition of this subtype.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Severity of LAD-I is considered on spectrum and can progress. Hence, patients with moderate LAD-I should be routinely reassessed."
    explanation: Establishes that the subtype boundary is a point on a spectrum that patients can cross, which is why this is curated as a graded subtype rather than a fixed one.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    The established curative treatment for severe LAD-I, replacing the patient's
    CD18-deficient haematopoiesis with donor cells that express functional beta-2 integrins.
    The largest outcome series is an EBMT registry cohort of 84 LAD-I and LAD-III patients
    transplanted between 2007 and 2017, with 3-year overall survival of 83%. The
    event-free figure is considerably lower and is where the real difficulty lies: 17% graft
    failure at 3 years and 24% grade II-IV acute GVHD at 100 days, with acute GVHD a
    significant risk factor for death. Outcomes are better in younger patients, which is why
    the consensus asks for transplantation as soon as possible after diagnosis and ideally
    at or before 13 months of age. The registry authors argue that LAD's own inflammatory
    component contributes to these transplant complications, which is the rationale for
    anti-inflammatory pretreatment.
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Failed Beta-2 Integrin Heterodimer Assembly
    description: Donor-derived leukocytes carry wild-type ITGB2, so the assembly defect is replaced rather than bypassed - which is why the correction is durable and why the entire downstream chain resolves together.
    evidence:
    - reference: PMID:24670684
      reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: successful bone marrow transplantation in LAD-I patients reverses the periodontal disease phenotype
      explanation: A downstream node of the pathograph reversing after transplantation, which is the clinical demonstration that correcting the molecular lesion corrects the chain.
  evidence:
  - reference: PMID:33570653
    reference_title: Allogeneic hematopoietic stem cell transplantation in leukocyte adhesion deficiency type I and III.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The curative treatment of LAD-I and LAD-III is allogeneic hematopoietic stem cell transplantation (allo-HSCT).
    explanation: States allo-HSCT as the curative treatment for this disease.
  - reference: PMID:33570653
    reference_title: Allogeneic hematopoietic stem cell transplantation in leukocyte adhesion deficiency type I and III.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3-year overall survival estimate (95% confidence interval [CI]) was 83% (74-92) for the entire cohort: 84% (75-94) and 75% (50-100) for LAD-I and LAD-III, respectively."
    explanation: The survival outcome from the largest transplant series in this disease.
  - reference: PMID:33570653
    reference_title: Allogeneic hematopoietic stem cell transplantation in leukocyte adhesion deficiency type I and III.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed cumulative incidences (95% CI) of graft failure (GF) at 3 years of 17% (9%-26%) and grade II to IV acute graft-versus-host disease (aGVHD) at 100 days of 24% (15%-34%)."
    explanation: The complication rates, which are the reason this is curative but not straightforward and why gene therapy is being developed.
  - reference: PMID:37492921
    reference_title: Clinical and immunological characteristics of 69 leukocyte adhesion deficiency-I patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall survival of patients with and without hematopoietic stem cell transplantation was 79.3% and 55.6%, respectively."
    explanation: A within-cohort comparison of transplanted against non-transplanted patients. Note this is an observational contrast, not a randomised one, so selection effects are not excluded.
- name: Autologous Lentiviral ITGB2 Gene Therapy (Marnetegragene Autotemcel)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Autologous CD34+ haematopoietic stem cells transduced ex vivo with a self-inactivating
    lentiviral vector carrying human ITGB2, given after myeloablative busulfan conditioning.
    The point of the approach is that it removes the two problems that limit allogeneic
    transplantation in this disease - donor availability and alloreactivity - and the phase
    1-2 result bears that out: nine children with severe LAD-I, no graft failure, no adverse
    events attributed to the gene therapy itself, and 100% HSCT-free survival at one year.
    Serious adverse events were attributable to the busulfan conditioning rather than to the
    product, which is the expected pattern and the remaining cost of the approach.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Biallelic ITGB2 Loss-of-Function Variants
    description: Adds a functional ITGB2 transgene to the patient's own stem cells, correcting the initiating lesion in situ rather than replacing the haematopoietic system.
    evidence:
    - reference: PMID:40305711
      reference_title: Lentiviral Gene Therapy for Severe Leukocyte Adhesion Deficiency Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a gene therapy of autologous CD34+ hematopoietic stem cells transduced with a self-inactivating lentiviral vector containing human ITGB2"
      explanation: Describes the product as delivering ITGB2 itself, which is what makes this an intervention on the initiating node.
  evidence:
  - reference: PMID:40305711
    reference_title: Lentiviral Gene Therapy for Severe Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HSCT-free survival was 100% (95% confidence interval [CI], 66 to 100) at 1 year after infusion (P<0.001)."
    explanation: The primary efficacy result of the phase 1-2 study.
  - reference: PMID:40305711
    reference_title: Lentiviral Gene Therapy for Severe Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serious adverse events related to myeloablative busulfan conditioning were observed. No adverse events attributed to gene therapy were reported. None of the patients had graft failure."
    explanation: The safety profile, and the attribution of serious events to conditioning rather than to the product.
  - reference: PMID:40305711
    reference_title: Lentiviral Gene Therapy for Severe Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, lentiviral vector-transduced autologous CD34+ HSCT was successful in treating severe LAD-I."
    explanation: The authors' conclusion. Note the cohort is nine children with 24 months of follow-up, so this establishes feasibility and short-term efficacy rather than equivalence to allogeneic transplantation.
- name: IL-12/IL-23 p40 Blockade with Ustekinumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    Ustekinumab binds the p40 subunit shared by IL-12 and IL-23 and so shuts down the
    IL-23-driven IL-17 response that produces the periodontal and cutaneous
    immunopathology. This is a mechanism-directed treatment rather than an empirical one -
    the target was chosen from the observation that LAD1 lesions carry an IL-23/IL-17
    signature and that blocking that axis prevents bone loss in the corresponding mouse
    model. In the index case, psoriasis dosing produced resolution of refractory gingival
    inflammation and complete healing of a two-year non-healing sacral wound within 10 to 14
    months. The 2026 consensus now recommends anti-inflammatory therapy of this kind as part
    of supportive care, and before transplantation to help engraftment.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
  target_mechanisms:
  - target: Dysregulated IL-23/IL-17 Axis at Barrier Sites
    description: Blocks the shared p40 subunit, removing the IL-23 signal that drives the IL-17 response. It treats the disinhibited inflammatory arm and does nothing for the adhesion defect itself, so it is adjunctive rather than definitive.
    evidence:
    - reference: PMID:28328326
      reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Levels of tissue markers of inflammation, such as interleukin-23 and interleukin-17, went from being very high relative to levels found in volunteers with healthy gingiva and patients with chronic periodontitis"
      explanation: Shows the drug acting on the node it targets, measured in the tissue rather than inferred from the clinical response.
  evidence:
  - reference: PMID:28328326
    reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 1 year of therapy, our patient had resolution of his inflammatory lesions without serious infections or adverse reactions."
    explanation: The clinical outcome in the index case, with the safety observation that matters most in an immunodeficient patient.
  - reference: PMID:28328326
    reference_title: Interleukin-12 and Interleukin-23 Blockade in Leukocyte Adhesion Deficiency Type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By 10 to 14 months, the wound was completely healed with minimal residual scarring"
    explanation: Healing of a wound that had progressed for two years through antibiotics and repeated debridement, which is the strongest single observation in the report.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For all patients with LAD-I, anti-inflammatory therapy (eg, ustekinumab) should be prescribed as part of supportive care to treat dysregulated hyperinflammatory component of disease pathology (eg, chronic inflammation)."
    explanation: Moves this from a single case report to a consensus recommendation, which is why it is curated as a treatment rather than as an experimental observation.
  notes: >-
    The evidence base is one published index case plus expert consensus, not a trial. The
    2017 report itself notes that treatment of additional patients is needed to clarify the
    role of the drug and its long-term safety in patients who are already immunodeficient.
- name: Antimicrobial Prophylaxis and Aggressive Infection Management
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Continuous antibacterial and antifungal prophylaxis, with hospital-based aggressive
    management and often prolonged or repeated courses for intercurrent infection.
    Trimethoprim-sulfamethoxazole is the prophylactic agent in the published cases. This is
    the standard of care while awaiting definitive therapy, and its limits are well
    documented - prophylaxis since infancy did not prevent progressive periodontal disease in
    any patient in the characterised cohort, because the periodontal arm is inflammatory
    rather than infective.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim-sulfamethoxazole
      term:
        id: CHEBI:3770
        label: co-trimoxazole
  target_mechanisms:
  - target: Pus-Free Necrotic Bacterial and Fungal Infection
    description: Reduces microbial burden to compensate for the missing neutrophil response. It does not restore neutrophil delivery, so it is compensatory rather than corrective.
  evidence:
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with severe LAD-I require prophylactic antimicrobials (ie, antibiotics, antifungals)."
    explanation: The consensus recommendation for universal antimicrobial prophylaxis in severe disease.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infections in patients with severe LAD-I often require prolonged antimicrobial treatment, including multiple courses of antimicrobials."
    explanation: Characterises the intensity of treatment required, which is part of the burden of illness this entry records.
  - reference: PMID:24670684
    reference_title: Defective neutrophil recruitment in leukocyte adhesion deficiency type I disease causes local IL-17-driven inflammatory bone loss.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed progressive periodontal disease in all patients evaluated, despite prophylactic antibiotic use since infancy and access to dental care."
    explanation: Refutes any claim that antimicrobial prophylaxis controls the periodontal arm of the disease. Recorded here rather than omitted because the limit of this treatment is clinically load-bearing - it is what motivates the anti-inflammatory approach.
- name: Genetic Counselling and Prenatal Diagnosis
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive inheritance carries a 25% recurrence risk per pregnancy for carrier
    couples. Because consanguinity is common in the reported families and ITGB2 sequencing is
    established, carrier testing and prenatal or preimplantation diagnosis are informative
    where the family allele is known. Molecular confirmation also has a direct therapeutic
    consequence here: genetic diagnosis is best practice before allogeneic transplantation
    and mandatory before gene therapy.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37492921
    reference_title: Clinical and immunological characteristics of 69 leukocyte adhesion deficiency-I patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the prenatal diagnosis would benefit families with a history of LAD-I."
    explanation: The cohort study's own recommendation for prenatal diagnosis in affected families.
diagnosis:
- name: Neutrophil Integrin Flow Cytometry (CD18, CD11a, CD11b)
  description: >-
    Flow cytometry of peripheral neutrophils for CD18 together with CD11a and CD11b. This
    is both the diagnostic test and the severity classifier. The expanded panel is not
    redundancy: a patient can have at least 2% CD18 yet under 2% CD11a or CD11b, and the
    consensus counts that combination as severe disease - so measuring CD18 alone
    misclassifies exactly the patients for whom the classification decides whether to
    transplant.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In best clinical practice, PMN CD18, CD11a, and/or CD11b expression should be measured as part of diagnosing and differentiating between moderate and severe LAD-I."
    explanation: The consensus statement specifying which markers to measure and why.
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Without routine newborn screening for LAD-I, flow cytometry to assess leukocyte integrin expression is typically prompted by presentation of early signs or symptoms"
    explanation: Establishes flow cytometry as the entry point to diagnosis and notes there is no newborn screening pathway, which is why diagnostic delay is the norm.
- name: ITGB2 Sequencing
  description: >-
    Molecular confirmation by sequencing ITGB2. Required rather than optional in two
    situations - when flow cytometry is equivocal or shows normal expression of
    non-functional protein, and before gene therapy, where the consensus makes genetic
    confirmation mandatory. It also enables prenatal and carrier testing in the family.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:42011429
    reference_title: "International clinical consensus on leukocyte adhesion deficiency-I: Modified Delphi analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic testing in conjunction with flow cytometry is ideal in confirmation of LAD-I diagnosis."
    explanation: The consensus position on pairing sequencing with flow cytometry.
  - reference: PMID:37492921
    reference_title: Clinical and immunological characteristics of 69 leukocyte adhesion deficiency-I patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis of the patients revealed 14 previously reported and three novel pathogenic mutations in the ITGB2 gene."
    explanation: Demonstrates ITGB2 sequencing yielding molecular diagnoses in a clinical cohort, including novel variants.

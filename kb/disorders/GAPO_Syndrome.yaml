genetic:
- name: ANTXR1
  gene_term:
    preferred_term: ANTXR1
    term:
      id: hgnc:21014
      label: ANTXR1
  relationship_type: CAUSATIVE
  notes: >-
    ANTXR cell adhesion molecule 1, at 2p13.3, encoding a matrix-interacting adhesion
    protein. It is better known as anthrax toxin receptor 1 — the name records what it
    was first found doing, not what it does — and biallelic loss of function causes
    GAPO syndrome.

    The allelic spectrum spans nonsense, splice, frameshift and missense variants, all
    reported homozygous. One of them is mechanistically distinctive: the splice change
    c.1435-12A>G theoretically encodes a truncated protein with a 118-residue
    neopeptide at its C terminus, which is a different molecular event from
    nonsense-mediated decay even if the clinical result is the same.
  variants:
  - name: c.262C>T (p.Arg88*) and c.505C>T (p.Arg169*)
    description: >-
      Homozygous nonsense variants in the founding cohort, predicted to trigger
      nonsense-mediated mRNA decay and so to abolish the protein.
  - name: c.1435-12A>G (p.Gly479Phefs*119)
    description: >-
      A splicing variant that theoretically encodes a truncated ANTXR1 carrying a
      neopeptide of 118 unique amino acids at its C terminus.
  - name: c.1220_1221insT (p.Ala408Cysfs*2), c.411A>G (p.Gln137Gln), c.1150G>A (p.Gly384Ser)
    description: >-
      Three novel homozygous variants — frameshift, splice site and non-synonymous —
      found by whole exome sequencing in three Turkish kindreds.
  - name: c.410A>T (p.Q137L)
    description: >-
      A missense variant found homozygous in two siblings.
  evidence:
  - reference: PMID:23602711
    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The transcript with the splicing mutation theoretically encodes a truncated
      ANTXR1 containing a neopeptide composed of 118 unique amino acids in its C
      terminus.
    explanation: >-
      The distinctive consequence of the splice allele. "Theoretically" is the source's
      word and the protein was not measured.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing analysis identified three novel homozygous mutations including;
      one frame-shift (c.1220_1221insT; p.Ala408Cysfs*2), one splice site (c.411A>G;
      p.Gln137Gln), and one non-synonymous (c.1150G>A; p.Gly384Ser) mutation in the
      ANTXR1 gene.
    explanation: Three further alleles, expanding the spectrum beyond nonsense variants.
  - reference: PMID:27587992
    reference_title: "New ANTXR1 Gene Mutation for GAPO Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation produces the substitution of a glutamine in position 137 for a
      leucine (c.410A>T, p.Q137L).
    explanation: A missense allele in two homozygous siblings.

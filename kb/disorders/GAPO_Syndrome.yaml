- category: Ophthalmologic
  name: Optic atrophy
  description: >-
    The O of the acronym, and the feature the acronym describes worst. Two things are
    wrong with reading the name as a frequency claim. First, the sources disagree on
    what the feature is: the founding paper says "progressive visual impairment" where
    later sources say "progressive optic atrophy", and those are not synonyms, one being
    a symptom and the other a finding. Second, and more importantly, the ophthalmologic
    literature does not find optic atrophy consistent, and the six-patient cohort
    curated here scored it positive in one patient, negative in three and not done in
    two. Glaucoma, which is not in the acronym, was positive in four of the same six.
    The frequency band therefore follows the cohort and not the name.
  phenotype_term:
    preferred_term: Progressive optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      GAPO syndrome (OMIM#230740) is the acronym for growth retardation, alopecia,
      pseudoanodontia, and optic atrophy.
    explanation: >-
      Optic atrophy as the fourth letter of the acronym. This establishes that the
      feature is named, and nothing more; it is not evidence of how often it is
      present, which is a different question and is answered by the two items below.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As Ilker et al. noted that optic atrophy is not a consistent feature of this
      disorder, we also detected optic atrophy in only one of our cases.
    explanation: >-
      The frequency, stated twice in one sentence: the ophthalmologic literature does
      not find optic atrophy consistent, and this cohort found it in one of six. That is
      what sets the band on this phenotype, against the acronym rather than with it.
  - reference: PMID:25045128

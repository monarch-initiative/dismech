inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ANTXR1 variants are required, and every reported genotype has been
    homozygous — four ethnically unrelated individuals in the founding report, and
    five individuals from three Turkish kindreds in the exome study that followed.
    The pattern was recognised as autosomal recessive from pedigrees long before the
    gene was found.
  evidence:
  - reference: PMID:23602711
    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied four ethnically unrelated affected individuals and identified
      homozygous nonsense mutations
    explanation: >-
      The founding genetic result: four unrelated individuals, all homozygous, which is
      what establishes the recessive requirement rather than a founder effect. The
      quote stops before the variant list because the reference validator strips
      bracketed spans before matching and each variant carries a bracketed protein
      change; the alleles themselves are recorded under genetic[].variants.
  - reference: PMID:27587992
    reference_title: "New ANTXR1 Gene Mutation for GAPO Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, gene alterations in the ANTXR1 gene have been reported to be
      causative of this disorder, and an autosomal recessive pattern has been observed.
    explanation: >-
      Independent confirmation of the inheritance pattern. Stated as established
      background in this case report rather than derived here.
    quote_role: BACKGROUND
prevalence:
- population: Cases reported worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Roughly 30 to 35 cases in the world literature, depending on the review. Two
    sources in this entry give slightly different counts a couple of years apart —
    about 35 in 2014 and about 30 in 2016 — which is the ordinary noise of counting
    case reports rather than a discrepancy worth resolving. No population prevalence
    has been published.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      About 35 cases have been reported, making it among one of the rarest recessive
      conditions.
    explanation: >-
      The published case count and the source's own characterisation of the rarity.
    quote_role: BACKGROUND
  - reference: PMID:27587992
    reference_title: "New ANTXR1 Gene Mutation for GAPO Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To date, only 30 cases have been described worldwide.
    explanation: >-
      An independent count from two years later, quoted so the imprecision in the
      literature is visible rather than averaged away.
    quote_role: BACKGROUND
progression:
- phase: Progressive course of the ocular and hair features
  notes: >-
    Two of the four cardinal features are described as progressive rather than
    congenital and static: the visual impairment and, in the acronym's original
    framing, the optic atrophy. The growth retardation and the failure of tooth
    eruption are established early. Reported patients have normal intellectual
    development.
  evidence:
  - reference: PMID:23602711
    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic cause of GAPO syndrome, a condition characterized by growth
      retardation, alopecia, pseudoanodontia, and progressive visual impairment, has
      not previously been identified.
    explanation: >-
      Names the visual impairment as progressive. Note this source says "progressive
      visual impairment" where others say "progressive optic atrophy"; the difference
      is discussed in this entry's notes.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      All reported individuals have normal intellectual development and the vast
      majority demonstrates no remarkable biochemical or endocrinologic abnormalities.
    explanation: >-
      The negative findings, which matter for counselling and for distinguishing GAPO
      from syndromes it resembles facially.
- phase: Visceral involvement and premature death
  notes: >-
    GAPO is not a disorder of appearance alone and its published course includes death
    in childhood and in adult life from visceral causes. One patient in the cohort
    curated here died at 37 of central apnoea and respiratory insufficiency, and a
    separately reported patient died at 17 months of pulmonary hypertension. Pulmonary
    involvement is named as one of the life-span reducing manifestations. Nothing
    located establishes a survival distribution, and with roughly 30 published cases
    nothing is likely to; these are two reported deaths, recorded as such.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical follow up of our families revealed that patient BAB5349 died at age 37
      due to central apnea and respiratory insufficiency.
    explanation: >-
      The death in the cohort, with its age and its cause. BAB5349 is the oldest patient
      in the table and the only one in whom the disorder's late course is observed at
      all.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pulmonary involvement is one of the life-span reducing visceral manifestations
      present in patients with GAPO syndrome and reported in a GAPO patient who had
      pulmonary hypertension that lead to death at the age of 17 months
    explanation: >-
      The second death, from the wider literature, and the source's own characterisation
      of pulmonary involvement as life-span reducing. The two deaths are 35 years apart
      in age, which is why no phase in this entry claims a typical course.
pathophysiology:
- name: ANTXR1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ANTXR1 variants remove or truncate a matrix-interacting protein that
    works as an adhesion molecule. The reported alleles are mechanistically varied:
    nonsense changes predicted to trigger nonsense-mediated decay and so abolish the
    protein, and a splice change that theoretically encodes a truncated protein
    carrying a 118-residue neopeptide at its C terminus. Whether the neopeptide
    allele behaves as a plain null or has an additional effect is not resolved.
  genes:
  - preferred_term: ANTXR1
    term:
      id: hgnc:21014
      label: ANTXR1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Actin Cytoskeletal Disorganisation
    causal_link_type: DIRECT
    description: >-
      ANTXR1 links the extracellular matrix to the cytoskeleton, so patient
      fibroblasts show a disordered actin microfilament pattern.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        Immunofluorescence analysis of cultured skin fibroblasts collected from GAPO
        cases demonstrated an aberrant pattern of actin cytoskeletal microfilament
        organization.
      explanation: >-
        The cytoskeletal observation in patient cells. This paper is restating the
        founding study's result in its own introduction rather than repeating the
        experiment.
  - target: Extracellular Matrix Accumulation
    causal_link_type: DIRECT
    description: >-
      The founding study's conclusion is that ANTXR1 loss produces a generalized
      defect in extracellular-matrix homeostasis, with accumulation as the observed
      consequence.
    evidence:
    - reference: PMID:23602711
      reference_title: Mutations in ANTXR1 cause GAPO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Thus, we propose that mutations affecting ANTXR1 function are responsible for
        this disease's characteristic generalized defect in extracellular-matrix
        homeostasis.
      explanation: >-
        The authors' proposal, quoted as a proposal. It is the organising hypothesis of
        this entry and is not stated more strongly than its source states it.
  evidence:
  - reference: PMID:23602711
    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The nonsense mutations predictably trigger nonsense-mediated mRNA decay,
      resulting in the loss of ANTXR1.
    explanation: >-
      The molecular consequence of the nonsense alleles. "Predictably" is the source's
      word — this is an inference from the variant class, not a measurement.
  - reference: PMID:27587992
    reference_title: "New ANTXR1 Gene Mutation for GAPO Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      This gene encodes a matrix-interacting protein that works as an adhesion molecule.
    explanation: The protein's function, which is what makes the matrix the site of the lesion.
- name: Actin Cytoskeletal Disorganisation
  biological_scale: CELLULAR
  description: >-
    Cultured skin fibroblasts from GAPO patients show an aberrant pattern of actin
    microfilament organisation. This is the cellular observation that connects the
    loss of an adhesion molecule to a failure of matrix handling, since matrix
    turnover depends on cells being able to engage and remodel it.
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    modifier: DECREASED
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Extracellular Matrix Accumulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The inference from disordered cytoskeleton to matrix accumulation is the
      founding study's, and is described in a later paper as strongly suggested rather
      than demonstrated. The intervening steps are not identified.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: >-
        This observation strongly suggested that loss of ANTXR1 function results in
        progressive extracellular-matrix accumulation that is observed in patients with
        GAPO syndrome
      explanation: >-
        The word "suggested" is the reason this edge is not typed DIRECT. The
        observation supports the link through an inferential step rather than
        demonstrating it.
- name: Extracellular Matrix Accumulation
  biological_scale: TISSUE
  description: >-
    Unresorbed extracellular matrix accumulates in connective tissue. This is the
    node the syndrome's coherence rests on: it is what the Antxr1-mutant mouse shows
    alongside the dental phenotype, and it is offered as the explanation for the
    involvement of cardiovascular, skeletal, cerebrovascular, pulmonary and auditory
    systems in reported patients — all of which are connective-tissue territories.
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DYSREGULATED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Eruption failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Teeth that have formed cannot erupt through connective tissue that is not being
      cleared. This is the feature the matrix hypothesis explains best, and the one
      the mouse reproduces.
    evidence:
    - reference: PMID:23602711
      reference_title: Mutations in ANTXR1 cause GAPO syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        GAPO syndrome's major phenotypic features, which include dental abnormalities
        and the accumulation of extracellular matrix, recapitulate those found in
        Antxr1-mutant mice and point toward an underlying defect in extracellular-matrix
        regulation.
      explanation: >-
        Pairs the dental phenotype with the matrix accumulation in the same mutant
        animal, which is the strongest evidence that the two are connected.
  - target: Growth delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Alopecia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Thickened eyelids
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Subcutaneous accumulation increasing with age is what the source reports
      coarsening the face, and the eyelid is the thinnest subcutaneous compartment in
      it. The intermediate is named, which is the accumulation itself; what is not
      established is why the eyelid is affected in every patient when other subcutaneous
      sites are not scored at all.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Another remarkable finding in our patients is increased subcutaneous
        accumulations with age that results in an apparent coarsening of facial features
      explanation: >-
        Ties the facial thickening directly to accumulation, and ties it to time. It is
        the observation that makes the facial features of this syndrome a consequence of
        the matrix node rather than an independently dysmorphic gestalt.
  - target: Thick lips
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same accumulation, at the other soft-tissue site the cohort table scores.
      Eyelids and lips are both positive in all six patients, which is what a
      generalised subcutaneous process predicts and what a patterning defect would not.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Another remarkable finding in our patients is increased subcutaneous
        accumulations with age that results in an apparent coarsening of facial features
      explanation: >-
        The same sentence, cited for the lip half of the facial thickening. One
        observation supports both edges because the source does not separate them.
  - target: Delayed closure of the anterior fontanel
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The knock-out mouse shows matrix excess specifically at the cranial sutures, which
      is the named intermediate between the matrix node and a fontanel that closes late.
      The mouse is not reported to have a patent fontanel, so this edge rests on the
      site of the lesion rather than on a reproduced phenotype.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In an Antxr1 knock-out mouse model a mild to moderate increase of extracellular
        matrix (especially collagen) has been observed in many tissues including: the
        skin (basal aspects of the hair follicles), endometrium, ovaries, periosteum of
        femurs and vertebra, cranial sutures of the skull, and the periodontal ligament
        of the incisors that leads to misalignment and dental dysplasia
      explanation: >-
        Puts the matrix excess at the cranial sutures in the model organism. That
        localisation is what distinguishes this edge from the several other craniofacial
        features, which have no site-specific finding behind them at all.
  - target: Optic atrophy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A route is proposed, and it is a mechanical one: matrix accumulating around the
      optic nerve, together with thickening of the surrounding dura, physically
      compresses it. That names the intermediate, which is why this edge is typed with
      known intermediates rather than unknown ones. What the proposal does not do is
      explain the course or the frequency, since a compressive lesion that accumulates
      with age fits a progressive deficit but not a feature absent in most patients.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is concluded that optic nerve pathologies are observed potentially secondary
        to physical compression of the optic nerve by the accumulation of extracellular
        matrix and thickening of the dura matter surrounding the optic nerve
      explanation: >-
        The proposed intermediate, in the source's own words. Note the hedge:
        "potentially secondary to", carried over three older citations, and the authors
        conclude it rather than demonstrate it. That is enough to name an intermediate
        and not enough to type the edge DIRECT.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients with GAPO syndrome demonstrate abnormalities of the cardiovascular
    explanation: >-
      The opening of this source's summary of multi-system involvement, which it goes on
      to attribute to connective tissue. The quote is short because the full sentence
      interleaves per-system citation markers that the reference validator strips before
      matching; the systems listed are cardiovascular, skeletal, cerebrovascular,
      pulmonary and auditory, and this entry's description carries them.

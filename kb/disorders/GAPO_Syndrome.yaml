    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      GAPO syndrome's major phenotypic features, which include dental abnormalities
      and the accumulation of extracellular matrix, recapitulate those found in
      Antxr1-mutant mice and point toward an underlying defect in extracellular-matrix

genetic:
- name: ANTXR1
  gene_term:
    preferred_term: ANTXR1
    term:
      id: hgnc:21014
      label: ANTXR1
  relationship_type: CAUSATIVE
  notes: >-
    ANTXR cell adhesion molecule 1, at 2p13.3, encoding a matrix-interacting adhesion
    protein. It is better known as anthrax toxin receptor 1 — the name records what it
    was first found doing, not what it does — and biallelic loss of function causes
    GAPO syndrome.

    The allelic spectrum spans nonsense, splice, frameshift and missense variants, all
    reported homozygous. One of them is mechanistically distinctive: the splice change
    c.1435-12A>G theoretically encodes a truncated protein with a 118-residue
    neopeptide at its C terminus, which is a different molecular event from
    nonsense-mediated decay even if the clinical result is the same.
  variants:
  - name: c.262C>T (p.Arg88*) and c.505C>T (p.Arg169*)
    description: >-
      Homozygous nonsense variants in the founding cohort, predicted to trigger
      nonsense-mediated mRNA decay and so to abolish the protein.
  - name: c.1435-12A>G (p.Gly479Phefs*119)
    description: >-
      A splicing variant that theoretically encodes a truncated ANTXR1 carrying a
      neopeptide of 118 unique amino acids at its C terminus.
  - name: c.1220_1221insT (p.Ala408Cysfs*2), c.411A>G (p.Gln137Gln), c.1150G>A (p.Gly384Ser)
    description: >-
      Three novel homozygous variants — frameshift, splice site and non-synonymous —
      found by whole exome sequencing in three Turkish kindreds.
  - name: c.410A>T (p.Q137L)
    description: >-
      A missense variant found homozygous in two siblings.
  evidence:
  - reference: PMID:23602711
    reference_title: Mutations in ANTXR1 cause GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The transcript with the splicing mutation theoretically encodes a truncated
      ANTXR1 containing a neopeptide composed of 118 unique amino acids in its C
      terminus.
    explanation: >-
      The distinctive consequence of the splice allele. "Theoretically" is the source's
      word and the protein was not measured.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing analysis identified three novel homozygous mutations including;
      one frame-shift (c.1220_1221insT; p.Ala408Cysfs*2), one splice site (c.411A>G;
      p.Gln137Gln), and one non-synonymous (c.1150G>A; p.Gly384Ser) mutation in the
      ANTXR1 gene.
    explanation: Three further alleles, expanding the spectrum beyond nonsense variants.
  - reference: PMID:27587992
    reference_title: "New ANTXR1 Gene Mutation for GAPO Syndrome: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation produces the substitution of a glutamine in position 137 for a
      leucine (c.410A>T, p.Q137L).
    explanation: A missense allele in two homozygous siblings.
animal_models:
- species: Mouse
  genotype: Antxr1 mutant
  publication: PMID:23602711
  description: >-
    The Antxr1-mutant mouse reproduces the dental abnormalities and the
    extracellular-matrix accumulation. It is the evidence that makes the matrix
    hypothesis more than an interpretation of a fibroblast stain, because it shows the
    two features arising together from the same lesion in an animal.
  modeled_mechanisms:
  - target: Extracellular Matrix Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows extracellular-matrix accumulation together with the dental phenotype,
      which is the pairing the human matrix hypothesis rests on.
    limitations: >-
      The tissues assessed are enumerated and the ocular system is not among them. The
      knock-out shows a mild to moderate matrix increase in skin at the basal aspects of
      the hair follicles, endometrium, ovaries, periosteum of femur and vertebra,
      cranial sutures, and the periodontal ligament of the incisors, where it produces
      misalignment and dental dysplasia. Two limits follow. The increase is graded mild
      to moderate, against a human phenotype severe enough to prevent tooth eruption
      entirely and to coarsen the face with age. And nothing reports an optic nerve, a
      retinal or a hair-loss finding in the mouse, so the model speaks to the dental and
      connective-tissue arm and is silent on the two human features this entry types as
      least well explained.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The enumerated tissues cover skin, reproductive tract, bone, cranial sutures and
        periodontal ligament. Neither the optic nerve nor hair loss appears, so the two
        human features with the weakest mechanistic account in this entry are also the
        two the model does not report on.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The mouse matrix increase is graded mild to moderate. The human phenotype it is
        offered as a model of prevents tooth eruption outright, so the same lesion is
        producing quantitatively different tissue consequences in the two species.
    evidence:
    - reference: PMID:25045128
      reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In an Antxr1 knock-out mouse model a mild to moderate increase of extracellular
        matrix (especially collagen) has been observed in many tissues including: the
        skin (basal aspects of the hair follicles), endometrium, ovaries, periosteum of
        femurs and vertebra, cranial sutures of the skull, and the periodontal ligament
        of the incisors that leads to misalignment and dental dysplasia
      explanation: >-
        The tissue-by-tissue enumeration, which is what the limitations field now
        records. The periodontal ligament clause is the mechanistic core of the dental
        edge: matrix excess in the ligament produces misalignment and dental dysplasia
        in the mouse.
    - reference: PMID:23602711
      reference_title: Mutations in ANTXR1 cause GAPO syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        GAPO syndrome's major phenotypic features, which include dental abnormalities
        and the accumulation of extracellular matrix, recapitulate those found in
        Antxr1-mutant mice and point toward an underlying defect in extracellular-matrix
        regulation.
      explanation: >-
        The recapitulation claim and the inference the authors draw from it, in their
        own words.
discussions:
- discussion_id: gapo_craniofacial_gestalt
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a generalised matrix defect produce a specific and reproducible
    craniofacial pattern rather than diffuse thickening?
  attaches_to:
  - phenotypes#Relative macrocephaly
  - phenotypes#Depressed nasal bridge
  - phenotypes#Long philtrum
  - phenotypes#Micrognathia
  - phenotypes#Low-set ears
  rationale: >-
    Eleven craniofacial features are positive in all six patients of the cohort curated
    here, which is the reason the disorder is recognisable on sight. Two of them, the
    thickened eyelids and the thick lips, have a stated intermediate: subcutaneous
    accumulation increasing with age. The rest do not. Relative macrocephaly, a
    depressed nasal bridge, a long philtrum, micrognathia and low-set ears are
    proportions and positions, not thicknesses, and nothing located explains how
    unresorbed matrix produces them. They are left with no incoming edge rather than
    attached to the accumulation node, because a generalised accumulation predicts
    diffuse thickening and does not predict a reproducible pattern. Two possibilities
    are open and are not distinguished anywhere: that the matrix defect acts during
    craniofacial morphogenesis, where timing and site would make a pattern out of a
    generalised lesion, or that ANTXR1 has a developmental role separate from matrix
    turnover. The Antxr1 knock-out mouse is reported at the cranial sutures but no
    craniofacial morphometry is reported for it.
- discussion_id: gapo_optic_atrophy_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does optic nerve compression by accumulated matrix account for the ocular feature,
    given that it was present in only one of six patients?
  attaches_to:
  - phenotypes#Optic atrophy
  rationale: >-
    There is a stated account, and it is mechanical: matrix accumulating around the
    optic nerve, with thickening of the surrounding dura, compresses it. The gap is not
    that nobody has proposed a route. It is that the proposed route does not fit the two
    things that are actually observed. A compressive lesion produced by matrix that
    accumulates with age predicts a deficit that is progressive, which matches, but it
    also predicts a deficit that is close to universal in a disorder whose matrix defect
    is generalised, and optic atrophy was scored positive in one of six patients here
    and is described in the ophthalmologic literature as not a consistent feature.
    Glaucoma, which is not in the acronym, was more frequent in the same cohort. Either
    the compression is modified by something not identified, or some of what has been
    called optic atrophy in this syndrome is a different optic neuropathy, or the
    acronym has fixed attention on the wrong ocular feature. Nothing located
    distinguishes those.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is concluded that optic nerve pathologies are observed potentially secondary to
      physical compression of the optic nerve by the accumulation of extracellular
      matrix and thickening of the dura matter surrounding the optic nerve
    explanation: >-
      The proposed route, which the earlier version of this gap incorrectly said did not
      exist. It is quoted here so the gap is visibly about the fit of the proposal
      rather than about its absence.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      keratopathy in three patients (BAB5033, BAB5143, and BAB5349), myelinated retinal
      nerve fiber in two patients (BAB5141 and BAB5142) and glaucoma in four patients
      (BAB5033, BAB5143, BAB5348, and BAB5349) were observed as uncommon ophthalmic
      findings
    explanation: >-
      The observation the proposal has to accommodate: in this cohort glaucoma was
      present in four of six patients and keratopathy in three, while optic atrophy was
      present in one. A generalised matrix defect compressing the optic nerve does not
      obviously predict that ordering.
- discussion_id: gapo_neopeptide_allele
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the c.1435-12A>G splice allele behave as a null, or does its 118-residue
    neopeptide add an effect of its own?
  attaches_to:
  - genetic#ANTXR1
  rationale: >-
    The nonsense alleles are predicted to abolish the protein through nonsense-mediated
    decay, and the splice allele is predicted to produce a truncated protein carrying a
    novel C-terminal peptide, which is a different molecular event. The functional
    answer is partly in hand and narrows the question rather than leaving it open: all
    three of the originally reported alleles, the splice allele included, were confirmed
    to behave as null alleles in patient fibroblasts, and immunohistochemistry on
    patient fibroblast lines showed complete loss of the ANTXR1 isoform. What remains is
    narrower and is an assay question. An antibody raised against the normal isoform
    reporting its loss does not establish that no truncated neopeptide-bearing species
    is made, only that the isoform it detects is gone, and a species that is
    functionally null for adhesion could still do something else. With about 30 reported
    patients that distinction will not emerge from clinical correlation.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Interestingly, all of them produce null alleles as confirmed by functional studies
      with fibroblasts obtained from GAPO patients.
    explanation: >-
      The functional result that answers the first half of the question: the alleles
      were not only predicted to be null, they were confirmed null in patient cells.
      This is the sentence the earlier version of this rationale contradicted.
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      immunohistochemical studies performed on skin fibroblast cell lines obtained from
      GAPO syndrome patients demonstrated complete loss of the ANTXR1 isoform and
      remarkable alterations in the actin cytoskeletal network in affected fibroblasts
    explanation: >-
      The immunohistochemical half. It reports loss of the ANTXR1 isoform, which is why
      the residual question in this gap is about what the antibody could have detected
      rather than about whether the allele is functionally null.
- discussion_id: gapo_alopecia_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the alopecia a consequence of matrix accumulation in the dermis, or a separate
    developmental effect of ANTXR1 loss on the hair follicle?
  attaches_to:
  - phenotypes#Alopecia
  rationale: >-
    Alopecia with rarefaction of eyebrows and eyelashes is an ectodermal pattern, and
    the syndrome is classified among the ectodermal dysplasias for that reason, yet the
    proposed mechanism is mesenchymal. Hair follicle development depends on
    epithelial-mesenchymal signalling, so a dermal matrix defect could produce it, and
    one located source does put the matrix in the right place: in the Antxr1 knock-out
    mouse the extracellular-matrix excess is localised to the skin at the basal aspects
    of the hair follicles specifically, among several other tissues. That is a
    localisation, not a demonstration. No source reports whether that mouse loses hair,
    no source tests whether removing the peri-follicular matrix excess rescues anything,
    and the alternative that ANTXR1 has a follicle-intrinsic role is not excluded. The
    gap is therefore about the step from peri-follicular matrix accumulation to hair
    loss, not about whether anyone has looked at the follicle.
  evidence:
  - reference: PMID:25045128
    reference_title: Whole exome sequencing identifies three novel mutations in ANTXR1 in families with GAPO syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In an Antxr1 knock-out mouse model a mild to moderate increase of extracellular
      matrix (especially collagen) has been observed in many tissues including: the skin
      (basal aspects of the hair follicles), endometrium, ovaries, periosteum of femurs
      and vertebra, cranial sutures of the skull, and the periodontal ligament of the
      incisors that leads to misalignment and dental dysplasia
    explanation: >-
      The localisation. Among the tissues listed for the knock-out mouse, the skin entry
      is qualified as the basal aspects of the hair follicles, which is the
      peri-follicular compartment this gap is about. The same sentence carries the
      periodontal ligament finding that underpins the dental edge, so it is one
      observation supporting two very differently typed edges.
notes: >-
  The organising claim of this entry is the founding paper's: that GAPO is a
  generalized defect in extracellular-matrix homeostasis. It is quoted as a proposal
  because that is how its authors state it, and the entry's causal edges are typed to
  show how far it actually reaches.

  It reaches furthest for pseudoanodontia. The name carries the mechanistically
  important distinction — the teeth are formed and fail to erupt, which is not tooth
  agenesis — and that is exactly what a clearance defect predicts, and exactly what
  the Antxr1-mutant mouse reproduces alongside the matrix accumulation itself. That
  edge is INDIRECT_KNOWN_INTERMEDIATES. The multi-system connective-tissue involvement
  reported in case series is consistent with it.

  It reaches least far for the ocular features. A route to the optic atrophy is proposed
  and is mechanical, so that edge is typed INDIRECT_KNOWN_INTERMEDIATES; what the
  proposal does not account for is the frequency, and the knowledge gap on that
  phenotype is now about the fit of the compression account rather than about its
  absence. An earlier version of this entry asserted in four places that no source
  proposed any route, which was simply wrong: the sentence is in the cached full text of
  a reference the entry already cited. The entry had been curated from that paper's
  abstract while its full text and patient table sat in the repository, and the same
  mistake produced a VERY_FREQUENT band on a feature the same paper reports in one of
  six patients.

  Two smaller things a later editor should not silently tidy. First, the sources
  disagree about the fourth feature's name: the founding paper says "progressive visual
  impairment" while later sources say "progressive optic atrophy". They are not
  synonyms — visual impairment is the symptom and optic atrophy is a finding — and the
  binding follows the majority usage while the description records the discrepancy.
  Second, the case counts differ between sources (about 35 in 2014, about 30 in 2016).
  Both are quoted rather than averaged, because that is ordinary noise in counting case
  reports and hiding it would imply a precision the literature does not have.

  The gene's name is a historical accident worth knowing: ANTXR1 is anthrax toxin
  receptor 1, named for what it was first found doing rather than for its role here,
  which is as a matrix-interacting adhesion molecule.

  There is no treatments: and no diagnosis: section. Management of GAPO is supportive
  and no located source describes a disease-directed therapy, but that is not the reason
  for the absence: the deep-research run behind this entry stopped at section 8 of its
  template, before the diagnostics, prognosis and treatment sections, so those topics
  were never searched. The gap is an unsearched one rather than a searched and empty
  one, and a later curator should treat it that way.

  No GeneReviews chapter exists for GAPO syndrome; just check-genereviews reports
  NO_CHAPTER against the committed Bookshelf index.

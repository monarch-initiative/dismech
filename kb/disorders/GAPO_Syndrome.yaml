name: GAPO Syndrome
creation_date: "2026-09-17T15:30:00Z"
description: >-
  GAPO syndrome is the autosomal recessive disorder named for its four cardinal
  features — growth retardation, alopecia, pseudoanodontia and optic atrophy —
  caused by biallelic loss of ANTXR1, a matrix-interacting adhesion molecule better
  known as anthrax toxin receptor 1. Around 30 to 35 cases have been reported
  worldwide, which makes it one of the rarest recessive conditions, and its
  craniofacial appearance is distinctive enough that it is recognised clinically
  before it is confirmed genetically.

  The unifying lesion is a generalised defect in extracellular-matrix homeostasis.
  Reported ANTXR1 alleles are nonsense changes predicted to trigger
  nonsense-mediated decay, a splice change encoding a truncated protein with a
  118-residue neopeptide at its C terminus, and frameshift and missense variants.
  Cultured skin fibroblasts from patients show a disordered actin cytoskeleton, and
  Antxr1-mutant mice reproduce both the dental abnormalities and the
  extracellular-matrix accumulation — which is the argument that the matrix is where
  the four features converge rather than being four independent consequences of one
  gene.

  That argument is strong for the dental and connective-tissue features and weaker for
  the ocular ones, and this entry types its causal edges accordingly. Pseudoanodontia is
  the clearest instance: the teeth are formed but do not erupt, which is what the name
  means and what a matrix-clearance defect would predict. For the optic atrophy a route
  is proposed and it is mechanical, matrix and thickened dura compressing the nerve, but
  it does not fit what is observed. The eponymous ocular feature was scored positive in
  one of the six patients of the cohort curated here and is described in the
  ophthalmologic literature as not consistent, while glaucoma, which the acronym does
  not mention, was present in four of the same six.
synonyms:
- growth retardation-alopecia-pseudoanodontia-optic atrophy syndrome
- GAPO
- anthrax toxin receptor 1 deficiency

discussions:
- discussion_id: gapo_optic_atrophy_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a generalised extracellular-matrix accumulation produce progressive optic
    atrophy?
  attaches_to:
  - phenotypes#Optic atrophy
  rationale: >-
    The matrix hypothesis accounts well for the dental feature — teeth that have formed
    cannot erupt through connective tissue that is not cleared — and plausibly for the
    connective-tissue involvement of other organ systems. It has no stated account of
    the ocular feature, which is one of the four the syndrome is named for. Compression
    of the optic nerve at the canal, a primary neural effect, and a vascular effect are
    all conceivable and none is distinguished in any located source. Until it is, the
    edge from matrix accumulation to optic atrophy is an association between two
    features of one syndrome rather than a mechanism, and is typed accordingly.
- discussion_id: gapo_neopeptide_allele
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the c.1435-12A>G splice allele behave as a null, or does its 118-residue
    neopeptide add an effect of its own?
  attaches_to:
  - genetic#ANTXR1
  rationale: >-
    The nonsense alleles are predicted to abolish the protein through
    nonsense-mediated decay. The splice allele is predicted to produce a truncated
    protein with a novel C-terminal peptide, which is a different molecular event. Both
    words are the source's own predictions and neither protein was measured. If the
    neopeptide allele were not a simple null, genotype-phenotype expectations for it
    would differ, and with about 30 reported patients that distinction is unlikely to
    emerge from clinical correlation alone.
- discussion_id: gapo_alopecia_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the alopecia a consequence of matrix accumulation in the dermis, or a separate
    developmental effect of ANTXR1 loss on the hair follicle?
  attaches_to:
  - phenotypes#Alopecia
  rationale: >-
    Alopecia with rarefaction of eyebrows and eyelashes is an ectodermal pattern, and
    the syndrome is classified among the ectodermal dysplasias for that reason, yet the
    proposed mechanism is mesenchymal. Hair follicle development depends on
    epithelial-mesenchymal signalling, so a dermal matrix defect could produce it —
    but no located source makes that argument or tests it, and the alternative that
    ANTXR1 has a follicle-intrinsic role is not excluded.
notes: >-
  The organising claim of this entry is the founding paper's: that GAPO is a
  generalized defect in extracellular-matrix homeostasis. It is quoted as a proposal
  because that is how its authors state it, and the entry's causal edges are typed to
  show how far it actually reaches.

  It reaches furthest for pseudoanodontia. The name carries the mechanistically
  important distinction — the teeth are formed and fail to erupt, which is not tooth
  agenesis — and that is exactly what a clearance defect predicts, and exactly what
  the Antxr1-mutant mouse reproduces alongside the matrix accumulation itself. That
  edge is INDIRECT_KNOWN_INTERMEDIATES. The multi-system connective-tissue involvement
  reported in case series is consistent with it.

  It reaches least far for the optic atrophy, which is one of the four features the
  syndrome is named for. No located source proposes a route from accumulated matrix to
  progressive optic nerve damage, and this entry does not invent one: that edge and the
  alopecia edge are typed INDIRECT_UNKNOWN_INTERMEDIATES and carry knowledge gaps.

  Two smaller things a later editor should not silently tidy. First, the sources
  disagree about the fourth feature's name: the founding paper says "progressive visual
  impairment" while later sources say "progressive optic atrophy". They are not
  synonyms — visual impairment is the symptom and optic atrophy is a finding — and the
  binding follows the majority usage while the description records the discrepancy.
  Second, the case counts differ between sources (about 35 in 2014, about 30 in 2016).
  Both are quoted rather than averaged, because that is ordinary noise in counting case
  reports and hiding it would imply a precision the literature does not have.

  The gene's name is a historical accident worth knowing: ANTXR1 is anthrax toxin
  receptor 1, named for what it was first found doing rather than for its role here,
  which is as a matrix-interacting adhesion molecule.

  No GeneReviews chapter exists for GAPO syndrome; just check-genereviews reports
  NO_CHAPTER against the committed Bookshelf index.

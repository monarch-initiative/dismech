definitions:
- name: Contemporary clinical AAG definition
  definition_type: OTHER
  description: >-
    An acquired autoimmune cause of generalized autonomic failure in which
    ganglionic acetylcholine receptor autoantibodies establish a biologically
    defined subset, while clinical course and exclusion of competing autonomic
    neuropathies remain essential to diagnosis.
  evidence:
  - reference: PMID:38396973
    reference_title: "Autoimmune Autonomic Neuropathy: From Pathogenesis to Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune autonomic ganglionopathy (AAG) is a disease of autonomic failure
      caused by ganglionic acetylcholine receptor (gAChR) autoantibodies.
    explanation: >-
      This contemporary diagnostic review defines the antibody-associated core
      while emphasizing clinical course and differential diagnosis elsewhere in
      the same abstract.
- name: Ontology-linked acute pandysautonomia definition
  definition_type: OTHER
  description: >-
    Orphanet defines acute pandysautonomia as a rare Guillain-Barré syndrome
    variant characterized by acute
    post-ganglionic sympathetic and parasympathetic failure presenting several
    weeks after acute infection with gastrointestinal symptoms (abdominal pain,
    vomiting, constipation, diarrhea, gastroparesis, ileus), orthostatic
    hypotension, erectile dysfunction, urinary frequency, urgency or retention,
    vasomotor instability with acrocyanosis and reduced salivation, lacrimation
    and sweating. This is retained to document the MONDO/Orphanet mapping, not
    as a claim that all contemporary AAG has an acute postinfectious course.
  evidence:
  - reference: ORPHA:231457
    reference_title: "Acute pandysautonomia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A rare variant of Guillain-Barré syndrome characterized by acute post-ganglionic sympathetic and parasympathetic failure"
    explanation: Orphanet provides the disease definition linked to MONDO:0016499.
has_subtypes:
- name: Ganglionic AChR antibody-positive AAG
  display_name: gAChR-antibody-positive AAG
  description: >-
    Biologically anchored AAG in which an appropriately interpreted assay
    detects antibodies against extracellular alpha3-containing ganglionic
    nicotinic acetylcholine receptors. Low-level radioimmunoprecipitation results
    have lower disease specificity and require clinical correlation.
  evidence:
  - reference: PMID:35351814
    reference_title: "Novel Cell-Based Assay for Alpha-3 Nicotinic Receptor Antibodies Detects Antibodies Exclusively in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study showed that in contrast to the established RIPA for α3-nAChR
      antibodies, which at low levels is of moderate disease specificity, our CBA
      seems AAG specific
    explanation: >-
      The assay-comparison study supports an antibody-positive category while
      warning that low RIPA values are not independently diagnostic.
- name: Seronegative putative AAG
  display_name: Antibody-negative putative AAG
  description: >-
    A provisional clinical category for otherwise unexplained generalized
    autonomic failure with features suggesting autoimmunity but no detectable
    ganglionic AChR antibody. It lacks the biomarker anchor of seropositive AAG
    and requires particularly careful exclusion of mimics.
  evidence:
  - reference: PMID:19506222
    reference_title: "Efficacy of immunotherapy in seropositive and seronegative putative autoimmune autonomic ganglionopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We studied six patients, four with seropositive and two with seronegative
      putative AAG
    explanation: >-
      This very small treatment series documents use of the term but does not
      validate a unique antibody-negative mechanism; support is therefore
      intentionally partial.
progression:
- phase: Acute or subacute pandysautonomia
  age_range: All ages
  notes: >-
    One presentation is rapid generalized autonomic failure, sometimes several
    weeks after an infection. The postinfectious statement comes from the
    narrower acute-pandysautonomia ontology record and is not universal in AAG.
  evidence:
  - reference: ORPHA:231457
    reference_title: "Acute pandysautonomia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: All ages"
    explanation: Orphanet records all ages as the onset category for acute pandysautonomia.
  - reference: ORPHA:231457
    reference_title: "Acute pandysautonomia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "presenting several weeks after acute infection"
    explanation: Orphanet describes a postinfectious interval for the acute pandysautonomia presentation.
- phase: Chronic or insidious autonomic failure
  notes: >-
    AAG may also begin or evolve chronically. History should establish onset,
    tempo, autonomic domains, and extra-autonomic features rather than requiring
    an acute Guillain-Barre-like course.
  evidence:
  - reference: PMID:38396973
    reference_title: "Autoimmune Autonomic Neuropathy: From Pathogenesis to Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first step in diagnosing AAG is careful history taking, which should
      reveal whether the mode of onset is acute or chronic
    explanation: The diagnostic review explicitly recognizes both acute and chronic onset.
- phase: Treatment response with residual impairment or relapse
  notes: >-
    Objective autonomic function can improve with individualized, prolonged
    immunotherapy, but residual cardiovascular, pupillary, urinary, and
    symptom-level impairment is common and relapse can occur despite
    steroid-sparing treatment.
  evidence:
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prolonged stepwise immunosuppression in seropositive AAG is associated with
      sustained objective autonomic improvement, although residual impairment
      and relapse remain common.
    explanation: The 10-year follow-up cohort directly supports incomplete recovery and relapse.
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    AAG ranges from disabling generalized autonomic failure requiring
    anti-hypotensive medication, urinary catheterization, nutritional or bowel
    support, and prolonged immunotherapy to partial recovery with persistent
    deficits. Severity, treatment response, and relapse are heterogeneous, but
    cardiovascular and gastrointestinal complications can be dangerous.
  evidence:
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autoimmune autonomic ganglionopathy (AAG) is a rare but potentially
      treatable cause of severe autonomic failure.
    explanation: The long-term cohort characterizes the potential severity and treatability of AAG.
pathophysiology:
- name: Ganglionic Acetylcholine Receptor Autoantibodies
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Circulating autoantibodies against ganglionic nicotinic acetylcholine
    receptors, especially alpha3-containing receptors in autonomic ganglia,
    identify a seropositive subset and correlate with autonomic failure
    severity.
  biological_processes:
  - preferred_term: humoral immune response mediated by circulating immunoglobulin
    term:
      id: GO:0002455
      label: humoral immune response mediated by circulating immunoglobulin
    modifier: INCREASED
  cell_types:
  - preferred_term: autonomic neuron
    term:
      id: CL:0000107
      label: autonomic neuron
  locations:
  - preferred_term: autonomic ganglion
    term:
      id: UBERON:0001805
      label: autonomic ganglion
  evidence:
  - reference: PMID:10995864
    reference_title: "Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seropositivity for antibodies that bind to or block ganglionic acetylcholine receptors identifies patients with various forms of autoimmune autonomic neuropathy and distinguishes these disorders from other types of dysautonomia."
    explanation: This foundational patient-serology study identifies ganglionic acetylcholine receptor antibodies as markers of autoimmune autonomic neuropathy.
  - reference: PMID:31924415
    reference_title: "A comprehensive analysis of the clinical characteristics and laboratory features in 179 patients with autoimmune autonomic ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 179 patients tested positive for antibodies, including 116 gAChRα3-positive, 13 gAChRβ4-positive, and 50 double antibody-positive patients."
    explanation: >-
      This large seropositive cohort documents alpha3- and beta4-assay-defined
      groups; it is used as serologic cohort evidence rather than proof of stable
      clinical subtypes.
  downstream:
  - target: Antibody-Mediated Ganglionic Acetylcholine Receptor Dysfunction
    causal_link_type: DIRECT
    description: Patient IgG and anti-alpha3 antibodies can reduce functional ganglionic AChR current and surface receptor availability.
    evidence:
    - reference: PMID:17536048
      reference_title: "Autoimmune autonomic ganglionopathy: IgG effects on ganglionic acetylcholine receptor current."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "IgG from seven patients with AAG all produced a progressive decline in whole-cell ganglionic AChR current, whereas IgG from control subjects had no effect."
      explanation: Patient IgG directly reduced ganglionic AChR current, supporting a causal link from autoantibodies to receptor dysfunction.
  - target: Extra-Autonomic Neural Involvement
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sensory and central manifestations co-occur in seropositive cohorts, but
      whether the same antibodies, another immune target, or a comorbid process
      causes them is unresolved.
    evidence:
    - reference: PMID:31924415
      reference_title: "A comprehensive analysis of the clinical characteristics and laboratory features in 179 patients with autoimmune autonomic ganglionopathy."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Extra-autonomic manifestations including sensory disturbance, central
        nervous system involvement, endocrine disorders, autoimmune diseases,
        and tumours were present in 118 patients (83%).
      explanation: >-
        The cohort supports co-occurrence but not a specific causal route, so
        this edge is explicitly indirect and only partially supported.

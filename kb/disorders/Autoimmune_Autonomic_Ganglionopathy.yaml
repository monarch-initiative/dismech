  - preferred_term: Gastrointestinal dysmotility
    term:
      id: HP:0002579
      label: Gastrointestinal dysmotility
  - preferred_term: Urinary retention
    term:
      id: HP:0000016
      label: Urinary retention
  - preferred_term: Anhidrosis
    term:
      id: HP:0000970
      label: Anhidrosis
  evidence:
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."

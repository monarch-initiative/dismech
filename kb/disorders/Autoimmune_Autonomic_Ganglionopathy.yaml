biochemical:
- name: Serum Ganglionic Acetylcholine Receptor Antibodies
  presence: Positive in subset
  notes: >-
    A convincing antibody result increases diagnostic confidence, but assay
    format and concentration matter. Low-level radioimmunoprecipitation results
    can occur in other neurologic diseases; a negative result does not by itself
    exclude a carefully phenotyped, putative autoimmune autonomic ganglionopathy.
  evidence:
  - reference: PMID:10995864
    reference_title: "Autoantibodies to ganglionic acetylcholine receptors in autoimmune autonomic neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ganglionic-receptor-binding antibodies were found in 19 of 46 patients with idiopathic or paraneoplastic autonomic neuropathy (41 percent)"
    explanation: This original serology cohort supports ganglionic receptor antibody detection in autoimmune autonomic neuropathy.
  - reference: PMID:31924415
    reference_title: "A comprehensive analysis of the clinical characteristics and laboratory features in 179 patients with autoimmune autonomic ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 179 patients tested positive for antibodies, including 116 gAChRα3-positive, 13 gAChRβ4-positive, and 50 double antibody-positive patients."
    explanation: This large Japanese cohort documents alpha3, beta4, and double-positive gAChR antibody groups.
  - reference: PMID:35351814
    reference_title: "Novel Cell-Based Assay for Alpha-3 Nicotinic Receptor Antibodies Detects Antibodies Exclusively in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low α3-nAChR antibody levels are frequently detected in other
      neurologic diseases with questionable significance.
    explanation: The assay-comparison study directly supports concentration- and assay-aware interpretation.
diagnosis:
- name: Clinical pattern and time-course assessment
  description: >-
    Establish whether autonomic failure is generalized, which sympathetic,
    parasympathetic, and enteric domains are involved, whether onset is acute or
    chronic, and whether sensory, central, systemic-autoimmune, infectious,
    medication, toxic, or neoplastic clues suggest another diagnosis.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:38396973
    reference_title: "Autoimmune Autonomic Neuropathy: From Pathogenesis to Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first step in diagnosing AAG is careful history taking, which should
      reveal whether the mode of onset is acute or chronic, followed by an
      examination of the time course of disease progression
    explanation: The diagnostic review makes clinical course the first step rather than relying on antibody status alone.
- name: Quantitative autonomic function testing
  description: >-
    Objective testing should document distribution and severity. Depending on
    the phenotype this can include beat-to-beat blood pressure and heart-rate
    responses during head-up tilt, cardiovagal and adrenergic testing,
    quantitative sudomotor or thermoregulatory sweat testing, pupillometry, and
    targeted urinary, lacrimal, salivary, or gastrointestinal measures.
  diagnosis_term:
    preferred_term: autonomic nervous system function evaluation
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  evidence:
  - reference: PMID:33438240
    reference_title: "Multimodal Biomarkers Quantify Recovery in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all patients were longitudinally assessed with cardiovascular, pupillary,
      urinary, sudomotor, lacrimal and salivary testing
    explanation: The multimodal cohort demonstrates objective assessment across the major autonomic domains.
  - reference: PMID:33438240
    reference_title: "Multimodal Biomarkers Quantify Recovery in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Quantitative autonomic biomarkers should be used to define initial
      deficits, guide therapeutic decisions, and document treatment response.
    explanation: The study explicitly recommends quantitative autonomic biomarkers for baseline and follow-up.
- name: Ganglionic AChR antibody testing with assay-aware interpretation
  description: >-
    Test serum for antibodies against extracellular alpha3-containing
    ganglionic nicotinic AChRs when AAG is suspected. Interpret the assay method,
    concentration, and phenotype together: low RIPA results have limited
    specificity, whereas extracellular-domain cell-based or functional
    immunomodulation assays may better identify pathogenic antibody.
  diagnosis_term:
    preferred_term: antibody titer measurement
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:35351814
    reference_title: "Novel Cell-Based Assay for Alpha-3 Nicotinic Receptor Antibodies Detects Antibodies Exclusively in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study provides Class II evidence that an α3-nAChR cell-based assay
      is a more specific assay for AAG than the standard RIPA.
    explanation: This directly supports assay-aware antibody interpretation.
  - reference: PMID:34249013
    reference_title: "A Flow Cytometric Assay to Detect Functional Ganglionic Acetylcholine Receptor Antibodies by Immunomodulation in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      AAG with pathogenic gnACHR antibodies, the autoantibodies exert their
      effects by immunomodulation
    explanation: Functional immunomodulation provides a biologically relevant assay readout.
- name: Context-directed malignancy and systemic-autoimmunity evaluation
  description: >-
    Evaluate for an underlying malignancy, paraneoplastic neurologic syndrome,
    or systemic autoimmune disease when age, tempo, weight loss, examination,
    antibody profile, or other red flags warrant it. This is targeted evaluation,
    not a claim that every AAG patient requires identical whole-body screening.
  diagnosis_term:
    preferred_term: cancer screening
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:31093868
    reference_title: "Autoimmune autonomic neuropathies and ganglionopathies: epidemiology, pathophysiology, and therapeutic advances."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      supportive care for unpleasant or dangerous autonomic dysfunction, a
      search for underlying malignancy when indicated, and the use of
      immunotherapy when appropriate.
    explanation: The clinical review explicitly recommends malignancy evaluation when indicated.
differential_diagnoses:
- name: Acute autonomic sensory neuropathy
  description: >-
    AASN combines acute autonomic dysfunction with prominent sensory involvement
    and dorsal-root/autonomic ganglion pathology. Current reviews do not treat it
    as the same disease spectrum as gAChR-antibody AAG, and gAChR antibodies are
    generally absent in AASN.
  evidence:
  - reference: PMID:38741497
    reference_title: "[Autoimmune Autonomic Ganglionopathy and Acute Autonomic Sensory Neuropathy]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      gAChR antibodies are not detected in the sera of patients with AASN.
      Currently, AAG and AASN are not considered to be on the same spectrum
    explanation: This review directly states the antibody and disease-concept distinction.
- name: Postural orthostatic tachycardia syndrome
  description: >-
    POTS can produce orthostatic intolerance and overlapping multisystem
    symptoms, but it should not be relabeled AAG without objective generalized
    autonomic failure and appropriate autoimmune evidence.
  disease_term:
    preferred_term: postural orthostatic tachycardia syndrome
    term:
      id: MONDO:0011479
      label: postural orthostatic tachycardia syndrome
  evidence:
  - reference: PMID:38396973
    reference_title: "Autoimmune Autonomic Neuropathy: From Pathogenesis to Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other non-neuropathic conditions, such as postural orthostatic tachycardia
      syndrome, chronic fatigue syndrome, and long COVID, also present with
      symptoms similar to those of AAG.
    explanation: The diagnostic review explicitly identifies POTS as a symptomatic mimic requiring differentiation.
- name: Multiple system atrophy
  description: >-
    Multiple system atrophy is a central alpha-synucleinopathy with autonomic
    failure plus levodopa-unresponsive parkinsonism or cerebellar ataxia, unlike
    the antibody-mediated ganglionic transmission defect of AAG.
  disease_term:
    preferred_term: multiple system atrophy
    term:
      id: MONDO:0007803
      label: multiple system atrophy
  evidence:
  - reference: PMID:37562886
    reference_title: "Autonomic failure: Clinicopathologic, physiologic, and genetic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      multiple system atrophy, characterized clinically by
      levodopa-unresponsive parkinsonism or cerebellar ataxia
    explanation: The autonomic-failure review distinguishes the central neurodegenerative MSA phenotype.
- name: Pure autonomic failure
  description: >-
    Pure autonomic failure is a chronic alpha-synucleinopathy with peripheral
    sympathetic norepinephrine deficits. Chronic tempo can resemble AAG, but its
    neurodegenerative mechanism, antibody profile, and treatment response differ.
  evidence:
  - reference: PMID:37562886
    reference_title: "Autonomic failure: Clinicopathologic, physiologic, and genetic aspects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      pure autonomic failure characterized clinically by deficits in
      norepinephrine synthesis and release from peripheral sympathetic nerve
      terminals
    explanation: The review provides the defining physiologic distinction from antibody-mediated AAG.
animal_models:
- species: Mouse
  category: Induced autoimmune autonomic ganglionopathy
  description: >-
    C57BL/6 mice immunized with extracellular alpha3 nicotinic acetylcholine
    receptor peptides developed alpha3 antibodies, reduced heart rate, labile
    systolic blood pressure, slowed intestinal transit, and reduced sympathetic
    cervical-ganglion neuronal density. The model supports pathogenicity but may
    include tissue injury not yet established as a dominant human mechanism.
  associated_phenotypes:
  - Reduced heart rate
  - Labile systolic blood pressure
  - Slowed intestinal transit
  evidence:
  - reference: PMID:36507326
    reference_title: "A novel murine model of autoimmune dysautonomia by α3 nicotinic acetylcholine receptor immunization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with EAAG generated nAChRα3 antibodies and exhibited autonomic
      dysfunction, including reduced heart rate, excessive fluctuations in
      systolic blood pressure, and intestinal transit slowing.
    explanation: Active alpha3-receptor immunization reproduces antibody formation and multisystem autonomic dysfunction.
treatments:
- name: Immunotherapy
  action_category: THERAPEUTIC
  description: >-
    Individualized, usually stepwise immune-directed therapy is used most
    confidently for antibody-positive AAG and selectively for rigorously
    phenotyped seronegative putative disease. Cohorts show objective improvement,
    but no internationally accepted regimen, sequence, or duration exists and
    residual impairment or relapse is common.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Antibody-Mediated Ganglionic Acetylcholine Receptor Dysfunction
    treatment_effect: MODULATES
    description: Immunotherapy is intended to reduce the antibody-mediated autonomic transmission defect.
    evidence:
    - reference: PMID:31093868
      reference_title: "Autoimmune autonomic neuropathies and ganglionopathies: epidemiology, pathophysiology, and therapeutic advances."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "antibodies against the ganglionic nicotinic acetylcholine receptor impair autonomic transmission, causing autonomic failure, which responds to immunotherapy."
      explanation: This review links AAG's antibody-mediated transmission defect with clinical response to immunotherapy.
  evidence:
  - reference: PMID:31093868
    reference_title: "Autoimmune autonomic neuropathies and ganglionopathies: epidemiology, pathophysiology, and therapeutic advances."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "autoimmune autonomic ganglionopathy (AAG), in which antibodies against the ganglionic nicotinic acetylcholine receptor impair autonomic transmission, causing autonomic failure, which responds to immunotherapy."
    explanation: This review summarizes immunotherapy-responsive AAG as the classic autoimmune autonomic ganglionopathy.
  - reference: PMID:33438240
    reference_title: "Multimodal Biomarkers Quantify Recovery in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After immunotherapy, there were significant improvements in orthostatic intolerance ratio"
    explanation: This seropositive AAG cohort provides objective autonomic biomarker evidence of improvement after immunotherapy.
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prolonged stepwise immunosuppression in seropositive AAG is associated with
      sustained objective autonomic improvement, although residual impairment
      and relapse remain common.
    explanation: The 10-year cohort supports individualized prolonged treatment while defining its limitations.
  - reference: PMID:38959810
    reference_title: "Immunological and therapeutic insights in autoimmune autonomic ganglionopathy: What is the position of apheresis in immunotherapy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is currently no internationally accepted standard of care for the
      immunotherapy of AAG
    explanation: The recent review directly supports the absence of a standardized regimen.
- name: Intravenous Immunoglobulin
  action_category: THERAPEUTIC
  description: >-
    IVIG is used as an immunomodulatory therapy in AAG, often as initial therapy
    and sometimes as part of a longer combined immunotherapy plan. Evidence is
    limited to small cohorts, case series, and an extremely under-enrolled trial;
    response should be documented objectively rather than assumed.
  treatment_term:
    preferred_term: Intravenous Immunoglobulin Therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Antibody-Mediated Ganglionic Acetylcholine Receptor Dysfunction
    treatment_effect: MODULATES
    description: >-
      IVIG is intended to lessen antibody-mediated autonomic transmission
      failure, although its precise disease-specific immunologic action and
      responder profile in AAG remain unresolved.
    evidence:
    - reference: PMID:31093868
      reference_title: "Autoimmune autonomic neuropathies and ganglionopathies: epidemiology, pathophysiology, and therapeutic advances."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        antibodies against the ganglionic nicotinic acetylcholine receptor impair
        autonomic transmission, causing autonomic failure, which responds to
        immunotherapy.
      explanation: The review supports immune modulation of the antibody-mediated defect but not an IVIG-specific molecular mechanism.
  evidence:
  - reference: PMID:19056323
    reference_title: "Immunotherapy for autoimmune autonomic ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with intravenous immunoglobulin (IVIG) or plasma exchange (PE) has been reported to be effective in single case reports and recent case series."
    explanation: This treatment review summarizes human case-report and case-series experience with IVIG.
  - reference: PMID:35966941
    reference_title: "Effectiveness of treatment for 31 patients with seropositive autoimmune autonomic ganglionopathy in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-one patients received immunotherapy. Among them, 19 patients
      received intravenous methylprednisolone; 27, intravenous immunoglobulin
    explanation: This observational cohort documents frequent IVIG use within multimodal immunotherapy.
- name: Plasma Exchange
  action_category: THERAPEUTIC
  description: >-
    Plasma exchange can acutely reduce circulating ganglionic AChR antibodies
    and improve autonomic signs, although sustained benefit may require combined
    immunosuppression.
  treatment_term:
    preferred_term: Plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  target_mechanisms:
  - target: Ganglionic Acetylcholine Receptor Autoantibodies
    treatment_effect: INHIBITS
    description: Plasma exchange lowers circulating pathogenic antibody burden.
    evidence:
    - reference: PMID:18268189
      reference_title: "Combined immunomodulatory therapy in autoimmune autonomic ganglionopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mean antibody level was 7.92 nmol/L on combined immunosuppressive therapy alone and dropped to 0.5 nmol/L after plasmapheresis."
      explanation: The case series directly shows lower antibody levels after plasmapheresis.
  evidence:
  - reference: PMID:18268189
    reference_title: "Combined immunomodulatory therapy in autoimmune autonomic ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with autoimmune autonomic ganglionopathy, combining immunosuppressive medications prednisone and mycophenolate mofetil with plasmapheresis provides substantial and sustained clinical improvement that was not seen using either treatment alone."
    explanation: Prospective case-series evidence supports combined immunosuppression plus plasmapheresis for sustained improvement.
  - reference: PMID:19399547
    reference_title: "Autoimmune autonomic ganglionopathy: treatment by plasma exchanges and rituximab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, total PLEX temporarily improved clinical and laboratory abnormalities in this patient with AAG."
    explanation: A detailed case report supports temporary clinical and laboratory improvement after plasma exchange.
  - reference: PMID:38959810
    reference_title: "Immunological and therapeutic insights in autoimmune autonomic ganglionopathy: What is the position of apheresis in immunotherapy?"
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Although the rationale for the use of plasma exchange (PLEX) in AAG is
      strong, whereby pathogenic gAChR antibodies are removed, its overall
      impact on patient outcomes is not well-established.
    explanation: The review supports the biological rationale while explicitly limiting confidence in outcomes.
- name: Corticosteroid and steroid-sparing immunosuppression
  action_category: THERAPEUTIC
  description: >-
    Oral corticosteroid followed by a steroid-sparing agent may be used in a
    prolonged stepwise program, particularly when IVIG or plasma exchange is
    incomplete or transient. Drug selection and toxicity monitoring require
    specialist individualization.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
  target_mechanisms:
  - target: Ganglionic Acetylcholine Receptor Autoantibodies
    treatment_effect: INHIBITS
    description: Prolonged immunosuppression aims to reduce production of pathogenic autoantibody.
    evidence:
    - reference: PMID:42138102
      reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        11 were treated with oral prednisolone followed by steroid-sparing
        agents. Treatment was associated with significant improvements in
        cardiovascular autonomic markers, antibody titres, and pupillary light
        responses
      explanation: The cohort supports the treatment sequence and antibody reduction, but not a drug-specific causal estimate.
  evidence:
  - reference: PMID:18268189
    reference_title: "Combined immunomodulatory therapy in autoimmune autonomic ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with autoimmune autonomic ganglionopathy, combining immunosuppressive medications prednisone and mycophenolate mofetil with plasmapheresis provides substantial and sustained clinical improvement that was not seen using either treatment alone."
    explanation: The prospective case series supports prednisone and mycophenolate as components of combined therapy.
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were refractory to plasma exchange and intravenous
      immunoglobulins but responded to prednisolone.
    explanation: The long-term cohort documents response to prednisolone after incomplete first-line response.
- name: Rituximab
  action_category: THERAPEUTIC
  description: >-
    Rituximab has been reported for refractory or relapsing AAG after or
    alongside other immunotherapies. The evidence base is case-level and does
    not establish comparative efficacy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

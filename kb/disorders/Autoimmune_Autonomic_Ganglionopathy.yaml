discussions:
- discussion_id: disc_aag_nosology_boundary
  prompt: >-
    How should contemporary AAG be reconciled with the narrower
    acute-pandysautonomia/Guillain-Barre concept encoded by the current
    MONDO-Orphanet exact mapping?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Contemporary reviews recognize acute and chronic AAG and emphasize
    antibody-defined autonomic ganglionopathy, while ORPHA:231457 describes a
    postinfectious acute Guillain-Barre variant. Cohorts and ontology resources
    should distinguish overlap from equivalence so chronic AAG is not excluded
    and every AAG case is not mislabeled as Guillain-Barre syndrome.
  evidence:
  - reference: PMID:38396973
    reference_title: "Autoimmune Autonomic Neuropathy: From Pathogenesis to Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first step in diagnosing AAG is careful history taking, which should
      reveal whether the mode of onset is acute or chronic
    explanation: The contemporary diagnostic review explicitly includes chronic onset.
  - reference: ORPHA:231457
    reference_title: "Acute pandysautonomia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare variant of Guillain-Barré syndrome characterized by acute
      post-ganglionic sympathetic and parasympathetic failure
    explanation: The ontology-linked Orphanet record is explicitly acute and Guillain-Barre-associated.
- discussion_id: disc_aag_assay_seronegative_boundary
  prompt: >-
    Which assay, concentration threshold, and clinical criteria should define
    antibody-positive AAG, and what evidence is required to classify a
    seronegative case as putative autoimmune ganglionopathy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Low RIPA results and isolated recombinant-subunit reactivity can be
    nonspecific. Extracellular-domain cell-based and functional assays improve
    specificity, but interlaboratory standardization and validated criteria for
    antibody-negative disease are lacking.
  evidence:
  - reference: PMID:35351814
    reference_title: "Novel Cell-Based Assay for Alpha-3 Nicotinic Receptor Antibodies Detects Antibodies Exclusively in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      low α3-nAChR antibody levels are frequently detected in other neurologic
      diseases with questionable significance.
    explanation: The assay study identifies a key specificity problem at low antibody levels.
  - reference: PMID:34995917
    reference_title: Subunit-specific autoantibodies in autoimmune autonomic ganglionopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subunit-specific antibody-derived false-positive results can lead to
      misdiagnosis, as autonomic failure is not specific to AAG.
    explanation: The comparison directly warns against treating subunit assay groups as settled disease subtypes.
  - reference: PMID:19506222
    reference_title: Efficacy of immunotherapy in seropositive and seronegative putative autoimmune autonomic ganglionopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four with seropositive and two with seronegative putative AAG
    explanation: The six-person study documents the putative category but is too small to validate diagnostic criteria.
- discussion_id: disc_aag_immunotherapy_strategy
  prompt: >-
    What induction, escalation, maintenance, tapering, and relapse-prevention
    strategy provides the best benefit-risk balance in AAG?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    Cohorts support objective improvement with stepwise or combined
    immunotherapy, but treatment selection is confounded by severity and
    concurrent therapies. Residual dysfunction and relapse remain common, and
    comparative randomized evidence is absent.
  evidence:
  - reference: PMID:38959810
    reference_title: "Immunological and therapeutic insights in autoimmune autonomic ganglionopathy: What is the position of apheresis in immunotherapy?"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      there is currently no internationally accepted standard of care for the
      immunotherapy of AAG
    explanation: The recent treatment review directly states the standard-of-care gap.
  - reference: PMID:42138102
    reference_title: "Long-Term Efficacy of Immunotherapy in Autoimmune Autonomic Ganglionopathy-A 10-Year Follow Up Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      residual impairment and relapse remain common.
    explanation: Longitudinal follow-up identifies clinically important residual and relapse risks.
- discussion_id: disc_aag_trials_and_datasets
  prompt: >-
    Can a multicenter natural-history platform, biobank, and adequately powered
    trial establish validated endpoints and enable reusable AAG molecular data?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    The ClinicalTrials.gov audit on 2026-07-20 found one completed IVIG study
    with six enrollees and no active AAG trial. Searches of GEO for the exact
    disease and ganglionic-receptor terms found no AAG patient omics dataset
    suitable for curation. Harmonized phenotyping, assay metadata, biospecimens,
    and longitudinal autonomic outcomes are needed.
  evidence:
  - reference: PMID:35966941
    reference_title: "Effectiveness of treatment for 31 patients with seropositive autoimmune autonomic ganglionopathy in Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      multicenter randomized, placebo-controlled prospective studies are
      warranted to establish future treatment strategies.
    explanation: The 31-person cohort explicitly calls for adequately controlled multicenter studies.
  - reference: clinicaltrials:NCT01522235
    reference_title: "A Double-blind, Randomized, Placebo-controlled Trial to Evaluate the Efficacy of Intravenous Immunoglobulin Therapy in Autoimmune Autonomic Ganglionopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of the study is to see if administering intravenous immune
      globulin (IVIG)
    explanation: This is the sole AAG trial located in the current ClinicalTrials.gov audit.

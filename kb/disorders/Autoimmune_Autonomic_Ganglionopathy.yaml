name: Autoimmune Autonomic Ganglionopathy
creation_date: "2026-05-16T20:19:02Z"
category: Autoimmune
synonyms:
- AAG
- Acute pandysautonomia
- Acute panautonomic Guillain-Barre syndrome
- Acute panautonomic neuropathy
- Autoimmune autonomic neuropathy
description: >-
  Autoimmune autonomic ganglionopathy is an acquired immune-mediated autonomic
  neuropathy characterized by widespread sympathetic, parasympathetic, and
  enteric failure. In antibody-positive disease, autoantibodies against
  alpha3-containing ganglionic nicotinic acetylcholine receptors impair
  cholinergic transmission within autonomic ganglia. Presentations may be acute,
  subacute, or chronic and include orthostatic hypotension, gastrointestinal
  dysmotility, urinary and sexual dysfunction, anhidrosis, pupillary
  dysfunction, xerostomia, and reduced lacrimation. The MONDO term is exactly
  mapped to Orphanet acute pandysautonomia, but that acute postinfectious
  Guillain-Barre-associated description is narrower than the contemporary AAG
  clinical spectrum; it must not be assumed to describe every patient.
disease_term:
  preferred_term: autoimmune autonomic ganglionopathy
  term:
    id: MONDO:0016499
    label: autoimmune autonomic ganglionopathy
parents:
- Autonomic Nervous System Disorder
- Autoimmune Disease
- Neurological Disease
mappings:
  mondo_mappings:
  - term:

discussions:
- discussion_id: gap_ahus_empiric_complement_inhibition_window
  prompt: >-
    Complement inhibitor therapy in acute thrombotic microangiopathy is started
    on clinical suspicion of complement-mediated HUS, before the alternative
    pathway dysregulation modelled in this entry can be confirmed. Is there a
    bedside test of alternative-pathway activation that discriminates aHUS from
    other TMA subtypes fast enough to guide first-dose decisions, and does
    earlier mechanism-directed initiation translate into better renal outcomes
    in the real-world (non-trial) setting?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Alternative Complement Pathway Dysregulation
  - pathophysiology#Renal Microvascular Thrombosis
  rationale: >-
    Genetic and functional confirmation of a complement lesion takes far longer
    than the therapeutic window, and a negative result cannot exclude the
    mechanism because no complement variant is identified in a substantial
    minority of clinically definite aHUS. The consequence is visible in
    real-world practice: in the Spanish MATUCIP pediatric intensive care
    registry only half of the children who received a complement inhibitor for
    TMA had suspected CM-HUS, the other half being treated off-label, and those
    non-CM-HUS patients started therapy roughly 2.5 days later than the
    suspected-CM-HUS group. The landmark eculizumab trial separately reported
    that earlier intervention was associated with significantly greater eGFR
    improvement, so diagnostic delay is plausibly on the causal path to the
    renal outcome rather than merely a documentation artefact. This is a genuine
    gap in the mechanism model as curated: the entry asserts that complement
    dysregulation drives renal microvascular thrombosis, but supplies no
    measurable, time-resolved readout of that dysregulation usable
    prospectively at presentation.
  proposed_experiments:
  - experiment_id: exp_ahus_rapid_ap_activation_readout
    name: Prospective evaluation of a rapid alternative-pathway activation assay in acute pediatric TMA
    description: >-
      In an unselected prospective cohort of children presenting with acute TMA,
      obtain a same-day functional readout of alternative-pathway activation
      (for example an ex vivo endothelial C5b-9 deposition assay, or soluble
      C5b-9 and Bb fragment levels) at presentation and serially thereafter,
      alongside the eventual reference diagnosis established by genetic,
      ADAMTS13, and infectious workup. Analyse the assay's discrimination of
      complement-mediated HUS from infection-associated and secondary TMA at the
      time the first-dose decision has to be made, and relate time-to-initiation
      of complement inhibition to kidney function at discharge and at 12 months.
    decision_criterion: >-
      The assay is useful if it separates CM-HUS from other TMA subtypes with
      clinically actionable discrimination on the day of presentation, several
      days before genetic results return.
    supporting_outcome:
    - >-
      A same-day functional readout tracking the alternative-pathway
      dysregulation node would support treating that node as prospectively
      measurable, and would let earlier mechanism-directed initiation be tested
      as a modifiable determinant of renal outcome.
    refuting_outcome:
    - >-
      If the readout does not separate CM-HUS from infection-associated or
      secondary TMA at presentation, the empiric treat-on-suspicion strategy
      recorded here is the honest description of practice, and the gap moves to
      finding a different discriminating measurement.
  evidence:
  - reference: PPR:PPR1274254
    reference_title: "Real-World Use of Complement Inhibitor Therapy in Critically Ill Children With Thrombotic Microangiopathy: Results From the Spanish Multicenter Matucip Registry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "half had suspected CM-HUS, while the remaining half received off-label therapy. Patients with suspected CM-HUS initiated treatment significantly earlier than patients with other TMA subtypes."
    explanation: >-
      Documents that in real-world pediatric critical care half of complement
      inhibitor use for TMA is off-label because the complement-mediated
      mechanism cannot be confirmed at the time of the treatment decision, and
      that diagnostic uncertainty tracks with later initiation. Non-peer-reviewed
      preprint.
  - reference: PMID:23738544
    reference_title: "Terminal complement inhibitor eculizumab in atypical hemolytic-uremic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In trial 1, dialysis was discontinued in 4 of 5 patients. Earlier intervention with eculizumab was associated with significantly greater improvement in the estimated GFR."
    explanation: >-
      Establishes why the diagnostic delay matters mechanistically rather than
      only administratively: the timing of complement blockade is associated
      with the degree of renal recovery.
  notes: >-
    Raised from monarch-initiative/dismech#6428 (preprint scan). The MATUCIP
    cohort is a mixed TMA population, so its aggregate outcome figures (kidney
    replacement therapy in 72.5%, 5% mortality) are deliberately not curated as
    aHUS-specific phenotype frequencies in this entry.

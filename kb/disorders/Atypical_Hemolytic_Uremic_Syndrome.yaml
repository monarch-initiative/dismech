biochemical:
- name: Reduced C3 Levels
  presence: DECREASED
  context: >-
    Low serum C3 due to consumption from chronic alternative pathway
    activation. Present in a subset of aHUS patients, particularly
    those with CFH, CFB, or C3 mutations. Normal C3 does not exclude aHUS.
  evidence:
  - reference: PMID:39918340
    reference_title: "Recommendations for diagnosis and treatment of Atypical Hemolytic Uremic Syndrome (aHUS): an expert consensus statement from the Rare Diseases Committee of the Brazilian Society of Nephrology (COMDORA-SBN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma C3 levels can be assessed - low levels are found in less than 20% of
      patients and normal levels do not rule out aHUS
    explanation: >-
      Confirms that low plasma C3 occurs only in a subset of aHUS patients and that
      a normal C3 does not exclude the diagnosis.
- name: Elevated Soluble C5b-9
  presence: INCREASED
  context: >-
    Elevated serum levels of the terminal complement complex (sC5b-9)
    indicate ongoing terminal complement activation and correlate with
    disease activity. Normalization with C5 inhibitor therapy correlates
    with clinical response.
  evidence:
  - reference: PMID:39918340
    reference_title: "Recommendations for diagnosis and treatment of Atypical Hemolytic Uremic Syndrome (aHUS): an expert consensus statement from the Rare Diseases Committee of the Brazilian Society of Nephrology (COMDORA-SBN)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typically, an abnormality in the regulatory proteins of the alternative complement
      pathway leads to an excessive formation of the membrane attack complex (C5b-9),
      causing endothelial cell damage and microthrombi formation throughout the body
    explanation: >-
      Supports excessive terminal complement (C5b-9 / membrane attack complex) formation
      as the effector of endothelial injury in aHUS, consistent with elevated soluble
      C5b-9 as a marker of terminal-pathway activation.

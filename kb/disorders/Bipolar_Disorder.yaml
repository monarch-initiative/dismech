      label: serotonergic neuron
  - preferred_term: Noradrenergic Neuron
    term:
      id: CL:0008025
      label: noradrenergic neuron
  biological_processes:
  - preferred_term: Neurotransmitter Signaling
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: PARTIAL
    snippet: "Activation of the dopamine receptor 2 (D2R) has been shown to stimulate the inactivation of Akt by PP2A (Beaulieu et al., 2005; Beaulieu and Gainetdinov, 2011), therefore providing a mechanism through which GPCR activation can inhibit Akt in response to extracellular signals."
    explanation: Dopamine D2 receptor signaling regulates the Akt/GSK3 pathway, providing a molecular link between monoaminergic neurotransmission and mood regulation in bipolar disorder.
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: PARTIAL
    snippet: "This mechanism of D2R signaling appears to play important roles in the regulation of locomotor behavior and sensory motor gating by dopamine (Beaulieu et al., 2004; Emamian et al., 2004). It could also contribute to the therapeutic and/or adverse effects of psychoactive drugs like amphetamines and antpsychotics that act on dopamine neurotransmission"
    explanation: The D2 receptor-mediated regulation of GSK3 activity through beta-arrestin signaling is implicated in behavioral regulation relevant to bipolar disorder and the mechanism of mood stabilizers and antipsychotics.
- name: Mitochondrial Dysfunction
  description: >
    Impaired cellular energy metabolism and oxidative stress affect
    neuronal function. Mitochondrial abnormalities linked to mood
    dysregulation.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: NO_EVIDENCE
    snippet: "Psychiatric disorders (such as bipolar disorder, depression, and schizophrenia) affect the lives of millions of individuals worldwide."
    explanation: This review discusses the molecular mechanisms underlying psychiatric disorders including bipolar disorder, with focus on the DISC1/GSK3 complex which regulates mitochondrial and cellular functions.
- name: Circadian Rhythm Disruption
  description: >
    Disrupted sleep-wake cycles and circadian gene expression
    contribute to mood instability. Sleep deprivation can trigger mania.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Circadian Rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: NO_EVIDENCE
    snippet: "For more than 60 years, the mood stabilizer lithium has been used alone or in combination for the treatment of bipolar disorder, schizophrenia, depression, and other mental illnesses."
    explanation: This comprehensive review discusses lithium as the gold standard treatment for bipolar disorder, noting its mood-stabilizing effects through GSK3 inhibition which affects multiple cellular pathways including circadian regulation.
  - reference: PMID:23919927
    reference_title: "Glycogen synthase kinase-3β haploinsufficiency lengthens the circadian locomotor activity period in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these data suggest that GSK3β acts as a critical intrinsic regulator of the circadian clock and plays an important role in regulating its period in response to lithium treatment"
    explanation: >-
      GSK3β haploinsufficiency lengthens circadian period in mice, mechanistically
      linking lithium's inhibition of GSK3β to its documented effects on circadian
      rhythm period and amplitude in bipolar disorder.
- name: Neuroplasticity Alterations
  description: >
    Reduced BDNF and altered synaptic plasticity in mood circuits.
    Lithium and other mood stabilizers enhance neuroplasticity.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Synaptic Plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
  evidence:
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: PARTIAL
    snippet: "DISC1 binds directly to GSK3 and modulates many cellular functions by negatively inhibiting GSK3 activity."
    explanation: GSK3 inhibition by DISC1 and mood stabilizers like lithium is a key mechanism in bipolar disorder treatment, affecting synaptic plasticity and neuronal survival pathways.
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: PARTIAL
    snippet: "In the present review, we will focus on the emerging roles of TRAX and its interacting proteins (including DISC1 and GSK3β) in psychiatric disorders and the potential implications for developing therapeutic interventions."
    explanation: The TRAX/DISC1/GSK3β complex is implicated in psychiatric disorders including bipolar disorder and represents a therapeutic target for enhancing neuroplasticity.
  - reference: PMID:21743136
    reference_title: "Neuroprotective action of lithium in disorders of the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Lithium's main mechanisms of action appear to stem from its ability to inhibit glycogen synthase kinase-3 activity and also to induce signaling mediated by brain-derived neurotrophic factor."
    explanation: >-
      Lithium enhances neuroplasticity in part by inducing BDNF signaling and
      inhibiting GSK-3, directly complementing the reduced-BDNF pathophysiology
      captured in this node.
- name: Neuroinflammation
  description: >
    Elevated inflammatory markers during mood episodes. Microglial
    activation and cytokine abnormalities contribute to pathophysiology.
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:33958577
    reference_title: "Glutamate and microglia activation as a driver of dendritic apoptosis: a core pathophysiological mechanism to understand schizophrenia."
    supports: NO_EVIDENCE
    snippet: "considering that schizophrenia is a multifactorial and highly polygenic disorder that shares many risk genes with other psychiatric illnesses including bipolar disorder, depression, intellectual disability and autism spectrum disorders, it is to be expected that these diseases may also share some of these same mechanisms"
    explanation: Microglial activation and inflammatory processes are shared pathophysiological mechanisms across psychiatric disorders including bipolar disorder, contributing to synaptic dysfunction.
- name: GSK-3β Signaling Dysregulation
  description: >
    Glycogen synthase kinase-3β (GSK-3β) is a constitutively active
    serine/threonine kinase that phosphorylates β-catenin, tau, and numerous
    circadian and pro-apoptotic substrates. Excess GSK-3β activity is implicated
    in bipolar mood instability, and GSK-3β is the principal molecular target
    through which lithium is thought to exert its mood-stabilizing and
    neuroprotective effects. Lithium inhibits GSK-3β both directly
    (Mg2+-competitive) and indirectly (via the Akt / β-arrestin-2 / PP2A axis),
    stabilizing β-catenin and mimicking canonical Wnt signaling.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Canonical Wnt Signaling
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:8710892
    reference_title: "A molecular mechanism for the effect of lithium on development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results suggest that lithium acts through inhibition of glycogen synthase kinase-3 beta (GSK-3 beta), which regulates cell fate determination in diverse organisms including Dictyostelium, Drosophila, and Xenopus."
    explanation: >-
      Klein and Melton identified GSK-3β as a direct molecular target of lithium
      in developmental model organisms — the foundational evidence for the GSK-3β
      hypothesis of lithium's action in bipolar disorder.
  - reference: PMID:8710892
    reference_title: "A molecular mechanism for the effect of lithium on development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lithium potently inhibits GSK-3 beta activity (Ki = 2 mM), but is not a general inhibitor of other protein kinases."
    explanation: >-
      Lithium inhibits GSK-3β at therapeutically relevant concentrations with
      selectivity over other protein kinases, supporting GSK-3β as a specific target.
  - reference: PMID:8994831
    reference_title: "Lithium inhibits glycogen synthase kinase-3 activity and mimics wingless signalling in intact cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Li+ treatment of Drosophila S2 cells and rat PC12 cells induces accumulation of cytoplasmic Armadillo/beta-catenin, demonstrating that Li+ can mimic Wingless signalling in intact cells, consistent with its inhibition of GSK-3."
    explanation: >-
      In intact mammalian (PC12) and insect cells, lithium inhibition of GSK-3
      stabilizes β-catenin and reproduces canonical Wnt (Wingless) signaling,
      tying GSK-3β inhibition to a defined downstream pathway.
  downstream:
  - target: Circadian Rhythm Disruption
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - GSK-3β phosphorylates core clock proteins, so excess GSK-3β activity
      shortens/destabilizes circadian period and amplitude (lithium's GSK-3β
      inhibition lengthens period, per the GSK3β-haploinsufficiency model).
  - target: Neuroplasticity Alterations
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Excess GSK-3β activity suppresses BDNF/neurotrophic and β-catenin survival
      signaling, impairing synaptic plasticity in fronto-limbic mood circuits.
- name: Phosphoinositide Signaling Dysregulation
  description: >
    Overactivity of the phosphatidylinositol (PIP2 / IP3) second-messenger cycle
    is implicated in bipolar mood instability (the "inositol depletion
    hypothesis"). The cycle regenerates free myo-inositol through inositol
    monophosphatase (IMPase) and inositol polyphosphate 1-phosphatase; lithium
    uncompetitively inhibits these Mg2+-dependent phosphatases, depleting free
    inositol and dampening the overactive signaling — a therapeutic target
    shared with valproate and carbamazepine. (The disease-state direction shown
    here is the overactive baseline; lithium's opposing, inhibitory action is
    captured on the Lithium treatment's target_mechanisms edge.)
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Inositol Phosphate Metabolism
    term:
      id: GO:0043647
      label: inositol phosphate metabolic process
    modifier: INCREASED
  - preferred_term: Phosphatidylinositol-Mediated Signaling
    term:
      id: GO:0048015
      label: phosphatidylinositol-mediated signaling
    modifier: INCREASED
  evidence:
  - reference: PMID:12015604
    reference_title: "A common mechanism of action for three mood-stabilizing drugs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inositol, however, reverses the effects of the drugs on growth cones, thus implicating inositol depletion in their action."
    explanation: >-
      Williams et al. showed that lithium, valproate, and carbamazepine converge
      on inositol depletion — exogenous inositol rescues their shared cellular
      effect, direct evidence for the inositol-depletion mechanism.
  - reference: PMID:12015604
    reference_title: "A common mechanism of action for three mood-stabilizing drugs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Berridge and colleagues suggested that inositol depletion may be the way that lithium works in bipolar affective disorder, but others have suggested that glycogen synthase kinase (GSK3) may be the relevant target."
    explanation: >-
      Frames the two leading molecular hypotheses of lithium action — inositol
      depletion versus GSK-3 inhibition — both of which are curated as distinct
      pathophysiology nodes in this entry.
  - reference: PMID:21743136
    reference_title: "Neuroprotective action of lithium in disorders of the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By inhibiting the activity of phosphoinositol phosphatases, it decreases levels of inositol 1,4,5-trisphosphate, a process recently identified as a novel mechanism for inducing autophagy."
    explanation: >-
      Lithium inhibition of inositol phosphatases lowers IP3 and links inositol
      depletion to autophagy induction, a downstream neuroprotective consequence.

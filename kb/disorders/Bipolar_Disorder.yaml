name: Bipolar Disorder
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Bipolar disorder is a chronic psychiatric mood disorder characterized by
  recurrent episodes of mania or hypomania alternating with depression. Subtypes
  include bipolar I (full manic episodes), bipolar II (hypomania with major
  depression), and cyclothymic disorder. Its pathophysiology involves
  dysregulation of monoaminergic neurotransmission, mitochondrial and cellular
  energetics dysfunction, and disturbances of circadian and neuroplasticity
  signaling.
category: Complex
parents:
- Psychiatric Disease
disease_term:
  preferred_term: bipolar disorder
  term:
    id: MONDO:0004985
    label: bipolar disorder
has_subtypes:
- name: Bipolar I Disorder
  description: Characterized by manic episodes, with or without depressive episodes.
  evidence:
  - reference: PMID:31043756
    reference_title: "Genome-wide association study identifies 30 loci associated with bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bipolar I disorder is strongly genetically correlated with schizophrenia, driven by psychosis"
    explanation: Large GWAS shows bipolar I disorder is genetically distinguished from bipolar II by its strong correlation with schizophrenia and psychosis.
- name: Bipolar II Disorder
  description: Characterized by hypomanic and depressive episodes, no full mania.
  evidence:
  - reference: PMID:31043756
    reference_title: "Genome-wide association study identifies 30 loci associated with bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bipolar II disorder is more strongly correlated with major depressive disorder"
    explanation: GWAS genetic-correlation analysis distinguishes bipolar II disorder from bipolar I by its stronger correlation with major depressive disorder.
- name: Cyclothymic Disorder
  description: Chronic fluctuating mood with hypomanic and depressive symptoms.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_polygenic_synaptic_circadian_dysregulation_model
  hypothesis_label: Canonical Polygenic / Synaptic / Circadian Dysregulation Model
  status: CANONICAL
  description: >-
    Bipolar disorder is a highly heritable polygenic mood disorder in which common variants in CACNA1C,
    ANK3, ODZ4, and other ion-channel and synaptic genes combine with circadian/clock gene variants
    (CLOCK, BMAL1, NR1D1) to produce episodic mood instability. Mitochondrial dysfunction, calcium-
    signaling dysregulation, and altered neuroplasticity in fronto-limbic circuits (anterior cingulate,
    amygdala, ventral striatum) drive cycling between depressive and manic states. Lithium's mood-
    stabilizing efficacy (targeting GSK-3β / inositol monophosphatase / circadian amplitude),
    valproate's modulation of histone deacetylases, and the recurrent involvement of the dopaminergic
    reward system during manic episodes corroborate the polygenic-synaptic-circadian framework as the
    canonical model.
  notes: >-
    Retained as CANONICAL with six explicit
    qualifications, independently re-verified against the cited
    primary sources rather than the 2026 openscientist
    hypothesis-search report's framing
    (kb/hypotheses/Bipolar_Disorder/canonical_polygenic_synaptic_circadian_dysregulation_model),
    which finds PARTIALLY SUPPORTED. Each major pillar — common
    ion-channel / synaptic gene variants (CACNA1C, ANK3, ODZ4),
    circadian/clock variants, mitochondrial dysfunction, calcium
    signaling, and fronto-limbic neuroplasticity — has
    substantial GWAS, iPSC, animal-model, and pharmacological
    support, with lithium and valproate efficacy and dopaminergic
    mania consistent with the model. The 2025 multi-ancestry PGC4
    GWAS (298 genome-wide-significant loci across 158,036 cases
    and 2.8 million controls, PMID:39843750) is the current
    largest genetic-architecture study of BD and supersedes the
    smaller PGC3 scan the report's genetics framing was based on.
    Six qualifications, each rescoped to what its cited study
    actually shows: (1) postmortem cortical transcriptome data
    (PMID:33442739) show a less-pronounced, psychosis-concentrated
    similarity between schizophrenia and BD gene-expression
    alterations — the study never tested the canonical
    calcium/circadian/synaptic model and did not restrict its BD
    sample to BD-I, so it qualifies rather than establishes that
    the model "best explains psychotic BD-I"; (2) the
    calcium-channel-blocker translational picture is a small,
    unresolved lead rather than a demonstrated
    dihydropyridine-vs-verapamil subclass effect — the decisive
    verapamil-to-dihydropyridine (nimodipine, then isradipine)
    response switch involved only two bipolar patients embedded in
    a 30-person mixed unipolar/bipolar refractory-affective-illness
    cohort (PMID:9790159), and a broader review of calcium-channel
    antagonist trials in BD found only limited support for efficacy
    (PMID:11252650); (3) lithium response pharmacogenomics
    implicates PI3K-Akt / focal-adhesion pathways rather than direct
    GSK-3β (partially reconcilable via the PI3K→Akt→GSK-3β cascade);
    (4) TIMELESS and RORA are circadian-gene leads from a single 2014
    candidate-gene association study (353 SNPs across 21 circadian
    genes, meta-analysed across two internal BD cohorts,
    PMID:24716566), not an update established across the modern GWAS
    literature, so they supplement rather than displace CLOCK/BMAL1
    as canonical circadian candidates; (5) the claim that
    BD-risk-gene-attributed structural abnormalities are shared
    across the psychosis spectrum conflates two weaker, separate
    findings — a candidate-SNP imaging study of CACNA1C/ANK3/ODZ4/SYNE1
    found no risk-variant-structural association surviving
    multiple-testing correction (PMID:23820096), so there is no
    confirmed gene-attributed structural finding to generalize from,
    and a separate ENIGMA mega-/meta-analysis found shared
    cortical/subcortical abnormalities across BD, schizophrenia, major
    depressive disorder, and OCD generally (PMID:32646651) — a
    transdiagnostic pattern, not one specific to a psychosis spectrum
    or tied to risk-gene status; (6) critical experiments remain
    largely unperformed — no GSK-3β-selective inhibitor trial and no
    chronotherapy prevention trial from euthymia exist as of 2026, and
    while a modern dihydropyridine CCB trial was registered (adjunctive
    isradipine for bipolar depression, NCT01784666), it was terminated
    early for lack of enrollment (2 participants), so an adequately
    powered modern DHP-CCB trial remains a real gap rather than one
    that was never attempted.
  evidence:
  - reference: PMID:21057379
    reference_title: "Case-case genome-wide association analysis shows markers differentially associated with schizophrenia and bipolar disorder and implicates calcium channel genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding for CACNG5, taken together with the earlier implication of CACNA1C and CACNA1B, strongly suggests a key role for voltage-dependent calcium channel genes in the susceptibility to bipolar disorder and/or schizophrenia."
    explanation: >
      Existing canonical mechanism citation in the dismech
      knowledge base, used as the seed for the hypothesis-search
      deep-research run.
  - reference: PMID:33442739
    reference_title: "Similarities in Cortical Transcriptome Alterations Between Schizophrenia and Bipolar Disorder Are Related to the Presence of Psychosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "correlation analyses showed that BP subjects had similar, although less pronounced, gene expression alterations"
    explanation: >
      Postmortem cortical transcriptome comparison finds BD subjects
      share schizophrenia-like gene-expression alterations, but only
      less pronounced ones concentrated among BD subjects with
      psychosis. The case-control study did not test the canonical
      calcium/circadian/synaptic model directly and did not restrict
      its BD sample to BD-I, so it qualifies rather than establishes
      that the model "best explains psychotic BD-I."
  - reference: PMID:9790159
    reference_title: "Nimodipine monotherapy and carbamazepine augmentation in patients with refractory recurrent affective illness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two BP patients failed to maintain improvement but responded again to nimodipine and remained well with a blind transition to another dihydropyridine L-type calcium channel blocker (CCB), isradipine"
    explanation: >
      The decisive verapamil-to-dihydropyridine response switch cited
      for the pharmacological-subclass hypothesis involved only two
      bipolar patients within a 30-person mixed-diagnosis
      refractory-affective-illness cohort — a small case-series lead,
      not a demonstrated subclass effect.
  - reference: PMID:11252650
    reference_title: "Calcium channel antagonists for the treatment of bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "concluding there is presently limited support for their efficacy"
    explanation: >
      Review of calcium-channel-antagonist trials in bipolar disorder
      concludes that more recent, better-controlled studies found only
      limited support for efficacy, tempering the
      calcium-channel-blocker translational-failure claim.
  - reference: PMID:24716566
    reference_title: "Association between circadian genes, bipolar disorders and chronotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TIMELESS and RORA genes may confer susceptibility to BD and impact on circadian"
    explanation: >
      Single 2014 candidate-gene association study (353 SNPs across 21
      circadian genes, meta-analysed across two internal BD cohorts)
      finds TIMELESS and RORA variants associated with BD. This is a
      circadian-gene lead from one study design, not a modern
      literature-wide meta-analytic replacement for CLOCK/BMAL1
      priority.
  - reference: PMID:23820096
    reference_title: "No evidence for association between bipolar disorder risk gene variants and brain structural phenotypes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "these risk SNPs do not explain a large proportion of the structural brain alterations in BD"
    explanation: >
      Candidate-SNP imaging study of CACNA1C, ANK3, ODZ4, and SYNE1
      found no risk-variant-structural association surviving
      multiple-testing correction, refuting the premise that structural
      brain abnormalities are attributed to BD risk genes in the first
      place.
  - reference: PMID:32646651
    reference_title: "Cross-Disorder Analysis of Brain Structural Abnormalities in Six Major Psychiatric Disorders: A Secondary Analysis of Mega- and Meta-analytical Findings From the ENIGMA Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain structural abnormalities in major depressive disorder, bipolar disorder, schizophrenia, and obsessive-compulsive disorder were highly correlated"
    explanation: >
      ENIGMA mega-/meta-analysis finds shared cortical/subcortical
      abnormality patterns across BD, schizophrenia, major depressive
      disorder, and obsessive-compulsive disorder generally — a
      transdiagnostic pattern, not one specific to a psychosis spectrum
      or tied to BD-risk-gene status.
  - reference: clinicaltrials:NCT01784666
    reference_title: "Adjunctive Isradipine for the Treatment of Bipolar Depression"
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Isradipine or placebo (contains no active medication) will be used as an "add-on" to lithium, valproate, and/or atypical antipsychotics for individuals currently experiencing a major depressive episode.'
    explanation: >
      A modern adjunctive-isradipine (dihydropyridine L-type CCB) trial
      for bipolar depression was registered, refuting a categorical "no
      modern dihydropyridine CCB trial" claim. ClinicalTrials.gov
      records it as Terminated for lack of enrollment (2 participants),
      so an adequately powered modern DHP-CCB trial remains a real gap
      rather than one never attempted.
  - reference: PMID:39843750
    reference_title: "Genomics yields biological and phenotypic insights into bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analysed data from participants of European, East Asian, African American and Latino ancestries (n = 158,036 cases with bipolar disorder, 2.8 million controls)"
    explanation: >
      The 2025 multi-ancestry PGC4 GWAS (298 genome-wide-significant
      loci) is the current largest genetic-architecture study of BD,
      updating the polygenic-risk-locus evidence base beyond the
      smaller PGC3 scan the 2026 hypothesis-search report's genetics
      framing was based on.
  - reference: PMID:34002096
    reference_title: "Genome-wide association study of more than 40,000 bipolar disorder cases provides new insights into the underlying biology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bipolar disorder risk alleles were enriched in genes in synaptic signaling pathways and brain-expressed genes, particularly those with high specificity of expression in neurons of the prefrontal cortex and hippocampus."
    explanation: >
      Genome-wide, hypothesis-free pathway enrichment is the strongest
      unbiased support for the synaptic pillar of this model: the risk
      alleles concentrate in synaptic-signaling genes expressed in
      prefrontal-cortex and hippocampal neurons rather than being spread
      across brain-expressed genes generally.
  - reference: PMID:34002096
    reference_title: "Genome-wide association study of more than 40,000 bipolar disorder cases provides new insights into the underlying biology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant signal enrichment was found in genes encoding targets of antipsychotics, calcium channel blockers, antiepileptics and anesthetics."
    explanation: >
      Drug-target enrichment ties the polygenic signal to the calcium and
      ion-channel pharmacology named by this model. Note the enrichment is
      shared with antipsychotic, antiepileptic and anesthetic targets, so it
      supports ion-channel involvement broadly rather than singling out
      L-type calcium channels.
pathophysiology:
- name: Monoamine Dysregulation
  description: >
    Imbalances in dopamine, norepinephrine, and serotonin neurotransmission
    contribute to mood episodes. Elevated dopamine in mania, reduced in
    depression.
  cell_types:
  - preferred_term: Dopaminergic Neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  - preferred_term: Serotonergic Neuron
    term:
      id: CL:0000850
      label: serotonergic neuron
  - preferred_term: Noradrenergic Neuron
    term:
      id: CL:0008025
      label: noradrenergic neuron
  biological_processes:
  - preferred_term: Neurotransmitter Signaling
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "Activation of the dopamine receptor 2 (D2R) has been shown to stimulate the inactivation of Akt by PP2A (Beaulieu et al., 2005; Beaulieu and Gainetdinov, 2011), therefore providing a mechanism through which GPCR activation can inhibit Akt in response to extracellular signals."
    explanation: Dopamine D2 receptor signaling regulates the Akt/GSK3 pathway, providing a molecular link between monoaminergic neurotransmission and mood regulation in bipolar disorder.
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "This mechanism of D2R signaling appears to play important roles in the regulation of locomotor behavior and sensory motor gating by dopamine (Beaulieu et al., 2004; Emamian et al., 2004). It could also contribute to the therapeutic and/or adverse effects of psychoactive drugs like amphetamines and antpsychotics that act on dopamine neurotransmission"
    explanation: The D2 receptor-mediated regulation of GSK3 activity through beta-arrestin signaling is implicated in behavioral regulation relevant to bipolar disorder and the mechanism of mood stabilizers and antipsychotics.
- name: Intracellular Calcium Dysregulation
  biological_scale: CELLULAR
  description: >
    Altered intracellular calcium handling is among the oldest and most
    replicated cellular findings in bipolar disorder: basal and stimulated
    cytosolic calcium are elevated in patient platelets and lymphocytes, and
    endoplasmic-reticulum calcium release through the IP3 receptor is enhanced
    in patient lymphoblasts carrying the low-expressing BCL2 rs956572 AA
    genotype. This is the cellular counterpart of the calcium-channel genetics
    curated under CACNA1C. Two scope limits are load-bearing and should not be
    read past: the replicated measurements are in peripheral blood cells rather
    than neurons, and they have not been shown to track mood state over time --
    the original series found little correlation between calcium measures and
    mood-rating severity. The node therefore records a trait-associated
    calcium abnormality, not a demonstrated driver of episode switching (see
    the attached knowledge gap).
  biological_processes:
  - preferred_term: Intracellular Calcium Homeostasis
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  - preferred_term: IP3 Receptor-Mediated ER Calcium Release
    term:
      id: GO:0006816
      label: calcium ion transport
    modifier: INCREASED
  evidence:
  - reference: PMID:10418700
    reference_title: "Elevated basal and thapsigargin-stimulated intracellular calcium of platelets and lymphocytes from bipolar affective disorder patients measured by a fluorometric microassay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed significantly elevated basal calcium concentrations in bipolar patient platelets and lymphocytes compared to control subjects."
    explanation: >-
      Direct measurement of the elevated basal calcium finding in 30 affective
      disorder patients versus 14 controls, the replicated peripheral-cell
      observation this node records.
  - reference: PMID:10418700
    reference_title: "Elevated basal and thapsigargin-stimulated intracellular calcium of platelets and lymphocytes from bipolar affective disorder patients measured by a fluorometric microassay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data suggest that storage operated calcium channels may be the source of the elevated intracellular calcium in platelets and lymphocytes of bipolar patients"
    explanation: >-
      Locates the abnormality at store-operated calcium entry rather than at
      the plasma-membrane voltage-gated channels implicated by the CACNA1C
      genetics, so the two calcium findings are complementary rather than the
      same lesion measured twice.
  - reference: PMID:21167476
    reference_title: "The Bcl-2 gene polymorphism rs956572AA increases inositol 1,4,5-trisphosphate receptor-mediated endoplasmic reticulum calcium release in subjects with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results demonstrate that, in patients with BPD, abnormal Bcl-2 gene expression in the AA variant contributes to dysfunctional Ca(2+) homeostasis through a specific ER inositol 1,4,5-trisphosphate receptor-dependent mechanism."
    explanation: >-
      Supplies a genotype-to-mechanism account for part of the calcium
      abnormality: reduced BCL2 expression in rs956572 AA carriers enhances
      IP3-receptor-dependent ER calcium release. Scope caveat -- 18 patient
      lymphoblast lines, a peripheral cell model, not neurons.
  - reference: PMID:21167476
    reference_title: "The Bcl-2 gene polymorphism rs956572AA increases inositol 1,4,5-trisphosphate receptor-mediated endoplasmic reticulum calcium release in subjects with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The aberrant behavior of AA cells was reversed by chronic lithium treatment and mimicked in variant GG by a Bcl-2 inhibitor."
    explanation: >-
      Pharmacological convergence in both directions -- lithium normalizes the
      genotype-associated calcium phenotype and a BCL2 inhibitor reproduces it
      in non-risk cells -- which is what ties this node to the treatment
      section rather than leaving it as an isolated biomarker.
  downstream:
  - target: Mitochondrial Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed rather than demonstrated. A published model argues that raised
      cytosolic calcium in mania drives increased mitochondrial respiration and
      ATP production, with the euthymic and depressive phases showing the
      opposite. No study cited here measures calcium and mitochondrial
      respiration in the same subjects across a mood transition, so the edge is
      recorded at unknown-intermediate directness.
    intermediate_mechanisms:
    - Raised cytosolic calcium is proposed to stimulate oxidative
      phosphorylation, in part through modulation of the F1-FO elements of ATP
      synthase, alongside oxidative stress and pro-inflammatory cytokine
      signaling that are themselves higher in mania.
    evidence:
    - reference: PMID:28093238
      reference_title: "A model of the mitochondrial basis of bipolar disorder."
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      snippet: "Levels of oxidative stress, pro-inflammatory cytokines and intracellular calcium ions are all higher in bipolar mania than in the euthymic and depressive phases of the illness."
      explanation: >-
        States the calcium-to-mitochondrial-respiration step this edge encodes.
        Graded OTHER and INDIRECT because the source is an explanatory model
        paper synthesizing prior literature, not a study that tested the
        proposed sequence.
- name: Neuronal Hyperexcitability
  biological_scale: CELLULAR
  description: >
    Patient-derived neurons show intrinsic hyperexcitability, offering a
    cellular endophenotype that sits between the ion-channel genetics and the
    circuit-level findings. iPSC-derived hippocampal dentate-gyrus-like
    granule neurons from bipolar patients fire action potentials hyperactively
    and carry mitochondrial abnormalities relative to control-derived neurons.
    The finding is also a treatment-response stratifier: lithium reverses the
    hyperexcitability only in neurons from donors who were themselves clinical
    lithium responders. Scope limits -- six manic bipolar I donors and four
    unaffected individuals, one differentiated neuron type, and no
    demonstration that hyperexcitability causes episode switching rather than
    marking trait vulnerability.
  cell_types:
  - preferred_term: iPSC-derived hippocampal dentate gyrus-like granule neuron
    term:
      id: CL:0001033
      label: hippocampal granule cell
  biological_processes:
  - preferred_term: Action Potential Firing
    term:
      id: GO:0001508
      label: action potential
    modifier: INCREASED
  - preferred_term: Regulation of Neuronal Membrane Potential
    term:
      id: GO:0042391
      label: regulation of membrane potential
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26524527
    reference_title: "Differential responses to lithium in hyperexcitable neurons from patients with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "we have detected mitochondrial abnormalities in young neurons from patients with bipolar disorder by using mitochondrial assays; in addition, using both patch-clamp recording and somatic Ca(2+) imaging, we have observed hyperactive action-potential firing."
    explanation: >-
      The primary measurement behind this node: patch-clamp and calcium imaging
      in patient-derived dentate-gyrus-like neurons show hyperactive
      action-potential firing alongside mitochondrial abnormalities, in
      patient-derived human tissue rather than an animal model.
  - reference: PMID:26524527
    reference_title: "Differential responses to lithium in hyperexcitable neurons from patients with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This hyperexcitability phenotype of young neurons in bipolar disorder was selectively reversed by lithium treatment only in neurons derived from patients who also responded to lithium treatment."
    explanation: >-
      The responder-selective rescue is what makes this node a candidate
      treatment-response stratifier rather than a generic cellular abnormality:
      the in-vitro correction tracks the donor's own clinical lithium response.
      It holds for the sampled lines and has not been shown to generalize
      across the heterogeneity of bipolar disorder.
- name: Mitochondrial Dysfunction
  description: >
    Impaired cellular energy metabolism and oxidative stress affect
    neuronal function. Mitochondrial abnormalities linked to mood
    dysregulation.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: NO_EVIDENCE
    snippet: "Psychiatric disorders (such as bipolar disorder, depression, and schizophrenia) affect the lives of millions of individuals worldwide."
    explanation: This review discusses the molecular mechanisms underlying psychiatric disorders including bipolar disorder, with focus on the DISC1/GSK3 complex which regulates mitochondrial and cellular functions.
  - reference: PMID:26524527
    reference_title: "Differential responses to lithium in hyperexcitable neurons from patients with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Strikingly, we found that the expression of multiple mitochondria genes was significantly enhanced in the BD neurons"
    explanation: >-
      RNA-seq of patient-derived dentate-gyrus-like neurons finds coordinated
      upregulation of mitochondrial genes, the first direct measurement
      supporting this node in patient-derived human neurons rather than by
      inference from review literature.
  - reference: PMID:26524527
    reference_title: "Differential responses to lithium in hyperexcitable neurons from patients with bipolar disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Flow cytometry analysis revealed that BD neurons showed increased red/green ratios, indicative of enhanced mitochondrial function"
    explanation: >-
      Note the direction: membrane-potential assay in young patient-derived
      neurons shows *enhanced* mitochondrial function, not the deficit the node
      description implies. Curated as a qualification -- the abnormality is
      established, but this study argues against reading it uniformly as
      impaired energy metabolism, consistent with the phasic model in which
      respiration is raised in mania and lowered in euthymia and depression.
- name: Circadian Rhythm Disruption
  description: >
    Disrupted sleep-wake cycles and circadian gene expression
    contribute to mood instability. Sleep deprivation can trigger mania.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Circadian Rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: NO_EVIDENCE
    snippet: "For more than 60 years, the mood stabilizer lithium has been used alone or in combination for the treatment of bipolar disorder, schizophrenia, depression, and other mental illnesses."
    explanation: This comprehensive review discusses lithium as the gold standard treatment for bipolar disorder, noting its mood-stabilizing effects through GSK3 inhibition which affects multiple cellular pathways including circadian regulation.
  - reference: PMID:23919927
    reference_title: "Glycogen synthase kinase-3β haploinsufficiency lengthens the circadian locomotor activity period in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these data suggest that GSK3β acts as a critical intrinsic regulator of the circadian clock and plays an important role in regulating its period in response to lithium treatment"
    explanation: >-
      GSK3β haploinsufficiency lengthens circadian period in mice, mechanistically
      linking lithium's inhibition of GSK3β to its documented effects on circadian
      rhythm period and amplitude in bipolar disorder.
  - reference: PMID:20591414
    reference_title: "Knockdown of Clock in the ventral tegmental area through RNA interference results in a mixed state of mania and depression-like behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that knockdown of Clock, specifically in the VTA, results in hyperactivity and a reduction in anxiety-related behavior, which is similar to the phenotype of the ClockDelta19 mice."
    explanation: >-
      Region-restricted RNA-interference knockdown shows that disrupting a
      single core clock gene in one brain region is sufficient to produce
      mania-like behavior, which is the strongest causal support available for
      the circadian pillar of this model.
  - reference: PMID:20591414
    reference_title: "Knockdown of Clock in the ventral tegmental area through RNA interference results in a mixed state of mania and depression-like behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, VTA-specific knockdown also results in a substantial increase in depression-like behavior, creating an overall mixed manic state."
    explanation: >-
      The qualification the model needs, quoted from the same result. The
      manipulation does not produce cycling between separable manic and
      depressive states; the authors characterize the outcome as a single mixed
      state. So this is a mouse demonstration that clock disruption destabilizes
      mood-related behavior, not a demonstration of the episodic switching the
      canonical model is invoked to explain.
  downstream:
  - target: Monoamine Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Clock-gene disruption raises dopaminergic output. Evidence is a targeted
      rodent perturbation; no human circadian variant has been shown to drive
      dopaminergic change in bipolar patients, so the edge is model-organism
      grounded rather than established in human disease.
    intermediate_mechanisms:
    - Loss of CLOCK function in ventral tegmental area dopaminergic neurons
      alters expression of ion channels and dopamine-related genes, increasing
      the firing activity of those neurons and so raising dopaminergic drive to
      forebrain reward circuits.
    evidence:
    - reference: PMID:20591414
      reference_title: "Knockdown of Clock in the ventral tegmental area through RNA interference results in a mixed state of mania and depression-like behavior."

name: Bipolar Disorder
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Bipolar disorder is a chronic psychiatric mood disorder characterized by
  recurrent episodes of mania or hypomania alternating with depression. Subtypes
  include bipolar I (full manic episodes), bipolar II (hypomania with major
  depression), and cyclothymic disorder. Its pathophysiology involves
  dysregulation of monoaminergic neurotransmission, mitochondrial and cellular
  energetics dysfunction, and disturbances of circadian and neuroplasticity
  signaling.
category: Complex
parents:
- Psychiatric Disease
disease_term:
  preferred_term: bipolar disorder
  term:
    id: MONDO:0004985
    label: bipolar disorder
has_subtypes:
- name: Bipolar I Disorder
  description: Characterized by manic episodes, with or without depressive episodes.
  evidence:
  - reference: PMID:31043756
    reference_title: "Genome-wide association study identifies 30 loci associated with bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bipolar I disorder is strongly genetically correlated with schizophrenia, driven by psychosis"
    explanation: Large GWAS shows bipolar I disorder is genetically distinguished from bipolar II by its strong correlation with schizophrenia and psychosis.
- name: Bipolar II Disorder
  description: Characterized by hypomanic and depressive episodes, no full mania.
  evidence:
  - reference: PMID:31043756
    reference_title: "Genome-wide association study identifies 30 loci associated with bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bipolar II disorder is more strongly correlated with major depressive disorder"
    explanation: GWAS genetic-correlation analysis distinguishes bipolar II disorder from bipolar I by its stronger correlation with major depressive disorder.
- name: Cyclothymic Disorder
  description: Chronic fluctuating mood with hypomanic and depressive symptoms.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_polygenic_synaptic_circadian_dysregulation_model
  hypothesis_label: Canonical Polygenic / Synaptic / Circadian Dysregulation Model
  status: CANONICAL
  description: >-
    Bipolar disorder is a highly heritable polygenic mood disorder in which common variants in CACNA1C,
    ANK3, ODZ4, and other ion-channel and synaptic genes combine with circadian/clock gene variants
    (CLOCK, BMAL1, NR1D1) to produce episodic mood instability. Mitochondrial dysfunction, calcium-
    signaling dysregulation, and altered neuroplasticity in fronto-limbic circuits (anterior cingulate,
    amygdala, ventral striatum) drive cycling between depressive and manic states. Lithium's mood-
    stabilizing efficacy (targeting GSK-3β / inositol monophosphatase / circadian amplitude),
    valproate's modulation of histone deacetylases, and the recurrent involvement of the dopaminergic
    reward system during manic episodes corroborate the polygenic-synaptic-circadian framework as the
    canonical model.
  notes: >-
    Retained as CANONICAL with six explicit
    qualifications, independently re-verified against the cited
    primary sources rather than the 2026 openscientist
    hypothesis-search report's framing
    (kb/hypotheses/Bipolar_Disorder/canonical_polygenic_synaptic_circadian_dysregulation_model),
    which finds PARTIALLY SUPPORTED. Each major pillar — common
    ion-channel / synaptic gene variants (CACNA1C, ANK3, ODZ4),
    circadian/clock variants, mitochondrial dysfunction, calcium
    signaling, and fronto-limbic neuroplasticity — has
    substantial GWAS, iPSC, animal-model, and pharmacological
    support, with lithium and valproate efficacy and dopaminergic
    mania consistent with the model. The 2025 multi-ancestry PGC4
    GWAS (298 genome-wide-significant loci across 158,036 cases
    and 2.8 million controls, PMID:39843750) is the current
    largest genetic-architecture study of BD and supersedes the
    smaller PGC3 scan the report's genetics framing was based on.
    Six qualifications, each rescoped to what its cited study
    actually shows: (1) postmortem cortical transcriptome data
    (PMID:33442739) show a less-pronounced, psychosis-concentrated
    similarity between schizophrenia and BD gene-expression
    alterations — the study never tested the canonical
    calcium/circadian/synaptic model and did not restrict its BD
    sample to BD-I, so it qualifies rather than establishes that
    the model "best explains psychotic BD-I"; (2) the
    calcium-channel-blocker translational picture is a small,
    unresolved lead rather than a demonstrated
    dihydropyridine-vs-verapamil subclass effect — the decisive
    verapamil-to-dihydropyridine (nimodipine, then isradipine)
    response switch involved only two bipolar patients embedded in
    a 30-person mixed unipolar/bipolar refractory-affective-illness
    cohort (PMID:9790159), and a broader review of calcium-channel
    antagonist trials in BD found only limited support for efficacy
    (PMID:11252650); (3) lithium response pharmacogenomics
    implicates PI3K-Akt / focal-adhesion pathways rather than direct
    GSK-3β (partially reconcilable via the PI3K→Akt→GSK-3β cascade);
    (4) TIMELESS and RORA are circadian-gene leads from a single 2014
    candidate-gene association study (353 SNPs across 21 circadian
    genes, meta-analysed across two internal BD cohorts,
    PMID:24716566), not an update established across the modern GWAS
    literature, so they supplement rather than displace CLOCK/BMAL1
    as canonical circadian candidates; (5) the claim that
    BD-risk-gene-attributed structural abnormalities are shared
    across the psychosis spectrum conflates two weaker, separate
    findings — a candidate-SNP imaging study of CACNA1C/ANK3/ODZ4/SYNE1
    found no risk-variant-structural association surviving
    multiple-testing correction (PMID:23820096), so there is no
    confirmed gene-attributed structural finding to generalize from,
    and a separate ENIGMA mega-/meta-analysis found shared
    cortical/subcortical abnormalities across BD, schizophrenia, major
    depressive disorder, and OCD generally (PMID:32646651) — a
    transdiagnostic pattern, not one specific to a psychosis spectrum
    or tied to risk-gene status; (6) critical experiments remain
    largely unperformed — no GSK-3β-selective inhibitor trial and no
    chronotherapy prevention trial from euthymia exist as of 2026, and
    while a modern dihydropyridine CCB trial was registered (adjunctive
    isradipine for bipolar depression, NCT01784666), it was terminated
    early for lack of enrollment (2 participants), so an adequately
    powered modern DHP-CCB trial remains a real gap rather than one
    that was never attempted.
  evidence:
  - reference: PMID:21057379
    reference_title: "Case-case genome-wide association analysis shows markers differentially associated with schizophrenia and bipolar disorder and implicates calcium channel genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding for CACNG5, taken together with the earlier implication of CACNA1C and CACNA1B, strongly suggests a key role for voltage-dependent calcium channel genes in the susceptibility to bipolar disorder and/or schizophrenia."
    explanation: >
      Existing canonical mechanism citation in the dismech
      knowledge base, used as the seed for the hypothesis-search
      deep-research run.
  - reference: PMID:33442739
    reference_title: "Similarities in Cortical Transcriptome Alterations Between Schizophrenia and Bipolar Disorder Are Related to the Presence of Psychosis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "correlation analyses showed that BP subjects had similar, although less pronounced, gene expression alterations"
    explanation: >
      Postmortem cortical transcriptome comparison finds BD subjects
      share schizophrenia-like gene-expression alterations, but only
      less pronounced ones concentrated among BD subjects with
      psychosis. The case-control study did not test the canonical
      calcium/circadian/synaptic model directly and did not restrict
      its BD sample to BD-I, so it qualifies rather than establishes
      that the model "best explains psychotic BD-I."
  - reference: PMID:9790159
    reference_title: "Nimodipine monotherapy and carbamazepine augmentation in patients with refractory recurrent affective illness."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "two BP patients failed to maintain improvement but responded again to nimodipine and remained well with a blind transition to another dihydropyridine L-type calcium channel blocker (CCB), isradipine"
    explanation: >
      The decisive verapamil-to-dihydropyridine response switch cited
      for the pharmacological-subclass hypothesis involved only two
      bipolar patients within a 30-person mixed-diagnosis
      refractory-affective-illness cohort — a small case-series lead,
      not a demonstrated subclass effect.
  - reference: PMID:11252650
    reference_title: "Calcium channel antagonists for the treatment of bipolar disorder."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "concluding there is presently limited support for their efficacy"
    explanation: >
      Review of calcium-channel-antagonist trials in bipolar disorder
      concludes that more recent, better-controlled studies found only
      limited support for efficacy, tempering the
      calcium-channel-blocker translational-failure claim.
  - reference: PMID:24716566
    reference_title: "Association between circadian genes, bipolar disorders and chronotypes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "TIMELESS and RORA genes may confer susceptibility to BD and impact on circadian"
    explanation: >
      Single 2014 candidate-gene association study (353 SNPs across 21
      circadian genes, meta-analysed across two internal BD cohorts)
      finds TIMELESS and RORA variants associated with BD. This is a
      circadian-gene lead from one study design, not a modern
      literature-wide meta-analytic replacement for CLOCK/BMAL1
      priority.
  - reference: PMID:23820096
    reference_title: "No evidence for association between bipolar disorder risk gene variants and brain structural phenotypes."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "these risk SNPs do not explain a large proportion of the structural brain alterations in BD"
    explanation: >
      Candidate-SNP imaging study of CACNA1C, ANK3, ODZ4, and SYNE1
      found no risk-variant-structural association surviving
      multiple-testing correction, refuting the premise that structural
      brain abnormalities are attributed to BD risk genes in the first
      place.
  - reference: PMID:32646651
    reference_title: "Cross-Disorder Analysis of Brain Structural Abnormalities in Six Major Psychiatric Disorders: A Secondary Analysis of Mega- and Meta-analytical Findings From the ENIGMA Consortium."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain structural abnormalities in major depressive disorder, bipolar disorder, schizophrenia, and obsessive-compulsive disorder were highly correlated"
    explanation: >
      ENIGMA mega-/meta-analysis finds shared cortical/subcortical
      abnormality patterns across BD, schizophrenia, major depressive
      disorder, and obsessive-compulsive disorder generally — a
      transdiagnostic pattern, not one specific to a psychosis spectrum
      or tied to BD-risk-gene status.
  - reference: clinicaltrials:NCT01784666
    reference_title: "Adjunctive Isradipine for the Treatment of Bipolar Depression"
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: 'Isradipine or placebo (contains no active medication) will be used as an "add-on" to lithium, valproate, and/or atypical antipsychotics for individuals currently experiencing a major depressive episode.'
    explanation: >
      A modern adjunctive-isradipine (dihydropyridine L-type CCB) trial
      for bipolar depression was registered, refuting a categorical "no
      modern dihydropyridine CCB trial" claim. ClinicalTrials.gov
      records it as Terminated for lack of enrollment (2 participants),
      so an adequately powered modern DHP-CCB trial remains a real gap
      rather than one never attempted.
  - reference: PMID:39843750
    reference_title: "Genomics yields biological and phenotypic insights into bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analysed data from participants of European, East Asian, African American and Latino ancestries (n = 158,036 cases with bipolar disorder, 2.8 million controls)"
    explanation: >
      The 2025 multi-ancestry PGC4 GWAS (298 genome-wide-significant
      loci) is the current largest genetic-architecture study of BD,
      updating the polygenic-risk-locus evidence base beyond the
      smaller PGC3 scan the 2026 hypothesis-search report's genetics
      framing was based on.
pathophysiology:
- name: Monoamine Dysregulation
  description: >
    Imbalances in dopamine, norepinephrine, and serotonin neurotransmission
    contribute to mood episodes. Elevated dopamine in mania, reduced in
    depression.
  cell_types:
  - preferred_term: Dopaminergic Neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  - preferred_term: Serotonergic Neuron

    - reference: PMID:12015604
      reference_title: "A common mechanism of action for three mood-stabilizing drugs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inositol, however, reverses the effects of the drugs on growth cones, thus implicating inositol depletion in their action."
      explanation: Inositol rescue implicates inositol depletion as a mechanism of lithium action.
  - target: Circadian Rhythm Disruption
    treatment_effect: MODULATES
    description: >-
      Through GSK-3β inhibition lithium lengthens circadian period and stabilizes
      clock-gene rhythm amplitude, addressing circadian instability in bipolar disorder.
  - target: Neuroplasticity Alterations
    treatment_effect: MODULATES
    description: >-
      Lithium induces BDNF signaling and upregulates neurotrophic/neuroprotective
      pathways, enhancing synaptic plasticity in fronto-limbic mood circuits.
    evidence:
    - reference: PMID:41672966
      reference_title: "Lithium effects in the frontolimbic circuitry: a systematic review of neuroimaging findings in bipolar disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Across modalities, lithium treatment was most consistently associated with larger volumes in the hippocampus, amygdala, anterior cingulate cortex (ACC), and prefrontal cortex (PFC), and with higher white-matter integrity within frontolimbic circuitry."
      explanation: >-
        Locates lithium's structural association in exactly the fronto-limbic
        regions this model names, at the circuit level rather than the
        molecular level. Graded INDIRECT deliberately: a volume association is
        an inference step away from the plasticity mechanism this edge asserts.
    - reference: PMID:41672966
      reference_title: "Lithium effects in the frontolimbic circuitry: a systematic review of neuroimaging findings in bipolar disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall risk of bias was substantial, yielding low-to-moderate certainty of evidence."
      explanation: >-
        The review's own certainty rating, curated alongside its headline result
        so the edge is not read as established causation. 78 of the 115 included
        studies were cross-sectional and only six were randomized, so the design
        base cannot separate a protective drug effect from confounding by who
        stays on lithium.
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "Lithium has been reported to reduce suicide rates and prevent manic episodes in individuals with bipolar disorder, major depression, or schizoaffective disorders"
    explanation: Lithium is the gold standard mood stabilizer for bipolar disorder with demonstrated efficacy in preventing manic episodes and reducing suicide risk through GSK3 inhibition.
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "In 1996, two independent studies (Klein and Melton, 1996; Stambolic et al., 1996) of the effects of lithium on cell signaling and development have identified a direct effect of lithium on the activity of GSK3 both in vitro and in cells."
    explanation: Lithium's therapeutic mechanism involves direct inhibition of GSK3 and indirect effects through the Akt/beta-arrestin pathway, providing molecular basis for its mood-stabilizing effects.
  - reference: PMID:21743136
    reference_title: "Neuroprotective action of lithium in disorders of the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By inhibiting N-methyl-D-aspartate receptor-mediated calcium influx, for instance, it suppresses the calcium-dependent activation of pro-apoptotic signaling pathways."
    explanation: >-
      Beyond GSK-3β and inositol depletion, lithium contributes to neuronal
      calcium homeostasis by limiting NMDA-receptor calcium influx and downstream
      pro-apoptotic signaling.
  - reference: PMID:38395906
    reference_title: "Lithium response in bipolar disorder is associated with focal adhesion and PI3K-Akt networks: a multi-omics replication study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified functional enrichment in focal adhesion and PI3K-Akt pathways, but we did not find an association with the ECM pathway."
    explanation: >-
      Substantiates the pharmacogenomic qualification asserted in this entry's
      mechanistic-hypothesis notes. In 2,039 ConLiGen patients, the genetic
      signal for who responds to lithium falls in focal-adhesion and PI3K-Akt
      networks. Read precisely: the reported negative is for the ECM pathway,
      and the study did not test GSK3B or inositol pathways head to head, so it
      shows where the inter-individual response signal is rather than refuting
      the GSK-3β account of lithium's action.
  - reference: PMID:16179524
    reference_title: "The antiapoptotic actions of mood stabilizers: molecular mechanisms and therapeutic potentials."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "The neuroprotective mechanisms involve inactivation of NMDA receptors through inhibition of NR2B tyrosine phosphorylation, activation of cell survival factors such as the PI 3-kinase/Akt signaling pathway, and induction of neurotrophic/neuroprotective proteins, including brain-derived neurotrophic factor, heat-shock protein (HSP), and Bcl-2."
    explanation: >-
      Provides the reconciliation between the two previous items: PI3K-Akt is
      itself part of lithium's neuroprotective signaling, and Akt phosphorylates
      and inactivates GSK-3β, so a PI3K-Akt response signal is compatible with a
      GSK-3β endpoint rather than being an alternative to it. Graded INDIRECT
      because this is rat primary neuronal culture work reviewed in a
      neuroprotection context, and the cascade reconciliation was not tested in
      the ConLiGen response cohort.
- name: Valproate
  description: Mood stabilizer, effective for mania.
  evidence:
  - reference: PMID:11473107
    reference_title: "Histone deacetylase is a direct target of valproic acid, a potent anticonvulsant, mood stabilizer, and teratogen."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Valproic acid is widely used to treat epilepsy and bipolar disorder"
    explanation: Establishes valproate as a mood stabilizer used in bipolar disorder and identifies histone deacetylase inhibition as a molecular mechanism of action.
- name: Lamotrigine
  description: Mood stabilizer, more effective for depression prevention.
- name: Atypical Antipsychotics
  description: Quetiapine, olanzapine, aripiprazole for mania and maintenance.
- name: Antidepressants
  description: Used cautiously with mood stabilizer to prevent switch to mania.
- name: Psychotherapy
  description: >-
    CBT, interpersonal therapy, psychoeducation. Interpersonal and social
    rhythm therapy (IPSRT) is the arm that bears on this entry's circadian
    mechanism: it adds an explicit social-rhythm regulation component to
    interpersonal psychotherapy, and is the closest thing to a clinical test of
    whether stabilizing daily rhythms alters the course of bipolar disorder.
  target_mechanisms:
  - target: Circadian Rhythm Disruption
    treatment_effect: MODULATES
    description: >-
      IPSRT regularizes sleep and social routines, and greater achieved
      regularity during acute treatment tracks lower recurrence in maintenance.
      This is an association within a randomized trial rather than a
      demonstrated causal pathway: IPSRT is multicomponent, so the benefit
      cannot be attributed to the circadian component alone, and the
      social-rhythm analysis is mediational rather than a direct circadian
      perturbation.
    evidence:
    - reference: PMID:16143731
      reference_title: "Two-year outcomes for interpersonal and social rhythm therapy in individuals with bipolar I disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Ability to increase regularity of social rhythms during acute treatment was associated with reduced likelihood of recurrence during the maintenance phase (P = .05)."
      explanation: >-
        The specific result linking rhythm regularity to clinical course, and so
        the only clinical evidence in this entry bearing on the circadian node
        as a modifiable target. Graded INDIRECT because it is an
        association between an achieved process measure and outcome, not a
        randomized manipulation of circadian timing.
  evidence:
  - reference: PMID:16143731
    reference_title: "Two-year outcomes for interpersonal and social rhythm therapy in individuals with bipolar I disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "participants assigned to IPSRT in the acute treatment phase survived longer without a new affective episode (P = .01), irrespective of maintenance treatment assignment"
    explanation: >-
      Randomized trial in 175 acutely ill bipolar I patients showing that acute
      phase IPSRT lengthened time to a new episode over two years of
      maintenance. Note the scope: patients entered acutely ill rather than
      euthymic, so this is not the prevention-from-euthymia trial the entry's
      chronotherapy gap refers to.
  - reference: PMID:16143731
    reference_title: "Two-year outcomes for interpersonal and social rhythm therapy in individuals with bipolar I disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed no difference between the treatment strategies in time to stabilization."
    explanation: >-
      Curated alongside the positive result to keep the claim bounded: IPSRT did
      not speed acute stabilization, and its benefit in this trial was confined
      to prophylaxis against later episodes.
  - reference: PMID:26388529
    reference_title: "Bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the evolving pharmacological and psychological strategies in bipolar disorder is of utmost importance"
    explanation: This clinical review emphasizes psychological (psychotherapeutic) strategies alongside pharmacotherapy as core to bipolar disorder management.
- name: ECT
  description: For severe or treatment-resistant episodes.
discussions:
- discussion_id: gap_bipolar_episodic_switching_trigger
  prompt: >-
    What determines the switch between manic and depressive states in bipolar
    disorder, and in what temporal order do the components of the canonical
    model change around a switch - does calcium dysregulation precede circadian
    disruption, the reverse, or do both follow an upstream trigger not yet in
    the model?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
  - pathophysiology#Intracellular Calcium Dysregulation
  - pathophysiology#Circadian Rhythm Disruption
  rationale: >-
    Episodic cycling is the defining clinical feature of bipolar disorder and
    is the part of the canonical model with the weakest evidential support.
    Every pillar curated in this entry is a vulnerability or trait finding
    rather than a transition mechanism, and this shows up consistently in the
    primary sources rather than only in the abstract. The replicated
    peripheral-cell calcium abnormality showed little correlation with
    mood-rating severity in the series that established it (PMID:10418700), so
    the most reproducible cellular finding in the field is not obviously
    state-coupled. The patient-derived neuron work characterizes
    hyperexcitability as an early endophenotype in young neurons
    (PMID:26524527), not as a state marker. The strongest causal circadian
    manipulation available produces a single mixed state rather than
    alternation between separable poles (PMID:20591414). The phasic
    mitochondrial account that does address state (PMID:28093238) is explicitly
    a proposed explanatory model synthesizing cross-sectional comparisons, not
    a study of transition dynamics: comparing manic to euthymic subjects
    establishes that states differ, which is a different claim from
    establishing what moves a patient between them. This gap is the substantive
    content of the PARTIALLY_SUPPORTED verdict returned by the 2026
    OpenScientist assessment of this hypothesis - the framework organizes
    vulnerability well and does not currently explain episodicity - and it is
    why the entry retains CANONICAL status for the vulnerability model without
    asserting a switching mechanism.
  proposed_experiments:
  - experiment_id: exp_bipolar_peri_switch_longitudinal_multiomics
    name: Densely sampled longitudinal multi-omics through a mood switch
    description: >-
      Follow rapid-cycling bipolar patients through spontaneous mood
      transitions with dense temporal sampling - weekly peripheral blood for
      intracellular calcium, transcriptomics, cytokines and cortisol, continuous
      actigraphy and sleep timing for circadian phase, and periodic imaging -
      so that the order in which calcium, circadian and inflammatory measures
      change relative to clinical switch can be established within individuals.
      Within-subject design is essential: cross-sectional comparison of manic
      and euthymic groups cannot recover temporal ordering.
    experiment_type:
      preferred_term: longitudinal within-subject observational study
    would_support:
    - pathophysiology#Intracellular Calcium Dysregulation
    - pathophysiology#Circadian Rhythm Disruption
    - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
    would_refute:
    - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
    supporting_outcome:
    - >-
      Calcium or circadian measures change reproducibly in a consistent
      direction and in a consistent order in the days preceding clinical
      switch, across multiple patients and multiple switches, which would
      promote the corresponding node from a trait association to a step in the
      switching mechanism.
    - >-
      Circadian phase shift consistently precedes the calcium change, which
      would order the two pillars and identify circadian destabilization as the
      proximal trigger rather than a parallel correlate.
    refuting_outcome:
    - >-
      Calcium and circadian measures remain flat across switches, or change
      only after clinical state has already changed, which would establish them
      as trait vulnerability markers and consequences respectively and force
      the switching trigger to be sought outside the components this model
      names.
    decision_criterion: >-
      The model gains a switching mechanism only if a measured change in a
      curated node reliably precedes clinical switch within individuals. Change
      that follows the switch, or that does not replicate across patients,
      leaves the gap open regardless of effect size.
  evidence:
  - reference: PMID:10418700
    reference_title: "Elevated basal and thapsigargin-stimulated intracellular calcium of platelets and lymphocytes from bipolar affective disorder patients measured by a fluorometric microassay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found little correlation between calcium measures and the severity of mood rating."
    explanation: >-
      The null result that opens this gap. The same study that established the
      elevated-calcium finding found it did not track mood severity, so the
      field's most replicated cellular abnormality is not demonstrably
      state-coupled.
  - reference: PMID:28093238
    reference_title: "A model of the mitochondrial basis of bipolar disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "there is accumulating evidence indicating increased mitochondrial respiration and ATP production in bipolar mania which contrasts with decreased mitochondrial function in patients in the euthymic or depressive phase of the illness"
    explanation: >-
      States the phasic proposal that is currently the field's best answer to
      the switching question, and shows what it rests on: cross-sectional
      contrasts between mood states. Establishing that states differ is not the
      same as establishing what causes transition between them, which is why
      the gap remains open.
- discussion_id: gap_bipolar_calcium_channel_psychiatric_cardiovascular_pleiotropy
  prompt: >-
    Do the calcium-channel susceptibility loci shared between bipolar disorder
    and cardiovascular disease (the established CACNA1C locus plus the
    pleiotropic genes TPCN1, CACNA2D2, CACNA1D, and ATP2B1) reflect a single
    causal calcium-signaling axis acting in both brain and cardiovascular
    tissue, and what is the direction of causation - does psychiatric-risk
    calcium-channel genotype drive cardiac electrophysiological change (e.g.,
    QTc prolongation), or the converse?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CACNA1C
  rationale: >-
    A genome-wide pairwise pleiotropy study in East Asians (Zhu et al., 2026;
    PMID:42436150) found shared genetic architecture across psychiatric and
    cardiovascular disease pairs converging on voltage-dependent calcium-channel
    activity, with novel pleiotropic genes (TPCN1, CACNA2D2, CACNA1D, ATP2B1)
    enriched in the calcium-signaling pathway alongside the established
    bipolar/schizophrenia locus CACNA1C. A calcium-pathway polygenic risk score
    was associated with prolonged QTc, and drug-target analysis implicated
    calcium-channel blockers and peripheral vasodilators in elevated
    schizophrenia risk while diuretics reduced risk across schizophrenia,
    bipolar disorder, and major depressive disorder. The unresolved gaps are
    (1) whether the same calcium-channel variants are the primary driver in
    brain versus a secondary consequence in cardiovascular tissue
    (tissue-specific direction of effect), (2) the causal direction of the
    calcium-genotype to QTc association, and (3) the mechanistic basis for the
    apparent antagonistic pleiotropy in treatment response - why L-type
    calcium-channel modulation may be relevant to mood episodes yet
    calcium-channel blockade associates with increased psychiatric risk at the
    population-genetic level. Resolving this bears directly on the safety of
    calcium-channel blockers in patients with concurrent bipolar disorder and
    cardiovascular disease. This is a cross-disease gap shared with the
    Schizophrenia, Major Depressive Disorder, and Coronary Artery Disease
    entries (dismech issue #6382).
  proposed_experiments:
  - experiment_id: exp_bipolar_calcium_pleiotropy_tissue_mr
    name: Tissue-stratified Mendelian randomization of the calcium axis
    description: >-
      Use brain- and cardiovascular-tissue eQTLs to instrument the pleiotropic
      calcium-channel genes (CACNA1C, CACNA1D, CACNA2D2, ATP2B1, TPCN1) in
      bidirectional Mendelian randomization against bipolar disorder,
      schizophrenia, QTc interval, and coronary artery disease, across
      independent and cross-ancestry cohorts.
    experiment_type:
      preferred_term: Mendelian randomization study
    decision_criterion: >-
      A shared causal calcium-signaling axis would be supported if the same
      tissue-specific calcium-channel instruments showed concordant, directional
      effects on both psychiatric and cardiovascular endpoints; discordant or
      tissue-limited effects would instead argue for parallel, tissue-restricted
      mechanisms.
  evidence:
  - reference: PMID:42436150
    reference_title: "Calcium signaling pathway implicates a shared genetic basis between psychiatric and cardiovascular diseases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Among the novel pleiotropic genes, TPCN1, CACNA2D2, CACNA1D, and ATP2B1 are involved in voltage-dependent calcium channel activity, regulation of calcium influx, enriched in calcium-related pathway."
    explanation: >-
      Genome-wide pairwise pleiotropy analysis identifies shared
      calcium-channel genes across psychiatric and cardiovascular disease,
      motivating the shared-axis question.
  - reference: PMID:42436150
    reference_title: "Calcium signaling pathway implicates a shared genetic basis between psychiatric and cardiovascular diseases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Our findings implicated that calcium-channel blockers and peripheral vasodilators elevated SCZ risk, diuretics reduced the risks of SCZ, BIP, and MDD."
    explanation: >-
      Drug-target analysis underpinning the antagonistic-pleiotropy
      treatment-response gap for calcium-channel modulation.
- discussion_id: gap_bip_ocd_3p21_1_effector_gene_and_h3k27ac
  prompt: >-
    Which gene at the 3p21.1 locus carries the risk signal shared between
    bipolar disorder and obsessive-compulsive disorder, and is prefrontal-cortex
    H3K27ac histone acetylation the regulatory mechanism through which it acts -
    or is the ITIH3/ITIH4 prioritization an artifact of the long-range linkage
    disequilibrium that also spans GLT8D1, SFMBT1, NEK4 and NISCH?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#ITIH3
  rationale: >-
    3p21.1 is genome-wide significant in the largest GWAS of both disorders, and
    a 2026 cross-trait analysis (conjFDR, SMR, multi-omic colocalization)
    prioritizes ITIH3/ITIH4 as the shared pleiotropic signal, with SNPs
    colocalizing with H3K27ac haQTLs in prefrontal cortex. That result is
    preprint-level, statistical, and directly contradicted in its gene
    assignment by the only functional dissection of the region published to
    date: CRISPR-Cas9 editing of rs2535629, which lies inside an ITIH3 intron,
    changed expression of the distal genes GLT8D1, SFMBT1 and NEK4 rather than
    of ITIH3, and the authors attributed schizophrenia risk to SFMBT1. So an
    intronic ITIH3 variant is a bona fide chromatin-regulatory variant at this
    locus while ITIH3 is not its target - which is precisely the confound a
    colocalization-only analysis cannot resolve. Resolving this matters because
    the two candidate effectors imply different biology: ITIH3/ITIH4 are
    hyaluronan-binding extracellular-matrix cross-linkers (the theme already
    represented by the bipolar NCAN locus), whereas SFMBT1 is a polycomb-family
    chromatin regulator of dendritic spine density. The clinical stake is real
    rather than hypothetical: OCD comorbidity in bipolar disorder is associated
    with a measurably worse course, so a shared causal mechanism would be a
    tractable target.
  evidence:
  - reference: PPR:PPR1294131
    reference_title: "Cross-trait genomic analyses implicate the ITIH3 and ITIH4 locus in the shared genetic architecture of bipolar disorder and obsessive-compulsive disorder"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "where multiple SNPs (e.g., rs3774364) colocalized with H3K27ac histone acetylation QTLs in the prefrontal cortex (PP_H4 > 0.5)"
    explanation: >-
      States the preprint's specific mechanistic proposal - prefrontal-cortex
      H3K27ac histone-acetylation QTL colocalization at the prioritized locus -
      which is one side of this gap.
  - reference: PMID:34978167
    reference_title: "Regulatory Variant rs2535629 in ITIH3 Intron Confers Schizophrenia Risk By Regulating CTCF Binding and SFMBT1 Expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, differential expression analysis of GLT8D1, SFMBT1, and NEK4 suggested that rs2535629 may confer schizophrenia risk by regulating SFMBT1 expression."
    explanation: >-
      The one functional dissection of a 3p21.1 psychiatric risk variant assigns
      the effect of an ITIH3-intronic SNP to distal genes, concluding SFMBT1 is
      the mediator. PARTIAL because the disorder studied was schizophrenia, not
      bipolar disorder or OCD; it constrains the gene assignment at this locus
      rather than settling it for these two disorders.
  - reference: PMID:40855518
    reference_title: "Clinical impact of obsessive-compulsive disorder comorbidity in bipolar disorder: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BD-OCD presents a more severe and complex clinical profile, requiring specialized assessment and integrated treatment approaches."
    explanation: >-
      Peer-reviewed meta-analysis of 22 studies establishing that the
      bipolar-OCD comorbidity carries a distinct and more severe clinical
      profile, which is why a shared causal locus is worth resolving.

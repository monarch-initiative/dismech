  description: Metabolic alterations have been observed in the brains of patients with bipolar disorder (BD), a neuropsychiatric disorder characterized by biphasic mood episodes of mania and depression. However, the specific contributions of glial cells to these metabolic changes in BD patients remain largely unknown and have not been extensively studied. Here, we investigate the metabolic characteristics of induced astrocytes (iAstrocytes) derived from induced pluripotent stem cells of BD patients and their responses to lithium treatment. The gene expression profiles of iAstrocytes from BD patients (BD iAstrocytes) indicate dysregulation of metabolic processes in BD iAstrocytes.

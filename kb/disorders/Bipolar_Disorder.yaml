- accession: massive:MSV000086425
  title: Dysregulation of the complement and coagulation cascade in treated schizophrenia and bipolar disorder patients
  description: A better understanding of the proteomic profile after bipolar disorder (BD) and schizophrenia (SCZ) treatment, through monitoring its progression, may assist the development of novel therapeutic strategies with the ability to reduce or control possible side effects. In this study, proteomics analysis employing liquid chromatography coupled to mass spectrometry (LC-MS) and bioinformatic tools were applied to identify differentially expressed proteins in serum of treated BD and SCZ patients. In total, 10 BD patients, 10 SCZ patients, and 14 healthy participants were included.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Bipolar Disorder"). Retrieved 2026-08-02.

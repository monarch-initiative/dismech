      label: circadian rhythm
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: NO_EVIDENCE
    snippet: "For more than 60 years, the mood stabilizer lithium has been used alone or in combination for the treatment of bipolar disorder, schizophrenia, depression, and other mental illnesses."
    explanation: This comprehensive review discusses lithium as the gold standard treatment for bipolar disorder, noting its mood-stabilizing effects through GSK3 inhibition which affects multiple cellular pathways including circadian regulation.
  - reference: PMID:23919927
    reference_title: "Glycogen synthase kinase-3β haploinsufficiency lengthens the circadian locomotor activity period in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "these data suggest that GSK3β acts as a critical intrinsic regulator of the circadian clock and plays an important role in regulating its period in response to lithium treatment"
    explanation: >-
      GSK3β haploinsufficiency lengthens circadian period in mice, mechanistically
      linking lithium's inhibition of GSK3β to its documented effects on circadian
      rhythm period and amplitude in bipolar disorder.
- name: Neuroplasticity Alterations
  description: >
    Reduced BDNF and altered synaptic plasticity in mood circuits.
    Lithium and other mood stabilizers enhance neuroplasticity.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Synaptic Plasticity
    term:
      id: GO:0048167
      label: regulation of synaptic plasticity
  evidence:
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: PARTIAL
    snippet: "DISC1 binds directly to GSK3 and modulates many cellular functions by negatively inhibiting GSK3 activity."
    explanation: GSK3 inhibition by DISC1 and mood stabilizers like lithium is a key mechanism in bipolar disorder treatment, affecting synaptic plasticity and neuronal survival pathways.
  - reference: PMID:30285728
    reference_title: "The TRAX, DISC1, and GSK3 complex in mental disorders and therapeutic interventions."
    supports: PARTIAL
    snippet: "In the present review, we will focus on the emerging roles of TRAX and its interacting proteins (including DISC1 and GSK3β) in psychiatric disorders and the potential implications for developing therapeutic interventions."
    explanation: The TRAX/DISC1/GSK3β complex is implicated in psychiatric disorders including bipolar disorder and represents a therapeutic target for enhancing neuroplasticity.
  - reference: PMID:21743136
    reference_title: "Neuroprotective action of lithium in disorders of the central nervous system."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lithium's main mechanisms of action appear to stem from its ability to inhibit glycogen synthase kinase-3 activity and also to induce signaling mediated by brain-derived neurotrophic factor."
    explanation: >-
      Lithium enhances neuroplasticity in part by inducing BDNF signaling and
      inhibiting GSK-3, directly complementing the reduced-BDNF pathophysiology
      captured in this node.

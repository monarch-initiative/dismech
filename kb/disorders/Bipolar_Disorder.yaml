- name: ITIH3
  gene_term:
    preferred_term: ITIH3
    term:
      id: hgnc:6168
      label: ITIH3
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ITIH3 lies in the extended 3p21.1 psychiatric risk region (GRCh38
    chr3:52.79-52.81 Mb), immediately adjacent to ITIH1 and ITIH4 and within the
    same long-range LD block as GNL3, NEK4, GLT8D1, SFMBT1 and NISCH. Scope
    caveat: the index SNPs reported by the largest bipolar disorder GWAS are inside this
    region but not inside ITIH3 itself (rs2336147 is ~185 kb proximal to the ITIH cluster), so this
    entry records a locus-level susceptibility signal, not a demonstrated ITIH3
    coding or regulatory effect. ITIH3/ITIH4 were specifically prioritized as the
    shared bipolar-disorder/OCD pleiotropic signal by a 2026 cross-trait conjFDR
    plus SMR/colocalization analysis, which remains a non-peer-reviewed preprint;
    the effector gene at 3p21.1 is still contested (see the attached knowledge
    gap). ITIH heavy chains covalently cross-link hyaluronan in the
    extracellular matrix, which would place this locus in the same
    ECM-remodelling theme as the established bipolar NCAN (neurocan) locus.
  evidence:
  - reference: PMID:34002096
    reference_title: "Genome-wide association study of more than 40,000 bipolar disorder cases provides new insights into the underlying biology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "9c 3 52626443 rs2336147 3.6 × 10−13 1.070 0.009 T/C 0.498 ITIH1 (PGC2) SCZ, CDG"
    explanation: >-
      Table 1 row from the PGC bipolar disorder GWAS (41,917 cases): locus 9,
      index SNP rs2336147 at chr3:52,626,443 (GRCh37; 3p21.1), P = 3.6 x 10^-13,
      OR 1.070, named by the authors for ITIH1 and previously reported for
      schizophrenia and by the Cross-Disorder Group. This is the peer-reviewed
      genome-wide-significant bipolar association at the ITIH-cluster locus; the
      index SNP itself sits proximal to the ITIH genes rather than within them.
  - reference: PPR:PPR1294131
    reference_title: "Cross-trait genomic analyses implicate the ITIH3 and ITIH4 locus in the shared genetic architecture of bipolar disorder and obsessive-compulsive disorder"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "ConjFDR analysis revealed 2,143 pleiotropic SNPs jointly associated with BIP and OCD, with convergent signals at the ITIH3/ITIH4 locus."
    explanation: >-
      Cross-trait conjunctional-FDR analysis of bipolar disorder and OCD GWAS
      summary statistics converges on the ITIH3/ITIH4 locus. PARTIAL because
      this is a non-peer-reviewed preprint and a summary-statistics analysis: it
      prioritizes ITIH3/ITIH4 among the genes at 3p21.1 but does not
      experimentally establish either gene as the effector.
- name: AKAP11
  association: Risk Factor
  relationship_type: RISK_FACTOR
  notes: >-
    The one rare-variant risk gene curated for this entry, and the only one
    reaching exome-wide significance in bipolar disorder to date. Ultra-rare
    protein-truncating variants in AKAP11 are enriched in bipolar cases in the
    BipEx collaboration, but the headline gene-level result is reached only
    after meta-analysis with the schizophrenia SCHEMA exome data, so the risk
    is shared with schizophrenia rather than bipolar-specific. AKAP-11 is a
    PKA-anchoring scaffold that binds GSK3B, which is why the gene is read as
    rare-variant convergence on the pathway lithium is thought to act through;
    that inference rests on a protein-protein interaction, not on any
    demonstration that the truncating variants act via GSK3B or that GSK3B
    inhibition is lithium's necessary therapeutic mechanism. The same study
    found that common-variant GWAS loci are not enriched for ultra-rare
    truncating variants, so common and rare risk in bipolar disorder are at
    least partly distinct in their gene sets.
  evidence:
  - reference: PMID:35410376
    reference_title: "Exome sequencing in bipolar disorder identifies AKAP11 as a risk gene shared with schizophrenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combining gene-level results with SCHEMA, AKAP11 emerges as a definitive risk gene"
    explanation: >-
      Whole-exome sequencing of 13,933 bipolar cases and 14,422 controls
      establishes AKAP11 as a bipolar risk gene. The qualification is in the
      sentence itself: the definitive gene-level result requires combining
      BipEx with the schizophrenia SCHEMA analysis, so this is a cross-disorder
      rather than bipolar-specific finding.
  - reference: PMID:35410376
    reference_title: "Exome sequencing in bipolar disorder identifies AKAP11 as a risk gene shared with schizophrenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "At the protein level, AKAP-11 interacts with GSK3B, the hypothesized target of lithium, a primary treatment for BD."
    explanation: >-
      The basis for reading AKAP11 as independent rare-variant convergence on
      the GSK-3 beta pillar of this model. Graded INDIRECT because the link is
      a protein-protein interaction reported by the same paper, not a
      demonstration that AKAP11 truncating variants change GSK3B activity in
      patients.
  - reference: PMID:35410376
    reference_title: "Exome sequencing in bipolar disorder identifies AKAP11 as a risk gene shared with schizophrenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes implicated from genome-wide association studies (GWASs) of BD, however, are not significantly enriched for ultra-rare PTVs."
    explanation: >-
      Records that the common-variant loci curated above (CACNA1C, ANK3, ODZ4,
      NCAN, the 3p21.1 region) are not the genes carrying the rare truncating
      burden, so the polygenic common-variant architecture and the rare-variant
      architecture are at least partly separate rather than two readouts of one
      gene set.

discussions:
- discussion_id: gap_bipolar_calcium_channel_psychiatric_cardiovascular_pleiotropy
  prompt: >-
    Do the calcium-channel susceptibility loci shared between bipolar disorder
    and cardiovascular disease (the established CACNA1C locus plus the
    pleiotropic genes TPCN1, CACNA2D2, CACNA1D, and ATP2B1) reflect a single
    causal calcium-signaling axis acting in both brain and cardiovascular
    tissue, and what is the direction of causation - does psychiatric-risk
    calcium-channel genotype drive cardiac electrophysiological change (e.g.,
    QTc prolongation), or the converse?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#CACNA1C
  rationale: >-
    A genome-wide pairwise pleiotropy study in East Asians (Zhu et al., 2026;
    PMID:42436150) found shared genetic architecture across psychiatric and
    cardiovascular disease pairs converging on voltage-dependent calcium-channel
    activity, with novel pleiotropic genes (TPCN1, CACNA2D2, CACNA1D, ATP2B1)
    enriched in the calcium-signaling pathway alongside the established
    bipolar/schizophrenia locus CACNA1C. A calcium-pathway polygenic risk score
    was associated with prolonged QTc, and drug-target analysis implicated
    calcium-channel blockers and peripheral vasodilators in elevated
    schizophrenia risk while diuretics reduced risk across schizophrenia,
    bipolar disorder, and major depressive disorder. The unresolved gaps are
    (1) whether the same calcium-channel variants are the primary driver in
    brain versus a secondary consequence in cardiovascular tissue
    (tissue-specific direction of effect), (2) the causal direction of the
    calcium-genotype to QTc association, and (3) the mechanistic basis for the
    apparent antagonistic pleiotropy in treatment response - why L-type
    calcium-channel modulation may be relevant to mood episodes yet
    calcium-channel blockade associates with increased psychiatric risk at the
    population-genetic level. Resolving this bears directly on the safety of
    calcium-channel blockers in patients with concurrent bipolar disorder and
    cardiovascular disease. This is a cross-disease gap shared with the
    Schizophrenia, Major Depressive Disorder, and Coronary Artery Disease
    entries (dismech issue #6382).
  proposed_experiments:
  - experiment_id: exp_bipolar_calcium_pleiotropy_tissue_mr
    name: Tissue-stratified Mendelian randomization of the calcium axis
    description: >-
      Use brain- and cardiovascular-tissue eQTLs to instrument the pleiotropic
      calcium-channel genes (CACNA1C, CACNA1D, CACNA2D2, ATP2B1, TPCN1) in
      bidirectional Mendelian randomization against bipolar disorder,
      schizophrenia, QTc interval, and coronary artery disease, across
      independent and cross-ancestry cohorts.
    experiment_type:
      preferred_term: Mendelian randomization study
    decision_criterion: >-
      A shared causal calcium-signaling axis would be supported if the same
      tissue-specific calcium-channel instruments showed concordant, directional
      effects on both psychiatric and cardiovascular endpoints; discordant or
      tissue-limited effects would instead argue for parallel, tissue-restricted
      mechanisms.
  evidence:
  - reference: PMID:42436150
    reference_title: "Calcium signaling pathway implicates a shared genetic basis between psychiatric and cardiovascular diseases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Among the novel pleiotropic genes, TPCN1, CACNA2D2, CACNA1D, and ATP2B1 are involved in voltage-dependent calcium channel activity, regulation of calcium influx, enriched in calcium-related pathway."
    explanation: >-
      Genome-wide pairwise pleiotropy analysis identifies shared
      calcium-channel genes across psychiatric and cardiovascular disease,
      motivating the shared-axis question.
  - reference: PMID:42436150
    reference_title: "Calcium signaling pathway implicates a shared genetic basis between psychiatric and cardiovascular diseases."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Our findings implicated that calcium-channel blockers and peripheral vasodilators elevated SCZ risk, diuretics reduced the risks of SCZ, BIP, and MDD."
    explanation: >-
      Drug-target analysis underpinning the antagonistic-pleiotropy
      treatment-response gap for calcium-channel modulation.

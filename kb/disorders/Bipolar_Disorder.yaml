genetic:
- name: CACNA1C
  association: Risk Factor
  notes: Calcium channel
  evidence:
  - reference: PMID:18711365
    reference_title: "Collaborative genome-wide association analysis supports a role for ANK3 and CACNA1C in bipolar disorder."
    supports: SUPPORT
    snippet: "We also found further support for the previously reported CACNA1C (alpha 1C subunit of the L-type voltage-gated calcium channel; combined P = 7.0 x 10(-8), rs1006737)."
    explanation: Landmark GWAS study providing genome-wide significant evidence that CACNA1C is a susceptibility locus for bipolar disorder, implicating calcium channel dysfunction in disease pathogenesis.
  - reference: PMID:21057379
    reference_title: "Case-case genome-wide association analysis shows markers differentially associated with schizophrenia and bipolar disorder and implicates calcium channel genes."
    supports: SUPPORT
    snippet: "The finding for CACNG5, taken together with the earlier implication of CACNA1C and CACNA1B, strongly suggests a key role for voltage-dependent calcium channel genes in the susceptibility to bipolar disorder and/or schizophrenia."
    explanation: Case-case GWAS analysis further confirms the critical role of calcium channel genes including CACNA1C in bipolar disorder susceptibility.
- name: ANK3
  association: Risk Factor
  notes: Ankyrin-3
  evidence:
  - reference: PMID:18711365
    reference_title: "Collaborative genome-wide association analysis supports a role for ANK3 and CACNA1C in bipolar disorder."
    supports: SUPPORT
    snippet: "To identify susceptibility loci for bipolar disorder, we tested 1.8 million variants in 4,387 cases and 6,209 controls and identified a region of strong association (rs10994336, P = 9.1 x 10(-9)) in ANK3 (ankyrin G)."
    explanation: Genome-wide significant association of ANK3 with bipolar disorder in large-scale GWAS, establishing ankyrin G as a key susceptibility gene that may affect neuronal excitability and synaptic function.
- name: ODZ4
  association: Risk Factor
  evidence:
  - reference: PMID:21926972
    reference_title: "Large-scale genome-wide association analysis of bipolar disorder identifies a new susceptibility locus near ODZ4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, we support prior findings in CACNA1C, and now identify ODZ4 as associated with BD."
    explanation: Psychiatric GWAS Consortium large-scale GWAS established genome-wide-significant association of the teneurin gene ODZ4 (TENM4) with bipolar disorder.
- name: NCAN
  association: Risk Factor
  evidence:
  - reference: PMID:21353194
    reference_title: "Genome-wide association study identifies genetic variation in neurocan as a susceptibility factor for bipolar disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic variation in the neurocan gene (NCAN) showed genome-wide significant association with BD"
    explanation: GWAS with independent replication identified the extracellular-matrix glycoprotein gene NCAN (neurocan) as a genome-wide-significant bipolar disorder susceptibility locus.

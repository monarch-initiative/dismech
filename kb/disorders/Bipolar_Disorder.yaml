treatments:
- name: Lithium
  description: First-line mood stabilizer, effective for mania and suicide prevention.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lithium carbonate
      term:
        id: CHEBI:6504
        label: lithium carbonate
  target_mechanisms:
  - target: GSK-3β Signaling Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Lithium inhibits GSK-3β both directly (Mg2+-competitive) and indirectly
      (via Akt / β-arrestin-2 / PP2A), stabilizing β-catenin and mimicking
      canonical Wnt signaling — the principal proposed molecular basis of its
      mood-stabilizing effect.
    evidence:
    - reference: PMID:8710892
      reference_title: "A molecular mechanism for the effect of lithium on development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results suggest that lithium acts through inhibition of glycogen synthase kinase-3 beta (GSK-3 beta), which regulates cell fate determination in diverse organisms including Dictyostelium, Drosophila, and Xenopus."
      explanation: Direct evidence that lithium acts by inhibiting GSK-3β.
  - target: Phosphoinositide Signaling Dysregulation
    treatment_effect: INHIBITS
    description: >-
      Lithium uncompetitively inhibits inositol monophosphatase and related
      phosphatases, depleting free inositol and dampening PIP2 / IP3 signaling.
    evidence:
    - reference: PMID:12015604
      reference_title: "A common mechanism of action for three mood-stabilizing drugs."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Inositol, however, reverses the effects of the drugs on growth cones, thus implicating inositol depletion in their action."
      explanation: Inositol rescue implicates inositol depletion as a mechanism of lithium action.
  - target: Circadian Rhythm Disruption
    treatment_effect: MODULATES
    description: >-
      Through GSK-3β inhibition lithium lengthens circadian period and stabilizes
      clock-gene rhythm amplitude, addressing circadian instability in bipolar disorder.
  - target: Neuroplasticity Alterations
    treatment_effect: MODULATES
    description: >-
      Lithium induces BDNF signaling and upregulates neurotrophic/neuroprotective
      pathways, enhancing synaptic plasticity in fronto-limbic mood circuits.
  evidence:
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "Lithium has been reported to reduce suicide rates and prevent manic episodes in individuals with bipolar disorder, major depression, or schizoaffective disorders"
    explanation: Lithium is the gold standard mood stabilizer for bipolar disorder with demonstrated efficacy in preventing manic episodes and reducing suicide risk through GSK3 inhibition.
  - reference: PMID:22363263
    reference_title: "Inhibition of GSK3 by lithium, from single molecules to signaling networks."
    supports: SUPPORT
    snippet: "In 1996, two independent studies (Klein and Melton, 1996; Stambolic et al., 1996) of the effects of lithium on cell signaling and development have identified a direct effect of lithium on the activity of GSK3 both in vitro and in cells."
    explanation: Lithium's therapeutic mechanism involves direct inhibition of GSK3 and indirect effects through the Akt/beta-arrestin pathway, providing molecular basis for its mood-stabilizing effects.
  - reference: PMID:21743136
    reference_title: "Neuroprotective action of lithium in disorders of the central nervous system."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "By inhibiting N-methyl-D-aspartate receptor-mediated calcium influx, for instance, it suppresses the calcium-dependent activation of pro-apoptotic signaling pathways."
    explanation: >-
      Beyond GSK-3β and inositol depletion, lithium contributes to neuronal
      calcium homeostasis by limiting NMDA-receptor calcium influx and downstream
      pro-apoptotic signaling.

genetic:
- name: CACNA1C
  gene_term:
    preferred_term: CACNA1C
    term:
      id: hgnc:1390
      label: CACNA1C
  association: Risk Factor
  notes: Calcium channel
  evidence:
  - reference: PMID:18711365
    reference_title: "Collaborative genome-wide association analysis supports a role for ANK3 and CACNA1C in bipolar disorder."
    supports: SUPPORT
    snippet: "We also found further support for the previously reported CACNA1C (alpha 1C subunit of the L-type voltage-gated calcium channel; combined P = 7.0 x 10(-8), rs1006737)."
    explanation: Landmark GWAS study providing genome-wide significant evidence that CACNA1C is a susceptibility locus for bipolar disorder, implicating calcium channel dysfunction in disease pathogenesis.
  - reference: PMID:21057379
    reference_title: "Case-case genome-wide association analysis shows markers differentially associated with schizophrenia and bipolar disorder and implicates calcium channel genes."
    supports: SUPPORT
    snippet: "The finding for CACNG5, taken together with the earlier implication of CACNA1C and CACNA1B, strongly suggests a key role for voltage-dependent calcium channel genes in the susceptibility to bipolar disorder and/or schizophrenia."
    explanation: Case-case GWAS analysis further confirms the critical role of calcium channel genes including CACNA1C in bipolar disorder susceptibility.
  - reference: PMID:25403839
    reference_title: "Functional implications of a psychiatric risk variant within CACNA1C in induced human neurons."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    snippet: "we performed electrophysiology and quantitative PCR experiments that demonstrated increased L-type VGCC current density as well as increased mRNA expression of CACNA1C in iNs homozygous for the risk genotype, compared with non-risk genotypes"
    explanation: >-
      Bridges the variant-to-function gap for the entry's flagship risk gene:
      induced human neurons from over 20 fibroblast lines show that the
      rs1006737 risk genotype raises CACNA1C transcript level and L-type
      calcium current density, fixing the direction of effect as gain of
      channel function. Scope caveat recorded by the authors themselves --
      the rs1006737 haplotype is transdiagnostic and the donors included
      unaffected individuals, so this establishes a genotype-to-channel
      phenotype rather than a bipolar-specific circuit mechanism.
  - reference: PMID:39370418
    reference_title: "Cacna1c deficiency in forebrain glutamatergic neurons alters behavior and hippocampal plasticity in female mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In the hippocampus, Cav1.2 inactivation enhanced presynaptic paired-pulse facilitation without altering postsynaptic LTP at CA3-CA1 synapses. In addition, CA1 pyramidal neurons of female CKO mice displayed a reduction in dendritic complexity and spine density."
    explanation: >-
      Cell-type-restricted Cav1.2 loss in forebrain glutamatergic neurons
      produces behavioral, synaptic, and dendritic changes, establishing that
      the channel is functionally required in exactly the neuron class this
      model implicates. Graded INDIRECT because the direction is opposite to
      the human risk allele: this is a loss-of-function knockout, whereas
      PMID:25403839 associates the risk genotype with increased CACNA1C
      expression and current. The phenotypes are also not bipolar-specific,
      so the study is gene-function evidence rather than directionally
      convergent validation of the human risk edge.
- name: ANK3

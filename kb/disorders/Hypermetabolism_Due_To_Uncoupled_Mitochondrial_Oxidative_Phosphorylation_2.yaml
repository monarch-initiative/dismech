mechanistic_hypotheses:
- hypothesis_group_id: coupling_versus_catalysis_allelic_split
  hypothesis_label: >-
    ATP5F1B variants split into a coupling-defect arm causing hypermetabolism
    and a catalytic-defect arm causing dystonia
  status: EMERGING
  description: >-
    Heterozygous ATP5F1B missense variants produce two clinically disjoint
    phenotypes, and both missense arms are reported as dominant-negative, so the
    dominance mode does not separate them. The hypothesis is that what differs is
    which function of the beta subunit the mutant protein spoils. In the
    hypermetabolic arm, p.Leu335Pro leaves proton translocation and complex V
    assembly intact but loosens the coupling between stalk rotation and ATP
    synthesis, so energy leaves as heat and respiration rises. In the
    movement-disorder arm, p.Thr334Pro and p.Val482Ala leave beta subunit
    abundance intact but reduce complex V activity, with insufficient ATP as the
    proposed consequence. The dominance premise is scoped to the missense alleles
    deliberately: the ATP5F1B splice allele c.1074+1G>T lowers transcript level,
    and its authors model ATP5F1A/ATP5F1B dominant disease as insufficient
    protein production for loss-of-function alleles alongside dominant negativity
    for missense alleles, so it is a reduction-of-output allele rather than a
    third dominant-negative one.

    The discriminating measurement is respiratory flux, and it already favours
    the split: the dystonia patients' fibroblasts showed no alteration in oxygen
    consumption despite defective complex V and a low membrane potential, where
    the hypermetabolic arm's cells consume more oxygen. Both arms report a low
    membrane potential, so membrane potential alone does not discriminate.

    Three things keep this at EMERGING rather than settled. First, a cited source
    contests the split's premise: the dystonia report proposes the same
    beta-to-gamma contact lesion for p.Thr334Pro and p.Leu335Pro, and raises
    less-efficient coupling between proton flow and rotary catalysis as a
    possible mechanism for its own variants too, explicitly noting that this is
    the mechanism already suggested for p.Leu335Pro. Second, the two arms'
    functional data are not uniform within themselves: complex V activity was
    severely reduced for p.Thr334Pro but normal in one p.Val482Ala carrier and
    only mildly reduced in the other, where the defect appeared instead as
    reduced substrate affinity. Third, the clinical architecture differs on a
    second and better-evidenced axis than mechanism: this entry's allele is de
    novo, fully penetrant in both carriers and ACMG pathogenic, while the
    dystonia alleles are transmitted with incomplete penetrance, were classified
    as variants of uncertain significance, and the splice allele's own report
    says the gene-disease relationship awaits further confirmation. What no study
    has done is measure respiration and complex V activity across variants from
    both arms in one isogenic background.
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      these results suggest the increased oxygen consumption rate is caused by
      dissipation of the proton motive force, without a corresponding increase
      in ATP synthesis
    explanation: >-
      Establishes the coupling-defect arm: raised respiration attributable to
      dissipated proton motive force rather than to ATP demand.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies in mutant fibroblasts revealed no decrease of ATP5F1B
      protein amount but severe reduction of complex V activity and impaired
      mitochondrial membrane potential, suggesting a dominant-negative effect.
    explanation: >-
      Establishes the catalytic-defect arm, and shows it is also
      dominant-negative with normal subunit abundance, which is why the
      hypothesis turns on which function is lost rather than on the dominance
      mode.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Despite the presence of defective complex V and impaired mitochondrial
      membrane potential, the patients with dystonia did not present alterations
      in oxygen consumption
    explanation: >-
      This is the strongest single piece of evidence for the split. Respiratory
      flux is the measurement that separates the two arms, and it was normal in
      the dystonia patients' cells while being elevated in the hypermetabolic
      arm's, measured in the same tissue type.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      The same mechanism has also been suggested for the other recently published
      ATP5F1B dominant variant
    explanation: >-
      Argues against the split rather than for it. Having raised less-efficient
      coupling between proton flow and rotary catalysis as a candidate mechanism
      for its own dystonia variants, the report notes this is the mechanism
      already proposed for p.Leu335Pro, so a cited source entertains one shared
      coupling mechanism across both arms.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: REFUTE
    evidence_source: COMPUTATIONAL
    snippet: >-
      adjacent to the residue mutated in Family A
    explanation: >-
      The adjacency of p.Thr334Pro and p.Leu335Pro is stated by this source, not
      an observation original to this entry, and the same report models both
      residues as impairing the same intersubunit contact. A structural account
      that groups the two residues together is evidence against their having
      distinct mechanisms.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      two different ATP5F1B missense variants (c.1000A>C; p.Thr334Pro and
      c.1445T>C; p.Val482Ala) segregating with early-onset isolated dystonia in
      two families, both with autosomal dominant mode of inheritance and
      incomplete penetrance
    explanation: >-
      Supplies the dystonia-arm variant coordinates and the incomplete
      penetrance that distinguishes that arm's clinical architecture from this
      entry's fully penetrant de novo allele.
  - reference: PMID:36860166
    reference_title: Variants in ATP5F1B are associated with dominantly inherited dystonia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional data showed some differences between p.Thr334Pro and
      p.Val482Ala, in particular the severity of complex V deficiency
    explanation: >-
      Records that the catalytic arm is not internally uniform, which is why the
      description attributes severe complex V reduction to p.Thr334Pro rather
      than to both missense alleles.
  - reference: PMID:40276935
    reference_title: "Expanding the Allelic and Clinical Heterogeneity of Movement Disorders Linked to Defects
      of Mitochondrial Adenosine Triphosphate Synthase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A third heterozygous variant, c.1074+1G>T, affected a canonical donor
      splice site of ATP5F1B and resulted in exon skipping with significantly
      diminished ATP5F1B mRNA levels, as well as impaired ATPase activity. The
      associated phenotype consisted of cerebral palsy (CP) with prominent
      generalized dystonia.
    explanation: >-
      A reduction-of-output allele, by a different molecular route from the
      missense variants, also produces a movement disorder, which supports
      grouping loss of ATP synthase output with the dystonia arm.
discussions:
- discussion_id: atp5f1b_coupling_versus_catalysis_head_to_head
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do proline substitutions at adjacent ATP5F1B residues, p.Thr334Pro and
    p.Leu335Pro, produce opposite phenotypes, and does the
    coupling-versus-catalysis distinction survive a head-to-head assay in one
    isogenic background?
  rationale: >-
    The adjacency of the two residues is reported, and so is a structural model
    placing both near the gamma subunit and impairing the same intersubunit
    contact; what that model does not account for is the opposite clinical
    consequence. The same report raises a shared coupling mechanism as a
    possibility for its own dystonia variants, which would collapse the split
    altogether, while its respirometry showed normal oxygen consumption in those
    patients' cells, which is what the split predicts. The two readings coexist
    in one paper and are not reconciled in it.

    The measurements themselves do not settle it either, because each arm was
    characterised with the panel suited to its own hypothesis: the
    hypermetabolism report measured oxygen consumption and membrane potential in
    patient fibroblasts, isogenic knock-in clones and heterologous expression,
    while the dystonia report measured complex V activity with Vmax and Km
    alongside respirometry. No study has put variants from both arms into one
    isogenic background and measured respiratory flux and complex V activity
    under a single protocol, which is what would separate a coupling defect from
    a catalytic one.

    A third reading would dispense with the mechanism axis altogether: that the
    basal ganglia are selectively vulnerable to any loss of complex V output,
    however caused, so the dystonia arm needs no catalysis-specific explanation.
    Movement disorder recurs with reduced complex V output across ATP5F1A,
    ATP5F1B and ATP5MC3, while the hypermetabolic presentation remains confined
    to one ATP5F1B allele, which that reading would explain as the only allele
    that raises flux rather than lowering it. This is a lead from a provider
    report rather than a curated claim; the cross-subunit papers it rests on are
    not cited in this entry.
  attaches_to:
  - mechanistic_hypotheses#coupling_versus_catalysis_allelic_split
  - pathophysiology#Chemiosmotic Uncoupling Within Complex V
  proposed_experiments:
  - experiment_id: atp5f1b_variant_panel_respirometry
    name: Side-by-side respirometry and complex V activity across an ATP5F1B variant panel
    description: >-
      Introduce p.Leu335Pro, p.Thr334Pro and p.Val482Ala into one isogenic
      background and measure, under a single protocol, basal and
      oligomycin-sensitive oxygen consumption, inner membrane potential, and
      complex V hydrolytic and synthetic activity.
    would_support:
    - mechanistic_hypotheses#coupling_versus_catalysis_allelic_split
    - pathophysiology#Chemiosmotic Uncoupling Within Complex V
    supporting_outcome:
    - >-
      p.Leu335Pro shows elevated basal oxygen consumption with preserved complex
      V activity, while p.Thr334Pro and p.Val482Ala show reduced complex V
      activity without elevated respiration.
    refuting_outcome:
    - >-
      All three variants show the same direction of change in both respiration
      and complex V activity, which would indicate the clinical difference is
      not explained by a coupling-versus-catalysis distinction.
  notes: >-
    Resolving this bears on whether the ATP5F1B movement-disorder phenotype is a
    separate entity or a second presentation of one coupling defect, which is the
    open lump/split question recorded in review_notes.
review_notes: >-
  Curated from the three primary ATP5F1B reports. The hypermetabolism arm rests
  on one monozygotic twin pair, so phenotype frequencies are deliberately absent
  throughout: two concordant twins sharing one de novo allele cannot support a
  frequency estimate, and FrequencyEnum values would imply a denominator that
  does not exist. Several features documented in the report are not curated as
  separate phenotypes because they are single observations in one twin or are
  confounded, and are instead recorded in the relevant node, phenotype
  description or notes: the intraoperative temperature of 40 degrees in Subject
  1, the uremia noted in the laboratory summary, and the chordee for which
  Subject 1 underwent repair. Increased blood urea nitrogen and HP:0000041
  Chordee were each considered as phenotypes and left out for that reason.

  The parent stays MONDO:0003847 hereditary disease, which is what MONDO
  asserts. That is a poor fit for a de novo allele on its face, and
  MONDO:0044970 mitochondrial disease would describe the entity better, but
  MONDO:0044970 is not in this term's ancestor closure, so asserting it here
  would contradict the ontology rather than read from it. Worth raising upstream
  with MONDO instead. The OMIM identifier in the description was read from
  MONDO's own database cross-references; the schema's mappings block has MONDO,
  NCIT and ICD slots but no OMIM slot, so it is carried in prose as elsewhere in
  the corpus.

  Known gaps, recorded so they are not mistaken for oversights. There is no
  diagnosis block, although the primary report describes the diagnostic route
  (fibroblast respirometry with simultaneous membrane-potential measurement,
  then exome sequencing) and the top-level notes make a diagnostic argument from
  it. And the three cell systems every IN_VITRO evidence item rests on, namely
  patient primary fibroblasts, two isogenic CRISPR knock-in A375 clones and HeLa
  heterologous expression, are not recorded as experimental_models with
  modeled_mechanisms, so the entry has no model-to-pathograph join. Both are
  worth adding; the model entries would also be the right home for the caveats
  that the knock-in background is a melanoma line and the HeLa arm is
  overexpression.

  No GeneReviews chapter exists for this entity. The Primary Mitochondrial
  Disorders Overview chapter is not disease-specific and was not tagged as a
  baseline for it.

  The dystonia-associated ATP5F1B variants are deliberately not curated as
  subtypes of this entry. They are a clinically disjoint phenotype that the
  literature treats as a separate entity, so they appear only in the
  mechanistic_hypotheses entry that contrasts the two arms, and in the
  knowledge-gap discussion attached to it. Whether they warrant a separate
  dismech Disease entry is an open lump/split question.
notes: >-
  The biochemical direction here is the inverse of most mitochondrial disease:
  respiration is elevated rather than depressed. A diagnostic workup that
  screens only for reduced respiratory chain activity will therefore not detect
  this condition.

  The authors place this entity alongside Luft syndrome in a proposed category
  of mitochondrial uncoupling syndromes, but state that Luft syndrome's
  uncoupling appears to originate outside complex V. The two are grouped by
  shared physiology, not by a shared molecular lesion.

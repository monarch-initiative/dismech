name: Hypermetabolism Due To Uncoupled Mitochondrial Oxidative Phosphorylation 2
category: Mendelian
creation_date: "2026-10-20T00:00:00Z"
synonyms:
- HUMOP2
- ATP5F1B-related mitochondrial uncoupling syndrome
- Congenital hypermetabolism and uncoupled oxidative phosphorylation
- Mitochondrial uncoupling syndrome with hypermetabolism
description: >-
  Hypermetabolism due to uncoupled mitochondrial oxidative phosphorylation 2
  (HUMOP2; OMIM 620085) is an autosomal dominant mitochondrial uncoupling
  syndrome caused by a heterozygous de novo ATP5F1B variant. ATP5F1B encodes the
  beta subunit of the catalytic F1 domain of mitochondrial ATP synthase (complex
  V). The single reported kindred is a monozygotic twin pair carrying
  p.Leu335Pro, a residue lying close to the hydrophobic sleeve of the
  alpha3beta3 assembly that grips the tip of the rotating gamma stalk. Proton
  translocation through the FO pore proceeds, but its mechanical energy is no
  longer efficiently converted into ATP synthesis, so the proton motive force is
  dissipated as heat. The biochemical signature is therefore the inverse of most
  mitochondrial disease: elevated rather than depressed respiration, with a
  reduced inner membrane potential. Clinically this presents as euthyroid
  hypermetabolism from infancy with failure to thrive despite hyperphagia,
  persistent tachypnea, recurrent unexplained hyperthermia, diaphoresis and mild
  global developmental delay. The authors place the condition alongside Luft
  syndrome in a proposed category of mitochondrial uncoupling syndromes, while
  noting that Luft syndrome appears to arise outside complex V. No
  disease-modifying therapy is documented; the reported twins remained
  symptomatic on excess calories, creatine and folinic acid.

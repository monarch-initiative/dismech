diagnosis:
- name: Fibroblast respirometry with simultaneous membrane potential
  description: >-
    The biochemical signature is elevated oxygen consumption together with a
    reduced inner membrane potential, measured in cultured skin fibroblasts.
    Oligomycin sensitivity is what localises the leak to complex V: silencing the
    enzyme abolishes both the excess respiration and the depolarization. This is
    the test a conventional respiratory-chain screen does not perform, since it
    looks for reduced rather than elevated respiration.
  measurements:
  - preferred_term: oxygen consumption rate and mitochondrial membrane potential
      in permeabilized fibroblasts
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An evaluation of their fibroblasts showed elevated oxygen consumption and
      decreased mitochondrial membrane potential.
    explanation: >-
      This is the diagnostic observation that preceded and motivated the genetic
      testing, and it is the pairing that identifies an uncoupling defect.
  notes: >-
    No NCIT clinical-action term is bound: NCIT has no term for respirometry or
    for a mitochondrial membrane potential measurement, and the oxygen
    consumption terms it does carry are exercise-physiology measures. The
    measurement is therefore carried as free text.
- name: Exome sequencing
  description: >-

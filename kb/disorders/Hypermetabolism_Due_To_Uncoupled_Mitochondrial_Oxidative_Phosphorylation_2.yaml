    notes: >-
      ATP5F1B is a nuclear-encoded structural subunit of the complex V catalytic
      F1 domain, so this is a nuclear-encoded oxidative phosphorylation disorder.
      Note the defect is a coupling defect rather than the complex V deficiency
      this category usually denotes.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    One kindred has been reported: a monozygotic twin pair, so two patients but a
    single independent allele. No population prevalence, incidence or carrier
    frequency estimate exists. The p.Leu335Pro allele is absent from gnomAD.
  evidence:
  - reference: PMID:36239646

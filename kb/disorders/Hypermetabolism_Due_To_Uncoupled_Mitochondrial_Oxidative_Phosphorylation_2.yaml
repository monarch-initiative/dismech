    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe the case of identical twin boys who presented with low body
      weight despite excessive caloric intake.
    explanation: >-
      The report describes a single monozygotic twin pair. Exhaustiveness is
      not established by this quote; it rests on no further kindred having been
      reported since.
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ATP5F1B is highly constrained and the Leu335Pro variant has not been
      observed in any of ~200,000 individuals
    explanation: >-
      Absence from a population database of roughly 200,000 individuals supports
      ultra-rare status for the causal allele.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The causal ATP5F1B variant is heterozygous and arose de novo in the affected
    twins, whose parents and older brother are healthy. Heterologous expression
    of the mutant allele on a wild-type background reproduces the biochemical
    phenotype, so the dominance is dominant-negative rather than
    haploinsufficient.
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support an autosomal dominant mitochondrial uncoupling syndrome
      with hypermetabolism.
    explanation: >-
      The authors state the inheritance mode they infer from the de novo
      heterozygous variant and its dominant biochemical effect.
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The data support that heterologous expression of the Leu335Pro variant is
      sufficient to decrease basal mitochondrial membrane potential and increase
      respiration, consistent with a dominant-negative effect of the mutation on
      coupling.
    explanation: >-
      Expressing the mutant allele alongside wild-type protein reproduces the
      defect, which distinguishes a dominant-negative mechanism from
      haploinsufficiency.
genetic:
- name: ATP5F1B
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  gene_term:
    preferred_term: ATP5F1B
    term:
      id: hgnc:830
      label: ATP5F1B
  variants:
  - name: p.Leu335Pro
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    description: >-
      NM_001686.3:c.1004T>C, p.(Leu335Pro). De novo and heterozygous in both
      twins. Leu335 sits near the hydrophobic sleeve of the alpha3beta3 hexamer
      that holds the gamma stalk tip, and is close to several yeast mgi residues
      whose mutation uncouples respiration from ATP synthesis. The authors
      propose it is the human equivalent of a yeast group 1 mgi mutation,
      impairing engagement of the gamma subunit by the hexamer. The functional
      consequence is dominant-negative on coupling rather than a loss of
      catalytic activity.
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        revealed an apparently de novo heterozygous variant NM_001686.3:c.1004
        T>C in ATP5F1B, predicting a p.(Leu335Pro) change in the β subunit of CV
      explanation: >-
        Exome sequencing established the variant, its de novo status and its
        heterozygous state in the probands.
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Leu335 lies close to the hydrophobic sleeve in the α3β3 assembly that
        holds the tip of the γ subunit of the central stalk
      explanation: >-
        Structural modelling against the ovine complex V cryo-EM structure places
        the residue at the surface that engages the rotating central stalk, which
        is the basis for the proposed coupling defect.
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        Mutations in this region in the α, β, or γ subunits in yeast are called
        mgi variants (Fig. 2E, S1) and result in uncoupling between ATP synthesis
        and mitochondrial respiration
      explanation: >-
        The yeast mgi phenotype is what makes the structural position
        mechanistically meaningful. Graded MODEL_ORGANISM for the yeast work the
        sentence describes, with quote_role BACKGROUND because this human
        genetics paper is restating an established yeast result rather than
        reporting its own.
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome analysis revealed a de novo heterozygous variant in ATP5F1B, which
      encodes the beta subunit of mitochondrial ATP synthase
    explanation: >-
      Identifies ATP5F1B as the causal gene for the hypermetabolic phenotype.
  notes: >-
    ClinGen has not classified the ATP5F1B-HUMOP2 gene-disease pair, so no
    gene_disease_validity assertion is recorded. A single de novo allele in one
    twin pair, with concordant functional work in patient fibroblasts, isogenic
    CRISPR knock-in clones and heterologous expression, is the whole of the
    evidence base. ATP5F1B encodes the beta subunit of the catalytic F1 domain
    of ATP synthase; three beta subunits alternate with three alpha subunits
    around the central gamma stalk, and conformational transitions in beta
    driven by stalk rotation are what synthesise ATP from ADP.
pathophysiology:
- name: ATP5F1B Beta Subunit Gamma-Stalk Interface Disruption
  description: >-
    The p.Leu335Pro substitution lies close to the hydrophobic sleeve of the
    alpha3beta3 hexamer that grips the tip of the rotating gamma subunit.
    Proline substitution at this conserved position is proposed to loosen the
    contact between the beta subunit and the gamma stalk. The mutant protein is
    expressed at somewhat lower levels than wild type but still assembles into
    macromolecular complex V, so the lesion is a functional one at an
    intersubunit interface rather than a failure of assembly.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: ATP5F1B
    term:
      id: hgnc:830
      label: ATP5F1B
  molecular_functions:
  - preferred_term: proton-transporting ATP synthase activity, rotational mechanism
    modifier: DECREASED
    term:
      id: GO:0046933
      label: proton-transporting ATP synthase activity, rotational mechanism
  downstream:
  - target: Chemiosmotic Uncoupling Within Complex V
    causal_link_type: DIRECT
    hypothesis_groups:
    - coupling_versus_catalysis_allelic_split
    description: >-
      Loosened engagement of the gamma stalk by the alpha-beta hexamer permits
      rotation without the conformational cycle that condenses ADP and
      phosphate.
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        It thereby disrupts ATP synthesis, even with normal translocation of
        protons through FO.
      explanation: >-
        States the proposed causal step from the interface lesion to loss of
        coupling, and specifies that proton translocation itself is preserved.
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      it assembled into macromolecular CV
    explanation: >-
      Shows the mutant subunit is incorporated into assembled complex V, so the
      defect is functional rather than an assembly failure.
- name: Chemiosmotic Uncoupling Within Complex V
  description: >-
    Protons continue to pass through the FO pore and drive stalk rotation, but
    the mechanical energy is no longer efficiently captured as ATP. The proton
    motive force is therefore dissipated without a matching rise in ATP
    synthesis, and the lost energy appears as heat. Pharmacological silencing of
    complex V with oligomycin abolishes the excess leak, and maximal stimulation
    with saturating ADP also removes the difference from control, which
    localises the defect to complex V itself rather than to a leaky inner
    membrane.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proton motive force-driven mitochondrial ATP synthesis
    modifier: DECREASED
    term:
      id: GO:0042776
      label: proton motive force-driven mitochondrial ATP synthesis
  - preferred_term: proton transmembrane transport
    modifier: INCREASED
    term:
      id: GO:1902600
      label: proton transmembrane transport
  downstream:
  - target: Mitochondrial Inner Membrane Depolarization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        showed comparatively diminished inner membrane polarization following
        addition of glutamate/malate, consistent with higher basal leak across
        the membrane
      explanation: >-
        Patient-derived cells show the depolarization that follows from proton
        flux uncoupled from ATP synthesis.
  - target: Compensatory Respiratory Chain Hyperactivity
    causal_link_type: DIRECT
    hypothesis_groups:
    - coupling_versus_catalysis_allelic_split
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        these results suggest the increased oxygen consumption rate is caused by
        dissipation of the proton motive force, without a corresponding increase
        in ATP synthesis
      explanation: >-
        Directly attributes the raised respiration to dissipation of the proton
        motive force rather than to increased ATP demand.
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      demonstrating that uncoupling arises from a defect intrinsic to CV
    explanation: >-
      The oligomycin and saturating-ADP controls establish that the uncoupling
      originates in complex V rather than in a generally leaky membrane.
- name: Mitochondrial Inner Membrane Depolarization
  description: >-
    The inner membrane potential, which is the dominant component of the proton
    motive force in human mitochondria, is reduced after glutamate and malate
    addition in a line derived from Patient 2, and at baseline in the isogenic
    CRISPR knock-in clones. Two controls localise the leak to complex V: the
    depolarization is corrected by oligomycin, and potential following ADP
    addition is comparable to control, so the difference disappears when the
    enzyme is either silenced or maximally stimulated.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: regulation of mitochondrial membrane potential
    modifier: DECREASED
    term:
      id: GO:0051881
      label: regulation of mitochondrial membrane potential
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      associated with a lower baseline mitochondrial membrane potential
    explanation: >-
      Independently engineered heterozygous clones reproduce the reduced
      membrane potential seen in patient cells.
- name: Compensatory Respiratory Chain Hyperactivity
  description: >-
    Because the proton gradient is continuously dissipated, the respiratory
    chain runs faster to rebuild it. Basal oxygen consumption is elevated in
    intact and permeabilized patient fibroblasts and in engineered mutant cells.
    This is the inverse of the depressed respiration that characterises most
    mitochondrial disease.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: elevated basal oxygen consumption
    modifier: INCREASED
    term:
      id: GO:0022904
      label: respiratory electron transport chain
  downstream:
  - target: Glycolytic Compensation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we observed elevated baseline extracellular acidification rate,
        increased glucose consumption, and increased lactate release in the
        mutant cells, suggesting that secondary cellular adaptations include
        increased glycolysis
      explanation: >-
        Names the glycolytic shift as a secondary adaptation downstream of the
        respiratory phenotype.
  - target: Substrate Energy Dissipation As Heat
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        In such circumstances, the energy is lost in the form of heat, as
        opposed to being captured in the form of ATP.
      explanation: >-
        States the thermodynamic consequence of respiration uncoupled from ATP
        synthesis.
  - target: Systemic Hypermetabolic State
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We observed higher basal oxygen consumption rate in intact proband
      fibroblasts compared to control
    explanation: >-
      Direct measurement of elevated basal respiration in patient-derived cells.
  notes: >-
    Bound to GO:0022904 respiratory electron transport chain rather than
    GO:0006119 oxidative phosphorylation. What rises here is electron transport
    and oxygen consumption; GO:0006119 is defined as the phosphorylation of ADP
    to ATP accompanying that oxidation, which in this disease is reduced rather
    than increased. An INCREASED modifier on GO:0006119 would state the inverse
    of the mechanism and contradict the DECREASED annotation on the upstream
    ATP-synthesis node.
- name: Glycolytic Compensation
  description: >-
    Mutant cells increase glucose uptake, glycolytic flux and lactate release, a
    secondary adaptation to ATP that the uncoupled complex V no longer supplies
    efficiently. Whether this contributes to the patients' metabolic laboratory
    abnormalities is not established.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: glycolytic process
    modifier: INCREASED
    term:
      id: GO:0006096
      label: glycolytic process
- name: Substrate Energy Dissipation As Heat
  description: >-
    Energy from oxidised substrate that is not captured as ATP leaves the system
    as heat. This is the proposed basis of the patients' hyperthermia and
    diaphoresis, although the authors note it does not explain why the
    hyperthermia is episodic rather than continuous.
  biological_scale: ORGANISM
  downstream:
  - target: Recurrent hyperthermia
    causal_link_type: DIRECT
  - target: Hyperhidrosis
    causal_link_type: DIRECT
- name: Systemic Hypermetabolic State
  description: >-
    At the whole-organism level the uncoupling appears as euthyroid
    hypermetabolism: caloric intake several times the estimated resting energy
    expenditure, without weight gain. Thyroid function is normal, which
    separates this from the far commoner endocrine causes of hypermetabolism.
  biological_scale: ORGANISM
  downstream:
  - target: Increased resting energy expenditure
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36239646
      reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Failure to thrive developed by 2 months of age and persisted despite
        caloric intake in excess of calculated need for catch-up growth.
      explanation: >-
        Growth failure persisting despite calories in excess of requirement is
        what ties the clinical picture to the metabolic defect rather than to
        undernutrition.
  - target: Polyphagia
    causal_link_type: DIRECT
  - target: Tachypnea
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36239646
    reference_title: Congenital Hypermetabolism and Uncoupled Oxidative Phosphorylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presenting with a euthyroid hypermetabolism, failure to thrive despite
      excessive caloric intake, intermittent hyperthermia, and developmental
      delay
    explanation: >-
      Summarises the organism-level presentation and records that it is
      euthyroid.

  description: >-
    Diagnosis is made on the prenatal clinical and radiographic picture and confirmed by
    biallelic LBR variants, with fibroblast sterol profiling as the biochemical
    corroboration. Examining the parents' granulocytes for hypolobulated nuclei is a
    cheap and informative adjunct, since a carrier may show Pelger-Huet anomaly.

treatments:
- name: Prenatal diagnosis and genetic counselling
  description: >-
    No disease-modifying treatment exists and the course is perinatally lethal, so care is
    prenatal diagnosis, discussion of the lethal prognosis, and recurrence-risk counselling
    for the 25% autosomal recessive risk.
  therapeutic_modality: BEHAVIORAL
  treatment_term:

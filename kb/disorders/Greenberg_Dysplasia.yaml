    reference_title: "A novel case of Greenberg dysplasia and genotype-phenotype correlation analysis for LBR pathogenic variants: An instructive example of one gene-multiple phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified by whole exome sequencing and causing Greenberg dysplasia in two fetuses
      from a consanguineous Moroccan family
    explanation: >-
      Recurrence in two fetuses of one consanguineous family is the situation counselling
      addresses; the report also shows exome sequencing as the route to the diagnosis.
differential_diagnoses:
- name: X-linked chondrodysplasia punctata 2 (Conradi-Hunermann-Happle syndrome)
  disease_term:
    preferred_term: X-linked chondrodysplasia punctata 2
    term:
      id: MONDO:0020603
      label: X-linked chondrodysplasia punctata 2
  description: >-
    Another sterol-biosynthesis disorder in the same skeletal nosology group whose severe
    end overlaps the Greenberg picture radiographically. The distinction is inheritance and
    the specific sterol profile.
  distinguishing_features:
  - CDPX2 is X-linked dominant with a mosaic, asymmetric phenotype; Greenberg dysplasia is autosomal recessive and uniform
  - CDPX2 accumulates 8(9)-cholestenol and 8-dehydrocholesterol; Greenberg dysplasia accumulates cholesta-8,14-dien-3-beta-ol
  - CDPX2 has a broad severity range including near-normal adults; Greenberg dysplasia is perinatally lethal
  evidence:
  - reference: PMID:32304187
    reference_title: "A new case of Greenberg dysplasia and literature review suggest that Greenberg dysplasia, dappled diaphyseal dysplasia, and Astley-Kendall dysplasia are allelic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conditions with abnormal sterol metabolism and different genetic basis have clinical
      and radiographic features similar to Greenberg dysplasia, for example X-linked
      dominant chondrodysplasia punctata, Conradi-Hünermann type, and CHILD syndrome
    explanation: Names CDPX2 and CHILD syndrome as the sterol-pathway look-alikes.
- name: Dappled diaphyseal dysplasia and Astley-Kendall dysplasia
  description: >-
    Two entities of previously unknown genetic cause whose clinical and radiographic
    phenotypes closely resemble Greenberg dysplasia. On that comparison they have been
    proposed to be allelic with it - which, if confirmed, would make them LBR disorders
    rather than differentials. dismech records the proposal without adopting it.
  distinguishing_features:
  - Reported without an established molecular cause, so the distinction rests on radiographic pattern rather than genotype
  - Proposed to be allelic with Greenberg dysplasia rather than genuinely separate entities
  evidence:
  - reference: PMID:32304187
    reference_title: "A new case of Greenberg dysplasia and literature review suggest that Greenberg dysplasia, dappled diaphyseal dysplasia, and Astley-Kendall dysplasia are allelic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Comparing the clinical and radiographic phenotypes of Greenberg dysplasia, dappled
      diaphyseal dysplasia, and Astley-Kendall dysplasia, we suggest that these are allelic
      disorders.
    explanation: States the proposal, at the strength the authors state it.
- name: Pelger-Huet anomaly and the milder biallelic LBR skeletal phenotypes
  description: >-
    Not a diagnostic confusion so much as the rest of the allelic series. Heterozygous
    structural-domain variants give the benign granulocyte anomaly; biallelic variants with
    residual reductase activity give a mild, spontaneously regressing spondylometaphyseal
    dysplasia; and a homozygous missense variant has been reported in two adult sisters
    with a non-lethal skeletal dysplasia and no Pelger-Huet anomaly at all.
  distinguishing_features:
  - Pelger-Huet anomaly is heterozygous, benign, and confined to granulocyte nuclear morphology
  - The anadysplasia-like spondylometaphyseal dysplasia is biallelic but mild and spontaneously regressing
  - Greenberg dysplasia requires biallelic variants that abolish rather than reduce sterol reductase activity
  evidence:
  - reference: PMID:32827848
    reference_title: "A homozygous variant in the Lamin B receptor gene LBR results in a non-lethal skeletal dysplasia without Pelger-Huët anomaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a homozygous LBR missense mutation (NM_002296.4: c.1366C > G,
      p.(Leu456Val)) in two adult sisters with a Lamin B receptor-related disorder
      associated with a skeletal dysplasia milder than Greenberg Dysplasia.
    explanation: >-
      Documents a biallelic non-lethal LBR skeletal phenotype, widening the allelic series
      beyond the two classical poles.
discussions:
- discussion_id: sterol_to_skeleton_route_greenberg
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Accumulation of Cholesta-8,14-dien-3-beta-ol
  - pathophysiology#Abnormal Chondro-Osseous Calcification
  prompt: >-
    By what route does loss of sterol C14-reductase activity produce ectopic calcification
    and moth-eaten long bones, rather than some other consequence of cholesterol
    deficiency?
  rationale: >-
    The upstream half of this disorder is unusually well established - the accumulating
    sterol was measured, the enzyme inferred, the gene found, patient cells complemented,
    and the enzymatic arm separated experimentally from the structural one. The downstream
    half is not. Lbr expression in the embryonic mouse skeleton and skin matches the sites
    of histological change, which localizes the lesion but does not explain it, and the
    same gap exists for the other post-squalene disorders in this nosology group. The
    tractable comparison is within the allelic series itself: Greenberg dysplasia, the
    anadysplasia-like spondylometaphyseal dysplasia, and the reported non-lethal biallelic
    phenotype differ in residual reductase activity, so they form a natural dose-response
    series against which any proposed downstream mechanism could be tested.
  evidence:
  - reference: PMID:21327084
    reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We studied Lbr in mouse embryos and demonstrate expression in skin and the developing
      skeletal system consistent with sites of histological changes in Greenberg dysplasia.
    explanation: >-
      Expression mapping localizes the lesion to the affected tissues without identifying
      the mechanism within them.
- discussion_id: lbr_dual_function_residual_role
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#LBR Structural Function at the Inner Nuclear Membrane
  prompt: >-
    Given that the enzymatic arm is established as the cause of lethality, does the
    structural arm contribute anything to the Greenberg phenotype in patients carrying
    truncating rather than missense alleles?
  rationale: >-
    The uncoupling experiment used two missense alleles and showed that abolishing the
    reductase activity alone is sufficient for the lethal phenotype. That is not the same
    as showing the structural function never contributes. The index Greenberg allele is
    truncating, and truncated LBR variants have separately been shown to be highly unstable
    and rapidly degraded by a nuclear-membrane protein quality control pathway - so a
    patient with two truncating alleles loses the protein entirely, both functions at once,
    while a patient with two missense alleles may keep the structural one. Whether those
    two genotype classes differ phenotypically has not been tested, and the question bears
    on whether this entry's mechanism is complete as modelled.
  evidence:
  - reference: PMID:27830109
    reference_title: "Pelger-Huët anomaly and Greenberg skeletal dysplasia: LBR-associated diseases of cholesterol metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, two disease-associated LBR truncation mutants were found to be highly
      unstable at the protein level and are rapidly turned over by a novel nuclear
      membrane-based protein quality control pathway.
    explanation: >-
      Establishes that truncating alleles remove the protein rather than only its enzymatic
      activity, which is the basis for expecting the two genotype classes to differ.
notes: >-
  Curated as its own dismech entry because the ISDS 2023 nosology lists it as its own row
  (NOS 23-0050). The other LBR phenotypes are deliberately not modelled as subtypes here:
  Pelger-Huet anomaly is not a skeletal disorder at all, and the milder biallelic skeletal
  phenotypes are separate concepts that MONDO:0008974 does not cover. They are recorded as
  an allelic series in the differential diagnoses instead, which keeps the genotype-phenotype
  gradient visible without asserting that they are the same disease. A member of the
  Chondrodysplasia_Punctata grouping.

  On the `Laminopathy` parent, which sits oddly beside this entry's argument that the lethal
  phenotype comes from the enzymatic and not the structural arm of LBR. It is kept
  deliberately, and the two claims are compatible rather than contradictory: LBR genuinely is
  an inner nuclear membrane protein, MONDO genuinely classifies this disease beneath
  MONDO:0021106 (laminopathy), and much of the relevant literature - the Pelger-Huet work, the
  protein-quality-control work on truncated LBR - is nuclear-envelope literature that a reader
  should be able to reach from here. What the entry denies is narrower: that the *lethality*
  is caused by loss of the structural function. `parents` is navigational, whereas
  `icimd_category: sterol_metabolism` is the mechanistic claim, and only the latter is
  asserted as mechanism. Dropping the parent would hide a true classification to remove an
  apparent inconsistency.

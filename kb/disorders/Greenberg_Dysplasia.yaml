name: Greenberg Dysplasia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Greenberg dysplasia - also called HEM skeletal dysplasia, for hydrops, ectopic
  calcification, and the moth-eaten appearance of the long bones and pelvis - is an
  autosomal recessive, prenatally lethal chondrodystrophy caused by biallelic
  loss-of-function variants in LBR. Its interest is that the causal protein does two
  unrelated jobs. LBR is an inner nuclear membrane protein whose nucleoplasmic domain
  tethers heterochromatin to the nuclear periphery and shapes the interphase nucleus,
  while its transmembrane domains carry the 3-beta-hydroxysterol delta-14-reductase
  activity of the cholesterol biosynthetic pathway. Which of those two functions the
  lethal skeletal phenotype comes from was genuinely open for a decade, and the question
  was settled by an experiment rather than by argument: two Greenberg-causing missense
  variants were shown to fail to rescue a C14-sterol-reductase-deficient yeast strain,
  while the carrier parents had no Pelger anomaly - so the alleles abolished the enzyme
  without measurably disturbing nuclear structure. The metabolic function is therefore
  the one that is essential for human intrauterine development, and Greenberg dysplasia
  belongs with the sterol-biosynthesis malformation syndromes rather than with the
  laminopathies, despite LBR sitting in the nuclear envelope. The same gene supports an
  unusually clean allelic series that maps onto the two functions: heterozygous variants
  impairing the structural role give the benign Pelger-Huet anomaly of hypolobulated
  granulocyte nuclei, biallelic variants leaving residual reductase activity give a mild,
  spontaneously regressing spondylometaphyseal dysplasia, and biallelic variants
  abolishing it give this disorder. That the healthy mother of the index Greenberg fetus
  had hypolobulated nuclei in 60% of her granulocytes is what first showed classic
  Pelger-Huet anomaly to be the heterozygous state of the same enzyme deficiency.
synonyms:
- HEM skeletal dysplasia
- Hydrops-ectopic calcification-moth-eaten skeletal dysplasia
- Greenberg skeletal dysplasia
- GRBGD
- Skeletal dysplasia, Greenberg type
disease_term:
  preferred_term: Greenberg dysplasia
  term:
    id: MONDO:0008974
    label: Greenberg dysplasia
parents:
- Sterol Biosynthesis Disorder
- Chondrodysplasia Punctata
- Laminopathy
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      An autosomal recessive Mendelian lethal skeletal dysplasia; the clinical encounter
      is prenatal diagnosis and genetic counselling rather than organ-system management.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism: a demonstrated block in post-squalene
      cholesterol biosynthesis, with the diagnostic accumulation of
      cholesta-8,14-dien-3-beta-ol.
  icimd_category:
  - classification_value: sterol_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of sterol metabolism"
      under category "Disorders of lipid metabolism". The assignment follows the
      experimental separation of LBR's two functions: the Greenberg-causing alleles
      abolish sterol C14-reductase activity, so this is a cholesterol-synthesis
      enzymopathy rather than a structural nuclear-envelope disease, even though the
      protein is a nuclear envelope protein and the same gene also causes a laminopathy.
  isds_skeletal_category:
  - classification_value: chondrodysplasia_punctata
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 23 "Chondrodysplasia punctata (CDP) group", row
      NOS 23-0050 "Greenberg dysplasia, LBR-related" (MIM 215140). Carried forward from
      the 2019 revision (Mortier et al., PMID:31633310), where the group was numbered 21.
      Exactly one group is assigned. Two caveats worth recording. First, the other
      LBR-related skeletal phenotype - the mild, regressing biallelic
      anadysplasia-like spondylometaphyseal dysplasia - is a separate concept and is not
      covered by this row. Second, dappled diaphyseal dysplasia and Astley-Kendall
      dysplasia have been argued on clinical and radiographic grounds to be allelic with
      Greenberg dysplasia; neither appears as a 2023 group-23 row, and dismech does not
      annotate them here, since a proposed allelic relationship is not a nosology
      placement.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0008974
      label: Greenberg dysplasia
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The dismech entry and the MONDO class denote the same entity: the biallelic
      LBR-related prenatally lethal HEM skeletal dysplasia. The other LBR phenotypes
      (Pelger-Huet anomaly, the anadysplasia-like spondylometaphyseal dysplasia, the
      reported non-lethal skeletal dysplasia) are discussed here as an allelic series but
      are not part of this class.

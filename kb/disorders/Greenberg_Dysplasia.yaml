progression:
- phase: Prenatal - hydrops and short limbs on fetal imaging
  notes: >-
    The disorder presents in utero. Fetal hydrops with markedly short limbs is what
    brings it to attention, and the moth-eaten long bones and ectopic calcifications are
    seen on fetal or post-mortem radiographs.
  evidence:
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hydrops-ectopic calcification-"moth-eaten" (HEM) or Greenberg skeletal dysplasia is
      an autosomal recessive chondrodystrophy with a lethal course, characterized by fetal
      hydrops, short limbs, and abnormal chondro-osseous calcification.
    explanation: States the presenting prenatal features.
- phase: Perinatal lethality
  notes: >-
    The course is lethal in the perinatal period. There is no postnatal natural history
    to describe, and management is prenatal diagnosis, counselling, and recurrence-risk
    assessment.
  evidence:
  - reference: PMID:30561119
    reference_title: "A novel case of Greenberg dysplasia and genotype-phenotype correlation analysis for LBR pathogenic variants: An instructive example of one gene-multiple phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Greenberg skeletal dysplasia is an autosomal recessive, perinatal lethal disorder
      associated with biallelic variants affecting the lamin B receptor (LBR) gene.
    explanation: States the perinatal lethality.
pathophysiology:
- name: LBR Sterol C14-Reductase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic LBR variants abolish the 3-beta-hydroxysterol delta-14-reductase activity
    carried by the protein's transmembrane domains, blocking the C14 reduction step of
    post-squalene cholesterol synthesis. The gene was reached through the biochemistry
    rather than the other way round: an accumulating sterol was identified first, that
    pointed to a C14 reductase, and only two candidate genes were then sequenced.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    gene:
      preferred_term: LBR
      term:
        id: hgnc:6518
        label: LBR
    description: >-
      Biallelic (homozygous or compound heterozygous) germline loss-of-function variants,
      including truncating alleles and missense alleles at residues conserved among sterol
      reductases. The Greenberg phenotype requires essentially complete loss of the
      reductase activity; alleles leaving residual activity give the milder biallelic
      phenotype instead.
  molecular_functions:
  - preferred_term: 3-beta-hydroxysterol delta-14-reductase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0050613
      label: Delta14-sterol reductase activity
  biological_processes:
  - preferred_term: cholesterol biosynthesis
    modifier: DECREASED
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
  evidence:
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional complementation of the HEM cells by transfection with control LBR cDNA
      confirmed that LBR encoded the defective sterol delta(14)-reductase.
    explanation: >-
      Complementation of patient cells with wild-type LBR establishes that the enzymatic
      deficiency is caused by the LBR lesion, rather than merely co-occurring with it.
  - reference: PMID:21327084
    reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to wildtype LBR, both mutations failed to rescue C14 sterol reductase
      deficient yeast, indicating an enzymatic defect.
    explanation: >-
      A yeast complementation assay demonstrates the enzymatic defect for the specific
      Greenberg-causing missense alleles.
  downstream:
  - target: Cellular Cholesterol Deficiency
    description: >-
      The block also starves the cell of the pathway end product. This is the second arm of
      the dual lesion that the post-squalene cholesterol-synthesis disorders share, and it is
      the arm that reaches limb patterning rather than mineralization.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20929975
      reference_title: "Malformation syndromes caused by disorders of cholesterol synthesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Generally, inborn errors of cholesterol synthesis lead to both a deficiency of
        cholesterol and increased levels of potentially bioactive or toxic precursor sterols.
      explanation: >-
        States the dual lesion for this disorder class. The same review covers HEM dysplasia
        by name, so Greenberg dysplasia is one of the entities it is describing.
  - target: Accumulation of Cholesta-8,14-dien-3-beta-ol
    description: >-
      Substrate immediately above the C14 reduction step accumulates, and its elevation in
      cultured fibroblasts is the biochemical marker that identified the enzyme.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12618959
      reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found elevated levels of cholesta-8,14-dien-3beta-ol in cultured skin
        fibroblasts of an 18-wk-old fetus with HEM, compatible with a deficiency of the
        cholesterol biosynthetic enzyme 3beta-hydroxysterol delta(14)-reductase.
      explanation: >-
        Documents the accumulating sterol in patient cells and its inference to the
        enzymatic block.
- name: Cellular Cholesterol Deficiency
  biological_scale: CELLULAR
  description: >-
    Loss of the pathway end product, separately from any toxicity of the sterol that
    accumulates above the block. Cholesterol is required for the maturation and signalling of
    hedgehog proteins, which is the route by which a lipid-synthesis enzymopathy reaches
    embryonic patterning rather than mineralization. This node is why postaxial polydactyly
    belongs in this entry at all: it is a limb patterning defect, not a consequence of
    disordered calcification, and it recurs across the distal cholesterol-pathway disorders
    that have nothing else in common with Greenberg dysplasia. The same node and the same
    argument appear in the CDPX2 entry.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:20929975
    reference_title: "Malformation syndromes caused by disorders of cholesterol synthesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cholesterol is also essential for the proper maturation and signaling of hedgehog
      proteins, and thus cholesterol is critical for embryonic development.
    explanation: >-
      States the hedgehog dependence on cholesterol that connects this enzyme class to
      malformation rather than to mineralization phenotypes.
  downstream:
  - target: Postaxial Polydactyly
    description: >-
      Impaired hedgehog signalling is the standing explanation for the postaxial polydactyly
      seen across the distal cholesterol-biosynthesis disorders. The specific steps have not
      been demonstrated in Greenberg dysplasia, so the edge is recorded as having unknown
      intermediates rather than as a worked-out mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:32304187
      reference_title: "A new case of Greenberg dysplasia and literature review suggest that Greenberg dysplasia, dappled diaphyseal dysplasia, and Astley-Kendall dysplasia are allelic disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Other disorders caused by variants more distally in the cholesterol biosynthesis
        pathway can also present with rhizomelia and post-axial polydactyly, including
        Smith-Lemli-Opitz syndrome and desmosterolosis
      explanation: >-
        Attributes the combination of rhizomelia and postaxial polydactyly to the cholesterol
        biosynthesis pathway across several disorders, which is the basis for routing
        polydactyly through the cholesterol-deficiency arm rather than the calcification arm.
- name: Accumulation of Cholesta-8,14-dien-3-beta-ol
  biological_scale: MOLECULAR
  description: >-
    The sterol intermediate immediately upstream of the block accumulates while
    cholesterol synthesis falls - the same dual lesion seen across the post-squalene
    cholesterol-synthesis disorders. It is the diagnostic analyte for the disorder in
    cultured fibroblasts.
  evidence:
  - reference: PMID:30561119
    reference_title: "A novel case of Greenberg dysplasia and genotype-phenotype correlation analysis for LBR pathogenic variants: An instructive example of one gene-multiple phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variants associated with GRBGD or PHASK result in a deficiency of sterol
      reductase activity and in elevated levels of sterol intermediates [Tsai and others
      2016].
    explanation: >-
      Confirms that both biallelic LBR phenotypes share the reductase deficiency with
      accumulation of upstream sterol intermediates.
  downstream:
  - target: Abnormal Chondro-Osseous Calcification
    description: >-
      The route from the sterol lesion to disordered mineralization of cartilage and bone
      is not resolved, but the tissue distribution matches: Lbr is expressed in the
      developing skeletal system and skin in the mouse embryo, the sites of the
      histological changes seen in the disorder.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:21327084
      reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We studied Lbr in mouse embryos and demonstrate expression in skin and the
        developing skeletal system consistent with sites of histological changes in
        Greenberg dysplasia.
      explanation: >-
        Expression at the affected sites is consistent with a cell-autonomous skeletal
        lesion but does not identify the intervening steps.
- name: LBR Structural Function at the Inner Nuclear Membrane
  biological_scale: CELLULAR
  description: >-
    The second, separable function of the same protein: the nucleoplasmic domain binds
    lamin B and chromatin and tethers heterochromatin to the nuclear periphery,
    maintaining interphase nuclear shape. This node is modelled not because it drives
    Greenberg dysplasia but because establishing that it does not is what defines the
    disorder's mechanism. Alleles that impair it heterozygously give Pelger-Huet anomaly;
    the Greenberg alleles studied for this question left it measurably intact.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: heterochromatin organization
    term:
      id: GO:0070828
      label: heterochromatin organization
  - preferred_term: nuclear envelope organization
    term:
      id: GO:0006998
      label: nuclear envelope organization
  evidence:
  - reference: PMID:21327084
    reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The lamin B receptor (LBR) is an inner nuclear membrane protein with a structural
      function interacting with chromatin and lamins, and an enzymatic function as a
      sterol reductase.
    explanation: States the protein's two functions, which the disorder's mechanism turns on.
  - reference: PMID:21327084
    reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found no Pelger anomaly in the carrier parent excluding marked effects on nuclear
      structure.
    explanation: >-
      Recorded as REFUTE because it is evidence against the structural arm being the cause
      of the Greenberg phenotype: the carrier parent of these Greenberg alleles had no
      nuclear-morphology phenotype at all.
  downstream:
  - target: Abnormal Chondro-Osseous Calcification
    description: >-
      A structural-function route to the skeletal phenotype is the hypothesis that the
      uncoupling experiment argued against, and it is retained here as a refuted
      alternative rather than an asserted mechanism.
    causal_link_type: UNKNOWN
    evidence:
    - reference: PMID:21327084
      reference_title: "Mutations causing Greenberg dysplasia but not Pelger anomaly uncouple enzymatic from structural functions of a nuclear membrane protein."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: >-
        We conclude that LBR missense mutations can abolish sterol reductase activity,
        causing lethal Greenberg dysplasia but not Pelger anomaly.
      explanation: >-
        The conclusion assigns the lethal phenotype to the enzymatic and not the structural
        arm, so this edge is recorded as hypothesized and refuted rather than supported.

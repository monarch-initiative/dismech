genetic:
- name: LBR
  relationship_type: CAUSATIVE
  presence: Present
  gene_term:
    preferred_term: LBR
    term:
      id: hgnc:6518
      label: LBR
  notes: >-
    LBR at 1q42.1. The gene supports at least three clinical phenotypes, and which one
    results is a function of the domain affected, the zygosity, and the residual protein
    activity - heterozygous structural-domain variants give Pelger-Huet anomaly, biallelic
    variants with residual reductase activity give the anadysplasia-like
    spondylometaphyseal dysplasia, and biallelic variants abolishing reductase activity
    give Greenberg dysplasia.
  evidence:
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of two candidate genes encoding putative human sterol
      delta(14)-reductases (TM7SF2 and LBR) identified a homozygous
      1599-1605TCTTCTA-->CTAGAAG substitution in exon 13 of the LBR gene encoding the
      lamin B receptor, which results in a truncated protein.
    explanation: >-
      Identifies the gene and the index truncating allele, and records that the other
      candidate C14 reductase, TM7SF2, was excluded.
  - reference: PMID:30561119
    reference_title: "A novel case of Greenberg dysplasia and genotype-phenotype correlation analysis for LBR pathogenic variants: An instructive example of one gene-multiple phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diverse phenotypes are correlated to the functional domain affected, the
      heterozygous or homozygous state of the variants, and their different impact on the
      residual protein function.
    explanation: States the three axes of the genotype-phenotype correlation for this gene.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic variants are required. A heterozygous carrier is not merely unaffected but
    may carry a detectable trait of their own - the classic Pelger-Huet anomaly - which is
    how the relationship between the two phenotypes was first recognized.
  evidence:
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fact that the healthy mother of the fetus showed hypolobulated nuclei in 60% of
      her granulocytes confirms that classic Pelger-Huët anomaly represents the
      heterozygous state of 3beta-hydroxysterol delta(14)-reductase deficiency.
    explanation: >-
      Establishes both the recessive inheritance and the identity of the heterozygous state
      with Pelger-Huet anomaly.
biochemical:
- name: Cholesta-8,14-dien-3-beta-ol in cultured skin fibroblasts
  notes: >-
    Elevation of the sterol immediately upstream of the C14 reduction step, measured in
    cultured skin fibroblasts. This was the finding that identified the enzyme before the
    gene was known, and it remains the biochemical confirmation of the diagnosis.
  evidence:
  - reference: PMID:12618959
    reference_title: "Autosomal recessive HEM/Greenberg skeletal dysplasia is caused by 3 beta-hydroxysterol delta 14-reductase deficiency due to mutations in the lamin B receptor gene."
    supports: SUPPORT

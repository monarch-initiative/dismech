    explanation: Diagnostic work-up.
differential_diagnoses:
- name: STAT3 loss-of-function and DOCK8 deficiency hyper-IgE syndromes
  description: Heterozygous CARD11 variants can mimic STAT3-LOF, DOCK8 deficiency, CVID, neutropenia and IPEX-like presentations, so CARD11 should be included in hyper-IgE and primary atopic disorder gene panels.
  distinguishing_features:
  - Heterozygous dominant-negative CARD11 variant with reduced antigen receptor-induced NF-kB activation
  - Absence of the STAT3-LOF skeletal/dental features or DOCK8 lymphopenia
  evidence:
  - reference: PMID:30170123
    reference_title: "Hypomorphic caspase activation and recruitment domain 11 (CARD11) mutations associated with diverse immunologic phenotypes with or without atopic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "heterozygous missense and indel mutations in CARD11 presented with immunologic phenotypes similar to those observed in signal transducer and activator of transcription 3 loss of function, dedicator of cytokinesis 8 deficiency, common variable immunodeficiency, neutropenia, and immune dysregulation, polyendocrinopathy, enteropathy, X-linked-like syndrome"
    explanation: Phenocopies to consider.

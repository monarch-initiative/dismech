discussions:
- discussion_id: cadins_mouse_no_atopic_dermatitis
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Atopic Inflammation with Hyper-IgE and Eosinophilia
  prompt: >
    Why do CARD11 R30W/+ mice develop high IgE but not spontaneous atopic dermatitis or Th2
    expansion, and what additional environmental or genetic factor converts hyper-IgE into
    overt atopy in patients?
  rationale: >
    The patient-allele knock-in reproduces the signalling and immunodeficiency defects and
    age-dependent IgE elevation but not the defining skin disease, and the authors conclude
    that high IgE is not sufficient for atopic symptoms; the human Th2 skewing via GATA3 was
    shown in patient T cells but is absent in the mouse.
  evidence:
  - reference: PMID:34341167
    reference_title: "Pathway-Specific Defects in T, B, and NK Cells and Age-Dependent Development of High IgE in Mice Heterozygous for a CADINS-Associated Dominant Negative CARD11 Allele."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, precisely how a heterozygous dominant negative CARD11 allele leads to the development of this CADINS-specific cluster of symptoms remains poorly understood."
    explanation: Explicit statement of the open question.
- discussion_id: cadins_versus_null_phenotype_divergence
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Oligomer Poisoning of the CARD11 Signaling Cycle
  prompt: >
    Why does partial, dominant-negative interference with CARD11 signalling produce severe
    atopy and autoimmunity, whereas complete biallelic loss produces profound combined
    immunodeficiency without atopy?
  rationale: >
    Both disorders reduce antigen receptor-induced NF-kB signalling, but only residual
    signalling appears to permit the Th2-skewed, autoreactive responses of CADINS; oligomer
    poisoning studies explain the inheritance difference but not the qualitative phenotype
    divergence.
  evidence:
  - reference: PMID:35198875
    reference_title: "Mechanistic impact of oligomer poisoning by dominant-negative CARD11 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Three classes of germline mutations in CARD11 cause Primary Immunodeficiency, including homozygous loss-of-function (LOF) mutations in CARD11 deficiency, heterozygous gain-of-function (GOF) mutations in BENTA disease, and heterozygous dominant-negative LOF mutations in CADINS."
    explanation: The three allelic classes whose divergence is unexplained.
notes: >
  Curated as a Disease entry (stub entry_type decision: DISEASE), separate from the allelic
  recessive Severe_Combined_Immunodeficiency_Due_To_CARD11_Deficiency curated in the same
  tranche; BENTA (CARD11 gain of function) is not yet in the KB. Sources: the 2017
  discovery papers (PMID:28628108, PMID:28826773), the 2019 allelic series (PMID:30170123),
  mechanism papers (PMID:35198875, PMID:40111223, PMID:37086690), the R30W mouse
  (PMID:34341167), clinical series and case reports (PMID:36405754, PMID:35651609,
  PMID:38311684, PMID:38231347, PMID:39414811) and reviews (PMID:31060714, PMID:36334349,
  PMID:40625738). No GeneReviews chapter exists. The Edison/falcon deep-research report
  completed after the first draft and passed preflight; its reference list was
  cross-checked and the S775L case report and the Pomerantz review it added are cited. Epidermodysplasia verruciformis and molluscum are
  described in the viral-infection phenotype rather than bound separately; the closest HP
  terms (chronic warts, unusual molluscum contagiosum) describe the lesions rather than the
  syndromic susceptibility, so the recurrent-viral-infection phenotype carries them instead.

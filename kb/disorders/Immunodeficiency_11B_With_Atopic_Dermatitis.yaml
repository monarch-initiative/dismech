      label: T-helper 2 cell differentiation
    modifier: INCREASED
  - preferred_term: interferon-gamma production
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: DECREASED
  downstream:
  - target: Atopic Inflammation with Hyper-IgE and Eosinophilia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40111223
    reference_title: "Dominant interfering CARD11 variants disrupt JNK signaling to promote GATA3 expression in T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further, impaired CARD11-JNK signaling was linked to enhanced GATA3 expression in CADINS patient T cells. Our findings reveal a novel intrinsic mechanism connecting impaired CARD11-dependent JNK signaling to enhanced GATA3/NFAT2 induction and TH2 cell differentiation in CADINS patients."
    explanation: Patient-cell demonstration of the Th2 mechanism.
  - reference: PMID:35651609
    reference_title: "Hyper-IgE and Carcinoma in CADINS Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial T-cell deficiency, diminished IFN-γ cytokine and increased IL-4 production, were identified as disease-causing mechanisms."
    explanation: Cytokine skew in patients.
- name: Partial T-Cell, Regulatory T-Cell and NK-Cell Dysfunction
  description: >
    T cells respond poorly to mitogens and antigens with reduced IFN-gamma and IL-2;
    CTLA4+FOXP3+ regulatory T cells are reduced; NK cells show reduced NKp46, NKG2D and CD69,
    impaired IFN-gamma production by CD56bright cells and paradoxically increased steady-state
    pS6, so that the effect of the variant on mTORC1 differs between T and NK cells. These
    defects underlie the recurrent respiratory, cutaneous and viral infections, reduced
    immune surveillance and autoimmunity.
  biological_scale: CELLULAR

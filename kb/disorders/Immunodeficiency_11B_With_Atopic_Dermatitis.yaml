    reference_title: "Management of Atopy with Dupilumab and Omalizumab in CADINS Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All developed atopic disease in infancy or early childhood."
    explanation: Onset timing.
genetic:
- name: CARD11
  gene_term:
    preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  relationship_type: CAUSATIVE
  notes: >
    Heterozygous missense and small in-frame indel variants that retain expression but act as
    dominant negatives, largely confined to the CARD and coiled-coil domains; some arise de
    novo. Functional testing (NF-kB reporter assays in transfected T cells) is required to
    classify novel variants because rare CARD11 variants of neutral effect occur, and the
    same functional assay separates dominant-negative (CADINS) from gain-of-function
    (BENTA) alleles.
  variants:
  - name: c.88C>T (p.Arg30Trp)
    description: >
      Founding dominant-negative variant segregating with severe atopy in a four-member
      family; loss of function with dominant-negative effect on wild-type CARD11, modelled
      in the CARD11 R30W/+ mouse.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28826773
      reference_title: "Combined immunodeficiency and atopy caused by a dominant negative mutation in caspase activation and recruitment domain family member 11 (CARD11)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A heterozygous novel c.C88T 1-bp substitution resulting in amino acid change R30W in caspase activation and recruitment domain family member 11 (CARD11) was identified by using whole-exome sequencing and segregated perfectly to family members with severe atopy only but was not found in healthy subjects."
      explanation: Identification, segregation and dominant-negative demonstration.
  - name: c.169G>A (p.Glu57Lys)
    description: De novo heterozygous variant in a boy with severe atopic dermatitis, food-induced anaphylaxis and hypogammaglobulinaemia; dominant-negative effect confirmed on CD4+ and CD8+ T cells.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:37086690
      reference_title: "CARD11 dominant negative mutation leads to altered human Natural Killer cell homeostasis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on a 12-year-old boy with severe atopic dermatitis, food induced anaphylaxis and hypogammaglobulinemia harbouring a novel de novo heterozygous variant c.169G > A; p.Glu57Lys in CARD11. The dominant negative effect of this mutation was confirmed on both CD4+ and CD8+."
      explanation: De novo variant with functional confirmation.
  - name: c.223C>T (p.Arg75Trp)
    description: Dominant-negative variant in a family with severe atopy, hypogammaglobulinaemia and intermittent agranulocytosis in the proband, and HPV-positive squamous cell carcinoma and cutaneous T-cell lymphoma across two generations.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35651609
      reference_title: "Hyper-IgE and Carcinoma in CADINS Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "was identified. Functional studies confirmed this variant to have a dominant negative (DN) effect, as previously described in patients with CADINS."
      explanation: Variant and functional confirmation.
  - name: c.2324C>T (p.Ser775Leu)
    description: De novo dominant-negative variant in the MAGUK region, outside the CARD and coiled-coil domains where most CADINS alleles cluster, in a Chinese girl with periodic fever, recurrent infections and eczema.
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:39414811
      reference_title: "A new-disease-causing dominant-negative variant in CARD11 gene in a Chinese case with recurrent fever."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Luciferase reporter assays and co-immunoprecipitation demonstrated mutation exerts a dominant-interfering effect on wild-type CARD11, inhibiting the activity of NF-κB."
      explanation: Functional demonstration of dominant interference by the S775L allele.
    - reference: PMID:39414811
      reference_title: "A new-disease-causing dominant-negative variant in CARD11 gene in a Chinese case with recurrent fever."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A very rare missense mutation (c.2324C > T, p.S775L) in CARD11 gene (NM_032415) was identified by WES in the patient but not her parents."
      explanation: De novo occurrence in the proband.
  evidence:
  - reference: PMID:30170123
    reference_title: "Hypomorphic caspase activation and recruitment domain 11 (CARD11) mutations associated with diverse immunologic phenotypes with or without atopic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pathogenic variants exhibited dominant negative activity and were largely confined to the CARD or coiled-coil domains of the CARD11 protein."
    explanation: Domain distribution of pathogenic alleles.
  - reference: PMID:36405754
    reference_title: "Expanding spectrum, intrafamilial diversity, and therapeutic challenges from 15 patients with heterozygous CARD11-associated diseases: A single center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional four variants showing a LOF activity were considered as causative of CARD11-associated atopy with dominant interference of NF-kB signaling (CADINS). The remaining variant exhibited a neutral functional assay excluding its carrier from further analysis."
    explanation: Need for functional classification of variants.

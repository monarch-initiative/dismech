pathophysiology:
- name: Heterozygous Dominant-Negative CARD11 Variant
  description: >
    A single hypomorphic CARD11 allele, expressed alongside the wild-type protein, exerts a
    dominant-interfering effect because CARD11 signals as an oligomer; the variant protein is
    loss-of-function on its own and additionally suppresses wild-type CARD11 when co-expressed.
  biological_scale: MOLECULAR
  downstream:
  - target: Oligomer Poisoning of the CARD11 Signaling Cycle
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35198875
      reference_title: "Mechanistic impact of oligomer poisoning by dominant-negative CARD11 variants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that strong dominant negatives can poison signaling from mixed wild-type:mutant oligomers at two steps in the CARD11 signaling cycle, at the Opening Step and at the Cofactor Association Step."
      explanation: Mechanism by which a heterozygous variant dominates.
  evidence:
  - reference: PMID:28826773
    reference_title: "Combined immunodeficiency and atopy caused by a dominant negative mutation in caspase activation and recruitment domain family member 11 (CARD11)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that the R30W mutation results in loss of function while also exerting a dominant negative effect on wild-type CARD11."
    explanation: Dominant-negative demonstration.
  - reference: PMID:28628108
    reference_title: "Germline hypomorphic CARD11 mutations in severe atopic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection of mutant CARD11 expression constructs into T cell lines demonstrated both loss-of-function and dominant-interfering activity upon antigen receptor-induced activation of nuclear factor-κB and mammalian target of rapamycin complex 1 (mTORC1)."
    explanation: Loss-of-function plus dominant interference in the founding study.
- name: Oligomer Poisoning of the CARD11 Signaling Cycle
  description: >
    Mixed wild-type:mutant CARD11 oligomers fail at the opening step, in which the inhibitory
    domain's repressive elements are neutralised, and at the cofactor-association step, so
    that antigen receptor engagement no longer converts the scaffold to its active state.
  biological_scale: MOLECULAR
  downstream:
  - target: Attenuated NF-kB, JNK and mTORC1 Signaling Downstream of the Antigen Receptor
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35198875
    reference_title: "Mechanistic impact of oligomer poisoning by dominant-negative CARD11 variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our findings provide evidence that CARD11 oligomer subunits cooperate in at least two steps during antigen receptor signaling and reveal how different LOF mutations in the same oligomeric signaling hub may cause disease with different inheritance patterns."
    explanation: Explains dominant versus recessive inheritance of CARD11 loss of function.
- name: Attenuated NF-kB, JNK and mTORC1 Signaling Downstream of the Antigen Receptor
  description: >
    Antigen receptor-induced canonical NF-kB activation, JNK/AP-1 signalling and mTORC1
    activation are all reduced in patient T cells and in cells expressing patient variants;
    the mTORC1 defect reflects impaired CARD11-dependent glutamine import and is partially
    rescued by glutamine supplementation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
    modifier: DECREASED

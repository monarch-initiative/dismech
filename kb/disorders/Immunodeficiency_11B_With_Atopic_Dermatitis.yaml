name: Immunodeficiency 11B with Atopic Dermatitis
category: Genetic
creation_date: "2026-09-05T16:30:00Z"
synonyms:
- CADINS disease
- CARD11-associated atopy with dominant interference of NF-kB signaling
- IMD11B
- Atopic dermatitis, elevated IgE, and eosinophilia (CARD11)
- Dominant-negative CARD11 deficiency
- Hypomorphic CARD11 atopic disease
description: >
  Immunodeficiency 11B with atopic dermatitis (IMD11B; OMIM #617638), known clinically as
  CADINS (CARD11-associated atopy with dominant interference of NF-kB signalling), is an
  autosomal dominant primary atopic disorder caused by heterozygous loss-of-function
  CARD11 variants that act as dominant negatives. CARD11 is the antigen receptor-proximal
  scaffold that assembles the CARD11-BCL10-MALT1 complex and drives NF-kB, JNK and mTORC1
  signalling in lymphocytes; CADINS variants, largely confined to the CARD and coiled-coil
  domains, poison mixed wild-type:mutant oligomers at the opening and cofactor-association
  steps of the signalling cycle, attenuating all three pathways. Patient T cells proliferate
  poorly, produce little IFN-gamma and IL-2, import glutamine inefficiently, and, because
  loss of CARD11-JNK signalling de-represses GATA3 and NFATC1, differentiate toward Th2;
  regulatory T cells are reduced and NK cells show altered homeostasis. The result is severe
  early-onset atopic dermatitis with markedly elevated IgE and eosinophilia, asthma, food
  allergy and urticaria, combined with a partial combined immunodeficiency (recurrent
  respiratory, cutaneous and viral infections, hypogammaglobulinaemia in some), autoimmunity,
  neutropenia, colitis and, rarely, HPV-related carcinoma or lymphoma; penetrance and
  expressivity vary even within families, and the phenotype overlaps STAT3- and DOCK8-related
  hyper-IgE syndromes. Atopy improves with age in many patients and responds to dupilumab and
  omalizumab; glutamine supplementation partially rescues the T-cell defects in vitro. The
  biallelic null (IMD11A) and gain-of-function (BENTA) CARD11 disorders are distinct allelic
  entities.

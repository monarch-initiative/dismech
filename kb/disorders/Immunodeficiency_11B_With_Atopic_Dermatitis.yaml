    reference_title: "Management of Atopy with Dupilumab and Omalizumab in CADINS Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CARD11 mutations were validated for pathogenicity using a T cell transfection assay to assess the impact on activation-induced signaling to NF-κB."
    explanation: Functional validation assay.
  - reference: PMID:36405754
    reference_title: "Expanding spectrum, intrafamilial diversity, and therapeutic challenges from 15 patients with heterozygous CARD11-associated diseases: A single center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Identification of novel CARD11 variants required functional studies to validate their pathogenic activity."
    explanation: Functional studies as a diagnostic requirement.

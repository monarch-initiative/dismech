treatments:
- name: Dupilumab
  description: Anti-IL-4 receptor alpha monoclonal antibody; rapid and sustained improvement of severe, recalcitrant atopic dermatitis in five patients with no complications, allowing other atopy medications to be reduced or stopped.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Tens of patients reported since the 2017 description of eight individuals from four
    families; a single Argentine centre described ten CADINS patients, and the condition is
    thought to be under-recognised because it overlaps common atopic disease.
  evidence:
  - reference: PMID:28628108
    reference_title: "Germline hypomorphic CARD11 mutations in severe atopic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through next-generation sequencing on a cohort of patients with severe atopic dermatitis with and without comorbid infections, we found eight individuals, from four families, with novel heterozygous mutations in CARD11, which encodes a scaffolding protein involved in lymphocyte receptor signaling."
    explanation: Founding cohort size.
  - reference: PMID:40625738
    reference_title: "From syndromic clues to diagnosis: understanding CARD11-driven disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "CARD11-associated diseases may be more prevalent than previously recognized due to their clinical overlap with atopic and hematological syndromic disorders."
    explanation: Under-recognition.
progression:
- phase: Infantile-onset atopy with variable improvement
  notes: >-
    Atopic disease begins in infancy or early childhood; in the founding cohort disease
    improved over time in most patients, while others have lifelong severe eczema,
    infections and, in adulthood, malignancy.
  evidence:
  - reference: PMID:28628108
    reference_title: "Germline hypomorphic CARD11 mutations in severe atopic disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

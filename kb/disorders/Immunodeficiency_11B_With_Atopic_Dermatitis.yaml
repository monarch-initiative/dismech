    term:
      id: MONDO:0014081
      label: severe combined immunodeficiency due to CARD11 deficiency
  distinguishing_features:
  - Biallelic null alleles, profound CID, Pneumocystis pneumonia, absent germinal centres
  evidence:
  - reference: PMID:28826773
    reference_title: "Combined immunodeficiency and atopy caused by a dominant negative mutation in caspase activation and recruitment domain family member 11 (CARD11)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike patients with biallelic mutations in CARD11 causing severe CID, the R30W defect results in a less profound yet prominent susceptibility to infections, as well as multiorgan atopy and autoimmunity."
    explanation: Contrast with the recessive disorder.
- name: BENTA disease (CARD11 gain of function)
  description: Heterozygous gain-of-function CARD11 variants cause B-cell expansion with NF-kB and T-cell anergy, with spontaneous cytoplasmic CARD11 aggregation and a lymphoproliferative rather than atopic phenotype; the functional assay separates the two.
  distinguishing_features:
  - Polyclonal B lymphocytosis and lymphoproliferation
  - Increased rather than decreased NF-kB activity and spontaneous CARD11 aggregation
  evidence:
  - reference: PMID:36405754
    reference_title: "Expanding spectrum, intrafamilial diversity, and therapeutic challenges from 15 patients with heterozygous CARD11-associated diseases: A single center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Altogether, four variants showed a GOF effect as well a spontaneous aggregation in the cytoplasm, leading to B cell expansion with NF-κB and T cell anergy (BENTA) diagnosis."
    explanation: Functional distinction from BENTA.

    snippet: "Overall, the effect of CARD11 mutation on mTORC1 differs between T and NK cells. These findings may explain the increased susceptibility to viral infections and the reduced immune surveillance in affected patients."
    explanation: Link to infection susceptibility and surveillance.
  - reference: PMID:34341167

  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: DECREASED
  - preferred_term: T cell receptor signaling pathway
    term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: Th2 Skewing via Loss of JNK-Dependent GATA3 Repression
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40111223
      reference_title: "Dominant interfering CARD11 variants disrupt JNK signaling to promote GATA3 expression in T cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transcriptome profiling revealed JNK inhibition upregulated TCR-induced expression of GATA3 and NFATC1, key transcription factors for TH2 cell development."
      explanation: JNK loss de-represses Th2 transcription factors.
  - target: Partial T-Cell, Regulatory T-Cell and NK-Cell Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28826773
      reference_title: "Combined immunodeficiency and atopy caused by a dominant negative mutation in caspase activation and recruitment domain family member 11 (CARD11)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The CARD11 defect altered the classical nuclear factor κB pathway, resulting in poor in vitro T-cell responses to mitogens and antigens caused by reduced secretion of IFN-γ and IL-2."
      explanation: Signalling defect produces the T-cell functional defect.
  evidence:
  - reference: PMID:30170123
    reference_title: "Hypomorphic caspase activation and recruitment domain 11 (CARD11) mutations associated with diverse immunologic phenotypes with or without atopic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Caspase activation and recruitment domain 11 (CARD11) encodes a scaffold protein in lymphocytes that links antigen receptor engagement with downstream signaling to nuclear factor κB, c-Jun N-terminal kinase, and mechanistic target of rapamycin complex 1."
    explanation: The three pathways downstream of CARD11.
  - reference: PMID:28628108
    reference_title: "Germline hypomorphic CARD11 mutations in severe atopic disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mTORC1 and IFN-γ production defects were partially rescued by supplementation with glutamine, which requires CARD11 for import into T cells."
    explanation: Glutamine-import basis of the mTORC1 defect.
  - reference: PMID:40111223
    reference_title: "Dominant interfering CARD11 variants disrupt JNK signaling to promote GATA3 expression in T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we show that CARD11 is critical for TCR-induced activation of JNK1 and JNK2, as well as canonical JUN/FOS AP-1 family members. Patient-derived CARD11 DI variants attenuated WT CARD11 JNK signaling, mirroring effects on NF-κB."
    explanation: JNK arm of the defect.
- name: Th2 Skewing via Loss of JNK-Dependent GATA3 Repression
  description: >
    Attenuated TCR signalling favours Th2 differentiation, a shared mechanism of the primary
    atopic disorders; in CADINS the loss of CARD11-JNK signalling specifically up-regulates
    GATA3 and NFATC1 in patient T cells, and patients show diminished IFN-gamma with
    increased IL-4 production.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-helper 2 cell differentiation

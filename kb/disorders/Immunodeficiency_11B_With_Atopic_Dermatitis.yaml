      term:
        id: NCIT:C162455
        label: Dupilumab
  target_mechanisms:
  - target: Atopic Inflammation with Hyper-IgE and Eosinophilia
    description: Blocks IL-4 and IL-13 signalling that drives the Th2 atopic inflammation.
  evidence:
  - reference: PMID:38231347
    reference_title: "Management of Atopy with Dupilumab and Omalizumab in CADINS Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All six patients had rapid and sustained improvement in atopic symptoms with no complications during the follow-up period. Previous medications used to treat atopy were able to be decreased or discontinued."
    explanation: Clinical response to biologic therapy.
  - reference: PMID:35651609
    reference_title: "Hyper-IgE and Carcinoma in CADINS Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "So far, one patient is under treatment with dupilumab, which has shown marked benefit in controlling severe eczema."
    explanation: Independent report of dupilumab benefit.

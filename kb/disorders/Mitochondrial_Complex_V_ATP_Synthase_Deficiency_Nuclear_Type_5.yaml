    modifier: DECREASED
  evidence:
  - reference: PMID:29478781
    reference_title: "Biallelic Mutations in ATP5F1D, which Encodes a Subunit of ATP Synthase, Cause a Metabolic Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "ATP synthase, H+ transporting, mitochondrial F1 complex, δ subunit (ATP5F1D; formerly ATP5D) is a subunit of mitochondrial ATP synthase and plays an important role in coupling proton translocation and ATP production."
    explanation: The normal role of the delta subunit, the activity the variants reduce.
  - reference: PMID:29478781
    reference_title: "Biallelic Mutations in ATP5F1D, which Encodes a Subunit of ATP Synthase, Cause a Metabolic Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockdown of Drosophila ATPsynδ, the ATP5F1D homolog, in developing eyes and brains caused a near complete loss of the fly head, a phenotype that was fully rescued by wild-type human ATP5F1D."
    explanation: Loss of the delta subunit is severe in vivo and wild-type human ATP5F1D can replace the fly protein.
  - reference: PMID:29478781
    reference_title: "Biallelic Mutations in ATP5F1D, which Encodes a Subunit of ATP Synthase, Cause a Metabolic Disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, expression of the ATP5F1D c.245C>T and c.317T>G variants rescued the head-size phenotype but recapitulated the eye and antennae defects seen in other genetic models of mitochondrial oxidative phosphorylation deficiency."
    explanation: The patient variants keep part of the function, the basis for recording partial loss of function.

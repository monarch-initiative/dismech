genetic:
- name: ATP5F1D
  notes: >-
    ATP5F1D (19p13.3; previous symbol ATP5D) encodes the delta subunit of the
    central stalk. Two homozygous missense variants are reported, c.245C>T
    (p.Pro82Leu) and c.317T>G (p.Val106Gly), each in one patient. ClinGen
    classifies ATP5F1D as Limited (autosomal recessive) for the lumped concept
    mitochondrial disease (MONDO:0044970, 2026), which is not this entry's
    MONDO:0020858, so no tier is recorded under gene_disease_validity.
    relationship_type is UNKNOWN because the evidence is two patients, although
    fibroblast and Drosophila studies support both variants.

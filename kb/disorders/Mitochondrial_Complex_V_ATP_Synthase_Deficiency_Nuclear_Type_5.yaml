name: Mitochondrial Complex V (ATP Synthase) Deficiency, Nuclear Type 5
creation_date: "2026-11-27T14:22:29Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex V (ATP synthase) deficiency, nuclear type 5
  term:
    id: MONDO:0020858
    label: mitochondrial complex V (ATP synthase) deficiency, nuclear type 5
description: >-
  Mitochondrial complex V (ATP synthase) deficiency nuclear type 5 (MC5DN5) is
  the recessive disorder caused by biallelic variants in ATP5F1D, the nuclear
  gene for the delta subunit of ATP synthase. Delta belongs to the central
  stalk that links the rotor to the F1 catalytic head and is needed to couple
  proton translocation to ATP production.

  Two patients have been reported, each homozygous for a different missense
  variant, both presenting with episodes of metabolic decompensation: lethargy,
  metabolic acidosis with raised lactate, hyperammonaemia and
  3-methylglutaconic aciduria, with muscle weakness and mildly delayed
  psychomotor development. The p.Pro82Leu patient presented on the second day
  of life with recurrent decompensations, rhabdomyolysis and a dilated
  cardiomyopathy that normalised between the first and fourth years; the
  p.Val106Gly patient was well until almost five years of age, when an acute
  encephalopathy occurred, and had no further cardiac or neurological symptoms
  at six years.

  Patient fibroblasts show impaired assembly of ATP synthase and reduced
  complex V activity, and one patient's cells have fewer mitochondrial
  cristae. In Drosophila, knockdown of the delta orthologue in eye and brain
  removes most of the head; wild-type human ATP5F1D fully rescues this, while
  the two patient variants restore head size but leave eye and antenna defects,
  so both are partial loss-of-function alleles.

pathophysiology:
- name: Biallelic Hypomorphic ATP5F1D Missense Variants
  biological_scale: MOLECULAR
  conforms_to: "primary_oxphos_deficiency#OXPHOS Subunit or Assembly Factor Defect"
  description: >-
    The delta subunit is part of the central stalk and plays an important role
    in coupling proton translocation to ATP production. Both patient variants
    are partial loss-of-function alleles: in Drosophila they rescue the head
    loss caused by knockdown of the delta orthologue, as wild-type human
    ATP5F1D does, but leave the eye and antenna defects typical of oxidative
    phosphorylation deficiency.

    Fibroblast studies show the assembly defect and reduced complex V activity
    that support the variants; the oligomycin-sensitive ATP hydrolysis assay
    detects nuclear-encoded complex V deficiencies in general.
  evidence:
  - reference: PMID:29478781
    reference_title: "Biallelic Mutations in ATP5F1D, which Encodes a Subunit of ATP Synthase, Cause a Metabolic Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cultured skin fibroblasts from these individuals exhibited impaired assembly of F1FO ATP synthase and subsequent reduced complex V activity."
    explanation: The fibroblast findings in the two patients.
  - reference: PMID:41124875
    reference_title: "Clinical utility of the ATP hydrolysis assay for the diagnosis of complex V deficiency in cultured skin fibroblasts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This assay was able to identify all nuclear DNA-encoded complex V deficiencies, whereas a decrease in complex V activity was observed in some patient cell lines with combined deficiencies."
    explanation: The fibroblast ATP hydrolysis assay detects nuclear complex V deficiencies.
treatments:
- name: Supportive management of metabolic decompensation
  therapeutic_modality: OTHER
  description: >-
    No disease-specific therapy exists; care is directed at the episodes of
    acidosis and hyperammonaemia.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39016153
    reference_title: "Variability of Clinical Phenotypes Caused by Isolated Defects of Mitochondrial ATP Synthase."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, the therapy remains largely symptomatic, although, in many cases, it is crucial for the survival and quality of life of the patients."
    explanation: The 2024 systematic review of isolated ATP synthase defects states that treatment is symptomatic.
differential_diagnoses:
- name: TMEM70-related complex V deficiency (MC5DN2)
  description: >-
    The common recessive cause of isolated complex V deficiency with neonatal
    lactic acidosis, hyperammonaemia and 3-methylglutaconic aciduria, usually
    with hypertrophic cardiomyopathy.
  distinguishing_features:
  - Biallelic TMEM70 rather than ATP5F1D variants
- name: Other nuclear complex V subunit disorders
  description: >-
    Recessive defects of ATP5F1A, ATP5F1E, ATP5MK and ATP5PO and dominant
    ATP5F1A variants share isolated complex V deficiency and are separated by
    the gene involved.
  distinguishing_features:
  - The specific ATP synthase subunit gene
- name: Urea cycle disorders and organic acidurias
  description: >-
    Episodic hyperammonaemia with metabolic acidosis is the presentation of
    these disorders too.
  distinguishing_features:
  - Isolated complex V deficiency in fibroblasts and biallelic ATP5F1D variants
notes: >-
  No GeneReviews chapter covers ATP5F1D or this disease. The clinical
  description rests on the founding report's abstract (PMID:29478781) and on
  the 2024 systematic review that summarises its full text (PMID:39016153);
  the full text itself was not retrieved. The MONDO exact synonym
  "mitochondrial complex v (atp synthase) deficiency" names the whole complex V
  category, not this nuclear type, and is not used as a synonym.

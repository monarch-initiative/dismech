    description: Disseminating R. conorii cells engage endothelial invasion machinery.
  - target: Rickettsial Endothelial Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Locally inoculated rickettsiae disseminate to vascular endothelium.


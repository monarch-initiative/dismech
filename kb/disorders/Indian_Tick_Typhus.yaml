name: Indian Tick Typhus
creation_date: "2026-09-28T05:48:49Z"
category: Infectious Disease
description: >-
  Indian tick typhus is an acute tick-borne spotted-fever-group rickettsiosis
  caused by the obligately intracellular bacterium Rickettsia conorii subsp.
  indica. Rhipicephalus ticks inoculate the bacterium into skin; local and
  systemic endothelial infection produces the spotted-fever pattern of fever,
  eschar, maculopapular rash, headache, thrombocytopenia, and hepatic or renal
  laboratory abnormalities.
disease_term:
  preferred_term: Indian tick typhus
  term:
    id: MONDO:0000229
    label: Indian tick typhus
parents:
- Spotted fever rickettsiosis
synonyms:
- Rickettsia conorii subsp. indica infection
- Indian tick typhus rickettsiosis
- Indian tick typhus rickettsia infection

references:
- reference: PMID:22628514
  title: Genome sequence of Rickettsia conorii subsp. indica, the agent of Indian tick typhus.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      Rickettsia conorii subsp. indica strain ITTR is the agent of Indian tick
      typhus.
    supporting_text: >-
      Rickettsia conorii subsp. indica is the agent of Indian tick typhus. The
      present study reports the draft genome of Rickettsia conorii subsp.
      indica strain ITTR (ATCC VR-597).
- reference: PMID:15766388
  title: >-
    Proposal to create subspecies of Rickettsia conorii based on multi-locus
    sequence typing and an emended description of Rickettsia conorii.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      The ITTR strain is taxonomically R. conorii subsp. indica, a genotypic
      and serotypically distinct R. conorii subspecies transmitted through
      Rhipicephalus sanguineus tick bite.
    supporting_text: >-
      The characteristics are the same as those of the species. Transmitted to
      humans through the bite of Rhipicephalus sanguineus ticks.
- reference: PMID:41650674
  title: >-
    Identification of Rickettsia conorii Indian tick typhus strain in a Patient
    and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      PCR and sequencing confirmed R. conorii Indian tick typhus strain in both
      an acutely ill patient and an attached Rhipicephalus turanicus tick.
    supporting_text: >-
      PCR and sequencing of multiple rickettsial genes confirmed the presence
      of ITTR in both the patient and the tick.


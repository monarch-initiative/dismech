- name: Arp2/3-Dependent Actin Remodeling
  role: host_cytoskeletal_response
  biological_scale: CELLULAR
  description: >-
    Spotted-fever-group rickettsiae engage host Rho-family GTPase and WAVE
    signaling that converges on Arp2/3-mediated actin filament polymerization,
    remodeling the endothelial actin cortex during entry.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: actin filament polymerization
    modifier: INCREASED
    term:
      id: GO:0030041
      label: actin filament polymerization
  evidence:
  - reference: PMID:22188208
    reference_title: >-
      Rickettsia parkeri invasion of diverse host cells involves an Arp2/3
      complex, WAVE complex and Rho-family GTPase-dependent pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Receptor binding by Rickettsia proteins initiates activation of host
      protein tyrosine kinases, leading to Cdc42 activation and Rac-dependent
      activation of WAVE, which may act in parallel with other NPFs to activate
      Arp2/3. Finally, the Arp2/3 complex acts as the major nucleator of actin

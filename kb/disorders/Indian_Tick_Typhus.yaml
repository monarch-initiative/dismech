    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results provide biochemical evidence for the occurrence of
      TXA2-dependent platelet activation and thrombin generation in vivo,
      together with endothelial dysfunction. These phenomena could account for
      clinical manifestations of MSF, such as vasculitis and focal microthrombus

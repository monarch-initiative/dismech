name: Indian Tick Typhus
creation_date: "2026-09-28T05:48:49Z"
category: Infectious Disease
description: >-
  Indian tick typhus is an acute tick-borne spotted-fever-group rickettsiosis
  caused by the obligately intracellular bacterium Rickettsia conorii subsp.
  indica. Rhipicephalus ticks inoculate the bacterium into skin; local and
  systemic endothelial infection produces the spotted-fever pattern of fever,
  eschar, maculopapular rash, headache, thrombocytopenia, and hepatic or renal
  laboratory abnormalities.
disease_term:
  preferred_term: Indian tick typhus
  term:
    id: MONDO:0000229
    label: Indian tick typhus
parents:
- Spotted fever rickettsiosis
synonyms:
- Rickettsia conorii subsp. indica infection
- Indian tick typhus rickettsiosis
- Indian tick typhus rickettsia infection

references:
- reference: PMID:22628514
  title: Genome sequence of Rickettsia conorii subsp. indica, the agent of Indian tick typhus.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      Rickettsia conorii subsp. indica strain ITTR is the agent of Indian tick
      typhus.
    supporting_text: >-
      Rickettsia conorii subsp. indica is the agent of Indian tick typhus. The
      present study reports the draft genome of Rickettsia conorii subsp.
      indica strain ITTR (ATCC VR-597).
- reference: PMID:15766388
  title: >-
    Proposal to create subspecies of Rickettsia conorii based on multi-locus
    sequence typing and an emended description of Rickettsia conorii.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      The ITTR strain is taxonomically R. conorii subsp. indica, a genotypic
      and serotypically distinct R. conorii subspecies transmitted through
      Rhipicephalus sanguineus tick bite.
    supporting_text: >-
      The characteristics are the same as those of the species. Transmitted to
      humans through the bite of Rhipicephalus sanguineus ticks.
- reference: PMID:41650674
  title: >-
    Identification of Rickettsia conorii Indian tick typhus strain in a Patient
    and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
  found_in:
  - Indian_Tick_Typhus-deep-research-openscientist.md
  findings:
  - statement: >-
      PCR and sequencing confirmed R. conorii Indian tick typhus strain in both
      an acutely ill patient and an attached Rhipicephalus turanicus tick.
    supporting_text: >-
      PCR and sequencing of multiple rickettsial genes confirmed the presence
      of ITTR in both the patient and the tick.
- reference: PMID:22612237
  title: >-
    Identification and characterization of the mammalian association and
    actin-nucleating domains in the Rickettsia conorii autotransporter protein,
    Sca2.
  findings:
  - statement: >-
      R. conorii Sca2 is sufficient to mediate adherence and invasion of human
      endothelial cells and participates in intracellular actin-based motility.
    supporting_text: >-
      A rickettsial autotransporter from Rickettsia conorii, Sca2, has been
      shown to be sufficient to mediate both adherence and invasion of human
      endothelial cells and to participate in intracellular actin-based motility.
- reference: PMID:22188208
  title: >-
    Rickettsia parkeri invasion of diverse host cells involves an Arp2/3
    complex, WAVE complex and Rho-family GTPase-dependent pathway.
  findings:
  - statement: >-
      Host Rho-family GTPase and WAVE signaling converge on the Arp2/3 complex
      as the major actin nucleator during Rickettsia invasion of host cells.
    supporting_text: >-
      Receptor binding by Rickettsia proteins initiates activation of host
      protein tyrosine kinases, leading to Cdc42 activation and Rac-dependent
      activation of WAVE, which may act in parallel with other NPFs to activate
      Arp2/3. Finally, the Arp2/3 complex acts as the major nucleator of actin
      filaments during Rickettsia invasion of host cells.
- reference: PMID:8584998
  title: >-
    Demonstration of Rickettsia Conorii-induced coagulative and platelet
    activation in vivo in patients with Mediterranean spotted fever.
  findings:
  - statement: >-
      Acute R. conorii infection is associated with TXA2-dependent platelet
      activation, thrombin generation, endothelial dysfunction, vasculitis, and
      focal microthrombus formation.
    supporting_text: >-
      Our results provide biochemical evidence for the occurrence of
      TXA2-dependent platelet activation and thrombin generation in vivo,
      together with endothelial dysfunction. These phenomena could account for
      clinical manifestations of MSF, such as vasculitis and focal microthrombus
      formation.
- reference: PMID:41795239
  title: >-
    The first pediatric cohort of Rickettsia conorii infection in Palestine: A
    five-year multicenter epidemiological and clinical analysis.
  findings:
  - statement: >-
      A PCR-confirmed pediatric R. conorii cohort documented universal fever and
      rash, hyponatremia in 78%, elevated transaminases in 83%,
      thrombocytopenia in 56%, and neurological involvement in 28%.
    supporting_text: >-
      Fever and rash were universal (100%); eschar was rare (6%).
      Gastrointestinal symptoms occurred in 44%, neurological involvement in
      28%, and arthralgia/myalgia in 33%. Laboratory abnormalities included
      thrombocytopenia (56%), hyponatremia (78%), elevated transaminases (83%),
      and markedly raised C-reactive protein.
- reference: PMID:7511715
  title: >-
    Rickettsia conorii infection of C3H/HeN mice. A model of
    endothelial-target rickettsiosis.
  findings:
  - statement: >-
      Intravenous R. conorii Malish 7 infection in C3H/HeN mice produces
      disseminated endothelial infection and vascular injury.
    supporting_text: >-
      Mice inoculated with a high dose of rickettsiae established disseminated
      endothelial infection on day 1, became ill with progressive increase in
      rickettsiae on day 4, and died with vascular injury-based
      meningoencephalitis and interstitial pneumonia on day 5 or 6.


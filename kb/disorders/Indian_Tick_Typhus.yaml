infectious_agent:
- name: Rickettsia conorii subsp. indica
  infectious_agent_term:
    preferred_term: Rickettsia conorii subsp. indica
    term:
      id: NCBITaxon:317865
      label: Rickettsia conorii subsp. indica
  description: >-
    Obligate intracellular spotted-fever-group rickettsial subspecies that
    causes Indian tick typhus.
  evidence:
  - reference: PMID:22628514
    reference_title: Genome sequence of Rickettsia conorii subsp. indica, the agent of Indian tick typhus.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsia conorii subsp. indica is the agent of Indian tick typhus. The
      present study reports the draft genome of Rickettsia conorii subsp.
      indica strain ITTR (ATCC VR-597).
    explanation: >-
      The genome report names R. conorii subsp. indica strain ITTR as the
      etiologic agent of Indian tick typhus.
  - reference: PMID:15766388
    reference_title: >-
      Proposal to create subspecies of Rickettsia conorii based on multi-locus
      sequence typing and an emended description of Rickettsia conorii.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      We propose the names R. conorii subsp. conorii subsp. nov. (type strain =
      Malish, ATCC VR-613), R. conorii subspecies indica subsp. nov. (type
      strain = ATCC VR-597), R. conorii subspecies caspia subsp. nov. (type
      strain = A-167), and R. conorii subspecies israelensis subsp. nov. (type
      strain = ISTT CDC1).
    explanation: >-
      Multilocus taxonomic analysis formally places Indian tick typhus
      rickettsia inside R. conorii as subsp. indica.

transmission:
- name: Rhipicephalus tick bite inoculation
  description: >-
    Humans acquire Indian tick typhus when infected Rhipicephalus ticks bite
    and inoculate R. conorii subsp. indica into skin.
  evidence:
  - reference: PMID:15766388
    reference_title: >-
      Proposal to create subspecies of Rickettsia conorii based on multi-locus
      sequence typing and an emended description of Rickettsia conorii.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The characteristics are the same as those of the species. Transmitted to
      humans through the bite of Rhipicephalus sanguineus ticks.
    explanation: >-
      The taxonomic description of R. conorii subsp. indica records human
      transmission through bites of R. sanguineus ticks.
  - reference: PMID:41650674
    reference_title: >-
      Identification of Rickettsia conorii Indian tick typhus strain in a
      Patient and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR and sequencing of multiple rickettsial genes confirmed the presence
      of ITTR in both the patient and the tick. Furthermore, the genetic
      identity between these sequences provided evidence that R. turanicus can
      act as a vector of ITTR.
    explanation: >-
      Matching PCR sequences from a patient and an attached R. turanicus tick
      support a second Rhipicephalus vector for ITTR.

epidemiology:
- name: Indian-subcontinent Rhipicephalus tick exposure
  description: >-
    Indian tick typhus is tied to Rhipicephalus tick exposure in India and
    Pakistan, and ITTR has been molecularly detected farther east in Xinjiang.
  factors:
  - Indian subcontinent tick exposure
  - Rhipicephalus tick exposure
  evidence:
  - reference: PMID:15766388
    reference_title: >-
      Proposal to create subspecies of Rickettsia conorii based on multi-locus
      sequence typing and an emended description of Rickettsia conorii.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The type strain is Indian tick typhus, ATCC VR-597, which was isolated
      from a Rhipicephalus sanguineus tick collected in India by C.B. Philip in
      1950.
    explanation: >-
      The subspecies description ties the type Indian tick typhus isolate to an
      R. sanguineus tick from India.
  - reference: PMID:41650674
    reference_title: >-
      Identification of Rickettsia conorii Indian tick typhus strain in a
      Patient and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rickettsia conorii Indian tick typhus strain (R. conorii subsp. indica,
      ITTR) was detected in both a human patient and an attached Rhipicephalus
      turanicus tick that was removed from the patient in Yanqi County,
      Xinjiang Uygur Autonomous Region (XUAR), China.
    explanation: >-
      The molecular case report extends documented ITTR infection and vector
      carriage to a patient and attached tick in Xinjiang.

pathophysiology:
- name: Rhipicephalus-Borne ITTR Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    An infected Rhipicephalus tick bite introduces R. conorii subsp. indica into
    the dermis, seeding local rickettsial infection that can produce an
    inoculation eschar and then disseminate systemically.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:41650674
    reference_title: >-
      Identification of Rickettsia conorii Indian tick typhus strain in a
      Patient and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 55-year-old female farmer presented with fever, headache, eschar, and a
      maculopapular rash following a tick bite.
    explanation: >-
      The patient presentation directly connects tick exposure with the local
      eschar and systemic spotted-fever manifestations of ITTR infection.
  downstream:
  - target: Inoculation Eschar
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Local dermal rickettsial infection produces the necrotic eschar.
  - target: Rickettsial Endothelial Infection
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Locally inoculated rickettsiae disseminate to vascular endothelium.

- name: Rickettsial Endothelial Infection
  role: cellular_infection
  description: >-
    R. conorii subsp. indica belongs to the spotted-fever rickettsiae whose
    pathogenic members invade and replicate in vascular endothelial cells,
    making microvascular endothelium the host-cell compartment that transduces
    infection into vasculitis.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:19327117
    reference_title: Host-cell interactions with pathogenic Rickettsia species.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although pathogenic Rickettsiae are able to infect and replicate in a
      number of different cell types in vitro, a unique property during in vivo
      infection is their affinity for vascular endothelial cells (ECs) lining
      small and medium-sized blood vessels in humans and in established animal
      models of infection
    explanation: >-
      The review identifies vascular endothelial cells as the in-vivo target
      that is shared by pathogenic spotted-fever rickettsiae.
  downstream:
  - target: Rickettsial Vasculitis
    causal_link_type: DIRECT
    description: Endothelial rickettsial infection drives vascular inflammation.

- name: Rickettsial Vasculitis
  role: vascular_response
  description: >-
    Endothelial rickettsial infection and inflammation produce small-vessel
    vasculitis, increased vascular permeability, and the fever, rash, and
    multisystem laboratory abnormalities of Indian tick typhus.
  cell_types:
  - preferred_term: endothelial cell of vascular tree
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: positive regulation of vascular permeability
    modifier: INCREASED
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
  evidence:
  - reference: PMID:34345128
    reference_title: Scrub Typhus and Other Rickettsial Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathological hallmark of rickettsial infections is endothelial
      infection and inflammation causing vasculitis. Endothelial inflammation
      results in microvascular dysfunction and increased vascular permeability.
    explanation: >-
      The rickettsial critical-care review connects endothelial infection to
      vasculitis, microvascular dysfunction, and increased permeability.
  downstream:
  - target: Fever
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial inflammation produces fever.
  - target: Maculopapular Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous rickettsial vasculitis produces the exanthem.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The acute inflammatory syndrome can include headache.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic microvascular inflammation can lower platelet counts.
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial disease can injure the liver.
  - target: Proteinuria
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic rickettsial disease can involve the kidney.
  - target: Multifocal Retinitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsial vascular inflammation can involve the retina.

- name: Rickettsial Ribosomal Translation
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    R. conorii subsp. indica, like other bacteria, depends on ribosomal
    translation of its mRNA, making the bacterial ribosome the conserved
    antibiotic target for doxycycline therapy.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the conserved target
      class for tetracyclines such as doxycycline.

- name: Intracytosolic Rickettsia conorii Niche
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion"
  description: >-
    Rickettsia species reside free in the host-cell cytosol and exploit host
    metabolites, so effective Indian tick typhus therapy must reach the
    intracellular bacterial compartment.
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining genes
      for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The review supports the free cytosolic niche for pathogenic Rickettsia
      species, including the R. conorii complex.
  downstream:
  - target: Rickettsial Ribosomal Translation
    causal_link_type: DIRECT
    description: Intracytosolic R. conorii remains dependent on bacterial protein synthesis.


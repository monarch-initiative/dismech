diagnosis:
- name: Rickettsial PCR and gene sequencing
  description: >-
    PCR amplification and sequencing of rickettsial genes can confirm acute
    ITTR infection and match the pathogen sequence between patient material and
    the attached tick.
  diagnosis_term:
    preferred_term: polymerase chain reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: Positive rickettsial PCR with sequence identity to ITTR confirms infection.
  evidence:
  - reference: PMID:41650674
    reference_title: >-
      Identification of Rickettsia conorii Indian tick typhus strain in a
      Patient and an Attached Rhipicephalus turanicus Tick in Xinjiang, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCR and sequencing of multiple rickettsial genes confirmed the presence
      of ITTR in both the patient and the tick.
    explanation: >-
      PCR followed by sequencing confirmed ITTR in an acutely infected patient.

- name: Indirect immunofluorescence assay serology
  description: >-
    Indirect immunofluorescence can support spotted-fever-group rickettsiosis
    serodiagnosis, but serology may be retrospective because early false
    negatives occur before delayed seroconversion.
  results: >-
    IgG or IgM seroreactivity, especially seroconversion or a rising titer,
    supports recent spotted-fever-group rickettsial infection.
  evidence:
  - reference: PMID:42390463
    reference_title: >-
      Diagnostic challenges in re-emerging rickettsioses: why current tools
      fall short.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the Weil-Felix test lacks necessary specificity, while the gold standard
      indirect immunofluorescence assay (IFA) is primarily retrospective due to
      delayed seroconversion.
    explanation: >-
      The rickettsial diagnostics review identifies IFA as the serologic gold
      standard and explains why acute-phase serology can lag behind illness.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line empiric therapy for suspected Indian tick typhus
    and related rickettsial diseases because it blocks rickettsial ribosomal
    translation in the intracellular bacterial compartment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Doxycycline inhibits bacterial protein synthesis through the conserved
      tetracycline-class ribosomal target.
  - target: Intracytosolic Rickettsia conorii Niche
    treatment_effect: BYPASSES
    description: >-
      Doxycycline can reach the R. conorii cytosolic compartment inside host
      cells.
  evidence:
  - reference: PMID:28361787
    reference_title: IAP Guidelines on Rickettsial Diseases in Children.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indian tick typhus and scrub typhus are commonly seen rickettsial
      diseases in India. It is recommended that practicing pediatricians should
      be well conversant with compatible clinical scenario, suggestive
      epidemiological features, differential diagnoses and suggestive laboratory
      features to make diagnosis and avoid over diagnosis of these infections,
      as suggested in these guidelines. Doxycycline is the drug of choice and
      treatment should begin promptly without waiting for confirmatory
      laboratory results.
    explanation: >-
      Indian pediatric rickettsial guidelines identify doxycycline as the drug
      of choice and recommend prompt empiric therapy for diseases that include
      Indian tick typhus.

- name: Azithromycin
  description: >-
    Azithromycin is a macrolide alternative for spotted-fever-group
    rickettsioses when doxycycline cannot be used or is unavailable.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azithromycin
      term:
        id: CHEBI:2955
        label: azithromycin
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation
    treatment_effect: INHIBITS
    description: >-
      Azithromycin targets bacterial ribosomal translation through a macrolide
      mechanism.
  evidence:
  - reference: PMID:34345128
    reference_title: Scrub Typhus and Other Rickettsial Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intravenous doxycycline with a loading dose is the most widely used
      antibiotic in critically ill patients, with azithromycin as a suitable
      alternative.
    explanation: >-
      The rickettsial critical-care review identifies azithromycin as a
      suitable alternative to doxycycline for serious rickettsial infection.

animal_models:
- name: C3H/HeN Rickettsia conorii Malish infection mouse
  species: Mouse
  genotype: Wild-type C3H/HeN
  publication: PMID:7511715
  description: >-
    Intravenous R. conorii Malish 7 infection in C3H/HeN mice produces
    disseminated endothelial infection, illness, and dose-dependent
    vascular-injury outcomes, modeling the endotheliotropic vasculitis shared
    across R. conorii spotted-fever infections.
  modeled_mechanisms:
  - target: Rickettsial Endothelial Infection
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      High-dose infection establishes disseminated endothelial infection and
      vascular-injury-based meningoencephalitis and interstitial pneumonia; the
      low-dose infection produces reversible illness with rickettsial clearance
      and lymphohistiocytic perivasculitis.
    limitations: >-
      The model uses the R. conorii Malish 7 strain associated with
      Mediterranean spotted fever, not R. conorii subsp. indica, so it supports
      the shared endotheliotropic rickettsial mechanism rather than an
      indica-specific virulence program.
    evidence:
    - reference: PMID:7511715
      reference_title: >-
        Rickettsia conorii infection of C3H/HeN mice. A model of
        endothelial-target rickettsiosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice inoculated with a high dose of rickettsiae established
        disseminated endothelial infection on day 1, became ill with
        progressive increase in rickettsiae on day 4, and died with vascular
        injury-based meningoencephalitis and interstitial pneumonia on day 5 or
        6. Mice inoculated with the low rickettsial dose became ill on day 5
        and recovered by day 10.
      explanation: >-
        The dose-stratified C3H/HeN model directly measures the endothelial
        infection and vascular-injury phenotypes central to spotted-fever
        pathogenesis.
  evidence:
  - reference: PMID:7511715
    reference_title: >-
      Rickettsia conorii infection of C3H/HeN mice. A model of
      endothelial-target rickettsiosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This experimental infection provides the best available model for
      rickettsial disease with endothelial infection and injury, immune
      rickettsial clearance, regeneration of endothelium, and repair of the
      vascular lesions.
    explanation: >-
      The authors frame C3H/HeN R. conorii infection as an endothelial-target
      rickettsiosis model.

  description: >-
    An infected Rhipicephalus tick bite introduces R. conorii subsp. indica into
    the dermis, seeding local rickettsial infection that can produce an
    inoculation eschar and then disseminate systemically.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED

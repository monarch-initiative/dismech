- name: Platelet Activation and Microthrombus Formation
  role: consumptive_coagulation
  biological_scale: CELLULAR
  description: >-
    R. conorii endothelial injury is accompanied by TXA2-dependent platelet
    activation and thrombin generation in vivo, providing a consumptive route to
    thrombocytopenia and focal rickettsial microthrombi.
  cell_types:
  - preferred_term: platelet

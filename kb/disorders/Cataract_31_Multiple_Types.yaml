      evidence_source: IN_VITRO
      snippet: "Interestingly, a CHMP4B mutation associated with autosomal dominant posterior polar cataract abolishes the ability of CHMP4B to localize to micronuclei."
      explanation: >-
        The construct tested carried D129V (the methods name it); the paper's
        quantification shows colocalization fell from 84.9% to 43.3% of
        transfected cells rather than to zero.
- name: Impaired ESCRT-III Membrane Scission
  biological_scale: CELLULAR
  description: >-
    Overexpressed truncated D129V-CHMP4B mislocalizes and inhibits release of
    virus-like particles, an ESCRT-III-dependent membrane scission event, more
    strongly than wild type. This was shown in non-lens cultured cells; ESCRT-III
    scission has not been measured in human or mouse lens cells carrying a
    CHMP4B variant.
  biological_processes:
  - preferred_term: viral budding via host ESCRT complex
    term:
      id: GO:0039702
      label: viral budding via host ESCRT complex
    modifier: DECREASED
  - preferred_term: membrane fission
    term:
      id: GO:0090148
      label: membrane fission
    modifier: DECREASED
  evidence:
  - reference: PMID:17701905
    reference_title: "CHMP4B, a novel gene for autosomal dominant cataracts linked to chromosome 20q."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection studies of cultured cells revealed that a truncated form of recombinant D129V-CHMP4B had a different subcellular distribution than wild type and an increased capacity to inhibit release of virus-like particles from the cell surface, consistent with deleterious gain-of-function effects."
    explanation: Virus-like-particle release is the ESCRT-III scission readout used.
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "First, a truncated form of recombinant CHMP4B harboring the p.D129V substitution (D129V-CHMP4B1–150) displayed a different sub-cellular localization pattern to wild-type (CHMP4B1–150) and a reduced (~ 50%) capacity to release virus-like-particles (HIV-1 Gag polyprotein, Pr55) from the cell surface - consistent with deleterious effects on the endosome-lysosome pathway (Shiels et al., 2007)."
    explanation: Restates the size of the scission defect reported in the original study.
  downstream:
  - target: Impaired Lens Fiber Cell Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - escrt_iii_dominant_interference
    evidence:
    - reference: PMID:31404815
      reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these mouse data suggest that (1) heterozygous, germ-line mutations in Chmp4b may not manifest as cataract, (2) homozygous, germ-line mutations in Chmp4b are embryonic lethal, and (3) conditional loss of Chmp4b results in arrest of lens growth and differentiation."
      explanation: >-
        Lens-specific loss of CHMP4B arrests fiber cell differentiation. This is
        a loss-of-function model, so it shows CHMP4B is required for the
        process, not that a dominant human allele disrupts it.
      directness: INDIRECT
- name: Defective CHMP4B Association with Extranuclear Chromatin
  biological_scale: CELLULAR
  description: >-
    Wild-type CHMP4B localizes to chromosome bridges and micronuclei, which are
    flanked by lysosomal and autophagic markers, including in a human lens
    epithelial cell line. Full-length D129V-CHMP4B colocalizes with these
    structures in fewer transfected HeLa cells than wild type. The proposed
    consequence, impaired autophagolysosomal clearance of extranuclear chromatin
    during lens fiber differentiation, has not been tested in lens tissue.
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  evidence:
  - reference: PMID:24741567
    reference_title: "Association of CHMP4B and autophagy with micronuclei: implications for cataract formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that CHMP4B mutant protein found in cataract has a defective association with chromatin."
    explanation: Mutant CHMP4B associates less with chromatin bridges and micronuclei.
  - reference: PMID:24741567
    reference_title: "Association of CHMP4B and autophagy with micronuclei: implications for cataract formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that CHMP4B indeed localizes to micronuclei as well as to intercellular bridges in lens cells (Figures 4(c) and 4(d))."
    explanation: The localization is also seen in the HLE B-3 human lens epithelial cell line.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - extranuclear_chromatin_clearance
    evidence:
    - reference: PMID:24741567
      reference_title: "Association of CHMP4B and autophagy with micronuclei: implications for cataract formation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We propose that CHMP4B, through its association with chromatin, may participate in the autophagolysosomal degradation of micronuclei and other extranuclear chromatin. This may have implications for DNA degradation during lens cell differentiation, thus potentially protecting lens cells from cataract development."
      explanation: The authors' proposed link to cataract, stated as a hypothesis.
      directness: INDIRECT
- name: Impaired Lens Fiber Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    Lens-specific Chmp4b knockdown in mice disturbs fiber cell organization at
    birth, with large vesicle-like structures, fiber cell degeneration, lens
    cell death and, in severe cases, lens ablation. Heterozygous loss does not
    cause cataract in mice, so the relevance of this node to the dominant human
    disease rests on the assumption that the human alleles reduce or interfere
    with CHMP4B function in fiber cells.
  cell_types:
  - preferred_term: lens fiber cell

animal_models:
- name: Chmp4b D129V knock-in mouse
  species: Mouse
  genotype: Chmp4b p.D129V (c.386A>T) knock-in, heterozygous and homozygous, C57BL/6J background
  publication: PMID:31404815
  description: >-
    Heterozygous mice are viable, fertile and have clear lenses to one year;
    homozygous embryos die by E15.5 with abnormal eye and brain histology and
    global cell death.
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Heterozygous knock-in lenses stay clear, unlike human heterozygotes.
    limitations: >-
      The mutant allele was expressed at lower levels than wild type on the
      B6J background, and the spheroidal mouse lens differs from the human
      lens; cataract was not tested on other backgrounds.
    evidence:
    - reference: PMID:31404815
      reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "No obvious differences in lens transparency between Chmp4b-D/V mutant and wild-type littermates were observed through one year of age (data not shown)."
      explanation: Heterozygous D129V does not cause cataract in mice.
    - reference: PMID:31404815
      reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, cataract was non-penetrant in heterozygous Chmp4b-D/V mutant lenses consistent with reduced expression levels of mutant (V) versus wild-type (D) Chmp4b alleles on the B6J genetic background (Fig. 4)."
      explanation: Authors' explanation of the failure to recapitulate.
- name: Lens-specific Chmp4b conditional knockdown mouse
  species: Mouse
  genotype: Chmp4b floxed (exons 2-4) with lens-specific MLR10-Cre
  publication: PMID:31404815
  modeled_mechanisms:
  - target: Impaired Lens Fiber Cell Differentiation
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    description: Conditional loss of CHMP4B in the lens arrests lens growth and fiber cell differentiation.
    limitations: >-
      A loss-of-function model with mosaic, variable deletion; it produces lens
      dysmorphology and ablation rather than the focal posterior opacity of the
      human disease, and heterozygous loss caused no cataract.
    evidence:
    - reference: PMID:31404815
      reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Chmp4b-CKD mice displayed variable degrees of lens dysmorphology including lens ablation."
      explanation: Lens phenotype of conditional loss.
discussions:
- discussion_id: chmp4b_heterozygous_mouse_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does heterozygous CHMP4B D129V cause childhood cataract in humans but
    leave mouse lenses clear for at least a year?
  attaches_to:
  - pathophysiology#Lens Light Scattering and Loss of Transparency
  - pathophysiology#Impaired ESCRT-III Membrane Scission
  rationale: >-
    The only allele modelled in vivo does not reproduce the dominant human
    phenotype, and the mouse lens phenotypes that do occur come from loss of
    CHMP4B. Without a penetrant heterozygous model, the dominant mechanism
    (gain of function, dominant interference or haploinsufficiency) cannot be
    distinguished. The authors point to low mutant allele expression on B6J,
    genetic background and lens shape.
  evidence:
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Factors that may influence cataract penetrance in mice versus humans include genetic background of the mouse strain and morphological differences between the spheroidal mouse lens versus the ellipsoidal (biconvex) human lens."
    explanation: Candidate explanations for the mismatch.

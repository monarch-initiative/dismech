name: Cataract 31 Multiple Types
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
synonyms:
- CTRCT31
- CHMP4B-related cataract
- CHMP4B early-onset non-syndromic cataract
- early-onset non-syndromic cataract caused by mutation in CHMP4B
- posterior polar cataract 3
- CPP3
description: >-
  Non-syndromic early-onset cataract caused by heterozygous missense variants in
  CHMP4B, which encodes charged multivesicular body protein 4B, a core subunit of
  the ESCRT-III membrane remodeling and scission machinery. It is inherited as an
  autosomal dominant trait. The founding families had progressive childhood
  posterior subcapsular cataract (p.D129V, a white family) and progressive,
  disc-shaped posterior polar cataract (p.E161K, a four-generation Japanese family
  first mapped as CPP3 to 20p12-q12). Later single families carry p.H57R
  (posterior subcapsular), p.S196C (bilateral anterior subcapsular) and p.E161Q
  (congenital cataract), which is why the disease is labelled "multiple types".
  Truncated D129V protein inhibits release of virus-like particles in transfected
  cells and full-length D129V associates less with chromatin bridges and
  micronuclei, but how a dominant CHMP4B variant opacifies the lens is not
  established; heterozygous D129V knock-in mice have clear lenses.

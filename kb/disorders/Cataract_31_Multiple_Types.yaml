- name: Other autosomal dominant posterior polar cataracts
  description: >-
    Autosomal dominant posterior polar cataract is genetically heterogeneous;
    loci at 1p36 and 16q22 were excluded in the CHMP4B Japanese family before
    its locus was mapped, so molecular testing is needed to assign the gene.
  evidence:
  - reference: PMID:10682967
    reference_title: "Genetically distinct autosomal dominant posterior polar cataract in a four-generation Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study confirms the genetic heterogeneity of autosomal dominant posterior polar cataracts and demonstrates that the posterior polar cataract in this Japanese family is phenotypically and genetically distinct from previously mapped cataracts."
    explanation: Other posterior polar cataract loci are distinct from CHMP4B.
notes: >-
  No GeneReviews chapter covers CHMP4B cataract. The CPP3 locus (posterior polar
  cataract 3, 20p12-q12) was mapped in the Japanese family later found to carry
  E161K; BFSP1 was sequenced there without a mutation. HSP90-beta silencing
  upregulates CHMP4B in lens epithelial cells in studies of age-related cataract
  (PMID:37487085); that work concerns CHMP4B dosage in aging, not the inherited
  missense alleles, and is not wired into this entry.

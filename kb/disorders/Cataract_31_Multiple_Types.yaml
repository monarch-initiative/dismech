    snippet: "These data provide the first evidence that CHMP4B, which encodes a key component of the endosome sorting complex required for the transport-III (ESCRT-III) system of mammalian cells, plays a vital role in the maintenance of lens transparency."
    explanation: Gene discovery in two dominant families.
  variants:
  - name: D129V (c.386A>T)
    description: Founding allele in a white family with progressive childhood posterior subcapsular cataract.

    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Previously, only three missense mutations in CHMP4B (p. H57R, p. D129V, p. E161K) were found to be associated with posterior subcapsular or posterior polar cataracts (35, 36)."
    explanation: Only three CHMP4B cataract variants had been reported before the S196C family.
pathophysiology:
- name: CHMP4B Heterozygous Missense Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    A heterozygous missense substitution alters a conserved residue of the
    ESCRT-III subunit CHMP4B (D129V, E161K, H57R and S196C lie in the SNF7
    domain). CHMP4 proteins polymerize into spiral filaments that bend membranes
    away from the cytoplasm before scission. Chmp4b is expressed in lens
    epithelial cells and elongating fiber cells at the lens equator. Homozygous
    D129V knock-in mouse embryos survive longer than null embryos, suggesting the
    V allele retains some function; transfection data were read as a deleterious
    gain of function. Whether human alleles act by dominant interference,
    gain of function or partial loss is not settled.
  genes:
  - preferred_term: CHMP4B
    term:
      id: hgnc:16171
      label: CHMP4B
  molecular_functions:
  - preferred_term: ESCRT-III membrane bending activity
    term:
      id: GO:0180020
      label: membrane bending activity
    modifier: ABNORMAL
  cell_types:
  - preferred_term: lens epithelial cell
    term:
      id: CL:0002224
      label: lens epithelial cell
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:17701905
    reference_title: "CHMP4B, a novel gene for autosomal dominant cataracts linked to chromosome 20q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation profiling of positional-candidate genes detected a heterozygous transversion (c.386A-->T) in exon 3 of the gene for chromatin modifying protein-4B (CHMP4B) that was predicted to result in the nonconservative substitution of a valine residue for a phylogenetically conserved aspartic acid residue at codon 129 (p.D129V)."
    explanation: Founding heterozygous missense variant at a conserved residue.
  - reference: PMID:30078984
    reference_title: "Mutation profiles of congenital cataract genes in 21 northern Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The p.H57R mutation and the other two reported mutations were all located in the SNF7 domain of the CHMP4B gene."
    explanation: The reported alleles cluster in the SNF7 (ESCRT-III) domain.
  - reference: PMID:34722561
    reference_title: "Broadening the Mutation Spectrum in GJA8 and CHMP4B: Novel Missense Variants and the Associated Phenotypes in Six Chinese Han Congenital Cataracts Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All four mutations were in the SNF7 domain of the CHMP4B gene."
    explanation: H57R, D129V, E161K and S196C all lie in the SNF7 domain.
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In situ hybridization localized Chmp4b transcripts to lens epithelial cells and elongating fiber cells at the lens equator."
    explanation: Mouse expression localizes the gene to the lens cell types annotated on this node.
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "CHMP4 homologs (e.g., Snf7 in S. cerevisiae, Vps32 in C. elegans) constitute the most abundant ESCRT-III core components and ultrastructural studies reveal that they can polymerize into dynamic spiral filaments to facilitate projection of the plasma membrane away from the cytoplasm (negative membrane curvature) forming vesicles with narrow membrane neck-like structures that are subsequently severed"
    explanation: Background statement of the CHMP4 membrane-bending activity annotated on this node.
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The apparent extended longevity of Chmp4b-V/V mutant embryos over Chmp4b-null embryos suggested that the Chmp4b-V mutant allele retained some functionality compared with the Chmp4b-null allele."
    explanation: The D129V allele is not a null allele in mice.
  downstream:
  - target: Impaired ESCRT-III Membrane Scission
    causal_link_type: DIRECT
    hypothesis_groups:
    - escrt_iii_dominant_interference
    evidence:
    - reference: PMID:17701905
      reference_title: "CHMP4B, a novel gene for autosomal dominant cataracts linked to chromosome 20q."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transfection studies of cultured cells revealed that a truncated form of recombinant D129V-CHMP4B had a different subcellular distribution than wild type and an increased capacity to inhibit release of virus-like particles from the cell surface, consistent with deleterious gain-of-function effects."
      explanation: D129V protein inhibits ESCRT-III-dependent budding in transfected cells.
      directness: INDIRECT
  - target: Defective CHMP4B Association with Extranuclear Chromatin
    causal_link_type: DIRECT
    hypothesis_groups:
    - extranuclear_chromatin_clearance
    evidence:

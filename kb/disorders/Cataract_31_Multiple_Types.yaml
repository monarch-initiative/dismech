inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous CHMP4B missense variants cosegregate with cataract in a white
    family (D129V) and through four generations of a Japanese family (E161K). The
    D129V family showed variable age at diagnosis and evidence of incomplete
    penetrance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:17701905
    reference_title: "CHMP4B, a novel gene for autosomal dominant cataracts linked to chromosome 20q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Here we report linkage of autosomal dominant "progressive childhood posterior subcapsular" cataracts segregating in a white family'
    explanation: Dominant segregation in the D129V founding family.
  - reference: PMID:10682967
    reference_title: "Genetically distinct autosomal dominant posterior polar cataract in a four-generation Japanese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The posterior polar cataract was transmitted in an autosomal dominant manner through four generations."
    explanation: Japanese family later shown to carry CHMP4B E161K (PMID:17701905).
  - reference: PMID:31404815
    reference_title: "A charged multivesicular body protein (CHMP4B) is required for lens growth and differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "We note that posterior-polar cataract associated with the heterozygous p.D129V mutation in CHMP4B exhibited a variable age-at-diagnosis (4 −20 years) and age-at-surgery (4 – 40 years) with evidence of incomplete penetrance (Shiels et al., 2007)."
    explanation: >-
      Discussion of a mouse paper restating the human D129V family's variable
      onset and incomplete penetrance from the original report.
prevalence:

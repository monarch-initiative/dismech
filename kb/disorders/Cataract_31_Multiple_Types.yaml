mechanistic_hypotheses:
- hypothesis_group_id: escrt_iii_dominant_interference
  hypothesis_label: Dominant interference with ESCRT-III function in lens fiber cells
  status: EMERGING
  description: >-
    The mutant subunit inhibits ESCRT-III membrane scission in a dominant
    manner, and reduced ESCRT-III function in differentiating fiber cells
    disturbs fiber cell differentiation and lens transparency. Supported by
    overexpression data in non-lens cells and by a lens loss-of-function mouse;
    heterozygous D129V knock-in mice do not develop cataract.
  evidence:
  - reference: PMID:17701905
    reference_title: "CHMP4B, a novel gene for autosomal dominant cataracts linked to chromosome 20q."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection studies of cultured cells revealed that a truncated form of recombinant D129V-CHMP4B had a different subcellular distribution than wild type and an increased capacity to inhibit release of virus-like particles from the cell surface, consistent with deleterious gain-of-function effects."
    explanation: Basis for the dominant gain-of-function reading.
- hypothesis_group_id: extranuclear_chromatin_clearance
  hypothesis_label: Failed clearance of extranuclear chromatin during fiber differentiation
  status: EMERGING
  description: >-
    CHMP4B targets micronuclei and other extranuclear chromatin for
    autophagolysosomal degradation, and the cataract mutant does this less well,
    leaving undegraded chromatin in differentiating fiber cells. Proposed from
    cell-line data only.
  evidence:
  - reference: PMID:24741567
    reference_title: "Association of CHMP4B and autophagy with micronuclei: implications for cataract formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This raises the possibility that impaired autophagolysosomal degradation of extranuclear chromatin could explain cataract formation in the absence of proper CHMP4B function."
    explanation: The hypothesis as stated by its authors.

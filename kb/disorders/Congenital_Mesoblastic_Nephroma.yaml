differential_diagnoses:
- name: Congenital fibrosarcoma
  description: >-
    Not a differential so much as the same disease in another site. Three
    independent lines of evidence place cellular congenital mesoblastic
    nephroma and congenital (infantile) fibrosarcoma as one neoplasm: they
    share the ETV6::NTRK3 fusion, they share the BRAF rearrangement class, and
    immunophenotyping finds no urogenital or stem-cell marker expression in the
    renal tumour. The practical consequence is that a renal spindle-cell tumour
    of infancy and a soft-tissue one should be read against the same molecular
    panel.
  disease_term:
    preferred_term: congenital fibrosarcoma
    term:
      id: MONDO:0004557
      label: congenital fibrosarcoma
  evidence:
  - reference: PMID:9823307
    reference_title: "ETV6-NTRK3 gene fusions and trisomy 11 establish a histogenetic link between mesoblastic nephroma and congenital fibrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Our studies indicate that classical and cellular CMN have different genetic features and support the concept that cellular CMN is histogenetically related to CFS.
    explanation: >-
      States both halves at once: the two subtypes are genetically different
      from each other, and the cellular one belongs with congenital
      fibrosarcoma.
  - reference: PMID:9811336
    reference_title: "Congenital mesoblastic nephroma t(12;15) is associated with ETV6-NTRK3 gene fusion: cytogenetic and molecular relationship to congenital (infantile) fibrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: CMN and CFS are pathogenetically related, and it is likely that they represent a single neoplastic entity, arising in either renal or soft tissue locations.
    explanation: >-
      The single-entity claim stated explicitly, with the site difference named
      as the only distinction.
  - reference: PMID:27020209
    reference_title: "Congenital mesoblastic nephroma: a study of 19 cases using immunohistochemistry and ETV6-NTRK3 fusion gene rearrangement."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: The absence of expression of stem cell markers and markers involved in urogenital development suggests that MN is not a nephroma and most likely represents a soft tissue tumour
    explanation: >-
      Immunophenotyping supports the same conclusion from a different
      direction: the tumour does not express what a renal developmental
      neoplasm would. Indirect because it argues from absent markers to
      histogenesis.
treatments:
- name: Complete nephrectomy
  description: >-
    Complete nephrectomy is the standard treatment and is usually sufficient on
    its own. Chemotherapy is not routine; the minority who receive it are those
    with incomplete resection, aggressive cellular histology or metastatic
    disease.
  treatment_term:
    preferred_term: complete nephrectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:42189790
    reference_title: "Characteristics and outcome of congenital mesoblastic nephroma: A report of 376 patients registered in the SIOP 93-01, SIOP WT 2001, UK-IMPORT, and AIEOP protocols."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Complete nephrectomy only is the gold standard treatment.
    explanation: >-
      States the standard of care directly, and the word "only" is the
      load-bearing part: surgery alone, rather than surgery plus adjuvant
      therapy.
progression:
- phase: Subtype divergence in relapse-free survival
  notes: >-
    Overall survival is high across all three subtypes, and the subtypes diverge
    in relapse rather than in death. In the SIOP/GPOH cohort five-year
    relapse-free survival was 98% for classic, 89% for cellular and 80% for
    mixed tumours, while five-year overall survival was 98%, 93% and 96%. The
    gap between the two measures is the clinically important part: relapse is
    subtype-dependent and salvageable, so a worse relapse-free survival does not
    translate into a proportionally worse overall survival.
  evidence:
  - reference: PMID:29286563
    reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Five-year RFS was significantly inferior for cellular and mixed MN compared to classic MN (89%, 80%, and 98%), whereas 5-year OS was similar (93%, 96%, and 98%).
    explanation: >-
      Reports both measures for all three subtypes in one cohort, which is what
      allows the divergence between relapse and survival to be stated rather
      than inferred.
notes: >-
  This disease has no germline causal gene and no OMIM phenotype entry. Every
  gene recorded here is a somatic driver, so each genetic record carries
  variant_origin SOMATIC and none is typed CAUSATIVE. Gene-disease validity is
  absent throughout: ClinGen classifies none of these pairs, and a tier is
  copied from a source rather than assigned.

  The three driver classes segregate by subtype rather than co-occurring, which
  is why they are modelled as separate upstream lesions converging on one
  activation node instead of as a single multi-gene node.

  The genome is otherwise quiet. That is part of why the tumour behaves as a
  developmental lesion cured by resection rather than as a progressively
  evolving cancer, and it is why the secondary polysomies are modelled
  downstream of the initiating fusion rather than as cooperating lesions.
review_notes: >-
  Two omissions are deliberate and both sit next to content fence (a) of the
  curating project, which excludes drugs that inhibit ALK. First, the rare
  EML4::ALK fusion variant reported in this disease is not recorded, even
  though ALK-fusion content is fenced only for the histiocytosis rows, because
  it is the one driver whose treatment implication falls squarely inside the
  fence. Second, no targeted-therapy treatment row is included: entrectinib is
  excluded by the fence, and while larotrectinib is TRK-selective and does not
  inhibit ALK, the case literature on it was not fetched or verified in this
  pass, so it is left for a pass that can cite it rather than asserted here. A
  later pass should add the TRK-inhibitor evidence and, if the fence is lifted,
  the EML4::ALK variant.

      label: ETV6
  - preferred_term: NTRK3
    term:
      id: hgnc:8033
      label: NTRK3
  evidence:
  - reference: PMID:29286563
    reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: All classical and mixed MN were translocation negative. Seventeen out of 29 (58%) cellular MN harbored the ETV6-NTRK3 translocation.
    explanation: >-
      Confines the translocation to the cellular subtype in this cohort and
      gives the proportion within it, which is the basis for binding the fusion
      genes to this row and not to the others.
  - reference: PMID:29286563
    reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Within the group of cellular MN, patients having translocation-positive tumors had a significantly superior RFS (5-year RFS: 100% vs. 73%)."
    explanation: >-
      The fusion is prognostically favourable within the cellular subtype, which
      is the opposite of the usual reading of a driver fusion and is why the row
      states it explicitly.
- name: Mixed
  display_name: Mixed congenital mesoblastic nephroma
  classification: histologic
  subtype_term:
    preferred_term: Mixed Congenital Mesoblastic Nephroma
    term:
      id: NCIT:C97058
      label: Mixed Congenital Mesoblastic Nephroma
  description: >-
    Tumours with both classic and cellular areas. Its molecular assignment is
    where the published series disagree, and the entry does not resolve the
    disagreement.
  evidence:
  - reference: PMID:29286563
    reference_title: "ETV6-NTRK3 in congenital mesoblastic nephroma: A report of the SIOP/GPOH nephroblastoma study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: All classical and mixed MN were translocation negative. Seventeen out of 29 (58%) cellular MN harbored the ETV6-NTRK3 translocation.
    explanation: >-
      In this cohort every mixed tumour was translocation negative, which is one
      of the two positions the literature takes on mixed tumours; the other is
      recorded as a REFUTE item on this row.
  - reference: PMID:9823307
    reference_title: "ETV6-NTRK3 gene fusions and trisomy 11 establish a histogenetic link between mesoblastic nephroma and congenital fibrosarcoma."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: we found trisomy 11 only in cellular or mixed CMNs with the ETV6-NTRK3 gene fusion
    explanation: >-
      This series reports fusion-positive mixed tumours, which contradicts the
      cohort above rather than qualifying it. The two are kept as separate
      items, a SUPPORT and a REFUTE, because averaging them would invent a
      consensus that does not exist.
  review_notes: >-
    The two series cited on this row disagree about whether mixed tumours carry
    the ETV6::NTRK3 fusion. The SIOP/GPOH cohort of 111 patients found all mixed
    tumours translocation negative; the Knezevich series reports fusion-positive
    mixed tumours. Neither is reinterpreted here and no pooled figure is given.
    A plausible reason for the discrepancy is sampling: a mixed tumour is
    defined by containing both patterns, so whether a fusion is detected depends
    on which area is assayed, and the series differ in method. That is a
    hypothesis about the disagreement, not a resolution of it, and it is
    recorded here rather than in the row description so that no reader takes it
    for a finding.
pathophysiology:
- name: Somatic Kinase Lesion in a Renal Mesenchymal Progenitor
  description: >-
    The initiating event is an acquired kinase lesion in a renal or perirenal
    mesenchymal progenitor, arising in utero. Three lesion classes are
    established, and they segregate by subtype rather than co-occurring: the
    EGFR kinase-domain internal tandem duplication, the ETV6::NTRK3 fusion, and
    rarer intragenic BRAF rearrangement.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: renal mesenchymal progenitor cell
    term:
      id: CL:0008019
      label: mesenchymal cell
  molecular_functions:
  - preferred_term: protein kinase activity
    term:
      id: GO:0004672
      label: protein kinase activity
    modifier: GAIN_OF_FUNCTION
  genes:
  - preferred_term: EGFR
    term:
      id: hgnc:3236
      label: EGFR
  - preferred_term: NTRK3
    term:
      id: hgnc:8033
      label: NTRK3
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  notes: >-
    The cell of origin is bound only to mesenchymal cell. None of the sources
    cited here names the compartment the lesion arises in, so the narrower CL
    terms that would say it - metanephric mesenchyme stem cell, nephron
    progenitor - would assert a nephrogenic-blastema origin this entry has no
    source for; the renal localisation is carried in the preferred term
    instead. The molecular function is bound at protein kinase activity rather
    than at receptor tyrosine kinase activity because the node covers all three
    lesion classes, and BRAF is a serine/threonine kinase, so the tyrosine-kinase
    term would be false of one of the three.
  evidence:
  - reference: PMID:29915264
    reference_title: Recurrent intragenic rearrangements of EGFR and BRAF in soft tissue tumors of infants.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A key finding is recurrent mutation of EGFR in CMN by internal tandem duplication of the kinase domain, thus delineating CMN from other childhood renal tumors.
    explanation: >-
      Whole-genome and transcriptome sequencing of fusion-negative tumours
      identified the EGFR kinase-domain duplication as the recurrent lesion, and
      states that it distinguishes this disease from other childhood renal
      tumours, which is why it anchors this node.
  - reference: PMID:29915264
    reference_title: Recurrent intragenic rearrangements of EGFR and BRAF in soft tissue tumors of infants.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: we identify BRAF intragenic rearrangements in CMN and IFS
    explanation: >-
      Establishes the third lesion class, and does so in both this disease and
      infantile fibrosarcoma together, which is part of the evidence that the
      two are one entity.
  downstream:
  - target: Constitutive Ligand-Independent Kinase Activation
    description: Each lesion class removes the normal requirement for ligand binding
    evidence:
    - reference: PMID:9462753
      reference_title: A novel ETV6-NTRK3 gene fusion in congenital fibrosarcoma.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: we show that the rearrangement fuses the ETV6 (also known as TEL) gene from 12p13 with the 15q25 NTRK3 neurotrophin-3 receptor gene (also known as TRKC)
      explanation: >-
        Cloning the breakpoints shows the fusion places the NTRK3 receptor
        tyrosine kinase domain under the control of an ETV6 partner. Indirect
        for this edge: it establishes the structure of the fusion, from which
        ligand-independent activation follows, rather than measuring kinase
        activity directly.
- name: Constitutive Ligand-Independent Kinase Activation
  description: >-
    The duplicated EGFR kinase domain, and the fusion-bound NTRK3 kinase domain,
    signal without ligand. This is the point at which the three lesion classes
    converge on one mechanism, which is why the entry models them as separate
    upstream lesions feeding a shared node.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: transmembrane receptor protein tyrosine kinase activity
    term:
      id: GO:0004714
      label: transmembrane receptor protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:29915264
    reference_title: Recurrent intragenic rearrangements of EGFR and BRAF in soft tissue tumors of infants.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A key finding is recurrent mutation of EGFR in CMN by internal tandem duplication of the kinase domain, thus delineating CMN from other childhood renal tumors.
    explanation: >-
      The lesion is a duplication of the kinase domain specifically, not of the
      ligand-binding region, which is the structural basis for the activation
      this node asserts. Indirect because the paper reports the lesion rather
      than an activity measurement.
  downstream:
  - target: Myofibroblastic Spindle-Cell Proliferation
    description: Sustained kinase signalling drives the proliferation that forms the tumour
    evidence:
    - reference: PMID:42189790
      reference_title: "Characteristics and outcome of congenital mesoblastic nephroma: A report of 376 patients registered in the SIOP 93-01, SIOP WT 2001, UK-IMPORT, and AIEOP protocols."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: Congenital mesoblastic nephroma (CMN) is the most common renal neoplasm diagnosed in the very first months of life.
      explanation: >-
        Supports the existence, site and timing of the resulting tumour mass.
        Indirect for the causal step: the cohort describes the tumour rather
        than demonstrating that kinase signalling produces the proliferation,
        which no human study has done directly.
- name: Myofibroblastic Spindle-Cell Proliferation
  description: >-
    A spindle-cell myofibroblastic proliferation replacing and expanding the
    renal parenchyma. It is locally expansile; in the cellular subtype it
    acquires the capacity to metastasise.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:28856451
    reference_title: "Recurrent and metastatic congenital mesoblastic nephroma: where does the evidence stand?"
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Fifty years ago, Bolande described Congenital Mesoblastic Nephroma (CMN) as a benign lesion. Unexpected aggressive clinical behaviors prompted a sub-classification based on histology.
    explanation: >-
      States that the proliferation was first taken to be benign and that
      observed aggressive behaviour is what forced the histological
      subclassification, which is why this node is shared across subtypes while
      the capacity to metastasise is not.
- name: Secondary Chromosomal Polysomy
  description: >-
    Trisomy 11 and polysomies of other chromosomes are acquired after the
    initiating fusion, not before it. They are clonal-progression events rather
    than predispositions, and the ordering is established rather than assumed.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:9811336
    reference_title: "Congenital mesoblastic nephroma t(12;15) is associated with ETV6-NTRK3 gene fusion: cytogenetic and molecular relationship to congenital (infantile) fibrosarcoma."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings demonstrate that t(12;15) translocation, and the associated ETV6-NTRK3 fusion, can antedate acquisition of chromosome polysomies in CMN and CFS.
    explanation: >-
      Establishes the temporal order directly: the fusion precedes the
      polysomies, which is what makes this a downstream node rather than an
      alternative initiating lesion.

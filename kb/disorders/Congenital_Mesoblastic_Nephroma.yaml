name: Congenital Mesoblastic Nephroma
creation_date: '2026-11-11T15:12:00Z'
description: >-
  The most common renal neoplasm of the first months of life: a mesenchymal,
  myofibroblastic tumour of the kidney and perirenal tissue, present at or
  before birth. It has no germline causal gene. Its drivers are acquired kinase
  lesions that segregate by histological subtype — an internal tandem
  duplication of the EGFR kinase domain in classic tumours, and the
  ETV6::NTRK3 fusion of t(12;15) in most cellular tumours — and the genome is
  otherwise quiet, so it behaves as a developmental lesion rather than a
  progressively evolving cancer. Complete nephrectomy is the standard
  treatment and is usually curative. The entity is not biologically a
  nephroma: the cellular subtype is the renal presentation of congenital
  fibrosarcoma, and the two are regarded as one neoplasm arising in either
  site.
categories:
- Renal Neoplasm
- Pediatric Solid Tumor
- Infantile Tumor
- Mesenchymal Tumor
parents:
- kidney neoplasm

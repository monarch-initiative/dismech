    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Sixty-seven tumors were classical MN (51%), 29 cellular MN (31%), and 15 were mixed MN (18%).
    explanation: >-

- name: Retina-Restricted IMPDH1 Isoform Dependence
  description: >-
    Although IMPDH1 is ubiquitously expressed, the retina uniquely depends on it: IMPDH1 is
    higher in retina than any other tissue, is concentrated in photoreceptor inner segments
    and synaptic terminals, and is expressed there as retina-exclusive splice and
    translation-start isoforms (IMPDH1(546), IMPDH1(595)) that encode distinct proteins with
    altered regulation. In mouse retina IMPDH1 generates the bulk of photoreceptor GTP, so a
    housekeeping enzyme is non-redundant in this one tissue. This dependence is why
    CBS-domain variants damage photoreceptors specifically.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: modulator
  cell_types:

genetic:
- name: IMPDH1
  gene_term:
    preferred_term: IMPDH1
    term:
      id: hgnc:6052
      label: IMPDH1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Causative
  features: >-
    Causative alleles are overwhelmingly heterozygous missense changes, with a minority of
    in-frame indels, clustered in exons 8-10 in or downstream of the CBS (Bateman) domain.
    The recurrent p.Asp226Asn is the most common allele. Truncating variants and missense
    variants outside exons 8-10 are now interpreted as mostly non-causal, corroborated by
    gnomAD showing IMPDH1 loss-of-function is tolerated (pLI approximately 0); a processed
    IMPDH1 pseudogene carries the D226N-producing nucleotide change, which can confound
    short-read alignment at this locus.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_04d85991-25a4-4da6-8090-65b8cfb771cd-2024-02-01T170000.000Z

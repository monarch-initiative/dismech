inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    IMPDH1-related retinopathy is autosomal dominant. Pathogenic missense alleles
    co-segregate with disease in multigenerational families, and de novo variants
    occur, particularly at the LCA end. Penetrance appears high or complete but has
    not been formally characterized for IMPDH1; expressivity is markedly variable,
    with up to 100-fold variation in electroretinogram amplitude at matched age among
    carriers of the identical p.Asp226Asn allele.
  evidence:
  - reference: PMID:11875050
    reference_title: "Mutations in the inosine monophosphate dehydrogenase 1 gene (IMPDH1) cause the RP10 form of autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The identical mutation was also found in a British RP10 family."
    explanation: Co-segregation of the recurrent IMPDH1 allele across dominant RP10 families.
  - reference: PMID:15851576
    reference_title: "Screen of the IMPDH1 gene among patients with dominant retinitis pigmentosa and clinical features associated with the most common mutation, Asp226Asn."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "There was approximately a 100-fold variation in ERG amplitudes among patients of similar age with the Asp226Asn mutation."
    explanation: Documents the markedly variable expressivity in dominant IMPDH1 disease.
pathophysiology:
- name: IMPDH1 Missense Variant in the CBS Regulatory Domain
  description: >-
    A heterozygous missense (occasionally in-frame) variant arises in IMPDH1, clustered
    in and immediately downstream of the regulatory CBS (Bateman) domain encoded by exons
    8-10, where the recurrent p.Asp226Asn allele lies. The variant is the initiating
    lesion. Critically, it does not reduce catalytic activity and does not perturb the
    bulk guanine nucleotide pool; its consequences are on allosteric regulation, higher-order
    assembly and a moonlighting nucleic-acid-binding function, with a dominant-negative
    component. Truncating variants and missense variants outside exons 8-10 are mostly not
    disease-causing, and gnomAD shows IMPDH1 loss of function is tolerated, so PVS1 does not
    apply to this gene for this disease.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  gene:
    preferred_term: IMPDH1
    term:
      id: hgnc:6052
      label: IMPDH1
  genetic_context:

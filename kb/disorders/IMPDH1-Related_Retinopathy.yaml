- name: Dominant-Negative Propagation of IMPDH1 Misfolding
  description: >-
    A partly independent branch: the mutant protein misfolds, and in refolding experiments
    with equimolar mixtures of normal and mutant enzyme the activity regained is close to
    the pure-mutant figure, indicating that in hybrid tetramers mutant subunits impose their
    faulty conformation on wild-type partners. This molecular recruitment offers a basis for
    the dominant inheritance. The claim is contested against the finding that the same variants
    have no effect on protein stability or aggregation, so it is curated as one competing
    mechanism rather than a settled one.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:

- name: Impaired Nucleic-Acid Binding and Polyribosome Association
  description: >-
    Independent of catalysis, IMPDH1 binds single-stranded nucleic acids and associates
    with polyribosomes, including those translating rhodopsin mRNA, through the subdomain
    that harbours the disease mutations. Disease variants reduce the affinity and specificity
    of this binding and the most common allele, D226N, disrupts polyribosome association of
    a retinal isoform. Because perturbed rhodopsin expression can trigger photoreceptor
    apoptosis, loss of this moonlighting function is a candidate route to degeneration, though
    the pathogenic consequence is inferred rather than demonstrated.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: single-stranded nucleic acid / mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: DECREASED

    description: >-
      Heterozygous germline missense variant in or downstream of the CBS domain (exons
      8-10). Catalytic activity is preserved; the pathogenic consequence is loss of
      allosteric regulation and of nucleic-acid binding, with evidence that mutant subunits
      impose their conformation on wild-type subunits in hybrid tetramers.

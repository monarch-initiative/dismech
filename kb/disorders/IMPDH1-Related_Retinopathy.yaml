    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "IMPDH1-associated retinopathy presents most frequently in the first decade of life with early macular involvement."
    explanation: Characterizes the RP10 adRP presentation as early-onset with macular involvement.
- name: LCA11
  display_name: Leber Congenital Amaurosis 11 (LCA11)
  description: >-
    The rare severe congenital or infantile end of the spectrum, reported with de novo
    IMPDH1 missense variants (p.Arg105Trp, p.Asn198Lys). The IMPDH1-specific LCA
    evidence is limited to two de novo patients; the broader LCA clinical picture
    should not be attributed to IMPDH1 beyond what those cases document.
  subtype_term:

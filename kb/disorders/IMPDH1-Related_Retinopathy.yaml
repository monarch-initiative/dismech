    causal_link_type: DIRECT
- name: Loss of Allosteric Regulation of IMPDH1
  description: >-
    Disease variants in the CBS (Bateman) domain disrupt allosteric control of the enzyme
    by purine nucleotides. The p.Asp226Asn allele confers resistance to feedback inhibition
    by GDP/GTP, and p.Arg224Pro abolishes ATP binding at the regulatory site. Cryo-EM shows
    the disease mutations split into two functional classes, one that disrupts GTP regulation
    and one that does not, so loss of regulation is variant-specific rather than universal.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  molecular_functions:
  - preferred_term: nucleotide binding at the CBS regulatory domain
    term:
      id: GO:0000166
      label: nucleotide binding
    modifier: DECREASED
  evidence:
  - reference: PMID:35013599
    reference_title: "IMPDH1 retinal variants control filament architecture to tune allosteric regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "we show that IMPDH1 disease mutations fall into two classes: one disrupts GTP regulation and the other has no effect on GTP regulation or filament assembly."
    explanation: Defines the two functional classes of IMPDH1 disease variants by GTP regulation.
  - reference: PMID:23236438
    reference_title: "Different characteristics and nucleotide binding properties of inosine monophosphate dehydrogenase (IMPDH) isoforms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The RP-causing mutation, R224P, abolished ATP binding and nucleotide protection and this correlated with an altered propensity to cluster."
    explanation: Shows a disease variant abolishing ATP binding at the Bateman domain and altering assembly.
  - reference: PMID:37731818
    reference_title: "Effect on cell survival and cytoophidium assembly of the adRP-10-related IMPDH1 missense mutation Asp226Asn."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: "D226N also gives IMPDH1 resistance to feedback inhibition by GDP/GTP."
    explanation: The most common allele loses GDP/GTP feedback inhibition.
  downstream:
  - target: Abnormal IMPDH1 Filament Assembly
    description: Deregulated allostery changes higher-order filament architecture.
    causal_link_type: DIRECT
- name: Abnormal IMPDH1 Filament Assembly
  description: >-
    IMPDH1 assembles into octamers and micron-scale filaments (cytoophidia) whose
    architecture tunes activity. Disease variants form abnormally large, persistent and
    mislocalized filaments rather than dynamic ones; in zebrafish cones the mutant filaments
    sit at synapses and, for D226N, inside nuclei. In cultured cells D226N produces
    cytoophidia in most cells and is not dispersed by guanosine. Whether the abnormal
    filament is itself toxic or a marker of deregulation is not settled.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  cell_types:

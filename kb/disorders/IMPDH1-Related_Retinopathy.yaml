mechanistic_hypotheses:
- hypothesis_group_id: additive_photoreceptor_toxicity_model
  hypothesis_label: Additive multi-branch photoreceptor toxicity
  status: CANONICAL
  description: >-
    The best-supported reading is that no single downstream branch carries the pathology.
    Loss of allosteric regulation, abnormal persistent filaments, impaired nucleic-acid
    binding and a dominant-negative misfolding component may each contribute additively to
    photoreceptor death, as suggested by the partial rescue of a filament-disrupting second
    mutation that did not restore nucleotide regulation. The final step from molecular defect
    to cell death is not closed.
  evidence:
  - reference: PMID:37731818
    reference_title: "Effect on cell survival and cytoophidium assembly of the adRP-10-related IMPDH1 missense mutation Asp226Asn."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "the IMPDH1-D226N effect on photoreceptor cell survival may be the result of a sum of problems: nucleotide unbalance plus a toxic long-life cytoophidium"
    explanation: States the additive, multi-branch model of toxicity.
- hypothesis_group_id: dominant_negative_misfolding_model
  hypothesis_label: Dominant-negative misfolding and aggregation
  status: ALTERNATIVE
  description: >-
    One line of work holds that mutant IMPDH1 misfolds and, in hybrid tetramers, imposes its
    conformation on wild-type subunits, giving a dominant-negative mechanism. This is in direct
    tension with biochemical characterization of the same alleles that found no effect on
    protein stability or aggregation, so misfolding-driven dominant negativity is curated as a
    competing model rather than a settled one.
  evidence:
  - reference: PMID:21791244
    reference_title: "Molecular recruitment as a basis for negative dominant inheritance? propagation of misfolding in oligomers of IMPDH1, the mutated enzyme in the RP10 form of retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Under various conditions regain is close to the mutant figure, suggesting that, in hybrid tetramers, mutant subunits impose their faulty conformation on normal partners."
    explanation: Supports a dominant-negative molecular-recruitment mechanism.
  - reference: PMID:15882147
    reference_title: "Autosomal dominant retinitis pigmentosa mutations in inosine 5'-monophosphate dehydrogenase type I disrupt nucleic acid binding."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The adRP-linked mutations have no effect on enzyme activity, protein stability or protein aggregation."
    explanation: Contradicts the aggregation premise of the dominant-negative misfolding model.
- hypothesis_group_id: cgmp_toxicity_model
  hypothesis_label: Hyperactive enzyme with elevated cGMP causing death (refuted)
  status: DEPRECATED
  description: >-
    An intuitive early model held that feedback-resistant IMPDH1 would raise GTP and hence
    cGMP, killing photoreceptors by the cGMP-toxicity route familiar from PDE6 disease. Work
    in zebrafish cone models disproves it: cGMP was not elevated, a pde6c double mutant was not
    rescued, and metabolomic changes ran opposite to the prediction. No elevated-cGMP node is
    encoded for this disease.
  evidence:
  - reference: PMID:40820815
    reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "Our work disproves the model of a hyperactive enzyme leading to elevated cGMP causing cell death and reveals new defects associated with IMPDH1 mutant expression."
    explanation: Directly refutes the elevated-cGMP toxicity model.
  - reference: PMID:40820815
    reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "cGMP levels were normal in both mutant retinas."
    explanation: cGMP was not elevated in either mutant cone model.
progression:
- phase: Nyctalopia with preserved acuity
  age_range: First decade
  notes: Night blindness is the presenting feature, with preserved central acuity early.
  evidence:
  - reference: PMID:15465556
    reference_title: "A novel IMPDH1 mutation (Arg231Pro) in a family with a severe form of autosomal dominant retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "All affected patients had the onset of night blindness within the first decade of life."
    explanation: Establishes first-decade onset of night blindness.
- phase: Electroretinogram collapse with retained central function
  age_range: Up to the second decade
  notes: Rod and cone ERG responses become small or nondetectable by about age 20, rod before cone.
  evidence:
  - reference: PMID:16214101
    reference_title: "Phenotypic characterization of a large family with RP10 autosomal-dominant retinitis pigmentosa: an Asp226Asn mutation in the IMPDH1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Rod and cone a-wave and b-wave ffERG responses were small or nondetectable by age 20, with greater rod than cone loss at all ages."
    explanation: Documents ERG collapse by the second decade.
- phase: Field constriction with macular complications
  age_range: Up to the fourth decade
  notes: Visual fields are markedly constricted by the fourth decade, with cystoid macular edema and subretinal fluid.
  evidence:
  - reference: PMID:16214101
    reference_title: "Phenotypic characterization of a large family with RP10 autosomal-dominant retinitis pigmentosa: an Asp226Asn mutation in the IMPDH1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Visual fields were markedly constricted by age 40"
    explanation: Quantifies field constriction by the fourth decade.
- phase: Central involvement, variant-dependent
  age_range: Fourth decade onward
  notes: >-
    The preserved foveal island shrinks with age in the severe genotypes, while some alleles
    (p.Thr244Pro) remain near-stationary; progression rate is variant-dependent.
  evidence:
  - reference: PMID:37259572
    reference_title: "IMPDH1-associated autosomal dominant retinitis pigmentosa: natural history of novel variant Lys314Gln and a comprehensive literature search."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Foveal ellipsoid zone island can be found in the youngest patient but not in the older ones."
    explanation: Central (foveal) structure is lost with age in the progressive genotypes.
prevalence:
- population: Worldwide (derived estimate, not a published figure)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_1000000
  notes: >-
    No direct prevalence or incidence estimate exists for IMPDH1-related retinopathy. This
    band is a derivation, not a source figure: retinitis pigmentosa point prevalence
    (Orphanet 1-5/10,000) multiplied by the autosomal dominant share of RP and the IMPDH1
    share of adRP (approximately 2%) places it on the order of 0.1-0.4 per 100,000. It must
    not be attributed to any single publication.
treatments:

name: IMPDH1-Related Retinopathy
creation_date: "2026-11-05T22:30:00Z"
category: Mendelian
description: >-
  IMPDH1-related retinopathy is an autosomal dominant inherited retinal dystrophy
  caused by heterozygous, almost always missense, variants in IMPDH1, which encodes
  inosine-5'-monophosphate dehydrogenase type 1, the rate-limiting enzyme of de novo
  guanine nucleotide biosynthesis. It spans two historically separate entities at
  opposite ends of one severity continuum: retinitis pigmentosa 10 (RP10), an
  early-onset rod-predominant rod-cone dystrophy, and Leber congenital amaurosis 11
  (LCA11), a rare severe congenital or infantile presentation. Pathogenic variants
  cluster in and immediately downstream of the regulatory CBS (Bateman) domain
  encoded by exons 8-10. Although IMPDH1 is a ubiquitously expressed housekeeping
  gene, the clinical consequences are confined to the retina, a tissue specificity
  attributed to retina-exclusive splice and translation isoforms. The disease
  mechanism is unusual: the variants do not reduce catalytic activity but instead
  disrupt allosteric regulation of the enzyme, perturb its higher-order filament
  assembly, and impair a moonlighting single-stranded nucleic-acid-binding function,
  with a dominant-negative component. Night blindness typically begins in the first
  decade, the electroretinogram collapses with rods lost before cones, and peripheral
  field constricts over decades while central acuity is relatively preserved until
  late. There is no disease-modifying treatment; management is supportive.

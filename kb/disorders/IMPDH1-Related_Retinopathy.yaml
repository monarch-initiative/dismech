    explanation: General LCA/RP management guidance; supportive care is the standard of care for this eye-limited disease.
- name: Vision rehabilitation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Low-vision rehabilitation to preserve function as peripheral field is lost while central
    reading vision is retained until late.
  treatment_term:
    preferred_term: Rehabilitation

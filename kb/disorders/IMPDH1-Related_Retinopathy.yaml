    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: "Affected individuals benefit from correction of refractive error, use of low-vision aids when possible, and optimal access to educational and work-related opportunities."
    explanation: Supports refractive correction and low-vision rehabilitation.
- name: Genetic counseling
  description: >-
    Autosomal dominant counseling with a 50% transmission risk per pregnancy. Expressivity
    is markedly variable even within a family, so a parent's severity poorly predicts a
    child's; de novo occurrence happens, particularly at the LCA end, so an isolated case
    does not exclude IMPDH1 and parental testing is warranted.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:16384941
    reference_title: "Spectrum and frequency of mutations in IMPDH1 associated with autosomal dominant retinitis pigmentosa and leber congenital amaurosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "de novo IMPDH1 mutations are also rare causes of isolated LCA"
    explanation: De novo occurrence is a counseling consideration that an isolated case does not exclude IMPDH1.
- name: Cataract extraction
  therapeutic_modality: SURGERY
  description: >-
    Posterior subcapsular cataract is a surveilled, surgically treatable complication;
    cataract extraction is standard management when lens opacity limits vision.
  treatment_term:
    preferred_term: Cataract Surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  evidence:
  - reference: PMID:20301475
    reference_title: "Leber Congenital Amaurosis – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "assessment of the presence of amblyopia, glaucoma, or cataract"
    explanation: Cataract is a surveilled complication whose standard treatment is surgical extraction.
- name: AAV-shRNA suppression-and-replacement gene therapy (preclinical)
  therapeutic_modality: GENE_THERAPY
  description: >-
    Investigational and preclinical only. Because the IMPDH1 null is mild in mice and
    overexpression of wild-type IMPDH1 is tolerated, an allele-non-specific RNAi knockdown
    plus replacement is viable, which is unusual among dominant retinopathies. AAV-delivered
    shRNA targeting human and mouse IMPDH1 suppresses the degeneration in the RP10 mouse
    model. No human trial exists.
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Photoreceptor Degeneration
    treatment_effect: INHIBITS
    description: shRNA knockdown of mutant IMPDH1 suppresses photoreceptor degeneration in the mouse model.
    evidence:
    - reference: PMID:18385099
      reference_title: "Therapeutic benefit derived from RNAi-mediated ablation of IMPDH1 transcripts in a murine model of autosomal dominant retinitis pigmentosa (RP10)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "substantially suppresses the negative pathological effects of mutant IMPDH1"
      explanation: Preclinical suppression of the degenerative phenotype by AAV-shRNA.
  evidence:
  - reference: PMID:18385099
    reference_title: "Therapeutic benefit derived from RNAi-mediated ablation of IMPDH1 transcripts in a murine model of autosomal dominant retinitis pigmentosa (RP10)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "expression of a normal human IMPDH1 gene under similar conditions has no observable pathological effect on retinal function"
    explanation: Tolerance of wild-type overexpression underpins the suppress-and-replace design.
- name: 17-AAG (tanespimycin) Hsp90 modulation (preclinical)
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Investigational and preclinical only. The Hsp90-binding ansamycin 17-AAG activates a
    heat-shock response and protected photoreceptors in an R224P RP10 mouse model, but
    required engineered inner-blood-retina-barrier opening for retinal delivery, which is not
    a clinical modality.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Photoreceptor Degeneration
    treatment_effect: INHIBITS
    description: A heat-shock response protects photoreceptors against aggregating mutant IMPDH1 in the mouse model.

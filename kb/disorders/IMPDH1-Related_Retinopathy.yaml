  therapeutic_modality: BEHAVIORAL
  description: >-
    The mainstay of real-world management. Refractive correction, low-vision aids, and
    access to educational and work-related support; referral of children to services for
    the visually impaired. No disease-modifying therapy exists.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747

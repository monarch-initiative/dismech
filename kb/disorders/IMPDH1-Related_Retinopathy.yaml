notes: >-
  A plain IMPDH1 query returns a large oncology and transplant-pharmacogenomics
  literature (mycophenolate response, hepatocellular carcinoma, AML, glioblastoma)
  that is biologically unrelated to retinopathy; evidence for this entry was filtered
  on the retinal phenotype, not the gene symbol. The paralogue IMPDH2 causes a
  neurodevelopmental disorder, not retinopathy, and is curated separately. There is
  no GeneReviews chapter specific to IMPDH1; the current Nonsyndromic Retinitis
  Pigmentosa Overview (PMID:20301590) and Nonsyndromic LCA/EOSRD Overview
  (PMID:30285347) are Overview-format chapters that supply evaluation strategy rather
  than an IMPDH1 phenotype baseline, so phenotypes here are taken from primary
  literature.
has_subtypes:
- name: RP10
  display_name: Retinitis Pigmentosa 10 (RP10)
  description: >-
    The autosomal dominant end of the spectrum and the common presentation: an
    early-onset, rod-predominant rod-cone dystrophy with first-decade night blindness,
    progressive peripheral field constriction and a characteristically preserved
    central island. The historical locus name RP10 denotes the 7q31-q32 region mapped
    before the gene was identified. Most pathogenic alleles, including the recurrent
    p.Asp226Asn, produce this phenotype.
  subtype_term:
    preferred_term: retinitis pigmentosa 10
    term:
      id: MONDO:0008379
      label: retinitis pigmentosa 10

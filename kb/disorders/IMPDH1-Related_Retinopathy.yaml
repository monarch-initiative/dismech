diagnosis:
- name: Molecular genetic testing
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    An inherited retinal disease / adRP gene panel or exome/genome sequencing identifies the
    IMPDH1 variant, with exons 8-10 the priority region. A missense in that hotspot is a
    strong candidate; a truncating variant, or a missense outside it, should be interpreted
    with caution. Short-read pipelines must distinguish the gene from its D226N-bearing
    pseudogene. There is no biochemical or enzyme-activity test for this disease.
  results: A heterozygous IMPDH1 missense variant, typically in exons 8-10.
  evidence:
  - reference: PMID:38604988
    reference_title: "Datasets-Based IMPDH1 Revisited: Heterozygous Missense Variants for Dominant Retinitis Pigmentosa While Truncation Variants Are Likely Non-Pathogenic."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "most missense variants outside this region and truncation variants should be interpreted with great care in clinical gene test."
    explanation: Interpretation rule prioritizing exon 8-10 missense variants.
- name: Full-field electroretinography
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    ISCEV-standard full-field ERG documents a rod-predominant rod-cone pattern, with
    dark-adapted rod responses extinguished before light-adapted cone responses.
  results: Severely reduced or nondetectable rod responses, with relatively preserved cone responses early.
  evidence:
  - reference: PMID:32821486
    reference_title: "Disease Progression in Patients with Autosomal Dominant Retinitis Pigmentosa due to a Mutation in Inosine Monophosphate Dehydrogenase 1 (IMPDH1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Full-field electroretinograms were severely reduced and the dark-adapted rod and mixed responses were extinguished at earlier visits than the light-adapted cone responses."
    explanation: Characteristic rod-before-cone ERG pattern.
- name: Multimodal retinal imaging
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    SD-OCT tracks ellipsoid-zone extent, outer-retinal thinning and cystoid/subretinal fluid;
    fundus autofluorescence shows early macular involvement with a hyperautofluorescent area
    surrounded by hypoautofluorescence.
  results: Preserved central ellipsoid-zone island with perifoveal loss; macular hyperautofluorescence surrounded by hypoautofluorescence.
  evidence:
  - reference: PMID:37259572
    reference_title: "IMPDH1-associated autosomal dominant retinitis pigmentosa: natural history of novel variant Lys314Gln and a comprehensive literature search."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "FAF showed early macular involvement with macular hyperautofluorescence (hyperAF) surrounded by hypoAF."
    explanation: Characteristic autofluorescence pattern on imaging.
animal_models:
- name: Impdh1 knockout mouse
  species: Mouse
  genotype: Impdh1-/- (targeted disruption)
  publication: PMID:14981049
  description: >-
    A germline null. It shows only slowly progressive retinal degeneration with most
    photoreceptors structurally intact at 12 months, in contrast to the severe human dominant
    disease. Its mildness is the contrast the field used to argue against a loss-of-catalysis
    mechanism, and it models autosomal recessive, not dominant, disease.
  evidence:
  - reference: PMID:14981049
    reference_title: "On the molecular pathology of neurodegeneration in IMPDH1-based retinitis pigmentosa."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Impdh1(-/-) null mice are shown here to display a slowly progressive form of retinal degeneration in which visual transduction, analysed by electroretinographic wave functions, becomes gradually compromised, although at 12 months of age most photoreceptors remain structurally intact."
    explanation: Establishes the mild, slowly progressive null phenotype.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Produces photoreceptor degeneration, but mild and slow, from loss of protein rather than a dominant missense allele.
    limitations: >-
      A null allele models absence of IMPDH1; human disease is a regulatory/dominant-negative
      missense with intact catalysis, and the mouse null is explicitly a recessive RP model.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: The model's quantity is complete loss of IMPDH1 protein; the disease quantity is a heterozygous missense allele with preserved catalysis and lost regulation.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mouse retinal IMPDH1 isoform proportions differ from human, and the disease is one of isoform-specific regulation.
    evidence:
    - reference: PMID:14981049
      reference_title: "On the molecular pathology of neurodegeneration in IMPDH1-based retinitis pigmentosa."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Impdh1(-/-) null mice are shown here to display a slowly progressive form of retinal degeneration in which visual transduction, analysed by electroretinographic wave functions, becomes gradually compromised, although at 12 months of age most photoreceptors remain structurally intact."
      explanation: The null reproduces degeneration only partially and mildly.
- name: AAV mutant human IMPDH1 (R224P) mouse
  species: Mouse
  genotype: AAV-delivered human IMPDH1 p.Arg224Pro (somatic transgenic)
  publication: PMID:18385099
  description: >-
    The RP10 mouse model: AAV-mediated expression of mutant human IMPDH1 in the retina
    produces an aggressive retinopathy resembling the human disease and, without shRNA,
    ablates photoreceptors in transfected areas. Because expression is driven from an
    exogenous promoter on top of endogenous protein, the aggression may be supraphysiological.
  evidence:
  - reference: PMID:18385099
    reference_title: "Therapeutic benefit derived from RNAi-mediated ablation of IMPDH1 transcripts in a murine model of autosomal dominant retinitis pigmentosa (RP10)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "recombinant adeno-associated viral (AAV)-mediated expression of mutant human IMPDH1 protein in the mouse retina results in an aggressive retinopathy modelling the human counterpart"
    explanation: Establishes the AAV mutant-expression model of RP10.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Aggressive photoreceptor degeneration modelling the human disease, used as the platform for the gene-therapy work.
    limitations: >-
      Overexpression of mutant protein from an exogenous promoter on top of endogenous IMPDH1
      may drive supraphysiological toxicity not representative of a heterozygous allele.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: The modeled quantity is exogenous overexpressed mutant protein, not the endogenous heterozygous dose of the human disease.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Mouse retinal IMPDH1 isoform proportions differ from human.
    evidence:
    - reference: PMID:18385099
      reference_title: "Therapeutic benefit derived from RNAi-mediated ablation of IMPDH1 transcripts in a murine model of autosomal dominant retinitis pigmentosa (RP10)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "recombinant adeno-associated viral (AAV)-mediated expression of mutant human IMPDH1 protein in the mouse retina results in an aggressive retinopathy modelling the human counterpart"
      explanation: The model recapitulates aggressive photoreceptor degeneration.
- name: impdh1a K238E cone-transgenic zebrafish
  species: Zebrafish
  genotype: cone-specific (gnat2 promoter) impdh1a p.Lys238Glu
  publication: PMID:40820815
  description: >-
    The first true mutant-IMPDH1 animal model. Cones expressing K238E degenerate, with
    reduced GMP/IMP and AMP/IMP ratios and abnormally large mislocalized filaments. It is
    cone-restricted, whereas the human disease is rod-predominant.
  evidence:
  - reference: PMID:40820815
    reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "cones containing impdh1a with the K238E mutation degenerated"
    explanation: A disease allele causes cone degeneration in the zebrafish model.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: A disease allele produces photoreceptor (cone) degeneration with abnormal mutant filaments.
    limitations: >-
      Cone-restricted expression in a species whose retinal IMPDH1 arose by gene duplication
      rather than the human splice isoforms, and with no macula.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: The model is cone-restricted and lacks a macula, whereas human disease is rod-predominant with defining macular involvement.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: Zebrafish reach a retinal IMPDH1 variant by gene subfunctionalization, not the human alternative-splicing isoforms.
    evidence:
    - reference: PMID:40820815
      reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Both K238E and D226N mutant-containing proteins formed abnormally large mislocalized filaments, which could disrupt normal dynamic protein-protein interactions."
      explanation: Reproduces the abnormal mutant filament assembly seen biochemically.
- name: impdh1a D226N cone-transgenic zebrafish
  species: Zebrafish
  genotype: cone-specific (gnat2 promoter) impdh1a p.Asp226Asn
  publication: PMID:40820815
  description: >-
    A negative result worth recording: cones expressing the commonest severe human allele,
    D226N, did not show significant loss by two years, despite forming abnormal filaments
    (including intranuclear ones). The commonest severe human allele failed to degenerate the
    model within the observation window.
  evidence:
  - reference: PMID:40820815
    reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Cones expressing impdh1a with the D226N mutation did not show significant cone loss by 2 years."
    explanation: Documents the failure of the common severe allele to degenerate the model.
  modeled_mechanisms:
  - target: Photoreceptor Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: The commonest severe human allele did not cause significant cone loss within two years in this model.
    limitations: >-
      A cone-restricted zebrafish model of a rod-predominant human disease, observed for two
      years; the human D226N phenotype is severe and early-onset, so the model fails to
      recapitulate it within the window studied.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: Degeneration was assessed to two years; a longer-latency effect would be missed.
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: The cone-restricted zebrafish isoform context may not support the regulatory consequence that D226N has in the human rod-predominant retina.
    evidence:
    - reference: PMID:40820815
      reference_title: "Retinopathy-associated inosine monophosphate dehydrogenase 1 mutations cause metabolic and filament defects in cones."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: "Cones expressing impdh1a with the D226N mutation did not show significant cone loss by 2 years."
      explanation: The substantive negative result behind the failure-to-recapitulate call.
discussions:
- discussion_id: impdh1_no_faithful_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does any model faithfully capture IMPDH1 disease, given that the disease is one of
    isoform-specific regulation and the human retina's IMPDH1 isoform proportions are unique
    among the species used as models?
  attaches_to:
  - pathophysiology#Retina-Restricted IMPDH1 Isoform Dependence
  rationale: >-
    The disease disrupts the regulation of retina-specific IMPDH1 isoforms, but the relative
    abundance of those isoforms in human retina differs from every mammalian model tested, and
    zebrafish reach a retinal variant by gene duplication rather than splicing. Mouse nulls
    model recessive loss, AAV models overexpress, and the D226N zebrafish does not degenerate.
    So model evidence exists but its translational validity to human disease is the open
    question, which is the defining HUMAN_MODEL_MISMATCH shape.
  evidence:
  - reference: PMID:32821486
    reference_title: "Disease Progression in Patients with Autosomal Dominant Retinitis Pigmentosa due to a Mutation in Inosine Monophosphate Dehydrogenase 1 (IMPDH1)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "Due to species- and tissue-dependent expression of IMPDH1, there are no appropriate models of human IMPDH1 disease."
    explanation: States the absence of a faithful model directly.
  - reference: PMID:17960124
    reference_title: "Characterization of retinal inosine monophosphate dehydrogenase 1 in several mammalian species."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: "The relative abundance of IMPDH1 proteins in human retina is unique in comparison to other mammalian species, indicating an apparent lack of an ideal model organism for human retinal IMPDH1 expression."
    explanation: Identifies the isoform-ratio basis for the model gap.
- discussion_id: impdh1_final_death_step_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which branch, or combination, links the IMPDH1 regulatory and moonlighting defects to photoreceptor death?
  attaches_to:
  - pathophysiology#Photoreceptor Degeneration
  rationale: >-
    Loss of allosteric regulation, abnormal filaments, impaired nucleic-acid binding and
    dominant-negative misfolding are all demonstrated, but which carries the pathology is not
    established, and the intuitive elevated-cGMP route has been refuted. The question is which
    of the surviving branches is causal for death, and whether they act additively.
  evidence:
  - reference: PMID:37731818
    reference_title: "Effect on cell survival and cytoophidium assembly of the adRP-10-related IMPDH1 missense mutation Asp226Asn."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: "the IMPDH1-D226N effect on photoreceptor cell survival may be the result of a sum of problems: nucleotide unbalance plus a toxic long-life cytoophidium"
    explanation: Frames the unresolved, possibly additive, final step.


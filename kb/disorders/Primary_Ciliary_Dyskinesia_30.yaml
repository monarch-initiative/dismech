    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cause a failure in axonemal assembly of the ODA component DNAH5 and the
      ODA-DC-associated components CCDC114 and ARMC4
    explanation: >-
      The core observation: losing ODAD3 removes the rest of the docking complex
      and the outer-arm heavy chain from the axoneme.
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, CCDC151 coimmunoprecipitates CCDC114 and thus appears to be a
      highly evolutionarily conserved ODA-DC-related protein involved in
      mediating assembly of both ODAs and their axonemal docking machinery onto
      ciliary microtubules.
    explanation: >-
      The physical interaction that explains why the docking complex fails as a
      unit.
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Multisubunit outer dynein arm (ODA) motor complexes, produced and
      preassembled in the cytosol, are transported to the ciliary or flagellar
      compartment and anchored into the axonemal microtubular scaffold via the
      ODA docking complex (ODA-DC) system.
    explanation: >-
      Establishes that the motors are preassembled elsewhere, which is what makes
      this an installation defect rather than an assembly defect. Graded OTHER
      because it is background from the paper's introduction.
  downstream:
  - target: Absence of Outer Dynein Arms from the Axoneme
    causal_link_type: DIRECT
- name: Absence of Outer Dynein Arms from the Axoneme
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The structural endpoint, and the one a diagnostic laboratory sees. Patients'
    cilia show a complete loss of outer dynein arms on electron microscopy. The
    arms are what generate most of the sliding force between axonemal doublets,
    so their absence is sufficient to explain the beat failure without invoking
    any additional lesion.

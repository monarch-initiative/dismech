- category: Otological
  name: Hearing Impairment
  frequency: OCCASIONAL
  description: >-
    Conductive hearing loss follows from middle-ear disease, which follows from
    the same ciliated epithelium failing in the Eustachian tube. Recorded here
    from the gene-specific phenotype summary rather than from an individually
    described patient, and graded OCCASIONAL for the same reason as the
    ventricular septal defect above: the source lists it among varied phenotypes
    and attributes the variation to background genotype, epigenetic and
    environmental effects without giving a count.

    Note the term chosen is the general hearing-impairment term rather than a
    conductive-specific one. The mechanism above predicts conductive loss, but
    the source says only "hearing disease", and binding to the more specific term
    would assert an audiological characterisation nobody reported.

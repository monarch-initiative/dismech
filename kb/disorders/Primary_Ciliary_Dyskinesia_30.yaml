    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 35 year-old female patient exhibited chronic sinusitis, diffuse
      bronchiectasis, dextrocardia and infertility.
    explanation: >-
      The clinical picture in an individually described ODAD3 patient.
  - reference: PMID:32490514

genetic:
- name: ODAD3
  gene_term:
    preferred_term: ODAD3
    term:
      id: hgnc:28303
      label: ODAD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    The gene's approved symbol changed from CCDC151 to ODAD3 when the outer
    dynein arm docking complex members were renamed as a family (ODAD1 =
    CCDC114, ODAD2 = ARMC4, ODAD3 = CCDC151, ODAD4 = TTC25). This matters for
    literature searching: the defining 2014 paper, the mouse hydrocephalus model
    and the zebrafish work are all published under CCDC151, while the 2021 case
    report and the 2024 mouse fertility work use ODAD3. A search on either symbol
    alone misses roughly half the literature.

    Reported alleles, all truncating. Quotable here: c.925G>T p.(Glu309*),
    homozygous in a consanguineous Arabic family; c.325G>T p.(Glu109*) in
    mainland China; c.167delG p.(Gly56Aspfs*26) in a Han-Chinese Kartagener
    family; and c.1166_1169dupAGAC p.(Leu391Aspfs*105) in a consanguineous
    Chinese family.

    The defining 2014 series' own two alleles are reported but not quotable,
    because that paper's cached record is abstract-only and its abstract gives no
    variant. As uncited leads from the deep-research report committed with this
    entry, which read the full text: c.925G>T p.(Glu309*) - the same allele
    independently reported above - in two unrelated Arabic-origin pedigrees, and
    c.1256C>A p.(Ser419*) in a consanguineous UK-Pakistani family. The report
    also warns that some secondary summaries render the second change as C>T
    where the primary full text gives C>A, which is worth knowing before
    transcribing it from a review.

    No missense allele has been reported, so there is no worked example of a
    partial loss-of-function ODAD3 variant to reason from when a new missense
    change turns up.

    On the founder question, the two published opinions differ and neither is
    conclusive. The recurrent c.925G>T allele appeared in two unrelated
    Arabic-ancestry pedigrees, which is suggestive; the independent report of the
    same allele found it absent from 238 controls and read that as arguing
    against a founder effect. Absence from a small control panel shows the allele
    is rare, which is not the same question - a founder allele can be rare. No
    haplotype analysis has been published either way.
  evidence:
  - reference: PMID:25224326
    reference_title: "Nonsense mutation in coiled-coil domain containing 151 gene (CCDC151) causes primary ciliary dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant was absent in 238 randomly selected individuals indicating that
      the variant is rare and likely not to be a founder mutation.
    explanation: >-
      The published argument against a founder effect, quoted so a reader can see
      what it actually rests on.
  - reference: PMID:33719352
    reference_title: "Case Report: Identification of a Novel ODAD3 Variant in a Patient With Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a novel homozygous variant in ODAD3, c.1166_1169dupAGAC,
      p.(Leu391Aspfs*105) in the PCD patient by exome sequencing and Sanger
      sequencing.
    explanation: >-
      One of the reported frameshift alleles.
  - reference: PMID:32490514
    reference_title: "Identification of a frame shift mutation in the CCDC151 gene in a Han-Chinese family with Kartagener syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the present study, we identified a frame shift mutation, c.167delG
      (p.G56Dfs*26), in the coiled-coil domain containing 151 gene (CCDC151)
      responsible for KS in a Han-Chinese family.
    explanation: >-
      A further frameshift allele, reported under the CCDC151 symbol.

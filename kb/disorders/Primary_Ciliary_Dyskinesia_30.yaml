pathophysiology:
- name: Biallelic ODAD3 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. ODAD3 encodes a 595-amino-acid protein with three
    highly conserved coiled-coil domains, and every reported disease allele is
    truncating: nonsense (p.Glu309*, p.Glu109*) or frameshift (p.Gly56Aspfs*26,
    p.Leu391Aspfs*105). No missense allele has been reported, and no
    hypomorphic-allele phenotype exists to calibrate against - which means the
    disease as described is the phenotype of complete protein loss, and nothing
    is known about partial loss in humans.
  genes:
  - preferred_term: ODAD3
    term:
      id: hgnc:28303
      label: ODAD3
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as loss of function on the strength of the allele classes reported
      (all truncating) together with the measured consequence: ODAD3 protein is
      absent from patients' respiratory cilia. `zygosity` is left unset at the
      disease level because reported patients are variously homozygous and
      compound heterozygous.
  evidence:
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that CCDC151 encodes an axonemal coiled coil protein,
      mutations in which abolish assembly of CCDC151 into respiratory cilia
    explanation: >-
      States both the protein's nature and the immediate molecular consequence of
      the variants.
  - reference: PMID:33719352
    reference_title: "Case Report: Identification of a Novel ODAD3 Variant in a Patient With Primary Ciliary Dyskinesia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ODAD3 encodes a protein of 595 amino acids and contain three highly
      conserved coiled-coil domains, which is essential for cilia axoneme dynein
      arm assembly and docking.
    explanation: >-
      Describes the protein architecture that the truncating alleles disrupt.
      Graded OTHER because it is background prose from the paper's introduction
      rather than a finding from its study.
  downstream:
  - target: Outer Dynein Arm Docking Complex Assembly Failure
    causal_link_type: DIRECT
- name: Outer Dynein Arm Docking Complex Assembly Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The step that defines the disease. The ODA docking complex is a multi-subunit
    structure, and ODAD3's loss takes the rest of it with it: in patients'
    respiratory cilia the docking-complex members ODAD1 (CCDC114) and ODAD2
    (ARMC4) fail to assemble onto the axoneme along with ODAD3 itself. The
    physical basis for the co-dependence is that ODAD3 and ODAD1 are binding
    partners - they co-immunoprecipitate.

    The functional distinction worth holding onto: outer dynein arms are
    *produced and preassembled in the cytosol* and then transported into the
    cilium, so a docking-complex defect is not a failure to build motors. It is a
    failure to install them.
  biological_processes:
  - preferred_term: axonemal dynein complex assembly
    term:
      id: GO:0070286
      label: axonemal dynein complex assembly
    modifier: DECREASED
  cell_types:

- name: Randomised Left-Right Body Asymmetry
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Laterality is not reversed by this disease; it is randomised. That is the
    correct way to describe a nodal-flow defect and it explains the observed
    spread - situs solitus, situs inversus totalis, and complex heterotaxy with
    congenital heart disease all occur, and all three were seen in the vertebrate
    models.

    On frequency: the defining paper's abstract records laterality defects in the
    reported individuals but gives no fraction, and its cached record is
    abstract-only. The deep-research report committed with this entry, which read
    the full text, records four of the five with a laterality defect and one with
    a ventricular septal defect. That is an uncited lead, and with a denominator
    of five it would in any case describe those three families rather than
    estimate penetrance.

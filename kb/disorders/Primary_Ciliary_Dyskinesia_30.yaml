- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported patient carries two ODAD3 loss-of-function alleles. The
    defining series found them in five affected individuals from three
    independent families by combined mapping and sequencing; subsequent reports
    are homozygous cases from consanguineous families. Nothing in the human
    literature suggests a heterozygous carrier phenotype - see the discussion
    below on why the mouse data raise that question anyway.
  evidence:
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, by combined high-throughput mapping and sequencing, we identified
      CCDC151 loss-of-function mutations in five affected individuals from three
      independent families whose cilia showed a complete loss of ODAs and
      severely impaired ciliary beating.
    explanation: >-
      Establishes recessive loss-of-function inheritance in the defining
      families.
  - reference: PMID:25224326
    reference_title: "Nonsense mutation in coiled-coil domain containing 151 gene (CCDC151) causes primary ciliary dyskinesia."
    supports: SUPPORT

- category: Cardiovascular
  name: Ventricular Septal Defect
  frequency: OCCASIONAL
  description: >-
    Congenital heart disease is part of the laterality arm rather than a separate
    lesion: disturbed left-right patterning at the embryonic node produces
    complex cardiac malformations as well as situs abnormalities, and the animal
    models show situs defects and complex heart defects together. Reported among
    the phenotypes seen in CCDC151 patients.

    Graded OCCASIONAL rather than left unqualified, deliberately. The source
    sentence lists this among "varied" phenotypes and adds its own caveat that
    the variation may reflect background genotype effects, epigenetic
    modifications and environmental factors - so it is describing a phenotype
    that appears in some CCDC151 patients and not others, without giving a count.
    OCCASIONAL is the most that supports; a higher band would read a frequency
    into a sentence that declines to give one.
  phenotype_term:

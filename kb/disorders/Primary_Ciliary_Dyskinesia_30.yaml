name: Primary Ciliary Dyskinesia 30
creation_date: "2026-08-28T00:00:00Z"
category: Genetic
disease_term:
  preferred_term: Primary ciliary dyskinesia 30
  term:
    id: MONDO:0014465
    label: primary ciliary dyskinesia 30
description: >-
  Primary ciliary dyskinesia 30 (CILD30) is the form of PCD caused by biallelic
  loss-of-function variants in ODAD3, the gene formerly called CCDC151. The
  protein is a subunit of the outer dynein arm docking complex - the structure
  that anchors preassembled outer dynein arms onto the axonemal microtubules.
  Losing it does not damage the dynein motors themselves; it removes the place
  they attach. The result is a fully built cilium with nothing to power it.

  The lesion is unusually legible in the cell. In patients' respiratory cilia,
  ODAD3 is absent from the axoneme, and so are the two other docking-complex
  members ODAD1 (CCDC114) and ODAD2 (ARMC4) and the outer-arm heavy chain DNAH5,
  while inner dynein arms remain in place. That selective picture - outer arms
  gone, inner arms present - is what transmission electron microscopy reports as
  isolated outer dynein arm loss, and it is why the docking complex, rather than
  dynein assembly, is the level at which this disease acts. ODAD3
  co-immunoprecipitates ODAD1, so the docking complex is understood to fail as a
  unit.

  Clinically this produces conventional PCD: lifelong wet cough, recurrent upper
  and lower airway infection, chronic rhinosinusitis, otitis media,
  bronchiectasis, and - because the same axonemal machinery drives the embryonic
  node's motile monocilia - laterality defects, which the defining series
  reports in its patients without giving a fraction in its abstract. Fewer than a
  dozen patients have been reported.

  Two things make this entity worth curating separately rather than as one more
  gene on the umbrella PCD entry, and both concern what happens outside the
  airway. The mouse null is perinatally lethal with communicating hydrocephalus,
  a phenotype that human ODAD3 patients do not have; and mouse work has followed
  the gene into spermatogenesis far enough to find a heterozygote effect - a
  gene-dosage claim with counselling implications that no human study has
  examined. Both are curated here with their translational limits stated
  explicitly rather than transferred to patients.

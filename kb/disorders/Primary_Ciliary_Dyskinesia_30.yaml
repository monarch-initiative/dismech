animal_models:
- name: Ccdc151 knockout mouse (targeted gene deletion)
  species: Mouse
  genotype: Ccdc151 targeted deletion, homozygous null
  publication: PMID:31383820
  description: >-
    A targeted-deletion mouse null for Ccdc151. It reproduces the laterality
    defect and the male infertility of human ODAD3 disease, and adds a phenotype
    the human disease does not have: perinatally lethal communicating
    hydrocephalus. A beta-galactosidase reporter localises the gene's expression
    to the ependymal cells lining the ventricular system, which explains the
    hydrocephalus mechanistically - the ependymal motile cilia that drive
    cerebrospinal fluid flow are the same machinery - without making it a human
    finding.
  modeled_mechanisms:
  - target: Randomised Left-Right Body Asymmetry
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Congenital left-right asymmetry defects occur in the null animals, matching
      the human laterality phenotype and its nodal-cilia mechanism.
    limitations: >-
      Perinatal lethality means the model cannot be followed into the chronic
      airway disease that dominates the human illness, so its usefulness is
      confined to developmental phenotypes.
    readouts:
    - name: Left-right asymmetry in Ccdc151-null animals
      target: Randomised Left-Right Body Asymmetry
      direction: ALTERED
      interpretation: >-
        Presence of congenital laterality defects in the null, matching the human
        phenotype.
      evidence:
      - reference: PMID:31383820
        reference_title: "Functional loss of Ccdc151 leads to hydrocephalus in a mouse model of primary ciliary dyskinesia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Congenital defects in left-right asymmetry and male infertility have
          been also observed in Ccdc151-null animals.
        explanation: >-
          The laterality observation in the null mouse.
    evidence:
    - reference: PMID:31383820
      reference_title: "Functional loss of Ccdc151 leads to hydrocephalus in a mouse model of primary ciliary dyskinesia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The CCDC151 gene encodes for a coiled-coil axonemal protein that ensures
        correct attachment of outer dynein arm (ODA) complexes to microtubules.
      explanation: >-
        Establishes that the gene has the same molecular role across species,
        which is what makes the model informative for this node. Graded OTHER
        because it is background prose from the paper's introduction rather than
        a result measured in the mouse.
  - target: Motile Ciliary Beat Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The null reproduces motile-cilia failure in the ependyma and the male
      reproductive tract, but the tissue whose failure defines the human disease
      - the conducting airway - cannot be assessed because the animals die
      perinatally.
    limitations: >-
      Perinatal lethality from hydrocephalus prevents any study of chronic airway
      disease, bronchiectasis, or the natural history that constitutes most of
      the human illness. The dominant phenotype of the model is one the human
      disease does not have; see the HUMAN_MODEL_MISMATCH discussion.
    readouts:
    - name: Sperm count and motility after adult Ccdc151 deletion
      target: Motile Ciliary Beat Failure
      direction: DECREASED
      interpretation: >-
        Deleting the gene in adults, which bypasses the perinatal lethality,
        gives an isolated flagellar-motility readout of the same lesion.
      evidence:
      - reference: PMID:31383820
        reference_title: "Functional loss of Ccdc151 leads to hydrocephalus in a mouse model of primary ciliary dyskinesia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ccdc151 gene deletion in adult animals results in abnormal sperm counts
          and defective sperm motility.
        explanation: >-
          The adult-deletion motility measurement.
    evidence:
    - reference: PMID:31383820
      reference_title: "Functional loss of Ccdc151 leads to hydrocephalus in a mouse model of primary ciliary dyskinesia."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we demonstrate that loss of Ccdc151 gene function via targeted gene
        deletion in mice leads to perinatal lethality and congenital
        hydrocephalus.
      explanation: >-
        Graded PARTIAL because this is the limitation on the link as much as
        support for it: the phenotype that dominates the model is not the
        phenotype that dominates the disease.
- name: Odad3 conditional knockout mouse (adult male)
  species: Mouse
  genotype: Odad3 conditional deletion in adult males; and Odad3 heterozygous null
  publication: PMID:38920681
  description: >-
    A conditional deletion that removes Odad3 in adult males and so escapes the
    perinatal lethality of the constitutive null. It gives the only detailed
    account of what ODAD3 loss does to a flagellum: asthenoteratozoospermia with
    multiple morphological abnormalities of the sperm flagella, and
    spermatogenesis arrested at the spermiogenesis and spermiation stages. The
    same study reports a heterozygote effect - reduced sperm count and motility,
    abnormal morphology, and a shorter fertile lifespan in Odad3+/- males - which
    is a gene-dosage claim with no human counterpart and is the subject of an
    open discussion below.
  modeled_mechanisms:
  - target: Motile Ciliary Beat Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The sperm flagellum is a motile axoneme with the same outer dynein arm and
      docking machinery as an airway cilium, so flagellar failure in this model is
      the same lesion read out in a different cell. The model additionally shows
      that Odad3 loss disrupts flagellar *morphogenesis*, not only motility.
    limitations: >-
      Fidelity is graded MODERATE, not HIGH, for two reasons. The readout is a
      single motile cell type and not the multiciliated airway epithelium whose
      failure defines the human disease. And the conditional deletion is imposed
      on an adult animal whose spermatogenic machinery developed normally, which
      is not the situation of a patient who has lacked ODAD3 since conception.
    readouts:
    - name: Sperm flagellar morphology and motility after adult Odad3 ablation
      target: Motile Ciliary Beat Failure
      direction: ALTERED
      interpretation: >-
        Multiple morphological abnormalities of the flagella with impaired
        motility, in an axoneme built without ODAD3.
      evidence:
      - reference: PMID:38920681
        reference_title: "The Odad3 Gene Is Necessary for Spermatozoa Development and Male Fertility in Mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we conditionally deleted the Odad3 gene in adult males and demonstrated
          that even partial ablation of the Odad3 gene leads to
          asthenoteratozoospermia with multiple morphological abnormalities of
          sperm flagella (MMAF) in mice
        explanation: >-
          The flagellar phenotype underlying this readout.
    evidence:
    - reference: PMID:38920681
      reference_title: "The Odad3 Gene Is Necessary for Spermatozoa Development and Male Fertility in Mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Previously, we demonstrated that knockout of the Odad3 gene in mice
        replicates several features of PCD, such as hydrocephalus, defects in
        left-right body symmetry, and male infertility, with a complete absence
        of sperm in the reproductive tract.
      explanation: >-
        Establishes the model lineage and which human features the mouse
        reproduces, which is what makes it informative for this node.
- name: Ccdc151 morphant zebrafish
  species: Zebrafish
  genotype: ccdc151 morpholino knockdown; and homozygous ccdc151(ts272a)
  publication: PMID:24067530
  description: >-
    The zebrafish work that identified CCDC151 as an outer-dynein-arm docking
    protein before any human patient was known - it shares ancient features with
    the outer dynein arm-docking complex 2 of Chlamydomonas. Depletion gives
    left-right asymmetry defects and kidney cysts, and the motility defect was
    localised to the two motile-ciliated structures that matter: Kupffer's
    vesicle, the fish left-right organiser, and the pronephros.
  modeled_mechanisms:
  - target: Outer Dynein Arm Docking Complex Assembly Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ccdc151 depletion impairs motile ciliary function by controlling dynein arm
      assembly, which is the same molecular step as the human lesion, established
      in this species before the human disease existed.
    limitations: >-
      Morpholino knockdown is transient and incomplete rather than a null, and
      the same study reports that vertebrate CCDC151 has acquired functions
      beyond motility - a role in oriented cell division in the pronephros and in
      the regulation of primary cilium length in mammalian cells. Those
      additional functions are not part of the human PCD phenotype, so a
      zebrafish phenotype cannot be assumed to be the motility phenotype.
    readouts:
    - name: Dynein arm assembly in Kupffer's vesicle and pronephric cilia
      target: Outer Dynein Arm Docking Complex Assembly Failure
      direction: DECREASED
      interpretation: >-
        Loss of motile function attributable to defective dynein arm assembly in
        the two motile-ciliated organs assayed.
      evidence:
      - reference: PMID:24067530
        reference_title: "The coiled-coil domain containing protein CCDC151 is required for the function of IFT-dependent motile cilia in animals."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We demonstrate that Ccdc151 is required for proper motile function of
          cilia in the Kupffer's vesicle and in the pronephros by controlling
          dynein arm assembly
        explanation: >-
          The assembly measurement underlying this readout.
    evidence:
    - reference: PMID:24067530
      reference_title: "The coiled-coil domain containing protein CCDC151 is required for the function of IFT-dependent motile cilia in animals."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We identified a previously uncharacterized coiled-coil domain containing
        protein CCDC151, which is evolutionarily conserved in motile ciliated
        species and shares ancient features with the outer dynein arm-docking
        complex 2 of Chlamydomonas.
      explanation: >-
        Establishes the protein's identity as a docking-complex component,
        conserved from the alga that defined the structure.
diagnosis:
- name: Ultrastructural and Immunofluorescence Assessment of Outer Dynein Arms
  description: >-
    ODAD3 disease is one of the PCD forms that a diagnostic laboratory can
    localise before sequencing. Electron microscopy shows outer dynein arms
    missing with inner arms preserved, and immunofluorescence shows the
    docking-complex members and the outer-arm heavy chain DNAH5 absent from the
    axoneme. That pattern narrows the genetic differential to the ODA and
    ODA-docking genes, which is a useful reduction from the fifty-odd PCD genes.

    What it cannot do is name ODAD3. The docking complex fails as a unit, so a
    defect in any of its members produces the same immunofluorescence picture -
    which is why the diagnosis is completed by sequencing.
  evidence:
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cause a failure in axonemal assembly of the ODA component DNAH5 and the
      ODA-DC-associated components CCDC114 and ARMC4
    explanation: >-
      The immunofluorescence pattern that identifies a docking-complex defect,
      and the reason it cannot discriminate between the complex's members.
differential_diagnoses:
- name: Other outer dynein arm docking complex deficiencies (ODAD1, ODAD2, ODAD4)
  description: >-
    The closest differential, and the one that ultrastructure cannot resolve.
    ODAD1 (CCDC114), ODAD2 (ARMC4) and ODAD4 (TTC25) are the other members of the
    same complex, and defects in any of them give outer dynein arm loss with
    randomised laterality. ODAD3 is distinguished from them only by sequencing.
    Note that this knowledge base currently curates ODAD1 as a causal gene on the
    umbrella `Primary Ciliary Dyskinesia` entry rather than as its own disease
    entry, so a reader looking for its counterpart to this file will not find
    one.
  evidence:
  - reference: PMID:27486780
    reference_title: "TTC25 Deficiency Results in Defects of the Outer Dynein Arm Docking Machinery and Primary Ciliary Dyskinesia with Left-Right Body Asymmetry Randomization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, IF analyses revealed an absence of the ODA docking complex
      (ODA-DC), along with its known components CCDC114, CCDC151, and ARMC4.
    explanation: >-
      A different docking-complex gene's defect removes ODAD3 (CCDC151) from the
      axoneme along with the rest of the complex - which is precisely why
      immunofluorescence cannot discriminate ODAD3 disease from its siblings.
- name: Outer dynein arm heavy-chain and dynein-preassembly deficiencies
  description: >-
    DNAH5 and other outer-arm components give outer dynein arm loss directly
    rather than through a docking failure, and are clinically indistinguishable.
    The dynein-preassembly factors are separable on ultrastructure, because they
    remove inner arms as well as outer ones - which is exactly the distinction
    that the HPO term chosen for the phenotype above preserves.
  evidence:
  - reference: PMID:25192045
    reference_title: "CCDC151 mutations cause primary ciliary dyskinesia by disruption of the outer dynein arm docking complex formation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In humans, defects in ODA assembly are the major cause of primary ciliary
      dyskinesia (PCD), an inherited disorder of ciliary and flagellar
      dysmotility characterized by chronic upper and lower respiratory infections
      and defects in laterality.
    explanation: >-
      Establishes that outer-arm assembly defects as a class are the largest
      slice of the PCD differential.
discussions:
- discussion_id: pcd30_mouse_hydrocephalus_not_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is hydrocephalus the lethal phenotype of the Ccdc151-null mouse when
    human ODAD3 patients survive to adulthood without it?
  attaches_to:
  - "pathophysiology#Motile Ciliary Beat Failure"
  - "animal_models#Ccdc151 knockout mouse (targeted gene deletion)"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence is not missing. The mouse phenotype is well characterised: targeted
    deletion of Ccdc151 causes perinatal lethality and congenital communicating
    hydrocephalus, with reporter expression localising the gene to the ependymal
    cells lining the ventricular system and micro-computed tomography confirming
    the aqueduct of Sylvius is patent. It is a coherent mechanism - ependymal
    motile cilia drive cerebrospinal fluid flow, and they carry the same outer
    dynein arms as airway cilia.

    The mismatch is one of frequency and severity, and it should be stated
    exactly rather than as a flat contradiction. Hydrocephalus is a recognised
    possible complication of primary ciliary dyskinesia in humans - one of the
    papers cited by this entry lists it among the consequences of ciliary
    dysfunction in the brain and spinal ependyma, alongside conductive deafness
    and subfertility. What is absent is any hydrocephalus in a reported *ODAD3*
    patient: none of the five human ODAD3 reports consulted for this entry
    describes it, and the individually described 35-year-old woman's reported
    problems are sinusitis, bronchiectasis, dextrocardia and infertility. So the
    consequence that is occasional and survivable in human PCD, and unreported in
    this genotype, is in the mouse the phenotype that kills the animal before it
    can develop the airway disease which defines the human illness.

    This is not peculiar to ODAD3 - hydrocephalus is a recurrent feature of mouse
    motile-ciliopathy models and a rare one in human PCD. The usual explanation
    offered for that gap is anatomical, that the rodent aqueduct is narrow and
    rodent cerebrospinal-fluid circulation depends more on ependymal ciliary flow
    than the human one does. That explanation is not tested by anything cited
    here and is recorded as the standing hypothesis rather than as a finding. It
    matters well beyond this gene, because it means a mouse motile-ciliopathy
    model's most conspicuous phenotype may be its least transferable one.

    The practical consequence for this entry: hydrocephalus is not curated as a
    phenotype of PCD30, and the mouse link that carries it is graded
    PARTIALLY_RECAPITULATES with the lethality stated as a limitation.
  evidence:
  - reference: PMID:32490514
    reference_title: "Identification of a frame shift mutation in the CCDC151 gene in a Han-Chinese family with Kartagener syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      As cilia or flagella are also distributed in middle ear, sperm, fallopian
      tube, brain, and spinal ependymal, KS may be accompanied by conductive
      deafness, sub- or infertility, ectopic pregnancy, and hydrocephalus
    explanation: >-
      Graded PARTIAL because it cuts both ways: it establishes that
      hydrocephalus is a recognised human PCD complication, which is why the
      mismatch is one of frequency rather than of kind, while saying nothing
      about any ODAD3 patient. Graded OTHER because it is a background statement
      about Kartagener syndrome as a class within a case report.
  proposed_experiments:
  - experiment_id: exp_pcd30_human_ventricular_imaging
    name: Systematic ventricular imaging in ODAD3 and other ODA-defect patients
    description: >-
      Measure ventricular volume and aqueductal patency in a genotyped PCD cohort
      stratified by ultrastructural defect class, and ask whether subclinical
      ventriculomegaly is present in humans at a frequency that routine care
      would miss. A positive result would make the mouse phenotype a quantitative
      rather than a qualitative mismatch.
- discussion_id: pcd30_heterozygote_fertility_effect
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do heterozygous ODAD3 carriers have reduced male fertility, as heterozygous
    Odad3 mice do?
  attaches_to:
  - "animal_models#Odad3 conditional knockout mouse (adult male)"
  - "genetic#ODAD3"
  rationale: >-
    A gene-dosage finding in the mouse with a direct counselling implication and
    no human evidence either way.

    Odad3 heterozygous null males have reduced sperm count and motility, abnormal
    sperm morphology, and a shorter fertile lifespan. The authors state the
    finding may bear on genetic and fertility counselling for carriers, which is
    an unusually direct clinical suggestion from a mouse study.

    Nobody has looked in humans. PCD carrier parents are ascertained routinely in
    the course of diagnosing their children, so the cohort exists; semen analysis
    in fathers of ODAD3 probands would answer the question directly and has never
    been reported. Until it is, the recessive counselling given to ODAD3 families
    should not be modified, and this entry curates no carrier phenotype - the
    finding is recorded here so that a future carrier study is recognised as
    testing a prediction rather than making an incidental observation.

    One caution on how far to generalise it. The reduced fertile lifespan is an
    age-dependent effect, and mouse and human reproductive ageing are on
    different scales, so even a real human effect need not be detectable at the
    ages at which carrier fathers are typically ascertained.
  proposed_experiments:
  - experiment_id: exp_pcd30_carrier_semen_analysis
    name: Semen analysis in heterozygous ODAD3 carriers
    description: >-
      Compare sperm concentration, motility and morphology between confirmed
      heterozygous ODAD3 carriers (fathers of probands) and age-matched
      non-carrier controls, with stratification by age to test the
      fertile-lifespan component of the mouse finding.
- discussion_id: pcd30_no_gene_specific_natural_history
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does ODAD3 disease differ in course or treatment response from other forms of
    PCD?
  attaches_to:
  - "pathophysiology#Mucociliary Clearance Failure and Suppurative Airway Disease"
  - "phenotypes#Bronchiectasis"
  rationale: >-
    Curated as a genuine absence. There is no ODAD3-specific cohort, no lung
    function trajectory, no survival data, and no treatment study. Everything
    known about how to manage these patients comes from PCD as a class.

    That is why this entry has no `treatments:` block and no `progression:`
    block. Airway clearance, antibiotics and surveillance are the standard of
    care for PCD and would certainly be given to an ODAD3 patient, but curating
    them here would state that they have been studied in this genotype, which
    they have not, and the exported graph would not preserve the difference.
    The `Primary Ciliary Dyskinesia` umbrella entry carries the class-level
    treatment content, and that is the right place for it.

    Whether the distinction is worth drawing is itself open. Genotype-stratified
    outcome data are beginning to appear for PCD, and the ODA-defect genes are
    thought to sit at the more severe end. If that holds, ODAD3-specific
    management guidance could eventually exist; if it does not, the class-level
    content is all there will ever be.
  proposed_experiments:
  - experiment_id: exp_pcd30_genotype_stratified_outcomes
    name: Genotype-stratified outcomes for docking-complex PCD
    description: >-
      Within an international PCD registry, compare lung-function trajectory,
      exacerbation rate and age at bronchiectasis between patients with
      docking-complex defects (ODAD1-4) and other ultrastructural classes, with
      ODAD3 identified separately where numbers allow.
notes: >-
  On GeneReviews. PMID:20301301 ("Primary Ciliary Dyskinesia") is the applicable
  chapter and is tagged in the top-level `references:` block. It is deliberately
  not cited as evidence: its cached record carries only the chapter's statement
  of purpose and no clinical content, so a snippet from it would attest to the
  chapter's aims rather than to a fact about ODAD3 disease. It is also written at
  the level of PCD as a class rather than of any gene.

  Scope decision, recorded because the alternative was defensible. This entity
  could have been curated as a `has_subtypes` entry on `Primary Ciliary
  Dyskinesia`, which is where the knowledge base currently keeps ODAD1
  (CCDC114) - the paralogous member of the very same docking complex, listed as a
  causal gene in that entry's `genetic:` block. Curating ODAD3 as a separate
  Disease therefore creates an asymmetry between two subunits of one structure,
  and a reader is entitled to notice it. The right resolution is to promote
  ODAD1 later, not to demote ODAD3, for a structural reason: the `Subtype` class
  has no `pathophysiology`, no `phenotypes` and no `animal_models` slots, so a
  subtype entry could not have carried the docking-complex causal chain, the
  three model organisms, or the two discussions that make this entry worth
  having. `Primary_Ciliary_Dyskinesia_47_and_Lissencephaly` is the existing
  precedent for a numbered PCD form as a standalone entry.

  The wider question this decision implicates, which one entry cannot settle.
  There are 49 primary-ciliary-dyskinesia stubs in the curation queue and every
  one is `entry_type: UNDECIDED`, so whatever shape this file takes is likely to
  be copied dozens of times. Two things argue against copying it uncritically.
  Orphanet does not split PCD by gene at all - `references_cache/ORPHA_244.md` is
  a single disorder record listing 53 causal genes, ODAD3 among them - which is
  an independent nosological signal against a file per gene. And the umbrella
  entry's own `genotype_ultrastructure_severity` hypothesis already reasons along
  a different axis entirely, grouping genotypes by ultrastructural defect class
  rather than by OMIM number; a `has_subtypes` axis keyed on that class would
  give all 49 stubs a home and give that hypothesis something structural to
  attach to. This entry does not attempt that, because it is a class-level policy
  decision rather than a per-disease one, and it should be made by a maintainer
  with the whole queue in view. If the ruling goes that way, the content here
  transfers: the pathograph and the animal models move to the umbrella's
  ODA-defect subtype and nothing is lost but this file.

  What this entry does not duplicate. The umbrella `Primary Ciliary Dyskinesia`
  entry mentions ODAD3 already, in an animal-model block about Xenopus Lrrc56,
  where axonemal Odad3 signal is used as the readout for a different gene's
  defect. That is LRRC56 biology observed through ODAD3, not ODAD3 disease, and
  it is not repeated here.

  On the treatment and progression sections, which are absent. Airway clearance,
  antibiotics and surveillance are the standard of care and would be given to any
  of these patients, but no study has examined them in this genotype. Curating
  them here would assert an evidence base that does not exist; the class-level
  content lives on the umbrella entry and is correct there. The same reasoning
  applies to lung-function decline rates and prevalence figures quoted for PCD as
  a whole - the prevalence block cites one such figure and says explicitly that
  it is the class's and not this entity's.

  On hydrocephalus, which is also absent from the phenotypes. It is the dominant
  phenotype of the mouse null and has no human ODAD3 counterpart. It is curated
  where it belongs - on the mouse model link, with the lethality recorded as a
  limitation - and argued out in a HUMAN_MODEL_MISMATCH discussion rather than
  silently omitted.

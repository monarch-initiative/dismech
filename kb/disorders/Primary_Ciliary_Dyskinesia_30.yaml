- name: Mucociliary Clearance Failure and Suppurative Airway Disease
  biological_scale: ORGANISM
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The clinical burden of the disease. Without ciliary transport, mucus is
    retained, the airway is chronically infected, and the resulting inflammation
    destroys the bronchial wall. Bronchiectasis is the irreversible endpoint and
    the reason early diagnosis matters.

    A note on what this node borrows and what it does not. The sequence from
    mucus retention through infection and inflammation to bronchiectasis is the
    general PCD mechanism and is
    cited as such; what is ODAD3-specific here is the clinical observation in
    reported patients - chronic sinusitis and diffuse bronchiectasis in the
    35-year-old case, and the airway disease of the defining series.

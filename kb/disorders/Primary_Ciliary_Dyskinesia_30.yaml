  downstream:
  - target: Motile Ciliary Beat Failure
    causal_link_type: DIRECT
- name: Motile Ciliary Beat Failure
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "ciliopathy_dysfunction#Motile Cilia Beat Dysfunction"
  description: >-
    Cilia that are assembled but cannot beat. In the airway this abolishes
    mucociliary clearance; at the embryonic left-right organiser the same failure
    in motile monocilia removes the directional flow that breaks symmetry. Both
    limbs of the module node are evidenced here rather than assumed: the
    ciliary-dysmotility half from patients' severely impaired beating, and the
    laterality half from expression of Ccdc151 in vertebrate left-right
    organisers together with the situs defects seen in patients and in three
    model species.

    Conformance note: this node matches the module's motile-cilia node directly
    and completely, which is the expected shape for a classical axonemal PCD
    gene. It is a different relationship from the one the module has with the
    reduced-generation-of-multiple-motile-cilia forms of PCD, where the cilia are
    too few rather than immotile.

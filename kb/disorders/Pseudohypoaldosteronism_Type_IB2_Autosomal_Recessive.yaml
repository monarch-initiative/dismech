progression:
- phase: Neonatal salt-wasting presentation
  age_range: First weeks of life
  notes: >-
    Presentation is typically in the first days to weeks of life with vomiting,
    poor feeding, weight loss and dehydration accompanied by hyponatremia,
    hyperkalemia and metabolic acidosis.
  evidence:
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Presentation is in the first few weeks of life with severe dehydration, vomiting and failure to thrive in association with hyponatremia, hyperkalemia and metabolic acidosis as well as elevated aldosterone and renin levels."
    explanation: Orphanet describes neonatal onset of the salt-wasting presentation.
  - reference: PMID:34258491
    reference_title: "A Unique Genotype of Pseudohypoaldosteronism Type 1b in a Highly Consanguineous Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of these patients had presented within the first 10 days of life with nausea and vomiting, hyponatremia, hyperkalemia, and hypotension."
    explanation: In a Gulf cohort including SCNN1B siblings, all patients presented within the first 10 days of life.
- phase: Chronic course with recurrent salt-losing crises
  age_range: Infancy to adulthood
  notes: >-
    The systemic form does not remit as renal PHA1A does; lifelong salt
    supplementation is needed and recurrent life-threatening salt-losing crises
    occur, particularly with intercurrent illness. Early mortality is high in
    some series. One SCNN1B patient with a splice variant normalized renin,
    aldosterone and electrolytes on high salt intake by the end of the first
    year, and an adult compound heterozygote remained symptomatically
    hyperkalemic at 32 years.
  evidence:
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No remission is reported and patients suffer from recurrent life-threatening episodes of salt loss."
    explanation: Orphanet describes a non-remitting course with recurrent crises.
  - reference: PMID:31914462
    reference_title: "Failure to Thrive, Hyponatremia, Hyperkalemia - Differential Diagnostic Reflections of a Rare Genetic Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The systemic type can -apart from the kidneys - affect colon, lungs, salivary and sweat glands. In that case symptoms persist until adulthood."
    explanation: Unlike the renal type, systemic PHA1 symptoms persist into adulthood.
  - reference: PMID:17546235
    reference_title: "[Mineralocorticoid resistance: pseudohypoaldosteronism type 1]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The systemic form of PHA1 results in a severe phenotype, and high doses of salt supplementation are necessary. The symptoms are life-long recurrent."
    explanation: Review describes the lifelong recurrent course of systemic PHA1.
  - reference: PMID:32840096
    reference_title: "Clinical Management in Systemic Type Pseudohypoaldosteronism Due to SCNN1B Variant and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, patients with systemic PHA require life-long therapy."
    explanation: Systemic PHA due to SCNN1B variants needs lifelong treatment.
  - reference: PMID:42549990
    reference_title: "Clinical, Biochemical, and Molecular Spectrum of Pseudohypoaldosteronism Type 1B in Indian Children: A Multicentric Case Series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six patients (67%) died, mainly due to sepsis (n = 2) or treatment discontinuation (n = 4), while three remain stable on oral sodium supplementation."
    explanation: High early mortality in a PHA1B series that included three SCNN1B patients.
  - reference: PMID:23426840
    reference_title: "A novel splice site mutation of the beta subunit gene of epithelial sodium channel (ENaC) in one Turkish patient with a systemic form of pseudohypoaldosteronism Type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially elevated plasma renin activity (PRA) and aldosterone levels of the patient returned to normal with large amounts of dietary salt and serum sodium (Na+) and potassium (K+) levels were within normal range at the end of the first year of life."
    explanation: Documents biochemical improvement with age in one homozygous SCNN1B splice-variant patient.
  - reference: PMID:26807262
    reference_title: "Pseudohypoaldosteronism type 1 due to novel variants of SCNN1B gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In conclusion, we report a patient with novel variants of the SCNN1B gene causing PHA1 with persistent, symptomatic hyperkalemia."
    explanation: Hyperkalemia persisted into adulthood in a compound heterozygous SCNN1B patient.
genetic:
- name: SCNN1B
  association: Causative (biallelic loss of function)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SCNN1B
    term:
      id: hgnc:10600
      label: SCNN1B
  notes: >-
    Reported PHA1B2 alleles include frameshift, nonsense, splice-site and
    missense variants, homozygous or compound heterozygous. Truncating alleles
    such as p.Glu217fs and p.Tyr306fs leave a weakly active channel, and the
    missense p.Gly37Ser lowers channel open probability without reducing
    surface expression. Gain-of-function SCNN1B variants that disrupt the
    C-terminal PY motif cause the opposite disorder, Liddle syndrome.
  evidence:
  - reference: PMID:8589714
    reference_title: "Mutations in subunits of the epithelial sodium channel cause salt wasting with hyperkalaemic acidosis, pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Investigation of affected offspring of consanguineous union reveals mutations in either the alpha or beta subunits of the amiloride-sensitive epithelial sodium channel in five kindreds."
    explanation: First identification of ENaC beta subunit mutations in recessive PHA1.
  - reference: ORPHA:171876
    reference_title: "Generalized pseudohypoaldosteronism type 1"
    supports: SUPPORT
    evidence_source: OTHER

        label: fludrocortisone
  evidence:
  - reference: PMID:41457049
    reference_title: "Case Report: Compound Heterozygous SCNN1B Mutations Causing Pseudohypoaldosteronism Type 1B2 in Neonatal Twins."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Both developed life-threatening hyperkalemia, hyponatremia, and metabolic acidosis, and these conditions were unresponsive to initial management including hydrocortisone."
    explanation: Electrolyte disturbances in SCNN1B twins did not respond to hydrocortisone.
  - reference: PMID:34165441
    reference_title: "Systemic pseudohypoaldosteronism-1 with episodic dyslipidemia in a Sudanese child."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A child presenting with features that mimic salt-losing congenital adrenal hyperplasia (CAH) crises that do not respond to glucocorticoid and mineralocorticoid therapy should alert the pediatricians to the possibility of end-organ resistance to aldosterone."
    explanation: Lack of response to glucocorticoid and mineralocorticoid therapy is expected in end-organ aldosterone resistance.
  - reference: PMID:23641881
    reference_title: "Failure to thrive, hyponatremia, and hyperkalemia in a neonate."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with PHA1 are often initially diagnosed with congenital adrenal hyperplasia, but their electrolyte abnormalities are resistant to treatment with glucocorticoids and mineralocorticoids."
    explanation: Electrolyte abnormalities in PHA1 do not respond to glucocorticoid or mineralocorticoid treatment.
differential_diagnoses:
- name: Congenital adrenal hyperplasia
  description: >-
    Salt-wasting congenital adrenal hyperplasia produces the same neonatal
    hyponatremia, hyperkalemia and acidosis and is often considered first.
  distinguishing_features:
  - Normal cortisol and 17-hydroxyprogesterone with high aldosterone in PHA1
  - No response to glucocorticoid and mineralocorticoid replacement in PHA1
  evidence:
  - reference: PMID:32351772
    reference_title: "Pseudohypoaldosteronism Type 1 Newborn Patient with a Novel Mutation in SCNN1B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since she had hyponatremia and hyperkalemia, congenital adrenal hyperplasia was primarily considered."
    explanation: Congenital adrenal hyperplasia was the initial working diagnosis in an SCNN1B neonate.
  - reference: PMID:34165441
    reference_title: "Systemic pseudohypoaldosteronism-1 with episodic dyslipidemia in a Sudanese child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical presentation is life-threatening neonatal/infantile salt-losing crises that mimic congenital adrenal hyperplasia (CAH)."
    explanation: Systemic PHA1 crises mimic salt-wasting CAH.
  - reference: PMID:23641881
    reference_title: "Failure to thrive, hyponatremia, and hyperkalemia in a neonate."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Patients with PHA1 are often initially diagnosed with congenital adrenal hyperplasia, but their electrolyte abnormalities are resistant to treatment with glucocorticoids and mineralocorticoids."
    explanation: Resistance to steroid replacement distinguishes PHA1 from congenital adrenal hyperplasia.
- name: Autosomal dominant pseudohypoaldosteronism type 1
  disease_term:
    preferred_term: autosomal dominant pseudohypoaldosteronism type 1
    term:
      id: MONDO:0008329
      label: autosomal dominant pseudohypoaldosteronism type 1
  description: >-
    Renal PHA1A from heterozygous NR3C2 variants causes a milder kidney-limited
    salt-wasting syndrome that remits with age.
  distinguishing_features:
  - Kidney-limited salt loss with normal sweat electrolytes in renal PHA1A
  - Improvement with age in renal PHA1A versus lifelong treatment in systemic PHA1B
  evidence:
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was impossible to differentiate between types of PHA1 from early clinical presentation or the biochemical and hormonal profile."
    explanation: Renal and systemic PHA1 cannot be separated by early presentation, so genetic testing is needed.
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical course differs between patients with NR3C2 and SCNN1A mutations with a poorer prognosis in those with multisystem PHA."
    explanation: Prognosis is worse in multisystem PHA1B than in NR3C2-related renal PHA1A.
- name: Early-onset familial hypoaldosteronism
  disease_term:
    preferred_term: early-onset familial hypoaldosteronism
    term:
      id: MONDO:0035320
      label: early-onset familial hypoaldosteronism
  description: >-
    Aldosterone synthase deficiency also causes infantile salt wasting with
    hyponatremia, hyperkalemia and high renin, but aldosterone is low to normal.
  distinguishing_features:
  - Low to normal aldosterone in aldosterone synthase deficiency versus high aldosterone in PHA1
  - Response to fludrocortisone in aldosterone synthase deficiency
  evidence:
  - reference: PMID:41905953
    reference_title: "Congenital aldosterone deficiency and its resistance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "ASD must also be differentiated from another disease, pseudohypoaldosteronism type 1 (PHA1), which involves resistance to aldosterone."
    explanation: Names PHA1 and aldosterone synthase deficiency as mutual differential diagnoses.
- name: Secondary (transient) pseudohypoaldosteronism
  description: >-
    Transient renal aldosterone resistance from urinary tract infection or
    urinary tract anomalies produces renal salt loss, hyponatremia,
    hyperkalemia and high aldosterone in early infancy.
  distinguishing_features:
  - Urinary tract infection or obstructive anomaly on urine culture and renal imaging
  - Resolution after treatment of the underlying cause
  evidence:
  - reference: PMID:22397047
    reference_title: "Secondary pseudohypoaldosteronism caused by urinary tract infection associated with urinary tract anomalies: case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary pseudohypoaldosteronism type 1 develops due to transient aldosterone resistance in renal tubules and is characterized by renal sodium loss, hyponatremia, hyperkalemia and high plasma aldosterone levels."
    explanation: Secondary PHA reproduces the biochemical picture of PHA1.
  - reference: PMID:22397047
    reference_title: "Secondary pseudohypoaldosteronism caused by urinary tract infection associated with urinary tract anomalies: case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment is usually elimination of the underlying cause."
    explanation: Secondary PHA resolves once the underlying urinary tract cause is treated, unlike genetic systemic PHA1.
animal_models:
- name: betaENaC-deficient mouse
  species: Mouse
  genotype: Scnn1b-/- (germline targeted disruption)
  publication: PMID:9990092
  description: >-
    Germline disruption of the beta subunit gene produces neonatal hyponatremia
    with urinary sodium loss, hyperkalemia with low urinary potassium, raised
    aldosterone, and death within two days of birth.
  modeled_mechanisms:
  - target: Distal nephron ENaC sodium reabsorption failure
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Reproduces renal sodium wasting, hyperkalemia and hyperaldosteronism of
      human PHA1.
    limitations: >-
      Mice die within two days of birth, so the chronic course, extra-renal salt
      loss and response to salt supplementation cannot be studied in this
      germline model.
    evidence:
    - reference: PMID:9990092
      reference_title: "Disruption of the beta subunit of the epithelial Na+ channel in mice: hyperkalemia and neonatal death associated with a pseudohypoaldosteronism phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The phenotype of the betaENaC-deficient mice is similar to that of humans with pseudohypoaldosteronism type 1 and may provide a useful model to study the pathogenesis and treatment of this disorder."
      explanation: The authors state the knockout phenotype resembles human PHA1.
  - target: Airway epithelial sodium absorption failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      Neonatal knockout mice do not develop the lung liquid clearance failure
      seen in alphaENaC-null mice.
    limitations: >-
      Only the neonatal transition to air breathing was assessed; chronic airway
      surface liquid and mucociliary function, which carry the human airway
      phenotype, were not measured because the mice die within two days.
    evidence:
    - reference: PMID:9990092
      reference_title: "Disruption of the beta subunit of the epithelial Na+ channel in mice: hyperkalemia and neonatal death associated with a pseudohypoaldosteronism phenotype."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to alphaENaC-deficient mice, which die because of defective lung liquid clearance, neonatal betaENaC deficient mice did not die of respiratory failure and showed only a small increase in wet lung weight that had little, if any, adverse physiologic consequence."
      explanation: betaENaC loss has little effect on neonatal lung liquid clearance.
- name: Adult nephron-specific betaENaC knockout mouse
  species: Mouse
  genotype: Scnn1b Pax8/LC1 inducible nephron-specific knockout
  publication: PMID:28567665
  description: >-
    Inducible deletion of betaENaC in the adult nephron produces a severe
    PHA1-like phenotype with weight loss, hyperkalemia and dehydration but only
    minor salt wasting, rescued by a low-potassium diet.
  modeled_mechanisms:
  - target: Impaired distal potassium and hydrogen ion secretion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Reproduces severe hyperkalemia from loss of renal betaENaC.
    limitations: >-
      Adult induction bypasses the neonatal presentation of the human disease,
      and salt loss was minor, unlike the severe salt wasting of human PHA1B2.
    evidence:
    - reference: PMID:28567665
      reference_title: "Severe hyperkalemia is rescued by low-potassium diet in renal βENaC-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Upon induction, these mice present a severe PHA-1 phenotype with weight loss, hyperkalemia, and dehydration, but unlike the Scnn1aPax8/LC1 mice without persistent salt wasting."
      explanation: Renal betaENaC deletion causes a PHA1 phenotype dominated by hyperkalemia.

    label: pseudohypoaldosteronism, type IB2, autosomal recessive
parents:
- Pseudohypoaldosteronism type 1
- Autosomal recessive disease
notes: >-
  The Orphanet record cited here (ORPHA:171876, generalized
  pseudohypoaldosteronism type 1) covers all three ENaC subunit genes, so its
  phenotype frequencies and birth prevalence describe systemic PHA1 as a whole
  rather than the SCNN1B form alone. Several case series report fewer SCNN1B
  than SCNN1A families. No GeneReviews chapter covers this disorder or
  systemic PHA1 (Bookshelf index snapshot of 2026-09-10 plus a live PubMed
  title search), so case reports, case series and Orphanet form the
  phenotype baseline.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Biallelic (homozygous or compound heterozygous) SCNN1B loss-of-function
    variants; heterozygous parents are clinically unaffected. Consanguinity is
    common among reported families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:8589714
    reference_title: "Mutations in subunits of the epithelial sodium channel cause salt wasting with hyperkalaemic acidosis, pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations are homozygous in affected subjects, co-segregate with the disease"
    explanation: Homozygous ENaC alpha or beta subunit mutations co-segregate with the disease in consanguineous kindreds.
  - reference: PMID:35359893
    reference_title: "Case Report: A Novel Compound Heterozygote Mutation of the SCNN1B Gene Identified in a Chinese Familial Pseudohypoaldosteronism Disease Type I With Persistent Hyperkalemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis showed that the neonate suffered complex heterozygosity in the SCNN1B gene inherited from the parents, which is passed on in an autosomal recessive inheritance pattern."
    explanation: Compound heterozygous SCNN1B variants inherited from unaffected parents in an autosomal recessive pattern.

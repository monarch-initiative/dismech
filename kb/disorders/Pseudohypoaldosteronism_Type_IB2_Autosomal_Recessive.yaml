name: Pseudohypoaldosteronism Type IB2 Autosomal Recessive
category: Mendelian
creation_date: "2026-10-15T23:00:53Z"
synonyms:
- PHA1B2
- Autosomal recessive pseudohypoaldosteronism type 1B2
- SCNN1B-related systemic pseudohypoaldosteronism type 1
- Systemic pseudohypoaldosteronism type 1 due to SCNN1B deficiency
description: >-
  Pseudohypoaldosteronism type IB2 (PHA1B2) is the SCNN1B-related form of
  autosomal recessive, systemic (multi-organ) pseudohypoaldosteronism type 1.
  Biallelic loss-of-function variants in SCNN1B, which encodes the beta
  subunit of the amiloride-sensitive epithelial sodium channel (ENaC), abolish
  or severely reduce channel activity in every aldosterone-responsive
  epithelium. Failure of ENaC-mediated sodium reabsorption in the distal
  nephron causes renal salt wasting with hyponatremia, hypovolemia, and
  impaired potassium and hydrogen ion secretion, so affected infants present in
  the first weeks of life with vomiting, poor feeding, weight loss,
  dehydration, life-threatening hyperkalemia and metabolic acidosis despite
  markedly elevated renin and aldosterone and no response to mineralocorticoid
  therapy. Extra-renal ENaC loss adds salt loss through sweat, salivary glands
  and colon (elevated sweat electrolytes, miliaria-like rash) and, in the
  systemic PHA1 literature, excess airway surface liquid with recurrent chest
  symptoms. Unlike renal PHA1A, the systemic form does not remit and needs
  lifelong high-dose sodium chloride and bicarbonate with potassium-binding
  resins; dialysis may be needed for refractory hyperkalemia. The SCNN1A
  (PHA1B1) and SCNN1G (PHA1B3) forms share this mechanism and are separate
  MONDO concepts.

- name: Distal nephron ENaC sodium reabsorption failure
  description: >-
    In principal cells of the aldosterone-sensitive distal nephron and
    collecting duct, ENaC provides the rate-limiting apical step of sodium
    reabsorption. Without functional ENaC, aldosterone cannot drive sodium
    reabsorption, producing end-organ mineralocorticoid resistance and urinary
    salt wasting.

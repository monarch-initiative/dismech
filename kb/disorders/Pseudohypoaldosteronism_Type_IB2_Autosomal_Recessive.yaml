diagnosis:
- name: Biochemical and hormonal profile
  description: >-
    Neonatal hyponatremia, hyperkalemia and metabolic acidosis with markedly
    elevated plasma renin and aldosterone, after exclusion of congenital
    adrenal hyperplasia and other adrenal causes, suggest PHA1. The renal and
    systemic forms cannot be told apart by early presentation or by this
    profile.
  evidence:
  - reference: PMID:41457049
    reference_title: "Case Report: Compound Heterozygous SCNN1B Mutations Causing Pseudohypoaldosteronism Type 1B2 in Neonatal Twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings showed markedly elevated plasma renin and aldosterone levels, with no evidence of congenital adrenal hyperplasia or other metabolic disorders."
    explanation: Elevated renin and aldosterone with congenital adrenal hyperplasia excluded in SCNN1B twins.
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It was impossible to differentiate between types of PHA1 from early clinical presentation or the biochemical and hormonal profile."
    explanation: The biochemical profile does not separate renal from systemic PHA1.
- name: Sweat test
  description: >-
    A positive sweat test (elevated sweat electrolytes) reflects extra-renal
    ENaC loss and supports the systemic rather than the renal form.
  measurements:
  - preferred_term: sweat chloride and sodium
    term:
      id: LOINC:74993-7
      label: Chloride and sodium panel [Moles/volume] - Sweat
  notes: >-
    The panel is bound rather than either electrolyte alone, because this row says
    elevated sweat electrolytes without singling one out, and ENaC loss raises both.
    Two things in the release are easy to pick by mistake. Its sweat chloride codes
    include a toxicology-screen method pair that measures a different thing, and the
    word sweat matches about twenty questionnaire items about sweating, in instruments
    such as PROMIS, FACIT, PCL and the PHQ, none of which is a sweat assay. A narrative
    code for specialist review of sweat analysis also exists and names a result field
    rather than a test. Those are findings from the full 2.83 table, which holds the
    observation and panel codes; the Part question was put separately to the Monarch
    KG, which holds the Parts, and across its 38 sweat records the only Part is
    LOINC:LP7618-4, the specimen itself; there is no measurement Part for sweat
    chloride or sweat sodium. No reference range is bound: this row reports the test as
    positive and gives no electrolyte concentration, and the cystic fibrosis sweat
    chloride thresholds are a different disease's decision limits.
  evidence:
  - reference: PMID:31018202
    reference_title: "Systemic Pseudohypoaldosteronism Type 1 due to 3 Novel Mutations in SCNN1Aand SCNN1BGenes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients exhibited laboratory characteristics including severe hyponatremia, hyperkalemia, metabolic acidosis, elevated plasma renin, elevated aldosterone, and positive sweat tests, suggesting a diagnosis of systemic PHA1."
    explanation: Positive sweat tests contributed to the diagnosis of systemic PHA1.
- name: Molecular genetic testing of ENaC subunit genes
  description: >-
    Sequencing of SCNN1A, SCNN1B and SCNN1G (with NR3C2 for the renal form),
    usually by exome sequencing, confirms the diagnosis and assigns the
    subtype; biallelic SCNN1B variants define PHA1B2.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31301676
    reference_title: "Phenotypic diversity and correlation with the genotypes of pseudohypoaldosteronism type 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We advocate early genetic testing in patients with presumed PHA1, given the challenges in differentiating between patients with PHA1a and PHA1b."
    explanation: Genetic testing is needed to distinguish PHA1A from PHA1B.
  - reference: PMID:41457049
    reference_title: "Case Report: Compound Heterozygous SCNN1B Mutations Causing Pseudohypoaldosteronism Type 1B2 in Neonatal Twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This report broadens the mutational spectrum of SCNN1B and underscores the importance of early genetic testing in refractory neonatal electrolyte disturbances."
    explanation: Early genetic testing identified SCNN1B variants in refractory neonatal electrolyte disturbance.
treatments:
- name: High-dose sodium chloride supplementation
  description: >-
    Lifelong oral sodium chloride replacement, often in very large doses, is the
    mainstay of therapy for the systemic form; adherence is difficult and
    treatment discontinuation is a leading cause of death in some series.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE

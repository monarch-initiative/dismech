pathophysiology:
- name: Biallelic SCNN1B loss of function
  description: >-
    Biallelic frameshift, nonsense, splice-site or missense SCNN1B variants
    remove or impair the ENaC beta subunit. Truncated beta subunits can still
    support weak trafficking and assembly with alpha and gamma subunits, and the
    missense p.Gly37Ser variant lowers channel open probability, so most
    alleles drastically reduce rather than strictly abolish amiloride-sensitive
    sodium current.
  biological_scale: MOLECULAR

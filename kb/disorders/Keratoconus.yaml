- name: Irregular Astigmatism
  category: Eye
  description: >
    Irregular astigmatism arising from the conical, optically irregular corneal
    surface; poorly correctable with spectacles. Corresponds to the "Irregular
    Astigmatism and Optical Degradation" pathophysiology node.
  phenotype_term:
    preferred_term: Irregular astigmatism
    term:
      id: HP:0031792
      label: Irregular astigmatism
  notes: >-
    No frequency band is assigned: the cited review establishes irregular
    astigmatism as the characteristic optical consequence but does not
    quantify the proportion of patients affected.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is a bilateral and asymmetric disease which results in
      progressive thinning and steeping of the cornea leading to irregular
      astigmatism and decreased visual acuity.
    explanation: >-
      Directly attributes irregular astigmatism to the corneal thinning and
      steepening of keratoconus.
- name: Reduced Visual Acuity
  category: Eye
  description: >
    Progressive blurring and decrease of visual acuity, the dominant symptomatic
    burden of keratoconus and the reason it is a leading cause of keratoplasty
    in young adults.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
    clinical_course: PROGRESSIVE
  notes: >-
    No frequency band is assigned; the cited sources establish visual loss as a
    characteristic consequence without a quantified proportion.
  evidence:
  - reference: PMID:24357835
    reference_title: "The pathogenesis of keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus (KC) is a common degenerative condition that frequently
      results in visual loss with an onset typically in early adulthood.
    explanation: >-
      States that keratoconus frequently results in visual loss with
      early-adulthood onset.
- name: Corneal Scarring
  category: Eye
  description: >
    Vision-impairing corneal stromal scarring, characteristically following
    resolution of acute corneal hydrops, and a principal indication for
    keratoplasty. Corresponds to the "Corneal Stromal Scarring" pathophysiology
    node.
  phenotype_term:
    preferred_term: Corneal scarring
    term:
      id: HP:0000559
      label: Corneal scarring
  evidence:
  - reference: PMID:24491416
    reference_title: "Acute corneal hydrops in keratoconus - new perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although usually self-limiting, with clinical signs of edema typically
      resolving after 3 months, it often leaves a vision-impairing scar,
      necessitating and expediting the need for corneal transplantation.
    explanation: >-
      Documents vision-impairing scarring as the usual residuum of acute
      hydrops in keratoconus.
- name: Corneal Stromal Oedema
  category: Eye
  description: >
    Marked oedema of the corneal stroma and epithelium during acute corneal
    hydrops, when aqueous humour enters the stroma through a break in Descemet
    membrane. Typically resolves over about three months. Corresponds to the
    "Stromal Imbibition and Acute Corneal Oedema" pathophysiology node.
  phenotype_term:
    preferred_term: Corneal stromal oedema
    term:
      id: HP:0012040
      label: Corneal stromal edema
    temporality: ACUTE
  notes: >-
    No frequency band is assigned: acute hydrops is a recognised complication
    of keratoconus but the cited source does not quantify what proportion of
    patients experience it.
  evidence:
  - reference: PMID:24491416
    reference_title: "Acute corneal hydrops in keratoconus - new perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute corneal hydrops is an incompletely understood complication of
      keratoconus, characterized by marked corneal edema caused by a break in
      Descemet membrane, allowing aqueous to enter the corneal stroma and
      epithelium.
    explanation: >-
      Names marked corneal oedema of the stroma and epithelium as the defining
      clinical finding of acute hydrops in keratoconus.
- name: Corneal Iron Line (Fleischer Ring)
  category: Eye
  description: >
    Arcuate or annular deposition of iron in the corneal epithelial basement
    membrane at the base of the cone - the Fleischer ring - one of the classic
    slit-lamp signs of keratoconus.
  phenotype_term:
    preferred_term: Fleischer ring
    term:
      id: HP:6001232
      label: Corneal iron line
  notes: >-
    preferred_term uses the clinical eponym; the HPO term is the more general
    "Corneal iron line", whose own definition names keratoconus as a typical
    setting. No frequency band is assigned - the cited source lists it as a
    classic feature without quantifying it.
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Documents epithelial basement-membrane iron deposition as a classic
      feature of keratoconus.
- name: Vogt striae
  category: Eye
  description: >
    Fine vertical stress lines in the posterior cornea caused by compression of
    Descemet membrane; a characteristic slit-lamp sign of clinically manifest
    keratoconus.
  notes: >-
    No phenotype term is bound because the current local HPO cache has no
    specific Vogt-striae term. No frequency band is asserted by this source.
  evidence:
  - reference: PMID:20537579
    reference_title: "Keratoconus: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vogt's striaes, which are fine vertical lines produced by Descemet's membrane compression, is another characteristic sign."
    explanation: >-
      The review directly defines Vogt striae and identifies them as a
      characteristic keratoconus sign.
histopathology:
- name: Stromal Thinning
  description: >
    Reduction in corneal stromal thickness, the most consistently reported
    microscopic finding in keratoconus and the tissue-level correlate of the
    "Progressive Stromal Thinning" pathophysiology node.
  notes: >-
    No finding_term is bound: the NCIT Histopathology Result branch has no
    term for corneal stromal thinning, and per repository convention a missing
    term is preferable to omitting a real finding or forcing a poor-fit term.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most
      commonly observed histopathological findings.
    explanation: >-
      Explicitly names stromal thinning among the most commonly observed
      histopathological findings.
- name: Breaks in Bowman's Layer
  description: >
    Ruptures of the anterior limiting membrane (Bowman's layer), reported as a
    classic histopathologic feature and the tissue-level correlate of the
    "Anterior Limiting Membrane Rupture" pathophysiology node.
  notes: >-
    No finding_term is bound; NCIT has no corresponding corneal morphologic
    finding term.
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Names breaks in Bowman's layer among the classic histopathologic
      features of keratoconus.
- name: Iron Deposition in the Epithelial Basement Membrane
  description: >
    Deposition of iron in the corneal epithelial basement membrane, the
    microscopic basis of the clinically visible Fleischer ring.
  notes: >-
    No finding_term is bound; NCIT has no corneal iron-deposition morphologic
    finding term. The clinical counterpart is curated as the "Corneal Iron
    Line (Fleischer Ring)" phenotype.
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Names epithelial basement-membrane iron deposition among the classic
      histopathologic features.
genetic:
- name: Polygenic susceptibility architecture
  relationship_type: SUSCEPTIBILITY
  notes: >-
    No single gene entry is given for the GWAS signal itself: 36 loci were
    identified and no individual locus is causative on its own. Per-gene
    entries below record the most frequently investigated candidate loci, whose
    individual causal validity is not established.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the first large scale genome-wide association study of
      keratoconus including 4,669 cases and 116,547 controls.
    explanation: >-
      Establishes the scale of the GWAS underpinning the polygenic
      susceptibility model.
  - reference: PMID:39535071
    reference_title: "Developing and validating a comprehensive polygenic risk score to enhance keratoconus risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PRS models demonstrated significant predictive capabilities in EstBB,
      with the SBayesRC model achieving the highest OR of 2.28 per standard
      deviation increase in PRS
    explanation: >-
      A polygenic risk score built from the GWAS predicts keratoconus liability
      in an independent biobank, which is the operational demonstration that the
      polygenic architecture recorded here carries real predictive signal rather
      than being a statistical artefact of the discovery cohort.
  - reference: PMID:39535071
    reference_title: "Developing and validating a comprehensive polygenic risk score to enhance keratoconus risk prediction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In UKB, we found that adding the best-performing PRS to a model containing
      corneal measurements increased the AUC from 0.84 to 0.88 (P = 0.012 for
      difference)
    explanation: >-
      Shows the polygenic signal adds information beyond corneal measurements,
      relevant to the potential for genetic risk stratification raised in the
      primary-pathomechanism knowledge gap.
- name: COL5A1
  gene_term:
    preferred_term: COL5A1
    term:
      id: hgnc:2209
      label: COL5A1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    COL5A1 encodes a fibrillar collagen of the corneal stroma. It reaches
    genome-wide significance in the multi-ethnic GWAS (rs3118518) and is one of
    the six loci previously associated with keratoconus that the GWAS
    recovered; candidate-gene work had separately prioritised rs1536482 and
    rs7044529 for replication genotyping.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      9q34.3 9 137412655..137566891 rs3118518 A G 0.270 0.024 1.83E −28
      COL5A1,RXRA
    explanation: >-
      The final trans-ethnic meta-analysis table gives the genome-wide
      significant COL5A1 association (rs3118518).
  - reference: PMID:30816092
    reference_title: "[Search for genetic markers for precise diagnostics of keratoconus]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the following candidate variants were selected for genotyping in the
      Russian population of patients with keratoconus: rs1536482 and rs7044529
      in the COL5A1 gene
    explanation: >-
      A systematic review of keratoconus markers selects COL5A1 variants as
      prioritised candidates after replication assessment.
- name: HGF
  gene_term:
    preferred_term: HGF
    term:
      id: hgnc:4893
      label: HGF
  relationship_type: SUSCEPTIBILITY
  notes: >-
    HGF variants rs5745752 and rs2286194 were among the candidates prioritised
    on the basis of replication evidence.
  evidence:
  - reference: PMID:30816092
    reference_title: "[Search for genetic markers for precise diagnostics of keratoconus]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rs5745752 and rs2286194 in the HGF gene"
    explanation: >-
      Identifies the prioritised HGF candidate variants for keratoconus
      genotyping.
- name: VSX1
  gene_term:
    preferred_term: VSX1
    term:
      id: hgnc:12723
      label: VSX1
  relationship_type: DISPUTED
  notes: >-
    VSX1 is the most historically cited candidate gene for keratoconus but its
    causal role is contested; it is listed here as an analysed marker whose
    validity is unsettled amid broad genetic heterogeneity.
  evidence:
  - reference: PMID:30816092
    reference_title: "[Search for genetic markers for precise diagnostics of keratoconus]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis included markers in VSX1, SOD1, ZEB1, LOX, CAST, DOCK9,
      TGFBI, HGF, MAP3K19, KCND3, COL4A3, COL4A4, COL5A1, FNDC3B, FOXO1,
      BANP-ZNF469, MPDZ-NF1B, WNT10A genes.
    explanation: >-
      VSX1 appears among the analysed candidate markers but was not among the
      variants prioritised for replication genotyping, consistent with disputed
      status.
  - reference: PMID:30816092
    reference_title: "[Search for genetic markers for precise diagnostics of keratoconus]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The studies of causal mutations indicate the genetic heterogeneity of
      keratoconus, which complicates the development of a diagnostic panel.
    explanation: >-
      Supports the framing that no single candidate gene, VSX1 included, has
      established causal primacy.
- name: LOX
  gene_term:
    preferred_term: LOX
    term:
      id: hgnc:6664
      label: LOX
  relationship_type: SUSCEPTIBILITY
  notes: >-
    LOX (lysyl oxidase) catalyses the collagen and elastin cross-linking that
    determines stromal tensile strength - the same chemistry that riboflavin/UV-A
    corneal cross-linking supplies therapeutically - making it both a
    mechanistically attractive and a statistically supported locus. Unlike VSX1
    (typed DISPUTED here), LOX reaches genome-wide significance in the
    multi-ethnic GWAS with an accompanying eQTL effect on its own transcription,
    so the SUSCEPTIBILITY typing does not rest on the shared
    "analysed markers" sentence of the candidate-marker review.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5q23.2 5 121269498..121426675 rs840464 T G 0.233 0.025 1.72E −20
      SRFBP1,LOX
    explanation: >-
      The final trans-ethnic meta-analysis table gives the genome-wide
      significant LOX-locus association (rs840464), an actual association
      result rather than mere inclusion among analysed markers.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LOX encodes lysyl oxidase, an enzyme that initiates the cross-linking of
      collagens and elastin
    explanation: >-
      Supplies the mechanistic rationale linking the LOX locus to the stromal
      collagen cross-linking that determines corneal tensile strength.
- name: COL12A1
  gene_term:
    preferred_term: COL12A1
    term:
      id: hgnc:2188
      label: COL12A1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    COL12A1 carries the strongest coding signal in the multi-ethnic GWAS: a
    missense variant (rs35523808, p.Glu2160Val) predicted deleterious. Collagen
    XII localises to Bowman's layer and the interfibrillar stromal matrix,
    connecting the locus directly to the "Anterior Limiting Membrane Rupture"
    and "Progressive Stromal Thinning" pathophysiology nodes.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a missense and potentially deleterious variant within COL12A1
    explanation: >-
      Identifies a genome-wide significant, potentially deleterious COL12A1
      missense variant as a keratoconus association.
- name: FNDC3B
  gene_term:
    preferred_term: FNDC3B
    term:
      id: hgnc:24670
      label: FNDC3B
  relationship_type: SUSCEPTIBILITY
  notes: >-
    FNDC3B (rs4894414) is one of the six loci previously associated with
    keratoconus that the multi-ethnic GWAS recovered at genome-wide
    significance. It is transcriptionally downstream of KLF5, the corneal
    epithelial identity factor also implicated at this GWAS, placing it in the
    cell-differentiation arm of the disease mechanism rather than the
    collagen-matrix arm.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suppressed levels of FNDC3B, another gene associated with keratoconus in
      our study
    explanation: >-
      Names FNDC3B as a keratoconus-associated gene and links it to KLF5-driven
      corneal epithelial differentiation.
- name: ZNF469
  gene_term:
    preferred_term: ZNF469
    term:
      id: hgnc:23216
      label: ZNF469
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ZNF469 is the best-known corneal-thickness locus and is associated with
    keratoconus in a direction that dissociates the two traits: the risk alleles
    raise central corneal thickness yet increase keratoconus risk. The GWAS
    authors use exactly this divergence to argue that mechanisms of corneal
    fragility independent of corneal thickness contribute to keratoconus.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      alleles upstream of the ZNF469 locus that is associated with a higher CCT
      but an increased risk for keratoconus
    explanation: >-
      Documents the ZNF469 association and its counterintuitive direction
      relative to central corneal thickness.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This supports the view that other mechanisms of loss of corneal integrity
      and corneal fragility, independent of corneal thickness, contribute to
      the pathogenesis of keratoconus.
    explanation: >-
      The authors' own interpretation that thickness-independent corneal
      fragility mechanisms operate, which is why ZNF469 is typed as a
      susceptibility rather than a thickness-proxy locus.
- name: ALDH3A1
  gene_term:
    preferred_term: ALDH3A1
    term:
      id: hgnc:405
      label: ALDH3A1
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ALDH3A1 (rs4646785) encodes a corneal crystallin that is a major structural
    and protective component of the corneal stroma and epithelium, and is
    upregulated in keratoconus corneas. The associated SNP is also a
    significant eQTL for the gene, giving a candidate regulatory mechanism.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ALDH3A1 encodes a corneal crystallin, a major component of the corneal
      stroma and epithelium that is upregulated in keratoconus corneas compared
      to controls
    explanation: >-
      Links the ALDH3A1 association to a corneal-stroma protein demonstrably
      dysregulated in keratoconus tissue.
- name: ITGA2
  gene_term:
    preferred_term: ITGA2
    term:
      id: hgnc:6137
      label: ITGA2
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ITGA2 (rs12515400) encodes the alpha-2 subunit of the integrin alpha-2/beta-1
    collagen receptor, which promotes type I collagen polymerisation - a
    plausible route from a common variant to the collagen-matrix integrity
    defect the GWAS implicates.
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The protein encoded by this gene participates in complexes of integrin
      α2β1, which are collagen receptors
    explanation: >-
      Gives the collagen-receptor function of the ITGA2 product at the
      associated locus.
inheritance:
- name: Polygenic inheritance
  description: >
    Common keratoconus is a complex, polygenic trait: 36 GWAS loci with common
    variants explaining 12.5% of the genetic variance, with a strong familial
    aggregation signal (odds ratio 6.42 for a positive family history) but no
    single Mendelian locus.
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common variants associated with keratoconus explain 12.5% of the genetic variance"
    explanation: >-
      Quantifies a polygenic common-variant contribution, supporting polygenic
      rather than Mendelian inheritance.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical studies provide strong indications of a major role for genes in its etiology."
    explanation: >-
      Corroborates a substantial genetic contribution to keratoconus aetiology.
environmental:
- name: Eye rubbing
  influences_mechanisms:
  - target: Chronic Mechanical Eye Rubbing
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The entry models the exposure itself as a node, so this link is an
      identity rather than a causal step: habitual rubbing and chronic
      mechanical loading of the cornea are the same thing. Rubbing carries the
      largest modifiable effect in this disease, which is why counselling to
      stop is the first intervention.
    evidence:
    - reference: PMID:31498247
      reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "eye rubbing, family history of keratoconus, allergy, asthma, and eczema were the most important risk factors for keratoconus according to the available evidence"
      explanation: >-
        Names eye rubbing first among the most important risk factors for
        keratoconus, the mechanical exposure this node represents.
  description: >
    Habitual mechanical eye rubbing is the best-replicated modifiable
    environmental risk factor for keratoconus (OR 3.09) and is a target of
    patient counselling.
  effect: Increases risk of developing and of progressing keratoconus
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      eye rubbing, family history of keratoconus, allergy, asthma, and eczema
      were the most important risk factors for keratoconus according to the
      available evidence
    explanation: >-
      Identifies eye rubbing as among the most important risk factors in the
      most comprehensive meta-analysis to date.
- name: Atopic diathesis (allergy, asthma, eczema)
  influences_mechanisms:
  - target: Chronic Mechanical Eye Rubbing
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Atopy acts largely through itch: allergic conjunctivitis provokes the
      rubbing that damages the cornea. Targeting the rubbing node rather than
      a corneal node records that indirection, which is why treating the
      allergy is a way of treating the keratoconus risk.
    evidence:
    - reference: PMID:31498247
      reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The odds ratio of eye rubbing, family history of keratoconus, allergy, asthma, and eczema was 3.09 (95% CI: 2.17-4.00), 6.42 (95% CI: 2.59-10.24), 1.42 (95% CI: 1.06-1.79), 1.94 (95% CI: 1.30-2.58), and 2.95 (95% CI: 1.30-4.59), respectively."
      explanation: >-
        Gives odds ratios for allergy, asthma and eczema alongside eye
        rubbing, the atopic conditions that provoke rubbing behaviour.
  description: >
    Atopic disease raises keratoconus risk (allergy OR 1.42, asthma OR 1.94,
    eczema OR 2.95), plausibly at least partly through the itch-driven eye
    rubbing it provokes and through ocular surface inflammation.
  effect: Increases risk of keratoconus
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The odds ratio of eye rubbing, family history of keratoconus, allergy,
      asthma, and eczema was 3.09 (95% CI: 2.17-4.00), 6.42 (95% CI:
      2.59-10.24), 1.42 (95% CI: 1.06-1.79), 1.94 (95% CI: 1.30-2.58), and 2.95
      (95% CI: 1.30-4.59), respectively.
    explanation: >-
      Quantifies the atopy-associated odds ratios for keratoconus.

name: Keratoconus
creation_date: "2026-07-30T00:00:00Z"
category: Complex
disease_term:
  preferred_term: keratoconus
  term:
    id: MONDO:0015486
    label: keratoconus
description: >
  Keratoconus is the most common corneal ectatic disorder: a bilateral,
  typically asymmetric condition in which the central/paracentral cornea
  progressively thins, loses biomechanical rigidity, and bulges forward into a
  cone. Onset is usually in the second-to-third decade with progression until
  about the fourth decade, and the resulting irregular astigmatism and
  higher-order aberration produce blurred vision that spectacles correct poorly.
  Aetiology is multifactorial: a polygenic susceptibility implicating corneal
  collagen matrix integrity and cell differentiation pathways interacts with
  environmental exposures, above all chronic mechanical eye rubbing and the
  atopic diathesis. Although classically labelled "non-inflammatory", tear-film
  studies consistently find elevated IL-6, TNF-alpha, and MMP-9, and a
  protease/anti-protease imbalance is a leading candidate for the stromal
  matrix loss; increased oxidative stress activating collagenase and gelatinase
  is the parallel redox arm of that same protease drive, and increased
  keratocyte apoptosis is reported alongside it. Acute corneal hydrops - a break in Descemet membrane with
  stromal imbibition of aqueous - is a characteristic complication that usually
  resolves but leaves a vision-limiting scar. Riboflavin/UV-A corneal
  collagen cross-linking is the established disease-modifying therapy for
  progressive disease; visual rehabilitation relies on rigid or scleral contact
  lenses, and corneal transplantation is reserved for advanced or scarred
  corneas.
parents:
- Corneal disorder
- Corneal ectatic disorder
synonyms:
- KC
- Conical cornea
- Noninflammatory corneal thinning

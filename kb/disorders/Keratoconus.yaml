notes: >-
  MONDO:0015486 carries an HP xref (HP:0000563), reflecting that keratoconus is
  a "disease-like phenotype" - it is both a curated disease entry here and the
  HPO phenotype term used by other entries (e.g. syndromic keratoconus in Down
  syndrome, Leber congenital amaurosis, and connective-tissue disorders). MONDO
  additionally lists two Orphanet cross-references (Orphanet:2335 and
  Orphanet:156071) and the OMIM phenotypic series OMIMPS:148300; no single
  Mendelian locus accounts for the common disease.
pathophysiology:
- name: Polygenic Corneal Matrix Susceptibility
  biological_scale: MOLECULAR
  description: >
    The common form of keratoconus has a polygenic architecture. The first
    large-scale multi-ethnic GWAS identified 36 genome-wide significant loci and
    implicated dysregulation of corneal collagen matrix integrity and of cell
    differentiation pathways as primary disease-causing mechanisms, with common
    variants explaining 12.5% of the genetic variance. Candidate-gene studies
    have additionally nominated a heterogeneous set of loci (VSX1, LOX, ZEB1,
    COL5A1, HGF, ZNF469 and others) whose individual causal validity remains
    unsettled.
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DYSREGULATED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Corneal Stromal Extracellular Matrix Degradation
    description: >
      Genetically encoded weakness of collagen matrix integrity lowers the
      threshold at which matrix turnover becomes net-catabolic.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified significant association with 36 genomic loci that, for
      the first time, implicate both dysregulation of corneal collagen matrix
      integrity and cell differentiation pathways as primary disease-causing
      mechanisms.
    explanation: >-
      A GWAS of 4,669 cases and 116,547 controls identifies collagen matrix
      integrity and cell differentiation as the implicated disease mechanisms.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common variants associated with keratoconus explain 12.5% of the genetic variance"
    explanation: >-
      Quantifies the polygenic contribution, supporting a susceptibility rather
      than a Mendelian model for common keratoconus.
- name: Chronic Mechanical Eye Rubbing
  biological_scale: ORGANISM
  description: >
    Habitual, often vigorous eye rubbing - frequently driven by the itch of
    atopic conjunctivitis or allergy - is the best-replicated modifiable risk
    exposure for keratoconus, carrying roughly a three-fold increase in odds. It
    delivers repetitive mechanical trauma to the corneal surface.
  notes: >-
    No biological_processes term is asserted. Eye rubbing is an organism-scale
    behaviour, not a molecular or cellular process, so a GO term does not
    belong on this node; the cellular response it provokes is captured
    downstream on "Ocular Surface Inflammatory Mediator Release".
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Ocular Surface Inflammatory Mediator Release
    description: >
      Rubbing acutely raises tear levels of MMP-13, IL-6, and TNF-alpha.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The odds ratio of eye rubbing, family history of keratoconus, allergy,
      asthma, and eczema was 3.09 (95% CI: 2.17-4.00), 6.42 (95% CI:
      2.59-10.24), 1.42 (95% CI: 1.06-1.79), 1.94 (95% CI: 1.30-2.58), and 2.95
      (95% CI: 1.30-4.59), respectively.
    explanation: >-
      A meta-analysis of 29 studies quantifies eye rubbing as an approximately
      three-fold risk factor, alongside family history and atopy.
- name: Ocular Surface Inflammatory Mediator Release
  biological_scale: CELLULAR
  description: >
    Despite the traditional "non-inflammatory" label, tears from keratoconus
    patients consistently show elevated IL-6, TNF-alpha, and MMP-9, and eye
    rubbing acutely raises MMP-13, IL-6, and TNF-alpha. These mediators supply
    the proteolytic and cytokine drive for stromal matrix breakdown.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  downstream:
  - target: Corneal Stromal Extracellular Matrix Degradation
    description: >
      Cytokine and matrix-metalloproteinase excess shifts stromal turnover
      toward net matrix loss.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25931166
    reference_title: "Keratoconus: an inflammatory disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of studies in the tears of patients with keratoconus have
      found increased levels of interleukin-6 (IL-6), tumor necrosis
      factor-α(TNF-α), and matrix metalloproteinase (MMP)-9.
    explanation: >-
      A literature review of biochemical changes documents the tear cytokine and
      MMP-9 elevation that defines this node.
  - reference: PMID:25931166
    reference_title: "Keratoconus: an inflammatory disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eye rubbing, a proven risk factor for keratoconus, has been also shown
      recently to increase the tear levels of MMP-13, IL-6, and TNF-α.
    explanation: >-
      Links the mechanical-trauma node upstream to this mediator node by showing
      that rubbing itself raises the same mediators.
- name: Corneal Oxidative Stress
  biological_scale: CELLULAR
  description: >
    The keratoconic cornea sits under increased oxidative stress, and that
    oxidative burden activates the collagenase and gelatinase enzymes that
    degrade stromal collagen. This is the redox arm of the protease drive
    modelled downstream, distinct from the cytokine arm supplied by the ocular
    surface.
  notes: >-
    No upstream edge is asserted into this node. The cited review states that
    oxidative stress activates the degradative enzymes but does not establish
    what initiates the oxidative stress in keratoconus, so it is modelled as an
    independent contributor rather than placed downstream of rubbing or of the
    inflammatory-mediator node.
  biological_processes:
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal Stromal Extracellular Matrix Degradation
    description: >
      Oxidative stress activates collagenase and gelatinase enzymes, supplying
      the proteolytic activity that degrades stromal collagen.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38830186
    reference_title: "The Pathophysiology of Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased oxidative stress leads to the activation of collagenase and gelatinase enzymes."
    explanation: >-
      A review dedicated to keratoconus pathophysiology states the
      oxidative-stress-to-protease-activation step directly, which is the causal
      claim this node and its downstream edge encode.
- name: Keratocyte Apoptosis
  biological_scale: CELLULAR
  description: >
    Increased apoptotic death of keratocytes, the resident stromal cells that
    synthesise and maintain corneal collagen and proteoglycan, is reported in
    keratoconus alongside the elevated proinflammatory cytokine profile.
  notes: >-
    No upstream edge from "Ocular Surface Inflammatory Mediator Release" is
    asserted. The cited review reports the cytokine elevation and the keratocyte
    apoptosis as co-observed features ("along with"), which does not establish
    that the cytokines cause the apoptosis; asserting that edge would overstate
    the source.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Thinning
    description: >
      Depletion of the keratocyte population that synthesises and maintains
      stromal matrix contributes to net loss of stromal substance. The cited
      review reports the apoptosis as an observed feature of the disease and
      does not itself demonstrate this route, hence the indirect typing.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38830186
    reference_title: "The Pathophysiology of Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of proinflammatory cytokines like IL-1b, IL-6, IL-17, and
      TNF-α have been observed, along with increased apoptosis of keratocytes.
    explanation: >-
      Establishes increased keratocyte apoptosis as a reported cellular feature
      of keratoconus, co-observed with the tear and stromal cytokine elevation
      modelled separately.
- name: Corneal Stromal Extracellular Matrix Degradation
  biological_scale: TISSUE
  description: >
    An imbalance between degradative enzymes and their proteinase inhibitors in
    the corneal stroma produces net loss of collagen and proteoglycan matrix.
    This protease/anti-protease imbalance, together with a possible role for the
    interleukin-1 system, is the long-standing laboratory candidate for the
    tissue loss that defines keratoconus.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Thinning
    description: >
      Sustained net matrix catabolism depletes stromal collagen and reduces
      corneal thickness.
    causal_link_type: DIRECT
  - target: Anterior Limiting Membrane Rupture
    description: >
      Sustained net matrix catabolism breaches Bowman's layer.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory studies suggest a role for degradative enzymes and proteinase
      inhibitors and a possible role for the interleukin-1 system in its
      pathogenesis, but these roles need to be more clearly defined.
    explanation: >-
      The classic review states the degradative-enzyme/proteinase-inhibitor
      mechanism, and explicitly flags that it is not yet fully defined.
- name: Progressive Stromal Thinning
  biological_scale: TISSUE
  description: >
    Progressive loss of thickness of the central/paracentral corneal stroma,
    the most consistently reported histopathological finding in keratoconus and
    the lesion that pentacam/tomographic pachymetry maps clinically.
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Loss of Corneal Biomechanical Rigidity
    description: >
      Reduced stromal thickness reduces the cornea's resistance to intraocular
      pressure.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most
      commonly observed histopathological findings.
    explanation: >-
      Names progressive stromal thinning as a commonest histopathological
      finding and places ectasia downstream of it.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Independently corroborates stromal thinning as a classic histopathologic
      feature.
- name: Anterior Limiting Membrane Rupture
  biological_scale: TISSUE
  description: >
    Breaks in the anterior limiting membrane (Bowman's layer), the acellular
    collagenous lamina between the corneal epithelial basement membrane and the
    stroma. This is a distinct lesion from stromal thinning - a different
    anatomical substrate - and is reported alongside it as a classic
    histopathological feature.
  notes: >-
    The downstream edge to biomechanical rigidity is typed
    INDIRECT_UNKNOWN_INTERMEDIATES rather than DIRECT. Both cited snippets
    enumerate Bowman's-layer breaks as a histopathological finding; neither
    demonstrates a biomechanical consequence. The standard counter-observation
    is that Bowman's layer is ablated wholesale in photorefractive keratectomy
    without inducing ectasia, which argues its independent structural
    contribution is modest.
  locations:
  - preferred_term: anterior limiting lamina of cornea
    term:
      id: UBERON:0004370
      label: anterior limiting lamina of cornea
  downstream:
  - target: Loss of Corneal Biomechanical Rigidity
    description: >
      Loss of the Bowman's-layer boundary removes a stiff anterior lamina that
      may contribute to the cornea's resistance to intraocular pressure. The
      cited sources establish the lesion, not the biomechanical consequence.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most
      commonly observed histopathological findings.
    explanation: >-
      Names anterior-limiting-membrane rupture as a commonest histopathological
      finding, listed as a finding distinct from stromal thinning.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Independently corroborates breaks in Bowman's layer as a classic
      histopathologic feature separate from stromal thinning.
- name: Loss of Corneal Biomechanical Rigidity
  biological_scale: TISSUE
  description: >
    The thinned, matrix-depleted cornea has reduced rigidity, so normal
    intraocular pressure produces progressive distortion and focal thinning.
    This biomechanical failure is the step targeted by collagen cross-linking.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal Ectasia and Conical Protrusion
    description: >
      A cornea that cannot resist intraocular pressure bulges forward into a
      cone.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is characterised by reduced rigidity of the cornea with
      distortion and focal thinning that causes blurred vision, however, the
      pathogenetic mechanisms are unknown.
    explanation: >-
      Defines reduced corneal rigidity with distortion and focal thinning as the
      characterising biomechanical abnormality.
  - reference: PMID:38830186
    reference_title: "The Pathophysiology of Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biomechanical structural failures in the cornea seem to be the primary
      militating factors in keratoconus etiology and progression.
    explanation: >-
      A dedicated pathophysiology review places biomechanical structural failure
      as the primary driver of both aetiology and progression, which is the role
      this node occupies in the pathograph.
- name: Corneal Ectasia and Conical Protrusion
  biological_scale: TISSUE
  description: >
    Forward bulging (ectasia) of the central/paracentral cornea into the
    characteristic cone, producing progressive steepening. This is the defining
    structural lesion of keratoconus and the substrate for its optical
    consequences and for acute hydrops.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Irregular Astigmatism and Optical Degradation
    description: >
      An irregular conical surface refracts light irregularly.
    causal_link_type: DIRECT
  - target: Descemet Membrane Rupture
    description: >
      Progressive ectatic stretching predisposes to a break in Descemet
      membrane.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most

genetic:
- name: Systemic and ocular associations
  notes: >-
    Keratoconus has recognized ocular and systemic associations including Leber
    congenital amaurosis, atopy, Down syndrome, and the connective tissue
    disorders Ehlers-Danlos syndrome and Marfan syndrome. Multiple candidate
    genes (e.g., VSX1, ZNF469, and collagen genes such as COL4A3/COL4A4) have been
    implicated, but the etiology remains incompletely understood.
  evidence:
  - reference: PMID:32965942
    reference_title: Collagen Cross Linking for Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "several ocular and systemic associations exist, like Leber congenital amaurosis, atopy, Down syndrome, and the connective tissue disorders of Ehlers-Danlos and Marfan syndromes."
    explanation: Lists the recognized ocular and systemic associations of keratoconus.
treatments:
- name: Corneal Collagen Cross-Linking (CXL)
  description: >-
    Photochemical stiffening of the corneal stroma using riboflavin (vitamin B2)
    as a photosensitizer activated by ultraviolet-A light, inducing covalent
    cross-links between collagen molecules that increase corneal rigidity and halt
    progression of the ectasia.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  evidence:
  - reference: PMID:28495149
    reference_title: United States Multicenter Clinical Trial of Corneal Collagen Crosslinking for Keratoconus Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal collagen crosslinking was effective in improving the maximum keratometry value, CDVA, and UCVA in eyes with progressive keratoconus 1 year after treatment, with an excellent safety profile."
    explanation: Randomized multicenter trial demonstrating efficacy and safety of CXL for progressive keratoconus.
  - reference: PMID:28495149
    reference_title: United States Multicenter Clinical Trial of Corneal Collagen Crosslinking for Keratoconus Treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the CXL treatment group, the maximum keratometry value decreased by 1.6 diopters (D) from baseline to 1 year, whereas keratoconus continued to progress in the control group."
    explanation: Quantifies halting of progression with CXL versus continued progression in controls.
  - reference: PMID:32965942
    reference_title: Collagen Cross Linking for Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This collagen crosslinking increases the tensile strength and rigidity of the cornea, preventing further thinning and ectasia."
    explanation: Describes the biomechanical mechanism by which CXL arrests keratoconus progression.
- name: Rigid Gas-Permeable Contact Lenses
  description: >-
    Rigid gas-permeable contact lenses mask the irregular corneal surface and
    restore functional vision as the disease progresses beyond spectacle
    correction.
  treatment_term:
    preferred_term: therapeutic contact lens usage
    term:
      id: MAXO:0001580
      label: therapeutic contact lens usage
  evidence:
  - reference: PMID:32965942
    reference_title: Collagen Cross Linking for Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "as the disease progresses, rigid gas-permeable contact lenses are required"
    explanation: Documents rigid gas-permeable contact lenses as management for progressive keratoconus.
- name: Corneal Transplantation
  description: >-
    In advanced keratoconus with scarring or contact-lens intolerance, corneal
    transplantation (deep anterior lamellar keratoplasty or penetrating
    keratoplasty) replaces the ectatic cornea.
  treatment_term:
    preferred_term: corneal transplantation
    term:
      id: MAXO:0010034
      label: corneal transplantation
  evidence:
  - reference: PMID:32965942
    reference_title: Collagen Cross Linking for Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a small but significant proportion of patients, disease progression may require eventual corneal transplantation."
    explanation: Identifies corneal transplantation as treatment for advanced progressive disease.

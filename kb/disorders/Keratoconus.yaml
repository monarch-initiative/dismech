- name: Contact lens wear
  influences_mechanisms:
  - target: Chronic Mechanical Eye Rubbing
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Lens wear reaches this node through the same named intermediate as atopy,
      irritation provoking rubbing, so it carries the same link type. What is
      uncertain here is not the intermediate but the direction: lenses are also
      the commonest treatment for the refractive error keratoconus produces, so
      wearers are enriched for existing disease. That confounding is why the
      effect is graded PREDISPOSES rather than anything stronger.
    evidence:

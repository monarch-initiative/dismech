notes: >-
  MONDO:0015486 carries an HP xref (HP:0000563), reflecting that keratoconus is
  a "disease-like phenotype" - it is both a curated disease entry here and the
  HPO phenotype term used by other entries (e.g. syndromic keratoconus in Down
  syndrome, Leber congenital amaurosis, and connective-tissue disorders). MONDO
  additionally lists two Orphanet cross-references (Orphanet:2335 and
  Orphanet:156071) and the OMIM phenotypic series OMIMPS:148300; no single
  Mendelian locus accounts for the common disease.
pathophysiology:
- name: Polygenic Corneal Matrix Susceptibility
  biological_scale: MOLECULAR
  description: >
    The common form of keratoconus has a polygenic architecture. The first
    large-scale multi-ethnic GWAS identified 36 genome-wide significant loci and
    implicated dysregulation of corneal collagen matrix integrity and of cell
    differentiation pathways as primary disease-causing mechanisms, with common
    variants explaining 12.5% of the genetic variance. Candidate-gene studies
    have additionally nominated a heterogeneous set of loci (VSX1, LOX, ZEB1,
    COL5A1, HGF, ZNF469 and others) whose individual causal validity remains
    unsettled.
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: DYSREGULATED
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: DYSREGULATED
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Corneal Stromal Extracellular Matrix Degradation
    description: >
      Genetically encoded weakness of collagen matrix integrity lowers the
      threshold at which matrix turnover becomes net-catabolic.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified significant association with 36 genomic loci that, for
      the first time, implicate both dysregulation of corneal collagen matrix
      integrity and cell differentiation pathways as primary disease-causing
      mechanisms.
    explanation: >-
      A GWAS of 4,669 cases and 116,547 controls identifies collagen matrix
      integrity and cell differentiation as the implicated disease mechanisms.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The common variants associated with keratoconus explain 12.5% of the genetic variance"
    explanation: >-
      Quantifies the polygenic contribution, supporting a susceptibility rather
      than a Mendelian model for common keratoconus.
- name: Chronic Mechanical Eye Rubbing
  biological_scale: ORGANISM
  description: >
    Habitual, often vigorous eye rubbing - frequently driven by the itch of
    atopic conjunctivitis or allergy - is the best-replicated modifiable risk
    exposure for keratoconus, carrying roughly a three-fold increase in odds. It
    delivers repetitive mechanical trauma to the corneal surface.
  biological_processes:
  - preferred_term: response to mechanical stimulus
    term:
      id: GO:0009612
      label: response to mechanical stimulus
    modifier: INCREASED
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Ocular Surface Inflammatory Mediator Release
    description: >
      Rubbing acutely raises tear levels of MMP-13, IL-6, and TNF-alpha.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The odds ratio of eye rubbing, family history of keratoconus, allergy,
      asthma, and eczema was 3.09 (95% CI: 2.17-4.00), 6.42 (95% CI:
      2.59-10.24), 1.42 (95% CI: 1.06-1.79), 1.94 (95% CI: 1.30-2.58), and 2.95
      (95% CI: 1.30-4.59), respectively.
    explanation: >-
      A meta-analysis of 29 studies quantifies eye rubbing as an approximately
      three-fold risk factor, alongside family history and atopy.
- name: Ocular Surface Inflammatory Mediator Release
  biological_scale: MOLECULAR
  description: >
    Despite the traditional "non-inflammatory" label, tears from keratoconus
    patients consistently show elevated IL-6, TNF-alpha, and MMP-9, and eye
    rubbing acutely raises MMP-13, IL-6, and TNF-alpha. These mediators supply
    the proteolytic and cytokine drive for stromal matrix breakdown.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  cell_types:
  - preferred_term: corneal epithelial cell
    term:
      id: CL:0000575
      label: corneal epithelial cell
  downstream:
  - target: Corneal Stromal Extracellular Matrix Degradation
    description: >
      Cytokine and matrix-metalloproteinase excess shifts stromal turnover
      toward net matrix loss.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25931166
    reference_title: "Keratoconus: an inflammatory disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of studies in the tears of patients with keratoconus have
      found increased levels of interleukin-6 (IL-6), tumor necrosis
      factor-α(TNF-α), and matrix metalloproteinase (MMP)-9.
    explanation: >-
      A literature review of biochemical changes documents the tear cytokine and
      MMP-9 elevation that defines this node.
  - reference: PMID:25931166
    reference_title: "Keratoconus: an inflammatory disorder?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eye rubbing, a proven risk factor for keratoconus, has been also shown
      recently to increase the tear levels of MMP-13, IL-6, and TNF-α.
    explanation: >-
      Links the mechanical-trauma node upstream to this mediator node by showing
      that rubbing itself raises the same mediators.
- name: Corneal Stromal Extracellular Matrix Degradation
  biological_scale: TISSUE
  description: >
    An imbalance between degradative enzymes and their proteinase inhibitors in
    the corneal stroma produces net loss of collagen and proteoglycan matrix.
    This protease/anti-protease imbalance, together with a possible role for the
    interleukin-1 system, is the long-standing laboratory candidate for the
    tissue loss that defines keratoconus.
  cell_types:
  - preferred_term: keratocyte
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  - preferred_term: extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Progressive Stromal Thinning and Anterior Limiting Membrane Rupture
    description: >
      Sustained net matrix catabolism thins the stroma and breaches Bowman's
      layer.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory studies suggest a role for degradative enzymes and proteinase
      inhibitors and a possible role for the interleukin-1 system in its
      pathogenesis, but these roles need to be more clearly defined.
    explanation: >-
      The classic review states the degradative-enzyme/proteinase-inhibitor
      mechanism, and explicitly flags that it is not yet fully defined.
- name: Progressive Stromal Thinning and Anterior Limiting Membrane Rupture
  biological_scale: TISSUE
  description: >
    The histopathologic signature of keratoconus: progressive thinning of the
    central/paracentral stroma with rupture of the anterior limiting membrane
    (Bowman's layer), accompanied by iron deposition in the epithelial basement
    membrane (the clinically visible Fleischer ring).
  locations:
  - preferred_term: anterior limiting lamina of cornea
    term:
      id: UBERON:0004370
      label: anterior limiting lamina of cornea
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  downstream:
  - target: Loss of Corneal Biomechanical Rigidity
    description: >
      Loss of stromal thickness and of the Bowman's-layer boundary reduces the
      cornea's resistance to intraocular pressure.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most
      commonly observed histopathological findings.
    explanation: >-
      Names stromal thinning and anterior-limiting-membrane rupture as the
      commonest histopathological findings, and places ectasia downstream.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classic histopathologic features include stromal thinning, iron
      deposition in the epithelial basement membrane, and breaks in Bowman's
      layer.
    explanation: >-
      Independently corroborates stromal thinning and Bowman's-layer breaks and
      adds the epithelial basement-membrane iron deposition.
- name: Loss of Corneal Biomechanical Rigidity
  biological_scale: TISSUE
  description: >
    The thinned, matrix-depleted cornea has reduced rigidity, so normal
    intraocular pressure produces progressive distortion and focal thinning.
    This biomechanical failure is the step targeted by collagen cross-linking.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Corneal Ectasia and Conical Protrusion
    description: >
      A cornea that cannot resist intraocular pressure bulges forward into a
      cone.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is characterised by reduced rigidity of the cornea with
      distortion and focal thinning that causes blurred vision, however, the
      pathogenetic mechanisms are unknown.
    explanation: >-
      Defines reduced corneal rigidity with distortion and focal thinning as the
      characterising biomechanical abnormality.
- name: Corneal Ectasia and Conical Protrusion
  biological_scale: TISSUE
  description: >
    Forward bulging (ectasia) of the central/paracentral cornea into the
    characteristic cone, producing progressive steepening. This is the defining
    structural lesion of keratoconus and the substrate for its optical
    consequences and for acute hydrops.
  locations:
  - preferred_term: cornea
    term:
      id: UBERON:0000964
      label: cornea
  downstream:
  - target: Irregular Astigmatism and Optical Degradation
    description: >
      An irregular conical surface refracts light irregularly.
    causal_link_type: DIRECT
  - target: Descemet Membrane Rupture and Acute Corneal Hydrops
    description: >
      Progressive ectatic stretching predisposes to a break in Descemet
      membrane.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progressive stromal thinning, rupture of the anterior limiting membrane,
      and subsequent ectasia of the central/paracentral cornea are the most
      commonly observed histopathological findings.
    explanation: >-
      Places central/paracentral ectasia downstream of the stromal-thinning
      lesion.
- name: Irregular Astigmatism and Optical Degradation
  biological_scale: ORGANISM
  description: >
    The irregular conical corneal surface produces irregular astigmatism and
    higher-order aberration, which spectacles correct poorly and which
    manifests clinically as progressively blurred, distorted vision.
  downstream:
  - target: Corneal Stromal Scarring
    description: >
      Optical degradation is compounded when scarring supervenes; the two
      together drive the indication for keratoplasty.
    causal_link_type: UNKNOWN
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is a bilateral and asymmetric disease which results in
      progressive thinning and steeping of the cornea leading to irregular
      astigmatism and decreased visual acuity.
    explanation: >-
      States the causal chain from corneal thinning/steepening to irregular
      astigmatism and reduced visual acuity.
- name: Descemet Membrane Rupture and Acute Corneal Hydrops
  biological_scale: TISSUE
  description: >
    Acute corneal hydrops is a break in Descemet membrane that allows aqueous
    humour to enter the corneal stroma and epithelium, producing marked corneal
    oedema. It is usually self-limiting, with the oedema resolving over about
    three months.
  locations:
  - preferred_term: Descemet's membrane
    term:
      id: UBERON:0004367
      label: Descemet's membrane
  downstream:
  - target: Corneal Stromal Scarring
    description: >
      Resolution of hydrops characteristically leaves a vision-impairing scar.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24491416
    reference_title: "Acute corneal hydrops in keratoconus - new perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute corneal hydrops is an incompletely understood complication of
      keratoconus, characterized by marked corneal edema caused by a break in
      Descemet membrane, allowing aqueous to enter the corneal stroma and
      epithelium.
    explanation: >-
      Defines the mechanism of acute hydrops as a Descemet-membrane break with
      aqueous imbibition of the stroma and epithelium.
- name: Corneal Stromal Scarring
  biological_scale: TISSUE
  description: >
    Permanent stromal scarring - most characteristically as the sequel of
    resolved acute hydrops - causes irreversible visual impairment and is the
    common final indication for corneal transplantation.
  locations:
  - preferred_term: corneal stroma
    term:
      id: UBERON:0001777
      label: substantia propria of cornea
  evidence:
  - reference: PMID:24491416
    reference_title: "Acute corneal hydrops in keratoconus - new perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although usually self-limiting, with clinical signs of edema typically
      resolving after 3 months, it often leaves a vision-impairing scar,
      necessitating and expediting the need for corneal transplantation.
    explanation: >-
      Establishes post-hydrops scarring as the link between the acute event and
      the need for keratoplasty.

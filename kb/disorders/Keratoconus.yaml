name: Keratoconus
creation_date: '2026-07-14T04:28:25Z'
description: >-
  Keratoconus is a progressive corneal ectatic disorder in which the central and
  paracentral cornea thins and bulges into a cone shape, producing progressive
  myopia, irregular astigmatism, and loss of visual acuity. It typically presents
  in the second or third decade of life and is usually bilateral though
  asymmetric. The core pathobiology is a biomechanical failure of the corneal
  stroma: loss and disorganization of stromal collagen, an imbalance between
  degradative proteases and their inhibitors, oxidative stress, and keratocyte
  apoptosis progressively weaken the cornea. Although historically regarded as a
  non-inflammatory ectasia, contemporary evidence identifies an inflammatory
  component with elevated tear proinflammatory cytokines and matrix
  metalloproteinases. Corneal collagen cross-linking, which photochemically
  stiffens the stroma with riboflavin and ultraviolet-A light, can halt
  progression, while spectacles, rigid gas-permeable contact lenses, intrastromal
  ring segments, and ultimately corneal transplantation restore or preserve
  vision.
category: Complex
parents:
- Ophthalmological Disease

      Quantifies a polygenic common-variant contribution, supporting polygenic
      rather than Mendelian inheritance.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical studies provide strong indications of a major role for genes in its etiology."
    explanation: >-
      Corroborates a substantial genetic contribution to keratoconus aetiology.
environmental:
- name: Eye rubbing
  description: >
    Habitual mechanical eye rubbing is the best-replicated modifiable
    environmental risk factor for keratoconus (OR 3.09) and is a target of
    patient counselling.
  effect: Increases risk of developing and of progressing keratoconus
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      eye rubbing, family history of keratoconus, allergy, asthma, and eczema
      were the most important risk factors for keratoconus according to the
      available evidence
    explanation: >-
      Identifies eye rubbing as among the most important risk factors in the
      most comprehensive meta-analysis to date.
- name: Atopic diathesis (allergy, asthma, eczema)
  description: >
    Atopic disease raises keratoconus risk (allergy OR 1.42, asthma OR 1.94,
    eczema OR 2.95), plausibly at least partly through the itch-driven eye
    rubbing it provokes and through ocular surface inflammation.
  effect: Increases risk of keratoconus
  evidence:
  - reference: PMID:31498247
    reference_title: "The Prevalence and Risk Factors for Keratoconus: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The odds ratio of eye rubbing, family history of keratoconus, allergy,
      asthma, and eczema was 3.09 (95% CI: 2.17-4.00), 6.42 (95% CI:
      2.59-10.24), 1.42 (95% CI: 1.06-1.79), 1.94 (95% CI: 1.30-2.58), and 2.95
      (95% CI: 1.30-4.59), respectively.
    explanation: >-
      Quantifies the atopy-associated odds ratios for keratoconus.

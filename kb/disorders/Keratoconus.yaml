pathophysiology:
- name: Corneal Stromal Collagen Loss and Thinning
  description: >
    The primary structural lesion in keratoconus is weakening of the collagen of
    the corneal stroma. There is a reduction in the number and density of collagen
    fibrils and lamellae, a decrease in total collagen, and disruption of the
    normal orthogonal lamellar architecture, all of which reduce the mechanical
    resistance of the cornea and drive progressive stromal thinning.
  cell_types:
  - preferred_term: Corneal keratocyte (corneal stromal cell)
    term:
      id: CL:0002363
      label: keratocyte
  biological_processes:
  - preferred_term: Collagen catabolic process
    term:
      id: GO:0030574
      label: collagen catabolic process
    modifier: INCREASED
  evidence:
  - reference: PMID:38830186
    reference_title: The Pathophysiology of Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include disruptions in the arrangement in the collagen lamellae, a decrease in collagen levels, a decrease in natural collagen crosslinking, and changes in lysosomal enzyme activity."
    explanation: Identifies loss and disorganization of stromal collagen as the primary structural failure in keratoconus.
  - reference: PMID:31363996
    reference_title: "The Proteins of Keratoconus: a Literature Review Exploring Their Contribution to the Pathophysiology of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The key underlying factor for these pathological changes is weakening of collagen tissue in corneal stroma"
    explanation: States that weakening of stromal collagen is the key underlying factor for the corneal changes of keratoconus.
- name: Protease-Antiprotease Imbalance and ECM Degradation
  description: >
    Keratoconic corneas show up-regulation of degradative enzymes (matrix
    metalloproteinases, cathepsins, acid phosphatases/esterases) together with
    down-regulation of their protease inhibitors. This shifts the extracellular
    matrix balance toward net degradation, contributing directly to stromal
    thinning.
  biological_processes:
  - preferred_term: Proteolysis
    term:
      id: GO:0006508
      label: proteolysis
    modifier: INCREASED
  - preferred_term: Extracellular matrix disassembly
    term:
      id: GO:0022617
      label: extracellular matrix disassembly
    modifier: INCREASED
  evidence:
  - reference: PMID:31363996
    reference_title: "The Proteins of Keratoconus: a Literature Review Exploring Their Contribution to the Pathophysiology of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal thinning therefore is caused by the up-regulation of cellular proteases and the down-regulation of their inhibitors"
    explanation: Directly attributes corneal thinning to a protease-antiprotease imbalance.
  downstream:
  - target: Corneal Stromal Collagen Loss and Thinning
    description: >-
      Net proteolytic degradation of the extracellular matrix drives loss of
      stromal collagen and corneal thinning.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31363996
      reference_title: "The Proteins of Keratoconus: a Literature Review Exploring Their Contribution to the Pathophysiology of the Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Corneal thinning therefore is caused by the up-regulation of cellular proteases and the down-regulation of their inhibitors"
      explanation: Links increased protease activity to the corneal thinning that defines the ectasia.
- name: Oxidative Stress
  description: >
    Keratoconic corneas exhibit increased oxidative stress with reduced
    antioxidant defenses. Reactive oxygen species damage collagen and activate
    matrix-degrading collagenase and gelatinase enzymes, coupling oxidative injury
    to extracellular matrix breakdown and keratocyte death.
  biological_processes:
  - preferred_term: Response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:38830186
    reference_title: The Pathophysiology of Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased oxidative stress leads to the activation of collagenase and gelatinase enzymes."
    explanation: Connects increased oxidative stress to activation of the matrix-degrading enzymes that thin the cornea.
  downstream:
  - target: Protease-Antiprotease Imbalance and ECM Degradation
    description: >-
      Oxidative stress activates collagenase and gelatinase (matrix
      metalloproteinase) enzymes, contributing to the proteolytic degradation of
      the stroma.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38830186
      reference_title: The Pathophysiology of Keratoconus.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Increased oxidative stress leads to the activation of collagenase and gelatinase enzymes."
      explanation: Oxidative stress is shown to activate the collagen-degrading enzymes underlying matrix breakdown.
- name: Inflammatory Cytokine Signaling
  description: >
    Although keratoconus was traditionally classified as a non-inflammatory
    ectasia, contemporary studies identify an inflammatory component. Tears and
    corneal tissue from patients show elevated proinflammatory cytokines
    (IL-1, IL-6, IL-17, TNF-alpha) and matrix metalloproteinases, and IL-1
    signaling promotes keratocyte apoptosis.
  biological_processes:
  - preferred_term: Inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:38830186
    reference_title: The Pathophysiology of Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated levels of proinflammatory cytokines like IL-1b, IL-6, IL-17, and TNF-α have been observed, along with increased apoptosis of keratocytes."
    explanation: Documents elevated proinflammatory cytokines and associated keratocyte apoptosis, supporting an inflammatory component.
  - reference: PMID:38830186
    reference_title: The Pathophysiology of Keratoconus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunologic changes have also been identified in keratoconus, challenging the traditional view of the condition as noninflammatory."
    explanation: States that immunologic changes challenge the classic non-inflammatory characterization of keratoconus.
  - reference: PMID:31363996
    reference_title: "The Proteins of Keratoconus: a Literature Review Exploring Their Contribution to the Pathophysiology of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inflammation in KC is characterized by the presence of many inflammatory cells and markers such as IL-1, IL-6, MMP-9, TGF-β, and TNF-a"
    explanation: Lists the inflammatory cells and cytokine/MMP markers characterizing inflammation in keratoconus.
- name: Keratocyte Apoptosis
  description: >
    Apoptosis of stromal keratocytes is considered the primary pathway of cell
    death in keratoconus. IL-1 up-regulation induces keratocyte apoptosis, and
    keratocyte loss contributes to thinning and disorganization of the stroma.

    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Ultraviolet exposure is associated with progression and plausibly acts
      through oxidative damage to the stroma, but the direction is
      complicated: ultraviolet A with riboflavin is the basis of corneal
      cross-linking, the standard treatment that halts progression. Dose and
      cofactors decide which effect dominates.
    evidence:
    - reference: PMID:39448666
      reference_title: "Keratoconus."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Environmental factors, such as eye rubbing, UV light exposure and contact lens wearing, are associated with disease progression."
      explanation: >-
        Names ultraviolet light exposure among the environmental factors
        associated with disease progression, an association without an
        identified mediating step.
  description: >
    Ultraviolet light exposure is named in the authoritative disease primer,
    alongside eye rubbing and contact lens wear, as an environmental factor
    associated with keratoconus progression. The primer states the association
    with progression; it does not quantify an effect size, and no causal
    mechanism is asserted here.
  effect: Associated with progression of keratoconus
  evidence:

- name: Irregular Astigmatism and Optical Degradation
  biological_scale: ORGANISM
  description: >
    The irregular conical corneal surface produces irregular astigmatism and
    higher-order aberration, which spectacles correct poorly and which
    manifests clinically as progressively blurred, distorted vision.
  notes: >-
    No downstream edge to "Corneal Stromal Scarring" is asserted. Irregular
    astigmatism and stromal scarring are two independent optical consequences
    of the same ectatic lesion that jointly drive the keratoplasty indication;
    the co-occurrence is not a causal relation, and the evidenced route to
    scarring is advanced ectasia via Descemet membrane rupture.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is a bilateral and asymmetric disease which results in
      progressive thinning and steeping of the cornea leading to irregular
      astigmatism and decreased visual acuity.
    explanation: >-
      States the causal chain from corneal thinning/steepening to irregular
      astigmatism and reduced visual acuity.
- name: Descemet Membrane Rupture
  biological_scale: TISSUE
  description: >
    A break in Descemet membrane, the posterior basement membrane of the
    cornea. This is the initiating lesion of acute corneal hydrops: it breaches
    the barrier that normally keeps aqueous humour out of the stroma.
  locations:
  - preferred_term: Descemet's membrane
    term:
      id: UBERON:0004367
      label: Descemet's membrane
  downstream:
  - target: Stromal Imbibition and Acute Corneal Oedema
    description: >
      Loss of the Descemet barrier allows aqueous humour to enter the corneal
      stroma and epithelium.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24491416
    reference_title: "Acute corneal hydrops in keratoconus - new perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute corneal hydrops is an incompletely understood complication of
      keratoconus, characterized by marked corneal edema caused by a break in
      Descemet membrane, allowing aqueous to enter the corneal stroma and
      epithelium.
    explanation: >-
      Identifies the Descemet-membrane break as the lesion that causes the
      oedema, establishing it as the upstream event.
- name: Stromal Imbibition and Acute Corneal Oedema
  biological_scale: TISSUE
  description: >
    Aqueous humour entering the stroma and epithelium through the Descemet
    break produces the marked corneal oedema that constitutes clinical acute

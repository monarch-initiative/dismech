- name: Corneal Biomechanical Weakening and Ectasia
  description: >
    The combined loss of collagen, matrix degradation, and keratocyte apoptosis
    reduce corneal biomechanical strength, allowing the thinned cornea to bulge
    forward into a cone (ectasia). The resulting corneal protrusion and thinning
    produce progressive myopia, irregular astigmatism, and visual impairment.
  evidence:
  - reference: PMID:31363996
    reference_title: "The Proteins of Keratoconus: a Literature Review Exploring Their Contribution to the Pathophysiology of the Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is characterized by moderate to substantial visual impairment due to the development of corneal protrusion and thinning"
    explanation: Connects corneal protrusion and thinning to the visual impairment that defines the clinical disease.
  downstream:
  - target: Visual impairment
    description: >-
      Corneal protrusion and thinning generate irregular astigmatism and myopia
      that impair vision.

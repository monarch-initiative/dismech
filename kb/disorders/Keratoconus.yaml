progression:
- phase: Onset and progression
  age_range: Second to fourth decade
  notes: >-
    Keratoconus typically develops in the second and third decades and
    progresses until roughly the fourth decade; the mean age at diagnosis in a
    nationwide registry was 28.3 years.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus normally develops in the second and third decades of life and
      progresses until the fourth decade.
    explanation: Gives the characteristic onset and progression window.
  - reference: PMID:28039037
    reference_title: "Age-specific Incidence and Prevalence of Keratoconus: A Nationwide Registration Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at diagnosis was 28.3 years and 60.6% of diagnosed patients were male."
    explanation: >-
      Provides the registry-based mean age at diagnosis and a male
      preponderance among diagnosed patients.
- phase: Documented progression (the cross-linking indication)
  notes: >-
    How "progression" is operationalised is the decision point for offering
    cross-linking, and the literature has no unified criterion. A systematic
    review of 221 articles found anterior-curvature data used in 97.8%, with
    maximum keratometry (Kmax) the single most frequent criterion (85.5%),
    followed by refractive astigmatism and thinnest-point pachymetry;
    progression was assessed over a 6- to 12-month follow-up in 64.7%. Posterior
    corneal data were used in only 8.1% of studies and epithelial data in none,
    so the criteria in common use underexploit available tomography. The Global
    Delphi consensus in the diagnosis section is the corresponding expert
    statement; this record captures what the primary literature actually uses.
  evidence:
  - reference: PMID:39671084
    reference_title: "Definition of Progressive Keratoconus: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the most frequent criterion used was maximum keratometry (Kmax), used in
      85.5% (189/221) of the articles
    explanation: >-
      Identifies Kmax as the dominant operational criterion for progression
      across the reviewed literature.
  - reference: PMID:39671084
    reference_title: "Definition of Progressive Keratoconus: A Systematic Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Progression was assessed between 6- and 12-month follow-up in 64.7%
      (143/221) of the articles.
    explanation: >-
      Gives the follow-up interval over which progression is conventionally
      assessed.
  - reference: PMID:39671084
    reference_title: "Definition of Progressive Keratoconus: A Systematic Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study demonstrates the lack of unified criteria to define
      progression of keratoconus and an underutilization of the technology
      described.
    explanation: >-
      Qualifies the record: the criteria above are the most common ones, not an
      agreed standard. Typed PARTIAL because it constrains rather than
      establishes the progression definition.
diagnosis:
- name: Corneal topography
  description: >
    Corneal topography is the primary diagnostic modality. Early/subclinical
    disease is difficult to detect and no single parameter suffices, so
    topography is combined with corneal pachymetry and higher-order aberration
    measurement.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corneal topography is the primary diagnostic tool for keratoconus detection."
    explanation: Establishes corneal topography as the primary diagnostic tool.
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In incipient cases, however, the use of a single parameter to diagnose
      keratoconus is insufficient, and in addition to corneal topography,
      corneal pachymetry and higher order aberration data are now commonly used.
    explanation: >-
      Supports the multi-parameter approach required for incipient disease.
- name: Global Delphi consensus criteria for keratoconus and ectatic disease
  description: >
    There is no single validated gold-standard test. The reference framework
    for definition, diagnosis, staging and staged management is the Global
    Delphi consensus. Edition 2 (2026) is the current statement - 128
    ophthalmologists from 6 continents, 4 questionnaire rounds plus a
    face-to-face meeting, two-thirds agreement threshold - superseding the 2015
    first edition (36 panelists, 3 rounds), which remains the consensus
    underlying most of the intervening literature. Both are consensus
    instruments rather than prospectively validated diagnostic algorithms, and
    each panel was convened precisely because controversies persist.
  evidence:
  - reference: PMID:42228627
    reference_title: "Global Consensus on Keratoconus and Ectatic Diseases-Edition 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A significant consensus was reached on topics such as definitions,
      diagnostic and progression criteria, and management strategies for
      keratoconus and other ectatic corneal disorders.
    explanation: >-
      The current (Edition 2) consensus is the source of the field's
      definitions, diagnostic criteria and progression criteria.
  - reference: PMID:42228627
    reference_title: "Global Consensus on Keratoconus and Ectatic Diseases-Edition 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This updated Global Consensus provides revised definitions, expert
      statements, and recommendations for diagnosing and managing keratoconus
      and other ectatic corneal diseases.
    explanation: >-
      Confirms that Edition 2 revises rather than restates the 2015
      definitions, which is why it is cited here as the current framework.
  - reference: PMID:25738235
    reference_title: "Global consensus on keratoconus and ectatic diseases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Numerous agreements were generated in definitions, methods of diagnosing,
      and management of keratoconus and other ectatic diseases.
    explanation: >-
      The 2015 first edition, retained because it is the consensus underlying
      most of the diagnostic and management literature cited elsewhere here.
  - reference: PMID:25738235
    reference_title: "Global consensus on keratoconus and ectatic diseases."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Despite extensive knowledge regarding the diagnosis and management of
      keratoconus and ectatic corneal diseases, many controversies still exist.
    explanation: >-
      Qualifies the consensus: it codifies expert agreement over persisting
      controversy rather than resolving diagnosis empirically.
treatments:
- name: Riboflavin/UV-A Corneal Collagen Cross-Linking
  description: >
    Corneal collagen cross-linking (CXL) is the established disease-modifying
    treatment for progressive keratoconus. UV-A photo-activation of riboflavin
    drives photochemistry that forms covalent cross-links within stromal
    proteins, reorganising the stroma ultrastructurally and stiffening it, which
    arrests ectatic progression. In the randomised US multicentre trial maximum
    keratometry fell by 1.6 D at one year while controls progressed. Protocols
    have expanded from the original epithelium-off technique to transepithelial
    approaches.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: corneal collagen cross-linking (riboflavin/UV-A phototherapy)
    term:
      id: NCIT:C15301
      label: Phototherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  target_mechanisms:
  - target: Loss of Corneal Biomechanical Rigidity
    treatment_effect: RESTORES
    description: >
      Photochemically induced covalent cross-links within stromal proteins
      stiffen the cornea, directly counteracting the loss of biomechanical
      rigidity.
  target_phenotypes:
  - preferred_term: Keratoconus
    term:
      id: HP:0000563
      label: Keratoconus
  evidence:
  - reference: PMID:12719068
    reference_title: "Riboflavin/ultraviolet-a-induced collagen crosslinking for the treatment of keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all treated eyes, the progression of keratoconus was at least stopped."
    explanation: >-
      The original clinical pilot study of riboflavin/UVA cross-linking reports
      arrest of progression in all treated eyes.
  - reference: PMID:28495149
    reference_title: "United States Multicenter Clinical Trial of Corneal Collagen Crosslinking for Keratoconus Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the CXL treatment group, the maximum keratometry value decreased by 1.6
      diopters (D) from baseline to 1 year, whereas keratoconus continued to
      progress in the control group.
    explanation: >-
      A prospective randomised sham-controlled multicentre trial demonstrating
      efficacy against progression.
  - reference: PMID:42430076
    reference_title: "The Science and Clinical Evolution of Corneal Cross-Linking: Mechanism of Action, Ultra-Structural Changes, Clinical Indications, and Emerging Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CXL acts through UV-A photo-activated riboflavin-driven photochemistry
      that induces covalent cross-links within stromal proteins.
    explanation: >-
      States the molecular mechanism of action linking the treatment to the
      biomechanical-rigidity node it targets.
- name: Rigid and Scleral Contact Lenses
  description: >
    Optical rehabilitation with rigid gas-permeable or scleral contact lenses
    masks the irregular corneal surface with a regular refracting interface and
    remains the mainstay of visual correction in moderate disease. Mild cases
    may be managed with spectacles alone; failure of scleral lenses is a trigger
    for surgical management.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: therapeutic contact lens usage
  target_phenotypes:
  - preferred_term: Irregular astigmatism
    term:
      id: HP:0031792
      label: Irregular astigmatism
  - preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  notes: >-
    Symptomatic/optical management: it corrects the refractive consequence but
    does not modify the ectatic process, so no target_mechanisms link is
    asserted.
  evidence:
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild cases are typically treated with spectacles, moderate cases with
      contact lenses, while severe cases that cannot be managed with scleral
      contact lenses may require corneal surgery.
    explanation: >-
      Describes the stepwise optical management and the point at which surgery
      becomes necessary.
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contact lenses are the most common treatment modality."
    explanation: Corroborates contact lenses as the commonest treatment modality.
- name: Corneal Transplantation (Keratoplasty)
  description: >
    Corneal transplantation is reserved for advanced disease, contact-lens
    failure, or scarring (notably post-hydrops scarring). Keratoconus is the
    single most common indication for keratoplasty in the developed world.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: corneal transplantation
    term:
      id: NCIT:C210959
      label: Corneal Transplantation
  target_mechanisms:
  - target: Corneal Stromal Scarring
    treatment_effect: BYPASSES
    description: >
      Replacing the scarred, ectatic host cornea with donor tissue bypasses the
      irreversible structural lesion rather than modifying the disease process.
  target_phenotypes:
  - preferred_term: Corneal scarring
    term:
      id: HP:0000559
      label: Corneal scarring
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When contact lenses fail, corneal transplant is the best and most
      successful surgical option.
    explanation: >-
      Positions keratoplasty as the surgical option after contact-lens failure.
  - reference: PMID:24357835
    reference_title: "The pathogenesis of keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is the single most common reason for keratoplasty in the developed world."
    explanation: >-
      Quantifies the clinical burden of keratoconus in terms of transplantation
      demand.
discussions:
- discussion_id: gap_kc_systemic_associations
  prompt: >-
    Which of the many reported systemic associations of keratoconus are causal,
    which are confounded by shared exposure (above all eye rubbing), and is the
    reported inverse association with diabetes mellitus real?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Chronic Mechanical Eye Rubbing
  - pathophysiology#Loss of Corneal Biomechanical Rigidity
  rationale: >-
    A dedicated review finds the list of reported systemic associations "very
    long", with atopy, Down syndrome and connective tissue disease the most
    frequently cited. These are not mechanistically equivalent: the atopy
    association is plausibly mediated entirely by itch-driven eye rubbing
    (already modelled as an environmental factor and a pathophysiology node),
    the connective-tissue association has direct genetic support in this entry
    (the GWAS implicates COL12A1, COL6A1, COL1A1 and COL5A1, whose pathogenic
    variants cause Ehlers-Danlos and osteogenesis imperfecta subtypes), and the
    Down-syndrome association is quantitatively unresolved (reported
    prevalences 0-71%). Separately, diabetes mellitus is reported as a candidate
    *protective* factor - mechanistically attractive because non-enzymatic
    glycation cross-links stromal collagen, the same chemistry riboflavin/UV-A
    cross-linking supplies therapeutically - but it is not established. These
    pairs are candidates for structured kb/comorbidities/ entries once the
    direction and confounding structure are settled; they are deliberately not
    asserted as comorbidity entries here.
  proposed_experiments:
  - experiment_id: exp_kc_atopy_rubbing_mediation
    name: Mediation analysis of the atopy association
    description: >
      Cohort or Mendelian-randomisation analysis testing whether the
      atopy-keratoconus association survives adjustment for objectively
      quantified eye-rubbing exposure.
    decision_criterion: >
      Attenuation of the atopy effect to the null after adjustment for rubbing
      would establish rubbing as the mediator and argue against curating atopy
      as an independent comorbidity.
  - experiment_id: exp_kc_diabetes_protective_mr
    name: Mendelian randomisation of the diabetes inverse association
    description: >
      Mendelian randomisation using type 2 diabetes and glycaemic-trait
      instruments against keratoconus liability, to distinguish a genuine
      protective effect of glycation cross-linking from detection bias in
      diabetic eye-care cohorts.
    decision_criterion: >
      A significant protective MR estimate consistent in direction with the
      glycation-cross-linking mechanism would support curating an inverse
      comorbidity; a null estimate would attribute the observation to
      surveillance bias.
  evidence:
  - reference: PMID:37374145
    reference_title: "Systemic Associations with Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that atopy, Down syndrome, and various connective tissue
      diseases were the most frequently cited associations in our broad
      literature search.
    explanation: >-
      Identifies the three most frequently cited systemic associations, which
      are the subject of this gap.
  - reference: PMID:37374145
    reference_title: "Systemic Associations with Keratoconus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, Diabetes Mellitus has been increasingly studied as a
      possible protective factor against keratoconus.
    explanation: >-
      States the candidate inverse association while marking it as under study
      rather than established; typed PARTIAL for that reason.
  - reference: PMID:37374145
    reference_title: "Systemic Associations with Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the mechanisms underlying the development of keratoconus are
      largely unknown.
    explanation: >-
      Confirms that the mechanistic basis of these associations remains open,
      justifying KNOWLEDGE_GAP rather than curated comorbidity entries.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      COL6A1, COL1A1, and COL5A1 have been described in individuals with
      different subtypes of the connective tissue
    explanation: >-
      Supplies the shared-collagen-gene rationale that distinguishes the
      connective-tissue association from the rubbing-confounded ones.
- discussion_id: gap_kc_primary_pathomechanism
  prompt: >-
    What is the primary pathomechanism of keratoconus - is the matrix
    degradation that thins the stroma driven principally by the polygenic
    collagen/cell-differentiation susceptibility, by rubbing-induced mechanical
    and inflammatory injury, or by an obligate interaction of the two?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Polygenic Corneal Matrix Susceptibility
  - pathophysiology#Corneal Stromal Extracellular Matrix Degradation
  rationale: >-
    Two authoritative sources published seven years apart both state plainly
    that the underlying mechanism is unknown, while independently confirming
    that genetic and environmental contributions both exist. The causal edge
    from susceptibility to matrix degradation is therefore modelled as
    INDIRECT_UNKNOWN_INTERMEDIATES. Resolving the relative weight of the two
    arms determines whether rubbing-cessation counselling is disease-modifying
    or merely adjunctive, and whether genetic risk stratification could target
    early cross-linking.
  proposed_experiments:
  - experiment_id: exp_kc_rubbing_prs_interaction
    name: Gene-environment interaction cohort
    description: >
      Prospective cohort with objective (not self-reported) eye-rubbing
      quantification, stratified by polygenic risk score, testing for
      gene-environment interaction on topographic progression.
    decision_criterion: >
      A significant interaction term between rubbing exposure and polygenic risk
      score on progression rate would support an obligate two-hit model over
      either arm acting alone.
  - experiment_id: exp_kc_tear_proteome_biomechanics_timecourse
    name: Tear proteome versus biomechanics time course
    description: >
      Paired tear-proteome and corneal-biomechanics time series in incident
      cases, to establish whether protease and cytokine elevation precedes or
      follows measurable biomechanical loss.
    decision_criterion: >
      Mediator elevation preceding biomechanical change would place the
      inflammatory node upstream as a driver rather than a consequence.
  evidence:
  - reference: PMID:24357835
    reference_title: "The pathogenesis of keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cause and underlying pathological mechanism are unknown, but both
      environmental and genetic factors are thought to contribute to the
      development of the disease.
    explanation: >-
      States the knowledge gap explicitly while affirming dual genetic and
      environmental contribution.
  - reference: PMID:33649486
    reference_title: "A multi-ethnic genome-wide association study implicates collagen matrix integrity and cell differentiation pathways in keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is characterised by reduced rigidity of the cornea with
      distortion and focal thinning that causes blurred vision, however, the
      pathogenetic mechanisms are unknown.
    explanation: >-
      The largest genetic study of the disease still describes the pathogenetic
      mechanisms as unknown.
- discussion_id: controversy_kc_inflammatory_status
  prompt: >-
    Should keratoconus continue to be classified as a "non-inflammatory" corneal
    ectasia, given consistently elevated tear IL-6, TNF-alpha, and MMP-9?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Ocular Surface Inflammatory Mediator Release
  rationale: >-
    The canonical 1998 definition calls keratoconus a "bilateral noninflammatory
    corneal ectasia", and that wording persists in textbooks and in the MONDO
    synonym "noninflammatory corneal thining". Biochemical evidence accumulated
    since then documents a reproducible cytokine and matrix-metalloproteinase
    signature in the tear film, and a 2022 review states the condition has more
    recently been associated with ocular inflammation. The disagreement is
    substantive rather than semantic: if a low-grade inflammatory arm is causal
    rather than epiphenomenal, anti-inflammatory or anti-protease therapy
    becomes a rational adjunct to cross-linking, and this entry's
    inflammatory-mediator node would move from modulator to driver.
  evidence:
  - reference: PMID:9493273
    reference_title: "Keratoconus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratoconus is a bilateral noninflammatory corneal ectasia with an
      incidence of approximately 1 per 2,000 in the general population.
    explanation: States the classical non-inflammatory definition.
  - reference: PMID:25931166
    reference_title: "Keratoconus: an inflammatory disorder?"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have shown a significant role of proteolytic enzymes,
      cytokines, and free radicals; therefore, although keratoconus does not
      meet all the classic criteria for an inflammatory disease, the lack of
      inflammation has been questioned.
    explanation: >-
      Directly challenges the non-inflammatory classification on biochemical
      grounds.
  - reference: PMID:34991971
    reference_title: "Keratoconus: An updated review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Traditionally, the condition has been described as a noninflammatory
      disease; however, more recently it has been associated with ocular
      inflammation.
    explanation: >-
      A contemporary review confirms the classification is actively contested.
  - reference: PMID:38830186
    reference_title: "The Pathophysiology of Keratoconus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunologic changes have also been identified in keratoconus, challenging
      the traditional view of the condition as noninflammatory.
    explanation: >-
      A 2025 pathophysiology review states the challenge to the noninflammatory
      classification in terms, independently of the 2015 and 2022 sources above.
  - reference: PMID:38830186
    reference_title: "The Pathophysiology of Keratoconus."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Elevated levels of proinflammatory cytokines like IL-1b, IL-6, IL-17, and
      TNF-α have been observed, along with increased apoptosis of keratocytes.
    explanation: >-
      Supplies the specific cytokine profile (extending the tear-film
      IL-6/TNF-alpha signature with IL-1b and IL-17) on which the challenge
      rests.
- discussion_id: openq_kc_molecular_disease_modifying_therapy
  prompt: >-
    Can a molecular (non-photochemical) disease-modifying therapy for
    keratoconus be developed that restores stromal matrix integrity rather than
    stiffening the residual stroma, and what target should it engage?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Corneal Stromal Extracellular Matrix Degradation
  - pathophysiology#Loss of Corneal Biomechanical Rigidity
  rationale: >-
    Every established treatment is either photochemical stiffening (CXL),
    optical compensation (lenses), or tissue replacement (keratoplasty); none
    reverses the underlying matrix loss. Non-light-based chemical cross-linkers
    are under investigation as alternatives, which keeps the therapeutic
    strategy anchored to stiffening rather than matrix restoration. Regenerative
    approaches - notably limbal or mesenchymal stem-cell exosome cargo aimed at
    ECM restoration - have been proposed but rest so far on preprint-stage
    bioinformatic prioritisation rather than peer-reviewed experimental or
    clinical evidence, so no candidate cargo is asserted in this entry.
  proposed_experiments:
  - experiment_id: exp_kc_exosome_cargo_validation
    name: Peer-reviewed validation of prioritised exosome cargo
    description: >
      Experimental validation, in keratoconus corneal tissue and in a model of
      stromal thinning, of extracellular-vesicle cargo nominated by
      computational prioritisation from keratoconus transcriptomes.
    decision_criterion: >
      Restoration of stromal extracellular-matrix composition and thickness by a
      defined cargo would establish a matrix-restorative target.
  - experiment_id: exp_kc_restorative_vs_cxl
    name: Matrix-restorative candidate versus standard cross-linking
    description: >
      Head-to-head comparison of a matrix-restorative candidate against standard
      epithelium-off cross-linking on corneal biomechanics and topographic
      progression.
    decision_criterion: >
      Non-inferior progression control with superior recovery of corneal
      thickness would favour a restorative over a stiffening strategy.
  evidence:
  - reference: PMID:42430076
    reference_title: "The Science and Clinical Evolution of Corneal Cross-Linking: Mechanism of Action, Ultra-Structural Changes, Clinical Indications, and Emerging Treatment Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, novel chemical cross-linkers are being investigated as
      non-light-based alternatives for corneal stabilization.
    explanation: >-
      Confirms that the emerging therapeutic pipeline remains oriented towards
      stabilisation rather than restoration, framing the open question.

name: X-linked Dilated Cardiomyopathy
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
synonyms:
- XLDCM
- XLCM
- dilated cardiomyopathy 3B
- CMD3B
- cardiomyopathy, dilated, X-linked
- DMD-associated dilated cardiomyopathy
- cardiac-specific dystrophinopathy
- 5' X-linked dilated cardiomyopathy
disease_term:
  preferred_term: X-linked dilated cardiomyopathy
  term:
    id: MONDO:0010542
    label: dilated cardiomyopathy 3B
description: >-
  The cardiac-selective dystrophinopathy. XLDCM is caused by mutations in DMD -
  the same gene as Duchenne and Becker muscular dystrophy - but expressed almost
  exclusively as dilated cardiomyopathy, with minimal or absent skeletal
  myopathy. What makes it a distinct entry rather than "the heart part of
  Duchenne" is where in the gene the lesion falls and how tissue-specific
  dystrophin promoters respond to it.

  The paradigmatic lesion is a deletion of the muscle (M) promoter and first
  muscle exon at the 5' end of DMD. This abolishes the muscle dystrophin isoform
  (Dp427m) everywhere it is normally made, but skeletal muscle rescues itself by
  up-regulating the brain (B) and Purkinje (P) isoforms from intact downstream
  promoters. The ventricular myocardium cannot: the B isoform is expressed in
  human heart only in the atria and conduction tissue, not in the ventricles, so
  there is no compensatory transcript available where it matters. The result is a
  loss of dystrophin that is functionally confined to the ventricle - the direct
  molecular explanation for a dystrophinopathy that devastates the heart while
  sparing the limbs.

  The clinical shape follows the molecular one and is starkly sex-dependent.
  Hemizygous males present in adolescence or the early twenties with rapidly
  progressive heart failure and ventricular arrhythmia; in the original kindred,
  affected males died within 5 to 12 months of symptom onset. Heterozygous
  carrier females are not unaffected - they develop a milder, later-onset dilated
  cardiomyopathy in the fourth to fifth decade, its severity tracking skewed
  X-inactivation. Because there is little or no skeletal weakness to raise
  suspicion, XLDCM is readily mistaken for idiopathic dilated cardiomyopathy, and
  DMD defects account for a small but real fraction of young-adult male DCM.
parents:
- Dilated Cardiomyopathy
- Dystrophinopathy
classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
  - classification_value: GENETICS_ENVIRONMENT_DISEASE

pathophysiology:
- name: 5' DMD Muscle-Promoter/Isoform-Disrupting Lesion
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. The paradigmatic XLDCM mutation deletes the muscle (M)
    promoter and first muscle exon at the 5' end of DMD, abolishing transcription
    of the muscle dystrophin isoform (Dp427m); other XLDCM lesions include
    in-frame exon 45-55 deletions and destabilizing missense variants. Towbin's
    linkage study localized the disorder to the centromeric half of the dystrophin
    locus at Xp21 and showed that cardiac dystrophin was abnormal on Western blot
    while skeletal-muscle dystrophin was normal - the biochemical signature of a
    heart-preferential dystrophin defect.
  molecular_functions:
  - preferred_term: dystrophin actin filament binding
    term:
      id: GO:0051015
      label: actin filament binding
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:8504498
    reference_title: "X-linked dilated cardiomyopathy. Molecular genetic evidence of linkage to the Duchenne muscular dystrophy (dystrophin) gene at the Xp21 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage of XLCM to the centromeric portion of the dystrophin or Duchenne
      muscular dystrophy (DMD) locus at Xp21 was demonstrated with combined maximum
      logarithm of the scores of +4.33
    explanation: >-
      Establishes DMD at Xp21 as the disease locus, the founding molecular evidence
      that XLDCM is a dystrophinopathy.
  - reference: PMID:8504498
    reference_title: "X-linked dilated cardiomyopathy. Molecular genetic evidence of linkage to the Duchenne muscular dystrophy (dystrophin) gene at the Xp21 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abnormalities of cardiac dystrophin were shown by Western blotting with
      N-terminal dystrophin antibody, whereas skeletal muscle dystrophin was normal,
      suggesting primary involvement of the DMD gene with preferential involvement of
      cardiac muscle.
    explanation: >-
      The heart-selective biochemical defect that defines the entity: abnormal cardiac
      dystrophin against normal skeletal-muscle dystrophin.
  downstream:
  - target: Ventricle-Selective Loss of Dystrophin
    causal_link_type: DIRECT
    description: >-
      Abolishing the muscle isoform sets up a tissue-specific failure of compensation
      that is resolved at the next node.

- name: Ventricle-Selective Loss of Dystrophin
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    The node on which the whole entry turns, and the reason XLDCM is cardiac-selective
    rather than a systemic dystrophinopathy. When the 5' mutation abolishes the muscle
    (M) dystrophin isoform, skeletal muscle compensates by up-regulating the brain (B)
    isoform from an intact downstream promoter. The ventricular myocardium cannot: in
    the healthy human heart the B isoform is expressed only in atrial cardiomyocytes and
    conduction tissue, and is absent from the ventricles, which transcribe the M isoform
    alone. With no compensatory transcript available, the ventricle is left dystrophin-
    deficient while the limbs are rescued.
  cell_types:
  - preferred_term: ventricular cardiomyocyte
    term:
      id: CL:0002131
      label: regular ventricular cardiac myocyte
  evidence:
  - reference: PMID:22455600
    reference_title: "The absence of dystrophin brain isoform expression in healthy human heart ventricles explains the pathogenesis of 5' X-linked dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In X-linked dilated cardiomyopathy due to dystrophin mutations which abolish the
      expression of the M isoform (5'-XLDC), the skeletal muscle is spared through the
      up-regulation of the Brain (B) isoform, a compensatory mechanism that does not
      appear to occur in the heart of affected individuals.
    explanation: >-
      States the compensation-and-failure logic directly: skeletal muscle is rescued by
      the B isoform, the heart is not.
  - reference: PMID:22455600
    reference_title: "The absence of dystrophin brain isoform expression in healthy human heart ventricles explains the pathogenesis of 5' X-linked dilated cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Unlike the M isoform, consistently detectable in all the heart regions, the B
      isoform was selectively expressed in atrial cardiomyocytes, but absent in
      ventricles and in conduction system structures.
    explanation: >-
      The molecular-topography finding that grounds ventricular selectivity: no B isoform
      is available in the ventricle to replace the lost M isoform.
  - reference: PMID:22455600
    reference_title: "The absence of dystrophin brain isoform expression in healthy human heart ventricles explains the pathogenesis of 5' X-linked dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The ventricular dilatation seen in 5'-XLDC patients appears to be functionally
      related to loss of the M isoform, the only isoform transcribed in human ventricles
    explanation: >-
      Ties the molecular finding to the clinical outcome (ventricular dilation) that the
      downstream chain models.
  downstream:
  - target: Cardiomyocyte Dystrophin-Glycoprotein Complex Disruption
    causal_link_type: DIRECT
    description: >-
      Loss of dystrophin removes the core structural component of the DGC at the
      cardiomyocyte sarcolemma.

- name: Cardiomyocyte Dystrophin-Glycoprotein Complex Disruption
  role: effector
  biological_scale: MOLECULAR
  description: >-
    Dystrophin is the central member of the dystrophin-glycoprotein complex (DGC) at the
    sarcolemma, linking the intracellular actin cytoskeleton through dystroglycan and
    sarcoglycan subcomplexes to the extracellular matrix. Without dystrophin the DGC
    cannot assemble, and the mechanical and signaling link across the ventricular
    cardiomyocyte membrane is lost.
  cellular_components:
  - preferred_term: dystrophin-glycoprotein complex at the sarcolemma
    term:
      id: GO:0016010
      label: dystrophin-associated glycoprotein complex
    modifier: DECREASED
  - preferred_term: cardiomyocyte sarcolemma
    term:
      id: GO:0042383
      label: sarcolemma
  evidence:
  - reference: PMID:36168044
    reference_title: "The role of the dystrophin glycoprotein complex in muscle cell mechanotransduction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin connects the actin cytoskeleton to the extracellular matrix (ECM).
      Severing the link between the ECM and the intracellular cytoskeleton has a
      devastating impact on the homeostasis of skeletal muscle cells, leading to a range
      of muscular dystrophies. In addition, the loss of a functional DGC leads to
      progressive dilated cardiomyopathy and premature death.
    explanation: >-
      States both the DGC's structural role and that losing it causes progressive dilated
      cardiomyopathy - the claim this node makes.
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Localized to the sarcolemma, dystrophin is a major component of the dystrophin
      glycoprotein complex (DGC) along with the dystroglycan, sarcoglycan, and
      syntrophin/dystrobrevin complexes that link the cytoskeletal protein actin to the
      basal lamina of muscle fibers
    explanation: >-
      Places dystrophin as the core DGC component at the sarcolemma, the structure this
      node loses.
  downstream:
  - target: Sarcolemmal Fragility and Contraction-Induced Cardiomyocyte Injury
    causal_link_type: DIRECT
    description: >-
      A DGC-deficient sarcolemma cannot withstand the mechanical stress of contraction.

- name: Sarcolemmal Fragility and Contraction-Induced Cardiomyocyte Injury
  role: effector
  biological_scale: CELLULAR
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    With the DGC gone, dystrophin can no longer act as the molecular spring that
    protects the membrane during contraction, so each cardiac cycle inflicts microtears
    on the ventricular cardiomyocyte sarcolemma. This is the primary cardiomyocyte
    insult that the maladaptive-remodeling module models generically; here it is driven
    specifically by the ventricular dystrophin deficit and is aggravated by mechanical
    loading (the "use hypothesis").
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin deficiency disrupts the DGC and causes the muscle membrane fragility and
      an increase in susceptibility to the mechanical stress, which leads to progressive
      muscle necrosis and degeneration in both skeletal and cardiac muscles
    explanation: >-
      The membrane-fragility-under-mechanical-stress mechanism, stated for cardiac as well
      as skeletal muscle.
  - reference: PMID:36168044
    reference_title: "The role of the dystrophin glycoprotein complex in muscle cell mechanotransduction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin functions as a molecular spring and the DGC plays a critical role in
      maintaining the integrity of the sarcolemma.
    explanation: >-
      The molecular-spring/membrane-integrity function whose loss produces contraction-
      induced injury.
  downstream:
  - target: Cardiomyocyte Calcium Overload
    causal_link_type: DIRECT
    description: >-
      Membrane microdamage admits pathological calcium influx into the cardiomyocyte.

- name: Cardiomyocyte Calcium Overload
  role: effector
  biological_scale: CELLULAR
  description: >-
    Sarcolemmal microdamage and disrupted mechanosensitive channel regulation admit
    excess calcium into the ventricular cardiomyocyte, and intracellular calcium handling
    becomes overwhelmed. Calcium overload activates calcium-dependent proteases and
    injures mitochondria, driving the cell-death programme downstream.
  biological_processes:
  - preferred_term: intracellular calcium ion overload
    term:
      id: GO:0006874
      label: intracellular calcium ion homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32075145
    reference_title: "Dysregulation of Calcium Handling in Duchenne Muscular Dystrophy-Associated Dilated Cardiomyopathy: Mechanisms and Experimental Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sarcolemmal instability, leading to calcium mishandling and overload in the cardiac
      myocyte, is a key mechanistic contributor to muscle cell death, fibrosis, and
      diminished cardiac contractile function in DMD patients.
    explanation: >-
      Places calcium overload as the link between sarcolemmal instability and the cell
      death, fibrosis and contractile failure of the downstream nodes.
  downstream:
  - target: Cardiomyocyte Necrosis and Replacement Fibrosis
    causal_link_type: DIRECT
    description: >-
      Sustained calcium overload triggers cardiomyocyte death and secondary fibrosis.

- name: Cardiomyocyte Necrosis and Replacement Fibrosis
  role: effector
  biological_scale: TISSUE
  description: >-
    Chronic calcium overload and membrane injury cause cardiomyocyte necrosis, with
    secondary replacement fibrosis and fatty infiltration that characteristically begin
    in the left ventricular posterobasal/inferolateral wall - the territory that lights
    up as late gadolinium enhancement on cardiac MRI across dystrophinopathy
    cardiomyopathy.
  cell_types:
  - preferred_term: cardiac fibroblast
    term:
      id: CL:0002548
      label: fibroblast of cardiac tissue
  biological_processes:
  - preferred_term: cardiomyocyte necrotic cell death
    term:
      id: GO:0097300
      label: programmed necrotic cell death
    modifier: INCREASED
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dystrophin deficiency disrupts the DGC and causes the muscle membrane fragility and
      an increase in susceptibility to the mechanical stress, which leads to progressive
      muscle necrosis and degeneration in both skeletal and cardiac muscles
    explanation: >-
      Names progressive necrosis and degeneration of cardiac muscle as the tissue-level
      consequence of the dystrophin deficit.
  - reference: PMID:32075145
    reference_title: "Dysregulation of Calcium Handling in Duchenne Muscular Dystrophy-Associated Dilated Cardiomyopathy: Mechanisms and Experimental Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is a key mechanistic contributor to muscle cell death, fibrosis, and diminished
      cardiac contractile function in DMD patients.
    explanation: >-
      Couples cell death with fibrosis and contractile decline, the transition this node
      makes to the heart-failure outcome.
  downstream:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    causal_link_type: DIRECT
    description: >-
      Cumulative myocyte loss and fibrotic replacement impair contraction and dilate the
      ventricle.

- name: Left Ventricular Dilation and Systolic Heart Failure
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The clinical endpoint: progressive left ventricular dilation with systolic
    dysfunction, presenting as congestive heart failure. In classic XLDCM this is rapid
    and lethal in adolescent and young-adult males; in the exon 45-55 subtype it is more
    indolent and more responsive to standard heart-failure therapy. The failing,
    fibrotic ventricle also provides the substrate for ventricular arrhythmia and sudden
    cardiac death.
  biological_processes:
  - preferred_term: impaired cardiac muscle contraction
    term:
      id: GO:0060048
      label: cardiac muscle contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      XLDCM is caused by mutations of the Duchenne muscular dystrophy (DMD) gene and
      results in lethal heart failure in individuals between 10 and 20 years.
    explanation: >-
      The heart-failure outcome and its characteristic age window in males.
  - reference: PMID:8504498
    reference_title: "X-linked dilated cardiomyopathy. Molecular genetic evidence of linkage to the Duchenne muscular dystrophy (dystrophin) gene at the Xp21 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked cardiomyopathy (XLCM) is a rapidly progressive primary myocardial disorder
      presenting in teenage males as congestive heart failure.
    explanation: >-
      The clinical presentation this node describes, from the original linkage cohort.
  downstream:
  - target: Congestive Heart Failure
    causal_link_type: DIRECT
  - target: Ventricular Arrhythmia and Sudden Cardiac Death
    causal_link_type: DIRECT
    description: >-
      Myocyte loss and fibrosis create a re-entrant/ectopic arrhythmic substrate.

- name: Ventricular Arrhythmia and Sudden Cardiac Death
  role: outcome
  biological_scale: ORGANISM
  description: >-
    A fibrotic, dilated ventricle is arrhythmogenic. Ventricular arrhythmia is a major
    cause of mortality in XLDCM and sudden cardiac death can be the presenting event,
    occurring without preceding overt heart failure - documented at autopsy by elevated
    pericardial-fluid NT-proBNP marking undiagnosed left ventricular dysfunction.
  evidence:
  - reference: PMID:32939432
    reference_title: "Sudden cardiac death of Duchenne muscular dystrophy with NT-proBNP in pericardial fluid as a useful biomarker for diagnosis of the cause of death: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cause of death was certified as an early dilated cardiomyopathy (DCM)/dysfunction
      of the left ventricle secondary to DMD
    explanation: >-
      A documented case of sudden death from dystrophin-deficient dilated cardiomyopathy,
      the terminal event this node models.


- category: Laboratory
  name: Elevated Creatine Kinase
  frequency: OCCASIONAL
  description: >-
    Serum creatine kinase is variable in XLDCM - it can be markedly elevated but is often
    normal, particularly with exon 45-55 deletions and in later-onset or female cases - so
    unlike in classic Duchenne, a normal CK does not exclude the diagnosis.
  phenotype_term:

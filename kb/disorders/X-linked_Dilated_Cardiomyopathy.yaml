    The defining and near-universal feature: left ventricular dilation with systolic
    dysfunction, in relative or complete isolation from skeletal myopathy.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
    clinical_course: PROGRESSIVE
  evidence:

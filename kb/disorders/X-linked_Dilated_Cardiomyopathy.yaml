    reference_title: "Preventing Cardiomyopathy in Duchenne Muscular Dystrophy: Long-Term Follow-Up of Patients in the Randomised, Placebo-Controlled Drug-Trial of Perindopril and Bisoprolol."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absolute LVEF% values reduced in both groups ('active': 62.5% ± 5.6% to 53.8% ±
      4.0%; 'placebo': 60.6% ± 4.9% to 50.4% ± 8.5%).
    explanation: >-
      Documents the progressive fall in left ventricular ejection fraction over follow-up
      in dystrophin-deficient cardiomyopathy; measured in a DMD cohort and applied to
      XLDCM as the same dystrophin-deficient cardiomyopathy, hence INDIRECT.


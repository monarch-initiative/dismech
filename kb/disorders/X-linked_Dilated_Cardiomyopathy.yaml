    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      X-linked dilated cardiomyopathy (XLDCM) is a distinct phenotype of dystrophinopathy
      characterized by preferential cardiac involvement without any overt skeletal myopathy.
    explanation: >-
      States both the defining cardiac phenotype and its isolation from skeletal disease.

- category: Cardiovascular

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum CPK levels were increased in 11 of 13 patients.
    explanation: >-
      Creatine phosphokinase was elevated in most, but not all, dystrophin-defect DCM
      patients, consistent with a variable, non-discriminating CK.

- category: Cardiovascular
  name: Dilated Cardiomyopathy in Heterozygous Female Carriers
  description: >-
    Carrier females are not cardiac-silent. About 8% develop dilated cardiomyopathy,
    typically with later onset and milder course than affected males, its risk rising with
    age and tracking skewed X-inactivation - which is why carriers warrant their own
    cardiac surveillance.
  phenotype_term:
    preferred_term: Dilated cardiomyopathy
    term:
      id: HP:0001644
      label: Dilated cardiomyopathy
    onset:
      onset_category: ADULT
  evidence:
  - reference: PMID:32650403
    reference_title: "Cardiac Involvement in Dystrophin-Deficient Females: Current Understanding and Implications for the Treatment of Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is known that about 8% of carriers present with dilated cardiomyopathy, though it
      may vary from 0% to 16.7%, depending on if the carrier is classified as having DMD or
      BMD.
    explanation: >-
      Quantifies the carrier-female cardiomyopathy risk and its range across DMD/BMD carrier
      classes.

genetic:
- name: DMD
  gene_term:
    preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  relationship_type: CAUSATIVE
  inheritance:
  - name: X-linked recessive
  notes: >-
    The same gene as Duchenne and Becker muscular dystrophy. XLDCM arises from a specific
    subset of DMD lesions that damage cardiac dystrophin while sparing skeletal muscle:
    (1) deletions of the muscle (M) promoter and first muscle exon at the 5' end, which
    abolish the muscle isoform (the paradigmatic "5' XLDCM"); (2) in-frame deletions in the
    exon 45-55 hotspot, which can present cardiac-predominantly with mild or absent skeletal
    disease; and (3) destabilizing missense variants. The functional consequence is loss or
    destabilization of dystrophin rather than a gain-of-function or dominant-negative effect.
  evidence:
  - reference: PMID:8504498
    reference_title: "X-linked dilated cardiomyopathy. Molecular genetic evidence of linkage to the Duchenne muscular dystrophy (dystrophin) gene at the Xp21 locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      XLCM is due to an abnormality within the centromeric half of the dystrophin genomic
      region in heart.
    explanation: >-
      Localizes the causal lesion to the dystrophin (DMD) gene, establishing XLDCM as a
      dystrophinopathy.
  - reference: PMID:18261911
    reference_title: "Follow-up of three patients with a large in-frame deletion of exons 45-55 in the Duchenne muscular dystrophy (DMD) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two younger patients diagnosed as having X-linked dilated cardiomyopathy (XLDCM)
      developed congestive heart failure without overt skeletal myopathy.
    explanation: >-
      Documents the exon 45-55 in-frame deletion class producing cardiac-predominant XLDCM
      without skeletal myopathy.

inheritance:
- name: X-linked recessive
  description: >-
    Hemizygous males are affected early and severely; heterozygous carrier females develop
    a milder, later-onset dilated cardiomyopathy, and there is no male-to-male transmission -
    the pedigree signature that distinguishes XLDCM from autosomal dominant familial DCM.
    Manifesting carriers are common, with expressivity governed by skewed X-inactivation.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:
  - reference: PMID:3574369
    reference_title: "X-linked dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-linked inheritance of dilated cardiomyopathy is suggested in this family by the early
      onset in males, late onset in females, and no evidence of male-to-male transmission.
    explanation: >-
      The original pedigree evidence for X-linked inheritance, including the
      no-male-to-male-transmission clue.
  - reference: PMID:3574369
    reference_title: "X-linked dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The late onset of the disease in females, in contrast to the early onset in hemizygous
      males, is compatible with heterozygosity for the mutant allele.
    explanation: >-
      The manifesting-carrier pattern: later-onset disease in heterozygous females.

has_subtypes:
- name: 5-prime XLDCM
  display_name: 5' muscle-promoter / exon-1 XLDCM
  description: >-
    The paradigmatic, severe class: a deletion of the muscle (M) promoter and first
    muscle exon at the 5' end of DMD abolishes the muscle dystrophin isoform. Skeletal
    muscle is rescued by up-regulating the brain isoform, but the ventricle cannot, so
    the phenotype is a rapidly progressive, often lethal cardiomyopathy in adolescent and
    young-adult males. Standard multi-exon deletion panels can under-detect the isolated
    promoter-region lesion.
  genes:
  - preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative mutation would include a deletion in the region and in exon 1
    explanation: >-
      Documents the 5' muscle-promoter/exon-1 deletion that defines this subtype.
- name: Exon 45-55
  display_name: Exon 45-55 in-frame deletion XLDCM
  description: >-
    An in-frame deletion in the exon 45-55 hotspot presents cardiac-predominantly with
    mild or absent skeletal disease, a more indolent course, and better responsiveness to
    ACE-inhibitor/beta-blocker therapy than the 5' class. Serum CK is frequently normal
    in this subtype.
  genes:
  - preferred_term: DMD
    term:
      id: hgnc:2928
      label: DMD
  evidence:
  - reference: PMID:18261911
    reference_title: "Follow-up of three patients with a large in-frame deletion of exons 45-55 in the Duchenne muscular dystrophy (DMD) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two younger patients diagnosed as having X-linked dilated cardiomyopathy (XLDCM)
      developed congestive heart failure without overt skeletal myopathy.
    explanation: >-
      Documents the exon 45-55 in-frame deletion class producing cardiac-predominant XLDCM
      without skeletal myopathy.

prevalence:
- population: Isolated cardiac (skeletal-sparing) XLDCM
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for the isolated cardiac XLDCM phenotype,
    which is historically defined by individual pedigrees rather than registries. The
    available numbers are diagnostic yields, not population rates: DMD defects were found in
    6.5% (13/201) of consecutive adult male DCM patients screened by Arbustini et al., and
    3% of a Japanese adult DCM cohort. These are the fraction of "idiopathic" male DCM
    attributable to dystrophin, not the occurrence of XLDCM in the general population, and
    must not be compared with a whole-population prevalence.
  evidence:
  - reference: PMID:10841222
    reference_title: "Prevalence and characteristics of dystrophin defects in adult male patients with dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dystrophin defects were identified in 13 of the 201 patients (6.5%, age 16-50).
    explanation: >-
      The diagnostic yield of dystrophin defects among consecutive male DCM patients, quoted
      as a yield and not a population prevalence.

diagnosis:
- name: DMD Molecular Genetic Testing (Deletion/Duplication Analysis then Sequencing)
  description: >-
    XLDCM is confirmed by identifying a pathogenic DMD variant. Multiplex ligation-dependent
    probe amplification (MLPA) or targeted deletion/duplication analysis is the first-tier
    test because most dystrophinopathy lesions are deletions/duplications; full-gene
    sequencing follows to detect the point mutations, small indels, and splice/deep-intronic
    variants that MLPA cannot see.
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      identification of a hemizygous pathogenic variant in DMD on molecular genetic testing
      in a male and of a heterozygous pathogenic variant in DMD on molecular genetic testing
      in a female
    explanation: >-
      GeneReviews states how a dystrophinopathy diagnosis is molecularly established in males
      and in carrier females.
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The definitive diagnosis is defined by the identification of the DMD gene mutations by
      gene analysis such as multiplex-PCR or multiplex ligation dependent probe amplification
      (MLPA).
    explanation: >-
      Names MLPA as the definitive molecular diagnostic method for XLDCM.

- name: Muscle-Promoter / Exon-1-Specific Analysis
  description: >-
    Because the paradigmatic 5' XLDCM lesion is a deletion of the muscle promoter and first
    muscle exon, testing that specifically covers the 5' promoter/exon-1 region is important
    when a cardiac-predominant phenotype with normal or near-normal strength is seen -
    standard multi-exon deletion panels can under-detect an isolated promoter-region lesion.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the causative mutation would include a deletion in the region and in exon 1
    explanation: >-
      Documents the muscle-promoter/exon-1 location of the causative lesion that motivates
      5'-specific testing.

- name: Electrocardiography (Characteristic Dystrophinopathy Pattern)
  description: >-
    A characteristic (though not pathognomonic) ECG pattern - tall R waves with high R/S
    ratio in the right precordial leads and deep lateral/inferior Q waves - is often present,
    sometimes before symptomatic heart failure, and is part of baseline and surveillance
    evaluation.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The electrocardiogram (ECG) in dystrophinopathy shows high R waves (R/S > 1) in the
      right precordial leads (V1-2), deep Q waves in leads I, aVL, and V5-6 or in leads II,
      III, and aVF
    explanation: >-
      The characteristic dystrophinopathy ECG signature used in XLDCM evaluation.

- name: Cardiac Imaging (Echocardiography and Cardiac MRI)
  description: >-
    Echocardiography is the first-line serial modality for left ventricular size and
    function. Cardiac MRI adds late gadolinium enhancement (LGE), the imaging correlate of
    the posterobasal/inferolateral fibrofatty replacement, which can precede overt systolic
    dysfunction on echo.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography results include myocardial thickening, wall motion abnormalities,
      enlargement of the left ventricle, and left ventricular systolic or diastolic
      dysfunction
    explanation: >-
      The echocardiographic findings tracked in XLDCM cardiac surveillance.
  - reference: PMID:34429516
    reference_title: "Duchenne muscular dystrophy patients: troponin leak in asymptomatic and implications for drug toxicity studies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Those with elevated cTnI were more likely to have late gadolinium enhancement on
      baseline CMR.
    explanation: >-
      Documents CMR late gadolinium enhancement in a DMD cohort; applied to XLDCM as the
      same dystrophin-deficient cardiomyopathy, hence INDIRECT.

- name: Agents / Circumstances to Avoid (Anesthesia)
  description: >-
    Dystrophinopathy patients are susceptible to malignant-hyperthermia-like reactions;
    succinylcholine and inhalational (volatile) anesthetics should be avoided. This is
    clinically important in XLDCM given that these patients may undergo cardiac surgery or
    heart transplantation.
  evidence:
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      succinylcholine and inhalational anesthetics because of susceptibility to malignant
      hyperthermia or malignant hyperthermia-like reactions
    explanation: >-
      GeneReviews lists succinylcholine and inhalational anesthetics among the
      agents/circumstances to avoid in dystrophinopathy.

biochemical:
- name: NT-proBNP
  presence: INCREASED
  context: >-
    N-terminal pro-B-type natriuretic peptide is the best-validated serum biomarker for
    detecting and tracking systolic dysfunction in dystrophin-deficient cardiomyopathy and
    is the practical analyte for longitudinal follow-up. Elevated pericardial-fluid
    NT-proBNP has also marked previously undiagnosed left ventricular dysfunction at autopsy
    in sudden death.
  biomarker_term:
    preferred_term: NT-proBNP measurement
    term:
      id: NCIT:C96610
      label: N-Terminal ProB-type Natriuretic Peptide Measurement
  evidence:
  - reference: PMID:32939432
    reference_title: "Sudden cardiac death of Duchenne muscular dystrophy with NT-proBNP in pericardial fluid as a useful biomarker for diagnosis of the cause of death: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      N-terminal-proBNP (NT-proBNP) was a robust laboratory biomarker to diagnose and monitor
      cardiac failure in clinical situations
    explanation: >-
      Establishes NT-proBNP as a validated biomarker for cardiac failure, here applied to
      dystrophin-deficient left ventricular dysfunction.
  - reference: PMID:34429516
    reference_title: "Duchenne muscular dystrophy patients: troponin leak in asymptomatic and implications for drug toxicity studies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NT-proBNP correlated with indexed left ventricular end diastolic and maximum left
      atrial volumes.
    explanation: >-
      NT-proBNP tracked left ventricular and atrial volumes in a DMD cohort; applied to
      XLDCM as the same dystrophin-deficient cardiomyopathy, hence INDIRECT.
  notes: >-
    No XLDCM-specific NT-proBNP reference interval or decision threshold could be cited from
    the fetched sources, so no reference_ranges are recorded. Standard cardiac biomarkers,
    including NT-proBNP, correlate only imperfectly with CMR-defined cardiomyopathy
    progression in this population, so NT-proBNP is a monitoring adjunct rather than a
    stand-alone staging tool.

histopathology:
- name: Absent/Reduced Myocardial Dystrophin on Immunostaining
  description: >-
    Immunohistochemical staining of cardiac (or skeletal) muscle shows absence or reduction
    of dystrophin, confirming the molecular diagnosis even when skeletal strength is normal.
  diagnostic: true
  evidence:
  - reference: PMID:32939432
    reference_title: "Sudden cardiac death of Duchenne muscular dystrophy with NT-proBNP in pericardial fluid as a useful biomarker for diagnosis of the cause of death: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Total absence of dystrophin was detected by immunohistochemical staining, which
      confirmed DMD.
    explanation: >-
      Absence of dystrophin on immunostaining is the confirmatory histopathologic finding.
- name: Cardiomyocyte Degeneration with Enlarged Heart
  description: >-
    The heart is enlarged (dilated) with disarray and degeneration of cardiomyocytes, the
    tissue correlate of the replacement fibrosis and myocyte loss modeled in the pathograph.
  evidence:
  - reference: PMID:32939432
    reference_title: "Sudden cardiac death of Duchenne muscular dystrophy with NT-proBNP in pericardial fluid as a useful biomarker for diagnosis of the cause of death: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The heart was enlarged with disarray and degeneration of cardiomyocytes in cardiac
      muscle.
    explanation: >-
      Autopsy histology of the dilated, degenerating dystrophin-deficient myocardium.

progression:
- phase: Classic 5' XLDCM (rapid)
  subtype: 5-prime XLDCM
  age_range: 10-20 years (males)
  notes: >-
    Rapidly progressive; in the original kindred affected males died within 5 to 12 months
    of symptom onset.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      die of heart failure between 10 and 20 years old
    explanation: >-
      The rapid, lethal course of classic XLDCM in males.
- phase: Exon 45-55 deletion (indolent)
  subtype: Exon 45-55
  notes: >-
    Milder, treatment-responsive course with relatively good life expectancy.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      they usually have a good life expectancy
    explanation: >-
      The more indolent prognosis of the exon 45-55 hotspot subtype.

treatments:
- name: Heart Failure Pharmacotherapy (ACE Inhibitor and Beta-Blocker)
  description: >-
    Standard heart-failure guideline-directed medical therapy is the mainstay for the
    dilated cardiomyopathy: an ACE inhibitor, usually combined with a beta-blocker.
    Combination therapy improved left ventricular function relative to ACE-inhibitor
    monotherapy in the dystrophinopathy-cardiomyopathy literature. An important recent
    caveat from the DMD Heart Protection Study long-term follow-up is that starting therapy
    prophylactically (before detectable dysfunction) did not produce a group-mean
    ejection-fraction advantage over starting at first detected dysfunction, though the trial notes
    small numbers and echo insensitivity - so early detection and prompt treatment at first
    dysfunction is the defensible strategy rather than universal prophylaxis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    treatment_effect: INHIBITS
    description: >-
      Standard neurohormonal-blockade heart-failure therapy acting on the ventricular
      remodeling and failure endpoint rather than on the dystrophin deficit.
    evidence:
    - reference: PMID:40130400
      reference_title: "Preventing Cardiomyopathy in Duchenne Muscular Dystrophy: Long-Term Follow-Up of Patients in the Randomised, Placebo-Controlled Drug-Trial of Perindopril and Bisoprolol."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        DMD Care Standards recommend starting angiotensin‐converting enzyme inhibitor (ACEi)
        medication empirically no later than the age of 10 years
      explanation: >-
        The standard-of-care recommendation to treat dystrophin-deficient cardiomyopathy with
        an ACE inhibitor.
  evidence:
  - reference: PMID:40130400
    reference_title: "Preventing Cardiomyopathy in Duchenne Muscular Dystrophy: Long-Term Follow-Up of Patients in the Randomised, Placebo-Controlled Drug-Trial of Perindopril and Bisoprolol."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While some patients may have benefited from 'early' (active) as opposed to 'delayed'
      (placebo) initiation of perindopril and bisoprolol, group-mean ventricular function did
      not differ between study arms after 60 months.
    explanation: >-
      The prophylaxis-versus-treat-at-detection nuance that qualifies how this therapy is
      timed.

- name: Angiotensin Receptor Blocker (Losartan) as ACE-Inhibitor Alternative
  description: >-
    An angiotensin receptor blocker such as losartan is an accepted alternative to an ACE
    inhibitor; a randomized double-blind trial of lisinopril versus losartan in
    dystrophin-deficient cardiomyopathy found both effective without establishing superiority of either.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: angiotensin II receptor antagonist
      term:
        id: NCIT:C66930
        label: Angiotensin II Receptor Antagonist
    - preferred_term: losartan
      term:
        id: CHEBI:6541
        label: losartan
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    treatment_effect: INHIBITS
    description: >-
      Renin-angiotensin blockade as an alternative to ACE inhibition for the failing
      ventricle.
  evidence:
  - reference: PMID:24459612
    reference_title: "A randomized, double-blind trial of lisinopril and losartan for the treatment of cardiomyopathy in duchenne muscular dystrophy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no therapeutic difference in EF improvement between lisinopril and losartan
      over the one-year duration for treatment of boys with DMD-related CM.
    explanation: >-
      The randomized trial establishing losartan (ARB) as equivalent to lisinopril (ACE
      inhibitor) for dystrophin-deficient cardiomyopathy, supporting the ARB as an alternative.

- name: Heart Transplantation
  description: >-
    The only curative option for end-stage dystrophin-deficient heart failure refractory to
    medical therapy. XLDCM is a favorable transplant setting precisely because skeletal and
    respiratory function is typically preserved - the comorbidity that complicates transplant
    candidacy in classic Duchenne is largely absent here - and post-transplant outcomes are
    comparable to non-dystrophinopathy recipients.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cardiac transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    treatment_effect: BYPASSES
    description: >-
      Replaces the failing organ rather than acting on the dystrophin deficit, which persists
      in the remaining tissues.
    evidence:
    - reference: PMID:28580208
      reference_title: "Heart transplantation in patients with dystrophinopathic cardiomyopathy: Review of the literature and personal series."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Heart transplantation (HT) is the only curative therapy for patients with
        dystrophinopathic end-stage heart failure who remain symptomatic despite an optimal
        medical therapy.
      explanation: >-
        States transplantation as the only curative option for end-stage dystrophinopathic
        cardiomyopathy.
  evidence:
  - reference: PMID:28580208
    reference_title: "Heart transplantation in patients with dystrophinopathic cardiomyopathy: Review of the literature and personal series."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      heart transplantation is a safe and effective treatment for selected patients with
      end-stage DCM.
    explanation: >-
      The authors' conclusion supporting transplantation in selected dystrophinopathic DCM
      patients.
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      cardiac transplantation is offered to persons with severe dilated cardiomyopathy and
      BMD with limited or no clinical evidence of skeletal muscle disease
    explanation: >-
      GeneReviews states that transplantation is offered when skeletal muscle disease is
      limited or absent - precisely the XLDCM situation that makes it a favorable candidate.

- name: Cardiac Surveillance (Including Carrier Females)
  description: >-
    Because subclinical cardiac dysfunction precedes symptoms and skeletal severity does not
    predict cardiac involvement, baseline and serial cardiac evaluation (ECG, echocardiography,
    and cardiac MRI for late gadolinium enhancement) is standard from diagnosis in affected
    individuals. Heterozygous carrier females need surveillance too, given their real,
    X-inactivation-dependent cardiomyopathy risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:32650403
    reference_title: "Cardiac Involvement in Dystrophin-Deficient Females: Current Understanding and Implications for the Treatment of Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cardiac symptoms are particularly prevalent in female dystrophin mutation carriers,
      affecting about 8% of this population with dilated cardiomyopathy (DCM) as a common
      presentation
    explanation: >-
      The carrier cardiac risk that justifies extending surveillance to heterozygous females.
  - reference: PMID:20301298
    reference_title: "Dystrophinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For heterozygous females: cardiac evaluation at least once after the teenage years
    explanation: >-
      GeneReviews' explicit surveillance recommendation for heterozygous carrier females.

- name: Device Therapy (ICD and Cardiac Resynchronization Therapy)
  description: >-
    For advanced disease, an implantable cardioverter-defibrillator addresses the ventricular
    arrhythmia / sudden-death risk, and cardiac resynchronization therapy (biventricular
    pacing) is used when heart failure is complicated by ventricular dyssynchrony.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac resynchronization therapy device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ventricular Arrhythmogenesis
    treatment_effect: INHIBITS
    description: >-
      Device therapy targets the arrhythmic substrate and dyssynchronous failure rather than
      the dystrophin deficit.
  evidence:
  - reference: PMID:26066469
    reference_title: "X-Linked Dilated Cardiomyopathy: A Cardiospecific Phenotype of Dystrophinopathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      cardiac resynchronization therapy (biventricular pacing), is appropriate for cases of
      heart failure with associated ventricular dyssynchrony
    explanation: >-
      The review's statement of CRT indication in dystrophinopathy cardiomyopathy with
      ventricular dyssynchrony.

animal_models:
- name: mdx mouse
  species: Mouse
  genotype: Dmd (mdx) dystrophin-null point mutation
  publication: PMID:30281092
  description: >-
    The standard, most widely used DMD mouse model. It develops a dilated cardiomyopathy
    with decreased fractional shortening, but the cardiac phenotype is mild and late-onset
    relative to human disease - a recognized model limitation.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces dystrophin-deficient dilated cardiomyopathy but only mildly and late,
      under-representing the severity and tempo of the human ventricular failure.
    limitations: >-
      Standard mouse models do not recapitulate all aspects of human disease pathology and
      exhibit only a mild cardiac phenotype; they also carry combined skeletal-plus-cardiac
      dystrophin loss rather than the cardiac-selective XLDCM lesion.
    evidence:
    - reference: PMID:30281092
      reference_title: "Cmah-dystrophin deficient mdx mice display an accelerated cardiac phenotype that is improved following peptide-PMO exon skipping treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Several mouse models have been developed to study molecular and pathological
        consequences of dystrophin deficiency, but do not recapitulate all aspects of human
        disease pathology and exhibit a mild cardiac phenotype.
      explanation: >-
        States the mdx/mouse cardiac-phenotype limitation directly.
- name: Cmah-/-;mdx mouse
  species: Mouse
  genotype: Cmah-null on mdx dystrophin-null background (Cmah-/-;mdx)
  publication: PMID:30281092
  description: >-
    An enhanced double-knockout model in which loss of CMP-sialic acid hydroxylase on the
    mdx background accelerates the cardiac phenotype toward the human course, used to
    evaluate cardiac-directed DMD therapeutics.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Systolic Heart Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Displays earlier ventricular functional deterioration than standard mdx, better
      approximating the human cardiac course.
    limitations: >-
      The acceleration is engineered through a Cmah-null background rather than the human
      isoform-topography mechanism, and the model is not skeletal-sparing, so it does not
      reproduce the cardiac-selective XLDCM phenotype.
    readouts:
    - name: Right ventricular ejection fraction and stroke volume
      target: Left Ventricular Dilation and Systolic Heart Failure
      direction: DECREASED
      interpretation: >-
        Earlier decline in ventricular function than in standard mdx, the functional
        correlate of the accelerated cardiomyopathy.
      evidence:
      - reference: PMID:30281092
        reference_title: "Cmah-dystrophin deficient mdx mice display an accelerated cardiac phenotype that is improved following peptide-PMO exon skipping treatment."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          reduction in right ventricle (RV) ejection fraction and stroke volume (SV) at 12
          weeks of age
        explanation: >-
          The measured ventricular-function deficit in this model.
    evidence:
    - reference: PMID:30281092
      reference_title: "Cmah-dystrophin deficient mdx mice display an accelerated cardiac phenotype that is improved following peptide-PMO exon skipping treatment."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        have an accelerated cardiac phenotype compared to the established mdx model
      explanation: >-
        Establishes the accelerated cardiac phenotype that makes this an informative cardiac
        model.
- name: Golden Retriever Muscular Dystrophy (GRMD) dog
  species: Dog
  genotype: DMD splice-site mutation causing exon skipping and an out-of-frame transcript
  publication: PMID:28526070
  description: >-
    A naturally occurring, genetically homologous canine dystrophinopathy whose more severe,
    progressive clinical course aligns better with human DMD than rodent models do, used as a
    translational large-animal model including for cardiac studies.
  modeled_mechanisms:
  - target: Sarcolemmal Fragility and Contraction-Induced Cardiomyocyte Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the dystrophin-loss membrane-fragility-and-necrosis mechanism in a
      large-animal system with a human-like progressive course.
    limitations: >-
      GRMD models the combined skeletal-plus-cardiac dystrophinopathy rather than an isolated
      cardiac-selective analog of XLDCM, and cost/availability limit its use.
    evidence:
    - reference: PMID:28526070
      reference_title: "The golden retriever model of Duchenne muscular dystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The absence of dystrophin leads to myofiber membrane fragility and necrosis, with
        eventual muscle atrophy and contractures.
      explanation: >-
        States the membrane-fragility-and-necrosis mechanism this model recapitulates.
  evidence:
  - reference: PMID:28526070
    reference_title: "The golden retriever model of Duchenne muscular dystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Because the GRMD clinical syndrome is more severe than in mice, better aligning with the
      progressive course of DMD, canine studies may translate better to humans.
    explanation: >-
      The translational rationale for using GRMD as a large-animal dystrophinopathy model.

discussions:
- discussion_id: xldcm_cardiac_selective_model_gap
  prompt: >-
    Does any available model reproduce the ventricle-selective, skeletal-sparing dystrophin
    loss that defines XLDCM, or do all models capture only the combined
    skeletal-plus-cardiac dystrophinopathy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Ventricle-Selective Loss of Dystrophin
  rationale: >-
    The node that makes XLDCM a distinct entity is the ventricle-selective loss of dystrophin
    driven by failed brain-isoform compensation in the human ventricle. Existing models do not
    reproduce this selectivity: standard mdx mice show only a mild, late cardiac phenotype;
    enhanced backgrounds (Cmah-null) and large-animal canine models accelerate or better
    match the course but carry combined skeletal-plus-cardiac dystrophin loss. The
    isoform-topography mechanism therefore rests on human autopsy/explant tissue (Neri 2012),
    and translational validity of model-derived cardiac findings to the cardiac-selective
    human phenotype remains the open question - so cross-model agreement should be judged
    mechanism by mechanism rather than treating a mild or combined-phenotype model as
    representative.
  proposed_experiments:
  - experiment_id: exp_xldcm_ventricle_selective_model
    name: Engineered ventricle-selective 5' DMD-isoform model with human-relevant isoform readouts
    description: >-
      Build a model (e.g., human iPSC-derived ventricular cardiomyocytes or an animal line)
      carrying the 5' muscle-promoter/exon-1 lesion, and measure brain- versus muscle-isoform
      dystrophin transcripts and ventricular dysfunction, testing whether the human
      isoform-compensation-failure mechanism is reproduced in ventricle without skeletal
      rescue confounders.
  evidence:
  - reference: PMID:30281092
    reference_title: "Cmah-dystrophin deficient mdx mice display an accelerated cardiac phenotype that is improved following peptide-PMO exon skipping treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Several mouse models have been developed to study molecular and pathological
      consequences of dystrophin deficiency, but do not recapitulate all aspects of human
      disease pathology and exhibit a mild cardiac phenotype.
    explanation: >-
      Direct evidence that standard mouse models under-represent the human cardiac phenotype,
      the mismatch this discussion records.

notes: >-
  Curated from a Claude Code deep-research report
  (research/X-linked_Dilated_Cardiomyopathy-deep-research-claude_code.md; 18 web searches,
  45 citations), with every cited reference independently fetched and quoted from its cached
  abstract or full text.

  Named-entity note: XLDCM (dystrophin/DMD, dilated) must be kept distinct from the other
  X-linked cardiomyopathies the deep-research report flagged as differentials - Barth syndrome
  (TAZ, DCM/LVNC with 3-methylglutaconic aciduria and neutropenia), Danon disease (LAMP2,
  predominantly hypertrophic), and X-linked Emery-Dreifuss muscular dystrophy (EMD). None of
  those share the DMD gene, and this entry cites only DMD/dystrophin sources.

  Two PMIDs supplied to the curator as candidate anchors were verified against the primary
  literature and found to be WRONG, so were not used: PMID:8281153 (proposed for "Towbin 1993")
  resolves to an NF-kappa B gene paper, and PMID:8302331 (proposed for "Muntoni 1993") resolves
  to a non-Hodgkin lymphoma model. The correct primary references are Towbin 1993 (PMID:8504498,
  Circulation, the Xp21 linkage study) and Muntoni 1993 (PMID:8361506, NEJM, the 5'
  muscle-promoter deletion). Muntoni's NEJM "brief report" has no structured abstract in the PubMed
  cache, so the 5' isoform-compensation mechanism is evidenced here from Neri et al. 2012
  (PMID:22455600), which directly maps the ventricular absence of the brain isoform, rather than
  from a Muntoni snippet.

  Conformance to cardiomyopathy_maladaptive_remodeling is claimed at the insult node
  (Sarcolemmal Fragility and Contraction-Induced Cardiomyocyte Injury -> Primary Cardiomyocyte
  Insult) and the outcome node (Left Ventricular Dilation and Systolic Heart Failure ->
  Structural Cardiac Impairment and Heart Failure), following the pattern used in Becker Muscular
  Dystrophy; the module's intervening neurohormonal/remodeling nodes are not separately claimed
  because the references read for this entry do not evidence those specific steps in XLDCM.

  Several mechanistic and treatment statements are supported by review-class sources
  (evidence_source OTHER: the XLDCM cardiospecific review PMID:26066469, the
  DGC-mechanotransduction review PMID:36168044, the calcium-handling review PMID:32075145, the
  carrier-females review PMID:32650403, and the transplant series PMID:28580208), because
  primary human tissue for this rare, lethal phenotype is scarce; the founding pedigree and
  linkage/isoform-mechanism claims rest on primary sources (PMID:3574369, PMID:8504498,
  PMID:22455600).


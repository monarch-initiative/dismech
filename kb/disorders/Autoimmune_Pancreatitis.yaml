clinical_trials:
- name: NCT04540497
  phase: PHASE_III
  status: ACTIVE_NOT_RECRUITING
  description: 'MITIGATE: phase 3 randomized, double-blind inebilizumab versus placebo in 135 adults with active IgG4-related disease, with matched glucocorticoid taper. The 52-week randomized comparison has been published; the registry remains active, not recruiting for extended follow-up. The population had multiorgan disease history and was not an AIP-only cohort.'
  evidence:
  - reference: clinicaltrials:NCT04540497
    reference_title: A Phase 3, Randomized, Double-blind, Multicenter, Placebo Controlled Study of Inebilizumab Efficacy and Safety in IgG4-Related Disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This study aims to evaluate the efficacy and safety of inebilizumab for the prevention of flare of Immunoglobulin G4-related disease (IgG4-RD).
    explanation: The registration record establishing the trial's identity and objective. Graded OTHER because a registry entry is a registration document rather than study evidence.
    quote_role: BACKGROUND
    directness: DIRECT
  - reference: PMID:39541094
    reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Treatment with inebilizumab reduced flare risk; 7 participants (10%) in the inebilizumab group had at least one flare, as compared with 40 participants (60%) in the placebo group (hazard ratio, 0.13; 95% confidence interval [CI], 0.06 to 0.28; P<0.001).
    explanation: Published primary result is distinct from registry status.
  notes: Registry status was checked against the live ClinicalTrials.gov record on 2026-09-21. No direct comparison with rituximab or demonstrated reversal of established pancreatic fibrosis was tested. The regulatory adult IgG4-related disease indication does not extend this trial result to type 2 AIP.
discussions:
- discussion_id: aip_smoking_endocrine_association
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Does smoking independently modify endocrine outcomes in established type 1 AIP?
  attaches_to:
  - phenotypes#Diabetes mellitus
  rationale: A retrospective cohort of 59 patients with established type 1 AIP associated smoking with prevalent diabetes at AIP diagnosis. It had no non-AIP comparison group and does not estimate smoking-related risk of developing AIP. The follow-up association was borderline, and occupation lost its baseline diabetes association after adjustment for smoking. These observations do not establish a pancreatic causal mechanism or a benefit from a tested smoking-cessation intervention.
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of Treatment or Time?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: At multivariable analysis, smoking (OR = 4.92; 95% CI 1.22–19.9) and obstructive jaundice (OR = 9.47; 95% CI 2.06–43.5) were strongly associated with the presence of DM at diagnosis of AIP
    explanation: The outcome is diabetes within an AIP cohort, not AIP occurrence.
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of Treatment or Time?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: After an adjustment for smoking, the association between blue-collar professions and DM at diagnosis lost statistical significance.
    explanation: Smoking and occupation are not demonstrated independent causal pathways.
- discussion_id: aip_subtype_boundary
  kind: CONTROVERSY
  prompt: How should established AIP subtypes be distinguished from checkpoint-inhibitor pancreatic injury?
  attaches_to:
  - has_subtypes#Type 1
  - has_subtypes#Type 2
  rationale: Type 1 and type 2 share some imaging appearances and glucocorticoid responsiveness but differ in histology, systemic associations and relapse. Immune-checkpoint-inhibitor pancreatic injury has been proposed as type 3, but it is a drug-associated spectrum with variable biochemical and clinical definitions, limited tissue series and uncertain steroid benefit. It is kept as a diagnostic boundary rather than assumed to share the established type 1 or type 2 pathways.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Although type 2 AIP shares some features with type 1 AIP, these two conditions are distinct without any overlaps.5 Table 1 summarizes the features of two types of AIP.
    explanation: Review of established subtype distinctions.
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The advent of ICI therapy has introduced a distinct form of immune-mediated pancreatic injury, which some investigators have proposed designating as type 3 autoimmune pancreatitis [7–9].
    explanation: Recent review discusses a proposed drug-associated category.
- discussion_id: aip_igg4_marker_or_mediator
  kind: KNOWLEDGE_GAP
  prompt: Which immunoglobulin functions contribute to human pancreatic injury?
  attaches_to:
  - pathophysiology#Increased IgG4 Secretion
  - pathophysiology#Acinar Tissue Injury
  rationale: IgG4 enrichment is neither proof of a single pathogenic effector nor proof of a harmless marker. Published neonatal-mouse transfer experiments found injury with both patient IgG1 and IgG4, greater injury with IgG1 and attenuation when IgG4 accompanied IgG1. Antigen, tissue context, subclass composition and chronic human immune initiation remain unresolved. B-cell depletion efficacy does not identify which antibody or antigen-presentation function mediates benefit.
  evidence:
  - reference: PMID:26964842
    reference_title: Pathogenicity of IgG in patients with IgG4-related disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: 'RESULTS: Subcutaneous injection of patient IgG, but not control IgG, resulted in pancreatic and salivary gland injuries. Pancreatic injury was also induced by injecting patient IgG1 or IgG4, with more destructive changes induced by IgG1 than by IgG4. The potent pathogenic activity of patient IgG1 was significantly inhibited by simultaneous injection of patient IgG4.'
    explanation: Human IgG passive transfer into neonatal mice; abstract-supported scope.
- discussion_id: aip_human_causal_scope
  kind: KNOWLEDGE_GAP
  prompt: Which experimental immune pathways are necessary in human type 1 AIP?
  attaches_to:
  - pathophysiology#Plasmacytoid Dendritic Cell Activation
  - pathophysiology#CD4+SLAMF7+ Cytotoxic T Lymphocyte Expansion
  rationale: Preventive mouse pDC/IFNAR interventions, human coculture perturbations and systemic IgG4-RD T-cell assays support candidate mechanisms at different scales. The small human CTL study included ten pancreatic cases among 18 systemic cases; bulk tissue TCR overlap in two patients cannot prove the identity of every pancreatic infiltrating cell. Cytokine secretion and nonpancreatic target killing do not establish the entire CTL-to-pancreatic-fibrosis route. IgG4 output does not resolve class switching, BAFF necessity or the initiating human NET stimulus.
  evidence:
  - reference: url:https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
    reference_title: https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In addition, inhibition of NET formation by DNase or blockade of IFN- a–mediated signaling pathways by anti-IFNAR Ab signiﬁcantly reduced IgG4 production in a coculture system comprised of control B cells, patient-derived neutrophils, and patient-derived pDCs (Fig. 7C).
    explanation: DNase and IFNAR blockade reduced IgG4 secretion in a defined human coculture; intervening signals remain unresolved.
  - reference: PMID:26971690
    reference_title: Clonal expansion of CD4(+) cytotoxic T lymphocytes in patients with IgG4-related disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: These CD4+ SLAMF7+ T cells cells have potent cytolytic function; upon in vitro stimulation with anti-CD3, these cells undergo degranulation as inferred from the surface expression of CD107a (Fig 2, D) and exhibit cytotoxic activity against allogeneic EBV-transformed B cell targets (Fig 2, E and Fig E6).
    explanation: The targets were allogeneic EBV-transformed B cells; pancreatic epithelial killing was not tested.
  - reference: PMID:29499100
    reference_title: A CD8α- Subset of CD4+SLAMF7+ Cytotoxic T Cells Is Expanded in Patients With IgG4-Related Disease and Decreases Following Glucocorticoid Treatment.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Eighteen patients (11 male, 7 female) with a mean age of 64 years (range, 47-83 years) were included in the study (Table 1).
    explanation: Small systemic cohort scope.
- discussion_id: aip_long_term_risk
  kind: KNOWLEDGE_GAP
  prompt: How do treatment and disease activity affect long-term pancreatic function and cancer risk?
  attaches_to:
  - phenotypes#Exocrine pancreatic insufficiency
  - phenotypes#Diabetes mellitus
  rationale: Published cohorts differ in selection, testing completeness, therapy and follow-up. Associations of maintenance steroids with relapse or survival are not randomized estimates, while steroids can improve or worsen glucose control. A selected decade-long cohort had only two pancreatic cancers and broad confidence intervals; neither a proven excess risk nor a universal cancer-surveillance interval follows. Shorter type 2 series and biopsy-dependent ascertainment further limit cross-subtype prognosis comparisons.
  evidence:
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Overall malignancy risk was not increased (SIR 1.00; 95%CI 0.59-1.42), while pancreatic cancer (PC) showed a numerically higher SIR (1.98 overall; 2.96 ≥ 5 years postdiagnosis).
    explanation: Imprecise pancreatic-cancer estimate.
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of Treatment or Time?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: No strong association was found between pharmacological treatment and occurrence of PEI and DM.
    explanation: Observational treatment comparisons do not show absence of any benefit.
notes: Type 1 AIP is the pancreatic manifestation of systemic IgG4-related disease; this entry also retains the distinct type 2 duct-centric disorder. Systemic IgG4-RD cohorts and treatment trials are identified explicitly, rather than treated as pancreas-only evidence. Hospital survey rates and feature frequencies depend on diagnostic criteria and assessed denominators. URL-cached primary papers are identified by their canonical PMID in the bibliography or accompanying evidence; the European guideline is PMID:32552502, the 2017 international treatment consensus PMID:28027896, the MITIGATE report PMID:39541094, the 2021 Japanese survey PMID:42154026 and the NET/pDC study PMID:26297761.

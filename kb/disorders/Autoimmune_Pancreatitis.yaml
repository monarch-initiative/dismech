    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: It also examined which side effects occurred after AZA treatment; among them, pancreatitis, gastrointestinal symptoms, liver damage, severe leukopenia, and hair loss were the most common.
    explanation: Reported toxicity in the reviewed literature.

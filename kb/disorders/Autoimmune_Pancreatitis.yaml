    preferred_term: plasmablast
    term:
      id: CL:0000980
      label: plasmablast
  readouts:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Reports the oligoclonal plasmablast expansion that this entry curates as the type 1
      driver, rather than the IgG4 that names the disease. The separation between the two is the point.
    evidence:
    - reference: PMID:24817416
      reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4
        concentrations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: 'The IgG4-RD patients had substantially elevated total plasmablast counts (median 4698/mL,
        range 610-79524/mL) compared to both untreated disease controls (median 592/mL, range
        19-4294/mL; p < 0.001) and healthy controls (median 94/mL, range 1-653/mL; p < 0.001).'
      explanation: 'The measurement with both comparator arms, which is what makes it a biomarker rather
        than a description: the disease controls separate it from generic inflammation, not only from
        health.'
    - reference: PMID:24817416
      reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4
        concentrations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Among IgG4-RD patients, thirteen (36%) had normal serum IgG4 concentrations
      explanation: The independence claim, and the reason this biomarker is curated at all. A third of
        patients with active disease would be missed by the serological criterion the disease is named
        for. Note the denominator is 36 patients, so the 36% is thirteen people.
genetic:
- name: CTLA4
  gene_term:
    preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  relationship_type: SUSCEPTIBILITY
  subtype: Type 1
  association: Promoter, exon 1 and 3' untranslated region polymorphisms associated with disease
    susceptibility and, separately, with relapse risk in Japanese patients.
  frequency: Not a Mendelian determinant; a common-variant risk allele carried by 64% of patients and
    42% of controls in the study that reported it.
  notes: 'The genetics of autoimmune pancreatitis is susceptibility genetics, not causal genetics, and
    the entry types it that way deliberately. No gene has been shown to cause the disease. CTLA4 is
    included because it is mechanistically coherent - CTLA4 is the inhibitory checkpoint that restrains
    T-cell activation, the same axis whose pharmacological blockade produces the type 3 subtype recorded
    in has_subtypes - and because the reported association separates susceptibility from relapse, which
    matters clinically.

    Three limits on how far this should be read. The study is 59 patients against 102 controls in one
    Japanese population, which is small for a common-variant association and not necessarily portable.
    The relapse associations rest on a subset of those 59 and their odds ratios (5.45 and 12.66) are
    large with wide implied uncertainty, which is the signature of a small stratum rather than a large
    effect. And no replication cohort is cited.

    A separate high-throughput study of 27 type 1 patients against 30 healthy donors nominated eleven
    further candidate genes, of which P2RX3 and TOP1 survived Bonferroni correction. Those are not
    curated as genetic entries here: a 27-versus-30 candidate-panel study without replication nominates
    hypotheses rather than establishing associations, and the HGNC identifiers could not be resolved by
    the term tooling available in this repository. The finding is recorded in this note so that it is
    not lost, and so that a future curator does not have to rediscover why it was left out.

    The HLA DRB1*0405-DQB1*0401 haplotype and Fc receptor-like 3 polymorphisms are described in the
    same source as previously associated with the disease. They are not curated as separate entries
    because the source states the association as background rather than reporting it.'
  evidence:
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings suggest that AIP is associated with a genetic polymorphism in CTLA4 and is
      positively correlated with serum sCTLA4 levels.
    explanation: The association claim in the authors' own hedged wording. It is a case-control genotype
      association in 59 patients and 102 healthy subjects, which is why relationship_type is
      SUSCEPTIBILITY rather than CAUSATIVE or RISK_FACTOR.
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The +49A/A and +6230A/A genotypes were associated with an enhanced risk of relapse (OR 5.45,
      P= 0.038 and OR 12.66, P= 0.022).
    explanation: The relapse association, which is a different claim from the susceptibility association
      and rests on a smaller stratum of the same cohort. Quoted with its odds ratios so a reader can see
      how imprecise they are.
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the HLA DRB1*0405-DQB1*0401 haplotype and Fc receptor-like 3 polymorphisms have
      been associated with AIP, the role of other genetic factors is largely unknown.
    explanation: Establishes that the genetic architecture is a set of HLA and immune-regulatory
      susceptibility loci rather than a causal gene, and states in the source's own words how little is
      settled. This is background reported by the authors, not a result they measured.
  - reference: PMID:28955865
    reference_title: A high-throughput sequence analysis of Japanese patients revealed 11 candidate genes
      associated with type 1 autoimmune pancreatitis susceptibility.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 27 type 1 AIP patients and 30 healthy blood donors were recruited, and DNA
      samples were isolated from their mononuclear cells.
    explanation: Cited for its sample size rather than its findings. It is the reason the eleven
      candidate genes it nominated are described in this entry's notes instead of being curated as
      genetic entries, so the quote that carries the claim is the methods sentence, not a result.
- name: HLA-DRB1
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  relationship_type: SUSCEPTIBILITY
  subtype: Type 1
  association: Genome-wide significant susceptibility locus for IgG4-related disease, with the strongest
    signal at the seventh amino acid residue of the peptide-binding groove.
  notes: 'This is the best-evidenced genetic association in the entry and it displaces CTLA4 as the
    headline. It comes from a genome-wide association study of 835 patients against 1789 controls, which
    is an order of magnitude larger than the CTLA4 candidate-gene study, and it reaches genome-wide
    significance rather than a nominal p value.

    Two scoping points. It is an IgG4-related disease GWAS, not an autoimmune pancreatitis one, so the
    subtype field restricts it to type 1 and it says nothing about type 2 or type 3. And the implicated
    residue - position 7 of the peptide-binding groove - is the same one associated with other autoimmune
    diseases, so the finding places this disease in a general class of HLA class II-restricted
    autoimmunity rather than identifying anything specific to it.'
  evidence:
  - reference: PMID:38229354
    reference_title: 'IgG4-related disease in the Japanese population: a genome-wide association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the HLA-DRB1 (p=1\u00B71\u00D710-11) and FCGR2B (p=2\u00B70\u00D710-8) regions\
      \ as susceptibility loci for IgG4-related disease."
    explanation: The primary result with both loci and their p values.
  - reference: PMID:38229354
    reference_title: 'IgG4-related disease in the Japanese population: a genome-wide association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified crucial aminoacid residues in the \u03B2 domain of the peptide-binding\
      \ groove of HLA-DRB1, in which the seventh aminoacid residue showed the strongest association signal\
      \ with IgG4-related disease"
    explanation: Localises the signal to the peptide-binding groove, which is what makes it a claim about
      antigen presentation rather than a marker association.
- name: FCGR2B
  gene_term:
    preferred_term: FCGR2B
    term:
      id: hgnc:3618
      label: FCGR2B
  relationship_type: SUSCEPTIBILITY
  subtype: Type 1
  association: Genome-wide significant susceptibility locus, with the associated variant increasing
    FCGR2B expression and correlating with the number of involved organs and with IgG4 concentration.
  notes: 'The mechanistically interesting half of the GWAS. FCGR2B encodes the inhibitory Fc gamma
    receptor, so a variant that raises its expression is altering how immune complexes are handled - and
    IgG4 is the subclass with the weakest Fc receptor engagement. The association with number of swollen
    organs and with IgG4 concentration is what makes it a candidate modifier of disease extent rather
    than only of disease risk. Both those secondary associations are nominal (p=0.011 and p=0.035), which
    is worth reading alongside the genome-wide significance of the primary signal.'
  evidence:
  - reference: PMID:38229354
    reference_title: 'IgG4-related disease in the Japanese population: a genome-wide association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rs1340976 in FCGR2B showed an association with increased FCGR2B expression (p=2\u00B77\u00D710-10)\
      \ and was in weak linkage disequilibrium with rs1050501, a missense variant of FCGR2B previously\
      \ associated with systemic lupus erythematosus."
    explanation: Gives the direction of effect on expression, which is what makes the locus
      interpretable, plus the link to another autoimmune disease at the same gene.
  - reference: PMID:38229354
    reference_title: 'IgG4-related disease in the Japanese population: a genome-wide association study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Furthermore, rs1340976 was associated with the number of swollen organs at diagnosis
      (p=0.011) and IgG4 concentration at diagnosis (p=0.035).
    explanation: The severity associations, quoted with their nominal p values so a reader can weigh them
      against the genome-wide primary signal rather than inheriting them at the same strength.
- name: Autoantigen candidates
  gene_term:
    preferred_term: LGALS3
    term:
      id: hgnc:6563
      label: LGALS3
  relationship_type: BIOMARKER
  subtype: Type 1
  association: Galectin-3 is one of four proposed IgG4-related disease autoantigens, alongside annexin
    A11, laminin 511-E8 and prohibitin 1. Anti-galectin-3 autoantibodies were found in 13.5% of
    IgG4-related cholangitis patients and in no primary sclerosing cholangitis controls.
  notes: 'Curated as a single record with galectin-3 as the bound representative rather than as four
    records, because the four are a set of candidates from one line of work and none is established. The
    study that tested galectin-3 and prohibitin 1 functionally is a negative one - knockdown, inhibition
    and recombinant protein all failed to show a clear protective role against toxic bile acids - so
    what exists is antibody prevalence, not a demonstrated pathogenic mechanism. The disease specificity
    differs sharply between the two: anti-galectin-3 was absent from the disease controls, while
    anti-prohibitin 1 was present in 35.7% of them, which makes only the first a candidate marker.'
  evidence:
  - reference: PMID:38332916
    reference_title: Galectin-3 and prohibitin 1 are autoantigens in IgG4-related cholangitis without
      clear-cut protective effects against toxic bile acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Four autoantigens have recently been described in IgG4-RD: annexin A11, galectin-3, laminin
      511-E8, and prohibitin 1.'
    explanation: Names the candidate set. This is the antigen question the entry's plasmablast-clonality
      argument implies but cannot answer.
  - reference: PMID:38332916
    reference_title: Galectin-3 and prohibitin 1 are autoantigens in IgG4-related cholangitis without
      clear-cut protective effects against toxic bile acids.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Anti-galectin-3 autoantibodies were detected in 13.5% of individuals with IRC but not in
      PSC.
    explanation: The prevalence and, importantly, the disease-control comparison. Absence in primary
      sclerosing cholangitis is what distinguishes a candidate marker from a nonspecific autoantibody.
  - reference: PMID:38332916
    reference_title: Galectin-3 and prohibitin 1 are autoantigens in IgG4-related cholangitis without
      clear-cut protective effects against toxic bile acids.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: Gene-specific knockdown, pharmacological inhibition, and recombinant protein substitution
      did not clearly disclose a protective role of these autoantigens in human cholangiocytes against
      toxic bile acids.
    explanation: Graded REFUTE against the reading that these autoantigens have an established
      pathogenic or protective function. The authors tested their own hypothesis three ways and it did
      not hold, which is why this record claims antibody prevalence and nothing more.
environmental:
- name: Immune checkpoint inhibitor therapy
  description: Anti-PD-1, anti-PD-L1 and anti-CTLA-4 therapy, which causes the type 3 subtype directly.
    Incidence is 0.5% to 5.7% depending on how it is defined and which regimen is used, with combination
    immunotherapy carrying a significantly higher risk.
  exposure_term:
    preferred_term: exposure to an immune checkpoint inhibitor
    term:
      id: ECTO:9001737
      label: exposure to antineoplastic agent
  influences_mechanisms:
  - target: Checkpoint Blockade-Induced Acinar-Centric T Cell Infiltration
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: The exposure is the cause of this node, not a risk factor for it. Checkpoint blockade
      removes the restraint on T-cell activation by design, and the pancreatic infiltration is that
      mechanism acting on the wrong tissue.
    evidence:
    - reference: PMID:41922528
      reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
        epidemiology, pathophysiology, and management.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The incidence ranges from 0.5% to 5.7% depending on definitions and regimens, with
        combination immunotherapy conferring a significantly higher risk.
      explanation: Quantifies the exposure-outcome relationship and shows it is dose-like - more
        checkpoint blockade, more pancreatitis - which is what a triggering relationship should look
        like.
  evidence:
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
      epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Notably, ICI-P development may be associated with improved overall survival, potentially
      reflecting enhanced antitumor immunity.'
    explanation: 'The observation that makes this exposure genuinely awkward rather than simply harmful:
      the pancreatic injury may mark the antitumour response working. Curated with the source''s own
      double hedge intact, because it bears on whether stopping the drug is the right response and the
      evidence does not settle that.'
  notes: 'The exposure term is broader than the exposure. ECTO has no term for checkpoint inhibitor
    exposure specifically and none for the individual agents; exposure to antineoplastic agent is the
    most specific correct ancestor, with the drug class kept in preferred_term. This matches the binding
    used in Autoimmune_Encephalitis for the same exposure.'
treatments:
- name: Corticosteroid Induction Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: 'Oral corticosteroids, typically four weeks followed by a taper, are the initial treatment
    of both type 1 and type 2. The response is the defining therapeutic fact about this disease and is
    also diagnostic in practice, since a steroid-responsive pancreatic mass is very unlikely to be
    adenocarcinoma.

    Note that it works in both subtypes despite the two having different mechanisms. That is not a
    paradox - corticosteroids suppress both lymphoplasmacytic and neutrophilic inflammation - but it does
    mean treatment response cannot be used as evidence that the two share a pathogenesis.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    description: Broad suppression of the lymphoplasmacytic inflammatory response driving type 1.
  - target: Type 2 Neutrophilic Duct-Centric Injury
    description: Suppression of the neutrophilic duct-centric inflammation of type 2, by a different
      route to the same clinical effect.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial treatment of both AIP and IDCP is with oral corticosteroids for duration of 4 weeks
      followed by a gradual taper.
    explanation: States the regimen and, critically for this entry, that it is the same for both
      subtypes.
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoimmune pancreatic disease is the only pancreatic condition treated effectively with
      corticosteroids.
    explanation: States the specificity of the steroid response among pancreatic diseases, which is what
      makes it diagnostically useful as well as therapeutic.
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eighty-four % patients received the initial steroid therapy, and 85% received maintenance
      steroid therapy.
    explanation: Real-world uptake in 1474 patients, which establishes that corticosteroids are the
      actual standard of care and not only the recommended one. Also records that maintenance therapy is
      as routine as induction, which the regimen description above does not convey.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune
      pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten-year survival was 85.5%, and CS maintenance was associated with better OS.
    explanation: Bears on the value of continued treatment rather than on the induction response this
      treatment entry is about, and it is an association in a retrospective cohort where the patients who
      stayed on steroids may differ systematically from those who stopped. Graded INDIRECT for that
      reason.
- name: Rituximab for Relapsing Disease
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: 'B-cell depletion for relapsing type 1 disease. It is mechanistically the most targeted
    therapy available here, because it removes the compartment whose oligoclonal expansion characterises
    the disease, and it is used precisely where the disease behaviour - relapse - reflects that ongoing
    B-cell response.

    Relapse is largely a type 1 problem. It is common in type 1 and relatively uncommon in type 2, which
    is why this treatment belongs to one subtype rather than to the entry as a whole.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    description: Depletes the B-cell compartment that supplies the oligoclonal plasmablast expansion
      driving type 1 disease.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with relapsing AIP, treatment with immunomodulators and more recently rituximab
      has been recommended.
    explanation: States the indication. It is a recommendation rather than a trial result, which is the
      level at which this record makes its claim.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapses are common in AIP and relatively uncommon in IDCP, a relatively rare disease for
      which the natural history is not well understood.
    explanation: Establishes that relapse is a type 1 problem, which is the reason this treatment is
      subtype-specific. The same sentence records that type 2's natural history is poorly understood.
  - reference: PMID:35737955
    reference_title: Recent progress on the treatment of type 1 autoimmune pancreatitis and IgG4-related
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Conventional induction and maintenance therapies with glucocorticoid or rituximab are
      recommended in all symptomatic patients with active IgG4-RD.
    explanation: An independent recommendation of the same agent, framed at the IgG4-RD level rather than
      the pancreas level.
  notes: 'No efficacy figure appears in this record because none exists for rituximab in this disease.
    PMID:35737955 states that no randomized clinical trials other than glucocorticoid maintenance for
    type 1 have been performed, and rituximab use here rests on case series and off-label experience.

    An earlier version of this entry generalised that sentence into a claim that no trial exists in the
    field, and used it to justify having no clinical_trials block. That was wrong. The phase 3 MITIGATE
    trial of inebilizumab in IgG4-related disease (n=135) is now curated, and it is directly relevant to
    this record: it is the trial that establishes anti-CD19 B-cell depletion where rituximab has only
    uncontrolled experience, and the source describing it explicitly frames rituximab as the off-label
    comparator whose relative merits remain unsettled.'
- name: Anti-CD19 B-Cell Depletion (Inebilizumab)
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: 'Anti-CD19 depletion, which reaches a broader span of the B-cell lineage than anti-CD20
    does - including the plasmablasts this entry curates as the type 1 driver. That is the mechanistic
    argument for preferring it over rituximab, and it is now supported by the only randomised
    controlled evidence in this disease area.

    Two limits on how far this record should be read. The trial enrolled IgG4-related disease rather
    than autoimmune pancreatitis specifically, so it applies to type 1 and to nothing else here. And
    severe adverse events, particularly infections and lymphopenia, were more frequent on treatment.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: inebilizumab
      term:
        id: NCIT:C88283
        label: Inebilizumab
  target_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    description: Depletes the CD19-positive B-cell compartment including plasmablasts, which is the node
      this entry treats as the type 1 driver and the one anti-CD20 reaches less completely.
  - target: CD4+SLAMF7+ Cytotoxic T Lymphocyte Expansion
    description: 'Indirect, and mechanistically the interesting part: if the cytotoxic T-cell population
      is sustained by continuous plasmablast antigen presentation, removing the plasmablasts should
      starve it. The entry records this as the rationale rather than as a demonstrated effect - the trial
      measured recurrence and IgG4, not this cell population.'
  evidence:
  - reference: PMID:40745228
    reference_title: '[Anti-CD19 treatment: the new gold standard for IgG4-related diseases].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using CD19 as the therapeutic target addresses a broad spectrum of B cell differentiation
      including plasmablasts.
    explanation: The mechanistic rationale for the target choice, and the reason this record's
      target_mechanisms point where they do.
  - reference: PMID:40745228
    reference_title: '[Anti-CD19 treatment: the new gold standard for IgG4-related diseases].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Severe undesired events occurred more frequently with inebilizumab, particularly infections
      and lymphopenia but without treatment-associated cases of death.
    explanation: The harm side, curated alongside the efficacy result rather than after it. Both halves
      come from the same trial and a record carrying only one would misrepresent it.
  notes: 'FDA-approved for IgG4-related disease in 2025. The source calls it a candidate new gold
    standard while noting that long-term remission-maintenance data and a head-to-head comparison
    against off-label rituximab are both still missing, and this record does not go further than that.'
- name: Anti-TNF-alpha Therapy for Type 2 Disease
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: 'Tumour necrosis factor alpha blockade as an alternative to glucocorticoids in type 2
    disease. It is curated because the treatments section otherwise covers only the type 1 pathway, and
    an entry built around the argument that these are two mechanisms should not have a therapeutic
    section that implies one.

    The evidence is a review describing it as promising, not a trial. Type 2 is rare enough that no
    controlled evidence exists, which is the same constraint that makes its natural history a knowledge
    gap in this entry.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anti-TNF-alpha monoclonal antibody
      term:
        id: NCIT:C20401
        label: Monoclonal Antibody
  target_mechanisms:
  - target: Type 2 Neutrophilic Duct-Centric Injury
    description: Suppresses the TNF-driven component of the neutrophilic duct-centric inflammation that
      defines type 2.
  evidence:
  - reference: PMID:37826920
    reference_title: 'Autoimmune pancreatitis type 2 (idiopathic duct-centric pancreatitis): A
      comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with AIP-2 respond well to glucocorticoids, with anti-tumor necrosis factor-alpha
      antibodies as a promising alternative therapy.
    explanation: 'The claim, with the source''s own hedge - promising, not established - preserved. Note
      it also states the glucocorticoid response for type 2, which is the comparator this alternative is
      an alternative to.'
diagnosis:
- name: Distinguishing autoimmune pancreatitis from pancreatic adenocarcinoma
  description: The central diagnostic problem. Both present as a pancreatic mass, and the consequence of
    getting it wrong runs in both directions - an unnecessary pancreatic resection, or a delayed cancer
    diagnosis. Recurrent acute pancreatitis or painless jaundice is what should prompt the evaluation.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recurrent acute pancreatitis or painless jaundice should prompt an evaluation for autoimmune
      pancreatitis.
    explanation: States the clinical trigger for considering the diagnosis.
- name: Serum IgG4 measurement
  description: Elevated to more than twice the upper reference limit in most type 1 patients, and normal
    in type 2. It is a subtype discriminator rather than a test for the disease as a whole, and a normal
    value does not exclude autoimmune pancreatitis.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: IgG4 levels are often elevated in AIP and normal in IDCP.
    explanation: States the discriminating value of the test between the two subtypes, and by implication
      its limitation as an entry-level diagnostic.
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The sensitivity of IgG4 levels in type 1 AIP was low (43%, 21/49 patients).
    explanation: Puts a number on the limitation. Note the population this is measured in - patients who
      were resected because cancer was suspected - which is precisely the population in which the test
      needed to work and did not. The sensitivity in an unselected clinic population is not this number.
- name: Histological assessment for granulocytic epithelial lesions
  description: The only way to establish type 2 positively, since it has no serological marker. The
    granulocytic epithelial lesion is what is being looked for, because the features it shares with type
    1 cannot discriminate.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histologically, lymphoplasmacytic acinar inflammation and storiform fibrosis are seen in
      both.
    explanation: States what histology does not discriminate, which is why the granulocytic epithelial
      lesion specifically is the target of the assessment.
- name: Serum CA 19-9 measurement
  description: Frequently ordered when a pancreatic mass is found, and of no use for the question that
    actually matters here. It is elevated in about half of autoimmune pancreatitis patients, so a raised
    value does not argue for adenocarcinoma. Recorded as a diagnosis entry because the negative result is
    clinically load-bearing - it is what stops a raised CA 19-9 being read as confirmation of cancer.
  evidence:
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Serum CA 19 - 9 levels are not useful in distinguishing between AIP and PDAC.'
    explanation: The authors' conclusion, stated as a negative finding. Quoted with the source's own
      spacing of the analyte name.
- name: Recognising the scale of misdiagnosis
  description: How often the diagnostic problem is actually got wrong, which is the quantity that
    justifies everything else in this section. Autoimmune pancreatitis is a small fraction of pancreatic
    resections for suspected cancer but a large fraction of the resections that turn out to have been
    unnecessary.
  evidence:
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 8917 pancreatic resections were performed because of a clinical suspicion of pancreatic
      cancer. AIP accounted for 140 cases (1.6%).
    explanation: The absolute rate, pooled over ten studies. 1.6% of resections is the frequency with
      which this specific error is made, and it is the strongest available argument for a diagnostic
      workup before surgery.
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AIP accounted for almost 26% of all cases of benign diseases involving unnecessary surgery
    explanation: The same error expressed against the right denominator. Among resections that should not
      have happened, a quarter were this disease - which is what makes it the leading avoidable cause
      rather than a rare curiosity.
- name: Cross-sectional and endoscopic imaging
  description: 'Imaging is what finds this disease and what makes it a diagnostic problem, and until
    this round the diagnosis section covered serology, histology and CA 19-9 without it.

    The point worth curating is an asymmetry between the subtypes rather than the modalities themselves.
    Type 2 has no serum marker and no extrapancreatic disease, so histologic evaluation of the
    granulocytic epithelial lesion is required rather than supportive - which is why
    endoscopic-ultrasound-guided core biopsy is the modality that matters there. Type 1 has both a serum
    marker and extrapancreatic findings to corroborate the imaging. The entry states the histological
    route elsewhere; this record says why the two subtypes need different routes to the same diagnosis.'
  evidence:
  - reference: PMID:37826920
    reference_title: 'Autoimmune pancreatitis type 2 (idiopathic duct-centric pancreatitis): A
      comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because AIP-2 is a pancreas-restricted disease without a specific serum marker, the
      evaluation of histologic features (e.g., granulocytic epithelial lesions) is essential for an
      accurate diagnosis.
    explanation: States why type 2 cannot be diagnosed the way type 1 is, and names the histologic
      feature that carries the diagnosis there.
  - reference: PMID:37826920
    reference_title: 'Autoimmune pancreatitis type 2 (idiopathic duct-centric pancreatitis): A
      comprehensive review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this regard, endoscopic ultrasound-guided core biopsy has a key role, but novel
      diagnostic markers and modalities are clearly needed.
    explanation: Names the tissue-sampling modality and, in the same sentence, records that the field
      considers current diagnostics insufficient. The entry leans on EUS-guided sampling in a prevalence
      note about rising ascertainment without curating it anywhere until now.
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
      epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 16% of patients exhibit focal mass-like pancreatic enlargement, and on\
      \ 1\u2078F-FDG PET/CT, focal uptake (66%) can mimic metastatic disease, underscoring the importance\
      \ of clinical correlation when evaluating pancreatic lesions during oncologic surveillance"
    explanation: 'A measured PET/CT result rather than a statement that a paper will discuss PET/CT,
      which is what an earlier version of this record quoted. It also lands on the entry''s central
      theme from the other direction: the imaging that finds this disease can itself mimic malignancy,
      so in the type 3 arm the modality creates the same diagnostic trap the type 1 and type 2 arms
      create histologically. The superscript in "1\u2078F-FDG" is the source''s own, reproduced.'
  - reference: PMID:36293522
    reference_title: 'Autoimmune Pancreatitis: From Pathogenesis to Treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ICDC is currently the standard for the diagnosis of AIP and is more effective in
      diagnosing this disease than previously published systems
    explanation: Establishes which framework the field actually uses, and that it superseded the earlier
      national criteria. This is the sentence an earlier version of these notes claimed did not exist.
  notes: 'An earlier version of this record said the named diagnostic frameworks were not curated
    "because no cited source in this entry states their content in a quotable sentence". That was false.
    PMID:36293522, cited seven times in this entry, states the ICDC''s standing directly, and it is now
    quoted below.

    This was the third negative-existence claim in this entry contradicted by a file already committed
    alongside it, after "HPO has no term for a tumefactive pancreatic mass" and "no randomized trials
    other than glucocorticoid maintenance have been performed". Three is a pattern rather than three
    slips, and the rule that would have caught all three is cheap: before writing that a source, term or
    trial does not exist, grep for it. Recorded here rather than silently deleted because the pattern is
    more useful to a later curator than the corrected sentence is.'
animal_models:
- name: Poly(I:C)-induced experimental autoimmune pancreatitis in MRL/Mp mice
  species: Mouse
  genotype: Wild-type MRL/Mp (autoimmune-prone inbred strain), no engineered lesion
  background: MRL/Mp
  description: 'The standard experimental model of the disease. Repeated intraperitoneal
    polyinosinic-polycytidylic acid in autoimmune-prone MRL/Mp mice produces pancreatic immune cell
    infiltration, fibrosis and destruction of pancreatic architecture, with extrapancreatic involvement
    and raised serum autoantibodies.

    It is worth being explicit about what kind of model this is. There is no genetic lesion and no
    antigen - the disease is induced by a generic innate-immune stimulus in a strain that is already
    predisposed to autoimmunity. So the model reproduces the tissue outcome of the disease without
    reproducing anything about its cause, and it cannot be used to argue for a particular trigger.'
  publication: PMID:29512140
  modeled_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The model produces a pancreatic lymphocytic infiltrate with systemic autoantibody
      elevation, and CD8+ T cells accumulate in the inflamed pancreas.
    limitations: 'The recapitulation is of the inflammatory response, not of the specific immunology this
      node asserts. Mice have no IgG4 antibody subclass at all, so the plasmablast and IgG4 axis that
      defines the human node cannot exist in this model. What the model shows is that an autoimmune-prone
      strain given a generic innate stimulus develops pancreatic autoimmune inflammation; it does not
      show that the human disease arises the same way.'
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: The mouse genome encodes no IgG4 orthologue. The defining serological and
        histological feature of type 1 disease - IgG4-positive plasma cells and raised serum IgG4 - is
        therefore not merely unmeasured in this model but structurally impossible in it.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: Disease is induced by repeated poly(I:C), a synthetic double-stranded RNA analogue
        acting on innate pattern-recognition receptors. No candidate human trigger or autoantigen is
        represented, so the model reproduces the downstream inflammation without the upstream cause the
        node is about.
    readouts:
    - name: CD8+ T cells in the inflamed pancreas
      target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
      direction: INCREASED
      interpretation: Establishes that the model's pancreatic infiltrate contains an expanded cytotoxic
        T-cell compartment, which is the part of the human adaptive response this model can speak to.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: AIP in MRL/Mp mice was induced by repeated intraperitoneal administration of poly I:C
          and CD8+ T cells were increased in the inflamed pancreas.
        explanation: Reports both the induction protocol and the measured increase, in one sentence.
    - name: SLAMF7+CD8+ T cells in spleen and pancreas
      target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
      direction: INCREASED
      interpretation: A specific activated cytotoxic subset the model nominates as pathogenic. It is a
        model-derived hypothesis about the human disease, not a human finding.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: SLAMF7+CD8+ T cells were elevated in the spleen and pancreas of AIP mice.
        explanation: The measurement itself, in both compartments assayed.
    evidence:
    - reference: PMID:29512140
      reference_title: Autoimmune Pancreatitis Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although mice lack the IgG4 Ab subtype, autoimmune-prone MRL/Mp mice treated with repeated
        injection with polyinosinic-polycytidylic acid (poly (I:C)) provide an experimental model of AIP.
      explanation: Establishes the model as the accepted experimental system and, in the same sentence,
        states the species limitation that caps its fidelity. Both halves of this link's claim come from
        this one sentence, which is why it is cited on the link rather than on a readout.
  - target: Storiform Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The model reproduces the fibrotic half of the type 1 tissue lesion - pancreatic immune
      cell infiltration, fibrosis, and destruction of pancreatic architecture.
    limitations: 'Storiform fibrosis and obliterative venulitis specifically are not reported in the
      model; what is reported is fibrosis and architectural destruction. So the match is to the fibrotic
      process rather than to the particular pattern that carries diagnostic weight in human histology,
      which is why this is PARTIALLY_RECAPITULATES rather than RECAPITULATES.'
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: The measured quantity is pancreatic fibrosis and architectural destruction. The
        node's quantity is storiform fibrosis, a specific pattern. The model reports the former and is
        cited for the latter.
    evidence:
    - reference: PMID:29512140
      reference_title: Autoimmune Pancreatitis Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These mice exhibit massive destruction of pancreatic architecture associated with
        pancreatic immune cell infiltration and fibrosis.
      explanation: Attests that the model is informative for this node. It sat on the pre-split bundled
        link, where it was the half of the claim the model could actually support; after the split it
        belongs here, against the fibrotic node alone.
    readouts:
    - name: Pancreatic immune cell infiltration and fibrosis
      target: Storiform Fibrosis
      direction: INCREASED
      interpretation: The tissue-level correlate of this node that the model does reproduce.
      evidence:
      - reference: PMID:29512140
        reference_title: Autoimmune Pancreatitis Mouse Model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These mice exhibit massive destruction of pancreatic architecture associated with
          pancreatic immune cell infiltration and fibrosis.
        explanation: Names the three tissue changes measured in the model.
    - name: Pancreatic inflammation and fibrosis under dexamethasone
      target: Storiform Fibrosis
      direction: DECREASED
      interpretation: The model reproduces the disease's defining therapeutic behaviour - the lesion is
        corticosteroid-responsive. This is the strongest fidelity argument available for the model, and
        it is a behavioural rather than a mechanistic match.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Dexamethasone treatment ameliorated pancreatic inflammatory and fibrosis of AIP.
        explanation: Reports the steroid response in the model. Quoted as written, including the
          source's grammatical slip.
  - target: IgG4-Positive Lymphoplasmacytic Infiltration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: 'The model cannot reproduce this node, and the reason is structural rather than
      technical: the mouse genome encodes no IgG4 subclass, so IgG4-positive plasma cells cannot exist
      in it. This is recorded as an explicit negative link rather than as a caveat on the fibrosis link,
      because it is a substantive claim about what the model can never show.'
    limitations: The defining serological and histological feature of type 1 disease - raised serum IgG4
      and IgG4-positive plasma cells in tissue - is not merely unmeasured in this model but unavailable
      in principle. No amount of further work on this model can produce evidence about it, so any
      inference from the model to this node is invalid rather than weak.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: The mouse has no IgG4 antibody subclass. The node's defining feature therefore has no
        counterpart in the model organism at all.
    evidence:
    - reference: PMID:29512140
      reference_title: Autoimmune Pancreatitis Mouse Model.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: Although mice lack the IgG4 Ab subtype, autoimmune-prone MRL/Mp mice treated with repeated
        injection with polyinosinic-polycytidylic acid (poly (I:C)) provide an experimental model of AIP.
      explanation: 'The model''s own describing paper states the limitation in the same sentence that
        introduces the model. Graded REFUTE against the proposition that this model recapitulates the
        IgG4-positive infiltration node, which is what a FAILS_TO_RECAPITULATE link asserts.'
  notes: 'Nothing in this entry treats the model as evidence for a human mechanism on its own. It is
    curated because the entry makes claims about a tissue lesion and a steroid response that the model
    does reproduce, and because the one thing it definitively cannot reproduce - IgG4 - is itself
    informative about how central IgG4 is to the disease as opposed to how central it is to the
    diagnostic criteria. That question is the open uncertainty already recorded on the type 1 tissue
    node.'
clinical_trials:
- name: NCT04540497
  phase: PHASE_III
  status: COMPLETED
  description: MITIGATE. Randomised, double-blind, placebo-controlled phase 3 study of the anti-CD19
    antibody inebilizumab in active IgG4-related disease, n=135. It reduced the risk of recurrence to 10%
    against 60% on placebo and led to FDA approval for IgG4-related disease in 2025.
  target_phenotypes:
  - preferred_term: Tumefactive pancreatic mass
    term:
      id: HP:6000409
      label: Pancreatic mass
  evidence:
  - reference: clinicaltrials:NCT04540497
    reference_title: A Phase 3, Randomized, Double-blind, Multicenter, Placebo Controlled Study of
      Inebilizumab Efficacy and Safety in IgG4-Related Disease
    supports: SUPPORT
    evidence_source: OTHER
    snippet: This study aims to evaluate the efficacy and safety of inebilizumab for the prevention of
      flare of Immunoglobulin G4-related disease (IgG4-RD).
    explanation: The registration record establishing the trial's identity and objective. Graded OTHER
      because a registry entry is a registration document rather than study evidence.
  - reference: PMID:40745228
    reference_title: '[Anti-CD19 treatment: the new gold standard for IgG4-related diseases].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The multicenter randomized placebo-controlled phase 3 study MITIGATE (n = 135) first
      investigated the anti-CD19 antibody inebilizumab in active IgG4-RD. The treatment significantly
      reduced the risk of recurrence (10% vs. 60% under placebo), the annual exacerbation rate and the
      necessity for renewed administration of glucocorticoids.
    explanation: The result, with its design and denominator. This is the trial whose existence an
      earlier version of this entry denied.
  notes: 'The scoping question this record raises is real and is answered here rather than used to
    exclude the trial. MITIGATE enrolled IgG4-related disease, not autoimmune pancreatitis specifically,
    so its population is broader than this entry and its result does not transfer to type 2 or type 3 at
    all. It is curated because type 1 disease is the pancreatic manifestation of IgG4-related disease -
    which is what this entry says in its first line - so a trial in IgG4-RD is a trial in the parent
    condition of one of this entry''s subtypes, not in an unrelated disease.'
discussions:
- discussion_id: aip_one_disease_or_two
  kind: CONTROVERSY
  prompt: Is autoimmune pancreatitis one disease with two subtypes, or a clinical grouping of two
    mechanistically distinct diseases that happen to look alike?
  attaches_to:
  - has_subtypes#Type 1
  - has_subtypes#Type 2
  - pathophysiology#Tumefactive Pancreatic Mass
  rationale: 'This entry is curated as one disease with subtypes, and the case against that is strong
    enough to record rather than leave implicit.

    Against one disease: the pathology literature states that type 1 and type 2 "show little morphologic
    or pathogenic overlap". Different effector cells (plasmablast and IgG4-positive plasma cell versus
    neutrophil), different chemokine biology, different serology, different age at presentation,
    different presenting syndrome, different relapse behaviour, and different systemic associations
    (IgG4-related disease versus inflammatory bowel disease). Under this reading the term is
    grouping-shaped.

    For one disease: they share the radiological entity, the tumefactive mass, the cancer mimicry that
    dominates management, and the corticosteroid response, and they are diagnosed under one set of
    international consensus criteria. Clinically they are one problem presenting to one clinic.

    The entry resolves this in favour of one entry with two subtypes for a practical reason as much as a
    principled one. Type 1 is already represented in this knowledge base inside IgG4-Related_Disease as a
    Pancreato-hepato-biliary pattern subtype, and type 2 is represented nowhere at all. A grouping whose
    two members are an existing systemic disease and a non-existent entry would be harder to maintain
    than one entry carrying both mechanisms explicitly as parallel arms - which is what this pathograph
    does, with no edge joining the type 1 and type 2 triggers.

    A reviewer who prefers the grouping reading has good grounds, and the pathograph is built so that
    splitting later would be mechanical rather than a rewrite.'
- discussion_id: aip_igg4_marker_or_mediator
  kind: KNOWLEDGE_GAP
  prompt: Is IgG4 the mediator of type 1 disease, or a marker of it and possibly a counter-inflammatory
    response to it?
  attaches_to:
  - pathophysiology#IgG4-Positive Lymphoplasmacytic Infiltration
  rationale: 'The disease is named after IgG4, diagnosed by IgG4, and defined histologically by
    IgG4-positive plasma cells - and whether IgG4 does anything pathogenic is unresolved. The proposal on
    the table is that other subclasses such as IgG1 mediate the injury while IgG4 represents a response
    that dampens excessive inflammation, which would make the disease''s defining marker close to an
    epiphenomenon of it.

    This matters beyond nomenclature. If IgG4 is a dampening response, the correlation between serum
    IgG4 and disease activity is indirect, treatments aimed at IgG4 specifically would be misdirected,
    and the success of B-cell depletion is explained by removing the plasmablast compartment rather than
    by removing IgG4. This entry curates the plasmablast expansion rather than IgG4 itself as the driving
    node for that reason.'
  proposed_experiments:
  - experiment_id: aip_igg4_subclass_pathogenicity
    name: Subclass-resolved pathogenicity testing of AIP patient immunoglobulin
    description: Separate IgG1 and IgG4 fractions from type 1 patient serum and test each for the
      capacity to produce pancreatic injury in a permissive model, rather than inferring pathogenicity
      from abundance in tissue.
    readouts:
    - name: Pancreatic injury attributable to IgG1 versus IgG4 fractions
      target: pathophysiology#IgG4-Positive Lymphoplasmacytic Infiltration
      direction: INCREASED
      interpretation: Injury from the IgG1 fraction with none or less from IgG4 would support the marker
        reading and argue against IgG4-directed therapy.
- discussion_id: aip_type2_natural_history_unknown
  kind: KNOWLEDGE_GAP
  prompt: What is the natural history of type 2 autoimmune pancreatitis, and how much of its apparently
    better prognosis is real rather than an artefact of how it is ascertained?
  attaches_to:
  - has_subtypes#Type 2
  - phenotypes#Recurrent acute pancreatitis
  rationale: 'Type 2 has no serological marker, so it can only be diagnosed on histology, which means it
    can only be diagnosed in patients who were biopsied or resected. That is a strong selection filter,
    and it applies to every statement made about the subtype - including the statement that it relapses
    rarely, which is exactly the kind of claim a biopsy-ascertained cohort would get wrong in a
    predictable direction. The source reporting the low relapse rate says in the same sentence that the
    natural history is not well understood.

    This is recorded because the subtype-specific claims in this entry - the presentation, the relapse
    behaviour, the IBD association - all rest on that filtered denominator, and none of them is corrected
    for it in any published series.'
notes: 'Boundary with IgG4-Related_Disease. Type 1 autoimmune pancreatitis is the pancreatic
  manifestation of IgG4-related disease, and this knowledge base already curates IgG4-Related_Disease
  with a Pancreato-hepato-biliary pattern subtype. This entry does not re-derive the systemic disease.
  What it adds is type 2, which is not IgG4-related at all and is covered by neither IgG4-Related_Disease
  nor Chronic_Pancreatitis, plus the pancreas-level architecture in which the two mechanisms converge on
  one mass lesion.

  If a future curation prefers to treat this term as a grouping, the pathograph here is built to allow
  it: the type 1 and type 2 triggers are separate root nodes with no edge between them, joined only at
  the shared Tumefactive Pancreatic Mass consequence.

  On ontology bindings. An earlier version of this paragraph claimed four terms were deliberately
  broader than the concept they carry, and it was wrong about at least two of them. That is worth
  recording rather than quietly deleting, because a paragraph asserting that no suitable term exists is
  exactly the kind of prose nobody re-checks.

  Two of the four claims were false. HPO does have a term for a pancreatic mass, HP:6000409, and the
  phenotype was bound to HP:0001732 Abnormality of the pancreas instead - dramatically broader, and
  defended by the false claim. It is now bound correctly. HPO also has terms for the individual
  extrapancreatic manifestations, so the multi-organ phenotype has been supplemented with separately
  bound sclerosing cholangitis and sialadenitis records rather than resting on one maximally general
  inflammation term. The third claim, about combined exocrine and endocrine insufficiency, is now moot -
  that phenotype was split into two separately bound records earlier in this PR, which is what should
  have happened instead of seeking a term for the bundle.

  The one claim that stands is that CL has no separate term for the T follicular helper 2 subset, so
  CL:0002038 T follicular helper cell carries it with the subset in preferred_term.

  The general lesson: a claim that an ontology lacks a term is a factual claim about the ontology and
  should be checked against it, not asserted from the absence of an obvious match.

  What is deliberately absent. No claim that type 3 shares a mechanism with the other two - it is
  curated as a subtype, and now as its own root pathophysiology node with its own exposure, precisely
  because nothing connects it mechanistically to the other arms. And no comorbidity record for the
  inflammatory bowel disease association, which is real and strong but belongs in kb/comorbidities/
  rather than being asserted from a review sentence here.

  On the reference set. This round took the entry from 4 cited references to 26, all of the sources the
  review named as load-bearing among them. Sixteen further references fetched during screening are
  pruned rather than committed uncited. The criterion applied was whether the source supports a claim
  this entry makes that is not already supported: several are good reviews of material the entry now
  cites from a primary source instead, several are single case reports of manifestations the entry does
  not curate, and several are about IgG4-related disease in organs outside the pancreas. Pruning them is
  a decision on the record rather than an oversight, and any of them can be consumed on request if a
  reviewer judges one load-bearing.'

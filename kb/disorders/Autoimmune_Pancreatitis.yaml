- name: Neutrophilic Duct Infiltration
  biological_scale: CELLULAR
  description: In type 2 AIP, neutrophils infiltrate ductal epithelium and can extend into acinar tissue. Tissue sampling affects detection, and comparable nonspecific inflammatory changes must be distinguished from diagnostic granulocytic epithelial lesions.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The neutrophil-rich nature of inflammation discriminates type 2 from type 1 AIP.1,2,17 Characteristically, many neutrophils infiltrate the epithelial layer of the pancreatic ducts, a finding designated as GEL (Fig. 1C).2 Intraductal clusters of neutrophils resembling crypt abscesses in IBD often co-exist (Fig. 1D). Neutrophilic infiltration is also present in acini or around small ductules, but is less specific for the diagnosis of type 2 AIP.
    explanation: Review description of the defining neutrophilic duct lesion.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:

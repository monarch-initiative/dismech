- name: Glucocorticoids for symptomatic type 2 disease
  description: Type 2 AIP usually responds to a short induction course followed by taper. Many patients do not require maintenance because relapse is uncommon in published series; associated IBD treatment and recurrence require individual assessment. Spontaneous improvement has also been reported.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Type 2 AIP is a steroid-responsive disorder, and rapid improvements in symptoms and imaging abnormalities are expected within 2 or 3 weeks of the commencement of corticosteroids.6,7 Spontaneous regression without immunosuppression has also been documented. In contrast to type 1 AIP, in which relapse is relatively common (30% to 50%), disease relapse is uncommon in type 2 AIP (10%);6,7 therefore, maintenance therapy is unnecessary in most patients. The majority of patients with type 2 AIP present with features of acute pancreatitis (60%) or painless jaundice (30%).6,7 Episodes of acute pancreatitis in patients with type 2 AIP are clinically mild without the need for intensive care unit admission, the development of organ failure, or peripancreatic fluid collection.6 Other less common patterns of presentation include liver dysfunction, non-specific abdominal symptoms, and the incidental detection of a pancreatic mass on images taken for other purposes.
    explanation: Review summarizes rapid response and lower relapse frequency.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

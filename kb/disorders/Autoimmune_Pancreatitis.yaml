progression:
- phase: Relapse of type 1 disease
  subtype: Type 1
  notes: Relapse can occur in the pancreas, other IgG4-related organs, or both. The 2021 Japanese hospital survey estimated cumulative relapse of 12.5% at three years, 20.7% at five and 36.0% at ten. A separate 83-person corticosteroid-treated cohort selected for at least ten years of observation or death estimated 56.9% at ten years. Different selection, treatment and follow-up preclude pooling these rates or treating either as a universal prognosis. Corticosteroid discontinuation and IgG4 normalization were observational correlates, not randomized evidence for lifelong treatment or a deterministic biomarker rule.
  evidence:
  - reference: PMID:42154026
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2021.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Kaplan-Meier analysis demonstrated a cumulative relapse incidence of 12.5%, 20.7%, 36.0%, 44.0%, 53.3%, and 68.9% at 3, 5, 10, 15, 20, and 25 years, respectively.
    explanation: Survey-specific relapse estimates.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'RESULTS: Cumulative relapse rates at 1, 3, 5, 7, and 10 years were 11.0%, 26.9%, 38.3%, 50.0%, and 56.9%.'
    explanation: Selected long-follow-up cohort.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: CS discontinuation independently predicted relapse, whereas serum IgG4 normal at diagnosis or normalized after CS was protective.
    explanation: Retrospective associations do not establish treatment causation.
- phase: Relapse of type 2 disease
  subtype: Type 2
  notes: Relapse is less common in published type 2 series, and maintenance is unnecessary in many patients. Limited cohorts and histological ascertainment leave long-term estimates uncertain; probable diagnoses associated with IBD do not invariably require a diagnostic pancreatic biopsy.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In contrast to type 1 AIP, in which relapse is relatively common (30% to 50%), disease relapse is uncommon in type 2 AIP (10%);6,7 therefore, maintenance therapy is unnecessary in most patients.
    explanation: Review summarizes a roughly 10% relapse estimate from selected series, without establishing lifetime risk.
- phase: Pancreatic functional impairment
  notes: Exocrine insufficiency and diabetes may already be present at diagnosis and can persist or develop later. In one 59-person type 1 cohort, exocrine testing was available in 44 at baseline and 52 at follow-up; 32 and 33, respectively, had insufficiency. These changing denominators do not establish a treatment response. The 2021 survey found diabetes in 1,250/2,790 and exocrine insufficiency in 409/2,813 before initial glucocorticoids, illustrating substantial ascertainment differences between studies. Treatment effects cannot be separated reliably from disease severity and duration in these observational comparisons.
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of Treatment or Time?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: PEI prevalence at diagnosis was 72.7% and was 63.5% at follow-up.
    explanation: The source abstract reports percentages; full Table 1 supplies the differing denominators.
  - reference: url:https://link.springer.com/content/pdf/10.1007/s00535-026-02438-w.pdf
    reference_title: https://link.springer.com/content/pdf/10.1007/s00535-026-02438-w.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Diabetes mellitus was present in 1250 of 2790 patients (44.8%) before initial GC therapy and increased signifi- cantly to 1428 (51.2%) after therapy (P < 0.001). Similarly, pancreatic exocrine insufficiency was observed in 409 of 2813 patients (14.5%) before treatment and increased to 476 (16.9%) after therapy (P = 0.014).
    explanation: Contemporary survey reports measured denominators before and after therapy.
- phase: Long-term survival and complications
  subtype: Type 1
  notes: Long-term follow-up includes nutritional status, diabetes, pancreatic function and treatment toxicity. In a selected 83-person cohort, ten-year survival was 85.5%. Overall malignancy incidence was not elevated against the reference population; the two pancreatic cancers yielded imprecise estimates compatible with no increase. An association between steroid maintenance and survival cannot establish a causal survival benefit. Serum albumin change is a nonspecific nutritional marker, not a direct measure of pancreatic exocrine function.
  evidence:
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Ten-year survival was 85.5%, and CS maintenance was associated with better OS.
    explanation: Selected retrospective cohort; not a randomized maintenance comparison.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Overall malignancy risk was not increased (SIR 1.00; 95%CI 0.59-1.42), while pancreatic cancer (PC) showed a numerically higher SIR (1.98 overall; 2.96 ≥ 5 years postdiagnosis).
    explanation: The numerically higher pancreatic-cancer estimate is not proof of an excess risk.
pathophysiology:
- name: Neutrophil Extracellular Trap Formation
  biological_scale: CELLULAR
  description: Extracellular neutrophil DNA structures occur in experimental and human type 1 AIP lesions. NET-containing cultures activate pDC-associated responses, but neither a universal human initiating antigen nor an obligatory temporal sequence has been established.
  evidence:
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In addition, the inflamed pancreas of these patients but not controls also contained NETs that were shown to be capable of pDC activation.
    explanation: NETs were observed in mouse and human lesions; the human initiating stimulus was not established.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Plasmacytoid Dendritic Cell Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: NET-containing preparations stimulate pDC responses in culture; translation to the initiating human lesion is inferred.
    evidence:
    - reference: PMID:26297761
      reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: More importantly, patient pDCs cultured in the presence of NETs produced greatly increased levels of IFN-α and induced control B cells to produce IgG4 (but not IgG1) as compared with control pDCs.
      explanation: Patient pDCs were studied with NETs and healthy-control B cells. This culture does not distinguish new class switching from expansion of pre-existing IgG4-secreting cells.
- name: Plasmacytoid Dendritic Cell Activation
  biological_scale: CELLULAR
  description: Pancreatic pDC accumulation and activation accompany type 1 AIP. Human tissue and coculture findings complement preventive pDC-depletion experiments in induced murine pancreatitis.
  evidence:
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Consistent with these findings, we found that patients with IgG4-related AIP also exhibited pancreatic tissue localization of IFN-α-expressing pDCs and had significantly higher serum IFN-α levels than healthy controls.
    explanation: Pancreatic localization and circulating IFN-alpha were human observations, not a human intervention.
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: We found that the development of AIP in treated MRL/Mp mice occurred in parallel with pancreatic accumulation of pDCs producing IFN-α, and with pDC depletion and IFN-α-blocking studies, we showed that such accumulation was necessary for AIP induction.
    explanation: pDC depletion and type-I-IFN receptor blockade preceded induction in MRL/Mp mice; this does not demonstrate reversal of established human fibrosis.
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  downstream:
  - target: Type I Interferon Production
    causal_link_type: DIRECT
    description: Activated patient pDCs produce IFN-alpha in the experimental coculture.
    evidence:
    - reference: PMID:26297761
      reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: More importantly, patient pDCs cultured in the presence of NETs produced greatly increased levels of IFN-α and induced control B cells to produce IgG4 (but not IgG1) as compared with control pDCs.
      explanation: Patient pDCs were studied with NETs and healthy-control B cells. This culture does not distinguish new class switching from expansion of pre-existing IgG4-secreting cells.
- name: Type I Interferon Production
  biological_scale: MOLECULAR
  description: Activated pDC-associated IFN-alpha production is elevated in the examined human AIP specimens and cultures. Mouse and culture receptor-blockade studies concern IFN-alpha/beta signaling, rather than demonstrating an alpha-specific necessary mechanism in patients.
  evidence:
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Consistent with these findings, we found that patients with IgG4-related AIP also exhibited pancreatic tissue localization of IFN-α-expressing pDCs and had significantly higher serum IFN-α levels than healthy controls.
    explanation: Pancreatic localization and circulating IFN-alpha were human observations, not a human intervention.
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: More importantly, patient pDCs cultured in the presence of NETs produced greatly increased levels of IFN-α and induced control B cells to produce IgG4 (but not IgG1) as compared with control pDCs.
    explanation: Patient pDCs were studied with NETs and healthy-control B cells. This culture does not distinguish new class switching from expansion of pre-existing IgG4-secreting cells.
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: INCREASED
  downstream:
  - target: Increased IgG4 Secretion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Type-I-IFN-dependent coculture signals contribute to IgG4 output. BAFF is also produced, but its necessity was not separately tested.
    evidence:
    - reference: url:https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
      reference_title: https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: In addition, inhibition of NET formation by DNase or blockade of IFN- a–mediated signaling pathways by anti-IFNAR Ab signiﬁcantly reduced IgG4 production in a coculture system comprised of control B cells, patient-derived neutrophils, and patient-derived pDCs (Fig. 7C).
      explanation: DNase and IFNAR blockade reduced IgG4 secretion in a defined human coculture; intervening signals remain unresolved.
  - target: Pancreatic Lymphoplasmacytic Infiltration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Preventive IFNAR blockade attenuates induced mouse pancreatitis; its relevance to sustained human type 1 inflammation is an extrapolation.
    evidence:
    - reference: PMID:26297761
      reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: We found that the development of AIP in treated MRL/Mp mice occurred in parallel with pancreatic accumulation of pDCs producing IFN-α, and with pDC depletion and IFN-α-blocking studies, we showed that such accumulation was necessary for AIP induction.
      explanation: pDC depletion and type-I-IFN receptor blockade preceded induction in MRL/Mp mice; this does not demonstrate reversal of established human fibrosis.
- name: Increased IgG4 Secretion
  biological_scale: MOLECULAR
  description: NET-containing patient-pDC/healthy-B-cell cultures produce increased IgG4. The experiment measures secretion and does not resolve class-switch recombination versus expansion of previously switched cells. Increased serum IgG4 is a useful but nonuniversal clinical correlate of type 1 disease.
  evidence:
  - reference: PMID:26297761
    reference_title: Plasmacytoid Dendritic Cell Activation and IFN-α Production Are Prominent Features of Murine Autoimmune Pancreatitis and Human IgG4-Related Autoimmune Pancreatitis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: More importantly, patient pDCs cultured in the presence of NETs produced greatly increased levels of IFN-α and induced control B cells to produce IgG4 (but not IgG1) as compared with control pDCs.
    explanation: Patient pDCs were studied with NETs and healthy-control B cells. This culture does not distinguish new class switching from expansion of pre-existing IgG4-secreting cells.
  - reference: url:https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
    reference_title: https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In addition, inhibition of NET formation by DNase or blockade of IFN- a–mediated signaling pathways by anti-IFNAR Ab signiﬁcantly reduced IgG4 production in a coculture system comprised of control B cells, patient-derived neutrophils, and patient-derived pDCs (Fig. 7C).
    explanation: DNase and IFNAR blockade reduced IgG4 secretion in a defined human coculture; intervening signals remain unresolved.
- name: Plasmablast Expansion
  biological_scale: CELLULAR
  description: Circulating plasmablasts expand in active IgG4-related disease, including some patients with AIP and normal serum IgG4. Oligoclonality supports antigen-driven selection but does not identify the antigen or prove that plasmablasts initiate pancreatic injury.
  evidence:
  - reference: PMID:24817416
    reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4 concentrations.
    supports: SUPPORT
    directness: DIRECT

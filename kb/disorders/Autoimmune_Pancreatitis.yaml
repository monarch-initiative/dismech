    explanation: The guideline explicitly qualifies the observational cancer-risk evidence.
    directness: DIRECT
- name: Surgery for selected unresolved lesions or complications
  description: Pancreatic surgery is not routine treatment for a medically responsive inflammatory lesion. It may be considered for persistent diagnostic uncertainty about malignancy or selected refractory complications after multidisciplinary assessment; resection carries pancreatic functional consequences.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:

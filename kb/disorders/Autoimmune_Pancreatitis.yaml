- name: Diabetes management during pancreatic treatment
  description: Assess and optimize glucose control before induction and during follow-up. Glucocorticoids can improve pancreatitis-associated dysfunction in some patients while causing or worsening hyperglycemia in others; pancreatic diabetes and pre-existing metabolic diabetes require individualized management.

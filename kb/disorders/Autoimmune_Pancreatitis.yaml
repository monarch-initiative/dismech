    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: characterized by typical histopathological findings such as storiform fibrosis, obliterative
      phlebitis, and a predominantly lymphoplasmacytic infiltrate enriched with IgG4+ B cells
    explanation: An independent statement of the same triad, from a source curated elsewhere in this
      entry for the autoantigen work. Two sources rather than one because this node is being added late
      and its membership of the triad is the whole justification for it.
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
      epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: no obliterative phlebitis or granulomas were identified, storiform fibrosis was seen in
      only one patient, and IgG4-positive plasma cells were sparse (< 1 cell per HPF), clearly
      distinguishing ICI-P from IgG4-related disease
    explanation: The type 3 discriminator, and the citation this node's description needed. It reports
      the absence of all three triad elements in checkpoint-inhibitor pancreatitis, which is what makes
      the absence informative rather than merely unmeasured, and it is the source's own basis for
      separating the two entities.
- name: Tumefactive Pancreatic Mass
  role: consequence
  biological_scale: TISSUE
  description: 'The shared endpoint of both mechanisms and the reason this is one clinical entity. Both
    the plasma-cell and fibrotic lesion and the neutrophilic duct lesion expand the gland into a mass
    that is radiologically indistinguishable from pancreatic adenocarcinoma. The single most
    consequential fact about this disease is that it is a steroid-responsive mimic of a cancer that is
    treated by resection.'
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Obstructive jaundice
    causal_link_type: DIRECT
    description: A mass in the pancreatic head compresses the distal common bile duct.
  - target: Recurrent acute pancreatitis
    causal_link_type: DIRECT
    description: Duct-centric inflammation and stricturing obstruct pancreatic outflow.
  - target: Abdominal pain
    causal_link_type: DIRECT
    description: Pain from the inflamed and expanded gland, the presenting symptom in about half of type

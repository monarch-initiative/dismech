- name: Long-term pancreatic and systemic follow-up
  description: Follow type 1 disease for pancreatic or extrapancreatic relapse, exocrine and endocrine dysfunction, nutrition, bone health and treatment toxicity. Lifelong follow-up is advised by the European guideline, with frequency individualized to disease and treatment. Conflicting cancer-risk cohorts do not establish a proven AIP-specific cancer-imaging interval.
  therapeutic_modality: OTHER
  action_category: MONITORING
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Life-long follow-up of patients with AIP type 1 is advisable. (GRADE 2C; strong agreement)
    explanation: GRADE 2C lifelong follow-up recommendation.
    directness: DIRECT

- species: Mouse
  genotype: Neonatal male BALB/c recipients of human immunoglobulin
  description: Passive transfer of patient IgG caused pancreatic and salivary injury. Both IgG1 and IgG4 fractions caused injury, with greater destruction from IgG1; simultaneous IgG4 reduced IgG1-associated injury. This published experiment replaces the former proposal that subclass-resolved testing had not been done. The accessible abstract does not establish a universal human mechanism, identify every antigen, or show that selective IgG4 removal would be beneficial.
  evidence:
  - reference: PMID:26964842
    reference_title: Pathogenicity of IgG in patients with IgG4-related disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: 'RESULTS: Subcutaneous injection of patient IgG, but not control IgG, resulted in pancreatic and salivary gland injuries. Pancreatic injury was also induced by injecting patient IgG1 or IgG4, with more destructive changes induced by IgG1 than by IgG4. The potent pathogenic activity of patient IgG1 was significantly inhibited by simultaneous injection of patient IgG4.'
    explanation: Human IgG passive transfer into neonatal mice; abstract-supported scope.

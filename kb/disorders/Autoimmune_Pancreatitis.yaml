    snippet: The same study also described three cases of patients with active IBD and recurrent AIP treated with anti-TNF therapy. Two patients were treated with adalimumab and one with infliximab. Pancreatic symptoms were controlled by induction treatment with anti-TNF therapy only, and no maintenance treatment was required.
    explanation: Three cases with active IBD, in addition to an isolated case discussed in the source.

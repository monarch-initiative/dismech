- name: Extrapancreatic Fibroinflammation
  biological_scale: TISSUE
  description: Type 1 AIP may coexist with IgG4-related inflammatory lesions in bile ducts, salivary glands and other organs. These are manifestations of the systemic disorder, rather than obligatory downstream effects of pancreatic injury.
  evidence:
  - reference: PMID:26672716
    reference_title: 'IgG4-related disease: The utility of (18)F-FDG PET/CT in diagnosis and treatment.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: The organs most frequently involved are the pancreas (autoimmune pancreatitis (AIP), salivary and lacrimal glands (Mickulicz disease and sclerosing sialadenitis), biliary tree (sclerosing cholangitis or cholecystitis), retroperitoneum (retroperitoneal fibrosis), aorta (periaortic fibrosis), kidneys (interstitial nephritis) and thyroid (Riedel thyroiditis).
    explanation: Type 1 AIP participates in systemic IgG4-related organ inflammation.
  downstream:

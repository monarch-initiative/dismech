      quote_role: PRIMARY_RESULT
      snippet: The steep decline in plasmablast counts after anti-CD20 treatment likely stems from the depletion of CD20+ precursors.
      explanation: Mechanistic interpretation of an uncontrolled treatment association.
- name: Inebilizumab for adult IgG4-related disease
  description: The anti-CD19 antibody is approved in the United States for adult IgG4-related disease. In MITIGATE, 135 adults with active disease and a history of at least two involved organs received inebilizumab or placebo with the same eight-week glucocorticoid taper. Treated adjudicated flares occurred in 7/68 versus 40/67 over 52 weeks (hazard ratio 0.13, 95% CI 0.06–0.28). The trial was not a comparison with rituximab, did not establish pancreas-only efficacy, and does not apply to type 2 or checkpoint-inhibitor pancreatic injury. Serious adverse events occurred in 12 versus six participants and serious or opportunistic infections in six versus two. Screen for hepatitis B and tuberculosis, review vaccinations and immunoglobulins, and monitor infections and hypogammaglobulinemia according to the label.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  evidence:
  - reference: PMID:39541094
    reference_title: Inebilizumab for Treatment of IgG4-Related Disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Treatment with inebilizumab reduced flare risk; 7 participants (10%) in the inebilizumab group had at least one flare, as compared with 40 participants (60%) in the placebo group (hazard ratio, 0.13; 95% confidence interval [CI], 0.06 to 0.28; P<0.001).
    explanation: Primary randomized result.
  - reference: url:https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Journal_Club/2025/08_14.05.2025_N_Engl_J_Med_Stone_2025_Inebilizumab_for_Treatment_of_IgG4-Related_Disease_1168-77.pdf
    reference_title: https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Journal_Club/2025/08_14.05.2025_N_Engl_J_Med_Stone_2025_Inebilizumab_for_Treatment_of_IgG4-Related_Disease_1168-77.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Serious adverse events occurred during the treatment pe- riod in 12 of the participants (18%) who received inebilizumab and 6 of the par - ticipants (9%) who received placebo.
    explanation: Primary 52-week safety results.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761142s004lbl.pdf
    reference_title: https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761142s004lbl.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 12 CLINICAL PHARMACOLOGY 12.1 Mechanism of Action The mechanism by which inebilizumab-cdon exerts its therapeutic effects in NMOSD, IgG4-RD, and gMG is presumed to involve binding to CD19, a cell surface antigen presents on pre-B and mature B lymphocytes. Following cell surface binding to B lymphocytes, inebilizumab-cdon results in antibody-dependent cellular cytolysis.
    explanation: Regulatory pharmacology describes CD19 binding and cytolysis.
  - reference: url:https://www.accessdata.fda.gov/drugsatfda_docs/label/2025/761142s004lbl.pdf

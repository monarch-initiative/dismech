environmental:
- name: Occupational history involving industrial dusts, vapors, gases and fumes
  description: Blue-collar work and job-exposure-matrix estimates were associated with IgG4-related cholangitis and/or type 1 AIP in a Dutch hospital-based case-control study. The exposure classification was derived from recalled work history rather than measured personal toxin concentrations. It does not establish a specific occupational cause of AIP.
  notes: The 101 cases were compared with 303 age-, sex- and hospital-matched digestive-disease controls. Selection, recall, correlated exposures and residual confounding limit causal interpretation. Composite matrix estimates cannot be assigned specifically to asbestos. No antigenic or cellular mediator, prevention effect or type 2 association was measured; no mechanistic target is inferred.
  evidence:
  - reference: PMID:34816110
    reference_title: Blue-collar work is a risk factor for developing IgG4-related disease of the biliary tract and pancreas.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Of cases with IgG4-RD, 68% (n = 69) ever performed a blue-collar job, compared to 39% of controls (n = 117, Fig. 2), corresponding to an OR of 3.66 (95% CI 2.18–6.13).
    explanation: Occupational-history association in 101 combined biliary/pancreatic IgG4-RD cases and 303 matched tertiary disease controls, not a pancreas-only or type 2 analysis.
treatments:
- name: Glucocorticoid induction for active type 1 disease
  description: Glucocorticoids are first-line induction for symptomatic active type 1 AIP and selected patients with persistent mass, cholestasis or threatened organ function. Assess clinical, biochemical and imaging response after two to four weeks and taper individually. Glucose control, infection risk and bone health require attention. Treating every asymptomatic patient solely to prevent later pancreatic insufficiency is not supported; nonresponse requires reassessment of the diagnosis.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There is no relevant data to support that a treatment should be proposed in patients with AIP without symptoms, just to limit the risk of exo- crine or endocrine insufﬁciencies. (GRADE 1C)
    explanation: GRADE 1C explicitly limits preventive treatment claims in asymptomatic disease.
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Treatment with glucocorticoids should be initiated in a weight-based manner at a dose of 0.6–0.8 mg/kg body weight/day orally (typical starting dose 30–40 mg/day prednisone equivalent) for 1 month to induce remission. Response to initial treat- ment should be assessed at week 2–4 with clinical, bio- chemical, and morphological markers. Glucocorticoid therapy should gradually be tapered by 5 mg every two weeks (tapering duration 3–6 months). (GRADE 1C)  # codespell:ignore ment
    explanation: GRADE 1C adult induction and response-monitoring recommendation; the statement specifies a three-to-six-month taper in the main body.
    directness: DIRECT

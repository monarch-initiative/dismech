- name: H69 cholangiocyte autoantigen perturbation
  experimental_model_type: CELL_LINE
  cell_source: Human H69 cholangiocytes with gene knockdown, inhibitors, recombinant proteins or donor immunoglobulin
  publication: PMID:38332916
  description: Parallel galectin-3 and prohibitin perturbations measured intracellular pH, bile-acid permeation and apoptosis. Results were discordant across interventions and did not establish a consistent protective autoantigen mechanism. The final IgG comparison used one IgG4-related cholangitis donor and one healthy donor and did not increase bile-acid uptake. This is a biliary epithelial experiment, not a pancreatic model or a germline variant assay.  # codespell:ignore prohibitin
  evidence:
  - reference: PMID:38332916
    reference_title: Galectin-3 and prohibitin 1 are autoantigens in IgG4-related cholangitis without clear-cut protective effects against toxic bile acids.  # codespell:ignore prohibitin
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: These parallel approaches did not demonstrate clear-cut protective effects in three assays that touch on the functionality of the biliary bicarbonate umbrella (23, 24), including intracellular pH measurements, toxic bile acid permeation studies, and experiments determining GCDC-induced cholangiocyte apoptosis.
    explanation: The paper limits its own functional interpretation.
  - reference: PMID:38332916
    reference_title: Galectin-3 and prohibitin 1 are autoantigens in IgG4-related cholangitis without clear-cut protective effects against toxic bile acids.  # codespell:ignore prohibitin
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: In line with these findings, pretreatment with IgGs isolated from an IRC patient with anti-galectin-3 and anti-prohibitin 1 autoantibodies did not lead to increased GCDC permeation into cholangiocytes.  # codespell:ignore prohibitin
    explanation: One patient-donor antibody preparation did not increase toxic bile-acid entry.
review_notes: The review consumed every baseline reference at the fullest retrievable level, all available full scientific bodies and relevant deep-research leads. The 2016 survey cache had an incorrectly attached 2021 full paper and was regenerated through the sanctioned fetcher as the correct 2016 abstract; the 2021 paper is cited separately. Experimental evidence now distinguishes preventive murine interventions, patient-cell culture and human observations. Remaining primary abstracts, including the passive-transfer and 2023 SLAMF7 mouse reports, are not represented as full-methods audits. The decade-long cohort contains a diabetes numerator discrepancy and uses albumin as a nonspecific nutritional marker; neither is converted into a precise functional mechanism. The exocrine-insufficiency cohort has changing assessed denominators and an inconsistent summary-table cohort size. The 2021 survey organ counts use 2,819 assessed patients, and its maintenance proportion is among initial steroid recipients. Detailed evidence limitations are retained at the affected claims. The FCRL3 primary report is PMID16905709, not the later CTLA4 paper that cites it. CACNA1S and SMAD7 remain among the
  exploratory candidates named in the sequence-panel evidence, without inferred functional mechanisms or a claim that the genetic list exhausts that panel. Fibrotic-module conformance is not asserted because the current evidence measures T-cell TGF-beta1 secretion and a histological fibrotic pattern but does not establish the complete myofibroblast activation and matrix-turnover chain required by that module. Composite diagnostic strategies are not narrowed to a single imaging or laboratory procedure; the discrete histological assessment is specifically bound.

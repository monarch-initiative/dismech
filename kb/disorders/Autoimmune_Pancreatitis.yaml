    reference_title: https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2020/Hereditary-autoimmune_pancreatitis/BC_2020-02-12_RW_International_consensus_paper_on__treatment_of_autoimmune_pancreatitis_2017.pdf

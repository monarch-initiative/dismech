    explanation: Selected surgical series illustrate the cancer-mimic problem, not a general misdiagnosis rate.
- name: Pancreatic enzyme replacement for exocrine insufficiency
  description: Use pancreatic enzyme replacement when exocrine insufficiency is established, with administration during meals and adjustment to meal content, symptoms and nutritional response. This supplements digestion and does not treat the pancreatic immune lesion. The AGA advice is general EPI guidance, not an AIP-specific randomized efficacy estimate. A response to empiric enzymes alone is not a reliable diagnostic test.
  therapeutic_modality: PROTEIN_REPLACEMENT
  evidence:
  - reference: PMID:37737818
    reference_title: 'AGA Clinical Practice Update on the Epidemiology, Evaluation, and Management of Exocrine Pancreatic Insufficiency: Expert Review.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'BEST PRACTICE ADVICE 10: Once EPI is diagnosed, treatment with pancreatic enzyme replacement therapy (PERT) is required. If EPI is left untreated, it will result in complications related to fat malabsorption and malnutrition, having a negative impact on quality of life.'
    explanation: Expert best-practice advice for established EPI.
  - reference: url:https://bspghan.org.uk/wp-content/uploads/2023/11/aga-practice-guideline-exocrine-pancreatic-insufficiency.pdf
    reference_title: https://bspghan.org.uk/wp-content/uploads/2023/11/aga-practice-guideline-exocrine-pancreatic-insufficiency.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: PERT treats the meal, not the pancreas. Thus, it must be taken during the meal to maximize mixing and digestion of nutrients.72,73 Humans have other mechanisms for protein and carbohydrate digestion, but not fats, 1 so the focus of PERT is on lipase dose and meal fat content.
    explanation: The full guideline explains replacement at the digestive level.

- name: Serum IgG4
  presence: Often increased in type 1; may be normal
  context: An adjunct to integrated diagnosis. Elevated values occur in other conditions, and type 2 generally has normal or mildly elevated IgG4. The 43% sensitivity reported in a surgical meta-analysis came from 21/49 tested resected type 1 cases and must not be used as general diagnostic sensitivity.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In contrast to type 1 AIP, which is a pancreatic manifestation of IgG4-related disease, serum IgG4 concentrations are normal or only mildly elevated in type 2 AIP.5 Serum IgG4 elevations >300 mg/dL (or >2-fold higher than the normal range) are highly suggestive of type 1 AIP.6-8 Since the ratio of serum IgG4/IgG is typical >10% in type 1 AIP and ≤10% in other conditions, this calculation is useful for cases with only a mild IgG4 elevation.9 Although specific serological markers are not currently available for type 2 AIP, anti-neutrophil cytoplasmic antibodies can be detected in patients with type 2 AIP.10 The assessment of extrapancreatic diseases is useful for the typing of AIP.
    explanation: Subtype-specific serological distinction.
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The sensitivity of IgG4 levels in type 1 AIP was low (43%, 21/49 patients).
    explanation: Highly selected resected cohort with incomplete testing.
- name: Candidate autoantibodies against galectin-3 and prohibitin 1  # codespell:ignore prohibitin
  presence: Detected in subsets of IgG4-related cholangitis
  context: In a 52-person IgG4-related cholangitis cohort, antibodies to galectin-3 and prohibitin 1 were also seen in some comparator groups. This is not a germline genetic finding or an AIP-specific diagnostic assay. Cholangiocyte perturbation and antibody experiments did not establish a consistent bile-acid-injury mechanism.  # codespell:ignore prohibitin
  evidence:
  - reference: PMID:38332916

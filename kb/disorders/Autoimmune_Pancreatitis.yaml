  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Patient or control blood pDCs and neutrophils combined with healthy-control B cells
  publication: url:https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf
  description: Defined cultures compare patient and control cell sources and use induced NET-containing preparations. Patient pDCs promote IFN-alpha and IgG4 output; DNase and IFNAR blockade reduce output. The human study enrolled 20 patients, but tissue, serum and culture subsets differ. Tissue controls included tumor-free cancer-resection sections. The experiments do not prove that MSU or patient anti-lactoferrin IgG4 initiates disease, and no BAFF-neutralization experiment isolates that mediator.

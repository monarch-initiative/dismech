    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Screening for a deﬁciency of fat- soluble vitamins (A, D, E, and K), zinc, calcium, and magnesium should be considered in line with UEG evidence-based guidelines for the diagnosis and therapy of chronic pancreatitis (HaPanEU). 54 (GRADE 2A; strong agreement)

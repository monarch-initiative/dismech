    snippet: In addition, such depletion of pDCs prevented AIP development as assessed by pathological analysis (Fig. 2B) and reductions in the numbers of inﬁltrating T cells, B cells, and CD11b + macrophages in the pancreas (Fig. 2C).
    explanation: Preventive pDC depletion reduced experimental pancreatic inflammatory pathology.
  - reference: url:https://www.med.kindai.ac.jp/life/files/h27/kudou/018.pdf

      explanation: General EPI dietary assessment explicitly includes unintentional weight loss and caloric needs.
diagnosis:
- name: Comprehensive type 1 AIP assessment and exclusion of malignancy
  description: Assess pancreatic morphology, histology, serum IgG4, other-organ involvement and carefully interpreted treatment response together. Neither serum IgG4 nor CA19-9 alone establishes AIP or excludes pancreatic cancer. A focal mass requires an appropriate malignancy work-up; steroid response is one contextual criterion, not independent proof of benign disease. This guideline addresses type 1 AIP unless stated otherwise.
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: For these guidelines, AIP is referring to AIP type 1, i.e. IgG4-related autoimmune pancreatitis, unless speciﬁed otherwise.
    explanation: Defines the type 1 scope of this guideline.
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: IgG4 serum level alone lacks sensitivity and speciﬁcity, but can be helpful to estab- lish the diagnosis, and therefore should be measured if IgG4-related gastrointestinal disease is suspected. (GRADE 2C; strong agreement)
    explanation: 'GRADE 2C recommendation: IgG4 is an adjunct, not a stand-alone diagnostic test.'
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: There are no speciﬁc clinical features or blood tests that can differentiate between IgG4-related disease and cancer. (GRADE 2B; strong agreement)
    explanation: Clinical or laboratory findings alone cannot distinguish IgG4 disease from cancer; interpret within the full work-up.
    directness: DIRECT
  - reference: PMID:32552502
    reference_title: European Guideline on IgG4-related digestive disease - UEG and SGF evidence-based recommendations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: IgG4-related digestive disease can be diagnosed only with a comprehensive work-up that includes histology, organ morphology at imaging, serology, search for other organ involvement, and response to glucocorticoid treatment.
    explanation: Canonical identity of the European guideline; full guideline details are cited above.
- name: Pancreatic imaging and endoscopic tissue acquisition
  description: CT or MRI can identify diffuse or focal enlargement, a peripancreatic rim and duct narrowing, but imaging may overlap with malignancy. EUS supplies detailed imaging and tissue acquisition. Core histology helps assess architectural features and distinguish focal AIP from cancer; sampling error limits a negative biopsy, and IgG4-positive cells alone are insufficient. The pediatric exception to routine pretreatment biopsy is not generalized to adult masses.
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The classical imaging features of AIP are paren- chymal enlargement, ‘sausage-like’ shape, peripancre- atic edematous rim, and main pancreatic duct narrowing without upstream dilatation. These features may be diffuse or focal but can also be highly variable. (GRADE 2C; strong agreement)
    explanation: GRADE 2C describes suggestive, variable imaging features.
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Endoscopic ultrasound (EUS) provides pancreatic imaging ﬁndings suggestive of AIP and is used for obtaining tissue samples for the histo- logical diagnosis of the disease. (GRADE 2B; strong agreement)
    explanation: GRADE 2B supports EUS for imaging and histological sampling.
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: In biopsy specimens, distinguishing IgG4-related disease and cancer is more challenging. Risk of sampling error should be considered in a neg- ative biopsy. Non-speciﬁc inﬂammation, with increased IgG4-positive cells can occur in both cancer and IgG4- related disease. (GRADE 2C; strong agreement)  # codespell:ignore ative
    explanation: Sampling error and nonspecific IgG4 infiltration limit biopsy interpretation.
    directness: DIRECT
- name: Histological subtype assessment
  diagnosis_term:
    preferred_term: Histopathologic Examination
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  description: Assess the distribution of inflammation, storiform fibrosis, obliterative phlebitis and IgG4-positive plasma cells for type 1. For type 2, assess granulocytic epithelial lesions, with scant IgG4-positive cells and the clinical IBD context. Peritumoral or ordinary acute pancreatitis can also contain neutrophils, so a few cells do not independently establish type 2. Some IBD-associated cases meet probable criteria without diagnostic histology; this does not apply to every patient with a steroid-responsive mass.
  evidence:
  - reference: PMID:29512140
    reference_title: Autoimmune Pancreatitis Mouse Model.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Type 1 AIP (also called LPSP) is characterized by dense lymphoplasmacytic infiltration, storiform fibrosis, and obliterative phlebitis. This is accompanied by massive accumulation of IgG4-expressing plasma cells and, in some patients with elevated levels of serum IgG4 and involvement of other organs, including bile ducts, salivary glands, and kidney.
    explanation: Clinical pathological synthesis of type 1 AIP.
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: In contrast to type 1 AIP, the diagnosis of which may be established without biopsy, type 2 AIP generally requires the tissue confirmation of neutrophilic infiltration into the ducts or acini.15 Without histology, type 2 AIP cannot be diagnosed in patients without history of IBD, even if they show typical imaging features and good response to corticosteroids.
    explanation: Histology and IBD jointly determine the diagnostic pathway.
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Another caveat is that neutrophilic infiltration in the duct epithelium or lobules can be focally detected in peritumoral pancreatitis.
    explanation: Nonspecific or peritumoral neutrophils limit interpretation.
- name: CA19-9 and serum IgG4 as adjuncts
  description: Neither marker independently distinguishes AIP from pancreatic ductal adenocarcinoma. Interpret CA19-9 with cholestasis, imaging and tissue findings; use IgG4 as one component of the diagnostic framework. A meta-analysis of resected suspected cancers found IgG4 positivity in 21/49 tested type 1 cases, a highly selected subgroup rather than a general sensitivity estimate.
  evidence:
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The sensitivity of IgG4 levels in type 1 AIP was low (43%, 21/49 patients).
    explanation: The denominator is tested, resected cases.
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'Statement 8.2.1: There are no speciﬁc clinical features or blood tests that can differentiate between IgG4-related disease and cancer.'
    explanation: Guideline emphasizes overlap with cancer.
- name: Contextual assessment of glucocorticoid response
  description: An appropriately supervised response assessment may contribute to a composite diagnosis after a malignancy work-up. Improvement is not independent proof that a lesion is benign; steroid treatment can obscure histology and some peritumoral inflammation also responds. Persistent or recurrent nonresponse warrants diagnostic reassessment.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: However, a steroid trial needs to be considered with caution because various conditions, including peritumoral pancreatitis, potentially respond to immunosuppression. Pancreatic biopsy needs to be considered before a steroid trial, which veils pathognomonic histological changes.
    explanation: Response has diagnostic limitations.
- name: Pancreatic exocrine and endocrine function assessment
  description: Assess glucose control and symptoms or laboratory evidence of exocrine insufficiency at diagnosis and follow-up. Fecal elastase is a practical initial exocrine test, interpreted with stool consistency and the clinical context. These functional tests assess complications and do not distinguish AIP from cancer.
  evidence:
  - reference: PMID:37737818
    reference_title: 'AGA Clinical Practice Update on the Epidemiology, Evaluation, and Management of Exocrine Pancreatic Insufficiency: Expert Review.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'BEST PRACTICE ADVICE 4: Fecal elastase test is the most appropriate initial test and must be performed on a semi-solid or solid stool specimen.'
    explanation: General PEI expert advice, applicable to established pancreatic dysfunction rather than an AIP-specific diagnostic validation.
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Life-long follow-up of patients with AIP type 1 is advisable. (GRADE 2C; strong agreement)
    explanation: GRADE 2C lifelong follow-up recommendation.
    directness: DIRECT
animal_models:
- species: Mouse
  genotype: MRL/Mp with induced autoimmune pancreatitis
  description: The induced model develops pancreatic infiltrates, acinar architectural damage and fibrosis. Depletion of pDCs or IFNAR blockade before induction exposures reduces inflammatory pathology. A later study reported increased SLAMF7-positive CD8 cells and dexamethasone-associated improvement; these are mouse CD8 cells, not the human CD4 population. The model does not reproduce endogenous human IgG4 production, and reported fibrosis is not necessarily the diagnostic storiform pattern.
  evidence:
  - reference: PMID:29512140
    reference_title: Autoimmune Pancreatitis Mouse Model.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: Although mice lack the IgG4 Ab subtype, autoimmune-prone MRL/Mp mice treated with repeated injection with polyinosinic-polycytidylic acid (poly (I:C)) provide an experimental model of AIP. These mice exhibit massive destruction of pancreatic architecture associated with pancreatic immune cell infiltration and fibrosis.
    explanation: Protocol synthesis describes the model and the absent mouse IgG4 subclass.

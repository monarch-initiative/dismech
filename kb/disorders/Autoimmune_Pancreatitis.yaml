- name: Circulating plasmablasts
  presence: Increased
  context: Research biomarker measured in 37 selected active untreated systemic IgG4-RD cases, including eight with pancreatic involvement, versus 14 healthy and 21 disease controls. Thirteen of 36 with available serum IgG4 had normal values. These data do not validate a pancreatic-cancer differential test or a universal relapse predictor.
  biomarker_term:
    preferred_term: plasmablast
    term:
      id: CL:0000980
      label: plasmablast
  readouts:
  - target: Plasmablast Expansion
    relationship: READOUT_OF
    direction: POSITIVE
    interpretation: Circulating cell counts directly measure the expanded plasmablast compartment; they do not establish pancreatic trafficking or clinical diagnostic specificity.
    evidence:
    - reference: PMID:24817416
      reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4 concentrations.

- name: Rituximab for relapsing or treatment-intolerant type 1 disease
  description: CD20-directed B-cell depletion is an option for resistant, relapsing or glucocorticoid-intolerant type 1 disease, or after failure of other immunosuppression. Most AIP-specific response estimates are from uncontrolled series. CD20-negative plasmablasts are not directly targeted; their decline is consistent with depletion of precursors. This is not a proven selective CTL therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Rituximab should be considered if patients are resistant or intol- erant to high-dose glucocorticoids to maintain remis- sion or have failed to respond to immunosuppressive therapies. Dosing protocol (375 mg/m 2 body surface area) is used weekly for 4 weeks, followed by infusions every 2–3 months or at two 1000 mg infusions 15 days apart every 6 months. (GRADE 2A)
    explanation: GRADE 2A conditional rituximab recommendation, distinct from a randomized type 1 AIP-specific efficacy estimate.
    directness: DIRECT
  - reference: PMID:24817416
    reference_title: Plasmablasts as a biomarker for IgG4-related disease, independent of serum IgG4 concentrations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: plasmablasts lack surface expression ofCD20 and are therefore resistant to direct depletion by anti-CD20 treatment approaches
    explanation: The authors distinguish mature B-cell depletion from indirect plasmablast effects.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

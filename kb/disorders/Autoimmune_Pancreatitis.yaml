name: Autoimmune Pancreatitis
creation_date: '2026-09-06T08:15:00Z'
category: Complex
disease_term:
  preferred_term: autoimmune pancreatitis
  term:
    id: MONDO:0015175
    label: autoimmune pancreatitis
synonyms:
- AIP
- sclerosing pancreatitis
- nonalcoholic destructive pancreatitis
- lymphoplasmacytic sclerosing pancreatitis
description: 'Steroid-responsive fibroinflammatory disease of the pancreas that forms a mass and mimics
  pancreatic cancer. It is one clinical entity holding two immunologically different diseases, and this
  entry is built around that fact rather than around it.

  Type 1 is the pancreatic manifestation of IgG4-related disease: lymphoplasmacytic sclerosing
  pancreatitis with storiform fibrosis, obliterative venulitis, dense IgG4-positive plasma cell
  infiltration, oligoclonal plasmablast expansion, and frequent involvement of bile ducts,
  retroperitoneum, kidneys and salivary glands. Type 2 is idiopathic duct-centric pancreatitis, whose
  histological hallmark is the granulocytic epithelial lesion - neutrophils inside duct lumens and
  epithelium, destroying ductal architecture. Type 2 has few or no IgG4-positive plasma cells, no
  extrapancreatic disease, and a strong association with inflammatory bowel disease.

  The two share the radiological entity, the presentation as a pancreatic mass, and a striking response
  to corticosteroids. They do not share a mechanism, and the pathology literature says so bluntly: they
  "show little morphologic or pathogenic overlap". Whether that makes this term one disease with two
  subtypes or a grouping of two diseases is a real question, and it is recorded as an open controversy
  on this entry rather than settled by assertion.

  A third form is now recognised - immune checkpoint inhibitor-induced pancreatic injury - which is
  iatrogenic rather than idiopathic and is curated here as a subtype with that difference stated.'
parents:
- Pancreatitis
- Immune-Mediated Inflammatory Disease
has_subtypes:
- name: Type 1
  display_name: Type 1 (lymphoplasmacytic sclerosing pancreatitis, IgG4-related)
  description: The pancreatic manifestation of IgG4-related disease. Elevated serum IgG4, more than ten
    IgG4-positive plasma cells per high-power field, storiform fibrosis, venulitis, and frequent
    extrapancreatic organ involvement. Typically presents as painless obstructive jaundice in older
    adults, and relapses often.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Type 1: IgG4-related pancreatitis, associated with a serum IgG4 concentration greater than
      twice the normal reference range in most affected individuals.'
    explanation: Defines the subtype by its serological criterion.
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common clinical presentation of type 1 AIP is painless jaundice with laboratory
      studies suggesting biliary obstruction and hyperglycemia.
    explanation: Gives the characteristic clinical presentation that separates type 1 from type 2 at the
      bedside.
- name: Type 2
  display_name: Type 2 (idiopathic duct-centric pancreatitis, IDCP)
  description: Idiopathic duct-centric pancreatitis. The granulocytic epithelial lesion is the
    histological hallmark, IgG4-positive plasma cells are few or absent, there is no extrapancreatic
    involvement, and the association with inflammatory bowel disease is strong. Presents more often as
    recurrent acute pancreatitis in younger patients, and relapses relatively rarely.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Type 2: Histologically, this is idiopathic duct-centric pancreatitis with granulocytic
      epithelial lesions within the pancreatic duct, small numbers of IgG4–positive plasma cells (fewer
      than 10/HPF), and no extrapancreatic involvement.'
    explanation: Defines the subtype histologically and states the three features that distinguish it
      from type 1.
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Type 2 AIP is often associated with inflammatory bowel disease and is twice as common in
      patients with ulcerative colitis or proctitis as in those with Crohn disease.
    explanation: States the IBD association and, usefully, its direction within IBD - twice as common in
      ulcerative colitis as in Crohn disease.
- name: Type 3
  display_name: Type 3 (immune checkpoint inhibitor-induced)
  description: Immune-mediated pancreatic injury as an adverse effect of checkpoint inhibitor therapy.
    It is included because the field now classifies it under this heading, but it differs from the other
    two in kind - the trigger is a known iatrogenic exposure rather than an idiopathic autoimmune
    process, and most patients are asymptomatic.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Type 3: Immune checkpoint inhibitor-induced pancreatic injury is a type of progressive
      immune-mediated pancreatitis, an adverse effect of cancer treatment with immune checkpoint
      inhibitor drugs.'
    explanation: Establishes the subtype and its iatrogenic trigger.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: Described as a rare condition without a quantified rate in the source. Type 2 is substantially
    rarer than type 1 and its natural history is described as poorly understood, so the two subtypes are
    not equally represented in any cohort.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoimmune pancreatitis (AIP), also referred to as nonalcoholic destructive pancreatitis and
      sclerosing pancreatitis, is a rare condition characterized histologically by chronic inflammation
      of the pancreas
    explanation: A qualitative rarity statement with no measure type attached, which is why the record
      uses measure_type UNKNOWN with a qualitative class rather than a numeric band.
- population: Japan, 2007 nationwide two-stage survey
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 2.2
  rate_denominator: POPULATION
  notes: 'Estimated from a nationwide questionnaire survey of selected hospitals, diagnosed by the
    Japanese clinical diagnostic criteria 2006. The survey design is a hospital-based estimate rather
    than a population enumeration, so the figure depends on how completely AIP was being recognised and
    coded in 2007.'
  evidence:
  - reference: PMID:22466167
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated total number of AIP patients in 2007 was 2790 (95% confidence interval,
      2540-3040), with an overall prevalence rate of 2.2 per 100,000 populations.
    explanation: The earliest of the four Japanese national surveys and the first numeric prevalence
      estimate this entry carries.
- population: Japan, 2007 nationwide two-stage survey
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.9
  rate_denominator: POPULATION_PER_YEAR
  notes: Newly diagnosed cases in the same 2007 survey. Recorded separately from the point-prevalence
    record above because incidence and prevalence are different measures and must not be compared.
  evidence:
  - reference: PMID:22466167
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The number of patients, who were newly diagnosed as AIP, was estimated to be 1120 (95%
      confidence interval, 1000-1240), with an annual incidence rate of 0.9 per 100,000 populations.
    explanation: Gives the incidence estimate and the case count it is derived from.
- population: Japan, 2011 nationwide two-stage survey
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.6
  rate_denominator: POPULATION
  notes: Diagnosed by the revised Japan Pancreas Society 2011 criteria, which are not the criteria used
    in the 2007 survey. The criteria change is a reason the two figures are not a clean time series.
  evidence:
  - reference: PMID:25815647
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2011.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated total number of AIP patients in 2011 was 5745 (95% confidence interval,
      5325-6164), with an overall prevalence rate of 4.6 per 100,000 population.
    explanation: The second numeric estimate, roughly double the 2007 figure four years later.
- population: Japan, 2016 nationwide two-stage survey
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 10.1
  rate_denominator: POPULATION
  notes: 'The measured prevalence rose roughly fivefold across the three surveys, from 2.2 to 4.6 to
    10.1 per 100,000 in nine years. The entry does not read that as a rising disease incidence.
    Autoimmune pancreatitis was newly described as an entity in this period, its diagnostic criteria
    were revised between surveys, and EUS-guided fine needle aspiration became routine - so recognition
    improved at the same time as the count. The rate to quote depends on which of those you think the
    numbers are measuring, and the sources do not settle it.'
  evidence:
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated number of AIP patients in 2016 was 13,436, with an overall prevalence rate of
      10.1 per 100,000 persons.
    explanation: The most recent and highest of the Japanese prevalence estimates.
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Compared to the 2011 survey, both numbers more than doubled.
    explanation: The authors state the doubling as an observation without attributing it to a cause,
      which is the basis for the ascertainment caveat recorded in this record's notes.
- population: Japan, 2016 nationwide two-stage survey
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.1
  rate_denominator: POPULATION_PER_YEAR
  notes: Newly diagnosed cases in the 2016 survey, against 0.9 per 100,000 in 2007. The same
    ascertainment caveat applies as for the paired prevalence record.
  evidence:
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The estimated number of newly diagnosed patients was 3984, with an annual incidence rate of
      3.1 per 100,000 persons.
    explanation: Gives the 2016 incidence estimate and its case count.
progression:
- phase: Relapse after corticosteroid-induced remission
  subtype: Type 1
  age_range: Adult; median age at diagnosis in the high 50s to 60s
  notes: 'Relapse is the defining long-term behaviour of type 1 disease and it accumulates rather than
    plateaus. Three independent cohorts agree on the shape and roughly on the magnitude: about a quarter
    by three years, around 40% by five to ten years, and more than half by ten to fifteen years. They
    disagree on the level, and the disagreement is informative - the Japanese national survey reports
    relapse-free survival across all steroid-treated patients, the 10-year multicenter study followed
    only 83 patients selected for having at least a decade of follow-up, and the 413-patient cohort
    required two years of follow-up. Each design excludes a different group of patients who did not
    relapse, so all three probably overstate the population risk.'
  evidence:
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune
      pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cumulative relapse rates at 1, 3, 5, 7, and 10 years were 11.0%, 26.9%, 38.3%, 50.0%, and
      56.9%.
    explanation: The most granular relapse trajectory available, from 83 corticosteroid-treated patients
      followed at least ten years.
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Kaplan-Meier analysis revealed that the relapsed survival was 14% at 3 years, 25% at 5
      years, 40% at 10 years, and 50% at 15 years.
    explanation: An independent national-survey estimate of the same trajectory, running slightly lower
      than the single-cohort figures and extending to fifteen years.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune
      pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CS discontinuation independently predicted relapse, whereas serum IgG4 normal at diagnosis
      or normalized after CS was protective.
    explanation: Identifies the two modifiable and measurable predictors, which is what makes maintenance
      steroid therapy and IgG4 monitoring standard practice rather than optional.
  - reference: PMID:41223493
    reference_title: 'Association between age groups and relapse of type 1 autoimmune pancreatitis: a
      large-scale retrospective cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Age <60 years was significantly associated with increased relapse risk (OR = 1.7; 95 % CI:
      1.1-2.7, P = 0.022) in multivariate logistic analysis.'
    explanation: A younger age at diagnosis raises relapse risk, from 413 patients with at least two
      years of follow-up. The effect is modest and the confidence interval is close to the null.
- phase: Long-term exocrine, endocrine and nutritional decline
  age_range: Years to a decade after diagnosis
  notes: 'Pancreatic functional loss is not only a late complication - much of it is already present when
    the disease is diagnosed, which argues that the fibroinflammatory injury precedes clinical
    presentation. It then continues despite treatment, and the two available series agree that
    pharmacological treatment does not clearly prevent it.'
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of
      Treatment or Time?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PEI prevalence at diagnosis was 72.7% and was 63.5% at follow-up.
    explanation: Exocrine insufficiency is present in most patients at the point of diagnosis, not
      acquired later. This is the observation that sets the phase boundary in this record.
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of
      Treatment or Time?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our results suggest that the prevalence of endocrine and exocrine insufficiency in AIP is
      high at diagnosis with an additional risk of PEI and DM during follow-up despite pharmacological
      treatment.
    explanation: States both halves of the claim - high at baseline, and still accruing under treatment.
      Note this is 59 patients from one centre, so it establishes the pattern rather than a rate.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune
      pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten-year survival was 85.5%, and CS maintenance was associated with better OS.
    explanation: Overall mortality is not the dominant problem over a decade, which is why this phase is
      framed as functional and nutritional decline rather than as a fatal course.
pathophysiology:
- name: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
  role: trigger
  biological_scale: CELLULAR
  description: 'The immune driver of type 1 disease. Several T-cell subsets are implicated - type 2
    helper T cells, regulatory T cells and T follicular helper 2 cells - alongside an oligoclonal
    expansion of plasmablasts whose dominant clones differ between patients and re-emerge as distinct
    clones at relapse. The clonality is the part that matters mechanistically: it is antigen-driven
    selection rather than a polyclonal inflammatory response, and it is what makes B-cell depletion a
    rational therapy.'
  cell_types:
  - preferred_term: plasmablast
    term:
      id: CL:0000980
      label: plasmablast
  - preferred_term: regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  - preferred_term: T follicular helper 2 cell
    term:
      id: CL:0002038
      label: T follicular helper cell
  downstream:
  - target: IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
    causal_link_type: DIRECT
    description: The expanded B-cell response supplies the plasma cell infiltrate, and the accompanying
      T-cell cytokine environment drives the fibrotic reaction.
  evidence:
  - reference: PMID:30558726
    reference_title: Tumefactive Inflammatory Diseases of the Pancreas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In type 1 disease, subsets of T lymphocytes (type 2 helper T cells, regulatory T cells, and
      T follicular helper 2 cells) are hypothesized to drive the inflammatory reaction.
    explanation: Names the implicated T-cell subsets. Note the authors' own word "hypothesized", which is
      preserved rather than firmed up - this is a proposed driver rather than a demonstrated one.
  - reference: PMID:30558726
    reference_title: Tumefactive Inflammatory Diseases of the Pancreas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The B-cell response is characterized by an oligoclonal expansion of plasmablasts, with
      dominant clones that vary among patients and distinct clones that emerge at the time of relapse.
    explanation: The clonality evidence. That relapse brings distinct clones rather than the same ones
      back is the observation making this an ongoing antigen-driven process.
  - reference: PMID:35737955
    reference_title: Recent progress on the treatment of type 1 autoimmune pancreatitis and IgG4-related
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Many immunocytes including M2 macrophages, plasmablasts, B cells, and T-cells (Th2-CD4+T,
      follicular helper T-cells, and CD4+SLAMF7+cytotoxic T-cells) play important roles in the
      pathogenesis.'
    explanation: An independent listing of the implicated populations, adding CD4+SLAMF7+ cytotoxic T
      cells and M2 macrophages to the set.
- name: IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
  role: central_effector
  biological_scale: TISSUE
  description: 'The tissue lesion of type 1 - dense lymphoplasmacytic infiltration rich in IgG4-positive
    plasma cells, cartwheel or storiform fibrosis, and obliterative venulitis. This is what produces the
    mass, and therefore the cancer mimicry that dominates the clinical problem.

    The role of IgG4 itself is the interesting uncertainty. It is the diagnostic marker of the disease
    and may not be the agent of it: other IgG subclasses have been proposed as the mediators, with IgG4
    representing a response that dampens excessive inflammation rather than causing it.'
  cell_types:
  - preferred_term: IgG4-positive plasma cell
    term:
      id: CL:0000786
      label: plasma cell
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Tumefactive Pancreatic Mass
    causal_link_type: DIRECT
    description: The fibroinflammatory infiltrate expands the gland and forms the mass lesion.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Diagnostic findings include infiltration with greater than 10 IgG4-positive plasma cells
      per high-power field (HPF), a cartwheel pattern of fibrosis, lymphocytic and plasma cell
      inflammation of venules, and a histologic description of lymphoplasmacytic sclerosing pancreatitis.'
    explanation: Names the four histological components of this node in the terms used diagnostically.
  - reference: PMID:30558726
    reference_title: Tumefactive Inflammatory Diseases of the Pancreas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Although the precise role of IgG4 in this condition remains uncertain, recent studies
      suggest that other IgG subclasses (eg, IgG1) may mediate the immune reactions, whereas IgG4
      represents a response to dampen excessive inflammation.'
    explanation: States the open question about whether the disease's defining marker is also its
      mediator. It is curated because it bears directly on how the diagnostic criterion should be read
      mechanistically.
- name: Type 2 Neutrophilic Duct-Centric Injury
  role: trigger
  biological_scale: TISSUE
  description: 'The lesion of type 2, and mechanistically a different disease from type 1. Neutrophils
    infiltrate the lumen and epithelium of small and medium pancreatic ducts, destroying ductal
    architecture - the granulocytic epithelial lesion. Duct epithelium and infiltrating T lymphocytes
    both express CXCL8 (IL-8), which is the proposed recruitment signal for the neutrophilic
    inflammation that defines this subtype.'
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: pancreatic duct epithelial cell
    term:
      id: CL:0002079
      label: pancreatic ductal cell
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Tumefactive Pancreatic Mass
    causal_link_type: DIRECT
    description: Duct-centric inflammation also produces a mass lesion, which is why type 2 is
      radiologically indistinguishable from type 1 despite the different mechanism.
  evidence:
  - reference: PMID:30558726
    reference_title: Tumefactive Inflammatory Diseases of the Pancreas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'A recent study of type 2 autoimmune pancreatitis highlights the role of CXCL8 (alias IL-8),
      with duct epithelium and infiltrating T lymphocytes expressing this chemokine; the latter may
      contribute to the distinct form of neutrophilic inflammation in this disease.'
    explanation: The proposed mechanism for the neutrophilic infiltrate, with the source's own hedging
      ("may contribute") preserved.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'the histologic hallmark of IDCP is the granulocyte epithelial lesion: intraluminal and
      intraepithelial neutrophils in medium-sized and small ducts with or without granulocytic acinar
      inflammation often associated with destruction of ductal architecture'
    explanation: Defines the lesion precisely, including its location within the duct and the consequent
      architectural destruction.
- name: Tumefactive Pancreatic Mass
  role: consequence
  biological_scale: TISSUE
  description: 'The shared endpoint of both mechanisms and the reason this is one clinical entity. Both
    the plasma-cell and fibrotic lesion and the neutrophilic duct lesion expand the gland into a mass
    that is radiologically indistinguishable from pancreatic adenocarcinoma. The single most
    consequential fact about this disease is that it is a steroid-responsive mimic of a cancer that is
    treated by resection.'
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Obstructive jaundice
    causal_link_type: DIRECT
    description: A mass in the pancreatic head compresses the distal common bile duct.
  - target: Recurrent acute pancreatitis
    causal_link_type: DIRECT
    description: Duct-centric inflammation and stricturing obstruct pancreatic outflow.
  - target: Exocrine pancreatic insufficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Sustained inflammation and fibrosis destroy acinar tissue. Most of this loss has already
      happened by the time the mass is found, so the edge describes a process that precedes diagnosis
      rather than one that follows it.
  - target: Diabetes mellitus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The same fibroinflammatory injury destroys islet tissue, on a slower trajectory than the
      acinar loss.
  evidence:
  - reference: PMID:30558726
    reference_title: Tumefactive Inflammatory Diseases of the Pancreas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoimmune pancreatitis, the prototypic tumefactive pancreatic fibroinflammatory lesion, is
      composed of two distinct diseases, type 1 autoimmune pancreatitis and the less common type 2
      autoimmune pancreatitis.
    explanation: States that the shared tumefactive lesion is the common endpoint of two distinct
      diseases, which is exactly the architecture this node represents.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Idiopathic duct-centric pancreatitis (IDCP) is a closely related but distinct disease that
      mimics AIP radiologically
    explanation: Establishes the radiological indistinguishability that makes the two converge on one
      clinical presentation.
phenotypes:
- category: Hepatobiliary
  name: Obstructive jaundice
  frequency: FREQUENT
  subtype: Type 1
  description: Painless jaundice from compression of the distal common bile duct, the most common
    presentation of type 1 disease and the usual reason the patient is investigated for cancer.
  phenotype_term:
    preferred_term: Obstructive jaundice
    term:
      id: HP:0005230
      label: Biliary tract obstruction
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common clinical presentation of type 1 AIP is painless jaundice with laboratory
      studies suggesting biliary obstruction and hyperglycemia.
    explanation: States the presentation and attributes it specifically to type 1.
- category: Gastrointestinal
  name: Recurrent acute pancreatitis
  frequency: FREQUENT
  subtype: Type 2
  description: Recurrent acute pancreatitis, the characteristic presentation of type 2 disease, in
    younger patients and often with concurrent inflammatory bowel disease. About half of type 2 patients
    present with abdominal pain or acute pancreatitis, against an unusual presentation in type 1.
  phenotype_term:
    preferred_term: Recurrent pancreatitis
    term:
      id: HP:0100027
      label: Recurrent pancreatitis
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unlike patients with type 1 AIP, about half of those with type 2 AIP present with abdominal
      pain or acute pancreatitis.
    explanation: Gives the proportion and, importantly, states it as a contrast against type 1 - which is
      what makes presentation a discriminator between the subtypes.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: manifests clinically most commonly as recurrent acute pancreatitis in young individuals with
      concurrent inflammatory bowel disease
    explanation: Independently states the presentation together with the age group and the IBD
      association.
- category: Gastrointestinal
  name: Pancreatic mass
  frequency: FREQUENT
  description: An enlarged pancreas, focal mass or duct stricture found on imaging, which is what
    triggers the cancer workup.
  phenotype_term:
    preferred_term: Tumefactive pancreatic mass
    term:
      id: HP:0001732
      label: Abnormality of the pancreas
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Other cases present with abdominal pain or are discovered in asymptomatic individuals with a
      pancreatic mass, pancreatic duct stricturing, or an enlarged pancreas.
    explanation: Names the three imaging findings. The bound HP term is deliberately broader than the
      finding, since HPO has no term for a tumefactive pancreatic mass specifically.
- category: Gastrointestinal
  name: Exocrine pancreatic insufficiency
  frequency: FREQUENT
  description: Loss of acinar secretory capacity from sustained inflammation and fibrosis. It is present
    in most patients at the point of diagnosis rather than acquired later, and it persists under
    treatment.
  phenotype_term:
    preferred_term: Exocrine pancreatic insufficiency
    term:
      id: HP:0001738
      label: Exocrine pancreatic insufficiency
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of
      Treatment or Time?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PEI prevalence at diagnosis was 72.7% and was 63.5% at follow-up.
    explanation: Quantifies the phenotype at both time points in one cohort of 59 patients with definite
      disease. The figure is a single-centre prevalence, not a pooled estimate.
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Acute pancreatitis is an unusual presentation in type 1 AIP, but it can result in exocrine
      and endocrine pancreatic insufficiency.
    explanation: A review statement that the disease causes exocrine insufficiency, independent of the
      cohort that quantifies it.
- category: Endocrine
  name: Diabetes mellitus
  frequency: FREQUENT
  description: Loss of islet function from the same fibroinflammatory injury. Curated as a separate
    phenotype from exocrine insufficiency because it is separately measured, has a different prevalence,
    and has its own reported risk factor.
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of
      Treatment or Time?'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cumulative incidence of DM was 17.9%, with a prevalence of DM at diagnosis of 32.8%.
    explanation: Separates prevalent from incident diabetes in the same cohort, which is what
      distinguishes this phenotype from exocrine insufficiency rather than bundling the two.
- category: Multisystem
  name: Extrapancreatic organ involvement
  frequency: FREQUENT
  subtype: Type 1
  description: Involvement of bile ducts, retroperitoneum, kidneys, lungs and salivary or lacrimal
    glands. It is present in type 1 and absent in type 2, and is therefore one of the discriminating
    features rather than an incidental association.
  phenotype_term:
    preferred_term: Multiorgan IgG4-related inflammatory involvement
    term:
      id: HP:0012647
      label: Abnormal inflammatory response
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The pancreas may be the only organ affected, or there may also be other organs involved with
      corresponding clinical presentations, including
    explanation: States that extrapancreatic involvement occurs in type 1. The enumeration of organs
      follows in the source as a list, which is why the quote stops where it does.
  - reference: PMID:26672716
    reference_title: 'IgG4-related disease: The utility of (18)F-FDG PET/CT in diagnosis and treatment.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The organs most frequently involved are the pancreas (autoimmune pancreatitis (AIP),
      salivary and lacrimal glands (Mickulicz disease and sclerosing sialadenitis), biliary tree
      (sclerosing cholangitis or cholecystitis), retroperitoneum (retroperitoneal fibrosis), aorta
      (periaortic fibrosis), kidneys (interstitial nephritis) and thyroid (Riedel thyroiditis).
    explanation: Names the organs, which the quote above stops short of. Included because the enumeration
      is the substance of the phenotype - the specific organ set is what makes extrapancreatic
      involvement a discriminating feature rather than a generic systemic statement.
genetic:
- name: CTLA4
  gene_term:
    preferred_term: CTLA4
    term:
      id: hgnc:2505
      label: CTLA4
  relationship_type: SUSCEPTIBILITY
  subtype: Type 1
  association: Promoter, exon 1 and 3' untranslated region polymorphisms associated with disease
    susceptibility and, separately, with relapse risk in Japanese patients.
  frequency: Not a Mendelian determinant; a common-variant risk allele carried by 64% of patients and
    42% of controls in the study that reported it.
  notes: 'The genetics of autoimmune pancreatitis is susceptibility genetics, not causal genetics, and
    the entry types it that way deliberately. No gene has been shown to cause the disease. CTLA4 is
    included because it is mechanistically coherent - CTLA4 is the inhibitory checkpoint that restrains
    T-cell activation, the same axis whose pharmacological blockade produces the type 3 subtype recorded
    in has_subtypes - and because the reported association separates susceptibility from relapse, which
    matters clinically.

    Three limits on how far this should be read. The study is 59 patients against 102 controls in one
    Japanese population, which is small for a common-variant association and not necessarily portable.
    The relapse associations rest on a subset of those 59 and their odds ratios (5.45 and 12.66) are
    large with wide implied uncertainty, which is the signature of a small stratum rather than a large
    effect. And no replication cohort is cited.

    A separate high-throughput study of 27 type 1 patients against 30 healthy donors nominated eleven
    further candidate genes, of which P2RX3 and TOP1 survived Bonferroni correction. Those are not
    curated as genetic entries here: a 27-versus-30 candidate-panel study without replication nominates
    hypotheses rather than establishing associations, and the HGNC identifiers could not be resolved by
    the term tooling available in this repository. The finding is recorded in this note so that it is
    not lost, and so that a future curator does not have to rediscover why it was left out.

    The HLA DRB1*0405-DQB1*0401 haplotype and Fc receptor-like 3 polymorphisms are described in the
    same source as previously associated with the disease. They are not curated as separate entries
    because the source states the association as background rather than reporting it.'
  evidence:
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our findings suggest that AIP is associated with a genetic polymorphism in CTLA4 and is
      positively correlated with serum sCTLA4 levels.
    explanation: The association claim in the authors' own hedged wording. It is a case-control genotype
      association in 59 patients and 102 healthy subjects, which is why relationship_type is
      SUSCEPTIBILITY rather than CAUSATIVE or RISK_FACTOR.
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The +49A/A and +6230A/A genotypes were associated with an enhanced risk of relapse (OR 5.45,
      P= 0.038 and OR 12.66, P= 0.022).
    explanation: The relapse association, which is a different claim from the susceptibility association
      and rests on a smaller stratum of the same cohort. Quoted with its odds ratios so a reader can see
      how imprecise they are.
  - reference: PMID:18341485
    reference_title: Association of autoimmune pancreatitis with cytotoxic T-lymphocyte antigen 4 gene
      polymorphisms in Japanese patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the HLA DRB1*0405-DQB1*0401 haplotype and Fc receptor-like 3 polymorphisms have
      been associated with AIP, the role of other genetic factors is largely unknown.
    explanation: Establishes that the genetic architecture is a set of HLA and immune-regulatory
      susceptibility loci rather than a causal gene, and states in the source's own words how little is
      settled. This is background reported by the authors, not a result they measured.
  - reference: PMID:28955865
    reference_title: A high-throughput sequence analysis of Japanese patients revealed 11 candidate genes
      associated with type 1 autoimmune pancreatitis susceptibility.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 27 type 1 AIP patients and 30 healthy blood donors were recruited, and DNA
      samples were isolated from their mononuclear cells.
    explanation: Cited for its sample size rather than its findings. It is the reason the eleven
      candidate genes it nominated are described in this entry's notes instead of being curated as
      genetic entries, so the quote that carries the claim is the methods sentence, not a result.
treatments:
- name: Corticosteroid Induction Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: 'Oral corticosteroids, typically four weeks followed by a taper, are the initial treatment
    of both type 1 and type 2. The response is the defining therapeutic fact about this disease and is
    also diagnostic in practice, since a steroid-responsive pancreatic mass is very unlikely to be
    adenocarcinoma.

    Note that it works in both subtypes despite the two having different mechanisms. That is not a
    paradox - corticosteroids suppress both lymphoplasmacytic and neutrophilic inflammation - but it does
    mean treatment response cannot be used as evidence that the two share a pathogenesis.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    description: Broad suppression of the lymphoplasmacytic inflammatory response driving type 1.
  - target: Type 2 Neutrophilic Duct-Centric Injury
    description: Suppression of the neutrophilic duct-centric inflammation of type 2, by a different
      route to the same clinical effect.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial treatment of both AIP and IDCP is with oral corticosteroids for duration of 4 weeks
      followed by a gradual taper.
    explanation: States the regimen and, critically for this entry, that it is the same for both
      subtypes.
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Autoimmune pancreatic disease is the only pancreatic condition treated effectively with
      corticosteroids.
    explanation: States the specificity of the steroid response among pancreatic diseases, which is what
      makes it diagnostically useful as well as therapeutic.
  - reference: PMID:31872350
    reference_title: Nationwide epidemiological survey of autoimmune pancreatitis in Japan in 2016.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eighty-four % patients received the initial steroid therapy, and 85% received maintenance
      steroid therapy.
    explanation: Real-world uptake in 1474 patients, which establishes that corticosteroids are the
      actual standard of care and not only the recommended one. Also records that maintenance therapy is
      as routine as induction, which the regimen description above does not convey.
  - reference: PMID:42185503
    reference_title: 'A decade of clinical course and prognostic determinants in type 1 autoimmune
      pancreatitis: insights from a 10-year longitudinal multicenter retrospective study.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: Ten-year survival was 85.5%, and CS maintenance was associated with better OS.
    explanation: Bears on the value of continued treatment rather than on the induction response this
      treatment entry is about, and it is an association in a retrospective cohort where the patients who
      stayed on steroids may differ systematically from those who stopped. Graded INDIRECT for that
      reason.
- name: Rituximab for Relapsing Disease
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: 'B-cell depletion for relapsing type 1 disease. It is mechanistically the most targeted
    therapy available here, because it removes the compartment whose oligoclonal expansion characterises
    the disease, and it is used precisely where the disease behaviour - relapse - reflects that ongoing
    B-cell response.

    Relapse is largely a type 1 problem. It is common in type 1 and relatively uncommon in type 2, which
    is why this treatment belongs to one subtype rather than to the entry as a whole.'
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    description: Depletes the B-cell compartment that supplies the oligoclonal plasmablast expansion
      driving type 1 disease.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: For patients with relapsing AIP, treatment with immunomodulators and more recently rituximab
      has been recommended.
    explanation: States the indication. It is a recommendation rather than a trial result, which is the
      level at which this record makes its claim.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapses are common in AIP and relatively uncommon in IDCP, a relatively rare disease for
      which the natural history is not well understood.
    explanation: Establishes that relapse is a type 1 problem, which is the reason this treatment is
      subtype-specific. The same sentence records that type 2's natural history is poorly understood.
  - reference: PMID:35737955
    reference_title: Recent progress on the treatment of type 1 autoimmune pancreatitis and IgG4-related
      disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Conventional induction and maintenance therapies with glucocorticoid or rituximab are
      recommended in all symptomatic patients with active IgG4-RD.
    explanation: An independent recommendation of the same agent, framed at the IgG4-RD level rather than
      the pancreas level.
  notes: 'The evidence base for everything beyond glucocorticoid maintenance is weak by the field''s own
    account: no randomized clinical trials other than glucocorticoid maintenance therapy for type 1 AIP
    have been performed. That is stated in PMID:35737955 and is the reason no efficacy figure appears in
    this record.'
diagnosis:
- name: Distinguishing autoimmune pancreatitis from pancreatic adenocarcinoma
  description: The central diagnostic problem. Both present as a pancreatic mass, and the consequence of
    getting it wrong runs in both directions - an unnecessary pancreatic resection, or a delayed cancer
    diagnosis. Recurrent acute pancreatitis or painless jaundice is what should prompt the evaluation.
  evidence:
  - reference: PMID:32809604
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Recurrent acute pancreatitis or painless jaundice should prompt an evaluation for autoimmune
      pancreatitis.
    explanation: States the clinical trigger for considering the diagnosis.
- name: Serum IgG4 measurement
  description: Elevated to more than twice the upper reference limit in most type 1 patients, and normal
    in type 2. It is a subtype discriminator rather than a test for the disease as a whole, and a normal
    value does not exclude autoimmune pancreatitis.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: IgG4 levels are often elevated in AIP and normal in IDCP.
    explanation: States the discriminating value of the test between the two subtypes, and by implication
      its limitation as an entry-level diagnostic.
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The sensitivity of IgG4 levels in type 1 AIP was low (43%, 21/49 patients).
    explanation: Puts a number on the limitation. Note the population this is measured in - patients who
      were resected because cancer was suspected - which is precisely the population in which the test
      needed to work and did not. The sensitivity in an unselected clinic population is not this number.
- name: Histological assessment for granulocytic epithelial lesions
  description: The only way to establish type 2 positively, since it has no serological marker. The
    granulocytic epithelial lesion is what is being looked for, because the features it shares with type
    1 cannot discriminate.
  evidence:
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Histologically, lymphoplasmacytic acinar inflammation and storiform fibrosis are seen in
      both.
    explanation: States what histology does not discriminate, which is why the granulocytic epithelial
      lesion specifically is the target of the assessment.
- name: Serum CA 19-9 measurement
  description: Frequently ordered when a pancreatic mass is found, and of no use for the question that
    actually matters here. It is elevated in about half of autoimmune pancreatitis patients, so a raised
    value does not argue for adenocarcinoma. Recorded as a diagnosis entry because the negative result is
    clinically load-bearing - it is what stops a raised CA 19-9 being read as confirmation of cancer.
  evidence:
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Serum CA 19 - 9 levels are not useful in distinguishing between AIP and PDAC.'
    explanation: The authors' conclusion, stated as a negative finding. Quoted with the source's own
      spacing of the analyte name.
- name: Recognising the scale of misdiagnosis
  description: How often the diagnostic problem is actually got wrong, which is the quantity that
    justifies everything else in this section. Autoimmune pancreatitis is a small fraction of pancreatic
    resections for suspected cancer but a large fraction of the resections that turn out to have been
    unnecessary.
  evidence:
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 8917 pancreatic resections were performed because of a clinical suspicion of pancreatic
      cancer. AIP accounted for 140 cases (1.6%).
    explanation: The absolute rate, pooled over ten studies. 1.6% of resections is the frequency with
      which this specific error is made, and it is the strongest available argument for a diagnostic
      workup before surgery.
  - reference: PMID:39169289
    reference_title: 'Prevalence of autoimmune pancreatitis in pancreatic resection for suspected
      malignancy: a systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AIP accounted for almost 26% of all cases of benign diseases involving unnecessary surgery
    explanation: The same error expressed against the right denominator. Among resections that should not
      have happened, a quarter were this disease - which is what makes it the leading avoidable cause
      rather than a rare curiosity.
animal_models:
- name: Poly(I:C)-induced experimental autoimmune pancreatitis in MRL/Mp mice
  species: Mouse
  genotype: Wild-type MRL/Mp (autoimmune-prone inbred strain), no engineered lesion
  background: MRL/Mp
  description: 'The standard experimental model of the disease. Repeated intraperitoneal
    polyinosinic-polycytidylic acid in autoimmune-prone MRL/Mp mice produces pancreatic immune cell
    infiltration, fibrosis and destruction of pancreatic architecture, with extrapancreatic involvement
    and raised serum autoantibodies.

    It is worth being explicit about what kind of model this is. There is no genetic lesion and no
    antigen - the disease is induced by a generic innate-immune stimulus in a strain that is already
    predisposed to autoimmunity. So the model reproduces the tissue outcome of the disease without
    reproducing anything about its cause, and it cannot be used to argue for a particular trigger.'
  publication: PMID:29512140
  modeled_mechanisms:
  - target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: The model produces a pancreatic lymphocytic infiltrate with systemic autoantibody
      elevation, and CD8+ T cells accumulate in the inflamed pancreas.
    limitations: 'The recapitulation is of the inflammatory response, not of the specific immunology this
      node asserts. Mice have no IgG4 antibody subclass at all, so the plasmablast and IgG4 axis that
      defines the human node cannot exist in this model. What the model shows is that an autoimmune-prone
      strain given a generic innate stimulus develops pancreatic autoimmune inflammation; it does not
      show that the human disease arises the same way.'
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: The mouse genome encodes no IgG4 orthologue. The defining serological and
        histological feature of type 1 disease - IgG4-positive plasma cells and raised serum IgG4 - is
        therefore not merely unmeasured in this model but structurally impossible in it.
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: Disease is induced by repeated poly(I:C), a synthetic double-stranded RNA analogue
        acting on innate pattern-recognition receptors. No candidate human trigger or autoantigen is
        represented, so the model reproduces the downstream inflammation without the upstream cause the
        node is about.
    readouts:
    - name: CD8+ T cells in the inflamed pancreas
      target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
      direction: INCREASED
      interpretation: Establishes that the model's pancreatic infiltrate contains an expanded cytotoxic
        T-cell compartment, which is the part of the human adaptive response this model can speak to.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: AIP in MRL/Mp mice was induced by repeated intraperitoneal administration of poly I:C
          and CD8+ T cells were increased in the inflamed pancreas.
        explanation: Reports both the induction protocol and the measured increase, in one sentence.
    - name: SLAMF7+CD8+ T cells in spleen and pancreas
      target: Type 1 Aberrant Adaptive Immune Response with Plasmablast Expansion
      direction: INCREASED
      interpretation: A specific activated cytotoxic subset the model nominates as pathogenic. It is a
        model-derived hypothesis about the human disease, not a human finding.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: SLAMF7+CD8+ T cells were elevated in the spleen and pancreas of AIP mice.
        explanation: The measurement itself, in both compartments assayed.
    evidence:
    - reference: PMID:29512140
      reference_title: Autoimmune Pancreatitis Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Although mice lack the IgG4 Ab subtype, autoimmune-prone MRL/Mp mice treated with repeated
        injection with polyinosinic-polycytidylic acid (poly (I:C)) provide an experimental model of AIP.
      explanation: Establishes the model as the accepted experimental system and, in the same sentence,
        states the species limitation that caps its fidelity. Both halves of this link's claim come from
        this one sentence, which is why it is cited on the link rather than on a readout.
  - target: IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The model reproduces the pancreatic infiltration and fibrosis of this node, and the
      resulting destruction of pancreatic architecture, but not the IgG4-positive plasma cell component
      that names it.
    limitations: 'This node bundles two claims - a fibroinflammatory tissue lesion, and that the lesion
      is IgG4-plasma-cell rich - and the model reproduces exactly one of them. Fidelity is recorded as
      LOW rather than MODERATE because the half it cannot reproduce is the half that makes the human
      lesion diagnostic. Storiform fibrosis and obliterative venulitis specifically are not reported in
      the model; what is reported is fibrosis and architectural destruction.'
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: INVALIDATING
      description: IgG4-positive plasma cells cannot be present because the mouse has no IgG4 subclass.
        Any inference from this model to the human lesion's defining feature is unavailable in principle,
        not merely unmeasured.
    readouts:
    - name: Pancreatic immune cell infiltration and fibrosis
      target: IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
      direction: INCREASED
      interpretation: The tissue-level correlate of this node that the model does reproduce.
      evidence:
      - reference: PMID:29512140
        reference_title: Autoimmune Pancreatitis Mouse Model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: These mice exhibit massive destruction of pancreatic architecture associated with
          pancreatic immune cell infiltration and fibrosis.
        explanation: Names the three tissue changes measured in the model.
    - name: Pancreatic inflammation and fibrosis under dexamethasone
      target: IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
      direction: DECREASED
      interpretation: The model reproduces the disease's defining therapeutic behaviour - the lesion is
        corticosteroid-responsive. This is the strongest fidelity argument available for the model, and
        it is a behavioural rather than a mechanistic match.
      evidence:
      - reference: PMID:37661465
        reference_title: Increased SLAMF7(+)CD8(+) T cells are associated with the pathogenesis of
          experimental autoimmune pancreatitis in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Dexamethasone treatment ameliorated pancreatic inflammatory and fibrosis of AIP.
        explanation: Reports the steroid response in the model. Quoted as written, including the
          source's grammatical slip.
    evidence:
    - reference: PMID:29512140
      reference_title: Autoimmune Pancreatitis Mouse Model.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: These mice exhibit massive destruction of pancreatic architecture associated with
        pancreatic immune cell infiltration and fibrosis.
      explanation: Supports treating the model as informative for the tissue lesion, which is the part of
        this node it can address.
  notes: 'Nothing in this entry treats the model as evidence for a human mechanism on its own. It is
    curated because the entry makes claims about a tissue lesion and a steroid response that the model
    does reproduce, and because the one thing it definitively cannot reproduce - IgG4 - is itself
    informative about how central IgG4 is to the disease as opposed to how central it is to the
    diagnostic criteria. That question is the open uncertainty already recorded on the type 1 tissue
    node.'
discussions:
- discussion_id: aip_one_disease_or_two
  kind: CONTROVERSY
  prompt: Is autoimmune pancreatitis one disease with two subtypes, or a clinical grouping of two
    mechanistically distinct diseases that happen to look alike?
  attaches_to:
  - has_subtypes#Type 1
  - has_subtypes#Type 2
  - pathophysiology#Tumefactive Pancreatic Mass
  rationale: 'This entry is curated as one disease with subtypes, and the case against that is strong
    enough to record rather than leave implicit.

    Against one disease: the pathology literature states that type 1 and type 2 "show little morphologic
    or pathogenic overlap". Different effector cells (plasmablast and IgG4-positive plasma cell versus
    neutrophil), different chemokine biology, different serology, different age at presentation,
    different presenting syndrome, different relapse behaviour, and different systemic associations
    (IgG4-related disease versus inflammatory bowel disease). Under this reading the term is
    grouping-shaped.

    For one disease: they share the radiological entity, the tumefactive mass, the cancer mimicry that
    dominates management, and the corticosteroid response, and they are diagnosed under one set of
    international consensus criteria. Clinically they are one problem presenting to one clinic.

    The entry resolves this in favour of one entry with two subtypes for a practical reason as much as a
    principled one. Type 1 is already represented in this knowledge base inside IgG4-Related_Disease as a
    Pancreato-hepato-biliary pattern subtype, and type 2 is represented nowhere at all. A grouping whose
    two members are an existing systemic disease and a non-existent entry would be harder to maintain
    than one entry carrying both mechanisms explicitly as parallel arms - which is what this pathograph
    does, with no edge joining the type 1 and type 2 triggers.

    A reviewer who prefers the grouping reading has good grounds, and the pathograph is built so that
    splitting later would be mechanical rather than a rewrite.'
- discussion_id: aip_igg4_marker_or_mediator
  kind: KNOWLEDGE_GAP
  prompt: Is IgG4 the mediator of type 1 disease, or a marker of it and possibly a counter-inflammatory
    response to it?
  attaches_to:
  - pathophysiology#IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
  rationale: 'The disease is named after IgG4, diagnosed by IgG4, and defined histologically by
    IgG4-positive plasma cells - and whether IgG4 does anything pathogenic is unresolved. The proposal on
    the table is that other subclasses such as IgG1 mediate the injury while IgG4 represents a response
    that dampens excessive inflammation, which would make the disease''s defining marker close to an
    epiphenomenon of it.

    This matters beyond nomenclature. If IgG4 is a dampening response, the correlation between serum
    IgG4 and disease activity is indirect, treatments aimed at IgG4 specifically would be misdirected,
    and the success of B-cell depletion is explained by removing the plasmablast compartment rather than
    by removing IgG4. This entry curates the plasmablast expansion rather than IgG4 itself as the driving
    node for that reason.'
  proposed_experiments:
  - experiment_id: aip_igg4_subclass_pathogenicity
    name: Subclass-resolved pathogenicity testing of AIP patient immunoglobulin
    description: Separate IgG1 and IgG4 fractions from type 1 patient serum and test each for the
      capacity to produce pancreatic injury in a permissive model, rather than inferring pathogenicity
      from abundance in tissue.
    readouts:
    - name: Pancreatic injury attributable to IgG1 versus IgG4 fractions
      target: pathophysiology#IgG4-Positive Plasma Cell Infiltration and Storiform Fibrosis
      direction: INCREASED
      interpretation: Injury from the IgG1 fraction with none or less from IgG4 would support the marker
        reading and argue against IgG4-directed therapy.
- discussion_id: aip_type2_natural_history_unknown
  kind: KNOWLEDGE_GAP
  prompt: What is the natural history of type 2 autoimmune pancreatitis, and how much of its apparently
    better prognosis is real rather than an artefact of how it is ascertained?
  attaches_to:
  - has_subtypes#Type 2
  - phenotypes#Recurrent acute pancreatitis
  rationale: 'Type 2 has no serological marker, so it can only be diagnosed on histology, which means it
    can only be diagnosed in patients who were biopsied or resected. That is a strong selection filter,
    and it applies to every statement made about the subtype - including the statement that it relapses
    rarely, which is exactly the kind of claim a biopsy-ascertained cohort would get wrong in a
    predictable direction. The source reporting the low relapse rate says in the same sentence that the
    natural history is not well understood.

    This is recorded because the subtype-specific claims in this entry - the presentation, the relapse
    behaviour, the IBD association - all rest on that filtered denominator, and none of them is corrected
    for it in any published series.'
notes: 'Boundary with IgG4-Related_Disease. Type 1 autoimmune pancreatitis is the pancreatic
  manifestation of IgG4-related disease, and this knowledge base already curates IgG4-Related_Disease
  with a Pancreato-hepato-biliary pattern subtype. This entry does not re-derive the systemic disease.
  What it adds is type 2, which is not IgG4-related at all and is covered by neither IgG4-Related_Disease
  nor Chronic_Pancreatitis, plus the pancreas-level architecture in which the two mechanisms converge on
  one mass lesion.

  If a future curation prefers to treat this term as a grouping, the pathograph here is built to allow
  it: the type 1 and type 2 triggers are separate root nodes with no edge between them, joined only at
  the shared Tumefactive Pancreatic Mass consequence.

  On ontology bindings. Four terms are deliberately broader than the concept they carry, with the
  specific concept kept in preferred_term. HPO has no term for a tumefactive inflammatory pancreatic
  mass, none spanning combined exocrine and endocrine insufficiency, and none for the multi-organ
  IgG4-related involvement pattern; and CL has no separate term for the T follicular helper 2 subset.
  Broader bindings with a specific preferred_term are used rather than a narrower term being
  manufactured.

  What is deliberately absent. No clinical_trials records: the field states that no randomized trials
  other than glucocorticoid maintenance for type 1 have been performed, so there is no trial to cite. No
  claim that type 3 shares a mechanism with the other two - it is curated as a subtype because the field
  classifies it there, with its iatrogenic trigger stated. And no comorbidity record for the
  inflammatory bowel disease association, which is real and strong but belongs in kb/comorbidities/
  rather than being asserted from a review sentence here.'

- name: Nutrition and deficiency management
  description: For patients with exocrine insufficiency, assess weight, muscle status and fat-soluble vitamins, provide dietitian-guided support and replace documented or expected deficiencies. Avoid unnecessarily severe fat restriction. Monitor bone health and treatment toxicity according to the individual risk profile; this is supportive EPI care rather than proof that AIP inflammation has remitted.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:37737818
    reference_title: 'AGA Clinical Practice Update on the Epidemiology, Evaluation, and Management of Exocrine Pancreatic Insufficiency: Expert Review.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: 'BEST PRACTICE ADVICE 13: Routine supplementation and monitoring of fat-soluble vitamin levels are appropriate. Dietary modifications include a low-moderate fat diet with frequent smaller meals and avoiding very-low-fat diets.'
    explanation: General EPI nutrition advice.
  - reference: url:https://bspghan.org.uk/wp-content/uploads/2023/11/aga-practice-guideline-exocrine-pancreatic-insufficiency.pdf
    reference_title: https://bspghan.org.uk/wp-content/uploads/2023/11/aga-practice-guideline-exocrine-pancreatic-insufficiency.pdf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Once EPI is diagnosed, a multidisciplinary evaluation is helpful to establish the state of the patient ’s digestive and endocrine systems.
    explanation: Full guideline describes nutritional and endocrine assessment.
  target_mechanisms:
  - target: Weight loss
    treatment_effect: MODULATES
    description: Nutritional support addresses inadequate intake or maldigestion-associated weight loss.

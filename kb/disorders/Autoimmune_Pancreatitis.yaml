- name: Circulating plasmablasts
  presence: Increased
  context: >-
    An IgG4-independent activity biomarker. It is curated because the entry already records that serum
    IgG4 has only 43% sensitivity in the population where the test is most needed, and this is the
    measurement that fills that gap: over a third of patients with active disease have a normal serum
    IgG4 and an elevated plasmablast count.

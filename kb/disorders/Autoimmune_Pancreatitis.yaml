      quote_role: REVIEW_SYNTHESIS
      snippet: The majority of patients with type 2 AIP present with features of acute pancreatitis (60%) or painless jaundice (30%).6,7 Episodes of acute pancreatitis in patients with type 2 AIP are clinically mild without the need for intensive care unit admission, the development of organ failure, or peripancreatic fluid collection.6 Other less common patterns of presentation include liver dysfunction, non-specific abdominal symptoms, and the incidental detection of a pancreatic mass on images taken for other purposes.

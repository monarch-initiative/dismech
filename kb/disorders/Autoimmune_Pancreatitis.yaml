    explanation: States that the shared tumefactive lesion is the common endpoint of two distinct
      diseases, which is exactly the architecture this node represents.
  - reference: PMID:28365915
    reference_title: Autoimmune Pancreatitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Idiopathic duct-centric pancreatitis (IDCP) is a closely related but distinct disease that
      mimics AIP radiologically
    explanation: Establishes the radiological indistinguishability that makes the two converge on one
      clinical presentation.
- name: Checkpoint Blockade-Induced Acinar-Centric T Cell Infiltration
  role: trigger
  biological_scale: TISSUE
  description: 'The type 3 lesion, and mechanistically a third disease under one name. Checkpoint
    inhibitors remove the restraint on T-cell activation, and the resulting pancreatic injury is
    acinar-centric T-cell infiltration that evolves from CD4-predominant to CD8-predominant over time.

    It is a separate root node with no edge to the other two arms, for the same reason the type 1 and
    type 2 triggers have no edge between them: nothing in the cited literature connects them
    mechanistically. What it shares with them is that it damages the pancreas, and even the shared
    endpoint is different - most type 3 disease presents as asymptomatic lipase elevation rather than as
    a mass, so it does not converge on the tumefactive node the other two arms meet at.'
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Exocrine pancreatic insufficiency
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Pancreatic atrophy follows in a large share of cases, and exocrine insufficiency with
      it.
  - target: Diabetes mellitus
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: New-onset diabetes is a recognised long-term sequela of checkpoint-inhibitor
      pancreatitis.
  evidence:
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
      epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Histopathologically, ICI-P is characterized by acinar-centric T cell infiltration with
      temporal evolution from CD4 + to CD8 + predominance.'
    explanation: The histological lesion, and the reason this is a separate node rather than a variant
      of either existing arm. Acinar-centric is neither the periductal lymphoplasmacytic pattern of type
      1 nor the duct-centric neutrophilic pattern of type 2.
  - reference: PMID:41922528
    reference_title: 'Immune checkpoint inhibitor-related pancreatitis: a comprehensive review of
      epidemiology, pathophysiology, and management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Most cases present as asymptomatic lipase elevation rather than clinical pancreatitis;
      however, long-term sequelae, including pancreatic atrophy (44-55%), new-onset diabetes mellitus,
      and exocrine insufficiency, are increasingly recognized.'
    explanation: 'States why the presentation diverges from the other two subtypes and what the
      consequences are. The atrophy figure is what justifies the two downstream edges: the injury is
      largely silent and its damage shows up later.'

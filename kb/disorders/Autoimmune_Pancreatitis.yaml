disease_term:
  preferred_term: autoimmune pancreatitis
  term:
    id: MONDO:0015175
    label: autoimmune pancreatitis
synonyms:
- AIP
- sclerosing pancreatitis
- nonalcoholic destructive pancreatitis
description: Autoimmune pancreatitis is an immune-mediated fibroinflammatory pancreatic disorder with two established subtypes. Type 1 is the pancreatic manifestation of IgG4-related disease, with lymphoplasmacytic infiltration, storiform fibrosis and obliterative phlebitis. Type 2 is characterized by neutrophilic duct epithelial injury and granulocytic epithelial lesions and is associated with inflammatory bowel disease. Both can cause pancreatic enlargement, duct abnormalities, obstructive jaundice or acute pancreatitis and often respond to glucocorticoids. Diagnosis requires integration of imaging, serology, histology and clinical context because pancreatic malignancy can resemble AIP. Immune-checkpoint-inhibitor-associated pancreatic injury is a related drug-induced condition; its proposed designation as type 3 AIP remains provisional.
parents:
- Pancreatitis
- Immune-Mediated Inflammatory Disease
has_subtypes:
- name: Type 1
  display_name: Type 1 (lymphoplasmacytic sclerosing pancreatitis, IgG4-related)
  subtype_term:
    preferred_term: autoimmune pancreatitis type 1
    term:
      id: MONDO:0017227
      label: autoimmune pancreatitis type 1
  description: IgG4-related lymphoplasmacytic sclerosing pancreatitis, usually presenting in older adults. Characteristic tissue findings include IgG4-rich lymphoplasmacytic infiltration, storiform fibrosis and obliterative phlebitis. Serum IgG4 may be elevated but is neither universally abnormal nor independently diagnostic. Other IgG4-related organs can be involved, and relapse is more common than in type 2.
  evidence:
  - reference: PMID:29512140
    reference_title: Autoimmune Pancreatitis Mouse Model.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Type 1 AIP (also called LPSP) is characterized by dense lymphoplasmacytic infiltration, storiform fibrosis, and obliterative phlebitis. This is accompanied by massive accumulation of IgG4-expressing plasma cells and, in some patients with elevated levels of serum IgG4 and involvement of other organs, including bile ducts, salivary glands, and kidney.
    explanation: Review synthesis of type 1 histology and systemic involvement.
- name: Type 2
  display_name: Type 2 (idiopathic duct-centric pancreatitis, IDCP)
  subtype_term:
    preferred_term: autoimmune pancreatitis type 2
    term:
      id: MONDO:0017228
      label: autoimmune pancreatitis type 2
  description: Idiopathic duct-centric pancreatitis with granulocytic epithelial lesions and few or no IgG4-positive plasma cells. It more often presents with acute pancreatitis in younger patients and can accompany inflammatory bowel disease, particularly ulcerative colitis. It is not the pancreatic manifestation of systemic IgG4-related disease; rare extrapancreatic granulocytic epithelial lesions have been reported.
  evidence:
  - reference: PMID:34670874
    reference_title: 'Type 2 Autoimmune Pancreatitis: Consensus and Controversies.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Type 2 AIP is unrelated to IgG4 and is a completely distinct entity from type 1 AIP. One confusing factor is that the two types of AIP share patterns of clinical presentation (e.g., acute pancreatitis and painless jaundice) and imaging abnormalities (e.g., diffuse or segmental enlargement). Since there are currently no established serum markers, the diagnosis of type 2 AIP is highly challenging and requires the tissue confirmation of neutrophilic injury to the pancreatic ducts, a finding designated as a granulocytic epithelial lesion.
    explanation: Type 2 is a distinct histological and clinical entity.

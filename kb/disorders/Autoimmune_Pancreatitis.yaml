  biological_scale: TISSUE
  description: Type 1 AIP contains a dense lymphocyte and plasma-cell infiltrate, often rich in IgG4-positive plasma cells. Tissue IgG4-positive cells alone are not disease-specific, and neither their abundance nor serum IgG4 proves that IgG4 is the sole damaging effector.

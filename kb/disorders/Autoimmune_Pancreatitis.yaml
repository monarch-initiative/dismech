- name: Pancreatic Islet Injury
  biological_scale: TISSUE
  description: Inflammation, edema and fibrotic remodeling can impair or damage endocrine islets. Some AIP specimens have preserved islets, and diabetes can also predate AIP or be aggravated by glucocorticoids. Pancreatic endocrine dysfunction is therefore not inferred from acinar injury alone.
  evidence:
  - reference: PMID:35807009
    reference_title: 'Exocrine and Endocrine Insufficiency in Autoimmune Pancreatitis: A Matter of Treatment or Time?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Histological analysis revealed that islet cells of AIP patients were either intact or destroyed due to edema and ischemia because of fibrosis and lymphoplasmatic cell infiltration [25].
    explanation: The paper summarizes prior human histology; islet injury varies between patients.
  locations:
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  downstream:
  - target: Diabetes mellitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Loss or dysfunction of islet cells can contribute to pancreatic diabetes; this does not account for every diabetic patient with AIP.

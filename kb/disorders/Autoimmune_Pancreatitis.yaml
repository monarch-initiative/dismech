- name: Selective maintenance and relapse treatment
  description: Maintenance is selected according to relapse, organ involvement, response and toxicity, rather than being mandatory for every subtype. Re-induction with glucocorticoids may be appropriate. High-risk or relapsing type 1 disease may justify steroid-sparing therapy; optimal agent and duration are not established for every patient.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Adding immunosuppressive agents should be considered in case of disease relapse as main- tenance of remission strategy, and in patients with a high risk of disease relapse, particularly in the case of multi-organ involvement. If there is no change in dis- ease activity or the disease relapsed during the 3 months of treatment (during glucocorticoid taper or discontinuation), then immunosuppressive drugs should be added. (GRADE 2C)
    explanation: GRADE 2C selective maintenance recommendation; lack of response also requires diagnostic reassessment.
    directness: DIRECT
  - reference: url:https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    reference_title: https://www.europeanpancreaticclub.org/media/resources/IgG4_Related_Digestive_Disease.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Rituximab should be considered if patients are resistant or intol- erant to high-dose glucocorticoids to maintain remis- sion or have failed to respond to immunosuppressive therapies. Dosing protocol (375 mg/m 2 body surface area) is used weekly for 4 weeks, followed by infusions every 2–3 months or at two 1000 mg infusions 15 days apart every 6 months. (GRADE 2A)
    explanation: GRADE 2A conditional rituximab recommendation, distinct from a randomized type 1 AIP-specific efficacy estimate.
    directness: DIRECT
- name: Azathioprine maintenance
  description: Azathioprine is used as a steroid-sparing maintenance option in selected relapsing type 1 disease. Evidence is principally observational and does not establish effective acute induction monotherapy or superiority over other agents. Myelosuppression, liver injury and drug-induced pancreatitis limit use.
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:36293522
    reference_title: 'Autoimmune Pancreatitis: From Pathogenesis to Treatment.'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Although there are no clinical trials on the use of AZA in AIP, its efficacy was investigated by Masaki et al. in a systematic review and meta-analysis; they found no AZA-treated patients naïve to corticosteroid treatment, but suggested the efficacy of AZA as maintenance therapy in patients with AIP who experience repeated relapses or are resistant to steroids.
    explanation: Review summarizes limitations of the maintenance evidence.

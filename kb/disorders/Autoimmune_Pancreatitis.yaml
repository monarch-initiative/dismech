- name: Patient-derived CD4 cytotoxic T-cell assays
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Sorted and expanded blood CD4-positive SLAMF7-positive cells from systemic IgG4-related disease patients
  publication: PMID:26971690
  description: Expanded patient cells degranulate and kill allogeneic EBV-transformed B-cell targets after stimulation, and secrete processed IL-1beta and TGF-beta1. The overall clinical cohort had 101 IgG4-RD patients, with 18.8% pancreatic involvement; individual culture assays use smaller subsets. No pancreatic epithelial-target killing, selective pathway rescue or fibroblast-collagen assay establishes a complete human pancreatic fibrosis sequence.

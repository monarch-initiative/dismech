  description: Type 2 AIP specimens show increased IL-8 expression in ductal epithelium and infiltrating cells compared with type 1. The relationship to neutrophil recruitment is biologically plausible but not proven necessary by these tissue observations.
  evidence:
  - reference: PMID:28614208
    reference_title: IL-8 Expression in Granulocytic Epithelial Lesions of Idiopathic Duct-centric Pancreatitis (Type 2 Autoimmune Pancreatitis).
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In quantitative polymerase chain reaction for multiple cytokines using tissue-derived mRNA, the expression level of interleukin (IL)-8 was markedly higher in type 2 AIP than in type 1 AIP (P<0.001).
    explanation: Tissue-derived expression was compared between subtypes; this was not a chemotaxis or IL-8 blockade experiment.
  downstream:
  - target: Neutrophilic Duct Infiltration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: IL-8 expression is consistent with recruitment of neutrophils, but necessity and temporal ordering were not tested.

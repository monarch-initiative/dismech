- name: Anti-TNF therapy in selected relapsing type 2 disease
  description: Infliximab or adalimumab has been reported in a few relapsing or steroid-dependent type 2 cases, often with active IBD. This remains limited case-level evidence and does not establish routine use, a population response rate, or TNF as the proven driver of type 2 duct injury.

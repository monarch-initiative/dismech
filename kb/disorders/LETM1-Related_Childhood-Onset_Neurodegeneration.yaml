- name: Cellular Energy Failure in High-Demand Tissues
  biological_scale: TISSUE
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    ATP supply falls below demand preferentially in the tissues with the highest
    and least interruptible oxidative requirement - retinal ganglion cells and
    their long unmyelinated axons, cochlear hair cells, cerebellar Purkinje
    cells, cortical neurons, cardiomyocytes, skeletal muscle and pancreatic beta
    cells. This tissue-selectivity, from a defect in a ubiquitously expressed
    gene, is the standard explanation for the organ pattern of mitochondrial
    disease; here it is inferred from that general principle plus the observed
    organ involvement rather than measured tissue by tissue, hence PROVISIONAL.
    Elevated serum lactate in 8 of 12 tested individuals is the systemic
    correlate.

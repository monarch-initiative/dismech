    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "On a cellular level GAN is characterized by intermediate filament
      (IF) aggregation, leading to a progressive and fatal peripheral neuropathy
      in humans."
    explanation: Links the cellular aggregation lesion to the progressive
      peripheral neuropathy. Tagged IN_VITRO because the paper reports patient
      fibroblast and Gan-knockout mouse experiments, not human clinical data;

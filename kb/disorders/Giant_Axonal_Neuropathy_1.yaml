name: Giant Axonal Neuropathy 1
creation_date: '2026-08-20T00:00:00Z'
category: Mendelian
synonyms:
- GAN
- GAN1
- giant axonal neuropathy 1
- giant axonal neuropathy type 1
- neuropathy, giant axonal
- giant axonal neuropathy caused by mutation in GAN
- GAN-related neurodegeneration
description: >-
  Giant axonal neuropathy 1 (GAN) is an ultra-rare, early-childhood-onset,
  autosomal recessive neurodegenerative disorder caused by biallelic
  loss-of-function variants in GAN (16q23.2), which encodes gigaxonin.
  Gigaxonin is a substrate-specific adaptor for a cullin-3 (CUL3) ubiquitin
  ligase complex and is the first identified factor controlling degradation of
  the entire intermediate filament family. Loss of functional gigaxonin
  therefore removes the rate-setting step in intermediate filament turnover,
  producing generalized accumulation and disorganized aggregation of
  tissue-specific intermediate filaments — neurofilaments and peripherin in
  neurons, vimentin in fibroblasts, Schwann cells and endothelium, GFAP in
  astrocytes, and keratins in hair. In axons this yields the pathognomonic
  focal swellings densely packed with disorganized intermediate filaments,
  the "giant axons" that name the disease.


  The disorder is best understood as a phenotypic continuum rather than a
  single stereotyped presentation. At the severe end, the classic phenotype
  begins in the first years of life as a prominent sensorimotor peripheral
  neuropathy and evolves to add central nervous system involvement —
  cerebellar signs, pyramidal signs, intellectual disability and seizures —
  with loss of independent ambulation in the second decade and death usually in
  the third decade, most often from pulmonary complications. At the milder end
  is a later-onset, slower-progressing phenotype largely restricted to the
  peripheral nervous system that overlaps clinically with axonal
  Charcot-Marie-Tooth disease. Both ends arise from the same mechanism of
  biallelic GAN loss of function. Dry, tightly curled hair unlike that of
  either parent is a characteristic clinical clue, reflecting the keratin arm
  of the same generalized intermediate filament defect.


  Because the defect is generalized rather than neuron-restricted, it is
  detectable in accessible non-neural tissue: patient dermal fibroblasts
  accumulate vimentin aggregates, which supports a cellular assay and provides
  the readout used in preclinical gene-transfer work. Intrathecal
  AAV9-mediated GAN gene transfer (scAAV9/JeT-GAN) has been evaluated in a
  first-in-human phase 1 dose-escalation trial.

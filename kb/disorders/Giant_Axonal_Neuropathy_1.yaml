has_subtypes:
- name: Classic GAN
  display_name: Classic giant axonal neuropathy (severe, PNS plus CNS)
  description: >-
    The severe end of the continuum. Infantile-onset severe peripheral motor
    and sensory neuropathy evolving into central nervous system impairment
    (intellectual disability, seizures, cerebellar signs and pyramidal tract
    signs), with wheelchair dependence in the second decade and death usually
    in the third decade.
  evidence:
  - reference: PMID:20301315
    reference_title: "GAN-Related Neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classic giant axonal neuropathy phenotype typically manifests
      as an infantile-onset neurodegenerative disorder, starting as a severe
      peripheral motor and sensory neuropathy and evolving into central nervous
      system impairment (intellectual disability, seizures, cerebellar signs,
      and pyramidal tract signs)."
    explanation: GeneReviews defines the classic severe phenotype at this end of
      the continuum.
  - reference: PMID:39680150
    reference_title: "Giant axonal neuropathy (GAN): cross-sectional data on phenotypes, genotypes, and proteomic signature from a German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From the 15 patients described here, 13 (86.7%) had a classical and
      one a mild CMT-like phenotype."
    explanation: Quantifies the predominance of the classic phenotype over the
      CMT-like phenotype in a systematically ascertained cohort.
- name: CMT-like GAN
  display_name: Milder CMT-like giant axonal neuropathy (predominantly peripheral)
  description: >-
    The mild end of the continuum: predominantly motor and sensory neuropathy
    with little to no CNS involvement, overlapping clinically with the axonal
    forms of Charcot-Marie-Tooth neuropathy, and later-onset and
    slower-progressing than the classic phenotype. Identified as a distinct
    subcohort in the largest reported natural history cohort. Same genetic
    mechanism as classic GAN — biallelic GAN loss of function — so this is a
    phenotypic, not a mechanistic, division.
  evidence:
  - reference: PMID:20301315
    reference_title: "GAN-Related Neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the milder end of the spectrum are predominantly motor and
      sensory neuropathies (with little to no CNS involvement) that overlap with
      the axonal form of Charcot-Marie-Tooth neuropathies."
    explanation: GeneReviews defines the mild end of the phenotypic continuum.
  - reference: PMID:34114613
    reference_title: "Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, we identified and characterized a subcohort of
      individuals with a milder form of GAN and with a presentation similar to
      Charcot-Marie-Tooth disease."
    explanation: The natural history cohort independently identifies and
      characterizes this subcohort as distinct from the classic presentation.
pathophysiology:
- name: Gigaxonin Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in GAN (16q23.2) abolish functional
    gigaxonin, the substrate-specific adaptor that recruits intermediate
    filament proteins to a cullin-3 ubiquitin ligase complex. Gigaxonin is a
    ubiquitously expressed, low-abundance protein composed of an N-terminal BTB
    domain followed by six kelch repeats.
  molecular_functions:
  - preferred_term: gigaxonin substrate-adaptor activity in a cullin-3 ubiquitin ligase complex
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
  downstream:
  - target: Impaired Intermediate Filament Degradation
    causal_link_type: DIRECT
  - target: Intermediate Filament Transport Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37043392
      reference_title: "Gigaxonin is required for intermediate filament transport."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We have demonstrated that the loss of gigaxonin dramatically
        inhibited transport of IFs along microtubules by the microtubule motor
        kinesin-1."
      explanation: States the edge directly - loss of gigaxonin inhibits
        intermediate filament transport.
  evidence:
  - reference: PMID:11062483
    reference_title: "The gene encoding gigaxonin, a new member of the cytoskeletal BTB/kelch repeat family, is mutated in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gigaxonin is composed of an amino-terminal BTB (for Broad-Complex,
      Tramtrack and Bric a brac) domain followed by a six kelch repeats, which
      are predicted to adopt a beta-propeller shape."
    explanation: The gene-discovery paper establishes the domain architecture of
      gigaxonin that underlies its adaptor role.
  - reference: PMID:34114613
    reference_title: "Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is caused by biallelic mutations in the GAN gene
      located on 16q23.2, leading to loss of functional gigaxonin, a substrate
      specific ubiquitin ligase adapter protein necessary for the regulation of
      intermediate filament turnover."
    explanation: States the causal genetic lesion, its locus, and the molecular
      role of the lost protein.
- name: Impaired Intermediate Filament Degradation
  biological_scale: MOLECULAR
  description: >-
    Without gigaxonin-directed ubiquitination, intermediate filament proteins
    escape proteasomal turnover. Gigaxonin controls degradation of the entire
    intermediate filament family — vimentin in fibroblasts, and peripherin and
    neurofilament proteins in neurons — and proteasome inhibition reverses the
    clearance produced by gigaxonin overexpression, placing the defect in the
    ubiquitin-proteasome pathway.
  biological_processes:
  - preferred_term: proteasomal degradation of intermediate filament proteins
    modifier: DECREASED
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: protein polyubiquitination of intermediate filament substrates
    modifier: DECREASED
    term:
      id: GO:0000209
      label: protein polyubiquitination
  downstream:
  - target: Intermediate Filament Aggregation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23585478
    reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gigaxonin was similarly involved in the degradation of peripherin
      and neurofilament IF proteins in neurons."
    explanation: The cell-based arm - gigaxonin-dependent degradation of the
      neuronal intermediate filament substrates.
  - reference: PMID:23585478
    reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using fibroblasts from patients and normal individuals, as well as
      Gan-/- mice, we demonstrated that gigaxonin was responsible for the
      degradation of vimentin IFs."
    explanation: The same finding established in the Gan-knockout mouse. Split
      from the in vitro item above so each evidence item carries a single
      evidence_source, per the mixed-source rule.
  - reference: PMID:23585478
    reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, proteasome inhibition by MG-132 reversed the clearance
      of IF proteins in cells overexpressing gigaxonin, demonstrating the
      involvement of the proteasomal degradation pathway."
    explanation: Establishes that the degradation route is proteasomal, which is
      what makes loss of the adaptor sufficient to cause accumulation.
  - reference: PMID:26778561
    reference_title: "Degradation of the Intermediate Filament Family by Gigaxonin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Here, we will focus on the first identified factor controlling the
      degradation of the entire intermediate filament family, the gigaxonin-E3
      ligase."
    explanation: Review establishing that gigaxonin controls the whole
      intermediate filament family, not one filament type.
  - reference: PMID:37903270
    reference_title: "The CRL3(gigaxonin) ubiquitin ligase-USP15 pathway governs the destruction of neurofilament proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we report that the CRL3GIG-USP15 pathway governs the
      destruction of NF proteins NEFL and INA."
    explanation: Identifies the specific neurofilament substrates and the
      CUL3-RBX1-gigaxonin ligase complex acting on them.
  - reference: PMID:37903270
    reference_title: "The CRL3(gigaxonin) ubiquitin ligase-USP15 pathway governs the destruction of neurofilament proteins."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, mutations in the C-terminal Kelch domain of GIG,
      represented by L309R, R545C, and C570Y, disrupted the binding of GIG to
      NEFL and INA, leading to the accumulation of these NF proteins. This
      accounts for the loss-of-function mutations in GAN patients."
    explanation: Connects specific patient Kelch-domain variants to failed
      substrate binding, which is the molecular basis of the degradation defect.
- name: Intermediate Filament Transport Failure
  biological_scale: CELLULAR
  description: >-
    Beyond failed degradation, loss of gigaxonin dramatically inhibits
    kinesin-1-driven transport of intermediate filaments along microtubules.
    The defect is selective — other kinesin-1 cargoes apart from mitochondria
    move normally — and forcing kinesin-1 to bind filaments directly rescues
    their distribution, which places transport failure upstream of the abnormal
    distribution rather than downstream of it. A more than 20-fold rise in
    soluble vimentin oligomers accompanies the block.
  biological_processes:
  - preferred_term: kinesin-1-driven microtubule-based transport of intermediate filaments
    modifier: DECREASED
    term:
      id: GO:0099111
      label: microtubule-based transport
  downstream:
  - target: Intermediate Filament Aggregation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37043392
    reference_title: "Gigaxonin is required for intermediate filament transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We have demonstrated that the loss of gigaxonin dramatically
      inhibited transport of IFs along microtubules by the microtubule motor
      kinesin-1. This inhibition was specific for IFs, as other kinesin-1
      cargoes, with the exception of mitochondria, were transported normally."
    explanation: Establishes the transport defect and its selectivity for
      intermediate filaments.
  - reference: PMID:37043392
    reference_title: "Gigaxonin is required for intermediate filament transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Abnormal distribution of IFs in the cytoplasm can be rescued by
      direct binding of kinesin-1 to IFs, demonstrating that transport
      inhibition is the primary cause for the abnormal IF distribution."
    explanation: The rescue experiment is what makes transport failure causal
      rather than a secondary consequence of aggregation.
  notes: >-
    Curated as a parallel arm to failed degradation rather than a consequence of
    it. The authors' own proposed mechanism is that excess soluble vimentin
    oligomers saturate an unidentified kinesin-1 adapter, which would make this
    arm downstream of the degradation defect; that linkage is explicitly
    speculative in the source and is not asserted here.
- name: Intermediate Filament Aggregation
  biological_scale: CELLULAR
  description: >-
    Undegraded intermediate filaments accumulate as disorganized aggregates.
    Because gigaxonin is ubiquitously expressed, the aggregation is generalized
    and tissue-specific: vimentin in endothelial cells, Schwann cells and
    cultured skin fibroblasts, GFAP in astrocytes, neurofilaments and peripherin
    in neurons, and — the likely basis of the hair phenotype — keratins.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  biological_processes:
  - preferred_term: disorganization of the intermediate filament cytoskeleton
    modifier: ABNORMAL
    term:
      id: GO:0045104
      label: intermediate filament cytoskeleton organization
  - preferred_term: intermediate filament inclusion body formation
    modifier: INCREASED
    term:
      id: GO:0070841
      label: inclusion body assembly
  downstream:
  - target: Giant Axon Formation
    causal_link_type: DIRECT
  - target: Central Nervous System Degeneration
    causal_link_type: DIRECT
  - target: Autophagy-Lysosome Failure
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11062483
    reference_title: "The gene encoding gigaxonin, a new member of the cytoskeletal BTB/kelch repeat family, is mutated in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GAN corresponds to a generalized disorganization of the
      cytoskeletal intermediate filaments (IFs), to which neurofilaments belong,
      as abnormal aggregation of multiple tissue-specific IFs has been reported:
      vimentin in endothelial cells, Schwann cells and cultured skin
      fibroblasts, and glial fibrillary acidic protein (GFAP) in astrocytes."
    explanation: Establishes that the aggregation is generalized across cell
      types rather than restricted to neurons.
  - reference: PMID:23585478
    reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In GAN, aggregates of intermediate filaments (IFs) represent the
      main pathological feature detected in neurons and other cell types,
      including patients' dermal fibroblasts."
    explanation: Identifies intermediate filament aggregates as the principal
      cellular lesion, including in accessible patient fibroblasts.
- name: Autophagy-Lysosome Failure
  biological_scale: CELLULAR
  description: >-
    A secondary, feed-forward consequence of the accumulation rather than a
    parallel cause of it. Neurofilament accumulations disrupt autophagy by two
    distinct routes: they interfere with the distribution of autophagic
    organelles, impairing maturation and fusion with lysosomes; and they
    sequester the chaperone 14-3-3, which is required for correct localization
    of the master autophagy regulator TFEB. Because degradative capacity is
    itself degraded, the arm feeds back onto the accumulation that produced it.
  biological_processes:
  - preferred_term: autophagosome-lysosome fusion
    modifier: DECREASED
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
  downstream:
  - target: Intermediate Filament Aggregation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The feed-forward limb: loss of autophagic-lysosomal degradative capacity
      compounds the accumulation that caused it. Curated as indirect because the
      source demonstrates the autophagy defect and proposes its contribution to
      pathogenesis rather than measuring the return effect on filament load.
  evidence:
  - reference: PMID:40059823
    reference_title: "Neurofilament accumulation disrupts autophagy in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using a combination of genetic and RNA interference approaches, we
      found that dorsal root ganglia from mice lacking gigaxonin have impaired
      autophagy and lysosomal degradation through 2 mechanisms."
    explanation: Establishes the autophagy-lysosome defect in gigaxonin-null
      dorsal root ganglia and that it operates by two mechanisms.
  - reference: PMID:40059823
    reference_title: "Neurofilament accumulation disrupts autophagy in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "First, neurofilament accumulations interfere with the distribution
      of autophagic organelles, impairing their maturation and fusion with
      lysosomes. Second, the accumulations attract the chaperone 14-3-3, which
      is responsible for the proper localization of the key autophagy regulator
      transcription factor EB (TFEB)."
    explanation: Names both routes and, critically, their direction - the
      accumulations act on autophagy, not the reverse.
  notes: >-
    Direction matters here and is easy to invert: this is neurofilament
    accumulation causing autophagy failure, not a primary autophagy defect
    causing accumulation. The entry does not conform this node to
    loss_of_proteostasis#Misfolded-Protein Aggregation, because GAN aggregation
    is failure of regulated degradation of correctly folded intermediate
    filaments rather than misfolding.
- name: Giant Axon Formation
  biological_scale: CELLULAR
  description: >-
    In axons the accumulating intermediate filaments produce the pathognomonic
    focal swellings — segmental distension of the axon densely packed with
    disorganized neurofilaments — that give the disease its name.
  biological_processes:
  - preferred_term: neurofilament cytoskeleton organization
    modifier: ABNORMAL
    term:
      id: GO:0060052
      label: neurofilament cytoskeleton organization
  downstream:
  - target: Distal Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Curated as indirect with unknown intermediates rather than DIRECT: giant
      axons and axonal loss both follow intermediate filament accumulation, and
      whether the swellings themselves cause the degeneration or are a parallel
      manifestation of the same underlying accumulation is not established.
  evidence:
  - reference: PMID:11062483
    reference_title: "The gene encoding gigaxonin, a new member of the cytoskeletal BTB/kelch repeat family, is mutated in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant axonal neuropathy (GAN, MIM 256850), a severe, autosomal
      recessive sensorimotor neuropathy affecting both the peripheral nerves and
      the central nervous system, is characterized by neurofilament
      accumulation, leading to segmental distension of the axons."
    explanation: Describes the defining axonal lesion and its neurofilament
      basis.
  - reference: PMID:29766026
    reference_title: "Development of Intrathecal AAV9 Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathologic signature of GAN is giant axonal swellings filled
      with disorganized accumulations of IFs."
    explanation: States the pathognomonic finding explicitly.
- name: Central Nervous System Degeneration
  biological_scale: TISSUE
  description: >-
    The central arm of the disease, parallel to peripheral axonal degeneration
    rather than downstream of it. Intermediate filament aggregation in central
    neurons and in astrocytes (where GFAP is the accumulating filament) is
    accompanied by inclusion bodies in brain, neuroinflammation, and loss of
    cortical and spinal neurons, and appears radiologically as periventricular
    and cerebellar white-matter T2 hyperintensity. This is the route by which
    cerebellar signs, pyramidal signs and cognitive decline arise; they are not
    consequences of distal peripheral axon loss.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: neuronal apoptosis in cortex and spinal cord
    modifier: INCREASED
    term:
      id: GO:0051402
      label: neuron apoptotic process
  downstream:
  - target: Progressive Neurological Decline
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34114613
    reference_title: "Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presents as a prominent sensorimotor neuropathy and commonly
      progresses to affect both the PNS and CNS"
    explanation: Establishes in a human cohort that central nervous system
      involvement is a distinct feature of the disease course, not merely a
      description of the peripheral neuropathy.
  - reference: PMID:39680150
    reference_title: "Giant axonal neuropathy (GAN): cross-sectional data on phenotypes, genotypes, and proteomic signature from a German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging (MRI) shows high signals on T2-weighted
      sequences in the anterior and posterior periventricular regions as well as
      in the cerebellar white matter, sometimes referred to as
      leukoencephalopathy or leukodystrophy."
    explanation: The radiological correlate of central white-matter involvement
      in human patients.
  - reference: PMID:37137704
    reference_title: "A New Mouse Model of Giant Axonal Neuropathy with Overt Phenotypes and Neurodegeneration Driven by Neurofilament Disorganization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Abundant inclusion bodies composed of disorganized IFs were also
      detected in the brain of Gan-/-;TgPer mice."
    explanation: Shows central intermediate filament inclusion pathology in
      brain, the mechanistic link between the aggregation node and CNS disease.
  - reference: PMID:37137704
    reference_title: "A New Mouse Model of Giant Axonal Neuropathy with Overt Phenotypes and Neurodegeneration Driven by Neurofilament Disorganization."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The disease was associated with neuroinflammation and substantial
      loss of cortical neurons and spinal neurons."
    explanation: Reports the neuroinflammation and central neuronal loss this
      node asserts.
  notes: >-
    How much of the central disease is attributable to intermediate filament
    disorganization specifically is not settled - the model-organism source
    states only that IF disorganization "can drive some neurodegenerative
    changes", and gigaxonin has substrates beyond intermediate filaments. The
    edge is curated as DIRECT on the strength of the human CNS involvement and
    the brain inclusion pathology, not as a claim that IF aggregation is the
    sole cause.
- name: Distal Axonal Degeneration
  biological_scale: CELLULAR
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    Peripheral axonal loss follows, producing the progressive, nerve
    length-dependent sensorimotor neuropathy that dominates early disease. This
    is the final common pathway shared with other axonal neuropathies; in GAN
    the upstream driver is intermediate filament aggregation rather than a
    primary transport or myelin lesion.
  downstream:
  - target: Progressive Neurological Decline
    causal_link_type: DIRECT

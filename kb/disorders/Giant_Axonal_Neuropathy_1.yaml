genetic:
- name: GAN
  notes: >-
    Biallelic loss-of-function variants in GAN (16q23.2), encoding gigaxonin,
    cause giant axonal neuropathy. Causative variants are distributed
    throughout the gene; a recurrent founder mutation has been described in
    individuals of Mexican descent, and recurrent uniparental isodisomy has
    been reported as a route to biallelic status.
  gene_term:
    preferred_term: GAN
    term:
      id: hgnc:4137
      label: GAN
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:11062483
    reference_title: "The gene encoding gigaxonin, a new member of the cytoskeletal BTB/kelch repeat family, is mutated in giant axonal neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here identification of the gene GAN, which encodes a
      novel, ubiquitously expressed protein we have named gigaxonin. We found
      one frameshift, four nonsense and nine missense mutations in GAN of GAN
      patients."
    explanation: The gene-discovery study identifying GAN and its mutation
      spectrum in patients.
  - reference: PMID:34114613
    reference_title: "Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review causative variants distributed throughout the GAN gene
      in this cohort and identify a recurrent founder mutation in individuals
      with GAN of Mexican descent as well as cases of recurrent uniparental
      isodisomy."
    explanation: Describes the variant distribution, a founder allele, and
      uniparental isodisomy as a mechanism reaching biallelic status.
diagnosis:
- name: Molecular genetic testing
  description: >-
    The diagnosis is established in a proband with suggestive clinical findings
    by identifying biallelic pathogenic GAN variants. Molecular confirmation is
    now the definitive test, with biopsy relegated to a supporting role.
  evidence:
  - reference: PMID:20301315
    reference_title: "GAN-Related Neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of GAN-related neuropathy is established in a
      proband with suggestive findings and biallelic GAN pathogenic variants
      identified by molecular genetic testing."
    explanation: GeneReviews DIAGNOSIS/TESTING statement establishing molecular
      testing as the diagnostic standard.
- name: Nerve conduction studies and electromyography
  description: >-
    Electrophysiology shows a nerve length-dependent sensorimotor neuropathy.
    Sensory nerve action potentials are characteristically very low or absent -
    their recovery was used as an objective outcome measure in the gene therapy
    trial.
  evidence:
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Peripheral axonal loss in giant axonal neuropathy causes
      progressive sensorimotor neuropathy, as indicated on electrophysiological
      testing and histologic analysis of the peripheral nerves."
    explanation: Establishes electrophysiology and nerve histology as the
      modalities demonstrating the peripheral axonal loss.
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between 6 and 24 months after gene transfer, sensory-nerve action
      potential amplitudes increased, stopped declining, or became recordable
      after being absent in 6 participants but remained absent in 8."
    explanation: Shows sensory nerve action potentials are absent or severely
      reduced at baseline in most patients, and usable as a quantitative
      diagnostic and outcome measure.
- name: Brain MRI
  description: >-
    T2-weighted hyperintensity in the periventricular regions and cerebellar
    white matter, sometimes described as a leukoencephalopathy or
    leukodystrophy - the radiological signature of the central arm of the
    disease.
  evidence:
  - reference: PMID:39680150
    reference_title: "Giant axonal neuropathy (GAN): cross-sectional data on phenotypes, genotypes, and proteomic signature from a German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging (MRI) shows high signals on T2-weighted
      sequences in the anterior and posterior periventricular regions as well as
      in the cerebellar white matter, sometimes referred to as
      leukoencephalopathy or leukodystrophy."
    explanation: Describes the characteristic MRI findings used diagnostically.
histopathology:
- name: Giant axons on nerve biopsy
  description: >-
    Electron microscopy of sural nerve shows the pathognomonic lesion: focally
    enlarged axons distended by densely packed, disorganized intermediate
    filaments, surrounded by disproportionately thin myelin. Biopsy is now
    supporting rather than required evidence when molecular testing is
    definitive.
  evidence:
  - reference: PMID:29766026
    reference_title: "Development of Intrathecal AAV9 Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pathologic signature of GAN is giant axonal swellings filled
      with disorganized accumulations of IFs."
    explanation: States the defining histopathological lesion.
  - reference: PMID:37137704
    reference_title: "A New Mouse Model of Giant Axonal Neuropathy with Overt Phenotypes and Neurodegeneration Driven by Neurofilament Disorganization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sural nerve biopsies of human GAN patients have shown the presence
      of giant axons filled with IFs, a characteristic feature of GAN disease"
    explanation: States the human sural nerve biopsy finding specifically. The
      quoted sentence is this paper's summary of the human literature, not its
      own mouse data, hence HUMAN_CLINICAL.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Approximately 75 families reported worldwide. No defensible population
    prevalence or incidence rate, carrier frequency, or sex ratio has been
    established for this disease, so no rate_per_100000 is recorded.
  evidence:
  - reference: PMID:39680150
    reference_title: "Giant axonal neuropathy (GAN): cross-sectional data on phenotypes, genotypes, and proteomic signature from a German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus far, this neurological condition has been reported in
      approximately 75 families worldwide"
    explanation: States the total number of ascertained families, which is the
      only defensible occurrence figure for this disease. Note this counts
      families, not individuals.
experimental_models:
- name: GAN patient dermal fibroblasts (vimentin aggregate assay)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary skin fibroblasts from GAN patients accumulate vimentin intermediate
    filament aggregates, providing an accessible non-neural readout of the
    generalized defect and the assay used to demonstrate rescue by GAN gene
    transfer.
  modeled_mechanisms:
  - target: Intermediate Filament Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Patient-derived cells reproduce the defining cellular lesion in the
      patient's own genetic background.
    limitations: >-
      Fibroblasts report the vimentin arm of a generalized intermediate filament
      defect and cannot model the axonal geometry, giant axon formation, or the
      neuronal degeneration that determine the clinical phenotype.
    readouts:
    - name: Proportion of cells displaying vimentin IF aggregates
      target: Intermediate Filament Aggregation
      direction: RESTORED
      interpretation: >-
        Aggregate-bearing cell counts fall after delivery of a normal GAN
        transgene, tying the cellular phenotype to gigaxonin deficiency.
      evidence:
      - reference: PMID:23316953
        reference_title: "Restoration of cytoskeleton homeostasis after gigaxonin gene transfer for giant axonal neuropathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Treatment of primary skin fibroblast cultures from three
          different GAN patients with an adeno-associated virus type 2 (AAV2)
          vector containing a normal human GAN transgene significantly reduced
          the number of cells displaying vimentin IF aggregates."
        explanation: Reports the measurement and its direction after gene
          transfer.
    evidence:
    - reference: PMID:23585478
      reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In GAN, aggregates of intermediate filaments (IFs) represent the
        main pathological feature detected in neurons and other cell types,
        including patients' dermal fibroblasts."
      explanation: Establishes that patient fibroblasts carry the same defining
        lesion, which is what makes them informative for this node.
animal_models:
- name: Gan knockout mouse
  species: Mouse
  genotype: Gan-/-
  publication: PMID:29766026
  description: >-
    Gigaxonin-null mice accumulate neuronal intermediate filaments and show
    peripheral nerve pathology and rotarod deficits, and were the vehicle for
    preclinical intrathecal AAV9 gene-transfer studies.
  modeled_mechanisms:
  - target: Intermediate Filament Aggregation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The knockout reproduces intermediate filament accumulation and peripheral
      nerve pathology, and these are reversible by GAN gene transfer, which is
      what made it usable for preclinical gene-transfer work.
    limitations: >-
      Downgraded from RECAPITULATES/MODERATE on the strength of PMID:41402936,
      which reports that the early knockout strains failed to reproduce the
      severity and histopathology of human disease: mild, late-onset (>12
      months) symptoms with no overt degeneration and, critically, no giant
      axons and no neurofilament compaction - the defining human lesions.
      Phenotype also varies with genetic background. Inferences about the giant
      axon and CNS arms of the disease should use the A49E knock-in instead.
    evidence:
    - reference: PMID:41402936
      reference_title: "Disease mutation in gigaxonin-E3 ligase recapitulates giant axonal neuropathy in mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Indeed, the homozygous KO mice exhibit mild symptoms with late
        onset (> 12 months of age), no overt degeneration, absence of giant
        axons and compaction of NFs, which is seen in patients"
      explanation: Directly limits what the knockout can support - it lacks the
        defining human lesions - which is why the relationship is
        PARTIALLY_RECAPITULATES rather than RECAPITULATES.
    - reference: PMID:23585478
      reference_title: "Giant axonal neuropathy-associated gigaxonin mutations impair intermediate filament protein degradation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using fibroblasts from patients and normal individuals, as well
        as Gan-/- mice, we demonstrated that gigaxonin was responsible for the
        degradation of vimentin IFs."
      explanation: The knockout was used to establish gigaxonin's degradation
        role, supporting its relevance to this node.
    readouts:
    - name: Neuronal intermediate filament accumulation and sciatic nerve ultrastructure
      target: Intermediate Filament Aggregation
      direction: RESTORED
      interpretation: >-
        Intrathecal gene transfer preserved nerve ultrastructure and reduced
        intermediate filament accumulation, linking the aggregation node to
        gigaxonin dose.
      evidence:
      - reference: PMID:29766026
        reference_title: "Development of Intrathecal AAV9 Gene Therapy for Giant Axonal Neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "IT delivery of AAV9/JeT-GAN in aged GAN KO mice preserved
          sciatic nerve ultrastructure, reduced neuronal IF accumulations and
          attenuated rotarod dysfunction."
        explanation: Reports the measured structural and functional readouts in
          the knockout.
- name: GAN A49E knock-in mouse
  species: Mouse
  genotype: GAN A49E/A49E knock-in
  publication: PMID:41402936
  description: >-
    A knock-in of a disease-causing GAN missense mutation rather than a gene
    deletion. Unlike the earlier knockout strains it produces an overt
    phenotype - early sensory-motor deficits and ataxia, giant axons,
    demyelination, and the neurofilament compaction and disorganization seen in
    patients - making it the first rodent model to reproduce the histological
    hallmarks. It also reveals neuromuscular junction and muscle involvement,
    and a sex bias with females more severely affected that has no established
    human counterpart.
  modeled_mechanisms:
  - target: Giant Axon Formation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the pathognomonic lesion - giant axons with compacted,
      disorganized neurofilaments - which the knockout strains do not.
    limitations: >-
      Carries one specific missense allele (A49E), so it models the dominant
      mechanism of gigaxonin protein instability rather than the full mutational
      spectrum. The female-biased severity has no established human counterpart.
    readouts:
    - name: Giant axons and neurofilament compaction across the nervous system
      target: Giant Axon Formation
      direction: INCREASED
      interpretation: >-
        Presence of the human histological hallmark, absent from prior knockout
        models, is what makes this strain informative for this node.
      evidence:
      - reference: PMID:41402936
        reference_title: "Disease mutation in gigaxonin-E3 ligase recapitulates giant axonal neuropathy in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "GANA49E/A49E mice exhibit early sensory-motor deficits and
          ataxia, giant axons and demyelination which, together with increased
          abundance, dramatic compaction and disorganization of neurofilaments
          across the nervous system, mimics the human disease."
        explanation: Reports the histological and behavioural readouts in this
          strain.
    evidence:
    - reference: PMID:41402936
      reference_title: "Disease mutation in gigaxonin-E3 ligase recapitulates giant axonal neuropathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Altogether, the GANA49E strain provides the first robust rodent
        model for GAN, recapitulating the symptoms and histological hallmarks of
        the human pathology."
      explanation: The authors' own assessment that this strain recapitulates
        the disease, which is the basis for treating it as informative here.
treatments:
- name: Intrathecal scAAV9/JeT-GAN gene transfer
  description: >-
    Self-complementary AAV9 carrying a codon-optimized human GAN transgene under
    the JeT promoter, delivered by lumbar intrathecal infusion to target spinal
    motor neuron and dorsal root ganglion cell bodies. Evaluated in a phase 1
    dose-escalation study (NCT02362438) in 14 children. Results were mixed and
    dose-dependent: the 1.8x10^14 vg dose met the prespecified efficacy
    threshold for slowing motor decline, but the highest dose did not, and
    adverse events occurred. This is an investigational therapy, not an
    established standard of care.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: Gigaxonin Loss of Function
    treatment_effect: RESTORES
    description: >-
      The transgene restores gigaxonin expression, addressing the primary
      molecular defect rather than a downstream consequence.
    evidence:
    - reference: PMID:29766026
      reference_title: "Development of Intrathecal AAV9 Gene Therapy for Giant Axonal Neuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This strategy conferred sustained wild-type gigaxonin expression
        across the PNS and CNS for at least 1 year in mice."
      explanation: Demonstrates that the vector restores the missing protein,
        which is the mechanism by which it targets this node.
  evidence:
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Intrathecal gene transfer with scAAV9/JeT-GAN for giant axonal
      neuropathy was associated with adverse events and resulted in a possible
      benefit in motor function scores and other measures at some vector doses
      over a year."
    explanation: The trial's own conclusion is deliberately hedged — possible
      benefit at some doses, with adverse events — so this supports the
      treatment only partially.
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between 6 and 24 months after gene transfer, sensory-nerve action
      potential amplitudes increased, stopped declining, or became recordable
      after being absent in 6 participants but remained absent in 8."
    explanation: Reports the electrophysiological outcome, including the
      non-responding majority, as an objective measure alongside the motor
      score.
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy is established. Management is supportive and
    multidisciplinary, directed at the individual's clinical findings, with the
    goal of optimizing intellectual and physical development.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301315
    reference_title: "GAN-Related Neurodegeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care is focused on managing the clinical findings of
      the individual, and often involves a team including neurologists,
      orthopedic surgeons, physiotherapists, occupational and physical
      therapists, psychologists, and speech-language pathologists."
    explanation: GeneReviews management recommendation for the disease.
clinical_trials:
- name: NCT02362438
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Intrathecal dose-escalation study of scAAV9/JeT-GAN in children with giant
    axonal neuropathy; safety was the primary end point, with change in the
    32-item Motor Function Measure total percent score as key secondary
    clinical end point.
  evidence:
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conducted an intrathecal dose-escalation study of
      scAAV9/JeT-GAN (a self-complementary adeno-associated virus-based gene
      therapy containing the GAN transgene) in children with giant axonal
      neuropathy. Safety was the primary end point."
    explanation: Describes the trial design and primary end point.
  - reference: PMID:38507752
    reference_title: "Intrathecal Gene Therapy for Giant Axonal Neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants older than 6 years of age with genetically confirmed
      giant axonal neuropathy were enrolled from April 2015 through August 2020."
    explanation: Records the enrollment window, which closed in August 2020.
  - reference: clinicaltrials:NCT02362438
    reference_title: "A Phase I Study of Intrathecal Administration of scAAV9/JeT-GAN for the Treatment of Giant Axonal Neuropathy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Participants will have a total of about 27 visits, weekly,
      monthly, and then yearly over 15 years."
    explanation: The registry record's own long-term follow-up schedule.
  notes: >-
    Status corrected from ACTIVE_NOT_RECRUITING to COMPLETED. The ClinicalTrials.gov
    v2 API reports overallStatus COMPLETED with an ACTUAL completion date of
    2026-04-10 (record last updated 2026-08-14, queried 2026-08-20). The earlier
    value was inferred from the 2024 publication describing the study as ongoing
    with enrollment closed - an inference that was already stale when it was
    made. No evidence item quotes the status because the cached registry record
    predates the completion and carries no recruitment-status field; the status
    is taken from the live registry, recorded here rather than as a fabricated
    snippet.
discussions:
- discussion_id: gan_knockout_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the preclinical evidence base for GAN - built largely on Gan-knockout
    mice that lack giant axons and neurofilament compaction - support inference
    about the human disease, and does the A49E knock-in change what earlier
    knockout results can be taken to show?
  attaches_to:
  - pathophysiology#Giant Axon Formation
  rationale: >-
    The gene-transfer work that supported the first-in-human trial was performed
    largely in knockout strains now reported to lack the two defining human
    lesions. That is a translational-validity question rather than a gap in
    evidence: the mouse results exist and are internally sound, but the model
    was missing the pathology the therapy is meant to reverse. The A49E knock-in
    reproduces those lesions and so offers a way to test whether the earlier
    conclusions hold. Its female-biased severity has no established human
    counterpart and should not be carried into human claims.
  evidence:
  - reference: PMID:41402936
    reference_title: "Disease mutation in gigaxonin-E3 ligase recapitulates giant axonal neuropathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Unlike previous GAN knock-out mice which show no overt phenotype,
      GANA49E/A49E mice exhibit early sensory-motor deficits and ataxia"
    explanation: States the contrast between the knockout strains and the
      knock-in that makes this a model-fidelity question.
  proposed_experiments:
  - experiment_id: gan_a49e_gene_transfer_replication
    name: Replicate intrathecal AAV9 GAN gene transfer in the A49E knock-in
    description: >-
      Repeat the preclinical intrathecal scAAV9/JeT-GAN dosing in GAN A49E/A49E
      mice and score giant axon burden and neurofilament compaction - endpoints
      unavailable in the knockout strains - alongside the rotarod and nerve
      ultrastructure measures used originally, powered to detect the reported
      sex difference.
- discussion_id: gan_phenotypic_continuum_determinants
  kind: KNOWLEDGE_GAP
  prompt: >-
    What determines position on the GAN phenotypic continuum — why do some
    individuals with biallelic GAN loss-of-function variants develop classic
    infantile multisystem neurodegeneration while others have a milder,
    later-onset, predominantly peripheral CMT-like course?
  attaches_to:
  - pathophysiology#Progressive Neurological Decline
  rationale: >-
    Both ends of the continuum share the same causal mechanism — biallelic GAN
    loss of function — yet differ markedly in age of onset, rate of
    progression, and whether the central nervous system is involved at all. The
    natural history cohort characterized the milder subcohort but the
    determinants of that divergence (residual gigaxonin function by genotype,
    modifier alleles, or another factor) are not established, which matters
    directly for prognosis and for trial stratification. The obvious candidate
    explanation — genotype — has been looked for and not found: no mutation
    hotspot exists and no apparent genotype-phenotype correlation has been
    demonstrated, so this is an open question rather than an unexamined one.
  evidence:
  - reference: PMID:39680150
    reference_title: "Giant axonal neuropathy (GAN): cross-sectional data on phenotypes, genotypes, and proteomic signature from a German cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An obvious mutation hotspot does not exist, and there is no
      apparent correlation between genotype and phenotype."
    explanation: Establishes that the genotype-based explanation for continuum
      position has been sought and not found, which is what makes this a
      genuine knowledge gap rather than an unasked question.
  proposed_experiments:
  - experiment_id: gan_genotype_continuum_correlation
    name: Genotype-to-continuum-position correlation in the natural history cohort
    description: >-
      Correlate genotype class (null/null versus genotypes predicted to retain
      residual gigaxonin, e.g. missense) with continuum position and rate of
      MFM-32 decline in the prospective natural history cohort, using
      cross-reactive immunologic material status as an independent measure of
      residual protein.
notes: >-
  Lump/split decision: curated as a single Disease entry at MONDO:0009749
  (giant axonal neuropathy 1), the gene-specific term, with the severe and
  CMT-like presentations as has_subtypes rather than separate entries.


  The entry is deliberately NOT curated at the MONDO parent MONDO:0000128
  (giant axonal neuropathy). That term is an OMIM phenotypic-series grouping
  spanning two different genes: this entry's GAN/gigaxonin disease
  (MONDO:0009749) and the distinct DCAF8 disease giant axonal neuropathy 2
  (MONDO:0012411). Curating at the parent would conflate two genes, so the
  gene-specific child is the correct level.


  Within MONDO:0009749, GeneReviews treats the whole severity range as one
  continuum ("GAN-related neurodegeneration") arising from one mechanism -
  biallelic GAN loss of function - which is why the severe and mild
  presentations are modeled as subtypes rather than as separate entries.


  Naming caution: the "CMT-like GAN" subtype here is the mild end of the
  GAN/gigaxonin continuum, NOT the DCAF8 disease MONDO:0012411, whose own
  synonyms include "CMT2 with giant axons" and which is genuinely classified
  under CMT2. The two are different genes and different MONDO terms despite the
  similar phrasing.


  No datasets are recorded. `just discover-datasets` returned only GENE_ONLY
  candidates, every one of which was a false match on the string "GAN" as the
  Gubra-Amylin NASH ("GAN diet") mouse model rather than the GAN gene — NASH,
  obesity and alcoholic liver disease studies with no relation to this disease.
  Relevance triage rejected all of them; this is the Named Entity Confusion
  failure mode reached through dataset search.


  Curated with falcon deep research plus GeneReviews and primary literature.

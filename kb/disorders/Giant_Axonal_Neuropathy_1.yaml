- name: Progressive Neurological Decline
  biological_scale: ORGANISM
  description: >-
    Peripheral neuropathy is joined over time by central nervous system
    degeneration, giving the polysymptomatic course: cerebellar dysfunction,
    pyramidal signs, cognitive decline, vision loss, loss of ambulation, and
    death from pulmonary complications, typically in the third decade.
  evidence:
  - reference: PMID:34114613
    reference_title: "Giant axonal neuropathy: cross-sectional analysis of a large natural history cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Giant axonal neuropathy (GAN) is an ultra-rare autosomal
      recessive, progressive neurodegenerative disease with early childhood
      onset that presents as a prominent sensorimotor neuropathy and commonly

name: Celiac Disease
creation_date: '2025-12-18T17:01:35Z'
description: >-
  Celiac disease is a chronic immune-mediated enteropathy of the small intestine
  triggered by dietary gluten in genetically susceptible individuals carrying
  HLA-DQ2 or HLA-DQ8 haplotypes. Deamidated gluten peptides presented to gluten-reactive
  CD4+ T cells drive a mucosal immune response that produces villous atrophy,
  crypt hyperplasia, intraepithelial lymphocytosis, and characteristic
  anti-tissue-transglutaminase autoantibodies. The resulting malabsorption causes
  chronic diarrhea, weight loss, iron deficiency anemia, and other nutritional
  deficiencies, and the disease typically remits on a strict gluten-free diet.
category: Complex
parents:
- Gastrointestinal Disease
- Autoimmune Disease

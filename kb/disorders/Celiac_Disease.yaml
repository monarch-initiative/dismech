- name: Early Gluten Introduction
  notes: Randomized trials found the timing of gluten introduction does not alter
    celiac disease risk in genetically at-risk infants
  evidence:
  - reference: PMID:25271603
    reference_title: Randomized feeding intervention in infants at high risk for celiac
      disease
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: the introduction of small quantities of gluten at 16 to 24 weeks of age
      did not reduce the risk of celiac disease by 3 years of age
    explanation: The PreventCD randomized trial (944 HLA-DQ2/DQ8-positive infants
      with an affected first-degree relative) refutes the earlier observational
      "window of opportunity" hypothesis that this exposure had recorded as "timing
      may affect risk".
- name: Gastrointestinal Infections
  exposure_term:
    preferred_term: Infectious agent exposure
    term:
      id: ECTO:3000000
      label: exposure to organism
  influences_mechanisms:
  - target: Gluten-Triggered Immune Response
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Gluten remains the necessary trigger; enteric infection is proposed to
      raise the chance that a genetically susceptible person loses tolerance
      to it. It contributes rather than causes, which is why this is
      predisposing.
    evidence:
    - reference: PMID:31331324
      reference_title: "Celiac disease: a comprehensive current review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "occurs with the contribution of environmental factors (e.g., viral infections and dysbiosis of gut microbiota)"
      explanation: >-
        Names viral infections among the environmental factors contributing to
        disease development, alongside the necessary gluten trigger.
  notes: May trigger onset
  evidence:
  - reference: PMID:31331324
    reference_title: "Celiac disease: a comprehensive current review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occurs with the contribution of environmental factors (e.g., viral infections and dysbiosis of gut microbiota)"
    explanation: Viral infections are recognized environmental cofactors in celiac disease onset.
- name: Gut Microbiome
  influences_mechanisms:
  - target: Microbiome Dysbiosis
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Targets the entry's own dysbiosis node rather than the gluten trigger.
      MODULATES rather than PREDISPOSES because the direction of causation here
      is genuinely unsettled: dysbiosis is both a proposed contributor to loss
      of tolerance and a consequence of established disease, and the cited
      source describes the microbiome as a modulator rather than a risk factor.
    evidence:
    - reference: PMID:42386020
      reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The gut microbiome has emerged as a key modulator of immune homeostasis, intestinal barrier integrity, and gluten metabolism, implicating microbial dysbiosis in both the initiation and progression of CD"
      explanation: >-
        Describes the gut microbiome as a key modulator of immune homeostasis,
        barrier integrity and gluten handling, a modulating role rather than
        an initiating one.
  notes: Dysbiosis modulates disease initiation, progression, and symptom burden
  evidence:
  - reference: PMID:31331324
    reference_title: "Celiac disease: a comprehensive current review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "occurs with the contribution of environmental factors (e.g., viral infections and dysbiosis of gut microbiota)"
    explanation: Gut microbiota dysbiosis is recognized as an environmental factor contributing to celiac disease.
  - reference: PMID:42386020
    reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gut microbiome has emerged as a key modulator of immune homeostasis, intestinal barrier integrity, and gluten metabolism, implicating microbial dysbiosis in both the initiation and progression of CD"
    explanation: Dysbiosis is mechanistically implicated in both disease initiation and progression through impaired immune homeostasis, barrier function, and gluten degradation.
  - reference: PMID:42386020
    reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alterations in microbial composition and metabolic activity have been documented in genetically at-risk individuals prior to disease onset"
    explanation: Dysbiosis occurs in pre-disease individuals with genetic risk, supporting dysbiosis as an initiating environmental factor.

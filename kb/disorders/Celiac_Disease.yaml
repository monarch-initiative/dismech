histopathology:
- name: Marsh Classification of Duodenal Mucosal Injury
  description: >-
    The histological grading scheme for celiac enteropathy, applied to duodenal
    biopsy and reported in ascending order of injury: infiltrative change with
    raised intraepithelial lymphocyte counts and preserved architecture (Marsh
    1), the addition of crypt hyperplasia (Marsh 2), and villous atrophy graded
    partial, subtotal and total (Marsh 3a to 3c). The Oberhuber revision is the
    form in routine diagnostic use. Grade is not a proxy for clinical severity:
    an entry-level caveat worth keeping in view is that vitamin and mineral
    deficiencies in newly diagnosed patients do not track the histological grade.
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:10524652
    reference_title: "The histopathology of coeliac disease: time for a standardized report scheme for pathologists."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we review the histological features of coeliac disease and propose a standardized report scheme based on the Marsh classification"
    explanation: >-
      The source of the revised reporting scheme built on Marsh's grades, which
      is the classification named here.
  notes: >-
    Recorded as a single graded finding rather than one record per grade, because
    the grades are ordered states of one lesion. The individual architectural
    components already appear as phenotypes (Villous Atrophy) and as
    pathophysiology (Intestinal Epithelial Damage); this record is the
    classification that orders them. The intraepithelial lymphocyte threshold is
    not fixed across implementations - historically 30 per 100 enterocytes,
    commonly 25 in contemporary practice - so a grade is only interpretable
    alongside the threshold the reporting laboratory used.
- name: Corazza-Villanacci Grading of Duodenal Mucosal Injury
  description: >-
    A simplified alternative to Marsh grading, collapsing the scheme to three
    categories - grade A, non-atrophic, with raised intraepithelial lymphocytes
    and normal villous architecture; grade B1, atrophic, with villi shortened but
    still identifiable; and grade B2, atrophic-flat, with complete villous
    flattening. Its purpose is reproducibility: the larger Marsh-Oberhuber
    category set carries substantial interobserver disagreement, and collapsing
    the atrophic grades removes the boundary judgements that drive most of it.
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:33179621
    reference_title: "Celiac disease: histology-differential diagnosis-complications. A practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biopsy of duodenal mucosa remains the gold standard in the diagnosis of celiac disease with the recognition of the spectrum of histological changes and classification of mucosa damage based on updated Corazza-Villanacci system."
    explanation: >-
      A diagnostic-pathology review naming this system as the basis for grading
      mucosal damage, which is what this record captures alongside the older
      Marsh scheme.
  notes: >-
    Recorded beside the Marsh record rather than replacing it. Both are in live
    use, a report may carry either, and they are not interconvertible at the
    boundary between Marsh 3a, 3b and 3c, which grade B2 collapses.
has_subtypes:
- name: Classical
  display_name: Classical (symptomatic malabsorptive)
  description: >-
    Presents with the malabsorptive syndrome - diarrhea, steatorrhea, weight
    loss and nutrient deficiency - on a background of villous atrophy.
- name: Non-classical
  display_name: Non-classical (extraintestinal or minor GI presentation)
  description: >-
    Presents without the malabsorptive syndrome, through extraintestinal
    features such as anemia, reduced bone mineral density, transaminase
    elevation or neurological manifestations, or with non-specific bowel
    symptoms including constipation.
- name: Subclinical
  display_name: Subclinical / silent (screen-detected)
  description: >-
    Positive serology and villous atrophy on biopsy with no attributable
    symptoms, usually found by screening a risk group. "Subclinical" is the Oslo
    term; "silent" is the older usage and is sometimes restricted to
    asymptomatic villous atrophy specifically.
  evidence:
  - reference: PMID:33179621
    reference_title: "Celiac disease: histology-differential diagnosis-complications. A practical approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2011, the Oslo Classification ranked the clinical presentation of CD in classical, non classical, subclinical and refractory"
    explanation: >-
      The naming authority for the clinical forms recorded in this block, and the
      source of "subclinical" as the preferred term for this one.
- name: Latent
  description: >-
    A historically ambiguous label, used both for disease that was previously
    abnormal and has normalized on diet, and for currently normal mucosa that
    later becomes abnormal. Recorded because it appears in older literature;
    because the two senses are opposites, a report using it has to say which is
    meant.
- name: Nonresponsive
  display_name: Nonresponsive celiac disease
  description: >-
    Persistent or recurrent symptoms, laboratory abnormalities or enteropathy
    after six to twelve months of prescribed gluten withdrawal. This is not a
    synonym for refractory disease and is the more common situation: most cases
    turn out to be continued gluten exposure, a second diagnosis, or a
    complication, and evaluation for those comes before a refractory label.
- name: Potential
  description: >-
    Positive celiac serology and a compatible HLA genotype with normal duodenal
    architecture. Some, but not all, progress to enteropathy.
- name: Seronegative
  description: >-
    Villous atrophy with HLA-DQ2/DQ8 positivity that responds to a gluten-free
    diet, in a patient with no detectable celiac antibodies. Roughly 1.7% of
    cases, and the boundary condition on the entry's autoantibody node.
- name: Refractory Type I
  display_name: Refractory celiac disease type I
  description: >-
    Persistent or recurrent malabsorptive symptoms with villous atrophy after
    more than twelve months of strict gluten withdrawal, with a normal
    (polyclonal) intraepithelial lymphocyte phenotype.
- name: Refractory Type II
  display_name: Refractory celiac disease type II (RCDII)
  description: >-
    Refractory disease carrying a clonal population of phenotypically aberrant
    intraepithelial lymphocytes, commonly with JAK1 or STAT3 gain-of-function
    mutations. This is the premalignant form, and the clinical counterpart of the
    Aberrant Clonal Intraepithelial Lymphocyte Expansion node; it precedes most
    enteropathy-associated T-cell lymphoma.
  evidence:
  - reference: PMID:33579790
    reference_title: "Oncogenetic landscape of lymphomagenesis in coeliac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often preceded by low-grade clonal intraepithelial lymphoproliferation, referred to as type II refractory CeD (RCDII)"
    explanation: >-
      Defines this subtype as the clonal intraepithelial lymphoproliferation that
      commonly precedes lymphoma, which is what distinguishes it from type I.
animal_models:
- name: IL-15 overexpressing HLA-DQ8 transgenic mouse
  species: Mouse
  genotype: >-
    HLA-DQ8 transgenic with IL-15 overexpression in both the intestinal
    epithelium and the lamina propria, gluten-sensitized
  publication: PMID:32051586
  modeled_mechanisms:
  - target: Intestinal Epithelial Damage
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The only model that reproduces gluten-dependent villous atrophy, and the
      experimental basis of the three-signal model (gluten plus HLA-DQ plus
      IL-15).
    limitations: >-
      Villous atrophy here requires engineered IL-15 overexpression in two
      compartments simultaneously, which is a construction of the model rather
      than a demonstrated configuration in patients. The strong reading of it is
      contradicted in humans by the AMG 714 trial, where anti-IL-15 antibody did
      not prevent gluten-induced mucosal injury. Treat the model as establishing
      joint sufficiency, not the separate necessity of each signal.
    evidence:
    - reference: PMID:32051586
      reference_title: "IL-15, gluten and HLA-DQ8 drive tissue destruction in coeliac disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Overexpression of IL-15 in both the epithelium and the lamina propria is required for the development of villous atrophy, which demonstrates the location-dependent central role of IL-15 in the pathogenesis of coeliac disease."
      explanation: >-
        States what the model shows and the compartmental requirement that makes
        it a constructed configuration.
  notes: >-
    The open question this model raises is tracked in the
    mismatch_three_signal_villous_atrophy_requirement discussion; this record is
    the model itself rather than a restatement of that argument.

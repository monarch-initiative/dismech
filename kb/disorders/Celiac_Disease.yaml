- accession: massive:MSV000080779
  title: Gluten-specific antibodies of celiac disease gut plasma cells recognize long proteolytic fragments that typically harbor T-cell epitopes
  description: This study aimed to identify proteolytic fragments of gluten proteins recognized by recombinant IgG1 monoclonal antibodies generated from single IgA plasma cells of celiac disease lesions. Peptides bound by monoclonal antibodies in complex gut-enzyme digests of gluten treated with the deamidating enzyme transglutaminase 2, were identified by mass spectrometry after antibody pull-down with protein G beads. The antibody bound peptides were long deamidated peptide fragments that contained the substrate recognition sequence of transglutaminase 2.

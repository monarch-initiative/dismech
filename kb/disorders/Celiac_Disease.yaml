- accession: geo:GSE200075
  title: 'A human autoimmune organoid model reveals IL-7 function in celiac disease '
  description: In vitro models of autoimmunity are constrained by an inability to culture affected epithelium alongside the complex tissue-resident immune microenvironment. Celiac disease (CeD) is an autoimmune disease where dietary gluten-derived peptides bind the MHC- II molecules HLA-DQ2 or -DQ8 to initiate immune-mediated duodenal mucosal injury. Here, we generated air-liquid interface (ALI) duodenal organoids from endoscopic biopsies that preserve epithelium alongside native mesenchyme and tissue-resident immune cells as a unit without requiring reconstitution. The ALI organoid immune diversity spanned T, B, plasma, NK and myeloid cells with extensive T and B cell receptor repertoires.

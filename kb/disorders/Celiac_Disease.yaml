genetic:
- name: HLA-DQ2
  association: Risk Factor
  relationship_type: RISK_FACTOR
  notes: >-
    Present in ~95% of patients (DQ2 alone ~90%, DQ8 covers most remainder). This is the
    CELIAC1 locus of OMIM phenotypic series PS212750 (OMIM:212750, HLA-DQA1/HLA-DQB1 at
    6p21.32) — one of only three rows in that series with a known molecular basis. No
    gene_term is bound because DQ2 is a serotype encoded by an HLA-DQA1/HLA-DQB1 haplotype
    rather than a single gene. MONDO holds the locus as MONDO:0008930 "celiac disease,
    susceptibility to, 1", which predisposes_towards celiac disease rather than subclassing
    it — the reason the PS212750 members are risk-factor rows here and not grouping members.
  evidence:
  - reference: PMID:31331324
    reference_title: "Celiac disease: a comprehensive current review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genetic background (HLA-DQ2/DQ8 positivity and non-HLA genes) is a mandatory determinant of the development of the disease"
    explanation: HLA-DQ2/DQ8 positivity is a mandatory genetic determinant for celiac disease development.
- name: HLA-DQ8
  association: Risk Factor
  relationship_type: RISK_FACTOR
  notes: >-

- accession: geo:GSE315138
  title: Single Cell RNA Sequencing Unveils Distinct Cellular Dynamics in Celiac Disease Duodenal Biopsies
  description: Celiac disease (CeD) is the most common autoimmune disorder in the U.S., affecting at least 1% of the population. The ingestion of gluten-containing proteins triggers an adaptive immune response, causing intestinal damage and leading to both gastrointestinal and systemic symptoms. Despite a strong genetic predisposition, the mechanistic understanding of CeD remains limited. The lack of approved therapy, other than dietary avoidance of gluten which is difficult and often unsuccessful, underscores the need to identify new mechanisms that can provide insights for developing therapeutics.

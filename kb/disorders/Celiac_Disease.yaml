discussions:
- discussion_id: mismatch_three_signal_villous_atrophy_requirement
  prompt: >-
    Is dual epithelial and lamina propria IL-15 overexpression a genuine
    co-requirement for villous atrophy in human celiac disease, as it is in the
    engineered HLA-DQ8 mouse, or is IL-15 an amplifier whose removal does not by
    itself prevent gluten-induced mucosal injury?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
  - pathophysiology#Intestinal Epithelial Damage
  - phenotypes#Villous Atrophy
  rationale: >-
    The three-signal model (gluten + HLA-DQ + IL-15) is the single most
    consequential expansion the 2026 openscientist report proposed, and the
    canonical hypothesis description leans on it. Its direct demonstration is a
    mouse engineered to overexpress IL-15 in two gut compartments while
    expressing HLA-DQ8; that construction shows the three signals are jointly
    sufficient in the model, not that each is separately necessary in patients.
    Human biopsy work supports IL-15 involvement and shows epithelial stress and
    adaptive antigluten immunity acting in synergy, but it does not establish the
    engineered configuration as a universal human rule. The published anti-IL-15
    trial cuts the other way: AMG 714 did not prevent mucosal injury during
    gluten challenge, which is what removing one of three strictly required
    signals should have done. Curate the three-signal model as strong
    model-organism support plus a human mechanistic hypothesis, and do not assert
    a proven human co-requirement.
  proposed_experiments:
  - experiment_id: exp_celiac_il15_blockade_active_disease
    name: IL-15 blockade in gluten-exposed celiac disease, powered for histology and stratified by HLA-DQ
    description: >-
      Building on the AMG 714 phase 2a result, run an adequately powered
      randomized trial of IL-15 or IL-15Ralpha blockade during a standardized
      gluten challenge, stratified by HLA-DQ2 homozygosity, DQ2 heterozygosity
      and DQ8, with predefined co-primary histologic and intraepithelial
      lymphocyte endpoints and mucosal transcriptomics. Include an arm combining
      IL-15 blockade with TG2 inhibition to separate additive from synergistic
      action of the innate and adaptive arms.
    would_support:
    - pathophysiology#Intestinal Epithelial Damage
    would_refute:
    - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
    supporting_outcome:
    - >-
      IL-15 blockade alone prevents the gluten-induced fall in villus
      height-to-crypt depth ratio, establishing IL-15 as a required signal in
      humans rather than an amplifier.
    refuting_outcome:
    - >-
      Adequately powered IL-15 blockade again fails to protect mucosal
      architecture while TG2 inhibition in the same trial does, indicating that
      the human requirement is carried by the adaptive arm and that the
      engineered mouse configuration does not transfer.
  evidence:
  - reference: PMID:32051586
    reference_title: "IL-15, gluten and HLA-DQ8 drive tissue destruction in coeliac disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overexpression of IL-15 in both the epithelium and the lamina propria is required for the development of villous atrophy, which demonstrates the location-dependent central role of IL-15 in the pathogenesis of coeliac disease."
    explanation: >-
      The primary source of the three-signal claim. The requirement is
      established inside an engineered mouse that expresses HLA-DQ8 and
      overexpresses IL-15 in two compartments, which is why the claim is curated
      as model-organism evidence.
  - reference: PMID:26001928
    reference_title: "Distinct and Synergistic Contributions of Epithelial Stress and Adaptive Immunity to Functions of Intraepithelial Killer Cells and Active Celiac Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The adaptive immune response to gluten appears to act in synergy with epithelial stress to allow intraepithelial cytotoxic T cells to kill epithelial cells and induce villous atrophy in patients with active celiac disease."
    explanation: >-
      Human tissue evidence that epithelial stress and antigluten adaptive
      immunity are both involved and synergistic. It supports two contributing
      arms without demonstrating that a specific two-compartment IL-15
      configuration is necessary in every patient.
  - reference: PMID:31494096
    reference_title: "Safety and efficacy of AMG 714 in adults with coeliac disease exposed to gluten challenge: a phase 2a, randomised, double-blind, placebo-controlled study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "AMG 714 did not prevent mucosal injury due to gluten challenge."
    explanation: >-
      The strong reading of the three-signal model predicts that removing IL-15
      should block villous atrophy. A randomized anti-IL-15 antibody trial in
      gluten-challenged patients missed that endpoint, which is the central
      reason this is recorded as an open human-model mismatch rather than as an
      established human co-requirement. Note the trial was in treated patients
      undergoing short gluten challenge and did show a smaller intraepithelial
      lymphocyte rise at 300 mg, so it constrains the necessity claim without
      excluding an IL-15 contribution.
- discussion_id: gap_celiac_tolerance_breaking_trigger
  prompt: >-
    What event converts an HLA-DQ2/DQ8 carrier who is orally tolerant to gluten
    into one who mounts the pathogenic gluten-specific CD4 T-cell response?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Gluten-Triggered Immune Response
  - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
  - environmental#Gastrointestinal Infections
  rationale: >-
    The canonical model starts at gluten presentation and is silent on what
    licenses that presentation to break tolerance. HLA-DQ2 or DQ8 is carried by a
    large minority of the general population and only about 1 percent develop
    disease, so the haplotype fixes susceptibility rather than timing or
    penetrance. The candidate triggers this entry already records as
    environmental factors are individually inconclusive: enteric infection is
    supported by reovirus work in mice without human replication, dysbiosis is
    correlative and bidirectional, and randomized trials found that the timing of
    infant gluten introduction does not alter risk. Because this gap sits
    upstream of every node in the entry, it is the step whose resolution would do
    most for primary prevention.
  proposed_experiments:
  - experiment_id: exp_celiac_prospective_virome_before_seroconversion
    name: Serial virome, microbiome and mucosal immune phenotyping in at-risk infants through seroconversion
    description: >-
      Extend an existing HLA-DQ2/DQ8 at-risk birth cohort with serial stool
      virome and microbiome sequencing, interferon-signature profiling and, where
      ethically possible, mucosal sampling, anchored on the date of anti-TG2
      seroconversion rather than on diagnosis, so that candidate triggers can be
      ordered before and after the loss of tolerance instead of being sampled
      after disease is established.
    would_support:
    - environmental#Gastrointestinal Infections
    supporting_outcome:
    - >-
      A specific exposure window, viral taxon or interferon signature reproducibly
      precedes anti-TG2 seroconversion in at-risk carriers and is absent in
      matched carriers who remain tolerant.
    refuting_outcome:
    - >-
      No exposure or immune signature separates carriers who seroconvert from
      those who do not, which would move the trigger to host-intrinsic or
      stochastic explanations rather than an environmental event.
- discussion_id: gap_celiac_rcd2_gluten_independent_clonal_expansion
  prompt: >-
    What sustains the clonal intraepithelial lymphocyte expansion of refractory
    celiac disease type II once it no longer depends on gluten stimulation, and
    at what point does the canonical model stop applying?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
  - pathophysiology#Intestinal Epithelial Damage
  - treatments#Corticosteroids
  rationale: >-
    Refractory celiac disease type II is the clearest boundary condition on the
    canonical model in this entry. Dominant T-cell receptor beta clonotypes
    recovered from these patients are patient-specific and bear no homology to
    known gliadin-specific sequences, and the clones persist stably for years on
    a strict gluten-free diet, so the driving stimulus is no longer the antigen
    the rest of the entry is built around. Genetic susceptibility to the
    progression also appears to be separate from susceptibility to celiac disease
    itself. What the entry cannot yet say is what does drive the expansion, which
    matters because this is the pre-lymphomatous state that the gluten-free diet
    does not treat.
  evidence:
  - reference: PMID:28188172
    reference_title: "T-cell repertoires in refractory coeliac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dominant TCRβ sequences identified in patients with RCD type II are unique and not homologous to known gliadin-specific TCR sequences, supporting the assumption that these clonal T-cells expand independent of gluten stimulation."
    explanation: >-
      High-throughput sequencing of the duodenal T-cell repertoire is the direct
      evidence that the expanded clones are not the gluten-specific cells the
      canonical model describes. The authors themselves frame this as supporting
      an assumption rather than proving stimulus independence.
  - reference: PMID:29787419
    reference_title: "A locus at 7p14.3 predisposes to refractory celiac disease progression from celiac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SNP rs2041570 on chromosome 7 was significantly associated with progression to RCDII (P=2.37×10, odds ratio=2.36) but not with CeD susceptibility."
    explanation: >-
      A susceptibility variant specific to the progression and absent from celiac
      susceptibility indicates the refractory state has partly separate genetic
      determinants, reinforcing it as a boundary rather than a late stage of the
      same mechanism.
- discussion_id: gap_celiac_integrated_feedback_loops
  prompt: >-
    Do the proposed amplification loops of celiac disease operate as one
    integrated system, and would disrupting a single loop collapse the cascade?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
  - pathophysiology#Autoantibody Production
  - pathophysiology#Barrier Dysfunction
  rationale: >-
    Three amplification loops are commonly invoked to explain why celiac disease
    escalates quickly and heals slowly: secretory IgA delivering gliadin peptides
    back across the epithelium through CD71, IFN-gamma driving thioredoxin
    release that reactivates extracellular TG2, and TG2-reactive B cells
    presenting gluten peptides to gluten-specific T cells. Each has separate
    experimental support, but they were characterized in different reductionist
    systems and have never been perturbed together in one system, so their joint
    contribution is an inference rather than a measurement. The follow-up cohorts
    that document delayed or incomplete mucosal recovery on a gluten-free diet
    describe the outcome without attributing it to these loops.
  proposed_experiments:
  - experiment_id: exp_celiac_combinatorial_loop_perturbation
    name: Combinatorial loop perturbation in patient-derived intestinal organoid immune co-cultures
    description: >-
      In duodenal organoid or air-liquid-interface cultures retaining
      tissue-resident immune cells from celiac patients, block CD71-mediated
      retrotranscytosis, extracellular TG2 activity and B-cell antigen
      presentation singly and in combination during gliadin exposure, reading out
      gluten-specific T-cell activation, epithelial injury and anti-TG2 output.
    would_support:
    - pathophysiology#Autoantibody Production
    supporting_outcome:
    - >-
      Blocking any single loop produces a disproportionate reduction in
      gluten-specific T-cell activation and epithelial injury, which is the
      signature of a coupled amplifying system.
    refuting_outcome:
    - >-
      Single blockades produce only additive, proportionate reductions, indicating
      three parallel contributors rather than one nested self-amplifying circuit.
  evidence:
  - reference: PMID:22750506
    reference_title: "Interactions among secretory immunoglobulin A, CD71, and transglutaminase-2 affect permeability of intestinal epithelial cells to gliadin peptides."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In the presence of celiac IgA or SIgA against p31-49, transport of intact 3H-p31-49 increased significantly across Caco-2 monolayers; this transport was inhibited by soluble CD71 or Tgase2 inhibitors."
    explanation: >-
      Demonstrates the retrotranscytosis loop as a transport mechanism in
      epithelial cell monolayers. It establishes that the route exists and is
      CD71 and TG2 dependent, and deliberately does not establish that it is the
      dominant route to the lamina propria in patients.
  - reference: PMID:31285344
    reference_title: "Efficient T cell-B cell collaboration guides autoantibody epitope bias and onset of celiac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Production of antibodies against N-terminal epitopes coincided with clinical onset of disease, suggesting that TG2-reactive B cells with certain epitope specificities could be the main antigen-presenting cells for pathogenic, gluten-specific T cells."
    explanation: >-
      Supports the B-cell antigen-presenting loop from patient-derived plasma
      cells, with the authors' own hedge that these B cells could be the main
      presenting cells, which is the level of claim curated here.
- discussion_id: mismatch_celiac_ati_tlr4_adjuvant
  prompt: >-
    Do wheat amylase-trypsin inhibitors contribute to human celiac disease as a
    TLR4-dependent innate adjuvant, or is the evidence confined to cell lines,
    mice and non-celiac inflammatory settings?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - environmental#Wheat Food Products
  - pathophysiology#Gluten-Triggered Immune Response
  rationale: >-
    Amylase-trypsin inhibitors are a non-gluten wheat component proposed as a
    parallel innate signal that lowers the threshold for the adaptive gluten
    response, and they are one reason wheat is singled out among cereals. The
    supporting work is TLR4 reporter activation in mouse and human cell lines
    plus modest intestinal inflammation in healthy mice fed dietary
    concentrations of ATIs. The most frequently paired second citation concerns
    ATIs as adjuvants of allergic inflammation in PBMC-humanized mice, which is a
    different disease context. No cited experiment shows an ATI contribution to
    initiation or enteropathy in celiac patients, and the gluten-free diet that
    treats the disease removes ATIs and gluten together, so the clinical
    observation cannot separate them. Recorded here rather than as a
    pathophysiology node, because adding a node would assert a human celiac
    mechanism the evidence does not reach.
  evidence:
  - reference: PMID:27993525
    reference_title: "Nutritional Wheat Amylase-Trypsin Inhibitors Promote Intestinal Inflammation via Activation of Myeloid Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Concentrations of ATIs found in a normal daily gluten-containing diet increased low-level intestinal inflammation."
    explanation: >-
      Establishes that dietary-level ATI intake produces measurable intestinal
      inflammation, in healthy mice and via TLR4-responsive cell lines. This is
      the strongest form of the claim the primary literature supports, and it is
      not a celiac-specific or human result.
datasets:
- accession: geo:GSE319777
  title: Therapeutic TG2 Inhibition Reverses Systemic Multiomic Dysregulation in Celiac Disease
  description: 'Background and Aims: Celiac disease (CeD) is an autoimmune disease triggered by dietary gluten in genetically predisposed individuals. Deamidation of gluten peptides by the CeD autoantigen and enzyme transglutaminase 2 (TG2) is central to the pathogenesis of CeD. Inhibition of TG2 with the specific inhibitor ZED1227 effectively prevents gluten-induced histological damage in CeD patients. Here we aimed to explore the blood DNA methylomic changes in ZED1227-treated CeD patients undergoing a gluten challenge. Results: Drug treatment revealed consistent patterns suggesting normalization of the DNA methylome indicating that ZED1227 attenuated the systemic responses to gluten challenge.'

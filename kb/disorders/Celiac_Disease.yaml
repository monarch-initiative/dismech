- accession: massive:MSV000080859
  title: Different Binding Motifs of the Celiac Disease Associated HLA Molecules DQ2.5, DQ2.2 and DQ7.5 Revealed by Relative Quantitative Proteomics of Endogenous Peptide Repertoires
  description: In this study relative quantitative analysis of endogenous peptides by mass spectrometry combined with neural network analysis have been used to address why the alpha- or beta-chain sharing human leukocyte antigen (HLA)-DQ molecules DQ2.5, DQ2.2 and DQ7.5 display different risks for celiac disease. Celiac disease is caused by intolerance to cereal gluten proteins, and HLA-DQ molecules are involved in the disease pathogenesis by presentation of gluten peptides to CD4+ T cells.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Celiac Disease"). Retrieved 2026-08-02.
- accession: massive:MSV000080779
  title: Gluten-specific antibodies of celiac disease gut plasma cells recognize long proteolytic fragments that typically harbor T-cell epitopes
  description: This study aimed to identify proteolytic fragments of gluten proteins recognized by recombinant IgG1 monoclonal antibodies generated from single IgA plasma cells of celiac disease lesions. Peptides bound by monoclonal antibodies in complex gut-enzyme digests of gluten treated with the deamidating enzyme transglutaminase 2, were identified by mass spectrometry after antibody pull-down with protein G beads. The antibody bound peptides were long deamidated peptide fragments that contained the substrate recognition sequence of transglutaminase 2.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Celiac Disease"). Retrieved 2026-08-02.
- accession: dbgap:phs000274
  title: Genome-Wide Association Study of Celiac Disease
  description:  Celiac disease (gluten-sensitive enteropathy, celiac sprue) is a common disease with significant morbidity and mortality. It is caused by sensitivity to the dietary protein gluten, resulting in a chronic enteropathy in the small intestine. Celiac disease is now recognized to be a common disease, with reports that the disease frequency is 1:133 in the United States, similar to European estimates. There is recent evidence to suggest that the incidence of the disease is rising. Occult disease is frequently present with minimal classic symptoms or signs.

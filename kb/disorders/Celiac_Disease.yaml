mechanistic_hypotheses:
- hypothesis_group_id: canonical_gluten_hladq_ttg_enteropathy_model
  hypothesis_label: Canonical Gluten / HLA-DQ2-DQ8 / tTG Enteropathy Model
  status: CANONICAL
  description: >-
    Celiac disease arises in HLA-DQ2 / HLA-DQ8 positive individuals from a CD4 T-cell-mediated immune
    response to dietary gluten/gliadin peptides that have been deamidated by tissue transglutaminase 2
    (TG2/tTG). Deamidation converts neutral glutamine residues to negatively charged glutamate,
    dramatically increasing peptide affinity for HLA-DQ2/DQ8 and licensing presentation to gluten-reactive
    CD4 T cells in the lamina propria. The resulting mixed Th1/Th17/IL-21 cytokine response,
    together with IL-15-driven innate epithelial activation (proposed as a co-required signal in the
    three-signal model, so far demonstrated as a strict co-requirement only in an engineered mouse),
    drives intraepithelial lymphocyte cytotoxicity, B-cell expansion with anti-TG2 autoantibody
    production, crypt hyperplasia, and villous atrophy. Gluten-free diet remission, HLA-DQ2/DQ8
    restriction, and the ZED1227 randomized TG2-inhibitor trial (attenuated the gluten-induced fall in
    villus-height/crypt-depth ratio) all corroborate the gluten / HLA / TG2 axis as the canonical
    pathogenic mechanism.
  notes: >-
    Retained as CANONICAL. The 2026 openscientist
    hypothesis-search report
    (kb/hypotheses/Celiac_Disease/canonical_gluten_hladq_ttg_enteropathy_model)
    finds STRONGLY SUPPORTED with five required mechanistic
    expansions. Core gluten → TG2-deamidation → HLA-DQ2/DQ8
    presentation → CD4 T-cell activation → mucosal injury cascade
    is validated by ZED1227 Phase 2a (TG2 inhibition attenuated
    gluten-induced mucosal injury — the first causal human
    perturbation of the axis), HLA-DQ2 tetramer and direct-cloning
    studies (0.5–1.8% of intestinal CD4 T cells gluten-reactive by
    cloning and 0.1–1.2% tetramer-positive, correlating with Marsh
    grade and serum IgA anti-TG2), and gluten-free-diet remission.
    The report's five proposed expansions are recorded here with the
    dispositions from the 2026 assessment sidecar
    (assessments/openscientist-assessment-by-codex.yaml), which are
    weaker than the report's own wording: (1) IL-15 / innate immunity
    co-required for villous atrophy — three-signal model (IL-15 +
    HLA-DQ + gluten) — QUALIFIED: demonstrated in an engineered
    HLA-DQ8 mouse overexpressing IL-15, not established as a
    universal human co-requirement (see the HUMAN_MODEL_MISMATCH
    discussion); (2) the cytokine response is mixed Th1/Th17/IL-21
    rather than pure Th1/IFN-γ — QUALIFIED: IL-17A and IL-21
    production is documented in active human mucosa, largely in cells
    that also make IFN-γ, which is cytokine complexity rather than a
    coequal independent Th17 driver; (3) three nested positive
    feedback loops (IgA-CD71 retrotranscytosis, IFN-γ /
    thioredoxin/TG2 activation, B-cell APC amplification) drive
    chronicity — QUALIFIED: each loop has separate experimental
    support, but they have never been tested as an integrated system
    and the histologic follow-up cohorts do not attribute incomplete
    healing to them; (4) wheat amylase-trypsin inhibitors (ATIs)
    provide parallel TLR4-mediated innate signaling as adjuvant —
    QUALIFIED: TLR4 activation and low-grade murine intestinal
    inflammation are shown, contribution to human celiac initiation
    is not; (5) transcellular IgA-CD71 retrotranscytosis is the
    dominant gluten transport route — REJECTED: the cited work
    demonstrates a transport mechanism in epithelial monolayers, not
    its quantitative dominance over the paracellular route in
    patients, so no route ranking is asserted here. The
    tolerance-breaking trigger —
    what converts ~97% of HLA-DQ2/DQ8 carriers (oral-tolerant)
    into the ~1–3% who develop disease — remains unresolved.
    Boundary conditions where the model is insufficient:
    seronegative CeD (~1.7%), refractory CeD type II
    (gluten-independent clonal T-cell expansion), and DQ8-specific
    mechanistic differences.
  evidence:
  - reference: PMID:38914866
    reference_title: "Transcriptomic analysis of intestine following administration of a transglutaminase 2 inhibitor to prevent gluten-induced intestinal damage in celiac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transglutaminase 2 (TG2) plays a pivotal role in the pathogenesis of"
    explanation: >
      Canonical mechanism reference used as the seed for the
      hypothesis-search deep-research run.
  - reference: PMID:34192430
    reference_title: "A Randomized Trial of a Transglutaminase 2 Inhibitor for Celiac Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with ZED1227 at all three dose levels attenuated gluten-induced duodenal mucosal injury."
    explanation: >
      ZED1227 Phase 2a randomized trial (CEC-3) provides the strongest
      interventional evidence for the canonical gluten/HLA/TG2 axis:
      pharmacological TG2 inhibition attenuated the loss of
      villus-height/crypt-depth ratio during gluten challenge. The
      primary-endpoint differences from placebo were 0.44 (10 mg),
      0.49 (50 mg) and 0.48 (100 mg), so the trial establishes a causal
      contribution of TG2 and its therapeutic tractability rather than
      a monotonic dose response or strict necessity of TG2 in every
      genotype and disease context.
  - reference: PMID:23775608
    reference_title: "Direct cloning and tetramer staining to measure the frequency of intestinal gluten-reactive T cells in celiac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the frequency of gluten-specific T cells correlated with the degree of histological damage in the gut mucosa as scored by Marsh-grading, and also with serum IgA anti-transglutaminase 2 antibody levels"
    explanation: >
      Direct measurement of the HLA-DQ2-restricted, gluten-reactive CD4
      T-cell compartment in intestinal biopsies ties the frequency of the
      cells the canonical model makes central to both the histological
      severity and the anti-TG2 humoral output the model predicts.
  - reference: PMID:37445994
    reference_title: "The Oral Transglutaminase 2 Inhibitor ZED1227 Accumulates in the Villous Enterocytes in Celiac Disease Patients during Gluten Challenge and Drug Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that active TG2 is present at the luminal side of the villous epithelium and that inhibition of TG2 activity by ZED1227 occurs already there before gliadin peptides enter the lamina propria."
    explanation: >
      Immunodetection of the drug-enzyme complex in post-treatment
      biopsies from the same phase 2a trial localizes the inhibited step
      to the villous brush border, refining where in the canonical
      cascade the deamidation node acts.
pathophysiology:
- name: Gluten-Triggered Immune Response
  description: >
    Gluten peptides (gliadin) cross the intestinal epithelium and are
    deamidated by tissue transglutaminase (tTG). Deamidated peptides
    bind HLA-DQ2/DQ8 and activate CD4+ T cells.
  cell_types:
  - preferred_term: T Helper Cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: Antigen Processing
    term:
      id: GO:0019882
      label: antigen processing and presentation
  evidence:
  - reference: PMID:10684852
    reference_title: "The intestinal T cell response to alpha-gliadin in adult celiac disease is focused on a single deamidated glutamine targeted by tissue transglutaminase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tissue transglutaminase (tTG)-mediated deamidation of gliadin plays an important role in recognition of this food antigen by intestinal T cells"
    explanation: Demonstrates the critical role of tTG deamidation in converting gluten peptides into immunogenic epitopes recognized by T cells in celiac disease. Evidence derives from patient-derived intestinal T-cell lines and antigen-recognition assays (ex vivo/in vitro).
  - reference: PMID:10684852
    reference_title: "The intestinal T cell response to alpha-gliadin in adult celiac disease is focused on a single deamidated glutamine targeted by tissue transglutaminase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the deamidated peptides displayed an increased affinity for DQ2, a molecule known to preferentially bind peptides containing negatively charged residues"
    explanation: Shows how tTG deamidation increases HLA-DQ2 binding affinity by introducing negatively charged glutamate residues, enhancing antigen presentation. Based on HLA-DQ2 peptide-binding assays (in vitro).
  - reference: PMID:38914866
    reference_title: "Transcriptomic analysis of intestine following administration of a transglutaminase 2 inhibitor to prevent gluten-induced intestinal damage in celiac disease."
    supports: SUPPORT
    snippet: "Transglutaminase 2 (TG2) plays a pivotal role in the pathogenesis of celiac disease (CeD) by deamidating dietary gluten peptides, which facilitates antigenic presentation and a strong anti-gluten T cell response."
    explanation: Confirms TG2 deamidation as the pivotal mechanism enabling gluten peptide presentation and T cell activation in celiac disease pathogenesis.
  downstream:
  - target: Mixed Th1/Th17/IL-21 Mucosal Cytokine Response
    causal_link_type: DIRECT
    description: >-
      Gliadin challenge of duodenal biopsies from patients in remission raises
      IL-17A output from mucosal CD4+ and CD4+CD8+ cells, so the gluten-driven
      T-cell activation node feeds the mucosal cytokine node directly.
    evidence:
    - reference: PMID:20061410
      reference_title: "Characterization of IL-17A-producing cells in celiac disease mucosa."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The addition of a peptic-tryptic digest of gliadin to ex vivo organ cultures of duodenal biopsy specimens taken from inactive CD patients enhanced IL-17A production by both CD4(+) and CD4(+)CD8(+) cells."
      explanation: >-
        Ex vivo gliadin challenge of patient biopsies is a direct perturbation
        linking gluten exposure to the mucosal IL-17A response.
- name: Mixed Th1/Th17/IL-21 Mucosal Cytokine Response
  biological_scale: TISSUE
  description: >-
    The effector cytokine milieu of active celiac mucosa is not purely
    Th1/IFN-gamma. IL-17A and IL-21 are overproduced alongside IFN-gamma, and
    the IL-17A-producing CD4+ and CD4+CD8+ cells largely co-express IFN-gamma
    rather than forming a separate stable Th17 lineage. IL-15, the innate arm
    cytokine, positively regulates mucosal IL-21 production, providing a
    mechanistic junction between the innate and adaptive arms. Curated as
    cytokine complexity within the canonical response, not as an independent
    coequal Th17 driver.
  cell_types:
  - preferred_term: Mucosal CD4+ T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  biological_processes:
  - preferred_term: T-helper 1 cell cytokine production
    term:
      id: GO:0035744
      label: T-helper 1 cell cytokine production
    modifier: INCREASED
  - preferred_term: Mucosal interleukin-17A production
    term:
      id: GO:0032620
      label: interleukin-17 production
    modifier: INCREASED
  downstream:
  - target: Intestinal Epithelial Damage
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The mixed effector cytokine response is the proximal output of gluten-specific
      T-cell activation that precedes intraepithelial lymphocyte cytotoxicity and
      villous atrophy. The intermediate steps between individual cytokines and
      enterocyte killing are not resolved in human tissue, so the edge is recorded
      as indirect.
  evidence:
  - reference: PMID:20061410
    reference_title: "Characterization of IL-17A-producing cells in celiac disease mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "expression of IL-17A RNA and protein is more pronounced in active CD biopsy specimens in comparison with inactive CD and normal mucosal biopsy specimens"
    explanation: >-
      Establishes that IL-17A is elevated specifically in active disease mucosa,
      which is the observation that qualifies the pure Th1 description.
  - reference: PMID:20061410
    reference_title: "Characterization of IL-17A-producing cells in celiac disease mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of IL-17A-producing CD4(+) and CD4(+)CD8(+) cells coexpressed IFN-gamma but not CD161."
    explanation: >-
      The co-expression is why this node is curated as a mixed response rather
      than as a separate Th17 lineage acting in parallel to Th1.
  - reference: PMID:22785229
    reference_title: "IL-15 positively regulates IL-21 production in celiac disease mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-21 was highly produced by CD4+ and CD4+/CD8+ IELs and LPLs in active CD."
    explanation: >-
      Documents the IL-21 component of the mixed response in both intraepithelial
      and lamina propria compartments of active disease.
  - reference: PMID:22785229
    reference_title: "IL-15 positively regulates IL-21 production in celiac disease mucosa."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment of control LPLs with IL-15, a cytokine overproduced in CD, activated Akt and STAT3 (signal transducer and activator of transcription 3), thus enhancing IL-21 synthesis."
    explanation: >-
      Supplies the mechanistic junction between the IL-15-driven innate arm and
      the adaptive IL-21 output, rather than leaving the two arms unconnected.
- name: Intestinal Epithelial Damage
  description: >
    Activated T cells release IFN-gamma and other cytokines causing
    villous atrophy, crypt hyperplasia, and increased intraepithelial
    lymphocytes. Leads to malabsorption.
  cell_types:
  - preferred_term: Intestinal Epithelial Cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Apoptosis
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:38914866
    reference_title: "Transcriptomic analysis of intestine following administration of a transglutaminase 2 inhibitor to prevent gluten-induced intestinal damage in celiac disease."
    supports: SUPPORT
    snippet: "Nearly half of the gluten-induced gene expression changes in CeD were associated with the epithelial interferon-γ response."
    explanation: Demonstrates that IFN-gamma signaling drives a major portion of the transcriptional changes underlying epithelial damage in celiac disease.
  - reference: PMID:15357947
    reference_title: "Coordinated induction by IL15 of a TCR-independent NKG2D signaling pathway converts CTL into lymphokine-activated killer cells in celiac disease."
    supports: SUPPORT
    snippet: "under conditions of dysregulated IL15 expression in vivo in patients with celiac disease and in vitro in healthy individuals, multiple steps of the NKG2D/DAP10 signaling pathway leading to ERK and JNK activation are coordinately primed to activate direct cytolytic function independent of TCR specificity in effector CD8 T cells"
    explanation: Shows how IL-15 converts intraepithelial CD8+ T cells into cytotoxic lymphokine-activated killer cells via NKG2D signaling, mediating epithelial damage.
  - reference: PMID:24942692
    reference_title: "IL-15: a central regulator of celiac disease immunopathology."
    supports: SUPPORT
    snippet: "the upregulation of IL-15 expression in the intestinal mucosa has become a hallmark of the disease"
    explanation: Identifies IL-15 upregulation as a defining feature of celiac disease that drives intraepithelial lymphocyte expansion and epithelial injury.
  - reference: PMID:15357948
    reference_title: "A direct role for NKG2D/MICA interaction in villous atrophy during celiac disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "MICA is strongly expressed at epithelial cell surface in patients with active disease and is induced by gliadin or its p31-49 derived peptide upon in vitro challenge, an effect relayed by IL-15"
    explanation: >-
      Supplies the missing step between IL-15 and enterocyte killing: gliadin
      induces the NKG2D ligand MICA on the epithelium through IL-15, which is
      what licenses intraepithelial lymphocyte cytotoxicity against enterocytes.
      Graded IN_VITRO because MICA induction was shown by in vitro challenge of
      patient tissue.
  - reference: PMID:33920345
    reference_title: "Small and Large Intestine (I): Malabsorption of Nutrients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "persistent villous atrophy despite a strict GFD longer than one year that leads to concomitant symptoms such as diarrhea, steatorrhea, abdominal pain, weight loss, and/or nutritional deficiencies"
    explanation: >-
      Ties persistent villous atrophy to the malabsorptive clinical
      consequences, which is the step from this node to the nutrient
      malabsorption node downstream of it.
  - reference: PMID:38914866
    reference_title: "Transcriptomic analysis of intestine following administration of a transglutaminase 2 inhibitor to prevent gluten-induced intestinal damage in celiac disease."
    supports: SUPPORT
    snippet: "ZED1227 treatment preserved transcriptome signatures associated with mucosal morphology, inflammation, cell differentiation and nutrient absorption to the level of the gluten-free diet group."
    explanation: Provides interventional evidence that blocking TG2-mediated T cell activation prevents the downstream epithelial damage, villous atrophy, and malabsorption.
  downstream:
  - target: Villous Atrophy
    causal_link_type: DIRECT
    description: >-
      Villous atrophy is the histologic expression of this node: cytotoxic
      killing of enterocytes with crypt hyperplasia shortens the villi, which is
      what the biopsy reports as a reduced villus-height to crypt-depth ratio.
    evidence:
    - reference: PMID:34192430
      reference_title: "A Randomized Trial of a Transglutaminase 2 Inhibitor for Celiac Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with ZED1227 at all three dose levels attenuated gluten-induced duodenal mucosal injury."
      explanation: >-
        Interventional human evidence that blocking the upstream cascade
        attenuates the loss of villus-height/crypt-depth ratio - the causal link
        between the epithelial-damage mechanism and the histologic phenotype.
  - target: Generalized Nutrient Malabsorption
    causal_link_type: DIRECT
    description: >-
      Enterocyte loss and villous shortening reduce the absorptive surface area
      and the brush-border transport capacity of the proximal small intestine,
      which is the proximate cause of malabsorption.
    evidence:
    - reference: PMID:33920345
      reference_title: "Small and Large Intestine (I): Malabsorption of Nutrients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "celiac disease is the most common example of a malabsorptive condition"
      explanation: >-
        Places celiac enteropathy as the prototypical malabsorptive condition in
        a review of malabsorption mechanisms, which is what makes the
        malabsorption node the direct consequence of this one rather than a
        generic downstream state.
  - target: Aberrant Clonal Intraepithelial Lymphocyte Expansion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained IL-15-rich mucosal signaling in a chronically injured epithelium
      selects for intraepithelial lymphocyte clones that lose normal dependence
      on their activating signals. The selection pressure is inferred from the
      clinical sequence (uncomplicated disease preceding refractory disease type
      II) rather than demonstrated prospectively, so the edge is indirect.
    evidence:
    - reference: PMID:33579790
      reference_title: "Oncogenetic landscape of lymphomagenesis in coeliac disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "often preceded by low-grade clonal intraepithelial lymphoproliferation, referred to as type II refractory CeD (RCDII)"
      explanation: >-
        Establishes the clonal intraepithelial lymphocyte expansion as the
        intermediate step between celiac enteropathy and lymphoma, which is what
        this edge places downstream of the epithelial-damage node.
- name: Generalized Nutrient Malabsorption
  biological_scale: ORGANISM
  description: >-
    Loss of absorptive surface area and brush-border transport capacity in the
    proximal small intestine produces defective mucosal absorption of
    macronutrients, iron, folate, vitamin B12, zinc and the fat-soluble
    vitamins. This is the convergence point through which most of the
    non-gastrointestinal manifestations of celiac disease are produced: it is
    the node the nutrient-deficiency, growth, bone and anemia branches all pass
    through. Deficiencies are not proportional to histologic grade - one
    newly-diagnosed adult cohort found vitamin and mineral deficiencies were
    not associated with the degree of intestinal damage - so the magnitude of
    this node is not read off the biopsy.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  biological_processes:
  - preferred_term: intestinal absorption
    term:
      id: GO:0050892
      label: intestinal absorption
    modifier: DECREASED
  evidence:
  - reference: PMID:24084055
    reference_title: "Vitamin and mineral deficiencies are highly prevalent in newly diagnosed celiac disease patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Almost all CD-patients (87%) had at least one value below the lower limit of reference."
    explanation: >-
      Establishes the node quantitatively in 80 newly diagnosed untreated adults:
      zinc deficiency in 67%, decreased iron stores in 46%, anemia in 32%, folate
      20%, B12 19%.
  - reference: PMID:24084055
    reference_title: "Vitamin and mineral deficiencies are highly prevalent in newly diagnosed celiac disease patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitamin/mineral deficiencies were counter-intuitively not associated with a (higher) grade of histological intestinal damage or (impaired) nutritional status."
    explanation: >-
      Bounds the node: the deficiency burden does not track histologic severity,
      so this node's magnitude cannot be inferred from the biopsy grade of the
      epithelial-damage node upstream of it.
  downstream:
  - target: Chronic Diarrhea
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Unabsorbed solute raises the luminal osmotic load, fat and bile salts
      reaching the colon are converted by bacteria into cathartic hydroxy-fatty
      acids, and electrolyte secretion increases; together these raise stool
      water. The individual contributions of the osmotic, fatty-acid, bile-acid
      and secretory routes have not been partitioned in celiac cohorts, so the
      edge is recorded as indirect.
    evidence:
    - reference: PMID:33920345
      reference_title: "Small and Large Intestine (I): Malabsorption of Nutrients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "persistent villous atrophy despite a strict GFD longer than one year that leads to concomitant symptoms such as diarrhea, steatorrhea, abdominal pain, weight loss, and/or nutritional deficiencies"
      explanation: >-
        Links the malabsorptive state to diarrhea and steatorrhea in celiac
        disease specifically, in the review that also describes the osmotic and
        cathartic mechanisms behind it.
  - target: Weight Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Macronutrient malabsorption and steatorrhea create a negative energy
      balance. Reduced intake and inflammatory anorexia contribute in parallel
      and have not been separated from the absorptive loss, and a normal or
      raised body mass index does not exclude active disease.
    evidence:
    - reference: PMID:24084055
      reference_title: "Vitamin and mineral deficiencies are highly prevalent in newly diagnosed celiac disease patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Overall, 17% were malnourished (>10% undesired weight loss)"
      explanation: >-
        Quantifies the weight-loss outcome in untreated newly diagnosed adults,
        in the same cohort that documents the malabsorptive deficiencies
        upstream of it.
  - target: Iron Deficiency Anemia
    causal_link_type: DIRECT
    description: >-
      Iron is absorbed principally in the proximal duodenum, which is the
      segment celiac disease destroys, so iron malabsorption and store depletion
      follow directly from the lesion's location. Menstrual or occult blood loss
      and inflammatory hepcidin-mediated restriction can coexist.
    evidence:
    - reference: PMID:34067622
      reference_title: "Iron Deficiency Anemia in Celiac Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This portion of the intestine is typically destroyed in celiac disease (CD), resulting in a reduction in absorption of iron and subsequent iron deficiency anemia (IDA)."
      explanation: >-
        States the anatomical coincidence that makes this edge direct - the
        principal site of iron absorption is the site of the lesion - and reports
        iron deficiency anemia as the most frequent extraintestinal
        manifestation, at 12-82% at diagnosis.
  - target: Vitamin D Deficiency
    causal_link_type: DIRECT
    description: >-
      Fat malabsorption and reduced absorptive area impair uptake of the
      fat-soluble vitamins, vitamin D among them. Low dietary intake and limited
      sunlight exposure contribute independently, and deficiency can persist on
      a gluten-free diet.
    evidence:
    - reference: PMID:28722929
      reference_title: "Celiac Disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "malabsorption of essential nutrients, including micronutrients, fat-soluble vitamins, iron, vitamin B12, and folate"
      explanation: >-
        Names fat-soluble vitamin malabsorption as a consequence of the mucosal
        damage, which is the absorptive route this edge asserts.
    - reference: PMID:10071918
      reference_title: "Osteoporosis in adult patients with celiac disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A low 25-(OH)D vitamin concentration was a typical biochemical abnormality in our patients (64% of men and 71% of women)"
      explanation: >-
        Measures the resulting deficiency in an adult celiac cohort, which is the
        endpoint of this edge: low 25-hydroxyvitamin D in roughly two thirds of
        patients.
  - target: Growth Failure in Children
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic energy, protein and micronutrient malabsorption in a growing child
      produces malnutrition and impaired weight gain, and malnutrition with
      chronic inflammation suppresses the growth-hormone/IGF-1 axis. The
      endocrine step is inferred rather than demonstrated in celiac cohorts, and
      socioeconomic nutrition and diagnostic delay modify the outcome, so the
      edge is indirect.
    evidence:
    - reference: PMID:39334575
      reference_title: "Growth Stunting and Nutritional Deficiencies among Children and Adolescents with Celiac Disease in Kuwait: A Case-Control Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Approximately one-third (31%) of children with CD had stunted growth, 20.8% had a low body mass index for their age, and 5.2% had both growth stunting and wasting."
      explanation: >-
        Case-control evidence pairing the growth outcome with the nutritional
        deficits in the same pediatric celiac population, which is the
        association this edge asserts a route for. The same study found growth
        stunting predicted by serum ferritin alongside maternal education and
        family income, which is why the edge records socioeconomic nutrition as
        a parallel contributor rather than asserting a purely absorptive route.
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Short stature is the accumulated outcome of the same growth-failure branch
      once reduced linear growth velocity has persisted. Familial short stature,
      endocrine disease and failure of catch-up growth after treatment are
      separate explanations that this edge does not displace.
    evidence:
    - reference: PMID:39334575
      reference_title: "Growth Stunting and Nutritional Deficiencies among Children and Adolescents with Celiac Disease in Kuwait: A Case-Control Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A significant proportion of children and adolescents with CD had malnutrition, overt deficiencies, and impaired growth despite coherence with a gluten-free diet."
      explanation: >-
        The linear-growth endpoint in the same case-control cohort. Note the
        impairment persisted on a gluten-free diet, which is why this edge does
        not assert that catch-up growth follows treatment.
  - target: Secondary Hyperparathyroidism
    causal_link_type: DIRECT
    description: >-
      Calcium and vitamin D malabsorption lowers serum calcium and 25-hydroxy
      vitamin D, which raises parathyroid hormone secretion - the compensatory
      response that then drives skeletal resorption.
    evidence:
    - reference: PMID:36904090
      reference_title: "Osteoporosis and Celiac Disease: Updates and Hidden Pitfalls."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hyperparathyroidism is frequent and should be sought in newly diagnosed patients as it is responsible for accelerating bone turnover"
      explanation: >-
        States the parathyroid step directly and reports it as frequent at
        diagnosis, which is what places this node downstream of the malabsorptive
        calcium and vitamin D deficit.
    - reference: PMID:24290593
      reference_title: "Pathologic bone alterations in celiac disease: etiology, epidemiology, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two main mechanisms are involved: intestinal malabsorption and chronic inflammation"
      explanation: >-
        Names intestinal malabsorption as one of the two mechanisms of celiac
        bone disease, which is the branch this edge represents. The review does
        not itself mention parathyroid hormone, so the parathyroid step rests on
        the companion citation rather than on this one.
- name: Secondary Hyperparathyroidism
  biological_scale: ORGANISM
  description: >-
    Calcium and vitamin D malabsorption lowers serum calcium, and the
    compensatory rise in parathyroid hormone increases osteoclast-mediated bone
    resorption to defend the serum calcium concentration at the expense of the
    skeleton. This is the nutrient branch of celiac bone disease; the
    inflammatory RANKL/OPG branch acts on the same skeletal endpoint in
    parallel.
  biological_processes:
  - preferred_term: bone resorption
    term:
      id: GO:0045453
      label: bone resorption
    modifier: INCREASED
  evidence:
  - reference: PMID:36904090
    reference_title: "Osteoporosis and Celiac Disease: Updates and Hidden Pitfalls."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As blood Ca2+ concentration decreases, a rapid increase in PTH release promotes bone turnover and cortical bone loss."
    explanation: >-
      States this node's mechanism in full: falling serum calcium drives
      parathyroid hormone release, and the hormone accelerates bone turnover and
      cortical loss. This is the sentence the node rests on.
  - reference: PMID:24290593
    reference_title: "Pathologic bone alterations in celiac disease: etiology, epidemiology, and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The etiology of pathologic bone alterations in CD is multifactorial; however, two main mechanisms are involved: intestinal malabsorption and chronic inflammation."
    explanation: >-
      Establishes the two-branch structure of celiac bone disease, of which this
      node is the malabsorption branch. The review also presents the roles of
      calcium and its transport mechanisms.
  downstream:
  - target: Reduced Bone Mineral Density
    causal_link_type: DIRECT
    description: >-
      Parathyroid-hormone-driven osteoclastic resorption, together with impaired
      mineralization from the calcium and vitamin D deficit itself, lowers bone
      mineral density.
    evidence:
    - reference: PMID:36904090
      reference_title: "Osteoporosis and Celiac Disease: Updates and Hidden Pitfalls."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As blood Ca2+ concentration decreases, a rapid increase in PTH release promotes bone turnover and cortical bone loss."
      explanation: >-
        States this edge's claim: the parathyroid response accelerates bone
        turnover and produces cortical bone loss, which is the reduction in bone
        mineral density this edge targets.
    - reference: PMID:36904090
      reference_title: "Osteoporosis and Celiac Disease: Updates and Hidden Pitfalls."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The etiopathology of bone lesions in CD is multifactorial and other conditions, rather than mineral and vitamin D malabsorption, may affect skeletal health"
      explanation: >-
        Cited as the bound on this edge rather than as its mechanism: the same
        review records that contributors beyond mineral and vitamin D
        malabsorption affect skeletal health, which is why the edge does not
        claim the parathyroid route is the only one.
  - target: Osteoporosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained remodeling imbalance carries low bone mineral density through to
      osteoporosis and fragility. Age, sex hormones, low body mass index and
      primary osteoporosis modify the threshold, and bone density does not
      always normalize on a gluten-free diet, so the edge is indirect.
    evidence:
    - reference: PMID:24290593
      reference_title: "Pathologic bone alterations in celiac disease: etiology, epidemiology, and treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Low bone mineral density (BMD), osteopenia, and osteoporosis are frequent complications of celiac disease (CD)."
      explanation: >-
        Places osteoporosis at the end of the same continuum as low bone mineral
        density in celiac disease, which is the progression this edge records.
- name: Aberrant Clonal Intraepithelial Lymphocyte Expansion
  biological_scale: CELLULAR
  description: >-
    Chronic IL-15-rich signaling in the damaged epithelium selects intraepithelial
    lymphocyte clones that acquire JAK1 and STAT3 gain-of-function mutations,
    giving them cytokine-independent survival and proliferative fitness. The
    clinical counterpart is refractory celiac disease type II, a low-grade clonal
    intraepithelial lymphoproliferation that commonly precedes
    enteropathy-associated T-cell lymphoma. This is the mechanism through which
    the neoplastic risk of celiac disease is realized, and it is also why the
    risk is concentrated in patients whose mucosa does not heal.
  cell_types:
  - preferred_term: intraepithelial lymphocyte
    term:
      id: CL:0002496
      label: intraepithelial lymphocyte
  biological_processes:
  - preferred_term: cell surface receptor signaling pathway via JAK-STAT
    term:
      id: GO:0007259
      label: cell surface receptor signaling pathway via JAK-STAT
    modifier: GAIN_OF_FUNCTION
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  evidence:
  - reference: PMID:33579790
    reference_title: "Oncogenetic landscape of lymphomagenesis in coeliac disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "often preceded by low-grade clonal intraepithelial lymphoproliferation, referred to as type II refractory CeD (RCDII)"
    explanation: >-
      Establishes refractory celiac disease type II as the clonal
      intraepithelial-lymphocyte stage standing between celiac enteropathy and
      lymphoma.
  downstream:
  - target: Small intestinal lymphoma
    causal_link_type: DIRECT
    description: >-
      Clones carrying JAK1/STAT3 gain-of-function lesions, with cooperating
      NF-kB and epigenetic changes, expand to overt enteropathy-associated
      T-cell lymphoma. JAK1 inhibition blocked survival and proliferation of
      malignant refractory-disease cells in vitro, which is direct functional
      support for the driver role of this step. Some lymphomas arise without a
      recognized refractory-disease stage, and other small-intestinal lymphomas
      have different causal wiring.
    evidence:
    - reference: PMID:33579790
      reference_title: "Oncogenetic landscape of lymphomagenesis in coeliac disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We demonstrate the outstanding frequency of JAK1 and STAT3 gain-of-function (GOF) mutations but also reveal the frequent occurrence of deleterious mutations in negative regulators of NF-κB and in several epigenetic regulators, thus revealing candidate targets for therapeutic intervention."
      explanation: >-
        The driver landscape this edge turns on, from whole-exome and targeted
        sequencing of refractory-disease and lymphoma biopsies: the
        JAK1/STAT3 gain-of-function lesions plus the cooperating NF-kB and
        epigenetic changes named in the edge description.
    - reference: PMID:33579790
      reference_title: "Oncogenetic landscape of lymphomagenesis in coeliac disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "JAK1 inhibitors, and the proteasome inhibitor bortezomib could block survival and proliferation of malignant RCDII-cell lines."
      explanation: >-
        Functional support for the driver role rather than mere association:
        blocking the pathway blocks survival and proliferation of the malignant
        clone. Graded IN_VITRO because the perturbation was performed on
        refractory-disease cell lines.
- name: Autoantibody Production
  description: >
    B cells produce antibodies against tTG (anti-tTG IgA) and
    deamidated gliadin peptides (anti-DGP). These serve as diagnostic
    markers and may contribute to pathology.
  cell_types:
  - preferred_term: Plasma Cell
    term:
      id: CL:0000786
      label: plasma cell
  evidence:
  - reference: PMID:18803427
    reference_title: "Celiac disease: risk assessment, diagnosis, and monitoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The serum levels of immunoglobulin (Ig)A anti-tissue transglutaminase (or TG2) are the first choice in screening for celiac disease, displaying the highest levels of sensitivity (up to 98%) and specificity (around 96%)."
    explanation: Documents IgA anti-tissue transglutaminase (anti-tTG/TG2) autoantibodies as the primary celiac serological marker, supporting B-cell/plasma-cell autoantibody production against tTG; the same review reports deamidated gliadin peptide (DGP) antibodies as an additional marker.
  - reference: PMID:27352981
    reference_title: "Seronegative celiac disease: Shedding light on an obscure clinical entity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fourteen fulfilled the diagnostic criteria for seronegative celiac disease based on antibody negativity, villous atrophy, HLA-DQ2/-DQ8 positivity and clinical/histological improvement after gluten free diet"
    explanation: >-
      Bounds the autoantibody node. A small minority of patients develop villous
      atrophy that remits on a gluten-free diet with no detectable serum
      antibodies, so the humoral arm is a near-universal accompaniment and
      diagnostic handle rather than a required step for enteropathy. The study
      used HLA typing and diet response as inclusion criteria and did not measure
      gluten-specific T cells, so it does not itself demonstrate that the T-cell
      pathway is intact in these patients.
  downstream:
  - target: Dermatitis Herpetiformis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The humoral response spreads from TG2 to the related epidermal enzyme
      transglutaminase 3 (TG3), and patients with dermatitis herpetiformis carry
      an antibody population specific for TG3 with markedly higher avidity for
      it than for TG2. The granular IgA precipitates that define the skin lesion
      contain TG3, so the antigen and the deposit are established. The terminal
      sequence - immune-complex deposition in dermal papillae, complement and
      endothelial activation, neutrophil recruitment and protease-mediated
      injury at the dermal-epidermal junction - is the part not fully
      demonstrated, and dermal IgA deposits can occur without clinical disease,
      so the edge is recorded as indirect.
    evidence:
    - reference: PMID:11901200
      reference_title: "Epidermal transglutaminase (TGase 3) is the autoantigen of dermatitis herpetiformis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the IgA precipitates in the papillary dermis of patients with dermatitis herpetiformis, the defining signs of the disease, contain epidermal transglutaminase, but not tissue transglutaminase or keratinocyte transglutaminase"
      explanation: >-
        Identifies the antigen inside the lesion-defining deposit, which is what
        makes this a specific route from the autoantibody node to this
        phenotype rather than a shared-susceptibility association. The same
        study shows dermatitis herpetiformis patients have a TG3-specific
        antibody population with higher avidity for TG3 than for TG2.
  - target: Female infertility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Anti-TG2 antibodies from untreated patients bind TG2 on the
      maternal-facing syncytiotrophoblast and inhibit its local activity, and in
      primary human trophoblasts they reduce invasiveness and matrix
      metalloprotease activity and increase apoptosis — the proposed route from
      the humoral arm to impaired implantation and placentation.
      Epidemiologically, the excess of adverse reproductive outcomes is
      confined to undiagnosed disease and attenuates after diagnosis and
      gluten-free diet, tying the phenotype to disease activity. Mechanism
      attribution remains contested: malabsorption-related nutrient deficiency
      and systemic inflammation are credible parallel contributors, and the
      antibody evidence is from human tissue and cell systems with no in vivo
      perturbation in women, so the edge is recorded as indirect. How much weight
      that tissue-level and cell-level work can carry is itself unsettled in the
      literature, which is why the chain is placed no more strongly than
      indirect.
    evidence:
    - reference: PMID:19228395
      reference_title: "Maternal celiac disease autoantibodies bind directly to syncytiotrophoblast and inhibit placental tissue transglutaminase activity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data indicate that direct immune effects in untreated CD women may compromise placental function."
      explanation: >-
        Celiac IgA bound the maternal-facing syncytiotrophoblast surface
        significantly more than control IgA, staining was reduced by
        pre-absorption with recombinant TG2, and bound IgA inhibited local
        transglutaminase activity — direct human placental-tissue evidence for
        the antibody arm of this edge. Graded IN_VITRO because the binding and
        activity assays were performed on placental tissue ex vivo.
    - reference: PMID:20571491
      reference_title: "Anti-tissue transglutaminase antibodies from celiac patients are responsible for trophoblast damage via apoptosis in vitro."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the binding of anti-tTG antibodies to trophoblast might represent a key mechanism by which the embryo implantation and pregnancy outcome are impaired in untreated celiac pregnant women"
      explanation: >-
        Primary human trophoblasts exposed to anti-TG2 IgG, including IgG from
        untreated celiac women, showed impaired invasiveness, decreased matrix
        metalloprotease activity and increased apoptosis — the functional
        counterpart of the binding shown by the placental study.
    - reference: PMID:36593803
      reference_title: "Adverse pregnancy outcomes in women with celiac disease: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The subgroup analysis demonstrated that only undiagnosed CD increased risk for fetal growth restriction, stillbirth, preterm delivery and lower mean birthweight, whereas early diagnosis of CD was not linked to any adverse pregnancy outcomes."
      explanation: >-
        Cited for one thing only: the excess risk falls on undiagnosed disease
        and not on early-diagnosed disease, which is the disease-activity
        dependence this edge asserts. The outcomes measured are pregnancy
        outcomes — fetal growth restriction, stillbirth, preterm delivery,
        birthweight — not conception failure, so this item does not evidence the
        infertility endpoint itself, and it does not distinguish the antibody
        route from nutritional or inflammatory contributions.
- name: Barrier Dysfunction
  description: >
    Increased intestinal permeability allows greater gluten peptide
    translocation. Zonulin upregulation disrupts tight junctions.
  evidence:
  - reference: PMID:38914866
    reference_title: "Transcriptomic analysis of intestine following administration of a transglutaminase 2 inhibitor to prevent gluten-induced intestinal damage in celiac disease."
    supports: SUPPORT
    snippet: "ZED1227 treatment preserved transcriptome signatures associated with mucosal morphology, inflammation, cell differentiation and nutrient absorption to the level of the gluten-free diet group."
    explanation: TG2 inhibition preserves mucosal-morphology, differentiation and nutrient-absorption transcriptomic signatures — indirect support that mucosal/barrier integrity is downstream of gluten-driven immune activation. The specific zonulin/tight-junction mechanism in the node description is mechanistic context and is not directly established by this transcriptomic citation.
  downstream:
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reversible hepatocellular injury ("celiac hepatitis") is present in
      roughly a third to two-fifths of untreated patients and normalizes on a
      gluten-free diet in the large majority, so the hepatic injury tracks
      gluten-driven intestinal disease activity. The leading proposed route is
      the gut-liver axis: increased intestinal permeability delivering
      microbial products, antigens and cytokines to the liver through the
      portal circulation. The responsible portal mediator has not been
      identified in patients, and anti-TG2 deposition and systemic cytokines
      remain alternative contributors, so the edge is recorded as indirect.
    evidence:
    - reference: PMID:7657290
      reference_title: "Prevalence of hypertransaminasemia in adult celiac patients and effect of gluten-free diet."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "in adult celiac patients elevated serum transaminases are a frequent finding and normalize in most cases after GFD"
      explanation: >-
        158-patient adult cohort in which 67 (42%) had raised transaminases at
        diagnosis and 60 of the 67 (95%) normalized on a gluten-free diet — the
        dietary-withdrawal reversal that ties the hepatic injury causally to
        intestinal disease activity rather than to a coincident liver disease.
    - reference: PMID:23434875
      reference_title: "Pediatric celiac disease, cryptogenic hypertransaminasemia, and autoimmune hepatitis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A gluten-free diet normalized transaminase levels in 77% to 100% of patients with CD within 4 to 8 months"
      explanation: >-
        Pediatric meta-analysis reproducing the gluten-free-diet reversal of the
        transaminase elevation, supporting the same disease-activity-dependent
        hepatic injury in children.
    - reference: PMID:39796519
      reference_title: "Celiac Disease and Liver Damage: The Gut-Liver Axis Strikes Back (Again)? A Retrospective Analysis in the Light of a Literature Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Liver damage might be a consequence of the increased IP, which allows toxins, cytokines, and antigens to reach the liver via the portal circulation and cause liver injury through the release of pro-inflammatory mediators."
      explanation: >-
        States the permeability route this edge runs through, which is what
        grounds Barrier Dysfunction rather than another node as the source. The
        review's own framing is that these mechanisms "are still speculative",
        which is the reason the edge is indirect and the portal mediator is left
        unnamed.
- name: Microbiome Dysbiosis
  description: >
    Alterations in gut microbial composition and metabolic activity
    contribute to disease initiation and progression. Dysbiosis occurs
    in genetically at-risk individuals prior to disease onset, persists
    in active disease, and may not be fully restored by gluten-free diet.
    Dysbiosis impairs microbial-mediated gluten degradation, reduces
    production of short-chain fatty acids, and compromises intestinal
    barrier integrity and immune homeostasis.
  cell_types:
  - preferred_term: Intestinal Epithelial Cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  biological_processes:
  - preferred_term: Response to Bacterium
    term:
      id: GO:0009617
      label: response to bacterium
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:42386020
    reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gut microbiome has emerged as a key modulator of immune homeostasis, intestinal barrier integrity, and gluten metabolism, implicating microbial dysbiosis in both the initiation and progression of CD"
    explanation: The microbiome plays a key mechanistic role in disease pathogenesis through immune regulation, barrier function, and gluten degradation.
  - reference: PMID:42386020
    reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alterations in microbial composition and metabolic activity have been documented in genetically at-risk individuals prior to disease onset, in patients with active disease, and in treated patients on a GFD"
    explanation: Dysbiosis signatures appear early in disease development and persist despite treatment, suggesting dysbiosis as both an initiating and maintaining mechanism.
  - reference: PMID:42386020
    reference_title: "Decoding gut microbiome alterations in celiac disease: Implications for pathogenesis and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "accumulating evidence indicates that it does not consistently restore gut microbiome composition or function, and many patients experience persistent symptoms despite good dietary adherence"
    explanation: Gluten-free diet does not reliably restore dysbiotic microbiota, suggesting dysbiosis as a mechanism underlying persistent symptoms in diet-adherent patients.

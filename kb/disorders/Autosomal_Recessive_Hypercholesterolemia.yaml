- name: Extravascular Cholesterol Deposition
  biological_scale: ORGANISM
  description: >-
    Cholesterol accumulates in skin, tendons and the corneal periphery, producing distinct clinical stigmata.
    The 52-patient cohort recorded xanthomas in 47 patients; this generic endpoint does not provide a tendon-specific
    frequency. Lesion type and regression under treatment vary.

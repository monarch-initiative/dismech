- population: Sardinia and Sicily (Italian founder populations)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ULTRA_RARE
  notes: >-
    ARH is concentrated in Sardinia, where the mutated-allele frequency is high
    and two founder alleles (ARH1 and ARH2) explain most cases. Outside Sardinia
    it is extremely rare; in a Sicilian population survey the ARH1 allele
    frequency was 0.02% (carrier status ~1 in 2500).

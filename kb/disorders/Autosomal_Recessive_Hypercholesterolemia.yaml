- name: Polarized WIF-B hepatocytes
  experimental_model_type: CELL_LINE
  cell_source: Polarized WIF-B hepatocyte cell line with recombinant ARH domain constructs
  publication: PMID:16179341
  description: >-
    Domain perturbation tests the receptor-binding PTB domain and clathrin/AP-2 interactions needed for LDLR
    clustering and internalization.
  modeled_mechanisms:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      ARH PTB integrity and at least one clathrin/AP-2 interaction are required for clustering and internalization.
    limitations: >-
      Engineered cell system; abstract-only access limits detailed protocol assessment.
    evidence:
    - reference: PMID:16179341
      reference_title: The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        The phosphotyrosine binding domain of ARH plus either the clathrin box or the AP-2 binding region were
        required for both clustering and internalization of the LDLR.
      explanation: >-
        Domain perturbation in polarized cells.
- name: Primary Arh-knockout mouse hepatocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Fresh primary hepatocytes from Arh- and Ldlr-knockout and control mice
  publication: PMID:17200716
  description: >-
    Short-term culture distinguishes LDL and beta-VLDL uptake. Additional LRP deletion and heparinase experiments
    did not abolish preserved beta-VLDL uptake; high-affinity antibody binding or LDL aggregation alone did
    not reproduce it.
  modeled_mechanisms:
  - target: Preserved Hepatic VLDL Remnant Uptake
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      ARH-deficient hepatocytes internalize beta-VLDL whereas LDLR-deficient cells do not.
    limitations: >-
      Ligand preparation and culture duration can change assay behavior; the precise ARH-independent entry
      machinery remains unresolved.
    evidence:
    - reference: PMID:17200716
      reference_title: Disruption of LDL but not VLDL clearance in autosomal recessive hypercholesterolemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Consistent with these findings, hepatocytes from Arh(-/-) mice (but not Ldlr(-/-) mice) internalized
        beta-migrating VLDL (beta-VLDL).
      explanation: >-
        Isolated hepatocyte experiment, not an in-vivo uptake measurement.
    readouts:
    - name: Beta-VLDL internalization relative to Ldlr knockout
      target: Preserved Hepatic VLDL Remnant Uptake
      direction: INCREASED
      description: >-
        ARH-deficient hepatocytes internalize beta-VLDL whereas LDLR-deficient cells do not.
      evidence:
      - reference: PMID:17200716
        reference_title: Disruption of LDL but not VLDL clearance in autosomal recessive hypercholesterolemia.
        supports: SUPPORT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: >-
          Consistent with these findings, hepatocytes from Arh(-/-) mice (but not Ldlr(-/-) mice) internalized
          beta-migrating VLDL (beta-VLDL).
        explanation: >-
          Isolated hepatocyte experiment, not an in-vivo uptake measurement.
- name: Patient skin fibroblasts with DAB2 depletion
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Cultured skin fibroblasts from ARH patients and controls, with DAB2 siRNA and murine DAB2 rescue
  publication: PMID:17761685
  description: >-
    Baseline LDLR activity is preserved. DAB2 depletion reduces receptor protein and uptake selectively in
    ARH cells, without reduced LDLR mRNA; murine DAB2 rescues the phenotype. Pulse labeling favors altered
    protein synthesis, but unblocked degradation is not completely excluded. This does not directly demonstrate
    DAB2 compensation solely at endocytosis.
  evidence:
  - reference: PMID:17761685
    reference_title: Adaptor protein disabled-2 modulates low density lipoprotein receptor synthesis in fibroblasts from patients with autosomal recessive hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      SiRNA-depletion of Dab2 profoundly reduced LDL-receptor activity in ARH fibroblasts as a result of profound
      reduction in LDL-receptor protein, but not mRNA; heterologous expression of murine Dab2 reversed this
      effect.
    explanation: >-
      Protein loss confounds an interpretation as a pure internalization defect.
discussions:
- discussion_id: arh_dab2_cell_context
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: What permits fibroblast LDL uptake when LDLRAP1 is absent?
  attaches_to:
  - pathophysiology#Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
  - experimental_models#Patient skin fibroblasts with DAB2 depletion
  rationale: >-
    DAB2 abundance differs between fibroblasts and lymphocytes. However, DAB2 depletion in patient fibroblasts
    reduced receptor protein itself, so the experiment cannot isolate redundant endocytosis. A translation-related
    role was proposed; altered degradation outside the tested pathways remains possible. HeLa double-depletion
    results cannot substitute for patient-fibroblast behavior.
  evidence:
  - reference: url:https://oup.silverchair-cdn.com/article-minimal/582819
    reference_title: "https://oup.silverchair-cdn.com/article-minimal/582819"
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Clearly, our original intention to determine whether or not Dab2 facilitates LDL-receptor internalization
      in ARH fibroblasts was not possible from our data.
    explanation: >-
      The authors explicitly limit the mechanistic inference.
- discussion_id: arh_remnant_entry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which machinery supports ARH-independent VLDL-remnant uptake and how much does it modify human disease?
  attaches_to:
  - pathophysiology#Preserved Hepatic VLDL Remnant Uptake
  rationale: >-
    Mouse and isolated-hepatocyte experiments establish retained LDLR-dependent remnant uptake. Simple ligand
    affinity or clustering and the tested LRP/heparan-sulfate alternatives do not explain it. One human kinetic
    study supports increased direct remnant removal, but cannot establish its contribution across LDLRAP1 genotypes
    or treatment responses.
  evidence:
  - reference: PMID:22157599
    reference_title: "Altered metabolism of low-density lipoprotein and very-low-density lipoprotein remnant in autosomal recessive hypercholesterolemia: results from stable isotope kinetic study in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast, the direct removal of very-low-density lipoprotein remnant was significantly greater in
      ARH than those in control subjects (47.5 versus 2±2%).
    explanation: >-
      One patient versus seven controls; does not define a population-wide fraction.
clinical_trials:
- name: NCT00730236
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed single-arm phase III lomitapide study in 29 adults with clinical or functional HoFH. Stable background
    therapy was maintained through week 26; mean LDL-C reduction was 50%. The trial supports class-level efficacy
    and safety monitoring, not a separately estimated LDLRAP1 treatment effect. Eligibility allowed causative
    functional alleles and did not require an abnormal fibroblast assay in every participant.
  notes: >-
    Phase, completion status, enrollment and eligibility checked against the ClinicalTrials.gov API on 2026-09-23.
    The cached registry excerpt contains the stated objectives.
  evidence:
  - reference: clinicaltrials:NCT00730236
    reference_title: A Phase III Study of Microsomal Triglyceride Transfer Protein (MTP) Inhibitor AEGR-733 in Patients With Homozygous Familial Hypercholesterolemia on Current Lipid-lowering Therapy
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      The goal of this trial is to study the effects of AEGR-733 on LDL cholesterol, other lipids as well as
      measures of safety over the long-term.
    explanation: >-
      Registry objective; published results are distinguished from planned endpoints.
  - reference: PMID:23122768
    reference_title: "Efficacy and safety of a microsomal triglyceride transfer protein inhibitor in patients with homozygous familial hypercholesterolaemia: a single-arm, open-label, phase 3 study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mean LDL-C decreased from 8·69 ± 2·95 mmol/L at baseline to 4·34 ± 2·48 mmol/L) at the end of the efficacy
      phase (week 26), a statistically significant percent change from baseline (−50%, 95% CI −62, −39, p<0·001)
      (table 1 and figure 1).
    explanation: >-
      Pooled HoFH phase III result; this is not an LDLRAP1-specific estimate.
- name: NCT03399786
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed randomized placebo-controlled phase III ELIPSE trial in 65 patients aged at least 12 years with
    HoFH on stable therapy. At 24 weeks, evinacumab lowered LDL-C 47.1%, versus a 1.9% increase on placebo.
    These are pooled HoFH results, not an ARH-specific effect size.
  notes: >-
    Phase, completion status, enrollment and eligibility checked against the ClinicalTrials.gov API on 2026-09-23.
    The cached registry excerpt contains the stated objectives.
  evidence:
  - reference: clinicaltrials:NCT03399786
    reference_title: "A Randomized, Double-blind, Placebo-controlled, Parallel-group Study to Evaluate the Efficacy and Safety of Evinacumab in Patients With Homozygous Familial Hypercholesterolemia"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      The primary objective of the study is to demonstrate the reduction of low-density lipoprotein cholesterol
      (LDL-C) by evinacumab intravenously (IV) in comparison to placebo after 24 weeks in patients with homozygous
      familial hypercholesterolemia (HoFH).
    explanation: >-
      Registry objective; published results are distinguished from planned endpoints.
  - reference: PMID:32813947
    reference_title: Evinacumab for Homozygous Familial Hypercholesterolemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At week 24, patients in the evinacumab group had a relative reduction from baseline in the LDL cholesterol
      level of 47.1%, as compared with an increase of 1.9% in the placebo group,
    explanation: >-
      Pooled randomized HoFH result; does not isolate the ARH response.
- name: NCT03409744
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed open-label phase III long-term evinacumab study, with 116 participants aged at least 12 years.
    The 2026 analysis identifies two LDLRAP1 participants among 55 with identical biallelic LDLR or LDLRAP1
    variants. Reported week-8 and week-104 subgroup reductions combine both genes and cannot quantify the LDLRAP1-specific
    response.
  notes: >-
    Phase, completion status, enrollment and eligibility checked against the ClinicalTrials.gov API on 2026-09-23.
    The cached registry excerpt contains the stated objectives.
  evidence:
  - reference: clinicaltrials:NCT03409744
    reference_title: An Open-Label Study to Evaluate the Long-Term Safety and Efficacy of Evinacumab in Patients With Homozygous Familial Hypercholesterolemia
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: >-
      To evaluate the long-term safety and tolerability of evinacumab in patients with Homozygous Familial
      Hypercholesterolemia (HoFH)
    explanation: >-
      Registry objective; published results are distinguished from planned endpoints.
  - reference: PMID:41671678
    reference_title: "Efficacy of evinacumab by genotype and low-density lipoprotein receptor function in patients with homozygous familial hypercholesterolaemia: A subanalysis from the ELIPSE open-label extension study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      At baseline, 55 (47.4%) had either identical bi-allelic variants in LDLR (n = 53) or LDLRAP1 (n = 2),
      and 41 (35.3%) had different bi-allelic LDLR variants.
    explanation: >-

notes: >
  Scope and lump/split: curated as a standalone Disease (entry_type DISEASE, claim
  issue #10721) rather than folded into the dominant FH entries. ARH is a distinct
  recessive Mendelian entity (MONDO:0011374, OMIM:603813), caused by a different
  gene (LDLRAP1) acting by a different mechanism (loss of the adaptor that couples
  a structurally normal LDL receptor to clathrin-mediated endocytosis) from the
  receptor-side (LDLR), ligand-side (APOB) and PCSK9 dominant forms. It is
  referenced only in passing in the dominant-FH entries; this entry curates its
  mechanism graph in full. The relationship to the FH umbrella is recorded via
  parents (Familial Hypercholesterolemia).

  Deep-research note: the standard `just research-disorder claude_code` run for
  this disorder could not complete a written report - the shared build host root
  filesystem was at 100% capacity (a sibling curation session was running its own
  deep-research at the same time) and the report write failed with ENOSPC. In
  place of the automated report, a manual PubMed sweep was performed (E-utilities
  esearch/esummary) and every cited reference was fetched with
  `just fetch-reference` and quoted from its cached abstract or full text. The
  fallback and the reference set are recorded in
  research/Autosomal_Recessive_Hypercholesterolemia-deep-research-claude_code.md.

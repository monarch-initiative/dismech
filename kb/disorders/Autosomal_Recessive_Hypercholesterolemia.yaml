pathophysiology:
- name: Biallelic LDLRAP1 Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound-heterozygous loss-of-function variants in LDLRAP1 at
    1p35, the causal lesion of ARH. The gene encodes the LDL receptor adaptor
    protein (ARH). Causative alleles are heterogeneous but are all predicted to be
    loss-of-function, and the Sardinian founder alleles ARH1 and ARH2 account for
    most reported cases.
  genes:
  - preferred_term: LDLRAP1
    term:
      id: hgnc:18640
      label: LDLRAP1
  genetic_context:
    gene:
      preferred_term: LDLRAP1
      term:
        id: hgnc:18640
        label: LDLRAP1
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic loss-of-function is required; heterozygotes are unaffected. Recorded
      on the genetic context because the claim is about the consequence of the
      alleles. Compound-heterozygous genotypes are also seen; HOMOZYGOUS is used
      here for the common founder-allele case.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35 and identify six mutations in a gene encoding a putative adaptor protein (ARH)."
    explanation: The founding paper that maps ARH to 1p35 and identifies causative mutations in the adaptor gene.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is inherited as a recessive trait and causative mutations, though heterogeneous, are all predicted to be loss-of-function."
    explanation: States that the heterogeneous causative alleles are uniformly loss-of-function.
  downstream:
  - target: Loss of ARH Adaptor Bridging of the LDL Receptor to Clathrin
    causal_link_type: DIRECT
    description: >-
      Loss-of-function alleles abolish or cripple the ARH adaptor protein, so it
      can no longer bridge the LDL receptor to the clathrin machinery.
    evidence:
    - reference: PMID:11326085
      reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ARH contains a phosphotyrosine binding (PTB) domain, which in other proteins binds NPXY motifs in the cytoplasmic tails of cell-surface receptors, including the LDLR."
      explanation: Identifies the PTB domain that binds the LDL receptor tail, the function lost when the gene is mutated.
- name: Loss of ARH Adaptor Bridging of the LDL Receptor to Clathrin
  biological_scale: MOLECULAR
  description: >-
    The ARH protein normally uses its PTB domain to bind the FDNPVY / NPxY motif
    in the LDL receptor cytoplasmic tail, and separate clathrin-box and AP-2
    binding regions to tether the bound receptor to clathrin and AP-2. When ARH
    is lost, this molecular bridge is absent. Crucially the LDL receptor protein
    itself is intact and normally expressed - the defect is in the cytosolic
    adaptor, not the receptor.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: clathrin-cargo adaptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0035615
      label: clathrin-cargo adaptor activity
  - preferred_term: low-density lipoprotein particle receptor binding
    modifier: DECREASED
    term:
      id: GO:0050750
      label: low-density lipoprotein particle receptor binding
  evidence:
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The disease is caused by mutations in ARH, which encodes a putative adaptor protein that interacts with the cytoplasmic tail of the LDLR, phospholipids, and two components of the clathrin endocytic machinery, clathrin and adaptor protein-2 (AP-2) in vitro."
    explanation: Establishes the adaptor's three binding partners - the receptor tail, clathrin, and AP-2 - whose bridging is lost in ARH.
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The phosphotyrosine binding domain of ARH plus either the clathrin box or the AP-2 binding region were required for both clustering and internalization of the LDLR."
    explanation: Defines the domain requirements for the bridging function, the LOSS_OF_FUNCTION captured by this node.
  downstream:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    causal_link_type: DIRECT
    description: >-
      Without the ARH bridge, the LDL receptor is not clustered into clathrin-coated
      pits and is not internalized.
    evidence:
    - reference: PMID:16179341
      reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results demonstrate that ARH must bind the LDLR tail and either clathrin or AP-2 to promote receptor clustering and internalization of LDL."
      explanation: Directly links loss of ARH bridging to failure of receptor clustering and internalization.
- name: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
  biological_scale: CELLULAR
  description: >-
    In hepatocytes, LDL-bound receptor fails to cluster into clathrin-coated pits
    and is not internalized. The defect is cell-type specific: LDL receptor
    endocytosis is impaired in the liver but not in fibroblasts, where the
    redundant adaptor Dab2 substitutes for ARH. This tissue specificity is the
    signature of ARH and explains why the systemic LDL clearance defect is driven
    by the hepatic compartment even though the receptor is normal everywhere.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: clathrin-dependent endocytosis
    modifier: DECREASED
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
  - preferred_term: receptor-mediated endocytosis
    modifier: DECREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Autosomal recessive hypercholesterolemia is characterized by a cell type-specific defect in low density lipoprotein receptor (LDLR) endocytosis."
    explanation: States that the endocytic defect itself is the cellular lesion of ARH.
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ARH appears to have a tissue-specific role in LDLR function, as it is required in liver but not in fibroblasts."
    explanation: Establishes the liver-restricted requirement for ARH, the tissue specificity that defines this node.
  downstream:
  - target: Impaired Hepatic Clearance of Plasma LDL
    causal_link_type: DIRECT
    description: >-
      Failure to internalize surface-bound LDL means the hepatocyte does not
      remove LDL from plasma.
    evidence:
    - reference: PMID:36072671
      reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LDLRAP1 is a cytosolic protein required for the LDLR-mediated internalization of low-density lipoproteins (LDL) in polarized cells, such as hepatocytes"
      explanation: States that the adaptor is required for hepatocyte LDL internalization, the step that fails.
- name: Impaired Hepatic Clearance of Plasma LDL
  biological_scale: ORGANISM
  description: >-
    Because hepatic LDL receptors perform most clearance of circulating LDL and
    the liver is the compartment where ARH is required, loss of hepatic receptor
    internalization lengthens LDL residence time in plasma.
  biological_processes:
  - preferred_term: low-density lipoprotein particle clearance
    modifier: DECREASED
    term:
      id: GO:0034383
      label: low-density lipoprotein particle clearance
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This leads to a defective clearance of LDL particles from circulation, thereby causing a severe elevation of LDL cholesterol (LDL-C)."
    explanation: Links the internalization defect to defective plasma LDL clearance and the resulting elevation.
  downstream:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    causal_link_type: DIRECT
    description: >-
      Reduced clearance against unchanged production raises the steady-state plasma
      LDL cholesterol concentration from early life.
    evidence:
    - reference: PMID:36072671
      reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "thereby causing a severe elevation of LDL cholesterol (LDL-C)."
      explanation: States that defective clearance produces severe LDL-C elevation.
- name: Lifelong Elevation of Plasma LDL Cholesterol
  biological_scale: ORGANISM
  description: >-
    The defining biochemical phenotype: markedly and persistently elevated plasma
    LDL cholesterol, at levels comparable to receptor-defective homozygous FH.
    Because conventional receptor-dependent therapies act by increasing LDL
    receptor number, and the ARH receptor cannot internalize LDL regardless of
    number, LDL-C in ARH patients typically remains far from target on statin,
    ezetimibe, and apheresis therapy.
  evidence:
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This leads to a defective clearance of LDL particles from circulation, thereby causing a severe elevation of LDL cholesterol (LDL-C)."
    explanation: States the severe LDL-C elevation that this node represents.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "despite intensive treatment with conventional lipid-lowering therapies, their low-density lipoprotein (LDL) cholesterol levels remain far from target and this translates into a poor cardiovascular prognosis."
    explanation: Documents that LDL-C remains elevated despite conventional therapy, the therapeutic-resistance feature of this node.
  downstream:
  - target: Premature Atherosclerotic Cardiovascular Disease
    causal_link_type: DIRECT
    description: >-
      Sustained high plasma LDL from early life drives accelerated atherogenesis,
      giving a cardiovascular risk comparable to homozygous FH.
    evidence:
    - reference: PMID:36072671
      reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ARH patients have an increased risk of premature atherosclerotic cardiovascular disease (ASCVD), which is comparable to that observed in homozygous familial hypercholesterolemia (HoFH)"
      explanation: Links the LDL-C elevation to premature ASCVD at HoFH-comparable magnitude.
  - target: Extravascular Cholesterol Deposition
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - uptake of excess LDL-derived cholesterol by tissue macrophages
    description: >-
      The same circulating excess deposits in tendons, skin, and cornea, producing
      xanthomas and related stigmata.
    evidence:
    - reference: PMID:36072671
      reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Approximately 90% presented with xanthomata."
      explanation: Documents the high frequency of xanthomata in an ARH cohort, the extravascular deposition this node represents.

- name: Preserved Hepatic VLDL Remnant Uptake
  role: retained function modifying disease expression
  biological_scale: CELLULAR
  description: >-
    LDLR-dependent uptake of VLDL remnants is largely preserved in Arh-knockout mice despite impaired LDL uptake.
    Hepatocyte LDLR deletion abolishes this uptake, whereas additional LRP deletion does not. A human kinetic
    study in one patient found increased direct remnant removal. This retained pathway may limit LDL-precursor
    availability and contribute to statin responsiveness, but the precise ARH-independent internalization machinery
    is unresolved.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:17200716
    reference_title: Disruption of LDL but not VLDL clearance in autosomal recessive hypercholesterolemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The rate of VLDL clearance was significantly higher in Arh(-/-) mice than in Ldlr(-/-) mice, suggesting
      that LDLR-dependent uptake of VLDL is maintained in the absence of ARH.
    explanation: >-
      Whole-mouse comparison; preserved remnant clearance is distinct from the LDL clearance defect.
  - reference: PMID:22157599
    reference_title: "Altered metabolism of low-density lipoprotein and very-low-density lipoprotein remnant in autosomal recessive hypercholesterolemia: results from stable isotope kinetic study in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast, the direct removal of very-low-density lipoprotein remnant was significantly greater in
      ARH than those in control subjects (47.5 versus 2±2%).
    explanation: >-
      One patient versus seven controls; does not define a population-wide fraction.

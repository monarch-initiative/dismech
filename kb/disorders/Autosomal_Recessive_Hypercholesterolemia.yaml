animal_models:
- name: Arh(-/-) mouse
  species: Mouse
  genotype: Arh(-/-) (LDLRAP1 knockout)
  publication: PMID:16179341
  description: >-
    Arh-knockout mice and hepatic rescue constructs test LDLR internalization. Comparison with Ldlr-knockout
    and wild-type mice distinguishes impaired LDL clearance from preserved VLDL-remnant clearance. Similar
    VLDL secretion but markedly different diet-induced hypercholesterolemia argues against secretion alone
    explaining the phenotype.
  modeled_mechanisms:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of ARH in mouse liver reproduces the hepatocyte LDL-receptor
      endocytosis defect that defines this node, generalizing the WIF-B
      cell-culture result to an intact liver.
    limitations: >-
      Murine lipoprotein metabolism is apoB48- and HDL-dominated rather than
      LDL-dominated, so the model captures the molecular/cellular endocytic defect
      more faithfully than the human plasma-LDL and arterial-disease phenotype; the
      abstract reports in-vivo confirmation of the cell-culture findings without a
      separately quantified endocytosis readout.
    evidence:
    - reference: PMID:16179341
      reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Parallel studies performed in vivo with the same recombinant forms of ARH in livers of Arh(-/-) mice confirmed the relevance of the cell culture findings."
      explanation: >-
        Reports the Arh(-/-) mouse in-vivo confirmation that ARH is required for
        hepatocyte LDL-receptor clustering and internalization, supporting the use
        of this model for that node.
  - target: Preserved Hepatic VLDL Remnant Uptake
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      VLDL clearance is greater in Arh-knockout than Ldlr-knockout mice despite impaired LDL clearance.
    limitations: >-
      Mouse lipoprotein composition and diet differ from human physiology; the result does not establish the
      magnitude of human clinical protection.
    evidence:
    - reference: PMID:17200716
      reference_title: Disruption of LDL but not VLDL clearance in autosomal recessive hypercholesterolemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        The rate of VLDL clearance was significantly higher in Arh(-/-) mice than in Ldlr(-/-) mice, suggesting
        that LDLR-dependent uptake of VLDL is maintained in the absence of ARH.
      explanation: >-
        Whole-animal comparison of ligand clearance.
    readouts:

pathophysiology:
- name: Biallelic LDLRAP1 Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound-heterozygous pathogenic LDLRAP1 variants impair the ARH adaptor. The current locus
    is 1p36.11; 1p35 was the historical discovery mapping. Truncating, splice, initiation-codon and larger
    rearrangement alleles are described. Some alleles retain detectable shorter protein and residual uptake,
    so loss of function does not mean every genotype is a complete null. The two Sardinian founder alleles
    are enriched in that population rather than defining all worldwide disease.
  genes:
  - preferred_term: LDLRAP1
    term:
      id: hgnc:18640
      label: LDLRAP1
  genetic_context:
    gene:
      preferred_term: LDLRAP1
      term:
        id: hgnc:18640
        label: LDLRAP1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline pathogenic variants, either homozygous or compound heterozygous. Heterozygous carriers
      typically have normal lipid profiles.
  evidence:
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35 and identify six mutations in a gene encoding a putative adaptor protein (ARH)."
    explanation: The founding paper that maps ARH to 1p35 and identifies causative mutations in the adaptor gene.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is inherited as a recessive trait and causative mutations, though heterogeneous, are all predicted to be loss-of-function."
    explanation: States that the heterogeneous causative alleles are uniformly loss-of-function.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:30777337
    reference_title: "A new variant (c.1A>G) in LDLRAP1 causing autosomal recessive hypercholesterolemia: Characterization of the defect and response to PCSK9 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient had undetectable full-length ARH protein by Western blotting, but expressed a lower-than-normal
      molecular weight peptide.
    explanation: >-
      Patient-derived lymphocyte protein analysis of the homozygous initiation-codon variant; supports partial
      functional heterogeneity rather than a complete-null rule.
  downstream:
  - target: Loss of ARH Adaptor Bridging of the LDL Receptor to Clathrin
    causal_link_type: DIRECT
    description: >-
      Biallelic variants impair the adaptor needed for effective LDL-receptor coupling to the internalization
      machinery; the degree and molecular consequence vary by allele.
- name: Loss of ARH Adaptor Bridging of the LDL Receptor to Clathrin
  biological_scale: MOLECULAR
  description: >-
    The ARH phosphotyrosine-binding domain interacts with the LDLR cytoplasmic tail, while clathrin- and AP-2-binding
    regions connect it to coated-pit machinery. Domain-rescue experiments require the PTB domain plus either
    clathrin or AP-2 binding for effective clustering and LDL uptake. LDLRAP1 disease primarily affects this
    adaptor function rather than the LDLR coding sequence; receptor abundance and residual activity nevertheless
    depend on cell and allele context.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  molecular_functions:
  - preferred_term: clathrin-cargo adaptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0035615
      label: clathrin-cargo adaptor activity
  - preferred_term: low-density lipoprotein particle receptor binding
    modifier: DECREASED
    term:
      id: GO:0050750
      label: low-density lipoprotein particle receptor binding
  evidence:
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The disease is caused by mutations in ARH, which encodes a putative adaptor protein that interacts with the cytoplasmic tail of the LDLR, phospholipids, and two components of the clathrin endocytic machinery, clathrin and adaptor protein-2 (AP-2) in vitro."
    explanation: Establishes the adaptor's three binding partners - the receptor tail, clathrin, and AP-2 - whose bridging is lost in ARH.
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The phosphotyrosine binding domain of ARH plus either the clathrin box or the AP-2 binding region were required for both clustering and internalization of the LDLR."
    explanation: Defines the domain requirements for the bridging function, the LOSS_OF_FUNCTION captured by this node.
  downstream:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    causal_link_type: DIRECT
    description: >-
      Impaired adaptor coupling reduces receptor clustering and internalization of LDL cargo in the tested
      hepatocyte systems.
    evidence:
    - reference: PMID:16179341
      reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These results demonstrate that ARH must bind the LDLR tail and either clathrin or AP-2 to promote receptor clustering and internalization of LDL."
      explanation: Directly links loss of ARH bridging to failure of receptor clustering and internalization.
- name: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
  biological_scale: CELLULAR
  description: >-
    LDL-bound receptor internalization is strongly impaired in hepatocytes lacking ARH. The defect is cargo
    and cell dependent rather than a global failure of clathrin endocytosis. Patient lymphocytes also show
    reduced LDL uptake, while cultured skin fibroblasts can retain normal LDL-receptor function. In mouse hepatocytes,
    LDLR-dependent VLDL-remnant uptake persists despite failure to internalize LDL. Fibroblast DAB2-dependent
    maintenance of receptor protein complicates a simple redundant-adaptor explanation.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: clathrin-dependent endocytosis
    modifier: DECREASED
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
  - preferred_term: receptor-mediated endocytosis
    modifier: DECREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:16179341
    reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Autosomal recessive hypercholesterolemia is characterized by a cell type-specific defect in low density lipoprotein receptor (LDLR) endocytosis."
    explanation: States that the endocytic defect itself is the cellular lesion of ARH.
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ARH appears to have a tissue-specific role in LDLR function, as it is required in liver but not in fibroblasts."
    explanation: >-
      The founding abstract summarizes a liver-versus-fibroblast contrast; it does not establish that liver
      is the only affected cell type.
    quote_role: BACKGROUND
  - reference: PMID:27079874
    reference_title: Proprotein Convertase Subtilisin Kexin Type 9 Inhibition for Autosomal Recessive Hypercholesterolemia-Brief Report.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Fluorescent LDL cellular uptake, also measured by flow cytometry, was reduced in ARH lymphocytes compared
      with control lymphocytes.
    explanation: >-
      Patient lymphocyte experiments demonstrate that the uptake defect is not liver-exclusive.
  - reference: PMID:17761685
    reference_title: Adaptor protein disabled-2 modulates low density lipoprotein receptor synthesis in fibroblasts from patients with autosomal recessive hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      SiRNA-depletion of Dab2 profoundly reduced LDL-receptor activity in ARH fibroblasts as a result of profound
      reduction in LDL-receptor protein, but not mRNA; heterologous expression of murine Dab2 reversed this
      effect.
    explanation: >-
      DAB2 perturbation in patient fibroblasts changes receptor abundance; these data should not be reduced
      to proof of interchangeable endocytic adaptors.
  downstream:
  - target: Impaired Hepatic Clearance of Plasma LDL
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced hepatic LDL uptake contributes to slow plasma LDL-apoB removal; human kinetic data establish
      the clearance defect without measuring every cellular intermediary.
- name: Impaired Hepatic Clearance of Plasma LDL
  biological_scale: ORGANISM
  description: >-
    Plasma LDL-apoB removal is reduced. In one ARH patient, a stable-isotope study estimated LDL-apoB fractional
    catabolism of 0.109/day versus 0.450 ± 0.122/day in seven controls. Atorvastatin increased this patient's
    rate to 0.464/day. This demonstrates substantial reversibility in that individual and does not establish
    a universal value for all LDLRAP1 genotypes.
  biological_processes:
  - preferred_term: low-density lipoprotein particle clearance
    modifier: DECREASED
    term:
      id: GO:0034383
      label: low-density lipoprotein particle clearance
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:22157599
    reference_title: "Altered metabolism of low-density lipoprotein and very-low-density lipoprotein remnant in autosomal recessive hypercholesterolemia: results from stable isotope kinetic study in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      FCR of low-density lipoprotein (LDL) apoB of ARH was significantly lower than those of control subjects
      (0.109 versus 0.450±0.122 1/day).
    explanation: >-
      Stable-isotope kinetic modeling in one ARH patient compared with seven controls; a human metabolic measurement,
      not an in-vitro uptake assay.
  downstream:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    causal_link_type: DIRECT
    description: >-
      Reduced LDL removal raises circulating LDL-C. The balance also depends on precursor clearance and production;
      unchanged LDL production is not assumed.
    evidence:
    - reference: PMID:22157599
      reference_title: "Altered metabolism of low-density lipoprotein and very-low-density lipoprotein remnant in autosomal recessive hypercholesterolemia: results from stable isotope kinetic study in vivo."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        These results demonstrate that ARH exhibits decreased LDL clearance associated with decreased FCR of
        LDL apoB and increased clearance for very-low-density lipoprotein remnant.
      explanation: >-
        The measured lipoprotein pathways distinguish impaired LDL removal from preserved/increased remnant
        clearance.
- name: Lifelong Elevation of Plasma LDL Cholesterol
  biological_scale: ORGANISM
  description: >-
    Marked LDL-C elevation is the central biochemical manifestation, but its magnitude and response to treatment
    vary. In a retrospective 52-patient cohort, baseline LDL-C averaged 571.9 mg/dL and the best recorded on-treatment
    level averaged 164.0 mg/dL. Baseline was not uniformly untreated, and nadir is not long-term average exposure.
    Failure to reach targets does not mean lack of response.
  evidence:
  - reference: PMID:29348020
    reference_title: "Autosomal Recessive Hypercholesterolemia: Long-Term Cardiovascular Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Mean LDL-C achieved at nadir was 164.0 ± 85.1 mg/dl (-69.6% from baseline), with a better response in
      patients taking lomitapide (-88.3%).
    explanation: >-
      Retrospective treatment combinations in 52 ARH patients. The lomitapide figure is a subgroup change from
      the original baseline, not a randomized or isolated add-on drug effect.
  downstream:
  - target: Premature Atherosclerotic Cardiovascular Disease
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained LDL burden contributes to atherosclerotic disease; the ARH cohort records substantial residual
      cardiovascular risk despite treatment.
    evidence:
    - reference: PMID:29348020
      reference_title: "Autosomal Recessive Hypercholesterolemia: Long-Term Cardiovascular Outcomes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        During follow-up, 26.9% of patients had incident ASCVD, and 11.5% had a new diagnosis of aortic valve
        stenosis (absolute risk per year of 1.9% and 0.8%, respectively).
      explanation: >-
        Observed ARH outcomes over mean 14.1-year follow-up; this is not a direct experiment of the LDL-to-plaque
        mechanism.
  - target: Extravascular Cholesterol Deposition
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Chronic cholesterol excess produces tissue deposits; the individual clinical lesions require their own
      evidence.
  - target: Aortic Valve Stenosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Valvular disease is a recognized severe-hypercholesterolemia complication; it is distinct from coronary
      plaque rupture.
    evidence:
    - reference: PMID:32011344
      reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        ARH is also associated with increased risk of developing aortic valve stenosis.
      explanation: >-
        ARH-specific review association; intervening valvular mechanisms are not resolved by this sentence.
  - target: Increased LDL Cholesterol
    causal_link_type: DIRECT
    description: >-
      The elevated plasma LDL-C state is the directly measured biochemical phenotype.
  - target: Hypercholesterolemia
    causal_link_type: DIRECT
    description: >-
      The markedly elevated LDL fraction contributes to increased total cholesterol.
- name: Premature Atherosclerotic Cardiovascular Disease
  biological_scale: ORGANISM
  description: >-
    Premature arterial disease, especially coronary disease, produces myocardial infarction and need for coronary
    revascularization. A 52-patient retrospective ARH series recorded 14 incident ASCVD cases during mean 14.1-year
    follow-up, including five myocardial infarctions. Residual risk can be substantial despite LDL lowering.
    Comparisons with historical HoFH cohorts do not prove identical risk for every genotype or exclude differences
    from receptor-negative LDLR disease. Aortic valve stenosis is modeled separately from this arterial outcome.
  locations:
  - preferred_term: artery
    term:
      id: UBERON:0001637
      label: artery
  evidence:
  - reference: PMID:29348020
    reference_title: "Autosomal Recessive Hypercholesterolemia: Long-Term Cardiovascular Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      During follow-up, 26.9% of patients had incident ASCVD, and 11.5% had a new diagnosis of aortic valve
      stenosis (absolute risk per year of 1.9% and 0.8%, respectively).
    explanation: >-
      Direct retrospective clinical outcomes; no universal age of onset follows from the cohort.
  downstream:
  - target: Premature Coronary Artery Atherosclerosis
    causal_link_type: DIRECT
    description: >-
      Coronary disease is the major reported arterial manifestation.
  - target: Myocardial Infarction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

name: Autosomal Recessive Hypercholesterolemia
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >
  Autosomal recessive hypercholesterolemia (ARH; hypercholesterolemia, familial,
  4) is the recessively inherited form of monogenic hypercholesterolemia, caused
  by biallelic loss-of-function variants in LDLRAP1. LDLRAP1 encodes the LDL
  receptor adaptor protein (ARH), a cytosolic adaptor whose phosphotyrosine
  binding (PTB) domain recognizes the FDNPVY / NPxY motif in the cytoplasmic tail
  of the LDL receptor and whose clathrin- and AP-2-binding regions bridge the
  bound receptor to the clathrin endocytic machinery. Its role is tissue
  specific: it is required for LDL receptor internalization in hepatocytes but
  not in fibroblasts, where a redundant adaptor (Dab2) suffices. The consequence
  is mechanistically distinct from the dominant FH genes: the LDL receptor itself
  is normal and reaches the hepatocyte surface, but without ARH it cannot cluster
  into clathrin-coated pits and internalize LDL, so hepatic LDL clearance fails,
  plasma LDL cholesterol is markedly and lifelong elevated, and patients develop
  tendon xanthomas, premature atherosclerotic cardiovascular disease, and aortic
  valve stenosis. Clinically ARH behaves as a phenocopy of homozygous familial
  hypercholesterolemia, though it is often somewhat less severe and more
  treatment-responsive than receptor-negative homozygous FH because surface LDL
  receptor is present. It is ultra-rare worldwide, with a founder concentration
  on Sardinia (the ARH1 and ARH2 alleles).

  This entry is scoped to the LDLRAP1 / ARH recessive mechanism and is kept
  separate from the autosomal dominant FH forms already curated
  (Familial_Hypercholesterolemia, LDLR-Related_Familial_Hypercholesterolemia,
  Familial_Defective_Apolipoprotein_B-100,
  Autosomal_Dominant_Hypercholesterolemia_3). The shared distal LDL-to-plaque
  cascade is not re-derived here; what is disease-specific is the recessive,
  adaptor-side, liver-restricted internalization defect acting on a structurally
  normal receptor.
synonyms:
- Hypercholesterolemia, familial, 4
- ARH
- LDLRAP1-related familial hypercholesterolemia
- Familial autosomal recessive hypercholesterolemia
- FHCB2

inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic pathogenic LDLRAP1 variants cause autosomal recessive disease; both homozygous and compound-heterozygous
    genotypes occur. Carriers are usually asymptomatic and may have normal lipid profiles. After confirming
    that both parents carry a familial pathogenic variant, each pregnancy has a 25% affected, 50% carrier and
    25% noncarrier probability. A disease-wide penetrance estimate is not established by the cited cohorts.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDLRAP1-related FH is caused by biallelic pathogenic variants and is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the recessive mode of inheritance and the requirement for biallelic variants.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If both parents are known to be heterozygous for an LDLRAP1 pathogenic variant, each sib of an affected
      individual has at conception a 25% chance of being affected, a 50% chance of being a carrier, and a 25%
      chance of inheriting neither of the familial pathogenic variants.
    explanation: >-
      Recurrence probabilities are conditional on confirmed parental carrier status.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Individuals who are heterozygous for an LDLRAP1 pathogenic variant (i.e., carriers) are typically asymptomatic.
    explanation: >-
      Normal lipids do not exclude carrier status.

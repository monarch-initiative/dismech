- population: Two free-living Sicilian populations; ARH1 allele only
  measure_type: CARRIER_FREQUENCY
  notes: >-
    One heterozygous ARH1 carrier was identified among 2,565 participants (848 in northern and 1,717 in southern
    Sicily). This directly observed count concerns one allele, not all LDLRAP1 variants or Sardinia. The rounded
    allele frequency was 0.02%; it is not a disease-prevalence estimate.
  evidence:
  - reference: PMID:29153781
    reference_title: "Genetic epidemiology of autosomal recessive hypercholesterolemia in Sicily: Identification by next-generation sequencing of a new kindred."

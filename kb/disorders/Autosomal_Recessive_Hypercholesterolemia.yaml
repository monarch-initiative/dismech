differential_diagnoses:
- name: LDLR-, APOB- or PCSK9-related familial hypercholesterolemia
  description: >-
    May produce a severe biallelic HoFH phenotype resembling ARH.
  distinguishing_features:
  - Molecular testing identifies the causal gene; a single pathogenic allele in these genes can produce dominant disease, unlike typical LDLRAP1 carrier status.
  - A normal fibroblast uptake assay does not exclude LDLRAP1 disease; genotype and cell context matter.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A heterozygous gain-of-function pathogenic (or likely pathogenic) variant in PCSK9
    explanation: >-
      Dominant PCSK9 diagnosis is mechanistically distinct.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews names biallelic LDLRAP1 pathogenic variants as the molecular
      diagnosis of the recessive form - the ARH-specific diagnostic route.
    quote_role: REVIEW_SYNTHESIS
- name: Sitosterolemia
  disease_term:
    preferred_term: sitosterolemia
    term:
      id: MONDO:0008863
      label: sitosterolemia
  description: >-
    Recessive ABCG5/ABCG8 disease can cause childhood xanthomas, high LDL-C and premature coronary disease.
  distinguishing_features:
  - Elevated plasma plant sterols and ABCG5/ABCG8 variants distinguish it; hemolytic anemia, thrombocytopenia or stomatocytes are clues.
  - Treatment implications include dietary sterol restriction and ezetimibe.
  evidence:
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These include sitosterolaemia (or ‘phytosterolaemia’), caused by bi-allelic rare pathogenic variants
      in two ATP-binding cassette transporter genes, ABCG5 and/or ABCG8 (or at least one such variant in each
      gene), with elevated LDL-C levels that respond well to dietary recommendations, ezetimibe and/or resins,
    explanation: >-
      Consensus differential and distinct treatment response.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hematologic abnormalities (hemolytic anemia, thrombocytopenia, stomatocytes);
    explanation: >-
      GeneReviews distinguishing features.
- name: Lysosomal acid lipase deficiency
  disease_term:
    preferred_term: lysosomal acid lipase deficiency
    term:
      id: MONDO:0800449
      label: lysosomal acid lipase deficiency
  description: >-
    Biallelic LIPA disease can elevate LDL-C and cause premature atherosclerosis.
  distinguishing_features:
  - Hepatosplenomegaly, raised transaminases and triglycerides suggest the storage disorder; confirm with enzyme and molecular testing.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In adult onset (cholesterol-ester storage disease): hepatosplenomegaly &/or ↑ liver enzymes, ↑ triglycerides
    explanation: >-
      GeneReviews hepatic/lipid clues; infantile Wolman disease is a different severity presentation.
- name: Cerebrotendinous xanthomatosis
  disease_term:
    preferred_term: cerebrotendinous xanthomatosis
    term:
      id: MONDO:0008948
      label: cerebrotendinous xanthomatosis
  description: >-
    CYP27A1 disease shares tendon xanthomas.
  distinguishing_features:
  - Neurologic and cognitive abnormalities, cataracts and elevated cholestanol with normal or mildly elevated cholesterol favor this diagnosis.
  evidence:
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients with cerebrotendinous xanthomatosis may have xanthomas resembling HoFH but plasma cholesterol
      levels are normal to mildly elevated (with elevated cholestanol levels) associated with neurological,
      cognitive, and ophthalmic symptoms.
    explanation: >-
      Clinical and biochemical distinction.
- name: Secondary hypercholesterolemia
  description: >-
    Acquired disorders and medications can mimic or worsen an inherited lipid phenotype.
  distinguishing_features:
  - Assess thyroid, renal and hepatic disease, diabetes, obesity and relevant medications alongside inherited causes.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hypercholesterolemia secondary to acquired conditions including obesity, diabetes mellitus, obstructive
      liver disease, hypothyroidism, drugs (e.g., steroids), or kidney disease can also be associated with
      laboratory findings similar to those of FH
    explanation: >-
      GeneReviews acquired differential; not a classification of ARH as environmental disease.
experimental_models:
- name: Patient-derived primary lymphocytes
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary lymphocytes from 28 genetically characterized ARH patients and 11 controls
  publication: PMID:27079874
  description: >-
    Mevastatin-treated lymphocytes exposed to recombinant PCSK9 with or without alirocumab. Surface receptor
    expression is higher but uptake lower than controls, showing why receptor abundance is not synonymous with
    function.
  modeled_mechanisms:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reduced cellular LDL uptake reproduces an ARH endocytic defect in lymphocytes.
    limitations: >-
      The target names hepatocytes; this nonhepatic assay informs the shared defect but does not measure hepatic
      clearance or prove clinical antibody efficacy.
    evidence:
    - reference: PMID:27079874
      reference_title: Proprotein Convertase Subtilisin Kexin Type 9 Inhibition for Autosomal Recessive Hypercholesterolemia-Brief Report.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Fluorescent LDL cellular uptake, also measured by flow cytometry, was reduced in ARH lymphocytes compared
        with control lymphocytes.
      explanation: >-
        Patient-cell uptake measurement, distinct from plasma LDL-C response.
    readouts:
    - name: Fluorescent LDL uptake
      target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
      direction: DECREASED
      description: >-
        Reduced cellular LDL uptake reproduces an ARH endocytic defect in lymphocytes.

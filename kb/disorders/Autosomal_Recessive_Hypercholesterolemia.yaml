biochemical:
- name: Plasma LDL Cholesterol
  biomarker_term:
    preferred_term: LDL cholesterol
    term:
      id: CHEBI:47774
      label: low-density lipoprotein cholesterol
  presence: Increased
  notes: >-
    The primary diagnostic and monitoring analyte. In ARH, untreated LDL-C is at
    homozygous-FH magnitude and remains far from target on conventional therapy, so
    it is both the diagnostic marker and the treatment-response endpoint.
  evidence:
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "despite intensive treatment with conventional lipid-lowering therapies, their low-density lipoprotein (LDL) cholesterol levels remain far from target and this translates into a poor cardiovascular prognosis."
    explanation: Establishes LDL-C as the elevated, treatment-resistant analyte tracked in ARH.
genetic:
- name: LDLRAP1
  gene_term:
    preferred_term: LDLRAP1
    term:
      id: hgnc:18640
      label: LDLRAP1
  association: Pathogenic Mutations
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    LDLRAP1 (LDL receptor adaptor protein 1) at 1p35 encodes the cytosolic ARH
    adaptor. Causative variants are heterogeneous but uniformly loss-of-function;
    biallelic status (homozygous or compound heterozygous) is required. Two
    Sardinian founder alleles, ARH1 and ARH2, explain most reported cases, and the
    ARH1 allele is the one identified in mainland-Italian and Sicilian kindreds.
  evidence:
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35 and identify six mutations in a gene encoding a putative adaptor protein (ARH)."
    explanation: The founding gene-discovery paper mapping and identifying LDLRAP1/ARH mutations.
  - reference: PMID:29153781
    reference_title: "Genetic epidemiology of autosomal recessive hypercholesterolemia in Sicily: Identification by next-generation sequencing of a new kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in Sardinia, 2 alleles (ARH1 and ARH2) explain most of the cases."
    explanation: Names the two Sardinian founder alleles.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is inherited as a recessive trait and causative mutations, though heterogeneous, are all predicted to be loss-of-function."
    explanation: Confirms the loss-of-function nature of the heterogeneous causative alleles.
diagnosis:
- name: Molecular Genetic Testing of LDLRAP1
  description: >-
    The molecular diagnosis of ARH rests on identifying biallelic (homozygous or
    compound heterozygous) pathogenic variants in LDLRAP1, which distinguishes it
    from the dominant FH genes where a single heterozygous variant suffices. In an
    individual of Sardinian ancestry, targeted testing for the ARH1 and ARH2
    founder alleles is the efficient first step.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews names biallelic LDLRAP1 pathogenic variants as the molecular
      diagnosis of the recessive form - the ARH-specific diagnostic route.
  - reference: PMID:29153781
    reference_title: "Genetic epidemiology of autosomal recessive hypercholesterolemia in Sicily: Identification by next-generation sequencing of a new kindred."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in Sardinia, 2 alleles (ARH1 and ARH2) explain most of the cases."
    explanation: Supports founder-allele-directed molecular testing in Sardinian probands.
- name: Clinical Diagnosis by Elevated LDL Cholesterol
  description: >-
    A clinical diagnosis rests on markedly elevated LDL-C with the characteristic
    stigmata (tendon xanthomas, premature ASCVD) in the setting of unaffected,
    normolipidemic parents - the recessive pattern that separates ARH from
    heterozygous FH.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A clinical diagnosis of FH can be established in a proband with characteristic clinical features and significantly elevated LDL-C levels (typically >190 mg/dL in adults and >160 mg/dL in children)."
    explanation: >-
      GeneReviews gives the clinical-diagnostic LDL-C thresholds for FH, which
      apply to the markedly elevated LDL-C seen in the recessive form.
treatments:
- name: Statin plus Ezetimibe (Background Lipid-Lowering Therapy)
  description: >
    First-line conventional therapy, but ARH is relatively resistant to it: LDL-C
    remains far from target despite intensive statin-plus-ezetimibe treatment.
    Mechanistically, a statin lowers hepatic cholesterol and induces more LDL
    receptor, but in ARH the additional receptor still cannot internalize LDL
    without the adaptor; ezetimibe blocks intestinal cholesterol absorption
    (NPC1L1) and so acts by an ARH-independent route, which is why the combination
    still lowers LDL-C partially.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: statin
      term:
        id: CHEBI:87631
        label: statin
    - preferred_term: ezetimibe
      term:
        id: CHEBI:49040
        label: ezetimibe
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: INHIBITS
    description: >
      Reduces plasma LDL cholesterol, but incompletely - LDL-C stays far from
      target in ARH on conventional therapy.
    evidence:
    - reference: PMID:32011344
      reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "despite intensive treatment with conventional lipid-lowering therapies, their low-density lipoprotein (LDL) cholesterol levels remain far from target and this translates into a poor cardiovascular prognosis."
      explanation: Documents the incomplete LDL-C lowering achieved by conventional therapy in ARH.
  evidence:
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "despite intensive treatment with conventional lipid-lowering therapies, their low-density lipoprotein (LDL) cholesterol levels remain far from target and this translates into a poor cardiovascular prognosis."
    explanation: Establishes conventional lipid-lowering therapy as background treatment and its limited efficacy in ARH.
- name: Lomitapide
  description: >
    Microsomal triglyceride transfer protein (MTP) inhibitor. It reduces hepatic
    VLDL secretion and therefore LDL production by an LDL-receptor-independent
    mechanism, which is why it retains efficacy in ARH despite the receptor
    internalization defect. In a subanalysis of nine ARH patients in the
    Pan-European Lomitapide Study, adding lomitapide to background statin plus
    ezetimibe achieved a median on-treatment LDL-C of 101.7 mg/dL (a 60.4%
    reduction from baseline).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lomitapide
      term:
        id: CHEBI:72297
        label: lomitapide
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: BYPASSES
    description: >
      Lowers LDL production upstream of the receptor, bypassing the defective
      hepatic LDL-receptor internalization.
    evidence:
    - reference: PMID:36072671
      reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "lomitapide acts using an LDLR-independent mechanism, therefore potentially extending its efficacy in patients with an absent LDLR function, like those with ARH"
      explanation: States the LDLR-independent mechanism that lets lomitapide bypass the ARH defect.
  evidence:
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The addition of lomitapide (mean dose, 10 mg) resulted in the achievement of a median on-treatment LDL-C of 101.7 mg/dL (IQR, 71.3-138.3; 60.4% reduction from baseline)"
    explanation: Quantifies the LDL-C reduction achieved by lomitapide in the ARH subgroup.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lomitapide, a microsomal triglyceride transfers protein inhibitor, may represent a new opportunity for the effective treatment of ARH."
    explanation: Independent review statement that lomitapide is a promising ARH-specific therapy.
- name: Lipoprotein Apheresis
  description: >
    Extracorporeal physical removal of circulating apoB-containing lipoproteins,
    used in severe ARH (as in homozygous FH) when pharmacotherapy leaves LDL-C
    far above target and there is established cardiovascular disease. Its LDL
    lowering is mechanism-independent - it removes LDL directly from plasma.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: lipoprotein apheresis
    term:
      id: NCIT:C173286
      label: Therapeutic Apheresis
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: INHIBITS
    description: >
      Lowers plasma LDL cholesterol by a route independent of LDL-receptor
      function, so it retains efficacy despite the ARH internalization defect;
      current consensus treats it as foundational in severe biallelic disease.
    evidence:
    - reference: PMID:37130090
      reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "for lomitapide, angiopoietin-like protein 3 (ANGPLT3)-directed therapy and lipoprotein apheresis, response is independent of low-density lipoprotein receptor function."
      explanation: >-
        States that the LDL-C-lowering response to lipoprotein apheresis is
        independent of LDL-receptor function - the mechanism that lets it lower
        LDL-C in ARH despite the receptor-side (here, adaptor-side) defect.
    - reference: PMID:37130090
      reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Combination LDL-C-lowering therapy-both pharmacologic intervention and lipoprotein apheresis (LA)-is foundational."
      explanation: >-
        Establishes apheresis as a foundational LDL-C-lowering component of
        severe-disease management, the role modeled by this link.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LDL apheresis is also used occasionally if there is evidence of established CAD."
    explanation: >-
      GeneReviews mentions LDL apheresis (in its FH pregnancy-management paragraph)
      for established CAD; quoted as an expert-recommendation (OTHER) example of the
      established-CAD indication that also applies to severe ARH, not as a
      pregnancy-specific claim.
- name: Cardiovascular Imaging Surveillance
  action_category: MONITORING
  description: >
    Because ARH carries an ASCVD and aortic-valve-stenosis risk comparable to
    homozygous FH, GeneReviews recommends that autosomal recessive FH be monitored
    with imaging (echocardiogram, CT angiogram, and cardiac catheterization). The
    echocardiogram in particular tracks the aortic valve stenosis this entry
    models. This is surveillance, not a mechanism-directed therapy, so it carries
    no target_mechanisms link.
  treatment_term:
    preferred_term: cardiovascular imaging surveillance
    term:
      id: NCIT:C16502
      label: Diagnostic Imaging Testing
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "or autosomal recessive FH (due to homozygous or compound heterozygous pathogenic variants in LDLRAP1) should be monitored with various imaging modalities (including echocardiogram, CT angiogram, and cardiac catheterization) as recommended."
    explanation: >-
      GeneReviews names autosomal recessive FH (biallelic LDLRAP1) explicitly in
      its imaging-surveillance recommendation - the most ARH-specific management
      statement in the chapter.
- name: PCSK9 Inhibitor
  description: >
    Monoclonal antibodies against PCSK9 (e.g., alirocumab, evolocumab) raise LDL
    receptor surface abundance. Their benefit in ARH is disputed and at best
    partial, because their action depends on residual LDL receptor functionality
    and, in ARH lymphocytes, surface LDL receptor is already higher than normal
    and PCSK9's effect on it is blunted. They may lower LDL-C in some ARH patients
    on top of statin therapy.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: PCSK9 inhibitor
      term:
        id: NCIT:C190797
        label: PCSK9 Inhibitor
  target_mechanisms:
  - target: Lifelong Elevation of Plasma LDL Cholesterol
    treatment_effect: MODULATES
    description: >
      May partially lower LDL-C in some ARH patients; efficacy is disputed and
      depends on residual LDL-receptor functionality.
    evidence:
    - reference: PMID:27079874
      reference_title: "Proprotein Convertase Subtilisin Kexin Type 9 Inhibition for Autosomal Recessive Hypercholesterolemia-Brief Report."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PCSK9 inhibition with alirocumab on top of statin treatment has the potential to lower LDL cholesterol in some autosomal recessive hypercholesterolemia patients."
      explanation: States the partial, patient-dependent potential of PCSK9 inhibition in ARH.
  evidence:
  - reference: PMID:27079874
    reference_title: "Proprotein Convertase Subtilisin Kexin Type 9 Inhibition for Autosomal Recessive Hypercholesterolemia-Brief Report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the effects of recombinant PCSK9, and hence of alirocumab, on LDL receptor expression and function were significantly less pronounced in ARH than in control cells."
    explanation: >-
      Mechanistic basis for the blunted PCSK9-inhibitor response in ARH - PCSK9's
      effect on the LDL receptor is reduced in ARH cells.
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the efficacy of PCSK9i in ARH is currently disputed because the mechanism of their actions is largely dependent on the extent of residual LDLR functionality"
    explanation: States that PCSK9-inhibitor efficacy in ARH is disputed and residual-receptor-dependent.
progression:
- phase: Lifelong LDL-C Elevation from Early Life
  age_range: From birth
  notes: >-
    LDL cholesterol is markedly elevated from early life because hepatic LDL
    clearance is defective from birth. Cumulative LDL-C burden, not a discrete
    onset, drives the cardiovascular course.
- phase: Extravascular Deposition and Xanthomata
  age_range: Childhood to early adulthood
  notes: >-
    Tendon xanthomas and related cholesterol-deposition stigmata accumulate with
    sustained LDL-C elevation; approximately 90% of an ARH cohort presented with
    xanthomata.
  evidence:
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 90% presented with xanthomata."
    explanation: Quantifies xanthoma burden in the ARH cohort.
- phase: Premature ASCVD Events
  age_range: Mid-40s (lomitapide-treated ARH cohort)
  notes: >-
    In the Pan-European lomitapide ARH cohort, the majority had already
    experienced at least one ASCVD event before starting lomitapide, at a mean age
    in the mid-40s - decades earlier than the general population and comparable to
    homozygous FH. Ages reflect a treated-cohort survey, not an untreated natural
    history.
  evidence:
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mean age at the first event was 45.2 ± 7.9"
    explanation: Reports the mean age at first ASCVD event in the ARH cohort.
  - reference: PMID:36072671
    reference_title: "Efficacy of Long-Term Treatment of Autosomal Recessive Hypercholesterolemia With Lomitapide: A Subanalysis of the Pan-European Lomitapide Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at starting lomitapide was 46 (interquartile range (IQR), 39.0-65.5) years"
    explanation: Gives the age at which LDLR-independent escalation (lomitapide) was started in the cohort.
animal_models:
- name: Arh(-/-) mouse
  species: Mouse
  genotype: Arh(-/-) (LDLRAP1 knockout)
  publication: PMID:16179341
  description: >-
    ARH knockout mouse used to test, in an intact liver, the same recombinant ARH
    domain constructs characterized in polarized WIF-B hepatocytes. The in-vivo
    studies confirmed that the cell-culture domain requirements for LDL receptor
    clustering and internalization hold in the hepatocyte compartment of a whole
    animal - the in-vivo confirmation of the entry's central mechanism.
  modeled_mechanisms:
  - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of ARH in mouse liver reproduces the hepatocyte LDL-receptor
      endocytosis defect that defines this node, generalizing the WIF-B
      cell-culture result to an intact liver.
    limitations: >-
      Murine lipoprotein metabolism is apoB48- and HDL-dominated rather than
      LDL-dominated, so the model captures the molecular/cellular endocytic defect
      more faithfully than the human plasma-LDL and arterial-disease phenotype; the
      abstract reports in-vivo confirmation of the cell-culture findings without a
      separately quantified endocytosis readout.
    evidence:
    - reference: PMID:16179341
      reference_title: "The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes low density lipoprotein receptor clustering into clathrin-coated pits."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Parallel studies performed in vivo with the same recombinant forms of ARH in livers of Arh(-/-) mice confirmed the relevance of the cell culture findings."
      explanation: >-
        Reports the Arh(-/-) mouse in-vivo confirmation that ARH is required for
        hepatocyte LDL-receptor clustering and internalization, supporting the use
        of this model for that node.

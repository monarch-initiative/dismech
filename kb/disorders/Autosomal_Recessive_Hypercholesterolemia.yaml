- name: Evinacumab
  description: >-
    ANGPTL3-neutralizing antibody that lowers LDL-C through an LDLR-independent pathway. Two reported ARH adults
    achieved substantial additional lowering with monthly infusions; one continued apheresis, while the second
    remained below 55 mg/dL after background evolocumab and bempedoic acid were stopped. Changing co-therapy
    and apheresis timing preclude attributing the entire change to evinacumab. Transient first-infusion headache
    or abdominal colic was reported. The phase III open-label extension included two LDLRAP1 patients, but
    its published subgroup combines them with LDLR disease. Cardiovascular-event prevention specifically in
    ARH is unproven.

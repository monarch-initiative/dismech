genetic:
- name: LDLRAP1
  gene_term:
    preferred_term: LDLRAP1
    term:
      id: hgnc:18640
      label: LDLRAP1
  association: Pathogenic Mutations
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    LDLRAP1 at 1p36.11 encodes the cytosolic ARH adaptor. Pathogenic alleles include truncating variants, splice
    alterations, large rearrangements and initiation-codon variants. Disease requires biallelic variants, either
    homozygous or compound heterozygous. Loss of normal function need not mean complete absence of residual
    uptake: c.1A>G was associated with a shorter protein and residual lymphocyte LDLR activity. Sardinian founder
    alleles include NM_015627.3:c.431dupA (historically c.432_433insA), p.His144GlnfsTer27, and c.65G>A, p.Trp22Ter.
    Their prominence in Sardinian-enriched cohorts is not worldwide allele predominance.
  evidence:
  - reference: PMID:11326085
    reference_title: "Autosomal recessive hypercholesterolemia caused by mutations in a putative LDL receptor adaptor protein."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35 and identify six mutations in a gene encoding a putative adaptor protein (ARH)."
    explanation: The founding gene-discovery paper mapping and identifying LDLRAP1/ARH mutations.
  - reference: url:https://gredos.usal.es/bitstream/handle/10366/155662/1801%20Colesterol%20retrospectivo.pdf
    reference_title: "https://gredos.usal.es/bitstream/handle/10366/155662/1801%20Colesterol%20retrospectivo.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Twelve different LDLRAP1 mutations (including 2 major rearrangements) in LDLRAP1 were detected; 8 of
      them predict the presence of a truncated ARH protein. Thirty-nine patients were simple homozy- gotes,
      and 13 were compound heterozygotes.
    explanation: >-
      Includes two major rearrangements and both biallelic configurations.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      LDLRAP1 NM_015627.3 NP_056442.2 c.431dupA (c.432_433insA) p.His144GlnfsTer27
    explanation: >-
      Modern transcript-based founder nomenclature from GeneReviews; historical protein notations can differ.
  - reference: PMID:30777337
    reference_title: "A new variant (c.1A>G) in LDLRAP1 causing autosomal recessive hypercholesterolemia: Characterization of the defect and response to PCSK9 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The patient had undetectable full-length ARH protein by Western blotting, but expressed a lower-than-normal
      molecular weight peptide.
    explanation: >-
      Patient-derived lymphocyte result limits an all-null protein model.
  - reference: url:https://gredos.usal.es/bitstream/handle/10366/155662/1801%20Colesterol%20retrospectivo.pdf
    reference_title: "https://gredos.usal.es/bitstream/handle/10366/155662/1801%20Colesterol%20retrospectivo.pdf"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The most common pathogenic variants were p.(Trp22*) and p.(Ala145Serfs*26), which were present in 26.9%
      and 53.8% of patients, respectively. This is because these genetic variants are common among Sardinian
      cases of ARH (4,14) , which represented the largest subgroup in our cohort.
    explanation: >-
      The primary 2018 cohort identifies p.Trp22Ter and the historical frameshift as enriched among its Sardinian
      participants. Modern c.65G>A nomenclature is recorded in the GeneReviews molecular table; this quotation
      avoids the next table header.
diagnosis:
- name: Molecular Genetic Testing of LDLRAP1
  description: >-
    Identify two pathogenic or likely pathogenic LDLRAP1 variants in trans, using segregation testing when
    needed. An FH or broader dyslipidemia panel should include sequence and deletion/duplication analysis.
    A variant of uncertain significance cannot establish or exclude the diagnosis. Founder testing may be useful
    in Sardinian families, but a negative founder test does not exclude other alleles; one detected allele
    or apparent homozygosity may require copy-number analysis. Normal fibroblast LDL uptake does not exclude
    ARH.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The molecular diagnosis of FH can be established by identification of heterozygous or biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor), LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants in LDLRAP1."
    explanation: >-
      GeneReviews names biallelic LDLRAP1 pathogenic variants as the molecular
      diagnosis of the recessive form - the ARH-specific diagnostic route.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of variant(s) of uncertain significance cannot be used to confirm or rule out the diagnosis.
    explanation: >-
      VUS interpretation applies to the FH molecular evaluation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A smaller FH multigene panel that includes sequence analysis and deletion/duplication analysis of APOB,
      LDLR, LDLRAP1, and PCSK9 may be considered.
    explanation: >-
      Panel should include copy-number analysis as well as sequencing.
  - reference: PMID:17761685
    reference_title: Adaptor protein disabled-2 modulates low density lipoprotein receptor synthesis in fibroblasts from patients with autosomal recessive hypercholesterolaemia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Surprisingly, LDL-receptor function is normal in ARH patients' skin fibroblasts in culture.
    explanation: >-
      The cell-specific phenotype makes a normal fibroblast assay insufficient to rule out LDLRAP1 disease.
- name: Clinical Suspicion and Lipid Evaluation
  description: >-
    Severe LDL-C elevation, childhood xanthomas or early coronary/valve disease raise suspicion. Normal parental
    lipids favor recessive disease but are not diagnostic, and no single LDL-C threshold establishes LDLRAP1
    disease. Measure the lipid profile, assess secondary causes and cardiovascular risk factors, and use molecular
    testing to distinguish phenotypically overlapping disorders.
  evidence:
  - reference: PMID:42730734
    reference_title: Autosomal Recessive Hypercholesterolemia Due to a Novel Homozygous LDLRAP1 Frameshift Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cardiac evaluation was normal, secondary causes were excluded, and first-degree relatives had normal
      lipid profiles.
    explanation: >-
      One molecularly confirmed case illustrates normal family lipids and absence of established cardiovascular
      disease.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A broader dyslipidemia multigene panel that includes APOB, LDLR, LDLRAP1, and PCSK9 as well as ABCG8,
      ABCG5, APOE, and LIPA (genes associated with other lipid conditions that can cause elevated LDL-C levels
      and early-onset CAD; see Differential Diagnosis) may also be considered.
    explanation: >-
      Broader testing addresses overlapping inherited lipid disorders.
- name: Cardiovascular Imaging Surveillance
  description: >-
    Monitor lipids and cardiovascular risk throughout life. For severe ARH overlapping clinical HoFH, consensus
    supports baseline and annual echocardiography of the heart and aorta, and specialist-directed coronary
    CT angiography. Repeat CT depends on baseline burden, LDL-C lowering, radiation risk and clinical indication.
    Invasive coronary angiography is reserved for suspected ischemia or valve dysfunction. This is severity-based
    clinical guidance, not a requirement for routine catheterization in every LDLRAP1 patient.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "or autosomal recessive FH (due to homozygous or compound heterozygous pathogenic variants in LDLRAP1) should be monitored with various imaging modalities (including echocardiogram, CT angiogram, and cardiac catheterization) as recommended."
    explanation: >-
      GeneReviews names autosomal recessive FH (biallelic LDLRAP1) explicitly in
      its imaging-surveillance recommendation - the most ARH-specific management
      statement in the chapter.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients with HoFH should receive echocardiographic evaluation of the heart and aorta at baseline and
      annually thereafter.
    explanation: >-
      Class-level guidance for severe disease.
  - reference: PMID:37130090
    reference_title: "2023 Update on European Atherosclerosis Society Consensus Statement on Homozygous Familial Hypercholesterolaemia: new treatments and clinical guidance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Invasive coronary angiography is indicated in patients with symptoms and/or signs suggestive of ischaemia
      or valve malfunction.
    explanation: >-
      Limits invasive investigation to a clinical indication.
- name: Cascade and Carrier Testing
  description: >-
    Offer targeted familial-variant testing to at-risk relatives and parents. Normal lipid levels do not reliably
    identify carriers. Confirm parental segregation to refine recurrence risk and investigate unexpected inheritance,
    including an undetected deletion or uniparental isodisomy.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Carrier testing for at-risk relatives requires prior identification of the LDLRAP1 pathogenic variants
      in the family.
    explanation: >-
      Family-specific molecular testing.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf
    reference_title: "https://www.ncbi.nlm.nih.gov/sites/books/NBK174884/pdf/Bookshelf_NBK174884.pdf"
    supports: SUPPORT

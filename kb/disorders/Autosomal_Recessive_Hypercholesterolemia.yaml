      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    ARH requires two loss-of-function LDLRAP1 alleles (homozygous or compound
    heterozygous). Heterozygous carriers are essentially normolipidemic, which is
    what distinguishes ARH from the dominant FH genes, where a single allele
    raises LDL cholesterol. Each sib of an affected individual has a 25%
    recurrence risk.
  evidence:
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDLRAP1-related FH is caused by biallelic pathogenic variants and is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the recessive mode of inheritance and the requirement for biallelic variants.
  - reference: PMID:24404629
    reference_title: "Familial Hypercholesterolemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The parents of an individual with LDLRAP1-related FH are presumed to be heterozygous for one pathogenic variant."
    explanation: Establishes the obligate-carrier parents that define recessive transmission.
  - reference: PMID:32011344
    reference_title: "Autosomal recessive hypercholesterolemia: update for 2020."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is inherited as a recessive trait and causative mutations, though heterogeneous, are all predicted to be loss-of-function."
    explanation: Confirms recessive inheritance and the loss-of-function nature of the causative alleles.

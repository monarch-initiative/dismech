    Explain recessive inheritance and confirm parental carrier status. Discuss familial testing, partner testing
    and reproductive options. An affected person transmits one pathogenic allele to every child; disease risk
    depends on the partner genotype. Prenatal or preimplantation testing becomes possible after the familial
    variants are known.

name: Autosomal Recessive Hypercholesterolemia
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive hypercholesterolemia (ARH) is caused by biallelic pathogenic LDLRAP1 variants. The encoded
  ARH adaptor couples the LDL receptor to clathrin-dependent internalization. Impaired hepatic LDL uptake produces
  marked LDL-cholesterol elevation, childhood xanthomas and risk of premature coronary disease and aortic valve
  stenosis. The defect is cell-type and ligand dependent: fibroblast LDL uptake can remain normal, whereas
  lymphocyte uptake is impaired; LDLR-dependent VLDL-remnant clearance is largely preserved in knockout mice
  and was increased in a human kinetic study. Receptors present at the cell surface are not equivalent to normal
  clearance, but the defect does not imply uniform absence of receptor activity or treatment response. Statins
  and combination therapies can substantially reduce LDL-C, with variable target attainment. LDLR-independent
  agents and apheresis provide additional options. Sardinian founder alleles are prominent in reported cohorts,
  which do not represent worldwide population frequencies.
synonyms:
- Hypercholesterolemia, familial, 4
- ARH
- LDLRAP1-related familial hypercholesterolemia
- Familial autosomal recessive hypercholesterolemia
- FHCB2
disease_term:
  preferred_term: autosomal recessive hypercholesterolemia (ARH)
  term:
    id: MONDO:0011374
    label: hypercholesterolemia, familial, 4
parents:
- Familial Hypercholesterolemia
notes: >-
  This entry is restricted to biallelic LDLRAP1 disease. LDLR-, APOB- and PCSK9-related hypercholesterolemias
  are molecular differentials. Severe ARH overlaps the clinical homozygous-FH phenotype, but results pooled
  across those genes are not LDLRAP1-specific estimates. Retrospective treatment cohorts, individual cases
  and model experiments have distinct evidential limits; overlapping published patients are not counted as
  independent cohorts. Preserved remnant clearance and variable residual uptake qualify an absolute receptor-internalization
  failure model.

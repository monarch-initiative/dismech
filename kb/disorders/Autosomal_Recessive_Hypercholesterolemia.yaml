- name: Statin plus Ezetimibe (Background Lipid-Lowering Therapy)
  description: >-
    High-intensity or maximally tolerated statin plus ezetimibe is initial combination treatment for severe
    disease, with early escalation according to response and risk. ARH patients can respond substantially:
    in one kinetic study atorvastatin increased LDL apoB fractional catabolism from 0.109 to 0.464/day and
    reduced LDL-C from 8.63 to 4.22 mmol/L. Ezetimibe inhibits intestinal NPC1L1-mediated cholesterol absorption,
    but its downstream LDL-C effect, like statin response, partly depends on residual LDLR-mediated clearance.
    Neither a uniformly absent response nor universal target attainment is supported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

name: Proximal tubulopathy-diabetes mellitus-cerebellar ataxia syndrome
creation_date: "2026-08-18T00:00:00Z"
category: Mendelian
synonyms:
- Proximal tubulopathy, diabetes mellitus and cerebellar ataxia
- Renal tubulopathy, diabetes mellitus, and cerebellar ataxia due to duplication of mitochondrial DNA
disease_term:
  preferred_term: proximal tubulopathy-diabetes mellitus-cerebellar ataxia syndrome
  term:
    id: MONDO:0010798
    label: proximal tubulopathy-diabetes mellitus-cerebellar ataxia syndrome
description: >-
  Proximal tubulopathy-diabetes mellitus-cerebellar ataxia syndrome is an
  ultra-rare maternally transmitted multisystem mitochondrial disorder caused by
  a large-scale rearrangement (a heteroplasmic partial duplication) of
  mitochondrial DNA. It was first described in two sisters who presented in the
  first year of life with a generalized proximal tubulopathy (renal Fanconi
  syndrome) and subsequently developed a pluritissular disorder including
  diabetes mellitus, skin abnormalities, mitochondrial myopathy with ragged-red
  fibers, and cerebellar ataxia; sensorineural deafness, visual failure, and
  osteoporosis are additional features recognized in the OMIM/Orphanet clinical
  synthesis. Respiratory-chain analysis in the index family demonstrated a
  complex III (ubiquinol-cytochrome c reductase) deficiency; the duplication
  junction lies at the mitochondrially encoded cytochrome b gene, the only mtDNA
  subunit of complex III, which offers a plausible mechanistic link.
  The rearranged genome is heteroplasmic and maternally transmitted, and the
  tissue distribution of disease tracks the mutant load in high-energy-demand
  post-mitotic and secretory tissues. It is modeled as a distinct disorder entry
  rather than a subtype of Kearns-Sayre or Pearson syndrome because it has its
  own MONDO/OMIM/Orphanet identity and a proximal-tubule-dominant infantile
  onset; all are related within the large-scale mtDNA rearrangement spectrum.
references:
- reference: PMID:1531167
  title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
- reference: PMID:9226223
  title: Renal failure from mitochondrial cytopathies.
- reference: PMID:38012047
  title: Mitochondrial Dysfunction in Kidney Tubulopathies.
pathophysiology:
- name: Large-Scale Mitochondrial DNA Duplication
  biological_scale: MOLECULAR
  description: >-
    The primary genetic lesion is a heteroplasmic large-scale rearrangement of
    the mitochondrial genome: a ~26 kb partial duplication comprising one
    full-length and one partly deleted mitochondrial genome, with a single
    abnormal junction between the genes for ATPase 6 (MT-ATP6) and cytochrome b
    (MT-CYB). The rearrangement is maternally transmitted, and its mutant load
    varies between tissues.
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Southern blot analysis provided evidence for a heteroplasmic partial duplication of the mtDNA (26 kb), involving one full-length and one partly deleted mitochondrial genome and with one single abnormal junction between the genes for ATPase 6 and cytochrome b."
    explanation: Directly documents the heteroplasmic partial mtDNA duplication and its ATPase6/cytochrome b junction as the primary lesion.
  downstream:
  - target: Respiratory Chain Complex III Deficiency
    causal_link_type: DIRECT
    description: >-
      The rearranged mitochondrial genome produces a respiratory-chain complex
      III deficiency in affected tissue. Because the single abnormal junction
      lies at the cytochrome b gene — the only mitochondrially encoded subunit of
      complex III — a junction-related impairment of cytochrome b expression is a
      plausible mechanistic explanation, though the original report demonstrates
      the biochemical complex III defect and the ATPase6/cytochrome b junction
      without formally establishing that the junction disrupts an otherwise intact
      cytochrome b copy.
- name: Respiratory Chain Complex III Deficiency
  biological_scale: CELLULAR
  description: >-
    Respiratory-chain analysis in affected tissue demonstrated a complex III
    (ubiquinol-cytochrome c reductase) deficiency in both skeletal muscle and
    lymphocytes, reducing oxidative phosphorylation and cellular ATP output.
    Tissues with high oxidative demand and limited regenerative capacity are
    preferentially affected.
  biological_processes:
  - preferred_term: mitochondrial electron transport, ubiquinol to cytochrome c
    modifier: DECREASED
    term:
      id: GO:0006122
      label: mitochondrial electron transport, ubiquinol to cytochrome c
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the mitochondrial respiratory chain showed a complex III deficiency in both skeletal muscle and lymphocytes of the second girl."
    explanation: Establishes complex III deficiency as the biochemical respiratory-chain defect in the index family.
  - reference: PMID:9226223
    reference_title: Renal failure from mitochondrial cytopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These genetic lesions alter mitochondrial oxidative phosphorylation, with a reduction in energy produced for cell activity."
    explanation: Frames the general mechanism by which mtDNA lesions reduce oxidative phosphorylation and cellular energy supply.
  downstream:
  - target: Proximal Tubular Bioenergetic Failure
    causal_link_type: DIRECT
  - target: Endocrine Pancreatic Beta-Cell Dysfunction
    causal_link_type: DIRECT
  - target: Cerebellar ataxia
    causal_link_type: DIRECT
    description: Energy failure in the cerebellum produces progressive cerebellar ataxia.
  - target: Mitochondrial myopathy
    causal_link_type: DIRECT
    description: Skeletal muscle respiratory-chain failure produces a mitochondrial myopathy with ragged-red fibers.
- name: Proximal Tubular Bioenergetic Failure
  biological_scale: TISSUE
  description: >-
    The renal proximal tubule has a high mitochondrial density and depends on
    mitochondrial ATP to drive energy-demanding transepithelial solute
    reabsorption. Respiratory-chain deficiency in proximal tubular epithelium
    impairs reabsorption of amino acids, glucose, phosphate, and
    low-molecular-weight proteins, producing a generalized proximal tubulopathy
    (renal Fanconi syndrome) as the earliest manifestation.
  cell_types:
  - preferred_term: proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  evidence:
  - reference: PMID:38012047
    reference_title: Mitochondrial Dysfunction in Kidney Tubulopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They produce ATP to fuel energy-demanding water and solute reabsorption processes along the nephron."
    explanation: Establishes the ATP dependence of tubular solute reabsorption that mitochondrial failure disrupts.
  - reference: PMID:38012047
    reference_title: Mitochondrial Dysfunction in Kidney Tubulopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial abundance is particularly high in cortical segments, including proximal and distal convoluted tubules."
    explanation: Explains why the proximal tubule is especially vulnerable to a respiratory-chain defect.
  - reference: PMID:9226223
    reference_title: Renal failure from mitochondrial cytopathies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fanconi's syndrome, a benign sign of renal tubulopathy, is particularly frequent in newborns with mitochondrial cytopathy"
    explanation: Supports proximal (Fanconi-type) tubulopathy as a characteristic early renal manifestation of mitochondrial cytopathy.
  downstream:
  - target: Renal Fanconi syndrome
    causal_link_type: DIRECT
- name: Endocrine Pancreatic Beta-Cell Dysfunction
  biological_scale: TISSUE
  description: >-
    Impaired oxidative metabolism in pancreatic beta cells blunts
    glucose-stimulated insulin secretion, contributing to the mitochondrial
    diabetes mellitus that develops during disease progression.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  downstream:
  - target: Diabetes mellitus
    causal_link_type: DIRECT

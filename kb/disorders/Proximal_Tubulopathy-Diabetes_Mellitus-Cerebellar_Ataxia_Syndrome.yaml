inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    Maternal (mitochondrial) transmission of a heteroplasmic large-scale mtDNA
    duplication. In the index family the mother carried minute amounts of the
    duplicated molecules and had ptosis, ophthalmoplegia, and muscle weakness,
    while heteroplasmic mutant load determines expressivity in offspring. This
    was the first reported example of a maternally inherited mtDNA duplication in
    humans.
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using PCR amplification of lymphocyte DNA, we were able to detect minute amounts of duplicated molecules in the mother, which provided evidence for maternal inheritance of the partial duplication."
    explanation: Directly documents maternal (mitochondrial) transmission of the partial mtDNA duplication.
genetic:
- name: MT-CYB
  gene_term:
    preferred_term: MT-CYB
    term:
      id: hgnc:7427
      label: MT-CYB
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: reported in the single molecularly characterised index family
  features: >-
    Not a point mutation. The lesion is a heteroplasmic large-scale (~26 kb)
    partial duplication of the mitochondrial genome, comprising one full-length
    and one partly deleted mitochondrial genome, whose single abnormal junction
    lies between MT-ATP6 and MT-CYB. MT-CYB is implicated by the position of that
    junction and by the biochemistry: cytochrome b is the only mitochondrially
    encoded subunit of complex III, and the family showed a complex III
    deficiency. The original report does not establish that the junction disrupts
    an otherwise intact cytochrome b copy, so gene-level causation here is
    positional and biochemical rather than a demonstrated coding change.
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with one single abnormal junction between the genes for ATPase 6 and cytochrome b"
    explanation: Locates the duplication's single abnormal junction at the cytochrome b (MT-CYB) boundary.
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the mitochondrial respiratory chain showed a complex III deficiency in both skeletal muscle and lymphocytes of the second girl."
    explanation: >-
      The complex III deficiency is the biochemical counterpart implicating
      cytochrome b, the sole mitochondrially encoded complex III subunit.
- name: MT-ATP6
  gene_term:
    preferred_term: MT-ATP6
    term:
      id: hgnc:7414
      label: MT-ATP6
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  presence: reported in the single molecularly characterised index family
  features: >-
    The second boundary gene of the same heteroplasmic large-scale mtDNA partial
    duplication — the single abnormal junction lies between MT-ATP6 and MT-CYB.
    Recorded because the junction defines the lesion at this locus, not because an
    MT-ATP6 coding variant was identified; no ATPase 6 point mutation was reported
    and no complex V defect was demonstrated in this family. Typed UNKNOWN rather
    than CAUSATIVE for exactly that reason: the structured relationship is what
    exports as a gene-disease causal edge, and nothing in the report establishes
    that MT-ATP6 disruption contributes to the phenotype. Contrast MT-CYB, where
    positional and biochemical evidence coincide.
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with one single abnormal junction between the genes for ATPase 6 and cytochrome b"
    explanation: Locates the duplication's single abnormal junction at the ATPase 6 (MT-ATP6) boundary.

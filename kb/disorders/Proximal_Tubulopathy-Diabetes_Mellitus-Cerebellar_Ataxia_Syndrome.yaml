- name: Recurrent dehydration and salt-wasting crises
  description: >-
    Episodes of severe dehydration and electrolyte crisis from the renal
    salt-wasting proximal tubulopathy, typically precipitated by intercurrent
    illness, are the dominant acute complication and the reported cause of death
    in the index family. This is documented in the full clinical report and the
    OMIM/Orphanet synthesis rather than the index-family abstract, so no primary
    snippet is attached here.
  phenotype_term:
    preferred_term: Dehydration
    term:
      id: HP:0001944
      label: Dehydration
- name: Abnormal skin pigmentation
  description: >-
    Skin abnormalities, described in the OMIM/Orphanet synthesis as
    erythrocyanosis and abnormal cutaneous pigmentation.
  phenotype_term:
    preferred_term: Abnormality of skin pigmentation
    term:

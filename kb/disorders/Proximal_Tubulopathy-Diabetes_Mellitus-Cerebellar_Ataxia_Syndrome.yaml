- name: Sensorineural hearing impairment
  description: >-
    Progressive sensorineural deafness is a recognized feature of the syndrome
    in the OMIM/Orphanet clinical synthesis and is characteristic of the broader
    mtDNA rearrangement spectrum. Not separately documented in the index-family
    abstract, so no primary snippet is attached here.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
- name: Visual impairment
  description: >-
    Progressive visual failure (culminating in blindness, with pigmentary
    retinopathy) is recognized in the OMIM/Orphanet clinical synthesis. Not
    separately documented in the index-family abstract, so no primary snippet is
    attached here.
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
- name: Osteoporosis
  description: >-
    Reduced bone mineral density developing during childhood, recognized in the
    OMIM/Orphanet clinical synthesis and mechanistically compatible with
    secondary renal phosphate and calcium wasting from the proximal tubulopathy.
    Not separately documented in the index-family abstract, so no primary
    snippet is attached here.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
inheritance:
- name: Mitochondrial inheritance
  inheritance_term:
    preferred_term: Mitochondrial inheritance
    term:
      id: HP:0001427
      label: Mitochondrial inheritance
  description: >-
    Maternal (mitochondrial) transmission of a heteroplasmic large-scale mtDNA
    duplication. In the index family the mother carried minute amounts of the
    duplicated molecules and had ptosis, ophthalmoplegia, and muscle weakness,
    while heteroplasmic mutant load determines expressivity in offspring. This
    was the first reported example of a maternally inherited mtDNA duplication in
    humans.
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using PCR amplification of lymphocyte DNA, we were able to detect minute amounts of duplicated molecules in the mother, which provided evidence for maternal inheritance of the partial duplication."
    explanation: Directly documents maternal (mitochondrial) transmission of the partial mtDNA duplication.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare; the defining description is a single family (two affected sisters
    and their oligosymptomatic carrier mother).
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two sisters in the first year of life presented with a proximal tubulopathy of unknown etiology."
    explanation: The syndrome's defining report describes a single sibship, consistent with an ultra-rare, literature-only occurrence.
treatments:
- name: Electrolyte and Alkali Replacement
  description: >-
    Supportive correction of the urinary losses of the proximal tubulopathy —
    bicarbonate for renal tubular acidosis and phosphate, potassium, and fluid
    replacement — to prevent life-threatening dehydration and electrolyte crises
    and to support bone mineralization.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Insulin Therapy
  description: >-
    Insulin replacement for the mitochondrial diabetes mellitus that develops
    during disease progression. Metformin is generally avoided in mitochondrial
    diabetes because of the elevated risk of lactic acidosis.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Genetic Counseling
  description: >-
    Counseling for the family on the maternal (mitochondrial) inheritance of the
    mtDNA duplication and its heteroplasmic, variable expressivity, and on
    reproductive options.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
diagnosis:
- name: Skeletal muscle biopsy with respiratory-chain analysis
  description: >-
    Skeletal muscle biopsy shows ragged-red fibers, and biochemical analysis of
    the mitochondrial respiratory chain demonstrates a complex III
    (ubiquinol-cytochrome c reductase) deficiency, confirming a mitochondrial
    cytopathy.
  diagnosis_term:
    preferred_term: muscle biopsy
    term:
      id: NCIT:C51895
      label: Muscle Biopsy
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the mitochondrial respiratory chain showed a complex III deficiency in both skeletal muscle and lymphocytes of the second girl."
    explanation: Respiratory-chain enzymology on affected tissue establishes the complex III deficiency.
- name: Mitochondrial DNA analysis
  description: >-
    Molecular analysis of mitochondrial DNA (Southern blot and PCR) identifies
    the heteroplasmic partial duplication and its abnormal junction, and can
    detect the low-level rearrangement in the transmitting mother.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:1531167
    reference_title: "Maternally inherited duplication of the mitochondrial genome in a syndrome of proximal tubulopathy, diabetes mellitus, and cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Southern blot analysis provided evidence for a heteroplasmic partial duplication of the mtDNA (26 kb), involving one full-length and one partly deleted mitochondrial genome and with one single abnormal junction between the genes for ATPase 6 and cytochrome b."
    explanation: Southern blot analysis is the molecular test that established the diagnostic mtDNA duplication.

treatments:
- name: Electrolyte and Alkali Replacement
  description: >-
    Supportive correction of the urinary losses of the proximal tubulopathy —
    bicarbonate for renal tubular acidosis and phosphate, potassium, and fluid
    replacement — to prevent life-threatening dehydration and electrolyte crises
    and to support bone mineralization.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24386581
    reference_title: "Successful Medical Therapy for Hypophosphatemic Rickets due to Mitochondrial Complex I Deficiency Induced de Toni-Debré-Fanconi Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with phosphate (50-70 mg/kg/day), calcitriol (30 ng/kg/day), and sodium citrate with resolution of bone pain and normal growth."
    explanation: >-
      Documents the alkali-plus-phosphate replacement regimen and its response in a
      mitochondrial de Toni-Debré-Fanconi tubulopathy. Cited for the supportive
      replacement approach in mitochondrial proximal tubulopathy generally — the
      case carries a complex I deficiency rather than this syndrome's complex III
      defect, so it is not a report of treatment in this disease.
- name: Insulin Therapy
  description: >-
    Insulin replacement for the mitochondrial diabetes mellitus that develops
    during disease progression. Metformin is generally avoided in mitochondrial
    diabetes because of the elevated risk of lactic acidosis.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

  association: >-
    Heterozygous UQCRC1 missense variants cause autosomal dominant parkinsonism
    with polyneuropathy. The gene encodes core protein 1 of mitochondrial
    respiratory chain complex III, a subunit of the complex III homodimer.
    The founding variant p.Tyr314Ser (c.941A>C) and p.Ile311Leu (c.931A>C)
    co-segregate with disease in two Taiwanese families; a Japanese family (C)
    carries a splice/frameshift allele whose segregation could not be tested.
    All three alter residues conserved across species.
  notes: >-
    UQCRC1's role in Parkinson disease is debated. Candidate-gene cohorts in
    Europe, China and Taiwan did not replicate an association, whereas a UK Biobank analysis found rare
    protein-truncating variants associated with Parkinson disease risk and a
    separate Austrian family shares a rare missense variant. The conflict is
    carried in the CONTROVERSY discussion. No ClinGen/GenCC classification was
    found, so `gene_disease_validity` is left absent.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional analysis of 699 unrelated Parkinson's disease probands with autosomal-dominant Parkinson's disease and 1934 patients with sporadic Parkinson's disease revealed another two variants in UQCRC1 in the probands with familial Parkinson's disease, c.931A>C (p.Ile311Leu) and an allele with concomitant splicing mutation (c.70-1G>A) and a frameshift insertion (c.73_74insG, p.Ala25Glyfs*27)."
    explanation: The three reported alleles across the discovery families.
  - reference: PMID:30788857
    reference_title: "A clinical and genetic study of early-onset and familial parkinsonism in taiwan: An integrated approach combining gene dosage analysis and next-generation sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel missense mutation in the UQCRC1 gene was found in a family with autosomal-dominant inheritance parkinsonism via whole-exome sequencing analysis."
    explanation: The first report of the UQCRC1 variant in the index family, from the Taiwanese cohort study that preceded the functional paper.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "UQCRC1 p.Tyr314Ser knock-in Drosophila and mouse models exhibit age-dependent locomotor defects, dopaminergic neuronal loss, peripheral neuropathy, impaired respiratory chain complex III activity and aberrant mitochondrial ultrastructures in nigral neurons."
    explanation: Functional validation of pathogenicity in two model organisms.
  - reference: PMID:40346065
    reference_title: "Protein-truncating variants in UQCRC1 are associated with Parkinson's disease: evidence from half-million people."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We observed a significant combined association between HC PTVs in UQCRC1 and higher risk of PD"
    explanation: Population-scale genetic support for UQCRC1, through loss-of-function variants rather than the original missense alleles.
  variants:
  - name: p.Tyr314Ser
    description: >-
      c.941A>C (RefSeq NM_003365.2), the founding variant, identified in
      Taiwanese Family A and co-segregating with parkinsonism. Tyr314 is a
      conserved residue at the complex III homodimer interface; substitution to
      serine is predicted to disrupt side-chain packing and destabilise the
      complex, and the knock-in cell, fly and mouse models carry this allele.
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Monomers of UQCRC1 Ile311 and Tyr314 are required in complex III homodimerization (Fig. 1F, left)"
      explanation: Structural role of the mutated residue in homodimerisation, read from the published complex III structure in the authors' in silico analysis.
  - name: p.Ile311Leu
    description: >-
      c.931A>C, identified in Taiwanese Family B and co-segregating with
      parkinsonism. Ile311 points into the hydrophobic core; the aliphatic
      substitution is predicted to alter packing of nearby side chains.
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "UQCRC1 c.931A>C (p.Ile311Leu) also co-segregated with parkinsonism within the family (Family B in Fig. 1A)."
      explanation: Co-segregation of the second missense allele.
  - name: p.Gly405Val
    description: >-
      c.1214G>T, a rare missense variant shared by three unrelated Austrian
      Parkinson's patients with a positive family history; allele frequency
      2x10^-6 in gnomAD. The authors suggest it probably contributes to disease;
      the abstract reports no segregation or functional data.
    evidence:
    - reference: PMID:39752790
      reference_title: "A rare variant in the UQCRC1 gene, p.(Gly405Val) in three Austrian Parkinson's patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found three unrelated patients with a positive family history of the disease who shared the same rare missense variant in the UQCRC1 gene: c.1214G > T; p.(Gly405Val)."
      explanation: A second, independent population with a rare UQCRC1 missense variant.
pathophysiology:
- name: UQCRC1 Homodimer-Interface Missense Variant
  description: >-
    Heterozygous p.Tyr314Ser or p.Ile311Leu alters a conserved residue at the
    complex III homodimer interface. In silico structural modelling predicts
    both substitutions destabilise the homodimer, and because UQCRC1 carries no
    Q-cycle catalytic activity the effect is on complex stability rather than on
    a lost enzymatic function. The discovery report proposes a dominant-negative
    action on the homodimer; that is a hypothesis, and the later association of
    protein-truncating variants with Parkinson disease would instead fit
    haploinsufficiency, so the functional impact category is recorded as
    unknown.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
  genes:
  - preferred_term: UQCRC1
    term:
      id: hgnc:12585
      label: UQCRC1
  molecular_functions:
  - preferred_term: complex III ubiquinol-cytochrome c reductase activity, to which UQCRC1 contributes as a non-catalytic core subunit
    term:
      id: GO:0008121
      label: quinol-cytochrome-c reductase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Complex III Homodimer Destabilization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Both substitutions may therefore lead to destabilization of complex III protein structure, which is a homodimer, and have the potential to influence mitochondrial respiratory chain complex III activity."
      explanation: The modelling links both interface substitutions to destabilisation of the complex III homodimer.
  - target: Cytochrome c Release and Neuronal Apoptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cytochrome c arm is reported for loss of UQCRC1 itself (neuronal
      knockdown or knockout of the fly gene), through the protein's association
      with cytochrome c, and the source does not route it through complex III
      activity, respiration or reactive oxygen species. It is therefore drawn
      from the variant and not from those nodes. That the patient missense
      alleles release cytochrome c has not been shown directly; the link to the
      disease allele is that it fails to rescue the knockout.
    evidence:
    - reference: PMID:34551295
      reference_title: UQCRC1 engages cytochrome c for neuronal apoptotic cell death.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Lethality of uqcrc1-KO is also rescued by neuronally expressing UQCRC1, but not the disease-causing variant, providing a platform to discern the pathogenicity of this mutation."
      explanation: In the fly, the disease variant cannot replace the wild-type protein, which ties the loss-of-UQCRC1 findings of this study to the patient allele by inference.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UQCRC1 is one of the core proteins of complex III, a subunit required for oxidative phosphorylation and ATP synthesis"
    explanation: Identifies UQCRC1 as a structural core subunit of complex III.
- name: Complex III Homodimer Destabilization
  description: >-
    Ile311 and Tyr314 sit where the two UQCRC1 monomers of the complex III
    homodimer meet. In silico modelling on the published human complex III
    structure predicts that p.Ile311Leu alters the packing of neighbouring side
    chains and that p.Tyr314Ser removes an aromatic ring and disturbs van der
    Waals packing, so that both destabilise the homodimer. This step is a
    structural prediction: the discovery report did not measure complex III
    assembly or abundance in patient or model tissue.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: respiratory chain complex III
    term:
      id: GO:0045275
      label: respiratory chain complex III
  downstream:
  - target: Reduced Complex III Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "the genetic substitutions may destabilize the complex III homodimer protein structure, as predicted in our in silico structure analysis, and perturb mitochondria function"
      explanation: The authors link the predicted destabilisation of the homodimer to disturbed mitochondrial function.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Substitution from Tyr (-C6H5OH) to Ser (-CH2-OH) disrupts the stacking of the aromatic rings and would disturb side-chain-to-side-chain van der Waals packing."
    explanation: The modelled structural effect of p.Tyr314Ser at the homodimer interface.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A substitution of Ile (CH3-) to Leu (CH3-CH2-), although a modest aliphatic change, alters the packing of nearby side chains in the structure and potentially influences the activity of respiratory complex III."
    explanation: The modelled structural effect of p.Ile311Leu.
- name: Reduced Complex III Activity
  description: >-
    The variant selectively reduces mitochondrial respiratory chain complex III
    activity while sparing complexes I, II and IV, measured in knock-in
    dopaminergic cells and in the substantia nigra and striatum of knock-in
    mice.

    reference_title: "UQCRC1 deficiency impairs mitophagy via PINK1-dependent mechanisms in Parkinson's disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Leveraging the SH-SY5Y cells and fly models, we showed that mitophagy was impaired upon UQCRC1 mutation or depletion. Notably, insufficiency of PINK1 mRNA was associated with UQCRC1 deficiency, and overexpression of Pink1 rescued the locomotion and mitophagy defects in the fly models with neuronal loss of uqcrc1."
    explanation: Impaired mitophagy downstream of UQCRC1 deficiency, PINK1-dependent and rescuable.
- name: Cytochrome c Release and Neuronal Apoptosis
  description: >-
    UQCRC1 associates with cytochrome c; loss of UQCRC1 increases cytoplasmic
    cytochrome c and activates the caspase cascade, driving neuronal apoptotic
    death. Depleting cytochrome c or expressing an anti-apoptotic protein
    ameliorates the UQCRC1-mediated neurodegeneration in Drosophila.

name: UQCRC1-Related Parkinsonism With Polyneuropathy
creation_date: "2026-11-21T00:00:00Z"
category: Mendelian
description: >-
  UQCRC1-related parkinsonism with polyneuropathy (PKNPY; OMIM 619279) is a
  late-onset autosomal dominant movement disorder first described in 2020 in
  Taiwanese and Japanese families. UQCRC1 encodes ubiquinol-cytochrome c
  reductase core protein 1, one of the two non-catalytic core proteins of
  mitochondrial respiratory chain complex III; it carries no Q-cycle redox
  chemistry itself but stabilises the complex III homodimer. The reported
  heterozygous missense variants p.Tyr314Ser and p.Ile311Leu alter conserved
  residues required for homodimerisation, and structural modelling and
  functional assays indicate they destabilise the complex and selectively
  reduce complex III activity, raising reactive oxygen species and impairing
  ATP production. Affected carriers develop asymmetrical, tremor-predominant,
  levodopa-responsive parkinsonism with onset between the late forties and the
  mid-sixties, together with a slowly progressive, length-dependent axonal
  sensorimotor polyneuropathy that begins distally in the limbs, often years
  before the motor signs; anxiety is common. CRISPR knock-in human
  dopaminergic cells, Drosophila and mice recapitulate age-dependent locomotor
  decline, nigral dopaminergic loss, striatal dopamine deficiency and
  peripheral nerve degeneration, and the mouse motor phenotype improves with
  levodopa. The gene's status as a Parkinson disease gene is contested:
  multiple candidate-gene cohorts in European and Chinese populations did not
  replicate an association, while a UK Biobank analysis of ~500,000 people
  linked rare UQCRC1 protein-truncating variants to Parkinson disease risk and
  a further Austrian family and functional studies support pathogenicity.

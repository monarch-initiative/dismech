- name: Impaired PINK1-Dependent Mitophagy
  description: >-
    OXPHOS stress from UQCRC1 deficiency impairs mitophagy, with reduced PINK1
    mRNA; PINK1 overexpression or PINK1 activators rescue locomotion and
    mitophagy defects in UQCRC1-deficient fly and cell models, identifying PINK1
    as a candidate therapeutic axis. This is reported for UQCRC1 depletion and
    mutation in SH-SY5Y and fly models.
  biological_scale: CELLULAR
  biological_processes:

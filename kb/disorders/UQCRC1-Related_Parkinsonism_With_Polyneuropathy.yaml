- name: UQCRC1 p.Tyr314Ser knock-in Drosophila
  species: Fruit fly
  genotype: >-
    Human UQCRC1 p.Tyr314Ser transgene expressed in a heterozygous endogenous
    Drosophila UQCR-C1 (CG3731) null background (Actin-GAL4)
  genes:
  - preferred_term: UQCR-C1 (fly ortholog, CG3731)
    term:
      id: FB:FBgn0038271
      label: UQCR-C1
  publication: PMID:33141179
  description: >-
    Human wild-type or p.Tyr314Ser UQCRC1 was expressed on a heterozygous
    Drosophila UQCR-C1 null background to mimic the human heterozygous state.
    Mutant flies show age-dependent locomotor decline, shortened lifespan,
    loss of TH-positive dopaminergic neurons, and reduced neuromuscular-junction
    bouton numbers, without alpha-synuclein pathology. The endogenous fly gene
    is knocked out and a human transgene supplies the variant, so the model
    acts through the human allele on the fly ortholog's null background.
  modeled_mechanisms:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Age-dependent loss of TH-positive neurons in the fly dopaminergic clusters;
      flies lack a nigrostriatal system, so the node is matched by the fly's
      analogous dopaminergic neurons.
    limitations: >-
      Drosophila has no substantia nigra or striatum; the degeneration is of
      the fly PPM/PPL dopaminergic clusters, an analogue rather than the human
      nigrostriatal pathway.
    divergences:

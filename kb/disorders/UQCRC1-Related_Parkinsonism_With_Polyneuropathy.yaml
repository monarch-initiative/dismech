    mapping_justification: >-
      Primary MONDO identifier for this entry. MONDO:0036193 is MONDO's class
      for OMIM 619279 (PKNPY) and Orphanet 611237, the UQCRC1-related
      autosomal dominant parkinsonism with polyneuropathy. The entry's name is
      narrower than the MONDO label (which names the phenotype without the
      gene), so the gene is added in the entry name while the MONDO label is
      kept here and in synonyms.
notes: >-
  **The clinical picture rests on a small number of families.** The defining
  phenotype comes from the three families (A, B and C) reported in
  PMID:33141179, eight carriers in all, plus the single Austrian p.Gly405Val
  family (PMID:39752790) and one further variant case (PMID:41783485). No
  population frequency is recorded. The ascending distal sensorimotor
  neuropathy and the anxiety are documented in Family A, whose five carriers
  had nerve conduction studies; nerve conduction data were not available for
  Families B and C, so their neuropathy status is not established.

  **UQCRC1's status as a Parkinson disease gene is genuinely contested, and the
  entry records both sides.** After the 2020 discovery, candidate-gene screens
  in European cohorts (PMID:33248804, PMID:34286409) and Chinese and Taiwanese
  cohorts (PMID:32666668, PMID:33779694, PMID:37984314, PMID:36570444) did not
  replicate an association of UQCRC1 variants with Parkinson disease, and none
  found the original p.Tyr314Ser variant outside Taiwan. A UK Biobank analysis
  of about half a million people (PMID:40346065) then found rare
  protein-truncating variants in UQCRC1 associated with Parkinson disease
  (OR 6.59), and a further Austrian family (PMID:39752790) shares a different
  rare missense variant. The replication controversy is curated as a
  CONTROVERSY discussion rather than being asserted away. The original report
  itself notes the small size of Families B and C and the lack of post-mortem
  tissue.

  **No ClinGen/GenCC gene-disease validity classification was found for
  UQCRC1-PKNPY** (no cached CGGV record; 2026-11-21), so `gene_disease_validity`
  is left absent rather than assigning a tier. `relationship_type: CAUSATIVE`
  records the original authors' reading from co-segregation plus functional
  validation in two model organisms; the replication dispute is in the
  CONTROVERSY discussion.

  **No GeneReviews chapter exists** for UQCRC1-related parkinsonism with
  polyneuropathy or for the UQCRC1 gene (checked 2026-11-21); the phenotype
  baseline is taken from the primary discovery report.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous UQCRC1 missense variants co-segregate with disease in an
    autosomal dominant pattern in Families A and B; model phenotypes were
    reproduced in heterozygous knock-in animals. A dominant-negative effect on
    the complex III homodimer is proposed as the mechanism of dominance.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous substitution c.941A>C (p.Tyr314Ser) in the mitochondrial ubiquinol-cytochrome c reductase core protein 1 (UQCRC1) gene, which co-segregates with disease within the family."
    explanation: Heterozygous variant co-segregating within the index family.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the mutations in UQCRC1 are in a heterozygous state, the genetic substitutions may destabilize the complex III homodimer protein structure, as predicted in our in silico structure analysis, and perturb mitochondria function. These effects may result in a dominant negative effect and an autosomal-dominant inheritance pattern"
    explanation: The proposed dominant-negative basis of the autosomal dominant inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. Fewer than a dozen families
    carrying putatively pathogenic UQCRC1 variants have been reported, and the
    original missense variants were absent from more than a thousand controls
    and from biobank exomes. Do not read this record as a measured rate.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All substitutions were absent in 1077 controls and the Taiwan Biobank exome database from healthy participants (n = 1517 exomes)."
    explanation: Rarity of the variants in control and biobank data; supports the very-rare band without measuring prevalence.
progression:
- phase: Age at onset
  notes: >-
    Parkinsonism onset ranged from 42 to 69 years across the reported families.
    The sensorimotor neuropathy in Family A began earlier, in the early
    twenties, years before the parkinsonism, and is slowly progressive.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset ages ranged from 40 to 60 years (Table 1)."
    explanation: Age-at-onset range for the parkinsonism.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients having UQCRC1 p.Tyr314Ser heterozygotes also had slowly progressive onset of numbness and weakness of feet followed by hand muscles involvement beginning in their early twenties."
    explanation: The earlier-onset, slowly progressive neuropathy preceding the motor signs.
genetic:
- name: UQCRC1
  gene_term:
    preferred_term: UQCRC1
    term:
      id: hgnc:12585
      label: UQCRC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: present
  association: >-
    Heterozygous UQCRC1 missense variants cause autosomal dominant parkinsonism
    with polyneuropathy. The gene at 3p21.3 encodes the 480-residue core
    protein 1 of mitochondrial respiratory chain complex III, a non-catalytic
    subunit required for assembly and stability of the complex III homodimer.
    The founding variant p.Tyr314Ser (c.941A>C) and p.Ile311Leu (c.931A>C)
    co-segregate with disease in two Taiwanese families; a Japanese family (C)
    carries a splice/frameshift allele. All alter conserved residues at the
    homodimer interface.
  notes: >-
    UQCRC1's role in Parkinson disease is debated. Candidate-gene cohorts in
    Europe and China did not replicate an association and did not find the
    original variants outside Taiwan, whereas a UK Biobank analysis found rare
    protein-truncating variants associated with Parkinson disease risk and a
    separate Austrian family shares a rare missense variant. The conflict is
    carried in the CONTROVERSY discussion. No ClinGen/GenCC classification was
    found, so `gene_disease_validity` is left absent.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional analysis of 699 unrelated Parkinson's disease probands with autosomal-dominant Parkinson's disease and 1934 patients with sporadic Parkinson's disease revealed another two variants in UQCRC1 in the probands with familial Parkinson's disease, c.931A>C (p.Ile311Leu) and an allele with concomitant splicing mutation (c.70-1G>A) and a frameshift insertion (c.73_74insG, p.Ala25Glyfs*27)."
    explanation: The three reported alleles across the discovery families.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "UQCRC1 p.Tyr314Ser knock-in Drosophila and mouse models exhibit age-dependent locomotor defects, dopaminergic neuronal loss, peripheral neuropathy, impaired respiratory chain complex III activity and aberrant mitochondrial ultrastructures in nigral neurons."
    explanation: Functional validation of pathogenicity in two model organisms.
  - reference: PMID:40346065
    reference_title: "Protein-truncating variants in UQCRC1 are associated with Parkinson's disease: evidence from half-million people."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We observed a significant combined association between HC PTVs in UQCRC1 and higher risk of PD"
    explanation: Population-scale genetic support for UQCRC1, through loss-of-function variants rather than the original missense alleles.
  variants:
  - name: p.Tyr314Ser
    description: >-
      c.941A>C (RefSeq NM_003365.2), the founding variant, identified in
      Taiwanese Family A and co-segregating with parkinsonism. Tyr314 is a
      conserved residue at the complex III homodimer interface; substitution to
      serine is predicted to disrupt side-chain packing and destabilise the
      complex, and the knock-in cell, fly and mouse models carry this allele.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Monomers of UQCRC1 Ile311 and Tyr314 are required in complex III homodimerization (Fig. 1F, left)"
      explanation: Structural role of the mutated residue in homodimerisation.
  - name: p.Ile311Leu
    description: >-
      c.931A>C, identified in Taiwanese Family B and co-segregating with
      parkinsonism. Ile311 points into the hydrophobic core; the aliphatic
      substitution is predicted to alter packing of nearby side chains.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "UQCRC1 c.931A>C (p.Ile311Leu) also co-segregated with parkinsonism within the family (Family B in Fig. 1A)."
      explanation: Co-segregation of the second missense allele.
  - name: p.Gly405Val
    description: >-
      c.1214G>T, a rare missense variant shared by three unrelated Austrian
      Parkinson's patients with a positive family history; allele frequency
      2x10^-6 in gnomAD. Reported as probably contributing to disease, extending
      the evidence beyond the original Taiwanese families.
    clinical_significance: UNCERTAIN_SIGNIFICANCE
    evidence:
    - reference: PMID:39752790
      reference_title: "A rare variant in the UQCRC1 gene, p.(Gly405Val) in three Austrian Parkinson's patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We found three unrelated patients with a positive family history of the disease who shared the same rare missense variant in the UQCRC1 gene: c.1214G > T; p.(Gly405Val)."
      explanation: A second, independent population with a rare UQCRC1 missense variant.
pathophysiology:
- name: UQCRC1 Homodimer-Interface Missense Variant
  description: >-
    Heterozygous p.Tyr314Ser or p.Ile311Leu alters a conserved residue at the
    complex III homodimer interface. In silico structural modelling predicts
    both substitutions destabilise the homodimer, and because UQCRC1 carries no
    Q-cycle catalytic activity the effect is on complex stability rather than on
    a lost enzymatic function; a dominant-negative action on the homodimer is
    proposed to explain the dominant inheritance.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  genes:
  - preferred_term: UQCRC1
    term:
      id: hgnc:12585
      label: UQCRC1
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  downstream:
  - target: Complex III Destabilization and Reduced Complex III Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "Both substitutions may therefore lead to destabilization of complex III protein structure, which is a homodimer, and have the potential to influence mitochondrial respiratory chain complex III activity."
      explanation: Links the interface variant to destabilisation of the complex and reduced activity.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "UQCRC1 is one of the core proteins of complex III, a subunit required for oxidative phosphorylation and ATP synthesis"
    explanation: Identifies UQCRC1 as a structural core subunit of complex III.
- name: Complex III Destabilization and Reduced Complex III Activity
  description: >-
    The variant selectively reduces mitochondrial respiratory chain complex III
    activity while sparing complexes I, II and IV, measured in knock-in
    dopaminergic cells and in the substantia nigra and striatum of knock-in
    mice.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: electron transfer from ubiquinol to cytochrome c (complex III)
    term:
      id: GO:0006122
      label: "mitochondrial electron transport, ubiquinol to cytochrome c"
    modifier: DECREASED
  cellular_components:
  - preferred_term: respiratory chain complex III
    term:
      id: GO:0045275
      label: respiratory chain complex III
  downstream:
  - target: Mitochondrial Respiratory Dysfunction and Oxidative Stress
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UQCRC1 p.Tyr314Ser expression had no obvious influence on mitochondrial complex I, II, or IV activity (Fig. 2F and G; statistics in Fig. 2H), but remarkably reduced the oxygen consumption of complex III activity"
    explanation: The selective reduction of complex III activity in knock-in cells.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The complex III activity in substantia nigra and striatum of UQCRC1 p.Tyr314Ser knock-in mice was significantly reduced compared to wild-type littermates, starting from 7 months of age"
    explanation: Confirms the complex III deficit in the relevant brain regions in vivo.
- name: Mitochondrial Respiratory Dysfunction and Oxidative Stress
  description: >-
    Reduced complex III activity lowers maximal respiration and ATP production
    and raises reactive oxygen species in dopaminergic cells, with abnormal
    mitochondrial ultrastructure in nigral neurons. This bioenergetic and
    oxidative stress is the shared cellular lesion upstream of the neuronal
    phenotypes.
  biological_scale: CELLULAR
  cell_types:

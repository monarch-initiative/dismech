    description: Smaller neuromuscular junctions with reduced bouton numbers, a presynaptic peripheral motor nerve defect.
    limitations: The fly NMJ is a larval glutamatergic synapse, not a mammalian peripheral nerve, so the correspondence is of synaptic structure rather than myelinated axon.
    readouts:

      explanation: Supports treating the fly NMJ defect as informative for the peripheral neuropathy node.
diagnosis:
- name: UQCRC1 sequencing
  description: >-
    The diagnosis is molecular: a heterozygous UQCRC1 variant found by exome
    sequencing or by sequencing the gene's exons and exon-intron boundaries, in
    a person with late-onset parkinsonism, with or without polyneuropathy. The
    index variant was found by whole exome sequencing of three affected family
    members after a 40-gene parkinsonism panel was negative, and the other two
    alleles by Sanger sequencing of UQCRC1 in familial probands. There is no
    biochemical or imaging test specific to this disease.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  results: Heterozygous UQCRC1 variant (reported alleles p.Tyr314Ser, p.Ile311Leu, and c.70-1G>A with p.Ala25Glyfs*27).
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing was performed in three affected members of the index family with a late-onset autosomal-dominant parkinsonism and polyneuropathy."
    explanation: Exome sequencing identified the index variant.
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants were confirmed by Sanger sequencing (Fig. 1B) and were absent from the public databases."
    explanation: Sanger confirmation of the three reported alleles.
- name: Nerve conduction study
  description: >-
    Nerve conduction studies show the axonal-predominant sensorimotor
    polyneuropathy, including in a carrier in whom polyneuropathy was not
    recorded clinically. They were done only in Family A.
  diagnosis_term:
    preferred_term: nerve conduction study
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  results: Reduced ulnar motor and sensory amplitudes and absent sural sensory action potentials.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies of all affected members revealed axonal type-predominant sensorimotor polyneuropathy; EMG studies revealed neurogenic polyphasic waves in sampled distal muscles (Table 1)."
    explanation: The electrophysiological finding in Family A.
- name: Dopamine transporter SPECT
  description: >-
    Tc-99m TRODAT SPECT showed asymmetric striatal dopamine transporter loss in
    the one carrier imaged, a pattern like that of idiopathic Parkinson disease
    and therefore not specific to this disease.
  diagnosis_term:
    preferred_term: dopamine transporter SPECT
    term:
      id: NCIT:C17203
      label: Single Photon Emission Computed Tomography
  results: Asymmetric loss of striatal dopamine transporter uptake.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Asymmetric loss of the dopamine transporter was detected by Tc-99m TRODAT single-photon emission computed tomography (SPECT) in one affected member (Patient II-4) from Family A, mimicking idiopathic Parkinson’s disease."
    explanation: The imaging finding, in a single patient.
experimental_models:
- name: UQCRC1 knock-in SH-SY5Y cells
  experimental_model_type: CELL_LINE
  description: >-
    Human SH-SY5Y neuroblastoma cells carrying heterozygous CRISPR/Cas9
    knock-in of p.Tyr314Ser, p.Ile311Leu or the Family C splice allele,
    differentiated with retinoic acid. They show shorter neurites, lower
    maximal respiration and ATP production, more reactive oxygen species and a
    selective complex III deficit, most marked for p.Tyr314Ser. Later studies
    used the same cell model to show reduced induced mitophagy and, in a
    preliminary report, restoration of complex III-linked respiration by the
    beta-2 agonist formoterol.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  genes:
  - preferred_term: UQCRC1
    term:
      id: hgnc:12585
      label: UQCRC1
  publication: PMID:33141179
  modeled_mechanisms:
  - target: Reduced Complex III Activity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Inhibitor-resolved respirometry shows a deficit confined to complex III in p.Tyr314Ser cells.
    limitations: >-
      SH-SY5Y is a proliferating neuroblastoma line differentiated in culture,
      not a nigral dopaminergic neuron, and complex activity was resolved only
      for the p.Tyr314Ser allele.
    readouts:
    - name: Complex III-linked oxygen consumption
      target: Reduced Complex III Activity
      direction: DECREASED
      interpretation: Complex III-dependent respiration is reduced while complexes I, II and IV are unchanged.
      evidence:
      - reference: PMID:33141179
        reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This finding suggests that UQCRC1 p.Tyr314Ser disturbs mitochondrial respiratory chain complex III activity in SH-SY5Y cells."
        explanation: The authors' reading of the inhibitor-resolved respirometry.
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutant UQCRC1 expression leads to neurite degeneration and mitochondrial respiratory chain dysfunction in SH-SY5Y cells."
      explanation: Supports treating the knock-in cells as informative for the respiratory chain defect.
  - target: Increased Reactive Oxygen Species Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Mutant cells produce more reactive oxygen species at baseline and after 6-hydroxydopamine.
    limitations: A cultured cell line under high-glucose medium may not reflect the redox state of neurons in tissue.
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our findings show both coding substitutions and the aberrant splicing variant impair neurite growth, reduced mitochondrial respiration activity, decrease ATP and elevate reactive oxygen species production."
      explanation: All three family alleles raise reactive oxygen species and lower respiration and ATP in the knock-in cells.
  evidence:
  - reference: PMID:38666843
    reference_title: "Formoterol Acting via β2-Adrenoreceptor Restores Mitochondrial Dysfunction Caused by Parkinson's Disease-Related UQCRC1 Mutation and Improves Mitochondrial Homeostasis Including Dynamic and Transport."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mitochondrial function, encompassing DNA copy number, repatriation, and complex III-linked respiration, was comprehensively restored, along with the dynamic rebalance of fusion/fission events."
    explanation: In the UQCRC1-variant cell model, 24-hour formoterol restored complex III-linked respiration. The authors call the evidence preliminary; it is a cell result and not a treatment claim.
discussions:
- discussion_id: controversy_uqcrc1_pd_gene_replication
  prompt: >-
    Is UQCRC1 an authentic Parkinson disease / parkinsonism gene, given that
    multiple candidate-gene cohorts failed to replicate an association while a
    half-million-person biobank analysis and a second family support it?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#UQCRC1
  - pathophysiology#UQCRC1 Homodimer-Interface Missense Variant
  rationale: >-
    The 2020 discovery rested on co-segregation in two Taiwanese families plus
    functional validation in flies and mice. Subsequent candidate-gene screens
    in a European cohort and in Chinese and Taiwanese cohorts did not
    replicate an association. A UK Biobank analysis of about
    500,000 people then found rare protein-truncating variants associated with
    Parkinson disease (OR 6.59), proposing that the original missense screens
    were underpowered for such rare alleles, and a further Austrian family
    shares a different rare missense variant. The question matters for whether
    UQCRC1 should be offered in diagnostic panels and for the mechanism
    (missense dominant-negative vs loss-of-function haploinsufficiency).
  evidence:
  - reference: PMID:33248804
    reference_title: "Lack of evidence for association of UQCRC1 with Parkinson's disease in Europeans."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "our results do not support a major role for UQCRC1 in PD in the European population, and additional studies in other populations are warranted."
    explanation: A large European cohort found no association with Parkinson disease.
  - reference: PMID:32666668
    reference_title: "The lack of association between ubiquinol-cytochrome c reductase core protein I (UQCRC1) variants and Parkinson's disease in an eastern Chinese population."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "we did not find an association between sporadic PD and UQCRC1 in our study. Our data do not support that UQCRC1 mutation is a common genetic factor for sporadic patients in eastern China"
    explanation: A Chinese cohort also failed to replicate an association.
  - reference: PMID:36570444
    reference_title: "UQCRC1 variants in early-onset and familial Parkinson's disease in a Taiwanese cohort."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant differences in the missense-variant carrier frequency were noted between our cohort and individuals in the Taiwan Biobank. Furthermore, no significant associations were noted between the variants and the risk of PD."
    explanation: A second Taiwanese cohort, 107 patients with early-onset or familial Parkinson disease, found no association in the population where the gene was first reported.
  - reference: PMID:37984314
    reference_title: "Rare variant analysis of UQCRC1 in Chinese patients with early-onset Parkinson's disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 7 rare variants (minor allele frequency < 0.1%) of UQCRC1 were identified. However, no excessive burden of rare UQCRC1 variants was suggested in the EOPD patients."
    explanation: Exome sequencing of 913 Chinese patients with early-onset Parkinson disease found no excess burden of rare UQCRC1 variants.
  - reference: PMID:40346065
    reference_title: "Protein-truncating variants in UQCRC1 are associated with Parkinson's disease: evidence from half-million people."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we found a significant association between rare PTVs in UQCRC1 and a higher risk of PD, supporting the link between UQCRC1 and PD. We also provided a plausible explanation for why the association between UQCRC1 and PD has been hard to replicate in previous studies."
    explanation: Biobank-scale evidence supporting UQCRC1, through loss-of-function variants, and an account of the failed replications.
- discussion_id: kg_uqcrc1_neuropathology_and_mechanism
  prompt: >-
    What is the human neuropathology of UQCRC1-related parkinsonism, and is it a
    synucleinopathy? How does loss of complex III activity produce selective
    nigral and peripheral axonal degeneration rather than a systemic
    mitochondrial disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Nigrostriatal Dopaminergic Neurodegeneration
  - pathophysiology#Peripheral Axonal Degeneration
  rationale: >-
    No post-mortem brain tissue from a UQCRC1 variant carrier has been examined,
    and the knock-in fly and mouse models show no alpha-synuclein pathology, so
    whether the human disease is a synucleinopathy is unknown. It is also
    unexplained why a ubiquitously expressed complex III subunit produces
    selective dopaminergic and length-dependent peripheral axonal degeneration
    rather than the multi-system presentation of classic complex III deficiency.
    Resolving these needs human autopsy tissue and tissue-specific mechanistic
    study.
  evidence:
  - reference: PMID:33141179
    reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "post-mortem brain tissues from patients with UQCRC1 mutations are not available yet to confirm our findings from the in vivo models."
    explanation: The authors state the human neuropathology is not yet established.

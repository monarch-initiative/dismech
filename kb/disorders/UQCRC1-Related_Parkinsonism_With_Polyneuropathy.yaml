    Affected carriers respond well to levodopa, as in idiopathic Parkinson
    disease; one patient's UPDRS part III improved markedly on levodopa plus
    ropinirole. Levodopa also improved the motor phenotype of the knock-in
    mouse, confirming the deficit is dopaminergic. Treatment is symptomatic and
    does not address the complex III defect or the neuropathy.

animal_models:
- name: UQCRC1 p.Tyr314Ser knock-in mouse
  species: Mouse
  genotype: Uqcrc1 p.Tyr314Ser heterozygous knock-in (CRISPR/Cas9)
  genes:
  - preferred_term: Uqcrc1
    term:
      id: MGI:107876
      label: Uqcrc1
  publication: PMID:33141179
  description: >-
    Heterozygous CRISPR knock-in of the human p.Tyr314Ser substitution into the
    mouse Uqcrc1 gene. Mice are normal to 9 months, then develop progressive
    locomotor and gait deficits, nigral dopaminergic neuron loss, striatal
    dopamine deficiency, reduced complex III activity in nigra and striatum,
    sciatic nerve fibre degeneration and abnormal mitochondrial ultrastructure;
    motor deficits improve with levodopa. No alpha-synuclein pathology was
    detected.
  modeled_mechanisms:
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Age-dependent loss of TH-positive nigral neurons at endogenous expression of the variant.
    limitations: >-
      Degeneration is modest (about 10,830 vs 13,127 TH-positive neurons at 12
      months) and lacks the alpha-synuclein pathology of human Parkinson
      disease.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        The mouse shows no Lewy/alpha-synuclein pathology, which is a hallmark
        of idiopathic Parkinson disease, so the model captures the mitochondrial
        and dopaminergic arm but not the proteinopathy.
    readouts:
    - name: TH-positive neuron count in the substantia nigra pars compacta
      target: Nigrostriatal Dopaminergic Neurodegeneration
      direction: DECREASED
      interpretation: Stereological evidence of nigral dopaminergic loss by 12 months.
      evidence:
      - reference: PMID:33141179
        reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "At 12 months, wild-type littermates versus UQCRC1 p.Tyr314Ser was 13 127 ± 591 versus 10 830 ± 782; P = 0.032 by one-way ANOVA."
        explanation: The stereological count behind this readout.
    evidence:
    - reference: PMID:33141179
      reference_title: Mitochondrial UQCRC1 mutations cause autosomal dominant parkinsonism with polyneuropathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Heterozygous animals show progressive age-associated impairments in motor function, beginning at 9 months, accompanied by functional deficits in striatal dopaminergic innervation and loss of TH-positive neurons in the SNc."
      explanation: Supports treating the knock-in mouse as informative for the nigral degeneration node.

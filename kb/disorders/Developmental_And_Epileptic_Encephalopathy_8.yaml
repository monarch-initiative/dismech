pathophysiology:
- name: ARHGEF9 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Pathogenic ARHGEF9 alleles reduce or abolish collybistin function. The
    allelic series includes whole-gene and intragenic deletions, chromosomal
    rearrangements whose breakpoints disrupt the gene (in one female, leaving
    transcripts that no longer encode the PH domain), nonsense, frameshift and
    splice variants, and missense variants. Missense variants studied
    functionally act through distinct domains: G55A in the N-terminal SH3
    domain, where the mutant protein aggregates and may act dominant-negatively;
    R290H in the catalytic DH domain, which weakens the DH-PH intramolecular
    interaction and lowers phosphatidylinositol 3-phosphate (PI3P) binding; and
    R338W and R356Q in the PH domain, which abolish PI3P binding. The missense
    proteins tested fail to cluster gephyrin normally. The disease-relevant
    activity is PH-domain membrane targeting rather than the protein's Cdc42
    exchange activity: a collybistin mutant with no detectable Cdc42 GEF
    activity still builds gephyrin scaffolds, so the GEF activity is not
    recorded here as the lost function.
  genes:
  - preferred_term: ARHGEF9
    term:
      id: hgnc:14561
      label: ARHGEF9
  genetic_context:
    gene:
      preferred_term: ARHGEF9
      term:
        id: hgnc:14561
        label: ARHGEF9
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    notes: >-
      Hemizygous in affected males; affected females are heterozygous (see the
      inheritance block). Variant origin is mixed (de novo, maternally
      inherited, and structural), so it is not set here. The G55A SH3-domain
      allele may additionally act dominant-negatively.
  molecular_functions:
  - preferred_term: phosphatidylinositol-3-phosphate binding
    term:
      id: GO:0032266
      label: phosphatidylinositol-3-phosphate binding
    modifier: DECREASED
  evidence:
  - reference: PMID:21633362
    reference_title: "Loss-of-function mutation of collybistin is responsible for X-linked mental retardation associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Microarray-based comparative genomic hybridization analysis identified a 737-kb microdeletion of Xq11.1, including the cell division cycle 42 guanine nucleotide exchange factor (GEF)-9 gene (ARHGEF9), encoding collybistin
    explanation: >-
      Whole-gene deletion in an affected male, establishing loss of the gene as
      sufficient to cause disease.
  - reference: PMID:17893116
    reference_title: "ARHGEF9 disruption in a female patient is associated with X linked mental retardation and sensory hyperarousal."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also found that the levels of the ARHGEF9 transcript from the patient are 10-fold less than those found in control samples.
    explanation: >-
      A breakpoint-disrupted allele in an affected female reduces ARHGEF9
      transcript tenfold, a direct measure of loss of expression.
  - reference: PMID:18615734
    reference_title: "A balanced chromosomal translocation disrupting ARHGEF9 is associated with epilepsy, anxiety, aggression, and mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mRNAs no longer encode the pleckstrin homology (PH) domain of collybistin
    explanation: >-
      The translocation allele produces transcripts lacking the PH domain.
  - reference: PMID:25678704
    reference_title: "Lipid binding defects and perturbed synaptogenic activity of a Collybistin R290H mutant that causes epilepsy and intellectual disability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we demonstrate that the R290H mutation alters the strength of intramolecular interactions between the diffuse B-cell lymphoma homology domain and the pleckstrin homology domain of Cb. This defect reduces the phosphatidylinositol 3-phosphate binding affinity of Cb, which limits its normal synaptogenic activity.
    explanation: >-
      Biochemical mechanism for a DH-domain missense variant found in a patient
      with epilepsy and intellectual disability.
  - reference: PMID:26834553
    reference_title: "Missense Mutation R338W in ARHGEF9 in a Family with X-linked Intellectual Disability with Variable Macrocephaly and Macro-Orchidism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      functional assays revealed that recombinant CB CB2SH3- (R338W) was deficient in PI3P binding and was not able to translocate EGFP-gephyrin to submembrane microaggregates in an in vitro clustering assay.
    explanation: >-
      A PH-domain missense variant abolishes PI3P binding and gephyrin
      translocation.
  - reference: PMID:20345913
    reference_title: "PH-domain-driven targeting of collybistin but not Cdc42 activation is required for synaptic gephyrin clustering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A Cb II mutant lacking any detectable GEF activity towards Cdc42 was still fully active in inducing gephyrin scaffold formation, both in transfected NIH-3T3 cells and in cultured hippocampal neurons.
    explanation: >-
      Cdc42 exchange activity is dispensable for gephyrin scaffold formation in
      cells and neurons.
  - reference: PMID:20345913
    reference_title: "PH-domain-driven targeting of collybistin but not Cdc42 activation is required for synaptic gephyrin clustering."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, mice with a forebrain-specific inactivation of the Cdc42 gene displayed normal densities of gephyrin and GABA(A) receptor clusters in the hippocampus.
    explanation: >-
      The in vivo counterpart: removing Cdc42 itself does not reduce gephyrin
      or GABA-A receptor clusters.
  - reference: PMID:20345913
    reference_title: "PH-domain-driven targeting of collybistin but not Cdc42 activation is required for synaptic gephyrin clustering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, substitution of Cb II PH-domain residues essential for phosphoinositide binding abolished gephyrin recruitment to synaptic sites.
    explanation: >-
      Phosphoinositide binding by the PH domain is the required function.
  - reference: PMID:39374387
    reference_title: "Impaired axon initial segment structure and function in a model of ARHGEF9 developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Functional studies with heterologous expression of ARHGEF9G55A showed aggregation of CB protein as well as loss of gephyrin and GABAAR clusters, suggesting that the G55A mutation might act in a dominant-negative manner
    explanation: >-
      Summarizes the earlier heterologous-expression result for the SH3-domain
      G55A variant and its possible dominant-negative action. The sentence is
      the paper's background summary of prior work.
  downstream:
  - target: Impaired Gephyrin Clustering at Inhibitory Postsynapses
    causal_link_type: DIRECT
    description: >-
      Collybistin is the factor that recruits gephyrin to the postsynaptic
      membrane; without functional collybistin, gephyrin is not clustered.
    evidence:
    - reference: PMID:30914922
      reference_title: "Mutation p.R356Q in the Collybistin Phosphoinositide Binding Site Is Associated With Mild Intellectual Disability."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Expression of the PI3P-binding mutants CB3SH3- R356Q and CB3SH3- R356N/R357N in cultured hippocampal neurones revealed that the mutant proteins did not accumulate at inhibitory synapses, but instead resulted in a clear decrease in the overall number of synaptic gephyrin clusters compared to controls.
      explanation: >-
        A patient PH-domain variant reduces synaptic gephyrin clusters in
        cultured neurons, the specific step this edge asserts.
    - reference: PMID:31942680
      reference_title: "Clinical and Molecular Characterization of Three Novel ARHGEF9 Mutations in Patients with Developmental Delay and Epilepsy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro studies confirmed that the two missense variants disrupted CB-mediated accumulation of gephyrin in submembrane microclusters.
      explanation: >-
        Two further patient missense variants (p.I294T, p.R357I) fail to cluster
        gephyrin.
  - target: Disinhibited mTORC1 Signaling
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - collybistin_mtorc1_disinhibition
    description: >-
      Collybistin binds mTOR and restrains mTORC1 signalling; its loss is
      proposed to disinhibit the pathway. This is a second, gephyrin-independent
      consequence of loss of function.
    evidence:
    - reference: PMID:25898924
      reference_title: "Collybistin binds and inhibits mTORC1 signaling: a potential novel mechanism contributing to intellectual disability and autism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we describe that CB physically interacts with mTOR and inhibits mTORC1 signaling pathway and protein synthesis.
      explanation: >-
        Shown in iPSC-derived neural progenitors from a male with whole-gene
        deletion and in a heterologous system.

- name: Impaired Gephyrin Clustering at Inhibitory Postsynapses
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  biological_scale: CELLULAR
  description: >-
    Gephyrin is the scaffold that anchors glycine receptors and major GABA-A
    receptor subtypes at inhibitory postsynapses. Collybistin, activated by the
    adhesion protein neuroligin-2 and anchored to the membrane through PI3P
    binding by its PH domain, is required to bring gephyrin to the membrane. In
    collybistin-deficient mice gephyrin fails to cluster at postsynaptic sites
    and accumulates as cytoplasmic aggregates, in a region-specific pattern
    (hippocampus and basolateral amygdala), and collybistin is needed both to
    form and to maintain these clusters.
  cell_types:
  - preferred_term: hippocampal pyramidal neuron
    term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
  biological_processes:
  - preferred_term: gephyrin clustering involved in postsynaptic density assembly
    term:
      id: GO:0097116
      label: gephyrin clustering involved in postsynaptic density assembly
    modifier: DECREASED
  cellular_components:
  - preferred_term: inhibitory synapse
    term:
      id: GO:0060077
      label: inhibitory synapse
  locations:
  - preferred_term: hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  - preferred_term: basolateral amygdala
    term:
      id: UBERON:0006107
      label: basolateral amygdaloid nuclear complex
  evidence:
  - reference: PMID:15215304
    reference_title: "The GDP-GTP exchange factor collybistin: an essential determinant of neuronal gephyrin clustering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also demonstrate that gephyrin clustering in recombinant systems and cultured neurons requires both collybistin-gephyrin interactions and an intact collybistin pleckstrin homology domain.
    explanation: >-
      Establishes the dependence of gephyrin clustering on collybistin.
  - reference: PMID:18625319
    reference_title: "Collybistin is required for both the formation and maintenance of GABAergic postsynapses in the hippocampus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our data show that Cb is required for both the initial localization and maintenance of gephyrin and gephyrin-dependent GABA(A)Rs at inhibitory postsynaptic membrane specializations in the hippocampus.
    explanation: >-
      Conditional forebrain deletion in mice shows collybistin is needed for
      gephyrin clustering during synaptogenesis and afterwards.
  - reference: PMID:18625319
    reference_title: "Collybistin is required for both the formation and maintenance of GABAergic postsynapses in the hippocampus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of Cb during embryonic development prevented gephyrin clustering during synaptogenesis and caused an accumulation of gephyrin aggregates in the cell body of CA1 pyramidal neurons.
    explanation: >-
      Gephyrin aggregates in the soma when collybistin is absent.
  - reference: PMID:19755106
    reference_title: "Neuroligin 2 drives postsynaptic assembly at perisomatic inhibitory synapses through gephyrin and collybistin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Neuroligin 2 binds the scaffolding protein gephyrin through a conserved cytoplasmic motif and functions as a specific activator of collybistin, thus guiding membrane tethering of the inhibitory postsynaptic scaffold.
    explanation: >-
      Places collybistin in the neuroligin-2/gephyrin complex that assembles the
      inhibitory postsynaptic scaffold.
  downstream:
  - target: Loss of Postsynaptic GABA-A Receptor Clusters
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17690689
      reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-

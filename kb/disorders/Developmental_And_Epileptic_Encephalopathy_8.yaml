- name: Gabra2-1 mouse (collybistin-alpha2 binding mutant)
  species: Mus musculus
  genotype: Gabra2-1 (collybistin-binding motif of the GABA-A receptor alpha2 subunit replaced by the alpha1 gephyrin-binding motif)
  description: >-
    Not an Arhgef9 allele. The collybistin-binding motif of the GABA-A receptor
    alpha2 subunit is replaced, which down-regulates collybistin, particularly
    at cholecystokinin basket-cell synapses. The mice have developmental
    seizures with early mortality, anxiety, hyperactivity, memory deficits and
    reduced social preference, which the authors present as a phenocopy of
    human ARHGEF9 disease. EEG and anxiety phenotypes were ameliorated by the
    alpha2/alpha3-selective positive modulator AZD7325.

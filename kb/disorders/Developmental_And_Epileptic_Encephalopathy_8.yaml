- name: Antiseizure medication
  description: >-
    There is no disease-specific therapy. Seizures are treated with standard
    antiseizure medications, usually in combination, and response ranges from
    seizure freedom to drug resistance. Valproic acid and levetiracetam were
    each reported effective in individual patients in one small series, which is
    case-level evidence rather than a comparative result.

genetic:
- name: ARHGEF9
  gene_term:
    preferred_term: ARHGEF9
    term:
      id: hgnc:14561
      label: ARHGEF9
  association: >-
    ARHGEF9 (Xq11.1) encodes collybistin. ClinGen classifies ARHGEF9 as
    Definitive for X-linked complex neurodevelopmental disorder, the broader
    MONDO grouping under which DEE8 sits. Pathogenic alleles include missense,
    nonsense, frameshift and splice variants, intragenic and whole-gene
    deletions, and balanced rearrangements disrupting the gene. Missense
    variants confined to the PH domain are associated with intellectual
    disability without epilepsy, whereas complete loss of the gene and severe
    DH-domain variants are associated with severe epilepsy.
  relationship_type: CAUSATIVE
  evidence:
  - reference: CGGV:assertion_9305fb2c-6cdf-492d-9dd0-8b03dd4fab1c-2024-05-23T100000.000Z
    reference_title: "ARHGEF9 / X-linked complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ARHGEF9 | HGNC:14561 | X-linked complex neurodevelopmental disorder | MONDO:0100148 | XL | Definitive
    explanation: >-
      ClinGen gene-disease validity: Definitive (Intellectual Disability and
      Autism GCEP, SOP10, 2024-05-23). The assertion is against the broader
      MONDO:0100148 grouping, not against MONDO:0010375 itself.
  - reference: CGGV:assertion_9305fb2c-6cdf-492d-9dd0-8b03dd4fab1c-2024-05-23T100000.000Z
    reference_title: "ARHGEF9 / X-linked complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The molecular spectrum of ARHGEF9 variants include missense, copy number variants, frameshift, nonsense, and structural X-chromosome abnormalities
    explanation: >-
      ClinGen summary of the allelic spectrum.
  - reference: PMID:29130122
    reference_title: "ARHGEF9 mutations in epileptic encephalopathy/intellectual disability: toward understanding the mechanism underlying phenotypic variation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three missense mutations in the PH domain were not associated with epilepsy, suggesting that the co-occurrence of epilepsy depends on the affected functional domains. Missense mutations with severe molecular alteration in the DH domain, or located in the DH-gephyrin binding region, or adjacent to the SH3-NL2 binding site were associated with severe epilepsy
    explanation: >-
      Domain-based genotype-phenotype correlation.
  - reference: PMID:28589176
    reference_title: "ARHGEF9 disease: Phenotype clarification and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss of only the protein's PH domain function is associated with the absence of epilepsy.
    explanation: >-
      Same correlation from the 18-patient series.

diagnosis:
- name: Chromosomal microarray
  description: >-
    Diagnosis is molecular. Because a large share of reported ARHGEF9 disease
    is due to deletions and chromosomal disruptions (7 of 18 patients in the
    largest series had chromosomal disruptions), chromosomal microarray is
    recommended as the first-line test. In a female, a balanced rearrangement
    disrupting the gene will not be seen on microarray and needs karyotype or
    breakpoint mapping.
  diagnosis_term:
    preferred_term: chromosomal microarray
    term:
      id: NCIT:C198497
      label: Array-based Comparative Genomic Hybridization
  evidence:
  - reference: PMID:28589176
    reference_title: "ARHGEF9 disease: Phenotype clarification and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, the diagnostic approach in candidate patients still requires chromosomal microarray testing as the first-line genetic testing because of the substantial diagnostic yield and low relative cost, followed by a gene panel or whole-exome sequencing approach as second tier.
    explanation: >-
      Recommendation from the 18-patient series.
  - reference: PMID:28589176
    reference_title: "ARHGEF9 disease: Phenotype clarification and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 18 patients (including 5 females) were identified. Six had de novo, 5 had maternally inherited mutations, and 7 had chromosomal disruptions.
    explanation: >-
      The chromosomal-disruption fraction behind the first-line recommendation.
- name: Gene panel or exome sequencing
  description: >-
    Second-tier testing for sequence variants (missense, nonsense,
    frameshift, splice) by an epilepsy or intellectual-disability gene panel
    or by exome sequencing. Parental testing distinguishes de novo from
    maternally inherited variants, which matters for counselling the mother.
  diagnosis_term:
    preferred_term: gene panel or whole-exome sequencing
    term:

      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The mutation results in loss of a distinct subset of inhibitory synapses and decreased amplitude of inhibitory synaptic currents.
      explanation: >-
        Disrupting only the collybistin-alpha2 interaction in mice removes a

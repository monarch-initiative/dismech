    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The Gabra2-1 mutation causes a strong downregulation of Cb expression, particularly at cholecystokinin basket cell inhibitory synapses.
    explanation: >-
      Collybistin loss at a defined synapse type in the model.
  - reference: PMID:35169261
    reference_title: "Human ARHGEF9 intellectual disability syndrome is phenocopied by a mutation that disrupts collybistin binding to the GABA(A) receptor α2 subunit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gabra2-1 mice have deficits in working and recognition memory, as well as hyperactivity, anxiety, and reduced social preference, recapitulating the frequently reported features of ARHGEF9 patients.
    explanation: >-
      Behavioural phenocopy.
  - reference: PMID:35169261
    reference_title: "Human ARHGEF9 intellectual disability syndrome is phenocopied by a mutation that disrupts collybistin binding to the GABA(A) receptor α2 subunit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gabra2-1 mice also have spontaneous seizures during postnatal development which can lead to mortality, and baseline abnormalities in low-frequency wavelengths of the EEG.
    explanation: >-

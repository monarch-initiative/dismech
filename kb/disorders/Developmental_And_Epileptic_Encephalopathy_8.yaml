- name: Loss of Postsynaptic GABA-A Receptor Clusters
  biological_scale: CELLULAR
  description: >-
    Without clustered gephyrin, the gephyrin-dependent GABA-A receptors (notably
    alpha2-containing receptors, which bind collybistin directly) are lost from
    postsynaptic sites. The loss is selective, affecting a specific set of
    receptors and synapse types rather than all GABAergic synapses.
  cell_types:
  - preferred_term: hippocampal pyramidal neuron
    term:
      id: CL:1001571
      label: hippocampal pyramidal neuron
  biological_processes:

mechanistic_hypotheses:
- hypothesis_group_id: glycinergic_hyperekplexia
  hypothesis_label: >-
    Hyperekplexia in ARHGEF9 disease reflects loss of gephyrin-dependent glycine
    receptor clustering
  status: ALTERNATIVE
  description: >-
    Proposed when the first patient, who had both hyperekplexia and epilepsy,
    was reported. It conflicts with the collybistin knockout mouse, in which
    glycine receptor localization is preserved, and with the rarity of
    hyperekplexia in later case series; it is consistent with the exaggerated
    startle of the G55A knock-in mouse. Whether the startle phenotype is
    glycinergic, specific to dominant-negative alleles such as G55A, or of
    another origin is unresolved.
  evidence:
  - reference: PMID:15215304
    reference_title: "The GDP-GTP exchange factor collybistin: an essential determinant of neuronal gephyrin clustering."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mislocalization of GABAA receptors, together with a corresponding expected deficit in glycine receptor trafficking in brain stem and spinal cord neurons, is likely to be causal for the clinical phenotype of the patient described above.
    explanation: >-
      The original authors' mechanistic interpretation of the G55A patient. The
      glycine receptor deficit is an expectation they draw from cultured-neuron
      data, not a measurement in brainstem or spinal cord.
  - reference: PMID:17690689
    reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our data indicate that Cb is essential for gephyrin-dependent clustering of a specific set of GABAA receptors, but not required for glycine receptor postsynaptic localization.
    explanation: >-
      Contradicts a general requirement for collybistin at glycinergic synapses.
  - reference: PMID:33842008
    reference_title: "A proline-rich motif in the large intracellular loop of the glycine receptor α1 subunit interacts with the Pleckstrin homology domain of collybistin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data suggest a novel interaction between α1 GlyR subunits and collybistin, which is physiologically relevant in vitro and in vivo and may contribute to postsynaptic anchoring of glycine receptors.
    explanation: >-
      A direct collybistin PH-domain interaction with the glycine receptor
      alpha1 subunit, a route by which collybistin could matter at glycinergic
      synapses; not tested in an ARHGEF9 disease model.
  - reference: PMID:39374387
    reference_title: "Impaired axon initial segment structure and function in a model of ARHGEF9 developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with ARHGEF9-DEE patients, Arhgef9G55A/Y mice were found to exhibit hyperekplexia and multiple seizure types
    explanation: >-
      The G55A knock-in reproduces the startle phenotype, consistent with an
      allele-specific mechanism; the paper does not show that the startle is
      glycinergic.

animal_models:
- name: Arhgef9 constitutive knockout mouse
  species: Mus musculus
  genotype: Arhgef9 null (collybistin-deficient)
  description: >-
    Constitutive collybistin knockout. Gephyrin and GABA-A receptor clusters are
    lost in a region-specific way from hippocampus and basolateral amygdala,
    dendritic GABAergic inhibition is reduced, hippocampal plasticity is
    abnormal, dentate gyrus excitability is increased in vivo, and the animals
    show increased anxiety and impaired spatial learning. Glycine receptor
    localization is preserved. Conditional forebrain deletion shows collybistin
    is needed both to form and to maintain these synapses.
  genes:
  - preferred_term: ARHGEF9
    term:
      id: hgnc:14561
      label: ARHGEF9
  publication: PMID:17690689
  modeled_mechanisms:
  - target: Loss of Postsynaptic GABA-A Receptor Clusters
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Mouse null allele; the loss is region-specific in the mouse, and the human
      brain distribution of the defect is unknown.
    evidence:
    - reference: PMID:17690689
      reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that Cb-deficient mice display a region-specific loss of postsynaptic gephyrin and GABAA receptor clusters in the hippocampus and the basolateral amygdala.
      explanation: >-
        Shows the model reproduces the receptor-clustering node.
  - target: Impaired Gephyrin-Dependent Glycine Receptor Clustering
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    limitations: >-
      Glycine receptor postsynaptic localization is preserved in the null mouse,
      so it does not model a glycinergic basis for the hyperekplexia seen in the
      SH3-domain G55A patient; a dominant-negative allele effect would not be
      captured by a null.
    evidence:
    - reference: PMID:17690689
      reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together, our data indicate that Cb is essential for gephyrin-dependent clustering of a specific set of GABAA receptors, but not required for glycine receptor postsynaptic localization.
      explanation: >-
        The negative result on glycine receptors.
  - target: Cortical and Hippocampal Network Hyperexcitability
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      Shows increased evoked excitability of dentate granule cells in vivo; the
      constitutive-knockout papers cited here do not report spontaneous
      seizures.
    evidence:
    - reference: PMID:19236916
      reference_title: "Increased network excitability and impaired induction of long-term potentiation in the dentate gyrus of collybistin-deficient mice in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found a decreased threshold for evoked population spikes of granule cells, indicating their increased excitability.
      explanation: >-
        Evoked network hyperexcitability in vivo.
  evidence:
  - reference: PMID:17690689
    reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with the anatomical and electrophysiological findings, the animals show increased levels of anxiety and impaired spatial learning.
    explanation: >-
      Behavioural phenotype of the model.

- name: Arhgef9 G55A knock-in mouse
  species: Mus musculus
  genotype: Arhgef9 G55A/Y (hemizygous knock-in of the index-patient SH3-domain variant)

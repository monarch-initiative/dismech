discussions:
- discussion_id: controversy_arhgef9_female_expression
  prompt: >-
    Are ARHGEF9 loss-of-function alleles X-linked dominant, or is disease in
    heterozygous females explained by skewed X-inactivation in brain that blood
    does not show?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - inheritance#X-linked
  rationale: >-
    The early affected females all carried chromosomal rearrangements with
    strongly skewed X-inactivation in favour of the abnormal X. Later females
    with de novo intragenic deletions or single-nucleotide variants had random
    X-inactivation in blood, prompting a proposal that loss-of-function alleles
    behave as X-linked dominant. Blood X-inactivation is an imperfect proxy for
    brain, and variants transmitted by mildly affected or unaffected mothers
    complicate the picture. The answer changes recurrence counselling for the
    mothers and sisters of affected boys.
  evidence:
  - reference: PMID:33600053
    reference_title: "Loss-of-function variants in ARHGEF9 are associated with an X-linked intellectual disability dominant disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to now, sequence variants and gross deletions have been identified in males, while only chromosomal aberrations have been reported in affected females who showed a skewed pattern of X-chromosome inactivation (XCI), suggesting an X-linked recessive (XLR) disorder.
    explanation: >-
      States the earlier recessive interpretation that the paper then
      challenges.
  - reference: PMID:32939676
    reference_title: "De novo ARHGEF9 missense variants associated with neurodevelopmental disorder in females: expanding the genotypic and phenotypic spectrum of ARHGEF9 disease in females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing revealed that these variants were de novo. The X-inactivation pattern in peripheral blood cells was random.
    explanation: >-
      Two further affected females with de novo missense variants and random
      blood X-inactivation.
- discussion_id: mismatch_arhgef9_hyperekplexia_mechanism
  prompt: >-
    What causes the exaggerated startle in the minority of ARHGEF9 patients who
    have it, given that collybistin-null mice keep glycine receptors at their
    synapses while mice carrying the G55A patient variant show hyperekplexia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Gephyrin-Dependent Glycine Receptor Clustering
  - phenotypes#Exaggerated startle response
  rationale: >-
    The glycinergic explanation rests on the index patient and on gephyrin's
    role at glycinergic synapses. The null mouse preserves glycine receptor
    localization, and hyperekplexia is absent from most later patients. The G55A
    knock-in mouse does show an exaggerated startle, which fits an
    allele-specific (possibly dominant-negative) effect that a null cannot
    model; but glycine receptor clustering in brainstem and spinal cord of that
    model, the direct test of the glycinergic hypothesis, is not what its report
    examined.
  evidence:
  - reference: PMID:17690689
    reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, our data indicate that Cb is essential for gephyrin-dependent clustering of a specific set of GABAA receptors, but not required for glycine receptor postsynaptic localization.
    explanation: >-
      The null-model result that conflicts with the clinical hypothesis.
  - reference: PMID:39374387
    reference_title: "Impaired axon initial segment structure and function in a model of ARHGEF9 developmental and epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Consistent with ARHGEF9-DEE patients, Arhgef9G55A/Y mice were found to exhibit hyperekplexia and multiple seizure types
    explanation: >-
      The allele-specific model does reproduce the startle phenotype.

notes: >-
  Scope and lump/split. MONDO:0010375 is the only ARHGEF9-specific disease class,
  and this entry lumps the whole ARHGEF9 phenotypic spectrum under it: the
  hyperekplexia-epilepsy presentation behind the MONDO synonyms, developmental
  and epileptic encephalopathy, intellectual disability with later or milder
  epilepsy, and intellectual disability without epilepsy (PH-domain missense
  alleles). These share one gene and one mechanism, and the published series
  treat them as one disorder with genotype-dependent severity. The split
  alternative would be a separate entry for non-epileptic ARHGEF9 intellectual
  disability, for which no MONDO class exists. ClinGen's Definitive assertion is
  against the broader MONDO:0100148 (X-linked complex neurodevelopmental
  disorder), a multi-gene grouping, not against DEE8. Orphanet codes the
  hyperekplexia-epilepsy presentation as ORPHA:163985. No GeneReviews chapter
  covers ARHGEF9 disease (NCBI Bookshelf, checked September 2026). Onset is in
  infancy or early childhood; adult outcome data are limited to case reports.

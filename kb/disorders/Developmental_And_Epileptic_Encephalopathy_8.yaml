inheritance:
- name: X-linked
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    Males are hemizygous and are the large majority of reported patients. Most
    male probands carry a de novo variant, but maternally inherited missense and
    nonsense variants occur, the mothers being unaffected or mildly affected.
    Affected females fall into two groups. Those with balanced X-autosome
    translocations, X-chromosome inversions or other rearrangements show
    strongly skewed X-inactivation in favour of the abnormal X, consistent with
    X-linked recessive expression. Females with de novo intragenic deletions or
    de novo loss-of-function or missense single-nucleotide variants have been
    reported with random X-inactivation in blood, which led one group to propose
    that loss-of-function alleles act as an X-linked dominant disorder while
    missense alleles act as X-linked recessive. Blood X-inactivation need not
    reflect the pattern in brain, so the dominant model is recorded as a
    proposal (see discussions), and the block is bound to the parent X-linked
    term rather than to either the recessive or the dominant child term.
  evidence:
  - reference: CGGV:assertion_9305fb2c-6cdf-492d-9dd0-8b03dd4fab1c-2024-05-23T100000.000Z
    reference_title: "ARHGEF9 / X-linked complex neurodevelopmental disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The majority of variants in male probands are de novo; however, there are some familial cases of mildly affected mothers.
    explanation: >-
      ClinGen expert-panel summary of the inheritance pattern across the
      published probands: mostly de novo in males, with some maternally
      transmitted variants.
  - reference: PMID:28589176
    reference_title: "ARHGEF9 disease: Phenotype clarification and genotype-phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 18 patients (including 5 females) were identified. Six had de novo, 5 had maternally inherited mutations, and 7 had chromosomal disruptions. All females had strongly skewed X-inactivation in favor of the abnormal X-chromosome.
    explanation: >-
      Case series giving the de novo, maternally inherited and structural
      fractions, and documenting skewed X-inactivation in the affected females
      of that series.
  - reference: PMID:21633362
    reference_title: "Loss-of-function mutation of collybistin is responsible for X-linked mental retardation associated with epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although this nonsense mutation was shared with the patient's mother, it was not observed in 100 normal individuals.
    explanation: >-
      A maternally transmitted nonsense variant in an affected male.
  - reference: PMID:33600053
    reference_title: "Loss-of-function variants in ARHGEF9 are associated with an X-linked intellectual disability dominant disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both females showed a random XCI. Thus, we suggest that missense variants are responsible for an XLR disorder affecting males and that LoF variants, mainly occurring de novo, may be responsible for an X-linked dominant disorder affecting males and females.
    explanation: >-
      Two affected females with loss-of-function variants and random
      X-inactivation, and the authors' proposed split between recessive
      (missense) and dominant (loss-of-function) behaviour.
  - reference: PMID:30048823
    reference_title: "Autism spectrum disorder in females with ARHGEF9 alterations and a random pattern of X chromosome inactivation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral blood samples revealed random X-chromosome inactivation in both patients.
    explanation: >-
      Two further affected females, with de novo intragenic deletions, and
      random X-inactivation in blood.


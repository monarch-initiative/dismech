    reference_title: "The GDP-GTP exchange factor collybistin: an essential determinant of neuronal gephyrin clustering."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The vital importance of collybistin for inhibitory synaptogenesis is underlined by the discovery of a mutation (G55A) in exon 2 of the human collybistin gene (ARHGEF9) in a patient with clinical symptoms of both hyperekplexia and epilepsy.
    explanation: >-
      The clinical observation (hyperekplexia) that motivated the glycinergic
      hypothesis.
  - reference: PMID:17690689
    reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-

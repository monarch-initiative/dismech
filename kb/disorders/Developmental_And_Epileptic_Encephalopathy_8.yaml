name: Developmental and Epileptic Encephalopathy 8
creation_date: "2026-09-23T00:00:00Z"
category: Mendelian
description: >-
  Developmental and epileptic encephalopathy 8 (DEE8) is the X-linked
  neurodevelopmental disorder caused by pathogenic variants in ARHGEF9 on Xq11.1,
  which encodes collybistin, a brain-specific guanine nucleotide exchange factor
  that recruits the scaffolding protein gephyrin to the postsynaptic membrane of
  inhibitory synapses. Loss of collybistin function impairs gephyrin clustering
  and, with it, the synaptic clustering of gephyrin-dependent GABA-A receptors,
  reducing GABAergic inhibition. The phenotype is broader than the MONDO label
  suggests. Intellectual disability is the constant feature and is usually
  moderate to severe; roughly 70% of patients in the largest clinical series
  also have epilepsy, which begins in infancy or early childhood (median onset
  12 months, range one week to 7 years) and is drug-resistant in a subset. The
  first reported patient had neonatal stiffness and hyperekplexia followed by a
  fatal progressive epileptic encephalopathy, which is where the
  "hyperekplexia-epilepsy syndrome" synonym comes from; hyperekplexia has since
  proved uncommon. At the mild end, missense variants confined to the pleckstrin
  homology (PH) domain cause intellectual disability without epilepsy. Severely
  affected boys often share a facial gestalt of large fleshy earlobes, midface
  hypoplasia and prognathism, and autistic features, hyperactivity, anxiety,
  aggression and sleep disturbance recur. Most affected males carry a de novo
  variant, but maternally inherited variants from mildly affected or unaffected
  mothers occur. Affected females are reported both with strongly skewed
  X-inactivation (mostly chromosomal rearrangements) and with random
  X-inactivation in blood (de novo intragenic deletions and single-nucleotide
  variants), and whether loss-of-function alleles behave as X-linked dominant is
  unsettled.

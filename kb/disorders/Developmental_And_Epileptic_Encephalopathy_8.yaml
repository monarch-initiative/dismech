    reference_title: "Impaired GABAergic transmission and altered hippocampal synaptic plasticity in collybistin-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that Cb-deficient mice display a region-specific loss of postsynaptic gephyrin and GABAA receptor clusters in the hippocampus and the basolateral amygdala.
    explanation: >-
      Direct demonstration in the knockout mouse.
  - reference: PMID:30087324
    reference_title: "Developmental seizures and mortality result from reducing GABA(A) receptor α2-subunit interaction with collybistin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Using isothermal titration calorimetry and complementary methods we demonstrate an exclusive low micromolar binding of collybistin to the α2-subunit of GABAARs.
    explanation: >-
      Identifies the alpha2 subunit as the GABA-A receptor subunit that
      collybistin binds directly.
  downstream:

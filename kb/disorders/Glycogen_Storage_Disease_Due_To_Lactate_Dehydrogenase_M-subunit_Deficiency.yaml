    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recurrent rhabdomyolysis due to decreased glycolysis occurred during
      strenuous exercise by patients with lactate dehydrogenase-A subunit (LDH-A;

- name: Myoglobinuria
  category: Renal
  description: >-
    Dark or pigmented urine after strenuous exercise, the presenting complaint in
    the first reported patient and the feature that most often prompts referral.
  phenotype_term:
    preferred_term: Myoglobinuria
    term:
      id: HP:0002913
      label: Myoglobinuria
  frequency: FREQUENT
  evidence:
  - reference: PMID:7449146
    reference_title: Hereditary deficiency of lactate dehydrogenase M-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The propositus was an 18-year-old male who complained of exertional
      pigmenturia and easy fatigue.
    explanation: >-
      The index presentation of the disorder.
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three families with a complete deficiency of the lactate dehydrogenase M
      subunit show exertional myoglobinuria.
    explanation: >-
      Exertional myoglobinuria in all three families of the defining series.
  notes: >-
    Band assigned from the three families of PMID:3383424 (3 of 3 with exertional

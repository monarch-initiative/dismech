  sequelae:
  - target: Acute kidney injury
    causal_link_type: DIRECT
    description: >-
      Pigment nephropathy from a severe myoglobinuric episode; the complication
      is of the episode, not of the enzyme defect at rest.
- name: Elevated circulating creatine kinase concentration
  category: Musculoskeletal
  description: >-
    Creatine kinase is raised acutely during episodes and is often mildly raised
    at baseline (two to five times the upper reference limit), so
    hyper-CK-aemia can be the finding that starts the diagnostic workup. The
    ratio of creatine kinase to total LDH is characteristically discrepant,
    because total LDH stays deceptively normal.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:7449146
    reference_title: Hereditary deficiency of lactate dehydrogenase M-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marked discrepancy was observed in the ratio between creatine kinase and
      lactate dehydrogenase (CK/LDH).
    explanation: >-
      The CK/LDH discrepancy that distinguishes this myopathy from other causes
      of raised CK.
  notes: >-
    Band assigned from both probands of PMID:36292720 having basal CK two to five
    times reference, plus the index family of PMID:7449146. No larger denominator
    is available.
- name: Psoriasiform dermatitis
  category: Integumentary
  description: >-
    A distinctive eruption reported in a minority of patients: desquamating
    erythematosquamous plaques on extensor surfaces, annular erythematous
    plaques, or pustular psoriasis-like lesions. It classically appears in spring
    and remits in autumn, and it can develop decades after the muscle diagnosis.
    A patient with treatment-resistant severe truncal acne has also been
    reported.
  phenotype_term:
    preferred_term: Psoriasiform dermatitis
    term:
      id: HP:0003765
      label: Psoriasiform dermatitis
    temporality: RECURRENT
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT

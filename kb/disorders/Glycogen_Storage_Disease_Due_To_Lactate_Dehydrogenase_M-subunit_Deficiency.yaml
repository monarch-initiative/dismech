  downstream:
  - target: Cytosolic NADH Reoxidation Failure
    causal_link_type: DIRECT
    description: >-
      Loss of the pyruvate-to-lactate step removes the reaction that regenerates
      cytosolic NAD+ during anaerobic work.
  - target: Epidermal and Follicular Glycolytic Failure
    causal_link_type: DIRECT
    description: >-
      The same null alleles remove M-subunit LDH from epidermis and hair follicle,
      where enzyme histochemistry finds the tissue virtually devoid of activity.
      The edge is drawn from the enzyme loss itself rather than from the muscle
      ATP deficit, because no measurement establishes an ATP deficit in
      keratinocytes.
- name: Cytosolic NADH Reoxidation Failure
  biological_scale: MOLECULAR
  description: >-
    During high-intensity exercise, mitochondrial NADH oxidation cannot keep pace
    with glycolytic flux, and the LDH reaction is what regenerates cytosolic
    NAD+. Without it NADH accumulates and glyceraldehyde-3-phosphate
    dehydrogenase, which requires NAD+, is inhibited. Glycolysis is therefore
    retarded at that step, and the metabolites immediately above it —
    glyceraldehyde 3-phosphate, dihydroxyacetone phosphate and fructose
    1,6-bisphosphate — accumulate. This is the reason the lactate curve on a
    forearm exercise test is flat while pyruvate rises steeply: pyruvate is
    produced but cannot be reduced.
  biological_processes:
  - preferred_term: glycolytic process
    modifier: DECREASED
    term:
      id: GO:0006096
      label: glycolytic process
  - preferred_term: pyruvate metabolic process
    modifier: ABNORMAL
    term:
      id: GO:0006090
      label: pyruvate metabolic process
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycolysis was markedly retarded in the patient's muscle in the
      glyceraldehyde 3-phosphate dehydrogenase (GA3PD) step.
    explanation: >-
      Locates the block in the pathway, measured in patient muscle.
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The glycolysis retardation may be attributed to the impaired reoxidation of
      NADH produced by GA3PD action.
    explanation: >-
      States the redox mechanism by which loss of LDH inhibits the upstream
      dehydrogenase step.
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The response to ischemic forearm work is characteristic in these three
      families: an increase of venous lactate concentration after ischemic work
      was not observed and a marked increase of venous pyruvate was found.
    explanation: >-
      The in vivo consequence of the block, and the basis of the diagnostic
      exercise test.
  downstream:
  - target: Glycerol-3-Phosphate Shunt Compensation
    causal_link_type: DIRECT
    description: >-
      Accumulating NADH is partly reoxidized by cytosolic
      alpha-glycerophosphate dehydrogenase instead.
  - target: Abortive Glycolysis and Muscle ATP Deficit
    causal_link_type: DIRECT
    description: >-
      A retarded pathway yields less ATP per unit time under anaerobic
      conditions.
- name: Glycerol-3-Phosphate Shunt Compensation
  biological_scale: MOLECULAR
  description: >-
    Skeletal muscle cytosol is rich in alpha-glycerophosphate (glycerol
    3-phosphate) dehydrogenase, which reoxidizes NADH by reducing
    dihydroxyacetone phosphate. This partially rescues the redox imbalance, but at
    a cost: it drains triose phosphates out of glycolysis, so the pathway becomes
    abortive rather than merely slow. How much of this shunt a patient has appears
    to set how severe the disease is — muscle glycerol-3-phosphate dehydrogenase
    activity was three times control in mildly affected patients and the sum of
    muscle pyruvate plus lactate was 65% of control in the mild group against 35%
    in the severe group, despite an identical LDHA genotype.
  biological_processes:
  - preferred_term: glycerol-3-phosphate metabolic process
    modifier: INCREASED
    term:
      id: GO:0006072
      label: glycerol-3-phosphate metabolic process
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme reoxidizes the excess NADH and drains triose phosphates from
      the glycolytic pathway under anaerobic conditions.
    explanation: >-
      Describes both halves of the compensation: redox rescue and loss of
      glycolytic intermediates.
  - reference: PMID:7630349
    reference_title: Characterization of the glycolysis in lactate dehydrogenase-A deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that the disease severity in our patients may be
      related to the degree of NADH reoxidation by glycerol 3-phosphate
      dehydrogenase substituting for LDH.
    explanation: >-
      Links the size of the shunt to clinical severity, which is why this
      compensation is modelled as its own node rather than folded into the block.
  downstream:
  - target: Abortive Glycolysis and Muscle ATP Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Draining triose phosphates makes the glycolytic pathway abortive, lowering
      ATP yield even as it relieves the redox block.
- name: Abortive Glycolysis and Muscle ATP Deficit
  biological_scale: CELLULAR
  description: >-
    The net result is that skeletal muscle cannot generate ATP anaerobically at
    the rate that brief maximal effort demands. Oxidative metabolism is intact —
    maximal oxygen uptake is 73-92% of control and the respiratory exchange ratio
    rises normally above 1.0 — so endurance activity is tolerated and the deficit
    is specific to short, high-intensity, anaerobic work. Muscle compensates by
    activating AMP deaminase, which is why the ammonium response to a forearm
    exercise test is exaggerated to 25-30 times baseline while the lactate
    response is flat.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: ATP metabolic process
    modifier: DECREASED
    term:
      id: GO:0046034
      label: ATP metabolic process
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For this reason, ATP production was significantly impaired and muscle cells
      were damaged in these patients.
    explanation: >-
      States the energetic deficit and its immediate cellular consequence.
  - reference: PMID:7549132
    reference_title: Characterization of the oxidative metabolism in lactate dehydrogenase A deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that in these patients, the oxidative functions of
      glycogenolysis in which pyruvate is required for fuel of maximal oxidative
      metabolism are preserved, and that disease severity may be related to the
      degree of muscle oxidative capacity.
    explanation: >-
      Establishes that oxidative metabolism is preserved, which is why the deficit
      is confined to anaerobic effort.
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high increase in ammonium (Figure 2, ammonium increase of 25-30X,
      normal: 5-10X) can be explained as the result of the increased activity of
      AMPD, to compensate for the muscle energetic deficit during intense exertion
      in the context of LDH deficiency
    explanation: >-
      The purine-nucleotide-cycle compensation, and the second half of the
      characteristic exercise-test signature.
  downstream:
  - target: Exercise intolerance
    causal_link_type: DIRECT
    description: >-
      The ATP deficit at maximal anaerobic effort is what limits short,
      high-intensity work, whether or not any fibre is injured.
  - target: Exertional Myocyte Injury
    causal_link_type: DIRECT
    description: >-
      Energy failure during maximal contraction damages the sarcolemma.
  - target: Uterine Smooth Muscle Energy Failure
    causal_link_type: DIRECT
    description: >-
      The same anaerobic deficit in myometrium during sustained labour
      contractions.
- name: Exertional Myocyte Injury
  biological_scale: TISSUE
  description: >-
    Damaged fibres release their cytosolic contents — creatine kinase and
    myoglobin — into the circulation, producing the biochemical and clinical
    picture of rhabdomyolysis. The structural correlate on biopsy is subtle:
    rare subsarcolemmal vacuoles, with LDHA immunostaining showing intracytoplasmic
    aggregates instead of the normal diffuse pattern, which has been described as a
    metabolic-driven vacuolar myopathy. Crucially the injury is episodic and
    exertion-dependent; between episodes patients are neurologically and
    biochemically much closer to normal, and there is no fixed weakness or
    atrophy.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consequently, the cytosolic enzymes and proteins such as creatine kinase
      and myoglobin were released into the blood stream.
    explanation: >-
      Directly reports sarcolemmal leak of CK and myoglobin as the consequence of
      the energy deficit.
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Otherwise, patients with a lactate dehydrogenase M-subunit deficiency do not
      show muscle stiffness and myoglobinuria under ordinary circumstances.
    explanation: >-
      Establishes that injury is confined to anaerobic exertion, the defining
      episodic character of the myopathy.
  - reference: PMID:40033989
    reference_title: "Glycogenosis type XI, a rare association between muscle and skin manifestations - the contribution of proteomics for the understanding of the underlying myopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunostaining with the antibody targeting LDHA showed intracytoplasmic
      aggregates of the protein unlike the normal control that presented a diffuse
      staining.
    explanation: >-
      The histological correlate in patient muscle; note the aggregates are of the
      mutant protein product, not of glycogen.
  downstream:
  - target: Rhabdomyolysis
  - target: Myoglobinuria
  - target: Elevated circulating creatine kinase concentration
  - target: Myalgia
- name: Epidermal and Follicular Glycolytic Failure
  biological_scale: TISSUE
  description: >-
    The second affected tissue is skin. Epidermal keratinocytes and the hair
    follicle depend heavily on glycolysis, and direct enzyme histochemistry in an
    affected patient found the epidermis of the lesional skin and the scalp hair
    follicles virtually devoid of LDH activity. The clinical result is a
    psoriasis-like eruption — erythematosquamous plaques on extensor surfaces,
    annular erythema, or frankly pustular psoriasiform lesions — that
    characteristically flares in warm weather and remits in autumn. Not every
    patient develops it, and in some it appears decades after the muscle
    phenotype is diagnosed, so it is best treated as a late and variable
    manifestation of the same enzyme defect rather than an obligate feature. The
    mechanism connecting the LDH deficit to psoriasiform inflammation is not
    established.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: hair follicular keratinocyte
    term:
      id: CL:2000092
      label: hair follicular keratinocyte
  molecular_functions:
  - preferred_term: L-lactate dehydrogenase (NAD+) activity
    modifier: DECREASED
    term:
      id: GO:0004459
      label: L-lactate dehydrogenase (NAD+) activity
  evidence:
  - reference: PMID:1999544
    reference_title: "Hereditary lactate dehydrogenase M-subunit deficiency: lactate dehydrogenase activity in skin lesions and in hair follicles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The epidermis of the diseased skin and scalp hair follicles of the patient
      were virtually devoid of LDH activity.
    explanation: >-
      Direct tissue evidence that the enzyme defect is present in the affected
      skin, linking the cutaneous phenotype to the same deficiency.
  - reference: PMID:27450766
    reference_title: Hereditary lactate dehydrogenase M-subunit deficiency with late-developing pustular psoriasis-like lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases indicate that abnormal activity of LDH can induce pustular
      psoriatic lesions in the long term.
    explanation: >-
      Supports the causal link from the enzyme defect to the pustular skin
      phenotype, with the authors' own long-latency caveat.
  downstream:
  - target: Psoriasiform dermatitis
- name: Uterine Smooth Muscle Energy Failure
  biological_scale: TISSUE
  description: >-
    Myometrial contraction in labour is sustained and substantially anaerobic, so
    the same ATP deficit appears in the uterus. Affected women report frequent
    uterine pains with raised serum pyruvate in the third trimester, and reported
    deliveries have required caesarean section because of the risk of dystocia
    from a uterus that stiffens rather than contracts effectively. This is the
    clearest example of the disorder affecting a muscle other than skeletal.
  cell_types:
  - preferred_term: uterine smooth muscle cell
    term:
      id: CL:0002601
      label: uterine smooth muscle cell
  evidence:
  - reference: PMID:12078970
    reference_title: "Pregnancy complicated with lactate dehydrogenase M-subunit deficiency: the first case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A woman with lactate dehydrogenase M-subunit deficiency underwent two
      cesarean sections because of the risk of dystocia due to decreased adenosine
      triphosphate production in anaerobic glycolysis including uterine muscles.
    explanation: >-
      Attributes the obstetric complication to the same anaerobic ATP deficit in
      myometrium.
  - reference: PMID:12078970
    reference_title: "Pregnancy complicated with lactate dehydrogenase M-subunit deficiency: the first case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Frequent pains with increased serum pyruvate levels were observed during
      the third trimester of her pregnancies.
    explanation: >-
      Couples the clinical uterine symptom to the biochemical signature of the
      block.
  downstream:
  - target: Uterine stiffness and pain in pregnancy
phenotypes:
- name: Exercise intolerance
  category: Musculoskeletal
  description: >-
    Poor tolerance of short, high-intensity effort specifically. Patients are
    typically athletic and asymptomatic in ordinary life; symptoms appear with
    sprinting, judo, football, or a school exercise test. There is no second-wind
    phenomenon of the kind seen in McArdle disease.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical presentation of LDHA deficiency is characterized by exercise
      intolerance, with cramps, myalgia, and myoglobinuria due to rhabdomyolysis
      after strenuous exercise
    explanation: >-
      Names exercise intolerance as the leading clinical feature of the disorder.
  notes: >-
    Band assigned from the review statement that exercise intolerance
    characterises the clinical presentation, and from its presence in both
    probands of PMID:36292720 (2 of 2). No cohort large enough to compute a real
    proportion has been published.
- name: Myalgia
  category: Musculoskeletal
  description: >-
    Muscle pain and stiffness during or immediately after intense exertion, often
    lasting days and eased by gentle movement of the affected segment.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They complain of muscle rigidity and sudden myoglobinuria after strenous
      exercise under anaerobic conditions.
    explanation: >-
      Describes the exertional pain and stiffness in the three originally
      reported families.
  notes: >-
    Band assigned from the three families of PMID:3383424 and both probands of
    PMID:36292720, in all of whom exertional muscle pain or rigidity was present.
    No denominator large enough for a precise proportion exists.
- name: Rhabdomyolysis
  category: Musculoskeletal
  description: >-
    Episodes of muscle breakdown triggered by anaerobic exertion, with markedly
    raised creatine kinase. Episodes are self-limited and recovery is complete
    between them.
  phenotype_term:

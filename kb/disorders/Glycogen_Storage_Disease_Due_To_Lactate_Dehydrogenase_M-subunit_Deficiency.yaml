  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and all labors were reported to require caesarean section.
    explanation: >-
      Records the delivery outcome across the reported pregnancies, which is what
      makes this obstetrically actionable.
  notes: >-
    Only affected women who have been pregnant can express this, and the
    published pregnancies are few, so the band is a coarse statement about the
    whole patient population rather than a rate among pregnancies. Among reported
    pregnancies in affected women the feature appears to be usual, not
    occasional. No phenotype_term is bound because HPO was searched and has
    nothing for myometrial pain, uterine stiffness or dystocia from failed
    myometrial contraction: the nearest terms are Uterine rupture (HP:0100718),
    Uterine prolapse (HP:0000139) and Shoulder dystocia (HP:0011413), none of
    which name this finding, and there is no term for uterine atony, abnormal
    myometrial contraction or labour dystocia at all. This is a new-term-request candidate rather than an
    unfinished binding.
- name: Acute kidney injury
  category: Renal
  description: >-
    A complication of severe myoglobinuric episodes rather than a primary renal

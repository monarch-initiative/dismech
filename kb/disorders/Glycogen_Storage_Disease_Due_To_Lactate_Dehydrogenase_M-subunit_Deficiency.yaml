classifications:
  icimd_category:
  - classification_value: glycolysis
    notes: >-
      The enzymatic block is at the terminal step of anaerobic glycolysis rather
      than in glycogen synthesis or degradation, so the ICIMD placement is
      glycolysis even though the disorder carries a glycogen storage disease
      number.
    evidence:
    - reference: PMID:36292720
      reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        LDH plays a key role in anaerobic glycolysis as it regenerates
        nicotinamide adenine dinucleotide (NAD+) from NADH to provide ATP in
        situations where mitochondrial NADH oxidation cannot match the glycolysis
        rate
      explanation: >-
        Places the defective enzyme within anaerobic glycolysis, which is the
        basis for the ICIMD glycolysis category.
description: >-
  Lactate dehydrogenase M-subunit deficiency, numbered glycogen storage disease
  type XI, is an ultra-rare autosomal recessive metabolic myopathy caused by
  biallelic loss-of-function variants in LDHA. LDHA encodes the M (muscle)
  subunit of lactate dehydrogenase, the enzyme that closes anaerobic glycolysis
  by reducing pyruvate to lactate and, in doing so, regenerates the NAD+ that
  glyceraldehyde-3-phosphate dehydrogenase needs to keep the pathway running.
  Without it, muscle cannot sustain anaerobic ATP production: patients are
  entirely well at rest and during ordinary activity, but short bursts of
  high-intensity exercise produce myalgia, stiffness, and episodes of
  rhabdomyolysis with myoglobinuria. The diagnostic signature is a flat lactate
  curve on the forearm exercise test with a marked rise in pyruvate — the
  opposite of the substrate that accumulates in McArdle disease — together with
  a serum LDH isoenzyme pattern reduced to the single H4 (LDH-1) band. A minority
  of patients develop distinctive skin disease, most often erythematosquamous or
  pustular psoriasis-like lesions that flare in warm months, and affected women
  report uterine stiffness and pain in late pregnancy with dystocia at delivery.
  Fewer than twenty families have been reported since the first Japanese
  description in 1980.
notes: >-
  Numbering conflict. "GSD XI" denotes two different diseases in the literature.
  It was first applied to Fanconi-Bickel syndrome (SLC2A2/GLUT2), a hepatorenal
  glycogenosis with proximal tubulopathy, and was later reassigned to LDHA
  deficiency. This entry is the LDHA disease (OMIM 612933) and has nothing to do
  with SLC2A2. Papers titled "glycogen storage disease XI" must be checked for
  which of the two they mean before being cited here; at least one recent
  therapeutic paper using that exact title is about Fanconi-Bickel syndrome. The
  kb/groupings/Glycogen_Storage_Diseases.yaml grouping records the same conflict
  and currently lists only the Fanconi-Bickel entry; adding this entry as a
  member of that grouping is a reasonable follow-up but is deliberately not done
  in the same change.

  Scope. LDHB (the H subunit, heart type) and LDHC (testis) are separate genes
  and are not modelled here. Complete LDH-B deficiency is a distinct and largely
  asymptomatic biochemical trait.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  penetrance: UNKNOWN
  description: >-
    Affected individuals carry two loss-of-function LDHA alleles. Heterozygous
    parents and siblings have a partial reduction in M-subunit-containing
    isoenzymes on erythrocyte electrophoresis but are clinically asymptomatic,
    so carrier detection is biochemically possible. Expressivity among
    homozygotes for the same allele is variable: in one series four patients from
    two families carrying the identical 20-base-pair deletion differed markedly
    in symptom severity.
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      LDH-A deficiency is an autosomal recessive disorder (glycogenosis type XI,
      OMIM#612933) caused by mutations in the LDHA gene.
    explanation: >-
      States the mode of inheritance and the gene.
  - reference: PMID:7449146
    reference_title: Hereditary deficiency of lactate dehydrogenase M-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ratio between H-subunit and M-subunit (H/M) in erythrocyte LDH
      suggested a partial absence of the M-subunit in two siblings and in the
      parents.
    explanation: >-
      Documents the intermediate carrier state in obligate heterozygotes, the
      family-study evidence for recessive transmission.
  - reference: PMID:7630349
    reference_title: Characterization of the glycolysis in lactate dehydrogenase-A deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the glycolytic features of 4 patients from 2 families in whom the
      severity of the disease differed. There was no difference in the gene
      abnormality.
    explanation: >-
      Same genotype, different severity — the basis for recording variable
      expressivity.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population rate has been estimated. Counting is by reported family: about
    14 families with altered LDHA activity as of 2022, most of them Japanese,
    with the first description in 1980. Because affected individuals are well
    unless they exercise hard, and because serum total LDH can read normal, the
    condition is likely to be under-ascertained.
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      14 different families with altered LDHA activity have been reported.
    explanation: >-
      The published family count that supports the ultra-rare classification.
  - reference: PMID:40033989
    reference_title: "Glycogenosis type XI, a rare association between muscle and skin manifestations - the contribution of proteomics for the understanding of the underlying myopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are very few cases described in the literature and there is limited
      awareness of this condition that can easily be misdiagnosed or remain
      undiagnosed.
    explanation: >-
      Supports both the rarity and the under-ascertainment caveat recorded in the
      notes.
pathophysiology:
- name: LDHA Loss and Muscle Lactate Dehydrogenase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic LDHA variants abolish the M subunit of lactate dehydrogenase. The
    reported alleles are nulls — a recurrent 20-base-pair frameshifting deletion
    in exon 6, nonsense variants such as p.Ser137Ter and p.Trp250Ter, and a
    frameshifting deletion in exon 7 — and the truncated protein is degraded
    rather than made. Because functional LDH is a tetramer assembled from M and H
    subunits, losing M removes four of the five isoenzymes: only H4 (LDH-1)
    survives, so the serum isoenzyme pattern collapses to a single band. Residual
    LDH activity in skeletal muscle, where the M subunit normally predominates,
    falls below 5% of control.
  genes:
  - preferred_term: LDHA
    term:
      id: hgnc:6535
      label: LDHA
  genetic_context:
    gene:
      preferred_term: LDHA
      term:
        id: hgnc:6535
        label: LDHA
    allele_type: FRAMESHIFT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Null alleles on both chromosomes. The most prevalent variant is a
      20-base-pair deletion in exon 6 producing a premature stop; nonsense and
      other frameshifting alleles have the same consequence.

  - reference: PMID:27450766
    reference_title: Hereditary lactate dehydrogenase M-subunit deficiency with late-developing pustular psoriasis-like lesions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary lactate dehydrogenase (LDH) M-subunit deficiency is very rare
      and we have found reports of close to a dozen cases in the published work,
      two of which were associated with pustular psoriasis-like lesions.
    explanation: >-
      Gives the numerator and denominator behind the frequency band: two of about
      a dozen published cases had pustular psoriasiform lesions at the time of
      that report.
  notes: >-
    Band from PMID:27450766, which counted 2 of approximately 12 published cases
    with pustular psoriasis-like lesions, becoming 3 with that report; one of the
    two probands in PMID:36292720 had psoriasis-like dermatitis. Counting all
    reported cutaneous morphologies together would raise the estimate, and the
    true proportion is uncertain in so small a literature.
- name: Uterine stiffness and pain in pregnancy
  category: Reproductive
  description: >-
    Frequent uterine pains in the third trimester with raised serum pyruvate, and
    a risk of dystocia in labour attributed to inadequate anaerobic ATP supply to
    the myometrium. Reported deliveries have been by caesarean section.
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:36292720

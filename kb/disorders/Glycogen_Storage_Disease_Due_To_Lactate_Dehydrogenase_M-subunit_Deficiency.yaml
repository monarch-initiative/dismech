genetic:
- name: LDHA
  gene_term:
    preferred_term: LDHA
    term:
      id: hgnc:6535
      label: LDHA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    LDHA at 11p15.1 has seven protein-coding exons and encodes the 331-amino-acid
    M subunit of lactate dehydrogenase. Reported disease alleles are
    predominantly null: a recurrent 20-base-pair deletion in exon 6 (the most
    prevalent variant, truncating the protein at 259 residues), the nonsense
    variants c.410C>A (p.Ser137Ter) and c.750G>A (p.Trp250Ter), and a
    frameshifting c.766_767delGT in exon 7. A splice variant and a small
    insertion have also been described.
  variants:
  - name: 20-base-pair deletion in exon 6
    type: FRAMESHIFT
    description: >-
      The most prevalent reported allele. Frameshift and premature termination
      yield a 259-residue product that is not detectable immunologically.
  - name: NM_005566:c.410C>A (p.Ser137Ter)
    type: NONSENSE
    description: >-
      Found homozygous in one Spanish proband and compound heterozygous with
      c.750G>A in a second, on a shared haplotype.
  - name: NM_005566:c.766_767delGT
    type: FRAMESHIFT
    description: >-
      Homozygous exon 7 frameshift in a consanguineous North African family, with
      myopathy and severe treatment-resistant acne.
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified in the LDHA gene a homozygous c.410C>A substitution that
      predicts a p.Ser137Ter nonsense mutation in Patient One and a compound
      heterozygous c.410C>A (p.Ser137Ter) and c.750G>A (p.Trp250Ter) nonsense
      mutation in Patient Two.
    explanation: >-
      Documents two nonsense alleles segregating with the phenotype in two
      families.
  - reference: PMID:40033989
    reference_title: "Glycogenosis type XI, a rare association between muscle and skin manifestations - the contribution of proteomics for the understanding of the underlying myopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome analysis revealed a novel bi-allelic frameshifting deletion in exon 7
      of the LDHA gene; c.766_767delGT.
    explanation: >-
      A further biallelic null allele, extending the mutational spectrum beyond
      the Japanese and Spanish families.
  - reference: PMID:7603529
    reference_title: "Lactate dehydrogenase M-subunit deficiencies: clinical features, metabolic background, and genetic heterogeneities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genomic analysis revealed the heterogeneities of the mutations of this
      disease.
    explanation: >-
      States that the disorder is allelically heterogeneous rather than caused by
      a single founder variant.
biochemical:
- name: Serum LDH isoenzyme pattern restricted to LDH-1 (H4)
  notes: >-
    Electrophoretic separation of serum or erythrocyte LDH isoenzymes shows a
    single band. Normally five tetramers are present (H4, H3M, H2M2, HM3, M4);
    with no M subunit, only H4 can be assembled. This is a cheap, decisive test,
    and it is diagnostic in a way that total LDH activity is not — total serum
    LDH is often normal or even raised, because the surviving H4 band is
    upregulated and because muscle damage releases what enzyme there is.
  evidence:
  - reference: PMID:7449146
    reference_title: Hereditary deficiency of lactate dehydrogenase M-subunit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophoretic analysis of serum LDH isoenzymes of the propositus
      demonstrated only one activity band of LDH H4.
    explanation: >-
      The isoenzyme finding that defines M-subunit deficiency biochemically.
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the isoenzyme pattern of the patients revealed a complete absence of the
      isoenzymes containing the M subunit, showing only one band of the LDH-1
      (H4) isoenzyme
    explanation: >-
      Confirms the same isoenzyme signature in genetically characterised modern
      patients.
diagnosis:
- name: Forearm exercise test with lactate, pyruvate and ammonium
  description: >-
    The functional test of choice. In an affected patient the venous lactate
    curve is flat, as it is in McArdle disease, but pyruvate rises steeply
    instead — that pyruvate rise is what separates a terminal glycolytic block
    from a glycogenolytic one. The ammonium response is exaggerated, around 25 to
    30 times baseline against a normal 5 to 10 times, because AMP deaminase is
    recruited to compensate.
  evidence:
  - reference: PMID:3383424
    reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The response to ischemic forearm work is characteristic in these three
      families: an increase of venous lactate concentration after ischemic work
      was not observed and a marked increase of venous pyruvate was found.
    explanation: >-
      Describes the flat-lactate, high-pyruvate response that is the functional
      diagnostic signature.
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, a flat lactate curve on the forearm exercise test, along with the
      clinical combination of myopathy and psoriatic-like dermatitis, can also
      lead to the diagnosis.
    explanation: >-
      Confirms the exercise test plus the muscle-and-skin combination as the
      route to diagnosis in current practice.
- name: LDHA sequencing
  description: >-
    Biallelic LDHA variants confirm the diagnosis. In practice the gene is
    reached through a metabolic myopathy panel or exome; the common differential
    genes PYGM and CPT2 are excluded in the same test.
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To identify the genetic causes of patient phenotypes, we performed a
      customized NGS panel including 32 genes associated with metabolic
      myopathies.
    explanation: >-
      Describes the panel-based route by which the diagnosis is now made.
differential_diagnoses:
- name: McArdle disease (GSD V, PYGM)
  description: >-
    The closest mimic: exercise intolerance, exertional rhabdomyolysis and a flat
    lactate curve on the forearm test. The discriminator is pyruvate — it rises
    steeply in LDHA deficiency because the block is below pyruvate, and does not
    in McArdle disease because the block is at glycogen breakdown, above it.
    McArdle disease also shows a second-wind phenomenon, which LDHA deficiency
    does not, and has no cutaneous phenotype.
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the main difference in the lactate stress test results of patients
      with LDHA deficiency compared with those with the very common glycogenosis
      (i.e., GSD V) is the high response of pyruvate, as the lactate response is
      similar in both diseases
    explanation: >-
      States exactly which measurement distinguishes the two disorders.
- name: Fanconi-Bickel syndrome (SLC2A2)
  description: >-
    Not a clinical mimic but a nomenclature one: it also carries the label GSD XI
    in much of the literature. It is a hepatorenal glycogenosis with
    hepatomegaly, proximal tubulopathy and rickets, with no exertional myopathy.
    Any citation whose title says "glycogen storage disease XI" needs to be
    checked against the gene before use.
- name: Carnitine palmitoyltransferase II deficiency
  description: >-
    Also causes recurrent exertional rhabdomyolysis, but triggered by prolonged
    endurance exercise, fasting or fever rather than brief maximal effort, with a
    normal lactate response to the forearm test and an abnormal acylcarnitine
    profile.
- name: Complete LDH-B (H-subunit) deficiency
  description: >-
    The reciprocal enzyme defect. It also produces an abnormal serum isoenzyme
    pattern but is clinically silent, with no myopathy, and must not be conflated
    with M-subunit deficiency when an isoenzyme report is abnormal.
treatments:
- name: Avoidance of maximal anaerobic exertion
  description: >-
    The only management with a mechanistic rationale. Because the defect is
    confined to anaerobic ATP supply and oxidative capacity is preserved,
    endurance and moderate activity are tolerated while short maximal efforts —
    sprinting, competitive contact sport, isometric loading — are what precipitate
    rhabdomyolysis. Patients are advised to pace effort and to seek care for dark
    urine. This is standard metabolic myopathy advice rather than an
    LDHA-specific intervention tested in a trial.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: activity modification to avoid anaerobic exertion
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Exertional Myocyte Injury
    description: >-
      Removing the anaerobic trigger prevents the energy failure that damages the
      fibre; it does not correct the enzyme deficiency.
    evidence:
    - reference: PMID:3383424
      reference_title: "Lactate dehydrogenase M-subunit deficiency: a new type of hereditary exertional myopathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Otherwise, patients with a lactate dehydrogenase M-subunit deficiency do
        not show muscle stiffness and myoglobinuria under ordinary circumstances.
      explanation: >-
        Establishes that symptoms are confined to anaerobic exertion, from which
        avoidance follows as a mechanism-based measure; no trial has tested the
        advice itself, so the support is indirect.
  evidence:
  - reference: PMID:7549132
    reference_title: Characterization of the oxidative metabolism in lactate dehydrogenase A deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Maximal oxygen uptake in the patients with severe and mild symptoms was
      approximately 73% and 92% of control.
    explanation: >-
      Near-normal aerobic capacity is why the advice restricts anaerobic effort
      specifically rather than exercise in general.
  notes: >-
    No controlled study of activity modification in this disorder exists. The
    recommendation follows from the metabolic physiology and from the observation
    that patients are asymptomatic under ordinary circumstances.
- name: Supportive management of rhabdomyolysis episodes
  description: >-
    Acute episodes are managed as rhabdomyolysis from any cause: intravenous
    fluids to protect renal function, monitoring of creatine kinase and renal
    function, and rest until recovery. There is no disease-specific acute
    therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Acute kidney injury
    term:
      id: HP:0001919
      label: Acute kidney injury
  evidence:
  - reference: PMID:36292720
    reference_title: "Clinical, Biochemical, and Molecular Characterization of Two Families with Novel Mutations in the LDHA Gene (GSD XI)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myoglobinuria may lead to acute renal failure [7,8].
    explanation: >-
      The complication that supportive management of an episode is intended to
      prevent.
- name: Genetic counseling
  description: >-
    Autosomal recessive transmission with a 25% sibling recurrence risk.
    Counseling of affected women should also cover the obstetric risk, since
    reported pregnancies have involved third-trimester uterine pain and delivery
    by caesarean section.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12078970
    reference_title: "Pregnancy complicated with lactate dehydrogenase M-subunit deficiency: the first case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A woman with lactate dehydrogenase M-subunit deficiency underwent two
      cesarean sections because of the risk of dystocia due to decreased adenosine
      triphosphate production in anaerobic glycolysis including uterine muscles.
    explanation: >-
      The obstetric risk that counseling of affected women needs to cover.
animal_models:
- name: Drosophila Ldh null larva (Ldh16/Ldh17)
  species: Drosophila melanogaster
  genotype: Ldh16/Ldh17 trans-heterozygous null
  publication: PMID:42465323
  description: >-
    Drosophila expresses a single LDH enzyme, so a trans-heterozygous null
    removes lactate dehydrogenase activity outright. Null larvae are viable at
    rest but die when forced to move continuously, and are slower in
    goal-directed crawling; a rescuing Ldh transgene abolishes both effects.
    This is currently the only published whole-organism model that reproduces
    the exertion-dependent character of the human disease.
  modeled_mechanisms:
  - target: Abortive Glycolysis and Muscle ATP Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of LDH leaves the animal normal at rest and failing under sustained
      physical demand, which is the defining shape of the human node: an ATP
      deficit that appears only when glycolytic flux must be sustained
      anaerobically.
    limitations: >-
      Drosophila has one LDH rather than the M/H subunit system, so the model
      cannot reproduce the tissue-restricted deficiency, the surviving H4
      isoenzyme, or the diagnostic serum isoenzyme pattern that define the human
      disease. The endpoint is larval death during forced movement, which has no
      human counterpart -- LDHA-deficient people are exercise intolerant, not at
      risk of death from exertion -- and the authors report that muscle-specific
      rescue does not restore viability, so the fly phenotype is not
      muscle-autonomous in the way the human myopathy is. The NAD+-regeneration
      mechanism that would link this model to the node is offered as an
      interpretation, not measured. Neither rhabdomyolysis nor myoglobinuria is
      assayed.
    readouts:
    - name: Survival during forced-movement exertion challenge
      target: Abortive Glycolysis and Muscle ATP Deficit
      direction: DECREASED
      interpretation: >-
        Exertion-dependent failure, absent at rest and absent in the transgenic
        rescue, is the model's closest correlate of the human exercise
        intolerance.
      evidence:
      - reference: PMID:42465323
        reference_title: Drosophila melanogaster lactate dehydrogenase deficiency recapitulates the exercise intolerance of human glycogen storage disease type XI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Whereas controls and Ldh mutants expressing the rescuing transgene
          showed no lethality up to 40 minutes of stimulation, Ldh mutants began
          dying within 10 minutes, and all animals died by 50 minutes (Figure
          4B).
        explanation: >-
          The measurement itself, with the rescue transgene as the internal
          control that ties it to Ldh loss.
    - name: Crawling speed and time to reach a food source
      target: Abortive Glycolysis and Muscle ATP Deficit
      direction: DECREASED
      interpretation: >-
        Baseline locomotor impairment, measured separately from the exertion
        challenge; it shows the deficit is not confined to extreme effort.
      evidence:
      - reference: PMID:42465323
        reference_title: Drosophila melanogaster lactate dehydrogenase deficiency recapitulates the exercise intolerance of human glycogen storage disease type XI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In both assays, Ldh mutants were significantly delayed in reaching the
          yeast (Figure 4D) and crawled more slowly than control or rescue
          (Figure 4E).
        explanation: >-
          Quantifies the locomotor phenotype against both a genetic control and
          the rescue.
    evidence:
    - reference: PMID:42465323
      reference_title: Drosophila melanogaster lactate dehydrogenase deficiency recapitulates the exercise intolerance of human glycogen storage disease type XI.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This exertion-dependent phenotype closely parallels the clinical
        presentation of LDHA deficiency in humans, where symptoms such as muscle
        pain, weakness, and rhabdomyolysis are typically triggered by physical
        activity rather than evident at rest
      explanation: >-
        The authors' own statement of what the model is informative for, which is
        the exertion dependence rather than the myopathy itself.
  notes: >-
    PMID:42465323 is a bioRxiv preprint and has not been peer reviewed; the model
    is recorded with that caveat rather than withheld, because it is the only
    organism-level model of this disease in the literature. No mouse model of
    GSD XI exists: a PubMed search for Ldha-deficient mice with a muscle or
    exercise phenotype returns cancer and metabolism studies plus a 1987
    hemolytic-anaemia mouse mutant (PMID:3315726), none of which model the human
    exertional myopathy.
discussions:
- discussion_id: ldha_skin_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does loss of the LDH M subunit produce psoriasiform and pustular skin
    disease, and why only in some patients?
  attaches_to:
  - pathophysiology#Epidermal and Follicular Glycolytic Failure
  - phenotypes#Psoriasiform dermatitis
  rationale: >-
    What is established is that the enzyme is missing from lesional epidermis and
    hair follicles, and that the eruption occurs in a minority of patients,
    sometimes decades after the muscle phenotype. What is not established is the
    step between the two. Keratinocytes are highly glycolytic, but no study has
    shown that a keratinocyte ATP or redox deficit drives the inflammatory
    phenotype, and the pustular cases were specifically reported as not carrying
    IL36RN variants, which excludes the obvious alternative explanation of
    coincidental generalised pustular psoriasis. The seasonal pattern — flares in
    warm months, remission in autumn — is unexplained by any current model.
  proposed_experiments:
  - experiment_id: ldha_keratinocyte_redox
    name: Redox and inflammatory profiling of LDHA-null keratinocytes
    description: >-
      Generate LDHA-null human keratinocytes by gene editing, culture them as
      organotypic epidermal equivalents under normal and raised temperature, and
      measure cytosolic NADH/NAD+ ratio, ATP, and release of psoriasis-associated
      cytokines including IL-36 family members and IL-17-inducing signals,
      comparing against isogenic controls.
    would_support:
    - pathophysiology#Epidermal and Follicular Glycolytic Failure
    supporting_outcome:
    - >-
      LDHA-null keratinocytes show a raised NADH/NAD+ ratio and lower ATP, and
      release psoriasis-associated cytokines in excess of isogenic controls, with
      the difference widening at raised temperature.
    would_refute:
    - pathophysiology#Epidermal and Follicular Glycolytic Failure
    refuting_outcome:
    - >-
      LDHA-null keratinocytes maintain normal redox state, ATP and cytokine
      output, which would mean the skin phenotype is not a direct keratinocyte
      energy or redox failure and some other cell type or systemic factor
      mediates it.
- discussion_id: ldha_severity_modifier
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is glycerol-3-phosphate dehydrogenase capacity the modifier that sets
    severity among patients with identical LDHA genotypes?
  attaches_to:
  - pathophysiology#Glycerol-3-Phosphate Shunt Compensation
  rationale: >-
    Four patients from two families carrying the same 20-base-pair deletion
    differed markedly in severity, and the group that reported them found
    threefold higher muscle glycerol-3-phosphate dehydrogenase activity in the
    mildly affected patients. That is a plausible modifier and it is the only one
    proposed, but it rests on four patients and a correlation, with no genetic
    variant identified in GPD1 or elsewhere and no independent replication in the
    thirty years since. The alternative offered by the same group — that severity
    tracks muscle oxidative capacity — has the same evidential standing, and the
    two have never been separated.

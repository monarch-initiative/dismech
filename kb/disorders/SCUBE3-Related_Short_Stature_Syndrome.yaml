genetic:
- name: SCUBE3
  gene_term:
    preferred_term: SCUBE3
    term:
      id: hgnc:13655
      label: SCUBE3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    SCUBE3 (6p21.31) encodes a secreted and membrane-associated glycoprotein of
    the SCUBE family. Reported disease variants are missense, frameshift,
    nonsense, canonical splice-site changes and a complex intragenic
    rearrangement, dispersed across the whole coding sequence. Several missense
    variants cluster in the calcium-binding EGF-like repeats, where they disrupt
    disulfide bonds or calcium coordination and so impair the protein-protein
    interactions those domains mediate.
  evidence:
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The discovered variations, which comprised missense, frameshift, nonsense, and canonical splice site modifications as well as a complicated intragenic rearrangement, were dispersed throughout the entire coding sequence of SCUBE3."
    explanation: >-
      Characterizes the variant spectrum, which is dispersed rather than
      domain-restricted.
  - reference: PMID:40331102
    reference_title: "A Novel Homozygous Missense SCUBE3 Variant with Protein Modeling in a Patient Diagnosed as Short Stature, Facial Dysmorphism, and Skeletal Anomalies With or Without Cardiac Anomalies 2."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Protein modeling using AlphaFold3 revealed disruption of a critical disulfide bridge within the seventh epidermal growth factor-like repeat, likely affecting protein stability."
    explanation: >-
      Structural modelling of a novel missense allele. Classified COMPUTATIONAL
      because the mechanism claim rests on modelling rather than an assay, and
      the source hedges it as "likely".
pathophysiology:
- name: Loss of SCUBE3 BMP Co-Receptor Function
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Biallelic inactivating SCUBE3 variants remove a membrane-associated BMP2/4
    co-receptor. Wild-type SCUBE3 attracts BMP receptor complexes to lipid-raft
    microdomains and enhances BMP signalling, apparently by facilitating the
    interaction of BMP ligands with BMP type I receptors. The
    best-characterized illustration of what that loss costs at the protein level
    is the N294K substitution, which reaches the cell surface normally but fails
    to complex with BMP type IA receptor - so the defect is in receptor
    engagement, not in protein trafficking. Read that as mechanism rather than
    as a patient variant: N294K is a mouse ENU-induced allele and is not among
    the human variants this entry curates. It is informative here because it
    sits in the cbEGF7 calcium-binding repeat, the same module the human
    missense alleles disrupt.
  genes:
  - preferred_term: SCUBE3
    term:
      id: hgnc:13655
      label: SCUBE3
  biological_processes:
  - preferred_term: BMP signaling pathway
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  downstream:
  - target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
    causal_link_type: DIRECT
    description: >-
      Loss of the co-receptor lowers BMP/SMAD output in the cells that build
      cartilage and bone. Two independent lines make this edge rather than the
      nodes alone: knocking SCUBE3 down in human bone-marrow mesenchymal stem
      cells blocks osteogenic differentiation, and the disease-associated
      alleles themselves reduce SMAD transactivation in vitro.
    evidence:
    - reference: PMID:39250278
      reference_title: "SCUBE3 promotes osteogenic differentiation and mitophagy in human bone marrow mesenchymal stem cells through the BMP2/TGF-beta signaling pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "SCUBE3 levels increase significantly during early osteogenic differentiation of hBMSCs, and that reducing SCUBE3 levels can hinder this differentiation"
      explanation: >-
        A loss-of-function manipulation in human osteogenic precursors, which is
        the same direction as the disease. Supports the edge rather than either
        node: removing SCUBE3 is what impairs the differentiation.
    - reference: PMID:34142127
      reference_title: "Saturation mutagenesis defines novel mouse models of severe spine deformity."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we demonstrated that disease-associated mutations are associated with reduced transactivation of Smad signaling in vitro"
      explanation: >-
        Ties the disease alleles specifically to reduced SMAD transactivation,
        which is the signalling step this edge asserts.
    - reference: PMID:34142127
      reference_title: "Saturation mutagenesis defines novel mouse models of severe spine deformity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "By integrating results with a human clinical exome database, we identified a patient with undiagnosed skeletal disease who harbored recessive mutations in SCUBE3"
      explanation: >-
        Establishes that the alleles assayed above are the human recessive ones,
        which is what lets the in-vitro result stand for the human disease.
        Split from the in-vitro clause because the two halves of that sentence
        are different kinds of evidence.
  - target: Impaired BMP-Driven Odontoblast Differentiation
    causal_link_type: DIRECT
    description: >-
      The dental arm of the same co-receptor loss. Scube3 is a tooth-germ
      epithelial transcript, and epithelium-derived SCUBE3 drives odontoblastic
      differentiation of dental mesenchyme through BMP2 signalling.
    evidence:
    - reference: PMID:37189178
      reference_title: "Epithelium-derived SCUBE3 promotes polarized odontoblastic differentiation of dental mesenchymal stem cells and pulp regeneration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In hDPSCs, exogenous SCUBE3 promoted cell proliferation and migration via TGF-β signalling and accelerated odontoblastic differentiation via BMP2 signalling."
      directness: INDIRECT
      explanation: >-
        Establishes that SCUBE3 acts on odontoblastic differentiation through
        BMP2. Graded INDIRECT because it is a sufficiency result in healthy
        cells: the edge's claim that losing SCUBE3 impairs the step follows by
        inference, not from this experiment.
  evidence:
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that SCUBE3 acts as a BMP2/BMP4 co-receptor, recruits the BMP receptor complexes into raft microdomains, and positively modulates signaling possibly by augmenting the specific interactions between BMPs and BMP type I receptors."
    explanation: >-
      The primary functional demonstration of the co-receptor role, from the
      gene-discovery cohort study.
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional validation studies demonstrated a variable impact of disease-causing variants on transcript processing, protein secretion and function, and their dysregulating effect on bone morphogenetic protein (BMP) signaling."
    explanation: >-
      Establishes that the disease variants act through BMP signalling, with
      variable severity across alleles.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "membrane-associated SCUBE3 may function as a BMP2/4 coreceptor, attract BMP receptor complexes to raft microdomains, and enhance BMP signaling"
    explanation: >-
      States the molecular function whose loss initiates the disease.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the SCUBE3-N294K mutant protein is expressed on the cell surface, but it does not readily form a complex with the BMP type IA receptor"
    explanation: >-
      Localizes the defect to receptor engagement rather than to surface
      delivery, which is the distinction this node draws.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the gene is prominently expressed in human primary cultured osteoblasts"
    explanation: >-
      Expression profiling that explains why a ubiquitously available secreted
      co-receptor produces a skeletal phenotype: the gene is concentrated in the
      cell type that fails. Trimmed to the human cultured-osteoblast clause so
      the item carries one kind of evidence; the mouse long-bone half of the
      same sentence would be model-organism data.
- name: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
  biological_scale: TISSUE
  description: >-
    Reduced BMP signalling impairs chondrogenesis and osteogenesis. Scube3
    knockout mice show impaired BMP-mediated chondrogenesis and osteogenesis
    with craniofacial and dental abnormalities, decreased body size and faulty
    endochondral bone development - the same combination of skeletal, facial and
    dental findings seen in patients, which is what makes this a convincing
    mechanism rather than a plausible one.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: endochondral bone growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  downstream:
  - target: Reduced Growth with Craniofacial, Dental and Skeletal Anomalies
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33308444
      reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Scube3-/- mice showed craniofacial and dental defects, reduced body size, and defective endochondral bone growth due to impaired BMP-mediated chondrogenesis and osteogenesis, recapitulating the human disorder."
      explanation: >-
        The quoted sentence states the causal direction this edge asserts - the
        organism-level findings arise from the impaired chondrogenesis and
        osteogenesis, not merely alongside it.
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in a molecularly confirmed case. Grouped here because cranial
      bone growth shares the osteogenic defect, but a neural growth mechanism
      has not been shown.
  evidence:
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Scube3-/- mice showed craniofacial and dental defects, reduced body size, and defective endochondral bone growth due to impaired BMP-mediated chondrogenesis and osteogenesis, recapitulating the human disorder."
    explanation: >-
      The knockout phenotype from the primary study, explicitly described as
      recapitulating the human disorder.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our analysis of this knockout mouse revealed that it has impaired BMP-mediated chondrogenesis and osteogenesis, which result in craniofacial and dental abnormalities, decreased body size, and faulty endochondral bone development"
    explanation: >-
      The knockout phenotype, matching the human findings across all four
      domains.
- name: Impaired BMP-Driven Odontoblast Differentiation
  biological_scale: CELLULAR
  description: >-
    The dental arm of the mechanism, which is separable from the bone arm rather
    than a restatement of it. Scube3 transcript in the developing tooth is
    epithelial, and the protein moves to the mesenchyme, so the defect is in an
    epithelial-to-mesenchymal instruction: without it, dental mesenchymal cells
    fail to differentiate into polarized odontoblasts. The epithelial side is
    affected too - Scube3 knockout ameloblasts are shorter and wider and lose
    their Tomes processes; ameloblasts are epithelial rather than the
    mesenchyme-derived odontoblasts this node is bound to, and are recorded here
    because ameloblast induction is a prerequisite for odontoblast
    differentiation. This is why dental anomalies are prominent enough to appear
    in the disorder's ISDS row rather than being an incidental finding.


    One caveat on how much this node claims. Nothing has been measured in
    SCUBE3-deficient human or mouse teeth at the odontoblast level: the Scube3
    knockout reports dental defects clinically, and the odontoblast step is a
    sufficiency result in healthy cells read in reverse. The DECREASED modifiers
    on the two GO processes are therefore an inference from the direction of
    those experiments rather than a measured reduction.
  cell_types:
  - preferred_term: odontoblast
    term:
      id: CL:0000060
      label: odontoblast
  biological_processes:
  - preferred_term: odontoblast differentiation
    term:
      id: GO:0071895
      label: odontoblast differentiation
    modifier: DECREASED
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: DECREASED
  downstream:
  - target: Dental anomalies
    causal_link_type: DIRECT
    description: >-
      Failure of polarized odontoblast differentiation is the cellular event
      behind the clinical dental findings.
    evidence:
    - reference: PMID:33308444
      reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Scube3-/- mice showed craniofacial and dental defects, reduced body size, and defective endochondral bone growth due to impaired BMP-mediated chondrogenesis and osteogenesis, recapitulating the human disorder."
      explanation: >-
        Removing Scube3 produces dental defects, which is the direction this
        edge asserts. The cited sentence names the clinical-level outcome, not
        the odontoblast step, so the cell-level attribution rests on the node's
        own evidence rather than on this quote.
    - reference: PMID:37189178
      reference_title: "Epithelium-derived SCUBE3 promotes polarized odontoblastic differentiation of dental mesenchymal stem cells and pulp regeneration."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "exogenous SCUBE3 promoted cell proliferation and migration via TGF-β signalling and accelerated odontoblastic differentiation via BMP2 signalling"
      explanation: >-
        Graded INDIRECT because the experiment is the converse of the disease:
        it shows SCUBE3 is sufficient to drive odontoblastic differentiation in
        healthy human cells, from which the edge infers that losing it impairs
        that step.
  evidence:
  - reference: PMID:37189178
    reference_title: "Epithelium-derived SCUBE3 promotes polarized odontoblastic differentiation of dental mesenchymal stem cells and pulp regeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "whose transcript expression is restricted to the tooth germ epithelium during the development of embryonic mouse teeth, has been demonstrated to play a crucial role in the regulation of tooth development"
    explanation: >-
      Places SCUBE3 in the tooth germ epithelium during odontogenesis, which is
      what makes an epithelial-to-mesenchymal instruction the right model here.
  - reference: PMID:37189178
    reference_title: "Epithelium-derived SCUBE3 promotes polarized odontoblastic differentiation of dental mesenchymal stem cells and pulp regeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the specific knockout of SCUBE3 leads to a decrease in height, increase in width of ameloblasts, and loss of representative Tomes processes"
    explanation: >-
      The ameloblast side of the dental defect in the Scube3 knockout. Two
      caveats travel with it. Ameloblasts are epithelial, not the
      mesenchyme-derived odontoblasts this node is bound to, so it supports the
      node's dental scope rather than its cell type; ameloblast induction is a
      prerequisite for odontoblast differentiation, which is why it sits here.
      And the sentence is this paper's introduction reporting somebody else's
      knockout result rather than its own finding, so the primary report would
      be the better citation if it can be identified.

discussions:
- discussion_id: scube3_mouse_null_milder_than_human
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the Scube3 null mouse viable, fertile and grossly normal at birth
    when biallelic SCUBE3 loss in humans produces prenatal growth restriction
    and a recognizable multisystem syndrome?
  attaches_to:
  - pathophysiology#Impaired BMP-Mediated Chondrogenesis and Osteogenesis
  - animal_models#Scube3 knockout mouse
  rationale: >-
    This is a mismatch in severity rather than in kind: the knockout does
    reproduce the craniofacial, dental and endochondral domains, so the model is
    informative, but it does not reproduce how much they cost the organism. The
    standing explanation is redundancy with the other SCUBE family members, and
    the zebrafish work makes that concrete - single scube mutants are mild while
    triple mutants approach a complete Hedgehog loss-of-function phenotype. That
    explanation has a consequence for interpreting this disease, which is why it
    is worth recording rather than filing as a caveat: if compensation by SCUBE1
    and SCUBE2 sets how severe a given individual is, then the variable
    expressivity in patients may be modifier-driven rather than allele-driven,
    and no study has tested that. Note also that the zebrafish result is
    Hedgehog, not BMP, and mouse Scube3 does not affect Hedgehog - so the
    redundancy argument is being carried across species and across pathways, and
    it has not been shown for BMP in mammals.
  evidence:
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice that are homozygous for the tm1(KOPM)Vlcg allele (Scube3−/−) are born at expected Mendelian ratios, show no overt embryonic phenotypes, and are both viable and fertile"
    explanation: >-
      The half of the mismatch that concerns the mouse: the null is viable,
      fertile and grossly normal at birth.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mouse Scube3 does not appear to affect the HH pathway, unlike zebrafish scube3"
    explanation: >-
      Sources this discussion's own caveat against itself: the redundancy
      argument is carried from a Hedgehog result in zebrafish to a BMP claim in
      mammals, and this sentence is why that step is not safe.
  - reference: PMID:40912446
    reference_title: "Redundant and novel functions of scube genes during zebrafish development."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Individual functional characterisation has proved challenging because of overlapping expression patterns and compensatory mechanisms that likely obscure specific roles."
    explanation: >-
      States the compensation problem the redundancy explanation rests on.
      Graded OTHER because the sentence describes the difficulty of the research
      rather than reporting a zebrafish result, and INDIRECT because it is the
      premise of the argument rather than a demonstration of it.
  - reference: PMID:40912446
    reference_title: "Redundant and novel functions of scube genes during zebrafish development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "all three Scube proteins contribute to muscle development at distinct levels, with triple knockout zebrafish larvae displaying near-complete Hedgehog loss-of-function phenotypes"
    explanation: >-
      The concrete demonstration that removing one family member understates the
      pathway's role, which is the argument for why the single mouse null is
      mild. Note this is a Hedgehog readout, not BMP.
- discussion_id: scube3_no_disease_specific_management_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any SCUBE3-specific management, and does recombinant growth hormone
    help these patients?
  attaches_to:
  - treatments#
  rationale: >-
    The treatments section is empty on purpose. A PubMed search for SCUBE3 with
    growth hormone, treatment, or management returns no interventional study, no
    case series reporting a growth response, and no management guideline, and
    there is no GeneReviews chapter for this gene. Management is presumed
    symptomatic - orthopaedic care for the spine, dental care, growth monitoring
    - but nothing supports a treatment entry with a citation, so none is
    curated. The question is not idle: this disorder is reached through short
    stature clinics, where recombinant growth hormone is the default question,
    and the disease mechanism gives a reason to expect it to disappoint. The
    lesion is in the growth plate's response to BMP rather than in the
    GH-IGF-I axis, and the cohort that found SCUBE3 explicitly sorted it out of
    the GH-IGF-I subgroup. That is a mechanistic prediction, not a finding, and
    it is recorded here so it is not mistaken for one.
  evidence:
  - reference: PMID:38838658
    reference_title: "Genetic Findings in Short Turkish Children Born to Consanguineous Parents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5/9 families from group 2b, variants were found in TTC37, SCUBE3, NSD2, RABGAP1, and 17p13.3 microdeletions."
    explanation: >-
      Places SCUBE3 outside the GH-IGF-I axis group in the only cohort that
      sorted short-stature genes by that axis, which is the basis for the
      expectation stated above.
- discussion_id: scube3_phenotype_frequencies_not_quotable
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should the majority-frequency phenotypes in the HPO annotation set for
    OMIM:619184 be curated, and from what citable source?
  attaches_to:
  - phenotypes#
  rationale: >-
    This entry curates ten phenotypes, and the four skeletal ones added most
    recently come from a single case report's radiology. That is a strange
    shape, and the reason is worth recording rather than leaving to be
    rediscovered. The deep-research reports carry a fuller list with HPO
    identifiers and denominators - brachydactyly and dental crowding at roughly
    80% (12/15), pointed chin ~85%, short palm ~80%, short long bone ~55%,
    enamel hypoplasia ~27%, and recurrent conductive hearing loss - all of which
    are more frequent than what is curated here. None was added, because the
    numbers come from HPO disease annotations rather than from a sentence in a
    reference this repository can cache, and the abstract of the discovery
    cohort (PMID:33308444) gives only the four domain headings. So the choice
    was between verifiable content and coverage, and this entry took
    verifiability. Closing this needs the full text of PMID:33308444, or the HPO
    annotation file treated as a citable source in its own right - which would
    also settle the cardiac and rib-number questions recorded separately here.
  notes: >-
    The absence of these phenotypes is a sourcing limit, not a claim that
    patients do not have them.
- discussion_id: scube3_cardiac_clause_unresolved
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Does the discovery cohort report atrial septal defect, and if so should this
    entry carry a cardiac phenotype?
  attaches_to:
  - disease#SCUBE3-Related Short Stature Syndrome
  rationale: >-
    The bound disease label ends "with or without cardiac anomalies", and this
    entry curates no cardiac phenotype. The reason is a cache limit, not a
    finding. The discovery cohort's abstract (PMID:33308444) lists reduced
    growth, skeletal features, craniofacial appearance and dental anomalies and
    no cardiac involvement, and its full text is not retrievable into
    references_cache, so nothing quotable exists either way. Two independent
    deep-research runs against different providers both report atrial septal
    defect in two of the cohort and patent foramen ovale in two, attributing it
    to HPO annotations on OMIM:619184; agreement between them is weak evidence
    because both are reading the same annotation set rather than the paper.
    Resolving this needs the full text of PMID:33308444 or the HPO annotation
    file cited as a source in its own right. Until then the phenotype is absent
    from this entry, and its absence should not be read as a negative finding.
  notes: >-
    Do not resolve this from a deep-research report. The claim needs a source
    whose exact sentence can be quoted and cached.
- discussion_id: scube3_tgf_beta_arm_contribution_unknown
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does loss of the SCUBE3 TGF-beta arm contribute to the human skeletal
    phenotype, or is the disease entirely a BMP deficit?
  attaches_to:
  - pathophysiology#Loss of SCUBE3 BMP Co-Receptor Function
  rationale: >-
    This entry models the disorder as a BMP co-receptor loss, which is what the
    disease literature demonstrates. SCUBE3 also has a separate, well
    characterized TGF-beta activity: its C-terminal CUB domain binds TGF-beta
    type II receptor directly and induces SMAD2/3 phosphorylation, so SCUBE3 is
    a ligand there rather than a co-receptor, and the downstream SMAD branch is
    a different one. That work was done in lung cancer cells, which is why it is
    a question here rather than a pathophysiology node - the same molecular
    interaction in a growth plate would be a different claim. Two observations
    keep it open. Recombinant SCUBE3 raises both BMP2 and TGF-beta in human
    bone-marrow mesenchymal stem cells and restores osteogenesis through SMAD
    phosphorylation, without the two branches being separated; and the
    SCUBE3-overexpressing transgenic mouse develops cardiac hypertrophy through
    TGF-beta1, showing the arm is active in vivo in a mammal. Nobody has asked
    which branch the skeletal phenotype needs.
  evidence:
  - reference: PMID:21441952
    reference_title: "SCUBE3 is an endogenous TGF-beta receptor ligand and regulates the epithelial-mesenchymal transition in lung cancer."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "bound to transforming growth factor-β (TGF-β) type II receptor through the C-terminal CUB domain, activated TGF-β signaling and triggered the epithelial-mesenchymal transition (EMT). This process includes the induction of Smad2/3 phosphorylation"
    explanation: >-
      Establishes the TGF-beta arm as a real biochemical activity of SCUBE3.
      Graded INDIRECT because it was shown in lung cancer cells: it supports the
      existence of the arm this question is about, not its operation in the
      growth plate.
  - reference: PMID:39250278
    reference_title: "SCUBE3 promotes osteogenic differentiation and mitophagy in human bone marrow mesenchymal stem cells through the BMP2/TGF-beta signaling pathway."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "treatment with recombinant human SCUBE3 (rhSCUBE3) protein boosted BMP2 and TGF-β expression, activated mitophagy in hBMSCs, ameliorated oxidative stress, and restored osteogenic function through SMAD phosphorylation"
    explanation: >-
      Both pathways move together in a skeletal cell type, and the study does
      not separate them. That is what leaves the question open rather than
      answering it.
- discussion_id: scube3_rib_number_not_explained_by_growth_plate_defect
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does SCUBE3 loss disturb somitogenesis, or is the reduced rib number a
    coincidental finding in one patient?
  attaches_to:
  - phenotypes#11 pairs of ribs
  - pathophysiology#Impaired BMP-Mediated Chondrogenesis and Osteogenesis
  rationale: >-
    Every other skeletal feature in this entry follows from defective
    endochondral bone growth, which acts on bones that already exist. Rib number
    does not: it is fixed by axial patterning during somitogenesis, well before
    the growth plate forms, so the curated mechanism does not reach it. Two
    readings are open. Either SCUBE3 has an earlier patterning role that nobody
    has looked for - BMP signalling does act in somite patterning, and mouse
    Scube3 is expressed in the cartilaginous condensations of ribs and vertebrae
    - or the finding is incidental. The second reading is the weaker one: a
    deep-research report puts eleven rib pairs at roughly 31% (4/13) of the
    cohort, which is recurrent rather than incidental, though that figure comes
    from HPO annotations and is not quotable in this entry. Settling it needs
    published rib counts across the reported cohort. Eleven rib pairs is also
    reported in SSFSC1, the BMP2-related disorder that shares this disease's
    naming series, which would fit a shared BMP-pathway patterning effect if it
    holds up.
  evidence:
  - reference: PMID:40331102
    reference_title: "A Novel Homozygous Missense SCUBE3 Variant with Protein Modeling in a Patient Diagnosed as Short Stature, Facial Dysmorphism, and Skeletal Anomalies With or Without Cardiac Anomalies 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "skeletal abnormalities, including scoliosis, eleven pairs of ribs, mild radial bowing, irregular endplates in the lower thoracic vertabrae, and narrow iliac wings"
    explanation: >-
      The single report of the finding this question is about.
  - reference: PMID:40331102
    reference_title: "A Novel Homozygous Missense SCUBE3 Variant with Protein Modeling in a Patient Diagnosed as Short Stature, Facial Dysmorphism, and Skeletal Anomalies With or Without Cardiac Anomalies 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SCUBE3 protein exhibits significant expression in various tissues, including primary osteoblasts, long bones, and the cartilage of the axial skeleton throughout development, while also playing a regulatory role in the FGF, Hedgehog, and TGF-β signaling pathways."
    explanation: >-
      Axial-skeleton cartilage expression throughout development is what makes
      an earlier patterning role worth asking about rather than dismissing.

diagnosis:
- name: Molecular genetic testing of SCUBE3
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Bi-allelic inactivating SCUBE3 variants
  description: >-
    A recognizable phenotype - reduced growth, skeletal features, a distinctive
    craniofacial appearance and dental anomalies were consistent across
    eighteen individuals from nine families - but one that was unrecognized
    until the gene was found, so the diagnosis is made by sequencing rather
    than by clinical criteria. Variants differ in how far they impair transcript
    processing, secretion and function, which is a caveat for interpreting a
    novel allele: an in-vitro effect that is partial is still consistent with
    disease.
  evidence:
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen affected individuals from nine unrelated families showed a consistent phenotype characterized by reduced growth, skeletal features, distinctive craniofacial appearance, and dental anomalies."
    explanation: >-
      The consistent phenotype that makes the disorder recognizable once the
      diagnosis is known.
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional validation studies demonstrated a variable impact of disease-causing variants on transcript processing, protein secretion and function, and their dysregulating effect on bone morphogenetic protein (BMP) signaling."
    explanation: >-
      The variable functional impact that complicates interpretation of a novel
      variant.
animal_models:
- name: Scube3 knockout mouse
  species: Mouse
  genotype: Scube3 null (tm1(KOMP)Vlcg)
  publication: PMID:37237303
  description: >-
    A constitutive Scube3 null. Notably, homozygotes are born at expected
    Mendelian ratios and are viable and fertile, with no overt embryonic
    phenotype - the skeletal defect emerges on closer analysis rather than as a
    gross malformation.
  modeled_mechanisms:
  - target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces impaired BMP-mediated chondrogenesis and osteogenesis with
      craniofacial, dental and endochondral bone abnormalities and decreased
      body size.
    limitations: >-
      Much milder than the human disorder: the null mouse is viable and fertile
      with no overt embryonic phenotype, which the authors attribute to
      functional redundancy with other Scube family members. Mouse Scube3 also
      does not affect the hedgehog pathway, unlike zebrafish scube3, so
      cross-species inference about SCUBE pathway roles is unsafe.
    readouts:
    - name: Body size
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: DECREASED
      interpretation: >-
        Organism-level correlate of the endochondral bone defect.
      evidence:
      - reference: PMID:37237303
        reference_title: "The biology of SCUBE."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "decreased body size, and faulty endochondral bone development"
        explanation: >-
          The measured growth outcome in the knockout.
    - name: Bone mineral density
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: DECREASED
      interpretation: >-
        Quantitative bone readout supporting the osteogenesis arm of the node.
      evidence:
      - reference: PMID:37237303
        reference_title: "The biology of SCUBE."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "bone mineral density is markedly lower in Scube3-deficient"
        explanation: >-
          The measured bone-density reduction in the knockout.
    evidence:
    - reference: PMID:37237303
      reference_title: "The biology of SCUBE."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "impaired BMP-mediated chondrogenesis and osteogenesis, which result in craniofacial and dental abnormalities"
      explanation: >-
        Supports treating this model as informative for the chondro-osteogenic
        node.

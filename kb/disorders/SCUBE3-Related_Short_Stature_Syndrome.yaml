- name: Scube3 ENU mutant mouse (saturation mutagenesis screen)
  species: Mouse
  genotype: Scube3 C301Y homozygous (recessive N-ethyl-N-nitrosourea-induced allele)
  publication: PMID:34142127
  description: >-
    An independently derived allele, found by radiographic screening of an
    unbiased saturation-mutagenesis pedigree collection rather than by targeting
    the gene. That matters for how much weight the model carries: nobody was
    looking for SCUBE3, so the spine phenotype is not a result of an expectation.
    The same study then went the other way, matching the mouse to a previously
    undiagnosed patient carrying recessive SCUBE3 variants.
  modeled_mechanisms:
  - target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reproduces the axial skeletal arm - severe spine deformity, skeletal
      abnormalities and altered bone metabolism - and links the disease alleles
      to reduced SMAD transactivation.
    limitations: >-
      An ENU-induced missense allele (C301Y) rather than a null, and one not
      seen in a patient, so severity cannot be read across to the human
      loss-of-function alleles. It is a cbEGF7 substitution like N294K and is
      predicted to break a conserved disulfide bond, which is what makes it
      comparable to the human missense spectrum. The model was ascertained on
      spine deformity, so the craniofacial and dental domains that define the
      human syndrome are not reported for it.
    readouts:
    - name: Spine deformity on radiographic screening
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: ALTERED
      interpretation: >-
        The axial skeletal correlate of the chondro-osseous defect, and the
        readout the model was ascertained on.
      evidence:
      - reference: PMID:34142127
        reference_title: "Saturation mutagenesis defines novel mouse models of severe spine deformity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we report a mouse model of skeletal disease, including severe spine deformity, caused by recessive mutation in Scube3"
        explanation: >-
          The measured skeletal outcome attributed to the recessive Scube3
          allele.
    - name: SMAD transactivation by disease-associated SCUBE3 alleles
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: DECREASED
      interpretation: >-
        The signalling readout that connects the mouse allele to the human
        disease alleles through the same pathway.
      evidence:
      - reference: PMID:34142127
        reference_title: "Saturation mutagenesis defines novel mouse models of severe spine deformity."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we demonstrated that disease-associated mutations are associated with reduced transactivation of Smad signaling in vitro"
        explanation: >-
          Quantifies the reduced SMAD output produced by the disease alleles.
    evidence:
    - reference: PMID:34142127
      reference_title: "Saturation mutagenesis defines novel mouse models of severe spine deformity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we report a mouse model of skeletal disease, including severe spine deformity, caused by recessive mutation in Scube3."
      explanation: >-
        Supports treating this allele as informative for the chondro-osseous
        node.
  evidence:
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "another ENU-induced mutant allele (Scube3C301Y) was reported to cause recessive spine deformities, such as severe kyphosis and kinked tail"
    explanation: >-
      Names the allele this line carries and the phenotype it produces.
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "this C301Y mutation resides within the cbEGF7 domain, and it is expected to disrupt a key disulfide bond between conserved C2-C4 cysteines"
    explanation: >-
      Places C301Y in the same cbEGF7 module as the human missense alleles and
      predicts the structural consequence. Graded COMPUTATIONAL because the
      disulfide claim is a structural expectation, hedged as "expected to".
  - reference: PMID:37237303
    reference_title: "The biology of SCUBE."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "screening of mouse ENU-induced mutagenesis phenotypes led to the identification of recessive mutations in Scube3 on chromosome 17qA3.3 that confer severe spine deformity, skeleton abnormalities, and altered bone metabolism"
    explanation: >-
      Independent summary of the ENU-derived Scube3 alleles and the phenotypes
      they produce. The plural is the review's own, and it cites two reports, so
      this sentence covers this line and the kta41 line together rather than
      picking out one; the spine-deformity clause is the part that belongs to
      this model.
- name: Scube3 N294K mouse (kta41)
  species: Mouse
  genotype: Scube3 c.882C>A p.(Asn294Lys) homozygous (ENU-derived, line kta41)
  publication: PMID:27815347
  description: >-
    What separates this model from the other two is that its allele is
    characterized down to the protein interaction: N294K reaches the cell
    surface but fails to complex with BMP type IA receptor, so the mouse
    demonstrates the exact molecular step the trigger node asserts is lost. It
    is a domain match rather than an allele match, and the difference matters -
    N294K is an ENU-induced mouse allele, not a variant reported in a patient,
    but it falls in the cbEGF7 calcium-binding repeat, where several of the
    human missense alleles cluster. The line also arrived the other way round
    from most disease models: it was recovered from a morphological screen in
    the Munich ENU programme in 2016, four years before the human syndrome was
    described, so nobody chose this substitution to match a patient. Two of its
    findings sit outside what this entry curates as human phenotypes - hearing
    impairment and altered renal function. Neither is curated as a disease
    feature, because no cached source states either in patients; a
    deep-research report does describe recurrent conductive hearing loss in the
    discovery cohort, which this entry cannot quote. They are recorded here as
    model findings.
  modeled_mechanisms:
  - target: Loss of SCUBE3 BMP Co-Receptor Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Produces skeletal morphological abnormalities and altered bone-metabolism
      parameters, and its allele's receptor-binding defect is characterized.
    limitations: >-
      N294K is a mouse ENU allele rather than a variant seen in a patient, so
      the correspondence to the human disease runs through the affected domain
      (cbEGF7) and the demonstrated loss of BMP type IA receptor binding, not
      through the genotype. Being a single missense allele, it also says nothing
      about the frameshift, nonsense and splice-site variants that make up much
      of the human variant spectrum. The published phenotyping is a broad
      screening panel rather than a targeted skeletal study, and the paper
      frames the bone findings against Paget disease of bone rather than against
      this syndrome, which did not yet exist as an entity when it was written.
    readouts:
    - name: Skeletal morphology and bone-metabolism parameters
      target: Loss of SCUBE3 BMP Co-Receptor Function
      direction: ALTERED
      interpretation: >-
        The skeletal correlate of the co-receptor defect in an allele-matched
        animal.
      evidence:
      - reference: PMID:27815347
        reference_title: "The First Scube3 Mutant Mouse Line with Pleiotropic Phenotypic Alterations."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM

    term:
      id: CL:0002540
      label: mesenchymal stem cell of the bone marrow
  conditions:
  - SCUBE3 knockdown
  - SCUBE3 overexpression
  - recombinant human SCUBE3 treatment
  description: >-
    A human cell system that manipulates SCUBE3 in both directions in the cell
    type the disease affects. Its value here is the loss-of-function arm, which
    matches the disease; the study was designed around the gain-of-function arm
    for bone-defect repair, so most of its content is about a therapeutic use
    that this disorder does not have.
  modeled_mechanisms:
  - target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Knockdown impairs osteogenic differentiation; adding back recombinant
      SCUBE3 raises BMP2 and TGF-beta and restores osteogenic function through
      SMAD phosphorylation, which is the pathway the disease loses.
    limitations: >-
      Healthy donor cells with SCUBE3 experimentally reduced, not patient cells
      carrying disease alleles, so it models the pathway loss rather than the
      genotype. It also reports only the osteogenic arm; nothing here addresses
      chondrogenesis, which is half of the target node.
    readouts:
    - name: Osteogenic differentiation of hBMSCs after SCUBE3 knockdown
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: DECREASED
      interpretation: >-
        The loss-of-function arm, matching the direction of the human disease.
      evidence:
      - reference: PMID:39250278
        reference_title: "SCUBE3 promotes osteogenic differentiation and mitophagy in human bone marrow mesenchymal stem cells through the BMP2/TGF-beta signaling pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "SCUBE3 levels increase significantly during early osteogenic differentiation of hBMSCs, and that reducing SCUBE3 levels can hinder this differentiation"
        explanation: >-
          The measured effect of lowering SCUBE3 on osteogenic differentiation.
    - name: SMAD phosphorylation and osteogenic rescue by recombinant SCUBE3
      target: Impaired BMP-Mediated Chondrogenesis and Osteogenesis
      direction: RESTORED
      interpretation: >-
        A rescue arm showing the pathway is the operative one, not merely a
        correlate.
      evidence:
      - reference: PMID:39250278
        reference_title: "SCUBE3 promotes osteogenic differentiation and mitophagy in human bone marrow mesenchymal stem cells through the BMP2/TGF-beta signaling pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "treatment with recombinant human SCUBE3 (rhSCUBE3) protein boosted BMP2 and TGF-β expression, activated mitophagy in hBMSCs, ameliorated oxidative stress, and restored osteogenic function through SMAD phosphorylation"
        explanation: >-
          Adding the protein back restores the osteogenic output through SMAD,
          which is what makes this a pathway claim rather than an association.
    evidence:
    - reference: PMID:39250278
      reference_title: "SCUBE3 promotes osteogenic differentiation and mitophagy in human bone marrow mesenchymal stem cells through the BMP2/TGF-beta signaling pathway."
      supports: SUPPORT
      evidence_source: IN_VITRO

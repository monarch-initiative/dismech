name: SCUBE3-Related Short Stature Syndrome
creation_date: "2026-08-27T04:30:00Z"
category: Mendelian
synonyms:
- SSFSC2
- short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 2
- SCUBE3-related short stature-facial dysmorphism-skeletal and dental anomalies syndrome
description: >-
  A very rare autosomal recessive disorder of reduced growth with a distinctive
  craniofacial appearance, dental anomalies and skeletal deformities, caused by
  biallelic inactivating variants in SCUBE3. It is the mechanistic outlier of
  its nosology group: where the other primordial dwarfisms in ISDS group 21 run
  through DNA replication, centrosome biology or ubiquitin-mediated
  proteostasis, SCUBE3 encodes a secreted, membrane-associated BMP2/4
  co-receptor that concentrates BMP receptor complexes in lipid-raft
  microdomains and enhances BMP signalling. The defect is therefore in a
  growth-factor signalling pathway required for endochondral bone formation
  rather than in the cell cycle.

  Note a label collision worth checking before citing anything: MONDO:0100297 is
  SSFSC1 (OMIM 617877), a different gene and a different entity. The OMIM number
  619184 is what pins this one.
disease_term:
  preferred_term: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 2
  term:
    id: MONDO:0030953
    label: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac anomalies 2
parents:
- Autosomal recessive disease
- Skeletal dysplasia
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0240 "Short stature, facial dysmorphism, skeletal and
      dental anomalies syndrome, SCUBE3-related" (AR, OMIM 619184). One row, one
      entry. The OMIM number is what identifies the row: MONDO:0100297 carries a
      near-identical label for SSFSC1 (OMIM 617877), which is a different gene
      and not in this group.


      On the "with or without cardiac anomalies" clause in the bound disease
      label: this entry deliberately curates no cardiac phenotype, and the
      reason is worth recording so the question is not reopened. No cardiac
      finding is reported in any affected individual - the eighteen-patient
      discovery cohort (PMID:33308444) describes reduced growth, skeletal
      features, craniofacial appearance and dental anomalies, and no cardiac
      involvement. The clause tracks the SSFSC1 naming series rather than any
      SCUBE3 observation. Two things in the literature look like cardiac
      evidence and are not. Cardiac and vascular biology in the SCUBE family is
      almost entirely SCUBE1 and SCUBE2 - different genes, and attributing it
      here would be Named Entity Confusion. The one genuine SCUBE3 cardiac
      result (reviewed in PMID:37237303) is cardiac hypertrophy in transgenic
      mice *overexpressing* SCUBE3 under a type I collagen promoter, appearing
      spontaneously at around eight months and augmented by pressure overload
      rather than requiring it. Either way the human disease is biallelic loss
      of function, so that is the opposite manipulation, and it would argue if
      anything that too little SCUBE3 protects the heart.

diagnosis:
- name: Molecular genetic testing of SCUBE3
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: Bi-allelic inactivating SCUBE3 variants
  notes: >-
    On which patients reach this test. In the one cohort that sorted
    short-stature genes by mechanism, SCUBE3 fell in the syndromic-short-stature
    subgroup worked up hypothesis-free, not in the GH-IGF-I axis subgroup worked
    up by candidate gene. That distinction is clinically load-bearing: an
    endocrine workup for growth failure will not reach this diagnosis, and the
    trigger for sequencing is syndromic features or consanguinity rather than
    the growth failure itself.
  description: >-
    A recognizable phenotype - reduced growth, skeletal features, a distinctive
    craniofacial appearance and dental anomalies were consistent across
    eighteen individuals from nine families - but one that was unrecognized
    until the gene was found, so the diagnosis is made by sequencing rather
    than by clinical criteria. Variants differ in how far they impair transcript
    processing, secretion and function, which is a caveat for interpreting a
    novel allele: an in-vitro effect that is partial is still consistent with
    disease.
  evidence:
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen affected individuals from nine unrelated families showed a consistent phenotype characterized by reduced growth, skeletal features, distinctive craniofacial appearance, and dental anomalies."
    explanation: >-
      The consistent phenotype that makes the disorder recognizable once the
      diagnosis is known.
  - reference: PMID:33308444
    reference_title: "SCUBE3 loss-of-function causes a recognizable recessive developmental disorder due to defective bone morphogenetic protein signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional validation studies demonstrated a variable impact of disease-causing variants on transcript processing, protein secretion and function, and their dysregulating effect on bone morphogenetic protein (BMP) signaling."
    explanation: >-
      The variable functional impact that complicates interpretation of a novel
      variant.
  - reference: PMID:38838658
    reference_title: "Genetic Findings in Short Turkish Children Born to Consanguineous Parents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the two siblings in family 25, we discovered a homozygous novel SCUBE3 variant, which at that time had not been described as a cause of short stature."
    explanation: >-
      Shows the route by which this diagnosis is actually reached:
      hypothesis-free exome sequencing in a consanguineous child with syndromic
      short stature, not a clinical suspicion of the syndrome.
  - reference: PMID:38838658
    reference_title: "Genetic Findings in Short Turkish Children Born to Consanguineous Parents."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 5/9 families from group 2b, variants were found in TTC37, SCUBE3, NSD2, RABGAP1, and 17p13.3 microdeletions."
    explanation: >-
      Places SCUBE3 in the syndromic-short-stature subgroup rather than the
      GH-IGF-I axis subgroup, which is the referral distinction recorded in the
      notes above.
  - reference: PMID:39706863
    reference_title: "Genetic and allelic heterogeneity in 248 Indians with skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "noted novel gene-disease relationships for PISD, BNIP1, TONSL, CCN2 and SCUBE3 related skeletal dysplasia"
    explanation: >-
      An independent large skeletal-dysplasia cohort reaching the same gene by
      sequencing, which is corroboration that the sequencing-first route works
      rather than a second description of the phenotype.
experimental_models:
- name: SCUBE3 loss- and gain-of-function in human bone marrow mesenchymal stem cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: primary human bone marrow mesenchymal stem cells
  culture_system: two-dimensional osteogenic differentiation culture
  publication: PMID:39250278
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:

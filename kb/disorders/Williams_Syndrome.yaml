animal_models:
- species: Mus musculus
  genotype: Heterozygous complete or complementary partial deletion of the chromosome 5G2 region syntenic to human WBSCR
  description: >-
    Chromosome-engineered complete- and half-deletion mice reproduce different
    subsets of growth, craniofacial, motor, acoustic-startle, sociability,
    cognitive, cardiovascular, and brain phenotypes. They enable interval
    dissection but do not fully reproduce the severity or anatomy of human
    disease.
  associated_phenotypes:
  - Hypersociability
  - Motor-coordination impairment
  - Growth delay and craniofacial abnormalities
  - Mild hypertension and arterial-wall thickening
  evidence:
  - reference: PMID:20049703
    reference_title: "Induced chromosome deletions cause hypersociability and other features of Williams-Beuren syndrome in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Increased sociability and acoustic startle response are associated with
      PD, and cognitive defects with DD. Both PD and D/P males are growth-retarded,
      while skulls are shortened and brains are smaller in DD and D/P.
    explanation: >-
      Complementary half deletions partition behavioral, growth, and brain
      phenotypes across the interval.
  - reference: PMID:25027326
    reference_title: "Heterozygous deletion of the Williams-Beuren syndrome critical interval in mice recapitulates most features of the human disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous mutant mice showed postnatal growth delay with reduced body
      weight and craniofacial abnormalities such as small mandible. The
      cardiovascular phenotype was only manifested with borderline hypertension,
      mildly increased arterial wall thickness and cardiac hypertrophy.
    explanation: >-
      The complete-deletion model reproduces multisystem features but also shows
      its comparatively mild vascular phenotype.
- species: Mus musculus
  genotype: Heterozygous deletion of the chromosome 5G2 region syntenic to the human WBSCR including Eln
  description: >-

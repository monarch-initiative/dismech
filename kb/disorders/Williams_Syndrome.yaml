    GTF2I dosage reduction is implicated, together with GTF2IRD1 and other
    interval genes, in intellectual ability, social functioning, anxiety, and
    altered neurodevelopment, but it is not a sufficient explanation for the
    full Williams syndrome behavioral phenotype.
  gene_term:

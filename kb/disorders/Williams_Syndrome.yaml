differential_diagnoses:
- name: ELN-related familial supravalvular aortic stenosis
  description: >-
    Heterozygous ELN sequence variants or intragenic deletions can cause an
    arteriopathy resembling the cardiovascular component of Williams syndrome
    without the typical WBSCR multigene deletion and full neurodevelopmental,
    facial, endocrine, and multisystem phenotype.
  distinguishing_features:
  - A negative Williams-syndrome deletion study with a diagnostic ELN variant favors isolated ELN-related SVAS.
  - A 7q11.23 WBSCR deletion plus the characteristic multisystem phenotype favors Williams syndrome.
  evidence:
  - reference: PMID:38591341
    reference_title: "Genetic Testing for Supravalvar Aortic Stenosis: What to Do When It Is Not Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, 39 of 47 underwent ELN sequencing, 20 of 39 (51%) of whom had a
      diagnostic variant.
    explanation: >-
      In patients with SVAS and negative Williams syndrome evaluation, ELN
      sequencing had the highest single-gene diagnostic yield.
- name: Other genetic syndromes presenting with supravalvular aortic stenosis
  description: >-
    Noonan syndrome, Alagille syndrome, neurofibromatosis type 1, and homozygous
    familial hypercholesterolemia can enter the differential when SVAS is the
    presenting feature and Williams syndrome testing is negative.
  distinguishing_features:
  - Syndrome-specific examination and sequencing of RASopathy, JAG1/NOTCH2, NF1, and lipid-disorder genes distinguish these alternatives.
  - The WBSCR deletion, hypersociability/visuospatial profile, and characteristic facies support Williams syndrome.
  evidence:
  - reference: PMID:38591341
    reference_title: "Genetic Testing for Supravalvar Aortic Stenosis: What to Do When It Is Not Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other diagnoses made by gene sequencing were Noonan syndrome (3 PTPN11,
      1 RIT1), Alagille syndrome (3 JAG1), neurofibromatosis (1 NF1), and
      homozygous familial hypercholesterolemia (1 LDLR1).
    explanation: >-
      The Williams-negative SVAS cohort directly documents these molecular
      alternatives.
- name: 7q11.23 microduplication syndrome
  description: >-
    The reciprocal copy-number gain overlaps in intellectual disability, anxiety,
    ADHD, and facial dysmorphism but prominently features speech/language disorder;
    autism also occurs, and separation anxiety or social phobia contrasts with
    the social disinhibition typical of Williams syndrome. Copy-number testing
    directly distinguishes deletion from duplication.
  distinguishing_features:
  - Hemideletion of the WBSCR establishes Williams syndrome; hemiduplication establishes 7q11.23 microduplication syndrome.
  - Hypersociability and visuospatial-construction weakness favor Williams syndrome, whereas speech delay and autism favor duplication.
  evidence:
  - reference: PMID:26333794
    reference_title: "7q11.23 Duplication syndrome: Physical characteristics and natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Developmental delay or intellectual disability, ASD or features of ASD,
      language delay or disorder, and/or severe speech delay have been noted in
      almost all case reports of individuals with Dup7.
    explanation: >-
      The direct duplication-syndrome natural-history study documents the
      neurodevelopmental, speech/language, and autism overlap.
  - reference: PMID:26333794
    reference_title: "7q11.23 Duplication syndrome: Physical characteristics and natural history."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to WS in which social disinhibition is common, individuals with
      Dup7 are more likely to have separation anxiety or social phobia
    explanation: >-
      The cohort review supplies a clinically useful social-behavioral contrast
      between the reciprocal deletion and duplication syndromes.
treatments:
- name: Cardiovascular Surgery for Supravalvular Aortic Stenosis
  description: >-
    Surgical repair of clinically significant supravalvular aortic stenosis or
    other arterial stenoses to relieve obstruction. Anesthesia consultation and
    electrocardiogram are recommended prior to sedation and surgical procedures
    given the elevated peri-procedural cardiovascular risk.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery may be required for supravalvar aortic or pulmonary artery
      stenosis, mitral valve insufficiency, and/or renal artery stenosis.
    explanation: >-
      GeneReviews indicates surgical repair may be required for supravalvar
      aortic stenosis and other vascular lesions in Williams syndrome.
  - reference: PMID:25791950
    reference_title: "Adverse cardiac events in children with Williams syndrome undergoing cardiovascular surgery: An analysis of the Society of Thoracic Surgeons Congenital Heart Surgery Database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this multicenter analysis, MACE occurred in 9% of patients with
      WS undergoing cardiac surgery.
    explanation: >-
      A Society of Thoracic Surgeons database analysis quantifies the elevated
      peri-procedural risk: major adverse cardiac events occurred in 9% of
      Williams syndrome patients undergoing cardiovascular surgery, with higher
      risk in coronary repair, underscoring the need for careful perioperative
      planning.
- name: Calcium and Vitamin D Management
  description: >-
    Dietary modification is used for hypercalcemia. Pediatric multivitamins
    should be avoided because these preparations contain vitamin D; dietary
    restriction and supplementation decisions should be individualized to avoid
    both worsening hypercalcemia and unnecessary long-term deficiency.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of hypercalcemia may include diet modification, oral
      corticosteroids, and/or intravenous pamidronate.
    explanation: >-
      GeneReviews describes diet modification as a primary management approach
      for hypercalcemia in Williams syndrome.
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Multivitamins for children, because all
      pediatric multivitamin preparations contain vitamin D.
    explanation: >-

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Williams syndrome is inherited in an autosomal dominant manner. The vast
    majority of cases arise de novo from a recurrent 7q11.23 deletion mediated
    by non-allelic homologous recombination between flanking low-copy repeats.
    Recurrence is extremely low when neither parent has clinical findings,
    although rare recurrence has been reported in phenotypically normal parents;
    an affected individual has a 50% chance of transmitting the deletion. Once
    the familial deletion is known, prenatal and preimplantation genetic testing
    are possible.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WS is an autosomal dominant disorder. Most individuals diagnosed with WS
      have the disorder as the result of a de novo 1.5- to 1.8-Mb 7q11.23
      deletion; rarely, an individual with WS has an affected parent.
    explanation: >-
      GeneReviews confirms autosomal dominant inheritance with predominantly
      de novo origin of the 7q11.23 deletion.
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with WS has a 50% chance of inheriting the
      7q11.23 deletion and being affected. Once the WS-causing 1.5- to 1.8-Mb
      7q11.23 deletion has been identified in an affected family member,
      prenatal and preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews quantifies transmission risk and confirms reproductive-testing
      options after the causal deletion is identified.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrence risk for couples where neither parent has clinical findings
      of WS is extremely low
    explanation: >-
      The expert review directly characterizes recurrence risk when both parents
      are clinically unaffected.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, there are rare reports of recurrence in phenotypically normal
      parents.
    explanation: >-
      The expert review bounds sibling recurrence after an apparently de novo
      deletion while noting rare recurrence in clinically unaffected parents.
  expressivity: VARIABLE
genetic:
- name: Recurrent WBSCR deletion at 7q11.23
  notes: >-
    The usual molecular lesion is a heterozygous 1.55-Mb deletion generated by
    unequal recombination between highly homologous centromeric and medial
    low-copy repeats; a minority have a larger approximately 1.84-Mb deletion.
  evidence:
  - reference: PMID:12796854
    reference_title: "Mutational mechanisms of Williams-Beuren syndrome deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients (95%) exhibit a 1.55-Mb deletion caused by recombination
      between centromeric and medial block B copies, which share approximately
      99.6% sequence identity along 105-143 kb.
    explanation: >-
      Breakpoint mapping directly establishes the common deletion size and its
      low-copy-repeat-mediated recombination mechanism.
  - reference: PMID:12796854
    reference_title: "Mutational mechanisms of Williams-Beuren syndrome deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only four patients (5%) displayed a larger deletion ( approximately 1.84
      Mb) caused by recombination between centromeric and medial block A copies.
    explanation: >-
      The same breakpoint study documents the less common, larger recurrent
      deletion and its alternative low-copy-repeat blocks.
- name: ELN haploinsufficiency from 7q11.23 deletion
  notes: >-
    Hemizygous deletion of ELN (elastin) at 7q11.23 causes elastin
    haploinsufficiency, the basis of the generalized arteriopathy and
    connective-tissue manifestations of Williams syndrome.
  gene_term:
    preferred_term: ELN
    term:
      id: hgnc:3327
      label: ELN
  evidence:
  - reference: PMID:34140529
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genotype-phenotype evidence is strongest for ELN, the gene encoding
      elastin, which is responsible for the vascular and connective tissue
      features of WS
    explanation: >-
      The expert review identifies ELN as the best-established interval-gene
      contributor to vascular and connective-tissue disease.
- name: GTF2I haploinsufficiency

diagnosis:
- name: Molecular confirmation of the 7q11.23 WBSCR deletion
  description: >-
    Confirm the clinical suspicion by demonstrating a heterozygous 1.5-1.8-Mb
    deletion of the Williams-Beuren syndrome critical region. Chromosomal
    microarray detects typical and atypical copy-number losses without requiring
    a prior syndrome-specific suspicion; targeted FISH, MLPA, or polymorphic-marker
    testing can confirm the recurrent deletion when Williams syndrome is suspected.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: A heterozygous WBSCR deletion on chromosome 7q11.23 establishes the diagnosis.
  evidence:
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of WS is established by identification of a heterozygous
      1.5- to 1.8-Mb deletion of the Williams-Beuren syndrome critical region
      (WBSCR) on chromosome 7q11.23.
    explanation: >-
      GeneReviews states the definitive molecular diagnostic criterion.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most widely used laboratory methods available to detect the 7q11.23
      microdeletion include FISH, polymorphic microsatellite markers, multiplex
      ligation-dependent probe amplification (MLPA) and chromosomal microarray
      analysis (CMA).
    explanation: >-
      The expert review identifies accepted deletion-detection methods.
- name: Cardiovascular assessment and lifelong arteriopathy surveillance
  description: >-
    Baseline cardiology evaluation characterizes SVAS, pulmonary and other
    arterial stenoses. Blood pressure should be measured in both arms and at
    least one leg; a persistent elevation or pressure differential prompts
    targeted cardiovascular and renovascular imaging. Follow-up is at least
    annual through age five and every two to three years thereafter, with more
    frequent individualized review for known disease. Anesthesia consultation
    and electrocardiography are recommended before sedation or surgery because
    coronary and hemodynamic risk may be occult.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Defines stenosis location and severity, ventricular effects, blood-pressure burden, and procedural risk.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood pressure should be measured in both arms and at least one leg due to
      possible right arm flow acceleration (the so-called Coanda effect) and/or
      coarctation of the aorta
    explanation: >-
      The expert review specifies limb blood-pressure assessment in Williams
      syndrome.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If consistent blood pressure elevations or pressure differentials (in the
      arms or as an arm-leg discrepancy, respectively) are detected, additional
      imaging of the heart and ascending aorta (by echocardiography) and the
      renal/abdominal vasculature (by Doppler ultrasonography, CT angiography or
      MRI/MR angiography) should be considered
    explanation: >-
      The review recommends targeted cardiovascular and renovascular imaging
      when limb measurements suggest hypertension or a pressure gradient.
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cardiology evaluation for elastin arteriopathy at least annually until age
      five years and every two to three years thereafter
    explanation: >-
      GeneReviews provides the routine age-stratified cardiology schedule.
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."

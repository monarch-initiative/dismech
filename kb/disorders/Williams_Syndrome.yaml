  description: >-
    Hemizygous loss of ELN reduces elastin transcript and protein dose. This is
    the best-established single-gene contribution in Williams syndrome and is
    sufficient to produce familial supravalvular-aortic-stenosis-like vascular
    disease outside the contiguous-gene syndrome.

name: Williams Syndrome
creation_date: "2026-06-03T00:00:00Z"
synonyms:
- Williams-Beuren syndrome
- WBS
- deletion 7q11.23
description: >-
  Williams syndrome (Williams-Beuren syndrome) is a rare multisystem
  neurodevelopmental disorder caused by a recurrent ~1.5-1.8 Mb contiguous-gene
  microdeletion at chromosome 7q11.23 that removes approximately 25-27 genes,
  including ELN (elastin). Hemizygous loss of ELN produces a generalized
  elastin arteriopathy, most characteristically supravalvular aortic stenosis,
  while combined dosage reduction across the interval produces a variable
  neurodevelopmental, behavioral, craniofacial, connective-tissue, endocrine,
  gastrointestinal, renal, ocular, and auditory phenotype. GTF2I/GTF2IRD1 and
  LIMK1 are among the better-supported contributors to social-behavioral and
  visuospatial phenotypes, respectively, but many individual gene-to-phenotype
  routes remain unresolved. Hallmarks include hypersociability, mild-to-moderate
  intellectual disability with severe visuospatial-construction weakness,
  distinctive facies, growth and feeding difficulty, and age-dependent calcium
  and other endocrine abnormalities.
category: Mendelian
parents:

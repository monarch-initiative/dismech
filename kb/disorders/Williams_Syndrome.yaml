progression:
- phase: Infant multisystem presentation
  age_range: Birth through 30 months
  notes: >-
    Feeding and oral-motor difficulty, poor weight gain, hypotonia and motor
    delay, a murmur from arterial stenosis, and distinctive facies often prompt
    recognition. Clinically actionable hypercalcemia is concentrated in later
    infancy and the second year of life.
  evidence:
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotonia and hyperextensible joints can result in delayed attainment of
      motor milestones. Feeding difficulties often lead to poor weight gain in
      infancy.
    explanation: >-
      GeneReviews defines the early motor and feeding trajectory.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is seen in 5–10% of children with WS and when present usually occurs
      between 6 and 30 months of age
    explanation: >-
      The expert review supplies the age window for clinically important
      hypercalcemia.
- phase: Childhood neurodevelopmental and cardiovascular course
  age_range: Early childhood through adolescence
  notes: >-
    Developmental delay, the characteristic cognitive profile, hypersociability,
    anxiety, attention problems, sound sensitivity, and school support needs
    become clearer. Pulmonary arterial stenosis often becomes less prominent,
    while aortic stenosis may improve, remain stable, or worsen.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While pulmonary artery stenoses often improves with age, narrowing on the
      aortic side may stay the same, improve or worsen with time.
    explanation: >-
      The review distinguishes the typical age trajectories of pulmonary and
      aortic arterial lesions.
  - reference: PMID:37633900
    reference_title: "Dorsal visual stream and LIMK1: hemideletion, haplotype, and enduring effects in children with Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IPS structural (p < 10-4 FDR corrected) and functional (p < .05 FDR
      corrected) anomalies previously reported in adults were confirmed in
      children with WS, and, consistent with an enduring genetic mechanism,
      were stable from early childhood into adulthood.
    explanation: >-
      Longitudinal imaging shows persistence of the dorsal-stream phenotype.
- phase: Lifelong vascular and adult metabolic surveillance
  age_range: Adulthood and later life
  notes: >-
    Elastin arteriopathy and hypertension require lifelong follow-up even when
    childhood pulmonary lesions improve. Insulin resistance or abnormal glucose
    tolerance, thyroid disease, hearing loss, anxiety, and musculoskeletal
    limitation remain important adult health needs, but long-term natural-history
    data in older adults are limited.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance of stenosis occurs through regular examinations by a
      cardiologist and associated imaging and should continue throughout an
      individual's lifetime.
    explanation: >-
      The expert review explicitly recommends lifelong vascular surveillance.
  - reference: PMID:20301427
    reference_title: "Williams Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Oral glucose tolerance tests in adults should start at age 20 years.
    explanation: >-
      GeneReviews identifies an adult metabolic-surveillance milestone.
pathophysiology:
- name: Recurrent Low-Copy-Repeat-Mediated 7q11.23 Deletion
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Highly homologous low-copy repeats flanking the Williams-Beuren syndrome
    critical region misalign during meiosis and undergo non-allelic homologous
    recombination. The recurrent heterozygous deletion makes ELN and the other
    interval genes hemizygous; it is the initiating lesion rather than a direct
    assignment of every manifestation to a single gene.
  evidence:
  - reference: PMID:12796854
    reference_title: "Mutational mechanisms of Williams-Beuren syndrome deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three large region-specific low-copy repeat elements (LCRs), composed of
      different blocks (A, B, and C), flank the WBS deletion interval and are
      thought to predispose to misalignment and unequal crossing-over, causing
      the deletions.
    explanation: >-
      Patient breakpoint mapping establishes the flanking genomic architecture
      and unequal-recombination origin of the deletion.
  downstream:
  - target: ELN Haploinsufficiency
    causal_link_type: DIRECT
    description: The deletion removes one ELN copy.
    evidence:
    - reference: PMID:20926892
      reference_title: "Induced chromosome deletion in a Williams-Beuren syndrome mouse model causes cardiovascular abnormalities."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        ELN transcript levels were reduced by 38-41% in Wbs mice lacking one
        copy of the ELN gene.
      explanation: >-
        A full-interval deletion model directly confirms reduced ELN dosage.
  - target: Neurodevelopmental Interval-Gene Haploinsufficiency
    causal_link_type: DIRECT
    description: The same deletion removes one copy of multiple dosage-sensitive neurodevelopmental genes.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
      reference_title: "Williams syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Deletion size is similar across most individuals with WS and leads to
        loss of one copy of 25-27 genes on chromosome 7q11.23.
      explanation: >-
        The expert review directly establishes multigene hemizygosity.

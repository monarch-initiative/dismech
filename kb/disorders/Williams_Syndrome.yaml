discussions:
- discussion_id: gap_ws_interval_gene_attribution_and_variability
  prompt: >-
    Which deleted interval genes, background modifiers, and environmental factors
    determine the marked person-to-person variability of cardiovascular,
    neurobehavioral, endocrine, and other multisystem manifestations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Recurrent Low-Copy-Repeat-Mediated 7q11.23 Deletion
  - pathophysiology#Neurodevelopmental Interval-Gene Haploinsufficiency
  rationale: >-
    Most individuals share a very similar deletion, yet severity varies widely.
    ELN and GTF2I/GTF2IRD1 have bounded genotype-phenotype support, but many other
    interval genes and modifier pathways remain provisional; treating the entire
    phenotype as a unitary contiguous-gene mechanism would overstate current evidence.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phenotypic variability is considerable for all cardinal features of WS,
      but the specific sources of this variability remain unknown.
    explanation: >-
      The expert review explicitly identifies unexplained phenotypic variability
      as a research priority.
- discussion_id: gap_ws_vascular_model_fidelity
  prompt: >-
    Which experimental system can reproduce the focal hourglass-type human SVAS
    lesion while retaining mature elastin mechanics and the multicellular,
    hemodynamic environment needed to test disease-modifying therapies?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Disrupted Elastic Fiber Architecture
  - pathophysiology#Vascular Smooth-Muscle Remodeling and Arterial Narrowing
  rationale: >-
    The complete-deletion mouse has only borderline hypertension and mild arterial
    wall thickening rather than the characteristic severe human focal SVAS. Simple
    cell cultures cannot reproduce multicellular arterial geometry, pulsatile flow,
    or mechanically mature elastic lamellae, limiting translation of rescue claims.
  proposed_experiments:
  - experiment_id: exp_ws_isogenic_perfused_artery_model
    name: Isogenic perfused human arterial model of focal Williams syndrome stenosis
    description: >-
      Compare 7q11.23-deletion and isogenic corrected human iPSC-derived arterial
      constructs containing endothelial cells and vascular smooth muscle cells
      under pulsatile flow and prolonged elastin maturation. Prespecify regional
      lumen caliber, wall thickness, elastic-lamella architecture, and smooth-muscle
      proliferation and migration as separate readouts, and benchmark focality
      against human Williams syndrome imaging and deletion-mouse vessels.
    controls:
    - name: Isogenic deletion-corrected arterial constructs
      description: >-
        Corrected constructs undergo the same differentiation, maturation, geometry,
        and pulsatile-flow protocol as deletion constructs.
    - name: Static and flow-matched geometry controls
      description: >-
        These controls separate deletion-dependent focal narrowing from diffuse
        wall thickening or geometry-induced flow artifacts.
    decision_criterion: >-
      The platform resolves the human-model mismatch only if deletion constructs
      reproducibly develop focal, hourglass-type narrowing rather than diffuse
      thickening alone, with prespecified regional lumen loss and thick-wall or
      elastic-lamella changes that are absent or corrected in isogenic controls.
      Diffuse thickening without focal stenosis preserves the mismatch and weakens
      the proposed smooth-muscle remodeling explanation.
    would_support:
    - pathophysiology#Disrupted Elastic Fiber Architecture
    - pathophysiology#Vascular Smooth-Muscle Remodeling and Arterial Narrowing
    would_refute:
    - pathophysiology#Vascular Smooth-Muscle Remodeling and Arterial Narrowing
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      animal models (usually mice) may imperfectly match human disease outcomes
    explanation: >-
      The expert review flags imperfect translation from animal models; the
      accompanying mouse evidence documents the mild vascular phenotype.
  - reference: PMID:25027326
    reference_title: "Heterozygous deletion of the Williams-Beuren syndrome critical interval in mice recapitulates most features of the human disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The cardiovascular phenotype was only manifested with borderline
      hypertension, mildly increased arterial wall thickness and cardiac hypertrophy.
    explanation: >-
      The complete-deletion mouse shows a much milder vascular phenotype than
      severe human stenotic disease.
- discussion_id: gap_ws_periprocedural_sudden_death_mechanism
  prompt: >-
    Which combination of coronary anatomy, outflow obstruction, perfusion
    pressure, anaesthesia, and other factors causes the excess periprocedural
    sudden-death risk in Williams syndrome?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotype#Sudden Cardiac Death
  - phenotype#Coronary Artery Stenosis
  - pathophysiology#Vascular Smooth-Muscle Remodeling and Arterial Narrowing
  rationale: >-
    Elevated sudden-death risk is established, but events can occur with minimal
    stenosis and the expert review names multiple possible risk factors. The
    phenotype therefore remains outside a single coronary-stenosis causal edge
    until their independent and joint contributions are resolved.
  evidence:
  - reference: PMID:39291481
    reference_title: "Clinical Care for Cardiovascular Disease in Patients With Williams-Beuren Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of sudden cardiac death is markedly higher than the general
      population, with most events occurring in the periprocedural period.
    explanation: >-
      The cardiovascular consensus review establishes the outcome and its
      concentration around procedures.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      although some individuals with only minimal stenosis suffered sudden death
      in the setting of anaesthesia.
    explanation: >-
      Sudden death despite minimal stenosis argues against treating stenosis
      severity as a sufficient causal explanation.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC9437774/
    reference_title: "Williams syndrome."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      This severe outcome may be influenced by various risk factors, including
      anatomical anomaly of the coronaries and reduction in perfusion pressure
      at induction and/or maintenance of anaesthesia.
    explanation: >-
      The review identifies coronary anatomy and procedural perfusion as possible,
      not singularly established, contributors.
- discussion_id: gap_ws_distal_multisystem_phenotype_mechanisms
  prompt: >-
    Which interval genes and tissue-specific pathways connect the recurrent
    deletion to the craniofacial, auditory, gastrointestinal, growth, motor,
    developmental, dental, ocular, and sleep phenotypes that lack resolved

progression:
- phase: Infancy-predominant presentation
  age_range: Neonatal period through first year of life
  notes: >-
    Most published patients manifested during the first year, and 42.4% of
    those with onset data presented neonatally. Rare later presentations do
    occur.
  evidence:
  - reference: PMID:32059735
    reference_title: "3-hydroxy-3-methylglutaryl-coenzyme A lyase deficiency: one disease - many faces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most patients manifested within the first year of life, 42.4% already neonatally.
    explanation: The systematic review supports infancy-predominant and frequent neonatal presentation.
- phase: Catabolic-stress metabolic decompensation
  notes: >-
    Fasting, reduced carbohydrate intake, or intercurrent infection can trigger
    acute hypoketotic decompensation. More than 95% of published cases had at
    least one acute episode, although this literature-derived estimate may be
    affected by ascertainment.
  evidence:
  - reference: PMID:32059735
    reference_title: "3-hydroxy-3-methylglutaryl-coenzyme A lyase deficiency: one disease - many faces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: More than 95% of patients presented with acute metabolic decompensation.
    explanation: The systematic review documents acute crises in most published cases.
- phase: Long-term course
  notes: >-
    Neurologic outcome is variable. The systematic review found normal
    development in 62.6% of reported patients, but later crises and neurologic
    symptoms remain possible in adolescence and adulthood.
  evidence:
  - reference: PMID:32059735
    reference_title: "3-hydroxy-3-methylglutaryl-coenzyme A lyase deficiency: one disease - many faces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The neurologic long-term outcome was favorable with 62.6% of patients showing normal development.
    explanation: Published-case follow-up supports a frequently favorable but variable neurologic outcome.
  - reference: PMID:24706027
    reference_title: Ketone body metabolism and its defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with HL deficiency can develop hypoglycemic crises and neurological symptoms even in adolescents and adults.
    explanation: The ketone-metabolism review establishes that clinical risk can persist beyond childhood.
pathophysiology:
- name: Biallelic HMGCL loss of function
  description: >-
    Biallelic pathogenic HMGCL variants reduce mitochondrial
    hydroxymethylglutaryl-CoA lyase activity, the initiating defect shared by
    the ketogenesis and leucine-catabolism branches.

treatments:
- name: Fasting avoidance and individualized sick-day plan
  therapeutic_modality: BEHAVIORAL
  description: >-
    Avoid prolonged fasting and use a metabolic-team emergency plan that
    provides carbohydrate promptly during poor intake or intercurrent illness.
    Fasting avoidance is the most consistently supported preventive strategy.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Acute hypoketotic metabolic decompensation
    treatment_effect: INHIBITS
    description: Maintaining carbohydrate availability reduces catabolism and reliance on impaired ketogenesis.
  evidence:
  - reference: PMID:35646072
    reference_title: "HMG-CoA Lyase Deficiency: A Retrospective Study of 62 Saudi Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the avoidance of fasting seems to be the mainstay of therapy for ketogenesis.
    explanation: The cohort review identifies fasting avoidance as the mainstay while acknowledging limited comparative evidence.
- name: Rapid carbohydrate support during acute decompensation
  description: >-
    Acute management requires prompt specialist-directed suppression of
    catabolism with dextrose-containing intravenous fluids and management of
    associated biochemical abnormalities.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Hypoglycemia
    term:
      id: HP:0001943
      label: Hypoglycemia
  - preferred_term: Metabolic acidosis
    term:
      id: HP:0001942
      label: Metabolic acidosis
  - preferred_term: Hyperammonemia
    term:
      id: HP:0001987
      label: Hyperammonemia
  target_mechanisms:
  - target: Acute hypoketotic metabolic decompensation
    treatment_effect: INHIBITS
    description: Exogenous glucose supplies energy and suppresses ongoing catabolism.
  evidence:
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dietary management in patients with HMGCL deficiency is well tolerated, and rapid institution of acute supportive metabolic treatment is imperative to optimizing survival and improve outcomes in this disorder.
    explanation: The Australian cohort emphasizes rapid supportive metabolic treatment during acute illness.
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: In the acute setting, five of nine patients have used 900 mg/kg/day of sodium D,L 3-hydroxybutyrate in combination with intravenous dextrose-containing fluids (delivering glucose above estimated basal utilization requirements).
    explanation: Observed specialist practice in a small cohort supports dextrose-containing intravenous fluids; the accompanying ketone treatment is modeled separately and remains limited evidence.
- name: Individualized protein, leucine, and fat moderation
  therapeutic_modality: BEHAVIORAL
  description: >-
    Many centers moderate protein or leucine intake and some also moderate fat,
    but prescriptions vary and comparative efficacy is unproven. Restriction
    should therefore be individualized by a metabolic dietitian while
    maintaining growth and nutritional adequacy.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired leucine degradation
    treatment_effect: MODULATES
    description: Moderating leucine-containing protein can reduce substrate flux into the blocked pathway.
  - target: Impaired ketone-body biosynthesis
    treatment_effect: MODULATES
    description: Some centers moderate fat to reduce reliance on ketogenesis, but benefit has not been established.
  evidence:
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All patients have been on long-term protein restriction, and those diagnosed more recently have had additional fat restriction.
    explanation: This documents observed dietary practice in ten Australian patients, not controlled efficacy.
  - reference: PMID:35646072
    reference_title: "HMG-CoA Lyase Deficiency: A Retrospective Study of 62 Saudi Patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: no apparent difference observed in the outcomes of the patients having a leucine or protein-restricted diet.
    explanation: Retrospective cohort data highlight uncertainty about the comparative benefit of restriction.
- name: L-carnitine supplementation
  description: >-
    L-carnitine is commonly prescribed, but available evidence mainly documents
    use rather than clinical efficacy or an optimal dose. Decisions should be
    individualized by the metabolic team.
  treatment_term:
    preferred_term: carnitine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
  target_mechanisms:
  - target: Impaired leucine degradation
    treatment_effect: MODULATES
    description: Carnitine may support acylcarnitine handling, but clinical benefit is not established.
  evidence:
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most patients take L-carnitine.
    explanation: The cohort documents common use without proving efficacy.
- name: Sodium D,L-3-hydroxybutyrate as a specialist adjunct
  description: >-
    Exogenous ketone salt has been used with intravenous dextrose for acute
    management at specialist centers. Evidence is limited to small
    observational series and does not establish routine use or chronic
    efficacy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: 3-hydroxybutyrate
      term:
        id: CHEBI:37054
        label: 3-hydroxybutyrate
  target_mechanisms:
  - target: Impaired ketone-body biosynthesis
    treatment_effect: BYPASSES
    description: Exogenous 3-hydroxybutyrate supplies a ketone substrate despite impaired endogenous production.
  evidence:
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: five of nine patients have used 900 mg/kg/day of sodium D,L 3-hydroxybutyrate in combination with intravenous dextrose-containing fluids
    explanation: This documents use in a small cohort but does not establish comparative effectiveness.
- name: Pregnancy and peripartum metabolic planning
  description: >-
    Pregnancy, vomiting, labor, and delivery can provoke metabolic
    decompensation. Case-report-level evidence supports coordinated care by a
    biochemical geneticist, metabolic dietitian, and high-risk obstetrician,
    with fasting avoidance and glucose-containing fluids during labor and
    delivery.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute hypoketotic metabolic decompensation
    treatment_effect: INHIBITS
    description: Peripartum glucose support and fasting avoidance reduce catabolic stress.
  evidence:
  - reference: PMID:26997609
    reference_title: The management of pregnancy and delivery in 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fasting should be avoided. Intravenous 10% glucose-containing fluids should be provided to prevent catabolism and metabolic decompensation during labor and delivery.
    explanation: A pregnancy case report and management discussion directly support peripartum fasting avoidance and glucose.
- name: Genetic counseling
  description: >-
    Offer genetics-informed counseling about autosomal recessive inheritance
    and family-specific testing options after the causal HMGCL variants are
    defined.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: CGGV:assertion_f4d084e5-a740-4bfd-a850-d6db900d4a4e-2018-06-26T160000.000Z
    reference_title: "HMGCL / 3-hydroxy-3-methylglutaric aciduria (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HMGCL | HGNC:5005 | 3-hydroxy-3-methylglutaric aciduria | MONDO:0009520 | AR | Definitive"
    explanation: The definitive autosomal recessive relationship supports genetics-informed counseling.
diagnosis:
- name: Newborn screening with C5-OH and second-tier metabolites
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  description: >-
    Elevated C5-OH, often assessed with C6DC, can trigger evaluation on a dried
    blood spot. C5-OH is nonspecific; second-tier 3H3MG-A and 3MGC-A improve
    discrimination and positive screens require confirmatory testing. Maternal
    3-methylcrotonyl-CoA carboxylase deficiency can also cause a positive
    neonatal screen and may warrant maternal evaluation.
  results: Elevated C5-OH is a screening signal that requires infant confirmatory testing and, when indicated, maternal testing.
  evidence:
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a positive case, a second-tier analysis of 3-hydroxy-3-methylglutaric acid and 3-methylglutaconic acid in a dry blood spot using UHPLC tandem mass spectrometry instruments confirms the diagnosis.
    explanation: The biomarker study supports second-tier 3H3MG-A and 3MGC-A analysis after a positive screen.
  - reference: PMID:40937535
    reference_title: "Evaluation of Newborn Screening for Diseases Using C5-OH as a Marker: Systematic Review of the Literature and Evaluation of 17 Years of C5-OH Screening in the Netherlands."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: C5-OH concentrations of patients with different IEMs reported in the literature were insufficiently distinctive to differentiate between these diseases.
    explanation: The systematic screening evaluation establishes the need for disease-specific follow-up.
  - reference: PMID:40673334
    reference_title: "Beyond newborn screening: the role of reverse cascade testing in familial disease detection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There are additional scenarios within NBS where disease maternal conditions (3-methylcrotonyl-CoA carboxylase deficiency and carnitine uptake deficiency) or nutritional maternal conditions (vitamin B12 deficiency) may cause a screen-positive NBS result.
    explanation: This establishes maternal 3-MCCD as a cause of a positive newborn-screening result.
- name: Plasma acylcarnitine and urine organic-acid analysis
  diagnosis_term:
    preferred_term: urine chemistry measurement
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: >-
    Confirmatory biochemical evaluation includes plasma acylcarnitines and a
    characteristic urinary pattern of 3-hydroxy-3-methylglutaric,
    3-methylglutaconic, 3-methylglutaric, and 3-hydroxyisovaleric acids.
  results: The characteristic metabolite pattern strongly supports HMGCL deficiency.
  evidence:
  - reference: PMID:41323099
    reference_title: "Timely intervention in HMG-CoA Lyase deficiency: The role of newborn screening, metabolic management, and genomic sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Initial follow-up testing generally includes a plasma acylcarnitine profile and a urine organic acid profile.
    explanation: This recent clinical report explicitly describes the paired plasma and urine follow-up tests.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is currently made by measuring dry blood spot acylcarnitines (C5OH and C6DC) followed by urinary organic acid profiling for the differential diagnosis from several other disorders."
    explanation: The study describes the biochemical diagnostic workflow.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with HMGCLD present with a diagnostic urinary pattern of elevated organic acids such as 3‐hydroxyisovaleric acid (3HIV‐A), 3‐methylglutaconic acid (3MGC‐A), 3‐hydroxy‐3‐methylglutaric acid (3H3MG‐A), 3‐methylglutaric acid (3MG‐A) and in some cases 3‐methylcrotonylglycine."
    explanation: This explicitly defines the characteristic urinary organic-acid profile.
- name: HMGCL molecular confirmation
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Identify biallelic pathogenic HMGCL variants using sequencing with
    deletion/duplication analysis. If biochemical evidence is strong but routine
    testing is negative, broader genomic and RNA studies may detect
    noncanonical variants; HMGCL enzyme-activity testing can provide independent
    functional confirmation.
  results: Biallelic pathogenic HMGCL variants confirm the molecular diagnosis; deficient enzyme activity can support functional confirmation.
  evidence:
  - reference: PMID:35646072
    reference_title: "HMG-CoA Lyase Deficiency: A Retrospective Study of 62 Saudi Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: molecular diagnosis using next-generation sequencing should be followed to pinpoint precisely the genetic cause
    explanation: The cohort review supports molecular confirmation after metabolite screening.
  - reference: PMID:41323099
    reference_title: "Timely intervention in HMG-CoA Lyase deficiency: The role of newborn screening, metabolic management, and genomic sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Genome sequencing was then requested which identified a deep intronic complex variant of unknown significance within intron 1 of HGMCL. RNA sequencing studies were sent as follow-up which revealed that the level of expression of the HMGCL gene was negligible
    explanation: A recent case demonstrates the role of genome and RNA testing after negative targeted sequencing and deletion/duplication analysis.
  - reference: PMID:32685354
    reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis is usually confirmed by enzyme and/or genetic testing.
    explanation: This supports enzyme activity as an independent functional confirmation route.
differential_diagnoses:
- name: 3-Hydroxy-3-methylglutaryl-CoA synthase deficiency
  disease_term:
    preferred_term: 3-hydroxy-3-methylglutaryl-CoA synthase deficiency
    term:
      id: MONDO:0011614
      label: 3-hydroxy-3-methylglutaryl-CoA synthase deficiency
  description: >-
    HMGCS2 deficiency is the closest ketogenesis differential for hypoketotic
    hypoglycemia. The characteristic HMGCL leucine-derived organic-acid pattern
    and molecular testing distinguish the disorders.
  evidence:
  - reference: PMID:24706027
    reference_title: Ketone body metabolism and its defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Defects in ketogenesis include mitochondrial HMG-CoA synthase (mHS) deficiency and HMG-CoA lyase (HL) deficiency.
    explanation: The ketone-metabolism review places the two conditions together as ketogenesis defects.
  - reference: PMID:38567177
    reference_title: "Inborn Errors of Ketogenesis: Novel Variants, Clinical Presentation, and Follow-Up in a Series of Four Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: TMS was nonspecific and urine GCMS revealed dicarboxylic aciduria in HMGCS deficiency. Both the patients with HMGCL deficiency demonstrated elevated 3 hydroxyisovaleryl carnitine levels in TMS and metabolites of leucine degradation in urine GCMS.
    explanation: The small comparative series directly supports the distinguishing biochemical patterns.
- name: 3-Methylcrotonyl-CoA carboxylase deficiency
  disease_term:
    preferred_term: 3-methylcrotonyl-CoA carboxylase deficiency
    term:
      id: MONDO:0018950
      label: 3-methylcrotonyl-CoA carboxylase deficiency
  description: >-
    3-MCC deficiency commonly raises C5-OH and is a major newborn-screening
    differential. Urine organic acids, second-tier testing, and molecular
    analysis distinguish it from HMGCL deficiency.
  evidence:
  - reference: PMID:40937535
    reference_title: "Evaluation of Newborn Screening for Diseases Using C5-OH as a Marker: Systematic Review of the Literature and Evaluation of 17 Years of C5-OH Screening in the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2007, the Dutch newborn screening (NBS) program was expanded to include C5-OH as a marker to screen for three inborn errors of metabolism (IEMs): 3-methylcrotonyl-CoA carboxylase deficiency (3-MCCD), 3-hydroxy-3-methylglutaryl-CoA lyase deficiency (HMGCLD) and holocarboxylase synthetase deficiency (HLCSD)."
    explanation: The Dutch program explicitly screened both 3-MCCD and HMGCL deficiency with C5-OH.
- name: Holocarboxylase synthetase deficiency (multiple carboxylase deficiency)
  disease_term:
    preferred_term: holocarboxylase synthetase deficiency
    term:
      id: MONDO:0009666
      label: holocarboxylase synthetase deficiency
  description: >-
    Holocarboxylase synthetase deficiency causes inherited multiple carboxylase
    deficiency and is another C5-OH newborn-screening
    condition. Disease-specific biochemical and molecular follow-up distinguishes it.
  evidence:
  - reference: PMID:40937535
    reference_title: "Evaluation of Newborn Screening for Diseases Using C5-OH as a Marker: Systematic Review of the Literature and Evaluation of 17 Years of C5-OH Screening in the Netherlands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2007, the Dutch newborn screening (NBS) program was expanded to include C5-OH as a marker to screen for three inborn errors of metabolism (IEMs): 3-methylcrotonyl-CoA carboxylase deficiency (3-MCCD), 3-hydroxy-3-methylglutaryl-CoA lyase deficiency (HMGCLD) and holocarboxylase synthetase deficiency (HLCSD)."
    explanation: The Dutch program explicitly screened both HLCSD and HMGCL deficiency with C5-OH.
  - reference: PMID:9350481
    reference_title: "Multiple carboxylase deficiency: inherited and acquired disorders of biotin metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Acquired biotin deficiency and the two known congenital disorders of biotin metabolism, biotinidase and holocarboxylase synthetase (HCS) deficiency, all lead to deficiency of the 4 biotin-dependent carboxylases, i.e. to multiple carboxylase deficiency (MCD).
    explanation: This identifies HLCS and biotinidase deficiencies as the inherited multiple-carboxylase branches.
- name: Biotinidase deficiency (late-onset multiple carboxylase deficiency)
  disease_term:
    preferred_term: biotinidase deficiency
    term:
      id: MONDO:0009665
      label: biotinidase deficiency
  description: >-
    Biotinidase deficiency can produce secondary multiple carboxylase deficiency
    with elevated C5-OH and 3-hydroxyisovaleric acid. Low biotinidase activity
    and BTD testing distinguish it from HMGCL deficiency.
  evidence:
  - reference: PMID:37373384
    reference_title: "Delayed Biotin Therapy in a Child with Atypical Profound Biotinidase Deficiency: Late Arrival of the Truth and a Lesson Worth Thinking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During hospitalization, BTD deficiency was suggested by elevated concentration of 3-hydroxyisovaleryl-carnitine in the blood spots and 3-hydroxyisovaleric acid in the urine.
    explanation: The case directly documents the same C5-OH and urinary 3-hydroxyisovaleric-acid signals that can prompt this differential.
  - reference: PMID:37373384
    reference_title: "Delayed Biotin Therapy in a Child with Atypical Profound Biotinidase Deficiency: Late Arrival of the Truth and a Lesson Worth Thinking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The child was then diagnosed with profound BTD deficiency based on the above findings and low BTD enzyme activity.
    explanation: Low biotinidase activity provides a disease-specific distinguishing test.
- name: HSD10 mitochondrial disease (MHBD deficiency)
  disease_term:
    preferred_term: HSD10 mitochondrial disease
    term:
      id: MONDO:0010327
      label: HSD10 mitochondrial disease
  description: >-
    HSD10/MHBD deficiency can elevate C5-OH and C5:1 and produce abnormal urine
    organic acids. Its distinct urine pattern and HSD17B10 testing distinguish
    it from HMGCL deficiency.
  evidence:
  - reference: PMID:20157782
    reference_title: "The first case of mitochondrial acetoacetyl-CoA thiolase deficiency identified by expanded newborn metabolic screening in Italy: the importance of an integrated diagnostic approach."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: C5:1 and C5OH concentrations are elevated in both β-KT deficiency and 2-methyl-3-hydroxybutyryl-CoA dehydrogenase deficiency (MHBD deficiency)
    explanation: This directly establishes C5-OH and C5:1 elevation in MHBD deficiency.
  - reference: PMID:22127393
    reference_title: "HSD10 disease: clinical consequences of mutations in the HSD17B10 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Diagnosis is based on typical abnormalities in urinary organic acid analysis and molecular studies.
    explanation: The HSD10 review supports urine-organic-acid and molecular differentiation.
- name: Beta-ketothiolase deficiency
  disease_term:
    preferred_term: beta-ketothiolase deficiency
    term:
      id: MONDO:0008760
      label: beta-ketothiolase deficiency
  description: >-
    Beta-ketothiolase deficiency belongs to the disease spectrum identified in
    patients with abnormal C5-OH metabolism. Blood acylcarnitines, urine organic
    acids, clinical findings, and genetic testing distinguish these conditions.
  evidence:
  - reference: PMID:37994125
    reference_title: "[Analysis of disease spectrum for abnormal 3-hydroxyisovalerylcarnitine metabolism identified through newborn screening and clinical diagnosis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Five diseases were diagnosed, including 28 cases with multiple carboxylase deficiency (MCD, 32.9%), 29 cases with 3-methylcrotonyl-coenzymeAcarboxylasedeficiency (MCCD, 34.1%), 4 cases with 3-methylglutaconic acid (3-MGA, 4.7%), 7 cases with 3-hydroxy-3-methylglutaric acid (3-HMG, 8.2%), and 17 cases with beta-ketothiolase deficiency (BKD, 20.0%).
    explanation: An 85-patient abnormal-C5-OH cohort directly places beta-ketothiolase deficiency and HMGCL deficiency in the same diagnostic spectrum.
  - reference: PMID:23958592
    reference_title: "Metabolic encephalopathy in beta-ketothiolase deficiency: the first report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: During the acute crisis the C5OH (2-methyl-3-hydroxybutyryl) carnitine and C5:1 (tiglyl) carnitine were elevated and large amounts of 2-methyl-3-hydroxybutyrate, tiglylglycine, and 2-methylacetoacetate were excreted.
    explanation: The beta-ketothiolase case provides its specific acylcarnitine and urine-organic-acid pattern for differentiation.
- name: 3-Methylglutaconic aciduria type 1
  disease_term:
    preferred_term: 3-methylglutaconic aciduria type 1
    term:
      id: MONDO:0009610
      label: 3-methylglutaconic aciduria type 1
  description: >-
    AUH-related 3-methylglutaconic aciduria shares elevated
    3-methylglutaconic acid but lacks the complete HMGCL biochemical signature.
  evidence:
  - reference: PMID:16640564
    reference_title: Biochemical characterization of human 3-methylglutaconyl-CoA hydratase and its role in leucine metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The metabolic disease 3-methylglutaconic aciduria type I (MGA1) is characterized by an abnormal organic acid profile in which there is excessive urinary excretion of 3-methylglutaconic acid, 3-methylglutaric acid and 3-hydroxyisovaleric acid.
    explanation: This self-contained profile documents the metabolites that overlap HMGCL deficiency.
  - reference: PMID:16640564
    reference_title: Biochemical characterization of human 3-methylglutaconyl-CoA hydratase and its role in leucine metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In addition, it was shown that mutations in the AUH gene are linked to MGA1.
    explanation: This supports the AUH-specific disease identity used in the differential.
notes: >-
  Disease identity is resolved: MONDO, Orphanet, OMIM, and ClinGen align on
  autosomal recessive HMGCL deficiency. The major unresolved questions concern
  translation of model-derived mechanisms and comparative effectiveness of
  chronic diet, carnitine, and exogenous ketone strategies. Carglumate rescue is
  retained only as preclinical pathophysiology evidence and is not represented
  as an established human treatment.
discussions:
- discussion_id: mismatch_hmgcl_preclinical_metabolite_and_liver_models
  prompt: >-
    Do the liver-specific HMGCL-knockout acyl-CoA/N-acetylglutamate mechanism
    and intracerebroventricular HMG neurotoxicity model quantitatively explain
    human hyperammonemia and neurologic injury?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Preclinical hepatic acyl-CoA disequilibrium
  - pathophysiology#Preclinical HMG-mediated mitochondrial injury
  rationale: >-
    Both models establish biological plausibility, but one is a liver-restricted
    knockout and the other bypasses systemic metabolism by directly injecting
    HMG into the neonatal rat brain. Human acyl-CoA/NAG measurements and
    patient-derived neural models are needed before these branches can be
    treated as established human mechanisms.
  evidence:
  - reference: PMID:23861731
    reference_title: A liver-specific defect of Acyl-CoA degradation produces hyperammonemia, hypoglycemia and a distinct hepatic Acyl-CoA pattern.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We created a mouse model of one such condition, deficiency of 3-hydroxy-3-methylglutaryl-CoA lyase (HL), in liver (HLLKO mice).
    explanation: The hyperammonemia mechanism derives from a liver-specific mouse model.
  - reference: PMID:39062136
    reference_title: 3-Hydroxy-3-Methylglutaric Acid Disrupts Brain Bioenergetics, Redox Homeostasis, and Mitochondrial Dynamics and Affects Neurodevelopment in Neonatal Wistar Rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we investigated the effects of intracerebroventricular administration of HMG
    explanation: The neurotoxicity study used direct intracerebroventricular metabolite exposure.
- discussion_id: gap_hmgcl_chronic_diet_and_adjunct_therapy
  prompt: >-
    What protein/leucine and fat prescription best prevents crises without
    compromising nutrition, and which patients benefit from L-carnitine or
    acute versus chronic exogenous 3-hydroxybutyrate?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Individualized protein, leucine, and fat moderation
  - treatments#L-carnitine supplementation
  - treatments#Sodium D,L-3-hydroxybutyrate as a specialist adjunct
  rationale: >-
    Current reports document heterogeneous practice and small observational
    cohorts. Comparative data are insufficient to define dietary intensity,
    carnitine dose or efficacy, or the acute and chronic roles of ketone salts.
  evidence:
  - reference: PMID:35646072
    reference_title: "HMG-CoA Lyase Deficiency: A Retrospective Study of 62 Saudi Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: no apparent difference observed in the outcomes of the patients having a leucine or protein-restricted diet.
    explanation: Retrospective data do not establish comparative dietary benefit.
  - reference: PMID:36771238
    reference_title: Treatment of HMG-CoA Lyase Deficiency-Longitudinal Data on Clinical and Nutritional Management of 10 Australian Cases.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: five of nine patients have used 900 mg/kg/day of sodium D,L 3-hydroxybutyrate in combination with intravenous dextrose-containing fluids
    explanation: Observed use in a small cohort does not resolve efficacy or optimal duration.

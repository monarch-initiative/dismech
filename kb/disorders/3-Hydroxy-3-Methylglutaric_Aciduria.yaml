      explanation: The cohort review links the ketogenesis disorder with characteristic acute decompensation.
- name: Impaired leucine degradation
  description: >-
    The leucine-catabolism block causes accumulation of HMG-CoA-derived and
    upstream organic acids. These metabolites form the characteristic
    biochemical signature and may contribute to toxicity during catabolic
    stress.

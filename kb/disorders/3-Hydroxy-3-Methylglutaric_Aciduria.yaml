  - reference: PMID:32059735
    reference_title: "3-hydroxy-3-methylglutaryl-coenzyme A lyase deficiency: one disease - many faces."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 3-hydroxy-3-methylglutaryl-coenzyme A lyase deficiency (HMGCLD) is an autosomal recessive disorder of ketogenesis and leucine degradation due to mutations in HMGCL.
    explanation: The clinical systematic review identifies HMGCL variants as the cause of both metabolic defects.
  downstream:
  - target: Impaired ketone-body biosynthesis
    causal_link_type: DIRECT
    description: Reduced HMGCL activity limits cleavage of HMG-CoA to acetoacetate and acetyl-CoA in hepatic ketogenesis.
    evidence:
    - reference: PMID:32685354
      reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mitochondrial enzyme is responsible for catalyzing the cleavage of HMG‐CoA to acetyl‐CoA and acetoacetic acid. This conversion is a common last step in leucine catabolism and ketogenesis from fatty acids."
      explanation: The human biomarker study describes the HMGCL-catalyzed reaction and its role in ketogenesis.
  - target: Impaired leucine degradation
    causal_link_type: DIRECT
    description: The same enzyme defect blocks the final HMG-CoA cleavage step in leucine degradation.
    evidence:
    - reference: PMID:32685354
      reference_title: A newborn screening approach to diagnose 3-hydroxy-3-methylglutaryl-CoA lyase deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mitochondrial enzyme is responsible for catalyzing the cleavage of HMG‐CoA to acetyl‐CoA and acetoacetic acid. This conversion is a common last step in leucine catabolism and ketogenesis from fatty acids."
      explanation: The reaction is shared by leucine catabolism and ketogenesis.
- name: Impaired ketone-body biosynthesis
  description: >-
    HMGCL deficiency impairs hepatic acetoacetate production and produces an
    inadequate ketone response during fasting or illness. This is downstream of
    fatty-acid oxidation; fatty-acid beta-oxidation itself is not the deficient
    enzymatic process.

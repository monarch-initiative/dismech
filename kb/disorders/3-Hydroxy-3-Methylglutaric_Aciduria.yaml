name: 3-Hydroxy-3-Methylglutaric Aciduria
category: Mendelian
creation_date: '2026-02-23T00:00:00Z'
synonyms:
- HMG-CoA lyase deficiency
- HMGCL deficiency
- HMGCLD
- 3-Hydroxy-3-methylglutaric acidemia
- Hydroxymethylglutaric aciduria
description: >-
  3-Hydroxy-3-methylglutaric aciduria is an autosomal recessive disorder caused
  by biallelic pathogenic variants in HMGCL. Deficient mitochondrial
  3-hydroxy-3-methylglutaryl-CoA lyase impairs both ketone-body synthesis and
  leucine degradation. Most reported patients present in infancy with
  fasting- or infection-triggered metabolic decompensation characterized by
  hypoketotic hypoglycemia, metabolic acidosis, and sometimes hyperammonemia.
  Neurologic outcome is variable, and acute crises can also occur in
  adolescents and adults.

    Recurrent bacterial, viral and fungal infections beginning in the first year of
    life. The breadth across organism classes, rather than susceptibility to one
    class, is what points at a combined rather than a selective defect.

    The VERY_FREQUENT band reflects presence in every reported patient of the two
    founding series, not a published percentage, of which there is none.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:30026316

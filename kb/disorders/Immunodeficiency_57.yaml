    another.
  downstream:
  - target: Intestinal Epithelial Injury and Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthritis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The polyarthritis is the joint manifestation of the autoinflammatory arm. No

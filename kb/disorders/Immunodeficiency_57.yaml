name: Immunodeficiency 57
creation_date: "2026-09-17T14:40:00Z"
description: >-
  Immunodeficiency 57 with autoinflammation (IMD57) is the autosomal recessive
  disease caused by biallelic loss-of-function variants in RIPK1, and it is
  unusual in combining immunodeficiency with autoinflammation in the same
  patient. RIPK1 sits immediately downstream of TNFR1 in signalling complex I,
  where it does two different jobs: as a scaffold it supports the ubiquitination
  events that route the signal into NF-kappaB and MAPK activation and so keep the
  cell alive, and as a kinase it can instead drive the cell into apoptosis or, when
  caspase-8 is unavailable, necroptosis. Losing the protein therefore removes a
  pro-survival signal and a cell-death brake at once. The consequences are
  correspondingly two-sided: reduced NF-kappaB activity with defective T- and
  B-cell differentiation and impaired cytokine secretion on one side, and increased
  inflammasome activity with cells prone to necroptosis on the other. Patients
  present in the first year of life with recurrent bacterial, viral and fungal
  infections, early-onset inflammatory bowel disease, progressive polyarthritis
  and lymphopenia. Only a few families have been reported. Haematopoietic stem
  cell transplantation corrected the cytokine production defect and resolved the
  clinical picture in one reported patient, which is the strongest evidence that
  the disease is driven by the haematopoietic compartment.
synonyms:
- IMD57
- immunodeficiency 57 with autoinflammation
- RIPK1 deficiency
- human RIPK1 deficiency

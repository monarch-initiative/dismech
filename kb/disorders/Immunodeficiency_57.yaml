biochemical:
- name: Whole-blood cytokine production assay
  notes: >-
    Altered production of multiple cytokines on whole-blood stimulation is one of the
    two laboratory features named in the disease definition, alongside the
    lymphopenia, and it is the measurement that reversed after transplantation. That
    makes it the entry's one functional readout that has been shown to respond to an
    intervention, which is a stronger claim than a marker that merely correlates with
    the genotype.

    The direction is "altered" rather than uniformly reduced: the sources describe
    dysregulated production across several cytokines, and the accompanying in-vitro
    work shows impaired secretion. This entry does not collapse that into a single
    direction, because no located source gives per-cytokine directions.
  readouts:
  - target: Impaired NF-kappaB and MAPK Signalling
    relationship: READOUT_OF
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Complex I signalling is what drives cytokine transcription downstream of TNFR1,
      so a whole-blood cytokine profile is the accessible functional readout of the
      signalling defect.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They had immunodeficiency with lymphopenia and altered production of various
        cytokines revealed by whole-blood assays.
      explanation: >-
        Names the assay and the abnormality it detects, in the patients.
  - target: Defective T and B Cell Differentiation
    relationship: PHARMACODYNAMIC_MARKER_OF
    endpoint_context: MONITORING
    interpretation: >-
      The cytokine production defect reversed after haematopoietic stem cell
      transplantation, so the assay tracks correction of the haematopoietic
      compartment rather than only confirming the diagnosis.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hematopoietic stem cell transplantation reversed cytokine production defects
        and resolved clinical symptoms in one patient.
      explanation: >-
        The reversal, in one patient. A single observation, which is why the
        interpretation says tracks rather than validates.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
      kinase activation and cytokine secretion and were prone to necroptosis.
    explanation: >-
      The cell-level counterpart of the whole-blood finding, measured in patient cells.
diagnosis:
- name: RIPK1 sequencing
  description: >-
    Molecular confirmation. Biallelic loss-of-function variants are the diagnosis, and
    the zygosity is not incidental detail: a heterozygous RIPK1 variant at the
    caspase-8 cleavage site Asp324 indicates a different, dominantly inherited
    hyperinflammatory disease rather than a milder form of this one, so a report that
    stops at "RIPK1 variant found" is not a diagnosis.
  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on eight patients from six unrelated pedigrees with biallelic
      loss-of-function mutations in RIPK1 presenting with primary immunodeficiency
      and/or intestinal inflammation.
    explanation: >-
      The genotype that defines the disease, with the biallelic requirement explicit.
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This review discusses the molecular pathogenesis of RIPK1-deficiency and
      cleavage-resistant RIPK1 induced autoinflammatory (CRIA) disorders and
      summarizes the clinical manifestations of respective diseases to help with the
      identification of new patients.
    explanation: >-
      Places the two RIPK1 diseases side by side, which is what makes reading the
      zygosity part of the diagnostic step rather than an afterthought.
- name: Whole-blood cytokine production assay
  description: >-
    The functional test. Whole-blood stimulation assays revealed altered production of
    various cytokines in the founding patients, and the same measurement normalised
    after transplantation. It is accessible in a way the cell-level work is not.
  markers: >-
    Multiple cytokines on whole-blood stimulation; the entry's biochemical section
    carries this as a readout of the signalling node.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They had immunodeficiency with lymphopenia and altered production of various
      cytokines revealed by whole-blood assays.
    explanation: The assay and its abnormal result in the founding cohort.
- name: Lymphocyte count
  description: >-
    Lymphopenia is the other laboratory feature named in the disease definition and is
    the cheapest abnormality to detect, though it is not specific to this disease.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They had immunodeficiency with lymphopenia and altered production of various
      cytokines revealed by whole-blood assays.
    explanation: Lymphopenia in the founding cohort.
genetic:
- name: RIPK1
  gene_term:
    preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  relationship_type: CAUSATIVE
  notes: >-
    Receptor-interacting serine/threonine kinase 1, on chromosome 6p25.2. Biallelic
    loss-of-function variants cause this disease. Heterozygous variants at the
    caspase-8 cleavage site Asp324 cause a different, dominantly inherited
    hyperinflammatory disease, so the same gene supports two diseases distinguished
    by zygosity and by the direction of the functional consequence. That second
    disease is not curated here and should not be folded into this entry.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RIPK1 (receptor-interacting serine/threonine kinase 1) is a master regulator of
      signaling pathways leading to inflammation and cell death and is of medical
      interest as a drug target.
    explanation: >-
      Identifies the gene product and its dual role in inflammation and cell death.
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This review discusses the molecular pathogenesis of RIPK1-deficiency and
      cleavage-resistant RIPK1 induced autoinflammatory (CRIA) disorders and
      summarizes the clinical manifestations of respective diseases to help with the
      identification of new patients.
    explanation: >-
      Sets the two RIPK1 diseases side by side, which is the basis for the warning in
      this entry's notes against conflating them.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Transplantation reversed the cytokine production defect and resolved clinical
    symptoms in one reported patient. Because RIPK1 is expressed well beyond the
    haematopoietic compartment, the fact that replacing that compartment alone was
    sufficient is itself a mechanistic result and not only a therapeutic one. The
    evidence base is a single patient.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective T and B Cell Differentiation
    description: >-
      Replacing the haematopoietic compartment supplies lymphoid progenitors with
      intact RIPK1.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hematopoietic stem cell transplantation reversed cytokine production defects
        and resolved clinical symptoms in one patient.
      explanation: >-
        The rescue, in a patient. It is one patient, which is why this entry does not
        state transplantation as established therapy.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hematopoietic stem cell transplantation reversed cytokine production defects
      and resolved clinical symptoms in one patient.
    explanation: The single reported transplant outcome.
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HSCT has resolved the inflammatory manifestations and reduced the frequency of
      infections in one RIPK1-deficient patient
    explanation: >-
      The review's independent statement of the same single-patient result, which is
      useful because it names what transplantation resolved (the inflammatory
      manifestations and the infection frequency) rather than only that symptoms
      resolved.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      | family 1 | P2 | Pakistan | M | 867_870delTTTA | Y289* | 1 mo. | RLRR | Y | N | N

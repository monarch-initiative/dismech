  downstream:
  - target: Defective T and B Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      NF-kappaB signalling is required for lymphocyte development, and its reduction
      in these patients is accompanied by defective differentiation of both lineages.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        The reduced NF-kappaB activity and the differentiation defect are reported in
        the same patients, in that order.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
      kinase activation and cytokine secretion and were prone to necroptosis.
    explanation: Measures the MAPK and cytokine arms in patient cells.
- name: Defective T and B Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    Both lymphocyte lineages differentiate abnormally, which is the cellular basis
    of the lymphopenia and of the susceptibility to bacterial, viral and fungal
    organisms alike. A defect confined to one lineage would not produce that breadth.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Lymphopenia
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: >-
      Defective differentiation of both lymphocyte lineages leaves the patient unable
      to mount adequate adaptive responses, which is the immunodeficiency the patients
      present with.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They had immunodeficiency with lymphopenia and altered production of various
        cytokines revealed by whole-blood assays.
      explanation: >-
        Ties the immunodeficiency and the lymphopenia together in the same patients.
  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in RIPK1 were associated with reduced NF-κB activity, defective
      differentiation of T and B cells, increased inflammasome activity, and
      impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
    explanation: The differentiation defect in both lineages.
- name: Necroptosis Susceptibility
  biological_scale: CELLULAR
  description: >-
    RIPK1-deficient cells are prone to necroptosis. Necroptosis is lytic and
    releases intracellular contents, so a tissue whose cells die this way generates
    inflammation rather than being cleared quietly, which is one route by which the
    loss of a pro-survival signal produces an inflammatory phenotype.
  biological_processes:
  - preferred_term: necroptotic signaling pathway
    modifier: INCREASED
    term:
      id: GO:0097527
      label: necroptotic signaling pathway
  downstream:
  - target: Intestinal Epithelial Injury and Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intestinal epithelium is where the cell-death handling defect is
      demonstrated in these patients, and where the clinical consequence is most
      conspicuous. The intervening steps between the altered death response and the
      established colitis are not resolved in the cited work.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Locates the impaired cell-death response specifically in intestinal epithelial
        cells, which is what makes the gut the site of this edge.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
      kinase activation and cytokine secretion and were prone to necroptosis.
    explanation: The necroptosis susceptibility, measured in patient cells.
- name: Increased Inflammasome Activity
  biological_scale: CELLULAR
  description: >-
    Inflammasome activity is raised in RIPK1-deficient patients. This is the
    autoinflammatory half of the disease and the reason the entry is not simply an
    immunodeficiency: the same lesion that blunts one inflammatory output amplifies
    another.
  downstream:
  - target: Intestinal Epithelial Injury and Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Arthritis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The polyarthritis is the joint manifestation of the autoinflammatory arm. No
      located source traces the steps from inflammasome activation to synovitis in
      these patients, so the edge is recorded with its intermediates unknown rather

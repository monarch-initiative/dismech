  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in RIPK1 were associated with reduced NF-κB activity, defective
      differentiation of T and B cells, increased inflammasome activity, and
      impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
    explanation: The increased inflammasome activity.
- name: Intestinal Epithelial Injury and Inflammation
  biological_scale: TISSUE
  description: >-
    The gut is the organ where the two arms of the disease meet. Intestinal
    epithelial cells respond abnormally to TNFR1-mediated death signals, and the
    result clinically is chronic inflammation of the digestive tract presenting in
    the first year of life.
  cell_types:
  - preferred_term: intestinal epithelial cell
    term:
      id: CL:0002563
      label: intestinal epithelial cell
  downstream:
  - target: Colitis
    causal_link_type: DIRECT
  - target: Gastritis
    causal_link_type: DIRECT
  - target: Failure to thrive
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic enteropathy impairs nutrient absorption and intake, and the infection
      burden adds to the energy deficit.
  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in RIPK1 were associated with reduced NF-κB activity, defective

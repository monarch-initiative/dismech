      label: Autosomal recessive inheritance
  description: >-
    IMD57 requires two defective RIPK1 alleles. Reported patients have been
    homozygous, several from consanguineous families. Heterozygous carriers are
    unaffected. The distinction from the dominant disease at the same locus is not
    one of dosage but of consequence: cleavage-resistant RIPK1 variants at Asp324
    act in the heterozygous state and cause a hyperinflammatory disease, not this one.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four patients from three unrelated families with complete RIPK1
      deficiency caused by rare homozygous mutations.
    explanation: >-
      The founding cohort, establishing homozygous loss of function as the genotype.
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on eight patients from six unrelated pedigrees with biallelic
      loss-of-function mutations in RIPK1 presenting with primary immunodeficiency
      and/or intestinal inflammation.
    explanation: >-
      Independent replication in a second, larger series, with the same biallelic
      loss-of-function requirement.
prevalence:
- population: Patients reported in the two founding series
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four patients from three families in the first report and eight patients from
    six pedigrees in the second, with further single cases since. No population
    prevalence has been estimated, and none of the located sources offers a
    denominator, so the ULTRA_RARE band rests on the published case count rather
    than on a measured rate.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four patients from three unrelated families with complete RIPK1
      deficiency caused by rare homozygous mutations.
    explanation: The case count in the founding report.
progression:
- phase: Infantile onset
  notes: >-
    Presentation is in the first year of life, with recurrent infections and
    gastrointestinal inflammation. The arthritis is described as progressive rather
    than static, which is what separates the joint disease here from a transient
    post-infectious arthritis.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients suffered from recurrent infections, early-onset inflammatory
      bowel disease, and progressive polyarthritis.
    explanation: >-
      The presenting triad. "Early-onset" and "progressive" are the paper's own
      words for the timing.
- phase: Outcome in the published cohort
  notes: >-
    Six of the fourteen patients with recessive RIPK1 deficiency tabulated in the 2021
    review had died at the time of writing (P1, P3, P5, P7, P8 and P14), seven were
    alive and one outcome was not reported. That count is a tabulation of the `Outcome`
    column rather than a figure the review states, and it is a published-case series
    with the ascertainment bias that implies, so it bounds severity rather than
    estimating survival. Four of the six deaths occurred in patients who had received a
    transplant or immunosuppression, which is why this entry does not present either as
    established therapy.
  evidence:
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      patients with RIPK1 biallelic LoF mutations were born alive, however, they
      suffered from severe and potentially lethal immunodeficiency
    explanation: >-
      The review's own characterisation of the disease's severity, which is the claim
      this phase records. The per-patient outcomes below are the tabulated form of it.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      | family 1 | P1 | Pakistan | M | 867_870delTTTA | Y289* | 1 mo. | LLLR | Y | N | N
      | Y | Y | N | N | N | bronchiectasis, HCMV, recurrent RI | HSCT | Died |
    explanation: >-
      Table 1, patient P1: the `Outcome` column reads Died, despite transplantation.
      P1's brother P2 received the same treatment and survived, which is the clearest
      statement in the table that outcome is not determined by genotype alone.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      | family 6 | P7 | Caucasian | F | 1278C>A | Y426* | 1 day | LLLL | Y | Y | Y | N |
      N | N | N | N | GI infections, U/LRI, septicemia, hepatitis | CS, HSCT | Died |
    explanation: >-
      Patient P7, the second transplanted patient who died. Four of the six deaths (P1,
      P3, P5 and P7) were in patients who had received transplantation or
      immunosuppression.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: RIPK1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish RIPK1 protein. RIPK1 is a 75.9 kDa
    protein with an N-terminal kinase domain, a C-terminal death domain and an
    intermediate domain carrying a RIP homotypic interaction motif, and it is
    recruited with TRADD to TNFR1 to form signalling complex I. Because the protein
    carries both a scaffolding role and a kinase role, its complete absence removes
    two opposing functions simultaneously, which is why the resulting disease is
    not simply a loss of inflammation or a gain of it.
  genes:
  - preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired NF-kappaB and MAPK Signalling
    causal_link_type: DIRECT
    description: >-
      RIPK1 is a component of complex I, whose ubiquitination provides the docking
      platform for the kinases that activate NF-kappaB and MAPK. Without RIPK1 that
      platform is not assembled.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Measures reduced NF-kappaB activity directly in patients carrying the
        mutations, which is the step this edge asserts.
  - target: Necroptosis Susceptibility
    causal_link_type: DIRECT
    description: >-
      Losing RIPK1 does not abolish cell death but redirects it. Patient cells were
      prone to necroptosis in vitro.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
        kinase activation and cytokine secretion and were prone to necroptosis.
      explanation: >-
        The necroptosis susceptibility is measured in the patients' own cells, so
        the edge is not inferred from a model system.
  - target: Increased Inflammasome Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inflammasome activity is increased rather than decreased in RIPK1-deficient
      patients. The route is not established: a non-canonical
      TLR4-TRIF-RIPK1-FADD-caspase-8 axis has been proposed, and this entry does not
      assert it.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Establishes that inflammasome activity rises, which is the claim; the same
        sentence says nothing about the route, which is why the link type is not DIRECT.
  evidence:
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RIPK1 is a 75.9 kDa protein with an amino-terminal kinase domain (KD), a
      carboxy-terminal death domain (DD), and an intermediate domain (ID) in-between
      which contains a Rip homotypic interaction motif (RHIM).
    explanation: >-
      The domain architecture behind the dual scaffold/kinase role. This is the
      review's synthesis of established structural work, not its own result.
- name: Impaired NF-kappaB and MAPK Signalling
  biological_scale: CELLULAR
  description: >-
    Complex I normally routes the TNFR1 signal into NF-kappaB and MAPK activation,
    producing pro-inflammatory cytokines and promoting survival. In RIPK1-deficient
    cells both arms are blunted: MAPK activation and cytokine secretion are impaired.
    This is the immunodeficiency half of the disease.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: DECREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  - preferred_term: MAPK cascade
    modifier: DECREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: cytokine production
    modifier: DECREASED
    term:
      id: GO:0001816
      label: cytokine production
  cell_types:
  - preferred_term: patient-derived fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  downstream:
  - target: Defective T and B Cell Differentiation
    causal_link_type: DIRECT
    description: >-
      NF-kappaB signalling is required for lymphocyte development, and its reduction
      in these patients is accompanied by defective differentiation of both lineages.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        The reduced NF-kappaB activity and the differentiation defect are reported in
        the same patients, in that order.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
      kinase activation and cytokine secretion and were prone to necroptosis.
    explanation: Measures the MAPK and cytokine arms in patient cells.
- name: Defective T and B Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    Both lymphocyte lineages differentiate abnormally, which is the cellular basis
    of the lymphopenia and of the susceptibility to bacterial, viral and fungal
    organisms alike. A defect confined to one lineage would not produce that breadth.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Lymphopenia
    causal_link_type: DIRECT
  - target: Recurrent infections
    causal_link_type: DIRECT
    description: >-
      Defective differentiation of both lymphocyte lineages leaves the patient unable
      to mount adequate adaptive responses, which is the immunodeficiency the patients
      present with.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They had immunodeficiency with lymphopenia and altered production of various
        cytokines revealed by whole-blood assays.
      explanation: >-
        Ties the immunodeficiency and the lymphopenia together in the same patients.
  - target: Pneumonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Pneumonia is the commonest single infection recorded in the published cohort,
      in eight of fourteen patients, and it follows the lymphocyte differentiation
      defect by the ordinary route from immunodeficiency to lower respiratory tract
      infection. The intermediates are known in general terms and are not specific
      to this disease.
    evidence:
    - reference: PMID:34163478
      reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        | family 1 | P1 | Pakistan | M | 867_870delTTTA | Y289* | 1 mo. | LLLR | Y | N |
        N | Y | Y | N | N | N | bronchiectasis, HCMV, recurrent RI | HSCT | Died |
      explanation: >-
        Table 1, patient P1: the `Pneumonia` column reads Y. Pneumonia is recorded for
        eight of the fourteen recessive patients in that table (P1, P3, P5, P6, P9, P10,
        P11 and P14), counted column by column, which is the basis for the frequency
        band on the phenotype.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in RIPK1 were associated with reduced NF-κB activity, defective
      differentiation of T and B cells, increased inflammasome activity, and
      impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
    explanation: The differentiation defect in both lineages.
- name: Necroptosis Susceptibility
  biological_scale: CELLULAR
  description: >-
    RIPK1-deficient cells are prone to necroptosis. Necroptosis is lytic and
    releases intracellular contents, so a tissue whose cells die this way generates
    inflammation rather than being cleared quietly, which is one route by which the
    loss of a pro-survival signal produces an inflammatory phenotype.
  biological_processes:
  - preferred_term: necroptotic signaling pathway
    modifier: INCREASED
    term:
      id: GO:0097527
      label: necroptotic signaling pathway
  downstream:
  - target: Intestinal Epithelial Injury and Inflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intestinal epithelium is where the cell-death handling defect is
      demonstrated in these patients, and where the clinical consequence is most
      conspicuous. The intervening steps between the altered death response and the
      established colitis are not resolved in the cited work.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Locates the impaired cell-death response specifically in intestinal epithelial
        cells, which is what makes the gut the site of this edge.
  - target: Increased Inflammasome Activity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The necroptotic machinery is part of how the raised IL-1 beta output is
      produced, not merely a parallel consequence of the same lesion: blocking MLKL
      reduces IL-1 beta secretion in RIPK1-deficient cells, as does blocking NLRP3.
      That pharmacological result is what makes this an edge rather than two
      independent arms.
    evidence:
    - reference: PMID:34163478
      reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The altered IL-1β release has been associated with increased NLPR3 activity and
        MLKL-dependent necroptosis, based on evidence that inhibitors of NLRP3 or MLKL
        can reduce IL-1β secretion in LPS-stimulated RIPK1-deficient cell lines (BLaER1
        and THP1 cells)
      explanation: >-
        Both inhibitor arms are reported together, which is what licenses the direction
        of this edge. MLKL is the necroptosis executioner, so its inhibition reducing
        IL-1 beta places necroptosis upstream of the inflammasome output rather than
        beside it. The result is in cell lines, and the review is reporting it from the
        two primary papers.
      quote_role: REVIEW_SYNTHESIS
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
      kinase activation and cytokine secretion and were prone to necroptosis.
    explanation: The necroptosis susceptibility, measured in patient cells.
- name: Increased Inflammasome Activity
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: NLRP3 inflammasome complex assembly
    modifier: INCREASED
    term:
      id: GO:0044546
      label: NLRP3 inflammasome complex assembly
  description: >-
    Inflammasome activity is raised in RIPK1-deficient patients. This is the
    autoinflammatory half of the disease and the reason the entry is not simply an

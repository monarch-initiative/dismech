inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    IMD57 requires two defective RIPK1 alleles. Reported patients have been
    homozygous, several from consanguineous families. Heterozygous carriers are
    unaffected. The distinction from the dominant disease at the same locus is not
    one of dosage but of consequence: cleavage-resistant RIPK1 variants at Asp324
    act in the heterozygous state and cause a hyperinflammatory disease, not this one.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report four patients from three unrelated families with complete RIPK1
      deficiency caused by rare homozygous mutations.
    explanation: >-
      The founding cohort, establishing homozygous loss of function as the genotype.
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on eight patients from six unrelated pedigrees with biallelic
      loss-of-function mutations in RIPK1 presenting with primary immunodeficiency
      and/or intestinal inflammation.
    explanation: >-
      Independent replication in a second, larger series, with the same biallelic
      loss-of-function requirement.

discussions:
- discussion_id: ripk1_extraintestinal_features
  kind: KNOWLEDGE_GAP
  prompt: >-
    What produces the upper gastrointestinal, perianal and hepatosplenic features of
    RIPK1 deficiency, none of which the located mechanism reaches?
  attaches_to:
  - phenotypes#Esophagitis
  - phenotypes#Perianal disease
  - phenotypes#Hepatomegaly
  - phenotypes#Splenomegaly
  rationale: >-
    The entry's pathograph explains the disease through two arms: lost NF-kappaB and
    MAPK signalling producing the lymphocyte differentiation defect, and necroptosis
    plus inflammasome activity producing intestinal inflammation. The located
    mechanistic work places the cell-death defect specifically in intestinal epithelial
    cells. But the largest clinical series records esophagitis in four patients,
    gastritis in three, perianal disease in eight and hepatosplenomegaly in four, and
    none of those sites is intestinal epithelium. Either the epithelial death defect is
    not confined to the intestine, or a second mechanism is operating, or some of these
    are complications of treatment and of the infection burden rather than of the
    disease. The table cannot distinguish those, and no located source addresses it, so
    the phenotypes are recorded with no incoming edge rather than attached to the
    nearest plausible node.
- discussion_id: ripk1_inflammasome_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does loss of RIPK1 increase inflammasome activity, when the same
    loss reduces NF-kappaB signalling?
  attaches_to:
  - pathophysiology#Increased Inflammasome Activity
  rationale: >-
    This is the hinge of the disease. RIPK1 deficiency lowers one inflammatory output
    and raises another in the same patient, and an account of the disease that does
    not explain the second is incomplete. A non-canonical TLR4-TRIF-RIPK1-FADD-caspase-8
    axis has been proposed in review, but no located primary source demonstrates it in
    RIPK1-deficient human cells, so the causal edge in this entry is typed with unknown
    intermediates rather than as a mechanism.
- discussion_id: ripk1_arthritis_driver
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the progressive polyarthritis driven by the autoinflammatory arm, by the
    infection burden, or by both?
  attaches_to:
  - phenotypes#Arthritis
  rationale: >-
    The arthritis is attached to the inflammasome node in this entry because it is the
    autoinflammatory feature, but no located source establishes that. A patient with
    recurrent infections and a chronically inflamed gut has other routes to synovitis,
    and distinguishing them would change whether joint disease is expected to respond
    to correcting the haematopoietic compartment.
notes: >-
  Two things are worth keeping straight about this entry. The first is that RIPK1
  carries two named diseases, and they are not variants of one severity spectrum:
  biallelic loss of function gives this disease, while heterozygous variants that
  block caspase-8 cleavage at Asp324 give cleavage-resistant RIPK1-induced
  autoinflammatory syndrome, in which signalling is amplified rather than lost. An
  entry that treated them as one would have to assert two opposite functional
  consequences of the same gene.

  The second is the shape of the evidence. Almost every claim here rests on two
  patient series, and the mechanistic measurements in both were made in patient
  cells rather than in a model system, which is unusually favourable. What is thin
  is anything quantitative: no source located for this entry gives a frequency for
  any individual phenotype, a prevalence, or a natural history beyond the
  presentation. Frequency bands here are therefore reasoned from presence across the
  reported cohorts and say so in each phenotype's description, rather than being
  transcribed from a published denominator that does not exist.

  No GeneReviews chapter exists for this disease. `just check-genereviews` reports
  NO_CHAPTER against the committed Bookshelf index.

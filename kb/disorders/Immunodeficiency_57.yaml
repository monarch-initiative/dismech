  evidence:
  - reference: PMID:30591564
    reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in RIPK1 were associated with reduced NF-κB activity, defective
      differentiation of T and B cells, increased inflammasome activity, and
      impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
    explanation: The increased inflammasome activity.
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The inflammatory component of this disease is possibly related to the activation
      of NLRP3 inflammasome and high production of IL-1β cytokine
    explanation: >-
      Names the inflammasome as NLRP3 and the cytokine output as IL-1 beta, which is

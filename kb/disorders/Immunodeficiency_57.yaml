    Four patients from three families in the first report and eight patients from
    six pedigrees in the second, with further single cases since. No population
    prevalence has been estimated, and none of the located sources offers a
    denominator, so the ULTRA_RARE band rests on the published case count rather
    than on a measured rate.
  evidence:
  - reference: PMID:30026316

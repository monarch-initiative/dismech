genetic:
- name: RIPK1
  gene_term:
    preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  relationship_type: CAUSATIVE
  notes: >-
    Receptor-interacting serine/threonine kinase 1, on chromosome 6p25.2. Biallelic
    loss-of-function variants cause this disease. Heterozygous variants at the
    caspase-8 cleavage site Asp324 cause a different, dominantly inherited
    hyperinflammatory disease, so the same gene supports two diseases distinguished
    by zygosity and by the direction of the functional consequence. That second
    disease is not curated here and should not be folded into this entry.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RIPK1 (receptor-interacting serine/threonine kinase 1) is a master regulator of
      signaling pathways leading to inflammation and cell death and is of medical
      interest as a drug target.
    explanation: >-
      Identifies the gene product and its dual role in inflammation and cell death.
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This review discusses the molecular pathogenesis of RIPK1-deficiency and
      cleavage-resistant RIPK1 induced autoinflammatory (CRIA) disorders and
      summarizes the clinical manifestations of respective diseases to help with the
      identification of new patients.
    explanation: >-
      Sets the two RIPK1 diseases side by side, which is the basis for the warning in
      this entry's notes against conflating them.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Transplantation reversed the cytokine production defect and resolved clinical
    symptoms in one reported patient. Because RIPK1 is expressed well beyond the
    haematopoietic compartment, the fact that replacing that compartment alone was
    sufficient is itself a mechanistic result and not only a therapeutic one. The
    evidence base is a single patient.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Defective T and B Cell Differentiation
    description: >-
      Replacing the haematopoietic compartment supplies lymphoid progenitors with
      intact RIPK1.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hematopoietic stem cell transplantation reversed cytokine production defects
        and resolved clinical symptoms in one patient.
      explanation: >-
        The rescue, in a patient. It is one patient, which is why this entry does not
        state transplantation as established therapy.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hematopoietic stem cell transplantation reversed cytokine production defects
      and resolved clinical symptoms in one patient.
    explanation: The single reported transplant outcome.
discussions:
- discussion_id: ripk1_inflammasome_route
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what route does loss of RIPK1 increase inflammasome activity, when the same
    loss reduces NF-kappaB signalling?
  attaches_to:
  - pathophysiology#Increased Inflammasome Activity
  rationale: >-
    This is the hinge of the disease. RIPK1 deficiency lowers one inflammatory output
    and raises another in the same patient, and an account of the disease that does
    not explain the second is incomplete. A non-canonical TLR4-TRIF-RIPK1-FADD-caspase-8
    axis has been proposed in review, but no located primary source demonstrates it in
    RIPK1-deficient human cells, so the causal edge in this entry is typed with unknown
    intermediates rather than as a mechanism.
- discussion_id: ripk1_arthritis_driver
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the progressive polyarthritis driven by the autoinflammatory arm, by the
    infection burden, or by both?
  attaches_to:
  - phenotypes#Arthritis
  rationale: >-
    The arthritis is attached to the inflammasome node in this entry because it is the
    autoinflammatory feature, but no located source establishes that. A patient with
    recurrent infections and a chronically inflamed gut has other routes to synovitis,
    and distinguishing them would change whether joint disease is expected to respond
    to correcting the haematopoietic compartment.
notes: >-
  Two things are worth keeping straight about this entry. The first is that RIPK1
  carries two named diseases, and they are not variants of one severity spectrum:
  biallelic loss of function gives this disease, while heterozygous variants that
  block caspase-8 cleavage at Asp324 give cleavage-resistant RIPK1-induced
  autoinflammatory syndrome, in which signalling is amplified rather than lost. An
  entry that treated them as one would have to assert two opposite functional
  consequences of the same gene.

  The second is the shape of the evidence. Almost every claim here rests on two
  patient series, and the mechanistic measurements in both were made in patient
  cells rather than in a model system, which is unusually favourable. What is thin
  is anything quantitative: no source located for this entry gives a frequency for
  any individual phenotype, a prevalence, or a natural history beyond the
  presentation. Frequency bands here are therefore reasoned from presence across the
  reported cohorts and say so in each phenotype's description, rather than being
  transcribed from a published denominator that does not exist.

  No GeneReviews chapter exists for this disease. `just check-genereviews` reports
  NO_CHAPTER against the committed Bookshelf index.

      deficiency caused by rare homozygous mutations.
    explanation: The case count in the founding report.
progression:
- phase: Infantile onset
  notes: >-
    Presentation is in the first year of life, with recurrent infections and
    gastrointestinal inflammation. The arthritis is described as progressive rather
    than static, which is what separates the joint disease here from a transient
    post-infectious arthritis.
  evidence:
  - reference: PMID:30026316
    reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients suffered from recurrent infections, early-onset inflammatory
      bowel disease, and progressive polyarthritis.
    explanation: >-
      The presenting triad. "Early-onset" and "progressive" are the paper's own
      words for the timing.
pathophysiology:
- name: RIPK1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants abolish RIPK1 protein. RIPK1 is a 75.9 kDa
    protein with an N-terminal kinase domain, a C-terminal death domain and an
    intermediate domain carrying a RIP homotypic interaction motif, and it is
    recruited with TRADD to TNFR1 to form signalling complex I. Because the protein
    carries both a scaffolding role and a kinase role, its complete absence removes
    two opposing functions simultaneously, which is why the resulting disease is
    not simply a loss of inflammation or a gain of it.
  genes:
  - preferred_term: RIPK1
    term:
      id: hgnc:10019
      label: RIPK1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired NF-kappaB and MAPK Signalling
    causal_link_type: DIRECT
    description: >-
      RIPK1 is a component of complex I, whose ubiquitination provides the docking
      platform for the kinases that activate NF-kappaB and MAPK. Without RIPK1 that
      platform is not assembled.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Measures reduced NF-kappaB activity directly in patients carrying the
        mutations, which is the step this edge asserts.
  - target: Necroptosis Susceptibility
    causal_link_type: DIRECT
    description: >-
      Losing RIPK1 does not abolish cell death but redirects it. Patient cells were
      prone to necroptosis in vitro.
    evidence:
    - reference: PMID:30026316
      reference_title: Biallelic RIPK1 mutations in humans cause severe immunodeficiency, arthritis, and intestinal inflammation.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In vitro, RIPK1-deficient cells showed impaired mitogen-activated protein
        kinase activation and cytokine secretion and were prone to necroptosis.
      explanation: >-
        The necroptosis susceptibility is measured in the patients' own cells, so
        the edge is not inferred from a model system.
  - target: Increased Inflammasome Activity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inflammasome activity is increased rather than decreased in RIPK1-deficient
      patients. The route is not established: a non-canonical
      TLR4-TRIF-RIPK1-FADD-caspase-8 axis has been proposed, and this entry does not
      assert it.
    evidence:
    - reference: PMID:30591564
      reference_title: Human RIPK1 deficiency causes combined immunodeficiency and inflammatory bowel diseases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Mutations in RIPK1 were associated with reduced NF-κB activity, defective
        differentiation of T and B cells, increased inflammasome activity, and
        impaired response to TNFR1-mediated cell death in intestinal epithelial cells.
      explanation: >-
        Establishes that inflammasome activity rises, which is the claim; the same
        sentence says nothing about the route, which is why the link type is not DIRECT.
  evidence:
  - reference: PMID:34163478
    reference_title: RIPK1-Associated Inborn Errors of Innate Immunity.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      RIPK1 is a 75.9 kDa protein with an amino-terminal kinase domain (KD), a
      carboxy-terminal death domain (DD), and an intermediate domain (ID) in-between
      which contains a Rip homotypic interaction motif (RHIM).
    explanation: >-
      The domain architecture behind the dual scaffold/kinase role. This is the
      review's synthesis of established structural work, not its own result.
- name: Impaired NF-kappaB and MAPK Signalling
  biological_scale: CELLULAR
  description: >-
    Complex I normally routes the TNFR1 signal into NF-kappaB and MAPK activation,
    producing pro-inflammatory cytokines and promoting survival. In RIPK1-deficient
    cells both arms are blunted: MAPK activation and cytokine secretion are impaired.
    This is the immunodeficiency half of the disease.
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: DECREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  - preferred_term: MAPK cascade
    modifier: DECREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  - preferred_term: cytokine production

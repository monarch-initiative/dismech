    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients suffered from recurrent infections, early-onset inflammatory
      bowel disease, and progressive polyarthritis.
    explanation: Recurrent infection in all four patients of the founding cohort.
- category: Immunologic
  name: Lymphopenia
  description: >-
    Reduced lymphocyte counts accompany the differentiation defect. It is one of the

name: Hereditary Leiomyomatosis and Renal Cell Cancer
creation_date: "2026-08-23T00:00:00Z"
category: Mendelian
categories:
- Hereditary Cancer Syndrome
- Cancer Predisposition Syndrome
- Inborn Error of Metabolism
parents:
- hereditary cancer-predisposing syndrome
disease_term:
  preferred_term: hereditary leiomyomatosis and renal cell cancer
  term:
    id: MONDO:0007888
    label: hereditary leiomyomatosis and renal cell cancer
synonyms:
- HLRCC
- multiple cutaneous and uterine leiomyomatosis
- MCUL
- Reed syndrome
description: >-
  Hereditary leiomyomatosis and renal cell cancer (HLRCC) is an autosomal
  dominant cancer predisposition syndrome caused by germline loss-of-function
  variants in FH at 1q42-q43, encoding the tricarboxylic-acid-cycle enzyme
  fumarate hydratase. Carriers develop multiple cutaneous leiomyomas and, in
  women, early and numerous uterine leiomyomas; a subset develop an aggressive
  type 2 papillary or collecting-duct renal cell carcinoma that metastasizes at
  small primary size and dominates prognosis. HLRCC is the clearest human example
  of a metabolic enzyme acting as a classical tumor suppressor: the germline
  allele is heterozygous, tumors show loss of the wild-type allele, and measured
  fumarate hydratase activity is very low or absent in tumor tissue. What makes
  the syndrome mechanistically distinctive is that the oncogenic signal is the
  accumulated substrate rather than the energetic deficit. Fumarate builds up to
  concentrations at which it competitively inhibits the 2-oxoglutarate-dependent
  dioxygenase superfamily — stabilizing hypoxia-inducible factor in normoxia
  ("pseudohypoxia") and blocking TET- and Jumonji-mediated demethylation — and,
  uniquely among the oncometabolites, additionally reacts covalently with
  cysteine thiols, succinating KEAP1 and de-repressing NRF2 antioxidant
  signalling. The same FH gene has a second, entirely different phenotype in the
  biallelic state: homozygous or compound heterozygous FH mutation causes
  recessive fumarate hydratase deficiency, a severe infantile encephalopathy, so
  the number of damaged alleles inherited determines which of two unrelated
  diseases results.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    HLRCC segregates as an autosomal dominant tumor predisposition. Cutaneous and
    uterine leiomyomas are highly penetrant; renal cell carcinoma affects a
    minority of carriers but accounts for most of the mortality. The contrast
    with the recessive disorder caused by biallelic FH mutation is instructive
    and is stated explicitly in the original mapping paper.
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, heterozygous and homozygous or compound heterozygous mutants have
      very different clinical phenotypes.
    explanation: >-
      States the dose-dependent divergence between the dominant tumor
      predisposition and the recessive metabolic disease, which is the
      inheritance claim made here.
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual with FH tumor predisposition syndrome has a
      50% chance of inheriting the FH pathogenic variant.
    explanation: >-
      GeneReviews Genetic Counseling section: the transmission risk to
      offspring. Evidence source is OTHER because GeneReviews is an
      expert-authored review rather than a primary study.
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is not possible to precisely predict the likelihood of manifestations,
      age of onset, severity and type of features, or rate of disease
      progression in offspring who inherit the FH pathogenic variant.
    explanation: >-
      GeneReviews Genetic Counseling section, and the direct basis for the
      VARIABLE expressivity and INCOMPLETE penetrance recorded here — the source
      states explicitly that outcome in a carrier is not predictable.
pathophysiology:
- name: Germline FH First-Hit Inactivation
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  description: >-
    A heterozygous loss-of-function variant in FH is present constitutionally.
    Leiomyomatosis-associated alleles are predicted to produce absent or
    truncated protein, or to substitute or delete highly conserved residues, and
    fumarate hydratase activity is already measurably reduced in lymphoblastoid
    cells from carriers — so the heterozygous state is not biochemically silent
    even though it is clinically a susceptibility rather than a disease.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: FH
    modifier: DECREASED
    term:
      id: hgnc:3700
      label: FH
  genetic_context:
    gene:
      preferred_term: FH
      term:
        id: hgnc:3700
        label: FH
    variant_origin: GERMLINE
    allelic_hit_role: FIRST_HIT
    allelic_events:
    - PATHOGENIC_VARIANT
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous FH loss of function; alleles predict absent or
      truncated protein or substitution of highly conserved residues.
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leiomyomatosis-associated mutations are predicted to result in absent or
      truncated protein, or substitutions or deletions of highly conserved amino
      acids.
    explanation: >-
      Characterizes the germline allelic spectrum that constitutes the first hit.
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Activity of fumarate hydratase is reduced in lymphoblastoid cells from
      individuals with leiomyomatosis.
    explanation: >-
      Demonstrates measurable enzyme reduction in the constitutional
      heterozygous state, supporting the claim that heterozygosity is not
      biochemically silent.
  downstream:
  - target: Somatic FH Second-Hit Inactivation and Biallelic Loss
    description: >-
      A somatic event removing the wild-type allele is required before enzyme
      activity falls low enough for fumarate to accumulate to signalling
      concentrations.

- name: Somatic FH Second-Hit Inactivation and Biallelic Loss
  conforms_to: "germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in a Susceptible Cell"
  description: >-
    Tumors in FH carriers predominantly show functional inactivation of the
    retained wild-type allele, and measured fumarate hydratase activity in tumor
    tissue is very low or absent — the biallelic state that distinguishes tumor
    from surrounding carrier tissue. This is the node at which HLRCC hands over
    from the inherited-predisposition mechanism to the oncometabolite mechanism:
    only in the biallelic cell does fumarate reach the concentrations at which it
    acts as a signalling molecule.
  role: central_effector
  biological_scale: CELLULAR
  genetic_context:
    gene:
      preferred_term: FH
      term:
        id: hgnc:3700
        label: FH
    variant_origin: GERMLINE_AND_SOMATIC
    allelic_hit_role: BIALLELIC_INACTIVATION
    allelic_events:
    - LOSS_OF_HETEROZYGOSITY
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Combined inherited and acquired inactivation leaving the tumor cell without
      functional fumarate hydratase.
  molecular_functions:
  - preferred_term: fumarate hydratase activity
    term:
      id: GO:0004333
      label: fumarate hydratase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These tumors predominantly exhibit functional inactivation of the
      remaining wild-type allele, implicating FH inactivation as a
      tumor-promoting event.
    explanation: >-
      Direct evidence for the second hit and the resulting biallelic state in
      human FH-associated renal cancer.
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This enzyme acts as a tumor suppressor in familial leiomyomata, and its
      measured activity is very low or absent in tumors from individuals with
      leiomyomatosis.
    explanation: >-
      Confirms near-complete loss of enzyme activity in tumor as opposed to
      carrier tissue.
  downstream:
  - target: Fumarate Accumulation
    description: >-
      With the enzyme absent, its substrate accumulates to concentrations orders
      of magnitude above physiological.

- name: Fumarate Accumulation
  conforms_to: "oncometabolite_dioxygenase_inhibition#Oncometabolite Accumulation"
  description: >-
    Fumarate, the substrate of the missing enzyme, accumulates within the
    FH-null cell. It is a structural analogue of 2-oxoglutarate and, at these
    concentrations, competes with it; it is also an electrophile that reacts with
    cysteine thiols. Both properties are exploited downstream, and they are
    chemically independent of each other.
  role: amplifier
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that FH inhibition, together with elevated intracellular
      fumarate, coincides with HIF upregulation.
    explanation: >-
      Establishes elevated intracellular fumarate as the consequence of enzyme
      loss and links it to the downstream signalling readout.
  downstream:
  - target: Fumarate-Mediated Dioxygenase Inhibition
    description: >-
      Accumulated fumarate competes with 2-oxoglutarate at the active site of
      the dioxygenase superfamily.
  - target: KEAP1 Succination and NRF2 Activation
    description: >-
      Fumarate additionally succinates cysteine residues, a covalent
      modification unrelated to its competitive inhibition.

- name: Fumarate-Mediated Dioxygenase Inhibition
  conforms_to: "oncometabolite_dioxygenase_inhibition#Competitive Inhibition of 2-Oxoglutarate-Dependent Dioxygenases"
  description: >-
    Fumarate acts as a competitive inhibitor of the HIF prolyl hydroxylases and,
    by the same active-site competition, of other 2-oxoglutarate-dependent
    dioxygenases including the TET 5-methylcytosine hydroxylases and Jumonji
    histone demethylases. This is the rate-limiting signalling step of the
    oncometabolite mechanism in HLRCC.
  role: central_effector
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: 2-oxoglutarate-dependent dioxygenase activity
    term:
      id: GO:0016706
      label: 2-oxoglutarate-dependent dioxygenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Further, we show that fumarate acts as a competitive inhibitor of HPH.
    explanation: >-
      The direct biochemical demonstration of competitive inhibition that
      defines this node.
  downstream:
  - target: Pseudohypoxic HIF Stabilization in FH-Null Cells
    description: >-
      Loss of prolyl hydroxylation prevents VHL-dependent degradation of
      HIF-alpha under normal oxygen tension.
    hypothesis_groups:
    - hif_pseudohypoxia_driver

- name: Pseudohypoxic HIF Stabilization in FH-Null Cells
  conforms_to: "oncometabolite_dioxygenase_inhibition#Pseudohypoxic HIF Stabilization"
  description: >-
    Unhydroxylated HIF-alpha escapes VHL recognition and accumulates in normoxia,
    driving the hypoxia transcriptional programme. HIF overexpression correlates
    with biallelic FH loss in human renal cancer. Whether this is the
    transforming event or an accompanying marker is genuinely unsettled, and this
    entry curates it as one of two competing readings rather than as the
    mechanism.
  role: effector
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cellular response to decreased oxygen levels
    term:
      id: GO:0036294
      label: cellular response to decreased oxygen levels
    modifier: INCREASED
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with hemizygous germline fumarate hydratase (FH) mutations are
      predisposed to renal cancer.
    explanation: >-
      Anchors the pseudohypoxia observation to the human renal cancer
      predisposition this entry describes.
  downstream:
  - target: Leiomyomatosis and Aggressive Renal Cell Carcinoma
    description: >-
      Constitutive hypoxia-response transcription supports the vascular and
      metabolic phenotype of the resulting tumors.

- name: KEAP1 Succination and NRF2 Activation
  conforms_to: "oncometabolite_dioxygenase_inhibition#KEAP1 Succination and NRF2 Antioxidant Pathway Activation"
  description: >-
    Fumarate covalently modifies cysteine residues on KEAP1 to form
    S-(2-succinyl)cysteine, abrogating KEAP1's ability to repress NRF2 and
    leaving the antioxidant transcriptional programme constitutively active.
    Mouse genetics places this branch outside the HIF axis: Fh1-associated renal
    cyst formation is HIF-independent, and deleting Hif-1alpha exacerbated rather
    than prevented cysts. This is a model-derived claim and is marked as such.
  role: adaptive_escape
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mechanistic analysis revealed that fumarate modifies cysteine residues
      within the Kelch-like ECH-associated protein 1 (KEAP1), abrogating its
      ability to repress the Nuclear factor (erythroid-derived 2)-like 2
      (Nrf2)-mediated antioxidant response pathway, suggesting a role for Nrf2
      dysregulation in FH-associated cysts and tumors.
    explanation: >-
      Establishes the succination branch and its NRF2 output in an Fh1-deficient
      mouse. Evidence source is MODEL_ORGANISM; the human equivalence is an open
      question recorded in this entry's discussions.
  downstream:
  - target: Leiomyomatosis and Aggressive Renal Cell Carcinoma
    description: >-
      Constitutive antioxidant signalling supports survival of FH-null cells.
    hypothesis_groups:
    - nrf2_succination_driver

- name: Leiomyomatosis and Aggressive Renal Cell Carcinoma
  conforms_to: "germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor Spectrum"
  description: >-
    The clinical output: multiple cutaneous leiomyomas, early and numerous
    uterine leiomyomas often leading to hysterectomy in the third or fourth
    decade, and — in a minority of carriers — a type 2 papillary or
    collecting-duct renal cell carcinoma notable for metastasizing while the
    primary is still small. The multiplicity of the leiomyomas is the signature
    of independent second hits across a primed tissue; the renal tumor is rarer
    because fewer renal cells complete the second hit, but it determines
    prognosis.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously mapped a gene that predisposes to multiple fibroids,
      cutaneous leiomyomata and renal cell carcinoma to chromosome 1q42.3-q43
      (refs 4-6).
    explanation: >-
      Defines the three-component tumor spectrum of the syndrome as originally
      mapped.
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hereditary leiomyomatosis and renal cell carcinoma (HLRCC) is an inherited
      cancer syndrome in which affected individuals are at risk of developing
      benign cutaneous and uterine leiomyomas, renal cysts, and aggressive
      collecting duct and Type 2 papillary renal cell carcinomas (pRCC)
    explanation: >-
      Documents the renal histology and its aggressiveness. Evidence source is
      OTHER because this sentence is the paper's introductory characterization of
      the syndrome rather than its own experimental result.

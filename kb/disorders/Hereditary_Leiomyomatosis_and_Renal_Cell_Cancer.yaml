genetic:
- name: FH
  gene_term:
    preferred_term: FH
    term:
      id: hgnc:3700
      label: FH
  relationship_type: CAUSATIVE
  notes: >-
    FH at 1q42.3-q43 encodes fumarate hydratase. Heterozygous germline
    loss-of-function variants cause HLRCC; biallelic germline variants instead
    cause the recessive metabolic disease fumarate hydratase deficiency.
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in FH also occur in the recessive condition fumarate hydratase
      deficiency, and some parents of people with this condition are susceptible
      to leiomyomata.
    explanation: >-
      Documents the allelic relationship between the dominant tumor syndrome and
      the recessive metabolic disease at the same locus.
discussions:
- discussion_id: hlrcc_human_model_fidelity_of_nrf2_branch
  prompt: >-
    Does the HIF-independent, KEAP1-succination/NRF2 mechanism established in
    Fh1-deficient mouse kidney account for tumorigenesis in human HLRCC, where
    HIF overexpression is the observed correlate of biallelic FH loss?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#KEAP1 Succination and NRF2 Activation
  - pathophysiology#Pseudohypoxic HIF Stabilization in FH-Null Cells
  rationale: >-
    The two branches point in different therapeutic directions and the evidence
    for them is of different kinds. The human evidence is observational — HIF
    overexpression correlates with biallelic FH loss in human renal cancer — and
    supports the pseudohypoxia reading. The evidence that removes HIF from the
    causal path is genetic but murine: Fh1-associated cyst formation proceeds
    without HIF, and deleting Hif-1alpha made cysts worse. Neither result
    settles the human case, and a correlation in human tumors cannot
    discriminate driver from marker. Curators should not present either branch
    as the established human mechanism, and should keep the model-derived claim
    tagged MODEL_ORGANISM.
  proposed_experiments:
  - experiment_id: succination_versus_hif_in_human_hlrcc_tumors
    name: Succination burden versus HIF target output in matched human HLRCC tumors
    description: >-
      Quantify S-(2-succinyl)cysteine burden, NRF2 target-gene output and HIF
      target-gene output in the same human HLRCC renal tumors and matched
      leiomyomas, testing whether one branch tracks tumor grade and behaviour
      while the other does not.
mechanistic_hypotheses:
- hypothesis_group_id: hif_pseudohypoxia_driver
  hypothesis_label: Pseudohypoxic HIF Activation Drives FH-Deficient Tumorigenesis
  status: CANONICAL
  description: >-
    The long-standing reading of HLRCC: competitive inhibition of the HIF prolyl
    hydroxylases by accumulated fumarate stabilizes HIF in normoxia, and the
    resulting constitutive hypoxia programme is what transforms the FH-null
    cell. The human evidence for this arm is observational — HIF overexpression
    correlates with biallelic FH loss in HLRCC-associated renal cancer.
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that FH inhibition, together with elevated intracellular
      fumarate, coincides with HIF upregulation.
    explanation: >-
      The human tumor observation on which the pseudohypoxia-driver reading of
      HLRCC rests.
- hypothesis_group_id: nrf2_succination_driver
  hypothesis_label: KEAP1 Succination and NRF2 Dysregulation Drives FH-Deficient Tumorigenesis
  status: ALTERNATIVE
  description: >-
    The competing reading, specific to the fumarate lesion: the transforming
    event is covalent succination of KEAP1 and consequent constitutive NRF2
    antioxidant signalling, not HIF stabilization. Mouse genetics is the
    strongest evidence and it removes HIF from the causal path — Fh1-associated
    renal cyst formation proceeds without HIF, and deleting Hif-1alpha made
    cysts worse rather than better. This entry does not adjudicate between the
    two readings; see the HUMAN_MODEL_MISMATCH discussion below.
  evidence:
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a mouse model, we provide genetic evidence that Fh1-associated cyst
      formation is Hif independent, as is striking upregulation of antioxidant
      signaling pathways revealed by gene expression profiling.
    explanation: >-
      Genetic evidence placing cyst formation outside the HIF axis, which is
      what makes this an alternative to rather than a complement of the
      pseudohypoxia reading. Evidence source is MODEL_ORGANISM.

  name: Multiple Cutaneous Leiomyomas
  description: >-
    Multiple firm skin-coloured to brown papules and nodules arising from arrector
    pili smooth muscle, often painful and frequently the first sign of the
    syndrome.
  phenotype_term:
    preferred_term: Multiple cutaneous leiomyomas
    term:
      id: HP:0007437
      label: Multiple cutaneous leiomyomas
  evidence:

genetic:
- name: FH
  gene_term:
    preferred_term: FH
    term:
      id: hgnc:3700
      label: FH
  relationship_type: CAUSATIVE
  notes: >-
    FH at 1q42.3-q43 encodes fumarate hydratase. Heterozygous germline
    loss-of-function variants cause HLRCC; biallelic germline variants instead
    cause the recessive metabolic disease fumarate hydratase deficiency.
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in FH also occur in the recessive condition fumarate hydratase
      deficiency, and some parents of people with this condition are susceptible
      to leiomyomata.
    explanation: >-
      Documents the allelic relationship between the dominant tumor syndrome and
      the recessive metabolic disease at the same locus.
discussions:
- discussion_id: hlrcc_human_model_fidelity_of_nrf2_branch
  prompt: >-
    Does the HIF-independent, KEAP1-succination/NRF2 mechanism established in
    Fh1-deficient mouse kidney account for tumorigenesis in human HLRCC, where
    HIF overexpression is the observed correlate of biallelic FH loss?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#KEAP1 Succination and NRF2 Activation
  - pathophysiology#Pseudohypoxic HIF Stabilization in FH-Null Cells
  rationale: >-
    The two branches point in different therapeutic directions and the evidence
    for them is of different kinds. The human evidence is observational — HIF
    overexpression correlates with biallelic FH loss in human renal cancer — and
    supports the pseudohypoxia reading. The evidence that removes HIF from the
    causal path is genetic but murine: Fh1-associated cyst formation proceeds
    without HIF, and deleting Hif-1alpha made cysts worse. Neither result
    settles the human case, and a correlation in human tumors cannot
    discriminate driver from marker. Curators should not present either branch
    as the established human mechanism, and should keep the model-derived claim
    tagged MODEL_ORGANISM.
  proposed_experiments:
  - experiment_id: succination_versus_hif_in_human_hlrcc_tumors
    name: Succination burden versus HIF target output in matched human HLRCC tumors
    description: >-
      Quantify S-(2-succinyl)cysteine burden, NRF2 target-gene output and HIF
      target-gene output in the same human HLRCC renal tumors and matched
      leiomyomas, testing whether one branch tracks tumor grade and behaviour
      while the other does not.
treatments:
- name: Systemic Therapy for FH-Deficient Renal Cell Carcinoma
  description: >-
    The renal tumor is the arm that determines prognosis, and it is managed
    differently from sporadic renal cell carcinoma. Beyond surgery, GeneReviews
    names two systemic combinations as potentially beneficial: erlotinib plus
    bevacizumab, and cabozantinib plus nivolumab. The erlotinib/bevacizumab
    pairing is mechanistically coherent with this entry's pathophysiology — an
    anti-VEGF antibody targeting the pseudohypoxic, HIF-driven angiogenic output
    of the FH-null cell, combined with EGFR blockade. Note the source's own
    hedging ("may be beneficial"); this is not curated as established efficacy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: erlotinib
      term:
        id: NCIT:C65530
        label: Erlotinib
    - preferred_term: bevacizumab
      term:
        id: NCIT:C2039
        label: Bevacizumab
  target_mechanisms:
  - target: Pseudohypoxic HIF Stabilization in FH-Null Cells
    treatment_effect: INHIBITS
    description: >-
      Bevacizumab neutralizes VEGF, the principal angiogenic output of the
      stabilized HIF complex, acting downstream of the untreatable metabolic
      lesion rather than on it. This targets the pseudohypoxia branch
      specifically and is therefore contingent on that branch being the driver —
      an open question recorded in this entry's mechanistic_hypotheses.
  evidence:
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, treatment with erlotinib plus bevacizumab or cabozantinib
      plus nivolumab may be beneficial for kidney tumors.
    explanation: >-
      GeneReviews Management section, naming both systemic combinations. The
      hedged "may be beneficial" is preserved rather than upgraded.
- name: Renal Surveillance and Surgery
  notes: >-
    Curated under `treatments:` as a management intervention, not as a claim
    that imaging or biochemistry is itself therapeutic. In a two-hit
    predisposition syndrome the second hit cannot be prevented, so the only
    available lever is stage at detection: surveillance is the intervention
    that converts an unavoidable tumor into a resectable one. Where a
    `target_mechanisms` link is present it points at the clinical-outcome node
    for that reason, and never at an upstream mechanistic node.
  description: >-
    Because the renal tumor metastasizes at small size, surveillance is annual
    thin-slice MRI from childhood rather than symptom-triggered imaging, and
    surgery uses wide margins. Referral to a surgeon familiar with the syndrome
    is specified, reflecting that nephron-sparing norms for sporadic renal
    tumors do not transfer here.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Nephrectomy
    term:
      id: NCIT:C15284
      label: Nephrectomy
  target_mechanisms:
  - target: Leiomyomatosis and Aggressive Renal Cell Carcinoma
    treatment_effect: INHIBITS
    description: >-
      Surveillance and wide-margin resection act on the consequence node by
      detecting and removing the renal tumor before dissemination; they do not
      alter the germline lesion or prevent further second hits.
  evidence:
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      annual MRI with 1- to 3-mm slices through the kidneys from age eight
      years; prompt follow up for suspicious renal lesions
    explanation: >-
      GeneReviews Management section, giving the surveillance modality, slice
      thickness and starting age. The unusually early start and fine slices
      follow directly from the tumor metastasizing while small.
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Total or partial nephrectomy with wide margins may be carefully considered
      in some settings.
    explanation: >-
      GeneReviews Management section on the surgical approach. The wide-margin
      qualifier distinguishes this from standard nephron-sparing surgery for
      sporadic renal tumors.
- name: Symptomatic Management of Cutaneous and Uterine Leiomyomas
  description: >-
    The benign lesions are treated for symptom burden rather than cancer risk:
    cutaneous leiomyomas by excision or ablation with pharmacological options
    for the characteristic pain, and uterine fibroids medically or surgically.
    GeneReviews attaches an important caveat to fibroid surgery — histology must
    distinguish atypical smooth muscle neoplasm from leiomyosarcoma.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of cutaneous leiomyomas can include surgical excision, carbon
      dioxide laser, cryotherapy, or electrodessication.
    explanation: >-
      GeneReviews Management section, listing the cutaneous treatment options.
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      histologic examination to differentiate between atypical smooth muscle
      neoplasm and leiomyosarcoma should be performed in those undergoing
      surgery
    explanation: >-
      GeneReviews Management section. This is a safety caveat rather than a
      treatment: fibroid surgery in an FH carrier must not assume the lesion is
      benign.
diagnosis:
- name: Molecular Genetic Testing for Heterozygous FH Variants
  description: >-
    The diagnosis is established by identifying a heterozygous germline FH
    pathogenic variant. The zygosity in that sentence is load-bearing: a
    heterozygous variant establishes this tumor predisposition syndrome, whereas
    biallelic FH variants cause the recessive metabolic disease fumarate
    hydratase deficiency, which is a different disorder with a different
    GeneReviews chapter.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous germline pathogenic FH variant establishes the diagnosis and
    makes at-risk relatives eligible for predictive testing and early renal
    surveillance.
  evidence:
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis of FH tumor predisposition syndrome is established in a proband
      with a heterozygous pathogenic variant in FH identified by molecular
      genetic testing.
    explanation: >-
      GeneReviews Diagnosis/Testing section, stating the confirmatory test and
      the heterozygous zygosity that separates this syndrome from recessive
      fumarate hydratase deficiency.
- name: Predictive Testing of At-Risk Relatives
  description: >-
    Cascade testing is framed by GeneReviews as serving two purposes: starting
    surveillance early in carriers, and sparing non-carriers the cost and burden
    of lifelong renal imaging.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identifies which at-risk relatives require early renal surveillance and
    which can be discharged from it.
  evidence:
  - reference: PMID:20301430
    reference_title: "FH Tumor Predisposition Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is appropriate to clarify the genetic status of apparently
      asymptomatic at-risk relatives of an affected individual by molecular
      genetic testing for the familial FH pathogenic variant in order to
      identify as early as possible those who would benefit from early
      surveillance and treatment and to reduce costly screening procedures in
      those who have not inherited the pathogenic variant.
    explanation: >-
      GeneReviews Evaluation of Relatives at Risk, giving both the case for
      cascade testing and the de-escalation rationale for non-carriers.
mechanistic_hypotheses:
- hypothesis_group_id: hif_pseudohypoxia_driver
  hypothesis_label: Pseudohypoxic HIF Activation Drives FH-Deficient Tumorigenesis
  status: CANONICAL
  description: >-
    The long-standing reading of HLRCC: competitive inhibition of the HIF prolyl
    hydroxylases by accumulated fumarate stabilizes HIF in normoxia, and the
    resulting constitutive hypoxia programme is what transforms the FH-null
    cell. The human evidence for this arm is observational — HIF overexpression
    correlates with biallelic FH loss in HLRCC-associated renal cancer.
  evidence:
  - reference: PMID:16098467
    reference_title: "HIF overexpression correlates with biallelic loss of fumarate hydratase in renal cancer: novel role of fumarate in regulation of HIF stability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that FH inhibition, together with elevated intracellular
      fumarate, coincides with HIF upregulation.
    explanation: >-
      The human tumor observation on which the pseudohypoxia-driver reading of
      HLRCC rests.
- hypothesis_group_id: nrf2_succination_driver
  hypothesis_label: KEAP1 Succination and NRF2 Dysregulation Drives FH-Deficient Tumorigenesis
  status: ALTERNATIVE
  description: >-
    The competing reading, specific to the fumarate lesion: the transforming
    event is covalent succination of KEAP1 and consequent constitutive NRF2
    antioxidant signalling, not HIF stabilization. Mouse genetics is the
    strongest evidence and it removes HIF from the causal path — Fh1-associated
    renal cyst formation proceeds without HIF, and deleting Hif-1alpha made
    cysts worse rather than better. This entry does not adjudicate between the
    two readings; see the HUMAN_MODEL_MISMATCH discussion below.
  evidence:
  - reference: PMID:22014577
    reference_title: "Renal cyst formation in Fh1-deficient mice is independent of the Hif/Phd pathway: roles for fumarate in KEAP1 succination and Nrf2 signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using a mouse model, we provide genetic evidence that Fh1-associated cyst
      formation is Hif independent, as is striking upregulation of antioxidant
      signaling pathways revealed by gene expression profiling.
    explanation: >-
      Genetic evidence placing cyst formation outside the HIF axis, which is
      what makes this an alternative to rather than a complement of the
      pseudohypoxia reading. Evidence source is MODEL_ORGANISM.

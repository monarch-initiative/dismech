    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Constitutional heterozygous FH loss of function; alleles predict absent or
      truncated protein or substitution of highly conserved residues.
  evidence:
  - reference: PMID:11865300
    reference_title: "Germline mutations in FH predispose to dominantly inherited uterine fibroids, skin leiomyomata and papillary renal cell cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Leiomyomatosis-associated mutations are predicted to result in absent or

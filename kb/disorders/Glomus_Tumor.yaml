- name: Glomus Cell Proliferation Around Distorted Vascular Channels
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Whichever driver lesion is present, the tumor is formed by clonal expansion
    of glomus cells, the modified perivascular smooth muscle cells of the
    thermoregulatory glomus body. Immunohistochemical expression of smoothelin
    confirms that these cells are genuinely contractile smooth muscle cells. The
    proliferating cells form solid nests and concentric cuffs around branching,
    ectatic vascular spaces, replacing the normal Sucquet-Hoyer canal
    architecture of the arteriovenous anastomosis, and deposit a continuous
    pericellular type IV collagen basement membrane that reflects their retained
    myoid phenotype.
  cell_types:
  - preferred_term: glomus cell (modified perivascular smooth muscle cell)
    term:
      id: CL:0000192
      label: smooth muscle cell
  - preferred_term: pericyte

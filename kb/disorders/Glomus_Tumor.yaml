- name: Solid Glomus Tumor
  display_name: Solid Glomus Tumor
  description: >-
    The most common histologic variant, characterized by nests and sheets of
    uniform glomus cells with relatively inconspicuous vasculature. Typically
    solitary, subungual, and painful.
  evidence:

  evidence:
  - reference: PMID:41693210
    reference_title: The Molecular Mechanism and Therapeutic Progress in Glomus Tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key discoveries include frequent inactivating mutations in the NF1 gene,
      leading to constitutive RAS/MAPK pathway activation, and recurrent
      "MIR143-NOTCH" gene fusions disrupting Notch signaling
    explanation: >-
      Establishes constitutive RAS/MAPK activation, alongside NOTCH fusion, as a
      recurrent oncogenic driver mechanism in glomus tumor.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      half of the GT showing NOTCH-gene fusions and a smaller subset BRAF V600E
      mutations
    explanation: >-
      Documents BRAF V600E as the alternative driver in a smaller subset of
      glomus tumors.
  - reference: PMID:40976119
    reference_title: Mutational landscape of glomus tumor and clinical application of genomic profiling based on next-generation sequencing technology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathway enrichment analysis revealed KRAS mutations were predominant in
      distal GT, while BRAF V600E mutations were more prevalent in proximal
      locations.
    explanation: >-
      Next-generation sequencing of 44 tumors shows anatomically stratified
      RAS-MAPK pathway lesions in glomus tumor.
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No abnormalities in NF1 or RAS mitogen-activated protein kinase activation
      were found in sporadic glomus tumors.
    explanation: >-
      A stated negative result, encoded as REFUTE rather than PARTIAL because
      that is what it is. It refutes one specific sub-claim of this node - that
      the NF1/neurofibromin route to RAS-MAPK activation operates in sporadic
      glomus tumors - while leaving the node itself standing, since the sporadic
      RAS-MAPK arm is entered through somatic BRAF V600E and KRAS
      (PMID:40976119) rather than through NF1. Read together with the NF1
      Biallelic Inactivation node, this item is what makes the syndromic and
      sporadic routes into the shared mitogenic node genuinely distinct rather
      than a single mechanism asserted twice.
  downstream:
  - target: Glomus Cell Proliferation Around Distorted Vascular Channels
    description: >-
      Sustained MEK-ERK output provides a fusion-independent proliferative drive
      in RAS-MAPK-altered glomus tumors.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

name: Glomus Tumor
creation_date: '2026-07-31T00:00:00Z'
description: >-
  Glomus tumor is a rare, usually benign pericytic (perivascular) mesenchymal
  neoplasm composed of cells that recapitulate the modified smooth muscle cells
  of the glomus body, a specialized arteriovenous anastomosis of the dermis that
  participates in thermoregulation. Most lesions are small, solitary, and arise
  in the distal extremities, classically in the subungual nail bed, where they
  produce the diagnostic clinical triad of severe paroxysmal pain, cold
  hypersensitivity, and exquisite pinpoint tenderness. The disease is not
  confined to skin: deep soft tissue and visceral tumors also occur, most
  characteristically in the gastric wall, where the lesion is the same entity
  histologically and immunophenotypically but presents as a submucosal antral
  mass or with gastrointestinal bleeding rather than with the acral pain triad.
  Histologically the tumor consists of sheets and nests of uniform, round,
  "punched-out" glomus cells with sharply defined cell borders arranged
  concentrically around branching, distorted vascular channels. The
  immunophenotype is that of a contractile
  modified smooth muscle cell: diffuse smooth muscle actin and h-caldesmon
  positivity with pericellular type IV collagen, and negativity for S100 protein
  and cytokeratin, with desmin only variably expressed. Recurrent
  MIR143::NOTCH gene-family fusions (MIR143 juxtaposed to NOTCH1, NOTCH2, or
  NOTCH3) are found in over half of glomus tumors and are the characteristic
  somatic driver; a separate subset carries activating BRAF V600E or NF1/RAS
  pathway lesions that converge on constitutive RAS-MAPK signaling. Notably, the
  common subungual tumors are largely fusion-negative, implying a still-undefined
  alternative pathogenesis. A familial multiple form, glomuvenous malformation
  (familial glomangioma), is caused by germline loss-of-function variants in GLMN
  (glomulin) acting through a paradominant two-hit mechanism, most often
  completed by somatic acquired uniparental isodisomy of chromosome 1p.
  Malignant glomus tumors are rare and defined morphologically by deep location
  with size greater than 2 cm, atypical mitotic figures, or moderate-to-high
  nuclear grade with brisk mitotic activity. Complete surgical excision is
  curative for benign lesions and produces prompt, durable relief of pain.
categories:
- Rare Cancer
- Soft Tissue Tumor
parents:
- pericytic neoplasm
- soft tissue neoplasm

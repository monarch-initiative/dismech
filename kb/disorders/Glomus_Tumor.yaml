        Overall NOTCH2 gene rearrangements were identified in 52% of GT,
        including all malignant cases
      explanation: >-
        The fusion is present in the majority of tumors and in every malignant
        case, consistent with it driving the proliferating tumor population.
- name: Constitutive Mitogenic Pathway Activation
  biological_scale: MOLECULAR
  role: central_effector
  description: >-
    A separate, largely fusion-independent subset of glomus tumors carries
    activating lesions of the RAS-MAPK axis. Inactivating NF1 mutations remove
    RAS-GAP restraint and produce constitutive RAS/MAPK signaling; activating
    BRAF p.Val600Glu signals independently of upstream RAS; and KRAS mutations
    occur predominantly in distal tumors while BRAF V600E is enriched in
    proximal ones. All converge on sustained MEK-ERK output, providing an
    alternative mitogenic drive to glomus cell proliferation and a rationale for
    BRAF and MEK inhibition in advanced disease.
  conforms_to: sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation

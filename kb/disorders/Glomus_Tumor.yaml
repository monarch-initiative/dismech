- name: Nociceptor-Rich and Mast-Cell-Rich Tumor Stroma
  biological_scale: TISSUE
  role: mediator
  description: >-
    Glomus tumors are unusually densely innervated: numerous unmyelinated
    nociceptive nerve fibers ramify among the tumor cells, and the stroma
    contains abundant mast cells that show ultrastructural evidence of
    degranulation in close apposition to those fibers. Release of histamine and
    other algogenic granule contents onto adjacent nociceptors, together with
    pressure transmitted by contraction of the smooth-muscle-like tumor cells
    within a confined subungual compartment, accounts for the disproportionate
    severity of pain relative to lesion size.

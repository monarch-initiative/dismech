- name: Glomuvenous Malformation
  display_name: Glomuvenous Malformation (Familial Multiple Glomangioma)
  description: >-
    An inherited, multifocal cutaneous vascular malformation caused by
    loss-of-function variants in GLMN (glomulin). Lesions are typically multiple,
    blue-purple, compressible plaques or nodules that are less painful than
    solitary solid glomus tumors, and they are inherited in an autosomal dominant
    pattern with incomplete penetrance explained by a paradominant somatic second
    hit.
  evidence:
  - reference: PMID:15689436
    reference_title: 'Four common glomulin mutations cause two thirds of glomuvenous malformations ("familial glomangiomas"): evidence for a founder effect.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomuvenous malformation (GVM) ("familial glomangioma") is a localised
      cutaneous vascular lesion histologically characterised by abnormal smooth
      muscle-like "glomus cells" in the walls of distended endothelium lined
      channels.
    explanation: >-
      Defines glomuvenous malformation as the inherited, glomus-cell-lined
      vascular lesion subtype.
- name: Malignant Glomus Tumor
  display_name: Malignant Glomus Tumor (Glomangiosarcoma)
  description: >-
    A rare aggressive form defined by deep location together with size greater
    than 2 cm, the presence of atypical mitotic figures, or moderate-to-high
    nuclear grade with at least 5 mitotic figures per 50 high-power fields.
    Capable of local recurrence and distant metastasis.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant glomus tumor: Tumors with a deep location and a size of more than
      2 cm, or atypical mitotic figures
    explanation: >-
      States the consensus morphologic criteria that define the malignant glomus
      tumor subtype.
pathophysiology:
- name: MIR143-NOTCH Gene Fusion
  description: >-
    Recurrent somatic rearrangements juxtapose the MIR143 locus in band 5q32 to a
    NOTCH gene family member. NOTCH2 (1p13) is by far the most frequent partner,
    with NOTCH1 (9q34) and NOTCH3 also reported. The rearrangement places a
    truncated NOTCH segment under control of the highly expressed MIR143 locus,
    producing marked overexpression of a ligand-independent NOTCH product in the
    perivascular myoid tumor cell. NOTCH2 and NOTCH3 are the physiologic
    regulators of vascular smooth muscle development, which is consistent with a
    perivascular myoid lineage for the resulting neoplasm. Importantly, the
    common subungual glomus tumor subset is largely fusion-negative, indicating
    that an alternative, still-undefined pathogenesis operates at that site.
  cell_types:

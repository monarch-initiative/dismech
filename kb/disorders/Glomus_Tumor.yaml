- name: Malignant Transformation
  biological_scale: TISSUE
  role: outcome
  description: >-
    Malignant glomus tumor (glomangiosarcoma) is rare and is defined
    morphologically rather than molecularly: deep anatomic location together with
    size greater than 2 cm, the presence of atypical mitotic figures, or
    moderate-to-high nuclear grade with at least 5 mitotic figures per 50
    high-power fields. Deep location, size above 2 cm, and atypical mitoses are
    each independently associated with metastatic risk, whereas high nuclear
    grade alone (symplastic glomus tumor) is not.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five-year cumulative metastatic risk increased significantly for tumors
      with a deep location (p = 0.005), with a size of more than 2 cm (p =
      0.004), and with atypical mitotic figures (p = 0.004).
    explanation: >-
      Identifies the three features that independently predict metastasis and
      therefore define malignancy in glomus tumor.
  downstream:
  - target: Metastasis
    description: >-
      Glomus tumors meeting the malignancy criteria metastasize in a substantial
      minority of cases.
    evidence:

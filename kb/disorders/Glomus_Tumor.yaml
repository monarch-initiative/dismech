- name: GLMN Loss of Function with Somatic Second Hit
  description: >-
    Germline truncating variants in GLMN (glomulin) cause the inherited multiple
    form, glomuvenous malformation. Inheritance is autosomal dominant with
    incomplete penetrance and focal lesions, explained by a paradominant
    (Knudson two-hit) mechanism in which a somatic second hit inactivates the
    remaining wild-type allele locally; in most lesions this second hit is
    acquired uniparental isodisomy of chromosome 1p rather than an intragenic
    mutation. Glomulin normally binds the RING domain of Rbx1 and inhibits its E3
    ubiquitin ligase activity, stabilizing the substrate receptor Fbw7; its loss
    accelerates Fbw7 turnover and raises Cyclin E and c-Myc levels, releasing a
    proliferative brake in the vascular wall and leaving the smooth muscle
    compartment arrested in an incompletely differentiated, glomus-like state
    around distended venous channels.

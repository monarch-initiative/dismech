      id: CL:0000669
      label: pericyte
  biological_processes:
  - preferred_term: smooth muscle cell proliferation
    modifier: INCREASED
    term:
      id: GO:0048659
      label: smooth muscle cell proliferation
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
  notes: >-
    Known split candidate, deliberately deferred. This node carries two claims
    at two scales: a CELLULAR clonal-expansion claim (glomus cells proliferate)
    and a TISSUE-scale architectural claim (they form concentric cuffs around
    ectatic channels, replace the Sucquet-Hoyer canal, and deposit pericellular
    type IV collagen). Per CLAUDE.md, two competing biological_scale values are
    the canonical bundling signal, and the correct fix is to split this into an
    atomic proliferation node and an atomic perivascular-architecture node.
    That is not done here because this node is the convergence point of all four
    driver arms and the target of the excision treatment: splitting it would
    re-target four incoming edges, four outgoing edges and one target_mechanisms
    reference mid-review. biological_scale is set to CELLULAR on the leading
    claim and the split is left as a follow-up.

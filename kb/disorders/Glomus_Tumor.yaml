- name: NF1 Biallelic Inactivation
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Individuals with neurofibromatosis type 1 carry a germline inactivating NF1
    variant and are predisposed to digital glomus tumors. Lesion formation
    requires somatic loss of the remaining wild-type allele; in a substantial
    minority this second hit is copy-neutral loss of heterozygosity produced by
    mitotic recombination of chromosome arm 17q rather than an intragenic
    mutation. Loss of neurofibromin, the RAS GTPase-activating protein encoded by
    NF1, removes the brake on RAS and produces RAS-MAPK hyperactivation in the
    glomus cell. Sporadic glomus tumors show no NF1 or RAS-MAPK abnormality, so
    this is a distinct, syndromic route into the same downstream mitogenic node.
  cell_types:
  - preferred_term: glomus cell (modified perivascular smooth muscle cell)
    term:
      id: CL:0000192
      label: smooth muscle cell

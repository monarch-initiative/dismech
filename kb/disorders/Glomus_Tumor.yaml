      label: Concentric Perivascular Arrangement of Tumor Cells
  diagnostic: true
  description: >-
    Uniform, small round glomus cells with central "punched-out" nuclei and
    sharply defined cell borders arranged in concentric cuffs around
    capillary-sized vascular channels, recapitulating the modified smooth muscle
    of the Sucquet-Hoyer canal.
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cases showed typical features of monomorphic epithelioid to cuboidal
      cells arranged in solid pattern and encuffing the thin-walled blood vessels
    explanation: >-
      Describes the defining perivascular cuffing of uniform glomus cells around
      thin-walled vessels in a 93-tumor cohort.
- name: Nested Growth Pattern
  finding_term:
    preferred_term: Nested Pattern
    term:
      id: NCIT:C35892
      label: Nested Pattern
  description: >-
    Solid nests and sheets of glomus cells separated by a delicate,

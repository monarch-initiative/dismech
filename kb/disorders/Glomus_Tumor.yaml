    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomuvenous malformation (GVM) ("familial glomangioma") is a localised
      cutaneous vascular lesion histologically characterised by abnormal smooth
      muscle-like "glomus cells" in the walls of distended endothelium lined
      channels.
    explanation: >-
      Describes the venous-malformation morphology of the inherited multiple
      form.
- category: Clinical
  name: Metastasis
  description: >-
    Distant spread, seen only in glomus tumors meeting the histologic criteria
    for malignancy, most often to lung and bone.
  subtype: Malignant Glomus Tumor
  phenotype_term:
    preferred_term: Distant metastasis
    term:
      id: HP:0002664
      label: Neoplasm
  notes: >-
    Ontology gap - term request needed. HP:0002664 Neoplasm is uninformative
    inside a neoplasm entry, but HPO has no generic metastasis term: a search of
    HPO for "metasta" returns exactly one class, HP:0200059 Metastatic
    angiosarcoma, which is a different disease. The intended meaning (distant
    metastatic spread, most often to lung and bone) is therefore carried by
    preferred_term and by the description until HPO gains a generic
    "Metastasis" phenotype.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      metastasis was observed in 38% of tumors fulfilling the criteria for
      malignancy
    explanation: >-
      Quantifies metastatic risk restricted to tumors that meet the malignancy
      criteria.
histopathology:
- name: Concentric Perivascular Glomus Cell Arrangement
  finding_term:
    preferred_term: Concentric Perivascular Arrangement of Tumor Cells
    term:

  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the cases showed typical features of monomorphic epithelioid to cuboidal
      cells arranged in solid pattern and encuffing the thin-walled blood vessels
    explanation: >-
      Documents the solid/nested architecture as the typical growth pattern of
      conventional glomus tumor.
  - reference: PMID:93364
    reference_title: 'Mast cells in solitary glomus tumors: a possible algogenic role.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopy revealed various types and degrees of degranulation of
      mast cell granules, and also disclosed a close correlation between mast
      cells and non-myelinated nerve fibers.
    explanation: >-
      Confirms the mast-cell content of the intervening stroma described here; it
      does not address the nested architecture itself, hence PARTIAL.
- name: Atypical Mitotic Figures
  finding_term:
    preferred_term: Atypical Mitotic Figures
    term:
      id: NCIT:C35962
      label: Atypical Mitotic Figures
  description: >-
    Atypical mitoses are one of the three independent morphologic predictors of
    metastasis and are a defining criterion for malignant glomus tumor.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five-year cumulative metastatic risk increased significantly for tumors
      with a deep location (p = 0.005), with a size of more than 2 cm (p =
      0.004), and with atypical mitotic figures (p = 0.004).
    explanation: >-
      Establishes atypical mitotic figures as an independent predictor of
      metastasis in glomus tumor.
biochemical:
- name: Smooth Muscle Actin Expression
  biomarker_term:
    preferred_term: Actin, Aortic Smooth Muscle
    term:
      id: NCIT:C103972
      label: Actin, Aortic Smooth Muscle
  notes: >-
    Diffuse cytoplasmic smooth muscle (muscle-specific) actin positivity is the
    single most consistent immunophenotypic feature of glomus tumor and reflects
    its modified smooth muscle lineage. It is typically accompanied by
    h-caldesmon positivity and a continuous pericellular type IV collagen
    basement membrane.
  evidence:
  - reference: PMID:1848411
    reference_title: 'Cutaneous glomus tumor. A comparative immunohistochemical study with pseudoangiomatous intradermal melanocytic nevi.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all tumors were immunoreactive for muscle-specific actin, but only two
      expressed desmin
    explanation: >-
      Documents uniform muscle-specific actin positivity with only variable
      desmin expression, the characteristic glomus tumor immunophenotype.
- name: Desmin Expression
  biomarker_term:
    preferred_term: Desmin
    term:
      id: NCIT:C96450
      label: Desmin
  notes: >-
    Desmin is characteristically negative or only focally and inconsistently
    expressed in glomus tumor, in contrast to true smooth muscle tumors such as
    leiomyoma and leiomyosarcoma, and is therefore useful in differential
    diagnosis.
  evidence:
  - reference: PMID:1848411
    reference_title: 'Cutaneous glomus tumor. A comparative immunohistochemical study with pseudoangiomatous intradermal melanocytic nevi.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all tumors were immunoreactive for muscle-specific actin, but only two
      expressed desmin
    explanation: >-
      Shows desmin expression in only 2 of 6 glomus tumors, supporting its
      variable-to-negative status.
- name: Contractile Smooth Muscle Marker Expression (Smoothelin and h-Caldesmon)
  biomarker_term:
    preferred_term: Caldesmon
    term:
      id: NCIT:C113326
      label: Caldesmon
  notes: >-
    Glomus cells express the contractile-smooth-muscle markers smoothelin and
    h-caldesmon, confirming that they are genuinely contractile smooth muscle
    cells rather than undifferentiated perivascular cells. NCIT lacks a
    smoothelin concept, so this readout is anchored on caldesmon, the companion
    contractile marker in the same diagnostic panel.
  evidence:
  - reference: PMID:27184662
    reference_title: Smoothelin and WT-1 expression in glomus tumors and glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smoothelin expression in glomic cells indicates that they are contractile
      smooth muscle cells
    explanation: >-
      Immunohistochemical panel including h-caldesmon establishes the contractile
      smooth muscle phenotype of glomus cells.
diagnosis:
- name: Clinical provocation triad (Love's pin test, Hildreth's test, cold test)
  description: >-
    Three bedside provocation manoeuvres localise a suspected glomus tumor.
    Love's pin test applies focal pressure with a pinhead over the point the
    patient indicates and reproduces exquisite tenderness. Hildreth's test
    repeats Love's test under tourniquet-induced arm ischaemia: the tenderness
    abates and returns sharply when the tourniquet is released, which is what
    makes it specific. The cold test applies an ice cube to the lesion to
    reproduce cold-provoked pain. Trans-illumination of the fingertip in a dark
    room may show the lesion. These manoeuvres localise disease but do not
    replace histopathology.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the Hildreth’s test, transient ischemia is produced at the arm’s level
      with application of a tourniquet. With the ischemia in place, when the
      Love’s pin test is repeated, there is absence of the tenderness of previous
      magnitude. Upon removal of the tourniquet, there is sharp return of the
      bothering pain.
    explanation: >-
      Defines the Hildreth manoeuvre and its relationship to Love's pin test.
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cold sensitivity test is reported to have 100% sensitivity,
      specificity and diagnostic accuracy. The Love’s test has 100% sensitivity
      and 78% diagnostic accuracy, whereas the Hildreth’s test has 71.4%
      sensitivity, 100% specificity and 78% diagnostic accuracy.
    explanation: >-
      Gives the reported operating characteristics of each manoeuvre; note these
      are single-series figures from a small cohort, not pooled estimates.
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The frequency of various presenting clinical findings was as follows: Pain
      (n=17; 100%), tenderness (n=17; 100%), cold sensitivity (n=13; 76.47%),
      visible tumor (n=4; 23.52%), nail changes (n=2; 11.76%), Love’s pin test
      (n=17; 100%), Cold sensitivity test (n=17; 100%) Hildreth’s test (n=12;
      70.58%), and trans-illumination test (n=9; 52.94%).
    explanation: >-
      Quantifies the yield of each manoeuvre in a consecutive hand glomus tumor
      series.
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to the different clinical tests including Love's pin test,
      Hildreth's test, and trans-illumination test, imaging studies such as
      magnetic resonance imaging (MRI), ultrasonography, and radiography are
      often helpful in the diagnosis.
    explanation: >-
      Independent review naming the same three clinical tests as the standard
      bedside work-up.
- name: Contrast-enhanced high-resolution MRI
  description: >-
    Gadolinium-enhanced high-resolution MRI is the preferred imaging study for a
    suspected subungual glomus tumor. The lesion is characteristically low
    signal on T1-weighted and markedly hyperintense on T2-weighted images with
    avid enhancement, and lesions as small as 2 mm can be detected. It also
    identifies additional asymptomatic lesions (which would raise the question of
    NF1 or glomuvenous malformation) and helps exclude alternative diagnoses.
  diagnosis_term:
    preferred_term: magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is currently considered the gold standard diagnostic investigation. It
      is non-invasive and doesn’t involve any exposure to radiation. It can
      detect early lesions as small as 2 mm.
    explanation: >-
      States the role and resolution of high-resolution contrast MRI in this
      diagnosis.
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristically there is low-signal intensity on T1-weighted images
      whereas marked hyperintensity on T2-weighted images
    explanation: >-
      Gives the characteristic MRI signal signature of the lesion.
- name: Ultrasonography
  description: >-
    High-resolution ultrasound is a cheap, accessible first-line adjunct that
    may show a small hypoechoic, hypervascular nodule, sometimes with scalloping
    of the underlying distal phalanx. It is less sensitive than MRI for very
    small lesions.
  diagnosis_term:
    preferred_term: ultrasound imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      imaging studies such as magnetic resonance imaging (MRI), ultrasonography,
      and radiography are often helpful in the diagnosis.
    explanation: >-
      Names ultrasonography among the helpful imaging modalities; the review does
      not report its operating characteristics, hence PARTIAL.
- name: Histopathologic examination with immunohistochemistry
  description: >-
    Definitive diagnosis is histopathologic. Sheets and perivascular cuffs of
    monomorphic, sharply bordered glomus cells are confirmed by an
    immunohistochemical panel showing diffuse smooth muscle actin, smoothelin and
    h-caldesmon positivity with pericellular type IV collagen, and negativity for
    S100/SOX10, cytokeratin and endothelial markers in the tumor cells. Desmin is
    variable. The same specimen is graded against the Folpe criteria to assign
    benign, symplastic, uncertain-malignant-potential or malignant category.
  diagnosis_term:
    preferred_term: histopathologic examination with immunohistochemistry
    term:
      id: NCIT:C16853
      label: Microscopy
  notes: >-
    NCIT:C16722 (Immunohistochemistry) is the semantically exact term but is not
    reachable from NCIT:C25218 (Clinical Intervention or Procedure), the root of
    the TreatmentActionTerm dynamic enum, so it fails term validation here.
    Microscopy is the nearest reachable ancestor; the specific procedure is
    carried by preferred_term.
  evidence:
  - reference: PMID:1848411
    reference_title: 'Cutaneous glomus tumor. A comparative immunohistochemical study with pseudoangiomatous intradermal melanocytic nevi.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all tumors were immunoreactive for muscle-specific actin, but only two
      expressed desmin
    explanation: >-
      Establishes the diagnostic actin-positive, desmin-variable immunophenotype.
  - reference: PMID:27184662
    reference_title: Smoothelin and WT-1 expression in glomus tumors and glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Smoothelin expression in glomic cells indicates that they are contractile
      smooth muscle cells
    explanation: >-
      Adds smoothelin to the confirmatory contractile-smooth-muscle panel.
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They evaluated size, depth, growth pattern, cellularity, nuclear grade,
      number of mitotic figures per 50 high-power fields (HPF), atypical mitotic
      figures, vascular space involvement, and necrosis to define criteria for
      malignancy in glomus tumors.
    explanation: >-
      Lists the histologic parameters that must be assessed on the excision
      specimen to assign the Folpe malignancy category.
- name: NOTCH fusion / BRAF molecular testing
  description: >-
    FISH break-apart or RNA-based fusion testing for NOTCH1/NOTCH2/NOTCH3
    rearrangement, and BRAF V600E testing (by sequencing or VE1
    immunohistochemistry), are reserved for deep, visceral, atypical, malignant
    or diagnostically ambiguous lesions. A NOTCH rearrangement supports glomus
    tumor over the PDGFRB-mutant myofibroma/myopericytoma arm of the pericytic
    family; a BRAF V600E result is directly actionable in metastatic disease.
    Molecular testing is NOT required for a classic subungual lesion, which is
    typically fusion-negative in any case.
  diagnosis_term:
    preferred_term: fluorescence in situ hybridization
    term:
      id: NCIT:C17563
      label: Fluorescence In Situ Hybridization
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rearrangements of NOTCH genes are seen in over half of GT, with
      NOTCH2-MIR143 being the most common fusion (73%)
    explanation: >-
      Establishes the diagnostic yield of NOTCH rearrangement testing in glomus
      tumor.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common subungual GT subset lack NOTCH-gene fusions suggesting an
      alternative pathogenesis.
    explanation: >-
      Explains why a negative fusion result in a classic subungual lesion does
      not exclude the diagnosis.
  - reference: PMID:40976119
    reference_title: Mutational landscape of glomus tumor and clinical application of genomic profiling based on next-generation sequencing technology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathway enrichment analysis revealed KRAS mutations were predominant in
      distal GT, while BRAF V600E mutations were more prevalent in proximal
      locations.
    explanation: >-
      Supports next-generation sequencing as the route to the actionable RAS-MAPK
      lesions.
genetic:
- name: MIR143-NOTCH2 fusion
  gene_term:
    preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  variant_origin: SOMATIC
  notes: >-
    The recurrent fusion of MIR143 (hgnc:31530) to a NOTCH gene family member is
    the characteristic somatic driver of glomus tumor. NOTCH2 is the most
    frequent partner (73% of fusions), with NOTCH1 (hgnc:7881) and NOTCH3
    (hgnc:7883) also reported. Fusions are absent from most subungual tumors.
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rearrangements of NOTCH genes are seen in over half of GT, with
      NOTCH2-MIR143 being the most common fusion (73%)
    explanation: >-
      Establishes NOTCH2-MIR143 as the predominant fusion in a large glomus tumor
      cohort.
- name: MIR143-NOTCH3 fusion
  gene_term:
    preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  variant_origin: SOMATIC
  notes: >-
    A minority of benign soft tissue glomus tumors carry NOTCH3 rearrangement,
    consistent with the shared role of NOTCH2 and NOTCH3 in vascular smooth
    muscle development.
  evidence:
  - reference: PMID:23999936
    reference_title: Novel MIR143-NOTCH fusions in benign and malignant glomus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NOTCH3 rearrangements were identified in 9% of GTs, all present in benign
      soft tissue GT, one case being fused to MIR143
    explanation: >-
      Documents NOTCH3 as a less frequent fusion partner restricted to benign
      soft tissue tumors.
- name: BRAF V600E
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  variant_origin: SOMATIC
  notes: >-
    Activating BRAF p.Val600Glu occurs in a subset of glomus tumors, largely
    distinct from NOTCH-fusion-positive tumors, and is enriched in proximally
    located lesions. It is a validated therapeutic target in metastatic disease.
  evidence:
  - reference: PMID:40976119
    reference_title: Mutational landscape of glomus tumor and clinical application of genomic profiling based on next-generation sequencing technology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathway enrichment analysis revealed KRAS mutations were predominant in
      distal GT, while BRAF V600E mutations were more prevalent in proximal
      locations.
    explanation: >-
      Documents BRAF V600E in glomus tumor and its anatomic enrichment.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  variant_origin: SOMATIC
  notes: >-
    Activating KRAS mutation is the RAS-level counterpart of BRAF V600E within
    the RAS-MAPK arm of glomus tumor, and the two show a reciprocal anatomic
    distribution: in next-generation sequencing of glomus tumors, KRAS lesions
    were enriched in distally located tumors whereas BRAF V600E predominated in
    proximal ones. KRAS-mutant tumors therefore have no mutant BRAF kinase to
    inhibit, and the actionable node for them is MEK downstream of RAS, the same
    rationale used for the NF1-deficient arm.
  evidence:
  - reference: PMID:40976119
    reference_title: Mutational landscape of glomus tumor and clinical application of genomic profiling based on next-generation sequencing technology.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathway enrichment analysis revealed KRAS mutations were predominant in
      distal GT, while BRAF V600E mutations were more prevalent in proximal
      locations.
    explanation: >-
      Documents somatic KRAS mutation in glomus tumor and its enrichment in
      distal lesions, the mirror image of the BRAF V600E distribution.
- name: NF1
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  variant_origin: GERMLINE
  relationship_type: SUSCEPTIBILITY
  notes: >-
    Germline NF1 loss-of-function variants predispose to digital glomus tumors,
    which are now recognized as part of the NF1 tumor spectrum. Lesions arise by
    biallelic inactivation, the somatic second hit frequently being copy-neutral
    loss of heterozygosity via mitotic recombination of 17q.
  evidence:
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumors of the fingers or toes should be considered as part of the
      tumor spectrum of NF1.
    explanation: >-
      Establishes germline NF1 as a susceptibility genotype for digital glomus
      tumor.
- name: GLMN
  gene_term:
    preferred_term: GLMN
    term:
      id: hgnc:14373
      label: GLMN
  variant_origin: GERMLINE
  notes: >-
    Germline truncating variants in GLMN (glomulin) cause inherited glomuvenous
    malformation, with four founder mutations accounting for roughly two thirds
    of families. Penetrance is incomplete and lesions are focal, reflecting a
    paradominant mechanism that requires a somatic second hit, usually acquired
    uniparental isodisomy of chromosome 1p.
  evidence:
  - reference: PMID:15689436
    reference_title: 'Four common glomulin mutations cause two thirds of glomuvenous malformations ("familial glomangiomas"): evidence for a founder effect.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding suggests that GVM results from complete localised loss of
      function and explains the paradominant mode of inheritance.
    explanation: >-
      Establishes GLMN loss of function and the paradominant inheritance model
      for glomuvenous malformation.
differential_diagnoses:
- name: Jugulotympanic paraganglioma ("glomus jugulare" / "glomus tympanicum")
  description: >-
    This is a NAMING COLLISION, not a biological differential. The skull-base and
    middle-ear tumours historically called "glomus jugulare" and "glomus
    tympanicum" are PARAGANGLIOMAS and are NOT glomus tumours in the sense of
    this entry. They arise from neural-crest-derived parasympathetic paraganglia
    of the jugular bulb and tympanic plexus, are neuroendocrine (chromogranin /
    synaptophysin positive, with S100/SOX10-positive sustentacular cells), are
    associated with germline SDHx variants, may be catecholamine-secreting, and
    are managed by skull-base surgery or stereotactic radiosurgery. They share
    nothing with the pericytic MIR143-NOTCH-driven soft-tissue glomus tumour
    except the nineteenth-century use of "glomus" for a vascular body. Anyone
    reaching this entry from a "glomus jugulare" query has the wrong entity: see
    MONDO:0021064 (jugulotympanic paraganglioma) instead.
  disease_term:
    preferred_term: jugulotympanic paraganglioma
    term:
      id: MONDO:0021064
      label: jugulotympanic paraganglioma
  distinguishing_features:
  - Anatomic site is the jugular foramen / middle ear rather than the acral soft tissue or nail bed
  - Neuroendocrine chief-cell morphology with chromogranin and synaptophysin expression, and S100/SOX10-positive sustentacular cells; glomus tumour is S100-negative and actin-positive
  - Derived from neural-crest paraganglia, not from perivascular modified smooth muscle
  - Germline SDHx predisposition; no MIR143-NOTCH fusion
  - May secrete catecholamines and present with pulsatile tinnitus and lower cranial neuropathy, not with the paroxysmal-pain/cold-sensitivity triad
  evidence:
  - reference: PMID:42349676
    reference_title: 'Jugular Foramen Paraganglioma (Glomus Jugulare): A 10-Year Single-Center Experience.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Jugulotympanic paragangliomas (JTPs) are rare, hypervascular skull base
      tumors.
    explanation: >-
      Confirms that the entity clinically called "glomus jugulare" is a
      jugulotympanic paraganglioma of the skull base - a different disease from
      the acral pericytic glomus tumour modelled here.
  - reference: PMID:20530151
    reference_title: 'Diagnosis, management, and complications of glomus tumours of the digits in neurofibromatosis type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus bodies are thermoregulatory shunts concentrated in the dermis of
      the fingertips and other peripheral sites subject to excessive cold and
      should be distinguished from unrelated adrenal and extra-adrenal
      paragangliomas, also commonly called "glomus tumors."
    explanation: >-
      The glomus-tumour literature itself instructs readers to keep the
      thermoregulatory glomus body distinct from the unrelated paragangliomas
      that share the "glomus tumour" name - an authoritative statement of the
      naming collision this differential exists to prevent.
  notes: >-
    Curation guardrail. This is the single most consequential entity-resolution
    error for this disease name, and it is exactly the Named Entity Confusion
    failure mode described in CLAUDE.md: literature retrieved for "glomus tumor"
    will silently include head-and-neck paraganglioma papers whose PMIDs are real
    and whose snippets validate. Check that any candidate reference is about an
    acral/soft-tissue lesion before citing it here.
- name: Myopericytoma
  description: >-
    A member of the same pericytic/perivascular myoid tumour family, showing
    concentric perivascular growth of myoid cells. Morphologic overlap with
    glomus tumour is substantial, and the two are separated most cleanly at the
    molecular level: myopericytoma and myofibroma carry PDGFRB mutations whereas
    glomus tumour carries NOTCH fusions.
  disease_term:
    preferred_term: myopericytoma
    term:
      id: MONDO:0017349
      label: myopericytoma
  distinguishing_features:
  - Concentric multilayered perivascular myoid whorls rather than sheets of uniform round glomus cells with sharply defined borders
  - PDGFRB-mutant rather than NOTCH-fusion positive
  - Usually painless, in contrast to the paroxysmal-pain triad of subungual glomus tumour
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They share variable histologic overlap with other tumors in the pericytic
      family including myofibroma (MF), myopericytoma (MP) and angioleiomyoma
      (AL).
    explanation: >-
      Names myopericytoma as a histologic mimic within the pericytic family.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the emerging genetic data suggest a dichotomy of the perivascular myoid
      tumor spectrum into 2 categories: PDGFRB-mutant MF and MP and NOTCH-fusion
      positive GT.
    explanation: >-
      Supplies the molecular discriminator that separates myopericytoma /
      myofibroma from glomus tumour.
- name: Angioleiomyoma
  description: >-
    A benign dermal or subcutaneous neoplasm of well-differentiated smooth
    muscle arranged around numerous vessels. Like glomus tumour it is a painful
    vascular-rich subcutaneous nodule of the extremities, so it is a genuine
    clinical as well as histologic mimic; unlike glomus tumour its cells are
    frankly spindled and strongly desmin-positive.
  disease_term:
    preferred_term: angioleiomyoma
    term:
      id: MONDO:0006646
      label: angioleiomyoma
  distinguishing_features:
  - Intersecting fascicles of elongated, cigar-shaped smooth muscle cells rather than rounded glomus cells with punched-out nuclei
  - Diffusely and strongly desmin-positive; glomus tumour is desmin-negative or only focally positive
  - Not NOTCH-fusion driven
  - Typically a deeper subcutaneous lower-limb nodule rather than a subungual lesion
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They share variable histologic overlap with other tumors in the pericytic
      family including myofibroma (MF), myopericytoma (MP) and angioleiomyoma
      (AL).
    explanation: >-
      Names angioleiomyoma as a histologic mimic within the pericytic family.
  - reference: PMID:1848411
    reference_title: 'Cutaneous glomus tumor. A comparative immunohistochemical study with pseudoangiomatous intradermal melanocytic nevi.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all tumors were immunoreactive for muscle-specific actin, but only two
      expressed desmin
    explanation: >-
      Supplies the glomus-tumour side of the desmin discriminator (variable to
      negative); the angioleiomyoma comparison is standard diagnostic practice
      not measured in this paper, hence PARTIAL.
- name: GLI1-altered soft tissue tumour (GLI1-fused or GLI1-amplified)
  description: >-
    The most contemporary addition to the pericytic/perivascular differential. A
    distinct group of soft tissue neoplasms defined either by GLI1 gene fusions
    (ACTB, MALAT1 or PTCH1 partners) or by GLI1 amplification with CDK4 and MDM2
    co-amplification shows monomorphic ovoid-to-epithelioid cells in a
    nested-trabecular pattern separated by thin septa and a delicate capillary
    network. The authors of the defining series call this architecture highly
    reminiscent of glomus tumour and list glomus tumour/myopericytoma explicitly
    among the differential diagnoses. The distinction is prognostic, not
    academic: unlike conventional glomus tumour these are malignant soft tissue
    tumours, with high mitotic counts, necrosis, lymphovascular invasion and
    documented lymph node and lung metastases, and they cannot be separated from
    glomus tumour on morphology alone.
  distinguishing_features:
  - GLI1 gene fusion, or GLI1 amplification usually with CDK4 and MDM2 co-amplification, rather than a MIR143-NOTCH fusion
  - Frequent S100 positivity and an inconsistent immunoprofile (CD56, SMA, pan-CK variably positive); glomus tumour is consistently actin-positive and S100-negative
  - High mitotic count and necrosis in a substantial minority, with lymphovascular invasion
  - Malignant behaviour is the rule rather than the rare exception it is in glomus tumour
  evidence:
  - reference: PMID:31189998
    reference_title: GLI1-amplifications expand the spectrum of soft tissue neoplasms defined by GLI1 gene fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumors are consistently positive for actin and show the
      miR143-NOTCH2 gene fusion in most cases
    explanation: >-
      The defining GLI1 series states the discriminator from the glomus-tumour
      side - consistent actin positivity plus the MIR143-NOTCH2 fusion - when
      setting out its own differential diagnosis.
  - reference: PMID:31189998
    reference_title: GLI1-amplifications expand the spectrum of soft tissue neoplasms defined by GLI1 gene fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      FISH showed GLI1 (12q13.3) gene amplification in all 10 cases, with
      co-amplification of CDK4 (12q14.1) in nine (90%) and MDM2 (12q15) in eight
      (80%) cases.
    explanation: >-
      Supplies the molecular signature that separates this group from glomus
      tumour.
  - reference: PMID:31189998
    reference_title: GLI1-amplifications expand the spectrum of soft tissue neoplasms defined by GLI1 gene fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No consistent immunoprofile was detected, with positivity for CD56 (six
      cases), S100 (four cases), SMA (two cases), and pan-CK (one case).
    explanation: >-
      Documents the inconsistent, frequently S100-positive immunoprofile, the
      inverse of the uniform actin-positive, S100-negative glomus tumour
      phenotype.
  notes: >-
    MONDO has no class for GLI1-altered / GLI1-amplified soft tissue tumour (a
    MONDO search for "GLI1" returns only the HGNC gene record), so this
    differential is deliberately recorded without a disease_term rather than
    mapped to an approximate parent.
- name: Solitary fibrous tumour (formerly haemangiopericytoma)
  description: >-
    Historically confused with glomus tumour because "haemangiopericytoma" was
    once used for any perivascular-patterned tumour. Solitary fibrous tumour is
    now defined by the NAB2-STAT6 fusion with nuclear STAT6 expression and CD34
    positivity, and is a fibroblastic rather than pericytic lesion; the
    staghorn-vessel pattern it shares with glomus tumour is a non-specific
    architectural feature.
  disease_term:
    preferred_term: solitary fibrous tumor
    term:
      id: MONDO:0016238
      label: solitary fibrous tumor
  distinguishing_features:
  - Patternless spindle-cell proliferation with ropey collagen and staghorn vessels, not uniform round perivascular glomus cells
  - Nuclear STAT6 (NAB2-STAT6 fusion) and CD34 positive; glomus tumour is STAT6/CD34 negative and SMA positive
  - Fibroblastic lineage, not pericytic; no NOTCH fusion
  - Typically a deep-seated or serosal mass, painless, without the cold-sensitivity triad
  evidence:
  - reference: PMID:24030747
    reference_title: Nuclear expression of STAT6 distinguishes solitary fibrous tumor from histologic mimics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, STAT6 is a highly sensitive and almost perfectly specific
      immunohistochemical marker for SFT and can be helpful to distinguish this
      tumor type from histologic mimics.
    explanation: >-
      Validates nuclear STAT6 as the discriminator that separates solitary
      fibrous tumour from its histologic mimics, glomus tumour among them.
  - reference: PMID:24030747
    reference_title: Nuclear expression of STAT6 distinguishes solitary fibrous tumor from histologic mimics.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty-nine of 60 SFT cases (98%) showed nuclear expression of STAT6, which
      was usually diffuse and intense. All other tumor types were negative for
      STAT6, except for three dedifferentiated liposarcomas and one deep fibrous
      histiocytoma, which showed weak staining.
    explanation: >-
      Quantifies the operating characteristics of the STAT6 discriminator across
      231 soft tissue tumours, establishing that a STAT6-negative perivascular
      lesion is not a solitary fibrous tumour.
  - reference: PMID:31189998
    reference_title: GLI1-amplifications expand the spectrum of soft tissue neoplasms defined by GLI1 gene fusions.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumors are consistently positive for actin and show the
      miR143-NOTCH2 gene fusion in most cases
    explanation: >-
      Supplies the glomus-tumour side of the discriminator (actin positivity
      plus MIR143-NOTCH2 fusion) in a paper that discusses solitary fibrous
      tumour and glomus tumour together on the same differential; it does not
      itself compare the two head to head, hence PARTIAL.
  notes: >-
    Historically this differential carried no evidence item because no abstract
    in the reference set made the glomus-tumour-versus-SFT comparison directly.
    It is now backed from both sides: the NAB2-STAT6 / nuclear STAT6
    discriminator by PMID:24030747, and the actin-plus-MIR143-NOTCH2
    glomus-tumour signature by PMID:31189998, which lists solitary fibrous
    tumour and glomus tumour/myopericytoma on the same differential. A single
    paper making the head-to-head comparison still does not appear to exist.
- name: Eccrine spiradenoma
  description: >-
    A benign sweat-gland adnexal neoplasm and one of the classic causes of a
    small, exquisitely painful dermal nodule. It sits alongside glomus tumour on
    the standard differential for a painful cutaneous or subungual nodule, but is
    an epithelial (basaloid) tumour rather than a perivascular myoid one.
  disease_term:
    preferred_term: benign spiradenoma
    term:
      id: MONDO:0003448
      label: benign spiradenoma
  distinguishing_features:
  - Basaloid epithelial nodules with two cell populations and scattered lymphocytes, not perivascular myoid cells
  - Cytokeratin-positive and SMA-negative in the neoplastic cells, the inverse of the glomus tumour immunophenotype
  - No cold hypersensitivity or Hildreth response
  - More often trunk or proximal-extremity dermis than subungual
  evidence:
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      differential diagnosis of other painful tumours, such as leiomyoma,
      eccrine spiradenoma, haemangioma, neuroma, osteochondroma, or mucous cyst
      should always be kept in mind while evaluating a patient with severe pain
      in the tip of the finger.
    explanation: >-
      Places eccrine spiradenoma explicitly on the differential for a painful
      fingertip lesion, together with the other painful-tumour mimics.
- name: Other painful acral lesions (leiomyoma, haemangioma, neuroma, osteochondroma, mucous cyst)
  description: >-
    A cluster of lesions that share the presenting complaint - severe pain at the
    fingertip - but not the mechanism. They are grouped here because the review
    literature enumerates them together as the standing differential for a
    painful digital lesion, and because diagnostic delay in glomus tumour is
    typically caused by one of them being assumed instead.
  distinguishing_features:
  - None reproduces the full triad of paroxysmal pain, pinpoint tenderness and cold hypersensitivity with a positive Hildreth response
  - Contrast-enhanced high-resolution MRI distinguishes most of them from the avidly enhancing, T2-hyperintense glomus tumour
  - Definitive separation is histopathologic
  evidence:
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      differential diagnosis of other painful tumours, such as leiomyoma,
      eccrine spiradenoma, haemangioma, neuroma, osteochondroma, or mucous cyst
      should always be kept in mind while evaluating a patient with severe pain
      in the tip of the finger.
    explanation: >-
      Enumerates the standing differential for a painful fingertip lesion.
- name: Glomuvenous malformation (GLMN-related)
  description: >-
    Modelled in this entry as a subtype rather than a wholly separate disease,
    but the boundary matters and is easy to blur. Sporadic solitary glomus tumour
    is a somatic, fusion-driven NEOPLASM; glomuvenous malformation is an
    inherited GLMN-related vascular MALFORMATION in which a somatic second hit
    (usually acquired uniparental isodisomy of 1p) unmasks the germline allele
    locally. They are not two presentations of one lesion, and evidence about one
    must not be transferred to the other.
  disease_term:
    preferred_term: glomuvenous malformation
    term:
      id: MONDO:0007672
      label: glomuvenous malformation
  distinguishing_features:
  - Multiple, multifocal, compressible blue-purple plaques rather than a solitary subungual nodule
  - Much less painful, and pain is not paroxysmal or cold-provoked
  - Germline GLMN loss of function with a somatic second hit (paradominant), not a MIR143-NOTCH fusion
  - Dilated venous channels with only a few layers of glomus cells, rather than solid sheets of glomus cells
  evidence:
  - reference: PMID:15689436
    reference_title: 'Four common glomulin mutations cause two thirds of glomuvenous malformations ("familial glomangiomas"): evidence for a founder effect.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomuvenous malformation (GVM) ("familial glomangioma") is a localised
      cutaneous vascular lesion histologically characterised by abnormal smooth
      muscle-like "glomus cells" in the walls of distended endothelium lined
      channels.
    explanation: >-
      Defines GVM as a vascular lesion with glomus cells in the channel walls,
      distinct in architecture from the solid sporadic glomus tumour.
  - reference: PMID:23375657
    reference_title: Somatic uniparental isodisomy explains multifocality of glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This finding demonstrates that a double hit is needed to trigger formation
      of a GVM.
    explanation: >-
      Establishes the germline-plus-somatic two-hit genetics that distinguishes
      GVM from the purely somatic sporadic glomus tumour.
inheritance:
- name: Autosomal dominant inheritance of glomuvenous malformation
  description: >-
    Familial multiple glomangioma (glomuvenous malformation) segregates as an
    autosomal dominant trait caused by GLMN loss-of-function variants, with
    incomplete penetrance and variable expressivity attributed to the requirement
    for a somatic second hit (paradominant inheritance).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:23375657
    reference_title: Somatic uniparental isodisomy explains multifocality of glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Inherited vascular malformations are commonly autosomal dominantly
      inherited with high, but incomplete, penetrance; they often present as
      multiple lesions.
    explanation: >-
      Describes the autosomal dominant, incompletely penetrant, multifocal
      inheritance pattern of glomuvenous malformation.
clinical_trials:
- name: NCT03422679
  phase: PHASE_I
  status: TERMINATED
  description: >-
    Dose-escalation study of CB-103, an oral pan-NOTCH transcription-complex
    inhibitor, in adults with locally advanced or metastatic solid tumours and
    haematological malignancies characterised by NOTCH pathway alterations.
    Malignant glomus tumor is one of the registry-indexed conditions, making this
    the first trial to prospectively select glomus tumors on the basis of their
    MIR143-NOTCH driver. Seventy-nine patients enrolled overall and the study was
    stopped early; the ClinicalTrials.gov record gives the reason for stopping as
    a business reason, not demonstrated inefficacy. The peer-reviewed phase I
    report found a manageable safety profile and pharmacodynamic evidence of
    Notch target-gene downregulation, but limited single-agent antitumor
    activity: no objective responses and stable disease in 49%. The population
    was dominated by adenoid cystic carcinoma (40 of 79, 51%) and no
    glomus-tumor-specific outcome was reported, so these basket-level results
    must not be attributed to the glomus subgroup in either direction.
  target_phenotypes:
  - preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: clinicaltrials:NCT03422679
    reference_title: A Phase I/IIA, Multi-Centre, Open-Label, Dose-Escalation Study With Expansion Arms to Assess the Safety, Tolerability, Pharmacokinetics and Preliminary Efficacy of CB-103 Administered Orally in Adult Patients With Locally Advanced or Metastatic Solid Tumours and Haematological Malignancies Characterised by Alterations of the NOTCH Signalling Pathway
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      investigate the safety, tolerability and preliminary efficacy of CB-103
    explanation: >-
      Registry record for the NOTCH-pathway-selected basket trial that lists
      malignant glomus tumor among its conditions; the study was terminated, so
      it supports the therapeutic rationale rather than any efficacy claim.
  - reference: PMID:37712875
    reference_title: A Phase I Study of the Pan-Notch Inhibitor CB-103 for Patients with Advanced Adenoid Cystic Carcinoma and Other Tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CB-103 had a manageable safety profile and biological activity but limited
      clinical antitumor activity as monotherapy in this first-in-human study.
    explanation: >-
      The peer-reviewed phase I publication behind this registry record. It
      establishes tolerability and on-target biological activity but not
      efficacy, which is why the pan-NOTCH strategy remains a rationale rather
      than a treatment for malignant glomus tumor.
  - reference: PMID:37712875
    reference_title: A Phase I Study of the Pan-Notch Inhibitor CB-103 for Patients with Advanced Adenoid Cystic Carcinoma and Other Tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There were no objective responses, but 37 (49%) had stable disease;
      including 23 of 40 (58%) patients with ACC.
    explanation: >-
      Gives the basket-level outcome. Adenoid cystic carcinoma dominated the
      cohort (40 of 79) and no glomus-tumor-specific response is reported, so
      this figure bounds what may be claimed for glomus tumor rather than
      supporting or refuting activity in it.
  notes: >-
    Two provenance points that matter for reading the TERMINATED status
    correctly. First, the ClinicalTrials.gov record states the reason for
    stopping as a business reason; that field is not present in the cached
    registry summary, so it is recorded here as prose rather than as an evidence
    snippet. Second, "terminated" here is not a negative efficacy verdict on
    glomus tumor: the phase I publication PMID:37712875 reports the outcome for
    an adenoid-cystic-carcinoma-dominated basket, with no glomus-tumor-specific
    result of any kind.
treatments:
- name: Complete Surgical Excision
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Complete surgical excision, typically via a transungual or lateral
    subperiosteal approach for subungual lesions, is the definitive treatment for
    localized glomus tumor. It produces prompt and durable relief of pain;
    incomplete excision is the principal cause of symptomatic recurrence.
  treatment_term:
    preferred_term: Excision
    term:
      id: NCIT:C15232
      label: Excision
  target_mechanisms:
  - target: Glomus Cell Proliferation Around Distorted Vascular Channels
    treatment_effect: INHIBITS
    description: >-
      Excision physically removes the proliferating glomus cell mass and with it
      the nociceptor-rich stroma responsible for the pain syndrome.
    evidence:
    - reference: PMID:34239958
      reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        experienced complete symptomatic relief within 2-4 weeks after surgical
        excision
      explanation: >-
        Removal of the proliferating mass abolishes the pain syndrome in every
        patient, demonstrating that the excised node is the mechanistic source of
        the symptoms.
  evidence:
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      experienced complete symptomatic relief within 2-4 weeks after surgical
      excision
    explanation: >-
      Reports complete symptomatic relief in all 17 patients after excision, with
      no recurrence at one year.
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete surgical excision is a must to get complete relief from the
      symptoms and to avoid recurrence.
    explanation: >-
      States that completeness of excision determines both symptom relief and
      freedom from recurrence.
  - reference: PMID:41693210
    reference_title: The Molecular Mechanism and Therapeutic Progress in Glomus Tumor.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While complete surgical excision remains the standard curative treatment
      for localized disease
    explanation: >-
      Confirms complete excision as the standard curative therapy for localized
      glomus tumor.
- name: MEK Inhibition for NF1-Deficient Tumors
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    For NF1-deficient glomus tumors there is no BRAF kinase to inhibit, so the
    proposed systemic strategy is direct MEK blockade downstream of the
    unrestrained RAS. This is an investigational, mechanism-derived rationale
    rather than an established standard: it is put forward in narrative review
    for multifocal, metastatic, or surgically challenging cases, and no
    glomus-tumor-specific trial or response series supports it yet. Selumetinib
    is named as the exemplar MEK inhibitor because it is the agent approved in
    NF1-associated plexiform neurofibroma, not because it has been tested in
    glomus tumor.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: selumetinib
      term:
        id: CHEBI:90227
        label: selumetinib
  target_mechanisms:
  - target: Constitutive Mitogenic Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      MEK inhibition blocks the RAS-MAPK cascade immediately downstream of the
      RAS node that neurofibromin loss leaves unrestrained.
    evidence:
    - reference: PMID:41693210
      reference_title: The Molecular Mechanism and Therapeutic Progress in Glomus Tumor.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        molecular insights have spurred investigation into targeted agents,
        including MEK inhibitors for NF1-deficient tumors and immunotherapy
      explanation: >-
        States the MEK-inhibition rationale for NF1-deficient glomus tumors; it
        is framed as investigation spurred by molecular insight, not as
        demonstrated efficacy, hence PARTIAL.
  evidence:
  - reference: PMID:41693210
    reference_title: The Molecular Mechanism and Therapeutic Progress in Glomus Tumor.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Such systemic therapies are particularly relevant for multifocal,
      metastatic, or surgically challenging cases.
    explanation: >-
      Scopes the systemic-therapy indication to unresectable/multifocal disease;
      no efficacy data are reported, so this remains investigational.
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RAS mitogen-activated protein kinase hyperactivation was observed in
      cultured NF1(-/-) glomus cells, reflecting a lack of inhibition of the
      pathway by functional neurofibromin, the protein product of NF1.
    explanation: >-
      Supplies the mechanistic target: cultured NF1-null glomus cells show the
      RAS-MAPK hyperactivation that a MEK inhibitor would suppress.
- name: BRAF and MEK Inhibition
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    For metastatic malignant glomus tumor harboring BRAF p.Val600Glu, combined
    BRAF and MEK inhibition with encorafenib plus binimetinib has produced a
    complete clinical and morpho-metabolic response. Evidence is limited to case
    reports, and conventional chemotherapy is poorly effective in this setting.
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: encorafenib
      term:
        id: NCIT:C98283
        label: Encorafenib
    - preferred_term: binimetinib
      term:
        id: CHEBI:145371
        label: binimetinib
  target_mechanisms:
  - target: Constitutive Mitogenic Pathway Activation
    treatment_effect: INHIBITS
    description: >-
      Encorafenib inhibits the mutant BRAF kinase and binimetinib blocks
      downstream MEK, shutting off the constitutive RAS-MAPK output that drives
      proliferation.
    evidence:
    - reference: PMID:39392364
      reference_title: Complete response to encorafenib plus binimetinib in a BRAF V600E-mutant metastasic malignant glomus tumor.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The BRAF V600E mutation has been identified in a subset of malignant GT,
        highlighting a promising therapeutic target.
      explanation: >-
        Identifies BRAF V600E as the actionable target of the combination in
        malignant glomus tumor.
  evidence:
  - reference: PMID:39392364
    reference_title: Complete response to encorafenib plus binimetinib in a BRAF V600E-mutant metastasic malignant glomus tumor.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report the impressive clinical and morpho-metabolic response of a
      metastatic BRAF V600E-mutated glomangiosarcoma after treatment with
      encorafenib and binimetinib.
    explanation: >-
      Single-case evidence of response; supportive but not sufficient to
      establish standard-of-care status.
- name: Symptom-Directed Surveillance for Digital Glomus Tumour in NF1
  action_category: SCREENING
  description: >-
    Digital glomus tumour is part of the NF1 tumour spectrum and is the most
    under-recognised member of it, so the 2023 ERN GENTURIS NF1 tumour
    surveillance guideline manages it by symptom-directed clinical vigilance
    rather than by imaging. Adults with NF1 are assessed clinically at least
    once every three years, and every visit includes history taking and, for
    this tumour, direct questioning about localised tenderness, severe
    paroxysmal pain and cold sensitivity in the fingers and toes together with
    visual inspection of the nail beds and palpation. No routine imaging of
    asymptomatic digits is recommended. The rationale is diagnostic delay rather
    than mortality: patients frequently live with the pain for years without the
    diagnosis being considered, so the yield comes from asking. Because
    NF1-associated lesions are more often multifocal and both local recurrence
    and metachronous tumours are common, excision of one lesion does not end
    surveillance.
  treatment_term:
    preferred_term: periodic clinical assessment with nail-bed inspection and symptom enquiry
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:36684394
    reference_title: ERN GENTURIS tumour surveillance guidelines for individuals with neurofibromatosis type 1.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the oncogenic potential, long-term surveillance is important in
      patients with NF1.
    explanation: >-
      The European Reference Network guideline that frames tumour surveillance
      as standard care in NF1. PARTIAL because the glomus-specific
      recommendations sit in the guideline's full text rather than its abstract
      (see notes).
  - reference: PMID:20530151
    reference_title: 'Diagnosis, management, and complications of glomus tumours of the digits in neurofibromatosis type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumours in NF1 are more common than previously recognised and NF1
      patients should be specifically queried about fingertip or toe pain.
    explanation: >-
      States the surveillance action itself - direct symptom enquiry in every
      NF1 patient - and is the primary series the GENTURIS guideline cites for
      its glomus tumour recommendations.
  - reference: PMID:20530151
    reference_title: 'Diagnosis, management, and complications of glomus tumours of the digits in neurofibromatosis type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is often a delay in diagnosis of many years and clinical suspicion
      is key to diagnosis, although magnetic resonance imaging may be useful in
      some scenarios.
    explanation: >-
      Supplies the rationale for symptom-directed vigilance rather than routine
      imaging, and the reason surveillance is worthwhile at all.
  - reference: PMID:20530151
    reference_title: 'Diagnosis, management, and complications of glomus tumours of the digits in neurofibromatosis type 1.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgical extirpation can be curative; however, local tumour recurrence and
      metachronous tumours are common.
    explanation: >-
      Establishes that surveillance must continue after excision in NF1, because
      recurrence and new metachronous lesions are expected.
  notes: >-
    Provenance caveat. The glomus-specific content of the GENTURIS guideline -
    its Table 13 recommendations and the at-least-three-yearly adult clinical
    assessment - is in the full text of PMID:36684394, whereas the local
    reference cache for that PMID contains the abstract only. Rather than quote
    text that cannot be verified against the cache, the GENTURIS evidence item
    is quoted at abstract level and marked PARTIAL, and the glomus-specific
    actions are evidenced from PMID:20530151, the primary multi-institutional
    series the guideline cites for them.
discussions:
- discussion_id: glomus-subungual-fusion-negative
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What drives the classic painful subungual glomus tumor, given that this
    commonest subset lacks the MIR143-NOTCH fusions that define the disease
    molecularly?
  attaches_to:
  - pathophysiology#MIR143-NOTCH Gene Fusion
  rationale: >-
    The molecular model of glomus tumor rests on MIR143-NOTCH fusions found in
    over half of tumors, but the same cohort reports that the common subungual
    subset - the lesions that produce the classic clinical triad and account for
    most clinical practice - is fusion-negative. The BRAF/KRAS and NF1 arms do
    not fill the gap either: sporadic tumors showed no NF1 or RAS-MAPK
    abnormality, and BRAF V600E is enriched in proximal rather than distal
    lesions. The entry therefore models a driver landscape that does not explain
    its own flagship phenotype. Until this is resolved, no causal edge should be
    drawn from the fusion node to the subungual presentation.
  proposed_experiments:
  - experiment_id: exp_glomus_subungual_fusion_negative_rnaseq
    name: RNA sequencing of fusion-negative subungual glomus tumors
    description: >-
      Sequence a dedicated cohort of classic painful subungual glomus tumors
      confirmed NOTCH-fusion-negative by break-apart FISH, to search for
      alternative fusions, cryptic NOTCH-pathway lesions, or an entirely distinct
      driver class.
  - experiment_id: exp_glomus_site_stratified_profiling
    name: Site-stratified methylation and single-cell profiling
    description: >-
      Compare subungual with deep and visceral glomus tumors by DNA methylation
      classification and single-cell profiling, to test whether they are one
      entity reached by two driver routes or two entities that converge on a
      shared morphology.
  evidence:
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common subungual GT subset lack NOTCH-gene fusions suggesting an
      alternative pathogenesis.
    explanation: >-
      States the gap directly: the commonest clinical subset is not explained by
      the defining molecular driver.
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No abnormalities in NF1 or RAS mitogen-activated protein kinase activation
      were found in sporadic glomus tumors.
    explanation: >-
      Excludes the NF1/RAS-MAPK route as the alternative driver in sporadic
      tumors, narrowing the gap.
- discussion_id: glomus-epidemiology-gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the population incidence of glomus tumor, and is the reported sex
    predominance real or an artifact of which anatomic subset a series samples?
  rationale: >-
    No population-based rate exists, so the prevalence record on this entry
    carries only the qualitative RARE band. The sex data are also internally
    inconsistent across the cited series in a way that looks anatomic rather
    than biological: a hand-only series reports 71% female, whereas a
    molecular-pathology cohort dominated by deep, visceral and NOTCH-rearranged
    tumors reports 82% male among benign fusion-positive cases. These may be two
    different populations rather than a contradiction, but the entry does not
    assert a sex ratio because the evidence cannot currently distinguish those
    possibilities.
  proposed_experiments:
  - experiment_id: exp_glomus_registry_incidence
    name: Registry-based incidence estimation
    description: >-
      Estimate glomus tumor incidence from a population cancer or national
      pathology registry (e.g. SEER), stratified by acral versus deep/visceral
      site, to replace the current qualitative RARE band with a rate.
  - experiment_id: exp_glomus_pooled_sex_ratio
    name: Site-stratified pooled analysis of sex ratio
    description: >-
      Pool published glomus tumor series with site stratification to test whether
      the apparent contradiction between female-predominant hand series and
      male-predominant deep/visceral molecular cohorts is explained by anatomic
      sampling.
  evidence:
  - reference: PMID:34239958
    reference_title: Presentation and Management Outcome of Glomus Tumors of the Hand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Out of 17 patients, majority (n=12; 70.58%) were females.
    explanation: >-
      The female-predominant hand series.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the 34 cases of benign NOTCH-rearranged GT, most occurred in males
      (n=28, 82%)
    explanation: >-
      The male-predominant molecular cohort, drawn from a different anatomic
      distribution.
- discussion_id: glomus-icdo-morphology-unrepresentable
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Where should the ICD-O morphology codes 8711/0 (glomus tumour, benign) and
    8711/3 (glomangiosarcoma) be recorded?
  rationale: >-
    MONDO:0018327 carries the xref ICDO:8711/0, but neither the coarse
    ICDOMorphologyEnum used by classifications.icdo_morphology (whose ten values
    are Carcinoma, Adenocarcinoma, Squamous Cell Carcinoma, Sarcoma, Leukemia,
    Lymphoma, Multiple Myeloma, Melanoma, Glioma, Embryonal Neoplasm) nor
    DiseaseMappings (icd10cm/icd11f/mondo/ncit only) can hold a four-digit ICD-O
    morphology code. Assigning "Sarcoma" would be wrong, since the great majority
    of glomus tumours are benign. The classifications block is therefore
    deliberately omitted from this entry rather than populated incorrectly.
    Resolving this needs a schema change, not a curation change.
  notes: >-
    Escalated to a schema issue as monarch-initiative/dismech#7548 (assigned to
    @cmungall) during review of PR #7484. When that issue is resolved, populate
    this entry with ICD-O 8711/0 for the benign entity and 8711/3 for the
    malignant glomus tumour subtype, then close this discussion.

- name: Loss of Thermoregulatory Shunt Function
  biological_scale: TISSUE
  role: consequence
  description: >-
    The normal glomus body is an arteriovenous anastomosis in the dermis whose
    smooth muscle tone shunts blood away from the capillary bed during cold
    exposure. Tumor-induced distortion of this structure, combined with
    cold-evoked contraction of the tumor's smooth-muscle-like cells and
    sensitization of the surrounding nociceptors, converts a normally innocuous
    cold stimulus into a painful one.
  biological_processes:
  - preferred_term: temperature homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0001659
      label: temperature homeostasis
  evidence:

    modifier: DECREASED
    term:
      id: GO:0046580
      label: negative regulation of Ras protein signal transduction
  - preferred_term: Ras protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  evidence:
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis showed germ line and somatic NF1 mutations in seven
      tumors.
    explanation: >-
      Demonstrates the two-hit germline-plus-somatic NF1 genotype in
      NF1-associated glomus tumors.
  - reference: PMID:19738042
    reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      RAS mitogen-activated protein kinase hyperactivation was observed in
      cultured NF1(-/-) glomus cells, reflecting a lack of inhibition of the
      pathway by functional neurofibromin, the protein product of NF1.
    explanation: >-
      Functional evidence in cultured NF1-null glomus cells linking neurofibromin
      loss directly to RAS-MAPK hyperactivation.
  - reference: PMID:22250039
    reference_title: Mitotic recombination of chromosome arm 17q as a cause of loss of heterozygosity of NF1 in neurofibromatosis type 1-associated glomus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have observed mitotic recombination in 22% of molecularly characterized
      NF1-associated glomus tumors
    explanation: >-
      Identifies mitotic recombination of 17q as a recurrent mechanism for the
      somatic second hit that reduces the germline NF1 variant to homozygosity.
  downstream:
  - target: Constitutive Mitogenic Pathway Activation
    description: >-
      Loss of neurofibromin GAP activity releases RAS, feeding the shared
      constitutive RAS-MAPK node.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19738042
      reference_title: 'Glomus tumors in neurofibromatosis type 1: genetic, functional, and clinical evidence of a novel association.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        RAS mitogen-activated protein kinase hyperactivation was observed in
        cultured NF1(-/-) glomus cells, reflecting a lack of inhibition of the
        pathway by functional neurofibromin, the protein product of NF1.
      explanation: >-
        Directly demonstrates the causal step from neurofibromin loss to RAS-MAPK
        hyperactivation in glomus cells.
- name: GLMN Loss of Function with Somatic Second Hit
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Germline truncating variants in GLMN (glomulin) cause the inherited multiple
    form, glomuvenous malformation. Inheritance is autosomal dominant with
    incomplete penetrance and focal lesions, explained by a paradominant
    (Knudson two-hit) mechanism in which a somatic second hit inactivates the
    remaining wild-type allele locally; in most lesions this second hit is
    acquired uniparental isodisomy of chromosome 1p rather than an intragenic
    mutation. Glomulin normally binds the RING domain of Rbx1 and inhibits its E3
    ubiquitin ligase activity, stabilizing the substrate receptor Fbw7; its loss
    accelerates Fbw7 turnover and raises Cyclin E and c-Myc levels, releasing a
    proliferative brake in the vascular wall and leaving the smooth muscle
    compartment arrested in an incompletely differentiated, glomus-like state
    around distended venous channels.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  genes:
  - preferred_term: GLMN
    term:
      id: hgnc:14373
      label: GLMN
  biological_processes:
  - preferred_term: protein ubiquitination
    modifier: INCREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  evidence:
  - reference: PMID:23375657
    reference_title: Somatic uniparental isodisomy explains multifocality of glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Occurrences of these mutations render the inherited glomulin variant in
      1p22.1 homozygous in the affected tissues without loss of genetic material.
      This finding demonstrates that a double hit is needed to trigger formation
      of a GVM.
    explanation: >-

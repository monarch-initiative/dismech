- category: Clinical
  name: Gastric (Visceral) Glomus Tumor
  description: >-
    Glomus tumor is not a cutaneous-only disease. Beyond the acral and subungual
    sites that dominate clinical practice, tumors arise at deep soft tissue and
    visceral sites, most characteristically in the gastric wall, where the
    antrum is the commonest location. Gastric lesions present as a submucosal
    mass found at endoscopy or on cross-sectional imaging, or with upper
    gastrointestinal bleeding, and are routinely mistaken preoperatively for
    gastrointestinal stromal tumor. They are the same entity as the soft tissue
    lesion - histologically and immunophenotypically comparable, actin- and type
    IV collagen-positive, and negative for the KIT/PDGFRA mutations of GIST -
    are almost always benign, and are cured by complete local resection. They do
    not produce the paroxysmal-pain and cold-sensitivity triad, which depends on
    the dense acral innervation modelled in the nociceptor-rich stroma node.
  phenotype_term:
    preferred_term: Neoplasm of the stomach
    term:
      id: HP:0006753
      label: Neoplasm of the stomach
  evidence:
  - reference: PMID:32337257
    reference_title: 'Gastric Glomus Tumor: A Clinicopathologic and Immunohistochemical Study of 21 Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common location was the antrum, the mean age of patients was 49.3
      years, and the mean tumor size was 2.1 cm.
    explanation: >-
      Establishes the gastric antrum as the characteristic visceral site in a
      21-case surgical series.
  - reference: PMID:32337257
    reference_title: 'Gastric Glomus Tumor: A Clinicopathologic and Immunohistochemical Study of 21 Cases.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of GGTs are benign, and local surgery achieving complete
      resection is the most effective treatment method.
    explanation: >-
      Establishes the benign behaviour and surgical management of the gastric
      presentation, mirroring the acral lesion.
  - reference: PMID:24817939
    reference_title: 'Features of gastric glomus tumor: a clinicopathologic, immunohistochemical and molecular retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results show that GTs in the stomach are histologically and
      immunophenotypically fully comparable with the glomus tumors of peripheral
      soft tissues.
    explanation: >-
      Confirms that the gastric lesion is the same entity as the soft tissue
      glomus tumor rather than a separate, similarly named tumor - the point
      that justifies curating it inside this entry.
  - reference: PMID:24817939
    reference_title: 'Features of gastric glomus tumor: a clinicopathologic, immunohistochemical and molecular retrospective study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

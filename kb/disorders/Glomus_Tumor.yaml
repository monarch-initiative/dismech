has_subtypes:
- name: Solid Glomus Tumor
  display_name: Solid Glomus Tumor
  description: >-
    The most common histologic variant, characterized by nests and sheets of
    uniform glomus cells with relatively inconspicuous vasculature. Typically
    solitary, subungual, and painful.
  evidence:
  - reference: PMID:27184662
    reference_title: Smoothelin and WT-1 expression in glomus tumors and glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed 9 cases of solid glomus tumors (SGT), 8 cases of glomus tumors
      with vascular ectasia (VEGT), 2 cases of glomangiomyomas (GMM) and 6 cases
      of glomuvenous malformation (GM).
    explanation: >-
      An immunohistochemical series that enumerates the recognized histologic
      variants of glomus tumor, including this one.
- name: Glomangioma
  display_name: Glomangioma (Glomuvenous Variant)
  description: >-
    A variant dominated by dilated, cavernous venous-like vascular channels
    rimmed by only a few layers of glomus cells. Glomangiomas account for the
    great majority of multiple and familial lesions.
  evidence:
  - reference: PMID:27184662
    reference_title: Smoothelin and WT-1 expression in glomus tumors and glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed 9 cases of solid glomus tumors (SGT), 8 cases of glomus tumors
      with vascular ectasia (VEGT), 2 cases of glomangiomyomas (GMM) and 6 cases
      of glomuvenous malformation (GM).
    explanation: >-
      An immunohistochemical series that enumerates the recognized histologic
      variants of glomus tumor, including this one.
- name: Glomangiomyoma
  display_name: Glomangiomyoma
  description: >-
    The least common variant, in which glomus cells show transition to elongated,
    frankly mature smooth muscle cells around the vascular channels.
  evidence:
  - reference: PMID:27184662
    reference_title: Smoothelin and WT-1 expression in glomus tumors and glomuvenous malformations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We assessed 9 cases of solid glomus tumors (SGT), 8 cases of glomus tumors
      with vascular ectasia (VEGT), 2 cases of glomangiomyomas (GMM) and 6 cases
      of glomuvenous malformation (GM).
    explanation: >-
      An immunohistochemical series that enumerates the recognized histologic
      variants of glomus tumor, including this one.
- name: Glomuvenous Malformation
  display_name: Glomuvenous Malformation (Familial Multiple Glomangioma)
  description: >-
    An inherited, multifocal cutaneous vascular malformation caused by
    loss-of-function variants in GLMN (glomulin). Lesions are typically multiple,
    blue-purple, compressible plaques or nodules that are less painful than
    solitary solid glomus tumors, and they are inherited in an autosomal dominant
    pattern with incomplete penetrance explained by a paradominant somatic second
    hit.
  evidence:
  - reference: PMID:15689436
    reference_title: 'Four common glomulin mutations cause two thirds of glomuvenous malformations ("familial glomangiomas"): evidence for a founder effect.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomuvenous malformation (GVM) ("familial glomangioma") is a localised
      cutaneous vascular lesion histologically characterised by abnormal smooth
      muscle-like "glomus cells" in the walls of distended endothelium lined
      channels.
    explanation: >-
      Defines glomuvenous malformation as the inherited, glomus-cell-lined
      vascular lesion subtype.
- name: Glomangiomatosis
  display_name: Glomangiomatosis
  description: >-
    A rare variant in the Folpe classification showing the histologic features of
    diffuse angiomatosis together with an excess of glomus cells. Despite its
    infiltrative, angiomatosis-like growth it behaves benignly: no case in the
    defining series metastasized.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomangiomatosis: Tumors with histologic features of diffuse angiomatosis
      and excess glomus cells.
    explanation: >-
      States the Folpe definition of glomangiomatosis as a distinct category in
      the glomus tumor classification scheme.
- name: Symplastic Glomus Tumor
  display_name: Symplastic Glomus Tumor
  description: >-
    A tumor showing high nuclear grade (marked nuclear atypia/pleomorphism) in
    the absence of any other malignant feature. This is explicitly NOT a
    malignant glomus tumor: in the defining series, high nuclear grade alone was
    not associated with metastasis, and no symplastic tumor metastasized. The
    atypia is regarded as degenerative rather than as evidence of malignancy.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Symplastic glomus tumor: Tumors with high nuclear grade in the absence of
      any other malignant feature.
    explanation: >-
      States the Folpe definition of the symplastic category.
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      metastatic disease was not seen in any specimen classified as symplastic
      glomus tumor, glomus tumor of uncertain malignant potential, or
      glomangiomatosis.
    explanation: >-
      Establishes that the symplastic category is prognostically benign, which is
      why it must not be collapsed into malignant glomus tumor.
- name: Uncertain Malignant Potential
  display_name: Glomus Tumor of Uncertain Malignant Potential
  description: >-
    The Folpe intermediate category: tumors that lack the criteria for malignant
    glomus tumor or symplastic glomus tumor but have high mitotic activity with
    superficial location only, or large size only, or deep location only. That
    is, exactly one worrisome feature is present rather than the qualifying
    combination. No tumor in this category metastasized in the defining series.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumor of uncertain malignant potential: Tumors that lack criteria
      for malignant glomus tumor or symplastic glomus tumor but have high mitotic
      activity and superficial location only, or large size only, or deep
      location only.
    explanation: >-
      States the Folpe definition of the uncertain-malignant-potential category
      and its exact feature combination.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventy-two cases were benign, 17 cases were malignant and 4 were of
      uncertain malignant potential.
    explanation: >-
      Independently confirms that the uncertain-malignant-potential category is
      applied in contemporary molecular-pathology cohorts, at roughly 4% of
      tumors.
- name: Malignant Glomus Tumor
  display_name: Malignant Glomus Tumor (Glomangiosarcoma)
  description: >-
    A rare aggressive form defined by deep location together with size greater
    than 2 cm, the presence of atypical mitotic figures, or moderate-to-high
    nuclear grade with at least 5 mitotic figures per 50 high-power fields.
    Capable of local recurrence and distant metastasis. Note that the three
    qualifying criteria are alternatives, and that high nuclear grade alone
    (symplastic glomus tumor) or a single worrisome feature alone (uncertain
    malignant potential) does NOT meet this definition.
  evidence:
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant glomus tumor: Tumors with a deep location and a size of more than
      2 cm, or atypical mitotic figures
    explanation: >-
      States the consensus morphologic criteria that define the malignant glomus
      tumor subtype.
  - reference: PMID:11145243
    reference_title: 'Atypical and malignant glomus tumors: analysis of 52 cases, with a proposal for the reclassification of glomus tumors.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      High nuclear grade alone, infiltrative growth, and vascular space
      involvement were not associated with metastasis.
    explanation: >-
      Bounds the malignancy definition: the features that do NOT by themselves
      qualify a tumor as malignant, which is why symplastic tumors are a separate
      category.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    No population-based incidence or prevalence estimate exists for glomus tumor.
    Frequently repeated proportions (e.g. "1-5% of hand soft tissue tumors")
    derive from surgical-pathology archives, not population registries, and are
    not interpretable as prevalence. The only defensible structured statement is
    the qualitative RARE band; a numeric rate is deliberately omitted rather than
    fabricated. See the KNOWLEDGE_GAP discussion attached to this entry.
  evidence:
  - reference: PMID:27857505
    reference_title: 'Glomus tumours of the hand: Review of literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumours are rare benign vascular neoplasms commonly found in the
      hand particularly in subungual region.
    explanation: >-
      Supports the qualitative RARE occurrence band without asserting a rate.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glomus tumors (GT) are rare mesenchymal neoplasms composed of cells
      resembling the perivascular modified smooth muscle cells of the normal
      glomus body.
    explanation: >-
      Independent confirmation of rarity from a large molecular-pathology series.
pathophysiology:
- name: MIR143-NOTCH Gene Fusion
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    Recurrent somatic rearrangements juxtapose the MIR143 locus in band 5q32 to a
    NOTCH gene family member. NOTCH2 (1p13) is by far the most frequent partner,
    with NOTCH1 (9q34) and NOTCH3 also reported. The rearrangement places a
    truncated NOTCH segment under control of the highly expressed MIR143 locus,
    producing marked overexpression of a ligand-independent NOTCH product in the
    perivascular myoid tumor cell. NOTCH2 and NOTCH3 are the physiologic
    regulators of vascular smooth muscle development, which is consistent with a
    perivascular myoid lineage for the resulting neoplasm. Importantly, the
    common subungual glomus tumor subset is largely fusion-negative, indicating
    that an alternative, still-undefined pathogenesis operates at that site.
  cell_types:
  - preferred_term: glomus cell (modified perivascular smooth muscle cell)
    term:
      id: CL:0000192
      label: smooth muscle cell
  genes:
  - preferred_term: NOTCH2
    term:
      id: hgnc:7882
      label: NOTCH2
  - preferred_term: NOTCH3
    term:
      id: hgnc:7883
      label: NOTCH3
  - preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  - preferred_term: MIR143
    term:
      id: hgnc:31530
      label: MIR143
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: ABNORMAL
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:23999936
    reference_title: Novel MIR143-NOTCH fusions in benign and malignant glomus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A gene fusion involving MIR143 in band 5q32 was identified in both GTs with
      either NOTCH2 in 1p13 in GT1 or NOTCH1 in 9q34 in GT2
    explanation: >-
      Landmark RNA-sequencing study identifying the MIR143-NOTCH fusion as the
      recurrent driver rearrangement of glomus tumor.
  - reference: PMID:23999936
    reference_title: Novel MIR143-NOTCH fusions in benign and malignant glomus tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall NOTCH2 gene rearrangements were identified in 52% of GT, including
      all malignant cases
    explanation: >-
      Quantifies NOTCH2 rearrangement prevalence and its presence in all
      malignant tumors of the series.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      rearrangements of NOTCH genes are seen in over half of GT, with
      NOTCH2-MIR143 being the most common fusion (73%)
    explanation: >-
      Confirms in a 93-tumor cohort that NOTCH fusions occur in the majority of
      glomus tumors, with NOTCH2-MIR143 predominating.
  - reference: PMID:32604167
    reference_title: A Molecular Reappraisal of Glomus Tumors and Related Pericytic Neoplasms With Emphasis on NOTCH-gene Fusions.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The common subungual GT subset lack NOTCH-gene fusions suggesting an
      alternative pathogenesis.
    explanation: >-
      Qualifies the fusion model: the classic painful subungual lesion is
      typically fusion-negative, so the NOTCH mechanism does not explain all
      glomus tumors.
  downstream:
  - target: Glomus Cell Proliferation Around Distorted Vascular Channels
    description: >-
      Deregulated NOTCH signaling in perivascular myoid cells drives clonal
      expansion of the modified smooth muscle cells of the glomus body.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23999936
      reference_title: Novel MIR143-NOTCH fusions in benign and malignant glomus tumors.
      supports: SUPPORT

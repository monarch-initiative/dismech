- name: Thick Filament Interface Disruption and Loss of Super-Relaxed State
  biological_scale: MOLECULAR
  description: >-
    Pathogenic MYL3 variants map onto molecular interfaces of the cardiac thick
    filament, including interfaces of the myosin interacting-heads motif (IHM)
    that hold myosin heads in the energy-conserving super-relaxed (SRX) state.
    Destabilizing these interfaces shifts myosin from SRX toward the disordered
    relaxed (DRX) state, increasing the number of heads available to interact
    with actin and raising ATPase activity. In transgenic mice carrying the
    HCM-associated A57G ELC mutation, the SRX state is inhibited and
    cross-bridges become hypercontractile; the contrasting RCM-associated
    E143K ELC mutation instead stabilizes SRX, indicating that MYL3 variants
    can move the SRX/DRX equilibrium in opposite directions.
  molecular_functions:
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: INCREASED
  cellular_components:
  - preferred_term: myosin filament
    term:
      id: GO:0032982
      label: myosin filament
  evidence:
  - reference: PMID:42372158
    reference_title: "Thick filament molecular interfaces play a critical role in the pathogenesis of hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We identified HCM variants residing in 30 molecular interfaces of the
      complex thick filament interactome, including the two main interfaces of
      the myosin interacting-heads motif (IHM), and interfaces involving the
      MHC, essential and regulatory light chains, and cMyBP-C.
    explanation: >-
      Maps pathogenic variants — including MYL3 (essential light chain)
      variants — onto thick filament and IHM interfaces, supporting interface
      disruption as the proximal structural lesion.
  - reference: PMID:42372158
    reference_title: "Thick filament molecular interfaces play a critical role in the pathogenesis of hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrated earlier disease onset and adverse outcomes in HCM
      patients with pathogenic variants within vs. outside of molecular
      interfaces, emphasizing their importance in normal thick filament
      function and improving risk stratification of patients.
    explanation: >-
      Links interface location of thick filament variants to clinical onset and
      outcome, giving the structural mechanism clinical traction.
  - reference: PMID:32034976
    reference_title: "Ablation of the N terminus of cardiac essential light chain promotes the super-relaxed state of myosin and counteracts hypercontractility in hypertrophic cardiomyopathy mutant mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The hypercontractile activity of A57G-ELC cross-bridges was manifested by
      the inhibition of the SRX state, increased number of myosin heads
      available for interaction with actin, and higher ATPase activity.
    explanation: >-
      Directly demonstrates SRX destabilization and hypercontractility for an
      HCM-causing MYL3 (ELC) mutation in transgenic mice.
  - reference: PMID:34014247
    reference_title: "Cardiomyopathic mutations in essential light chain reveal mechanisms regulating the super relaxed state of myosin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The HCM-A57G and RCM-E143K mutations had antagonistic effects on the
      ATP-dependent myosin energetic states, with HCM-A57G cross-bridges
      fostering the disordered relaxed (DRX) state and the RCM-E143K model
      favoring the energy-conserving SRX state.
    explanation: >-
      Shows that two MYL3 variants shift the SRX/DRX equilibrium in opposite
      directions, mechanistically separating the hypertrophic from the
      restrictive presentation.

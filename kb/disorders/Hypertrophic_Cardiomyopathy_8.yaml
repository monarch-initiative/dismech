  - reference: PMID:37929589
    reference_title: "Meta-Analysis of Penetrance and Systematic Review on Transition to Disease in Genetic Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The penetrance across all genes in nonproband relatives carrying P/LP
      variants identified during cascade screening was 57%
    explanation: >-
      Establishes the ascertainment context of the ~32% MYL3 figure — it is a

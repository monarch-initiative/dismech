inheritance:
- name: Autosomal Dominant
  description: >-
    Most reported MYL3 hypertrophic cardiomyopathy families segregate a
    heterozygous missense variant in an autosomal dominant pattern, with
    incomplete penetrance and late onset described for at least one variant.
    ClinGen's Hypertrophic Cardiomyopathy Gene Curation Expert Panel classifies
    the MYL3-hypertrophic cardiomyopathy relationship as Definitive with
    autosomal dominant inheritance. Penetrance is incomplete, age-dependent, and
    allele-dependent: a meta-analysis of relatives ascertained by cascade
    screening puts MYL3 at about 32%, the lowest of the definitive sarcomere
    genes, while allele-specific pedigree estimates span 40% for p.V79I to 88%
    for p.R94H. Those three figures are not interchangeable and should not be
    averaged — the ~32% value is a pooled cross-study estimate for nonproband
    relatives found by cascade screening, whereas 40% and 88% are
    single-pedigree, allele-specific values whose spread is itself the finding.
    Both pedigree estimates are additionally age-confounded: in the p.V79I
    family the mean age of nonpenetrant carriers was 15 against 47 for penetrant
    carriers.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance

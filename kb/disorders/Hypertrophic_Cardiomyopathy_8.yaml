    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Morpholino knockdown of the MYL3 orthologue in zebrafish, cmlc1, resulted

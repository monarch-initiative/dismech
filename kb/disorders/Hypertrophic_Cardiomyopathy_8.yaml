- name: Cardiomyocyte Hypertrophy, Myocardial Stiffness and Fibrosis
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  description: >-
    Chronically altered myofilament function drives compensatory cardiomyocyte
    hypertrophy with increased passive stiffness and interstitial fibrosis.
    Transgenic A57G-ELC mice show a high level of fibrosis and hypertrophy with
    increased heart weight-to-body weight ratio and enlarged myocytes; the
    E143K-ELC model develops ultrastructural defects and fibrosis that worsen
    with age together with upregulation of stress-response and collagen genes.
    In humans, histopathology of an infant with a MYL3 variant contributed to
    the diagnosis of severe progressive hypertrophic cardiomyopathy.

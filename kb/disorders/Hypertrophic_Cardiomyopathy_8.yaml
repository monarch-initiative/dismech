    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct mutations affecting the same sarcomeric protein can cause either
      dominant or recessive cardiomyopathy.
    explanation: >-
      States the allele-dependent dual inheritance mode for the myosin
      essential light chain.
pathophysiology:
- name: MYL3 Essential Light Chain Variant — Altered Lever-Arm and Actin Contact
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  description: >-
    MYL3 encodes the ventricular/slow-skeletal myosin essential light chain
    (ELC), one of the two light-chain pairs of the hexameric muscle myosin. The
    light chains stabilize the long alpha-helical neck of the myosin head, and
    the cardiac-specific N-terminal extension of the ELC contacts actin and
    prepositions the cross-bridge for force production. Missense variants
    (e.g. Met149Val, Ala57Gly, Glu56Gly, Glu177Gly, Val79Ile, Glu143Lys)
    substitute residues in the ELC that lie at contact surfaces between the
    light chain and the myosin lever arm, altering cross-bridge mechanics
    rather than abolishing the protein. Subtle changes in ELC sequence are
    sufficient to alter cross-bridge properties and produce a pathological
    phenotype.

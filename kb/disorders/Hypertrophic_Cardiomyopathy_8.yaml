  - reference: PMID:22957257
    reference_title: "A novel Myosin essential light chain mutation causes hypertrophic cardiomyopathy with late onset and low expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mutation affects a conserved valine replacing it with a larger
      isoleucine residue in the region of contact between the light chain and
      the myosin lever arm.
    explanation: >-
      Locates a pathogenic MYL3 variant at the light chain-lever arm contact
      surface, supporting the lever-arm mechanism.
  - reference: PMID:21885653
    reference_title: "Structural and functional aspects of the myosin essential light chain in cardiac muscle contraction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results support an important role for the N-terminal ELC extension
      in prepositioning the cross-bridge for optimal force production. Subtle
      changes in the ELC sequence were sufficient to alter cross-bridge
      properties and lead to pathological phenotypes.
    explanation: >-
      Establishes the mechanistic role of the ELC N-terminal extension and that
      small sequence changes suffice to cause disease.

discussions:
- discussion_id: myl3_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history, penetrance, and sudden-death risk of
    MYL3-related hypertrophic cardiomyopathy, and does MYL3 genotype modify
    outcome relative to other sarcomeric genes?
  attaches_to:
  - pathophysiology#MYL3 Essential Light Chain Variant — Altered Lever-Arm and Actin Contact
  - phenotype#Sudden Cardiac Death
  rationale: >-
    MYL3 is a definitive hypertrophic cardiomyopathy gene, but published human
    data are limited to single families and case reports. Penetrance has been
    estimated in exactly one pedigree (40% for p.V79I, counting borderline
    disease), sudden death is asserted as an association without a denominator,
    and no MYL3-stratified outcome cohort exists. Consequently every management
    recommendation in this entry is extrapolated from hypertrophic
    cardiomyopathy generally rather than from MYL3 evidence.
- discussion_id: myl3_loss_of_function_vs_hypercontractility
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does MYL3 Glu143Lys act through loss of function, as originally proposed
    from the human recessive pedigree, or through myosin hypercontractility, as
    characterised in transgenic mice?
  attaches_to:
  - pathophysiology#Thick Filament Interface Disruption and Loss of Super-Relaxed State
  - genetic#MYL3 Glu143Lys (Recessive Allele)
  rationale: >-
    The human recessive pedigree inferred a loss-of-function mechanism from the
    requirement for two mutant alleles and the normal phenotype of
    heterozygotes, and a later study of three consanguineous families found
    biallelic nonsense and splice-acceptor MYL3 alleles with failure of
    zebrafish rescue — strong independent support for genuine loss of function
    in the recessive form. Transgenic E143K mice, by contrast, show increased
    duty ratio, increased actin affinity, increased actin-activated ATPase and
    stabilisation of the super-relaxed state — a hypercontractile, not
    hypomorphic, molecular phenotype. The most likely reconciliation is that
    MYL3 disease is mechanistically split (dominant missense alleles acting by
    altered cross-bridge mechanics; recessive null alleles acting by ELC
    insufficiency), but this has not been shown directly, and it matters
    because myosin-inhibitor therapy is rational only under the
    hypercontractility model and could be harmful under the deficiency model.
  evidence:
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are, however, no reports of DCM associated with MYL3 variants or
      cardiomyopathy associated with likely ELC deficiency due to nonsense or
      essential splice acceptor variants in MYL3.
    explanation: >-
      Frames ELC deficiency from null alleles as a mechanism distinct from the
      previously described missense disease, motivating the two-mechanism
      reading.
- discussion_id: myl3_mouse_to_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the transgenic MYL3 mouse models faithfully reproduce human MYL3
    hypertrophic cardiomyopathy, given that Tg-A57G mice develop eccentric
    hypertrophy with enhanced left ventricular cavity dimension rather than the
    concentric hypertrophy that defines the human disease?
  attaches_to:
  - pathophysiology#Cardiomyocyte Hypertrophy, Myocardial Stiffness and Fibrosis
  - phenotype#Myocardial Fibrosis
  rationale: >-
    Most of the mechanistic content in this entry — super-relaxed state
    inhibition, calcium sensitisation, fibrosis, progressive remodeling — comes
    from transgenic mice expressing human MYL3 A57G or E143K. Echocardiography
    in Tg-A57G mice showed a phenotype of eccentric hypertrophy with enhanced
    left ventricular cavity dimension and no change in wall thickness, which is
    not the human hypertrophic cardiomyopathy morphology; and E143K, a recessive
    allele in humans, is modeled as a dominantly expressed transgene producing
    restrictive cardiomyopathy. The translational validity of these models for
    human CMH8 therefore remains an open question rather than an absence of
    evidence.
  evidence:
  - reference: PMID:23748425
    reference_title: "Discrete effects of A57G-myosin essential light chain mutation associated with familial hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Echocardiography examination showed a phenotype of eccentric hypertrophy
      in Tg-A57G mice, enhanced left ventricular (LV) cavity dimension without
      changes in LV posterior/anterior wall thickness.
    explanation: >-
      Documents the eccentric, cavity-dilating murine morphology that differs
      from the concentric hypertrophy of human hypertrophic cardiomyopathy.
- discussion_id: myl3_skeletal_muscle_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is skeletal myopathy a genuine and generalisable component of MYL3-related
    disease, or was it specific to the original 1996 kindreds?
  attaches_to:
  - pathophysiology#Skeletal Muscle Involvement
  - phenotype#Skeletal Myopathy
  rationale: >-
    The founding report described abnormal skeletal muscle alongside cardiac
    hypertrophy for essential and regulatory light chain mutations together,
    but later MYL3 case reports and cohort screens are cardiac-only and do not
    report systematic skeletal muscle evaluation. Whether skeletal involvement
    is under-ascertained or genuinely absent from most MYL3 genotypes is
    unknown, and no MYL3 series reports muscle biopsy or CK data.

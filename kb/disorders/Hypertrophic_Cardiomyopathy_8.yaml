        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing showed that these individuals were homozygous for a Glu143Lys
      substitution of a highly conserved amino acid that was absent in 150
      controls.
    explanation: >-
      Establishes the homozygous MYL3 Glu143Lys genotype in the affected
      siblings.
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings, coupled with previous studies of myosin light chain
      structure and function in the heart, suggest a loss-of-function disease
      mechanism.
    explanation: >-
      Records the loss-of-function interpretation offered for the recessive
      MYL3 allele.
- name: MYL3 Biallelic Loss-of-Function Variants
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: MYL3
    term:
      id: hgnc:7584
      label: MYL3
  features: >-
    Exome sequencing of three consanguineous Iranian families identified
    homozygous MYL3 variants that go beyond missense: a nonsense allele
    (c.106G>T, p.Glu36Ter), an essential splice-acceptor allele (c.482-1G>A
    predicted to skip exon 5 and disrupt the EF-hand calcium-binding domains),
    and a missense allele (c.170C>A, p.Ala57Asp). Phenotypes ranged from
    infantile- to early-adulthood-onset hypertrophic or dilated cardiomyopathy
    with sudden cardiac death. Morpholino knockdown of the zebrafish MYL3
    orthologue cmlc1 impaired cardiac function and was not rescued by the
    mutant alleles, providing functional support for a true loss-of-function
    mechanism in the recessive form.
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and a presumable homozygous essential splice acceptor variant (c.482-1G>A,
      predicted to result in skipping of exon 5).
    explanation: >-
      Identifies a biallelic essential splice-acceptor MYL3 allele alongside a
      homozygous nonsense allele, extending the mutational spectrum beyond
      missense. (The nonsense and missense alleles are named in the same
      sentence; this bracket-free portion is quoted because the validator
      normalises square-bracketed protein nomenclature.)
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Morpholino knockdown of the MYL3 orthologue in zebrafish, cmlc1, resulted
      in compromised cardiac function, which could not be rescued by
      reintroduction of MYL3 carrying either the nonsense c.106G>T or the
      missense c.170C>A variants.
    explanation: >-
      Zebrafish rescue failure provides functional support that these alleles
      are loss-of-function.
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data demonstrate that homozygous MYL3 loss-of-function variants can
      cause of recessive cardiomyopathy and occurrence of sudden cardiac death,
      most likely due to impaired or loss of myosin essential light chain
      function.
    explanation: >-
      States the loss-of-function conclusion for biallelic MYL3 disease.
diagnosis:
- name: Cardiac magnetic resonance imaging with late gadolinium enhancement
  diagnosis_term:
    preferred_term: Cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The genotype-relevant imaging study. MYL3 disease favours mid-ventricular
    rather than basal septal hypertrophy, and the resulting mid-cavity
    obliteration and apical aneurysm sit in exactly the segments
    echocardiography images worst. In the reported MYL3 case, cardiac MRI was
    what established the apical aneurysm and the delayed gadolinium enhancement,
    both of which then drove the ICD decision.
  results: >-
    Mid-cavity obstruction, left ventricular apical aneurysm and diffuse delayed
    gadolinium enhancement; enhancement burden and aneurysm are themselves
    sudden-death risk markers.
  evidence:
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cardiac MRI detected positive features of left ventricular mid-cavity
      obstruction, left ventricular apical aneurysm and delayed gadolinium
      enhancement
    explanation: >-
      Documents the diagnostic yield of cardiac MRI in a genotyped MYL3 patient,
      including the two findings that changed management.
- name: Transthoracic echocardiography with attention to mid-ventricular segments
  diagnosis_term:
    preferred_term: Transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    First-line imaging, but it must be read with the MYL3 morphology in mind:
    the gradient to look for is mid-cavitary, and its absence at the outflow
    tract is not reassurance. In the reported case echocardiography found a
    mid-cavitary resting gradient with explicitly no outflow tract obstruction
    and no systolic anterior motion. Serial studies are warranted because the
    intracavitary gradient is documented to progress.
  results: >-
    Mid-ventricular-predominant hypertrophy, mid-cavitary resting gradient,
    biatrial dilation and diastolic dysfunction, typically without left
    ventricular outflow tract obstruction or systolic anterior motion.
  evidence:
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTE identified biatrial dilation, LV hypertrophy predominantly in the
      mid-ventricular segments, mid-cavitary rest gradient of 33 mm Hg,
      mild-to-moderate LV systolic dysfunction, grade II diastolic dysfunction
      and no evidence of LVOTO or SAM of the mitral valve at rest.
    explanation: >-
      Records the echocardiographic pattern in a genotyped MYL3 patient,
      including the diagnostically important absence of outflow obstruction.
- name: Ambulatory (Holter) electrocardiographic monitoring
  diagnosis_term:
    preferred_term: Holter monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  description: >-
    Arrhythmia surveillance for sudden-death risk stratification. Detection of
    non-sustained ventricular tachycardia is one of the risk markers that
    determined the ICD recommendation in the reported MYL3 patient.
  results: >-
    Runs of non-sustained ventricular tachycardia; a positive result contributes
    to the sudden-death risk-marker count.
  evidence:
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with Holter monitoring assessment displaying segments of non-sustained
      ventricular tachycardia
    explanation: >-
      Documents the arrhythmia yield of Holter monitoring in a MYL3 carrier.
- name: Multigene hypertrophic cardiomyopathy panel testing
  diagnosis_term:
    preferred_term: Multigene hypertrophic cardiomyopathy panel testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    MYL3 is one of only eight genes with definitive evidence for hypertrophic
    cardiomyopathy and is on essentially all clinical panels, so a standard
    multigene panel — not single-gene MYL3 testing — is the appropriate first
    genetic test. Single-gene MYL3 testing is appropriate only for site-specific
    cascade testing of relatives once a familial variant is known. In
    consanguineous families the panel must be interpreted with recessive
    inheritance in mind, or a homozygous MYL3 genotype will be misread as
    uninformative heterozygosity.
  results: >-
    Identification of a pathogenic MYL3 variant establishes the molecular
    diagnosis and enables cascade testing; a homozygous or compound genotype
    changes both the prognosis and the recurrence risk given to the family.
  evidence:
  - reference: PMID:30681346
    reference_title: "Evaluating the Clinical Validity of Hypertrophic Cardiomyopathy Genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 33 HCM genes, only 8 (24%) were categorized as definitive ( MYBPC3,
      MYH7, TNNT2, TNNI3, TPM1, ACTC1, MYL2, and MYL3)
    explanation: >-
      Justifies including MYL3 on, and restricting testing to, the
      definitive-evidence gene set rather than an oversized panel.
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and a presumable homozygous essential splice acceptor variant (c.482-1G>A,
      predicted to result in skipping of exon 5).
    explanation: >-
      Illustrates the biallelic genotypes that exome-scale testing in
      consanguineous families is needed to detect, and that a
      dominant-inheritance reading of a panel would miss.
  notes: >-
    Deliberately omitted from this section: chromosomal microarray, karyotype,
    FISH, mitochondrial DNA and repeat-expansion testing. There is no copy-number
    or repeat mechanism in MYL3 disease (ClinGen dosage score 0), so those tests
    belong to the differential-diagnosis workup of syndromic or mitochondrial
    left ventricular hypertrophy, not to a MYL3 diagnosis.
treatments:
- name: Beta-Blocker and Other Negative Inotropic Pharmacotherapy
  description: >-
    Symptomatic management of obstructive and diastolic disease follows general
    hypertrophic cardiomyopathy practice — beta-blockers, non-dihydropyridine
    calcium channel blockers, and disopyramide. No MYL3-specific trial or
    cohort evidence exists; treatment is extrapolated from hypertrophic
    cardiomyopathy as a whole.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Unsourced at the MYL3 level by design: no publication reports outcomes of
    negative inotropic therapy in MYL3 carriers specifically.
- name: Cardiac Myosin Inhibition
  description: >-
    Cardiac myosin inhibitors (mavacamten) reduce the fraction of myosin heads
    in the disordered relaxed state and restore the super-relaxed state. This is
    the direct pharmacological counterpart of the MYL3 A57G lesion, which
    inhibits the super-relaxed state and increases the number of myosin heads
    available for actin interaction; the mouse work explicitly proposes
    normalizing myosin motor function with myosin-specific therapeutics to avert
    the hypercontractile state. Whether this benefit is realised in MYL3
    carriers has not been tested clinically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
    - preferred_term: aficamten
      term:
        id: CHEBI:747213
        label: aficamten
  target_mechanisms:
  - target: Thick Filament Interface Disruption and Loss of Super-Relaxed State
    treatment_effect: INHIBITS
    description: >-
      Cardiac myosin inhibitors act on the same super-relaxed/disordered-relaxed
      equilibrium that MYL3 variants perturb.
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      45 (37%) of 123 patients on mavacamten versus 22 (17%) of 128 on placebo
      met the primary endpoint
    explanation: >-
      Randomised phase 3 evidence that cardiac myosin inhibition improves
      exercise capacity and symptoms in obstructive hypertrophic cardiomyopathy.
      Enrolment was not stratified by genotype, so this establishes the drug
      class, not a MYL3-specific effect.
  - reference: PMID:38739079
    reference_title: "Aficamten for Symptomatic Obstructive Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results for all 10 secondary end points were significantly improved
      with aficamten as compared with placebo.
    explanation: >-
      Independent randomised phase 3 confirmation of the myosin-inhibitor class
      effect with a second agent (aficamten, SEQUOIA-HCM). Also not
      MYL3-stratified.
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Future efforts should be directed toward normalization of myosin motor
      function and the use of myosin-specific therapeutics to avert the
      hypercontractile state of E143K-myosin and prevent pathological cardiac
      remodelling.
    explanation: >-
      Provides the mechanistic rationale for myosin-targeted therapy in MYL3
      disease. PARTIAL because it is a proposal from a mouse study, not
      clinical evidence of benefit in MYL3 carriers.
  notes: >-
    Mavacamten and aficamten are both approved/late-phase for symptomatic
    obstructive hypertrophic cardiomyopathy generally. No
    MYL3-genotype-stratified efficacy data exist for either agent; the
    genotype-specific argument here is mechanistic (the SRX/DRX equilibrium
    these drugs act on is the one MYL3 variants perturb), not clinical.
    Mavacamten is deliberately left without an ontology term: NCIT:C174901
    Mavacamten exists but sits under Inotropic Support rather than Pharmacologic
    Substance, so it is not reachable from the ChemicalEntityTerm enum roots and
    would fail term validation, and CHEBI has no mavacamten term. Aficamten
    carries CHEBI:747213. Do not "fix" the missing mavacamten term by
    substituting a poorly fitting one.
    A caution that follows from the two-mechanism controversy recorded in the
    discussions block: myosin inhibition is rational under the
    hypercontractility model but would be expected to worsen disease under the
    ELC-deficiency model that applies to the recessive loss-of-function alleles.
- name: Implantable Cardioverter Defibrillator
  description: >-
    ICD implantation for primary or secondary prevention of sudden cardiac
    death in patients meeting general hypertrophic cardiomyopathy risk criteria.
    MYL3 genotype is not itself an established risk modifier.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Risk stratification for an implantable cardioverter defibrillator (ICD)
      was conducted due to the presence of an LV apical aneurysm, NSVT, LVSD,
      late gadolinium enhancement (LGE) on CMR and SCD in first-degree
      relatives.
    explanation: >-
      Records the risk-marker set that drove the ICD decision in a genotyped
      MYL3 patient — general hypertrophic cardiomyopathy criteria applied to a
      MYL3 carrier, with the apical aneurysm as the genotype-relevant addition.
  notes: >-
    No MYL3-specific sudden-death risk stratification data are available; see
    the knowledge gap on MYL3 natural history. The evidence here documents that
    general risk criteria were applied in one MYL3 case, not that MYL3 genotype
    modifies the indication.
- name: Extended Mid-Ventricular Septal Myectomy
  description: >-
    Surgical septal reduction for drug-refractory obstruction. This is the
    treatment where MYL3 morphology changes the operation rather than merely
    the indication: because the obstruction in this genotype is mid-cavitary
    rather than subaortic, relief requires an extended mid-ventricular myectomy,
    with papillary muscle reorientation where the papillary muscles contribute
    to the obstruction — not a standard subaortic myectomy. Alcohol septal
    ablation, the usual catheter-based alternative, is generally unsuitable
    here, since the septal perforator territory it targets does not supply the
    mid-ventricular hypertrophy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Myectomy
    term:
      id: NCIT:C51591
      label: Myectomy
  evidence:
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by mid-cavitary hypertrophy and restrictive physiology
    explanation: >-
      Establishes the mid-cavitary rather than subaortic location of the
      obstruction, which is the anatomical premise for choosing an extended
      mid-ventricular myectomy. PARTIAL because the source documents the
      morphology, not the operation or its outcome.
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TTE identified biatrial dilation, LV hypertrophy predominantly in the
      mid-ventricular segments, mid-cavitary rest gradient of 33 mm Hg,
      mild-to-moderate LV systolic dysfunction, grade II diastolic dysfunction
      and no evidence of LVOTO or SAM of the mitral valve at rest.
    explanation: >-
      Independently documents a mid-cavitary gradient with explicitly absent
      outflow tract obstruction in a genotyped MYL3 patient. PARTIAL for the
      same reason — it corroborates the anatomy that dictates the procedure
      choice, not the procedure itself.
  notes: >-
    Deliberately unsourced at the level of MYL3 surgical outcomes: no published
    series reports septal reduction therapy in MYL3 carriers, and neither cited
    patient underwent myectomy. The evidence attests the mid-cavitary anatomy;
    the procedural inference from that anatomy is guideline-level hypertrophic
    cardiomyopathy practice, not a MYL3 finding. The contrast with alcohol
    septal ablation is stated for the same reason and carries no MYL3-specific
    evidence.
- name: Heart Transplantation
  description: >-
    Transplantation for end-stage disease, and the marker of how severe the
    recessive loss-of-function form can be: the proband homozygous for the MYL3
    p.Glu36Ter nonsense allele was diagnosed with dilated cardiomyopathy at age
    6 and transplanted soon after, while his brother died of sudden cardiac
    death at age 2.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  evidence:
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He underwent heart transplantation soon after diagnosis.
    explanation: >-
      Documents transplantation in a genotyped biallelic MYL3 patient, the only
      MYL3 case in the literature to reach transplant.
  notes: >-
    A single case. Transplantation is recorded here because it is documented in
    a MYL3 genotype, not because MYL3 carries a published transplant rate.
- name: Oral Anticoagulation
  description: >-
    Anticoagulation for cardioembolic stroke prevention, indicated by atrial
    fibrillation and — independently — by an akinetic left ventricular apical
    aneurysm with thrombus risk. In the reported MYL3 case long-term
    anticoagulation was started after recurrent cardioembolic cerebrovascular
    events, and the entry records the trade-off honestly: an extra-axial
    haemorrhage extending into the posterior fossa was observed and attributed
    to it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: anticoagulant agent
      term:
        id: NCIT:C263
        label: Anticoagulant Agent
  target_mechanisms:
  - target: Atrial Remodeling and Intracavitary Stasis
    treatment_effect: INHIBITS
    description: >-
      Anticoagulation does not remove the stasis substrate; it blocks the
      thrombus-formation step that converts stasis into systemic embolization.
  evidence:
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term anticoagulation was initiated 2 years later when the patient was
      admitted to a specialist stroke unit for a left corona radiata infarct.
    explanation: >-
      Documents initiation of long-term anticoagulation in a genotyped MYL3
      patient for cardioembolic stroke.
  - reference: PMID:35288424
    reference_title: "Mutation of the MYL3 gene in a patient with mid-ventricular obstructive hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concurrent extra-axial haemorrhage extension into the posterior fossa,
      potentially secondary to long-term anticoagulation, was also observed.
    explanation: >-
      Records the bleeding harm attributed to the same therapy. PARTIAL because
      the source itself hedges the attribution ("potentially secondary to").
  notes: >-
    No specific agent is named: the cited case does not state whether a vitamin K
    antagonist or a direct oral anticoagulant was used, so the therapeutic_agent
    is bound at the class level rather than inventing a drug identity.
- name: Genetic Counseling and Cascade Screening
  description: >-
    Family evaluation is central. Cascade screening in a MYL3 family identified
    nine further heterozygous carriers, several with subdiagnostic ECG or
    echocardiographic findings, and recessive inheritance in children with
    cardiomyopathy must be recognised for correct family counseling.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognizing recessive inheritance in children with cardiomyopathy is
      essential for appropriate family counseling.
    explanation: >-
      Directly supports genetic counseling, and specifically recognition of
      recessive MYL3 inheritance, as a management action.
  - reference: PMID:22957257
    reference_title: "A novel Myosin essential light chain mutation causes hypertrophic cardiomyopathy with late onset and low expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cascade screening revealed a further nine heterozygote mutation carriers
    explanation: >-
      Demonstrates the yield of cascade family screening in a MYL3 family.
  notes: >-
    Because penetrance is age-dependent, young genotype-positive relatives
    require ongoing serial evaluation rather than a single normal study.
clinical_trials:
- name: NCT03470545
  phase: PHASE_III
  status: COMPLETED
  description: >-
    EXPLORER-HCM. Randomised, double-blind, placebo-controlled trial of
    mavacamten in adults with symptomatic obstructive hypertrophic
    cardiomyopathy. The pivotal trial establishing cardiac myosin inhibition as
    a disease-directed therapy class — the class whose molecular target is the
    super-relaxed/disordered-relaxed equilibrium that MYL3 variants perturb.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: clinicaltrials:NCT03470545
    reference_title: "A Randomized, Double Blind, Placebo Controlled Clinical Study to Evaluate Mavacamten (MYK-461) in Adults With Symptomatic Obstructive Hypertrophic Cardiomyopathy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is a multicenter, international, double-blind study of the
      administration of mavacamten in participants with symptomatic obstructive
      HCM (oHCM).
    explanation: >-
      Confirms the design and population of the trial underpinning the cardiac
      myosin inhibition treatment entry.
  notes: >-
    Not MYL3-stratified. Enrolment was by phenotype (symptomatic obstructive
    disease), not genotype, and no MYL3 subgroup was reported. Recorded as
    disease-class context for the myosin-inhibitor rationale, not as evidence of
    benefit in MYL3 carriers.
- name: NCT04349072
  phase: PHASE_III
  status: COMPLETED
  description: >-
    VALOR-HCM. Randomised, double-blind, placebo-controlled trial of mavacamten
    in patients already eligible for septal reduction therapy, testing whether
    pharmacological myosin inhibition can avert the procedure. Directly relevant
    to this entry because septal reduction in MYL3 disease means an extended
    mid-ventricular myectomy, a higher-complexity operation than the standard
    subaortic one.
  evidence:
  - reference: clinicaltrials:NCT04349072
    reference_title: "A Randomized, Double-blind, Placebo-controlled Study to Evaluate Mavacamten in Adults With Symptomatic Obstructive Hypertrophic Cardiomyopathy Who Are Eligible for Septal Reduction Therapy"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      will evaluate the effect of mavacamten treatment on reducing the number of
      septal reduction therapy (SRT) procedures performed in subjects with
      symptomatic obstructive hypertrophic cardiomyopathy
    explanation: >-
      Establishes the trial's septal-reduction-avoidance endpoint, which is the
      link between the pharmacotherapy and surgical arms of this entry.
  notes: >-
    Not MYL3-stratified. Note also that eligibility was defined by guideline
    criteria written around subaortic obstruction, so the trial population is
    not the mid-cavity anatomy that characterises MYL3 disease.
- name: NCT05186818
  phase: PHASE_III
  status: COMPLETED
  description: >-
    SEQUOIA-HCM. Randomised, double-blind, placebo-controlled trial of aficamten,
    a second-generation selective cardiac myosin inhibitor, in symptomatic
    obstructive hypertrophic cardiomyopathy. Provides independent confirmation
    of the drug class with a second agent.
  target_phenotypes:
  - preferred_term: Left ventricular outflow tract obstruction
    term:
      id: HP:0032092
      label: Left ventricular outflow tract obstruction
  evidence:
  - reference: clinicaltrials:NCT05186818
    reference_title: "A Phase 3, Multi-Center, Randomized, Double-blind, Placebo-controlled Trial to Evaluate the Efficacy and Safety of CK-3773274 in Adults With Symptomatic Hypertrophic Cardiomyopathy and Left Ventricular Outflow Tract Obstruction"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The purpose of this study is to evaluate the efficacy and safety of
      aficamten (CK-3773274) versus placebo in adults with symptomatic
      hypertrophic cardiomyopathy (HCM) and left ventricular outflow tract
      obstruction.
    explanation: >-
      Confirms the design and population of the aficamten trial cited in the
      cardiac myosin inhibition treatment entry.
  notes: >-
    Not MYL3-stratified, and enrolment required left ventricular outflow tract
    obstruction — the pattern MYL3 patients characteristically do not have. The
    extrapolation to MYL3 mid-cavity disease is mechanistic, not empirical.
histopathology:
- name: Sarcomeric ultrastructural disruption with interstitial and replacement fibrosis
  diagnostic: false
  description: >-
    Myocardial fibrosis progressing with age, together with sarcomeric
    ultrastructural defects, is the tissue-level correlate of MYL3 disease. The
    direct observations are from transgenic mouse models of the MYL3 A57G and
    E143K essential light chain mutations; in humans, histopathology contributed
    to the diagnosis in the infantile MYL3 case, but no published MYL3 series
    describes the human histological pattern in detail.
  finding_term:
    preferred_term: interstitial and replacement myocardial fibrosis
    term:
      id: NCIT:C3044
      label: Fibrosis
  evidence:
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The hearts of mutant-mice demonstrated ultrastructural defects and
      fibrosis that progressively worsened in senescent animals
    explanation: >-
      Direct histological and ultrastructural observation in a MYL3 essential
      light chain mutant model.
  - reference: PMID:23594557
    reference_title: "Infantile hypertrophic cardiomyopathy associated with a novel MYL3 mutation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on genetic and histopathological findings in a 3-month-old
      infant presenting with severe progressive HCM arising from a mutation in
      the gene encoding the essential light chain of myosin (MYL3).
    explanation: >-
      Establishes that human MYL3 histopathology has been examined and
      contributed to a diagnosis. PARTIAL because the abstract states that
      histopathological findings were obtained without describing them, so it
      cannot support any specific tissue finding.
  notes: >-
    Myofiber disarray (HP:0031318) is the classic hypertrophic cardiomyopathy
    histological finding and is very likely present in MYL3 disease, but it is
    deliberately NOT curated here: no cached MYL3 source describes it, and
    asserting it would mean either an unsourced claim or a snippet quoted from a
    non-MYL3 paper. This absence is a gap in the MYL3 literature, not an
    oversight in this entry.
discussions:
- discussion_id: myl3_natural_history_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the natural history, penetrance, and sudden-death risk of
    MYL3-related hypertrophic cardiomyopathy, and does MYL3 genotype modify
    outcome relative to other sarcomeric genes?
  attaches_to:
  - pathophysiology#MYL3 Essential Light Chain Variant — Altered Lever-Arm and Actin Contact
  - phenotype#Sudden Cardiac Death
  rationale: >-
    MYL3 is a definitive hypertrophic cardiomyopathy gene, but published human
    data are limited to single families and case reports. Penetrance is the one
    dimension where this has partly improved: a meta-analysis of
    cascade-screened nonproband relatives places MYL3 at roughly 32%, the lowest
    of the definitive sarcomere genes, and allele-specific pedigree estimates
    run from 40% (p.V79I) to 88% (p.R94H) — so penetrance is now bounded, but
    only as a pooled cross-study figure plus two single-pedigree values, with no
    prospective MYL3 cohort behind any of them and a spread wide enough that no
    single number can be quoted to a family. The rest of the natural history
    remains genuinely unmeasured: sudden death is asserted as an association
    without a denominator, no MYL3-stratified outcome cohort exists, and no
    MYL3-specific survival curve, arrhythmia rate, atrial fibrillation
    incidence, or stroke rate has been published. Consequently every management
    recommendation in this entry is extrapolated from hypertrophic
    cardiomyopathy generally rather than from MYL3 evidence.
- discussion_id: myl3_loss_of_function_vs_hypercontractility
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does MYL3 Glu143Lys act through loss of function, as originally proposed
    from the human recessive pedigree, or through myosin hypercontractility, as
    characterised in transgenic mice?
  attaches_to:
  - pathophysiology#Thick Filament Interface Disruption and Loss of Super-Relaxed State
  - genetic#MYL3 Glu143Lys (Recessive Allele)
  rationale: >-
    The human recessive pedigree inferred a loss-of-function mechanism from the
    requirement for two mutant alleles and the normal phenotype of
    heterozygotes, and a later study of three consanguineous families found
    biallelic nonsense and splice-acceptor MYL3 alleles with failure of
    zebrafish rescue — strong independent support for genuine loss of function
    in the recessive form. Transgenic E143K mice, by contrast, show increased
    duty ratio, increased actin affinity, increased actin-activated ATPase and
    stabilisation of the super-relaxed state — a hypercontractile, not
    hypomorphic, molecular phenotype. The most likely reconciliation is that
    MYL3 disease is mechanistically split (dominant missense alleles acting by
    altered cross-bridge mechanics; recessive null alleles acting by ELC
    insufficiency), but this has not been shown directly, and it matters
    because myosin-inhibitor therapy is rational only under the
    hypercontractility model and could be harmful under the deficiency model.
  evidence:
  - reference: PMID:33288880
    reference_title: "Autosomal recessive cardiomyopathy and sudden cardiac death associated with variants in MYL3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are, however, no reports of DCM associated with MYL3 variants or
      cardiomyopathy associated with likely ELC deficiency due to nonsense or
      essential splice acceptor variants in MYL3.
    explanation: >-
      Frames ELC deficiency from null alleles as a mechanism distinct from the
      previously described missense disease, motivating the two-mechanism
      reading.
- discussion_id: myl3_mouse_to_human_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the transgenic MYL3 mouse models faithfully reproduce human MYL3
    hypertrophic cardiomyopathy, given that Tg-A57G mice develop eccentric
    hypertrophy with enhanced left ventricular cavity dimension rather than the
    concentric hypertrophy that defines the human disease?
  attaches_to:
  - pathophysiology#Cardiomyocyte Hypertrophy, Myocardial Stiffness and Fibrosis
  - phenotype#Myocardial Fibrosis
  rationale: >-
    Most of the mechanistic content in this entry — super-relaxed state
    inhibition, calcium sensitisation, fibrosis, progressive remodeling — comes
    from transgenic mice expressing human MYL3 A57G or E143K. Echocardiography
    in Tg-A57G mice showed a phenotype of eccentric hypertrophy with enhanced
    left ventricular cavity dimension and no change in wall thickness, which is
    not the human hypertrophic cardiomyopathy morphology; and E143K, a recessive
    allele in humans, is modeled as a dominantly expressed transgene producing
    restrictive cardiomyopathy. The translational validity of these models for
    human CMH8 therefore remains an open question rather than an absence of
    evidence.
  evidence:
  - reference: PMID:23748425
    reference_title: "Discrete effects of A57G-myosin essential light chain mutation associated with familial hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Echocardiography examination showed a phenotype of eccentric hypertrophy
      in Tg-A57G mice, enhanced left ventricular (LV) cavity dimension without
      changes in LV posterior/anterior wall thickness.
    explanation: >-
      Documents the eccentric, cavity-dilating murine morphology that differs
      from the concentric hypertrophy of human hypertrophic cardiomyopathy.
- discussion_id: myl3_skeletal_muscle_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is skeletal myopathy a genuine and generalisable component of MYL3-related
    disease, or was it specific to the original 1996 kindreds?
  attaches_to:
  - pathophysiology#Skeletal Muscle Involvement
  - phenotype#Skeletal Myopathy
  rationale: >-
    The founding report described abnormal skeletal muscle alongside cardiac
    hypertrophy for essential and regulatory light chain mutations together,
    but later MYL3 case reports and cohort screens are cardiac-only and do not
    report systematic skeletal muscle evaluation. Whether skeletal involvement
    is under-ascertained or genuinely absent from most MYL3 genotypes is
    unknown, and no MYL3 series reports muscle biopsy or CK data.

    mouse model, augmented active and passive tension in skinned papillary
    muscle fibres accompanies stiff ventricles and physiological, morphologic
    and metabolic remodeling consistent with restrictive cardiomyopathy; in
    humans, homozygous MYL3 Glu143Lys produced mid-cavitary hypertrophy with
    restrictive physiology in childhood. In heterozygous adult-onset disease,
    outflow obstruction and left atrial dilation follow from the same
    hypertrophic substrate.

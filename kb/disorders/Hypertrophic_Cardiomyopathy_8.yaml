name: Hypertrophic Cardiomyopathy 8
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Hypertrophic cardiomyopathy 8 (CMH8; OMIM 608751) is the form of familial
  hypertrophic cardiomyopathy caused by variants in MYL3, the gene encoding the
  ventricular/slow-skeletal myosin essential light chain (ELC). The ELC is a
  structural component of the actomyosin cross-bridge that stabilizes the long
  alpha-helical neck (lever arm) of the myosin head and, through its
  cardiac-specific N-terminal extension, contacts actin. MYL3 was one of the
  first two myosin light chain genes implicated in cardiac hypertrophy, in a
  1996 report describing a rare variant of cardiac hypertrophy accompanied by
  abnormal skeletal muscle. MYL3 is a definitive-evidence hypertrophic
  cardiomyopathy gene but an uncommon one: myosin light chain variants together
  account for roughly 1% of hypertrophic cardiomyopathy, and a systematic
  screen of 186 unrelated probands found no MYL3 mutation at all. Reported
  presentations span late-onset, low-expressivity heterozygous disease through
  severe infantile-onset hypertrophic cardiomyopathy, and a homozygous MYL3
  Glu143Lys genotype causing early-onset, mid-cavitary, restrictive-physiology
  cardiomyopathy in which heterozygous relatives were unaffected. Because the
  MYL3-specific literature is thin, most management is extrapolated from
  hypertrophic cardiomyopathy generally.
category: Mendelian
parents:
- Hypertrophic Cardiomyopathy
synonyms:
- CMH8
- MYL3 hypertrophic cardiomyopathy
- cardiomyopathy, familial hypertrophic, 8

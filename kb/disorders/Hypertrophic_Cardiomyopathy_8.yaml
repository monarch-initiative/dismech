treatments:
- name: Beta-Blocker and Other Negative Inotropic Pharmacotherapy
  description: >-
    Symptomatic management of obstructive and diastolic disease follows general
    hypertrophic cardiomyopathy practice — beta-blockers, non-dihydropyridine
    calcium channel blockers, and disopyramide. No MYL3-specific trial or
    cohort evidence exists; treatment is extrapolated from hypertrophic
    cardiomyopathy as a whole.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Unsourced at the MYL3 level by design: no publication reports outcomes of
    negative inotropic therapy in MYL3 carriers specifically.
- name: Cardiac Myosin Inhibition
  description: >-
    Cardiac myosin inhibitors (mavacamten) reduce the fraction of myosin heads
    in the disordered relaxed state and restore the super-relaxed state. This is
    the direct pharmacological counterpart of the MYL3 A57G lesion, which
    inhibits the super-relaxed state and increases the number of myosin heads
    available for actin interaction; the mouse work explicitly proposes
    normalizing myosin motor function with myosin-specific therapeutics to avert
    the hypercontractile state. Whether this benefit is realised in MYL3
    carriers has not been tested clinically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
  target_mechanisms:
  - target: Thick Filament Interface Disruption and Loss of Super-Relaxed State
    treatment_effect: INHIBITS
    description: >-
      Cardiac myosin inhibitors act on the same super-relaxed/disordered-relaxed
      equilibrium that MYL3 variants perturb.
  evidence:
  - reference: PMID:28371863
    reference_title: "Hypercontractile mutant of ventricular myosin essential light chain leads to disruption of sarcomeric structure and function and results in restrictive cardiomyopathy in mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Future efforts should be directed toward normalization of myosin motor
      function and the use of myosin-specific therapeutics to avert the
      hypercontractile state of E143K-myosin and prevent pathological cardiac
      remodelling.
    explanation: >-
      Provides the mechanistic rationale for myosin-targeted therapy in MYL3
      disease. PARTIAL because it is a proposal from a mouse study, not
      clinical evidence of benefit in MYL3 carriers.
  notes: >-
    Mavacamten is approved for symptomatic obstructive hypertrophic
    cardiomyopathy generally. No MYL3-genotype-stratified efficacy data exist.

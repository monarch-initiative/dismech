  notes: >-
    MYL3 is a definitive hypertrophic cardiomyopathy gene but an uncommon cause.
    Myosin light chain mutations (MYL2 and MYL3 together) were estimated to
    account for about 1% of hypertrophic cardiomyopathy; in a systematic screen
    of 186 unrelated HCM probands, no MYL3 mutation was found at all. No
    population prevalence estimate specific to MYL3-related hypertrophic
    cardiomyopathy is available, so a numeric rate is deliberately omitted.
  evidence:
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two MYL2 missense mutations were identified in two Caucasian families
      while no mutation was found in MYL3.
    explanation: >-
      A systematic screen of 186 unrelated HCM probands for both ventricular
      myosin light chain genes found no MYL3 mutation, establishing that MYL3
      is a rare cause of hypertrophic cardiomyopathy.
  - reference: PMID:12404107
    reference_title: "Systematic analysis of the regulatory and essential myosin light chain genes: genetic variants and mutations in hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, myosin light chain mutations are a very rare cause of HCM
      responsible for about 1% of cases.
    explanation: >-
      Quantifies the combined contribution of the two ventricular myosin light
      chain genes. PARTIAL because the ~1% figure covers MYL2 and MYL3
      together, not MYL3 alone.
inheritance:
- name: Autosomal Dominant
  description: >-
    Most reported MYL3 hypertrophic cardiomyopathy families segregate a
    heterozygous missense variant in an autosomal dominant pattern, with
    incomplete penetrance and late onset described for at least one variant.
    ClinGen's Hypertrophic Cardiomyopathy Gene Curation Expert Panel classifies
    the MYL3-hypertrophic cardiomyopathy relationship as Definitive with
    autosomal dominant inheritance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_d74b9d56-4f2a-4479-8913-1d96ddc28592-2021-06-07T145050.605Z
    reference_title: "MYL3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MYL3 | HGNC:7584 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Definitive"
    explanation: >-
      ClinGen classifies the MYL3-hypertrophic cardiomyopathy gene-disease
      relationship as definitive with autosomal dominant inheritance.
- name: Autosomal Recessive
  description: >-
    A distinct recessive presentation is documented: three siblings homozygous
    for MYL3 Glu143Lys developed severe childhood-onset cardiomyopathy with
    mid-cavitary hypertrophy and restrictive physiology, while family members
    carrying a single Glu143Lys allele had normal echocardiograms and ECGs even
    in late adulthood. Distinct variants in the same gene can therefore act
    dominantly or recessively.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family members with one Glu143Lys allele had normal echocardiograms and
      ECGs, even in late adulthood, whereas those with two mutant alleles
      developed severe cardiomyopathy in childhood.
    explanation: >-
      Demonstrates a recessive mode of inheritance for the MYL3 Glu143Lys
      allele, with unaffected heterozygous carriers.
  - reference: PMID:12021217
    reference_title: "Myosin light chain mutation causes autosomal recessive cardiomyopathy with mid-cavitary hypertrophy and restrictive physiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Distinct mutations affecting the same sarcomeric protein can cause either
      dominant or recessive cardiomyopathy.
    explanation: >-
      States the allele-dependent dual inheritance mode for the myosin
      essential light chain.
pathophysiology:
- name: MYL3 Essential Light Chain Variant — Altered Lever-Arm and Actin Contact
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  biological_scale: MOLECULAR
  description: >-
    MYL3 encodes the ventricular/slow-skeletal myosin essential light chain
    (ELC), one of the two light-chain pairs of the hexameric muscle myosin. The
    light chains stabilize the long alpha-helical neck of the myosin head, and
    the cardiac-specific N-terminal extension of the ELC contacts actin and
    prepositions the cross-bridge for force production. Missense variants
    (e.g. Met149Val, Ala57Gly, Glu56Gly, Glu177Gly, Val79Ile, Glu143Lys)
    substitute residues in the ELC that lie at contact surfaces between the
    light chain and the myosin lever arm, altering cross-bridge mechanics
    rather than abolishing the protein. Subtle changes in ELC sequence are
    sufficient to alter cross-bridge properties and produce a pathological
    phenotype.

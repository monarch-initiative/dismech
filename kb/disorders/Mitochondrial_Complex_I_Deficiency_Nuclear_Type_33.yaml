      label: NDUFA6
  genetic_context:
    genes:
    - preferred_term: NDUFA6
      term:
        id: hgnc:7690
        label: NDUFA6
    allele_type: missense, nonsense, start-loss and frameshift alleles across four families
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Six alleles in four unrelated children: two homozygous families and two
      compound-heterozygous ones. Parental DNA was analysed in each family and supported
      recessive inheritance.
    notes: >-
      The zygosity slot takes a single value and HOMOZYGOUS is the one that fits the two
      consanguineous families; subjects 1 and 4 are compound heterozygous, which the
      description and the surrounding prose record because the slot cannot. Two of the
      alleles need a caveat rather than a flat loss-of-function reading. The c.331_332del
      frameshift sits in the terminal exon and is predicted to escape nonsense-mediated
      decay, and transcript was in fact normal in the patient's fibroblasts, so the loss is
      at the protein level rather than the message level. The c.3G>A start-loss allele is
      the one the paper is least certain about: against the longer NDUFA6 isoform it would
      read as p.Met27Ile, a change in silico tools call tolerated, and that subject had
      normal complex I activity in muscle. LOSS_OF_FUNCTION is the category ClinGen also
      records for this gene-disease relationship, but subject 3 is the reason this entry
      does not treat every allele as equivalent.

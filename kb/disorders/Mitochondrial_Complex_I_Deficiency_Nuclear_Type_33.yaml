name: Mitochondrial Complex I Deficiency, Nuclear Type 33
category: Mendelian
creation_date: "2026-09-08T00:00:00Z"
synonyms:
- MC1DN33
- mitochondrial complex 1 deficiency, nuclear type 33
- NDUFA6-related mitochondrial complex I deficiency
- NDUFA6-related primary mitochondrial disease
- NDUFA6 deficiency
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 33
  term:
    id: MONDO:0032636
    label: mitochondrial complex I deficiency, nuclear type 33
description: >-
  MC1DN33 is the complex I deficiency caused by biallelic variants in NDUFA6. Four unrelated
  children were reported in a single 2018 paper, and a PubMed search in September 2026 for
  NDUFA6 together with disease, deficiency, syndrome, case or proband returned no further
  patient report; ClinGen's Mitochondrial Diseases expert panel, curating in April 2024,
  likewise describes the 2018 paper as the first and only report.

  NDUFA6 - also called LYRM6 - is a 15 kDa accessory subunit of the Q-module, the part of
  complex I that reduces ubiquinone. It carries an LYR motif that binds the mitochondrial
  acyl carrier protein NDUFAB1, and the NDUFA6/NDUFAB1 pair sits at the interface between
  the Q-module and the proton-pumping membrane arm. Complexome profiling of patient
  fibroblasts shows what its loss costs: NDUFA6 itself is markedly reduced in the assembled
  enzyme, NDUFAB1, NDUFA7 and NDUFA12 go with it, and N-module subunits are reduced or
  absent. The authors' reading is that NDUFA6 may be a prerequisite for NDUFA7 and NDUFA12
  incorporation, so that its absence stalls assembly before the N-module can be added; they
  offer that as a possibility rather than a demonstration.

  What accumulates instead of holoenzyme is an approximately 830 kDa intermediate consisting
  of the P- and Q-modules with the late assembly factor NDUFAF2 still bound. That retention
  is itself informative, because the same thing happens when N-module subunits are mutated,
  which is the observation behind the idea that NDUFAF2 release is an assembly checkpoint.
  More surprisingly, this stalled intermediate still enters supercomplexes with fully
  assembled complexes III and IV - a supercomplex that is not a functional respirasome,
  because it has no NADH dehydrogenase activity.

  The clinical range in four children is wide and this entry keeps it visible rather than
  smoothing it. One infant died of relentless lactic acidosis at about 51 hours of age and
  another at 13 weeks; a third has survived into his teens with a slowly progressive
  spastic leukoencephalopathy and preserved cognition; the fourth is alive at ten with an
  epileptic encephalopathy and basal ganglia disease. Biochemistry tracks that severity
  only in part. Muscle complex I activity was 44 and 46 percent of control in the first two,
  but was normal in the third despite a demonstrable assembly defect in his fibroblasts - a
  combination the authors call most unusual and try to explain through an alternative
  longer NDUFA6 isoform in which his start-loss allele would act as a tolerated missense
  change.

  Lentiviral expression of wild-type NDUFA6 corrected the assembly defect in all three cell
  lines tested and restored in-gel complex I activity in two, which is the experiment that
  makes the variants causal rather than merely associated.

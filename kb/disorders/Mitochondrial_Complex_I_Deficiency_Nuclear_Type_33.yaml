- name: Lactate Accumulation and Metabolic Acidosis
  biological_scale: ORGANISM
  description: >-
    Three of the four children had raised lactate, and in two it was the proximate cause of
    death. Subject 1's blood lactate rose from 5.9 to over 20 mmol per litre before she died
    at about 51 hours. Subject 4's blood gas lactate ran between 16.9 and 18.5 with a CSF
    lactate of 10.9, and her acidosis was unrelenting to death at 13 weeks. Subject 3 had
    persistently elevated CSF lactate at 5.0 and later 5.6 mmol per litre. Subject 2 is the
    exception, with normal lactate in both blood and cerebrospinal fluid - though magnetic
    resonance spectroscopy did show elevated lactate in multiple brain areas.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactic acidosis exhibited relentless progression with a blood lactate reading in excess of 20 mM immediately before death at approximately 51 hr of age."
    explanation: The terminal course in the first patient, where the acidosis was the lethal event.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT

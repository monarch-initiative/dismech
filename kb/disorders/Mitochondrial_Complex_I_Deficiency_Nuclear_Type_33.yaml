- name: Loss of NDUFA6 from the Complex I Q-Module
  biological_scale: MOLECULAR
  description: >-
    NDUFA6 is an accessory subunit of the Q-module, the ubiquinone-reducing part of the
    peripheral arm. Complexome profiling of the three patients with available fibroblasts
    shows a marked reduction of NDUFA6 incorporated into complex I. Its LYR motif is what
    binds the mitochondrial acyl carrier protein encoded by NDUFAB1, a binding first
    demonstrated by deleting the orthologous gene in the yeast Yarrowia lipolytica, where
    loss of the subunit removed ACPM1 from the enzyme and paralysed ubiquinone reductase
    activity.

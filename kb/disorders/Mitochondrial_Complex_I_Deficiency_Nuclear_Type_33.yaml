- name: Stalled 830 kDa Complex I Assembly Intermediate
  biological_scale: MOLECULAR
  description: >-
    Assembly proceeds and then stops. Blue native electrophoresis of patient mitochondria
    shows reduced fully assembled complex I with subcomplexes present that are absent from
    controls, and complexome profiling identifies the stall point: an approximately 830 kDa
    intermediate consisting of the P- and Q-modules but lacking the N-module, with the late
    assembly factor NDUFAF2 still bound to it. NDUFAF2 retention has previously been seen
    when the N-module subunits NDUFV1 and NDUFS4 are mutated, and it is the observation
    behind the idea that NDUFAF2 release is a checkpoint in holoenzyme assembly. All other
    OXPHOS complexes were unaffected, which is what makes the deficiency isolated.

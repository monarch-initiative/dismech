pathophysiology:
- name: Biallelic NDUFA6 Variant
  biological_scale: MOLECULAR
  description: >-
    Two damaged copies of NDUFA6. Six distinct alleles are known across the four children,
    and they span most of the ways a small gene can be broken. Subject 1 is compound
    heterozygous for c.191G>C (p.Arg64Pro) and c.265G>T (p.Glu89*); subject 2 is homozygous
    for the two-base deletion c.331_332del (p.Glu111Serfs*35); subject 3 is homozygous for
    c.3G>A, which abolishes the initiation methionine; subject 4 is compound heterozygous
    for the frameshifts c.309del (p.Met104Cysfs*35) and c.355del (p.Leu119Tyrfs*20). None of
    the six is seen homozygous in gnomAD.

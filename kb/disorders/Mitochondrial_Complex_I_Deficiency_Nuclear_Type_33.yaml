    preparation was used, so the binding records a therapeutic recombinant G-CSF and no
    more. No target_mechanisms link is declared, because the
    neutropenia it treats is deliberately left unwired in the pathograph - the source does not
    connect it to the complex I defect and this entry does not invent a node to receive the
    edge.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Long-standing neutropenia, first noted at 2 years, was treated with granulocyte colony-stimulating factor."
    explanation: The treatment and the indication for it, in the one patient who received it.
discussions:
- discussion_id: mc1dn33_normal_enzymology_in_subject_3
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Isolated Complex I Deficiency"
  - "pathophysiology#Biallelic NDUFA6 Variant"
  prompt: >-
    Why did the child with a start-loss NDUFA6 variant have normal complex I activity in
    muscle?
  rationale: >-
    Subject 3 is homozygous for c.3G>A, which abolishes the initiation methionine of the
    predominant transcript, and yet his muscle complex I enzymology was normal. His
    fibroblasts nonetheless showed a marked isolated assembly defect on blue native
    electrophoresis, and failed to grow when forced onto oxidative phosphorylation in
    galactose medium. The authors call the combination most unusual and say so plainly: it
    is common for fibroblasts to look normal when muscle is deficient, but the reverse is
    not.

    Two explanations are offered and neither is settled. The first is the longer NDUFA6
    isoform: against transcript NM_002490.4 the same nucleotide change reads as p.Met27Ile,
    which in silico tools call tolerated, so if the long isoform is expressed in muscle it
    would supply functional protein there. The second is leaky initiation, where translation
    starts at various in-frame methionines and Met1- and Met27-containing polypeptides
    coexist, diluting the effect. Both were tested as far as the available methods allowed
    and neither could be confirmed: tryptic fragments from complexome profiling were
    uninformative about which methionine was used, and the antibodies available did not
    work on the target protein in either subject or control tissue.

    This is not an academic point. It is the reason a normal muscle complex I assay does not
    exclude MC1DN33, which is the diagnostic conclusion the paper itself draws, and it is
    why any reinterpretation of a variant in this gene has to state its transcript.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the situation for subject 3—normal enzymatic activity in muscle despite a demonstrable complex I assembly defect—is most unusual"
    explanation: The observation itself, with the authors' own assessment of how odd it is.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The existence of the longer NDUFA6 isoform (UniProt: P56556) could explain the normal complex I activity reported for subject 3, whose variant would instead act as a homozygous missense variant in the encoding transcript (c.81G>A [p.Met27Ile])."
    explanation: The first candidate explanation, at the strength the authors give it.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Attempts to assess whether an alternative methionine was selected for translation initiation in vivo have been unsuccessful; analysis of tryptic fragments of subject proteins produced during complexome profiling was uninformative, and commercially available antibodies have failed to conjugate successfully with the target protein in subject and control tissues"
    explanation: >-
      Why the question is open rather than answered: both routes to testing it were tried and
      both failed for technical reasons.
  proposed_experiments:
  - experiment_id: exp_mc1dn33_translation_initiation_site
    name: Determine which NDUFA6 initiation methionine is used, and in which tissue
    description: >-
      Ribosome profiling, or targeted N-terminomics, on muscle and fibroblasts from a
      c.3G>A homozygote would say directly whether translation initiates at Met1, Met27 or
      both, and whether the balance differs between the two tissues. That distinguishes the
      long-isoform explanation from the leaky-initiation one, which the antibody and tryptic
      fragment approaches could not. A tissue difference would additionally explain why the
      assembly defect appears in fibroblasts and not in muscle.
    readouts:
    - name: Translation initiation site usage across NDUFA6 transcripts
      target: "pathophysiology#Biallelic NDUFA6 Variant"
      direction: ALTERED
      interpretation: >-
        Initiation predominantly at Met27 in muscle and not in fibroblasts would support the
        isoform explanation; mixed initiation in both would support leaky initiation.
    would_support:
    - "pathophysiology#Isolated Complex I Deficiency"
    supporting_outcome:
    - >-
      Muscle-predominant initiation at Met27 would explain the preserved muscle enzymology
      without weakening the case that the variant is pathogenic in other tissues.
- discussion_id: mc1dn33_severity_spectrum
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - "pathophysiology#Impaired Mitochondrial Respiration"
  - "pathophysiology#White Matter and Deep Grey Matter Injury"
  prompt: >-
    What determines whether a child with biallelic NDUFA6 variants dies in the first weeks or
    survives into the second decade?
  rationale: >-
    The four reported children span almost the whole range a mitochondrial disease can span.
    Two died in infancy of unrelenting lactic acidosis, at 51 hours and 13 weeks. Two are
    alive years later, one with a slowly progressive spastic leukoencephalopathy and
    preserved cognition, the other with an epileptic encephalopathy and basal ganglia
    disease.

    Something does track with severity at the cellular level. Complexome profiling shows the
    reduction of N-module subunits was most marked in subject 1, the child who died fastest,
    and the loss of NDUFA7 and NDUFA12 correlated with the degree of NDUFA6 loss; her
    respirometry was remarkably impaired where the other two were near control. So biochemical
    depth and clinical severity move together across the series.

    What that does not do is explain the range from the genotype. Subject 1 carries a missense
    and a nonsense allele; subject 4, who also died in infancy, carries two frameshifts;
    subject 2, who survived, carries a homozygous frameshift predicted to escape
    nonsense-mediated decay and confirmed to produce normal transcript levels. A severity
    ordering read off allele class alone would not put subjects 2 and 4 on opposite sides of
    the line. With four patients, one report and no functional data at all from subject 4, the
    honest position is that the modifier is unidentified rather than that the genotype
    explains it.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A clear reduction of N-module subunits was visible, particularly in the most severely affected individual, subject 1 (Figure 4B, boxed area), correlating the assembly defect with the observed phenotypic severity."
    explanation: The correlation the authors draw between assembly-defect depth and clinical severity.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subject 1, who presented with the most aggressive clinical course, had the most marked reduction in fully assembled complex I, whereas subjects 2 and 3 (whose presentations were less severe) also had impaired complex I assembly, although to a lesser extent."
    explanation: >-
      The same gradient measured on blue native electrophoresis, which is the second
      independent assay to show it.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In fact, investigation of cDNA from fibroblasts showed a normal amount of NDUFA6 transcript"
    explanation: >-
      Why the surviving patient's frameshift allele is not a transcript-level null, which is
      part of why allele class alone does not order the severity.
- discussion_id: mc1dn33_no_disease_modifying_treatment
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#
  prompt: >-
    Is there any disease-modifying treatment to curate for NDUFA6 deficiency?
  rationale: >-
    No. Nothing disease-modifying is reported for any of these four children, no treatment
    response is described, and no trial has been registered for the gene or the disorder.

    What the treatments block holds is the three symptomatic measures the paper actually
    records, each in one patient: intrathecal baclofen and botulinum toxin for spasticity,
    a gastrostomy tube for an unsafe swallow, and granulocyte colony-stimulating factor for
    neutropenia. All three address complications, none is reported with an outcome, and one
    of the two treated children is severely disabled while the other has drug-resistant
    seizures. They are curated because they are documented facts about these patients, not
    because they amount to a management strategy. The intensive care both dying infants
    received - inotropes, fresh frozen plasma, transfusion, bicarbonate, ventilation - is
    described in the progression block rather than curated as treatment, because the source
    records it as a level of care rather than as intervention with an indication.

    The lentiviral complementation is not a treatment. It is the experiment that established
    causality, it is curated under experimental_models with its limitations, and the authors
    present it as proof of pathogenicity. Reading it as gene therapy in prospect would be an
    inference the source does not make.

    Generic supportive management of mitochondrial encephalopathy is ready-made content that
    would look right here and is deliberately not imported. Asserting of four NDUFA6 patients
    an experience recorded only of other people with other genotypes would make the entry
    look more complete and be less true.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures remained problematic despite medical treatment, and he also suffered significant gastro-esophageal reflux with multiple episodes of aspiration pneumonia"
    explanation: >-
      The one explicit statement about treatment response in the series, and it is a failure
      of symptomatic control rather than a disease-modifying result.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite intensive-care management in a tertiary care center, her lactic acidosis continued until her death at 13 weeks of age."
    explanation: >-
      What maximal supportive care achieved in the fourth patient, which is the closest the
      source comes to a treatment outcome.
notes: >-
  Scope decision: DISEASE, curated as a standalone entry, consistent with every other MC1DN
  type in the knowledge base (nuclear types 1, 2, 3, 6, 12, 14, 21, 23, 24, 31, 34, 36 and
  39). MONDO:0032636 has one superclass, MONDO:0100223 mitochondrial complex I deficiency
  nuclear type, and no descendants, so it is a leaf in the series rather than a grouping.
  The stub is deleted by this change.

  On the entity boundary. Two framings coexist and both are kept visible. MONDO and OMIM file
  this as nuclear complex I deficiency type 33 (OMIM 618253), which is the name the entry
  carries. ClinGen's Mitochondrial Diseases expert panel, applying its lumping and splitting
  framework in April 2024, curated the same gene as NDUFA6-related primary mitochondrial
  disease, explicitly noting NDUFA6 has been associated with a single disease entity to date.
  There is no disagreement about any fact between them; the entry uses the MONDO name because
  that is what the knowledge base keys on, and carries the ClinGen name as a synonym.

  This entry is deliberately not a Leigh syndrome entry and none of the four children was
  given that diagnosis. That distinguishes it from sibling entries MC1DN34 and MC1DN36, where
  Leigh syndrome is the presentation and is curated as an OBLIGATE phenotype. Here the imaging
  phenotype is a leukoencephalopathy in three children and a basal ganglia lesion in two, and
  the entry binds those separately rather than importing a syndrome label the source does not
  use.

  On the Named Entity Confusion risk, which is substantial for this gene and was actively
  managed. A PubMed search for NDUFA6 returns 58 records, of which exactly one is the disease
  report. The rest are dominated by common-variant association and expression-signature work -
  schizophrenia risk, tetralogy of Fallot, multiple myeloma, glioma, thyroid cancer, sepsis,
  preeclampsia, liver ischaemia-reperfusion, a lncRNA called NDUFA6-DT - none of which is
  cited anywhere in this entry. The trap is written into the genetic notes so the next curator
  does not have to rediscover it. The separate transcript trap, where the same nucleotide
  change is pathogenic or tolerated depending on which NDUFA6 isoform it is numbered against,
  is recorded there as well and is the subject of the discussion
  mc1dn33_normal_enzymology_in_subject_3.

  What is deliberately not curated. There is no biochemical block: the complex I enzymology
  and the lactate are the disease's substantive measurements and are curated as phenotypes and
  pathophysiology nodes. There are no clinical trials - none is registered. Several findings
  reported once are described in prose rather than bound as phenotypes because nothing
  connects them to the disease: subject 1's clotting abnormality, raised gamma-glutamyl
  transpeptidase and echogenic liver areas, subject 3's accessory nipple, mild hypospadias and
  slightly low CSF homovanillic acid, subject 1's decreased cortical folding and mild
  cerebellar hypoplasia. Sparse hair is bound despite being a single-patient finding, because
  two deceased second cousins in the same family were reported to share it; the phenotype note
  records that this is suggestive and untestable rather than established.

  Pathograph wiring. Three phenotypes are deliberately left unwired and each says so in its
  own notes: intrauterine growth retardation, decreased total neutrophil count and sparse
  hair, because the source proposes no mechanism for any of them, and because inventing a node
  to receive those edges would assert causation nobody has claimed. Hypoglycaemia and
  hyperammonaemia are wired but with INDIRECT_UNKNOWN_INTERMEDIATES and an explicit
  description saying the edge is a placement rather than an explanation.

  On the animal models. Neither is a model of this disease and both are labelled as such. The
  Yarrowia lipolytica deletion is where the subunit's function was established and it
  RECAPITULATES the loss of the subunit from the enzyme, but the yeast failure mode is
  catalytic where the human one is an assembly defect; a yeast is also not an animal, and it
  sits in animal_models only because the schema has no better section. The C. elegans
  nuo-3(G60D) allele runs in the opposite direction entirely - it is a gain-of-activity
  suppressor recovered in a screen for rescue of other complex I mutants - and is curated as
  PERTURBS with LOW fidelity purely because ClinGen counts it among the experimental evidence
  for the gene-disease relationship. A PubMed search in September 2026 for an Ndufa6 knockout
  mouse returned no hits. The HEK293T knockout that ClinGen also cites (PMID:27626371) is not
  cited directly: its cached record is abstract-only and the abstract does not name NDUFA6, so
  any quote from it would attest to the paper's existence rather than to a fact about this
  subunit. The ClinGen narrative, which does name it, is quoted instead.

  On the ClinGen record. The CGGV assertion cited here was rebuilt during this curation
  because it was not in the committed cache. The rebuild used the ClinGen gene-validity CSV as
  downloaded on 2026-09-08, which no longer matches the sha256 pinned in
  data/clingen/MANIFEST.yaml - ordinary upstream release drift, which the manifest's own
  comments describe as expected. The NDUFA6 row is byte-identical between the pinned-era copy
  in the primary checkout and the current download, and the assertion itself is dated
  2024-04-29, so the record is not affected by the drift. Repinning the manifest is a separate
  change and is deliberately not made here.

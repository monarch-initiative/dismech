      term:
        id: NCIT:C1287
        label: Recombinant Granulocyte Colony-Stimulating Factor
  notes: >-
    No effectiveness claim is made; the paper records the treatment and not its result. The
    modality is tagged PROTEIN_REPLACEMENT because therapeutic G-CSF is a recombinant
    cytokine given as a protein rather than a small molecule. The agent is bound to the NCIT
    term for recombinant G-CSF rather than to the endogenous cytokine term (NCIT:C20438),

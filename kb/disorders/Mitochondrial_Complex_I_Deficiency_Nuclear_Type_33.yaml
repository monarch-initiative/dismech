phenotypes:
- name: Decreased Activity of Mitochondrial Complex I
  category: Metabolism
  description: >-
    Isolated complex I deficiency in muscle at 44 and 46 percent of control in subjects 1 and
    2. Subject 3 is the informative exception: normal complex I enzymology in muscle despite
    a marked isolated assembly defect in his fibroblasts.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex I
    term:
      id: HP:0011923
      label: Decreased activity of mitochondrial complex I
  notes: >-
    Two of the three children in whom respiratory-chain enzymology was performed, and
    explicitly normal in the third; no tissue was available from subject 4. So 2/3 of those
    assayed, or 2/4 of the series, either of which lands in FREQUENT. This is a count in a
    four-patient series and not a population frequency. The band deliberately does not
    reach OBLIGATE precisely because subject 3 contradicts it - the disease is defined
    molecularly here, not enzymatically.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory-chain analyses of muscle biopsy confirmed isolated complex I deficiency in subjects 1 and 2 (44% and 46% of control subjects, respectively)"
    explanation: The measurement, with the residual activity figures.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "the situation for subject 3—normal enzymatic activity in muscle despite a demonstrable complex I assembly defect—is most unusual"
    explanation: >-
      The patient who contradicts the phenotype, in the authors' own words. Recorded as
      REFUTE against the claim that this finding is general to the disease, which is why the
      band is FREQUENT rather than OBLIGATE.
- name: Lactic Acidosis
  category: Metabolism
  description: >-
    Metabolic acidosis driven by lactate, and the immediate cause of death in the two infants
    who died. Subject 1 had a capillary pH of 7.12 with lactate 5.9 mmol per litre within an
    hour of birth, rising above 20 before death at about 51 hours. Subject 4's blood pH fell
    from 7.308 to 7.076 with blood gas lactate of 16.9 to 18.5 mmol per litre, and the
    acidosis continued to her death at 13 weeks.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  notes: >-
    Two of the four children, so 2/4, inside the FREQUENT band. Subject 3 had raised CSF
    lactate without a recorded systemic acidosis and subject 2 had normal lactate
    altogether, so neither is counted here; both are covered by the separate raised-lactate
    phenotype and by the pathophysiology node. A count in a four-patient series, not a
    population frequency.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactic acidosis exhibited relentless progression with a blood lactate reading in excess of 20 mM immediately before death at approximately 51 hr of age."
    explanation: The acidosis and its lethal course in the first patient.

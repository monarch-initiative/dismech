prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four children in four unrelated families in a single 2018 report. ClinGen's expert panel,
    curating in April 2024, describes that paper as the first and only report of the gene in
    autosomal recessive primary mitochondrial disease, and a PubMed search in September 2026
    for NDUFA6 together with deficiency, disease, syndrome, case or proband returned no
    additional patient report. No population estimate exists and none could be made from an
    ascertainment that ran through targeted sequencing in one family, exome sequencing in two,
    genome sequencing in a fourth, and GeneMatcher to connect them. The prevalence_class is
    the numeric floor tier; no rate_per_100000 is given because none has been reported.
  evidence:
  - reference: CGGV:assertion_11d2d522-feca-41a7-87d5-fb11135902d2-2024-04-29T040000.000Z
    reference_title: "NDUFA6 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The first and only report of NDUFA6 in relation to autosomal recessive primary mitochondrial disease was in 2018 (PMID: 30245030)."
    explanation: >-
      An independent expert panel confirming, six years later, that the series had not grown.
      Graded OTHER because a curation narrative is an expert synthesis rather than a study.
progression:
- phase: Neonatal or early infantile lethal presentation
  notes: >-
    Two of the four children died in the first months of life of progressive lactic acidosis.
    Subject 1 was acidotic within an hour of birth, needed intubation at 24 hours, and died at
    about 51 hours with a blood lactate above 20 mmol per litre. Subject 4 presented at seven
    weeks with seizures and died at 13 weeks despite tertiary intensive care. Fatal-outcome
    content is recorded here rather than as a phenotype, since the relevant HPO term sits
    outside the phenotype enum.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lactic acidosis exhibited relentless progression with a blood lactate reading in excess of 20 mM immediately before death at approximately 51 hr of age."
    explanation: The first patient's death, with its immediate cause.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite intensive-care management in a tertiary care center, her lactic acidosis continued until her death at 13 weeks of age."
    explanation: The fourth patient's death, and that intensive care did not alter it.
- phase: Childhood-onset regression with partial recovery and slow decline
  notes: >-
    Subject 2's course is the one that shows this disease need not be lethal in infancy. He
    developed normally, walked at 16 months, regressed catastrophically after an unexplained
    fever at 25 months, then recovered several words and was walking with assistance by three
    years. No further episode of rapid regression followed, but he has declined slowly since
    - dysarthric and wheelchair-dependent from seven years, and without voluntary limb
    movement at the time of report. His cognition remains good and his mood is recorded as
    very low, which is worth keeping because it is the only patient-experience observation in
    the series.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He showed some recovery over subsequent months, during which he regained several words, and by 3 years was walking with assistance."
    explanation: The partial recovery after the acute regression, which is what makes this a relapsing course.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although there have been no further episodes of rapid regression, he has slowly deteriorated and has displayed dysarthric speech and wheelchair dependency from 7 years of age."
    explanation: The slow decline that followed, and the absence of further acute events.
- phase: Survival into the second decade with epileptic encephalopathy
  notes: >-
    Subject 3 was alive at ten years at the time of the report, sitting independently but
    unable to stand or walk, mute but responsive to familiar voices, with vision impaired by
    optic atrophy. His course is dominated by drug-resistant seizures, aspiration and
    bronchiectasis rather than by acidosis.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures remained problematic despite medical treatment, and he also suffered significant gastro-esophageal reflux with multiple episodes of aspiration pneumonia"
    explanation: What actually dominates this patient's decade-long course.
genetic:
- name: NDUFA6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: NDUFA6
    term:
      id: hgnc:7690
      label: NDUFA6
  notes: >-
    NDUFA6 encodes NADH:ubiquinone oxidoreductase subunit A6, also known as LYRM6, a 15 kDa
    accessory subunit of the complex I Q-module whose LYR motif binds the mitochondrial acyl
    carrier protein NDUFAB1. The 2018 report establishes it as the 29th structural subunit of
    complex I linked to human disease.

    A transcript trap, which the paper itself is largely about. NDUFA6 has three in-frame
    isoforms using alternative initiation methionines, and the consensus RefSeq accession did
    not correspond to the predominant transcript in clinically relevant tissues; the paper's
    expression data prompted the revision of the reference accession to NM_002490.5. This is
    not a bookkeeping detail. Subject 3's start-loss allele is pathogenic against the
    predominant short transcript and would read as a tolerated p.Met27Ile missense change
    against the longer one, which is the authors' candidate explanation for his normal muscle
    complex I activity. Anyone re-interpreting a variant in this gene has to state which
    transcript they are numbering against.

    A Named Entity Confusion trap, which dominates a naive literature search. NDUFA6 carries a
    large common-variant and expression-signature literature that has nothing to do with this
    disease: a missense variant reported to confer schizophrenia risk, bioinformatic hub-gene
    analyses in tetralogy of Fallot, multiple myeloma, glioma, thyroid cancer, sepsis and
    preeclampsia, a lncRNA named NDUFA6-DT, and a ceramide-NDUFA6 interaction in liver
    ischaemia-reperfusion injury. None of it is cited here and none of it concerns MC1DN33.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study therefore establishes NDUFA6 as the 29th structural subunit of complex I to be associated with human pathology."
    explanation: The gene-disease relationship as established, and its novelty at the time.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent analysis by BN-PAGE confirmed that transduction of all three subject cell lines with a wild-type NDUFA6 cDNA transcript ameliorated the complex I assembly defect, unequivocally establishing the subjects’ NDUFA6 variants as the cause of disease"
    explanation: >-
      The complementation result that converts an association into a causal claim, in all
      three cell lines available.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype-Tissue Expression (GTEx) data and in-house RNA-seq data19 support ENST00000602404.5 as the predominant isoform"
    explanation: >-
      The transcript finding behind the RefSeq revision, which is what makes variant
      numbering in this gene transcript-dependent.
  - reference: CGGV:assertion_11d2d522-feca-41a7-87d5-fb11135902d2-2024-04-29T040000.000Z
    reference_title: "NDUFA6 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is moderate evidence to support the relationship between NDUFA6 and autosomal recessive NDUFA6 -related primary mitochondrial disease."
    explanation: >-
      The independent strength-of-evidence judgement, which is Moderate rather than Definitive
      and is a fair reflection of a single four-family series with strong functional data.
diagnosis:
- name: Unbiased next-generation sequencing with GeneMatcher, not enzymology
  description: >-
    The four families were solved by four different sequencing strategies - targeted panel,
    two exomes, and a trio genome - and connected through GeneMatcher, which is what turned
    four single unexplained variants into a gene-disease relationship. The diagnostic lesson
    the authors draw is about enzymology rather than sequencing: subject 3 had normal
    complex I activity in muscle, so an enzymology-first pathway would have excluded him, and
    the paper argues this is why an unbiased genetic approach matters.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that one subject had normal complex I activity in skeletal muscle, this report epitomizes the importance of an unbiased approach to genetic diagnosis."
    explanation: >-
      The authors' own diagnostic conclusion, and the patient who forced it. It is the reason
      a normal muscle complex I assay does not exclude this diagnosis.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Facilitated by the GeneMatcher tool,8 we report the findings from four unrelated, clinically affected children who presented with symptoms suggestive of mitochondrial disease."
    explanation: >-
      The step without which four isolated candidate variants would not have become a
      gene-disease relationship.
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thorough variant interpretation and assessment of appropriate transcripts remain both an obligation and a challenge for the diagnostic community in this genomic era."
    explanation: The second diagnostic lesson, about which transcript a variant is numbered against.
experimental_models:
- name: Lentiviral NDUFA6 complementation of patient fibroblasts
  experimental_model_type: OTHER
  description: >-
    Fibroblasts from subjects 1 to 3 were transduced with a wild-type NDUFA6 cDNA transcript.
    Blue native electrophoresis showed the complex I assembly defect corrected in all three
    lines, and in-gel activity assay showed complex I activity restored in the two lines
    tested. Subject 2's line was attempted for the activity assay but the cells failed to
    grow.
  modeled_mechanisms:
  - target: Stalled 830 kDa Complex I Assembly Intermediate
    relationship: RESCUES
    fidelity: HIGH
    description: >-
      Supplying wild-type NDUFA6 to the patients' own cells restores assembly, which is the
      demonstration that the variants rather than something else in those genomes cause the
      stall.
    limitations: >-
      Cultured skin fibroblasts, not brain or muscle, and three of four patients - no tissue
      was available from subject 4. The activity arm of the rescue covers only two lines,
      because subject 2's cells failed to grow. Retroviral and lentiviral expression is
      non-physiological in level and timing. And the rescue says nothing about whether
      restoring the subunit would help a patient: it is a pathogenicity experiment, not a
      therapeutic one.
    readouts:
    - name: Complex I assembly on blue native electrophoresis after transduction
      target: Stalled 830 kDa Complex I Assembly Intermediate
      direction: RESTORED
      interpretation: >-
        The assembly defect is corrected in all three transduced patient lines, and complex I
        levels are described as restored.
      evidence:
      - reference: PMID:30245030
        reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "After transfection with NDUFA6, complex I levels were restored."
        explanation: The assembly readout stated at its endpoint.
    - name: In-gel complex I activity after transduction
      target: Stalled 830 kDa Complex I Assembly Intermediate
      direction: RESTORED
      interpretation: >-
        In-gel NADH dehydrogenase activity is restored in the two patient lines tested, so
        the rescued enzyme works and is not merely assembled.
      evidence:
      - reference: PMID:30245030
        reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In-gel activity analysis was performed according to Zerbetto et al.22 with mitochondria isolated from the fibroblasts of subjects 1 (S1) and 3 (S3)"
        explanation: >-
          The functional half of the rescue, and the two patients in whom it was measured.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subsequent analysis by BN-PAGE confirmed that transduction of all three subject cell lines with a wild-type NDUFA6 cDNA transcript ameliorated the complex I assembly defect, unequivocally establishing the subjects’ NDUFA6 variants as the cause of disease"
    explanation: >-
      What the experiment establishes, in the strength of claim the authors chose - which is
      unusually strong for this literature.
- name: Patient fibroblast complexome profiling
  experimental_model_type: OTHER
  description: >-
    Mass-spectrometric complexome profiling of mitochondria from subjects 1 to 3 against
    age-matched control cells. This is where the module-level account of the disease comes
    from: which subunits are lost with NDUFA6, which intermediate accumulates, and what is
    still bound to it.
  modeled_mechanisms:
  - target: Loss of NDUFAB1, NDUFA7 and NDUFA12 from the Assembly Intermediate
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Complexome profiling resolves an assembly defect into a subunit-level map. It showed
      the reduction of incorporated NDUFA6, the concomitant loss of NDUFAB1, NDUFA7 and
      NDUFA12, the reduction of N-module subunits, and NDUFAF2 still bound to the stalled
      intermediate.
    limitations: >-
      Cultured fibroblasts rather than the affected tissue, and three patients. The readout
      is protein abundance across a native gradient, not a direct measurement of assembly
      order, so the prerequisite relationship the authors propose between NDUFA6 and the
      later subunits is an interpretation of the abundance pattern rather than an observation
      of sequence.
    readouts:
    - name: Abundance of complex I subunits in the assembly intermediate
      target: Loss of NDUFAB1, NDUFA7 and NDUFA12 from the Assembly Intermediate
      direction: DECREASED
      interpretation: >-
        NDUFA6 is markedly reduced in incorporated form, and NDUFAB1, NDUFA7 and NDUFA12 fall
        with it, most severely in the most severely affected patient.
      evidence:
      - reference: PMID:30245030
        reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This confirmed a marked reduction in incorporated NDUFA6 and a concomitant reduction in other Q-module subunits, including NDUFAB1, NDUFA7, and NDUFA12."
        explanation: The measurement in the three patients profiled.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A clear reduction of N-module subunits was visible, particularly in the most severely affected individual, subject 1"
    explanation: >-
      The result that ties the depth of the assembly defect to clinical severity, which is
      what makes the assay informative rather than merely descriptive.
animal_models:
- name: Yarrowia lipolytica LYRM6/NB4M deletion and LYR-motif mutants
  species: Yarrowia lipolytica
  genotype: chromosomal deletion of the NB4M/LYRM6 gene, and alanine substitution of the LYR motif and the conserved phenylalanine
  publication: PMID:24706851
  description: >-
    The aerobic yeast Yarrowia lipolytica is the system in which the function of this subunit
    was worked out, years before it was linked to human disease. Deleting the orthologous
    gene removed the acyl carrier protein ACPM1 from complex I and abolished ubiquinone
    reductase activity; replacing the LYR motif and an associated conserved phenylalanine
    with alanines did the same. A later study of the same organism determined the structure
    of an inactive F89A mutant and found long-range changes across a cluster of conserved
    loops at the interface between the Q-module and the membrane arm.
  notes: >-
    A yeast is not an animal, and the schema has no plant/fungal model section, so this record
    sits in animal_models for want of a better slot. It is flagged here rather than left for a
    reader to notice.
  modeled_mechanisms:
  - target: Loss of NDUFA6 from the Complex I Q-Module
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Removing the subunit from the yeast enzyme reproduces the two things that matter for
      the human disease: the acyl carrier protein leaves with it, and ubiquinone reduction
      stops. It is also the source of the expectation that NDUFAB1 would be lost from patient
      complex I, which the human complexome data then confirmed.
    limitations: >-
      A yeast, and a yeast whose complex I differs from the human enzyme in subunit
      composition. The alleles are a clean chromosomal deletion and designed alanine
      substitutions, not the missense, start-loss and frameshift alleles the patients carry.
      Most importantly, the yeast result is about catalysis - ubiquinone reductase activity
      is paralysed - whereas the human patients have an assembly defect, so the two systems
      agree on the subunit's importance without agreeing on the failure mode.
    readouts:
    - name: ACPM1 content of complex I after subunit deletion
      target: Loss of NDUFA6 from the Complex I Q-Module
      direction: DECREASED
      interpretation: >-
        The acyl carrier protein is lost from the enzyme complex when the LYR subunit is
        deleted, which is the interaction that predicts the human NDUFAB1 result.
      evidence:
      - reference: PMID:24706851
        reference_title: "The LYR protein subunit NB4M/NDUFA6 of mitochondrial complex I anchors an acyl carrier protein and is essential for catalytic activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Chromosomal deletion of the corresponding gene in the yeast Yarrowia lipolytica caused concomitant loss of the mitochondrial acyl carrier protein subunit ACPM1 from the enzyme complex and paralyzed ubiquinone reductase activity."
        explanation: Both readouts in one sentence - the lost partner protein and the lost activity.
    - name: Ubiquinone reductase activity after LYR-motif substitution
      target: Loss of NDUFA6 from the Complex I Q-Module
      direction: ABOLISHED
      interpretation: >-
        Mutating the LYR motif alone, without deleting the subunit, abolishes activity and
        ACPM1 binding - so it is the motif rather than the bulk of the protein that carries
        the function.
      evidence:
      - reference: PMID:24706851
        reference_title: "The LYR protein subunit NB4M/NDUFA6 of mitochondrial complex I anchors an acyl carrier protein and is essential for catalytic activity."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exchanging the LYR motif and an associated conserved phenylalanine by alanines in subunit NB4M also abolished the activity and binding of subunit ACPM1."
        explanation: The motif-level dissection, which is what localises the function within the subunit.
  evidence:
  - reference: PMID:33243981
    reference_title: "Essential role of accessory subunit LYRM6 in the mechanism of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that stabilization of the TMH1-2ND3 loop by accessory subunit LYRM6 (NDUFA6) is pivotal for energy conversion by mitochondrial complex I."
    explanation: >-
      The later structural work in the same organism, which is why this model is treated as
      informative for what the subunit does rather than only for whether it is needed.
  - reference: PMID:33243981
    reference_title: "Essential role of accessory subunit LYRM6 in the mechanism of mitochondrial complex I."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We determined the high-resolution structure of inactive mutant F89ALYRM6 of eukaryotic complex I from the yeast Yarrowia lipolytica and found long-range structural changes affecting the entire loop cluster."
    explanation: >-
      That a single substitution in this accessory subunit propagates structural change
      across the module interface, which is the mechanistic reason a small subunit matters.
- name: Caenorhabditis elegans nuo-3(G60D) intra-complex suppressor
  species: Caenorhabditis elegans
  genotype: nuo-3(G60D), a dominant missense allele of the NDUFA6 orthologue
  publication: PMID:38215760
  description: >-
    Forward genetic selections in C. elegans for suppressors of complex I mutants repeatedly
    recovered G60D substitutions in nuo-3, the NDUFA6 orthologue. The allele restores forward
    complex I activity in three different complex I mutants and phenocopies the rescue that
    hypoxia produces. ClinGen cites this work as part of the experimental evidence supporting
    the NDUFA6 gene-disease relationship.
  notes: >-
    This is emphatically not a model of NDUFA6 deficiency, and it is curated with a link to
    the subunit's role rather than to any disease node. nuo-3(G60D) is a gain-of-activity
    suppressor that makes complex I work better in a mutant background; the patients have
    loss-of-function alleles that make it work worse. What the worm result establishes is
    that this accessory subunit is allosterically coupled to the ubiquinone binding pocket,
    which is why changing it has large functional consequences in either direction. No
    knockout model of the orthologue in any animal is cited here: a PubMed search in
    September 2026 for an Ndufa6 mouse knockout returned no hits, and none is described in
    the ClinGen curation, which lists a HEK293T knockout and this worm study as the
    experimental evidence.
  modeled_mechanisms:
  - target: Loss of NDUFA6 from the Complex I Q-Module
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      An engineered change in the orthologous subunit alters complex I catalysis at a
      distance, which supports treating NDUFA6 as functionally coupled to the enzyme's
      ubiquinone chemistry rather than as a structural passenger.
    limitations: >-
      The direction is opposite to the disease. This is a dominant suppressor allele that
      improves complex I forward activity, recovered in a screen for rescue of other complex
      I mutants; the human patients carry recessive loss-of-function alleles. The organism is
      a nematode, and the paper itself notes that outside the LYRM domain the primary
      sequence of NUO-3 has diverged across eukaryotic evolution, so residue-level
      correspondence to human NDUFA6 is uncertain. Nothing here models the assembly defect
      that is the human lesion.
    readouts:
    - name: Complex I forward activity in suppressed mutants
      target: Loss of NDUFA6 from the Complex I Q-Module
      direction: INCREASED
      interpretation: >-
        The nuo-3(G60D) substitution partially restores complex I forward activity, the same
        effect hypoxia produces.
      evidence:
      - reference: PMID:38215760
        reference_title: "Hypoxia and intra-complex genetic suppressors rescue complex I mutants by a shared mechanism."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We show that NDUFA6/nuo-3(G60D) or hypoxia directly restores complex I forward activity"
        explanation: The functional effect of altering the orthologous subunit.
  evidence:
  - reference: PMID:38215760
    reference_title: "Hypoxia and intra-complex genetic suppressors rescue complex I mutants by a shared mechanism."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "To discover the mechanism, we use C. elegans genetic screens to identify suppressor mutations in the complex I accessory subunit NDUFA6/nuo-3 that phenocopy hypoxia rescue."
    explanation: >-
      Why this model bears on NDUFA6 at all. INDIRECT because the relevance to a
      loss-of-function human disease runs through an inference about the subunit's role, not
      through a shared lesion.
  - reference: CGGV:assertion_11d2d522-feca-41a7-87d5-fb11135902d2-2024-04-29T040000.000Z
    reference_title: "NDUFA6 / mitochondrial disease (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This gene-disease relationship is also supported by a biochemical function shared with other genes associated with primary mitochondrial disease (PMID: 33340416), NDUFA6 knock out in HEK293T cells (PMID: 27626371), and a C.elegans model (PMID: 38215760)."
    explanation: >-
      The expert panel's own inventory of the experimental evidence, which is how this study
      and a HEK293T knockout enter the gene-disease case. Graded OTHER because a curation
      narrative is an expert synthesis rather than a study.
treatments:
- name: Intrathecal Baclofen for Spasticity
  description: >-
    Subject 2 has an implanted pump delivering intrathecal baclofen for the four-limb
    spasticity that followed his regression. It is symptomatic management of tone, not
    treatment of the complex I defect, and no outcome is reported for it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: baclofen
      term:
        id: CHEBI:2972
        label: baclofen
  target_mechanisms:
  - target: Spasticity
    treatment_effect: MODULATES
    description: >-
      Baclofen is a GABA-B agonist given intrathecally to reduce spastic tone. It acts on the
      symptom and on nothing upstream of it, which is why the effect is recorded as
      modulation rather than restoration of anything.
  notes: >-
    No effectiveness claim is made. The report records the pump as part of his current
    management and does not state what it achieved. The delivery route is what makes the
    modality tag defensible as SMALL_MOLECULE rather than DEVICE - the pump is the route, the
    drug is the intervention. Botulinum toxin, given three-monthly to the same patient, is
    named in the same sentence and is not curated as a separate treatment, because splitting
    one sentence into two treatment records would double-count a single management
    description.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He has an implanted pump for intrathecal Baclofen therapy and receives Botox injections every 3 months."
    explanation: >-
      The two tone-directed treatments this patient receives, and the interval at which the
      second is given.
- name: Gastrostomy Tube Feeding for Unsafe Swallow
  description: >-
    Subject 2 developed swallowing difficulties during his regression and required a
    gastrostomy tube for feeding. Securing enteral nutrition around an unsafe swallow is
    standard supportive management in a progressive mitochondrial encephalopathy, and it is
    the only feeding intervention recorded in this series.
  treatment_term:
    preferred_term: gastrostomy tube feeding
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  notes: >-
    Bound to the NCIT procedure term for the gastrostomy tube procedure, which is the
    clinical action reachable from NCIT:C25218. No therapeutic_modality value is given: the
    intervention is enteral nutrition delivered through an indwelling tube, which is neither
    cleanly DEVICE nor the dietary sense of BEHAVIORAL, and CLAUDE.md warns against tagging
    nutritional support BEHAVIORAL by reflex. No target_mechanisms link is declared because
    the feeding difficulty is curated as a phenotype rather than a pathophysiology node and
    the schema's treatment edges point at mechanism targets; the phenotype it addresses is
    named in the description instead.
  evidence:
  - reference: PMID:30245030
    reference_title: "Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated Mitochondrial Complex I Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He developed swallowing difficulties and required a gastrostomy tube for feeding."
    explanation: The intervention and the problem that prompted it.
- name: Granulocyte Colony-Stimulating Factor for Neutropenia
  description: >-
    Subject 3's long-standing neutropenia, first noted at two years, was treated with
    granulocyte colony-stimulating factor. Like the tone and feeding measures, this addresses
    a complication rather than the respiratory chain defect, and no outcome is reported.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: granulocyte colony-stimulating factor therapy
    term:
      id: NCIT:C15515
      label: Colony-Stimulating Factor Therapy

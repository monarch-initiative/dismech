- name: Developmental Regression
  category: Nervous System
  description: >-
    Loss of acquired skills in two of the four children. Subject 2 walked independently at 16
    months, deteriorated after an unexplained fever at 25 months and by 2.5 years was
    bedridden and unable to walk, grasp or speak; he then partially recovered. Subject 3
    developed normally until three months and had clearly lost acquired skills by five
    months, at the time of a status epilepticus admission.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
  notes: >-
    Two of four children, so 2/4, in the FREQUENT band. The other two died at 51 hours and 13
    weeks respectively and had no acquired skills to lose, so the denominator for regression
    is arguably two rather than four. A count in a four-patient series, not a population
    frequency.

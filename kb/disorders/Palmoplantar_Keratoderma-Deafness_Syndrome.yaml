treatments:
- name: Cochlear implantation
  description: >-
    Cochlear implantation with hearing rehabilitation restores auditory input.
    The disease-specific evidence is a single R75W case report; the rationale
    that GJB2 pathology spares the cochlear neurons the implant stimulates comes
    from nonsyndromic GJB2 deafness.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  target_mechanisms:
  - target: Organ of Corti Degeneration
    treatment_effect: BYPASSES
    description: >-
      The implant stimulates spiral ganglion neurons directly, bypassing the
      degenerated organ of Corti.
    evidence:
    - reference: PMID:41516362
      reference_title: "GJB2-Related Hearing Loss: Genotype-Phenotype Correlations, Natural History, and Emerging Therapeutic Strategies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: >-
        with preserved cochlear neurons that support excellent cochlear implant
        (CI) outcomes
      explanation: >-
        Said of recessive GJB2 (DFNB1) deafness: the cochlear neurons the implant
        stimulates are preserved, the basis for bypassing the organ of Corti.
  evidence:
  - reference: PMID:20890442
    reference_title: Hereditary palmoplantar keratoderma and deafness resulting from genetic mutation of Connexin 26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cochlear implantation was done to modify hearing loss of the patient and
      further hearing rehabilitation had been provided by the hearing support
      service team in hospital
    explanation: Cochlear implantation was used in an R75W palmoplantar keratoderma-deafness patient.
diagnosis:
- name: GJB2 sequencing
  description: >-
    Congenital or progressive hearing loss with palmoplantar keratoderma in an
    autosomal dominant pedigree prompts GJB2 sequencing; mtDNA testing for
    m.7445A>G applies to maternally inherited families.
  evidence:
  - reference: PMID:20890442
    reference_title: Hereditary palmoplantar keratoderma and deafness resulting from genetic mutation of Connexin 26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      led us to test for a mutation in the GJB2 gene in both patients
    explanation: The dominant keratoderma-deafness combination led to GJB2 testing.
animal_models:
- name: R75W dominant-negative Gjb2 transgenic mouse
  species: Mouse
  genotype: Transgenic expression of human connexin 26 R75W
  publication: PMID:12700168
  modeled_mechanisms:
  - target: Organ of Corti Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces supporting-cell deformity, failure of the tunnel of Corti and
      hair-cell degeneration with severe to profound deafness.
    limitations: >-
      The mouse is a model of the cochlear arm only; it is described as
      non-syndromic, so it does not model the keratoderma. Transgene
      overexpression does not reproduce the human heterozygous dosage, and the
      potassium mechanism is the authors' inference (endocochlear potential
      was normal).

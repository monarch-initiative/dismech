name: Palmoplantar Keratoderma-Deafness Syndrome
creation_date: "2026-10-01T23:39:00Z"
category: Mendelian
description: >-
  Palmoplantar keratoderma-deafness syndrome combines focal or diffuse
  palmoplantar keratoderma with sensorineural hearing loss. Its main form is
  autosomal dominant and caused by heterozygous GJB2 missense variants (for
  example G59A, R75W/R75Q, H73R and deletion of E42) that encode
  dominant-negative connexin 26: the mutant subunits form no functional channels
  and suppress co-expressed wild-type connexin 26. The disease then branches by
  tissue. In the epidermis, the skin-associated mutants tested in vitro
  (deletion of E42, D66H, R75W) also trans-dominantly inhibit connexin 43, the
  proposed reason some dominant GJB2 alleles cause deafness alone and others
  cause deafness with keratoderma. In the
  cochlea, loss of gap junction coupling impairs potassium handling by organ of
  Corti supporting cells, leading to supporting-cell deformity and hair-cell
  degeneration (a cochlear mechanism inferred from a dominant-negative mouse
  model). A rarer maternally inherited form is associated with the
  mitochondrial MT-TS1 variant m.7445A>G and is not explained by connexin 26.
disease_term:
  preferred_term: palmoplantar keratoderma-deafness syndrome
  term:
    id: MONDO:0007852
    label: palmoplantar keratoderma-deafness syndrome
synonyms:
- palmoplantar keratoderma with deafness
- keratoderma, palmoplantar, with deafness
- palmoplantar keratoderma-hearing loss syndrome
- palmoplantar keratoderma and sensorineural deafness
- PPK-deafness syndrome
parents:
- Genodermatosis
notes: >-
  The connexin 26 pathograph below is scoped to the GJB2 subtype. The
  mitochondrial MT-TS1 m.7445A>G form shares the clinical picture but not the
  mechanism (immunolabelling showed normal connexin 26 expression in its
  proband), so it is recorded as a subtype and a genetic entry rather than
  forced through the gap junction chain; its own mechanism (a mitochondrial
  tRNA processing defect) is not modelled here. GJB2 also causes the allelic
  dominant skin-and-deafness disorders curated separately as
  Keratitis-Ichthyosis-Deafness_Syndrome (MONDO:0007850) and
  Keratoderma_Hereditarium_Mutilans (Vohwinkel, MONDO:0007422); MONDO and
  Orphanet place this entity on a clinical spectrum with them. No GeneReviews
  chapter covers this disease (just check-genereviews --online, NO_CHAPTER; the
  GJB2 nonsyndromic deafness chapter is a different disease). No treatment for
  the keratoderma itself is sourced: the acitretin reports found concern KID and
  Vohwinkel syndromes, not this entity, and were not carried over.

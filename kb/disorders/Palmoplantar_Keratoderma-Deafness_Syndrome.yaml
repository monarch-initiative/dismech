phenotypes:
- category: Cutaneous
  name: Palmoplantar keratoderma
  description: >-
    Focal (for example H73R) or diffuse (for example R75W) hyperkeratosis of the
    palms and soles; penetrance varies by allele.
  phenotype_term:
    preferred_term: palmoplantar keratoderma
    term:
      id: HP:0000982
      label: Palmoplantar keratoderma
  evidence:
  - reference: PMID:10633135
    reference_title: A connexin 26 mutation causes a syndrome of sensorineural hearing loss and palmoplantar hyperkeratosis (MIM 148350).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The affected family members have high frequency, slowly progressive,
      bilateral, sensorineural hearing loss and palmoplantar hyperkeratosis
    explanation: Documents palmoplantar hyperkeratosis in affected family members.
  - reference: PMID:41516362
    reference_title: "GJB2-Related Hearing Loss: Genotype-Phenotype Correlations, Natural History, and Emerging Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      variants impair gap junction formation and cause severe prelingual HL with
      variably penetrant Palmoplantar Keratoderma
    explanation: Records allele-dependent, variable penetrance of the keratoderma.
  - reference: PMID:17993581
    reference_title: A novel missense mutation in GJB2 disturbs gap junction protein transport and causes focal palmoplantar keratoderma with deafness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      causing a syndrome of focal palmoplantar keratoderma with severe
      progressive sensorineural hearing impairment
    explanation: Documents the focal form of the keratoderma (H73R).
  - reference: PMID:20890442
    reference_title: Hereditary palmoplantar keratoderma and deafness resulting from genetic mutation of Connexin 26.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented to our clinic with diffuse hyperkeratosis of the palms and soles
    explanation: Documents the diffuse form of the keratoderma (R75W).

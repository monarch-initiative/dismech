      label: skin of palmar/plantar part of autopod
  downstream:
  - target: Palmoplantar keratoderma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Disturbed epidermal gap junction communication is thought to perturb
      keratinocyte growth and differentiation and so produce palmoplantar
      hyperkeratosis; the intermediate steps are not established.
    evidence:
    - reference: PMID:17993581
      reference_title: A novel missense mutation in GJB2 disturbs gap junction protein transport and causes focal palmoplantar keratoderma with deafness.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: >-
        In the skin, several connexins are expressed and are involved in the
        regulation of epidermal growth and differentiation
      explanation: >-
        Background plausibility only: connexins take part in regulating
        epidermal growth and differentiation; the quote does not itself link
        connexin 43 inhibition to hyperkeratosis.
  evidence:
  - reference: PMID:11493646
    reference_title: "trans-dominant inhibition of connexin-43 by mutant connexin-26: implications for dominant connexin disorders affecting epidermal differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      the principal mechanism for manifestation of dominant GJB2 mutations in the
      skin is their dominant interference with the function of wtCx43
    explanation: >-
      The authors' proposed model, built on the oocyte data, naming connexin 43
      interference as the principal skin mechanism.
  - reference: PMID:11493646
    reference_title: "trans-dominant inhibition of connexin-43 by mutant connexin-26: implications for dominant connexin disorders affecting epidermal differentiation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cx26 and Cx43 focally colocalize at gap junctional plaques in affected skin

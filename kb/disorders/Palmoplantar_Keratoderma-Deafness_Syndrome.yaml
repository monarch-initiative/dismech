pathophysiology:
- name: Dominant-Negative GJB2 Missense Variant
  biological_scale: MOLECULAR
  subtypes:
  - GJB2
  description: >-
    A heterozygous GJB2 missense variant (G59A, R75W/R75Q, H73R, deletion of
    E42) produces a connexin 26 subunit that cannot form functional gap junction
    channels and interferes with wild-type subunits.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  molecular_functions:
  - preferred_term: gap junction channel activity
    term:
      id: GO:0005243
      label: gap junction channel activity
    modifier: DECREASED
  downstream:
  - target: Loss of Connexin 26 Gap Junction Coupling
    causal_link_type: DIRECT
    description: >-
      Mutant subunits suppress the channel activity and trafficking of
      co-expressed wild-type connexin 26.
    evidence:
    - reference: PMID:9856479
      reference_title: Functional defects of Cx26 resulting from a heterozygous missense mutation in a family with dominant deaf-mutism and palmoplantar keratoderma.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Not only was R75W alone incapable of inducing electrical conductance
        between adjacent cells, but it almost completely suppressed the activity
        of co-expressed wildtype protein
      explanation: >-
        R75W abolishes its own channel function and dominantly suppresses
        wild-type connexin 26 in paired oocytes.
  - target: Trans-Dominant Inhibition of Epidermal Connexin 43
    causal_link_type: DIRECT
    description: >-
      Skin-associated mutant subunits interact directly with wild-type
      connexin 43 and inhibit its channels, in parallel with (not downstream
      of) the loss of connexin 26 coupling; deafness-only mutants suppress
      connexin 26 but spare connexin 43.
    evidence:
    - reference: PMID:11493646
      reference_title: "trans-dominant inhibition of connexin-43 by mutant connexin-26: implications for dominant connexin disorders affecting epidermal differentiation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        only those Cx26 mutants associated with a skin phenotype also
        significantly (P<0.05) inhibited intercellular conductance of
        co-expressed wtCx43, indicating a direct interaction of mutant Cx26
        units with wtCx43
      explanation: >-
        In paired Xenopus oocytes every mutant suppressed wild-type connexin
        26, but only the skin-associated ones also inhibited connexin 43, which
        the authors attribute to direct binding by the mutant subunit; an in
        vitro result for three alleles.
  evidence:
  - reference: PMID:10633135
    reference_title: A connexin 26 mutation causes a syndrome of sensorineural hearing loss and palmoplantar hyperkeratosis (MIM 148350).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a missense mutation in the connexin 26 gene (GJB2) in a family
      with an autosomal dominant syndrome of hearing loss and hyperkeratosis
    explanation: Identifies a GJB2 missense variant as the cause in a dominant pedigree.
  - reference: PMID:41516362
    reference_title: "GJB2-Related Hearing Loss: Genotype-Phenotype Correlations, Natural History, and Emerging Therapeutic Strategies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A subset of GJB2 missense variants cause autosomal dominant HL through
      dominant-negative or gain-of-function mechanisms
    explanation: Places dominant GJB2 missense variants in a dominant-negative mechanism.
- name: Loss of Connexin 26 Gap Junction Coupling
  biological_scale: CELLULAR
  subtypes:
  - GJB2
  description: >-
    Gap junctional intercellular communication through connexin 26 channels is
    lost, both because mutant subunits are non-functional and because they
    impair trafficking of wild-type connexin 26 to the plasma membrane.
  biological_processes:
  - preferred_term: gap junction-mediated intercellular transport
    term:
      id: GO:1990349
      label: gap junction-mediated intercellular transport
    modifier: DECREASED
  downstream:
  - target: Impaired Potassium Recycling by Organ of Corti Supporting Cells
    causal_link_type: DIRECT
    description: >-
      In the cochlea, loss of supporting-cell gap junction coupling impairs
      potassium handling around the sensory hair cells; inferred from the R75W
      dominant-negative mouse.
    evidence:
    - reference: PMID:12700168
      reference_title: Transgenic expression of a dominant-negative connexin26 causes degeneration of the organ of Corti and non-syndromic deafness.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        the GJB2 mutation disturbs homeostasis of cortilymph, an extracellular
        space surrounding the sensory hair cells, due to impaired K(+) transport by
        supporting cells, resulting in degradation of the organ of Corti
      explanation: >-
        The authors attribute the cochlear defect to impaired supporting-cell
        potassium transport in the dominant-negative mouse.
  evidence:
  - reference: PMID:17993581
    reference_title: A novel missense mutation in GJB2 disturbs gap junction protein transport and causes focal palmoplantar keratoderma with deafness.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the mutant has a dominant negative effect on connexin trafficking
    explanation: >-
      H73R impairs trafficking of co-expressed wild-type connexin 26, a second
      route to lost coupling.
  - reference: PMID:21040787
    reference_title: Dominant Cx26 mutants associated with hearing loss have dominant-negative effects on wild type Cx26.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      dominant-negative effects of these Cx26 mutants likely contribute to the
      pathogenesis of hearing loss
    explanation: >-
      Cell-based coupling assays tie the dominant-negative loss of connexin 26
      function to hearing loss.
- name: Trans-Dominant Inhibition of Epidermal Connexin 43
  biological_scale: CELLULAR
  subtypes:
  - GJB2
  description: >-
    Mutant connexin 26 subunits interact with connexin 43 in keratinocytes and
    suppress its channel function. This is proposed as the principal reason
    dominant GJB2 variants produce a skin phenotype.
  genes:
  - preferred_term: GJA1
    term:
      id: hgnc:4274
      label: GJA1
  molecular_functions:
  - preferred_term: connexin 43 gap junction channel activity
    term:

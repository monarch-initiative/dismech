- name: Impaired Potassium Recycling by Organ of Corti Supporting Cells
  biological_scale: CELLULAR
  subtypes:
  - GJB2
  description: >-
    Supporting cells of the organ of Corti fail to clear potassium from the
    cortilymph around the sensory hair cells. In the dominant-negative mouse the
    endolymph potential stays normal, so the defect is local to the organ of
    Corti rather than to endolymph generation; the authors extend this to humans
    only as probable.
  cell_types:

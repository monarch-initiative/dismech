environmental:
- name: Ultraviolet Radiation
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  description: >-
    UV exposure is a major risk factor for MCC. Most tumors occur on sun-exposed
    skin. UV signature mutations are characteristic of virus-negative MCC.
  evidence:
  - reference: PMID:33252781
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Merkel cell polyomavirus has been shown to induce gene mutations resulting in this skin cancer, with immunosuppression and ultraviolet radiation being other key risk factors in its pathogenesis"
    explanation: Clinical review naming ultraviolet radiation as a key risk factor in MCC pathogenesis alongside MCPyV and immunosuppression.
- name: Immunosuppression
  exposure_term:
    preferred_term: immunosuppression
    term:
      id: ECTO:9001747
      label: exposure to immunosuppressive agent
  description: >-
    Immunosuppression dramatically increases MCC risk (10-15 fold in organ
    transplant recipients). This suggests immune surveillance normally
    controls MCPyV-infected cells.
  evidence:
  - reference: PMID:18202256
    reference_title: "Clonal integration of a polyomavirus in human Merkel cell carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Merkel cell carcinoma (MCC) is a rare but aggressive human skin cancer that typically affects elderly and immunosuppressed individuals, a feature suggestive of an infectious origin."
    explanation: "Notes the predisposition of immunosuppressed individuals to MCC, consistent with impaired immune control of MCPyV."
genetic:
- name: MCPyV T Antigens
  association: Viral Oncogenes
  notes: >-
    In MCPyV-positive MCC, viral small T and truncated large T antigens are
    the primary oncogenic drivers. Large T antigen binds RB1, while small T
    antigen promotes proliferation through multiple mechanisms. Tumors are
    addicted to viral oncoprotein expression.
  evidence:
  - reference: PMID:18812503
    reference_title: "T antigen mutations are a human tumor-specific signature for Merkel cell polyomavirus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nine MCC tumor-derived LT genomic sequences have been examined, and all were found to harbor mutations prematurely truncating the MCV LT helicase."
    explanation: "Tumor-specific truncating LT mutations define the MCPyV T-antigen driver signature in MCC."
- name: RB1
  association: Somatic Mutations (in MCPyV-negative MCC)
  notes: >-
    RB1 mutations occur in the majority of MCPyV-negative MCC but are
    virtually absent in virus-positive tumors, where viral LT antigen
    functionally inactivates RB1 protein.
  evidence:
  - reference: PMID:26238782
    reference_title: "The Distinctive Mutational Spectra of Polyomavirus-Negative Merkel Cell Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to previously identified mutations in TP53, RB1, and PIK3CA, we discovered activating mutations of oncogenes, including HRAS and loss-of-function mutations in PRUNE2 and NOTCH family genes in MCPyV-negative MCC."
    explanation: "Confirms recurrent somatic RB1 (and TP53) mutations in virus-negative MCC."
- name: TP53
  association: Somatic Mutations (in MCPyV-negative MCC)
  notes: >-
    TP53 mutations with UV signature are common in virus-negative MCC.
    Virus-positive tumors retain wild-type TP53, suggesting different
    selective pressures.
  evidence:
  - reference: PMID:26238782
    reference_title: "The Distinctive Mutational Spectra of Polyomavirus-Negative Merkel Cell Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to previously identified mutations in TP53, RB1, and PIK3CA, we discovered activating mutations of oncogenes, including HRAS and loss-of-function mutations in PRUNE2 and NOTCH family genes in MCPyV-negative MCC."
    explanation: "Confirms recurrent somatic TP53 mutations in virus-negative MCC, alongside the UV mutational signature."
treatments:
- name: Avelumab
  description: >-
    Anti-PD-L1 antibody approved for metastatic MCC. First immune checkpoint
    inhibitor approved for MCC based on durable responses in the JAVELIN Merkel
    200 trial. Response rates of approximately 30-35% in previously treated
    patients and higher in first-line setting.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: avelumab
      term:
        id: NCIT:C116870
        label: Avelumab
  evidence:
  - reference: NCIT:C116870
    reference_title: "Avelumab (NCIT)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Avelumab | Accepted_Therapeutic_Use_For | - | - | locally advanced or metastatic urothelial carcinoma; metastatic Merkel cell carcinoma (MCC); advanced renal cell carcinoma (RCC)."
    explanation: >-
      NCI Thesaurus asserts accepted therapeutic use of avelumab for metastatic
      Merkel cell carcinoma.
- name: Pembrolizumab
  description: >-
    Anti-PD-1 antibody approved for advanced MCC. Response rates of approximately
    50-70% with durable responses. Both virus-positive and virus-negative MCC
    respond to checkpoint inhibition.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: pembrolizumab
      term:
        id: NCIT:C106432
        label: Pembrolizumab
  evidence:
  - reference: PMID:27093365
    reference_title: "PD-1 Blockade with Pembrolizumab in Advanced Merkel-Cell Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The response rate was 62% among patients with MCPyV-positive tumors (10 of 16 patients) and 44% among those with virus-negative tumors (4 of 9 patients)."
    explanation: "First-line pembrolizumab produced durable responses in both virus-positive and virus-negative advanced MCC."
- name: Surgical Excision
  description: >-
    Wide local excision with adequate margins (1-2 cm) is the primary treatment
    for localized MCC. Sentinel lymph node biopsy is recommended given high
    rate of occult nodal metastases.
  treatment_term:
    preferred_term: Excision
    term:
      id: NCIT:C15232
      label: Excision
- name: Radiation Therapy
  description: >-
    MCC is radiosensitive. Adjuvant radiation improves local control,
    particularly for tumors with high-risk features. Radiation may be used
    as primary treatment for unresectable tumors.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Chemotherapy
  description: >-
    MCC is chemosensitive (like other small cell carcinomas) with initial
    response rates of 50-60% to platinum/etoposide regimens. However,
    responses are typically short-lived and chemotherapy has been largely
    supplanted by immunotherapy.
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
disease_term:
  preferred_term: Merkel cell carcinoma
  term:
    id: MONDO:0019210
    label: cutaneous neuroendocrine carcinoma
notes: >-
  MCC is a paradigm for both viral oncogenesis and immunotherapy responsiveness.
  The dual etiology (viral versus UV-induced) highlights different mechanisms
  leading to the same tumor type. The high immunogenicity of MCC, whether due
  to viral antigens or high mutational burden, underlies the remarkable
  responses to checkpoint inhibitors. Viral T antigens represent potential
  targets for T-cell based therapies. The association with immunosuppression
  underscores the importance of immune surveillance in controlling this tumor.


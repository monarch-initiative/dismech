- accession: ega:EGAS00001008157
  title: 'High-Resolution Spatial Transcriptomics Uncover Epidermal-Dermal Divergences in Merkel Cell Carcinoma: Spatial Context Reshapes the Gene Expression Landscape'
  description: Merkel cell carcinoma (MCC) is an aggressive malignancy with neuroendocrine differentiation marked by high plasticity, often manifesting as rapid therapy resistance. Although the cell-of-origin is presumed to be epithelial, epidermal localization of MCC is rarely observed, largely because in situ MCC is typically an incidental finding. Nevertheless, a subset of MCC tumors exhibits epidermotropism, wherein tumor cells are present in the epidermis. The behavior of cancer cells is profoundly influenced by the tumor microenvironment and interactions with neighboring cells. Notably, the normal counterparts of the cancer’s cell-of-origin have been shown to attenuate tumor aggressiveness.

discussions:
- discussion_id: bejel_ocular_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the uveitis, optic atrophy and chorioretinal scarring reported in bejel
    patients actually caused by Treponema pallidum subsp. endemicum?
  rationale: >-
    This entry curates three ocular phenotypes from a clinical examination
    series of bejel patients, but a review of the endemic treponematoses states
    that the neurologic and ophthalmologic abnormalities attributed to yaws and
    bejel have been reported without firm evidence of a causal relationship. The
    two sources are not in contradiction - one reports an association in
    examined patients, the other declines to call it causal - but the entry
    should not be read as asserting more than the first source supports. The
    question matters because ocular involvement would imply a tissue tropism
    beyond the semimucosal and skeletal disease that otherwise defines bejel,
    and would narrow the gap between bejel and syphilis.
  attaches_to:
  - phenotypes#Uveitis
  - phenotypes#Optic atrophy
  - phenotypes#Chorioretinal Scar
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      abnormalities possibly caused by yaws and bejel have been reported, but
      without firm evidence of a causal relationship
    explanation: >-
      The explicit statement that the causal attribution is unestablished, which
      is what makes this a recorded gap rather than a curated mechanism.
notes: >-
  Curation gaps and boundary notes.

  Ocular phenotypes are associations, not established mechanism. Uveitis, optic
  atrophy and chorioretinal scarring are curated from a clinical examination
  series, and no pathophysiology node links them to a mechanism, because the
  review literature declines to call the association causal. That is recorded
  as an open discussion rather than resolved in either direction.

  No prevalence records. The literature reviewed gives bejel's geography and a
  3,507-case Iraqi series but no population rate for any endemic area, so
  epidemiology is curated without a prevalence block rather than converting a
  case count into a rate it does not support.

  Azithromycin is curated with a resistance caveat rather than as a
  co-equal first-line option. Oral azithromycin underpins mass treatment in
  yaws, but adult TEN isolates carrying the A2058G 23S rRNA mutation have been
  reported, so the treatment entry is deliberately named for that constraint.
  This is the one clear treatment difference from Pinta, where no resistance
  data exist at all.

  Primary-stage curation is thin by nature. The primary lesion is described in
  the source as seldom seen, so the primary stage carries a description of why
  it is missed rather than a phenotype list. The adult TEN case series reporting
  genital primary lesions is curated on the phenotype, and is a departure from
  classic childhood oral bejel rather than the endemic norm.

name: Bejel
creation_date: '2026-01-26T15:40:02Z'
category: Infectious Disease
description: >-
  Bejel, or endemic syphilis, is a chronic non-venereal treponematosis caused
  by Treponema pallidum subsp. endemicum and acquired in childhood by
  mouth-to-mouth contact and shared eating utensils within a household. It is
  endemic to hot, dry regions - the Sahel and the Arabian Peninsula - and that
  distribution follows directly from its transmission route: because the
  treponeme shelters in the moist oral cavity rather than on the skin, bejel
  persists in arid country where the skin-to-skin transmission of yaws and
  pinta would fail.

  Clinically it is the semimucosal member of the group. The primary lesion sits
  in the oral or oropharyngeal mucosa and is small enough that it is usually
  never seen, so patients typically present already in the secondary stage,
  with eroding mucosal plaques of the oropharynx and lips that may reach the
  larynx, alongside osteoperiostitis of the long bones. Untreated disease
  progresses to destructive gummatous lesions of the nose, palate and skeleton,
  but not to the cardiovascular and neurological disease that defines late
  syphilis. Penicillin is curative; azithromycin is qualified here rather than
  offered as an equal alternative, because macrolide-resistant TEN isolates
  have been reported.

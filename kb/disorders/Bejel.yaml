diagnosis:
- name: Treponemal and nontreponemal serology
  description: >-
    Bejel is diagnosed with the same tests used for syphilis: a nontreponemal
    screen confirmed by a treponemal assay. Their limitation is decisive here -
    they are reactive in every treponematosis, so serology establishes
    treponemal infection but cannot say which one, and the answer rests on
    lesion distribution plus residence in an endemic area.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      serological tests cannot distinguish between endemic treponematoses
      infections and syphilis
    explanation: >-
      States the limitation that makes serology non-specific for bejel and
      forces reliance on clinical and epidemiologic context.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT

    explanation: >-
      Names the confirmatory treponemal assays and records that they stay
      reactive after cure, so they cannot be used to judge treatment response.
- name: Molecular subspecies discrimination
  description: >-
    Whole-genome sequencing distinguishes Treponema pallidum subsp. endemicum
    from the syphilis and yaws treponemes where serology cannot. This is not a
    routine clinical test, but it is what allowed adult TEN infections to be
    recognised outside the classic endemic setting.
  evidence:
  - reference: PMID:35687593
    reference_title: "Whole genome sequences of Treponema pallidum subsp. endemicum isolated from Cuban patients: The non-clonal character of isolates suggests a persistent human infection rather than a single outbreak."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bejel (endemic syphilis) is a neglected non-venereal disease caused by Treponema pallidum subsp. endemicum (TEN)."
    explanation: >-
      Whole-genome sequencing of patient isolates is the method this entry
      records; the quote establishes that the sequenced organism is the bejel
      treponeme.
differential_diagnoses:
- name: Syphilis
  description: >-
    The most important differential, and the one bejel is most often mistaken
    for. Both present with mucosal lesions, papules at the oral commissures and
    intertriginous condylomata lata, and both are serologically reactive on
    identical tests.
  distinguishing_features:
  - Non-sexual acquisition, typically in childhood and within a household
  - Residence in or origin from an arid endemic region
  - Absence of cardiovascular and central nervous system involvement in late disease
  - Subspecies assignment by whole-genome sequencing where available
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Syphilis should always be considered in the differential diagnosis of
      bejel; both bejel and syphilis may present with mucosal lesions, papules
      at the oral commissures, and intertriginous condyloma lata
    explanation: Names syphilis as the differential and lists the shared presentations.
- name: Yaws
  description: >-
    The other moderately invasive endemic treponematosis, sharing bone and
    cartilage involvement in the secondary stage and an essentially identical
    histopathology.
  distinguishing_features:
  - Cutaneous rather than semimucosal lesion distribution
  - Humid forested rather than arid endemic setting
  - Skin-to-skin rather than oral transmission
  - Granulomas of epithelioid and multinucleated giant cells favour early bejel
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      bejel can be considered to be a semimucosal disorder and yaws a cutaneous
      condition, which are both moderately invasive producing bone and cartilage
      involvement in the secondary stage
    explanation: >-
      States the semimucosal versus cutaneous contrast that is the primary
      clinical discriminator between the two.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The histopathologic picture of bejel closely resembles that of yaws; though
      in early bejel, granulomas consisting of epithelioid cells and multinuclear
      giant cells may be present
    explanation: >-
      Records that histology is largely shared, and names the one feature that
      leans toward bejel.

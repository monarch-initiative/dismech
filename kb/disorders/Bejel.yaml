    explanation: The abstract identifies the causative treponeme for bejel.
transmission:
- name: Direct oral contact and shared utensils
  description: >-
    Bejel spreads mouth-to-mouth by direct non-sexual contact within households,
    classically between children, and indirectly through communal eating and
    drinking utensils. This route is what distinguishes bejel from its
    siblings: the treponeme shelters in the moist oral cavity rather than on
    the skin, so unlike yaws and pinta it persists in dry climates where
    skin-to-skin transmission would fail.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bejel is found in drier climates, but the bejel treponeme takes shelter in
      moist areas of the body, like the mouth, thus the infection spreads by
      direct contact (e.g., children kissing their siblings) or indirect contact
      through infected communal utensils
    explanation: >-
      States both routes and the reason the oral niche lets bejel occupy arid
      regions that the other endemic treponematoses cannot.
  - reference: PMID:25375929
    reference_title: "Whole genome sequence of the Treponema pallidum subsp. endemicum strain Bosnia A: the genome is related to yaws treponemes but contains few loci similar to syphilis treponemes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TEN infections are usually spread by direct contact or contaminated utensils rather than by sexual contact."
    explanation: Independently confirms the non-venereal route and states the contrast with syphilis directly.
epidemiology:
- name: Endemic in arid regions of the Sahel and the Arabian Peninsula
  description: >-
    Bejel occupies hot, dry regions - the southern Sahara margin and the
    Arabian Peninsula - and is classically acquired in childhood in households
    with crowded living conditions and limited water. Imported and locally
    transmitted cases have been reported outside those regions.
  factors:
  - childhood acquisition
  - arid climate
  - household crowding and shared utensils
  - poverty and limited water access
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bejel is encountered in the arid areas of the Sahel (southern border of
      the Sahara desert), including Senegal, Burkina Faso, Mali, and Niger
    explanation: Names the principal endemic region and its constituent countries.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It has also been described in the Arabian Peninsula (Saudi Arabia, Iraq, and Syria)"
    explanation: Extends the endemic range to the Arabian Peninsula.
stages:
- name: Primary bejel
  description: >-
    The primary lesion sits within the oral or oropharyngeal mucosa and is
    small enough that it is usually never observed. Bejel is therefore the one
    treponematosis in which the primary stage is routinely missed, and most
    patients present already in the secondary stage.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In bejel, the primary lesion is seldom seen because of its small size and
      location within the oral and oropharyngeal mucosa
    explanation: >-
      States both the location and the reason the primary stage escapes
      detection, which is the basis for this entry treating secondary
      presentation as the norm.
- name: Secondary bejel
  description: >-
    Eroding mucosal lesions and plaques of the oropharynx and lips, which may
    extend to the larynx and cause hoarseness, together with osteoperiostitis
    of the long bones. Bejel is semimucosal where yaws is cutaneous, and both
    are moderately invasive at this stage.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mucosal eroding lesions and plaques in the oropharynx and the lips, which
      can extend locally to the larynx causing hoarseness
    explanation: >-
      Describes the characteristic secondary-stage lesions, drawn from an
      analysis of 3,507 Iraqi cases.
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      bejel can be considered to be a semimucosal disorder and yaws a cutaneous
      condition, which are both moderately invasive producing bone and cartilage
      involvement in the secondary stage
    explanation: >-
      Establishes the semimucosal character of bejel and the bone and cartilage
      involvement that appears at this stage.
- name: Late bejel
  description: >-
    Untreated disease progresses to destructive gummatous lesions of skin,
    mucosa, nose, palate and bone. Unlike syphilis, bejel does not
    characteristically involve the cardiovascular system or the central nervous
    system.
  evidence:
  - reference: DOI:10.1371/journal.pntd.0002283
    reference_title: "Advances in the Diagnosis of Endemic Treponematoses: Yaws, Bejel, and Pinta"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with ETs generally do not present with organ involvement, whereas
      syphilis preferentially affects the central nervous and cardiovascular
      systems
    explanation: >-
      Supports the negative half of this stage description - the systemic
      involvement that separates late syphilis from late bejel.
  - reference: PMID:2682125
    reference_title: "[Review: endemic treponematoses are not always eradicated]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 100 million additional children are at risk for these disabling and disfiguring infections which destroy tissue and bone."
    explanation: Supports the destructive tissue and bone disease of the late stage.

progression:
- phase: Prenatal
  notes: >-
    Contractures form in utero; they can be detected by ultrasonography in the second
    trimester and, where the familial variant is known, by molecular prenatal testing.
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Prenatal diagnosis by ultrasonography is feasible at 18-24 weeks of gestation."
    explanation: Timing of prenatal detection.
- phase: Infancy and childhood
  notes: >-
    Contractures are worst at birth and improve postnatally; motor milestones may be
    somewhat delayed but nearly all children walk independently, with normal cognition
    and life expectancy.
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gross and fine motor milestones may be achieved somewhat later than age-matched controls but virtually all affected individuals become ambulatory without assist devices. Speech and language are rarely delayed. Cognitive abilities are usually not affected. Life expectancy is normal."
    explanation: Pediatric natural history in Sheldon-Hall syndrome (all genes).
diagnosis:
- name: Clinical diagnosis by contracture pattern
  description: >-
    Diagnosis rests on congenital distal contractures (ulnar deviation, camptodactyly,
    overriding fingers, hypoplastic flexion creases, talipes equinovarus, vertical
    talus) with minor facial criteria, and on distinguishing DA2B from DA1 and
    Freeman-Sheldon syndrome.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of SHS is based on clinical criteria."
    explanation: Clinical criteria are the diagnostic basis.
- name: Molecular genetic testing of TNNI2 and other DA genes
  description: >-
    Sequencing (gene panel or exome) establishes DA2B1 by finding a heterozygous TNNI2
    variant, and separates it from DA2B caused by TNNT3, MYH3, MYH8 or TPM2. Because
    an unaffected parent may be a low-level mosaic, deep sequencing of parental
    samples can clarify recurrence risk.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Mutation analysis is useful to distinguish SHS from arthrogryposis syndromes with similar features (e.g. distal arthrogryposis 1 and Freeman-Sheldon syndrome)."
    explanation: Role of molecular testing in differential diagnosis.
  - reference: PMID:36631501
    reference_title: Distal arthrogryposis in a girl arising from a novel TNNI2 variant inherited from paternal somatic mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Subsequent targeted amplicon-based deep sequencing detected the TNNI2 variant with variant allele frequencies of 9.4-17.7% in genomic DNA derived from peripheral blood leukocytes, saliva, hair, and nails in the father."
    explanation: Deep sequencing quantified low-level paternal mosaicism.
- name: Molecular prenatal diagnosis
  description: >-
    In families with a known TNNI2 variant, chorionic villus sampling or amniocentesis
    permits molecular prenatal diagnosis.
  diagnosis_term:
    preferred_term: chorionic villus sampling
    term:
      id: NCIT:C92755
      label: Chorionic Villus Sampling
  evidence:
  - reference: PMID:17380469
    reference_title: Molecular prenatal diagnosis for hereditary distal arthrogryposis type 2B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Here, we report the molecular prenatal diagnosis of 3 high-risk fetuses of two women in the family by two-point linkage inferential analysis and deletion detection of the TNNI2 gene with chorionic villus sampling (CVS) or amniocentesis."
    explanation: Molecular prenatal diagnosis for a TNNI2 K175del family.

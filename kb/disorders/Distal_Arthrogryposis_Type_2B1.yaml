name: Distal Arthrogryposis Type 2B1
creation_date: "2026-10-26T12:00:00Z"
category: Mendelian
parents:
- Sheldon-Hall Syndrome
- Distal Arthrogryposis
disease_term:
  preferred_term: distal arthrogryposis type 2B1
  term:
    id: MONDO:0020820
    label: distal arthrogryposis type 2B1
synonyms:
- DA2B1
- arthrogryposis, distal, type 2B1
- TNNI2-related Sheldon-Hall syndrome
description: >-
  Distal arthrogryposis type 2B1 (DA2B1) is the TNNI2-defined form of Sheldon-Hall
  syndrome (distal arthrogryposis type 2B, DA2B): an autosomal dominant congenital
  contracture disorder caused by heterozygous variants in TNNI2, which encodes the
  troponin I isoform of fast-twitch skeletal myofibers. Children are born with
  non-progressive contractures concentrated in the hands and feet (camptodactyly,
  ulnar deviation and overlapping of the fingers, talipes equinovarus or vertical
  talus) together with a recognizable but milder facial phenotype than
  Freeman-Sheldon syndrome (triangular face, downslanting palpebral fissures, small
  mouth). Contractures are most severe at birth, cognition and life expectancy are
  normal, and management is early physiotherapy, occupational therapy, casting and
  bracing, and orthopedic surgery. The reported TNNI2 variants cluster in the
  carboxy-terminal region of troponin I; in reconstituted thin filaments and
  troponin-exchanged skinned fast-twitch fibers they increase Ca2+ sensitivity of
  force, which is the basis of the leading, still model-derived, hypothesis that
  excess contractility of developing fast-twitch muscle produces the fetal
  contractures. Lump/split note: DA2B is genetically heterogeneous (TNNI2 = DA2B1;
  TNNT3, MYH3 and MYH8 define MONDO's other DA2B subtypes, and TPM2 also causes
  DA2B), the same TNNI2 variant can produce DA1 in one family and DA2B in another,
  and a TNNI2 family meeting strict Freeman-Sheldon (DA2A) criteria has been
  reported. This entry follows MONDO's gene-defined split and covers the TNNI2
  allelic series, including families labelled DA1 or DA2A; it does not cover the
  other DA2B genes.
notes: >-
  Lump/split. MONDO:0020820 is a gene-defined child of Sheldon-Hall syndrome
  (MONDO:0011128). A cohort of 153 DA1/DA2B families found no clinical differences by
  locus or between DA1 and DA2B and proposed they be treated as phenotypic extremes of
  one disorder (PMID:23401156), and a TNNI2 p.I165F family met strict Freeman-Sheldon
  criteria (PMID:23850728). The entry is kept gene-specific to match MONDO and because
  the mechanism below is specific to fast skeletal troponin I; a Sheldon-Hall or
  distal-arthrogryposis grouping spanning TNNI2, TNNT3, TPM2 (see
  TPM2-Related_Myopathy), MYH3 and MYH8 would be the place to lump. Most clinical
  phenotype evidence below comes from a gene-pooled Sheldon-Hall review
  (PMID:19309503), so no per-feature frequencies are given for the TNNI2 subset.
  No ClinGen gene-disease validity record for TNNI2 is present in the local ClinGen
  cache (cache/clingen/gene_validity.csv), so gene_disease_validity is left absent.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous TNNI2 variants are sufficient. Sheldon-Hall syndrome shows marked
    intra- and interfamilial variability, and an apparently de novo case can arise
    from a clinically unaffected parent who is a somatic mosaic for the variant.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "SHS is inherited in an autosomal dominant pattern but about half the cases are sporadic."
    explanation: >-
      Review of Sheldon-Hall syndrome across its causal genes stating autosomal
      dominant inheritance.
  - reference: PMID:36631501
    reference_title: Distal arthrogryposis in a girl arising from a novel TNNI2 variant inherited from paternal somatic mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Subsequent targeted amplicon-based deep sequencing detected the TNNI2 variant with variant allele frequencies of 9.4-17.7% in genomic DNA derived from peripheral blood leukocytes, saliva, hair, and nails in the father."
    explanation: >-
      A TNNI2 variant transmitted from an asymptomatic father who was mosaic for it,
      relevant to recurrence counselling for apparently sporadic cases. This is
      parental mosaicism, not a post-zygotic disease mechanism, so HP:0001442 is not
      bound.
genetic:
- name: TNNI2
  gene_term:
    preferred_term: TNNI2
    term:
      id: hgnc:11946
      label: TNNI2
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  inheritance:
  - name: Autosomal Dominant
  notes: >-
    Fast skeletal troponin I (11p15.5, adjacent to TNNT3). All reported DA variants
    are missense, in-frame deletions or a truncation in the carboxy-terminal region.
    TNNI2 is the defining gene of DA2B1; TNNT3, MYH3, MYH8 and TPM2 cause clinically
    indistinguishable DA2B in other families.
  evidence:
  - reference: PMID:12592607
    reference_title: Mutations in genes encoding fast-twitch contractile proteins cause distal arthrogryposis syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We now report that DA2B is caused by mutations in TNNI2 that are predicted to disrupt the carboxy-terminal domain of an isoform of troponin I (TnI) specific to the troponin-tropomyosin (Tc-Tm) complex of fast-twitch myofibers."
    explanation: Gene discovery report establishing TNNI2 as a cause of DA2B.
  - reference: PMID:23401156
    reference_title: Spectrum of mutations that cause distal arthrogryposis types 1 and 2B.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Disease-causing mutations in 56/153 (37%) kindreds including 14/48 (29%) with DA1 and 42/105 (40%) with DA2B were distributed nearly equally across TNNI2, TNNT3, TPM2, and MYH3."
    explanation: >-
      Cohort-level estimate that TNNI2 accounts for a share of DA2B comparable to
      TNNT3, TPM2 and MYH3; the per-gene count is not given in the abstract, so no
      case fraction is recorded.
  variants:
  - name: p.Arg174Gln (R174Q)
    description: >-
      Recurrent C-terminal missense variant; in reconstituted thin filaments and
      troponin-exchanged rabbit psoas fibers it increased Ca2+ sensitivity.
    evidence:
    - reference: PMID:17194691
      reference_title: "Mutations in fast skeletal troponin I, troponin T, and beta-tropomyosin that cause distal arthrogryposis all increase contractile function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "We have analyzed all four reported mutants: Arg63His TnT, Arg91Gly beta-TM, Arg174Gln TnI, and a TnI truncation mutant (Arg156ter)."
      explanation: Names R174Q and R156X as reported DA alleles studied functionally.
  - name: p.Arg156Ter (R156X)
    description: >-
      Truncating variant removing the C-terminal tail; in skinned fibers it raised
      both Ca2+ sensitivity and maximum force.
    evidence:
    - reference: PMID:17194691
      reference_title: "Mutations in fast skeletal troponin I, troponin T, and beta-tropomyosin that cause distal arthrogryposis all increase contractile function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "In troponin-exchanged skinned fibers, each mutant caused a significant increase in Ca2+ sensitivity, and Arg156ter TnI generated significantly higher maximum force."
      explanation: Functional effect of the truncating allele.
  - name: p.Glu167del (E167del)
    description: In-frame deletion reported in a three-generation family with a phenotype intermediate between DA2A and DA1.
    evidence:
    - reference: PMID:16497570
      reference_title: A TNNI2 mutation in a family with distal arthrogryposis type 2B.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Follow up DNA sequencing of the TNNI2 gene detected a three base pair deletion that would be predicted to result in the deletion of a glutamic acid at codon position 167 (DeltaE167)."
      explanation: Reports the E167del allele.
  - name: c.523_525delAAG (p.Lys175del)
    description: >-
      In-frame deletion cosegregating with DA in a large Chinese family with DA1-like
      and DA2B-like members; the allele modelled in the knock-in mouse.
    evidence:
    - reference: PMID:16802141
      reference_title: A novel deletion in TNNI2 causes distal arthrogryposis in a large Chinese family with marked variability of expression.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Direct sequencing of the PCR-amplified DNA fragment spanning exon 8 of the TNNI2 gene showed a heterozygous deletion, c.523_525delAAG (p.K175del), in the proband."
      explanation: Reports the K175del allele.
  - name: p.Lys176del (K176del)
    description: >-
      In-frame deletion in a three-generation family classified as DA1 with type 2
      fiber myopathy.
    evidence:
    - reference: PMID:16924011
      reference_title: A mutation in the fast skeletal muscle troponin I gene causes myopathy and distal arthrogryposis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Analysis of TNNI2 encoding the troponin I isoform expressed in type 2 muscle fibers disclosed a heterozygous three-base in-frame deletion, 2,918-2,920del, skipping the highly conserved lysine at position 176."
      explanation: Reports the K176del allele.
  - name: c.485G>A (p.Arg162Lys)
    description: >-
      Missense variant in a girl with DA2B features and torticollis, inherited from a
      father whose only finding was hip dysplasia. The source prints the cDNA change
      as "c.485>A".
    evidence:
    - reference: PMID:27790376
      reference_title: Distal arthrogryposis with variable clinical expression caused by TNNI2 mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Using exome sequencing, we identified a novel TNNI2 mutation (c.485>A, p.Arg162Lys) in the patient and her father."
      explanation: Reports the R162K allele and its transmission from a minimally affected parent.
  - name: c.532T>C (p.Phe178Leu)
    description: Missense variant in a Japanese girl with typical DA2B, inherited from a mosaic, unaffected father.
    evidence:
    - reference: PMID:36631501
      reference_title: Distal arthrogryposis in a girl arising from a novel TNNI2 variant inherited from paternal somatic mosaicism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Exome sequencing identified a causative variant in TNNI2 ... in a Japanese girl with typical DA2b."
      explanation: Reports the F178L allele in DA2B.
  - name: p.Phe178Cys (F178C)
    description: Missense variant at the same residue reported in a three-generation Chinese family classified as DA1.
    evidence:
    - reference: PMID:26374086
      reference_title: A novel missense mutation of TNNI2 in a Chinese family cause distal arthrogryposis type 1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The mutation p.F178C that could change the H-bond formation of a neighboring residue occurs at a highly conserved position, suggesting that this variation probably affects the TNNI2 protein function."
      explanation: Reports F178C; illustrates the DA1/DA2B overlap at one residue.
  - name: c.A493T (p.Ile165Phe)
    description: >-
      C-terminal missense variant in a family meeting strict Freeman-Sheldon (DA2A)
      criteria, including an adult mosaic carrier with facial contractures only.
    evidence:
    - reference: PMID:23850728
      reference_title: A novel TNNI2 mutation causes Freeman-Sheldon syndrome in a Chinese family with an affected adult with only facial contractures.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Subsequent sequencing of TNNI2 revealed a novel mutation, c.A493T (p.I165F), located in the C-terminal region, which is critical for proper protein function."
      explanation: Reports I165F in a TNNI2 family with a Freeman-Sheldon phenotype.
pathophysiology:
- name: TNNI2 C-Terminal Variant in Fast Skeletal Troponin I
  biological_scale: MOLECULAR
  description: >-
    Heterozygous TNNI2 variants alter the carboxy-terminal region of fast skeletal
    troponin I, the region required for its inhibitory action. Troponin I binds actin
    and tropomyosin and, in the absence of Ca2+, prevents contraction; the variants are
    predicted to disrupt this regulatory interaction rather than abolish the protein.
  genes:
  - preferred_term: TNNI2
    term:
      id: hgnc:11946
      label: TNNI2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: troponin I binding to actin
    term:
      id: GO:0003779
      label: actin binding
  - preferred_term: troponin I binding to tropomyosin
    term:
      id: GO:0005523
      label: tropomyosin binding
  evidence:
  - reference: PMID:12592607
    reference_title: Mutations in genes encoding fast-twitch contractile proteins cause distal arthrogryposis syndromes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We now report that DA2B is caused by mutations in TNNI2 that are predicted to disrupt the carboxy-terminal domain of an isoform of troponin I (TnI) specific to the troponin-tropomyosin (Tc-Tm) complex of fast-twitch myofibers."
    explanation: Places the DA2B variants in the TnI C-terminal domain of the fast-twitch troponin-tropomyosin complex.
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All of the reported mutations map to the C-terminal region of troponin I which is required for the inhibitory action of the protein ... The mechanism by which mutations in TNNI2 cause contractures is unclear but troponin I binds to actin and tropomyosin, and in the absence of Ca2+ prevents muscle contraction."
    explanation: >-
      States the actin- and tropomyosin-binding inhibitory function of troponin I that
      the C-terminal variants affect, while noting the downstream mechanism is unclear.
  downstream:
  - target: Increased Calcium Sensitivity of Fast-Twitch Thin Filament Activation
    causal_link_type: DIRECT
    description: >-
      Loss of normal C-terminal inhibitory regulation shifts thin-filament activation
      to lower Ca2+ concentrations.
  - target: Type 2 Fiber Myopathic Change
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in one TNNI2 family; how the variant leads to fiber-type-restricted
      myopathic change is not established.
  - target: Impaired Endochondral Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mouse-only proposal of a non-muscle role for Tnni2 in growth-plate bone, via
      increased Hif3a; not demonstrated in humans.
- name: Increased Calcium Sensitivity of Fast-Twitch Thin Filament Activation
  biological_scale: MOLECULAR
  description: >-
    Thin filaments carrying DA-associated troponin I mutants activate myosin ATPase
    more at every Ca2+ concentration, and troponin-exchanged skinned fast-twitch
    fibers show increased Ca2+ sensitivity of force. Measured with recombinant human
    mutant proteins exchanged into rabbit psoas fibers, not in patient muscle.
  cell_types:
  - preferred_term: fast-twitch skeletal muscle fiber (rabbit psoas, troponin-exchanged)
    term:
      id: CL:0000190
      label: fast muscle cell
  biological_processes:
  - preferred_term: Ca2+ sensitivity of skeletal myofibril force
    term:
      id: GO:0014723
      label: regulation of skeletal muscle contraction by modulation of calcium ion sensitivity of myofibril
    modifier: INCREASED
  evidence:
  - reference: PMID:17194691
    reference_title: "Mutations in fast skeletal troponin I, troponin T, and beta-tropomyosin that cause distal arthrogryposis all increase contractile function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In troponin-exchanged skinned fibers, each mutant caused a significant increase in Ca2+ sensitivity, and Arg156ter TnI generated significantly higher maximum force."
    explanation: Direct measurement of increased Ca2+ sensitivity for the TnI R174Q and R156X mutants in skinned fast-twitch fibers.
  - reference: PMID:17194691
    reference_title: "Mutations in fast skeletal troponin I, troponin T, and beta-tropomyosin that cause distal arthrogryposis all increase contractile function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Thin filaments containing either a troponin or beta-TM DA mutant produced significantly enhanced ATPase rates at all calcium concentrations without alternating calcium-sensitivity or cooperativity."
    explanation: Reconstituted thin-filament ATPase assays show enhanced activation with the DA mutants.
  downstream:
  - target: Increased Contractility of Developing Fast-Twitch Muscle
    causal_link_type: DIRECT
    description: Greater force at submaximal Ca2+ means more contraction for a given activation.
- name: Increased Contractility of Developing Fast-Twitch Muscle
  biological_scale: CELLULAR
  description: >-
    Proposed consequence of the Ca2+-sensitization: excess contractile activity of
    fast-twitch muscle during fetal development. This node is an inference from
    isolated-fiber and reconstituted-protein data; it has not been measured in
    patient myofibers or in fetal muscle.
  biological_processes:
  - preferred_term: fast-twitch skeletal muscle fiber contraction
    term:
      id: GO:0031443
      label: fast-twitch skeletal muscle fiber contraction
    modifier: INCREASED
  evidence:
  - reference: PMID:17194691
    reference_title: "Mutations in fast skeletal troponin I, troponin T, and beta-tropomyosin that cause distal arthrogryposis all increase contractile function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We propose the mutations cause increased contractility of developing fast-twitch skeletal muscles, thus causing muscle contractures and the development of the observed limb deformities."
    explanation: The authors' proposed mechanism, inferred from their in vitro data.
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some mutations appear to increase contractility, although this has not yet been confirmed in ex vivo studies of myofiber contractility in affected individuals."
    explanation: Review noting that the hypercontractility model lacks confirmation in patient myofibers.
  downstream:
  - target: Congenital Distal Joint Contracture Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sustained excess tension across developing distal joints is proposed to fix them
      in flexion; the intervening tissue steps are not characterized.
- name: Congenital Distal Joint Contracture Formation
  biological_scale: TISSUE
  description: >-
    Fixed contractures of the distal limb joints that form in utero, are most severe at
    birth, and improve or remain stable postnatally rather than progressing; flexion
    contractures can worsen without therapy.
  evidence:
  - reference: PMID:19309503
    reference_title: Sheldon-Hall syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Contractures are most severe at birth and non-progressive. However, flexion contractures can worsen over time in the absence of appropriate intervention (e.g., occupational therapy, physical therapy, surgery)."
    explanation: Natural history of the contractures in Sheldon-Hall syndrome.
  - reference: PMID:25340332
    reference_title: A gain-of-function mutation in Tnni2 impeded bone development through increasing Hif3a expression in DA2B mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Like DA2B patients, homozygous and heterozygous mutant mice exhibited an obviously smaller body size than their wild-type counterparts (Figure 1B and Figure S2B), as well as forelimb contracture (Figure S2A and C), supporting the idea that the mutation has a dominant effect"
    explanation: Tnni2 K175del knock-in mice develop forelimb contractures in the heterozygous state.
  downstream:
  - target: Distal arthrogryposis
  - target: Camptodactyly of finger
  - target: Ulnar deviation of finger
  - target: Overlapping fingers
  - target: Abnormal finger flexion crease
  - target: Talipes equinovarus
  - target: Congenital vertical talus
  - target: Overlapping toe
- name: Type 2 Fiber Myopathic Change
  biological_scale: CELLULAR
  description: >-
    In one TNNI2 (K176del) family, adult carriers had mildly raised creatine kinase and
    biopsy myopathic changes confined to type 2 fibers, without clinical weakness. The
    family was classified DA1, so this node rests on one family at the DA1 end of the
    TNNI2 spectrum.
  cell_types:
  - preferred_term: type 2 skeletal muscle fiber
    term:
      id: CL:0002212
      label: type II muscle cell
  evidence:
  - reference: PMID:16924011
    reference_title: A mutation in the fast skeletal muscle troponin I gene causes myopathy and distal arthrogryposis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The four affected adults had slightly increased levels of creatine kinase in blood, and muscle biopsy specimens showed findings of myopathy with changes restricted to type 2 fibers."
    explanation: Human biopsy evidence of fiber-type-restricted myopathy in TNNI2 carriers.
  downstream:
  - target: Myopathy
  - target: Elevated circulating creatine kinase activity
- name: Impaired Endochondral Ossification
  biological_scale: TISSUE
  description: >-
    In Tnni2 K175del knock-in mice, Tnni2 was expressed in growth-plate osteoblasts and
    chondrocytes, mutant protein transactivated Hif3a more than wild type, and
    increased Hif3a with reduced Vegf was associated with delayed endochondral
    ossification and small body size. This is a mouse-only proposal for the short
    stature of DA2B; it has not been examined in patients.
  cell_types:
  - preferred_term: osteoblast (mouse)
    term:
      id: CL:0000062
      label: osteoblast
  - preferred_term: chondrocyte (mouse)
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endochondral ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: DECREASED
  evidence:
  - reference: PMID:25340332
    reference_title: A gain-of-function mutation in Tnni2 impeded bone development through increasing Hif3a expression in DA2B mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The increased amount of hif3a resulted in impairment of angiogenesis, delay in endochondral ossification, and decrease in chondrocyte differentiation and osteoblast proliferation, suggesting that hif3a counteracted hif1a-induced Vegf expression in DA2B mice."
    explanation: Mouse knock-in data underlying this node.
  downstream:
  - target: Short stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed in mice to explain the small body size; untested in humans.

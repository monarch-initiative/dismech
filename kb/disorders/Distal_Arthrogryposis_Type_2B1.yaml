animal_models:
- name: Tnni2 K175del knock-in mouse
  species: Mouse
  genotype: Tnni2 c.523_525delAAG (p.K175del), heterozygous and homozygous
  publication: PMID:25340332
  description: >-
    Knock-in of the human DA2B K175del allele into mouse Tnni2. Heterozygous and
    homozygous mice show forelimb contracture and small body size.
  modeled_mechanisms:
  - target: Congenital Distal Joint Contracture Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Heterozygous mutants develop forelimb contractures.
    limitations: >-
      Contractures were reported for forelimbs; the paper's mechanistic work addresses
      bone growth rather than muscle Ca2+ sensitivity, so the contracture mechanism is
      not tested in this model.
    evidence:
    - reference: PMID:25340332
      reference_title: A gain-of-function mutation in Tnni2 impeded bone development through increasing Hif3a expression in DA2B mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Tnni2K175del mice (referred to as DA2B mice) showed typical DA2B phenotypes, including limb abnormality and small body size."
      explanation: Model reproduces limb abnormality and small size.
  - target: Impaired Endochondral Ossification
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: Source of the endochondral ossification node.
    limitations: >-
      The bone mechanism is only described in mice; whether patients with DA2B1 have
      impaired endochondral ossification is unknown.
    evidence:
    - reference: PMID:25340332
      reference_title: A gain-of-function mutation in Tnni2 impeded bone development through increasing Hif3a expression in DA2B mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The increased amount of hif3a resulted in impairment of angiogenesis, delay in endochondral ossification, and decrease in chondrocyte differentiation and osteoblast proliferation, suggesting that hif3a counteracted hif1a-induced Vegf expression in DA2B mice."
      explanation: Measured bone phenotype in the knock-in.
discussions:
- discussion_id: hypercontractility_unconfirmed_in_patient_muscle
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased Contractility of Developing Fast-Twitch Muscle
  prompt: >-
    Do TNNI2 DA variants increase contractility of human fetal or patient fast-twitch
    myofibers, as the isolated-fiber exchange experiments predict?
  rationale: >-
    The Ca2+-sensitization data come from recombinant mutant troponin exchanged into
    rabbit psoas fibers. The step from that to excess fetal muscle contractility and
    then to fixed contractures is inferred, and the Sheldon-Hall review notes that it
    has not been confirmed in patient myofibers.

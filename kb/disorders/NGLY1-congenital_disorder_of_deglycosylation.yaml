animal_models:
- name: Ngly1-/- rat (Sprague Dawley, CRISPR exon 11-12 deletion)
  species: Rat
  genotype: Ngly1 homozygous deletion of exons 11-12 and the 3' polyA region
  description: >-
    The workhorse model of the disease and the one the gene-therapy programme
    is built on. Unlike the mouse, it is viable, and it reproduces the human
    features that matter for an endpoint: motor and gait deficits, impaired
    spatial learning, peripheral axon loss, and elevated GNA in plasma and CSF.
    Longitudinal work out to 17-18 months added a progressive, lethal course -
    about half the animals dead or euthanized by 9-10 months, roughly 92%
    reduction in rotarod latency, widespread neuroinflammation, and loss of
    spinal motor neurons - which is what makes it a model of a progressive
    neurodegenerative disease rather than a static one.
  publication: PMID:41721346
  modeled_mechanisms:
  - target: Neurodevelopmental, ocular, and hepatic dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-

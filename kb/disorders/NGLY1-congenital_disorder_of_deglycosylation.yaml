name: NGLY1-congenital disorder of deglycosylation
creation_date: "2026-07-06T06:04:18Z"
description: >-
  NGLY1-congenital disorder of deglycosylation (NGLY1-CDDG; congenital disorder
  of deglycosylation 1) is an autosomal recessive disorder caused by biallelic
  NGLY1 variants. NGLY1 encodes cytosolic N-glycanase 1, which removes N-glycans
  from misfolded N-linked glycoproteins retrotranslocated from the endoplasmic
  reticulum for degradation. Deglycosylation here is both a disposal step and a
  signal: with NGLY1 absent, ENGase cleaves the glycan at a different bond and
  leaves a single GlcNAc on the protein, whose breakdown yields the substrate
  biomarker GlcNAc-asparagine (GNA); and the transcription factor NFE2L1/Nrf1,
  which NGLY1 activates by editing glycosylated asparagines to aspartate, is
  left unedited, disabling the proteasome bounce-back response. The result is a
  multisystem neurodevelopmental disorder with developmental delay, hypotonia,
  a hyperkinetic movement disorder, alacrima, transient transaminase elevation,
  microcephaly, seizures, and a length-dependent sensorimotor neuropathy, with
  a published median lifespan of about 13 years. An AAV9 gene replacement
  therapy is in a first-in-human trial with CSF GNA as a co-primary endpoint.
  Which of NGLY1's several functions actually causes the phenotype is not
  known, and the ERAD account is under active challenge.

biochemical:
- name: Aspartylglycosamine in dried blood spots
  context: >-
    Aspartylglycosamine is increased in dried blood spots and is proposed as a
    small-molecule biomarker of NGLY1-CDDG.
  evidence:
  - reference: PMID:31311714
    reference_title: "Aspartylglycosamine is a biomarker for NGLY1-CDDG, a congenital disorder of deglycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified aspartylglycosamine as the only significantly increased
      compound
    explanation: >-
      The metabolomics study supports aspartylglycosamine as a biochemical
      readout.
- name: GlcNAc-asparagine (GNA) in plasma, urine and CSF
  context: >-
    GlcNAc-Asn, also written GNA and reported in earlier work as
    aspartylglycosamine, is the substrate biomarker of NGLY1 deficiency. It is
    the terminal catabolite of the ENGase bypass route, so its concentration is
    an inverse readout of NGLY1 function. It is elevated in patient plasma and
    urine, in dried blood spots, and in the plasma and CSF of the Ngly1-null
    rat; it is stable over time; and it falls with gene-therapy treatment,
    which is what makes it usable as a pharmacodynamic endpoint rather than
    only a diagnostic marker. CSF GNA is a co-primary endpoint of the
    first-in-human GS-100 trial.
  readouts:
  - target: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      GNA concentration is the direct measurement of the catabolite this node
      represents.
  evidence:
  - reference: PMID:34697629
    reference_title: "GlcNAc-Asn is a biomarker for NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We demonstrate that N-acetylglucosamine-asparagine (GlcNAc-Asn; GNA), is
      the analyte most closely associated with NGLY1 deficiency, showing
      consistent separation in levels between patients and controls.
    explanation: >-
      Establishes GNA as the analyte with the clearest patient-control
      separation.
  - reference: PMID:34697629
    reference_title: "GlcNAc-Asn is a biomarker for NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is conserved as a marker for loss of NGLY1 function in NGLY1-deficient
      cell lines, rodents (urine, cerebrospinal fluid, plasma and tissues) and
      patients (plasma and urine)
    explanation: >-
      Establishes the matrices in which GNA is measurable and its
      cross-species conservation.
  - reference: PMID:42114141
    reference_title: "Natural history of NGLY1 deficiency: motor function & clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver transaminase and biomarker N-acetylglucosamine-asparagine
      (GlcNAc-Asn; GNA) levels were elevated in all participants.
    explanation: >-
      Prospective natural-history confirmation that GNA is elevated in every
      participant.

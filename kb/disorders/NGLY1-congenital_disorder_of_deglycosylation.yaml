progression:
- phase: Progressive developmental divergence with relatively stable individual function
  age_range: infancy onward; symptom onset averages about 4 months
  notes: >-
    A one-year prospective natural-history study of 15 participants - roughly
    10% of the identified patient population - found profound global
    developmental delay across communication, gross and fine motor, and
    cognitive domains. The pattern it documents is specific and easy to
    misread: individual measurements were mostly stable over the year, while
    age-equivalent scores diverged further from neurotypical peers, meaning the
    gap widens because development does not keep pace rather than because
    function is lost. Most patients never walk and do not develop verbal
    communication. Peripheral and auditory neuropathy in the 2026 multicenter
    cohort were observed to appear over time rather than at presentation, so
    the disease continues to accrue features after diagnosis.
  evidence:
  - reference: PMID:42114141
    reference_title: "Natural history of NGLY1 deficiency: motor function & clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Age-equivalent scores identified a widening developmental gap between
      participants and neurotypical peers over time, indicating delayed
      milestone achievement and/or regression.
    explanation: The core progression finding of the prospective study.
  - reference: PMID:42114141
    reference_title: "Natural history of NGLY1 deficiency: motor function & clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although fluctuations were observed, measurements for individual
      participants were mostly stable over the course of the NHS.
    explanation: >-
      The counterpart finding that keeps the widening gap from being read as
      rapid individual decline over one year.
  - reference: PMID:42361657
    reference_title: "Expanding the clinical and molecular spectrum of NGLY1 deficiency: A multicenter cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peripheral and auditory neuropathy findings were observed over time.
    explanation: Establishes that neuropathy accrues after presentation.
  - reference: PMID:40687377
    reference_title: "Preclinical pharmacology and safety studies to support an AAV9 NGLY1 gene therapy clinical trial for the treatment of NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients are unable to walk and do not develop verbal communication
      skills, requiring significant caregiver support for daily management.
    explanation: The functional endpoint the natural history converges on.
treatments:
- name: GS-100 (AAV9-mediated NGLY1 gene replacement)
  description: >-
    A recombinant single-stranded AAV9 vector delivering a functional copy of
    human NGLY1, given as a single intracerebroventricular dose. The route is
    the finding, not an implementation detail: in the Ngly1-null rat, ICV and
    IV+ICV administration improved behaviour while intravenous-only did not,
    and adding IV to ICV added nothing - which is the evidence that the CNS is
    the primary therapeutic target organ. Preclinical work showed dose-dependent
    CNS biodistribution, reduced CSF and brain GNA, and improved motor function,
    with CSF GNA reduction correlating with behavioural improvement. Safety
    studies in wild-type rats and non-human primates found no adverse effects at
    or near the clinical starting dose, supporting an FDA IND. This is an
    investigational therapy with no human efficacy data yet.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: NGLY1 N-glycanase deficiency
    treatment_effect: ACTIVATES
    description: >-
      Restores NGLY1 expression and enzymatic activity at the trigger node,
      rather than acting on any downstream consequence.
    evidence:
    - reference: PMID:34120625
      reference_title: "Reversibility of motor dysfunction in the rat model of NGLY1 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        restored NGLY1 expression in the brain and spinal cord, concomitant with
        increased enzymatic activity of NGLY1 in the brain
      explanation: Direct restoration of the deficient enzyme at the trigger node.
  - target: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
    treatment_effect: INHIBITS
    description: >-
      Restoring the amidase removes the need for the ENGase bypass, and the GNA
      catabolite falls in CSF and brain.
    evidence:
    - reference: PMID:36320418
      reference_title: "AAV9-NGLY1 gene replacement therapy improves phenotypic and biomarker endpoints in a rat model of NGLY1 Deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        GS-100 delivered by ICV or IV+ICV significantly reduced levels of the
        substrate biomarker N-acetylglucosamine-asparagine (GlcNAc-Asn or GNA)
        in CSF and brain tissue compared with untreated Ngly1-/- rats.
      explanation: Direct measurement of the biomarker response to treatment.
  evidence:
  - reference: PMID:40687377
    reference_title: "Preclinical pharmacology and safety studies to support an AAV9 NGLY1 gene therapy clinical trial for the treatment of NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In pharmacology studies using Ngly1 -/- rats, intracerebroventricular
      (i.c.v.) administration of GS-100 showed dose-dependent biodistribution,
      increased hNGLY1 mRNA expression, reduced disease biomarker
      N-acetylglucosamine-asparagine (GNA), improved motor function, and
      prevented phenotype progression.
    explanation: The preclinical efficacy package supporting the IND.
  - reference: PMID:40687377
    reference_title: "Preclinical pharmacology and safety studies to support an AAV9 NGLY1 gene therapy clinical trial for the treatment of NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These nonclinical data supported the Food and Drug Administration
      approval of an Investigational New Drug application for a first-in-human
      phase 1/2/3 dose-escalation clinical trial.
    explanation: Establishes the regulatory status - investigational, not approved.
  - reference: PMID:36320418
    reference_title: "AAV9-NGLY1 gene replacement therapy improves phenotypic and biomarker endpoints in a rat model of NGLY1 Deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ICV and IV + ICV administration of GS-100 resulted in behavioral
      improvements in rotarod and rearing tests, whereas IV-only administration
      did not.
    explanation: >-
      The route-dependence result that makes intracerebroventricular delivery
      the chosen route.
- name: N-acetylglucosamine (GlcNAc) supplementation for alacrima
  description: >-
    An oral dietary supplement tested specifically against the tear-production

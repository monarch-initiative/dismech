        explanation: Reports the biomarker measurement and its correlation with benefit.
- name: Ngly1-null mouse (C57BL/6) and the Engase double knockout
  species: Mouse
  genotype: Ngly1 knockout on C57BL/6; Ngly1/Engase double knockout
  description: >-
    A negative and a genetic result rather than a phenotyping platform. The
    Ngly1-null mouse is embryonically lethal on a C57BL/6 background, which
    human NGLY1 deficiency is not, so on its own it fails as a model of the
    human disease. Its value is what rescues it: additionally deleting Engase
    partially rescues the lethality, and outcrossing to ICR partially rescues
    it too. Viable mixed-background animals then show a severe phenotype
    reminiscent of patients, and those defects are again suppressed by Engase
    deletion. This is the strongest genetic evidence that the damage in NGLY1
    deficiency is done by the diverted ENGase route rather than by the absence
    of deglycosylation as such.
  publication: PMID:28426790
  modeled_mechanisms:
  - target: Neurodevelopmental, ocular, and hepatic dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      On the C57BL/6 background the model dies in utero, so it cannot express
      the postnatal multisystem phenotype that defines the human disease.
    limitations: >-
      The failure is background-dependent, not absolute: a mixed C57BL/6-ICR
      background yields viable animals with a phenotype resembling patients. A
      strain-specific embryonic lethality with no human counterpart means any
      rescue measured against it is measured against the wrong endpoint, which
      is the core translational problem with this model.
    evidence:
    - reference: PMID:28426790
      reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we analyzed Ngly1-deficient mice and found that they are embryonic
        lethal in C57BL/6 background
      explanation: >-
        The embryonic lethality that human patients do not have, and which this
        model therefore fails to recapitulate.
  - target: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Removing ENGase genetically removes the bypass route and rescues the
      phenotype, which is the causal test of that node.
    limitations: >-
      Germline deletion from conception is not the same intervention as
      pharmacological inhibition in a diagnosed patient, and the rescue is
      partial. No ENGase inhibitor has been tested in a human.
    readouts:
    - name: Survival of Ngly1-null animals
      target: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
      direction: RESTORED
      interpretation: >-
        Partial restoration of viability on removing the bypass enzyme.
      evidence:
      - reference: PMID:28426790
        reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the additional deletion of the gene encoding endo-β-N-acetylglucosaminidase
          (Engase), which is another de-N-glycosylating enzyme but leaves a single
          GlcNAc at glycosylated Asn residues, resulted in the partial rescue of the
          lethality of the Ngly1-deficient mice
        explanation: Reports the rescue and its mechanism.
    evidence:
    - reference: PMID:28426790
      reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        cytoplasmic ENGase represents one of the potential therapeutic targets
        for this genetic disorder
      explanation: >-
        The authors' framing of the rescue as therapeutically informative for
        this node.
- name: Tamoxifen-inducible Ngly1-knockout (iNgly1) mouse
  species: Mouse
  genotype: Tamoxifen-inducible Ngly1 knockout on C57BL/6
  description: >-
    An inducible knockout that sidesteps the embryonic lethality of the
    constitutive C57BL/6 null and produces a postnatal phenotype - elevated
    GlcNAc-Asn, motor deficits, kyphosis, Purkinje cell loss, gait abnormality -
    in which systemic gene therapy can be tested. Systemic AAV.PHPeB delivery
    corrected multiple features at 8 weeks and near-completely normalized the
    neurological phenotype over a year.
  publication: PMID:39137042
  modeled_mechanisms:
  - target: Neurodevelopmental, ocular, and hepatic dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the motor, skeletal and cerebellar features of the human
      disease; the ocular and hepatic components are not among the reported
      readouts.
    limitations: >-
      Adult-inducible knockout does not model a congenital, developmental
      disease - the animal develops normally before the gene is removed, which
      is the opposite of the patient's situation. The therapeutic result also
      does not transfer as reported: AAV.PHPeB's CNS tropism is mouse-specific
      and, as the authors state, does not translate to primates.
    readouts:
    - name: Neurological phenotype after systemic gene transfer
      target: Neurodevelopmental, ocular, and hepatic dysfunction
      direction: RESTORED
      interpretation: >-
        Durable near-complete normalization over a year, the strongest efficacy
        result in any NGLY1 model.
      evidence:
      - reference: PMID:39137042
        reference_title: "Systemic gene therapy corrects the neurological phenotype in a mouse model of NGLY1 deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          another cohort of AAV.PHPeB-treated iNgly1 mice were monitored over a
          year and showed near-complete normalization of the neurological
          aspects of the disease phenotype, demonstrating the durability of gene
          therapy
        explanation: Reports the treatment response and its durability.
    evidence:
    - reference: PMID:39137042
      reference_title: "Systemic gene therapy corrects the neurological phenotype in a mouse model of NGLY1 deficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we first characterized a tamoxifen-inducible Ngly1-knockout (iNgly1)
        C57BL/6J mouse model, which exhibited symptoms recapitulating human
        disease, including elevation of the biomarker GlcNAc-Asn, motor
        deficits, kyphosis, Purkinje cell loss, and gait abnormalities
      explanation: The model's characterized phenotype.
discussions:
- discussion_id: gap_ngly1_which_substrate_explains_the_phenotype
  prompt: >-
    Which NGLY1 substrate or function accounts for the clinical phenotype -
    alacrima, the hyperkinetic movement disorder, the neuropathy - and is ERAD
    involvement even part of the answer?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired cytosolic deglycosylation of ERAD substrates
  - pathophysiology#Failed NFE2L1 sequence editing and proteasome bounce-back failure
  - pathophysiology#ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
  rationale: >-
    The textbook account - NGLY1 deglycosylates ERAD substrates, so its loss
    breaks ERAD - is under direct challenge. Work on the Drosophila model
    states plainly that loss of NGLY1 has little effect on ERAD and does not
    prevent degradation of misfolded proteins, and that the physiological
    significance of NGLY1 in ERAD is not understood. Meanwhile the best
    characterized substrate, NFE2L1/Nrf1, is not an ERAD client being disposed
    of but a transcription factor being activated, and NGLY1 has further
    reported substrates and functions - NKCC1, BMP signaling, AMPK signaling,
    and a non-enzymatic role in aquaporin transcription - none of which has
    been tied to a specific clinical feature. Nothing in the literature
    connects any single substrate to alacrima, to the movement disorder, or to
    the length-dependent neuropathy. This entry therefore keeps every edge from
    a molecular node to the clinical consequence typed as
    INDIRECT_UNKNOWN_INTERMEDIATES, and curates the ERAD node as a perturbation
    rather than as a demonstrated degradative failure.
  evidence:
  - reference: PMID:40773511
    reference_title: "Natural SEL1L variants rescue a model of NGLY1 deficiency and modify ERAD function and proteasome sensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite this, the physiological significance of NGLY1 in ERAD is not
      understood.
    explanation: >-
      States the gap in the ERAD account directly, from a group working on the
      pathway.
  - reference: PMID:39137042
    reference_title: "Systemic gene therapy corrects the neurological phenotype in a mouse model of NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pathophysiological basis of NGLY1 deficiency may be associated with
      the absence of various enzymatic and nonenzymatic roles of NGLY1
    explanation: >-
      An independent statement that the causal function is unresolved and may
      not be the enzymatic one at all.
  proposed_experiments:
  - experiment_id: exp_ngly1_substrate_specific_rescue
    name: Substrate-specific rescue in a viable NGLY1-deficient model
    description: >-
      In the Ngly1-null rat or the inducible mouse, restore individual
      candidate outputs one at a time - constitutively edited Nrf1, corrected
      NKCC1, ENGase suppression - without restoring NGLY1 itself, and score
      tear production, motor phenotype, and nerve conduction separately. A
      feature that a single-substrate rescue corrects is a feature that
      substrate explains. Note the constraint the Nrf1 work supplies: mutants
      mimicking constitutive activation are cytotoxic, so the Nrf1 arm needs a
      conditional design.
  - experiment_id: exp_ngly1_lacrimal_gland_mechanism
    name: Why the lacrimal gland
    description: >-
      Alacrima is near-pathognomonic and among the earliest features, yet no
      mechanism links NGLY1 to tear production. Profile lacrimal gland tissue
      from a viable model for NGLY1-dependent substrates, testing in particular
      the reported non-enzymatic role in aquaporin transcription, which is the
      only proposed route with an obvious connection to secretion.
- discussion_id: mismatch_ngly1_mouse_rat_human_severity
  prompt: >-
    Ngly1-null mice die in utero, Ngly1-null rats live to adulthood and then
    degenerate, and human patients survive to a median of about 13 years. Which
    of these is the right model of human NGLY1 deficiency, and what does the
    disagreement mean?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#NGLY1 N-glycanase deficiency
  - pathophysiology#Neurodevelopmental, ocular, and hepatic dysfunction
  rationale: >-
    The species spread is not a nuisance but a finding. Complete loss of the
    same enzyme is embryonically lethal in one rodent and compatible with
    adult life in another, and the mouse lethality is itself
    strain-dependent - outcrossing C57BL/6 to ICR partially rescues it, as does
    deleting Engase. Whatever makes the difference is a modifier of severity
    that is not NGLY1, and the same logic likely applies to the phenotypic
    heterogeneity seen between human patients with identical NGLY1 genotypes.
    The practical consequence is that a therapeutic rescue measured against
    mouse embryonic lethality is measured against an endpoint no patient has,
    while the rat's progressive adult decline is a closer match to the human
    course but was only characterized out to 17-18 months in 2026. Curating
    either rodent result as though it were a human result would overstate it.
  evidence:
  - reference: PMID:28426790
    reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a change in the genetic background of C57BL/6 mice, produced by crossing
      the mice with an outbred mouse strain (ICR) could partially rescue the
      embryonic lethality of Ngly1-deficient mice
    explanation: >-
      Shows severity in the mouse is set by background modifiers rather than by
      Ngly1 genotype alone.
  - reference: PMID:41721346
    reference_title: "Progressive neurodegeneration, motor decline, and premature mortality in aging Ngly1 deficient rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, Ngly1⁻/⁻ mice (C57BL/6) are embryonically lethal, and prior
      characterization of Ngly1⁻/⁻ rats was restricted to young adult rat (~7
      months old), leaving late-onset phenotypes and potential lifespan
      reduction unexplored.
    explanation: >-
      States the species discrepancy and the gap in rat characterization that
      the study was designed to close.
  - reference: PMID:42361657
    reference_title: "Expanding the clinical and molecular spectrum of NGLY1 deficiency: A multicenter cohort."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients carried homozygous variants, and no clear
      genotype-phenotype correlation was observed.
    explanation: >-
      The human counterpart of the modifier problem: severity is not read off
      the NGLY1 genotype in patients either.
  proposed_experiments:
  - experiment_id: exp_ngly1_modifier_mapping_across_backgrounds
    name: Map the background modifiers of Ngly1-null severity
    description: >-
      Cross the Ngly1 null onto a panel of inbred backgrounds and map the loci
      that convert embryonic lethality into viability. Candidate modifiers with
      human orthologs - SEL1L is already one such candidate from the Drosophila
      screen - can then be tested against severity in the patient cohort, where
      genotype currently predicts nothing.
- discussion_id: gap_ngly1_gene_therapy_partial_rescue
  prompt: >-
    AAV9-delivered NGLY1 suppressed convulsions in Ngly1-null rats without
    correcting EEG abnormality or sleep fragmentation. What does the
    dissociation mean for what gene therapy can be expected to achieve?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#GS-100 (AAV9-mediated NGLY1 gene replacement)
  - pathophysiology#Neurodevelopmental, ocular, and hepatic dysfunction
  rationale: >-
    The gene-therapy programme has a strong preclinical package on motor
    endpoints and on the GNA biomarker, and it is easy to read that as
    disease-wide correction. A separate group, dosing AAV9-hNGLY1 into the same
    rat model, found the opposite for two other endpoints: NGLY1 protein was
    robustly expressed and deglycosylation activity partially restored, and
    non-epileptic convulsions fell, but EEG abnormalities and sleep disruption
    did not improve. Only partial restoration of enzymatic activity was
    achieved, so the dissociation may reflect dose rather than a ceiling on
    what restoration can fix; the alternative - that some features are already
    developmentally fixed by the time of dosing, or depend on a function the
    vector does not restore - has different implications for patient selection
    and for the age at which treatment is worth giving. The trial's co-primary
    endpoints are CSF GNA and motor function, neither of which would detect
    this gap.
  evidence:
  - reference: PMID:41176936
    reference_title: "AAV9-mediated NGLY1 gene replacement suppresses non-epileptic convulsions in Ngly1(-/-) rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      While NGLY1 protein was robustly expressed in the brain with partial
      restoration of enzymatic deglycosylation activity, AAV9-hNGLY1-treated
      Ngly1-/- rats showed no significant improvement in EEG abnormalities or
      sleep disruption.
    explanation: The negative result at the heart of this gap.
  - reference: PMID:41176936
    reference_title: "AAV9-mediated NGLY1 gene replacement suppresses non-epileptic convulsions in Ngly1(-/-) rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      persistent EEG seizures and sleep disturbances indicate only a partial
      therapeutic benefit, underscoring the need for further refinement of gene
      therapy strategies, as well as additional therapeutic options, for NGLY1
      deficiency
    explanation: >-
      The authors' own reading, which is more cautious than the programme-level
      preclinical summaries.
  proposed_experiments:
  - experiment_id: exp_ngly1_dose_response_across_endpoint_classes
    name: Dose-response across endpoint classes in the Ngly1-null rat
    description: >-
      Dose AAV9-NGLY1 across a range spanning the reported partial-restoration
      level, and score motor function, GNA, EEG, and sleep architecture in the
      same animals. If EEG and sleep respond at higher restored activity, the
      dissociation is a dose effect; if they remain refractory at full
      restoration, they identify features that gene replacement cannot address.
  - experiment_id: exp_ngly1_treatment_age_window
    name: Does the age at dosing determine which features respond
    description: >-
      Compare dosing at weaning against dosing after the phenotype is
      established in the Ngly1-null rat, using the same endpoint panel. A
      window effect would bear directly on the 2-to-18-year enrolment range of
      the first-in-human trial.

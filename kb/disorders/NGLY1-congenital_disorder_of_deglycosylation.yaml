  results: >-
    Serum transferrin glycoform analysis and N/O glycan profiling are
    unreliable for NGLY1-CDDG; proceed to molecular genetic testing.
  evidence:
  - reference: PMID:29419975
    reference_title: NGLY1-Related Congenital Disorder of Deglycosylation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical serum screening tests for congenital disorders of glycosylation
      (i.e., analysis of serum transferrin glycoforms, N and O glycan

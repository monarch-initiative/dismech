- name: Standard CDG serum screening does not detect NGLY1-CDDG
  description: >-
    A clinically critical negative. NGLY1-CDDG is a disorder of
    de-glycosylation, not of glycan synthesis, so the serum screens used to
    triage the congenital disorders of glycosylation are not informative here
    and a normal result does not exclude it. Screening an NGLY1-CDDG proband
    the way a CDG proband would be screened yields a false negative.
  diagnosis_term:
    preferred_term: serum transferrin glycoform screening
    term:
      id: NCIT:C15419

- name: ENGase-mediated alternative deglycosylation and GlcNAc-Asn accumulation
  conforms_to: "cytosolic_deglycosylation#Cytosolic Glycan Catabolite Dysregulation"
  biological_scale: MOLECULAR
  role: amplifier
  description: >-
    With peptide:N-glycanase absent, the cytosol has no other way to cut the
    GlcNAc-asparagine bond, so endo-beta-N-acetylglucosaminidase (ENGase)
    cleaves between the two GlcNAc residues instead and leaves a single GlcNAc
    on the asparagine. The partially deglycosylated protein that results is
    aggregation-prone, and its eventual proteasomal breakdown yields
    GlcNAc-asparagine (GNA), which accumulates in cells, animal models, and
    patients. Two things make this node the most consequential in the entry.
    GNA is the disease's substrate biomarker and the pharmacodynamic endpoint
    that the gene-therapy programme is built on. And ENGase itself is a
    therapeutic target rather than a bystander: deleting Engase partially
    rescues the embryonic lethality of Ngly1-null mice, which is the strongest
    genetic evidence available that the damage is done by the diverted route
    and not merely by loss of the normal one.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: ABNORMAL
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - preferred_term: protein deglycosylation
    modifier: ABNORMAL
    term:
      id: GO:0006517
      label: protein deglycosylation
  evidence:
  - reference: PMID:39137042
    reference_title: "Systemic gene therapy corrects the neurological phenotype in a mouse model of NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Under NGLY1 deficiency, another deglycosylating enzyme known as ENGase
      removes N-glycans by cleaving the glycosidic bond between the 2 GlcNAc
      residues, leaving a single GlcNAc residue attached to the protein. This
      incompletely deglycosylated protein is prone to aggregation
    explanation: >-
      States the alternative reaction and the aggregation-prone product that
      this node represents.
  - reference: PMID:34697629
    reference_title: "GlcNAc-Asn is a biomarker for NGLY1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GNA accumulation is directly linked to the absence of functional NGLY1,
      presenting strong potential for its use as a biomarker.
    explanation: >-
      Ties the accumulating catabolite directly to loss of enzyme function.
  - reference: PMID:28426790
    reference_title: "Lethality of mice bearing a knockout of the Ngly1-gene is partially rescued by the additional deletion of the Engase gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      cytoplasmic ENGase represents one of the potential therapeutic targets
      for this genetic disorder
    explanation: >-
      Establishes ENGase as a target rather than an incidental bypass, on the
      strength of the Engase-deletion rescue.
  downstream:
  - target: Neurodevelopmental, ocular, and hepatic dysfunction
    description: >-
      Accumulation of GNA tracks with disease across cells, rodents, and
      patients, and falls when NGLY1 is restored - but no step connects the
      catabolite to any specific clinical feature.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34697629
      reference_title: "GlcNAc-Asn is a biomarker for NGLY1 deficiency."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Elevated GNA levels differentiate patients from controls, are stable
        over time and correlate with changes in NGLY1 activity.
      explanation: >-
        Supports GNA as a marker of enzyme function, not as a cause of any
        phenotype, which is why this edge stays weakly typed.
- name: Failed NFE2L1 sequence editing and proteasome bounce-back failure
  conforms_to: "cytosolic_deglycosylation#Loss of Deglycosylation-Dependent Substrate Activation"
  biological_scale: CELLULAR
  role: effector
  description: >-
    Not every NGLY1 substrate is being thrown away. The ER-associated
    transcription factor NFE2L1/Nrf1 is activated by deglycosylation: NGLY1
    converts its glycosylated asparagines to aspartate, and only after that
    edit at Asn574 can Nrf1 bind host cell factor C1 and O-GlcNAc transferase,
    reach chromatin, and drive proteasome-subunit gene expression. Without
    NGLY1 the edit does not happen, and the cell cannot mount the proteasome
    bounce-back response when the proteasome is compromised. Pathogenic patient
    variants, including Arg401* which accounts for roughly a fifth of alleles,
    misprocess NFE2L1 and impair proteasomal-subunit transcription, so this is
    a lesion of the human disease and not only of engineered cells. Note the
    counterintuitive constraint from the same work: constitutively active Nrf1
    is itself cytotoxic, so a therapy that simply forced the pathway on would
    not be safe.
  biological_processes:
  - preferred_term: proteasome assembly
    modifier: DECREASED
    term:
      id: GO:0043248
      label: proteasome assembly
  - preferred_term: response to oxidative stress
    modifier: ABNORMAL
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:41468431
    reference_title: "NFE2L1/Nrf1 forms a coactivator complex post-peptide:N-glycanase-mediated sequence editing and mitigates proteasome dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Editing of Asn574 is essential for interaction with host cell factor C1
      and O-GlcNAc transferase, which is required for Nrf1 chromatin binding and
      sufficient proteasome expression.
    explanation: >-
      The molecular route from the NGLY1-dependent edit to proteasome-subunit
      expression.
  - reference: PMID:40643555
    reference_title: "Structural and Functional Characterization of N-Glycanase-1 Pathogenic Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our functional and structural assessments of these variants show that
      they cause a profound reduction in NGLY1 activity, severely reduced
      expression of NGLY1 protein, and misprocessing of the transcription
      factor NFE2L1.
    explanation: >-
      Shows the NFE2L1 lesion arising from real patient variants rather than
      from engineered enzyme removal.
  - reference: PMID:40643555
    reference_title: "Structural and Functional Characterization of N-Glycanase-1 Pathogenic Variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      transcription of proteasomal subunits and NGLY1 mRNA splicing are
      impaired by some of these variants
    explanation: >-
      Confirms the downstream transcriptional consequence in patient variants.
  downstream:
  - target: Neurodevelopmental, ocular, and hepatic dysfunction
    description: >-
      A candidate route from the editing defect to clinical disease. No
      reported work connects failed Nrf1 activation to any specific feature of
      the human phenotype, so this edge is a hypothesis.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Neurodevelopmental, ocular, and hepatic dysfunction
  conforms_to: "cytosolic_deglycosylation#Neurodevelopmental and Multisystem Dysfunction"
  description: >-
    NGLY1-CDDG presents with developmental delay, movement disorder, hypotonia,
    alacrima or hypolacrima, elevated liver transaminases, microcephaly,
    seizures, and peripheral neuropathy.
  role: consequence
  evidence:
  - reference: PMID:24651605
    reference_title: "Mutations in NGLY1 cause an inherited disorder of the endoplasmic reticulum-associated degradation pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had global developmental delay, a movement disorder, and
      hypotonia.
    explanation: >-
      The clinical series supports the neurologic branch of the phenotype.
  - reference: PMID:27388694
    reference_title: "Prospective phenotyping of NGLY1-CDDG, the first congenital disorder of deglycosylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      decreased tear production, transient transaminitis, small feet, a complex
      hyperkinetic movement disorder, and varying degrees of global developmental
      delay with relatively preserved socialization are the most consistent
      features.
    explanation: >-
      Prospective phenotyping supports the ocular, hepatic, movement, and
      developmental components.

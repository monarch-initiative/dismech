  description: >-
    Transcriptomic profiling of HeLa cells expressing glycan-less Nrf1 mutants
    (9NA and 9ND) in which all nine putative N-glycosylation sites were
    replaced, isolating the sequence-editing-specific contribution to Nrf1
    function. This is the primary dataset behind the NFE2L1 sequence-editing
    node in this entry.

name: Mitochondrial Complex I Deficiency Nuclear Type 23
category: Mendelian
creation_date: "2026-08-27T00:00:00Z"
synonyms:
- MC1DN23
- NDUFA12-related mitochondrial disease
- NDUFA12 deficiency
- Mitochondrial complex I deficiency, nuclear type 23
description: >-
  Mitochondrial complex I deficiency nuclear type 23 is caused by biallelic
  loss-of-function NDUFA12 variants. NDUFA12 is a supernumerary (accessory) rather than a
  core subunit of complex I, required for assembly or stability of the electron-transferring
  Q module in the peripheral arm. It is a paralogue of the assembly factor NDUFAF2, and
  that relationship turns out to be central to how the disease behaves.

  Two features make this entry worth reading carefully rather than treating as one more
  numbered complex I deficiency.

  First, an assembly paradox. Patient cells with a nonsense allele have no detectable
  NDUFA12 protein at all, yet a fully assembled and enzymatically active complex I is
  still present, only in reduced amounts - which is why NDUFA12 is placed at a late
  assembly step or in stability rather than as a subunit the complex cannot form without.
  Knockdown work reaches a stronger conclusion, that NDUFA12 is necessary for a functional
  holoenzyme, so the two lines are not fully reconciled. The likely bridge is NDUFAF2:
  in NDUFA12-mutant patient cells NDUFAF2 associates with the active complex, which it
  does not do in cells mutated in other complex I subunits, so the paralogue appears to
  substitute for the missing protein.

  Second, a genotype-phenotype disconnect that is unusually clean. Across reported
  families the protein is virtually absent in every case, yet onset and clinical course
  differ substantially - and heterogeneity occurs within families carrying the same
  variant. The phenotype spans Leigh and Leigh-like syndrome with basal ganglia lesions,
  dystonia-predominant movement disorder, spasticity, and at the mild end isolated optic
  atrophy with unremarkable MRI. Since the molecular lesion is identical, the modifier
  must lie outside NDUFA12.

  NDUFA12 is a rare cause: screening 122 complex I deficient patients across two studies
  found no mutations.

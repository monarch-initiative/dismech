- name: Basal Ganglia Vulnerability
  description: >-
    Selective vulnerability of the basal ganglia to the energy deficit, giving the
    symmetrical T2-hyperintense lesions that define the Leigh-syndrome pole of the
    spectrum. This was the presentation of the founding case and of six of nine cases in
    the largest series.
  biological_scale: TISSUE

    snippet: "Nine unreported NDUFA12 cases from six pedigrees were identified, with presentation ranging from movement disorder phenotypes (dystonia and/or spasticity) to isolated optic atrophy."
    explanation: Establishes isolated optic atrophy as one pole of the spectrum.
  - reference: PMID:35141356

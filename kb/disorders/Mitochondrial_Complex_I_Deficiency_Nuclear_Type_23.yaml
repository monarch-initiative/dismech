genetic:
- name: NDUFA12
  notes: >-
    NDUFA12 encodes a supernumerary accessory subunit of complex I and is a paralogue of
    the assembly factor NDUFAF2. It is a rare cause of complex I deficiency: no mutations
    were found when 122 complex I deficient patients were screened across two studies.
    Reported disease alleles are homozygous and truncating, and the resulting protein
    absence is complete and consistent - which makes the clinical variability between
    patients carrying the same variant a modifier question rather than an allelic one.
  relationship_type: CAUSATIVE

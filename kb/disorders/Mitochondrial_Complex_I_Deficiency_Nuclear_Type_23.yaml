- name: Optic Nerve Vulnerability
  description: >-
    Selective vulnerability of the optic nerve and its retinal ganglion cells, which at the
    mild end of the spectrum is the only affected tissue, with unremarkable brain imaging.
    Curated as a node distinct from the basal ganglia because the two dissociate: the
    largest series reports patients with one, the other, or neither, all carrying
    homozygous truncating variants, and visual involvement can appear years after a purely
    motor presentation.
  biological_scale: TISSUE
  locations:
  - preferred_term: optic nerve

pathophysiology:
- name: NDUFA12 Loss of Function
  description: >-
    Biallelic truncating NDUFA12 variants abolish the protein. The founding allele
    c.178C>T (p.Arg60X) introduces a premature stop codon, and western blot shows complete
    absence of NDUFA12 in patient fibroblasts. Functional complementation restores complex
    I activity, establishing the variant as causal rather than merely associated.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: NDUFA12
    term:
      id: hgnc:23987
      label: NDUFA12
  downstream:
  - target: Impaired Complex I Q-Module Assembly and Stability
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21617257
    reference_title: "Respiratory chain complex I deficiency due to NDUFA12 mutations as a new cause of Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in one of the genes, NDUFA12, a homozygous c.178C→T mutation leading to a premature stop codon (p.Arg60X) was found"
    explanation: The founding nonsense allele.
  - reference: PMID:21617257
    reference_title: "Respiratory chain complex I deficiency due to NDUFA12 mutations as a new cause of Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis showed absence of NDUFA12 protein in patient fibroblasts and functional complementation by a baculovirus system showed restoration of complex I activity."
    explanation: >-
      Both the protein-level consequence and the rescue that establishes causality rather
      than association.
  - reference: PMID:33715266
    reference_title: "Novel NDUFA12 variants are associated with isolated complex I defect and variable clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients displayed novel homozygous mutations in the NDUFA12 gene, leading to the virtual absence of the corresponding protein."
    explanation: Confirms complete protein loss as the consistent consequence across seven further patients.
- name: Impaired Complex I Q-Module Assembly and Stability
  description: >-
    NDUFA12 is one of the roughly thirty supernumerary subunits acquired evolutionarily
    alongside complex I's fourteen conserved core subunits. Knockdown of NDUFA12 alongside
    NDUFA3 and NDUFA5 shows it is needed for a functional holoenzyme, and analysis of
    assembly intermediates places the requirement at assembly or stability of the
    electron-transferring Q module in the peripheral arm.

    The complication is that patient cells lacking NDUFA12 entirely still contain fully
    assembled, enzymatically active complex I - in reduced amounts. That is why the founding
    study places NDUFA12 at a late assembly step or in stability rather than treating it as
    structurally indispensable, and it is a weaker requirement than the knockdown work
    implies. The two are not fully reconciled.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
  cellular_components:
  - preferred_term: respiratory chain complex I
    term:
      id: GO:0045271
      label: respiratory chain complex I
  downstream:
  - target: NDUFAF2 Compensatory Association
    causal_link_type: DIRECT
  - target: Reduced NADH Dehydrogenase Activity
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24717771
    reference_title: "Supernumerary subunits NDUFA3, NDUFA5 and NDUFA12 are required for the formation of the extramembrane arm of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of the assembly intermediates in mitochondria depleted for these subunits further suggested that they are required for assembly and/or stability of the electron transferring Q module in the peripheral arm of the CI."
    explanation: Localises the requirement to the Q module of the peripheral arm.
  - reference: PMID:24717771
    reference_title: "Supernumerary subunits NDUFA3, NDUFA5 and NDUFA12 are required for the formation of the extramembrane arm of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using human cell lines in which the expression of these subunits was knocked down with miRNAs, we showed that they are necessary for the formation of a functional holoenzyme."
    explanation: The knockdown evidence for a strict requirement.
  - reference: PMID:21617257
    reference_title: "Respiratory chain complex I deficiency due to NDUFA12 mutations as a new cause of Leigh syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Despite the complete absence of NDUFA12 protein, a fully assembled and enzymatically active complex I could be found, albeit in reduced amounts."
    explanation: >-
      Graded PARTIAL and included precisely because it qualifies the preceding item. Total
      protein loss does not abolish holoenzyme formation, which is a weaker requirement
      than the knockdown result implies.
  - reference: PMID:21617257
    reference_title: "Respiratory chain complex I deficiency due to NDUFA12 mutations as a new cause of Leigh syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This suggests that NDUFA12 is required either at a late step in the assembly of complex I, or in the stability of complex I."
    explanation: The authors' own resolution of the paradox, stated as two alternatives they cannot separate.
- name: NDUFAF2 Compensatory Association
  description: >-
    NDUFA12's paralogue NDUFAF2 is a complex I assembly factor, and in NDUFA12-mutant
    patient cells it associates with the *active* complex. That behaviour is specific: in
    patient fibroblasts mutated in other complex I subunits, NDUFAF2 is instead attached to
    an inactive subcomplex (NDUFS1, NDUFV1) or not detected at all (NDUFS7). The paralogue
    appears to take the place of the missing subunit on an assembled, working enzyme -
    which is the most economical explanation for why complex I still functions without
    NDUFA12.

    The relationship is directional and not symmetric. Loss of NDUFS4 causes near-complete
    loss of NDUFA12, but loss of NDUFA12 does not reduce NDUFS4.
  biological_scale: MOLECULAR
  notes: >-
    This node carries no downstream edge, deliberately. NDUFAF2 association is a mitigating
    response to the missing subunit, not a cause of the enzyme deficit - the reduced
    activity is already caused by the assembly and stability node upstream of both. Do not
    draw an edge from here to Reduced NADH Dehydrogenase Activity: CausalEdge has no
    polarity, so any arrow out of this node reads as compensation causing the deficiency.
  evidence:
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In NDUFA12-mutated LS patient cells, NDUFA12 absence did not reduce NDUFS4 levels but triggered NDUFAF2 association to active CI."
    explanation: >-
      The core observation - NDUFAF2 joins the active complex specifically when NDUFA12 is
      missing, and the loss relationship with NDUFS4 runs one way only.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "BN-PAGE revealed no such association in LS patient fibroblasts with mutations in other CI subunit-encoding genes where NDUFAF2 was attached to CI-830 (NDUFS1, NDUFV1 mutation) or not detected (NDUFS7 mutation)."
    explanation: >-
      The specificity control. Without it the NDUFAF2 association would be a generic
      response to complex I disease rather than a paralogue-specific compensation.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "absence of NDUFS4 induces near complete absence of NDUFA12 but not vice versa"
    explanation: Establishes the asymmetric dependency between the two accessory subunits.
- name: Reduced NADH Dehydrogenase Activity
  description: >-
    Isolated biochemical complex I deficiency in muscle and fibroblasts, with the rest of
    the respiratory chain intact. Isolated complex I deficiency is the most frequent
    biochemical signature among mitochondrial diseases and has more than eighty monogenic
    causes, so the biochemistry alone does not point to NDUFA12.
  biological_scale: CELLULAR
  molecular_functions:

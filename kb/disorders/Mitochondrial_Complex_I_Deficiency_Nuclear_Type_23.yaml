diagnosis:
- name: Genomic sequencing after biochemical complex I deficiency
  description: >-
    The biochemical finding of isolated complex I deficiency is the entry point, but it
    cannot identify the gene - more than eighty monogenic causes produce it. The founding
    case required genome-wide homozygosity mapping; contemporary series use
    next-generation sequencing with Sanger confirmation, supported by enzyme activities,
    blue native gel electrophoresis and western blot. Because NDUFA12 protein is
    completely absent in reported cases, western blot is unusually informative here.
  evidence:
  - reference: PMID:33715266
    reference_title: "Novel NDUFA12 variants are associated with isolated complex I defect and variable clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular genetic characterization was performed using next-generation sequencing combined with the Sanger method. Biochemical and protein studies were achieved by enzymatic activities, blue native gel electrophoresis, and western blot analysis."
    explanation: The contemporary diagnostic workflow for this disorder.
  - reference: PMID:33715266
    reference_title: "Novel NDUFA12 variants are associated with isolated complex I defect and variable clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Leigh syndrome represents the most frequent neuroradiological finding in patients with complex I defect and more than 80 monogenic causes have been involved in the disease."
    explanation: Explains why genomic rather than targeted testing is required.
- name: Distinguishing NDUFA12 disease from idiopathic intracranial hypertension
  description: >-
    A young patient with new-onset headache and progressive bilateral visual loss can be
    labelled idiopathic intracranial hypertension, and at least one NDUFA12 patient was.
    The features that should redirect the workup are the combination of optic atrophy with
    dystonia, and non-neurological features that do not fit a defined syndrome. This
    matters here because optic atrophy is one pole of the NDUFA12 spectrum and can be the
    only manifestation, with unremarkable brain MRI.
  evidence:
  - reference: PMID:41694149
    reference_title: "Identifying NDUFA12 mutation in a Saudi family: An unusual presentation of mitochondrial Complex I deficiency mimicking as idiopathic intracranial hypertension in a patient with papilledema and visual loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article reports on a patient with mutation in NDUFA12 that was initially perceived as idiopathic intracranial hypertension, calling attention to the importance of considering NDUFA12 mutations in optic atrophy and dystonia diagnoses, particularly in young patients with new onset headache and progressive bilateral visual impairment."
    explanation: >-
      A documented misdiagnosis and the authors' explicit recommendation to consider
      NDUFA12 in that presentation.
discussions:
- discussion_id: ndufa12_identical_genotype_variable_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do patients with complete, uniform absence of NDUFA12 protein have such different
    onsets and courses - Leigh syndrome in some, isolated optic atrophy in others - even
    within the same family carrying the same variant?
  attaches_to:
  - pathophysiology#Basal Ganglia Vulnerability
  - pathophysiology#Optic Nerve Vulnerability
  - genetic#NDUFA12
  rationale: >-
    This is a cleaner natural experiment than most genotype-phenotype puzzles. The alleles
    are homozygous and truncating, the protein is virtually absent in every reported case,
    and the biochemical lesion is isolated complex I deficiency throughout - yet the
    clinical range runs from fatal infantile Leigh syndrome to isolated optic atrophy with
    a normal MRI, and the largest series reports heterogeneity for the same variant both
    between and within families. Because the primary lesion does not vary, the explanation
    has to be elsewhere: mitochondrial DNA background, nuclear modifiers of complex I
    assembly, differences in how effectively NDUFAF2 compensates in different tissues or
    individuals, or environmental triggers of decompensation. The NDUFAF2 route is the most
    tractable of these, since it is already measurable by blue native PAGE in patient
    fibroblasts - if compensation efficiency tracked clinical severity, that would be
    visible in existing cell lines.

    The extreme pole of the puzzle is a homozygous carrier with no disease at all. One
    reported family includes an asymptomatic sibling of two affected individuals who carries
    the same variant homozygously, which the authors read as incomplete penetrance. That
    case sets the range at zero and rules out any explanation that depends on the genotype
    alone being sufficient - whatever the modifier is, it can abolish the phenotype
    entirely, not merely shift its severity.
  evidence:
  - reference: PMID:33715266
    reference_title: "Novel NDUFA12 variants are associated with isolated complex I defect and variable clinical manifestation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, despite the fact that in none of the analyzed patients, NDUFA12 protein was detected, they present a different onset and clinical course of the disease."
    explanation: States the disconnect directly - identical protein loss, different disease.
  - reference: PMID:35141356
    reference_title: "Biallelic Loss-of-Function NDUFA12 Variants Cause a Wide Phenotypic Spectrum from Leigh/Leigh-Like Syndrome to Isolated Optic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "providing evidence of intra- and inter-familial clinical heterogeneity for the same variant"
    explanation: >-
      Heterogeneity within families for one variant, which rules out most allele-level and
      many population-level explanations.
  - reference: PMID:35141356
    reference_title: "Biallelic Loss-of-Function NDUFA12 Variants Cause a Wide Phenotypic Spectrum from Leigh/Leigh-Like Syndrome to Isolated Optic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the asymptomatic sibling of two affected individuals (Pedigree D) carried the mutant allele in the homozygous state, thus suggesting either incomplete penetrance"
    explanation: >-
      The extreme pole of the puzzle - a homozygous carrier of the same variant with no
      disease. Any proposed modifier has to be able to abolish the phenotype, not merely
      soften it.
- discussion_id: ndufa12_assembly_requirement_conflict
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is NDUFA12 required for complex I holoenzyme formation, or only for its stability? The
    knockdown and patient-cell evidence disagree, and NDUFAF2 compensation may be why.
  attaches_to:
  - pathophysiology#Impaired Complex I Q-Module Assembly and Stability
  - pathophysiology#NDUFAF2 Compensatory Association
  rationale: >-
    miRNA knockdown of NDUFA12 in human cell lines indicates it is necessary for formation
    of a functional holoenzyme, with assembly intermediates pointing at the Q module. But
    patient fibroblasts with a nonsense allele and no detectable NDUFA12 still contain
    fully assembled, enzymatically active complex I, in reduced amounts. Those cannot both
    be complete accounts. The most likely reconciliation is the paralogue: NDUFAF2 is found
    associated with the active complex specifically in NDUFA12-mutant cells and not in
    cells mutated in other subunits, so chronic absence may permit a compensation that an
    acute knockdown does not. That is testable - knock down NDUFAF2 in NDUFA12-mutant
    patient fibroblasts and ask whether the residual active complex I survives. Resolving
    it matters beyond nomenclature, because if NDUFAF2 substitution is what preserves
    residual activity, its efficiency becomes a candidate modifier for the clinical
    variability curated in the discussion above.
  evidence:
  - reference: PMID:24717771
    reference_title: "Supernumerary subunits NDUFA3, NDUFA5 and NDUFA12 are required for the formation of the extramembrane arm of human mitochondrial complex I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using human cell lines in which the expression of these subunits was knocked down with miRNAs, we showed that they are necessary for the formation of a functional holoenzyme."
    explanation: The strict-requirement side of the conflict, from acute knockdown.
  - reference: PMID:21617257
    reference_title: "Respiratory chain complex I deficiency due to NDUFA12 mutations as a new cause of Leigh syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Despite the complete absence of NDUFA12 protein, a fully assembled and enzymatically active complex I could be found, albeit in reduced amounts."
    explanation: >-
      Graded REFUTE against the strict-requirement reading - chronic total absence in
      patient cells still permits an assembled, active enzyme.
  - reference: PMID:32335026
    reference_title: "NDUFS4 deletion triggers loss of NDUFA12 in Ndufs4(-/-) mice and Leigh syndrome patients: A stabilizing role for NDUFAF2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In NDUFA12-mutated LS patient cells, NDUFA12 absence did not reduce NDUFS4 levels but triggered NDUFAF2 association to active CI."
    explanation: The proposed bridge - paralogue compensation available in chronic loss.

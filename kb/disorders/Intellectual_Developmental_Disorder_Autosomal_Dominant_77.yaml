name: Intellectual Developmental Disorder, Autosomal Dominant 77
creation_date: "2026-10-16T22:20:00Z"
category: Mendelian
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous
  missense or loss-of-function variants in LRRC7, which encodes densin-180, a
  neuron-specific leucine-rich repeat and PDZ domain (LAP) scaffold enriched in
  the postsynaptic density of glutamatergic synapses. Densin-180 links the
  alpha subunit of CaMKII, Shank, delta-catenin and alpha-actinin, and
  regulates postsynaptic mGluR5 levels and Cav1.2 channel trafficking. The defining cohort of 33
  individuals showed intellectual disability and delayed speech as the core
  features, with ADHD, autism, aggressive or impulsive behaviour, occasional
  seizures, and hyperphagia-associated obesity in a subset carrying central
  truncating variants. Truncating variants predominate and are thought to act
  through haploinsufficiency; penetrance is incomplete and expressivity is
  variable.
synonyms:
- MRD77
- LRRC7-related neurodevelopmental disorder
disease_term:
  preferred_term: intellectual developmental disorder, autosomal dominant 77
  term:
    id: MONDO:0980748
    label: intellectual developmental disorder, autosomal dominant 77
parents:
- Neurodevelopmental Disorder
references:
- reference: PMID:39256359
  title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
notes: >-
  LRRC7 expression is limited to the brain, and the defining study states that
  the mechanism behind the hyperphagia and obesity seen in some patients is
  unresolved; the hyperphagia node is therefore left without an upstream
  mechanism. No GeneReviews chapter covers LRRC7 or this disorder: `just
  check-genereviews --online` (Bookshelf snapshot 2026-09-10 plus a live
  PubMed title search) returned only chapters on other genes' "-related
  neurodevelopmental disorder".
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous LRRC7 variants arise de novo or are inherited. In at least
    eight families the variant was inherited, five times from a parent judged
    unaffected, so penetrance is incomplete; one carrier mother had a different
    neuropsychiatric phenotype from her child, so expressivity is variable.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identify here 33 individuals (one of them previously described) with a
      dominant neurodevelopmental disorder due to heterozygous missense or
      loss-of-function variants in LRRC7.
    explanation: States the dominant, heterozygous mode of the disorder.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In at least eight cases, the variants in LRRC7 were inherited from their
      parents; five of these were classified as unaffected by the enrolling
      clinicians, indicating that LRRC7 variants may display incomplete
      penetrance.
    explanation: Inherited variants from unaffected parents document incomplete penetrance.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phenotypic heterogeneity is evident in cases who share the same variant,
      such as mother and daughter in pedigree Z, where the daughter has a rather
      typical phenotype, whereas the mother is affected by a neuropsychiatric
      disorder but no ID.
    explanation: Different phenotypes with the same variant document variable expressivity.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The defining features are intellectual disability, speech delay and
      neurobehavioural abnormalities arising from a postsynaptic scaffold
      defect.
pathophysiology:
- name: LRRC7 Loss of Function
  description: >-
    More than half of affected individuals carry nonsense, splice-site or
    frameshift variants, or a deletion of the last exon, expected to undergo
    nonsense-mediated decay. Together with strong population constraint on
    LRRC7 (pLI = 1), this points to haploinsufficiency of densin-180 as the
    main mechanism.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: densin-180 postsynaptic scaffold activity
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    modifier: DECREASED
  genes:
  - preferred_term: LRRC7
    term:
      id: hgnc:18531
      label: LRRC7
  evidence:
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This suggests haploinsufficiency for the encoded Densin-180 protein as a
      major pathomechanism, consistent with human population data from gnomAD
      (pLI = 1, o/e = 0.13, gnomAD v4.1.0).
    explanation: Truncating variants plus gene constraint support haploinsufficiency.
  downstream:
  - target: Loss of Densin-180 CaMKII-PP1 Scaffolding
    causal_link_type: DIRECT
  - target: Reduced Postsynaptic mGluR5 Localization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22072671
      reference_title: Deletion of densin-180 results in abnormal behaviors associated with mental illness and reduces mGluR5 and DISC1 in the postsynaptic density fraction.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the cellular level, loss of densin results in reduced levels of
        α-actinin in the brain and selective reduction in the localization of
        mGluR5 and DISC1 in the PSD fraction
      explanation: >-
        Complete loss of densin in knockout mice reduces postsynaptic mGluR5;
        indirect for human heterozygous loss.
  - target: Reduced Postsynaptic Cav1.2 Channel Trafficking
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28363979
      reference_title: Densin-180 Controls the Trafficking and Signaling of L-Type Voltage-Gated Ca(v)1.2 Ca(2+) Channels at Excitatory Synapses.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Compared with wild-type mice, the cell surface levels of Cav1.2 in the
        brain, as well as Cav1.2 current density and signaling to the nucleus,
        are reduced in neurons from densin KO mice.
      explanation: >-
        Densin loss reduces surface Cav1.2 in knockout mouse neurons; indirect for
        human heterozygous loss.
- name: Densin-180 LRR and PDZ Domain Interaction Disruption
  description: >-
    Missense variants cluster in the N-terminal leucine-rich repeat (LRR)
    domain at conserved consensus positions (L65, N94, C106, L296), and these
    abolish LRR binding to protein phosphatase 1 alpha, MACF1 and Erbin in
    293T cells. L296P also prevents postsynaptic targeting. The PDZ-domain
    variant L1567Q reduces delta-catenin binding and the fraction of densin-180
    clusters at Shank3-positive synapses.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: protein phosphatase 1 alpha binding by the LRR domain
    term:
      id: GO:0008157
      label: protein phosphatase 1 binding
    modifier: DECREASED
  genes:
  - preferred_term: LRRC7
    term:
      id: hgnc:18531
      label: LRRC7
  evidence:
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In summary, four variants at key positions of the LRR consensus sequence
      (L65, N94, C106 and L296) severely disrupt binding to all partners tested.
    explanation: Co-immunoprecipitation shows LRR missense variants abolish partner binding.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A PDZ domain variant interferes with synaptic targeting of Densin-180 in
      primary cultured neurons.
    explanation: The PDZ variant mislocalizes densin-180 away from synapses.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, the L296P variant completely failed to reach postsynaptic
      sites.
    explanation: An LRR variant that abolishes postsynaptic targeting in neurons.
  downstream:
  - target: Loss of Densin-180 CaMKII-PP1 Scaffolding
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39256359
      reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Taken together, our data suggest that Densin-180 may be needed to target
        PP1α to specific substrates at postsynaptic sites, and that this
        scaffolding function may be disrupted by missense variants in the LRR.
      explanation: The authors link LRR-variant loss of PP1 binding to loss of postsynaptic PP1 scaffolding.
  - target: Reduced Dendritic Arborization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39256359
      reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Sholl analysis showed reduced branching of dendrites for some of the LRR
        variants, which became significant for L65S, N94S and L296P variants at
        some distance points of the measurement
      explanation: Patient LRR variants expressed in hippocampal neurons reduce dendritic branching.
- name: Loss of Densin-180 CaMKII-PP1 Scaffolding
  description: >-
    Densin-180 binds the alpha subunit of CaMKII through central and C-terminal
    sites and PP1 alpha through its LRR, and can bridge them into a
    CaMKII/densin-180/PP1 complex. Loss of this scaffold is proposed to mistarget
    PP1 and alter dephosphorylation of CaMKII and other synaptic substrates
    during plasticity; densin-null neurons show altered early regulation of
    CaMKII by NMDA receptors.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: postsynaptic protein dephosphorylation
    term:
      id: GO:0006470
      label: protein dephosphorylation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data are compatible with a model where Densin-180 may scaffold a
      αCaMKII/Densin-180/PP1α triple complex.
    explanation: Co-expression data show densin-180 bridges CaMKII and PP1.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      αCaMKII phosphorylation at Thr286 upon stimulation of NMDA receptors is
      higher in neurons derived from Lrrc7 ko mice compared to WT
    explanation: >-
      Higher CaMKII autophosphorylation in densin-null neurons fits loss of
      densin-anchored PP1 dephosphorylation; restated from earlier knockout work.
  downstream:
  - target: Impaired Long-Term Synaptic Depression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39256359
      reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Strikingly, Densin-180, PP1 activity and αCaMKII are all required for
        establishment of LTD
      explanation: All three scaffold components are required for LTD, per earlier studies the authors cite.
    - reference: PMID:39256359
      reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        we propose a pathomechanism where disruption of the Densin-180/PP1
        complex leads to alter targeting of PP1 to its substrates, thus changing
        the phosphorylation status of synaptic proteins during synaptic
        plasticity.
      explanation: Proposed (not demonstrated) link from scaffold loss to altered synaptic plasticity.
- name: Reduced Postsynaptic mGluR5 Localization
  description: >-
    Densin-180 loss selectively reduces mGluR5 (and DISC1) in the postsynaptic
    density fraction while leaving ionotropic glutamate receptors unchanged.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mGluR5 localization to the postsynaptic density
    term:
      id: GO:0099645
      label: neurotransmitter receptor localization to postsynaptic specialization membrane
    modifier: DECREASED
  - preferred_term: mGluR5 signaling
    term:
      id: GO:0007216
      label: G protein-coupled glutamate receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:22072671
    reference_title: Deletion of densin-180 results in abnormal behaviors associated with mental illness and reduces mGluR5 and DISC1 in the postsynaptic density fraction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These results indicate that densin influences the function of mGluRs and
      CaMKII at synapses and contributes to localization of mGluR5 and DISC1 in
      the PSD fraction.
    explanation: Knockout data place mGluR5 localization downstream of densin.
  downstream:
  - target: Impaired Long-Term Synaptic Depression
    causal_link_type: DIRECT
  - target: Aggressive behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31582721
      reference_title: Lrrc7 mutant mice model developmental emotional dysregulation that can be alleviated by mGluR5 allosteric modulation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The pivotal role of mGluR5 signaling was demonstrated by rescue of
        behavioral defects with augmentation of mGluR5 receptor activity by
        3-Cyano-N-(1,3-diphenyl-1H-pyrazol-5-yl)benzamide (CDPPB).
      explanation: >-
        Pharmacological rescue in mutant mice implicates reduced mGluR5
        signaling in the aggressive and emotional phenotypes; inferred from
        rescue in a homozygous mouse model.
- name: Reduced Postsynaptic Cav1.2 Channel Trafficking
  description: >-
    Densin-180 binds the Cav1.2 N-terminus and promotes forward trafficking and
    dendritic clustering of Cav1.2 L-type channels. Densin-null neurons have
    lower surface Cav1.2, current density and excitation-transcription
    signaling.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: Cav1.2 calcium influx
    term:
      id: GO:0061577
      label: calcium ion transmembrane transport via high voltage-gated calcium channel
    modifier: DECREASED
  evidence:
  - reference: PMID:28363979
    reference_title: Densin-180 Controls the Trafficking and Signaling of L-Type Voltage-Gated Ca(v)1.2 Ca(2+) Channels at Excitatory Synapses.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that densin is an essential regulator of neuronal Cav1
      channels and ensures efficient Cav1.2 Ca2+ signaling at excitatory
      synapses.
    explanation: Establishes densin as a regulator of postsynaptic Cav1.2 signaling.
- name: Impaired Long-Term Synaptic Depression
  description: >-
    Densin-null mice lose mGluR- and NMDA receptor-dependent long-term
    depression. LTD requires densin-180, PP1 activity and CaMKII, and is the
    plasticity defect the defining study links to intellectual disability.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: long-term synaptic depression
    term:
      id: GO:0060292
      label: long-term synaptic depression
    modifier: DECREASED
  evidence:
  - reference: PMID:22072671
    reference_title: Deletion of densin-180 results in abnormal behaviors associated with mental illness and reduces mGluR5 and DISC1 in the postsynaptic density fraction.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, deletion of densin results in impairment of mGluR- and NMDA
      receptor-dependent forms of long-term depression
    explanation: Direct demonstration of impaired LTD in densin-null mice.
  downstream:
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:39256359
      reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A linkage between ID and deficits in synaptic plasticity (in particular
        LTD) has been established for other ID syndromes
      explanation: >-
        The link from LTD deficit to intellectual disability is drawn by analogy
        with other ID syndromes rather than shown for LRRC7.
- name: Reduced Dendritic Arborization
  description: >-
    Patient LRR variants reduce dendritic branching of cultured hippocampal
    neurons, and neurons from Lrrc7 mutant mice have impaired neurite outgrowth.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: dendrite morphogenesis
    term:
      id: GO:0048813
      label: dendrite morphogenesis
    modifier: DECREASED
  evidence:
  - reference: PMID:31582721
    reference_title: Lrrc7 mutant mice model developmental emotional dysregulation that can be alleviated by mGluR5 allosteric modulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, mutant primary neurons had impaired neurite outgrowth which
      was rescued by CDPPB treatment.
    explanation: Neurons from mutant mice show impaired neurite outgrowth, rescued by mGluR5 potentiation.

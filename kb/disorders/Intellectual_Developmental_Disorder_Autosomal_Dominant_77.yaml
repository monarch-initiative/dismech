genetic:
- name: LRRC7
  gene_term:
    preferred_term: LRRC7
    term:
      id: hgnc:18531
      label: LRRC7
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    LRRC7 (1p31.1) encodes densin-180. Truncating variants (nonsense, splice,
    frameshift, and a 99 kb deletion including the last exon) account for more
    than half of cases; missense variants cluster in the LRR domain, with one
    in the PDZ domain. Variants arise de novo or are inherited. LRRC7 was first
    implicated by a gene-level rare-variant association with intellectual
    disability in the 100,000 Genomes Project. Inherited variants have not been
    observed to be milder than de novo ones. Exon 23 is skipped in a large
    share of brain transcripts, so truncating variants there (p.Gln1375*,
    p.Asn1377Thrfs*13) may be less severe. Of the missense variants, A193P was
    inherited from a healthy father and only weakly disrupts LRR binding, and
    L221M disrupts no tested interaction and is best treated as a VUS. ClinGen
    had not classified LRRC7 as of 2026-10-16.
  evidence:
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Out of the 42 genes associated with this class, LRRC7 ranked 19th, with a
      PPA almost equal to 1
    explanation: Genome-wide association of LRRC7 rare variants with intellectual disability.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that LRRC7 encodes a major determinant of intellectual
      development and behaviour.
    explanation: Gene-disease conclusion of the defining cohort study.
  - reference: PMID:39256359
    reference_title: Variants in LRRC7 lead to intellectual disability, autism, aggression and abnormal eating behaviors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In at least eleven cases where both parents were available for analysis,
      we determined that the respective variant appeared de novo.
    explanation: De novo occurrence in at least eleven trios.
animal_models:
- name: Lrrc7 (densin-180) knockout mouse
  species: Mouse
  genotype: Lrrc7-/-
  description: >-
    Homozygous null mice show behaviours considered endophenotypes of autism
    and schizophrenia, reduced postsynaptic mGluR5 and DISC1, impaired mGluR-
    and NMDA receptor-dependent LTD, altered CaMKII regulation and changed
    spine morphology.
  publication: PMID:22072671
  modeled_mechanisms:
  - target: Impaired Long-Term Synaptic Depression
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the LTD defect directly in null mice.
    limitations: >-
      Homozygous null mice, whereas patients are heterozygous; the defect has
      not been shown at heterozygous dosage.
    evidence:
    - reference: PMID:22072671
      reference_title: Deletion of densin-180 results in abnormal behaviors associated with mental illness and reduces mGluR5 and DISC1 in the postsynaptic density fraction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In addition, deletion of densin results in impairment of mGluR- and NMDA
        receptor-dependent forms of long-term depression
      explanation: Direct LTD measurement in the model.
  - target: Reduced Postsynaptic mGluR5 Localization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: Homozygous null rather than heterozygous dosage.
    evidence:
    - reference: PMID:22072671
      reference_title: Deletion of densin-180 results in abnormal behaviors associated with mental illness and reduces mGluR5 and DISC1 in the postsynaptic density fraction.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At the cellular level, loss of densin results in reduced levels of
        α-actinin in the brain and selective reduction in the localization of
        mGluR5 and DISC1 in the PSD fraction
      explanation: Biochemical fractionation shows reduced PSD mGluR5.
- name: Lrrc7 mutant mouse (CDPPB rescue)
  species: Mouse
  genotype: Lrrc7 homozygous mutant (about 2% residual transcript)
  description: >-
    Homozygous mutants show juvenile aggression, adult anxiety-like behaviour
    and social dysfunction, and impaired neurite outgrowth; all were improved
    by the mGluR5 positive allosteric modulator CDPPB.
  publication: PMID:31582721
  modeled_mechanisms:
  - target: Aggressive behavior
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Homozygous near-null mice; patients are heterozygous, and mouse
      aggression is an imperfect proxy for human aggressive behaviour.
    evidence:
    - reference: PMID:31582721
      reference_title: Lrrc7 mutant mice model developmental emotional dysregulation that can be alleviated by mGluR5 allosteric modulation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Consistent with a critical role of LRRC7 in emotional regulation, mutant
        mice had inappropriate juvenile aggressive behavior and significant
        anxiety-like behavior and social dysfunction in adulthood.
      explanation: Mutant mice show juvenile aggression.
  - target: Reduced Dendritic Arborization
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Measured in cultured primary neurons from homozygous mutants.
    evidence:
    - reference: PMID:31582721
      reference_title: Lrrc7 mutant mice model developmental emotional dysregulation that can be alleviated by mGluR5 allosteric modulation.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Furthermore, mutant primary neurons had impaired neurite outgrowth which
        was rescued by CDPPB treatment.
      explanation: Neurite outgrowth defect in mutant neurons.

pathophysiology:
- name: Ameloblast Dysfunction and Defective Enamel Biomineralization
  description: >
    AI is fundamentally a disorder of the ameloblast, the ectoderm-derived epithelial cell
    that builds enamel. Enamel formation is a tightly staged biomineralization process in
    which ameloblasts first secrete an organic enamel matrix and then drive its
    mineralization. Mutations in the genes critical for this process disrupt ameloblast
    function and produce structurally and/or quantitatively abnormal enamel. The specific
    inherited dental phenotype maps onto the developmental stage at which the mutated gene
    is critically required.
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Amelogenesis
    term:
      id: GO:0097186
      label: amelogenesis
    modifier: DECREASED
  - preferred_term: Biomineral tissue development
    term:
      id: GO:0031214
      label: biomineral tissue development
    modifier: ABNORMAL
  genes:
  - preferred_term: FAM83H
    term:
      id: hgnc:24797
      label: FAM83H
  downstream:
  - target: Defective Enamel Matrix Secretion
    causal_link_type: DIRECT
  - target: Defective Enamel Matrix Processing and Maturation
    causal_link_type: DIRECT
  - target: iPSC-Derived Ameloblast Enamel-Formation Defect (Organoid Model)
    causal_link_type: DIRECT
    description: >
      Human iPSC-derived ameloblast models recapitulate the same ameloblast
      enamel-formation defect represented by the upstream cellular mechanism.
  evidence:
  - reference: PMID:16304440
    reference_title: "Genes and related proteins involved in amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dental enamel formation is a remarkable example of a biomineralization process."
    explanation: >
      Frames enamel formation as a biomineralization process whose disruption underlies AI.
  - reference: PMID:17552940
    reference_title: "Developmental biology and genetics of dental malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The type of inherited dental malformations observed in a given kindred relate to when, during odontogenesis, the defective gene is critically expressed."
    explanation: >
      Establishes the central principle that the AI phenotype reflects the developmental
      stage of ameloblast function that the mutated gene disrupts.
  - reference: PMID:33034243
    reference_title: "FAM83H and Autosomal Dominant Hypocalcified Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The function of FAM83H remains obscure."
    explanation: >
      FAM83H is bound to this general ameloblast-dysfunction node rather than to
      one of the staged nodes below precisely because the step at which it acts
      is not established; this sentence is the source for leaving it unplaced.

- name: Defective Enamel Matrix Secretion
  description: >
    During the secretory stage, ameloblasts deposit an enamel matrix rich in amelogenin
    (AMELX) and enamelin (ENAM) that templates the elongating enamel crystallites.
    Mutations in AMELX (X-linked) and ENAM (autosomal) impair matrix deposition, reducing
    enamel thickness and producing the hypoplastic AI phenotype.
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  genes:
  - preferred_term: AMELX
    term:
      id: hgnc:461
      label: AMELX
  - preferred_term: ENAM
    term:
      id: hgnc:3344
      label: ENAM
  - preferred_term: AMBN
    term:
      id: hgnc:452
      label: AMBN
  - preferred_term: ACP4
    term:
      id: hgnc:14376
      label: ACP4
  - preferred_term: RELT
    term:
      id: hgnc:13764
      label: RELT
  downstream:
  - target: Enamel Structural Failure
    causal_link_type: DIRECT
  - target: Enamel hypoplasia
    causal_link_type: DIRECT
    description: >
      Secretory-stage matrix deposition failure reduces enamel thickness,
      producing hypoplastic enamel.
  evidence:
  - reference: PMID:16304440
    reference_title: "Genes and related proteins involved in amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the amelogenin gene (AMELX) cause X-linked amelogenesis imperfecta, while mutations in the enamelin gene (ENAM) cause autosomal-inherited forms of amelogenesis imperfecta."
    explanation: >
      Links secretory-stage matrix protein genes AMELX and ENAM to AI.
  - reference: PMID:31402633
    reference_title: "AMBN mutations causing hypoplastic amelogenesis imperfecta and Ambn knockout-NLS-lacZ knockin mice exhibiting failed amelogenesis and Ambn tissue-specificity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Ameloblastin (AMBN) is a secreted matrix protein that is critical for the formation of dental enamel and is enamel-specific with respect to its essential functions."
    explanation: >
      Places ameloblastin among the secreted enamel matrix proteins deposited at
      this step, which is why AMBN is bound here rather than to a processing node.
      Graded OTHER because the quoted sentence states established protein biology
      rather than a result of the citing study.
  - reference: PMID:27843125
    reference_title: "Recessive Mutations in ACPT, Encoding Testicular Acid Phosphatase, Cause Hypoplastic Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical analysis confirmed localization of ACPT in secretory-stage ameloblasts."
    explanation: >
      Localizes ACP4 (ACPT) protein to secretory-stage ameloblasts, supporting
      placement of ACP4 at this step of the cascade.
  - reference: PMID:30506946
    reference_title: "Mutations in RELT cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNAscope in situ hybridization of wild-type mouse molars and incisors showed specific Relt mRNA expression by secretory stage ameloblasts and by odontoblasts."
    explanation: >
      Mouse expression data placing Relt in secretory-stage ameloblasts; this is
      the basis for binding RELT to the secretory node, and is model-organism
      rather than human evidence.

- name: Defective Enamel Matrix Processing and Maturation
  description: >
    During the maturation stage, the enamel proteases MMP20 (enamelysin) and KLK4
    (kallikrein-4) progressively degrade and remove the enamel matrix, allowing crystallites
    to grow and the tissue to harden. Biallelic mutations in MMP20 and KLK4 impair matrix
    processing, leaving residual protein and soft, hypomineralized/hypomature enamel.
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  genes:
  - preferred_term: MMP20
    term:
      id: hgnc:7167
      label: MMP20
  - preferred_term: KLK4
    term:
      id: hgnc:6365
      label: KLK4
  - preferred_term: WDR72
    term:
      id: hgnc:26790
      label: WDR72
  - preferred_term: ODAPH
    term:
      id: hgnc:26300
      label: ODAPH
  downstream:
  - target: Enamel Structural Failure
    causal_link_type: DIRECT
  - target: Enamel hypomineralization
    causal_link_type: DIRECT
    description: >
      Defective matrix processing and maturation leave enamel under-mineralized
      and structurally weak.
  evidence:
  - reference: PMID:17552940
    reference_title: "Developmental biology and genetics of dental malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genes expressed by odontoblasts (COL1A1, COL1A2, and DSPP), and ameloblasts (AMELX, ENAM, MMP20, and KLK4) during the crown formation stage, are associated with dentinogenesis imperfecta, dentin dysplasia, and amelogenesis imperfecta."
    explanation: >
      Identifies the ameloblast-expressed processing genes MMP20 and KLK4 as AI genes
      acting during crown formation.
  - reference: PMID:30779877
    reference_title: "WDR72 Mutations Associated with Amelogenesis Imperfecta and Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defective enamel is normal in thickness, severely hypomineralized, orange-brown stained, and susceptible to attrition."
    explanation: >
      The normal-thickness, severely hypomineralized enamel of WDR72 defects is a
      maturation-stage rather than secretory-stage failure, which is why WDR72 is
      bound to this node.
  - reference: PMID:38303846
    reference_title: "A novel ODAPH mutation causing amelogenesis imperfecta and its expression in human dental tissues."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Partial enamel hypoplasia and indistinct dentino-enamel junction were evident on unerupted teeth, resembling hypocalcified AI."
    explanation: >
      ODAPH loss leaves enamel that fails after eruption rather than absent at
      deposition, placing it with the post-secretory processing and maturation
      failures on this node.

- name: Transcriptional Control of Ameloblast Differentiation
  description: >
    Before any enamel matrix is laid down, the inner enamel epithelium must
    proliferate and differentiate into secretory ameloblasts. Two AI genes encode
    the transcription factors that drive this step rather than any structural or
    enzymatic component of enamel: SP6, whose first zinc finger is altered in
    autosomal dominant hypoplastic AI, and DLX3, whose DNA-binding homeodomain is
    truncated in AI with taurodontism. A lesion here is upstream of every matrix
    and processing defect below.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Ameloblast differentiation
    term:
      id: GO:0036305
      label: ameloblast differentiation
    modifier: DECREASED
  downstream:
  - target: Ameloblast Dysfunction and Defective Enamel Biomineralization
    causal_link_type: DIRECT
    description: >
      Failure to produce a competent secretory ameloblast population is one route
      into the general ameloblast dysfunction that underlies every form of AI.
  genes:
  - preferred_term: SP6
    term:
      id: hgnc:14530
      label: SP6
  - preferred_term: DLX3
    term:
      id: hgnc:2916
      label: DLX3
  evidence:
  - reference: PMID:32167558
    reference_title: "A missense variant in specificity protein 6 (SP6) is associated with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "SP6 has been shown to be crucial to both proliferation of the IEE and to its differentiation into ameloblasts."
    explanation: >
      States the step SP6 acts at: proliferation of the inner enamel epithelium
      and its differentiation into ameloblasts, which is what this node models.
  - reference: PMID:32167558
    reference_title: "A missense variant in specificity protein 6 (SP6) is associated with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified a potential SP6 binding motif in the AMBN proximal promoter sequence and showed that wild-type (WT) SP6 binds more strongly to it than the mutant protein."
    explanation: >
      Surface plasmon resonance binding data showing the AI-associated SP6 variant
      binds a promoter of an enamel matrix gene less well than wild type, which is
      the transcriptional lesion this node asserts.
  - reference: PMID:15666299
    reference_title: "DLX3 mutation associated with autosomal dominant amelogenesis imperfecta with taurodontism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation causes a frameshift altering the last two amino acids of the DNA-binding homeodomain introducing a premature stop codon truncating the protein by 88 amino acids."
    explanation: >
      Places the AI-causing DLX3 lesion in the DNA-binding homeodomain, supporting
      DLX3's membership of this transcriptional-control node.

- name: Defective Ameloblast Cell-Matrix Adhesion
  description: >
    Amelogenesis also depends on the ameloblast staying correctly attached to the
    matrix it is building. ITGB6 localizes to the distal membrane of
    differentiating ameloblasts and is expressed most strongly by maturation-stage
    ameloblasts, and its loss causes generalized hypoplastic AI. LAMB3, a subunit of the
    laminin 332 complex, is grouped here on the same axis, although the specific
    ameloblast-matrix step it disrupts is proposed rather than demonstrated.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Cell-matrix adhesion
    term:
      id: GO:0007160
      label: cell-matrix adhesion
    modifier: DECREASED
  downstream:
  - target: Enamel Structural Failure
    causal_link_type: DIRECT
  - target: Enamel hypoplasia
    causal_link_type: DIRECT
    description: >
      Both genes bound to this node present clinically as hypoplastic, thin enamel.
  genes:
  - preferred_term: ITGB6
    term:
      id: hgnc:6161
      label: ITGB6
  - preferred_term: LAMB3
    term:
      id: hgnc:6490
      label: LAMB3
  evidence:
  - reference: PMID:24305999
    reference_title: "ITGB6 loss-of-function mutations cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that early and late amelogenesis depend upon cell-matrix interactions."
    explanation: >
      The authors' conclusion from human ITGB6 mutations plus ameloblast
      immunohistochemistry, and the core claim of this node.
  - reference: PMID:24305999
    reference_title: "ITGB6 loss-of-function mutations cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemistry of mouse mandibular incisors localized ITGB6 to the distal membrane of differentiating ameloblasts and pre-ameloblasts, and then ITGB6 appeared to be internalized by secretory stage ameloblasts."
    explanation: >
      Mouse localization data placing ITGB6 at the ameloblast-matrix interface
      during the stages this node covers.
  - reference: PMID:24305999
    reference_title: "ITGB6 loss-of-function mutations cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ITGB6 expression was strongest in the maturation stage and its localization was associated with ameloblast modulation."
    explanation: >
      Source for the statement that ITGB6 is expressed most strongly by
      maturation-stage ameloblasts.
  - reference: PMID:30905256
    reference_title: "Phenotype and Variant Spectrum in the LAMB3 Form of Amelogenesis Imperfecta."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "If mutant LAMB3 affects secretory ameloblast-matrix interactions, this may underlie the abnormal enamel architecture seen near the EDJ."
    explanation: >
      The authors advance an ameloblast-matrix mechanism for LAMB3 as a
      conditional hypothesis, not a demonstrated result; it is cited here as the
      stated basis for grouping LAMB3 on this node and graded INDIRECT for that
      reason.

- name: Defective Ameloblast Ion Transport and Enamel Matrix pH Regulation
  description: >
    Maturation-stage ameloblasts must move calcium into the enamel matrix and
    manage the pH swings that accompany hydroxyapatite deposition. Two AI genes
    act on this axis rather than on matrix protein or its proteolysis: SLC24A4,
    whose function in calcium transport is crucial at the maturation stage, and
    GPR68, a proton-sensing G-protein-coupled receptor tuned to the pH range the
    maturing matrix passes through.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Ameloblast
    term:
      id: CL:0000059
      label: ameloblast
  biological_processes:
  - preferred_term: Calcium ion transmembrane transport
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
    modifier: DECREASED
  - preferred_term: Regulation of enamel matrix pH
    term:
      id: GO:0006885
      label: regulation of pH
    modifier: ABNORMAL
  downstream:
  - target: Enamel Structural Failure
    causal_link_type: DIRECT
  - target: Enamel hypomineralization
    causal_link_type: DIRECT
    description: >
      Both genes bound to this node present as hypomaturation AI, in which enamel
      of normal thickness fails to mineralize fully.
  genes:
  - preferred_term: SLC24A4
    term:
      id: hgnc:10978
      label: SLC24A4
  - preferred_term: GPR68
    term:
      id: hgnc:4519
      label: GPR68
  evidence:
  - reference: PMID:27693231
    reference_title: "Mutations in the pH-Sensing G-protein-Coupled Receptor GPR68 Cause Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "This process requires the intricate regulation of ion transport and controlled changes to the pH of the developing enamel matrix."
    explanation: >
      States the ion-transport and pH-regulation requirement of amelogenesis that
      this node represents.
  - reference: PMID:27693231
    reference_title: "Mutations in the pH-Sensing G-protein-Coupled Receptor GPR68 Cause Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GPR68 encodes a proton-sensing G-protein-coupled receptor with sensitivity in the pH range that occurs in the developing enamel matrix during amelogenesis."
    explanation: >
      Identifies GPR68's function as matrix pH sensing, the basis for binding it
      to this node rather than to a matrix or protease node.
  - reference: PMID:24532815
    reference_title: "Exonal deletion of SLC24A4 causes hypomaturation amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of exonal deletion in SLC24A4 providing confirmatory evidence that the function of SLC24A4 in calcium transport has a crucial role in the maturation stage of amelogenesis."
    explanation: >
      Names calcium transport at the maturation stage as SLC24A4's function,
      supporting its placement on this node.

- name: Enamel Structural Failure
  description: >
    The proximate consequence of disrupted secretion, processing, or mineralization is
    enamel that is thin, soft, discolored, and/or rapidly worn. This is the structural
    phenotype underlying the clinical presentation of AI: hypoplastic, hypomature, or
    hypocalcified enamel with attendant sensitivity, attrition, and esthetic impairment.
  biological_processes:
  - preferred_term: Enamel mineralization
    term:
      id: GO:0070166
      label: enamel mineralization
    modifier: DECREASED
  downstream:
  - target: Amelogenesis imperfecta
    causal_link_type: DIRECT
    description: >
      The downstream structural enamel failure is the defining clinical dental
      phenotype of amelogenesis imperfecta.
  evidence:
  - reference: PMID:16838342
    reference_title: "The molecular etiologies and associated phenotypes of amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The amelogenesis imperfectas (AIs) are a clinically and genetically diverse group of conditions that are caused by mutations in a variety of genes that are critical for normal enamel formation."
    explanation: >
      Frames the diverse AI phenotypes as the downstream result of disrupted normal enamel
      formation.


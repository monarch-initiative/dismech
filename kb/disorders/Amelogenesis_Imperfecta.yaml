name: Amelogenesis Imperfecta
creation_date: "2026-06-17T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: amelogenesis imperfecta
  term:
    id: MONDO:0019507
    label: amelogenesis imperfecta
parents:
- Ectodermal Dysplasia
- Oral Cavity Disease
synonyms:
- AI
- Hereditary enamel dysplasia
- Amelogenesis imperfecta, hereditary

description: >
  Amelogenesis imperfecta (AI) is a clinically and genetically heterogeneous group of
  inherited disorders of tooth enamel formation, in which the enamel is abnormal in
  quantity, structure, and/or mineral content in the absence of a generalized systemic
  disorder. Enamel is the most highly mineralized tissue in the body and is produced by
  ameloblasts, epithelial cells of ectodermal origin that secrete a protein-rich enamel
  matrix (amelogenin, enamelin, ameloblastin) and then orchestrate its proteolytic
  processing and progressive mineralization during the secretory and maturation stages of
  amelogenesis. AI arises when mutations disrupt the genes encoding these matrix proteins
  (AMELX, ENAM) or the proteases that process them (MMP20, KLK4), or other regulators of
  the secretory/maturation program (FAM83H, WDR72, DLX3 and others). Because the dental
  phenotype reflects which stage of amelogenesis is disrupted, AI is conventionally
  classified into hypoplastic (reduced enamel thickness, a secretory-stage quantitative
  defect), hypomaturation (normal-thickness but soft, mottled enamel from defective
  maturation), and hypocalcified/hypomineralized (poorly mineralized, rapidly attriting
  enamel) types, with X-linked, autosomal dominant, and autosomal recessive inheritance.
  AI is mechanistically and clinically distinct from acquired developmental defects of
  enamel such as dental fluorosis (excess fluoride) and from molar-incisor hypomineralization.

inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >
    AMELX (amelogenin) is located on the X chromosome; mutations cause X-linked AI, with
    males more severely and uniformly affected than heterozygous females.
  evidence:
  - reference: PMID:16304440
    reference_title: "Genes and related proteins involved in amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the amelogenin gene (AMELX) cause X-linked amelogenesis imperfecta, while mutations in the enamelin gene (ENAM) cause autosomal-inherited forms of amelogenesis imperfecta."
    explanation: >
      Establishes the X-linked inheritance of AMELX-related AI versus autosomal
      inheritance of ENAM-related AI.
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant AI is caused by mutations in genes such as ENAM and FAM83H.
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant, recessive, and X-linked types have been previously described."
    explanation: >
      Documents the full range of Mendelian inheritance patterns described for AI.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Autosomal recessive AI is caused by biallelic mutations in genes such as MMP20, KLK4,
    and WDR72, which mediate enamel matrix processing and maturation.
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant, recessive, and X-linked types have been previously described."
    explanation: >
      Documents autosomal recessive inheritance as one of the established AI patterns.

has_subtypes:
- name: Hypoplastic
  display_name: Hypoplastic AI (secretory-stage quantitative defect)
  description: >
    Reduced enamel thickness due to a defect during the secretory stage of amelogenesis,
    when the enamel matrix is laid down. Classically associated with AMELX and ENAM
    mutations.
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The types (hypoplastic, hypocalcified, and hypomature) are correlated with defects in different stages of the process of enamel synthesis."
    explanation: >
      Defines the hypoplastic type as a defect in a specific stage of enamel synthesis.
- name: Hypomaturation
  display_name: Hypomaturation AI (maturation-stage defect)
  description: >
    Enamel of relatively normal thickness but soft and mottled, due to defective
    maturation-stage processing of the enamel matrix. Classically associated with MMP20
    and KLK4 protease mutations.
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The types (hypoplastic, hypocalcified, and hypomature) are correlated with defects in different stages of the process of enamel synthesis."
    explanation: >
      Defines the hypomature type as a maturation-stage defect of enamel synthesis.
- name: Hypocalcified
  display_name: Hypocalcified AI (mineralization defect)
  description: >
    Enamel of normal thickness but poorly mineralized, soft, and rapidly lost to
    attrition. FAM83H mutations are a common cause of autosomal dominant hypocalcified AI.
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The types (hypoplastic, hypocalcified, and hypomature) are correlated with defects in different stages of the process of enamel synthesis."
    explanation: >
      Defines the hypocalcified type as a defect in the enamel synthesis process.

# Gene-defined subtypes. The three rows above classify AI on the Witkop
# phenotype axis (which stage of amelogenesis is disrupted); the rows below
# classify it on the genetic axis, one row per MONDO/OMIM gene-defined type.
# The two axes are orthogonal and deliberately coexist in this list: each
# gene-defined row states in its description which Witkop class it presents as.
- name: AI1A
  display_name: AI type 1A (LAMB3, autosomal dominant hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1A
    term:
      id: MONDO:0007094
      label: amelogenesis imperfecta type 1A
  genes:
  - preferred_term: LAMB3
    term:
      id: hgnc:6490
      label: LAMB3
  description: >
    Autosomal dominant hypoplastic AI caused by heterozygous LAMB3 variants that
    truncate the laminin beta-3 chain near its C-terminus. Biallelic loss of
    LAMB3 instead causes junctional epidermolysis bullosa, so the AI-only
    phenotype is allele- and dose-specific rather than a simple null.
  evidence:
  - reference: PMID:30905256
    reference_title: "Phenotype and Variant Spectrum in the LAMB3 Form of Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 2 families segregating autosomal dominant AI with variable degrees of a distinctive hypoplastic phenotype due to pathogenic variants in LAMB3."
    explanation: >
      Establishes dominantly inherited hypoplastic AI as the LAMB3 phenotype in
      two families, which is the concept MONDO:0007094 denotes.
  - reference: PMID:30905256
    reference_title: "Phenotype and Variant Spectrum in the LAMB3 Form of Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In contrast, biallelic loss-of-function variants in LAMB3 cause recessive junctional epidermolysis bullosa, characterized by life-threatening skin fragility."
    explanation: >
      Source for the contrast with junctional epidermolysis bullosa drawn in this
      subtype's description.
- name: AI1B
  display_name: AI type 1B (ENAM, autosomal dominant localized hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1B
    term:
      id: MONDO:0007092
      label: amelogenesis imperfecta type 1B
  genes:
  - preferred_term: ENAM
    term:
      id: hgnc:3344
      label: ENAM
  description: >
    The dominant, heterozygous end of the ENAM allelic series: carriers of a
    single ENAM insertion or nonsense allele show localized enamel pitting or
    local hypoplastic AI. MONDO carries "hereditary localised enamel hypoplasia"
    as a synonym of this term, matching that phenotype.
  evidence:
  - reference: PMID:16246937
    reference_title: "Phenotype of ENAM mutations is dosage-dependent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel nonsense mutation (g.12663C>A; p.S246X) was identified in one family segregating local hypoplastic AI as a dominant trait."
    explanation: >
      Documents the dominant, localized hypoplastic ENAM phenotype that
      distinguishes AI1B from the recessive generalized form (AI1C).
- name: AI1C
  display_name: AI type 1C (ENAM, autosomal recessive generalized hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1C
    term:
      id: MONDO:0008770
      label: amelogenesis imperfecta type 1C
  genes:
  - preferred_term: ENAM
    term:
      id: hgnc:3344
      label: ENAM
  description: >
    The recessive end of the same ENAM allelic series: biallelic ENAM defects
    produce generalized hypoplastic AI with an anterior open-bite malocclusion.
    AI1B and AI1C are one gene separated by dose, not two genes, which is why
    both MONDO terms list ENAM.
  evidence:
  - reference: PMID:14684688
    reference_title: "Novel ENAM mutation responsible for autosomal recessive amelogenesis imperfecta and localised enamel defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype associated with the g.13185_13186insAG ENAM mutation is dose dependent such that ARAI with openbite malocclusion segregates as a recessive trait, and enamel pitting as a dominant trait."
    explanation: >
      States the dose dependence directly, supporting the split of the ENAM
      allelic series into a recessive generalized type and a dominant localized one.
- name: AI1E
  display_name: AI type 1E (AMELX, X-linked)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1E
    term:
      id: MONDO:0010521
      label: amelogenesis imperfecta type 1E
  genes:
  - preferred_term: AMELX
    term:
      id: hgnc:461
      label: AMELX
  description: >
    X-linked AI from AMELX variants. The enamel defect is not purely
    quantitative: reported phenotypes span thin poorly mineralized enamel with a
    "snow-capped" appearance through to severe hypoplasia, which is why Witkop
    assigned AMELX cases to types IE, IIB and IIC.
  review_notes: >
    MONDO parents this type-1-labelled term under MONDO:0015048 "amelogenesis
    imperfecta type 2" rather than under MONDO:0015047 "amelogenesis imperfecta
    type 1" (checked at the OLS MONDO endpoint, 2026-09-23). The binding is still
    correct — the term is xref'd to OMIM:301200, the X-linked AMELX phenotype —
    but the parentage is internally inconsistent with the label. Reported for an
    upstream decision rather than worked around here.
  evidence:
  - reference: PMID:38892321
    reference_title: "AMELX Mutations and Genotype-Phenotype Correlation in X-Linked Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AMELX mutations cause X-linked amelogenesis imperfecta (AI), known as AI types IE, IIB, and IIC in Witkop's classification, characterized by hypoplastic (reduced thickness) and/or hypomaturation (reduced hardness) enamel defects."
    explanation: >
      Names AMELX as the X-linked AI gene and places type IE within its
      phenotypic range, supporting both the gene binding and the mixed
      hypoplastic/hypomaturation description.
  - reference: PMID:38892321
    reference_title: "AMELX Mutations and Genotype-Phenotype Correlation in X-Linked Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals exhibited enamel malformations, ranging from thin, poorly mineralized enamel with a \"snow-capped\" appearance to severe hypoplastic defects with minimal enamel."
    explanation: >
      Source for the phenotypic range, including the snow-capped appearance,
      described for this subtype.
- name: AI1F
  display_name: AI type 1F (AMBN, autosomal recessive hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1F
    term:
      id: MONDO:0014560
      label: amelogenesis imperfecta type 1F
  genes:
  - preferred_term: AMBN
    term:
      id: hgnc:452
      label: AMBN
  description: >
    Autosomal recessive hypoplastic AI from biallelic ameloblastin defects.
    Ameloblastin is a secreted enamel matrix protein whose essential functions
    are enamel-specific, so the phenotype is confined to the dentition.
  evidence:
  - reference: PMID:31402633
    reference_title: "AMBN mutations causing hypoplastic amelogenesis imperfecta and Ambn knockout-NLS-lacZ knockin mice exhibiting failed amelogenesis and Ambn tissue-specificity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic AMBN defects cause non-syndromic autosomal recessive amelogenesis imperfecta."
    explanation: >
      States the gene-disease relationship and the recessive, non-syndromic mode
      that MONDO:0014560 denotes.
  - reference: PMID:31402633
    reference_title: "AMBN mutations causing hypoplastic amelogenesis imperfecta and Ambn knockout-NLS-lacZ knockin mice exhibiting failed amelogenesis and Ambn tissue-specificity."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Ameloblastin (AMBN) is a secreted matrix protein that is critical for the formation of dental enamel and is enamel-specific with respect to its essential functions."
    explanation: >
      Source for the description of ameloblastin as a secreted, enamel-specific
      matrix protein.
- name: AI1G
  display_name: AI type 1G / enamel renal syndrome (FAM20A, autosomal recessive)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1G
    term:
      id: MONDO:0008771
      label: amelogenesis imperfecta type 1G
  genes:
  - preferred_term: FAM20A
    term:
      id: hgnc:23015
      label: FAM20A
  description: >
    Biallelic FAM20A variants cause enamel renal syndrome, which OMIM and MONDO
    number as amelogenesis imperfecta type 1G. Unlike the other rows here it is
    syndromic: ectopic mineralization extends beyond enamel to dental pulp,
    follicle and gingiva, and to the kidney as nephrocalcinosis.
  review_notes: >
    Kept as a subtype row because OMIM and MONDO both file this concept as an
    amelogenesis imperfecta type, but flagged as the one syndromic member of the
    list. Its renal and gingival manifestations exceed the non-syndromic scope
    this entry's description states, and a separate Enamel_Renal_Syndrome Disease
    entry is the likely future split. No such entry or stub exists today
    (checked kb/disorders/ and stubs/ for enamel/renal/FAM20A, 2026-09-23).
  evidence:
  - reference: PMID:40089179
    reference_title: "The craniofacial, dental and systemic manifestations of Enamel Renal Syndrome: A Scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This autosomal recessive condition, caused by pathogenic variants in the FAM20A gene, is linked to ectopic mineralisation in tissues such as dental pulp, follicles, gingiva, and kidneys."
    explanation: >
      Establishes FAM20A as the cause and records the extra-enamel involvement
      that makes this subtype syndromic.
- name: AI1H
  display_name: AI type 1H (ITGB6, autosomal recessive hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 1H
    term:
      id: MONDO:0014540
      label: amelogenesis imperfecta type 1H
  genes:
  - preferred_term: ITGB6
    term:
      id: hgnc:6161
      label: ITGB6
  description: >
    Autosomal recessive generalized hypoplastic AI from loss-of-function variants
    in the integrin beta-6 subunit, which localizes to the distal membrane of
    differentiating ameloblasts. The lesion is in ameloblast attachment to its own
    matrix rather than in a matrix protein or protease.
  evidence:
  - reference: PMID:24305999
    reference_title: "ITGB6 loss-of-function mutations cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recruited two Hispanic families with generalized hypoplastic amelogenesis imperfecta (AI). Analysis of whole-exome sequences identified three integrin beta 6 (ITGB6) mutations responsible for their enamel malformations."
    explanation: >
      First report of disease-causing ITGB6 mutations, in generalized hypoplastic
      AI, which is the concept MONDO:0014540 denotes.
  - reference: PMID:24305999
    reference_title: "ITGB6 loss-of-function mutations cause autosomal recessive amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemistry of mouse mandibular incisors localized ITGB6 to the distal membrane of differentiating ameloblasts and pre-ameloblasts, and then ITGB6 appeared to be internalized by secretory stage ameloblasts."
    explanation: >
      Source for the distal-membrane localization stated in this subtype's
      description; the localization is mouse rather than human data.
- name: AI1J
  display_name: AI type 1J (ACP4, autosomal recessive hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta, type 1J
    term:
      id: MONDO:0015008
      label: amelogenesis imperfecta, type 1J
  genes:
  - preferred_term: ACP4
    term:
      id: hgnc:14376
      label: ACP4
  description: >
    Autosomal recessive generalized hypoplastic AI from biallelic ACP4 variants.
    ACP4 is the acid phosphatase previously symbolized ACPT (testicular acid
    phosphatase) and localizes to secretory-stage ameloblasts.
  evidence:
  - reference: PMID:27843125
    reference_title: "Recessive Mutations in ACPT, Encoding Testicular Acid Phosphatase, Cause Hypoplastic Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we identified ACPT (testicular acid phosphatase) biallelic mutations causing non-syndromic, generalized hypoplastic autosomal-recessive amelogenesis imperfecta (AI) in individuals from six apparently unrelated Turkish families."
    explanation: >
      Establishes the recessive ACP4/ACPT-AI relationship in six families.
  - reference: PMID:27843125
    reference_title: "Recessive Mutations in ACPT, Encoding Testicular Acid Phosphatase, Cause Hypoplastic Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunohistochemical analysis confirmed localization of ACPT in secretory-stage ameloblasts."
    explanation: >
      Source for the secretory-stage ameloblast localization stated above.
- name: AI1K
  display_name: AI type 1K (SP6, autosomal dominant hypoplastic)
  subtype_term:
    preferred_term: amelogenesis imperfecta, IIa 1K
    term:
      id: MONDO:0031084
      label: amelogenesis imperfecta, IIa 1K
  genes:
  - preferred_term: SP6
    term:
      id: hgnc:14530
      label: SP6
  description: >
    Autosomal dominant hypoplastic AI from a missense change in the first zinc
    finger of the SP6 transcription factor. The lesion is upstream of enamel
    matrix production: SP6 drives proliferation of the inner enamel epithelium
    and its differentiation into ameloblasts.
  review_notes: >
    MONDO's primary label for this term, "amelogenesis imperfecta, IIa 1K",
    mixes a type-II prefix with the AI1K designation; MONDO's own synonym list
    carries "amelogenesis imperfecta, hypoplastic IIa 1K" and "AI1K", and the
    cited study reports a hypoplastic (type I) phenotype. The short name here
    follows the AI1K synonym. Label copied verbatim from the OLS MONDO record.
  evidence:
  - reference: PMID:32167558
    reference_title: "A missense variant in specificity protein 6 (SP6) is associated with amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a 2 bp variant c.817_818GC>AA in SP6, the gene encoding the SP6 transcription factor, in a Caucasian family with autosomal dominant hypoplastic AI."
    explanation: >
      Establishes SP6 as the gene and autosomal dominant hypoplastic AI as the
      phenotype.
- name: AI2A1
  display_name: AI type 2A1 (KLK4, autosomal recessive hypomaturation)
  subtype_term:
    preferred_term: amelogenesis imperfecta type 2A1
    term:
      id: MONDO:0008772
      label: amelogenesis imperfecta type 2A1
  genes:
  - preferred_term: KLK4
    term:
      id: hgnc:6365
      label: KLK4
  description: >
    Autosomal recessive hypomaturation AI from inactivating KLK4 variants.
    Kallikrein-4 is the maturation-stage protease that clears residual enamel
    matrix, so the enamel reaches normal thickness but stays soft and discolored.
  evidence:
  - reference: PMID:35207639
    reference_title: "Novel KLK4 Mutations Cause Hypomaturation Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These analyses revealed two novel homozygous mutations in the KLK4 gene: a nonsense mutation in exon 3 (NM_004917.4:c.170C>A, p.(Ser57*)) was found in families 1, 2 and 3 and a missense mutation in exon 6 (c.637T>C, p.(Cys213Arg)) in family 4."
    explanation: >
      Identifies biallelic inactivating KLK4 variants in four families recruited
      for hypomaturation AI.
  - reference: PMID:35207639
    reference_title: "Novel KLK4 Mutations Cause Hypomaturation Amelogenesis Imperfecta."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Even though there are some overlapping phenotypes, hypomaturation AI enamel typically has a yellow to brown discoloration with a dull appearance but a normal thickness indicating a less mineralized enamel matrix."
    explanation: >
      Source for describing hypomaturation enamel as normal in thickness but soft
      and discolored.
- name: AI2A2
  display_name: AI type 2A2 (MMP20, autosomal recessive hypomaturation)
  subtype_term:
    preferred_term: amelogenesis imperfecta hypomaturation type 2A2
    term:
      id: MONDO:0012926
      label: amelogenesis imperfecta hypomaturation type 2A2
  genes:
  - preferred_term: MMP20
    term:
      id: hgnc:7167
      label: MMP20
  description: >
    Autosomal recessive hypomaturation AI from biallelic MMP20 variants. MMP20
    (enamelysin) is the protease that cleaves the developing extracellular enamel
    matrix, a step required for normal enamel crystal growth.
  evidence:
  - reference: PMID:33600052
    reference_title: "Spectrum of pathogenic variants and founder effects in amelogenesis imperfecta associated with MMP20."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MMP20 encodes a protease that cleaves the developing extracellular enamel matrix and is necessary for normal enamel crystal growth during amelogenesis."
    explanation: >
      States the protease function whose loss produces the hypomaturation
      phenotype of this subtype.
- name: AI2A3
  display_name: AI type 2A3 (WDR72, autosomal recessive hypomaturation)
  subtype_term:
    preferred_term: amelogenesis imperfecta hypomaturation type 2A3
    term:
      id: MONDO:0013181
      label: amelogenesis imperfecta hypomaturation type 2A3
  genes:
  - preferred_term: WDR72
    term:
      id: hgnc:26790
      label: WDR72
  description: >
    Autosomal recessive hypomaturation AI from biallelic WDR72 defects: enamel of
    normal thickness that is severely hypomineralized, orange-brown, and prone to
    attrition. Some affected individuals also have distal renal tubular acidosis,
    so a low serum pH is a recognized extra-dental finding in this subtype.
  evidence:
  - reference: PMID:30779877
    reference_title: "WDR72 Mutations Associated with Amelogenesis Imperfecta and Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Defects in WDR72 (WD repeat-containing protein 72; OMIM *613214) cause AI, type IIA3 (OMIM #613211), which follows an autosomal recessive pattern of inheritance."
    explanation: >
      Names the gene, the OMIM type IIA3 designation that MONDO:0013181 mirrors,
      and the recessive inheritance.
  - reference: PMID:30779877
    reference_title: "WDR72 Mutations Associated with Amelogenesis Imperfecta and Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of the affected patients showed decreased serum pH, consistent with a diagnosis of renal tubular acidosis."
    explanation: >
      Records the acidosis finding in a minority of affected individuals, which
      is why this subtype's description notes an extra-dental feature.
- name: AI2A4
  display_name: AI type 2A4 (ODAPH, autosomal recessive)
  subtype_term:
    preferred_term: amelogenesis imperfecta hypomaturation type 2A4
    term:
      id: MONDO:0013906
      label: amelogenesis imperfecta hypomaturation type 2A4
  genes:
  - preferred_term: ODAPH
    term:
      id: hgnc:26300
      label: ODAPH
  description: >
    Autosomal recessive AI from biallelic ODAPH defects. ODAPH, previously
    symbolized C4orf26, is expressed at the postsecretory transition; the
    reported enamel phenotype includes extensive post-eruptive failure and
    discoloration resembling hypocalcified AI, despite the hypomaturation label
    MONDO uses for this type.
  evidence:
  - reference: PMID:38303846
    reference_title: "A novel ODAPH mutation causing amelogenesis imperfecta and its expression in human dental tissues."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous ODAPH (previously designated C4orf26) mutation of single-nucleotide deletion (NG_032974.1:g.5103del, NM_178497.5:c.67+1del) was identified to be disease-causing."
    explanation: >
      Identifies a biallelic ODAPH mutation as the cause in a consanguineous
      family, and records the previous C4orf26 symbol.
  - reference: PMID:38303846
    reference_title: "A novel ODAPH mutation causing amelogenesis imperfecta and its expression in human dental tissues."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defective enamel of erupted teeth showed extensive post-eruptive failure and discoloration."
    explanation: >
      Source for the post-eruptive enamel failure described for this subtype,
      which is the basis for noting the mismatch with MONDO's hypomaturation label.
- name: AI2A5
  display_name: AI type 2A5 (SLC24A4, autosomal recessive hypomaturation)
  subtype_term:
    preferred_term: amelogenesis imperfecta hypomaturation type 2A5
    term:
      id: MONDO:0014385
      label: amelogenesis imperfecta hypomaturation type 2A5
  genes:
  - preferred_term: SLC24A4
    term:
      id: hgnc:10978
      label: SLC24A4
  description: >
    Autosomal recessive hypomaturation AI from biallelic SLC24A4 defects. The
    function lost is calcium transport at the maturation stage, so this subtype's
    lesion is in calcium delivery to the maturing matrix rather than in a matrix
    protein or protease.
  evidence:
  - reference: PMID:24532815
    reference_title: "Exonal deletion of SLC24A4 causes hypomaturation amelogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of exonal deletion in SLC24A4 providing confirmatory evidence that the function of SLC24A4 in calcium transport has a crucial role in the maturation stage of amelogenesis."
    explanation: >
      Confirms the gene-disease relationship and names calcium transport at the
      maturation stage as the function lost.

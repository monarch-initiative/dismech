treatments:
- name: Restorative and Prosthetic Rehabilitation
  description: >
    Full-coverage crowns, composite restorations, overlays, and prosthetic rehabilitation
    restore function, protect remaining enamel/dentin, reduce sensitivity, and improve
    esthetics in AI.
  treatment_term:
    preferred_term: dental restoration
    term:
      id: NCIT:C38052
      label: Dental Procedure
- name: Genetic Counseling
  description: >
    Genetic counseling addresses the X-linked, autosomal dominant, and autosomal recessive
    inheritance patterns and recurrence risk for affected families.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21127961
    reference_title: "Defining a new candidate gene for amelogenesis imperfecta: from molecular genetics to biochemistry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autosomal dominant, recessive, and X-linked types have been previously described."
    explanation: >
      The Mendelian inheritance of AI supports genetic counseling for affected families.

notes: >
  AI is mechanistically distinct from acquired developmental defects of enamel. Dental
  fluorosis (see Dental_Fluorosis) and the demineralization phenotype of dental caries
  (see Dental_Caries) are non-hereditary enamel defects and are curated separately. The
  iPSC-derived ameloblast / 3D enamel organoid system (PMID:37582367) is the first human
  in vitro disease model for AI and is the natural substrate for future MorPhiC-style
  cellular phenotyping of individual AI genes.

  Subtype scope. `has_subtypes` carries two orthogonal axes: the three Witkop
  phenotype classes (hypoplastic, hypomaturation, hypocalcified) and, below them,
  one row per gene-defined MONDO/OMIM type. One of those gene-defined rows, AI1G
  (FAM20A), denotes enamel renal syndrome and is syndromic, which sits awkwardly
  with the description above characterizing AI as an enamel disorder in the
  absence of a generalized systemic disorder. It is retained because OMIM and
  MONDO both number the FAM20A phenotype as an amelogenesis imperfecta type, and
  is flagged in its own `review_notes` as the likely future split into a separate
  Disease entry.

  MONDO observations recorded during the 2026-09-23 subtype pass, all read from
  the OLS MONDO endpoint rather than from a secondary source. MONDO:0010521
  ("amelogenesis imperfecta type 1E", AMELX) is parented under MONDO:0015048
  "amelogenesis imperfecta type 2", not under MONDO:0015047 "amelogenesis
  imperfecta type 1". MONDO:0031084 carries the primary label "amelogenesis
  imperfecta, IIa 1K" while its own synonyms give "amelogenesis imperfecta,
  hypoplastic IIa 1K" and "AI1K", and the cited SP6 report describes a hypoplastic
  phenotype. MONDO:0032717 (AI3C, RELT) is parented under "hypocalcified
  amelogenesis imperfecta" while the cited RELT report describes generalized
  irregular hypoplastic enamel. In each case the bound term and its label are
  copied verbatim from MONDO and the disagreement is recorded rather than worked
  around.


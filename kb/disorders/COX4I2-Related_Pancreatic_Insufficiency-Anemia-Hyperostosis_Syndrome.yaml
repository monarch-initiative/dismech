    vitamin depletion. Pancreatic enzyme and vitamin replacement improve stool quality and growth; hematologic
    disease requires separate management.
  biological_scale: TISSUE
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-

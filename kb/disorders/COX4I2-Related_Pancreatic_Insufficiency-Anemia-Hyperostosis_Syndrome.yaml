genetic:
- name: COX4I2 E138K-associated EPIDACH
  gene_term:
    preferred_term: COX4I2
    term:
      id: hgnc:16232
      label: COX4I2
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
      reference_title: >-
        Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused
        by a Mutation in the COX4I2 Gene - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The four patients were homozygous for the mutation, and their unaffected relatives were heterozygotes
        or normal homozygotes
      explanation: Segregation in the index families supports recessive inheritance.
  features: >-
    The founding c.412G>A (p.Glu138Lys) missense allele was homozygous in four index patients and an additional
    affected relative. It was absent from 180 screened controls. Glu138 is conserved at the subunit IV/VIIb
    interface, but interface disruption and assembly failure were not directly tested.
  variants:
  - name: c.412G>A (p.Glu138Lys)
    gene:
      preferred_term: COX4I2
      term:
        id: hgnc:16232
        label: COX4I2
    variant_type: single nucleotide variant
    description: >-
      Homozygous coding missense substitution, also described as E138K. The association is supported by segregation
      and altered transcript abundance/inducibility in patient cells. These assays do not establish a splicing
      mechanism or eliminate all alternative explanations.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
      reference_title: >-
        Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused
        by a Mutation in the COX4I2 Gene - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: changing glutamic acid at codon 138 to lysine (E138K)
      explanation: >-
        The primary report identifies the homozygous missense allele; reduced transcript does not establish
        a splice or promoter mechanism.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
      reference_title: >-
        Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused
        by a Mutation in the COX4I2 Gene - PMC
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The four patients were homozygous for the mutation, and their unaffected relatives were heterozygotes
        or normal homozygotes
      explanation: Segregation in the index families supports recessive inheritance.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
      reference_title: >-
        Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused
        by a Mutation in the COX4I2 Gene - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: expression in the patients' cells is reduced to 25% of the control in normoxic conditions
      explanation: Real-time PCR measured reduced COX4I2 mRNA in cultured patient fibroblasts, not absent protein.
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
      reference_title: >-
        Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused
        by a Mutation in the COX4I2 Gene - PMC
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        expression increased 25-fold, whereas in patients' cells COX4I2 mRNA level increased by less than 3-fold
        over the level in normoxic conditions.
      explanation: >-
        The comparison used cobalt chloride for 48 hours; this is chemical hypoxia mimicry rather than a low-oxygen
        exposure.

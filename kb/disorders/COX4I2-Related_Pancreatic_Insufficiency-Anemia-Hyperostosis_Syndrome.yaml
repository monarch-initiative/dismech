      PH to a similar degree.
    explanation: The model distinguishes acute oxygen-sensing defects from chronic pulmonary hypertension.
  notes: >-
    Complete gene knockout differs from E138K. The model supports lung isoform physiology; it has not established
    the human anemia, hyperostosis or pancreatic mechanism.

- name: Genetic counseling
  description: >-
    Explain the recessive segregation reported in the families and the limited variant and prognosis evidence.
    When both parents carry a causative allele, standard Mendelian counseling gives a 25% affected risk per
    pregnancy. Recurrence assessment and reproductive testing depend on an adequately established familial
    diagnosis.

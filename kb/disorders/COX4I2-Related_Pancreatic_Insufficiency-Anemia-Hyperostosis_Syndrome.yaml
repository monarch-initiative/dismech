- name: COX4I2 sequencing and family segregation
  description: >-
    Investigate the combination of exocrine insufficiency, dyserythropoietic anemia and variable skull changes
    with molecular testing and segregation analysis. A phenotype-based multigene approach can address overlapping
    syndromes; isolated heterozygosity or a variant of uncertain significance does not establish this diagnosis.
  diagnosis_term:

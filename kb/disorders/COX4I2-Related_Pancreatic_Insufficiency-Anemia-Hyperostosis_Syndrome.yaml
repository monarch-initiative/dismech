name: COX4I2-Related Pancreatic Insufficiency-Anemia-Hyperostosis Syndrome
category: Mendelian
creation_date: '2026-06-21T00:00:00Z'
synonyms:
- EPIDACH
- Exocrine pancreatic insufficiency, dyserythropoietic anemia, and calvarial hyperostosis
- COX4I2-related cytochrome c oxidase deficiency
- Pancreatic insufficiency-anemia-hyperostosis syndrome
- Shteyer syndrome
description: >-
  COX4I2-related pancreatic insufficiency-anemia-hyperostosis syndrome (EPIDACH, also called Shteyer syndrome)
  is a rare autosomal recessive multisystem disorder described with homozygous c.412G>A (p.Glu138Lys) in five
  affected relatives from two consanguineous families. Exocrine pancreatic insufficiency with pancreatic atrophy
  and fatty replacement, early dyserythropoietic anemia, and variable calvarial hyperostosis are characteristic.
  Hypotonia, developmental delay and respiratory symptoms also occur. Patient fibroblasts show reduced COX4I2
  transcript and attenuated induction by cobalt chloride, but normal measured cytochrome c oxidase activity.
  The molecular steps connecting this regulatory/structural complex IV subunit to pancreatic, erythroid and
  skeletal disease remain incompletely demonstrated.

      label: response to hypoxia
    modifier: DECREASED
  downstream:
  - target: Proposed Tissue-Specific Complex IV Dysfunction
    description: >-
      An attenuated expression response may limit adaptation under stress; the affected-organ consequences
      were not measured.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Proposed Tissue-Specific Complex IV Dysfunction
  description: >-
    Altered COX4I2 expression or function is proposed to impair complex IV-dependent metabolism in selected
    tissues. Patient pancreatic and erythroid enzymology, holoenzyme assembly and ATP production were not demonstrated.
    Control pancreas/islet RNA ratios motivate tissue selectivity, while normal patient fibroblast COX activity
    and the differences between mouse knockout and human disease constrain the model.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the acinar cells are the major source of COX4I2 mRNA in the pancreas, whereas COX4I1 is the predominant
      isoform in the islet cells.
    explanation: >-
      The conclusion is inferred from whole-pancreas versus islet RNA. It does not show COX4I2 exceeds COX4I1
      in purified acinar cells.
    directness: INDIRECT
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: the normal COX activity in the patients' skin fibroblasts (data not shown)
    explanation: >-
      Normal fibroblast enzymology limits claims of universal complex IV deficiency and does not exclude tissue-specific
      dysfunction.
  mechanism_confidence: HYPOTHETICAL

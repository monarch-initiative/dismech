- name: Disordered Erythropoiesis
  description: >-
    The marrow shows erythroid hyperplasia with megaloblastic and multinucleated precursors, consistent with
    ineffective erythropoiesis. Severe early anemia often requires repeated transfusions. Splenic sequestration
    or red-cell destruction may contribute, but red-cell survival was not measured in these patients.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was erythroid hyperplasia with megaloblastic change and bi- and multi-nucleated red cell precursors
      but no internuclear chromatin bridges
    explanation: Bone marrow in one affected boy demonstrates erythroid dysplasia and hyperplasia.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hemoglobin levels were normal at birth but dropped to 5–9 g/100 ml at one month, and RBC transfusions
      were thereafter required at 6–8 week intervals.
    explanation: The three brothers developed severe anemia during the first month.
  downstream:

pathophysiology:
- name: Reduced COX4I2 Transcript Abundance
  description: >-
    Fibroblasts carrying homozygous E138K have approximately one quarter of control COX4I2 mRNA under baseline
    culture conditions. The mechanism of transcript reduction is unresolved; the coding missense change is
    not established to alter splicing, promoter activity or protein stability.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: expression in the patients' cells is reduced to 25% of the control in normoxic conditions
    explanation: Real-time PCR measured reduced COX4I2 mRNA in cultured patient fibroblasts, not absent protein.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: changing glutamic acid at codon 138 to lysine (E138K)
    explanation: >-
      The primary report identifies the homozygous missense allele; reduced transcript does not establish a
      splice or promoter mechanism.
  genes:
  - preferred_term: COX4I2
    term:
      id: hgnc:16232
      label: COX4I2
  downstream:
  - target: Proposed Tissue-Specific Complex IV Dysfunction
    description: >-
      Reduced availability of the regulatory/structural isoform could alter complex IV function in susceptible
      tissues; normal fibroblast enzymology prevents assuming a universal deficit.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Attenuated Hypoxia-Mimetic Transcript Induction
  description: >-
    Patient fibroblasts respond poorly to 100 micromolar cobalt chloride for 48 hours: COX4I2 mRNA rises less
    than threefold compared with approximately 25-fold in controls. This chemical challenge supports abnormal
    inducibility without directly testing physiological tissue hypoxia.
  biological_scale: MOLECULAR
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      expression increased 25-fold, whereas in patients' cells COX4I2 mRNA level increased by less than 3-fold
      over the level in normoxic conditions.
    explanation: >-
      The comparison used cobalt chloride for 48 hours; this is chemical hypoxia mimicry rather than a low-oxygen
      exposure.
  genes:
  - preferred_term: COX4I2
    term:
      id: hgnc:16232
      label: COX4I2
  biological_processes:
  - preferred_term: response to hypoxia
    term:

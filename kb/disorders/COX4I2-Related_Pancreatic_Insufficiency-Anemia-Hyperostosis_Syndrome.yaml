- name: Proposed Impaired Calvarial Bone Resorption
  description: >-
    The founding report hypothesizes that COX4I2-dependent osteoclast function could affect calvarial resorption.
    COX4I2 predominance in calvarial osteoclasts and a functional resorption defect were not measured. This
    proposed link should not be generalized to osteopetrosis, which was absent in the reported skeletal imaging.
  biological_scale: CELLULAR
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/
    reference_title: >-
      Exocrine Pancreatic Insufficiency, Dyserythropoeitic Anemia, and Calvarial Hyperostosis Are Caused by
      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is tempting to speculate that the underlying mechanism of calvarial hyperostosis in our patients is
      due to COX4I2's being the predominant COX4 isoform in calvarial osteoclasts.
    explanation: >-
      This is the authors’ proposed mechanism; neither osteoclast isoform predominance nor patient bone-resorption
      failure was measured.
    directness: INDIRECT
  mechanism_confidence: HYPOTHETICAL
  downstream:

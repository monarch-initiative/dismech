      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The four patients were homozygous for the mutation, and their unaffected relatives were heterozygotes
      or normal homozygotes
    explanation: Segregation in the index families supports recessive inheritance.
notes: >-
  The primary 2009 report includes four index patients and a fifth affected relative identified through family
  segregation. The triad is variable: one index patient lacked hyperostosis, and the fifth relative had pancreatic
  atrophy despite normal stool consistency. These few families do not establish population frequencies, penetrance,
  separate molecular subtypes, or genotype-specific prognosis. Normal plasma lactate and normal fibroblast
  COX activity do not exclude this syndrome. Whole-pancreas/islet expression differences support an acinar
  contribution to COX4I2 expression, not proven acinar isoform predominance or patient pancreatic ATP depletion.
  E138K segregation and transcript findings support the original association; rescue experiments and direct
  functional assessment in affected human tissues remain gaps.

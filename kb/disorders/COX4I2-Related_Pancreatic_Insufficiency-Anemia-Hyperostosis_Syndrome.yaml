      a Mutation in the COX4I2 Gene - PMC
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Soon after birth, they presented with steatorrhea, failure to thrive, and anemia.
    explanation: The brothers presented in early infancy with malabsorption and growth failure.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC2668012/

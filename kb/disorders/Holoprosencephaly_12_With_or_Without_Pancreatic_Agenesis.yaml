name: Holoprosencephaly 12 With or Without Pancreatic Agenesis
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- HPE12
- holoprosencephaly 12, with or without pancreatic agenesis
- pancreatic agenesis and holoprosencephaly syndrome
- CNOT1-related holoprosencephaly
description: >-
  Holoprosencephaly 12 with or without pancreatic agenesis (HPE12; OMIM 618500)
  is an ultra-rare autosomal dominant developmental disorder caused by the
  recurrent de novo CNOT1 missense variant c.1603C>T (p.Arg535Cys). CNOT1 is the
  central scaffold subunit of the CCR4-NOT complex, the major cytoplasmic mRNA
  deadenylase and a master regulator of gene expression during early
  embryogenesis. Affected individuals combine a midline forebrain patterning
  defect (most often semilobar holoprosencephaly) with failure of pancreatic
  development, ranging from complete pancreatic agenesis with permanent neonatal
  diabetes and exocrine insufficiency to a structurally normal neonatal pancreas
  that nonetheless decompensates into diabetes mellitus later in childhood or
  adolescence. Severe intrauterine growth restriction from fetal insulin
  deficiency and gallbladder agenesis are frequent accompaniments. HPE12 is
  mechanistically distinct from CNOT1 loss of function, which causes
  Vissers-Bodmer syndrome (a neurodevelopmental disorder without
  holoprosencephaly or pancreatic agenesis); the p.Arg535Cys phenotype is
  therefore attributed to a variant-specific rather than haploinsufficiency
  mechanism, hypothesized to act through failure to repress SHH in the dorsal
  foregut endoderm and developing forebrain.

- name: Failure of SHH Repression in the Dorsal Foregut Endoderm
  description: >-
    Successful specification of the dorsal pancreatic bud requires SHH to be
    actively repressed in the dorsal foregut endoderm. Pancreatic tissue from
    E14.5 mouse embryos homozygous for the orthologous Cnot1 p.Arg535Cys allele
    shows significantly increased Shh expression with reduced Pdx1, Ins, Hnf1b,
    and Ptf1a: the signature of a foregut endoderm that has failed to switch off
    the hedgehog programme and consequently failed to activate the pancreatic
    transcription-factor cascade. This is the leading, but not yet proven,
    explanation for the pancreatic arm of HPE12.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:31006513

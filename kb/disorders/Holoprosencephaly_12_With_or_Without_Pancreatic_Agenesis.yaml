- name: Fetal Insulin Deficiency
  description: >-
    Insulin is the dominant fetal growth factor in the third trimester. With no
    functioning fetal pancreas, insulin-driven fetal growth fails, producing
    severe intrauterine growth restriction and very low birth weight, a prenatal
    marker that, together with holoprosencephaly on ultrasound, should raise
    suspicion of HPE12. Across pancreas agenesis of all causes the growth deficit
    affects length and head circumference as well as weight, and is strongest
    from 36 weeks of gestation, implicating insulin in fetal lean-body as well as
    fat-mass growth.
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."

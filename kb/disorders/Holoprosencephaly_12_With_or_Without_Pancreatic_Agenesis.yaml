genetic:
- name: CNOT1
  gene_term:
    preferred_term: CNOT1
    description: >-
      CCR4-NOT transcription complex subunit 1, the scaffold of the CCR4-NOT mRNA
      deadenylase complex.
    term:
      id: hgnc:7877
      label: CNOT1
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: >-
    The single recurrent heterozygous de novo missense variant c.1603C>T
    (p.Arg535Cys) is the only CNOT1 allele reported to cause HPE12. Other de novo
    CNOT1 variants (missense, splice-site, nonsense) cause Vissers-Bodmer
    syndrome without holoprosencephaly or pancreatic agenesis, so the
    gene-disease relationship for HPE12 is allele-specific.
  variants:
  - name: "NM_016284.4:c.1603C>T (p.Arg535Cys)"
    description: >-
      Recurrent de novo missense substitution of a residue conserved to
      C. elegans; absent from dbSNP, DECIPHER, and gnomAD; predicted deleterious
      by AlignGVGD, PolyPhen2, and SIFT. Reported in at least six unrelated
      individuals plus one fetus.
    type: missense variant
    clinical_significance: PATHOGENIC
    gene:
      preferred_term: CNOT1
      term:
        id: hgnc:7877
        label: CNOT1
    evidence:
    - reference: PMID:31006513
      reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        The p.Arg535Cys variant is absent from dbSNP138, DECIPHER, and GnomAD and
        affects a residue which is highly conserved across species (up to C.
        elegans)
      explanation: >-
        Population-database absence and cross-species conservation supporting
        pathogenicity; COMPUTATIONAL because both are database and
        sequence-alignment analyses rather than patient observations.
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings suggest that CNOT1 plays a critical role in pancreatic and
      neurological development and describe a novel genetic syndrome of
      pancreatic agenesis and holoprosencephaly.
    explanation: >-
      Establishes CNOT1 as the causative gene for this syndrome.
  - reference: PMID:32553196
    reference_title: "De Novo Variants in CNOT1, a Central Component of the CCR4-NOT Complex Involved in Gene Expression and RNA and Protein Stability, Cause Neurodevelopmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on 39 individuals with heterozygous de novo CNOT1 variants,
      including missense, splice site, and nonsense variants, who present with a
      clinical spectrum of intellectual disability, motor delay, speech delay,
      seizures, hypotonia, and behavioral problems.
    explanation: >-
      Defines the contrasting CNOT1 loss-of-function phenotype (Vissers-Bodmer
      syndrome), supporting the allele-specific nature of HPE12.

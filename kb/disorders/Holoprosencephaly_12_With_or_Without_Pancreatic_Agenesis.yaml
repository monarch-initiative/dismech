  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since our three case subjects were all heterozygous for the same novel
      missense CNOT1 variant and none of the DDD participants with heterozygous
      de novo CNOT1 variants had pancreatic or neurological structural
      malformations, we hypothesized that a mutation-specific mechanism rather
      than loss of function was responsible for the phenotype seen in our case
      subjects.
    explanation: >-
      States the variant-specific (non-haploinsufficiency) mechanism that
      distinguishes HPE12 from other CNOT1 disease.
  downstream:
  - target: Perturbed CCR4-NOT Scaffold Function
    description: >-
      The p.Arg535Cys substitution alters the CNOT1 scaffold and thereby the
      post-transcriptional regulatory output of the CCR4-NOT complex.
- name: Perturbed CCR4-NOT Scaffold Function
  description: >-
    CNOT1 is the central scaffold of the CCR4-NOT complex, which catalyses
    poly(A) tail shortening (deadenylation) and thereby represses translation and
    triggers mRNA decay; it also mediates transcriptional repression
    independently of the complex. CNOT1 is expressed extremely early in
    embryogenesis, and its depletion in human cells alters the abundance of
    thousands of transcripts with a global decrease in mRNA decay. A
    variant-altered scaffold is therefore positioned to mis-set the timing of the
    early developmental gene-expression programme rather than simply reduce
    complex dosage.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

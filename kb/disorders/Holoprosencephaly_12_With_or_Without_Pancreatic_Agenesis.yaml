- name: Impaired Pancreatic Progenitor Specification
  description: >-
    The pancreatic transcription-factor cascade (PDX1, PTF1A, HNF1B) that
    specifies and expands the pancreatic buds fails to be activated. In the Cnot1
    p.Arg535Cys mouse this manifests as a significantly reduced pancreatic volume
    at E14.5, driven predominantly by a smaller dorsal pancreas, the bud whose
    specification depends on SHH repression.
  biological_scale: CELLULAR

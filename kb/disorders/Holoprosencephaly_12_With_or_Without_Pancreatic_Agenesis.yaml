animal_models:
- species: Mus musculus
  genotype: Cnot1 p.(Arg535Cys) knock-in (CRISPR), heterozygous and homozygous
  category: Genetic
  description: >-
    A CRISPR knock-in mouse carrying the orthologous Cnot1 p.Arg535Cys allele.
    Homozygotes are embryonic lethal but survive to E14.5, at which stage they
    show exencephaly, eye defects (mostly coloboma), edema, and a significantly
    reduced pancreas driven by a smaller dorsal bud, together with increased Shh
    and reduced Pdx1/Ins/Hnf1b/Ptf1a in pancreatic tissue. Heterozygotes are born
    at reduced frequency but without an obvious phenotype, the central species
    discrepancy, since human heterozygotes are fully affected.
  genes:
  - preferred_term: CNOT1
    term:
      id: hgnc:7877
      label: CNOT1
  associated_phenotypes:
  - Exencephaly
  - Coloboma
  - Reduced dorsal pancreas volume
  - Embryonic lethality (homozygotes)
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Upon dissection, several gross morphological abnormalities were apparent in
      homozygotes, notably exencephaly, eye defects (mostly coloboma), and edema
    explanation: >-
      Describes the gross phenotype of the variant-matched knock-in mouse.
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Heterozygous mice were born at a lower than expected frequency (Table S5),
      but without an obvious phenotype, while homozygosity for the mutation was
      embryonically lethal.
    explanation: >-
      Documents the dosage discrepancy between mouse and human that limits the
      model's translational fidelity.
differential_diagnoses:
- name: CNOT1-Related Vissers-Bodmer Syndrome
  description: >-
    The same gene, but caused by other de novo CNOT1 variants (missense,
    splice-site, nonsense). Presents with intellectual disability, motor and
    speech delay, seizures, hypotonia, and behavioral problems, without
    holoprosencephaly or pancreatic agenesis. Distinguishing HPE12 from
    Vissers-Bodmer is a variant-level, not gene-level, determination.
  distinguishing_features:
  - Absence of holoprosencephaly
  - Absence of pancreatic agenesis and neonatal diabetes
  - A CNOT1 variant other than c.1603C>T (p.Arg535Cys)
  evidence:
  - reference: PMID:32553196
    reference_title: "De Novo Variants in CNOT1, a Central Component of the CCR4-NOT Complex Involved in Gene Expression and RNA and Protein Stability, Cause Neurodevelopmental Delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report on 39 individuals with heterozygous de novo CNOT1 variants,
      including missense, splice site, and nonsense variants, who present with a
      clinical spectrum of intellectual disability, motor delay, speech delay,
      seizures, hypotonia, and behavioral problems.
    explanation: >-
      Defines the contrasting CNOT1 phenotype that must be distinguished from
      HPE12.
- name: Non-syndromic Mendelian pancreatic agenesis
  description: >-
    Pancreatic agenesis caused by PTF1A, PDX1, GATA6, GATA4, HNF1B, or RFX6.
    These present with permanent neonatal diabetes and exocrine insufficiency but
    not with holoprosencephaly. CNOT1 was the seventh pancreatic-agenesis gene
    described and is distinguished by the accompanying forebrain malformation.
  distinguishing_features:
  - Absence of holoprosencephaly
  - A pathogenic variant in one of the six previously established pancreatic-agenesis genes
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the 7th gene causative of pancreatic agenesis described so far
    explanation: >-
      Places CNOT1 as the seventh known pancreatic-agenesis gene, the six others
      forming the genetic differential.
- name: SHH-pathway and chromosomal holoprosencephaly
  description: >-
    Holoprosencephaly caused by loss-of-function variants in SHH and the hedgehog
    pathway (also ZIC2, SIX3, TGIF1, FGFR1), or by chromosome abnormalities such
    as trisomy 13 and 18p deletion. These account for the majority of genetically
    explained holoprosencephaly and lack the pancreatic phenotype.
  distinguishing_features:
  - No pancreatic agenesis, neonatal diabetes, or exocrine insufficiency
  - A variant in a classic holoprosencephaly gene or a causative chromosome abnormality
  evidence:
  - reference: PMID:39149840
    reference_title: "CNOT1 p.Arg535Cys variant in holoprosencephaly with late onset diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has a complex etiology, resulting from chromosome abnormalities or
      single gene variants in the Sonic hedgehog signaling pathway.
    explanation: >-
      Frames the broader holoprosencephaly differential against which HPE12 is
      distinguished.
discussions:
- discussion_id: hpe12_mouse_dosage_mismatch
  prompt: >-
    Why do mice require homozygosity for Cnot1 p.Arg535Cys to show pancreatic and
    forebrain defects while human heterozygotes are fully affected, and can the
    mouse be used to test candidate mechanisms for the human disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Pancreatic Progenitor Specification
  - pathophysiology#Disrupted Prosencephalic Midline Patterning
  rationale: >-
    The Cnot1 p.Arg535Cys knock-in mouse reproduces the human organ phenotypes
    only in homozygotes; heterozygotes are grossly normal. The authors note the
    same dosage discrepancy for HNF1B and conclude that early pancreatic
    development differs between mouse and human. Any mechanistic inference from
    the mouse, including the SHH-de-repression model that rests entirely on
    homozygous-embryo expression data, therefore carries an unquantified
    translational discount, and human iPSC-derived pancreatic and neural models
    are needed to test it at the human heterozygous dosage. The mouse phenotype
    is also not a precise phenocopy: homozygotes show exencephaly, spina bifida,
    and coloboma rather than holoprosencephaly.
  proposed_experiments:
  - experiment_id: exp_hpe12_ipsc_pancreatic_endoderm_shh
    name: SHH-de-repression signature in heterozygous CNOT1 p.Arg535Cys human pancreatic endoderm
    description: >-
      Differentiate isogenic CNOT1 p.Arg535Cys heterozygous human iPSC lines
      toward pancreatic endoderm and measure SHH, PDX1, PTF1A, HNF1B, and
      GATA4/GATA6 expression against wild type, to test whether the
      SHH-de-repression signature observed in homozygous mouse embryos reproduces
      at human heterozygous dosage.
    experiment_type:
      preferred_term: directed differentiation and gene-expression profiling experiment
  - experiment_id: exp_hpe12_ccr4not_deadenylation_assay
    name: CCR4-NOT composition and mRNA-decay profiling in p.Arg535Cys heterozygous cells
    description: >-
      Profile CCR4-NOT complex composition, transcriptome-wide poly(A) tail
      lengths, and mRNA decay rates in p.Arg535Cys heterozygous cells versus
      CNOT1-depleted and wild-type controls, to determine whether the variant
      acts by gain of repressive function rather than loss of deadenylase
      activity.
    experiment_type:
      preferred_term: transcriptome-wide mRNA stability profiling experiment
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice required a homozygous mutation in Cnot1 to display a pancreatic and
      brain phenotype while a heterozygous CNOT1 mutation resulted in the
      phenotype in three individuals in our cohort.
    explanation: >-
      States the species dosage mismatch that motivates this discussion.
- discussion_id: hpe12_shh_direction_paradox
  prompt: >-
    How can a single CNOT1 variant produce SHH de-repression in the pancreas
    while causing a forebrain malformation whose classic cause is SHH loss of
    function?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Failure of SHH Repression in the Dorsal Foregut Endoderm
  - pathophysiology#Disrupted Prosencephalic Midline Patterning
  rationale: >-
    Holoprosencephaly classically follows reduced SHH signalling, whereas the
    mouse pancreatic data show increased Shh. The original authors raise two
    non-exclusive resolutions, namely ectopic (mislocalised rather than merely
    elevated) SHH expression impairing midline development, or an organ-dependent
    direction of effect, but neither has been tested. This is the central
    unresolved point in the HPE12 mechanism model.
  evidence:
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Another possibility is that the effect of the CNOT1 mutation on SHH
      signaling differs between the brain and the pancreas, resulting in a
      reduced expression in the developing brain and increased expression during
      pancreatic development.
    explanation: >-
      The authors' explicit statement of the unresolved organ-dependent direction
      of the SHH effect.
notes: >-
  Phenotype scoping rule: this entry models the allele-specific p.Arg535Cys
  disorder, not the full CNOT1-related Vissers-Bodmer spectrum, which has its own
  MONDO identity. Phenotypes are therefore restricted to those documented in
  p.Arg535Cys carriers, with one deliberate exception: features that the
  GeneReviews CNOT1 chapter documents spectrum-wide AND that this entry's
  management recommendations depend on are imported, marked supports PARTIAL, and
  labelled allele-nonspecific in both the phenotype description and the causal
  edge. Those imported features are global developmental delay, hearing
  impairment, hypotonia, feeding difficulties and seizure; each is attached to
  the Perturbed CCR4-NOT Scaffold Function node rather than to an
  allele-specific mechanism, because no p.Arg535Cys-specific organ mechanism is
  established for them. Spectrum features that no management item in this entry
  depends on are deliberately NOT imported (neurobehavioral manifestations,
  growth issues, dental anomalies, myopia, strabismus, congenital heart defects,
  spasticity, ataxia, dysarthria, growth hormone deficiency, hypertrichosis,
  sleep disturbance, kidney anomalies); they belong to the Vissers-Bodmer entry.
  A further set of craniofacial and CNS findings reported for the Cospain fetal
  case by deep research (arhinencephaly, absent corpus callosum, cleft lip and
  palate) is omitted because that text is in the paper's full text rather than
  the cached abstract and is therefore not snippet-verifiable; it should be added
  if full text is ever cached.

  Named-entity check (NEC preflight): MONDO:0032787 carries RO:0004003 to
  HGNC:7877 (CNOT1) and xrefs OMIM:618500, matching the gene and OMIM number
  reported across all primary sources used here. No confusion with the
  phenotypically adjacent CNOT1-related Vissers-Bodmer syndrome (a distinct MONDO
  entity, modelled here as a differential diagnosis), with CDON-related HPE11
  (which the falcon deep-research run flagged as a plausible confusion), or with
  the rest of the numbered holoprosencephaly series, which involve different
  genes. Orphanet codes this entity as ORPHA:556955 (pancreatic
  agenesis-holoprosencephaly syndrome); no ORPHA structured-source snippet is
  cited because the Orphadata bulk XML is not present in this checkout.

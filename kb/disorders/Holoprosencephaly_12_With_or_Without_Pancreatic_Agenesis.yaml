      label: Autosomal dominant inheritance
  description: >-
    HPE12 arises from a heterozygous CNOT1 variant. In every reported case the
    recurrent p.Arg535Cys variant arose de novo, and no vertical transmission of
    this specific allele has been described, consistent with the severity of the
    phenotype. The broader CNOT1 disorder is autosomal dominant, most often de
    novo, with rare inheritance from a mildly affected parent. Holoprosencephaly
    has been present in every reported carrier, but the pancreatic component is
    incompletely penetrant and expressivity is markedly variable: carriers of the
    identical allele range from total pancreatic agenesis with day-one neonatal
    diabetes to a structurally normal neonatal pancreas with diabetes only in
    adolescence.
  penetrance: INCOMPLETE
  expressivity: VARIABLE

      HPE proband is worked up for a genetic cause, the route by which HPE12 is
      reached. PARTIAL and OTHER because the cached record is a scope statement
      for an expert overview rather than primary data.
  - reference: PMID:35481434
    reference_title: "Fetal Description of the Pancreatic Agenesis and Holoprosencephaly Syndrome Associated to a Specific CNOT1 Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing found the CNOT1 missense c.1603C>T, p.(Arg535Cys),

- name: Disrupted Prosencephalic Midline Patterning
  description: >-
    Cnot1 is expressed in the prosencephalic neural folds at the gestational
    stage at which the forebrain must divide into paired hemispheres. The
    p.Arg535Cys variant disrupts this patterning step, producing incomplete
    cleavage of the prosencephalon. The proposed molecular link is the same loss
    of SHH regulation seen in the pancreas, although the required direction of
    the SHH change differs between the two organs and has not been resolved:
    ectopic SHH expression is known to impair midline development, whereas SHH
    loss of function is the classic cause of holoprosencephaly.
  biological_scale: TISSUE

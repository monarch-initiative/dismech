diagnosis:
- name: Molecular genetic testing (exome or gene-panel sequencing)
  description: >-
    Diagnosis is established by identifying the heterozygous CNOT1 c.1603C>T
    (p.Arg535Cys) variant. Because the phenotype spans two organ systems that are
    rarely tested together, HPE12 is typically reached by exome sequencing in a
    proband with holoprosencephaly plus neonatal diabetes, or in a
    pancreatic-agenesis proband negative for the six previously known
    pancreatic-agenesis genes.
  evidence:
  - reference: PMID:41911374
    reference_title: "CNOT1-Related Vissers-Bodmer Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CNOT1-VIBOS is established in a proband with suggestive
      findings and a heterozygous pathogenic variant in CNOT1 identified by
      molecular genetic testing.
    explanation: >-
      GeneReviews diagnostic criterion for CNOT1-related disease.
  - reference: PMID:20301702
    reference_title: "Holoprosencephaly Overview."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

    evidence_source: MODEL_ORGANISM
    snippet: >-
      showed a significant increase of Shh expression in homozygous embryos, with
      decreased expression in Pdx1, Ins, Hnf1b, and Ptf1a
    explanation: >-
      Direct expression evidence from the Cnot1 p.Arg535Cys mouse that SHH is
      de-repressed while the pancreatic transcription-factor programme is
      suppressed.
  - reference: PMID:31006513
    reference_title: "A Specific CNOT1 Mutation Results in a Novel Syndrome of Pancreatic Agenesis and Holoprosencephaly through Impaired Pancreatic and Neurological Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      studies in both mouse and human embryos have shown that SHH expression
      needs to be repressed in the dorsal foregut endoderm for successful
      differentiation toward dorsal pancreas
    explanation: >-
      Establishes the developmental requirement for SHH repression that the CNOT1
      variant is proposed to break. OTHER because the statement summarises prior
      developmental-biology work in both mouse and human embryos and cannot be
      assigned a single organism-specific source; it is background, not a finding
      in the HPE12 cohort.
  downstream:
  - target: Impaired Pancreatic Progenitor Specification
    description: >-
      Persistent hedgehog signalling in the dorsal foregut endoderm blocks
      induction of the pancreatic progenitor programme.
    hypothesis_groups:

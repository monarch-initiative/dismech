    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Wide Anterior Fontanel
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Increased Bone Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients suffered severe clinical symptoms, such as hypotonia, hydrocephalus, cardiac anomaly, wide open fontanelles, facial dysmorphism, and dense bones
    explanation: >-
      The craniofacial and skeletal findings reported in previously published PEX19

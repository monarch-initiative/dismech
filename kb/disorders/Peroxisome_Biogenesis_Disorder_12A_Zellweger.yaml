  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    PEX19 encodes the 299-residue cytosolic chaperone and import receptor for
    peroxisomal membrane proteins, with three conserved domains and a C-terminal CAAX
    box that is farnesylated. Reported disease alleles include truncating variants at
    both ends of the severity range and missense variants associated with late-onset,
    mildly affected, long-surviving patients, so genotype does track phenotype to some
    degree within this gene.
  evidence:
  - reference: CGGV:assertion_fa073c77-0623-4e82-b5b2-9fcd0eb0dc6e-2023-04-27T160000.000Z
    reference_title: "PEX19 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PEX19 | HGNC:9713 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: ClinGen classifies the gene-disease relationship as Definitive.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with missense mutations (p.Ala85Val and p.Ser54Leu) had late-onset mild clinical symptoms with long-term survival
    explanation: >-
      The mild end of the PEX19 allelic series, which is why this entry's description
      says the reported phenotype is wider than the "Zellweger" label implies.
  - reference: PMID:28281558
    reference_title: "Allosteric modulation of peroxisomal membrane protein recognition by farnesylation of the peroxisomal import receptor PEX19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Farnesylation at a C-terminal CaaX motif in PEX19 enhances the PMP interaction, but the underlying molecular mechanisms are unknown.
    explanation: >-
      The C-terminal modification whose loss explains why the frameshift allele that
      replaces the CAAX box is inactivating.

- name: Congenital Structural Malformation
  biological_scale: TISSUE
  description: >-
    Structural birth defects reported in this disorder. The renal cysts and neuronal
    migration defects of the severe Zellweger phenotype are long established; in the
    PEX19 patient reported in 2025 the malformations were unilateral renal agenesis, a
    cardiac septal defect and a patent ductus. No mechanistic account links peroxisome
    loss to these specific defects, and this node exists to carry the reported
    associations rather than to assert a pathway.

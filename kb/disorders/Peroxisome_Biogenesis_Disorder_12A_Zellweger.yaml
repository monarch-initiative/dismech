name: Peroxisome Biogenesis Disorder 12A (Zellweger)
creation_date: "2026-09-09T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 12A is the severe, Zellweger-end presentation of
  PEX19 deficiency, historically complementation group J (also numbered group 14) of
  the peroxisome biogenesis disorders.

  PEX19 is not part of the matrix-import machinery. It is a soluble, predominantly
  cytosolic chaperone and import receptor for peroxisomal membrane proteins (PMPs):
  it binds newly made PMPs in the cytosol, recognises the targeting regions within
  them, and delivers them to the peroxisomal membrane, with farnesylation of its
  C-terminal CaaX motif reshaping the cargo-binding surface and strengthening that
  interaction. That places PEX19 one step earlier than every other PEX gene this KB
  curates as its own entry. PEX1, PEX6, PEX12 and PEX26 fail at receptor recycling
  and PEX13 at receptor docking; in those the peroxisomal membrane is still built and
  the cells retain the import-incompetent membrane remnants called "peroxisomal
  ghosts". In PEX19 disease there are no ghosts: with the membrane
  receptor gone, PMPs are degraded or mislocalise to mitochondria and no peroxisomal
  membrane compartment is assembled at all. PEX3 and PEX16 are the other two genes
  that behave this way.

  The downstream consequence nevertheless converges on the same clinical picture,
  because a cell with no peroxisomal membrane also has no peroxisomal matrix.
  Very-long-chain fatty acid beta-oxidation and ether-lipid (plasmalogen) synthesis
  both fail, and the developing brain, liver and skeleton are injured, producing the
  cerebro-hepato-renal presentation Zellweger described.

  Two things are specific to this locus and are curated here rather than inherited
  from the spectrum. First, PEX19 is among the rarest causes of Zellweger spectrum
  disease - the 2025 review that assembled its mutation spectrum found only eight
  published studies, against PEX1 and PEX26 which alone account for about 70% and
  10% of Zellweger spectrum cases - so the phenotype here is described from case
  reports rather than from a series, and this entry carries no frequency bands.
  Second, the reported PEX19 phenotype is unusually wide for a gene labelled by its
  severe end: two missense alleles gave late-onset disease with long-term survival,
  one reported insertion allele allowed survival to 16 months with liver and renal
  tubular disease emerging over that time, and the most recently reported patient
  had an unremarkable plasma very-long-chain fatty acid profile despite a homozygous
  nonsense allele. A normal metabolic screen therefore does not exclude this
  diagnosis.

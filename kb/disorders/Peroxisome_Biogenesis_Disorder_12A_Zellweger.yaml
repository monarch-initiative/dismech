genetic:
- name: PEX19
  gene_term:
    preferred_term: PEX19
    term:
      id: hgnc:9713
      label: PEX19
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  notes: >-
    PEX19 encodes the 299-residue cytosolic chaperone and import receptor for
    peroxisomal membrane proteins, with three conserved domains and a C-terminal CAAX
    box that is farnesylated. Reported disease alleles include truncating variants at
    both ends of the severity range and missense variants associated with late-onset,
    mildly affected, long-surviving patients, so genotype does track phenotype to some
    degree within this gene.
  evidence:
  - reference: CGGV:assertion_fa073c77-0623-4e82-b5b2-9fcd0eb0dc6e-2023-04-27T160000.000Z
    reference_title: "PEX19 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PEX19 | HGNC:9713 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: ClinGen classifies the gene-disease relationship as Definitive.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with missense mutations (p.Ala85Val and p.Ser54Leu) had late-onset mild clinical symptoms with long-term survival
    explanation: >-
      The mild end of the PEX19 allelic series, which is why this entry's description
      says the reported phenotype is wider than the "Zellweger" label implies.
  - reference: PMID:28281558
    reference_title: "Allosteric modulation of peroxisomal membrane protein recognition by farnesylation of the peroxisomal import receptor PEX19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Farnesylation at a C-terminal CaaX motif in PEX19 enhances the PMP interaction, but the underlying molecular mechanisms are unknown.
    explanation: >-
      The C-terminal modification whose loss explains why the frameshift allele that
      replaces the CAAX box is inactivating.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was assigned to the PEX19 complementation group. Subsequent mutation analysis of the PEX19 gene revealed homozygosity for a c.320delA frameshift mutation.
    explanation: >-
      A third truncating allele, c.320delA, reached through complementation-group
      assignment rather than sequencing first. It is the earliest frameshift in the
      reported series and sits at the severe end.
  - reference: DOI:10.1136/bcr-2022-252014
    reference_title: "Novel mutation causing Zellweger syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical exome sequencing yielded the diagnosis of Zellweger syndrome with a rare mutation in PEX-19 gene.
    explanation: >-
      A fourth reported PEX19 proband, diagnosed by clinical exome sequencing.
  - reference: PMID:21031596
    reference_title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      We did not identify any novel genetic complementation group, suggesting that all PEX gene defects resulting in peroxisome deficiency are currently known.
    explanation: >-
      The systematic complementation survey found no further group, which is what makes
      the twelve or thirteen known PEX genes, PEX19 among them, a closed set rather
      than a running list. Graded indirect: the finding is about the gene set, not
      about PEX19.
biochemical:
- name: Very-long-chain fatty acids
  notes: >-
    Plasma very-long-chain fatty acids are the standard first-line screen for the
    Zellweger spectrum and are usually elevated. A normal profile does not exclude
    PEX19 disease: the 2025 PEX19-homozygous proband screened normal, and normal
    plasma levels have been recorded in a small number of other peroxisome biogenesis
    disorder patients.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PBD show elevated levels of VLCFAs."
    explanation: The expected direction of the marker in this disease class.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although, normal plasma VLCFAs have also been reported in a few patients"
    explanation: >-
      Records that the marker can be normal, which is the caveat this record exists to
      carry.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma very long chain fatty acid analysis showed high C26:0 levels and increasedC26:0/C22:0 and C24:0/C22:0 ratios, which is consistent with a PBD.
    explanation: >-
      The marker measured and elevated in a PEX19 patient, which is the positive case
      this record previously carried only at the level of the disease class. Quoted
      with the source's own missing space in "increasedC26:0".
diagnosis:
- name: Plasma very-long-chain fatty acid screening
  description: >-
    Biochemical screening of plasma very-long-chain fatty acids is the conventional
    entry point to a Zellweger spectrum diagnosis, but it can be normal in PEX19
    disease and did not raise the diagnosis in the 2025 proband, who was first
    labelled with a connective tissue disorder and then with acrocallosal syndrome.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The absence of the corpus callosum and widely spaced eyes (hypertelorism) have led neonatologists to misdiagnose these patients with acrocallosal syndrome.
    explanation: >-
      Documents the misdiagnosis route that biochemical screening failed to correct in
      this report.
- name: Molecular confirmation by exome sequencing
  description: >-
    Identification of biallelic pathogenic variants in a Zellweger-spectrum PEX gene
    establishes the diagnosis; in the reported PEX19 family it was whole-exome
    sequencing, confirmed by Sanger sequencing across the pedigree, that made it.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive clinical and biochemical findings above by identification of biallelic pathogenic variants in one of the 13 known ZSD-PEX genes.
    explanation: >-
      The diagnostic standard for the spectrum. Graded indirect because GeneReviews
      states it for the ZSD-PEX genes as a group.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES identified a homozygous nonsense variant (c.367C > T; p. Gln123*) in exon 4 of PEX19 in a female patient (IV-1) from family A
    explanation: The route by which the PEX19 diagnosis was actually made.
- name: Peroxisomal functional studies in cultured fibroblasts
  description: >-
    The fibroblast panel that establishes a peroxisome biogenesis defect and then
    localises it: plasmalogen biosynthesis and peroxisomal fatty acid alpha- and
    beta-oxidation to confirm the disorder, catalase and peroxisomal-membrane-protein
    immunofluorescence to ask whether any peroxisomal structure remains, and
    complementation assay or PEX cDNA transfection to assign the gene. The
    immunofluorescence step is the one that discriminates this entry's gene: absent
    membrane remnants point at PEX3, PEX16 or PEX19, whereas the matrix-import
    disorders leave stainable ghosts. This is the route by which the 2010 PEX19 patient
    was diagnosed, and it remains usable where plasma screening is normal.
  evidence:
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Studies in fibroblasts including plasmalogen biosynthesis, peroxisomal fatty acid alfa and beta oxidation confirmed the diagnosis of PBD.
    explanation: >-
      The functional panel that confirmed the diagnosis in a PEX19 patient.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluoresence microscopy revealed the absence of peroxisomes in fibroblasts.
    explanation: >-
      The immunofluorescence step, and the result that in this gene is diagnostic
      rather than merely confirmatory.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic mutations in PEX3, PEX16 and PEX19 cause affected cells to be devoid of peroxisomes"
    explanation: >-
      Why the absent-remnant result narrows the candidate genes to three rather than
      simply confirming a peroxisome biogenesis disorder.
  - reference: PMID:21031596
    reference_title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The assignment of over 600 fibroblast cell lines to different genetic complementation groups provides the most comprehensive and representative overview of the frequency distribution of the different PEX gene defects.
    explanation: >-
      Establishes complementation grouping of cultured fibroblasts as the systematic
      route to the gene. Graded indirect because the survey covers the spectrum.
- name: Carrier and prenatal testing
  description: >-
    Once the two pathogenic variants are known in an affected family member, at-risk
    relatives can be carrier tested and a subsequent pregnancy can be tested by DNA
    analysis. Where the variants are not known but the biochemical defect has been
    confirmed in cultured fibroblasts from the affected family member, prenatal
    biochemical testing is the alternative route - which matters in this gene, because
    the plasma screen can be normal while the fibroblast studies are not.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Carrier testing for at-risk relatives is possible if the pathogenic variants have been identified in an affected family member.
    explanation: >-
      The carrier-testing offer, conditional on the variants being known. Graded
      indirect because GeneReviews states it for the Zellweger spectrum as a class.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Prenatal testing for a pregnancy at increased risk is possible by DNA testing if both ZSD-related pathogenic variants have been identified in an affected family member, or by biochemical testing if the biochemical defects have been confirmed in cultured fibroblasts from an affected family member.
    explanation: >-
      The two prenatal routes and the condition each requires. Graded indirect for the
      same reason.
  notes: >-
    No PEX19-specific prenatal or carrier-testing series exists; this record is the
    spectrum-level standard applied to a gene whose reported case base is a handful of
    families. The 2025 Saudi report is the only one here that tested parents, and it
    did so to confirm segregation rather than for reproductive counselling.
treatments:
- name: Supportive and Symptomatic Management
  description: >-
    There is no disease-modifying therapy. Management of the Zellweger spectrum is
    symptomatic and multidisciplinary, including gastrostomy feeding for caloric
    intake, hearing aids, cataract surgery and refractive correction, and fat-soluble
    vitamin supplementation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide adequate calories, hearing aids, cataract removal, glasses to correct refractive errors, supplementation of fat-soluble vitamins, and cholic acid supplementation
    explanation: >-
      The GeneReviews management list for the spectrum. Graded indirect because no
      management study addresses the PEX19 subgroup.
  notes: >-
    No PEX19-specific management evidence exists. Every treatment record in this entry
    is drawn from the GeneReviews chapter covering the Zellweger spectrum as a class
    and is graded INDIRECT for that reason.
- name: Cholic Acid Supplementation
  description: >-
    Cholic acid supplementation is listed among the symptomatic measures used across
    the Zellweger spectrum.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      supplementation of fat-soluble vitamins, and cholic acid supplementation
    explanation: >-
      GeneReviews lists cholic acid supplementation in the management of the spectrum.
      Graded indirect for the same reason as the other treatment records.
  notes: >-
    The description deliberately says only what the cited snippet says. The usual
    rationale for cholic acid here - suppressing the toxic C27 bile-acid intermediates
    that accumulate when peroxisomal bile-acid synthesis fails - is the standard
    account of the drug in this disease class, but the cached GeneReviews record lists
    the intervention without explaining it, and nothing else cited here explains it
    either, so it is recorded as unsourced context rather than asserted.
- name: Adrenal Replacement Therapy
  description: >-
    Adrenal insufficiency is monitored for and treated with replacement therapy across
    the Zellweger spectrum.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  notes: >-
    The agent is bound at class level only. GeneReviews names the intervention
    ("adrenal replacement therapy") and not the drug, and no source cited here names
    one for a PEX19 patient, so the specific glucocorticoid is not recorded. The class
    binding is the clinical content of the phrase rather than an additional claim; a
    named agent would need its own source.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

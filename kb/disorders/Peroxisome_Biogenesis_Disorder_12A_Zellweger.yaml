experimental_models:
- name: CHO peroxisome-deficient mutant ZP119 (complementation group J)
  experimental_model_type: CELL_LINE
  description: >-
    A chemically derived Chinese hamster ovary mutant defective in import of both
    matrix and membrane proteins, later shown to be PEX19-deficient and assigned to the
    same complementation group as the human CG-J patients. It is the cell line the
    human PEX19 cDNA was cloned on, by screening a liver cDNA library for restoration
    of peroxisomes; the sibling mutant ZP165 belongs to the same group. It is a
    mammalian somatic-cell system rather than an animal model, which is why it sits
    here and not in `animal_models`.
  organism:
    preferred_term: Chinese hamster
    term:
      id: NCBITaxon:10029
      label: Cricetulus griseus
  cell_source: immortalized rodent cell line
  culture_system: 2D monolayer
  publication: PMID:10051604
  modeled_mechanisms:
  - target: Absence of Peroxisomal Membrane Compartments
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The mutant is devoid of peroxisomal membrane vesicles, which is this node's
      defining cellular phenotype, and stable expression of human PEX19 restores
      peroxisome biogenesis - so the line demonstrates the dependency rather than
      merely displaying it.
    limitations: >-
      A rodent somatic-cell mutant, not a patient genotype: it carries whatever lesion
      the mutagenesis produced rather than a reported human PEX19 allele, and a
      cultured fibroblast-like cell reports none of the developmental, hepatic or
      neurological biology that makes this a disease.
    evidence:
    - reference: PMID:10051604
      reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In no CG-J mutant cell were peroxisomal ghosts found
      explanation: >-
        The absence of membrane remnants in the group-J cells this line belongs to.
    - reference: PMID:10051604
      reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A stable transformant of ZP119 with HsPEX19 was morphologically and biochemically restored for peroxisome biogenesis.
      explanation: >-
        The rescue that makes the phenotype attributable to PEX19 rather than to the
        line's background.
  - target: Collapse of Peroxisomal Matrix Protein Import
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The line was isolated as a matrix- and membrane-import double defect, which is
      the combination this entry's chain predicts: matrix import fails because there is
      no compartment to import into.
    limitations: >-
      Same rodent-somatic-cell caveat. The line cannot separate the two defects in
      time, so it shows the combination rather than the ordering the edge asserts.
    evidence:
    - reference: PMID:10051604
      reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We have isolated a human PEX19 cDNA (HsPEX19) by functional complementation of peroxisome deficiency of a mutant Chinese hamster ovary cell line, ZP119, defective in import of both matrix and membrane proteins.
      explanation: >-
        States the import defect and that human PEX19 complements it.
- name: PBDJ-01 patient fibroblasts (complementation group J)
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Skin fibroblasts from the original complementation-group-J Zellweger patient, who
    is homozygous for a 1-base insertion at A764 that frameshifts the C-terminal CAAX
    region. Transfection with human PEX19 restores peroxisomal protein import in these
    cells and in no other complementation group, which is the experiment that made
    PEX19 the causative gene for this disorder.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_source: patient-derived primary culture
  culture_system: 2D monolayer
  publication: PMID:10051604
  modeled_mechanisms:
  - target: Collapse of Peroxisomal Matrix Protein Import
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Human PEX19 expression restores matrix protein import in cells carrying a
      patient's own PEX19 allele, establishing that the import collapse is downstream
      of the PEX19 lesion and not a separate defect.
    limitations: >-
      A cultured skin fibroblast reports the cellular arm of the disorder only. It
      carries one allele from one patient, so it says nothing about the allelic series,
      and nothing about why the same cellular defect produces phenotypes ranging from
      neonatal death to long-term survival.
    evidence:
    - reference: PMID:10051604
      reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        HsPEX19 expression also restored peroxisomal protein import in fibroblasts from a patient (PBDJ-01) with Zellweger syndrome of CG-J.
      explanation: >-
        The complementation result in patient cells, which is the basis for treating
        matrix-import failure as a consequence of the PEX19 lesion.

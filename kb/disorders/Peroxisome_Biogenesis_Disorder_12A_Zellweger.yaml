notes: >-
  Ten things about this entry are deliberate.

  First, **it is a standalone entry rather than a subtype of
  `Peroxisome_Biogenesis_Disorder`.** That file carries no `has_subtypes` block at
  all, and PBD 1B, 2B, 3A, 4A, 4B, 11A and 11B are each their own file; PBD2B was
  curated standalone in #11030 on the reasoning that the A/B split is a mechanistic
  claim about residual peroxin function rather than a severity label. That reasoning
  holds here and is if anything stronger: PEX19 is not a matrix-import gene at all,
  so its mechanism diverges from the PEX1/PEX6/PEX12/PEX26 entries at the first step
  rather than at the last.

  Second, **the mechanistic claim that distinguishes this entry is the absence of
  peroxisomal membrane ghosts**, and it is carried by two independent citations
  rather than asserted in prose alone: the 1999 complementation-group-J report states
  that no peroxisomal ghosts were found in any group-J mutant cell, and the 2025
  review states that PEX3, PEX16 and PEX19 mutations leave cells devoid of
  peroxisomes. This is the feature that separates PEX19 from every other PEX gene
  curated here as its own entry.

  Third, **no phenotype carries a `frequency` band.** The published PEX19 case base
  is eight studies. There is no denominator from which a frequency could be read, and
  fabricating one from a spectrum-level source would attribute PEX1-dominated
  statistics to this gene.

  Fourth, **the normal very-long-chain fatty acid profile is curated as content, not
  omitted.** The 2025 proband was homozygous for a nonsense PEX19 allele and screened
  normal for VLCFA. That observation is carried twice: as a `REFUTE` evidence item on
  the accumulation node, because it contradicts the claim that accumulation is
  invariable, and as a caveat on the biochemical marker and the screening diagnosis
  record. A curator reading only the node description would otherwise take the
  accumulation as obligate.

  Fifth, **the causal edges into the malformation and dysmorphology nodes are marked
  `INDIRECT` and say in their own `description` that the route is not worked out.**
  Renal agenesis, the septal defect and the patent ductus were observed in the PEX19
  proband and cardiac anomaly appears in the PEX19 phenotype summary, but no cited
  source proposes a mechanism connecting peroxisome loss to them. The nodes exist to
  attach the reported findings, not to assert a pathway.

  Sixth, **early neonatal death is recorded in `progression`, not as a phenotype.**
  `HP:0003811` Neonatal death and `HP:0001522` Death in infancy both sit under the
  HPO mortality branch, which is outside `HP:0000118` and therefore outside this
  schema's `PhenotypeTerm` dynamic enum; binding either fails validation. The
  observation is carried by a `progression` phase instead, alongside the attenuated
  PEX19 courses that show it is not universal in this gene.

  Seventh, **three phenotypes are deliberately unwired**, each with its reason in its
  own `notes`. `Polyhydramnios` has no incoming edge because the usual explanation,
  impaired fetal swallowing, is not stated for this disorder in any cited source.
  `Renal Tubular Dysfunction` and `Cholelithiasis` have none because the paper that
  reported them says in as many words that the association with a peroxisome biogenesis
  disorder was previously unrecognised, and offers no route from peroxisome loss to
  either. Every other phenotype is the target of exactly one pathophysiology node.

  Eighth, **the deep-research provider substituted a different disease on the
  first two attempts, and the query that fixed it is recorded here.** A `falcon`
  run against the plain entry name returned a report about *PEX3* - that is
  peroxisome biogenesis disorder 10A, the neighbouring membrane-assembly gene -
  with `PEX3` mentioned 95 times against 5 for `PEX19`. A retry appending
  `--var 'disease_name=...'` to `just research-disorder` reproduced that report
  byte-for-byte, because the override does not reach the client through the
  recipe's trailing arguments. What worked was temporarily replacing the entry's
  own `name:` field, which is what the recipe reads, with a disambiguated string
  naming PBD12A, OMIM 614886, *PEX19*, complementation group J, and an explicit
  "not the PEX3-associated PBD10A". That run returned the right disease
  (`PEX19=85`, `PEX3=15`, report OMIM 614886 matching MONDO's) and is the report
  committed here; the substituted report was discarded rather than mined. Note
  that `just preflight-dr` reports `SKIP` for this entry in every case, because
  MONDO records no causal gene for `MONDO:0013951` - the gene comes from its
  parent term - so the gene check has to be done by hand.

  Ninth, **the one figure a reviewer asked for is the one that cannot be quoted.**
  Ebberink's complementation survey of more than 600 patient cell lines is the natural
  denominator for a statement of how rare the PEX19 group is, and the falcon report
  committed alongside this entry does carry a per-gene share, reading "In a
  613-cell-line ZSD series, only 4/613 (0.65%) were assigned to PEX19". That number is
  in no committed *source*. The DOI form of the paper (`DOI:10.1002/humu.21388`)
  fetches to a 403 at the publisher and caches with `content_type: unavailable` and an
  empty body; refetching by PMID recovers `PMID:21031596`, whose PubMed abstract is
  what is cited here, but the per-gene breakdown is in the paper's tables and not in
  the abstract, which says only "over 600". So the survey is cited for the existence
  and authority of its frequency distribution, and `prevalence` stays
  `NOT_YET_DOCUMENTED`. Quoting the percentage would have put a number in this entry
  that no reader could check against anything in this repository.

  Tenth, **the PEX3/PEX16 step is deliberately not written into the pathograph.** It
  would be easy to decompose the edge from membrane-protein targeting to absent
  peroxisomes into "PEX19 delivers cargo to PEX3, which inserts it", and that sentence
  appears in plenty of reviews. The Pex3/Pex19 review cited on that edge states that no
  consensus exists on how the two operate, and names direct membrane insertion and
  ER-derived vesicle budding as both still live. The edge therefore stays `DIRECT`,
  with the dispute recorded on it as evidence rather than resolved by fiat.

  Two limitations worth flagging for anyone extending this. The plasmalogen node is
  supported by a Zellweger-fibroblast study whose cell strains are not identified as
  group-J, so it is graded `directness: INDIRECT`; a PEX19-specific plasmalogen
  measurement would be a real improvement. And there is still no `animal_models`
  section, but the earlier statement of why was narrower than the search behind it.
  What was searched was a PubMed title search for the gene combined with mouse, mice or
  knockout, which returns no `Pex19` knockout mouse; that is a claim about mice, not
  about model organisms. Non-mammalian and cell-based systems do exist, and two of them
  are now curated in `experimental_models` from sources already cited here - the CHO
  group-J mutants ZP119/ZP165 and the PBDJ-01 patient fibroblast line. A *Pichia
  pastoris* `pex19` mutant is cited in the literature and its paper is cached here
  (`DOI:10.1091/mbc.10.6.1745`), but a yeast deletion strain is neither an animal model
  nor a disease-relevant NAM, so it is left uncurated. The review that catalogues
  peroxisome-deficient invertebrate and vertebrate models
  (`DOI:10.3389/fphys.2013.00335`) caches with an empty body, so the *Drosophila*,
  *C. elegans* and zebrafish work it covers cannot be quoted from anything committed
  here and is not asserted.

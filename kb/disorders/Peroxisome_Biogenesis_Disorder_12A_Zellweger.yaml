- name: NCT01668186
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    A longitudinal observational natural history study of peroxisome biogenesis
    disorders, following patients in Canada, the US and internationally, and banking
    clinical data in a peroxisomal disorder databank and biobank. It is the only
    registered study whose enrolment criteria this entry's patients would meet as a
    group; it is not PEX19-specific and no PEX19 result has been reported from it.
  evidence:

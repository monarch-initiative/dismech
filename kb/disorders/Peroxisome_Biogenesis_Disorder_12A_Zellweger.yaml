name: Peroxisome Biogenesis Disorder 12A (Zellweger)
creation_date: "2026-09-09T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 12A is the severe, Zellweger-end presentation of
  PEX19 deficiency, historically complementation group J (also numbered group 14) of
  the peroxisome biogenesis disorders.

  PEX19 is not part of the matrix-import machinery. It is a soluble, predominantly
  cytosolic chaperone and import receptor for peroxisomal membrane proteins (PMPs):
  it binds newly made PMPs in the cytosol, recognises the targeting regions within
  them, and delivers them to the peroxisomal membrane, with farnesylation of its
  C-terminal CaaX motif reshaping the cargo-binding surface and strengthening that
  interaction. That places PEX19 one step earlier than every other PEX gene this KB
  curates as its own entry. PEX1, PEX6, PEX12 and PEX26 fail at receptor recycling
  and PEX13 at receptor docking; in those the peroxisomal membrane is still built and
  the cells retain the import-incompetent membrane remnants called "peroxisomal
  ghosts". In PEX19 disease there are no ghosts: with the membrane
  receptor gone, PMPs are degraded or mislocalise to mitochondria and no peroxisomal
  membrane compartment is assembled at all. PEX3 and PEX16 are the other two genes
  that behave this way.

  The downstream consequence nevertheless converges on the same clinical picture,
  because a cell with no peroxisomal membrane also has no peroxisomal matrix.
  Very-long-chain fatty acid beta-oxidation and ether-lipid (plasmalogen) synthesis
  both fail, and the developing brain, liver and skeleton are injured, producing the
  cerebro-hepato-renal presentation Zellweger described.

  Two things are specific to this locus and are curated here rather than inherited
  from the spectrum. First, PEX19 is among the rarest causes of Zellweger spectrum
  disease - the 2025 review that assembled its mutation spectrum found only eight
  published studies, against PEX1 and PEX26 which alone account for about 70% and
  10% of Zellweger spectrum cases - so the phenotype here is described from case
  reports rather than from a series, and this entry carries no frequency bands.
  Second, the reported PEX19 phenotype is unusually wide for a gene labelled by its
  severe end: two missense alleles gave late-onset disease with long-term survival,
  one reported insertion allele allowed survival to 16 months with liver and renal
  tubular disease emerging over that time, and the most recently reported patient
  had an unremarkable plasma very-long-chain fatty acid profile despite a homozygous
  nonsense allele. A normal metabolic screen therefore does not exclude this
  diagnosis.
disease_term:
  preferred_term: peroxisome biogenesis disorder 12A (Zellweger)
  term:
    id: MONDO:0013951
    label: peroxisome biogenesis disorder 12A (Zellweger)
synonyms:
- PBD12A
- peroxisome biogenesis disorder, complementation group J
- peroxisome biogenesis disorder, complementation group 14
- CG-J
- PEX19-related Zellweger syndrome
parents:
- Peroxisome Biogenesis Disorder
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PEX19 variants are required. The original complementation-group-J
    patient was homozygous for a frameshift allele, and the most recently reported
    family was homozygous for a nonsense allele with both parents heterozygous.
    ClinGen's Peroxisomal Disorders expert panel classifies the PEX19 gene-disease
    relationship as Definitive with autosomal recessive inheritance.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alignment of Sanger sequencing data with reference genomic sequences revealed that the variants were present in a homozygous state in patients and in a heterozygous state in both parents, confirming an autosomal recessive pattern of inheritance
    explanation: >-
      Segregation in the PEX19 family establishes the recessive mode directly.
  - reference: CGGV:assertion_fa073c77-0623-4e82-b5b2-9fcd0eb0dc6e-2023-04-27T160000.000Z
    reference_title: "PEX19 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PEX19 | HGNC:9713 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: >-
      ClinGen records the mode of inheritance as autosomal recessive and the
      gene-disease relationship as Definitive.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      At conception, each sib of an individual with biallelic ZSD-causing pathogenic variants has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risk that follows from the recessive mode, which is what a family
      with an affected child is actually counselled on. Graded indirect because
      GeneReviews states it for the Zellweger spectrum as a class; the PEX19 family
      reported in 2025 segregated exactly this way, with both parents heterozygous.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population estimate exists for the PEX19 subgroup specifically. The 2025
    review that assembled the published PEX19 mutation spectrum found only eight
    prior studies, and describes PEX19 as among the least common causes of Zellweger
    spectrum disease; more than 90% of Zellweger spectrum cases are accounted for by
    PEX1, PEX6, PEX10, PEX12 and PEX26.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in PEX19 gene are one of the least common causes of ZS disorders"
    explanation: >-
      States the rarity of this genetic subgroup within the Zellweger spectrum.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are very few reported cases of PEX19 gene mutations and only eight studies have been published, of which four had missense, two nonsense, and two had frameshift mutations diagnosed with developmental disorder, ZS, PBDs, and myoclonic epilepsy
    explanation: >-
      Gives the size of the published case base, which is the reason this entry
      carries no phenotype frequency bands.
  - reference: PMID:21031596
    reference_title: "Genetic classification and mutational spectrum of more than 600 patients with a Zellweger syndrome spectrum disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      The assignment of over 600 fibroblast cell lines to different genetic complementation groups provides the most comprehensive and representative overview of the frequency distribution of the different PEX gene defects.
    explanation: >-
      The largest systematic complementation survey of the spectrum, and the reference
      source for how the PEX gene defects are distributed. Cited for the existence of
      that denominator, not for a PEX19 share: the per-gene breakdown is in the paper's
      tables, and the cached record carries only the abstract, so no PEX19 percentage
      is quoted here.
progression:
- phase: Severe Zellweger-end presentation
  notes: >-
    Truncating PEX19 alleles have been associated with the severe end of the
    spectrum, including early neonatal death. Early death is recorded here rather
    than as a phenotype because the HPO mortality terms sit outside the branch this
    schema's PhenotypeTerm enum is drawn from.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in PEX19 have been associated with multisystem involvement, resulting in severe phenotypes, such as hypotonia, hydrocephalus, cardiac anomaly, genital abnormalities, dense bones, abnormal facial features, and early neonatal death
    explanation: Names early neonatal death as part of the severe PEX19 phenotype.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die during the first year of life, usually having made no developmental progress.
    explanation: >-
      The survival expectation at the severe end of the spectrum. Graded indirect
      because GeneReviews describes the spectrum as a class.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient had a stormy course with multiple admissions to the pediatric intensive care unit with pneumonia, liver impairment, sepsis, and epilepsy.
    explanation: >-
      The clinical course of the c.320delA homozygote, which is the most fully described
      PEX19 case. Severe and multisystem, but with survival past the first year, so the
      severe end of this gene's range is not uniformly neonatally lethal.
- phase: Attenuated PEX19 presentations
  notes: >-
    The PEX19 allelic series is not uniformly severe. Two missense alleles gave
    late-onset disease with long-term survival, and one reported insertion allele,
    c.763_764insA, allowed survival to 16 months with liver and renal tubular disease
    emerging over that period.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with missense mutations (p.Ala85Val and p.Ser54Leu) had late-onset mild clinical symptoms with long-term survival
    explanation: The mild end of the reported PEX19 allelic series.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One of the reported PEX19 cases with an insertion mutation c.763_764insA showed a less severe phenotype with milder biochemical abnormalities and survived for up to 16 months after developing liver dysfunction and renal tubular defects
    explanation: >-
      The course of the original complementation-group-J patient's allele.
pathophysiology:
- name: Biallelic PEX19 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Both PEX19 alleles carry variants that abolish or severely reduce functional
    Pex19p. Reported severe alleles are truncating: the original
    complementation-group-J patient was homozygous for a single-base insertion that
    frameshifts the codon for Met255 and replaces the C-terminus, including the CAAX
    box required for function, with an unrelated 24-residue tail; the most recent
    family was homozygous for a nonsense change in exon 4 predicted to trigger
    nonsense-mediated decay.
  genes:
  - preferred_term: PEX19
    term:
      id: hgnc:9713
      label: PEX19
  downstream:
  - target: Failure of Cytosolic Membrane-Protein Targeting
    causal_link_type: DIRECT
    description: >-
      Loss of functional Pex19p removes the cytosolic receptor that peroxisomal
      membrane proteins depend on.
  evidence:
  - reference: PMID:10051604
    reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient (PBDJ-01) possessed a homozygous, inactivating mutation: a 1-base insertion, A764, in a codon for Met255, resulted in a frameshift, inducing a 24-aa sequence entirely distinct from normal Pex19p.
    explanation: >-
      The founding PEX19 allele, homozygous and inactivating in a patient with
      complementation-group-J Zellweger syndrome.
  - reference: PMID:10051604
    reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results demonstrate that PEX19 is the causative gene for CG-J PBD and suggest that the C-terminal part, including the CAAX homology box, is required for the biological function of Pex19p.
    explanation: >-
      Assigns the gene to the complementation group and locates the essential region
      in the C-terminus that the patient allele destroys.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identified mutation (c.367C > T; p. Gln123*) in a patient from family A is located in exon 4 of PEX19, which is predicted to cause premature termination of the mRNA transcript in domain 2
    explanation: >-
      A second, independent truncating allele in a separate family.
- name: Failure of Cytosolic Membrane-Protein Targeting
  biological_scale: MOLECULAR
  description: >-
    Pex19p is a soluble protein, mostly cytosolic at steady state, that binds a broad
    range of peroxisomal membrane proteins through the regions those proteins use for
    peroxisomal targeting, and delivers them to the membrane. Farnesylation of its
    C-terminal CaaX motif reorganises the cargo-binding surface and strengthens the
    interaction, which is why alleles truncating that region are inactivating. When
    Pex19p is absent, newly synthesised membrane proteins are degraded or delivered
    to mitochondria instead.
  biological_processes:
  - preferred_term: peroxisomal membrane protein targeting
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0045046
      label: protein import into peroxisome membrane
  downstream:
  - target: Absence of Peroxisomal Membrane Compartments
    causal_link_type: DIRECT
    description: >-
      With no route for membrane proteins to reach a peroxisomal membrane, no such
      membrane is assembled. Kept DIRECT deliberately. Pex19p hands its cargo off at
      the membrane in partnership with Pex3p, so a named intermediate could be written
      in here - but which step that partnership performs is genuinely unsettled, with
      direct insertion into the peroxisomal membrane and budding of PMP-containing
      vesicles from the ER both still live models. Naming one would assert a mechanism
      the field has not agreed on; the edge records the dependency and this note
      records the dispute.
    evidence:
    - reference: DOI:10.1002/1873-3468.13340
      reference_title: "The peroxisome biogenesis factors Pex3 and Pex19: multitasking proteins with disputed functions"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Although these peroxins have been extensively studied, no consensus has been reached yet on how they operate.
      explanation: >-
        States that the Pex3/Pex19 mechanism is unresolved, which is why this edge is
        left as a dependency rather than being decomposed into named steps.
    - reference: DOI:10.1002/1873-3468.13340
      reference_title: "The peroxisome biogenesis factors Pex3 and Pex19: multitasking proteins with disputed functions"
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Here, we discuss two major models of their function, namely, in direct insertion of proteins into the peroxisomal membrane or in formation of PMP‐containing vesicles from the endoplasmic reticulum (ER).
      explanation: >-
        Names the two competing models, so a reader can see what the unnamed
        intermediate step would have to choose between.
  evidence:
  - reference: PMID:28281558
    reference_title: "Allosteric modulation of peroxisomal membrane protein recognition by farnesylation of the peroxisomal import receptor PEX19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The transport of peroxisomal membrane proteins (PMPs) requires the soluble PEX19 protein as chaperone and import receptor.
    explanation: >-
      States the function this node loses.
  - reference: PMID:10704444
    reference_title: "PEX19 binds multiple peroxisomal membrane proteins, is predominantly cytoplasmic, and is required for peroxisome membrane synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that PEX19 binds a broad spectrum of PMPs, displays saturable PMP binding, and interacts with regions of PMPs required for their targeting to peroxisomes.
    explanation: >-
      Establishes the breadth of cargo and that PEX19 engages the targeting regions
      themselves, so its loss is not cargo-selective.
  - reference: PMID:10704444
    reference_title: "PEX19 binds multiple peroxisomal membrane proteins, is predominantly cytoplasmic, and is required for peroxisome membrane synthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This hypothesis is supported by the observation that the loss of PEX19 results in degradation of PMPs and/or mislocalization of PMPs to the mitochondrion.
    explanation: >-
      The specific fate of the untargeted cargo asserted in this node's description.
  - reference: PMID:28281558
    reference_title: "Allosteric modulation of peroxisomal membrane protein recognition by farnesylation of the peroxisomal import receptor PEX19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutations of PEX19 residues that either mediate farnesyl contacts or are directly involved in PMP recognition abolish cargo binding and cannot complement a ΔPEX19 phenotype in human Zellweger patient fibroblasts.
    explanation: >-
      Ties the cargo-recognition surface, and its dependence on farnesylation, to
      failure to rescue patient cells, which is what makes this the disease-relevant
      step.
  - reference: DOI:10.1083/jcb.200304111
    reference_title: "PEX19 is a predominantly cytosolic chaperone and import receptor for class 1 peroxisomal membrane proteins"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results show that PEX19 functions as both a chaperone and an import receptor for newly synthesized PMPs.
    explanation: >-
      Establishes that PEX19 carries two separable jobs, cytosolic stabilisation of
      newly made membrane proteins and receptor-mediated delivery, so its loss removes
      both at once rather than only the targeting step this node is named for.
- name: Absence of Peroxisomal Membrane Compartments
  biological_scale: CELLULAR
  description: >-
    Cells from complementation group J contain no peroxisomal membrane remnants. This
    is the feature that separates PEX19 disease from the matrix-import peroxisome
    biogenesis disorders, in which membrane "ghosts" persist and can be stained; PEX3
    and PEX16 deficiency behave the same way.
  biological_processes:
  - preferred_term: peroxisome organization
    modifier: DECREASED
    term:
      id: GO:0007031
      label: peroxisome organization
  downstream:
  - target: Collapse of Peroxisomal Matrix Protein Import
    causal_link_type: DIRECT
    description: >-
      A matrix cannot be imported into a compartment that does not exist, so matrix
      import fails as a consequence of the membrane defect rather than in parallel
      with it.
  evidence:
  - reference: PMID:10051604
    reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In no CG-J mutant cell were peroxisomal ghosts found"
    explanation: >-
      The absence of membrane remnants in group-J cells, which is the defining
      cellular phenotype of this node.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic mutations in PEX3, PEX16 and PEX19 cause affected cells to be devoid of peroxisomes"
    explanation: >-
      Groups PEX19 with the two other membrane-assembly genes and states the same
      cellular consequence.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the genes PEX 1, 2, 5-7, 10, 11β, 12-14 and 26 are essential for the import of matrix enzymes from the cytosol into peroxisomes, and PEX 3, 16, and 19 work for the biogenesis of peroxisomes and assembly of peroxisomal membranes
    explanation: >-
      The division of labour that puts this entry's gene in the membrane-assembly
      class rather than the matrix-import class.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluoresence microscopy revealed the absence of peroxisomes in fibroblasts.
    explanation: >-
      The same cellular phenotype observed directly in fibroblasts from a
      PEX19-homozygous patient, independently of the original complementation-group-J
      cell panel.
- name: Collapse of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  description: >-
    With no peroxisomal compartment, matrix enzymes remain in the cytosol, where they
    are degraded or left in unprocessed precursor form. Expressing wild-type PEX19 in
    group-J patient fibroblasts restores matrix protein import, which is what
    demonstrates that the matrix defect is downstream of the PEX19 lesion rather than
    a separate one.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  downstream:
  - target: Accumulation of Very-Long-Chain Fatty Acids
    causal_link_type: DIRECT
    description: >-
      Peroxisomal beta-oxidation is lost with the matrix enzymes that carry it out.
  - target: Plasmalogen Deficiency
    causal_link_type: DIRECT
    description: >-
      Ether-lipid synthesis begins in the peroxisome and fails with it.
  - target: Craniofacial and Skeletal Dysmorphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The dysmorphic and bone findings are consistently reported across the Zellweger
      spectrum and in the PEX19 cases specifically, but which metabolic arm produces
      them is not established, so this edge is drawn from the loss of peroxisomal
      function as a whole rather than from a named metabolite.
  - target: Congenital Structural Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Congenital malformations are part of the severe Zellweger phenotype and renal
      and cardiac defects were present in the reported PEX19 patients, but no
      mechanistic route from peroxisome loss to these particular malformations has
      been established; the edge records the association, not a worked-out mechanism.
  evidence:
  - reference: PMID:10051604
    reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      HsPEX19 expression also restored peroxisomal protein import in fibroblasts from a patient (PBDJ-01) with Zellweger syndrome of CG-J.
    explanation: >-
      Rescue of import by wild-type PEX19 in the patient's own cells places the
      import failure downstream of the PEX19 lesion.
  - reference: PMID:10051604
    reference_title: "Human PEX19: cDNA cloning by functional complementation, mutation analysis in a patient with Zellweger syndrome, and potential role in peroxisomal membrane assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, Pex19p is apparently involved at the initial stage in peroxisome membrane assembly, before the import of matrix protein.
    explanation: >-
      States the ordering this node depends on: membrane assembly first, matrix
      import after.
- name: Accumulation of Very-Long-Chain Fatty Acids
  biological_scale: ORGANISM
  description: >-
    Peroxisomes are where very-long-chain and branched-chain fatty acids are
    catabolised, so their absence lets these substrates accumulate. In this disorder
    that accumulation is usual but not invariable: the most recently reported PEX19
    patient had an unremarkable very-long-chain fatty acid profile despite a
    homozygous nonsense allele, and normal plasma levels have been recorded in a
    handful of other peroxisome biogenesis disorder patients.
  biological_processes:
  - preferred_term: very long-chain fatty acid catabolism
    modifier: DECREASED
    term:
      id: GO:0000038
      label: very long-chain fatty acid metabolic process
  downstream:
  - target: Progressive Hepatic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Liver disease is a core component of the severe Zellweger phenotype and
      developed in the longest-surviving reported PEX19 patient.
  - target: Impaired Neuronal Migration and Neurogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal migration defects are a defining congenital malformation of the severe
      end of the spectrum.
  evidence:
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with PBD show elevated levels of VLCFAs."
    explanation: >-
      The expected biochemical consequence in peroxisome biogenesis disorders.
  - reference: PMID:39757991
    reference_title: "Zellweger syndrome; identification of mutations in PEX19 and PEX26 gene in Saudi families."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic profile including very long chain fatty acids (VLCFA) were unremarkable."
    explanation: >-
      The PEX19-homozygous proband in this report had a normal very-long-chain fatty
      acid profile, which contradicts the claim that the accumulation is invariable
      in this disorder and is why the node's description hedges it.
  - reference: DOI:10.1002/ajmg.a.33560
    reference_title: "A mutation in PEX19 causes a severe clinical phenotype in a patient with peroxisomal biogenesis disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma very long chain fatty acid analysis showed high C26:0 levels and increasedC26:0/C22:0 and C24:0/C22:0 ratios, which is consistent with a PBD.
    explanation: >-
      The accumulation measured in a PEX19 patient specifically, which is what the
      node asserts; every other support for it here is spectrum-level. Quoted with the
      source's own missing space in "increasedC26:0" rather than corrected.
- name: Plasmalogen Deficiency
  biological_scale: MOLECULAR
  description: >-
    The first steps of ether-lipid synthesis are peroxisomal, so plasmalogens fall
    when the compartment is lost. In Zellweger fibroblasts the plasmalogen fraction of
    phosphatidylethanolamine is roughly half of control while total phospholipid
    content and membrane fluidity are unchanged, so this is a selective lipid defect
    rather than general membrane damage.
  biological_processes:
  - preferred_term: ether lipid biosynthesis
    modifier: DECREASED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
  downstream:
  - target: Impaired Neuronal Migration and Neurogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Plasmalogen loss is one of the two metabolic arms conventionally invoked for the
      brain phenotype of the Zellweger spectrum. No study cited here isolates its
      contribution in PEX19 disease specifically.
  evidence:
  - reference: PMID:12457713
    reference_title: "Plasmalogen content and beta-adrenoceptor signalling in fibroblasts from patients with Zellweger syndrome. Effects of hexadecylglycerol."
    supports: SUPPORT
    evidence_source: IN_VITRO

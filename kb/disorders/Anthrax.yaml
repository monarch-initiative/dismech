    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inhalation anthrax results from the inhalation of aerosolized spores.
    explanation: >-
      CDC guidelines state that aerosolized spores are the route for inhalational
      anthrax.
- name: Ingestion of contaminated meat
  description: >-
    Eating meat from infected animals delivers spores to the gastrointestinal
    tract and can cause intestinal or oropharyngeal anthrax.
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ingestion anthrax usually results from consumption of infected meat.
    explanation: >-
      CDC guidelines identify contaminated meat ingestion as the usual route for
      ingestion anthrax.
- name: Injection of contaminated heroin
  description: >-
    Injection of heroin contaminated with B. anthracis spores introduces the
    pathogen into deep soft tissue.
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Injection anthrax, which is a relatively new form, results from injection of
      heroin contaminated with B. anthracis spores.
    explanation: >-
      CDC guidelines identify contaminated heroin injection as the route for
      injection anthrax.
pathophysiology:
- name: Spore Uptake and Germination
  description: >-
    Dormant endospores enter through skin, gut, lung, or injection-site tissue,
    are engulfed by regional macrophages, and germinate to vegetative bacilli
    during the first intracellular stage of infection.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
  evidence:
  - reference: PMID:11207600
    reference_title: "Early Bacillus anthracis-macrophage interactions: intracellular survival survival and escape."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Anthrax infections are initiated by dormant endospores gaining access to the
      mammalian host and becoming engulfed by regional macrophages (Mphi).
    explanation: >-
      The experimental study places endospore uptake by regional macrophages at
      the start of B. anthracis infection.
  downstream:
  - target: pXO1-Dependent Macrophage Escape
    causal_link_type: DIRECT
    description: >-
      Germinating spores become vegetative bacilli that escape macrophage
      phagocytic vesicles.
- name: pXO1-Dependent Macrophage Escape
  description: >-
    Newly vegetative bacilli escape from macrophage phagocytic vesicles into the
    cytoplasm, and that macrophage-release phenotype requires the pXO1
    transactivator atxA even when the toxin genes themselves are absent.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  evidence:
  - reference: PMID:11207600
    reference_title: "Early Bacillus anthracis-macrophage interactions: intracellular survival survival and escape."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Genetic analysis from this study indicates that the toxin plasmid pXO1 is
      required for release from the Mphi, whereas the capsule plasmid pXO2 is not.
    explanation: >-
      Establishes the pXO1 dependence of the early macrophage-escape step.
  downstream:
  - target: Capsule-Mediated Immune Evasion
    causal_link_type: DIRECT
    description: >-
      Escaped vegetative bacilli activate capsule synthesis and resist
      phagocytic clearance.
- name: Capsule-Mediated Immune Evasion
  description: >-
    Vegetative bacilli that carry the pXO2 plasmid synthesize the
    polyglutamate capsule, preventing efficient phagocytosis and enabling
    extracellular proliferation and bacteremia.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: defense response to Gram-positive bacterium
    modifier: DECREASED
    term:
      id: GO:0050830
      label: defense response to Gram-positive bacterium
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The capsule prevents phagocytosis of the vegetative form of B. anthracis by
      macrophages, allowing it to evade the immune system.
    explanation: >-
      CDC guidelines describe the antiphagocytic capsule as an immune-evasion
      virulence factor.
  downstream:
  - target: Protective Antigen-Mediated Toxin Entry
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Extracellular bacilli secrete protective antigen with lethal factor and
      edema factor.
- name: Protective Antigen-Mediated Toxin Entry
  description: >-
    Protective antigen binds host anthrax toxin receptors such as ANTXR2/CMG2
    and mediates entry of lethal factor and edema factor into toxin-sensitive
    host cells by endocytic uptake.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: receptor-mediated endocytosis
    modifier: INCREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  evidence:
  - reference: PMID:42409807
    reference_title: Dynamic S-acylation controls CMG2 maturation extracellular matrix regulation and anthrax toxin susceptibility in vivo.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CMG2/ANTXR2 functions as a Collagen VI receptor required for extracellular
      matrix homeostasis and as the primary portal for anthrax toxin entry.
    explanation: >-
      Identifies ANTXR2/CMG2 as the primary receptor portal that allows anthrax
      toxin uptake in vivo.
  downstream:
  - target: MAPK Suppression and Adenylate Cyclase Excess
    causal_link_type: DIRECT
    description: >-
      Once PA delivers lethal factor and edema factor into the cytosol, both
      toxin enzymes perturb host signaling.
- name: MAPK Suppression and Adenylate Cyclase Excess
  description: >-
    Lethal factor proteolytically disables MAPK kinase signaling, while edema
    factor acts as a calmodulin-dependent adenylate cyclase; together, lethal
    toxin and edema toxin suppress innate and adaptive immunity and injure
    endothelial cells.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: DECREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  molecular_functions:
  - preferred_term: adenylate cyclase activity
    modifier: INCREASED
    term:
      id: GO:0004016
      label: adenylate cyclase activity
  evidence:
  - reference: PMID:36980364
    reference_title: "Human Anthrax: Update of the Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The tripartite toxin comprises protective antigen (PA), lethal factor (LF)
      and edema factor (EF). The role of PA is to transport LF and EF inside
      target cells where they interact with essential cellular pathways.
    explanation: >-
      The review summarizes the three toxin components and the PA-dependent
      cytosolic delivery of lethal factor and edema factor.
  downstream:
  - target: Systemic Toxemia and Vascular Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Toxin-induced immune suppression and endothelial injury allow bacteremia,
      hemorrhage, capillary leak, and shock.
- name: Systemic Toxemia and Vascular Injury
  description: >-
    Combined vegetative growth, capsule-mediated evasion, lethal toxin, and
    edema toxin disrupt host immune and endothelial functions, allowing
    unchecked proliferation and systemic toxemia.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These combined effects allow bacterial proliferation and lead to the high
      morbidity and mortality associated with anthrax.
    explanation: >-
      CDC guidelines synthesize the capsule and toxin effects as the proximate
      drivers of severe anthrax morbidity and mortality.
  downstream:
  - target: Eschar
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Local toxin activity and tissue injury at a skin inoculation site produce the eschar of cutaneous anthrax.
  - target: Edema
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Edema toxin activity and vascular injury produce prominent tissue edema.
  - target: Dyspnea
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Mediastinal disease and pleural effusions in inhalational anthrax cause dyspnea.
  - target: Respiratory Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reaccumulating pleural effusions and systemic toxemia can progress to respiratory failure.
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Systemic vegetative growth and toxemia manifest as sepsis.
  - target: Meningitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Disseminated bacilli can invade the meninges and produce anthrax meningitis.
  - target: Abdominal Pain
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Intestinal mucosal infection and edema produce abdominal pain in gastrointestinal anthrax.
  - target: Vomiting
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Gastrointestinal anthrax produces nausea and vomiting during intestinal disease.

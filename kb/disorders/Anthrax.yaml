has_subtypes:
- name: Cutaneous
  display_name: Cutaneous anthrax
  description: >-
    The common skin form caused by direct inoculation of spores through skin,
    classically forming a pruritic papule, vesicles, edema, and a necrotic
    eschar.
  subtype_term:
    preferred_term: cutaneous anthrax
    term:
      id: MONDO:0004215
      label: cutaneous anthrax
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cutaneous anthrax, which results from direct inoculation of spores through
      the skin, is the most common form and accounts for >95% of human cases.
    explanation: >-
      CDC guidelines define cutaneous anthrax by direct spore inoculation through
      skin and identify it as the dominant human presentation.
- name: Inhalational
  display_name: Inhalational anthrax
  description: >-
    The aerosol-spore form that begins nonspecifically and can progress to
    hemorrhagic mediastinitis, dyspnea, pleural effusions, respiratory failure,
    shock, and meningitis.
  subtype_term:
    preferred_term: inhalational anthrax
    term:
      id: MONDO:0016595
      label: inhalational anthrax
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Inhalation anthrax results from the inhalation of aerosolized spores.
    explanation: >-
      CDC guidelines define inhalational anthrax by aerosol-spore inhalation.
- name: Gastrointestinal
  display_name: Gastrointestinal anthrax
  description: >-
    Ingestion anthrax acquired from contaminated meat, with intestinal lesions
    that can progress to abdominal pain, vomiting, bloody diarrhea, ascites,
    toxemia, and shock.
  subtype_term:
    preferred_term: gastrointestinal anthrax
    term:

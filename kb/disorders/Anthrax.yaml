name: Anthrax
creation_date: "2026-09-25T02:51:11Z"
category: Infectious Disease
description: >-
  Anthrax is a zoonotic bacterial infection caused by the spore-forming
  Gram-positive bacillus Bacillus anthracis. Humans acquire disease from
  environmentally persistent spores through cutaneous inoculation, inhalation,
  ingestion, or injection of contaminated material. After macrophage uptake and
  pXO1-dependent intracellular escape, vegetative bacilli evade phagocytosis
  with the pXO2 capsule and secrete protective-antigen-delivered lethal and
  edema toxins that disable MAPK signaling, raise intracellular cAMP, injure
  vascular endothelium, and can drive edema, bacteremia, sepsis, hemorrhagic
  meningitis, and shock.
disease_term:
  preferred_term: anthrax infection
  term:
    id: MONDO:0005119
    label: anthrax infection
parents:
- Bacterial Infection
- Zoonotic Disease
synonyms:
- Bacillus anthracis infection
- malignant pustule
- woolsorters' disease
- splenic fever
references:
- reference: PMID:36980364
  title: "Human Anthrax: Update of the Diagnosis and Treatment."
- reference: PMID:37963097
  title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
classifications:

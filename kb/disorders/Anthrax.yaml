treatments:
- name: Antimicrobial Therapy
  description: >-
    Anthrax treatment and postexposure prophylaxis use antibiotics with activity
    against B. anthracis; ciprofloxacin, doxycycline, levofloxacin, minocycline,
    penicillin G, and tetracycline are FDA-approved for anthrax PEP, treatment,
    or both, with broader alternatives in CDC guidance for contraindications,
    intolerance, limited supply, or engineered resistance.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: antibiotic
      term:
        id: NCIT:C258
        label: Antibiotic
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Capsule-Mediated Immune Evasion
    description: >-
      Effective antibiotics kill vegetative B. anthracis and interrupt
      extracellular proliferation before toxin-driven systemic injury becomes
      irreversible.
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ciprofloxacin, doxycycline, levofloxacin, minocycline, penicillin G, and
      tetracycline are approved by FDA for anthrax PEPAbx, treatment, or both
    explanation: >-
      The 2023 CDC guideline enumerates FDA-approved antimicrobial options for
      anthrax postexposure prophylaxis and treatment.
- name: Anthrax Antitoxin
  description: >-
    Antitoxins such as anthrax immunoglobulin intravenous, obiltoxaximab, and
    raxibacumab neutralize circulating toxin and are considered adjunctive
    countermeasures for systemic anthrax.
  treatment_term:
    preferred_term: Passive Immunization
    term:
      id: NCIT:C15259
      label: Passive Immunization
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Protective Antigen-Mediated Toxin Entry
    description: >-
      Anthrax antitoxins neutralize protective antigen-dependent toxin entry
      upstream of lethal factor and edema factor cytosolic delivery.
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In animal models, treatment with the polyclonal or either monoclonal
      antitoxin provided a statistically significant (p<=0.0001for all three
      antitoxins) survival benefit compared with no treatment.
    explanation: >-
      CDC's systematic review found animal efficacy evidence for polyclonal
      AIGIV and the monoclonal antitoxins obiltoxaximab and raxibacumab.
  notes: >-
    Licensed antitoxin products include polyclonal anthrax immunoglobulin and
    monoclonal antibodies, so therapeutic_modality is recorded as OTHER rather
    than narrowing the whole class to MONOCLONAL_ANTIBODY.
- name: Postexposure Anthrax Vaccination
  description: >-
    Anthrax vaccination is paired with antimicrobial postexposure prophylaxis
    after exposure of an unvaccinated or incompletely vaccinated person so
    delayed spore germination can be covered after antimicrobial therapy stops.
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  therapeutic_modality: VACCINE
  target_mechanisms:
  - target: Protective Antigen-Mediated Toxin Entry
    description: >-
      Human anthrax vaccines use protective antigen as the principal immunogen,
      priming antibody responses that neutralize protective antigen-dependent
      toxin entry if spores germinate after antibiotic prophylaxis ends.
    evidence:
    - reference: PMID:36980364
      reference_title: "Human Anthrax: Update of the Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Protective antigen is the principal protective immunogen in these
        licensed human vaccines
      explanation: >-
        Identifies protective antigen, the shared delivery component for lethal
        and edema toxins, as the immunogen targeted by licensed human vaccines.
  evidence:
  - reference: PMID:37963097
    reference_title: "CDC Guidelines for the Prevention and Treatment of Anthrax, 2023."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For unvaccinated or incompletely vaccinated persons exposed to B. anthracis,
      PEP includes both antimicrobial drugs with activity against B. anthracis
      (PEPAbx) and anthrax vaccine (PEPVx).
    explanation: >-
      CDC guidelines pair antibiotic prophylaxis with vaccination after exposure
      in people who are not fully vaccinated.

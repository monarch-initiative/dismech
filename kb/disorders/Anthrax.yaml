    evidence_source: OTHER
    snippet: >-
      Injection anthrax, which is a relatively new form, results from injection of
      heroin contaminated with B. anthracis spores.
    explanation: >-
      CDC guidelines define injection anthrax by injection of spore-contaminated
      heroin.

  subtype_term:
    preferred_term: oropharyngeal anthrax
    term:
      id: MONDO:0000236
      label: oropharyngeal anthrax
  evidence:
  - reference: PMID:36980364
    reference_title: "Human Anthrax: Update of the Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Two clinical forms are described in the literature: oropharyngeal and

  - reference: PMID:26720232
    reference_title: "Human Cutaneous Anthrax, the East Anatolian Region of Turkey 2008-2014."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had histories of contact with diseased animals and animal
      products.
    explanation: >-
      This 82-patient endemic-region series links human cutaneous anthrax to
      contact with diseased animals or their products.
- name: Inhalation of aerosolized spores
  description: >-
    Aerosolized spores from contaminated animal products, industrial exposure, or
    intentional release can be inhaled and produce inhalational anthrax.
  evidence:
  - reference: PMID:37963097

name: Atrial Standstill
creation_date: "2026-05-06T17:25:39Z"
category: Heart Disorder
parents:
- Heart Disorder
- Cardiac Arrhythmia
disease_term:
  preferred_term: atrial standstill
  term:
    id: MONDO:0015281
    label: atrial standstill
description: >-
  Atrial standstill is a rare rhythm disease defined by absent atrial electrical
  activity together with absent mechanical contraction. This entry models the
  primary or isolated disease represented by MONDO:0015281 and ORPHA:1344,
  including partial versus diffuse and transient versus persistent
  presentations. It does not collapse every secondary occurrence of atrial
  standstill into one disease: infiltrative, inflammatory, ischemic, toxic,
  metabolic, muscular-dystrophy, and broader inherited-cardiomyopathy contexts
  are etiologically distinct manifestations that must be evaluated separately.
  Consequences of the final common electromechanical failure include absent P
  waves, escape-rhythm bradycardia, syncope, pacing dependence, and
  thromboembolism.
synonyms:
- AS
- Silent atrium
- Isolated atrial standstill
- Isolated atrial cardiomyopathy with heart block
- Persistent atrial standstill
- Permanent atrial standstill
- Partial atrial standstill
has_subtypes:
- name: Partial
  display_name: Partial atrial standstill
  description: >-
    Regional atrial electrical inactivity with residual excitable atrial tissue,
    sometimes limited to sites such as the coronary sinus.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atrial standstill is a rare clinical condition characterized by absence of electrical and mechanical atrial activity, and the spatial distribution of atrial lesion can be diffuse or partial."
    explanation: >-
      Supports partial versus diffuse atrial standstill as a clinically
      recognized spatial distinction.
- name: Diffuse
  display_name: Diffuse atrial standstill
  description: >-
    Widespread atrial electrical and mechanical inactivity, often with failure
    to capture the atria by pacing.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Atrial standstill is a rare clinical condition characterized by absence of electrical and mechanical atrial activity, and the spatial distribution of atrial lesion can be diffuse or partial."
    explanation: >-
      Supports diffuse atrial standstill as the extensive end of the spatial
      involvement spectrum.
mechanistic_hypotheses:
- hypothesis_group_id: scn5a_atrial_excitability_failure
  hypothesis_label: SCN5A-Related Atrial Excitability Failure
  status: CANONICAL
  description: >-
    Pathogenic SCN5A loss-of-function reduces sodium-current availability and
    suppresses atrial action-potential initiation or propagation. This is the
    best-supported electrical route to primary atrial standstill, with human
    segregation, functional channel studies, a multicenter pediatric cohort,
    and a systematic review of biallelic SCN5A disease.
  evidence:
  - reference: PMID:29781517
    reference_title: A homozygous SCN5A mutation associated with atrial standstill and sudden death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CONCLUSIONS: A homozygous loss-of-function SCN5A mutation likely results in atrial standstill and sudden death due to suppression of initiation of action potential."
    explanation: Functional channel data directly support the atrial-excitability mechanism.
  - reference: PMID:36435694
    reference_title: "Atrial Standstill in the Pediatric Population: A Multi-Institution Collaboration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified SCN5A variants in 13 patients (65%). Analyses suggest SCN5A loss-of-function may be one mechanism driving AS."
    explanation: A multicenter pediatric cohort independently supports SCN5A loss of function as a major mechanism.
- hypothesis_group_id: myl4_atrial_cardiomyopathy
  hypothesis_label: MYL4-Related Progressive Atrial Cardiomyopathy
  status: CANONICAL
  description: >-
    MYL4 loss of function disrupts atrial contractile, electrical, and
    structural integrity, producing a progressive atrial-selective
    cardiomyopathy that can culminate in standstill.
  evidence:
  - reference: PMID:29080865
    reference_title: "Dysfunction of Myosin Light-Chain 4 (MYL4) Leads to Heritable Atrial Cardiomyopathy With Electrical, Contractile, and Structural Components: Evidence From Genetically-Engineered Rats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation cosegregated with atrial standstill (selected as the principal presenting trait) with a logarithm of the odds score of 5.3."
    explanation: Human cosegregation strongly supports the MYL4 atrial-cardiomyopathy branch.
- hypothesis_group_id: gja5_conduction_reserve_modifier
  hypothesis_label: GJA5/Connexin-40 Conduction-Reserve Modifier
  status: EMERGING
  description: >-
    In two families, regulatory GJA5/connexin-40 genotypes accompanied SCN5A
    variants and were proposed to reduce atrial conduction reserve. The evidence
    supports a modifier or family-specific digenic contribution, not a universal
    requirement and not an independently established monogenic cause.
  evidence:
  - reference: PMID:12522116
    reference_title: A cardiac sodium channel mutation cosegregates with a rare connexin40 genotype in familial atrial standstill.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three living AS patients exclusively coinherited both the rare Cx40 genotype and the SCN5A-D1275N mutation."
    explanation: The affected relatives uniquely carried both loci in this family.
- hypothesis_group_id: myl4_autophagy_fibrosis
  hypothesis_label: MYL4 Autophagy-Fibrosis Mechanism
  status: EMERGING
  description: >-
    MYL4 dysfunction may impair lysosomal mobility and autophagic flux, promoting
    atrial-myocyte injury and fibrosis. This mechanistic layer is supported by
    rat and cell experiments but has not yet been demonstrated in human atrial
    tissue or tested therapeutically in patients.
  evidence:
  - reference: PMID:36645977
    reference_title: Myosin light-chain 4 gene-transfer attenuates atrial fibrosis while correcting autophagic flux dysregulation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rats subjected to knock-in of a pathogenic MYL4 mutant (p.E11K) developed fibrotic atrial cardiomyopathy."
    explanation: The rat knock-in model supports an autophagy-fibrosis mechanism while leaving human translation unresolved.

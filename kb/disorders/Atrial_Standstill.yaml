  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant inheritance is established for the MYL4 p.E11K atrial
    cardiomyopathy family and is reported in some SCN5A families, often with
    incomplete penetrance or additional modifier effects.
  evidence:
  - reference: PMID:29080865
    reference_title: "Dysfunction of Myosin Light-Chain 4 (MYL4) Leads to Heritable Atrial Cardiomyopathy With Electrical, Contractile, and Structural Components: Evidence From Genetically-Engineered Rats."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inheritance pattern was very likely to be autosomal dominant"
    explanation: The MYL4 family showed a dominant inheritance pattern.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic SCN5A variants can cause severe early-onset atrial standstill; the
    original homozygous family had unaffected heterozygous relatives, and later
    synthesis includes both homozygous and compound-heterozygous cases.
  evidence:
  - reference: PMID:29781517
    reference_title: A homozygous SCN5A mutation associated with atrial standstill and sudden death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous SCN5A mutation, p.V1340L, was identified in the proband and her sister."
    explanation: The affected sisters carried homozygous SCN5A p.V1340L.
  - reference: PMID:41280527
    reference_title: "Clinical presentation and outcomes of patients with biallelic SCN5A variants: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genotype analysis revealed 21 patients with homozygous SCN5A variants (34%) and 40 with compound heterozygous variants (66%)."
    explanation: The systematic review confirms both homozygous and compound-heterozygous SCN5A disease.
- name: Digenic inheritance
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >-
    A family-specific digenic model combines an SCN5A variant with regulatory
    GJA5/connexin-40 polymorphisms. This is not asserted as the inheritance mode
    for all atrial standstill.
  evidence:
  - reference: PMID:16188595
    reference_title: Congenital atrial standstill associated with coinheritance of a novel SCN5A mutation and connexin 40 polymorphisms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incomplete penetrance observed in atrial standstill has been attributed in part to the digenic inheritance of polymorphisms in the atrial-specific gap junction connexin 40 (Cx40) in conjunction with an SCN5A mutation."
    explanation: The study explicitly describes a digenic SCN5A/GJA5 inheritance model.
differential_diagnoses:
- name: Secondary or acquired atrial standstill
  description: >-
    Atrial electrical and mechanical silence can be induced by hypoxia,
    myocardial infarction, amyloidosis, muscular dystrophy, inflammatory atrial
    disease, and quinidine or digitalis toxicity. These cases share the final
    phenotype but do not establish the primary isolated disease modeled here.
  distinguishing_features:
  - A temporally related systemic, infiltrative, inflammatory, ischemic, metabolic, or drug exposure favors secondary standstill.
  - Reversibility after correction of the cause favors a transient secondary form.
  - Family history and pathogenic SCN5A or MYL4 variation favor primary inherited disease.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previous reports showed that AS could be induced by various conditions, including hypoxia, muscular dystrophia, amyloidosis, myocardial infarction, and toxicity from quinidine or digitalis."
    explanation: The review portion of the case report identifies recognized secondary contexts.
- name: Broader inherited atrial or ventricular cardiomyopathy
  description: >-
    EMD/LMNA nuclear-envelope disease, NPPA atrial dilated cardiomyopathy, RYR2
    exon-3 deletion disease, and rare TAF1A or HCN4 reports can include atrial
    standstill as one manifestation. They should be represented under their
    broader gene-specific disease identities unless evidence establishes a
    primary isolated-standstill relationship.
  distinguishing_features:
  - Left ventricular noncompaction, ventricular dilation or fibrosis, skeletal myopathy, contractures, or a broad conduction/ventricular-arrhythmia phenotype favors a wider cardiomyopathy syndrome.
  - A gene-specific diagnosis outside SCN5A or MYL4 should not be promoted to primary isolated atrial standstill from a single case alone.
  evidence:
  - reference: PMID:32755394
    reference_title: "Cardiac Emerinopathy: A Nonsyndromic Nuclear Envelopathy With Increased Risk of Thromboembolic Stroke Due to Progressive Atrial Standstill and Left Ventricular Noncompaction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac emerinopathy is a novel nonsyndromic X-linked progressive atrial standstill associated with LVNC and increased risk of thromboembolism."
    explanation: EMD-associated standstill is explicitly part of a distinct X-linked cardiac emerinopathy with LVNC.
- name: Familial sick sinus syndrome
  disease_term:
    preferred_term: familial sick sinus syndrome
    term:
      id: MONDO:0012061
      label: familial sick sinus syndrome
  description: >-
    Sinus-node dysfunction can cause pauses, bradycardia, and absent P waves
    without diffuse loss of atrial myocardium.
  distinguishing_features:
  - Preserved atrial electrograms, atrial capture, or mechanical A waves argue against complete atrial standstill.
  - Electroanatomic mapping can distinguish sinus-node failure from regional or diffuse atrial inexcitability.
- name: Atrial fibrillation
  disease_term:
    preferred_term: atrial fibrillation
    term:
      id: MONDO:0004981
      label: atrial fibrillation
  description: >-
    Fine atrial fibrillation can obscure discrete P waves and abolish effective
    atrial contraction, but atrial electrical activity remains disorganized
    rather than absent.
  distinguishing_features:
  - Fibrillatory surface or intracardiac activity favors atrial fibrillation.
  - Complete absence of atrial electrograms and failure of high-output atrial capture favor atrial standstill.
diagnosis:
- name: Electrocardiography for absent P waves and escape rhythm
  description: >-
    Surface ECG is the first-line diagnostic test, showing absent P waves and a
    junctional or ventricular escape rhythm rather than organized atrial
    activation. Absent P waves alone are not specific and must be paired with
    evidence of absent atrial mechanical activity and, when needed, atrial
    inexcitability.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  results: Absent P waves with bradycardic escape rhythm support atrial standstill.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of P waves and bradycardia, along with a wide QRS complex, are seen on the electrocardiogram (ECG)."
    explanation: >-
      Supports ECG recognition of absent P waves and bradycardia.
- name: Echocardiography for absent atrial contraction
  description: >-
    Doppler echocardiography assesses mechanical atrial activity and can show
    loss of A waves or atrial enlargement.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  results: Absent transmitral or transtricuspid A waves support loss of atrial mechanical contraction.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No mechanical atrial activity was observed in a Doppler study of the mitral and tricuspid inflow regions"
    explanation: >-
      Supports Doppler echocardiography as a diagnostic method for atrial
      mechanical standstill.
- name: Electrophysiology study and mapping
  description: >-
    Electrophysiology study confirms atrial inexcitability and identifies any
    residual viable atrial myocardium for potential atrial lead placement.
  diagnosis_term:
    preferred_term: clinical cardiac electrophysiologist evaluation
    term:
      id: NCIT:C80414
      label: Cardiac Electrophysiology Study
  results: Failure to capture the atria and low-voltage or scarred regions confirm atrial electrical standstill.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In atrial standstill when pacemaker implantations are thought to be necessary, evaluation by electrophysiological study should be considered before implantation."
    explanation: >-
      Supports EP study before pacing when atrial standstill is suspected.
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only inside the CS did atrial electrical activities remain."
    explanation: >-
      Supports mapping residual viable atrial tissue, including coronary sinus
      activity, before device planning.
- name: Cardiac magnetic resonance imaging for fibrosis and cardiomyopathy assessment
  description: >-
    Cardiac MRI can assess atrial and ventricular morphology, function, and
    delayed enhancement when a broader structural, inflammatory, infiltrative,
    or genetic cardiomyopathy is a concern. A normal MRI does not exclude the
    electrical diagnosis.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Cardiac MRI may identify or help exclude associated cardiomyopathy; normal ventricular morphology and absent delayed enhancement do not exclude atrial standstill.
  evidence:
  - reference: PMID:29387541
    reference_title: Atrial standstill in a pediatric patient with associated caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cardiac magnetic resonance imaging showed normal morphology, function, and no delayed myocardial enhancement."
    explanation: >-
      Supports cardiac MRI as part of the diagnostic workup to evaluate cardiac
      structure, function, and delayed enhancement.
- name: Genetic testing for inherited atrial standstill
  description: >-
    Genetic testing is indicated when familial, early-onset, progressive, or
    syndromic atrial standstill suggests inherited channelopathy or
    cardiomyopathy.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Pathogenic SCN5A or MYL4 variants can support a primary inherited diagnosis; GJA5 findings require modifier-level interpretation, and broader panels can identify distinct cardiomyopathy syndromes.
  evidence:
  - reference: PMID:16188595
    reference_title: Congenital atrial standstill associated with coinheritance of a novel SCN5A mutation and connexin 40 polymorphisms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "underwent genetic screening of SCN5A and atrial-specific genes including Cx40."
    explanation: >-
      Supports genetic testing of SCN5A and atrial conduction genes in familial
      or apparently sporadic atrial standstill.
  - reference: PMID:36435694
    reference_title: "Atrial Standstill in the Pediatric Population: A Multi-Institution Collaboration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing identified SCN5A variants in 13 patients (65%)."
    explanation: The multicenter cohort supports a high diagnostic yield for SCN5A testing in selected pediatric primary cases.
treatments:
- name: Permanent pacemaker implantation
  therapeutic_modality: DEVICE
  description: >-
    Persistent or symptomatic atrial standstill often requires permanent pacing,
    commonly ventricular pacing when atrial capture is absent. Physiologic
    ventricular pacing such as left bundle branch area pacing has been reported
    to reduce pacing dyssynchrony risk in selected cases.
  treatment_term:
    preferred_term: pacemaker implantation
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_phenotypes:
  - preferred_term: Bradycardia
    term:
      id: HP:0001662
      label: Bradycardia
  target_mechanisms:
  - target: Escape Rhythm Bradycardia
    treatment_effect: MODULATES
    description: >-
      Permanent pacing stabilizes ventricular rate when escape rhythm
      bradycardia causes symptoms or pacing dependence.
  evidence:
  - reference: PMID:35425822
    reference_title: "Left Bundle Branch Area Pacing in a Giant Atrium With Atrial Standstill: A Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "symptomatic bradycardia, which requires permanent pacemaker (PPM) implantation."
    explanation: >-
      Supports pacemaker implantation for symptomatic bradycardia in atrial
      standstill.
  - reference: PMID:29387541
    reference_title: Atrial standstill in a pediatric patient with associated caveolin-3 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "lack of right atrial sensing or capture with transvenous atrial lead placement attempts, so a single-chamber ventricular pacemaker was placed."
    explanation: >-
      Supports ventricular pacemaker placement when atrial sensing/capture fails.
  - reference: PMID:36435694
    reference_title: "Atrial Standstill in the Pediatric Population: A Multi-Institution Collaboration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pacemakers were implanted in 18 (90%). Although atrial leads were attempted in 15, only 4 achieved pacing at implantation."
    explanation: The multicenter pediatric cohort documents frequent device need and the difficulty of atrial capture.
- name: Coronary sinus atrial lead placement for partial atrial standstill
  therapeutic_modality: DEVICE
  description: >-
    In partial atrial standstill, EP mapping may identify residual excitable
    tissue in the coronary sinus, allowing atrial lead placement and
    atrioventricular synchronous pacing.
  treatment_term:
    preferred_term: pacemaker implantation
    term:
      id: NCIT:C80434
      label: Pacemaker Placement
  target_mechanisms:
  - target: Atrial Electrical Silence
    treatment_effect: MODULATES
    description: >-
      Coronary sinus lead placement can use residual atrial electrical activity
      when diffuse right atrial capture is not possible.
  evidence:
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pacemaker implantation was necessary owing to symptomatic sick sinus syndrome."
    explanation: >-
      Supports pacemaker implantation as required in the reported partial
      atrial standstill case.
  - reference: PMID:31285994
    reference_title: A case of atrial standstill with the atrial lead of a dual-chamber pacemaker implanted in the coronary sinus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We succeeded in placing the atrial lead with the initial attempt, and we placed the lead of the pacemaker proximally inside the CS"
    explanation: >-
      Supports coronary sinus atrial lead placement when residual activity is
      mapped there.
- name: Anticoagulant therapy for thromboembolic risk
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Anticoagulation is used to reduce thromboembolism from atrial mechanical
    standstill. The strongest disease-specific evidence is a retrospective
    pediatric cohort in which events clustered among patients without effective
    atrial pacing; there is no randomized atrial-standstill trial defining agent,
    threshold, or duration.
  treatment_term:
    preferred_term: anticoagulant agent therapy
    term:
      id: NCIT:C63341
      label: Anticoagulation Therapy
  target_phenotypes:
  - preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
  target_mechanisms:
  - target: Thromboembolic Risk from Atrial Stasis
    treatment_effect: INHIBITS
    description: >-
      Anticoagulant therapy is intended to reduce thromboembolic risk arising
      from atrial paralysis and associated cardiomyopathy.
  evidence:
  - reference: PMID:36435694
    reference_title: "Atrial Standstill in the Pediatric Population: A Multi-Institution Collaboration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients without the capacity for atrial pacing are at risk for thromboembolic events and warrant anticoagulation."
    explanation: >-
      The multicenter cohort directly recommends anticoagulation for patients
      without effective atrial pacing; this remains observational evidence.
  - reference: PMID:36435694
    reference_title: "Atrial Standstill in the Pediatric Population: A Multi-Institution Collaboration."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Of these, none had atrial pacing, 6 were not on anticoagulation, and 1 was on aspirin."
    explanation: >-
      Event clustering supports the rationale but does not estimate comparative
      anticoagulant efficacy or establish a treatment threshold.
discussions:
- discussion_id: disc_atrial_standstill_management_evidence
  prompt: >-
    Which pacing configuration and anticoagulation strategy best prevent
    thromboembolism, pacing-related ventricular dysfunction, and sudden events
    across partial, diffuse, monoallelic, and biallelic atrial standstill?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Permanent pacemaker implantation
  - treatments#Coronary sinus atrial lead placement for partial atrial standstill
  - treatments#Anticoagulant therapy for thromboembolic risk

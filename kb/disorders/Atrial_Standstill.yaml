review_notes: >-
  Evidence and disease-boundary review completed 2026-07-20. SCN5A and MYL4 are
  retained as primary causative genes; GJA5 is retained only as a modifier and
  family-specific digenic contributor. EMD, LMNA, NPPA, RYR2, TAF1A, and HCN4
  reports are not promoted to primary isolated-atrial-standstill genes because
  they describe broader cardiomyopathy/conduction syndromes or remain
  case-level associations. The published CAV3 p.Leu84Pro case is especially
  uncertain: the source states that the variant was reclassified as a variant
  of unknown significance because functional and segregation data were absent.
  The current-trial audit found no atrial-standstill-specific interventional
  study; NCT06166277 was rejected as an automated MeSH false-positive rather
  than represented under clinical_trials. Management therefore remains based
  on observational cohorts, electrophysiologic mapping, and case reports.
notes: >-
  The defining boundary requires both atrial electrical silence and loss of
  mechanical atrial activity. Absent P waves or sinus-node dysfunction alone do
  not establish atrial standstill. Partial standstill can retain localized
  excitable tissue, so electrophysiologic mapping can alter device strategy.

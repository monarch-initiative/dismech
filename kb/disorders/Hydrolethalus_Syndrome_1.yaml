pathophysiology:
- name: Biallelic HYLS1 Variants
  description: >-
    The founder missense variant c.632A>G p.Asp211Gly (NM_145014.2) was
    identified by linkage disequilibrium mapping in Finnish families. Two
    further alleles, p.Arg221Pro and the nonsense p.Arg205*, were found in
    trans with D211G in French fetuses. Mutant HYLS1 mislocalizes in cells.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HYLS1
    term:
      id: hgnc:26558
      label: HYLS1
  genetic_context:
    gene:
      preferred_term: HYLS1
      term:
        id: hgnc:26558
        label: HYLS1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:15843405
    reference_title: "Hydrolethalus syndrome is caused by a missense mutation in a novel gene HYLS1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The identified A to G transition results in a D211G change in the 299 amino acid polypeptide with unknown function."
    explanation: The founder variant.
  - reference: PMID:15843405
    reference_title: "Hydrolethalus syndrome is caused by a missense mutation in a novel gene HYLS1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunostaining of in vitro expressed polypeptides from wild-type (WT) cDNA revealed cytoplasmic staining, whereas mutant polypeptides became localized in distinct nuclear structures, implying a disturbed cellular localization of the mutant protein."
    explanation: The mutant protein is mislocalized.
  downstream:
  - target: Loss of Centriole Distal-End Integrity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40009365
      reference_title: "Centriole structural integrity defects are a crucial feature of hydrolethalus syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The HLS disease mutation reduced the centriole localization of HYLS1 and caused degeneration of the centriole distal end."
      explanation: The disease variant knocked into mice displaces HYLS1 and degrades the centriole end.
  - target: Defective Ciliary Hedgehog Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34162535
      reference_title: "Ciliopathy protein HYLS1 coordinates the biogenesis and signaling of primary cilia by activating the ciliary lipid kinase PIPKIγ."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Consistent with this model of pathogenesis, the HLS mutant HYLS1D211G supports ciliogenesis but not activation of Hh signaling."
      explanation: D211G specifically fails to support Hedgehog activation in mammalian cells.
- name: Loss of Centriole Distal-End Integrity
  description: >-
    CEP120 recruits HYLS1 to the centriole, where HYLS1 recruits inner
    scaffold proteins that stabilize the centriolar microtubule wall. D211G
    weakens the CEP120 interaction, so HYLS1 is displaced and the distal end
    of the centriole degenerates, giving short or broken centrioles in a
    tissue-specific way.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: centriole
    term:
      id: GO:0005814
      label: centriole
  evidence:
  - reference: PMID:38496445
    reference_title: "Centriole structural integrity defects are a crucial feature of Hydrolethalus Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The HLS mutation disrupts the interaction of HYLS1 with CEP120 leading to HYLS1 displacement and degeneration of the centriole distal end."
    explanation: >-
      Preprint version of the knock-in study, cited for the CEP120 interaction
      detail; the peer-reviewed version (PMID:40009365) reports the same
      centriole phenotype.
  downstream:
  - target: Defective Ciliary Gate and Cilium Assembly
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40009365
      reference_title: "Centriole structural integrity defects are a crucial feature of hydrolethalus syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These phenotypes arise from a loss of centriole integrity that causes tissue-specific defects in cilia assembly and function."
      explanation: Loss of centriole integrity leads to defective cilia.
- name: Defective Ciliary Gate and Cilium Assembly
  description: >-
    HYLS1 anchors the centriole at the apical membrane and is required for
    transition fibre formation, transition zone organization and the
    ciliary gate that controls entry of intraflagellar transport particles.
    Loss of these functions reduces primary cilia in some tissues (for
    example the kidney in knock-in mice) but not others.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  biological_processes:
  - preferred_term: cilium assembly
    modifier: DECREASED
    term:
      id: GO:0060271
      label: cilium assembly
  cellular_components:
  - preferred_term: ciliary transition zone
    term:
      id: GO:0035869
      label: ciliary transition zone
  evidence:
  - reference: PMID:19656802
    reference_title: "The hydrolethalus syndrome protein HYLS-1 links core centriole structure to cilia formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A single amino acid change in human HYLS1 leads to a perinatal lethal disorder termed hydrolethalus syndrome, and we show that this mutation impairs HYLS-1 function in ciliogenesis."
    explanation: The disease variant impairs ciliogenesis in C. elegans.
  - reference: PMID:27534274
    reference_title: "The hydrolethalus syndrome protein HYLS-1 regulates formation of the ciliary gate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of HYLS-1 compromises the docking and entry of intraflagellar transport (IFT) particles, ciliary gating for both membrane and soluble proteins, and axoneme assembly."
    explanation: HYLS-1 is needed for the ciliary gate in C. elegans.
  downstream:
  - target: Defective Ciliary Hedgehog Signaling
    causal_link_type: DIRECT
- name: Defective Ciliary Hedgehog Signaling
  description: >-
    In mammalian cells HYLS1 binds and activates the ciliary lipid kinase
    PIPKIgamma, allowing axoneme nucleation and assembly of the NPHP module.
    Without it, beta-arrestin cannot leave the cilium, GPR161 is not removed,
    and Hedgehog signaling cannot be activated. HYLS1 D211G still supports
    ciliogenesis in these cells but not Hedgehog activation.
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  biological_processes:
  - preferred_term: smoothened signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007224
      label: smoothened signaling pathway
  evidence:
  - reference: PMID:34162535
    reference_title: "Ciliopathy protein HYLS1 coordinates the biogenesis and signaling of primary cilia by activating the ciliary lipid kinase PIPKIγ."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "HYLS1 deficiency interrupts the assembly of ciliary NPHP module and agonist-induced ciliary exit of β-arrestin, which, in turn, disturbs the removal of ciliary Gpr161 and activation of hedgehog (Hh) signaling."
    explanation: Mechanism linking HYLS1 loss to failed Hedgehog activation.
  downstream:
  - target: Embryonic Midline Brain, Craniofacial and Limb Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Embryonic Midline Brain, Craniofacial and Limb Malformation
  description: >-
    Ciliary signaling failure during organogenesis is thought to derail
    patterning of the forebrain midline, skull base, face, limbs and lungs,
    producing the fixed malformation pattern of the syndrome. The link from
    the cellular defects to each malformation is inferred from ciliopathy
    biology and the knock-in mouse; it has not been traced organ by organ in
    patients. Fetal tissue also shows an immature, disorganized cortex with
    abnormal radial glia, and neuronal progenitors from patients cycle faster
    and undergo less apoptosis.
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  conforms_to: "ciliopathy_dysfunction#Cerebellar and CNS Malformation"
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  evidence:
  - reference: PMID:40009365
    reference_title: "Centriole structural integrity defects are a crucial feature of hydrolethalus syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that mice harboring the HYLS1 disease mutation die shortly after birth and exhibit developmental defects that recapitulate several manifestations of HLS."
    explanation: The disease allele in mice produces developmental malformations and perinatal death.
  - reference: PMID:19400947
    reference_title: "Unraveling the disease pathogenesis behind lethal hydrolethalus syndrome revealed multiple changes in molecular and cellular level."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These changes were supported by findings in functional cell biology studies, which revealed an increased cell cycle rate and a decreased amount of apoptosis in HLS neuronal progenitor cells."
    explanation: Altered proliferation of patient neuronal progenitors.
  downstream:
  - target: Hydrocephalus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Keyhole-shaped occipital skull defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Postaxial hand polydactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Preaxial foot polydactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Micrognathia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Abnormal lung lobation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cleft palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hypothalamic hamartoma

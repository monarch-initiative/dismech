animal_models:
- name: Hyls1 D226G knock-in mouse
  species: Mus musculus
  genotype: Hyls1 D226G homozygous (orthologous to human D211G)
  description: >-
    Homozygous mice die at or shortly after birth with polydactyly, cleft
    palate, breathing problems and a modestly smaller cortex. Cilia are lost
    in the kidney but not the brain, showing tissue-specific centriole
    instability.
  publication: PMID:40009365
  modeled_mechanisms:
  - target: Loss of Centriole Distal-End Integrity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: The disease allele displaces HYLS1 and degrades the centriole distal end.
    evidence:
    - reference: PMID:40009365
      reference_title: "Centriole structural integrity defects are a crucial feature of hydrolethalus syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The HLS disease mutation reduced the centriole localization of HYLS1 and caused degeneration of the centriole distal end."
      explanation: Centriole defect in the knock-in.
  - target: Embryonic Midline Brain, Craniofacial and Limb Malformation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Perinatal death with polydactyly and cleft palate.
    limitations: >-
      The mouse has only a modest reduction in cortex size and preserved brain
      cilia, without the severe hydrocephalus and midline brain loss of the
      human fetus.
    evidence:
    - reference: PMID:38496445
      reference_title: "Centriole structural integrity defects are a crucial feature of Hydrolethalus Syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hyls1DG/DG pups displayed frequent polydactyly (Figure 1B), a cleft palate (Figure 1C), breathing abnormalities (data not shown), and a modest reduction in cerebral cortex size (Figure S1E/F)."
      explanation: Mouse phenotype, from the preprint version of the study.
- name: C. elegans hyls-1 mutant
  species: Caenorhabditis elegans
  genotype: hyls-1 loss of function
  description: >-
    The worm ortholog is a stable outer centriole wall protein that is not
    needed for centriole assembly but is required to form cilia and the
    ciliary gate.
  publication: PMID:27534274
  modeled_mechanisms:
  - target: Defective Ciliary Gate and Cilium Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Loss of transition fibres, transition zone organization and gating.
    limitations: >-
      Invertebrate sensory cilia; Hedgehog signaling and the human
      malformations cannot be modeled.
    evidence:

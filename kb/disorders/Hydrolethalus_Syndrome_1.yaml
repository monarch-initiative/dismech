name: Hydrolethalus Syndrome 1
creation_date: "2026-10-28T17:30:00Z"
category: Mendelian
synonyms:
- HLS1
- hydrolethalus syndrome
- Salonen-Herva-Norio syndrome
description: >-
  Hydrolethalus syndrome 1 is an autosomal recessive, perinatally lethal
  multiple-malformation ciliopathy caused by biallelic HYLS1 variants. Almost
  all known patients are Finnish and homozygous for the founder missense
  variant c.632A>G p.Asp211Gly (D211G); HYLS1 compound heterozygotes have also
  been reported in France. HYLS1 is a centriole and basal-body protein needed
  to build the primary cilium. The D211G variant weakens HYLS1 binding to
  CEP120 at the centriole, destabilizes the centriole distal end, and blocks
  activation of ciliary Hedgehog signaling. Affected fetuses have severe
  hydrocephalus with absent midline brain structures and an "open-book" brain,
  a keyhole-shaped defect of the occipital skull base, micrognathia,
  polydactyly (postaxial in the hands, preaxial in the feet), defective lung
  lobation, cleft lip or palate and hypothalamic hamartoma. Most are stillborn
  or die shortly after birth; there is no treatment, and care consists of
  prenatal diagnosis, genetic counseling and palliative perinatal care.

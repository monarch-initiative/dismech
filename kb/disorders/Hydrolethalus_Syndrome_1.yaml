diagnosis:
- name: Fetal ultrasound
  description: >-
    Hydrocephaly, polydactyly and skull defects are visible on ultrasound;
    in families with a previous affected fetus the diagnosis can be made as
    early as 11 weeks.
  diagnosis_term:
    preferred_term: fetal ultrasound imaging
    term:
      id: NCIT:C222238
      label: Fetal Ultrasound Imaging
  evidence:
  - reference: PMID:10210131
    reference_title: "Hydrolethalus syndrome in a non-Finnish family: confirmation of the entity and early prenatal diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also demonstrate that, especially in families where there has been a previously affected fetus, echographic diagnosis can be made in the first trimester, as early as the 11th week of gestation."
    explanation: First-trimester ultrasound diagnosis.
- name: HYLS1 genetic testing
  description: >-
    Targeted testing for D211G in Finnish families, and HYLS1 sequencing or
    exome sequencing elsewhere, confirm the diagnosis and allow prenatal or
    preimplantation testing.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34212369
    reference_title: "The first two non-Finnish HYLS1 variants: Expanding the phenotypic spectrum of hydrolethalus syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of HYLS1 mutated cases outside Finland."
    explanation: HYLS1 testing identifies cases outside Finland.
- name: Fetal autopsy
  description: >-
    Autopsy shows the keyhole occipital defect, midline brain anomalies,
    cortical dysplasia, hypothalamic hamartoma, polydactyly and abnormal lung
    lobation.
  diagnosis_term:
    preferred_term: autopsy
    term:
      id: NCIT:C25153
      label: Autopsy
  evidence:
  - reference: PMID:19400947
    reference_title: "Unraveling the disease pathogenesis behind lethal hydrolethalus syndrome revealed multiple changes in molecular and cellular level."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microscopically, immature cerebral cortex, abnormalities in radial glial cells and hypothalamic hamartoma are among key findings in the CNS of HLS fetuses."
    explanation: Autopsy findings.
differential_diagnoses:
- name: Hydrolethalus syndrome 2 (KIF7)
  disease_term:
    preferred_term: hydrolethalus syndrome 2
    term:
      id: MONDO:0013585
      label: hydrolethalus syndrome 2
  description: >-
    The same lethal malformation pattern caused by biallelic KIF7 variants;
    separated by molecular testing.
  distinguishing_features:
  - Biallelic KIF7 rather than HYLS1 variants
  evidence:
  - reference: PMID:21552264
    reference_title: "KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report mutations in KIF7 in individuals with hydrolethalus and acrocallosal syndromes, two multiple malformation disorders with overlapping features that include polydactyly, brain abnormalities and cleft palate."
    explanation: KIF7 causes a second hydrolethalus syndrome.
- name: Meckel syndrome
  disease_term:
    preferred_term: Meckel syndrome
    term:
      id: MONDO:0018921
      label: Meckel syndrome
  description: >-
    Lethal ciliopathy with occipital encephalocele, polydactyly and cystic
    kidneys.
  distinguishing_features:
  - Cystic kidney dysplasia and occipital encephalocele in Meckel syndrome; keyhole occipital defect in HLS
- name: Acrocallosal syndrome
  disease_term:
    preferred_term: acrocallosal syndrome
    term:
      id: MONDO:0008708
      label: acrocallosal syndrome
  description: >-
    Non-lethal KIF7-related ciliopathy with corpus callosum agenesis,
    macrocephaly and polydactyly.
  distinguishing_features:
  - Survival beyond infancy in acrocallosal syndrome
- name: Joubert syndrome
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  description: >-
    Ciliopathy with the molar tooth sign; HYLS1 has been reported as a rare
    Joubert gene.
  distinguishing_features:
  - Molar tooth sign and survival in Joubert syndrome
  evidence:
  - reference: PMID:36580738
    reference_title: "Clinical and genetic spectrum from a prototype of ciliopathy: Joubert syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HYLS1 gene, which commonly causes hydrolethalus syndrome 1, was also associated with Joubert syndrome in one of our patients."
    explanation: HYLS1 variants can give a Joubert phenotype.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  No GeneReviews chapter covers hydrolethalus syndrome. No disease-modifying
  treatment exists; care is prenatal diagnosis, genetic counseling and
  perinatal palliative care, so no treatment block is recorded. Abnormal
  genitalia were reported in the two French compound heterozygous fetuses
  and are not annotated as a general feature. A Romanian case with a
  hydrolethalus-like phenotype but no HYLS1 variant (PMID:22029171) is not
  used here. Fetal fibroblast expression data and raised liver cholesterol
  in HLS fetuses (PMID:19400947) are not wired into the mechanism because
  their link to the malformations is unexplained.

name: TUBB8-related Oocyte Maturation Defect
creation_date: "2026-08-20T17:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte maturation defect 2
  term:
    id: MONDO:0021573
    label: oocyte maturation defect 2
description: >-
  TUBB8-related oocyte maturation defect is the tubulinopathy of a single cell
  type. TUBB8 is a primate-specific beta-tubulin whose expression is restricted
  to the oocyte and the early embryo, where it accounts for almost all of the
  expressed beta-tubulin. That expression pattern is the whole disease: a variant
  in TUBB8 has essentially nowhere else to act, so affected women are otherwise
  healthy and present only with infertility.

  Pathogenic variants cause meiosis I arrest. The oocyte resumes meiosis but
  cannot build a competent meiotic spindle, so it never reaches metaphase II and
  never becomes fertilizable. Mechanistically the variants act at two levels that
  have now been separated: many reduce the alpha/beta-tubulin heterodimer pool by
  disrupting chaperone-dependent folding and assembly, while others - the ones
  that pool reduction did not explain - impair microtubule NUCLEATION by
  weakening the interaction of microtubules with the plus-end tracking protein
  EB1 and with CKAP5/TACC3, with an attenuated Ran-GTP pathway downstream. The
  founding study established dominant-negative effects.

  The disorder is notable for having a candidate rescue. In TUBB8-D417N oocytes
  the spindle loses stable, acetylated microtubules and accumulates HDAC6;
  selective HDAC6 inhibition with tubacin or tubastatin A restores normal spindle
  morphology and drastically recovers the polar-body extrusion rate. This is
  preclinical, applies to a subset of variants, and has not been tested in
  humans - but it is a mechanistically motivated intervention in a disease
  otherwise managed only by oocyte donation.
parents:
- hereditary disease
- female reproductive system disease

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      About 75% of D417N oocytes are arrested at the metaphase I stage
      accompanied by an abnormal spindle (Figure 2E and F).
    explanation: >-
      The conditional D417N mouse model independently supports abnormal spindle
      assembly with metaphase-I arrest.
  downstream:
  - target: Metaphase I Oocyte Maturation Arrest
    description: >-
      Failure to form a competent meiotic spindle prevents completion of
      meiosis I in the maturation-arrest presentation.
  - target: Abnormality of Chromosome Segregation
    causal_link_type: DIRECT
    description: >-
      In the large-polar-body patient cases, abnormal spindle morphology or
      localization accompanied directly demonstrated chromosome-segregation
      errors; this edge is limited to that maturation-stage context.
phenotypes:
- name: Metaphase I Oocyte Maturation Arrest
  description: >-
    Retrieved oocytes resume meiosis but remain at metaphase I, fail to extrude
    the first polar body, and do not reach mature metaphase II. This is one
    presentation of the disorder, not a required upstream event for the
    fertilization, cleavage, or embryo-arrest presentations.
  phenotype_term:
    preferred_term: Metaphase I oocyte maturation arrest
    term:
      id: HP:0031516
      label: Metaphase I oocyte maturation arrest
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven mutations in the primate-specific gene TUBB8 that were
      responsible for oocyte meiosis I arrest in 7 of the 24 families.
    explanation: Directly establishes metaphase-I oocyte arrest in affected families.
  sequelae:
  - target: Female Infertility
    description: Complete maturation arrest prevents use of the patient's oocytes.
- name: Mixed Oocyte Maturation Arrest
  description: >-
    Some affected cycles yielded a mixture of germinal-vesicle and metaphase-I
    oocytes rather than uniform metaphase-I arrest. This mixed presentation is
    retained separately because it was observed in the later cohort.
  phenotype_term:
    preferred_term: Mixed oocyte maturation arrest
    term:
      id: HP:6001356
      label: Mixed oocyte maturation arrest
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The retrieved oocytes had been through germinal vesicle (GV)/metaphase I
      (MI) mixed arrest in families 1-3 and poor fertilization in family 4.
    explanation: Directly supports a mixed GV/MI maturation-arrest presentation.
  sequelae:
  - target: Female Infertility
    description: Insufficient oocyte maturation contributes to recurrent ART failure.
- name: Poor Fertilization
  description: >-
    Affected cycles can retrieve mature oocytes yet show a low fertilization
    proportion. No exact HPO term is asserted here; the preferred term preserves
    the cohort-defined clinical category.
  phenotype_term:
    preferred_term: Poor fertilization
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The retrieved oocytes had been through germinal vesicle (GV)/metaphase I
      (MI) mixed arrest in families 1-3 and poor fertilization in family 4.
    explanation: Directly supports poor fertilization as an alternative presentation.
  sequelae:
  - target: Female Infertility
    description: Poor fertilization contributes to recurrent IVF/ICSI failure.
- name: Zygotic Cleavage Failure
  description: >-
    Fertilized two-pronuclear zygotes may fail before the first cleavage despite
    successful oocyte maturation and fertilization. This phenotype is not routed
    through metaphase-I arrest.
  phenotype_term:
    preferred_term: Zygotic cleavage failure
    term:
      id: HP:0033336
      label: Zygotic cleavage failure
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nearly all the 2PN zygotes were arrested before the first cleavage, even
      after two extra days of cultivation (families 5-13).
    explanation: Direct observation of failure before first zygotic cleavage.
  sequelae:
  - target: Female Infertility
    description: Cleavage failure prevents progression to a transferable embryo.
- name: Embryo Developmental Arrest
  description: >-
    Other affected cycles produce cleaved embryos, sometimes including one or
    two initially usable embryos, but development stops before blastocyst
    formation or pregnancy. This later presentation is modeled independently of
    metaphase-I arrest.
  phenotype_term:
    preferred_term: Embryo developmental arrest
    term:
      id: HP:0020003
      label: Embryo developmental arrest
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the other families presented with embryonic arrest, and although 1-2
      usable embryos were produced, these embryos failed to form blastocysts
      during subsequent culture or establish pregnancy after transfer.
    explanation: Directly supports preimplantation embryo developmental arrest.
  sequelae:
  - target: Female Infertility
    description: Arrest before blastocyst formation prevents ongoing pregnancy.
- name: Formation of Multiple Pronuclei During Fertilization
  description: >-
    Abnormally fertilized zygotes with multiple pronuclei were frequent in
    selected families, indicating a fertilization-stage abnormality rather than
    obligatory maturation arrest.
  phenotype_term:
    preferred_term: Formation of multiple pronuclei during fertilization
    term:
      id: HP:4000008
      label: Formation of multiple pronuclei during fertilization
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also observed various abnormalities in the fertilized zygotes or
      embryos; there were problems such as high proportion of abnormal
      fertilization including 1PN (single pronucleus formation in zygotes) and
      MPN (multi-pronucleus formation in zygotes) (frequency>0.5, in families 1,
      2, 8, 10, 12, 17, and 20), or embryonic arrest, with or without severe
      fragmentation (Fig.2cand Table2).
    explanation: Directly documents multiple-pronuclear fertilization abnormalities.
  sequelae:
  - target: Female Infertility
    description: >-
      Frequent abnormal pronuclear formation contributed to failed fertilization
      in the selected recurrent-IVF/ICSI-failure cohort.
- name: Abnormality of Chromosome Segregation
  description: >-
    In patients who extruded abnormally large polar bodies, chromosome analysis
    showed partial trisomy or monosomy in the polar body and oocyte. The finding
    is case-context evidence and is not generalized to every TUBB8 variant.
  phenotype_term:
    preferred_term: Abnormality of chromosome segregation
    term:
      id: HP:0002916
      label: Abnormality of chromosome segregation
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both the PB and the oocyte exhibited abnormal chromosome compositions,
      including partial chromosome trisomy or monosomy (Fig. 2b).
    explanation: Direct chromosome analysis supports segregation abnormalities.
  sequelae:
  - target: Female Infertility
    description: >-
      Segregation errors accompanied abnormal oocyte maturation in selected
      patients with recurrent IVF/ICSI failure; no independent penetrance is
      inferred.
- name: Female Infertility
  description: >-
    Primary female infertility presents as recurrent IVF/ICSI failure caused by
    one of several oocyte, fertilization, zygotic-cleavage, or early-embryo
    outcomes. The available cohorts are selected for severe
    assisted-reproduction failure and do not provide an unselected population
    frequency.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the 32 individuals from independent and hitherto uncharacterized
      families with primary female infertility underwent two to three failed
      IVF/ICSI attempts in our centre or at other hospitals despite a normal
      menstrual cycle, endocrine level, and karyotype.
    explanation: >-
      Directly documents primary infertility and recurrent assisted-reproduction
      failure in the selected clinical cohort.
genetic:
- name: TUBB8
  association: Causative
  gene_term:
    preferred_term: TUBB8 (beta-tubulin 8)
    term:
      id: hgnc:20773
      label: TUBB8
  notes: >-
    A primate-specific beta-tubulin with no mouse orthologue of equivalent
    expression, which constrains modelling: the founding and mechanistic studies
    express human variants in mouse or human oocytes rather than relying on a
    native murine counterpart. The gene-disease relationship is established, but
    pathogenicity remains variant-specific: many reported alleles lack functional
    confirmation, segregation data can be incomplete, and the same variant can
    be associated with different reproductive phenotypes.
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven mutations in the primate-specific gene TUBB8 that were
      responsible for oocyte meiosis I arrest in 7 of the 24 families.
    explanation: >-
      Founding evidence that TUBB8 mutations cause the disorder, and that it is a
      primate-specific gene.
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it should be noted that the evidence for the pathogenicity of
      theseTUBB8variant has been obtained using a variety of different means,
      including in vitro functional verification, morphological observation of
      the spindle, pedigree segregation analysis, and the genetic detection of
      probands.
    explanation: >-
      Supports conservative, variant-level interpretation rather than treating
      every reported allele as equivalently proven.
diagnosis:
- name: Selected molecular testing for recurrent IVF/ICSI failure
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Exome sequencing or a female-infertility panel containing TUBB8 can be
    considered after recurrent IVF/ICSI failure characterized by oocyte
    maturation arrest, poor fertilization, cleavage failure, or early embryo
    arrest. The cited evidence comes from a selected research cohort and does not
    establish population screening. Results require segregation review and
    variant-level classification; a VUS should not be treated as a confirmed
    diagnosis solely because it occurs in TUBB8.
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole exome sequencing to screen for candidate variants in
      100 infertile female subjects and 100 controls who were able to conceive
      naturally.
    explanation: Establishes WES as the testing method used in the selected cohort.
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, 16 of the reported 102TUBB8variants have been examined in in
      vitro functional assays
    explanation: >-
      Supports the warning that only a minority of the reported spectrum had
      been examined in functional assays.
treatments:
- name: Oocyte donation
  action_category: THERAPEUTIC
  description: >-
    Donor oocytes may be a feasible reproductive option for selected patients
    whose TUBB8 variants are classified as likely pathogenic and whose repeated
    ART failure is attributable to the oocyte. The source offers this as a
    present option rather than reporting a controlled outcome study; it is not a
    treatment of the patient's variant and is not generalized to VUS carriers.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For these patients with the LP variants, donor eggs may be the most
      feasible method at present.
    explanation: >-
      Supports only a qualified recommendation for patients with
      likely-pathogenic variants; it does not provide efficacy estimates.
- name: Genetic counseling after TUBB8 variant detection
  action_category: COUNSELING_INFORMATIONAL
  description: >-
    Counseling should distinguish autosomal-dominant from autosomal-recessive
    observations, review parental and familial segregation, and explain that
    reported TUBB8 variants vary in evidentiary strength and phenotype. A VUS or
    an allele found in a fertile relative should not be used alone to predict
    infertility, embryo outcome, or treatment response. This record does not
    infer incomplete penetrance.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study expands the spectrum of TUBB8 variants, particularly for
      embryonic arrest. Together with the extant knowledge of TUBB8 variants,
      this study provides a foundation for the genetic counselling of female
      infertility.
    explanation: Directly identifies genetic counseling as an intended use.
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We further analysed the correlation between phenotype and genotype, and we
      found 17 variants that caused different phenotypes under the same variant.
    explanation: Supports explicit counseling about variable phenotype by variant.
- name: HDAC6 inhibition to restore spindle microtubule acetylation (preclinical)
  action_category: THERAPEUTIC
  description: >-
    Model-only, variant-limited rescue. Cultured oocytes from the conditional
    human-TUBB8-D417N mouse and mouse oocytes acutely expressing selected human
    TUBB8 variants were treated with tubacin or tubastatin A. Spindle morphology,
    microtubule acetylation, and polar-body extrusion improved in selected model
    conditions. No affected patient received an HDAC6 inhibitor, and the study
    provides no human efficacy, safety, dosing, pregnancy, or live-birth data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tubastatin A
      term:
        id: CHEBI:94186
        label: tubastatin A
    - preferred_term: Histone Deacetylase Inhibitor
      term:
        id: NCIT:C1946
        label: Histone Deacetylase Inhibitor
  target_mechanisms:
  - target: Loss of Stable Acetylated Spindle Microtubules in D417N Models
    treatment_effect: RESTORES
    description: >-
      Ex vivo HDAC6 inhibition restores acetylation and spindle readouts in the
      D417N mouse-oocyte model; this target link does not assert a human effect.
    evidence:
    - reference: PMID:39834092
      reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        More importantly, selective inhibition of HDAC6 by culturing TUBB8-D417N
        oocytes with Tubacin or Tubastatin A showed morphologically normal
        spindle and drastically recovered polar-body extrusion rate.
      explanation: >-
        Reports structural and polar-body-extrusion rescue in cultured model
        oocytes.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These rescue results shed light on the strategy to treat meiotic defects in
      a certain group of TUBB8 mutated patients.
    explanation: >-
      The authors' own subset language is retained while the lack of patient
      treatment data is made explicit.
  notes: >-
    Preclinical mouse-oocyte evidence only as of 2026-08; no human efficacy or
    clinical recommendation is asserted.
animal_models:
- name: Oocyte-specific human TUBB8-D417N conditional knock-in mouse
  species: Mouse
  genotype: Conditional oocyte-specific human TUBB8 p.D417N knock-in driven by Gdf9-Cre
  genes:
  - preferred_term: TUBB8
    term:
      id: hgnc:20773
      label: TUBB8
  publication: PMID:39834092
  description: >-
    A Cre-lox conditional model expresses human TUBB8-D417N in mouse oocytes.
    It reproduces abnormal spindle assembly, reduced polar-body extrusion,
    altered EB1/CKAP5/TACC3 and Ran-GTP readouts, and reduced tubulin acetylation.
    Because TUBB8 is primate-specific and the host oocyte and tubulin-isotype
    environment are murine, the model is assigned low translational fidelity.
  modeled_mechanisms:
  - target: D417N Model-Defined Reduction of TUBB8-EB1 Binding
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The conditional model reproduces reduced EB1 signal and D417N-associated
      spindle and maturation readouts studied in the paper.
    limitations: >-
      Human TUBB8 is conditionally introduced into a mouse oocyte, which lacks an
      endogenous equivalent expression program; only D417N is modeled and no
      patient oocyte establishes that the full regulator chain occurs in humans.
    evidence:
    - reference: PMID:39834092
      reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Therefore, we generated oocyte-specific expressed wild-type TUBB8-WT
        flox/flox; Gdf9-Cre (hereafter referred to as WT) and TUBB8-D417N
        flox/flox; Gdf9-Cre (hereafter referred to as D417N) mice (Figures 2A and
        S1E).
      explanation: Establishes the conditional human-TUBB8 mouse model.
  - target: D417N Model-Defined CKAP5/TACC3 Mislocalization and Impaired Microtubule Nucleation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The conditional model reproduces CKAP5/TACC3 mislocalization and impaired
      microtubule-nucleation readouts in D417N oocytes.
    limitations: >-
      The engineered mouse-oocyte context may not reproduce regulator abundance,
      localization, or nucleation in endogenous heterozygous patient oocytes.
  - target: D417N Model-Defined Attenuation of Ran-GTP Spindle-Assembly Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The conditional model reproduces the altered Ran-GTP, TPX2, and NuMA
      spindle-assembly readouts studied in D417N oocytes.
    limitations: >-
      The engineered mouse-oocyte context does not establish that this route is
      active in endogenous heterozygous patient oocytes.
  - target: Loss of Stable Acetylated Spindle Microtubules in D417N Models
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The D417N mouse oocytes show reduced microtubule acetylation and increased
      HDAC6, enabling ex vivo rescue experiments.
    limitations: >-
      Acetylation and HDAC6 were measured in the engineered mouse-oocyte system;
      neither is established as a patient biomarker or validated human target.
    evidence:
    - reference: PMID:39834092
      reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Stable microtubule was largely abolished on the spindle of TUBB8-D417N
        oocytes, reflected by reduced tubulin acetylation and accumulated HDAC6.
      explanation: Supports the model-specific acetylation and HDAC6 phenotype.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      About 75% of D417N oocytes are arrested at the metaphase I stage
      accompanied by an abnormal spindle (Figure 2E and F).
    explanation: Establishes the central maturation and spindle phenotype.
experimental_models:
- name: Ex vivo human GV-oocyte TUBB8 missense mRNA microinjection
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Donated human germinal-vesicle oocytes cultured ex vivo
  culture_system: Acute mRNA microinjection followed by meiotic maturation culture
  publication: PMID:26789871
  description: >-
    Human GV oocytes were microinjected with S176L or D417N TUBB8 RNA and showed
    severely impaired spindle assembly. The relevant human cell type is used,
    but acute mRNA overexpression is not an endogenous heterozygous genotype and
    the assay covers only two variants.
  modeled_mechanisms:
  - target: Defective Oocyte Meiotic Spindle Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The ex vivo assay reproduces defective spindle assembly in human oocytes.
    limitations: >-
      Acute RNA microinjection can produce nonphysiologic expression; the oocytes
      are outside their ovarian context, and maturation or pregnancy outcomes
      cannot be assessed.
    evidence:
    - reference: PMID:26789871
      reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, to further validate the effects of the mutation, we microinjected
        TUBB8 S176L and D417N mutant RNAs into human GV oocytes. Consistent with
        the phenotypes observed in mouse oocytes, we found severely or completely
        impaired spindle assembly (Figure 4C).
      explanation: Directly supports the ex vivo human-oocyte spindle readout.
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, to further validate the effects of the mutation, we microinjected
      TUBB8 S176L and D417N mutant RNAs into human GV oocytes.
    explanation: Establishes the experimental system.
- name: Ex vivo mouse-oocyte TUBB8 expression and HDAC6-inhibitor rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Mouse germinal-vesicle oocytes cultured ex vivo
  culture_system: Human TUBB8 mRNA microinjection or conditional-model oocytes with inhibitor exposure
  publication: PMID:39834092
  description: >-
    Mouse GV oocytes expressing human TUBB8 variants, including oocytes from the
    conditional D417N model, were cultured with selective HDAC6 inhibitors. The
    system measures spindle morphology, acetylation, and polar-body extrusion but
    does not test treatment in a patient or an intact reproductive cycle.
  modeled_mechanisms:
  - target: Loss of Stable Acetylated Spindle Microtubules in D417N Models
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The ex vivo mouse-oocyte assay reproduces the acetylation deficit and
      demonstrates rescue of selected cellular readouts after HDAC6 inhibition.
    limitations: >-
      Species context, acute expression for some variants, ex vivo culture, and
      absence of fertilization, embryo-development, pregnancy, and safety
      endpoints preclude human efficacy inference.
    evidence:
    - reference: PMID:39834092
      reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        More importantly, selective inhibition of HDAC6 by culturing TUBB8-D417N
        oocytes with Tubacin or Tubastatin A showed morphologically normal
        spindle and drastically recovered polar-body extrusion rate.
      explanation: Supports rescue only in cultured model oocytes.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Although our study focused on treating oocytes carrying missense variants
      rather than directly treating patients, upon further investigation of
      safety and efficacy, it may be plausible to administer treatment to
      patients using liposomes containing HDAC6 inhibitors as potential
      therapeutic interventions in the future.

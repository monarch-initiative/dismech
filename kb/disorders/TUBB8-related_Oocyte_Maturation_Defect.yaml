    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our findings demonstrated a significant decrease in EB1 expression within
      D417N oocytes compared to WT, consistent with our previous observations
      from in vitro microinjection (Figure 2J and K).
    explanation: >-
      Immunofluorescence in the conditional mouse model supports reduced EB1 at
      microtubule plus ends in D417N oocytes.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In addition, co-immunoprecipitation assays investigating the TUBB8-EB1
      interaction demonstrated a sharp decline in their affinity caused by the
      D417N missense variant (Figure 2L).
    explanation: >-
      Biochemical evidence for the D417N-specific reduction in EB1 affinity.

- name: Oocyte Meiosis I Arrest
  biological_scale: CELLULAR
  description: >-
    The disease-defining event. Oocytes resume meiosis but arrest at metaphase I,
    failing to extrude the first polar body and never reaching the fertilizable
    metaphase II state. Because the arrest is in the oocyte itself, it is not
    bypassed by intracytoplasmic sperm injection.

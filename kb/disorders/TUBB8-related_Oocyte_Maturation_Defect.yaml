- name: Reduced Alpha/Beta-Tubulin Heterodimer Yield
  biological_scale: MOLECULAR
  description: >-
    Biochemical assays of the founding missense-variant set showed a spectrum of
    folding and heterodimer-assembly defects, with most variants diminishing the
    yield of assembled alpha/beta-tubulin heterodimer. D417N is explicitly kept
    outside this route because its folding kinetics and heterodimer yield were
    comparable to wild type in the later biochemical study.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: tubulin heterodimer assembly
    term:
      id: GO:0007021
      label: tubulin complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data reveal a range of heterodimer assembly defects caused by the
      TUBB8 mutations, in some cases attributable to changes in the equilibria
      that govern the de novo assembly of heterodimers 24, in others pointing to
      misfolding, and in most cases leading to a diminished yield of assembled
      heterodimers.
    explanation: >-
      Biochemical evidence for variant-dependent folding and heterodimer-yield
      defects.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Our data revealed no differences in translational efficiency in vitro, the
      kinetics of folding, or the yield of α/β-heterodimer formation compared to
      the wild type (Figure 2H and I).
    explanation: >-
      D417N is a demonstrated exception and must not be routed through reduced
      heterodimer yield.
  downstream:
  - target: Defective Oocyte Meiotic Spindle Assembly
    description: >-
      A reduced functional heterodimer pool can compromise construction of the
      meiotic spindle.
- name: D417N Model-Defined Reduction of TUBB8-EB1 Binding
  biological_scale: MOLECULAR
  description: >-
    In conditional human-TUBB8-D417N mouse oocytes and complementary ex vivo or
    biochemical systems, D417N reduced EB1 abundance at microtubule plus ends and
    reduced TUBB8-EB1 affinity. This interaction defect is model-defined and
    variant-specific; it is not presented as demonstrated in patient oocytes or
    as a shared route for all TUBB8 variants.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Human TUBB8 p.D417N expressed in model systems; functional conclusions are
      specific to this assayed missense variant and experimental context.

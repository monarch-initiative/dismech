inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    The founding four-generation family showed autosomal-dominant transmission,
    and additional affected individuals carried paternally inherited or de novo
    heterozygous missense variants. Dominant-negative function is asserted only
    for the assayed heterozygous missense variants, not for every reported TUBB8
    variant. No penetrance value is assigned.
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We sequenced the exomes of five members of a four-generation family, three
      of whom had infertility due to oocyte meiosis I arrest.
    explanation: >-
      The multigenerational family established autosomal-dominant transmission.
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations interfere with human oocyte maturation and are either
      inherited paternally as an autosomal dominant or arise de novo (Figure 1
      and Table 1).
    explanation: >-
      The founding report explicitly describes paternal autosomal-dominant and
      de novo occurrence.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A selected infertility cohort reported five families with recessive
    inheritance: three with homozygous variants and two with
    compound-heterozygous variants. This clinical observation supports a
    recessive mode, but does not by itself assign a common functional impact to
    the biallelic alleles. No penetrance value is assigned.
  evidence:
  - reference: PMID:33970371
    reference_title: The comprehensive variant and phenotypic spectrum of TUBB8 in female infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five families showed a recessive inheritance pattern, including families
      6, 9, and 10 that were identified with a homozygous variant and families 1
      and 7 that were identified with compound heterozygous variant (Fig.1and
      Table1).
    explanation: >-
      Directly supports separate homozygous and compound-heterozygous recessive
      observations.

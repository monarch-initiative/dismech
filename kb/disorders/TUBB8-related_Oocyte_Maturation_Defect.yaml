  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Alpha/Beta-Tubulin Heterodimer Yield
  - pathophysiology#D417N Model-Defined CKAP5/TACC3 Mislocalization and Impaired Microtubule Nucleation
  - treatments#HDAC6 inhibition to restore spindle microtubule acetylation (preclinical)
  rationale: >-
    This gap is unusually actionable, because the answer decides who a candidate
    therapy could help. The mechanistic study is explicit that dimer-pool
    reduction is the main etiology but leaves large numbers of variants
    unexplained, and it resolves three of those unexplained variants as nucleation
    defects acting through EB1 and CKAP5/TACC3. The rescue was demonstrated for
    one of them, D417N. Whether HDAC6 inhibition restores spindle assembly in a
    variant whose primary problem is too little heterodimer - rather than a
    heterodimer that cannot nucleate properly - is untested, and there is reason
    to doubt it: stabilizing existing microtubules does not create tubulin that
    was never folded. Stratifying the reported TUBB8 variant spectrum by mechanism
    class, then testing the rescue in a pool-reduction variant, would establish
    whether this is a therapy for a subset or for the disorder.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The main etiology is the dramatic reduction of tubulin α/β dimer, but still
      large numbers of variants remain unexplained.
    explanation: >-
      Establishes that the variant spectrum splits by mechanism and that the
      split is not yet mapped.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These rescue results shed light on the strategy to treat meiotic defects in
      a certain group of TUBB8 mutated patients.
    explanation: >-
      The rescue is scoped to a group of patients, which is exactly the group
      this gap asks to define.
- discussion_id: gap_tubb8_human_model_fidelity
  prompt: >-
    Do the conditional human-TUBB8-D417N mouse and acute oocyte-expression
    systems reproduce endogenous heterozygous human disease well enough to
    transfer the EB1/CKAP5/TACC3, Ran-GTP, acetylation, or HDAC6-rescue findings
    to patient oocytes?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Oocyte-specific human TUBB8-D417N conditional knock-in mouse
  - experimental_models#Ex vivo human GV-oocyte TUBB8 missense mRNA microinjection
  - experimental_models#Ex vivo mouse-oocyte TUBB8 expression and HDAC6-inhibitor rescue
  - experimental_models#Cell-free TUBB8 heterodimer folding and assembly assay
  - pathophysiology#D417N Model-Defined Reduction of TUBB8-EB1 Binding
  - pathophysiology#D417N Model-Defined CKAP5/TACC3 Mislocalization and Impaired Microtubule Nucleation
  - pathophysiology#D417N Model-Defined Attenuation of Ran-GTP Spindle-Assembly Signaling
  rationale: >-
    TUBB8 is primate-specific, yet the most detailed D417N pathway and every
    HDAC6-rescue result come from engineered mouse oocytes or other experimental
    systems. Human GV-oocyte microinjection uses the relevant cell type but is an
    acute overexpression assay, not an endogenous patient genotype. These models
    establish testable proximal mechanisms while leaving human target validity,
    safety, embryo competence, pregnancy, and live-birth benefit unresolved.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To elucidate the deleterious effect of the human TUBB8 pathogenic variants
      in vivo, we generated oocyte-specific knock-in mouse models that mimic the
      equivalent human missense variants.
    explanation: Establishes that the detailed in vivo route comes from a mouse model.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although our study focused on treating oocytes carrying missense variants
      rather than directly treating patients, upon further investigation of
      safety and efficacy, it may be plausible to administer treatment to
      patients using liposomes containing HDAC6 inhibitors as potential
      therapeutic interventions in the future.
    explanation: Explicitly distinguishes model-oocyte rescue from patient treatment.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

  Deliberately NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure: the cited cohorts concern
  female reproductive phenotypes rather than a neural tubulinopathy.

  DOMINANT_NEGATIVE is used only on the functionally assayed heterozygous
  missense trigger. Clinically observed unassayed heterozygous, homozygous, and
  compound-heterozygous triggers have no inferred functional impact category.

  Metaphase-I or mixed maturation arrest, poor fertilization, zygotic cleavage
  failure, and embryo developmental arrest are alternative presentations. The
  latter three are never routed through metaphase-I arrest.

  EB1/CKAP5/TACC3, Ran-GTP, acetylation, and HDAC6 claims are model-defined. The
  HDAC6-inhibition rescue has no human efficacy evidence. All evidence snippets
  are quoted from the three existing full-text reference caches; no new reference
  was fetched.

      label: meiotic spindle organization
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      First, we observed a significant depletion of the EB1 signal upon
      microinjection of mutated TUBB8 mRNA (including R262Q, M300I, and D417N
      missense variants), indicating disruption of microtubule nucleation caused
      by these introduced TUBB8 missense variants.
    explanation: >-
      Identifies impaired nucleation via EB1 depletion as a mechanism distinct
      from dimer-pool reduction.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It also harmed the interaction between microtubules and CKAP5/TACC3, which
      are crucial for initiating microtubule nucleation.
    explanation: >-
      Names the second nucleation-initiating interaction that the variant
      disrupts.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stable microtubule was largely abolished on the spindle of TUBB8-D417N
      oocytes, reflected by reduced tubulin acetylation and accumulated HDAC6.
    explanation: >-
      Establishes loss of stable acetylated microtubules and HDAC6 accumulation,
      the specific defect the rescue targets.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      The main etiology is the dramatic reduction of tubulin α/β dimer, but still
      large numbers of variants remain unexplained.
    explanation: >-
      States both the dominant mechanism and that it leaves many variants
      unexplained, which is why this node curates two routes.
  downstream:
  - target: Oocyte Meiosis I Arrest
    description: >-
      Without a competent spindle the oocyte cannot complete meiosis I or extrude

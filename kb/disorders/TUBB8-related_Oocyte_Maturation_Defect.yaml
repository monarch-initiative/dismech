pathophysiology:
- name: Altered Oocyte-Restricted Beta-Tubulin (TUBB8) Function
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Missense variants alter TUBB8, a primate-specific beta-tubulin expressed
    almost exclusively in oocytes and the early embryo, where it constitutes
    nearly all expressed beta-tubulin. There is no redundancy to fall back on,
    which is why a heterozygous missense variant is sufficient and why the
    phenotype is confined to the oocyte. The variants affect chaperone-dependent
    folding and assembly of the alpha/beta-tubulin heterodimer, disrupt
    microtubule behaviour in cultured cells, and alter microtubule dynamics in
    vivo. The founding study characterises the effects as dominant-negative.
  genetic_context:
    functional_impact_category: DOMINANT_NEGATIVE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    allele_type: missense
    description: >-
      Heterozygous missense variants acting dominant-negatively - stated directly
      by the founding study, and consistent with the mechanism: a mutant subunit
      that folds poorly or incorporates aberrantly degrades a beta-tubulin pool
      that has no other isotype to compensate it in this cell type.

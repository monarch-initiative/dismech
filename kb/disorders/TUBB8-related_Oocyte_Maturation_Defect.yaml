genetic:
- name: TUBB8
  association: Causative
  gene_term:
    preferred_term: TUBB8 (beta-tubulin 8)
    term:
      id: hgnc:20773
      label: TUBB8
  notes: >-
    A primate-specific beta-tubulin with no mouse orthologue of equivalent
    expression, which constrains modelling: the founding and mechanistic studies
    express human variants in mouse or human oocytes rather than relying on a
    native murine counterpart.
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven mutations in the primate-specific gene TUBB8 that were
      responsible for oocyte meiosis I arrest in 7 of the 24 families.
    explanation: >-
      Founding evidence that TUBB8 mutations cause the disorder, and that it is a
      primate-specific gene.
treatments:
- name: Oocyte donation
  description: >-
    Because the defect is intrinsic to the oocyte and is not bypassed by
    fertilization technique, donor oocytes are the established route to
    pregnancy. This is a workaround, not a treatment of the disorder.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cause catastrophic spindle-assembly defects and maturation arrest on
      expression in mouse and human oocytes
    explanation: >-
      The arrest is intrinsic to the oocyte, which is the rationale for donor
      oocytes rather than a fertilization-side intervention.
- name: HDAC6 inhibition to restore spindle microtubule acetylation (preclinical)
  description: >-
    A mechanistically targeted rescue, preclinical and variant-specific. In
    TUBB8-D417N oocytes the spindle loses stable acetylated microtubules and
    accumulates HDAC6, the deacetylase that removes the stabilizing modification.
    Culturing those oocytes with the selective HDAC6 inhibitors tubacin or
    tubastatin A restored morphologically normal spindles and drastically
    recovered the polar-body extrusion rate - meaning the arrest itself was
    relieved, not merely a marker. This has not been tested in humans, and the
    authors are explicit that it addresses a certain group of TUBB8-mutated
    patients rather than all of them.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Microtubule Nucleation and Spindle Assembly
    treatment_effect: RESTORES
    description: >-
      Inhibiting HDAC6 raises tubulin acetylation, restoring the stable spindle
      microtubule population that the variant depletes.
    evidence:
    - reference: PMID:39834092
      reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        More importantly, selective inhibition of HDAC6 by culturing TUBB8-D417N
        oocytes with Tubacin or Tubastatin A showed morphologically normal
        spindle and drastically recovered polar-body extrusion rate.
      explanation: >-
        Reports both the structural and the functional rescue produced by acting
        on this node.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These rescue results shed light on the strategy to treat meiotic defects in
      a certain group of TUBB8 mutated patients.
    explanation: >-
      The authors' own scoping - a certain group of patients - recorded so the
      rescue is not over-generalized.
  notes: >-
    Preclinical, in oocytes, and variant-specific as of 2026-08. No human trial.
discussions:
- discussion_id: gap_tubb8_variant_stratification_for_rescue
  prompt: >-
    Which TUBB8 variants act by reducing the tubulin dimer pool and which by
    impairing nucleation, and does the HDAC6-inhibition rescue work only for the
    latter?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Microtubule Nucleation and Spindle Assembly
  rationale: >-
    This gap is unusually actionable, because the answer decides who a candidate
    therapy could help. The mechanistic study is explicit that dimer-pool
    reduction is the main etiology but leaves large numbers of variants
    unexplained, and it resolves three of those unexplained variants as nucleation
    defects acting through EB1 and CKAP5/TACC3. The rescue was demonstrated for
    one of them, D417N. Whether HDAC6 inhibition restores spindle assembly in a
    variant whose primary problem is too little heterodimer - rather than a
    heterodimer that cannot nucleate properly - is untested, and there is reason
    to doubt it: stabilizing existing microtubules does not create tubulin that
    was never folded. Stratifying the reported TUBB8 variant spectrum by mechanism
    class, then testing the rescue in a pool-reduction variant, would establish
    whether this is a therapy for a subset or for the disorder.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The main etiology is the dramatic reduction of tubulin α/β dimer, but still
      large numbers of variants remain unexplained.
    explanation: >-
      Establishes that the variant spectrum splits by mechanism and that the
      split is not yet mapped.
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      These rescue results shed light on the strategy to treat meiotic defects in
      a certain group of TUBB8 mutated patients.
    explanation: >-
      The rescue is scoped to a group of patients, which is exactly the group
      this gap asks to define.
notes: >-
  Created 2026-08-20 while closing out tubulin-family disease coverage following
  docs/reports/tubulinopathies-grouping-review-2026-08-20.md.

  Deliberately NOT a member of the Tubulinopathies grouping and NOT conformed to
  microtubule_dependent_neuronal_migration_failure: there is no neural phenotype
  at all. TUBB8 is included in the knowledge base because it is a tubulin isotype
  disease, and it is arguably the cleanest one - a gene expressed in a single
  cell type, producing a phenotype confined to that cell type, with no
  compensating isotype to blur the mechanism.

  functional_impact_category is DOMINANT_NEGATIVE, stated directly by the
  founding study rather than inferred.

  The HDAC6-inhibition rescue is preclinical and variant-specific; its status is
  stated in the treatment description, its notes, and the linked discussion.

  All evidence snippets are quoted from cached abstracts.

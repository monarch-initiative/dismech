name: TUBB8-related Oocyte Maturation Defect
creation_date: "2026-08-20T17:00:00Z"
updated_date: "2026-08-25T21:23:22Z"
category: Mendelian
disease_term:
  preferred_term: oocyte maturation defect 2
  term:
    id: MONDO:0021573
    label: oocyte maturation defect 2
description: >-
  TUBB8-related oocyte maturation defect is a female-infertility disorder caused
  by variants in the primate-specific beta-tubulin isotype expressed
  predominantly in oocytes and early embryos. Its clinical spectrum is broader
  than metaphase-I arrest alone: selected IVF/ICSI cohorts include metaphase-I or
  mixed germinal-vesicle/metaphase-I maturation arrest, poor fertilization,
  zygotic cleavage failure, and preimplantation embryo arrest. These are
  alternative presentations; fertilization, cleavage, and embryo arrest are not
  modeled as consequences of metaphase-I arrest.

  Autosomal-dominant disease is supported by paternally transmitted and de novo
  heterozygous missense variants. Dominant-negative function is restricted here
  to the heterozygous missense variants tested in functional assays. A later
  cohort also reported homozygous and compound-heterozygous genotypes, supporting
  an autosomal-recessive mode without establishing one shared molecular effect
  for all biallelic alleles. Maternally inherited variants and variants observed
  in fertile relatives make variant-level interpretation and counseling
  important; this entry does not infer incomplete penetrance from those
  observations.

  Functional work supports variant-dependent disruption of tubulin folding,
  heterodimer yield, microtubule behavior, and meiotic spindle assembly. The
  EB1-CKAP5/TACC3, Ran-GTP, tubulin-acetylation, and HDAC6 routes were defined in
  systems expressing human TUBB8-D417N, including a conditional mouse model, and
  are therefore recorded as model-derived rather than established human
  mechanisms. HDAC6 inhibition rescued selected mutant mouse oocytes ex vivo but
  has no demonstrated efficacy or safety in affected patients.
parents:
- hereditary disease
- female reproductive system disease

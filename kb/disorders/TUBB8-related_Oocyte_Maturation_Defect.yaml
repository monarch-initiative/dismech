  - reference: PMID:26789871
    reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutations affect chaperone-dependent folding and assembly of the α/β-

- name: Cell-free TUBB8 heterodimer folding and assembly assay
  experimental_model_type: OTHER
  culture_system: In vitro translation and non-denaturing gel analysis
  publication: PMID:26789871
  description: >-
    Cell-free translation and tubulin-chaperone assembly assays measure whether a
    tested TUBB8 variant changes folding kinetics or assembled heterodimer yield.
    The assay separates reduced-yield variants from D417N but cannot reproduce
    oocyte spindle architecture or clinical outcome.
  modeled_mechanisms:
  - target: Reduced Alpha/Beta-Tubulin Heterodimer Yield
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The assay directly measures variant-specific heterodimer formation.
    limitations: >-
      A cell-free reaction omits oocyte-specific protein abundance, spatial
      organization, microtubule-associated proteins, spindle architecture, and
      developmental outcomes.
    evidence:
    - reference: PMID:26789871
      reference_title: Mutations in TUBB8 and Human Oocyte Meiotic Arrest.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These data reveal a range of heterodimer assembly defects caused by the
        TUBB8 mutations, in some cases attributable to changes in the equilibria
        that govern the de novo assembly of heterodimers 24, in others pointing
        to misfolding, and in most cases leading to a diminished yield of
        assembled heterodimers.
      explanation: Direct biochemical measurement of heterodimer assembly.
  evidence:
  - reference: PMID:39834092
    reference_title: "Pathogenic variants of TUBB8 cause oocyte spindle defects by disrupting with EB1/CAKP5 interactions and potential treatment targeting microtubule acetylation through HDAC6 inhibition."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Our data revealed no differences in translational efficiency in vitro, the
      kinetics of folding, or the yield of α/β-heterodimer formation compared to
      the wild type (Figure 2H and I).
    explanation: Demonstrates that D417N does not belong in the reduced-yield route.

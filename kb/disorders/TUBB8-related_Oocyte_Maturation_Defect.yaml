- name: Impaired Microtubule Nucleation and Spindle Assembly
  biological_scale: CELLULAR
  description: >-
    The cellular failure, and the level at which the disease has recently been
    resolved further. Reduction of the tubulin dimer pool is the main etiology
    but does not explain many variants. For those, the defect is in nucleation:
    mutant TUBB8 depletes the EB1 plus-end signal, diminishes the affinity of EB1
    for microtubules, and impairs the microtubule interaction with CKAP5/TACC3 -
    both required to initiate nucleation - with an attenuated Ran-GTP pathway
    downstream. The spindle that results is not merely small but unstable:
    acetylated, stable microtubules are largely abolished and HDAC6 accumulates.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  biological_processes:
  - preferred_term: microtubule nucleation
    term:
      id: GO:0007020
      label: microtubule nucleation
    modifier: DECREASED
  - preferred_term: meiotic spindle organization
    term:

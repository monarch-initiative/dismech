- name: Female Infertility
  description: >-
    Primary infertility due to oocyte maturation arrest. Affected women are
    otherwise healthy - the restricted expression of TUBB8 means there is no
    somatic phenotype - and the infertility is not overcome by standard assisted
    reproduction, because the defect is in the oocyte rather than in
    fertilization.
  phenotype_term:

name: Female_Infertility_Due_To_Zona_Pellucida_Defect
creation_date: '2026-10-14T00:00:00Z'
description: >-
  Female infertility due to zona pellucida defect (also designated oocyte maturation
  defect 1, OOMD1; OMIM:615774) is a Mendelian disorder of female gamete development
  and extracellular matrix assembly caused by pathogenic variants in ZP1, which encodes
  zona pellucida glycoprotein 1, the intermolecular disulfide-forming cross-linker of
  human zona pellucida (ZP) filaments. Affected women have normal female karyotypes,
  normal secondary sexual development, normal menstrual cycles, and normal ovarian
  reserve and hormone profiles, yet present with primary female infertility revealed
  during assisted reproductive technology (ART) cycles. Loss-of-function or dominant-negative
  ZP1 variants impair ZP1 homodimerization, intracellular transport, secretion, or
  heteromeric assembly with ZP2, ZP3, and ZP4, resulting in a clinical spectrum ranging
  from retrieval of viable metaphase II oocytes with a thin or completely absent zona
  pellucida that fail conventional in vitro fertilization (IVF), to intra-follicular
  cumulus-oocyte complex disorganization, fragile or degenerated atretic oocytes, and
  genuine empty follicle syndrome (GEFS) in which no oocytes are recovered despite normal
  follicular growth and steroidogenesis. While conventional IVF fails because the absent
  or defective ZP cannot support normal sperm-egg interaction, intracytoplasmic sperm
  injection (ICSI) of viable ZP-free metaphase II oocytes can bypass the zona pellucida
  barrier and achieve blastocyst development and live birth in a subset of patients.
category: Mendelian

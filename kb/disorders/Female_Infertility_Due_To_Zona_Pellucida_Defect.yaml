  downstream:
  - target: Impaired Cumulus-Oocyte Complex Organization and Granulosa-Oocyte Crosstalk
    description: >-
      Loss of a structurally intact zona pellucida matrix compromises physical
      support and bidirectional signaling between the growing oocyte and surrounding
      cumulus granulosa cells during the preantral-to-antral follicle transition.
    evidence:
    - reference: PMID:31734689
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunohistochemistry using ovarian serial sections demonstrated that all
        preantral follicles had normal architecture, but with a thin ZP, lacking ZP1,
        surrounding the growing oocytes. The antral follicles were also defective in
        normal cumulus-oocyte complex organisation, leading us to speculate that the
        lack of ZP1 might lead to oocyte degeneration or increased fragility of the
        oocyte during follicular puncture, ultimately resulting in EFS.
      explanation: >-
        Serial ovarian histopathology from an affected patient links the thin,
        ZP1-deficient zona pellucida in preantral follicles to defective
        cumulus-oocyte complex organization in antral follicles.
  - target: Defective Sperm-Zona Pellucida Recognition and Fertilization Failure
    description: >-
      Absence or severe malformation of the zona pellucida deprives oocytes of the
      species-specific sperm-binding extracellular coat required for conventional
      sperm-oocyte interaction and fertilization.
    evidence:
    - reference: PMID:24670168
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Our data suggest that the mutation prevents the formation of the zona
        pellucida around ova: all observed oocytes from affected family members
        lacked a zona pellucida when examined with light microscopy
      explanation: >-
        Directly demonstrates that the ZP1 mutation prevents formation of the
        extracellular zona pellucida matrix around human ova.
  evidence:
  - reference: PMID:31300655
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Consistent with an important role of W72 in the folding and dimerisation of
      cZP1-N1, this experiment showed that W83R not only decreases the secretion of
      hZP1-N1 but also significantly reduces its ability to form disulphide-bonded
      homodimers (Fig. 7b). This suggests that the mutation leads to lack of the ZP
      by hindering human ZP filament cross-linking.
    explanation: >-
      Biochemical analysis proves that the human ZP1 W83R variant impairs ZP1-N1
      disulfide-bonded homodimerization, hindering human ZP filament cross-linking.
  - reference: PMID:31300655
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The latter observation, together with the fact that the trefoil/ZP module
      region of hZP1 does not form non-covalent homodimers (Fig. 2j), suggest that
      hZP1-N1 cross-link formation is essential for the assembly or maintenance of
      the human ZP and, hence, fertility.
    explanation: >-
      Demonstrates that ZP1-N1 intermolecular disulfide cross-linking is essential
      for assembly and maintenance of the human zona pellucida and cannot be
      rescued by ZP4.
  - reference: PMID:31292994
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coimmunoprecipitation tests and homology modeling analysis confirmed that both
      mutated ZP1 disrupt the formation of oocyte zona pellucida by interrupting the
      interaction among ZP1, ZP2, and ZP3.
    explanation: >-
      Co-immunoprecipitation demonstrates that EFS-associated ZP1 mutations disrupt
      heteromeric assembly among ZP1, ZP2, and ZP3.
  - reference: PMID:32573113
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The effects of the mutations were investigated through structure prediction
      and in vitro studies in HeLa cells. The results, which were in line with the
      phenotype, suggested that these mutations might impede the function of
      cross-linking and secretion of ZP proteins. Our study showed that the two
      mutations in ZP1 and ZP3 influenced the formation of the ZP, causing female
      infertility.
    explanation: >-
      Confirms that the ZP-N1 domain missense variant ZP1 p.Arg109His impedes ZP
      cross-linking and secretion in HeLa cells.
- name: Impaired Cumulus-Oocyte Complex Organization and Granulosa-Oocyte Crosstalk
  description: >-
    During ovarian folliculogenesis, the zona pellucida provides the structural scaffold
    that stabilizes transzonal projections and gap-junctional communication between
    surrounding cumulus granulosa cells and the growing primary oocyte. In ZP1-deficient
    follicles, preantral follicles initially form a thin ZP composed of ZP2, ZP3, and
    ZP4 without ZP1; however, as follicles expand into the antral stage and antral cavity
    fluid accumulates, the uncross-linked ZP disintegrates, cumulus-oocyte complex (COC)
    architecture collapses, granulosa-oocyte signaling is disrupted, and oocytes suffer
    mitochondrial dysfunction, oxidative stress, intra-follicular degeneration, or
    extreme mechanical fragility during follicular aspiration, manifesting clinically
    as degenerated oocytes or genuine empty follicle syndrome (GEFS).

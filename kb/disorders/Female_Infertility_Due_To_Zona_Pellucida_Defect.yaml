inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Most reported families and sporadic probands harbor homozygous or compound
    heterozygous loss-of-function or missense variants in ZP1. Disease manifestation
    is sex-limited to females; homozygous and heterozygous male carriers have normal
    fertility.
  evidence:
  - reference: PMID:24670168
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe a form of infertility with an autosomal recessive mode of
      inheritance, characterized by abnormal eggs that lack a zona pellucida. We
      identified a homozygous frameshift mutation in ZP1 in six family members.
    explanation: >-
      Establishes autosomal recessive inheritance of ZP1-related female infertility
      due to zona pellucida defect in the original index family.
  - reference: PMID:33272616
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified zona pellucida (ZP) gene variants in 18 individuals, which
      included 20 variants in the ZP1 gene, two variants in the ZP2 gene, and one
      previously reported recurrent variant in the ZP3 gene. The women carrying ZP
      variants constituted 51.43% of the GEFS cohort. The ZP1 variants were inherited
      in an autosomal recessive pattern; the ZP2 and ZP3 variants were inherited in
      an autosomal dominant pattern.
    explanation: >-
      Confirms across a cohort of 35 women with genuine empty follicle syndrome and
      oocyte degeneration that ZP1-associated cases follow autosomal recessive
      inheritance.
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A subset of patients harbor heterozygous ZP1 variants (such as p.Trp83Arg,
    p.Arg109His, p.Tyr262Cys, and p.Glu267Glyfs*80), frequently transmitted paternally
    with sex-limited expression in females, that act via dominant-negative interference
    with ZP secretion or filament assembly or via haploinsufficiency.
  evidence:
  - reference: PMID:32573113
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we performed whole-exome sequencing in two probands with primary
      infertility whose oocytes lacked a ZP, and we identified a heterozygous
      mutation in ZP1 (NM_207341:c.326G>A p.Arg109His), which is situated in the
      N-terminus, and a heterozygous mutation in ZP3 (NM_001110354:c.400G>A
      p.Ala134Thr), which is situated in the ZP domain.
    explanation: >-
      Demonstrates that heterozygous missense variants in ZP1 can cause zona pellucida
      formation failure and female infertility.
  - reference: PMID:38966008
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a patient (II-1) displaying abnormal zona pellucida formation, we successfully
      identified the heterozygous ZP1 mutation (ZP1-Y262C) via whole-exome sequencing.
      Subsequent exome sequencing of the patient’s father (I-2) confirmed his carrier
      status for the ZP1 mutation, while the mother (I-1) exhibited a normal genotype
      (Figures 2A,B).
    explanation: >-
      Documents paternal transmission of a heterozygous ZP1 trefoil-domain missense
      mutation causing zona pellucida-deficient oocytes in the affected daughter.
prevalence:
- population: Women with genuine empty follicle syndrome and oocyte degeneration
  percentage: 51.4
  notes: >-
    Population-level prevalence of OOMD1 in the general population is unknown because
    affected women are asymptomatic until attempting conception or undergoing oocyte
    retrieval. In a Chinese cohort of 35 unrelated women with genuine empty follicle
    syndrome and oocyte degeneration, 18 patients (51.43%) carried ZP variants (with
    20 ZP1 variants identified across the cohort). In a North African cohort of 27
    women with oocyte maturation defect and degenerated oocytes or empty follicles,
    5 patients (18.5%) were homozygous for the recurrent ZP1 p.Arg366Gln founder variant.
  evidence:
  - reference: PMID:33272616
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified zona pellucida (ZP) gene variants in 18 individuals, which
      included 20 variants in the ZP1 gene, two variants in the ZP2 gene, and one
      previously reported recurrent variant in the ZP3 gene. The women carrying ZP
      variants constituted 51.43% of the GEFS cohort.
    explanation: >-
      In a cohort of 35 women with genuine empty follicle syndrome and oocyte
      degeneration, ZP gene variants (predominantly ZP1) accounted for 51.43% of cases.
  - reference: PMID:35460069
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we included four additional OMD patients and reanalyzed all 27 subjects.
      In addition to the seven patients with a previously identified defect, five
      carried the same deleterious homozygous ZP1 variant (c.1097G>A; p.Arg366Gln).
    explanation: >-
      Shows that a single recurrent North African founder variant in ZP1 accounts
      for 5 of 27 cases in an oocyte maturation defect cohort.
pathophysiology:
- name: ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
  description: >-
    Pathogenic truncating, splice-site, or missense variants in ZP1 lead to premature
    stop codons, reduced protein stability, or misfolded ZP1 polypeptides that fail
    to undergo normal post-translational trafficking and cleavage-coupled secretion
    in growing oocytes. Instead of being secreted into the extracellular perivitelline
    space, mutant ZP1 accumulates inside the oocyte cytoplasm and endoplasmic reticulum
    and aberrantly binds and sequesters wild-type ZP1, ZP2, ZP3, and ZP4 intracellularly,
    preventing their transport to the oocyte surface.
  role: TRIGGER
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Germline homozygous, compound heterozygous, or heterozygous pathogenic ZP1
      variants impair ZP1 expression, intracellular trafficking, secretion, and
      partner ZP glycoprotein transport.

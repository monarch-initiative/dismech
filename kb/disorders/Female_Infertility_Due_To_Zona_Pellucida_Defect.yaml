      Mutations are distributed in all 12 exons of ZP1 gene. Corresponding protein
      variants are distributed in all seven functional domains of ZP1 protein,
      including 13 nonsense mutations, 16 missense mutations, seven splicing
      mutations and 11 frameshift mutations
    explanation: >-

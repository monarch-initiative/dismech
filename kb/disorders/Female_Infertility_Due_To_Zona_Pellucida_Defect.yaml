  evidence:
  - reference: PMID:24670168
    reference_title: "Mutant ZP1 in familial infertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies showed that defective ZP1 proteins and normal ZP3 proteins
      colocalized throughout the cells and were not expressed at the cell surface,
      suggesting that the aberrant ZP1 results in the sequestration of ZP3 in the
      cytoplasm, thereby preventing the formation of the zona pellucida around the
      oocyte.
    explanation: >-
      Confocal microscopy of co-transfected HeLa cells demonstrates that truncated
      ZP1 colocalizes with and sequesters ZP3 in the cytoplasm, blocking transport
      to the cell surface.
  - reference: PMID:31300655
    reference_title: "Molecular basis of egg coat cross-linking sheds light on ZP1-associated female infertility."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This showed that, whereas hZP1 is secreted into the medium as a mixture of
      monomer and disulphide-bonded dimer, secretion of hZP1Mut is completely
      abolished (Fig. 1b, left panel). Although the expression of hZP1Mut is lower
      than that of hZP1, the truncated mutant protein can be detected in the cell
      lysate (Fig. 1b, right panel).
    explanation: >-
      Biochemical secretion assays in mammalian cells show that the human infertility
      mutant hZP1 I390fs404X is retained in the cell lysate and its secretion is
      completely abolished.
  - reference: PMID:33272616
    reference_title: "The critical role of ZP genes in female infertility characterized by empty follicle syndrome and oocyte degeneration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Studies in CHO cells suggested that most ZP1 variants led to increased
      intracytoplasmic protein and some variants influenced the intracellular
      transportation of other ZP proteins.
    explanation: >-
      Demonstrates intracytoplasmic protein accumulation and impaired intracellular
      transport of partner ZP proteins in CHO cells expressing mutant ZP1.
- name: Failure of ZP1-N1 Disulfide Cross-Linking and Zona Pellucida Extracellular Matrix Assembly
  description: >-
    In healthy human oocytes, secreted ZP2, ZP3, and ZP4 polymerize into long filaments
    that are covalently cross-linked into a stable three-dimensional extracellular matrix
    via intermolecular disulfide bonds (mediated by conserved Cys66 in chicken ZP1 and
    the corresponding Cys77 in the N-terminal ZP-N1 domain of human ZP1) forming
    ZP1-N1 homodimers, while human ZP4-N1 remains monomeric and cannot substitute for
    ZP1 cross-linking. Pathogenic ZP1 variants either eliminate secreted ZP1, disrupt
    ZP1-N1 homodimerization (such as p.Trp83Arg and p.Arg109His), alter the trefoil
    or ZP domains, or abolish heteromeric interaction with ZP2 and ZP3, resulting in
    a markedly thinned, fragile, or completely absent zona pellucida matrix.

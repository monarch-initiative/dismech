  - preferred_term: female gamete generation
    term:
      id: GO:0007292
      label: female gamete generation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:40923306
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among ZP genes, ZP1 has emerged as a critical determinant of matrix assembly
      and oocyte viability. Loss-of-function mutations in ZP1 can result in
      incomplete or dysfunctional ZP formation, leading to failed fertilization
      (Wassarman & Litscher, 2021).
    explanation: >-
      Summarizes how loss-of-function ZP1 mutations impair ZP matrix formation and
      result in failed fertilization.
  - reference: PMID:36476320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixty-nine mutations of the ZP genes were reported in 87 patients with
      different clinical phenotypes, including empty follicle syndrome (EFS),
      ZP-free oocytes (ZFO), ZP-thin oocytes (ZTO), degenerated and immature oocytes.
      The phenotypes of patients were influenced by the types and location of the
      mutations. The most common effects of ZP mutations are protein truncation and
      dysfunction. Three patients with ZP1 mutations, two with ZP2 mutations, and
      three with ZP4 mutations had successful pregnancies through Intracytoplasmic
      sperm injection (ICSI) from ZFO or ZTO.
    explanation: >-
      Literature synthesis defines the clinical endpoints of ZP mutations (EFS,
      degenerated/immature oocytes, and ZP-free or ZP-thin oocytes) and shows that
      ICSI can rescue fertilization in patients yielding ZP-free oocytes.
phenotypes:
- category: Reproductive
  name: Female infertility
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    Primary female infertility despite regular menstrual cycles, normal female
    reproductive tract anatomy, normal basal serum gonadotropins (FSH, LH, estradiol)
    and anti-Müllerian hormone (AMH), and normal follicular growth on ovarian
    ultrasound during controlled ovarian stimulation. Affected women fall into two
    overlapping assisted-reproduction phenotypes upon follicular aspiration: (1)
    genuine empty follicle syndrome (GEFS) or retrieval of only degenerated, atretic,
    or germinal-vesicle-arrested oocytes (reported in 37 of 48 reviewed ZP1-mutant
    patients, ~77%), and (2) retrieval of mature metaphase II oocytes with a severely
    thinned or completely absent zona pellucida (reported in 11 of 48 patients, ~23%)
    that fail conventional in vitro fertilization.
  phenotype_term:
    preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:24670168
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her age at menarche was 13 years, her menstrual cycle was normal (lasting 3 to
      7 days and occurring every 29 days), and she had no dysmenorrhea.
      Infertility-related examinations did not reveal abnormalities
    explanation: >-
      Establishes primary female infertility with normal menarche, regular menstrual
      cycles, and normal baseline fertility examinations in the proband homozygous
      for the ZP1 mutation.
  - reference: PMID:35460069
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the oocytes from ZP1-associated patients appeared shriveled and dark
      indicating that the abnormal ZP1 protein induced oocyte death and degeneration.
      Overall ZP1-associated patients had degenerated or absent oocytes contrary to
      PATL2-associated subjects who had immature oocytes blocked mainly at the
      germinal vesicle stage.
    explanation: >-
      Describes the characteristic retrieval of shriveled, dark, degenerated or
      absent oocytes in patients homozygous for ZP1 p.Arg366Gln.
  - reference: PMID:36476320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their genotypes are homozygous, heterozygous, or compound heterozygous, and are
      inherited in autosomal dominant (AD) or autosomal recessive (AR) manners, which
      cause different phenotypes like empty follicle syndrome (EFS), ZP-free oocytes
      (ZFO), degenerated or immature oocytes
    explanation: >-
      Summarizes the clinical spectrum of ZP1-related female infertility across
      48 reported patients, encompassing empty follicle syndrome, ZP-free oocytes,
      and degenerated or immature oocytes.
genetic:
- name: ZP1
  association: Causative
  gene_term:
    preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  notes: >-
    Over 47 pathogenic variants in ZP1 have been identified across all structural
    domains of the 638-amino-acid glycoprotein, including the N-terminal ZP-N1
    cross-linking domain (e.g., p.Cys80Tyr, p.Tyr81His, p.Trp83Arg, p.Arg109Cys,
    p.Arg109His), the proline-rich linker, the trefoil domain (e.g., p.Gln257Ter,
    p.Tyr262Cys, p.Glu267Glyfs*80), the bipartite zona pellucida domain (ZP-N and
    ZP-C subdomains, including the recurrent North African founder variant c.1097G>A
    p.Arg366Gln, the frameshift c.1169_1176del p.Ile390Thrfs*16, and p.Arg410Trp),
    the consensus furin cleavage site (CFCS), and the C-terminal transmembrane domain.
    Biallelic truncating or splice-site variants most frequently cause genuine empty
    follicle syndrome or severe oocyte degeneration, whereas certain missense or
    frameshift variants allow retrieval of ZP-free metaphase II oocytes.
  evidence:
  - reference: PMID:24670168
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of candidate genes ZP1, ZP2, ZP3, and ZP4 revealed that six members
      of generation IV (the four patients and two unmarried family members) carried a
      homozygous frameshift deletion of 8 bp encompassing nucleotides 1169 through
      1176 in ZP1 (GenBank accession number, KJ489454).
    explanation: >-
      Identifies the first causal homozygous frameshift deletion in ZP1 in four
      infertile sisters from a consanguineous pedigree.
  - reference: PMID:36476320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 47 ZP1 mutations have been reported in 19 pieces of literature, most
      of which are exon mutations, and only seven are intron splicing mutations.
      Mutations are distributed in all 12 exons of ZP1 gene. Corresponding protein
      variants are distributed in all seven functional domains of ZP1 protein,
      including 13 nonsense mutations, 16 missense mutations, seven splicing
      mutations and 11 frameshift mutations
    explanation: >-
      Catalogs 47 distinct pathogenic ZP1 mutations across all 12 exons and 7
      functional domains of ZP1, making ZP1 the most frequently mutated zona
      pellucida gene in human female infertility.
  - reference: PMID:42060237
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both patients and two affected siblings harbored a homozygous ZP1 c.1097G > A
      p.(Arg366Gln) variant inherited from both heterozygous parents. This previously
      described variant appears to be recurrent in North African populations.
    explanation: >-
      Confirms recurrence of the homozygous ZP1 c.1097G>A p.(Arg366Gln) founder
      variant in North African families with empty follicle syndrome.
treatments:
- name: Intracytoplasmic Sperm Injection (ICSI)
  description: >-
    For the subset of ZP1-mutant patients (~20–25%) from whom mature metaphase II (MII)
    zona pellucida-free oocytes can be successfully aspirated (often facilitated by
    gentle follicular aspiration at reduced suction pressure or diagnostic natural-cycle
    aspiration), intracytoplasmic sperm injection (ICSI) directly injects a single
    spermatozoon into the ooplasm, bypassing the absent ZP required for conventional
    IVF sperm binding. Following careful individual microdrop culture of fragile
    ZP-free embryos to the blastocyst stage and embryo transfer, live births of
    healthy infants have been achieved. In patients with complete intra-follicular
    oocyte degeneration and genuine empty follicle syndrome where no viable MII
    oocytes can be recovered, autologous ICSI is unsuccessful and oocyte donation
    is required.
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_phenotypes:
  - preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: PMID:32573113
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the patient with the ZP1 mutation delivered a baby following
      intracytoplasmic sperm injection (ICSI); thus, we suggest the targeted genetic
      diagnosis of ZP genes to choose appropriate fertilization methods and improve
      the success rate of assisted reproductive technology (ART) treatments.
    explanation: >-
      Documents successful clinical rescue of ZP1-mutant ZP-free oocytes via ICSI
      resulting in a healthy live birth.
  - reference: PMID:32847637
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic ICSI provided information about the embryo development potential
      from ZP-free oocytes and allowed better planning of the subsequent ICSI cycle.
      WES revealed that the absence of ZP was likely to be due to a new (ZP1)
      mutation. The subsequent ICSI cycle resulted in the delivery of a healthy baby.
    explanation: >-
      Demonstrates that diagnostic ICSI followed by therapeutic ICSI can achieve
      live birth in a patient with genetically determined ZP1-mutant ZP-free oocytes.
  - reference: PMID:36476320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If oocytes with ZP defects could be obtained from the affected patients, ICSI
      could be preferentially chosen instead of the traditional IVF, which may
      improve the probability of successful pregnancy via ART.
    explanation: >-
      Recommends ICSI over conventional IVF whenever ZP-defective oocytes can be
      retrieved from patients with ZP gene mutations.
- name: Genetic Counseling
  description: >-
    Genetic counseling is recommended for affected women and their family members to
    explain autosomal recessive or sex-limited autosomal dominant inheritance, screen
    female siblings of reproductive age who may share pathogenic ZP1 variants, and
    guide reproductive decision-making between autologous ICSI attempts and oocyte
    donation to avoid repeated futile ovarian stimulation cycles.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42060237
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrent ZP1 c.1097G > A p.(Arg366Gln) variant contributes to EFS in
      consanguineous North African families. Genetic diagnosis using targeted gene
      panels is valuable for personalized infertility care and counseling.
    explanation: >-
      Supports targeted genetic diagnosis and genetic counseling to guide
      personalized infertility care in families with ZP1 variants.
diagnosis:
- name: Genetic Testing (ZP1 Sequencing / Infertility Gene Panel / Exome Sequencing)
  description: >-
    Definitive molecular diagnosis is established by identifying biallelic (or
    pathogenic heterozygous) variants in ZP1 via whole-exome sequencing or targeted
    female infertility gene panel sequencing in women presenting with genuine empty
    follicle syndrome, degenerated/fragile oocytes, or zona pellucida-free oocytes
    upon transvaginal follicular aspiration despite normal ovarian reserve and
    hormonal response.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of homozygous, compound heterozygous, or pathogenic heterozygous
    variants in ZP1 (NM_207341.4). In patients of North African ancestry presenting
    with empty follicle syndrome or degenerated oocytes, targeted screening for the
    recurrent founder variant c.1097G>A p.(Arg366Gln) accounts for ~18% of OMD cases.
  evidence:
  - reference: PMID:35460069
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cohort of North African OMD patients, whole exome sequencing permitted
      to diagnose 44% of the patients studied and to identify a new frequent ZP1
      variant.
    explanation: >-
      Demonstrates the diagnostic utility of whole-exome sequencing and targeted
      ZP1 variant detection in North African patients with oocyte maturation defect.
  - reference: PMID:33272616
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings not only reveal the critical roles of ZP genes but also pave the
      way for the efficient genetic diagnosis of females with GEFS and oocyte
      degeneration.
    explanation: >-
      Highlights the high diagnostic yield of ZP1 genetic testing in patients with
      GEFS and oocyte degeneration.
differential_diagnoses:
- name: Oocyte maturation defect 3 (ZP3-related zona pellucida defect / empty follicle syndrome)
  disease_term:
    preferred_term: oocyte maturation defect 3
    term:
      id: MONDO:0021574
      label: oocyte maturation defect 3
  description: >-
    Caused by heterozygous autosomal dominant variants in ZP3 (such as p.Ala134Thr,
    p.Ser173Cys, p.Arg254Gly, and p.Arg349Leu). Clinically overlaps with OOMD1 by
    presenting with genuine empty follicle syndrome, degenerated oocytes, or ZP-free
    oocytes, but follows strictly autosomal dominant inheritance rather than the
    predominantly autosomal recessive inheritance of ZP1-related OOMD1.
  distinguishing_features:
  - Heterozygous pathogenic variant in ZP3 (hgnc:13189) on genetic testing
  - Exclusively autosomal dominant mode of inheritance in reported human pedigrees
  evidence:
  - reference: PMID:33272616
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ZP1 variants were inherited in an autosomal recessive pattern; the ZP2 and
      ZP3 variants were inherited in an autosomal dominant pattern.
    explanation: >-
      Distinguishes ZP3-related oocyte maturation defect 3 from ZP1-related OOMD1
      by genetic locus and autosomal dominant inheritance.
- name: Oocyte maturation defect 6 (ZP2-related zona pellucida defect)
  disease_term:
    preferred_term: oocyte maturation defect 6
    term:
      id: MONDO:0032696
      label: oocyte maturation defect 6
  description: >-
    Caused by homozygous or compound heterozygous (and occasionally heterozygous)
    pathogenic variants in ZP2, encoding the primary sperm-binding component of the
    zona pellucida after cleavage rejuvenation. Presents with thin or absent zona
    pellucida, defective sperm binding in conventional IVF, or empty follicle syndrome,
    and is differentiated from OOMD1 by molecular testing of ZP2.
  distinguishing_features:
  - Pathogenic variants in ZP2 (hgnc:13188) identified on exome or gene panel sequencing
  evidence:
  - reference: PMID:30810869
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous studies have identified mutations in ZP1, ZP2, and ZP3 that lead to
      female infertility caused by oocyte degeneration, empty follicle syndrome, or
      in vitro fertilization failure.
    explanation: >-
      Demonstrates that ZP1, ZP2, and ZP3 mutations produce overlapping zona
      pellucida defects that require molecular genetic testing to distinguish.
- name: Oocyte maturation defect 2 (TUBB8-related oocyte maturation arrest)
  disease_term:
    preferred_term: oocyte maturation defect 2
    term:
      id: MONDO:0021573
      label: oocyte maturation defect 2
  description: >-
    Caused by heterozygous or biallelic variants in the primate-specific beta-tubulin
    isotype gene TUBB8. Unlike OOMD1, where the primary defect lies in the extracellular
    zona pellucida coat while meiotic spindle assembly can proceed to metaphase II,
    TUBB8-related OOMD2 primarily disrupts meiotic spindle assembly and arrests
    oocytes at metaphase I within an intact zona pellucida.
  distinguishing_features:
  - Intact zona pellucida surrounding metaphase I-arrested oocytes with disorganized or absent meiotic spindles
  - Pathogenic variants in TUBB8 (hgnc:20773)
  evidence:
  - reference: PMID:26789871
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven mutations in the primate-specific gene TUBB8 that were
      responsible for oocyte meiosis I arrest in 7 of the 24 families. TUBB8
      expression is unique to oocytes and the early embryo, in which this gene
      accounts for almost all the expressed β-tubulin.
    explanation: >-
      Establishes that TUBB8 mutations cause oocyte meiosis I arrest via spindle
      disruption rather than primary zona pellucida extracellular matrix loss.
animal_models:
- name: Zp1 p.I390fs404X homozygous knock-in rat (Zp1MT/MT)
  species: Rattus norvegicus
  genotype: Zp1 p.I390fs404X homozygous knock-in (Zp1MT/MT)
  background: Sprague-Dawley
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:33624742
  description: >-
    Rats knocked in for the human frameshift mutation Zp1 p.I390fs404X (Zp1MT/MT)
    closely phenocopy human OOMD1 because rats, like humans, express four zona
    pellucida glycoproteins (ZP1, ZP2, ZP3, and ZP4). Homozygous Zp1MT/MT female
    rats completely lack a zona pellucida around growing oocytes due to intracellular
    retention of mutant ZP1 and impeded incorporation of ZP3 and ZP4, ovulate
    drastically fewer eggs (1–2 naked eggs versus ~21 in wild-type controls), fail
    in vitro fertilization, and exhibit complete female infertility.
  modeled_mechanisms:
  - target: ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Homozygous Zp1MT/MT rat oocytes retain mutant ZP1 intracellularly and fail
      to incorporate ZP3 and ZP4 into an extracellular zona pellucida.
  evidence:
  - reference: PMID:33624742
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The ovaries of homozygous (Zp1MT/MT) females possessed both growing and fully
      grown oocytes; the oocytes completely lacked a ZP, but ZP1 was detectable
      inside the cytoplasm. Only 1-2 eggs were recovered from oviducts of
      superovulated Zp1MT/MT females, while an average of 21 eggs were recovered from
      superovulated Zp1WT/WT per female. The eggs of Zp1MT/MT females were not
      surrounded by a ZP and lost their fertilization capacity in vitro. Zp1MT/MT
      females mated with wild-type males failed to become pregnant.
    explanation: >-
      Demonstrates that the Zp1 knock-in rat model recapitulates human ZP1-related
      absence of the zona pellucida, cytoplasmic ZP1 retention, severe reduction
      in ovulated eggs, IVF failure, and complete female infertility.
- name: ZP1 CRISPR/Cas9 loss-of-function cynomolgus macaque (#ZP1-2)
  species: Macaca fascicularis
  genotype: ZP1 CRISPR/Cas9 loss-of-function mutant (#ZP1-2)
  background: Cynomolgus macaque
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:40923306
  description: >-
    First non-human primate model of ZP1 deficiency, generated by CRISPR/Cas9 editing
    in cynomolgus macaques. The ZP1-mutant female macaque (#ZP1-2) exhibited oocytes
    with thin, irregular, or completely absent zona pellucida, markedly reduced
    in vitro maturation (IVM) and blastocyst formation rates after ICSI, disrupted
    granulosa-oocyte transcriptomic signaling in late antral follicles, and oocyte
    mitochondrial swelling associated with SOD2 downregulation.
  modeled_mechanisms:
  - target: Impaired Cumulus-Oocyte Complex Organization and Granulosa-Oocyte Crosstalk
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Recapitulates ZP absence/thinning and disrupted oocyte-granulosa signaling
      in late antral follicles of a non-human primate with a four-ZP-subunit matrix.
  evidence:
  - reference: PMID:40923306
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following sexual maturation, oocytes retrieved from #ZP1-2 through
      superovulation exhibited a marked increase in zona pellucida-deficient oocytes
      and a significant reduction in maturation rates compared to controls.
      Integrated analyses, including immunofluorescence staining, transmission
      electron microscopy, transcriptomic profiling of oocytes, and histopathological
      examination of ovarian tissue, revealed disrupted folliculogenesis and oocyte
      anomalies consistent with phenotypes observed in human empty follicle syndrome.
    explanation: >-
      Establishes the cynomolgus macaque CRISPR ZP1 model showing ZP-deficient
      oocytes, disrupted folliculogenesis, and reduced oocyte maturation consistent
      with human empty follicle syndrome.
- name: Zp1-null knockout mouse (Zp1tm/tm)
  species: Mus musculus
  genotype: Zp1-/- (Zp1tm/tm null)
  background: C57BL/6
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:10433913
  description: >-
    Unlike humans and rats, mice possess only three functional zona pellucida genes
    (Zp1, Zp2, and Zp3, with Zp4 pseudogenized). Homozygous Zp1-null female mice
    still assemble a loosely organized, porous zona pellucida matrix composed of
    mZP2 and mZP3, with ectopic clusters of granulosa cells trapped in the perivitelline
    space. Zp1-null female mice remain fertile with reduced litter sizes (~50% of
    wild-type) due to fragile cleavage-stage embryos and precocious hatching in the
    oviduct, making the mouse knock-out a milder structural phenotype than the
    truncating/missense ZP1 mutations seen in humans and knock-in rats.
  modeled_mechanisms:
  - target: Failure of ZP1-N1 Disulfide Cross-Linking and Zona Pellucida Extracellular Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates loss of ZP1 filament cross-linking and porous ZP architecture,
      but mice retain an uncross-linked ZP2/ZP3 coat and remain subfertile rather
      than completely sterile.
  evidence:
  - reference: PMID:10433913
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although a zona pellucida composed of ZP2 and ZP3 was formed around growing
      Zp1(tm/tm) oocytes, the matrix was more loosely organized than zonae around
      normal oocytes. In some Zp1 null follicles, this structural abnormality
      resulted in ectopic clusters of granulosa cells, lodged between the zona matrix
      and the oolemma, that perturbed normal folliculogenesis. Comparable numbers of
      eggs were ovulated from Zp1 null females and normal females following hormonal
      stimulation. However, after mating with males, fewer two-cell embryos were
      recovered from Zp1 null females, and their litters were significantly smaller
      than those produced by normal mice.
    explanation: >-
      Characterizes the Zp1-null mouse model, showing a loosely organized ZP2/ZP3
      matrix, ectopic perivitelline granulosa cells, and reduced fertility due to
      early embryonic loss.
experimental_models:
- name: HeLa, CHO, and HEK293T Mammalian Heterologous ZP Co-Expression and Secretion Systems
  experimental_model_type: CELL_LINE
  cell_source: HeLa, Chinese hamster ovary (CHO), and HEK293T mammalian cell lines
  culture_system: Transient plasmid transfection and conditioned-medium secretion assay
  publication: PMID:24670168
  description: >-
    Transient co-transfection of wild-type and patient-derived mutant human ZP1
    constructs alongside ZP2, ZP3, and ZP4 in HeLa, Chinese hamster ovary (CHO),
    or HEK293T cells, coupled with confocal immunofluorescence, co-immunoprecipitation,
    and conditioned-medium immunoblotting. Used to assay intracellular ER retention,
    dominant-negative or recessive co-sequestration of ZP3/ZP4, ZP1-N1 homodimerization,
    and secretion into the culture medium.
  modeled_mechanisms:
  - target: ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly reproduces intracellular retention of mutant ZP1 and co-sequestration
      of wild-type ZP3/ZP4 in cultured mammalian cells.
  evidence:
  - reference: PMID:24670168
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro studies showed that defective ZP1 proteins and normal ZP3 proteins
      colocalized throughout the cells and were not expressed at the cell surface,
      suggesting that the aberrant ZP1 results in the sequestration of ZP3 in the
      cytoplasm, thereby preventing the formation of the zona pellucida around the
      oocyte.
    explanation: >-
      Demonstrates in HeLa cells that mutant ZP1 colocalizes with and sequesters
      ZP3 in the cytoplasm, preventing cell-surface expression.
  - reference: PMID:31300655
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Importantly, this conclusion can be extended to the mammalian homologue of the
      protein because, mirroring full-length hZP1 (Fig. 1b, left panel), a construct
      corresponding to hZP1-N1 is also secreted as a homodimer linked by
      intermolecular disulphide(s) (Fig. 2i).
    explanation: >-
      Uses mammalian cell secretion and cross-linking assays to demonstrate that
      human ZP1-N1 is secreted as an intermolecular disulfide-linked homodimer.
datasets: []
discussions:
- discussion_id: oomd1_species_zp_composition_divergence
  prompt: >-
    Why do human patients and Zp1-knock-in rats with ZP1 mutations exhibit complete
    absence of the zona pellucida or empty follicle syndrome, whereas Zp1-null
    knockout mice assemble a loosely organized ZP2/ZP3 coat and remain subfertile?
  kind: HUMAN_MODEL_MISMATCH
  status: RESOLVED
  attaches_to:
  - animal_models#Zp1 p.I390fs404X homozygous knock-in rat (Zp1MT/MT)
  - animal_models#Zp1-null knockout mouse (Zp1tm/tm)
  - pathophysiology#ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
  rationale: >-
    Humans, macaques, and rats express four zona pellucida glycoproteins (ZP1, ZP2,
    ZP3, ZP4), whereas mice have a pseudogenized Zp4 gene and express only three
    subunits (mZP1, mZP2, mZP3). Furthermore, human and rat truncating or missense
    ZP1 mutant proteins accumulate in the oocyte cytoplasm and actively bind and
    sequester ZP3 and ZP4 intracellularly, blocking their secretion and preventing
    any extracellular ZP matrix assembly, whereas complete Zp1 null alleles in mice
    allow unimpeded secretion of mZP2 and mZP3 to form an uncross-linked matrix.
  evidence:
  - reference: PMID:33624742
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies in 293T cells showed that mutant Zp1 resulted in a truncated ZP1
      protein, which might be intracellularly sequestered and interacted with
      wild-type ZP3 or ZP4. Our results suggest that the Zp1 point mutation led to
      infertility and loss of the ZP in oocytes in rats.
    explanation: >-
      Explains why mutant ZP1 in a 4-ZP-subunit mammal (rat/human) causes complete
      absence of the zona pellucida through intracellular sequestration of ZP3 and ZP4.
notes: >-
  Nosology and cross-species note: MONDO:0014342 ('female infertility due to zona
  pellucida defect', OMIM:615774, OOMD1) specifically denotes ZP1-related zona
  pellucida defect / empty follicle syndrome. Related zona pellucida disorders
  caused by ZP3 (MONDO:0021574, OOMD3, OMIM:617712) and ZP2 (MONDO:0032696, OOMD6,
  OMIM:618353) have distinct MONDO entries and are cross-referenced in
  differential_diagnoses.

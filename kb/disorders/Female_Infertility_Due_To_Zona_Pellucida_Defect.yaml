  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  biological_processes:
  - preferred_term: ovarian follicle development
    term:
      id: GO:0001541
      label: ovarian follicle development
    modifier: ABNORMAL
  downstream:
  - target: Oocyte Mitochondrial Dysfunction, Fragility, and Intra-Follicular Degeneration
    description: >-
      Disruption of cumulus-oocyte complex architecture and loss of granulosa-oocyte
      nutritional and metabolic support induce oocyte oxidative stress, mitochondrial
      swelling, mechanical fragility, and intra-follicular oocyte degeneration.
    evidence:
    - reference: PMID:36476320
      reference_title: "Can successful pregnancy be achieved and predicted from patients with identified ZP mutations? A literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Lack of ZP might interfere with the bidirectional communication between oocytes
        and cumulus cells, then impedes nutritional supplements from cumulus cells
        leading to oocyte degeneration or increases in the fragility of oocytes during
        follicular puncture, ultimately resulting in EFS [8, 53, 70].
      explanation: >-
        Explains how impaired bidirectional communication and nutrient transfer between
        cumulus cells and the oocyte lead to oocyte degeneration and fragility.
    - reference: PMID:31734689
      reference_title: "ZP1 mutations are associated with empty follicle syndrome: evidence for the existence of an intact oocyte and a zona pellucida in follicles up to the early antral stage. A case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The antral follicles were also defective in normal cumulus-oocyte complex
        organisation, leading us to speculate that the lack of ZP1 might lead to
        oocyte degeneration or increased fragility of the oocyte during follicular
        puncture, ultimately resulting in EFS.
      explanation: >-
        Connects defective cumulus-oocyte complex organization in antral follicles
        to downstream oocyte degeneration and mechanical fragility during puncture.

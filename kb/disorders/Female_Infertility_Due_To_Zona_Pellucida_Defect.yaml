- name: Oocyte Mitochondrial Dysfunction, Fragility, and Intra-Follicular Degeneration
  description: >-
    Deprived of a protective zona pellucida scaffold and cumulus-oocyte metabolic
    coupling, ZP1-deficient oocytes develop transcriptomic and ultrastructural
    hallmarks of cellular stress, including downregulation of antioxidant defenses
    (such as SOD2), oxidative stress, extensive mitochondrial swelling at germinal
    vesicle and metaphase II stages, increased autophagy, and extreme mechanical
    vulnerability to shear stress. Consequently, oocytes either degenerate within
    antral follicles prior to ovulation or rupture during transvaginal follicular
    aspiration, resulting in retrieval of shriveled, dark degenerated oocytes or
    genuine empty follicle syndrome (GEFS).

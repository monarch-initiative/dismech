treatments:
- name: Intracytoplasmic Sperm Injection (ICSI)
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    For the subset of ZP1-mutant patients (~20 to 25%) from whom mature metaphase II (MII)
    zona pellucida-free oocytes can be successfully aspirated (often facilitated by
    gentle follicular aspiration at reduced suction pressure or diagnostic natural-cycle
    aspiration), intracytoplasmic sperm injection (ICSI) directly injects a single
    spermatozoon into the ooplasm, bypassing the absent ZP required for conventional
    IVF sperm binding. Following careful individual microdrop culture of fragile
    ZP-free embryos to the blastocyst stage and embryo transfer, live births of
    healthy infants have been achieved.
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_phenotypes:
  - preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  - preferred_term: Absent zona pellucida
    term:
      id: HP:6000328
      label: Absent zona pellucida
  - preferred_term: Thin zona pellucida
    term:
      id: HP:0020157
      label: Thin zona pellucida
  evidence:
  - reference: PMID:32573113
    reference_title: "Heterozygous mutations in ZP1 and ZP3 cause formation disorder of ZP and female infertility in human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the patient with the ZP1 mutation delivered a baby following
      intracytoplasmic sperm injection (ICSI); thus, we suggest the targeted genetic
      diagnosis of ZP genes to choose appropriate fertilization methods and improve
      the success rate of assisted reproductive technology (ART) treatments.
    explanation: >-
      Documents successful clinical rescue of ZP1-mutant ZP-free oocytes via ICSI
      resulting in a healthy live birth.
  - reference: PMID:32847637
    reference_title: "Role of diagnostic intracytoplasmic sperm injection (ICSI) in the management of genetically determined zona pellucida-free oocytes during in vitro fertilization: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnostic ICSI provided information about the embryo development potential
      from ZP-free oocytes and allowed better planning of the subsequent ICSI cycle.
      WES revealed that the absence of ZP was likely to be due to a new (ZP1)
      mutation. The subsequent ICSI cycle resulted in the delivery of a healthy baby.
    explanation: >-
      Demonstrates that diagnostic ICSI followed by therapeutic ICSI can achieve
      live birth in a patient with genetically determined ZP1-mutant ZP-free oocytes.
  - reference: PMID:36476320
    reference_title: "Can successful pregnancy be achieved and predicted from patients with identified ZP mutations? A literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If oocytes with ZP defects could be obtained from the affected patients, ICSI
      could be preferentially chosen instead of the traditional IVF, which may
      improve the probability of successful pregnancy via ART.
    explanation: >-
      Recommends ICSI over conventional IVF whenever ZP-defective oocytes can be
      retrieved from patients with ZP gene mutations.
- name: Oocyte Donation
  action_category: THERAPEUTIC
  description: >-
    For the majority of ZP1-mutant patients (~75 to 80%, particularly those carrying
    biallelic truncating, frameshift, or severe missense variants such as p.Arg366Gln)
    who present with genuine empty follicle syndrome or complete intra-follicular
    oocyte degeneration where no viable metaphase II oocytes can be recovered,
    autologous ICSI is not feasible and in vitro fertilization using donor oocytes
    is the definitive therapeutic option to achieve pregnancy.
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  - preferred_term: Empty ovarian follicle
    term:
      id: HP:0031067
      label: Empty ovarian follicle
  evidence:
  - reference: PMID:36476320
    reference_title: "Can successful pregnancy be achieved and predicted from patients with identified ZP mutations? A literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For patients with the most severe phenotypes of EFS caused by ZP gene mutations,
      the current optimal treatment choice would be egg donation.
    explanation: >-
      Establishes oocyte (egg) donation as the optimal treatment for patients with
      severe empty follicle syndrome caused by ZP gene mutations.
- name: Genetic Counseling
  description: >-
    Genetic counseling is recommended for affected women and their family members to
    explain autosomal recessive or sex-limited autosomal dominant inheritance, screen
    female siblings of reproductive age who may share pathogenic ZP1 variants, and
    guide reproductive decision-making between autologous ICSI attempts and oocyte
    donation to avoid repeated futile ovarian stimulation cycles.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42060237
    reference_title: "A recurrent North African ZP1 variant and a literature review of genotype-phenotype correlations in ZP-related infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recurrent ZP1 c.1097G > A p.(Arg366Gln) variant contributes to EFS in
      consanguineous North African families. Genetic diagnosis using targeted gene
      panels is valuable for personalized infertility care and counseling.
    explanation: >-
      Supports targeted genetic diagnosis and genetic counseling to guide
      personalized infertility care in families with ZP1 variants.
diagnosis:
- name: Genetic Testing (ZP1 Sequencing / Infertility Gene Panel / Exome Sequencing)
  description: >-
    Definitive molecular diagnosis is established by identifying biallelic (or
    pathogenic heterozygous) variants in ZP1 via whole-exome sequencing or targeted
    female infertility gene panel sequencing in women presenting with genuine empty
    follicle syndrome, degenerated/fragile oocytes, or zona pellucida-free oocytes
    upon transvaginal follicular aspiration despite normal ovarian reserve and
    hormonal response.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    Identification of homozygous, compound heterozygous, or pathogenic heterozygous
    variants in ZP1 (NM_207341.4). In patients of North African ancestry presenting
    with empty follicle syndrome or degenerated oocytes, targeted screening for the
    recurrent founder variant c.1097G>A p.(Arg366Gln) accounts for ~18% of OMD cases.
  evidence:
  - reference: PMID:35460069
    reference_title: "A recurrent ZP1 variant is responsible for oocyte maturation defect with degenerated oocytes in infertile females."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this cohort of North African OMD patients, whole exome sequencing permitted
      to diagnose 44% of the patients studied and to identify a new frequent ZP1
      variant.
    explanation: >-
      Demonstrates the diagnostic utility of whole-exome sequencing and targeted
      ZP1 variant detection in North African patients with oocyte maturation defect.
  - reference: PMID:33272616
    reference_title: "The critical role of ZP genes in female infertility characterized by empty follicle syndrome and oocyte degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings not only reveal the critical roles of ZP genes but also pave the
      way for the efficient genetic diagnosis of females with GEFS and oocyte
      degeneration.
    explanation: >-
      Highlights the high diagnostic yield of ZP1 genetic testing in patients with
      GEFS and oocyte degeneration.
differential_diagnoses:
- name: Oocyte maturation defect 3 (ZP3-related zona pellucida defect / empty follicle syndrome)
  disease_term:
    preferred_term: oocyte maturation defect 3
    term:
      id: MONDO:0021574
      label: oocyte maturation defect 3
  description: >-
    Caused by heterozygous autosomal dominant variants in ZP3 (such as p.Ala134Thr,
    p.Ser173Cys, p.Arg254Gly, and p.Arg349Leu). Clinically overlaps with OOMD1 by
    presenting with genuine empty follicle syndrome, degenerated oocytes, or ZP-free
    oocytes, but follows strictly autosomal dominant inheritance rather than the
    predominantly autosomal recessive inheritance of ZP1-related OOMD1.
  distinguishing_features:
  - Heterozygous pathogenic variant in ZP3 (hgnc:13189) on genetic testing
  - Exclusively autosomal dominant mode of inheritance in reported human pedigrees
  evidence:
  - reference: PMID:33272616
    reference_title: "The critical role of ZP genes in female infertility characterized by empty follicle syndrome and oocyte degeneration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ZP1 variants were inherited in an autosomal recessive pattern; the ZP2 and
      ZP3 variants were inherited in an autosomal dominant pattern.
    explanation: >-
      Distinguishes ZP3-related oocyte maturation defect 3 from ZP1-related OOMD1
      by genetic locus and autosomal dominant inheritance.
- name: Oocyte maturation defect 6 (ZP2-related zona pellucida defect)
  disease_term:
    preferred_term: oocyte maturation defect 6
    term:
      id: MONDO:0032696
      label: oocyte maturation defect 6
  description: >-
    Caused by homozygous or compound heterozygous (and occasionally heterozygous)
    pathogenic variants in ZP2, encoding the primary sperm-binding component of the
    zona pellucida after cleavage rejuvenation. Presents with thin or absent zona
    pellucida, defective sperm binding in conventional IVF, or empty follicle syndrome,
    and is differentiated from OOMD1 by molecular testing of ZP2.
  distinguishing_features:
  - Pathogenic variants in ZP2 (hgnc:13188) identified on exome or gene panel sequencing
  evidence:
  - reference: PMID:30810869
    reference_title: "Novel mutations in ZP1, ZP2, and ZP3 cause female infertility due to abnormal zona pellucida formation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous studies have identified mutations in ZP1, ZP2, and ZP3 that lead to
      female infertility caused by oocyte degeneration, empty follicle syndrome, or
      in vitro fertilization failure.
    explanation: >-
      Demonstrates that ZP1, ZP2, and ZP3 mutations produce overlapping zona
      pellucida defects that require molecular genetic testing to distinguish.
- name: Oocyte maturation defect 2 (TUBB8-related oocyte maturation arrest)
  disease_term:
    preferred_term: oocyte maturation defect 2
    term:
      id: MONDO:0021573
      label: oocyte maturation defect 2
  description: >-
    Caused by heterozygous or biallelic variants in the primate-specific beta-tubulin
    isotype gene TUBB8 (curated in kb/disorders/TUBB8-related_Oocyte_Maturation_Defect.yaml).
    Unlike OOMD1, where the primary defect lies in the extracellular zona pellucida
    coat while meiotic spindle assembly can proceed to metaphase II, TUBB8-related
    OOMD2 primarily disrupts meiotic spindle assembly and arrests oocytes at
    metaphase I within an intact zona pellucida.
  distinguishing_features:
  - Intact zona pellucida surrounding metaphase I-arrested oocytes with disorganized or absent meiotic spindles
  - Pathogenic variants in TUBB8 (hgnc:20773)
  evidence:
  - reference: PMID:26789871
    reference_title: "Mutations in TUBB8 and Human Oocyte Meiotic Arrest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified seven mutations in the primate-specific gene TUBB8 that were
      responsible for oocyte meiosis I arrest in 7 of the 24 families. TUBB8
      expression is unique to oocytes and the early embryo, in which this gene
      accounts for almost all the expressed β-tubulin.
    explanation: >-
      Establishes that TUBB8 mutations cause oocyte meiosis I arrest via spindle
      disruption rather than primary zona pellucida extracellular matrix loss.
animal_models:
- name: Zp1 p.I390fs404X homozygous knock-in rat (Zp1MT/MT)
  species: Rattus norvegicus
  genotype: Zp1 p.I390fs404X homozygous knock-in (Zp1MT/MT)
  background: Sprague-Dawley
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:33624742
  description: >-
    Rats knocked in for the human frameshift mutation Zp1 p.I390fs404X (Zp1MT/MT)
    closely phenocopy human OOMD1 because rats, like humans, express four zona
    pellucida glycoproteins (ZP1, ZP2, ZP3, and ZP4). Homozygous Zp1MT/MT female
    rats completely lack a zona pellucida around growing oocytes due to intracellular
    retention of mutant ZP1 and impeded incorporation of ZP3 and ZP4, ovulate
    drastically fewer eggs (1–2 naked eggs versus ~21 in wild-type controls), fail
    in vitro fertilization, and exhibit complete female infertility.
  modeled_mechanisms:
  - target: ZP1 Loss-of-Function and Cytoplasmic Co-Sequestration of Zona Pellucida Glycoproteins
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Homozygous Zp1MT/MT rat oocytes retain mutant ZP1 intracellularly and fail
      to incorporate ZP3 and ZP4 into an extracellular zona pellucida.
  evidence:
  - reference: PMID:33624742
    reference_title: "Mutant Zp1 impedes incorporation of ZP3 and ZP4 in the zona pellucida, resulting in zona absence and female infertility in rats†."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The ovaries of homozygous (Zp1MT/MT) females possessed both growing and fully
      grown oocytes; the oocytes completely lacked a ZP, but ZP1 was detectable
      inside the cytoplasm. Only 1-2 eggs were recovered from oviducts of
      superovulated Zp1MT/MT females, while an average of 21 eggs were recovered from
      superovulated Zp1WT/WT per female. The eggs of Zp1MT/MT females were not
      surrounded by a ZP and lost their fertilization capacity in vitro. Zp1MT/MT
      females mated with wild-type males failed to become pregnant.
    explanation: >-
      Demonstrates that the Zp1 knock-in rat model recapitulates human ZP1-related
      absence of the zona pellucida, cytoplasmic ZP1 retention, severe reduction
      in ovulated eggs, IVF failure, and complete female infertility.
- name: ZP1 CRISPR/Cas9 loss-of-function cynomolgus macaque (#ZP1-2)
  species: Macaca fascicularis
  genotype: ZP1 CRISPR/Cas9 loss-of-function mutant (#ZP1-2)
  background: Cynomolgus macaque
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:40923306
  description: >-
    First non-human primate model of ZP1 deficiency, generated by CRISPR/Cas9 editing
    in cynomolgus macaques. The ZP1-mutant female macaque (#ZP1-2) exhibited oocytes
    with thin, irregular, or completely absent zona pellucida, markedly reduced
    in vitro maturation (IVM) and blastocyst formation rates after ICSI, disrupted
    granulosa-oocyte transcriptomic signaling in late antral follicles, and oocyte
    mitochondrial swelling associated with SOD2 downregulation.
  modeled_mechanisms:
  - target: Impaired Cumulus-Oocyte Complex Organization and Granulosa-Oocyte Crosstalk
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Recapitulates ZP absence/thinning and disrupted oocyte-granulosa signaling
      in late antral follicles of a non-human primate with a four-ZP-subunit matrix.
  evidence:
  - reference: PMID:40923306
    reference_title: "Abnormal zona pellucida and follicular development in ZP1-mutant macaques."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following sexual maturation, oocytes retrieved from #ZP1-2 through
      superovulation exhibited a marked increase in zona pellucida-deficient oocytes
      and a significant reduction in maturation rates compared to controls.
      Integrated analyses, including immunofluorescence staining, transmission
      electron microscopy, transcriptomic profiling of oocytes, and histopathological
      examination of ovarian tissue, revealed disrupted folliculogenesis and oocyte
      anomalies consistent with phenotypes observed in human empty follicle syndrome.
    explanation: >-
      Establishes the cynomolgus macaque CRISPR ZP1 model showing ZP-deficient
      oocytes, disrupted folliculogenesis, and reduced oocyte maturation consistent
      with human empty follicle syndrome.
- name: Zp1-null knockout mouse (Zp1tm/tm)
  species: Mus musculus
  genotype: Zp1-/- (Zp1tm/tm null)
  background: C57BL/6
  genes:
  - preferred_term: ZP1
    term:
      id: hgnc:13187
      label: ZP1
  publication: PMID:10433913
  description: >-
    Unlike humans and rats, mice possess only three functional zona pellucida genes
    (Zp1, Zp2, and Zp3, with Zp4 pseudogenized). Homozygous Zp1-null female mice
    still assemble a loosely organized, porous zona pellucida matrix composed of
    mZP2 and mZP3, with ectopic clusters of granulosa cells trapped in the perivitelline
    space. Zp1-null female mice remain fertile with reduced litter sizes (~50% of
    wild-type) due to fragile cleavage-stage embryos and precocious hatching in the
    oviduct, making the mouse knock-out a milder structural phenotype than the
    truncating/missense ZP1 mutations seen in humans and knock-in rats.
  modeled_mechanisms:
  - target: Failure of ZP1-N1 Disulfide Cross-Linking and Zona Pellucida Extracellular Matrix Assembly
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates loss of ZP1 filament cross-linking and porous ZP architecture,
      but mice retain an uncross-linked ZP2/ZP3 coat and remain subfertile rather
      than completely sterile.
  evidence:
  - reference: PMID:10433913
    reference_title: "Abnormal zonae pellucidae in mice lacking ZP1 result in early embryonic loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although a zona pellucida composed of ZP2 and ZP3 was formed around growing
      Zp1(tm/tm) oocytes, the matrix was more loosely organized than zonae around
      normal oocytes. In some Zp1 null follicles, this structural abnormality
      resulted in ectopic clusters of granulosa cells, lodged between the zona matrix
      and the oolemma, that perturbed normal folliculogenesis. Comparable numbers of
      eggs were ovulated from Zp1 null females and normal females following hormonal
      stimulation. However, after mating with males, fewer two-cell embryos were
      recovered from Zp1 null females, and their litters were significantly smaller
      than those produced by normal mice.
    explanation: >-
      Characterizes the Zp1-null mouse model, showing a loosely organized ZP2/ZP3
      matrix, ectopic perivitelline granulosa cells, and reduced fertility due to
      early embryonic loss.

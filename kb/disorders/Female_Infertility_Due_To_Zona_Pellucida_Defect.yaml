- name: Defective Sperm-Zona Pellucida Recognition and Fertilization Failure
  description: >-
    In patients whose oocytes survive follicular aspiration as viable metaphase II (MII)
    gametes despite an absent or severely thinned zona pellucida, the naked oolemma

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry using ovarian serial sections demonstrated that all
      preantral follicles had normal architecture, but with a thin ZP, lacking ZP1,
      surrounding the growing oocytes. The antral follicles were also defective in
      normal cumulus-oocyte complex organisation, leading us to speculate that the
      lack of ZP1 might lead to oocyte degeneration or increased fragility of the
      oocyte during follicular puncture, ultimately resulting in EFS.
    explanation: >-
      Human ovarian biopsy immunohistochemistry demonstrates that ZP1 deficiency
      permits a thin ZP in preantral follicles that fails to maintain cumulus-oocyte
      complex organization in antral follicles.
  - reference: PMID:36476320
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lack of ZP might interfere with the bidirectional communication between oocytes
      and cumulus cells, then impedes nutritional supplements from cumulus cells
      leading to oocyte degeneration or increases in the fragility of oocytes during
      follicular puncture, ultimately resulting in EFS [8, 53, 70].
    explanation: >-
      Explains how absence of the ZP disrupts bidirectional oocyte-cumulus cell
      communication and nutrient supply, causing oocyte degeneration or mechanical
      rupture during aspiration.
  - reference: PMID:40923306
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Collectively, these data suggest that ZP1 deficiency induces oxidative stress
      and mitochondrial dysregulation, leading to increased autophagy and eventual
      oocyte degeneration. Supporting this conclusion, TEM analysis further revealed
      extensive mitochondrial swelling in #ZP1-2 oocytes at both the GV and MII
      stages (Figure 6E).
    explanation: >-
      Single-oocyte multi-omics and electron microscopy in ZP1-mutant macaques
      demonstrate oxidative stress, mitochondrial swelling, and autophagy driving
      oocyte degeneration.
- name: Defective Sperm-Zona Pellucida Recognition and Fertilization Failure
  description: >-
    In patients whose oocytes survive follicular aspiration as viable metaphase II (MII)
    gametes despite an absent or severely thinned zona pellucida, the naked oolemma
    lacks the ZP glycoprotein matrix required for normal species-specific sperm binding,
    acrosome reaction induction, and block to polyspermy. Consequently, conventional
    in vitro fertilization (IVF) fails completely, whereas direct intracytoplasmic
    sperm injection (ICSI) into the ooplasm can bypass the extracellular ZP defect.
  cell_types:
  - preferred_term: oocyte
    term:
      id: CL:0000023
      label: oocyte
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary

- name: Recombinant Human Growth Hormone for Selected IHH-Related Short Stature
  description: >-
    rhGH may be considered for clinically significant short stature in selected
    IHH-related cases; evidence is limited to a two-sibling case report and does
    not show correction of the hand malformation.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: growth hormone therapy
    term:
      id: NCIT:C15445
      label: Hormone Therapy
  evidence:
  - reference: PMID:38840672
    reference_title: "Short stature with brachydactyly caused by a novel mutation in the IHH gene and response to 4-year growth hormone therapy: a case report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After treatment, the siblings' height improved significantly, and they
      acquired a significant increase in the height standard deviation score
      (SDS) (the boy: +2.54, the girl: +1.86) during the 4-year therapy. No
      noticeable adverse effect was observed during rhGH treatment.
    explanation: Two siblings improved over four years, but uncontrolled case-level evidence limits generalization.

name: Brachydactyly Type A1
synonyms:
- Brachydactyly type A1, IHH-related
creation_date: '2026-02-13T00:31:42Z'
category: Mendelian
description: >
  Brachydactyly type A1 (BDA1) is the first recorded Mendelian autosomal dominant
  disorder in humans, originally identified by Farabee in 1903. It is characterized
  by shortening or absence of the middle phalanges. BDA1 is genetically
  heterogeneous: pathogenic variants in IHH disrupt Hedgehog signaling, while
  variants in GDF5 or its preferred receptor BMPR1B perturb BMP-SMAD signaling.
  These pathways converge on chondrocyte differentiation, endochondral
  ossification, and specification of phalangeal segments in both hands and feet.
disease_term:
  preferred_term: brachydactyly type A1
  term:

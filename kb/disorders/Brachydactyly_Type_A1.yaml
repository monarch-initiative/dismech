    explanation: >-
      Functional analysis shows that the BDA1-associated GDF5 allele has
      reduced chondrogenic activity.
  - reference: PMID:25758993
    reference_title: "Two novel disease-causing variants in BMPR1B are associated with brachydactyly type A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate that BMPR1B is another gene involved with the pathogenesis of BDA1 and illustrates the continuum of phenotypes between BDA1 and BDA2."
    explanation: >-
      Human genetic findings establish BMPR1B-associated BDA1 and place it in
      the same BMP-signaling spectrum.
  downstream:
  - target: Disrupted Chondrocyte Differentiation and Digit Segment Specification
    description: >-
      Reduced GDF5 ligand activity or BMPR1B receptor activity impairs
      chondrogenesis and digit formation upstream of phalangeal segment

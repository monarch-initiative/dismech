      label: smoothened signaling pathway
    modifier: DECREASED
  - preferred_term: Endochondral Ossification
    term:
      id: GO:0001958
      label: endochondral ossification
    modifier: ABNORMAL
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations in IHH, which encodes Indian hedgehog, cause BDA-1"
    explanation: "Identifies IHH as the causative gene for BDA1."
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three heterozygous missense mutations in the region encoding the amino-terminal signaling domain"
    explanation: "Mutations cluster in the IHH N-terminal signaling domain."
  - reference: PMID:21537345
    reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "all three mutations affected Hh binding to the receptor Patched1 (PTC1), reducing its capacity to induce cellular differentiation"
    explanation: "Demonstrates that BDA1 mutations impair IHH-Patched1 receptor binding and reduce signaling capacity."
  downstream:
  - target: Disrupted Chondrocyte Differentiation and Digit Segment Specification
    description: >-
      Reduced receptor binding and signaling capacity impair the
      IHH-dependent differentiation program that patterns phalangeal segments.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced Patched1 binding and Smoothened-pathway output
    evidence:
    - reference: PMID:21537345
      reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "all three mutations affected Hh binding to the receptor Patched1 (PTC1), reducing its capacity to induce cellular differentiation"
      explanation: >-
        Functional assays connect defective IHH-Patched1 binding to reduced
        cellular differentiation.
- name: IHH Protein Instability and Trafficking Defects
  role: trigger
  description: >
    BDA1 mutations also affect IHH protein stability, intracellular
    trafficking, and interaction with extracellular matrix components.
    The E95K and D100E mutations cause temperature-sensitive and
    calcium-dependent instability of the IHH N-terminal domain, leading
    to increased lysosomal degradation and reduced secretion. These
    multi-level effects on Hedgehog signaling compound the receptor
    binding defect.
  gene:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  biological_processes:
  - preferred_term: Chondrocyte Differentiation
    term:
      id: GO:0002062
      label: chondrocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:21537345
    reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "E95K and D100E mutations led to a temperature-sensitive and calcium-dependent instability of IhhN"
    explanation: "Shows that specific BDA1 mutations cause protein instability under physiological conditions."
  - reference: PMID:21537345
    reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "these IHH mutations affect Hh signaling at multiple levels, causing abnormal bone development and abnormal digit formation"
    explanation: "Establishes the multi-level disruption of Hedgehog signaling as the pathogenic mechanism."
  - reference: PMID:40606564
    reference_title: "A Novel Heterozygous IHH c.331_333del Mutation Identified in a Fetus with Brachydactyly Type A1 Causes IHH Protein Maturation Failure in HEK293T Cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Western blotting analysis of HEK293T cells in overexpression transfection
      experiments revealed that the Leu111del mutation led to an increase in the
      level of the IHH precursor and a reduction in the level of functional IHH
      protein compared with those in HEK293T cells expressing wild-type IHH,
      indicating that this mutation might cause IHH protein dysmaturity.
    explanation: Directly demonstrates precursor accumulation and loss of mature functional IHH.
  downstream:
  - target: Disrupted Chondrocyte Differentiation and Digit Segment Specification
    description: >-
      Instability, intracellular degradation, and altered extracellular
      interactions reduce the effective range of IHH signaling during digit
      development.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - mutation-dependent loss of stable and correctly trafficked IHH signaling protein
    evidence:
    - reference: PMID:21537345
      reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The combination of these features alters signaling capacity and range, but the impact is likely to be variable and mutation-dependent."
      explanation: >-
        The experimental study links altered IHH stability, fate, and
        extracellular interactions to reduced signaling capacity and range.
- name: Reduced GDF5-BMPR1B Signaling
  conforms_to: "limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation"
  role: trigger
  description: >-
    A second BDA1 mechanism affects the BMP-SMAD arm of digit development.
    GDF5 is the preferred ligand for BMPR1B and promotes chondrogenesis and
    digit formation. Semidominant loss-of-function GDF5 variants or
    dominant-negative BMPR1B variants reduce this signaling input and can
    produce the same middle-phalanx pattern as IHH-associated BDA1.

genetic:
- name: IHH Pathogenic Variants
  gene_term:
    preferred_term: IHH
    term:
      id: hgnc:5956
      label: IHH
  association: CAUSAL
  notes: >
    Heterozygous pathogenic IHH variants are the canonical cause of BDA1.
    Classic alleles are missense substitutions in the N-terminal signaling
    domain (including E95K, D100E, and E131K), but pathogenic in-frame
    deletions have also been demonstrated. Effects include altered stability,
    receptor binding, trafficking, and extracellular interactions.
  evidence:
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three heterozygous missense mutations in the region encoding the amino-terminal signaling domain in all affected members of three large, unrelated families"
    explanation: "Three independent families with distinct IHH missense mutations establish genotype-phenotype relationship."
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The three mutant amino acids, which are conserved across all vertebrates and invertebrates studied so far, are predicted to be adjacent on the surface of IHH"
    explanation: "Deep evolutionary conservation and surface clustering suggest a critical functional domain."
  - reference: PMID:21537345
    reference_title: "Indian hedgehog mutations causing brachydactyly type A1 impair Hedgehog signal transduction at multiple levels."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterozygous missense mutations in the Indian Hedgehog (IHH) gene have been identified as a cause of BDA1"
    explanation: "Confirms IHH missense mutations as the established cause of BDA1."
  - reference: PMID:18629882
    reference_title: "Deletion of 1 amino acid in Indian hedgehog leads to brachydactylyA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report here on the first deletion in IHH, p.delE95, causing mild BrachydactylyA1 in a small Dutch family."
    explanation: >-
      Expands the established pathogenic spectrum beyond missense variants to
      an in-frame IHH deletion.
- name: GDF5 Pathogenic Variants
  gene_term:
    preferred_term: GDF5
    term:
      id: hgnc:4220
      label: GDF5
  association: CAUSAL
  notes: >-
    Semidominant GDF5 variants can produce mild BDA1 in heterozygotes and a
    more severe phenotype in homozygotes. Reduced ligand activity impairs
    chondrogenesis upstream of IHH.
  evidence:
  - reference: PMID:20683927
    reference_title: "Mutations in GDF5 presenting as semidominant brachydactyly A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the GDF5 coding region revealed that a mildly affected individual in the family was heterozygous, and that all of the severely affected individuals were homozygous for a novel missense c.1195C>T mutation that predicts a p.Arg399Cys substitution at a highly conserved amino acid."
    explanation: >-
      Segregation in a consanguineous family demonstrates dosage-dependent
      GDF5-associated BDA1.
  - reference: PMID:20683927
    reference_title: "Mutations in GDF5 presenting as semidominant brachydactyly A1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis demonstrated that although the p.Arg399Cys mutant is able to stimulate chondrogenesis, it is much less effective than wild-type GDF5."
    explanation: >-
      Functional assays show reduced chondrogenic activity of the
      BDA1-associated GDF5 allele.
- name: BMPR1B Pathogenic Variants
  gene_term:
    preferred_term: BMPR1B
    term:
      id: hgnc:1077
      label: BMPR1B
  association: CAUSAL
  notes: >-
    Heterozygous missense and splice-site BMPR1B variants have been reported
    in complex BDA1 and are predicted to act through a dominant-negative
    mechanism, illustrating phenotypic continuity between BDA1 and BDA2.
  evidence:
  - reference: PMID:25758993
    reference_title: "Two novel disease-causing variants in BMPR1B are associated with brachydactyly type A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report pathogenic variants in BMPR1B that are associated with complex BDA1."
    explanation: >-
      The human genetic study identifies BMPR1B variants in individuals with
      complex BDA1.
  - reference: PMID:25758993
    reference_title: "Two novel disease-causing variants in BMPR1B are associated with brachydactyly type A1."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Both mutations are most likely to act in a dominant-negative manner, similar to the effects observed in BMPR1B mutations that cause BDA2."
    explanation: >-
      The authors interpret the two BDA1-associated BMPR1B variants as
      dominant-negative alleles.
diagnosis:
- name: Clinical-radiographic and molecular diagnosis
  description: >-
    Diagnosis is supported by the characteristic clinical and radiographic
    pattern of shortened or absent middle phalanges and confirmed by
    identifying a pathogenic variant in IHH, GDF5, or BMPR1B when molecularly solved.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Characteristic middle-phalanx shortening or absence, with detection of a causal IHH, GDF5, or BMPR1B variant when present.
  evidence:
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brachydactyly type A-1 (BDA-1; MIM 112500) is characterized by shortening or missing of the middle phalanges"
    explanation: The defining skeletal pattern provides the clinical-radiographic basis for diagnosis.
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that mutations in IHH, which encodes Indian hedgehog, cause BDA-1."
    explanation: This supports IHH molecular testing as confirmatory for BDA1.
  - reference: PMID:20683927
    reference_title: "Mutations in GDF5 presenting as semidominant brachydactyly A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This data confirms genetic heterogeneity in BDA1, demonstrates that mutations upstream of IHH can result in BDA1, and shows that BDA1 can result from semidominant mutations in GDF5."
    explanation: Supports including GDF5 in molecular confirmation of genetically heterogeneous BDA1.
  - reference: PMID:25758993
    reference_title: "Two novel disease-causing variants in BMPR1B are associated with brachydactyly type A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

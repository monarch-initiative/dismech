- name: Disrupted Chondrocyte Differentiation and Digit Segment Specification
  conforms_to: "limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification"
  role: central_effector
  description: >-
    Hedgehog and BMP-SMAD lesions converge on impaired chondrocyte
    differentiation and endochondral ossification. The resulting disturbance
    of embryonic limb morphogenesis preferentially shortens or eliminates
    middle phalangeal segments, with variable effects on the first digits,
    metacarpals, and overall skeletal growth.

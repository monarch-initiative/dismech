    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    Autosomal dominant inheritance, historically the first recorded
    Mendelian autosomal dominant trait in humans (Farabee 1903). Some
    GDF5-associated families show semidominant dosage, with a mild phenotype in
    heterozygotes and more severe disease in homozygotes.
  evidence:
  - reference: PMID:11455389
    reference_title: "Mutations in IHH, encoding Indian hedgehog, cause brachydactyly type A-1."
    supports: SUPPORT
    snippet: "first recorded example of a human anomaly with Mendelian autosomal-dominant inheritance"
    explanation: "BDA1 is historically significant as the first documented autosomal dominant human trait."
  - reference: PMID:20683927
    reference_title: "Mutations in GDF5 presenting as semidominant brachydactyly A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This data confirms genetic heterogeneity in BDA1, demonstrates that mutations upstream of IHH can result in BDA1, and shows that BDA1 can result from semidominant mutations in GDF5."
    explanation: >-
      A family study establishes the semidominant GDF5-associated form within
      the genetically heterogeneous BDA1 spectrum.

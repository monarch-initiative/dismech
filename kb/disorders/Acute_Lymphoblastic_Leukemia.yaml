    Karyotype, cellular DNA-content assessment, FISH, fusion testing, and
    copy-number or sequencing assays identify subtype-defining rearrangements,
    aneuploidy, and cryptic lesions. The selected assay set must cover both
    established and newly recognized B- and T-ALL entities.
  results: >-
    A defining fusion, ploidy state, rearrangement, or molecular profile assigns
    the corresponding subtype and informs risk and targeted-treatment choices.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Chromosomal analysis still plays an important role in the initial
      cytogenetic work-up. RT-PCR, FISH/multiplex ligation-dependent probe
      amplification, and flow cytometry are used to identify leukaemia-specific
      translocations, submicroscopic chromosomal abnormalities, and cellular
      DNA content, respectively.
    explanation: >-
      The review directly supports complementary cytogenetic and molecular
      approaches to defining ALL lesions.
  - reference: PMID:38295337
    reference_title: "Diagnosis, prognostic factors, and assessment of ALL in adults: 2024 ELN recommendations from a European expert panel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The European Working Group for Adult ALL has therefore summarized the
      current state of the art and provided comprehensive consensus
      recommendations for diagnostic approaches, biologic and clinical
      characterization, prognostic factors, and risk stratification as well as
      definitions of endpoints and outcomes.
    explanation: >-
      Current ELN consensus supports integrated diagnosis, biologic
      characterization, and risk stratification in adults.
- name: Post-Treatment MRD Response Assessment
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  description: >-
    Flow cytometry or clonotype-based high-throughput sequencing measures
    residual disease at protocol-defined response milestones. This is a
    monitoring and prognostic assessment after the initial diagnosis, not a
    replacement for lineage or subtype classification.
  results: >-
    Detectable residual leukemic cells or clonotypes quantify response depth
    and contribute to risk-adapted management, with assay-specific sensitivity
    and thresholds reported explicitly.
  evidence:
  - reference: PMID:18388178
    reference_title: "Clinical significance of minimal residual disease in childhood acute lymphoblastic leukemia and its relationship to other prognostic factors: a Children's Oncology Group study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of MRD in day-8 blood and day-29 marrow MRD was associated
      with shorter event-free survival (EFS) in all risk groups
    explanation: >-
      Timed flow-cytometric MRD measurements carry prognostic information after
      therapy in pediatric precursor B-ALL.
  - reference: PMID:29284596
    reference_title: Measurable residual disease detection by high-throughput sequencing improves risk stratification for pediatric B-ALL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The higher analytic sensitivity and lower false-negative rate of HTS
      improves upon FC for MRD detection in pediatric B-ALL
    explanation: >-
      The paired-sample study supports high-throughput sequencing as a more
      analytically sensitive MRD method in its pediatric B-ALL context.

differential_diagnoses:
- name: Acute Myeloid Leukemia
  disease_term:
    preferred_term: acute myeloid leukemia
    term:
      id: MONDO:0018874
      label: acute myeloid leukemia
  description: >-
    AML can also present with an acute marrow blast process and cytopenias, so
    lineage must be assigned rather than inferred from morphology alone.
  distinguishing_features:
  - A coherent myeloid rather than precursor B- or T-lineage immunophenotype supports AML.
  - Integrated cytogenetic and molecular findings can identify an AML-defining entity.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Morphological identification of lymphoblasts by microscopy and
      immunophenotypic determination of lineage commitment and developmental
      stage by flow cytometry are essential for correct diagnosis of ALL.
    explanation: >-
      The source establishes lineage immunophenotyping as essential for ALL;
      its use here to distinguish an acute myeloid process is conservative and
      therefore marked partial.
- name: Mixed-Phenotype Acute Leukemia
  description: >-
    Mixed-phenotype acute leukemia enters the differential when the blast
    population meets lineage-defining criteria for more than one lineage or
    distinct blast populations establish different lineages.
  distinguishing_features:
  - Apply lineage-defining immunophenotypic criteria rather than labeling ambiguous marker expression as ALL.
  - Integrate recurrent fusion and cytogenetic results because they may alter entity assignment.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Morphological identification of lymphoblasts by microscopy and
      immunophenotypic determination of lineage commitment and developmental
      stage by flow cytometry are essential for correct diagnosis of ALL.
    explanation: >-
      The source supports explicit lineage assignment but does not enumerate
      mixed-phenotype criteria, so support is partial.
- name: Lymphoblastic Lymphoma
  description: >-
    Lymphoblastic lymphoma and ALL form a biologic spectrum. A tissue-predominant
    mass with limited marrow or blood disease favors the lymphoma designation,
    while a leukemic marrow or blood presentation favors ALL; classification
    should follow the applicable contemporary framework.
  distinguishing_features:
  - Establish the anatomic distribution and marrow or blood blast burden rather than relying on lineage alone.
  - Retain B- versus T-lineage and genomic subtype information across the leukemia-lymphoma spectrum.
  evidence:
  - reference: PMID:36422706
    reference_title: International Consensus Classification of acute lymphoblastic leukemia/lymphoma.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The updated International Consensus Classification (ICC) of B-acute
      lymphoblastic leukemia (B-ALL) and T-acute lymphoblastic leukemia (T-ALL)
      includes both revisions to subtypes previously outlined in the 2016 WHO
      classification and several newly described entities.
    explanation: >-
      The ICC supports shared lineage and genomic taxonomy across
      ALL/lymphoblastic lymphoma, while the excerpt does not provide a numeric
      marrow boundary and is marked partial.

treatments:
- name: Risk-Adapted Multi-Agent Chemotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  role: Backbone therapy
  context: Regimen, intensity, and phase vary by age, lineage, molecular risk, MRD response, and protocol.
  description: >-
    Multi-agent induction followed by protocol-defined consolidation,
    intensification, and maintenance remains a treatment backbone. This entry
    deliberately avoids presenting one drug list, dose, remission percentage,
    or pediatric/adult regimen as universal across biologically and clinically
    heterogeneous ALL.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: Cytotoxic combination therapy reduces the leukemic-cell burden and permits recovery of normal hematopoiesis.
    evidence:
    - reference: PMID:23523389
      reference_title: Acute lymphoblastic leukaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Four to 6 weeks of remission-induction treatment eradicates the initial
        leukaemic cell burden and restores normal haematopoiesis in 96–99% of
        children and 78–92% of adults.
      explanation: >-
        The review directly connects induction treatment with reduced leukemic
        burden and restored hematopoiesis; its era- and population-specific
        response ranges remain contextual evidence rather than universal fields.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The chemotherapy agents typically include a glucocorticoid (prednisone
      or dexamethasone), vincristine, and asparaginase, with or without
      anthracycline.
    explanation: >-
      The review supports the multi-agent nature of induction while the entry
      defers exact composition and intensity to the applicable protocol.
  - reference: PMID:38306595
    reference_title: "Management of ALL in adults: 2024 ELN recommendations from a European expert panel."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The current recommendation summarizes clinical management. It covers
      treatment approaches, including the use of new immunotherapies,
      application of minimal residual disease for treatment decisions,
      management of specific subgroups, and challenging treatment situations as
      well as late effects and supportive care.
    explanation: >-
      Current adult ELN guidance supports treatment selection that integrates
      MRD, subgroup biology, difficult clinical contexts, and supportive care.
- name: CNS-Directed Intrathecal Chemotherapy
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  role: CNS prophylaxis or treatment
  context: Protocol-defined intrathecal therapy; intensity increases with CNS disease or other high-risk features.
  description: >-
    Intrathecal methotrexate-based combination therapy is used to prevent or
    control CNS leukemia. Cranial irradiation is not represented as a routine
    default because contemporary protocols often reduce or omit it to limit
    late toxicity.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  target_mechanisms:
  - target: Extramedullary Leukemic Involvement
    treatment_effect: INHIBITS
    description: Intrathecal therapy reduces or prevents leukemic burden in the CNS sanctuary compartment.
    evidence:
    - reference: PMID:23523389
      reference_title: Acute lymphoblastic leukaemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Control of CNS disease is a key component of ALL therapy.
      explanation: The review directly establishes CNS disease control as a core treatment objective.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      protocols replaced cranial irradiation with triple intrathecal chemotherapy
      (methotrexate, hydrocortisone, and cytarabine) for all newly diagnosed
      patients
    explanation: >-
      Protocol evidence supports triple intrathecal chemotherapy as a
      CNS-directed strategy while avoiding a claim that one schedule is universal.
- name: ABL-Directed Tyrosine Kinase Inhibitor Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  role: Molecularly targeted component
  context: Ph-positive B-ALL; agent and combination depend on mutation, prior therapy, toxicity, and protocol.
  description: >-
    ABL tyrosine-kinase inhibition is directed at the BCR::ABL1 dependency of
    Ph-positive B-ALL. Ponatinib retains activity against many kinase-domain
    resistance variants, but vascular and other toxicities require specialist
    selection and monitoring. Results from a single-centre phase 2 study of
    ponatinib plus blinatumomab are encouraging rather than proof that one combination
    should replace every established regimen.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: ponatinib
      term:
        id: CHEBI:78543
        label: ponatinib
  target_mechanisms:
  - target: Kinase-Activated B-ALL Signaling
    treatment_effect: INHIBITS
    description: ABL kinase inhibition suppresses BCR::ABL1-dependent signaling in Ph-positive B-ALL.
    evidence:
    - reference: PMID:28665419
      reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Ponatinib, a third-generation TKI with the ability to inhibit most
        BCR-ABL1 kinase domain mutations, has recently gained approval for
        resistant Ph-positive ALL.
      explanation: >-
        The review directly supports ponatinib-mediated inhibition across many
        BCR::ABL1 kinase-domain variants in resistant Ph-positive ALL.
  evidence:
  - reference: PMID:36402146
    reference_title: "Ponatinib and blinatumomab for Philadelphia chromosome-positive acute lymphoblastic leukaemia: a US, single-centre, single-arm, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The chemotherapy-free combination of ponatinib and blinatumomab resulted
      in high rates of complete molecular response in patients with newly
      diagnosed and relapsed or refractory Ph-positive acute lymphoblastic
      leukaemia.
    explanation: >-
      The phase 2 trial supports activity of the combination in its studied
      population; the entry explicitly retains the single-centre, single-arm limitation.
- name: Blinatumomab CD19-CD3 Bispecific Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  role: B-lineage immunotherapy
  context: Use depends on disease phase, antigen expression, MRD state, prior therapy, and protocol.
  description: >-
    Blinatumomab brings CD3-positive T cells into proximity with CD19-positive
    B-lineage blasts. Its established contexts include relapsed/refractory and
    MRD-directed use; E1910 additionally supports incorporation into
    consolidation for adults in MRD-negative remission from B-cell precursor ALL.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: blinatumomab
      term:
        id: NCIT:C62528
        label: Blinatumomab
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: CD19-CD3 engagement creates cytolytic synapses that kill CD19-positive B-lineage blasts.
    evidence:
    - reference: PMID:39047240
      reference_title: Blinatumomab for MRD-Negative Acute Lymphoblastic Leukemia in Adults.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Blinatumomab is a bispecific T-cell engager molecule composed of an
        anti-CD19 variable region linked to an anti-CD3 variable region that
        brings T cells in proximity to leukemic blasts to form cytolytic
        synapses, leading to apoptosis and lysis of the blasts.
      explanation: The trial report directly states the CD19-CD3 cytolytic mechanism.
  evidence:
  - reference: PMID:39047240
    reference_title: Blinatumomab for MRD-Negative Acute Lymphoblastic Leukemia in Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The addition of blinatumomab to consolidation chemotherapy in adult
      patients in MRD-negative remission from BCP-ALL significantly improved
      overall survival.
    explanation: >-
      Randomized E1910 evidence supports consolidation blinatumomab in the
      explicitly stated adult MRD-negative remission population.
- name: Inotuzumab Ozogamicin CD22-Directed Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  role: B-lineage antibody-drug conjugate
  context: Relapsed or refractory CD22-positive B-lineage ALL; hepatotoxicity and transplant sequencing require specialist management.
  description: >-
    Inotuzumab ozogamicin binds CD22 and delivers calicheamicin intracellularly,
    causing DNA double-strand breaks and apoptosis. Its relapsed/refractory
    benefit must be balanced against serious toxicities, including hepatic
    veno-occlusive disease reported in trials.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: inotuzumab ozogamicin
      term:
        id: NCIT:C71542
        label: Inotuzumab Ozogamicin
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: CD22-mediated internalization delivers calicheamicin to B-lineage blasts and induces apoptotic DNA damage.
    evidence:
    - reference: PMID:28665419
      reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Inotuzumab ozogamicin (InO) is a monoclonal antibody against CD22 that
        is conjugated to calicheamicin, a potent cytotoxic compound that induces
        double-strand DNA breaks.
      explanation: The review directly supports CD22 targeting and the conjugated cytotoxic mechanism.
  evidence:
  - reference: PMID:27292104
    reference_title: Inotuzumab Ozogamicin versus Standard Therapy for Acute Lymphoblastic Leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rate of complete remission was significantly higher in the inotuzumab
      ozogamicin group than in the standard-therapy group
    explanation: >-
      Randomized phase 3 evidence supports superior remission rates in adults
      with relapsed or refractory ALL; the population and endpoint remain explicit.

- name: Tisagenlecleucel CD19 CAR-T Cell Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  role: Autologous cellular immunotherapy
  context: Pediatric and young adult relapsed or refractory B-cell ALL within authorized and specialist-program criteria.
  description: >-
    Autologous T cells engineered with a CD19-directed chimeric antigen receptor
    can expand and persist after infusion and produce durable remissions in
    relapsed or refractory B-cell ALL. Cytokine-release syndrome, neurologic
    toxicity, B-cell aplasia, manufacturing feasibility, and eligibility
    require specialist management.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: tisagenlecleucel
      term:
        id: NCIT:C102758
        label: Tisagenlecleucel
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: CD19-directed CAR T cells recognize and eliminate CD19-positive B-lineage blasts.
    evidence:
    - reference: PMID:29385370
      reference_title: Tisagenlecleucel in Children and Young Adults with B-Cell Lymphoblastic Leukemia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this global study of CAR T-cell therapy, a single infusion of
        tisagenlecleucel provided durable remission with long-term persistence
        in pediatric and young adult patients with relapsed or refractory
        B-cell ALL, with transient high-grade toxic effects.
      explanation: >-
        The global multicentre study supports durable remission and cellular
        persistence in the explicitly scoped pediatric and young-adult population.
  evidence:
  - reference: PMID:29385370
    reference_title: Tisagenlecleucel in Children and Young Adults with B-Cell Lymphoblastic Leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this global study of CAR T-cell therapy, a single infusion of
      tisagenlecleucel provided durable remission with long-term persistence in
      pediatric and young adult patients with relapsed or refractory B-cell ALL,
      with transient high-grade toxic effects.
    explanation: >-
      This supports tisagenlecleucel efficacy and also preserves the reported
      high-grade-toxicity qualification.
- name: Investigational Allogeneic CD19 CAR-T Cell Therapy (Phase 1)
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  role: Investigational phase 1 therapy
  context: Small single-arm phase 1 cohort in relapsed or refractory B-cell ALL; not established standard care.
  description: >-
    A non-gene-edited allogeneic CD19 CAR-T product showed early antileukemic
    activity without observed graft-versus-host disease in a very small phase 1
    study. The cohort size, single-arm design, toxicities, and limited survival
    estimates preclude treating this approach as established or equivalent to
    authorized autologous CAR-T therapy.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: Donor-derived CD19-directed CAR T cells are intended to eliminate CD19-positive B-lineage blasts.
    evidence:
    - reference: PMID:42237011
      reference_title: "Non-gene-edited, CD19-targeted, allogeneic CAR-T cell therapy for relapsed or refractory B-cell acute lymphoblastic leukemia: an open-label, single-arm phase 1 study."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        At day 28, 8 of 9 evaluable patients achieved complete remission (CR)
        or CR with incomplete hematologic recovery (CRi).
      explanation: >-
        The small phase 1 cohort provides early clinical activity consistent
        with blast elimination but does not establish comparative efficacy.
  evidence:
  - reference: PMID:42237011
    reference_title: "Non-gene-edited, CD19-targeted, allogeneic CAR-T cell therapy for relapsed or refractory B-cell acute lymphoblastic leukemia: an open-label, single-arm phase 1 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: No GVHD was observed.
    explanation: >-
      Absence of observed GVHD in this tiny cohort is a safety observation, not
      proof that the platform eliminates GVHD risk.
  - reference: PMID:42237011
    reference_title: "Non-gene-edited, CD19-targeted, allogeneic CAR-T cell therapy for relapsed or refractory B-cell acute lymphoblastic leukemia: an open-label, single-arm phase 1 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At day 28, 8 of 9 evaluable patients achieved complete remission (CR) or
      CR with incomplete hematologic recovery (CRi).
    explanation: >-
      The response result is explicitly contextualized as nine evaluable
      patients in an open-label, single-arm phase 1 study.
- name: Nelarabine-Containing Therapy for T-ALL
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  role: T-lineage-directed chemotherapy component
  context: T-ALL; frontline incorporation or relapsed/refractory use depends on age, protocol, prior therapy, and neurotoxicity risk.
  description: >-
    Nelarabine is converted to a purine nucleoside analogue that preferentially
    accumulates in T cells, incorporates into DNA, inhibits DNA synthesis, and
    induces apoptosis. Randomized AALL0434 evidence supports its addition to an
    augmented BFM backbone in children and young adults with newly diagnosed T-ALL.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Common Lymphoblast Clonal Expansion
    treatment_effect: INHIBITS
    description: DNA incorporation inhibits synthesis and induces apoptosis in T-lineage lymphoblasts.
    evidence:
    - reference: PMID:28665419
      reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Nelarabine accumulates in T cells at a high rate and incorporates into
        DNA causing an inhibition of DNA synthesis and subsequent apoptosis.
      explanation: The review directly states the T-cell-selective cytotoxic mechanism.
  evidence:
  - reference: PMID:32813610
    reference_title: "Children's Oncology Group AALL0434: A Phase III Randomized Clinical Trial Testing Nelarabine in Newly Diagnosed T-Cell Acute Lymphoblastic Leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The addition of nelarabine to ABFM therapy improved DFS for children and
      young adults with newly diagnosed T-ALL without increased toxicity.
    explanation: >-
      Randomized phase 3 evidence supports addition of nelarabine in the
      specified pediatric and young-adult frontline context.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  role: Selected high-risk or relapsed-disease consolidation
  context: Eligibility and timing depend on age, comorbidity, remission, MRD, genotype, donor, prior therapy, and protocol.
  description: >-
    Allogeneic transplantation is reserved for selected patients rather than
    applied uniformly across ALL. The balance among relapse risk, transplant
    morbidity and mortality, modern immunotherapies, and MRD response requires
    protocol- and patient-specific assessment.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:28665419
    reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Despite advances in management, the backbone of therapy remains
      multi-agent chemotherapy with vincristine, corticosteroids and an
      anthracycline with allogeneic stem cell transplantation for eligible candidates.
    explanation: >-
      The review supports transplantation for eligible patients, while current
      selection has evolved and is therefore represented cautiously as partial support.
  - reference: PMID:38306595
    reference_title: "Management of ALL in adults: 2024 ELN recommendations from a European expert panel."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      It covers treatment approaches, including the use of new immunotherapies,
      application of minimal residual disease for treatment decisions,
      management of specific subgroups, and challenging treatment situations as
      well as late effects and supportive care.
    explanation: >-
      Current ELN guidance supports integrating MRD, newer immunotherapy, and
      subgroup context into adult treatment decisions; the abstract does not
      state a universal transplant indication.
- name: Supportive and Toxicity-Directed Care
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  role: Supportive care throughout treatment
  context: Individualized infection, transfusion, tumor-lysis, thrombosis, organ-toxicity, fertility, psychosocial, and survivorship management.
  description: >-
    ALL treatment requires preventive and responsive supportive care across

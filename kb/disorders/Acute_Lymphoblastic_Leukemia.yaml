  title: Exome sequencing identifies mutation of the ribosome in T-cell acute lymphoblastic leukemia
  description: Acute lymphoblastic leukemia (ALL) is the most common pediatric malignancy and responds well to therapy in children, but not in adults. We used exome sequencing of 67 T-cell ALL (T- ALL) samples to gain insight in the mutational spectrum and age related differences of these leukemias. We detected protein-altering mutations in 508 genes, with an average of 8.2 mutations in pediatric and 21.0 in adult T-ALL. Based on stringent filtering, we predict 15 of these genes to be drivers, including 7 genes that were not previously implicated in T-ALL.

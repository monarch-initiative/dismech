biochemical:
- name: Measurable Residual Disease
  presence: VARIABLE
  notes: >-
    MRD is a post-treatment quantitative readout of residual leukemic burden,
    not a substitute for initial lineage and genomic diagnosis. Flow cytometry
    is established, while high-throughput clonotype sequencing can detect
    additional low-level disease in pediatric B-ALL. Results must be interpreted
    at protocol-defined time points and assay thresholds.
  readouts:
  - target: Common Lymphoblast Clonal Expansion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Detectable MRD after therapy reports persistence of the leukemic clone;
      lower or undetectable signal reports deeper response within the limits of
      the assay used.
    evidence:
    - reference: PMID:18388178
      reference_title: "Clinical significance of minimal residual disease in childhood acute lymphoblastic leukemia and its relationship to other prognostic factors: a Children's Oncology Group study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The Children's Oncology Group studied the prognostic impact of MRD
        measured by flow cytometry in the peripheral blood at day 8, and in
        end-induction (day 29) and end-consolidation marrows in 2143 children
        with precursor B-cell ALL (B-ALL).
      explanation: >-
        The study directly supports flow-cytometric MRD as a timed post-treatment
        measurement of residual B-ALL burden.
  - target: Common Lymphoblast Clonal Expansion
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Detectable end-induction marrow MRD predicts worse event-free survival;
      this is a prognostic association and does not itself prove that MRD causes relapse.
    evidence:
    - reference: PMID:18388178
      reference_title: "Clinical significance of minimal residual disease in childhood acute lymphoblastic leukemia and its relationship to other prognostic factors: a Children's Oncology Group study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Day-29 marrow MRD was the most important prognostic variable in multi-variate analysis.
      explanation: >-
        The COG analysis directly supports day-29 marrow MRD as a prognostic
        predictor while the schema relationship remains noncausal.
  evidence:
  - reference: PMID:18388178
    reference_title: "Clinical significance of minimal residual disease in childhood acute lymphoblastic leukemia and its relationship to other prognostic factors: a Children's Oncology Group study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of MRD in day-8 blood and day-29 marrow MRD was associated
      with shorter event-free survival (EFS) in all risk groups; even patients
      with 0.01% to 0.1% day-29 MRD had poor outcome compared with patients
      negative for MRD patients (59% +/- 5% vs 88% +/- 1% 5-year EFS).
    explanation: >-
      This large pediatric B-ALL cohort establishes the time-dependent
      prognostic significance of flow-cytometric MRD.
  - reference: PMID:29284596
    reference_title: Measurable residual disease detection by high-throughput sequencing improves risk stratification for pediatric B-ALL.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The higher analytic sensitivity and lower false-negative rate of HTS
      improves upon FC for MRD detection in pediatric B-ALL by identifying a
      novel subset of patients at end of induction who are essentially cured
      using current chemotherapy and identifying MRD at 0.01% in up to
      one-third of patients who are missed at the same threshold by FC.
    explanation: >-
      The paired-sample study supports greater analytic sensitivity of
      high-throughput sequencing than flow cytometry in pediatric B-ALL without
      implying that the result applies unchanged to every ALL population.


      label: B cell differentiation
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Many chromosomal rearrangements disrupt genes that regulate normal
      hematopoiesis and lymphoid development (eg, RUNX1 and ETV6), activate
      oncogenes (eg, MYC), or constitutively activate tyrosine kinases (eg,
      ABL1).
    explanation: >-
      The review directly links recurrent ALL rearrangements to disruption of
      lymphoid-developmental regulators, while distinguishing this route from
      oncogene and kinase activation.
  downstream:
  - target: Common Lymphoblast Clonal Expansion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired precursor B-cell differentiation
    - cooperation with subtype-specific structural and sequence alterations
    description: >-
      Developmental lesions cooperate with additional subtype-specific changes
      to establish a leukemic precursor-B-cell clone.
    evidence:
    - reference: PMID:23523389
      reference_title: Acute lymphoblastic leukaemia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Importantly, many ALL subtypes are characterized by distinct
        constellations of structural genetic alterations that together drive
        establishment of the leukaemic clone.
      explanation: >-
        The review explicitly states that subtype-specific constellations of
        lesions jointly establish the leukemic clone; the edge is indirect
        because no single universal intermediate sequence is established.
- name: Kinase-Activated B-ALL Signaling
  description: >-
    BCR::ABL1 in Ph-positive B-ALL and heterogeneous kinase lesions in Ph-like
    B-ALL activate proliferative signaling. This node is limited to those two
    kinase-defined contexts and does not generalize kinase dependence to every
    B-ALL subtype.
  subtypes:
  - Ph-positive
  - Ph-like
  genes:
  - preferred_term: ABL1
    term:
      id: hgnc:76
      label: ABL1
  conforms_to: "sustaining_proliferative_signaling#Constitutive Mitogenic Pathway Activation"
  biological_processes:
  - preferred_term: RAS protein signal transduction
    modifier: INCREASED
    term:
      id: GO:0007265
      label: Ras protein signal transduction
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: PI3K-AKT signal transduction
    modifier: INCREASED
    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:28665419
    reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Similarly, kinase-activating mutations are seen in 90% of the Ph-like
      ALL. The most common of these include rearrangements involving ABL1,
      JAK2, PDGFRB, CRLF2 and EPOR, activating mutations of IL7R and FLT3 and
      deletion of SH2B3, which encodes the JAK2-negative regulator LNK.
    explanation: >-
      The review supports heterogeneous kinase activation in Ph-like ALL; the
      percentage is retained only inside the exact cohort-review quotation and
      is not encoded as a universal frequency field.
  - reference: PMID:41251904
    reference_title: "Philadelphia chromosome-positive acute lymphoblastic leukemia: exploring microRNA-based strategies to improve outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Philadelphia chromosome-positive acute lymphoblastic leukemia (Ph+ ALL)
      is characterized by the BCR::ABL1 fusion gene resulting from the
      translocation t(9;22).
    explanation: >-
      This supports the defining BCR::ABL1 lesion in the other subtype scoped
      to this node.
  downstream:
  - target: Common Lymphoblast Clonal Expansion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - constitutive kinase signaling
    - RAS-MAPK and PI3K-AKT pathway output
    description: >-
      Constitutive kinase-pathway output supplies a proliferative and survival
      route into expansion of the Ph-positive or Ph-like leukemic clone.
    evidence:
    - reference: PMID:28665419
      reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The pathogenesis of ALL involves the abnormal proliferation and
        differentiation of a clonal population of lymphoid cells.
      explanation: >-
        The review supports clonal lymphoid proliferation as the disease-level
        endpoint. The link from heterogeneous kinase output is marked partial
        and indirect because it is subtype-specific and traverses multiple
        signaling intermediates.

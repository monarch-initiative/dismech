name: Acute Lymphoblastic Leukemia
creation_date: '2026-05-08T12:00:00Z'
description: >-
  Acute lymphoblastic leukemia (ALL) is a precursor lymphoid malignancy in
  which an abnormal clone of B- or T-lineage lymphoblasts expands in bone
  marrow, blood, and sometimes extramedullary sites. Modern classification
  integrates lineage, ploidy, recurrent rearrangements, sequence variants,
  and expression-defined entities. These biologically distinct routes
  converge on impaired lymphoid differentiation, abnormal survival or
  proliferation, and accumulation of blasts that disrupt normal hematopoiesis.
categories:
- Hematologic Malignancy
- Acute Leukemia
parents:
- leukemia
disease_term:
  preferred_term: acute lymphoblastic leukemia
  term:
    id: MONDO:0004967
    label: acute lymphoblastic leukemia
has_subtypes:
- name: B-ALL
  display_name: B-cell acute lymphoblastic leukemia
  classification: lineage
  children:
  - Ph-positive
  - Ph-like
  - KMT2A-rearranged
  - ETV6-RUNX1
  - TCF3-PBX1
  - High hyperdiploidy
  - Hypodiploidy
  - iAMP21
  - PAX5-altered
  description: >-
    Precursor B-lineage ALL. Current WHO and ICC frameworks further classify
    most cases by ploidy, recurrent rearrangement, sequence alteration, or
    expression-defined genetic subtype.
  evidence:
  - reference: PMID:36422706
    reference_title: International Consensus Classification of acute lymphoblastic leukemia/lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The updated International Consensus Classification (ICC) of B-acute
      lymphoblastic leukemia (B-ALL) and T-acute lymphoblastic leukemia (T-ALL)
      includes both revisions to subtypes previously outlined in the 2016 WHO
      classification and several newly described entities.
    explanation: >-
      The ICC establishes B-ALL and T-ALL as lineage families with revised and
      newly defined subtypes.
- name: T-ALL
  display_name: T-cell acute lymphoblastic leukemia
  classification: lineage
  children:
  - ETP-ALL
  description: >-
    Precursor T-lineage ALL characterized by recurrent disruption of T-cell
    transcriptional programs, NOTCH1 signaling, cell-cycle control, and other
    stage-associated pathways.
  evidence:
  - reference: PMID:28671688
    reference_title: The genomic landscape of pediatric and young adult T-lineage acute lymphoblastic leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic alterations that activate NOTCH1 signaling and T cell transcription
      factors, coupled with inactivation of the INK4/ARF tumor suppressors, are
      hallmarks of T-lineage acute lymphoblastic leukemia (T-ALL), but detailed
      genome-wide sequencing of large T-ALL cohorts has not been carried out.
    explanation: >-
      Integrated sequencing defines the major recurrent pathway classes in
      human T-ALL.
- name: ETP-ALL
  display_name: Early T-cell precursor acute lymphoblastic leukemia
  classification: T-lineage developmental subtype
  description: >-
    An early T-precursor subtype with a distinct immunophenotypic and genomic
    profile, including enrichment for lesions also seen in stem or myeloid
    programs. It is classified within the T-ALL family rather than treated as
    a B-lineage genetic subtype.
  evidence:
  - reference: PMID:36422706
    reference_title: International Consensus Classification of acute lymphoblastic leukemia/lymphoma.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      T-ALL classification is also updated to incorporate BCL11B-activating
      rearrangements into early T-precursor (ETP) ALL taxonomy.
    explanation: >-
      The ICC explicitly places early T-precursor ALL in the updated T-ALL
      taxonomy.
- name: Ph-positive
  display_name: BCR::ABL1-positive / Philadelphia chromosome-positive B-ALL
  classification: recurrent fusion
  description: >-
    B-ALL with t(9;22) and BCR::ABL1. The constitutively active ABL1 kinase
    creates a targetable signaling dependency and makes this subtype distinct
    from expression-similar BCR::ABL1-like disease.
  subtype_term:
    preferred_term: B-lymphoblastic leukemia/lymphoma with t(9;22)(q34.1;q11.2)
    term:
      id: MONDO:0035940
      label: B-lymphoblastic leukemia/lymphoma with t(9;22)(q34.1;q11.2)
  evidence:
  - reference: PMID:41251904
    reference_title: "Philadelphia chromosome-positive acute lymphoblastic leukemia: exploring microRNA-based strategies to improve outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Philadelphia chromosome-positive acute lymphoblastic leukemia (Ph+ ALL)
      is characterized by the BCR::ABL1 fusion gene resulting from the
      translocation t(9;22).
    explanation: >-
      This defines the BCR::ABL1 fusion lesion of Ph-positive ALL.
- name: Ph-like
  display_name: BCR::ABL1-like / Philadelphia chromosome-like B-ALL
  classification: kinase-activated expression subtype
  description: >-
    B-ALL with a BCR::ABL1-like expression profile but no BCR::ABL1 fusion.
    Diverse ABL-class, JAK-STAT, cytokine-receptor, and other kinase lesions
    require molecular characterization rather than inference from the label.
  evidence:
  - reference: PMID:23523389
    reference_title: Acute lymphoblastic leukaemia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ten to 12 percent of B-ALL cases exhibit a gene expression profile similar
      to that of BCR-ABL1 ALL but are BCR-ABL1-negative, commonly show IKZF1
      alteration, and have a poor outcome
    explanation: >-
      The review directly defines the BCR::ABL1-like expression subtype and
      separates it from BCR::ABL1-positive disease.
- name: KMT2A-rearranged
  display_name: KMT2A-rearranged B-ALL
  classification: recurrent rearrangement
  description: >-
    B-ALL with a KMT2A rearrangement and one of several fusion partners. It is
    prominent in infant ALL and has clinically important relapse behavior.
  subtype_term:
    preferred_term: B-lymphoblastic leukemia/lymphoma with t(v;11q23.3)
    term:
      id: MONDO:0035941
      label: B-lymphoblastic leukemia/lymphoma with t(v;11q23.3)
  evidence:
  - reference: PMID:39261601
    reference_title: "Determinants of survival after first relapse of acute lymphoblastic leukemia: a Children's Oncology Group study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with hypodiploidy, KMT2A-rearrangement, and TCF3::PBX1 had short
      median time-to-relapse (12.5-18 months) and poor OS post-relapse
      (14.2 ± 6.1%, 31.9 ± 7.7%, 36.8 ± 6.6%).
    explanation: >-
      The COG cohort identifies KMT2A rearrangement as a clinically distinct
      recurrent subtype.

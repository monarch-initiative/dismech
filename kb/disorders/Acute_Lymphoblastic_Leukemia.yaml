- name: iAMP21
  display_name: B-ALL with intrachromosomal amplification of chromosome 21
  classification: focal amplification subtype
  description: >-
    B-ALL with intrachromosomal amplification of chromosome 21. Accurate
    genomic detection matters because unusual amplification patterns may not
    satisfy a simple FISH rule.
  evidence:
  - reference: PMID:35771717
    reference_title: Characterization of unusual iAMP21 B-lymphoblastic leukemia (iAMP21-ALL) from the Mayo Clinic and Children's Oncology Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute lymphoblastic leukemia (B-ALL) with intrachromosomal amplification
      of chromosome 21 (iAMP21-ALL) represents a recurrent high-risk cytogenetic
      abnormality and accurate identification is critical for appropriate
      clinical management.
    explanation: >-
      This cohort supports iAMP21 as a recurrent cytogenetic B-ALL subtype.
- name: PAX5-altered
  display_name: PAX5-altered / PAX5alt B-ALL
  classification: transcription-factor altered subtype
  description: >-
    A B-ALL expression subtype enriched for diverse PAX5 rearrangements,
    mutations, and focal or intragenic amplifications rather than one uniform
    rearrangement.
  evidence:
  - reference: PMID:30643249
    reference_title: PAX5-driven subtypes of B-progenitor acute lymphoblastic leukemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One, PAX5alt (7.4%), has diverse PAX5 alterations (rearrangements,
      intragenic amplifications or mutations); a second subtype is defined by
      PAX5 p.Pro80Arg and biallelic PAX5 alterations.
    explanation: >-
      Integrated genomic analysis defines PAX5alt by heterogeneous PAX5
      alteration classes.

pathophysiology:
- name: B-Lineage Developmental Program Disruption
  description: >-
    Recurrent B-ALL lesions alter transcriptional regulators of normal
    hematopoiesis and B-cell development. The exact lesion differs by subtype;
    this node therefore represents a convergent differentiation defect rather
    than asserting one universal molecular route across B-ALL.
  subtypes:
  - B-ALL
  - KMT2A-rearranged
  - ETV6-RUNX1
  - TCF3-PBX1
  - PAX5-altered

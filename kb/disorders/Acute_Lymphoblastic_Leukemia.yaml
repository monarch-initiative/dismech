  description: >-
    Initial diagnosis combines microscopic recognition of lymphoblasts with
    flow-cytometric immunophenotyping to assign B- or T-lineage and maturational
    stage. Neither morphology nor a single marker should be treated as a
    molecular subtype assignment.
  results: >-

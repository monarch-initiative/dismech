- name: Common Lymphoblast Clonal Expansion
  description: >-
    Biologically distinct B- and T-lineage initiating routes converge on an
    expanding clone of poorly differentiated lymphoblasts. This is the shared
    disease-level state, not evidence that all molecular subtypes have the same
    upstream mechanism.

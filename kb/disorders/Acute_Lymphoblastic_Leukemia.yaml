  downstream:
  - target: Bone Marrow Failure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - marrow accumulation of malignant lymphoblasts
    - suppression or displacement of normal hematopoietic output
    description: >-
      Accumulating blasts in marrow impair production of normal blood-cell
      lineages, producing the marrow-failure syndrome.
    evidence:
    - reference: PMID:28665419
      reference_title: "Acute lymphoblastic leukemia: a comprehensive review and 2017 update."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Most of the clinical manifestations of ALL reflect the accumulation of
        malignant, poorly differentiated lymphoid cells within the bone marrow,
        peripheral blood, and, extramedullary sites. Presentation can be
        nonspecific, with a combination of constitutional symptoms and signs of
        bone marrow failure (anemia, thrombocytopenia, leukopenia).
      explanation: >-
        The review directly attributes marrow-failure manifestations to
        accumulation of malignant poorly differentiated lymphoid cells.
  - target: Extramedullary Leukemic Involvement
    causal_link_type: DIRECT
    description: >-
      The leukemic clone can accumulate outside marrow, including lymphoid
      organs, the CNS, and the mediastinum in T-ALL.
    evidence:

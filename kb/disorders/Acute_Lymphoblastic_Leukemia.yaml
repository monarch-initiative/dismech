datasets:
- accession: ega:EGAS00001000246
  title: Genetic landscape of pediatric Infant Acute Lymphoblastic leukemia
  description: We performed whole genome sequencing of tumor and normal DNA samples obtained from 22 infant ALL cases with MLL rearrangements. In addition, we sequenced 2 paired diagnostic-relapse samples. Using complementary pipelines, somatically acquired genetic changes were analyzed, including single nucleotide variations (SNVs), insertion/deletions, structural variations and copy number variations in the cancer genomes. In addition, exome sequencing was performed on paired diagnostic and normal DNA samples obtained from 20 cases of non-infant MLL rearranged leukemias and somatic mutations in the coding regions were identified.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: WGS
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Acute Lymphoblastic Leukemia"); description-level mentions were not accepted. EGA study_type: Whole Genome Sequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000253
  title: Whole genome sequencing of pediatric BCR-ABL1 positive acute lymphoblastic leukemia
  description: We performed whole-genome sequencing of 18 paired tumor/normal BCR-ABL1+ leukemia genomes and analyzed single nucleotide variations (SNVs), insertion/deletions, structural variations and copy number variations in the tumor and normal genomes
  organism:
    preferred_term: human
    term:

  evidence:
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anticholinesterase inhibitors (e.g. edrophonium or tensilon) have been used to assess and provide immediate ancillary treatment, especially following envenomings by snakes causing post-synaptic neurotoxic envenoming"
    explanation: Establishes postsynaptic neurotoxic envenoming as a distinct neuromuscular blockade mechanism responsive to anticholinesterase inhibition.
  downstream:
  - target: Paralysis
    description: Postsynaptic blockade at the neuromuscular junction produces flaccid paralysis.
  - target: Respiratory failure
    description: Postsynaptic neuromuscular blockade of respiratory muscles impairs ventilation and causes respiratory failure.

pathophysiology:
- name: Presynaptic phospholipase A2 neurotoxin blockade
  description: >-
    Presynaptic phospholipase A2 beta-neurotoxins (such as Mojave toxin) trigger
    intracellular Ca2+ and arachidonic acid cascades, endoplasmic reticulum
    stress, and neurotransmitter overload in excitatory synapses, leading to
    presynaptic blockade of nerve signals that is relatively refractory to
    antivenom and anticholinesterase reversal once established.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:40149917
    reference_title: "Neurocellular Stress Response to Mojave Type A Rattlesnake Venom: Study of Molecular Mechanisms Using Human iPSC-Derived Neural Stem Cell Model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The MTX, which is composed of heterodimers of basic and acidic phospholipase-A2, co-opts the host arachidonic acid and Ca2+ second messenger mechanisms and triggers multiple signaling cascades, such as the activation of MAPKs and NF-κB-regulated proinflammatory genes; the neurotransmitter overload in excitatory synapses leading to a presynaptic blockade of nerve signals; and the upregulation of unfolded protein response (UPR) due to the depletion of Ca2+ from the endoplasmic reticulum."
    explanation: Demonstrates the molecular mechanism by which snake venom phospholipase A2 neurotoxins induce presynaptic blockade of nerve signals and cellular stress.
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, while antivenoms save countless lives, they are associated with adverse reactions, limited potency, and are relatively inefficacious against presynaptic neurotoxicity and in preventing necrosis."
    explanation: Highlights presynaptic neurotoxicity as a distinct mechanism in snakebite envenoming that responds poorly to established antivenom reversal.
  downstream:
  - target: Paralysis
    description: Presynaptic blockade of motor nerve signal transmission causes descending flaccid neuromuscular paralysis.
  - target: Respiratory failure
    description: Presynaptic neuromuscular blockade of bulbar and respiratory musculature leads to ventilatory failure.
- name: Postsynaptic alpha-neurotoxin neuromuscular blockade
  description: >-
    Postsynaptic neurotoxins competitively block nicotinic acetylcholine
    receptors at the skeletal muscle motor endplate, impairing neuromuscular
    synaptic transmission in a manner responsive to anticholinesterase ancillary
    therapy.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134

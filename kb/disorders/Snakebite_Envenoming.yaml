has_subtypes:
- name: Neurotoxic snakebite envenoming
  description: >-
    Envenoming dominated by presynaptic beta-neurotoxins (such as phospholipase
    A2 complexes) or postsynaptic alpha-neurotoxins that block neuromuscular
    transmission, producing cranial nerve palsy, descending flaccid paralysis,
    and respiratory failure.
  evidence:
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cases of neurotoxic envenoming, patients with neurological manifestations are monitored by serial general physical and neurological examination with special attention to cranial nerve function, airway, respiration, and bedside measures, such as Peak Expiratory Flow Rate (PEFR) and blood oxygen saturation (SpO2)."
    explanation: Recognizes neurotoxic snakebite envenoming as a distinct clinical syndrome characterized by cranial nerve and respiratory muscle paralysis.
- name: Hemotoxic and cytotoxic snakebite envenoming
  description: >-
    Envenoming dominated by venom metalloproteases, serine proteases, and
    cytotoxins that degrade extracellular matrix and consume coagulation
    factors, resulting in local edema and necrosis, venom-induced consumption
    coagulopathy, systemic hemorrhage, rhabdomyolysis, and acute kidney injury.
  evidence:
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Generally, the main clinical features of snakebites are local swelling, tissue necrosis, shock, spontaneous systemic hemorrhage, incoagulable blood, paralysis, rhabdomyolysis, and acute kidney injury. These clinical manifestations result from complex biochemical venom constituents comprising of cytotoxins, hemotoxins, neurotoxins, myotoxins, and other substances."
    explanation: Supports the clinical and biochemical distinction of hemotoxic, cytotoxic, and myotoxic snakebite syndromes.

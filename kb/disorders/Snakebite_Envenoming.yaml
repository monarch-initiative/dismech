name: Snakebite envenoming
creation_date: "2026-01-26T16:06:17Z"
category: Injury
description: >-
  Snakebite envenoming is an acute, life-threatening toxic injury and neglected
  tropical disease caused by the parenteral injection of complex proteinaceous
  snake venoms comprising neurotoxins, hemotoxins, cytotoxins, myotoxins, and
  metalloproteases. Depending on snake species and venom composition,
  envenoming produces a clinical spectrum ranging from severe local swelling and
  cutaneous/soft-tissue necrosis to systemic venom-induced consumption
  coagulopathy with spontaneous hemorrhage, presynaptic or postsynaptic
  neuromuscular paralysis, systemic rhabdomyolysis, and acute kidney injury.

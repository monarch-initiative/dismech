  title: 'Neurocellular stress response to Mojave Type A Rattlesnake venom: A study of molecular mechanisms using a human iPSC-derived neural stem cell model'
  description: The Mojave rattlesnake (Crotalus scutulatus scutulatus) is classified as the “highest medically important” snake in the risk categories in the United States. Although responsible for fewer snakebite envenomations and deaths compared to other species, Mojave rattlesnake venom is poorly characterized and shows significant geographical variability. The venom of Type A animals primarily contains the β-neurotoxin referred to as Mojave Toxin (MTX), which is responsible for the neurotoxic effects that make bites from this snake particularly feared.

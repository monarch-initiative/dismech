diagnosis:
- name: Blood coagulation testing and 20-minute whole blood clotting test
  diagnosis_term:
    preferred_term: coagulation study
    term:
      id: NCIT:C62662
      label: Coagulation Study
  description: >-
    Bedside 20-minute whole blood clotting test (20WBCT) and laboratory
    coagulation assays (prothrombin time, INR, aPTT, fibrinogen, and fibrin
    degradation products/D-dimer) detect venom-induced consumption
    coagulopathy and guide antivenom indication.
  results: Incoagulable blood on 20WBCT, prolonged PT/INR and aPTT, hypofibrinogenemia, and elevated D-dimer/fibrin degradation products.
  evidence:
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tests of blood coagulation, such as prothrombin time (PT), the International Normalized Ratio (INR), or activated partial thromboplastin time (aPTT), measurement of fibrin(ogen) related proteins also known as fibrin degradation products (FDP), or D-dimer, can also be used to diagnose snakebite envenoming."
    explanation: Supports coagulation testing (PT, INR, aPTT, FDP, D-dimer) for diagnosing hemotoxic snakebite envenoming.
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If the blood is still liquid (unclotted) and runs out, the patient has incoagulable blood (hypofibrinogenaemia) as a result of venom-induced consumption coagulopathy and is in need of antivenom treatment."
    explanation: Supports bedside whole blood clotting assessment showing unclotted liquid blood as diagnostic of venom-induced consumption coagulopathy.
- name: Serial neurological and respiratory monitoring
  diagnosis_term:
    preferred_term: neurologic examination
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  description: >-
    Serial physical and neurological examination assessing cranial nerve
    function (ptosis, ophthalmoplegia, bulbar function), airway patency, Peak
    Expiratory Flow Rate (PEFR), and pulse oximetry (SpO2) to detect
    neurotoxic envenoming and impending respiratory failure.
  results: Progressive cranial nerve palsy, declining PEFR, and desaturation indicating neurotoxic neuromuscular blockade.
  evidence:
  - reference: PMID:34430847
    reference_title: "Clinical management of snakebite envenoming: Future perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In cases of neurotoxic envenoming, patients with neurological manifestations are monitored by serial general physical and neurological examination with special attention to cranial nerve function, airway, respiration, and bedside measures, such as Peak Expiratory Flow Rate (PEFR) and blood oxygen saturation (SpO2)."
    explanation: Establishes serial neurological examination and respiratory monitoring as essential diagnostic assessments in neurotoxic snakebite envenoming.
treatments:
- name: Intravenous antivenom administration
  description: >-
    Intravenous administration of specific or polyvalent immunoglobulin
    antivenom is the only specific therapy to neutralize circulating snake
    venom toxins and reverse venom-induced consumption coagulopathy, though its
    clinical efficacy is limited against established presynaptic neurotoxicity
    and local tissue necrosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Postsynaptic alpha-neurotoxin neuromuscular blockade
    treatment_effect: INHIBITS
    description: Neutralizes circulating postsynaptic neurotoxins to halt or reverse neuromuscular junction blockade.
  - target: Presynaptic phospholipase A2 neurotoxin blockade
    treatment_effect: INHIBITS
    description: Neutralizes circulating presynaptic neurotoxins prior to irreversible nerve terminal injury, although efficacy is limited once presynaptic neurotoxicity is established.
    evidence:
    - reference: PMID:34430847
      reference_title: "Clinical management of snakebite envenoming: Future perspectives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, while antivenoms save countless lives, they are associated with adverse reactions, limited potency, and are relatively inefficacious against presynaptic neurotoxicity and in preventing necrosis."
      explanation: Notes that antivenom neutralizes systemic envenoming but has limited efficacy against established presynaptic neurotoxicity.
  - target: Venom-induced consumption coagulopathy
    treatment_effect: INHIBITS
    description: Neutralizes procoagulant and hemorrhagic venom toxins in patients with incoagulable blood from venom-induced consumption coagulopathy.
    evidence:
    - reference: PMID:34430847
      reference_title: "Clinical management of snakebite envenoming: Future perspectives."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "If the blood is still liquid (unclotted) and runs out, the patient has incoagulable blood (hypofibrinogenaemia) as a result of venom-induced consumption coagulopathy and is in need of antivenom treatment."
      explanation: Directly links venom-induced consumption coagulopathy to the indication for antivenom therapy.
  - target: Venom metalloprotease and cytotoxin-mediated extracellular matrix degradation and local tissue necrosis
    treatment_effect: INHIBITS
    description: Neutralizes circulating cytotoxic and proteolytic venom toxins, although efficacy in preventing local necrosis is limited.
  - target: Venom myotoxin-mediated skeletal muscle damage
    treatment_effect: INHIBITS
    description: Neutralizes circulating venom myotoxins to limit systemic muscle injury.
  evidence:
  - reference: PMID:28905944
    reference_title: "Snakebite envenoming."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Intravenous administration of antivenom is the only specific treatment to counteract envenoming."

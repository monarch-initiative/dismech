name: Thiopurine S-methyltransferase Deficiency
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Thiopurine S-methyltransferase (TPMT) deficiency is an inherited
  pharmacogenomic disorder of drug metabolism in which reduced or absent activity
  of the cytosolic enzyme TPMT impairs S-methylation of the thiopurine drugs
  azathioprine, mercaptopurine and thioguanine. TPMT activity is trimodally
  distributed in the population and is inherited as an autosomal codominant trait:
  roughly 90% of individuals have normal to high activity, about 10% are
  heterozygous with intermediate activity, and roughly 1 in 300 is deficient. When
  a deficient individual receives a conventional thiopurine dose, drug that would
  normally be inactivated by methylation is instead shunted down the activating
  route to cytotoxic 6-thioguanine nucleotides, which accumulate, are incorporated
  into DNA and RNA, and kill dividing haematopoietic progenitors — producing
  severe, sometimes fatal, myelosuppression within weeks. The defining feature of
  this entry is that the pathograph is conditional on drug exposure: a
  TPMT-deficient person who never receives a thiopurine has no disease. TPMT
  genotyping or activity assay before thiopurine initiation, with genotype-guided dose
  reduction, is one of the earliest and most firmly established applications of
  clinical pharmacogenomics.
parents:
- Genetic Disease
- Metabolic Disease

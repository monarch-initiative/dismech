    explanation: >-
      Cited support for the scope limit stated in this entry's notes: a TPMT-only
      test does not measure the dominant thiopurine-toxicity risk allele in
      patients of Asian or Amerindian ancestry.
treatments:
- name: Genotype-Guided Thiopurine Dose Reduction
  description: >
    Where a thiopurine is still indicated, the starting dose is set from
    metabolizer status rather than the drug being withheld. This is the
    recommendation for intermediate metabolizers, and for poor metabolizers it
    applies only where the thiopurine is not readily replaceable — in malignant
    disease, where CPIC calls for drastic dose reduction rather than
    substitution. In nonmalignant disease a poor metabolizer is switched to a
    different drug class instead; see "Alternative Nonthiopurine Agent for Poor
    Metabolizers". Dose reduction is what makes TPMT testing actionable in the
    intermediate range: efficacy and toxicity share the same metabolite, so a
    lower dose can reach a therapeutic 6-TGN concentration without reaching a
    toxic one. That logic does not extend to poor metabolizers, in whom 6-TGN
    stays above tolerated concentrations even at markedly reduced doses.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
    - preferred_term: mercaptopurine
      term:
        id: CHEBI:50667
        label: mercaptopurine
  target_mechanisms:
  - target: 6-Thioguanine Nucleotide Accumulation
    treatment_effect: MODULATES
    description: >
      Setting the dose from metabolizer status keeps 6-TGN within the
      therapeutic window instead of allowing it to reach the toxic
      concentrations a standard dose would produce. The link is to the
      metabolite node rather than to the enzyme, because dose reduction does not
      restore TPMT activity — it lowers the flux the residual activity has to
      handle. In poor metabolizers this only partially controls the node, which
      is why substitution is preferred wherever an alternative agent exists.
    evidence:
    - reference: PMID:41618934
      reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we provide recommendations for adjusting starting doses of mercaptopurine, thioguanine, and azathioprine based on TPMT and NUDT15 genotypes"
      explanation: >-
        Genotype-guided starting-dose adjustment is the intervention acting on
        the metabolite-accumulation node.
  evidence:
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we provide recommendations for adjusting starting doses of mercaptopurine, thioguanine, and azathioprine based on TPMT and NUDT15 genotypes, including for individuals with variants in both genes"
    explanation: >-
      Establishes genotype-guided dose adjustment, including the compound
      TPMT/NUDT15 case, as the recommended management.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On average, TPMT or NUDT15 IM patients can tolerate ~60% of the standard dose of thiopurine, even though it ranges from 30% to 80% across patients."
    explanation: >-
      Quantifies the intermediate-metabolizer starting dose this treatment
      describes qualitatively: ~60% of standard on average, over a 30-80%
      range.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We acknowledge that our recommended dose range (30–80%) is broad but also believe it is necessary to account for the significant interindividual variability in thiopurine tolerance observed in the IM patient population"
    explanation: >-
      CPIC's own rationale for why the intermediate-metabolizer dose is a broad
      range rather than a single figure, so the number above is not read as a
      fixed dose.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For malignancy: initiate therapy with drastically reduced starting doses. Reduce starting dose by 10‐fold and reduce frequency to thrice weekly instead of daily"
    explanation: >-
      Quantifies the poor-metabolizer malignant-disease arm this treatment
      describes as "drastic dose reduction": a 10-fold starting-dose cut plus a
      switch from daily to thrice-weekly dosing.
- name: Alternative Nonthiopurine Agent for Poor Metabolizers
  description: >
    For TPMT poor metabolizers treated for a nonmalignant condition, CPIC
    recommends switching to a nonthiopurine agent rather than prescribing a
    reduced thiopurine dose, because alternative agents are available and
    because 6-TGN concentrations in poor metabolizers remain well above tolerated
    levels even at markedly reduced doses. For azathioprine the same
    recommendation is phrased as considering alternative immunosuppressant
    therapy. This is the one situation in TPMT deficiency where the correct
    action is to withhold the drug class outright rather than dose around the
    enzyme defect; in malignant disease, where thiopurines are not readily
    replaceable, drastic dose reduction is used instead.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: 6-Thioguanine Nucleotide Accumulation
    treatment_effect: INHIBITS
    description: >
      Substituting a drug that is not a TPMT substrate stops the accumulating
      metabolite from being formed at all, rather than trying to hold it inside a
      therapeutic window the residual enzyme activity cannot support.
    evidence:
    - reference: PMID:41618934
      reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "even at these markedly reduced dosages, erythrocyte TGN concentrations in TPMT poor metabolizers remain well above those tolerated and achieved by the majority of patients"
      explanation: >-
        States why dose reduction does not adequately control the 6-TGN
        accumulation node in poor metabolizers, which is the rationale for
        substitution acting on that node instead.
  evidence:
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this guideline recommends alternative nonthiopurine agents for TPMT poor metabolizers and/or NUDT15 poor metabolizers rather than administering reduced doses of mercaptopurine"
    explanation: >-
      The CPIC recommendation for mercaptopurine in nonmalignant conditions is
      substitution, not dose reduction.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinicians should consider alternative immunosuppressant therapy in TPMT and/or NUDT15 poor metabolizers rather than a decreased dose of azathioprine"
    explanation: >-
      The same substitution recommendation stated for azathioprine, the agent
      used in the autoimmune indications this entry's cohort data come from.
- name: Continued Blood Count Monitoring
  description: >
    Serial full blood counts remain mandatory in every thiopurine-treated patient
    regardless of TPMT status. This is not belt-and-braces: TPMT variants explain
    only a minority of thiopurine myelosuppression, so a normal TPMT result gives
    no licence to stop monitoring.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:10833476
    reference_title: "Genotypic analysis of thiopurine S-methyltransferase in patients with Crohn's disease and severe myelosuppression during azathioprine therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Continued monitoring of blood cell counts remains mandatory in patients treated with azathioprine."
    explanation: >-
      Explicit recommendation that TPMT testing does not replace count
      monitoring.
environmental:
- name: Thiopurine administration
  description: >-
    Administration of azathioprine, mercaptopurine or thioguanine. This is the
    trigger that converts a latent metabolic difference into a life-threatening
    illness, and it is the only reason a TPMT-deficient person ever comes to
    medical attention. It is modelled as an environmental exposure rather than as
    part of the constitutive chain because the entire toxicity arm is inert
    without it.
  influences_mechanisms:
  - target: 6-Thioguanine Nucleotide Accumulation
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Supplies the prodrug whose activating route the deficient enzyme can no
      longer compete with. Without administration there is no flux to shunt and
      no toxicity, however low the enzyme activity.
    evidence:
    - reference: PMID:41618934
      reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "predictive of pronounced adverse effects, including severe myelosuppression, that may occur among individuals treated with standard doses of thiopurines"
      explanation: >-
        States the exposure-dependence this link asserts: the adverse effect
        occurs among individuals treated with thiopurines.
  evidence:
  - reference: PMID:9177237
    reference_title: "Enhanced proteolysis of thiopurine S-methyltransferase (TPMT) encoded by mutant alleles in humans (TPMT*3A, TPMT*2): mechanisms for the genetic polymorphism of TPMT activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients inheriting TPMT deficiency are at high risk of potentially fatal hematopoietic toxicity"
    explanation: >-
      Evidence that the exposure is harmful in this population specifically,
      which is the claim the exposure entry itself makes, separate from the
      mechanism link above.
discussions:
- discussion_id: gap_tpmt_attributable_fraction_myelosuppression
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What fraction of thiopurine-induced myelosuppression is actually attributable
    to TPMT deficiency, and what accounts for the remainder?
  attaches_to:
  - pathophysiology#Bone Marrow Suppression
  - pathophysiology#Multilineage Cytopenias
  rationale: >
    In a cohort of 41 Crohn disease patients who developed leukopenia or
    thrombocytopenia on azathioprine or mercaptopurine, only 27% carried any TPMT
    mutant allele and just 10% were biallelic; 73% had no known TPMT mutation at
    all. The authors' own conclusion is that myelosuppression is more often caused
    by other factors. NUDT15 deficiency, since characterized and now co-recommended
    with TPMT by CPIC, explains part of the remainder — particularly in East Asian
    and Hispanic populations where NUDT15 variants are considerably more common
    than TPMT variants — but the residual is not fully accounted for. This matters
    for how the entry is used: TPMT deficiency is a well-understood mechanism for a
    minority of a common toxicity, not the explanation for that toxicity.
  proposed_experiments:
  - experiment_id: exp_tpmt_nudt15_joint_attributable_fraction
    name: Joint TPMT/NUDT15 attributable-fraction study in a multi-ancestry thiopurine cohort
    description: >
      Prospectively genotype a multi-ancestry cohort starting thiopurines for both
      TPMT and NUDT15 across the full CPIC allele definitions, sequence rather than
      panel-genotype the discordant cases, and measure 6-TGN and methylated
      metabolite concentrations alongside serial counts. Report the attributable
      fraction of grade 3-4 myelosuppression for each gene separately, jointly, and
      the residual unexplained — stratified by ancestry, since the two genes'
      allele frequencies vary in opposite directions across populations.
notes: >
  Scope and framing caveats a curator should preserve:

  This is a latent trait, not a disease with a spontaneous course. TPMT deficiency
  produces no phenotype whatsoever in the absence of thiopurine exposure. The
  pathograph below the "Impaired Thiopurine S-Methylation" node is therefore
  intervention-conditioned in the same sense as the antisense-oligonucleotide
  module's therapy chain: it describes what happens when a drug is given, not a
  natural history. Do not curate the cytopenia nodes as though they were
  spontaneous features of the genotype.

  NUDT15 deficiency is a separate entity and is deliberately not folded in here.
  NUDT15 variants cause a clinically indistinguishable thiopurine-toxicity
  phenotype through a different enzyme acting at a different step, and CPIC now
  issues joint TPMT/NUDT15 recommendations. Their ancestry distributions differ
  sharply — NUDT15 variants predominate in East Asian and Hispanic populations,
  TPMT variants in European-ancestry ones — so merging them would produce exactly
  the blended entity the project avoids and would obscure the reason a
  TPMT-only test is insufficient in much of the world. If a grouping over
  thiopurine-toxicity pharmacogenes is wanted, kb/groupings/ is the place for it.

  Codominance and the heterozygote. The heterozygote is not a silent carrier: ~10%
  of the population has intermediate activity and a genuinely elevated toxicity
  risk warranting dose reduction. The HP inheritance binding is discussed in the
  inheritance block's notes; the substantive point is that "recessive" framing
  would clinically mislead.

  Testing does not replace monitoring. The 27%/73% split in PMID:10833476 is the
  key number to carry forward and is recorded as an open KNOWLEDGE_GAP above.

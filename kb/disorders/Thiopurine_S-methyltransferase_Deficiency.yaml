inheritance:
- name: Autosomal codominant
  description: >-
    TPMT activity segregates as a monogenic autosomal codominant trait: homozygous
    wild-type individuals have high activity, heterozygotes intermediate activity,
    and homozygous or compound heterozygous carriers of low-activity alleles have
    undetectable activity. Codominance rather than simple recessiveness is the
    clinically important point, because heterozygotes are not unaffected — they
    have a real, intermediate risk of thiopurine toxicity and warrant dose
    reduction. Note on the ontology binding: HPO has no "autosomal codominant
    inheritance" term. HP:0000006 is bound here because the heterozygote has a
    distinct intermediate phenotype rather than being a silent carrier, which is
    the property that matters clinically. It should not be read as a claim that
    the trait is dominant in the usual sense.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:7191632
    reference_title: "Mercaptopurine pharmacogenetics: monogenic inheritance of erythrocyte thiopurine methyltransferase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "subjects homozygous for TPMT(H) would have high enzyme activity, subjects heterozygous for the two alleles would have intermediate activity, and subjects homozygous for TPMT(L) would have undetectable activity"
    explanation: >-
      States the codominant genotype-to-activity mapping across all three
      genotype classes.
  - reference: PMID:7191632
    reference_title: "Mercaptopurine pharmacogenetics: monogenic inheritance of erythrocyte thiopurine methyltransferase activity."
    supports: SUPPORT

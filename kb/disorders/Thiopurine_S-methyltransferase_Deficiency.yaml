pathophysiology:
- name: TPMT Loss-of-Function Variant
  biological_scale: MOLECULAR
  description: >
    Low-activity TPMT alleles reduce or abolish enzyme activity, chiefly by
    destabilizing the protein and accelerating its proteasomal degradation rather
    than by abolishing catalysis outright. Three alleles account for almost all
    deficiency in European-ancestry populations: TPMT*3A (the commonest, carrying
    two missense changes in cis), TPMT*3C and TPMT*2. Every deficient subject in a
    1,214-donor cohort was homozygous or compound heterozygous for one of these
    three. Allele frequencies differ substantially by ancestry, so a genotyping
    panel validated in one population under-detects deficiency in another.
  genes:
  - preferred_term: TPMT
    term:
      id: hgnc:12014
      label: TPMT
  molecular_functions:
  - preferred_term: thiopurine S-methyltransferase activity
    term:
      id: GO:0008119
      label: thiopurine S-methyltransferase activity
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Accelerated Proteasomal Degradation of Variant TPMT
    description: >
      The variant proteins are destabilized rather than catalytically dead, so
      the loss of activity is mediated by loss of protein.
  evidence:
  - reference: PMID:15226673
    reference_title: "Comprehensive analysis of thiopurine S-methyltransferase phenotype-genotype correlation in a large population of German-Caucasians and identification of novel TPMT variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All seven TPMT deficient subjects were homozygous or compound heterozygous carriers for these alleles."
    explanation: >-
      Establishes that the *2/*3A/*3C allele set accounts for the deficient
      phenotype in this population.
  - reference: PMID:15226673
    reference_title: "Comprehensive analysis of thiopurine S-methyltransferase phenotype-genotype correlation in a large population of German-Caucasians and identification of novel TPMT variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The frequencies of the mutant alleles were 4.4% (*3A), 0.4% (*3C) and 0.2% (*2)."
    explanation: Gives the relative frequencies of the three principal low-activity alleles.
- name: Accelerated Proteasomal Degradation of Variant TPMT
  biological_scale: MOLECULAR
  description: >
    The low-activity alleles do not abolish catalysis directly — they destabilize
    the protein. TPMT*2 and TPMT*3A produce normal mRNA levels and are translated
    at a normal rate, but their degradation half-life falls from about 18 hours
    to roughly 15 minutes, and the degradation is proteasome- and ATP-dependent
    rather than lysosomal. Erythrocyte TPMT activity tracks TPMT protein amount
    almost perfectly across the activity range. This node is what justifies
    treating the star alleles as one pathograph rather than as subtypes: they
    differ in sequence but converge on the same proximal event, less enzyme.
  biological_processes:
  - preferred_term: proteasome-mediated degradation of variant TPMT
    term:
      id: GO:0030163
      label: protein catabolic process
    modifier: INCREASED
  downstream:
  - target: Impaired Thiopurine S-Methylation
    description: >
      Reduced steady-state TPMT protein lowers methylation capacity in proportion.
  evidence:
  - reference: PMID:9177237
    reference_title: "Enhanced proteolysis of thiopurine S-methyltransferase (TPMT) encoded by mutant alleles in humans (TPMT*3A, TPMT*2): mechanisms for the genetic polymorphism of TPMT activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "pulse-chase experiments revealed significantly shorter degradation half-lives for TPMT*2 and TPMT*3A ( approximately 0.25 hr) compared with wild-type TPMT*1 (18 hr)"
    explanation: >-
      Quantifies the destabilization that is the proximate consequence of the two
      principal low-activity alleles.
  - reference: PMID:9177237
    reference_title: "Enhanced proteolysis of thiopurine S-methyltransferase (TPMT) encoded by mutant alleles in humans (TPMT*3A, TPMT*2): mechanisms for the genetic polymorphism of TPMT activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The degradation of mutant proteins was impaired by ATP depletion and in yeast with mutant proteasomes (pre-1 strain) but unaffected by the lysosomal inhibitor chloroquine."
    explanation: >-
      Localizes the degradation to the proteasome rather than the lysosome.
  - reference: PMID:9177237
    reference_title: "Enhanced proteolysis of thiopurine S-methyltransferase (TPMT) encoded by mutant alleles in humans (TPMT*3A, TPMT*2): mechanisms for the genetic polymorphism of TPMT activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "erythrocyte TPMT activity was significantly related to the amount of TPMT protein on Western blots of erythrocytes from patients"
    explanation: >-
      Establishes in patient erythrocytes that activity is a readout of protein
      amount, connecting the in vitro degradation mechanism to the clinical assay.
- name: Impaired Thiopurine S-Methylation
  biological_scale: MOLECULAR
  description: >
    TPMT catalyses S-methylation of thiopurines, one of the two competing
    inactivating routes (the other being xanthine oxidase) that divert drug away
    from the activating hypoxanthine-guanine phosphoribosyltransferase pathway.
    When methylation capacity is lost, the competing routes do not compensate and
    a larger fraction of each administered dose is committed to activation. This
    node is the point at which the trait becomes conditional on exposure: no
    thiopurine, no flux, no downstream pathology.
  biological_processes:
  - preferred_term: thiopurine S-methylation
    term:
      id: GO:0032259
      label: methylation
    modifier: DECREASED
  downstream:
  - target: 6-Thioguanine Nucleotide Accumulation
    description: >
      Drug not consumed by methylation is shunted into the activating pathway,
      raising 6-TGN concentrations far above those expected for the dose given.
  evidence:
  - reference: PMID:7191632
    reference_title: "Mercaptopurine pharmacogenetics: monogenic inheritance of erythrocyte thiopurine methyltransferase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thiopurine methyltransferase (TPMT) catalyzes thiopurine S-methylation, an important metabolic pathway for drugs such as 6-mercaptopurine."
    explanation: >-
      Establishes S-methylation by TPMT as a principal metabolic route for
      thiopurine drugs.
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thiopurine methyltransferase (TPMT) and Nudix hydrolase 15 (NUDT15) are key enzymes that catabolize thiopurines."
    explanation: >-
      Confirms TPMT as a catabolic (inactivating) enzyme for thiopurines,
      the loss of which shifts flux toward activation.
- name: 6-Thioguanine Nucleotide Accumulation
  biological_scale: MOLECULAR
  description: >
    Thiopurines are prodrugs: therapeutic and toxic effects alike are mediated by
    the 6-thioguanine nucleotides (6-TGN) formed downstream of HGPRT. In a
    TPMT-deficient patient given a standard dose, 6-TGN concentrations rise to levels
    that would ordinarily follow a many-fold higher dose. The nucleotides are
    incorporated into DNA and RNA, and the resulting thioguanine-substituted DNA
    triggers cytotoxicity in dividing cells. Because the same metabolite mediates
    efficacy, this is a therapeutic-index problem rather than an off-target
    toxicity — dose reduction preserves the intended effect while avoiding the
    toxic exposure, which is precisely why genotype-guided dosing works rather
    than requiring a different drug class.
  biological_processes:
  - preferred_term: purine nucleotide salvage
    term:
      id: GO:0032261
      label: purine nucleotide salvage
    modifier: INCREASED
  downstream:
  - target: Haematopoietic Progenitor Cytotoxicity
    description: >
      6-TGN incorporation into the DNA of rapidly dividing marrow progenitors
      produces lethal DNA damage.
  evidence:
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreased or no-function alleles in TPMT and NUDT15 are associated with reduced or no enzyme activity and predictive of pronounced adverse effects, including severe myelosuppression, that may occur among individuals treated with standard doses of thiopurines."
    explanation: >-
      Links reduced enzyme activity at standard doses to severe myelosuppression,
      the exposure-driven step this node encodes.
- name: Haematopoietic Progenitor Cytotoxicity
  biological_scale: CELLULAR
  conforms_to: "myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors"
  description: >
    Proliferating haematopoietic stem and progenitor cells are the tissue most
    sensitive to 6-TGN-mediated DNA damage, because thioguanine incorporation is
    replication-dependent and marrow turnover is high. This is the
    disorder-specific substitution into the conserved cytotoxic-myelosuppression
    pattern:
    the cytotoxic driver is an endogenously over-activated prodrug rather than an
    externally dosed cytotoxic agent, but the progenitor-level insult is the same.
  biological_processes:
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  - preferred_term: hematopoietic precursor cell
    term:
      id: CL:0008001
      label: hematopoietic precursor cell
  downstream:
  - target: Bone Marrow Suppression
    description: >
      Progenitor depletion collapses marrow output across lineages.
  evidence:
  - reference: PMID:41618934
    reference_title: "Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "predictive of pronounced adverse effects, including severe myelosuppression"
    explanation: >-
      Supports severe myelosuppression as the consequence; the progenitor-level
      localisation of the insult is inference from the conserved myelosuppression
      mechanism rather than a direct measurement in this citation.
- name: Bone Marrow Suppression
  biological_scale: TISSUE
  conforms_to: "myelosuppression#Bone Marrow Hematopoietic Suppression"
  description: >
    Loss of the proliferating progenitor compartment produces marrow
    hypocellularity and a fall in production across the myeloid, erythroid and
    megakaryocytic lineages.
  downstream:
  - target: Multilineage Cytopenias
    description: >
      Reduced marrow output appears in the peripheral blood after the transit time
      of each lineage.
  evidence:
  - reference: PMID:10833476
    reference_title: "Genotypic analysis of thiopurine S-methyltransferase in patients with Crohn's disease and severe myelosuppression during azathioprine therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The delay between administration of the drug and occurrence of bone marrow toxicity was less than 1.5 months in the 4 patients with 2 mutant alleles"
    explanation: >-
      Documents bone marrow toxicity in biallelic-variant patients and gives the
      short latency that distinguishes it from idiosyncratic late myelosuppression.
- name: Multilineage Cytopenias
  biological_scale: ORGANISM
  conforms_to: "myelosuppression#Multilineage Peripheral Cytopenias"
  description: >
    Leukopenia and thrombocytopenia are the presenting cytopenias; anaemia and
    frank pancytopenia follow in severe cases. In biallelic-variant patients the
    onset is rapid — under six weeks from starting the drug — whereas
    heterozygotes and normal metabolizers who develop myelosuppression do so over
    a much wider and later window. That timing difference is diagnostically useful
    and is a genuine finding rather than a restatement of the genotype.
  downstream: []
  evidence:
  - reference: PMID:10833476
    reference_title: "Genotypic analysis of thiopurine S-methyltransferase in patients with Crohn's disease and severe myelosuppression during azathioprine therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They developed leukopenia or thrombocytopenia during azathioprine or 6-mercaptopurine treatment."
    explanation: >-
      Identifies leukopenia and thrombocytopenia as the observed cytopenias in
      the thiopurine-exposed cohort.
  - reference: PMID:10833476
    reference_title: "Genotypic analysis of thiopurine S-methyltransferase in patients with Crohn's disease and severe myelosuppression during azathioprine therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ranged from 1 to 18 months in patients with 1 mutant allele and from 0.5 to 87 months in patients with normal genotype"
    explanation: >-
      Contrasts the latency distributions by genotype class, supporting the
      timing claim in this node.

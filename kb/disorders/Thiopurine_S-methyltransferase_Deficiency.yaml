biochemical:
- name: Erythrocyte TPMT activity
  notes: >
    Red-cell TPMT activity is the classical phenotypic assay and the measurement
    on which the entire trait was originally defined. Its trimodal distribution is
    what revealed the underlying genetic polymorphism. The assay is confounded by
    recent transfusion, since it measures activity in donor erythrocytes, which is
    the main practical reason genotyping has largely displaced it.
  evidence:
  - reference: PMID:7191632
    reference_title: "Mercaptopurine pharmacogenetics: monogenic inheritance of erythrocyte thiopurine methyltransferase activity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Erythrocyte (RBC) TPMT activity was measured in blood samples from 298 randomly selected subjects."
    explanation: Defines the red-cell activity assay used to establish the trait.
  - reference: PMID:15226673
    reference_title: "Comprehensive analysis of thiopurine S-methyltransferase phenotype-genotype correlation in a large population of German-Caucasians and identification of novel TPMT variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TPMT red blood cell activity was measured in all samples and genotype was determined for the TPMT alleles *2 and *3."
    explanation: >-
      Confirms red-cell activity as the reference phenotype against which
      genotyping is validated.
genetic:
- name: TPMT
  gene_term:
    preferred_term: TPMT
    term:
      id: hgnc:12014
      label: TPMT
  association: Causative
  notes: >
    TPMT encodes the cytosolic S-adenosyl-L-methionine-dependent enzyme
    thiopurine S-methyltransferase. Three low-activity alleles — TPMT*3A, *3C and
    *2 — account for the great majority of deficiency in European-ancestry
    populations, with respective frequencies of 4.4%, 0.4% and 0.2% in a
    German-Caucasian donor cohort. Genotyping for *2 and *3 predicted the
    activity phenotype with better than 90% sensitivity and specificity in that
    cohort, and 98.4% concordance once four newly identified variants (K119T,
    Q42E, R163H, G71R) were taken into account — the residual discordance being
    the reason a negative panel result does not fully exclude deficiency.
  evidence:
  - reference: PMID:15226673
    reference_title: "Comprehensive analysis of thiopurine S-methyltransferase phenotype-genotype correlation in a large population of German-Caucasians and identification of novel TPMT variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specificity, sensitivity and the positive and negative predictive power of the genotyping test were estimated to be higher than 90%."
    explanation: >-
      Quantifies the predictive performance of TPMT genotyping against the
      activity phenotype.
  - reference: PMID:15226673
    reference_title: "Comprehensive analysis of thiopurine S-methyltransferase phenotype-genotype correlation in a large population of German-Caucasians and identification of novel TPMT variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 17 individuals with intermediate TPMT activity discordant to TPMT genotype, four novel variants were identified leading to amino acid changes (K119T, Q42E, R163H, G71R)."
    explanation: >-
      Documents genotype-phenotype discordance resolved by sequencing, the basis
      for the caveat that a standard panel is not exhaustive.
diagnosis:
- name: Pre-Prescription TPMT Genotyping or Activity Testing
  description: >
    Determining TPMT status before the first thiopurine dose is what makes this
    latent trait actionable, and it is a diagnostic procedure rather than a
    therapy: it identifies the metabolizer phenotype, and a separate decision
    then sets the dose or substitutes the drug. Two assay routes exist —
    genotyping against the CPIC allele definitions, and direct measurement of
    erythrocyte TPMT activity. CPIC provides genotype-stratified starting-dose
    recommendations for mercaptopurine, thioguanine and azathioprine. Because
    the genotype-phenotype relationship is pharmacokinetic rather than
    disease-specific, the recommendations are extrapolated across all conditions
    treated with thiopurines, not only the few in which the dosing studies were
    done.

    A TPMT-only result is not a complete answer to thiopurine-toxicity risk. CPIC
    issues joint TPMT/NUDT15 recommendations because NUDT15 accounts for most
    severe thiopurine-related myelosuppression in patients of Asian descent, so
    testing TPMT alone leaves the dominant risk allele unmeasured in a large part
    of the world's population. NUDT15 deficiency remains a separate entity and is
    not curated here; see the notes.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  markers: Erythrocyte TPMT activity; TPMT genotype (CPIC allele definitions)
  results: >-
    Assigns a normal, intermediate or poor metabolizer phenotype, which sets the
    thiopurine starting dose or triggers substitution with a nonthiopurine agent.
  evidence:

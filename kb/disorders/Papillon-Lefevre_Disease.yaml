- name: Lysosomal Permeabilisation and Autophagic Flux Failure
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    A second, non-neutrophil consequence of cathepsin C loss, and currently the
    only mechanistic proposal that could reach the skin. In fibroblasts cultured
    from PLS patients, autophagic flux is blocked with autophagosomes
    accumulating, oxidative status and oxygen consumption are altered, lysosomes
    become permeable, cathepsin B is released into the cytosol and the NLRP3

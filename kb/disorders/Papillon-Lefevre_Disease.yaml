    reference_title: "Papillon-Lefèvre syndrome patient reveals species-dependent requirements for neutrophil defenses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Proteome analysis of patient neutrophil granules revealed that several
      proteins that normally localize to azurophil granules, including the major
      serine proteases, elastase, cathepsin G, and proteinase 3, were absent.
    explanation: >-
      Establishes absence rather than inactivity of the proteases.
  - reference: PMID:25244098
    reference_title: "Papillon-Lefèvre syndrome patient reveals species-dependent requirements for neutrophil defenses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      these proteins were completely absent in mature neutrophils, indicating
      that CTSC mutation promotes protease degradation in more mature
      hematopoietic subsets, but does not affect protease production in
      progenitor cells
    explanation: >-
      Localises the loss to post-sorting degradation in mature cells, which is
      what makes this a second cathepsin C function rather than a restatement of
      the activation defect.
  downstream:
  - target: Failure of Oxygen-Independent Antimicrobial Defence
    causal_link_type: DIRECT

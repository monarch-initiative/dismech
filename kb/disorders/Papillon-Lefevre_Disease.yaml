pathophysiology:
- name: Biallelic CTSC Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. CTSC on chromosome 11q14 encodes cathepsin C
    (dipeptidyl peptidase I), a lysosomal cysteine exopeptidase. Disease alleles
    span nonsense, frameshift, splice and missense classes; more than seventy
    have been reported. The 1999 homozygosity-mapping study that identified the
    gene narrowed the interval to 1.2 cM and found mutations in all eight
    families examined.

    Missense alleles are not a milder class here. The p.H405N substitution, the
    first described in the enzyme's active site, abolishes activity as completely
    as a truncation does, and so does the p.Y168C substitution characterised
    later. That is why this node is curated as loss of function across the whole
    allelic spectrum rather than being subdivided by variant class.
  genes:
  - preferred_term: CTSC
    term:
      id: hgnc:2528
      label: CTSC
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Loss of function established biochemically rather than inferred from allele
      class: cathepsin C activity is essentially absent in patient
      polymorphonuclear leukocytes, including for active-site missense alleles.
      Zygosity is left unset at disease level because reported patients are
      variously homozygous (typically consanguineous) and compound heterozygous.
  evidence:
  - reference: PMID:10581027
    reference_title: "Loss-of-function mutations in the cathepsin C gene result in periodontal disease and palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The gene (CTSC) encoding the lysosomal protease cathepsin C (or dipeptidyl
      aminopeptidase I) lies within this interval. We defined the genomic
      structure of CTSC and found mutations in all eight families.
    explanation: >-
      The gene-discovery result identifying CTSC as the PLS locus.
  - reference: PMID:15108292
    reference_title: "Loss-of-function mutations in cathepsin C in two families with Papillon-Lefèvre syndrome are associated with deficiency of serine proteinases in PMNs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second consanguineous family displayed a c.1213C>A mutation which
      resulted in the novel mutation p.H405N and is the first mutation described
      in the active site of the enzyme.
    explanation: >-
      An active-site missense allele, and the reason this node treats missense
      variants as loss-of-function rather than as a hypomorphic class.
  downstream:
  - target: Failure of Neutrophil Serine Protease Zymogen Activation

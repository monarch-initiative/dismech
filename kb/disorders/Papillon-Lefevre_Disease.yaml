  description: >-
    Symmetric, well-demarcated thickening and erythema of palms and soles,
    ranging from mild psoriasiform scaling to overt hyperkeratosis, and often
    extending to elbows and knees. Present in essentially all patients. In the
    47-patient cohort the feet scored significantly worse than the hands, and the
    two correlated strongly with each other but not with age.

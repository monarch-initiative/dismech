- name: Loss of Neutrophil Serine Proteases from Azurophil Granules
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    A distinct claim from the one above, and the more surprising of the two: in
    PLS the proteases are not present-but-inactive, they are gone. Proteome
    analysis of patient neutrophil granules found elastase, cathepsin G and
    proteinase 3 absent. Bone-marrow work in the same patient localised where
    this happens - synthesis, initial processing and sorting are normal in
    immature myeloid cells, and the proteins disappear only in mature
    neutrophils. Cathepsin C therefore has a second, chaperone-like role
    protecting these proteases from degradation, separate from activating them.

    This is curated as its own node because it changes what a therapy would have
    to do. Restoring the activating cleavage alone would not help if the
    substrate has already been degraded.
  biological_processes:
  - preferred_term: proteolysis

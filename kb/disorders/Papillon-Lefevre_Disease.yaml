inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic CTSC loss of function. The gene-discovery study found mutations in
    all eight consanguineous families it mapped, and demonstrated the expected
    recessive dose-response biochemically: near-total loss of cathepsin C
    activity in patients and intermediate, reduced activity in obligate carriers.
    Carriers are clinically unaffected.
  evidence:
  - reference: PMID:10581027
    reference_title: "Loss-of-function mutations in the cathepsin C gene result in periodontal disease and palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In two of these families we used a functional assay to demonstrate an
      almost total loss of cathepsin C activity in PLS patients and reduced
      activity in obligate carriers.
    explanation: >-
      The enzymatic gene-dosage result that establishes recessive inheritance at
      the biochemical level, not just the pedigree level.
has_subtypes:
- name: Classic PLS
  display_name: Classic Papillon-Lefevre syndrome
  description: >-
    Palmoplantar keratoderma plus aggressive periodontitis, without the skeletal
    and nail features of Haim-Munk syndrome. This is the great majority of
    reported patients and is what the rest of this entry describes.
- name: HMS
  display_name: Haim-Munk syndrome (allelic CTSC disease)
  description: >-
    Allelic to PLS - the same gene, and in the defining study a mutation in the
    same CTSC codon as a classical PLS family. It adds arachnodactyly,
    acro-osteolysis, atrophic nail changes and a radiographic finger deformity to
    the shared keratoderma and periodontitis, and has been described only among
    descendants of a religious isolate originally from Cochin, India.

    Curated as a subtype rather than a separate entry because the causal gene,
    the protease-activation lesion and both cardinal features are shared; what
    differs is an additional skeletal phenotype whose mechanistic relation to
    cathepsin C loss is not established.
  evidence:
  - reference: PMID:10662807
    reference_title: "Haim-Munk syndrome and Papillon-Lefèvre syndrome are allelic mutations in cathepsin C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings provide evidence that PLS and HMS are allelic variants of
      cathepsin C gene mutations.
    explanation: >-
      The allelism result that makes HMS a subtype of this entry rather than a
      separate disease.
  - reference: PMID:10662807
    reference_title: "Haim-Munk syndrome and Papillon-Lefèvre syndrome are allelic mutations in cathepsin C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a number of additional findings are reported in HMS including
      arachnodactyly, acro-osteolysis, atrophic changes of the nails, and a
      radiographic deformity of the fingers
    explanation: >-
      The features that distinguish the HMS subtype from classic PLS.

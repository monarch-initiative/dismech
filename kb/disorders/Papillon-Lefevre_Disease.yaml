    explanation: >-
      Sequencing resolving two clinically diagnosed patients as not having PLS.
treatments:
- name: Acitretin
  description: >-
    The systemic retinoid with the most PLS-specific evidence. In a reported
    11-year-old treated with intermittent low-dose acitretin after methotrexate
    failed, both components improved: keratoderma by more than 75 percent during
    active therapy, and - the more surprising result - periodontitis, with an
    increase in alveolar bone height and periodontal attachment that was stable
    at one year.

    The evidence base is single cases and small series, not trials, and the skin
    response is dependent on continued treatment: keratoderma worsened whenever
    the drug was stopped and improved when it was restarted. Acitretin is
    teratogenic with a long washout, which constrains its use in women of
    childbearing potential.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: acitretin
      term:
        id: CHEBI:50172
        label: acitretin
  target_mechanisms:
  - target: Palmoplantar Epidermal Hyperkeratosis
    description: >-
      Retinoids normalise keratinocyte differentiation and desquamation; the
      response here is symptomatic, and does not address the cathepsin C defect.
  evidence:
  - reference: PMID:25313946
    reference_title: "Low-dose acitretin in Papillon-Lefèvre syndrome: treatment and 1-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with acitretin resulted in excellent improvement of
      periodontitis, increase in the alveolar bone height, and periodontal
      attachment. Improvement remained stable at the end of 1-year follow-up.
    explanation: >-
      The periodontal and radiographic response with one-year durability, in a
      single treated patient.
  - reference: PMID:25313946

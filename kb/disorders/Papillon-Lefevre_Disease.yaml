- name: Granzyme Activation in Cytotoxic Lymphocytes
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The second protease arm cathepsin C serves, and - unlike the neutrophil arm -
    a contested one in humans. Curated as a node so the disagreement is visible
    rather than resolved in one direction.

    The premise is not in doubt: cathepsin C activates granzymes A and B in the
    lytic granules of cytotoxic lymphocytes and NK cells by the same N-terminal
    dipeptide removal it performs on the neutrophil serine proteases. In DPPI-null
    mice the consequence is exactly what that predicts - granzymes A and B are
    present in normal amounts but retain their prodipeptide domains and are
    inactive, and cytotoxic assays show severe defects in target-cell apoptosis
    comparable to perforin-null or granzyme A/B double-null effectors.

    Humans with PLS do not follow. Direct measurement in patients found retained
    significant granzyme activity in the lymphokine-activated killer compartment
    and normal LAK-mediated cytotoxicity against K562 targets - a result the
    authors offered as the molecular explanation for the absence of a generalised
    T cell immunodeficiency phenotype in PLS. Against that, clinical reviews
    describe impaired NK cytotoxic function as the first consistent immune
    dysfunction reported in these patients, and propose it as a contributor to
    the periodontitis.

    Graded HYPOTHETICAL, and carrying no directional modifier, because a direct
    measurement in patients outranks a narrative review's summary of prior
    reports, and the measurement points the other way. What is well supported is
    that this is a real disagreement worth resolving, not that the arm fails.
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  evidence:
  - reference: PMID:39164687
    reference_title: "Cathepsin C in health and disease: from structural insights to therapeutic prospects."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It plays a key role in the activation of serine proteases in cytotoxic T
      cells, natural killer cells (granzymes A and B), mast cells (chymase and
      tryptase) and neutrophils (cathepsin G, neutrophil elastase, proteinase 3)
    explanation: >-
      The premise both sides of this disagreement share - that cathepsin C is the
      granzyme activator. Graded OTHER because it is a review's background
      statement.
  - reference: PMID:15585850
    reference_title: "Papillon-Lefèvre syndrome: correlating the molecular, cellular, and clinical consequences of cathepsin C/dipeptidyl peptidase I deficiency in humans."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, patients with PLS retain significant granzyme activities in a
      cytotoxic lymphocyte compartment (lymphokine-activated killer) and have
      normal lymphokine-activated killer-mediated cytotoxicity against K562 cells.
    explanation: >-
      Direct measurement in PLS patients, and the reason this node carries no
      DECREASED modifier and is graded HYPOTHETICAL. Graded REFUTE because it is
      evidence against the arm failing in humans.
  - reference: PMID:15585850
    reference_title: "Papillon-Lefèvre syndrome: correlating the molecular, cellular, and clinical consequences of cathepsin C/dipeptidyl peptidase I deficiency in humans."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      provides a molecular explanation for the lack of a generalized T cell
      immunodeficiency phenotype in patients with PLS
    explanation: >-
      The authors' interpretation: retained granzyme activity is why PLS is not a
      T cell immunodeficiency. Also graded REFUTE, for the same reason.
  - reference: PMID:26203280
    reference_title: "Papillon-Lefèvre syndrome: clinical presentation and management options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent advances reported that the impairment of natural killer cell
      cytotoxic function is the first consistent immune dysfunction in PLS. This
      suggests that the impaired natural killer cell cytotoxicity might
      contribute to the pathogenesis of PLS-associated periodontitis.
    explanation: >-
      The other side of the disagreement. Graded PARTIAL rather than SUPPORT
      because it is a review summarising prior reports, its own hedge is intact
      ("might contribute"), and it is contradicted by the direct measurement
      above.
  - reference: PMID:26203280
    reference_title: "Papillon-Lefèvre syndrome: clinical presentation and management options."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      So, the available reports on immunological alterations in PLS patients do
      not provide any consistent findings.
    explanation: >-
      The same review's assessment of the wider literature, which is the fairest
      summary of where this node stands.
- name: Failure of Oxygen-Independent Antimicrobial Defence
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    The mechanism that best explains why the periodontal pocket, of all sites, is
    where PLS neutrophils fail. Two protease-dependent, oxygen-independent
    functions are lost together. First, the proteases convert the neutrophil
    precursor hCAP-18 into the antimicrobial peptide LL-37, which is active
    against Aggregatibacter (formerly Actinobacillus) actinomycetemcomitans; PLS
    neutrophils release less LL-37 and cannot process hCAP-18 on ionomycin
    stimulation. Second, cathepsin G and elastase normally degrade the
    pore-forming leukotoxin that A. actinomycetemcomitans uses against
    phagocytes, and PLS neutrophils cannot, so they take more damage from it.

    The periodontal pocket has low oxygen tension, so defence there leans on
    exactly the oxygen-independent machinery that is missing. Graded PROVISIONAL
    rather than ESTABLISHED: the individual biochemical steps are demonstrated in
    patient cells, but the inference that this is *the* reason for the site
    selectivity is the authors' hypothesis, not a tested one.
  biological_processes:
  - preferred_term: antibacterial peptide production
    term:
      id: GO:0002778
      label: antibacterial peptide production
    modifier: DECREASED
  - preferred_term: defense response to bacterium
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  cell_types:
  - preferred_term: neutrophil
    term:

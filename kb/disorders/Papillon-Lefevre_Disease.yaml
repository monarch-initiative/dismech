name: Papillon-Lefevre Disease
creation_date: "2026-08-29T06:00:00Z"
category: Genetic
disease_term:
  preferred_term: Papillon-Lefevre syndrome
  term:
    id: MONDO:0009490
    label: Papillon-Lefevre disease
description: >-
  Papillon-Lefevre syndrome (PLS) is the autosomal recessive disease of biallelic
  cathepsin C (CTSC) loss of function. Cathepsin C, also called dipeptidyl
  peptidase I, removes an N-terminal dipeptide from the zymogen forms of the
  three neutrophil serine proteases - elastase, cathepsin G and proteinase 3 -
  and from granzymes in cytotoxic lymphocytes. Without it those proteases never
  become active, and in mature neutrophils they are not merely inactive but
  absent, because cathepsin C also protects them from degradation after sorting.

  The clinical picture is unusually narrow for so broad a molecular lesion:
  diffuse palmoplantar keratoderma appearing in the first three years of life,
  and an aggressive periodontitis that destroys the deciduous dentition as it
  erupts and then repeats itself on the permanent teeth, leaving many patients
  edentulous in their teens. Pyogenic liver abscess is the one systemic
  complication that recurs often enough to be worth screening for.

  What makes PLS mechanistically interesting is what does *not* happen. Patients
  lack all three neutrophil serine proteases and yet are not
  immunocompromised in the way mouse knockouts predict: they do not get
  opportunistic infections, and their neutrophils kill bacteria in vitro about as
  well as controls. The disease is therefore curated here as a
  tissue-selective failure - of oxygen-independent antimicrobial defence in the
  anaerobic periodontal pocket, and of an as-yet-unidentified cathepsin C
  function in palmoplantar epidermis - rather than as a systemic
  immunodeficiency. Cathepsin C also activates granzymes, and whether that second
  arm fails in humans is genuinely contested: direct measurement in patients
  found retained granzyme activity and normal cytotoxicity, where the mouse null
  has inactive granzymes and a severe cytotoxic defect. The two cardinal features do not even
  track each other:
  in the largest published cohort the severity of skin and periodontal disease
  were uncorrelated.

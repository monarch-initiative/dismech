- name: Antibiotic Therapy
  description: >-
    Systemic antibiotics, usually amoxicillin with metronidazole, given alongside
    mechanical debridement to suppress Aggregatibacter actinomycetemcomitans -
    the organism PLS neutrophils are specifically unable to handle, because they
    can neither generate LL-37 against it nor degrade its leukotoxin. Antibiotics
    are also what treats the pyogenic liver abscess when it occurs.

    Curated as adjunctive rather than disease-modifying: no trial has tested an
    antibiotic regimen against a PLS endpoint, and the evidence here is the
    mechanistic rationale plus case-series practice.

- name: Prosthetic and Implant Rehabilitation
  description: >-
    What happens after the teeth are lost, which for most patients is the larger
    part of their dental care. Management is staged by age: removable partial or
    complete dentures during the mixed-dentition period, with tooth forms chosen
    to resemble the deciduous dentition, and complete dentures for the edentulous
    adult.

    Osseointegrated implants improve retention, support and stability, but they
    are not a solution to the underlying defect - peri-implantitis recurs on the
    same neutrophil substrate, and implants are contraindicated in growing
    individuals because they behave like ankylosed teeth and end up
    infra-positioned as the jaw grows.

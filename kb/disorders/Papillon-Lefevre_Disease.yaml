genetic:
- name: CTSC
  gene_term:
    preferred_term: CTSC
    term:
      id: hgnc:2528
      label: CTSC
  relationship_type: CAUSATIVE
  notes: >-
    The only established PLS gene. It lies on chromosome 11q14 and encodes
    cathepsin C / dipeptidyl peptidase I. Reported disease alleles include
    nonsense, frameshift, splice-site and missense changes; the active-site
    missense p.H405N and the p.Y168C substitution both abolish enzyme activity
    entirely, so allele class is a poor predictor of residual function here.

    A functional caveat that matters for diagnostics: a small number of patients
    with a PLS-like phenotype have normal urinary cathepsin C and no CTSC
    loss-of-function variant, so a clinical diagnosis of PLS is not by itself
    evidence of a CTSC lesion.
  evidence:
  - reference: PMID:10581027
    reference_title: "Loss-of-function mutations in the cathepsin C gene result in periodontal disease and palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The PLS locus has been mapped to chromosome 11q14-q21 (refs 7, 8, 9). Using
      homozygosity mapping in eight small consanguineous families, we have
      narrowed the candidate region to a 1.2-cM interval
    explanation: >-
      The mapping that localised the gene.
  - reference: PMID:26607765
    reference_title: "Analysis of urinary cathepsin C for diagnosing Papillon-Lefèvre syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CatC was detected in the urine of the other two patients, and genetic
      analysis revealed no loss-of-function mutation in CTSC, indicating that
      they suffer from a PLS-like condition but not from PLS.
    explanation: >-
      The phenocopy caveat: two of 31 clinically diagnosed patients had neither
      the biochemical nor the genetic lesion.
biochemical:
- name: Cathepsin C Enzymatic Activity
  notes: >-
    Essentially absent in PLS - in polymorphonuclear leukocytes, in cultured
    fibroblasts and in urine. Obligate heterozygotes have intermediate activity.
    It is the most direct biochemical readout of the disease.
  evidence:
  - reference: PMID:10581027
    reference_title: "Loss-of-function mutations in the cathepsin C gene result in periodontal disease and palmoplantar keratosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      an almost total loss of cathepsin C activity in PLS patients and reduced
      activity in obligate carriers
    explanation: >-
      The activity measurement in patients and carriers.
- name: Neutrophil Serine Protease Activity
  notes: >-
    Elastase, cathepsin G and proteinase 3 activity are all undetectable in PLS
    neutrophils. Because the proteins themselves are degraded rather than merely
    left as zymogens, an antigen assay is also negative - which is worth knowing
    before designing an assay around zymogen detection.
  evidence:
  - reference: PMID:15108292
    reference_title: "Loss-of-function mutations in cathepsin C in two families with Papillon-Lefèvre syndrome are associated with deficiency of serine proteinases in PMNs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no activity of the three serine proteinases elastase, cathepsin G and
      proteinase 3
    explanation: >-
      The direct measurement of all three protease activities in patient PMNs.
- name: Urinary Cathepsin C
  notes: >-
    Proteolytically active cathepsin C and its proform are constitutively
    excreted in the urine of healthy people across the age range, and are absent
    in PLS. This makes urine a low-cost diagnostic matrix where genetic testing
    is unavailable.
  evidence:
  - reference: PMID:26607765
    reference_title: "Analysis of urinary cathepsin C for diagnosing Papillon-Lefèvre syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 75 urine samples from healthy control subjects (aged 3 months to 80
      years) contained proteolytically active CatC and its proform, as revealed
      by kinetic analysis and immunochemical detection. Of the urine samples of
      31 patients with a PLS phenotype, 29 contained neither proteolytically
      active CatC nor the CatC antigen
    explanation: >-
      Both the control range and the patient result, with the sample sizes.
diagnosis:
- name: Urinary Cathepsin C Assay
  description: >-
    A non-invasive test that can be done from birth, on the basis that active
    cathepsin C is constitutively present in normal urine. In the validation
    series it identified 29 of 31 clinically diagnosed patients, and the two
    discordant cases turned out to have no CTSC loss-of-function variant either -
    so the assay agreed with sequencing rather than failing against it. Its stated
    purpose is screening soon after birth, before the periodontal destruction
    starts.
  evidence:
  - reference: PMID:26607765
    reference_title: "Analysis of urinary cathepsin C for diagnosing Papillon-Lefèvre syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening for the absence of urinary CatC activity soon after birth and
      early treatment before the onset of PLS manifestations will help to prevent
      aggressive periodontitis and loss of many teeth
    explanation: >-
      The intended screening use. Stated as the authors' expectation - no
      screened-cohort outcome study has been done.
- name: CTSC Sequencing
  description: >-
    Confirmatory molecular testing. It is what separates PLS from the clinically
    indistinguishable PLS-like conditions that have normal cathepsin C.
  evidence:

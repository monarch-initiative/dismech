discussions:
- discussion_id: pls_nsp_dispensable_in_humans
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why are neutrophil serine proteases essential for antimicrobial defence in
    mouse knockouts but apparently dispensable in humans who lack all three?
  attaches_to:
  - "pathophysiology#Loss of Neutrophil Serine Proteases from Azurophil Granules"
  - "pathophysiology#Failure of Oxygen-Independent Antimicrobial Defence"
  - "pathophysiology#Granzyme Activation in Cytotoxic Lymphocytes"
  - "animal_models#DPPI-null (Ctsc-/-) mouse"
  rationale: >-
    Curated as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the
    evidence exists on both sides and disagrees. Mouse knockout studies assign
    elastase, cathepsin G and proteinase 3 a crucial role in defence against
    Staphylococcus aureus, Escherichia coli, Candida albicans and Klebsiella
    pneumoniae. Humans who lack the activity of all three - which is what PLS
    is - are not correspondingly infection-prone: they do not get Pneumocystis
    or disseminated fungal disease, their neutrophil counts, morphology,
    priming, radical production and apoptosis regulation are within the control
    range, and PLS neutrophils have been reported to kill bacteria in vitro
    about as well as control cells.

    The authors of the proteomic study state the conclusion in its strongest
    form - that neutrophil serine proteases are dispensable for human
    immunoprotection. That is the claim this discussion exists to flag rather
    than to endorse: it rests on the clinical phenotype of a small number of
    patients, and PLS patients do have a distinctive and severe infection-linked
    pathology, just one confined to the periodontium and, occasionally, the
    liver. A more careful reading is that the requirement is site-specific
    rather than absent, and that mouse challenge models - systemic inoculation
    of a defined pathogen - are not built to detect a defect that manifests as
    chronic destruction in an anaerobic mucosal pocket.

    The granzyme arm makes the same point twice over, and it is the sharper
    version of it. In DPPI-null mice granzymes A and B are present but
    unprocessed and inactive, with a cytotoxic defect as severe as a
    perforin-null. In PLS patients granzyme activity in the lymphokine-activated
    killer compartment is retained and LAK-mediated cytotoxicity is normal - which
    the authors offered as the molecular explanation for the absence of a
    generalised T cell immunodeficiency in PLS. So on the arm where the mouse
    prediction is strongest and cleanest, the human result is the opposite.

    There is also a direct measurement on the bacterial-killing question, which
    is worth having because it separates two claims that are easy to run
    together: neutrophils from PLS patients do not uniformly have a defect in
    killing Staphylococcus aureus and Escherichia coli, suggesting that serine
    proteases are not the major mechanism human neutrophils use against common
    bacteria. That is a statement about human neutrophil biology, not about
    disease severity, and it is what makes the mouse-to-human extrapolation
    unsafe rather than merely imprecise.

    Resolving it matters practically, because cathepsin C inhibitors are in
    clinical development for neutrophil-driven inflammatory disease, and PLS is
    the natural experiment those programmes cite for their safety case. The
    direction of the error matters there too: the mouse over-predicts harm, so a
    safety case built on it is conservative, while a mechanistic case for
    efficacy built on it is not.
  evidence:
  - reference: PMID:16926422
    reference_title: "Role of polymorphonuclear leukocyte-derived serine proteinases in defense against Actinobacillus actinomycetemcomitans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies of knockout mice reveal a crucial role in the defense against
      pathogens such asStaphylococcus aureus(57) andEscherichia coli(4,48),Candida
      albicans(57), orKlebsiella pneumoniae(4).
    explanation: >-
      The murine side of the mismatch, with the organisms named. Graded OTHER
      because it is this paper's summary of prior mouse work rather than its own
      experiment - which is part of why the mismatch is recorded as open rather
      than settled. The quoted text runs words together where the cache stripped
      the source's citation markup; it is reproduced exactly as cached.
  - reference: PMID:25244098
    reference_title: "Papillon-Lefèvre syndrome patient reveals species-dependent requirements for neutrophil defenses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite serine protease-deficient immune cell populations, PLS patients do
      not exhibit marked immunodeficiency.
    explanation: >-
      The human side of the mismatch, stated by the study that proposed the
      species-dependence.
  - reference: PMID:15585850
    reference_title: "Papillon-Lefèvre syndrome: correlating the molecular, cellular, and clinical consequences of cathepsin C/dipeptidyl peptidase I deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neutrophils from patients with PLS do not uniformly have a defect in their
      ability to kill Staphylococcus aureus and Escherichia coli, suggesting that
      serine proteases do not represent the major mechanism used by human
      neutrophils for killing common bacteria.
    explanation: >-
      The direct measurement on the bacterial-killing question, in the two
      organisms the mouse knockout literature is built on. It separates a claim
      about human neutrophil biology from a claim about disease severity.
  - reference: PMID:15585850
    reference_title: "Papillon-Lefèvre syndrome: correlating the molecular, cellular, and clinical consequences of cathepsin C/dipeptidyl peptidase I deficiency in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surprisingly, patients with PLS retain significant granzyme activities in a
      cytotoxic lymphocyte compartment (lymphokine-activated killer) and have
      normal lymphokine-activated killer-mediated cytotoxicity against K562 cells.
    explanation: >-
      The granzyme arm of the same mismatch: the mouse null loses granzyme
      activity and cytotoxicity, the human patient does not.
  proposed_experiments:
  - experiment_id: pls_ctsc_null_oral_challenge
    name: Oral-cavity challenge in a Ctsc-null mouse
    description: >-
      Compare periodontal bone loss and subgingival microbiota in Ctsc-null and
      wild-type mice after oral colonisation with Aggregatibacter
      actinomycetemcomitans, rather than by systemic challenge. Tests whether the
      species difference is in the protease requirement itself or in which
      compartment the assay interrogates.
    would_support:
    - "pathophysiology#Failure of Oxygen-Independent Antimicrobial Defence"
    supporting_outcome:
    - >-
        Ctsc-null mice develop accelerated alveolar bone loss with A.
        actinomycetemcomitans colonisation while remaining resistant to systemic
        challenge with the same organism.
    refuting_outcome:
    - >-
        Ctsc-null mice show no more periodontal bone loss than wild-type after oral
        colonisation, which would place the site selectivity in human-specific
        tissue biology rather than in the protease requirement.
- discussion_id: pls_keratoderma_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the cathepsin C substrate in palmoplantar epidermis whose loss
    produces the keratoderma?
  attaches_to:
  - "pathophysiology#Palmoplantar Epidermal Hyperkeratosis"
  rationale: >-
    Curated as a KNOWLEDGE_GAP because the evidence is absent rather than
    conflicting. The periodontal branch of this disease has a substrate chain
    that is demonstrated end to end - cathepsin C activates three named
    proteases, those proteases generate LL-37 and degrade leukotoxin, and both
    functions are measurably lost in patient cells. The cutaneous branch has no
    equivalent. The standard account - impaired proteolytic turnover of
    corneodesmosomes causing retention hyperkeratosis - names no substrate and
    rests on the expression of cathepsin C in palmoplantar keratinocytes rather
    than on any measured processing defect there.

    Two facts constrain any candidate mechanism and are recorded in the
    pathophysiology nodes: the skin and periodontal phenotypes are uncorrelated
    in severity across 47 patients, and the keratoderma appears within the first
    three years of life. So the answer is unlikely to be a downstream
    consequence of the periodontal disease or of neutrophil dysfunction. The
    fibroblast autophagy work is the nearest available lead, but it was done in
    dermal fibroblasts rather than keratinocytes and has not been connected to
    stratum corneum turnover.
  proposed_experiments:
  - experiment_id: pls_keratinocyte_degradomics
    name: Degradomic comparison of PLS and control palmoplantar keratinocytes
    description: >-
      N-terminomics on differentiated keratinocytes from PLS patients and
      controls, to identify proteins whose N-terminal dipeptide processing
      depends on cathepsin C, with corneodesmosomal components as the prior
      candidates.
    would_support:
    - "pathophysiology#Palmoplantar Epidermal Hyperkeratosis"
    supporting_outcome:
    - >-
        One or more corneodesmosomal or desquamation-pathway proteins show
        cathepsin C-dependent N-terminal processing that is absent in patient
        keratinocytes.
    refuting_outcome:
    - >-
        No differentially processed epidermal substrate is found, which would push
        the mechanism towards the indirect lysosomal and autophagic route rather
        than a direct proteolytic one.
- discussion_id: pls_net_residual_activity_allele_specific
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is residual NET formation in PLS allele-specific, and does it track
    periodontal severity?
  attaches_to:
  - "pathophysiology#Impaired Neutrophil Extracellular Trap Formation"
  rationale: >-
    Two studies report PLS neutrophils incapable of forming NETs; a third,
    studying the CTSC 503A>G (p.Y168C) allele, found NET formation severely
    depressed and delayed but not abolished, in cells with no detectable
    cathepsin C protein or protease activity. If NET formation can be partly
    protease-independent, then residual NETs are not a marker of residual enzyme
    and would not predict a milder course - but nobody has measured NET output
    and periodontal severity in the same patients across several alleles.

    This is recorded rather than resolved because the honest reading of the
    current literature is that assay conditions differ between the studies as
    much as the alleles do.
  proposed_experiments:
  - experiment_id: pls_cross_allele_net_assay
    name: Cross-allele NET assay with paired periodontal staging
    description: >-
      Standardised PMA- and ionomycin-stimulated NET quantification in patients
      spanning several CTSC genotypes, scored against contemporaneous periodontal
      staging and grading.
    would_support:
    - "pathophysiology#Impaired Neutrophil Extracellular Trap Formation"
    supporting_outcome:
    - >-
        Residual NET output varies by genotype and correlates inversely with
        periodontal attachment loss.
    refuting_outcome:
    - >-
        Residual NET output is uniform across genotypes and unrelated to
        periodontal severity, indicating the between-study difference is
        methodological.
notes: >-
  Curated from a Perplexity deep-research report plus independent PubMed
  searching. The report's narrative framing was used as a lead only; every
  evidence snippet in this entry is quoted from a cached primary reference
  fetched via `just fetch-reference`, and no ontology CURIE was taken from the
  report - its term-validation section reported 27 of 60 checked labels
  mismatched, including CL:0000094 offered as "neutrophil" when the ontology
  calls it granulocyte, and UBERON:0001838 offered as "gingiva" when gingiva is
  UBERON:0001828. All bindings here were resolved independently against the
  committed term caches and OLS.

  No GeneReviews chapter exists for Papillon-Lefevre syndrome; a PubMed search
  for "Papillon-Lefevre Syndrome GeneReviews" returned no results, so the
  Step 3b baseline does not apply.

  A third allelic CTSC condition, prepubertal or aggressive periodontitis type 1,
  is described in the literature: periodontitis without the palmoplantar
  keratoderma. It is not curated as a has_subtypes entry here because the
  evidence consulted does not establish it as a distinct entity rather than the
  low-penetrance end of the keratoderma phenotype - the gene-discovery paper
  notes that some patients have only palmoplantar keratosis or only
  periodontitis. Recorded so the concept is not lost.

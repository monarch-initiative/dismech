    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild worsening of palmoplantar keratoderma was noticed whenever the drug
      was stopped. It improved when the drug was restarted.
    explanation: >-
      Establishes treatment dependence of the skin response. Graded PARTIAL
      because it qualifies the benefit rather than simply supporting it.
- name: Intensive Periodontal Therapy and Oral Hygiene
  description: >-
    Mechanical debridement, rigorous plaque control and close recall, usually
    combined with antibiotics targeting Aggregatibacter actinomycetemcomitans.
    This is the standard of care and it is a delaying strategy rather than a
    curative one: the underlying neutrophil defect is unchanged, and the disease
    recurs on implants placed after the natural dentition is lost.

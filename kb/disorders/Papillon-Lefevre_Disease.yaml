    reference_title: "Role of polymorphonuclear leukocyte-derived serine proteinases in defense against Actinobacillus actinomycetemcomitans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that the PMNs of PLS patients released lower levels of LL-37.
      Furthermore, because of their deficiency in serine proteases, the PMNs of
      PLS patients were incapable of neutralizing the leukotoxin produced by this
      pathogen, which resulted in increased cell damage.
    explanation: >-
      Both protease-dependent defences failing in the same patient cells, against
      the organism most consistently recovered from PLS periodontal pockets.
  - reference: PMID:25244098
    reference_title: "Papillon-Lefèvre syndrome patient reveals species-dependent requirements for neutrophil defenses."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      were unable to process endogenous cathelicidin hCAP-18 into the
      antibacterial peptide LL-37 in response to ionomycin
    explanation: >-

    causal_link_type: DIRECT
- name: Impaired Neutrophil Extracellular Trap Formation
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NET formation requires the serine proteases, and it fails in PLS. How
    completely it fails is where the reports differ, and the difference is worth
    keeping rather than averaging away: two studies describe patient neutrophils
    as incapable of producing NETs, while a third, examining a different CTSC
    allele, found NET formation severely depressed and delayed but not abolished.
    Both are curated, because a residual-NET phenotype is the kind of observation
    that would distinguish allele-specific severity if anyone assembled enough
    patients to test it.

    reference_title: "Triglyceride storage disease. A report of two affected children associated with neurological abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is postulated that a primary metabolic defect occurs in peripheral
      adipose tissue (and possibly at other sites such as the liver) that
      interferes with triglyceride (and glycogen) mobilization during prolonged
      malnutrition.
    explanation: >-
      States the authors' hypothesis that a primary adipose defect impairs
      triglyceride mobilization; it is a postulate, not a demonstrated mechanism.

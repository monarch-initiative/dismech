  diagnosis_term:
    preferred_term: Laboratory Procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  description: >-
    Historical research assay on biopsied peripheral subcutaneous adipose
    tissue measuring noradrenaline-stimulated adenylate cyclase activity,
    isoprenaline-stimulated cyclic-AMP accumulation, and glycerol release; not
    a validated modern clinical diagnostic test.
  presence: Reduced sensitivity of adenylate cyclase to noradrenaline, absent cyclic-AMP rise with isoprenaline, and impaired glycerol release in peripheral adipose tissue
  evidence:
  - reference: PMID:187005
    reference_title: "Triglyceride storage disease. A report of two affected children associated with neurological abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

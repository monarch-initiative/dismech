    term:
      id: UBERON:0002190
      label: subcutaneous adipose tissue
  biological_processes:
  - preferred_term: adenylate cyclase-activating adrenergic receptor signaling pathway
    term:
      id: GO:0071880
      label: adenylate cyclase-activating adrenergic receptor signaling pathway
    modifier: DECREASED
  - preferred_term: triglyceride catabolic process
    term:
      id: GO:0019433
      label: triglyceride catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:187005
    reference_title: "Triglyceride storage disease. A report of two affected children associated with neurological abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Peripheral adipose tissue of one of these children displayed: (a) reduced
      sensitivity of adenyl cyclase to stimulation by noradrenaline (b) no
      response in tissue levels of cyclic AMP when stimulated by isoprenaline
      and (c) impaired release of glycerol following stimulation with
      isoprenaline.
    explanation: >-
      The ex vivo adipose-tissue assay defines the type 1 pattern: blunted
      adenylate-cyclase and cyclic-AMP responses with impaired glycerol
      release. It comes from one child only.
  - reference: DOI:10.1093/oxfordjournals.qjmed.a067378
    reference_title: Triglyceride Storage Disease
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In one infant noradrenaline(10−5M) poorly stimulated the activity of
      adenyl cyclase in subcutaneous adipose tissue in the periphery compared to
      abdominal tissue (P &lt; 0.05)
    explanation: >-
      The 1974 classification paper reports the same poorly stimulated
      peripheral adenylate-cyclase activity in an infant.
  downstream:
  - target: Excessive Peripheral Adipose Triglyceride Storage
    description: >-
      The blunted lipolytic signal was associated with excess triglyceride in
      peripheral adipose tissue; the causal chain was proposed rather than
      demonstrated.
    causal_link_type: UNKNOWN
    evidence:
    - reference: DOI:10.1093/oxfordjournals.qjmed.a067378
      reference_title: Triglyceride Storage Disease
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        and this was associated with excessive accumulation of triglyceride in
        the periphery
      explanation: >-
        The source reports an association between the adenylate-cyclase defect
        and peripheral triglyceride accumulation, not a demonstrated mechanism.
- name: Excessive Peripheral Adipose Triglyceride Storage
  description: >-
    Triglyceride deposits persisted in peripheral adipose tissue despite severe
    malnutrition. The authors postulated a primary adipose-tissue defect that
    interferes with triglyceride mobilization during prolonged malnutrition.
  role: central_effector
  mechanism_confidence: PROVISIONAL

  rationale: >-
    Evidence is limited to very few children studied in the 1970s, with the
    functional assay done in tissue from one severely malnourished child. The
    classification was explicitly provisional, no gene has been identified,
    and the congenital abnormalities are not causally linked to the lipolysis
    defect by any cited source.
  evidence:

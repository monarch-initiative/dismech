pathophysiology:
- name: Blunted Catecholamine-Stimulated Adenylate Cyclase Activation in Peripheral Adipose Tissue
  description: >-
    In peripheral subcutaneous adipose tissue from the reported children,
    noradrenaline poorly stimulated adenylate cyclase and isoprenaline produced
    no rise in tissue cyclic AMP, with correspondingly impaired glycerol
    release. The historical authors placed the defect at or before cyclic-AMP
    generation, in contrast to the preserved-cAMP type 2 pattern, but neither
    the affected protein nor the precise step was identified, and the assay was
    performed on tissue from severely malnourished children.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
  cell_types:

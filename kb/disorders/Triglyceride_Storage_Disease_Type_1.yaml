name: Triglyceride Storage Disease Type 1
creation_date: "2026-06-13T00:00:00Z"
description: >-
  Triglyceride storage disease type 1 is a historical, sparsely reported
  adipose-tissue lipolysis phenotype catalogued as MONDO:0008601 and
  OMIM:190420. It was described in infants and young children with excess
  triglyceride deposits in peripheral adipose tissue despite severe
  malnutrition; in the tissue studied, catecholamine stimulation of adenylate
  cyclase was blunted, so that isoprenaline produced no cyclic-AMP rise and
  little glycerol release. The two children of the 1976 report also had
  congenital abnormalities (microcephaly, nystagmus, deafness, hepatomegaly).
  The original classification was explicitly provisional and no gene or
  molecular lesion has been identified. This historical entity is distinct
  from ABHD5-related neutral lipid storage disease with ichthyosis
  (Dorfman-Chanarin disease, MONDO:0010155), with which it has been
  conflated.
synonyms:
- triglyceride storage disease, type I
- TSD type I
category: Mendelian

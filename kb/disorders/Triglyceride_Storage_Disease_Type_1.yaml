    explanation: Both terms denote the ABHD5-related neutral lipid storage disease with ichthyosis.
- name: Triglyceride storage disease type 2 (NLSD type M)
  description: >-
    NLSD type M (myopathy form, PNPLA2) lacks ichthyosis and is caused by ATGL deficiency
    rather than ABHD5 deficiency.
  disease_term:

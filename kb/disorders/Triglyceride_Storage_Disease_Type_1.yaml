      isoprenaline.
    explanation: Defines the ex vivo adipose-tissue functional assay pattern used historically to classify the type 1 defect.
differential_diagnoses:
- name: Historical Triglyceride Storage Disease Type 2
  description: >-
    The historical type 2 phenotype was described in generalized-obese adult
    relatives whose adipose tissue raised cyclic AMP normally after
    isoprenaline but still released little glycerol. Type 1 instead lacked the
    cyclic-AMP response and was reported in malnourished children.
  disease_term:
    preferred_term: triglyceride storage disease, type 2
    term:
      id: MONDO:0008602
      label: triglyceride storage disease, type 2
  distinguishing_features:
  - Generalized adult/familial obesity with preserved isoprenaline-stimulated adipose cyclic-AMP elevation despite reduced glycerol release.
  evidence:
  - reference: PMID:4345904
    reference_title: "Triglyceride storage disease: a disorder of lipolysis in adipose tissue in two patients."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An obese patient was studied whose adipose tissue showed a significant reduction in release of glycerol (P < 0.05) when stimulated by isoprenaline despite normal rises in tissue levels of cyclic-AMP."
    explanation: >-
      The preserved cyclic-AMP response despite impaired glycerol release in
      type 2 adipose tissue distinguishes it from the absent cyclic-AMP
      response of type 1.
- name: Dorfman-Chanarin Disease
  description: >-
    ABHD5-related neutral lipid storage disease with ichthyosis is a
    molecularly defined autosomal recessive disorder with cytoplasmic
    triacylglycerol droplets in most tissues, congenital ichthyosis and
    leukocyte lipid vacuoles. It must not be treated as a synonym for the
    historical adipose-lipolysis phenotype MONDO:0008601 / OMIM:190420.
  disease_term:
    preferred_term: Dorfman-Chanarin disease
    term:
      id: MONDO:0010155
      label: Dorfman-Chanarin disease
  distinguishing_features:
  - Biallelic pathogenic ABHD5 variants, congenital ichthyosis, and multisystem cytoplasmic lipid droplets including Jordans anomaly in leukocytes.
  evidence:
  - reference: PMID:21122093
    reference_title: "Clinical and genetic characterization of Chanarin-Dorfman syndrome patients: first report of large deletions in the ABHD5 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ABHD5/CGI58 gene are associated with CDS"
    explanation: >-
      Establishes Chanarin-Dorfman syndrome as the ABHD5 disease; it is not
      evidence for ABHD5 in the historical type 1 phenotype.

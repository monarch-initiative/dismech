review_notes: >-
  This entry previously described ABHD5-related neutral lipid storage disease
  with ichthyosis under MONDO:0008601, duplicating Dorfman_Chanarin_Disease.
  MONDO:0008601 cross-references OMIM:190420, the historical adipose-lipolysis
  phenotype of the 1974 provisional classification, so the entry was rewritten
  around that phenotype, in parallel with Triglyceride_Storage_Disease_Type_2.
  The ABHD5 content (epidermal barrier mechanism, hepatic failure, ectropion,
  phenotype frequencies and literature case count) was moved into
  Dorfman_Chanarin_Disease. No gene, inheritance mode, treatment, prevalence or
  molecular test is asserted here because none is reported for the historical
  phenotype; inheritance is omitted rather than guessed. The PMID:4362787
  cache holds metadata only, so the 1974 abstract is quoted through its DOI
  cache.

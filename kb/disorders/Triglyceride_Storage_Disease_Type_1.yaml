classifications:
  harrisons_chapter:
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      An inborn error of intracellular triacylglycerol lipolysis; Harrison's covers
      inborn errors of lipid metabolism under the endocrinology/metabolism Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Mendelian autosomal recessive disorder caused by biallelic ABHD5 variants.
  - classification_value: DERMATOLOGY
    notes: >-
      Congenital nonbullous ichthyosis is the defining, disease-naming feature that
      separates NLSD type I from NLSD type M, so the disorder also sits in the
      dermatology Part.
  icimd_category:
  - classification_value: glycerolipid_metabolism
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Disorders of glycerolipid
      metabolism" under category "Disorders of lipid metabolism". ABHD5/CGI-58 is the
      lipid-droplet co-activator of adipose triglyceride lipase, so the primary lesion
      is in triacylglycerol (glycerolipid) catabolism.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Triglyceride storage disease type 1 is inherited in an autosomal recessive
    manner; affected individuals carry biallelic pathogenic ABHD5 variants.
  evidence:
  - reference: PMID:21122093
    reference_title: "Clinical and genetic characterization of Chanarin-Dorfman syndrome patients: first report of large deletions in the ABHD5 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the reported mutations are predicted to be pathogenic because they lead to an early stop codon or a frameshift producing a premature termination of translation."
    explanation: >-
      The variant spectrum reported in patients is loss of function throughout,
      consistent with the recessive, biallelic-loss mechanism.
pathophysiology:
- name: ABHD5/CGI-58 Deficiency
  description: >-
    Biallelic ABHD5 (CGI-58) variants eliminate the lipid-droplet co-activator of adipose
    triglyceride lipase (ATGL); ABHD5 also has an ATGL-independent role in epidermal lipid
    metabolism underlying the ichthyosis.
  gene:
    preferred_term: ABHD5
    term:
      id: hgnc:21396
      label: ABHD5
  biological_processes:
  - preferred_term: triglyceride catabolic process
    term:
      id: GO:0019433
      label: triglyceride catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:28499397
    reference_title: "Neutral Lipid Storage Diseases: clinical/genetic features and natural history in a large cohort of Italian patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neutral Lipid Storage Diseases (NLSDs: NLSD type M with Myopathy and NLSD type I with Ichthyosis)"
    explanation: NLSD type I (ichthyosis form, ABHD5) is the disease corresponding to triglyceride storage disease type 1.
  downstream:
  - target: Systemic Triacylglycerol Droplet Accumulation
    description: Loss of ATGL co-activation prevents triacylglycerol hydrolysis, so TG droplets accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "systemic TG accumulation and severe hepatic steatosis in newborn Cgi-58(-/-) mice establish a limiting role for CGI-58 in ATGL-mediated TG hydrolysis"
      explanation: >-
        The CGI-58 knockout mouse shows that loss of the co-activator limits
        ATGL-mediated hydrolysis and produces systemic TG accumulation. Model-organism
        evidence; the human counterpart is the biochemical droplet finding below.
  - target: Epidermal Lipid-Barrier Defect
    description: In parallel (ATGL-independently), loss of the ABHD5 epidermal lipid role impairs the skin barrier.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "a severe skin permeability barrier defect uncovers an essential ATGL-independent role of CGI-58 in skin lipid metabolism."
      explanation: >-
        Establishes the second, ATGL-independent arm: CGI-58 loss impairs skin lipid
        metabolism directly rather than through the systemic lipolysis defect.
- name: Systemic Triacylglycerol Droplet Accumulation
  description: >-
    Undegraded triacylglycerol accumulates as cytoplasmic lipid droplets in skin, liver,
    muscle, and leukocytes, driving the ichthyosis and visceral disease.
  biological_processes:
  - preferred_term: lipid storage
    term:
      id: GO:0019915
      label: lipid storage
    modifier: INCREASED
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:20023287
    reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutations in both ATGL and CGI-58 cause \"neutral lipid storage disease\" \ncharacterized by massive accumulation of TG in various tissues"
    explanation: ATGL/CGI-58 mutations cause neutral lipid storage disease with TG accumulation in multiple tissues (mechanism shown in the CGI-58 mouse model).
  downstream:
  - target: Hepatic steatosis
    description: Hepatocyte triacylglycerol droplet accumulation produces hepatic steatosis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "systemic TG accumulation and severe hepatic steatosis in newborn Cgi-58(-/-) mice"
      explanation: >-
        Systemic TG accumulation and hepatic steatosis appear together on loss of
        CGI-58, supporting the droplet-to-steatosis edge.
  - target: Hepatomegaly
    description: Hepatic lipid storage enlarges the liver.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hepatocyte lipid droplet accumulation
    - hepatic steatosis
  - target: Hepatic failure
    description: Progressive hepatic lipid storage can culminate in hepatic failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hepatocyte lipid droplet accumulation
    - hepatic steatosis
    evidence:
    - reference: PMID:28499397
      reference_title: "Neutral Lipid Storage Diseases: clinical/genetic features and natural history in a large cohort of Italian patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "two patients (9.5%, both with NLSD-I) died of hepatic failure"
      explanation: >-
        Hepatic failure as a cause of death in NLSD-I specifically supports the
        steatosis-to-failure endpoint of this branch.
  - target: Myopathy
    description: Lipid-droplet accumulation in skeletal muscle produces lipid-storage myopathy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - skeletal muscle lipid droplet accumulation
  - target: Cataract
    description: Systemic neutral lipid storage includes ocular involvement that can manifest as cataract.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing loss
    description: Systemic neutral lipid storage includes ear involvement that can manifest as sensorineural hearing loss.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Epidermal Lipid-Barrier Defect
  description: >-
    ABHD5/CGI-58 has an ATGL-independent role in epidermal lipid metabolism (acylceramide
    synthesis via PNPLA1); its loss impairs the skin permeability barrier, underlying the
    ichthyosis that defines NLSD type I.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  evidence:
  - reference: PMID:20023287
    reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "severe skin permeability barrier defect\nuncovers an essential ATGL-independent role of CGI-58 in skin lipid metabolism"
    explanation: CGI-58/ABHD5 has an ATGL-independent epidermal lipid-metabolism role whose loss causes the skin-barrier defect (ichthyosis).
  downstream:
  - target: Ichthyosis
    description: The ABHD5-dependent epidermal lipid-barrier defect produces the nonbullous congenital ichthyosis phenotype.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20023287
      reference_title: "Growth retardation, impaired triacylglycerol catabolism, hepatic steatosis, and lethal skin barrier defect in mice lacking comparative gene identification-58 (CGI-58)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "sequestration of fatty acids in TG prevents the synthesis of acylceramides, which are essential lipid precursors for the formation of a functional skin permeability barrier. This mechanism may also underlie the pathogenesis of ichthyosis in neutral lipid storage disease patients lacking functional CGI-58."
      explanation: >-
        Gives the acylceramide-precursor mechanism connecting the barrier defect to
        ichthyosis. Note the authors' own hedge ("may also underlie") — the mechanism
        is demonstrated in mouse and proposed, not proven, for human patients.

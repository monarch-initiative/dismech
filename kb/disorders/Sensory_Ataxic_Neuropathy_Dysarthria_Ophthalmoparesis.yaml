progression:
- phase: Juvenile to Adult-Onset Progressive Ataxia-Neuropathy-Ophthalmoplegia
  age_range: Juvenile to late adulthood (12-40 years for the broader juvenile/adult-onset POLG form; typically early adulthood and occasionally late life in SANDO)
  notes: >-
    Progressive course with sensory ataxic neuropathy, dysarthria, and
    progressive external ophthalmoplegia. In GeneReviews, the broader
    juvenile/adult-onset POLG-related spectrum encompassing SANDO is assigned an
    onset range of 12-40 years, while SANDO typically presents in early
    adulthood and can occasionally manifest in late life.
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile/adult-onset form (age 12-40 years: Disease is typically characterized by peripheral neuropathy, ataxia, seizures, stroke-like episodes, and, in individuals with longer survival, progressive external ophthalmoplegia (PEO)."
    explanation: >-
      Describes the juvenile/adult-onset (12-40 years) POLG-related spectrum
      characterized by peripheral neuropathy, ataxia, and progressive external
      ophthalmoplegia.
  - reference: PMID:20513108
    reference_title: "Sensory ataxic neuropathy with dysarthria and ophthalmoparesis (SANDO) in late life due to compound heterozygous POLG mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a sporadic case of an 80-year-old compound heterozygote man who presented with SANDO and was found to have three known pathogenic mutations in the POLG1 gene (p.T251I/p.P587L/p.G848S)."
    explanation: >-
      Confirms that SANDO can occasionally present in late life (80 years old).

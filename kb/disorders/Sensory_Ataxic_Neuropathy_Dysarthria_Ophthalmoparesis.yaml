    involvement and demonstrate an axonal or mixed, predominantly large-fiber
    sensory polyneuropathy characteristic of SANDO.
  diagnosis_term:
    preferred_term: Nerve Conduction Velocity Test
    term:
      id: NCIT:C88502
      label: Nerve Conduction Velocity Test
  results: Large-fiber axonal or mixed sensory-predominant polyneuropathy.
  evidence:
  - reference: PMID:32999401
    reference_title: "Expanding the genotype-phenotype correlation of childhood sensory polyneuropathy of genetic origin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological examination and electrodiagnostic testing showed gait-difficulties, absent tendon reflexes, decreased joint-position, positive Romberg's test and large fiber sensory polyneuropathy on sensory nerve conduction studies in all patients"
    explanation: >
      Sensory nerve conduction studies demonstrate large-fiber sensory
      polyneuropathy in all evaluated SANDO patients.
  - reference: PMID:30451971
    reference_title: "POLG-related disorders and their neurological manifestations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POLGmutations are usually associated with an axonal or mixed, predominantly sensory neuropathy, although some patients have a demyelinating neuropathy43,44."
    explanation: >
      Describes the axonal or mixed, predominantly sensory neuropathy pattern
      characteristic of POLG-related sensory ataxic neuropathies.
differential_diagnoses:
- name: TWNK (PEO1)-related progressive external ophthalmoplegia and SANDO
  description: >
    Mutations in TWNK (PEO1), encoding the mitochondrial helicase Twinkle, also
    cause multiple mtDNA deletions and can present with a clinical SANDO triad
    indistinguishable from POLG-related SANDO without molecular testing; in a
    cohort of 41 patients with CPEO and multiple mtDNA deletions, 9 (22%)
    fulfilled clinical criteria for SANDO, associated with POLG (n=6), PEO1
    (n=2), or unidentified (n=2) nuclear mutations.
  disease_term:
    preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 3
    term:
      id: MONDO:0012241
      label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant 3
  distinguishing_features:
  - Pathogenic variants in TWNK (PEO1) rather than biallelic POLG variants on nuclear gene sequencing
  evidence:
  - reference: PMID:25143630
    reference_title: "SANDO syndrome in a cohort of 107 patients with CPEO and mitochondrial DNA deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, 9 of 41 patients (22%) with multiple mtDNA deletions and two additional family members fulfilled the clinical criteria for SANDO. Within this subgroup, multiple mtDNA deletions were associated with the following nuclear mutations: POLG (n=6), PEO1 (n=2), unidentified (n=2)."
    explanation: >
      Demonstrates that PEO1 (TWNK) mutations account for a subset of SANDO
      patients with multiple mtDNA deletions and must be distinguished from POLG
      by molecular genetic testing.
- name: Autosomal dominant progressive external ophthalmoplegia (adPEO)
  description: >
    Late-onset autosomal dominant PEO caused by a single heterozygous POLG
    variant shares ptosis, PEO, and variable neuropathy/ataxia with SANDO but
    follows autosomal dominant inheritance.
  disease_term:
    preferred_term: autosomal dominant progressive external ophthalmoplegia
    term:
      id: MONDO:0008003
      label: autosomal dominant progressive external ophthalmoplegia
  distinguishing_features:
  - Heterozygous autosomal dominant POLG pathogenic variant rather than biallelic autosomal recessive POLG variants
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early-onset and juvenile/adult-onset POLG-related disorders are typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner. Late-onset PEO may be caused by a heterozygous POLG pathogenic variant and inherited in an autosomal dominant manner."
    explanation: >
      Distinguishes autosomal recessive biallelic POLG disorders (including
      SANDO) from heterozygous autosomal dominant PEO.
treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    Management of SANDO and POLG-related disorders is largely supportive,
    involving standard approaches for associated complications including
    occupational, physical, and speech therapy; nutritional support; respiratory
    support; and standard treatment of epilepsy, movement abnormalities, vision,
    and hearing issues.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical management is largely supportive and involves standard approaches for associated complications including occupational, physical, and speech therapy; nutritional support; respiratory support"
    explanation: >
      GeneReviews specifies that POLG-related disorder management is largely
      supportive and multidisciplinary.
- name: Avoidance of Valproic Acid
  description: >
    Valproic acid (Depakene) and sodium divalproate (Depakote) must be avoided in
    POLG-related disorders, including SANDO, because they can precipitate and/or
    accelerate hepatotoxicity and liver failure. This is a critical drug-safety
    contraindication, particularly relevant when treating seizures.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: valproic acid
      term:
        id: CHEBI:39867
        label: valproic acid
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Valproic acid (Depakene®) and sodium divalproate (divalproex) (Depakote®) because of the risk of precipitating and/or accelerating liver disease."
    explanation: >
      GeneReviews explicitly lists valproic acid and divalproex as agents to
      avoid in POLG-related disorders due to hepatotoxicity risk.
- name: Genetic Counseling
  description: >
    Genetic counseling is recommended given the autosomal recessive inheritance of
    SANDO; once biallelic POLG variants are identified, testing of at-risk family
    members and reproductive counseling (25% recurrence risk in siblings when
    both parents are heterozygous carriers) become available.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the POLG pathogenic variants have been identified in an affected family member, testing for at-risk family members is possible."
    explanation: >
      GeneReviews supports genetic counseling and family testing once POLG
      variants are identified.
  - reference: PMID:20301791
    reference_title: "POLG-Related Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a POLG pathogenic variant, each sib of an affected individual has at conception a 25% chance of inheriting biallelic pathogenic variants and being affected, a 50% chance of being heterozygous, and a 25% chance of inheriting neither of the familial POLG pathogenic variants."
    explanation: >
      Establishes the autosomal recessive recurrence risk counseling for
      families with biallelic POLG variants.
- name: Deoxynucleoside (dC/dT) Substrate Supplementation
  description: >
    Combination therapy with enteral deoxycytidine and deoxythymidine (dC/dT)
    aims to replenish mitochondrial dNTP pools and support mtDNA maintenance in
    POLG-related disorders. In an open-label phase 2 trial (NCT04802707) that
    included ataxia-neuropathy spectrum (SANDO-spectrum) patients, dC/dT was
    associated with improvement in the Newcastle Mitochondrial Disease Scale and
    reduction in the mitochondrial biomarker GDF-15. This is an investigational
    therapy, not an established standard of care.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxycytidine
      term:
        id: CHEBI:15698
        label: 2'-deoxycytidine
    - preferred_term: deoxythymidine
      term:
        id: CHEBI:17748
        label: thymidine
  evidence:
  - reference: PMID:39091670
    reference_title: "Safety and efficacy of deoxycytidine/deoxythymidine combination therapy in POLG-related disorders: 6-month interim results of an open-label, single arm, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we assessed the safety and efficacy of combination therapy with deoxycytidine and deoxythymidine (dC/dT) in children with POLG-related disorders."
    explanation: >
      Phase 2 open-label trial (NCT04802707) of enteral dC/dT in POLG-related
      disorders, including ataxia-neuropathy spectrum (SANDO-spectrum) patients.
clinical_trials:
- name: NCT04802707
  phase: PHASE_II
  description: >-
    Single-arm phase 2 trial of combined deoxycytidine (dC) and deoxythymidine
    (dT) nucleoside substrate supplementation as early treatment for
    mitochondrial DNA depletion syndromes, including POLG-related disease.
  evidence:
  - reference: clinicaltrials:NCT04802707
    reference_title: "A Phase II, Monocenter, Single Arm Study To Assess The Safety and Efficacy Of Combination Deoxycytidine and Deoxythymidine For Mitochondrial Depletion Disorders"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this phase II Trial a mix of Deoxynucleosides Pyrimidine (Deoxycytidine dC and Deoxythymidine dT) will be used as early treatment of MDS."
    explanation: >-
      Phase II trial of dC/dT substrate supplementation enrolling mtDNA
      depletion disorders including POLG, directly relevant to the SANDO/POLG
      spectrum.

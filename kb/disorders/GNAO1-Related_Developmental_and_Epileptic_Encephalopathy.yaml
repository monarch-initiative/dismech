  evidence:
  - reference: PMID:28357411
    reference_title: "GNAO1 encephalopathy: Broadening the phenotype and evaluating treatment and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "tetrabenazine was effective in partially controlling dyskinesia for 2/7 patients"
    explanation: >-
      Tetrabenazine partially controlled dyskinesia in a subset of the GNAO1

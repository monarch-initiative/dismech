  - target: Focal Seizures
    causal_link_type: DIRECT
    description: >-
      Focal-onset seizures predominate in the later-onset epilepsy cluster.
  - target: Generalized Tonic-Clonic Seizures
    causal_link_type: DIRECT
    description: >-
      Generalized-onset seizures, including tonic-clonic, occur particularly in

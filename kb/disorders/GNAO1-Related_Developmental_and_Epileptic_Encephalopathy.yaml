- name: Deep Brain Stimulation
  description: >-
    Globus pallidus internus (GPi) deep brain stimulation is used for the severe,
    medically refractory hyperkinetic movement disorder and can be
    life-saving in status dystonicus / hyperkinetic crisis.
  therapeutic_modality: DEVICE

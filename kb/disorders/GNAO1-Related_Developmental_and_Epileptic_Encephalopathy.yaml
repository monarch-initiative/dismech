  - target: Status Epilepticus
    causal_link_type: DIRECT
    description: >-
      Seizures in the epilepsy-predominant pole can escalate to status
      epilepticus.
- name: Hyperkinetic Movement Disorder
  description: >-
    The clinical result of the basal-ganglia arm is a hyperkinetic movement
    disorder - chorea, dystonia, or a mixed dyskinesia affecting the whole body,
    with a tendency to spontaneous or triggered exacerbations and potentially
    life-threatening hyperkinetic crises (status dystonicus). This node captures
    the single concept of the movement-pole endpoint.
  role: consequence
  cell_types:

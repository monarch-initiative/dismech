    GNAO1 encodes Gao, the alpha subunit of the Go heterotrimeric G protein and
    the most abundant Ga in brain. Disease-causing variants are heterozygous,
    usually de novo missense changes clustering in the GTPase/switch regions. A
    leading mechanistic model (from in vitro cAMP-inhibition assays) correlates
    loss-of-function alleles with the epilepsy pole and gain-of-function alleles
    (e.g., G42R, G203R, E246K) with the movement-disorder pole, though later
    cohorts show the correlation is imperfect and functionally heterogeneous.
  evidence:
  - reference: PMID:23993195
    reference_title: "De Novo mutations in GNAO1, encoding a Gαo subunit of heterotrimeric G proteins, cause epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified de novo heterozygous mutations in GNAO1, which encodes a Gαo subunit of heterotrimeric G proteins, in four individuals with epileptic encephalopathy"
    explanation: >-
      The founding report identified de novo heterozygous GNAO1 variants as the
      cause, establishing GNAO1 as the disease gene.
  - reference: PMID:28747448
    reference_title: "Movement disorder in GNAO1 encephalopathy associated with gain-of-function mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The GNAO1 LOF mutations are associated with epileptic encephalopathy while GOF mutants (such as G42R, G203R, and E246K) or normally functioning mutants (R209) were found in patients with movement disorders with or without seizures"
    explanation: >-
      In vitro functional testing correlates loss-of-function alleles with the
      epilepsy pole and gain-of-function alleles with the movement-disorder pole.

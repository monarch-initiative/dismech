prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet lists a worldwide point-prevalence class of <1/1,000,000 for the
    GNAO1-related spectrum (ORPHA:592564). A precise population prevalence is not
    established, and the figure is likely an underestimate: the full spectrum is
    thought to be underrecognized because many adults with disability have not
    had advanced genetic testing. GNAO1 is nonetheless one of the more frequently
    identified single-gene causes among infantile developmental and epileptic
    encephalopathies and dyskinetic cerebral-palsy mimics.
  evidence:
  - reference: PMID:37956232
    reference_title: "GNAO1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is likely that adults with GNAO1-related disorder are underrecognized and"
    explanation: >-
      GeneReviews notes probable underascertainment of the disorder, consistent
      with an uncertain but rare prevalence.
inheritance:
- name: Autosomal dominant (mostly de novo)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    GNAO1-related disorder is autosomal dominant and most often caused by a de
    novo pathogenic variant. Severe phenotypes (DEE, severe developmental delay,
    early-onset movement disorder) are typically simplex de novo cases; germline
    mosaicism causing sib recurrence and vertical transmission in milder
    later-onset families have both been reported.
  evidence:
  - reference: PMID:37956232
    reference_title: "GNAO1-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GNAO1-related disorder is an autosomal dominant disorder most often caused by a de novo pathogenic variant"
    explanation: >-
      GeneReviews states the autosomal dominant, usually de novo inheritance.

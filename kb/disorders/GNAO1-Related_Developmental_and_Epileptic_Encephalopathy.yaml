discussions:
- discussion_id: gnao1-gof-lof-pole-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Dysregulated Adenylyl Cyclase-cAMP Signaling"
  - "pathophysiology#Impaired Gbg Modulation of Presynaptic Calcium Channels"
  prompt: >-
    GNAO1 variants segregate imperfectly into an epilepsy-predominant pole and a
    movement-predominant pole. Which molecular readout - effect on cAMP/adenylyl
    cyclase signaling versus effect on Gbg-mediated presynaptic calcium-channel
    and neurotransmitter-release control - best predicts which pole a given
    variant will produce, and can that be turned into a treatment-guiding
    classifier?
  rationale: >-
    Unlike the sodium-channel encephalopathies, GNAO1 does not cleanly split into
    gain-of-function versus loss-of-function; variants show heterogeneous effects
    across distinct downstream arms, so which assay best forecasts the clinical
    pole (and therefore treatment strategy) is unresolved.
  evidence:
  - reference: PMID:28747448
    reference_title: "Movement disorder in GNAO1 encephalopathy associated with gain-of-function mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "There appears to be a strong predictive correlation between the in vitro biochemical phenotype and the clinical pattern of epilepsy vs movement disorder"
    explanation: >-
      Motivates the classifier: an in vitro biochemical readout already
      correlates with the epilepsy-versus-movement clinical pole.
  proposed_experiments:
  - experiment_id: gnao1-variant-pole-classifier
    name: GNAO1 variant functional-pole classifier
    description: >-
      Systematically assay a large panel of GNAO1 variants for effects on
      cAMP/adenylyl cyclase signaling and on Gbg-mediated presynaptic
      calcium-channel/GIRK modulation, and benchmark each readout against the
      observed epilepsy-versus-movement clinical pole and drug response.
    readouts:
    - name: Predicted versus observed clinical pole and drug response
      target: "pathophysiology#Impaired Go Heterotrimeric G-Protein Signaling"
    would_support:
    - "pathophysiology#Impaired Gbg Modulation of Presynaptic Calcium Channels"
- discussion_id: gnao1-dbs-timing-outcome
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Hyperkinetic Movement Disorder"
  - "pathophysiology#Basal Ganglia Output Dysregulation"
  prompt: >-
    Pallidal deep brain stimulation can rescue refractory GNAO1 dyskinesia and
    status dystonicus, but does earlier DBS (versus escalating pharmacotherapy
    first) improve long-term motor and developmental outcome and reduce
    life-threatening hyperkinetic crises?
  rationale: >-
    DBS is increasingly used and can be life-saving in hyperkinetic crisis, but
    the optimal timing relative to medical therapy, and whether earlier
    intervention alters the trajectory rather than only acute crises, are not
    established.
  evidence:
  - reference: PMID:28357411
    reference_title: "GNAO1 encephalopathy: Broadening the phenotype and evaluating treatment and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Emergency deep brain stimulation (DBS) was life saving in 1 patient, resulting in immediate clinical benefit with complete cessation of violent hyperkinetic movements"
    explanation: >-
      DBS produced immediate, life-saving benefit in refractory crisis,
      motivating study of whether earlier DBS improves overall trajectory.
  proposed_experiments:
  - experiment_id: gnao1-dbs-timing-study
    name: GNAO1 DBS timing-outcome study
    description: >-
      In a multicenter GNAO1 movement-disorder cohort, compare motor,
      developmental, and hyperkinetic-crisis outcomes by time from
      movement-disorder onset to pallidal DBS.
    readouts:
    - name: Motor and crisis outcome versus time-to-DBS
      target: "pathophysiology#Hyperkinetic Movement Disorder"
    would_support:
    - "pathophysiology#Basal Ganglia Output Dysregulation"

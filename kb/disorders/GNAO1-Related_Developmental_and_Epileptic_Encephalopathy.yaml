name: GNAO1-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-23T00:00:00Z"
category: Genetic
description: >-
  GNAO1-related developmental and epileptic encephalopathy is caused by de novo
  heterozygous variants in GNAO1, which encodes Gao, the alpha subunit of the
  Go heterotrimeric G protein and the most abundant Ga protein in the brain. Gao
  transduces signaling from many neuronal inhibitory G-protein-coupled receptors
  (including GABA-B, D2 dopamine, and alpha-2 adrenergic receptors): the released
  Gbg subunit inhibits presynaptic voltage-gated calcium channels to restrain
  neurotransmitter release and activates GIRK potassium channels, while the Go
  pathway also modulates adenylyl cyclase-cAMP signaling. Pathogenic variants disrupt this signaling and
  produce a broad phenotypic continuum spanning an epilepsy pole (infantile-onset
  developmental and epileptic encephalopathy, DEE17) and a movement-disorder pole
  (a neurodevelopmental disorder with chorea and dystonia, NEDIM), typically with
  developmental delay and intellectual disability. Because the two poles arise
  from the same shared molecular lesion but diverge into cortical network
  hyperexcitability versus basal-ganglia output dysregulation, this entry keeps
  the two output arms as separate downstream nodes rather than bundling them.
parents:
- Epilepsy
- Neurological Disease
synonyms:
- GNAO1 encephalopathy
- GNAO1-related disorder
- DEE17
- EIEE17
- NEDIM

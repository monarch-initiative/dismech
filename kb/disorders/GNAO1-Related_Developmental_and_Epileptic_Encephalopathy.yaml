differential_diagnoses:
- name: Dyskinetic Cerebral Palsy
  description: >-
    Dyskinetic cerebral palsy is a major mimic of the movement-predominant pole:
    both present with early-onset chorea/dystonia and developmental delay, and
    GNAO1-related disorder is an important genetic diagnosis to identify among
    children labeled with dyskinetic cerebral palsy who lack a clear acquired
    (e.g., perinatal-asphyxia) cause.
  disease_term:
    preferred_term: cerebral palsy
    term:
      id: MONDO:0006497
      label: cerebral palsy
- name: STXBP1-Related Developmental and Epileptic Encephalopathy
  description: >-
    STXBP1 encephalopathy (DEE4) overlaps the epilepsy-predominant pole with
    infantile-onset DEE and movement features, and is distinguished by molecular
    genetic testing.
  disease_term:
    preferred_term: developmental and epileptic encephalopathy, 4
    term:
      id: MONDO:0012812
      label: developmental and epileptic encephalopathy, 4
- name: CDKL5 Deficiency Disorder
  description: >-
    CDKL5 deficiency disorder is another early-infantile DEE with drug-resistant
    seizures and severe developmental impairment; it is distinguished by the
    causative gene and its characteristic seizure semiology.
  disease_term:
    preferred_term: CDKL5 disorder
    term:
      id: MONDO:0100039
      label: CDKL5 disorder
- name: Glutaryl-CoA Dehydrogenase Deficiency
  description: >-
    Glutaric aciduria type I is a treatable metabolic mimic that can present with
    a dystonic-dyskinetic movement disorder from striatal injury; it is
    distinguished by organic-acid analysis and neuroimaging and must be excluded
    because targeted metabolic treatment exists.
  disease_term:
    preferred_term: glutaryl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0009281
      label: glutaryl-CoA dehydrogenase deficiency
treatments:
- name: Antiseizure Medication
  description: >-
    Seizures are treated with antiseizure medications. Seizures in the
    epilepsy-predominant DEE pole are frequently drug-resistant, whereas the
    later-onset epilepsy cluster is often infrequent or well controlled with
    standard antiseizure medications.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Developmental and Epileptic Encephalopathy
    treatment_effect: INHIBITS
    description: >-
      Antiseizure medications reduce seizure burden in the epilepsy pole.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:28357411
    reference_title: "GNAO1 encephalopathy: Broadening the phenotype and evaluating treatment and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients had well-controlled epilepsy and 1 had drug-resistant seizures"
    explanation: >-
      In the GNAO1 cohort most epilepsy was controlled with antiseizure
      medication, though drug-resistant seizures occur.
- name: Tetrabenazine (Chorea/Dyskinesia Suppression)
  description: >-
    The vesicular monoamine transporter 2 (VMAT2) inhibitor tetrabenazine is used
    to suppress the hyperkinetic movement disorder (chorea/dyskinesia), including
    in the management of hyperkinetic exacerbations.
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Hyperkinetic Movement Disorder
    treatment_effect: INHIBITS
    description: >-
      VMAT2 inhibition reduces chorea and dyskinesia.
  treatment_term:

  downstream:
  - target: Developmental and Epileptic Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Cortical hyperexcitability generates seizures and drives the
      encephalopathy.
- name: Basal Ganglia Output Dysregulation
  description: >-
    Disrupted Go signaling in striatal medium spiny neurons (which express Gao
    and its coupled D2 dopamine and other receptors) dysregulates basal-ganglia
    motor output. This node captures the single concept of the movement-disorder
    effector arm, kept separate from the cortical/epilepsy arm.
  role: central_effector
  cell_types:
  - preferred_term: Striatal medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  biological_processes:
  - preferred_term: Abnormal G protein-coupled receptor signaling
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: ABNORMAL
  downstream:
  - target: Hyperkinetic Movement Disorder
    causal_link_type: DIRECT
    description: >-
      Dysregulated basal-ganglia output produces the hyperkinetic movement
      disorder.
- name: Developmental and Epileptic Encephalopathy
  description: >-
    The clinical result of the cortical arm is early-onset, often multiple-type
    and drug-resistant seizures with developmental impairment - a developmental
    and epileptic encephalopathy. This node captures the single concept of the
    epilepsy-pole endpoint and conforms to the shared epilepsy final common
    pathway.
  role: consequence
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Recurrent Unprovoked Seizures"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540

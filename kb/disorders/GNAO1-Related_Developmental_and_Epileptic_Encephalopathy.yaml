pathophysiology:
- name: GNAO1 Pathogenic Variant (Gao)
  description: >-
    A de novo heterozygous variant in GNAO1 alters Gao, the alpha subunit of the
    Go heterotrimeric G protein. This node captures the single concept of the
    initiating genetic lesion; most variants are missense changes clustering in
    the GTPase/nucleotide-binding and switch regions of the protein.
  role: trigger
  gene:
    preferred_term: GNAO1
    term:
      id: hgnc:4389
      label: GNAO1
  downstream:
  - target: Impaired Go Heterotrimeric G-Protein Signaling
    causal_link_type: DIRECT
    description: >-
      The variant protein disrupts normal Go signal transduction.
- name: Impaired Go Heterotrimeric G-Protein Signaling
  description: >-
    The variant Gao subunit disrupts the Go signaling cycle - abnormal guanine
    nucleotide binding/hydrolysis, reduced or altered coupling to inhibitory
    G-protein-coupled receptors, and in some variants a dominant-negative effect
    on wild-type Gao. This node captures the single concept of the shared
    upstream molecular lesion, from which two distinct effector arms diverge.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29758257
    reference_title: "A mechanistic review on GNAO1-associated movement disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GNAO1 encodes Gαo, the α subunit of Go, a member of the Gi/o family of heterotrimeric G protein signal transducers. Go is the most abundant membrane protein in the mammalian central nervous system and plays major roles in synaptic neurotransmission and neurodevelopment"
    explanation: >-
      Establishes Gao as the most abundant neuronal G protein and its central
      role in synaptic transmission - the signaling that pathogenic variants
      disrupt.
  - reference: PMID:23993195
    reference_title: "De Novo mutations in GNAO1, encoding a Gαo subunit of heterotrimeric G proteins, cause epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data suggest that aberrant Gαo signaling can cause multiple neurodevelopmental phenotypes, including epileptic encephalopathy and involuntary movements"
    explanation: >-
      Aberrant Gao signaling is the shared upstream lesion producing both the
      epilepsy and movement phenotypes.
  downstream:
  - target: Impaired Gbg Modulation of Presynaptic Calcium Channels
    causal_link_type: DIRECT
    description: >-
      Disrupted Go signaling impairs Gbg-mediated presynaptic modulation.
  - target: Dysregulated Adenylyl Cyclase-cAMP Signaling
    causal_link_type: DIRECT
    description: >-
      Disrupted Go signaling alters Gao-dependent control of adenylyl cyclase.
  - target: Global Developmental Delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Developmental delay is typical across the whole GNAO1 spectrum, including
      the movement-predominant pole, so it is wired from the shared upstream
      signaling lesion rather than from the epilepsy endpoint; the intervening
      neurodevelopmental mechanism is not established.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intellectual disability of variable severity is likewise characteristic of
      both poles, and is attributed to the shared disruption of Gao-dependent
      neurodevelopment rather than to seizures alone.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Axial hypotonia, common early in life across the spectrum, follows from the
      shared signaling lesion through intermediates that have not been resolved.
- name: Impaired Gbg Modulation of Presynaptic Calcium Channels
  description: >-
    Normally the Gbg subunit released from activated Go inhibits presynaptic
    voltage-gated (Cav2.1/Cav2.2) calcium channels to restrain neurotransmitter
    release and activates GIRK potassium channels. Variant Go disrupts this
    Gbg-mediated brake, dysregulating synaptic neurotransmitter release. This
    node captures the single concept of the synaptic/ion-channel effector arm
    and conforms to the shared epilepsy final common pathway.
  role: mediator
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Negative regulation of calcium ion transmembrane transport
    term:
      id: GO:1903170
      label: negative regulation of calcium ion transmembrane transport
    modifier: ABNORMAL
  - preferred_term: Regulation of neurotransmitter secretion
    term:
      id: GO:0046928
      label: regulation of neurotransmitter secretion
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23993195
    reference_title: "De Novo mutations in GNAO1, encoding a Gαo subunit of heterotrimeric G proteins, cause epileptic encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Gαo-mediated inhibition of calcium currents by norepinephrine tended to be lower in three of the four Gαo mutants"
    explanation: >-
      Electrophysiology in transfected cells showed variant Gao has impaired
      inhibition of calcium currents - the Gbg/Gao presynaptic calcium-channel
      brake is disrupted.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: DIRECT
    description: >-
      Dysregulated cortical neurotransmitter release shifts the
      excitation-inhibition balance.
  - target: Basal Ganglia Output Dysregulation
    causal_link_type: DIRECT
    description: >-
      Dysregulated striatal synaptic transmission disturbs basal-ganglia motor
      output.
- name: Dysregulated Adenylyl Cyclase-cAMP Signaling
  description: >-
    As a Gi/o-family subunit, Gao contributes to modulation of adenylyl
    cyclase-cAMP signaling downstream of inhibitory GPCRs; variants perturb this
    control in either direction. In vitro cAMP-inhibition assays classify GNAO1
    variants by their effect on this arm - loss-of-function (reduced cAMP
    inhibition) segregates toward the epilepsy pole, whereas gain-of-function
    (enhanced cAMP inhibition) segregates toward the movement pole. This node
    captures the single concept of the second-messenger effector arm, which feeds
    both output poles.
  role: mediator
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28747448
    reference_title: "Movement disorder in GNAO1 encephalopathy associated with gain-of-function mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "determined functional Gαo-dependent cyclic adenosine monophosphate (cAMP) inhibition with a coexpressed α2A adrenergic receptor"
    explanation: >-
      Variant effects on Gao-dependent cAMP inhibition (via a coexpressed alpha-2A
      adrenergic receptor) are the readout used to classify variants.
  - reference: PMID:29758257
    reference_title: "A mechanistic review on GNAO1-associated movement disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "loss-of-function (LOF) GNAO1 alleles cause epilepsy and gain-of-function (GOF) alleles are primarily associated with movement disorders"
    explanation: >-
      The cAMP-based functional classification maps onto the epilepsy versus
      movement clinical poles.
  downstream:
  - target: Cortical Excitation-Inhibition Imbalance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss-of-function alleles (reduced cAMP inhibition) contribute to the
      cortical network imbalance of the epilepsy pole.
  - target: Basal Ganglia Output Dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Gain-of-function alleles (enhanced cAMP inhibition) segregate toward the
      movement pole, linking this arm to basal-ganglia output dysregulation.
- name: Cortical Excitation-Inhibition Imbalance
  description: >-
    Disrupted inhibitory G-protein signaling shifts the balance of excitation
    and inhibition in cortical networks toward hyperexcitability. This node
    captures the single concept of the cortical network imbalance and conforms to
    the shared epilepsy final common pathway.
  role: central_effector
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Inhibitory postsynaptic potential
    term:
      id: GO:0060080
      label: inhibitory postsynaptic potential
    modifier: DECREASED
  evidence:
  - reference: PMID:40229422
    reference_title: "Development of an AAV-RNAi strategy to silence the dominant variant GNAO1 c.607G>A linked to encephalopathy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In primary neuronal culture, Gαo-G203R had a dominant-negative effect on neuronal activity and GABAB-dependent synaptic release."
    explanation: >-
      Measures the loss of GABAB-dependent inhibitory transmission that this
      node's decreased inhibitory postsynaptic potential describes, in primary
      neurons expressing a patient allele. Graded PARTIAL because it is a

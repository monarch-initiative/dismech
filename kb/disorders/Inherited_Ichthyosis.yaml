    mechanism. For KRT1 that dedicated entry is
    kb/disorders/KRT1_Keratinopathies.yaml, which models the dominant-negative
    filament collapse and its tonofilament-clumping consequences and declares
    "keratinopathic ichthyosis" as its parent. KRT10 and KRT2 have no dedicated
    entry anywhere in kb/disorders/, so this is currently their only home.

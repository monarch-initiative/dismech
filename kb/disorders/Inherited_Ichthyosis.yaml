  - reference: PMID:16444271
    reference_title: Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We find that loss or reduction of this major structural protein leads to varying degrees of impaired keratinization."
    explanation: >-
      Places FLG at this node: loss of profilaggrin impairs keratinization
      itself, which is the terminal-differentiation defect modelled here.
  - reference: PMID:16444271
    reference_title: Loss-of-function mutations in the gene encoding filaggrin cause ichthyosis vulgaris.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "During terminal differentiation, it is cleaved into multiple filaggrin peptides that aggregate keratin filaments. The resultant matrix is cross-linked to form a major component of the cornified cell envelope."
    explanation: >-
      States the step filaggrin performs -- aggregating keratin filaments into
      the cross-linked cornified envelope -- which is why FLG and the keratin
      genes KRT1, KRT10 and KRT2 share this node. The sentence is the paper's
      framing of established filaggrin biology, not its own result.
  - reference: PMID:26581228
    reference_title: "Expanding the Clinical and Genetic Spectrum of KRT1, KRT2 and KRT10 Mutations in Keratinopathic Ichthyosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epidermolytic ichthyosis is caused by mutations in the genes KRT1 or KRT10, mutations in the gene KRT2 lead to superficial epidermolytic ichthyosis"
    explanation: >-
      Assigns the keratinopathic ichthyosis subtypes to KRT1, KRT10 and KRT2,
      the keratin-filament arm of the cornification defect at this node.
- name: Epidermal Lipid Metabolism Defect
  conforms_to: "epidermal_cornification_failure#Defective Cornified Envelope Assembly and Lamellar Lipid Delivery"
  description: >-
    Several autosomal recessive congenital ichthyosis genes perturb epidermal
    lipid processing, lipid transport, or cornified-envelope assembly, impairing
    lamellar barrier formation in differentiating keratinocytes. Steroid
    sulfatase belongs at the same node by a different route: its deficiency in
    X-linked ichthyosis lets cholesterol sulfate accumulate in the stratum
    corneum, and the cited review reports that the excess cholesterol sulfate is
    itself what induces permeability barrier dysfunction and the scaling
    abnormality. The node is therefore the
    convergence point for the lipid-handling subtypes as a whole, not for the
    autosomal recessive ones alone.
  cell_types:

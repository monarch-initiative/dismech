    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutated genes were as follows: TGM1 in 18/74 (24.3%) patients, ALOX12B in
      18/74 (24.3%), CYP4F22 in 12/74 (16.2%), ABCA12 in nine/74 (12.2%),
      ALOXE3 in seven/74 (9.5%), NIPAL4 in seven/74 (9.5%), and CERS3, PNPLA1,
      and SDR9C7 in 1 patient each (1.4%).
    explanation: >-
      Supports the major ARCI genes that converge on epidermal lipid and
      cornified-envelope barrier biology.
  - reference: PMID:39086014
    reference_title: Revisiting X-linked congenital ichthyosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "STS deficiency causes an abnormal cholesterol sulfate (CS) accumulation in the stratum corneum (SC). Excess CS induces epidermal permeability barrier dysfunction and scaling abnormalities."
    explanation: >-
      Gives the STS arm of this node: loss of steroid sulfatase is a lipid
      handling defect whose accumulated substrate is what impairs the barrier.

  description: >-
    Nonsyndromic autosomal recessive congenital ichthyosis spectrum, including
    lamellar ichthyosis, congenital ichthyosiform erythroderma, and harlequin
    ichthyosis.
  review_notes: >-
    The six genes bound here are the recurrent ARCI genes of the Italian cohort
    this entry cites. The rare tail of that cohort -- CERS3, PNPLA1 and SDR9C7,
    one patient each -- is deliberately not enumerated on this umbrella entry;
    it is curated in kb/disorders/Autosomal_Recessive_Congenital_Ichthyosis.yaml,
    which carries a "Rare ARCI genes" record for exactly that purpose. The same
    reasoning does not extend to the GeneReviews chapter. "Autosomal Recessive
    Congenital Ichthyosis" (PMID:20301593) is one subtype's chapter rather than
    this umbrella's -- `just check-genereviews` offers it only as a CANDIDATE,
    matching on the substring "congenital ichthyosis" -- but it is tagged in
    this entry's top-level `references:` block anyway, on the same footing as
    the seven subtype chapters tagged in Inherited_Porphyria.yaml. Its cached
    record is a scope statement with no quotable gene content, so it is tagged
    and not mined. The same recipe reports it as an EXACT untagged chapter on
    the dedicated ARCI entry, kb/disorders/Autosomal_Recessive_Congenital_Ichthyosis.yaml,
    where it is the primary baseline rather than a subtype reference; that entry
    is outside this change.

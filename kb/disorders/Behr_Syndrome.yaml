notes: >-
  Behr was originally a clinical label for syndromic childhood optic atrophy, and both monoallelic and
  biallelic OPA1 presentations have been described. This entry follows the OPA1-defined MONDO/OMIM concept
  while retaining other molecular causes as differentials. Biallelic OPA1 disease spans a broader spectrum
  than the classical Behr constellation; case-specific severity, coexisting variants and absent features
  matter. Othman2022 and Jagadish2024 describe the same child and do not constitute independent replication.
  There are no established molecular subdivisions within this entry. Anatomical involvement does not by
  itself establish neuronal apoptosis or a particular cell type.

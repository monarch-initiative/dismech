    Early-onset (infantile/early-childhood) bilateral optic atrophy from retinal
    ganglion cell loss, with reduced visual acuity and optic disc pallor — the
    obligate, defining ocular feature of Behr syndrome, often severe enough to cause
    legal blindness in childhood.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648

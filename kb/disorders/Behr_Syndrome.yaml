biochemical:
- name: Elevated Lactate
  notes: >
    Elevated lactate (serum and on MR spectroscopy) reflects the impaired
    oxidative phosphorylation underlying the disease, and is the biochemical
    signature that places Behr syndrome among the mitochondrial disorders. It is
    supportive rather than diagnostic — a normal lactate does not exclude the
    diagnosis.
  biomarker_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathological peak \nlevels of lactate"
    explanation: Documents pathological lactate elevation in biallelic-OPA1 Behr syndrome patients.

- name: Cytochrome c oxidase (COX) deficiency
  context: Muscle biopsy / mitochondrial respiratory-chain readout
  notes: Reduced cytochrome c oxidase (complex IV) staining on muscle biopsy reflects the respiratory-chain deficiency underlying the disease.

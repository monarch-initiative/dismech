      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both children neuroimaging detected a progressive cerebellar \ninvolvement"
    explanation: Documents progressive cerebellar involvement on neuroimaging in biallelic-OPA1 Behr syndrome.
  downstream:
  - target: Ataxia
    description: Loss of cerebellar cortical output produces progressive gait and limb ataxia.
    causal_link_type: DIRECT
  - target: Dysarthria
    description: Cerebellar and corticobulbar involvement produces scanning/dysarthric speech.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Nystagmus
    description: >
      Cerebellar oculomotor control failure, compounded by poor central vision,
      produces nystagmus.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Tremor
    description: Cerebellar outflow dysfunction produces tremor accompanying the ataxia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Progressive Cerebellar Involvement
    description: Progressive cerebellar neuronal loss is visible as cerebellar involvement on serial MRI.
    causal_link_type: DIRECT


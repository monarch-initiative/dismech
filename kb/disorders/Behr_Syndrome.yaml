histopathology:
- name: Cytochrome c Oxidase-Deficient Muscle Fibers
  description: >-
    In two children, muscle biopsy showed reduced COX staining, scattered atrophic fibers and type II
    fiber grouping, consistent with respiratory-chain and neurogenic involvement. This finding is not
    documented across all biallelic OPA1 genotypes.

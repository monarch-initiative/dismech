  description: Biallelic MTRFR (formerly C12orf65) variants can produce the historical Behr phenotype through defective mitochondrial translation, rather than OPA1 membrane dynamics.
  distinguishing_features:
  - Molecular diagnosis in MTRFR distinguishes the disorders; optic atrophy, neuropathy, spasticity and Leigh-like changes overlap. Respiratory impairment was directly studied in MTRFR patient fibroblasts.
  evidence:
  - reference: PMID:26380172
    reference_title: Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Here we describe 4 patients with the classical Behr's syndrome phenotype from 3 unrelated families who carry homozygous nonsense mutations in the C12orf65 gene encoding a protein involved in mitochondrial translation.
    explanation: Four patients from three families had molecularly resolved MTRFR disease. Although the abstract calls both changes nonsense mutations, the full text identifies a truncating duplication and a synonymous splice-disrupting allele.
  - reference: PMID:26380172
    reference_title: Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene.

name: Behr Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Behr syndrome
  term:
    id: MONDO:0008858
    label: Behr syndrome
description: >
  Behr syndrome is an early-onset (infantile/early-childhood) neuro-ophthalmological
  disorder classically defined by the association of bilateral optic atrophy with a
  progressive neurological syndrome comprising cerebellar and sensory ataxia,
  pyramidal signs (spasticity/spastic paraparesis), peripheral (axonal) neuropathy,
  posterior-column sensory loss, and variable intellectual disability. Once regarded
  as a clinically defined, genetically heterogeneous entity, the classic phenotype is
  now recognized to sit at the severe, recessive end of the OPA1-related optic atrophy
  spectrum: it is most often caused by biallelic (compound-heterozygous) mutations in
  OPA1, which encodes the mitochondrial inner-membrane dynamin-related fusion GTPase.
  Combining a severe/null OPA1 allele with a second (usually missense) allele produces
  a syndromic "OPA1 recessive" disease far more severe than the dominant optic atrophy
  caused by a single OPA1 allele (contrast the monoallelic Autosomal Dominant Optic
  Atrophy Plus entry, MONDO:0014720; both sit under OPA1-related optic atrophy,
  MONDO:0800181). Loss of OPA1 function disrupts mitochondrial fusion, cristae
  architecture, mitochondrial DNA maintenance, and oxidative phosphorylation, causing
  energy failure and degeneration of the highly energy-dependent retinal ganglion
  cells and central/peripheral neurons. Behr-like phenotypes have also been reported
  with biallelic variants in other genes (e.g., OPA3, C12orf65/MTRFR), reflecting the
  historical clinical heterogeneity of the eponym.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Classic Behr syndrome is inherited in an autosomal recessive manner; the
    OPA1-related form is typically caused by biallelic (compound-heterozygous)
    OPA1 variants, most often one severe loss-of-function allele in trans with a
    missense allele.
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is associated with compound heterozygous dysfunction in OPA1 gene"
    explanation: Establishes the compound-heterozygous (biallelic, recessive) OPA1 basis of Behr syndrome.

pathophysiology:
- name: Biallelic OPA1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    OPA1 encodes a dynamin-related GTPase of the mitochondrial inner membrane and
    intermembrane space. In Behr syndrome, biallelic OPA1 mutations — typically a
    severe/null loss-of-function allele combined in trans with a missense allele —
    reduce total OPA1 function well below the ~50% seen in heterozygous dominant optic
    atrophy, producing a syndromic, early-onset recessive disease.
  gene:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  evidence:
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPA1, a dynamin-related GTPase involved in mitochondrial fusion,"
    explanation: Establishes OPA1 as the dynamin-related GTPase whose loss of function underlies the disease.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic"
    explanation: Confirms that Behr syndrome cases are caused by biallelic OPA1 mutations.
  downstream:
  - target: Impaired Mitochondrial Fusion and Cristae Disorganization
    description: >
      Reduced OPA1 function impairs inner-membrane fusion and the OPA1 homopolymers
      that structure the cristae.
    causal_link_type: DIRECT

- name: Impaired Mitochondrial Fusion and Cristae Disorganization
  biological_scale: CELLULAR
  description: >
    OPA1 isoforms form homopolymers that mediate mitochondrial inner-membrane fusion
    and structure the cristae. Loss of OPA1 function disrupts fusion and cristae
    organization, the proximal cell-biological lesion of the disease.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  - preferred_term: Cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  evidence:
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OPA1 encodes \na dynamin-related GTPase imported into mitochondria and located to the inner \nmembrane and intermembrane space."
    explanation: Review establishing OPA1 as a dynamin-related inner-membrane GTPase mediating fusion/cristae organization.
  downstream:
  - target: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
    description: >
      Loss of cristae integrity and impaired fusion directly compromise assembly and
      function of the oxidative phosphorylation machinery.
    causal_link_type: DIRECT

- name: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >
    Disrupted cristae, impaired fusion, and defective mitochondrial DNA maintenance
    together produce a respiratory-chain/oxidative phosphorylation deficiency.
    Neurons with high, sustained energy demands — retinal ganglion cells, cerebellar
    and long-tract central neurons, and peripheral axons — are selectively vulnerable
    to this energy deficit, and severe metabolic decompensation (metabolic stroke) can
    occur.
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OPA1 is required for \noxidative phosphorylation, maintenance of mitochondrial genome, calcium \nhomeostasis and regulation of apoptosis"
    explanation: Review establishing that OPA1 is required for oxidative phosphorylation and mitochondrial genome maintenance.
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "metabolic stroke due to underlying mitochondrial dysfunction associated with OPA1 gene dysfunction"
    explanation: Documents mitochondrial dysfunction (with metabolic stroke) as a consequence of OPA1 dysfunction in a Behr patient.
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    description: >
      Energy failure in the highly metabolically demanding retinal ganglion cells
      drives their selective degeneration, producing early-onset optic atrophy. In
      OPA1 models this degeneration is executed through the SARM1 axon-death pathway.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - sarm1_axon_death
  - target: Cerebellar and Corticospinal Degeneration
    description: >
      Respiratory-chain deficiency in energy-dependent cerebellar and pyramidal
      neurons drives cerebellar ataxia and spasticity.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Peripheral Axonal Degeneration
    description: >
      Energy failure in long peripheral axons drives a length-dependent axonal
      sensorimotor neuropathy with dorsal-column/proprioceptive sensory loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Intellectual disability
    description: Cerebral neuronal energy failure contributes to the variable intellectual disability of the syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing loss
    description: Cochlear/auditory-nerve energy failure and neurodegeneration produce sensorineural hearing loss.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Seizure
    description: Severe bioenergetic failure with cortical involvement can produce seizures, including metabolic (stroke-like) super-refractory status epilepticus in severe biallelic-OPA1 cases.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Retinal Ganglion Cell Degeneration
  biological_scale: CELLULAR
  description: >
    Selective degeneration and apoptosis of retinal ganglion cells, whose high energy
    demand makes them uniquely vulnerable to mitochondrial dysfunction, produce the
    bilateral optic atrophy that is the obligate ocular feature of Behr syndrome. In
    OPA1 mouse models the resulting RGC/axon degeneration is executed largely through
    the SARM1 axon-death pathway, activated downstream of the mitochondrial defect
    (SARM1 loss suppresses degeneration without correcting mitochondrial fragmentation),
    nominating SARM1 as a therapeutic node (see mechanistic_hypotheses and discussions).
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dominant optic atrophy (DOA) is an inherited mitochondrial disease leading to \nspecific degeneration of retinal ganglion cells (RGCs), thus compromising \ntransmission of visual information from the retina to the brain."
    explanation: Review establishing that OPA1-related optic atrophy results from specific degeneration of retinal ganglion cells.
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Besides the tremendous energy \nrequirements of RGCs to relay visual information from the eye to the brain"
    explanation: Explains why energy-demanding retinal ganglion cells are selectively vulnerable to the bioenergetic deficit.
  - reference: PMID:40344041
    reference_title: "SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sarm1 KO nearly \ncompletely suppressed all the degeneration phenotypes without reversing \nmitochondrial fragmentation."
    explanation: In an OPA1 (Opa1 R290Q) mouse model, SARM1 knockout suppresses RGC/axon degeneration downstream of the mitochondrial defect, identifying SARM1-dependent axon death as the executioner mechanism (model-organism evidence for the shared OPA1 pathomechanism, not the sole support for the human phenotype).
  downstream:
  - target: Optic atrophy
    description: Retinal ganglion cell loss manifests clinically as early-onset bilateral optic atrophy.
    causal_link_type: DIRECT

- name: Cerebellar and Corticospinal Degeneration
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  description: >
    Bioenergetic failure drives degeneration of cerebellar (including Purkinje) and
    corticospinal (pyramidal) neurons, producing progressive cerebellar ataxia and
    spasticity/spastic paraparesis. Neuroimaging can show progressive cerebellar
    involvement with basal-ganglia signal change (a Leigh-like appearance).
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neuroimaging detected a progressive cerebellar involvement accompanied by basal ganglia hyperintensities"
    explanation: Documents progressive cerebellar and basal-ganglia (Leigh-like) CNS degeneration in biallelic-OPA1 Behr syndrome.
  downstream:
  - target: Cerebellar ataxia
    description: Cerebellar (Purkinje) degeneration produces cerebellar ataxia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Spasticity
    description: Degeneration of corticospinal (pyramidal) tracts produces spasticity and spastic paraparesis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Peripheral Axonal Degeneration
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >
    Energy failure in long peripheral axons drives a length-dependent axonal
    sensorimotor polyneuropathy; involvement of large sensory (dorsal-root-ganglion)
    axons produces the proprioceptive/vibration sensory loss classically described in
    Behr syndrome.
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "findings were \ncompatible with axonal sensorimotor polyneuropathy"
    explanation: Documents the axonal sensorimotor polyneuropathy component of OPA1-recessive Behr syndrome.
  downstream:
  - target: Peripheral axonal neuropathy
    description: Length-dependent axonal degeneration produces the sensorimotor peripheral neuropathy.
    causal_link_type: DIRECT
  - target: Impaired proprioception
    description: Loss of large sensory axons produces impaired proprioception and vibration sense (posterior-column-type sensory loss).
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES


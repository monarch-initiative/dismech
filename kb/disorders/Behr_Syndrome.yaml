    and extensor plantar responses, and often a predominantly lower-limb
    (paraparetic) distribution. The cited evidence documents "pyramidal signs"
    as part of the syndrome definition; the lower-limb-predominant distribution
    is the usual clinical pattern rather than a separately evidenced claim here.
  phenotype_term:

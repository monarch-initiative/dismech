notes: >
  Nosological boundary. This entry models Behr syndrome as the clinically defined,
  genetically heterogeneous entity the literature describes, so the `genetic:`
  section lists OPA3, C12orf65/MTRFR and C19orf12 alongside OPA1 (PMID:26187298:
  "We expand the spectrum of genetic causes of Behr syndrome"). The
  `pathophysiology:` graph, by contrast, is deliberately anchored on OPA1 only,
  because that is the arm for which a mechanistic chain is evidenced in
  biallelic-Behr patients. This produces a known asymmetry — three of four listed
  genes are not wired to a mechanism node — which is intentional rather than an
  omission: OPA3 (3-methylglutaconic aciduria), C12orf65 (mitochondrial
  translation release) and C19orf12 (brain iron accumulation/MPAN) converge on
  the Behr phenotype through mechanistically distinct routes that are not
  curated here. If the project prefers a strictly OPA1-scoped entity, the other
  three should move to `differential_diagnoses` as documented phenocopies.

  Heterozygous-Behr debate. PMID:21112924 ("Heterozygous OPA1 mutations in Behr
  syndrome") argued that some Behr-phenotype patients carry only a single OPA1
  allele, complicating the strictly biallelic framing used here. That
  correspondence and its reply (PMID:25012220 / PMID:25012222) are cached and
  listed under `references:` but carry no extractable abstract body, so no
  snippet-backed evidence item could be built from them. The entry follows the
  predominant biallelic framing while recording the dispute here.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: Biallelic OPA1-related Behr syndrome is ultra-rare; a 2022 literature review had identified roughly 21 reported cases. Orphanet lists Behr syndrome as a rare disease without a precise prevalence figure.
  evidence:
  - reference: PMID:35741767
    reference_title: Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one cases have been previously \nreported."
    explanation: Supports the ultra-rare, cases-in-literature occurrence of biallelic OPA1-related Behr syndrome.
mechanistic_hypotheses:
- hypothesis_group_id: sarm1_axon_death
  hypothesis_label: SARM1-dependent axon death executes retinal ganglion cell degeneration downstream of the OPA1 mitochondrial defect
  status: EMERGING
  description: "In an OPA1 mouse model of dominant optic atrophy, SARM1 (a central executioner of programmed axon degeneration) is activated downstream of the mitochondrial defect and drives retinal ganglion cell/axon loss; SARM1 knockout nearly completely suppresses degeneration without correcting mitochondrial fragmentation. This nominates SARM1 inhibition as a candidate neuroprotective strategy for OPA1-related disease. The evidence is model-organism (mouse ADOA); translational validity to human biallelic-OPA1 Behr syndrome is not yet established.\n"
  evidence:
  - reference: PMID:40344041
    reference_title: SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: SARM1 was activated downstream of mitochondrial dysfunction in ADOA
    explanation: Places SARM1 activation downstream of the OPA1 mitochondrial defect as the driver of retinal ganglion cell degeneration in a mouse model.
discussions:
- discussion_id: sarm1_human_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration
  prompt: Does SARM1-dependent axon death drive retinal ganglion cell degeneration in human biallelic-OPA1 Behr syndrome, as it does in the Opa1 mouse model — and would SARM1 inhibition be neuroprotective in patients?
  rationale: The SARM1 rescue is demonstrated only in a mouse model of dominant (monoallelic) OPA1 optic atrophy. Its relevance to human recessive/biallelic OPA1 Behr syndrome — a more severe, multisystem, developmental disease — is unproven, so the model result cannot yet be assumed to translate.
  proposed_experiments:
  - experiment_id: exp_sarm1_human_biallelic_opa1
    name: Test SARM1-dependent axon death in human biallelic-OPA1 models
    description: Assess SARM1-pathway activation in patient-derived (biallelic-OPA1) neurons/iPSC-derived retinal ganglion cells, test whether SARM1 inhibition is neuroprotective in those models, and evaluate SARM1 axon-death biomarkers in patient samples.
  evidence:
  - reference: PMID:40344041
    reference_title: SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sarm1 KO nearly \ncompletely suppressed all the degeneration phenotypes without reversing \nmitochondrial fragmentation."
    explanation: The mouse-only SARM1 rescue is the basis of the open question about translation to human biallelic-OPA1 disease.

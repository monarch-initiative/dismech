name: Behr Syndrome
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Behr syndrome
  term:
    id: MONDO:0008858
    label: Behr syndrome
description: >
  Behr syndrome is a rare, early-childhood-onset neurodegenerative disorder
  originally defined by Carl Behr in 1909 as the association of infantile
  bilateral optic atrophy with progressive neurological features — ataxia,
  pyramidal signs (spasticity), peripheral neuropathy, posterior-column sensory
  loss, and variable intellectual disability. It is now recognized as a
  clinically defined, genetically heterogeneous mitochondrial-neurodegenerative
  phenotype rather than a single-gene disease. In its molecularly resolved core
  form (OMIM 210000), Behr syndrome is caused by biallelic (recessive) pathogenic
  variants in OPA1, the same nuclear gene whose heterozygous mutations cause
  autosomal dominant optic atrophy; the severe recessive/compound-heterozygous
  state produces the syndromic "Behr-like" optic-atrophy-plus picture. Additional
  genes producing an overlapping Behr phenotype include OPA3 (Costeff optic
  atrophy syndrome / 3-methylglutaconic aciduria type III, a close differential
  rather than a strict synonym), C12orf65 (MTRFR) and C19orf12 (otherwise causing
  MPAN, a form of neurodegeneration with brain iron accumulation), all
  converging on impaired mitochondrial bioenergetics. OPA1 encodes a
  dynamin-related inner-mitochondrial-membrane GTPase required for mitochondrial
  inner-membrane fusion, cristae architecture, and mitochondrial DNA maintenance;
  loss of function causes bioenergetic failure and selective degeneration of
  retinal ganglion cells and central/peripheral neurons.
parents:
- OPA1-Related Optic Atrophy

inheritance:
- name: Autosomal recessive
  description: >
    The molecularly resolved core form of Behr syndrome is inherited in an
    autosomal recessive manner, caused by biallelic (homozygous or
    compound-heterozygous) pathogenic variants in OPA1. Heterozygous carriers may
    show subclinical or mild optic atrophy consistent with dominant optic atrophy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

pathophysiology:
- name: Biallelic OPA1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    OPA1 encodes a dynamin-related GTPase imported into mitochondria and located
    to the inner membrane and intermembrane space. In the recessive, syndromic
    Behr form, patients carry biallelic OPA1 variants — typically a
    dominant-optic-atrophy allele in trans with a second, hypomorphic/missense
    allele — reducing OPA1 function below the threshold tolerated in the dominant
    disease and producing a severe multisystem phenotype.
  gene:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic mutations in OPA1."
    explanation: Establishes biallelic (recessive) OPA1 variants as a cause of the Behr syndrome phenotype.
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPA1, a dynamin-related GTPase involved in mitochondrial fusion, cristae organization and control of apoptosis, have been linked to non-syndromic optic neuropathy transmitted as an autosomal-dominant trait (DOA)."
    explanation: Identifies OPA1 as a dynamin-related GTPase whose functions in mitochondrial fusion and cristae organization are disrupted by mutation.
  downstream:
  - target: Impaired Inner-Membrane Fusion and Cristae Disruption
    description: >
      Reduced OPA1 GTPase function directly impairs inner-membrane fusion and
      cristae organization.
    causal_link_type: DIRECT

- name: Impaired Inner-Membrane Fusion and Cristae Disruption
  biological_scale: CELLULAR
  description: >
    Loss of OPA1-dependent inner-membrane fusion shifts the mitochondrial network
    toward fragmentation and disorganizes cristae architecture, the structural
    scaffold on which respiratory-chain supercomplexes assemble.
  biological_processes:
  - preferred_term: Mitochondrial inner membrane fusion
    term:
      id: GO:1990627
      label: mitochondrial inner membrane fusion
    modifier: DECREASED
  - preferred_term: Cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also observed in patients' fibroblasts a higher proportion of \nfragmented and intermediate mitochondria upon galactose treatment compared to \ncontrols"
    explanation: Patient fibroblasts show a shift toward fragmented mitochondria, the direct cellular signature of impaired OPA1-dependent fusion.
  downstream:
  - target: Mitochondrial DNA Instability and Multiple mtDNA Deletions
    description: >
      Impaired fusion and cristae organization compromise maintenance of the
      mitochondrial genome.
    causal_link_type: DIRECT
  - target: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
    description: >
      Loss of cristae integrity directly impairs assembly and function of the
      oxidative phosphorylation machinery.
    causal_link_type: DIRECT

- name: Mitochondrial DNA Instability and Multiple mtDNA Deletions
  biological_scale: MOLECULAR
  description: >
    Impaired OPA1-dependent fusion destabilizes the mitochondrial genome,
    producing accumulation of multiple mtDNA deletions, particularly in
    post-mitotic tissues such as skeletal muscle.
  biological_processes:
  - preferred_term: Mitochondrial DNA maintenance
    term:
      id: GO:0032042
      label: mitochondrial DNA metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we \ndemonstrate that these patients all harboured multiple deletions of \nmitochondrial DNA (mtDNA) in their skeletal muscle, thus revealing an \nunrecognized role of the OPA1 protein in mtDNA stability."
    explanation: >
      Directly documents multiple mtDNA deletions and establishes OPA1's role in
      mitochondrial genome stability. Provenance caveat: this cohort carried
      heterozygous dominant-negative OPA1 alleles (DOA-plus) rather than the
      biallelic Behr genotype, so the claim is scoped to OPA1 gene function,
      which is shared across the allelic spectrum.
  downstream:
  - target: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
    description: >
      Accumulated mtDNA deletions remove genes encoding respiratory-chain
      subunits, compounding the oxidative phosphorylation defect.
    causal_link_type: DIRECT

- name: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >
    Combined cristae disruption and mtDNA instability degrade oxidative
    phosphorylation, producing a chronic ATP deficit that is most damaging to
    high-energy-demand, long-projection neurons and to skeletal muscle.
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, muscle biopsy showed diffuse reduction of \ncytochrome c oxidase stain"
    explanation: Cytochrome c oxidase deficiency on muscle biopsy is direct tissue evidence of the oxidative phosphorylation failure.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathological peak \nlevels of lactate"
    explanation: Elevated lactate is the systemic biochemical readout of impaired oxidative phosphorylation.
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    description: >
      Retinal ganglion cells, with long unmyelinated axons and high energy
      demand, are selectively vulnerable to bioenergetic failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - sarm1_axon_death
  - target: Cerebellar Degeneration
    description: >
      Cerebellar neurons, notably Purkinje cells, are highly energy-dependent and
      degenerate under chronic bioenergetic stress.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Corticospinal Tract Degeneration
    description: >
      The long descending corticospinal motor axons are vulnerable to sustained
      energy deficit, producing pyramidal dysfunction.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Peripheral Sensory Axon and Dorsal Column Degeneration
    description: >
      Long peripheral sensory axons and their central dorsal-column projections
      degenerate in a length-dependent manner under bioenergetic stress.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Intellectual Disability
    description: >
      Chronic cerebral energy deficit during early development contributes to
      variable cognitive impairment. The intermediate steps linking bioenergetic
      failure to cognitive outcome are not established in Behr syndrome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Basal Ganglia Signal Abnormality
    description: >
      Energy-dependent deep grey matter shows signal abnormality on MRI,
      producing the Leigh-like imaging pattern seen in biallelic-OPA1 disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizures
    description: >
      Cortical neuronal energy failure lowers seizure threshold, producing
      seizures that may become intractable in severe biallelic disease.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Stroke-Like Episodes
    description: >
      Regional bioenergetic crisis produces metabolic stroke / stroke-like
      episodes, as described in other mitochondrial diseases.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

- name: Retinal Ganglion Cell Degeneration
  biological_scale: TISSUE
  description: >
    Progressive degeneration of retinal ganglion cells and their axons in the
    optic nerve produces bilateral optic atrophy with reduced visual acuity,
    optic-disc pallor, and central visual field defects, typically with onset in
    infancy or early childhood.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Pt1 ocular fundus \nexamination revealed optic disk pallor whereas Pt2 exhibited severe optic \natrophy."
    explanation: Documents optic-disc pallor and optic atrophy, the retinal-ganglion-cell degeneration phenotype in biallelic-OPA1 Behr syndrome.
  - reference: PMID:40344041
    reference_title: SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sarm1 KO nearly \ncompletely suppressed all the degeneration phenotypes without reversing \nmitochondrial fragmentation."
    explanation: In an OPA1 (Opa1 R290Q) mouse model, SARM1 knockout suppresses RGC/axon degeneration downstream of the mitochondrial defect, identifying SARM1-dependent axon death as the executioner mechanism (model-organism evidence for the shared OPA1 pathomechanism, not the sole support for the human phenotype).
  downstream:
  - target: Optic Atrophy
    description: >
      Retinal ganglion cell and optic nerve axon loss manifests clinically as
      bilateral optic atrophy with disc pallor.
    causal_link_type: DIRECT

- name: Cerebellar Degeneration
  biological_scale: TISSUE
  description: >
    Progressive degeneration of the cerebellar cortex, including energy-dependent
    Purkinje cells, produces the cerebellar ataxia, dysarthria, and nystagmus of
    Behr syndrome. Serial neuroimaging in biallelic-OPA1 patients documents
    progressive cerebellar involvement.
  conforms_to: "cerebellar_purkinje_degeneration#Purkinje Neuron Degeneration"
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:

treatments:
- name: Supportive and Symptomatic Care
  description: >
    There is no disease-modifying therapy for Behr syndrome; management is supportive
    and multidisciplinary, addressing visual rehabilitation, spasticity, ataxia,
    neuropathy, feeding/GI dysmotility, and developmental needs.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic Counseling
  description: >
    Genetic counseling for affected individuals and families given autosomal
    recessive inheritance.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling


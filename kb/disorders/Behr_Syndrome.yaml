    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Human skin fibroblasts were isolated from a 48-year-old patient carrying \ncompound heterozygous mutations (c.610+364G>A and c.1311A>G) in OPA1, \nresponsible for early onset optic atrophy complicated by ataxia and pyramidal \nsigns (Behr syndrome; OMIM #210000)."
    explanation: >

    typically a severe/null loss-of-function allele in trans with a missense allele,
    producing a recessive syndromic disease more severe than the dominant optic
    atrophy caused by a single OPA1 allele (the monoallelic end of the same
    OPA1-related spectrum; cf. Autosomal Dominant Optic Atrophy Plus). A recurrent
    architecture is a null/frameshift allele combined with a missense allele; some
    second alleles are asymptomatic in isolation and act as phenotypic modifiers.
    This entry models the OPA1-recessive pathomechanism specifically; the Behr eponym
    is historically genetically heterogeneous, and biallelic variants in other genes
    (e.g., OPA3, C12orf65/MTRFR) can produce clinically overlapping Behr-like
    phenotypes not modeled here.
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic mutations in OPA1."
    explanation: Establishes biallelic OPA1 mutations as a cause of Behr syndrome.
  - reference: PMID:35741767
    reference_title: "Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A biallelic mode of inheritance causes syndromic DOA or Behr \nphenotype"
    explanation: Establishes that a biallelic mode of OPA1 inheritance produces the syndromic Behr phenotype (versus dominant optic atrophy from a single allele).
  - reference: PMID:35741767
    reference_title: "Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one cases have been previously \nreported. All share an early-onset, severe ocular phenotype and systemic \nfeatures, which seem to be the hallmark of the disease."
    explanation: A literature review of biallelic OPA1-related Behr syndrome (21 cases) documents the uniformly early-onset, severe ocular-plus-systemic phenotype.
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mother was \nheterozygous for the p.R905Q missense mutation and the father was heterozygous \nfor the p.L620fs frameshift mutation"
    explanation: A worked example of the biallelic architecture — a frameshift (null) allele in trans with a missense allele, each inherited from an unaffected heterozygous parent (recessive inheritance).
  - reference: PMID:35741767
    reference_title: "Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the second is considered asymptomatic by itself but has been \nreported in patients with DOA phenotype and is presumed to act as a phenotypic \nmodifier"
    explanation: Documents that the second OPA1 allele in a biallelic Behr genotype can be asymptomatic in isolation and act as a phenotypic modifier — the dosage-modifier architecture underlying the recessive disease.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Biallelic OPA1-related Behr syndrome is ultra-rare; a 2022 literature review had
    identified roughly 21 reported cases. Orphanet lists Behr syndrome as a rare
    disease without a precise prevalence figure.
  evidence:
  - reference: PMID:35741767
    reference_title: "Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-one cases have been previously \nreported."
    explanation: Supports the ultra-rare, cases-in-literature occurrence of biallelic OPA1-related Behr syndrome.

diagnosis:
- name: Molecular genetic testing (gene panel / exome sequencing)
  description: >
    Molecular confirmation by targeted mitochondrial/optic-atrophy gene panel or
    whole-exome/whole-genome sequencing, identifying biallelic OPA1 variants
    (recessive/compound-heterozygous), is the definitive diagnostic test.
  results: Biallelic (compound-heterozygous) pathogenic OPA1 variants.
  evidence:
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing indicated a pair of novel compound \nheterozygous mutations"
    explanation: Whole-exome sequencing established the compound-heterozygous OPA1 molecular diagnosis.
- name: Brain MRI / MR spectroscopy
  description: >
    Brain MRI may show cerebellar atrophy and basal-ganglia signal change (a
    Leigh-like appearance); MR spectroscopy may show a pathological lactate peak.
  results: Cerebellar involvement, basal-ganglia hyperintensities, and/or a lactate peak.
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neuroimaging detected a progressive cerebellar involvement accompanied by basal ganglia hyperintensities and pathological peak \nlevels of lactate"
    explanation: Documents the characteristic Leigh-like neuroimaging (cerebellar involvement, basal-ganglia change, lactate peak) supporting the diagnosis.
- name: Muscle biopsy / oxidative phosphorylation assessment
  description: >
    Muscle biopsy may show reduced cytochrome c oxidase (complex IV) staining,
    reflecting the mitochondrial respiratory-chain deficiency.
  results: Diffuse reduction of cytochrome c oxidase staining.
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle biopsy showed diffuse reduction of \ncytochrome c oxidase stain"
    explanation: Muscle biopsy demonstrating reduced cytochrome c oxidase staining supports the mitochondrial basis of the disease.
- name: Nerve conduction studies / electrophysiology
  description: >
    Nerve conduction studies and electrophysiology confirm an axonal sensorimotor
    polyneuropathy; ophthalmologic testing (fundoscopy, OCT, VEP) documents the optic
    neuropathy.
  results: Axonal sensorimotor polyneuropathy.
  evidence:
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "findings were \ncompatible with axonal sensorimotor polyneuropathy"
    explanation: Electrophysiological findings compatible with axonal sensorimotor polyneuropathy support the neuropathy component.

mechanistic_hypotheses:
- hypothesis_group_id: sarm1_axon_death
  hypothesis_label: SARM1-dependent axon death executes retinal ganglion cell degeneration downstream of the OPA1 mitochondrial defect
  status: EMERGING
  description: >
    In an OPA1 mouse model of dominant optic atrophy, SARM1 (a central executioner of
    programmed axon degeneration) is activated downstream of the mitochondrial defect
    and drives retinal ganglion cell/axon loss; SARM1 knockout nearly completely
    suppresses degeneration without correcting mitochondrial fragmentation. This
    nominates SARM1 inhibition as a candidate neuroprotective strategy for OPA1-related
    disease. The evidence is model-organism (mouse ADOA); translational validity to
    human biallelic-OPA1 Behr syndrome is not yet established.
  evidence:
  - reference: PMID:40344041
    reference_title: "SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SARM1 was activated downstream of mitochondrial dysfunction in ADOA"
    explanation: Places SARM1 activation downstream of the OPA1 mitochondrial defect as the driver of retinal ganglion cell degeneration in a mouse model.

discussions:
- discussion_id: sarm1_human_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Retinal Ganglion Cell Degeneration"
  prompt: >-
    Does SARM1-dependent axon death drive retinal ganglion cell degeneration in human
    biallelic-OPA1 Behr syndrome, as it does in the Opa1 mouse model — and would SARM1
    inhibition be neuroprotective in patients?
  rationale: >-
    The SARM1 rescue is demonstrated only in a mouse model of dominant (monoallelic)
    OPA1 optic atrophy. Its relevance to human recessive/biallelic OPA1 Behr syndrome —
    a more severe, multisystem, developmental disease — is unproven, so the model
    result cannot yet be assumed to translate.
  proposed_experiments:
  - experiment_id: exp_sarm1_human_biallelic_opa1
    name: Test SARM1-dependent axon death in human biallelic-OPA1 models
    description: >-
      Assess SARM1-pathway activation in patient-derived (biallelic-OPA1)
      neurons/iPSC-derived retinal ganglion cells, test whether SARM1 inhibition is
      neuroprotective in those models, and evaluate SARM1 axon-death biomarkers in
      patient samples.
  evidence:
  - reference: PMID:40344041
    reference_title: "SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sarm1 KO nearly \ncompletely suppressed all the degeneration phenotypes without reversing \nmitochondrial fragmentation."
    explanation: The mouse-only SARM1 rescue is the basis of the open question about translation to human biallelic-OPA1 disease.

treatments:
- name: Supportive and Symptomatic Care
  description: >
    There is no disease-modifying therapy for Behr syndrome; management is supportive
    and multidisciplinary, addressing visual, neuromuscular, feeding/GI, and
    developmental complications.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Low-Vision Rehabilitation
  description: >
    Low-vision aids and visual rehabilitation for the early-onset, often profound
    visual impairment.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
- name: Physical Therapy for Spasticity and Ataxia
  description: >
    Physiotherapy and rehabilitation to manage spasticity, ataxia, and gait
    impairment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
- name: Antiseizure Management
  description: >
    Antiseizure medication for the seizures/status epilepticus seen in severe
    biallelic-OPA1 cases (with attention to avoiding mitochondrial-toxic agents such
    as valproate).
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Idebenone (Experimental / Class-Extrapolated)
  description: >
    Idebenone, a short-chain coenzyme-Q10 analogue/antioxidant that bypasses complex
    I, is approved in Europe for Leber hereditary optic neuropathy (LHON) and is being
    explored for OPA1-related dominant optic atrophy. Its use in Behr syndrome is
    experimental and extrapolated from the broader mitochondrial optic neuropathy
    class; it is not an established, Behr-specific therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: idebenone
      term:
        id: CHEBI:31687
        label: idebenone
  evidence:
  - reference: PMID:33159657
    reference_title: "Therapeutic Options in Hereditary Optic Neuropathies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The successful launch of the antioxidant idebenone"
    explanation: Idebenone is the most-developed antioxidant for mitochondrial optic neuropathies (approved for LHON); its use in OPA1/Behr disease is extrapolated from this class, not proven specifically for Behr syndrome.
- name: Gene-Based Therapy (Investigational)
  description: >
    Gene replacement (allotopic expression) and variant-agnostic gene-expression
    modulation are in early-phase clinical development for OPA1-related dominant optic
    atrophy; none is established for recessive Behr syndrome, but they represent the
    principal disease-modifying research direction for OPA1 disease.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: Gene Therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:41318849
    reference_title: "Advanced therapies for inherited optic neuropathies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Early phase clinical \ntrials are underway for ADOA caused by variants in the nuclear gene OPA1"
    explanation: Early-phase gene-expression-modulation trials are underway for OPA1-related optic atrophy; this is an investigational direction extrapolated to (not yet proven for) recessive Behr syndrome.
- name: Genetic Counseling
  description: >
    Genetic counseling for affected individuals and families given autosomal
    recessive inheritance.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling


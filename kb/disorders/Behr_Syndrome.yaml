    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some reported cases have been found to carry mutations in the OPA1, OPA3 or C12ORF65 genes which are known causes of pure optic atrophy or optic atrophy complicated by movement disorder."
    explanation: Documents C12ORF65 (MTRFR) as a reported genetic cause of the Behr syndrome phenotype (locus heterogeneity).

- name: C19orf12
  notes: >
    A homozygous C19orf12 mutation — otherwise associated with mitochondrial
    membrane protein-associated neurodegeneration (MPAN), a subtype of
    neurodegeneration with brain iron accumulation (NBIA) — was identified in two
    sisters with a Behr syndrome phenotype, expanding the spectrum of genetic
    causes. Brain MRI showed basal-ganglia hypointensities suggesting NBIA, so
    C19orf12 screening is recommended in patients presenting with Behr syndrome.

name: Behr Syndrome
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Behr syndrome
  term:
    id: MONDO:0008858
    label: Behr syndrome
description: >-
  Behr syndrome is an early-onset syndromic optic neuropathy with variable ataxia, peripheral neuropathy,
  pyramidal signs and cognitive involvement. This entry describes the OPA1-related disorder mapped to
  MONDO:0008858 and OMIM:210000, particularly biallelic disease. The historical Behr phenotype is genetically
  heterogeneous: OPA3/Costeff, MTRFR and C19orf12 disorders are documented molecular differentials. OPA1
  disease can combine a severe allele with a hypomorphic allele, or arise from homozygous missense variants.
  Optic atrophy may be subtle or recognized after neurological symptoms; intellectual disability, spasticity
  and cerebellar atrophy are not obligatory. Patient studies demonstrate reduced OPA1 abundance, mitochondrial
  fragmentation and genotype-dependent bioenergetic abnormalities, with progressive optic and peripheral
  nerve dysfunction.
parents:
- OPA1-Related Optic Atrophy

inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic OPA1 disease often segregates recessively, but severe-plus-hypomorphic allele combinations
    can resemble semidominant inheritance. Relatives with one allele may have dominant optic atrophy,
    subclinical findings or no detectable disease. Clinical Behr-like presentations have also been reported
    with a single heterozygous OPA1 variant; the historical phenotype alone does not establish recessive
    inheritance.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

  evidence:
  - reference: PMID:27150940
    reference_title: Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: These results may support either recessive or semi-dominant inheritance with incomplete penetrance.
    explanation: Unaffected parents in this family support more than one segregation model.
  - reference: PMID:24970096
    reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This hypomorphic allele causes a severe optic atrophy plus phenotype when combined with a compound heterozygous OPA1 null mutation.
    explanation: The intralocus modifier architecture is distinct from two uniformly null alleles.
pathophysiology:
- name: Biallelic OPA1 Variants
  biological_scale: MOLECULAR
  description: Biallelic OPA1 variants include truncating, deep-intronic splice-altering and missense alleles. An intragenic hypomorphic allele can intensify the phenotype of an allele that causes dominant optic atrophy in isolation. Variant effects differ; reduced GTPase catalytic activity has not been established for every genotype.
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:28442211
    reference_title: Leigh-like neuroimaging features associated with new biallelic mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified the homozygous c.1180G>A/p.Ala394Thr mutation in Pt1 and the c.2779-2A>C mutation in compound heterozygosity with the c.2809C>T/p.Arg937Cys mutation in Pt2.
    explanation: Two distinct biallelic architectures were identified in affected children.
  - reference: PMID:24970096
    reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the deep intronic mutation occurred in compound heterozygous state with an exonic OPA1 missense variant (p.I382M; NM_015560.2).
    explanation: The severe phenotype can involve a splice allele plus an intralocus modifier.
  - reference: PMID:18158317
    reference_title: OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: Mutations in OPA1, a dynamin-related GTPase involved in mitochondrial fusion, cristae organization and control of apoptosis, have been linked to non-syndromic optic neuropathy transmitted as an autosomal-dominant trait (DOA).
    explanation: This background statement establishes normal OPA1 GTPase function. The unmodified molecular-function annotation does not claim that every biallelic variant reduces catalytic activity.

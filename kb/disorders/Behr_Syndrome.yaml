    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some reported cases have been found to carry mutations in the OPA1, OPA3 or C12ORF65 genes which are known causes of pure optic atrophy or optic atrophy complicated by movement disorder."
    explanation: Documents OPA3 (with OPA1 and C12ORF65) as a reported genetic cause of the Behr syndrome phenotype (locus heterogeneity).

- name: C12orf65
  notes: >
    Biallelic variants in C12orf65 (MTRFR), a mitochondrial translation-release
    factor, produce a Behr-like syndrome of optic atrophy, neuropathy, and
    spastic paraparesis (locus heterogeneity).
  gene_term:
    preferred_term: MTRFR

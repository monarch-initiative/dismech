genetic:
- name: OPA1
  notes: >-
    Biallelic OPA1 disease involves missense, truncating, canonical splice-site and deep-intronic alleles.
    The recurrent p.Ile437Met/p.Ile382Met substitution is an intragenic modifier in trans with a more
    severe allele; it is not a second-gene modifier. Single-allele expression varies between families.
    Neither penetrance nor the proportion of each variant class can be estimated from these small selected
    series.
  gene_term:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:28442211
    reference_title: Leigh-like neuroimaging features associated with new biallelic mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified the homozygous c.1180G>A/p.Ala394Thr mutation in Pt1 and the c.2779-2A>C mutation in compound heterozygosity with the c.2809C>T/p.Arg937Cys mutation in Pt2.
    explanation: Two distinct biallelic architectures were identified in affected children.
  - reference: PMID:24970096
    reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the deep intronic mutation occurred in compound heterozygous state with an exonic OPA1 missense variant (p.I382M; NM_015560.2).
    explanation: The severe phenotype can involve a splice allele plus an intralocus modifier.
  - reference: PMID:24970096
    reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the homozygous father Subject I:1 is still healthy at the age of 76 years, without evidence for subclinical optic atrophy.
    explanation: The modifier alone was not sufficient to produce disease in this family.
  variant_origin: GERMLINE
  variants:
  - name: c.610+364G>A
    variant_type: single nucleotide variant
    genomic_contexts:
    - intron
    description: Deep-intronic allele on NM_130837.2 in OAK587, in trans with c.1311A>G. Patient transcript analysis demonstrated cryptic exon inclusion, premature termination and nonsense-mediated decay. The same splice allele alone was associated with milder or clinically unapparent disease.
    evidence:
    - reference: PMID:24970096
      reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The mutation creates a new splice acceptor site resulting in aberrant OPA1 transcripts with retained intronic sequence and subsequent translational frameshift as shown by complementary DNA analysis.
      explanation: Patient cDNA establishes the splice consequence of the deep intronic allele.
    - reference: PMID:24970096
      reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: To suppress nonsense-mediated messenger RNA decay-dependent allelic decay we used puromycin treatment in patient derived fibroblasts. After this treatment, allelic balance on RNA level could be nearly restored back to normal, as proven by pyrosequencing.
      explanation: Puromycin rescue of allelic RNA imbalance supports nonsense-mediated decay in the deep-intronic family.
  - name: c.1311A>G (p.Ile437Met)
    variant_type: single nucleotide variant
    description: NM_130837.2 notation; equivalent to c.1146A>G (p.Ile382Met) on NM_015560.2. Recurrent hypomorphic/intralocus modifier in severe compound-heterozygous disease. Clinical expression in isolation is variable; a healthy homozygous elderly father was documented. Yeast showed a mild functional defect, not a direct measurement of human GTPase catalysis.
    evidence:
    - reference: PMID:28494813
      reference_title: 'Not only dominant, not only optic atrophy: expanding the clinical spectrum associated with OPA1 mutations.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The latter corresponds to c.1146A > G, p.I382M based on transcript NM_015560.2
      explanation: The source explicitly reconciles the transcript-dependent nomenclature.
    - reference: PMID:24970096
      reference_title: Pure and syndromic optic atrophy explained by deep intronic OPA1 mutations and an intralocus modifier.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the homozygous father Subject I:1 is still healthy at the age of 76 years, without evidence for subclinical optic atrophy.
      explanation: Family observation limits claims of intrinsic high penetrance.
  - name: c.1180G>A (p.Ala394Thr)
    variant_type: single nucleotide variant
    description: Homozygous missense variant on NM_130837.2, associated with spastic ataxia and neuropathy; optic involvement may be subtle or delayed. Patient fibroblasts and a yeast complementation model showed functional abnormalities.
    evidence:
    - reference: PMID:28442211
      reference_title: Leigh-like neuroimaging features associated with new biallelic mutations in OPA1.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: we identified the homozygous c.1180G>A/p.Ala394Thr mutation in Pt1 and the c.2779-2A>C mutation in compound heterozygosity with the c.2809C>T/p.Arg937Cys mutation in Pt2.
      explanation: Two distinct biallelic architectures were identified in affected children.
    - reference: PMID:28494813
      reference_title: 'Not only dominant, not only optic atrophy: expanding the clinical spectrum associated with OPA1 mutations.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: The ATP content in P3 fi- broblasts was normal respect to controls in regular medium but significantly reduced in galactose medium reflecting the lower efficiency of ATP production by OXPHOS in stress condition
      explanation: Homozygous Ala394Thr fibroblasts show a stress-dependent ATP defect; it is not a universal resting ATP deficiency.
  - name: c.2287del (p.Ser763Valfs*15)
    variant_type: deletion
    description: Maternal NM_130837.2 frameshift in trans with paternal c.1311A>G in the child described in both Othman2022 and Jagadish2024. Also reported as c.2122del/p.Ser708Valfs*15 on NM_015560.2. Functional protein analysis was not performed for this allele in the case report.
    evidence:
    - reference: PMID:35741767
      reference_title: Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The variant c.2287del (maternally inherited) is predicted to result in a translational frameshift and premature protein termination (p.Ser763Valfs*15).
      explanation: The truncating consequence is predicted, not assayed.
    - reference: PMID:35741767
      reference_title: Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: The functional analysis of the effect of this mutation on the amount of protein was not performed.
      explanation: Explicit limitation of this individual allele.
  - name: p.Leu620fs*13 and p.Arg905Gln
    description: Compound-heterozygous paternal frameshift and maternal missense variants, reported as c.1857-1858delinsT and c.G2714A in Lee2016. Associated with severe optic atrophy, sensorimotor neuropathy and congenital cataract. The missense effect was predicted computationally; the report did not demonstrate its biochemical mechanism.

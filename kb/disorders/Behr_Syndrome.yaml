biochemical:
- name: Cytochrome c oxidase (COX) deficiency
  context: Muscle biopsy / mitochondrial respiratory-chain readout
  notes: >-
    Reduced cytochrome c oxidase (complex IV) staining on muscle biopsy reflects the
    respiratory-chain deficiency underlying the disease.
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle biopsy showed diffuse reduction of \ncytochrome c oxidase stain"
    explanation: Documents reduced cytochrome c oxidase staining, a biochemical readout of the mitochondrial respiratory-chain deficiency.
- name: Elevated lactate
  context: Blood/CSF and MR-spectroscopy lactate peak
  notes: >-
    Pathological lactate elevation (including an MR-spectroscopy lactate peak)
    reflects impaired oxidative metabolism, most prominent during metabolic
    decompensation.
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "basal ganglia hyperintensities and pathological peak \nlevels of lactate"
    explanation: Documents pathological lactate elevation accompanying the Leigh-like neuroimaging changes.


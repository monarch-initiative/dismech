mechanistic_hypotheses:
- hypothesis_group_id: sarm1_axon_death
  hypothesis_label: SARM1-dependent axon death executes retinal ganglion cell degeneration downstream of the OPA1 mitochondrial defect
  status: EMERGING
  description: "Sarm1 loss protects RGC bodies, optic-nerve axons and visual electrophysiology in heterozygous Opa1R290Q/+ mice without correcting fragmentation. The study found little change in respiration or mtDNA copy number, and proposed oxidative-stress signaling upstream of SARM1 without proving the intermediate route. Extrapolation to human biallelic OPA1 disease remains untested; the result does not establish ATP depletion as the trigger."
  evidence:
  - reference: PMID:40344041
    reference_title: SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Sarm1 KO nearly completely suppressed all the degeneration phenotypes without reversing mitochondrial fragmentation.
    explanation: Genetic rescue in heterozygous Opa1R290Q/+ mice supports a downstream degeneration pathway; applicability to biallelic human disease remains untested.
discussions:
- discussion_id: sarm1_human_translation
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Retinal Ganglion Cell Degeneration
  prompt: Does SARM1-dependent axon death drive retinal ganglion cell degeneration in human biallelic-OPA1 Behr syndrome, as it does in the Opa1 mouse model — and would SARM1 inhibition be neuroprotective in patients?
  rationale: The SARM1 rescue is demonstrated only in a mouse model of dominant (monoallelic) OPA1 optic atrophy. Its relevance to human recessive/biallelic OPA1 Behr syndrome — a more severe, multisystem, developmental disease — is unproven, so the model result cannot yet be assumed to translate.
  proposed_experiments:
  - experiment_id: exp_sarm1_human_biallelic_opa1
    name: Test SARM1-dependent axon death in human biallelic-OPA1 models
    description: Assess SARM1-pathway activation in patient-derived (biallelic-OPA1) neurons/iPSC-derived retinal ganglion cells, test whether SARM1 inhibition is neuroprotective in those models, and evaluate SARM1 axon-death biomarkers in patient samples.
  evidence:
  - reference: PMID:40344041
    reference_title: SARM1 loss protects retinal ganglion cells in a mouse model of autosomal dominant optic atrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: Sarm1 KO nearly completely suppressed all the degeneration phenotypes without reversing mitochondrial fragmentation.
    explanation: Genetic rescue in heterozygous Opa1R290Q/+ mice supports a downstream degeneration pathway; applicability to biallelic human disease remains untested.

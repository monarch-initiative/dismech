    explanation: Documents the muscle histopathology — COX-deficient staining with atrophic fibers and type II fiber grouping — in biallelic-OPA1 Behr syndrome.

    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Large Myelinated Nerve Fiber Loss
  description: Sural nerve biopsy in one child showed complete loss of large myelinated fibers, reduced fiber density and relative preservation of unmyelinated axons. There was no demyelination, remyelination or onion-bulb formation. The reference specimen was from a younger child, so the counts are not a matched disease-wide estimate.

name: Behr Syndrome
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Behr syndrome
  term:
    id: MONDO:0008858
    label: Behr syndrome
description: >
  Behr syndrome is a rare, early-childhood-onset neurodegenerative disorder
  originally defined by Carl Behr in 1909 as the association of infantile
  bilateral optic atrophy with progressive neurological features — ataxia,
  pyramidal signs (spasticity), peripheral neuropathy, posterior-column sensory
  loss, and variable intellectual disability. It is now recognized as a
  clinically defined, genetically heterogeneous mitochondrial-neurodegenerative
  phenotype rather than a single-gene disease. In its molecularly resolved core
  form (OMIM 210000), Behr syndrome is caused by biallelic (recessive) pathogenic
  variants in OPA1, the same nuclear gene whose heterozygous mutations cause
  autosomal dominant optic atrophy; the severe recessive/compound-heterozygous
  state produces the syndromic "Behr-like" optic-atrophy-plus picture. Additional
  genes producing an overlapping Behr phenotype include OPA3 (Costeff optic
  atrophy syndrome / 3-methylglutaconic aciduria type III), C12orf65 (MTRFR) and
  MECR, all converging on impaired mitochondrial bioenergetics. OPA1 encodes a
  dynamin-related inner-mitochondrial-membrane GTPase required for mitochondrial
  inner-membrane fusion, cristae architecture, and mitochondrial DNA maintenance;
  loss of function causes bioenergetic failure and selective degeneration of
  retinal ganglion cells and central/peripheral neurons.
parents:
- Autosomal Dominant Optic Atrophy Plus

inheritance:
- name: Autosomal recessive
  description: >
    The molecularly resolved core form of Behr syndrome is inherited in an
    autosomal recessive manner, caused by biallelic (homozygous or
    compound-heterozygous) pathogenic variants in OPA1. Heterozygous carriers may
    show subclinical or mild optic atrophy consistent with dominant optic atrophy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance

pathophysiology:
- name: Biallelic OPA1 Loss of Function
  biological_scale: MOLECULAR
  description: >
    OPA1 encodes a dynamin-related GTPase imported into mitochondria and located
    to the inner membrane and intermembrane space. In the recessive, syndromic
    Behr form, patients carry biallelic OPA1 variants — typically a
    dominant-optic-atrophy allele in trans with a second, hypomorphic/missense
    allele — reducing OPA1 function below the threshold tolerated in the dominant
    disease and producing a severe multisystem phenotype.
  gene:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  biological_processes:
  - preferred_term: Mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic mutations in OPA1."
    explanation: Establishes biallelic (recessive) OPA1 variants as a cause of the Behr syndrome phenotype.
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPA1, a dynamin-related GTPase involved in mitochondrial fusion, cristae organization and control of apoptosis, have been linked to non-syndromic optic neuropathy transmitted as an autosomal-dominant trait (DOA)."
    explanation: Identifies OPA1 as a dynamin-related GTPase whose functions in mitochondrial fusion and cristae organization are disrupted by mutation.
  downstream:
  - target: Mitochondrial Fusion and Cristae Disruption with Bioenergetic Failure
    description: >
      Reduced OPA1 function impairs inner-membrane fusion and cristae
      organization, degrading oxidative phosphorylation and mitochondrial DNA
      maintenance.
    causal_link_type: DIRECT

- name: Mitochondrial Fusion and Cristae Disruption with Bioenergetic Failure
  biological_scale: CELLULAR
  description: >
    Loss of OPA1-dependent inner-membrane fusion disrupts cristae architecture,
    impairing assembly and function of the oxidative phosphorylation machinery and
    destabilizing the mitochondrial genome. The resulting chronic energy deficit
    is most damaging to high-energy-demand, long-projection neurons.
  biological_processes:
  - preferred_term: Cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we \ndemonstrate that these patients all harboured multiple deletions of \nmitochondrial DNA (mtDNA) in their skeletal muscle, thus revealing an \nunrecognized role of the OPA1 protein in mtDNA stability."
    explanation: Documents OPA1's role in mitochondrial DNA maintenance, whose loss destabilizes the mitochondrial genome and impairs oxidative phosphorylation.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, muscle biopsy showed diffuse reduction of \ncytochrome c oxidase stain"
    explanation: Cytochrome c oxidase deficiency on muscle biopsy demonstrates the oxidative phosphorylation failure downstream of OPA1 loss in Behr syndrome.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also observed in patients' fibroblasts a higher proportion of \nfragmented and intermediate mitochondria upon galactose treatment compared to \ncontrols"
    explanation: Patient fibroblasts show fragmented mitochondria, the cellular signature of impaired OPA1-dependent mitochondrial fusion.
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    description: >
      Retinal ganglion cells, with long unmyelinated axons and high energy
      demand, are selectively vulnerable to mitochondrial bioenergetic failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Central and Peripheral Neurodegeneration
    description: >
      Bioenergetic failure extends to cerebellar, corticospinal, and sensory
      peripheral neurons, producing the neurological "plus" features.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Retinal Ganglion Cell Degeneration
  biological_scale: TISSUE
  description: >
    Progressive degeneration of retinal ganglion cells and their axons in the
    optic nerve produces bilateral optic atrophy with reduced visual acuity,
    optic-disc pallor, and central visual field defects, typically with onset in
    infancy or early childhood.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In Pt1 ocular fundus \nexamination revealed optic disk pallor whereas Pt2 exhibited severe optic \natrophy."
    explanation: Documents optic-disc pallor and optic atrophy, the retinal-ganglion-cell degeneration phenotype in biallelic-OPA1 Behr syndrome.

- name: Central and Peripheral Neurodegeneration
  biological_scale: TISSUE
  description: >
    Degeneration of cerebellar and corticospinal pathways and of peripheral
    sensory axons (including dorsal-column pathways) underlies the ataxia,
    spasticity/pyramidal signs, peripheral neuropathy, and posterior-column
    sensory loss that distinguish Behr syndrome from isolated optic atrophy.
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both children neuroimaging detected a progressive cerebellar \ninvolvement accompanied by basal ganglia hyperintensities and pathological peak \nlevels of lactate."
    explanation: Progressive cerebellar involvement with elevated lactate demonstrates central neurodegeneration on a mitochondrial-bioenergetic background.

phenotypes:
- name: Optic Atrophy
  description: >
    Bilateral, early-onset (infantile/early-childhood) optic atrophy is the
    defining feature, producing reduced visual acuity and optic-disc pallor.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is characterized by the association of early onset optic atrophy, \ncerebellar ataxia, pyramidal signs, peripheral neuropathy and mental \nretardation."
    explanation: Early-onset optic atrophy is the defining feature of Behr syndrome.

- name: Ataxia
  description: >
    Progressive cerebellar/sensory ataxia with gait impairment is a core
    neurological feature.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is characterized by the association of early onset optic atrophy, \ncerebellar ataxia, pyramidal signs, peripheral neuropathy and mental \nretardation."
    explanation: Cerebellar ataxia is a core component of the Behr syndrome clinical constellation.

- name: Spastic Paraparesis
  description: >
    Pyramidal-tract involvement produces spasticity, most prominently a spastic
    paraparesis of the lower limbs with hyperreflexia and extensor plantar
    responses.
  phenotype_term:
    preferred_term: Spastic paraparesis
    term:
      id: HP:0002313
      label: Spastic paraparesis
  evidence:
  - reference: PMID:26187298
    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr \nsyndrome, first described in 1909 by the ophthalmologist Carl \nBehr, is a clinical entity characterised by a progressive optic atrophy, ataxia, \npyramidal signs and mental retardation."
    explanation: Pyramidal signs (spasticity) are part of the historical and molecular definition of Behr syndrome.

- name: Intellectual Disability
  description: >
    Variable intellectual disability / developmental delay is present in a
    proportion of patients.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:26187298
    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "is a clinical entity characterised by a progressive optic atrophy, ataxia, \npyramidal signs and mental retardation."
    explanation: Intellectual disability ("mental retardation") is part of the defining clinical constellation of Behr syndrome.

- name: Peripheral Neuropathy
  description: >
    A peripheral (predominantly axonal, sensorimotor) neuropathy contributes to
    distal weakness and sensory loss.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is characterized by the association of early onset optic atrophy, \ncerebellar ataxia, pyramidal signs, peripheral neuropathy and mental \nretardation."
    explanation: Peripheral neuropathy is a recognized component of the Behr syndrome phenotype.

- name: Impaired Vibration Sensation (Posterior Column)
  description: >
    Posterior-column (dorsal-column) sensory loss manifests as impaired
    vibration and proprioceptive sensation, historically emphasized in Behr's
    original description.
  phenotype_term:
    preferred_term: Impaired vibration sensation in the lower limbs
    term:
      id: HP:0002166
      label: Impaired vibration sensation in the lower limbs

- name: Nystagmus
  description: >
    Nystagmus is frequently observed, reflecting combined visual and
    cerebellar involvement.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus

- name: Dysarthria
  description: >
    Cerebellar and corticobulbar involvement can produce dysarthric speech.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria

genetic:
- name: OPA1
  notes: >
    Biallelic (recessive/compound-heterozygous) pathogenic variants in OPA1 cause
    the molecularly resolved core form of Behr syndrome (OMIM 210000). OPA1 is the
    same gene whose heterozygous mutations cause autosomal dominant optic atrophy.
  gene_term:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic mutations in OPA1."
    explanation: Biallelic OPA1 variants are established as a cause of Behr syndrome.

- name: OPA3
  notes: >
    Biallelic OPA3 variants cause Costeff optic atrophy syndrome (3-methylglutaconic
    aciduria type III), a clinically overlapping cause of a Behr-like optic-atrophy-
    plus phenotype (locus heterogeneity).
  gene_term:
    preferred_term: OPA3
    term:
      id: hgnc:8142
      label: OPA3
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:26187298
    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some reported cases have been found to carry mutations in the OPA1, OPA3 or C12ORF65 genes which are known causes of pure optic atrophy or optic atrophy complicated by movement disorder."
    explanation: Documents OPA3 (with OPA1 and C12ORF65) as a reported genetic cause of the Behr syndrome phenotype (locus heterogeneity).

- name: C12orf65
  notes: >
    Biallelic variants in C12orf65 (MTRFR), a mitochondrial translation-release
    factor, produce a Behr-like syndrome of optic atrophy, neuropathy, and
    spastic paraparesis (locus heterogeneity).
  gene_term:
    preferred_term: MTRFR
    term:
      id: hgnc:26784
      label: MTRFR
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:26187298
    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Some reported cases have been found to carry mutations in the OPA1, OPA3 or C12ORF65 genes which are known causes of pure optic atrophy or optic atrophy complicated by movement disorder."
    explanation: Documents C12ORF65 (MTRFR) as a reported genetic cause of the Behr syndrome phenotype (locus heterogeneity).

treatments:
- name: Supportive and Multidisciplinary Care
  description: >
    No disease-modifying therapy exists. Management is supportive: low-vision
    rehabilitation, physical and occupational therapy for spasticity and ataxia,
    orthopedic/mobility aids, and genetic counseling.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
  therapeutic_modality: BEHAVIORAL

- name: Genetic Counseling
  description: >
    Genetic counseling is recommended given autosomal recessive inheritance and
    the relationship of OPA1 to dominant optic atrophy in family members.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling
  therapeutic_modality: BEHAVIORAL

experimental_models:
- name: iPS-OPA1-BEHR
  description: >
    Patient-derived induced pluripotent stem cell line reprogrammed from skin
    fibroblasts of a 48-year-old patient carrying compound heterozygous OPA1
    mutations (c.610+364G>A and c.1311A>G) causing Behr syndrome. Generated with
    episomal plasmids (hOCT4, hSOX2, hKLF4, hL-MYC, hLIN28); the resulting line
    is transgene-free with no additional genomic aberrations, and is intended for
    disease modeling of complex optic atrophy syndromes.
  experimental_model_type: IPSC_DERIVED_MODEL

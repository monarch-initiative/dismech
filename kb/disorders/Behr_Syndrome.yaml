    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic mutations in OPA1."
    explanation: Biallelic OPA1 variants are established as a cause of Behr syndrome.

  - reference: PMID:27150940
    reference_title: Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mother was \nheterozygous for the p.R905Q missense mutation and the father was heterozygous \nfor the p.L620fs frameshift mutation"
    explanation: A worked example of the biallelic architecture — a frameshift (null) allele in trans with a missense allele, each inherited from an unaffected heterozygous parent (recessive inheritance).
  - reference: PMID:35741767
    reference_title: Biallelic Optic Atrophy 1 (OPA1) Related Disorder-Case Report and Literature Review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the second is considered asymptomatic by itself but has been \nreported in patients with DOA phenotype and is presumed to act as a phenotypic \nmodifier"
    explanation: Documents that the second OPA1 allele in a biallelic Behr genotype can be asymptomatic in isolation and act as a phenotypic modifier — the dosage-modifier architecture underlying the recessive disease.
- name: OPA3
  notes: >
    Biallelic OPA3 variants cause Costeff optic atrophy syndrome (3-methylglutaconic
    aciduria type III), a clinically overlapping cause of a Behr-like
    optic-atrophy-plus phenotype (locus heterogeneity).
  gene_term:
    preferred_term: OPA3
    term:

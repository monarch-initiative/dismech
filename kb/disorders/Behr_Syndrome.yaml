diagnosis:
- name: Molecular Genetic Testing
  description: >
    Diagnosis rests on molecular confirmation. There are no universally accepted
    clinical criteria independent of genetic testing, so a Behr-syndrome
    presentation should prompt sequencing across the genetically heterogeneous
    causal set (OPA1, OPA3, C12orf65/MTRFR, C19orf12) rather than testing a
    single gene.
  evidence:
  - reference: PMID:26187298
    reference_title: "Behr syndrome with homozygous C19ORF12 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of patients presenting with Behr syndrome should include C19ORF12 mutation screening."
    explanation: Directly recommends broadening molecular testing in suspected Behr syndrome beyond the classical genes.

- name: Brain MRI / MR spectroscopy
  description: "Brain MRI may show cerebellar atrophy and basal-ganglia signal change (a Leigh-like appearance); MR spectroscopy may show a pathological lactate peak.\n"
  results: Cerebellar involvement, basal-ganglia hyperintensities, and/or a lactate peak.
  evidence:
  - reference: PMID:28442211
    reference_title: Leigh-like neuroimaging features associated with new biallelic mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neuroimaging detected a progressive cerebellar involvement accompanied by basal ganglia hyperintensities and pathological peak \nlevels of lactate"
    explanation: Documents the characteristic Leigh-like neuroimaging (cerebellar involvement, basal-ganglia change, lactate peak) supporting the diagnosis.
- name: Muscle biopsy / oxidative phosphorylation assessment
  description: "Muscle biopsy may show reduced cytochrome c oxidase (complex IV) staining, reflecting the mitochondrial respiratory-chain deficiency.\n"
  results: Diffuse reduction of cytochrome c oxidase staining.
  evidence:
  - reference: PMID:28442211
    reference_title: Leigh-like neuroimaging features associated with new biallelic mutations in OPA1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle biopsy showed diffuse reduction of \ncytochrome c oxidase stain"
    explanation: Muscle biopsy demonstrating reduced cytochrome c oxidase staining supports the mitochondrial basis of the disease.
- name: Nerve conduction studies / electrophysiology
  description: "Nerve conduction studies and electrophysiology confirm an axonal sensorimotor polyneuropathy; ophthalmologic testing (fundoscopy, OCT, VEP) documents the optic neuropathy.\n"
  results: Axonal sensorimotor polyneuropathy.

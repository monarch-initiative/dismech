diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Sequence OPA1 and assess allele phase with family testing in an optic-atrophy-plus presentation. A
    broader optic-neuropathy panel or exome can address molecular differentials. Negative coding-sequence
    and deletion/duplication testing does not exclude a deep-intronic OPA1 defect; targeted genomic and
    transcript studies resolved such a family.

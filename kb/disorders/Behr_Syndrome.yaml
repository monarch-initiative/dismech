    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Semi-thin transverse sections of the distal sural nerve demonstrated medium and small MFs with complete loss of large MFs.
    explanation: Biopsy directly demonstrates large myelinated-fiber loss in one OPA1 patient.

      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: the mother was heterozygous for the p.R905Q missense mutation and the father was heterozygous for the p.L620fs frameshift mutation
      explanation: Parental segregation establishes the reported trans configuration.
  - name: c.2779-2A>C and c.2809C>T (p.Arg937Cys)
    description: Compound-heterozygous splice-site and missense variants reported in one child with Leigh-like imaging; reduced OPA1 muscle protein and altered fibroblast morphology were measured at the genotype level.

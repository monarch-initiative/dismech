name: Behr Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Behr syndrome
  term:
    id: MONDO:0008858
    label: Behr syndrome
description: >
  Behr syndrome is an early-onset (infantile/early-childhood) neuro-ophthalmological
  disorder classically defined by the association of bilateral optic atrophy with a
  progressive neurological syndrome comprising cerebellar and sensory ataxia,
  pyramidal signs (spasticity/spastic paraparesis), peripheral (axonal) neuropathy,
  posterior-column sensory loss, and variable intellectual disability. Once regarded
  as a clinically defined, genetically heterogeneous entity, the classic phenotype is
  now recognized to sit at the severe, recessive end of the OPA1-related optic atrophy
  spectrum: it is most often caused by biallelic (compound-heterozygous) mutations in
  OPA1, which encodes the mitochondrial inner-membrane dynamin-related fusion GTPase.
  Combining a severe/null OPA1 allele with a second (usually missense) allele produces
  a syndromic "OPA1 recessive" disease far more severe than the dominant optic atrophy
  caused by a single OPA1 allele. Loss of OPA1 function disrupts mitochondrial fusion,
  cristae architecture, mitochondrial DNA maintenance, and oxidative phosphorylation,
  causing energy failure and degeneration of the highly energy-dependent retinal
  ganglion cells and central/peripheral neurons. Behr-like phenotypes have also been
  reported with biallelic variants in other genes (e.g., OPA3, C12orf65/MTRFR),
  reflecting the historical clinical heterogeneity of the eponym.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Classic Behr syndrome is inherited in an autosomal recessive manner; the
    OPA1-related form is typically caused by biallelic (compound-heterozygous)
    OPA1 variants, most often one severe loss-of-function allele in trans with a
    missense allele.
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is associated with compound heterozygous dysfunction in OPA1 gene"
    explanation: Establishes the compound-heterozygous (biallelic, recessive) OPA1 basis of Behr syndrome.

pathophysiology:
- name: Biallelic OPA1 Loss of Function and Impaired Mitochondrial Fusion
  biological_scale: MOLECULAR
  description: >
    OPA1 encodes a dynamin-related GTPase of the mitochondrial inner membrane and
    intermembrane space whose isoforms mediate inner-membrane fusion and structure the
    cristae. In Behr syndrome, biallelic OPA1 mutations — typically a severe/null allele
    combined in trans with a missense allele — reduce OPA1 function well below the
    ~50% seen in dominant optic atrophy, producing a much more severe defect in
    mitochondrial fusion and cristae organization and a syndromic, early-onset
    recessive disease.
  gene:
    preferred_term: OPA1
    term:
      id: hgnc:8140
      label: OPA1
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  - preferred_term: Cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  evidence:
  - reference: PMID:18158317
    reference_title: "OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in OPA1, a dynamin-related GTPase involved in mitochondrial fusion,"
    explanation: Establishes OPA1 as the dynamin-related GTPase whose fusion and cristae roles are disrupted by mutation.
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OPA1 encodes \na dynamin-related GTPase imported into mitochondria and located to the inner \nmembrane and intermembrane space."
    explanation: Review establishing OPA1 as a dynamin-related GTPase of the mitochondrial inner membrane.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, some cases were reported to be caused by biallelic"
    explanation: Confirms that Behr syndrome cases are caused by biallelic OPA1 mutations.
  downstream:
  - target: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
    description: >
      Loss of cristae integrity and impaired fusion directly compromise assembly
      and function of the oxidative phosphorylation machinery.
    causal_link_type: DIRECT

- name: Bioenergetic Failure and Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >
    Disrupted cristae, impaired fusion, and defective mitochondrial DNA maintenance
    together produce a respiratory-chain/oxidative phosphorylation deficiency.
    Neurons with high, sustained energy demands — retinal ganglion cells, cerebellar
    and long-tract central neurons, and peripheral axons — are selectively vulnerable
    to this energy deficit, and severe metabolic decompensation (metabolic stroke) can
    occur.
  biological_processes:
  - preferred_term: Oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  evidence:
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OPA1 is required for \noxidative phosphorylation, maintenance of mitochondrial genome, calcium \nhomeostasis and regulation of apoptosis"
    explanation: Review establishing that OPA1 is required for oxidative phosphorylation and mitochondrial genome maintenance.
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "metabolic stroke due to underlying mitochondrial dysfunction associated with OPA1 gene dysfunction"
    explanation: Documents mitochondrial dysfunction (with metabolic stroke) as a consequence of OPA1 dysfunction in a Behr patient.
  downstream:
  - target: Retinal Ganglion Cell Degeneration
    description: >
      Energy failure in the highly metabolically demanding retinal ganglion cells
      drives their selective degeneration, producing early-onset optic atrophy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Central and Peripheral Neurodegeneration
    description: >
      Respiratory-chain deficiency in energy-dependent central (cerebellar, pyramidal,
      posterior-column) and peripheral neurons drives the broader neurological
      syndrome of ataxia, spasticity, and neuropathy.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Retinal Ganglion Cell Degeneration
  biological_scale: CELLULAR
  description: >
    Selective degeneration and apoptosis of retinal ganglion cells, whose high energy
    demand makes them uniquely vulnerable to mitochondrial dysfunction, produce the
    bilateral optic atrophy that is the obligate ocular feature of Behr syndrome.
  cell_types:
  - preferred_term: Retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dominant optic atrophy (DOA) is an inherited mitochondrial disease leading to \nspecific degeneration of retinal ganglion cells (RGCs), thus compromising \ntransmission of visual information from the retina to the brain."
    explanation: Review establishing that OPA1-related optic atrophy results from specific degeneration of retinal ganglion cells.
  - reference: PMID:33340656
    reference_title: "Dominant optic atrophy: Culprit mitochondria in the optic nerve."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Besides the tremendous energy \nrequirements of RGCs to relay visual information from the eye to the brain"
    explanation: Explains why energy-demanding retinal ganglion cells are selectively vulnerable to the bioenergetic deficit.
  downstream:
  - target: Optic atrophy
    description: Retinal ganglion cell loss manifests clinically as early-onset bilateral optic atrophy.
    causal_link_type: DIRECT

- name: Central and Peripheral Neurodegeneration
  biological_scale: TISSUE
  description: >
    Beyond the optic nerve, bioenergetic failure drives degeneration of cerebellar,
    corticospinal (pyramidal), and dorsal-column sensory pathways as well as peripheral
    axons, producing the characteristic combination of cerebellar and sensory ataxia,
    spasticity/spastic paraparesis, posterior-column sensory loss, and peripheral
    neuropathy that distinguishes Behr syndrome from isolated optic atrophy. Neuroimaging
    can show progressive cerebellar involvement with basal ganglia signal change
    (a Leigh-like appearance).
  cell_types:
  - preferred_term: Neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "neuroimaging detected a progressive cerebellar involvement accompanied by basal ganglia hyperintensities"
    explanation: Documents progressive cerebellar and basal-ganglia (Leigh-like) CNS degeneration in biallelic-OPA1 Behr syndrome.
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "findings were \ncompatible with axonal sensorimotor polyneuropathy"
    explanation: Documents the axonal sensorimotor peripheral neuropathy component of the syndrome.
  downstream:
  - target: Ataxia
    description: Cerebellar and dorsal-column/sensory pathway degeneration produce cerebellar and sensory ataxia.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Spasticity
    description: Degeneration of corticospinal (pyramidal) tracts produces spasticity and spastic paraparesis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Peripheral neuropathy
    description: Axonal sensorimotor polyneuropathy arises from energy-dependent peripheral nerve degeneration.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

phenotypes:
- category: Phenotypic abnormality
  name: Optic atrophy
  description: >
    Early-onset (infantile/early-childhood) bilateral optic atrophy from retinal
    ganglion cell loss, with reduced visual acuity and optic disc pallor — the
    obligate, defining ocular feature of Behr syndrome, often severe enough to cause
    legal blindness in childhood.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behr syndrome is characterized by the association of early onset optic atrophy,"
    explanation: Establishes early-onset optic atrophy as a defining feature of Behr syndrome.
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He had optic atrophy and was declared legally blind at six years old."
    explanation: Documents severe early-onset optic atrophy causing childhood legal blindness in an OPA1-recessive Behr patient.

- category: Phenotypic abnormality
  name: Cerebellar ataxia
  description: >
    Progressive cerebellar (and sensory) ataxia is a core neurological feature,
    contributing to gait disturbance and incoordination from early childhood.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar ataxia, pyramidal signs, peripheral neuropathy and mental"
    explanation: Lists cerebellar ataxia among the defining neurological features of Behr syndrome.
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar ataxia, and optic atrophy in infancy"
    explanation: Documents cerebellar ataxia in a biallelic-OPA1 Behr patient.

- category: Phenotypic abnormality
  name: Spasticity
  description: >
    Pyramidal-tract involvement produces spasticity, hypertonia, and spastic
    paraparesis, often with brisk reflexes and extensor plantar responses.
  phenotype_term:
    preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "optic atrophy, \ncerebellar ataxia, pyramidal signs, peripheral neuropathy and mental \nretardation"
    explanation: Lists pyramidal signs (spasticity) among the defining features of Behr syndrome.

- category: Phenotypic abnormality
  name: Peripheral neuropathy
  description: >
    Axonal sensorimotor peripheral neuropathy contributes to distal weakness,
    sensory loss, and areflexia; electrophysiology and biopsy are compatible with an
    axonal polyneuropathy.
  phenotype_term:
    preferred_term: Peripheral neuropathy
    term:
      id: HP:0009830
      label: Peripheral neuropathy
  evidence:
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "findings were \ncompatible with axonal sensorimotor polyneuropathy"
    explanation: Documents the axonal sensorimotor polyneuropathy of OPA1-recessive Behr syndrome.
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical signs suggestive of a \nperipheral neuropathy, with onset in early infancy"
    explanation: Documents early-infantile-onset peripheral neuropathy in biallelic-OPA1 Behr patients.

- category: Phenotypic abnormality
  name: Intellectual disability
  description: >
    Variable intellectual disability / cognitive impairment is part of the historical
    clinical definition and is seen in a proportion of patients.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:28442211
    reference_title: "Leigh-like neuroimaging features associated with new biallelic mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "peripheral neuropathy and mental \nretardation"
    explanation: Lists intellectual disability (mental retardation) among the defining features of Behr syndrome.

- category: Phenotypic abnormality
  name: Cataract
  description: >
    Cataract (including congenital cataract) has been reported in OPA1-recessive Behr
    syndrome, expanding the OPA1 phenotype beyond the optic neuropathy.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:
  - reference: PMID:27150940
    reference_title: "Recessive optic atrophy, sensorimotor neuropathy and cataract associated with novel compound heterozygous mutations in OPA1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At birth, he presented with \na congenital cataract, which has not been previously described in patients with \nOPA1 mutations."
    explanation: Documents congenital cataract as a newly recognized feature of OPA1-recessive Behr syndrome.

- category: Phenotypic abnormality
  name: Sensorineural hearing loss
  description: >
    Sensorineural deafness occurs as part of the multisystem OPA1-related phenotype.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar ataxia, peripheral neuropathy, deafness, and gastrointestinal motility problems"
    explanation: Lists deafness among the typical constellation of Behr syndrome features.

- category: Phenotypic abnormality
  name: Gastrointestinal dysmotility
  description: >
    Gastrointestinal motility problems (including constipation and dysphagia) are part
    of the typical Behr syndrome constellation.
  phenotype_term:
    preferred_term: Gastrointestinal dysmotility
    term:
      id: HP:0002579
      label: Gastrointestinal dysmotility
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "peripheral neuropathy, deafness, and gastrointestinal motility problems"
    explanation: Lists gastrointestinal motility problems among the typical features of Behr syndrome.

- category: Phenotypic abnormality
  name: Motor delay
  description: >
    Delayed motor milestones and early motor development are commonly affected,
    reflecting the early-infantile onset of the neurodegeneration.
  phenotype_term:
    preferred_term: Motor delay
    term:
      id: HP:0001270
      label: Motor delay
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biallelic variants in OPA1 gene had delayed motor milestones"
    explanation: Documents delayed motor milestones in a biallelic-OPA1 Behr patient.

- category: Phenotypic abnormality
  name: Seizure
  description: >
    Seizures are not part of the typical Behr syndrome spectrum but have been reported
    in severe biallelic-OPA1 cases, including recurrent super-refractory status
    epilepticus with metabolic (stroke-like) decompensation.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:38369985
    reference_title: "Recurrent super-refractory status epilepticus and stroke like episode in a patient with Behr syndrome secondary to biallelic variants in OPA1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "recurrent episodes of \nsuper-refractory status epilepticus and metabolic stroke due to underlying \nmitochondrial dysfunction"
    explanation: Documents seizures (super-refractory status epilepticus) as a severe, atypical manifestation in an OPA1-recessive Behr patient.


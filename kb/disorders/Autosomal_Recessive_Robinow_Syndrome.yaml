genetic:
- name: ROR2
  gene_term:
    preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  relationship_type: CAUSATIVE
  notes: ROR2 encodes a noncanonical WNT5A coreceptor. Homozygous and compound-heterozygous genotypes occur, including missense, nonsense, frameshift, splice, initiation-codon and deletion alleles. The 2022 study included variants classified as uncertain significance by its automated ACMG assessment, so its putative disease-associated set should not be equated with uniformly established pathogenicity. Protein trafficking and stability, rather than position alone, help distinguish Robinow and brachydactyly phenotypes.
  evidence:
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified 25 putatively pathogenic ROR2 variants, 16 novel, including single nucleotide variants and exonic deletions.
    explanation: Documents candidate alleles in a clinically ascertained ROR2 cohort; some individual alleles remained uncertain significance.
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Gain-of-function (GoF) ROR2 variants have been associated with autosomal dominant brachydactyly type B (MIM 113000)
    explanation: Establishes the allelic-but-mechanistically-distinct relationship to brachydactyly type B.
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
animal_models:
- name: Ror2-null mouse
  species: Mouse
  genotype: Ror2(-/-)
  publication: PMID:14745966
  description: Constitutive Ror2 knockout, the reference developmental model for this form. Its value is that it resolves the syndrome into separate developmental defects at separate sites rather than one global growth failure.
  modeled_mechanisms:
  - target: Reduced Presomitic Mesoderm
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Vertebral malformations trace to a reduced presomitic mesoderm and defective somitogenesis.
    limitations: The single Ror2 knockout does not establish the quantitative contributions of each developmental lesion in humans. Ror1/Ror2 double-null mice show more severe defects, but loss of two receptors is not the human ROR2 genotype.
    readouts:
    - name: Presomitic mesoderm size
      target: Reduced Presomitic Mesoderm
      direction: DECREASED
      interpretation: The reduced mesodermal pool is the measured antecedent of the vertebral malformations.
      evidence:
      - reference: PMID:14745966
        reference_title: Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Our results demonstrate that vertebral malformations in Ror2(-/-) mice are due to reductions in the presomitic mesoderm and defects in somitogenesis.
        explanation: Reports the reduction this readout records.
    evidence:
    - reference: PMID:14745966
      reference_title: Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The Ror2(-/-) mouse provides a suitable model that may help to explain many of the underlying developmental malformations in individuals with Robinow syndrome.
      explanation: The authors' own statement that the model is informative for the human malformations.
  - target: Perturbed Growth Plate Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: Mesomelic limb shortening in the null mouse is attributed to perturbed chondrocyte differentiation.
    limitations: Assessed in the mouse growth plate; the corresponding human histology is not available, so the cellular claim transfers by inference from a shared gene and a shared limb phenotype.
    readouts:
    - name: Growth plate chondrocyte differentiation
      target: Perturbed Growth Plate Chondrocyte Differentiation
      direction: ALTERED
      interpretation: Disturbed differentiation is the cellular lesion behind the shortening.
      evidence:
      - reference: PMID:14745966
        reference_title: Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Mesomelic limb shortening in Ror2(-/-) mice is a consequence of perturbed chondrocyte differentiation.
        explanation: States the measured differentiation defect and its limb consequence.
  - target: Craniofacial Midline Outgrowth Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The craniofacial phenotype is caused by a midline outgrowth defect.
    limitations: Mouse and human midfacial morphology differ substantially, so the mechanism transfers more confidently than the morphology; the mouse does not reproduce the human facial gestalt as such.
    evidence:
    - reference: PMID:14745966
      reference_title: Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Moreover, we show that the craniofacial phenotype is caused by a midline outgrowth defect.
      explanation: Attributes the craniofacial phenotype to a specific mechanism.
  - target: Genital Tubercle Outgrowth Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Ror2 is expressed in the genital tubercle and the tubercle is reduced in the null mouse.
    limitations: The authors state only that Ror2 involvement in genital development is "likely"; expression plus reduced size is suggestive, not a demonstrated requirement.
    evidence:
    - reference: PMID:14745966
      reference_title: Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Ror2 expression in the genital tubercle and its reduced size in Ror2(-/-) mice makes it likely that Ror2 is involved in genital development.
      explanation: Supports the link at the strength the source states it.
- name: Ror1/Ror2 double-null mouse
  species: Mouse
  genotype: Ror1(-/-); Ror2(-/-)
  background: sv129/C57BL/6 hybrid
  publication: PMID:22343533
  description: Validated double-null embryos have more severe facial, caudal-axis and limb truncation than Ror2 single mutants; most die by E15.5. Their broad similarity to Wnt5a-null embryos supports overlapping developmental functions of Ror receptors.
  modeled_mechanisms:
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Combined receptor loss produces developmental defects resembling Wnt5a loss.
    limitations: This removes two receptors, whereas the human disorder is caused by ROR2 variants. Hindlimb asymmetry and low-penetrance exencephaly distinguish the double-null mouse from Wnt5a-null embryos.
    evidence:
    - reference: PMID:22343533
      reference_title: Wnt5a-Ror-Dishevelled signaling constitutes a core developmental pathway that controls tissue morphogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The absence of Ror signaling leads to defects that mirror phenotypes observed in Wnt5a null mutant mice, including decreased branching of sympathetic neuron axons and major defects in aspects of embryonic development that are dependent upon morphogenetic movements, such as severe truncation of the caudal axis, the limbs, and facial structures.
      explanation: Whole-organism evidence for overlapping Ror-dependent developmental functions.
    - reference: url:https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
      reference_title: https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'Between the ages of E12.5 and E13.5, Ror DKO

        embryos exhibit more severe phenotypes compared with Ror2

        mutants'
      explanation: Direct comparison supports a contribution of Ror1 in the mouse model.
diagnosis:
- name: Clinical and Radiographic Recognition
  description: Clinical recognition combines craniofacial, limb and genital findings with skeletal radiographs. Vertebral and rib anomalies strongly support ROR2 disease but are not universally present or exclusive to this gene. Molecular testing resolves the overlapping Robinow phenotypes.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:20301418
    reference_title: ROR2-Related Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The disorder is recognizable at birth or in early childhood.
    explanation: Supports clinical recognizability and its timing.
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A total of 19 clinical features were present in more than 75% of the subjects, thus pointing to an overall uniformity of the phenotype.
    explanation: Quantifies the phenotypic uniformity that makes recognition workable.
- name: Prenatal Recognition
  description: A reported fetus showed characteristic craniofacial, vertebral, digital and genital abnormalities at 24 + 3/7 weeks, with compound-heterozygous ROR2 variants identified in amniocytes. Recurrence counseling depends on parental segregation, including the possibility of an apparently de novo allele.
  diagnosis_term:
    preferred_term: Ultrasound Imaging
    term:
      id: NCIT:C17230
      label: Ultrasound Imaging
  evidence:
  - reference: PMID:38504427
    reference_title: Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelia, vertebral, digital and genital abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fetal ultrasound done on our patient at 24 + 3/7 weeks gestation showed macrocephaly, brachycephaly, flat face, prominent forehead, mild frontal bossing, lower thoracic hemivertebrae, digital abnormalities and micropenis.
    explanation: Documents the prenatal findings and their gestational age.
  - reference: PMID:38504427
    reference_title: Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelia, vertebral, digital and genital abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fetal trio whole exome sequencing done on amniocytes showed two pathogenic compound heterozygous variants in the ROR2 gene
    explanation: Establishes that molecular confirmation on amniocytes is achievable in the same pregnancy.
- name: Molecular Confirmation
  description: Confirmed by biallelic ROR2 pathogenic variants. Copy-number analysis is needed alongside sequencing, since whole-exon deletions are part of the allelic spectrum and would be missed by sequence calling alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301418
    reference_title: ROR2-Related Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of ROR2-related Robinow syndrome is established in a proband with typical suggestive findings and biallelic ROR2 pathogenic variants identified on molecular genetic testing.
    explanation: States the molecular confirmation criteria.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1240/
    reference_title: ROR2-Related Robinow Syndrome - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Homozygous deletions involving exons 6 and 7 have also been reported in Robinow syndrome
    explanation: Intragenic deletions are a documented allele class and motivate copy-number-aware testing.

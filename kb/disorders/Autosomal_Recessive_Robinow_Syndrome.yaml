name: Autosomal Recessive Robinow Syndrome
synonyms:
- RRS
- ROR2-related Robinow syndrome
- Robinow syndrome, autosomal recessive
- COVESDEM syndrome
- costovertebral segmentation defect with mesomelia
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive Robinow syndrome
  term:
    id: MONDO:0009999
    label: autosomal recessive Robinow syndrome
description: >-
  The ROR2 form, and the severe end of the Robinow spectrum. Biallelic
  loss-of-function variants in the WNT5A co-receptor ROR2 produce marked short
  stature with generalized rather than purely mesomelic limb shortening, the
  fetal-facies gestalt, genital hypoplasia — and, distinctively, segmental
  defects of the spine with hemivertebrae and rib fusions that the dominant
  forms do not produce. That axial involvement is why the entity was originally
  named COVESDEM, for costovertebral segmentation defect with mesomelia.

  Two molecular routes converge on the same endpoint. Truncating alleles
  introduce premature stop codons upstream of the positions that cause
  brachydactyly type B and predict nonfunctional protein, with the transcripts
  degraded by nonsense-mediated decay; missense alleles produce protein that is
  retained in the endoplasmic reticulum and never reaches the cell surface.
  Either way the receptor is absent. Whole-exon deletions, which cannot act by a
  gain-of-function route, corroborate loss of function as the mechanism.

  The Ror2-null mouse is the reference developmental model for the whole
  syndrome, and its value is that it resolves Robinow syndrome into separate
  lesions at separate sites rather than one global growth failure: reduced
  presomitic mesoderm behind the vertebral malformations, perturbed chondrocyte
  differentiation behind the mesomelia, a midline outgrowth defect behind the
  face, and a reduced genital tubercle behind the genital hypoplasia.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  Scope. This entry covers the ROR2 form only (MONDO:0009999). The NXN recessive
  form is ``Robinow_Syndrome_Autosomal_Recessive_2``; the dominant forms are
  curated separately; the union is ``kb/groupings/Robinow_Syndrome.yaml``.

  Brachydactyly type B is allelic at ROR2 but is a different disease with a
  different mechanism — heterozygous alleles located downstream of the Robinow
  positions, acting by gain of function or dominant negative rather than loss of
  function. It is a differential diagnosis here, not a subtype, and the
  positional separation of the two allele classes is what makes that call
  checkable rather than a matter of opinion.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian developmental disorder of a defined signalling pathway.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0090, listed as "Robinow syndrome, recessive type, ROR2-related"
      (MIM 268310, AR). The row's own comment records that it subsumes the
      previous COVESDEM designation and cross-references brachydactyly type B.
      The 2019 revision (Mortier et al., PMID:31633310) numbered the same group
      17.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based estimate exists. A 2002 review counted over 100
    published Robinow cases across both inheritance modes; the recessive form is
    over-represented in populations with high consanguinity, and a founder
    nonsense allele accounts for a large Omani cohort.
  evidence:
  - reference: PMID:12011143
    reference_title: "Robinow syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over 100 cases have now been reported and we have reviewed the current
      knowledge of the clinical and genetic features of the syndrome.
    explanation: >-
      Gives the order of magnitude of published cases as of 2002. PARTIAL
      because the count spans both inheritance modes rather than the recessive
      form alone.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ROR2 variants. Parental consanguinity is common, and a founder
    nonsense allele segregates in a large Omani cohort. Sibling recurrence risk
    is 25%.
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ROR2-related Robinow syndrome is inherited in an autosomal recessive
      manner.
    explanation: >-
      GeneReviews states the inheritance mode.
  - reference: PMID:10932186
    reference_title: "Recessive Robinow syndrome, allelic to dominant brachydactyly type B, is caused by mutation of ROR2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report homozygous missense mutations in both intracellular and
      extracellular domains of ROR2 in affected individuals from 3 unrelated
      consanguineous families, and a nonsense mutation that removes the tyrosine
      kinase domain and all subsequent 3' regions of the gene in 14 patients
      from 7 families from Oman.
    explanation: >-
      Documents homozygous alleles in consanguineous families and the Omani
      founder cohort.
pathophysiology:
- name: Biallelic ROR2 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  genetic_context:
    gene:
      preferred_term: ROR2
      term:
        id: hgnc:10257
        label: ROR2
    allele_type: missense, nonsense, frameshift, or whole-exon deletion
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >-
    Two routes to one endpoint. Truncating alleles predict nonfunctional protein
    and their transcripts are degraded by nonsense-mediated decay; missense
    alleles produce protein retained in the endoplasmic reticulum that never
    reaches the surface. Both converge on absence of the ROR2 receptor. Exonic
    deletions, which have no gain-of-function reading available to them,
    corroborate loss of function.
  molecular_functions:
  - preferred_term: ROR2 co-receptor engagement of WNT5A
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005109
      label: frizzled binding
  evidence:
  - reference: PMID:10932187
    reference_title: "Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ROR2 mutations present in RRS result in premature stop codons and
      predict nonfunctional proteins.
    explanation: >-
      Establishes the loss-of-function consequence of the recessive alleles.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While truncating variant mRNAs are degraded by nonsense-mediated decay
      (Ben-Shachar et al. 2009), mutant protein caused by missense variants are
      retained in the endoplasmic reticulum and ultimately lead to the absence
      of the ROR2 receptor
    explanation: >-
      Supplies the two molecular routes by which different allele classes reach
      the same absent-receptor endpoint.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of exonic deletion variant alleles further supports the
      contention of a loss-of-function mechanism in the etiology of the
      syndrome.
    explanation: >-
      Whole-exon deletions cannot act by gain of function, so they corroborate
      loss of function as the mechanism.
  downstream:
  - target: Loss of WNT5A/ROR2 Planar Cell Polarity Signalling
    causal_link_type: DIRECT
    description: >-
      Absence of the co-receptor blocks transduction at the membrane.
- name: Loss of WNT5A/ROR2 Planar Cell Polarity Signalling
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    WNT5A is the soluble ligand of ROR2; together with the FZD2 transmembrane
    receptor they trigger the Dishevelled proteins to transduce the
    beta-catenin-independent signal. Losing the receptor removes the input to
    that cascade. PCP signalling orients cells within the plane of a tissue and
    drives the polarized behaviour on which axial elongation, limb outgrowth,
    midline fusion and genital tubercle formation depend.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WNT5A acts as a soluble extracellular ligand of ROR2; and together with
      FZD2 transmembrane receptor they trigger the DVL homologs to transduce the
      β-catenin independent pathway.
    explanation: >-
      Specifies the ligand-receptor-transducer architecture this node sits in.
  downstream:
  - target: Reduced Presomitic Mesoderm and Defective Somitogenesis
    causal_link_type: DIRECT
    description: >-
      Loss of PCP signalling reduces the presomitic mesoderm from which the
      vertebral column is segmented.
  - target: Perturbed Growth Plate Chondrocyte Differentiation
    causal_link_type: DIRECT
    description: >-
      PCP signalling orients and differentiates growth plate chondrocytes.
  - target: Craniofacial Midline Outgrowth Defect
    causal_link_type: DIRECT
    description: >-
      Midline outgrowth of the frontonasal prominence depends on the same
      cascade.
  - target: Genital Tubercle Outgrowth Defect
    causal_link_type: DIRECT
    description: >-
      Ror2 is expressed in the genital tubercle, which is reduced when the
      pathway is lost.
  - target: Renal Tract Abnormalities
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Renal tract anomalies are a recognized feature, but no published work
      connects them to a specific PCP-dependent step of nephrogenesis.
- name: Reduced Presomitic Mesoderm and Defective Somitogenesis
  role: consequence
  biological_scale: TISSUE
  description: >-
    In the Ror2-null mouse, vertebral malformations trace to a reduced
    presomitic mesoderm and consequent defects in somitogenesis — not to a
    secondary effect of limb shortening. Because the vertebral column and ribs
    are segmented from that mesoderm, this is the developmental origin of the
    hemivertebrae and rib fusions that mark the recessive form.
  biological_processes:
  - preferred_term: somitogenesis
    modifier: DECREASED
    term:
      id: GO:0001756
      label: somitogenesis
  evidence:
  - reference: PMID:14745966
    reference_title: "Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Our results demonstrate that vertebral malformations in Ror2(-/-) mice are
      due to reductions in the presomitic mesoderm and defects in somitogenesis.
    explanation: >-
      Directly supports the developmental mechanism this node asserts, in the
      mouse null for this entry's gene.
  downstream:
  - target: Vertebral Segmentation Defects
    causal_link_type: DIRECT
    description: >-
      Segmentation of a reduced presomitic mesoderm yields hemivertebrae.
  - target: Rib Fusion
    causal_link_type: DIRECT
    description: >-
      The ribs segment from the same paraxial mesoderm.
  - target: Scoliosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Asymmetric vertebral segments impose a curve on the growing spine.
- name: Perturbed Growth Plate Chondrocyte Differentiation
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Mesomelic limb shortening arises from disturbed chondrocyte differentiation
    in the growth plate rather than from reduced limb bud initiation. In the
    recessive form the shortening extends beyond the middle segment, which is
    part of what makes this the severe end of the spectrum.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:14745966
    reference_title: "Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mesomelic limb shortening in Ror2(-/-) mice is a consequence of perturbed
      chondrocyte differentiation.
    explanation: >-
      Assigns the mesomelic shortening specifically to chondrocyte
      differentiation.
  downstream:
  - target: Mesomelic Limb Shortening
    causal_link_type: DIRECT
    description: >-
      Impaired growth plate chondrocyte differentiation shortens the limb.
  - target: Short Stature
    causal_link_type: DIRECT
    description: >-
      The same lesion summed over the long bones; stature loss is marked in this
      form.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      Digital shortening is the acral expression of the same defect, and ROR2
      alleles at other positions produce isolated brachydactyly type B.
- name: Craniofacial Midline Outgrowth Defect
  role: consequence
  biological_scale: TISSUE
  description: >-
    The fetal facies is a midline outgrowth failure of the frontonasal region
    rather than a collection of independent dysmorphisms. In the Ror2-null mouse
    the craniofacial phenotype is attributable to exactly that.
  cell_types:
  - preferred_term: migratory neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  evidence:
  - reference: PMID:14745966
    reference_title: "Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Moreover, we show that the craniofacial phenotype is caused by a midline
      outgrowth defect.
    explanation: >-
      Attributes the craniofacial phenotype to a specific developmental
      mechanism.
  downstream:
  - target: Fetal Facies
    causal_link_type: DIRECT
    description: >-
      Failed midline outgrowth produces the characteristic facial gestalt.
  - target: Prominent Forehead
    causal_link_type: DIRECT
    description: >-
      A component of the same midline outgrowth failure.
  - target: Short Nose
    causal_link_type: DIRECT
    description: >-
      The nasal component of the frontonasal outgrowth defect.
  - target: Gingival Overgrowth
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Gum hypertrophy accompanies the oral phenotype; the intermediates are not
      established.
  - target: Ankyloglossia
    causal_link_type: DIRECT
    description: >-
      Tongue tethering belongs to the same midline oral phenotype.
- name: Genital Tubercle Outgrowth Defect
  role: consequence
  biological_scale: TISSUE
  description: >-
    Genital hypoplasia is a primary developmental defect, not an endocrine one:
    Ror2 is expressed in the genital tubercle and the tubercle is reduced in
    Ror2-null mice. That predicts a structural micropenis responding only
    partially to androgen therapy.
  evidence:
  - reference: PMID:14745966
    reference_title: "Ror2 knockout mouse as a model for the developmental pathology of autosomal recessive Robinow syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ror2 expression in the genital tubercle and its reduced size in Ror2(-/-)
      mice makes it likely that Ror2 is involved in genital development.
    explanation: >-
      Supports a primary developmental origin. The source hedges ("makes it
      likely") and this node inherits that hedge.
  downstream:
  - target: Genital Hypoplasia
    causal_link_type: DIRECT
    description: >-
      A reduced tubercle yields hypoplastic external genitalia.
  - target: Micropenis
    causal_link_type: DIRECT
    description: >-
      The male expression of the tubercle defect.
  - target: Clitoral Hypoplasia
    causal_link_type: DIRECT
    description: >-
      The female expression of the same defect.
phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: >-
    Mesomelic or acromesomelic limb shortening. In the recessive form the
    shortening is more generalized than in the dominant forms.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed phenotypic analyses revealed that all subjects presented with a
      prominent forehead, hypertelorism, short nose, abnormality of the nasal
      tip, brachydactyly, mesomelic limb shortening, short stature, and genital
      hypoplasia in male patients.
    explanation: >-
      Mesomelic limb shortening was present in all 22 molecularly confirmed ROR2
      patients.
- category: Skeletal
  name: Short Stature
  description: >-
    Marked short stature; more pronounced than in the dominant forms.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More pronounced skeletal involvement and marked short stature are observed
      in the autosomal recessive (AR) form of RS (AR-RS), initially described as
      COVESDEM syndrome
    explanation: >-
      Records short stature and its greater severity in this form.
- category: Skeletal

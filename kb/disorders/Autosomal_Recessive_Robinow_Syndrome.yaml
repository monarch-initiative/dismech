    diagnosis.
  phenotype_term:
    preferred_term: Rib fusion
    term:
      id: HP:0000902
      label: Rib fusion
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, despite the more severe bone involvement in AR-RS, rib fusion is

name: Autosomal Recessive Robinow Syndrome
synonyms:
- RRS
- ROR2-related Robinow syndrome
- Robinow syndrome, autosomal recessive
- COVESDEM syndrome
- costovertebral segmentation defect with mesomelia
creation_date: '2026-08-27T00:00:00Z'
category: Mendelian
disease_term:
  preferred_term: autosomal recessive Robinow syndrome
  term:
    id: MONDO:0009999
    label: autosomal recessive Robinow syndrome
description: ROR2-related Robinow syndrome is an autosomal recessive developmental disorder caused by biallelic ROR2 loss-of-function variants. It combines short stature, mesomelic limb shortening, characteristic craniofacial findings, genital hypoplasia, and frequent vertebral segmentation defects and rib fusions. Axial skeletal abnormalities are more frequent than in dominant Robinow forms, but their presence or absence is not an absolute molecular discriminator. ROR2 dysfunction reduces noncanonical WNT5A signaling through variant-dependent defects in transcript abundance, protein trafficking, or signaling function. Some studied variants retain cell-surface expression and residual signaling. Ror2-null mice support distinct developmental contributions from presomitic mesoderm, growth-plate chondrocytes, craniofacial outgrowth, and genital tubercle development; transfer of these mechanisms to humans requires attention to model limitations.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: 'This entry covers ROR2-related Robinow syndrome (MONDO:0009999; OMIM:268310). NXN-related recessive Robinow syndrome and the dominant WNT5A/DVL forms are genetically distinct. Heterozygous ROR2 variants can cause brachydactyly type B1, but the distinction cannot be reduced to a universal upstream-versus-downstream positional rule: protein stability, trafficking, and residual surface expression influence the phenotype.'
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: A Mendelian developmental disorder of a defined signalling pathway.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al., PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row NOS 15-0090, listed as "Robinow syndrome, recessive type, ROR2-related" (MIM 268310, AR). The row's own comment records that it subsumes the previous COVESDEM designation and cross-references brachydactyly type B. The 2019 revision (Mortier et al., PMID:31633310) numbered the same group 17.

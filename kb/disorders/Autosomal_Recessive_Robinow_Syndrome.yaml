differential_diagnoses:
- name: Brachydactyly type B
  description: 'An allelic ROR2 disorder, usually dominantly inherited, with severe digital abnormalities. Variant position alone does not separate the phenotypes: a nonsense allele at a site also affected by a BDB frameshift produced Robinow features with severe recessive brachydactyly.'
  evidence:
  - reference: PMID:19640924
    reference_title: A gradient of ROR2 protein stability and membrane localization confers brachydactyly type B or Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The mutation is located at the same position as a previously described frame shift mutation causing dominant BDB1.
    explanation: The primary comparison directly contradicts a universal positional separation.
- name: Autosomal Dominant Robinow Syndrome 1
  description: The WNT5A form is usually milder skeletally. Vertebral anomalies and scoliosis are less frequent, but their absence is not a categorical discriminator; molecular testing distinguishes the forms.
- name: Robinow Syndrome, Autosomal Recessive 2
  description: The NXN form. Also recessive, but its phenotype clusters with the dominant forms rather than with ROR2 disease.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: Both homozygous and compound-heterozygous ROR2 pathogenic variants occur. Consanguinity is common but is not required. The usual 25% sibling recurrence risk applies when both parents carry a disease-causing allele; parental testing is important because a prenatal compound-heterozygous case included an apparently de novo allele.
  evidence:
  - reference: PMID:20301418
    reference_title: ROR2-Related Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ROR2-related Robinow syndrome is inherited in an autosomal recessive manner.
    explanation: GeneReviews states the inheritance mode.
  - reference: PMID:10932186
    reference_title: Recessive Robinow syndrome, allelic to dominant brachydactyly type B, is caused by mutation of ROR2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we report homozygous missense mutations in both intracellular and extracellular domains of ROR2 in affected individuals from 3 unrelated consanguineous families, and a nonsense mutation that removes the tyrosine kinase domain and all subsequent 3' regions of the gene in 14 patients from 7 families from Oman.
    explanation: Documents homozygous alleles in consanguineous families and the Omani founder cohort.
  - reference: PMID:38504427
    reference_title: Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelia, vertebral, digital and genital abnormalities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Fetal trio whole exome sequencing done on amniocytes showed two pathogenic compound heterozygous variants in the ROR2 gene
    explanation: Direct evidence that the disease is not restricted to homozygous genotypes.
pathophysiology:
- name: Biallelic ROR2 Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  genetic_context:
    gene:
      preferred_term: ROR2
      term:
        id: hgnc:10257
        label: ROR2
    allele_type: missense, nonsense, frameshift, splice-region, initiation-codon, or deletion allele
    functional_impact_category: LOSS_OF_FUNCTION
  description: Biallelic ROR2 variants impair receptor function. Reported alleles include missense, nonsense, frameshift, splice, initiation-codon and deletion variants. Nonsense-mediated decay is supported for selected truncating alleles, while several tested missense proteins show defective trafficking. These observations do not establish that every variant eliminates all receptor protein or signaling.
  evidence:
  - reference: PMID:10932187
    reference_title: Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The ROR2 mutations present in RRS result in premature stop codons and predict nonfunctional proteins.
    explanation: The founding study predicts nonfunctional proteins from premature stop codons; it does not directly measure function for every allele.
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The identification of exonic deletion variant alleles further supports the contention of a loss-of-function mechanism in the etiology of the syndrome.
    explanation: Clinical deletion alleles support the gene-level loss-of-function mechanism; deletion alone does not establish every downstream molecular consequence.
  downstream:
  - target: Reduced ROR2 Transcript Abundance
    causal_link_type: DIRECT
    description: Selected premature termination alleles trigger nonsense-mediated mRNA decay; this route is allele-dependent.
  - target: Defective ROR2 Trafficking to the Cell Surface
    causal_link_type: DIRECT
    description: Several experimentally tested missense and truncating proteins show intracellular retention; this is not universal for every disease-associated allele.
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced receptor abundance or impaired receptor function decreases noncanonical WNT5A signaling. Some variants retain surface localization and partial signaling.
  - target: Impaired Osteogenic Differentiation of Marrow Stromal Cells
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: ROR2 knockdown and variant-expression experiments suggest impaired osteogenic differentiation. Translation from this culture system to congenital skeletal disease remains provisional.
  mechanism_confidence: ESTABLISHED
- name: Reduced ROR2 Transcript Abundance
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: Nonsense-mediated decay reduces expression of selected ROR2 premature-termination alleles. Escape from this surveillance pathway contributes to the distinction between recessive Robinow and dominant brachydactyly alleles, but position alone does not explain all variants.
  evidence:
  - reference: PMID:19236432
    reference_title: Dominant versus recessive traits conveyed by allelic mutations - to what extent is nonsense-mediated decay involved?
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our experiments show that triggering or escaping NMD may cause different phenotypes with a distinct mode of inheritance.
    explanation: Experimental evidence for an allele-dependent contribution of nonsense-mediated decay.
  downstream:
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Reduced transcript abundance limits production of functional ROR2 protein.
- name: Defective ROR2 Trafficking to the Cell Surface
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: 'Several Robinow-associated ROR2 variants are retained intracellularly and show impaired delivery to the plasma membrane. HeLa-cell localization and immortalized mouse-fibroblast assays support this mechanism. It is variant-dependent: R189W and R272C reached the cell surface in the 2024 rescue assay and retained more signaling than five severely affected variants.'
  evidence:
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Co-expression of Ror2 and EGFP-hRas or calnexin in Hela-cells showed that wild-type Ror2 localizes predominantly to the plasma membrane, while mutant Ror2 proteins do not migrate to the plasma membrane and are retained to the endoplasmic reticulum
    explanation: Transfected-cell localization directly supports intracellular retention for the tested constructs.
  - reference: PMID:38780011
    reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: C182Y, R184C, C223Y, G326A, and R366W all fail to traffic to the plasma membrane, whereas R189W and R272C are expressed on the cell surface
    explanation: Surface staining distinguishes severe trafficking defects from variants that retain surface expression.
  - reference: PMID:17665217
    reference_title: Novel Robinow syndrome causing mutations in the proximal region of the frizzled-like domain of ROR2 are retained in the endoplasmic reticulum.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We establish the retention of the mutated proteins in the endoplasmic reticulum of HeLa cells and therefore failure to reach the plasma membrane.
    explanation: The earlier study directly tested ER retention for two CRD mutations; its findings do not establish retention for all subsequently identified alleles.
  downstream:
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    causal_link_type: DIRECT
    description: Impaired surface delivery reduces the receptor contribution to WNT5A signaling; functional assays also identify milder signaling deficits in surface-expressed variants.
  pdb_structures:

  experimental_model_type: CELL_LINE
  cell_source: Human HeLa cells transfected with wild-type or variant ROR2 constructs
  publication: PMID:35344616
  description: Confocal localization of selected ROR2 variants (Arg108Gln, Arg366Trp, Pro692Thr and Arg736Gln) relative to the plasma-membrane marker EGFP-hRas and ER marker calnexin.
  modeled_mechanisms:
  - target: Defective ROR2 Trafficking to the Cell Surface
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Selected variant proteins are retained intracellularly.
    limitations: Heterologous overexpression assay; does not establish that every Robinow-associated allele is retained in the ER.
    evidence:
    - reference: PMID:35344616
      reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO

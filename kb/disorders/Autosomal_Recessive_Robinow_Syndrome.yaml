    reference_title: "Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recessive form of Robinow syndrome (RRS; OMIM 268310), particularly
      frequent in Turkey, has a high incidence of abnormalities of the vertebral
      column such as hemivertebrae and rib fusions, which is not seen in the
      dominant form.
    explanation: >-
      States both the frequency in this form and the absence from the dominant
      forms.
- category: Skeletal
  name: Rib Fusion
  description: >-
    Proposed as near-pathognomonic for the recessive form, but not universally

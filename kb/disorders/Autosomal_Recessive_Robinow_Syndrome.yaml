    resolution_angstrom: 2.48
    method: X-ray diffraction
    target_protein: Human ROR2 cysteine-rich and Kringle domains
    publication: PMID:38780011
    description: Wild-type human CRD-Kr tandem structure used to interpret folding and variant effects. It is not a disease-mutant or drug-bound receptor structure.
- name: Reduced WNT5A-ROR2 Noncanonical Signalling
  role: central_effector
  biological_scale: CELLULAR
  description: ROR2 promotes Frizzled-dependent noncanonical WNT5A signaling. In an immortalized Ror1/Ror2-deficient mouse-fibroblast rescue system, Robinow-associated variants reduced GFP-Pdzrn3 reporter degradation and DVL2 phosphorylation to different degrees. The cysteine-rich domain was required for this activity, while constructs lacking the intracellular region retained activity in that assay. Residual signaling in cells lacking both ROR receptors argues against treating ROR2 loss as complete loss of every WNT5A response.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
  evidence:
  - reference: PMID:38780011
    reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: three of the five CRD mutations (C182Y, R184C, and C223Y) and both Kr mutations (G326A and R366W) exhibited strongly reduced signaling capabilities
    explanation: Direct functional assay of Robinow-associated substitutions.
  - reference: PMID:38780011
    reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The remaining two mutants (R189W and R272C) exhibited milder but still statistically significant signaling deficits
    explanation: Residual signaling varies among the assayed substitutions.
  - reference: PMID:38780011
    reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: ROR KO reporter cells without any ROR2 rescue still retained some basal WNT5A signaling activity, which remained dose-dependent with respect to WNT5A concentration
    explanation: Loss of ROR1 and ROR2 does not abolish every WNT5A response in this cell system.
  - reference: PMID:22343533
    reference_title: Wnt5a-Ror-Dishevelled signaling constitutes a core developmental pathway that controls tissue morphogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Through loss-of-function experiments in mice, we provide conclusive evidence that Ror receptors mediate Wnt5a-dependent processes in vivo and identify Dishevelled phosphorylation as a physiological target of Wnt5a-Ror signaling.
    explanation: Mouse loss-of-function studies identify a downstream signaling readout; this does not equate every WNT5A response with planar cell polarity.

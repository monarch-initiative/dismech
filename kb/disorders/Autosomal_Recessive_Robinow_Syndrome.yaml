- name: Primary embryonic fibroblast Ror deletion model
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary mouse E12.5 embryonic fibroblasts used within five passages
  publication: PMID:22343533
  description: Single- and double-receptor knockout cultures, including acute inducible deletion, compare endogenous Wnt5a-dependent signaling. Dvl2 phosphorylation decreases with loss of Ror receptors, while Wnt5a inhibition of canonical signaling and c-Jun phosphorylation were not dependent on Rors in this system.
  modeled_mechanisms:
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Loss of Ror receptors lowers the Dvl2 phosphorylation readout.
    limitations: Whole-gene mouse deletions do not reproduce every human missense genotype. Negative c-Jun and canonical-Wnt results are limited to this cell context.
    evidence:
    - reference: url:https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
      reference_title: https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: 'Dvl2 phosphorylation is in-

        creasingly reduced in Ror1−/−, Ror2−/−, and Ror DKO MEFs'
      explanation: Comparison of the mutant primary cultures shows a receptor-dose-dependent phosphorylation defect.
- name: ROR2-depleted marrow stromal cells with sphingomyelin rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Bone marrow mesenchymal stromal-cell culture; donor and species details are not clearly specified in the article methods
  publication: DOI:10.32604/biocell.2023.028851
  description: LV-shROR2 and LV-ROR2-c.904C>T cultures were compared with controls after osteogenic induction. Readouts included ALP activity, Alizarin Red staining, SMS1 transcripts, osteogenic markers, and ERK/P38/SMAD phosphorylation. Lipofectamine-delivered sphingomyelin was tested as a rescue intervention.
  modeled_mechanisms:
  - target: Impaired Osteogenic Differentiation of Marrow Stromal Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: The perturbations impair cellular osteogenic readouts, with rescue after sphingomyelin supplementation.
    limitations: Single in-vitro study with incompletely described cell provenance and triplicate assays. Reduced SMS1 transcript is not a direct sphingomyelin measurement; supplementation does not prove a unique causal pathway or clinical benefit.

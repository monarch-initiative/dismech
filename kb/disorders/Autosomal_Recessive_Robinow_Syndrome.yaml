  description: Discuss recurrence risk based on parental variants, carrier testing, and available prenatal or preimplantation testing to support informed reproductive choices. The usual 25% sibling risk assumes that both parents carry a disease-causing allele. Some heterozygotes can have brachydactyly type B1 findings.
  therapeutic_modality: BEHAVIORAL

discussions:
- discussion_id: ror2_null_mouse_vs_human_recessive_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: Does the Ror2-null mouse's four-lesion decomposition transfer quantitatively to human ROR2 disease, given that mouse Ror1 partially compensates for Ror2 loss?
  attaches_to:
  - pathophysiology#Reduced WNT5A-ROR2 Noncanonical Signalling
  rationale: 'The single Ror2 knockout separates axial skeletal, chondrocyte, craniofacial and genital findings. Validated Ror1/Ror2 double-null mice have more severe developmental defects, supporting overlapping receptor functions in mice. The quantitative contribution of ROR1 in human ROR2 disease remains unresolved. Noncanonical WNT5A-ROR signaling should not be treated as synonymous with all core planar cell polarity signaling: Ho et al. found substantial phenotypic differences between Ror and Vangl double mutants.'
  evidence:
  - reference: url:https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
    reference_title: https://greenberg.hms.harvard.edu/wp-content/uploads/2016/03/Ho-et-al-2012-Proc-Natl-Acad-Sci-USA.pdf
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Ror DKO mutants

      lacking all Ror signaling capacity have substantially non-

      overlapping phenotypes compared with mice with mutations in

      both members of the Vangl family'
    explanation: Mouse comparative phenotypes challenge a universal equivalence between the Ror and core PCP pathways.

- name: ROR1/ROR2-null iMEF rescue and Frizzled bypass system
  experimental_model_type: CELL_LINE
  cell_source: E12.5 mouse embryonic fibroblasts immortalized by CRISPR ablation of Tp53
  publication: PMID:38780011
  description: Conditional Ror1/Ror2 deletion is induced with 4-hydroxytamoxifen, followed by expression of mouse Ror2 constructs carrying domain deletions or Robinow-associated substitutions. GFP-Pdzrn3 degradation and DVL2 phosphorylation report signaling; surface staining and glycosidase sensitivity distinguish trafficking defects.
  modeled_mechanisms:
  - target: Reduced WNT5A-ROR2 Noncanonical Signalling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Variant rescue assays reveal strong or partial signaling deficits; mini-ROR2 and bivalent anti-Frizzled IgGs test distinct ways to restore the reporter response.
    limitations: Immortalized mouse cells with transgene expression. Rescue of a reporter is not rescue of congenital malformations; monovalent F2.A Fab instead inhibits WNT5A-driven signaling.
    evidence:
    - reference: PMID:38780011
      reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: The remaining two mutants (R189W and R272C) exhibited milder but still statistically significant signaling deficits
      explanation: The reporter assay distinguishes residual activity from the stronger defects of the other tested substitutions.
    - reference: PMID:38780011
      reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Signaling analyses by GFP-Pdzrn3 reporter degradation and DVL2 phosphorylation showed that mini-ROR2 can substantially rescue WNT5A signaling
      explanation: A synthetic CRD-Kr membrane-tethered construct restores cellular reporter responses; anatomical or clinical rescue was not tested.
    - reference: PMID:38780011
      reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: F2.A, in its bivalent IgG form and in the absence of any WNT5A, strongly induced GFP-Pdzrn3 reporter degradation, as well as DVL2 phosphorylation, in ROR cKO iMEFs, ROR KO iMEFs, and WT ROR2 rescued iMEFs
      explanation: Frizzled-directed IgG activates the assay downstream of receptor loss; this is a mechanistic bypass experiment, not a Robinow treatment trial.
    readouts:
    - name: WNT5A-induced GFP-Pdzrn3 degradation
      target: Reduced WNT5A-ROR2 Noncanonical Signalling
      direction: DECREASED
      interpretation: Disease-associated substitutions impair the reporter response to different degrees.
      evidence:
      - reference: PMID:38780011
        reference_title: Structure and function of the ROR2 cysteine-rich domain in vertebrate noncanonical WNT5A signaling.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: The remaining two mutants (R189W and R272C) exhibited milder but still statistically significant signaling deficits
        explanation: The reporter assay distinguishes residual activity from the stronger defects of the other tested substitutions.
  - target: Defective ROR2 Trafficking to the Cell Surface
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Five variants fail surface delivery, while R189W and R272C retain surface expression.
    limitations: Construct and cell-context dependence limits transfer to patient tissues.

genetic:
- name: ROR2
  gene_term:
    preferred_term: ROR2
    term:
      id: hgnc:10257
      label: ROR2
  relationship_type: CAUSATIVE
  notes: >-
    Receptor tyrosine kinase-like orphan receptor 2, the WNT5A co-receptor.
    Reported alleles include missense, nonsense, frameshift and whole-exon
    deletions, concentrated in exons 5, 6 and 9. Heterozygous ROR2 alleles at
    different positions cause brachydactyly type B by a distinct,
    non-loss-of-function mechanism, so the position of a truncating variant
    matters for interpretation.
  evidence:
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 25 putatively pathogenic ROR2 variants, 16 novel, including
      single nucleotide variants and exonic deletions.
    explanation: >-
      Documents the allelic spectrum in a molecularly confirmed cohort.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gain-of-function (GoF) ROR2 variants have been associated with autosomal
      dominant brachydactyly type B (MIM 113000)
    explanation: >-
      Establishes the allelic-but-mechanistically-distinct relationship to
      brachydactyly type B.
animal_models:
- name: Ror2-null mouse
  species: Mouse
  genotype: Ror2(-/-)
  publication: PMID:14745966
  description: >-
    Constitutive Ror2 knockout, the reference developmental model for this form.
    Its value is that it resolves the syndrome into separate developmental
    defects at separate sites rather than one global growth failure.
  modeled_mechanisms:
  - target: Reduced Presomitic Mesoderm and Defective Somitogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Vertebral malformations trace to a reduced presomitic mesoderm and
      defective somitogenesis.
    limitations: >-
      Mouse Ror1 partially compensates for Ror2 loss, so the single mutant is
      milder than complete pathway loss; the compound Ror1/Ror2 mutant is the
      closer phenocopy.
    readouts:
    - name: Presomitic mesoderm size
      target: Reduced Presomitic Mesoderm and Defective Somitogenesis
      direction: DECREASED
      interpretation: >-
        The reduced mesodermal pool is the measured antecedent of the vertebral
        malformations.
      evidence:
      - reference: PMID:14745966
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Our results demonstrate that vertebral malformations in Ror2(-/-) mice
          are due to reductions in the presomitic mesoderm and defects in
          somitogenesis.
        explanation: >-
          Reports the reduction this readout records.
    evidence:
    - reference: PMID:14745966
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Ror2(-/-) mouse provides a suitable model that may help to explain
        many of the underlying developmental malformations in individuals with
        Robinow syndrome.
      explanation: >-
        The authors' own statement that the model is informative for the human
        malformations.
  - target: Perturbed Growth Plate Chondrocyte Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Mesomelic limb shortening in the null mouse is attributed to perturbed
      chondrocyte differentiation.
    limitations: >-
      Assessed in the mouse growth plate; the corresponding human histology is
      not available, so the cellular claim transfers by inference from a shared
      gene and a shared limb phenotype.
    readouts:
    - name: Growth plate chondrocyte differentiation
      target: Perturbed Growth Plate Chondrocyte Differentiation
      direction: ALTERED
      interpretation: >-
        Disturbed differentiation is the cellular lesion behind the shortening.
      evidence:
      - reference: PMID:14745966
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mesomelic limb shortening in Ror2(-/-) mice is a consequence of
          perturbed chondrocyte differentiation.
        explanation: >-
          States the measured differentiation defect and its limb consequence.
  - target: Craniofacial Midline Outgrowth Defect
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The craniofacial phenotype is caused by a midline outgrowth defect.
    limitations: >-
      Mouse and human midfacial morphology differ substantially, so the
      mechanism transfers more confidently than the morphology; the mouse does
      not reproduce the human facial gestalt as such.
    evidence:
    - reference: PMID:14745966
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we show that the craniofacial phenotype is caused by a midline
        outgrowth defect.
      explanation: >-
        Attributes the craniofacial phenotype to a specific mechanism.
  - target: Genital Tubercle Outgrowth Defect
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ror2 is expressed in the genital tubercle and the tubercle is reduced in
      the null mouse.
    limitations: >-
      The authors state only that Ror2 involvement in genital development is
      "likely"; expression plus reduced size is suggestive, not a demonstrated
      requirement.
    evidence:
    - reference: PMID:14745966
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ror2 expression in the genital tubercle and its reduced size in
        Ror2(-/-) mice makes it likely that Ror2 is involved in genital
        development.
      explanation: >-
        Supports the link at the strength the source states it.
diagnosis:
- name: Clinical and Radiographic Recognition
  description: >-
    Recognizable at birth or in early childhood from the triad plus the axial
    findings. Recognition is unusually reliable for a rare dysplasia: in a
    molecularly confirmed cohort, 19 clinical features were each present in more
    than 75% of subjects. Vertebral imaging is the step that separates this form
    from the dominant ones.
  diagnosis_term:
    preferred_term: physical examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is recognizable at birth or in early childhood.
    explanation: >-
      Supports clinical recognizability and its timing.
  - reference: PMID:35344616
    reference_title: "Phenotypic and mutational spectrum of ROR2-related Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 19 clinical features were present in more than 75% of the
      subjects, thus pointing to an overall uniformity of the phenotype.
    explanation: >-
      Quantifies the phenotypic uniformity that makes recognition workable.
- name: Prenatal Recognition
  description: >-
    Recognizable on second-trimester ultrasound, where macrocephaly, a flat face
    with frontal bossing, mesomelic shortening, hemivertebrae and micropenis
    cluster; molecular confirmation is then possible on amniocytes. This matters
    because the recessive form is the severe one and recurrence risk in an
    affected family is 25%.
  diagnosis_term:
    preferred_term: prenatal ultrasonography
    term:
      id: NCIT:C17369
      label: Imaging Procedure
  evidence:
  - reference: PMID:38504427
    reference_title: "Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelic limb shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal ultrasound done on our patient at 24 + 3/7 weeks gestation showed
      macrocephaly, brachycephaly, flat face, prominent forehead, mild frontal
      bossing, lower thoracic hemivertebrae, digital abnormalities and
      micropenis.
    explanation: >-
      Documents the prenatal findings and their gestational age.
  - reference: PMID:38504427
    reference_title: "Prenatal diagnosis of ROR-2 related Robinow syndrome presenting with fetal ultrasound findings of mesomelic limb shortening."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fetal trio whole exome sequencing done on amniocytes showed two pathogenic
      compound heterozygous variants in the ROR2 gene
    explanation: >-
      Establishes that molecular confirmation on amniocytes is achievable in the
      same pregnancy.
- name: Molecular Confirmation
  description: >-
    Confirmed by biallelic ROR2 pathogenic variants. Copy-number analysis is
    needed alongside sequencing, since whole-exon deletions are part of the
    allelic spectrum and would be missed by sequence calling alone.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of ROR2-related Robinow syndrome is established in a proband
      with typical suggestive findings and biallelic ROR2 pathogenic variants
      identified on molecular genetic testing.
    explanation: >-
      States the molecular confirmation criteria.
differential_diagnoses:
- name: Brachydactyly type B
  description: >-
    Allelic at ROR2 but mechanistically distinct: heterozygous alleles located
    downstream of the Robinow positions, acting by gain of function or dominant
    negative rather than loss of function. Digital shortening without the facial,
    axial or genital components.
  evidence:
  - reference: PMID:10932187
    reference_title: "Mutation of the gene encoding the ROR2 tyrosine kinase causes autosomal recessive Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We detected several homozygous ROR2 mutations in our cohort of RRS
      patients that are located upstream from those previously found in BDB.
    explanation: >-
      Establishes the positional separation of the two allele classes at the
      same locus.
- name: Autosomal Dominant Robinow Syndrome 1
  description: >-
    The WNT5A form. Milder, without the vertebral segmentation defects and rib
    fusions, and dominantly inherited.
- name: Robinow Syndrome, Autosomal Recessive 2
  description: >-
    The NXN form. Also recessive, but its phenotype clusters with the dominant
    forms rather than with ROR2 disease.
- name: Congenital adrenal hyperplasia
  description: >-
    A documented diagnostic trap in a neonate presenting with micropenis and
    impalpable testes. The Robinow facial gestalt and mesomelia are present from
    birth and CAH does not produce them.
  evidence:
  - reference: PMID:41477475
    reference_title: "Robinow Syndrome Mimicking Congenital Adrenal Hyperplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He was suspected of having congenital adrenal hyperplasia and was started
      on glucocorticoid replacement.
    explanation: >-
      Documents the misdiagnosis and the treatment it led to.
treatments:
- name: Orthopedic Surgery for Limb and Spine Deformity
  description: >-
    Corrective surgery for limb and spine defects, more often needed here than
    in the dominant forms because vertebral segmentation defects and scoliosis
    are prominent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Corrective surgery for limb and spine defects
      and for facial abnormalities; orthodontic treatment as needed
    explanation: >-
      Lists corrective limb and spine surgery in the management of this form.
- name: Androgen Therapy for Micropenis
  description: >-
    Testosterone is used for micropenis. Because the genital phenotype
    originates in a developmental tubercle outgrowth defect rather than androgen
    deficiency, the response is symptomatic and often incomplete.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hormone therapy as needed for the treatment of micropenis
    explanation: >-
      GeneReviews lists hormone therapy for micropenis in management.
- name: Genetic Counseling
  description: >-
    A 25% sibling recurrence risk, with carrier testing and prenatal or
    preimplantation testing available once the family's variants are known.
    Consanguinity is common, which raises the counselling stakes for the wider
    family.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301418
    reference_title: "ROR2-Related Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At conception, each sib of an affected individual has a 25% chance of
      being affected with Robinow syndrome, a 50% chance of being a heterozygote
      (carrier) and usually asymptomatic, and a 25% chance of being unaffected
      and not a carrier.
    explanation: >-
      Supplies the recurrence risk figures.
discussions:
- discussion_id: ror2_null_mouse_vs_human_recessive_disease
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Ror2-null mouse's four-lesion decomposition transfer quantitatively
    to human ROR2 disease, given that mouse Ror1 partially compensates for Ror2
    loss?
  attaches_to:
  - pathophysiology#Loss of WNT5A/ROR2 Planar Cell Polarity Signalling
  rationale: >-
    Nearly all the developmental mechanism in this entry comes from the single
    Ror2 knockout, whose phenotype is milder than the Wnt5a null because Ror1
    covers part of the loss. The compound Ror1/Ror2 mutant is the closer
    phenocopy of complete pathway loss, but the published developmental
    decomposition was done in the single mutant. Whether the four lesions occur
    in the same proportions in human biallelic ROR2 disease — where there is no
    equivalent compensation question resolved — is untested.

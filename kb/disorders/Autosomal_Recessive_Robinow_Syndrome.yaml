phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: Mesomelic or acromesomelic limb shortening. In the recessive form the shortening is more generalized than in the dominant forms. Present in all 22 patients in the 2022 clinically ascertained cohort.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:35344616
    reference_title: Phenotypic and mutational spectrum of ROR2-related Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Detailed phenotypic analyses revealed that all subjects presented with a prominent forehead, hypertelorism, short nose, abnormality of the nasal tip, brachydactyly, mesomelic limb shortening, short stature, and genital hypoplasia in male patients.
    explanation: Observed throughout the clinically ascertained 22-person cohort; this is not an unbiased population penetrance estimate.

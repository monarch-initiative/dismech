    phenotype_term:
      preferred_term: Ichthyosis
      term:
        id: HP:0008064
        label: Ichthyosis
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          ichthyosis-like features and signs of sensory neuropathy
        explanation: >-
          Graded PARTIAL because the source says "ichthyosis-like" and this
          entry binds the unhedged term. The hedge is the authors' and is worth
          preserving rather than promoting to a diagnosis.
  - name: Global Developmental Delay
    category: Neurologic
    description: >-
      Delay across all developmental streams from infancy, preceding and
      distinct from the later regression: affected children fail to acquire
      head control, sitting and speech rather than losing them.
    phenotype_term:

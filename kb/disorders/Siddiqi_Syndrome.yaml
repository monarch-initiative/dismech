          sentence describing the disorder rather than in the title of the paper
          that named it.
  - name: Ichthyosis
    category: Dermatologic
    description: >-
      Reported as ichthyosis-like features, predominantly of the lower limbs.
      The entry uses the HP term for ichthyosis while the source hedges with

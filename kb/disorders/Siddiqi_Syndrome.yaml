inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Homozygous in the consanguineous founding family; compound heterozygous
      genotypes have since been reported, so consanguinity is the usual route
      rather than a requirement.
pathophysiology:
  - name: Loss of FITM2 Acyl-CoA Diphosphatase Activity
    biological_scale: MOLECULAR
    description: >-
      Biallelic loss-of-function variants remove the ER-lumenal fatty acyl-CoA
      diphosphatase activity of FITM2. This function was unknown when the disease
      was described in 2017 and was identified in 2020, which is why the earliest
      mechanistic accounts of this syndrome describe a lipid-droplet protein
      rather than an enzyme.
    genes:
      - preferred_term: FITM2
        term:
          id: hgnc:16135
          label: FITM2
    downstream:
      - target: Unbuffered Fatty Acyl-CoA and Failed Lipid Droplet Partitioning
    evidence:
      - reference: PMID:32915949
        reference_title: "FIT2 is an acyl-coenzyme A diphosphatase crucial for endoplasmic reticulum homeostasis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          the molecular function of the evolutionarily conserved ER protein FIT2
          as a fatty acyl-coenzyme A (CoA) diphosphatase that hydrolyzes fatty
          acyl-CoA to yield acyl 4'-phosphopantetheine
        explanation: >-
          Identifies the enzymatic activity this node claims is lost. FIT2 is
          the alternative name for FITM2 used throughout that literature.
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a homozygous nonsense mutation, c.4G>T (p.Glu2*), in FITM2 was
          identified
        explanation: >-
          The founding allele. A nonsense change at codon 2 is about as close to
          a null as a point mutation reaches, which is what makes the entry's
          loss-of-function framing safe.
  - name: Unbuffered Fatty Acyl-CoA and Failed Lipid Droplet Partitioning
    biological_scale: CELLULAR
    description: >-
      Without the diphosphatase, fatty acyl-CoA is not cleared in the ER lumen
      and triglyceride is not partitioned normally into cytosolic lipid droplets.
    biological_processes:
      - preferred_term: lipid droplet organization
        term:
          id: GO:0034389
          label: lipid droplet organization
        modifier: DECREASED
    downstream:
      - target: ER Structural Disruption and ER Stress
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          FITM2 and its paralog FITM1 constitute an evolutionary conserved
          protein family involved in partitioning of triglycerides into cellular
          lipid droplets
        explanation: >-
          States the lipid-droplet function whose failure this node represents.
          Graded OTHER because the sentence is background rather than a result
          of the study reporting it.
  - name: ER Structural Disruption and ER Stress
    biological_scale: CELLULAR
    description: >-
      Maintaining optimal fatty acyl-CoA levels is what keeps the ER intact.
      With the diphosphatase gone, ER structure is not maintained and the cell
      is not protected against ER stress.
    biological_processes:
      - preferred_term: response to endoplasmic reticulum stress
        term:
          id: GO:0034976
          label: response to endoplasmic reticulum stress
        modifier: INCREASED
    downstream:
      - target: Injury to Post-Mitotic Metabolically Active Cells
    evidence:
      - reference: PMID:32915949
        reference_title: "FIT2 is an acyl-coenzyme A diphosphatase crucial for endoplasmic reticulum homeostasis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          is required in yeast and mammalian cells for maintaining ER structure,
          protecting against ER stress, and enabling normal lipid storage in
          lipid droplets
        explanation: >-
          Names all three consequences of losing the activity, in cells rather
          than in patients - which is why this node and the one above are graded
          IN_VITRO.
      - reference: PMID:32915949
        reference_title: "FIT2 is an acyl-coenzyme A diphosphatase crucial for endoplasmic reticulum homeostasis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          highlight the maintenance of optimal fatty acyl-CoA levels as key to
          ER homeostasis
        explanation: >-
          States the causal direction the previous node feeds into: the acyl-CoA
          level is the variable, ER homeostasis the outcome.
  - name: Injury to Post-Mitotic Metabolically Active Cells
    biological_scale: TISSUE
    description: >-
      The tissues that fail are the ones that cannot dilute or replace damaged
      ER by dividing, and that carry high metabolic flux: cochlear hair cells,
      central and peripheral neurons, and epidermal keratinocytes.

      This node is an interpretation and is graded to say so. No cited source
      demonstrates ER stress in patient cochlea, neurons or skin. It is the
      account that makes the tissue distribution intelligible, and the
      alternative - that these tissues are affected for an unrelated
      FITM2-dependent reason - is not excluded by anything cited here. The
      knowledge gap below records that.
    cell_types:
      - preferred_term: sensory hair cell
        term:
          id: CL:0000855
          label: sensory hair cell
      - preferred_term: keratinocyte
        term:
          id: CL:0000312
          label: keratinocyte
    downstream:
      - target: phenotypes#Sensorineural Hearing Impairment
      - target: phenotypes#Dystonia
      - target: phenotypes#Developmental Regression
      - target: phenotypes#Motor Delay
      - target: phenotypes#Ichthyosis
      - target: phenotypes#Sensory Neuropathy
      - target: phenotypes#Growth Delay
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a novel deafness-dystonia syndrome with motor regression,
          ichthyosis-like features and signs of sensory neuropathy
        explanation: >-
          Establishes which tissues are clinically affected, which is what the
          node's edges assert. Graded PARTIAL because it does not establish the
          mechanism the node's description offers for why those tissues.

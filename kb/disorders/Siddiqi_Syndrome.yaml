discussions:
  - discussion_id: siddiqi_tissue_selectivity
    kind: KNOWLEDGE_GAP
    prompt: >-
      Given that FITM2 loss demonstrably causes ER stress and organ injury in
      mouse liver and lipodystrophy in mouse adipose tissue, why is the human
      disease a deafness-dystonia syndrome with neither hepatic nor adipose
      involvement?
    attaches_to:
      - pathophysiology#Injury to Post-Mitotic Metabolically Active Cells
      - phenotypes#Absence of Lipodystrophy
    rationale: >-
      This gap was originally written as "is ER stress the mediator at all",
      which the cited evidence no longer leaves open. Hepatocyte-specific
      knockout mice show the full chain in vivo: elevated acyl-CoA, ER stress,
      liver injury. The mechanism is not the question.

      What remains open is selectivity, and the mouse data make it sharper
      rather than softer. Tissue-specific knockouts produce liver injury and
      lipodystrophy - two phenotypes the human disease does not have - while the
      human phenotype falls on cochlea, neurons and skin, which no cited
      knockout has targeted. So the tissues that fail in mouse and in human are
      close to disjoint.

      Two readings are consistent with that and are not distinguished by
      anything cited here: the human tissue pattern reflects a threshold effect,
      with complete loss everywhere sparing tissues that a tissue-specific
      knockout destroys because compensation is possible when only one organ is
      affected; or FITM2 has a cochlear and neuronal requirement that the mouse
      work has simply never probed. The absent lipodystrophy is the strongest
      constraint on any answer, because it is the one tissue where mouse and
      human have been directly compared and they disagree.
  - discussion_id: siddiqi_allelic_dosage_series
    kind: KNOWLEDGE_GAP
    prompt: >-
      Is the FITM2 phenotype a dosage continuum, with near-complete loss giving
      Siddiqi syndrome and partial loss giving hereditary spastic paraplegia?
    attaches_to:
      - pathophysiology#Loss of FITM2 Acyl-CoA Diphosphatase Activity
      - genetic#FITM2
    rationale: >-
      Compound heterozygotes carrying one null and one G100R hypomorphic allele,
      with FIT2 protein at 20% of wild type, have hereditary spastic paraplegia
      rather than Siddiqi syndrome. That is a different disease from the same
      gene at a different residual activity, and it suggests the two are points
      on one dosage curve rather than separate entities.

      The entry does not assert that continuum, because the alternative - that
      G100R has a qualitative property beyond reduced abundance - is not
      excluded by the cited work, and because two families is a thin basis for a
      genotype-phenotype rule. It is recorded as an open question with a
      concrete discriminator: whether other hypomorphic alleles at comparable
      residual activity also give spastic paraplegia rather than deafness and
      dystonia.

      This bears directly on scope. If it is a continuum, the FITM2 spastic
      paraplegia phenotype belongs in this knowledge base as a related entry
      rather than as a subtype here, and the boundary between them is a
      quantitative one.

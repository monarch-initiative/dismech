        label: Global developmental delay
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          combination of sensorineural deafness, progressive dystonia, global
          developmental delay, ichthyosis, and normal imaging
        explanation: >-
          Names global developmental delay as one of the features that together
          identified the syndrome in these siblings.
  - name: Intellectual Disability
    category: Neurologic
    phenotype_term:
      preferred_term: Intellectual disability
      term:
        id: HP:0001249
        label: Intellectual disability
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          often accompanied by additional manifestations such as intellectual
          disability and peripheral neuropathy
        explanation: >-
          Names intellectual disability among the manifestations accompanying
          the core features. The source hedges with "often", which is why no
          frequency band is recorded.
  - name: Sensory Neuropathy
    category: Neurologic
    phenotype_term:
      preferred_term: Sensory neuropathy
      term:
        id: HP:0000763
        label: Sensory neuropathy
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          ichthyosis-like features and signs of sensory neuropathy
        explanation: >-
          Graded PARTIAL for the same reason as ichthyosis - the source reports
          "signs of" sensory neuropathy rather than a confirmed diagnosis.
  - name: Growth Delay
    category: Growth
    phenotype_term:
      preferred_term: Growth delay
      term:
        id: HP:0001510
        label: Growth delay
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Both presented with hallmark features, including early-onset
          sensorineural hearing loss, severe generalized dystonia, growth
          failure, and ichthyosis of the lower limbs
        explanation: >-
          Names growth failure directly. This replaces an earlier citation to
          the ascertainment sentence, which said nothing about growth - a
          PARTIAL grade does not repair a snippet that is about something else.
  - name: Absence of Lipodystrophy
    category: Metabolic
    description: >-
      The negative finding, curated because it is genuinely informative rather
      than merely absent. FITM2 partitions triglyceride into lipid droplets, so
      the prediction from the gene's known function is a lipodystrophy. The
      founding report looked for one and did not find it.

      That dissociation is what pointed the field away from a storage defect and
      towards the ER-homeostasis account that the 2020 enzymology later
      supplied - the disease is not caused by failing to store fat, it is caused
      by failing to clear an intermediate.

      The other half of the dissociation - that an adipose-specific FIT2
      knockout mouse does become lipodystrophic - is carried on the
      "Unbuffered Fatty Acyl-CoA and Failed Lipid Droplet Partitioning"
      pathophysiology node and in the siddiqi_tissue_selectivity discussion,
      deliberately not here. Attaching a SUPPORT-graded item to this record
      would make a term-level query read as though model-organism evidence
      supported lipodystrophy in this disease, which is the opposite of what
      this record asserts.

      Schema note: the Phenotype class has no `presence` slot, unlike Biochemical
      and Genetic, so an explicitly absent finding cannot be marked as absent
      structurally. The absence is carried by this description and by the
      REFUTE grade on the evidence below, which means a query over phenotype
      terms will see Lipodystrophy attached to this disease and cannot tell that
      the entry asserts the opposite. That is a reporting limitation, not a
      curation choice.
    phenotype_term:
      preferred_term: Lipodystrophy
      term:
        id: HP:0009125
        label: Lipodystrophy
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Despite the role of FITM2 in neutral lipid storage and metabolism, no
          indications for lipodystrophy were observed in the affected
          individuals
        explanation: >-
          Graded REFUTE against the presence of lipodystrophy. The authors frame
          it as a contrast with the expectation, which is why it is worth a
          phenotype record rather than a line of prose.
genetic:
  - name: FITM2
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    gene_term:
      preferred_term: FITM2
      term:
        id: hgnc:16135
        label: FITM2
    notes: >-
      Biallelic loss of function. The founding family carried a homozygous
      nonsense variant at codon 2; compound heterozygous genotypes have since
      been reported in unrelated families.

      An allelic dosage series is emerging and is the most interesting genetic
      fact about this gene. Compound heterozygotes carrying one null allele and
      one G100R missense allele, with FIT2 protein reduced to 20% of wild type,
      have hereditary spastic paraplegia rather than Siddiqi syndrome. So the
      same gene gives two different diseases at two different residual
      activities. Whether that is a continuum is recorded as an open question
      rather than asserted, because a qualitative property of G100R beyond
      reduced abundance is not excluded.

      Note this is hgnc:16135. The deep-research report accompanying this entry
      gives HGNC:14929, which is SIRT1. See the top-level notes for why the
      error is recorded rather than silently corrected.
    variants:
      - name: FITM2 alleles reported across the described families
        type: Mixed - nonsense, frameshift and missense
        clinical_significance: PATHOGENIC
        description: >-
          The reported allele catalog, kept as one record because the families
          are individually single cases and the genotype-phenotype claim below
          is made across them rather than within any one. Pakistani founding
          family: homozygous c.4G>T (p.Glu2*). United States: compound
          heterozygous c.39dupC and c.652C>T. Germany: homozygous c.694G>A
          (p.Gly232Arg). China: homozygous c.611_612dupTG (p.Met205fs). Russia:
          homozygous c.452A>G (p.Asp151Gly). Iran: homozygous c.114dupC
          (p.Lys39Glnfs*113).

          This record is also the source for the compound-heterozygote claim
          made in the notes above and in the inheritance block, which was
          previously uncited.
        evidence:
          - reference: PMID:41113320
            reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: "The American case involved compound heterozygous loss\u2010of\u2010function variants (c.39dupC and c.652C>T). A German patient had a homozygous missense variant (c.694G>A, p.Gly232Arg), while the Chinese patient harbored a homozygous frameshift variant (c.611_612dupTG, p.Met205fs)."
            explanation: >-
              The allele catalog across the previously reported families,
              including the compound heterozygous genotype.
          - reference: PMID:41113320
            reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              A novel homozygous frameshift variant was identified in the FITM2
              gene: c.114dupC (p.Lys39Glnfs*113)
            explanation: >-
              The Iranian allele reported by this paper.
      - name: Genotype-phenotype gradient across truncating and missense alleles
        type: Observation across allele classes
        description: >-
          A severity gradient is proposed rather than demonstrated: truncating
          alleles with more severe disease, missense alleles milder. The
          authors state the limitation themselves, and with one or two families
          per allele class it is a pattern in a case-report series rather than a
          correlation. It is recorded because it is the same axis as the G100R
          hypomorph in the notes above - residual FIT2 activity - approached
          from within this disease instead of from the spastic paraplegia end.
        evidence:
          - reference: PMID:41113320
            reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
            supports: PARTIAL
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              In contrast, patients harboring missense variants (e.g.,
              p.Asp151Gly and p.Gly232Arg) may exhibit relatively milder
              phenotypes, although data remain limited
            explanation: >-
              Graded PARTIAL on the authors' own hedge. "May exhibit" and "data
              remain limited" are theirs, and are preserved rather than promoted
              into an asserted correlation.
    inheritance:
      - name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a homozygous nonsense mutation, c.4G>T (p.Glu2*), in FITM2 was
          identified
        explanation: >-
          The founding allele and its consequence.
      - reference: PMID:39974099
        reference_title: "Partial loss of FITM2 function causes hereditary spastic paraplegia."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          In humans, homozygous null mutations in FITM2 are associated with a
          syndrome characterized by deafness and dystonia
        explanation: >-
          Confirms the genotype class for this entry's disease from outside the
          founding report, and does so in a paper describing a different FITM2
          phenotype - which is what makes it useful for the boundary rather than
          only for the diagnosis.
      - reference: PMID:39974099
        reference_title: "Partial loss of FITM2 function causes hereditary spastic paraplegia."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          the G100R allele is hypomorphic, with FIT2 protein levels reduced to
          20% of wild type, leading to proportionately decreased enzyme activity
        explanation: >-
          Quantifies the residual activity that produces spastic paraplegia
          instead of this disease. Graded PARTIAL because it characterises a
          genotype that causes a different disorder - it bounds this entry's
          genotype class from outside rather than evidencing it.
diagnosis:
  - name: Molecular Diagnosis by Exome Sequencing
    description: >-
      Diagnosis is molecular. There is no biochemical marker and no imaging
      finding that identifies the disease - MRI is characteristically normal,
      which is itself part of the diagnostic argument because it excludes the
      leukodystrophies and neurodegeneration with brain iron accumulation that
      the dystonia would otherwise suggest. Exome sequencing was first-tier in
      the most recently reported family, with Sanger confirmation of segregation.
    diagnosis_term:
      preferred_term: whole exome sequencing
      term:
        id: NCIT:C101295
        label: Whole Exome Sequencing
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Sanger sequencing confirmed homozygosity in both affected siblings and
          heterozygosity in both parents, consistent with autosomal recessive
          inheritance
        explanation: >-
          The confirmatory step after exome sequencing, and the evidence that
          the genotype segregates with the phenotype in the family.
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Brain MRI was normal, showing no structural or white matter
          abnormalities
        explanation: >-
          A normal MRI in a child with progressive dystonia is a discriminating
          negative, not an absence of information.
  - name: Auditory Brainstem Response Testing
    description: >-
      The hearing loss is severe, bilateral, sensorineural and present in
      infancy, before behavioural audiometry is informative, so it is
      established by evoked-response testing.
    diagnosis_term:
      preferred_term: auditory brainstem response test
      term:
        id: NCIT:C184949
        label: Auditory Brainstem Response
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          ABR testing confirmed severe bilateral sensorineural hearing loss
        explanation: >-
          The test used to establish the auditory phenotype in both siblings.
differential_diagnoses:
  - name: Dyskinetic cerebral palsy
    description: >-
      The first consideration when perinatal complications are present, and the
      one the diagnosis actually turns on: cerebral palsy is static, and this
      disease is progressive. In the Iranian family the older sibling had a
      complicated delivery and the younger did not, yet both have the same
      progressive course - which is what argued against a static encephalopathy.
    distinguishing_features:
      - Progressive rather than static course
      - Normal brain MRI
      - Recurrence in a sibling with an uneventful perinatal history
  - name: Neurodegeneration with brain iron accumulation
    description: >-
      Considered on the early-onset dystonia. Excluded on imaging.
    distinguishing_features:
      - Basal ganglia iron deposition on MRI, absent here
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          NBIA was considered given the presence of early
        explanation: >-
          Records that the differential was actively considered rather than
          overlooked. The exclusion is on the absence of basal ganglia iron.
  - name: Syndromic ichthyoses
    description: >-
      Refsum disease, Sjogren-Larsson syndrome and Chanarin-Dorfman syndrome all
      pair ichthyosis with neurological disease, which is the combination that
      makes this entry's disease recognisable in the first place.
    distinguishing_features:
      - No retinitis pigmentosa
      - No spasticity or leukoencephalopathy
      - No hepatic involvement or specific biochemical marker
  - name: Leukodystrophies and mitochondrial disorders
    description: >-
      Metachromatic leukodystrophy and Pelizaeus-Merzbacher disease are
      considered on the hypotonia and motor regression; metabolic disorders on
      the developmental failure. All are excluded by normal imaging and normal
      biochemistry.
    distinguishing_features:
      - No white matter abnormality
      - Normal metabolic screen
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Leukodystrophies, mitochondrial disorders, and NBIA were excluded
          based on imaging, biochemical screening, and clinical presentation
        explanation: >-
          States the exclusions and the basis for each.
treatments:
  - name: Supportive Management
    description: >-
      There is no disease-modifying therapy. Reported management is supportive
      and multidisciplinary: nutritional rehabilitation for the growth failure,
      physiotherapy for the dystonia and contractures, dermatologic care for the
      ichthyosis, and audiologic follow-up.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: supportive care
      term:
        id: NCIT:C15747
        label: Supportive Care
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Management for both siblings remained supportive, focusing on
          nutritional rehabilitation, physiotherapy, dermatologic care, and
          audiologic evaluation.
        explanation: >-
          The management actually given, in the only report that states one.
  - name: Cochlear Implantation
    description: >-
      Named by the same authors as an early intervention that may improve
      function, alongside pharmacologic and rehabilitative support for the
      dystonia. It is proposed rather than reported: neither sibling in that
      report is described as having received an implant, and no outcome is
      given. The entry records it as a suggested intervention, not an
      established one.
    therapeutic_modality: DEVICE
    treatment_term:
      preferred_term: cochlear implantation
      term:
        id: NCIT:C15329
        label: Surgical Procedure
    evidence:
      - reference: PMID:41113320
        reference_title: "FITM2-Related Siddiqi Syndrome in Two Iranian Siblings."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          cochlear implantation, pharmacologic and rehabilitative support for
          dystonia, and nutritional management
        explanation: >-
          Graded PARTIAL because the authors write that such interventions "may
          improve functional outcomes", with no patient in the report having
          received one. That hedge is theirs and is preserved.
animal_models:
  - name: Drosophila Fitm (CG10671) RNAi knockdown
    species: Fruit fly
    genotype: RNAi knockdown of CG10671, the single Fitm ortholog
    publication: PMID:28067622
    description: >-
      The fly has one Fitm ortholog where mammals have two paralogs, which makes
      a single knockdown a cleaner test of the pathway than it would be in mouse.
    modeled_mechanisms:
      - target: Injury to Post-Mitotic Metabolically Active Cells
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Knockdown reproduces the locomotor, auditory and sensory components of
          the human syndrome, and was used by the founding study as its
          independent evidence of causality.
        limitations: >-
          Fidelity is MODERATE rather than HIGH for reasons worth naming. It is
          a knockdown rather than a null, so residual activity is likely. Fly
          auditory and sensory organs are not homologous to the mammalian
          cochlea or dorsal root ganglion, so "hearing loss" and "disturbed
          sensory function" are analogous rather than equivalent readouts. And
          the model was not used to test the ER-stress mechanism this entry
          proposes - it establishes that the gene matters, not why.
        evidence:
          - reference: PMID:28067622
            reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Characteristics of the syndrome, including progressive locomotor
              impairment, hearing loss and disturbed sensory functions, were
              recapitulated in Drosophila
            explanation: >-
              Names the three recapitulated features that justify the
              RECAPITULATES relationship.

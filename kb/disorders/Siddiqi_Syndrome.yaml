        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          a homozygous nonsense mutation, c.4G>T (p.Glu2*), in FITM2 was
          identified
        explanation: >-
          The founding allele and its consequence.
animal_models:
  - name: Drosophila Fitm (CG10671) RNAi knockdown
    species: Fruit fly
    genotype: RNAi knockdown of CG10671, the single Fitm ortholog
    publication: PMID:28067622
    description: >-
      The fly has one Fitm ortholog where mammals have two paralogs, which makes
      a single knockdown a cleaner test of the pathway than it would be in mouse.
    modeled_mechanisms:
      - target: Injury to Post-Mitotic Metabolically Active Cells
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Knockdown reproduces the locomotor, auditory and sensory components of
          the human syndrome, and was used by the founding study as its
          independent evidence of causality.
        limitations: >-
          Fidelity is MODERATE rather than HIGH for reasons worth naming. It is
          a knockdown rather than a null, so residual activity is likely. Fly
          auditory and sensory organs are not homologous to the mammalian
          cochlea or dorsal root ganglion, so "hearing loss" and "disturbed
          sensory function" are analogous rather than equivalent readouts. And
          the model was not used to test the ER-stress mechanism this entry
          proposes - it establishes that the gene matters, not why.
        evidence:
          - reference: PMID:28067622
            reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              Characteristics of the syndrome, including progressive locomotor
              impairment, hearing loss and disturbed sensory functions, were
              recapitulated in Drosophila
            explanation: >-
              Names the three recapitulated features that justify the
              RECAPITULATES relationship.
prevalence:
  - population: Published cases worldwide
    measure_type: CASES_IN_LITERATURE
    prevalence_class: ULTRA_RARE
    notes: >-
      Defined in 2017 in a single consanguineous Pakistani family, with a small
      number of additional families reported since. No point prevalence has been
      estimated. Recorded as a case count rather than a rate because there is no
      denominator.
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A consanguineous family from Pakistan was ascertained to have a novel
          deafness-dystonia syndrome
        explanation: >-
          The founding report, establishing that the disease entered the
          literature as a single family.
discussions:
  - discussion_id: siddiqi_tissue_selectivity
    kind: KNOWLEDGE_GAP
    prompt: >-
      Is ER stress the actual mediator of cochlear, neuronal and epidermal
      injury in FITM2 deficiency, and does it explain why those tissues are
      affected while adipose tissue is spared?
    attaches_to:
      - pathophysiology#Injury to Post-Mitotic Metabolically Active Cells
      - phenotypes#Absence of Lipodystrophy
    rationale: >-
      The ER-stress account is coherent and is supported in cultured cells, but
      no cited work demonstrates ER stress in patient cochlea, neurons or skin.
      The tissue-selectivity argument - that post-mitotic, high-flux cells cannot
      dilute damaged ER by dividing - is an interpretation this entry offers, not
      a finding it cites.

      The absent lipodystrophy sharpens the question rather than answering it. If
      the pathogenic event were failure of lipid storage, adipose tissue should
      be the first casualty and is instead spared. Any mechanism proposed for
      this disease has to explain that inversion, and the ER-clearance account
      does so only informally.

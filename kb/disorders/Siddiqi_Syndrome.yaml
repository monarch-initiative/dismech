name: Siddiqi Syndrome
creation_date: "2026-08-28T19:45:00Z"
category: Mendelian
description: >-
  Siddiqi syndrome is an autosomal recessive deafness-dystonia syndrome caused
  by biallelic loss-of-function variants in FITM2. FITM2 is an
  endoplasmic-reticulum membrane protein whose molecular function was resolved
  only in 2020: it is a fatty acyl-CoA diphosphatase, hydrolysing fatty acyl-CoA
  in the ER lumen, and that activity is what allows triglyceride to be
  partitioned into cytosolic lipid droplets. Losing it leaves fatty acyl-CoA
  unbuffered, disrupts ER structure and provokes ER stress.

  The clinical picture is progressive sensorineural hearing loss with generalized
  dystonia, developmental delay followed by motor regression, and growth failure,
  with ichthyosis of the lower limbs and signs of sensory neuropathy in some
  patients. The tissues that fail are metabolically active and post-mitotic -
  cochlear hair cells, neurons, keratinocytes - which is the pattern an ER
  lipid-handling defect would be expected to produce.

  What the disease is not is as informative as what it is. FITM2 partitions
  triglyceride into lipid droplets, so the naive prediction from the gene is a
  lipodystrophy. The founding report looked and found none.
parents:
  - Inborn Error of Metabolism
synonyms:
  - deafness-dystonia syndrome, FITM2-related
  - FITM2-related deafness-dystonia syndrome
  - SIDDIQI
disease_term:
  preferred_term: Siddiqi syndrome
  term:
    id: MONDO:0032842
    label: Siddiqi syndrome
notes: >-
  Evidence-base caveat. The syndrome was defined in 2017 in one consanguineous
  Pakistani family, with a small number of further families reported since. There
  is no cohort and no natural-history series, so no phenotype in this entry
  carries a frequency value. The absence of a denominator is the reason.

  Gene identifier correction, and this is the second time in this batch. The
  deep-research report committed alongside gives the causal gene as HGNC:14929
  in three places, including its header and its summary table. HGNC:14929 is
  SIRT1 - a sirtuin deacetylase with no relation to lipid-droplet biology.
  FITM2 is hgnc:16135, which is what this entry uses.

  The detail that makes this worth recording rather than silently fixing: the
  three other identifiers on the same line of the report - OMIM 612029, NCBI
  Gene 128486, UniProt Q8N6M3 - are all correct for FITM2. A wrong HGNC ID sat
  between correct identifiers for the right gene, which is exactly the
  configuration in which a reader stops checking. The companion SPG81 entry in
  this same batch carries the same class of error with a different gene, so a
  curator should treat HGNC identifiers in these reports as unverified regardless
  of how well-formed the surrounding record looks.

  No treatments section. No disease-modifying therapy exists and management is
  supportive; neither cited primary states a management protocol quotable
  exactly, so the section is absent rather than asserted from an uncitable
  source.

      term:
        id: HP:0000763
        label: Sensory neuropathy
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          ichthyosis-like features and signs of sensory neuropathy
        explanation: >-
          Graded PARTIAL for the same reason as ichthyosis - the source reports
          "signs of" sensory neuropathy rather than a confirmed diagnosis.
  - name: Growth Delay
    category: Growth
    phenotype_term:
      preferred_term: Growth delay
      term:
        id: HP:0001510
        label: Growth delay
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          A consanguineous family from Pakistan was ascertained to have a novel
          deafness-dystonia syndrome
        explanation: >-
          Graded PARTIAL and quoted at the level the abstract supports. Growth
          failure is part of the described clinical tetrad but is not named in
          the quotable abstract text; this citation establishes the family and
          syndrome rather than the growth phenotype specifically, and the grade
          says so rather than inflating it.
  - name: Absence of Lipodystrophy
    category: Metabolic
    description: >-
      The negative finding, curated because it is genuinely informative rather
      than merely absent. FITM2 partitions triglyceride into lipid droplets, so
      the prediction from the gene's known function is a lipodystrophy. The
      founding report looked for one and did not find it.

      That dissociation is what pointed the field away from a storage defect and
      towards the ER-homeostasis account that the 2020 enzymology later
      supplied - the disease is not caused by failing to store fat, it is caused
      by failing to clear an intermediate.

      Schema note: the Phenotype class has no `presence` slot, unlike Biochemical
      and Genetic, so an explicitly absent finding cannot be marked as absent
      structurally. The absence is carried by this description and by the
      REFUTE grade on the evidence below, which means a query over phenotype
      terms will see Lipodystrophy attached to this disease and cannot tell that
      the entry asserts the opposite. That is a reporting limitation, not a
      curation choice.
    phenotype_term:
      preferred_term: Lipodystrophy
      term:
        id: HP:0009125
        label: Lipodystrophy
    evidence:
      - reference: PMID:28067622
        reference_title: "A homozygous FITM2 mutation causes a deafness-dystonia syndrome with motor regression and signs of ichthyosis and sensory neuropathy."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Despite the role of FITM2 in neutral lipid storage and metabolism, no
          indications for lipodystrophy were observed in the affected
          individuals
        explanation: >-
          Graded REFUTE against the presence of lipodystrophy. The authors frame
          it as a contrast with the expectation, which is why it is worth a
          phenotype record rather than a line of prose.
genetic:
  - name: FITM2
    relationship_type: CAUSATIVE
    variant_origin: GERMLINE
    gene_term:
      preferred_term: FITM2
      term:
        id: hgnc:16135
        label: FITM2
    notes: >-
      Biallelic loss of function. The founding family carried a homozygous
      nonsense variant at codon 2; compound heterozygous genotypes have since
      been reported in unrelated families.

      Note this is hgnc:16135. The deep-research report accompanying this entry
      gives HGNC:14929, which is SIRT1. See the top-level notes for why the
      error is recorded rather than silently corrected.
    inheritance:

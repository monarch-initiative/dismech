    explanation: The 2024 cohort introduction reports a low-risk newborn prevalence range from the cited screening literature.
progression:
- phase: Congenital or early-onset ANSD
  age_range: Neonatal period through childhood
  notes: >-
    Congenital ANSD can disrupt speech and language acquisition during a
    sensitive developmental period. OTOF-related disease is predominantly
    infant-onset in the largest cited genetic cohort.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital AN affects the development of language, an ability that is strictly related to the existence of a sensitive period declining with age"
    explanation: Supports the developmental consequence of congenital onset.
- phase: Delayed-onset or progressive ANSD
  age_range: Childhood through adulthood
  notes: >-
    Acquired and some genetic forms begin after language acquisition; course may
    be progressive and may include later loss of previously preserved OAEs.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the onset of AN is delayed to childhood or adult life (acquired AN), abnormalities of auditory input lead to severe impairment of speech perception and progressive deterioration of acquired language skills"
    explanation: Supports delayed onset and progressive functional deterioration.

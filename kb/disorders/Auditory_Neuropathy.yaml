diagnosis:
- name: Audiologic Electrophysiology
  description: >-
    Diagnosis depends on demonstrating preserved OAE or cochlear microphonics
    with absent or abnormal ABR, alongside behavioral speech perception testing
    when developmentally possible.
  results: Present OAE or cochlear microphonics with absent/abnormal ABR supports ANSD.
  evidence:
  - reference: PMID:38016438
    reference_title: "Cochlear Implantation in Children with Auditory Neuropathy: Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its diagnosis is based on presence of otoacoustic emissions and lack of, or abnormal, brainstem auditory evoked potential."
    explanation: Supports the diagnostic electrophysiology pattern.
- name: Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing panels, exome sequencing, or genome sequencing help identify
    causal genes and localize lesion site, especially in infant, bilateral, or
    familial cases.
  results: Pathogenic or likely pathogenic variants in ANSD genes support molecular diagnosis.
  evidence:
  - reference: PMID:38456936
    reference_title: Clinical and genetic architecture of a large cohort with auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a retrospective cohort of 311 patients with AN, pathogenic and likely pathogenic variants of 23 genes were identified in 98 patients (31.5% in 311 patients)"
    explanation: Supports molecular testing yield in a large AN cohort.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Molecular genetic testing is the standard of care in evaluation of individuals with hearing loss."
    explanation: GeneReviews establishes genetic testing as standard evaluation for hearing loss; the ANSD-specific cohort quantifies yield.
- name: Lesion-Site Assessment
  description: >-
    Speech-in-noise testing, electrocochleography, electrically evoked compound
    action potentials, and internal-auditory-canal MRI can refine localization
    beyond the core OAE/CM-versus-ABR pattern. No single ancillary test reliably
    localizes every ANSD lesion.
  results: >-
    Preserved receptor potentials with abnormal neural potentials support a
    synaptic or auditory-nerve lesion; MRI may reveal cochlear nerve deficiency.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no detailed information of cochlear nerve and hair-cell activities can be provided"
    explanation: Supports the limitation of ABR alone and the need for complementary lesion-site testing.
differential_diagnoses:
- name: Cochlear sensorineural hearing loss
  description: >-
    Conventional cochlear hearing loss may also produce elevated thresholds and
    poor speech perception, but lacks the characteristic dissociation between
    preserved outer-hair-cell responses and absent or severely abnormal ABR.
  distinguishing_features:
  - Conventional cochlear loss does not show the defining preserved outer-hair-cell response with absent or severely abnormal ABR.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected subjects show impairment of speech perception beyond that expected for the hearing loss, abnormality of auditory brainstem potentials and preserved outer hair-cell activities."
    explanation: Defines the physiologic dissociation that distinguishes ANSD from conventional cochlear sensorineural loss.
- name: Cochlear nerve deficiency
  description: >-
    Cochlear nerve hypoplasia or aplasia can produce an ANSD-like physiologic
    pattern and predicts poorer cochlear-implant outcomes; dedicated MRI helps
    distinguish this structural cause and informs rehabilitation.
  distinguishing_features:
  - Internal-auditory-canal MRI demonstrates cochlear nerve hypoplasia or aplasia.
  - Cochlear nerve deficiency predicts significantly poorer post-implant speech outcomes.
  evidence:
  - reference: PMID:38027523
    reference_title: Outcomes of cochlear implantation in 75 patients with auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Speech outcomes of CI in cases with cochlear nerve (CN) deficiency were significantly poorer (p = 0.008)."
    explanation: Supports cochlear nerve deficiency as an imaging-defined outcome modifier requiring separate recognition.
- name: Central auditory processing disorder
  description: >-
    Speech-in-noise difficulty can overlap, but central auditory processing
    disorder does not require the peripheral electrophysiologic OAE/CM–ABR
    dissociation that defines ANSD.
  distinguishing_features:
  - A preserved-OAE with absent-or-abnormal-ABR pattern favors ANSD rather than a purely central processing disorder.
  evidence:
  - reference: PMID:38016438
    reference_title: "Cochlear Implantation in Children with Auditory Neuropathy: Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its diagnosis is based on presence of otoacoustic emissions and lack of, or abnormal, brainstem auditory evoked potential."
    explanation: Establishes the peripheral electrophysiologic pattern used to distinguish ANSD from central processing presentations.
- name: Syndromic peripheral neuropathies
  description: >-
    Charcot-Marie-Tooth disease, Friedreich ataxia, OPA1-related dominant optic
    atrophy plus, CAPOS syndrome, and riboflavin-transporter deficiency can
    include auditory neuropathy; neurologic, ophthalmologic, metabolic, and
    molecular findings distinguish the underlying syndrome.
  distinguishing_features:
  - Peripheral sensory findings, optic or vestibular abnormalities, motor features, and systemic findings favor a syndromic neuropathy.
  - Gene-directed testing distinguishes AIFM1, OPA1, ATP1A3, and other syndromic causes.
  evidence:
  - reference: PMID:25986071
    reference_title: Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype associated with the AUNX1-causing AIFM1 p.R451Q mutation is characterised by childhood-onset ANSD and delayed peripheral sensory neuropathy presenting as extremity numbness, unsteadiness and areflexia."
    explanation: Demonstrates the delayed neurologic findings that distinguish an AIFM1 syndromic subset from isolated ANSD.
environmental:
- name: Acquired non-genetic etiologies
  presence: Positive
  description: >-
    Infections, toxic-metabolite injury, and immune-mediated injury can cause
    acquired ANSD. These etiologies must be assessed clinically and should not
    be inferred from the genetic content of this umbrella record.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both the congenital and acquired forms of AN can be due to genetic disorders or can have a wide range of other etiologies (for example, infections, toxic metabolite damage or immunological damage)"
    explanation: Directly establishes acquired and non-genetic etiologic categories for ANSD.
treatments:
- name: Hearing Aid Use
  description: >-
    Hearing aids may be trialed as part of hearing rehabilitation, but benefit
    is variable because ANSD primarily disrupts neural timing and speech
    perception.
  therapeutic_modality: DEVICE
  treatment_term:

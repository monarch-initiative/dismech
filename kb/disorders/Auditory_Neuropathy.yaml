prevalence:
- population: Low-risk newborn population
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_low: 6.0
  rate_high: 39.0
  rate_per_100000: 22.5
  notes: >-
    This range is reported for low-risk newborns and should not be conflated
    with the much larger proportion of ANSD among selected hearing-loss cohorts.
    Its 6-39 per 100,000 range crosses the boundary between
    BAND_1_9_PER_100000 and BAND_1_5_PER_10000; the latter is retained because
    it contains most of the reported interval, while the numeric bounds remain
    the primary representation.
  evidence:
  - reference: PMID:38456936
    reference_title: Clinical and genetic architecture of a large cohort with auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

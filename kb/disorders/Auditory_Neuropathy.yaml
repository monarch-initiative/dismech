experimental_models:
- name: Otoferlin-Deficient Mouse Models
  description: >-
    Otof-deficient mice model impaired inner-hair-cell ribbon-synapse maturation
    and later synapse, spiral-ganglion-neuron, and hair-cell loss. They establish
    presynaptic biology and a treatment-testing platform, but do not reproduce
    the full etiologic and perceptual heterogeneity of human ANSD.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:34335185
  modeled_mechanisms:
  - target: Presynaptic Inner Hair Cell Synaptopathy
    description: Models loss of otoferlin-dependent synapse maturation and maintenance.
    evidence:
    - reference: PMID:34335185
      reference_title: Otoferlin Is Required for Proper Synapse Maturation and for Maintenance of Inner and Outer Hair Cells in Mouse Models for DFNB9.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In absence of otoferlin, synaptic pruning was delayed, and postsynaptic boutons appeared enlarged at 2 weeks of age."
      explanation: Directly supports the modeled synaptic-maturation defect.
- name: AIFM1 Patient-iPSC Neuron Model
  description: >-
    Patient-derived neurons model impaired AIF-CHCHD4 interaction,
    mitochondrial calcium overload, energetic stress, and oxidative injury.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:37365177
  modeled_mechanisms:
  - target: AIFM1-Associated Mitochondrial Neuronal Injury
    description: Models mitochondrial dysfunction in patient-derived neurons.
    evidence:
    - reference: PMID:37365177
      reference_title: Impaired AIF-CHCHD4 interaction and mitochondrial calcium overload contribute to auditory neuropathy spectrum disorder in patient-iPSC-derived neurons with AIFM1 variant.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mitochondrial dysfunction, especially mCa2+ overload, plays a prominent role in ANSD associated with AIFM1."
      explanation: Directly supports fidelity to the curated AIFM1 cellular mechanism.
discussions:
- discussion_id: gap_ansd_lesion_localization_and_prognosis
  prompt: >-
    Which combination of electrophysiology, imaging, genotype, and functional
    testing can localize an individual ANSD lesion well enough to predict
    hearing-aid, cochlear-implant, and gene-therapy outcomes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Lesion-Site Spectrum
  rationale: >-
    ANSD is defined by a shared physiologic pattern rather than one lesion. ABR
    alone has limited localization, cochlear nerve deficiency predicts worse CI
    performance, and therapy response differs between presynaptic and diffuse
    neural lesions.
  evidence:
  - reference: PMID:21176122
    reference_title: Information from cochlear potentials and genetic mutations helps localize the lesion site in auditory neuropathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the outcome of cochlear implantation varies widely among patients."
    explanation: Establishes the clinically important outcome heterogeneity motivating individualized lesion localization.
- discussion_id: gap_otof_gene_therapy_durability_and_function
  prompt: >-
    How durable and complete is OTOF gene-therapy benefit across age, genotype,
    bilateral treatment, speech-in-noise performance, and long-term safety?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Presynaptic Inner Hair Cell Synaptopathy
  rationale: >-
    Registrational and multicentre trials show substantial hearing recovery, but
    follow-up is still short relative to a lifetime and response is incomplete
    in some patients. Accelerated approval therefore does not resolve durability,
    functional-language, or generalizability questions.
  evidence:
  - reference: PMID:42020731
    reference_title: Multicentre gene therapy for OTOF-related deafness followed up to 2.5 years.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Participants aged 0.5-18 years showed greater hearing improvement than adults."
    explanation: Demonstrates age-related response heterogeneity requiring longer and stratified follow-up.
  - reference: PMID:42037272
    reference_title: Transient disappearance of otoacoustic emissions after conventional hearing aid use in OTOF-related auditory neuropathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The reversible OAE loss observed after amplification raises concerns regarding possible cochlear overstimulation."
    explanation: A two-child series identifies a preliminary rehabilitation-safety question relevant to preserving cochlear structures for gene therapy.
notes: >-
  Publication-readiness review updated the evidence horizon through 2026-08-05.
  Reported ANSD frequencies of roughly 1%-10% are proportions within selected
  hearing-loss populations and are not population prevalence; the separate
  0.006%-0.039% low-risk-newborn estimate is encoded with its source population.
  The umbrella record deliberately distinguishes genetic ANSD from acquired
  causes and avoids projecting gene-specific syndromic features across all ANSD.
review_notes: >-
  D2P audit disposition (2026-08-05): accepted HP:0004463 absent brainstem
  auditory responses in place of the broader local evoked-potential term;
  accepted HP:0000407 sensorineural hearing impairment in place of generic
  hearing impairment. Accepted HP:0001284 areflexia, HP:0034585 cochlear nerve
  hypoplasia, HP:0002936 distal sensory impairment, and HP:0002317 unsteady gait
  with explicit AUNX1 subtype scope. Deferred HP:0008529 absence of acoustic reflex and
  HP:0004454 abnormal middle-ear reflexes because the current cache-backed
  sources do not provide a clean disease-wide exact claim. Rejected HP:0000545
  myopia and HP:0000360 tinnitus because no exact cache-backed statement supports
  them, and HP:0003390 sensory axonal neuropathy because PMID:25986071 instead
  interprets the reported nerve-conduction findings as possible demyelination;
  subtype scoping does not cure those evidence mismatches. The four accepted
  AUNX1 neurologic/structural phenotypes remain intentionally unlinked in the
  pathograph because PMID:25986071 establishes subtype co-occurrence but not a
  sufficiently atomic causal route from the modeled mitochondrial injury to
  each finding. No unsupported causal edges were added solely to improve
  pathograph connectivity. The preserved-OAE/CM
  phenotype remains intentionally without a causal in-edge because it represents
  spared outer-hair-cell function, not a downstream pathological consequence.
  Pull request 8011 automated-review disposition (2026-08-05): all six important findings
  were addressed. GeneReviews PMID:20301607 is tagged and its current NBK1434
  text is mined across clinical characteristics, diagnosis, management, and
  genetic counseling; DFNB9 and AUNX1 are modeled; previously unconsumed OTOF
  and AIFM1 references now support those subtypes; every top-level and gene-level
  inheritance assertion is HPO-bound; all differentials now have distinguishing
  features and evidence. The orphaned AIFM1 and TMEM43 mechanisms were reconnected
  to Hearing Impairment using narrower source-supported edges, rather than
  restoring unsupported Poor Speech Perception edges. Nonblocking suggestions:
  the absence-specific ABR HPO assertion was clarified while the broader
  absent-or-abnormal diagnostic criterion remains prose-backed; the otoferlin
  evidence explanation explicitly resolves "this protein"; rehabilitation
  wording was softened and supplemented with GeneReviews; ClinicalTrials.gov
  was rechecked on 2026-08-05 (NCT05788536 remains registry phase 1 and recruiting,
  while NCT06696456 is enrolling by invitation); low-risk-newborn prevalence,
  acquired non-genetic etiologies, an OTOF case fraction, and an explicit
  preserved-OAE/CM ontology-gap note were added. PRPS1 was not added because the
  cited review explicitly reports no auditory neuropathy in DFN2, so its broader
  hearing-loss association does not justify an ANSD edge. Otarmeni/DB-OTO was
  separated from the distinct investigational AAV1-hOTOF program and both now
  carry named therapeutic agents. The follow-up review's required prevalence
  correction replaced the deprecated percentage slot with structured per-100,000
  bounds and midpoint; the cross-band classification is documented. Both PMID
  and URL forms of GeneReviews are declared and tagged, the ABR phenotype name
  now matches its absence-specific HPO binding, and the CHORD phase-enum
  approximation is explicit. The acquired etiologies remain one unbound entry
  because the cited claim groups heterogeneous causal categories rather than one
  ontology-ready exposure. Exact-label NCIT OAK searches for lunsotogene
  parvec-cwha and AAV1-hOTOF returned no match, so no speculative bindings for
  therapeutic agents were assigned. The deprecated updated_date bump was reverted.

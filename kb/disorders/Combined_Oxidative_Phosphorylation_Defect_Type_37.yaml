experimental_models:

- name: Patient-derived fibroblasts with lentiviral MICOS13 rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from the second patient, used both to characterise the defect and, with a
    wild-type MICOS13 cDNA restored by lentivirus, to test causation.

    This is the experiment that makes the entry's central causal claim more than an
    association. Complementation in the patient's own cells controls for genetic
    background in a way that no comparison with unrelated controls can.
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Restoring MICOS13 restores respiratory chain complex activity in the patient's own
      cells.
    limitations: >-
      Fibroblasts are not the affected tissue. The disease's burden is in brain and liver,
      and the rescue says nothing about whether restoring MICOS13 in those organs, or at a
      clinically reachable time point, would help.
    readouts:
    - name: Mitochondrial respiratory chain complex activity after wild-type MICOS13 expression
      target: Combined Respiratory Chain Deficiency
      direction: RESTORED
      interpretation: >-
        Restoration on complementation establishes that the absence of MICOS13 is the
        cause of the respiratory deficiency, not a bystander.
      evidence:
      - reference: PMID:32749073
        reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Stable expression of a wild-type MICOS13 cDNA in the patients fibroblasts using a
          lentivirus system rescued mitochondrial respiratory chain complex deficiencies.
        explanation: >-
          The rescue result.
  - target: Failure of MICOS Complex Assembly
    relationship: MEASURES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      The system in which protein loss and reduced cristae number were demonstrated.
    limitations: >-
      Cristae number here was assessed in fibroblasts rather than in an affected organ. The
      founding report does document abnormal cristae morphology in patient liver, so the
      architectural lesion is not purely inferred - but no patient brain ultrastructure has
      been reported, and that is where most of the disease burden is.
    readouts:
    - name: MICOS13 protein level and cristae number in patient fibroblast mitochondria
      target: Failure of MICOS Complex Assembly
      direction: DECREASED
      interpretation: >-
        Absent protein with reduced cristae is the architectural lesion, measured directly.
      evidence:
      - reference: PMID:32749073
        reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          We found loss of MICOS13 protein and fewer cristae structures in the mitochondria
          of fibroblasts derived from the patient.
        explanation: >-
          The measurement.
  evidence:
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found loss of MICOS13 protein and fewer cristae structures in the mitochondria of
      fibroblasts derived from the patient.
    explanation: >-
      Establishes that the patient's fibroblasts carry the molecular and structural defect,
      which is what makes them an informative model of it.

diagnosis:

- name: Respiratory Chain Enzymology in Liver and Muscle
  description: >-
    A combined deficiency across multiple complexes, rather than isolation of one, is the
    pattern that points away from a complex-specific subunit or assembly-factor defect and
    towards a problem in the membrane itself.
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In liver and muscle tissue, the activity of the respiratory chain complexes (OXPHOS)
      was severely impaired.
    explanation: >-
      The assay and the tissues in which it was informative.

- name: Mitochondrial Ultrastructure on Electron Microscopy
  description: >-
    Loss of cristae junctions with aberrant cristae is the morphological signature of a
    MICOS defect and is what distinguishes this disease from the many mitochondrial
    disorders with normal architecture.
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      resulting in aberrant cristae structure and a loss of cristae junctions and contact
      sites.
    explanation: >-
      The finding this test looks for.

- name: Urine Organic Acid Analysis for 3-Methylglutaconic Aciduria
  description: >-
    The cheapest discriminating test, and the one that points at the right mechanism class.

    A combined respiratory chain deficiency is compatible with dozens of genes. 3-MGA
    alongside it narrows the field to the inner-membrane organizing disorders, because
    across a 977-patient series 3-MGA tracked with ATPase-related disease and with mtDNA
    depletion and specifically *not* with isolated respiratory chain complex deficiencies.
  evidence:
  - reference: PMID:23355087
    reference_title: "3-Methylglutaconic aciduria--lessons from 50 genes and 977 patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was more frequently seen in ATPase related disorders, with mitochondrial DNA
      depletion or deletion, but not in patients with single respiratory chain complex
      deficiencies.
    explanation: >-
      The discriminating pattern this test exploits. INDIRECT because the series is of
      mitochondrial disease generally, not of MICOS13 patients.
  - reference: PMID:27485409
    reference_title: "Mitochondrial hepato-encephalopathy due to deficiency of QIL1/MIC13 (C19orf70), a MICOS complex subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3-Methylglutaconic aciduria is associated with variants in genes encoding
      mitochondrial inner membrane organizing determinants, including TAZ, DNAJC19, SERAC1
      and QIL1/MIC13.
    explanation: >-
      Places this gene explicitly in the class the test identifies.


name: Combined Oxidative Phosphorylation Defect Type 37
creation_date: "2026-09-11T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: combined oxidative phosphorylation deficiency 37
  term:
    id: MONDO:0032679
    label: combined oxidative phosphorylation deficiency 37
synonyms:
- COXPD37
- MICOS13 deficiency
- QIL1 deficiency
- MIC13 deficiency
- C19orf70-related mitochondrial hepato-encephalopathy
description: >-
  An infantile mitochondrial hepato-encephalopathy caused by biallelic loss of MICOS13
  (also called QIL1, MIC13 or C19orf70), a small subunit of the mitochondrial contact site
  and cristae organising system. Patients present with encephalopathy, liver disease,
  lactic acidosis and severe psychomotor impairment.

  The mechanistic interest of this disease is that the lesion is architectural rather than
  enzymatic. Nothing is wrong with any respiratory chain complex's subunits. What fails is
  the shape of the membrane those complexes sit in: without MICOS13 the MICOS complex
  cannot be assembled, cristae junctions are lost, and the inner membrane loses the
  folded, compartmentalised geometry that oxidative phosphorylation depends on. The
  combined respiratory chain deficiency that gives the disease its name is a downstream
  consequence of that collapse.

  Two further points shaped the curation.

  The first is that MICOS13's role is specifically assembly, not structure. It is required
  to build and maintain the complex, and its loss takes a defined subcomplex
  (MIC10-MIC26-MIC27-QIL1) with it rather than degrading MICOS uniformly. That is a
  sharper claim than "MICOS is disrupted" and the entry records it as such.

  The second is that the two published patients were classified differently from each
  other - one as a combined OXPHOS deficiency, the other as a mitochondrial DNA depletion
  syndrome - on the strength of what each group happened to measure. The entry curates
  both findings and records the classification question rather than resolving it, since
  only one of the two reports assayed mtDNA copy number at all.

parents:
- Mitochondrial Disease

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    At least five patients in four reports: a consanguineous sibling pair (Israel, the
    founding report), a German patient, a Japanese patient, and a Tunisian patient. All
    consanguineous or homozygous. No prevalence estimate exists.
  evidence:
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole-exome sequencing of a patient presenting with hepato-encephalopathy and MTDPS
      identified a novel homozygous frameshift variant, c.13_29del (p.Trp6Profs*71) in
      MICOS13
    explanation: >-
      The second of the two reported patients, establishing the disease is not a
      single-family observation.

pathophysiology:

- name: Biallelic MICOS13 Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Several reported alleles, all loss of function and all removing the protein rather
    than altering it. The gene is small and every reported variant truncates it.

    The founding allele is the homozygous frameshift p.(Gly15Glufs*75), in a
    consanguineous brother and sister. Later reports add a splice-site variant in
    C19orf70, the homozygous frameshift c.13_29del (p.Trp6Profs*71) which truncates within
    the first ten residues, and c.209dupT (p.Ala73Argfs*32), which removes the second
    RDSWN motif required for MIC13 function.

    Fibroblasts from the c.13_29del patient have no detectable MICOS13, so these are true
    nulls rather than hypomorphs.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A novel mutation of an essential splice site in the C19orf70 gene encoding QIL1
      induces severe mitochondrial encephalopathy, hepatopathy and lactate acidosis
      consistent with psychomotor retardation.
    explanation: >-
      The German allele and the syndrome it produced.
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole-exome sequencing of a patient presenting with hepato-encephalopathy and MTDPS
      identified a novel homozygous frameshift variant, c.13_29del (p.Trp6Profs*71) in
      MICOS13
    explanation: >-
      The Japanese allele, in an unrelated patient.
  - reference: PMID:27485409
    reference_title: "Mitochondrial hepato-encephalopathy due to deficiency of QIL1/MIC13 (C19orf70), a MICOS complex subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using homozygosity mapping and exome sequencing the patients were found to be
      homozygous for the p.(Gly15Glufs*75) variant in the QIL1/MIC13 (C19orf70) gene.
    explanation: >-
      The founding allele and the report that first established this gene-disease
      relationship.
  - reference: PMID:42033541
    reference_title: "A novel homozygous MICOS13 frameshift mutation causing mitochondrial hepatoencephalopathy and mtDNA depletion: clinical characterization and dynamic structural simulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant introduces a premature termination codon, leading to a truncated protein
      that lacks the second RDSWN motif, which is critical for MIC13 function.
    explanation: >-
      A fourth allele, and the one report that identifies which part of the protein the
      truncation removes rather than only that it truncates.
  downstream:
  - target: Failure of MICOS Complex Assembly
    causal_link_type: DIRECT
    description: >-
      MICOS13 is required to assemble the complex, so losing it prevents assembly.

- name: Failure of MICOS Complex Assembly
  role: mechanism
  biological_scale: MOLECULAR
  description: >-
    MICOS13 is a small subunit whose job is to build and hold together the rest of the
    complex. Its loss is therefore not the loss of one component among seven: a defined
    subcomplex comprising MIC10, MIC26, MIC27 and QIL1 fails to form.

    In the Japanese patient the protein was directly shown to be absent from fibroblast
    mitochondria, so the assembly failure follows from protein loss rather than from a
    hypomorphic variant with residual function.

    The founding report makes the selectivity sharper still. In those patients' fibroblasts
    both MIC13 and MIC10 were absent while MIC60 was present at normal abundance. MIC60 is
    the core of the other MICOS subcomplex, so what fails is one arm of the complex rather
    than the complex as a whole - which is a more specific claim than "MICOS is disrupted"
    and is consistent with the MIC10-MIC26-MIC27-QIL1 subcomplex loss reported
    independently.
  cellular_components:
  - preferred_term: MICOS complex
    term:
      id: GO:0061617
      label: MICOS complex
    modifier: ABSENT
  biological_processes:
  - preferred_term: cristae formation
    term:
      id: GO:0042407
      label: cristae formation
    modifier: DECREASED
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disassembly of MICOS complex subunits displays lack of MIC10-MIC26-MIC27-QIL1
      subcomplex, resulting in aberrant cristae structure and a loss of cristae junctions
      and contact sites.
    explanation: >-
      Names the specific subcomplex that is lost, which is the precise form of the
      assembly claim and is what distinguishes it from a general statement that MICOS is
      disrupted.
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found loss of MICOS13 protein and fewer cristae structures in the mitochondria of
      fibroblasts derived from the patient.
    explanation: >-
      Independent confirmation in a second patient's cells, and the direct demonstration
      that the protein itself is absent.
  - reference: PMID:27485409
    reference_title: "Mitochondrial hepato-encephalopathy due to deficiency of QIL1/MIC13 (C19orf70), a MICOS complex subunit."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In patient fibroblasts both MICOS subunits QIL1/MIC13 and MIC10 were absent whereas
      MIC60 was present in a comparable abundance to that of the control.
    explanation: >-
      Establishes that the assembly failure is selective: one MICOS arm collapses while the
      MIC60 core is retained. The preserved MIC60 is what makes this a partial complex
      rather than an absent one.
  downstream:
  - target: Loss of Cristae Junctions and Inner Membrane Contact Sites
    causal_link_type: DIRECT
    description: >-
      The subcomplex that fails to form is the one that shapes cristae junctions.

- name: Loss of Cristae Junctions and Inner Membrane Contact Sites
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    The structural lesion of the disease. Cristae junctions are the narrow necks that
    connect each crista to the inner boundary membrane, and they do two things: they hold
    the folded surface area on which respiratory complexes are concentrated, and they
    partition the intermembrane space so that the crista lumen is a distinct compartment.
    Contact sites link the inner membrane to the outer.

    Losing them is therefore not simply a morphological finding. It removes the geometry
    that makes oxidative phosphorylation efficient, which is why an architectural defect
    presents as a bioenergetic disease.
  cellular_components:
  - preferred_term: mitochondrial crista junction
    term:
      id: GO:0044284
      label: mitochondrial crista junction
    modifier: ABSENT
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      resulting in aberrant cristae structure and a loss of cristae junctions and contact
      sites.
    explanation: >-
      States the structural lesion directly.
  - reference: PMID:27485409
    reference_title: "Mitochondrial hepato-encephalopathy due to deficiency of QIL1/MIC13 (C19orf70), a MICOS complex subunit."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disturbed hepatocellular function with abnormal cristae morphology in liver and
      cerebellar and vermis atrophy
    explanation: >-
      Abnormal cristae morphology in patient liver. This is the one place the architectural
      lesion is documented in an affected human organ rather than inferred from fibroblasts,
      which is why it is graded HUMAN_CLINICAL.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: >-
      The complexes are intact but the membrane they work in is not.
  - target: Mitochondrial DNA Depletion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in one of the two patients. Typed with unknown intermediates because no
      mechanism connecting cristae architecture to mtDNA copy number has been demonstrated
      here, and because the other report did not measure it.

- name: Combined Respiratory Chain Deficiency
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    Multiple OXPHOS complexes are deficient at once, in liver and muscle. "Combined" is
    the diagnostic label and it is also the mechanistic clue: a defect in one complex's
    subunits or assembly factors affects that complex, whereas a defect in the membrane
    they all occupy affects all of them.

    The strongest evidence that this is secondary to the architectural lesion rather than
    an independent problem is a rescue: expressing wild-type MICOS13 in the patient's own
    fibroblasts restored respiratory chain function.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:29618761
    reference_title: "QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting in liver disease and severe neurological retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In liver and muscle tissue, the activity of the respiratory chain complexes (OXPHOS)
      was severely impaired.
    explanation: >-
      The biochemical deficiency in patient tissue, in the two organs the disease affects.
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Stable expression of a wild-type MICOS13 cDNA in the patients fibroblasts using a
      lentivirus system rescued mitochondrial respiratory chain complex deficiencies.
    explanation: >-
      The rescue experiment. This is the strongest single piece of evidence in the entry:
      it establishes that the respiratory deficiency is caused by the absence of MICOS13
      rather than merely correlated with it.
  downstream:
  - target: Lactic Acidosis and Hepato-Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Impaired ATP production in the two most oxidative organs, with lactate accumulating
      as glycolysis substitutes.

- name: Mitochondrial DNA Depletion
  role: mechanism
  biological_scale: CELLULAR
  description: >-
    Reduced mitochondrial DNA copy number, found in the Japanese patient - the reason that
    group proposed reclassifying MICOS13 as a cause of mitochondrial DNA depletion
    syndrome - and independently again in the Tunisian patient six years later.

    Two independent reports is what moves this from a single-patient observation towards a
    feature of the disease. It remains true that not every report measured copy number, so
    the denominator is the number who looked rather than the number who have it.

    This is unusual for the gene class. Depletion syndromes are typically caused by
    defects in deoxyribonucleotide metabolism or in the mtDNA replication machinery, and
    MICOS13 is neither. The authors say so themselves. Whether cristae collapse causes
    depletion, or the two are parallel consequences of a failing organelle, is not
    established.
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  evidence:
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest that the novel c.13_29del (p.Trp6Profs*71) MICOS13 variant
      causes hepato-encephalopathy with MTDPS. We propose that MICOS13 is classified as
      the cause of MTDPS.
    explanation: >-
      The depletion finding and the classification proposal, quoted with the authors' own
      hedging ("suggest", "propose") preserved.
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most MTDPS is caused by mutations in genes that disrupt deoxyribonucleotide
      metabolism.
    explanation: >-
      Establishes that MICOS13 does not belong to the usual mechanistic class of depletion
      genes, which is why the finding is recorded as an open question rather than as a
      settled mechanism. INDIRECT because it is background about the disease group, not an
      observation in this patient.
  - reference: PMID:42033541
    reference_title: "A novel homozygous MICOS13 frameshift mutation causing mitochondrial hepatoencephalopathy and mtDNA depletion: clinical characterization and dynamic structural simulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, analysis of mitochondrial DNA copy number revealed a mitochondrial
      depletion in the patient.
    explanation: >-
      Independent replication of the depletion finding in an unrelated patient, which is
      what raises it above a single-report observation.
  - reference: PMID:23355087
    reference_title: "3-Methylglutaconic aciduria--lessons from 50 genes and 977 patients."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was more frequently seen in ATPase related disorders, with mitochondrial DNA
      depletion or deletion, but not in patients with single respiratory chain complex
      deficiencies.
    explanation: >-
      Connects the two findings that co-occur in these patients: across 977 patients,
      3-methylglutaconic aciduria tracks with mtDNA depletion and specifically not with
      isolated respiratory chain complex defects. INDIRECT because it is an association
      across a large mixed cohort, not an observation in a MICOS13 patient - but it is the
      reason the depletion and the aciduria are treated here as parts of one picture rather
      than as coincidence.


- category: Metabolic
  name: 3-Methylglutaconic Aciduria
  frequency: FREQUENT
  description: >-
    The most diagnostically useful finding in the disease, and the one this entry originally
    missed.

    It is a secondary 3-methylglutaconic aciduria: not a defect of leucine catabolism, but
    the metabolic signature of disrupted mitochondrial inner-membrane architecture. That
    places MICOS13 with TAZ, SERAC1, OPA3 and DNAJC19 rather than with the respiratory
    chain disorders it is grouped with by name - and the founding report says so explicitly.

    Practically: 3-MGA on urine organic acids, in an infant with hepato-encephalopathy and
    lactic acidosis, is the finding that should prompt consideration of a MICOS defect
    rather than of a complex-specific one.
  phenotype_term:
    preferred_term: 3-Methylglutaconic aciduria
    term:
      id: HP:0003535
      label: 3-Methylglutaconic aciduria
  evidence:

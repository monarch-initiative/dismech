differential_diagnoses:

- name: Other combined oxidative phosphorylation deficiencies
  description: >-
    The numbered COXPD series is large and clinically overlapping, and enzymology cannot
    separate them - by definition they all show combined deficiency. The separation is
    genetic, and in this disease's case also ultrastructural: most COXPD genes encode
    mitoribosomal, translation or assembly factors and leave cristae architecture intact.

- name: Mitochondrial DNA depletion syndromes
  description: >-
    Raised as a differential by the second report, which found depletion and proposed
    reclassifying MICOS13 as a depletion-syndrome gene. The distinction matters
    mechanistically: classical depletion syndromes act through deoxyribonucleotide
    metabolism or the replication machinery, and MICOS13 is neither.
  evidence:
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most MTDPS is caused by mutations in genes that disrupt deoxyribonucleotide
      metabolism.
    explanation: >-
      States the usual mechanism of the differential group, which is what makes MICOS13's
      membership in it surprising.

discussions:

- discussion_id: micos13_classification_oxphos_vs_mtdna_depletion
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is MICOS13 deficiency a combined oxidative phosphorylation deficiency, a mitochondrial
    DNA depletion syndrome, or both - and does cristae collapse cause the depletion?
  rationale: >-
    The published patients were classified differently, and the difference tracks what each
    group measured rather than any reported difference between the patients. The German
    report characterised respiratory chain activity in liver and muscle and did not report
    mtDNA copy number. The Japanese report found depletion and proposed MICOS13 be
    reclassified; the Tunisian report found it independently six years later. The disease's
    MONDO and OMIM identity is the COXPD one, which is why this entry sits under that name.

    Two independent findings of depletion make it harder to dismiss as one patient's
    idiosyncrasy. And there is now a thread connecting it to the rest of the phenotype: in
    a 977-patient series, 3-methylglutaconic aciduria - which these patients also have -
    tracked with mtDNA depletion and specifically not with isolated respiratory chain
    deficiencies. So the two unexplained findings in this disease co-occur elsewhere too,
    which suggests a shared upstream cause in inner-membrane architecture rather than two
    coincidences.

    The mechanistic question underneath is the interesting one. Depletion syndromes are
    diseases of nucleotide supply or of the replication machinery, and MICOS13 is a
    structural assembly factor - the second report's own introduction says so. So either
    cristae architecture influences mtDNA maintenance by a route nobody has described, or
    depletion is a parallel consequence of a failing organelle rather than a consequence of
    the cristae lesion. The causal edge to the depletion node in this entry is typed
    INDIRECT_UNKNOWN_INTERMEDIATES for exactly this reason.

    It is answerable cheaply: measure mtDNA copy number in the first patient's stored
    tissue, or in any future patient, and the question of whether depletion is a consistent
    feature stops depending on which assay someone happened to run.
  attaches_to:
  - pathophysiology#Mitochondrial DNA Depletion
  - pathophysiology#Loss of Cristae Junctions and Inner Membrane Contact Sites
  proposed_experiments:
  - experiment_id: micos13_mtdna_copy_number_across_patients
    name: Mitochondrial DNA copy number in all MICOS13-deficient patients and in a MICOS13-null cell model
    description: >-
      Quantify mtDNA copy number in every available MICOS13-deficient patient sample and in
      an isogenic MICOS13 knockout, with and without wild-type rescue, to establish whether
      depletion is a consistent feature of the genotype and whether it is reversed by
      restoring the protein on the same timescale as the respiratory chain deficiency.
    readouts:
    - name: Mitochondrial DNA copy number relative to nuclear DNA
      target: pathophysiology#Mitochondrial DNA Depletion
      direction: DECREASED
      interpretation: >-
        Consistent depletion across genotype-matched samples would make it a feature of the
        disease rather than of one patient.
    would_support:
    - pathophysiology#Mitochondrial DNA Depletion
    supporting_outcome:
    - >-
      Depletion present in all MICOS13-deficient samples and in the knockout, and corrected
      by rescue, establishing it as a consequence of MICOS13 loss.
    would_refute:
    - pathophysiology#Mitochondrial DNA Depletion
    refuting_outcome:
    - >-
      Normal copy number in the knockout and in other patients, which would make the single
      reported depletion a feature of that patient rather than of the disease.

notes: >-
  Deep research, and what it cost and bought. The OpenScientist run for this disease failed
  twice before succeeding. The first attempt hit the provider's 3600 s timeout. The second
  returned a report about MRPS34 - a different gene and a different disease - while printing
  this entry's MONDO ID in its own header beside a non-matching OMIM number; `just
  preflight-dr` failed it outright with "discard it rather than cherry-picking", which was
  the right call and is what prevented the wrong material entering here. Worth noting that
  the discarded report's own validation block read 11/11 references verified and
  confabulation_rate 0.0: that metric attests the references are real, not that the disease
  is right.

  The third run was correct and substantially improved this entry. It surfaced the founding
  2016 report, which the initial literature search had missed entirely, and with it: the
  3-methylglutaconic aciduria that is the disease's most useful diagnostic finding, human
  liver cristae ultrastructure, the selective loss of MIC13 and MIC10 with MIC60 retained,
  and a fourth patient in whom the mtDNA depletion was independently replicated. Every one
  was verified against its primary source before use.

  Evidence base. Four reports, at least five patients: a consanguineous Israeli sibling
  pair, a German patient, a Japanese patient, a Tunisian patient. Each clinical claim names
  which of them it comes from, because the phenotype widened considerably with the most
  recent report and a reader should be able to tell a consistent feature from a single
  observation.

  What carries the mechanism. The causal chain from lost protein to respiratory deficiency
  rests on cell-based work in patient fibroblasts, and its strongest element is the
  lentiviral complementation in the Japanese patient's own cells, which establishes
  causation rather than correlation while controlling for genetic background. That work is
  graded IN_VITRO throughout.

  An earlier draft of this entry stated that no patient liver ultrastructure had been
  published and that the architectural lesion in affected organs was therefore inferred
  from fibroblasts. That was wrong: the founding report documents abnormal cristae
  morphology in patient liver, and it is curated here as HUMAN_CLINICAL. Patient brain
  ultrastructure does remain unreported, and that is where most of the disease burden
  lies.

  Two imperfect ontology bindings are recorded rather than hidden, each in its phenotype's
  notes. "Hepatopathy" is bound to HP:0001399 Hepatic failure, which is more specific than
  the sources support. "Psychomotor retardation" is bound to HP:0002361 Psychomotor
  deterioration, which implies loss of acquired skills that the sources do not establish.
  In both cases HPO has no better term and the source's own word is kept in preferred_term.

  A practical note for anyone extending this entry: the gene appears in the literature as
  MICOS13, QIL1, MIC13 and C19orf70, and a search on any one name returns only part of the
  evidence base.

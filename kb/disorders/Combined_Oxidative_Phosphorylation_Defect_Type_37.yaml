genetic:

- name: MICOS13
  gene_term:
    preferred_term: MICOS13
    term:
      id: hgnc:33702
      label: MICOS13
  relationship_type: CAUSATIVE
  notes: >-
    MICOS13 goes by four names in the literature - MICOS13, QIL1, MIC13 and C19orf70 - and
    all four appear in the two primary papers, sometimes in the same sentence. A literature
    search on any single one of them misses part of the evidence base; this was a practical
    problem in curating the entry and is worth knowing for anyone extending it.

    The gene encodes a small subunit of the MICOS complex whose function is assembly. Its
    loss removes a defined MIC10-MIC26-MIC27-QIL1 subcomplex rather than degrading MICOS
    uniformly.
  evidence:
  - reference: PMID:32749073
    reference_title: "A novel homozygous variant in MICOS13/QIL1 causes hepato-encephalopathy with mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      MICOS13 (also known as QIL1, MIC13, or C19orf70) is a component of the MICOS complex,
      which plays crucial roles in the maintenance of cristae junctions at the mitochondrial
      inner membrane.
    explanation: >-
      Establishes the gene's identity across its four names and its function, in one
      sentence.


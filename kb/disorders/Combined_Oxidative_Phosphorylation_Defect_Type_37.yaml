    the wrong tissue, at an unlimited time point, with a vector that has no route to brain
    or liver in a patient.
  notes: >-
    No evidence item. Neither source reports treatment of any kind, and the supportive
    approach described is general mitochondrial practice rather than a finding about this
    disease.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:

mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014679
      label: polymicrogyria, perisylvian, with cerebellar hypoplasia and arthrogryposis
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
  - term:
      id: MONDO:1040012
      label: PI4KA-related disorder
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >
      MONDO:1040012 is the whole PI4KA allelic spectrum — the same gene also
      produces hypomyelinating leukodystrophy, multiple intestinal atresia with
      inflammatory bowel disease, combined immunodeficiency, and late-onset
      hereditary spastic paraplegia, and GeneReviews treats all of these as one
      "PI4KA-related disorder". This entry is scoped to the prenatal-onset
      brain-malformation presentation (MONDO:0014679), so the broader term is a
      broadMatch and must not retire it from the curation queue.
parents:
- PI4KA-related disorder
- Malformation of cortical development
synonyms:
- PMGYCHA
- Polymicrogyria, perisylvian, with cerebellar hypoplasia and arthrogryposis
- PI4KA-related perisylvian polymicrogyria
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Biallelic PI4KA variants are required. In the family that delineated this
    entity the two variants were in trans — a paternally transmitted nonsense
    allele and a maternally transmitted catalytic-domain missense allele — and
    segregated with the phenotype. Across the wider PI4KA cohorts no affected
    individual carries two complete loss-of-function alleles, consistent with
    complete loss of PI4KIIIalpha activity being incompatible with development.
  evidence:
  - reference: PMID:25855803
    reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these regions, the only plausibly pathogenic mutations were compound heterozygous variants in PI4KA, which Sanger sequencing confirmed segregated consistent with autosomal recessive inheritance."
    explanation: Documents biallelic segregation in the family in which this entity was defined.
  - reference: PMID:35951779
    reference_title: PI4KA-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GENETIC COUNSELING: PI4KA-related disorder is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the recessive inheritance pattern for the disorder as a whole.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >
    No population-based estimate exists. This specific prenatal-onset
    presentation was reported in one family with three affected fetuses
    (PMID:25855803); a second family carrying the same p.Asp1854Asn allele was
    subsequently reported (PMID:34415310), and one of ten patients in an
    independent PI4KA cohort had bilateral perisylvian polymicrogyria
    (PMID:34415322). The wider PI4KA-related disorder had roughly two dozen
    published patients as of the 2021-2022 reports. No numerator/denominator for
    a population rate is available, so no numeric rate is asserted here.
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder comprises perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis, and was identified in a small nuclear family with three female foetuses"
    explanation: Records that the entity rests on a single small family of three affected fetuses, the basis for treating it as ultra-rare.
pathophysiology:
- name: Biallelic PI4KA Loss-of-Function
  biological_scale: MOLECULAR
  description: >
    PI4KA encodes phosphatidylinositol 4-kinase IIIalpha, the kinase responsible
    for the predominant plasma membrane pool of PI(4)P. In the family defining
    this entity the paternal allele is a nonsense variant (p.Arg796Ter) and the
    maternal allele a missense substitution at a conserved catalytic-domain
    residue (p.Asp1854Asn); expression studies confirmed that residue is required
    for kinase activity. Notably, no reported patient carries two complete
    loss-of-function alleles — total abolition of PI4KIIIalpha activity is
    incompatible with embryonic development — so the disease-causing genotypes
    are hypomorphic in aggregate.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    description: >-
      Compound heterozygosity for a nonsense allele and a catalytic-domain
      missense allele, in trans.
  gene:
    preferred_term: PI4KA
    modifier: DECREASED
    term:
      id: hgnc:8983
      label: PI4KA
  molecular_functions:
  - preferred_term: phosphatidylinositol 4-kinase IIIalpha activity
    modifier: DECREASED
    term:
      id: GO:0004430
      label: 1-phosphatidylinositol 4-kinase activity
  downstream:
  - target: Impaired Function of the PI4KIIIalpha-TTC7-FAM126-EFR3 Complex
    description: >
      Variants act either by damaging catalysis directly or by perturbing the
      protein-protein interfaces that assemble and position the holoenzyme.
    evidence:
    - reference: PMID:34415310
      reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our cellular, biochemical and structural modelling studies indicate that PI4KA-associated phenotypical outcomes probably stem from impairment of PI4KIIIα-TTC7-FAM126's organ-specific functions, due to defective catalytic activity or altered intra-complex functional interactions."
      explanation: States the two mechanisms by which PI4KA variants disable the holoenzyme.
  evidence:
  - reference: PMID:25855803
    reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The paternally transmitted variant predicted a premature stop mutation (c.2386C>T; p.R796X), whereas the maternally transmitted variant predicted a missense substitution (c.5560G>A; p.D1854N) at a conserved residue within the catalytic domain."
    explanation: Defines the two causal alleles in the family that delineated this entity.
  - reference: PMID:25855803
    reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies using expressed wild-type or mutant PI4KA enzyme confirmed the importance of p.D1854 for kinase activity."
    explanation: Functional confirmation that the missense allele damages catalysis.
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Asp1854Asn substitution affects the catalytic domain in line with its reduced PI4KIIIα enzymatic activity, impacting both PI4KIIIα-TTC7A and PI4KIIIα-TTC7B complexes."
    explanation: Independent enzymatic confirmation for the specific allele carried by this entity's index family.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients harbouring one loss-of-function variant were compound heterozygotes with a missense or in-frame variant, with no patients harbouring two loss-of-function variants."
    explanation: Establishes that biallelic complete loss of function is not observed, supporting the hypomorphic-genotype claim.
- name: Impaired Function of the PI4KIIIalpha-TTC7-FAM126-EFR3 Complex
  biological_scale: MOLECULAR
  description: >
    PI4KIIIalpha generates PI(4)P only as part of a heterotetramer with TTC7A/B
    and FAM126A/B, which homodimerizes and is delivered to the plasma membrane by
    the palmitoylated protein EFR3A/B. Structural work shows the EFR3A C-terminus
    binding both TTC7B and FAM126A, and that disrupting those interfaces reduces
    PI4KA recruitment to the membrane — so the complex is the functional unit,
    not the kinase alone. This architecture also explains why variants in the
    partner genes phenocopy parts of the PI4KA spectrum: FAM126A variants cause
    hypomyelinating leukodystrophy and TTC7A variants cause intestinal atresia
    with immunodeficiency.
  cellular_components:
  - preferred_term: plasma membrane
    term:
      id: GO:0005886
      label: plasma membrane
  downstream:
  - target: Depletion of the Plasma Membrane PI(4)P Pool
    description: >
      A complex that cannot assemble or cannot reach the plasma membrane cannot
      make PI(4)P where it is needed.
    evidence:
    - reference: PMID:39705356
      reference_title: Molecular basis for plasma membrane recruitment of PI4KA by EFR3.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Complex disrupting mutations in TTC7B, FAM126A, and EFR3 decrease PI4KA recruitment to the plasma membrane."
      explanation: Shows directly that damaging the complex interfaces reduces the kinase's delivery to its site of action.
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PI4KIIIα's role in PI4P generation requires its assembly into a heterotetrameric complex with EFR3, TTC7 and FAM126."
    explanation: States the requirement for complex assembly.
  - reference: PMID:39705356
    reference_title: Molecular basis for plasma membrane recruitment of PI4KA by EFR3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fundamental to PI4KA activity is its targeted recruitment to the plasma membrane by the lipidated proteins EFR3A and EFR3B."
    explanation: Establishes EFR3-mediated membrane recruitment as a requirement for activity.
  - reference: PMID:39705356
    reference_title: Molecular basis for plasma membrane recruitment of PI4KA by EFR3.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Multiple posttranslational modifications and disease linked mutations map to this site, providing insight into how PI4KA membrane recruitment can be regulated and disrupted in human disease."
    explanation: Connects the structural interface to human disease-causing variants.
- name: Depletion of the Plasma Membrane PI(4)P Pool
  biological_scale: CELLULAR
  description: >
    PI(4)P generated by PI4KIIIalpha is the entry point to plasma membrane
    phosphoinositide metabolism and the precursor of PI(4,5)P2 and PI(3,4,5)P3,
    which control membrane identity, ion channel behaviour, trafficking and
    signalling. In patients, PI4KA protein and PI(4)P are both measurably reduced
    in fibroblasts, and phosphoinositide species are reduced in peripheral blood
    mononuclear cells — so the biochemical lesion is demonstrated in patient
    material, not only inferred from the genotype.
  biological_processes:
  - preferred_term: plasma membrane PI(4)P synthesis
    modifier: DECREASED
    term:
      id: GO:0046854
      label: phosphatidylinositol phosphate biosynthetic process
  downstream:
  - target: Impaired Neuronal Migration in the Developing Cerebral Cortex
    description: >
      Phosphoinositide signalling is required for the cortical development
      program whose failure produces polymicrogyria.
    evidence:
    - reference: PMID:25855803
      reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our results emphasize the importance of phosphoinositide signalling in early brain development."
      explanation: The authors' own conclusion linking the phosphoinositide lesion to the brain malformation.
  - target: Impaired Myelination
    description: >
      PI(4)P supports delivery of phosphatidylserine, abundant in myelin, to the
      plasma membrane, so its depletion disturbs the membrane lipidome from which
      myelin is built.
    evidence:
    - reference: PMID:34415322
      reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "PI4KA malfunction may lead to disturbances in the brain cell membrane lipidome, resulting in aberrant myelination."
      explanation: >
        States the proposed route from PI(4)P depletion to abnormal myelination.
        The authors frame it as a mechanism the data are consistent with rather
        than one they demonstrate, so the edge is indirect.
      directness: INDIRECT
  evidence:
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PI4KA and PI(4)P levels were significantly diminished in the fibroblasts of five patients."
    explanation: Direct measurement of reduced PI(4)P in patient cells.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence and targeted lipidomics indicated that PI4KA activity was diminished in fibroblasts and peripheral blood mononuclear cells."
    explanation: Independent assay confirming reduced kinase activity in two patient cell types.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional analyses by western blotting and immunofluorescence showed decreased PI4KA levels in the patients' fibroblasts."
    explanation: Shows the protein itself, not only its product, is reduced in patient cells.
- name: Impaired Neuronal Migration in the Developing Cerebral Cortex
  biological_scale: CELLULAR
  description: >
    Polymicrogyria is a malformation of cortical development attributed to
    impaired neuronal migration, producing an excessively folded cortex with too
    many small gyri and abnormal lamination. In this disorder the migration
    defect is regional rather than global, concentrating around the sylvian
    fissures — the perisylvian cortex is among the last regions to complete
    migration and organization, and is the region most often affected in
    polymicrogyria of any cause.
  cell_types:
  - preferred_term: migrating cortical neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: DECREASED
    term:
      id: GO:0001764
      label: neuron migration
  - preferred_term: cerebral cortex development
    modifier: ABNORMAL
    term:
      id: GO:0021987
      label: cerebral cortex development
  downstream:
  - target: Perisylvian polymicrogyria
    description: >
      The failed migration program is what the polymicrogyric cortex records.
    evidence:
    - reference: PMID:25855803
      reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Polymicrogyria (PMG) is a structural brain abnormality involving the cerebral cortex that results from impaired neuronal migration and although several genes have been implicated, many cases remain unsolved."
      explanation: States that polymicrogyria results from impaired neuronal migration.
  evidence:
  - reference: PMID:25855803
    reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, exome sequencing in a family where three fetuses had all been diagnosed with PMG and cerebellar hypoplasia allowed us to identify regions of the genome for which both chromosomes were shared identical-by-descent, reducing the search space for causative variants to 8.6% of the genome."
    explanation: Documents the polymicrogyria phenotype in the three affected fetuses of the index family.
- name: Impaired Myelination
  biological_scale: TISSUE
  description: >
    In patients who survive to be imaged, the dominant white matter finding is
    hypomyelination — a failure to deposit myelin rather than to maintain it —
    with white matter atrophy and a thin corpus callosum. The same lesion arises
    from variants in FAM126A, the PI4KIIIalpha complex partner, which cause
    hypomyelination and congenital cataracts, so this arm of the phenotype is a
    property of the complex rather than of PI4KA specifically. One patient in an
    independent PI4KA cohort had bilateral perisylvian polymicrogyria alongside
    this myelination phenotype, which is what links this node to the present
    entity rather than only to the milder end of the spectrum.
  cell_types:
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: myelination
    modifier: DECREASED
    term:
      id: GO:0042552
      label: myelination
  downstream:
  - target: CNS hypomyelination
    description: >
      Failure of myelin deposition is what the hypomyelinating MRI pattern shows.
    evidence:
    - reference: PMID:34415322
      reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Group 1 patients showed a pattern of marked, diffuse supratentorial and infratentorial hypomyelination associated with white matter atrophy and a thin corpus callosum (Patients 1–4), incomplete/delayed myelination (Patients 5–7) and bilateral perisylvian polymicrogyria (Patient 8)."
      explanation: Describes the hypomyelination pattern and places perisylvian polymicrogyria in the same patient group.
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that biallelic PI4KA sequence alterations in humans are associated with neurological disease, in particular hypomyelinating leukodystrophy."
    explanation: Establishes hypomyelinating leukodystrophy as the predominant neurological finding in the PI4KA cohort.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 1 and 2 exhibited diffuse hypomyelination, global white matter atrophy with posterior predominance, a thin corpus callosum and colpocephaly."
    explanation: Patient-level description of the hypomyelination and associated white matter findings.

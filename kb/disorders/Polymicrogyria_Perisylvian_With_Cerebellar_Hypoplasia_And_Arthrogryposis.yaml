genetic:
- name: PI4KA
  gene_term:
    preferred_term: PI4KA
    term:
      id: hgnc:8983
      label: PI4KA
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:25855803
      reference_title: "Germline recessive mutations in PI4KA are associated with perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In these regions, the only plausibly pathogenic mutations were compound heterozygous variants in PI4KA, which Sanger sequencing confirmed segregated consistent with autosomal recessive inheritance."
      explanation: Biallelic segregation in the index family.
  notes: >
    PI4KA at 22q11.21 encodes the 2102-residue phosphatidylinositol 4-kinase
    IIIalpha, organized into an alpha-solenoid domain, a dimerization domain, a
    "cradle" domain that contacts TTC7, and a C-terminal catalytic domain. The
    two alleles defining this entity are p.Arg796Ter (paternal, nonsense) and
    p.Asp1854Asn (maternal, catalytic domain); the latter recurs in an
    independent family and has been shown enzymatically to reduce activity of
    both the TTC7A- and the TTC7B-containing complex. Across the published
    cohorts, missense and in-frame variants cluster near the active site in the
    catalytic and cradle domains, and genotype does not cleanly predict which
    organ system dominates — two patients sharing one truncating allele had
    discordant phenotypes (severe infantile leukodystrophy versus spastic
    paraparesis with onset at 17), the difference tracking with the second
    allele. gnomAD constraint is consistent with a purely recessive mechanism
    (pLI 0.00031, pRec 1).
  evidence:
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, the pLI value of PI4KA was 0.00031, and the pRec value was 1, indicating that biallelic deleterious variants in this gene are pathogenic."
    explanation: Population constraint metrics supporting a recessive disease mechanism.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, 7 of 13 conserved missense/in-frame variants were clustered near the active site of PI4KA in the catalytic and ‘cradle’ domains (Fig."
    explanation: Documents the clustering of disease variants around the active site.
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 4 and 9 shared one of the truncating variants (p.Thr2053SerfsTer4) but displayed discordant phenotypes."
    explanation: Documents the discordant phenotypes seen in patients sharing one allele, the basis for the genotype-phenotype note.
diagnosis:
- name: Fetal or postnatal brain imaging
  description: >
    Prenatal ultrasound or MRI showing polymicrogyria with cerebellar hypoplasia,
    or postnatal MRI showing hypomyelination, cerebellar hypoplasia or atrophy, a
    thin or dysplastic corpus callosum, and perisylvian polymicrogyria, raises
    the possibility of PI4KA-related disease.
  evidence:
  - reference: PMID:35951779
    reference_title: PI4KA-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI findings can include hypomyelinating leukodystrophy, cerebellar hypoplasia/atrophy, thin or dysplastic corpus callosum, and/or perisylvian polymicrogyria."
    explanation: GeneReviews lists the recognized neuroimaging findings.
- name: PI4KA molecular genetic testing
  description: >
    The diagnosis is established by identifying biallelic pathogenic PI4KA
    variants. Because the phenotype overlaps TTC7A- and FAM126A-related disease,
    a gene panel or exome/genome approach is more useful than single-gene
    testing.
  evidence:
  - reference: PMID:35951779
    reference_title: PI4KA-Related Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DIAGNOSIS/TESTING: The diagnosis of PI4KA-related disorder is established in a proband with characteristic features and biallelic PI4KA pathogenic variants identified by molecular genetic testing."
    explanation: States the molecular diagnostic criterion.
- name: PI4KA and PI(4)P assay in patient fibroblasts
  description: >
    Western blot and immunofluorescence for PI4KA, immunofluorescence against the
    PI(4)P head group, and targeted phosphoinositide lipidomics on fibroblasts or
    PBMCs all show reduced values in patients. These are research assays, but the
    authors propose them as candidate diagnostic and prognostic biomarkers.
  evidence:
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PIP levels were reduced in the PBMCs of four patients, and specifically PI(4)P was diminished as shown in fibroblasts of five patients, suggesting that their use as biomarkers for diagnosis and prognosis may be indicated."
    explanation: Proposes the phosphoinositide measurements as diagnostic and prognostic biomarkers.
differential_diagnoses:
- name: TTC7A-related multiple intestinal atresia with combined immunodeficiency
  description: >
    TTC7A encodes PI4KIIIalpha's direct binding partner, and biallelic TTC7A
    variants produce the intestinal and immunological arm of the same phenotype —
    early-onset inflammatory bowel disease through multiple intestinal atresia
    with or without combined immunodeficiency. Distinguishing the two requires
    sequencing; in the Amish PI4KA family this was done explicitly, and no
    pathogenic TTC7A variant was found.
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The striking phenotypical overlap between TTC7A deficiency patients and the MIA and immunodeficiency affecting the Amish neonates indicates that the p.(Tyr1623Asp) substitution may specifically impair PI4KIIIα-TTC7A binding."
    explanation: States the phenotypic overlap with TTC7A deficiency and its structural explanation.
- name: FAM126A-related hypomyelination and congenital cataracts
  description: >
    FAM126A (hyccin) is the other regulatory subunit of the complex; its loss
    causes hypomyelination and congenital cataracts, whose proposed mechanism is
    defective PI(4)P production in oligodendrocytes. The white matter phenotype
    is essentially the same lesion reached through a different subunit, and the
    congenital cataracts are the discriminating feature.
  evidence:
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is intriguing that pathogenic variants in FAM126A, a gene that encodes another partner of the PI4KA/TTC7/FAM126A protein complex, cause hypomyelinating leukodystrophy"
    explanation: >
      Identifies FAM126A, the other regulatory subunit of the PI4KIIIalpha
      complex, as a cause of hypomyelinating leukodystrophy. The continuation of
      the same sentence attributes that disorder to defective PI(4)P production
      in oligodendrocytes; it is not quoted here because the intervening
      bracketed OMIM reference makes the longer span unmatchable by the snippet
      validator.
- name: Other phosphoinositide-pathway polymicrogyria
  description: >
    Variants in PIK3CA, PIK3R2, AKT3 and FIG4 — all in phosphoinositide metabolism
    or its downstream signalling — also cause polymicrogyria, with or without
    megalencephaly and capillary malformation. Megalencephaly and the mosaic,
    somatic pattern of the PIK3CA/AKT3 disorders are the main discriminators from
    the recessive, non-overgrowth PI4KA phenotype.
  evidence:
  - reference: PMID:34415322
    reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For instance, variants in the PIK3CA, PIK3R2, AKT3, and FIG4 genes have been linked to the development of polymicrogyria, which can be associated or not with megalencephaly and capillary malformation,5,9–12 and PI4K2A variants have been associated with intellectual disability and epilepsy."
    explanation: Lists the other phosphoinositide-pathway genes that cause polymicrogyria.

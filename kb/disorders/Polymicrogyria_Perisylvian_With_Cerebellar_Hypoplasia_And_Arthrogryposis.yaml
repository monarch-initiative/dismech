name: Perisylvian Polymicrogyria with Cerebellar Hypoplasia and Arthrogryposis
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >
  Perisylvian polymicrogyria with cerebellar hypoplasia and arthrogryposis
  (PMGYCHA) is the severe, prenatal-onset end of the PI4KA-related disorder
  spectrum. It is caused by biallelic variants in PI4KA, which encodes
  phosphatidylinositol 4-kinase IIIalpha — the kinase that performs the first
  committed step of plasma membrane phosphoinositide metabolism, converting
  phosphatidylinositol to PI(4)P. PI4KIIIalpha does not act alone: it works as a
  heterotetramer with TTC7A/B and FAM126A/B, recruited to the plasma membrane by
  palmitoylated EFR3A/B, and disease variants act either by damaging catalysis
  directly or by disturbing assembly of that complex. Because PI(4)P is the
  precursor of PI(4,5)P2 and PI(3,4,5)P3, its depletion degrades membrane
  identity and signalling across many tissues, and the phenotype tracks which
  organ-specific arm of the complex a particular allele impairs. The entity
  named here was delineated in a family in which three fetuses had perisylvian
  polymicrogyria, cerebellar hypoplasia and arthrogryposis, and it sits at the
  lethal end of a spectrum whose milder presentations include hypomyelinating
  leukodystrophy, multiple intestinal atresia with inflammatory bowel disease,
  combined immunodeficiency, and adolescent- or adult-onset spastic paraplegia.

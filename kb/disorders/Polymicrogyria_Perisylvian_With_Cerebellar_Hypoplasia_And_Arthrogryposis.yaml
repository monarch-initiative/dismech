animal_models:
- name: Pi4ka null mouse
  species: Mus musculus
  genotype: Pi4ka germline loss-of-function
  category: KNOCKOUT
  genes:
  - preferred_term: PI4KA
    term:
      id: hgnc:8983
      label: PI4KA
  publication: PMID:34415310
  description: >
    Germline Pi4ka loss-of-function in the mouse abolishes PI4KIIIalpha activity
    and is incompatible with embryonic development. This is a negative result
    with real explanatory force: it is why every reported human patient carries
    at least one hypomorphic allele, and it means the complete null cannot be
    used to model this disease.
  modeled_mechanisms:
  - target: Biallelic PI4KA Loss-of-Function
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      The complete null is embryonic lethal and therefore cannot reproduce the
      human disease, which depends on residual PI4KIIIalpha activity.
    limitations: >-
      Because homozygous null embryos do not develop, the model yields no
      information about cortical migration, cerebellar development or
      arthrogryposis. Modelling this disorder requires a hypomorphic or
      conditional allele, ideally a knock-in of a specific human variant such as
      p.Asp1854Asn; no such allele has been reported.
    evidence:
    - reference: PMID:34415310
      reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Accordingly, germline Pi4ka loss of function variants that abolish PI4KIIIα activity are incompatible with embryonic development."
      explanation: Documents that the complete murine null does not survive to model the human phenotype.
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Accordingly, germline Pi4ka loss of function variants that abolish PI4KIIIα activity are incompatible with embryonic development."
    explanation: Establishes the embryonic lethality that constrains modelling of this disorder.
- name: Pi4ka knockdown zebrafish
  species: Danio rerio
  genotype: Pi4ka morpholino knockdown
  category: KNOCKDOWN
  genes:
  - preferred_term: PI4KA
    term:
      id: hgnc:8983
      label: PI4KA
  publication: PMID:34415322
  description: >
    Knockdown rather than knockout, which is what makes it usable: partial
    reduction of Pi4ka in zebrafish produces multiple developmental defects
    including brain abnormalities, mirroring the hypomorphic human genotypes.
  modeled_mechanisms:
  - target: Depletion of the Plasma Membrane PI(4)P Pool
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >
      Dose reduction rather than abolition of Pi4ka produces developmental
      defects including brain abnormalities, matching the partial-loss mechanism
      of the human disease.
    limitations: >-
      Morpholino knockdown is transient and carries well-known off-target and
      toxicity risks; the reported phenotype is described at the level of gross
      developmental defects, with the most prominent being loss of pectoral fins
      rather than a cortical malformation, and teleosts have no gyrencephalic
      cortex in which polymicrogyria could be modelled at all.
    readouts:
    - name: Gross developmental defects after Pi4ka knockdown
      target: Depletion of the Plasma Membrane PI(4)P Pool
      direction: ALTERED
      interpretation: >
        Partial Pi4ka reduction is sufficient to derange development, supporting
        dose-dependence of the human phenotype.
      evidence:
      - reference: PMID:34415322
        reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "downregulation of Pi4ka expression in zebrafish leads to multiple developmental defects affecting the brain, heart, trunk and most prominently the loss of pectoral fins, while the Pi4ka orthologue knockout is lethal in flies, mice and yeast."
        explanation: Reports the knockdown phenotype and contrasts it with the lethality of complete knockout.
    evidence:
    - reference: PMID:34415322
      reference_title: Biallelic PI4KA variants cause a novel neurodevelopmental syndrome with hypomyelinating leukodystrophy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Animal models in which PI4KA homologues are inactivated show profound abnormalities: downregulation of Pi4ka expression in zebrafish leads to multiple developmental defects affecting the brain, heart, trunk and most prominently the loss of pectoral fins, while the Pi4ka orthologue knockout is lethal in flies, mice and yeast."
      explanation: Supports treating the zebrafish knockdown as informative for partial PI4KA loss.
discussions:
- discussion_id: pi4ka_arthrogryposis_mechanism_unknown
  kind: KNOWLEDGE_GAP
  prompt: >
    Why do fetuses with biallelic PI4KA variants develop arthrogryposis, and is
    it secondary to the brain malformation or an independent consequence of
    PI(4)P depletion in muscle or motor neurons?
  rationale: >
    Arthrogryposis is one of the three features this entity is named for, but no
    mechanism has been proposed for it. The obvious explanation is fetal akinesia
    secondary to the cortical and cerebellar malformation, which is how
    arthrogryposis arises in many CNS malformation syndromes. That is an
    inference from the general pathophysiology of fetal akinesia, not something
    demonstrated for PI4KA: no motor neuron, neuromuscular junction or muscle
    phenotype has been reported in PI4KA patients or in any PI4KA model, and
    PI(4)P and PI(4,5)P2 have direct roles in ion channel regulation and vesicle
    release that could plausibly act at the neuromuscular junction independently
    of the brain lesion. Because the entity rests on a single family of
    terminated fetuses, no muscle histology or electrophysiology has ever been
    reported. The entry therefore records no causal edge into the arthrogryposis
    phenotype, and this gap is the reason.
  attaches_to:
  - phenotypes#Arthrogryposis multiplex congenita
  - pathophysiology#Depletion of the Plasma Membrane PI(4)P Pool
  proposed_experiments:
  - experiment_id: pi4ka_fetal_neuromuscular_histology
    name: Neuromuscular histology and motor unit assessment in PI4KA fetuses
    description: >
      Where a further affected pregnancy is examined, obtain skeletal muscle and
      spinal cord histology alongside the brain, assess motor neuron number,
      neuromuscular junction architecture and muscle fibre type distribution, and
      test whether the neuromuscular apparatus is intrinsically abnormal or
      merely disused.
    would_support:
    - phenotypes#Arthrogryposis multiplex congenita
    supporting_outcome:
    - Muscle and neuromuscular junction are structurally abnormal, indicating a mechanism additional to fetal akinesia from the brain lesion
    refuting_outcome:
    - Muscle shows only disuse change with normal motor neurons and junctions, consistent with arthrogryposis being purely secondary to the CNS malformation
  - experiment_id: pi4ka_hypomorph_mouse_movement
    name: Conditional or hypomorphic Pi4ka allele with fetal movement phenotyping
    description: >
      Build a hypomorphic or conditional Pi4ka allele that survives gestation
      (the complete null does not), then phenotype fetal movement by ultrasound
      and score joint contractures at birth, comparing a CNS-restricted deletion
      against a muscle- or motor-neuron-restricted deletion to separate the two
      candidate origins.
    would_support:
    - phenotypes#Arthrogryposis multiplex congenita
    supporting_outcome:
    - Contractures follow CNS-restricted deletion, establishing arthrogryposis as secondary to the brain malformation
    refuting_outcome:
    - Contractures require peripheral deletion, establishing an independent neuromuscular mechanism
  evidence:
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder comprises perisylvian polymicrogyria, cerebellar hypoplasia and arthrogryposis, and was identified in a small nuclear family with three female foetuses"
    explanation: Documents arthrogryposis as a defining feature while showing the entity rests on a single family of three fetuses, which is why no neuromuscular data exist.
  - reference: PMID:34415310
    reference_title: "Biallelic PI4KA variants cause neurological, intestinal and immunological disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Accordingly, germline Pi4ka loss of function variants that abolish PI4KIIIα activity are incompatible with embryonic development."
    explanation: Explains why no mouse model has been available to address the question.
notes: >
  Scope and lump/split. MONDO carries both MONDO:0014679 (this prenatal-onset
  brain-malformation entity) and MONDO:1040012 (PI4KA-related disorder, the whole
  allelic spectrum), and GeneReviews describes the latter as one clinically
  variable disorder. This entry is anchored on MONDO:0014679 because that is what
  the curation queue held, and the pathograph is written around the brain
  malformation. Features from the wider spectrum — hypomyelination, intestinal
  atresia, inflammatory bowel disease, combined immunodeficiency, spastic
  paraplegia — are included because they arise from the same molecular lesion and
  because one reported patient had bilateral perisylvian polymicrogyria together
  with the hypomyelinating phenotype. The relationship to MONDO:1040012 is
  recorded as a broadMatch so the broader concept stays in the curation queue and
  can be curated separately, or this entry re-scoped, if the field settles on the
  spectrum name.

  Gene symbol. HGNC's approved symbol is PI4KA; much of the primary literature
  writes the protein as PI4KIIIalpha or PI4KIIIα, and both forms appear in quoted
  snippets.

  What is deliberately absent. No causal edge runs into the arthrogryposis
  phenotype — the mechanism is not established and the honest state is recorded
  as a KNOWLEDGE_GAP discussion rather than papered over with a plausible edge.
  No prevalence rate is asserted. No frequency bands are asserted on any
  phenotype: the entity rests on one family of three fetuses, and every
  supporting cohort (PMID:34415310, PMID:34415322) enrolled patients across the
  whole PI4KA spectrum, so their denominators are not this entity's patient
  count.

- name: Sertoli-cell AMH transcription failure
  description: >-
    SF-1 activates transcription of anti-Mullerian hormone in the Sertoli cell.
    Where SF-1 activity falls far enough, AMH output drops below the level
    needed to signal the paramesonephric ducts, and circulating AMH and inhibin
    B fall below their reference ranges.

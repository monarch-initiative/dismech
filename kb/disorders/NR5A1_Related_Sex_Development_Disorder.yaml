treatments:
- name: Estrogen replacement therapy
  description: >-
    Estrogen-based hormone replacement treats the hypoestrogenism of the 46,XX
    primary-ovarian-insufficiency arm (and of 46,XY individuals raised female
    after gonadectomy), supporting pubertal development and reducing long-term
    bone and cardiovascular risk.
  treatment_term:
    preferred_term: estrogen replacement therapy
    term:
      id: NCIT:C15231
      label: Estrogen Replacement Therapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
  evidence:
  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 46,XX individuals, NR5A1 mutations are a rare genetic cause of POI,
      manifesting as primary or secondary amenorrhea, infertility,
      hypoestrogenism, and elevated gonadotropin levels.
    explanation: >-
      Anchors the hypoestrogenic ovarian-insufficiency arm for which estrogen
      replacement is the standard management.
- name: Androgen replacement therapy
  description: >-
    Testosterone replacement is used in 46,XY individuals with undervirilization
    and Leydig-cell insufficiency to induce or support virilization and secondary
    sexual characteristics, individualized to the assigned sex and degree of
    androgen deficiency.
  treatment_term:
    preferred_term: androgen replacement therapy
    term:
      id: NCIT:C15482
      label: Androgen Therapy
    therapeutic_agent:
    - preferred_term: testosterone
      term:
        id: CHEBI:17347
        label: testosterone
  evidence:
  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, an undervirilized external genitalia is frequently seen at birth,
      while spontaneous virilization may occur later, at puberty.
    explanation: >-
      Anchors the undervirilized 46,XY arm for which androgen replacement is a
      management option depending on assigned sex.
- name: Adrenal hormone replacement therapy
  description: >-
    Glucocorticoid replacement, with mineralocorticoid replacement when
    clinically indicated, treats primary adrenal insufficiency in severe
    NR5A1-related adrenal involvement.
  treatment_term:
    preferred_term: adrenal hormone replacement therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_phenotypes:
  - preferred_term: Adrenal insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  evidence:
  - reference: PMID:19246354
    reference_title: "Mutations in NR5A1 associated with ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutation of NR5A1 causes 46,XY disorders of sex development, with or
      without adrenal failure
    explanation: >-
      Anchors the adrenal-failure arm for which adrenal steroid replacement is
      the standard management.
- name: Genetic counseling
  description: >-
    Genetic counseling is indicated because NR5A1 variants segregate with
    sex-limited, variable expressivity: at-risk relatives—including carrier
    mothers and sisters of 46,XY DSD probands—may develop primary ovarian
    insufficiency and benefit from counseling and reproductive planning.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mothers and sisters of 46,XY DSD patients carrying heterozygous NR5A1
      mutations may develop POI, and therefore require appropriate counseling.
    explanation: >-
      Directly supports genetic counseling for at-risk relatives carrying
      heterozygous NR5A1 variants.
- name: Orchidopexy and germ cell tumour surveillance
  description: >-
    Where the gonads are preserved in a 46,XY (SRXY3) patient, they should be
    brought into a palpable position by early orchidopexy and then kept under
    germ-cell-tumour surveillance, because dysgenetic gonads carry a raised risk
    of malignant germ cell tumour and of carcinoma-in-situ precursor lesions.
    Finding premalignant or malignant change is what prompts gonadectomy. The
    corollary is that reflex gonadectomy in infancy is not the default: because
    severely undervirilized SRXY3 infants may still virilize spontaneously at
    puberty, irreversible procedures should be deferred until sex assignment has
    been considered carefully.
  context: >-
    Applies to the SRXY3 (46,XY) arm of NR5A1-related disease in patients whose
    gonads are retained; not applicable to the 46,XX arms of the spectrum.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orchidopexy with germ-cell tumour surveillance
    term:
      id: NCIT:C111066
      label: Orchiopexy
  target_phenotypes:
  - preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  evidence:
  - reference: PMID:22080441
    reference_title: "Pubertal androgenization and gonadal histology in two 46,XY adolescents with NR5A1 mutations and predominantly female phenotype at birth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In case of preserved gonads, early orchidopexy and germ cell tumor screening is warranted."
    explanation: >-
      States the orchidopexy-plus-surveillance recommendation for preserved
      gonads that this treatment entry records.
  - reference: PMID:22080441
    reference_title: "Pubertal androgenization and gonadal histology in two 46,XY adolescents with NR5A1 mutations and predominantly female phenotype at birth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The finding of premalignant and/or malignant changes should prompt gonadectomy or possibly irradiation."
    explanation: >-
      Gives the escalation rule that surveillance feeds into, distinguishing
      this from routine prophylactic gonadectomy.
  - reference: PMID:34613524
    reference_title: "Pubertal development in 46,XY patients with NR5A1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, it is important to consider sex assignment carefully and avoid irreversible procedures during infancy."
    explanation: >-
      Supports deferring irreversible gonadal surgery in infancy, the caution
      attached to this management approach.
diagnosis:
- name: Targeted molecular testing
  description: >-
    Sequencing of NR5A1 (gene panel or exome) confirms the diagnosis by
    identifying a pathogenic variant in individuals presenting with 46,XY DSD,
    46,XX primary ovarian insufficiency, 46,XX testicular DSD, or unexplained
    severe spermatogenic failure.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20887963
    reference_title: "Human male infertility associated with mutations in NR5A1 encoding steroidogenic factor 1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To test the hypothesis that mutations in NR5A1 cause male infertility, we
      sequenced NR5A1 in 315 men with idiopathic spermatogenic failure.
    explanation: >-
      Demonstrates NR5A1 sequencing as the diagnostic route in individuals with
      unexplained gonadal/reproductive phenotypes.
  - reference: PMID:17488792
    reference_title: "Heterozygous mutation of steroidogenic factor-1 in 46,XY subjects may mimic partial androgen insensitivity syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for SF-1 mutation should be performed in subjects with apparent partial androgen insensitivity syndrome and no mutation in the AR gene."
    explanation: >-
      Extends the testing indication: because normal Sertoli and Leydig markers
      do not exclude SRXY3, NR5A1 must be sequenced in AR-negative apparent
      partial androgen insensitivity.

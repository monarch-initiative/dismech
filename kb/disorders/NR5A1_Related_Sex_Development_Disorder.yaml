  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, the recurrent heterozygous p.Arg92Trp NR5A1 mutation is
      associated with variable degrees of testis development in 46,XX patients.
    explanation: >-
      Records the one recurrent NR5A1 allele, p.Arg92Trp, and its distinctive
      behaviour: it drives testis development in 46,XX individuals rather than
      the 46,XY undervirilization typical of the gene.
  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clear genotype-phenotype correlation is not seen in patients bearing
      NR5A1 mutations, suggesting that genetic modifiers, such as pathogenic
      variants in other testis/ovarian-determining genes, may contribute to the
      phenotypic expression.
    explanation: >-
      States the absence of genotype-phenotype correlation, which is why an
      NR5A1 genotype does not predict where in the SRXY3 range a patient falls,
      and points at modifier variants as the proposed explanation.
  - reference: PMID:22549935
    reference_title: "Ten novel mutations in the NR5A1 gene cause disordered sex development in 46,XY and ovarian insufficiency in 46,XX individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found high variability and thus no apparent
      genotype-structure-function-phenotype correlation.
    explanation: >-
      An independent functional series reaches the same conclusion from
      transactivation assays, so the missing correlation is not an artefact of
      one cohort's ascertainment.
  notes: >-
    NR5A1 encodes steroidogenic factor 1 (SF-1 / Ad4BP), a nuclear-receptor
    transcription factor regulating adrenal and gonadal development and
    steroidogenesis. Most disease variants are heterozygous with sex-limited,
    variable expressivity; biallelic variants occur in some severe and
    consanguineous cases. Expressivity varies markedly even within a single
    pedigree carrying one allele, and no genotype-phenotype correlation has been
    established, so the variant does not predict where in the SRXY3 range a
    46,XY carrier will fall. The recurrent p.Arg92Trp allele is the notable
    exception to the gene's usual direction of effect, driving testis
    development in 46,XX individuals.
progression:
- phase: Fetal and neonatal undervirilization
  subtype: SRXY3
  age_range: Birth to early infancy
  notes: >-
    SRXY3 declares itself at birth as undervirilized 46,XY external genitalia,
    anywhere from penoscrotal hypospadias with micropenis to ambiguous genitalia
    to an entirely female appearance. The rare patients who also have primary
    adrenal insufficiency usually present in this window with the adrenal
    failure rather than the genital finding.
  evidence:
  - reference: PMID:34613524
    reference_title: "Pubertal development in 46,XY patients with NR5A1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ambiguous external genitalia with a scrotum bipartitum and/or micropenis"
    explanation: >-
      Describes the neonatal genital spectrum this phase records in 46,XY
      NR5A1 patients.
  - reference: PMID:29151085
    reference_title: "A Novel Mutation in the Critical P-Box Residue of Steroidogenic Factor-1 Presenting with XY Sex Reversal and Transient Adrenal Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the clinical characteristics of a phenotypically female patient presenting at 2 months with signs of adrenal insufficiency. DSD 46,XY was diagnosed at 4 years."
    explanation: >-
      Illustrates the adrenal-first infantile presentation, in which the 46,XY
      DSD is recognised only years later.
- phase: Spontaneous virilization at puberty
  subtype: SRXY3
  age_range: Pubertal age
  notes: >-
    A substantial share of SRXY3 patients virilize spontaneously at puberty,
    including some who showed no discernible androgen effect in utero, because
    Leydig-cell function can recover as gonadotropin drive rises. Gonadotropins
    sit at or above the upper reference range, and testosterone can reach the
    adult male range despite reduced gonadal volume. Neither the neonatal
    genital phenotype nor the presence of Mullerian structures predicts how far
    an individual will virilize, which is the argument against irreversible
    infant surgery and early gonadectomy in this subtype.
  evidence:
  - reference: PMID:34613524
    reference_title: "Pubertal development in 46,XY patients with NR5A1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who first presented in early infancy due to ambiguous genitalia showed spontaneous virilization at pubertal age accompanied by a significant testosterone production despite the decreased gonadal volume."
    explanation: >-
      Documents spontaneous pubertal virilization with real testosterone
      production, which is the defining feature of this phase.
  - reference: PMID:30224582
    reference_title: "Spontaneous virilization around puberty in NR5A1-related 46,XY sex reversal: additional case and a literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe under-virilization in utero followed by spontaneous virilization around puberty in NR5A1-related 46,XY DSD"
    explanation: >-
      A literature review of thirteen cases establishes this trajectory as a
      recognised pattern rather than an isolated observation.
  - reference: PMID:30224582
    reference_title: "Spontaneous virilization around puberty in NR5A1-related 46,XY sex reversal: additional case and a literature review."
    supports: SUPPORT

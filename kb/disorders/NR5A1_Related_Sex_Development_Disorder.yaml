name: NR5A1-related sex development disorder
creation_date: "2026-05-29T12:00:00Z"
category: Mendelian
description: >-
  NR5A1-related sex development disorder is a monogenic disorder caused by
  pathogenic variants in NR5A1, which encodes steroidogenic factor 1 (SF-1 /
  Ad4BP), a nuclear-receptor transcription factor that controls adrenal and
  gonadal development and steroidogenesis. Reduced SF-1 transactivational
  activity dysregulates a shared adrenogonadal transcriptional program,
  producing a strikingly wide, sex-dependent phenotypic spectrum from a single
  gene defect: 46,XY individuals present with disorders of sex development
  ranging from partial or complete gonadal dysgenesis and undervirilized
  external genitalia to oligo/azoospermia, while 46,XX individuals present with
  primary ovarian insufficiency, and—less commonly with the recurrent
  p.Arg92Trp variant—46,XX testicular or ovotesticular DSD. Severe or biallelic
  loss can additionally cause primary adrenal insufficiency. Inheritance is most
  often autosomal dominant with sex-limited, variable expressivity; some severe
  cases are recessive.
disease_term:
  preferred_term: NR5A1-related sex development disorder
  term:
    id: MONDO:1060211
    label: NR5A1-related sex development disorder
parents:
- Disorder of sex development
- Infertility disorder
- Primary ovarian insufficiency
synonyms:
- SF-1 deficiency
- Steroidogenic factor 1 deficiency
- NR5A1-related disorder of sex development
has_subtypes:
- name: SRXY3
  display_name: 46,XY sex reversal 3 (NR5A1-related 46,XY gonadal dysgenesis, with or
    without adrenal failure)
  classification: clinical_phenotype
  subtype_term:
    preferred_term: 46,XY sex reversal 3
    term:
      id: MONDO:0013066
      label: 46,XY sex reversal 3
  genes:
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  description: >-
    SRXY3 is the 46,XY arm of the NR5A1/SF-1 spectrum: reduced SF-1
    transactivation impairs testis determination and fetal androgen output, so a
    46,XY fetus undervirilizes. The gonadal lesion ranges from partial to
    complete gonadal dysgenesis and the external genitalia from penoscrotal
    hypospadias with micropenis through ambiguous genitalia to an entirely
    female appearance; Mullerian derivatives may persist when Sertoli-cell AMH
    output fails. The first two reported NR5A1 patients had the severe end of
    this range together with primary adrenal failure, which is why the OMIM
    entity is named "with or without adrenal failure", but adrenal involvement
    is in fact exceptional and most SRXY3 patients have normal adrenal function.
    NR5A1 is among the most frequently identified causes of 46,XY DSD, commonly
    cited at 8-15% and reported at 9% and 13% in the two cohorts cited here. Two features distinguish SRXY3 from the other
    46,XY gonadal dysgenesis subtypes and drive management: gonads retained into
    adolescence carry a raised germ-cell-tumour risk, and severely
    undervirilized infants may nevertheless virilize spontaneously at puberty,
    so the neonatal phenotype is a poor guide to adult androgen status.
    Inheritance is usually heterozygous and sex-limited dominant; a carrier
    mother may be unaffected or present with primary ovarian insufficiency.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      SRXY3 probands typically carry a single heterozygous NR5A1 variant that is
      either de novo or inherited in a sex-limited dominant manner from a
      heterozygous mother.
    evidence:
    - reference: PMID:17200175
      reference_title: "Heterozygous missense mutations in steroidogenic factor 1 (SF1/Ad4BP, NR5A1) are associated with 46,XY disorders of sex development with normal adrenal function."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two mutations appeared to be de novo or germline changes. The other two mutations appeared to be inherited in a sex-limited dominant manner because the mother is heterozygous for the change."
      explanation: >-
        Documents both the de novo and the sex-limited dominant maternal
        transmission routes in molecularly confirmed 46,XY NR5A1 cases.
  evidence:
  - reference: PMID:17200175
    reference_title: "Heterozygous missense mutations in steroidogenic factor 1 (SF1/Ad4BP, NR5A1) are associated with 46,XY disorders of sex development with normal adrenal function."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous missense mutations in NR5A1 were found in four individuals (four of 30, 13%) with this phenotype."
    explanation: >-
      Establishes heterozygous NR5A1 variants as a recurrent cause of the 46,XY
      DSD phenotype that defines this subtype, at 13% of a screened cohort.
  - reference: PMID:22549935
    reference_title: "Ten novel mutations in the NR5A1 gene cause disordered sex development in 46,XY and ovarian insufficiency in 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SF-1/NR5A1 mutations are frequently found in 46,XY DSD individuals (9%) and manifest with a broad phenotype."
    explanation: >-
      Independently quantifies the NR5A1 yield in 46,XY DSD and records the
      phenotypic breadth that makes this a spectrum subtype rather than a single
      presentation.
  - reference: PMID:29151085
    reference_title: "A Novel Mutation in the Critical P-Box Residue of Steroidogenic Factor-1 Presenting with XY Sex Reversal and Transient Adrenal Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cases of SF1 deficiency associated with adrenal failure are exceptionally rare"
    explanation: >-
      Supports the "with or without adrenal failure" scope of this subtype while
      establishing that the adrenal arm is the exception, not the rule.
  - reference: PMID:15070943
    reference_title: "A microdeletion in the ligand binding domain of human steroidogenic factor 1 causes XY sex reversal without adrenal insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "may be relevant to the cohort of patients who present with 46, XY sex reversal but normal adrenal function"
    explanation: >-
      Names the adrenal-sparing 46,XY sex-reversal presentation that constitutes
      the bulk of this subtype.
  - reference: PMID:32738419
    reference_title: "Identification and functional analysis of fourteen NR5A1 variants in patients with the 46 XY disorders of sex development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 8-15% of 46,XY DSD are caused by variants in the NR5A1 gene."
    explanation: >-
      Gives the commonly cited share of 46,XY DSD attributable to NR5A1, the
      range this subtype description reports.
  review_notes: >-
    Parent entry is NR5A1-related sex development disorder (MONDO:1060211).
    MONDO:0013066 is a subclass of that gene-axis term and of both
    MONDO:0010765 (46,XY complete gonadal dysgenesis) and MONDO:0016674 (46,XY
    partial gonadal dysgenesis), all three of which are already curated; it is
    therefore recorded here as the 46,XY clinical bin of the gene-axis entry
    rather than as a fourth standalone entry, following the SRXX3/SRXX4
    precedent in 46_XX_Testicular_DSD.yaml. Isolated NR5A1 spermatogenic failure
    is deliberately excluded: it is a separate OMIM entity (SPGF8) and the
    Azoospermia and Oligozoospermia phenotypes in this entry are left untagged.
    Named-entity trap for future curators: SRXY3 (OMIM 612965) is the NR5A1
    entity, while SRXY6 (OMIM 618973) is MAP3K1. Both are numbered "46,XY sex
    reversal" entries and a literature search on the phrase returns MAP3K1
    papers freely, so a MAP3K1 cohort must not be cited here.
    Considered and deferred: streak gonad (HP:0000813) and cryptorchidism
    (HP:0000028) are both reported for this subtype in the deep-research report,
    but no reference cached for this entry yields an exact quote for either in
    an NR5A1 46,XY context. They need a dedicated source rather than a
    re-derivation from the same cache.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most reported NR5A1 variants are heterozygous and segregate dominantly with
    sex-limited, variable expressivity: the same heterozygous variant can cause
    46,XY DSD in one relative and primary ovarian insufficiency in a 46,XX
    relative of the same family.
  evidence:
  - reference: PMID:19246354
    reference_title: "Mutations in NR5A1 associated with ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the NR5A1 gene from the proband and her mother
      revealed a heterozygous frameshift mutation, c.666delC, in codon 222
    explanation: >-
      A heterozygous frameshift transmitted from an affected mother (POI) to her
      46,XY DSD daughter documents dominant transmission with sex-limited
      expression.
  - reference: PMID:28033660
    reference_title: "Wide spectrum of NR5A1-related phenotypes in 46,XY and 46,XX individuals."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mothers and sisters of 46,XY DSD patients carrying heterozygous NR5A1
      mutations may develop POI, and therefore require appropriate counseling.
    explanation: >-
      Carrier mothers and sisters developing POI illustrates dominant
      inheritance with sex-dependent, variable expressivity.
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    A minority of families, particularly consanguineous pedigrees and some
    severe phenotypes with adrenal involvement, show recessive segregation with
    homozygous NR5A1 variants.
  evidence:
  - reference: PMID:19246354
    reference_title: "Mutations in NR5A1 associated with ovarian insufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutational analysis of the NR5A1 gene revealed a homozygous c.877G→A
      transition, predicted to cause a p.Asp293Asn amino acid change
    explanation: >-
      A homozygous NR5A1 variant in the affected offspring of consanguineous
      first-cousin parents documents recessive segregation in some families.
notes: >-
  MONDO:1060211 (NR5A1-related sex development disorder) is a gene-axis disease
  entity that unifies the NR5A1/SF-1 phenotype spectrum (46,XY DSD, 46,XX POI,
  46,XX testicular/ovotesticular DSD, spermatogenic failure, and adrenal
  insufficiency) under a single transcription-factor mechanism. NR5A1 disease
  was first established by Achermann et al. 1999 (PMID:10369247), who reported a
  heterozygous NR5A1 mutation causing 46,XY sex reversal with adrenal failure;
  the abstract is not available in the local cache, so that founding report is
  cited here for historical provenance rather than as an evidence snippet.
  Unlike the synaptonemal-complex and meiotic-recombination genes in the
  gametogenic-failure series (e.g., SYCE1, MCM9), NR5A1 acts upstream of meiosis
  on gonadal organogenesis and steroidogenesis, so this entry intentionally does
  not conform to the meiotic_prophase_failure module, which explicitly excludes
  steroidogenic transcription-factor disorders. The clinical bins are being
  structured as formal has_subtypes incrementally (issue 3310, open question 2);
  the 46,XY bin is now recorded as the SRXY3 subtype, anchored to MONDO:0013066
  (46,XY sex reversal 3, OMIM 612965), and the 46,XX POI and 46,XX
  testicular/ovotesticular bins remain to be structured the same way.
  MONDO:0013066 was curated here as a subtype rather than as its own entry
  because it is a subclass of this term and of both MONDO:0010765 (46,XY
  complete gonadal dysgenesis) and MONDO:0016674 (46,XY partial gonadal
  dysgenesis), all three already curated, so a standalone entry would have
  duplicated content across three parents; the parallel 46,XX sex-reversal
  terms are handled the same way as SRXX3/SRXX4 in 46_XX_Testicular_DSD.yaml.
  Phenotypes, progression phases, and the Sertoli-cell AMH node added for that
  bin carry subtype: SRXY3; the Azoospermia and Oligozoospermia phenotypes are
  deliberately left untagged because isolated NR5A1 spermatogenic failure is a
  separate OMIM entity (SPGF8) and is not within MONDO:0013066.
pathophysiology:
- name: NR5A1/SF-1 transcription factor haploinsufficiency
  description: >-
    NR5A1 encodes steroidogenic factor 1 (SF-1, also called Ad4BP), a
    nuclear-receptor transcription factor expressed in steroidogenic and
    gonadal tissue. Heterozygous loss-of-function (haploinsufficiency), and in
    some families biallelic, variants reduce SF-1 transactivational activity on
    its target-gene promoters, the proximal molecular lesion shared across all
    NR5A1-related presentations.
  genes:
  - preferred_term: NR5A1
    term:
      id: hgnc:7983
      label: NR5A1
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: DECREASED
  evidence:
  - reference: PMID:31513305
    reference_title: "Mutation update for the NR5A1 gene involved in DSD and infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nuclear receptor subfamily 5 group A member 1 (NR5A1), also named
      steroidogenic factor 1, is an essential transcription factor that
      regulates a number of target genes crucial for normal reproductive
      physiology and endocrine function.
    explanation: >-
      Establishes SF-1 as a transcription factor whose loss disrupts the
      reproductive and endocrine target-gene program.
  - reference: PMID:19246354
    reference_title: "Mutations in NR5A1 associated with ovarian insufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies indicated that these mutations substantially impaired
      NR5A1 transactivational activity.
    explanation: >-
      Functional assays directly demonstrate that the disease variants reduce
      NR5A1 transactivation, supporting loss of function as the mechanism.
  - reference: PMID:29190620
    reference_title: "Four Novel NR5A1 Mutations in 46,XY Gonadal Dysgenesis Patients Including Frameshift Mutations with Altered Subcellular SF-1 Localization."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection of different mutations revealed altered subcellular localization of the mutant SF-1 protein in the case of the frameshift mutations, indicating an impaired protein function."
    explanation: >-
      Adds a second route to loss of function beyond reduced transactivation:
      frameshift alleles mislocalize the protein, so functional SF-1 does not
      reach the nucleus in the first place.
  downstream:
  - target: Impaired adrenogonadal developmental and steroidogenic program
    description: >-
      Reduced SF-1 transactivation dysregulates the adrenal and gonadal
      developmental and steroidogenic transcriptional program.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31513305
      reference_title: "Mutation update for the NR5A1 gene involved in DSD and infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "where it controls several steps of adrenal and gonadal development."
      explanation: >-
        SF-1 controls multiple steps of adrenal and gonadal development, so
        reduced activity perturbs that developmental program.
- name: Impaired adrenogonadal developmental and steroidogenic program
  description: >-
    SF-1 transcriptionally controls multiple steps of adrenal and gonadal
    development and steroidogenesis, regulating target genes including STAR,
    CYP17A1, CYP11A1, CYP19A1, AMH, LHB, and INHA. Reduced SF-1 dosage
    dysregulates this shared program, simultaneously impairing testis
    determination and differentiation, ovarian development and maintenance, and
    steroid-hormone biosynthesis. The same molecular lesion is therefore
    channeled into divergent, sex-dependent clinical outcomes.
  cell_types:

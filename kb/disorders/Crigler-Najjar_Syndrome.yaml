    explanation: >-
      Provides the birth-prevalence estimate recorded here. Evidence source is
      OTHER because this is a scoping review of the published literature rather
      than a primary epidemiological study.
pathophysiology:
- name: Complete or Severe Loss of UGT1A1 Glucuronidation Activity
  description: >-
    Biallelic mutations in UGT1A1, on chromosome 2q37, impair or abolish the
    activity of bilirubin UDP-glucuronosyltransferase, the enzyme that
    conjugates unconjugated bilirubin with glucuronic acid to make it
    water-soluble and excretable in bile. The extent of activity loss sets the
    disease type: complete absence gives type 1, partial retention gives type 2.
    This is the same enzyme whose mildly reduced expression causes Gilbert's
    syndrome, and the three conditions form one activity-loss spectrum rather
    than distinct mechanisms.
  role: trigger
  biological_scale: MOLECULAR
  conforms_to: "bilirubin_conjugation_transport#UGT1A1-Dependent Bilirubin Glucuronidation Deficiency"
  genes:
  - preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1

  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CNS presents in the following forms: CNS type 1 (CNS1), the more severe
      form with the complete absence of UGT1A1 activity, and CNS type 2 (CNS2),
      with partial enzyme activity.
    explanation: >-
      Establishes that residual enzyme activity is the variable distinguishing
      the two subtypes, which is why they are curated as subtypes of one entry
      rather than separate diseases. Evidence source is OTHER because this is a
      scoping review.
  - reference: PMID:25315738
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler-Najjar syndrome is the severe inherited form of unconjugated
      hyperbilirubinaemia due to mutations in the UGT1A1 gene, which can cause
      kernicterus early in life and can be even lethal when left untreated.
    explanation: >-
      Independently confirms the genetic basis and places this disorder at the
      severe end of the unconjugated hyperbilirubinaemia spectrum. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Severe Unconjugated Hyperbilirubinaemia
    causal_link_type: DIRECT
    description: >-
      Bilirubin that cannot be glucuronidated cannot be excreted in bile and
      accumulates in plasma in the unconjugated form.

- name: Severe Unconjugated Hyperbilirubinaemia
  description: >-
    Unconjugated bilirubin accumulates in plasma to concentrations far above
    those seen in Gilbert's syndrome, producing persistent non-haemolytic
    jaundice from the first days of life. The defining biochemical picture is an
    isolated unconjugated elevation: conjugated bilirubin, transaminases,
    synthetic function, and liver imaging are normal, and there is no
    haemolysis. This distinguishes Crigler-Najjar syndrome from liver disease
    and from the conjugated hereditary hyperbilirubinaemias.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "bilirubin_conjugation_transport#Hyperbilirubinaemia"
  biological_processes:
  - preferred_term: bilirubin transport
    term:
      id: GO:0015723
      label: bilirubin transport
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler–Najjar syndrome (CNS) is a rare autosomal recessive disorder
      characterized by severe unconjugated hyperbilirubinemia. CNS results in
      nonhemolytic jaundice, with its most serious complication being
      bilirubin-induced neurologic dysfunction.
    explanation: >-
      States the biochemical phenotype of this node, its non-haemolytic nature,
      and the complication that follows from it. Evidence source is OTHER
      because this is a scoping review.
  - reference: PMID:37602038
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite two weeks of treatment, unconjugated hyperbilirubinemia persisted,
      with conjugated bilirubin levels below 0.7 mg/dL and unconjugated
      bilirubin levels ranging from 22 to 25 mg/dL. No hemolysis or hepatic
      dysfunction was observed.
    explanation: >-
      A worked human example of the isolated unconjugated pattern with normal
      hepatic function and no haemolysis, the discriminating feature of this
      node. Evidence source is HUMAN_CLINICAL because this is a patient case
      report.
  downstream:
  - target: Bilirubin-Induced Neurological Dysfunction and Kernicterus
    causal_link_type: DIRECT
    description: >-
      Unconjugated bilirubin in excess of albumin binding capacity crosses the
      blood-brain barrier and binds brain tissue.

- name: Bilirubin-Induced Neurological Dysfunction and Kernicterus
  description: >-
    When plasma unconjugated bilirubin exceeds albumin binding capacity, the
    free pigment crosses the blood-brain barrier and binds to specific brain
    tissues, causing acute bilirubin encephalopathy and its chronic sequela,
    kernicterus. This is the complication the whole management strategy exists
    to prevent, and it is what makes type 1 a neonatal emergency. The risk is
    strongly graded by subtype: it is high in type 1, where no enzyme activity
    remains, and little to none in type 2. Once brain damage occurs it is
    irreversible, which is why the timing of liver transplantation is critical.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "bilirubin_conjugation_transport#Bilirubin Neurotoxicity and Kernicterus"
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:

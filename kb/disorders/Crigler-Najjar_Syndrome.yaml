    causal_link_type: DIRECT
    description: >-
      Bilirubin that cannot be glucuronidated cannot be excreted in bile and
      accumulates in plasma in the unconjugated form.

- name: Severe Unconjugated Hyperbilirubinaemia
  description: >-
    Unconjugated bilirubin accumulates in plasma to concentrations far above
    those seen in Gilbert's syndrome, producing persistent non-haemolytic
    jaundice from the first days of life. The defining biochemical picture is an
    isolated unconjugated elevation: conjugated bilirubin, transaminases,
    synthetic function, and liver imaging are normal, and there is no
    haemolysis. This distinguishes Crigler-Najjar syndrome from liver disease
    and from the conjugated hereditary hyperbilirubinaemias.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "bilirubin_conjugation_transport#Hyperbilirubinaemia"

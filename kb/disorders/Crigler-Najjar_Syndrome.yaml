genetic:
- name: UGT1A1
  notes: >-
    Biallelic pathogenic variants in UGT1A1, on chromosome 2q37, cause
    Crigler-Najjar syndrome. Variants abolishing enzyme activity produce type 1;
    those leaving residual activity produce type 2. The gene is the same one in
    which a promoter TA-repeat polymorphism causes Gilbert's syndrome.
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:37602038
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both Crigler-Najjar syndrome (CNS) type I and CNS type II are hereditary
      conditions characterized by elevated levels of unconjugated bilirubin due
      to mutations in the UGT1A1 gene located on chromosome 2q37
    explanation: >-
      Establishes UGT1A1 as the causal gene for both subtypes and gives its
      chromosomal location. Evidence source is HUMAN_CLINICAL because the
      statement frames a genetically confirmed patient report.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Crigler-Najjar syndrome is inherited in an autosomal recessive manner;
    consanguinity is a recognised risk factor and the disorder is
    over-represented in genetically isolated populations.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:37602038
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CNS type 1 is inherited as an autosomal recessive disorder affecting
      bilirubin conjugation
    explanation: >-
      States the mode of inheritance. Evidence source is HUMAN_CLINICAL because
      this is a case report with pedigree analysis.
treatments:
- name: Intensive Phototherapy
  description: >-
    Prolonged daily phototherapy photoisomerises unconjugated bilirubin in the
    skin into water-soluble products excretable without glucuronidation,
    bypassing the missing enzyme. In type 1 it is containment rather than cure -
    16-20 hours daily may be needed - and its efficacy declines with age as the
    surface-area-to-mass ratio falls. It does not restore UGT1A1 activity.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_mechanisms:
  - target: Severe Unconjugated Hyperbilirubinaemia
    treatment_effect: INHIBITS
    description: >-
      Photoisomerisation provides a conjugation-independent excretion route,
      lowering plasma unconjugated bilirubin below the neurotoxic threshold.
    evidence:
    - reference: PMID:39456788
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The literature analysis showed that CNS1 requires aggressive management,
        including phototherapy and plasmapheresis, but liver transplantation
        (LT) remains the only definitive cure.
      explanation: >-
        Places phototherapy as containment of the hyperbilirubinaemia node and
        explicitly distinguishes it from definitive treatment. Evidence source
        is OTHER because this is a scoping review.
  evidence:
  - reference: PMID:37602038
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While phototherapy offers some benefits, liver transplantation remains the
      only definitive treatment for this condition.
    explanation: >-
      Marked PARTIAL because it bounds the claim - phototherapy helps but does
      not cure, and in this reported patient it failed to control bilirubin.
      Evidence source is HUMAN_CLINICAL because this is a case report.
- name: Phenobarbital
  description: >-
    Phenobarbital induces residual UGT1A1 expression and so lowers serum
    bilirubin in type 2 disease. It is ineffective in type 1, where no enzyme
    activity remains to be induced - a therapeutic distinction that follows
    directly from the subtype's underlying enzymatic lesion, and one that makes
    the response to phenobarbital diagnostically informative.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: phenobarbital
      term:
        id: CHEBI:8069
        label: phenobarbital
  target_mechanisms:
  - target: Complete or Severe Loss of UGT1A1 Glucuronidation Activity
    treatment_effect: ACTIVATES
    description: >-
      Enzyme induction raises the activity of the residual UGT1A1 present in
      type 2 disease, partially restoring bilirubin conjugation. There is no
      such residual activity in type 1, so this link applies only to type 2.
    evidence:
    - reference: PMID:39456788
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CNS2 is milder, with patients responding well to phenobarbital and
        having a lower risk of kernicterus.
      explanation: >-
        Establishes the subtype-restricted efficacy of phenobarbital. Evidence
        source is OTHER because this is a scoping review.
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current therapeutic options for CNS include phototherapy, phenobarbital
      administration, and liver transplantation.
    explanation: >-
      Lists phenobarbital among the established therapeutic options. Evidence
      source is OTHER because this is a scoping review.
- name: Liver Transplantation
  description: >-
    Orthotopic liver transplantation replaces the enzyme-deficient hepatocyte
    population and is the only definitive cure for type 1 disease. It corrects
    the lesion at its source rather than containing its downstream product, and
    bilirubin normalises after transplantation. Timing is the critical variable:
    it must precede irreversible kernicterus. The costs are the standard ones -
    graft rejection and lifelong immunosuppression.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Complete or Severe Loss of UGT1A1 Glucuronidation Activity
    treatment_effect: ACTIVATES
    description: >-
      Replacing the liver supplies hepatocytes with functional UGT1A1,
      restoring bilirubin glucuronidation at the trigger node.
    evidence:
    - reference: PMID:37602038
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The surgery was successful without complications, and the infant's
        bilirubin levels normalized post-transplantation, with unconjugated
        bilirubin levels at 0.64 mg/dL and conjugated bilirubin at 0.26 mg/dL.
      explanation: >-
        Demonstrates restoration of normal bilirubin handling after
        transplantation, confirming the enzymatic lesion is hepatocyte-intrinsic
        and correctable by liver replacement. Evidence source is HUMAN_CLINICAL
        because this is a patient case report with post-operative laboratory
        follow-up.
  evidence:
  - reference: PMID:39456788
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, LT poses risks such as graft rejection and lifelong
      immunosuppression.
    explanation: >-
      Marked PARTIAL because it records the cost side of the only curative
      option, which is what motivates the investigational alternatives.
      Evidence source is OTHER because this is a scoping review.
discussions:
- discussion_id: cn_gene_therapy_investigational
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can AAV-mediated UGT1A1 gene transfer or autologous hepatocyte
    transplantation replace liver transplantation in Crigler-Najjar syndrome
    type 1?
  attaches_to:
  - "pathophysiology#Complete or Severe Loss of UGT1A1 Glucuronidation Activity"
  rationale: >-
    Both alternatives target the enzymatic lesion itself rather than containing
    its downstream product, which is what liver transplantation currently
    requires major surgery and lifelong immunosuppression to achieve. Neither is
    established. AAV gene therapy has shown potential in preclinical studies but
    faces two problems specific to this disease: the target population is
    paediatric, and a growing liver dilutes non-integrating vector genomes, and
    pre-existing anti-AAV immunity restricts eligibility. Autologous hepatocyte
    transplantation avoids rejection but durable engraftment has not been
    demonstrated. These should be curated as investigational, not as available
    treatments.
  proposed_experiments:
  - experiment_id: cn_aav_paediatric_durability
    name: Paediatric durability study of AAV-UGT1A1 gene transfer
    description: >-
      Long-term follow-up of AAV-mediated UGT1A1 transfer dosed in early
      childhood, reporting sustained bilirubin control and freedom from
      phototherapy through the period of maximal liver growth, would establish
      whether vector dilution defeats the approach in the population that needs
      it most.

    reference_title: "Therapeutic Options for Crigler-Najjar Syndrome: A Scoping Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler–Najjar syndrome (CNS) is a rare autosomal recessive disorder
      characterized by severe unconjugated hyperbilirubinemia. CNS results in
      nonhemolytic jaundice, with its most serious complication being
      bilirubin-induced neurologic dysfunction.
    explanation: >-
      States the biochemical phenotype of this node, its non-haemolytic nature,
      and the complication that follows from it. Evidence source is OTHER
      because this is a scoping review.
  - reference: PMID:37602038
    reference_title: "Liver Transplantation in a Child With Crigler-Najjar Syndrome Type I: A Case Report With Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite two weeks of treatment, unconjugated hyperbilirubinemia persisted,
      with conjugated bilirubin levels below 0.7 mg/dL and unconjugated
      bilirubin levels ranging from 22 to 25 mg/dL. No hemolysis or hepatic
      dysfunction was observed.
    explanation: >-
      A worked human example of the isolated unconjugated pattern with normal
      hepatic function and no haemolysis, the discriminating feature of this
      node. Evidence source is HUMAN_CLINICAL because this is a patient case
      report.
  downstream:
  - target: Bilirubin-Induced Neurological Dysfunction and Kernicterus
    causal_link_type: DIRECT
    description: >-
      Unconjugated bilirubin in excess of albumin binding capacity crosses the
      blood-brain barrier and binds brain tissue.
  - target: Unconjugated Hyperbilirubinaemia
    causal_link_type: DIRECT
    description: >-
      Systemic accumulation of unconjugated bilirubin manifests biochemically as
      marked indirect hyperbilirubinaemia with a normal conjugated fraction.
  - target: Neonatal Jaundice
    causal_link_type: DIRECT
    description: >-
      Deposition of excess unconjugated bilirubin in skin and sclerae produces
      persistent non-haemolytic jaundice from the neonatal period.

- name: Bilirubin-Induced Neurological Dysfunction and Kernicterus
  description: >-
    When plasma unconjugated bilirubin exceeds albumin binding capacity, the
    free pigment crosses the blood-brain barrier and binds to specific brain
    tissues, causing acute bilirubin encephalopathy and its chronic sequela,
    kernicterus. This is the complication the whole management strategy exists
    to prevent, and it is what makes type 1 a neonatal emergency. The risk is
    strongly graded by subtype: it is high in type 1, where no enzyme activity
    remains, and little to none in type 2. Once brain damage occurs it is
    irreversible, which is why the timing of liver transplantation is critical.
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "bilirubin_conjugation_transport#Bilirubin Neurotoxicity and Kernicterus"

diagnosis:
- name: UGT1A1 Molecular Genetic Testing
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Sequencing of the UGT1A1 coding exons, splice junctions, and promoter TATA
    box establishes the molecular diagnosis of Crigler-Najjar syndrome and
    helps distinguish null type 1 genotypes from partial-activity type 2
    missense genotypes and cis promoter modifiers.
  results: Biallelic pathogenic variants in UGT1A1 confirm Crigler-Najjar syndrome.
  evidence:
  - reference: PMID:37602038
    reference_title: "Liver Transplantation in a Child With Crigler-Najjar Syndrome Type I: A Case Report With Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis was confirmed through sequencing, and the patient underwent
      a successful liver transplant at the age of two months.
    explanation: >-
      Demonstrates molecular genetic sequencing as the confirmatory diagnostic
      test in a patient with persistent neonatal unconjugated hyperbilirubinemia.
  - reference: PMID:19830808
    reference_title: "Crigler-Najjar syndrome in The Netherlands: identification of four novel UGT1A1 alleles, genotype-phenotype correlation, and functional analysis of 10 missense mutants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The identification of four novel pathogenic mutations and the analysis of
      residual activity of 10 UGT1A1 missense mutants are useful for clinical
      diagnosis, and provides new insights in enzyme activity, whereas the
      identification of two founder mutations will speed up genetic counseling
      for newly identified CN patients in The Netherlands.
    explanation: >-
      Supports UGT1A1 mutation identification and functional residual-activity
      analysis for clinical diagnosis and genetic counseling.

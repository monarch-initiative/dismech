notes: >-
  Both Crigler-Najjar syndrome type 1 (MONDO:0021020) and type 2 (MONDO:0011725)
  are caused exclusively by biallelic pathogenic variants in UGT1A1; no second
  causal gene is established. Type 1 reflects complete loss of bilirubin
  glucuronidation activity, whereas type 2 retains partial allele- and
  substrate-dependent enzymatic activity, and the UGT1A1*28 promoter TA-repeat
  polymorphism acts in cis as an expression modifier bridging the spectrum to
  Gilbert syndrome.

  No GeneReviews chapter exists for Crigler-Najjar syndrome (verified via
  `just check-genereviews`, which searches the committed Bookshelf index across
  the entry name and MONDO exact synonyms and returns NO_CHAPTER). The
  StatPearls chapter (PMID:32965842) is cited for general clinical orientation
  and tagged accordingly.

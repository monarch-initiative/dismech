    term:
      id: GO:0006789
      label: bilirubin conjugation
    modifier: DECREASED
  molecular_functions:
  - preferred_term: glucuronosyltransferase activity
    term:
      id: GO:0015020
      label: glucuronosyltransferase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Crigler-Najjar Syndrome (CNS) is a rare genetic disorder caused by
      mutations in the UGT1A1 gene, leading to impaired bilirubin conjugation
      and severe unconjugated hyperbilirubinemia.
    explanation: >-
      States the gene, the enzymatic lesion, and the biochemical consequence
      that define this node. Evidence source is OTHER because this is a scoping

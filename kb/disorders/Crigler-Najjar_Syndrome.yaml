      specific brain tissues.
    explanation: >-
      States the mechanism by which the hyperbilirubinaemia node produces this
      neurological consequence. Evidence source is OTHER because this is a
      scoping review.
  - reference: PMID:39456788
    reference_title: "Therapeutic Options for Crigler-Najjar Syndrome: A Scoping Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type I disease (CNS1) is characterized by severe jaundice and a high risk
      of neurologic sequelae (kernicterus), resulting from the complete absence
      of enzymatic activity; type II disease (CNS2) is a milder form with
      decreased enzyme activity, lower serum bilirubin levels, and little to no
      risk of kernicterus
    explanation: >-
      Grades the risk of reaching this node by subtype and ties that grading
      back to residual enzyme activity at the trigger node. Evidence source is
      OTHER because this is a scoping review.
  - reference: PMID:39456788
    reference_title: "Therapeutic Options for Crigler-Najjar Syndrome: A Scoping Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The timing of LT is critical, as it must be performed before the onset of
      irreversible brain damage (kernicterus), making early intervention

genetic:
- name: UGT1A1
  notes: >-
    Biallelic pathogenic variants in UGT1A1, on chromosome 2q37, cause
    Crigler-Najjar syndrome. Variants abolishing enzyme activity produce type 1;
    those leaving residual activity produce type 2. The gene is the same one in
    which a promoter TA-repeat polymorphism causes Gilbert's syndrome.
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:37602038
    reference_title: "Liver Transplantation in a Child With Crigler-Najjar Syndrome Type I: A Case Report With Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both Crigler-Najjar syndrome (CNS) type I and CNS type II are hereditary
      conditions characterized by elevated levels of unconjugated bilirubin due
      to mutations in the UGT1A1 gene located on chromosome 2q37
    explanation: >-
      Establishes UGT1A1 as the causal gene for both subtypes and gives its
      chromosomal location. Evidence source is HUMAN_CLINICAL because the
      statement frames a genetically confirmed patient report.
  variants:
  - name: Alleles abolishing UGT1A1 activity
    description: >-
      Genotypes leaving no measurable bilirubin-glucuronidating activity produce
      type 1 disease. Because the residual activity is nil, phenobarbital has
      nothing to induce, which is why enzyme induction separates the two types
      clinically as well as biochemically.
    evidence:
    - reference: PMID:39456788
      reference_title: "Therapeutic Options for Crigler-Najjar Syndrome: A Scoping Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        CNS presents in the following forms: CNS type 1 (CNS1), the more severe
        form with the complete absence of UGT1A1 activity, and CNS type 2 (CNS2),
        with partial enzyme activity.
      explanation: >-
        States that the type 1 / type 2 distinction is a distinction between
        complete absence and partial retention of UGT1A1 activity. Evidence
        source is OTHER because this is a scoping review.
  - name: Missense alleles retaining partial UGT1A1 activity
    description: >-
      Type 2 genotypes retain measurable enzyme activity. In vitro
      characterisation of Crigler-Najjar missense alleles shows that residual
      activity is both allele-dependent and substrate-dependent, ranging in one
      series from undetectable to most of wild-type activity depending on which
      substrate is measured.
    evidence:
    - reference: PMID:19830808
      reference_title: "Crigler-Najjar syndrome in The Netherlands: identification of four novel UGT1A1 alleles, genotype-phenotype correlation, and functional analysis of 10 missense mutants."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We demonstrate that five mutants have residual activity that, depending on the substrate, varies from not detectable to 94% of wild-type UGT1A1 activity.
      explanation: >-
        Quantifies residual activity of Crigler-Najjar missense alleles in a
        cell-based assay, the molecular basis of the partial-deficiency type 2
        phenotype.
    - reference: PMID:19830808
      reference_title: "Crigler-Najjar syndrome in The Netherlands: identification of four novel UGT1A1 alleles, genotype-phenotype correlation, and functional analysis of 10 missense mutants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we have analyzed 19 CN patients diagnosed in The Netherlands (18) and in Belgium (1), and have identified 14 different UGT1A1 mutations, four of which are novel
      explanation: >-
        Gives the allelic heterogeneity of the cohort these functional data came
        from; there is no single recurrent Crigler-Najjar allele.
  - name: UGT1A1*28 promoter TA-repeat polymorphism in cis
    description: >-
      The Gilbert-syndrome promoter allele (an extra TA in the TATA box,
      UGT1A1*28) reduces UGT1A1 expression and was shown to be linked in cis to
      structural Crigler-Najjar alleles in this cohort. It is a modifier of
      expressed bilirubin level rather than an independent cause of
      Crigler-Najjar syndrome, and is the reason the same gene spans
      Crigler-Najjar and Gilbert's syndrome.
    evidence:
    - reference: PMID:19830808
      reference_title: "Crigler-Najjar syndrome in The Netherlands: identification of four novel UGT1A1 alleles, genotype-phenotype correlation, and functional analysis of 10 missense mutants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we show linkage of the UGT1A1 *28 promoter polymorphism (rs5719145insTA) to three structural mutations
      explanation: >-
        Documents the promoter polymorphism occurring in cis with structural
        Crigler-Najjar alleles, which is the observation behind treating it as a
        modifier rather than a separate cause.

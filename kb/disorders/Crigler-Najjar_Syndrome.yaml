name: Crigler-Najjar Syndrome
creation_date: "2026-08-22T00:00:00Z"
category: Mendelian
description: >-
  A rare autosomal recessive disorder of bilirubin metabolism caused by
  biallelic mutations in UGT1A1, the gene encoding the hepatic enzyme that
  glucuronidates bilirubin. Loss of that activity produces severe,
  non-haemolytic unconjugated hyperbilirubinaemia from the neonatal period. Two
  forms are distinguished by residual enzyme activity: type 1, with complete
  absence of UGT1A1 activity, severe jaundice, and a high risk of
  bilirubin-induced neurological dysfunction (kernicterus); and type 2, with
  partial activity, lower bilirubin levels, and little to no kernicterus risk.
  Crigler-Najjar syndrome sits at the severe end of the same UGT1A1
  activity-loss spectrum whose mild end is Gilbert's syndrome. Type 1 requires
  lifelong intensive phototherapy as containment while liver transplantation
  remains the only definitive cure; type 2 typically responds to phenobarbital,
  which induces the residual enzyme.
disease_term:
  preferred_term: Crigler-Najjar syndrome
  term:
    id: MONDO:0009044
    label: Crigler-Najjar syndrome
parents:
- Liver Disease
- Inherited Metabolic Disorder
has_subtypes:
- name: Type 1
  display_name: Crigler-Najjar syndrome type 1 (complete UGT1A1 deficiency)
  description: >-
    The severe form, caused by UGT1A1 mutations abolishing enzyme activity
    entirely. Severe unconjugated hyperbilirubinaemia appears in the neonatal
    period and carries a high risk of kernicterus. Management requires
    aggressive containment - prolonged daily phototherapy, exchange transfusion
    or plasmapheresis for crises - and liver transplantation is the only
    definitive cure. Phenobarbital does not work, because there is no residual
    enzyme to induce.
  subtype_term:
    preferred_term: Crigler-Najjar syndrome type 1
    term:
      id: MONDO:0021020
      label: Crigler-Najjar syndrome type 1
- name: Type 2
  display_name: Crigler-Najjar syndrome type 2 (partial UGT1A1 deficiency, Arias syndrome)
  description: >-
    The milder form, caused by UGT1A1 mutations that leave residual enzyme
    activity. Serum bilirubin is lower than in type 1 and the risk of
    kernicterus is low. Patients respond well to phenobarbital, which induces
    the residual enzyme, and most survive into adulthood without neurological
    damage.
  subtype_term:
    preferred_term: Crigler-Najjar syndrome type 2
    term:
      id: MONDO:0011725
      label: Crigler-Najjar syndrome type 2

    term:
      id: UBERON:0002420
      label: basal ganglion
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This occurs when bilirubin crosses the blood–brain barrier and binds to
      specific brain tissues.
    explanation: >-
      States the mechanism by which the hyperbilirubinaemia node produces this
      neurological consequence. Evidence source is OTHER because this is a
      scoping review.
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type I disease (CNS1) is characterized by severe jaundice and a high risk
      of neurologic sequelae (kernicterus), resulting from the complete absence
      of enzymatic activity; type II disease (CNS2) is a milder form with
      decreased enzyme activity, lower serum bilirubin levels, and little to no
      risk of kernicterus
    explanation: >-
      Grades the risk of reaching this node by subtype and ties that grading
      back to residual enzyme activity at the trigger node. Evidence source is
      OTHER because this is a scoping review.
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The timing of LT is critical, as it must be performed before the onset of
      irreversible brain damage (kernicterus), making early intervention
      essential.
    explanation: >-
      Establishes the irreversibility of this node's damage, which is the
      clinical reason the entry curates it as a terminal consequence rather
      than a treatable complication. Evidence source is OTHER because this is a
      scoping review.
phenotypes:
- category: Clinical
  name: Neonatal Jaundice
  description: >-
    Jaundice appears in the neonatal period and persists, in contrast to
    physiological neonatal jaundice which resolves. It is non-haemolytic and
    unaccompanied by hepatic dysfunction.
  phenotype_term:
    preferred_term: Prolonged neonatal jaundice
    term:
      id: HP:0006579
      label: Prolonged neonatal jaundice
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CNS results in nonhemolytic jaundice, with its most serious complication
      being bilirubin-induced neurologic dysfunction.
    explanation: >-
      Supports the jaundice phenotype and its non-haemolytic character.
      Evidence source is OTHER because this is a scoping review.
- category: Laboratory
  name: Unconjugated Hyperbilirubinaemia
  description: >-
    Marked elevation of the unconjugated (indirect) bilirubin fraction with a
    normal conjugated fraction. Levels reached in type 1 far exceed those of
    Gilbert's syndrome and can approach or exceed 30 mg/dL without treatment.
  phenotype_term:
    preferred_term: Unconjugated hyperbilirubinemia
    term:
      id: HP:0008282
      label: Unconjugated hyperbilirubinemia
  evidence:
  - reference: PMID:37602038
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a two-month-old Saudi girl who presented with persistent
      unconjugated hyperbilirubinemia, reaching levels as high as 30 mg/dL
      despite ineffective phototherapy.
    explanation: >-
      Documents the magnitude of the unconjugated elevation in untreated type 1
      disease. Evidence source is HUMAN_CLINICAL because this is a patient case
      report.
- category: Neurological
  name: Kernicterus
  description: >-
    Chronic bilirubin encephalopathy from deposition of unconjugated bilirubin
    in the basal ganglia and brainstem nuclei. High risk in type 1, little to no
    risk in type 2.
  subtype: Type 1
  phenotype_term:
    preferred_term: Kernicterus
    term:
      id: HP:0001343
      label: Kernicterus
  evidence:
  - reference: PMID:39456788
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Type I disease (CNS1) is characterized by severe jaundice and a high risk
      of neurologic sequelae (kernicterus), resulting from the complete absence
      of enzymatic activity
    explanation: >-
      Assigns the kernicterus phenotype specifically to type 1 and ties it to
      complete enzyme loss. Evidence source is OTHER because this is a scoping
      review.

    snippet: >-
      Crigler-Najjar syndrome (CN), a rare inherited disorder characterized by
      failure of bilirubin glucuronidation, can lead to severe disability and
      death from kernicterus. Gilbert syndrome is a more common, benign familial
      unconjugated hyperbilirubinemia. The underlying problem in both conditions
      is impaired bilirubin conjugation and elimination due to a mutation in
      uridine 5'-diphosphate glucuronyltransferase.
    explanation: >-
      Contrasts the severe kernicterus-prone course of Crigler-Najjar syndrome
      against the common benign course of allelic Gilbert syndrome.
treatments:
- name: Intensive Phototherapy
  description: >-
    Prolonged daily phototherapy photoisomerises unconjugated bilirubin in the
    skin into water-soluble products excretable without glucuronidation,
    bypassing the missing enzyme. In type 1 it is containment rather than cure -
    16-20 hours daily may be needed - and its efficacy declines with age as the
    surface-area-to-mass ratio falls. It does not restore UGT1A1 activity.

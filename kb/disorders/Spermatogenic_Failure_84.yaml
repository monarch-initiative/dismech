    snippet: "In our study, the patients carrying CFAP61 variants showed severe disorganizations of the axonemal structures with loss of CP, RSs, and IDAs, which was confirmed by IF staining of SPAG6, TSGA2, and DNAH1."
    explanation: Central pair, radial spoke and inner-arm loss in patient sperm.

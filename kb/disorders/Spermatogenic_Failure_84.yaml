animal_models:
- name: Cfap61 knockout mouse
  species: Mouse
  genotype: Cfap61-/- (knockout), homozygous
  publication: PMID:34792097
  description: >-
    Independent knockout lines give infertile males with MMAF, impaired radial
    spoke assembly in spermatids, axonemal scattering and reduced sperm
    counts, without PCD-like features.
  modeled_mechanisms:
  - target: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Radial spoke assembly is impaired in knockout spermatids.
    evidence:
    - reference: PMID:34792097
      reference_title: "CFAP61 is required for sperm flagellum formation and male fertility in human and mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "During early stages of Cfap61-/- spermatid development, the assembly of radial spoke components is impaired."
      explanation: Spoke assembly defect in the knockout.
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Knockout sperm have short, coiled and irregular flagella and impaired motility.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Knockout mice have reduced total sperm counts, whereas most men with
        truncating CFAP61 variants have normal sperm concentration; low counts
        in patients are limited to one man and the missense carriers.
    evidence:
    - reference: PMID:36659204
      reference_title: "Absence of murine CFAP61 causes male infertility due to multiple morphological abnormalities of the flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we found that cilia-and flagella-associated protein 61 (Cfap61) is highly expressed specifically in murine testes and show that the Cfap61-knockout male mice demonstrate MMAF phenotype, including sperm with short, coiled, and irregular flagella."
      explanation: An independent knockout line reproduces MMAF.
    - reference: PMID:36659204
      reference_title: "Absence of murine CFAP61 causes male infertility due to multiple morphological abnormalities of the flagella."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of Cfap61 resulted in severe morphological and behavior abnormalities in sperm, reduced total sperm counts, impaired sperm motility, and led to male infertility."
      explanation: Records the reduced counts behind the species divergence.
treatments:
- name: Intracytoplasmic Sperm Injection
  description: >-
    ICSI with ejaculated sperm bypasses the flagellar defect. One of two
    compound heterozygous men fathered a healthy child. In another couple the
    fertilization rate was high but embryos developed poorly and no pregnancy
    followed, possibly because of the sperm chromatin condensation defect.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Multiple Morphological Abnormalities of the Sperm Flagella
    description: Direct injection makes flagellar propulsion and form irrelevant to fertilization.
    evidence:
    - reference: PMID:35387802
      reference_title: "Biallelic CFAP61 variants cause male infertility in humans and mice with severe oligoasthenoteratozoospermia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two individuals accepted ICSI therapy using their own ejaculated sperm, and one of them succeeded in fathering a healthy baby."
      explanation: Live birth after ICSI with ejaculated sperm.
  evidence:
  - reference: PMID:35387802
    reference_title: "Biallelic CFAP61 variants cause male infertility in humans and mice with severe oligoasthenoteratozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two individuals accepted ICSI therapy using their own ejaculated sperm, and one of them succeeded in fathering a healthy baby."
    explanation: One live birth in two treated couples.
  - reference: PMID:38775994
    reference_title: "Identification of a novel CFAP61 homozygous splicing variant associated with multiple morphological abnormalities of the flagella."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, despite a ICSI procedure, pregnancy did not occur due to poor embryo quality at cleavage stage."
    explanation: Fertilization succeeded but no pregnancy resulted in a homozygous splice carrier.
- name: Genetic Counseling
  description: >-
    Counselling for autosomal recessive recurrence and carrier testing of
    relatives once the familial CFAP61 variants are known; sons conceived by
    ICSI inherit one variant.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38775994
    reference_title: "Identification of a novel CFAP61 homozygous splicing variant associated with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case underscores the significance of genetic counseling and testing, particularly for couples dealing with infertility and MMAF."
    explanation: The authors recommend counselling and testing for MMAF couples.
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings will expand the current understanding in the disease-causing mutations and the associated flagellar phenotypes of MMAF and provide guidance for genetic counseling and diagnosis of the disease."
    explanation: Genetic counselling named as an application of the molecular diagnosis.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Establishes the diagnosis. Patients were identified by whole-exome
    sequencing with Sanger confirmation; splice variants need RNA or minigene
    studies to confirm exon skipping.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38775994
    reference_title: "Identification of a novel CFAP61 homozygous splicing variant associated with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified this variant, which led to exon 12 skipping and the production of a truncated CFAP61 protein."
    explanation: Exome sequencing plus splicing analysis established the diagnosis.
- name: Semen Analysis
  description: >-
    Shows asthenozoospermia with MMAF, usually with normal sperm concentration
    and occasionally with oligozoospermia.
  evidence:
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, all the patients had asthenozoospermia, with <40% sperm motility or <32% progressive motility, except for P8, whose sperm motility and progressive motility were found normal in the routine semen analysis (Table 1)."
    explanation: Semen analysis findings in the family series.
- name: Transmission Electron Microscopy of Sperm Flagella
  description: >-
    Shows disorganized axonemes with loss of the central pair, radial spokes
    and inner dynein arms.
  diagnosis_term:
    preferred_term: Transmission Electron Microscopy
    term:
      id: NCIT:C18216
      label: Transmission Electron Microscopy
  evidence:
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transmission electron microscopy analyses revealed severe disorganized axonemal ultrastructures, and missings of central pair, RSs, and inner dynein arms were also observed and confirmed by immunofluorescence staining in spermatozoa from patients."
    explanation: TEM findings in patient sperm.
- name: Immunofluorescence of CFAP61 and CFAP251 in Sperm
  description: >-
    Absent CFAP61 and CFAP251 staining of sperm tails supports pathogenicity
    of the variants.
  evidence:
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP61 and CFAP251 signals were absent from sperm tails of the patients, which suggested the loss of functional CSC in sperm flagella."
    explanation: Immunostaining confirmed loss of both CSC subunits.

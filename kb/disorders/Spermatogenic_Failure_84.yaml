mechanistic_hypotheses:
- hypothesis_group_id: cfap61_sperm_restricted
  hypothesis_label: CFAP61 loss causes isolated male infertility without primary ciliary dyskinesia
  status: CANONICAL
  description: >-
    Patients in three Pakistani families were questioned for PCD features and
    had none, and Cfap61 knockout mice are infertile without PCD-like
    symptoms. The organ-specific axoneme stabilization role proposed for
    CFAP61 would explain why sperm, but not respiratory cilia, are affected. In
    Tetrahymena, loss of the orthologue does alter ciliary waveform, so a
    subtle ciliary defect in humans has not been excluded; no ciliary
    ultrastructure or nasal nitric oxide data from patients are available.
  evidence:
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we recruited three unrelated Pakistani families, having 11 primary infertile individuals diagnosed with MMAF without manifesting any primary ciliary dyskinesia (PCD) symptoms."
    explanation: No PCD symptoms in eleven affected men.
  - reference: PMID:34792097
    reference_title: "CFAP61 is required for sperm flagellum formation and male fertility in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We generated Cfap61 knockout mice that recapitulate the infertility phenotype of the human CFAP61 mutation, but without other symptoms usually observed in PCD."
    explanation: Knockout mice have no PCD-like phenotype.
  - reference: PMID:25694453
    reference_title: "The CSC proteins FAP61 and FAP251 build the basal substructures of radial spoke 3 in cilia."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "We show that in Tetrahymena, loss of either FAP61 or FAP251 reduces cell swimming and affects the ciliary waveform and that RS3 is either missing or incomplete, whereas RS1 and RS2 are unaffected."
    explanation: In a ciliate, the orthologue is needed for normal ciliary beating.

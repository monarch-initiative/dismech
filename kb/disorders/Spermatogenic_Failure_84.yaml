name: Spermatogenic Failure 84
creation_date: "2026-10-16T00:00:00Z"
category: Mendelian
synonyms:
- SPGF84
- spermatogenic failure 84
- CFAP61-related multiple morphological abnormalities of the sperm flagella
- CFAP61-related oligoasthenoteratozoospermia
description: >-
  Spermatogenic failure 84 (SPGF84) is autosomal recessive male infertility
  caused by biallelic variants in CFAP61. CFAP61 is a subunit of the
  calmodulin- and spoke-associated complex (CSC), which with CFAP91 and CFAP251
  builds the base of radial spoke 3 (RS3); CFAP61 forms part of the RS3 stem
  and also binds the radial spoke stalk and head. Without it, radial spoke
  components fail to assemble in spermatids, CFAP251 is lost from the
  flagellum, and the axoneme becomes unstable and scatters as spermiogenesis
  proceeds.

  Affected men have asthenoteratozoospermia with multiple morphological
  abnormalities of the sperm flagella (MMAF): absent, short, coiled, bent and
  irregular-caliber flagella. Electron microscopy shows disorganized axonemes
  with loss of the central pair, radial spokes and inner dynein arms. Sperm
  concentration is usually normal, but compound heterozygous missense
  carriers have presented with oligoasthenoteratozoospermia, and one patient
  had defective sperm chromatin condensation. Respiratory and other ciliary
  symptoms are absent. ICSI with ejaculated sperm has produced a live birth,
  but one couple had poor embryo development.
disease_term:
  preferred_term: spermatogenic failure 84
  term:

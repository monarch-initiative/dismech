    label: spermatogenic failure 84
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  MONDO cross-references the phenotype as OMIM 620409. ClinGen has not
  classified CFAP61 for spermatogenic failure 84: no CFAP61 row is present in
  the ClinGen gene-disease validity export dated 2026-10-14
  (data/clingen/gene_validity.csv), so gene_disease_validity is left absent.
  No GeneReviews chapter covers this disease (Bookshelf index snapshot
  2026-09-10). A study reporting low CFAP61 expression in testes of infertile
  men and reduced testosterone secretion after CFAP61 knockdown in a Leydig
  cell line (PMID:37982895) is not used here: it involves no CFAP61 variants
  and no patients with this disease.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic CFAP61 variants: homozygous truncating and
    splice variants in consanguineous families, and compound heterozygous
    missense and splice variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent Sanger sequencing of all the available family members confirmed that the CFAP61 variants were recessively inherited from their heterozygous parents except P11 whose sperm morphology was not yet assessed (Figures 1C–E)."
    explanation: Recessive segregation in three consanguineous families.
pathophysiology:
- name: Loss of CFAP61
  description: >-
    Frameshift, nonsense and splice alleles remove or truncate CFAP61, and
    compound heterozygous missense alleles reduce it in sperm. CFAP61 is a
    structural CSC subunit at the base of radial spoke 3 that also interacts
    with the radial spoke stalk and head.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CFAP61
    term:
      id: hgnc:15872
      label: CFAP61
  molecular_functions:
  - preferred_term: structural constituent of the axonemal cytoskeleton
    modifier: DECREASED
    term:
      id: GO:0005200
      label: structural constituent of cytoskeleton
  cellular_components:
  - preferred_term: Radial spoke base 3
    term:
      id: GO:0120342
      label: radial spoke base 3
  downstream:
  - target: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
    causal_link_type: DIRECT
    description: >-
      Without CFAP61 its CSC partner CFAP251 is absent from the sperm tail,
      and radial spoke components fail to assemble in developing spermatids.
    evidence:
    - reference: PMID:35174165
      reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Furthermore, we observed a complete absence of CFAP251 proteins in the sperm tails of the patients with CFAP61 variants, indicating that CFAP61 is essential for the localization of CFAP251 in sperm flagella."
      explanation: Loss of CFAP61 removes CFAP251 from patient sperm.
  evidence:
  - reference: PMID:34792097
    reference_title: "CFAP61 is required for sperm flagellum formation and male fertility in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that CFAP61 interacts with the CSC, radial spoke stalk and head."
    explanation: CFAP61 binds the CSC and radial spoke components.
  - reference: PMID:35387802
    reference_title: "Biallelic CFAP61 variants cause male infertility in humans and mice with severe oligoasthenoteratozoospermia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further immunofluorescence assays revealed markedly reduced CFAP61 staining in the sperm flagella."
    explanation: Compound heterozygous missense and splice alleles reduce CFAP61 in sperm.
  - reference: PMID:38775994
    reference_title: "Identification of a novel CFAP61 homozygous splicing variant associated with multiple morphological abnormalities of the flagella."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we identified this variant, which led to exon 12 skipping and the production of a truncated CFAP61 protein."
    explanation: A splice allele truncates the protein.
- name: Loss of the Calmodulin- and Spoke-Associated Complex from the Sperm Axoneme
  description: >-
    The CSC (CFAP61, CFAP91 and CFAP251 with calmodulin) sits at the base of
    radial spoke 3 and links it to the doublet microtubules. Loss of any one
    subunit destabilizes the others: CFAP251 is absent from sperm of men with
    CFAP61 variants, and in Cfap61 knockout spermatids radial spoke assembly is
    impaired. In Tetrahymena, FAP61-null cilia lack part of the RS3 stem.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: Radial spoke 3
    term:
      id: GO:0120335
      label: radial spoke 3
  biological_processes:
  - preferred_term: Radial spoke assembly
    modifier: DECREASED
    term:
      id: GO:0062177
      label: radial spoke assembly
  downstream:
  - target: Sperm Axonemal Disorganization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Radial spokes anchor the central pair; without them the central pair
      rotates and is lost, and later in spermiogenesis the whole axoneme
      becomes unstable. How loss of one spoke base destabilizes the entire
      sperm axoneme is not established.
    evidence:
    - reference: PMID:34792097
      reference_title: "CFAP61 is required for sperm flagellum formation and male fertility in human and mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "As spermiogenesis progresses, the axoneme in Cfap61-/- cells becomes unstable and scatters, and the distribution of intraflagellar transport proteins is disrupted."
      explanation: The axoneme destabilizes after the initial spoke assembly defect.
  evidence:
  - reference: PMID:34792097
    reference_title: "CFAP61 is required for sperm flagellum formation and male fertility in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "During early stages of Cfap61-/- spermatid development, the assembly of radial spoke components is impaired."
    explanation: Radial spoke assembly fails in knockout spermatids.
  - reference: PMID:25694453
    reference_title: "The CSC proteins FAP61 and FAP251 build the basal substructures of radial spoke 3 in cilia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, FAP251-null cilia lack an arch-like density at the RS3 base, whereas FAP61-null cilia lack an adjacent portion of the RS3 stem region."
    explanation: Cryo-electron tomography of Tetrahymena cilia places the orthologue in the RS3 stem.
  - reference: PMID:35174165
    reference_title: "Biallelic Variants in CFAP61 Cause Multiple Morphological Abnormalities of the Flagella and Male Infertility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CFAP61 and CFAP251 signals were absent from sperm tails of the patients, which suggested the loss of functional CSC in sperm flagella."
    explanation: Both CSC subunits are missing from patient sperm.
- name: Sperm Axonemal Disorganization
  description: >-
    Most flagellar cross-sections show severely disorganized axonemes with
    missing doublets, dynein arms, radial spokes and central pair; where a 9+2
    arrangement remains, the central pair is often rotated. The central pair
    proteins SPAG6 and TSGA2 and the inner-arm heavy chain DNAH1 are lost.
    Mitochondrial sheath malformation and mitochondria trapped in residual
    cytoplasm are also reported.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: Sperm
    term:

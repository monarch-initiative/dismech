discussions:
- discussion_id: iscu_tissue_specific_splicing_muscle_restriction
  prompt: >-
    Why is ISCU myopathy confined to skeletal muscle when ISCU is an essential
    Fe-S scaffold expressed in every energy-demanding tissue, and which splicing
    regulators set that restriction?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Skeletal-Muscle-Predominant ISCU Protein Deficiency
  rationale: >-
    The defining paradox of the disease is that a housekeeping defect produces an
    organ-restricted phenotype. The resolution is that the founder mutation's
    aberrant splicing is far more efficient in skeletal muscle (the highest
    fraction of mis-spliced transcript) than in heart or liver, so only muscle
    becomes severely ISCU-deficient while other tissues retain enough normal
    protein. The regulators implicated - low muscle levels of the repressor
    PTBP1, muscle-differentiation factor MyoD enhancing mis-splicing, and other
    candidate factors (RBM39/IGF2BP1, SRSF3) - explain part but not all of the
    tissue selectivity, and the quantitative determinants of who mis-splices how
    much remain incompletely defined. This matters clinically because it is why
    the heart and CNS are spared, and mechanistically because splice-modulating
    therapy works by shifting exactly this balance.
  proposed_experiments:
  - experiment_id: iscu_splicing_regulator_map
    name: Tissue-resolved map of ISCU splicing regulators
    description: >-
      Systematically quantify mis-splicing against levels/activity of PTBP1,
      MyoD, SRSF3 and candidate factors across human and humanized-mouse tissues
      to determine which regulators are rate-limiting for the muscle-selective
      pseudoexon inclusion, and whether modulating them corrects the defect.
- discussion_id: iscu_human_specific_founder_allele_model_gap
  prompt: >-
    Can a faithful in-vivo model of the human founder disease be built when the
    causal mutation lies in a human/primate-specific intronic sequence and
    complete Iscu loss is lethal in mice?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ISCU Deep-Intronic Founder Splice Variant
  - pathophysiology#Skeletal-Muscle-Predominant ISCU Protein Deficiency
  rationale: >-
    Model evidence for the disease exists but its translational fidelity is
    genuinely uncertain. A conventional Iscu knockout is embryonic lethal, so it
    cannot model the viable muscle-restricted disease; human-ISCU transgenic mice
    reproduce the tissue-specific splicing but not the founder mutation in its
    native context, because the deep-intronic sequence that the mutation acts on
    is human-specific. Yeast (S. cerevisiae isu1) engineered with homologous
    residues supported pathogenicity and dominance of the missense alleles but
    cannot model human tissue-specific splicing at all. The open question is
    whether a humanized knock-in carrying the founder intronic allele can
    recapitulate the muscle-selective mis-splicing and the exertional metabolic
    phenotype, which is a prerequisite for testing muscle-directed splice
    correction in vivo.
  proposed_experiments:
  - experiment_id: iscu_humanized_knockin_mouse
    name: Humanized ISCU founder-allele knock-in mouse
    description: >-
      Engineer a mouse carrying the human ISCU intronic context with the
      c.418+382G>C founder variant and test for muscle-predominant pseudoexon
      inclusion, SDH-negative fibres, mitochondrial iron accumulation and an
      exertional metabolic phenotype, then use it to evaluate splice-switching
      ASO delivery and durability in vivo.

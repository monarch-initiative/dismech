genetic:
- name: ISCU
  gene_term:
    preferred_term: ISCU
    term:
      id: hgnc:29882
      label: ISCU
  relationship_type: CAUSATIVE
  notes: >-
    ISCU encodes the iron-sulfur cluster scaffold protein, produced as cytosolic
    and mitochondrial isoforms. The classic disease allele is the homozygous
    deep-intronic founder variant c.418+382G>C (IVS5+382G>C) on a shared
    northern-Swedish haplotype, which activates a cryptic splice acceptor and
    causes pseudoexon inclusion, a frameshift, a premature stop codon and a
    truncated non-functional protein - a loss-of-function splicing allele. Two
    rarer allelic presentations are recorded rather than split out: compound
    heterozygosity for the intronic variant plus a c.149G>A (p.Gly50Glu) missense
    change, seen in two brothers of Swedish/Finnish origin with a more severe
    phenotype including muscle wasting and cardiomyopathy; and a single de novo
    heterozygous c.287G>T (p.Gly96Val) missense variant reported to act
    dominantly, with a broader slowly progressive multisystem phenotype.
  evidence:
  - reference: PMID:18296749
    reference_title: Myopathy with lactic acidosis is linked to chromosome 12q23.3-24.11 and caused by an intron mutation in the ISCU gene resulting in a splicing defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our data strongly suggest that an intron mutation in the ISCU gene, leading to incorrectly spliced mRNA, is the cause of myopathy with lactic acidosis in this family."
    explanation: Establishes ISCU as the causal gene via the intronic splicing mutation.
  - reference: PMID:19567699
    reference_title: Clinical manifestation and a new ISCU mutation in iron-sulphur cluster deficiency myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The brothers were compound heterozygous for the deep intronic mutation and had a c.149 G>A missense mutation in exon 3 changing a completely conserved glycine residue to a glutamate."
    explanation: Documents the compound-heterozygous p.Gly50Glu genotype with a more severe phenotype.
  - reference: PMID:24573684
    reference_title: The presence of multiple cellular defects associated with a novel G50E iron-sulfur cluster scaffold protein (ISCU) mutation leads to development of mitochondrial myopathy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the G50E mutation results in compromised interaction with the sulfur donor NFS1 and the J-protein HSCB, thus impairing the rate of Fe-S cluster synthesis"
    explanation: Provides the molecular loss-of-function mechanism of the G50E missense allele.

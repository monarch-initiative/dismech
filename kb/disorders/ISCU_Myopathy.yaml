notes: >-
  Scope and lump/split. This is a single-gene (ISCU) autosomal recessive
  myopathy and is curated as one DISEASE entry. The overwhelming majority of
  reported patients carry the homozygous northern-Swedish founder variant
  c.418+382G>C; two rarer allelic presentations are recorded in the genetic
  block rather than split out, because they are the same gene and the same core
  Fe-S mechanism: the compound-heterozygous intronic + p.Gly50Glu genotype
  (more severe, with muscle wasting and cardiac involvement) and a single de
  novo dominant p.Gly96Val case with a broader, slowly progressive phenotype.
  The entry is written around the classic founder disease; where a claim comes
  only from a missense/dominant case it is attributed as such.

  Module conformance. No mechanism module was conformed to. mitochondrial_dysfunction
  is an aging-hallmark module and is not an appropriate conformance target for a
  Mendelian Fe-S biogenesis defect; no muscle-energy-failure module exists at
  time of writing. The pathophysiology is therefore curated in full here.

  GeneReviews. A GeneReviews chapter exists (PMID:20301757, "Myopathy with
  Deficiency of ISCU") but has been RETIRED and is flagged "FOR HISTORICAL
  REFERENCE ONLY". It remains the expert clinical baseline and is tagged
  GeneReviews in the top-level references; its retired status is noted here so
  the tag is not read as a current chapter.

  Provenance. Built from an Edison/Falcon deep-research report
  (research/ISCU_Myopathy-deep-research-falcon.md), which cites by author-year
  and DOI keys. Every DOI was resolved to its PubMed record and all evidence is
  cited and verified against PMID abstracts/full text. Two PMIDs asserted in the
  report prose were wrong and were corrected before use: the report attributed
  the Mochel 2008 AJHG paper to PMID 18296749 (that PMID is actually Olsson 2008
  HMG) and the Holmes-Hampton 2016 ASO paper to PMID 27729411 (an unrelated
  potassium-channel paper); the correct PMIDs are 18304497 and 28007899
  respectively. Yeast (S. cerevisiae isu1) modelling of the missense alleles is
  described in the tissue-specific-splicing discussion rather than as an
  experimental_models block.

name: ISCU Myopathy
creation_date: "2026-09-04T23:23:40Z"
category: Mendelian
description: >-
  ISCU myopathy (hereditary myopathy with lactic acidosis; myopathy with
  deficiency of succinate dehydrogenase and aconitase; the "Swedish" myopathy
  with exercise intolerance) is an autosomal recessive mitochondrial myopathy of
  iron-sulfur (Fe-S) cluster biogenesis. Almost all patients described to date
  come from a founder population in northern Sweden and are homozygous for a
  single deep-intronic variant in ISCU, c.418+382G>C (historically IVS5+382G>C),
  which strengthens a weak cryptic splice acceptor site so that a pseudoexon
  carrying a premature stop codon is retained in the mature transcript. The
  result is a truncated, non-functional ISCU protein.

  The organising feature of the disease is that this splicing error is tissue
  specific. ISCU is the scaffold on which nascent Fe-S clusters are assembled,
  and it is expressed in every energy-demanding organ, yet aberrant splicing is
  far more efficient in skeletal muscle than in heart or liver. Muscle is
  therefore severely ISCU-deficient while other tissues are largely spared,
  which is why an essential housekeeping defect produces a myopathy rather than a
  multisystem mitochondrial disease. Loss of Fe-S clusters cripples the
  Fe-S-dependent enzymes aconitase and succinate dehydrogenase (respiratory
  complex II), with lesser impairment of complexes I and III, so the muscle
  cannot sustain oxidative phosphorylation.

  Clinically this manifests as lifelong exercise intolerance: minor exertion
  triggers premature fatigue, disproportionate tachycardia and dyspnea, and
  early lactate accumulation, while more intense or sustained exertion can
  precipitate rhabdomyolysis, myoglobinuria and life-threatening lactic
  acidosis, with near-normal strength between episodes. Muscle biopsy shows
  succinate-dehydrogenase-negative fibres and mitochondrial iron accumulation.
  The entry is built as a causal chain from the founder splice variant through
  Fe-S enzyme failure to the exertional phenotype, with the tissue-specific
  splicing step made explicit because it is what confines the disease to muscle.

pathophysiology:
- name: ISCU Deep-Intronic Founder Splice Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A single deep-intronic transversion in ISCU,
    c.418+382G>C (historically IVS5+382G>C), lies well within intron 4/5 and
    lengthens a polypyrimidine tract, strengthening an otherwise weak cryptic
    splice acceptor site. Almost all patients are homozygous for this founder
    allele on a shared northern-Swedish haplotype.
  genes:
  - preferred_term: ISCU
    term:
      id: hgnc:29882
      label: ISCU
  evidence:
  - reference: PMID:18304497
    reference_title: Splice mutation in the iron-sulfur cluster scaffold protein ISCU causes myopathy with exercise intolerance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found a single mutation in ISCU that likely strengthens a weak splice acceptor site, with consequent exon retention."
    explanation: Identifies the causal ISCU splice-acceptor-strengthening mutation, the initiating lesion of the chain.
  downstream:
  - target: Cryptic Splice-Site Activation and Pseudoexon Inclusion
    causal_link_type: DIRECT
    description: >-
      The strengthened acceptor site permits inclusion of an aberrant pseudoexon
      in the processed transcript.
    evidence:
    - reference: PMID:18296749
      reference_title: Myopathy with lactic acidosis is linked to chromosome 12q23.3-24.11 and caused by an intron mutation in the ISCU gene resulting in a splicing defect.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Sequencing of the product revealed that the mutation activates cryptic splice sites in intron 5 resulting in aberrant mRNA containing 100 bp of the intron."
      explanation: States that the mutation activates cryptic splicing and produces aberrant intron-containing mRNA.
- name: Cryptic Splice-Site Activation and Pseudoexon Inclusion
  biological_scale: MOLECULAR
  description: >-
    The activated cryptic acceptor drives inclusion of a pseudoexon (reported as
    ~86-100 bp of intronic sequence) into most ISCU transcripts. The inserted
    sequence shifts the reading frame and introduces a premature stop codon, so
    the transcript encodes a truncated, non-functional ISCU protein.
  biological_processes:
  - preferred_term: aberrant pre-mRNA splicing of ISCU
    term:
      id: GO:0008380
      label: RNA splicing
    modifier: INCREASED
  evidence:
  - reference: PMID:19567699
    reference_title: Clinical manifestation and a new ISCU mutation in iron-sulphur cluster deficiency myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The intronic mutation affects mRNA splicing and results in inclusion of pseudoexons in most transcripts in muscle. The pseudoexon inclusion results in a change in the reading frame and appearance of a premature stop codon."
    explanation: States that pseudoexon inclusion frameshifts the transcript and creates a premature stop codon.
  downstream:
  - target: Skeletal-Muscle-Predominant ISCU Protein Deficiency
    causal_link_type: DIRECT
    description: >-
      Because the mis-splicing is far more efficient in skeletal muscle, the
      truncated transcript translates into severe loss of functional ISCU
      selectively in muscle.
- name: Skeletal-Muscle-Predominant ISCU Protein Deficiency
  biological_scale: MOLECULAR
  description: >-
    ISCU protein is nearly undetectable in patient skeletal muscle while
    fibroblasts, heart and liver retain substantial normal protein. This tissue
    selectivity is the pivotal feature of the disease: it is created by the
    splicing machinery rather than by tissue-specific expression of ISCU, with
    the highest fraction of mis-spliced transcript in skeletal muscle. Low
    levels of the splicing repressor PTBP1 in muscle, and muscle-differentiation
    factors such as MyoD, enhance the mis-splicing; oxidative stress from muscle
    work further destabilises what little normal ISCU is made.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  evidence:
  - reference: PMID:21165651
    reference_title: Tissue-specific splicing of ISCU results in a skeletal muscle phenotype in myopathy with lactic acidosis, while complete loss of ISCU results in early embryonic death in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest level of incorrectly spliced ISCU mRNA was found in skeletal muscle, while the normal splice form predominated in patient heart."
    explanation: Shows the mis-splicing, and hence ISCU deficiency, is concentrated in skeletal muscle and spares the heart.
  - reference: PMID:23035118
    reference_title: "Tissue specificity of a human mitochondrial disease: differentiation-enhanced mis-splicing of the Fe-S scaffold gene ISCU renders patient cells more sensitive to oxidative stress in ISCU myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ISCU protein was nearly undetectable in patient skeletal muscle, but was higher in patient myoblasts, fibroblasts, and lymphoblasts."
    explanation: Documents severe, muscle-selective loss of ISCU protein relative to other patient cell types.
  downstream:
  - target: Failure of Mitochondrial Fe-S Cluster Assembly
    causal_link_type: DIRECT
    description: >-
      Loss of the scaffold protein removes the platform on which nascent Fe-S
      clusters are built.
- name: Failure of Mitochondrial Fe-S Cluster Assembly
  biological_scale: MOLECULAR
  description: >-
    ISCU is the scaffold on which nascent iron-sulfur clusters are assembled in
    complex with the cysteine desulfurase NFS1, frataxin and other factors, then
    delivered to apoproteins. Severe ISCU loss in muscle therefore impairs
    assembly and delivery of Fe-S clusters to the enzymes that require them.
  biological_processes:
  - preferred_term: iron-sulfur cluster assembly
    term:
      id: GO:0016226
      label: iron-sulfur cluster assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:21165651
    reference_title: Tissue-specific splicing of ISCU results in a skeletal muscle phenotype in myopathy with lactic acidosis, while complete loss of ISCU results in early embryonic death in mice.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This results in a deficiency of Fe-S cluster proteins, affecting the TCA cycle and the respiratory chain."
    explanation: States that the splicing defect produces a deficiency of Fe-S cluster proteins hitting the TCA cycle and respiratory chain.
  downstream:
  - target: Deficiency of Fe-S Cluster Enzymes (Aconitase and Complex II)
    causal_link_type: DIRECT
    description: >-
      Apoproteins that cannot receive a cluster lose activity, most severely the
      Fe-S enzymes aconitase and complex II.
  - target: Mitochondrial Iron Overload and Oxidative Stress
    causal_link_type: DIRECT
    description: >-
      Failed cluster assembly and loss of aconitase/IRP1 function dysregulate
      cellular iron handling, driving mitochondrial iron accumulation.
- name: Deficiency of Fe-S Cluster Enzymes (Aconitase and Complex II)
  biological_scale: MOLECULAR
  description: >-
    The Fe-S-dependent enzymes lose activity. The greatest deficiencies are in
    succinate dehydrogenase (respiratory complex II) and aconitase, with lesser
    impairment of complexes I and III and the Rieske protein. Histochemically
    this appears as succinate-dehydrogenase-negative muscle fibres.
  molecular_functions:
  - preferred_term: aconitate hydratase activity
    term:
      id: GO:0003994
      label: aconitate hydratase activity
    modifier: DECREASED
  - preferred_term: succinate dehydrogenase (complex II) activity
    term:
      id: GO:0008177
      label: succinate dehydrogenase (quinone) activity
    modifier: DECREASED
  evidence:
  - reference: PMID:1918374
    reference_title: Deficiency of skeletal muscle succinate dehydrogenase and aconitase. Pathophysiology of exercise in a novel human muscle oxidative defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deficiency of succinate dehydrogenase was associated with decreased levels of mitochondrial aconitase"
    explanation: The original human description documents combined deficiency of complex II (SDH) and aconitase.
  - reference: PMID:28007899
    reference_title: Use of antisense oligonucleotides to correct the splicing error in ISCU myopathy patient cell lines.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The greater deficiencies were observed in succinate dehydrogenase (complex II) and aconitase and to a lesser extent in NADH dehydrogenase (complex I), cytochrome bc1 complex (complex III), and the Rieske protein"
    explanation: Ranks the enzyme deficiencies, with SDH and aconitase most affected and complexes I/III less so.
  downstream:
  - target: Impaired Oxidative Phosphorylation and TCA Cycle Flux
    causal_link_type: DIRECT
    description: >-
      Loss of complex II and aconitase blocks the TCA cycle and respiratory
      electron flow, limiting NADH-driven oxidative ATP production.
- name: Impaired Oxidative Phosphorylation and TCA Cycle Flux
  biological_scale: CELLULAR
  description: >-
    With the TCA cycle and respiratory chain crippled, muscle mitochondria
    cannot extract oxygen or generate ATP normally. Exercise testing shows
    markedly reduced maximal oxygen uptake and impaired muscle oxygen extraction
    despite a hyperkinetic circulatory response.
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  - preferred_term: tricarboxylic acid cycle
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:1918374
    reference_title: Deficiency of skeletal muscle succinate dehydrogenase and aconitase. Pathophysiology of exercise in a novel human muscle oxidative defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe oxidative limitation was characterized by impaired muscle oxygen extraction indicated by subnormal systemic arteriovenous oxygen difference (a-v O2 diff) in maximal exercise"
    explanation: Directly demonstrates the impaired oxidative metabolism (poor muscle oxygen extraction) that follows respiratory-chain enzyme deficiency.
  downstream:
  - target: Compensatory Glycolysis and Lactate Accumulation
    causal_link_type: DIRECT
    description: >-
      Blocked oxidative ATP production forces reliance on glycolysis, generating
      excess pyruvate and lactate during exertion.
  - target: Muscle Energy Failure on Exertion
    causal_link_type: DIRECT
    description: >-
      The oxidative deficit means ATP supply cannot meet demand once muscle is
      worked.
  - target: PGC-1alpha Remodeling and FGF21 Secretion
    causal_link_type: DIRECT
    description: >-
      Chronic mitochondrial energy starvation triggers a compensatory
      transcriptional remodeling program.
- name: Mitochondrial Iron Overload and Oxidative Stress
  biological_scale: CELLULAR
  description: >-
    Disrupted Fe-S/aconitase-IRP1 iron sensing dysregulates iron homeostasis,
    producing intracellular and mitochondrial iron accumulation in muscle
    (visible as iron-positive fibres on Perls' staining) together with reactive
    oxygen species. Oxidative stress in turn destabilises residual ISCU, a
    feed-forward loop that worsens the deficiency. Iron-mediated oxidative injury
    is a biologically plausible contributor to myofiber damage but has not been
    demonstrated as the proximate cause of human myofiber necrosis.
  biological_processes:
  - preferred_term: intracellular iron ion homeostasis
    term:
      id: GO:0006879
      label: intracellular iron ion homeostasis
    modifier: DECREASED
  - preferred_term: response to oxidative stress
    term:
      id: GO:0006979
      label: response to oxidative stress
    modifier: INCREASED
  evidence:
  - reference: PMID:18304497
    reference_title: Splice mutation in the iron-sulfur cluster scaffold protein ISCU causes myopathy with exercise intolerance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A marked reduction of ISCU mRNA and mitochondrial ISCU protein in patient muscle was associated with a decrease in the iron regulatory protein IRP1 and intracellular iron overload in skeletal muscle, consistent with a muscle-specific alteration of iron homeostasis in this disease."
    explanation: Links ISCU loss to reduced IRP1 and intracellular iron overload in muscle.
  - reference: PMID:23035118
    reference_title: "Tissue specificity of a human mitochondrial disease: differentiation-enhanced mis-splicing of the Fe-S scaffold gene ISCU renders patient cells more sensitive to oxidative stress in ISCU myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "oxidative stress resulting from skeletal muscle work destabilizes the small amounts of normal ISCU protein generated in patient skeletal muscles."
    explanation: Supports the feed-forward loop in which oxidative stress further destabilises residual ISCU.
  downstream:
  - target: Exertional Rhabdomyolysis and Myoglobinuria
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Iron-mediated oxidative injury is a plausible contributor to the myofiber
      breakdown seen with severe exertion, though not proven as its proximate
      cause.
- name: Compensatory Glycolysis and Lactate Accumulation
  biological_scale: CELLULAR
  description: >-
    Unable to burn substrate oxidatively, muscle shifts to glycolysis, so
    exertion produces disproportionate rises in venous lactate and pyruvate and,
    in severe episodes, systemic lactic acidosis.
  biological_processes:
  - preferred_term: glycolytic process
    term:
      id: GO:0006096
      label: glycolytic process
    modifier: INCREASED
  evidence:
  - reference: PMID:1918374
    reference_title: Deficiency of skeletal muscle succinate dehydrogenase and aconitase. Pathophysiology of exercise in a novel human muscle oxidative defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "with exaggerated increases in venous lactate and pyruvate in relation to oxygen uptake (VO2) but low lactate/pyruvate ratios in maximal exercise."
    explanation: Documents the exaggerated exertional lactate/pyruvate rise arising from the oxidative block.
  downstream:
  - target: Lactic acidosis
    causal_link_type: DIRECT
    description: >-
      Severe exertion drives lactate to life-threatening levels, the acidosis in
      the disease's historical name.
  - target: Increased circulating lactate concentration
    causal_link_type: DIRECT
    description: >-
      Elevated blood lactate is the routine biochemical correlate.
- name: PGC-1alpha Remodeling and FGF21 Secretion
  biological_scale: CELLULAR
  description: >-
    Chronic Fe-S/energy starvation elicits a coordinated adaptive response in
    muscle: a shift toward type I oxidative fibres and higher capillary density,
    up-regulation of PGC-1alpha and fatty-acid-oxidation and ketogenic genes, and
    secretion of FGF21, which is reflected by elevated circulating FGF21. This is
    a compensatory branch rather than a step toward injury, and FGF21 is a
    supportive but non-specific biomarker.
  evidence:
  - reference: PMID:23943793
    reference_title: "Elevated FGF21 secretion, PGC-1α and ketogenic enzyme expression are hallmarks of iron-sulfur cluster depletion in human skeletal muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "muscle tissue from patients deficient in the Fe-S cluster scaffold protein ISCU showed a predominance of type I oxidative muscle fibers and higher capillary density, enhanced expression of transcriptional co-activator PGC-1α and increased mitochondrial fatty acid oxidation genes."
    explanation: Documents the PGC-1alpha-driven compensatory remodeling in Fe-S-deficient patient muscle.
  - reference: PMID:23943793
    reference_title: "Elevated FGF21 secretion, PGC-1α and ketogenic enzyme expression are hallmarks of iron-sulfur cluster depletion in human skeletal muscle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enhanced muscle FGF21 expression was reflected by elevated circulating FGF21 levels in the patients"
    explanation: Supports elevated circulating FGF21 as a systemic readout of the compensatory response.
- name: Muscle Energy Failure on Exertion
  biological_scale: TISSUE
  description: >-
    The functional endpoint at tissue level: skeletal muscle cannot meet the ATP
    demand of even modest exertion. This produces premature fatigue, cramps and
    pain, and drives the disproportionate cardiovascular effort (tachycardia,
    dyspnea, palpitations) by which the body tries to compensate for the
    oxidative deficit.
  evidence:
  - reference: PMID:1918374
    reference_title: Deficiency of skeletal muscle succinate dehydrogenase and aconitase. Pathophysiology of exercise in a novel human muscle oxidative defect.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated a 22-yr-old Swedish man with lifelong exercise intolerance marked by premature exertional muscle fatigue, dyspnea, and cardiac palpitations"
    explanation: Describes the exertional energy-failure phenotype central to the disease.
  downstream:
  - target: Exertional Rhabdomyolysis and Myoglobinuria
    causal_link_type: DIRECT
    description: >-
      Sustained or intense exertion beyond the muscle's oxidative capacity can
      break down myofibers.
  - target: Exercise intolerance
    causal_link_type: DIRECT
  - target: Exertional dyspnea
    causal_link_type: DIRECT
  - target: Tachycardia
    causal_link_type: DIRECT
  - target: Myalgia
    causal_link_type: DIRECT
  - target: Muscle weakness
    causal_link_type: DIRECT
- name: Exertional Rhabdomyolysis and Myoglobinuria
  biological_scale: ORGANISM
  description: >-
    Under severe or sustained exertion, energy-starved myofibers break down,
    releasing myoglobin into the circulation and urine. These episodes carry the
    disease's acute risk (acute kidney injury, hyperkalemia, severe acidosis),
    with typically full recovery of strength between attacks.
  evidence:
  - reference: PMID:21196119
    reference_title: Transient restoration of succinate dehydrogenase activity after rhabdomyolysis in iron-sulphur cluster deficiency myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease manifestations include muscle fatigability, dyspnoea, cardiac palpitations and episodic myoglobinuria."
    explanation: Names episodic myoglobinuria among the disease manifestations.
  downstream:
  - target: Rhabdomyolysis
    causal_link_type: DIRECT
  - target: Myoglobinuria
    causal_link_type: DIRECT

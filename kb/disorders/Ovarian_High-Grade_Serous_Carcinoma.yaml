- name: Hyperthermic Intraperitoneal Chemotherapy at Interval Cytoreductive Surgery
  description: >-
    Heated cisplatin perfused through the peritoneal cavity at the time of interval
    cytoreductive surgery, after neoadjuvant carboplatin and paclitaxel. The
    rationale is compartmental: metastatic ovarian cancer sits on peritoneal
    surfaces that intravenous drug reaches poorly, so the drug is delivered into
    the compartment that carries the tumour burden. In the OVHIPEC-1 phase 3 trial
    the addition of HIPEC extended median overall survival from 33.9 to 45.7 months
    without increasing grade 3-4 toxicity. Benefit appears specific to the interval
    (post-neoadjuvant) setting; it has not been shown after primary debulking
    surgery, and the mechanism of benefit is not established.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: hyperthermic intraperitoneal chemotherapy
    term:
      id: NCIT:C91835
      label: Hyperthermic Intraperitoneal Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  target_mechanisms:
  - target: Transcoelomic Dissemination and Spheroid Formation
    treatment_effect: INHIBITS
    description: >-
      HIPEC attacks transcoelomic disease in its own compartment. Intravenous
      chemotherapy penetrates peritoneal nodules poorly, whereas intraperitoneal
      perfusion places cytotoxic drug in direct contact with the implanted deposits,
      and the peritoneal-plasma barrier holds a high intratumoural concentration
      while keeping systemic exposure low.
    evidence:
    - reference: PMID:36077477
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: In a two-compartment model, the peritoneal-plasma barrier blocks the leakage of chemotherapeutic agents from peritoneal cavity and tumor tissues to local vessels, thus maintaining a higher concentration of chemotherapeutic agents within the tumor tissues to facilitate tumor apoptosis and a lower concentration of chemotherapeutic agents within the local vessels to decrease systemic toxicity.
      explanation: States the compartmental pharmacology by which intraperitoneal delivery acts on peritoneally disseminated tumour rather than through the systemic circulation.
    - reference: PMID:36077477
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: systemic treatment with intravenous chemotherapeutic agents for peritoneal metastasis appears to be less effective due to the poor blood supply to the peritoneal surface with low drug penetration into tumor nodules
      explanation: States the delivery deficit that intraperitoneal administration is intended to overcome, tying the treatment to the transcoelomic route of spread.
  - target: Homologous Recombination Deficiency
    treatment_effect: ACTIVATES
    description: >-
      Beyond delivery, hyperthermia is reported to degrade BRCA2 and suppress
      homologous recombination, pharmacologically inducing an HRD-like state that
      would broaden platinum synergy past the germline-BRCA subset. The link is
      ACTIVATES because HIPEC is proposed to increase, not block, homologous
      recombination deficiency, and the therapeutic gain follows from that
      induced deficiency. Note this is a review-level mechanistic assertion; the
      same review calls for HIPEC outcomes to be correlated with BRCA and HRR
      status precisely because the claim is not yet clinically demonstrated.
    evidence:
    - reference: PMID:36191972
      reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: The hyperthermia enhances drug tissue penetration, synergizes with several cytotoxic drugs including cisplatin, degrades BRCA2, suppresses homologous recombination, and elicits an anticancer immune response.
      explanation: Attributes BRCA2 degradation and homologous-recombination suppression to the hyperthermia component, which is what links HIPEC to the HRD node.
  evidence:
  - reference: PMID:29342393
    reference_title: Hyperthermic Intraperitoneal Chemotherapy in Ovarian Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the addition of HIPEC to interval cytoreductive surgery resulted in longer recurrence-free survival and overall survival than surgery alone and did not result in higher rates of side effects
    explanation: OVHIPEC-1, a multicentre phase 3 randomised trial, is the primary clinical evidence for adding HIPEC to interval cytoreductive surgery in stage III epithelial ovarian cancer.
  - reference: PMID:29342393
    reference_title: Hyperthermic Intraperitoneal Chemotherapy in Ovarian Cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The median overall survival was 33.9 months in the surgery group and 45.7 months in the surgery-plus-HIPEC group.
    explanation: Quantifies the survival difference reported in the trial, supporting the effect size stated in the description.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: the available data from two phase III trials seem to suggest that the addition of HIPEC to interval debulking surgery after neoadjuvant chemotherapy significantly improves PFS and OS. Conversely, HIPEC does not appear to offer any advantage after primary debulking surgery.
    explanation: Qualifies the indication - the benefit is confined to the interval-debulking setting, so this supports the treatment only as scoped in its name and description.
  notes: >-
    Scoped deliberately to the interval-debulking indication. HIPEC after primary
    debulking surgery, and HIPEC in recurrent disease, are separate questions with
    different and less favourable evidence, and should not be inferred from this
    entry.
discussions:
- discussion_id: gap_hgsoc_polq_resistance_pivot
  prompt: >-
    Can POLQ (DNA polymerase theta) be exploited as a second pivot point in
    HRD HGSOC by combining PARP inhibition with allosteric POLQ inhibitors or
    POLQ-directed PROTAC degraders, and does this prevent the
    microhomology-mediated BRCA reversion path that drives clinical
    resistance?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#PARP and Platinum Synthetic Lethality
  - pathophysiology#POLQ-Mediated Microhomology Repair Escape
  - pathophysiology#BRCA Reversion and Restored HRR Resistance
  rationale: >-
    POLQ is dispensable in normal cells but the dominant alternative end-
    joining polymerase in HRD tumor cells under replication stress. Its
    microhomology-driven mutagenesis is the same machinery that generates
    BRCA reversion alleles in PARP-inhibitor-resistant HGSOC. Stabilizing
    a defined POLQ conformational state with an allosteric binder, or
    physically degrading POLQ with a PROTAC warhead, would test whether
    blocking the POLQ pivot funnels resistant subclones into a
    non-viable interactome state instead of restored HRR. This is exactly
    the kind of pivot-point control envisioned by the interactome
    rebalancing framework: a stress (PARP inhibition) forces a cell into
    POLQ-dependent survival, and a second drug locks the cell out of that
    survival state.
  proposed_experiments:
  - experiment_id: exp_hgsoc_polq_pivot_synthetic_lethality
    name: Allosteric POLQ stabilization versus PROTAC degradation in PARP-inhibitor-resistant HGSOC organoids
    description: >-
      Treat BRCA-associated and HRD-positive HGSOC patient-derived organoids
      and isogenic cell-line panels with (a) PARP inhibitor monotherapy,
      (b) PARP inhibitor plus allosteric POLQ binder tuned to lock POLQ in
      a catalytically inert conformation, and (c) PARP inhibitor plus a
      POLQ-directed PROTAC warhead. Track tumor-cell killing, microhomology-
      mediated end-joining activity, the rate of BRCA1/BRCA2 reversion-allele
      emergence in single-cell lineage-traced cultures and circulating tumor
      DNA from patient-derived xenografts, and replication-fork dynamics by
      iPOND or DNA-fiber assays. Compare to a PARG-inhibitor combination arm
      to dissect whether PARG-driven fork stalling and POLQ-dependent escape
      are independent or coupled pivots.
    experiment_type:
      preferred_term: controlled perturbation experiment
    model_systems:
    - name: HRD-positive HGSOC patient-derived organoid and PDX panel
      description: >-
        Matched BRCA1-mutant, BRCA2-mutant, HRD-positive/BRCA-wild-type, and
        HR-proficient HGSOC organoids, including paired pre-treatment and
        PARP-inhibitor-progression specimens to capture clinically
        observed reversion landscapes.
      experimental_model_type: ORGANOID
      organism:
        preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
      tissue_term:
        preferred_term: fallopian tube
        term:
          id: UBERON:0003889
          label: fallopian tube
      cell_types:
      - preferred_term: fallopian tube secretory epithelial cell
        term:
          id: CL:4030006
          label: fallopian tube secretory epithelial cell
    perturbations:
    - name: Allosteric POLQ conformational stabilization
      target: pathophysiology#POLQ-Mediated Microhomology Repair Escape
      description: >-
        Small-molecule allosteric binders that stabilize a catalytically
        inert POLQ conformation to test whether conformational locking is
        sufficient to suppress microhomology-mediated repair without
        triggering compensatory pathways.
      genes:
      - preferred_term: POLQ
        term:
          id: hgnc:9186
          label: POLQ
    - name: POLQ PROTAC degradation
      target: pathophysiology#POLQ-Mediated Microhomology Repair Escape
      description: >-
        Targeted POLQ degradation via PROTAC warhead to compare adaptor
        loss with conformational locking and to quantify the rate of BRCA
        reversion emergence in the absence of POLQ.
      genes:
      - preferred_term: POLQ
        term:
          id: hgnc:9186
          label: POLQ
      effect: DECREASED
    - name: PARP inhibitor pressure
      target: pathophysiology#PARP and Platinum Synthetic Lethality
      description: >-
        Maintain selective PARP-inhibitor pressure to force HRD cells into
        POLQ-dependent survival before measuring escape dynamics.
    readouts:
    - name: Microhomology-mediated end-joining activity
      target: pathophysiology#POLQ-Mediated Microhomology Repair Escape
      biological_processes:
      - preferred_term: alternative end joining
        term:
          id: GO:0097681
          label: double-strand break repair via alternative nonhomologous end joining
      direction: NEGATIVE
    - name: BRCA reversion allele emergence
      target: pathophysiology#BRCA Reversion and Restored HRR Resistance
      biological_processes:
      - preferred_term: double-strand break repair via homologous recombination
        term:
          id: GO:0000724
          label: double-strand break repair via homologous recombination
      direction: NEGATIVE
      interpretation: >-
        A reduction in microhomology-flanked BRCA reversion alleles under
        POLQ perturbation would directly support POLQ-driven escape as the
        mutagenic source of restored-HRR resistance in HGSOC.
    decision_criterion: >-
      The POLQ pivot is supported if either allosteric stabilization or
      PROTAC degradation of POLQ, combined with PARP-inhibitor pressure,
      produces durable tumor-cell killing without emergence of microhomology-
      flanked BRCA reversion alleles, and if at least one perturbation
      produces a stronger and more durable response than PARP inhibitor
      alone.
    would_support:
    - pathophysiology#POLQ-Mediated Microhomology Repair Escape
    - pathophysiology#BRCA Reversion and Restored HRR Resistance
    evidence:
    - reference: PMID:39577422
      reference_title: "Elucidating acquired PARP inhibitor resistance in advanced prostate cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among reversions mediated by frameshift deletions, 60% are flanked by DNA
        microhomologies, implicating POLQ-mediated repair.
      explanation: >-
        The clinical TOPARP-B observation provides the mechanistic rationale
        for targeting POLQ as a way to prevent the dominant reversion
        signature observed in PARP-inhibitor-resistant disease.
    - reference: PMID:36243543
      reference_title: "Emergence of BRCA Reversion Mutations in Patients with Metastatic Castration-resistant Prostate Cancer After Treatment with Rucaparib."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        No baseline BRCA reversion mutations were observed in 100 BRCA+ patients.
        NGS identified somatic BRCA reversion mutations in 39% (39/100) of
        patients after progression.
      explanation: >-
        TRITON2 establishes BRCA reversion as the most prevalent acquired
        resistance event under PARP-inhibitor pressure, providing the
        clinical endpoint that POLQ-pivot blockade would seek to prevent.
- discussion_id: hipec_mechanism_of_benefit
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does adding hyperthermic intraperitoneal chemotherapy to interval
    cytoreductive surgery extend survival in advanced ovarian cancer - is the
    gain compartmental drug delivery, hyperthermic potentiation of cisplatin,
    heat-induced suppression of homologous recombination, or an anticancer
    immune response - and which patients benefit?
  attaches_to:
  - pathophysiology#Transcoelomic Dissemination and Spheroid Formation
  - pathophysiology#Homologous Recombination Deficiency
  rationale: >-
    HIPEC is one of the few interventions in this entry with a randomised overall
    survival benefit, yet the pathograph cannot say which node carries that
    benefit. Several candidate mechanisms are proposed together in the review
    literature and are not separated by the clinical trials, and the benefit is
    setting-dependent - present after neoadjuvant chemotherapy and interval
    debulking, absent after primary debulking - which itself argues that the
    effective mechanism is conditional on tumour state rather than a fixed
    property of the perfusion. Resolving this determines whether HIPEC should be
    modelled as acting on peritoneal dissemination, on homologous recombination,
    or on both, and whether BRCA/HRR status is a selection marker. Until then the
    two target_mechanisms links on the HIPEC treatment should be read as
    competing candidate routes, not as an established parallel mechanism.
  evidence:
  - reference: PPR:PPR1273953
    reference_title: Development of a noninvasive murine model of hyperthermic intraperitoneal
      chemotherapy (HIPEC) treatment for ovarian cancer
    supports: SUPPORT
    evidence_source: OTHER
    snippet: extending overall survival by nearly 12 months, yet the mechanisms of benefit remain unknown
    explanation: >-
      States the gap directly - a measured survival benefit whose mechanism is
      unestablished. Tagged OTHER rather than MODEL_ORGANISM because this
      sentence is the preprint's introduction restating the human OVHIPEC-1
      trial result, not a finding from its murine model; the model-derived
      snippets from the same preprint elsewhere in this entry remain
      MODEL_ORGANISM.
  - reference: PMID:36077477
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy (HIPEC): An Overview of the Molecular and Cellular Mechanisms of Actions and Effects on Epithelial Ovarian Cancers.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: many unknown aspects of HIPEC, including detailed mechanisms of actions, along with the effectiveness and safety for the treatment of EOCs, warrant further investigation
    explanation: A dedicated mechanism review reaches the same conclusion, so the gap is not an artefact of one source.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A meta-analysis of retrospective studies including both patients with primary advanced EOC and those with recurrent platinum-sensitive EOC failed to detect a benefit in terms of progression-free survival (PFS) or overall survival (OS) from the addition of HIPEC after surgery.
    explanation: Records the negative side of the evidence base, which is why the benefit is scoped to the interval-debulking setting rather than to HIPEC generally.
  - reference: PMID:36191972
    reference_title: 'Hyperthermic Intraperitoneal Chemotherapy in the Management of Primary Epithelial Ovarian Cancer: A Debated Issue for Gynecologic Oncologists.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the clinical outcome of patients who undergo HIPEC should be correlated with BRCA status and homologous recombination repair status
    explanation: Names the specific stratification that would test the homologous-recombination route against the delivery route.
  notes: >-
    Raised from monarch-initiative/dismech#6426. The preprint's noninvasive murine
    HIPEC model, recorded under animal_models, is one route to separating these
    candidate mechanisms experimentally.

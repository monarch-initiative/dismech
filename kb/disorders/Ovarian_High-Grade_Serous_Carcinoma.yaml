      label: double-strand break repair via alternative nonhomologous end joining
  evidence:
  - reference: PMID:39577422
    reference_title: "Elucidating acquired PARP inhibitor resistance in advanced prostate cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among reversions mediated by frameshift deletions, 60% are flanked by DNA
      microhomologies, implicating POLQ-mediated repair.
    explanation: >-
      TOPARP-B post-progression sequencing connects microhomology-flanked
      reversion events to POLQ-mediated repair, supporting POLQ as the escape
      polymerase under PARP-inhibitor pressure in HRD tumors including HGSOC.
  downstream:
  - target: BRCA Reversion and Restored HRR Resistance
    description: >-
      Microhomology-mediated repair generates the frameshift-deletion reversion
      events that restore HRR gene reading frames.
- name: BRCA Reversion and Restored HRR Resistance
  conforms_to: "dna_repair_synthetic_lethality#Restored HRR and Acquired Resistance"
  description: >-
    Resistant HGSOC subclones can acquire BRCA1 or BRCA2 reversion mutations
    that restore open reading frames and re-establish HRR function. Once HRR
    is restored, PARP-inhibitor and platinum sensitivity are lost and the
    synthetic-lethal relationship is broken. Reversion alleles are detectable
    in circulating tumor DNA at progression and are the principal mechanism
    of acquired PARP-inhibitor resistance in BRCA-associated HGSOC.
  genes:
  - preferred_term: BRCA1
    term:
      id: hgnc:1100
      label: BRCA1
  - preferred_term: BRCA2
    term:
      id: hgnc:1101
      label: BRCA2
  biological_processes:
  - preferred_term: double-strand break repair via homologous recombination
    modifier: INCREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:36243543
    reference_title: "Emergence of BRCA Reversion Mutations in Patients with Metastatic Castration-resistant Prostate Cancer After Treatment with Rucaparib."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No baseline BRCA reversion mutations were observed in 100 BRCA+ patients.
      NGS identified somatic BRCA reversion mutations in 39% (39/100) of
      patients after progression.
    explanation: >-
      TRITON2 post-progression plasma analysis directly documents acquired
      BRCA reversion mutations after PARP-inhibitor treatment, the canonical
      restored-HRR resistance pathway (demonstrated here in BRCA-associated
      cancer and shared by BRCA-mutant HGSOC).
  - reference: PMID:39577422
    reference_title: "Elucidating acquired PARP inhibitor resistance in advanced prostate cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data support the need for restored HRR function in PARPi resistance.
    explanation: >-
      TOPARP-B resistance analysis supports restored HRR as a requirement for
      PARP-inhibitor resistance in HRD tumors.
- name: Copy-Number Driven Chromosomal Instability
  description: >-
    HGSOC is a copy-number driven carcinoma with extensive focal amplifications, deletions,
    aneuploidy, and structural rearrangement. This genomic architecture distinguishes it
    from point-mutation-dominated carcinomas.
  biological_processes:
  - preferred_term: chromosome segregation
    modifier: ABNORMAL
    term:
      id: GO:0007059
      label: chromosome segregation
  evidence:
  - reference: PMID:36804485
    reference_title: "Amplified therapeutic targets in high-grade serous ovarian carcinoma - a review of the literature with quantitative appraisal."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      High-grade serous ovarian carcinoma is a unique cancer characterised by universal
      TP53 mutations and widespread copy number alterations.
    explanation: >-
      This review-level synthesis succinctly captures the defining copy-number-driven
      genomic architecture of HGSOC.
  - reference: PMID:21720365
    reference_title: "Integrated genomic analyses of ovarian carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report that high-grade serous ovarian cancer is characterized by TP53
      mutations in almost all tumours (96%); low prevalence but statistically recurrent
      somatic mutations in nine further genes including NF1, BRCA1, BRCA2, RB1 and CDK12;
      113 significant focal DNA copy number aberrations
    explanation: >-
      TCGA directly documents the high focal copy-number alteration burden that defines
      HGSOC.
  downstream:
  - target: CCNE1 Amplification and Replication Stress
    description: Recurrent amplification of cell-cycle drivers emerges within the unstable genome.
- name: CCNE1 Amplification and Replication Stress
  description: >-
    CCNE1 amplification is a recurrent copy-number event in HGSOC that reinforces G1/S
    progression and replication stress. It marks a clinically important copy-number-driven
    subset with adverse therapeutic implications.
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: INCREASED
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  - preferred_term: DNA replication
    modifier: ABNORMAL
    term:
      id: GO:0006260
      label: DNA replication
  evidence:
  - reference: PMID:36804485
    reference_title: "Amplified therapeutic targets in high-grade serous ovarian carcinoma - a review of the literature with quantitative appraisal."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Forty-four genes are found to have evidence as amplified therapeutic targets; the
      five highest scoring genes are CCNE1, PAX8, URI1, PRKCI and FAL1.
    explanation: >-
      This review identifies CCNE1 as one of the strongest amplified therapeutic target
      candidates in HGSOC.
  downstream:
  - target: Cell Population Proliferation
    description: CCNE1 amplification reinforces rapid cell-cycle entry and tumor growth.
- name: Cell Population Proliferation
  description: >-
    The combined effects of TP53 dysfunction, HRD-associated genomic damage, and recurrent
    cell-cycle driver amplification converge on sustained malignant proliferation of serous
    epithelial tumor cells.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: EMT and Mesenchymal Plasticity
    description: >-
      Sustained proliferation of the established tumour supplies the cell
      population in which EMT-like transcriptional programs arise.
- name: Transcoelomic Dissemination and Spheroid Formation
  description: >-
    Ovarian cancer typically metastasizes by shedding into ascites rather than first
    through
    the bloodstream. Tumor cells form multicellular spheroids that survive in suspension
    and
    implant across peritoneal surfaces.
  evidence:
  - reference: PMID:27612856
    reference_title: Mesothelial cells interact with tumor cells for the formation of ovarian cancer multicellular spheroids in peritoneal effusions.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Epithelial ovarian cancer (EOC) dissemination is primarily mediated by the shedding of tumor cells from the primary site into ascites where they form multicellular spheroids that rapidly lead to peritoneal carcinomatosis.
    explanation: This directly supports the dominant transcoelomic mechanism of ovarian cancer metastasis.
  biological_processes:
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  downstream:
  - target: Immune Evasion
    description: >-
      The peritoneal metastatic niche accumulates myeloid-derived suppressor cells,
      blunting antitumour immunity against the disseminated tumour.
  - target: Tumor Angiogenesis
    description: >-
      Peritoneal implants depend on angiogenic support for outgrowth, the basis
      for anti-VEGF maintenance therapy in advanced disease.
  - target: Mesothelial Crosstalk and Platinum Resistance
    description: >-
      Disseminated cells and spheroids engage mesothelial and stromal cells on
      peritoneal surfaces, establishing the survival programs that blunt platinum
      sensitivity.
- name: Mesothelial Crosstalk and Platinum Resistance
  description: >-
    Disseminated ovarian cancer cells engage mesothelial and stromal cells within
    the
    peritoneum, creating FN1-AKT and related survival programs that protect tumor
    cells from
    platinum-induced apoptosis.
  evidence:
  - reference: PMID:31904865
    reference_title: Ovarian cancer-associated mesothelial cells induce acquired platinum-resistance in peritoneal metastasis via the FN1/Akt signaling pathway.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mechanistically, OCAMs can induce decreased platinum-sensitivity in OvCa cells via induction of the FN1/Akt signaling pathway via cell-to-cell interactions.
    explanation: This supports a direct microenvironmental mechanism of platinum resistance in peritoneal metastasis.
  biological_processes:
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
- name: EMT and Mesenchymal Plasticity
  conforms_to: "invasion_and_metastasis#Epithelial-Mesenchymal Transition Activation"
  description: >-
    EMT-like transcriptional programs facilitate detachment, invasion, and mesothelial
    implantation, while also contributing to treatment resistance and recurrence.
  evidence:
  - reference: PMID:41687476
    reference_title: Epithelial-mesenchymal transition (EMT) and cellular plasticity in Ovarian cancer.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In ovarian cancer, this shift may be one of the reasons the disease spreads so readily and comes back despite intensive treatment.
    explanation: This supports EMT as a contributor to ovarian cancer dissemination and recurrence after treatment.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  downstream:
  - target: Transcoelomic Dissemination and Spheroid Formation
    description: >-
      EMT-like programs drive detachment from the primary lesion, allowing shed
      cells to form the multicellular spheroids that seed the peritoneum.
- name: Tumor Angiogenesis
  description: >-
    Ovarian cancer metastases depend on angiogenic support within the peritoneal cavity,
    and anti-VEGF therapy remains part of maintenance treatment for advanced-stage
    disease.
  evidence:
  - reference: PMID:40690248
    reference_title: 'Ovarian Cancer: A Review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most patients with advanced-stage ovarian cancer receive maintenance therapy with bevacizumab (a monoclonal antibody that blocks angiogenesis) and/or poly-adenosine diphosphate ribose polymerase (PARP) inhibitors.
    explanation: The clinical use of bevacizumab maintenance therapy supports angiogenesis as a key dependency of advanced ovarian cancer.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
- name: Immune Evasion
  description: >-
    Metastatic ovarian cancer develops an immunosuppressive microenvironment in which
    myeloid-derived suppressor cells accumulate and blunt antitumor immune responses.
  evidence:
  - reference: PMID:37508575
    reference_title: Myeloid-Derived Suppressor Cells (MDSCs) in Ovarian Cancer-Looking Back and Forward.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Consequently, the high abundance of these cells often leads to immunosuppression, tumor growth, treatment failure, and poor prognosis.
    explanation: This ovarian cancer review supports immune evasion through accumulation of immunosuppressive myeloid-derived suppressor cells in the tumor microenvironment.
  biological_processes:
  - preferred_term: negative regulation of immune response
    modifier: INCREASED
    term:
      id: GO:0050777
      label: negative regulation of immune response

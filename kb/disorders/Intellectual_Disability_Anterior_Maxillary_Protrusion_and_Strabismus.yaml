    explanation: Confirms the autosomal recessive mode of inheritance at the point of gene identification.
pathophysiology:
- name: Biallelic SOBP Truncating Variant and Loss of Nuclear SOBP
  biological_scale: MOLECULAR
  description: >-
    Homozygous truncating variants in SOBP (6q21) remove or destabilise sine
    oculis binding protein homolog, a nuclear protein carrying two FCS-type zinc
    finger domains, nuclear localisation signals, and highly conserved sequence
    motifs. The functional consequence is not merely reduced protein: in the
    orthologous mouse allele, wild-type protein is targeted to the nucleus
    whereas mutant isoforms are mislocalised to the cytoplasm, so the truncated
    product is excluded from the compartment in which SOBP acts. This is the
    initiating molecular lesion of the syndrome.
  genes:
  - preferred_term: SOBP
    term:
      id: hgnc:29256
      label: SOBP
  molecular_functions:
  - preferred_term: zinc ion binding
    term:
      id: GO:0008270
      label: zinc ion binding
    modifier: DECREASED
  cellular_components:
  - preferred_term: nucleus
    term:
      id: GO:0005634
      label: nucleus
  downstream:
  - target: Loss of SOBP Repression of SIX1+EYA Transcriptional Activity
    causal_link_type: DIRECT
    description: >-
      Without nuclear SOBP there is no SOBP-SIX1/EYA complex, so the repressive
      input onto SIX1+EYA target-gene transcription is lost.
    evidence:
    - reference: PMID:34414417
      reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Co-immunoprecipitation and immunofluorescence experiments demonstrate that Sobp binds to and colocalizes with Six1 in the cell nucleus."
      explanation: The SOBP-SIX1 interaction is nuclear, so a mutant protein retained in the cytoplasm cannot form the complex - this is what links the localisation defect to loss of repression.
  - target: Limbic System SOBP Deficiency During Synaptogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same loss of functional nuclear SOBP is proposed to deprive the limbic
      system of SOBP during its postnatal synaptogenic window. This is the
      neurodevelopmental arm of the lesion, running in parallel to the
      SIX1+EYA-dependent craniofacial and otic arms; the intermediate steps
      between loss of nuclear SOBP and limbic synaptogenesis are not
      established, and it is not known whether this arm is SIX1+EYA-dependent.
    evidence:
    - reference: PMID:21035105
      reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "In situ RNA expression studies in postnatal mouse brain showed strong expression in the limbic system at the time interval of active synaptogenesis."
      explanation: Establishes that SOBP is present in the limbic system during synaptogenesis, which is what makes loss of nuclear SOBP a plausible cause of limbic SOBP deficiency. PARTIAL because the edge is inferred from an expression pattern in mouse, not from a measured consequence of the human truncating variant.
  evidence:
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the identification of a truncating mutation in the SOBP that is responsible for causing both syndromic and nonsyndromic ID in the same family."
    explanation: Identifies a truncating SOBP variant as the causal lesion in the MRAMS kindred.
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The protein encoded by the SOBP, sine oculis binding protein ortholog, is a nuclear zinc finger protein."
    explanation: Establishes the gene product as a nuclear zinc finger protein, the entity lost by the truncating variant.
  - reference: PMID:18579736
    reference_title: "Jxc1/Sobp, encoding a nuclear zinc finger protein, is critical for cochlear growth, cell fate, and patterning of the organ of corti."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transiently expressed wild-type protein is targeted to the nucleus, but mutant isoforms were mislocalized in the cytoplasm."
    explanation: Transfection experiments show that mutant Sobp isoforms fail to reach the nucleus, establishing loss of nuclear SOBP (not merely reduced expression) as the molecular consequence.
  - reference: PMID:18579736
    reference_title: "Jxc1/Sobp, encoding a nuclear zinc finger protein, is critical for cochlear growth, cell fate, and patterning of the organ of corti."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Jxc1 encodes a nuclear protein that has two FCS-type zinc finger domains (PS51024) and bears nuclear localization signals and highly conserved sequence motifs."
    explanation: Defines the domain architecture (two FCS-type zinc fingers plus NLS) that a truncating variant disrupts.
- name: Loss of SOBP Repression of SIX1+EYA Transcriptional Activity
  biological_scale: MOLECULAR
  description: >-
    SOBP is a co-factor of the SIX1 homeodomain transcription factor. It binds
    SIX1 and colocalises with it in the nucleus, and it binds the EYA1 and EYA2
    co-activators; in luciferase reporter assays SOBP interferes with, and
    represses, SIX1+EYA1 and SIX1+EYA2 transcriptional activation. SIX1 in turn
    is required for normal expression of Sobp in the mandibular arch, so the two
    sit in a reciprocal regulatory relationship. Loss of SOBP therefore
    de-represses SIX1+EYA target-gene output. This is the same SIX1/EYA1 axis
    whose heterozygous disruption causes branchio-oto-renal syndrome, which is
    why SOBP has been proposed as a BOR candidate gene, and it explains why a
    single molecular lesion produces otic, craniofacial, and dental phenotypes
    together.
  genes:
  - preferred_term: SIX1
    term:
      id: hgnc:10887
      label: SIX1
  - preferred_term: EYA1
    term:
      id: hgnc:3519
      label: EYA1

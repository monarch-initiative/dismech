- name: Limbic System SOBP Deficiency During Synaptogenesis
  biological_scale: CELLULAR
  description: >-
    In situ RNA expression in postnatal mouse brain shows strong Sobp expression
    in the limbic system during the interval of active synaptogenesis. The
    limbic system regulates learning, memory, and affective behaviour, and this
    expression pattern is unusual among intellectual-disability genes, most of
    which are not limbic-restricted. Comparative proteomics between +/jc and
    jc/jc mouse brain detected 24 proteins differing by more than 1.5-fold,
    including two interacting proteins, dynamin and pacsin1, both of which
    function in synaptic vesicle endocytosis. The proposed route from SOBP loss
    to cognition is therefore failure of limbic circuit assembly during a

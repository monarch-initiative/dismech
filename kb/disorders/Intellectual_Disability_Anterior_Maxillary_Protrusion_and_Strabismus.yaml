inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The syndrome segregates as an autosomal recessive trait: the parents are
    healthy first cousins, both obligate heterozygous carriers, and affected
    siblings of both sexes are homozygous for a truncating SOBP variant.
    Expressivity is variable within the sibship, with one homozygous sibling
    lacking the craniofacial features entirely.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:17618476
    reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
    supports: SUPPORT

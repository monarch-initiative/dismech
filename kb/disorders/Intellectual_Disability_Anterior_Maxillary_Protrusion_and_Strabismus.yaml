    reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the sibs with normal intelligence had jaw or dental anomalies."
    explanation: Co-segregation of the jaw and dental findings with the cognitive phenotype supports them being part of the syndrome rather than an unrelated familial trait.
- name: Impaired Limbic Circuit Function
  biological_scale: ORGANISM
  description: >-
    The neurobehavioural endpoint. All affected siblings had severe intellectual
    disability. In one sibling the phenotype presented without any jaw or dental
    anomaly and with temporal lobe epilepsy and severe psychosis; because that
    individual carries the same homozygous SOBP truncating variant, SOBP loss of
    function produces both a syndromic and a nonsyndromic form of intellectual
    disability within a single family. The limbic-restricted expression of SOBP
    is the proposed anatomical explanation for a cognitive phenotype accompanied
    by temporal-lobe epilepsy and psychosis rather than by a structural brain
    malformation - brain MRI in these patients was normal.

name: Intellectual Disability, Anterior Maxillary Protrusion, and Strabismus
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Intellectual disability, anterior maxillary protrusion, and strabismus (MRAMS
  syndrome; also catalogued by OMIM as "impaired intellectual development,
  anterior maxillary protrusion, and strabismus" and by Orphanet as "anterior
  maxillary protrusion-strabismus-intellectual disability syndrome") is an
  ultra-rare autosomal recessive neurodevelopmental and craniofacial syndrome
  caused by biallelic truncating variants in SOBP at 6q21. SOBP encodes sine
  oculis binding protein homolog, a nuclear FCS-type zinc finger protein that
  binds SIX1 and the EYA co-activators and represses SIX1+EYA transcriptional
  output. The syndrome was delineated in a single consanguineous Israeli-Arab
  kindred in which seven of eleven siblings were affected: all had severe
  intellectual disability, and six of the seven additionally had anterior
  maxillary protrusion with vertical maxillary excess, open bite, prominent
  crowded teeth, and strabismus (predominantly esotropia). Subclinical cochlear
  hearing loss was documented in one patient, echoing the cochlear phenotype of
  the orthologous mouse mutant. Notably, the same homozygous SOBP truncating
  variant in this family also produced NONSYNDROMIC intellectual disability with
  temporal lobe epilepsy and severe psychosis in one sibling who lacked the jaw
  and dental anomalies, so SOBP loss of function spans a syndromic and a
  nonsyndromic presentation within one genotype.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: >-
  Scope. This entry covers the biallelic-SOBP human syndrome. Evidence is
  intrinsically thin: the disorder rests essentially on one consanguineous
  kindred (PMID:17618476 clinical delineation; PMID:21035105 gene
  identification), so every human claim here derives from that pedigree and
  should be read as such. The mechanistic arms are supported by orthologous
  model-system work (mouse jackson circler/Jxc1, Xenopus, mouse mandibular
  arch), which is tagged MODEL_ORGANISM or IN_VITRO rather than presented as
  human evidence.
  Deep research. Two providers were run, falcon (Edison) and claude_code; both
  reports are in research/. Both were treated as leads only. Falcon proposed
  several ontology identifiers that are wrong on inspection (NCIT:C15329 is
  Surgical Procedure, not Supportive Care; NCIT:C51902 is not Physical Therapy),
  so every term in this entry was bound from an independent OAK lookup instead.
  Claude_code supplied the c.1981C>T (p.Arg661Ter) HGVS nomenclature, which was
  then verified against the ClinVar variant record before use, and also supplied
  several block quotations attributed to PMID:34414417 that are not present in
  that abstract; those were discarded and only abstract-verifiable sentences
  were quoted.
  GeneReviews. PubMed was searched for a GeneReviews chapter for both SOBP and
  "anterior maxillary protrusion"; none exists, so the GeneReviews phenotype
  baseline was not available and the HPO annotation set for OMIM:613671 plus the
  two primary papers were used instead.
  Phenotype completeness gap. The HPO annotation set for OMIM:613671 records
  joint hypermobility (HP:0001382) in 7/7 affected siblings and short attention
  span (HP:0000736) in 4/7. Neither statement appears in the abstract of either
  primary paper, and no other citable source with a quotable snippet was found,
  so both are recorded here rather than asserted as evidence-backed phenotypes.
  The same annotation set records esotropia, amblyopia, hypermetropia and visual
  impairment, which are likewise not abstract-quotable and are referenced only
  in prose.
  Strabismus is deliberately not modeled in the pathograph. It is one of the
  three name-giving features and is VERY_FREQUENT and diagnostic, but no cited
  source establishes a mechanism for it in this syndrome. The only mechanistic
  hint available is PMID:39948700, a review of strabismus across 255 genetic
  syndromes, which supports a neurological rather than a primary orbital or
  extraocular-muscle basis for the strabismus of intellectual-disability
  syndromes in general but makes no SOBP-specific claim. Positing an
  ocular-motor or binocular-alignment node here would assert a SOBP-specific
  mechanism that no source supports, so the feature is left as an
  evidence-backed phenotype with no pathophysiology node until a source that
  addresses SOBP or the SIX1+EYA axis directly is available. Note that SIX1 and
  EYA1 do act in cranial placode and ocular development, so a placodal or
  ocular-motor arm is a plausible future extension rather than a closed
  question.
  Module conformance. Conformance to
  pharyngeal_arch_patterning_serial_homology was considered and deliberately NOT
  declared. That module requires a serially homologous malformation bundle
  across multiple arch derivatives (mandible + maxilla + zygoma + ear) arising
  from cranial-neural-crest depletion or EDN1-DLX arch-identity failure. The
  reported MRAMS craniofacial phenotype is confined to the maxilla and dentition
  with no mandibular, malar, or auricular malformation, and the SOBP lesion acts
  through SIX1+EYA co-regulation rather than through either module mechanism.
  The SIX1/EYA1 axis SOBP regulates is the branchio-oto-renal (BOR) axis; a
  future six1_eya_placodal_craniofacial module would be the natural shared home
  for SOBP with SIX1 and EYA1.

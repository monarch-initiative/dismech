      label: regulation of transcription by RNA polymerase II
    modifier: DYSREGULATED
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  downstream:
  - target: Disrupted Craniofacial and Odontogenic Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      De-repressed SIX1+EYA target-gene output in the first pharyngeal arch and
      tooth germ perturbs jaw and dental morphogenesis.
    evidence:
    - reference: PMID:34414417
      reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "altering Sobp levels disrupts otic vesicle development and causes craniofacial cartilage defects"
      explanation: Perturbing Sobp dosage in vivo produces craniofacial cartilage defects, connecting the transcriptional lesion to the craniofacial patterning node.
  - target: Disrupted Otic Vesicle and Organ of Corti Patterning
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same SIX1/EYA-dependent programme governs otic placode and cochlear
      development, where altering Sobp levels disrupts otic vesicle formation.
    evidence:
    - reference: PMID:34414417
      reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "altering Sobp levels disrupts otic vesicle development and causes craniofacial cartilage defects"
      explanation: The same experiment shows otic vesicle disruption, connecting the transcriptional lesion to the otic patterning node.
  evidence:
  - reference: PMID:34414417
    reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Co-immunoprecipitation and immunofluorescence experiments demonstrate that Sobp binds to and colocalizes with Six1 in the cell nucleus. Luciferase assays show that Sobp interferes with the transcriptional activation of Six1+Eya1 target genes."
    explanation: Directly demonstrates the physical SOBP-SIX1 interaction and the repression of SIX1+EYA1 transcriptional activation that is lost in the disease.
  - reference: PMID:42475796
    reference_title: "Direct and indirect regulation of SIX1+EYA transcriptional activity by PA2G4, MCRS1, and SOBP."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analyses revealed that SOBP binds SIX1, EYA1, and EYA2 and represses both SIX1 + EYA1 and SIX1 + EYA2 transcriptional activity"
    explanation: Independently replicates SOBP binding to SIX1/EYA1/EYA2 and its repression of both complexes, in a mammalian rather than Xenopus system.
  - reference: PMID:42475796
    reference_title: "Direct and indirect regulation of SIX1+EYA transcriptional activity by PA2G4, MCRS1, and SOBP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that SIX1 is required for proper expression of Pa2g4, Mcrs1, and Sobp in the mouse mandibular arch."
    explanation: Establishes the reciprocal arm of the relationship, placing SOBP inside the SIX1 regulatory network in the mandibular arch.
  - reference: PMID:34414417
    reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These results indicate that Sobp modifies Six1 function and is required for vertebrate craniofacial development, and identify Sobp as a potential candidate gene for BOR."
    explanation: Supports placing SOBP on the SIX1/EYA1 branchio-oto-renal axis. Marked PARTIAL because BOR candidacy is a proposal rather than a demonstrated human gene-disease association.
  - reference: PMID:37854072
    reference_title: "Zmym4 is required for early cranial gene expression and craniofacial cartilage formation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we previously screened for candidate interactors and identified zinc-finger MYM-containing protein 4 (Zmym4) by its inclusion of a few domains with a bona fide cofactor, Sine oculis binding protein (Sobp)"
    explanation: An independent group's description of SOBP as a bona fide SIX1 cofactor, corroborating the co-factor assignment on which this node rests.
  - reference: PMID:37830236

- name: Maxillary Overgrowth and Dental Arch Malformation
  biological_scale: ORGANISM
  description: >-
    The clinical craniofacial endpoint: the maxilla protrudes anteriorly and is
    vertically excessive, which prevents the incisors from meeting and produces
    an open bite, while the dental arch cannot accommodate the dentition,
    producing prominent crowded teeth. Within the reported kindred this triad
    co-segregated tightly: six of the seven affected siblings had it and none of
    the siblings with normal intelligence had any jaw or dental anomaly, which
    is what established the craniofacial findings as part of the syndrome rather
    than a family trait.

discussions:
- discussion_id: sobp_cochlear_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does biallelic SOBP loss of function cause profound congenital deafness
    from cochlear duct growth arrest in the mouse, but only subclinical cochlear
    hearing loss with no gross cochlear abnormality in humans?
  attaches_to:
  - pathophysiology#Disrupted Otic Vesicle and Organ of Corti Patterning
  - pathophysiology#Cochlear Hearing Impairment
  rationale: >-
    The jackson circler mouse arrests cochlear duct growth at E13.5 and shows
    severe organ of Corti mispatterning with supernumerary and ectopic hair
    cells, yet the single human patient assessed had only subclinical hearing
    loss and normal cochlear structure. Either the human truncating allele
    retains partial function that the mouse allele does not, or human cochlear
    development is less dependent on SOBP, or the human cochlear phenotype is
    simply under-ascertained because only one patient was formally tested. The
    answer determines whether the mouse is a valid model for the human otic arm
    and whether audiological surveillance should be routine.
  evidence:
  - reference: PMID:18579736
    reference_title: "Jxc1/Sobp, encoding a nuclear zinc finger protein, is critical for cochlear growth, cell fate, and patterning of the organ of corti."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Jackson circler (jc) is a recessive mutation causing deafness resulting from a growth arrest of the cochlea duct at day 13.5 of embryonic development."
    explanation: States the severe mouse cochlear phenotype that forms one side of the mismatch.
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one of our patients has a subclinical cochlear hearing loss but no gross cochlear abnormalities"
    explanation: States the mild human phenotype that forms the other side of the mismatch, and reveals that only one patient was formally assessed.
  - reference: PMID:34414417
    reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Expression of Xenopus Sobp containing the human variant disrupts the pre-placodal ectoderm similar to full-length Sobp, but other changes are distinct."
    explanation: Gives the residual-function limb of the question real traction - the human allele behaves like full-length protein in one assay and differently in others, so an allele-strength difference from the mouse jc allele is a live explanation rather than pure speculation.
  proposed_experiments:
  - experiment_id: sobp_audiology_all_carriers
    name: Systematic audiological and temporal bone assessment of all biallelic carriers
    description: >-
      Formal audiometry, otoacoustic emissions, auditory brainstem response and
      high-resolution temporal bone imaging in every surviving biallelic SOBP
      carrier in the index kindred and in any newly ascertained family, to
      establish whether the mild phenotype is real or an ascertainment artefact
      of a single tested patient.
    decision_criterion: >-
      If most biallelic carriers have measurable cochlear hearing loss, the
      human phenotype is under-ascertained rather than genuinely mild.
  - experiment_id: sobp_allele_functional_comparison
    name: Side-by-side functional comparison of the human and mouse alleles
    description: >-
      Express the human SOBP truncating allele and the mouse jc allele in a
      common cellular system and compare nuclear localisation and repression of
      SIX1+EYA reporter activity, to test whether the human allele retains
      residual function.
    decision_criterion: >-
      Measurably greater residual nuclear localisation or repressive activity
      for the human allele would attribute the severity gap to allele identity
      rather than to species biology.
  - experiment_id: sobp_humanised_knockin_mouse
    name: Humanised knock-in mouse carrying the patient SOBP variant
    description: >-
      Generate a knock-in mouse carrying the human SOBP truncating variant and
      compare its cochlear phenotype with the jc allele on the same background.
    decision_criterion: >-
      A knock-in mouse with a milder cochlear phenotype than jc implicates
      allele identity; an equally severe phenotype implicates species-specific
      cochlear dependence on SOBP.
- discussion_id: sobp_bor_axis_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is SOBP a bona fide branchio-oto-renal (BOR) spectrum gene in humans, and
    does SOBP disruption produce renal or branchial anomalies?
  attaches_to:
  - pathophysiology#Loss of SOBP Repression of SIX1+EYA Transcriptional Activity
  rationale: >-
    SOBP binds SIX1, EYA1 and EYA2 and represses SIX1+EYA transcriptional
    activity, the same axis whose heterozygous disruption causes BOR syndrome,
    and the Xenopus work explicitly nominates Sobp as a BOR candidate gene. Yet
    no branchial or renal anomaly has been reported in the MRAMS kindred, and no
    human SOBP variant has been linked to BOR. Resolving this determines whether
    renal imaging and branchial examination belong in SOBP surveillance and
    whether SOBP should be added to BOR gene panels.
  evidence:
  - reference: PMID:37830236
    reference_title: "Using Xenopus to discover new candidate genes involved in BOR and other congenital hearing loss syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Currently, mutations in three genes, SIX1, SIX5, and EYA1, are known to be causative in about half of the BOR patients that have been tested."
    explanation: Quantifies the unexplained half of BOR cases, which is the diagnostic gap a SIX1 co-factor such as SOBP could plausibly fill and the reason the question is worth resolving.
  - reference: PMID:34414417
    reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that Sobp modifies Six1 function and is required for vertebrate craniofacial development, and identify Sobp as a potential candidate gene for BOR."
    explanation: The explicit nomination of SOBP as a BOR candidate gene that this knowledge gap asks to be tested in humans.
  proposed_experiments:
  - experiment_id: sobp_renal_branchial_phenotyping
    name: Renal and branchial phenotyping of SOBP carriers
    description: >-
      Renal ultrasound and structured branchial arch examination of biallelic
      SOBP carriers and of the heterozygous parents in the index and any new
      kindreds.
    decision_criterion: >-
      Renal or branchial anomalies in biallelic carriers would place SOBP in the
      BOR phenotypic spectrum and change surveillance recommendations.
  - experiment_id: sobp_sequencing_bor_cohorts
    name: SOBP sequencing of SIX1/EYA1-negative BOR cohorts
    description: >-
      Targeted SOBP sequencing of BOR and branchio-oto cohorts in whom SIX1,
      EYA1 and SIX5 testing was negative.
    decision_criterion: >-
      Recurrent rare SOBP variants enriched in unsolved BOR cohorts relative to
      population controls would establish a human SOBP-BOR association.
- discussion_id: sobp_intrafamilial_expressivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether an individual homozygous for the same SOBP
    truncating variant develops the full craniofacial syndrome or the
    nonsyndromic form with temporal lobe epilepsy and psychosis?
  attaches_to:
  - pathophysiology#Biallelic SOBP Truncating Variant and Loss of Nuclear SOBP
  - pathophysiology#Maxillary Overgrowth and Dental Arch Malformation
  rationale: >-
    Within one sibship, six of seven affected individuals had the maxillary and
    dental phenotype while one had neither, despite an identical homozygous
    genotype and shared ancestry. Genetic modifiers, stochastic developmental
    variation, or an independent second lesion in the discordant sibling are all
    live explanations, and the original clinical report explicitly suspected a
    separate disorder in that individual before the shared SOBP genotype was
    found. This is the clearest available handle on modifier architecture for
    SOBP.
  evidence:
  - reference: PMID:17618476
    reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child with MR but without a jaw anomaly was somewhat less severely retarded, had seizures and severe psychosis, which may point to his having a separate disorder."
    explanation: Documents the discordant sibling and records that the original authors themselves could not decide whether this was the same disorder.
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the identification of a truncating mutation in the SOBP that is responsible for causing both syndromic and nonsyndromic ID in the same family."
    explanation: Establishes that the discordance occurs on an identical genotype, which is what makes modifier architecture rather than a second gene the leading explanation.
  proposed_experiments:
  - experiment_id: sobp_wgs_index_sibship
    name: Whole-genome sequencing across the index sibship
    description: >-
      Whole-genome sequencing of all affected and unaffected siblings to search
      for a second-locus lesion or modifier haplotype segregating with the
      craniofacial arm of the phenotype.
    decision_criterion: >-
      A variant or haplotype present in the six craniofacially affected siblings
      and absent in the discordant sibling would nominate a modifier locus.
  - experiment_id: sobp_cephalometric_phenotyping
    name: Cephalometric phenotyping of all biallelic carriers
    description: >-
      Systematic craniofacial imaging and cephalometry of every biallelic
      carrier, including the discordant sibling, to test whether the
      craniofacial phenotype is truly absent or merely subclinical.
    decision_criterion: >-
      Quantitatively abnormal maxillary cephalometrics in the discordant sibling
      would reframe the discordance as a severity gradient rather than a
      presence/absence difference.

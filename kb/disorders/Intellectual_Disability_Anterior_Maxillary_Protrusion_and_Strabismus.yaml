    explanation: Places SOBP within the wider SIX1-co-factor programme governing otic development, the framework in which this node's otic consequences are interpreted.
- name: Disrupted Craniofacial and Odontogenic Patterning
  biological_scale: TISSUE
  description: >-
    SOBP is expressed in the oral domain of the mandibular arch and during
    odontogenesis, where it colocalises with SIX1. Loss or gain of Sobp in
    Xenopus disrupts formation of the ectodermal (pre-placodal) domains at
    neural plate stages and produces craniofacial cartilage defects. In humans
    the corresponding developmental output is a maxilla that overgrows
    anteriorly and vertically, with the dental arch consequences of that
    overgrowth: an open bite that cannot close because of the vertical maxillary
    excess, and prominent crowded teeth. Notably the human phenotype is confined
    to the maxilla and dentition, without mandibular, malar, or auricular
    malformation.
  locations:
  - preferred_term: maxilla
    term:
      id: UBERON:0002397
      label: maxilla
  - preferred_term: pharyngeal arch
    term:
      id: UBERON:0002539
      label: pharyngeal arch
  cell_types:
  - preferred_term: cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
  - preferred_term: odontogenesis
    term:
      id: GO:0042476
      label: odontogenesis
    modifier: ABNORMAL
  downstream:
  - target: Maxillary Overgrowth and Dental Arch Malformation
    causal_link_type: DIRECT
    description: >-
      Abnormal patterning of the maxillary skeleton and tooth germs manifests
      clinically as anterior maxillary protrusion with vertical maxillary
      excess, open bite, and dental crowding.
    evidence:
    - reference: PMID:17618476
      reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Six of the seven had anterior maxillary protrusion with vertical maxillary excess, open bite, and prominent crowded teeth."
      explanation: The human clinical endpoint of the craniofacial patterning defect, observed in the index kindred.
  evidence:
  - reference: PMID:34414417
    reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Experiments in Xenopus embryos that either knock down or increase expression of Sobp show that it is required for formation of ectodermal domains at neural plate stages. In addition, altering Sobp levels disrupts otic vesicle development and causes craniofacial cartilage defects."
    explanation: Demonstrates in vivo that Sobp is required for craniofacial development, the developmental process whose failure produces the maxillary phenotype.
  - reference: PMID:42475796
    reference_title: "Direct and indirect regulation of SIX1+EYA transcriptional activity by PA2G4, MCRS1, and SOBP."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SIX1 colocalizes with PA2G4, MCRS1, and SOBP within the oral domain of the mandibular arch and during odontogenesis, although each exhibits a distinct expression pattern."
    explanation: Localises SOBP expression to the oral domain of the first pharyngeal arch and to odontogenesis, the tissues affected in the human jaw and dental phenotype.
  - reference: PMID:42475796
    reference_title: "Direct and indirect regulation of SIX1+EYA transcriptional activity by PA2G4, MCRS1, and SOBP."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "whereas its role in the neural crest cells of the mandibular arch, which will give rise to the jaws and middle ear ossicles, is less well characterized"
    explanation: Supports the neural-crest/mandibular-arch route to jaw formation while explicitly flagging that this arm of SIX1 biology is incompletely characterised, hence PARTIAL.
- name: Disrupted Otic Vesicle and Organ of Corti Patterning
  biological_scale: TISSUE
  description: >-
    Sobp is the gene disrupted in the recessive mouse mutant jackson circler
    (jc), in which deafness results from growth arrest of the cochlear duct at
    embryonic day 13.5. In jc mutants the cellular patterning of the organ of
    Corti is severely disrupted, with supernumerary hair cells at the apex,
    mirror-image duplications of the tunnel of Corti and inner hair cells, and
    ectopic vestibular-like hair cells within Koelliker's organ. Sobp mRNA is
    present in inner ear sensory hair cells, supporting cells, and the acoustic
    ganglia. The human counterpart of this arm is mild and was subclinical: one
    patient had cochlear hearing loss without gross cochlear malformation, a
    substantially milder outcome than the mouse, which is itself an open
    question about human-model fidelity.

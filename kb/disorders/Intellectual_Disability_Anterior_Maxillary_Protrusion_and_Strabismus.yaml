    snippet: "We have been unable to find a similar disorder in the literature, and suggest that this is a hitherto unreported autosomal recessive disorder"
    explanation: The original delineation assigns autosomal recessive inheritance on the basis of healthy consanguineous parents and affected siblings of both sexes.
  - reference: PMID:21035105

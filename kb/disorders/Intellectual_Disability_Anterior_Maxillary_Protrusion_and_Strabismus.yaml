genetic:
- name: SOBP
  gene_term:
    preferred_term: SOBP
    term:
      id: hgnc:29256
      label: SOBP
  association: Causal - homozygous truncating variant segregating in a consanguineous kindred
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    SOBP (6q21) encodes sine oculis binding protein homolog, a nuclear FCS-type
    zinc finger protein. A homozygous truncating variant segregating in the
    single reported consanguineous Israeli-Arab kindred causes the syndrome. The
    same variant produced both the syndromic (craniofacial + strabismus +
    intellectual disability) and the nonsyndromic (intellectual disability with
    temporal lobe epilepsy and psychosis) presentation within that one family,
    so intrafamilial variable expressivity is intrinsic to this gene-disease
    relationship rather than a between-family effect. The orthologous mouse
    allele is jackson circler (jc)/Jxc1. Because only one kindred has been
    reported, the gene-disease association rests on a narrow evidence base.
    The familial allele is NM_018013.4(SOBP):c.1981C>T (p.Arg661Ter), a
    stop-gain that removes the C-terminal region of the 873-residue protein.
    The HGVS nomenclature was taken from a deep-research lead and then verified
    independently against the ClinVar variant record, which holds it under
    exactly this nomenclature; ClinVar carries no asserted germline
    classification for it, so no ClinVar-derived pathogenicity claim is made
    here, and the pathogenicity assertion rests on segregation in the index
    kindred.
  variants:
  - name: SOBP c.1981C>T (p.Arg661Ter)
    description: >-
      Homozygous nonsense (stop-gain) variant, NM_018013.4:c.1981C>T,
      p.Arg661Ter, segregating in the single reported consanguineous
      Israeli-Arab kindred. It truncates the C-terminal portion of SOBP.
      Functional work in Xenopus shows that a Sobp protein carrying the human
      variant still disrupts the pre-placodal ectoderm much as full-length Sobp
      does while differing in other respects, so the allele is not a
      straightforward complete null and may be partially functional or act
      through a distinct mechanism.
    type: nonsense
    gene:
      preferred_term: SOBP
      term:
        id: hgnc:29256
        label: SOBP
    evidence:
    - reference: PMID:21035105
      reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on the identification of a truncating mutation in the SOBP that is responsible for causing both syndromic and nonsyndromic ID in the same family."
      explanation: The primary report of the truncating SOBP variant in this kindred. The abstract does not give HGVS nomenclature; the specific c.1981C>T (p.Arg661Ter) designation was confirmed against the ClinVar variant record rather than quoted from this abstract.
    - reference: PMID:34414417
      reference_title: "Sobp modulates the transcriptional activation of Six1 target genes and is required during craniofacial development."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of Xenopus Sobp containing the human variant disrupts the pre-placodal ectoderm similar to full-length Sobp, but other changes are distinct."
      explanation: Directly tests the human variant in vivo and shows it retains full-length-like activity on the pre-placodal ectoderm while differing elsewhere, arguing against a simple complete-null interpretation. PARTIAL because this is a Xenopus surrogate of the human allele, not the human protein.
  evidence:
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the identification of a truncating mutation in the SOBP that is responsible for causing both syndromic and nonsyndromic ID in the same family."
    explanation: Establishes the causal SOBP truncating variant and its dual syndromic/nonsyndromic expression within one family.
  - reference: PMID:18579736
    reference_title: "Jxc1/Sobp, encoding a nuclear zinc finger protein, is critical for cochlear growth, cell fate, and patterning of the organ of corti."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we identify the vertebrate homolog of the Drosophila Sobp (sine oculis-binding protein) gene (named Jxc1) in the jc locus."
    explanation: Identifies the mouse orthologue and the jackson circler locus, the model-organism counterpart of the human gene.
diagnosis:
- name: Molecular Genetic Testing for SOBP
  description: >-
    The diagnosis is established by identifying biallelic pathogenic SOBP
    variants on exome or genome sequencing in an individual with severe
    intellectual disability plus the maxillary/dental and strabismus findings.
    Because the craniofacial features are absent in part of the phenotypic
    spectrum, SOBP should not be excluded on the basis of a normal jaw. In the
    index kindred the locus was reached through a consanguineous pedigree, so
    autozygosity mapping remains a useful adjunct in consanguineous families.
  presence: Positive in affected individuals
  evidence:
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on the identification of a truncating mutation in the SOBP that is responsible for causing both syndromic and nonsyndromic ID in the same family."
    explanation: Identification of the SOBP truncating variant is what establishes the molecular diagnosis.
- name: Exclusion of Other Causes of Syndromic Intellectual Disability
  description: >-
    In the index kindred, biochemical studies, neurological evaluation, brain
    MRI, standard cytogenetics, fragile X testing, subtelomeric rearrangement
    screening, and X-inactivation studies in the mother were all normal or
    negative. A normal result on this conventional workup does not argue against
    the diagnosis and should prompt sequencing rather than reassurance.
  presence: Normal or negative
  evidence:
  - reference: PMID:17618476
    reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fragile X was excluded, no subtelomeric rearrangements were detectable, and X-inactivation studies in the mother showed random inactivation"
    explanation: Documents the negative conventional genetic workup in the index kindred.
  - reference: PMID:17618476
    reference_title: "Autosomal recessive mental retardation syndrome with anterior maxillary protrusion and strabismus: MRAMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical and neurological studies, including brain MRI and standard cytogenetic studies, yielded normal results"
    explanation: Confirms that biochemical, neurological, imaging and cytogenetic assessment are normal, so they serve as exclusion rather than confirmation.
- name: Audiological Assessment
  description: >-
    Deliberate audiological testing is warranted in anyone with biallelic SOBP
    variants, because the cochlear hearing loss documented in this syndrome was
    subclinical and so would be missed by symptom-triggered testing, and because
    the orthologous mouse mutant is deaf from a cochlear growth arrest. This is
    a case-finding and surveillance investigation rather than a treatment. NCIT
    has no general audiometry clinical-action term at this level of granularity,
    so no diagnosis_term is bound.
  presence: May reveal mild cochlear hearing loss despite normal cochlear structure
  evidence:
  - reference: PMID:21035105
    reference_title: "SOBP is mutated in syndromic and nonsyndromic intellectual disability and is highly expressed in the brain limbic system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one of our patients has a subclinical cochlear hearing loss but no gross cochlear abnormalities"
    explanation: The subclinical nature of the documented hearing loss, and its presence despite normal cochlear structure, is the rationale for deliberate audiological assessment rather than symptom-triggered testing or imaging alone.
  - reference: PMID:18579736
    reference_title: "Jxc1/Sobp, encoding a nuclear zinc finger protein, is critical for cochlear growth, cell fate, and patterning of the organ of corti."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Jackson circler (jc) is a recessive mutation causing deafness resulting from a growth arrest of the cochlea duct at day 13.5 of embryonic development."
    explanation: The severe deafness of the orthologous mouse mutant is the second reason to test hearing deliberately. PARTIAL because the mouse phenotype is far more severe than anything documented in humans and cannot by itself justify a human surveillance recommendation.

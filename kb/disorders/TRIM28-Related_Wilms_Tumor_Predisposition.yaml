- name: Arrested Late Nephrogenesis
  biological_scale: TISSUE
  description: >-
    Nephrogenesis is disturbed late in gestation, so embryonal nephrogenic tissue
    persists at the periphery of the kidney as perilobar nephrogenic rests rather
    than completing nephron formation. The perilobar location contrasts with the
    intralobar rests of germline WT1 disease, which reflect an earlier
    disturbance.

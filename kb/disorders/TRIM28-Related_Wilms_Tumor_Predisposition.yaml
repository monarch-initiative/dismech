    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that germline loss of function mutations in TRIM28 predispose children to Wilms tumour."
    explanation: >-
      One of the two independent reports establishing TRIM28 as a Wilms tumor
      predisposition gene.
  - reference: PMID:30694527
    reference_title: "TRIM28 haploinsufficiency predisposes to Wilms tumor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data establish TRIM28 as a novel Wilms tumor predisposition gene, acting as a tumor suppressor gene by LOH."
    explanation: >-
      Independent establishment of TRIM28 as a predisposition gene acting
      through loss of heterozygosity.
  - reference: PMID:30885698
    reference_title: "Identification of new Wilms tumour predisposition genes: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were no TRIM28 mutations in individuals with other childhood or adult cancers."
    explanation: >-
      Supports the tumor-type specificity recorded in notes.
animal_models:
- name: Trim28 nephron-progenitor conditional knockout mouse
  species: Mouse
  genotype: Trim28 conditional deletion in nephron progenitors (homozygous)
  publication: PMID:42522414
  modeled_mechanisms:
  - target: Arrested Late Nephrogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Deleting Trim28 in nephron progenitors impairs progenitor maintenance and
      kidney development.
    limitations: >-
      Both alleles are deleted in every nephron progenitor, unlike the germline
      heterozygote with a clonal somatic second hit, and the kidneys formed no
      tumors or nephrogenic rests.
    evidence:
    - reference: PMID:42522414
      reference_title: "The absence of Trim28 in nephron progenitors results in impaired kidney development and function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that deleting Trim28 in nephron progenitors resulted in early postnatal lethality and reduced kidney weight."
      explanation: >-
        Shows a kidney developmental defect from nephron-progenitor Trim28
        loss.
treatments:
- name: Renal Tumor Surveillance
  description: >-
    Children carrying a germline TRIM28 variant are offered renal ultrasound
    surveillance. Because a sizeable fraction of carriers present after age
    five, surveillance continuing to about age eight has been suggested.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: renal ultrasound surveillance
    term:
      id: NCIT:C15406
      label: Cancer Screening
  target_mechanisms:
  - target: Epithelial-Predominant Wilms Tumor
    description: >-
      Surveillance detects tumors early rather than preventing tumor
      initiation, so it is linked to the tumor phenotype, not to the
      initiation mechanism.
  evidence:
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that 25/30 patients (83%) were diagnosed before the age of 7 years and 28/30 (93%) before the age of 8 years, which may encourage continuing surveillance until the age of 8 years"
    explanation: >-
      Age distribution of tumors in carriers on which the suggested surveillance
      duration rests.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Identifying a germline TRIM28 variant allows counselling of the family and
    testing of at-risk relatives. Counselling should cover Wilms tumor risk for
    paternally as well as maternally inherited variants.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognizing germline TRIM28 variants in patients with WT can enable counselling, genetic testing, and potential early detection of WT in other children in the family."
    explanation: >-
      States the family benefit of identifying a carrier.
  - reference: PMID:38282073
    reference_title: "Wilms tumour resulting from paternal transmission of a TRIM28 pathogenic variant-A first report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This finding suggests that genetic counselling for paternally inherited pathogenic variants in TRIM28 should include discussion of a potential risk of Wilms tumour."
    explanation: >-
      Extends counselling to paternally inherited variants.
- name: Standard Wilms Tumor Therapy
  description: >-
    Tumors in carriers are treated with standard Wilms tumor protocols, and the
    reported responses are good.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:32699065
    reference_title: "TRIM28 congenital predisposition to Wilms' tumor: novel mutations and presentation in a sibling pair."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both were treated with standard therapies with good response and long-term sustained complete remission of 53 and 97 mo, respectively."
    explanation: >-
      Sibling pair with bilateral TRIM28-related tumors in sustained remission
      after standard therapy.
diagnosis:
- name: TRIM28 immunohistochemistry on Wilms tumor tissue
  diagnosis_term:
    preferred_term: TRIM28 immunohistochemistry
    term:
      id: NCIT:C51944
      label: Immunohistochemical Test
  description: >-
    Loss of nuclear TRIM28 (KAP1) staining in tumor cells with retained staining
    in surrounding normal cells identifies TRIM28-inactivated tumors and selects
    patients for germline testing. Review authors recommend applying it to all
    Wilms tumor histologies, since non-epithelial TRIM28-mutant tumors occur.
  evidence:
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, loss of TRIM28 (KAP1/TIF1beta) protein expression in tumour tissue by immunohistochemistry is an effective strategy to identify patients carrying pathogenic TRIM28 variants."
    explanation: >-
      Supports tumor immunohistochemistry as the screen for carriers.
  - reference: PMID:37792584
    reference_title: "TRIM28 inactivation in epithelial nephroblastoma is frequent and often associated with predisposing TRIM28 germline variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the high prevalence of predisposing variants in TRIM28-driven WT, we suggest that immunohistochemical testing of TRIM28 be integrated into diagnostic practice as the management of WT in predisposed children differs from that with sporadic tumors."
    explanation: >-
      Recommends routine TRIM28 immunohistochemistry on the basis of a large
      epithelial Wilms tumor series.
- name: Germline TRIM28 genetic testing
  diagnosis_term:
    preferred_term: germline TRIM28 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Germline sequencing of TRIM28 in blood-derived DNA establishes the diagnosis,
    and is indicated particularly in children with epithelial Wilms tumor or a
    TRIM28-negative tumor on immunohistochemistry.
  results: >-
    A heterozygous pathogenic TRIM28 variant in constitutional DNA establishes
    the diagnosis.
  evidence:
  - reference: PMID:30885698
    reference_title: "Identification of new Wilms tumour predisposition genes: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recommend that all individuals with Wilms tumour should be offered genetic testing and particularly, those with epithelial Wilms tumour should be offered TRIM28 genetic testing."
    explanation: >-
      Recommends germline TRIM28 testing, particularly for epithelial tumors.
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, genetic analysis of TRIM28 in blood‐derived DNA can be performed in all patients who display loss of TRIM28 in the tumour."
    explanation: >-
      Links tumor immunohistochemistry to germline testing.

notes: >-
  Curated as a separate entry from Wilms_Tumor under design decision 3a, which
  keeps a germline cancer predisposition condition separate from the tumor it
  predisposes to; MONDO files this class under hereditary Wilms tumor. The tumor
  side of the mechanism is also curated on Wilms_Tumor as the TRIM28 Tumor
  Suppressor Loss node. The file is named for the gene rather than the MONDO
  numbered label because the clinical literature names the condition by gene,
  as other gene-specific predisposition entries here do; the MONDO label is kept
  as a synonym. Additional findings reported in single carriers (autism, speech
  delay, congenital heart defects) and the male subfertility seen in
  heterozygous mice are not curated as phenotypes, because the 2021 review of
  all reported carriers found no strong evidence for any phenotype other than
  Wilms tumor predisposition.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  penetrance_percentage: "67"
  parent_of_origin_effect: >-
    Strong maternal bias: every inherited variant in the founding exome series,
    and every patient for whom the parental origin could be established in the
    2021 review, had a maternally transmitted variant. A single child with
    bilateral Wilms tumor after paternal transmission has since been reported,
    so the bias is not absolute. Genomic imprinting near the PEG3 locus and male
    subfertility have both been proposed as explanations; neither is
    established.
  description: >-
    Heterozygous constitutional variants are inherited or arise de novo.
    Penetrance estimated from the reported pedigrees is about two thirds, an
    estimate the review authors note is biased upward because families were
    ascertained through multiple affected members.
  evidence:
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Pedigrees from families with germline pathogenic TRIM28 variants suggest a disease penetrance of ~67%, with 18 affected individuals out of a combined total of 27 (obligate) carriers"
    explanation: >-
      Source for incomplete penetrance and for the 67 per cent figure, derived
      from the pooled published pedigrees.
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Since reported families were identified based on the presence of multiple affected individuals, this estimated penetrance is likely biased, but certainly supports offering surveillance to children with germline TRIM28 variants."
    explanation: >-
      Records the ascertainment caveat on the penetrance estimate.
  - reference: PMID:30885698
    reference_title: "Identification of new Wilms tumour predisposition genes: an exome sequencing study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "21 of 33 individuals had a mutation in TRIM28; there was a strong parent-of-origin effect, with all ten inherited mutations being maternally transmitted (p=0·00098)."
    explanation: >-
      The founding exome series establishes the maternal transmission bias.
  - reference: PMID:33565090
    reference_title: "TRIM28 variants and Wilms' tumour predisposition."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "A remarkable observation in the families identified thus far was that in all 15 patients with WT for whom parental inheritance could be established, the pathogenic TRIM28 variant was inherited from the mother (three of whom were also diagnosed with WT)"
    explanation: >-
      Extends the maternal transmission observation across all published
      families with established parental origin.
  - reference: PMID:38282073
    reference_title: "Wilms tumour resulting from paternal transmission of a TRIM28 pathogenic variant-A first report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, here we report a child with bilateral Wilms tumour who had inherited a pathogenic TRIM28 variant from their father."
    explanation: >-
      The first paternally transmitted case, which shows the parent-of-origin
      bias is not absolute.

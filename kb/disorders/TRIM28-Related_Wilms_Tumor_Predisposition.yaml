name: TRIM28-Related Wilms Tumor Predisposition
creation_date: "2026-10-01T04:24:43Z"
description: >-
  TRIM28-related Wilms tumor predisposition (Wilms tumor 7) is an autosomal
  dominant, incompletely penetrant childhood cancer predisposition caused by
  heterozygous constitutional loss-of-function variants, mostly truncating or
  splice-site, in TRIM28, which encodes the KRAB zinc-finger-associated
  transcriptional corepressor KAP1. Carriers develop Wilms tumors in infancy and
  early childhood, frequently bilateral, that are characteristically epithelial
  or epithelial-predominant and arise from perilobar nephrogenic rests. The
  remaining wild-type allele is lost in the tumor, most often by copy-neutral
  loss of heterozygosity of chromosome 19q, and the tumors otherwise carry few
  recurrent Wilms tumor driver mutations. Germline variants account for around 1
  per cent of isolated and 8 per cent of familial Wilms tumor. Inherited variants
  have been maternally transmitted in nearly every reported family. Loss of
  TRIM28 staining on tumor immunohistochemistry is the practical screen that
  selects children for germline testing, and carriers are offered renal
  surveillance and family counselling. No consistent phenotype outside Wilms
  tumor predisposition has been established.
category: Mendelian
parents:
- hereditary Wilms tumor
synonyms:
- Wilms tumor 7
- WT7
- TRIM28-associated Wilms tumor
- TRIM28-related Wilms tumour predisposition

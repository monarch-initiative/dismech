  downstream:
  - target: Aggrecan Deficiency in the Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Protein held in the endoplasmic reticulum is protein the matrix does not
      get, so the missense alleles reach the same convergence point as the
      truncating ones by a different route.
  notes: >-
    Cell-model evidence for one allele. Nothing here has been shown in patient
    growth-plate or articular cartilage in situ, and the model is a differentiated
    stromal or iPSC-derived chondrocyte rather than a native one. Recorded as a
    node because the retention is the mechanistic link between the measured
    secretion defect above and the matrix deficit below, and because it is the
    only place the intracellular half of this disease is visible at all.
- name: Impaired Growth Plate Chondrogenesis
  description: >-
    Longitudinal bone growth is produced at the growth plate by chondrocyte
    proliferation, hypertrophy and matrix production, then replacement of that
    cartilage by bone. Aggrecan is a critical component of the matrix the plate is
    built from, so a reduced dose degrades the template and the mechanical
    environment the chondrocytes work in at the same time. This is the growth arm
    of the spectrum, and it is the same lesion as the joint arm one tissue over.
  role: mechanism
  biological_scale: TISSUE
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0003417
      label: growth plate cartilage development
  - preferred_term: endochondral ossification
    modifier: ABNORMAL
    term:
      id: GO:0001958
      label: endochondral ossification
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  evidence:
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Aggrecan is a critical proteoglycan component of the cartilage matrix, both
      in articular and growth plate cartilage, thus accounting for the dual
      phenotypic effects on both these types of cartilage.
    explanation: >-
      The authors' own account of why one gene produces two organ-level arms,
      which is the branch structure this entry uses.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Consistent with this explanation, homozygous mutations in ACAN in both mice
      and chicks severely disrupt growth plate function and impair bone elongation

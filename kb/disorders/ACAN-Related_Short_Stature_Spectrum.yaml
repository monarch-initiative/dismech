phenotypes:
- name: Short stature
  category: Growth
  description: >-
    The one constant, and it worsens with age relative to the population: median
    childhood height in the 103-individual international cohort was -2.0 SDS
    against a median adult height a full standard deviation lower. That widening
    gap is the signature of a condition that truncates the growing period rather
    than slowing growth throughout it.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous ACAN mutations cause short stature with bone age acceleration
      and premature growth cessation and are frequently associated with
      early-onset osteoarthritis and degenerative disc disease.
    explanation: >-
      The cohort's one-sentence statement of the phenotype, establishing short
      stature as the defining feature of the spectrum.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood height was less affected (median height, -2.0 SDS; range, -4.2 to
      -0.6).
    explanation: >-
      Gives the childhood figure. The comparison this description draws is against
      the adult median reported in the same paper, whose sentence carries its
      numbers inside square brackets and so cannot be quoted as a snippet here;
      the childhood figure is the quotable half of the contrast.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified three novel loss-of-function variants mutations in ACAN in
      three families, all with the rare combination of short stature, advanced
      bone age, and premature growth cessation.
    explanation: >-
      An independent set of families showing the same triad, which is what makes
      the combination characteristic rather than a feature of one cohort. Quoted
      verbatim including the source's "variants mutations" duplication.
- name: Disproportionate short stature
  category: Growth
  description: >-
    Mild where present, and not universal - the cohort's own conclusion frames the
    spectrum as running from proportionate short stature at one end to a
    recognizable dysplasia with disproportion and brachydactyly at the other.
    Which end a family occupies is the main determinant of whether it reaches an
    endocrine clinic or a genetics clinic.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Disproportionate short stature
    term:
      id: HP:0003498
      label: Disproportionate short stature
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous ACAN mutations result in a phenotypic spectrum ranging from
      mild and proportionate short stature to a mild skeletal dysplasia with
      disproportionate short stature and brachydactyly.
    explanation: >-
      States the range explicitly, which is why this is FREQUENT rather than
      OBLIGATE and why the entry is a spectrum.
- name: Accelerated skeletal maturation
  category: Skeletal
  description: >-
    The diagnostic clue, and the feature most often over-read. Advanced bone age
    is what makes a short child with a normal endocrine workup worth sequencing,
    because short stature with advanced bone age is uncommon. But it is not
    obligatory: in the international cohort only 6 of 20 families had markedly
    advanced maturation and 14 had normal or modest advancement, and in a Chinese
    series fewer than a quarter of children were significantly advanced. A normal
    bone age does not exclude the diagnosis, and treating it as a gate is how
    these patients get missed.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Accelerated skeletal maturation
    term:
      id: HP:0005616
      label: Accelerated skeletal maturation
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most children with ACAN mutations had advanced bone age (bone age -
      chronologic age; median, +1.3 years; range, +0.0 to +3.7 years).
    explanation: >-
      Quantifies the advancement and its range, including the zero lower bound
      that makes it non-obligate.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children in 6 families (families 1, 4, 12, 15, 18, and 20) had markedly
      advanced skeletal maturation (BA, 3 to 4 years advanced); however, the
      children in the other 14 families had normal or modestly advanced BA
    explanation: >-
      Marked REFUTE against the claim that markedly advanced bone age is a
      defining feature of this spectrum - most families do not have it. This is
      the sentence that sets the frequency at FREQUENT.
  - reference: PMID:36387899
    reference_title: >-

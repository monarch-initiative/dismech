- name: Premature Hypertrophic Chondrocyte Maturation and Early Epiphyseal Fusion
  description: >-
    The step that explains the entry's most counter-intuitive feature. Short
    stature usually comes with a delayed bone age; here it comes with an advanced
    one. In aggrecan-deficient chick growth plates the hedgehog, FGF and BMP
    signalling that paces the plate is abnormal and chondrocytes hypertrophy
    early, and because hypertrophy is what triggers vascular invasion and
    ossification, the plate both matures and closes ahead of schedule. Clinically
    the advanced bone age is therefore a readout of reduced remaining growth
    potential rather than a separate lesion - which is why these children stop
    growing at a median of 12 years despite normally timed puberty, and why
    predicting their adult height from bone age fails.

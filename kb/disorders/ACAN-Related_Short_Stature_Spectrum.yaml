  evidence:
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study demonstrates that heterozygous mutations in ACAN can cause a mild
      skeletal dysplasia, which presents clinically as short stature with advanced
      bone age.
    explanation: >-
      Delineates the subtype as a mild dysplasia presenting as short stature with
      advanced bone age, which is what distinguishes it from SEDK.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients have short stature, variable, mild facial dysmorphism, and
      brachydactyly, but do not exhibit the vertebral body deformities detected in
      SEDK and SEMD.
    explanation: >-
      The authors' own contrast with SEDK, which is the clinical basis for keeping
      the two as separate subtypes inside one entry rather than merging them.
pathophysiology:
- name: Heterozygous ACAN Variants
  description: >-
    The trigger, and it is deliberately named for the gene rather than for one
    lesion, because two mechanistically different allele classes sit under it.
    Roughly half of reported variants truncate the aggrecan core protein -
    frameshifts, nonsense alleles and splice-site changes - including the
    single-base-pair insertion in the exon 12 variable repeat region that founded
    the series in the SEDK kindred. The remainder are missense substitutions, and
    these are not scattered: those linked to osteochondritis dissecans cluster in
    the C-type lectin repeat of the C-terminal G3 domain. The two classes are
    carried to separate downstream nodes below because what they do to the
    protein is not the same thing.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  evidence:
  - reference: PMID:16080123
    reference_title: >-
      A mutation in the variable repeat region of the aggrecan gene (AGC1) causes
      a form of spondyloepiphyseal dysplasia associated with severe, premature
      osteoarthritis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened AGC1 for mutations and identified a single-base-pair insertion,
      within the variable repeat region of exon 12 in affected individuals from
      the family with SEDK, that introduces a frameshift of 212 amino acids,
      including 22 cysteine residues, followed by a premature stop codon.
    explanation: >-
      The founding truncating allele, given in the detail that establishes it as a
      protein-truncating rather than a missense lesion.
  - reference: PMID:33471655
    reference_title: >-
      Growth-Promoting Therapies May Be Useful In Short Stature Patients With
      Nonspecific Skeletal Abnormalities Caused By Acan Heterozygous Mutations:
      Six Chinese Cases And Literature Review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of these mutations can lead to protein truncation.
    explanation: >-
      Quantifies the split between the truncating and non-truncating allele
      classes across the reported series, which is why this node branches rather
      than asserting one mechanism.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mapping these and other ACAN variants linked to hereditary skeletal
      disorders showed a clustering of osteochondritis dissecans-linked variants
      to the G3 domain.
    explanation: >-
      Establishes that the missense class is positionally restricted and
      associated with the joint arm, which is the structure behind the second
      downstream branch.
  downstream:
  - target: Aggrecan Deficiency in the Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      The route taken by the truncating alleles: one functional copy of the gene
      supplies the matrix.
  - target: Impaired Secretion and Matrix Ligand Binding of G3-Domain Variant Aggrecan
    causal_link_type: DIRECT
    description: >-
      The route taken by the G3 C-type lectin missense alleles, which produce a
      full-length protein that behaves abnormally rather than an absent one.
  notes: >-
    The variant numbering in the cited sources is not uniform - see the
    nomenclature hazard recorded in the entry notes. Each snippet quotes its own
    source's notation rather than a normalized form.
- name: Aggrecan Deficiency in the Cartilage Extracellular Matrix
  description: >-
    The convergence point. Both allele classes end with less functional aggrecan
    in the matrix, and the cohort evidence argues this is the common mechanism:
    across 20 families with 19 different variants the growth phenotype did not
    track the mutation type, which is what a dosage effect looks like and is not
    what allele-specific mechanisms look like. Aggrecan is what creates the
    swelling pressure that lets cartilage resist compression, so the deficit is
    mechanical before it is anything else.
  role: mechanism
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is likely that the impairment of growth plate chondrogenesis
      is due to functional haploinsufficiency of aggrecan, rather than different
      mutation-specific mechanisms (25).
    explanation: >-
      The authors' own statement of the convergent mechanism this node asserts.
      Marked DIRECT because it states the claim, and note it is offered as a
      likelihood rather than a demonstration - the acan_haploinsufficiency_vs_g3
      discussion records what is not settled by it.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these findings suggest that different disease-causing
      heterozygous ACAN variants impair growth plate chondrogenesis similarly,
      which, in turn, suggests a common mechanism.
    explanation: >-
      The clinical observation the dosage inference rests on - similar growth
      impairment across different variant types. Marked INDIRECT because the
      common mechanism is inferred from phenotypic similarity, not measured.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The large proteoglycan aggrecan is vital for skeletal development and
      cartilage function, creating a swelling pressure in the tissue that provides
      resistance to compression and load dissipation over the joint surface
    explanation: >-
      States the biophysical function that a reduced aggrecan dose degrades, which
      is why this node is the pivot of the entry. Graded quote_role BACKGROUND
      because the sentence opens the paper's introduction and restates established
      cartilage biology rather than reporting this study's own result;
      evidence_source OTHER because the restated claim is textbook matrix biology
      with no single study design behind it.
  downstream:
  - target: Impaired Growth Plate Chondrogenesis
    causal_link_type: DIRECT
    description: >-
      Growth-plate cartilage is where longitudinal bone growth is produced, so a
      matrix deficit there limits elongation.
  - target: Articular and Intervertebral Disc Matrix Insufficiency
    causal_link_type: DIRECT
    description: >-
      The same protein is the major proteoglycan of articular cartilage and of the
      intervertebral disc, which is why one gene dose produces a joint arm as well
      as a growth arm.
- name: Impaired Secretion and Matrix Ligand Binding of G3-Domain Variant Aggrecan
  description: >-
    What the C-type lectin missense alleles actually do, and the part of the story
    that took three studies and changed twice. The G3 C-type lectin repeat is how
    aggrecan engages the surrounding network - tenascins and fibulins - and the
    p.V2303M substitution abolishes those interactions in binding assays. The
    original report also found the variant protein present in patient cartilage by
    mass spectrometry, which read as an argument against a secretion defect. Later
    work on three further G3 missense families measured secretion directly and
    found it reduced, for recombinant protein and for full-length aggrecan from
    patient cartilage alike. Both results stand: the protein is present, and less
    of it gets out.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TNR
    term:
      id: hgnc:11953
      label: TNR
  - preferred_term: FBLN1
    term:
      id: hgnc:3600
      label: FBLN1
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  evidence:
  - reference: PMID:20137779
    reference_title: >-
      A missense mutation in the aggrecan C-type lectin domain disrupts
      extracellular matrix interactions and causes dominant familial
      osteochondritis dissecans.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Binding studies with recombinant mutated and wild-type G3 proteins showed
      loss of fibulin-1, fibulin-2, and tenascin-R interactions for the V2303M
      protein.
    explanation: >-
      The direct measurement of the ligand-binding half of this node, naming the
      three partners lost.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed that neither recombinant variant proteins, nor
      full-length variant aggrecan proteoglycan from heterozygous patient
      cartilage, were secreted to the same level as wild-type aggrecan.
    explanation: >-
      The secretion half of this node, measured in three further G3 missense
      families and in patient tissue rather than in recombinant protein alone.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The variant proteins also showed decreased binding to known cartilage
      extracellular matrix ligands.
    explanation: >-
      Replicates the binding defect in the newly reported alleles, which is what
      makes the ligand-binding claim general to the G3 class rather than specific
      to p.V2303M.
  - reference: PMID:20137779
    reference_title: >-
      A missense mutation in the aggrecan C-type lectin domain disrupts
      extracellular matrix interactions and causes dominant familial
      osteochondritis dissecans.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectrometric analyses of aggrecan purified from patient cartilage
      verified that V2303M aggrecan is produced and present in the tissue.
    explanation: >-
      Quoted as REFUTE against the strong reading of this node - that the variant
      protein fails to reach the matrix at all. It does reach it. The claim the
      node makes is reduced secretion and lost binding, not absence, and this
      sentence is what sets that boundary.
  downstream:
  - target: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Reduced secretion implies the protein is held somewhere; patient-derived
      chondrocytes locate it in the endoplasmic reticulum.
  - target: Articular and Intervertebral Disc Matrix Insufficiency
    causal_link_type: DIRECT
    description: >-
      Aggrecan that cannot bind tenascin-R or the fibulins is not integrated into
      the articular matrix network even where it is present.
- name: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
  description: >-
    Established only in patient-derived cells, and only for the p.V2303M
    familial-osteochondritis-dissecans allele. Chondrocytes differentiated from
    patient bone-marrow mesenchymal stromal cells and from patient iPSC lines
    accumulate large amounts of aggrecan inside the endoplasmic reticulum while
    the surrounding matrix is depleted of it - the authors' term is chondrocyte
    aggrecanosis. The pellets these cells form are rich in glycosaminoglycan and
    still structurally poor, which is the cellular-level version of the whole
    entry's point that the defect is in matrix assembly rather than in bulk
    synthesis.
  role: mechanism
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress

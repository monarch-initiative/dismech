      disorders". In the 2019 revision (PMID:31633310) the ACAN disorders sat in
      a separate "Aggrecan group", which lists "SED, Kimberley type" and "Short
      stature and advanced bone age" as distinct Table 1 rows; this entry lumps
      them, for the reasons given in the acan_spectrum_lumping discussion.
    evidence:
    - reference: PMID:36779427
      reference_title: "Nosology of genetic skeletal disorders: 2023 revision."
      supports: SUPPORT
      evidence_source: OTHER

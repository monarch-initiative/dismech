differential_diagnoses:
- name: Idiopathic short stature
  description: >-
    Not a mimic so much as the label these patients carry until someone sequences
    them. What should prompt the test is short stature with a normal endocrine
    workup plus any of brachydactyly, an advanced bone age, a family history of
    early growth cessation, or a family history of early-onset osteoarthritis.
- name: Spondyloepimetaphyseal dysplasia, aggrecan type
  description: >-
    The biallelic form of the same gene, with severe short stature and a combined
    spondylo-epi-metaphyseal radiographic picture. Recessive rather than dominant,
    and curated as its own dismech entry. It is the reason this entry states its
    heterozygous scope explicitly.
- name: SHOX deficiency disorders
  description: >-
    The other common monogenic cause of mildly disproportionate short stature
    reached through an endocrine clinic, and the one ACAN is most often tested
    alongside. Distinguished by Madelung deformity and mesomelia, and by a bone
    age that is not advanced.
- name: Spondyloepiphyseal dysplasia congenita
  description: >-
    COL2A1-related spondyloepiphyseal dysplasia is a differential for the SEDK
    presentation. Congenital skeletal findings and associated ocular or hearing
    abnormalities can help distinguish it; absence of these findings alone is not
    diagnostic.
- name: Sporadic osteochondritis dissecans
  description: >-
    Far commoner than the familial form and usually attributed to repetitive
    joint loading in an athletic adolescent. Short stature in the patient or the
    family, or lesions in several joints, is what should raise the familial
    possibility.
discussions:
- discussion_id: acan_spectrum_lumping
  kind: OPEN_QUESTION
  prompt: >-
    Is one spectrum entry with two subtypes the right granularity for the
    dominant ACAN disorders, or should SED Kimberley type and SSOAOD be separate
    entries?
  rationale: >-
    SED Kimberley type, SSOAOD and familial osteochondritis dissecans form an
    overlapping ACAN allelic spectrum. The 2022 functional study discusses familial OCD
    as a potential subgroup of SSOAOD while leaving open whether its mechanism merits a
    separate entity. This entry retains the existing dominant-spectrum scope and subtype
    distinctions. The separate biallelic SEMD entry is not absorbed; enrichment of joint
    disease-associated variants in G3 does not imply that every dominant variant has the
    same molecular effect.
  attaches_to:
  - has_subtypes#SEDK
  - has_subtypes#SSOAOD
  - disease#ACAN-Related Short Stature Spectrum
- discussion_id: acan_haploinsufficiency_vs_g3
  kind: CONTROVERSY
  prompt: >-
    Do the G3 C-type lectin missense alleles act simply by reducing functional
    aggrecan dose, or by a distinct mechanism that the haploinsufficiency model
    does not capture?
  rationale: >-
    Functional haploinsufficiency is a proposed explanation for growth impairment,
    whereas selected G3 variants have experimentally separable secretion and
    ligand-binding defects. The 2017 cohort found no simple variant-class association
    with joint complaints; the 2024 Dutch cohort found an association with height. These
    observations do not establish molecular equivalence across all variants. The
    contribution of ER retention, reduced export and altered extracellular interactions
    to each clinical presentation remains unresolved.
  attaches_to:
  - pathophysiology#Aggrecan Deficiency in the Cartilage Extracellular Matrix
  - pathophysiology#Impaired Matrix Ligand Binding of G3-Domain Variant Aggrecan
  - pathophysiology#Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
- discussion_id: acan_secretion_versus_presence
  kind: CONTROVERSY
  prompt: >-
    How do assay context and allele-specific secretion influence the amount and function
    of aggrecan in patient cartilage?
  rationale: >-
    The 2010 study detected variant protein in patient cartilage and found similar total
    proteoglycan in a patient extract and pooled osteoarthritic control extracts. The
    2016 differentiated-cell study found ER retention and extracellular depletion. The
    2022 p.V2455M explant pilot measured less variant than wild-type protein in tissue
    and medium. These are distinct measurements in different systems, not proof of
    either normal secretion or complete failure across all tissues. Splice construct and
    differentiation state may influence results; their contributions have not been
    isolated in a matched comparison.
  attaches_to:
  - pathophysiology#Impaired Matrix Ligand Binding of G3-Domain Variant Aggrecan
  - pathophysiology#Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
  - pathophysiology#Reduced Secretion of G3-Domain Variant Aggrecan
- discussion_id: acan_growth_promoting_therapy_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does growth hormone, with or without bone age suppression, improve adult
    height in this condition?
  rationale: >-
    Prospective and retrospective studies support improved childhood growth, but the
    magnitude of an adult-height benefit and the added value of pubertal suppression
    remain uncertain. The 2024 three-year prospective trial was single-arm, and its
    authors caution against treating early growth response or predicted adult height as
    attained adult height. Later family follow-up likewise leaves long-term benefit
    unresolved. Some adult or near-adult outcomes exist, so the uncertainty is
    comparative effectiveness, not complete absence of adult-height observations.
  attaches_to:
  - treatments#Recombinant Human Growth Hormone
  - treatments#Pubertal Suppression with a GnRH Analogue
  - pathophysiology#Premature Epiphyseal Fusion
  - treatments#Aromatase Inhibition with Letrozole
- discussion_id: acan_heterozygous_growth_plate_evidence
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the premature hypertrophic maturation seen in aggrecan-null animals
    actually occur in the growth plate of a human heterozygote?
  rationale: >-
    Premature hypertrophic maturation is inferred from aggrecan-null animal growth
    plates and human radiographic observations. Null animal disease and heterozygous
    human disease differ substantially in dosage and severity. Direct measurement of
    maturation timing in an appropriate heterozygous model or human growth-plate system
    would test this proposed intermediate; the cited human studies do not establish it
    directly.
  attaches_to:
  - pathophysiology#Premature Epiphyseal Fusion
  - phenotypes#Accelerated skeletal maturation
review_notes: >-
  Reviewed against cached abstracts and substantive full texts, including the 2010 and
  2022 biochemical studies, 2014 and 2017 clinical reports, and the 2024 prospective
  growth-hormone trial. Family-level observations are retained as such and are not
  converted into patient-frequency bands. G3 secretion and binding are separate nodes;
  reduced secretion does not point backwards to ER retention. The 2024 Dutch registry
  cache contains a repository abstract rather than substantive full text despite its
  content-type metadata, so only its abstract is used. The 2026 growth-treatment reports
  supplement, rather than settle, adult-height uncertainty. The offline GeneReviews
  baseline check reports no dedicated chapter. No matching deep-research artifact exists
  for this dominant spectrum; the recessive SEMD report is not treated as the same
  disease. Craniofacial findings retain no causal edge because the reviewed sources do
  not establish their mechanism.
clinical_trials:
- name: NCT03288103
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Registered phase 1/phase 2, open-label, single-arm pilot of growth hormone in
    children with ACAN deficiency, extended from one to three treatment years. The
    single-valued phase field records phase II; the registry lists both phase I and
    phase II. Phase and completed status were checked against the ClinicalTrials.gov
    record during this review.
  evidence:
  - reference: clinicaltrials:NCT03288103
    reference_title: Clinical Characterization and Trial of Growth Hormone Treatment in Patients With Aggrecan (ACAN) Deficiency
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This is an open-label, single-arm prospective pilot study to study the effects of
      a single dose regimen of daily growth hormone medication (Norditropin) on
      pre-pubertal children with Aggrecan deficiency.
    explanation: >-
      The registry summary establishes the disease, intervention and uncontrolled
      prospective design.
  - reference: PMID:39502477
    reference_title: "Treatment of Short Stature in Aggrecan-deficient Patients With Recombinant Human GH: 3-year Response."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten treatment-naïve prepubertal patients with genetically confirmed ACAN
      deficiency were treated with rhGH for 3 years in an open-label, single-arm
      prospective study.
    explanation: >-
      Establishes the prospective interventional design and absence of a randomized
      comparison.

  evidence:
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study demonstrates that heterozygous mutations in ACAN can cause a mild
      skeletal dysplasia, which presents clinically as short stature with advanced
      bone age.
    explanation: >-
      Delineates the subtype as a mild dysplasia presenting as short stature with
      advanced bone age, which is what distinguishes it from SEDK.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patients have short stature, variable, mild facial dysmorphism, and
      brachydactyly, but do not exhibit the vertebral body deformities detected in
      SEDK and SEMD.
    explanation: >-
      The authors' own contrast with SEDK, which is the clinical basis for keeping
      the two as separate subtypes inside one entry rather than merging them.
pathophysiology:
- name: Heterozygous ACAN Variants
  description: >-
    Heterozygous pathogenic ACAN variants include truncating, splice-site and missense
    alleles distributed across the gene. Missense variants associated with familial
    osteochondritis dissecans are enriched in the G3 domain, but neither all missense
    variants nor all familial osteochondritis dissecans variants are restricted to that
    domain. Variant class, domain and experimental system must be distinguished when
    interpreting functional effects.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  evidence:
  - reference: PMID:16080123
    reference_title: >-
      A mutation in the variable repeat region of the aggrecan gene (AGC1) causes
      a form of spondyloepiphyseal dysplasia associated with severe, premature
      osteoarthritis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We screened AGC1 for mutations and identified a single-base-pair insertion,
      within the variable repeat region of exon 12 in affected individuals from
      the family with SEDK, that introduces a frameshift of 212 amino acids,
      including 22 cysteine residues, followed by a premature stop codon.
    explanation: >-
      The founding truncating allele, given in the detail that establishes it as a
      protein-truncating rather than a missense lesion.
  - reference: PMID:33471655
    reference_title: >-
      Growth-Promoting Therapies May Be Useful In Short Stature Patients With
      Nonspecific Skeletal Abnormalities Caused By Acan Heterozygous Mutations:
      Six Chinese Cases And Literature Review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of these mutations can lead to protein truncation.
    explanation: >-
      Quantifies the split between the truncating and non-truncating allele
      classes across the reported series, which is why this node branches rather
      than asserting one mechanism.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mapping these and other ACAN variants linked to hereditary skeletal
      disorders showed a clustering of osteochondritis dissecans-linked variants
      to the G3 domain.
    explanation: >-
      The enrichment concerns osteochondritis dissecans-associated variants, not every
      missense allele in the ACAN spectrum.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.

    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, an additional fOCD missense ACAN variant has been reported
      affecting the aggrecan G1 globular domain
    explanation: >-
      The full-text discussion explicitly records a familial OCD variant outside G3, so
      clustering is not an absolute domain restriction.
    quote_role: BACKGROUND
  downstream:
  - target: Aggrecan Deficiency in the Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      The route taken by the truncating alleles: one functional copy of the gene
      supplies the matrix.
  - target: Impaired Matrix Ligand Binding of G3-Domain Variant Aggrecan
    causal_link_type: DIRECT
    description: >-
      Studied G3 missense variants alter ligand affinity.
    evidence:
    - reference: PMID:20137779
      reference_title: >-
        A missense mutation in the aggrecan C-type lectin domain disrupts extracellular
        matrix interactions and causes dominant familial osteochondritis dissecans.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Binding studies with recombinant mutated and wild-type G3 proteins showed loss
        of fibulin-1, fibulin-2, and tenascin-R interactions for the V2303M protein.
      explanation: >-
        The 2010 assays demonstrate impaired ligand interactions for p.V2303M; the full
        text distinguishes weakened affinity from complete loss across constructs.
  - target: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
    causal_link_type: DIRECT
    description: >-
      Patient-derived cells carrying p.V2303M show ER aggrecan accumulation.
    evidence:
    - reference: PMID:27388238
      reference_title: >-
        Chondrocytes Derived From Mesenchymal Stromal Cells and Induced Pluripotent
        Cells of Patients With Familial Osteochondritis Dissecans Exhibit an Endoplasmic
        Reticulum Stress Response and Defective Matrix Assembly.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Second, it was evident that large amounts of aggrecan accumulated within the
        endoplasmic reticulum of chondrocytes differentiated from both BM-MSCs and
        iPSCs.
      explanation: >-
        The direct observation of intracellular retention that this node names, made
        independently in two patient-derived chondrocyte systems.
  - target: Reduced Secretion of G3-Domain Variant Aggrecan
    causal_link_type: DIRECT
    description: >-
      G3 missense variant expression constructs show reduced secretion.
    evidence:
    - reference: PMID:35338222
      reference_title: >-
        Novel missense ACAN gene variants linked to familial osteochondritis dissecans
        cluster in the C-terminal globular domain of aggrecan.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: >-
        Functional studies showed that neither recombinant variant proteins, nor
        full-length variant aggrecan proteoglycan from heterozygous patient cartilage,
        were secreted to the same level as wild-type aggrecan.
      explanation: >-
        Supports decreased secretion in recombinant constructs and in the patient
        explant experiment, with experimental scope specified by the full-text evidence
        below.
  notes: >-
    The variant numbering in the cited sources is not uniform - see the
    nomenclature hazard recorded in the entry notes. Each snippet quotes its own
    source's notation rather than a normalized form.
- name: Aggrecan Deficiency in the Cartilage Extracellular Matrix
  description: >-
    Reduced functional aggrecan availability is a proposed convergence mechanism for
    impaired cartilage growth. Similar growth impairment across allele classes in the
    2017 cohort supported functional haploinsufficiency, but did not demonstrate
    identical molecular effects. The 2024 Dutch cohort found shorter stature among
    subjects with truncating than non-truncating variants. Secretion and ligand-binding
    defects remain experimentally distinguishable in G3 missense disease.
  role: mechanism
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: ABNORMAL
    term:
      id: GO:0030198
      label: extracellular matrix organization
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, it is likely that the impairment of growth plate chondrogenesis
      is due to functional haploinsufficiency of aggrecan, rather than different
      mutation-specific mechanisms (25).
    explanation: >-
      The authors' own statement of the convergent mechanism this node asserts.
      Marked DIRECT because it states the claim, and note it is offered as a
      likelihood rather than a demonstration - the acan_haploinsufficiency_vs_g3
      discussion records what is not settled by it.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together, these findings suggest that different disease-causing
      heterozygous ACAN variants impair growth plate chondrogenesis similarly,
      which, in turn, suggests a common mechanism.
    explanation: >-
      The clinical observation the dosage inference rests on - similar growth
      impairment across different variant types. Marked INDIRECT because the
      common mechanism is inferred from phenotypic similarity, not measured.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      The large proteoglycan aggrecan is vital for skeletal development and
      cartilage function, creating a swelling pressure in the tissue that provides
      resistance to compression and load dissipation over the joint surface
    explanation: >-
      States the biophysical function that a reduced aggrecan dose degrades, which
      is why this node is the pivot of the entry. Graded quote_role BACKGROUND
      because the sentence opens the paper's introduction and restates established
      cartilage biology rather than reporting this study's own result;
      evidence_source OTHER because the restated claim is textbook matrix biology
      with no single study design behind it.
  - reference: PMID:38232712
    reference_title: "Clinical Characteristics of Pathogenic ACAN Variants and 3-Year Response to Growth Hormone Treatment: Real-World Data."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects with a truncating ACAN variant had a shorter height SDS compared to
      subjects with a non-truncating variant (-2.8 SDS and -2.1 SDS, respectively, p =
      0.002).
    explanation: >-
      A later cohort identifies an allele-class association with height; the earlier
      absence of a correlation cannot establish universal molecular equivalence.
  downstream:
  - target: Impaired Growth Plate Chondrogenesis
    causal_link_type: DIRECT
    description: >-
      Growth-plate cartilage is where longitudinal bone growth is produced, so a
      matrix deficit there limits elongation.
  - target: Articular and Intervertebral Disc Matrix Insufficiency
    causal_link_type: DIRECT
    description: >-
      The same protein is the major proteoglycan of articular cartilage and of the
      intervertebral disc, which is why one gene dose produces a joint arm as well
      as a growth arm.
- name: Reduced Secretion of G3-Domain Variant Aggrecan
  description: >-
    Selected G3 variants are secreted less efficiently in recombinant expression assays,
    with severity depending on the splice construct. In the 2022 pilot explant
    experiment, a patient carrying p.V2455M had less variant than wild-type aggrecan in
    both cartilage and conditioned medium. This is a within-patient allelic comparison,
    not a measurement in cartilage from each of the three newly described families.
  role: mechanism
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: protein secretion
    modifier: DECREASED
    term:
      id: GO:0009306
      label: protein secretion
  evidence:
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies showed that neither recombinant variant proteins, nor
      full-length variant aggrecan proteoglycan from heterozygous patient

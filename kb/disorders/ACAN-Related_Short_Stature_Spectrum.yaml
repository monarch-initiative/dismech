      heterozygous ACAN mutations might be relatively common in families with
      autosomal dominant short stature with accelerated skeletal maturation and
      early growth cessation
    explanation: >-
      Supports the under-ascertainment caveat. Marked INDIRECT because it is the
      authors' expectation about a selected clinical group, not a measured
      frequency in any population.
progression:
- phase: Childhood
  notes: >-
    Growth impairment may become more conspicuous from childhood to adulthood. The 2017
    cohort reported median childhood height -2.0 SDS; endocrine evaluation was normal in
    most probands, and bone age could be normal or advanced.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood height was less affected (median height, -2.0 SDS; range, -4.2 to
      -0.6).
    explanation: >-
      Gives the childhood figure that the adult figure is compared against.
- phase: Puberty and growth cessation
  notes: >-
    Early growth cessation and reduced pubertal growth spurts can occur despite normally
    timed puberty. Bone-age-based adult-height prediction may overestimate attained
    height in this disorder.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This relative advancement of BA appears to reflect decreased remaining
      growth potential as evidenced by the history of early growth cessation in
      subjects
    explanation: >-
      Ties the advanced bone age to lost growth potential at this phase.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, our subjects seemed to undergo growth cessation even earlier
      than their advanced bone ages would suggest, highlighting the inherent
      inaccuracy of height prediction by bone age assessment in children with
      underlying genetic growth disorders.
    explanation: >-
      The specific practical warning about height prediction, which is a
      management-relevant property of this phase and not a general caveat.
- phase: Adult course
  notes: >-
    Adult morbidity can include early osteoarthritis, disc degeneration, back pain and
    osteochondritis dissecans requiring orthopaedic management. The cited cohorts do not
    establish a population survival estimate.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many affected individuals developed early-onset osteoarthritis and
      degenerative disc disease, suggesting dysfunction of the articular cartilage
      and intervertebral disc cartilage.
    explanation: >-
      Records the adult morbidity that dominates this phase.
diagnosis:
- name: Bone Age Radiograph
  description: >-
    A hand and wrist radiograph estimates skeletal maturation; the 2017 study used the
    Greulich and Pyle method. Markedly advanced bone age can be a diagnostic clue, but
    normal bone age does not exclude ACAN-related disease. Height predictions require
    caution in a skeletal growth disorder.
  diagnosis_term:
    preferred_term: radiographic bone age assessment
    term:
      id: NCIT:C137876
      label: Bone Radiography
  presence: Variable bone age advancement; normal bone age does not exclude the disorder
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BA was assessed according to the method of Greulich and Pyle (12) by a
      single reader of the films, who was kept unaware of the age and
      identification of the individuals.
    explanation: >-
      Records the method and its blinding, which is what makes the cohort's bone
      age figures comparable across families.
  notes: >-
    Bound to NCIT:C137876 Bone Radiography, the imaging action this test
    performs. NCIT does carry the exact method the description names -
    NCIT:C181502 Greulich and Pyle Bone Age Estimation, returned by
    `runoak -i ols:ncit search "l~bone age"` - but it is not bindable here on
    positive grounds rather than absent ones: its ancestors are C81307
    Estimation Method and C16847 Technique, with no path to NCIT:C25218
    Clinical Intervention or Procedure, which is the TreatmentActionTerm root.
    It names the reading method, not the clinical action. C137876 is reachable
    from that root via C128940 Radiographic Examination, C16502 Diagnostic
    Imaging Testing, C17369 Imaging Procedure and C18020 Diagnostic Procedure,
    so the binding keeps the radiograph and leaves the bone-age reading to
    preferred_term. An earlier note here recorded a search for "Bone Age
    Determination" returning nothing and concluded no term existed; that query
    was too narrow, and the broader one above returns both terms.
- name: ACAN Sequencing
  description: >-
    A pathogenic or likely pathogenic heterozygous ACAN variant interpreted with the
    phenotype and segregation supports molecular diagnosis. Published approaches include
    candidate-gene Sanger sequencing, targeted panels and exome sequencing. Neither a
    normal skeletal survey nor absence of advanced bone age excludes the disorder. A VUS
    alone does not establish the diagnosis.
  diagnosis_term:
    preferred_term: ACAN sequence analysis
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  presence: Heterozygous ACAN variant in all confirmed patients
  evidence:
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used whole-exome sequencing to study three families with
      autosomal-dominant short stature, advanced bone age, and premature growth
      cessation.
    explanation: >-
      Records the method that identified the gene in the short-stature
      presentation.
  - reference: PMID:29464738
    reference_title: >-
      Heterozygous aggrecan variants are associated with short stature and
      brachydactyly: Description of 16 probands and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACAN should be considered as a candidate gene in patients with short stature
      and minor skeletal defects, particularly those with brachydactyly, and in
      patients with spondyloepiphyseal dysplasia.
    explanation: >-
      States the clinical indication for testing, which is what this diagnosis
      entry is for.
  - reference: PMID:38232712
    reference_title: "Clinical Characteristics of Pathogenic ACAN Variants and 3-Year Response to Growth Hormone Treatment: Real-World Data."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic testing for ACAN deficiency should be considered in any child with
      significant short stature, even in the absence of disproportion, specific
      dysmorphic features, or BA advancement.
    explanation: >-
      The registry study supports considering ACAN analysis beyond the stereotypical
      dysmorphic or advanced-bone-age presentation.
  notes: >-
    A variant-of-unknown-significance rate high enough to matter: 10 of 16
    variants in one series were VUS, and the probands carrying them differed from
    the pathogenic-variant probands in bone age and in coxa valga frequency. A
    reported ACAN variant is not by itself a diagnosis.
treatments:
- name: Recombinant Human Growth Hormone
  description: >-
    Growth hormone has shown improved childhood growth in retrospective cohorts and in
    an open-label, single-arm prospective study of ten children followed for three
    years. The prospective median height gain was +1.21 SDS. These results do not
    establish the size of an adult-height benefit against an untreated control group.
    Older children entering puberty showed an attenuated response; IGF-I elevations
    frequently prompted dose reduction.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During GH treatment, the height SDS increased on average by +0.4, +0.7, and
      +1.0 SDS during the first year, the first 2 years, and the first 3 years of
      treatment, respectively
    explanation: >-
      The quantified growth response in the largest treated series.
  - reference: PMID:36387899
    reference_title: >-
      Description of the molecular and phenotypic spectrum in Chinese patients
      with aggrecan deficiency: Novel ACAN heterozygous variants in eight Chinese
      children and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Promising therapeutic benefits were seen in the patients who received
      growth-promoting treatment, with an increase in growth velocity from 4.52 ±
      1.00 cm/year to 8.03 ± 1.16 cm/year.
    explanation: >-
      The 2022 cohort reports improved growth velocity in a small treated series that
      includes variants classified as uncertain; it is supportive observational
      evidence, not a controlled pathogenic-variant-only trial.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, to rigorously assess the efficacy and safety of GHs for the
      treatment of children with short stature due to ACAN mutations, a randomized
      controlled trial would be required.
    explanation: >-
      The 2017 authors explicitly limit the certainty of their observational treatment
      findings; this is compatible with, rather than a refutation of, the qualified
      treatment claim.
  - reference: PMID:39502477
    reference_title: "Treatment of Short Stature in Aggrecan-deficient Patients With Recombinant Human GH: 3-year Response."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cumulative median ΔHtSDS over 3 years was +1.21 (range, +0.82 to +1.94).
    explanation: >-
      Quantifies the prospective childhood height response in ten participants; it is
      not measured adult-height gain.
  - reference: PMID:39502477
    reference_title: "Treatment of Short Stature in Aggrecan-deficient Patients With Recombinant Human GH: 3-year Response."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ten treatment-naïve prepubertal patients with genetically confirmed ACAN
      deficiency were treated with rhGH for 3 years in an open-label, single-arm
      prospective study.
    explanation: >-
      Establishes the prospective interventional design and absence of a randomized
      comparison.
  - reference: PMID:39502477
    reference_title: "Treatment of Short Stature in Aggrecan-deficient Patients With Recombinant Human GH: 3-year Response."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although all patients were started on an rhGH dose of 50 mcg/kg/day
      subcutaneously, 8 subjects underwent a protocol-driven dose reduction based on
      elevated IGF-I concentrations.
    explanation: >-
      Full-text safety monitoring shows that the initial dose frequently needed
      adjustment; the starting dose should not be copied as a universal treatment
      recommendation.
  - reference: PMID:39502477
    reference_title: "Treatment of Short Stature in Aggrecan-deficient Patients With Recombinant Human GH: 3-year Response."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients were diagnosed with OD (2 during the trial and 1 after completion
      of the trial), a known potential phenotypic manifestation with ACAN deficiency
    explanation: >-
      Joint lesions were detected during follow-up. The study does not establish whether
      treatment caused them.
  - reference: PMID:38232712
    reference_title: "Clinical Characteristics of Pathogenic ACAN Variants and 3-Year Response to Growth Hormone Treatment: Real-World Data."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 3 years of GH, height gain SDS in prepubertal children was 1.0 SDS
      (0.9-1.4). In pubertal children, height SDS remained relatively stable.
    explanation: >-
      The Dutch registry independently supports a larger response before puberty.
  - reference: PMID:41211650
    reference_title: Impact of Growth Hormone Treatment in Children From an Extended Family With ACAN -Related Short Stature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The long-term impact on final adult height remains to be elucidated.
    explanation: >-
      A later extended-family follow-up retains the adult-height uncertainty despite
      improved growth during treatment.
  - reference: PMID:42498135
    reference_title: "Phenotypic Characterization and recombinant human growth hormone Therapeutic Response in ACAN Children With Short Stature: A Real-World Study."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Growth velocity at 3, 6, 9, 12, and 18 months was significantly higher than
      baseline (all P < .05).
    explanation: >-
      The 2026 retrospective series reports improved growth velocity during treatment in
      17 children; this is not a randomized adult-height comparison.
  target_mechanisms:
  - target: Impaired Growth Plate Chondrogenesis
    treatment_effect: MODULATES
    description: >-
      Growth hormone acts on the growth plate to increase chondrocyte
      proliferation and matrix production. It does not restore aggrecan, so the
      effect is a partial compensation at the affected node rather than a
      correction of the lesion - which is consistent with the modest observed
      response.
    evidence:
    - reference: PMID:27870580
      reference_title: >-
        Clinical Characterization of Patients With Autosomal Dominant Short Stature
        due to Aggrecan Mutations.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both of these observations suggest a modest response to GH, with a
        magnitude similar to that seen with GH treatment of idiopathic short
        stature (32, 33).
      explanation: >-
        Supports a partial, non-specific effect at the growth plate. Marked
        INDIRECT because the inference from a height gain to an action on this
        node is not measured in these patients.
  notes: >-
    Graded PROTEIN_REPLACEMENT as the modality because somatropin is recombinant
    human growth hormone given as a protein; note it replaces nothing that is
    deficient in this disease, which is the point of the MODULATES rather than
    CORRECTS link above.
- name: Pubertal Suppression with a GnRH Analogue
  description: >-
    GnRH analogues have been combined with growth hormone to delay pubertal skeletal
    maturation. The 2017 cohort had paired radiographs in only two treated individuals,
    with arrested bone-age progression during observation. This surrogate response does
    not establish improvement in final adult height.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gonadotropin-releasing hormone analogue
      term:
        id: NCIT:C1910
        label: Gonadotropin-releasing Hormone Analog
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During treatment, BA progression was halted (0 years of
      progression/chronological year) during 9 and 22 months of
      gonadotropin-releasing hormone analog treatment, respectively.
    explanation: >-
      The measured effect on the surrogate endpoint, in the two patients with
      paired radiographs.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, no adverse events or serious side effects from the treatments,
      including no new or worsened joint pain, were recorded for any of the
      patients.
    explanation: >-
      The safety observation, and specifically that the joint arm did not worsen -
      a reasonable prior concern when suppressing sex steroids in a cartilage
      disease. Marked INDIRECT because absence of recorded events in a
      retrospective cohort is weak evidence of safety.
  target_mechanisms:
  - target: Premature Epiphyseal Fusion
    treatment_effect: INHIBITS
    description: >-
      Suppression of gonadotropins and gonadal sex steroids may delay pubertal
      growth-plate maturation and fusion. This does not correct the ACAN defect, and
      advanced bone age before puberty is not necessarily estrogen dependent.
    evidence:
    - reference: PMID:24762113
      reference_title: >-
        Short stature, accelerated bone maturation, and early growth cessation due
        to heterozygous aggrecan mutations.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the fact that affected females seem to experience sudden growth
        cessation early in puberty taken together with the finding that GnRH
        analog treatment essentially froze bone age progression in the proband of
        Family 3 suggest an important role for estrogen.
      explanation: >-
        The reasoning that links the treatment to this node through estrogen.
        Marked INDIRECT because the estrogen role is inferred from the treatment
        response and the sex difference rather than measured.
- name: Aromatase Inhibition with Letrozole
  description: >-
    One male in the 2017 cohort received growth hormone plus letrozole, with halted
    bone-age progression during treatment. This single-patient, combined-treatment
    observation does not establish efficacy or safety for routine use.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

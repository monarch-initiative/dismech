differential_diagnoses:
- name: Idiopathic short stature
  description: >-
    Not a mimic so much as the label these patients carry until someone sequences
    them. What should prompt the test is short stature with a normal endocrine
    workup plus any of brachydactyly, an advanced bone age, a family history of
    early growth cessation, or a family history of early-onset osteoarthritis.
- name: Spondyloepimetaphyseal dysplasia, aggrecan type
  description: >-
    The biallelic form of the same gene, with severe short stature and a combined
    spondylo-epi-metaphyseal radiographic picture. Recessive rather than dominant,
    and curated as its own dismech entry. It is the reason this entry states its
    heterozygous scope explicitly.
- name: SHOX deficiency disorders
  description: >-
    The other common monogenic cause of mildly disproportionate short stature
    reached through an endocrine clinic, and the one ACAN is most often tested
    alongside. Distinguished by Madelung deformity and mesomelia, and by a bone
    age that is not advanced.
- name: Spondyloepiphyseal dysplasia congenita
  description: >-
    COL2A1-related, and the differential for the SEDK end of the spectrum.
    Congenital rather than postnatal growth failure, with ocular and hearing
    involvement that the type II collagenopathies carry and this condition does
    not.
- name: Sporadic osteochondritis dissecans
  description: >-
    Far commoner than the familial form and usually attributed to repetitive
    joint loading in an athletic adolescent. Short stature in the patient or the
    family, or lesions in several joints, is what should raise the familial
    possibility.
discussions:
- discussion_id: acan_spectrum_lumping
  kind: OPEN_QUESTION
  prompt: >-
    Is one spectrum entry with two subtypes the right granularity for the
    dominant ACAN disorders, or should SED Kimberley type and SSOAOD be separate
    entries?
  rationale: >-
    They have separate MONDO terms, separate OMIM numbers and separate historical
    literatures, which is the usual argument for separate entries. Lumped here for
    four reasons. One gene, one allelic series, and no genotype-phenotype rule -
    the largest cohort found no correlation between mutation type and joint
    disease. One mechanism: the same cohort concluded that different variants
    impair growth plate chondrogenesis similarly. MONDO itself has since minted a
    parent class over them. And the boundary is already leaking in the literature:
    familial osteochondritis dissecans was described as its own entity, is now
    placed under the SSOAOD OMIM entry, and Sillat et al. simply label their
    families "fOCD/SSOAOD". What would argue for splitting is a demonstrated
    mechanistic difference between the two presentations rather than a difference
    in how they were ascertained - the G3-clustering of osteochondritis-dissecans
    alleles is the one hint of that, and it is not yet enough.
  attaches_to:
  - has_subtypes#SEDK
  - has_subtypes#SSOAOD
  - disease#ACAN-Related Short Stature Spectrum
- discussion_id: acan_haploinsufficiency_vs_g3
  kind: CONTROVERSY
  prompt: >-
    Do the G3 C-type lectin missense alleles act simply by reducing functional
    aggrecan dose, or by a distinct mechanism that the haploinsufficiency model
    does not capture?
  rationale: >-
    The cohort argument for a single dosage mechanism is that the growth phenotype
    does not track the mutation class, and it is a good argument for the growth
    arm. It sits awkwardly against three findings on the joint arm. First, the
    osteochondritis-dissecans alleles cluster in the G3 C-type lectin repeat
    rather than being distributed like the truncating alleles, which is not what
    pure dosage predicts. Second, the G3 variant proteins lose binding to
    tenascin-R and the fibulins, so what reaches the matrix is qualitatively
    different and not merely scarcer. Third, patient-derived chondrocytes retain
    variant aggrecan in the endoplasmic reticulum, which is a gain-of-dysfunction
    route with no counterpart in a truncating allele. The observations are not in
    conflict about the data, only about the summary: a truncating allele and a G3
    missense allele can plausibly converge on the growth plate while diverging at
    the joint. Distinguishing them needs joint outcomes compared between allele
    classes in a cohort powered for it, which no study has done.
  attaches_to:
  - pathophysiology#Aggrecan Deficiency in the Cartilage Extracellular Matrix
  - pathophysiology#Impaired Secretion and Matrix Ligand Binding of G3-Domain Variant
    Aggrecan
  - pathophysiology#Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
- discussion_id: acan_secretion_versus_presence
  kind: CONTROVERSY
  prompt: >-
    Is variant aggrecan secreted into patient cartilage or not?
  rationale: >-
    Three results, and they do not obviously agree. Mass spectrometry of aggrecan
    purified from patient cartilage found the p.V2303M protein present in the
    tissue, which was read as excluding a secretion defect. Patient-derived
    chondrocytes later showed aggrecan accumulating in the endoplasmic reticulum
    with a marked absence of it from the extracellular matrix. Direct secretion
    measurement in three further G3 missense families then found reduced - not
    absent - secretion, for recombinant protein and for full-length aggrecan from
    patient cartilage alike. The reconciliation the entry adopts is that secretion
    is reduced rather than abolished, so the protein is detectable in tissue and
    still under-supplied, and that the in vitro system exaggerates the deficit
    because differentiating chondrocytes secrete aggrecan far faster than resting
    ones. That is a plausible reading, not a demonstrated one; nobody has measured
    aggrecan concentration in patient cartilage against controls.
  attaches_to:
  - pathophysiology#Impaired Secretion and Matrix Ligand Binding of G3-Domain Variant
    Aggrecan
  - pathophysiology#Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
- discussion_id: acan_growth_promoting_therapy_evidence
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does growth hormone, with or without bone age suppression, improve adult
    height in this condition?
  rationale: >-
    Every reported treatment outcome is an intermediate one. Growth hormone series
    report height SDS gain or growth velocity over one to three years; the
    gonadotropin-releasing hormone analogue and aromatase inhibitor data report
    bone age progression halted in three patients between them. No study reports
    adult height against an untreated comparison, and the one near-adult figure -
    treated adults at -2.5 SDS against untreated at -3.0 - is a retrospective
    comparison of five people with sixty-five. The cohort's own authors say a
    randomised controlled trial would be required. The mechanistic case for
    combining the two is strong and specific to this disease: the height deficit
    accrues from early growth plate closure, so an agent that delays closure
    targets the responsible node while growth hormone only pushes on the
    compromised one. That is a rationale for a trial, not a substitute for one.
  attaches_to:
  - treatments#Recombinant Human Growth Hormone
  - treatments#Bone Age Suppression with a GnRH Analogue or Aromatase Inhibitor
  - pathophysiology#Premature Hypertrophic Chondrocyte Maturation and Early Epiphyseal
    Fusion
- discussion_id: acan_heterozygous_growth_plate_evidence
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the premature hypertrophic maturation seen in aggrecan-null animals
    actually occur in the growth plate of a human heterozygote?
  rationale: >-
    The mechanism this entry gives for advanced bone age - abnormal hedgehog, FGF
    and BMP signalling driving early chondrocyte hypertrophy, hence early vascular
    invasion and ossification - comes from chick and mouse growth plates lacking
    aggrecan entirely. Complete aggrecan loss is lethal postnatally in mice, cattle
    and chick, whereas the human disease is a heterozygous state compatible with a
    normal lifespan, so the models sit at a different point of the dose-response
    curve by a wide margin, not a small one. On the human side there is no growth
    plate histology at all: the evidence is a radiographic bone age and an age at
    growth cessation. The gap matters for treatment, because bone age suppression
    is aimed squarely at this node. Resolving it would need growth plate tissue
    from an affected individual, which is not obtainable, or a heterozygous animal
    model characterised for maturation timing - which is the tractable route and
    has not been reported.
  attaches_to:
  - pathophysiology#Premature Hypertrophic Chondrocyte Maturation and Early Epiphyseal
    Fusion
  - phenotypes#Accelerated skeletal maturation
review_notes: >-
  Four things a reviewer should look at. First, the granularity decision: this is
  one entry over two MONDO leaves plus a spectrum parent, and the reasoning is in
  the acan_spectrum_lumping discussion rather than only in the commit message.
  The disease_term is the MONDO spectrum class, which also subsumes the recessive
  SEMD aggrecan type; that entry already exists and is deliberately not absorbed
  here, which the entry notes state explicitly. Second, the entry asserts a single
  convergent mechanism and then immediately records two controversies against it -
  that is intentional, not indecision. The cohort evidence for functional
  haploinsufficiency is about the growth arm, and the G3-domain findings are about
  the joint arm; the entry carries both rather than choosing. Third, the
  advanced-bone-age mechanism rests on avian and murine nulls quoted from a human
  paper's discussion, graded MODEL_ORGANISM with quote_role BACKGROUND, and the
  human-model gap is filed as a HUMAN_MODEL_MISMATCH rather than smoothed over -
  it is the node that treatment targets, so the softness matters. GeneReviews
  has no chapter for any member of this spectrum - verified offline
  against the committed Bookshelf index (snapshot 2026-09-10, 958 chapters) with
  just check-genereviews, which reports NO_CHAPTER. The StatPearls chapter it
  surfaces as a candidate, NBK526091 "Osteochondritis Dissecans", is about the
  common sporadic form in athletic adolescents rather than the ACAN-related
  familial one, and is deliberately not cited. Fourth, the
  phenotype frequencies deliberately contradict the condition's own common name:
  advanced bone age is FREQUENT rather than OBLIGATE, with three REFUTE-graded
  quotes behind that, because a normal bone age in a short child does not exclude
  this diagnosis and treating it as a gate is a live clinical failure mode.

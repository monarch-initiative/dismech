    explanation: >-
      The direct observation of intracellular retention that this node names, made
      independently in two patient-derived chondrocyte systems.
  - reference: PMID:27388238
    reference_title: >-
      Chondrocytes Derived From Mesenchymal Stromal Cells and Induced Pluripotent
      Cells of Patients With Familial Osteochondritis Dissecans Exhibit an
      Endoplasmic Reticulum Stress Response and Defective Matrix Assembly.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In turn, there was a marked absence of aggrecan in the extracellular matrix.
    explanation: >-
      Links the retention to the matrix deficit, which is the causal edge below.
  - reference: PMID:27388238
    reference_title: >-
      Chondrocytes Derived From Mesenchymal Stromal Cells and Induced Pluripotent
      Cells of Patients With Familial Osteochondritis Dissecans Exhibit an
      Endoplasmic Reticulum Stress Response and Defective Matrix Assembly.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      First, patient chondrogenic pellets had poor structural integrity but were
      rich in glycosaminoglycan.
    explanation: >-
      Separates the assembly defect from a synthesis defect - the cells are making
      glycosaminoglycan, and the tissue they build is still weak. Marked INDIRECT
      because it is a property of the engineered pellet rather than of the retained

has_subtypes:
- name: SEDK
  display_name: Spondyloepiphyseal dysplasia, Kimberley type
  subtype_term:
    preferred_term: spondyloepiphyseal dysplasia, Kimberley type
    term:
      id: MONDO:0012019
      label: spondyloepiphyseal dysplasia, Kimberley type
  description: >-
    The overt skeletal-dysplasia presentation: short stature with vertebral and
    epiphyseal change and premature degenerative arthropathy, recognized as a
    dysplasia on radiographs rather than as isolated short stature. Delineated in
    one multigenerational South African kindred mapped to 15q26.1, in which the
    causal allele is a single-base-pair insertion in the variable repeat region
    of ACAN exon 12 - the first ACAN variant shown to cause a human disorder.
  genes:
  - preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:16080123
    reference_title: >-
      A mutation in the variable repeat region of the aggrecan gene (AGC1) causes
      a form of spondyloepiphyseal dysplasia associated with severe, premature
      osteoarthritis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The autosomal dominant SED type Kimberley (SEDK) is associated with
      premature degenerative arthropathy and has been previously mapped in a
      multigenerational family to a novel locus on 15q26.1.
    explanation: >-
      Establishes SEDK as a dominant entity with joint disease and locates it to
      the ACAN interval, which is what makes it a member of this spectrum rather
      than a separate disease.
  - reference: PMID:16080123
    reference_title: >-
      A mutation in the variable repeat region of the aggrecan gene (AGC1) causes
      a form of spondyloepiphyseal dysplasia associated with severe, premature
      osteoarthritis.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first identification of an AGC1 mutation causing a human
      disorder.
    explanation: >-
      Records SEDK as the founding member of the ACAN allelic series, which is why
      this subtype carries the historical name rather than the spectrum.
- name: SSOAOD
  display_name: Short stature and advanced bone age, with or without early-onset osteoarthritis and/or osteochondritis dissecans
  subtype_term:
    preferred_term: short stature and advanced bone age, with or without early-onset osteoarthritis and/or osteochondritis dissecans
    term:
      id: MONDO:0100462
      label: short stature and advanced bone age, with or without early-onset osteoarthritis and/or osteochondritis dissecans
  description: >-
    The commoner presentation, and the one reached through an endocrine rather than a
    genetics clinic: proportionate or mildly disproportionate short stature with a
    normal endocrine workup, often an advanced bone age, and early growth cessation. Its
    "with or without" clause carries familial osteochondritis dissecans, which was
    described separately in a Swedish five-generation family and is now placed under the
    same OMIM entity; Stattin et al. label their families "fOCD/SSOAOD" for exactly that
    reason.
  genes:
  - preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN

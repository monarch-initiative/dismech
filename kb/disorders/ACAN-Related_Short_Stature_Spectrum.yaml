name: ACAN-Related Short Stature Spectrum
creation_date: "2026-09-20T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: ACAN-related short stature spectrum
  term:
    id: MONDO:1060149
    label: ACAN-related short stature spectrum
parents:
- hereditary disease
- Skeletal Dysplasia
synonyms:
- aggrecanopathy
- aggrecan deficiency
- spondyloepiphyseal dysplasia, Kimberley type
- SEDK
- short stature and advanced bone age, with or without early-onset osteoarthritis and/or
  osteochondritis dissecans
- SSOAOD
- familial osteochondritis dissecans
- fOCD
description: >-
  A dominantly inherited spectrum caused by heterozygous variants in ACAN, the
  gene encoding aggrecan - the large proteoglycan that gives cartilage its
  swelling pressure and load-bearing stiffness. Aggrecan is present in both
  growth-plate and articular cartilage, and that single fact organizes the whole
  entry: one gene dose produces a growth arm (short stature with accelerated
  skeletal maturation and early growth cessation) and a joint arm (premature
  osteoarthritis, osteochondritis dissecans, degenerative disc disease), and
  which arm brings a family to attention is largely how the historical disease
  names were assigned. The spectrum was described piecemeal - spondyloepiphyseal
  dysplasia Kimberley type in one South African kindred, familial osteochondritis
  dissecans in a five-generation Swedish family, then autosomal dominant short
  stature with advanced bone age - and only later recognized as one condition.
  Two mechanisms feed it. Roughly half of reported variants truncate the core
  protein, so the matrix runs on a reduced dose of normal aggrecan; the rest are
  missense substitutions that cluster in the C-type lectin repeat of the
  C-terminal G3 domain, where they impair both secretion and binding to the
  matrix ligands that anchor aggrecan into the network. This entry is scoped to
  the heterozygous forms. The biallelic severe extreme, spondyloepimetaphyseal
  dysplasia aggrecan type, is a MONDO child of the same spectrum term but is
  curated at depth as its own dismech entry and is deliberately not absorbed here.
notes: >-
  SCOPE NOTE (deliberate; read before changing disease_term or has_subtypes).
  MONDO:1060149 has exactly three children: MONDO:0012019 (SED Kimberley type),
  MONDO:0100462 (SSOAOD) and MONDO:0013014 (SEMD aggrecan type). The first two
  are the dominant forms curated here as has_subtypes. The third is recessive and
  is already a full dismech entry
  (kb/disorders/Spondyloepimetaphyseal_Dysplasia_Aggrecan_Type.yaml, MONDO:0013014),
  which states its own scope as "relating the others rather than absorbing them".
  This entry returns the complement: the spectrum term is used as the anchor
  because it is the only MONDO class that names the dominant spectrum at all, and
  the recessive extreme is recorded as a differential diagnosis and in the genetic
  notes rather than duplicated as a third subtype. The two entries therefore cover
  the parent term and one of its children respectively, and share no disease_term.

  VARIANT NOMENCLATURE HAZARD. The G3-domain missense variants in this spectrum
  have been renumbered. The familial osteochondritis dissecans allele published as
  p.V2303M (NM_013227.2) is p.V2455M under RefSeq NM_001369268.1; the SSOAOD
  allele published as p.L2355P is p.L2393P; and the recessive SEMD allele
  published as p.D2267N is p.D2419N. Sillat et al. (PMID:35338222) give the
  mapping table. Both numbering systems are in current use, so a variant matched
  by residue number alone can be assigned to the wrong allele - and two of the
  three renumbered alleles belong to different diseases in this same gene. Quote
  each source's own notation rather than normalizing it.

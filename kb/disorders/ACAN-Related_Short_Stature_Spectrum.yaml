  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In a pilot experiment, we cultured cartilage explants from an fOCD patient
      heterozygous for the p.V2455M variant, obtained at arthroplasty for advanced
      osteoarthritis.
    explanation: >-
      Identifies the patient allele and the pilot explant design; the full-length
      experiment did not sample all three new variant families.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The variant protein was, however, only present at low levels, both in the tissue
      explant (Fig. 6a) and the culture medium (Fig. 6b).
    explanation: >-
      Variant-specific mass spectrometry found reduced variant protein relative to wild
      type in the heterozygous patient explant and medium.
  - reference: PMID:20137779
    reference_title: >-
      A missense mutation in the aggrecan C-type lectin domain disrupts
      extracellular matrix interactions and causes dominant familial
      osteochondritis dissecans.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mass spectrometric analyses of aggrecan purified from patient cartilage
      verified that V2303M aggrecan is produced and present in the tissue.
    explanation: >-
      Detection in patient tissue establishes residual delivery of variant aggrecan,
      compatible with reduced secretion rather than complete absence.
  downstream:
  - target: Aggrecan Deficiency in the Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Reduced export decreases the amount of variant aggrecan available to the
      extracellular matrix.
- name: Impaired Matrix Ligand Binding of G3-Domain Variant Aggrecan
  description: >-
    Studied G3 C-type lectin variants alter extracellular ligand binding. The 2010
    p.V2303M experiments found weakened or absent interactions depending on ligand and
    splice construct. The 2022 assays showed pronounced impairment of fibulin-1 and
    tenascin-C binding, with residual tenascin-R binding in all variants tested.
    Tenascin-R is a CNS ligand in that study, so its assay result is not evidence that
    it is the relevant cartilage ligand.
  role: mechanism
  biological_scale: MOLECULAR
  genes:
  - preferred_term: TNC

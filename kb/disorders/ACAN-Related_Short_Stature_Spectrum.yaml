    Two variant classes. Protein-truncating variants (frameshift, nonsense,
    splice-site) account for roughly half of those reported and act by reducing
    the dose of normal aggrecan. Missense variants in the C-type lectin repeat of
    the G3 domain produce a full-length protein with reduced secretion and reduced
    binding to matrix ligands; those linked to osteochondritis dissecans cluster
    there.

    ACAN is allelic across a severity range that spans a normal-variation
    contribution to height at one end and a lethal-grade recessive dysplasia at
    the other. This entry is scoped to the heterozygous forms. The biallelic form,
    spondyloepimetaphyseal dysplasia aggrecan type, is curated separately as
    kb/disorders/Spondyloepimetaphyseal_Dysplasia_Aggrecan_Type.yaml. Note that
    the recessive allele p.D2267N/p.D2419N sits in the same G3 C-type lectin
    repeat as the dominant osteochondritis-dissecans alleles, so domain location
    alone does not predict inheritance mode or severity.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified ACAN variants showed perfect cosegregation with phenotype.
    explanation: >-
      The segregation evidence across 20 families, which is what establishes
      causation rather than association for this gene.
  - reference: PMID:29464738
    reference_title: >-
      Heterozygous aggrecan variants are associated with short stature and
      brachydactyly: Description of 16 probands and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the aggrecan gene (ACAN) have been identified in two autosomal
      dominant skeletal dysplasias, spondyloepiphyseal dysplasia, Kimberley type
      (SEDK), and osteochondritis dissecans, as well as in a severe recessive
      dysplasia, spondyloepimetaphyseal dysplasia, aggrecan type.
    explanation: >-
      Enumerates the allelic series and its two inheritance modes, which is the
      basis for this entry's scope statement.
  - reference: PMID:33471655
    reference_title: >-
      Growth-Promoting Therapies May Be Useful In Short Stature Patients With
      Nonspecific Skeletal Abnormalities Caused By Acan Heterozygous Mutations:
      Six Chinese Cases And Literature Review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of these mutations can lead to protein truncation.
    explanation: >-
      Quantifies the truncating class, which is the basis for the two-class
      description above.
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously reported a missense ACAN variant linked to familial
      osteochondritis dissecans, with short stature and early onset osteoarthritis,
      and now describe three novel ACAN gene variants from additional families with
      this disorder.
    explanation: >-
      Establishes that the osteochondritis-dissecans presentation is not a single
      private allele, which is what makes the G3 clustering a finding rather than
      a coincidence.
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant with apparently complete penetrance for short stature in
    the reported families - variants cosegregated perfectly with phenotype across
    20 kindreds, including a five-generation family and several three-generation
    ones. The joint features are variable within families carrying the same
    allele, so penetrance is best described per-feature rather than per-disease.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified ACAN variants showed perfect cosegregation with phenotype.
    explanation: >-
      The segregation result underpinning the dominant assignment.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No apparent genotype-phenotype correlation was found between the type of
      ACAN mutation and the presence of joint complaints.
    explanation: >-
      Supports describing penetrance per-feature: the joint arm varies
      independently of the allele class.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population prevalence estimate exists. More than 200 genetically confirmed
    individuals had been reported by the 2020 literature review, and the true
    frequency is unknown but plausibly higher than that count: the mild
    presentations are indistinguishable from idiopathic short stature without
    sequencing, and the cohort authors note the condition may be relatively common
    among families with dominant short stature and early growth cessation.
  evidence:
  - reference: PMID:33471655
    reference_title: >-
      Growth-Promoting Therapies May Be Useful In Short Stature Patients With
      Nonspecific Skeletal Abnormalities Caused By Acan Heterozygous Mutations:
      Six Chinese Cases And Literature Review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the literature, more than 200 affected individuals have been diagnosed
      genetically with a similar condition
    explanation: >-
      The reported case count behind the CASES_IN_LITERATURE measure.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      heterozygous ACAN mutations might be relatively common in families with
      autosomal dominant short stature with accelerated skeletal maturation and
      early growth cessation
    explanation: >-
      Supports the under-ascertainment caveat. Marked INDIRECT because it is the
      authors' expectation about a selected clinical group, not a measured
      frequency in any population.
progression:
- phase: Childhood
  notes: >-
    Height in childhood is less affected than adult height - median -2.0 SDS
    against -2.8 SDS in the same cohort. Endocrine evaluation is normal, which is
    what leaves these children labelled idiopathic short stature; the bone age may
    be advanced, normal, or only modestly advanced.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Childhood height was less affected (median height, -2.0 SDS; range, -4.2 to
      -0.6).
    explanation: >-
      Gives the childhood figure that the adult figure is compared against.
- phase: Puberty and growth cessation
  notes: >-
    The decisive phase. Growth stops at a median of 12 years (range 9 to 16)
    despite normally timed puberty, often with a blunted pubertal spurt - so the
    adult height deficit is accrued here rather than accumulated throughout
    childhood. Height prediction from bone age systematically over-estimates adult
    height in these children, because they stop growing even earlier than their
    advanced bone age would suggest.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This relative advancement of BA appears to reflect decreased remaining
      growth potential as evidenced by the history of early growth cessation in
      subjects
    explanation: >-
      Ties the advanced bone age to lost growth potential at this phase.
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, our subjects seemed to undergo growth cessation even earlier
      than their advanced bone ages would suggest, highlighting the inherent
      inaccuracy of height prediction by bone age assessment in children with
      underlying genetic growth disorders.
    explanation: >-
      The specific practical warning about height prediction, which is a
      management-relevant property of this phase and not a general caveat.
- phase: Adult course
  notes: >-
    Stature is fixed; the burden shifts to the joints. Early-onset osteoarthritis,
    degenerative disc disease with back pain, and in some individuals
    osteochondritis dissecans requiring orthopaedic management. The condition is
    not life-limiting on available evidence.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Many affected individuals developed early-onset osteoarthritis and
      degenerative disc disease, suggesting dysfunction of the articular cartilage
      and intervertebral disc cartilage.
    explanation: >-
      Records the adult morbidity that dominates this phase.
diagnosis:
- name: Bone Age Radiograph
  description: >-
    A left hand and wrist radiograph read by the Greulich and Pyle method. Its
    value here is as a trigger for sequencing rather than as a diagnostic test:
    short stature with an advanced bone age is unusual enough to be worth
    pursuing. Two cautions follow from the phenotype data - a normal bone age does
    not exclude the diagnosis, since most families have normal or only modestly
    advanced maturation, and the resulting adult-height prediction is
    systematically too optimistic.
  diagnosis_term:
    preferred_term: radiographic bone age assessment
    term:
      id: NCIT:C137876
      label: Bone Radiography
  presence: Advanced in a minority of families; normal or modestly advanced in most
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BA was assessed according to the method of Greulich and Pyle (12) by a
      single reader of the films, who was kept unaware of the age and
      identification of the individuals.
    explanation: >-
      Records the method and its blinding, which is what makes the cohort's bone
      age figures comparable across families.
  notes: >-
    Bound to NCIT:C137876 Bone Radiography, the imaging action this test
    performs. NCIT does carry the exact method the description names -
    NCIT:C181502 Greulich and Pyle Bone Age Estimation, returned by
    `runoak -i ols:ncit search "l~bone age"` - but it is not bindable here on
    positive grounds rather than absent ones: its ancestors are C81307
    Estimation Method and C16847 Technique, with no path to NCIT:C25218
    Clinical Intervention or Procedure, which is the TreatmentActionTerm root.
    It names the reading method, not the clinical action. C137876 is reachable
    from that root via C128940 Radiographic Examination, C16502 Diagnostic
    Imaging Testing, C17369 Imaging Procedure and C18020 Diagnostic Procedure,
    so the binding keeps the radiograph and leaves the bone-age reading to
    preferred_term. An earlier note here recorded a search for "Bone Age
    Determination" returning nothing and concluded no term existed; that query
    was too narrow, and the broader one above returns both terms.
- name: ACAN Sequencing
  description: >-
    Molecular confirmation, and the only way the mild presentations are reached.
    The founding SEDK family was mapped positionally to 15q26.1 and the gene
    sequenced as a candidate; every subsequent family has been found by exome or
    targeted panel sequencing. A skeletal survey is worth doing where a dysplasia
    is suspected, but it is normal in many affected children and cannot rule the
    diagnosis out.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  presence: Heterozygous ACAN variant in all confirmed patients
  evidence:
  - reference: PMID:24762113
    reference_title: >-
      Short stature, accelerated bone maturation, and early growth cessation due
      to heterozygous aggrecan mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used whole-exome sequencing to study three families with
      autosomal-dominant short stature, advanced bone age, and premature growth
      cessation.
    explanation: >-
      Records the method that identified the gene in the short-stature
      presentation.
  - reference: PMID:29464738
    reference_title: >-
      Heterozygous aggrecan variants are associated with short stature and
      brachydactyly: Description of 16 probands and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACAN should be considered as a candidate gene in patients with short stature
      and minor skeletal defects, particularly those with brachydactyly, and in
      patients with spondyloepiphyseal dysplasia.
    explanation: >-
      States the clinical indication for testing, which is what this diagnosis
      entry is for.
  notes: >-
    A variant-of-unknown-significance rate high enough to matter: 10 of 16
    variants in one series were VUS, and the probands carrying them differed from
    the pathogenic-variant probands in bone age and in coxa valga frequency. A
    reported ACAN variant is not by itself a diagnosis.
treatments:
- name: Recombinant Human Growth Hormone
  description: >-
    The most-used intervention, and the evidence for it is observational
    throughout. In the international cohort 14 children treated for at least 12
    months gained +0.4, +0.7 and +1.0 height SDS over one, two and three years,
    and previously treated adults were 0.5 SDS taller than untreated ones - a
    response the authors themselves describe as modest and comparable to growth
    hormone in idiopathic short stature. Two later series report similar gains.
    No randomised trial exists.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: somatropin
      term:
        id: NCIT:C837
        label: Somatropin
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During GH treatment, the height SDS increased on average by +0.4, +0.7, and
      +1.0 SDS during the first year, the first 2 years, and the first 3 years of
      treatment, respectively
    explanation: >-
      The quantified growth response in the largest treated series.
  - reference: PMID:36387899
    reference_title: >-
      Description of the molecular and phenotypic spectrum in Chinese patients
      with aggrecan deficiency: Novel ACAN heterozygous variants in eight Chinese
      children and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Promising therapeutic benefits were seen in the patients who received
      growth-promoting treatment, with an increase in growth velocity from 4.52 ±
      1.00 cm/year to 8.03 ± 1.16 cm/year.
    explanation: >-
      An independent cohort reporting growth velocity rather than height SDS,
      which is a different measure of the same effect.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, to rigorously assess the efficacy and safety of GHs for the
      treatment of children with short stature due to ACAN mutations, a randomized
      controlled trial would be required.
    explanation: >-
      Marked REFUTE against the claim that efficacy is established. The same
      authors who report the gain say their own data cannot settle it, and that
      limitation belongs next to the numbers rather than in a footnote.
  target_mechanisms:
  - target: Impaired Growth Plate Chondrogenesis
    treatment_effect: MODULATES
    description: >-
      Growth hormone acts on the growth plate to increase chondrocyte
      proliferation and matrix production. It does not restore aggrecan, so the
      effect is a partial compensation at the affected node rather than a
      correction of the lesion - which is consistent with the modest observed
      response.
    evidence:
    - reference: PMID:27870580
      reference_title: >-
        Clinical Characterization of Patients With Autosomal Dominant Short
        Stature due to Aggrecan Mutations.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Both of these observations suggest a modest response to GH, with a
        magnitude similar to that seen with GH treatment of idiopathic short
        stature (32, 33).
      explanation: >-
        Supports a partial, non-specific effect at the growth plate. Marked
        INDIRECT because the inference from a height gain to an action on this
        node is not measured in these patients.
  notes: >-
    Graded PROTEIN_REPLACEMENT as the modality because somatropin is recombinant
    human growth hormone given as a protein; note it replaces nothing that is
    deficient in this disease, which is the point of the MODULATES rather than
    CORRECTS link above.
- name: Bone Age Suppression with a GnRH Analogue or Aromatase Inhibitor
  description: >-
    The mechanistically targeted option, and the one that follows directly from
    the pathograph: if adult height is lost because the growth plate closes early,
    then delaying closure should recover some of it. Gonadotropin-releasing
    hormone analogues halted bone age progression outright in the two treated
    individuals with before-and-after radiographs, and letrozole did the same in
    one further patient. This is a handful of patients with a radiographic
    surrogate endpoint - no adult-height outcome has been reported - but the
    estrogen dependence it implies is consistent across the series.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: gonadotropin-releasing hormone analogue
      term:
        id: NCIT:C1910
        label: Gonadotropin-releasing Hormone Analog
    - preferred_term: letrozole
      term:
        id: CHEBI:6413
        label: letrozole
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During treatment, BA progression was halted (0 years of
      progression/chronological year) during 9 and 22 months of
      gonadotropin-releasing hormone analog treatment, respectively.
    explanation: >-
      The measured effect on the surrogate endpoint, in the two patients with
      paired radiographs.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, 1 male patient had received treatment with GH and an aromatase
      inhibitor (letrozole; family 1) for 11 months.
    explanation: >-
      Records the aromatase-inhibitor arm and its n, which is one.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Moreover, no adverse events or serious side effects from the treatments,
      including no new or worsened joint pain, were recorded for any of the
      patients.
    explanation: >-
      The safety observation, and specifically that the joint arm did not worsen -
      a reasonable prior concern when suppressing sex steroids in a cartilage
      disease. Marked INDIRECT because absence of recorded events in a
      retrospective cohort is weak evidence of safety.
  target_mechanisms:
  - target: Premature Hypertrophic Chondrocyte Maturation and Early Epiphyseal Fusion
    treatment_effect: INHIBITS
    description: >-
      Both agents act by removing estrogen signal - the analogue by suppressing
      gonadotropins, letrozole by blocking androgen-to-estrogen conversion - and
      estrogen is what drives growth plate maturation and fusion. The target is
      this node specifically, not the aggrecan lesion, so the intervention buys
      growing time rather than improving the cartilage.
    evidence:
    - reference: PMID:24762113
      reference_title: >-
        Short stature, accelerated bone maturation, and early growth cessation due
        to heterozygous aggrecan mutations.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        However, the fact that affected females seem to experience sudden growth
        cessation early in puberty taken together with the finding that GnRH
        analog treatment essentially froze bone age progression in the proband of
        Family 3 suggest an important role for estrogen.
      explanation: >-
        The reasoning that links the treatment to this node through estrogen.
        Marked INDIRECT because the estrogen role is inferred from the treatment
        response and the sex difference rather than measured.
- name: Orthopaedic Management of Joint and Disc Disease
  description: >-
    The joint arm needs its own follow-up, and it is what most affected adults
    present with: early osteoarthritis, degenerative disc disease that in several
    families required surgery, and osteochondritis dissecans lesions. Nothing here
    is disease-specific - it is standard orthopaedic care - but recording it makes
    the point that a diagnosis reached in an endocrine clinic for short stature
    carries a lifelong musculoskeletal consequence.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our cohort, the affected individuals of several families also reported
      early-onset intervertebral disc disease that often caused neurologic
      symptoms and required surgical intervention.
    explanation: >-
      Documents that surgical management was actually required, rather than
      recommending it.
  target_mechanisms:
  - target: Intervertebral disk degeneration
    treatment_effect: BYPASSES
    description: >-
      Decompressive or stabilising surgery addresses the consequence of the
      degenerated disc; it does nothing to the matrix defect. Targeted at the
      phenotype because that is where the operation acts.
    evidence:
    - reference: PMID:27870580
      reference_title: >-
        Clinical Characterization of Patients With Autosomal Dominant Short Stature
        due to Aggrecan Mutations.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In our cohort, the affected individuals of several families also reported
        early-onset intervertebral disc disease that often caused neurologic
        symptoms and required surgical intervention.
      explanation: >-
        Ties the surgical action to this specific phenotype node - the disc
        disease is what was operated on. It documents the indication, not a
        mechanistic effect, which is why the link is BYPASSES.
- name: Genetic Counselling
  description: >-
    Autosomal dominant with a 50% recurrence risk and near-complete penetrance for
    short stature, so counselling is substantive here rather than formal - and the
    diagnosis routinely reclassifies previously unexplained familial short stature
    in parents and grandparents who were never investigated.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified ACAN variants showed perfect cosegregation with phenotype.
    explanation: >-
      Supports the recurrence-risk counselling this entry describes. Marked
      INDIRECT because the source reports segregation, not counselling.
experimental_models:
- name: Patient BM-MSC and iPSC-derived chondrocyte model of familial osteochondritis
    dissecans
  description: >-
    Chondrocytes differentiated from bone-marrow mesenchymal stromal cells and,
    independently, from iPSC lines of patients heterozygous for the G3 C-type
    lectin missense allele. The two routes were run in parallel and agreed, which
    is what makes the intracellular retention finding more than an artefact of one
    differentiation protocol.
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  cell_source: Patient bone marrow mesenchymal stromal cells and patient fibroblast-derived
    iPSC lines
  publication: PMID:27388238
  modeled_mechanisms:
  - target: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model is where this node comes from: it is the only system in which the
      intracellular fate of variant aggrecan in this disease has been observed.
    limitations: >-
      One allele, one family. Differentiated stromal and iPSC-derived chondrocytes
      are not native growth-plate or articular chondrocytes, and the pellet
      cultures have no mechanical loading, no vasculature and no growth-plate zonal
      architecture - so nothing about the growth arm of the disease can be read off
      this model. Fidelity is MODERATE rather than HIGH because the retention has
      not been confirmed in patient cartilage in situ, and because the same allele
      was earlier shown by mass spectrometry to yield aggrecan that is present in
      patient cartilage.
    readouts:
    - name: Intracellular aggrecan localisation in differentiated chondrocytes
      target: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
      direction: INCREASED
      interpretation: Accumulation within the endoplasmic reticulum, seen in both
        BM-MSC- and iPSC-derived chondrocytes.
      evidence:
      - reference: PMID:27388238
        reference_title: >-
          Chondrocytes Derived From Mesenchymal Stromal Cells and Induced
          Pluripotent Cells of Patients With Familial Osteochondritis Dissecans
          Exhibit an Endoplasmic Reticulum Stress Response and Defective Matrix
          Assembly.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: >-
          Second, it was evident that large amounts of aggrecan accumulated within
          the endoplasmic reticulum of chondrocytes differentiated from both
          BM-MSCs and iPSCs.
        explanation: >-
          The measurement this readout records, in both derivation routes.
    - name: Extracellular matrix aggrecan content
      target: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
      direction: DECREASED
      interpretation: The matrix counterpart of the intracellular accumulation.
      evidence:
      - reference: PMID:27388238
        reference_title: >-
          Chondrocytes Derived From Mesenchymal Stromal Cells and Induced

- name: SSOAOD
  display_name: Short stature and advanced bone age, with or without early-onset osteoarthritis
    and/or osteochondritis dissecans
  subtype_term:
    preferred_term: short stature and advanced bone age, with or without early-onset
      osteoarthritis and/or osteochondritis dissecans
    term:
      id: MONDO:0100462
      label: short stature and advanced bone age, with or without early-onset osteoarthritis
        and/or osteochondritis dissecans
  description: >-
    The commoner presentation, and the one reached through an endocrine rather
    than a genetics clinic: proportionate or mildly disproportionate short
    stature with a normal endocrine workup, often an advanced bone age, and early
    growth cessation. Its "with or without" clause carries familial
    osteochondritis dissecans, which was described separately in a Swedish
    five-generation family and is now placed under the same OMIM entity; Sillat
    et al. label their families "fOCD/SSOAOD" for exactly that reason.
  genes:
  - preferred_term: ACAN

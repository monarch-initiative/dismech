    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Meanwhile, only 24.24% of aggrecan-deficient Chinese children showed
      significantly advanced bone age (BA).
    explanation: >-
      An independent cohort in a different population reaching the same conclusion
      by a wider margin, which is why the caveat is recorded as a property of the
      disease rather than of one series.
  - reference: PMID:29464738

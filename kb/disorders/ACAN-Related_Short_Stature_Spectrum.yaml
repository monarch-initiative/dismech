genetic:
- name: ACAN
  gene_term:
    preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Pathogenic ACAN variants include truncating, splice-site and missense alleles across
    the gene. Studied G3 missense variants can affect secretion and ligand interactions,
    but this does not establish a single mechanism for all missense variants. The
    biallelic SEMD aggrecan-type disorder is curated separately and is not equated with
    lethal aggrecan-null animal models. Domain location alone does not establish
    inheritance mode, severity or pathogenicity.
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified ACAN variants showed perfect cosegregation with phenotype.
    explanation: >-
      The segregation evidence across 20 families, which is what establishes
      causation rather than association for this gene.
  - reference: PMID:29464738
    reference_title: >-
      Heterozygous aggrecan variants are associated with short stature and
      brachydactyly: Description of 16 probands and a review of the literature.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the aggrecan gene (ACAN) have been identified in two autosomal
      dominant skeletal dysplasias, spondyloepiphyseal dysplasia, Kimberley type
      (SEDK), and osteochondritis dissecans, as well as in a severe recessive
      dysplasia, spondyloepimetaphyseal dysplasia, aggrecan type.
    explanation: >-
      Enumerates the allelic series and its two inheritance modes, which is the
      basis for this entry's scope statement.
  - reference: PMID:33471655
    reference_title: >-
      Growth-Promoting Therapies May Be Useful In Short Stature Patients With
      Nonspecific Skeletal Abnormalities Caused By Acan Heterozygous Mutations:
      Six Chinese Cases And Literature Review.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately half of these mutations can lead to protein truncation.
    explanation: >-
      Quantifies the truncating class, which is the basis for the two-class
      description above.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:35338222
    reference_title: >-
      Novel missense ACAN gene variants linked to familial osteochondritis
      dissecans cluster in the C-terminal globular domain of aggrecan.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We previously reported a missense ACAN variant linked to familial
      osteochondritis dissecans, with short stature and early onset osteoarthritis,
      and now describe three novel ACAN gene variants from additional families with
      this disorder.
    explanation: >-
      Establishes that the osteochondritis-dissecans presentation is not a single
      private allele, which is what makes the G3 clustering a finding rather than
      a coincidence.
inheritance:
- name: Autosomal dominant
  description: >-
    Autosomal dominant transmission is supported by cosegregation in multiple kindreds.
    Growth and joint manifestations vary with age and between carriers. Cosegregation in
    ascertained families does not establish complete penetrance across all pathogenic
    variants.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Identified ACAN variants showed perfect cosegregation with phenotype.
    explanation: >-
      The segregation result underpinning the dominant assignment.
  - reference: PMID:27870580
    reference_title: >-
      Clinical Characterization of Patients With Autosomal Dominant Short Stature
      due to Aggrecan Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No apparent genotype-phenotype correlation was found between the type of
      ACAN mutation and the presence of joint complaints.
    explanation: >-
      Supports describing penetrance per-feature: the joint arm varies
      independently of the allele class.

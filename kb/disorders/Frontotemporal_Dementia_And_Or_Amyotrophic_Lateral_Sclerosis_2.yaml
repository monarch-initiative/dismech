inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    A single heterozygous CHCHD10 pathogenic variant establishes the diagnosis.
    Most probands have an affected parent, and each child of an affected
    individual has a 50% recurrence risk. Intrafamilial clinical heterogeneity is
    marked enough that neither age at onset nor which arm of the spectrum will
    manifest can be predicted from the genotype within a family.
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHCHD10-related disorders are inherited in an autosomal dominant manner. Many individuals diagnosed with a CHCHD10-related disorder have an affected parent."
    explanation: GeneReviews states the mode of inheritance and the typical familial pattern.
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because significant clinical heterogeneity is observed within families, it is impossible to accurately predict the age at onset and manifestations that will develop in individuals who inherit a CHCHD10 pathogenic variant."
    explanation: Supports the statement that intrafamilial variability defeats genotype-based prediction.
pathophysiology:
- name: CHCHD10 Missense Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous missense variant in CHCHD10 (22q11.23), encoding a
    coiled-coil-helix-coiled-coil-helix domain protein of the mitochondrial
    intermembrane space that is enriched at cristae junctions. p.Ser59Leu is the
    allele of the founding French and Spanish FTD-ALS families; p.Gly66Val is a
    Finnish founder allele causing the lower-motor-neuron-restricted SMAJ/LOSMoN
    phenotype. The variants act dominantly.
  genes:
  - preferred_term: CHCHD10
    term:
      id: hgnc:15559
      label: CHCHD10
  genetic_context:
    gene:
      preferred_term: CHCHD10
      term:
        id: hgnc:15559
        label: CHCHD10
    zygosity: HETEROZYGOUS
    allele_type: MISSENSE
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Monoallelic missense change. The functional impact is assigned
      GAIN_OF_FUNCTION on the strength of the knock-in mouse comparison, in which
      CHCHD10 ablation produces neither pathology nor a stress response while the
      point mutant does.
  downstream:
  - target: Mutant CHCHD10 and CHCHD2 Co-Aggregation
    causal_link_type: DIRECT
    description: >-
      The mutant protein becomes insoluble and sequesters its paralog, and does so
      only in the tissues that go on to develop pathology.
    evidence:
    - reference: PMID:30877432
      reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHCHD10 accumulates in aggregates with its paralog CHCHD2 specifically in affected tissues of CHCHD10S55L mice, leading to aberrant organelle morphology and function."
      explanation: States that the mutation itself produces the co-aggregate, and that aggregation tracks the affected tissues.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing we identified a missense mutation (c.176C>T; p.Ser59Leu) in the CHCHD10 gene that encodes a coiled-coil helix coiled-coil helix protein, whose function is unknown."
    explanation: Identifies the founding p.Ser59Leu allele and the protein family it belongs to.
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that CHCHD10 is a mitochondrial protein located in the intermembrane space and enriched at cristae junctions."
    explanation: Establishes the subcellular localization that the rest of the mechanism depends on.
  - reference: PMID:25428574
    reference_title: Late onset spinal motor neuronopathy is caused by mutation in CHCHD10.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In whole genome sequencing a previously unknown mutation c.197G>T p.G66V in CHCHD10 was identified. The mutation was shown to segregate with the disease in 55 patients from 17 families."
    explanation: Establishes the second major allele of the series with segregation across 17 families.

- name: Mutant CHCHD10 and CHCHD2 Co-Aggregation
  biological_scale: MOLECULAR
  description: >-
    Mutant CHCHD10 becomes insoluble within the intermembrane space and
    co-aggregates with CHCHD2. It is a toxic gain of function rather than a loss of
    the normal protein, and the insoluble
    fraction extends well beyond CHCHD10 itself to other intermembrane-space
    proteins including those required for cytochrome c biogenesis.
  molecular_functions:
  - preferred_term: protein aggregation in the mitochondrial intermembrane space
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: MICOS Disassembly and Loss of Cristae Junctions
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26666268
      reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CHCHD10 mutations lead to MICOS complex disassembly and loss of mitochondrial cristae with a decrease in nucleoid number and nucleoid disorganization."
      explanation: States that the mutation causes MICOS disassembly and cristae loss.
  - target: Maladaptive Mitochondrial Integrated Stress Response
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30877432
      reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Aggregates induce a potent mitochondrial integrated stress response (mtISR) through mTORC1 activation, with elevation of stress-induced transcription factors, secretion of myokines, upregulated serine and one-carbon metabolism, and downregulation of respiratory chain enzymes."
      explanation: Names the aggregate as the cause of the stress response, which is the edge being claimed.
  - target: OMA1 Activation and L-OPA1 Cleavage
    causal_link_type: DIRECT
    description: >-
      The stress-activated peptidase OMA1 is switched on in affected tissues of the
      knock-in mouse, which is what connects the aggregate to the cristae lesion
      through a defined proteolytic step rather than by assertion.
    evidence:
    - reference: PMID:32338760
      reference_title: Loss of CHCHD2 and CHCHD10 activates OMA1 peptidase to disrupt mitochondrial cristae phenocopying patient mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "OMA1 was found to be activated similarly in affected tissues of mutant C10 knock-in (KI) mice, demonstrating that L-OPA1 cleavage is a novel mechanism for cristae abnormalities because of both C10 mutation and C2/C10 loss."
      explanation: Places OMA1 activation downstream of the mutation in the tissues that develop disease.
  - target: Intermembrane-Space Proteostasis Failure and Impaired Cytochrome c Oxidation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41420107
      reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Proteomic profiling of insoluble mitochondrial proteins in Chchd10S55L/+ mice reveals widespread disruptions of mitochondrial proteostasis, including IMS proteins involved in cytochrome c biogenesis."
      explanation: Connects the insoluble mutant protein to a broader intermembrane-space proteostasis defect.
  evidence:
  - reference: PMID:30877432
    reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Conversely, CHCHD10 ablation does not induce disease pathology or activate the mtISR, indicating that CHCHD10S55L-dependent disease pathology is not caused by loss-of-function."
    explanation: The negative control that establishes gain-of-function rather than haploinsufficiency as the mechanism.

- name: OMA1 Activation and L-OPA1 Cleavage
  biological_scale: MOLECULAR
  description: >-
    The stress-induced inner-membrane peptidase OMA1 is activated and cleaves the
    long form of OPA1, the protein that shapes cristae. This supplies the missing
    proteolytic step between the CHCHD10 aggregate and the cristae lesion, and it
    is shared with the CHCHD2/CHCHD10 double knockout, which phenocopies the point
    mutant down to the cardiomyopathy and the stress response. Note that the same
    peptidase carries the maladaptive stress signal through DELE1 and HRI, so OMA1
    sits at the branch point of both arms of this mechanism.
  molecular_functions:
  - preferred_term: OMA1 metallopeptidase activity
    modifier: INCREASED
  downstream:
  - target: MICOS Disassembly and Loss of Cristae Junctions
    causal_link_type: DIRECT
    description: >-
      L-OPA1 cleavage is identified as the mechanism of the cristae abnormality
      rather than a correlate of it.
    evidence:
    - reference: PMID:32338760
      reference_title: Loss of CHCHD2 and CHCHD10 activates OMA1 peptidase to disrupt mitochondrial cristae phenocopying patient mutations.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we report that C10 pathogenesis and the normal function of C2/C10 are intimately linked. Similar to patients with C10 mutations, we found that C2/C10 DKO mice have disrupted mitochondrial cristae, because of cleavage of the mitochondrial-shaping protein long form of OPA1 (L-OPA1) by the stress-induced peptidase OMA1."
      explanation: States the causal route from OMA1 through L-OPA1 to disrupted cristae.
  evidence:
  - reference: PMID:32338760
    reference_title: Loss of CHCHD2 and CHCHD10 activates OMA1 peptidase to disrupt mitochondrial cristae phenocopying patient mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, C2/C10 DKO mice partially phenocopied mutant C10 KI mice with the development of cardiomyopathy and activation of the integrated mitochondrial integrated stress response in affected tissues, tying mutant C10 pathogenesis to C2/C10 function."
    explanation: >-
      Establishes that losing both paralogs reproduces the point mutant's disease,
      which is what licenses reading the OMA1 step as part of the FTDALS2
      mechanism rather than a separate knockout phenotype.

- name: MICOS Disassembly and Loss of Cristae Junctions
  biological_scale: CELLULAR
  description: >-
    CHCHD10 sits in the mitochondrial contact site and cristae organizing system
    (MICOS) alongside mitofilin, CHCHD3 and CHCHD6. Mutant protein disassembles
    the complex, cristae junctions are lost and the inner-membrane architecture
    dilates and disorganizes, with nucleoids reduced in number and disorganized.
  biological_processes:
  - preferred_term: cristae formation
    modifier: DECREASED
    term:
      id: GO:0042407
      label: cristae formation
  - preferred_term: mitochondrion organization
    modifier: DECREASED
    term:
      id: GO:0007005
      label: mitochondrion organization
  downstream:
  - target: Mitochondrial DNA Instability with Multiple Deletions
    causal_link_type: DIRECT
    description: >-
      Nucleoid disorganization accompanying cristae-junction loss is the proposed
      route from disrupted membrane architecture to a failure of genome
      maintenance.
    evidence:
    - reference: PMID:26666268
      reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Repair of the mitochondrial genome after oxidative stress is impaired in CHCHD10 mutant fibroblasts and this likely explains the accumulation of deleted mtDNA molecules in patient muscle."
      explanation: Links the cristae/nucleoid defect to impaired genome repair and to the deletions seen in patients.
  - target: Impaired Mitochondrial Axonal Transport
    causal_link_type: DIRECT
    description: >-
      The MICOS lesion and mitochondrial trafficking are coupled, which is the
      connection the nifuroxazide screen was built on and the reason a
      MICOS-directed compound acts on transport.
    evidence:
    - reference: PMID:39478664
      reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Our findings strengthen the MICOS-mitochondrial transport connection."
      explanation: >-
        States the MICOS-to-transport link. INDIRECT because the connection is
        inferred from a pharmacological rescue rather than from measuring transport
        against MICOS state directly.
  - target: Blocked Cytochrome c Release and Impaired Apoptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26666268
      reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Interestingly, the expression of CHCHD10 mutant alleles inhibits apoptosis by preventing cytochrome c release."
      explanation: States the apoptotic consequence of the mutant allele.
  evidence:
  - reference: PMID:26666268
    reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that CHCHD10 resides with mitofilin, CHCHD3 and CHCHD6 within the \"mitochondrial contact site and cristae organizing system\" (MICOS) complex."
    explanation: Establishes CHCHD10 membership of MICOS, which is what makes the disassembly claim mechanistic.
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of a CHCHD10 mutant allele in HeLa cells led to fragmentation of the mitochondrial network and ultrastructural major abnormalities including loss, disorganization and dilatation of cristae."
    explanation: Independent demonstration of the cristae lesion, in a heterologous overexpression system.
  - reference: PMID:30092269
    reference_title: "Loss of MICOS complex integrity and mitochondrial damage, but not TDP-43 mitochondrial localisation, are likely associated with severity of CHCHD10-related diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also show that G66V fibroblasts do not display the loss of MICOS complex integrity and mitochondrial damage found in S59L cells."
    explanation: >-
      The allele comparison that makes this node the severity determinant of the
      CHCHD10 series: the severe FTD-ALS allele disassembles MICOS and the mild
      SMAJ allele does not.
  - reference: PMID:30092269
    reference_title: "Loss of MICOS complex integrity and mitochondrial damage, but not TDP-43 mitochondrial localisation, are likely associated with severity of CHCHD10-related diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "However, S59L and G66V fibroblasts show comparable accumulation of phosphorylated mitochondrial TDP-43 suggesting that the severity of phenotype and mitochondrial damage do not depend on mitochondrial TDP-43 localization."
    explanation: >-
      Supports this node being the severity determinant by eliminating the
      competing candidate: the severe and mild alleles accumulate mitochondrial
      phospho-TDP-43 equally, so TDP-43 localization cannot be what separates them.
      INDIRECT because it argues by exclusion rather than measuring MICOS.

- name: Mitochondrial DNA Instability with Multiple Deletions
  biological_scale: MOLECULAR
  description: >-
    Repair of the mitochondrial genome after oxidative stress fails, and multiple
    mitochondrial DNA deletions accumulate in post-mitotic tissue, most
    conspicuously skeletal muscle. This places FTDALS2 formally within the
    mitochondrial DNA instability disorders — the feature that separates it from
    every proteostasis-driven form of ALS or FTD.
  biological_processes:
  - preferred_term: mitochondrial DNA repair
    modifier: DECREASED
    term:
      id: GO:0043504
      label: mitochondrial DNA repair
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    description: >-
      Deleted mtDNA molecules remove subunits of several complexes at once, which
      is why the biochemical deficit in patient muscle is combined rather than
      isolated.
  - target: Multiple Mitochondrial DNA Deletions
    causal_link_type: DIRECT
    description: >-
      The laboratory finding this node is defined by, wired as an edge so the
      single result the separate-entry argument rests on is reachable from the
      mechanism graph.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The multiple mitochondrial DNA deletions found in skeletal muscle revealed a mitochondrial DNA instability disorder."
    explanation: Direct patient-tissue evidence for mtDNA instability in this disease.

- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  description: >-
    Oxidative phosphorylation fails, with combined respiratory-chain deficiency
    and abnormal assembly of complex V in patient muscle and respiratory-chain
    deficiency in patient fibroblasts. In the knock-in mouse the muscle OXPHOS
    defect is present at three months of age, before any spinal motor neuron has
    been lost.
  biological_processes:
  - preferred_term: mitochondrial ATP synthesis coupled electron transport
    modifier: DECREASED
    term:
      id: GO:0042775
      label: mitochondrial ATP synthesis coupled electron transport
  cell_types:
  - preferred_term: skeletal myofibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Mitochondrial Myopathy with Ragged-Red and COX-Negative Fibres
    causal_link_type: DIRECT
  - target: Neuromuscular Junction Degeneration
    causal_link_type: DIRECT
    hypothesis_groups:
    - muscle_first_motor_neuron_disease
    description: >-
      The knock-in mouse establishes the temporal ordering that makes this edge a
      causal claim rather than a co-occurrence: the muscle bioenergetic lesion
      precedes end-plate fragmentation.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, we found OXPHOS deficiency in muscle of CHCHD10S59L/+ mice at 3 months of age in the absence of neuron loss in spinal cord."
      explanation: Establishes that the OXPHOS defect is present before neuronal loss, which is what orders this edge.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, muscle biopsy showed ragged-red and cytochrome c oxidase-negative fibres with combined respiratory chain deficiency and abnormal assembly of complex V."
    explanation: Combined respiratory-chain deficiency documented in every affected member of the founding family.

- name: Intermembrane-Space Proteostasis Failure and Impaired Cytochrome c Oxidation
  biological_scale: MOLECULAR
  description: >-
    A second, bioenergetic arm distinct from the stress-signalling arm. Insoluble
    mutant CHCHD10 disrupts intermembrane-space proteostasis broadly, including
    proteins of cytochrome c biogenesis, and impairs mitochondrial copper
    homeostasis and cytochrome c oxidation. That the respiratory defect in mutant
    mitochondria is corrected by simply adding cytochrome c is what identifies
    intermembrane-space proteostasis as a proximate lesion rather than a downstream
    consequence. The rescue was done in cardiac mitochondria, whereas the
    respiratory-chain deficiency this node feeds is documented in patient skeletal
    muscle and fibroblasts, so the arm is well evidenced in heart and carried into
    muscle by mechanism rather than by direct measurement.
  downstream:
  - target: Combined Respiratory Chain Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41420107
      reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Defective respiration in mutant mitochondria is rescued by the addition of cytochrome c, pinpointing IMS proteostasis disruption as a key pathogenic mechanism."
      explanation: A rescue experiment establishing the direction of this edge.
  evidence:
  - reference: PMID:41420107
    reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "bioenergetic failure linked to impaired mitochondrial copper homeostasis and cytochrome c oxidation"
    explanation: Names the bioenergetic arm of the dual defect described in this model.

- name: Maladaptive Mitochondrial Integrated Stress Response
  biological_scale: CELLULAR
  description: >-
    Aggregated CHCHD10 triggers a mitochondrial integrated stress response
    signalled through the OMA1-DELE1-HRI axis and mTORC1, with stress-induced
    transcription factors, myokine secretion, upregulated serine and one-carbon
    metabolism, and downregulated respiratory-chain enzymes. The response is
    maladaptive rather than protective: genetically blunting it delays
    cardiomyopathy onset. It also does not act upstream of the structural lesion,
    since blunting it leaves CHCHD10 insolubility, the cristae defect and the
    OXPHOS impairment untouched.
  biological_processes:
  - preferred_term: integrated stress response signaling
    modifier: INCREASED
    term:
      id: GO:0140467
      label: integrated stress response signaling
  downstream:
  - target: Mitochondrial Cardiomyopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:41420107
      reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using protease-inactive Oma1E324Q/E324Q knock-in mice, we show that blunting mtISR in Chchd10S55L/+ mice delays cardiomyopathy onset without rescuing CHCHD10 insolubility, cristae defects or OXPHOS impairment."
      explanation: A genetic epistasis experiment placing the stress response causally upstream of the cardiomyopathy and downstream of the structural lesion.
  - target: Frontotemporal Cortical and Hippocampal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - mitochondrial_origin_of_ftd_als
    description: >-
      Integrated stress response activation is documented in the hippocampus of
      the knock-in mouse alongside aggregates and neuroinflammation, but the steps
      between that activation and neuronal loss are not established.
    evidence:
    - reference: PMID:38583639
      reference_title: "CHCHD10(S59L/+) mouse model: Behavioral and neuropathological features of frontotemporal dementia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the hippocampus of Chchd10S59L/+ mice, neuropathological studies show the involvement of protein aggregates, activation of the integrated stress response (ISR) and neuroinflammation in the degenerative process."
      explanation: Places integrated stress response activation inside the cognitive-arm degeneration, while stopping short of naming intermediates.
  evidence:
  - reference: PMID:30877432
    reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, CHCHD10S55L mice recapitulate crucial aspects of human disease and reveal a novel toxic gain-of-function mechanism through maladaptive mtISR and metabolic dysregulation."
    explanation: States the maladaptive character of the response and its centrality to the mechanism.
  - reference: PMID:41420107
    reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "maladaptive mtISR signaling via the OMA1-DELE1-HRI axis"
    explanation: Names the signalling axis carrying the response.

- name: Blocked Cytochrome c Release and Impaired Apoptosis
  biological_scale: CELLULAR
  description: >-
    Cristae-junction loss traps cytochrome c, and mutant alleles inhibit apoptosis
    by preventing its release. This runs counter to the usual expectation that
    neurodegeneration follows excess apoptosis, and it sits alongside the
    observation that patient iPSC-derived motor neurons are nonetheless
    hypersensitive to caspase activation by an applied stressor.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:26666268
    reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, the expression of CHCHD10 mutant alleles inhibits apoptosis by preventing cytochrome c release."
    explanation: Direct statement of the apoptotic block.
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We also showed that motor neurons differentiated from human iPSC carrying the p.Ser59Leu mutation were much more sensitive to Staurosporine or glutamate-induced caspase activation than control cells."
    explanation: >-
      Cuts against a blanket claim that the mutation suppresses apoptosis: in
      patient-derived motor neurons under stress, caspase activation is increased
      rather than blocked. Recorded as a REFUTE item rather than reconciled in
      prose because the two results are from different cell types and stimuli and
      the discrepancy is unresolved.
  - reference: PMID:30092269
    reference_title: "Loss of MICOS complex integrity and mitochondrial damage, but not TDP-43 mitochondrial localisation, are likely associated with severity of CHCHD10-related diseases."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression of the CHCHD10G66V allele is responsible for mitochondrial network fragmentation and decreased sensitivity towards apoptotic stimuli, but with a less severe effect than that found in cells expressing the CHCHD10S59L allele."
    explanation: >-
      Independent replication of the apoptotic block in a second allele, and a
      dose relationship: the milder allele produces the milder block. This makes
      the fibroblast result harder to dismiss as an artefact and sharpens the
      conflict with the iPSC motor neuron result recorded above.

- name: Mitochondrial Myopathy with Ragged-Red and COX-Negative Fibres
  biological_scale: TISSUE
  description: >-
    The muscle lesion of a classical mitochondrial myopathy: ragged-red fibres,
    cytochrome c oxidase-negative fibres, combined respiratory-chain deficiency
    and abnormal complex V assembly. In the knock-in mouse this is the earliest
    tissue to be hit, and it is the finding that would not be expected in ALS or
    FTD from any other cause.
  cell_types:
  - preferred_term: skeletal myofibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Neuromuscular Junction Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - muscle_first_motor_neuron_disease
    description: >-
      The mouse data argue for a muscle-first sequence in which the myopathic
      compartment carries the lesion that later disrupts the end plate.
  - target: Exercise Intolerance
    causal_link_type: DIRECT
  - target: Proximal Muscle Weakness
    causal_link_type: DIRECT
  - target: Mitochondrial Myopathy
    causal_link_type: DIRECT
    description: The clinical myopathy this tissue lesion presents as.
  - target: Ragged-Red Muscle Fibres
    causal_link_type: DIRECT
    description: >-
      The histochemical readout of the same lesion, drawn as an edge so the biopsy
      finding is reachable from the mechanism rather than free-floating.
  - target: Cytochrome c Oxidase-Negative Muscle Fibres
    causal_link_type: DIRECT
  - target: Skeletal Muscle Atrophy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, muscle biopsy showed ragged-red and cytochrome c oxidase-negative fibres with combined respiratory chain deficiency and abnormal assembly of complex V."
    explanation: Documents the histochemical and biochemical myopathy in patient muscle.
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we generated knock-in (KI) mice, carrying the p.Ser59Leu mutation, that mimic the mitochondrial myopathy with mtDNA instability displayed by the patients from our original family."
    explanation: The mouse reproduces the human myopathy, which is what licenses using it for the ordering claim.

- name: Impaired Mitochondrial Axonal Transport
  biological_scale: CELLULAR
  description: >-
    Delivery of mitochondria along the motor axon to the distal compartment fails.
    The evidence is pharmacological and therefore indirect: a MICOS-directed
    compound increases axonal mitochondrial movement and degrades syntaphilin (the
    protein that anchors mitochondria and holds them stationary) in patient-derived
    motor neurons, which implies the untreated state is under-transported. This
    node matters disproportionately for a disease whose lesion is distal: the
    neuromuscular junction is the furthest point from the soma and the most
    dependent on trafficked mitochondria.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Neuromuscular Junction Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A plausible route from the transport deficit to end-plate failure, drawn as
      indirect because no experiment reported here measures end-plate integrity as
      a function of transport.
  evidence:
  - reference: PMID:39478664
    reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Its benefits involve KIF5B-mediated mitochondrial transport enhancement, evidenced by increased axonal movement and syntaphilin degradation in patient-derived motor neurons."
    explanation: >-
      Names the motor (KIF5B) and the anchoring protein (syntaphilin) and reports
      that both move in the direction of restored transport under treatment.
      INDIRECT: the measurement is of a rescue, so the untreated deficit is
      inferred rather than measured.

- name: Neuromuscular Junction Degeneration
  biological_scale: TISSUE
  description: >-
    CHCHD10 is highly expressed in the post-synaptic compartment of the
    neuromuscular junction, and the motor end plate becomes hyper-fragmented.
    Abnormal CHCHD10 expression is detectable near junctions that are still
    morphologically intact, so the molecular lesion at the end plate precedes its
    structural breakdown.
  cell_types:
  - preferred_term: skeletal myofibre
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Motor Neuron Degeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - muscle_first_motor_neuron_disease
    - mitochondrial_origin_of_ftd_als
    description: >-
      Denervation follows end-plate failure in the mouse sequence, with spinal
      motor neuron loss appearing only at end stage.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHCHD10S59L/+ mice also displayed neuromuscular junction (NMJ) and motor neuron degeneration with hyper-fragmentation of the motor end plate and moderate but significant motor neuron loss in lumbar spinal cord at the end stage of the disease."
      explanation: Reports both lesions and places motor neuron loss at end stage, after end-plate fragmentation.
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CHCHD10 is highly expressed in the NMJ post-synaptic part. Importantly, the fragmentation of the motor end plate was associated with abnormal CHCHD10 expression that was also observed closed to NMJs which were morphologically normal."
    explanation: Localizes the protein to the end plate and shows the molecular abnormality preceding structural damage.

- name: Motor Neuron Degeneration
  biological_scale: TISSUE
  description: >-
    Loss of upper and lower motor neurons producing the ALS arm of the phenotype.
    In the mouse this is moderate and late relative to the muscle lesion, which is
    the model's central and most contested claim about human disease: that
    CHCHD10-related motor neuron disease may be driven from muscle rather than
    originating in the motor neuron.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: TDP-43 Cytoplasmic Aggregation in Spinal Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the knock-in mouse the aggregates appear at the same end-stage time point
      as neuronal loss, so that experiment alone cannot order the two. The
      direction is instead taken from work in which the mutant alleles are shown
      to act dominant-negatively on CHCHD10's normal role in retaining TDP-43 in
      the nucleus, which places mitochondrial dysfunction upstream. The
      intermediates between the two are not established.
    evidence:
    - reference: PMID:28585542
      reference_title: Loss of function CHCHD10 mutations in cytoplasmic TDP-43 accumulation and synaptic integrity.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "FTD/ALS-associated mutations (R15L and S59L) exhibit loss of function phenotypes in C. elegans genetic complementation assays"
      explanation: >-
        The in vivo arm of this paper: the disease alleles fail to provide CHCHD10
        function in a whole-organism complementation assay.
    - reference: PMID:28585542
      reference_title: Loss of function CHCHD10 mutations in cytoplasmic TDP-43 accumulation and synaptic integrity.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "CHCHD10 normally exerts a protective role in mitochondrial and synaptic integrity as well as in the retention of nuclear TDP-43"
      explanation: >-
        Supplies the direction of this edge: keeping TDP-43 nuclear is part of
        CHCHD10's normal job, so losing that function releases TDP-43 to the
        cytoplasm. Split from the C. elegans item above because the paper's two
        clauses report different study types.
  - target: Amyotrophic Lateral Sclerosis Phenotype
    causal_link_type: DIRECT
  - target: Bulbar Palsy
    causal_link_type: DIRECT
  - target: Areflexia
    causal_link_type: DIRECT
    description: >-
      Loss of the lower motor neuron limb of the reflex arc. Noted in the founding
      family alongside an extensor plantar response, so lower and upper motor
      neuron signs coexist.
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "They likely lead to OXPHOS deficiency, loss of cristae junctions and destabilization of internal membrane structure within mitochondria at motor end plate of NMJ, impairing neurotransmission."
    explanation: The authors' own statement of the route from the mitochondrial lesion to failure of the motor unit.
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a large family with a late-onset phenotype including motor neuron disease, cognitive decline resembling frontotemporal dementia, cerebellar ataxia and myopathy."
    explanation: Establishes motor neuron disease as a core human manifestation of the founding pedigree.

- name: TDP-43 Cytoplasmic Aggregation in Spinal Neurons
  biological_scale: CELLULAR
  description: >-
    Cytoplasmic TDP-43 aggregates are present in spinal neurons at end stage in
    the knock-in mouse. This is the one point of contact with the canonical
    proteostatic model of ALS, and it is a late one — worth recording precisely
    because it shows the mitochondrial and proteostatic accounts converging
    downstream rather than the mitochondrial lesion being a variant of the
    proteostatic one.
  cell_types:
  - preferred_term: spinal cord motor neuron
    term:
      id: CL:0011001
      label: spinal cord motor neuron
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At this stage, we observed TDP-43 cytoplasmic aggregates in spinal neurons."
    explanation: Reports the finding and, in the phrase "at this stage", its end-stage timing.
  - reference: PMID:35787294
    reference_title: "Modulation of synaptic plasticity, motor unit physiology, and TDP-43 pathology by CHCHD10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "insoluble CHCHD10 aggregates accumulate and colocalize with phospho-TDP-43 inclusions in brains of FTLD-TDP and AD patients, and that insoluble CHCHD10 levels tightly correlate with insoluble TDP-43 levels in control and FTLD-TDP brains"
    explanation: >-
      Human post-mortem evidence that the two aggregate species co-localize and
      co-vary. INDIRECT because the brains studied are FTLD-TDP and Alzheimer
      cases, not CHCHD10 carriers: it shows wild-type CHCHD10 joining TDP-43
      inclusions in unrelated dementias, so it supports a CHCHD10-TDP-43 axis in
      human brain generally rather than documenting this disease.

- name: Frontotemporal Cortical and Hippocampal Degeneration
  biological_scale: TISSUE
  description: >-
    The cognitive arm. In patients this is a frontal lobe syndrome with executive,
    attentional and behavioural impairment; in the knock-in mouse it is impaired
    learning and memory with reduced long-term potentiation at
    perforant-pathway/dentate-gyrus synapses, accompanied by aggregates,
    integrated stress response activation and neuroinflammation.
  cell_types:
  - preferred_term: pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron
  downstream:
  - target: Frontotemporal Dementia Phenotype
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:38583639
    reference_title: "CHCHD10(S59L/+) mouse model: Behavioral and neuropathological features of frontotemporal dementia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These animals show impaired learning and memory capacities with reduced long-term potentiation (LTP) measured at the Perforant Pathway-Dentate Gyrus (PP-DG) synapses."
    explanation: Provides the functional correlate of the cognitive arm in the model.

- name: Mitochondrial Cardiomyopathy
  biological_scale: TISSUE
  description: >-
    Cardiac involvement is part of the CHCHD10 phenotype in the mouse, where it is
    fatal before 14 months and associated with enhanced mitophagy. It is
    prominent in the model and much less so in reported patients, which is a
    genuine model-to-human divergence rather than an established feature of
    FTDALS2.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Before 14 months of age, all KI mice developed a fatal mitochondrial cardiomyopathy associated with enhanced mitophagy."
    explanation: Reports the cardiac phenotype and its penetrance in the model.
  - reference: PMID:38724625
    reference_title: High fat diet ameliorates mitochondrial cardiomyopathy in CHCHD10 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutant hearts, mtISR is accompanied by a metabolic rewiring characterized by increased reliance on glycolysis rather than fatty acid oxidation."
    explanation: >-
      Identifies the substrate switch that follows the stress response in this
      tissue, which is the step that makes the cardiomyopathy metabolically
      addressable rather than simply a consequence of failed bioenergetics.
  - reference: PMID:38724625
    reference_title: High fat diet ameliorates mitochondrial cardiomyopathy in CHCHD10 mutant mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HFD also decreased accumulation of aggregated CHCHD10 in the S55L heart, suggesting activation of quality control mechanisms."
    explanation: >-
      Notable because it runs back up the chain: a dietary intervention reduces the
      aggregate that initiates the whole mechanism, which argues the aggregate load
      is not fixed by the genotype alone.
phenotypes:
- category: Neurologic
  name: Frontotemporal Dementia Phenotype
  description: >-
    Slowly progressive behavioural change, language disturbance and cognitive
    decline with extrapyramidal signs. In the founding family this presented as a
    frontal lobe syndrome with impairment of episodic memory, attention, verbal
    fluency and executive function.
  phenotype_term:
    preferred_term: Frontotemporal dementia
    term:
      id: HP:0002145
      label: Frontotemporal dementia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Frontotemporal dementia (FTD): slowly progressive behavioral changes, language disturbances, cognitive decline, extrapyramidal signs."
    explanation: GeneReviews describes the FTD arm of the spectrum.

- category: Neurologic
  name: Amyotrophic Lateral Sclerosis Phenotype
  description: >-
    Progressive degeneration of upper and lower motor neurons. In the French
    FTD-ALS cohort, CHCHD10 carriers were characterized by early and predominant
    bulbar symptoms, which is the clinical clue that should prompt CHCHD10
    testing.
  phenotype_term:
    preferred_term: Amyotrophic lateral sclerosis
    term:
      id: HP:0007354
      label: Amyotrophic lateral sclerosis
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amyotrophic lateral sclerosis (ALS): progressive degeneration of upper motor neurons and lower motor neurons."
    explanation: GeneReviews describes the ALS arm of the spectrum.
  - reference: PMID:25155093
    reference_title: "Screening of CHCHD10 in a French cohort confirms the involvement of this gene in frontotemporal dementia with amyotrophic lateral sclerosis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 2 heterozygous variants in 3 unrelated probands presenting FTD and ALS, characterized by early and predominant bulbar symptoms."
    explanation: Establishes the bulbar-predominant presentation in an independent cohort.

- category: Neurologic
  name: Bulbar Palsy
  description: >-
    Progressive bulbar syndrome with dysarthria and dysphagia, which in the French
    cohort was early and predominant at onset.
  phenotype_term:
    preferred_term: Bulbar palsy
    term:
      id: HP:0001283
      label: Bulbar palsy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical examination showed cerebellar ataxia, Babinski sign, areflexia and bulbar palsy with dysarthria and dysphagia."
    explanation: Documents bulbar palsy with its two components in the index case.
  sequelae:
  - target: Dysarthria
  - target: Dysphagia

- category: Neurologic
  name: Dysarthria
  description: Speech impairment from bulbar involvement.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented dementia, progressive bulbar syndrome with dysarthria and dysphagia, and became bedridden."
    explanation: Documents dysarthria across affected family members without muscle biopsy.

- category: Gastrointestinal
  name: Dysphagia
  description: >-
    Swallowing impairment from bulbar involvement, and one of the functions that
    drugs used for the behavioural manifestations of FTD may worsen.
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They presented dementia, progressive bulbar syndrome with dysarthria and dysphagia, and became bedridden."
    explanation: Documents dysphagia across affected family members without muscle biopsy.

- category: Neurologic
  name: Cerebellar Ataxia
  description: >-
    Gait and kinetic ataxia with dysarthria, dysphagia, nystagmus and cerebellar
    oculomotor disturbance. In the founding family the index case's presenting
    symptom at age 50 was cerebellar ataxia, and two further relatives presented
    with ataxia alone.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebellar ataxia: gait ataxia, kinetic ataxia (progressive loss of coordination of lower- and upper-limb movements), dysarthria/dysphagia, nystagmus, cerebellar oculomotor disorder."
    explanation: GeneReviews describes the ataxic arm of the spectrum.

- category: Musculoskeletal
  name: Mitochondrial Myopathy
  description: >-
    Weakness, amyotrophy and exercise intolerance on a mitochondrial basis. This
    may be early onset, unlike the other manifestations, and is the feature that
    marks the disorder as a primary mitochondrial disease.
  phenotype_term:
    preferred_term: Mitochondrial myopathy
    term:
      id: HP:0003737
      label: Mitochondrial myopathy
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial myopathy (may also be early onset): weakness, amyotrophy, exercise intolerance."
    explanation: GeneReviews names the myopathic arm and its early-onset possibility.

- category: Musculoskeletal
  name: Proximal Muscle Weakness
  description: >-
    Proximal weakness was observed in four of the biopsied members of the founding
    family, with bilateral ptosis and facial paresis in one.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Proximal weakness was observed in four individuals (Patients IV-3, IV-11, IV-13 and IV-15) with bilateral ptosis and facial paresis in Patient IV-15."
    explanation: Documents proximal weakness with counts in the founding pedigree.

- category: Musculoskeletal
  name: Exercise Intolerance
  description: Reduced exercise tolerance as part of the mitochondrial myopathy.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial myopathy (may also be early onset): weakness, amyotrophy, exercise intolerance."
    explanation: GeneReviews lists exercise intolerance among the myopathic features.

- category: Musculoskeletal
  name: Skeletal Muscle Atrophy
  description: >-
    Amyotrophy as a component of the mitochondrial myopathy, which is the arm of
    the CHCHD10 spectrum that FTDALS2 itself carries.
  phenotype_term:
    preferred_term: Skeletal muscle atrophy
    term:
      id: HP:0003202
      label: Skeletal muscle atrophy
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial myopathy (may also be early onset): weakness, amyotrophy, exercise intolerance."
    explanation: >-
      GeneReviews lists amyotrophy among the features of the mitochondrial
      myopathy. Quoted from the myopathy sentence rather than the
      Charcot-Marie-Tooth one so the citation stays inside this entry's scope.

- category: Neurologic
  name: Areflexia
  description: >-
    Loss of tendon reflexes, documented in the index case of the founding
    p.Ser59Leu family alongside cerebellar ataxia, a Babinski sign and bulbar
    palsy. The coexistence of areflexia with an extensor plantar response in one
    patient is itself informative, since it marks simultaneous lower and upper
    motor neuron involvement.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical examination showed cerebellar ataxia, Babinski sign, areflexia and bulbar palsy with dysarthria and dysphagia."
    explanation: >-
      Documents areflexia in an FTDALS2 patient specifically, rather than borrowing
      the finding from the SMAJ arm of the CHCHD10 spectrum.

- category: Auditory
  name: Sensorineural Hearing Impairment
  description: >-
    Sensorineural deafness, present in the index case of the founding family and
    listed by GeneReviews among the manifestations that surveillance should look
    for over time.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular evaluations to detect manifestations that can occur with time including neurologic deficits, psychiatric abnormalities, impaired respiratory function, and sensorineural hearing loss."
    explanation: GeneReviews names sensorineural hearing loss as a manifestation warranting surveillance.
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case was a 67-year-old female (Patient IV-6), who developed a cerebellar ataxia at 50 years of age, associated with progressive bulbar syndrome, dementia and sensorineural deafness."
    explanation: Documents sensorineural deafness in the index patient.

- category: Cellular
  name: Ragged-Red Muscle Fibres
  description: >-
    Subsarcolemmal mitochondrial accumulation on modified Gomori trichrome
    staining, present in every biopsied member of the founding family.
  phenotype_term:
    preferred_term: Ragged-red muscle fibers
    term:
      id: HP:0003200
      label: Ragged-red muscle fibers
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, muscle biopsy showed ragged-red and cytochrome c oxidase-negative fibres with combined respiratory chain deficiency and abnormal assembly of complex V."
    explanation: Documents ragged-red fibres in all biopsied patients.

- category: Cellular
  name: Cytochrome c Oxidase-Negative Muscle Fibres
  description: >-
    Fibres lacking complex IV histochemical activity, the histological signature
    of a mosaic mitochondrial DNA defect in muscle.
  phenotype_term:
    preferred_term: Cytochrome C oxidase-negative muscle fibers
    term:
      id: HP:0003688
      label: Cytochrome C oxidase-negative muscle fibers
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, muscle biopsy showed ragged-red and cytochrome c oxidase-negative fibres with combined respiratory chain deficiency and abnormal assembly of complex V."
    explanation: Documents COX-negative fibres in all biopsied patients.

- category: Cellular
  name: Multiple Mitochondrial DNA Deletions
  description: >-
    Accumulation of multiple deleted mitochondrial DNA species in skeletal muscle.
    This is the finding that reclassifies the family's FTD-ALS phenotype as a
    mitochondrial DNA instability disorder, and it is not a feature of ALS or FTD
    from any other cause.
  phenotype_term:
    preferred_term: Multiple mitochondrial DNA deletions
    term:
      id: HP:0003689
      label: Multiple mitochondrial DNA deletions
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The multiple mitochondrial DNA deletions found in skeletal muscle revealed a mitochondrial DNA instability disorder."
    explanation: Documents the deletions and the nosological reclassification they force.
genetic:
- name: CHCHD10
  gene_term:
    preferred_term: CHCHD10
    term:
      id: hgnc:15559
      label: CHCHD10
  relationship_type: CAUSATIVE
  case_fractions:
  - population: French FTD and FTD-ALS cohort (115 patients)
    case_fraction_percent: 2.6
    cohort_size: 115
    notes: >-
      Two heterozygous variants in three unrelated probands. The authors frame
      this as low, and recommend targeting CHCHD10 testing at patients with
      bulbar symptoms at onset rather than screening broadly.
    evidence:
    - reference: PMID:25155093
      reference_title: "Screening of CHCHD10 in a French cohort confirms the involvement of this gene in frontotemporal dementia with amyotrophic lateral sclerosis patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although the frequency of mutations is low in this series (2.6%), our work suggests that CHCHD10 mutations should be searched particularly when bulbar symptoms are present at onset."
      explanation: Quantifies the CHCHD10 share of a defined FTD/FTD-ALS cohort and states the testing implication.
  - population: Chinese sporadic ALS cohort (487 patients, West China Hospital)
    case_fraction_percent: 0.4
    cohort_size: 487
    notes: >-
      Screening an unselected sporadic ALS cohort rather than an FTD-ALS cohort.
      The yield is an order of magnitude below the French FTD-ALS figure, which is
      the expected direction if CHCHD10 disease is defined by the combined
      cognitive-motor phenotype rather than by ALS as such.
    evidence:
    - reference: PMID:27056076
      reference_title: Mutation Screening of the CHCHD10 Gene in Chinese Patients with Amyotrophic Lateral Sclerosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The mutation frequency of CHCHD10 (0.4 %, 2/487) in a Chinese SALS population suggests CHCHD10 gene mutation appears to be an uncommon cause of ALS in Chinese populations."
      explanation: Quantifies the CHCHD10 share of an unselected sporadic ALS cohort.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observation of a frontotemporal dementia-amyotrophic lateral sclerosis phenotype in a mitochondrial disease led us to analyse CHCHD10 in a cohort of 21 families with pathologically proven frontotemporal dementia-amyotrophic lateral sclerosis. We identified the same missense p.Ser59Leu mutation in one of these families."
    explanation: >-
      Independent replication of the founding allele in a second, pathologically
      confirmed FTD-ALS family, which is what moved CHCHD10 from a single-family
      observation to a spectrum gene.
  notes: >-
    CHCHD10 at 22q11.23 encodes a coiled-coil-helix-coiled-coil-helix domain
    protein of the mitochondrial intermembrane space, enriched at cristae
    junctions and a component of the MICOS complex. Heterozygous missense variants
    cause the FTD-ALS phenotype; p.Ser59Leu is the founding allele and p.Gly66Val
    the Finnish SMAJ founder allele.

    Gene-disease validity. ClinGen's ALS Spectrum Disorders expert panel
    classifies the CHCHD10-FTDALS2 relationship as Moderate, while its
    Mitochondrial Diseases panel classifies CHCHD10-mitochondrial disease as
    Definitive. That asymmetry is the single most useful summary of this gene's
    epistemic position and is worth citing in a future revision as a `CGGV:`
    structured reference. It is deliberately NOT cited here: `just
    clingen-refresh` currently fails a pinned-sha256 check against
    data/clingen/MANIFEST.yaml because upstream published a new release behind the
    same URL, and repinning plus rebuilding the 516-file ClinGen cache is a
    maintenance change that does not belong in a curation PR. Nothing in this
    entry rests on the ClinGen claim.
diagnosis:
- name: Molecular Diagnosis by CHCHD10 Sequencing
  description: >-
    The diagnosis is established by finding a heterozygous CHCHD10 pathogenic
    variant in a patient with one or more characteristic clinical findings. Routes
    are single-gene sequencing, an ALS/FTD gene panel, exome or genome sequencing.
    Two negatives matter as much as the positive: repeat-expansion testing (the
    C9orf72 route) will not find it, and primary mitochondrial DNA testing is the
    wrong test even though multiple mtDNA deletions are present, because those
    deletions are secondary to a nuclear-gene defect.
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established when a heterozygous CHCHD10 pathogenic variant is detected in an individual with one or more characteristic clinical findings."
    explanation: GeneReviews states the diagnostic criterion.
  notes: >-
    Variant interpretation is the hard part rather than variant detection. The
    pathogenic alleles are ultra-rare missense changes, while p.Pro34Ser, reported
    in early ALS and FTD series, is common in population databases and is better
    read as benign. Conflating the two is the likeliest source of the gene's
    contested effect size in ALS, which is recorded as an open question under
    `discussions`.

- name: Muscle Biopsy Showing Mitochondrial Myopathy
  description: >-
    Ragged-red fibres and cytochrome c oxidase-negative fibres with combined
    respiratory-chain deficiency and abnormal complex V assembly. This is the
    finding that discriminates CHCHD10 disease from the rest of the FTD-ALS
    spectrum at the bedside, and it is the practical reason a separate diagnostic
    entry is worth having: a mitochondrial myopathy in a patient being worked up
    for ALS or FTD should redirect testing to CHCHD10.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all patients, muscle biopsy showed ragged-red and cytochrome c oxidase-negative fibres with combined respiratory chain deficiency and abnormal assembly of complex V."
    explanation: Reports the biopsy findings in every affected member of the founding family.
  markers: Ragged-red muscle fibers (HP:0003200) and cytochrome c oxidase-negative
    muscle fibers (HP:0003688), with combined respiratory-chain deficiency and
    abnormal complex V assembly.

- name: Detection of Multiple Mitochondrial DNA Deletions in Skeletal Muscle
  description: >-
    Demonstrating multiple mtDNA deletions in muscle establishes the mtDNA
    instability that reclassifies the clinical FTD-ALS picture as a mitochondrial
    disorder. It is a supporting rather than a confirmatory test: the deletions are
    a consequence of the nuclear CHCHD10 defect, so a positive result points
    towards CHCHD10 without replacing sequencing.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The multiple mitochondrial DNA deletions found in skeletal muscle revealed a mitochondrial DNA instability disorder."
    explanation: Reports the finding and the nosological conclusion drawn from it.
  markers: Multiple mitochondrial DNA deletions (HP:0003689) in skeletal muscle.

- name: Electromyography and Nerve Conduction Studies
  description: >-
    Used to document lower motor neuron involvement and to separate a neurogenic
    from a myopathic process. In the founding family it did both and gave different
    answers in different relatives: normal in one, chronic neurogenic change
    consistent with lower motor neuron disease in another, and purely myopathic
    change in a third. That within-family divergence is itself the finding, and it
    is why a single normal or myopathic study does not exclude the diagnosis.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electromyography excluded peripheral neuropathy with normal test (Patient V-10), chronic neurogenic changes suggesting a lower motor neuron disease (Patient IV-15) or myopathic abnormalities only (Patient IV-3)."
    explanation: Documents the three different electrophysiological pictures within one pedigree.

prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disease is defined by a small
    number of reported families and cohort screening yields of 2.6% among FTD and
    FTD-ALS patients and 0.4% among sporadic ALS patients, which are case
    fractions within a selected clinical group, not prevalences, and are recorded
    as such under `genetic`. `measure_type` is UNKNOWN rather than a prevalence
    measure because the sources characterise rarity without measuring occurrence.
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the recent discovery of CHCHD10-related disorders and the limited number of affected individuals reported to date, the natural history of these disorders (except for SMAJ caused by the p.Gly66Val pathogenic variant) is largely unknown."
    explanation: >-
      GeneReviews states that the reported case count is small and the natural
      history unknown, which is the basis for the qualitative band and for
      declining to give a number.

treatments:
- name: Supportive and Symptomatic Management
  description: >-
    No disease-modifying therapy exists. Management of the ALS, FTD, spinal
    muscular atrophy and cerebellar ataxia manifestations follows the standard of
    care for those syndromes from any cause. Nutrition and weight maintenance are
    treated as essential rather than adjunctive, and bracing and stretching are
    used to limit contractures, which are painful and interfere with caregiving.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Adequate nutrition and weight maintenance are essential. Appropriate bracing and stretching can minimize joint contractures, which are often painful and can interfere with caregiving."
    explanation: GeneReviews states the supportive measures and their rationale.
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management of ALS, FTD, SMA, and cerebellar ataxia is the same as for other causes of these disorders."
    explanation: States that management is syndrome-directed rather than CHCHD10-specific.
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baclofen (used to treat spasticity) can sometimes worsen muscle weakness; some drugs used to treat the behavioral manifestations of FTD may worsen dysarthria, dysphagia, and/or respiratory weakness."
    explanation: >-
      The GeneReviews Agents/Circumstances to Avoid content, quoted rather than
      paraphrased because it is a clinical safety claim.
  notes: >-
    Agents and circumstances to avoid. Both cautions matter more here than in
    either parent disorder, because one patient may carry the spasticity, the
    behavioural syndrome and the myopathy at once, so the drug indicated for one
    arm is the drug contraindicated by another. The GeneReviews sentence is quoted
    as evidence above rather than paraphrased here.

- name: Surveillance for Multisystem Progression
  description: >-
    Regular review for new neurologic deficits, psychiatric abnormalities,
    impaired respiratory function and sensorineural hearing loss. Respiratory
    function and hearing are the two that a clinic focused on either parent
    diagnosis alone would be least likely to monitor.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: clinical surveillance
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular evaluations to detect manifestations that can occur with time including neurologic deficits, psychiatric abnormalities, impaired respiratory function, and sensorineural hearing loss."
    explanation: GeneReviews specifies the surveillance targets.

- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk per child. Once the
    familial variant is known, prenatal and preimplantation genetic testing are
    available. Counseling has to convey that intrafamilial heterogeneity prevents
    predicting either the age at onset or which arm of the spectrum a carrier will
    develop.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Once the CHCHD10 pathogenic variant has been identified in an affected family member, prenatal testing for a pregnancy at increased risk for a CHCHD10-related disorder and preimplantation genetic testing are possible."
    explanation: States the reproductive options that counseling covers.
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each child of an individual with a CHCHD10-related disorder has a 50% chance of inheriting the CHCHD10 pathogenic variant."
    explanation: Sources the recurrence-risk figure that this entry states twice.

- name: Nifuroxazide (investigational, MICOS-directed)
  description: >-
    A repurposed broad-spectrum antibacterial identified by screening more than
    1600 compounds against yeast strains engineered to mimic MICOS instability. In
    patient cells it rescues mitochondrial network fragmentation and cristae
    abnormalities and reduces caspase-dependent death of patient iPSC-derived
    motor neurons, apparently by enhancing KIF5B-mediated mitochondrial axonal
    transport. This is preclinical only: no human data exist, and it is recorded
    here because it is the first candidate aimed at the MICOS lesion that this
    entry places at the centre of the mechanism, not because it is available.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nifuroxazide
      term:
        id: NCIT:C90982
        label: Nifuroxazide
  target_mechanisms:
  - target: MICOS Disassembly and Loss of Cristae Junctions
    treatment_effect: RESTORES
    description: >-
      Reverses the cristae and network phenotype in patient fibroblasts carrying
      the founding allele.
    evidence:
    - reference: PMID:39478664
      reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that nifuroxazide rescues mitochondrial network fragmentation and cristae abnormalities in CHCHD10S59L/+ patient fibroblasts."
      explanation: Reports the rescue of the specific cellular lesion this treatment targets.
  - target: Impaired Mitochondrial Axonal Transport
    treatment_effect: RESTORES
    description: >-
      The mechanism the compound's benefit is actually attributed to, as distinct
      from the MICOS phenotype the screen selected on.
    evidence:
    - reference: PMID:39478664
      reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Its benefits involve KIF5B-mediated mitochondrial transport enhancement, evidenced by increased axonal movement and syntaphilin degradation in patient-derived motor neurons."
      explanation: Attributes the compound's effect to restored mitochondrial transport.
  evidence:
  - reference: PMID:39478664
    reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This molecule also decreases caspase-dependent death of human CHCHD10S59L/+ induced pluripotent stem cell-derived motor neurons."
    explanation: Extends the rescue to the human motor neuron model, which is the disease-relevant cell type.
  notes: >-
    Preclinical. Yeast screen plus patient fibroblasts and patient iPSC-derived
    motor neurons; no animal efficacy or human trial data reported.

animal_models:
- name: Chchd10 S59L/+ knock-in mouse
  species: Mouse
  genotype: Chchd10 p.Ser59Leu heterozygous knock-in
  publication: PMID:30874923
  description: >-
    Knock-in of the human founding allele at the endogenous mouse locus. It
    reproduces the mitochondrial myopathy with mtDNA instability seen in the
    original family, and develops neuromuscular junction and motor neuron
    degeneration plus a fatal cardiomyopathy. Its most consequential result is the
    temporal ordering: muscle OXPHOS deficiency is present at three months, before
    any spinal motor neuron loss.
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data confirm that mitochondrial deficiency associated with CHCHD10 mutations can be at the origin of MND."
    explanation: >-
      Supports treating this model as informative for CHCHD10 motor neuron
      disease, which is the claim the model entry itself makes.
  modeled_mechanisms:
  - target: Mitochondrial Myopathy with Ragged-Red and COX-Negative Fibres
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Reproduces the human myopathy with mtDNA instability at the same tissue
      level at which it is observed in patients.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we generated knock-in (KI) mice, carrying the p.Ser59Leu mutation, that mimic the mitochondrial myopathy with mtDNA instability displayed by the patients from our original family."
      explanation: The authors state the model reproduces the patients' myopathy.
  - target: Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Spinal motor neuron loss occurs, but only moderately and only at end stage,
      and the mouse is not reported to show the combined upper and lower motor
      neuron degeneration that defines human ALS.
    limitations: >-
      Motor neuron loss is described as moderate and confined to the end stage,
      and the upper motor neuron component of the human phenotype is not
      demonstrated. Reading this model as an ALS model rather than as a myopathy
      model with late denervation overstates it.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "CHCHD10S59L/+ mice also displayed neuromuscular junction (NMJ) and motor neuron degeneration with hyper-fragmentation of the motor end plate and moderate but significant motor neuron loss in lumbar spinal cord at the end stage of the disease."
      explanation: Reports both the finding and the qualifiers that make it partial rather than full recapitulation.
    readouts:
    - name: Lumbar spinal cord motor neuron count
      target: Motor Neuron Degeneration
      direction: DECREASED
      interpretation: Quantitative correlate of the motor neuron degeneration node.
      evidence:
      - reference: PMID:30874923
        reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "moderate but significant motor neuron loss in lumbar spinal cord at the end stage of the disease"
        explanation: Reports the measurement and its direction.
  - target: Frontotemporal Cortical and Hippocampal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Behavioural and electrophysiological phenotyping shows impaired learning and
      memory with reduced hippocampal long-term potentiation, alongside
      aggregates, integrated stress response activation and neuroinflammation.
    limitations: >-
      The readout is hippocampal learning and memory, whereas human FTD is defined
      by frontal behavioural and language change with relative memory sparing
      early on. The model therefore reports a cognitive deficit in the wrong
      cognitive domain for the human syndrome it is cited for.
    evidence:
    - reference: PMID:38583639
      reference_title: "CHCHD10(S59L/+) mouse model: Behavioral and neuropathological features of frontotemporal dementia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "They also validate the Chchd10S59L/+ mice as a relevant model for FTD, which can be used for preclinical studies to test new therapeutic strategies for this devastating disease."
      explanation: The authors' own claim that the model is relevant for FTD; the domain caveat is recorded in limitations.
  - target: Mitochondrial Cardiomyopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Fully penetrant fatal cardiomyopathy before 14 months.
    limitations: >-
      Cardiomyopathy is fully penetrant and fatal in the mouse but is not a
      prominent reported feature of human FTDALS2, so the model is more severe in
      this organ than the disease it represents.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Before 14 months of age, all KI mice developed a fatal mitochondrial cardiomyopathy associated with enhanced mitophagy."
      explanation: Reports the cardiac phenotype and its complete penetrance.

- name: Chchd10 S55L/+ knock-in mouse
  species: Mouse
  genotype: Chchd10 p.Ser55Leu heterozygous knock-in (mouse equivalent of human S59L)
  publication: PMID:30877432
  description: >-
    An independently generated knock-in of the mouse-equivalent residue. It is the
    model that established the toxic gain-of-function mechanism, by the contrast
    between the point mutant and a null allele, and the one in which the
    OMA1-DELE1-HRI stress axis was dissected genetically.
  evidence:
  - reference: PMID:30877432
    reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Overall, CHCHD10S55L mice recapitulate crucial aspects of human disease and reveal a novel toxic gain-of-function mechanism through maladaptive mtISR and metabolic dysregulation."
    explanation: The authors' assessment of the model's fidelity to human disease.
  modeled_mechanisms:
  - target: Mutant CHCHD10 and CHCHD2 Co-Aggregation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Mutant CHCHD10 co-aggregates with CHCHD2 in exactly the tissues that develop
      pathology, and the ablation comparison shows the aggregate rather than the
      missing protein is what causes disease.
    evidence:
    - reference: PMID:30877432
      reference_title: "ALS/FTD mutant CHCHD10 mice reveal a tissue-specific toxic gain-of-function and mitochondrial stress response."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Conversely, CHCHD10 ablation does not induce disease pathology or activate the mtISR, indicating that CHCHD10S55L-dependent disease pathology is not caused by loss-of-function."
      explanation: The genetic control that makes the gain-of-function reading of this model sound.
  - target: Maladaptive Mitochondrial Integrated Stress Response
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Aggregate-driven mtISR through mTORC1 and the OMA1-DELE1-HRI axis, with the
      response shown to be maladaptive by an epistasis experiment in which
      protease-inactive Oma1 delays cardiomyopathy.
    evidence:
    - reference: PMID:41420107
      reference_title: Mutant CHCHD10 disrupts cytochrome c oxidation and activates mitochondrial retrograde signaling.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using protease-inactive Oma1E324Q/E324Q knock-in mice, we show that blunting mtISR in Chchd10S55L/+ mice delays cardiomyopathy onset without rescuing CHCHD10 insolubility, cristae defects or OXPHOS impairment."
      explanation: Establishes that the model supports a causal, and separable, role for the stress response.

experimental_models:
- name: Patient fibroblasts carrying CHCHD10 p.Ser59Leu
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary fibroblasts from affected members of the founding family, showing
    respiratory-chain deficiency, mitochondrial ultrastructural abnormality and
    network fragmentation, but with mitochondrial fusion intact.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Interestingly, expression of matrix-targeted photoactivatable GFP showed that mitochondrial fusion was not inhibited in patient fibroblasts."
    explanation: >-
      A negative result in this model that constrains what it can be used for:
      the network fragmentation is not a fusion defect, so the model should not be
      read as reporting on mitochondrial fusion.
  modeled_mechanisms:
  - target: MICOS Disassembly and Loss of Cristae Junctions
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Fibroblasts are not an affected tissue in this disease, and the aggregation
      that drives pathology in the knock-in mouse is tissue-specific. A cellular
      phenotype present in fibroblasts therefore may not be the one that kills
      motor neurons.
    evidence:
    - reference: PMID:24934289
      reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient fibroblasts present with respiratory chain deficiency, mitochondrial ultrastructural alterations and fragmentation of the mitochondrial network."
      explanation: Documents the cellular phenotype in patient-derived cells.
  - target: Mitochondrial DNA Instability with Multiple Deletions
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The system in which the genome-repair defect underlying the deletions was
      demonstrated, by challenging cells with oxidative stress.
    evidence:
    - reference: PMID:26666268
      reference_title: "CHCHD10 mutations promote loss of mitochondrial cristae junctions with impaired mitochondrial genome maintenance and inhibition of apoptosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Repair of the mitochondrial genome after oxidative stress is impaired in CHCHD10 mutant fibroblasts and this likely explains the accumulation of deleted mtDNA molecules in patient muscle."
      explanation: The measurement made in this model and the inference drawn from it.

- name: Patient iPSC-derived motor neurons carrying CHCHD10 p.Ser59Leu
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Motor neurons differentiated from patient induced pluripotent stem cells,
    which are hypersensitive to staurosporine- or glutamate-induced caspase
    activation compared with controls.
  evidence:
  - reference: PMID:39478664
    reference_title: Nifuroxazide rescues the deleterious effects due to CHCHD10-associated MICOS defects in disease models.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Its benefits involve KIF5B-mediated mitochondrial transport enhancement, evidenced by increased axonal movement and syntaphilin degradation in patient-derived motor neurons."
    explanation: >-
      Establishes this model as one in which a mechanistic readout (axonal
      mitochondrial transport) can be measured and pharmacologically moved, which
      is what makes it informative rather than merely patient-derived.
  modeled_mechanisms:
  - target: Motor Neuron Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Provides a human, motor-neuron-autonomous vulnerability phenotype, which is
      the compartment the mouse data argue against being primary.
    limitations: >-
      The phenotype is a sensitivity to an applied stressor rather than
      spontaneous degeneration, and its direction is opposite to the apoptotic
      block seen with mutant alleles in other systems. It also stands against the
      knock-in mouse ordering in which muscle, not the motor neuron, is hit first.
    evidence:
    - reference: PMID:30874923
      reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We also showed that motor neurons differentiated from human iPSC carrying the p.Ser59Leu mutation were much more sensitive to Staurosporine or glutamate-induced caspase activation than control cells."
      explanation: Reports the cell-autonomous vulnerability measured in this model.
mechanistic_hypotheses:
- hypothesis_group_id: mitochondrial_origin_of_ftd_als
  hypothesis_label: Mitochondrial origin of the FTD-ALS phenotype
  status: ALTERNATIVE
  description: >-
    The proposal that in CHCHD10 disease the FTD-ALS phenotype arises from primary
    mitochondrial disease rather than from the proteostatic cascade that is the
    canonical model of ALS and FTD-MND. It is recorded as ALTERNATIVE, not
    CANONICAL: it is well supported for this gene but is a minority mechanism
    within the FTD-ALS spectrum as a whole, and the discovery paper itself frames
    it as opening a field rather than settling one.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work opens a novel field to explore the pathogenesis of the frontotemporal dementia-amyotrophic lateral sclerosis clinical spectrum by showing that mitochondrial disease may be at the origin of some of these phenotypes."
    explanation: >-
      The authors' statement of the hypothesis, including the hedge ("some of
      these phenotypes") that keeps it an alternative rather than a replacement
      model.

- hypothesis_group_id: muscle_first_motor_neuron_disease
  hypothesis_label: Muscle-first origin of CHCHD10 motor neuron disease
  status: EMERGING
  description: >-
    That the pathological sequence runs muscle to neuromuscular junction to motor
    neuron, rather than beginning in the motor neuron and producing denervation
    atrophy. It rests on the knock-in mouse ordering, in which muscle OXPHOS
    deficiency is present at three months with the spinal cord intact and motor
    neuron loss appears only at end stage. It is EMERGING because the ordering has
    been demonstrated in one mouse model, is not established in patients, and is
    in tension with the patient iPSC motor neurons, which are cell-autonomously
    hypersensitive to stress.
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data show that the pathological effects of the p.Ser59Leu mutation target muscle prior to NMJ and motor neurons."
    explanation: The authors' own statement of the ordering claim this hypothesis names.

discussions:
- discussion_id: cardiomyopathy_model_human_divergence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is mitochondrial cardiomyopathy fully penetrant and fatal in both CHCHD10
    knock-in mouse lines while cardiac involvement is not a prominent reported
    feature of human FTDALS2?
  attaches_to:
  - pathophysiology#Mitochondrial Cardiomyopathy
  - animal_models#Chchd10 S59L/+ knock-in mouse
  rationale: >-
    This is not a peripheral discrepancy. The cardiomyopathy is the endpoint on
    which the causal role of the mitochondrial integrated stress response was
    established, by showing that genetically blunting the response delays its
    onset. If the organ carrying that experiment is the organ where mouse and
    human diverge most, then the strongest mechanistic result in the field rests
    on a phenotype whose human counterpart is unclear. Either human cardiac
    involvement is real and under-ascertained because patients are seen in
    neurology clinics, or mouse and human differ in which tissues cross the
    threshold for the stress response, and those two readings have opposite
    implications for whether mtISR inhibition is a plausible human target.
  evidence:
  - reference: PMID:30874923
    reference_title: "Mitochondrial defect in muscle precedes neuromuscular junction degeneration and motor neuron death in CHCHD10(S59L/+) mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Before 14 months of age, all KI mice developed a fatal mitochondrial cardiomyopathy associated with enhanced mitophagy."
    explanation: Establishes the mouse side of the mismatch, including its complete penetrance.
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular evaluations to detect manifestations that can occur with time including neurologic deficits, psychiatric abnormalities, impaired respiratory function, and sensorineural hearing loss."
    explanation: >-
      Establishes the human side by omission: the GeneReviews surveillance list
      names four manifestations and cardiac function is not among them, despite
      cardiomyopathy being the lethal phenotype in both mouse lines.

- discussion_id: cerebellar_and_cochlear_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What mechanism connects CHCHD10 dysfunction to cerebellar degeneration and to
    sensorineural hearing loss, both of which are documented clinically but have no
    node in this entry's mechanism graph?
  attaches_to:
  - phenotypes#Cerebellar Ataxia
  - phenotypes#Sensorineural Hearing Impairment
  rationale: >-
    Cerebellar ataxia was the presenting symptom of the founding family's index
    case at age 50, two further relatives presented with ataxia alone, and the same
    index case had sensorineural deafness. Both are therefore core to the disease as
    first described, and both are deliberately left with no upstream pathophysiology
    node here: the literature reviewed documents them clinically without proposing a
    cell-type or circuit-level mechanism, and inventing an edge from the generic
    mitochondrial lesion would assert more than the sources do. The gap is
    substantive rather than cosmetic, because the mouse models that carry this
    entry's mechanistic weight are characterized for muscle, heart, motor neuron and
    hippocampus, and not for cerebellum or cochlea. Closing it needs either
    neuropathology from CHCHD10 carriers or cerebellar and auditory phenotyping of
    the existing knock-in lines.
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index case was a 67-year-old female (Patient IV-6), who developed a cerebellar ataxia at 50 years of age, associated with progressive bulbar syndrome, dementia and sensorineural deafness."
    explanation: Establishes that both unmodelled phenotypes are present in the founding pedigree, so the gap is about mechanism rather than about whether they occur.

- discussion_id: apoptosis_direction_conflict
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Do CHCHD10 mutations suppress or sensitize apoptosis in the cells that
    actually degenerate?
  attaches_to:
  - pathophysiology#Blocked Cytochrome c Release and Impaired Apoptosis
  - experimental_models#Patient iPSC-derived motor neurons carrying CHCHD10 p.Ser59Leu
  rationale: >-
    Mutant alleles block cytochrome c release and inhibit apoptosis, yet patient
    iPSC-derived motor neurons are markedly more sensitive to caspase activation
    than controls. The two results are not formally contradictory, since they use
    different cell types and different stimuli, but they cannot both be the
    mechanism of neuronal loss. Resolving this matters because an apoptotic block
    and an apoptotic sensitization imply opposite therapeutic directions.

- discussion_id: chchd10_als_effect_size_revision
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What is the actual contribution of CHCHD10 to ALS, given that the early
    literature described it as a common cause of familial ALS while cohort
    screening found a 2.6% rate in FTD/FTD-ALS?
  attaches_to:
  - genetic#CHCHD10
  rationale: >-
    A 2014 research letter is titled "Mutations in the CHCHD10 gene are a common
    cause of familial amyotrophic lateral sclerosis" (PMID:25261972), and that
    title is a claim rather than a finding. It is deliberately not cited as
    evidence anywhere in this entry: the abstract is unavailable in the reference
    cache, so no snippet could be verified from it, and quoting a title as a
    finding is exactly the failure mode the evidence policy warns about. The
    contemporaneous French cohort put the rate at 2.6%, and ClinGen's later expert
    review classifies the gene-disease relationship as Moderate rather than
    Definitive. The most likely explanation is not a wave of negative screens but a
    variant-interpretation error: p.Pro34Ser, counted as pathogenic in several
    early ALS and FTD series, is far too common in population databases to cause a
    dominant ultra-rare disease, so early series over-attributed cases to CHCHD10.
    That account comes from the deep-research report's own gnomAD query rather than
    from a published source, so it is recorded here as the leading hypothesis and
    not as evidence; finding a citable population-genetics analysis that states it
    is the concrete remaining gap.
  evidence:
  - reference: PMID:25155093
    reference_title: "Screening of CHCHD10 in a French cohort confirms the involvement of this gene in frontotemporal dementia with amyotrophic lateral sclerosis patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we evaluated the frequency of CHCHD10 mutations in 115 patients with FTD and FTD-ALS phenotypes."
    explanation: Identifies the cohort whose low yield sits against the "common cause" framing.
  - reference: PMID:28318595
    reference_title: CHCHD10 mutations in patients with amyotrophic lateral sclerosis in Mainland China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among them, the coiled-coil-helix-coiled-coil-helix domain containing 10 (CHCHD10) has been reported to play a controversial role in ALS."
    explanation: >-
      Records that the contested status of the gene in ALS is stated in the primary
      literature and is not this curation's inference. Quoted from the paper's
      framing of prior work, and flagged here because the paper's own conclusion
      runs the other way ("Our findings support the major role of CHCHD10 in the
      frontotemporal dementia-amyotrophic lateral sclerosis disease spectrum"). The
      quote establishes that the controversy exists, not the authors' position in
      it.
  - reference: PMID:27056076
    reference_title: Mutation Screening of the CHCHD10 Gene in Chinese Patients with Amyotrophic Lateral Sclerosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No mutation in CHCHD10 was identified in FALS patients."
    explanation: >-
      A negative result in the very population the "common cause of familial ALS"
      claim is about, in a cohort of 12 familial ALS patients. Small, so it
      constrains the effect size weakly rather than settling it.
differential_diagnoses:
- name: Late-onset spinal motor neuronopathy (SMAJ/LOSMoN)
  description: >-
    The allelic disorder at the other end of the CHCHD10 series, caused by the
    Finnish founder allele p.Gly66Val and segregating in 55 patients from 17
    families. It is a pure lower motor neuron syndrome with cramps,
    fasciculations and areflexia, and it does not carry the dementia or the upper
    motor neuron involvement that define FTDALS2.
  distinguishing_features:
  - Lower motor neuron involvement only, without upper motor neuron signs
  - No cognitive decline
  - A specific Finnish founder haplotype and a different CHCHD10 allele (p.Gly66Val)
  evidence:
  - reference: PMID:25428574
    reference_title: Late onset spinal motor neuronopathy is caused by mutation in CHCHD10.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation c.197G>T p.G66V in CHCHD10 is the cause of the lower motor neuron syndrome LOSMoN/SMAJ."
    explanation: Establishes SMAJ as a distinct, allelic CHCHD10 phenotype.
  - reference: PMID:40400037
    reference_title: Dose-dependent CHCHD10 dysregulation dictates motor neuron disease severity and alters creatine metabolism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report the first homozygous CHCHD10 patient, and show that the variant dosage dictates the severity of the motor neuron disease in SMAJ"
    explanation: >-
      Establishes that severity in the SMAJ arm scales with allele dosage, a
      different determinant from the MICOS-integrity axis that separates SMAJ from
      FTDALS2.
  - reference: PMID:40400037
    reference_title: Dose-dependent CHCHD10 dysregulation dictates motor neuron disease severity and alters creatine metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the disease mechanism of p.G66V is not full haploinsufficiency as residual mutant CHCHD10 protein is present even in a homozygous state"
    explanation: >-
      Distinguishes the SMAJ allele's mechanism from both haploinsufficiency and
      from the aggregation-driven gain of function that characterizes FTDALS2.

- name: Axonal Charcot-Marie-Tooth neuropathy
  description: >-
    A further allelic CHCHD10 presentation, with slowly progressive distal
    weakness and atrophy, loss of tendon reflexes and, critically, sensory
    abnormalities.
  distinguishing_features:
  - >-
    Sensory abnormalities, absent from both the ALS and the SMAJ arms and the most
    useful bedside discriminator within the CHCHD10 series
  - Distal rather than proximal or bulbar distribution of weakness
  evidence:
  - reference: PMID:26131548
    reference_title: CHCHD10-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Axonal Charcot-Marie-Tooth neuropathy: slowly progressive lower-leg muscle weakness and atrophy, small hand muscle weakness, loss of tendon reflexes, sensory abnormalities."
    explanation: Describes the neuropathic arm including the sensory features that distinguish it.

- name: Autosomal dominant isolated mitochondrial myopathy (CHCHD10 p.Gly58Arg)
  description: >-
    A further allelic CHCHD10 phenotype in which the myopathy and cardiomyopathy
    occur without motor neuron disease or dementia. It matters here because it
    shows the mitochondrial arm of FTDALS2 can occur on its own, which is an
    argument that the mitochondrial lesion is primary rather than a consequence of
    neurodegeneration.
  distinguishing_features:
  - Myopathy and cardiomyopathy without motor neuron disease or cognitive decline
  - A distinct allele (p.Gly58Arg)
  evidence:
  - reference: PMID:37021679
    reference_title: "CHCHD2 and CHCHD10-related neurodegeneration: molecular pathogenesis and the path to precision therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Different mutations in CHCHD10 cause additional neuromuscular disorders, including the lower motor neuron disease Spinal Muscular Atrophy Jokela type (SMAJ) (p.G66V) and autosomal dominant isolated mitochondrial myopathy (IMMD) (p.G58R)."
    explanation: >-
      Review evidence for the allele-to-syndrome mapping. Graded OTHER because the
      cited source is an expert review synthesizing the genotype-phenotype
      correlation rather than reporting primary observations.

- name: C9orf72-related frontotemporal dementia with motor neuron disease
  description: >-
    The dominant genetic cause of FTD-MND and the diagnosis a CHCHD10 patient will
    usually be worked up for first. Both present as combined dementia and motor
    neuron disease, but the mechanisms are unrelated.
  distinguishing_features:
  - >-
    A mitochondrial signature on muscle biopsy (ragged-red or cytochrome c
    oxidase-negative fibres, combined respiratory-chain deficiency, multiple
    mitochondrial DNA deletions) is rare in the FTD-ALS spectrum generally, so
    finding it carries high diagnostic weight for CHCHD10 over C9orf72. Stated as
    the positive predictive direction rather than as a negative claim about
    C9orf72 disease, which is not sourced here.
  - >-
    A hexanucleotide repeat expansion rather than a missense variant, so a repeat
    expansion assay is needed and exome sequencing will miss it
  evidence:
  - reference: PMID:24934289
    reference_title: "A mitochondrial origin for frontotemporal dementia and amyotrophic lateral sclerosis through CHCHD10 involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial DNA instability disorders are responsible for a large clinical spectrum, among which amyotrophic lateral sclerosis-like symptoms and frontotemporal dementia are extremely rare."
    explanation: >-
      Supports the discriminator indirectly, by establishing that a mitochondrial
      DNA instability picture is a rare accompaniment of ALS/FTD and so carries
      high diagnostic weight when present.
    directness: INDIRECT

references:
- reference: PMID:26131548
  title: CHCHD10-Related Disorders.
  tags:
  - GeneReviews
notes: >-
  Why this is a separate entry. Issue #8946 filed this MONDO term for curation and
  was closed as `not_planned`/`wontfix`, on the reasoning that the priority
  dashboard recommends LUMP_INTO_PARENT for numbered series members and that
  MONDO:0014395 could be handled as a `has_subtypes` term or a
  `mappings.mondo_mappings` row on a parent entry. The closing comment invited a
  standalone entry on the condition that it "state explicitly what it adds beyond
  the parent". This entry is that argument, and the addition is mechanistic
  rather than nosological.

  The parent entries model FTD-ALS proteostatically. Amyotrophic_Lateral_Sclerosis
  carries a CANONICAL hypothesis of motor neuron proteostatic failure built on
  TDP-43, C9orf72 dipeptide repeats, SOD1 and FUS; Frontotemporal_Dementia
  describes its FTD-MND subtype as almost exclusively C9orf72. The ALS parent's
  canonical model does name mitochondrial dysfunction among its drivers, so the
  claim here is not that mitochondria are absent from it. It is that they occupy
  the opposite position: in the parent model mitochondrial dysfunction is one of
  several convergent contributors to proteostatic failure, whereas in CHCHD10
  disease it is the initiating lesion and the proteostatic changes are downstream.
  The specific chain — MICOS disassembly, cristae-junction collapse, mitochondrial
  DNA instability, OMA1-mediated L-OPA1 cleavage, a maladaptive integrated stress
  response — appears in neither parent, and neither parent's mechanism predicts a
  mitochondrial myopathy on muscle biopsy. Folding the term into a parent as a mapping
  row would record the identifier and discard all of that. Three specific things
  would have no home on either parent: the muscle-first ordering, in which the
  OXPHOS defect precedes motor neuron loss and so inverts the parent's causal
  direction; the allele-severity axis, in which MICOS integrity rather than TDP-43
  localization separates severe from mild disease; and the drug cautions, which
  arise from one patient carrying spasticity, a behavioural syndrome and a
  myopathy at once.

  Scope. The entry is anchored on MONDO:0014395 and curates the FTDALS2 arm. The
  other arms of the CHCHD10 allelic series (SMAJ/LOSMoN p.Gly66Val, axonal CMT2,
  isolated mitochondrial myopathy p.Gly58Arg) are recorded as differential
  diagnoses rather than as `has_subtypes`, because they are separate diseases with
  their own OMIM entries and not subdivisions of FTDALS2. If the KB later wants a
  single record spanning the series, "CHCHD10-related disorder" would be the
  honest unit and this entry would become part of it.

  Provenance. Deep research was requested from falcon, which failed with HTTP 402
  (account out of credits) and fell back to openscientist via
  `just dr_fallback='--fallback'`; the run recorded `fell_back: true`,
  `requested_provider: falcon` and the provider attempts in the report frontmatter.
  The report validated 21/21 references with a 0.0 confabulation rate, and
  `just preflight-dr ... MONDO:0014395` PASSED (CHCHD10 mentioned 82 times, report
  OMIM 615911 matching MONDO's). Its `needs_review: true` flag is driven by term
  validation, not references: one obsolete term (HP:0002355) and two identifiers
  the report "names" with frequency-table cell values rather than labels
  (HP:0001638, HP:0009830). None of the three is bound in this entry. The
  GeneReviews chapter (PMID:26131548) was used as the phenotype baseline per the
  curation SOP. `phenotypes` carries the arms of its Clinical Characteristics list
  that belong to FTDALS2 itself — mitochondrial myopathy, ALS, FTD and cerebellar
  ataxia — and deliberately omits the features GeneReviews attributes to the other
  allelic disorders, since those are curated as differential diagnoses under the
  scope rule above. Concretely, cramps, fasciculations and distal weakness with
  sensory signs are cited by GeneReviews to the SMAJ and Charcot-Marie-Tooth arms,
  so listing them here would have meant quoting a sentence about one disease to
  support a claim about another. Areflexia and amyotrophy are retained because each
  has a source inside scope: the founding pedigree's examination findings, and the
  mitochondrial myopathy sentence respectively. The psychiatric abnormalities named
  only in the surveillance sentence are too unspecific to bind to an HP term.
  Cerebellar ataxia and sensorineural hearing loss are curated as phenotypes but
  have no pathophysiology node, which is recorded as an explicit knowledge gap
  rather than papered over with an invented edge.

  No datasets, and why. `just discover-datasets` returned 12 candidates, all
  tagged DIRECT and all rejected. Every one was matched by relaxing this entry's
  name to the generic string "Frontotemporal Dementia Amyotrophic Lateral
  Sclerosis", and none of the 12 mentions CHCHD10: seven are C9orf72
  hexanucleotide-repeat series from a single paper, three are TDP-43 or FUS
  studies, one is an E. coli phase-transition experiment, and one is a generic
  human ALS upper-motor-neuron transcriptome. That last one is not the
  C9orf72/TDP-43 mechanism this entry is defined against; it was rejected for the
  simpler reason that it is not CHCHD10-specific. This is the Named Entity
  Confusion case the
  dataset SOP warns about, and it is sharper than usual here because C9orf72 is
  precisely the gene this entry's mechanism is defined against, so a C9orf72
  transcriptome attached to this record would assert the opposite of what the
  entry argues. `datasets` is therefore empty by decision, not by omission.

  Treatments deliberately not modelled. Riluzole and edaravone are not curated
  here. Both are standard of care for ALS from any cause, and GeneReviews states
  that management of the ALS, FTD, SMA and cerebellar arms is the same as for other
  causes of those syndromes, so neither is CHCHD10-specific; the available sources
  for them are also generic ALS reviews rather than anything about this gene. A
  reader expecting them should read their absence as scoping, not as an oversight.

  Identifiers. OMIM:615911 anchors this entry's identity alongside the MONDO term
  and is named here rather than in `mappings`, because `DiseaseMappings` carries
  slots for ICD-10-CM, ICD-11, MONDO and NCIT only, with no OMIM slot to put it in.

  What is deliberately not cited. PMID:25261972, titled "Mutations in the CHCHD10
  gene are a common cause of familial amyotrophic lateral sclerosis", is not used
  as evidence anywhere. Its abstract is unavailable (the publisher returned 403 to
  the full-text fetch and PubMed carries no abstract for the research letter), so
  no snippet could be verified, and its title is a claim rather than a finding.
  ClinGen's Moderate classification for the CHCHD10-FTDALS2 relationship is
  likewise described in the `genetic` notes but not cited: `just clingen-refresh`
  currently fails a pinned-sha256 check because upstream published a new release
  behind the same URL, and repinning plus rebuilding the ClinGen cache is a
  maintenance change that does not belong in a curation PR.

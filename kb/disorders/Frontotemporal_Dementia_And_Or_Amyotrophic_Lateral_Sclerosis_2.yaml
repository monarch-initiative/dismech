name: Frontotemporal Dementia And/Or Amyotrophic Lateral Sclerosis 2
creation_date: "2026-09-07T00:00:00Z"
category: Mendelian
description: >-
  Frontotemporal dementia and/or amyotrophic lateral sclerosis 2 (FTDALS2) is an
  adult-onset, autosomal dominant disorder caused by heterozygous missense
  mutation in CHCHD10 at 22q11.23. CHCHD10 encodes a mitochondrial
  intermembrane-space protein enriched at cristae junctions and belonging to the
  MICOS complex, and FTDALS2 is the point at which the FTD-ALS spectrum meets
  primary mitochondrial disease: the founding family presented with motor neuron
  disease and frontal dementia alongside ragged-red and cytochrome c
  oxidase-negative muscle fibres, combined respiratory-chain deficiency and
  multiple mitochondrial DNA deletions. The canonical
  mechanistic model of ALS and of FTD-MND is proteostatic — TDP-43
  mislocalization, C9orf72 dipeptide repeats, SOD1 misfolding — and CHCHD10
  disease does not run through it. Knock-in mouse work shows a toxic
  gain-of-function in which mutant CHCHD10 co-aggregates with its paralog CHCHD2
  and drives a maladaptive mitochondrial integrated stress response, while
  ablating CHCHD10 in that same model produces neither pathology nor a stress
  response, and the earliest measurable lesion is in muscle rather than in motor
  neuron. Ablation is not uniformly silent across models (a separate knockout
  study reports neuromuscular junction impairment); the claim is that the point
  mutant and the null behave differently, not that losing CHCHD10 is harmless. Clinically the CHCHD10 allelic series
  is far wider than the FTDALS2 label implies, spanning isolated mitochondrial
  myopathy, ALS, FTD, late-onset spinal motor neuronopathy (SMAJ/LOSMoN,
  p.Gly66Val), axonal Charcot-Marie-Tooth neuropathy and cerebellar ataxia.

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cytology, a simple, rapid, inexpensive, and repeatable diagnostic method,
      can reveal various bacterial, fungal, viral, and parasitic pathogens.
    explanation: >-
      Supports cytology of follicular lesions as a rapid way to discriminate
      S. aureus folliculitis from nonbacterial mimics.
treatments:
- name: Topical or Systemic Antibacterial Therapy
  description: >-
    Antibacterial treatment suppresses S. aureus in folliculitis barbae, with
    topical therapy for limited folliculitis and systemic therapy for deeper or
    extensive sycosis.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  notes: >-
    No therapeutic agent is named: neither cited source names an antibiotic for
    treating the infection, and mupirocin appears in them only as part of the
    decolonization regimen.
  target_mechanisms:
  - target: Shaving-Associated Staphylococcal Follicular Infection
    treatment_effect: INHIBITS
    description: >-
      Antibacterial therapy reduces the follicular S. aureus burden that
      initiates sycosis barbae.
  evidence:
  - reference: PMID:22639852
    reference_title: "First step in the differential diagnosis of folliculitis: cytology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, topical and/or systemic antibacterial treatment is
      recommended, but this involves the risk of being misused for months or
      even years.
    explanation: >-
      Records that topical or systemic antibacterial treatment is the usual
      approach to folliculitis, and cautions that empiric use for lesions
      assumed to be bacterial risks prolonged misuse when the agent is not
      confirmed.
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of acute SSTI with incision and drainage and systemic
      antibiotics is the mainstay of therapy for healing of the acute
      infection.
    explanation: >-
      Names systemic antibiotics as mainstay therapy for acute S. aureus skin
      and soft-tissue infection in general, applied to sycosis barbae by
      inference.
- name: Incision and Drainage
  description: >-
    Fluctuant furuncles and carbuncles are drained surgically to remove the
    suppurative collection.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Incision and Drainage

    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment of acute SSTI with incision and drainage and systemic
      antibiotics is the mainstay of therapy for healing of the acute
      infection.
    explanation: >-
      Names incision and drainage as mainstay therapy for acute S. aureus skin
      and soft-tissue infection in general, applied to fluctuant beard-area
      furuncles and carbuncles by inference.
- name: Decolonization for Recurrent Staphylococcal SSTI
  description: >-
    Recurrent staphylococcal skin and soft-tissue infection can be managed with
    intranasal mupirocin plus chlorhexidine or dilute-bleach washes to reduce
    S. aureus carriage, recognizing that decolonization reduces colonization
    more reliably than it prevents recurrence.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mupirocin
      term:
        id: CHEBI:7025
        label: mupirocin
  target_mechanisms:
  - target: Staphylococcus aureus Skin and Mucosal Colonization
    treatment_effect: INHIBITS
    description: >-
      Decolonization reduces the skin and mucosal S. aureus reservoir.
  evidence:
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A recommended decolonization regimen includes application of intranasal
      mupirocin and antiseptic body washes with chlorhexidine or dilute bleach
      water baths.
    explanation: >-
      Supports intranasal mupirocin plus antiseptic washes as a general
      decolonization regimen for recurrent community-associated S. aureus
      skin and soft-tissue infection.
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Personal decolonization with topical antimicrobials and antiseptics
      reduces the incidence of recurrent S. aureus SSTI.
    explanation: >-
      Supports decolonization as a way to reduce recurrent S. aureus skin and
      soft-tissue infection in general, applied to recurrent sycosis barbae by
      inference.
  - reference: PMID:27820584
    reference_title: "CA-MRSA Decolonization Strategies: Do They Reduce Recurrence Rate?"
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite successful decolonization, the rate of SSTI recurrence did not
      decrease.
    explanation: >-
      A systematic review of MRSA skin and soft-tissue infection found that
      successful decolonization did not lower recurrence, which contradicts
      the claim that decolonization reduces recurrent infection.

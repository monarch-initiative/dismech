name: Sycosis Barbae
creation_date: "2026-09-29T20:59:56Z"
description: >-
  Sycosis barbae is the deeper staphylococcal form of folliculitis barbae in
  which Staphylococcus aureus infection of shaved beard-region hair follicles
  extends beyond superficial follicular pustules into perifollicular nodules,
  furuncles, or coalescent carbuncles.
category: Infectious Disease
disease_term:
  preferred_term: sycosis barbae
  term:
    id: MONDO:1050000
    label: sycosis barbae
parents:
- Folliculitis
notes: >-
  Scope is bacterial sycosis barbae, the deep Staphylococcus aureus infection of
  beard-area hair follicles. Tinea barbae, pseudofolliculitis barbae and
  herpetic sycosis are differential diagnoses with different causes and are
  not covered here. Folliculitis barbae is not listed as a synonym: the cited
  review describes it as the superficial stage that precedes sycosis barbae,
  and MONDO:1050000 records only "bacterial folliculitis" as a related
  synonym.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the usual bacterial agent in folliculitis barbae
    and can drive progression to the deeper perifollicular infection called
    sycosis barbae.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      The beard-area infection review identifies S. aureus as the usual cause
      of folliculitis barbae, the superficial stage that can progress to
      sycosis barbae.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:25226722
      reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        If untreated, the infection and inflammation can progress, leading to a
        more deeply seated infection known as sycosis barbae.
      explanation: >-
        Defines sycosis barbae as a deeper infectious extension of
        folliculitis barbae, supporting placement under Infectious Diseases.
transmission:
- name: Shaving-Associated Local Follicular Inoculation
  description: >-
    S. aureus from cutaneous or nasal reservoirs seeds terminal beard follicles
    locally, especially after shaving-associated follicular irritation or minor
    trauma.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      Localizes the initial S. aureus infection to shaved beard-area follicle
      openings.
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacterial colonization is frequently an early and critical step in the
      pathogenesis of infection.
    explanation: >-
      Supports resident colonization of skin or mucous membranes as an early
      step in recurrent S. aureus skin and soft-tissue infection, a general
      principle applied here to shaved beard follicles.
pathophysiology:
- name: Staphylococcus aureus Skin and Mucosal Colonization
  description: >-
    S. aureus carried on the skin or mucous membranes is the reservoir from
    which beard follicles are seeded, and from which reinfection follows after
    an episode has healed.
  biological_scale: TISSUE
  downstream:
  - target: Shaving-Associated Staphylococcal Follicular Infection

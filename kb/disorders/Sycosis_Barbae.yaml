name: Sycosis Barbae
creation_date: "2026-09-29T20:59:56Z"
description: >-
  Sycosis barbae is the deeper staphylococcal form of folliculitis barbae in
  which Staphylococcus aureus infection of shaved beard-region hair follicles
  extends beyond superficial follicular pustules into perifollicular nodules,
  furuncles, or coalescent carbuncles.
category: Infectious Disease
disease_term:
  preferred_term: sycosis barbae
  term:
    id: MONDO:1050000
    label: sycosis barbae
parents:
- Folliculitis
synonyms:
- Folliculitis barbae
notes: >-
  Deep research was run with a falcon request that fell back to the
  openscientist provider
  (research/Sycosis_Barbae-deep-research-openscientist.md). The report resolved
  all 19 references and found 22/22 extracted quotes in their cited records, but
  only five references were rated on topic; the veterinary superficial bacterial
  folliculitis papers, pseudofolliculitis barbae genetic papers, tinea barbae
  papers, and herpetic sycosis papers were treated only as comparator leads and
  were not curated here. Its term-validation pass resolved all 21 terms and
  produced only Markdown-heading label artifacts for CL:0000775 and
  UBERON:0002073. `just preflight-dr` returned SKIP because MONDO records no
  causal gene for this acquired infection; manual identity review confirmed that
  the report's primary entity was MONDO:1050000 bacterial sycosis barbae and
  that tinea barbae, pseudofolliculitis barbae, and herpetic sycosis were kept
  as differential diagnoses rather than conflated with the bacterial disease.
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the usual bacterial agent in folliculitis barbae
    and can drive progression to the deeper perifollicular infection called
    sycosis barbae.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      The beard-area infection review identifies S. aureus as the usual cause
      of folliculitis barbae, the superficial stage that can progress to
      sycosis barbae.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:25226722
      reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        If untreated, the infection and inflammation can progress, leading to a
        more deeply seated infection known as sycosis barbae.
      explanation: >-
        Defines sycosis barbae as a deeper infectious extension of
        folliculitis barbae, supporting placement under Infectious Diseases.
transmission:
- name: Shaving-Associated Local Follicular Inoculation
  description: >-
    S. aureus from cutaneous or nasal reservoirs seeds terminal beard follicles
    locally, especially after shaving-associated follicular irritation or minor
    trauma.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      Localizes the initial S. aureus infection to shaved beard-area follicle
      openings.
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacterial colonization is frequently an early and critical step in the
      pathogenesis of infection.
    explanation: >-
      Supports resident colonization of skin or mucous membranes as an early
      step in recurrent S. aureus skin and soft-tissue infection, a general
      principle applied here to shaved beard follicles.
pathophysiology:
- name: Shaving-Associated Staphylococcal Follicular Infection
  description: >-
    Shaving exposes or irritates the opening of terminal beard-area hair
    follicles, allowing S. aureus to establish folliculitis barbae.
  biological_scale: TISSUE
  locations:
  - preferred_term: facial hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  - preferred_term: skin of face
    term:
      id: UBERON:1000021
      label: skin of face
  downstream:
  - target: Deep Perifollicular Staphylococcal Inflammation
    causal_link_type: DIRECT
    description: >-
      Untreated superficial folliculitis can extend deeper around the infected
      follicle.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      Places the upstream staphylococcal infection at beard-area follicular
      openings and links it to shaving.
- name: Deep Perifollicular Staphylococcal Inflammation
  description: >-
    S. aureus folliculitis extends into deeper perifollicular tissue, where
    polymorphonuclear leukocyte recruitment walls off bacteria as nodular
    suppurative lesions.
  biological_scale: TISSUE
  locations:
  - preferred_term: facial hair follicle
    term:
      id: UBERON:0002073
      label: hair follicle
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  downstream:
  - target: Beard-Area Follicular Pustules
    causal_link_type: DIRECT
    description: >-
      Suppurative inflammation appears as fine pustules at beard follicle
      openings.
  - target: Perifollicular Nodules, Furuncles, and Carbuncles
    causal_link_type: DIRECT
    description: >-
      Progressively deeper suppuration creates perifollicular nodules and can
      form furuncles that coalesce into carbuncles.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If untreated, the infection and inflammation can progress, leading to a
      more deeply seated infection known as sycosis barbae. Perifollicular
      nodules, termed furuncles, may appear and when these are multiple and
      coalesce, a deep-seated, communicating, pustulating plaque called a
      carbuncle develops, often with associated systemic upset.
    explanation: >-
      Describes progression from untreated folliculitis barbae to deep sycosis
      barbae and then to furuncles or carbuncles.
  - reference: PMID:25681348
    reference_title: >-
      MyD88 in macrophages is critical for abscess resolution in staphylococcal
      skin infection.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When Staphylococcus aureus penetrates the epidermis and reaches the
      dermis, polymorphonuclear leukocytes (PMLs) accumulate and an abscess is
      formed.
    explanation: >-
      Provides model-organism support for neutrophil abscess formation after
      S. aureus penetrates from epidermis into dermal skin.
phenotypes:
- name: Beard-Area Follicular Pustules
  description: >-
    Fine pustules appear at infected hair-follicle openings within the beard
    area.
  phenotype_term:
    preferred_term: pustule
    term:
      id: HP:0200039
      label: Pustule
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It most frequently presents as a superficial folliculitis, with fine
      pustules appearing at the opening of hair follicles in the beard area,
      often associated with shaving; known as Bockhart impetigo and usually due
      to infection caused by Staphylococcus aureus.
    explanation: >-
      Establishes follicular pustules as the superficial beard-area lesion in
      S. aureus folliculitis barbae.
- name: Perifollicular Nodules, Furuncles, and Carbuncles
  description: >-
    Deeper infection can form perifollicular nodules, furuncles, and coalescent
    carbuncles.
  phenotype_term:
    preferred_term: skin nodule
    term:
      id: HP:0200036
      label: Skin nodule
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Perifollicular nodules, termed furuncles, may appear and when these are
      multiple and coalesce, a deep-seated, communicating, pustulating plaque
      called a carbuncle develops, often with associated systemic upset.
    explanation: >-
      Documents perifollicular nodules and furuncle/carbuncle progression in
      deeper beard-area infection.
progression:
- phase: Superficial-to-deep beard folliculitis progression
  notes: >-
    Untreated staphylococcal folliculitis barbae can deepen into sycosis barbae
    and then form furuncles or coalescent carbuncles.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If untreated, the infection and inflammation can progress, leading to a
      more deeply seated infection known as sycosis barbae.
    explanation: >-
      Supports deepening from superficial folliculitis barbae to sycosis
      barbae when untreated.
diagnosis:
- name: Cytology and Culture of Follicular Lesions
  description: >-
    Follicular material can be sampled for cytology and culture to distinguish
    bacterial folliculitis from fungal, viral, or parasitic mimics.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
    qualifiers:
    - predicate:
        preferred_term: diagnostic procedure
        term:
          id: NCIT:C18020
          label: Diagnostic Procedure
      value:
        preferred_term: Cytology
        term:
          id: NCIT:C16491
          label: Cytology
  evidence:
  - reference: PMID:22639852
    reference_title: "First step in the differential diagnosis of folliculitis: cytology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cytology, a simple, rapid, inexpensive, and repeatable diagnostic method,
      can reveal various bacterial, fungal, viral, and parasitic pathogens.
    explanation: >-
      Supports cytology of follicular lesions as a rapid way to discriminate
      S. aureus folliculitis from nonbacterial mimics.
treatments:
- name: Topical or Systemic Antibacterial Therapy
  description: >-
    Antibacterial treatment suppresses S. aureus in folliculitis barbae, with
    topical therapy for limited folliculitis and systemic therapy for deeper or
    extensive sycosis.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: mupirocin
      term:
        id: CHEBI:7025
        label: mupirocin
  target_mechanisms:
  - target: Shaving-Associated Staphylococcal Follicular Infection
    treatment_effect: INHIBITS
    description: >-
      Antibacterial therapy reduces the follicular S. aureus burden that
      initiates sycosis barbae.
  evidence:
  - reference: PMID:22639852
    reference_title: "First step in the differential diagnosis of folliculitis: cytology."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Therefore, topical and/or systemic antibacterial treatment is
      recommended, but this involves the risk of being misused for months or
      even years.
    explanation: >-
      Supports antibacterial therapy for presumed bacterial folliculitis while
      cautioning against prolonged empiric use without confirming the agent.
- name: Decolonization for Recurrent Staphylococcal SSTI
  description: >-
    Recurrent staphylococcal skin and soft-tissue infection can be managed with
    intranasal mupirocin plus chlorhexidine or dilute-bleach washes to reduce
    S. aureus carriage, recognizing that decolonization reduces colonization
    more reliably than it prevents recurrence.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mupirocin
      term:
        id: CHEBI:7025
        label: mupirocin
  evidence:
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A recommended decolonization regimen includes application of intranasal
      mupirocin and antiseptic body washes with chlorhexidine or dilute bleach
      water baths.
    explanation: >-
      Supports intranasal mupirocin plus antiseptic washes as a general
      decolonization regimen for recurrent community-associated S. aureus
      skin and soft-tissue infection.
  - reference: PMID:27820584
    reference_title: "CA-MRSA Decolonization Strategies: Do They Reduce Recurrence Rate?"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite successful decolonization, the rate of SSTI recurrence did not
      decrease.
    explanation: >-
      A systematic review found that reduced carriage does not always translate
      into lower SSTI recurrence, qualifying decolonization as recurrence
      management rather than curative therapy.

      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Furuncle
    treatment_effect: INHIBITS
    description: >-
      Drainage evacuates the suppurative collection of a furuncle.
  - target: Carbuncle
    treatment_effect: INHIBITS
    description: >-
      Drainage evacuates the communicating suppurative collection of a

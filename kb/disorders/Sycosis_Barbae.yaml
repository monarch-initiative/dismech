    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacterial colonization is frequently an early and critical step in the
      pathogenesis of infection.
    explanation: >-
      States colonization as an early step in S. aureus skin and soft-tissue
      infection in general; applied here to beard-follicle infection by

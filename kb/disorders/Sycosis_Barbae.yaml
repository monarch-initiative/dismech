progression:
- phase: Superficial-to-deep beard folliculitis progression
  notes: >-
    Untreated staphylococcal folliculitis barbae can deepen into sycosis barbae
    and then form furuncles or coalescent carbuncles.
  evidence:
  - reference: PMID:25226722
    reference_title: "Infection of the Beard area. Kerion: a review of 2 cases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If untreated, the infection and inflammation can progress, leading to a
      more deeply seated infection known as sycosis barbae.
    explanation: >-
      Supports deepening from superficial folliculitis barbae to sycosis
      barbae when untreated.
- phase: Recurrence after healing
  notes: >-
    Recurrent episodes are described for S. aureus skin and soft-tissue
    infection in general; the cited review does not address sycosis barbae
    specifically.
  evidence:
  - reference: PMID:30859379
    reference_title: >-
      Prevention Strategies for Recurrent Community-Associated Staphylococcus
      aureus Skin and Soft Tissue Infections.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More than half of patients experiencing SSTI will have at least one
      recurrent infection.
    explanation: >-
      Supports recurrence as a common course of S. aureus skin and soft-tissue
      infection, applied to sycosis barbae by inference.
diagnosis:
- name: Cytology of Follicular Lesions
  description: >-

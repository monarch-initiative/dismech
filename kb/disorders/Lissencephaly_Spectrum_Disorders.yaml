    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
    modifier: INCREASED
  - preferred_term: actin filament branching
    term:
      id: GO:0090135
      label: actin filament branching
    modifier: INCREASED
  evidence:
  - reference: PMID:30013181
    reference_title: "Biallelic loss of human CTNNA2, encoding αN-catenin, leads to ARP2/3 complex overactivity and disordered cortical neuronal migration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      recombinant αN-catenin interacted with purified actin and repressed ARP2/3
      actin-branching activity
    explanation: >-
      Establishes that αN-catenin represses ARP2/3 actin branching, so its loss
      increases the two actin processes bound on this node.
  - reference: PMID:30013181
    reference_title: "Biallelic loss of human CTNNA2, encoding αN-catenin, leads to ARP2/3 complex overactivity and disordered cortical neuronal migration."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The actin-binding domain of αN-catenin or ARP2/3 inhibitors rescued the
      neuronal phenotype associated with CTNNA2 loss, suggesting ARP2/3
      de-repression as a potential disease mechanism.
    explanation: >-
      The rescue by ARP2/3 inhibition is what makes de-repression the mechanism this
      node asserts rather than a correlated observation.
  downstream:
  - target: Impaired Neuronal Migration
    description: >-
      Unrestrained ARP2/3 activity destabilizes neurites and impairs cortical
      neuronal migration, producing the recessive pachygyria of the CTNNA2
      subtype.
    evidence:
    - reference: PMID:30013181
      reference_title: "Biallelic loss of human CTNNA2, encoding αN-catenin, leads to ARP2/3 complex overactivity and disordered cortical neuronal migration."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        CTNNA2 was expressed in human cerebral cortex, and its loss in neurons
        led to defects in neurite stability and migration.
      explanation: >-
        States the migration defect that follows CTNNA2 loss, which is the consequence
        this edge asserts.
- name: Neuronal Overmigration Across the Pial Boundary
  conforms_to: "pial_basement_membrane_radial_glial_endfoot_failure#Neuronal Overmigration Across the Pial Boundary"
  description: >-
    In the cobblestone forms the cortical pial boundary fails rather than
    locomotion, and neurons and glia migrate past the cortical surface into the
    arachnoid space, forming an extracortical layer. This is the opposite
    direction of error from the migration-arrest nodes above and is why
    cobblestone malformation is kept separate from classic lissencephaly in this
    entry. TMTC3 reaches this node without an alpha-dystroglycan defect, while
    the glycosylation-pathway genes on the Cobblestone subtype reach it through
    alpha-dystroglycan.
  biological_scale: TISSUE
  genes:
  - preferred_term: TMTC3
    term:
      id: hgnc:26899
      label: TMTC3
  - preferred_term: POMT1
    term:
      id: hgnc:9202
      label: POMT1
  - preferred_term: POMT2
    term:
      id: hgnc:19743
      label: POMT2
  - preferred_term: POMGNT1
    term:
      id: hgnc:19139
      label: POMGNT1

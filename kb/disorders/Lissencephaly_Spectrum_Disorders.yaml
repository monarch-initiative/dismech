  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: neuron migration
    term:
      id: GO:0001764
      label: neuron migration
    modifier: INCREASED
  - preferred_term: cerebral cortex radial glia-guided migration
    term:
      id: GO:0021801
      label: cerebral cortex radial glia-guided migration
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:22323514
    reference_title: "Cobblestone lissencephaly: neuropathological subtypes and correlations with genes of dystroglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cortical dysplasia results from neuroglial overmigration into the
      arachnoid space, forming an extracortical layer, responsible for agyria
      and/or 'cobblestone' brain surface and ventricular enlargement. The
      underlying mechanism is a disruption of the glia limitans, the outermost
      layer of the brain.
    explanation: >-
      A fetal neuropathological series states the overmigration direction and the
      boundary lesion that this node asserts, distinguishing it from migration arrest.
  - reference: PMID:22323514
    reference_title: "Cobblestone lissencephaly: neuropathological subtypes and correlations with genes of dystroglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most severe, which we called cobblestone lissencephaly A, was linked
      to mutations in POMT1 (34%), POMT2 (8%) and FKRP (1.5%). The least severe,
      cobblestone lissencephaly C, was linked to POMGNT1 mutations (18%).
    explanation: >-
      Attaches POMT1, POMT2 and POMGNT1 to the human cobblestone phenotype in a
      genotyped fetal cohort, which is what justifies binding those three genes to this
      node.
  - reference: PMID:27773428
    reference_title: "Biallelic Mutations in TMTC3, Encoding a Transmembrane and TPR-Containing Protein, Lead to Cobblestone Lissencephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest that loss of TMTC3 causes COB with minimal eye or muscle involvement."
    explanation: >-
      Attaches TMTC3 to the same cobblestone endpoint while separating it clinically from
      the dystroglycanopathies, which is why both routes are bound to one node here.
  - reference: PMID:22323514
    reference_title: "Cobblestone lissencephaly: neuropathological subtypes and correlations with genes of dystroglycanopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mutations in POMT1, POMT2, POMGNT1, LARGE, FKTN and FKRP genes attributed
      these diseases to alpha-dystroglycanopathies.
    explanation: >-
      Supports the claim in this node's description that POMT1, POMT2 and POMGNT1 reach the
      cobblestone endpoint through alpha-dystroglycan, where TMTC3 does not. Recorded as
      BACKGROUND because it is the cited study's summary of prior gene discoveries rather
      than its own result.
  downstream:
  - target: Cobblestone lissencephaly
    description: >-
      Neuroglial overmigration past the pial boundary produces the extracortical
      layer and nodular brain surface that define cobblestone (type II)
      lissencephaly.
    evidence:
    - reference: PMID:22323514
      reference_title: "Cobblestone lissencephaly: neuropathological subtypes and correlations with genes of dystroglycanopathies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cortical dysplasia results from neuroglial overmigration into the
        arachnoid space, forming an extracortical layer, responsible for agyria
        and/or 'cobblestone' brain surface and ventricular enlargement. The
        underlying mechanism is a disruption of the glia limitans, the outermost
        layer of the brain.
      explanation: >-
        States the step from overmigration to the cobblestone brain surface that this
        edge asserts.
phenotypes:
- name: Lissencephaly
  description: >-
    A smooth cerebral surface with absent or reduced gyration (agyria or
    pachygyria) due to arrest of neuronal migration and cortical
    dyslamination.
  phenotype_term:
    preferred_term: Lissencephaly
    term:
      id: HP:0001339
      label: Lissencephaly
  evidence:
  - reference: PMID:23495356
    reference_title: 'Cytoskeleton in action: lissencephaly, a neuronal migration disorder.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The brains of lissencephaly patients have less-convoluted gyri in the
      cerebral cortex with impaired cortical lamination of neurons.
    explanation: >-
      Directly describes the defining lissencephaly imaging/pathology
      phenotype of reduced gyration and impaired lamination.
- name: Pachygyria
  description: >-
    Broad, abnormally thick gyri with reduced sulcation, a milder pattern
    within the lissencephaly spectrum, often posterior-predominant in
    LIS1/PAFAH1B1 disease.
  phenotype_term:
    preferred_term: Pachygyria
    term:
      id: HP:0001302
      label: Pachygyria
  evidence:
  - reference: PMID:29671837
    reference_title: Analysis of 17 genes detects mutations in 81% of 811 patients with lissencephaly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of unsolved patients had posterior pachygyria,
      subcortical band heterotopia, or mild frontal pachygyria.
    explanation: >-
      Documents pachygyria (posterior and frontal) as a recognized pattern
      within the lissencephaly spectrum cohort.
- name: Subcortical Band Heterotopia
  description: >-
    A band of arrested, heterotopic neurons in the white matter beneath the
    cortex ("double cortex"), characteristically seen in females with
    DCX-related disorders.
  phenotype_term:
    preferred_term: Subcortical band heterotopia
    term:
      id: HP:0032409
      label: Subcortical band heterotopia
  evidence:
  - reference: PMID:20301364
    reference_title: DCX-Related Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DCX-related disorders include the following neuronal migration
      disorders: classic thick lissencephaly (more severe anteriorly),
      usually in males, and subcortical band heterotopia (SBH), primarily in
      females.
    explanation: >-
      GeneReviews documents subcortical band heterotopia as a core
      DCX-related lissencephaly-spectrum phenotype, predominantly in females.
- name: Seizures
  description: >-
    Epilepsy occurs in the great majority of individuals with classic
    lissencephaly, frequently includes infantile spasms, and is often
    drug-resistant.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: VERY_FREQUENT
  evidence:

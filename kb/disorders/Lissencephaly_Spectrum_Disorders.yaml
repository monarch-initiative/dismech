  - reference: PMID:16481446
    reference_title: "Regulation of cytoplasmic dynein ATPase by Lis1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      recombinant Lis1 binds to native brain dynein and significantly increases

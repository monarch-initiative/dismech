- name: CDK5 Activation Failure at the Centrosome
  description: >-
    CDK5 is a cyclin-dependent kinase that forms a complex with LIS1, NDE1, KIF2A
    and the dynein heavy chain, all of which are required for neuronal migration.
    Its activity is reduced either by biallelic loss-of-function CDK5 alleles or
    by loss of CEP85L, which is needed for CDK5 to be correctly localized and
    activated at the centrosome. Human biallelic CDK5 null alleles cause
    lissencephaly with cerebellar hypoplasia, so the kinase is required for
    cortical migration in humans and not only in model systems.
  biological_scale: MOLECULAR

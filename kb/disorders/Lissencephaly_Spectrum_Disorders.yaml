name: Lissencephaly Spectrum Disorders
creation_date: "2026-06-03T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: lissencephaly spectrum disorders
  term:
    id: MONDO:0018838
    label: lissencephaly spectrum disorders
description: >-
  Lissencephaly spectrum disorders are a genetically heterogeneous group of
  malformations of cortical development characterized by abnormal cortical
  folding (reduced gyrification) due chiefly to impaired neuronal migration and
  disordered cortical lamination during embryonic development. The spectrum
  ranges from agyria (near-absent gyri) and pachygyria (broad, reduced gyri) to
  subcortical band heterotopia (SBH, "double cortex"). Most affected individuals
  present congenitally with a structural brain malformation and develop early
  intellectual disability, hypotonia, and drug-resistant seizures. Causal genes
  include PAFAH1B1 (LIS1), DCX, TUBA1A, ARX, RELN, DYNC1H1 and TUBG1, among
  others, with classic, X-linked, tubulinopathy, ARX-related, RELN-related and
  cobblestone (glycosylation-pathway) forms.
notes: >-
  Issue 4080 narrows this enrichment to the PAFAH1B1/LIS1 and DCX classical
  LIS/SBH microtubule-dynein core. Miller-Dieker syndrome is handled as a
  separate contiguous 17p13.3 deletion entry because YWHAE co-deletion and the
  broader deletion phenotype are not equivalent to isolated PAFAH1B1 disease.

  Three gene-defined concepts that MONDO files within or beside the lissencephaly
  spectrum are curated elsewhere rather than as subtypes here. Neu-Laxova
  syndrome 2 (MONDO:0014466, PSAT1) is a serine-biosynthesis disorder and is
  covered by 3-Phosphoglycerate_Dehydrogenase_Deficiency; lissencephaly due to
  TUBA1A mutation (MONDO:0012703) has its own entry,
  TUBA1A-related_Tubulinopathy, and the Tubulinopathy/TUBA1A subtype here is the
  spectrum-level view of it; cobblestone lissencephaly without muscular or
  ocular involvement (MONDO:0014077, LAMB1) has its own entry,
  LAMB1-Related_Cobblestone_Lissencephaly.

  Norman-Roberts syndrome (MONDO:0009760) carries MONDO's RELN gene edge, but the
  RELN association was established in autosomal recessive lissencephaly with
  cerebellar hypoplasia (PMID:10973257), which is the concept the RELN-related
  subtype binds and the one ClinGen curated RELN against (MONDO:0019450,
  Definitive). The one publication reporting molecular work under the
  Norman-Roberts clinical label, PMID:8368261, reports only the exclusion of a
  17p Miller-Dieker / isolated lissencephaly deletion by in situ hybridization
  and DNA probe analysis, and predates the RELN finding. No separate
  Norman-Roberts subtype is created, because the gene is already curated and the
  clinical label adds no distinct molecular claim.

  Two MONDO observations from this pass, recorded for a maintainer rather than
  acted on. MONDO:0032677 (lissencephaly 9 with complex brainstem malformation,
  xrefs including OMIM:618325) and MONDO:0100472 (lissencephaly spectrum disorder
  with complex brainstem malformation, whose only xref is GARD:0026233) denote the
  same MACF1 malformation; MONDO carries the MACF1 gene edge on the first, while
  ClinGen curated MACF1 against the second. And MONDO:0032578 (CTNNA2) sits under
  complex cortical dysplasia with other brain malformations rather than under
  lissencephaly spectrum disorders, although it carries "CTNNA2-related
  lissencephaly spectrum disorder" as a synonym, which is why it is curated here.

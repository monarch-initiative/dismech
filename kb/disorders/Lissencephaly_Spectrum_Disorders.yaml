- name: Katanin p80 Deficiency in Dividing Neural Progenitors
  description: >-
    KATNB1 encodes the regulatory p80 subunit of the microtubule-severing enzyme
    katanin. Biallelic deleterious KATNB1 alleles disrupt its interaction with
    the catalytic subunit KATNA1 and with other microtubule-associated proteins,
    and patient-derived fibroblasts show defective mitotic spindle formation. The
    lesion is therefore in the dividing progenitor rather than in the locomotion
    of an already postmitotic neuron, which is consistent with microcephaly being
    what loss of the orthologs reproduces in zebrafish and flies.
  biological_scale: CELLULAR
  genes:
  - preferred_term: KATNB1
    term:
      id: hgnc:6217
      label: KATNB1
  cell_types:
  - preferred_term: neuroepithelial stem cell
    term:
      id: CL:0002259
      label: neuroepithelial stem cell
  - preferred_term: radial glial progenitor
    term:
      id: CL:0000681
      label: radial glial cell
  biological_processes:
  - preferred_term: microtubule severing
    term:
      id: GO:0051013
      label: microtubule severing
    modifier: DECREASED
  - preferred_term: mitotic spindle organization
    term:
      id: GO:0007052
      label: mitotic spindle organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mitotic spindle formation is defective in patient-derived fibroblasts, a
      consequence of disrupted interactions of mutant KATNB1 with KATNA1, the
      catalytic subunit of Katanin, and other microtubule-associated proteins.
    explanation: >-
      Supports the abnormal mitotic spindle organization bound on this node, measured in
      cells from affected individuals, and names katanin as the severing enzyme whose
      regulation is lost.
  - reference: PMID:25521378
    reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      kat80 loss specifically affects the asymmetrically dividing neuroblasts,
      which display supernumerary centrosomes and spindle abnormalities during
      mitosis
    explanation: >-
      Supports locating the defect in the dividing progenitor compartment that this node
      binds, shown in the Drosophila ortholog.
  downstream:
  - target: Impaired Neuronal Migration
    description: >-
      Spindle and centrosome abnormalities in dividing neural progenitors reduce
      and mis-time the output of migrating neurons, producing the cortical
      malformation seen in KATNB1 disease.
    evidence:
    - reference: PMID:25521378
      reference_title: Mutations in KATNB1 cause complex cerebral malformations by disrupting asymmetrically dividing neural progenitors.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exome sequencing analysis of over 2,000 children with complex
        malformations of cortical development identified five independent (four
        homozygous and one compound heterozygous) deleterious mutations in
        KATNB1, encoding the regulatory subunit of the microtubule-severing
        enzyme Katanin.
      explanation: >-
        Links biallelic KATNB1 loss to complex malformations of cortical development in
        humans, which is the consequence this edge asserts.
- name: ARP2/3 De-repression from αN-Catenin Loss
  description: >-
    CTNNA2 encodes αN-catenin, which binds actin and represses ARP2/3-driven
    actin branching. Biallelic truncating CTNNA2 alleles remove that repression,
    and the neuronal phenotype is rescued either by the actin-binding domain of
    αN-catenin or by ARP2/3 inhibitors. This is an actin-side mechanism and is
    distinct from the microtubule and dynein lesions that the tubulin, PAFAH1B1
    and DCX subtypes share.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: CTNNA2
    term:
      id: hgnc:2510
      label: CTNNA2
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:

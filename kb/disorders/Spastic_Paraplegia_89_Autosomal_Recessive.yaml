name: Spastic Paraplegia 89 Autosomal Recessive
category: Mendelian
creation_date: "2026-08-28T12:05:00Z"
synonyms:
- SPG89
- AMFR-related hereditary spastic paraplegia
- Spastic paraplegia 89, autosomal recessive
- gp78-related spastic paraplegia
description: >-
  SPG89 is an autosomal recessive hereditary spastic paraplegia caused by biallelic
  truncating variants in AMFR, which encodes gp78 - a RING-H2 finger E3 ubiquitin ligase
  anchored in the endoplasmic reticulum membrane and a core component of ER-associated
  degradation. It was delineated in 2023 from two genetically unexplained siblings, then
  extended by international collaboration to 20 individuals from 8 unrelated consanguineous
  families.

  What makes the entry worth having is that the mechanism does not run where the gene's
  reputation would predict. gp78 is an ERAD ligase, so the expectation is a proteostasis
  lesion; what the functional work actually found is disturbed **lipid** homeostasis, with
  lipid droplets accumulating in patient fibroblasts and neural stem cells and reversing on
  AMFR re-expression. ER morphology is altered on electron microscopy, which is consistent
  with an ER-resident protein, but the lipid phenotype is the one that carries through to the
  zebrafish and to the treatment hypothesis.

  That treatment hypothesis is the other reason to curate this now. FDA-approved statins
  improved both the touch-evoked escape response and the motor neuron branching defect in
  amfra-null zebrafish larvae. This entry records that as a **preclinical model rescue**, not
  as a therapy: no patient has been treated, and the entry says so in every place the claim
  appears.

  Clinically the phenotype is mainly pure HSP - progressive lower limb spasticity and motor
  dysfunction - but complex forms occur, with global developmental delay and mild
  intellectual disability. A subsequent Algerian series added a homozygous splice variant in
  a patient with a complicated form, extending the spectrum further.
disease_term:
  preferred_term: spastic paraplegia 89, autosomal recessive
  term:
    id: MONDO:0957274
    label: spastic paraplegia 89, autosomal recessive
parents:
- Hereditary Spastic Paraplegia
notes: >-
  Evidence base and its limits. This is a recently delineated gene-disease relationship, so
  the claim check the curation issue asked for is worth recording explicitly: the founding
  report is not a single family. It describes 20 individuals from 8 unrelated consanguineous
  families, with segregation, patient-derived fibroblasts, patient-derived neural stem cells,
  electron microscopy, and an independent zebrafish model - and a second, independent group
  has since reported a further homozygous AMFR variant in an Algerian cohort. That is enough
  to support a pathograph.

  It is not enough to support frequencies. No cohort reports per-phenotype rates, so no
  `frequency` value in this entry is a measured proportion; each is assigned from the
  founding report's own wording ("mainly pure but also complex") and the phenotype
  descriptions say so.

  Deep research: the Perplexity report for this disease resolved 16/16 identifiers with zero
  confabulation, but only 5 of 16 were assessed on topic and 3 were flagged explicitly off
  topic. It was used as a lead source only; every snippet here is anchored to a PMID fetched
  and read directly.

    explanation: >-
      Describes the presenting sequence in the index siblings. Table 1 records onset under 3
      years in 19/19.
- phase: Established disease
  notes: >-
    Progressive spasticity with preserved life expectancy - no premature deaths occurred in
    the cohort (0/20). Mobility is affected to varying degrees: one individual required a
    wheelchair for longer distances at age 17. The absence of regression (0/20) distinguishes
    the course from a neurodegenerative one.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 17 years, individual 1 had a spastic gait and required a wheelchair for longer distances."
    explanation: >-
      The one concrete functional outcome reported. Table 1's 0/20 for premature death and
      0/20 for regression are from the run-on table text and are not separately quotable.
diagnosis:
- name: Whole Genome or Exome Sequencing
  description: >-
    The gene was found by whole genome sequencing in previously unexplained HSP patients, and
    the independent Algerian case came from whole exome sequencing in a panel-negative cohort.
    Given how recently AMFR was recognised, older HSP gene panels will not contain it.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing identified bi-allelic truncating variants in AMFR, encoding a RING-H2 finger E3 ubiquitin ligase"
    explanation: The diagnostic route by which the gene-disease relationship was established.
  - reference: PMID:40560206
    reference_title: "Experience in the clinical and genetic diagnosis of a series of Algerian patients with hereditary spastic paraplegias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome sequencing (WES), we investigated the genetic and clinical features of 29 patients from 16 Algerian families diagnosed with HSPs."
    explanation: Independent confirmation that sequencing rather than panel testing is the productive route.
treatments:
- name: Genetic Counseling
  description: >-
    Every published family is consanguineous, so recurrence risk counselling and carrier
    testing are directly indicated. The founding report also makes a concrete diagnostic point
    that belongs here: the index variant was missed by exome sequencing because AMFR exon 1 is
    poorly covered, and the authors suggest targeted investigation of that exon in unexplained
    HSP - which matters for testing at-risk relatives.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This suggests that targeted investigations of AMFR exon 1 in unexplained HSP patients might help increase diagnostic yields."
    explanation: >-
      The testing-strategy recommendation that follows from the exon 1 coverage problem, and
      the practical content of counselling an at-risk family.
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "resulting in a cohort of 20 individuals from 8 unrelated, consanguineous families"
    explanation: Establishes the consanguinity that makes recurrence-risk counselling central here.
- name: Symptomatic Management of Spasticity
  description: >-
    No disease-modifying therapy exists. Management follows general hereditary spastic
    paraplegia care - physiotherapy, mobility aids, antispastic measures. Recorded with no
    specific agent bound because no source cited here recommends one for this disorder;
    curating a drug from general HSP practice would assert a specificity the evidence does not
    have.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Progressive Lower Limb Spasticity
    description: Addresses the functional consequence; nothing available modifies the underlying lesion.
  notes: >-
    Deliberately thin. The founding report is a gene-discovery and mechanism paper and
    contains no management section, and no GeneReviews chapter exists for AMFR or SPG89. This
    entry does not import management recommendations from the general HSP literature, because
    doing so would attribute to this disorder guidance written for a heterogeneous group.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 17 years, individual 1 had a spastic gait and required a wheelchair for longer distances."
    explanation: >-
      Graded PARTIAL. It establishes the mobility impairment that supportive care addresses,
      but no source cited here states a management recommendation for this disorder.
- name: Statins (preclinical only)
  description: >-
    NOT A TREATMENT FOR PATIENTS. In amfra-null zebrafish larvae, both simvastatin and
    atorvastatin rescued the touch-evoked escape response to levels indistinguishable from
    wild type, but only atorvastatin fully corrected the axon branching defect - the two
    statins are not interchangeable here and the entry does not flatten them. The rationale is
    direct: statins inhibit HMGCR, which is one of the ERAD substrates that accumulates when
    AMFR is lost.

    The complication is that Oil Red O staining under statin showed no difference from
    vehicle. The drug corrected the motor phenotype without a detectable change in the lipid
    droplet phenotype it is supposed to act through. That is modelled as an explicit
    UNCHANGED readout below, and it is the subject of this entry's open discussion.

    No human has been treated and no trial exists. The authors' own wording is "suggesting
    potential therapeutic implications". It is recorded here because a mechanism-derived,
    repurposing-ready hypothesis is exactly the kind of thing this knowledge base should make
    findable - but it must not be read as established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Blunted ERAD of HMGCR and INSIG-1
    description: >-
      Statins inhibit HMGCR, which is precisely the ERAD substrate that accumulates when AMFR
      is lost - so the drug is targeted at the node one step below the genetic lesion rather
      than at the disease in general. What is not demonstrated is the step after: statin
      treatment did not detectably change lipid droplet burden in the model, so the route from
      HMGCR inhibition to motor rescue remains open.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "administration of FDA-approved statins improves touch-evoked escape response and motor neuron branching defects in amfra-/- zebrafish larvae, suggesting potential therapeutic implications"
    explanation: >-
      Graded PARTIAL and MODEL_ORGANISM deliberately. It supports a preclinical rescue in
      zebrafish and nothing more; the authors' hedge "suggesting potential therapeutic
      implications" is quoted rather than paraphrased so the strength of the claim travels
      with it.
experimental_models:
- name: AMFR-null patient-derived fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from affected individuals in Families 1 and 8. Western blotting confirms
    absence of the main AMFR isoform, so these are true null cells rather than a knockdown.
  publication: PMID:37119330
  modeled_mechanisms:
  - target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Lipid droplets accumulate, and the accumulation reverses on AMFR re-expression. Fidelity
      is HIGH because these are patient cells carrying the patient genotype, not an engineered
      approximation.
    limitations: >-
      Fibroblasts are not neurons, and the disease is a corticospinal degeneration. The lipid
      phenotype transfers to a cell type that is not the affected one, which is a real
      restriction on what can be concluded about motor axons.
    readouts:
    - name: Lipid droplet burden
      target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
      direction: INCREASED
      interpretation: The core cellular phenotype, in patient-derived cells.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The absence of AMFR disturbs lipid homeostasis, causing lipid droplet accumulation in NSCs and patient-derived fibroblasts which is rescued upon AMFR re-expression."
        explanation: Reports the droplet measurement and its rescue.
    evidence:
    - reference: PMID:37119330
      reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Western blotting analysis of fibroblasts from Family 1"
      explanation: >-
        Establishes that the patient fibroblasts were characterised at protein level, which is
        what makes them a defined null model rather than an assumed one.
- name: AMFR-knockout ESC-derived neural stem cells
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    CRISPR-Cas9 engineered embryonic stem cells differentiated to neural stem cells. Typed
    IPSC_DERIVED_MODEL as the closest available enum value - these are ESC- rather than
    iPSC-derived, and the enum has no separate ESC term. This is
    the neural counterpart to the fibroblasts, and it carries the rescue experiment that makes
    the lipid phenotype causal rather than correlative - including a RING-mutant arm.
  publication: PMID:37119330
  modeled_mechanisms:
  - target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Droplets accumulate in AMFR-KO NSCs and are rescued by transfecting wild-type AMFR. The
      same experiment includes a RING-domain mutant, which is the arm that ties the phenotype
      specifically to ligase activity rather than to the protein's presence.
    limitations: >-
      Neural stem cells are not mature corticospinal motor neurons, and the readout is a
      developmental cell type rather than the long axons that degenerate in patients.
    readouts:
    - name: Lipid droplet burden with wild-type and RING-mutant AMFR rescue
      target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
      direction: RESTORED
      interpretation: >-
        Wild-type AMFR re-expression reverses droplet accumulation. The RING-mutant comparator
        is what distinguishes "AMFR protein present" from "AMFR ligase active".
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Representative images of ORO staining detecting lipid droplets in wild type and AMFR KO NSCs, and in AMFR KO NSCs transfected with plasmids expressing wild-type AMFR or a RING mutant AMFR."
        explanation: Describes the rescue experiment including the RING-mutant arm.
    evidence:
    - reference: PMID:37119330
      reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "which is rescued upon AMFR re-expression"
      explanation: The rescue that makes this model informative for the node rather than merely consistent with it.
animal_models:
- name: amfra-null zebrafish (amfra-/-)
  species: Zebrafish
  genotype: amfra homozygous null
  publication: PMID:37119330
  description: >-
    The in vivo model of the disease, and the system in which the statin hypothesis was
    tested. It reproduces both the cellular lipid phenotype seen in patient cells and a motor
    phenotype the authors describe as phenocopying the human HSP, which makes it the load
    bearing model for this entry - and, since the human evidence is 20 patients with no
    tissue-level motor data, effectively the only one.
  modeled_mechanisms:
  - target: Motor Neuron Branching Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      amfra-null larvae show defective motor neuron branching and an altered touch-evoked
      escape response, described by the authors as phenocopying the patients' HSP.
    limitations: >-
      Fidelity is recorded as MODERATE rather than HIGH because the comparison is between a
      larval zebrafish escape response and a progressive adult-onset human spasticity. The
      readouts are developmental and behavioural; the human disease is a progressive
      corticospinal degeneration, and no equivalent longitudinal measure exists in the fish.
    readouts:
    - name: Motor neuron branching
      target: Motor Neuron Branching Failure
      direction: DECREASED
      interpretation: Structural correlate of the branching node in this model.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "defects in motor neuron branching, phenocopying the HSP observed in patients"
        explanation: Reports the branching measurement behind this readout.
    - name: Touch-evoked escape response
      target: Motor Neuron Branching Failure
      direction: ALTERED
      interpretation: Behavioural motor readout in the larva.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "altered touch-evoked escape response and defects in motor neuron branching"
        explanation: Reports the behavioural measurement behind this readout.
    evidence:
    - reference: PMID:37119330
      reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar findings are seen in amfra-/- zebrafish larvae, in addition to altered touch-evoked escape response and defects in motor neuron branching, phenocopying the HSP observed in patients."
      explanation: Supports treating this model as informative for the motor node.
  - target: Blunted ERAD of HMGCR and INSIG-1
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Statin treatment rescued the motor phenotypes of the null larvae - but not the lipid
      droplet phenotype. Both arms are recorded as readouts below, because the negative one is
      as informative as the positive ones and is the reason this link is not stronger.
    limitations: >-
      The dissociation is the limitation. Oil Red O staining under statin was unchanged from
      vehicle, so the model shows a lipid-lowering drug correcting motor function without a
      detectable effect on the lipid readout it is supposed to work through. Either the
      droplet stain is too coarse to see the relevant change, or statins are acting on
      something other than the droplet phenotype. The two statins also differ: atorvastatin
      corrected axon branching and simvastatin did not, which a single "statins work" claim
      would hide.
    readouts:
    - name: Touch-evoked escape response under statin treatment
      target: Blunted ERAD of HMGCR and INSIG-1
      direction: RESTORED
      interpretation: >-
        Behaviour rescued to wild-type levels by either statin - the strongest positive result
        in the treatment arm.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "assessing touch-evoked escape response of 3 dpf amfra-/- larvae treated with either SMV or ATV showed a striking rescue of the behavior to levels indistinguishable from wild type"
        explanation: Reports the behavioural rescue, and that it held for both statins.
    - name: Axon branching under statin treatment
      target: Blunted ERAD of HMGCR and INSIG-1
      direction: RESTORED
      interpretation: >-
        Fully corrected by atorvastatin only. The simvastatin failure is why this entry names
        the two drugs separately rather than treating "statins" as one intervention.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: PARTIAL
        evidence_source: MODEL_ORGANISM
        snippet: "ATV but not SMV treatment fully corrected axon branching defects observed in amfra-/- larvae"
        explanation: >-
          Graded PARTIAL because the rescue is drug-specific: it supports atorvastatin and
          refutes the same claim for simvastatin.
    - name: Oil Red O lipid droplet staining under statin treatment
      target: Blunted ERAD of HMGCR and INSIG-1
      direction: UNCHANGED
      interpretation: >-
        No difference between statin- and vehicle-treated null larvae. A real negative result,
        recorded because it is the measurement that would have closed the mechanistic loop and
        did not.
      evidence:
      - reference: PMID:37119330
        reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: "Assessing ORO staining intensity at 3 dpf did not show differences between statin and vehicle-treated control amfra-/- larvae"
        explanation: >-
          Refutes the proposition that statins correct the lipid droplet phenotype in this
          model - the specific claim that would have joined the drug to the mechanism.
    evidence:
    - reference: PMID:37119330
      reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "which may potentially be therapeutically modulated using precision medicine with statins"
      explanation: >-
        Graded PARTIAL because the authors' own framing is doubly hedged ("may potentially"),
        and because the rescue is real on motor readouts while absent on the lipid readout.
discussions:
- discussion_id: spg89_statin_rescue_without_lipid_correction
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Statins rescue motor phenotypes in amfra-null zebrafish but do not change lipid droplet
    burden in the same larvae. Through what mechanism does the rescue act, and does the
    dissociation weaken the case for trialling statins in SPG89 patients?
  attaches_to:
  - treatments#Statins (preclinical only)
  - pathophysiology#Blunted ERAD of HMGCR and INSIG-1
  - pathophysiology#Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
  - animal_models#amfra-null zebrafish (amfra-/-)
  rationale: >-
    The mechanistic chain has a measured gap in the middle, and the measurement was taken -
    it just came back negative.

    Established: AMFR ubiquitinates HMGCR and INSIG-1 for ERAD; losing it disturbs the balance
    of lipid and cholesterol homeostasis; lipid droplets accumulate in patient fibroblasts and
    AMFR-null neural stem cells and reverse on AMFR re-expression; amfra-null zebrafish show
    branching and escape-response defects; statins rescue both motor readouts, atorvastatin
    more completely than simvastatin.

    Not established, and specifically looked for: that statins correct the lipid phenotype.
    Oil Red O staining at 3 dpf showed no difference between statin- and vehicle-treated null
    larvae. So the drug fixes the motor output without a detectable effect on the lipid
    readout that motivated using it.

    Several readings are open and the entry does not choose between them. Oil Red O measures
    neutral lipid droplets, which may be too coarse to register the sterol-level change that
    matters - notably, atorvastatin had the most pronounced effect on brain sterol ratios,
    which is a different and more sensitive measurement than droplet staining. Or statins may
    act through an HMGCR-independent route. Or droplet accumulation may be a marker of the
    lesion rather than the thing that damages axons, in which case correcting it was never the
    right target.

    This is filed as a KNOWLEDGE_GAP rather than a HUMAN_MODEL_MISMATCH because the
    disagreement is between two readouts within the same model, not between model and human.

    An earlier revision of this entry asserted that the lipid readout had never been taken
    under statin and proposed taking it as the resolving experiment. That was wrong - it is
    in the full text of the paper the entry cites - and the proposed experiment below has been
    re-scoped to human cells, where it genuinely has not been done.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Assessing ORO staining intensity at 3 dpf did not show differences between statin and vehicle-treated control amfra-/- larvae"
    explanation: The negative result this discussion is about.
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with also the most pronounced effect on sterol ratios observed for ATV in brain cells"
    explanation: >-
      Supports the reading that a sterol-level effect exists even where droplet staining shows
      none, and that it tracks the drug which worked better on branching.
  proposed_experiments:
  - experiment_id: exp_spg89_statin_lipid_readout_patient_cells
    name: Statin treatment of AMFR-null patient cells with sterol profiling, not droplet staining
    description: >-
      Treat AMFR-null patient fibroblasts and AMFR-KO neural stem cells with atorvastatin and
      simvastatin, and measure cholesterol and non-cholesterol sterol levels alongside Oil Red
      O droplet burden. Two things this would settle that the zebrafish work did not: whether
      the null result is a limitation of droplet staining rather than of the drug, and whether
      any of it holds in human cells rather than fish.
    would_support:
    - treatments#Statins (preclinical only)
    supporting_outcome:
    - >-
      Statins normalize sterol profiles in AMFR-null human cells even where droplet staining is
      unchanged, explaining the zebrafish dissociation as a readout limitation and joining the
      drug back to the mechanism.
    refuting_outcome:
    - >-
      Neither sterol profile nor droplet burden shifts under statin in human AMFR-null cells,
      indicating the zebrafish motor rescue is mechanistically unexplained and the
      precision-medicine framing is not earned.
  - experiment_id: exp_spg89_atorvastatin_vs_simvastatin
    name: Why atorvastatin and not simvastatin
    description: >-
      Determine whether the branching rescue difference reflects CNS penetration, potency, or
      an off-target effect, by comparing brain drug exposure and sterol response for the two
      agents at matched HMGCR inhibition.
    would_support:
    - treatments#Statins (preclinical only)
    supporting_outcome:
    - >-
      The difference tracks brain exposure or sterol response, meaning the mechanism is
      on-target and drug selection matters for any future trial.
    refuting_outcome:
    - >-
      The difference does not track HMGCR inhibition, pointing to an off-target effect and
      undercutting the HMGCR rationale for the whole approach.

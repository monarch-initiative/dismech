- Hereditary Spastic Paraplegia
notes: >-
  Evidence base and its limits. This is a recently delineated gene-disease relationship, so
  the claim check the curation issue asked for is worth recording explicitly: the founding
  report is not a single family. It describes 20 individuals from 8 unrelated consanguineous
  families, with segregation, patient-derived fibroblasts, patient-derived neural stem cells,
  electron microscopy, and an independent zebrafish model - and a second, independent group
  has since reported a further homozygous AMFR variant in an Algerian cohort. That is enough
  to support a pathograph.

  Frequencies here are measured, not inferred. Table 1 of the founding report gives
  per-phenotype rates for the full 20-individual cohort, and every `frequency` value in this
  entry is derived from it, with the count quoted in the evidence. An earlier revision of this
  entry claimed no such rates existed - that was wrong, and it was wrong because the entry was
  curated from the abstract while the full text sat in the cache file committed alongside it.

  The zero rows matter as much as the positive ones. Speech delay, regression, ataxia and
  bladder dysfunction are each 0%, which is a real discriminating observation in a
  hereditary spastic paraplegia differential rather than an absence of data.

  No GeneReviews chapter exists for AMFR or SPG89 - PubMed returns nothing for either. The
  Uncomplicated (Pure) Hereditary Spastic Paraplegia Overview (PMID:20301682) exists but its
  cached abstract is a bare statement of the chapter's purpose with no minable clinical
  content, so it is not cited here.

  Deep research: the Perplexity report for this disease resolved 16/16 identifiers with zero
  confabulation, but only 5 of 16 were assessed on topic and 3 were flagged explicitly off
  topic. It was used as a lead source only; every snippet here is anchored to a PMID fetched
  and read directly.

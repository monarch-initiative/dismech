  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole genome sequencing identified bi-allelic truncating variants in AMFR, encoding a RING-H2 finger E3 ubiquitin ligase anchored at the membrane of the endoplasmic reticulum (ER), in two previously genetically unexplained HSP-affected siblings."
    explanation: Establishes the causal gene and the protein's identity and location.
- name: Blunted ERAD of HMGCR and INSIG-1
  description: >-
    The substrate-level step, and the one that makes the rest of the disease legible. Among
    the proteins gp78 polyubiquitinates for ER-associated degradation are HMGCR - the
    rate-limiting enzyme of cholesterol synthesis - and INSIG-1, its regulatory partner.
    Without the ligase their degradation is blunted, so the cholesterol-synthesis machinery is
    no longer turned over normally.

    This is why the mechanism is ERAD rather than a departure from it: the disease is not
    caused by losing a generic proteostasis function but by losing ERAD of *these* substrates.
    It is also the entire rationale for the statin hypothesis, since statins inhibit the very
    protein that accumulates.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: ERAD pathway
    modifier: DECREASED
    term:
      id: GO:0036503
      label: ERAD pathway
  - preferred_term: cholesterol metabolic process
    modifier: DYSREGULATED
    term:
      id: GO:0008203
      label: cholesterol metabolic process
  downstream:
  - target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "including the cholesterol metabolism regulatory proteins 3-hydroxy-3-methylglutaryl-CoA reductase (HMGCR) and INSIG-1, in a process called ER-associated degradation (ERAD)"
    explanation: >-
      Names the substrates. Graded OTHER because this is the paper's background statement of
      established gp78 biology, citing prior work, rather than a finding of this study.
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "argue that the loss of AMFR's ERAD function likely underlies the disease mechanism of this new disorder, leading to a disturbance in the balance of lipid and cholesterol homeostasis in cells without AMFR"
    explanation: >-
      The authors' own synthesis, and the sentence this entry follows. Note the two hedges
      kept in the quote: "likely underlies", and a disturbance in the *balance* rather than a
      simple decrease - which is why the downstream node uses DYSREGULATED.
- name: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
  description: >-
    The central mechanistic finding. Absence of AMFR disturbs lipid homeostasis, and lipid
    droplets accumulate in both patient-derived fibroblasts and patient-derived neural stem
    cells. The accumulation is rescued by re-expressing AMFR, which is what makes this causal
    rather than correlative - the rescue is the control.
  biological_scale: CELLULAR

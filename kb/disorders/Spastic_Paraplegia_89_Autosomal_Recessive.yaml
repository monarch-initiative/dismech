name: Spastic Paraplegia 89 Autosomal Recessive
category: Mendelian
creation_date: "2026-08-28T12:05:00Z"
synonyms:
- SPG89
- AMFR-related hereditary spastic paraplegia
- Spastic paraplegia 89, autosomal recessive
- gp78-related spastic paraplegia
description: >-
  SPG89 is an autosomal recessive hereditary spastic paraplegia caused by biallelic
  truncating variants in AMFR, which encodes gp78 - a RING-H2 finger E3 ubiquitin ligase
  anchored in the endoplasmic reticulum membrane and a core component of ER-associated
  degradation. It was delineated in 2023 from two genetically unexplained siblings, then
  extended by international collaboration to 20 individuals from 8 unrelated consanguineous
  families.

  The mechanism runs *through* ERAD rather than away from it, and the specific substrates are
  what make the disease make sense. Among the proteins gp78 polyubiquitinates for
  ER-associated degradation are HMGCR and INSIG-1, the regulators of cholesterol synthesis.
  Losing the ligase blunts their degradation, cholesterol and lipid homeostasis is thrown out
  of balance, and lipid droplets accumulate in patient fibroblasts and neural stem cells -
  reversing on AMFR re-expression. The authors' own conclusion is that "the loss of AMFR's
  ERAD function likely underlies the disease mechanism", producing a *disturbance in the
  balance* of lipid and cholesterol homeostasis. That substrate identity is also the entire
  basis of the treatment hypothesis: statins inhibit HMGCR, the protein that accumulates.

  That treatment hypothesis is the other reason to curate this now, and it comes with a
  result that complicates it. Statins rescued the touch-evoked escape response to wild-type
  levels and atorvastatin - but not simvastatin - fully corrected axon branching. Yet Oil Red
  O staining under statin showed **no difference** from vehicle in the same larvae. The drug
  fixes the motor phenotype without visibly correcting the lipid-droplet phenotype it is
  supposed to act through. That negative result is modelled explicitly as an `UNCHANGED`
  readout rather than omitted, and it is what the entry's open question is now about.

  This entry records the statin work as a **preclinical model rescue**, not a therapy: no
  patient has been treated, and the entry says so in every place the claim appears.

  Clinically the phenotype is mainly pure HSP. In the 20-individual cohort, spastic
  paraplegia, lower limb hyperreflexia and motor delay were each present in 100%, and disease
  onset was under three years in 100% - it is a childhood-onset disorder, not an adult
  degeneration. Complex features occur in a minority: learning problems 25%, mild
  intellectual disability 20%, epilepsy 20%, behavioural concerns 15.8%, axial hypotonia and
  fever-induced seizures 10% each, microcephaly 6.3%. A thin corpus callosum was seen in
  55.6% of those imaged. Speech delay, regression, ataxia and bladder dysfunction were each
  0%, which is informative in an HSP differential. A subsequent Algerian series added a
  homozygous splice variant in a patient with a complicated form.

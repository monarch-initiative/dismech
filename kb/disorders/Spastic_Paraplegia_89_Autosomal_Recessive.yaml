genetic:
- name: AMFR
  notes: >-
    Encodes gp78, an ER membrane-anchored RING-H2 finger E3 ubiquitin ligase and a core ERAD
    component. Disease-associated alleles are biallelic and truncating; a homozygous canonical
    splice variant (c.707+1G>A) has been reported independently.

    Worth recording for anyone reading the mechanism: the ERAD role is what gp78 is known for,
    but the demonstrated consequence in patient cells is disturbed lipid homeostasis. The
    entry follows the demonstrated phenotype rather than the expected one.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: AMFR
    term:
      id: hgnc:463
      label: AMFR
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our genetic and functional studies identify bi-allelic truncating variants in AMFR as a cause of a novel autosomal recessive HSP by altering lipid metabolism"
    explanation: The authors' own summary of the gene-disease relationship and its mechanism.
  variants:
  - name: c.707+1G>A
    description: >-
      Homozygous canonical splice donor variant reported in an Algerian patient with a
      complicated form, by a group independent of the founding report.
    evidence:
    - reference: PMID:40560206
      reference_title: "Experience in the clinical and genetic diagnosis of a series of Algerian patients with hereditary spastic paraplegias."
      supports: SUPPORT

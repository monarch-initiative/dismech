pathophysiology:
- name: gp78 E3 Ubiquitin Ligase Loss of Function
  description: >-
    Biallelic truncating AMFR variants remove gp78, a RING-H2 finger E3 ubiquitin ligase
    anchored at the ER membrane. gp78 is a core ERAD component, so the naive expectation is a
    proteostasis phenotype; the demonstrated downstream consequence in patient cells is a
    lipid one, which is the point at which this disease departs from what the gene's known
    biology predicts.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AMFR

treatments:
- name: Statins (preclinical only)
  description: >-
    NOT A TREATMENT FOR PATIENTS. FDA-approved statins improved the touch-evoked escape
    response and the motor neuron branching defect in amfra-null zebrafish larvae, and the
    authors propose this as a precision-medicine hypothesis following from the lipid
    mechanism. No human has been treated, no trial exists, and the authors' own wording is
    "suggesting potential therapeutic implications". It is recorded here because a
    mechanism-derived, repurposing-ready hypothesis is exactly the kind of thing this
    knowledge base should make findable - but it must not be read as established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
    description: >-
      The rationale is that inhibiting HMG-CoA reductase counteracts the disturbed lipid
      homeostasis that follows AMFR loss. This is the proposed target; the zebrafish readouts
      that improved were motor, not lipid, so the causal chain from statin to rescue is not
      itself demonstrated.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "administration of FDA-approved statins improves touch-evoked escape response and motor neuron branching defects in amfra-/- zebrafish larvae, suggesting potential therapeutic implications"
    explanation: >-
      Graded PARTIAL and MODEL_ORGANISM deliberately. It supports a preclinical rescue in
      zebrafish and nothing more; the authors' hedge "suggesting potential therapeutic
      implications" is quoted rather than paraphrased so the strength of the claim travels
      with it.

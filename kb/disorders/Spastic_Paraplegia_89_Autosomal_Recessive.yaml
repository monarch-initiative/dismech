discussions:
- discussion_id: spg89_statin_rescue_translational_standing
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the statin rescue of motor phenotypes in amfra-null zebrafish larvae support trialling
    statins in SPG89 patients, given that the rescue was measured on larval motor readouts and
    not on the lipid phenotype it is supposed to act through?
  attaches_to:
  - treatments#Statins (preclinical only)
  - pathophysiology#Disturbed Lipid Homeostasis with Lipid Droplet Accumulation
  - animal_models#amfra-null zebrafish (amfra-/-)
  rationale: >-
    The chain of reasoning behind the statin proposal has a gap in the middle, and it is worth
    marking because the proposal is otherwise unusually attractive - a repurposable,
    widely-used, cheap drug with a mechanistic rationale in an untreatable degenerative
    disease.

    What is established: AMFR loss causes lipid droplet accumulation in patient cells,
    reversible by AMFR re-expression; amfra-null zebrafish have motor branching and escape
    response defects; statins improve those motor defects.

    What is not established: that statins correct the lipid phenotype. The rescue readouts
    are motor and behavioural. A lipid-lowering drug improving a motor phenotype in a
    lipid-dysregulated animal is consistent with acting through the lipid mechanism, but it is
    also consistent with an off-target or pleiotropic effect - statins have several.

    The translational gap on top of that is the ordinary one for zebrafish HSP models, and
    it is not small: a larval touch-evoked escape response is a developmental behavioural
    assay, while the human disease is progressive adult corticospinal degeneration. A drug
    that improves larval branching has not been shown to slow degeneration in anything.

    This is recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because the issue is
    the standing of model evidence for a human inference, not an absence of evidence.
  proposed_experiments:
  - experiment_id: exp_spg89_statin_lipid_readout
    name: Lipid droplet burden as a statin readout in AMFR-null cells
    description: >-
      Treat AMFR-null patient fibroblasts and neural stem cells with statins and measure lipid
      droplet burden directly, closing the gap between the drug and the mechanism it is
      proposed to act on.
    would_support:
    - treatments#Statins (preclinical only)
    supporting_outcome:
    - >-
      Statin treatment reduces lipid droplet accumulation in AMFR-null patient cells,
      establishing that the drug acts on the named mechanism and strengthening the case for a
      patient trial.
    refuting_outcome:
    - >-
      Lipid droplet burden is unchanged while motor rescue persists in the fish, indicating the
      zebrafish benefit is mechanistically unexplained and the precision-medicine framing is
      not yet earned.

      label: AMFR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: VARIANT
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  molecular_functions:
  - preferred_term: ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
  locations:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum

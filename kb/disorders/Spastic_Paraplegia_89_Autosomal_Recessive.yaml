progression:
- phase: Onset
  age_range: under 3 years
  notes: >-
    Disease onset was under three years in every individual for whom it was recorded (19/19),
    typically presenting as developmental delay that progresses into lower limb spasticity.
    This is the single best-measured feature of the disorder and it places SPG89 firmly among
    the childhood-onset HSPs.
  evidence:
  - reference: PMID:37119330
    reference_title: "AMFR dysfunction causes autosomal recessive spastic paraplegia in human that is amenable to statin treatment in a preclinical model."
    supports: SUPPORT

    evidence:
    - reference: ORPHA:892
      reference_title: "Von Hippel-Lindau disease"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0030393 | Endolymphatic sac tumor | Occasional (29-5%)"
      explanation: Orphanet lists endolymphatic sac tumor as an occasional VHL phenotype.
  evidence:
  - reference: PMID:19671042
    reference_title: "The VHL tumor suppressor: master regulator of HIF."
    supports: SUPPORT
    snippet: "Mutations in pVHL can be found in familial and sporadic hemangioblastomas, clear cell carcinomas of the kidney, pheochromocytomas and inherited forms of erythrocytosis, illustrating the importance of disrupted molecular oxygen sensing in the pathogenesis of these diseases."
    explanation: Documents the characteristic tumor spectrum of VHL disease and links it to disrupted oxygen sensing.
  - reference: PMID:15162797
    reference_title: "von Hippel-Lindau tumor suppressor: not only HIF's executioner."
    supports: SUPPORT
    snippet: "Loss of von Hippel-Lindau (VHL) protein function results in an autosomal-dominant cancer syndrome known as VHL disease, which manifests as angiomas of the retina, hemangioblastomas of the central nervous system, renal clear-cell carcinomas and pheochromocytomas."
    explanation: Confirms the characteristic tumor spectrum associated with VHL protein loss.
- name: HIF-Independent pVHL Function Loss
  biological_scale: MOLECULAR
  description: >-
    pVHL has activities beyond HIF-alpha ubiquitylation, including fibronectin
    and extracellular matrix assembly, primary cilium maintenance, and
    regulation of JAK/STAT signalling through SOCS proteins. Loss of these
    activities is a separate arm of VHL pathogenesis from pseudohypoxia. The
    evidence that it matters clinically comes from the genotype-phenotype
    boundary: the alleles that produce pheochromocytoma without hemangioblastoma
    or renal carcinoma (type 2C) still ubiquitylate HIF-alpha normally and still
    bind pVHL partners normally, so something other than HIF dysregulation must
    be driving chromaffin-cell transformation in those families. Which pVHL
    activity that is has not been established.
  downstream:
  - target: Pheochromocytoma
    description: >-
      The arm of VHL pathogenesis that type 2C alleles implicate in adrenal and
      extra-adrenal chromaffin tumors.
  evidence:
  - reference: PMID:11331613
    reference_title: "Contrasting effects on HIF-1alpha regulation by disease-causing pVHL mutations correlate with patterns of tumourigenesis in von Hippel-Lindau disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations associated with the PHE-only phenotype (type 2C) promoted HIF-alpha ubiquitylation in vitro and demonstrated wild-type binding patterns with pVHL interacting proteins, suggesting that loss of other pVHL functions are necessary for PHE susceptibility."
    explanation: >-
      A survey of 13 naturally occurring VHL mutations spanning the clinical
      subclasses found that the pheochromocytoma-only alleles retain, rather than
      lose, HIF-alpha regulation. That dissociation is the direct evidence for a
      HIF-independent arm.
- name: Chromatin Remodeler Co-Driver Loss
  biological_scale: MOLECULAR
  description: >-
    PBRM1, BAP1 and SETD2 sit near VHL on chromosome 3p, so the loss of
    heterozygosity that supplies the somatic second hit typically removes them
    along with VHL. Their inactivation is a cooperating event in clear cell renal
    carcinoma rather than a consequence of pseudohypoxia, and which modifier is
    hit tracks with tumor behaviour: BAP1 loss with high-grade, sarcomatoid,
    poor-survival disease and PBRM1 loss with a more indolent course. This is a
    somatic co-driver layer observed mainly in sporadic clear cell renal
    carcinoma cohorts; inherited VHL-associated tumors carry fewer alterations
    overall, so the extent to which the same requirement holds in VHL disease is
    not settled.
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  downstream:
  - target: Clear Cell Renal Cell Carcinoma
    description: >-
      Chromatin-modifier co-deletion accompanies VHL loss in most clear cell
      renal carcinomas and stratifies their grade and prognosis.
  evidence:
  - reference: PMID:39965361
    reference_title: "The genomic landscape of metastatic clear-cell renal cell carcinoma and its prognostic value: a comprehensive analysis of a large real-world clinico-genomic database."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The top 10 mutated genes were VHL (73.9%), PBRM1 (42.4%), SETD2 (25.3%), CDKN2A (20.0%), BAP1 (16.4%), CDKN2B (16.0%), KDM5C (14.5%), TP53 (12.9%), PTEN (11.7%), and TERT (9.2%)."
    explanation: >-
      Quantifies the co-occurrence in 858 patients with metastatic clear cell
      renal carcinoma. Establishes that the chromatin modifiers are mutated
      alongside VHL at high frequency; it does not by itself establish that they
      are required.
  - reference: PMID:41915349
    reference_title: "Emerging roles for the epigenetic modifiers PBRM1 SETD2 and BAP1 in clear cell renal cell carcinoma pathogenesis and prognosis beyond VHL."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PBRM1 loss (∼40%), a subunit of the SWI/SNF complex, is linked to a more indolent phenotype and potential sensitivity to antiangiogenic therapy as well as immune checkpoint inhibitor (ICI) resistance. SETD2 mutations (10–15%) cause genomic instability and are associated with aggressive features but may improve the ICI response. BAP1 mutation (10–15%) strongly predicts high-grade tumors, sarcomatoid differentiation, poor survival, and therapy resistance."
    explanation: >-
      Sources the claim that which chromatin modifier is lost defines distinct
      molecular subtypes with different grade, prognosis and therapy response.
phenotypes:
- category: Neoplastic
  name: Clear Cell Renal Cell Carcinoma
  frequency: VERY_FREQUENT
  diagnostic: true
  description: >-
    Clear cell RCC occurs in approximately 70% of VHL patients. Tumors are often
    bilateral and multifocal. Mean age of diagnosis is 39 years, compared to 62
    years for sporadic RCC. Leading cause of mortality in VHL patients.
  phenotype_term:
    preferred_term: Clear cell renal cell carcinoma
    term:
      id: HP:0006770
      label: Clear cell renal cell carcinoma
  evidence:
  - reference: PMID:34818478
    reference_title: "Belzutifan for Renal Cell Carcinoma in von Hippel-Lindau Disease."
    supports: SUPPORT
    snippet: >-
      Patients with von Hippel-Lindau (VHL) disease have a high incidence of renal
      cell carcinoma owing to VHL gene inactivation and constitutive activation of
      the transcription factor hypoxia-inducible factor 2α (HIF-2α).

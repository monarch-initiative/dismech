      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Individuals with VHL disease develop numerous cysts and tumors involving multiple organs including the kidneys, central nervous system, endolymphatic sac, lungs, pancreatobiliary system, adrenal glands, epididymis, and/or broad ligament.
      explanation: This review includes cysts and tumors of the pancreatobiliary system among VHL-associated lesions.
  - target: Endolymphatic sac tumor

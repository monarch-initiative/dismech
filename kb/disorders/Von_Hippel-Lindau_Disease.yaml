discussions:
- discussion_id: vhl_tissue_tropism_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do only retina, CNS, kidney, adrenal medulla, pancreas and endolymphatic
    sac form tumors after biallelic VHL loss, when VHL is expressed and lost in
    every tissue?
  attaches_to:
  - pathophysiology#Tumor Development
  rationale: >-
    This entry's causal chain runs from VHL loss through pseudohypoxia to a
    permissive growth environment and then simply asserts that "different tissues
    show variable susceptibility". That sentence is the gap, not an explanation
    of it. Nothing in the chain predicts which organs are at risk, and the
    somatic second hit is not obviously restricted to those organs, so tissue
    tropism has to come from a cofactor the model does not name. Candidates that
    have been raised include lineage-restricted enhancer accessibility at
    HIF-2alpha target loci, a developmentally arrested precursor population that
    persists only at certain sites, and tissue-specific tolerance thresholds for
    HIF-2alpha output. Resolving it matters clinically because surveillance
    protocols are currently organ lists derived from observed incidence rather
    than from mechanism.
  proposed_experiments:
  - experiment_id: vhl_single_cell_susceptible_vs_resistant_tissue
    name: Single-cell multi-omic comparison of VHL-susceptible and VHL-resistant tissues
    description: >-
      Paired single-cell RNA-seq and ATAC-seq on tissues that do and do not form
      VHL tumors (kidney proximal tubule, retinal progenitors, cerebellar
      molecular layer, adrenal medulla versus hepatocytes and skin fibroblasts),
      from VHL patients and controls, stratified by VHL genotype class.
    would_support:
    - pathophysiology#Tumor Development
    supporting_outcome:
    - >-
        Susceptible tissues show open, HIF-2alpha-responsive enhancer landscapes
        and higher HIF-2alpha target expression per unit of HIF-2alpha protein than
        resistant tissues do, identifying a chromatin-level cofactor that
        co-segregates with the observed organ list.
    refuting_outcome:
    - >-
        Enhancer accessibility and HIF-2alpha target output are comparable in
        susceptible and resistant tissues, which would move the explanation away
        from transcriptional competence toward cell-of-origin availability or
        differential rates of the somatic second hit.
- discussion_id: vhl_type2c_hif_independent_effector_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which pVHL activity, other than HIF-alpha ubiquitylation, is lost in type 2C
    mutants and drives chromaffin cell transformation?
  attaches_to:
  - pathophysiology#HIF-Independent pVHL Function Loss
  - has_subtypes#VHL Type 2C
  rationale: >-
    The dissociation is established: pheochromocytoma-only alleles ubiquitylate
    HIF-alpha normally and bind pVHL partners normally, yet still cause disease.
    What is missing is the effector. Fibronectin and extracellular matrix
    assembly, primary cilium maintenance, apoptosis and senescence control, and
    SOCS-mediated JAK regulation have all been proposed as HIF-independent pVHL
    functions, but no cited study isolates one of them as the type 2C lesion.
    Until that is settled, the pheochromocytoma arm of this entry rests on a node
    defined by what it is not. A quantitative interactome comparison of wild-type
    against type 1, type 2B and type 2C pVHL in chromaffin-lineage cells is the
    obvious discriminating experiment, followed by knockout of any partner lost
    selectively by type 2C mutants.
  evidence:
  - reference: PMID:11331613
    reference_title: "Contrasting effects on HIF-1alpha regulation by disease-causing pVHL mutations correlate with patterns of tumourigenesis in von Hippel-Lindau disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations associated with the PHE-only phenotype (type 2C) promoted HIF-alpha ubiquitylation in vitro and demonstrated wild-type binding patterns with pVHL interacting proteins, suggesting that loss of other pVHL functions are necessary for PHE susceptibility."
    explanation: >-
      Establishes the dissociation that creates the gap, and shows that the type
      2C alleles were not distinguishable from wild type on the interactor panel
      tested, so the responsible partner was not among them.
- discussion_id: vhl_mouse_models_miss_human_tumor_spectrum
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Conditional Vhl knockout mice reproduce HIF-driven vascular lesions but not
    retinal or cerebellar hemangioblastoma or clear cell renal carcinoma, so how
    much of the mechanism inferred from those models transfers to human VHL
    disease?
  attaches_to:
  - pathophysiology#Tumor Development
  - phenotypes#Retinal Hemangioblastoma
  rationale: >-
    Much of what is asserted about tumor initiation downstream of VHL loss comes
    from mouse conditional knockouts, and those models do not develop the human
    disease's defining lesions. No published model develops retinal
    hemangioblastoma, which is the most common clinical manifestation in
    patients. The mouse lesions that do appear are largely hepatic hemangiomas,
    a site VHL patients rarely present with. So the model system that supplies
    the mechanistic detail is not the model system that reproduces the disease,
    and mechanisms read off those mice describe what losing Vhl can do in mouse
    tissue rather than what is happening in a patient's retina or kidney. This
    sits directly underneath the tissue-tropism gap above: whatever explains why
    only some human organs are susceptible may also explain why mouse organs are
    susceptible in a different pattern.
  evidence:
  - reference: PMID:22763871
    reference_title: "Von Hippel-Lindau disease (VHL): a need for a murine model with retinal hemangioblastoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These models, despite advancing our understanding the molecular role of VHL, are by and large unable to recapitulate the more common features of human VHL disease. Up to date, no model exists that develop retinal hemangioblastomas, the most common clinical manifestation."
    explanation: >-
      A review of fifteen years of Vhl-inactivation models stating that they do
      not reproduce the common human manifestations, and that no model develops
      retinal hemangioblastoma.
- discussion_id: vhl_belzutifan_response_determinants
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What molecular features determine why belzutifan clears every evaluable
    retinal hemangioblastoma but produces an objective response in roughly a
    quarter of advanced pheochromocytomas and paragangliomas?
  attaches_to:
  - treatments#Belzutifan
  rationale: >-
    The spread in response rate across tumor types is large enough that it is
    unlikely to be tissue accessibility alone, and it is the practical question
    for anyone deciding whether to offer belzutifan instead of surgery for a
    given lesion. Two determinants of resistance are established, both at the
    level of HIF-2alpha itself: an acquired gatekeeper substitution in the
    drug-binding pocket, and a SOCS3/JAK1/STAT3 enhancer circuit that raises
    EPAS1 transcription and so can outrun a drug that acts on the protein. What
    is not established is whether either predicts response prospectively, or
    whether the cross-tissue gradient instead tracks HIF-2alpha dependency,
    14q/HIF1A status, or chromatin-modifier genotype. Pre-treatment biopsy
    profiling across tumor types and VHL genotype classes, correlated with
    response, is the study that would settle it.
  evidence:
  - reference: PMID:31727677
    reference_title: "HIF-2 Complex Dissociation, Target Inhibition, and Acquired Resistance with PT2385, a First-in-Class HIF-2 Inhibitor, in Patients with Clear Cell Renal Cell Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prolonged PT2385 treatment resulted in the acquisition of resistance, and we identified a gatekeeper mutation (G323E) in HIF2α, which interferes with drug binding and precluded HIF-2 complex dissociation."
    explanation: >-
      One established resistance route, at the drug-binding pocket itself, found
      in patients on prolonged HIF-2 inhibitor therapy.
  - reference: PMID:41874563
    reference_title: "Genome-wide CRISPR screen identifies a cytokine-enhancer circuit driving HIF-2α activation in renal cancer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a genome-wide CRISPR screen in von Hippel-Lindau-deficient (VHL-deficient) ccRCC cells, we identified SOCS3 as a key negative regulator of HIF-2α."
    explanation: >-
      A second, transcriptional route to sustained HIF-2alpha that acts upstream
      of the protein the drug binds. Cell-line and xenograft work in
      VHL-deficient clear cell renal carcinoma; not yet tested in patients
      progressing on belzutifan.

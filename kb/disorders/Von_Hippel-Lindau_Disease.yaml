      reference_title: "Von Hippel-Lindau disease"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "HP:0009711 | Retinal capillary hemangioma | Frequent (79-30%)"
      explanation: Orphanet lists retinal capillary hemangioma as a frequent VHL phenotype.
  - target: Pheochromocytoma

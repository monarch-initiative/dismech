diagnosis:
- name: Plasma monochloroacetate confirmation
  description: >-
    Diagnosis is largely circumstantial — exposure history, the corrosive burn,
    and the metabolic picture (lactic acidosis, hypoglycemia, organ-injury
    enzymes). Confirmation is a plasma monochloroacetic acid concentration, which
    documents systemic absorption after a dermal splash.
  diagnosis_term:
    preferred_term: plasma monochloroacetate measurement
    term:
      id: NCIT:C217390
      label: Diagnostic Blood Testing
  notes: >-
    No LOINC code is bound on this diagnosis row. A Monarch KG search
    (monochloroacetate) returns only specimen-specific codes - LOINC:54945-1
    Monochloroacetate [Mass/volume] in Urine and LOINC:38654-0 Chloroacetate
    [Mass/volume] in Air - and no plasma or serum monochloroacetate code, which
    is the specimen the cited confirmatory level was measured in. A
    specimen-specific code is not bound for a test's identity (CLAUDE.md), so the
    plasma-confirmation measurement is carried in preferred_term rather than a
    measurements[] code.
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 4 h post exposure plasma monochloroacetic acid concentration was 33 mg/L confirming skin absorption."
    explanation: A measured plasma monochloroacetic acid concentration confirms systemic absorption and the diagnosis.
prevalence:
- population: Worldwide (occupational and accidental exposures)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Systemic monochloroacetate poisoning is a sporadic accidental or
    occupational event with no true population prevalence or incidence. The human
    literature is dominated by individual case reports, several of them fatal
    (including the fatal dermal and oral cases cited in this entry). Poisoning
    incidents are becoming more common with industrial use, though the
    systemically poisoned cases that reach the literature remain few, which is
    why the magnitude is encoded as cases-in-literature rather than a rate.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "more than 100 cases reported in the past ten years in China alone"
    explanation: Indicates the growing but still small reported case load of monochloroacetic acid poisoning.
progression:
- phase: Corrosive contact injury
  duration: immediate, at the moment of skin or mucosal contact
  notes: >-
    The strong acid burns on contact; local burn symptoms appear at once and
    worsen over the following minutes to hours.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "he suffered local burn symptoms, which gradually worsened"
    explanation: Describes the immediate corrosive burn that opens the clinical course.
- phase: Latent interval
  duration: roughly one to three and a half hours after exposure
  notes: >-
    A seemingly survivable interval separates the burn from systemic collapse,
    during which absorbed monochloroacetic acid loads systemically before the
    signs of systemic poisoning appear.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the clinical signs of systemic poisoning generally developed at one to three and a half hours after the exposure"
    explanation: Gives the latent interval between exposure and systemic signs across the reported cases.
- phase: Systemic poisoning onset
  notes: >-
    Systemic poisoning declares itself with lethargy and dyspnoea and the
    metabolic crisis of hypoglycemia and lactic acidosis.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two and a half hours after the accident, he developed symptoms of systemic poisoning, such as lethargy and dyspnoea."
    explanation: Marks the onset of systemic poisoning after the latent interval in the reported case.
- phase: Multi-organ failure
  notes: >-
    In severe poisoning, bioenergetic failure produces refractory metabolic
    acidosis, rhabdomyolysis, acute kidney injury, and cerebral edema, which may
    progress to death.
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He later developed severe metabolic acidosis, rhabdomyolysis, renal insufficiency and cerebral edema, and died due to uncal herniation on d 8."
    explanation: Describes the terminal multi-organ-failure phase in a fatal case.
environmental:
- name: Dermal exposure to monochloroacetic acid
  exposure_term:
    preferred_term: exposure to chloroacetic acid
    term:
      id: ECTO:0001659
      label: exposure to chloroacetic acid
  description: >-
    Skin contact with concentrated monochloroacetic acid, usually an occupational
    or accidental splash, is the most dangerous and most common route of systemic
    poisoning because the acid is absorbed rapidly and extensively across skin.
    Contamination of a modest body-surface area can deliver a lethal systemic
    dose.
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 38 year-old man who was splashed with an 80% monochloroacetic acid solution on 25-30% of his body surface."
    explanation: Documents a fatal systemic poisoning by the dermal route after a concentrated-acid splash.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Contamination of more than 5 % of the skin can cause poisoning and even death"
    explanation: Supports the claim that contamination of only a modest body-surface area can be lethal.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "transdermal absorption is the main cause of acute poisoning"
    explanation: Supports dermal absorption being the most important route of systemic poisoning.
  influences_mechanisms:
  - target: Systemic absorption of monochloroacetic acid
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Dermal contact loads monochloroacetic acid systemically; percutaneous
      absorption establishes the body burden that drives the poisoning.
    evidence:
    - reference: PMID:1433433
      reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 4 h post exposure plasma monochloroacetic acid concentration was 33 mg/L confirming skin absorption."
      explanation: Confirms that dermal exposure translates into a measurable systemic monochloroacetate burden.
- name: Oral or inhalational exposure to monochloroacetic acid
  exposure_term:
    preferred_term: exposure to chloroacetic acid
    term:
      id: ECTO:0001659
      label: exposure to chloroacetic acid
  description: >-
    Swallowing or inhaling monochloroacetic acid, less common than dermal
    contact, also produces systemic intoxication by the same mechanism; a fatal
    oral-route poisoning is documented.
  evidence:
  - reference: PMID:7572862
    reference_title: "Accidental fatal monochloroacetic acid poisoning."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although lethal skin exposures have been previously reported, this case appears to be the first instance of oral-route poisoning to be documented."
    explanation: Documents a fatal oral-route monochloroacetic acid poisoning.
  influences_mechanisms:
  - target: Systemic absorption of monochloroacetic acid
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Oral or inhalational exposure delivers monochloroacetic acid to the
      systemic circulation, establishing the same body burden as dermal contact.
    evidence:
    - reference: PMID:32975103
      reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inhalation or skin contact with monochloroacetic acid may damage the heart, lungs, liver, kidneys, and central nervous system within hours after poisoning"
      explanation: Confirms inhalation and skin contact as routes to systemic multi-organ injury.
treatments:
- name: Skin and eye decontamination
  description: >-
    Immediate removal of contaminated clothing and copious irrigation, with
    dilute (4%) sodium bicarbonate followed by saline, to limit ongoing
    percutaneous absorption. Because absorption continues after surface
    decontamination, it reduces but does not abolish the systemic dose.
  treatment_term:
    preferred_term: skin decontamination
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  notes: >-
    Bound to NCIT:C49236 Therapeutic Procedure with the specificity carried in
    preferred_term. NCIT:C68769 Decontamination is the obvious term, but it is
    not reachable from NCIT:C25218 Clinical Intervention or Procedure, so it
    cannot be the term of a TreatmentTerm - the same compromise recorded in the
    Sulfur_Mustard_Poisoning and Ricin_Poisoning entries.
  target_mechanisms:
  - target: Systemic absorption of monochloroacetic acid
    description: Decontamination limits the percutaneous dose that drives systemic poisoning.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the contaminated clothing should be quickly removed and the skin wiped with clean gauze, rinsed with a 4 % solution of sodium bicarbonate, and then with saline"
    explanation: Describes the recommended decontamination procedure.
- name: Supportive and intensive care
  description: >-
    There is no widely licensed specific antidote. Management is supportive:
    correction of the metabolic acidosis, correction of hypoglycemia with
    intravenous glucose, hemodynamic support for shock, respiratory support, and
    continuous renal replacement therapy both to support the kidneys and to
    enhance removal of the acid from the circulation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Lactate and pyruvate accumulation
    description: Buffering and extracorporeal support counter the lactic/metabolic acidosis of bioenergetic failure.
  - target: Impaired hepatic gluconeogenesis
    description: Intravenous glucose corrects the hypoglycemia produced by the gluconeogenic block.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "treatment should also include continuous renal replacement therapy, glucocorticoid administration, correction of acidosis, and shock prevention."
    explanation: Describes the supportive-care bundle for systemic poisoning.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "bedside continuous veno-venous haemofiltration (CVVH) was applied every other day to rapidly remove acid from the circulation and prevent acute renal failure."
    explanation: Continuous veno-venous hemofiltration both removes the acid and supports the kidneys.
- name: Burn wound surgical care
  description: >-
    The corrosive burn is managed with thorough debridement and, for deep wounds,
    delayed skin grafting; the delay also allows residual monochloroacetic acid
    in the tissue to be diluted and eliminated.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical debridement and skin grafting
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  notes: >-
    Bound to the broad NCIT:C15329 Surgical Procedure because this treatment
    bundles debridement, escharotomy, and delayed skin grafting. NCIT:C51682
    Debridement is a more specific and validated term for the debridement
    component alone; it is not used here so the single binding covers the whole
    surgical bundle.
  target_mechanisms:
  - target: Corrosive chemical injury at the contact site
    description: Debridement and grafting treat the corrosive contact burn.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After a thorough debridement of the wound surface and subsequent skin grafting combined with early glucocorticoid therapy and haemofiltration, a satisfactory result was achieved, and the patient eventually recovered."
    explanation: Debridement plus skin grafting (with supportive care) achieved recovery of the burn survivor.
- name: Dichloroacetate (candidate antidote)
  description: >-
    Dichloroacetate is the most disease-specific pharmacologic agent reported: it
    acts directly on the affected enzymatic system and reduces the lactic
    acidosis of monochloroacetate poisoning. It is a candidate and
    regionally-approved antidote rather than an established standard of care —
    approved in Sweden for life-threatening monochloroacetate poisoning and, at
    the time of the cited report, at the clinical-trial stage in the United
    States — with efficacy demonstrated in animal experiments rather than
    controlled human trials.
  notes: >-
    The source states only that dichloroacetate acts on the affected enzymatic
    system and reduces lactic acidosis. Its textbook pyruvate-dehydrogenase
    activation is a proposed, and in this setting disputed, mechanism that no
    node or evidence in this entry establishes, so it is not asserted here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dichloroacetate
      term:
        id: CHEBI:28240
        label: dichloroacetate
  target_mechanisms:
  - target: Lactate and pyruvate accumulation
    description: Dichloroacetate acts on the affected enzymatic system and reduces lactate accumulation.
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "The results of animal experiments demonstrated that dichloroacetic acid is the most effective drug against monochloroacetic acid poisoning"
    explanation: Animal experiments, summarised in this case report, found dichloroacetate the most effective agent against monochloroacetate poisoning.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "as it acts directly on the affected enzymatic system"
    explanation: States the mechanism attributed to dichloroacetate - action on the affected enzymatic system - that this entry asserts in place of a specific pyruvate-dehydrogenase claim.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "dichloroacetic acid can reduce or eliminate the effects of lactic acid poisoning"
    explanation: Supports dichloroacetate reducing the lactic acidosis that is its target mechanism here.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "In Sweden it has already been approved as an antidote for life-threatening monochloroacetic acid poisoning, and in the US this indication is at the clinical trial stage."
    explanation: Records the regional regulatory status of dichloroacetate as an antidote.
animal_models:
- name: Rat subcutaneous monochloroacetate model (lung injury and hypoglycemia)
  species: Rat
  genotype: wild-type rat, subcutaneous monochloroacetate (108-163 mg/kg)
  publication: PMID:16898262
  description: >-
    Subcutaneous monochloroacetate in rats produces dose-dependent alveolar
    injury and delayed severe hypoglycemia, identifying lung injury and
    hypoglycemia as proximate causes of death.
  modeled_mechanisms:
  - target: Acute lung injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Dose-dependent alveolar injury after subcutaneous monochloroacetate.
    limitations: >-
      Subcutaneous dosing bypasses the transdermal absorption and corrosive skin
      burn that dominate human exposure, so the model informs the systemic injury
      but not the cutaneous route.
    readouts:
    - name: Bronchoalveolar lavage LDH and total cell count
      target: Acute lung injury
      direction: INCREASED
      interpretation: Rising lavage LDH and cell counts mark alveolar injury.
      evidence:
      - reference: PMID:16898262
        reference_title: "Lethal acute lung injury and hypoglycemia after subcutaneous administration of monochloroacetic acid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "lactate dehydrogenase (LDH) and total cells in BALF were dose-dependently increased"
        explanation: Dose-dependent alveolar injury markers in bronchoalveolar lavage.
    evidence:
    - reference: PMID:16898262
      reference_title: "Lethal acute lung injury and hypoglycemia after subcutaneous administration of monochloroacetic acid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, hypoglycemia and lung injury appear to cause death in response to MCA exposure."
      explanation: Supports treating the rat lung-injury finding as informative for the acute lung injury node.
  - target: Hypoglycemia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Delayed severe hypoglycemia after subcutaneous monochloroacetate.
    limitations: Subcutaneous dosing bypasses the transdermal absorption route of human exposure.
    readouts:
    - name: Serum glucose
      target: Hypoglycemia
      direction: DECREASED
      interpretation: Severe hypoglycemia identified at 4 hours.
      evidence:
      - reference: PMID:16898262
        reference_title: "Lethal acute lung injury and hypoglycemia after subcutaneous administration of monochloroacetic acid."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "severe hypoglycemia was identified 4 h after administration."
        explanation: Delayed-onset severe hypoglycemia in the model.
    evidence:
    - reference: PMID:16898262
      reference_title: "Lethal acute lung injury and hypoglycemia after subcutaneous administration of monochloroacetic acid."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, hypoglycemia and lung injury appear to cause death in response to MCA exposure."
      explanation: Supports treating the rat hypoglycemia finding as informative for the hypoglycemia phenotype.
- name: Rat subcutaneous monochloroacetate model (hepatic injury and lactic acidosis)
  species: Rat
  genotype: wild-type fasting rat, subcutaneous monochloroacetate (LD90 ~162 mg/kg)
  publication: PMID:21432300
  description: >-
    Subcutaneous monochloroacetate in fasting rats causes hepatocellular
    mitochondrial injury, decreased gluconeogenesis, hypoglycemia, and marked
    lactate and pyruvate accumulation before clinical symptoms appear.
  modeled_mechanisms:
  - target: Lactate and pyruvate accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: Marked lactate and pyruvate elevation after subcutaneous monochloroacetate.
    limitations: Subcutaneous dosing bypasses the transdermal absorption route of human exposure.
    readouts:
    - name: Blood lactate and pyruvate
      target: Lactate and pyruvate accumulation
      direction: INCREASED
      interpretation: Large rises in lactate and pyruvate drive the metabolic acidosis.
      evidence:
      - reference: PMID:21432300
        reference_title: "Hepatic injury and gluconeogenesis after subcutaneous injection of monochloroacetic acid in rats."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lactate was 6-fold higher and pyruvate was 13-fold higher than in the controls."
        explanation: Quantifies the lactate and pyruvate accumulation in the model.
    evidence:
    - reference: PMID:21432300
      reference_title: "Hepatic injury and gluconeogenesis after subcutaneous injection of monochloroacetic acid in rats."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Hepatocellular mitochondrial injury decreased gluconeogenesis and caused hypoglycemia and extremely high levels of lactate and pyruvate."
      explanation: Links hepatocellular mitochondrial injury to the metabolic derangements modelled.

pathophysiology:
- name: Systemic absorption of monochloroacetic acid
  biological_scale: ORGANISM
  description: >-
    Monochloroacetic acid is rapidly absorbed after dermal contact, ingestion, or
    inhalation and distributes systemically. Dermal absorption is the most
    important route: percutaneous uptake across apparently intact skin is rapid
    and extensive, and a plasma concentration measurable hours after a splash
    confirms transdermal loading.
  chemical_entities:
  - preferred_term: chloroacetic acid
    modifier: INCREASED
    term:
      id: CHEBI:27869
      label: chloroacetic acid
  downstream:
  - target: Corrosive chemical injury at the contact site
    description: Concentrated acid injures the tissue it contacts.
  - target: Alkylation of thiol-dependent metabolic enzymes
    description: Absorbed monochloroacetate reacts with intracellular enzyme thiols.
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 4 h post exposure plasma monochloroacetic acid concentration was 33 mg/L confirming skin absorption."
    explanation: A measurable plasma level hours after a dermal splash confirms rapid transcutaneous systemic absorption.
- name: Corrosive chemical injury at the contact site
  biological_scale: TISSUE
  description: >-
    As a strong acid, monochloroacetic acid causes an immediate corrosive
    (first- to third-degree) chemical burn of the skin or mucosa it contacts,
    distinct from and preceding the systemic metabolic poisoning.
  downstream:
  - target: Skin burn
  evidence:
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient, a 45-year-old male chemical factory worker, was burned by monochloroacetic acid discharged from a ruptured pipe."
    explanation: Documents the corrosive contact burn from occupational monochloroacetic acid exposure.
- name: Alkylation of thiol-dependent metabolic enzymes
  biological_scale: MOLECULAR
  description: >-
    Monochloroacetate is a reactive alkylating electrophile that carboxymethylates
    sulfhydryl (-SH) groups on metabolic enzymes, inactivating thiol-dependent
    catalysis and thereby disrupting oxidative energy metabolism in exposed
    tissues.
  downstream:
  - target: Inactivation of glyceraldehyde-3-phosphate dehydrogenase
    description: Thiol alkylation inactivates the catalytic cysteine of GAPDH.
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "monochloroacetic acid probably blocks the tricarboxylic acid cycle (Kreb's cycle) and may also react with sulfhydryl groups in enzymes, causing severe tissue damage in energy-rich organs."
    explanation: The case authors infer sulfhydryl-group reaction and energy-metabolism blockade as the mechanism of systemic injury; cited as the mechanistic interpretation, hence indirect.
- name: Inactivation of glyceraldehyde-3-phosphate dehydrogenase
  biological_scale: MOLECULAR
  description: >-
    The specific metabolic lesion is inactivation of glyceraldehyde-3-phosphate
    dehydrogenase (GAPDH), a thiol-dependent glycolytic/gluconeogenic enzyme.
    GAPDH activity in the liver of monochloroacetate-exposed rats fell to about a
    fifth of control, while neighbouring glycolytic enzymes were spared.
  notes: >-
    An older hypothesis held that monochloroacetate enters the citric acid cycle
    and inhibits mitochondrial aconitase. That hypothesis was tested and refuted
    by Sakai et al. 2005 (PMID:15720133): citrate and 2-oxoglutarate fell in
    parallel (inconsistent with aconitase blockade), and GAPDH was identified as
    the inactivated enzyme. The entry therefore records GAPDH, not aconitase, as
    the target.
  molecular_functions:
  - preferred_term: glyceraldehyde-3-phosphate dehydrogenase activity
    modifier: DECREASED
    term:
      id: GO:0004365
      label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
  downstream:
  - target: Impaired hepatic gluconeogenesis
  - target: Cellular ATP depletion and bioenergetic failure
  evidence:
  - reference: PMID:15720133
    reference_title: "Monochloroacetic acid inhibits liver gluconeogenesis by inactivating glyceraldehyde-3-phosphate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We concluded that MCA inactivates GAPDH, and this is the cause of the inhibition of liver gluconeogenesis."
    explanation: Identifies GAPDH inactivation as the mechanism by which monochloroacetate blocks gluconeogenesis.
  - reference: PMID:15720133
    reference_title: "Monochloroacetic acid inhibits liver gluconeogenesis by inactivating glyceraldehyde-3-phosphate dehydrogenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The finding that the levels of citrate and 2-OG were similarly reduced (to 31 and 36% of control, respectively) indicates that aconitase was not inhibited by MCA."
    explanation: Refutes the older aconitase hypothesis, supporting GAPDH rather than aconitase as the target.
- name: Impaired hepatic gluconeogenesis
  biological_scale: CELLULAR
  description: >-
    With GAPDH inactivated, hepatic gluconeogenesis (and glycolysis) cannot
    proceed, so the liver fails to maintain blood glucose, producing severe
    hypoglycemia.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: gluconeogenesis
    modifier: DECREASED
    term:
      id: GO:0006094
      label: gluconeogenesis
  downstream:
  - target: Hypoglycemia
  evidence:
  - reference: PMID:15720133
    reference_title: "Monochloroacetic acid inhibits liver gluconeogenesis by inactivating glyceraldehyde-3-phosphate dehydrogenase."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "We previously reported that a lethal dose of monochloroacetate (MCA) causes severe hypoglycemia and lactic acidosis."
    explanation: Links the gluconeogenic block to the characteristic severe hypoglycemia and lactic acidosis; the sentence recaps the authors' earlier whole-animal lethal-dose experiment.
- name: Cellular ATP depletion and bioenergetic failure
  biological_scale: CELLULAR
  description: >-
    Blockade of glycolysis and the downstream oxidative pathways starves cells of
    ATP. Energy-dependent ion pumps and membrane integrity fail, and tissues with
    the highest aerobic demand are injured first.
  biological_processes:
  - preferred_term: ATP metabolic process
    modifier: DECREASED
    term:
      id: GO:0046034
      label: ATP metabolic process
  downstream:
  - target: Lactate and pyruvate accumulation
  - target: Myocardial bioenergetic injury
  - target: Central nervous system injury and cerebral edema
  - target: Acute tubular injury
  - target: Skeletal muscle injury
  - target: Acute lung injury
  - target: Hepatocellular mitochondrial injury
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "causing severe tissue damage in energy-rich organs."
    explanation: Attributes the systemic injury to energy-metabolism failure in high-demand organs.
- name: Lactate and pyruvate accumulation
  biological_scale: CELLULAR
  description: >-
    Pyruvate that cannot be oxidised is reduced to lactate, and both lactate and
    pyruvate accumulate markedly; the systemic result is a severe high-anion-gap
    metabolic (lactic) acidosis.
  downstream:
  - target: Metabolic acidosis
  evidence:
  - reference: PMID:21432300
    reference_title: "Hepatic injury and gluconeogenesis after subcutaneous injection of monochloroacetic acid in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lactate was 6-fold higher and pyruvate was 13-fold higher than in the controls."
    explanation: Quantifies the lactate and pyruvate accumulation that drives the metabolic acidosis.
  - reference: PMID:10773845
    reference_title: "Sodium monochloroacetate causes cytotoxic effects, an increased lactate and pyruvate level and induces ultra structural and cytoskeletal alterations in cultured kidney and liver epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The decrease in cell viability was accompanied by an increase of lactate and pyruvate concentrations released into the culture medium."
    explanation: Shows monochloroacetate-exposed cells release excess lactate and pyruvate as viability falls.
- name: Myocardial bioenergetic injury
  biological_scale: TISSUE
  description: >-
    Cardiac muscle, which depends almost entirely on aerobic metabolism, loses
    contractile function as ATP falls, producing myocardial depression and
    cardiogenic shock.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  downstream:
  - target: Impaired myocardial contractility
  - target: Shock
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "features of systemic poisoning occurred within a few hours including disorientation, agitation, cardiac failure and coma."
    explanation: Documents cardiac failure as part of the systemic poisoning syndrome.
- name: Central nervous system injury and cerebral edema
  biological_scale: TISSUE
  description: >-
    Energy failure in the brain produces an early excitable phase (disorientation,
    agitation, convulsions) followed by depression of consciousness, coma, and
    cytotoxic cerebral edema that can progress to fatal herniation.
  downstream:
  - target: Delirium
  - target: Lethargy
  - target: Seizure
  - target: Coma
  - target: Cerebral edema
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He later developed severe metabolic acidosis, rhabdomyolysis, renal insufficiency and cerebral edema, and died due to uncal herniation on d 8."
    explanation: Documents cerebral edema progressing to fatal herniation.
  - reference: PMID:32975103
    reference_title: "Skin burns from monochloroacetic acid leak in a chemical plant: a case report."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe, life-threatening consequences of exposure to monochloroacetic acid include convulsions, coma, shock, kidney failure, and severe acidosis."
    explanation: Lists convulsions and coma among the life-threatening neurological consequences.
- name: Acute tubular injury
  biological_scale: TISSUE
  description: >-
    Bioenergetic failure, acidosis, and pigment load from rhabdomyolysis injure
    the renal tubules, producing acute kidney injury. Monochloroacetate is known
    to accumulate in the kidney.
  cell_types:
  - preferred_term: epithelial cell of proximal tubule
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  downstream:
  - target: Acute kidney injury
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He later developed severe metabolic acidosis, rhabdomyolysis, renal insufficiency and cerebral edema, and died due to uncal herniation on d 8."
    explanation: Documents renal insufficiency in fatal systemic poisoning.
  - reference: PMID:10773845
    reference_title: "Sodium monochloroacetate causes cytotoxic effects, an increased lactate and pyruvate level and induces ultra structural and cytoskeletal alterations in cultured kidney and liver epithelial cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "kidney cells exhibited cytoplasmic vacuolization, membraneous disruption and especially mitochondrial alterations."
    explanation: Shows direct monochloroacetate injury to renal tubular epithelial cells.
- name: Skeletal muscle injury
  biological_scale: TISSUE
  description: >-
    Skeletal muscle breaks down as cellular energy fails, releasing muscle
    contents into the circulation (rhabdomyolysis), which further burdens the
    kidney.
  downstream:
  - target: Rhabdomyolysis
  evidence:
  - reference: PMID:1433433
    reference_title: "Fatal systemic poisoning after skin exposure to monochloroacetic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He later developed severe metabolic acidosis, rhabdomyolysis, renal insufficiency and cerebral edema, and died due to uncal herniation on d 8."
    explanation: Documents rhabdomyolysis as a feature of systemic poisoning.
- name: Acute lung injury
  biological_scale: TISSUE
  description: >-
    Monochloroacetate exposure produces dose-dependent alveolar injury;
    experimental work implicates lung injury, alongside hypoglycemia, as a
    proximate cause of death.
  downstream:
  - target: Dyspnea
  - target: Hypoxemia
  evidence:
  - reference: PMID:16898262
    reference_title: "Lethal acute lung injury and hypoglycemia after subcutaneous administration of monochloroacetic acid."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, hypoglycemia and lung injury appear to cause death in response to MCA exposure."
    explanation: Identifies acute lung injury as a proximate cause of death in a rat model.
- name: Hepatocellular mitochondrial injury
  biological_scale: CELLULAR
  description: >-
    Hepatocyte mitochondria are selectively targeted, raising mitochondrial
    aspartate aminotransferase and circulating transaminases and impairing the
    liver's gluconeogenic and metabolic functions.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:
  - target: Elevated circulating hepatic transaminase concentration
  evidence:
  - reference: PMID:21432300
    reference_title: "Hepatic injury and gluconeogenesis after subcutaneous injection of monochloroacetic acid in rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the larger increase in mAST indicated that hepatocellular mitochondria were selectively targeted"
    explanation: Mitochondrial AST elevation indicates selective hepatocellular mitochondrial injury.

discussions:
- discussion_id: gap_ketogenic_diet_unevaluated
  prompt: >-
    Does a ketogenic diet benefit GOT2 deficiency, as it has in MDH2 and AGC1
    deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cytosolic NAD+/NADH Redox Imbalance
  - treatments#
  rationale: >-
    A ketogenic diet bypasses glycolytic NADH production, the load the failed
    shuttle cannot clear, and the founding authors suggested a low-carbohydrate,
    high-fat diet with ketone supplementation for this reason; medium-chain
    triglycerides are proposed on the same rationale, and triheptanoin helped one
    MDH2-deficient patient, but neither has been reported in GOT2 deficiency.
    Pyruvate corrects the redox defect in cells but is expected to raise lactate,
    so it is not considered suitable for patients. The diet has been used, but not
    in a way that can be evaluated. None of the four founding patients received
    it. In the 2025 cohort, F7 had tried it before seizures were controlled only
    once serine and pyridoxine were added, and F1 received it concurrently with
    serine, pyridoxine and anti-seizure medication. The first course is at best a
    non-response and the second is confounded, so the question is unanswered.
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To circumvent glycolytic NADH production, and consequently lactate accumulation in the cytosol, the authors suggested a diet low in carbohydrates, high in fat, and supplementation with ketone bodies."
    explanation: >-
      The proposal, not a result.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In F7, seizure control was achieved only after introducing both serine and pyridoxine, despite prior use of multiple ASMs and a ketogenic diet."
    explanation: >-
      The diet was used in F7 without achieving seizure control, which came only after serine and pyridoxine were added. A single uncontrolled course, not a trial of the diet.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "F1 had a good seizure control after receiving serine, pyridoxine, ketogenic diet, and ASMs concurrently."
    explanation: >-
      The diet was one of four concurrent interventions in F1, so its contribution cannot be separated.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest the use of medium-chain triglycerides as an alternative source of energy because oxidation of these fatty acids only produces NADH in the mitochondria and therefore does not require cytosolic NADH oxidation."
    explanation: >-
      The rationale for a fat-based fuel in GOT2 deficiency, proposed rather than tested.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "None of them was treated with KD."
    explanation: >-
      Scoped to the four founding patients only; later cohort patients F1 and F7
      did receive the diet.

notes: >-
  No GeneReviews chapter names this disease (just check-genereviews). DEE82 is
  curated as a standalone disease rather than as a subtype of a generic genetic
  DEE entry because its mechanism is a malate-aspartate shuttle defect with a
  treatable secondary serine deficiency, not an ion-channel or synaptic lesion.
  The sibling shuttle-defect entry is
  SLC25A12-Related_Developmental_and_Epileptic_Encephalopathy (AGC1 deficiency).

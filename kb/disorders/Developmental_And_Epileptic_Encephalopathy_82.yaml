animal_models:
- name: got2a morphant zebrafish
  species: Zebrafish
  genotype: got2a morpholino knockdown
  publication: PMID:31422819
  description: >-
    Morpholino knockdown of got2a, a zebrafish GOT2 orthologue, produces a brain
    developmental defect with seizure-like EEG spikes. Pyridoxine in embryo water
    rescued the spikes, and pyridoxine with serine synergistically rescued the
    embryonic developmental defects.
  modeled_mechanisms:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces epileptiform activity and its pyridoxine responsiveness.
    limitations: >-
      Transient morpholino knockdown in embryos rather than a stable germline
      allele; the embryonic developmental defect is not a direct counterpart of
      human infantile-onset epilepsy.
    readouts:
    - name: Seizure-like EEG spikes
      target: Neuronal Hyperexcitability and Hypersynchrony
      direction: INCREASED
      interpretation: >-
        Epileptiform activity after got2a knockdown, rescued by pyridoxine.
      evidence:
      - reference: PMID:31422819
        reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Knockdown of got2a in zebrafish resulted in a brain developmental defect associated with seizure-like electroencephalography spikes, which could be rescued by supplying pyridoxine in embryo water."
        explanation: >-
          Reports the EEG readout and its rescue.

discussions:
- discussion_id: gap_ketogenic_diet_untested
  prompt: >-
    Does a ketogenic diet benefit GOT2 deficiency, as it has in MDH2 and AGC1
    deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Cytosolic NAD+/NADH Redox Imbalance
  - treatments#
  rationale: >-
    A ketogenic diet bypasses glycolytic NADH production, the load the failed
    shuttle cannot clear, and the founding authors suggested a low-carbohydrate,
    high-fat diet with ketone supplementation for this reason. Pyruvate corrects
    the redox defect in cells but is expected to raise lactate, so it is not
    considered suitable for patients. None of the four founding patients received
    a ketogenic diet, so there is no clinical observation either way.
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To circumvent glycolytic NADH production, and consequently lactate accumulation in the cytosol, the authors suggested a diet low in carbohydrates, high in fat, and supplementation with ketone bodies."
    explanation: >-
      The proposal, not a result.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "None of them was treated with KD."
    explanation: >-
      Establishes the absence of clinical data.

notes: >-
  No GeneReviews chapter names this disease (just check-genereviews). DEE82 is
  curated as a standalone disease rather than as a subtype of a generic genetic
  DEE entry because its mechanism is a malate-aspartate shuttle defect with a
  treatable secondary serine deficiency, not an ion-channel or synaptic lesion.
  The sibling shuttle-defect entry is
  SLC25A12-Related_Developmental_and_Epileptic_Encephalopathy (AGC1 deficiency).

name: Developmental and Epileptic Encephalopathy 82
creation_date: "2026-09-23T17:00:00Z"
category: Mendelian
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 82
  term:
    id: MONDO:0032880
    label: developmental and epileptic encephalopathy, 82
synonyms:
- DEE82
- EIEE82
- GOT2 deficiency
- epileptic encephalopathy, early infantile, 82
- glutamate oxaloacetate transaminase, mitochondrial, deficiency of
- mitochondrial aspartate aminotransferase deficiency
description: >-
  Developmental and epileptic encephalopathy 82 (DEE82, GOT2 deficiency) is an
  ultra-rare autosomal recessive neurometabolic epilepsy caused by biallelic
  variants in GOT2, which encodes mitochondrial glutamate-oxaloacetate
  transaminase (mitochondrial aspartate aminotransferase). GOT2 converts
  mitochondrial oxaloacetate and glutamate into aspartate and 2-oxoglutarate and
  is one of the six components of the malate-aspartate shuttle, the redox shuttle
  that carries cytosolic reducing equivalents into mitochondria and so keeps the
  cytosolic NAD+/NADH ratio high. Loss of GOT2 activity has two separable
  consequences. The redox arm disturbs cytosolic NAD+-dependent pathways, most
  notably de novo serine synthesis, whose first step is NAD+-dependent, and shifts
  pyruvate toward lactate. The aspartate arm reduces mitochondrial aspartate
  supply, which limits the urea cycle and produces hyperammonaemia and
  hypercitrullinaemia. Affected children present in the first months of life
  with feeding difficulties and developmental impairment, then infantile-onset
  epilepsy, progressive microcephaly, hypotonia evolving into spasticity, severe
  to profound intellectual disability, cerebral volume loss, and a thin corpus
  callosum. Combined L-serine and pyridoxine supplementation brought seizure
  freedom in the two treated children of the founding report, but their
  intellectual disability remained profound.
parents:
- Neurodevelopmental Disorder
- Genetic Disease
- Inborn Error of Metabolism

inheritance:
- name: Autosomal recessive
  description: >-
    DEE82 requires two pathogenic GOT2 alleles. Both homozygous genotypes, largely
    from consanguineous families, and compound heterozygous genotypes are
    reported.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing was used to investigate the disease etiology in four children from independent families with intellectual disability and epilepsy, revealing bi-allelic GOT2 mutations."
    explanation: >-
      The founding report establishes biallelic inheritance across four children
      from independent families.
  - reference: PMID:37977948
    reference_title: "Developmental and epileptic encephalopathy 82 (DEE82) with novel compound heterozygous mutations of GOT2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sanger sequencing confirmed the paternal inheritance of the p.Asp257Asn mutation and the maternal inheritance of the p.Arg262Cys mutation."
    explanation: >-
      Parental segregation of one variant from each parent is the recessive
      pattern at the level of a single family.

pathophysiology:
- name: Biallelic GOT2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Two pathogenic GOT2 alleles are present. Reported variants are mostly
    missense or small in-frame deletions - for example p.Leu209del, p.Arg262Gly,
    p.Arg337Gly and p.Gly366Val in the founding families and the compound
    heterozygous pair p.Asp257Asn / p.Arg262Cys in a later case. This node records
    the genomic lesion only.
  genes:
  - preferred_term: GOT2
    term:
      id: hgnc:4433
      label: GOT2
  evidence:
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 11 additional patients with homozygous GOT2 variants, along with additional data from 4 previously reported patients."
    explanation: >-
      The largest cohort to date, with homozygous GOT2 variants in all eleven new
      patients.
  - reference: PMID:37977948
    reference_title: "Developmental and epileptic encephalopathy 82 (DEE82) with novel compound heterozygous mutations of GOT2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome data analysis unveiled the presence of novel compound heterozygous mutations in the GOT2 gene coding for mitochondrial glutamate aspartate transaminase."
    explanation: >-
      Documents the compound heterozygous route to the same disease.
  downstream:
  - target: Mitochondrial Aspartate Aminotransferase Deficiency
    causal_link_type: DIRECT
    description: >-
      The variants reduce the catalytic activity of the mitochondrial enzyme.

- name: Mitochondrial Aspartate Aminotransferase Deficiency
  biological_scale: MOLECULAR
  description: >-
    GOT2 transamination activity in the mitochondrial matrix is reduced. Enzyme
    activity was deficient in patient fibroblasts. Complete absence of GOT2 is
    thought to be incompatible with life, since homozygous Got2 knockout is lethal
    in mice, so the human alleles are presumed hypomorphic with residual activity.
  genes:
  - preferred_term: GOT2
    term:
      id: hgnc:4433
      label: GOT2
  cellular_components:
  - preferred_term: mitochondrial matrix
    term:
      id: GO:0005759
      label: mitochondrial matrix
  molecular_functions:
  - preferred_term: L-aspartate:2-oxoglutarate transaminase activity
    term:
      id: GO:0004069
      label: L-aspartate:2-oxoglutarate transaminase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GOT2 enzyme activity was deficient in fibroblasts with bi-allelic mutations."
    explanation: >-
      Direct measurement of reduced GOT2 activity in patient cells.
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "It is expected that complete inactivity of the MAS components are lethal in humans, as demonstrated by homozygous knockouts of MDH1, MDH2, GOT1, GOT2 in mice."
    explanation: >-
      Supports reading the human alleles as hypomorphic: the null is lethal in
      mice. The review is restating knockout-mouse findings it did not produce.
  downstream:
  - target: Malate-Aspartate Shuttle Failure
    causal_link_type: DIRECT
    description: >-
      GOT2 is an obligatory step of the shuttle, so its loss reduces shuttle flux.
  - target: Reduced Mitochondrial Aspartate Production
    causal_link_type: DIRECT
    description: >-
      GOT2 is the enzyme that forms aspartate from mitochondrial oxaloacetate, so
      its loss reduces aspartate output independently of the redox consequence.

- name: Malate-Aspartate Shuttle Failure
  biological_scale: MOLECULAR
  description: >-
    The malate-aspartate shuttle, which transfers reducing equivalents from
    cytosolic NADH into mitochondria as malate, loses flux. The shuttle is the
    predominant NADH shuttle in the cell types studied; glycerol, which feeds the
    alternative glycerol-3-phosphate shuttle, did not correct the downstream
    serine defect in GOT2-knockout HEK293 cells.
  biological_processes:
  - preferred_term: malate-aspartate shuttle
    term:
      id: GO:0043490
      label: malate-aspartate shuttle
    modifier: DECREASED
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "GOT2, a member of the malate-aspartate shuttle, plays an essential role in the intracellular NAD(H) redox balance."
    explanation: >-
      States the shuttle membership and function that are lost; a framing
      statement rather than a measured result.
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The notion that GOT2 deficiency can cause an overall deficiency in the MAS and thereby decrease the cytosolic NAD+/NADH ratio is supported by a GOT2 knockdown model in pancreatic cancer cells that had impaired net transfer of cytosolic NADH into mitochondria."
    explanation: >-
      Cites cell-line evidence that GOT2 loss impairs net NADH transfer into
      mitochondria, i.e. shuttle failure.
  downstream:
  - target: Cytosolic NAD+/NADH Redox Imbalance
    causal_link_type: DIRECT
    description: >-
      Without the shuttle, cytosolic NADH is not reoxidized and the cytosolic
      NAD+/NADH ratio falls.
  - target: Impaired Neuronal Energy Metabolism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reducing equivalents from glycolysis no longer reach the respiratory chain,
      limiting glucose-supported oxidative ATP production.

- name: Cytosolic NAD+/NADH Redox Imbalance
  biological_scale: CELLULAR
  description: >-
    The cytosolic NAD+/NADH ratio shifts toward NADH, starving NAD+-dependent
    cytosolic reactions. Pyruvate supplementation, which reoxidizes NADH through
    lactate dehydrogenase, corrects the downstream serine synthesis defect in
    GOT2-deficient cells, which localizes the defect to redox cycling.
  biological_processes:
  - preferred_term: cell redox homeostasis
    term:
      id: GO:0045454
      label: cell redox homeostasis
    modifier: ABNORMAL
  notes: >-
    The founding report's abstract (PMID:31422819) describes the cytosolic
    NAD-redox state of GOT2-deficient cells as "highly oxidized". The review by
    the same group (PMID:33990986) and the mechanism of the shuttle both describe
    the opposite direction - a decreased cytosolic NAD+/NADH ratio, that is a more
    reduced cytosol - and pyruvate, the rescuing agent, acts by oxidizing NADH. This
    node follows the review's direction; the abstract sentence is quoted below only
    for the pyruvate rescue it reports, not for the direction it names.
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Correcting the highly oxidized cytosolic NAD-redox state by pyruvate supplementation restored serine biosynthesis in GOT2-deficient cells."
    explanation: >-
      Pyruvate rescue of a redox-dependent pathway places the lesion in cytosolic
      NAD(H) cycling. See the node notes on the direction the sentence names.
  - reference: PMID:35815941
    reference_title: "Metabolic requirement for GOT2 in pancreatic cancer depends on environmental context."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "GOT2 knockdown (KD) in PDA cell lines in vitro induced NADH accumulation"
    explanation: >-
      Measured NADH accumulation after GOT2 knockdown, in pancreatic cancer cells
      rather than patient or neural cells, so it supports the direction of the
      imbalance by inference from another cell type.
  downstream:
  - target: Impaired De Novo Serine Biosynthesis
    causal_link_type: DIRECT
    description: >-
      The first committed step of serine synthesis, 3-phosphoglycerate
      dehydrogenase, requires NAD+.
  - target: Increased Pyruvate-to-Lactate Conversion
    causal_link_type: DIRECT
    description: >-
      Excess cytosolic NADH drives lactate dehydrogenase toward lactate.

- name: Impaired De Novo Serine Biosynthesis
  biological_scale: CELLULAR
  description: >-
    De novo serine (and glycine) synthesis is reduced in patient fibroblasts and in
    GOT2-knockout HEK293 cells, a secondary serine synthesis defect. Because
    primary serine synthesis defects share much of the DEE82 phenotype
    (microcephaly, epilepsy, developmental delay, spasticity), part of the
    neurological phenotype is proposed to be serine-mediated, which is the
    rationale for L-serine supplementation.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: L-serine biosynthetic process
    term:
      id: GO:0006564
      label: L-serine biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "De novo serine biosynthesis was impaired in fibroblasts with GOT2 mutations and GOT2-knockout HEK293 cells."
    explanation: >-
      Direct measurement in patient fibroblasts and a knockout cell line.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient fibroblast cells showed reduced serine and glycine biosynthesis, rescuable by pyruvate supplementation."
    explanation: >-
      Independent replication in fibroblasts from a larger, separately ascertained
      cohort.
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Since the first step of serine synthesis is catalyzed by the NAD+-dependent enzyme 3-phosphoglycerate dehydrogenase, a secondary serine synthesis defect may occur as a consequence of cytosolic NAD+/NADH imbalance."
    explanation: >-
      States the biochemical link from the redox imbalance to serine synthesis.
  downstream:
  - target: Hyposerinemia
    causal_link_type: DIRECT
    description: >-
      Reduced endogenous synthesis lowers plasma serine.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Serine deficiency is proposed to account for part of the neurological
      phenotype, supported by the seizure response to serine plus pyridoxine; the
      intermediate steps in GOT2 deficiency are not established.
    evidence:
    - reference: PMID:33990986
      reference_title: "Inborn disorders of the malate aspartate shuttle."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This may support the notion that part of the clinical phenotype is due to a secondary serine biosynthesis defect, especially as oral l-serine supplementation ameliorated the neurologic phenotype in GOT2 deficiency."
      explanation: >-
        The authors' hedged proposal linking the serine defect to the
        neurological phenotype.

- name: Increased Pyruvate-to-Lactate Conversion
  biological_scale: CELLULAR
  description: >-
    With cytosolic NADH elevated, pyruvate is reduced to lactate rather than
    entering mitochondrial oxidation. Unlike MDH1 and AGC1 deficiency, GOT2
    deficiency presents with clear hyperlactataemia. Overall glycolytic flux may be
    decreased, since GOT2-knockout cells show low pyruvate.
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although overall glycolytic flux may be decreased in GOT2 deficiency, high levels of lactate are likely the result of increased pyruvate to lactate conversion due to increased NADH levels in the cytosol."
    explanation: >-
      Gives the proposed mechanism of the hyperlactataemia.
  downstream:
  - target: Increased Circulating Lactate
    causal_link_type: DIRECT
    description: >-
      Excess lactate production appears as raised plasma lactate.

- name: Reduced Mitochondrial Aspartate Production
  biological_scale: CELLULAR
  description: >-
    Mitochondrial aspartate formation from oxaloacetate falls, so less aspartate
    is exported to the cytosol. Low aspartate in dried blood spots is a proposed
    screening marker.
  biological_processes:
  - preferred_term: L-aspartate biosynthetic process
    term:
      id: GO:0006532
      label: L-aspartate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In GOT2 deficiency, mitochondrial aspartate production from oxaloacetate is decreased, as supported by findings in GOT2 knockdown cells."
    explanation: >-
      States the reduced aspartate production and grounds it in knockdown-cell
      findings.
  downstream:
  - target: Secondary Urea Cycle Dysfunction
    causal_link_type: DIRECT
    description: >-
      Cytosolic aspartate condenses with citrulline to form argininosuccinate, so
      aspartate shortage stalls the urea cycle at that step.
  - target: Decreased Circulating Aspartate
    causal_link_type: DIRECT
    description: >-
      Reduced production appears as low aspartate in blood.

- name: Secondary Urea Cycle Dysfunction
  biological_scale: ORGANISM
  description: >-
    Aspartate shortage limits argininosuccinate formation, so citrulline
    accumulates and ammonia disposal is impaired. This is a secondary urea cycle
    defect; urinary organic acids and plasma acylcarnitines were normal.
  biological_processes:
  - preferred_term: urea cycle
    term:
      id: GO:0000050
      label: urea cycle
    modifier: DECREASED
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hyperammonemia and hypercitrullinemia in patients with a GOT2 deficiency point to a secondary defect of the urea cycle."
    explanation: >-
      Interprets the patients' biochemistry as a secondary urea cycle defect.
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thus, the hyperammonemia and hypercitrullinemia as observed in GOT2 deficient patients can be explained by a deficient aspartate provision to the cytosol."
    explanation: >-
      Names aspartate shortage as the link to the urea cycle findings.
  downstream:
  - target: Hyperammonemia
    causal_link_type: DIRECT
    description: >-
      Impaired ammonia disposal raises plasma ammonia.
  - target: Elevated Plasma Citrulline
    causal_link_type: DIRECT
    description: >-
      Citrulline accumulates upstream of the aspartate-requiring step.

- name: Impaired Neuronal Energy Metabolism
  biological_scale: CELLULAR
  description: >-
    Because the shuttle couples glycolysis to mitochondrial respiration, its
    failure is proposed to cause a neuronal energy shortfall and overall
    mitochondrial dysfunction. This is inferred from the shuttle's function and
    from the other shuttle defects; no respiration measurement in GOT2-deficient
    neurons is reported.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: cellular respiration
    term:
      id: GO:0045333
      label: cellular respiration
    modifier: DECREASED
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both MDH2 and GOT2 enzymes are located in the mitochondria and are functionally coupled to the TCA cycle and ATP production, thus, defects in these enzymes can result in overall mitochondrial dysfunction."
    explanation: >-
      A mechanistic inference, not a measurement in GOT2-deficient cells.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A defect of this shuttle leads to a shortage of energy supply leading to a malfunction or degeneration of neurons."
    explanation: >-
      States the energy-shortfall mechanism for shuttle defects in general.
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Energy shortfall is one of several proposed routes to hyperexcitability.
  - target: Progressive Cerebral Volume Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Neuronal malfunction and degeneration are proposed to underlie the cerebral
      atrophy.
  - target: Cerebral White Matter Abnormality
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cohort's neuroradiologists read the T2 white matter signal change as
      impaired myelination secondary to neuronal involvement rather than a
      primary hypomyelination.
    evidence:
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these white matter abnormalities are most likely related to the superimposed neuronal involvement in the disease instead of a primary hypomyelination process"
      explanation: >-
        The authors' interpretation of the imaging, which places the white matter
        change downstream of neuronal dysfunction.

- name: Neuronal Hyperexcitability and Hypersynchrony
  biological_scale: TISSUE
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  description: >-
    Neuronal networks become hyperexcitable. Proposed contributors are serine
    deficiency, energy shortfall, and reduced glutamate availability for
    neurotransmission because shuttle-derived aspartate supports cytosolic
    glutamate synthesis. got2a knockdown zebrafish show seizure-like EEG spikes
    that pyridoxine rescues.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:33990986
    reference_title: "Inborn disorders of the malate aspartate shuttle."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A deficiency in MAS can therefore affect the availability of glutamate for neurotransmission, potentially contributing to the epileptic phenotype seen in these deficiencies."
    explanation: >-
      The neurotransmitter route, stated as a possibility.
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Knockdown of got2a in zebrafish resulted in a brain developmental defect associated with seizure-like electroencephalography spikes, which could be rescued by supplying pyridoxine in embryo water."
    explanation: >-
      Model-organism evidence that GOT2 loss produces epileptiform activity.
  downstream:
  - target: Infantile-Onset Seizures
    causal_link_type: DIRECT
    description: >-
      Sustained hyperexcitability manifests as recurrent infantile-onset seizures.

- name: Progressive Cerebral Volume Loss
  biological_scale: TISSUE
  description: >-
    Brain MRI shows cerebral atrophy in all of the founding patients, with thin
    or hypoplastic corpus callosum and a hypoplastic vermis in most; the larger
    cohort separates two severity groups by the degree of cerebral volume loss and
    myelination defects.
  evidence:
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroimaging revealed 2 severity groups based on cerebral volume loss and myelination defects."
    explanation: >-
      Volume loss is the axis along which the cohort's imaging severity divides.
  downstream:
  - target: Cerebral Atrophy
    causal_link_type: DIRECT
    description: >-
      The volume loss is seen as cerebral atrophy on MRI.
  - target: Progressive Microcephaly
    causal_link_type: DIRECT
    description: >-
      Failure of brain growth and volume loss manifest as progressive
      microcephaly.
  - target: Ventriculomegaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In the severe imaging subgroup, extensive volume loss occurs together with
      ventricular enlargement; the source reports the co-occurrence, and the
      ex vacuo reading is an inference.
    evidence:
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The first subgroup included patients with severe early-onset presentation, characterized by extensive volume loss, particularly in the frontoparietal regions, thin corpus callosum, and ventriculomegaly with or without septations."
      explanation: >-
        Ventriculomegaly clusters with extensive volume loss in the severe
        subgroup.
  - target: Developmental Regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cohort describes a neurodegenerative as well as neurodevelopmental
      course, with degenerative brain changes in the first years of life in the
      severe forms; loss of acquired milestones is its clinical counterpart.
    evidence:
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This included severe forms in which extensive brain degenerative changes were observed in the first years of life, characterized mostly by diffuse cerebral volume loss"
      explanation: >-
        Places degenerative volume loss early in the disease, alongside the

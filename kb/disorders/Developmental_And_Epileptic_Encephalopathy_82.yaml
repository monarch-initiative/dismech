genetic:
- name: GOT2
  association: Biallelic pathogenic variants
  presence: Positive
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GOT2
    term:
      id: hgnc:4433
      label: GOT2
  notes: >-
    GOT2 encodes mitochondrial glutamate-oxaloacetate transaminase (mitochondrial
    aspartate aminotransferase), a pyridoxal phosphate-dependent enzyme of the
    malate-aspartate shuttle. Founding-family variants (NM_002080.4) are
    c.617_619delTTC p.Leu209del, c.784C>G p.Arg262Gly, c.1009C>G p.Arg337Gly and
    c.1097G>T p.Gly366Val; a later compound heterozygous case carries p.Asp257Asn
    and p.Arg262Cys. Its cytosolic paralogue GOT1 has no reported human deficiency.
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing was used to investigate the disease etiology in four children from independent families with intellectual disability and epilepsy, revealing bi-allelic GOT2 mutations."
    explanation: >-
      Founding gene-disease association in four independent families.
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "GOT2-1 | GOT2 | NM_002080.4 | c.617_619delTTC | p.Leu209del"
    explanation: >-
      Tabulated founding-family variant with transcript, re-tabulated from the
      original report.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report 11 additional patients with homozygous GOT2 variants, along with additional data from 4 previously reported patients."
    explanation: >-
      Independent replication in eleven further patients.


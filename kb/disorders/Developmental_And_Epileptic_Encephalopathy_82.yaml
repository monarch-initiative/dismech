  - target: Severe to Profound Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Structural brain involvement contributes to the cognitive outcome; the
      persistence of profound disability after seizure control on serine and
      pyridoxine suggests the seizures are not its only cause.

phenotypes:
- category: Neurological
  name: Infantile-Onset Seizures
  description: >-
    Seizures occurred in 15 of 16 patients in the 2025 cohort and began within
    the first year of life in 13 of 14 (median onset 5 months). Seizure types
    vary within and between patients: tonic, myoclonic, generalized
    tonic-clonic, clonic, atonic, focal and absence seizures. Epilepsy became
    refractory to anti-seizure medication in two of the four founding patients.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
    onset:
      onset_category: INFANTILE
  evidence:
  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS

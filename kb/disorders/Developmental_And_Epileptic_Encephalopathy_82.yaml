    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical profiling identified low aspartate and high glycerol-3-phosphate in dried blood spots as potential screening markers."
    explanation: >-
      Proposes the dried blood spot markers.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For several patients, however, considerable overlap was observed with the control group, suggesting limited value of these metabolites as standalone diagnostic markers."
    explanation: >-
      The authors' own caveat: supportive indicators, not standalone tests.

treatments:
- name: L-Serine and Pyridoxine Supplementation
  description: >-
    Oral L-serine and/or pyridoxine (vitamin B6), added to anti-seizure
    medication. Serine replaces the product of the secondarily impaired synthesis
    pathway; pyridoxine is given because GOT2 is pyridoxal phosphate-dependent, to
    support residual enzyme activity. In the 2025 cohort 7 of 13 patients
    received one or both supplements and 6 of the 7 had partial or complete
    seizure control. Individual courses range from seizure cessation allowing
    complete withdrawal of anti-seizure medication (F10), through seizure control
    only after both supplements were added (F7) and an approximate halving of
    tonic seizures on pyridoxine alone (F8), to no clear benefit from a short
    infant trial of pyridoxine (F3). The two founding patients treated with serine
    and pyridoxine became seizure-free but remained profoundly intellectually
    disabled. This is observational evidence from uncontrolled, multi-agent
    regimens: supplements were usually started alongside other changes, and 7
    patients reached partial or complete seizure control on anti-seizure
    medication alone, so the benefit attributable to supplementation, and the
    separate contributions of serine and pyridoxine, are not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: amino acid and vitamin supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Impaired De Novo Serine Biosynthesis
    treatment_effect: BYPASSES
    description: >-
      Exogenous L-serine supplies the product of the impaired pathway.
    evidence:
    - reference: PMID:36079864
      reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In GOT2-deficiency, serine was supplemented together with pyridoxin/vitamin B6 because GOT2 is pyridoxin-dependent."
      explanation: >-
        Records the combined regimen and the pyridoxine rationale.
  - target: Infantile-Onset Seizures
    treatment_effect: INHIBITS
    description: >-
      Seizure freedom in both treated patients.
    evidence:
    - reference: PMID:36079864
      reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "On this treatment, both individuals that had refractory epilepsy before and achieved seizure freedom"
      explanation: >-
        Seizure freedom on treatment in 2/2 previously refractory patients.
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "seizure frequency markedly declined after the initiation of serine and pyridoxine and ceased after increasing the dose, allowing for complete withdrawal of ASMs by 1.9 years of age."
      explanation: >-
        F10, one of the founding patients, came off all anti-seizure medication on serine and pyridoxine; a within-patient dose response, but still a single uncontrolled course.
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "F8 demonstrated an approximate 50% reduction in generalized tonic seizures after initiating regular pyridoxine supplementation, without other major treatment changes, suggesting partial responsiveness."
      explanation: >-
        A pyridoxine-only response without other major treatment changes, the least confounded single course in the cohort.
    - reference: PMID:41001736
      reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
      supports: REFUTE
      evidence_source: HUMAN_CLINICAL
      snippet: "In the case of F3, an earlier short trial of pyridoxine during infancy showed no clear benefit."
      explanation: >-
        A documented non-response to pyridoxine, contradicting a uniform effect; the trial was short.
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epilepsy was serine and pyridoxine responsive."
    explanation: >-
      The founding report's clinical treatment finding.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More than half of the cohort (7/13) received serine and/or pyridoxine (vitamin B6) supplementation as part of their therapeutic regimen."
    explanation: >-
      How widely the supplements were used in the 2025 cohort.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "typically within complex, multiagent treatment contexts and 86% (6/7) who were on supplementations showed partial or complete seizure control."
    explanation: >-
      Seizure control in 6/7 supplemented patients; the same sentence states that the assessment was made within multiagent regimens, so the effect cannot be attributed to the supplements alone.
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both pyridoxine and serine synergistically rescued embryonic developmental defects in zebrafish got2a morphants."
    explanation: >-

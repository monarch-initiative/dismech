    snippet: "Seizure control, either partial or complete, was achieved in 87% (13/15) of affected individuals, the majority of whom (14/15) required multiple antiseizure medications (ASMs), except F5-P2, who responded to a single ASM."
    explanation: >-
      Most patients needed several anti-seizure medications, and 13/15 reached partial or complete control.
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Conversely, 7 affected individuals achieved complete or partial seizure control through ASMs alone, without the use of serine or pyridoxine supplementation"
    explanation: >-
      Seven patients were controlled without supplements, which qualifies any claim that supplementation is required for seizure control.


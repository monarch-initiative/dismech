  - reference: PMID:36079864
    reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Intellectual disability at last follow-up (on treatment) was profound in both."
    explanation: >-
      Qualifies the benefit: seizure control did not translate into preserved
      cognition in the two treated children, so this contradicts any claim that
      the treatment rescues the neurodevelopmental phenotype.
- name: Anti-Seizure Medication
  description: >-
    Conventional anti-seizure medications (valproate, levetiracetam, lamotrigine
    and others) are used in essentially all patients, most needing more than
    one. In the 2025 cohort 13 of 15 reached partial or complete seizure control,
    7 of them without serine or pyridoxine; epilepsy became refractory in two of
    the four founding patients.

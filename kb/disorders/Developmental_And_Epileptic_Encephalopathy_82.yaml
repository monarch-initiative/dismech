diagnosis:
- name: Exome Sequencing for Biallelic GOT2 Variants
  description: >-
    Diagnosis is established by identifying two pathogenic GOT2 alleles, in
    practice by exome sequencing, since the clinical picture overlaps with many
    other infantile epileptic encephalopathies.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  presence: Positive in affected individuals
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing was used to investigate the disease etiology in four children from independent families with intellectual disability and epilepsy, revealing bi-allelic GOT2 mutations."
    explanation: >-
      Exome sequencing was the diagnostic route in the founding families.
- name: Dried Blood Spot Metabolic Profiling
  description: >-
    Low aspartate and high glycerol-3-phosphate in dried blood spots are proposed
    screening markers. Plasma lactate, ammonia, citrulline and serine support the
    diagnosis but are neither consistent nor specific; the shared biochemical
    picture of shuttle defects (high lactate, high glycerol-3-phosphate, high
    ammonia, low serine) narrows the differential without identifying the gene.
  diagnosis_term:
    preferred_term: dried blood spot aspartate and glycerol-3-phosphate profiling
  notes: >-
    No term bound. The markers were published as potential screening markers,
    not as a validated test.
  evidence:
  - reference: PMID:41001736
    reference_title: "Comprehensive genotypic, phenotypic, and biochemical characterization of GOT2 deficiency: A progressive neurodevelopmental disorder with epilepsy and abnormal movements."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical profiling identified low aspartate and high glycerol-3-phosphate in dried blood spots as potential screening markers."
    explanation: >-
      Proposes the dried blood spot markers.

treatments:
- name: L-Serine and Pyridoxine Supplementation
  description: >-
    Oral L-serine with pyridoxine (vitamin B6) was given to two of the four
    founding patients. Serine replaces the product of the secondarily impaired
    synthesis pathway; pyridoxine is given because GOT2 is pyridoxal
    phosphate-dependent, to support residual enzyme activity. Both treated
    children, whose epilepsy had been refractory, became seizure-free, and all
    anti-seizure medication could be withdrawn in one; both were more alert, but
    intellectual disability remained profound. The evidence is two patients
    without a control, and the separate contributions of serine and pyridoxine
    are not known in humans.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: amino acid and vitamin supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Impaired De Novo Serine Biosynthesis
    treatment_effect: BYPASSES
    description: >-
      Exogenous L-serine supplies the product of the impaired pathway.
    evidence:
    - reference: PMID:36079864
      reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In GOT2-deficiency, serine was supplemented together with pyridoxin/vitamin B6 because GOT2 is pyridoxin-dependent."
      explanation: >-
        Records the combined regimen and the pyridoxine rationale.
  - target: Infantile-Onset Seizures
    treatment_effect: INHIBITS
    description: >-
      Seizure freedom in both treated patients.
    evidence:
    - reference: PMID:36079864
      reference_title: "Ketogenic Diet Treatment of Defects in the Mitochondrial Malate Aspartate Shuttle and Pyruvate Carrier."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "On this treatment, both individuals that had refractory epilepsy before and achieved seizure freedom"
      explanation: >-
        Seizure freedom on treatment in 2/2 previously refractory patients.
  evidence:
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The epilepsy was serine and pyridoxine responsive."
    explanation: >-
      The founding report's clinical treatment finding.
  - reference: PMID:31422819
    reference_title: "Bi-allelic GOT2 Mutations Cause a Treatable Malate-Aspartate Shuttle-Related Encephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both pyridoxine and serine synergistically rescued embryonic developmental defects in zebrafish got2a morphants."
    explanation: >-
      Model-organism support for the combination.
  - reference: PMID:36079864

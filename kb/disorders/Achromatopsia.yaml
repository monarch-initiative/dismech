progression:
- phase: Congenital or early-childhood presentation
  age_range: Birth to early childhood
  notes: >-
    Cone dysfunction and the cardinal visual manifestations are present from
    birth or become apparent in early childhood.
  evidence:
  - reference: PMID:34860352
    reference_title: "Achromatopsia: Genetics and Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The loss of cone photoreceptor function manifests at birth or early in childhood and results in decreased visual acuity, lack of color discrimination, abnormal intolerance to light (photophobia), and rapid involuntary eye movement (nystagmus)."
    explanation: Defines the congenital or early-childhood onset of functional manifestations.
- phase: Longitudinal visual function
  notes: >-
    Best-corrected visual acuity is predominantly stationary. In a Danish
    natural-history cohort, deterioration attributable to achromatopsia was
    identified in only three of 58 individuals.
  evidence:
  - reference: PMID:36980963
    reference_title: Genetic and Clinical Characterization of Danish Achromatopsia Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Progressive deterioration of BCVA only attributable to achromatopsia was found in three of 58 patients."
    explanation: Quantifies the uncommon occurrence of functional acuity progression in a longitudinal cohort.
  - reference: PMID:36980963
    reference_title: Genetic and Clinical Characterization of Danish Achromatopsia Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "support the evidence that achromatopsia is a predominantly stationary condition with respect to BCVA."
    explanation: Supports describing visual acuity as predominantly stationary rather than uniformly progressive.
- phase: Variable structural evolution
  notes: >-
    Cross-sectional OCT studies show age-associated foveal hyporeflective zones
    and outer nuclear layer thinning in some cohorts. Structural change is
    therefore possible, but it should not be equated with universal functional
    deterioration.
  evidence:
  - reference: PMID:21211844
    reference_title: "High-resolution in vivo imaging in achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was significant (P = 1.1×10(-6)) ONL thinning in the achromats compared with controls, which was age-dependent (P = 0.0002)."  # codespell:ignore-line
    explanation: Supports age-associated structural change while preserving the distinction from functional progression.
pathophysiology:
- name: Cone CNG Channel Dysfunction
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >
    The cone cyclic nucleotide-gated (CNG) channel is a heterotetrameric complex
    composed of three CNGA3 alpha subunits and one CNGB3 beta subunit. In
    darkness, high cGMP levels keep CNG channels open, maintaining a depolarizing
    dark current. Light-driven phototransduction reduces cGMP, closing channels
    and hyperpolarizing the cone. Biallelic pathogenic variants in CNGA3 or CNGB3
    severely impair or abolish channel function and cone light responses. This
    is the most common mechanism, with up to 90% of patients carrying variants
    in CNGA3 or CNGB3.
  genes:
  - preferred_term: CNGA3
    term:
      id: hgnc:2150
      label: CNGA3
  - preferred_term: CNGB3
    term:
      id: hgnc:2153
      label: CNGB3
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Cone Photoreceptor Dysfunction
    description: Loss of the cone CNG channel eliminates cone light responses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34860352
      reference_title: "Achromatopsia: Genetics and Gene Therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These mutations result in a functional loss"
      explanation: CNG-channel genes are core phototransduction genes, and their dysfunction directly impairs the cascade that generates cone light responses.
  evidence:
  - reference: PMID:34860352
    reference_title: "Achromatopsia: Genetics and Gene Therapy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The cone CNG channel is made up of three CNGA3 and one CNGB3 subunits"
    explanation: Defines the three-to-one alpha/beta stoichiometry of the native cone CNG channel.
  - reference: PMID:34860352
    reference_title: "Achromatopsia: Genetics and Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Up to 90% of patients with ACHM carry mutations in CNGA3 or CNGB3, which are the genes encoding the alpha and beta subunits of the cone cyclic nucleotide-gated (CNG) channel, respectively."
    explanation: Confirms that CNG channel subunit mutations account for the vast majority of achromatopsia cases.
  - reference: PMID:34860352
    reference_title: "Achromatopsia: Genetics and Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations result in a functional loss and a slow progressive degeneration of cone photoreceptors."
    explanation: Supports functional loss and the possibility of slow structural change, without implying a uniform clinical trajectory.
- name: Cone Transducin Deficiency
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >
    GNAT2 encodes the alpha subunit of cone transducin, a heterotrimeric G
    protein that couples activated cone opsin to phosphodiesterase activation.
    Loss of GNAT2 function prevents signal transduction from photoactivated
    cone opsin to PDE6C, blocking the phototransduction cascade at the G-protein
    coupling step. cGMP levels remain constitutively high, but without transducin
    signaling the cone cannot generate a light response.
  genes:
  - preferred_term: GNAT2
    term:
      id: hgnc:4394
      label: GNAT2
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Cone Photoreceptor Dysfunction
    description: Loss of cone transducin signaling prevents cone light responses.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34860352
      reference_title: "Achromatopsia: Genetics and Gene Therapy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "G-protein transducin, which activates the PDE to mediate"
      explanation: Loss of the cone transducin step prevents PDE6 activation and therefore directly disrupts cone phototransduction.
  evidence:
  - reference: PMID:29257187
    reference_title: "Diagnosis and Treatment Options for Achromatopsia: A Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNGA3, CNGB3, GNAT2, PDE6C, PDE6H, and ATF6 gene mutations have been identified as associated with this disease."
    explanation: Confirms GNAT2 as one of the six known achromatopsia genes.
- name: Cone PDE6 Catalytic-Subunit Deficiency
  conforms_to: "phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect"
  description: >
    PDE6C encodes the catalytic alpha prime subunit of cone cGMP
    phosphodiesterase. Activated cone transducin normally stimulates PDE6 to
    convert cGMP to 5-prime-GMP, lowering cGMP and closing CNG channels during
    the light response. Loss of PDE6C catalytic function impairs cGMP
    hydrolysis, favoring persistently elevated cGMP and open CNG channels and
    preventing a normal cone light response.
  genes:
  - preferred_term: PDE6C
    term:
      id: hgnc:8787
      label: PDE6C
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Cone Photoreceptor Dysfunction
    description: Loss of PDE6C-mediated cGMP hydrolysis prevents the normal cone light response.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19615668
      reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP) phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone phototransduction."
      explanation: Establishes the catalytic reaction disrupted by PDE6C loss and its essential role in cone phototransduction.
  evidence:
  - reference: PMID:19615668
    reference_title: "Homozygosity mapping reveals PDE6C mutations in patients with early-onset cone photoreceptor disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PDE6C gene encodes the cone alpha subunit of cyclic guanosine monophosphate (cGMP) phosphodiesterase, which converts cGMP to 5'-GMP, and thereby plays an essential role in cone phototransduction."
    explanation: Defines PDE6C as the cone PDE6 catalytic subunit and supports the direction of the cGMP-hydrolysis defect.
- name: Cone PDE6 Gamma-Subunit Dysregulation
  description: >
    PDE6H encodes the inhibitory gamma subunit that restrains cone PDE6
    catalytic activity until light-activated transducin relieves that
    inhibition. PDE6H loss therefore has the opposite predicted biochemical
    direction from PDE6C catalytic loss: reduced inhibition can favor excessive
    basal PDE6 activity, lower cGMP, and CNG-channel closure. That biochemical
    direction has not been directly established in affected humans; altered
    PDE6-complex stability or compensatory inhibition could modify it.
  genes:
  - preferred_term: PDE6H
    term:
      id: hgnc:8790
      label: PDE6H
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  biological_processes:
  - preferred_term: phototransduction, visible light
    term:
      id: GO:0007603
      label: phototransduction, visible light
    modifier: DECREASED
  downstream:
  - target: Cone Photoreceptor Dysfunction
    description: Loss of inhibitory PDE6H regulation disrupts the cone PDE6 response and cone phototransduction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22901948
      reference_title: "A nonsense mutation in PDE6H causes autosomal-recessive incomplete achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings add PDE6H to the set of genes involved in autosomal-recessive cone disorders and demonstrate the importance of the inhibitory γ subunit in cone phototransduction."
      explanation: Human genetic evidence links loss of PDE6H inhibitory regulation to cone phototransduction dysfunction.
  evidence:
  - reference: PMID:22901948
    reference_title: "A nonsense mutation in PDE6H causes autosomal-recessive incomplete achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "encoding the inhibitory γ subunit of the cone photoreceptor cyclic guanosine monophosphate phosphodiesterase."
    explanation: Defines PDE6H as the inhibitory, rather than catalytic, cone PDE6 subunit and supports separating its mechanism from PDE6C deficiency.
- name: Cone Photoreceptor Dysfunction
  conforms_to: "phototransduction_cascade_dysfunction#Failure of Photoreceptor Light-Response Generation or Timely Recovery"
  description: >
    Loss of cone phototransduction, or ATF6-dependent cone development,
    reduces or abolishes cone-mediated color and high-acuity photopic vision
    from infancy. This functional cone failure explains achromatopsia, reduced
    acuity, photophobia, and impaired fixation. Some cohorts also show variable
    age-associated structural abnormalities, although visual acuity is usually
    stable over time.
  cell_types:
  - preferred_term: retinal cone cell
    term:

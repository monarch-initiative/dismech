datasets:
- accession: geo:GSE153978
  title: Multiexon deletion alleles of ATF6 linked to achromatopsia
  description: Achromatopsia (ACHM) is an autosomal recessive disease that results in severe visual loss. Symptoms of ACHM include impaired visual acuity, nystagmus, and photoaversion starting from infancy; furthermore, ACHM is associated with bilateral foveal hypoplasia and absent or severely reduced cone photoreceptor function on electroretinography. Here, we performed genetic sequencing in 3 patients from 2 families with ACHM, identifying and functionally characterizing 2 mutations in the activating transcription factor 6 (ATF6) gene. We identified a homozygous deletion covering exons 8–14 of the ATF6 gene from 2 siblings from the same family.
  organism:
    preferred_term: human
    term:

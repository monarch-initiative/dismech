  - reference: PMID:37172884
    reference_title: "First-in-Human Gene Therapy Trial of AAV8-hCARp.hCNGB3 in Adults and Children With CNGB3-associated Achromatopsia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Intraocular inflammation occurred in 9 of 23 participants and was mainly mild or moderate in severity."
    explanation: Quantifies the main ocular safety signal in the first-in-human CNGB3 trial.
  - reference: PMID:37172884
    reference_title: "First-in-Human Gene Therapy Trial of AAV8-hCARp.hCNGB3 in Adults and Children With CNGB3-associated Achromatopsia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Severe cases occurred primarily at the highest dose. Two events were considered serious and dose limiting."
    explanation: Records the dose-related severe inflammation and two serious dose-limiting events rather than characterizing the safety signal as uniformly mild.
  - reference: PMID:37172884
    reference_title: "First-in-Human Gene Therapy Trial of AAV8-hCARp.hCNGB3 in Adults and Children With CNGB3-associated Achromatopsia."
    supports: PARTIAL

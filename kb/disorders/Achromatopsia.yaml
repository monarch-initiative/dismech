- name: Genetic Testing
  description: >
    Molecular testing establishes the genetic subtype after a clinical diagnosis
    based on phenotype and ERG. A six-gene panel or exome analysis should include
    deletion/duplication detection, especially for CNGB3; unresolved cases may
    require broader genomic follow-up. Demonstrating biallelic pathogenic
    variants is also required for genotype-specific trial eligibility.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35332618

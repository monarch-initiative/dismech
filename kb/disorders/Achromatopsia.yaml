  - reference: PMID:29020838
    reference_title: "Safety and Efficacy of AAV5 Vectors Expressing Human or Canine CNGB3 in CNGB3-Mutant Dogs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM

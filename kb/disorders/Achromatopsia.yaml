- accession: geo:GSE49659
  title: Retinal Gene and Protein Expression Associated with CNTF-Induced Deconstruction of Photoreceptor Outer Segments in normal and CNGB3-achromatopsia dogs
  description: 'Background: Intravitreal injection of CNTF leads to deconstruction and regeneration of photoreceptor outer segments in normal dogs, and improves the success rate of viral CNGB3 gene replacement therapy in dogs (> 1 year) with CNGB3-achromatopsia. Objectives: The goal of this study was to examine the changes caused by intravitreal CNTF injection to the retinal gene expression profiles and the retinal function of normal and CNGB3-achromatopsia affected dogs. Retinal gene expression profiles were evaluated with canine specific Agilent Oligo Microarray containing 42,034 60-mer oligonucleotide probes.'
  data_type: MICROARRAY

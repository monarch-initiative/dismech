      explanation: Supports a central scotoma as a variably demonstrable consequence of central cone dysfunction.
- name: Variable Foveal Structural Change
  description: >
    Achromatopsia is predominantly stationary with respect to best-corrected
    visual acuity, but some cross-sectional OCT cohorts show age-associated
    foveal hyporeflective zones and outer nuclear layer thinning. These findings
    support variable structural change without proving increased cell death or
    implying clinically progressive disease in every individual.
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  locations:
  - preferred_term: fovea centralis
    term:
      id: UBERON:0001786
      label: fovea centralis
  evidence:
  - reference: PMID:21211844
    reference_title: "High-resolution in vivo imaging in achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The IS/OS junction and COST reflectivity disruption and presence of HRZ and ONL thinning are signs of cone photoreceptor degeneration. The latter 2 are age-dependent, which suggests that achromatopsia is a progressive disorder."  # codespell:ignore-line
    explanation: OCT imaging supports age-associated cone structural change in this cohort, while broader natural-history data show predominantly stable acuity.
  - reference: PMID:21211844
    reference_title: "High-resolution in vivo imaging in achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was significant (P = 1.1×10(-6)) ONL thinning in the achromats compared with controls, which was age-dependent (P = 0.0002)."  # codespell:ignore-line
    explanation: Quantitative evidence of age-associated outer nuclear layer thinning in this cohort.
  downstream:
  - target: Abnormal Foveal Morphology
    description: Foveal cone loss and outer retinal disruption are observed as abnormal foveal morphology on OCT.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21211844
      reference_title: "High-resolution in vivo imaging in achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The IS/OS junction and COST reflectivity disruption and presence of HRZ and ONL thinning are signs of cone photoreceptor degeneration."  # codespell:ignore-line
      explanation: Links cone structural degeneration to the foveal abnormalities visible on high-resolution OCT.
- name: ATF6 Signaling Dysregulation
  description: >
    ATF6 is a key ER stress sensor and transcription factor in the unfolded
    protein response (UPR). Biallelic ATF6 mutations cause achromatopsia through
    a mechanism distinct from phototransduction cascade defects. Pathogenic
    variants dysregulate the ATF6 arm of the UPR rather than abolishing the whole
    response. Human data establish an essential role in cone development, with
    near-absent cone structure, foveal hypoplasia, and cone dysfunction.
  genes:
  - preferred_term: ATF6
    term:
      id: hgnc:791
      label: ATF6
  cell_types:
  - preferred_term: retinal cone cell
    term:
      id: CL:0000573
      label: retinal cone cell
  downstream:
  - target: Cone Photoreceptor Dysfunction
    description: Dysregulated ATF6 signaling disrupts cone development, producing near-absent cone structure, foveal hypoplasia, and cone dysfunction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31237654
      reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate a near absence of cone structure in subjects harboring ATF6 mutations. This implicates ATF6 as having a major role in cone development"
      explanation: Human ATF6-associated disease directly links loss of ATF6 function to abnormal cone development and structure.
  evidence:
  - reference: PMID:28795510
    reference_title: "CNGB3 mutation spectrum including copy number variations in 552 achromatopsia patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease is caused by mutations in genes encoding crucial components of the cone phototransduction cascade (CNGA3, CNGB3, GNAT2, PDE6C, and PDE6H) or in ATF6, involved in the unfolded protein response."
    explanation: Distinguishes ATF6 from the other five achromatopsia genes as having a distinct unfolded protein response mechanism.
  - reference: PMID:31237654
    reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foveal hypoplasia was observed in all subjects with ATF6 mutations."
    explanation: Confirms foveal hypoplasia as a consistent structural finding in ATF6-associated achromatopsia.
  - reference: PMID:31237654
    reference_title: "Characterization of Retinal Structure in ATF6-Associated Achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data demonstrate a near absence of cone structure in subjects harboring ATF6 mutations. This implicates ATF6 as having a major role in cone development"
    explanation: Demonstrates that ATF6 is essential for cone photoreceptor development.
phenotypes:
- category: Eye
  name: Color Vision Defect
  description: >-
    Color discrimination is impaired along the protan, deutan, and tritan axes.
    Most individuals have complete achromatopsia with total loss of cone-mediated
    color discrimination, while rare incomplete achromatopsia retains variable
    residual cone and color function.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Color vision defect
    term:
      id: HP:0000551
      label: Color vision defect
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals with achromatopsia (achromats) have impaired color discrimination along all three axes of color vision"
    explanation: Supports pan-axis impaired color discrimination across complete and incomplete achromatopsia.
- category: Eye
  name: Reduced Visual Acuity
  description: >-
    Visual acuity is often 20/200 or worse in complete achromatopsia, as central
    vision depends primarily on cone-rich foveal photoreceptors. Incomplete
    achromatopsia can be milder, with residual cone function and acuity as good
    as 20/80 in some individuals. Rod-mediated vision provides only peripheral
    and low-resolution input.
  phenotype_term:
    preferred_term: Reduced visual acuity
    term:
      id: HP:0007663
      label: Reduced visual acuity
  evidence:
  - reference: PMID:32352493
    reference_title: "Safety and Vision Outcomes of Subretinal Gene Therapy Targeting Cone Photoreceptors in Achromatopsia: A Nonrandomized Controlled Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Baseline visual acuity letter score (approximate Snellen equivalent) ranged from 34 (20/200) to 49 (20/100)"
    explanation: Clinical trial baseline data confirms severely reduced visual acuity in CNGA3-achromatopsia patients.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Best visual acuity varies with severity of the disease
    explanation: >-
      GeneReviews distinguishes severe complete achromatopsia from milder
      incomplete achromatopsia with residual cone function.
- category: Eye
  name: Hyperopia
  description: >
    Hyperopic refractive error is common and should be assessed during
    ophthalmologic evaluation because refractive correction can improve
    functional vision even though it does not restore cone photoreceptor
    function.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hypermetropia
    term:
      id: HP:0000540
      label: Hypermetropia
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperopia is common in achromatopsia."
    explanation: GeneReviews identifies hyperopia as a common associated refractive finding.
- category: Eye
  name: Photophobia
  description: >-
    Light sensitivity and photoaversion are characteristic of complete
    achromatopsia and may improve slightly with age. Photophobia is usually
    absent in incomplete achromatopsia, so it is not obligate across the full
    disease spectrum.
  phenotype_term:
    preferred_term: Photophobia
    term:
      id: HP:0000613
      label: Photophobia
  evidence:
  - reference: PMID:25616768
    reference_title: "Genetics and Disease Expression in the CNGA3 Form of Achromatopsia: Steps on the Path to Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Achromatopsia (ACHM) is a congenital, autosomal recessive retinal disease that manifests cone dysfunction, reduced visual acuity and color vision, nystagmus, and photoaversion."
    explanation: Photoaversion is listed as a cardinal feature of achromatopsia.
- category: Eye
  name: Infantile Nystagmus
  description: >-
    Pendular nystagmus typically develops during the first few weeks after birth.
    Impaired foveal cone function and fixation provide the clinical context,
    although the complete ocular-motor pathway is not explicitly established.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:29257187
    reference_title: "Diagnosis and Treatment Options for Achromatopsia: A Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is usually an autosomal-recessive disease and is characterized by pendular nystagmus, poor visual acuity, lack of color vision, and marked photophobia."
    explanation: Pendular nystagmus is identified as a characteristic feature of achromatopsia.
- category: Eye
  name: Abnormal Foveal Morphology
  description: >
    OCT imaging reveals a range of foveal structural abnormalities including
    disruption of the IS/OS junction, outer nuclear layer thinning, foveal
    hyporeflective zones, and foveal maldevelopment. Findings vary among
    individuals, and age associations in cross-sectional cohorts should not be
    interpreted as inevitable longitudinal progression.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Abnormal foveal morphology
    term:
      id: HP:0000493
      label: Abnormal foveal morphology
  evidence:
  - reference: PMID:21211844
    reference_title: "High-resolution in vivo imaging in achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A characteristic so-called punched out hyporeflective zone (HRZ) was noted in 7 of 13 patients; this was age-dependent (P = 0.001)."
    explanation: OCT demonstrates characteristic foveal structural abnormalities in achromatopsia patients.
  - reference: PMID:21211844
    reference_title: "High-resolution in vivo imaging in achromatopsia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foveal maldevelopment was seen in 9 of 13 patients."
    explanation: Foveal maldevelopment is a common structural finding in achromatopsia.
  - reference: PMID:25616768
    reference_title: "Genetics and Disease Expression in the CNGA3 Form of Achromatopsia: Steps on the Path to Gene Therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retinal structure in CNGA3 ACHM patients revealed persistent but abnormal foveal cones."
    explanation: Confirms the presence of structurally abnormal but persistent foveal cones in CNGA3-achromatopsia.
- category: Eye
  name: Abnormal Cone Electroretinogram
  description: >-
    Full-field ERG shows absent or markedly diminished photopic responses,
    including the 30-Hz flicker response. Scotopic responses are normal or may
    be mildly abnormal, so rod function should not be described as uniformly
    intact.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Abnormal electroretinogram
    term:
      id: HP:0000512
      label: Abnormal electroretinogram
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The photopic response (including the 30-Hz flicker response) is absent or markedly diminished; the scotopic response is normal or mildly abnormal."
    explanation: Defines the characteristic abnormal cone ERG and the possible mild rod-response abnormality.
- category: Eye
  name: Central Scotoma
  description: >-
    A small central visual-field defect can be demonstrated in some individuals,
    although nystagmus and unsteady fixation can make it difficult to measure.
  phenotype_term:
    preferred_term: Central scotoma
    term:
      id: HP:0000603
      label: Central scotoma
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1418/
    reference_title: Achromatopsia - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Small central scotomas can be demonstrated in some individuals by careful testing."
    explanation: Supports central scotoma as a variable, not universal, visual-field finding.

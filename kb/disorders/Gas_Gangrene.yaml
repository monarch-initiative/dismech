name: Gas Gangrene
creation_date: "2026-09-25T18:27:16Z"
category: Infectious Disease
disease_term:
  preferred_term: gas gangrene
  term:
    id: MONDO:0005767
    label: gas gangrene
description: >-
  Gas gangrene, or clostridial myonecrosis, is a rapidly progressive
  toxin-mediated soft-tissue infection caused mainly by Clostridium perfringens
  after trauma or surgery and less often by spontaneous Clostridium septicum
  infection in immunosuppressed or malignancy-associated settings.
parents:
- bacterial infectious disease with sepsis
- commensal bacterial infectious disease
- infection due to clostridium perfringens
- skin disease caused by bacterial infection
- vesiculobullous skin disease
synonyms:
- clostridial myonecrosis
infectious_agent:
- name: Clostridium perfringens
  infectious_agent_term:
    preferred_term: Clostridium perfringens
    term:
      id: NCBITaxon:1502
      label: Clostridium perfringens
  description: >-
    An anaerobic spore-forming bacterium whose alpha-toxin and theta-toxin drive
    the traumatic and postsurgical forms of clostridial myonecrosis.
  evidence:
  - reference: PMID:7746141
    reference_title: "Virulence studies on chromosomal alpha-toxin and theta-toxin mutants constructed by allelic exchange provide genetic evidence for the essential role of alpha-toxin in Clostridium perfringens-mediated gas gangrene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The pathogenesis of clostridial myonecrosis, or gas gangrene, involves the growth of the anaerobic bacterium Clostridium perfringens in the infected tissues and the elaboration of numerous extracellular toxins and enzymes."
    explanation: Establishes C. perfringens as the canonical clostridial species in experimentally modeled gas gangrene.
  - reference: PMID:18034207
    reference_title: "Neuromuscular and central nervous system manifestations of Clostridium perfringens infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Neuromuscular manifestations of C. perfringens infections are much more frequent than CNS manifestations and comprise myonecrosis (gas gangrene), rhabdomyolysis, myositis, fasciitis, affection of the neuromuscular transmission, or affection of the peripheral nerves."
    explanation: Supports C. perfringens gas gangrene in human infection.
- name: Clostridium septicum
  infectious_agent_term:
    preferred_term: Clostridium septicum
    term:
      id: NCBITaxon:1504
      label: Clostridium septicum
  description: >-
    An anaerobic clostridial species that causes rare spontaneous gas gangrene
    associated with malignancy or immunosuppression.
  evidence:
  - reference: PMID:18555761
    reference_title: "Successful management of spontaneous Clostridium septicum myonecrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous Clostridium septicum myonecrosis, or gas gangrene, is an extremely rare soft tissue infection associated with malignancy and immunosuppression."
    explanation: Identifies C. septicum as a cause of spontaneous gas gangrene in a human clinical report.
transmission:
- name: Traumatic, postsurgical, or spontaneous clostridial seeding
  description: >-
    C. perfringens infection usually begins at a surgical wound, trauma site, or
    gastrointestinal/urogenital focus, whereas spontaneous C. septicum myonecrosis
    reflects non-traumatic seeding in hosts with malignancy or immunosuppression.
  evidence:
  - reference: PMID:18034207
    reference_title: "Neuromuscular and central nervous system manifestations of Clostridium perfringens infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "C. perfringens infections usually start from the site of a recent surgical wound or trauma, a gastrointestinal or urogenital problem, or occur in association with malignancy."
    explanation: Supports surgical, traumatic, enteric, urogenital, and malignancy-associated portals for C. perfringens infection.
  - reference: PMID:18555761
    reference_title: "Successful management of spontaneous Clostridium septicum myonecrosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous Clostridium septicum myonecrosis, or gas gangrene, is an extremely rare soft tissue infection associated with malignancy and immunosuppression."
    explanation: Supports the atraumatic C. septicum branch of gas gangrene.
pathophysiology:
- name: Anaerobic clostridial toxin production in infected muscle
  description: >-
    In devitalized or otherwise permissive soft tissue, anaerobic C. perfringens
    proliferates and elaborates extracellular toxins and enzymes that initiate
    rapid skeletal-muscle necrosis.
  evidence:
  - reference: PMID:7746141
    reference_title: "Virulence studies on chromosomal alpha-toxin and theta-toxin mutants constructed by allelic exchange provide genetic evidence for the essential role of alpha-toxin in Clostridium perfringens-mediated gas gangrene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The pathogenesis of clostridial myonecrosis, or gas gangrene, involves the growth of the anaerobic bacterium Clostridium perfringens in the infected tissues and the elaboration of numerous extracellular toxins and enzymes."
    explanation: Links C. perfringens proliferation and exotoxin release to clostridial myonecrosis.
- name: Alpha-toxin membrane injury
  description: >-
    C. perfringens alpha-toxin is a phospholipase C/sphingomyelinase that binds
    target-cell membranes through its C-terminal domain and triggers membrane
    lipid turnover, endocytosis, and cell death.
  evidence:
  - reference: PMID:26633512
    reference_title: "Membrane-Binding Mechanism of Clostridium perfringens Alpha-Toxin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alpha-toxin possesses phospholipase C and sphingomyelinase activities. The
      toxin is composed of an N-terminal domain (1-250 aa, N-domain), which is
      the catalytic site, and a C-terminal domain (251-370 aa, C-domain), which
      is the membrane-binding site.
    explanation: Supports alpha-toxin as a two-domain membrane-active enzyme in gas gangrene.
  - reference: PMID:7746141
    reference_title: "Virulence studies on chromosomal alpha-toxin and theta-toxin mutants constructed by allelic exchange provide genetic evidence for the essential role of alpha-toxin in Clostridium perfringens-mediated gas gangrene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The results showed that the plc mutants had demonstrably reduced virulence and therefore provided definitive genetic evidence for the essential role of alpha-toxin in gas gangrene or clostridial myonecrosis."
    explanation: Provides allelic-exchange evidence that the alpha-toxin gene plc is required for full gas-gangrene virulence.
- name: Alpha-toxin and theta-toxin vascular leukostasis
  description: >-
    Alpha-toxin and perfringolysin O act together to produce vascular leukostasis;
    toxin-damaged endothelium, platelet aggregation, leukocyte trapping, capillary
    leak, and impaired oxygen delivery create a self-amplifying anaerobic and
    necrotic muscle compartment.
  evidence:
  - reference: PMID:10456947
    reference_title: "Use of genetically manipulated strains of Clostridium perfringens reveals that both alpha-toxin and theta-toxin are required for vascular leukostasis to occur in experimental gas gangrene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, both alpha-toxin and theta-toxin are necessary for the characteristic vascular leukostasis observed in clostridial myonecrosis."
    explanation: Supports the need for both major toxins in the leukostasis branch of experimental gas gangrene.
  - reference: PMID:11111933
    reference_title: "The pathogenesis of clostridial myonecrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Toxin-induced endothelial dysfunction and microvascular injury could also
      cause loss of albumin, electrolytes, and water into the interstitial space
      resulting in marked localized edema. These events, combined with
      intravascular platelet aggregation and leukostasis, would increase venous
      pressures and favor further loss of fluid and protein in the distal
      capillary bed.
    explanation: Connects endothelial injury, platelet aggregation, leukostasis, capillary leak, and edema in clostridial myonecrosis.
- name: Systemic shock and hemolysis
  description: >-
    Absorbed clostridial toxins can enter the systemic circulation, causing shock
    and multiorgan failure; in severe C. perfringens sepsis, alpha-toxin can lyse
    erythrocyte membranes and produce massive intravascular hemolysis.
  evidence:
  - reference: PMID:11111933
    reference_title: "The pathogenesis of clostridial myonecrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When toxins reach arterial circulation, systemic shock and multiorgan failure rapidly ensue, and death is common."
    explanation: Supports systemic shock as a consequence of circulating clostridial toxins.
  - reference: PMID:27049736
    reference_title: "Clostridium Perfringens Infection in a Febrile Patient with Severe Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While C. perfringens sepsis is uncommon, it is often rapidly fatal because
      the alpha toxin of this bacterium induces massive intravascular hemolysis
      by disrupting red blood cell membranes.
    explanation: Supports alpha-toxin-mediated intravascular hemolysis as a severe systemic C. perfringens branch.
phenotypes:
- name: Pain
  phenotype_term:
    preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
  description: Pain is part of the acute local gas-gangrene presentation.
  evidence:
  - reference: PMID:26633512
    reference_title: "Membrane-Binding Mechanism of Clostridium perfringens Alpha-Toxin."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Clostridium perfringens alpha-toxin is a key mediator of gas gangrene, which is a life-threatening infection that manifests as fever, pain, edema, myonecrosis, and gas production."
    explanation: Lists pain among the recognized gas-gangrene manifestations.
- name: Edema
  phenotype_term:
    preferred_term: Edema
    term:
      id: HP:0000969
      label: Edema
  description: Progressive local edema follows toxin-induced vascular leak in clostridial myonecrosis.
  evidence:
  - reference: PMID:11111933
    reference_title: "The pathogenesis of clostridial myonecrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Similarly, the direct cytotoxicity of PFO could disrupt endothelial integrity and contribute to progressive edema both locally and systemically."
    explanation: Supports edema as a toxin-mediated manifestation of clostridial myonecrosis.
- name: Shock
  phenotype_term:
    preferred_term: Shock
    term:
      id: HP:0031273
      label: Shock
  description: Septic shock occurs when clostridial toxins and infection become systemic.
  evidence:
  - reference: PMID:11111933
    reference_title: "The pathogenesis of clostridial myonecrosis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "When toxins reach arterial circulation, systemic shock and multiorgan failure rapidly ensue, and death is common."
    explanation: Supports shock as a systemic consequence of toxin spread.
- name: Hemolytic anemia
  phenotype_term:
    preferred_term: Hemolytic anemia
    term:
      id: HP:0001878
      label: Hemolytic anemia
  description: Massive intravascular hemolysis can complicate severe C. perfringens sepsis.
  evidence:
  - reference: PMID:27049736
    reference_title: "Clostridium Perfringens Infection in a Febrile Patient with Severe Hemolytic Anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While C. perfringens sepsis is uncommon, it is often rapidly fatal because
      the alpha toxin of this bacterium induces massive intravascular hemolysis
      by disrupting red blood cell membranes.
    explanation: Supports hemolytic anemia as a rare but severe alpha-toxin-mediated complication.
treatments:
- name: Radical surgical debridement
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  description: Gas gangrene requires urgent radical debridement of necrotic infected tissue.
  evidence:
  - reference: PMID:18034207
    reference_title: "Neuromuscular and central nervous system manifestations of Clostridium perfringens infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of choice is surgical debridement of the infectious focus with
      radical removal of all necrotic tissue, resection of the corresponding
      lymphatics in addition to antibiotic therapy with penicillin G,
      aminoglycosides, or clindamycin or hyperbaric oxygenation.
    explanation: Supports surgical debridement as the central source-control treatment for C. perfringens gas gangrene.
- name: Antibiotic therapy
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  description: >-
    Antibiotic therapy complements source control, with toxin-suppressing agents
    such as clindamycin suppressing alpha-toxin activity better than penicillin alone
    in experimental C. perfringens gas gangrene.
  evidence:
  - reference: PMID:18034207
    reference_title: "Neuromuscular and central nervous system manifestations of Clostridium perfringens infections."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment of choice is surgical debridement of the infectious focus with
      radical removal of all necrotic tissue, resection of the corresponding
      lymphatics in addition to antibiotic therapy with penicillin G,
      aminoglycosides, or clindamycin or hyperbaric oxygenation.
    explanation: Supports antibiotics alongside radical surgery in gas-gangrene management.
  - reference: PMID:2882731
    reference_title: "Effect of antibiotics on toxin production and viability of Clostridium perfringens."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Because antibiotic efficacy did not correlate with bactericidal activity,
      we measured alpha-toxin activity and found complete suppression of
      alpha-toxin activity by tetracycline, metronidazole, rifampin, clindamycin,
      and chloramphenicol at concentrations equal to the MIC.
    explanation: Supports toxin suppression as the rationale for protein-synthesis-inhibiting antibiotics in experimental gas gangrene.

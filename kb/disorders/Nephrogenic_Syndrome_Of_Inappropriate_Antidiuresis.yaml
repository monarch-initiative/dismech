genetic:
- name: AVPR2 activating variants
  gene_term:
    preferred_term: AVPR2
    term:
      id: hgnc:897
      label: AVPR2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: X-linked recessive inheritance
    inheritance_term:
      preferred_term: X-linked recessive inheritance
      term:
        id: HP:0001419
        label: X-linked recessive inheritance
    description: >-
      Hemizygous males are affected and present in infancy; heterozygous female
      carriers are variably affected, from asymptomatic to symptomatic. De novo
      occurrence is documented (R137L in one of the two original probands).
    evidence:
    - reference: PMID:15872203
      reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        DNA sequencing of each patient's V2R gene (AVPR2) identified missense mutations
        in both, with resultant changes in codon 137 from arginine to cysteine or
        leucine.
      explanation: >-
        The X-linked AVPR2 gene and the founding codon-137 alleles in two affected
        males.
  variants:
  - name: R137C
    description: >-
      Arginine-137-to-cysteine, one of the two founding alleles; constitutively
      activating. Reported inherited from a carrier mother in the original NSIAD
      family.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15872203
      reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        changes in codon 137 from arginine to cysteine or leucine
      explanation: Reports R137C as one of the two founding NSIAD alleles.
  - name: R137L
    description: >-
      Arginine-137-to-leucine, the second founding allele; constitutively activating
      and de novo in the original report.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:15872203
      reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        changes in codon 137 from arginine to cysteine or leucine
      explanation: Reports R137L as the second founding NSIAD allele.
  - name: F229V
    description: >-
      Phenylalanine-229-to-valine, a transmembrane substitution found in a 3-month-old
      hyponatremic infant. In vitro it gives high constitutive activity without
      spontaneous desensitization, and is silenced by V2R inverse agonists.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:22956819
      reference_title: Identification and characterization of an activating F229V substitution in the V2 vasopressin receptor in an infant with NSIAD.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Characterization of this substitution in vitro revealed that it leads to high
        constitutive activity of the receptor, compatible with spontaneous antidiuresis.
      explanation: Functional characterization of F229V as a gain-of-function allele.
  - name: I130N
    description: >-
      Isoleucine-130-to-asparagine, identified in a family; constitutively active with
      a biased conformation and ligand-independent internalization, and sensitive to
      tolvaptan in cells.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:26131744
      reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This I130N mutation resulted in constitutive activity of the V2R with
        constitutive cyclic adenosine monophosphate (cAMP) generation in HEK293 cells.
      explanation: Functional characterization of I130N as a gain-of-function allele.
  - name: L312S
    description: >-
      Leucine-312-to-serine in the seventh transmembrane domain, found in a boy with
      water-induced hyponatremic seizures and in his asymptomatic heterozygous mother.
      Constitutive cAMP without constitutive beta-arrestin recruitment, normal surface
      expression, and constitutive signalling reduced by tolvaptan.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:27355191
      reference_title: Mutations of Vasopressin Receptor 2 Including Novel L312S Have Differential Effects on Trafficking.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We show that, compared with wild-type V2R, the L312S mutation results in the
        constitutive production of cAMP, indicative of the gain-of-function NSIAD
        profile.
      explanation: Functional characterization of L312S as a gain-of-function allele.
  notes: >-
    MONDO:0010356 is AVPR2-defined, so AVPR2 is the sole causative gene recorded here.
    A separate germline gain-of-function cause has since been described in GNAS (Gsalpha):
    whole-exome sequencing of two families with dominantly inherited NSIAD, after
    excluding an AVPR2 variant, found GNAS-Gsalpha p.(F68_G70del) and p.(M255V), with
    effects milder than the somatic Gsalpha variants of McCune-Albright syndrome
    (PMID:30962325). Because Gsalpha is downstream of AVPR2 in the same cascade, the
    GNAS form produces the same antidiuretic phenotype through a shared mechanism; it is
    kept out of this AVPR2-defined entry and recorded as a differential cause. See
    differential_diagnoses.
inheritance:
- name: X-linked recessive inheritance
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    X-linked disorder of AVPR2 on Xq28. Hemizygous males present in infancy; carrier
    females are variably affected; de novo variants occur. The "recessive" label is
    imperfect: symptomatic female probands are described, and carrier females can have
    episodic, usually incidentally found hyponatremia, so the distinction between carrier
    and affected is blurred.
  evidence:
  - reference: PMID:29472987
    reference_title: Adult female with symptomatic AVPR2-related nephrogenic syndrome of inappropriate antidiuresis (NSIAD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Female carriers may present with episodes of hyponatremia, usually found
      incidentally.
    explanation: Carrier females are not reliably asymptomatic - they can have episodic hyponatremia.
  - reference: PMID:15872203
    reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing of each patient's V2R gene (AVPR2) identified missense mutations
      in both, with resultant changes in codon 137 from arginine to cysteine or
      leucine.
    explanation: The X-linked AVPR2 gene underlying the inheritance pattern.
environmental:
- name: Free water load (excess hypotonic fluid intake)
  description: >-
    An exogenous water load - heavy drinking in hot weather or during sport,
    hypotonic feeds in infants, or excessive intravenous hypotonic fluid in hospital -
    is the precipitant that turns the fixed antidiuretic defect into measured
    hyponatremia. The genotype sets the inability to excrete free water; the load
    supplies the water.
  evidence:
  - reference: PMID:29472987
    reference_title: Adult female with symptomatic AVPR2-related nephrogenic syndrome of inappropriate antidiuresis (NSIAD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important to counsel patients on appropriate daily fluid volume intake and
      to ensure that episodes of fluid overload can be avoided, such as increased fluid
      intake in summertime or during sports activities or excessive intravenous fluid
      administration during hospital admissions.
    explanation: Names the fluid-overload situations that precipitate hyponatremia in NSIAD.
  influences_mechanisms:
  - target: Free Water Retention
    environmental_effect: EXACERBATES
    causal_link_type: DIRECT
    description: >-
      A water load exceeding the reduced free-water excretory capacity is what converts
      the ongoing antidiuresis into net water retention and hyponatremia.
    evidence:
    - reference: PMID:20631022
      reference_title: "Familial nephrogenic syndrome of inappropriate antidiuresis: dissociation between aquaporin-2 and vasopressin excretion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        it induced hyponatremia in all NSIAD patients
      explanation: Water loading induced hyponatremia across NSIAD patients, establishing the load as the precipitant.
diagnosis:
- name: Water load test with AVP or copeptin measurement
  presence: PRESENT
  description: >-
    The functional test that separates NSIAD from SIADH: an oral water load that the
    patient cannot normally excrete, with a plasma AVP (or copeptin, as a surrogate)
    that is low or undetectable rather than inappropriately present. A diagnostic
    pitfall is that persistent AVPR2 activation can desensitize the downstream pathway,
    so urine osmolality after water deprivation can be as low as 241 mOsm/kg and may
    obscure the picture.
  evidence:
  - reference: PMID:29472987
    reference_title: Adult female with symptomatic AVPR2-related nephrogenic syndrome of inappropriate antidiuresis (NSIAD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A water load test may be informative, and measurement of co-peptin levels may be
      considered, in substitution for direct measurement of AVP, to aid diagnosis and
      guide diagnostic sequencing of AVPR2.
    explanation: The diagnostic test and the copeptin surrogate, as the source frames them.
  - reference: PMID:22154540
    reference_title: A family with hyponatremia and the nephrogenic syndrome of inappropriate antidiuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urine osmolality was as low as 241 mOsm/kg (241 mmol/kg) in patients, which could
      obfuscate the diagnosis.
    explanation: The desensitization pitfall - urine osmolality can fall low enough to mislead.
- name: AVPR2 sequencing
  presence: PRESENT
  description: >-
    Molecular confirmation. A water load test consistent with nephrogenic antidiuresis
    guides sequencing of AVPR2 to identify the activating variant.
  evidence:
  - reference: PMID:29472987
    reference_title: Adult female with symptomatic AVPR2-related nephrogenic syndrome of inappropriate antidiuresis (NSIAD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A water load test demonstrated an inability to dilute urine and gene sequencing
      confirmed a recurrent activating mutation in AVPR2.
    explanation: Sequencing of AVPR2 as the confirmatory step after the functional test.
treatments:
- name: Fluid restriction
  description: >-
    Long-term regulation of fluid intake is the mainstay and is well tolerated, since
    thirst is reduced in NSIAD relative to other causes of SIADH. Because the lesion is
    a fixed inability to excrete free water, limiting intake prevents the water load
    that precipitates hyponatremia.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Fluid restriction
  target_mechanisms:
  - target: Free Water Retention
    description: Reducing water intake keeps intake below the reduced free-water excretory capacity.
    evidence:
    - reference: PMID:22722264
      reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        long-term fluid restriction (FR) and treatment with low doses of urea are
        efficient and well tolerated
      explanation: Reports fluid restriction as effective, well-tolerated long-term management.
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NSIAD may differ from other causes of syndrome of inappropriate antidiuretic
      hormone secretion by reduction of thirst intensity due to lower levels of AVP
    explanation: >-
      Explains why fluid restriction is tolerated in NSIAD - thirst is reduced because
      vasopressin, which stimulates thirst, is low.
- name: Oral urea
  description: >-
    Low-dose oral urea induces an osmotic diuresis that offloads free water and
    corrects hyponatremia. It is effective in both children and adults, and episodic
    dosing suffices for some patients.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: urea
      term:
        id: CHEBI:16199
        label: urea
  target_mechanisms:
  - target: Free Water Retention
    description: Osmotic diuresis from urea increases free-water excretion.
    evidence:
    - reference: PMID:22722264
      reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Six of the patients received urea with no reported failure to correct hyponatremia
      explanation: Reports urea correcting hyponatremia across treated patients.
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NSIAD is quite easy to treat with FR and urea in adults as well as in children,
      with good compliance and efficacy.
    explanation: Reports urea plus fluid restriction as effective in children and adults.
- name: Vasopressin receptor antagonists (vaptans)
  description: >-
    V2R inverse agonists silence the constitutive signalling of some mutant receptors
    in vitro (tolvaptan and satavaptan fully silence F229V; tolvaptan blocks I130N),
    making them a mechanistically targeted option. Clinical benefit is allele-dependent
    and not assured - the one clinical report in which vaptans were given (to patients
    not known to carry a vaptan-responsive allele) found no efficacy - so cellular
    reversibility should not be assumed to predict a response in every patient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tolvaptan
      term:
        id: CHEBI:32246
        label: tolvaptan
    - preferred_term: satavaptan
      term:
        id: CHEBI:194402
        label: satavaptan
  target_mechanisms:
  - target: Ligand-Independent V2 Receptor Activation
    description: >-
      Inverse agonists shift the receptor equilibrium back toward the inactive state
      for alleles whose active conformation is not locked.
    evidence:
    - reference: PMID:22956819
      reference_title: Identification and characterization of an activating F229V substitution in the V2 vasopressin receptor in an infant with NSIAD.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the V2R-selective inverse agonists tolvaptan and satavaptan completely silenced
        the constitutive signaling activity of the F229V mutant receptor
      explanation: Demonstrates pharmacologic reversal of the activating lesion in vitro for F229V.
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The AVPR2 antagonists tolvaptan and satavaptan (prescribed before the diagnosis of
      NSIAD was made) showed no efficacy in 1 patient.
    explanation: The one clinical datum on vaptans in NSIAD, a non-response, tempering the in-vitro promise.
- name: Furosemide with sodium chloride supplementation
  description: >-
    Proposed for refractory cases by analogy with its use in SIADH; loop diuresis with
    salt replacement increases free-water clearance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: furosemide
      term:
        id: CHEBI:47426
        label: furosemide
    - preferred_term: sodium chloride
      term:
        id: CHEBI:26710
        label: sodium chloride
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      furosemide (associated with NaCl supplementation) would represent a valuable
      therapeutic option
    explanation: Reports furosemide plus NaCl as a proposed option for refractory cases.
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      5 received NaCl supplementation with varying efficacy
    explanation: NaCl supplementation alone had inconsistent effect across reported patients.
  - reference: PMID:29472987
    reference_title: Adult female with symptomatic AVPR2-related nephrogenic syndrome of inappropriate antidiuresis (NSIAD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to lack of consistent improvement, she underwent a trial of demeclocycline,
      but again with limited sustained benefit.
    explanation: Demeclocycline, tried in an adult proband, gave limited benefit.
experimental_models:
- name: HEK293 cells expressing mutant V2 receptor
  experimental_model_type: CELL_LINE
  description: >-
    Transfected human embryonic kidney (HEK293) cells expressing the I130N, F229V or
    R137C/L mutant V2 receptor, the system in which constitutive cAMP generation,
    biased signalling, ligand-independent internalization, and inverse-agonist
    responsiveness were measured.
  modeled_mechanisms:
  - target: Constitutive Adenylyl Cyclase cAMP Generation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Directly measures the ligand-independent cAMP output of the mutant receptor.
    limitations: >-
      A heterologous cell line overexpressing the receptor; it reports receptor
      signalling but not the collecting-duct water handling or whole-body osmoregulation
      that produce the clinical phenotype.
    readouts:
    - name: Basal intracellular cAMP
      target: Constitutive Adenylyl Cyclase cAMP Generation
      direction: INCREASED
      interpretation: Constitutive cAMP generation by the mutant receptor without agonist.
      evidence:
      - reference: PMID:26131744
        reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          This I130N mutation resulted in constitutive activity of the V2R with
          constitutive cyclic adenosine monophosphate (cAMP) generation in HEK293 cells.
        explanation: The cAMP measurement grounding the readout.
    evidence:
    - reference: PMID:26131744
      reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This basal activity could be blocked by the inverse agonist tolvaptan
      explanation: >-
        The cell system is where the constitutive activity and its pharmacologic
        reversal were established.
differential_diagnoses:
- name: Syndrome of inappropriate antidiuretic hormone secretion (SIADH)
  description: >-
    The acquired phenocopy. SIADH shows the same hypotonic hyponatremia with
    concentrated urine, but vasopressin is inappropriately present rather than
    suppressed; NSIAD has low or undetectable vasopressin. A water load test with AVP
    or copeptin measurement is the reported way to distinguish them (see diagnosis).
- name: GNAS-related inappropriate antidiuresis
  description: >-
    A distinct germline gain-of-function cause in GNAS (Gsalpha), downstream of AVPR2 in
    the same cascade, producing an indistinguishable antidiuretic phenotype with a
    normal AVPR2 sequence. Described as dominantly inherited (PMID:30962325). Kept
    separate from this AVPR2-defined entry.

notes: >-
  NSIAD is the gain-of-function counterpart of X-linked nephrogenic diabetes insipidus
  (kb/disorders/X-Linked_Nephrogenic_Diabetes_Insipidus.yaml); both act at AVPR2 on
  Xq28 but in opposite directions, and codon 137 carries alleles of both signs (R137H
  loss-of-function causes NDI; R137C/R137L gain-of-function cause NSIAD). Lump/split:
  curated as a single AVPR2-defined disease at the MONDO:0010356 level. The recognized
  alleles (R137C, R137L, F229V, I130N) differ in receptor-regulation behaviour -
  R137C/L desensitize, F229V does not, I130N is biased and internalizes - but share one
  mechanism and one clinical picture, so they are carried as variants rather than as
  subtypes. The GNAS (Gsalpha) gain-of-function form (PMID:30962325) is a separate
  genetic cause of the same antidiuretic phenotype and is recorded as a differential
  rather than folded in, because the MONDO term is AVPR2-defined. No GeneReviews chapter
  exists for NSIAD (checked offline against the committed Bookshelf index).

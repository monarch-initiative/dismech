name: Nephrogenic Syndrome of Inappropriate Antidiuresis
creation_date: "2026-10-15T00:00:00Z"
description: >-
  Nephrogenic syndrome of inappropriate antidiuresis (NSIAD) is the gain-of-function
  mirror of X-linked nephrogenic diabetes insipidus. Constitutively activating
  missense variants in AVPR2, which encodes the arginine vasopressin V2 receptor of
  the renal collecting duct, make the receptor signal without its hormone. The
  principal cell therefore runs its Gs/adenylyl cyclase/cAMP/protein-kinase-A
  cascade, phosphorylates aquaporin-2 and shuttles it to the apical membrane, and
  reabsorbs free water even when circulating vasopressin is low or undetectable. The
  clinical picture reproduces the syndrome of inappropriate antidiuretic hormone
  secretion (SIADH) - hypotonic hyponatremia with inappropriately concentrated urine
  - but with suppressed rather than inappropriate hormone secretion, which is the
  feature that distinguishes it. It was first described by Feldman and colleagues in
  2005 in two male infants with undetectable vasopressin who carried missense changes
  at codon 137 of the receptor, the same codon whose loss-of-function allele (R137H)
  causes nephrogenic diabetes insipidus. The disorder is X-linked: hemizygous males
  present in infancy with symptomatic hyponatremia - hypotonia, irritability,
  vomiting and seizures - while female carriers are variably affected. Because the lesion is a
  fixed inability to excrete free water rather than hormone excess, hyponatremia
  appears only with a water load and is managed with fluid restriction and oral urea.
categories:
- Mendelian
- Renal Tubular Disorder
synonyms:
- NSIAD
- nephrogenic syndrome of inappropriate antidiuresis, X-linked recessive
- nephrogenic SIAD
- AVPR2-related nephrogenic syndrome of inappropriate antidiuresis
parents:
- inherited renal tubular disease
- X-linked disease

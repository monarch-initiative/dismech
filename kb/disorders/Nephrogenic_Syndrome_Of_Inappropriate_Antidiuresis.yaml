pathophysiology:
- name: AVPR2 Gain-of-Function Variant
  description: >-
    A hemizygous germline missense variant in AVPR2 on Xq28, the gene encoding the
    arginine vasopressin V2 receptor. The reported alleles are a small set of
    activating substitutions: the two original codon-137 changes (arginine to
    cysteine, R137C, and to leucine, R137L), the transmembrane substitution F229V,
    and I130N. Codon 137 shows allelic opposition - R137H at the same residue is
    loss-of-function and causes X-linked nephrogenic diabetes insipidus, whereas
    R137C and R137L are gain-of-function.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: arginine vasopressin V2 receptor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005000
      label: vasopressin receptor activity
  genetic_context:
    gene:
      preferred_term: AVPR2
      term:
        id: hgnc:897
        label: AVPR2
    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Hemizygous in affected males. One original proband inherited R137C from a
      carrier mother and the other's R137L arose de novo. Heterozygous females are
      variably affected.
  downstream:
  - target: Ligand-Independent V2 Receptor Activation
    causal_link_type: DIRECT
    description: >-
      The activating substitutions let the receptor adopt an active conformation in
      the absence of vasopressin.
    evidence:
    - reference: PMID:15872203
      reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These novel mutations cause constitutive activation of the receptor and are
        the likely cause of the patients' SIADH-like clinical picture
      explanation: >-
        Establishes that the codon-137 variants activate the receptor
        constitutively, the molecular lesion that initiates the chain.
  evidence:
  - reference: PMID:15872203
    reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA sequencing of each patient's V2R gene (AVPR2) identified missense mutations
      in both, with resultant changes in codon 137 from arginine to cysteine or
      leucine.
    explanation: Reports the two founding AVPR2 gain-of-function alleles, R137C and R137L.
  - reference: PMID:22956819
    reference_title: Identification and characterization of an activating F229V substitution in the V2 vasopressin receptor in an infant with NSIAD.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe a 3-month-old hyponatremic infant found to have a
      phenylalanine 229 to valine (F229V) substitution in V2R.
    explanation: Adds F229V as a third activating AVPR2 allele outside codon 137.
  - reference: PMID:26131744
    reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we present a newly identified I130N substitution in exon 2 of the V2R gene
      in a family, causing NSIAD.
    explanation: Adds I130N as a fourth activating AVPR2 allele.
- name: Ligand-Independent V2 Receptor Activation
  description: >-
    The mutant V2 receptor is held in an active conformation and transduces signal
    without bound vasopressin. For F229V the active state is not locked - V2R-selective
    inverse agonists silence it - so the gain of function is a shifted equilibrium
    rather than an irreversible lock.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: V2 vasopressin receptor activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005000
      label: vasopressin receptor activity
  downstream:
  - target: Constitutive Adenylyl Cyclase cAMP Generation
    causal_link_type: DIRECT
    description: The active receptor couples to Gs and stimulates adenylyl cyclase.
  - target: Constitutive V2 Receptor Internalization
    causal_link_type: DIRECT
    description: >-
      The biased active conformation also drives ligand-independent endocytosis of
      the receptor, a parallel consequence of the activating lesion.
  evidence:
  - reference: PMID:22956819
    reference_title: Identification and characterization of an activating F229V substitution in the V2 vasopressin receptor in an infant with NSIAD.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to R137C/L mutant receptors, F229V receptors do not undergo
      spontaneous desensitization, which results in sustained, high basal activity.
    explanation: >-
      Distinguishes the receptor-regulation behaviour of the activating alleles - a
      sustained active state for F229V versus the desensitizing R137C/L receptors.
- name: Constitutive V2 Receptor Internalization
  description: >-
    The I130N receptor adopts a biased conformation whose basal activity does not
    recruit beta-arrestin, yet the receptor is constitutively internalized through a
    dynamin-dependent, beta-arrestin-independent route. This ligand-independent
    endocytosis lowers cell-surface receptor and is mechanistically separable from the
    cAMP output, and it is the receptor-trafficking counterpart of the misfolding
    retention seen with loss-of-function AVPR2 alleles.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: constitutive G protein-coupled receptor internalization
    modifier: INCREASED
    term:
      id: GO:0002031
      label: G protein-coupled receptor internalization
  evidence:
  - reference: PMID:26131744
    reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The constitutive activity of the mutant receptor caused constitutive
      dynamin-dependent and β-arrestin-independent internalization.
    explanation: Reports the ligand-independent internalization branch for the I130N receptor.
  - reference: PMID:26131744
    reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation causes a biased receptor conformation as the basal cAMP generation
      activity of I130N does not lead to interaction with β-arrestin.
    explanation: >-
      Supports the biased-signalling character of the basal active state behind the
      beta-arrestin-independent internalization.
- name: Constitutive Adenylyl Cyclase cAMP Generation
  description: >-
    In the collecting-duct principal cell the constitutively active receptor drives Gs
    stimulation of adenylyl cyclase and raises intracellular cyclic AMP without
    vasopressin. This was demonstrated directly in transfected cells for the I130N and
    F229V receptors.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  - preferred_term: cAMP biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0006171
      label: cAMP biosynthetic process
  cell_types:
  - preferred_term: kidney collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  locations:
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  downstream:
  - target: PKA-Mediated Aquaporin-2 Phosphorylation
    causal_link_type: DIRECT
    description: Elevated cAMP activates protein kinase A.
  evidence:
  - reference: PMID:26131744
    reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This I130N mutation resulted in constitutive activity of the V2R with
      constitutive cyclic adenosine monophosphate (cAMP) generation in HEK293 cells.
    explanation: Direct demonstration of ligand-independent cAMP generation by a mutant receptor.
  - reference: PMID:22956819
    reference_title: Identification and characterization of an activating F229V substitution in the V2 vasopressin receptor in an infant with NSIAD.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Characterization of this substitution in vitro revealed that it leads to high
      constitutive activity of the receptor, compatible with spontaneous antidiuresis.
    explanation: >-
      A second activating allele showing high constitutive signalling, tied to
      spontaneous antidiuresis.
- name: PKA-Mediated Aquaporin-2 Phosphorylation
  description: >-
    Cyclic-AMP-activated protein kinase A phosphorylates aquaporin-2. This step is
    inferred from established V2-receptor physiology rather than shown in patient
    tissue, but it is the obligate link between the measured cAMP signal and
    water-channel trafficking.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    modifier: INCREASED
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  downstream:
  - target: Apical Aquaporin-2 Membrane Insertion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Phosphorylated aquaporin-2 traffics to and is retained at the apical membrane.
- name: Apical Aquaporin-2 Membrane Insertion
  description: >-
    Phosphorylated aquaporin-2 redistributes from intracellular vesicles into the
    apical plasma membrane of the principal cell, the step that renders the membrane
    water-permeable.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: apical plasma membrane
    term:
      id: GO:0016324
      label: apical plasma membrane
  biological_processes:
  - preferred_term: positive regulation of renal water transport
    modifier: INCREASED
    term:
      id: GO:2001153
      label: positive regulation of renal water transport
  downstream:
  - target: Increased Collecting Duct Water Permeability
    causal_link_type: DIRECT
    description: Apical aquaporin-2 opens a transcellular water pathway.
  evidence:
  - reference: PMID:20631022
    reference_title: "Familial nephrogenic syndrome of inappropriate antidiuresis: dissociation between aquaporin-2 and vasopressin excretion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Water loading was followed by a very slow and incomplete elimination in the
      asymptomatic hemizygous boy with no suppression of AQP2 excretion
    explanation: >-
      Urinary AQP2 excretion is a marker of apical AQP2 trafficking in the collecting
      duct; its failure to suppress after a water load in a hemizygous patient is the
      in-vivo sign that AQP2 stays in the apical membrane without vasopressin.
- name: Increased Collecting Duct Water Permeability
  description: >-
    With aquaporin-2 in the apical membrane the collecting duct epithelium becomes
    water-permeable, allowing water to follow the medullary osmotic gradient
    independently of hormonal command.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: renal water absorption
    modifier: INCREASED
    term:
      id: GO:0070295
      label: renal water absorption
  locations:
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  downstream:
  - target: Ligand-Independent Free Water Reabsorption
    causal_link_type: DIRECT
    description: The permeable duct reabsorbs free water from the tubular lumen.
- name: Ligand-Independent Free Water Reabsorption
  description: >-
    The kidney reabsorbs free water continuously, uncoupled from vasopressin, which is
    the whole-organ consequence of the fixed water permeability.
  biological_scale: ORGANISM
  downstream:
  - target: Inappropriately concentrated urine
    causal_link_type: DIRECT
    description: Continuous water reabsorption leaves the urine concentrated despite plasma hypotonicity.
  - target: Free Water Retention
    causal_link_type: DIRECT
    description: Water that is not excreted is retained in the body.
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gain-of-function mutation of arginine vasopressin receptor type 2 (AVPR2)
      resulting in free water reabsorption and episodes of hyponatremia
    explanation: States the disease-level consequence - free water reabsorption producing hyponatremia.
- name: Free Water Retention
  description: >-
    Retention of electrolyte-free water expands and dilutes total body water. Because
    sodium handling is intact, the result is dilutional rather than a sodium-deficit
    state.
  biological_scale: ORGANISM
  downstream:
  - target: Hypotonic Hyponatremia
    causal_link_type: DIRECT
    description: Dilution of body sodium lowers serum sodium and osmolality.
  - target: Physiologic Suppression of Vasopressin Secretion
    causal_link_type: DIRECT
    description: >-
      Water retention and the fall in plasma osmolality appropriately suppress
      hypothalamic vasopressin release, which is why circulating hormone is low.
- name: Physiologic Suppression of Vasopressin Secretion
  description: >-
    The retained water and low plasma osmolality suppress hypothalamic vasopressin
    output normally. Hormone secretion is therefore appropriately low or undetectable -
    the opposite of SIADH - and the antidiuresis is driven entirely by the receptor.
  biological_scale: ORGANISM
  downstream:
  - target: Decreased circulating antidiuretic hormone concentration
    causal_link_type: DIRECT
    description: The suppressed secretion is measured as low or undetectable plasma vasopressin.
  evidence:
  - reference: PMID:15872203
    reference_title: Nephrogenic syndrome of inappropriate antidiuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two infants whose clinical and laboratory evaluations were
      consistent with the presence of SIADH, yet who had undetectable arginine
      vasopressin (AVP) levels.
    explanation: >-
      The undetectable vasopressin that distinguishes NSIAD from SIADH and reflects
      appropriate physiologic suppression.
- name: Hypotonic Hyponatremia
  description: >-
    Dilutional hyponatremia with low serum osmolality. It is water-load dependent -
    the genotype fixes an inability to excrete free water, so plasma sodium falls only
    when intake exceeds the reduced free-water excretory capacity.
  biological_scale: ORGANISM
  downstream:
  - target: Hyponatremia
    causal_link_type: DIRECT
    description: The measured low serum sodium.
  - target: Low serum osmolality
    causal_link_type: DIRECT
    description: The accompanying fall in serum osmolality.
  - target: Hyponatremic Cerebral Water Shift
    causal_link_type: DIRECT
    description: Plasma hypotonicity drives water into brain cells.
  - target: Malaise
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Nonspecific later-life symptom of chronic/episodic hyponatremia.
  - target: Vertigo
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Dizziness as a later-life hyponatremic symptom.
  - target: Confusion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Confusion as a later-life hyponatremic symptom.
  - target: Fatigue
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Tiredness as a later-life hyponatremic symptom.
  - target: Headache
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Headache as a later-life hyponatremic symptom.
  evidence:
  - reference: PMID:22722264
    reference_title: "Long-term treatment of hyponatremic patients with nephrogenic syndrome of inappropriate antidiuresis: personal experience and review of published case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      gain-of-function mutation of arginine vasopressin receptor type 2 (AVPR2)
      resulting in free water reabsorption and episodes of hyponatremia
    explanation: The disease-level consequence this node models - episodic hyponatremia from free-water reabsorption.
- name: Hyponatremic Cerebral Water Shift
  description: >-
    The osmotic gradient created by plasma hypotonicity drives water into the brain,
    producing cerebral edema and the neurological manifestations seen in symptomatic
    infants.
  biological_scale: ORGANISM
  downstream:
  - target: Seizure
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cerebral edema and the hypotonic state lower the seizure threshold.
  - target: Irritability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Non-specific neurological irritability of acute hyponatremia.
  - target: Hypotonia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Hypotonia in symptomatic hyponatremic infants.
  - target: Vomiting
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Vomiting accompanying acute symptomatic hyponatremia.
  evidence:
  - reference: PMID:26131744
    reference_title: Mutation in the V2 vasopressin receptor gene, AVPR2, causes nephrogenic syndrome of inappropriate diuresis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These receptor mutations lead to hyponatremia, which may lead to clinical
      symptoms in infants.
    explanation: >-
      States the step this node models: the hyponatremia, not the receptor lesion
      itself, is what produces symptoms in infants.

      label: negative regulation of transcription by RNA polymerase II
  cell_types:
  - preferred_term: adrenocortical cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concomitant genetic inactivation of both KDM1A alleles resulted in loss of KDM1A expression in adrenal lesions."
    explanation: Confirms that the two genetic hits translate into actual loss of KDM1A protein in the tissue, which is the step the mechanism depends on.
  downstream:
  - target: Ectopic GIP Receptor Expression in Adrenocortical Cells
    causal_link_type: DIRECT
    description: >-
      GIPR is one of the genes KDM1A represses in adrenocortical cells; losing
      KDM1A derepresses it. The causal direction was tested experimentally rather
      than only inferred from correlation.
- name: Ectopic GIP Receptor Expression in Adrenocortical Cells
  biological_scale: CELLULAR
  description: >-
    The defining lesion of the disease. Adrenocortical cells that have lost KDM1A
    express the glucose-dependent insulinotropic polypeptide receptor (GIPR), a
    receptor they normally do not carry. This was seen as a very large
    upregulation of GIPR transcript in patient lesions relative to controls, and -
    critically for causality - was reproduced prospectively in human adrenocortical
    H295R cells by inhibiting or CRISPR-inactivating KDM1A. That experiment is
    what upgrades the relationship from association to mechanism.
  genes:
  - preferred_term: GIPR
    term:
      id: hgnc:4271
      label: GIPR
  cell_types:
  - preferred_term: adrenocortical cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro pharmacological inhibition and inactivation of KDM1A by CRISPR-Cas9 genome editing resulted in an increase of GIP receptor transcripts and protein in human adrenocortical H295R cells."
    explanation: The prospective in vitro test establishing that loss of KDM1A causes GIPR upregulation, rather than the two merely co-occurring in lesions.
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome is caused by aberrant expression of the GIP receptor in adrenal lesions."
    explanation: States the aberrant GIPR expression as the established proximate cause of the clinical syndrome.
  - reference: PMID:36857084
    reference_title: "Extensive expertise in endocrinology: glucose-dependent insulinotropic peptide-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This resulted from the ectopic expression of non-mutated GIP receptor in the pathological adrenal tissues of those patients."
    explanation: >-
      Establishes that the receptor itself is NOT mutated - the lesion is ectopic
      expression of a normal GIPR, which is why the causal work is done by
      KDM1A-dependent derepression rather than by receptor activation.
  - reference: PMID:36857084
    reference_title: "Extensive expertise in endocrinology: glucose-dependent insulinotropic peptide-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, germline lysine demythylase 1A (KDMIA) mutations combined with somatic chromosome 1p deletions were found to be specifically responsible for ectopic GIPR in sporadic or familial GIP-dependent PBMAH"
    explanation: Independent review confirmation that the germline-plus-somatic KDM1A lesion is what produces the ectopic receptor.
  downstream:
  - target: Meal-Triggered Adenylate Cyclase Activation and Cortisol Synthesis
    causal_link_type: DIRECT
    description: >-
      GIPR is a Gs-coupled receptor, so its ectopic presence hands postprandial
      GIP direct control of the adrenocortical cAMP/PKA steroidogenic pathway.
- name: Meal-Triggered Adenylate Cyclase Activation and Cortisol Synthesis
  biological_scale: CELLULAR
  description: >-
    GIP is an incretin secreted by intestinal K cells in response to nutrient
    intake. Once GIPR is present on adrenocortical cells, each meal delivers a
    Gs-coupled stimulus that raises cAMP and activates protein kinase A - the same
    second-messenger route ACTH normally uses - and drives cortisol biosynthesis.
    The physiological absurdity of the disease is that a normal, healthy
    gut hormone becomes the adrenal secretagogue.
  cell_types:
  - preferred_term: glucocorticoid secreting cell
    term:
      id: CL:0000460
      label: glucocorticoid secreting cell
  biological_processes:
  - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  - preferred_term: cortisol biosynthetic process
    modifier: INCREASED
    term:
      id: GO:0034651
      label: cortisol biosynthetic process
  mechanism_confidence: ESTABLISHED
  notes: >-
    The cAMP/PKA step is standard GIPR receptor biology rather than something
    measured in this disease's own patient material; it is included because it is
    the only route by which a Gs-coupled receptor could produce the observed
    postprandial cortisol rise, but the entry does not cite a
    disease-specific measurement for it.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Food-dependent Cushing's syndrome was present in all patients with KDM1A variants and absent in the 2 other groups."
    explanation: Supports the meal-triggered nature of cortisol secretion in every KDM1A patient; graded PARTIAL because it establishes the food-dependence of the output without measuring the cAMP/PKA step itself.
  downstream:
  - target: Inverted Diurnal Cortisol Rhythm
    causal_link_type: DIRECT
    description: >-
      Because secretion follows meals rather than the circadian ACTH drive, the
      normal morning-high/midnight-low pattern reverses.
  - target: Bilateral Macronodular Adrenocortical Hyperplasia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic trophic cAMP signalling in the adrenal cortex drives the nodular
      hyperplasia that gives the disease its name.
- name: Inverted Diurnal Cortisol Rhythm
  biological_scale: ORGANISM
  description: >-
    The clinical signature, and the reason these patients were historically
    missed. Cortisol is measured in the fasting morning state by convention;
    in AIMAH3 that is precisely the trough. Morning fasting cortisol is
    subnormal while midnight cortisol - after the evening meal - is high. The
    ratio of the two separates FDCS from other PBMAH with reported complete
    discrimination in the derivation cohort.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In accordance with FDCS pathophysiology, patients with KDM1A variants had a lower morning fasting plasma cortisol (192 nmol/L vs 407 and 428, respectively, P = .0003) and a higher midnight plasma cortisol (487 nmol/L vs 297 and 171.96, respectively, P = .0004)."
    explanation: Directly measures the inversion, with the comparison groups that make it specific to KDM1A carriers.
  downstream:
  - target: ACTH-Independent Hypercortisolism
    causal_link_type: DIRECT
    description: >-
      Total daily cortisol output is raised despite the low morning value, which
      is what produces clinical Cushing syndrome.
- name: Bilateral Macronodular Adrenocortical Hyperplasia
  biological_scale: TISSUE
  description: >-
    Sustained receptor-driven stimulation of both adrenal cortices produces the
    bilateral macronodular enlargement that names the disease. Bilaterality is
    itself a mechanistic clue: it was the observation that prompted the search for
    a germline predisposition rather than a sporadic somatic driver, since two
    independent unilateral events would be improbable.
  cell_types:
  - preferred_term: adrenocortical cell
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bilateral nature of this disease suggests germline genetic predisposition."
    explanation: Records the bilaterality of the hyperplasia and the inference it licensed, which is the reasoning that led to KDM1A.
  downstream:
  - target: ACTH-Independent Hypercortisolism
    causal_link_type: DIRECT
    description: >-
      Expanded steroidogenic tissue mass amplifies the cortisol output produced by
      each postprandial stimulus.
- name: ACTH-Independent Hypercortisolism
  biological_scale: ORGANISM
  description: >-
    Autonomous adrenal cortisol production suppresses pituitary corticotrophs, so
    plasma ACTH is low or undetectable - the feature that classifies the syndrome
    as ACTH-independent and distinguishes it from Cushing disease. Twenty-four-hour
    urinary free cortisol, which integrates across meals and so is not fooled by
    the inverted rhythm, is markedly raised, and is higher in KDM1A carriers than
    in either ARMC5-mutant or genetically unexplained PBMAH.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM1A patients had a higher 24-h urinary free cortisol (3.0-fold upper limit of normal vs 1.36 for ARMC5 patients and 0.66 for wild-type patients, respectively, P = .0001)."
    explanation: Quantifies the integrated cortisol excess and shows it is greater in KDM1A carriers than in the other PBMAH molecular groups.
  downstream:
  - target: Glucocorticoid Excess Tissue Injury
    causal_link_type: DIRECT
    description: >-
      Sustained glucocorticoid exposure produces the systemic Cushingoid
      phenotype.
- name: Glucocorticoid Excess Tissue Injury
  biological_scale: ORGANISM
  description: >-
    The downstream consequences are those of any chronic cortisol excess and are
    not specific to the KDM1A mechanism: central fat redistribution, insulin
    resistance and diabetes, hypertension, proximal myopathy, osteoporosis, thin
    skin with striae and easy bruising. They are modelled as a single terminal
    node rather than as separate mechanistic branches because the disease-specific
    biology ends upstream of them - everything distinctive about AIMAH3 is in how
    the cortisol comes to be secreted, not in what it then does.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:42067271
    reference_title: Primary Bilateral Macronodular Adrenal Hyperplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients should undergo clinical and biochemical assessment for steroid excess-particularly cortisol, as many exhibit mild autonomous cortisol secretion."
    explanation: Supports steroid excess as the clinically assessed consequence in PBMAH; graded PARTIAL because it is a review statement about PBMAH generally rather than a KDM1A-specific outcome measurement.
genetic:
- name: KDM1A
  gene_term:
    preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    KDM1A encodes lysine-specific demethylase 1A (LSD1) at 1p36.12. In AIMAH3 it
    behaves as a two-hit tumour suppressor: a germline heterozygous truncating
    allele plus somatic loss of the wild-type allele on 1p within the adrenal
    lesion. Every KDM1A-variant patient in the systematic screening series was
    female, an association that is unexplained and is recorded here as an
    observation rather than a mechanism.

    Variant configuration: germline heterozygous truncating allele (loss of
    function), with somatic loss of heterozygosity through 1p deletion in the
    affected adrenal tissue. `variant_origin: GERMLINE_AND_SOMATIC` records that
    both compartments are involved; the per-compartment zygosity (heterozygous in
    the germline, effectively null in the lesion) cannot be expressed in a single
    slot and is stated here instead.
  evidence:
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed germline truncating variants of KDM1A in 5 G2 patients, constantly associated with a somatic loss of the KDM1A wild-type allele on 1p, leading to a loss of KDM1A expression both at messenger RNA and protein levels"
    explanation: Establishes the germline truncating plus somatic-LOH genotype that this genetic block records.
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients with KDM1A variants were women, vs 65% of ARMC5 patients and 67% of wild-type patients (P = .0337)."
    explanation: Records the unexplained female predominance among KDM1A carriers.
- name: ARMC5
  gene_term:
    preferred_term: ARMC5
    term:
      id: hgnc:25781
      label: ARMC5
  relationship_type: MODIFIER
  notes: >-
    Not a cause of AIMAH3, and listed only to fix the boundary. ARMC5 is the
    commoner PBMAH predisposition gene and defines a separate molecular group
    whose patients do not have food-dependent cortisol secretion. The two genes
    have been reported as mutually exclusive in the series that examined both.
  evidence:
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline ARMC5 alterations have been reported in about 25% of PBMAH index cases but are absent in patients with FDCS."
    explanation: Establishes ARMC5 and the food-dependent phenotype as non-overlapping, which is what makes this a boundary rather than a differential within the entry.

name: ACTH-Independent Macronodular Adrenal Hyperplasia 3
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: KDM1A-related primary bilateral macronodular adrenal hyperplasia with food-dependent Cushing syndrome
  term:
    id: MONDO:0700299
    label: ACTH-independent macronodular adrenal hyperplasia 3
description: >-
  ACTH-independent macronodular adrenal hyperplasia 3 (AIMAH3) is the KDM1A-driven
  form of primary bilateral macronodular adrenal hyperplasia (PBMAH), and it is
  the molecular explanation for a clinical curiosity that had been described for
  three decades before its cause was known: food-dependent Cushing syndrome
  (FDCS), in which cortisol is low in the fasting morning state and rises after
  meals, inverting the normal diurnal rhythm.
  The mechanism is a two-hit inactivation of KDM1A (lysine demethylase 1A, LSD1),
  a chromatin-modifying enzyme that removes methyl marks from histone H3 lysine 4
  and thereby represses transcription. Patients carry a germline heterozygous
  truncating variant; the adrenal nodules additionally lose the wild-type allele
  through a recurrent somatic deletion of chromosome 1p, where KDM1A sits. In the
  resulting KDM1A-null adrenocortical cells the gene encoding the receptor for
  glucose-dependent insulinotropic polypeptide (GIP) is derepressed and expressed
  ectopically. GIP is an incretin released by the gut after eating, so a receptor
  that should not be on adrenocortical cells at all now couples every meal to
  adenylate-cyclase activation and cortisol synthesis. Chronic stimulation drives
  bilateral macronodular hyperplasia; the resulting hypercortisolism suppresses
  pituitary ACTH, which is what makes the syndrome ACTH-independent.
  Two features make this entity worth modelling separately from PBMAH at large.
  First, the genotype-phenotype link is unusually tight in both directions:
  food-dependence was present in every KDM1A-variant patient and in no other
  patient in a 301-case series, and KDM1A inactivation accounts for roughly 90%
  of FDCS. Second, the mechanism predicts its own diagnostic test - a
  morning/midnight plasma cortisol ratio below 0.65 - which is a rare case of a
  pathophysiological model yielding a directly computable clinical discriminator.
  The disease is nonetheless rare in absolute terms, at about 3% of PBMAH index
  cases, and the reported cohorts are strikingly and unexplainedly female.
parents:
- hereditary disease
- Endocrine Disease
- Adrenal Gland Disorder
synonyms:
- AIMAH3
- ACTH-independent macronodular adrenal hyperplasia-3
- Cushing syndrome, food-dependent
- food-dependent Cushing syndrome
- GIP-dependent primary bilateral macronodular adrenal hyperplasia
- KDM1A-related primary bilateral macronodular adrenal hyperplasia
- KDM1A-related bilateral macronodular adrenocortical disease
notes: >-
  Naming. The MONDO label uses the older "ACTH-independent macronodular adrenal
  hyperplasia" nomenclature and the OMIM-style numeric suffix. The current
  endocrine literature calls the parent entity primary bilateral macronodular
  adrenal hyperplasia (PBMAH) or bilateral macronodular adrenocortical disease
  (BMAD), and calls this specific form KDM1A-related PBMAH or food-dependent
  Cushing syndrome. The entry keeps the MONDO label in `disease_term.term.label`
  because that is the canonical ontology string, and puts the clinically current
  description in `preferred_term` and the synonym list. Curators searching for
  this entity are far more likely to search "food-dependent Cushing" than
  "AIMAH3".

  Scope boundary. This entry is the KDM1A form only. ARMC5-related PBMAH is a
  distinct molecular group with a different phenotype (more severe basal
  hypercortisolism, no food dependence) and is not curated here. The
  ACTH-dependent and general Cushing umbrella is `Cushings_Syndrome`; the
  corticotroph-adenoma cause is `USP8-related_pituitary_adenoma_4`. KDM1A also
  causes an unrelated neurodevelopmental disease
  (`KDM1A-Related_Neurodevelopmental_Disorder`, MONDO:0014751) - the same gene,
  a different disease, and a different variant class.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Transmission of the germline truncating KDM1A allele is autosomal dominant
    with incomplete penetrance for overt Cushing syndrome. The disease in the
    adrenal cortex is nonetheless recessive at the cellular level: a somatic
    second hit removing the wild-type allele is required for a nodule to lose
    KDM1A expression, which is the classic two-hit tumour-suppressor
    configuration.
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome results from a two-hit inactivation of KDM1A, consistent with the tumour suppressor gene model of tumorigenesis."
    explanation: States the germline-plus-somatic two-hit architecture that this inheritance block describes.
prevalence:
- population: PBMAH index cases, 8 international endocrinology departments
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    Not a population prevalence. This is the share of KDM1A carriers among
    patients already diagnosed with PBMAH - 10 of 301 consecutive index cases
    (3.3%). The population prevalence of AIMAH3 is unknown because the
    denominator, PBMAH itself, is increasingly detected incidentally on imaging
    and has no settled population estimate.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten (3.3%) patients carried a germline KDM1A pathogenic or likely pathogenic variant, 60 (19.9%) carried a germline ARMC5 alteration, and 231 (76.8%) had no identified genetic predisposition."
    explanation: The systematic screening study that quantifies the KDM1A share of PBMAH index cases.
- population: Patients with food-dependent Cushing syndrome and PBMAH
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    The converse fraction, and the more informative one: among patients selected
    for the food-dependent phenotype rather than for PBMAH, KDM1A explains most
    cases.
  evidence:
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM1A inactivation explains about 90% of FDCS PBMAH."
    explanation: Quantifies the diagnostic yield of KDM1A testing in the food-dependent subgroup.
pathophysiology:
- name: Germline Truncating KDM1A Variant
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion is a germline heterozygous truncating variant in KDM1A
    at chromosome 1p36.12. The allelic series reported to date is dominated by
    nonsense and frameshift alleles rather than missense, which is what would be
    expected if the disease mechanism is loss of the protein rather than
    alteration of its activity. Heterozygosity alone is not sufficient to produce
    a nodule; it establishes the predisposed background on which the somatic
    second hit acts.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified germline heterozygous pathogenic or most likely pathogenic variants in the KDM1A gene in all 17 patients."
    explanation: Establishes the germline heterozygous KDM1A variant as the constant genetic finding in this disease.
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed germline truncating variants of KDM1A in 5 G2 patients, constantly associated with a somatic loss of the KDM1A wild-type allele on 1p, leading to a loss of KDM1A expression both at messenger RNA and protein levels"
    explanation: Independently identifies the same germline truncating allele class in a separate multiomics cohort, and names the truncating variant type specifically.
  downstream:
  - target: Somatic Loss of the KDM1A Wild-Type Allele on 1p
    causal_link_type: DIRECT
    description: >-
      The germline allele is the first hit; the nodule arises where a somatic
      deletion removes the remaining wild-type copy.
- name: Somatic Loss of the KDM1A Wild-Type Allele on 1p
  biological_scale: MOLECULAR
  description: >-
    Within adrenal lesions, a recurrent somatic deletion of the short arm of
    chromosome 1 removes the wild-type KDM1A allele. This is the second hit, and
    it is what converts a heterozygous carrier into a locally KDM1A-null tissue.
    Its presence in lesions and absence in control adrenal tissue is the specific
    observation that places KDM1A in the tumour-suppressor category rather than
    treating the germline variant as a simple dominant.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also identified a recurrent deletion in the short p arm of chromosome 1 harboring the KDM1A locus in adrenal lesions of these patients."
    explanation: Documents the somatic second hit as a recurrent 1p deletion in the lesions themselves.
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the 29 patients in the control groups had KDM1A germline or somatic alterations."
    explanation: The control-group negative result that makes the two-hit finding specific to this disease rather than a general feature of adrenal nodules.
  downstream:
  - target: Loss of KDM1A H3K4 Demethylase Activity in Adrenocortical Cells
    causal_link_type: DIRECT
    description: >-
      Biallelic inactivation abolishes KDM1A expression in the lesion, so the
      enzyme's repressive chromatin activity is lost locally.
- name: Loss of KDM1A H3K4 Demethylase Activity in Adrenocortical Cells
  biological_scale: MOLECULAR
  description: >-
    KDM1A (LSD1) is a flavin-dependent amine oxidase that demethylates
    mono- and di-methylated histone H3 lysine 4, a mark associated with active
    transcription; removing it represses target genes. Concomitant inactivation
    of both alleles abolishes KDM1A protein in the lesion, and the transcriptional
    repression it normally imposes is lifted. Note that the enzymatic
    interpretation is inferred from KDM1A's well-established biochemistry rather
    than measured directly on patient chromatin - what was measured in patients is
    loss of KDM1A expression at mRNA and protein level, and the downstream
    transcriptional consequence.
  genes:
  - preferred_term: KDM1A
    term:
      id: hgnc:29079
      label: KDM1A
  molecular_functions:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Food-dependent Cushing's syndrome was present in all patients with KDM1A variants and absent in the 2 other groups."
    explanation: Establishes food-dependent hypercortisolism as obligate in KDM1A carriers and absent in the comparison groups.
- category: Endocrine
  name: Increased Urinary Free Cortisol
  description: >-
    Twenty-four-hour urinary free cortisol averaging three times the upper limit
    of normal, higher than in the other PBMAH molecular groups. UFC is the
    informative integrated measure in this disease precisely because it sums
    across meals and so is not fooled by the inverted diurnal rhythm - but it is
    not invariably raised, and a GIP-dependent case with UFC within normal limits
    has been reported.
  phenotype_term:
    preferred_term: Increased urinary cortisol level
    term:
      id: HP:0012030
      label: Increased urinary cortisol level
  notes: >-
    No `frequency:` is asserted. The 3.0-fold figure is a group MEAN in a
    ten-patient cohort, not a count of how many patients had a raised value, and
    the schema's FrequencyEnum bands are frequency claims. Deriving a band from a
    mean would be an arithmetic error dressed as an annotation. The reported
    normal-UFC case below is the direct counterexample.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM1A patients had a higher 24-h urinary free cortisol (3.0-fold upper limit of normal vs 1.36 for ARMC5 patients and 0.66 for wild-type patients, respectively, P = .0001)."
    explanation: >-
      Quantifies the cortisol excess against the two comparison groups. This is a
      group mean, not a per-patient frequency, which is why no frequency band is
      asserted on this phenotype.
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Urinary free cortisol excretion was within normal limits, but an unusual diurnal cortisol rhythm was observed with low morning and high postprandial levels"
    explanation: >-
      The counterexample, cited deliberately. A GIP-dependent patient with normal
      UFC whose disease was nonetheless apparent from the rhythm - so a normal UFC
      does not exclude the diagnosis, and the phenotype is not obligate.
- category: Endocrine
  name: Low Morning Fasting Cortisol
  description: >-
    Subnormal cortisol in the fasting morning state - the trough of an inverted
    rhythm rather than adrenal insufficiency. This is the single most
    consequential phenotype in the entry for diagnosis, because morning cortisol
    is what is measured by convention, and in this disease it is the value least
    likely to look abnormal in the expected direction.
  phenotype_term:
    preferred_term: Decreased circulating cortisol level
    term:
      id: HP:0008163
      label: Decreased circulating cortisol level
    temporality: DIURNAL
  notes: >-
    The HP term names a decreased cortisol level without reference to time of
    day, so the binding alone reads as hypocortisolism, which would be a
    clinically dangerous misreading. `temporality: DIURNAL` and this note carry
    the qualification: the level is low only at the morning timepoint, and total
    daily output is raised.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In accordance with FDCS pathophysiology, patients with KDM1A variants had a lower morning fasting plasma cortisol (192 nmol/L vs 407 and 428, respectively, P = .0003) and a higher midnight plasma cortisol (487 nmol/L vs 297 and 171.96, respectively, P = .0004)."
    explanation: Measures the low morning value against both comparison groups, with the paired midnight value that shows it is a rhythm inversion rather than deficiency.
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an unusual diurnal cortisol rhythm was observed with low morning and high postprandial levels"
    explanation: Independent single-patient observation of the same low-morning/high-postprandial pattern.
- category: Endocrine
  name: Decreased Circulating ACTH
  description: >-
    Plasma ACTH is low or suppressed, because autonomous adrenal cortisol
    production shuts down pituitary corticotrophs. This is the feature that makes
    the syndrome ACTH-INDEPENDENT and separates it from Cushing disease, so it is
    definitional for the entity rather than incidental.
  phenotype_term:
    preferred_term: Decreased circulating ACTH concentration
    term:
      id: HP:0002920
      label: Decreased circulating ACTH concentration
  notes: >-
    Evidenced at the level of PBMAH rather than of KDM1A-related PBMAH
    specifically. None of the KDM1A cohort papers reports ACTH values, so the
    citations below are a PBMAH case report and a PBMAH review. The inference to
    KDM1A carriers is safe - ACTH-independence is definitional for the parent
    entity and the KDM1A form is a subset of it - but it is an inference, and the
    evidence grading says so.

    One nuance the entry does not smooth over: a 2026 review notes intra-adrenal
    ACTH production by steroidogenic cells in PBMAH, so "ACTH-independent" refers
    to independence from PITUITARY ACTH, not to the absence of ACTH signalling
    altogether.
  evidence:
  - reference: PMID:39465833
    reference_title: "Primary bilateral macronodular adrenal hyperplasia: A rare case report of Cushing syndrome and review of literature."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Her laboratory results showed increased cortisol and suppressed ACTH, and an abdominal CT scan revealed 2 heterogeneous masses in the adrenal glands."
    explanation: >-
      A measured suppressed ACTH with the expected raised cortisol and bilateral
      adrenal masses. Graded PARTIAL because it is a single PBMAH case report with
      no KDM1A genotype, so it evidences the parent entity's biochemistry rather
      than this disease's.
  - reference: PMID:39465833
    reference_title: "Primary bilateral macronodular adrenal hyperplasia: A rare case report of Cushing syndrome and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In PBMAH, enlarged adrenal nodules secrete cortisol independently of corticotropin (ACTH), causing mild to overt CS."
    explanation: States the ACTH-independence of cortisol secretion in PBMAH, which is the mechanism this phenotype reflects.
  - reference: PMID:42067271
    reference_title: Primary Bilateral Macronodular Adrenal Hyperplasia.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Aberrant hormone receptor expression and intra-adrenal adrenocorticotropin production by steroidogenic cells may also contribute to cortisol dysregulation in many patients."
    explanation: >-
      Cited as the qualification rather than the support - intra-adrenal ACTH
      production means "ACTH-independent" describes independence from pituitary
      ACTH specifically.
- category: Endocrine
  name: Bilateral Adrenal Hyperplasia
  description: >-
    Bilateral macronodular enlargement of the adrenal cortices, typically found on
    cross-sectional imaging and increasingly detected incidentally.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Adrenal hyperplasia
    term:
      id: HP:0008221
      label: Adrenal hyperplasia
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bilateral nature of this disease suggests germline genetic predisposition."
    explanation: Documents the bilateral hyperplasia that defines the entity.
- category: Metabolic
  name: Truncal Obesity
  description: >-
    Central fat redistribution from chronic glucocorticoid excess. A generic
    Cushingoid feature rather than a KDM1A-specific one.
  phenotype_term:
    preferred_term: Truncal obesity
    term:
      id: HP:0001956
      label: Truncal obesity
  notes: >-
    Recorded from the clinical definition of Cushing syndrome rather than from a
    KDM1A-cohort frequency measurement. No `frequency:` is asserted because the
    published KDM1A series do not report per-sign frequencies.
- category: Cardiovascular
  name: Hypertension
  description: >-
    Glucocorticoid-driven hypertension, a standard component of the Cushingoid
    phenotype.
  phenotype_term:
    preferred_term: Hypertension
    term:
      id: HP:0000822
      label: Hypertension
  notes: >-
    As above - no KDM1A-specific frequency is published, so none is asserted.
- category: Metabolic
  name: Diabetes Mellitus
  description: >-
    Cortisol-induced insulin resistance progressing to overt diabetes in a
    proportion of patients.
  phenotype_term:
    preferred_term: Diabetes mellitus
    term:
      id: HP:0000819
      label: Diabetes mellitus
  notes: >-
    As above - no KDM1A-specific frequency is published, so none is asserted.
- category: Skeletal
  name: Osteoporosis
  description: >-
    Reduced bone mineral density from sustained glucocorticoid exposure.
  phenotype_term:
    preferred_term: Osteoporosis
    term:
      id: HP:0000939
      label: Osteoporosis
  notes: >-
    As above - no KDM1A-specific frequency is published, so none is asserted.
- category: Neoplastic
  name: Associated Extra-Adrenal Neoplasia
  description: >-
    KDM1A-related PBMAH has been reported in association with adrenal myelolipoma
    and with plasma-cell disorders - monoclonal gammopathy of undetermined
    significance and multiple myeloma. This is a genuine surprise for an entry
    whose mechanism is otherwise entirely adrenal, and it matters clinically
    because it changes what surveillance a KDM1A carrier should be offered. No
    mechanism linking KDM1A loss to plasma-cell neoplasia has been established,
    and the association rests on a review's summary of reported cases rather than
    on a cohort incidence, so no frequency is asserted.
  phenotype_term:
    preferred_term: Neoplasm
    term:
      id: HP:0002664
      label: Neoplasm
  evidence:
  - reference: PMID:36857084
    reference_title: "Extensive expertise in endocrinology: glucose-dependent insulinotropic peptide-dependent Cushing's syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "can be associated with adrenal myelolipoma, monoclonal gammopathy of unknown significance (MGUS), or multiple myeloma"
    explanation: >-
      Reports the extra-adrenal associations. Graded PARTIAL because it is an
      expert review's statement of association across reported cases, with no
      denominator and no incidence estimate.
diagnosis:
- name: Mixed meal test with oral versus intravenous glucose
  description: >-
    The confirmatory test, and the cleanest physiological demonstration of the
    modelled mechanism. Cortisol rises after a mixed meal, and - decisively -
    after ORAL but not INTRAVENOUS glucose. The oral/intravenous dissociation is
    the whole argument: only the oral route passes nutrients through the gut and
    triggers GIP release from intestinal K cells, so a cortisol response that
    depends on the route rather than on the glucose load localises the stimulus
    to an incretin. Failure of cortisol to suppress after dexamethasone
    establishes the autonomy.
  evidence:
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was confirmed by further investigations, showing significant plasma cortisol responses after a mixed meal test and after oral, but not intravenous glucose administration, as well as ACTH-independent bilateral macronodular adrenal hyperplasia (AIMAH)."
    explanation: The diagnostic protocol and the oral-versus-intravenous dissociation that identifies the stimulus as gut-derived.
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "associated with the absence of cortisol suppression after dexamethasone, suggesting the possibility of GIP-dependent Cushing's syndrome"
    explanation: The dexamethasone non-suppression that establishes autonomous secretion and prompts the food-dependence workup.
- name: Morning to midnight plasma cortisol ratio as a screening discriminator
  description: >-
    A cheap biochemical screen derived directly from the mechanism: two timed
    plasma cortisol measurements, no dynamic testing. A ratio below 0.65 was
    reported to separate food-dependent from other PBMAH completely in the cohort
    that derived it. See the `biochemical` entry of the same name for the
    measurement itself and the validation caveat - the 100% figure is a
    derivation-cohort result in ten patients and has not been externally
    validated.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morning/midnight plasma cortisol ratio below 0.65 holds 100% sensitivity and specificity for the detection of FDCS."
    explanation: The reported discriminator and its performance in the derivation cohort.
- name: Germline KDM1A and ARMC5 sequencing
  description: >-
    Molecular confirmation. Because the two genes define mutually exclusive
    molecular groups with different phenotypes, they are screened together and
    the result is informative either way: KDM1A predicts food-dependence,
    ARMC5 predicts its absence. A positive germline result also converts the
    proband's relatives into testable at-risk individuals, which is the practical
    reason the discovery cohorts recommend it.
  evidence:
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening for ARMC5 and KDM1A can now be offered for most PBMAH operated patients and their families, opening the way to earlier diagnosis and improved management."
    explanation: The recommendation to screen both genes in operated PBMAH patients and their families.
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KDM1A germline pathogenic variants are rare in PBMAH and account for <5% of index cases."
    explanation: Sets the expected yield of KDM1A testing in an unselected PBMAH population, which is what makes the food-dependence phenotype the useful pre-test filter.
- name: Adrenal cross-sectional imaging
  description: >-
    CT or MRI demonstrating bilateral macronodular adrenal enlargement. Imaging is
    increasingly the entry point rather than the confirmation - PBMAH is now often
    detected incidentally in asymptomatic people - which is precisely why every
    such finding needs biochemical assessment for steroid excess rather than
    reassurance.
  evidence:
  - reference: PMID:42067271
    reference_title: Primary Bilateral Macronodular Adrenal Hyperplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary bilateral macronodular adrenal hyperplasia (PBMAH) is increasingly recognized as imaging is widely used, leading to incidental detection in asymptomatic individuals. Adrenal imaging defines radiologic features."
    explanation: Establishes imaging as the modern route to detection and its role in defining the radiological entity.
  - reference: PMID:39465833
    reference_title: "Primary bilateral macronodular adrenal hyperplasia: A rare case report of Cushing syndrome and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an abdominal CT scan revealed 2 heterogeneous masses in the adrenal glands"
    explanation: A worked example of the imaging finding in a biochemically confirmed case.
biochemical:
- name: Morning to Midnight Plasma Cortisol Ratio
  notes: >-
    The mechanism-derived discriminator. Because secretion is meal-driven rather
    than circadian, the normal morning-high/midnight-low ordering reverses, and
    the ratio of the two values separates food-dependent from other PBMAH. A
    ratio below 0.65 was reported to hold complete sensitivity and specificity for
    FDCS in the series that derived it. This is a derivation-cohort figure and has
    not, to this entry's knowledge, been independently validated - see the
    knowledge gap recorded in `discussions`.
  evidence:
  - reference: PMID:39921449
    reference_title: "KDM1A genetic alterations, a rare cause of primary bilateral macronodular adrenal hyperplasia, strongly associated with food-dependent Cushing's syndrome: results of its systematic germline screening in 301 index cases and genotype/phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Morning/midnight plasma cortisol ratio below 0.65 holds 100% sensitivity and specificity for the detection of FDCS."
    explanation: The primary report of the ratio and its reported discrimination.
treatments:
- name: Adrenalectomy
  description: >-
    Surgical removal of adrenal tissue is the definitive treatment for the
    hypercortisolism. In bilateral macronodular disease the choice between
    bilateral adrenalectomy, unilateral adrenalectomy and adrenal-sparing partial
    resection is a trade-off between remission and lifelong adrenal
    insufficiency. A long-term BMAD follow-up series reported markedly better
    remission with adrenal-sparing surgery than with unilateral adrenalectomy -
    but that series contained no KDM1A-variant patients, so it is evidence about
    the parent entity and not about this disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: adrenalectomy
    term:
      id: NCIT:C15177
      label: Adrenalectomy
  target_mechanisms:
  - target: ACTH-Independent Hypercortisolism
    description: >-
      Removing steroidogenic tissue removes the source of the autonomous cortisol
      regardless of what is stimulating it.
  evidence:
  - reference: PMID:40810200
    reference_title: A Global Approach to the Long-Term Follow-Up of 17 Families With Bilateral Macronodular Adrenal Disease.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Adrenal-sparing surgery achieved 100% remission vs a 40% remission rate for unilateral adrenalectomy."
    explanation: >-
      Compares surgical strategies in bilateral macronodular adrenal disease.
      Graded PARTIAL deliberately - the cohort is BMAD generally and the same
      report states no KDM1A pathogenic variants were identified in it, so this
      cannot be read as a KDM1A-specific outcome.
- name: Somatostatin Analogue Therapy
  description: >-
    The obvious mechanism-directed drug idea, and it does not work. Somatostatin
    analogues suppress GIP release from intestinal K cells, so they should in
    principle cut off the stimulus driving cortisol secretion. In the one detailed
    published trial - a single patient given octreotide for six months and then
    pasireotide for three - both drugs did acutely suppress the postprandial
    cortisol response, but the effect escaped, and neither improved the clinical or
    metabolic features. The patient proceeded to bilateral adrenalectomy. The
    authors concluded the failure was independent of somatostatin receptor subtype
    affinity, which matters because it removes the natural next move of trying a
    broader-spectrum analogue.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: octreotide
      term:
        id: CHEBI:7726
        label: octreotide
    - preferred_term: pasireotide
      term:
        id: CHEBI:72312
        label: pasireotide
  target_mechanisms:
  - target: Meal-Triggered Adenylate Cyclase Activation and Cortisol Synthesis
    description: >-
      Suppressing postprandial GIP secretion removes the ligand for the ectopic
      receptor, which is why the strategy was attempted.
  evidence:
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Although inducing a significant acute suppression of post-prandial cortisol response, both drugs had no effects on the clinical and metabolic abnormalities associated with Cushing's syndrome and new tests performed at the end of each treatment period confirmed escape of post-meal cortisol suppression to therapy."
    explanation: >-
      Graded REFUTE against sustained clinical benefit from somatostatin
      analogues. Note this is a single patient, so it refutes the strategy as
      tried rather than excluding all somatostatin-based approaches.
  - reference: PMID:21264796
    reference_title: "Transient efficacy of octreotide and pasireotide (SOM230) treatment in GIP-dependent Cushing's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case report illustrates the lack of sustained efficacy of somatostatin analogues on GIP-dependent Cushing's syndrome, independent of their affinity for the different somatostatin receptor subtypes."
    explanation: The authors' own generalisation, and specifically that receptor-subtype affinity does not explain the failure.
- name: Genetic Counselling and Family Screening
  description: >-
    Because the predisposing allele is germline and dominantly transmitted, and
    because the mechanism yields a cheap biochemical screen (the morning/midnight
    cortisol ratio) as well as a gene test, first-degree relatives of an index
    case can be offered testing. Both discovery cohorts explicitly recommended
    this.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34655521
    reference_title: "Loss of KDM1A in GIP-dependent primary bilateral macronodular adrenal hyperplasia with Cushing's syndrome: a multicentre, retrospective, cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing and counselling should be offered to these patients and their relatives."
    explanation: The discovery cohort's explicit recommendation for family genetic counselling.
  - reference: PMID:34906447
    reference_title: KDM1A inactivation causes hereditary food-dependent Cushing syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic screening for ARMC5 and KDM1A can now be offered for most PBMAH operated patients and their families, opening the way to earlier diagnosis and improved management."
    explanation: Independent recommendation of germline screening in operated PBMAH patients and their families.
discussions:
- discussion_id: aimah3_adrenal_sparing_surgery_in_kdm1a
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#Adrenalectomy
  prompt: >-
    Is adrenal-sparing surgery preferable to bilateral adrenalectomy specifically
    in KDM1A-related PBMAH?
  rationale: >-
    The only comparative surgical outcome data in bilateral macronodular adrenal
    disease come from a cohort in which no KDM1A pathogenic variants were found.
    KDM1A patients differ from that cohort in ways that could plausibly change the
    answer - notably a higher integrated cortisol burden and a secretory stimulus
    (meals) that does not go away after partial resection. Treatment guidance for
    this entity is therefore currently extrapolated from a group it was measured
    to be absent from.
- discussion_id: aimah3_cortisol_ratio_external_validation
  kind: KNOWLEDGE_GAP
  attaches_to:
  - biochemical#Morning to Midnight Plasma Cortisol Ratio
  prompt: >-
    Does the morning/midnight plasma cortisol ratio below 0.65 retain its reported
    perfect sensitivity and specificity in an independent cohort?
  rationale: >-
    100% sensitivity and specificity reported in the cohort that derived a
    threshold is the classic setting for optimistic bias, and the KDM1A group in
    that series was ten patients. The figure is quoted here because it is the
    published one, but a discriminator with no independent validation should not
    be treated as settled.
- discussion_id: aimah3_female_predominance
  kind: OPEN_QUESTION
  attaches_to:
  - genetic#KDM1A
  prompt: >-
    Why were all reported KDM1A-variant patients female?
  rationale: >-
    Female predominance is near-total in the KDM1A group (all carriers) against
    roughly two-thirds in both comparison groups, and it reached statistical
    significance. No mechanism has been proposed. Candidate explanations - an
    effect of sex on penetrance, an ascertainment effect, or chance in a
    ten-patient group - have not been distinguished, and the cohorts are too
    small to distinguish them.
- discussion_id: aimah3_camp_pka_step_unmeasured
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Meal-Triggered Adenylate Cyclase Activation and Cortisol Synthesis
  prompt: >-
    Has the cAMP/PKA step been measured in KDM1A-null adrenocortical tissue, or is
    it inferred from GIPR's canonical coupling?
  rationale: >-
    The entry models GIPR signalling through adenylate cyclase because that is
    GIPR's established coupling and no other route would produce the observed
    postprandial cortisol rise. But the disease-specific measurements stop at GIPR
    transcript and protein on one side and at plasma cortisol on the other. The
    intervening second-messenger step is the least directly evidenced link in the
    chain and is flagged rather than smoothed over.
- discussion_id: aimah3_plasma_cell_neoplasia_association
  kind: OPEN_QUESTION
  attaches_to:
  - phenotypes#Associated Extra-Adrenal Neoplasia
  prompt: >-
    Is the reported association between KDM1A-related PBMAH and plasma-cell
    disorders causal, and should carriers have haematological surveillance?
  rationale: >-
    An expert review records adrenal myelolipoma, MGUS and multiple myeloma as
    associations of KDM1A-related PBMAH. If real and causal it would be clinically
    consequential - a germline tumour-suppressor carrier state with a second,
    non-adrenal neoplastic risk changes what surveillance a carrier should be
    offered. But the association is reported without a denominator or an
    incidence, the KDM1A cohorts are small, and no mechanism connecting KDM1A loss
    to plasma-cell biology has been proposed. The entry records the association
    and explicitly declines to assert a frequency.

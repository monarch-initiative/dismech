    Not a cause of the disease - this is a Mendelian disorder - but the trigger that
    converted compensated disease into decompensation in two of the four published
    patients. The index patient's cardiomyopathy declared itself during a viral illness at
    fifteen months, and the leukodystrophy patient's developmental regression is described
    as worsening markedly after an infection. That is the familiar catabolic-stress pattern
    of mitochondrial disease, reported here in two unrelated presentations.

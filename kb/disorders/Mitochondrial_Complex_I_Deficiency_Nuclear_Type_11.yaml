phenotypes:
- category: Cardiovascular
  name: Hypertrophic cardiomyopathy
  description: >-
    Reported in three of the four published cases; the leukodystrophy case reports none.
    In the 2025 patient the cardiomyopathy prompted the genetic workup. In the 2011
    patient it did not: that workup began from a biochemical complex I deficiency in a
    30-patient cohort, and the cardiomyopathy was the phenotype of the one patient in it
    who turned out to carry NDUFAF1 variants.
  phenotype_term:
    preferred_term: Hypertrophic cardiomyopathy
    term:
      id: HP:0001639
      label: Hypertrophic cardiomyopathy
  evidence:
  - reference: PMID:21931170
    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF1 cause fatal infantile hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of NDUFAF1 revealed compound heterozygous missense mutations (c.631C>T;p.Arg211Cys and c.733G>A;p.Gly245Arg) in one patient with fatal infantile HCM"
    explanation: >-
      Ties the genotype to hypertrophic cardiomyopathy in the second reported case.
  - reference: PMID:39821332
    reference_title: "Mitochondrial Complex I Deficiency: Unraveling the Relevance of NDUFAF1 in Pediatric Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We here describe a new case of apparently isolated HCM due to mitochondrial assembly factor gene NDUFAF1 biallelic variants"
    explanation: >-
      An independent case, and the one where the cardiomyopathy was the whole of the

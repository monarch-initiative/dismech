    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF1 cause fatal infantile hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional studies demonstrated a severe reduction in NDUFAF1 protein in Western blots of patient fibroblasts and accumulation of abnormal complex I assembly intermediates on Blue Native polyacrylamide gel electrophoresis"
    explanation: >-

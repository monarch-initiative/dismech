- reference: PMID:21931170
  title: Mutations in the mitochondrial complex I assembly factor NDUFAF1 cause fatal infantile hypertrophic cardiomyopathy.
- reference: PMID:31121247
  title: Warburg-like effect is a hallmark of complex I assembly defects.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All four reported molecular diagnoses are biallelic: two variants in the 2007 case,
    compound heterozygous missense changes in the 2011 case, compound heterozygous exon-2
    variants in the 2016 leukodystrophy case, and a missense with an intragenic deletion
    in the 2025 case. The 2025 report says biallelic without using the word trans, so that
    word is not used here either.
  evidence:
  - reference: PMID:17557076
    reference_title: Human CIA30 is involved in the early assembly of mitochondrial complex I and mutations in its gene cause disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed the patient had mutations in both alleles of the NDUFAF1 gene that encodes CIA30"
    explanation: >-
      States the biallelic requirement directly in the index case.
mechanistic_hypotheses:
- hypothesis_group_id: direct_intermediate_binding
  hypothesis_label: NDUFAF1 acts directly, by binding early assembly intermediates
  status: CANONICAL
  description: >-
    CIA30 associates with newly translated mtDNA-encoded subunits at early assembly and
    dissociates later, so its role is a direct chaperoning of the intermediate. This is
    the account the founding papers give and the one the entry's main chain follows.
- hypothesis_group_id: indirect_assembly_role
  hypothesis_label: NDUFAF1's role in assembly may be indirect
  status: ALTERNATIVE
  description: >-
    A survey of complex I-deficient patient cells found NDUFAF1 still bound to the
    500-850 kDa subcomplexes in a patient whose assembly intermediates were absent
    altogether, and that its association did not track the nature or severity of the
    assembly defect. Those authors concluded the involvement could be indirect. Nothing
    in the cached literature resolves this against the direct account.
pathophysiology:
- name: NDUFAF1 Loss of Function
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  description: >-
    Biallelic NDUFAF1 variants reduce the amount of functional CIA30 protein. In the
    2011 case the reduction was demonstrated at the protein level rather than inferred
    from the genotype.
  biological_scale: MOLECULAR
  role: trigger
  genes:
  - preferred_term: NDUFAF1
    term:
      id: hgnc:18828
      label: NDUFAF1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:21931170
    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF1 cause fatal infantile hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional studies demonstrated a severe reduction in NDUFAF1 protein in Western blots of patient fibroblasts and accumulation of abnormal complex I assembly intermediates on Blue Native polyacrylamide gel electrophoresis"
    explanation: >-
      Establishes loss of function at the protein level, and in the same sentence the
      assembly-intermediate accumulation that the next two nodes model.
  - reference: PMID:21931170
    reference_title: Mutations in the mitochondrial complex I assembly factor NDUFAF1 cause fatal infantile hypertrophic cardiomyopathy.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These changes were absent in 240 ethnically matched control alleles"
    explanation: >-
      The control-allele screen, which is what makes the variants candidate causal rather
      than merely present.
  downstream:
  - target: MCIA Complex Dysfunction
    causal_link_type: DIRECT
    description: >-
      NDUFAF1 is one of the four core components of the MCIA complex, so losing it is a
      lesion in that complex.
  - target: Failure of Early Complex I Assembly
    causal_link_type: DIRECT
    hypothesis_groups:
    - direct_intermediate_binding
    description: >-
      Losing the assembly factor blocks the step it chaperones. This edge is the one the
      direct-binding account owns; the alternative hypothesis disputes the mechanism of
      this step, not that the step fails.
    evidence:
    - reference: PMID:16218961
      reference_title: Human mitochondrial complex I assembly is mediated by NDUFAF1.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Modulating the intramitochondrial amount of NDUFAF1 by knocking down its expression using RNA interference leads to a reduced amount and activity of complex I"
      explanation: >-
        The knockdown experiment, which is the edge claim rather than either node: reducing
        NDUFAF1 is what reduces complex I.
- name: MCIA Complex Dysfunction
  description: >-
    NDUFAF1 does not work alone. It is one of four core components of the mitochondrial
    complex I intermediate assembly (MCIA) complex, with ECSIT, ACAD9 and TMEM126B, and
    that complex builds the ND2 module of complex I. Knocking out any one component is
    enough to impair complex I assembly, which is why an assembly-factor gene behaves
    like a structural one clinically.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: mitochondrial inner membrane
    term:
      id: GO:0005743
      label: mitochondrial inner membrane
  evidence:
  - reference: PMID:32320651
    reference_title: "Dissecting the Roles of Mitochondrial Complex I Intermediate Assembly Complex Factors in the Biogenesis of Complex I."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "The mitochondrial complex I intermediate assembly (MCIA) complex, containing assembly factors NDUFAF1, ECSIT, ACAD9, and TMEM126B, is required for building the intermediate ND2-module"
    explanation: >-
      Names NDUFAF1 as an MCIA component and names what the complex builds, which is what
      makes the lesion specific to the ND2 module rather than to assembly in general.
  notes: >-
    This node says NDUFAF1 belongs to the MCIA complex and that the complex is required
    for the ND2 module. It deliberately does not assert that patient NDUFAF1 variants
    destabilise the rest of the complex: the knockout hierarchy in the cited paper is a
    cell-line experiment on each component in turn, not an observation in patient
    material, and no cached source measures ECSIT, ACAD9 or TMEM126B in an NDUFAF1
    patient. `kb/disorders/ACAD9_Deficiency.yaml` models the same complex from the ACAD9
    side.
  downstream:
  - target: Failure of Early Complex I Assembly
    causal_link_type: DIRECT
    description: >-
      A defective MCIA complex cannot build the intermediate it exists to build.
    evidence:
    - reference: PMID:32320651
      reference_title: "Dissecting the Roles of Mitochondrial Complex I Intermediate Assembly Complex Factors in the Biogenesis of Complex I."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Cell knockout studies reveal that while each MCIA component is critical for complex I assembly, a hierarchy of stability exists centered on ACAD9"
      explanation: >-
        Establishes that losing any single MCIA component impairs complex I assembly, which
        is this edge. The ACAD9-centred stability hierarchy is noted but not modelled here.
- name: Failure of Early Complex I Assembly
  description: >-
    CIA30 acts at the early stage of assembly, associating with newly translated
    mtDNA-encoded subunits and dissociating later. Without it that early step does not
    complete, and the intermediate that fails to form is the ND2 module.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
  cellular_components:

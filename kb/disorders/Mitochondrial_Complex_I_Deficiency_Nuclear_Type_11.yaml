  evidence:
  - reference: PMID:17557076
    reference_title: Human CIA30 is involved in the early assembly of mitochondrial complex I and mutations in its gene cause disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "the human complex I assembly factor CIA30 (complex I intermediate associated protein) associates with newly translated mtDNA-encoded complex I subunits at early stages in their assembly before dissociating at a later stage"
    explanation: >-
      Places the lesion at the early stage and describes the transient association that

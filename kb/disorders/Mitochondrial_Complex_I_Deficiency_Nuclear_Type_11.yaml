discussions:
- discussion_id: ndufaf1_direct_versus_indirect_assembly_role
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Does NDUFAF1 promote complex I assembly by binding early assembly intermediates
    directly, or is its involvement indirect?
  attaches_to:
  - "pathophysiology#Failure of Early Complex I Assembly"
  rationale: >-
    The founding EMBO J paper reports CIA30 associating with newly translated
    mtDNA-encoded subunits at early assembly and dissociating later, which reads as direct
    chaperoning and is what this entry's main chain assumes. A survey of complex I-deficient
    patient cells published the same year reaches the opposite reading: NDUFAF1's
    association with the 500-850 kDa subcomplexes did not track the nature or severity of
    the assembly defect, and persisted even in a patient whose assembly intermediates were
    absent because of an unrelated translation-elongation defect. If NDUFAF1 stays bound
    when there is nothing to bind, the association is not obviously the mechanism. This
    matters for the entry because the ROS arm attributes the metabolic phenotype to the
    intermediates themselves, and that arm is unaffected either way - but the description
    of what NDUFAF1 does at the assembly step is not settled by anything cached here.
  evidence:
  - reference: PMID:17557076
    reference_title: Human CIA30 is involved in the early assembly of mitochondrial complex I and mutations in its gene cause disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "the human complex I assembly factor CIA30 (complex I intermediate associated protein) associates with newly translated mtDNA-encoded complex I subunits at early stages in their assembly before dissociating at a later stage"
    explanation: >-
      The direct-association account.
  - reference: PMID:17383918
    reference_title: Investigation of the complex I assembly chaperones B17.2L and NDUFAF1 in a cohort of CI deficient patients.
    supports: REFUTE
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "suggest that the involvement of NDUFAF1 in the assembly process could be indirect rather than direct via the binding to assembly intermediates"
    explanation: >-
      The authors' own conclusion against the direct account, from the patient-cell survey.
notes: >-
  Scope and series size. Four patients have been reported, in 2007, 2011, 2016 and 2025,
  with the 2025 paper counting itself the fourth. There is no `prevalence:` section at all:
  with four cases there is no denominator, and a rate written from a case count would be a
  number with nothing behind it.

  No frequency values are recorded on any phenotype, for the same reason. A feature seen in
  one of four published patients is not an OCCASIONAL band, it is one observation.

  Sources actually read, and one I nearly did not. `references_cache/PMID_17557076.md` is
  a 51 KB `full_text_html` record, not an abstract. An earlier draft of this entry read
  only its abstract section and then asserted in these notes that the case-report full
  texts were not cached - a false negative-existence claim, of exactly the kind the
  `dismech-terms` guidance warns about, and one that suppressed real content: the index
  patient's twenty-year clinical history, the only numeric lactate in the corpus (5-10 mM
  against a stated normal below 2.5 mM), the 36% residual complex I activity, and the
  ~400 kDa stalled assembly intermediate. All of those are now curated from that full
  text. What remains uncached is OMIM 618234, and the full texts of the 2011, 2016 and
  2025 reports.

  The phenotype set is therefore bounded by what the cached records state, which is now a
  larger set than the abstracts alone. Note also that PMID:21931170 lists Leigh syndrome and other encephalomyopathies,
  but as phenotypes of its 30-patient complex I-deficient cohort, not of its one NDUFAF1
  patient; reading that sentence as NDUFAF1 phenotypes would be a within-paper entity
  confusion, and it is not done here.

  GeneReviews. `just check-genereviews --online` reports NO_CHAPTER for both GeneReviews and
  StatPearls, which is expected for an assembly-factor disease with four published cases.

  Module conformance, and a gap. `Complex I Deficiency` conforms to
  `mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress`; the reasoning is on
  that node. Worth recording that `kb/modules/` has a `complex_iv_assembly_deficiency`
  module and no complex I counterpart, even though roughly twenty MC1DN entries exist and
  several are assembly-factor rather than subunit defects. A `complex_i_assembly_deficiency`
  module looks like the natural sibling, and the ROS-from-intermediates arm modelled here
  would be a distinctive node in it. That is a separate piece of work, not attempted here.

  A stale cached label, flagged when this entry was curated and since corrected. The
  creatine kinase phenotype binds `HP:0003236`, which this entry originally labelled
  `Elevated circulating creatine kinase concentration` - HPO's previous label, and what
  `cache/hp/terms.csv` held at the time. Correcting it could not be done from one entry,
  because term validation is cache-first and a corrected cache row failed every other
  entry carrying the old string. It was migrated corpus-wide instead, under issue #12358:
  the cache row was re-derived through the validator and all 77 bindings moved to HPO's
  current label, `Elevated circulating creatine kinase activity`.

  Deep research. Requested provider was `falcon`; it is not configured in this
  environment, so the run fell back and the report is
  `research/Mitochondrial_Complex_I_Deficiency_Nuclear_Type_11-deep-research-claude_code.md`.
  The substitution is recorded in that report's own frontmatter (`fell_back: true`,
  `requested_provider: falcon`) rather than only in prose. `just preflight-dr` returns
  PASS with NDUFAF1 at 75 mentions and the OMIM id matching, so the report is about this
  disease.

  What the report contributed. Its citation set is four PMIDs against the eight used
  here, and three of the four were already in hand from a direct PubMed survey, so the
  report is a supplement rather than the backbone. Its one new reference is PMID:32320651,
  which names the MCIA complex composition and the ND2 module and is the basis of the
  `MCIA Complex Dysfunction` node.

  Its clinical claims were initially dropped as unsourced, and that judgement was wrong in
  part. Wolff-Parkinson-White syndrome, pigmentary retinopathy, intellectual disability and
  the viral-illness precipitant are all in the cached full text of PMID:17557076, and are
  now curated with quotes. The report attributes them to OMIM 618234 rather than to that
  paper, and separately misattributes the index case's history to the 2011 report, so its
  sourcing was wrong even where its facts were right. Two of its figures remain rejected
  and are not used: "death at fifteen months", which the same full text contradicts - the
  index patient was alive and medically stable at twenty - and a "~25% of control" complex
  I activity, against the 36% the paper states.

  Treatment. No `treatments:` section. The report's treatment content is an empiric
  mitochondrial cocktail sourced to a patient-advocacy web page, with no disease-specific
  evidence and no registered trial, and standard heart-failure management extrapolated
  from general practice rather than reported in any of the four cases. Curating those
  would be asserting a treatment literature this disease does not have.

  The 2025 case's variants are a missense plus an intragenic deletion of exon 3, and the
  missense c.631C>T is the same change reported in the 2011 case. That recurrence is
  recorded here rather than in `genetic:` because nothing cached establishes it as a founder
  allele or a hotspot - two occurrences is a pattern, not a finding.

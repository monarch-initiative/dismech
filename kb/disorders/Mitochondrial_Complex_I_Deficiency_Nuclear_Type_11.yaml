name: Mitochondrial Complex I Deficiency, Nuclear Type 11
category: Mendelian
creation_date: "2026-09-20T18:00:00Z"
synonyms:
- MC1DN11
- NDUFAF1-related mitochondrial complex I deficiency
- NDUFAF1 deficiency
- CIA30 deficiency
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 11
  term:
    id: MONDO:0032617
    label: mitochondrial complex I deficiency, nuclear type 11
description: >-
  MC1DN11 is the isolated complex I deficiency caused by biallelic variants in NDUFAF1,
  the gene encoding CIA30. The distinction that organises this entry is that NDUFAF1 is
  an assembly factor and not a structural subunit: it is absent from the finished
  enzyme, and its job is to get an early intermediate of complex I built. So the lesion
  is a failure to construct the enzyme rather than a failure of catalysis at a preserved
  active site, and the cell is left holding stalled intermediates rather than a complete
  but sluggish complex.

  That distinction is not merely descriptive. Work across 29 patient fibroblast lines
  representing most complex I diseases found that a glycolytic switch is a feature of
  assembly defects specifically, not of complex I deficiency in general, and traced it
  to reactive oxygen species produced by the assembly intermediates themselves. The
  NDUFAF1 patient in whom assembly intermediates were directly visualised is therefore
  in the class that paper says should show the switch. This entry models that arm, and
  keeps it separate from the generic bioenergetic-decline arm, because the two make
  different predictions.

  Four patients have been reported, and the clinical range across them is wide for so
  small a series. The first, in 2007, had cardioencephalomyopathy presenting as cardiac
  failure with a viral illness at fifteen months, and is the most completely described:
  that paper's full text carries a twenty-year history including Wolff-Parkinson-White
  syndrome, pigmentary retinopathy, kyphoscoliosis and osteoporosis, and records him
  alive and medically stable at twenty. The second, in 2011, had fatal infantile
  hypertrophic cardiomyopathy. The third, in 2016, reports no cardiomyopathy: a
  leukodystrophy with developmental regression, white matter lesions, peripheral
  neuropathy and hyperreflexia, which its authors flagged as the first NDUFAF1
  leukodystrophy. That report is abstract-only in the cache, so what can be said is that
  it reports no cardiomyopathy, not that the patient had none. The fourth, in 2025, had
  apparently isolated hypertrophic cardiomyopathy - the authors' own hedge - and was
  described as clinically simpler than the earlier cases.

  One patient died in infancy and one was alive and stable at twenty, so this is not a
  uniformly infantile-lethal disease, and the entry does not describe it as one.

  It is tempting to call hypertrophic cardiomyopathy the thread running through this
  disease, and three of the four cases would support it, but the leukodystrophy case
  does not and this entry does not assert it. What the four have in common is complex I
  deficiency; which organ declares itself is the part nobody has explained, and four
  cases is not enough to try.
parents:
- Mitochondrial complex I deficiency
- Mitochondrial disease
references:
- reference: PMID:17557076

    snippet: "SDHA variants were introduced into a clonal SDHA-knockout cell line via Bxb1-mediated recombination. SDH activity and SDHA abundance were determined for each variant"
    explanation: >-
      Human-cell functional characterisation of this substitution. In that
      SDHA-null background p.Arg451Cys scored as amorphic while retaining high
      SDHA protein, i.e. a stable but catalytically dead subunit, which the
      authors attribute to Arg451's role in covalent flavinylation. Per-variant
      values are in Figure 2 of PMC11611653 and not in the cached abstract, so
      the snippet quotes only the assay design; the numbers are recorded in the
      pathophysiology node notes with their retrieval provenance.
- name: NM_004168.4(SDHA):c.1984C>T (p.Arg662Cys)
  description: >-
    Candidate second allele, reported de novo in an individual with global
    developmental delay, intellectual disability and childhood-onset progressive
    bilateral optic atrophy, with decreased complex II activity in fibroblasts
    and lymphocytes and in-silico evidence of impaired C-terminal FAD binding.
    It has since also been assayed in a human SDHA-knockout cell line, where it
    scored as essentially inactive (per-variant result from the PMC11611653
    full text, Table 1; the cached abstract for PMID:39321216 reports only that
    22 variants of uncertain significance were assayed and does not name this
    one); that study frames the result as functional evidence for cancer
    pathogenicity, so it speaks to the allele's effect on enzyme function and
    not to which SDHA phenotype it causes. Recorded as a candidate rather than
    an established NDAXOA allele because ClinVar holds no record for it against
    this condition and its aggregate classification is conflicting.

- name: Bioenergetic Failure in Cells With Low Metabolic Reserve
  biological_scale: CELLULAR
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    A permanent halving of succinate dehydrogenase activity is a mild insult in
    most cells and a severe one in a few. Complex II sits at the junction of the
    tricarboxylic acid cycle and the electron transport chain, so its
    impairment restricts both the oxidative arm of intermediary metabolism and
    the electron supply to the quinone pool at once. Cells that are long-lived,
    post-mitotic, unable to dilute damaged mitochondria by division, and running
    near their ATP ceiling therefore carry the cost: retinal ganglion cells,
    cerebellar neurons, skeletal myofibres and cardiomyocytes. Cells that turn
    over, or that can lean on glycolysis, are spared, which is why a systemic
    enzyme defect produces a strikingly selective clinical picture and why
    cultured fibroblasts may look normal.

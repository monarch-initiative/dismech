phenotypes:
- name: Optic atrophy
  category: Eye
  diagnostic: true
  description: >-
    Bilateral, progressive optic atrophy is the feature that names the disorder
    and the only one reported in every affected individual across all three
    published reports. It is described as late-onset in the founding family, as
    developing in adulthood in the adult son of the second family whose cardiac
    disease had been present since early childhood, and as childhood-onset in
    the de novo case. The lesion is an optic neuropathy of retinal ganglion cell
    origin, not a retinal dystrophy, and the practical consequence is
    progressive loss of acuity and of peripheral field.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    clinical_course: PROGRESSIVE
  notes: >-
    Present in the two sisters of the founding family, in the index patient and
    the adult son of the second family, and in the de novo case. The daughter of
    the second family died at seven months and never reached an age at which
    optic atrophy could declare itself, so she is not a negative. No frequency
    band is asserted; see the entry notes.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index patient presented with bilateral optic atrophy and ocular movement disorder, a progressive polyneuropathy, psychiatric involvement, and cardiomyopathy."
    explanation: Bilateral optic atrophy as the presenting feature in the index patient of the second dominant pedigree.
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 30-year old son presents with cardiomyopathy and developed bilateral optic atrophy in adulthood."
    explanation: Documents adult-onset optic atrophy in a second carrier of the same allele who had a childhood-onset cardiac presentation, establishing the intrafamilial dissociation of the two organ systems in time.
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an adolescent female who presented with global developmental delay, intellectual disability and childhood onset progressive bilateral optic atrophy."
    explanation: Bilateral progressive optic atrophy in the third reported case, with an onset that is childhood rather than late, which is the basis of the onset discussion below.
- name: Ataxia
  category: Nervous System
  diagnostic: true
  description: >-
    Progressive cerebellar and gait ataxia is the second cardinal feature and
    the one that gives the disorder its position among the hereditary ataxias.
    In the founding family it was part of a slowly progressive late-onset
    neurodegenerative syndrome together with the optic neuropathy and myopathy.
    The OMIM clinical synopsis for this entity records the ataxia in its
    component parts, as gait, truncal and limb ataxia with unsteady gait,
    postural instability and clumsiness.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
    clinical_course: PROGRESSIVE
  notes: >-
    Reported in both sisters of the founding family. Ataxia is not mentioned in
    the abstract of the second pedigree's report, which describes that family's
    neurological involvement as a progressive polyneuropathy; whether the
    cerebellar syndrome is universal in this entity or specific to the founding
    family cannot be settled from the cached abstracts. The component terms
    HP:0002066 Gait ataxia, HP:0002078 Truncal ataxia, HP:0002070 Limb ataxia,
    HP:0002317 Unsteady gait, HP:0002172 Postural instability and HP:0002312
    Clumsiness all appear in the OMIM clinical synopsis for 619259 (MedGen
    C5543254, retrieved 2026-08-01) and were each verified with OAK, but are not
    given separate phenotype entries here because they decompose a single
    clinical syndrome that the primary sources describe as "ataxia".
  evidence:
  - reference: PMID:10976639
    reference_title: "Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a complex II gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, we identified a family with complex II deficiency and late-onset neurodegenerative disease with progressive optic atrophy, ataxia, and myopathy."
    explanation: Names progressive ataxia as one of the three defining components of the phenotype in the family that defines this entity.
- name: Cerebellar atrophy
  category: Nervous System
  description: >-
    Cerebellar volume loss on imaging is the structural correlate of the ataxia
    and the finding that marks the disorder as a degeneration rather than a
    static cerebellar disorder.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
    clinical_course: PROGRESSIVE
  notes: >-
    Curated from the OMIM clinical synopsis for 619259 as exposed through MedGen
    concept C5543254 (HP:0001272, retrieved 2026-08-01 from the NCBI eutils
    esummary endpoint for MedGen uid 1779901). It does not appear in any cached
    abstract for this disorder, so no evidence item is attached. Note that
    progressive cerebellar atrophy on serial MRI has been imaged and published
    in SDHA disease, but in a biallelic child (PMID:33960148), not in a
    heterozygous NDAXOA patient; that image is deliberately not adopted as
    evidence here.
- name: Myopathy
  category: Musculoskeletal
  description: >-
    Skeletal muscle involvement completes the classic triad of the founding
    family. It is the tissue in which the biochemical defect was first
    demonstrated, and it presents as exercise-related muscle symptoms and limb
    weakness rather than as an acute rhabdomyolytic myopathy.
  phenotype_term:
    preferred_term: Myopathy
    term:
      id: HP:0003198
      label: Myopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:10976639
    reference_title: "Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a complex II gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, we identified a family with complex II deficiency and late-onset neurodegenerative disease with progressive optic atrophy, ataxia, and myopathy."
    explanation: Names myopathy as the third component of the founding family's phenotype.
- name: Myalgia
  category: Musculoskeletal
  description: >-
    Muscle pain, often with fatigue, is the symptom that patients report; it is
    the subjective face of the muscle energy deficit and typically precedes any
    measurable weakness.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  notes: >-
    Curated from the OMIM clinical synopsis for 619259 via MedGen C5543254
    (HP:0003326, retrieved 2026-08-01), together with HP:0012378 Fatigue and
    HP:0003690 Limb muscle weakness from the same source. Not mentioned in any
    cached abstract, so no evidence item is attached.
- name: Cardiomyopathy
  category: Cardiovascular
  diagnostic: true
  description: >-
    Cardiomyopathy is the systemic feature that most changes management, and in
    the second dominant pedigree it was both the earliest and the most severe
    manifestation. Two children carrying the allele presented with
    cardiomyopathy in early childhood and one died of cardiac insufficiency at
    seven months; their father also had cardiomyopathy alongside his
    neurological disease. Any individual identified with an NDAXOA genotype
    therefore requires cardiac assessment regardless of age or neurological
    status.
  phenotype_term:
    preferred_term: Cardiomyopathy
    term:
      id: HP:0001638
      label: Cardiomyopathy
  notes: >-
    Reported in all three members of the second pedigree. Not reported in the
    founding family's abstracts. The OMIM clinical synopsis for 619259
    additionally records HP:0001640 Cardiomegaly and HP:0001635 Congestive heart
    failure (MedGen C5543254, retrieved 2026-08-01), both of which are
    consistent with the fatal infant case. No frequency band is asserted.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of his children presented with cardiomyopathy and methylglutaconic aciduria in early childhood."
    explanation: Cardiomyopathy as the presenting feature in two child carriers of the dominant allele.
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 30-year old son presents with cardiomyopathy and developed bilateral optic atrophy in adulthood."
    explanation: Persistence of the cardiomyopathy into adulthood in the surviving child, showing it is a chronic feature rather than a transient infantile one.
- name: Congestive heart failure
  category: Cardiovascular
  description: >-
    Cardiac decompensation is the mechanism by which the cardiomyopathy kills.
    In the only fatal case reported for this entity it did so in the first year
    of life.
  phenotype_term:
    preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  notes: >-
    The cited snippet reports "cardiac insufficiency" as the cause of death at
    seven months; HP:0001635 Congestive heart failure is the closest HPO term
    and is bound with the source's own wording preserved in the snippet. The
    same term appears independently in the OMIM clinical synopsis for 619259
    (MedGen C5543254, retrieved 2026-08-01).
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The daughter deceased at the age of 7 months due to cardiac insufficiency."
    explanation: The one recorded death in this entity, from cardiac failure in infancy.
- name: Polyneuropathy
  category: Nervous System
  description: >-
    A progressive polyneuropathy was a prominent part of the index presentation
    in the second dominant pedigree. It is a length-dependent peripheral
    involvement distinct from the cerebellar syndrome, and it broadens the
    disorder from a central neurodegeneration to one that also affects the
    peripheral nervous system. The OMIM clinical synopsis correspondingly
    records peripheral sensory features.
  phenotype_term:
    preferred_term: Polyneuropathy
    term:
      id: HP:0001271
      label: Polyneuropathy
    clinical_course: PROGRESSIVE
  notes: >-
    Reported in the index patient of the second pedigree. The related sensory
    terms HP:0012534 Dysesthesia and HP:0003487 Babinski sign appear in the
    OMIM clinical synopsis for 619259 (MedGen C5543254, retrieved 2026-08-01);
    the Babinski sign indicates additional corticospinal involvement, which is
    recorded here rather than given its own phenotype entry because it rests on
    the synopsis alone.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index patient presented with bilateral optic atrophy and ocular movement disorder, a progressive polyneuropathy, psychiatric involvement, and cardiomyopathy."
    explanation: Names progressive polyneuropathy as a presenting feature in the index patient of the second dominant family.
- name: Ocular motility disorder
  category: Eye
  description: >-
    Abnormal eye movements accompany the optic neuropathy and are part of the
    presenting picture in the second pedigree. The OMIM definition of the entity
    notes that some patients have a childhood history of neurological features
    including limited extraocular movements, which places an ophthalmoparesis at
    the earlier end of the natural history and makes eye-movement examination a
    useful early sign in an at-risk relative who is not yet visually
    symptomatic.
  phenotype_term:
    preferred_term: Ocular movement disorder
    term:
      id: HP:0000496
      label: Abnormality of eye movement
  notes: >-
    The bound term is deliberately the parent HP:0000496 rather than the more
    specific HP:0000597 Ophthalmoparesis, because the only quotable source
    describes an unqualified "ocular movement disorder" and does not say which
    kind. The more specific reading, limited extraocular movements, comes from
    the OMIM narrative definition of 619259 exposed through MedGen C5543254
    (retrieved 2026-08-01), which is not a cached quotable reference; that
    synopsis also records HP:0000639 Nystagmus, HP:0000640 Gaze-evoked nystagmus
    and HP:0000651 Diplopia. Both HP:0000496 and HP:0000597 were verified with
    OAK; the parent was chosen because the evidence does not support the child,
    not by accident.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index patient presented with bilateral optic atrophy and ocular movement disorder, a progressive polyneuropathy, psychiatric involvement, and cardiomyopathy."
    explanation: Names an ocular movement disorder alongside the optic atrophy in the index patient.
- name: Psychiatric involvement
  category: Nervous System
  description: >-
    Psychiatric disturbance is an under-recognised part of this disorder and was
    listed among the index patient's presenting features in the second pedigree.
    The OMIM clinical synopsis records depression specifically. Because
    psychiatric symptoms can precede or overshadow the neurological ones, they
    are a plausible reason for delayed diagnosis in an adult presenting with
    subtle visual and gait complaints.
  phenotype_term:
    preferred_term: Psychiatric involvement
    term:
      id: HP:0000708
      label: Atypical behavior
  notes: >-
    The bound term is the broad behavioural-abnormality parent because the
    quotable source says only "psychiatric involvement" without specifying a
    syndrome. HP:0000716 Depression is recorded in the OMIM clinical synopsis
    for 619259 (MedGen C5543254, retrieved 2026-08-01) and was verified with
    OAK, but is not bound here because the synopsis is not a quotable source and
    the primary report does not name depression.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The index patient presented with bilateral optic atrophy and ocular movement disorder, a progressive polyneuropathy, psychiatric involvement, and cardiomyopathy."
    explanation: Names psychiatric involvement as a presenting feature in the index patient of the second dominant family.
- name: 3-Methylglutaconic aciduria
  category: Metabolism
  description: >-
    Methylglutaconic aciduria was present in the two affected children of the
    second pedigree and is the only reported urinary metabolic marker of this
    disorder. It is a generic indicator of disturbed mitochondrial membrane
    metabolism rather than a specific signature of complex II deficiency, but in
    a child with unexplained cardiomyopathy it is the finding most likely to
    redirect the workup towards mitochondrial disease and hence towards SDHA.
  phenotype_term:
    preferred_term: 3-Methylglutaconic aciduria
    term:
      id: HP:0003535
      label: 3-Methylglutaconic aciduria
  notes: >-
    The cited abstract writes "methylglutaconic aciduria" without the 3- prefix;
    HP:0003535 is the corresponding HPO term and the snippet preserves the
    source wording. Reported in two of three carriers in the second pedigree;
    not reported in the founding family or in the de novo case. No frequency
    band is asserted.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of his children presented with cardiomyopathy and methylglutaconic aciduria in early childhood."
    explanation: Documents methylglutaconic aciduria in the two child carriers of the dominant allele.
- name: Global developmental delay
  category: Nervous System
  description: >-
    Developmental delay is reported only in the de novo case and is the main
    reason that case sits uneasily inside an entity defined as a late-onset
    neurodegeneration. It is recorded here because the authors argue explicitly
    that it expands the spectrum of this disorder, and because a curated entry
    that omitted it would misrepresent what has been published.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  notes: >-
    Reported in one individual, the de novo case, whose assignment to this
    entity is qualified in the entry notes because ClinVar carries no NDAXOA
    record for that allele. Not reported in either dominant pedigree.
  evidence:
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, it adds developmental delay and cognitive disability to the expanding spectrum of the disorder."
    explanation: >-
      The authors' explicit claim that developmental delay is a new addition to
      the spectrum of heterozygous SDHA disease. Marked PARTIAL because it rests
      on a single individual whose allele is not classified against this
      condition in ClinVar.
- name: Intellectual disability
  category: Nervous System
  description: >-
    Cognitive impairment accompanied the developmental delay in the de novo
    case. As with the delay, it is a single-case observation at the edge of the
    entity rather than an established feature of it.
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  notes: >-
    Reported in one individual. Not reported in either dominant pedigree, whose
    affected adults had ordinary cognition alongside their psychiatric and motor
    features.
  evidence:
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report an adolescent female who presented with global developmental delay, intellectual disability and childhood onset progressive bilateral optic atrophy."
    explanation: Intellectual disability in the single de novo case; marked PARTIAL for the same reason as the developmental delay.
- name: Decreased activity of mitochondrial complex II
  category: Cellular
  diagnostic: true
  description: >-
    A partial deficiency of complex II activity, of the order of half of control
    values, is the cellular hallmark of the disorder and the finding that first
    identified it. It is the phenotype that ties the clinical syndrome to the
    gene and the one on which the diagnosis rested for the four years between
    the biochemical and the molecular reports.
  phenotype_term:
    preferred_term: Decreased activity of mitochondrial complex II
    term:
      id: HP:0008314
      label: Decreased activity of mitochondrial complex II
  notes: >-
    Demonstrated in muscle and platelet mitochondria in the founding family and
    in fibroblasts and lymphocytes in the de novo case, and inferred in the
    second pedigree from the title and framing of that report. The tissues in
    which the defect is expressible are not consistent between reports, which is
    curated as an open discussion and as a diagnostic caveat rather than
    resolved.
  evidence:
  - reference: PMID:8967754
    reference_title: "Deficiency of complex II of the mitochondrial respiratory chain in late-onset optic atrophy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In both patients, a partial deficiency of complex II (approximately 50% of control values) was shown to be present in mitochondria from muscle and platelets."
    explanation: Direct measurement of the partial complex II deficiency in patient muscle and platelets.
  - reference: PMID:10976639
    reference_title: "Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a complex II gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compatible with these findings, our patients have an approximate 50% decrease in complex II and succinate dehydrogenase activity."
    explanation: Confirms the same partial deficit and links it explicitly to succinate dehydrogenase activity as well as to assembled complex II.
biochemical:
- name: Complex II (succinate dehydrogenase) enzyme activity
  presence: DECREASED
  context: >-
    Respiratory chain enzymology on a tissue biopsy or on blood-derived cells,
    expressed as a ratio to citrate synthase to correct for mitochondrial
    content. In this disorder the expected result is a partial deficit of
    roughly half of control values, not the profound deficit seen in recessive
    complex II disease, and the assay may be normal in cultured fibroblasts.
  readouts:
  - target: Approximately Half-Normal Succinate Dehydrogenase Activity
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A reduction to approximately half of control values in muscle, platelets
      or, in some individuals, cultured fibroblasts and lymphocytes reports the
      partial enzymatic block produced by a heterozygous flavinylation-defective
      SDHA allele. A normal result in fibroblasts does not exclude the
      diagnosis.
    evidence:
    - reference: PMID:8967754
      reference_title: "Deficiency of complex II of the mitochondrial respiratory chain in late-onset optic atrophy and ataxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In both patients, a partial deficiency of complex II (approximately 50% of control values) was shown to be present in mitochondria from muscle and platelets."
      explanation: Establishes the assay, the tissues and the expected magnitude of the deficit.
  notes: >-
    No reference range is recorded because respiratory chain enzyme activities
    are reported against laboratory-specific control ranges and as
    citrate-synthase ratios rather than against a LOINC-coded universal
    interval, and no such interval is published for this disorder. The
    interpretation band that matters clinically, roughly 50% versus profoundly
    reduced, is stated in the interpretation text instead of being invented as a
    numeric interval.
- name: Urinary 3-methylglutaconic acid
  presence: INCREASED
  context: >-
    Urine organic acid analysis. Elevated in the two affected children of the
    second pedigree. A non-specific marker of mitochondrial membrane-related
    metabolic disturbance rather than a marker of complex II specifically, but
    the only reported metabolic abnormality in this disorder and a practical
    trigger for mitochondrial investigation in a child with cardiomyopathy.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of his children presented with cardiomyopathy and methylglutaconic aciduria in early childhood."
    explanation: The only report of a urinary metabolic abnormality in this entity.
  notes: >-
    Not measured or reported in the founding family or in the de novo case, so
    it is not known whether this is a general feature of the disorder or a
    feature of childhood-onset cardiac presentations within it.
diagnosis:
- name: Sequencing of SDHA with explicit phenotype disambiguation
  description: >-
    Molecular diagnosis rests on identifying a heterozygous SDHA missense
    variant against transcript NM_004168.4 in an individual with optic atrophy
    plus cerebellar, muscular or cardiac involvement. Three interpretation
    points follow from the published genotype-phenotype structure. First, the
    causal alleles are conservative-looking arginine-to-cysteine substitutions
    and must not be dismissed on in-silico grounds. Second, because SDHA carries
    four distinct MONDO disease terms, the laboratory cannot infer the phenotype
    from the gene: zygosity, variant class and, at codon 451, the identity of
    the substituting residue all change the answer, and the report should say
    so. Third, SDHA is not on every hereditary optic neuropathy panel; the
    authors of the most recent case report proposed adding it, which implies it
    was not there.
  evidence:
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose to add SDHA to next generation sequencing gene panels of optic atrophy."
    explanation: Direct evidence that SDHA is under-represented on hereditary optic neuropathy panels and that its absence is a recognised diagnostic gap.
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the patient and her unaffected parents identified the novel heterozygous de novo variant c.1984C > T"
    explanation: Names the reference transcript that a diagnostic laboratory must use when reporting SDHA variants and demonstrates trio sequencing as the route to a de novo call.
- name: Respiratory chain enzymology, with a tissue caveat
  description: >-
    Measurement of complex II and succinate dehydrogenase activity supports the
    diagnosis, but the choice of tissue is not a matter of convenience. In the
    founding family the enzyme defect was demonstrable in muscle and platelet
    mitochondria and explicitly absent in cultured skin fibroblasts and
    immortalised lymphocytes, whereas in the de novo case it was demonstrable in
    fibroblasts and lymphocytes. A normal fibroblast complex II activity
    therefore does not exclude this disorder, and muscle remains the reference
    tissue. The expected magnitude is a partial, approximately half-normal
    deficit; a profound deficit should prompt reconsideration of a biallelic
    genotype and the recessive disorder.
  evidence:
  - reference: PMID:8967754
    reference_title: "Deficiency of complex II of the mitochondrial respiratory chain in late-onset optic atrophy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme defect was not expressed in cultured skin fibroblasts or immortalized lymphocytes."
    explanation: The source of the diagnostic caveat that a normal fibroblast assay does not exclude the diagnosis.
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Biochemical assessment of CII in the patient's derived fibroblasts and lymphocytes displayed considerably decreased CII residual activity compared with normal controls, when normalized to the integral mitochondrial enzyme citrate synthase."
    explanation: >-
      The contradicting observation, in which the same cell types that were
      uninformative in the founding family were informative. Marked PARTIAL
      because the two reports cannot both describe a general rule.
- name: Ophthalmological assessment with formal fields and acuity
  description: >-
    Fundoscopy showing bilateral optic disc pallor, with acuity and formal
    perimetry, documents the defining feature and tracks it. The OMIM clinical
    synopsis for this entity records peripheral visual field loss as well as
    reduced acuity, so a field test adds information that acuity alone does not.
    Assessment of eye movements at the same visit is worthwhile because an
    ocular motility abnormality was part of the presenting picture in one
    pedigree and limited extraocular movements are described as a possible
    childhood antecedent.
  notes: >-
    The peripheral visual field loss (HP:0007994) and visual impairment
    (HP:0000505) supporting this recommendation come from the OMIM clinical
    synopsis via MedGen C5543254 (retrieved 2026-08-01), not from a cached
    abstract, so no evidence item is attached.
- name: Cardiac assessment at diagnosis and on surveillance
  description: >-
    Echocardiography and electrocardiography are indicated in every individual
    found to carry an NDAXOA genotype, at any age. The justification is the
    second pedigree, in which cardiomyopathy was present in all three carriers,
    preceded the neurological disease by decades in one, and was fatal in
    infancy in another. Cardiac disease is the only reported cause of death in
    this entity.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The daughter deceased at the age of 7 months due to cardiac insufficiency."
    explanation: The lethal cardiac outcome that makes cardiac assessment mandatory rather than optional in a carrier of any age.
differential_diagnoses:
- name: Mitochondrial complex II deficiency, nuclear type 1
  disease_term:
    preferred_term: mitochondrial complex II deficiency, nuclear type 1
    term:
      id: MONDO:0100294
      label: mitochondrial complex II deficiency, nuclear type 1
  description: >-
    The recessive allelic disorder, caused by biallelic SDHA variants and
    curated separately in
    `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`. This
    is not a differential in the ordinary sense of a mimicking disease; it is
    the other zygosity of the same gene, and the two are separated by the number
    of damaged alleles rather than by clinical judgement. The distinction is
    made at the moment the sequencing result is read, not at the bedside.
  distinguishing_features:
  - "Zygosity is the discriminator: NDAXOA arises from a single heterozygous missense allele, MC2DN1 from biallelic loss-of-function or severely hypomorphic genotypes."
  - MC2DN1 presents in infancy or early childhood with Leigh syndrome or leukodystrophy; NDAXOA is dominated by adult-onset optic atrophy and ataxia, with the qualification that its cardiac arm can present in infancy.
  - Residual complex II activity is partial in NDAXOA, of the order of half of control values, and far lower in MC2DN1.
  - Parents of an MC2DN1 proband are unaffected heterozygous carriers; a parent of an NDAXOA proband is either affected or the variant is de novo.
  - MONDO does not place NDAXOA beneath MONDO:0100294, verified by OAK ancestor query; the two are sibling consequences of one gene, not a parent and a subtype.
  notes: >-
    MONDO:0100294 was verified with OAK on 2026-08-01 and matches the
    disease_term already bound in the existing complex II deficiency entry,
    which was read and not modified. The description caveat about that file's
    prose blurring the two entities is recorded in the entry-level notes.
  evidence:
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Underlying autosomal-recessive genetic defects are found in most of the 'SDHx' genes encoding complex II (SDHA, SDHB, SDHC, and SDHD) and its assembly factors."
    explanation: Establishes recessive inheritance as the norm for complex II subunit mitochondrial disease, which is the boundary this differential draws.
  - reference: PMID:33960148
    reference_title: "Progressive cerebellar atrophy in a patient with complex II and III deficiency and a novel deleterious variant in SDHA: A Counseling Conundrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deleterious variants of SDHA are most frequently associated with Leigh and Leigh-like syndromes."
    explanation: States that the dominant clinical association of SDHA variants overall is the recessive Leigh phenotype, which is why the dominant neurodegenerative entity is easily missed.
- name: Pheochromocytoma/paraganglioma syndrome 5
  disease_term:
    preferred_term: pheochromocytoma/paraganglioma syndrome 5
    term:
      id: MONDO:0013602
      label: pheochromocytoma/paraganglioma syndrome 5
  description: >-
    The tumour-predisposition allelic disorder, in which a heterozygous SDHA
    loss-of-function germline allele behaves as a tumour-suppressor first hit,
    with somatic loss of the wild-type allele driving paraganglioma,
    phaeochromocytoma and gastrointestinal stromal tumour. It shares zygosity
    and gene with NDAXOA and shares nothing else. It is curated in dismech
    within `kb/disorders/Pheochromocytoma_Paraganglioma.yaml`, which was read
    and not modified.

    The overlap is not merely theoretical and it creates a live clinical
    problem. Codon 451 of SDHA produces neurodegeneration when the arginine is
    replaced by cysteine and has been reported in paraganglioma when it is
    replaced by histidine. Meanwhile, tumour surveillance is recommended for
    SDHA pathogenic-variant carriers and no equivalent surveillance exists for
    adult-onset mitochondrial disease, so a family found to carry an SDHA
    variant is offered a cancer protocol whose applicability to their particular
    allele nobody can state.
  distinguishing_features:
  - PGL5 alleles are typically truncating or splice loss-of-function changes acting as tumour-suppressor first hits; the NDAXOA alleles are specific missense substitutions that leave a full-length subunit.
  - PGL5 requires a somatic second hit in the tumour tissue; NDAXOA is a constitutive, whole-body enzymatic deficit with no second hit.
  - "The mechanism diverges at succinate: in PGL5 succinate accumulation acts as an oncometabolite driving pseudohypoxia and epigenetic remodelling, whereas in NDAXOA the pathogenic consequence curated here is bioenergetic failure in post-mitotic tissue."
  - Neither NDAXOA pedigree has reported a tumour, and no PGL5 family has reported optic atrophy with ataxia; the two allele sets have historically been described as separate.
  - "At codon 451 the substituting residue, not the position, decides which disease follows: Cys in NDAXOA, His reported in paraganglioma, Ser reported de novo in an infant with cardiomyopathy."
  notes: >-
    MONDO:0013602 was verified with OAK on 2026-08-01: its definition is "Any
    paraganglioma in which the cause of the disease is a mutation in the SDHA
    gene", it xrefs OMIM:614165, and it carries the same `RO:0004003 HGNC:10680`
    relationship as this entry. The codon 451 allelic series is from the ClinVar
    submitter evidence for VCV000449389 recorded in the entry-level notes, not
    from a cached abstract.
  evidence:
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, SDHx genes also function as tumor suppressor genes in hereditary paragangliomas, pheochromocytomas, and gastrointestinal stromal tumors."
    explanation: Establishes the tumour-suppressor arm of the same gene family that this differential separates from the neurodegenerative arm.
  - reference: PMID:33960148
    reference_title: "Progressive cerebellar atrophy in a patient with complex II and III deficiency and a novel deleterious variant in SDHA: A Counseling Conundrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with known pathogenic variants in SDHA are recommended to receive annual biochemical and clinical surveillance for signs and symptoms of paraganglioma and pheochromocytoma syndrome"
    explanation: Documents that a tumour-surveillance recommendation attaches to SDHA pathogenic variants generically, which is what makes the boundary between these two entities a practical rather than an academic question.
- name: Dilated cardiomyopathy 1GG
  disease_term:
    preferred_term: dilated cardiomyopathy 1GG
    term:
      id: MONDO:0013339
      label: dilated cardiomyopathy 1GG
  description: >-
    The fourth SDHA disease term in MONDO, a cardiac-predominant phenotype. It
    is included as a differential because cardiomyopathy is also a feature of
    NDAXOA, and in the second NDAXOA pedigree it was the presenting and lethal
    feature in the paediatric carriers. An infant found to have cardiomyopathy
    and an SDHA variant could plausibly be assigned to either term, and the
    distinction currently rests on zygosity and on whether neurological or
    ophthalmological features later appear in the family.
  distinguishing_features:
  - DCM1GG is a cardiac-predominant entity without the optic atrophy that defines NDAXOA.
  - The NDAXOA pedigree with childhood cardiomyopathy also contained an adult with optic atrophy carrying the same allele, so a family history of visual loss argues for NDAXOA.
  - MONDO keeps the two as separate terms with separate OMIM anchors, MONDO:0013339/OMIM:613642 and MONDO:0031006/OMIM:619259, both mapped to SDHA.
  notes: >-
    MONDO:0013339 was verified with OAK on 2026-08-01; it xrefs OMIM:613642 and
    carries `RO:0004003 HGNC:10680 ! SDHA`. There is no dismech entry for this
    disorder at the time of curation. This differential is deliberately included
    because it was surfaced by the OAK gene-to-disease query rather than by the
    clinical literature, and omitting it would misrepresent how many phenotype
    classes MONDO assigns to SDHA.
- name: Behr syndrome
  disease_term:
    preferred_term: Behr syndrome
    term:
      id: MONDO:0008858
      label: Behr syndrome
  description: >-
    The closest clinical mimic among the non-SDHA disorders. Behr syndrome pairs
    bilateral optic atrophy with ataxia and variable additional neurological
    features, most often from biallelic OPA1 variants and also from OPA3,
    MTRFR/C12orf65 or C19orf12. The pairing of optic atrophy with cerebellar
    ataxia is exactly the NDAXOA core, so a patient with NDAXOA presenting to a
    neuro-ophthalmology service will be worked up for Behr syndrome, and the
    distinction is molecular.
  distinguishing_features:
  - Behr syndrome is recessive and childhood-onset; NDAXOA is dominant and, in its neurological arm, adult-onset.
  - Behr syndrome converges on mitochondrial dynamics and translation rather than on a respiratory chain enzyme; complex II activity is not the expected abnormality.
  - Pyramidal signs with spasticity and posterior-column sensory loss are classical in Behr syndrome; NDAXOA has a peripheral polyneuropathy and, in the OMIM synopsis, a Babinski sign but not a spastic paraparesis.
  - Cardiomyopathy is not a feature of Behr syndrome and is prominent in one NDAXOA pedigree.
  notes: >-
    MONDO:0008858 was verified with OAK on 2026-08-01; it xrefs OMIM:210000 and
    carries `RO:0004003 HGNC:8140 ! OPA1`. It matches the disease_term bound in
    `kb/disorders/Behr_Syndrome.yaml`. No evidence item is attached because the
    contrast is a reasoned clinical comparison rather than a quotable finding.
- name: Autosomal dominant optic atrophy plus syndrome
  disease_term:
    preferred_term: autosomal dominant optic atrophy plus syndrome
    term:
      id: MONDO:0014720
      label: autosomal dominant optic atrophy plus syndrome
  description: >-
    OPA1-related dominant optic atrophy with extra-ocular features is the
    commonest inherited syndromic optic neuropathy and shares with NDAXOA both
    the dominant transmission and the combination of optic atrophy with ataxia
    and myopathy. It will be considered, and tested for, long before SDHA.
  distinguishing_features:
  - Dominant optic atrophy plus is caused by OPA1 and is far more common; SDHA is a rare cause that the most recent case report argued should be added to optic atrophy panels precisely because it is often absent from them.
  - Sensorineural deafness and chronic progressive external ophthalmoplegia characterise the OPA1-plus phenotype; the eye-movement abnormality in NDAXOA is not described as a progressive external ophthalmoplegia and deafness is not reported.
  - Complex II activity is normal in OPA1 disease and approximately half-normal in NDAXOA, so respiratory chain enzymology discriminates the two where it is available.
  - Cardiomyopathy and methylglutaconic aciduria point away from OPA1 and towards SDHA.
  notes: >-
    MONDO:0014720 was verified with OAK on 2026-08-01 and matches the
    disease_term bound in `kb/disorders/Autosomal_Dominant_Optic_Atrophy_Plus.yaml`.
  evidence:
  - reference: PMID:39423307
    reference_title: "Clinical and genetic landscape of optic atrophy in 826 families: insights from 50 nuclear genes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The top five genes implicated in nHON in our in-house cohort were OPA1, WFS1, FDXR, ACO2 and AFG3L2, which accounted for 82.46% of probands."
    explanation: >-
      Establishes the gene ranking a clinician actually faces in nuclear
      hereditary optic neuropathy, with OPA1 far ahead and SDHA nowhere in the
      leading group. Marked PARTIAL because the abstract does not state whether
      SDHA was among the 50 genes analysed, so this supports the relative
      prominence of OPA1 rather than a quantified rarity for SDHA.
- name: Leber hereditary optic neuropathy
  disease_term:
    preferred_term: Leber hereditary optic neuropathy
    term:
      id: MONDO:0010788
      label: Leber hereditary optic neuropathy
  description: >-
    The paradigm mitochondrial optic neuropathy, caused by mitochondrial DNA
    complex I mutations. It is included as a mechanistic rather than a clinical
    differential: LHON establishes that a partial respiratory chain defect
    preferentially destroys retinal ganglion cells, which is the same argument
    this entry makes for complex II, and it is the reason a mitochondrial
    genome analysis is usually done before a nuclear panel in an adult with
    bilateral optic neuropathy.
  distinguishing_features:
  - LHON is maternally inherited with marked male bias and incomplete penetrance; NDAXOA is autosomal dominant with affected women in both pedigrees.
  - LHON typically produces subacute, sequential, painless central visual loss over weeks; the NDAXOA optic neuropathy is described as slowly progressive.
  - LHON is not accompanied by cerebellar ataxia, myopathy or cardiomyopathy in its classical form; those are the extra-ocular features that should redirect testing towards SDHA.
  - The biochemical lesion is complex I in LHON and complex II in NDAXOA, so respiratory chain enzymology distinguishes them directly.
  notes: >-
    MONDO:0010788 was verified with OAK on 2026-08-01; it xrefs OMIM:535000 and
    matches `kb/disorders/Leber_Hereditary_Optic_Neuropathy.yaml`.
  evidence:
  - reference: PMID:14766317
    reference_title: "Mitochondrial dysfunction as a cause of optic neuropathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Any dysfunction of these systems may be of pathological relevance for optic neuropathies with primary or secondary involvement of mitochondria."
    explanation: Supports the shared mechanism that makes LHON a mechanistic rather than merely clinical differential for a complex II optic neuropathy.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No disease-modifying therapy exists. Management follows the components of
    the phenotype: low-vision assessment and educational or occupational
    accommodation for the optic neuropathy, physiotherapy and falls prevention
    for the ataxia and myopathy, and neuropathic pain management where the
    polyneuropathy is symptomatic.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  action_category: THERAPEUTIC
  notes: >-
    Carried as a descriptor with no evidence item, deliberately. No management
    guideline, natural-history study or treatment trial exists for this
    disorder; the entire clinical literature is two case reports and a case
    series whose abstracts say nothing about management. The listed measures are
    the standard-of-care response to the phenotypes curated above, not anything
    published for NDAXOA, so attaching a snippet would be a claim/snippet
    mismatch.
- name: Cardiac surveillance and heart failure management
  description: >-
    Because cardiomyopathy was present in all three carriers of the second
    pedigree and killed one of them in infancy, cardiac surveillance is the one
    intervention in this disorder with a clear, published rationale.
    Echocardiographic follow-up and conventional heart failure management apply;
    the disorder does not change how the cardiomyopathy itself is treated, only
    the imperative to look for it.
  treatment_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  action_category: MONITORING
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The daughter deceased at the age of 7 months due to cardiac insufficiency."
    explanation: The outcome that justifies cardiac surveillance as an active recommendation rather than a generic precaution.
  notes: >-
    The recommendation itself is a clinical inference from the reported natural
    history of one pedigree; no surveillance protocol has been published for
    this disorder and no interval is asserted here.
- name: Riboflavin supplementation
  description: >-
    Riboflavin is the dietary precursor of FAD, the cofactor whose covalent
    attachment to SDHA is the step that the NDAXOA alleles are argued to
    disrupt, so raising intracellular flavin availability is the one
    mechanistically targeted intervention that has ever been tried in complex II
    deficiency. In three children with recessive complex II deficiency treated
    with oral riboflavin and followed for a mean of 4.5 years, the neurological
    course was stable or moderately improved in two and plasma lactate decreased
    to near-normal levels in the third, and riboflavin supplementation of the
    culture medium doubled
    complex II activity in patient fibroblasts but not in control fibroblasts.

    Whether any of that transfers to NDAXOA is unknown and this entry does not
    claim it does. No patient with a dominant SDHA allele has been reported on
    riboflavin. There is a specific mechanistic reason for caution: raising FAD
    availability is a plausible remedy for a subunit that binds its cofactor
    poorly, but has no obvious mechanism against a subunit that cannot form the
    covalent linkage at all, and none at all if the dominant allele acts by
    competing for assembly slots. The intervention is nevertheless recorded
    because it is cheap, non-toxic and rationally connected to the curated
    mechanism, which is the strongest position available in a disease with no
    trials.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: riboflavin
      term:
        id: CHEBI:17015
        label: riboflavin
  therapeutic_modality: SMALL_MOLECULE
  action_category: THERAPEUTIC
  target_mechanisms:
  - target: Failure of Covalent FAD Attachment to the SDHA Flavoprotein
    treatment_effect: MODULATES
    description: >-
      Increasing flavin availability is intended to drive the FAD-loading step
      that the mutant subunit performs poorly. Recorded as MODULATES rather than
      RESTORES deliberately: RESTORES would assert that supplementation returns
      the disrupted step to normal function, and this entry argues the opposite
      elsewhere — extra FAD is a plausible remedy for a subunit that binds its
      cofactor weakly but has no obvious mechanism against one that cannot form
      the covalent linkage at all. The link is retained because the drug and the
      node are genuinely the same chemistry, but the direction and magnitude of
      the effect on this node are unestablished, and no patient with a dominant
      SDHA allele has been treated.
  evidence:
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report on three complex II-deficient children treated with riboflavin per os, who were followed-up for a mean period of 4.5 years."
    explanation: >-
      The only clinical experience of riboflavin in complex II deficiency.
      Marked PARTIAL because the three treated children had the recessive
      paediatric disorder, not this dominant entity, and the series is
      uncontrolled.
  - reference: PMID:16737791
    reference_title: "Effects of riboflavin in children with complex II deficiency."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Riboflavin supplementation to the growth medium of cultured fibroblasts resulted in a 2-fold increase of complex II activity in patients, but not in controls."
    explanation: >-
      Cell-level evidence that flavin supply is rate-limiting for complex II
      activity in complex II-deficient patient cells specifically. Marked
      PARTIAL because the fibroblasts came from children with recessive disease
      and the effect has never been tested on a dominant flavinylation-defective
      allele.
  notes: >-
    Recorded with deliberately conservative framing. Riboflavin responsiveness
    is established for some flavoprotein disorders and has never been tested in
    NDAXOA; the citation here is to a different SDHA-related disease and is
    marked PARTIAL for that reason on both evidence items. No dose is stated
    because none is established for this indication.
- name: Genetic counselling
  description: >-
    Counselling in this disorder is unusually difficult and the difficulty is
    specific rather than generic. A carrier faces a 50% transmission risk, but
    what is transmitted cannot be described: within one published family the
    same allele produced lethal infantile cardiomyopathy in one child and adult
    optic atrophy in another. Beyond that, the family must be told that the
    literature attaches a tumour-surveillance recommendation to SDHA pathogenic
    variants generally, that no such recommendation exists for adult-onset
    mitochondrial disease, and that the absolute risk of either outcome for
    their particular allele is unknown. Predictive testing of at-risk relatives
    therefore returns a result whose meaning is genuinely indeterminate.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  action_category: COUNSELING_INFORMATIONAL
  evidence:
  - reference: PMID:33960148
    reference_title: "Progressive cerebellar atrophy in a patient with complex II and III deficiency and a novel deleterious variant in SDHA: A Counseling Conundrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no similar screening or testing recommended for individuals potentially at risk for adult-onset mitochondrial disease. Additionally, the absolute risk for both conditions is unknown."
    explanation: "States the counselling asymmetry directly: a surveillance protocol exists for the tumour risk and nothing exists for the mitochondrial risk, with neither absolute risk quantified."
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As tumor screening is recommended for SDHx mutation carriers, this should also be considered for patients with mitochondrial disorders and their family members."
    explanation: An explicit recommendation that families ascertained through SDHx mitochondrial disease should be considered for tumour screening, which is the concrete counselling content this entry cannot avoid.
animal_models:
- species: Saccharomyces cerevisiae
  genotype: SDH1 C-terminal arginine substitutions (Arg582, Arg638 with Cys630)
  category: Site-directed mutagenesis of the orthologous flavoprotein subunit
  description: >-
    Budding yeast is the only tractable system in which the flavinylation
    chemistry proposed for this disorder has been dissected genetically. Mutation
    of C-terminal arginine residues of Sdh1, the SDHA orthologue, prevents
    covalent flavinylation and, for one residue, prevents assembly of the
    tetramer, while showing that assembly requires FAD binding but not
    necessarily the covalent linkage. The authors state that their results
    document the basis for the SDH deficiency and pathology seen with mutations
    in human Sdh1.

    Its limits should be stated plainly. The residues mutated are yeast Arg582
    and Arg638, not the human residues that cause this disease, and no
    alignment establishing correspondence to human Arg451 or Arg662 was
    performed here or asserted. The yeast work is therefore evidence that this
    class of lesion exists and behaves as modelled, not evidence about the human
    alleles. No animal model of NDAXOA exists in any species: there is no
    heterozygous Sdha knock-in mouse carrying either human allele, and
    homozygous Sdha disruption in mammals models the recessive disorder rather
    than this one.
  genes:
  - preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  associated_phenotypes:
  - Loss of covalent flavinylation of the Sdh1 flavoprotein subunit
  - Failure of succinate dehydrogenase tetramer assembly (Arg582)
  - Destabilisation of the flavinylation factor Sdh5
  evidence:
  - reference: PMID:23043141
    reference_title: "Flavinylation and assembly of succinate dehydrogenase are dependent on the C-terminal tail of the flavoprotein subunit."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mutation of Arg(582) in yeast Sdh1 precludes flavinylation as well as assembly of the tetrameric enzyme complex."
    explanation: The direct genetic demonstration that a single C-terminal arginine substitution in the flavoprotein subunit can abolish covalent flavinylation.
  - reference: PMID:23043141
    reference_title: "Flavinylation and assembly of succinate dehydrogenase are dependent on the C-terminal tail of the flavoprotein subunit."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "These results document the basis for the SDH deficiency and pathology seen with mutations in human Sdh1."
    explanation: >-
      The authors' own translation of their yeast result to human SDHA disease.
      Marked PARTIAL because it is an interpretive claim about human pathology
      made from yeast data on non-corresponding residues.
discussions:
- discussion_id: sdha-ndaxoa-dominant-negative-versus-haploinsufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the NDAXOA allele act by delivering a catalytically inert subunit into
    assembled complex II, or by simple haploinsufficiency, and why are
    heterozygous SDHA null carriers neurologically unaffected?
  rationale: >-
    This is the central unresolved mechanistic question of the entity and it is
    not academic. Heterozygous SDHA loss-of-function alleles are carried without
    neurodegeneration by the parents of children with recessive complex II
    deficiency and by members of tumour-predisposition families, yet a
    heterozygous missense allele at codon 451 causes progressive optic atrophy,
    ataxia, myopathy and cardiomyopathy. Half-normal enzyme activity, the
    measured phenotype, is equally consistent with losing one functional gene
    copy and with poisoning half the assembled complexes, so the biochemistry
    published so far cannot discriminate. The yeast result that assembly
    requires FAD binding but not covalent attachment makes the poisoning model
    concretely plausible, because a subunit blocked only at the covalent step
    could still occupy its slot. Resolving this determines whether truncating
    SDHA variants should ever be reported as a risk for neurodegeneration, which
    is a live reporting question for every diagnostic laboratory that finds one.
  attaches_to:
  - "pathophysiology#Catalytically Inert SDHA Subunit Competing for Complex II Assembly"
  - "pathophysiology#Failure of Covalent FAD Attachment to the SDHA Flavoprotein"
  proposed_experiments:
  - experiment_id: sdha-allele-specific-complex-occupancy
    name: Allele-specific quantification of SDHA within assembled complex II
    description: >-
      Use allele-discriminating mass spectrometry or epitope-tagged knock-in
      alleles in a heterozygous human cell model to measure the ratio of mutant
      to wild-type SDHA within assembled, membrane-associated complex II. Equal
      representation supports subunit competition; depletion of the mutant
      supports haploinsufficiency with degradation of the mutant polypeptide.
  - experiment_id: sdha-flavinylation-assay-human-alleles
    name: Direct measurement of covalent flavinylation of human p.Arg451Cys and p.Arg662Cys
    description: >-
      The SDHA-null human cell system this experiment needs already exists, and
      both alleles have already been through it: PMID:39321216 expressed each in
      a clonal human SDHA-knockout line and found both essentially inactive,
      with p.Arg451Cys retaining high SDHA protein (per-variant results from the
      PMC11611653 full text, Figures 2 and 5 and Table 1; the cached abstract is
      aggregate-only). What that study inferred rather than measured is the
      flavinylation step itself. The remaining
      experiment is therefore narrow: recover the mutant subunit from that same
      system and assay the covalent methyl-histidyl FAD linkage directly (e.g.
      by in-gel flavin fluorescence or intact-mass measurement of the
      holo-subunit), rather than inferring it from the bacterial orthologue,
      from structural modelling, or from loss of activity.
  - experiment_id: sdha-heterozygous-knockin-mouse
    name: Heterozygous Sdha knock-in mouse carrying the Arg451Cys-equivalent allele
    description: >-
      Compare a heterozygous missense knock-in with a heterozygous null on the
      same background, phenotyping the visual pathway, cerebellum, muscle and
      myocardium longitudinally. If only the missense heterozygote degenerates,
      the dominant-negative model is established in vivo.
- discussion_id: sdha-ndaxoa-tumour-risk-unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do carriers of the dominant neurodegenerative SDHA alleles have an elevated
    risk of paraganglioma, phaeochromocytoma or gastrointestinal stromal tumour,
    and should they be enrolled in SDHx tumour surveillance?
  rationale: >-
    The two questions a family actually asks are what will happen to them and
    what should be monitored, and this entity cannot answer either. Tumour
    surveillance is recommended for carriers of SDHA pathogenic variants and
    involves whole-body imaging plus biochemical testing, an appreciable
    lifelong burden. No tumour has been reported in either NDAXOA pedigree, but
    the total number of carriers ever followed is of the order of six, so the
    absence of reported tumours carries almost no statistical weight. The
    mechanistic argument cuts both ways: a missense allele that blocks
    flavinylation may or may not compromise the tumour-suppressor function of
    the locus, and the fact that a different substitution at the very same
    codon, p.Arg451His, has been reported in paraganglioma makes the position
    look precarious rather than reassuring. An independent group has framed this
    same problem as a counselling conundrum and concluded that the absolute risk
    of both outcomes is unknown.
  attaches_to:
  - "pathophysiology#Divergence From the SDHx Tumour-Predisposition Arm"
  proposed_experiments:
  - experiment_id: sdha-ndaxoa-carrier-tumour-registry
    name: International registry and prospective imaging of dominant SDHA neurodegeneration carriers
    description: >-
      Assemble all known carriers of dominant neurodegenerative SDHA alleles
      into a single registry with standardised whole-body MRI and plasma
      metanephrine surveillance, to convert an anecdotal absence of tumours into
      an estimate with a denominator.
  - experiment_id: sdha-allele-tumour-suppressor-assay
    name: Tumour-suppressor function assay of NDAXOA alleles
    description: >-
      Test p.Arg451Cys and p.Arg662Cys alongside the paraganglioma-associated
      p.Arg451His in the assays that define SDHx tumour behaviour, namely
      succinate accumulation, HIF stabilisation and 5-hydroxymethylcytosine
      loss, to establish whether the neurodegenerative alleles engage the
      oncometabolite arm at all.
  evidence:
  - reference: PMID:33960148
    reference_title: "Progressive cerebellar atrophy in a patient with complex II and III deficiency and a novel deleterious variant in SDHA: A Counseling Conundrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no similar screening or testing recommended for individuals potentially at risk for adult-onset mitochondrial disease. Additionally, the absolute risk for both conditions is unknown."
    explanation: An independent group states the same gap, that neither the tumour risk nor the mitochondrial-disease risk of an SDHA variant can be quantified for counselling.
- discussion_id: sdha-ndaxoa-tissue-expression-of-the-enzyme-defect
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    In which tissues is the complex II deficiency of dominant SDHA disease
    actually expressible, given that the two published biochemical studies
    disagree about fibroblasts and lymphocytes?
  rationale: >-
    This is a diagnostic question with an immediate consequence for patients. In
    the founding family the enzyme defect was present in muscle and platelet
    mitochondria and explicitly absent in cultured skin fibroblasts and
    immortalised lymphocytes; in the de novo case it was present in exactly
    those two cell types. If the founding family's pattern is the general one, a
    normal fibroblast complex II activity is uninformative and muscle biopsy
    remains necessary, which is a materially different clinical pathway from the
    alternative. The discrepancy might reflect the two different alleles, the
    two different laboratories and eras, culture conditions and flavin content
    of the medium, or a genuine tissue-specific difference in how the mutant
    subunit is handled. Nobody has tested which.
  attaches_to:
  - "pathophysiology#Approximately Half-Normal Succinate Dehydrogenase Activity"
  proposed_experiments:
  - experiment_id: sdha-parallel-tissue-enzymology
    name: Parallel multi-tissue enzymology in the same carriers
    description: >-
      Measure complex II activity in muscle, platelets, fibroblasts and
      lymphocytes from the same individuals carrying each allele, under
      standardised riboflavin-defined culture conditions, so that tissue
      differences can be separated from inter-laboratory and inter-era
      differences.
- discussion_id: sdha-ndaxoa-late-onset-in-the-name
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is "late-onset" a defensible part of the definition of this entity, given
    that the same allele killed an infant with cardiomyopathy at seven months?
  rationale: >-
    The MONDO and OMIM label commits the entity to a late onset, and the
    neurological arm does behave that way: the founding sisters were elderly and
    the index patient of the second family presented in adult life. But the same
    second family contains a child with cardiomyopathy from early childhood and
    an infant who died at seven months, and the third reported individual had
    childhood-onset optic atrophy with developmental delay. Either the entity is
    an adult neurodegeneration whose paediatric cardiac cases belong to a
    different term such as dilated cardiomyopathy 1GG, or "late-onset" describes
    only the neurological arm of a disorder that is not late in onset at all.
    This is not a naming quibble: it determines whether an infant with
    cardiomyopathy and a heterozygous SDHA missense variant is given this
    diagnosis, and therefore whether their relatives are told to expect optic
    atrophy.
  attaches_to:
  - "pathophysiology#Striated Muscle and Myocardial Energy Failure"
  - "phenotypes#Optic atrophy"
  proposed_experiments:
  - experiment_id: sdha-genotype-stratified-natural-history
    name: Genotype-stratified natural history of dominant SDHA carriers
    description: >-
      Prospectively phenotype all identified carriers of dominant SDHA missense
      alleles from childhood, with serial echocardiography, optical coherence
      tomography and cerebellar imaging, to establish whether the cardiac and
      neurological arms are sequential stages of one natural history or separate
      allele- or modifier-determined outcomes.
- discussion_id: sdha-ndaxoa-second-allele-attribution
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the de novo allele c.1984C>T (p.Arg662Cys) belong to this entity, given
    that its authors say it does and ClinVar carries no record for it against
    this condition?
  rationale: >-
    The attribution matters because it is the difference between an entity with
    one recurrent allele and an entity with an allelic series, and because the
    Arg662Cys case brings developmental delay and intellectual disability into
    the phenotype, features absent from both dominant pedigrees. The case for
    inclusion is strong on mechanism: it is a de novo heterozygous
    arginine-to-cysteine substitution with measured complex II deficiency and
    modelled impairment of C-terminal FAD binding, in an individual whose
    dominant clinical feature is progressive bilateral optic atrophy. The case
    against is that ClinVar's condition list for VCV000694327 contains
    paraganglioma syndrome 5, recessive complex II deficiency and hereditary
    cancer predisposition but not NDAXOA, and its aggregate classification is
    conflicting. No functional comparison of the two alleles has been performed.
  attaches_to:
  - "genetic#SDHA"
  proposed_experiments:
  - experiment_id: sdha-two-allele-side-by-side
    name: Side-by-side functional comparison of p.Arg451Cys and p.Arg662Cys
    description: >-
      Express both alleles in the same SDHA-null human cell background and
      compare covalent flavinylation, complex II assembly, residual enzyme
      activity and succinate accumulation. Concordant behaviour would support
      merging them into one allelic series for this entity; divergent behaviour
      would support keeping the Arg662Cys phenotype separate.
  notes: >-
    The ClinVar condition list and aggregate classification for VCV000694327
    were retrieved live on 2026-08-01 and are recorded in the entry-level notes
    with their endpoint. They are not quotable as a snippet because ClinVar is
    not a snippet-validated reference source in this repository.
- discussion_id: sdha-ndaxoa-no-neuropathology
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the cellular neuropathology of this disorder, given that no autopsy
    or ocular histology has ever been reported?
  rationale: >-
    Every tissue-level claim in this entry is an inference from clinical
    phenotype plus general mitochondrial cell biology. Nobody has counted
    retinal ganglion cells, examined an optic nerve, or counted Purkinje cells
    in an individual with a dominant SDHA allele. The entry conforms its
    cerebellar node to the shared Purkinje-degeneration module only at the
    clinical-consequence level for exactly this reason. Without tissue it is not
    known whether the cerebellar atrophy reflects Purkinje cell loss as in the
    spinocerebellar ataxias, granule cell or deep nuclear involvement, or
    predominantly white matter change, and it is not known whether the optic
    neuropathy involves the same prelaminar axonal segment that fails in Leber
    hereditary optic neuropathy.
  attaches_to:
  - "pathophysiology#Retinal Ganglion Cell and Optic Nerve Degeneration"
  - "pathophysiology#Cerebellar Degeneration and Ataxia"
  proposed_experiments:
  - experiment_id: sdha-oct-ganglion-cell-layer
    name: Optical coherence tomography of the retinal nerve fibre and ganglion cell layers
    description: >-
      Non-invasively quantify retinal nerve fibre layer and ganglion cell layer
      thinning in living carriers, establishing whether the lesion is a
      ganglion-cell axonopathy of the pattern seen in other mitochondrial optic
      neuropathies, and providing the first objective progression measure for
      this disorder.
  - experiment_id: sdha-ipsc-rgc-and-cerebellar-organoids
    name: Patient iPSC-derived retinal ganglion cells and cerebellar organoids
    description: >-
      Derive the affected cell types from carriers and measure complex II
      activity, oxygen consumption and survival, in the cells the disease
      actually damages rather than in the fibroblasts that may not even express
      the defect.

- name: Retinal Ganglion Cell and Optic Nerve Degeneration
  biological_scale: TISSUE
  description: >-
    Optic atrophy is the feature that names the disorder and the one that is
    present in every reported family. Its anatomical basis is the particular
    energetic geometry of the retinal ganglion cell: the cell body sits in the
    retina and generates the mitochondria, which are then transported down an
    axon that is unmyelinated and mitochondria-rich anterior to the lamina
    cribrosa and myelinated and mitochondria-poor behind it. The prelaminar
    segment therefore carries an unusually high, spatially concentrated demand
    for oxidative ATP with no local capacity to make more. Any systemic
    restriction of oxidative phosphorylation is felt there first, which is the
    accepted explanation for why chemically unrelated mitochondrial lesions,
    from mitochondrial DNA complex I mutations in Leber hereditary optic
    neuropathy to nuclear OPA1 mutations in dominant optic atrophy, all converge
    on the same optic neuropathy. Complex II deficiency joins that convergence
    from a different enzymatic starting point.

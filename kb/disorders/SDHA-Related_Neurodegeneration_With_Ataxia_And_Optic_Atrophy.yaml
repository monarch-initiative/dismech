    explanation: Describes the oncometabolite route that SDHx tumour alleles take, which is the arm this node exists to distinguish from the neurodegenerative arm.
  - reference: PMID:24781757
    reference_title: "SDHA mutations causing a multisystem mitochondrial disease: novel mutations and genetic overlap with hereditary tumors."
    supports: SUPPORT

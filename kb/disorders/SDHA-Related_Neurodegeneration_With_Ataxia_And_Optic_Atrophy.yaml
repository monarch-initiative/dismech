name: SDHA-Related Neurodegeneration With Ataxia and Optic Atrophy
creation_date: "2026-08-01T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: neurodegeneration with ataxia and late-onset optic atrophy
  term:
    id: MONDO:0031006
    label: neurodegeneration with ataxia and late-onset optic atrophy
description: >-
  Neurodegeneration with ataxia and late-onset optic atrophy (NDAXOA) is the
  autosomal dominant neurodegenerative phenotype of heterozygous missense
  variants in SDHA, the gene encoding the large flavoprotein (Fp) catalytic
  subunit of mitochondrial respiratory chain complex II (succinate
  dehydrogenase, succinate:ubiquinone oxidoreductase). Complex II is the only
  respiratory chain complex encoded entirely in the nuclear genome and the only
  one that belongs simultaneously to the tricarboxylic acid cycle and to the
  electron transport chain: SDHA oxidises succinate to fumarate using a
  covalently bound FAD cofactor and passes the electrons through the iron-sulfur
  clusters of SDHB to ubiquinone at the SDHC/SDHD membrane anchor.

  The disorder was defined biochemically before it was defined genetically. Two
  elderly sisters with late-onset neurodegenerative disease were reported with a
  partial, approximately 50% deficiency of complex II in muscle and platelet
  mitochondria; four years later the same family was shown to carry a
  heterozygous C-to-T transition in the flavoprotein gene, and mutation of the
  equivalent base in Escherichia coli was shown to yield an enzyme that cannot
  bind flavin adenine dinucleotide covalently. A second, independent pedigree
  with dominant transmission of a heterozygous SDHA missense allele presented
  with bilateral optic atrophy and an ocular movement disorder, progressive
  polyneuropathy, psychiatric involvement and cardiomyopathy, and in the two
  affected children with cardiomyopathy and methylglutaconic aciduria in early
  childhood. A third, unrelated individual carried a de novo heterozygous SDHA
  missense allele and presented with global developmental delay, intellectual
  disability and childhood-onset progressive bilateral optic atrophy. The whole
  published clinical experience of this entity is therefore those two pedigrees
  plus one singleton.

  The mechanism that these alleles share is not loss of the SDHA protein but
  loss of the chemistry that makes it catalytic. Both reported NDAXOA-associated
  substitutions replace an arginine with a cysteine and both are argued to
  disable covalent flavinylation or FAD binding rather than to abolish
  expression or assembly, and the measured consequence in patients is a roughly
  half-normal, not absent, succinate dehydrogenase activity. That partial,
  lifelong energetic shortfall is expressed selectively in the tissues with the
  least metabolic reserve and the least capacity for replacement: the retinal
  ganglion cells and their unmyelinated prelaminar axons, the cerebellum, and
  striated muscle including myocardium.

  NDAXOA is one of at least four distinct disease entities that MONDO assigns to
  SDHA, and the separation matters clinically. Biallelic loss-of-function
  genotypes cause the recessive infantile disorder mitochondrial complex II
  deficiency nuclear type 1 (Leigh syndrome and leukodystrophy); heterozygous
  loss-of-function genotypes behave as tumour-suppressor alleles and predispose
  to paraganglioma, phaeochromocytoma and gastrointestinal stromal tumour; a
  homozygous genotype has been associated with dilated cardiomyopathy 1GG; and
  NDAXOA is a dominant, adult-predominant neurodegeneration. This entry curates
  the last of these and deliberately draws the boundaries against the other
  three rather than merging them.
synonyms:
- NDAXOA
- neurodegeneration with ataxia and late-onset optic atrophy
- late-onset optic atrophy, ataxia and myopathy
- SDHA-related autosomal dominant complex II deficiency
- dominantly inherited succinate dehydrogenase flavoprotein subunit deficiency
parents:
- Mitochondrial Disease
- Hereditary Optic Neuropathy
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      The defining and most consistently reported morbidity is neurological and
      neuro-ophthalmological: progressive optic atrophy, cerebellar and gait
      ataxia, myopathy and, in one pedigree, a progressive polyneuropathy with
      psychiatric involvement. The optic neuropathy is a lesion of retinal
      ganglion cells and their axons, that is, of central nervous system tissue,
      rather than an ophthalmological disease of the globe. Cardiomyopathy is
      real and was lethal in one infant in the second pedigree, but it is not
      the presenting or defining feature of the entity, so a second
      CARDIOVASCULAR assignment is deliberately not made.
    evidence:
    - reference: PMID:10976639
      reference_title: "Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a complex II gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Previously, we identified a family with complex II deficiency and late-onset neurodegenerative disease with progressive optic atrophy, ataxia, and myopathy."
      explanation: The founding report characterises the phenotype as a late-onset neurodegenerative disease with optic, cerebellar and muscular components, which is the basis for the NEUROLOGIC chapter assignment.
  mechanistic_category:
  - classification_value: mitochondrial disease
    notes: >-
      A nuclear-encoded oxidative-phosphorylation disorder. The lesion is in a
      nuclear gene but the failing organelle and the failing chemistry are
      mitochondrial.
  icimd_category:
  - classification_value: complex_ii_subunits_and_assembly_factors
    notes: >-
      ICIMD category 7, nuclear-encoded disorders of oxidative phosphorylation,
      subgroup complex II subunit and assembly-factor defects. SDHA encodes the
      catalytic flavoprotein subunit of complex II. Note that the ICIMD
      classification does not distinguish the dominant neurodegenerative
      phenotype curated here from the recessive infantile phenotype; both fall
      in the same ICIMD cell, which is precisely why the MONDO-level split is
      worth preserving.
notes: >-
  Entity verification. Every identifier in this entry was resolved with OAK
  before it was written down, on 2026-08-01. `runoak -i sqlite:obo:mondo info
  MONDO:0031006 -O obo` returns the label "neurodegeneration with ataxia and
  late-onset optic atrophy", the synonym NDAXOA, xrefs OMIM:619259,
  MEDGEN:1779901, UMLS:C5543254 and GARD:0027269, the relationship `RO:0004003
  HGNC:10680 ! SDHA`, and the single superclass MONDO:0024237 (inherited
  neurodegenerative disorder). `runoak relationships -p RO:0004003
  MONDO:0031006` independently returns HGNC:10680 SDHA. `runoak -i sqlite:obo:hgnc
  info hgnc:10680` returns `hgnc:10680 ! SDHA` (the adapter flag is required; the
  bare `runoak info hgnc:10680` errors, and an earlier revision of this note
  recorded the command without it).

  Scope, and why this is not filed under complex II deficiency. `runoak -i
  sqlite:obo:mondo ancestors -p i MONDO:0031006` returns exactly: MONDO:0024237
  inherited neurodegenerative disorder, MONDO:0005559 neurodegenerative disease,
  MONDO:0002602 central nervous system disorder, MONDO:0005071 nervous system
  disorder, MONDO:0100545 hereditary neurological disease, MONDO:0003847
  hereditary disease, and the upper-level MONDO/BFO scaffolding. MONDO:0100294
  (mitochondrial complex II deficiency, nuclear type 1) is NOT among them, so
  NDAXOA is not a MONDO descendant of the recessive complex II disorder and this
  entry is not a subtype of `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`.
  `runoak relationships --direction down -p RO:0004003 HGNC:10680` returns four
  SDHA disease terms and no others: MONDO:0013339 dilated cardiomyopathy 1GG
  (OMIM:613642), MONDO:0013602 pheochromocytoma/paraganglioma syndrome 5
  (OMIM:614165), MONDO:0031006 this entry (OMIM:619259) and MONDO:0100294
  mitochondrial complex II deficiency nuclear type 1 (OMIM:252011). All four are
  curated below as differentials; none is merged into this entry, and the two
  existing SDHA-containing KB files
  (`kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml` and
  `kb/disorders/Pheochromocytoma_Paraganglioma.yaml`) were read but not
  modified.

  Named Entity Confusion preflight. The three primary clinical sources used here
  (PMID:8967754, PMID:10976639, PMID:27683074) plus the supporting case report
  (PMID:33471299) all name SDHA, or its protein-level designation "the
  flavoprotein subunit of complex II", as the causal gene; no competing gene
  dominates any of them. The OMIM/MedGen definition of C5543254 attributes the
  entity to Taylor et al. 1996 and Courage et al. 2017 and lists SDHA at 5p15.33
  as the associated gene, which matches the MONDO gene relationship exactly. The
  named NEC risk for this disease is the reverse of the usual one: the danger is
  not that the literature is about a different gene but that it is about a
  different SDHA disease. Papers found by an SDHA search are overwhelmingly
  about recessive Leigh/leukodystrophy or about SDHx tumour predisposition, and
  those were excluded rather than cherry-picked. Specifically excluded as
  off-entity: PMID:40045913 (biallelic SDHA, childhood focal seizures, yeast
  complementation) and PMID:41833598 (compound heterozygous SDHA, paediatric
  neurological disease) are recessive complex II deficiency, not NDAXOA;
  PMID:28724664 (SDHA variants of unknown significance) is a
  tumour-predisposition study. PMID:33960148 IS used, but only for the
  cross-phenotype contrast and the counselling problem it explicitly discusses,
  never as evidence for an NDAXOA phenotype: its proband is biallelic.

  One tumour-genetics paper is nonetheless used, deliberately, and the
  distinction matters. PMID:39321216 (Kent, Klug and Heinrich 2024) is a cancer
  variant-interpretation study and contributes nothing about the NDAXOA
  phenotype, but it is the only published work that has put the NDAXOA alleles
  themselves through a functional assay in a human system: it introduced SDHA
  missense variants into a clonal human SDHA-knockout cell line and measured SDH
  activity and SDHA protein abundance for each. Both codons this entry curates
  are in its panel — a statement read from the full text of PMC11611653
  (Figures 2 and 5, Table 1; retrieved 2026-08-01), not from the cached
  reference. Note the provenance limit that applies wherever this paper is
  cited below: references_cache/PMID_39321216.md is abstract-only, and the
  abstract reports the assay design and the aggregate results (72 variants
  characterised, 22 VUS assayed, 19 favouring pathogenicity) without naming
  p.Arg451Cys or p.Arg662Cys. Every evidence snippet taken from this PMID is
  therefore scoped to those aggregate statements, and every per-variant claim
  made in prose is marked inline as a full-text derivation so it is not
  mistaken for a snippet-verified assertion. It is cited only for allele-level
  function, never for phenotype, and the entry does not import its
  cancer-pathogenicity conclusions.

  Allele identity, and how it was verified. Neither of the two primary genetic
  reports names the founding-family allele in its abstract, so it is recorded
  here as a note with live provenance rather than as an evidence snippet.
  ClinVar VCV000449389 is NM_004168.4(SDHA):c.1351C>T (p.Arg451Cys); its
  RCV001363197 record classifies it Pathogenic specifically against
  "Neurodegeneration with ataxia and late-onset optic atrophy" (MedGen
  C5543254), submitted by OMIM, last evaluated 2021-04-08, no assertion criteria
  provided. The OMIM submission text in that record states that in the family
  originally reported by Taylor et al. (1996), Birch-Machin et al. (2000)
  identified a heterozygous c.1375C-T transition producing an arg408-to-cys
  (R408C) substitution, "this numbering is equivalent to R451C". That reconciles
  the mature-protein numbering used in the older complex II literature with the
  precursor numbering of NM_004168.4 and confirms that the Taylor, Birch-Machin
  and Courage families all concern the same codon. The record cites
  PMID:8967754, PMID:10976639 and PMID:27683074. Retrieved 2026-08-01 from
  https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=clinvar&rettype=vcv&id=449389&is_variationid
  and the matching esummary endpoint. The `&is_variationid` flag is required:
  without it the same URL returns an empty result set.

  Same codon, three diseases. The ClinVar record for VCV000449389 also states
  that a different substitution at the same codon, p.Arg451His, has been
  reported in individuals with paraganglioma with functional evidence of loss of
  function, and that a third substitution, p.Arg451Ser, was a de novo
  heterozygous change in an infant with cardiomyopathy. Codon 451 of SDHA
  therefore produces at least three clinically distinct dominant phenotypes
  depending on which residue replaces the arginine. This is the single strongest
  argument in the entry against collapsing the SDHA phenotypes into one entity,
  and it is recorded as a note because ClinVar is not a snippet-validated
  reference source in this repository.

  Variant classification is contested and is recorded as such. The aggregate
  ClinVar germline classification of VCV000449389 is "Conflicting
  classifications of pathogenicity" (last evaluated 2026-01-15). The seven
  submitter-level germline classifications retrieved on 2026-08-01 were:
  Pathogenic (OMIM), Pathogenic (3billion), Likely pathogenic (Labcorp Genetics,
  formerly Invitae), Likely pathogenic (Ambry Genetics), Likely pathogenic (Rady
  Children's Institute for Genomic Medicine), Uncertain significance (GeneDx)
  and Uncertain significance ("Giorgio Prodi" Cancer Research Center, University
  of Bologna). The same variant additionally carries an RCV against
  gastrointestinal stromal tumour classified Uncertain significance and an RCV
  against hereditary cancer-predisposing syndrome. A laboratory reporting this
  allele cannot present it as unqualified Pathogenic, and cannot report it
  against a single condition.

  The second allele is weaker than the first, and this entry says so. The
  variant reported in PMID:33471299, NM_004168.4:c.1984C>T (p.Arg662Cys), is
  ClinVar VCV000694327, whose aggregate germline classification is likewise
  "Conflicting classifications of pathogenicity" (last evaluated 2026-03-19).
  Critically, its ClinVar condition list is Pheochromocytoma/paraganglioma
  syndrome 5, Mitochondrial complex II deficiency nuclear type 1, hereditary
  cancer-predisposing syndrome and "not provided" - it carries NO record against
  NDAXOA. The authors of that paper describe their case as the second reported
  cause of this phenotype, but the community classification has not followed
  them. This entry therefore treats the Zehavi case as a phenotype-expanding
  candidate for the entity rather than as an established second NDAXOA allele,
  and does not claim two confirmed alleles. Retrieved 2026-08-01 from the ClinVar
  esummary endpoint for variation 694327.

  Phenotype provenance beyond the abstracts. The OMIM clinical synopsis for
  619259, as exposed through MedGen concept C5543254, records the following HPO
  terms for this entity: HP:0001251 Ataxia, HP:0002066 Gait ataxia, HP:0002078
  Truncal ataxia, HP:0002070 Limb ataxia, HP:0001272 Cerebellar atrophy,
  HP:0002317 Unsteady gait, HP:0001288 Gait disturbance, HP:0002172 Postural
  instability, HP:0002312 Clumsiness, HP:0000648 Optic atrophy, HP:0000505
  Visual impairment, HP:0007994 Peripheral visual field loss, HP:0000639
  Nystagmus, HP:0000640 Gaze-evoked nystagmus, HP:0000651 Diplopia, HP:0003326
  Myalgia, HP:0003690 Limb muscle weakness, HP:0012378 Fatigue, HP:0001638
  Cardiomyopathy, HP:0001640 Cardiomegaly, HP:0001635 Congestive heart failure,
  HP:0000716 Depression, HP:0002315 Headache, HP:0002321 Vertigo, HP:0003487
  Babinski sign, HP:0012534 Dysesthesia, HP:0001686 Loss of voice, HP:0006568
  Increased hepatic glycogen content and HP:0003535 3-Methylglutaconic aciduria.
  Retrieved 2026-08-01 from
  https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=medgen&retmode=json&id=1779901.
  Phenotypes taken from that synopsis and not present in a cached abstract carry
  no evidence item and say so in their own notes. Every HPO identifier reused
  from that list was independently re-verified with `runoak -i sqlite:obo:hp
  info` before being written into this file.

  Frequency bands are omitted from every phenotype, deliberately. The
  denominator across the entire published literature is two pedigrees and one
  singleton, and the two pedigrees are internally discordant (one lethal infant,
  one adult-onset optic neuropathy, same allele). Any FrequencyEnum band would
  be an artefact of a cohort of three to six people. Exact counts and their
  sources are recorded in each phenotype's notes instead, following
  `docs/frequency-evidence-guidelines.md`.

  Onset is not bound to a single enum. The entity name says "late-onset" and
  OMIM describes presentation in mid-adulthood, but the second pedigree includes
  an infant who died at seven months and a child with cardiomyopathy in early
  childhood, and the third reported individual had childhood-onset optic
  atrophy. Asserting an adult-onset category for the disorder would contradict
  half of the published cases. The tension is recorded as an open discussion
  rather than resolved by fiat.

  No GeneReviews chapter exists for this entity. Searched 2026-08-01: PubMed
  `SDHA AND (optic atrophy)` returned 10 records, of which only PMID:33471299
  and PMID:27683074 are human NDAXOA-relevant disease-gene reports and none is a
  GeneReviews chapter. The nearest GeneReviews coverage is the nuclear
  gene-encoded Leigh syndrome spectrum overview, which addresses the recessive
  SDHA disorder and not this one; it is already cited by the complex II
  deficiency entry and is not reused here.

  Structured-source evidence was unavailable in this checkout. `data/orphadata/`
  contains only a MANIFEST with no downloaded payload, so no Orphanet prevalence
  class could be consulted, and no ORPHA code appears among the MONDO xrefs for
  MONDO:0031006 in any case. No ClinGen Gene-Disease Validity assertion for the
  SDHA-NDAXOA pair could be retrieved. Both are recorded as gaps, not as
  assertions that no such classification exists.

  Repo observation, reported and not acted on per scope rules. The description
  in `kb/disorders/Mitochondrial_Complex_II_Deficiency_Nuclear_Type_1.yaml`
  states that MC2DN1 presents "less commonly with cardiomyopathy or a
  later-onset optic atrophy-ataxia-myopathy phenotype". The optic
  atrophy-ataxia-myopathy phenotype named there is the dominant entity curated
  in this file, which OAK shows is not a MONDO descendant of MONDO:0100294 and
  which arises from heterozygous rather than biallelic genotypes. That sentence
  therefore blurs the boundary this entry exists to draw. That file was NOT
  edited.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    A single heterozygous SDHA missense allele is sufficient to cause disease.
    Transmission was vertical in both reported pedigrees: two affected sisters
    in the first, and an affected father with two affected children in the
    second, whose report is titled for the dominant transmission it
    demonstrates. The third reported individual carried a de novo heterozygous
    allele with unaffected parents, which is the other signature of dominance.

    Dominance here is not equivalent to haploinsufficiency, and the distinction
    is load-bearing for the whole entry. Heterozygous SDHA loss-of-function
    alleles are carried, unaffected, by the parents of children with recessive
    complex II deficiency and by unaffected relatives in tumour-predisposition
    families, and at least one of them is not vanishingly rare: the recurrent
    nonsense allele c.91C>T (p.Arg31*) was found in 0.3% of healthy controls in
    the series cited below. If losing half the SDHA gene dosage were
    sufficient to cause optic atrophy and ataxia, those carriers would be
    affected and they are not. The dominant neurodegenerative alleles are
    instead specific missense substitutions at conserved arginines that are
    argued to produce a full-length subunit unable to carry its FAD cofactor.

    Expressivity within a single pedigree is extreme. In the second family the
    same heterozygous allele produced an index patient whose optic atrophy,
    polyneuropathy, psychiatric features and cardiomyopathy declared themselves
    over adult life, a son with cardiomyopathy from early childhood who did not
    develop optic atrophy until adulthood, and a daughter who died at seven
    months of cardiac insufficiency. Penetrance is recorded as UNKNOWN rather
    than complete: with two pedigrees in the world literature there is no
    denominator of obligate carriers from which to estimate it, and asserting
    COMPLETE would be an unsupported number dressed as an enum.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: UNKNOWN
  expressivity: VARIABLE
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report clinical and molecular investigations of three family members with a heterozygous mutation in the large flavoprotein subunit SDHA previously described to cause complex II deficiency."
    explanation: Three affected members of one family, each heterozygous for a single SDHA allele, is the direct demonstration of autosomal dominant transmission for this locus.
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second report presenting autosomal dominant inheritance of a SDHA mutation."
    explanation: The authors place their pedigree explicitly as the second dominant SDHA family, which both establishes the mode of inheritance and fixes the size of the published literature at two pedigrees.
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the four nuclear encoded proteins composing complex II (SDHA, SDHB, SDHC, SDHD) and currently known assembly factors SDHAF1 and SDHAF2 mainly recessively inherited mutations have been described in SDHA, SDHB, SDHD, and SDHAF1 to be causative for mitochondrial disease phenotypes."
    explanation: Establishes that dominant transmission is the exception rather than the rule for complex II subunit mitochondrial disease, which is what makes this entity a separate entry rather than a variant presentation of the recessive disorder.
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the patient and her unaffected parents identified the novel heterozygous de novo variant c.1984C > T"
    explanation: A de novo heterozygous allele in an affected child of unaffected parents is independent evidence that a single SDHA missense allele can be sufficient to cause the phenotype.
  - reference: PMID:33960148
    reference_title: "Progressive cerebellar atrophy in a patient with complex II and III deficiency and a novel deleterious variant in SDHA: A Counseling Conundrum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Korpershoek et al. identified this variant in 0.3% of healthy control patients and 3% of sporadic tumor patients."
    explanation: >-
      Source for the statement that heterozygous SDHA loss-of-function alleles
      circulate in unaffected people: the recurrent p.Arg31* nonsense allele was
      seen in 0.3% of healthy controls. Marked PARTIAL because it establishes
      carrier frequency for one null allele in one series, not that dominance
      here is non-haploinsufficient; it removes the premise from the
      unsupported-assertion column, nothing more.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Two pedigrees and one singleton constitute the entire published clinical
    experience of this entity at the time of curation: two elderly sisters
    (PMID:8967754, genotyped in PMID:10976639), three members of a second family
    (PMID:27683074), and one adolescent with a de novo allele (PMID:33471299,
    whose assignment to this entity is qualified in the entry notes).
    NOT_YET_DOCUMENTED is used rather than a qualitative ULTRA_RARE band because
    no prevalence or incidence estimate of any kind has been published for
    NDAXOA, MONDO:0031006 carries no Orphanet xref, and there is therefore no
    source to band. `rate_per_100000` is left empty because there is no basis
    for a number.

    The one quantitative anchor that does exist is upstream of the entity rather
    than about it: isolated complex II defects of any genotype account for about
    2% of all respiratory chain deficiency diagnoses, and NDAXOA is a small
    dominant subset of that 2%. No founder effect is asserted, and no ancestry
    is asserted either: none of the cited reports states the ancestry of any
    reported family. The only geographic information available is the location
    of the reporting centres (Newcastle upon Tyne, Bern, Afula), which is a fact
    about where the patients were investigated and must not be read as a
    statement about the patients' ancestry or as a population restriction.
  evidence:
  - reference: PMID:27683074
    reference_title: "SDHA mutation with dominant transmission results in complex II deficiency with ocular, cardiac, and neurologic involvement."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated defects of the mitochondrial respiratory complex II (succinate dehydrogenase, SDH) are rare, accounting for approximately 2% of all respiratory chain deficiency diagnoses."
    explanation: >-
      Quantifies the rarity of isolated complex II deficiency as a whole.
      Marked PARTIAL rather than SUPPORT because the 2% figure is for all
      isolated complex II deficiency of any genotype and inheritance, not for
      this dominant neurodegenerative entity, which is a small fraction of it.
  - reference: PMID:8967754
    reference_title: "Deficiency of complex II of the mitochondrial respiratory chain in late-onset optic atrophy and ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Respiratory chain defects involving complex II, which is entirely encoded by the nuclear genome, are comparatively rare."
    explanation: Independent statement of the rarity of complex II defects among respiratory chain disorders, from the report that first described this family.
pathophysiology:
- name: Heterozygous SDHA Missense Allele at a Conserved Arginine
  biological_scale: MOLECULAR
  description: >-
    The primary lesion is a single heterozygous missense change in SDHA at
    5p15.33, reported against transcript NM_004168.4. Both alleles associated
    with this phenotype substitute a cysteine for a conserved arginine: the
    founding-family allele c.1351C>T (p.Arg451Cys), historically written R408C in
    mature-protein numbering, and the de novo allele c.1984C>T (p.Arg662Cys).
    Neither is a truncating or splice-disrupting change, and neither is
    predicted to remove the protein. This matters because heterozygous SDHA
    truncating alleles are the recognised cause of a completely different
    disease, tumour predisposition, and do not cause neurodegeneration. The
    genotype-phenotype rule for SDHA is therefore not "how much protein is left"
    but "what kind of protein is made".
  genes:
  - preferred_term: SDHA
    term:
      id: hgnc:10680
      label: SDHA
  evidence:
  - reference: PMID:10976639
    reference_title: "Late-onset optic atrophy, ataxia, and myopathy associated with a mutation of a complex II gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected family members are now shown to carry a C-to-T transition in one allele of the nuclear gene encoding the flavoprotein subunit of complex II."
    explanation: Establishes the lesion as a heterozygous single-base change in the gene encoding the complex II flavoprotein subunit, that is, in SDHA, in the founding family.
  - reference: PMID:33471299
    reference_title: "A novel de novo heterozygous pathogenic variant in the SDHA gene results in childhood onset bilateral optic atrophy and cognitive impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing of the patient and her unaffected parents identified the novel heterozygous de novo variant c.1984C > T"
    explanation: Names the second candidate allele and the reference transcript against which SDHA variants are reported.
  notes: >-
    The p.Arg451Cys designation and its equivalence to the older R408C naming
    were verified against ClinVar VCV000449389 on 2026-08-01, not taken from
    memory; the provenance and the mature-versus-precursor numbering
    reconciliation are set out in the entry-level notes. Neither primary paper
    names its allele in the abstract, which is why this node carries no snippet
    for the specific substitutions.
  downstream:
  - target: Failure of Covalent FAD Attachment to the SDHA Flavoprotein
    description: >-
      Both substitutions are argued to disable the covalent flavinylation
      chemistry or the FAD-binding conformation of the subunit rather than to
      destabilise or truncate it.
- name: Failure of Covalent FAD Attachment to the SDHA Flavoprotein
  biological_scale: MOLECULAR
  description: >-
    SDHA is a flavoprotein whose catalytic activity depends absolutely on a FAD
    cofactor attached covalently to the subunit; without the covalent linkage
    the subunit cannot oxidise succinate. Two independent lines of evidence
    converge on this step for the two NDAXOA-associated alleles. For the
    founding-family allele, mutation of the equivalent base in the Escherichia
    coli orthologue produces an enzyme that is inactive and cannot bind FAD
    covalently. For the de novo allele, structural modelling of p.Arg662Cys
    predicts that it compromises the integrity of the FAD-binding region at the
    C-terminus and so impairs FAD binding.

    That convergence is not a coincidence of two arginines. Yeast mutagenesis of
    Sdh1 shows that a pair of spatially close C-terminal arginine residues,
    physically distant from the FAD-binding site itself, are required for
    covalent flavinylation and for assembly of the tetramer, and that FAD
    binding rather than covalent attachment is what stabilises the Sdh1
    conformation for association with its partners. Flavinylation is also an
    assisted reaction: the dedicated factor SDHAF2/SDH5 binds the catalytic
    subunit and is required for its flavination. The step is therefore a
    discrete, mutable chemistry, not a passive property of the folded protein,
    and it is a plausible point at which a single conservative-looking arginine
    substitution can abolish catalysis without abolishing expression.

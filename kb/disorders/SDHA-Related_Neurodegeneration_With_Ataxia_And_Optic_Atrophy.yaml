- name: Striated Muscle and Myocardial Energy Failure
  biological_scale: TISSUE
  description: >-
    Skeletal muscle and myocardium are the third and fourth tissues that a
    permanent half-normal oxidative capacity cannot support. In the founding
    family the muscle involvement took the form of a myopathy with myalgia and
    limb weakness in older adults, and muscle mitochondria were the tissue in
    which the enzyme deficit was demonstrable. In the second pedigree the
    cardiac involvement was earlier and far more severe than the neurological
    involvement: both children presented with cardiomyopathy in early childhood
    and one died of cardiac insufficiency at seven months, while their father's
    cardiomyopathy accompanied an adult neurological presentation. Cardiac
    disease is therefore not a late complication of this disorder but, in some
    carriers, its first and lethal manifestation.

    The accompanying methylglutaconic aciduria in the two affected children is
    the expected urinary signature of a mitochondrial energy defect rather than
    a specific marker of complex II, and it is what should prompt a
    mitochondrial workup in a child with unexplained cardiomyopathy.
  locations:

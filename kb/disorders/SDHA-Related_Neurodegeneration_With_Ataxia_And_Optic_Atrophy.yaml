- name: Catalytically Inert SDHA Subunit Competing for Complex II Assembly
  biological_scale: MOLECULAR
  description: >-
    This is the node that explains why the disease is dominant. Complex II is a
    heterotetramer containing exactly one copy of the flavoprotein subunit
    alongside the iron-sulfur subunit and the two transmembrane anchors, so
    every assembled complex commits to one SDHA molecule and there is no second
    copy to compensate. If the mutant subunit is still expressed and still
    competent to bind FAD non-covalently, it can be incorporated into complexes
    that are then structurally complete but catalytically dead, and it competes
    with the wild-type subunit for the available assembly slots. On that model a
    heterozygote loses close to half of total succinate dehydrogenase activity
    while retaining a full complement of assembled complex, which is precisely
    the biochemical picture reported in the founding family: an approximately
    50% enzyme deficit accompanied by an apparent overexpression of the 70-kDa
    flavoprotein subunit whose membrane-associated amount was nonetheless
    normal.

    The alternative reading, simple haploinsufficiency, would predict the same
    50% activity but is hard to reconcile with the population genetics.
    Heterozygous SDHA loss-of-function alleles are carried without
    neurodegeneration by the parents of children with recessive complex II
    deficiency and by members of tumour-predisposition families. The
    dominant-negative model accounts for that asymmetry; haploinsufficiency does
    not.

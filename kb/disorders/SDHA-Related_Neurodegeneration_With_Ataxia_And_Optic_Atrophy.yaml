- name: Approximately Half-Normal Succinate Dehydrogenase Activity
  biological_scale: CELLULAR
  description: >-
    The measured biochemical phenotype is a partial, roughly 50% deficiency of
    complex II and succinate dehydrogenase activity, reported concordantly in
    muscle and platelet mitochondria in the founding family and in fibroblasts
    and lymphocytes in the de novo case. This is the quantitative signature that
    separates NDAXOA from the recessive disorder, where biallelic
    loss-of-function genotypes drive activity far lower and produce infantile
    Leigh syndrome. A half-normal enzyme is compatible with decades of ordinary
    life and only fails where the metabolic margin is thinnest, which is the
    reason the disease is late in onset and restricted in the tissues it
    damages.

    Tissue expression of the defect is genuinely inconsistent between the two
    reports and this entry does not smooth that over. In the founding family the
    enzyme defect was explicitly not expressed in cultured skin fibroblasts or
    immortalised lymphocytes, so a normal fibroblast assay did not exclude the
    diagnosis; in the de novo case the defect was demonstrable in exactly those
    two cell types. The discrepancy has direct diagnostic consequences and is
    recorded as an open discussion.

- name: Divergence From the SDHx Tumour-Predisposition Arm
  biological_scale: MOLECULAR
  description: >-
    Loss of succinate dehydrogenase has a second, entirely different
    consequence: succinate accumulates and acts as an oncometabolite, inhibiting
    alpha-ketoglutarate-dependent dioxygenases, driving a pseudohypoxic
    transcriptional response and remodelling the epigenome. That is the route by
    which heterozygous SDHx loss-of-function alleles, with somatic loss of the
    second allele, cause paraganglioma, phaeochromocytoma and gastrointestinal
    stromal tumour. This node exists to state explicitly that NDAXOA is not
    known to travel that route, and to keep the two arms from being conflated.

    The empirical position, as of this curation, is that mitochondrial-disease
    SDHx genotypes and tumour SDHx genotypes have historically been reported as
    separate sets, with only isolated alleles crossing over. No tumour has been
    reported in either NDAXOA pedigree. Whether that reflects a real mechanistic
    divergence, in which a missense allele that blocks flavinylation without
    destroying the tumour-suppressor function of the locus fails to initiate
    tumorigenesis, or merely reflects the tiny number of carriers ever followed,
    is unresolved and is recorded as an open discussion rather than asserted in
    either direction. The practical consequence is that clinicians have to make
    a surveillance decision on absent evidence.

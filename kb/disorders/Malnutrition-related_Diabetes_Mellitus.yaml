diagnosis:
- name: Fasting Plasma Glucose and Hemoglobin A1c Measurement
  description: >-
    Documentation of diabetes-range fasting plasma glucose (commonly exceeding 200 mg/dL)
    and elevated HbA1c in a lean young individual with chronic undernutrition and absence
    of ketonuria.
  diagnosis_term:
    preferred_term: blood glucose measurement
    term:
      id: NCIT:C92744
      label: Blood Glucose Measurement
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This atypical form of DM comprises these unique phenotypical characteristics: young age of onset, male preponderance, features of chronic malnutrition, very low BMI (<19 kg/m2), ketosis resistance, and poor glycemic control (fasting plasma glucose >200 mg/dl) with relatively high insulin requirements (3,5,6)."
    explanation: Supports fasting plasma glucose measurement demonstrating severe hyperglycemia in lean malnourished patients.
- name: Serum C-Peptide Measurement
  description: >-
    Fasting and meal-stimulated serum C-peptide testing shows markedly reduced endogenous
    insulin secretion compared with type 2 diabetes and lipodystrophy, yet measurable
    residual meal response compared with classic autoimmune type 1 diabetes.
  diagnosis_term:
    preferred_term: C-peptide measurement
    term:
      id: NCIT:C74736
      label: C-peptide Measurement
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, individuals with diabetes and undernutrition show some unique features that do not fit the usual phenotype of type 2 diabetes mellitus, such as a low body mass index of <18.5 kg/m2, resistance to ketosis, and low serum C-peptide levels."
    explanation: Establishes low serum C-peptide levels as a key biochemical discriminator of undernutrition-associated diabetes.
- name: Islet Autoantibody Testing
  description: >-
    Evaluation for GAD65, IA-2, and other islet autoantibodies is typically negative in
    true malnutrition-related diabetes, helping exclude slow-onset autoimmune type 1
    diabetes.
  diagnosis_term:
    preferred_term: autoantibody measurement
    term:
      id: NCIT:C181397
      label: Autoantibody Measurement
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, ketosis resistance, antibody negativity, somewhat higher age of onset, and comparatively higher C-peptide levels differentiate it from T1D."
    explanation: Supports islet autoantibody negativity as a diagnostic feature distinguishing MRDM from type 1 diabetes.
treatments:
- name: Nutritional Rehabilitation
  description: >-
    Structured high-protein, micronutrient-replete nutritional rehabilitation to reverse
    severe wasting and restore lean body mass alongside glycemic control.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: nutritional therapy
    term:
      id: NCIT:C65017
      label: Nutritional Therapy
  target_mechanisms:
  - target: Weight Loss
    treatment_effect: MODULATES
    description: Protein-calorie and micronutrient repletion reverses acute catabolic wasting and lowers exogenous insulin demand as nutritional status recovers.
    evidence:
    - reference: PMID:32922057
      reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As the weight increases, his demand for insulin was decreased and the dose of insulin was de-escalated to 1.2 IU/Kg/day over 3 months."
      explanation: Demonstrates weight recovery and stabilization of insulin requirements during combined nutritional management and insulin therapy.
  evidence:
  - reference: PMID:40657327
    reference_title: "Type 5 diabetes as a growing malnutrition driven health crisis in low and middle income countries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Treatment typically focuses on nutritional rehabilitation and cost-effective oral antidiabetic therapies, rather than insulin dependence."
    explanation: Highlights nutritional rehabilitation as a foundational pillar of management in malnutrition-related diabetes.
- name: Insulin Replacement and Antihyperglycemic Therapy
  description: >-
    Carefully titrated exogenous insulin replacement (or oral insulin secretagogues in
    patients with sufficient residual beta-cell reserve) paired with nutritional support
    to control severe hyperglycemia without inducing hypoglycemia in lean,
    insulin-sensitive patients.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: injected insulin diabetes therapy
    term:
      id: NCIT:C179441
      label: Injected Insulin Diabetes Therapy
    therapeutic_agent:
    - preferred_term: human insulin
      term:
        id: CHEBI:5931
        label: insulin (human)
  target_mechanisms:
  - target: Insulin deficiency from beta-cell impairment in undernutrition
    treatment_effect: RESTORES
    description: Exogenous insulin replaces deficient endogenous beta-cell insulin output to restore peripheral glucose uptake and anabolism.
    evidence:
    - reference: PMID:32922057
      reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He started insulin (1IU/Kg/day) subcutaneously and nutritional management. On follow-up, RBS and FBS remained high and insulin was escalated to 3.32 IU/kg/day. Subsequently, serial RBS and FBS, the measurements were in the acceptable range and the patient was gaining weight."
      explanation: Demonstrates glycemic normalization and weight restoration with subcutaneous insulin replacement combined with nutritional therapy.
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Fifty percent of patients with undernutrition-associated diabetes mellitus may respond to oral antidiabetic agents, whereas the remaining 50% need insulin in low to moderate doses."
    explanation: Summarizes clinical responsiveness to low-to-moderate dose insulin or oral antidiabetic therapy in MRDM.

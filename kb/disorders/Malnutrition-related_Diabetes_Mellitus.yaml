name: Malnutrition-Related Diabetes Mellitus
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Malnutrition-related diabetes mellitus is a form of diabetes occurring in
  chronically undernourished individuals, increasingly recognized as a distinct
  type (type 5 diabetes) seen predominantly in low-resource settings. Its core
  mechanism is insulin deficiency from impaired pancreatic beta-cell development
  and function in the setting of early-life and ongoing undernutrition, rather
  than the autoimmune or insulin-resistant mechanisms of classic type 1 and type
  2 diabetes. Affected individuals are typically lean and present with marked
  hyperglycemia yet relative resistance to ketosis, distinguishing the condition
  from type 1 diabetes.
category: Complex
parents:
- Diabetes Mellitus

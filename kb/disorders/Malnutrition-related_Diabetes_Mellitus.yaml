  description: >-
    Prenatal, childhood, and adolescent protein-energy and micronutrient deprivation
    compromises endocrine pancreatic growth via oxidative stress, mitochondrial and
    endoplasmic reticulum stress, and persistent epigenetic alterations, diminishing
    pancreatic beta-cell mass.

    reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "thin, severely hyperglycemic and ketone resistant teenager with history and signs of chronic under-nutrition"
    explanation: >-
      Documents marked, sustained hyperglycemia in malnutrition-related diabetes,
      the shared trigger feeding the conserved diabetic vascular-complication
      cascade.

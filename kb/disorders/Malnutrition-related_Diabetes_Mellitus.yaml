pathophysiology:
- name: Insulin deficiency from beta-cell impairment in undernutrition
  description: Undernutrition-associated diabetes involves insulin deficiency from pancreatic beta-cell impairment.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell

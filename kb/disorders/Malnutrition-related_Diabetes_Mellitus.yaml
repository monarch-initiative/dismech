    term:
      id: UBERON:0001264
      label: pancreas
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  evidence:
  - reference: PMID:41456634
    reference_title: "Type 5 diabetes: A comprehensive review to understand the basis of diabetes of poverty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It also integrates evidence showing how early-life nutritional deprivation, including protein and micronutrient deficiencies, programmatically reduces β-cell mass and function through mechanisms such as mitochondrial dysfunction, endoplasmic reticulum stress, oxidative damage, and persistent epigenetic modifications."
    explanation: Details the developmental and cellular mechanisms by which early-life nutritional deprivation reduces pancreatic beta-cell mass.
  - reference: PMID:40657327
    reference_title: "Type 5 diabetes as a growing malnutrition driven health crisis in low and middle income countries."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Instead, it results from impaired pancreatic development and disrupted insulin signaling pathways due to prolonged nutritional deficiencies."
    explanation: Confirms impaired pancreatic development from chronic nutritional deficiency as the initiating tissue defect.
  downstream:
  - target: Insulin deficiency from beta-cell impairment in undernutrition
    description: Programmatically reduced beta-cell mass and cellular stress impair glucose-stimulated insulin secretion without islet autoimmunity.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Studies have shown that insulin deficiency due to pancreatic β-cell impairment is likely to contribute to the development of undernutrition-associated diabetes."
      explanation: Connects undernutrition-induced beta-cell impairment directly to insulin secretory deficiency.
- name: Insulin deficiency from beta-cell impairment in undernutrition
  biological_scale: CELLULAR
  description: >-
    Non-autoimmune pancreatic beta-cell secretory failure produces marked insulinopenia
    more severe than in type 2 diabetes while preserving peripheral and hepatic insulin
    sensitivity and low visceral and hepatocellular lipid content.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  biological_processes:
  - preferred_term: insulin secretion
    term:
      id: GO:0030073
      label: insulin secretion
    modifier: DECREASED
  locations:
  - preferred_term: islet of Langerhans
    term:
      id: UBERON:0000006
      label: islet of Langerhans
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The study results demonstrated that total insulin secretion was lower in individuals with low BMI diabetes (a term used to denote undernutrition-associated diabetes) in those with T2D but higher than in individuals with T1D (17). Lean individuals with diabetes had a higher insulin sensitivity than those with T2D."
    explanation: Pancreatic clamp data demonstrate severely reduced total insulin secretion with preserved insulin sensitivity relative to type 2 diabetes.
  downstream:
  - target: Chronic hyperglycemia and vascular complication risk
    description: >-
      Severe insulin secretory deficiency impairs peripheral glucose disposal and hepatic
      glucose regulation, driving sustained fasting and postprandial hyperglycemia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Studies have shown that insulin deficiency due to pancreatic β-cell impairment is likely to contribute to the development of undernutrition-associated diabetes."
      explanation: Supports beta-cell insulin deficiency as the direct upstream cause of chronic hyperglycemia in MRDM.
  - target: Residual Endogenous Insulin Restraining Ketogenesis
    description: Beta-cell secretory impairment is incomplete rather than absolute, leaving residual meal-responsive C-peptide and insulin release.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It has been suggested that individuals with undernutrition-associated diabetes have low insulin levels but are not low enough to develop ketoacidosis."
      explanation: Explains how partial preservation of insulin secretion prevents unrestrained ketogenesis despite marked hyperglycemia.
  - target: Weight Loss
    description: Persistent deficiency of anabolic insulin signaling promotes skeletal muscle catabolism and lipolysis, compounding baseline leanness.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Since insulin is an anabolic hormone that promotes lipogenesis and protein synthesis, its deficiency could lead to increased lipolysis and muscle wasting, possibly contributing to lower BMI (66)."
      explanation: Connects persistent insulin deficiency to lipolysis, muscle wasting, and weight loss.
- name: Residual Endogenous Insulin Restraining Ketogenesis
  biological_scale: ORGANISM
  description: >-
    Unlike autoimmune type 1 diabetes with absolute beta-cell loss, individuals with
    malnutrition-related diabetes retain low but meal-responsive endogenous insulin and
    C-peptide secretion (potentially reinforced by low dietary carnitine precursors),
    suppressing unrestrained hepatic ketogenesis and conferring clinical ketosis
    resistance even during insulin interruption.
  biological_processes:
  - preferred_term: ketone body biosynthetic process
    term:
      id: GO:0046951
      label: ketone body biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, resistance to ketosis and moderately low insulin levels distinguish undernutrition-associated diabetes from the typical presentation of T1D."
    explanation: Establishes moderately low but non-absent endogenous insulin secretion as the basis for ketosis resistance.
  downstream:
  - target: Hyperglycemia with ketosis resistance
    description: Residual insulin secretion restrains ketogenesis while remaining insufficient to normalize blood glucose, producing severe non-ketotic hyperglycemia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32922057
      reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On investigations;, he had hyperglycemic, glucosuria but no ketonuria."
      explanation: Demonstrates severe hyperglycemia and glucosuria without ketonuria despite months off exogenous insulin.
- name: Chronic hyperglycemia and vascular complication risk
  biological_scale: ORGANISM
  description: >-
    Marked, sustained hyperglycemia in malnutrition-related (type 5) diabetes drives
    osmotic diuresis and enters the conserved diabetic vascular-complication cascade
    captured by the diabetic_vascular_complications module (chronic hyperglycemia ->
    oxidative and AGE-RAGE stress -> endothelial dysfunction and vascular inflammation ->
    micro- and macrovascular injury).
  conforms_to: "diabetic_vascular_complications#Chronic Hyperglycemia"
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:32922057
    reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The objective of this case report is to highlight an unusual case of thin, severely hyperglycemic and ketone resistant teenager with history and signs of chronic under-nutrition to raise the awareness of clinicians on the existence of atypical phenotype of diabetes not fitting the current classification of diabetes."
    explanation: Documents severe sustained hyperglycemia in malnutrition-related diabetes, feeding both osmotic symptoms and chronic glycemic injury.
  downstream:
  - target: Hyperglycemia with ketosis resistance
    description: Sustained elevation of fasting and postprandial blood glucose manifests clinically as severe ketosis-resistant hyperglycemia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This atypical form of DM comprises these unique phenotypical characteristics: young age of onset, male preponderance, features of chronic malnutrition, very low BMI (<19 kg/m2), ketosis resistance, and poor glycemic control (fasting plasma glucose >200 mg/dl) with relatively high insulin requirements (3,5,6)."
      explanation: Quantifies severe fasting hyperglycemia (>200 mg/dL) with ketosis resistance as the defining metabolic phenotype.
  - target: Polyuria
    description: Marked hyperglycemia exceeds the renal glucose threshold, causing glucosuria and osmotic polyuria.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32922057
      reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He presented with polydipsia, polyuria, and weight loss since he discontinued the drug."
      explanation: Documents osmotic polyuria during uncontrolled hyperglycemia in MRDM.
  - target: Polydipsia
    description: Osmotic fluid loss from glucosuria triggers compensatory polydipsia.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32922057
      reference_title: "Malnutrition-Modulated Diabetes Mellitus in Children, Rare Disease with Atypical Presentation: Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He presented with polydipsia, polyuria, and weight loss since he discontinued the drug."
      explanation: Documents compensatory polydipsia accompanying uncontrolled hyperglycemia and glucosuria.

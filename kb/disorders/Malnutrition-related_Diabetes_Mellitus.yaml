      explanation: Establishes malnutrition-related diabetes mellitus as a poverty-associated metabolic disease concentrated in low- and middle-income countries.
environmental:
- name: Chronic Protein-Energy and Micronutrient Undernutrition
  presence: PRESENT
  description: >-
    Prolonged prenatal, childhood, and adolescent dietary deficiency of protein, calories,
    and micronutrients impairs endocrine pancreatic development and beta-cell secretory
    reserve.
  exposure_term:
    preferred_term: dietary protein deficiency
    term:
      id: ECTO:0400019
      label: exposure to decreased protein in food
  evidence:
  - reference: PMID:41456634
    reference_title: "Type 5 diabetes: A comprehensive review to understand the basis of diabetes of poverty."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It also integrates evidence showing how early-life nutritional deprivation, including protein and micronutrient deficiencies, programmatically reduces β-cell mass and function through mechanisms such as mitochondrial dysfunction, endoplasmic reticulum stress, oxidative damage, and persistent epigenetic modifications."
    explanation: Establishes chronic early-life protein and micronutrient deprivation as the upstream environmental exposure programming beta-cell deficiency in MRDM.
  influences_mechanisms:
  - target: Undernutrition-Induced Pancreatic Developmental Impairment
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Early-life protein and micronutrient deprivation directly impairs pancreatic beta-cell growth and epigenetic programming.
    evidence:
    - reference: PMID:40657327
      reference_title: "Type 5 diabetes as a growing malnutrition driven health crisis in low and middle income countries."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Instead, it results from impaired pancreatic development and disrupted insulin signaling pathways due to prolonged nutritional deficiencies."
      explanation: Links prolonged nutritional deficiencies directly to impaired pancreatic development.

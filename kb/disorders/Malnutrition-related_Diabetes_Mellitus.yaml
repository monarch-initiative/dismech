      label: insulin secretion
  evidence:
  - reference: PMID:40049652
    reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies have shown that insulin deficiency due to pancreatic β-cell impairment is likely to contribute to the development of undernutrition-associated diabetes."
    explanation: The review links undernutrition-associated diabetes to beta-cell impairment and insulin deficiency.
  downstream:
  - target: Chronic hyperglycemia and vascular complication risk
    description: >-
      Undernutrition-associated beta-cell impairment and the resulting insulin
      deficiency are the upstream route to the sustained hyperglycemia that then
      enters the shared diabetic vascular-complication cascade — the type-5
      counterpart of absolute insulin deficiency (type 1) or insulin resistance
      (type 2) reaching the same chronic-hyperglycemia node.
    evidence:
    - reference: PMID:40049652
      reference_title: "Undernutrition-Associated Diabetes Mellitus: Pathophysiology of a Global Problem."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Studies have shown that insulin deficiency due to pancreatic β-cell impairment is likely to contribute to the development of undernutrition-associated diabetes."
      explanation: >-
        Supports insulin deficiency from beta-cell impairment as the upstream
        cause of the undernutrition-associated hyperglycemia feeding the cascade.
- name: Chronic hyperglycemia and vascular complication risk
  description: >-
    The marked, sustained hyperglycemia of malnutrition-related (type 5) diabetes
    is the shared entry point to the conserved diabetic vascular-complication
    cascade captured by the diabetic_vascular_complications module (chronic
    hyperglycemia -> oxidative and AGE-RAGE stress -> endothelial dysfunction and
    vascular inflammation -> micro- and macrovascular injury -> diabetic
    end-organ complications). Whatever the upstream route to hyperglycemia (here
    undernutrition-associated beta-cell impairment rather than autoimmunity or
    insulin resistance), the downstream complication mechanism is shared.
  conforms_to: "diabetic_vascular_complications#Chronic Hyperglycemia"
  biological_processes:
  - preferred_term: glucose homeostasis
    term:
      id: GO:0042593
      label: glucose homeostasis
    modifier: ABNORMAL
  evidence:

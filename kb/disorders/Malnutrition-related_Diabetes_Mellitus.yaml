name: Malnutrition-Related Diabetes Mellitus
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Malnutrition-related diabetes mellitus (type 5 diabetes mellitus) is a distinct
  non-autoimmune form of severe insulin-deficient diabetes occurring in lean adolescents
  and young adults (typically body mass index below 18.5 kg/m2) with early-life and
  chronic protein-energy and micronutrient undernutrition, predominantly in low- and
  middle-income countries. Nutritional deprivation during prenatal and postnatal
  development impairs pancreatic beta-cell mass and secretory capacity while preserving
  peripheral and hepatic insulin sensitivity and maintaining low hepatic lipid content.
  Affected individuals present with marked fasting hyperglycemia, osmotic symptoms, and
  weight loss without diabetic ketoacidosis because residual endogenous insulin secretion
  remains sufficient to restrain ketogenesis.
synonyms:
- MRDM
- malnutrition-related diabetes mellitus
- type 5 diabetes mellitus
- malnutrition-modulated diabetes mellitus
- protein-deficient pancreatic diabetes
- ketosis-resistant diabetes
category: Complex
parents:
- Diabetes Mellitus

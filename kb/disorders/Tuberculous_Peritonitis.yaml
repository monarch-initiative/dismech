    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although very rare, PTB caused by Mycobacterium bovis rather than M.
      tuberculosis has been noted to occur following the ingestion of
      unpasteurized milk.
    explanation: >-
      Names M. bovis, acquired from unpasteurized milk, as a rare cause of
      peritoneal tuberculosis.
agent_life_cycle:
  description: >-
    M. tuberculosis passes between humans by inhaled aerosols, establishes a
    primary infection in the lung, and is carried through the blood or
    lymphatics to the peritoneum, where it can lie latent before
    reactivating. M. bovis has a cattle reservoir and reaches humans through
    unpasteurized milk.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: reservoir of Mycobacterium bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Following the inhalation of contaminated aerosols, Mycobacterium
      tuberculosis is recognized by macrophages in the lung alveoli by surface
      receptors
    explanation: >-
      Describes inhaled aerosols as the route by which the primary lung
      infection is acquired.
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Though rare, peritoneal infection by the intestinal tract is possible
      due to the ingestion of infected milk or sputum.
    explanation: >-
      Places infected milk, and so the cattle reservoir of M. bovis, upstream
      of the rare enteric route.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Airborne Mycobacterium tuberculosis acquisition with secondary peritoneal spread
  description: >-
    The infection is acquired by inhaling airborne bacilli. Peritoneal disease
    follows spread from the pulmonary focus through the blood or lymphatics,
    usually years later on reactivation.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In most cases, the bacterial spread is achieved by reactivation of TB in
      the lungs (or other solid organs) and subsequent hematogenous or
      lymphatic spread to the peritoneum
    explanation: >-
      Names bloodstream and lymphatic spread from the lungs as the usual route
      to the peritoneum.
- name: Foodborne Mycobacterium bovis acquisition
  description: >-
    Rarely, bacilli are swallowed in unpasteurized milk (M. bovis) or in
    sputum and reach the peritoneum through the intestinal mucosa and
    mesenteric lymph nodes.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Alternative routes of infection include ingestion of bacilli with
      subsequent passage to mesenteric lymph nodes through the Peyer's patches
      in intestinal mucosa as well as contiguous spread from infected lymph
      nodes, ileocecal TB, or genitourinary TB.
    explanation: >-
      Lists ingestion and contiguous spread as the less common routes.
has_subtypes:
- name: Wet-ascitic type
  display_name: Wet-ascitic type (tuberculous ascites)
  subtype_term:
    preferred_term: tuberculous ascites
    term:
      id: MONDO:0023153
      label: tuberculous ascites
  description: >-
    Presentation dominated by large-volume, high-protein, free or loculated
    ascites with miliary tubercles over the peritoneum. Differs from the other
    types in presentation (abdominal distension rather than pain and
    obstruction).
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The wet-ascitic type is defined by large amounts of loculated or high
      protein ascitic fluid.
    explanation: >-
      Defines the wet-ascitic type by its ascites.
- name: Fibrotic-fixed type
  description: >-
    Presentation dominated by matted loops of bowel adherent to the omentum
    and mesentery, often felt as an abdominal mass. Differs in presentation
    (mass, pain and obstruction rather than distension).
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The fibrotic type is characterized by interloped adhesions of bowel
      along the omentum and mesentery.
    explanation: >-
      Defines the fibrotic-fixed type by bowel adhesions to omentum and
      mesentery.
- name: Dry plastic type
  description: >-
    Presentation dominated by diffuse fibrous adhesions and peritoneal
    nodules with little fluid. Differs in presentation (pain and
    obstruction, little ascites).
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The dry plastic type is characterized by a gross inflammatory reaction
      demonstrated by diffuse fibrous adhesions and nodules all along the
      peritoneum. It should be noted, however, that PTB can present as a
      combination of these three variants.
    explanation: >-
      Defines the dry plastic type and states that the three types overlap.
  - reference: PMID:31293195
    reference_title: Controversies in classification of peritoneal tuberculosis and a proposal for clinico-radiological classification.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The classification system also fails to classify some patterns of
      peritoneal tuberculosis like an abdominal cocoon and a substantial
      overlap in various categories was found.
    explanation: >-
      A systematic review of the classification found substantial overlap
      between the types.
prevalence:
- population: Patients with tuberculosis (all sites)
  measure_type: UNKNOWN
  notes: >-
    Peritoneal disease accounts for about 25-50% of abdominal tuberculosis and
    0.1-0.7% of all tuberculosis cases. This is a share of tuberculosis cases,
    not a population rate, so no rate or band is asserted.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      TB of the peritoneum (PTB) accounts for about 25–50% of abdominal TB
      cases and 0.1–0.7% of all TB cases.
    explanation: >-
      Share of abdominal and of all tuberculosis that is peritoneal.
- population: Patients on peritoneal dialysis, single centre in Northern Taiwan, 1985-2019
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 202.9
  rate_denominator: PERSON_YEARS
  notes: >-
    2.029 culture-confirmed episodes per 1,000 patient-years among 2,084
    peritoneal dialysis patients.
  evidence:
  - reference: PMID:36632795
    reference_title: "Tuberculous peritonitis in patients on peritoneal dialysis: a 35-year experience from a large medical center in Northern Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      18 patients were diagnosed with TBP. The incidence was 2.029 episodes
      per 1000 patient-years.
    explanation: >-
      Incidence of tuberculous peritonitis in a peritoneal dialysis cohort.
environmental:
- name: Liver cirrhosis
  description: >-
    Cirrhosis, especially alcohol-related cirrhosis, is a major risk factor.
    It also blunts the diagnostic tests: ascitic ADA is lower and the
    serum-ascites albumin gradient is often high in cirrhotic patients.
  influences_mechanisms:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cirrhosis raises the risk of tuberculous peritonitis; malnutrition and
      impaired T cell-dependent function are proposed but unproven
      intermediates.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The mechanism behind the increased risk of PTB in cirrhosis secondary
        to alcoholic liver disease is unknown, though it has been hypothesized
        to involve the cumulative effects of factors not as prominent in
        nonalcoholic liver disease cases of cirrhosis, such as malnutrition and
        impaired T cell-dependent function.
      explanation: >-
        States that the mechanism is unknown and names the hypothesized
        intermediates.
  evidence:
  - reference: PMID:24669272
    reference_title: "Diagnostic feature of tuberculous peritonitis in patients with cirrhosis: A matched case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Patients with liver cirrhosis are at an increased risk of developing
      TBP
    explanation: >-
      The background of a case-control study states that cirrhosis raises the
      risk of tuberculous peritonitis.
  - reference: PMID:21944948
    reference_title: "Tuberculous peritonitis: analysis of 211 cases in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Disease histories included end-stage renal disease (20.9%), pulmonary
      tuberculosis (36.0%) and liver cirrhosis (23.7%).
    explanation: >-
      Nearly a quarter of 211 patients had cirrhosis and a fifth end-stage
      renal disease.
- name: Peritoneal dialysis for end-stage kidney disease
  description: >-
    Patients on continuous ambulatory peritoneal dialysis have impaired
    cell-mediated immunity, and the bioincompatible dialysate impairs
    peritoneal phagocytes and lymphocytes. Tuberculous peritonitis in these
    patients often has neutrophil-predominant effluent and is mistaken for
    bacterial peritonitis.
  influences_mechanisms:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Deficient cell-mediated immunity in renal failure and the dialysate's
      effect on peritoneal phagocytes and lymphocytes favour reactivation.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Additionally, the dialysis effluent used in continuous ambulatory
        peritoneal dialysis is bioincompatible due to its increased glucose
        concentration and nonphysiologic pH, impairing phagocytic and
        lymphocytic activity in the peritoneum and increasing risk of
        disseminated infection.
      explanation: >-
        Names the dialysate's effect on peritoneal immune cells as the
        mechanism of the added risk.
    - reference: PMID:38344729
      reference_title: Systematic Review on Treatment and Outcomes of Tuberculous Peritonitis in Patients on Peritoneal Dialysis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        This is likely due to the impaired cellular immunity in kidney failure
        4 and a compromised immune system that can trigger the reactivation of
        latent TB in the peritoneum caused by the hematogenous spread from
        previous pulmonary, active pulmonary, or miliary TB.
      explanation: >-
        The background of a systematic review attributes the risk to impaired
        cellular immunity triggering reactivation of a latent peritoneal focus.
  evidence:
  - reference: PMID:23143752
    reference_title: "Mycobacterium tuberculous peritonitis in CAPD patients: a report of 11 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      There were eleven patients (2.6 %) with tuberculous peritonitis among
      414 CAPD patients. M. tuberculosis accounted for 4.47 % of all
      peritonitis episodes.
    explanation: >-
      Reports the share of peritoneal dialysis patients and of dialysis
      peritonitis episodes due to tuberculosis.
- name: HIV infection
  description: >-
    HIV infection impairs the Th1 response and is a major risk factor for
    extrapulmonary tuberculosis, including peritoneal disease; peritoneal
    tuberculosis in untreated HIV can be relatively silent.
  influences_mechanisms:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Loss of the T-helper 1 response allows reactivation and spread.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The mechanism behind the increased susceptibility for PTB in HIV
        patients lies in the impairment of the T-helper cell 1-type immune
        response, a crucial part of the adaptive immune system for TB defense.
      explanation: >-
        Names impaired Th1 immunity as the mechanism of HIV-associated risk.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Up to 50% of patients with active TB who are HIV positive develop
      extrapulmonary manifestations, as compared to only 10–15% of those who
      have active TB but are HIV negative.
    explanation: >-
      Extrapulmonary disease is far commoner in HIV-positive tuberculosis.
  - reference: PMID:28185616
    reference_title: Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuberculous peritonitis is rare in the United States but continues to be
      reported to occur in certain high-risk populations, which include
      patients with AIDS or cirrhosis, patients on continuous ambulatory
      peritoneal dialysis, recent immigrants from areas of high endemicity,
      and those who are immunosuppressed.
    explanation: >-
      Lists AIDS, cirrhosis, peritoneal dialysis, migration from endemic areas
      and immunosuppression as the high-risk groups.
- name: Diabetes mellitus
  description: >-
    Diabetes is a reported risk factor, attributed to reduced phagocytic
    capacity of peritoneal macrophages.
  influences_mechanisms:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired peritoneal macrophage uptake and killing is the proposed
      mechanism, shown in diabetic mice.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The reason for an increased risk of PTB in diabetics is believed to
        involve reduced phagocytic capability of peritoneal macrophages.
      explanation: >-
        Names reduced peritoneal macrophage phagocytosis as the proposed
        mechanism.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diabetes has been identified as a significant risk factor for PTB
      susceptibility.
    explanation: >-
      Names diabetes as a risk factor.
- name: Immunosuppressive therapy (TNF inhibitors and corticosteroids)
  description: >-
    TNF-alpha inhibitors impair granuloma formation and maintenance, and
    corticosteroids also raise the risk of peritoneal tuberculosis.
  influences_mechanisms:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Blocking TNF-alpha impairs the granuloma that contains latent bacilli.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        With TNFα blocking medications such as infliximab and adalimumab,
        granuloma formation and maintenance is impaired and the likelihood of
        disseminated disease increases.
      explanation: >-
        Links TNF blockade to impaired granuloma maintenance and spread.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other inflammatory modulating medications, such as corticosteroids, have
      also been shown to increase the risk of developing PTB.
    explanation: >-
      Names corticosteroids as a risk factor.
pathophysiology:
- name: Primary Pulmonary Tuberculous Infection
  role: trigger
  description: >-
    Inhaled bacilli establish a primary, usually pulmonary, infection that is
    contained in granulomas and can stay latent for years. Only a minority of
    patients with tuberculous peritonitis have active pulmonary disease at
    presentation.
  biological_scale: ORGANISM
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:12145724
    reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Abnormal chest radiograph findings, ascitic fluid lymphocytosis, and
      biochemical findings for exudates could only identify 33%, 37%, and 53%
      of the cases, respectively.
    explanation: >-
      Only a third of 60 patients had an abnormal chest radiograph, so active
      lung disease is often absent at presentation.
  downstream:
  - target: Hematogenous and Lymphatic Seeding of the Peritoneum
    causal_link_type: DIRECT
    description: >-
      Bacilli from the pulmonary focus reach the peritoneum through the blood
      or through mesenteric lymph nodes.
    evidence:
    - reference: PMID:24669272
      reference_title: "Diagnostic feature of tuberculous peritonitis in patients with cirrhosis: A matched case-control study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Tuberculous peritonitis (TBP) is primarily caused by hematogenous
        spread and rarely results from the contagious spread of an infected
        bowel or fallopian tubes
      explanation: >-
        States that bloodstream spread is the main route to the peritoneum.
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        In most cases, the bacterial spread is achieved by reactivation of TB in
        the lungs (or other solid organs) and subsequent hematogenous or
        lymphatic spread to the peritoneum
      explanation: >-
        Names bloodstream and lymphatic spread from the lungs.
- name: Hematogenous and Lymphatic Seeding of the Peritoneum
  description: >-
    Bacilli carried in blood or lymph, or spreading from infected mesenteric
    nodes, bowel or fallopian tubes, establish a localized tuberculous focus
    in the peritoneum during the earlier infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  - preferred_term: mesenteric lymph node
    term:
      id: UBERON:0002509
      label: mesenteric lymph node
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathologic mechanism involves the activation of localized tuberculous
      focus in the peritoneum created by the hematogenous spread of bacteria
      from the primary pulmonary focus by mesenteric lymph nodes during prior
      infection.
    explanation: >-
      Describes the peritoneal focus as created by spread during the earlier
      infection.
  downstream:
  - target: Reactivation of Latent Peritoneal Tuberculous Focus
    causal_link_type: DIRECT
    description: >-
      The seeded focus reactivates, which is the commonest way peritoneal
      disease develops.
    evidence:
    - reference: PMID:31293914
      reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Most commonly, PTB develops as a result of reactivation of latent TB.
      explanation: >-
        Names reactivation of latent infection as the commonest pathway.
- name: Reactivation of Latent Peritoneal Tuberculous Focus
  description: >-
    When cell-mediated immunity fails (HIV, cirrhosis, renal failure,
    diabetes, immunosuppressive drugs), the latent peritoneal focus
    reactivates and bacilli multiply. Less often the peritoneum is involved
    during active pulmonary or miliary tuberculosis.
  biological_scale: TISSUE
  locations:
  - preferred_term: peritoneum
    term:
      id: UBERON:0002358
      label: peritoneum
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PTB can less commonly develop in the setting of active pulmonary of
      miliary TB by the same mechanism
    explanation: >-
      Notes that active pulmonary or miliary disease is the less common
      setting.
  downstream:
  - target: Caseating Granulomatous Peritoneal Inflammation
    causal_link_type: DIRECT

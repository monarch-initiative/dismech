      Caseating epithelioid granulomas with acid-fast bacilli in peritoneal
      biopsies.
  - reference: PMID:24956337
    reference_title: Role of laparoscopic peritoneal biopsy in the diagnosis of peritoneal tuberculosis. A seven-year experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Histopathological results confirmed granulomatous inflammation in 38
      patients (93%).
    explanation: >-
      Granulomatous inflammation in 93% of laparoscopic peritoneal biopsies.
progression:
- phase: Seeding and latency
  notes: >-
    Bacilli seed the peritoneum through the blood or lymphatics during the
    primary infection and stay latent.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathologic mechanism involves the activation of localized tuberculous
      focus in the peritoneum created by the hematogenous spread of bacteria
      from the primary pulmonary focus by mesenteric lymph nodes during prior
      infection.
    explanation: >-
      Describes the peritoneal focus as created during an earlier infection.
- phase: Active peritonitis
  notes: >-
    Reactivation produces an insidious illness over weeks to months with
    ascites, pain, fever and weight loss. Mean time from symptoms to diagnosis
    was about a month in a large series; untreated or late-treated disease
    carries high mortality, especially in older and cirrhotic patients.
  evidence:
  - reference: PMID:21944948
    reference_title: "Tuberculous peritonitis: analysis of 211 cases in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      with median age 61.0 years (range 43-72) and 29.2 days mean duration from
      symptoms to diagnosis.
    explanation: >-
      Mean interval of 29 days from symptoms to diagnosis.
  - reference: PMID:12145724
    reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thirty-one patients died, 26 of whom died < or =6 weeks after their
      initial presentation, often before the result of mycobacterial culture
      was available.
    explanation: >-
      Half of 60 patients died, most within six weeks and before culture
      results returned.
  - reference: PMID:21944948
    reference_title: "Tuberculous peritonitis: analysis of 211 cases in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Increased duration between symptoms and definitive diagnosis increases
      mortality risk.
    explanation: >-
      Diagnostic delay raises mortality.
- phase: Fibroadhesive sequelae
  notes: >-
    Inflammation heals with fibrosis and adhesions, which can cause recurrent
    pain and intestinal obstruction during or after treatment.
  evidence:
  - reference: PMID:9675450
    reference_title: Corticosteroid treatment of peritoneal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Nineteen controls compared with one case had recurrent abdominal pain.
    explanation: >-
      Recurrent abdominal pain in most patients treated with antituberculous
      drugs alone.
- phase: Response to treatment
  notes: >-
    Symptoms and ascites usually respond within the first three months of
    therapy.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Response to therapy in PTB is usually noted within the first 3 months of
      treatment and is guided by the resolution of presenting symptoms, such as
      ascites and normalization of laboratory values.
    explanation: >-
      Describes the expected timing of response.
diagnosis:
- name: Ascitic fluid analysis
  description: >-
    Diagnostic paracentesis shows an exudate with high protein and lymphocyte
    predominance. These features are suggestive, not diagnostic: in a series
    of 60 patients lymphocytosis and exudative chemistry identified only 37%
    and 53% of cases, and in peritoneal dialysis patients the effluent is
    usually neutrophil-predominant.
  diagnosis_term:
    preferred_term: diagnostic paracentesis
    term:
      id: NCIT:C15310
      label: Paracentesis
  evidence:
  - reference: PMID:37407244
    reference_title: An Updated Systematic Review and Meta-Analysis for the Diagnostic Test Accuracy of Ascitic Fluid Adenosine Deaminase in Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The ascitic fluid in tubercular infection shows high protein content
      (>3 g/dL), and 150 – 4,000/mm3 of cells with lymphocytic predominance.
    explanation: >-
      Describes the typical fluid profile.
  - reference: PMID:12145724
    reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Abnormal chest radiograph findings, ascitic fluid lymphocytosis, and
      biochemical findings for exudates could only identify 33%, 37%, and 53%
      of the cases, respectively.
    explanation: >-
      Lymphocytosis and exudative chemistry miss many cases.
  - reference: PMID:36632795
    reference_title: "Tuberculous peritonitis in patients on peritoneal dialysis: a 35-year experience from a large medical center in Northern Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Nine patients (50%) had WBC counts lower than 100 cells/μL and 13
      patients (72.2%) had neutrophilic predominant WBC counts.
    explanation: >-
      Dialysis effluent was neutrophil-predominant in most patients on
      peritoneal dialysis.
- name: Serum-ascites albumin gradient
  description: >-
    A gradient below 1.1 g/dL points to a non-portal cause. Sensitivity is
    high without liver disease but falls to 28-88% when cirrhosis coexists,
    and specificity is poor.
  diagnosis_term:
    preferred_term: serum-ascites albumin gradient measurement
    term:
      id: NCIT:C186093
      label: Serum-Ascites Albumin Gradient Measurement
  evidence:
  - reference: PMID:16197489
    reference_title: "Systematic review: tuberculous peritonitis--presenting features, diagnostic strategies and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      tuberculous peritonitis should be considered in the differential
      diagnosis of all patients presenting with unexplained lymphocytic ascites
      and those with a serum-ascites albumin gradient (SAAG) of <11 g/L
    explanation: >-
      A systematic review recommends considering the diagnosis with a low
      gradient.
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases where PTB diagnosis is complicated by chronic liver disease,
      the sensitivity of this calculation drops significantly to 28–88%.
    explanation: >-
      The gradient is unreliable with chronic liver disease.
- name: Ascitic adenosine deaminase
  description: >-
    Ascitic ADA is the most useful rapid test. Pooled meta-analyses give
    sensitivity 0.90-0.93 and specificity 0.94-0.96; an early meta-analysis
    of four prospective studies put the optimal cut-off at 39 IU/L, and
    reviews quote >30 U/L. Certainty of evidence is very low by GRADE, and
    the cut-off varies between studies. ADA is lower in cirrhosis and with
    increasing age, so lower cut-offs (about 27 U/L in cirrhosis, 20.5 IU/L
    in older non-cirrhotic patients) have been proposed.
  evidence:
  - reference: PMID:37407244
    reference_title: An Updated Systematic Review and Meta-Analysis for the Diagnostic Test Accuracy of Ascitic Fluid Adenosine Deaminase in Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled sensitivity was 0.90 (95% confidence interval [CI]: 0.85 -
      0.94) and pooled specificity was 0.94 (95% CI: 0.92 - 0.95).
    explanation: >-
      Pooled accuracy across 20 studies and 2,291 participants.
  - reference: PMID:37407244
    reference_title: An Updated Systematic Review and Meta-Analysis for the Diagnostic Test Accuracy of Ascitic Fluid Adenosine Deaminase in Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Ascitic fluid ADA is a useful test for the diagnosis of tuberculous
      peritonitis with good sensitivity and specificity however, with very low
      certainty of evidence evaluated by Grading of Recommendations,
      Assessment, Development and Evaluation approach.
    explanation: >-
      The certainty of the pooled estimate is very low.
  - reference: PMID:24049517
    reference_title: "Diagnostic accuracy of adenosine deaminase for tuberculous peritonitis: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The pooled sensitivity and specificity for diagnosing tuberculous
      peritonitis were 0.93 (95% CI: 0.89-0.95) and 0.96 (95% CI: 0.94-0.97),
      respectively.
    explanation: >-
      Pooled accuracy across 16 studies.
  - reference: PMID:16940883
    reference_title: "Value of adenosine deaminase (ADA) in ascitic fluid for the diagnosis of tuberculous peritonitis: a meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ADA levels showed high sensitivity (100%) and specificity (97%) using
      cut-off values from 36 to 40 IU/L. The included studies were
      homogeneous. Optimal cut-off point was determined at 39 IU/L
    explanation: >-
      Pooled accuracy and optimal cut-off from four prospective studies.
  - reference: PMID:23066321
    reference_title: Adenosine deaminase activity in tuberculous peritonitis among patients with underlying liver cirrhosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Using 27 U/L as the cut-off value of ADA, the sensitivity and specificity
      were 100% and 93.3%, respectively, for detecting TBP in the validation
      group.
    explanation: >-
      Performance at a lower cut-off in a cohort including cirrhotic patients.
  - reference: PMID:34332087
    reference_title: "The negative impact of increasing age and underlying cirrhosis on the sensitivity of adenosine deaminase in the diagnosis of tuberculous peritonitis: a cross-sectional study in eastern China."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ADA activity is negatively associated with increasing age and underlying
      cirrhosis.
    explanation: >-
      ADA falls with age and cirrhosis, reducing sensitivity.
- name: Ascitic interferon-gamma
  description: >-
    Ascitic interferon-gamma concentration had pooled sensitivity 0.93 and
    specificity 0.99 in six studies.
  diagnosis_term:
    preferred_term: interferon gamma measurement
    term:
      id: NCIT:C81996
      label: Interferon Gamma Measurement
  evidence:
  - reference: PMID:23539367
    reference_title: Assessment by meta-analysis of interferon-gamma for the diagnosis of tuberculous peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Analysis of IFN-γ level for TBP diagnosis yielded a summary estimate:
      sensitivity, 0.93 (95%CI, 0.87-0.97); specificity, 0.99 (95%CI,
      0.97-1.00)
    explanation: >-
      Pooled accuracy of ascitic interferon-gamma.
- name: Mycobacterial smear and culture of ascitic fluid
  description: >-
    Smear and culture are specific but insensitive because the disease is
    paucibacillary, and culture is slow; mortality is high in patients left
    untreated while waiting for culture results.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Acid-fast bacilli staining and Ziehl-Neelsen staining of aspirated
      ascitic fluid are generally insensitive up to 3%, while bacterial
      culture sensitivities range from 21–35%.
    explanation: >-
      Reports the low sensitivity of ascitic smear and culture.
  - reference: PMID:12145724
    reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      However, conventional microbiologic diagnostic methods are slow and not
      sensitive enough for establishing a diagnosis of tuberculous
      peritonitis.
    explanation: >-
      Conventional microbiology is too slow and insensitive.
- name: Laparoscopy with peritoneal biopsy
  description: >-
    The reference standard. Laparoscopy shows tubercles, adhesions and
    peritoneal thickening, and biopsy gives histology (caseating granulomas)
    and tissue for culture and molecular testing. In a series of 41 patients
    the gross appearance was typical in 93% and biopsy showed granulomatous
    inflammation in 93%, with a 5% complication rate.
  diagnosis_term:
    preferred_term: laparoscopic peritoneal biopsy
    term:
      id: NCIT:C51627
      label: Biopsy of Peritoneum
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The gold standard for definitive PTB diagnosis remains laparoscopy with
      peritoneal biopsy and subsequent pathological or microbiologic
      confirmation.
    explanation: >-
      Names laparoscopy with peritoneal biopsy as the reference standard.
  - reference: PMID:24956337
    reference_title: Role of laparoscopic peritoneal biopsy in the diagnosis of peritoneal tuberculosis. A seven-year experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The classical gross laparoscopic appearance of peritoneal tuberculosis
      was observed in 38 patients (93%), whereas laparoscopic findings were
      normal in 3 patients (7%).
    explanation: >-
      Typical laparoscopic appearance in 93% of 41 patients.
  - reference: PMID:24956337
    reference_title: Role of laparoscopic peritoneal biopsy in the diagnosis of peritoneal tuberculosis. A seven-year experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two patients experienced complications from laparoscopy (5%), but there
      were nolaparoscopy-related deaths.
    explanation: >-
      Laparoscopy carried a 5% complication rate and no deaths.
  - reference: PMID:12145724
    reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      peritoneal biopsy allowed early definitive diagnosis for 9 patients.
    explanation: >-
      Peritoneal biopsy gave an early definitive diagnosis.
- name: Serum CA-125 in the differential from ovarian carcinoma
  description: >-
    CA-125 is usually raised, so in women with ascites and a pelvic mass it
    does not separate peritoneal tuberculosis from ovarian or peritoneal
    carcinoma; tissue diagnosis is needed, and many such patients reach
    laparotomy.
  diagnosis_term:
    preferred_term: CA-125 measurement
    term:
      id: NCIT:C79089
      label: CA-125 Measurement
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      At cutoffs of 35 U/mL, CA-125 was found to have an average sensitivity of
      83.33% and a specificity of 50% for PTB.
    explanation: >-
      CA-125 is sensitive but has poor specificity.
  - reference: PMID:31133164
    reference_title: "Female Peritoneal Tuberculosis with Ascites, Pelvic Mass, or Elevated CA 125 Mimicking Advanced Ovarian Cancer: A Retrospective Study of 26 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Laparotomy was performed in 14 patients (70%) and laparoscopy in six
      patients (30%), out of whom two patients were converted to laparotomy
      due to severe adhesions.
    explanation: >-
      Most women whose disease mimicked ovarian cancer underwent surgery.
- name: Abdominal computed tomography
  description: >-
    CT shows ascites, smooth peritoneal thickening and nodules, omental
    changes and mesenteric lymphadenopathy, and guides biopsy.
  diagnosis_term:
    preferred_term: computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:24956337
    reference_title: Role of laparoscopic peritoneal biopsy in the diagnosis of peritoneal tuberculosis. A seven-year experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      peritoneal thickening and nodules in 37 (90%) and enlarged mesenteric
      lymph nodes in 11 (27%)
    explanation: >-
      CT findings in 41 patients biopsied for suspected disease.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard regimen as for pulmonary tuberculosis: isoniazid, rifampicin,
    pyrazinamide and ethambutol for two months, then isoniazid and
    rifampicin for at least four months. Randomized trials in intestinal and
    peritoneal tuberculosis found six months no worse than nine. The
    continuation phase is extended to seven months in HIV-positive patients
    not on antiretroviral therapy or responding slowly. Hepatotoxicity is the
    commonest reason to stop treatment and is more frequent with underlying
    liver disease, for which modified regimens are used.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Peritoneal Inflammation
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy kills the bacilli and resolves the granulomatous
      inflammation and ascites.
    evidence:
    - reference: PMID:12145724
      reference_title: Tuberculous peritonitis-associated mortality is high among patients waiting for the results of mycobacterial cultures of ascitic fluid samples.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Only 8 patients died of advanced disease after antituberculous therapy
        was started.
      explanation: >-
        Few deaths once therapy had started.
  evidence:
  - reference: PMID:16197489
    reference_title: "Systematic review: tuberculous peritonitis--presenting features, diagnostic strategies and treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      treatment for 6 months with the first-line antituberculous drugs
      (isoniazid, rifampicin, ethambutol and pyrazinamide) in uncomplicated
      cases.
    explanation: >-
      A systematic review recommends six months of first-line drugs.
  - reference: PMID:27801499
    reference_title: Six-month therapy for abdominal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      We found no evidence to suggest that six-month treatment regimens are
      inadequate for treating people that have intestinal and peritoneal TB,
      but numbers are small.
    explanation: >-
      A Cochrane review of three randomized trials supports six months.
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For HIV-positive patients not on antiretroviral therapy at the time of
      PTB diagnosis or for those with a delayed response to therapy, it is
      recommended that the continuation phase of treatment be extended to 7
      months.
    explanation: >-
      Extended continuation phase in HIV without antiretroviral therapy.
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      One study showed hepatotoxicity rates of 26% in a cohort with baseline
      liver disease treated with the standard quadruple-agent therapy with
      dual-agent continuation therapy
    explanation: >-
      Hepatotoxicity is common with baseline liver disease, a caveat for
      cirrhotic patients.
- name: Adjunctive Corticosteroids
  description: >-
    Corticosteroids added to antituberculous therapy to reduce peritoneal
    inflammation and fibrosis and so prevent adhesions and obstruction. A
    meta-analysis of three poor-quality studies (one quasi-randomized, two
    retrospective) found fewer strictures and obstructions, but the evidence
    is too weak to generalize and steroids are not routinely recommended.
    Corticosteroids are themselves a risk factor for tuberculous peritonitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Peritoneal Fibrosis and Adhesion Formation
    treatment_effect: INHIBITS
    description: >-
      Steroids are proposed to limit the fibrosis that produces adhesions.
    evidence:
    - reference: PMID:30324229
      reference_title: "Use of steroids for abdominal tuberculosis: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: >-
        Meta-analyses showed adjunctive steroids, with ATT is more effective
        than ATT alone in tuberculous peritonitis patients for the prevention of
        composite end point (RR 0.15 ... symptomatic stricture(RR 0.15 ... and
        intestinal obstruction (RR 0.18
      explanation: >-
        Fewer strictures and obstructions with steroids is indirect evidence
        that they limit adhesion formation.
  evidence:
  - reference: PMID:30324229
    reference_title: "Use of steroids for abdominal tuberculosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Although steroids seem to have some benefit in patients of tubercular
      peritonitis, the poor quality of studies limits the generalisability of
      the findings.
    explanation: >-
      The meta-analysis's own caveat on study quality.
  - reference: PMID:9675450
    reference_title: Corticosteroid treatment of peritoneal tuberculosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No case required laparotomy, had a diagnosis of intestinal obstruction,
      or visited the emergency department because of abdominal pain.
    explanation: >-
      None of nine steroid-treated patients developed obstruction in a
      retrospective comparison with 26 controls.
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While some modest benefit has been noted in small-scale studies,
      corticosteroids have not been extensively studied in this capacity and
      their use in PTB is not regularly recommended.
    explanation: >-
      Steroids are not routinely recommended.
- name: Surgery for Complications
  description: >-
    Surgery is reserved for bowel perforation, obstruction from adhesions,
    fistula, abscess and bleeding.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Intestinal obstruction
    treatment_effect: BYPASSES
    description: >-
      Adhesiolysis or resection relieves obstruction from adhesions.
    evidence:
    - reference: PMID:28185616
      reference_title: Tuberculous Peritonitis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Surgical approaches may be required to deal with complications including
        bowel perforation, intestinal obstruction from adhesions, fistula
        formation, or bleeding.
      explanation: >-
        Names obstruction from adhesions among the surgical indications.
  evidence:
  - reference: PMID:28185616
    reference_title: Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgical approaches may be required to deal with complications including
      bowel perforation, intestinal obstruction from adhesions, fistula
      formation, or bleeding.
    explanation: >-
      Lists the indications for surgery.
- name: Peritoneal Dialysis Catheter Management
  description: >-
    In patients on peritoneal dialysis, the catheter may be removed or
    retained. Pooled published reports show no survival difference between
    removal and retention, and retention after early diagnosis and a few days
    of therapy can be attempted, but most patients in registry data lost
    their catheter and moved to haemodialysis.
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:23143752
    reference_title: "Mycobacterium tuberculous peritonitis in CAPD patients: a report of 11 patients and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Based on the analysis of all published reports of tuberculous
      peritonitis, there was no significant difference in patient survival
      between patients in whom CAPD catheter was removed or retained.
    explanation: >-
      No survival difference between catheter removal and retention.
  - reference: PMID:38344729
    reference_title: Systematic Review on Treatment and Outcomes of Tuberculous Peritonitis in Patients on Peritoneal Dialysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Observed all-cause mortality rates were also higher as observed in the
      case studies (33%) and cohort studies (26%) than in the ANZDATA Registry
      cases (6%).
    explanation: >-

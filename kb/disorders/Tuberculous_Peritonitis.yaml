name: Tuberculous Peritonitis
creation_date: "2026-11-26T18:22:29Z"
description: >-
  Tuberculous peritonitis is infection of the peritoneum by Mycobacterium
  tuberculosis, and one of the commonest forms of abdominal tuberculosis. It
  usually follows reactivation of a latent peritoneal focus that was seeded
  through the blood or lymphatics from a primary pulmonary infection; less
  often bacilli reach the peritoneum from infected bowel, mesenteric lymph
  nodes or fallopian tubes, or, with Mycobacterium bovis, from unpasteurized
  milk. Caseating granulomatous inflammation studs the parietal and visceral
  peritoneum, omentum and mesentery with tubercles and produces a
  lymphocyte-predominant, protein-rich exudate with a low serum-ascites
  albumin gradient. Three overlapping clinical patterns are described: the
  wet-ascitic type (tuberculous ascites), the fibrotic-fixed type with matted
  bowel and omentum, and the dry plastic type with dense fibrous adhesions.
  Patients present over weeks to months with abdominal distension, abdominal
  pain, fever, weight loss and ascites, and women with ascites, a pelvic mass
  and raised CA-125 are often first thought to have ovarian carcinoma. Risk is
  highest with cirrhosis, peritoneal dialysis for end-stage kidney disease,
  HIV infection, diabetes and immunosuppressive drugs. Ascitic adenosine
  deaminase is a sensitive and specific rapid test, smear and culture of
  ascitic fluid are insensitive, and laparoscopy with peritoneal biopsy is the
  reference standard. Standard six-month antituberculous chemotherapy is
  effective; mortality is high when treatment is delayed, and adjunctive
  corticosteroids to prevent adhesions remain unproven.
category: Infectious Disease
disease_term:
  preferred_term: tuberculous peritonitis
  term:
    id: MONDO:0006000
    label: tuberculous peritonitis
parents:
- Tuberculosis
- Abdominal Tuberculosis
- Peritonitis
synonyms:
- peritoneal tuberculosis
- Mycobacterium tuberculosis peritonitis
- tuberculous ascites
notes: >-
  Scope and lumping. Tuberculous ascites (MONDO:0023153) is defined by MONDO
  as fluid accumulation with tubercles of 1-2 mm all over the peritoneum,
  which is the wet-ascitic type of tuberculous peritonitis described in the
  cited reviews, so it is recorded here as a subtype rather than curated as a
  separate entry. A systematic review of the classification (PMID:31293195)
  found substantial overlap between the wet, fibrotic and dry types and an
  unclear effect on management, so the three types are recorded as
  overlapping presentation subtypes, and no phenotype is stratified by them.
  Evidence is thin. Most pathogenesis statements come from narrative reviews,
  not from studies designed to test them, and the symptom frequencies come
  from retrospective hospital series (a Taiwanese series of 211 cases and a
  review table pooling 1,725 literature cases) that recruited many patients
  with cirrhosis or end-stage renal disease. Abdominal tenderness (49% in the
  pooled review table) has no HPO term (an OLS search of HP for "tenderness"
  returned only site-specific terms such as costovertebral angle tenderness)
  and is not recorded as a phenotype. NCIT has no adenosine deaminase
  measurement term (an OLS search of NCIT for "Adenosine Deaminase" returned
  only the enzyme, alleles and the deficiency), so the ascitic ADA diagnosis
  row carries no term. The neutrophil-predominant ascites seen in patients on
  peritoneal dialysis and in those with secondary bacterial peritonitis is
  recorded as a caveat in the ascitic fluid analysis row. Hepatic
  tuberculosis and the wider abdominal tuberculosis grouping are outside this
  entry. Seeded from
  `research/Tuberculous_Peritonitis-deep-research-claude_code.md` and PubMed
  searches; every quotation was re-read in the cached reference.
infectious_agent:
- name: Mycobacterium tuberculosis
  infectious_agent_term:
    preferred_term: Mycobacterium tuberculosis
    term:
      id: NCBITaxon:1773
      label: Mycobacterium tuberculosis
  description: >-
    The acid-fast intracellular bacterium that causes pulmonary tuberculosis
    and, after spread from a pulmonary or other focus, tuberculous peritonitis.
  evidence:
  - reference: PMID:37407244
    reference_title: An Updated Systematic Review and Meta-Analysis for the Diagnostic Test Accuracy of Ascitic Fluid Adenosine Deaminase in Tuberculous Peritonitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Peritoneal TB or tuberculous peritonitis means that the infection due to
      M. tuberculosis has resulted in inflammation of the peritoneum
    explanation: >-
      Defines tuberculous peritonitis as peritoneal inflammation caused by M.
      tuberculosis.
- name: Mycobacterium bovis
  infectious_agent_term:
    preferred_term: Mycobacterium bovis
    term:
      id: NCBITaxon:1765
      label: Mycobacterium tuberculosis variant bovis
  description: >-
    The bovine tubercle bacillus, a very rare cause of peritoneal tuberculosis
    acquired by drinking unpasteurized milk.
  evidence:
  - reference: PMID:31293914
    reference_title: "Diagnostic and Therapeutic Strategies for Peritoneal Tuberculosis: A Review."
    supports: SUPPORT

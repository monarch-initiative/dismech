pathophysiology:
- name: PPP3CA Auto-inhibitory Domain Gain of Function
  description: >-
    Calcineurin is held inactive by its auto-inhibitory domain, which occupies
    the catalytic site until calcium/calmodulin binding to the regulatory domain
    displaces it. Missense variants in the auto-inhibitory domain increase the
    calmodulin-dependent phosphatase activity of the alpha catalytic subunit.
    Removing the auto-inhibitory domain altogether, as the truncating
    p.Gln442Ter variant does, makes the recombinant enzyme almost as active
    without calmodulin as with it. This is the reverse of DEE91, where
    catalytic-domain variants reduce activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PPP3CA
    term:
      id: hgnc:9314
      label: PPP3CA
  molecular_functions:
  - preferred_term: calcineurin phosphatase activity
    term:
      id: GO:0033192
      label: calmodulin-dependent protein phosphatase activity
    modifier: INCREASED
  genetic_context:
    variant_origin: DE_NOVO
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:29432562
    reference_title: Loss-of-function and gain-of-function mutations in PPP3CA cause two distinct disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a yeast model system, we showed that the catalytic and AI domain mutations visibly result in decreased and increased calcineurin signaling, respectively."
    explanation: >-
      Heterologous expression in yeast shows that the AI-domain variants
      increase calcineurin signaling, whereas catalytic-domain (DEE91) variants
      decrease it.
  - reference: PMID:30254215
    reference_title: Novel calcineurin A (PPP3CA) variant associated with epilepsy, constitutive enzyme activation and downregulation of protein expression.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "Whereas very little activity is observed for WT CaN in the absence of CaM, CaN∆442 is almost as active in the absence as it is in the presence of CaM."
    explanation: >-
      Recombinant calcineurin truncated before the auto-inhibitory domain loses
      its calmodulin dependence. This is a truncating rather than a missense
      variant, so it supports loss of auto-inhibition as the mechanism only by
      analogy.
  downstream:
  - target: Increased Calcineurin Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29432562
      reference_title: Loss-of-function and gain-of-function mutations in PPP3CA cause two distinct disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Using a yeast model system, we showed that the catalytic and AI domain mutations visibly result in decreased and increased calcineurin signaling, respectively."
      explanation: The AI-domain variants raise downstream calcineurin signaling output in yeast.
- name: Increased Calcineurin Signaling
  description: >-
    Excess calcineurin-mediated signaling downstream of the hyperactive enzyme.
    Which calcineurin substrates and which tissues mediate the skeletal,
    craniofacial and neurodevelopmental features has not been studied; the
    calcineurin-NFAT pathway is the best-characterized output but has not been
    tested in this disorder.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: calcineurin-mediated signaling
    term:
      id: GO:0097720
      label: calcineurin-mediated signaling
    modifier: INCREASED
  evidence:

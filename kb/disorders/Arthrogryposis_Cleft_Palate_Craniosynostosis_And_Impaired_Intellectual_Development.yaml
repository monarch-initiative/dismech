name: Arthrogryposis, Cleft Palate, Craniosynostosis, and Impaired Intellectual Development
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
synonyms:
- ACCIID
- Craniosynostosis-microretrognathia-severe intellectual disability syndrome
description: >-
  Arthrogryposis, cleft palate, craniosynostosis, and impaired intellectual
  development (ACCIID; OMIM 618265) is an ultra-rare autosomal dominant multiple
  congenital anomaly syndrome caused by de novo heterozygous missense variants in
  the auto-inhibitory (AI) domain of PPP3CA, the alpha isoform of the catalytic
  subunit of the calcium/calmodulin-dependent phosphatase calcineurin. Affected
  individuals have developmental delay and moderate to severe intellectual
  disability together with craniosynostosis, micro-/retrognathia, cleft palate,
  brachydactyly, arthrogryposis and short stature; gracile bones with perinatal
  fractures, seizures, ventriculomegaly and periventricular white matter changes
  have also been described. The AI-domain variants increase calcineurin signaling,
  which is the opposite functional effect to the loss-of-function catalytic-domain
  variants that cause the allelic, nonsyndromic developmental and epileptic
  encephalopathy 91 (DEE91, curated separately as CN-Related Developmental and
  Epileptic Encephalopathy).
notes: >-
  Lump/split: kept as an entry separate from CN_Related_DEE (DEE91, MONDO:0020630).
  MONDO, OMIM (618265 vs 617711) and Orphanet (ORPHA:565858) treat the two as
  distinct diseases, and the defining study showed opposite functional effects
  (increased versus decreased calcineurin signaling in yeast) that track a
  different clinical picture (multiple congenital anomalies versus nonsyndromic
  epileptic encephalopathy). The published case base is very small: the two
  AI-domain missense individuals of PMID:29432562, plus the p.Gln442Ter
  individual of PMID:30254215, whom Orphanet counts toward this disorder but
  whose truncating variant its own authors discuss against the DEE91
  genotype-phenotype split. Phenotype frequencies are therefore omitted. A
  PubMed search for "PPP3CA" with craniosynostosis, arthrogryposis, cleft
  palate, skeletal or bone terms (October 2026) returned no further case
  reports. No GeneReviews chapter covers this disorder (just check-genereviews
  --online returned NO_CHAPTER for the name, both synonyms and the MONDO label).

  variants:
  - name: PPP3CA auto-inhibitory domain missense variants
    description: >-
      Two de novo missense variants in the auto-inhibitory domain were reported
      in individuals with multiple congenital anomalies. In a yeast assay they
      increased calcineurin signaling.
    clinical_significance: PATHOGENIC

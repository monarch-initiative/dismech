differential_diagnoses:
- name: Developmental and epileptic encephalopathy 91
  disease_term:
    preferred_term: developmental and epileptic encephalopathy 91
    term:
      id: MONDO:0020630
      label: developmental and epileptic encephalopathy 91
  description: >-
    Allelic PPP3CA disorder caused by loss-of-function catalytic-domain
    variants. It presents as a nonsyndromic early-onset epileptic encephalopathy
    without the congenital skeletal and craniofacial anomalies of ACCIID.
  distinguishing_features:
  - Catalytic-domain loss-of-function variants rather than auto-inhibitory-domain gain-of-function variants
  - Nonsyndromic epileptic encephalopathy without arthrogryposis, craniosynostosis or gracile bones
  evidence:
  - reference: PMID:29432562
    reference_title: Loss-of-function and gain-of-function mutations in PPP3CA cause two distinct disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, the catalytic domain mutations and frameshift mutation were consistently found in patients with nonsyndromic early onset epileptic encephalopathy."
    explanation: Contrasts the DEE91 presentation with the multiple congenital anomalies of the AI-domain variants.
discussions:
- discussion_id: truncating_variants_genotype_phenotype
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#PPP3CA Auto-inhibitory Domain Gain of Function
  prompt: >-
    Do PPP3CA variants that truncate the regulatory domain before the
    auto-inhibitory domain belong with ACCIID or with DEE91?
  rationale: >-
    Truncation before the auto-inhibitory domain makes the recombinant enzyme
    constitutively active, which predicts the ACCIID gain-of-function picture.
    Yet such variants have been found in individuals with and without
    dysmorphism, and in patient cells the truncated protein drives down
    full-length calcineurin, which could turn a gain of function into a net
    deficiency. Orphanet counts the p.Gln442Ter individual toward this disorder,
    while later studies group regulatory-domain truncations as a third class.
  evidence:
  - reference: PMID:30254215
    reference_title: Novel calcineurin A (PPP3CA) variant associated with epilepsy, constitutive enzyme activation and downregulation of protein expression.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In particular, our finding that c.1324C>T (p.(Gln442Ter)) causes gain of PPP3CA function implies that this and similar variants truncating the AID should cause dysmorphy. Whereas this is the case in our proband it does not hold for c.1333C>T (p.(Gln445Ter)) and c.1290dupC (p.(Met431Hisfs*20)) which were found, respectively, by Myers et al. (pat. 1) and Mizuguchi et al. (pat. 4) in individulas without dysmorphy"
    explanation: The authors state the genotype-phenotype inconsistency for AID-truncating variants.
  - reference: PMID:30254215
    reference_title: Novel calcineurin A (PPP3CA) variant associated with epilepsy, constitutive enzyme activation and downregulation of protein expression.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Intriguingly, in two types of cells examined (lymphoblasts and neuron like cells derived by reprogramming) the expression of CaN∆442 was associated with pronounced downregulation of the full length protein encoded by WT allele."
    explanation: Secondary loss of wild-type calcineurin protein complicates a simple gain-of-function reading.
- discussion_id: no_targeted_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  - pathophysiology#Increased Calcineurin Signaling
  prompt: >-
    Which calcineurin substrates and tissues mediate the skeletal and
    craniofacial anomalies, and could calcineurin inhibition modify them?
  rationale: >-
    The only functional readout of the disease variants is increased signaling
    in yeast. No study has examined calcineurin targets in bone, cartilage or
    neural tissue from patients or animal models carrying an auto-inhibitory
    domain variant, and no treatment beyond symptomatic care has been reported.
    The treatments section is empty for that reason.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twenty-eight affected individuals from fourteen unrelated families had been reported by
    2026: seventeen from eight families before the expanded cohort, plus eleven from six
    Middle Eastern families in it. No population prevalence estimate exists for LGMDR28
    specifically, and none is asserted here. The commonly quoted figure of about 1 in
    61,000 is for limb-girdle muscular dystrophy as a whole across roughly 39 subtypes, so
    it is not a rate for this one and is deliberately not recorded as a numeric band.
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 17 affected individuals from eight unrelated families have been reported to harbor biallelic variants in the HMGCR gene."
    explanation: The published case count prior to the expanded cohort.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report eleven individuals from six unrelated Middle Eastern families diagnosed with LGMDR28 and carrying homozygous variants in HMGCR."
    explanation: The additional cases that bring the published total to twenty-eight.
progression:
- phase: Onset
  age_range: birth to fourth decade
  notes: >-
    Age of onset spans birth to the fourth decade. Severity and rate of progression do not
    correlate with how early the disease starts, and both inter- and intrafamilial
    variability are marked, including among carriers of the same homozygous allele.
    Presentation is commonly an incidental creatine kinase elevation rather than a
    complaint of weakness.
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important to note that early (even as early as neonatal) onset does not seem to correlate with severity of progression based on our cohort and this agrees with previous reports."
    explanation: States explicitly that onset age does not predict severity.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age of onset ranges from birth in the case of family 3 to as late as 14 years in family 1."
    explanation: Documents the onset range within a single recurrent genotype.
- phase: Progression to loss of ambulation and respiratory failure
  notes: >-
    Weakness advances to wheelchair dependence, then in the severe cases to a bedridden
    state with joint contractures, restrictive respiratory failure, nocturnal or
    continuous ventilation and tracheostomy. Deaths in the published cohorts have been
    from respiratory failure. Creatine kinase falls back towards and below normal late in
    the disease as muscle mass is lost, which can mislead if it is the only marker
    followed.
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With disease progression and muscular atrophy, CK levels gradually normalized and eventually even dropped beneath normal limits, alongside a simultaneous drop in creatinine levels, consistent with low skeletal muscle mass"
    explanation: Documents the late fall in creatine kinase as muscle mass is lost.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients experienced rapid disease progression, leading to severe muscular atrophy, significant mobility decline, and respiratory difficulties necessitating ventilatory support and, eventually, tracheostomy."
    explanation: The progression trajectory in the most severely affected reported sibship.
diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    The diagnosis is molecular. Targeted neuromuscular gene panels have repeatedly been
    negative in these patients, both because HMGCR was not on older panels and because at
    least one recurrent allele is not flagged by in silico predictors, so exome or genome
    sequencing with periodic reanalysis is what makes the diagnosis.
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The c.2519G>A variant that we describe here is not predicted strongly to be deleterious by most in silico tools and was overlooked in the analysis of NGS data."
    explanation: Explains why sequencing must be reanalysed rather than trusted on first pass.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on the initial clinical suspicion of limb-girdle muscular dystrophy, we conducted sequence analysis and deletion/duplication testing of the 117 genes present in the Neuromuscular Disorders Panel which turned out to be inconclusive."
    explanation: Documents the failure of a large targeted panel in a patient who was subsequently diagnosed.
- name: Hepatic monitoring
  description: >-
    Following the recognition of true hepatic involvement in one family, a liver panel
    beyond transaminases is recommended alongside creatine kinase, because transaminase
    elevation in a myopathy is otherwise readily attributed to muscle injury.
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we recommend monitoring not only CPK but also a broader liver panel (bilirubin, GGT, alkaline phosphatase, albumin, and INR), with further hepatology evaluation and imaging as indicated"
    explanation: The published monitoring recommendation this item records.
treatments:
- name: Oral Mevalonolactone
  description: >-
    Metabolite replacement directed at the missing pathway product. Mevalonolactone is not
    an available pharmaceutical preparation and was synthesised and purified for the
    purpose, then given under an expanded-access authorisation to the single most severely
    affected patient of the founding kindred, who gained strength on dynamometry and
    manual testing and improved substantially on spirometry. The evidence is one patient
    treated openly without a control, so this is a promising directed therapy rather than
    an established one.
  notes: >-
    Two deliberate restraints. The CHEBI binding is to the stereochemically unspecified
    `CHEBI:194429 mevalonolactone` rather than to `CHEBI:67849 (R)-mevalonolactone`,
    because the paper states only that the compound was produced by batch fermentation and
    purified to over 94% and never names the enantiomer; binding the (R) form would assert
    a fact the source does not give. Second, the paper's discussion says "Further large
    clinical trials are in place", but no registry identifier is published with it. A
    ClinicalTrials.gov API query for "mevalonolactone" and for "HMGCR muscular dystrophy"
    returned zero studies each on 2026-08-31, and `just ictrp-fetch` takes a trial
    identifier rather than a search term, so no WHO ICTRP record could be looked up
    either. No `clinical_trials` entry is therefore curated: this records that the trial
    could not be located, not that none exists.

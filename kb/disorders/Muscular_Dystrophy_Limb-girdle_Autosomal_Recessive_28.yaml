histopathology:
- name: Non-specific myopathic change with normal muscular dystrophy immunohistochemistry
  description: >-
    The biopsy is characteristically unhelpful, which is itself diagnostically
    informative. Findings range from non-specific dystrophic or myopathic change to a
    biopsy that is essentially normal, with no necrosis, fibrosis or inflammatory
    infiltrate in the founding kindred. Immunostaining for dystrophin, the sarcoglycans
    and dysferlin is normal, so the structural LGMD subtypes are excluded on the biopsy
    without this one being identified by it.
  notes: >-
    Deliberately incomplete, and the gap is in the sources rather than in the disease.
    HPO curates finer biopsy findings for this disease from the discovery cohort
    (PMID:37167966): type 1 fiber predominance 4/4, centrally nucleated fibers 3/3,
    increased endomysial connective tissue 2/3, increased intramyocellular lipid droplets
    1/3, and reduced muscle fiber alpha-dystroglycan 1/1. Those come from that paper's
    full text and supplement; `references_cache/PMID_37167966.md` is abstract-only, whose
    only histological statement is the "non-specific dystrophic changes" quoted below. The
    findings are therefore recorded here as a pointer rather than curated as evidence
    items, because no exact quote supporting them is available in the cache. A curator
    with full-text access should add them. Note in particular that "non-specific" in the
    abstract should not be read as "normal": the founding kindred's near-normal biopsy
    (PMID:36745799) is the exception rather than the rule.
  evidence:
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies in most affected individuals showed non-specific dystrophic changes with non-diagnostic immunohistochemistry."
    explanation: Describes the non-specific biopsy and non-diagnostic immunohistochemistry across the defining cohort.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main immunostainings (against dystrophin, sarcoglycans and dysferlin) were reported as normal."
    explanation: Names the specific structural proteins whose normal staining excludes the sarcolemmal subtypes.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathological evaluation did not reveal any pathological features such as fibrosis or inflammation, with the exception of mild deficiency of type-II muscle fibers in one patient"
    explanation: The founding kindred's biopsies, notable for the absence of the usual dystrophic features.
genetic:
- name: HMGCR (3-hydroxy-3-methylglutaryl-CoA reductase)
  gene_term:
    preferred_term: HMGCR
    term:
      id: hgnc:5006
      label: HMGCR
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The only gene associated with this disease, and the only gene MONDO links to it by
    `RO:0004003`. Reported disease alleles are missense or in-frame and cluster in the
    catalytic domain; a homozygous null has never been reported in a living patient, which
    fits the embryonic lethality of the complete mouse knockout. ClinGen currently grades
    the gene-disease relationship as moderate.
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, all reported variants are missense or in-frame, except for a splicing variant whose consequences are not clarified."
    explanation: Characterises the allelic spectrum as hypomorphic rather than null.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the gene-disease relationship is categorized as moderate by the ClinGen expert panel"
    explanation: Expert-panel gene-disease validity classification, quoted rather than asserted.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Filtering through whole-exome sequencing data of patients V:13 and V:2 (Methods), only a single variant was found within the 3.2 Mbp locus"
    explanation: >-
      Linkage plus exome in the founding kindred leaves exactly one candidate in the
      disease interval, which is the argument against a second causal gene at this locus.
variants:
- name: NM_000859.3:c.2465G>A p.(Gly822Asp)
  description: >-
    The founding allele, homozygous in six affected members of a consanguineous Bedouin
    kindred from the Negev with fourth-decade-onset disease. Enzymologically the best
    characterised of the disease alleles: it leaves the protein correctly localised while
    reducing turnover and substrate affinity.
  gene:
    preferred_term: HMGCR
    term:
      id: hgnc:5006
      label: HMGCR
  type: missense variant
  clinical_significance: PATHOGENIC
  functional_effects:
  - function: HMG-CoA reductase catalytic activity
    type: partial loss of function
    description: >-
      Reduces Vmax by 69% and raises Km for HMG-CoA by 65%, with a catalytic pocket that
      no longer binds pravastatin, while subcellular localisation is unchanged.
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "only a single variant was found within the 3.2 Mbp locus: g.5:75359992G>A (GRCh38/hg38); NM_000859.3:c.2465G>A; p.(G822D) in HMGCR"
    explanation: Identifies the allele by linkage and exome sequencing in the founding kindred.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both WT and mutant HMGCR protein (green) are located in clusters in the cytoplasm with some relation to the endoplasmic reticulum (red)."
    explanation: Shows the allele does not mislocalise the protein, which is why it is classified as a catalytic rather than a trafficking defect.

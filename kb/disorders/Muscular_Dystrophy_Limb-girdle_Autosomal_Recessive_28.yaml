- Autosomal Recessive Limb-Girdle Muscular Dystrophy
notes: >-
  Entity verification. `runoak -i sqlite:obo:mondo info MONDO:0957270 -O obo` on
  2026-08-31 returns the label "muscular dystrophy, limb-girdle, autosomal recessive 28",
  the relationship `RO:0004003 HGNC:5006 ! HMGCR`, the single superclass MONDO:0015152
  (autosomal recessive limb-girdle muscular dystrophy), and xrefs OMIM:620375,
  Orphanet:653725, DOID:0061130, GARD:0026805, MEDGEN:1841154 and UMLS:C5830518. The OMIM
  number matches the one the naming paper gives for LGMDR28.

  Named Entity Confusion, and why it is a same-protein rather than a same-name problem
  here. Three distinct diseases involve HMG-CoA reductase, and a literature search on the
  gene returns mostly the other two. LGMDR28 is the germline Mendelian disease curated
  here. Statin-associated muscle symptoms are caused by pharmacological inhibition of the
  same enzyme. Anti-HMGCR immune-mediated necrotizing myopathy is an autoantibody disease
  directed against the same protein. `runoak -i sqlite:obo:mondo relationships --direction
  down -p RO:0004003 HGNC:5006` returns exactly one term, MONDO:0957270, confirming at the
  ontology level that the other two are not germline HMGCR disorders; they carry separate
  MONDO identities (MONDO:0100637 drug-induced myopathy, defined by `RO:0009501
  ECTO:0000509 ! exposure to drug`, and MONDO:0016098 immune-mediated necrotizing
  myopathy, whose synonyms include "anti-HMG-CoA myopathy"). Both are curated below as
  differentials and neither is merged into this entry.

  Every clinical claim in this entry is sourced to a paper whose subjects carry biallelic
  germline HMGCR variants: PMID:37167966 (nine individuals, five families), PMID:36745799
  (six individuals, one consanguineous Bedouin kindred), PMID:41904993 (eleven
  individuals, six Middle Eastern families) and PMID:41344164 (one neonatal-onset case).
  Papers about the other two entities were read and excluded rather than mined:
  PMID:30588482, PMID:32447205 and PMID:35754285 report anti-HMGCR myopathy presenting as
  a limb-girdle mimic and would be the easiest source of a wrong attribution;
  PMID:39106428 and PMID:35031847 are anti-HMGCR autoantibody cohorts; PMID:36447272 is
  dysferlinopathy and statin resistance, a different LGMD subtype. One statin-myopathy
  result is used deliberately and is labelled as such wherever it appears: PMID:36745799
  also reports a murine statin-myopathy rescue experiment, which is cited only in the
  treatment rationale and the statin differential, never as evidence about LGMDR28
  patients.

  A note on the mouse literature. PMID:26381177 and PMID:42323079 both frame their
  skeletal-muscle-specific Hmgcr-knockout mice as models of statin myopathy, because that
  is the question their authors were asking. The genotype, however, is a biallelic
  muscle-restricted Hmgcr null, which is mechanistically the closest available animal
  model of LGMDR28 rather than of statin exposure. They are curated in `animal_models`
  with that framing mismatch recorded in `limitations`.

  Deep research. A falcon run was completed and is committed as
  `research/Muscular_Dystrophy_Limb-girdle_Autosomal_Recessive_28-deep-research-falcon.md`.
  `just preflight-dr` returns WARN rather than PASS, flagging CERT1 at 17 mentions against
  55 for HMGCR. Reading the report, that is not a second disease entity: CERT1 appears
  only inside the report's own caveats, which state that Open Targets returns CERT1 for
  MONDO:0957270 as a locus-level artifact because CERT1 neighbours HMGCR on chromosome
  5q13, and that it should not be promoted to causality. That reading is independently
  supported by PMID:36745799, whose homozygosity mapping found a single 3.2 Mbp interval
  at 5q13.2-q13.3 containing exactly one candidate variant, in HMGCR. The report was
  therefore not discarded, but it contributed no content to this entry: it retrieved only
  a 2023 conference abstract, states that it could not recover variant-level data, and
  reaches no conclusion that the primary literature does not state better. Everything
  below is curated directly from the primary papers.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic HMGCR variants. Reported genotypes are homozygous in consanguineous
    families and compound heterozygous elsewhere; heterozygous parents are unaffected.
  evidence:
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine individuals from five unrelated families with unexplained limb-girdle like muscular dystrophy and bi-allelic variants in HMGCR via clinical and research exome sequencing."
    explanation: Establishes biallelic HMGCR genotypes across five independent families as the basis of the disease.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HMGCR variant was validated by restriction analysis and Sanger sequencing (Fig. 2A) and was found to fully segregate as expected for autosomal recessive mode of inheritance."
    explanation: Formal segregation analysis in the founding kindred confirms the recessive mode.
pathophysiology:
- name: Reduced HMG-CoA Reductase Catalytic Activity
  biological_scale: MOLECULAR
  description: >-
    Disease-associated HMGCR alleles are amorphic to hypomorphic: they reduce catalytic
    rate and destabilise the enzyme rather than preventing its expression or
    mislocalising it. The founding G822D allele retains the protein in its normal
    cytoplasmic and endoplasmic-reticulum distribution while losing most of its turnover
    number and most of its affinity for HMG-CoA, and independently assayed alleles from a
    second cohort show the same pattern of reduced activity with reduced stability.
  molecular_functions:
  - preferred_term: HMG-CoA reductase activity
    modifier: DECREASED
    term:
      id: GO:0004420
      label: hydroxymethylglutaryl-CoA reductase (NADPH) activity
  downstream:
  - target: Mevalonate Pathway Flux Reduction
    causal_link_type: DIRECT
    description: Loss of catalytic rate at the pathway's rate-limiting step reduces flux through it.
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutant protein had 69% reduction in Vmax and 65% increase in Km in relation to the substrate HMG-CoA, indicating lower affinity of the mutated protein for HMG-CoA, as well as overall slower reaction-rate"
    explanation: Direct enzymological measurement of the catalytic deficit produced by a disease allele in a CRISPR knock-in cell line.
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein activity studies using three variants (p.Asp623Asn, p.Tyr792Cys, and p.Arg443Gln) identified in affected individuals confirmed decreased enzymatic activity and reduced protein stability."
    explanation: Replicates the activity deficit across three further patient alleles and adds the stability component.
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Molecular modeling analyses revealed variants to be destabilizing and affecting protein oligomerization."
    explanation: In silico structural analysis predicting the destabilising mechanism that the activity assays then measured.
  - reference: PMID:41344164
    reference_title: "HMGCR-related muscular dystrophy: a case of severe neonatal-onset form."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in vitro assays showed severely impaired HMGCR enzymatic activity"
    explanation: Extends the activity deficit to the neonatal-onset p.Arg641Cys allele.
- name: Mevalonate Pathway Flux Reduction
  biological_scale: MOLECULAR
  description: >-
    Reduced enzyme activity lowers production of mevalonate, the committed product of the
    pathway. This is measurable in patients rather than inferred: circulating
    mevalonolactone in the treated proband sat at roughly a fifth of the control average.
    Sterol output is comparatively spared, since patient cholesterol is low but within the
    normal range, which is the first indication that the sterol branch is not where the
    disease is expressed.
  biological_processes:
  - preferred_term: mevalonate pathway flux
    modifier: DECREASED
    term:
      id: GO:0019287
      label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  downstream:
  - target: Isoprenoid Depletion and Impaired Protein Geranylgeranylation
    causal_link_type: DIRECT
    description: Reduced mevalonate limits the isoprenoid branch that consumes it.
  - target: Impaired Myoblast Proliferation and Myotube Fusion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Knockdown of Hmgcr in myoblasts, which reproduces the flux deficit rather than any
      structural lesion, impairs proliferation and fusion. Which pathway product mediates
      this is not established.
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum mevalonolactone level of patient V:2 was 14.5 to 29.1% than the normal average"
    explanation: Direct patient measurement of the reduced pathway product, establishing the flux deficit in vivo in humans.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cholesterol and lipoprotein levels were not elevated (SI Appendix, Table S1), with most patients frequently showing total cholesterol levels lower than 120 mg/dL."
    explanation: Shows the sterol end product is only mildly affected, which is why the disease is not modelled as a cholesterol-deficiency state.
- name: Isoprenoid Depletion and Impaired Protein Geranylgeranylation
  biological_scale: MOLECULAR
  description: >-
    The branch of the mevalonate pathway that appears to carry the myopathy is the
    isoprenoid one. In muscle-specific Hmgcr-knockout mice the fiber-type loss is reversed
    by geranylgeraniol, the precursor of geranylgeranyl pyrophosphate, and independently
    knocking out the Rab geranylgeranyltransferase beta subunit produces its own myopathy
    and aggravates the Hmgcr one. This is a mouse-derived mechanism; no patient
    measurement of prenylation exists.
  biological_processes:
  - preferred_term: protein geranylgeranylation
    modifier: DECREASED
    term:
      id: GO:0018344
      label: protein geranylgeranylation
  - preferred_term: isoprenoid biosynthesis
    modifier: DECREASED
    term:
      id: GO:0008299
      label: isoprenoid biosynthetic process
  downstream:
  - target: Myofiber Mitochondrial Dysfunction
    causal_link_type: DIRECT
    description: >-
      Prenylation-dependent trafficking failure precedes and accompanies the mitochondrial
      abnormalities in the knockout mice.
  evidence:
  - reference: PMID:42323079
    reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings demonstrate that myopathy induced by HMGCR deficiency is primarily driven by GGPP depletion in a mouse model."
    explanation: Attributes the myopathy of HMGCR deficiency to isoprenoid rather than sterol depletion.
  - reference: PMID:42323079
    reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, impaired RabGGT-β-mediated protein geranylgeranylation represents a critical downstream mechanism that aggravates the myopathic phenotype."
    explanation: Places Rab geranylgeranylation downstream of the reductase defect as an aggravating step.
- name: Myofiber Mitochondrial Dysfunction
  biological_scale: CELLULAR
  description: >-
    Mitochondrial abnormalities appear early in Hmgcr-deficient muscle, before weakness is
    clinically apparent, and the first fibers lost are the mitochondria-rich oxidative
    ones. Hmgcr-knockdown myoblasts show a matching transcriptional and respirometric
    signature. Whether this is the proximate cause of fiber loss in patients is not
    established.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: oxidative phosphorylation
    modifier: DECREASED
    term:
      id: GO:0006119
      label: oxidative phosphorylation
  downstream:
  - target: Progressive Myofiber Loss and Fatty Replacement
    causal_link_type: DIRECT
    description: Bioenergetic failure in oxidative fibers precedes their loss.
  evidence:
  - reference: PMID:42323079
    reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Hmgcr KO resulted in pronounced myopathy, marked by an early reduction in mitochondria-rich myosin heavy chain (MyHC) type I and IIa muscle fibers, followed by a later reduction in mitochondria-poor glycolytic MyHC type IIb muscle fibers, and these changes were reversed by GGOH administration."
    explanation: Shows the oxidative fibers are lost first and that the loss is isoprenoid-dependent.
  - reference: PMID:39823152
    reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transcriptome sequencing of Hmgcr knockdown versus control myoblasts revealed differential expression involving mitochondrial function, with corresponding differences in cellular oxygen consumption rates."
    explanation: Independent cell-culture evidence that HMGCR loss changes mitochondrial gene expression and respiration.
- name: Impaired Myoblast Proliferation and Myotube Fusion
  biological_scale: CELLULAR
  description: >-
    HMGCR loss impairs the myogenic program itself, not only the maintenance of mature
    fibers. Knockdown myoblasts proliferate less, die more, and fail to fuse into
    myotubes, and re-expression of wild-type but not variant HMGCR restores fusion. This
    developmental component is a plausible explanation for the congenital and
    neonatal-onset end of the clinical spectrum.
  cell_types:
  - preferred_term: skeletal muscle myoblast
    term:
      id: CL:0000515
      label: skeletal muscle myoblast
  biological_processes:
  - preferred_term: myoblast fusion
    modifier: DECREASED
    term:
      id: GO:0007520
      label: myoblast fusion
  - preferred_term: myoblast proliferation
    modifier: DECREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: myoblast apoptosis
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Progressive Myofiber Loss and Fatty Replacement
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired myogenesis limits the regenerative capacity available to offset fiber loss.
  evidence:
  - reference: PMID:39823152
    reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hmgcr deficiency was associated with decreased proliferation, increased apoptosis, and impaired myotube fusion."
    explanation: Establishes the three cellular defects that define this node.
  - reference: PMID:39823152
    reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of reference HMGCR cDNA rescued myotube fusion in knockdown cells, whereas overexpression of the pathogenic variants of HMGCR cDNA did not."
    explanation: Rescue-and-failure-to-rescue experiment tying the fusion defect specifically to the patient alleles.
- name: Progressive Myofiber Loss and Fatty Replacement
  biological_scale: TISSUE
  description: >-
    Muscle is lost slowly and replaced by fat, most severely in the proximal and axial
    groups, with distal and facial muscles relatively spared. The tissue signature is the
    point at which this disease diverges from the sarcolemmal LGMD subtypes. Biopsy
    findings range from entirely non-specific myopathic change to nothing at all: the
    founding kindred showed no necrosis, fibrosis or inflammation, and
    immunohistochemistry for dystrophin, the sarcoglycans and dysferlin is normal across
    cohorts. The absence of an inflammatory infiltrate also distinguishes it from
    anti-HMGCR necrotizing myopathy.
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  downstream:
  - target: Proximal and Axial Muscle Weakness
    causal_link_type: DIRECT
    description: Loss of contractile tissue in the limb-girdle and axial groups produces the weakness.
  - target: Elevated Serum Creatine Kinase
    causal_link_type: DIRECT
    description: Ongoing myofiber damage releases creatine kinase into the circulation.
  - target: Respiratory Muscle Weakness
    causal_link_type: DIRECT
    description: The same process involves the respiratory musculature, which is the usual cause of death.
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI, computerized tomography (CT), and ultrasound scans showed various levels of atrophy with severe fatty replacement of large proximal skeletal muscles and axial muscles with sparing of the distal and facial muscles"
    explanation: Imaging documents the fatty replacement and its proximal and axial distribution.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathological evaluation did not reveal any pathological features such as fibrosis or inflammation, with the exception of mild deficiency of type-II muscle fibers in one patient"
    explanation: Establishes the absence of the inflammatory and fibrotic signature expected of a sarcolemmal dystrophy.
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Muscle biopsies in most affected individuals showed non-specific dystrophic changes with non-diagnostic immunohistochemistry."
    explanation: The second cohort's biopsy findings, non-specific and with normal immunohistochemistry.
phenotypes:
- name: Proximal and Axial Muscle Weakness
  category: Musculoskeletal
  description: >-
    The cardinal feature. Weakness affects the pelvic and shoulder girdles and the axial
    musculature, with distal and facial muscles relatively spared, and progresses to loss
    of ambulation in most reported individuals.
  phenotype_term:
    preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:37167966
    reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical features resembled other genetic causes of muscular dystrophy with incidental high CPK levels (>1,000 U/L), proximal muscle weakness, variable age of onset, and progression leading to impaired ambulation."
    explanation: Names proximal weakness and progression to impaired ambulation across the defining cohort.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disease initially manifested during the fourth decade of life with pain on exertion, followed by muscle fatigue and weakness, affecting mostly the proximal and axial muscles, and culminating with involvement of respiratory muscles."
    explanation: Documents the proximal and axial distribution and its progression in the founding kindred.
- name: Axial Muscle Weakness
  category: Musculoskeletal
  description: >-
    Neck flexor and trunk weakness accompanies the girdle weakness and underlies the
    spinal deformity seen in several families.
  phenotype_term:
    preferred_term: Axial muscle weakness
    term:
      id: HP:0003327
      label: Axial muscle weakness
  frequency: FREQUENT
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He displayed global muscular hypotrophy, neck muscle weakness, proximal and axial muscle weakness, mildly tense calves, and absent deep tendon reflexes."
    explanation: Direct examination finding of axial and neck weakness in an affected individual.
- name: Elevated Serum Creatine Kinase
  category: Laboratory
  description: >-
    Creatine kinase is markedly raised, commonly above 1,000 U/L and reported as high as
    35,761 U/L, and is frequently the incidental finding that starts the diagnostic
    workup. It falls as muscle mass is lost late in the disease.
  phenotype_term:
    preferred_term: Elevated circulating creatine kinase concentration
    term:
      id: HP:0003236
      label: Elevated circulating creatine kinase concentration
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blood tests showed muscle injury with elevated creatine kinase (up to over 250-fold upper level of normal CK; maximal CK 35761U/L, patient V:8)"
    explanation: Quantifies the magnitude of CK elevation in the founding kindred.
  - reference: PMID:41344164
    reference_title: "HMGCR-related muscular dystrophy: a case of severe neonatal-onset form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with profound hypotonia, respiratory failure by 5 months, and markedly elevated creatine kinase (CK)"
    explanation: Confirms marked CK elevation at the neonatal-onset extreme of the spectrum.
- name: Respiratory Muscle Weakness
  category: Respiratory
  description: >-
    Respiratory involvement is the principal cause of death. It ranges from a restrictive

name: Muscular Dystrophy, Limb-Girdle, Autosomal Recessive 28
category: Mendelian
creation_date: "2026-08-31T10:30:00Z"
synonyms:
- LGMDR28
- HMGCR-related muscular dystrophy
- HMGCR-related limb-girdle muscular dystrophy
- autosomal recessive limb-girdle muscular dystrophy type R28
- HMGCR-limb girdle muscle disease
description: >-
  Limb-girdle muscular dystrophy autosomal recessive 28 (LGMDR28) is caused by biallelic
  hypomorphic variants in HMGCR, which encodes 3-hydroxy-3-methylglutaryl-CoA reductase,
  the rate-limiting enzyme of the mevalonate pathway and the molecular target of the
  statin drug class. It is the only Mendelian disease MONDO attributes to germline HMGCR
  variation, and it was first described in 2023 by two independent groups.

  The mechanism is a metabolic shortfall rather than a structural one, which is what sets
  this subtype apart from the rest of recessive LGMD. The classic LGMD-R subtypes fail at
  the sarcolemma: dysferlin, the sarcoglycans and the dystroglycan-glycosylating enzymes
  all leave the muscle membrane fragile, and repeated mechanical injury drives the
  degeneration-regeneration cycle, the inflammatory infiltrate and the fibrofatty
  replacement seen on biopsy. Here the membrane is intact and the biopsy is
  correspondingly unimpressive: immunohistochemistry for dystrophin, the sarcoglycans and
  dysferlin is normal, and in the founding Bedouin kindred histology showed no necrosis,
  fibrosis or inflammation at all. What fails instead is flux through the mevalonate
  pathway. Patients carry roughly a fifth of normal circulating mevalonolactone, and the
  disease-associated alleles reduce catalytic rate and destabilise the enzyme rather than
  abolishing its expression or mislocalising it.

  Which downstream product matters is the interesting part. Cholesterol appears not to be
  the mediator: affected individuals have low-normal, not deficient, serum cholesterol, and
  in muscle-specific Hmgcr-knockout mice the myopathy is reversed by geranylgeraniol,
  implicating depletion of the isoprenoid branch and of Rab protein geranylgeranylation
  rather than of sterol. Mitochondrial abnormalities in those mice precede any clinical
  weakness, and Hmgcr-knockdown myoblasts show altered oxygen consumption alongside
  reduced proliferation, increased apoptosis and failed myotube fusion. The emerging
  picture is a myofiber that cannot maintain its mitochondrial and prenylation economy,
  degenerating slowly and without the inflammatory signature of a membrane disease.

  Clinically the disease is a proximal and axial myopathy with markedly elevated creatine
  kinase, exertional myalgia, absent deep tendon reflexes and progression to loss of
  ambulation and respiratory failure, which is the usual cause of death. Onset spans birth
  to the fourth decade, and severity does not track with how early it starts. Clinical
  cardiomyopathy has not been reported, but the heart is not entirely spared: the founding
  kindred had slightly raised troponin T in every patient tested and conduction changes in
  two, so "no cardiac involvement" is a statement about symptomatic disease rather than
  about the myocardium. Hepatic involvement is the open question: two siblings in the
  expanded cohort developed progressive cirrhosis requiring transplantation, against a
  background in which transaminase elevation in LGMD usually reflects muscle injury rather
  than liver disease.

  Because the missing metabolite is known, the disease is one of the few LGMD subtypes
  with a directed therapeutic candidate. Oral mevalonolactone, synthesised for the purpose
  and never previously given to humans, produced measurable strength and spirometry gains
  in the single severely affected patient treated under compassionate use, and oral
  mevalonate completely rescued the myopathy of muscle-specific Hmgcr-knockout mice. The
  evidence base is one patient; the mechanism behind it is unusually well specified.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      A muscular dystrophy, assigned to the neurology part where Harrison's places the
      muscular dystrophies and other muscle diseases. The morbidity is entirely
      neuromuscular: proximal and axial weakness, loss of ambulation, and respiratory
      muscle failure. A second ENDOCRINOLOGY_METABOLISM assignment was considered because
      the lesion is in a metabolic enzyme, but no metabolic derangement is the presenting
      or defining problem, so it is deliberately not made.
    evidence:
    - reference: PMID:37167966
      reference_title: Bi-allelic variants in HMGCR cause an autosomal-recessive progressive limb-girdle muscular dystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical features resembled other genetic causes of muscular dystrophy with incidental high CPK levels (>1,000 U/L), proximal muscle weakness, variable age of onset, and progression leading to impaired ambulation."
      explanation: The defining cohort describes the phenotype as a progressive proximal muscular dystrophy, which is the basis for the neurologic chapter assignment.
  icimd_category:
  - classification_value: sterol_metabolism
    notes: >-
      Assigned by the position of the defective enzyme in the pathway, not by an ICIMD
      listing. HMGCR catalyses the rate-limiting step of sterol biosynthesis, which places
      the defect in the ICIMD sterol-metabolism group. The caveat matters: the ICIMD
      classification (Ferreira et al. 2021, PMID:33340416) predates the 2023 description
      of LGMDR28, so this disease does not appear in it, and the assignment is an
      inference about the enzyme rather than a citation of the nosology. Note also that
      the sterol branch is probably not the arm that causes the myopathy, for which see
      the isoprenoid discussion in this entry.

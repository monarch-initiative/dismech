differential_diagnoses:
- name: Statin-associated muscle symptoms and statin myopathy
  disease_term:
    preferred_term: drug-induced myopathy
    term:
      id: MONDO:0100637
      label: drug-induced myopathy
  description: >-
    The same enzyme, inhibited pharmacologically instead of mutated. The overlap is not
    superficial: proximal weakness, raised creatine kinase, an unremarkable biopsy and
    end-stage imaging with fatty replacement are shared, and the founding LGMDR28 report
    describes its own patients as phenotypically resembling severe statin myopathy. The
    entities are nonetheless distinct in cause, and MONDO defines drug-induced myopathy by
    an exposure relation rather than a germline gene relation.
  distinguishing_features:
  - "Cause is a biallelic germline HMGCR genotype rather than exposure to a drug; there is no statin exposure in the LGMDR28 families, including in utero."
  - "Onset in statin myopathy is relatively acute and follows the start of the drug, whereas LGMDR28 is insidious and lifelong; withdrawal of a statin has no counterpart in the genetic disease."
  - "LGMDR28 is inherited in a Mendelian recessive pattern with unaffected heterozygous parents; statin myopathy is not inherited."
  - "One caveat cuts the other way, in that chronic or subacute severe statin myopathy has been described and can mimic limb-girdle muscular dystrophy, so drug history rather than phenotype is the discriminator."
  evidence:
  - reference: PMID:39823152
    reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The two other muscle diseases associated with HMGCR, statin-associated myopathy (SAM) and autoimmune anti-HMGCR myopathy, are not inherited in a Mendelian pattern."
    explanation: States the nosological boundary this differential draws, that only LGMDR28 among the three is Mendelian.
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One major difference between SAMS and the hereditary HMGCR disease is the relatively acute onset of SAMS compared with the insidious presentation of muscle symptoms in the HMGCR-limb girdle muscle disease."
    explanation: Names the tempo difference that separates the two clinically.
- name: Anti-HMGCR immune-mediated necrotizing myopathy
  disease_term:
    preferred_term: immune-mediated necrotizing myopathy
    term:
      id: MONDO:0016098
      label: immune-mediated necrotizing myopathy
  description: >-
    An autoantibody disease directed against the same protein, and the differential most
    likely to be mistaken for this one, because it is repeatedly reported as presenting
    like a limb-girdle muscular dystrophy in both adults and children. The distinction is
    consequential rather than academic: anti-HMGCR myopathy responds to immunosuppression,
    and LGMDR28 has no reason to.
  distinguishing_features:
  - "Anti-HMGCR autoantibodies are present by definition in the autoimmune disease and were explicitly absent in all six patients of the founding LGMDR28 kindred."
  - "Biopsy in anti-HMGCR myopathy shows myocyte necrosis and regeneration; the LGMDR28 biopsy shows non-specific change or nothing, without necrosis or inflammation."
  - "Anti-HMGCR myopathy is acquired and typically acute or subacute; LGMDR28 is a Mendelian recessive disease with unaffected heterozygous parents."
  - "Immunosuppressive therapy is the treatment of the autoimmune disease and has no rationale in the genetic one, where metabolite replacement is the directed approach."
  evidence:
  - reference: PMID:36745799
    reference_title: Limb girdle muscular disease caused by HMGCR mutation and statin myopathy treatable with mevalonolactone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a notable finding was the lack of anti-HMGCR antibodies in any of the patients"
    explanation: The direct serological test that separates the founding LGMDR28 kindred from the autoantibody disease.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The presence of anti-HMGCR enzyme antibodies has been found to result in auto-immune necrotizing myopathy, a disease mimicking muscular dystrophy in adults but also in a growing number of children."
    explanation: Records that the autoimmune disease mimics muscular dystrophy across ages, which is what makes it the key differential.
- name: Sarcolemmal autosomal recessive limb-girdle muscular dystrophy subtypes
  disease_term:
    preferred_term: autosomal recessive limb-girdle muscular dystrophy
    term:
      id: MONDO:0015152
      label: autosomal recessive limb-girdle muscular dystrophy
  description: >-
    The rest of the LGMD-R group, curated in
    `kb/disorders/Autosomal_Recessive_Limb-Girdle_Muscular_Dystrophy.yaml`, whose shared
    mechanism is sarcolemmal fragility and failed membrane repair. LGMDR28 is a MONDO
    child of this term and shares its clinical syndrome, but not its mechanism, which is
    why it is curated as its own entry rather than folded into that one.
  distinguishing_features:
  - "Immunohistochemistry for dystrophin, the sarcoglycans and dysferlin is normal in LGMDR28, whereas the sarcoglycanopathies and dysferlinopathy show loss of the corresponding protein."
  - "The LGMDR28 biopsy lacks the necrosis, inflammation and fibrofatty replacement that characterise the membrane-repair subtypes."
  - "Creatine kinase elevation in LGMDR28 is at the high end even for this group, reported up to 250-fold the upper limit of normal."
  - "Clinical cardiomyopathy, which occurs in several sarcolemmal subtypes, has not been reported in LGMDR28, although subclinical troponin T elevation and ECG conduction changes were found in the founding kindred."
  - "LGMDR28 has a directed metabolite-replacement candidate; the sarcolemmal subtypes have supportive care and gene-directed trials."
  evidence:
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients had any cardiac involvement, as was the case in previous reports."
    explanation: The consistent absence of cardiac disease, which is a point of separation from several sarcolemmal subtypes.
  - reference: PMID:41904993
    reference_title: Expanded clinical and genetic characterization of autosomal recessive HMGCR-related muscular dystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The main immunostainings (against dystrophin, sarcoglycans and dysferlin) were reported as normal."
    explanation: Normal staining for the structural proteins whose loss defines the sarcolemmal subtypes.
animal_models:
- name: Skeletal muscle-specific Hmgcr knockout mouse
  species: Mouse
  genotype: Skeletal muscle-specific Hmgcr conditional knockout
  publication: PMID:26381177
  description: >-
    A muscle-restricted biallelic Hmgcr null. Its authors built it and describe it as a
    model of statin myopathy, because that was their question, but the genotype is a
    genetic loss of HMGCR confined to muscle, which makes it the closest available animal
    model of LGMDR28 rather than of drug exposure. The mice develop postnatal myopathy
    with raised creatine kinase, and oral mevalonate rescues them completely, which is the
    result that motivated treating a human patient with mevalonolactone.
  modeled_mechanisms:
  - target: Progressive Myofiber Loss and Fatty Replacement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces myopathy with elevated creatine kinase arising specifically from loss of
      HMGCR in muscle, establishing that the muscle phenotype is muscle-autonomous rather
      than secondary to hepatic or systemic cholesterol handling.
    limitations: >-
      The knockout is a complete null restricted to skeletal muscle, whereas patients carry
      hypomorphic missense alleles expressed in every tissue, so the model overstates the
      enzymatic deficit while understating its tissue distribution. The mice develop
      necrosis and rhabdomyolysis, which patient biopsies characteristically do not show,
      and the tempo is postnatal and rapid rather than the years-to-decades human course.
      The paper frames the model as one of statin myopathy, so its reported comparisons are
      to drug exposure rather than to LGMDR28.
    readouts:
    - name: Serum creatine kinase
      target: Progressive Myofiber Loss and Fatty Replacement
      direction: INCREASED
      interpretation: Circulating marker of myofiber damage, matching the cardinal laboratory abnormality in patients.
      evidence:
      - reference: PMID:26381177
        reference_title: "Skeletal muscle-specific HMG-CoA reductase knockout mice exhibit rhabdomyolysis: A model for statin-induced myopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Knockout mice exhibited postnatal myopathy with elevated serum creatine kinase levels and necrosis."
        explanation: Reports the creatine kinase measurement behind this readout.
    - name: Myopathy after oral mevalonate supplementation
      target: Progressive Myofiber Loss and Fatty Replacement
      direction: RESTORED
      interpretation: >-
        Complete rescue by the pathway product establishes that the myopathy follows from
        metabolite deficiency rather than from any structural role of the enzyme.
      evidence:
      - reference: PMID:26381177
        reference_title: "Skeletal muscle-specific HMG-CoA reductase knockout mice exhibit rhabdomyolysis: A model for statin-induced myopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Myopathy in knockout mice was completely rescued by the oral administration of MVA."
        explanation: Reports the rescue experiment behind this readout.
    evidence:
    - reference: PMID:26381177
      reference_title: "Skeletal muscle-specific HMG-CoA reductase knockout mice exhibit rhabdomyolysis: A model for statin-induced myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we developed the skeletal muscle-specific HMGCR knockout mice"
      explanation: Establishes the genotype that makes this model informative for muscle-autonomous HMGCR loss.
- name: Doxycycline-inducible skeletal muscle-specific Hmgcr knockout mouse (Hmgcr-DimKO)
  species: Mouse
  genotype: Doxycycline-inducible skeletal muscle-specific Hmgcr knockout
  publication: PMID:42323079
  description: >-
    An inducible version of the muscle-specific null, built alongside Rabggtb single and
    double knockouts to ask which downstream branch of the mevalonate pathway carries the
    myopathy. It is the source of the isoprenoid-rather-than-sterol mechanism in this
    entry: the fiber-type loss is reversed by geranylgeraniol, and mitochondrial
    dysfunction appears before any weakness.
  modeled_mechanisms:
  - target: Isoprenoid Depletion and Impaired Protein Geranylgeranylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Establishes geranylgeranyl pyrophosphate depletion as the branch of the pathway whose
      loss produces myopathy, by rescuing with its precursor and by phenocopying and
      aggravating with a Rab geranylgeranyltransferase knockout.
    limitations: >-
      This is a mouse null rather than a human hypomorph, and inducible deletion in adult
      muscle does not reproduce the lifelong partial deficiency patients carry. No
      prenylation or isoprenoid measurement has been made in an LGMDR28 patient, so the
      mechanism is imported from the model rather than confirmed in the disease. As with
      the constitutive knockout, the paper's stated target is statin myopathy.
    readouts:
    - name: Oxidative (MyHC type I and IIa) fiber content after geranylgeraniol
      target: Isoprenoid Depletion and Impaired Protein Geranylgeranylation
      direction: RESTORED
      interpretation: Rescue by the isoprenoid precursor localises the causal deficit to the geranylgeranyl branch.
      evidence:
      - reference: PMID:42323079
        reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Hmgcr KO resulted in pronounced myopathy, marked by an early reduction in mitochondria-rich myosin heavy chain (MyHC) type I and IIa muscle fibers, followed by a later reduction in mitochondria-poor glycolytic MyHC type IIb muscle fibers, and these changes were reversed by GGOH administration."
        explanation: Reports the fiber-type measurement and its reversal by geranylgeraniol.
    evidence:
    - reference: PMID:42323079
      reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using doxycycline-inducible Cre-LoxP technology, we generated three skeletal muscle-specific knockout (KO) models: Hmgcr-DimKO, Rabggtb-DimKO, and combined Hmgcr/Rabggtb-DimKO mice."
      explanation: Establishes the genotypes that make this model informative for the isoprenoid branch.
  - target: Myofiber Mitochondrial Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Mitochondrial abnormalities are detectable before clinical myopathy in every genotype
      tested, which is the temporal argument that the mitochondrial defect is upstream of
      fiber loss rather than a consequence of it.
    limitations: >-
      Temporal precedence in an inducible mouse null is suggestive of causation but does
      not establish it, and the corresponding measurement has not been made in patient
      muscle. The acute deletion tempo is unlike the human disease.
    readouts:
    - name: Mitochondrial mass and function
      target: Myofiber Mitochondrial Dysfunction
      direction: DECREASED
      interpretation: Quantified mitochondrial deficit appearing before weakness in the knockout muscle.
      evidence:
      - reference: PMID:42323079
        reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mitochondrial mass and function were rigorously quantified."
        explanation: Names the readout measured; its timing relative to weakness is quoted on the link evidence.
    evidence:
    - reference: PMID:42323079
      reference_title: Skeletal muscle-specific deficiency of Rab geranylgeranyl transferase beta subunit induces myopathy and exacerbates the symptoms caused by HMG-CoA reductase deficiency in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Early mitochondrial abnormalities may contribute to the pathogenesis of myopathy due to disruption of the mevalonate pathway."
      explanation: The authors' own statement placing the mitochondrial defect in the pathogenic sequence.
- name: HMGCR p.Arg641Cys homozygous knock-in mouse
  species: Mouse
  genotype: Hmgcr p.Arg641Cys homozygous knock-in
  publication: PMID:41344164
  description: >-
    A knock-in of the human neonatal-onset allele. It does not model the disease, because
    homozygous animals die in utero rather than developing a muscular dystrophy. That is
    an informative negative: it shows the allele is severe enough to breach the threshold
    for embryonic viability in mouse, while the human homozygote survived to four months,
    and it means the most obvious way to build a mouse model of LGMDR28 does not work.
  modeled_mechanisms:
  - target: Progressive Myofiber Loss and Fatty Replacement
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Homozygous knock-in animals die as embryos and therefore never develop the postnatal
      progressive myopathy that defines the human disease.
    limitations: >-
      Embryonic lethality precludes any muscle phenotyping at all, so the model yields no
      readout of weakness, creatine kinase, histology or treatment response. The species
      difference is the substantive limitation: mouse appears less tolerant of this allele
      than human, since the corresponding human homozygote was liveborn and survived four
      months. Nothing about the human muscular dystrophy can be inferred from this model.
    evidence:
    - reference: PMID:41344164
      reference_title: "HMGCR-related muscular dystrophy: a case of severe neonatal-onset form."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "in vivo modeling using homozygous knock-in mice resulted in embryonic lethality"
      explanation: Reports the embryonic lethality that constitutes the failure to recapitulate.
- name: hmgcr knockdown Drosophila
  species: Drosophila melanogaster
  genotype: RNAi knockdown of hmgcr, ubiquitous and muscle-specific drivers
  publication: PMID:39823152
  description: >-
    The invertebrate arm of the same study that produced the myoblast data. Both
    ubiquitous and muscle-restricted knockdown of the fly HMGCR orthologue are lethal, so
    like every available mouse the fly cannot be carried to a state resembling the human
    muscular dystrophy. It contributes the conserved requirement for the enzyme in muscle
    rather than a phenotype.
  modeled_mechanisms:
  - target: Progressive Myofiber Loss and Fatty Replacement
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Knockdown is lethal rather than myopathic, so no progressive proximal weakness,
      creatine kinase elevation or biopsy phenotype can be observed.
    limitations: >-
      Lethality precludes any muscle phenotyping, so the model yields no readout that maps
      onto the human disease. Knockdown severity is also not comparable to the partial
      loss of function patients carry, and the phylogenetic distance means the result
      establishes only that the enzyme is required in muscle, not how a hypomorphic human
      allele produces a slowly progressive dystrophy.
    evidence:
    - reference: PMID:39823152
      reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Both ubiquitous and muscle-specific knockdown of hmgcr in Drosophila led to lethality."
      explanation: Reports the lethality that constitutes the failure to recapitulate.
experimental_models:
- name: Hmgcr knockdown C2C12 myoblast line with variant complementation
  experimental_model_type: CELL_LINE
  description: >-
    C2C12 mouse myoblasts, the standard immortalised myogenic line, with Hmgcr knocked
    down by shRNA to about 60% of control transcript. Used both to characterise the
    cellular phenotype of HMGCR loss and, by re-expressing wild-type versus patient
    HMGCR cDNA, to test whether specific disease alleles are functional. It is the system
    that connects the enzymatic defect to a myogenic one.
  modeled_mechanisms:
  - target: Impaired Myoblast Proliferation and Myotube Fusion
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the proliferation, survival and fusion defects attributable to HMGCR loss,
      and shows that three patient alleles cannot rescue them while the reference sequence
      can.
    limitations: >-
      Knockdown rather than the biallelic hypomorphic genotype patients carry, in mouse
      rather than human cells, and in proliferating myoblasts rather than mature
      innervated muscle. A fusion defect in culture is a developmental readout, whereas
      most patients present after normal early motor development, so the correspondence to
      the adult-onset end of the spectrum is uncertain.
    readouts:
    - name: Myotube fusion after complementation with reference or variant HMGCR cDNA
      target: Impaired Myoblast Proliferation and Myotube Fusion
      direction: RESTORED
      interpretation: >-
        Reference cDNA restores fusion and the patient alleles do not, which is the
        functional demonstration that those alleles are loss-of-function in a muscle cell.
      evidence:
      - reference: PMID:39823152
        reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Overexpression of reference HMGCR cDNA rescued myotube fusion in knockdown cells, whereas overexpression of the pathogenic variants of HMGCR cDNA did not."
        explanation: Reports the complementation result behind this readout.
    evidence:
    - reference: PMID:39823152
      reference_title: Effects of HMG CoA reductase (HMGCR) deficiency on skeletal muscle development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Hmgcr deficiency was associated with decreased proliferation, increased apoptosis, and impaired myotube fusion."
      explanation: Establishes that the cellular phenotype this model reports is the one the node describes.
discussions:
- discussion_id: isoprenoid_versus_sterol_branch
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which branch of the mevalonate pathway is depleted in LGMDR28 patient muscle, and does
    the isoprenoid mechanism established in mice hold in humans?
  attaches_to:
  - pathophysiology#Isoprenoid Depletion and Impaired Protein Geranylgeranylation
  rationale: >-
    The case that the myopathy is an isoprenoid rather than a sterol problem rests entirely
    on mouse work: geranylgeraniol rescue of the muscle-specific knockout, and the
    aggravating effect of a Rab geranylgeranyltransferase knockout. On the human side, all
    that exists is a single patient's circulating mevalonolactone level and the observation
    that patient cholesterol is low but normal. No measurement of geranylgeranyl
    pyrophosphate, of protein prenylation, or of coenzyme Q10 has been reported in
    LGMDR28 muscle or serum. The distinction is not academic: if the deficit is isoprenoid,
    geranylgeraniol is a candidate therapy that would not require synthesising
    mevalonolactone, and if it is sterol, neither would help.
  proposed_experiments:
  - experiment_id: lgmdr28_isoprenoid_profiling
    name: Isoprenoid and prenylation profiling of LGMDR28 patient muscle
    description: >-
      Measure geranylgeranyl pyrophosphate, farnesyl pyrophosphate, coenzyme Q10 and
      Rab protein prenylation status in muscle biopsy tissue from genotyped LGMDR28
      patients against age-matched controls, and compare with the profile of the
      muscle-specific knockout mouse.
    would_support:
    - pathophysiology#Isoprenoid Depletion and Impaired Protein Geranylgeranylation
    supporting_outcome:
    - >-
      Reduced geranylgeranyl pyrophosphate and reduced Rab prenylation in patient muscle,
      with sterol content comparatively preserved.
    refuting_outcome:
    - >-
      Normal isoprenoid pools and normal prenylation in patient muscle, which would move
      the mechanism to a different branch and undercut the geranylgeraniol therapeutic
      rationale.
- discussion_id: mouse_intolerance_of_hmgcr_loss
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why does the mouse tolerate loss of HMGCR so much less well than the human, and does
    any mouse model reproduce the slowly progressive human muscular dystrophy?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Progressive Myofiber Loss and Fatty Replacement
  rationale: >-
    Every available model is either lethal or too severe. The complete mouse knockout dies
    prenatally, the knock-in of the human p.Arg641Cys allele dies as an embryo even though
    the corresponding human homozygote was liveborn, knockdown of the orthologue in
    Drosophila is lethal both ubiquitously and in muscle alone, and the muscle-specific
    mouse nulls develop rapid postnatal myopathy with necrosis and rhabdomyolysis. The
    pattern across two phyla is that anything approaching a null is unviable, which is
    itself the argument that the human alleles must be hypomorphic. Patients, by contrast, most
    often have decades of normal function, an unremarkable biopsy without necrosis, and a
    course measured in years. So the models that exist are informative about which pathway
    branch matters and useless for the natural history, the biopsy phenotype, or the
    testing of a therapy over a realistic timescale. What is missing is a hypomorphic
    allelic-series mouse carrying a partial-loss-of-function human variant such as
    p.Gly822Asp, which the enzymology predicts would be viable.
  proposed_experiments:
  - experiment_id: hypomorphic_hmgcr_allelic_series
    name: Hypomorphic Hmgcr knock-in allelic series
    description: >-
      Generate homozygous knock-in mice carrying the enzymologically characterised partial
      loss-of-function alleles rather than nulls, and phenotype them for the human-relevant
      endpoints: age of onset, rate of strength decline, biopsy appearance including
      whether necrosis and inflammation are present, and respiratory function.
    would_support:
    - pathophysiology#Progressive Myofiber Loss and Fatty Replacement
    supporting_outcome:
    - >-
      Viable homozygotes developing slowly progressive proximal weakness with raised
      creatine kinase and a non-necrotic biopsy, matching the human tissue phenotype.
    refuting_outcome:
    - >-
      Viable homozygotes with no muscle phenotype, which would imply the human disease
      needs a contribution the mouse lacks and would leave no tractable in vivo model.
- discussion_id: reduced_alpha_dystroglycan_signal
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does LGMDR28 have a secondary alpha-dystroglycan hypoglycosylation limb, and if so
    does that partly reconnect it to the dystroglycanopathies?
  attaches_to:
  - pathophysiology#Progressive Myofiber Loss and Fatty Replacement
  - histopathology#Non-specific myopathic change with normal muscular dystrophy immunohistochemistry
  rationale: >-
    This entry separates LGMDR28 from the sarcolemmal LGMD subtypes on the grounds that its
    immunohistochemistry is normal, and that is what the available cached sources say. One
    piece of curated data points the other way and should not be quietly dropped: HPO
    carries `HP:0030099 Reduced muscle fiber alpha dystroglycan` for this disease at a
    frequency of 1/1, attributed to the discovery cohort (PMID:37167966), alongside
    `HP:0012240 Increased intramyocellular lipid droplets` at 1/3. A single observation in
    a single biopsy is as likely to be a staining artifact as a real finding, and neither
    appears in the abstract that is cached here, so no evidence item can be written for it.
    But if it is real it matters twice over, because glycosylation of alpha-dystroglycan is
    the mechanism of the FKRP and related dystroglycanopathy subtypes, and because
    dolichol, which the mevalonate pathway supplies, is required for the O-mannosylation
    that builds the alpha-dystroglycan glycan. That would be a mechanistically plausible
    route from a mevalonate-flux defect back to a membrane phenotype, and it is exactly the
    kind of link that should be tested rather than assumed.
  proposed_experiments:
  - experiment_id: lgmdr28_alpha_dystroglycan_glycosylation
    name: Alpha-dystroglycan glycosylation status in LGMDR28 muscle
    description: >-
      Stain LGMDR28 muscle biopsies with the glycoepitope-specific IIH6 antibody alongside
      a core alpha-dystroglycan antibody and dystroglycanopathy and normal controls, and
      measure muscle dolichol-linked oligosaccharide pools, across a series rather than the
      single reported case.
    would_support:
    - pathophysiology#Progressive Myofiber Loss and Fatty Replacement
    supporting_outcome:
    - >-
      Reproducible loss of the IIH6 glycoepitope with preserved core protein across
      multiple LGMDR28 biopsies, with reduced dolichol-linked oligosaccharide, which would
      add a glycosylation limb to the mechanism and qualify the separation from the
      dystroglycanopathies drawn in this entry.
    refuting_outcome:
    - >-
      Normal alpha-dystroglycan glycosylation across the series, confirming the single HPO
      annotation as an isolated artifact and leaving the sarcolemmal separation intact.
- discussion_id: hepatic_involvement_and_statin_exposure
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is hepatic disease part of LGMDR28, and are statins contraindicated in people who carry
    biallelic or heterozygous HMGCR disease alleles?
  attaches_to:
  - phenotypes#Cirrhosis
  - treatments#
  rationale: >-
    Two questions with the same root, both unanswered. Progressive cirrhosis requiring
    transplantation occurred in two siblings of one family and in no other reported
    individual, and the authors themselves note that transaminase elevation in this setting
    is normally attributed to muscle injury, so whether the liver is a target organ or that
    family carried a second problem is open. Separately, and although the pharmacological
    parallel is the organising idea of this disease, no published work reports statin
    exposure in a person with an HMGCR disease allele, in either the biallelic or the
    heterozygous state, and no source recommends avoidance. The plausible expectation that
    inhibiting an already-hypomorphic enzyme would be harmful is an inference, not a
    finding, and is not curated as a treatment here for that reason.
  proposed_experiments:
  - experiment_id: lgmdr28_hepatic_phenotyping
    name: Systematic hepatic phenotyping of the LGMDR28 cohort
    description: >-
      Apply the published liver panel plus imaging and, where indicated, biopsy across all
      genotyped LGMDR28 patients, distinguishing muscle-derived transaminase elevation from
      hepatocellular disease, and record statin exposure history in patients and their
      heterozygous relatives.
    would_support:
    - phenotypes#Cirrhosis
    supporting_outcome:
    - >-
      Hepatocellular disease in additional unrelated families, establishing liver
      involvement as a feature of the disease rather than of one family.
    refuting_outcome:
    - >-
      Transaminase elevation of muscle origin only, with normal synthetic function and
      imaging across the cohort, confining the cirrhosis to the single family reported.

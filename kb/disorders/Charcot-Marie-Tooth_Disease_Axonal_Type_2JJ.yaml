differential_diagnoses:
- name: BAG3-related myofibrillar myopathy (MFM6)
  description: >-
    The same gene, the same codon, a different amino acid. p.Pro209Leu causes
    myofibrillar myopathy with progressive limb weakness, respiratory failure and
    cardiomyopathy, typically presenting in childhood, whereas the CMT2JJ allele
    p.Pro209Ser causes adult-onset neuropathy. The separation is not absolute: a
    p.Pro209Leu patient has been reported with an axonal sensorimotor
    polyneuropathy resembling CMT alongside myopathy and rigid spine, and
    notably without the cardiomyopathy usual for that allele. Curated in this
    knowledge base as the MFM6 subtype of `Myofibrillar_Myopathy`.
  evidence:
  - reference: PMID:30145633
    reference_title: "BAG3 mutation in a patient with atypical phenotypes of myofibrillar myopathy and Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She showed an axonal sensory-motor polyneuropathy like Charcot-Marie-Tooth
      disease (CMT), myopathy, rigid spine and respiratory dysfunction; however,
      she did not show any cardiomyopathy, which is a common symptom in BAG3
      mutation.
    explanation: >-
      Documents phenotypic overlap: a p.Pro209Leu patient with a CMT-like
      neuropathy and no cardiomyopathy.
  - reference: PMID:30145633
    reference_title: "BAG3 mutation in a patient with atypical phenotypes of myofibrillar myopathy and Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bcl2-associated athanogene 3 (BAG3) mutations have been reported to cause
      the myofibrillar myopathy (MFM) which shows progressive limb muscle
      weakness, respiratory failure, and cardiomyopathy.
    explanation: >-
      States the myofibrillar myopathy phenotype from which CMT2JJ must be
      distinguished.
- name: BAG3-related dilated cardiomyopathy
  description: >-
    Variants in the second conserved IPV motif of BAG3 cause dilated
    cardiomyopathy by impairing removal of non-native proteins. Several
    BAG3-associated dilated cardiomyopathy entries already exist in this
    knowledge base. The shared IPV-motif localisation with the CMT2JJ allele is
    what makes the genotype-to-phenotype question in this gene genuinely open.
  evidence:
  - reference: PMID:35832504
    reference_title: "The role of BAG3 in dilated cardiomyopathy and its association with Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the second conserved IPV motif of BAG3 are known to cause
      Dilated Cardiomyopathy (DCM) by inhibiting adequate removal of non-native
      proteins.
    explanation: >-
      Establishes the dilated cardiomyopathy phenotype and its IPV-motif basis.
- name: BAG3-related distal hereditary motor neuronopathy
  description: >-
    A third neuropathy phenotype of the same gene, and the closest differential
    to CMT2JJ. The truncating variant p.Val505GlyfsTer6 causes an adult-onset,
    slowly progressive, symmetric distal motor neuronopathy with absent Achilles
    reflexes and neurogenic changes on biopsy, in a family of eight affected
    individuals with mean onset at 46 years. It is distinguished from CMT2JJ by
    being purely motor — CMT2JJ is sensorimotor, indeed sensory-predominant —
    and by incomplete penetrance in women, with one obligate female carrier
    surviving to 73 without weakness. The larger European series links nonsense
    and frameshift BAG3 variants to this distal motor phenotype and to isolated
    dilated cardiomyopathy, as against the missense IPV-motif alleles of CMT2JJ
    and myofibrillar myopathy.
  evidence:
  - reference: PMID:37907725
    reference_title: "Distal hereditary motor neuronopathy as a new phenotype associated with variants in BAG3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seven patients developed slowly progressive and symmetric distal weakness
      and atrophy of lower limb muscles, along with absent Achilles reflexes.
    explanation: >-
      Documents the distal motor phenotype that distinguishes this entity from
      the sensorimotor CMT2JJ.
  - reference: PMID:37907725
    reference_title: "Distal hereditary motor neuronopathy as a new phenotype associated with variants in BAG3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report an autosomal dominant adult-onset distal hereditary motor
      neuronopathy with incomplete penetrance in women as a new phenotype related
      to a truncating variant in the BAG3 gene.
    explanation: >-
      Establishes the entity, its inheritance and the sex-dependent penetrance.
  - reference: PMID:40493734
    reference_title: "Disease spectrum and long-term prognosis of patients with BAG3-associated neuromuscular diseases in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All other BAG3 variants are rare and cause milder clinical presentations,
      with nonsense variants and frameshift variants being associated with dHMN
      (and with isolated DCM), an observation which should be considered in the
      development of disease-modifying therapies.
    explanation: >-
      Links variant class to phenotype: truncating variants give distal motor
      neuronopathy or isolated cardiomyopathy rather than CMT2JJ.
discussions:
- discussion_id: cmt2jj_codon209_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do p.Pro209Ser and p.Pro209Leu — substitutions at the same BAG3 codon —
    produce a peripheral neuropathy and a childhood myofibrillar myopathy with
    cardiomyopathy respectively?
  attaches_to:
  - "pathophysiology#BAG3 IPV Motif Variant"
  - "pathophysiology#Chaperone-Assisted Selective Autophagy Failure"
  rationale: >-
    This is the most informative open question in BAG3 biology and it bears
    directly on how this entry should be read. Two substitutions at codon 209,
    differing by one nucleotide, give diseases that differ in affected tissue,
    age of onset and severity. Nothing published explains the difference; the
    aggregation-and-sequestration mechanism has been characterised for
    p.Pro209Leu, and simply assumed for p.Pro209Ser, which is why the CASA node
    in this entry is PROVISIONAL. Nor is the partition clean — a p.Pro209Leu
    patient has been reported with a CMT-like axonal polyneuropathy and no
    cardiomyopathy, so the two alleles may produce overlapping spectra with
    different centres of gravity rather than separate diseases. Resolving this
    would establish whether CMT2JJ is properly a distinct entity or the
    neuropathy-predominant end of one BAG3 proteinopathy.
  proposed_experiments:
  - experiment_id: exp_cmt2jj_side_by_side_allele_comparison
    name: Side-by-side cellular comparison of p.Pro209Ser and p.Pro209Leu
    description: >-
      Express both alleles in a common background and compare BAG3 aggregation,
      HSPB8 and Hsp70 binding, chaperone sequestration and CASA flux, to
      determine whether p.Pro209Ser produces the same aggregation phenotype as
      p.Pro209Leu or a distinct, milder one.
  - experiment_id: exp_cmt2jj_cell_type_vulnerability
    name: Neuron versus myocyte vulnerability to each allele
    description: >-
      Introduce each allele into isogenic induced pluripotent stem cell-derived
      motor neurons, sensory neurons and cardiomyocytes and compare aggregate
      burden and viability, testing whether tissue tropism is a property of the
      allele or of the cell type's proteostatic reserve. Since the aggresome
      phenotype is known to be phenotype-independent in cell lines, the
      discriminating readout is more likely to be client-proteome composition per
      cell type than aggregate burden.
- discussion_id: cmt2jj_aggregation_mechanism_inferred_not_shown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Has protein aggregation actually been demonstrated in peripheral neurons of
    CMT2JJ patients, or is the mechanism inferred from other alleles and other
    genes?
  attaches_to:
  - "pathophysiology#Misfolded Protein Aggregation in Peripheral Neurons"
  rationale: >-
    The chain from a BAG3 IPV variant to a degenerating axon is currently held
    together by two inferences rather than direct observation, and the entry
    marks both nodes PROVISIONAL for that reason. The CASA-failure mechanism
    comes from p.Pro209Leu work; the aggregation-causes-neuropathy step comes
    from the analogy with HSPB1 p.Pro182Leu in CMT2, which the reviewing authors
    themselves offer as a possible avenue for future research. No study has shown
    insoluble aggregates in nerve tissue or neurons from a CMT2JJ patient. Since
    sural nerve biopsy is already performed in these patients diagnostically,
    this is an unusually tractable gap.
  proposed_experiments:
  - experiment_id: exp_cmt2jj_aggregate_detection_in_nerve
    name: Aggregate detection in CMT2JJ sural nerve tissue
    description: >-
      Examine archived sural nerve biopsies from BAG3 CMT2JJ patients for
      insoluble BAG3, HSPB8 and ubiquitinated protein aggregates, comparing
      against biopsies from CMT patients with other genetic causes.
notes: >-
  Scope and boundaries. This entry covers CMT2JJ (MONDO:0976227), the
  neuropathy-predominant BAG3 phenotype. It deliberately does not restate the
  BAG3 cardiomyopathy or myofibrillar myopathy pathographs, which are already
  curated elsewhere in this knowledge base — MFM6 as a subtype of
  `Myofibrillar_Myopathy`, and BAG3 dilated cardiomyopathy across several
  `Dilated_Cardiomyopathy` entries. Both are curated here as differential
  diagnoses instead, because distinguishing them is the actual clinical task.

  Do not curate this as a clean allelic partition. It is tempting to write BAG3
  up as one gene with three tidy phenotypes selected by allele. The evidence does
  not support that: p.Pro209Ser and p.Pro209Leu sit at the same codon, and a
  p.Pro209Leu patient has been reported with a CMT-like axonal polyneuropathy
  and no cardiomyopathy. The relationship between allele and phenotype in this
  gene is unresolved and is recorded as an open discussion.

  The lesion is a toxic gain of function, not a loss. This is worth stating
  plainly because the intuitive reading of a co-chaperone disease is
  haploinsufficiency, and it is wrong here: the Pro209 mutants acquire a new
  property, dragging CASA-complex chaperones and ubiquitinylated clients into
  insoluble aggresomes where they cannot be cleared. `functional_impact_category`
  is `GAIN_OF_FUNCTION` accordingly. A practical consequence: therapeutic
  strategies that overexpress wild-type BAG3 to boost autophagy — an active
  literature in other diseases — are not applicable here and must not be curated
  as treatments for this entry.

  Why one node remains PROVISIONAL. Aggresome formation itself is directly
  demonstrated for the Pro209 class including p.Pro209Ser, so the CASA node is
  ESTABLISHED. What is not established is the peripheral-neuron step: the
  aggresome work is cell-line based and no study has examined nerve tissue from a
  CMT2JJ patient. That gap is unusually tractable, since sural nerve biopsy is
  already part of the diagnostic workup.

  A note for anyone running a deep-research report on this disease. The standard
  NEC gene check is blind here: BAG3 is the causal gene for CMT2JJ, MFM6, dilated
  cardiomyopathy and a distal hereditary motor neuropathy alike, so a report that
  has drifted to myofibrillar myopathy will be saturated with "BAG3" and score a
  confident PASS. The discriminator is the substitution, not the gene — ask
  whether the report says Pro209**Ser** or Pro209**Leu**, and treat childhood
  onset, rigid spine or cardiac transplant as signs it is about MFM6.

  Evidence base. Small: two index families, one independently co-segregating
  family, one atypical-phenotype case report, and a review. No animal model, no
  functional study of the p.Pro209Ser allele itself, and no treatment evidence,
  so no treatments or animal_models blocks are curated.

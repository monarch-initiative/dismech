      label: motor neuron
  evidence:
  - reference: PMID:31853710
    reference_title: "BAG3 p.Pro209Ser mutation identified in a Chinese family with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nerve conduction velocity studies revealed an axonal sensorimotor
      neuropathy, which was supported by sural nerve biopsy.
    explanation: >-
      Electrophysiological and histological confirmation of the axonal
      sensorimotor neuropathy.
  - reference: PMID:28754666
    reference_title: "Mutations in BAG3 cause adult-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most cases present within the first two decades of life but increasing

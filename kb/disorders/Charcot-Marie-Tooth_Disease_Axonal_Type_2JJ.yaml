name: Charcot-Marie-Tooth disease, axonal, type 2JJ
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Charcot-Marie-Tooth disease type 2JJ is an adult-onset axonal sensorimotor
  peripheral neuropathy caused by heterozygous variants in BAG3, the
  co-chaperone of chaperone-assisted selective autophagy (CASA). BAG3 works with
  HSPB8 and Hsp70 to collect mechanically damaged and misfolded proteins, carry
  them to the microtubule organizing center and commit them to autophagosomal
  degradation; when that route fails, insoluble aggregates accumulate. CMT2JJ is
  therefore a proteostasis disease presenting as a neuropathy, rather than a
  defect of myelin, axonal transport or tRNA charging. Its most instructive
  feature is genotypic: the recurrent CMT2JJ allele p.Pro209Ser and the
  well-known myofibrillar myopathy allele p.Pro209Leu affect the same codon in
  the same IPV motif, yet one produces a peripheral neuropathy and the other a
  severe childhood myopathy with cardiomyopathy. The BAG3 phenotypes overlap
  rather than partition cleanly, and this entry is scoped to the neuropathy
  while recording that overlap explicitly.
category: Mendelian
parents:
- hereditary disease
synonyms:
- CMT2JJ
- BAG3-related Charcot-Marie-Tooth disease
- BAG3-related axonal neuropathy

    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:32472079
    reference_title: "BAG3 Pro209 mutants associated with myopathy and neuropathy relocate chaperones of the CASA-complex to aggresomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Combined, these data show that all BAG3_Pro209 mutants, irrespective of
      their different clinical phenotypes, are characterized by a gain-of-function
      that contributes to the gradual loss of protein homeostasis.
    explanation: >-
      Establishes progressive proteostatic failure as the shared consequence of
      the Pro209 mutants; note the finding is explicitly phenotype-independent,
      which is why the neuron-specific step remains open.
  - reference: PMID:35832504
    reference_title: "The role of BAG3 in dilated cardiomyopathy and its association with Charcot-Marie-Tooth disease type 2."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      However, the similar presence of insoluble protein aggregates in
      Charcot-Marie-Tooth disease type 2 (CMT2) induced by the proline 182 to
      leucine (P182L) HSPB1 mutant points to a possible avenue for future

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the p.(Pro209Ser) variant is associated with a pure CMT2 phenotype
      and no overt cardiac disease.
    explanation: >-
      The allele-specific statement about p.Pro209Ser itself, which is what this
      entry curates. Note "no OVERT cardiac disease" - the qualifier is load
      bearing and is why the cardiac-risk phenotype below is curated alongside it
      rather than being contradicted by it.
- category: Cardiovascular
  name: Cardiac Risk Requiring Surveillance
  description: >-
    Although p.Pro209Ser is reported as causing a pure CMT2 phenotype without
    OVERT cardiac disease, the paper that defined CMT2JJ reports cardiac deaths
    within a p.Pro209Ser pedigree: one evaluated subject had palpitations, and
    four further family members in that family died cardiac deaths, one as early
    as 46 years. The authors' own conclusion is that a CMT2 diagnosis may be what
    surfaces a subclinical and potentially lethal cardiac disease.

    Curated because the absence of overt disease in examined patients and the
    presence of cardiac deaths in the pedigree are not in conflict - the first is
    a statement about what examination found, the second about what was not
    looked for in time. An entry that recorded only the negative would imply
    cardiac surveillance is unnecessary in a disorder whose defining paper warns
    of subclinical, potentially life-threatening cardiac disease.

    The HP binding is deliberately narrower than the description: Palpitations is
    the only cardiac finding directly observed in an examined, genotyped subject,
    so it is the only one exported as a disease-level annotation. The pedigree
    deaths are the reason this node exists and are recorded here and in the
    evidence, but the four relatives were neither examined nor genotyped.

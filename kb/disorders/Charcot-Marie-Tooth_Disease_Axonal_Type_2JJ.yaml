  downstream:
  - target: Adult-Onset Axonal Sensorimotor Neuropathy
- name: Adult-Onset Axonal Sensorimotor Neuropathy
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  description: >-
    The clinical endpoint: an axonal sensorimotor neuropathy of adult onset and
    moderate severity, confirmed by nerve conduction studies and supported by
    sural nerve biopsy. Adult onset is itself characteristic — most CMT presents
    in the first two decades, while axonal subtypes increasingly present in
    adulthood, and BAG3 belongs to that later-onset group. Lower limb MRI shows a
    selective pattern, with fatty infiltration more severe in soleus and the deep
    posterior compartment than in medial gastrocnemius and the anterior
    compartment.
  cell_types:
  - preferred_term: Sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: Motor neuron
    term:

- category: Neurologic
  name: Preserved Ambulation
  description: >-
    A prognostically important negative, stated at allele resolution. The
    p.Pro209Ser variant that defines CMT2JJ is associated with a pure CMT2
    phenotype, in contrast to the recurrent p.Pro209Leu allele at the same codon,
    where most patients lose ambulation and develop respiratory insufficiency and
    restrictive cardiomyopathy. This is the practical reason a BAG3 result must be
    read at codon resolution rather than gene level.

    Deliberately NOT claimed here: that CMT2JJ patients resemble the ten
    non-p.Pro209Leu patients in the European BAG3-NMD cohort. That group carried
    p.Arg309*, p.Val505Glyfs*6 and p.Pro209Gln, had pure distal motor weakness
    with ENMG compatible with dHMN, and the same paper places p.Pro209Ser outside
    the cohort entirely. Borrowing their course would import the phenotype of
    the very entity this entry's differential diagnoses separate CMT2JJ from.

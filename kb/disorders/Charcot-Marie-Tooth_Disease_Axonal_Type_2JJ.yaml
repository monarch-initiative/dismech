pathophysiology:
- name: BAG3 IPV Motif Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous variants affect the conserved IPV motif region of BAG3, the
    surface through which it binds the small heat shock protein HSPB8. The
    recurrent CMT2JJ allele is p.Pro209Ser (c.625C>T), reported in three families
    and then independently in a Chinese family, and proposed on that basis to be
    a hotspot with more than one ethnic origin. It sits at the same codon as the
    myofibrillar myopathy allele p.Pro209Leu (c.626C>T) — adjacent nucleotides,
    one codon, two diseases.
  genes:
  - preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline missense variants at the IPV motif. The action is a
      toxic gain of function, not haploinsufficiency or a simple dominant
      negative: the Pro209 mutants as a class acquire a new property, relocating
      themselves and their chaperone partners into insoluble aggresomes. This was
      shown for all Pro209 mutants together, p.Pro209Ser included, rather than
      inferred from the myopathy allele alone.
  evidence:
  - reference: PMID:31853710
    reference_title: "BAG3 p.Pro209Ser mutation identified in a Chinese family with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recently, a novel c.625C>T (p.Pro209Ser) mutation in BAG3 was reported to
      cause axonal Charcot-Marie-Tooth (CMT) disease in three families.
    explanation: >-
      Establishes p.Pro209Ser as the recurrent CMT2JJ allele across three
      families.
  - reference: PMID:31853710
    reference_title: "BAG3 p.Pro209Ser mutation identified in a Chinese family with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Pro209Ser mutation with different ethnic origins might be another
      hotspot mutation of BAG3.
    explanation: >-
      Supports treating p.Pro209Ser as a recurrent hotspot allele rather than a
      private family variant.
  downstream:
  - target: Chaperone-Assisted Selective Autophagy Failure
- name: Chaperone-Assisted Selective Autophagy Failure
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  conforms_to: "loss_of_proteostasis#Loss of Proteostasis"
  description: >-
    BAG3 is the co-chaperone of chaperone-assisted selective autophagy: with
    HSPB8 and Hsp70 it transports misfolded proteins to the microtubule
    organizing center for degradation in autophagosomes. The Pro209 mutants do
    not merely fail at this — they actively subvert it, relocating CASA-complex
    chaperones into insoluble aggresomes and trapping ubiquitinylated client
    proteins there so they cannot be cleared. This was demonstrated for the
    Pro209 mutant class including p.Pro209Ser, which is why this node is
    ESTABLISHED rather than inferred from the myopathy allele.
  biological_processes:
  - preferred_term: chaperone-mediated autophagy
    modifier: DECREASED
    term:
      id: GO:0061684
      label: chaperone-mediated autophagy
  - preferred_term: protein folding
    modifier: ABNORMAL
    term:
      id: GO:0006457
      label: protein folding
  evidence:
  - reference: PMID:35832504
    reference_title: "The role of BAG3 in dilated cardiomyopathy and its association with Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BAG3 interacts with chaperones HSPB8 and Hsp70 to transport misfolded
      proteins to the Microtubule Organizing Center (MTOC) and degrade them in
      autophagosomes in a process known as Chaperone Assisted Selective Autophagy
      (CASA).
    explanation: >-
      Defines the CASA pathway in which BAG3 acts and which this node represents.
  - reference: PMID:32472079
    reference_title: "BAG3 Pro209 mutants associated with myopathy and neuropathy relocate chaperones of the CASA-complex to aggresomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that all BAG3_Pro209 mutants have acquired a toxic gain-of-function,
      which causes these variants to accumulate in the form of insoluble HDAC6- and
      vimentin-positive aggresomes.
    explanation: >-
      Establishes the toxic gain-of-function and aggresome relocation for the
      Pro209 mutant class, p.Pro209Ser included.
  - reference: PMID:30559338
    reference_title: "Myopathy associated BAG3 mutations lead to protein aggregation by stalling Hsp70 networks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      As a consequence, the mutant BAG3 proteins become the node for a dominant
      gain of function causing aggregation of itself, Hsp70, Hsp70 clients and
      tiered interactors within the BAG3 interactome.
    explanation: >-
      Independent demonstration that the mechanism is a dominant gain of function
      propagating through the Hsp70 network.
  downstream:
  - target: Misfolded Protein Aggregation in Peripheral Neurons
- name: Misfolded Protein Aggregation in Peripheral Neurons
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  conforms_to: "loss_of_proteostasis#Misfolded-Protein Aggregation"
  description: >-
    Aggresome formation and client entrapment are directly demonstrated for the
    Pro209 mutants, so the aggregation itself is not in doubt. What remains
    PROVISIONAL is specifically the peripheral-neuron step: the aggresome work
    was done in cell lines, no study has shown aggregates in nerve tissue from a
    CMT2JJ patient, and the supporting argument that aggregation is what damages
    the axon leans additionally on the analogy with HSPB1 p.Pro182Leu in CMT2.
    The gradual loss of protein homeostasis these mutants produce is the
    plausible route to axonal degeneration; it has not been observed in the
    affected tissue.
  biological_processes:
  - preferred_term: protein folding
    modifier: ABNORMAL
    term:
      id: GO:0006457
      label: protein folding
  cell_types:

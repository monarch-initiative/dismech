- category: Neurologic
  name: Preserved Ambulation without Cardiorespiratory Involvement
  description: >-
    A prognostically important negative. In the largest BAG3 neuromuscular
    series (26 patients, 18 families), the ten patients carrying BAG3 variants
    OTHER than the recurrent p.Pro209Leu — the group into which CMT2JJ alleles
    fall — followed a milder course: all remained ambulatory and none had
    cardiorespiratory manifestations at last follow-up. This contrasts sharply
    with the p.Pro209Leu myopathy group in the same study, where most lost
    ambulation and developed respiratory insufficiency and restrictive
    cardiomyopathy. The distinction is allele-driven, and it is the practical
    reason a BAG3 result must be read at codon resolution rather than gene
    level.
  evidence:
  - reference: PMID:40493734
    reference_title: "Disease spectrum and long-term prognosis of patients with BAG3-associated neuromuscular diseases in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The other 10 patients carried three other BAG3 variants and showed a milder
      disease course, with all patients remaining ambulatory, without
      cardiorespiratory manifestations at last follow-up.
    explanation: >-
      Establishes the milder, ambulation-preserving course for non-p.Pro209Leu
      BAG3 variants, the group CMT2JJ belongs to.
  - reference: PMID:40493734
    reference_title: "Disease spectrum and long-term prognosis of patients with BAG3-associated neuromuscular diseases in Europe."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All other BAG3 variants were rare and caused milder clinical presentations.
    explanation: >-
      The study's own summary of the allele-severity split.
genetic:
- name: BAG3
  gene_term:
    preferred_term: BAG3
    term:
      id: hgnc:939
      label: BAG3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    BAG3 (10q26.11) encodes a multifunctional co-chaperone responsible for
    protein quality control. The recurrent CMT2JJ allele is c.625C>T
    (p.Pro209Ser), reported across three families and independently in a Chinese
    family, and proposed as a hotspot on the basis of its differing ethnic
    origins. Note the adjacent-nucleotide contrast that makes this gene
    instructive: c.626C>T (p.Pro209Leu) at the same codon causes myofibrillar
    myopathy 6 and dilated cardiomyopathy rather than neuropathy. BAG3 disease
    should be considered in CMT genetic testing, which is the practical
    recommendation the reporting authors make.
  evidence:
  - reference: PMID:31853710
    reference_title: "BAG3 p.Pro209Ser mutation identified in a Chinese family with Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study further enforces the association between BAG3 gene and CMT
      disease, indicating that BAG3 should be considered in the genetic testing
      for CMT.
    explanation: >-
      States the gene-disease association and its testing implication.
  - reference: PMID:35832504
    reference_title: "The role of BAG3 in dilated cardiomyopathy and its association with Charcot-Marie-Tooth disease type 2."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Bcl2-associated athanogene 3 (BAG3) is a multifunctional cochaperone
      responsible for protein quality control within cells.
    explanation: >-
      States the normal cellular function of the affected protein.

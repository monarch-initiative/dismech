- name: Serum Creatine Kinase
  notes: >-
    CK is the practical bedside discriminator from BAG3 myofibrillar myopathy: in
    CMT2JJ it is normal or at most mildly elevated, consistent with a neuropathy
    rather than a primary myopathy, whereas a myopathic BAG3 presentation raises
    it substantially.
  evidence:
  - reference: PMID:28754666
    reference_title: "Mutations in BAG3 cause adult-onset Charcot-Marie-Tooth disease."
    supports: SUPPORT

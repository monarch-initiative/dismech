      used (38, 44). Systemic steroids increase fibrinolysis, inhibit
      coagulation, and induce hepatic synthesis of protease inhibitors (such as
      proteins C and S).
    explanation: >-
      Supports danazol monotherapy and its fibrinolysis-enhancing mechanism in

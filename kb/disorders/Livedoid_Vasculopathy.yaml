  - reference: DOI:10.1111/iwj.13480
    reference_title: >-
      Plasminogen activator inhibitor-1: a potential etiological role in
      livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Enhanced expression and genotype polymorphism of PAI-1 have been observed
      in LV patients.
    explanation: >-
      Supports increased PAI-1 expression and SERPINE1 polymorphism as the
      fibrinolytic defect in livedoid vasculopathy.
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent systematic review of genetic variants in LV found that PAI-1 675
      4G/5G was the most common, accounting for 85.26% of the patients, followed
      by PAI-1 A844G, MTHFR C677T, and MTHFR A1298C variants (17).
    explanation: >-
      Quantifies the prevalence of SERPINE1 (PAI-1) promoter variants among
      genetically studied livedoid vasculopathy patients.
  downstream:
  - target: Dermal microvascular thrombosis
    description: >-
      PAI-1-mediated inhibition of fibrinolysis prevents dissolution of nascent
      intraluminal fibrin thrombi in superficial dermal microvessels.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.1111/iwj.13480
      reference_title: >-
        Plasminogen activator inhibitor-1: a potential etiological role in
        livedoid vasculopathy
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Enhanced expression and genotype polymorphism of PAI-1 have been
        observed in LV patients.
      explanation: >-
        Links PAI-1-mediated impairment of fibrinolysis to the dermal
        microvascular thrombosis of livedoid vasculopathy.
- name: Inherited or acquired thrombophilia
  description: >-
    Inherited and acquired hypercoagulable states—including heterozygous factor
    V Leiden (F5 p.Arg506Gln) activated protein C resistance, prothrombin
    G20210A, protein C or S deficiency, antiphospholipid antibodies, elevated
    lipoprotein(a), and hyperhomocysteinemia—promote excess thrombin generation
    and fibrin formation in the lower-extremity dermal microcirculation.
  cell_types:

        livedoid vasculopathy.
- name: Impaired fibrinolysis (PAI-1)
  description: >-
    Elevated plasminogen activator inhibitor-1 (PAI-1) expression and functional
    SERPINE1 promoter polymorphisms (such as -675 4G/5G and A844G) inhibit
    endogenous plasminogen activation, impairing fibrinolytic clearance of
    nascent fibrin clots in superficial dermal microvessels.

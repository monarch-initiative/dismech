- name: Hyperbaric oxygen therapy
  description: >-
    Hyperbaric oxygen therapy (HBOT) delivers 100% oxygen at elevated pressure
    to counter dermal tissue hypoxia, promote fibrinolysis and angiogenesis, and
    accelerate ulcer healing and pain relief in refractory livedoid
    vasculopathy.
  treatment_term:
    preferred_term: Hyperbaric Oxygen Therapy
    term:
      id: NCIT:C38065
      label: Hyperbaric Oxygen Therapy
  target_mechanisms:

clinical_trials:
- name: RILIVA
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Multicentre, single-arm, prospective phase IIa clinical trial evaluating
    oral rivaroxaban (10 mg twice daily initially, tapered to 10 mg daily upon
    pain reduction) for 12 weeks in 25 patients with livedoid vasculopathy and a
    baseline visual analogue scale pain score of at least 40, demonstrating
    statistically significant reduction in mean pain score from 65 to 6.
  target_phenotypes:
  - preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
  - preferred_term: Skin ulcer
    term:
      id: HP:0200042
      label: Skin ulcer
  evidence:
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is of note that rivaroxaban is the only drug with a clinical trial
      involving 25 patients with LV (RILIV A), showing statistically significant
      improvement in pain with a mean score of 65 to 6 on a 0- to 100-point
      visual analog scale after 12 weeks of treatment (6).
    explanation: >-
      Summarizes the 25-patient RILIVA clinical trial of oral rivaroxaban and

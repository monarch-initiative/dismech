  - target: Peripheral neuropathy
    description: >-
      Thrombus formation in the vasa nervorum—analogous to microvascular
      thrombosis in dermal vessels—causes ischemic peripheral nerve injury,
      presenting as dysesthesia, hypoesthesia, axonal polyneuropathy, or
      mononeuritis multiplex.

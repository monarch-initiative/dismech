    treatment_effect: RESTORES
    description: >-
      Delivers hyperbaric oxygen to ischemic skin, promoting endogenous
      fibrinolysis and angiogenesis to accelerate ulcer healing.
    evidence:
    - reference: DOI:10.3389/fmed.2022.993515
      reference_title: >-
        A comprehensive review on pathogenesis, associations, clinical findings,

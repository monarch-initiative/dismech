inheritance:
- name: Non-Mendelian multifactorial susceptibility
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  description: >-
    Livedoid vasculopathy is a complex non-Mendelian thrombo-occlusive disorder
    that may occur idiopathically or in association with inherited or acquired
    thrombophilias, autoimmune connective-tissue diseases, or neoplasms.
  evidence:
  - reference: DOI:10.3389/fmed.2022.1012178
    reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Different conditions that can promote a hypercoagulable state, such as
      inherited and acquired thrombophilias, autoimmune connective-tissue
      diseases and neoplasms, can be associated with livedoid vasculopathy.
    explanation: >-
      This review abstract supports a multifactorial non-Mendelian etiology
      involving inherited or acquired prothrombotic conditions rather than a
      monogenic inheritance pattern.

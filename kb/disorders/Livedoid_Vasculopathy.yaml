- name: Intravenous immunoglobulin for refractory disease
  description: >-
    Intravenous immunoglobulin (IVIG, typically 2 g/kg every 4 weeks) is a
    high-response alternative for refractory livedoid vasculopathy, improving
    pain, skin ulceration, and dysesthesia/neuropathy symptoms.
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Dermal microvascular thrombosis
    treatment_effect: MODULATES
    description: >-
      Modulates endothelial and complement-mediated vascular injury and reduces
      prothrombotic cytokine signaling in refractory livedoid vasculopathy.
    evidence:
    - reference: PMID:35634570
      reference_title: >-
        Efficacy and safety of intravenous immunoglobulin for treating
        refractory livedoid vasculopathy: a systematic review.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The effective rate of IVIG therapy in LV patients was 95% (76/80) in
        published studies, showing a good clinical response for resolution of
        pain, skin ulcerations, and neurological symptoms, and reducing the
        dependence on glucocorticoids and immunosuppressive agents.
      explanation: >-
        Demonstrates 95% clinical response across 80 refractory livedoid
        vasculopathy patients with resolution of ischemic pain, ulcers, and
        neurological symptoms.
  evidence:
  - reference: PMID:35634570
    reference_title: >-
      Efficacy and safety of intravenous immunoglobulin for treating refractory
      livedoid vasculopathy: a systematic review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, to a certain degree, IVIG is probably a safe and effective

  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  evidence:
  - reference: DOI:10.1111/jdv.15639
    reference_title: >-
      Characteristics, risk factors and treatment reality in livedoid
      vasculopathy – a multicentre analysis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of 27 patients revealed that LV patients had an increased Body
      Mass Index (BMI; 11/27), hypertension (19/27) and increased levels of
      lipoprotein (a) (5/12) and homocysteine (10/12) in the blood.
    explanation: >-
      Documents prothrombotic and vascular risk factors in a multicentre
      livedoid vasculopathy cohort.
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common prothrombotic factors observed were antiphospholipid
      antibodies (17.64%), factor V Leiden mutation in heterozygosis (17.64%),
      and protein C and/or S deficiency (8.82%).
    explanation: >-
      Quantifies the major inherited and acquired thrombophilic factors—including
      heterozygous factor V Leiden (F5)—in livedoid vasculopathy cohorts.
  - reference: clinicaltrials:NCT00975871
    reference_title: Correlation of Genetic Polymorphism and Livedo Vasculitis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      It has been reported to be associated with some gene mutations, for
      example, factor V Leiden gene.
    explanation: >-
      Trial background summary noting the reported association between factor V
      Leiden (F5) and livedo vasculitis/livedoid vasculopathy.
  downstream:
  - target: Dermal microvascular thrombosis
    description: >-
      Inherited and acquired hypercoagulable states accelerate fibrin formation
      and promote microvascular thrombus deposition in dermal vessels.
    causal_link_type: DIRECT
    evidence:
    - reference: DOI:10.3389/fmed.2022.993515
      reference_title: >-
        A comprehensive review on pathogenesis, associations, clinical findings,
        and treatment of livedoid vasculopathy
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Although the pathogenesis of LV remains unclear, it is thought to
        involve a locally favored alteration in either an increased local or
        systemic thrombotic activity or a decreased fibrinolytic alteration,
        that is a coagulation disturbance, that leads to the formation of
        fibrin thrombi within superficial dermal blood vessels (9).
      explanation: >-
        Demonstrates that increased thrombotic activity leads directly to the
        formation of fibrin thrombi within superficial dermal blood vessels.
    - reference: DOI:10.3389/fmed.2022.1012178
      reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Different conditions that can promote a hypercoagulable state, such as
        inherited and acquired thrombophilias, autoimmune connective-tissue
        diseases and neoplasms, can be associated with livedoid vasculopathy.
      explanation: >-
        Links inherited and acquired thrombophilias to the hypercoagulable state
        driving livedoid vasculopathy.

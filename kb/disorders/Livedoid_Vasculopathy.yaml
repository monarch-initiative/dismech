differential_diagnoses:
- name: Polyarteritis nodosa (including cutaneous polyarteritis nodosa)
  disease_term:
    preferred_term: polyarteritis nodosa
    term:
      id: MONDO:0019170
      label: polyarteritis nodosa
  description: >-
    Polyarteritis nodosa—particularly its skin-limited form, cutaneous
    polyarteritis nodosa (cPAN)—is a necrotizing vasculitis of small- to
    medium-sized arteries in the deep dermis and hypodermis that presents with
    livedo racemosa, painful lower-extremity ulcers, and atrophie blanche-like
    scarring.
  distinguishing_features:
  - >-
    Typically features tender subcutaneous nodules, mononeuritis multiplex from
    vasculitis of the vasa nervorum, and necrotizing medium-sized arterial wall
    inflammation on deep excisional biopsy rather than isolated superficial
    dermal microvascular fibrin thrombosis.
  evidence:
  - reference: DOI:10.3389/fmed.2022.1012178
    reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most important differential diagnosis is cutaneous PAN, a small- to
      medium necrotizing vessel vasculitis of the deep dermis and/or hypodermis.
      The symptoms are comparable with LV including Livedo racemosa and painful
      ulcers. However, PAN almost always shows subcutaneous nodes and signs of
      Mononeuritis multiplex (31).
    explanation: >-
      Identifies cutaneous polyarteritis nodosa as the primary differential
      diagnosis and contrasts its deep dermal/hypodermal necrotizing vasculitis,
      subcutaneous nodules, and mononeuritis multiplex with livedoid
      vasculopathy.
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is important to notice that the term “atrophie blanche” is descriptive
      and it includes not only patients with LV but also patients with a
      combination of vasculitis and vasculopathy, that is, LV and medium-sized
      vasculitis such as cutaneous polyarteritis nodosa (PANc).
    explanation: >-
      This review abstract identifies cutaneous polyarteritis nodosa as an
      important medium-vessel vasculitis differential and potential concomitant
      condition in patients presenting with atrophie blanche.
- name: Allergic cutaneous vasculitis (cutaneous immune-complex / leukocytoclastic vasculitis)
  disease_term:
    preferred_term: allergic cutaneous vasculitis
    term:
      id: MONDO:0001290
      label: allergic cutaneous vasculitis
  description: >-
    Cutaneous immune-complex (leukocytoclastic) small-vessel vasculitis can
    present with lower-extremity purpura, hemorrhagic crusts, painful
    ulcerations, and atrophie blanche-like scars that closely mimic livedoid
    vasculopathy.
  distinguishing_features:
  - >-
    Demonstrates primary neutrophil-predominant vessel-wall inflammation with
    karyorrhexis (nuclear dust / leukocytoclasia), granular immune-complex
    deposition, and often reduced serum complement, whereas livedoid
    vasculopathy shows homogeneous intraluminal fibrin thrombi and segmental
    hyalinization without leukocytoclasia.
  evidence:
  - reference: DOI:10.3389/fmed.2022.1012178
    reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnoses contain cutaneous PAN, cutaneous immune-complex
      vasculitis, antiphospholipid-syndrome, pyoderma gangraenosum,
      cryoglobulinemia type I, Sneddon’s syndrome, and warfarin-induced
      cutaneous necrosis (Figures 9A,B; 31).
    explanation: >-
      Explicitly lists cutaneous immune-complex vasculitis among the core
      differential diagnoses of livedoid vasculopathy.
  - reference: DOI:10.3389/fmed.2022.1012178
    reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, normal serum-complement levels, a diffuse homogenous instead of
      granular deposition pattern, a slight perivascular infiltration of
      leukocytes and the absence of nuclear dust (so called leukocytoclasia)
      argue against an immunocomplex-mediated disease like inflammatory
      vasculitis (7, 8).
    explanation: >-
      Contrasts the histopathological and immunofluorescence features of
      livedoid vasculopathy against immune-complex leukocytoclastic vasculitis.
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sparse perivascular lymphocytic infiltrate may be seen, with no signs of
      leukocytoclastic vasculitis.
    explanation: >-
      Confirms absence of leukocytoclastic vasculitis on histopathology in
      livedoid vasculopathy.
- name: Sneddon syndrome
  disease_term:
    preferred_term: Sneddon syndrome
    term:
      id: MONDO:0008436
      label: Sneddon syndrome
  description: >-
    Sneddon syndrome is a systemic non-inflammatory thrombotic vasculopathy of
    small and medium arteries characterized by generalized livedo racemosa and
    recurrent ischemic cerebrovascular events.
  distinguishing_features:
  - >-
    Involves systemic small-to-medium arteries with transient ischemic attacks
    or ischemic strokes alongside generalized livedo racemosa, whereas livedoid
    vasculopathy is restricted to the lower-extremity dermal microcirculation
    (with peripheral neuropathy via vasa nervorum thrombosis as the only
    extracutaneous feature).
  evidence:
  - reference: DOI:10.3389/fmed.2022.1012178
    reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Differential diagnoses contain cutaneous PAN, cutaneous immune-complex
      vasculitis, antiphospholipid-syndrome, pyoderma gangraenosum,
      cryoglobulinemia type I, Sneddon’s syndrome, and warfarin-induced
      cutaneous necrosis (Figures 9A,B; 31).
    explanation: >-
      Lists Sneddon syndrome as a recognized differential diagnosis of livedoid
      vasculopathy.
treatments:
- name: Anticoagulant pharmacotherapy
  description: >-
    Anticoagulant treatment, including low-molecular-weight heparin or direct
    oral anticoagulants such as rivaroxaban, is the first-line pharmacologic
    approach for livedoid vasculopathy and prevents microvascular thrombus
    propagation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rivaroxaban
      term:
        id: CHEBI:68579
        label: rivaroxaban
    - preferred_term: heparin
      term:
        id: CHEBI:28304
        label: heparin
  target_mechanisms:
  - target: Dermal microvascular thrombosis
    treatment_effect: INHIBITS
    description: >-
      Inhibits factor Xa and thrombin-mediated fibrin clot formation in dermal
      microvessels, halting thrombus propagation and relieving ischemic pain.
    evidence:
    - reference: DOI:10.3389/fmed.2022.1012178
      reference_title: Livedoid vasculopathy – A diagnostic and therapeutic challenge
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Because of the pathophysiological concept of the formation of
        microthrombi, an anticoagulatory therapy, e.g., with low molecular
        weight heparins (LMWHs) or direct oral anticoagulants (DOACs) is widely
        accepted as first line treatment and recommended by the german S1
        guidelines (28, 38, 57).
      explanation: >-
        Directly links first-line LMWH and DOAC anticoagulation to inhibition of
        dermal microthrombus formation.
  evidence:
  - reference: DOI:10.1111/jdv.15639
    reference_title: >-
      Characteristics, risk factors and treatment reality in livedoid
      vasculopathy – a multicentre analysis
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of patient treatment history showed that heparin was most
      effective (12/17), while anti-inflammatory regimens were, although often
      used (17/24), not effective (0/17).
    explanation: >-
      This multicentre analysis supports anticoagulation over anti-inflammatory
      regimens in clinical practice.
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,
      and treatment of livedoid vasculopathy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, pain management, wound care, control of cardiovascular risk
      factors, and both antiplatelets and anticoagulants, mostly rivaroxaban, are
      the main therapies used.
    explanation: >-
      This review supports antiplatelet and anticoagulant therapy, especially
      rivaroxaban, as commonly used management.
- name: Danazol fibrinolytic and anticoagulant therapy
  description: >-
    Anabolic steroid therapy with danazol (typically 200 mg/day) is the second
    most frequently reported monotherapy for livedoid vasculopathy; it enhances
    endogenous fibrinolysis, inhibits coagulation, and increases hepatic
    synthesis of proteins C and S.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: danazol
      term:
        id: CHEBI:4315
        label: danazol
  target_mechanisms:
  - target: Impaired fibrinolysis (PAI-1)
    treatment_effect: RESTORES
    description: >-
      Increases endogenous fibrinolytic activity and hepatic synthesis of
      natural anticoagulant proteins C and S.
    evidence:
    - reference: DOI:10.3389/fmed.2022.993515
      reference_title: >-
        A comprehensive review on pathogenesis, associations, clinical findings,
        and treatment of livedoid vasculopathy
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Anabolic steroids were the second most frequently reported monotherapy
        for the treatment of LV (38). Danazol was the most commonly used
        steroid, given in a dose of 200 mg/day, although stanozolol 4 mg/day can
        also be used (38, 44). Systemic steroids increase fibrinolysis, inhibit
        coagulation, and induce hepatic synthesis of protease inhibitors (such
        as proteins C and S).
      explanation: >-
        Establishes danazol as a major second-line monotherapy that restores
        fibrinolysis and inhibits coagulation.
  evidence:
  - reference: DOI:10.3389/fmed.2022.993515
    reference_title: >-
      A comprehensive review on pathogenesis, associations, clinical findings,

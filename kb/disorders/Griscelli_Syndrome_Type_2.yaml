pathophysiology:
- name: Loss of a Component of the RAB27A-Melanophilin-Myosin Va Complex
  conforms_to: "lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis or Trafficking Component"
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants remove one member of the tripartite
    complex that links melanosomes to the actin cytoskeleton: the small GTPase
    RAB27A on the melanosome membrane, the actin-based motor myosin Va on actin
    filaments, and melanophilin, which bridges the two. Melanophilin binds
    RAB27A through its N-terminal domain and myosin Va through its C-terminal
    coiled-coil region, so loss of any one member breaks the same physical link.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  cellular_components:
  - preferred_term: melanosome
    term:
      id: GO:0042470
      label: melanosome
  downstream:
  - target: Failure of Peripheral Melanosome Capture and Transfer to Keratinocytes
    description: >-
      A broken tether leaves melanosomes unable to be held at the melanocyte
      periphery for transfer.
  - target: Loss of Cytotoxic Granule Exocytosis
    description: >-
      The same RAB27A loss removes the exocytosis step of the other
      lysosome-related organelle it serves, the cytotoxic granule. This is the
      parallel arm of the disease and the one that carries the mortality.
  evidence:
  - reference: PMID:12062444
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cosedimentation assays using recombinant proteins reveal that melanophilin directly binds to Rab27a and myosin Va through its N-terminal and its first C-terminal coiled-coil region, respectively. Moreover, we show that Rab27a, melanophilin, and myosin Va form a ternary complex in the human melanocyte cell line HMV-II.
    explanation: >-
      Demonstrates the tripartite complex biochemically and in a human
      melanocyte line, establishing why three different genes give one disease.
  - reference: PMID:11856727
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In this study, we discovered Slac2-a/melanophilin to be the "missing link" between myosin Va and GTP-Rab27A present in the melanosome.
    explanation: >-
      Independently establishes melanophilin as the bridging member of the
      complex, which is why MLPH loss phenocopies the pigmentary arm.
- name: Failure of Peripheral Melanosome Capture and Transfer to Keratinocytes
  conforms_to: "lysosome_related_organelle_biogenesis#Failed Delivery of Functional Melanosomes to Keratinocytes"
  biological_scale: CELLULAR
  description: >-
    Melanosomes are not captured at the melanocyte periphery and are not
    transferred to surrounding keratinocytes. The histological consequence is
    diagnostic and is the inverse of what albinism produces: melanocytes are
    large and distended with abundant melanin, while the adjacent keratinocytes
    contain essentially none. In the hair shaft the same failure produces the
    large, irregular clumps of melanin that give the hair its silvery
    appearance and are the microscopic hallmark of the disease.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: melanosome transport
    term:
      id: GO:0032402
      label: melanosome transport
    modifier: DECREASED
  - preferred_term: pigmentation
    term:
      id: GO:0043473
      label: pigmentation
    modifier: DECREASED
  downstream:
  - target: Silvery Hair and Partial Cutaneous Albinism
    description: >-
      Skin and hair that receive no melanosomes are hypopigmented despite
      melanocytes being present and pigment being made.
  evidence:
  - reference: PMID:17483661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The melanocytes were large and distended with a large volume of melanin (Figure 2). The adjacent keratinocytes were completely devoid of melanin.
    explanation: >-
      Demonstrates the transfer block directly in patient skin: pigment is made
      and retained in the melanocyte but never reaches the keratinocyte.
  - reference: PMID:25500851
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent microscopic analysis of the patient's hair follicle revealed abnormal distribution of melanosomes in the shaft, which is a hallmark for GS.
    explanation: >-
      Documents the abnormal melanosome distribution in the hair shaft as the
      diagnostic hallmark, and shows it is what distinguishes GS at the bedside.
- name: Silvery Hair and Partial Cutaneous Albinism
  biological_scale: ORGANISM
  description: >-
    Silvery-grey hair, eyebrows, eyelashes and body hair, with generalized skin
    hypopigmentation relative to unaffected family members. This pigmentary
    phenotype is shared by all three subtypes and is the feature that should
    prompt hair-shaft microscopy.
  locations:
  - preferred_term: skin
    term:
      id: UBERON:0002097
      label: skin of body
  evidence:
  - reference: PMID:17483661
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On examination she was noted to have generalized excessively fair skin when compared with her parents. She had silver-gray hair (Figure 1) and white eyebrows and body hair.
    explanation: >-
      Documents the pigmentary phenotype, including the comparison with parental
      pigmentation that establishes it as abnormal for the family background.
- name: Loss of Cytotoxic Granule Exocytosis
  conforms_to: "lysosome_related_organelle_biogenesis#Failure of Other Lysosome-Related Organelles Sharing the Machinery"
  biological_scale: CELLULAR
  description: >-
    RAB27A is required not only for melanosome transport but for the regulated
    exocytosis of cytotoxic granules by cytotoxic T lymphocytes and NK cells.
    The cytotoxic granule is a lysosome-related organelle like the melanosome,
    so the same trafficking lesion removes lymphocyte cytotoxic function
    alongside pigmentation. This arm is specific to the RAB27A subtype; it is
    absent in the MLPH-associated (GS3) disorder, whose gene product acts only
    within the melanosome complex.
  cell_types:
  - preferred_term: cytotoxic T cell
    term:
      id: CL:0000910
      label: cytotoxic T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: regulated exocytosis
    term:
      id: GO:0045055
      label: regulated exocytosis
    modifier: DECREASED
  downstream:
  - target: Haemophagocytic Lymphohistiocytosis (Accelerated Phase)
    description: >-
      Cytotoxic cells that cannot release their granules cannot kill the target
      cells that would normally terminate an immune response.
  evidence:
  - reference: PMID:12058346
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients with GS display the hemophagocytic syndrome and have mutations in RAB27A, which codes for a small GTPase.
    explanation: >-
      Establishes the association of the haemophagocytic syndrome specifically
      with the RAB27A subtype.
  - reference: PMID:38774881
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Lysosomes and lysosome related organelles (LROs) are dynamic organelles at the intersection of various pathways involved in maintaining cellular hemostasis and regulating cellular functions. Vesicle trafficking of lysosomes and LROs are critical to maintain their functions.
    explanation: >-
      Supports the organelle-level premise of this node - that the cytotoxic
      granule is an LRO whose function depends on the same vesicle trafficking
      the melanosome does.
  notes: >-
    The mechanistic link from RAB27A to cytotoxic granule exocytosis is stated
    here on the strength of the clinical association plus RAB27A's established
    role as a regulator of regulated exocytosis. The cited sources support the
    association of HLH with the RAB27A subtype; they are not cited as
    demonstrating the granule-release defect experimentally, and the node is
    written to keep that distinction visible.
- name: Haemophagocytic Lymphohistiocytosis (Accelerated Phase)
  biological_scale: ORGANISM
  description: >-
    Without cytotoxic killing to terminate it, the immune response runs on:
    T lymphocytes and macrophages activate uncontrollably and infiltrate marrow,
    liver, spleen and central nervous system. Clinically this is the accelerated
    phase - prolonged high fever, cytopenias, hepatosplenomegaly and
    coagulopathy - and it is what makes GS2 a paediatric emergency rather than a
    pigmentary curiosity. It is the usual presenting problem, recognized before
    the pigmentary clue, and it is the cause of death in untreated disease.
  evidence:
  - reference: PMID:25500851
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient initially presented with a diagnosis of haemophagocytic lymphistiocytosis (HLH).
    explanation: >-
      Documents HLH as the presenting problem, which is the usual clinical
      sequence: the immune emergency is recognized before the pigmentary clue.
  - reference: PMID:12058346
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we propose that all patients with GS have RAB27A mutations and immunologic abnormalities that sometimes result in secondary neurological involvement.
    explanation: >-
      Supports the systemic immunologic disease of this node, and specifically
      that its neurological involvement is secondary to it rather than a primary
      neurodegeneration.

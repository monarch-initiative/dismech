- category: Neurologic
  name: Neurological Impairment
  description: >-
    Neurological deterioration, which in the RAB27A subtype is generally
    secondary to CNS involvement by the haemophagocytic process rather than a
    primary neurodegeneration.
  phenotype_term:
    preferred_term: Neurodegeneration
    term:
      id: HP:0002180
      label: Neurodegeneration
  evidence:
  - reference: PMID:12058346
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we propose that all patients with GS have RAB27A mutations and immunologic abnormalities that sometimes result in secondary neurological involvement.
    explanation: >-
      Supports neurological involvement and, importantly, the argument that in
      GS it is secondary to the immunological defect. This is presented in the
      source as a proposal, and the phenotype is curated without a frequency
      band on that basis.
genetic:
- name: RAB27A
  notes: >-
    RAB27A encodes a small GTPase resident on the melanosome membrane and on
    lymphocyte cytotoxic granules. Its dual role is what makes GS2 both a
    pigmentary and an immunological disease.
  gene_term:
    preferred_term: RAB27A
    term:
      id: hgnc:9766
      label: RAB27A
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:25500851
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of RAB27A gene in this patient revealed a homozygous mutation in exon 6, c.550C>T, p.R184X . This nonsense mutation causes premature truncation of the protein resulting in a dysfunctional RAB27A.
    explanation: >-
      Documents a specific biallelic RAB27A loss-of-function variant in a
      confirmed case.
  - reference: PMID:12058346
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patients have normal MYO5A genes but exhibit a homozygous 67.5-kb deletion that eliminates RAB27A mRNA and immunocytofluorescence-detectable protein.
    explanation: >-
      Documents complete RAB27A loss at both transcript and protein level in a
      kindred with the immunological phenotype.
treatments:
- name: Haematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic haematopoietic stem cell transplantation is the curative
    treatment for the immunological disease of GS2. It corrects the
    haematopoietic compartment and so the cytotoxic and haemophagocytic defect;
    it does not correct the pigmentary phenotype, which arises in melanocytes.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:25500851
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of GS allows appropriate institution of therapy namely chemotherapy for HLH and curative haemotopoeitic stem cell transplantation.
    explanation: >-
      Identifies transplantation as the curative therapy and ties it to
      recognizing the diagnosis.
- name: Chemotherapy for Haemophagocytic Lymphohistiocytosis
  description: >-
    HLH-directed chemotherapy is used to control the haemophagocytic episode
    and bring the patient to transplant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:25500851
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recognition of GS allows appropriate institution of therapy namely chemotherapy for HLH and curative haemotopoeitic stem cell transplantation.
    explanation: >-
      Identifies HLH-directed chemotherapy as the acute component of management.

name: Griscelli Syndrome Type 2
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Griscelli syndrome type 2 (GS2) is a rare autosomal recessive disorder of
  intracellular vesicle transport caused by biallelic loss-of-function variants
  in RAB27A. It combines silvery-grey hair with partial albinism and a
  life-threatening immune defect. RAB27A is a small GTPase resident on two
  different lysosome-related organelles, and the disease is the sum of losing
  both roles. On the melanosome it anchors the tripartite
  RAB27A-melanophilin-myosin Va complex that tethers melanosomes to the actin
  cytoskeleton at the melanocyte periphery; without that tether melanosomes are
  not captured peripherally and are not transferred to keratinocytes, so
  melanocytes accumulate melanin while surrounding keratinocytes are left devoid
  of it - the mechanistic inverse of albinism, in which pigment is never made.
  On the cytotoxic granule of T lymphocytes and NK cells RAB27A is required for
  regulated exocytosis, so its loss also removes lymphocyte cytotoxic function
  and patients present with haemophagocytic lymphohistiocytosis, a paediatric
  emergency that is usually recognized before the pigmentary clue. GS2 is the
  most common of the three Griscelli forms; the MYO5A (GS1) and MLPH (GS3)
  disorders share the pigmentary phenotype through loss of other members of the
  same melanosome-transport complex but are separate entities and are not
  curated here.
category: Genetic
parents:
- Genodermatosis

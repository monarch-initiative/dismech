notes: >-
  Griscelli syndrome is a melanosome-TRANSPORT disorder, and keeping that
  distinct from melanosome BIOGENESIS and from melanin synthesis is the main
  curation discipline this entry needs:

  - In oculocutaneous albinism, melanin is not synthesized.
  - In Hermansky-Pudlak and Chediak-Higashi syndromes, the lysosome-related
    organelle is not correctly formed or is formed as giant granules.
  - Here the melanosome is made normally and filled with melanin, but is never
    delivered - which is why patient melanocytes are *more* pigmented than
    normal while the skin is less so.

  Chediak-Higashi syndrome is the closest clinical mimic, sharing silvery hair
  and an HLH predisposition, and is distinguished on the hair shaft: irregular
  large melanin clumps in Griscelli, giant granules in Chediak-Higashi. That is
  why hair microscopy, not the clinical picture, settles the diagnosis.

  Scope: this entry curates GS2 (RAB27A) only, and its disease_term is the GS2
  MONDO term. It is deliberately NOT an umbrella entry over the three Griscelli
  forms. MONDO has obsoleted its umbrella term (MONDO:0000083, "obsolete
  Griscelli syndrome"), leaving three sibling terms - GS1/MYO5A
  (MONDO:0008962), GS2/RAB27A (MONDO:0011872) and GS3/MLPH (MONDO:0012220) -
  with no current parent to bind. Rather than promote one sibling's term to
  stand for all three, or invent an umbrella the ontology has withdrawn, the
  other two forms are recorded here and left for their own entries. If all
  three are curated later, a `Grouping` over them with
  `grouping_basis: SHARED_MECHANISM` is the right structure, since they are
  genuinely distinct diseases sharing one transport complex.

  Subtype nosology carries a further open disagreement that should not be
  flattened when those entries are written. One source cited here argues that
  the MYO5A patients with neurological disease and no immunological defect may
  not have Griscelli syndrome at all but Elejalde syndrome, and proposes that
  all true GS involves RAB27A.

  This entry conforms to `lysosome_related_organelle_biogenesis`, the module
  spanning the disorders in which lysosome-related organelles are mis-built,
  mis-sized or mis-positioned. It is the module's purest instance of the
  central effector: the melanosome here is fully built and fully pigmented and
  simply never delivered, whereas in Hermansky-Pudlak syndrome the melanosome is
  transferred but under-loaded, and in Chediak-Higashi it is giant and
  transfers poorly. This entry therefore attaches at the delivery node while
  those two do not.

  It deliberately does NOT conform to `neural_crest_melanocyte_deficiency`. That
  module's central effector is a melanoblast migration and survival defect -
  melanocytes absent from the skin - which is the opposite of what happens here,
  where melanocytes are present and more densely pigmented than normal.

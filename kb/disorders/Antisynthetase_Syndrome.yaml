    evidence_source: OTHER
    snippet: >-
      Patients receiving rituximab had 12.2% improvement in FVC and 2.9%
      increase in DLco at 1 year; for patients receiving CYC, there was 17%
      improvement and 6.3% increase, respectively.
    explanation: >-
      Summarizes observed cyclophosphamide-associated pulmonary-function improvement;
      heterogeneous non-randomized evidence does not establish comparative superiority.
- name: Intravenous Immunoglobulin (IVIG)
  description: >-
    Pooled donor IgG used as adjunctive therapy, especially for refractory myositis; a case
    report suggests possible benefit in IIM-related ILD.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent case report suggested IVIG may be effective in ILD related to IIM as well
    explanation: >-
      Supports only case-report-level possible benefit in IIM-related ILD, not established
      antisynthetase-syndrome efficacy or the refractory-myositis qualifier.
- name: Lung Transplantation
  description: >-
    Reserved for end-stage progressive interstitial lung disease refractory to medical
    therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      progressive interstitial lung disease necessitating lung transplantation
    explanation: >-
      Supports lung transplantation for end-stage progressive ILD.
diagnosis:
- name: Anti-Aminoacyl-tRNA Synthetase Antibody Testing
  description: >-
    The serological cornerstone of diagnosis. Connors (2010) and Solomon (2011) proposed
    historical classification frameworks combining an anti-tRNA-synthetase autoantibody
    with compatible clinical features. They should not be represented as universally
    accepted diagnostic criteria; the international CLASS project is developing
    data-driven classification criteria.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These criteria proposed that all patients with anti-synthetase syndrome must have
      evidence for a tRNA synthetase autoantibody, in addition to one or more of the
      following clinical features: mechanic’s hands, Raynaud’s phenomenon, myositis, ILD,
      arthritis, and/or unexplained fever
    explanation: >-
      Supports the components of the historical Connors proposal, not universal validation.
  - reference: PMID:39467037
    reference_title: "Clinical Characteristics of Anti-Synthetase Syndrome: Analysis From the Classification Criteria for Anti-Synthetase Syndrome Project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-synthetase syndrome (ASSD) is a rare systemic autoimmune
      rheumatic disease (SARD) with significant heterogeneity and no shared
      classification criteria.
    explanation: >-
      Establishes the current lack of shared validated classification criteria and the
      purpose of the international CLASS effort.
- name: High-Resolution Chest CT and Pulmonary Function Testing
  description: >-
    HRCT characterizes the ILD pattern (NSIP/OP/UIP); pulmonary function tests with DLCO
    assess restriction and diffusion and are used for serial monitoring.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis is made by a multidisciplinary
      approach, synthesizing rheumatology and pulmonary evaluations, along with
      serologic, radiographic, and occasionally muscle and/or lung biopsy results
    explanation: >-
      Supports the multidisciplinary, serologic/radiographic/biopsy-based diagnostic workup.
differential_diagnoses:
- name: Polymyositis and Dermatomyositis
  description: >-
    Other idiopathic inflammatory myopathies with which antisynthetase syndrome overlaps;
    historically these patients were diagnosed as PM or DM.
  distinguishing_features:
  - >-
    Antisynthetase syndrome is defined by anti-aminoacyl-tRNA synthetase antibodies and has
    a higher prevalence and severity of ILD than DM/PM.
  - >-
    It lacks the defining DM skin signs (heliotrope rash, Gottron papules) unless in overlap.
  - >-
    Muscle biopsy shows perimysial fragmentation/perifascicular necrosis distinct from DM
    perifascicular atrophy and PM endomysial CD8 invasion.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is a higher prevalence and increased severity
      of interstitial lung disease in patients with anti-synthetase syndrome, as
      compared to dermatomyositis and polymyositis
    explanation: >-
      Supports the ILD-predominance distinction from DM/PM.
- name: Idiopathic Interstitial Pneumonia (e.g., IPF / idiopathic NSIP)
  description: >-
    Antisynthetase-syndrome ILD can present as apparently idiopathic interstitial pneumonia
    before the autoimmune basis is recognized.
  distinguishing_features:
  - >-
    A myositis-antibody panel reveals an anti-synthetase antibody; in one retrospective
    analysis of 198 idiopathic interstitial pneumonia patients, 13 were later found to have
    an anti-synthetase antibody.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in a recent retrospective analysis of 198 patients with idiopathic interstitial
      pneumonia, 13 patients were later noted to have an anti-synthetase antibody
    explanation: >-
      Supports the need to differentiate antisynthetase ILD from idiopathic interstitial
      pneumonia by antibody testing.
epidemiology:
- name: Incidence and Prevalence
  description: >-
    A rare disease. In a US population-based cohort (Olmsted County, Minnesota, 1998-2019),
    the age- and sex-adjusted incidence was 0.56 per 100,000 and point prevalence 9.21 per
    100,000. No significant increase in malignancy risk was observed in this and another
    cohort.
  evidence:
  - reference: PMID:39814448
    reference_title: "Epidemiology of Antisynthetase Syndrome and Risk of Malignancy in a Population-Based Cohort (1998-2019)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age- and sex-adjusted
      incidence of ASS was 0.56 (95% CI 0.25-0.87) per 100,000 population.
    explanation: Supports the population-based incidence estimate.
  - reference: PMID:28339994
    reference_title: "A longitudinal cohort study of the anti-synthetase syndrome: increased severity of interstitial lung disease in black patients and patients with anti-PL7 and anti-PL12 autoantibodies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no
      significant increase in mortality or cancer risk in ASyS patients compared with
      the general US population.
    explanation: >-
      Supports the comparatively low malignancy/mortality risk relative to classic
      dermatomyositis.
progression:
- phase: Accrual of Manifestations and ILD-Driven Course
  notes: >-
    Adult-onset (peak 5th-6th decade), subacute-to-chronic and insidious; manifestations
    accrue over time from "incomplete" to "complete" syndrome. Course is chronic and
    relapsing, with ILD severity (especially fibrotic progression) determining prognosis.
    Phenotype and survival correlate with anti-ARS antibody specificity (worse with
    anti-PL-7/PL-12 than anti-Jo-1).
  evidence:
  - reference: PMID:22771754
    reference_title: "Hierarchical cluster and survival analyses of antisynthetase syndrome: phenotype and outcome are correlated with anti-tRNA synthetase antibody specificity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with ASS, the phenotype and the
      survival were correlated with the anti-ARS specificity.
    explanation: >-
      Supports antibody-specificity-dependent phenotype and survival.
  - reference: PMID:41376133
    reference_title: "Clinical profiles associated with rapidly progressive interstitial lung disease in antisynthetase syndrome: A multicentric cohort study (TYPASS study)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our study, 39% of patients had RP-ILD at ILD diagnosis.
    explanation: >-
      Supports a clinically important rapidly progressive ILD subgroup in a 132-patient
      multicenter ASyS-ILD cohort; it is not an all-ASyS frequency estimate.
animal_models:
- species: Mus musculus
  genotype: Wild-type C57BL/6 and NOD congenic mice immunized with murine Jo-1 protein
  description: >-
    Immunization with murine histidyl-tRNA synthetase generated Jo-1-specific adaptive
    immunity and combined muscle and lung inflammation. The inducible, anti-Jo-1-specific
    model supports antigen-directed pathogenicity but does not reproduce chronic human
    multisystem disease or non-Jo-1 subtypes.
  genes:
  - preferred_term: Hars1
    term:
      id: hgnc:4816
      label: HARS1
  associated_phenotypes:
  - Inflammatory Myositis
  - Interstitial Lung Disease
  evidence:
  - reference: PMID:17826948
    reference_title: "Species-specific immune responses generated by histidyl-tRNA synthetase immunization are associated with muscle and lung inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice immunized with murine Jo-1 develop a
      striking combination of muscle and lung inflammation that replicates features of
      the human anti-synthetase syndrome.
    explanation: >-
      Directly supports the combined muscle/lung phenotype after Jo-1 immunization.
clinical_trials:
- name: NCT03770663
  phase: PHASE_III
  status: UNKNOWN
  description: >-
    CATR.PAT is a registered 52-week randomized, controlled, open-label comparison of
    cyclophosphamide followed by azathioprine versus tacrolimus for first-line or relapsing
    antisynthetase-syndrome ILD. As of the 2026-08-05 audit, the registry status is unknown
    and no results are represented here; registration is not evidence of efficacy.
  target_phenotypes:
  - preferred_term: Interstitial lung disease
    term:
      id: HP:0006515
      label: Interstitial pneumonitis
  evidence:
  - reference: clinicaltrials:NCT03770663
    reference_title: "Cyclophosphamide and Azathioprine vs Tacrolimus in Antisynthetase Syndrome-related Interstitial Lung Disease : Multicentric Randomized Phase III Trial"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CATR.PAT study is a 52 weeks, randomized, comparative, controlled, open-labeled,
      phase III, therapeutic clinical trial, comparing two treatment strategies.
    explanation: >-
      Supports the registered design and comparison, not completion or treatment effect.
- name: NCT01276470
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Observational case-control research comparing pre-onset infectious and noninfectious
    environmental exposures among people with myositis with antisynthetase antibodies,
    other myositis, and healthy volunteers. The current registry listed recruiting at the
    2026-08-05 audit; no causal exposure result is asserted.
  evidence:
  - reference: clinicaltrials:NCT01276470
    reference_title: "Environmental Risk Factors for the Anti-Synthetase Syndrome"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To determine whether selected infectious and noninfectious environmental exposures are more common in individuals who have myositis with the anti-synthetase syndrome, compared with healthy volunteers.
    explanation: >-
      Supports the observational study objective, not any environmental causal claim.
discussions:
- discussion_id: asys_autoantibody_pathogenicity
  prompt: >-
    Which anti-aaRS antibodies are directly pathogenic in vivo, and through which
    antigen-, cell-, and organ-specific routes?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of Tolerance to Aminoacyl-tRNA Synthetases
  - pathophysiology#tRNA-Triggered Toll-Like Receptor and Interferon Amplification
  - pathophysiology#HARS Immune-Complex Activation of Alveolar Monocyte-Macrophages
  rationale: >-
    Reviews describe the antibody roles as unclear. The 2026 human multi-omics and in-vitro
    study strengthens a HARS immune-complex/macrophage route but is small and does not
    establish in-vivo causality or generalization across anti-aaRS specificities.
  evidence:
  - reference: PMID:36280495
    reference_title: "Mechanistic perspectives on anti-aminoacyl-tRNA synthetase syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although these autoantibodies are believed to play critical roles in
      ASSD pathogenesis, the nature of their roles remains unclear.
    explanation: The mechanistic review explicitly identifies the unresolved pathogenic role.
- discussion_id: asys_treatment_comparative_evidence
  prompt: >-
    Which immunosuppressive strategy provides the best benefit-risk profile for initial,
    progressive, and rapidly progressive antisynthetase-syndrome ILD?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#Rituximab
  - treatments#Cyclophosphamide
  - treatments#Tacrolimus
  rationale: >-
    Available outcome evidence is dominated by retrospective series and heterogeneous
    regimens. The registered CATR.PAT randomized comparison has unknown registry status
    and no represented results, so comparative efficacy remains unresolved.
  evidence:
  - reference: PMID:39083028
    reference_title: "Management and outcomes of interstitial lung disease associated with anti-synthetase syndrome: a systematic literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      found no conclusive difference between effectiveness of treatments. More robust
      trials are required to reduce morbidity and mortality resulting from ASS-ILD.
    explanation: The systematic review states the comparative-evidence limitation directly.
- discussion_id: asys_classification_criteria
  prompt: >-
    Which combination of serology and manifestations will yield validated, generalizable
    antisynthetase-syndrome classification criteria?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Anti-Aminoacyl-tRNA Synthetase Antibody Testing
  rationale: >-
    Connors and Solomon are historical proposals. The large international CLASS project
    has identified discriminating variables, but the cited publication does not present
    completed validated criteria.
  evidence:
  - reference: PMID:39467037
    reference_title: "Clinical Characteristics of Anti-Synthetase Syndrome: Analysis From the Classification Criteria for Anti-Synthetase Syndrome Project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-synthetase syndrome (ASSD) is a rare systemic autoimmune
      rheumatic disease (SARD) with significant heterogeneity and no shared
      classification criteria.
    explanation: Directly supports the open classification-criteria gap.

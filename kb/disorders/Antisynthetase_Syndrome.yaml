- name: HARS Immune-Complex Activation of Alveolar Monocyte-Macrophages
  description: >-
    In a small 2026 paired blood/BALF multi-omics study, inflammatory
    monocyte-macrophage populations were expanded in antisynthetase-syndrome ILD, and
    HARS-containing immune complexes activated primary human macrophages in vitro. This
    provides provisional, anti-Jo-1-specific support for an immune-complex-to-lung
    inflammation route; it does not establish that this mechanism explains other
    anti-synthetase specificities or clinical outcomes.

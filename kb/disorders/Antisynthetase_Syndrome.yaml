      HLA-DRB1*03:01 allele in anti-Jo-1 positive compared to anti-Jo-1 negative
      patients with ASSD was observed
    explanation: >-
      Supports the particularly strong HLA-DRB1*03:01 association with anti-Jo-1-positive
      disease.

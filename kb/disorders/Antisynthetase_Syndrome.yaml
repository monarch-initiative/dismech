- name: Tacrolimus
  description: >-
    Calcineurin inhibitor used as add-on therapy, particularly for more severe ILD; case
    series in antisynthetase-syndrome-ILD show improved lung function and reduced
    corticosteroid dose.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tacrolimus
      term:
        id: CHEBI:61049
        label: tacrolimus (anhydrous)
  target_mechanisms:
  - target: Autoantibody and Cytotoxic Immune Effector Production
    description: Calcineurin inhibition suppresses T-cell-driven autoimmune effector activity.
    evidence:
    - reference: PMID:27594777
      reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A 2005 case series specifically studied tacrolimus efficacy in 15 patients with
        anti-synthetase syndrome-ILD.
      explanation: Supports clinical use in the disease but not the mechanistic target assignment directly.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 2005 case series specifically studied tacrolimus efficacy in 15 patients with
      anti-synthetase syndrome-ILD. Most of these patients had Jo-1 autoantibodies, and
      experienced improvement in lung function and muscle symptoms
    explanation: >-
      Supports tacrolimus as an effective add-on for antisynthetase-syndrome-ILD.
- name: Rituximab
  description: >-
    Anti-CD20 monoclonal antibody depleting B cells; used for severe, progressive, or
    refractory ILD ("rescue therapy"), with case series showing FVC improvement.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Autoantibody and Cytotoxic Immune Effector Production
    description: B-cell depletion reduces autoantibody-producing plasma-cell precursors.
    evidence:
    - reference: PMID:27594777
      reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In the setting of anti-synthetase syndrome, we use rituximab for patients with severe progressive and/or refractory ILD"
      explanation: Supports disease use of a B-cell-directed agent, not direct measurement of the modeled mechanism.
  evidence:
  - reference: PMID:27594777
    reference_title: "The Diagnosis and Treatment of Antisynthetase Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the setting of anti-synthetase syndrome, we use rituximab for patients with severe
      progressive and/or refractory ILD
    explanation: >-
      Supports rituximab for severe progressive/refractory antisynthetase-syndrome ILD.
  - reference: PMID:39083028
    reference_title: "Management and outcomes of interstitial lung disease associated with anti-synthetase syndrome: a systematic literature review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients receiving rituximab had 12.2% improvement in FVC and 2.9%
      increase in DLco at 1 year; for patients receiving CYC, there was 17%
      improvement and 6.3% increase, respectively.
    explanation: >-
      Summarizes observed pulmonary-function improvement, while the review found no
      conclusive comparative treatment difference and called for robust trials.

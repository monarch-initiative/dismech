    snippet: >-
      Specific variables associated with ASSD included arthritis, diffuse myalgia,
      muscle weakness, muscle enzyme elevation, ILD, mechanic's hands, secondary
      pulmonary hypertension due to ILD, Raynaud phenomenon, and unexplained fever.
    explanation: >-
      Supports secondary pulmonary hypertension due to ILD in a large international
      case-control classification cohort.

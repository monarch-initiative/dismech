- name: Pulmonary Hypertension Secondary to ILD
  category: Cardiovascular
  description: >-
    Pulmonary hypertension can complicate chronic interstitial lung disease and is
    associated with poor prognosis. It should not be conflated with pulmonary arterial
    hypertension, which did not distinguish cases from mimics in the CLASS cohort.
  review_notes: >-
    No HPO term is bound because the available disease-specific evidence supports
    secondary pulmonary hypertension due to ILD, not the narrower pulmonary arterial
    hypertension term HP:0002092.

datasets:
- accession: geo:GSE330891
  title: Spatial and cell type specific molecular genetic investigations of inflammatory myopathies with selective perifascicular injury.
  description: Idiopathic inflammatory myopathies (IIM) are a heterogeneous group of systemic autoimmune disease often with multisystem involvement. Targeted therapy is still lacking. Efficient serum or histological markers to measure disease activity and predict disease course are missing. Perifascicular myofiber atrophy is a hall mark of dermatomyositis (DM). Despite decades of research, the mechanism of perifascicular atrophy is still incompletely understood. Across other IIM subtypes, perifascicular myofiber necrosis is also the hall mark pathology for antisynthetase syndrome associated myositis (ASyS)5, and can be seen in a subset of lupus myositis (LM).
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: SPATIAL_TRANSCRIPTOMICS
  sample_count: 301
  publication: PMID:42427858
  notes: Identified by GEO DataSets index search for Antisynthetase Syndrome (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

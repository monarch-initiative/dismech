animal_models:
- name: Systemic TNF-alpha challenge on a neurodegenerative background (ME7 prion mouse)
  species: Mouse
  genotype: ME7 prion-inoculated C57BL/6, challenged with intraperitoneal TNF-alpha
  publication: PMID:27633985
  description: >-
    The model that operationalizes vulnerability rather than the insult. An
    identical systemic cytokine challenge is given to normal mice and to mice
    with established prion neurodegeneration; only the latter show acute
    working-memory impairment, with higher hippocampal and hypothalamic
    cytokine transcription despite equivalent plasma TNF-alpha and CCL2. This
    is the vulnerability × precipitant model reduced to a single controlled
    experiment.
  evidence:
  - reference: PMID:27633985
    reference_title: Systemic TNF-α produces acute cognitive dysfunction and exaggerated sickness behavior when superimposed upon progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Systemic inflammation caused by infection, trauma or co-morbidity can alter
      the brain's inflammatory status, produce acute cognitive impairments, such as
      delirium, and drive new pathology and accelerated decline.
    explanation: >-
      States the delirium-relevant rationale that makes this model informative for
      the entry rather than a general neurodegeneration experiment.
  modeled_mechanisms:
  - target: Microglial Activation and Neuroinflammation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the conditional central inflammatory response — the same
      peripheral stimulus, a larger central response and an acute cognitive
      deficit only on the degenerating background.
    limitations: >-
      The cognitive readout is T-maze working memory, not the attentional
      disturbance that defines human delirium, and the background pathology is
      prion disease rather than the Alzheimer-type pathology that predisposes
      most human patients. The model also shows sickness behaviour that overlaps
      with, but is not, delirium.
    readouts:
    - name: T-maze working memory performance after systemic TNF-alpha
      target: Microglial Activation and Neuroinflammation
      direction: DECREASED
      interpretation: >-
        Acute cognitive impairment appearing only on the degenerating background
        is the model's operational stand-in for delirium.
      evidence:
      - reference: PMID:27633985
        reference_title: Systemic TNF-α produces acute cognitive dysfunction and exaggerated sickness behavior when superimposed upon progressive neurodegeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          TNF-α (50μg/kg) had no impact on performance of normal animals (normal
          brain homogenate; NBH) on working memory (T-maze) but produced acute
          impairments in ME7 animals similarly challenged.
        explanation: >-
          Reports the measurement and its direction, with the crucial negative
          control on the normal background.
    evidence:
    - reference: PMID:27633985
      reference_title: Systemic TNF-α produces acute cognitive dysfunction and exaggerated sickness behavior when superimposed upon progressive neurodegeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The data indicate that acutely elevated TNF-α has robust acute effects on
        brain function, selectively in the degenerating brain, but more sustained
        levels may be required to significantly impact on underlying
        neurodegeneration.
      explanation: >-
        The authors' own summary of the selectivity that makes this model
        informative for the vulnerability-conditional node.
- name: LPS-induced neuroinflammation and cognitive impairment in mice
  species: Mouse
  genotype: Wild-type C57BL/6J challenged with lipopolysaccharide
  publication: PMID:30962497
  description: >-
    The dominant experimental proxy for infection-triggered delirium.
    Lipopolysaccharide produces sickness behaviour with cognitive impairment
    alongside hippocampal microglial activation, neuronal loss, and a shift in
    the cytokine milieu — TNF-alpha, IL-1beta, PGE2 and nitric oxide up, IL-4
    and IL-10 down — with NF-kB pathway activation. The model earns its place
    in this entry because it is not merely descriptive: a TLR4-specific
    inhibitory peptide prevents both the neuroinflammation and the cognitive
    impairment, which makes the inflammatory step causal rather than
    correlated.
  evidence:
  - reference: PMID:30962497
    reference_title: Neuroinflammation induced by lipopolysaccharide causes cognitive impairment in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These data suggest that LPS induced cognitive impairment and
      neuroinflammation via microglia activation by activating the NF-kB signaling
      pathway
    explanation: >-
      The authors' mechanistic summary, which is the claim this model contributes
      to the entry's microglial node.
  modeled_mechanisms:
  - target: Microglial Activation and Neuroinflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the systemic-insult-to-microglial-activation step directly, with
      the hippocampal cellular and cytokine readouts that cannot be obtained in
      patients, and with a TLR4 blockade arm that establishes the direction of
      causation.
    limitations: >-
      The behavioural readouts are Morris water maze and passive avoidance —
      memory tasks, not measures of attention or awareness, which are what define
      human delirium. The LPS challenge is also an acute bolus in a healthy young
      animal, so the model speaks to the precipitant without the reduced-reserve
      substrate that the human syndrome requires; the ME7 models curated
      elsewhere in this entry supply that half.
    readouts:
    - name: Hippocampal microglial activation (IBA-1) and neuronal loss (MAP-2)
      target: Microglial Activation and Neuroinflammation
      direction: INCREASED
      interpretation: >-
        Microglial activation with concurrent neuronal loss in the hippocampus is
        the cellular signature this node asserts.
      evidence:
      - reference: PMID:30962497
        reference_title: Neuroinflammation induced by lipopolysaccharide causes cognitive impairment in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that LPS treatment leads to sickness behavior and cognitive
          impairment in mice as shown in the Morris water maze and passive
          avoidance test, and these effects were accompanied by microglia
          activation (labeled by ionized calcium binding adaptor molecule-1,
          IBA-1) and neuronal cell loss (labeled by microtubule-associated protein
          2, MAP-2) in the hippocampus.
        explanation: >-
          Reports the measurement, the markers used, and the accompanying
          behavioural change.
    - name: Cognitive impairment after TLR4 blockade
      target: Microglial Activation and Neuroinflammation
      direction: ABOLISHED
      interpretation: >-
        Preventing the deficit by blocking the receptor that initiates the
        inflammatory cascade is what makes the model causal rather than
        descriptive.
      evidence:
      - reference: PMID:30962497
        reference_title: Neuroinflammation induced by lipopolysaccharide causes cognitive impairment in mice.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Furthermore, VIPER, which is a TLR-4-specific inhibitory peptide,
          prevented the LPS-induced neuroinflammation and cognitive impairment.
        explanation: >-
          The rescue arm establishing that the inflammatory step is necessary for
          the cognitive deficit.
differential_diagnoses:
- name: Dementia
  description: >-
    The differential that matters most for the subacute presentation, because
    an insidious onset over days to weeks removes the abruptness that usually
    separates the two. Both produce inattention, disorientation, and memory
    impairment.
  distinguishing_features:
  - >-
    Delirium is distinguished by its acute change from a known baseline, its
    fluctuating course across the day, and disturbance of the level of
    consciousness — none of which characterize uncomplicated dementia.
    Establishing the patient's baseline from an informant is the decisive step,
    and dementia is itself the strongest predisposing factor, so the two
    frequently coexist as delirium superimposed on dementia.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To differentiate delirium from dementia, obtaining the history is critical to
      establish the patient's baseline, determine the acuity of mental status change
      and fluctuations typical of delirium, and to search for etiologic clues.
    explanation: >-
      States the distinguishing procedure and the features it turns on.
- name: Depression
  description: >-
    Hypoactive delirium — withdrawal, psychomotor slowing, reduced engagement —
    is readily mistaken for depression, particularly in an older inpatient with
    a depression history.
  distinguishing_features:
  - >-
    Depression does not produce the fluctuating inattention or the altered level
    of consciousness that define delirium, and lacks an acute precipitant on
    work-up. Formal cognitive testing that demonstrates inattention is the
    practical discriminator.
  evidence:
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      hypoactive delirium prevents participation in nursing interventions, physical
      therapy, and occupational therapy
    explanation: >-
      Describes the quiet, withdrawn presentation that generates the confusion
      with depression.
discussions:
- discussion_id: subacute_vs_acute_delirium_nosology
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does "subacute delirium" name anything mechanistically distinct from
    delirium with a protracted course, or is MONDO:0004629 purely a temporal
    qualifier?
  attaches_to:
  - pathophysiology#Protracted and Persistent Course
  rationale: >-
    ICD-10 F05 explicitly bundles "acute or subacute confusional state" under a
    single code, and no study identified during curation compares the
    pathophysiology of insidious-onset delirium with that of abrupt-onset
    delirium. The persistent-delirium literature quantifies how long delirium
    lasts, but persistence after an acute onset is not the same claim as an
    insidious onset. Until a study stratifies mechanism or biomarker by onset
    tempo, this entry curates the delirium pathograph with a temporal qualifier
    and does not assert a distinct mechanism.
- discussion_id: rodent_models_lack_attentional_readout
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do rodent inflammatory-challenge models reproduce the attentional
    disturbance that defines human delirium, or only the sickness behaviour and
    memory impairment that accompany it?
  attaches_to:
  - animal_models#Mouse
  rationale: >-
    The ME7/TNF-alpha model reproduces the conditional structure of delirium
    convincingly — the same insult, a deficit only on a vulnerable background —
    but its readout is T-maze working memory, and the accompanying phenotype is
    sickness behaviour (hypothermia, weight loss, inactivity). Inattention and
    disturbed awareness, the DSM-defining features, have no established rodent
    equivalent. Evidence therefore exists in the model, but its translational
    validity for the cardinal feature specifically remains open. This is a
    mismatch of readout, not an absence of data.
- discussion_id: apoe_mechanism_of_susceptibility
  kind: OPEN_QUESTION
  prompt: >-
    How does APOE genotype confer delirium risk independently of dementia — is
    it lipid transport and synaptic resilience, an amplified neuroinflammatory
    response, or something else?
  attaches_to:
  - genetic#APOE
  rationale: >-
    The multi-ancestry meta-analysis establishes the association and its
    independence from dementia, and the accompanying proteomics implicate brain
    vulnerability, inflammation and immune-response processes. But the step from
    APOE genotype to any node in this pathograph is not established: the entry
    draws no causal edge from APOE to the microglial or reserve nodes because
    none is evidenced. Resolving this would connect the strongest genetic signal
    in delirium to the mechanism the rest of the entry curates, and the
    druggability analysis in the same paper suggests it is being actively
    pursued.
notes: >-
  Scope. MONDO:0004629 is a course-qualified synonym of delirium rather than a
  separate disease, so this entry curates the delirium pathograph and treats
  "subacute" as a temporal qualifier on it, with a dedicated
  `Protracted and Persistent Course` node and an explicit knowledge-gap
  discussion. If dismech later curates delirium as a top-level entry, this
  entry should be reconciled with it rather than duplicated.

  Deliberate omissions, corrected. An earlier revision of this entry asserted
  that four claims could not be curated because their sources resolved only to
  journal or PMC URLs. That was wrong for three of them: the deep-research run's
  own reference validation had already cached the APOE GWAS (PMID:41286463), the
  S100B/NfL systematic review (PMID:40889075), and the 4D dexmedetomidine trial
  (PMID:41160116), and all three are now curated. The lesson is worth recording:
  check `references_cache/` before concluding a deep-research citation is
  unresolvable, because the validator fetches more than the report cites by
  identifier.

  What genuinely remains uncurated is the thalamic and caudate
  functional-connectivity finding, whose only cached record
  (DOI:10.1176/appi.ajp.2012.11060976) has `content_type: unavailable` and so
  offers no quotable text. It is a real lead and is not curated as evidenced
  content here.

mechanistic_hypotheses:
- hypothesis_group_id: vulnerability_precipitant_model
  hypothesis_label: Delirium as the product of baseline vulnerability multiplied by an acute precipitant
  status: CANONICAL
  description: >-
    The multifactorial model is the organizing framework for delirium and the
    one this entry's pathograph is built on: predisposing factors (age,
    dementia, frailty, sensory impairment) set the threshold, and precipitating
    insults (infection, surgery, drugs, metabolic derangement) cross it. Its
    strength is that it explains why a trivial insult suffices in one patient
    and a series of major ones is needed in another, and why single-target
    interventions fail while multicomponent ones work. Its weakness as a
    *mechanistic* model is that it is a risk architecture rather than a
    molecular pathway — it says which combinations produce delirium, not what
    the brain does when they do.
  evidence:
  - reference: PMID:29278283
    reference_title: 'Delirium pathophysiology: An updated hypothesis of the etiology of acute brain failure.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Available data suggest that numerous pathological factors may serve as
      precipitants for delirium, each having differential effects depending on
      patient-specific patient physiological characteristics (substrate).
    explanation: >-
      States the precipitant × substrate structure that this hypothesis group
      organizes the causal edges around.
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In view of the complex multifactorial causes of delirium, multicomponent
      non-pharmacological risk factor approaches are the most effective strategy
      for prevention.
    explanation: >-
      The therapeutic corollary of the model: because causation is multifactorial,
      the intervention that works is multicomponent rather than single-target.
- hypothesis_group_id: neuroinflammatory_model
  hypothesis_label: Peripheral inflammation reaching the CNS through a permeable blood-brain barrier
  status: CANONICAL
  description: >-
    The best-evidenced molecular account of how a systemic insult becomes a
    brain state. Peripheral pro-inflammatory signalling — IL-6 prominently —
    is associated with delirium risk before the insult and with delirium
    severity after it, and the same studies tie the CNS compartment of that
    signalling to measured blood-brain barrier permeability. Animal work adds
    the crucial conditional: the same cytokine challenge is cognitively inert
    in a normal brain and disabling in a degenerating one, which is the
    vulnerability × precipitant model expressed at the level of a single
    molecule.
  evidence:
  - reference: PMID:34218905
    reference_title: 'Preoperative inflammatory mediators and postoperative delirium: systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher preoperative interleukin-6 was associated with postoperative delirium
      with a standardised mean difference (95% confidence interval) of 0.33
      (0.11-0.56) and P=0.003.
    explanation: >-
      Quantifies the inflammation-delirium association in the direction the
      hypothesis requires — inflammatory tone before the insult predicts the
      syndrome after it.
  - reference: PMID:42011187
    reference_title: 'The association between cerebrospinal fluid interleukin-6, soluble interleukin-6 receptor, and interleukin-6 trans-signalling binary complex with postoperative delirium: an observational cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF sIL-6R was also significantly correlated with peripheral inflammation
      (plasma IL-6 and IL-8) and blood-brain barrier permeability (CSF:plasma
      albumin ratio and plasma S100B).
    explanation: >-
      Links the peripheral and central inflammatory compartments through a
      measured barrier-permeability index, which is the step this hypothesis
      turns on.
- hypothesis_group_id: cholinergic_dopaminergic_imbalance_model
  hypothesis_label: Relative cholinergic deficiency with dopaminergic excess
  status: ALTERNATIVE
  description: >-
    The oldest mechanistic account of delirium, motivated by the deliriogenic
    potency of anticholinergic and dopaminergic drugs. It is retained here as
    ALTERNATIVE rather than CANONICAL because its two strongest predictions
    have failed. Therapeutically, augmenting cholinergic transmission with
    rivastigmine did not shorten delirium in critically ill patients and the
    trial was stopped early for excess mortality in the treatment arm; and
    dopamine-receptor blockade with haloperidol or ziprasidone did not alter
    delirium duration against placebo. The neurotransmitter disturbance is
    real and is the best explanation for drug-precipitated delirium; what the
    negative trials refute is that correcting it downstream reverses the
    syndrome.
  evidence:
  - reference: PMID:21056464
    reference_title: 'Effect of rivastigmine as an adjunct to usual care with haloperidol on duration of delirium and mortality in critically ill patients: a multicentre, double-blind, placebo-controlled randomised trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired cholinergic neurotransmission seems to have an important role in
      the development of delirium.
    explanation: >-
      States the hypothesis as the trial's own rationale, which is what makes
      the trial's negative result a test of it rather than an unrelated finding.
  - reference: PMID:21056464
    reference_title: 'Effect of rivastigmine as an adjunct to usual care with haloperidol on duration of delirium and mortality in critically ill patients: a multicentre, double-blind, placebo-controlled randomised trial.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rivastigmine did not decrease duration of delirium and might have increased
      mortality so we do not recommend use of rivastigmine to treat delirium in
      critically ill patients.
    explanation: >-
      Refutes the therapeutic prediction of the cholinergic-deficiency model —
      restoring cholinergic tone neither shortened delirium nor was safe.
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of haloperidol or ziprasidone, as compared with placebo, in patients
      with acute respiratory failure or shock and hypoactive or hyperactive
      delirium in the ICU did not significantly alter the duration of delirium.
    explanation: >-
      Refutes the mirror-image therapeutic prediction — blocking the dopaminergic
      arm did not change the course of the syndrome.
- hypothesis_group_id: network_disconnection_model
  hypothesis_label: Loss of large-scale cortical feedback connectivity as the proximate substrate of inattention
  status: CANONICAL
  description: >-
    The circuit-level endpoint on which the other models converge: whatever the
    upstream insult, the delirious brain shows breakdown of the long-range
    connectivity that supports attention and predictive processing.
    Electrophysiological modelling localizes this to reduced feedback
    connectivity, with the reduction scaling with delirium severity and with
    systemic inflammation — which is what makes it a shared endpoint rather
    than a parallel story.
  evidence:
  - reference: PMID:37695013
    reference_title: Delirium is associated with loss of feedback cortical connectivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DCM showed that delirium was associated with decreased left-sided superior
      temporal gyrus (l-STG) to auditory cortex feedback connectivity.
    explanation: >-
      Direct electrophysiological evidence for the connectivity failure this
      node asserts.
  - reference: PMID:37695013
    reference_title: Delirium is associated with loss of feedback cortical connectivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Feedback connectivity also negatively correlated with delirium severity and
      systemic inflammation.
    explanation: >-
      Ties the circuit endpoint quantitatively to both the clinical severity and
      the inflammatory upstream, which is the link the model needs.
  - reference: PMID:29278283
    reference_title: 'Delirium pathophysiology: An updated hypothesis of the etiology of acute brain failure.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The specific cognitive and behavioral manifestations of the specific delirium
      picture result from a combination of neurotransmitter function and
      availability, variability in integration and processing of sensory
      information, motor responses to both external and internal cues, and the
      degree of breakdown in neuronal network connectivity, hence the term acute
      brain failure.
    explanation: >-
      Places network breakdown as the common final term that converts the
      upstream disturbances into the clinical picture.
pathophysiology:
- name: Reduced Cognitive Reserve
  biological_scale: ORGANISM
  description: >-
    The predisposing half of the model. Advanced age, dementia or milder
    cognitive impairment, frailty, sensory impairment, and comorbidity burden
    lower the insult required to produce delirium. This node is a state of the
    patient before any precipitant arrives; it does not itself produce
    delirium, and it is the reason the same drug dose is inert in one patient
    and deliriogenic in another.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it serves both as a marker of brain vulnerability with decreased reserve and
      as a potential mechanism for permanent cognitive damage
    explanation: >-
      States the reduced-reserve framing that this node represents, and — in the
      same breath — the injury arm curated downstream.
  - reference: PMID:39602991
    reference_title: 'Global incidence and prevalence of delirium and its risk factors in medically hospitalized older patients: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk factors of delirium included frailty (odds ratio = 2.05), physical
      restraints (5.01), prior falls (1.99), severe illness (1.32) (evaluated
      using the Acute Physiology and Chronic Health Evaluation II), and cognitive
      impairment (2.61).
    explanation: >-
      Quantifies the predisposing factors — frailty, prior falls, cognitive
      impairment — that constitute this node, alongside the iatrogenic
      precipitants curated under environmental.
  - reference: PMID:25239680
    reference_title: Worsening cognitive impairment and neurodegenerative pathology progressively increase risk for delirium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the Vantaa cohort, 465 persons (88.4 ± 2.8 years) completed MMSE at
      baseline. For every MMSE point lost, risk of incident delirium increased by
      5% (p = 0.02).
    explanation: >-
      Converts this node from a categorical risk factor into a graded one: risk
      scales continuously with pre-existing cognitive impairment rather than
      switching on at a dementia diagnosis.
  downstream:
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      A primed, aged, or degenerating brain mounts an exaggerated central
      response to the same peripheral signal, which is the best-supported
      cellular reading of "reduced reserve".
- name: Systemic Inflammatory Insult
  biological_scale: ORGANISM
  description: >-
    The precipitating half. Infection and sepsis, major surgery, trauma, and
    critical illness raise circulating pro-inflammatory mediators — IL-6, IL-8,
    TNF-alpha — and this peripheral signal is measurably associated with
    subsequent delirium. In the subacute presentation the insult is typically
    indolent (an occult infection, a slowly accumulating drug effect, a
    gradually worsening metabolic derangement) rather than abrupt, which is why
    the onset is measured in days.
  biological_processes:
  - preferred_term: cytokine-mediated signaling pathway
    term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    modifier: INCREASED
  evidence:
  - reference: PMID:34218905
    reference_title: 'Preoperative inflammatory mediators and postoperative delirium: systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher preoperative interleukin-6 was associated with postoperative delirium
      with a standardised mean difference (95% confidence interval) of 0.33
      (0.11-0.56) and P=0.003.
    explanation: >-
      Meta-analytic evidence that the systemic inflammatory state indexed by this
      node predicts the syndrome.
  downstream:
  - target: Blood-Brain Barrier Permeability Increase
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      Circulating cytokines act on cerebral endothelium; the resulting
      permeability change is measurable as a CSF:plasma albumin ratio that
      tracks central IL-6 receptor signalling.
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      Peripheral inflammatory signal reaches the CNS by humoral, endothelial,
      and vagal routes and converts primed microglia to an activated state.
- name: Blood-Brain Barrier Permeability Increase
  biological_scale: TISSUE
  description: >-
    The permissive step: an inflamed cerebral endothelium lets peripheral
    inflammatory signalling into the CNS compartment. It is curated as its own
    node because it is separately measurable in patients — the CSF:plasma
    albumin ratio and plasma S100B correlate with the CSF soluble IL-6 receptor
    that indexes central trans-signalling — rather than being inferred from the
    peripheral cytokine level alone.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: regulation of vascular permeability
    term:
      id: GO:0043114
      label: regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:42011187
    reference_title: 'The association between cerebrospinal fluid interleukin-6, soluble interleukin-6 receptor, and interleukin-6 trans-signalling binary complex with postoperative delirium: an observational cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF sIL-6R was also significantly correlated with peripheral inflammation
      (plasma IL-6 and IL-8) and blood-brain barrier permeability (CSF:plasma
      albumin ratio and plasma S100B).
    explanation: >-
      The measurement that makes this a curatable node rather than an assumed
      intermediate.
  downstream:
  - target: Microglial Activation and Neuroinflammation
    causal_link_type: DIRECT
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      Entry of peripheral mediators into the CNS compartment activates
      parenchymal microglia.
- name: Microglial Activation and Neuroinflammation
  biological_scale: CELLULAR
  description: >-
    Central amplification of the peripheral signal. Microglia switch from a
    surveillant to an activated phenotype and release IL-1beta, TNF-alpha, and
    other mediators locally; astrocytic activation accompanies it, and is
    reflected clinically in the S100B rise curated under biochemical. The
    conditional nature of this node is what distinguishes delirium from
    ordinary sickness behaviour: in animals, an identical systemic cytokine
    challenge leaves working memory intact on a normal background and impairs
    it acutely on a degenerating one.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:27633985
    reference_title: Systemic TNF-α produces acute cognitive dysfunction and exaggerated sickness behavior when superimposed upon progressive neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TNF-α (50μg/kg) had no impact on performance of normal animals (normal brain
      homogenate; NBH) on working memory (T-maze) but produced acute impairments
      in ME7 animals similarly challenged.
    explanation: >-
      Demonstrates the vulnerability-conditional central response that this node
      asserts, with the systemic stimulus held constant between groups.
  downstream:
  - target: Cholinergic-Dopaminergic Neurotransmitter Imbalance
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cholinergic_dopaminergic_imbalance_model
    description: >-
      Neuroinflammation is proposed to perturb cholinergic and dopaminergic
      transmission; the intermediates are not established in humans, and the
      edge is recorded at that strength rather than as a direct effect.
  - target: Cortical Feedback Connectivity Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    - network_disconnection_model
    description: >-
      The inflammatory and circuit accounts meet here: feedback connectivity
      falls as systemic inflammation rises, but the pathway from cytokine to
      connectivity is not resolved.
  - target: Neuronal and Astrocytic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      Sustained activation is the proposed route from a reversible state to the
      injury that underlies incomplete recovery.
- name: Cholinergic-Dopaminergic Neurotransmitter Imbalance
  biological_scale: MOLECULAR
  description: >-
    Relative cholinergic deficiency with dopaminergic excess is the classical
    proximate account, and it remains the best explanation for drug-precipitated
    delirium: anticholinergic and dopaminergic agents are among the most
    reliable precipitants, and their withdrawal is part of effective management.
    It is curated as a real node with a failed therapeutic corollary — neither
    cholinesterase inhibition nor dopamine-receptor blockade shortened delirium
    in randomized trials — so the imbalance should not be read as a validated
    drug target.
  biological_processes:
  - preferred_term: synaptic transmission, cholinergic
    term:
      id: GO:0007271
      label: synaptic transmission, cholinergic
    modifier: DECREASED
  evidence:
  - reference: PMID:21056464
    reference_title: 'Effect of rivastigmine as an adjunct to usual care with haloperidol on duration of delirium and mortality in critically ill patients: a multicentre, double-blind, placebo-controlled randomised trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Impaired cholinergic neurotransmission seems to have an important role in
      the development of delirium.
    explanation: >-
      Supports the existence of the cholinergic disturbance this node names,
      stated as the rationale of the trial that then failed to exploit it.
  downstream:
  - target: Cortical Feedback Connectivity Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - cholinergic_dopaminergic_imbalance_model
    description: >-
      Cholinergic tone gates cortical signal-to-noise and attention; the link to
      the measured connectivity failure is plausible but not established in
      humans.
- name: Cortical Feedback Connectivity Loss
  biological_scale: ORGANISM
  description: >-
    The circuit-level state of the delirious brain and the proximate substrate
    of its cardinal sign. Dynamic causal modelling of auditory evoked responses
    shows reduced top-down (feedback) connectivity during delirium, with
    increased intrinsic inhibitory tone in the same region; the reduction scales
    with delirium severity and with systemic inflammation. Framed predictively,
    the delirious cortex fails to impose top-down expectations on sensory
    input — which is what inattention, disorganized thinking, and perceptual
    disturbance look like from the inside.
  locations:
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  evidence:
  - reference: PMID:37695013
    reference_title: Delirium is associated with loss of feedback cortical connectivity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium is associated with decreased feedback cortical connectivity,
      possibly resulting from increased intrinsic inhibitory tone.
    explanation: >-
      The study's own summary of the connectivity state this node describes.
  downstream:
  - target: Protracted and Persistent Course
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - network_disconnection_model
    description: >-
      Whether failure of the network state to re-establish itself is what makes
      a delirium subacute or persistent is unresolved; the edge records the
      candidate relationship without asserting it.
- name: Neuronal and Astrocytic Injury
  biological_scale: CELLULAR
  description: >-
    The arm that makes delirium more than a transient state. Astrocytic (S100B)
    and axonal (neurofilament light) injury markers rise in association with
    delirium, and at the clinical level a longer duration of delirium predicts
    worse global cognition and executive function at 3 and 12 months, with
    delirium independently associated with long-term cognitive decline across
    studies. The direction of causation is not fully settled — delirium is at
    minimum a marker of a vulnerable brain — but the dose-response with
    delirium duration is what motivates curating injury as a distinct node.
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:24088092
    reference_title: Long-term cognitive impairment after critical illness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A longer duration of delirium was independently associated with worse global
      cognition at 3 and 12 months (P=0.001 and P=0.04, respectively) and worse
      executive function at 3 and 12 months (P=0.004 and P=0.007, respectively).
    explanation: >-
      The duration-response relationship that argues for delirium contributing to
      injury rather than only marking prior vulnerability.
  - reference: PMID:32658246
    reference_title: 'Association of Delirium With Long-term Cognitive Decline: A Meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was a significant association between delirium and long-term cognitive
      decline, as the estimated effect size (Hedges g) for 23 studies was 0.45
      (95% CI, 0.34-0.57; P < .001).
    explanation: >-
      Pooled magnitude of the long-term cognitive consequence attributed to this
      node.
  - reference: PMID:40889075
    reference_title: 'Serum biomarkers of delirium in critical illness: a systematic review of mechanistic and diagnostic evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among CNS injury markers, S100β and neurofilament light chain (NfL)
      demonstrated the most consistent associations with delirium presence and
      severity, supporting a role for astrocytic and axonal injury in delirium
      pathogenesis.
    explanation: >-
      The systematic review that identifies astrocytic and axonal injury markers
      as the most consistent biomarker signal — the molecular evidence for this
      node, and the reason it names both cell compartments.
  - reference: PMID:38566855
    reference_title: 'Serum NFL and tau, but not serum UCHL-1 and GFAP or CSF SNAP-25, NPTX2, or sTREM2, correlate with delirium in a 3-year retrospective analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The analysis of 71 patients with delirium, Alzheimer's disease (AD), and
      non-AD controls revealed that serum NFL levels are higher in delirium cases
      compared to both AD and non-AD.
    explanation: >-
      Separates delirium-associated neuroaxonal damage from that of the
      underlying dementia, which is the confound this node's causal claim has to
      survive.
- name: Protracted and Persistent Course
  biological_scale: ORGANISM
  description: >-
    The node that gives this entry its name. Where a classical delirium
    declares itself in hours and resolves with its precipitant, the subacute
    presentation evolves over days and often does not resolve on the expected
    timescale: among older hospital patients who become delirious, nearly half
    are still delirious at discharge and a fifth remain so at six months. Because the presentation is
    gradual and the deficits — inattention, disorientation, impaired memory —
    are the ones dementia also produces, the subacute form is preferentially
    misread as an evolving dementia rather than as an acute brain state with a
    treatable cause.
  evidence:
  - reference: PMID:19017678
    reference_title: 'Persistent delirium in older hospital patients: a systematic review of frequency and prognosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the combined proportions with PerD at discharge, 1, 3 and 6 months were 44.7%
      (95% CI 26.8%, 63.7%), 32.8% (95% CI 18.4%, 47.2%), 25.6% (95% CI 7.9%,
      43.4%) and 21% (95% CI 1.4%, 40.6%), respectively.
    explanation: >-
      Quantifies the protracted course this node stands for, at four follow-up
      points.
  - reference: PMID:19017678
    reference_title: 'Persistent delirium in older hospital patients: a systematic review of frequency and prognosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The outcomes (mortality, nursing home placement, function, cognition) of
      patients with PerD were consistently worse than the outcomes of patients who
      had recovered from delirium.
    explanation: >-
      Establishes that the protracted course is prognostically distinct, not just
      a longer version of the same illness.
  downstream:
  - target: Neuronal and Astrocytic Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - neuroinflammatory_model
    description: >-
      Duration of delirium is the exposure variable that predicts long-term
      cognitive outcome, so a protracted course is curated as feeding the injury
      node rather than merely coexisting with it.
phenotypes:
- category: Neurologic
  name: Inattention
  description: >-
    Reduced ability to direct, focus, sustain, and shift attention — the
    cardinal feature, and the one operationalized by every bedside instrument
    (digit span, months of the year backwards). It is also among the symptoms
    most likely to persist.
  phenotype_term:
    preferred_term: Inattention
    term:
      id: HP:0000736
      label: Short attention span
  notes: >-
    HPO has no term for the fluctuating, acquired inattention of delirium;
    `Short attention span` is the closest available concept and is used with a
    `preferred_term` of Inattention rather than manufacturing a narrower match.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key diagnostic features include an acute onset and fluctuating course of
      symptoms, inattention, impaired level of consciousness, and disturbance of
      cognition (e.g., disorientation, memory impairment, alteration in language).
    explanation: >-
      Lists inattention as a key diagnostic feature of the syndrome.
- category: Neurologic
  name: Delirium
  description: >-
    The syndrome itself, recorded as a phenotype so that the entry's disease
    concept is also expressible as an HPO annotation for downstream use.
  phenotype_term:
    preferred_term: Delirium
    term:
      id: HP:0031258
      label: Delirium
    temporality: SUBACUTE
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium is an acute disorder of attention and cognition in elderly people
      (ie, those aged 65 years or older) that is common, serious, costly,
      under-recognised, and often fatal.
    explanation: >-
      Definitional statement of the syndrome this phenotype records.
- category: Neurologic
  name: Confusion and disorientation
  description: >-
    Disorientation to time and place with a globally disorganized stream of
    thought, characteristically worse in the evening. In the subacute
    presentation it accumulates over days and is the feature most often
    attributed to dementia instead.
  phenotype_term:
    preferred_term: Confusion
    term:
      id: HP:0001289
      label: Confusion
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key diagnostic features include an acute onset and fluctuating course of
      symptoms, inattention, impaired level of consciousness, and disturbance of
      cognition (e.g., disorientation, memory impairment, alteration in language).
    explanation: >-
      Names disorientation among the cognitive disturbances that define the
      syndrome.
- category: Neurologic
  name: Memory impairment
  description: >-
    Impaired encoding and recall during the episode; with inattention and
    disorientation it is one of the features most likely to persist beyond the
    acute illness.
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Key diagnostic features include an acute onset and fluctuating course of
      symptoms, inattention, impaired level of consciousness, and disturbance of
      cognition (e.g., disorientation, memory impairment, alteration in language).
    explanation: >-
      Lists memory impairment among the defining cognitive disturbances.
- category: Behavioral
  name: Perceptual disturbance and hallucinations
  description: >-
    Illusions and hallucinations, typically visual, more prominent in the
    hyperactive presentation and often accompanied by delusional
    misinterpretation of the care environment.
  phenotype_term:
    preferred_term: Hallucinations
    term:
      id: HP:0000738
      label: Hallucinations
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Supportive features include disturbance in sleep-wake cycle, perceptual
      disturbances (hallucinations or illusions), delusions, psychomotor
      disturbance (hypo- or hyper-activity), inappropriate behavior, and emotional
      lability.
    explanation: >-
      Names perceptual disturbance and hallucinations as recognized supportive
      features of delirium.
- category: Behavioral
  name: Psychomotor agitation
  description: >-
    Restlessness and agitation with pulling at lines and catheters — the
    hyperactive presentation. It is the most visible form and therefore the
    most reliably detected, though it is not the most common in critical
    illness.
  phenotype_term:
    preferred_term: Agitation
    term:
      id: HP:0000713
      label: Agitation
  evidence:
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium developed in 566 patients (48%), of whom 89% had hypoactive delirium
      and 11% had hyperactive delirium.
    explanation: >-
      Ascertains both motor presentations in a defined cohort and gives their
      relative frequency in critical illness.
- category: Behavioral
  name: Hypoactive presentation with apathy and lethargy
  description: >-
    Withdrawal, reduced spontaneous movement, and lethargy. In critically ill
    patients this is by far the dominant form — 89% of delirious patients in
    the MIND-USA cohort — and it is the form most often missed, because a quiet
    patient does not prompt assessment.
  phenotype_term:
    preferred_term: Apathy
    term:
      id: HP:0000741
      label: Apathy
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium developed in 566 patients (48%), of whom 89% had hypoactive delirium
      and 11% had hyperactive delirium.
    explanation: >-
      Supports both the predominance of the hypoactive presentation and the
      VERY_FREQUENT band assigned here, within an ICU population.
- category: Neurologic
  name: Sleep-wake cycle disturbance
  description: >-
    Fragmented nocturnal sleep with daytime somnolence, often to the point of
    day-night reversal; the circadian component is one of the five core domains
    in contemporary syntheses of delirium's phenomenology.
  phenotype_term:
    preferred_term: Sleep-wake cycle disturbance
    term:
      id: HP:0006979
      label: Sleep-wake cycle disturbance
  evidence:
  - reference: PMID:29278283
    reference_title: 'Delirium pathophysiology: An updated hypothesis of the etiology of acute brain failure.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium is the most common neuropsychiatric syndrome encountered by
      clinicians dealing with older adults and the medically ill and is best
      characterized by 5 core domains: cognitive deficits, attentional deficits,
      circadian rhythm dysregulation, emotional dysregulation, and alteration in
      psychomotor functioning.
    explanation: >-
      Establishes circadian rhythm dysregulation as one of the five core domains
      of the syndrome.
biochemical:
- name: Serum S100B
  notes: >-
    Calcium-binding protein released by astrocytes; elevated concentrations
    accompany delirium and, in the perioperative setting, correlate with the
    central IL-6 receptor signalling and blood-brain barrier permeability
    curated in the pathograph. It is a research marker, not a diagnostic test.
  biomarker_term:
    preferred_term: S100B
    term:
      id: NCIT:C98129
      label: Protein S100-B
  evidence:
  - reference: PMID:42011187
    reference_title: 'The association between cerebrospinal fluid interleukin-6, soluble interleukin-6 receptor, and interleukin-6 trans-signalling binary complex with postoperative delirium: an observational cohort study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CSF sIL-6R was also significantly correlated with peripheral inflammation
      (plasma IL-6 and IL-8) and blood-brain barrier permeability (CSF:plasma
      albumin ratio and plasma S100B).
    explanation: >-
      Uses plasma S100B as one of the two indices of barrier permeability,
      which is the role this marker plays in the entry.
  - reference: PMID:40889075
    reference_title: 'Serum biomarkers of delirium in critical illness: a systematic review of mechanistic and diagnostic evidence.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among CNS injury markers, S100β and neurofilament light chain (NfL)
      demonstrated the most consistent associations with delirium presence and
      severity, supporting a role for astrocytic and axonal injury in delirium
      pathogenesis.
    explanation: >-
      Establishes S100B as one of the two most consistent CNS-injury markers
      across the critical-illness literature.
  - reference: PMID:40889075
    reference_title: 'Serum biomarkers of delirium in critical illness: a systematic review of mechanistic and diagnostic evidence.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite early promise, serum biomarkers for ICU delirium remain
      investigational and require further validation before clinical application.
    explanation: >-
      Bounds the claim: this is a research marker, not a diagnostic test, which
      is how the entry curates it.
- name: Preoperative interleukin-6
  notes: >-
    Circulating IL-6 measured before surgery is higher in patients who go on to
    develop postoperative delirium, making it the best-supported peripheral
    inflammatory predictor. The effect is modest and mediator- and
    surgery-specific, so it is curated as a risk marker rather than a test.
  biomarker_term:
    preferred_term: Interleukin-6
    term:
      id: NCIT:C20451
      label: Interleukin-6
  evidence:
  - reference: PMID:34218905
    reference_title: 'Preoperative inflammatory mediators and postoperative delirium: systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Higher preoperative interleukin-6 was associated with postoperative delirium
      with a standardised mean difference (95% confidence interval) of 0.33
      (0.11-0.56) and P=0.003.
    explanation: >-
      The pooled estimate that supports IL-6 as a pre-insult risk marker.
  - reference: PMID:34218905
    reference_title: 'Preoperative inflammatory mediators and postoperative delirium: systematic review and meta-analysis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The association of preoperative blood levels of inflammatory mediators with
      postoperative delirium may be influenced by the type of surgery and the
      specific mediator.
    explanation: >-
      Qualifies the marker: the association is conditional on context, which is
      why it is not curated as diagnostic.
genetic:
- name: APOE
  notes: >-
    APOE is the most consistently reported common-variant susceptibility locus
    for delirium, acting as a modifier of vulnerability rather than a cause:
    no APOE genotype produces delirium without a precipitant, and no delirium
    requires one. It is curated as SUSCEPTIBILITY for that reason. The same
    meta-analysis reports a multi-trait analysis with Alzheimer disease
    identifying five delirium risk loci and plasma proteins predicting incident
    delirium up to sixteen years ahead — the proteomic counterpart of the
    reduced-reserve node curated in the pathograph. Earlier candidate
    associations at the muscarinic receptor genes CHRM2 and CHRM4 are
    deliberately not curated: they are not among the loci reported by that
    meta-analysis.
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:41286463
    reference_title: Dissecting the genetic and proteomic risk factors for delirium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we conducted a genetic meta-analysis on delirium using multi-ancestry
      data from the UK Biobank, FinnGen, All of Us Research Program and Michigan
      Genomics Initiative cohorts (n = 1,059,130; 11,931 cases), yielding the
      Apolipoprotein E (APOE) gene as a strong delirium risk factor independently
      of dementia.
    explanation: >-
      The multi-ancestry meta-analysis establishing APOE as a delirium risk locus,
      and — crucially for the SUSCEPTIBILITY classification — independently of
      dementia rather than through it.
  - reference: PMID:41286463
    reference_title: Dissecting the genetic and proteomic risk factors for delirium.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combining proteins, APOE-ε4 status and demographics significantly improved
      incident delirium prediction compared to demographics alone.
    explanation: >-
      Shows the association is large enough to add predictive information, which
      is what distinguishes a susceptibility locus from an incidental signal.
environmental:
- name: Physical restraint use
  description: >-
    Physical restraints carry the largest odds ratio of any risk factor in the
    contemporary meta-analysis of hospitalized older patients, and are
    iatrogenic and modifiable. The direction of causation is not fully
    separable from confounding by indication — agitated patients get
    restrained — but restraint use is also a component that multicomponent
    prevention programs deliberately remove.
  effect: Increases risk of delirium in hospitalized older patients
  influences_mechanisms:
  - target: Reduced Cognitive Reserve
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Restraint enforces immobility and sensory-environmental deprivation,
      compounding the predisposing state rather than acting as an inflammatory
      precipitant.
    evidence:
    - reference: PMID:39602991
      reference_title: 'Global incidence and prevalence of delirium and its risk factors in medically hospitalized older patients: A systematic review and meta-analysis.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The risk factors of delirium included frailty (odds ratio = 2.05), physical
        restraints (5.01), prior falls (1.99), severe illness (1.32) (evaluated
        using the Acute Physiology and Chronic Health Evaluation II), and cognitive
        impairment (2.61).
      explanation: >-
        Gives the restraint-associated odds ratio in the pooled analysis this
        link rests on.
  evidence:
  - reference: PMID:39602991
    reference_title: 'Global incidence and prevalence of delirium and its risk factors in medically hospitalized older patients: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk factors of delirium included frailty (odds ratio = 2.05), physical
      restraints (5.01), prior falls (1.99), severe illness (1.32) (evaluated
      using the Acute Physiology and Chronic Health Evaluation II), and cognitive
      impairment (2.61).
    explanation: >-
      Establishes restraint use as an independently reported risk factor with the
      largest pooled odds ratio in this analysis.
- name: Deliriogenic medication exposure
  description: >-
    Anticholinergic drugs, benzodiazepines, and opioids are among the most
    reliable precipitants, and the classic demonstration of the vulnerability
    model is that a single dose of a sedative can precipitate delirium in a
    patient with dementia and multimorbidity. Reduction of sedative and
    analgesic burden is a recommended management step.
  effect: Precipitates delirium, particularly in patients with reduced cognitive reserve
  influences_mechanisms:
  - target: Cholinergic-Dopaminergic Neurotransmitter Imbalance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Anticholinergic and dopaminergic agents act directly on the transmitter
      systems this node describes, which is the strongest evidence that the
      imbalance is mechanistically real even though correcting it downstream
      does not treat the syndrome.
    evidence:
    - reference: PMID:23992774
      reference_title: Delirium in elderly people.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The list of potential neurotransmitters involved in delirium is long,60 but
        a relative cholinergic deficiency and/or dopamine excess are the most
        commonly inferred,61, 62 correlating with the adverse effects of
        anticholinergic or dopaminergic drugs.
      explanation: >-
        States the drug-effect reasoning that links this exposure to the
        transmitter node.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Drug reduction for sedation and analgesia and non-pharmacological approaches
      are recommended.
    explanation: >-
      The management recommendation that follows from treating these agents as
      modifiable precipitants.
prevalence:
- population: Medically hospitalized older patients
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 23600.0
  rate_low: 19000.0
  rate_high: 29000.0
  notes: >-
    Pooled prevalence 23.6% (95% CI 19%-29%) across 35 studies and 12,097
    participants. Reported alongside a pooled incidence of 13.5%, which is a
    different measure and is not combined with it here.
  evidence:
  - reference: PMID:39602991
    reference_title: 'Global incidence and prevalence of delirium and its risk factors in medically hospitalized older patients: A systematic review and meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 35 studies encompassing 12,097 participants met the inclusion
      criteria, yielding a 23.6 % pooled prevalence of delirium (95 % confidence
      interval = 19 % to 29 %) and a 13.5 % pooled incidence of delirium (n = 32,
      95 % confidence interval = 11 % to 17 %) among medically hospitalized older
      patients.
    explanation: >-
      Source of both the pooled prevalence recorded here and the incidence noted
      for contrast.
progression:
- phase: Persistence at hospital discharge
  notes: >-
    44.7% of older hospital patients with delirium were still delirious at
    discharge (95% CI 26.8%-63.7%).
  evidence:
  - reference: PMID:19017678
    reference_title: 'Persistent delirium in older hospital patients: a systematic review of frequency and prognosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the combined proportions with PerD at discharge, 1, 3 and 6 months were 44.7%
      (95% CI 26.8%, 63.7%), 32.8% (95% CI 18.4%, 47.2%), 25.6% (95% CI 7.9%,
      43.4%) and 21% (95% CI 1.4%, 40.6%), respectively.
    explanation: >-
      Reports the discharge-time persistence proportion recorded in this phase.
- phase: Persistence at six months
  notes: >-
    21% remained delirious at six months (95% CI 1.4%-40.6%); the wide interval
    reflects heterogeneity across the 18 pooled reports.
  evidence:
  - reference: PMID:19017678
    reference_title: 'Persistent delirium in older hospital patients: a systematic review of frequency and prognosis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the combined proportions with PerD at discharge, 1, 3 and 6 months were 44.7%
      (95% CI 26.8%, 63.7%), 32.8% (95% CI 18.4%, 47.2%), 25.6% (95% CI 7.9%,
      43.4%) and 21% (95% CI 1.4%, 40.6%), respectively.
    explanation: >-
      Reports the six-month persistence proportion recorded in this phase.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Delirium is common in hospitalized older adults, is independently
    associated with mortality, and — in the protracted form this entry
    centres on — persists in a substantial minority for months and carries
    consistently worse mortality, institutionalization, function, and
    cognition than a delirium that resolves. It is additionally associated
    with long-term cognitive decline of moderate effect size.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium is an acute disorder of attention and cognition in elderly people
      (ie, those aged 65 years or older) that is common, serious, costly,
      under-recognised, and often fatal.
    explanation: >-
      Summary statement of the burden this assessment records.
  - reference: PMID:32658246
    reference_title: 'Association of Delirium With Long-term Cognitive Decline: A Meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this meta-analysis, delirium was significantly associated with long-term
      cognitive decline in both surgical and nonsurgical patients.
    explanation: >-
      Supports the long-term component of the burden assessment.
diagnosis:
- name: Confusion Assessment Method (CAM)
  description: >-
    The standard bedside instrument, structured around acute onset with a
    fluctuating course plus inattention, and either disorganized thinking or an
    altered level of consciousness. Its ICU adaptation, the CAM-ICU, is what
    ascertains delirium in ventilated patients who cannot be interviewed, and
    is the instrument used in the major critical-care trials curated here.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      validated in high quality studies including over 1000 patients with
      sensitivity of 94%, specificity of 89%, and high inter-rater reliability.
    explanation: >-
      Reports the CAM's validated operating characteristics in the sentence that
      names it the most widely used instrument for identifying delirium.
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      delirium was detected with the use of the Confusion Assessment Method for the
      ICU (CAM-ICU),23,24 a validated tool that identifies delirium on the basis of
      an acute change or fluctuating course of mental status plus inattention and
      either altered level of consciousness or disorganized thinking
    explanation: >-
      Describes the ICU adaptation and its operational criteria as applied in a
      definitive trial.
- name: Search for the precipitating cause
  description: >-
    There is no diagnostic test for delirium itself; the diagnostic work is
    identifying what precipitated it. Because delirium can be the presenting
    feature of a medical emergency, screening for acute physiological
    disturbance — hypoxaemia, hypoglycaemia, hypercapnia — precedes any
    elaborate work-up, and testing is targeted by history and examination
    rather than run as a battery.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First, because delirium can be the harbinger of a medical emergency, every
      patient presenting with delirium should be screened for acute physiologic
      disturbance such as hypoxemia, low blood glucose, and high arterial carbon
      dioxide.
    explanation: >-
      States the priority and the specific targets of the initial diagnostic
      screen.
treatments:
- name: Multicomponent non-pharmacological delirium prevention
  description: >-
    The Hospital Elder Life Program and its descendants apply standardized
    protocols to six modifiable risk factors — cognitive impairment, sleep
    deprivation, immobility, visual impairment, hearing impairment, and
    dehydration. In the original controlled study delirium developed in 9.9%
    of the intervention group versus 15.0% of usual care, and pooled across
    subsequent studies the odds of incident delirium fall by roughly half. It
    is the only intervention with a consistent effect on incidence, and it is
    mechanistically a treatment of the predisposing node rather than of any
    molecular target — which is exactly what the multifactorial model predicts
    would work.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Reduced Cognitive Reserve
    treatment_effect: MODULATES
    description: >-
      Each protocol component removes one of the predisposing or perpetuating
      factors that constitute this node — immobility, sensory deprivation,
      dehydration, sleep loss — rather than acting on the inflammatory or
      neurotransmitter arms.
    evidence:
    - reference: PMID:10053175
      reference_title: A multicomponent intervention to prevent delirium in hospitalized older patients.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The intervention consisted of standardized protocols for the management of
        six risk factors for delirium: cognitive impairment, sleep deprivation,
        immobility, visual impairment, hearing impairment, and dehydration.
      explanation: >-
        Enumerates the targets of the intervention, which are the constituents of
        the node it is linked to.
  evidence:
  - reference: PMID:10053175
    reference_title: A multicomponent intervention to prevent delirium in hospitalized older patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delirium developed in 9.9 percent of the intervention group as compared with
      15.0 percent of the usual-care group, (matched odds ratio, 0.60; 95 percent
      confidence interval, 0.39 to 0.92).
    explanation: >-
      The controlled effect estimate on incident delirium from the defining study.
  - reference: PMID:25643002
    reference_title: 'Effectiveness of multicomponent nonpharmacological delirium interventions: a meta-analysis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 11 studies demonstrated significant reductions in delirium incidence
      (odds ratio [OR], 0.47; 95% CI, 0.38-0.58).
    explanation: >-
      Pooled effect across studies, establishing that the original result
      generalizes.
  - reference: PMID:10053175
    reference_title: A multicomponent intervention to prevent delirium in hospitalized older patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The intervention had no significant effect on the severity of delirium or on
      recurrence rates; this finding suggests that primary prevention of delirium
      is probably the most effective treatment strategy.
    explanation: >-
      Bounds the claim: the effect is on incidence, not on the severity or
      recurrence of an episode that has already begun.
- name: Treatment of the precipitating illness and withdrawal of deliriogenic drugs
  description: >-
    The mainstay of management of established delirium. No agent has been shown
    to shorten delirium in an unselected critically ill population — the
    antipsychotic and cholinesterase-inhibitor trials curated here are both
    negative — so treatment consists of identifying and correcting the
    precipitant, reducing sedative and analgesic burden, and applying the same
    non-pharmacological measures used in prevention. Dexmedetomidine is the
    exception that defines the rule: it benefited the specific population of
    non-intubated patients with hyperactive delirium, and is curated separately
    below.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Systemic Inflammatory Insult
    treatment_effect: INHIBITS
    description: >-
      Resolving the infection, metabolic derangement, or surgical stress removes
      the precipitating insult at its source, which is the only intervention
      that acts on this node.
    evidence:
    - reference: PMID:23992774
      reference_title: Delirium in elderly people.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The initial management focuses on three simultaneous priorities: (1)
        maintaining patient safety; (2) searching for the causes; and (3) managing
        delirium symptoms.
      explanation: >-
        Places the search for and treatment of the cause at the centre of
        management, which is what this link asserts.
  evidence:
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Drug reduction for sedation and analgesia and non-pharmacological approaches
      are recommended.
    explanation: >-
      The recommended management strategy that this treatment entry records.
- name: Antipsychotics for severe agitation
  description: >-
    Haloperidol and atypical antipsychotics remain in use for the behavioural
    control of severe agitation that threatens patient or staff safety. They
    are curated here with the evidence that constrains them: in a
    placebo-controlled trial of 566 delirious critically ill patients, neither
    haloperidol nor ziprasidone altered the number of days alive without
    delirium or coma. They are symptomatic agents, not disease-modifying ones,
    and the entry deliberately does not link them to a mechanism node.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: haloperidol
      term:
        id: CHEBI:5613
        label: haloperidol
  evidence:
  - reference: PMID:30346242
    reference_title: Haloperidol and Ziprasidone for Treatment of Delirium in Critical Illness.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of haloperidol or ziprasidone, as compared with placebo, in patients
      with acute respiratory failure or shock and hypoactive or hyperactive
      delirium in the ICU did not significantly alter the duration of delirium.
    explanation: >-
      Refutes any duration-modifying claim for antipsychotics in delirium, which
      is why this treatment is curated as symptomatic only.
  - reference: PMID:23992774
    reference_title: Delirium in elderly people.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No convincing evidence shows that pharmacological prevention or treatment is
      effective.
    explanation: >-
      The general statement of the evidence position this treatment entry is
      curated against.
- name: Dexmedetomidine for hyperactive delirium in non-intubated ICU patients
  description: >-
    An alpha-2 adrenergic agonist, and the one pharmacological agent in this
    entry with a positive randomized result. In a multicentre, double-blind,
    placebo-controlled trial across nine ICUs, non-intubated critically ill
    adults with hyperactive delirium randomized to dexmedetomidine did better
    than placebo on a joint model of agitation duration, delirium duration, and
    the need for intubation and deep sedation; the trial was stopped for
    efficacy at the preplanned interim analysis. The effect is real but should
    not be overread: the median reduction in agitation was about an hour, the
    other key secondary outcomes were similar between groups, and the
    population is a specific one — non-intubated patients with the hyperactive
    presentation, which is the minority form in critical illness.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexmedetomidine
      term:
        id: CHEBI:4466
        label: dexmedetomidine
  evidence:
  - reference: PMID:41160116
    reference_title: 'Dexmedetomidine for treatment of hyperactive delirium in non-intubated ICU patients: the 4D randomized clinical trial.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In non-intubated adult ICU patients with hyperactive delirium, the use of
      dexmedetomidine was associated with a greater clinical benefit than placebo
      for the joint modelling of multiple endpoints of agitation control, delirium
      resolution, and intubation with mechanical ventilation.
    explanation: >-
      The randomized result establishing benefit in the specified population and
      on the specified composite endpoint.
  - reference: PMID:41160116
    reference_title: 'Dexmedetomidine for treatment of hyperactive delirium in non-intubated ICU patients: the 4D randomized clinical trial.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agitation duration was shorter in the dexmedetomidine group (1.0 (1.0-2.0)
      vs 2.0 (1.0-7.0) hours, absolute difference 95% CI - 1.0 (- 2.0 to - 0.1);
      ES, - 0.60; 95% CI, -0.92 to -0.27, p = 0.001). Other key secondary outcomes
      were similar between groups.
    explanation: >-
      Bounds the claim with the effect size and the neutral secondary outcomes,
      which is why this entry does not present dexmedetomidine as
      disease-modifying.

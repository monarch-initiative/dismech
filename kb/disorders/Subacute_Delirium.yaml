name: Subacute Delirium
creation_date: '2026-08-25T00:00:00Z'
category: Neurologic
synonyms:
- subacute confusional state
- subacute brain syndrome
- subacute psycho-organic syndrome
- delirium, subacute
description: >-
  Subacute delirium is delirium — an acute disturbance of attention and
  awareness with an additional cognitive disturbance, developing over a short
  period and fluctuating in severity across the day — in which the onset is
  insidious (days to a week or two rather than hours) and the course is
  protracted. It is not a mechanistically distinct disease: MONDO:0004629 sits
  in the same concept space as ICD-10 F05, whose inclusion terms are explicitly
  "acute or subacute confusional state", "acute or subacute brain syndrome",
  and "acute or subacute psycho-organic syndrome". This entry therefore curates
  the delirium pathograph and treats "subacute" as the temporal qualifier on
  that pathograph — the presentation that is most easily mistaken for evolving
  dementia and that shades into the persistent delirium recorded under
  `progression`.

  The mechanism is convergent rather than linear. A predisposed brain — aged,
  demented, frail, or otherwise reduced in reserve — meets a precipitant
  (systemic infection, surgery, metabolic derangement, hypoxia, or a
  deliriogenic drug). Peripheral inflammatory signalling reaches the CNS,
  in part through an increasingly permeable blood-brain barrier, activating
  microglia; neurotransmitter systems (classically a relative cholinergic
  deficiency with dopaminergic excess) are perturbed; and large-scale cortical
  networks lose the feedback connectivity that supports attention and
  perceptual inference. Because the vulnerability and the insult multiply
  rather than add, a trivial insult suffices in a vulnerable patient and no
  single node is the disease.

  Two facts discipline the entry. First, the causal-therapeutic translation of
  the neurotransmitter model has failed: cholinesterase inhibition did not
  shorten delirium and signalled harm, and antipsychotics did not alter its
  duration in a definitive placebo-controlled trial — though dexmedetomidine
  did benefit the narrower population of non-intubated patients with
  hyperactive delirium, so the nihilism is about mechanism-directed drugs
  rather than about pharmacotherapy as such. Second, delirium is not
  the benign, fully reversible state it was long taken to be — a substantial
  minority remain delirious months later, and delirium is independently
  associated with long-term cognitive decline. Prevention by multicomponent
  non-pharmacological programs remains the only intervention with consistent
  effect on incidence.

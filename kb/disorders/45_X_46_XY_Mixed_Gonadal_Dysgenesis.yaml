progression:
- phase: Childhood growth decline
  notes: Height standard-deviation scores decreased with age in a retrospective 100-patient mosaicism cohort. Individual growth trajectories vary and warrant serial measurement.
  evidence:
  - reference: PMID:37882230
    reference_title: '45,X/46,XY mosaicism: Clinical manifestations and long term follow-up.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: height Z-score was significantly decreased with age for both genders (p = 0.02)
    explanation: Documents the progressive height deficit.
    quote_role: PRIMARY_RESULT
- phase: Pubertal and post-pubertal gonadal decline
  notes: Spontaneous pubertal onset is common in individuals raised male who retain functioning testes, but later Sertoli or Leydig dysfunction can occur. In a 63-person multicenter male cohort, 80% entered puberty spontaneously; a separate mild-genital-phenotype series found impaired Sertoli markers in five of seven evaluated at the end of puberty. These selected cohorts do not imply inevitable pubertal arrest.
  evidence:
  - reference: PMID:31127831
    reference_title: Clinical but Not Histological Outcomes in Males With 45,X/46,XY Mosaicism Vary Depending on Reason for Diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Eighty percent of all patients experienced spontaneous pubertal onset, significantly more in the nongenital group (P = 0.023).
    explanation: The study included 63 males older than 13 years, with different reasons for initial diagnosis.
  - reference: PMID:29973376
    reference_title: Should 45,X/46,XY boys with no or mild anomaly of external genitalia be investigated and followed up?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: puberty occurred spontaneously in 93% of patients but 71% (n = 5) of those evaluated at the end of puberty presented signs of declined Sertoli cell function (low inhibin B levels and increased FSH levels).
    explanation: The endocrine-decline denominator is the small subset evaluated at the end of puberty, not all 40 participants.
- phase: Adult cardiometabolic morbidity
  notes: A Danish registry study of 135 diagnosed males with 45,X/46,XY mosaicism found increased morbidity across multiple diagnostic groups compared with 13,500 age-matched controls. This supports lifelong follow-up; it does not establish a fixed age of onset for each associated disorder or apply specifically to every classic MGD phenotype.
  evidence:
  - reference: PMID:39775857
    reference_title: 'Morbidity in Males With 45,X/46,XY Resembles the Morbidity Pattern in Turner Syndrome: A National Population-Based Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Diagnoses with increased HRs included diabetes, thyroid disorders, obesity, hypertension, ischemic heart disease, osteoporosis, and inflammatory bowel disease.
    explanation: Registry associations describe the broader male mosaic population; they do not establish a single causal pathway or onset at age 40.
pathophysiology:
- name: Post-Zygotic Loss of the Y Chromosome
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: Early post-zygotic Y-chromosome loss, for example through mitotic anaphase lag, can generate a 45,X lineage alongside Y-bearing cells. Structural Y abnormalities may also be involved. The resulting mosaicism is a chromosomal event, with variable distribution among tissues.
  evidence:
  - reference: PMID:34566299
    reference_title: Clinical and Reproductive Characteristics of Patients with Mixed Gonadal Dysgenesis (45,X/46, XY).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: MGD arises due to late anaphase lag during mitosis in the zygote, although Y chromosomal abnormalities are sometimes seen and interchromosomal rearrangement occurs.
    explanation: Reviews the proposed chromosomal origin rather than documenting the embryonic event in the cohort.
  downstream:
  - target: Tissue-Specific Sex Chromosome Mosaicism
    causal_link_type: DIRECT
    description: Chromosome loss produces coexisting cell lineages; their distribution can differ among tissues.
    evidence:
    - reference: PMID:41208147

    quote_role: REVIEW_SYNTHESIS
    snippet: The core components of care include sex assignment, excisional biopsy of the dysgenetic or streak gonads to decrease tumour risk, hypospadias repair usually in a staged approach, hormone replacement therapy for initiation and maintenance of puberty, and growth‐promoting strategies for managing short stature.

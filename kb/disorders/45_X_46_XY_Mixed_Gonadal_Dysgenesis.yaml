  description: Endocrinology, urology, gynecology, genetics and psychology coordinate care with the patient and family. Support addresses diagnostic uncertainty, body image, disclosure, relationships and fertility across childhood and adulthood. Gender identity cannot be reliably predicted from a blood mosaic ratio, genital anatomy or a single cohort percentage.

name: 45,X/46,XY Mixed Gonadal Dysgenesis
category: Chromosomal
creation_date: "2026-08-29T19:15:00Z"
synonyms:
- mixed gonadal dysgenesis
- 45,X/46,XY mosaicism
- 45,X/46,XY gonadal dysgenesis
- X0/XY mosaicism
- asymmetric gonadal dysgenesis
description: >-
  45,X/46,XY mixed gonadal dysgenesis is a difference of sex development caused
  not by a gene defect but by a mosaic: post-zygotic loss of the Y chromosome
  leaves two cell lineages, 45,X and 46,XY, distributed unevenly across the body.
  Because the gonadal ridge is patterned locally, the two sides can receive
  different proportions of the SRY-bearing lineage and take different
  developmental paths - classically a fibrous streak gonad on one side and a
  dysgenetic testis on the other. Everything downstream follows from that
  asymmetry: the dysgenetic testis makes some anti-Mullerian hormone and some
  testosterone but not enough, so Mullerian structures persist on the streak side
  and virilization is incomplete. Separately, the 45,X lineage carries the same
  SHOX haploinsufficiency as Turner syndrome, so short stature and Turner
  stigmata run alongside the genital phenotype. Retained Y material in a
  dysgenetic gonad carries a substantial gonadoblastoma risk.
disease_term:
  preferred_term: 45,X/46,XY mixed gonadal dysgenesis
  term:
    id: MONDO:0015779
    label: 45,X/46,XY mixed gonadal dysgenesis
parents:
- Disorder of sex development
- Sex chromosome disorder
inheritance:
- name: Sporadic post-zygotic mosaicism
  description: >-
    Not inherited. The mosaicism arises from a mitotic error after fertilization,
    parental karyotypes are normal, and recurrence risk is not raised above the
    population baseline. This is the counselling distinction from the monogenic
    46,XY gonadal dysgenesis entities, which can segregate in families.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition emerges from early embryonic errors in chromosomal arrangements resulting in a mixture of 45,X/46,XY cell lines"
    explanation: States the post-zygotic origin that makes the condition sporadic.
prevalence:
- population: Live births
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.4
  rate_low: 3.3
  rate_high: 6.7
  notes: >-
    Reported as 1 in 15,000 to 1 in 30,000 live births, which is 3.3 to 6.7 per
    100,000; the point value is the midpoint of that range and not itself a
    published figure. The review says the true figure is probably higher, because
    people whose phenotype is unremarkably male or female are never karyotyped -
    so this is an ascertainment floor rather than an estimate.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

inheritance:
- name: Sporadic post-zygotic mosaicism
  description: Usually sporadic chromosomal mosaicism arising through an early post-zygotic error, including mitotic Y-chromosome loss. Structural Y abnormalities can also contribute. This differs from Mendelian forms of 46,XY gonadal dysgenesis; counseling should use the individual cytogenetic findings rather than infer a universal parental karyotype or a precisely quantified recurrence risk.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The condition emerges from early embryonic errors in chromosomal arrangements resulting in a mixture of 45,X/46,XY cell lines
    explanation: States the post-zygotic origin that makes the condition sporadic.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:34566299
    reference_title: Clinical and Reproductive Characteristics of Patients with Mixed Gonadal Dysgenesis (45,X/46, XY).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: MGD arises due to late anaphase lag during mitosis in the zygote, although Y chromosomal abnormalities are sometimes seen and interchromosomal rearrangement occurs.
    explanation: The article reviews post-zygotic origin and possible structural abnormalities; it does not provide a numerical recurrence estimate.

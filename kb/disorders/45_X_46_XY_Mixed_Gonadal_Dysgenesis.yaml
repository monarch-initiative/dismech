histopathology:
- name: Mixed Seminiferous and Undifferentiated Gonadal Architecture
  description: A resected gonad from one infant contained normal-appearing and abnormally shaped seminiferous tubules, undifferentiated gonadal tissue and gonadoblastoma nests. This demonstrates intragonadal heterogeneity, not a universal histologic pattern.
  evidence:
  - reference: PMID:25860218
    reference_title: 'Identification of X monosomy cells from a gonad of mixed gonadal dysgenesis with a 46,XY karyotype: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Histology of the gonad showed a streak testis consisting predominantly of differentiated normal-appearing seminiferous tubules with an area of undifferentiated gonadal tissue (UGT) and abnormally shaped seminiferous tubules at the periphery of the gonad
    explanation: Describes the actual tissue architecture in one resected right gonad.
  notes: 'Needs term / NTR: OLS NCIT search for seminiferous tubule dysplasia found no exact histopathology term; a generic dysplasia binding would discard the mixed architectural finding.'
- name: Mixed Supporting-cell Lineage-marker Expression
  description: SOX9-only Sertoli cells, FOXL2-only precursor granulosa cells and cells expressing both markers occurred in distinct areas of the same infant gonad. Coexpression indicates mixed lineage-marker expression; SRY immunostaining alone cannot assign a karyotype to every cell type.
  evidence:
  - reference: PMID:25860218
    reference_title: 'Identification of X monosomy cells from a gonad of mixed gonadal dysgenesis with a 46,XY karyotype: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Unexpectedly, our case showed co-expression of SOX9 and FOXL2 in abnormally shaped seminiferous tubules and gonadoblastomas.
    explanation: Single-case supporting-cell immunophenotype, not a universal diagnostic biomarker.
  notes: 'Needs term / NTR: OLS NCIT search for SOX9 FOXL2 coexpression found no matching immunophenotypic finding.'
- name: Arrested Spermatogenesis
  description: Arrested spermatogenesis was among the histologic patterns in a multicenter male cohort; focal spermatogenesis was also present in some samples. The cohort included genital and nongenital routes of ascertainment.
  evidence:
  - reference: PMID:31127831
    reference_title: Clinical but Not Histological Outcomes in Males With 45,X/46,XY Mosaicism Vary Depending on Reason for Diagnosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Twenty-five percent had focal spermatogenesis, and another 25.0% had arrested spermatogenesis.
    explanation: Histologic observations in the assessed subset of a 63-person multicenter male cohort; the abstract does not fully resolve the denominator for each histologic percentage.
  notes: 'Needs term / NTR: OLS NCIT search for spermatogenic arrest found no exact histopathology term. The source percentage is retained only in the quote because its abstract does not fully specify each histologic denominator.'

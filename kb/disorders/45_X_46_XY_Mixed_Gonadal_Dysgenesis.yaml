- name: Lifelong Multisystem Surveillance
  description: Follow-up assesses growth, puberty, bone health, hearing, thyroid function, cardiovascular and renal findings, and metabolic health. The international Turner guideline explicitly extends its surveillance recommendations to 45,X/46,XY individuals with atypical or male external genitalia regardless of sex of rearing. Surveillance is not contingent on assigning a Turner diagnosis to every individual.

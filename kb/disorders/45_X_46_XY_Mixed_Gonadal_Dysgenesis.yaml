      quote_role: REVIEW_SYNTHESIS
      snippet: The condition emerges from early embryonic errors in chromosomal arrangements resulting in a mixture of 45,X/46,XY cell lines
      explanation: Supports generation of mosaic lineages.
- name: Tissue-Specific Sex Chromosome Mosaicism
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: 45,X and Y-bearing cell lineages vary between blood and gonadal tissue and among gonadal cell populations. Human gonadal FISH has directly measured this mosaicism. Two MGD cases in a five-person study had higher XY fractions in testicular than streak ovarian tissue; a separate case had gonadal mosaicism despite a 46,XY blood karyotype. These postnatal observations do not define the embryonic threshold for testis differentiation.
  evidence:
  - reference: PMID:9763660
    reference_title: Pathogenetics of 45,X/46,XY gonadal mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In the mixed gonadal dysgenesis cases (cases 3 and 4), the testis had a higher percentage (greater than two fold) of XY cells than the ovary had.
    explanation: Direct human tissue evidence in two cases, not a universal ratio or developmental threshold.
  - reference: PMID:25860218
    reference_title: 'Identification of X monosomy cells from a gonad of mixed gonadal dysgenesis with a 46,XY karyotype: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The average percentages of 45,X cells of this patient's gonad and a control testis were 39.0% and 5.7%, respectively (χ2 test, P < 0.001).
    explanation: Digital FISH analysis of one resected gonad supports tissue mosaicism, with a nonzero false-negative background in the control.
  downstream:
  - target: Abnormal Gonadal Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Spatial variation in sex-chromosome content is associated with different gonadal differentiation patterns, but chromosome ratios alone do not establish the developmental mechanism.
    evidence:
    - reference: PMID:9763660

- name: Growth Hormone Therapy
  description: Recombinant growth hormone may be considered for impaired growth after endocrine evaluation. Observational evidence for adult-height benefit in the mosaic population is inconsistent; treatment decisions account for growth trajectory, remaining growth potential and gonadal follow-up. SHOX dosage is one possible contributor to short stature, and treatment does not correct the chromosomal mosaicism.

biochemical:
- name: Inhibin B
  notes: Low inhibin B with elevated FSH can indicate Sertoli dysfunction. Early-pubertal inhibin B has been proposed as a predictor of later gonadal function, but this is not a universally validated decision threshold.
  evidence:
  - reference: PMID:29973376
    reference_title: Should 45,X/46,XY boys with no or mild anomaly of external genitalia be investigated and followed up?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: signs of declined Sertoli cell function (low inhibin B levels and increased FSH levels)
    explanation: Establishes the low-inhibin-B, high-FSH pattern as the marker of Sertoli decline.
    quote_role: PRIMARY_RESULT
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: inhibin B concentrations during early puberty may serve as a reliable predictor of testicular function and the need for testosterone replacement in the future
    explanation: Reports the prognostic use of early-pubertal inhibin B.
    quote_role: REVIEW_SYNTHESIS
- name: Follicle-stimulating hormone
  notes: FSH can rise with impaired gonadal feedback; age, pubertal stage and gonadal surgery affect interpretation.
  evidence:
  - reference: PMID:29973376
    reference_title: Should 45,X/46,XY boys with no or mild anomaly of external genitalia be investigated and followed up?
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: signs of declined Sertoli cell function (low inhibin B levels and increased FSH levels)
    explanation: Establishes the low-inhibin-B, high-FSH pattern as the marker of Sertoli decline.
    quote_role: PRIMARY_RESULT
- name: Anti-Mullerian hormone
  notes: A marker of Sertoli-cell/testicular tissue function. Concentrations can be low relative to male infant reference ranges; a postnatal value does not directly quantify fetal AMH exposure.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: AMH concentrations in individuals with MGD are typically toward the lower end of the reference range for healthy male infants with normal testicular function, reflecting relative Sertoli cell dysfunction
    explanation: Describes impaired secretion rather than a measured loss of Sertoli cell mass.
- name: Testosterone
  notes: Basal and hCG-stimulated testosterone assess steroidogenic function in the appropriate age context. Typical infant concentrations may be low-normal relative to male reference ranges.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Due to the presence of dysgenetic testis, the plasma testosterone concentrations in MGD patients tend to be low‐normal relative to typical male infants but remain elevated compared with those typically seen in female infants.
    explanation: Supports a relative and variable secretory deficit.
diagnosis:
- name: Chromosome analysis with adequate cell count
  description: Peripheral-blood karyotyping identifies mosaic sex-chromosome lineages and structural abnormalities. The international Turner guideline recommends counting at least 30 metaphases, which detects approximately 10% mosaicism with 95% confidence; lower-level or tissue-restricted mosaicism may be missed. A blood mosaic ratio does not reliably predict gonadal composition or genital phenotype.
  evidence:
  - reference: PMID:38748847
    reference_title: Clinical practice guidelines for the care of girls and women with Turner syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: We recommend that a minimum of 30 metaphases be counted on a chromosome analysis as the first-line test which can detect approximately 10% mosaicism with 95% confidence limits
    explanation: Defines the cytogenetic sampling recommendation and its detection limit.
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Since mosaicism can vary between tissues, the karyotype in the blood might not accurately reflect the gonadal karyotype.
    explanation: Explains the tissue limitation.
- name: Additional tissue and molecular cytogenetic testing
  description: When clinical suspicion persists, targeted karyotype or FISH can assess buccal cells, skin fibroblasts or gonadal tissue obtained for clinical reasons. Microarray can characterize copy-number changes but is not uniformly more sensitive for low-level mosaicism and does not identify balanced rearrangements. Test choice depends on the suspected abnormality and laboratory method.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Targeted karyotype or Fluorescent in situ hybridisation (FISH) analysis of buccal epithelia cells obtained via swab, skin fibroblasts or gonadal tissue (if having gonadectomy for clinical reasons) may be required when clinical suspicion persists after normal karyotype results.
    explanation: Supports additional-tissue assessment without recommending gonadal surgery solely to measure mosaicism.
  - reference: PMID:38748847
    reference_title: Clinical practice guidelines for the care of girls and women with Turner syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Microarray can provide better resolution compared to karyotyping, but has limitations in detecting low level 45,X mosaicism (<10%, though studies show detection as low as 5%)
    explanation: Distinguishes resolution from reliable low-level mosaic detection.
- name: Confirmation after prenatal detection
  description: Prenatal screening or cytogenetic findings require appropriate confirmatory testing and counseling about uncertain phenotype prediction. NIPT is a screening test, not a definitive fetal karyotype. Postnatal cytogenetic confirmation is recommended after prenatal identification of the mosaic karyotype.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: When a 45,X/46,XY karyotype is identified prenatally by amniocentesis or chorionic villus sampling testing, postnatal confirmation by cytogenetic testing is essential to guide clinical management
    explanation: Specifies confirmation after prenatal diagnosis.
- name: Endocrine assessment
  description: Age-appropriate testosterone, AMH and gonadotropins assess testicular tissue and function. During the early infant mini-puberty window, basal testosterone may be informative; hCG stimulation can assess steroidogenic reserve when basal values are low or the window has passed. Electrolytes, cortisol and 17-hydroxyprogesterone help exclude adrenal causes of atypical genitalia and salt-wasting emergencies.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: If baseline testosterone concentration is low or if being evaluated outside the mini‐puberty window, a human chorionic gonadotropin (hCG) stimulation test can be useful to assess if the testicular tissue can mount an adequate testosterone response.
    explanation: Specifies the functional test and timing context.
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: 'The key investigations include: plasma electrolytes, cortisol and 17‐hydroxyprogesterone (17‐OHP) concentrations'
    explanation: Names the initial adrenal differential work-up.
- name: Imaging and anatomical evaluation
  description: Pelvic ultrasound is the initial investigation for gonadal location and Müllerian anatomy; abdominal ultrasound also evaluates the kidneys. MRI, examination under anesthesia, endoscopy or laparoscopy may be appropriate when the anatomy remains unclear or an intervention is planned. Negative imaging does not exclude small remnants or gonadal tissue. The quoted ultrasound miss rate comes from a complex-DSD series rather than an MGD-only accuracy study.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Pelvic ultrasound is typically the first‐line for localisation of gonads and identification of Müllerian structures. MRI is reserved for cases where ultrasound findings are inconclusive
    explanation: Describes the imaging sequence.
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: ultrasound failed to visualise Müllerian duct remnants in approximately 40% of cases, whereas laparoscopy achieved optimal visualization in all patients
    explanation: Supports a limitation of ultrasound within the cited complex-DSD population.
- name: Gonadal histology when clinically indicated
  description: Biopsy or resection can characterize streak and testicular tissue, germ-cell maturation and neoplastic lesions. Gonads may be heterogeneous, so a limited biopsy cannot reliably exclude a focal lesion elsewhere. Histology is interpreted with the cytogenetic, endocrine and anatomic findings.
  evidence:
  - reference: PMID:31883875
    reference_title: Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A gonad composed of both streak and dysgenetic testicular portions was observed in 7 gonads of 6 patients.
    explanation: Shows why a single sample can incompletely represent a gonad.
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: However, biopsy may not reliably represent the entire gonad, and blood tumour markers are not elevated in most DSD‐ associated germ cell tumours.
    explanation: States sampling and biomarker limitations.
- name: Baseline Cardiac and Renal Assessment
  description: Children with a 45,X/46,XY karyotype warrant renal ultrasonography and cardiac evaluation with echocardiography to detect associated anomalies. Subsequent follow-up is guided by the findings and broader surveillance recommendations.
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Given these associations, it is recommended that a comprehensive evaluation including renal ultrasonography, together with a complete cardiac evaluation with echocardiographic assessment should be performed in all children with 45,X/46,XY karyotype to facilitate early detection and management of these anomalies
    explanation: The review recommends cardiac and renal evaluation for children with the mosaic karyotype regardless of their external genital presentation.
differential_diagnoses:
- name: 46,XY partial gonadal dysgenesis
  disease_term:
    preferred_term: 46,XY partial gonadal dysgenesis
    term:
      id: MONDO:0016674
      label: 46,XY partial gonadal dysgenesis
  description: Partial gonadal dysgenesis can occur with a 46,XY karyotype and overlapping genital or gonadal findings. Pathogenic variants in sex-development genes may account for some cases. A normal blood karyotype does not exclude tissue-restricted 45,X mosaicism.
  distinguishing_features:
  - Demonstrated 45,X mosaicism in blood or another relevant tissue supports the mosaic chromosomal entity.
  - Single-gene and chromosomal causes require different recurrence counseling; a molecular diagnosis is not established in every 46,XY case.
  evidence:
  - reference: PMID:25860218
    reference_title: 'Identification of X monosomy cells from a gonad of mixed gonadal dysgenesis with a 46,XY karyotype: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: A 1-year-old infant with 46,XY identified by peripheral blood karyotype demonstrated clinical manifestations and gonadal pathologic features of MGD.
    explanation: Shows why blood karyotype alone cannot always distinguish the conditions.
- name: Turner syndrome
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  description: Turner syndrome overlaps clinically and cytogenetically with this mosaic population. Some individuals with 45,X/46,XY and female external genitalia meet Turner diagnostic criteria; the presence of Y material does not exclude that diagnosis. Those with atypical or male external genitalia are outside the guideline definition of Turner syndrome but still warrant its surveillance recommendations.
  distinguishing_features:
  - Interpret Turner syndrome using phenotype and cytogenetic findings rather than an absolute absence of Y material.
  - Asymmetric streak/testicular anatomy supports the MGD description, but gonadal patterns in the mosaic population are variable.
  evidence:
  - reference: PMID:38748847
    reference_title: Clinical practice guidelines for the care of girls and women with Turner syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Individuals with 45,X/46,XY mosaicism who do not have typical female external genitalia are also excluded from the diagnosis, although we recommend that the guidelines also apply to these individuals due to a similar comorbidity profile
    explanation: Distinguishes the Turner diagnostic definition from surveillance eligibility.
treatments:
- name: Individualized Gonadal Surgery
  description: Removal of a nonfunctional streak or dysgenetic gonad can reduce the risk arising from that tissue. Whether and when to remove each gonad is decided individually, considering histology, position, hormone function, fertility potential, surveillance limits and the informed preferences of the patient and family. Removal may create a need for long-term hormone replacement.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: a shared decision‐making approach, inclusive of the risks and benefits of both options, should be used to make these decisions in an individualised manner.
    explanation: The review does not establish universal removal or universal retention.
  - reference: PMID:38748847
    reference_title: Clinical practice guidelines for the care of girls and women with Turner syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: We recommend individualized decision-making about gonadectomy/salpingo-oophrectomy in girls and women with TS and Y chromosome material identified on standard karyotyping or FISH analysis.
    explanation: The guideline supports individualization in girls and women with Turner syndrome and Y material; its precise population is retained.
  target_mechanisms:
  - target: Germ Cell Neoplasia in Dysgenetic Gonads
    description: Removes the tissue at risk; the decision balances neoplasia prevention against loss of gonadal function.
- name: Surveillance of Retained Gonads
  description: If gonads are retained, specialist follow-up includes examination and individualized imaging or tissue assessment. Scrotal position does not eliminate risk. Imaging can miss early lesions, biopsy can miss focal disease, and serum tumour markers are often uninformative; surveillance therefore cannot guarantee exclusion of neoplasia.

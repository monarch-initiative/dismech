    explanation: Source of the incidence range converted to the normalized rate.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of MGD may be underestimated due to its wide range of phenotypic presentations."
    explanation: Supports treating the figure as a floor rather than a population estimate.
- population: Infants evaluated for atypical genitalia
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  notes: >-
    A referral-population share, not a population rate. It says how often MGD is
    the answer once a newborn has been referred for atypical genitalia, which is
    the clinically useful number and is not comparable with the birth incidence
    above.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among infants evaluated for atypical genitalia, MGD accounts for approximately 5%-15% of cases"
    explanation: Gives the share of the referral population, which is what this record reports.
pathophysiology:
- name: Post-Zygotic Loss of the Y Chromosome
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Mitotic non-disjunction or anaphase lag during early cleavage - often
    involving a structurally unstable Y such as an isodicentric or ring Y -
    produces two coexisting lineages, 45,X and 46,XY. The lineages are
    distributed stochastically, so their ratio differs from tissue to tissue.
    That variation, not any allele, is the source of the phenotypic range: the
    same karyotype label covers people who present with atypical genitalia and
    people who are never suspected of having anything.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The phenotype of patients with MGD is variable and determined by the extent and degree of mosaicism across different tissues, including the gonads and genital structures"
    explanation: States that tissue-level mosaic ratio, not genotype, sets the phenotype.
  downstream:
  - target: Regional SRY Dosage Variation Across the Gonadal Ridge
    causal_link_type: DIRECT
  - target: SHOX Haploinsufficiency in the 45,X Lineage
    causal_link_type: DIRECT
    description: >-
      The 45,X lineage is one SHOX copy short wherever it lands, independently of
      what happens in the gonad.

- name: Regional SRY Dosage Variation Across the Gonadal Ridge
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Testis determination is a local switch, not a whole-body one. SRY in
    pre-Sertoli cells activates SOX9, which enters a feed-forward loop with FGF9
    that both sustains the testis program and represses the pro-ovarian WNT4
    pathway. Where the SRY-bearing lineage is well represented the switch throws;
    where it is not, the balance stays on the WNT4 side, and under monosomy X
    that pathway cannot sustain a gonad either. This node is PROVISIONAL because
    the FGF9-WNT4 antagonism is established in mouse and its application to a
    human mosaic gonadal ridge is an inference - no human MGD gonad has been
    profiled for these signals.
  cell_types:
  - preferred_term: Pre-Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  biological_processes:
  - preferred_term: male sex determination
    term:
      id: GO:0030238
      label: male sex determination
    modifier: ABNORMAL
  - preferred_term: Sertoli cell differentiation
    term:
      id: GO:0060008
      label: Sertoli cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:16700629
    reference_title: "Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In the mouse XY gonad, Sry normally initiates a feed-forward loop between Sox9 and Fgf9, which up-regulates Fgf9 and represses Wnt4 to establish the testis pathway."
    explanation: >-
      Supplies the switch mechanism this node depends on. Graded INDIRECT because
      it is mouse work on a non-mosaic gonad; its relevance here is that a
      balance-tipping switch is exactly what a mosaic ridge would perturb
      regionally.
  - reference: PMID:16700629
    reference_title: "Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The role of the male sex-determining switch--Sry in the case of mammals--is to tip the balance between these underlying patterning signals."
    explanation: >-
      The framing that makes regional SRY dosage a plausible determinant: if SRY
      only tips a balance, a partial dose can leave the balance untipped locally.
  downstream:
  - target: Asymmetric Gonadal Differentiation
    causal_link_type: DIRECT

- name: Asymmetric Gonadal Differentiation
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    The defining lesion. One gonad follows a testicular path, usually
    dysgenetically, while the other fails to organize and becomes fibrous streak
    tissue. This is not the only outcome - a single-centre histological series
    found the classic streak-plus-testis combination in 59% of patients, bilateral
    streaks in 26% and bilateral dysgenetic testes in 15%, and six patients had a
    gonad containing both streak and testicular tissue within it. That last
    finding is the strongest anatomical evidence that the determinant is regional
    rather than per-gonad.
  locations:
  - preferred_term: gonad
    term:
      id: UBERON:0000991
      label: gonad
  evidence:
  - reference: PMID:31883875
    reference_title: "Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Of 34 patients with 45,X/46,XY mosaicism, a unilateral dysgenetic testis and a contralateral streak gonad was detected in 20 patients (59%), bilateral streak gonads in 9 (26%), and bilateral dysgenetic testes in 5 (15%)."
    explanation: Gives the histological distribution, including how often the classic asymmetric pattern is actually found.
  - reference: PMID:31883875
    reference_title: "Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "A gonad composed of both streak and dysgenetic testicular portions was observed in 7 gonads of 6 patients."
    explanation: >-
      Mixed tissue within a single gonad, which is what a regionally patterned
      mosaic ridge predicts and a whole-gonad model does not.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "typically characterised by the presence of a dysgenetic testis at various levels of descent on one side and a streak gonad on the other"
    explanation: The canonical description of the asymmetric anatomy.
  downstream:
  - target: Reduced Sertoli and Leydig Cell Output
    causal_link_type: DIRECT
  - target: Gonadoblastoma Risk in Retained Dysgenetic Gonads
    causal_link_type: DIRECT

- name: Reduced Sertoli and Leydig Cell Output
  biological_scale: ORGANISM
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    A dysgenetic testis has less of both secretory cell populations than a normal
    one, so it makes anti-Mullerian hormone and testosterone but not enough of
    either at the times they are needed. The deficit is partial and quantitative,
    which is precisely why the phenotype is intermediate rather than either fully
    male or fully female. It also worsens with time: FSH rises and testosterone
    falls through puberty, and testicular insufficiency reaches 60 to 70 percent
    of those raised as males by the third decade.
  cell_types:
  - preferred_term: Sertoli cell
    term:
      id: CL:0000216
      label: Sertoli cell
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Endogenous sex steroid hormone production in patients with MGD is typically limited to the synthesis of testosterone by the dysgenetic testis."
    explanation: Identifies the dysgenetic testis as the sole steroid source, which is why its reduced capacity is limiting.
  - reference: PMID:29973376
    reference_title: "Should 45,X/46,XY boys with no or mild anomaly of external genitalia be investigated and followed up?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "puberty occurred spontaneously in 93% of patients but 71% (n = 5) of those evaluated at the end of puberty presented signs of declined Sertoli cell function (low inhibin B levels and increased FSH levels)."
    explanation: >-
      Measures the Sertoli deficit directly by inhibin B and FSH, and shows it
      emerging even in boys whose genitalia were normal or near-normal.
  downstream:
  - target: Incomplete Mullerian Regression and Undervirilization
    causal_link_type: DIRECT

- name: Incomplete Mullerian Regression and Undervirilization
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Anti-Mullerian hormone acts locally, so the side without a functioning testis
    keeps its Mullerian derivatives while the side with one loses them. The result
    is a hemi-uterus and fallopian tube remnant on the streak side, and a degree
    of virilization of the external genitalia set by how much testosterone the
    dysgenetic testis managed to produce during the critical window. Proximal
    hypospadias with ventral curvature is the commonest external finding.
  locations:
  - preferred_term: Mullerian duct
    term:
      id: UBERON:0003890
      label: Mullerian duct
  biological_processes:
  - preferred_term: Mullerian duct regression
    term:
      id: GO:0001880
      label: Mullerian duct regression
    modifier: DECREASED
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Many individuals have Müllerian remnants on the same side as the streak gonad, whereas the most common phenotypic finding is proximal hypospadias with perineal division of the corpus spongiosum and ventral curvature"
    explanation: >-
      Reports the ipsilateral relationship between the streak gonad and the
      retained Mullerian structures, which is the observation that establishes
      the local rather than systemic action of AMH here.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The clinical spectrum of MGD to an extent is influenced by the functional capacity of the dysgenetic gonad along with the degree of androgen exposure during critical periods of foetal development"
    explanation: Ties the degree of virilization to gonadal capacity during the fetal window.

- name: Gonadoblastoma Risk in Retained Dysgenetic Gonads
  biological_scale: TISSUE
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Germ cells sitting in dysgenetic gonadal tissue that still carries Y material
    are at substantial risk of arrest and neoplastic transformation, through
    gonadoblastoma and on to dysgerminoma. The overall risk is quoted at 15 to 25
    percent. The Y-linked contribution is attributed to the gonadoblastoma locus
    GBY, whose leading candidate gene TSPY is expressed in the germ cells of MGD
    patients themselves; ectopic TSPY accelerates the G2/M transition through
    cyclin B-CDK1. Expression is not sufficient on its own - the same proteins are
    found in germ cells of patients without malignancy - so the dysgenetic
    environment is doing part of the work. Where the risk sits anatomically is
    contested: several series report it concentrated in intra-abdominal gonads,
    but one found carcinoma in situ in two scrotal testes, and the disagreement is
    what drives the management debate rather than a settled rule.
  cell_types:
  - preferred_term: Germ cell
    term:
      id: CL:0000586
      label: germ cell
  evidence:
  - reference: PMID:30753444
    reference_title: "Gonadoblastoma Y locus genes expressed in germ cells of individuals with dysgenetic gonads and a Y chromosome in their karyotypes include DDX3Y and TSPY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "The GBY candidate genes DDX3Y and TSPY are expressed in the germ cells of DSD-XY patients from distinct etiologies: patients with mixed gonadal dysgenesis (MGD) and sex chromosome mosaics (45,X0/46,XY; 46,XX/46,XY)"
    explanation: >-
      Immunohistochemistry on gonadal tissue from MGD patients specifically, so
      this is the Y-linked oncogenic candidate measured in the right disease
      rather than inferred from other DSD groups.
  - reference: PMID:30753444
    reference_title: "Gonadoblastoma Y locus genes expressed in germ cells of individuals with dysgenetic gonads and a Y chromosome in their karyotypes include DDX3Y and TSPY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "This suggest that GBY candidate proteins are also expressed in the non-malignant germ cells of DSD-XY individuals like in male spermatogonia."
    explanation: >-
      The necessary caveat: GBY expression is not by itself transformation, which
      is why the node treats the dysgenetic environment as a co-requirement rather
      than treating retained Y material as sufficient.
  - reference: PMID:19306348
    reference_title: "Gonadoblastoma locus and the TSPY gene on the human Y chromosome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "TSPY binds to type B cyclins, enhances an activated cyclin B-CDK1 kinase activity, and propels a rapid G(2)/M transition in the cell cycle."
    explanation: >-
      Supplies the cell-cycle mechanism by which ectopic TSPY would drive
      proliferation. Graded INDIRECT because the biochemistry was not done in MGD
      tissue.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "MGD accounts for 5%-15% of cases of atypical genitalia and carries a 15%-25% risk of gonadal tumour, with the highest malignancy rates in intra-abdominal gonads."
    explanation: The headline risk figure and its stated dependence on gonadal position.
  - reference: PMID:31883875
    reference_title: "Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Pathologic examination revealed gonadal tumors in 6 of the 34 (18%) patients, including a gonadoblastoma in 7 gonads among 5 patients and an association of dysgerminoma with gonadoblastoma in 1 gonad."
    explanation: A histological denominator for the tumour risk, and shows the gonadoblastoma-to-dysgerminoma progression in one gonad.
  - reference: PMID:27032613
    reference_title: "Tumor risk of children with 45,X/46,XY gonadal dysgenesis in relation to their clinical presentations: Further insights into the gonadal management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Among Group I patients, the 4 dysgenetic testes affected by CIS in 3 patients were intraabdominal (n=1), inguinal (n=1) and scrotal (n=2) in positions."
    explanation: >-
      The counter-observation: half the affected dysgenetic testes in this series
      were scrotal, which is why the entry does not state position as protective.

- name: SHOX Haploinsufficiency in the 45,X Lineage
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    SHOX lies in the pseudoautosomal region and escapes X inactivation, so it
    needs two copies. Cells of the 45,X lineage have one. This is the same lesion
    that produces short stature in Turner syndrome, and it runs entirely parallel
    to the gonadal arm - it depends on where the 45,X cells landed, not on what
    the gonad did.
  gene:
    preferred_term: SHOX
    description: >-
      Short stature homeobox gene, present in one copy in cells of the 45,X
      lineage.
    modifier: DECREASED
    term:
      id: hgnc:10853
      label: SHOX
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Short stature is a common clinical feature in individuals with MGD and is typically attributed to the 45,X cell line, and associated haploinsufficiency of the SHOX gene"
    explanation: Attributes the short stature to SHOX dosage in the 45,X lineage, which is what this node asserts.
  downstream:
  - target: Turner-Spectrum Somatic Features
    causal_link_type: DIRECT

- name: Turner-Spectrum Somatic Features
  biological_scale: ORGANISM
  role: outcome
  mechanism_confidence: PROVISIONAL
  description: >-
    Short stature with a height Z-score that falls progressively through
    childhood, plus the wider Turner phenotype - cardiac and renal malformations,
    webbed neck, cubitus valgus - in a majority of patients. Marked PROVISIONAL
    for everything except the stature: SHOX explains the height, but the cardiac,
    renal and lymphatic features are attributed to the 45,X lineage by analogy
    with Turner syndrome rather than by any measurement of mosaic ratio in the
    affected tissue.
  evidence:
  - reference: PMID:37882230
    reference_title: "45,X/46,XY mosaicism: Clinical manifestations and long term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Females were significantly shorter than males (p = 0.04) and height Z-score was significantly decreased with age for both genders (p = 0.02)."
    explanation: Quantifies the progressive height deficit in a 100-patient cohort.
  - reference: PMID:29973376
    reference_title: "Should 45,X/46,XY boys with no or mild anomaly of external genitalia be investigated and followed up?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: "Seventy percent of patients presented Turner-like syndrome features including cardiac (6/23 patients investigated) and renal malformations (3/19 patients investigated)."
    explanation: Gives the frequency of Turner-like somatic features with per-organ denominators.

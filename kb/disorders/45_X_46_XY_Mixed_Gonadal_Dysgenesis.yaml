- name: Sex Steroid Replacement
  description: Testosterone or estradiol can induce and maintain puberty when gonadal hormone production is insufficient or after gonadectomy. Treatment follows individual clinical goals, pubertal stage and residual function. A progestogen is added to an estrogen regimen when endometrial protection is needed in a person with a uterus. Spontaneous pubertal onset is common in some male cohorts, so replacement is not inevitable for every individual.

discussions:
- discussion_id: mgd_mosaic_distribution_and_development
  kind: KNOWLEDGE_GAP
  prompt: How does gonadal mosaic distribution shape differentiation during fetal development?
  rationale: Human gonadal FISH already demonstrates tissue and cellular mosaicism. Two MGD cases in a five-person study had higher XY fractions in testicular than ovarian tissue. In a later case, combined FISH and lineage-marker staining demonstrated gonadal mosaicism despite a 46,XY blood karyotype, but only one gonad was examined and both FISH artifacts and cell-dependent SRY expression complicated inference. These observations do not establish the timing, spatial signal interactions or causal mosaic threshold during fetal development. A high XY fraction also occurred in an atrophic infertile testis, showing that fraction alone is insufficient to predict function.
  attaches_to:
  - pathophysiology#Tissue-Specific Sex Chromosome Mosaicism
  - pathophysiology#Abnormal Gonadal Differentiation
  evidence:
  - reference: PMID:9763660
    reference_title: Pathogenetics of 45,X/46,XY gonadal mosaicism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In the mixed gonadal dysgenesis cases (cases 3 and 4), the testis had a higher percentage (greater than two fold) of XY cells than the ovary had.
    explanation: Demonstrates existing human gonadal measurements.
  - reference: PMID:25860218
    reference_title: 'Identification of X monosomy cells from a gonad of mixed gonadal dysgenesis with a 46,XY karyotype: case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: FISH analysis on paraffin sections has the inevitable problem of false negativity for the Y chromosome. Immunohistochemical study for SRY is useful in proving the presence of Y chromosome; however, not all cell types express SRY protein and the interpretation of the results is complicated.
    explanation: States key measurement limitations.
- discussion_id: mgd_sry_threshold_model_is_murine
  kind: HUMAN_MODEL_MISMATCH
  prompt: How does the mouse FGF9-SOX9 and WNT4 network translate to a human mosaic gonad?
  rationale: Mouse knockout and culture experiments establish interdependent SOX9 and FGF9 expression and antagonism with WNT4. Fgf9-null XY gonads initially express SRY and SOX9 but fail to maintain SOX9 and form normal testis cords. The experimental genotypes are not 45,X/46,XY mosaic models. A requirement for a critical number of supporting cells and non-cell-autonomous recruitment is an author-proposed explanation rather than a measured human threshold. FGF9/WNT4 antagonism does not specify a direct biochemical repression step, and transient SOX9 induction in Wnt4-null XX gonads did not produce Sertoli differentiation or testis cords.
  attaches_to:
  - pathophysiology#Abnormal Gonadal Differentiation
  evidence:
  - reference: PMID:16700629
    reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Whether FGF9 normally acts non-cell-autonomously in vivo to recruit XY cells to the Sertoli lineage by up-regulating SOX9 is not clear.
    explanation: Explicitly identifies the remaining mechanistic uncertainty.
  - reference: PMID:16700629
    reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: Further experiments will be required to deﬁne the molecular mechanism of FGF9 and WNT4 action.
    explanation: The antagonistic relationship is not a resolved biochemical chain.
- discussion_id: mgd_gh_efficacy_contested
  kind: KNOWLEDGE_GAP
  prompt: Which patients gain adult height from growth hormone treatment?
  rationale: The clinical review describes improvement in growth velocity and final height, while a retrospective 100-person cohort found no significant height difference between treated and untreated groups. Variation in indication, baseline height, dose, timing and residual growth may affect observational comparisons. The available evidence does not establish uniform benefit or lack of benefit. The five-person series of growth-axis testing describes heterogeneous GH deficiency or resistance patterns but does not provide treatment-effect follow-up.
  attaches_to:
  - treatments#Growth Hormone Therapy
  - pathophysiology#SHOX Haploinsufficiency in the 45,X Lineage
  evidence:
  - reference: PMID:37882230
    reference_title: '45,X/46,XY mosaicism: Clinical manifestations and long term follow-up.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Growth hormone (GH) treatment did not result in a significant height increase compared to the untreated group (p = 0.5).
    explanation: Retains the nonsignificant observational comparison.
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Recombinant human growth hormone (rhGH) therapy has been found to significantly improve growth velocity and final adult height in individuals with MGD, with outcomes similar to those observed in Turner syndrome
    explanation: Retains the review assessment without treating it as a randomized estimate.
- discussion_id: mgd_gonad_position_and_tumour_risk
  kind: KNOWLEDGE_GAP
  prompt: How should gonadal position, histology and function inform individualized tumour-risk assessment?
  rationale: In one 14-patient prophylactic gonadectomy series, all gonadoblastomas were in abdominal gonads. A different 21-child study found germ cell neoplasia in situ in abdominal, inguinal and scrotal dysgenetic testes. These cohorts studied different lesions and selected populations, so their counts are not directly contradictory or suitable for pooling. Scrotal position does not exclude neoplasia, and current surveillance methods have important sensitivity and sampling limitations. Reliable individual risk prediction while preserving gonadal function remains unresolved.
  attaches_to:
  - pathophysiology#Germ Cell Neoplasia in Dysgenetic Gonads
  - treatments#Individualized Gonadal Surgery
  - treatments#Surveillance of Retained Gonads
  evidence:
  - reference: PMID:27052295
    reference_title: 'Gonadoblastoma in patients with 45,X/46,XY mosaicism: A 16-year experience.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The exclusive presence of GB in intra-abdominal gonads is in keeping with the findings of several other series.
    explanation: Describes location within this selected gonadoblastoma series.
  - reference: PMID:27032613
    reference_title: 'Tumor risk of children with 45,X/46,XY gonadal dysgenesis in relation to their clinical presentations: Further insights into the gonadal management.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: the 4 dysgenetic testes affected by CIS in 3 patients were intraabdominal (n=1), inguinal (n=1) and scrotal (n=2) in positions.
    explanation: Shows in-situ neoplasia at all three locations.
references:
- reference: PMID:41208147
  title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
- reference: PMID:37882230
  title: '45,X/46,XY mosaicism: Clinical manifestations and long term follow-up.'
review_notes: Review considered the matching deep-research report, current clinical review and international Turner guideline, primary clinical cohorts, human gonadal FISH studies and the mouse FGF9/WNT4 experiments. Source-specific limitations include overlap between small same-center cohorts, surgery-confounded pubertal outcomes, selected gonadal tumour denominators, and abstract-only access for several older or registry studies. Direct human tissue mapping replaces the earlier claim that no such measurement exists. GeneReviews and StatPearls checks found no directly matching chapter.
notes: This entry describes a chromosomal mosaic condition rather than a single-gene disorder. SHOX dosage and sex-development pathways are mechanistically relevant, but no single causal-gene annotation is assigned. The wider 45,X/46,XY karyotype population includes individuals without classic mixed gonadal histology; registry and cohort results are identified at their actual scope. Animal and culture models are labeled as developmental pathway models. Cohort counts are retained without converting selected surgical, endocrine or photo-defined subgroups into population frequencies.
animal_models:
- name: Fgf9-null mouse model of gonadal differentiation
  species: Mouse
  genotype: Fgf9-null XY on the reported C57BL/6 background
  publication: PMID:16700629
  description: A developmental pathway model, not a mosaic 45,X/46,XY disease model. Sry and initial Sox9 expression were retained, but SOX9 was lost by 12.5 days post coitum, Sertoli markers were reduced or absent and normal testis cords did not form. No increased gonadal apoptosis was observed at the examined 12.0-day stage.
  modeled_mechanisms:
  - target: Abnormal Gonadal Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: Provides a causal perturbation of mouse testis differentiation through loss of Fgf9.
    limitations: Uniform mouse knockout rather than human sex-chromosome mosaicism. The phenotype depends on the reported background; the experiment does not determine a human SRY-cell threshold or prove FGF9 deficiency in MGD.
    readouts:
    - name: SOX9 maintenance and testis cord organization
      target: Abnormal Gonadal Differentiation
      direction: DECREASED
      interpretation: SOX9 disappears after initial induction and normal cord organization fails in the knockout.
      evidence:
      - reference: PMID:16700629
        reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: SOX9 was no longer detectable by 12.5 dpc, and Sertoli precursor cells never began to organize into normal testis cord structures
        explanation: In-vivo mutant gonadal readouts.
    evidence:
    - reference: PMID:16700629
      reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: although Fgf9 is not required for the up- regulation of Sox9 in vivo, it is indispensable to maintain Sox9 expression in Sertoli precursor cells.
      explanation: Separates initial induction from later maintenance.
experimental_models:
- name: Mouse gonadal cultures testing FGF9 and WNT4 interactions
  experimental_model_type: OTHER
  organism:
    preferred_term: Mus musculus
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  cell_source: Embryonic mouse gonads and gonad-mesonephros complexes
  culture_system: Intact explants and parallel dissociated-cell cultures
  publication: PMID:16700629
  description: 'FGF9 gain-of-function studies used intact explants, localized FGF9-coated beads and dissociated gonadal cells. Soluble FGF9 suppressed Wnt4 in intact XX gonads, while induction of SOX9 depended on culture context: dissociation, localized bead exposure or Wnt4 heterozygosity. Soluble FGF9 did not induce SOX9 in intact wild-type XX gonads.'
  modeled_mechanisms:
  - target: Abnormal Gonadal Differentiation
    relationship: PERTURBS
    fidelity: LOW
    description: Manipulates developmental signaling and measures supporting-cell markers in mouse cultures.
    limitations: These are ex-vivo or in-vitro assays, not human fetal tissue or a chromosome-mosaic model. Marker induction is not equivalent to complete functional testis differentiation.
    evidence:
    - reference: PMID:16700629
      reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: Treatment of XX gonads with exogenous FGF9 suppressed the normal expression of Wnt4
      explanation: Cultured gonad response to FGF9.
    - reference: PMID:16700629
      reference_title: Fgf9 and Wnt4 act as antagonistic signals to regulate mammalian sex determination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: The current study reveals that ectopic FGF9 can induce SOX9 under conditions in which XX cells are dissociated
      explanation: The dissociated-cell context is distinct from intact explants.

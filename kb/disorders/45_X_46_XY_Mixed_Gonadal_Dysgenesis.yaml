name: 45,X/46,XY Mixed Gonadal Dysgenesis
category: Chromosomal
creation_date: '2026-08-29T19:15:00Z'
synonyms:
- mixed gonadal dysgenesis
- 45,X/46,XY mosaicism
- 45,X/46,XY gonadal dysgenesis
- X0/XY mosaicism
- asymmetric gonadal dysgenesis
description: '45,X/46,XY mixed gonadal dysgenesis is a chromosomal difference of sex development associated with mosaic monosomy X and a Y-bearing cell lineage. Gonadal differentiation is variable: a streak gonad opposite a dysgenetic testis is characteristic, but bilateral streaks or bilateral testes also occur. External genital development, Müllerian structures, endocrine function and fertility vary with gonadal development. Short stature and other Turner-associated findings can occur regardless of external genital appearance. Dysgenetic gonads containing Y material carry a risk of germ cell neoplasia. The wider 45,X/46,XY mosaic population also includes individuals without the classic asymmetric gonadal phenotype; cohort estimates are identified at that broader scope where appropriate.'

- name: SHOX Haploinsufficiency in the 45,X Lineage
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: Cells of the 45,X lineage carry one copy of the pseudoautosomal SHOX gene rather than the usual two copies. This provides a plausible contribution to impaired skeletal growth, while tissue mosaicism and other endocrine or chromosomal factors can also influence stature. SHOX dosage does not explain all Turner-associated cardiac, renal or autoimmune findings.
  gene:
    preferred_term: SHOX
    description: Short stature homeobox gene, present in one copy in cells of the 45,X lineage.
    modifier: DECREASED
    term:
      id: hgnc:10853
      label: SHOX
  evidence:
  - reference: PMID:41208147
    reference_title: 'Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: Short stature is a common clinical feature in individuals with MGD and is typically attributed to the 45,X cell line, and associated haploinsufficiency of the SHOX gene
    explanation: Attributes the short stature to SHOX dosage in the 45,X lineage, which is what this node asserts.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Reduced SHOX dosage is a recognized contributor to impaired linear growth, but is not established as the sole cause of short stature in this mosaic population.
    evidence:

diagnosis:
- name: Karyotype with adequate cell count
  description: >-
    Peripheral blood karyotype is the diagnostic test, but the mosaic ratio in
    blood does not predict the ratio in gonad or in any other tissue, and a
    low-level line can be missed. Prenatal detection is possible but explicitly
    does not predict the postnatal phenotype.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal diagnostic tests such as noninvasive prenatal testing (NIPT) and amniocentesis can detect 45,X/46,XY mosaicism in foetal cells, but these findings do not reliably predict the postnatal phenotype of the infant"
    explanation: States both the detectability and the crucial limit on what detection tells you.
- name: Gonadal biopsy and histology
  description: >-
    Histology is what distinguishes a streak gonad from a dysgenetic testis and
    identifies gonadoblastoma or carcinoma in situ; imaging and hormone profiles
    do not.
  evidence:
  - reference: PMID:31883875
    reference_title: "Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The medical records of consecutive patients with 45,X/46,XY karyotype or its variants who had undergone gonadal biopsy or gonadectomy at a single institute between 1996 and 2017 were retrospectively reviewed."
    explanation: Establishes biopsy and gonadectomy specimens as the basis for the histological classification used here.
differential_diagnoses:
- name: 46,XY partial gonadal dysgenesis
  disease_term:
    preferred_term: 46,XY partial gonadal dysgenesis
    term:
      id: MONDO:0016674
      label: 46,XY partial gonadal dysgenesis
  description: >-
    Overlapping gonadal and genital findings, but a pure 46,XY karyotype and
    usually a monogenic cause.
  distinguishing_features:
  - No 45,X cell line, so no SHOX haploinsufficiency and no Turner stigmata.
  - Often monogenic, with a corresponding recurrence risk; MGD is sporadic.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common karyotype reported is 45,X/46,XY mosaicism."
    explanation: >-
      Establishes the karyotype that defines this entity, which is what separates
      it from the non-mosaic 46,XY dysgeneses.
- name: Turner syndrome
  disease_term:
    preferred_term: Turner syndrome
    term:
      id: MONDO:0019499
      label: Turner syndrome
  description: >-
    Shares the 45,X lineage and therefore the short stature and somatic stigmata,
    but has no Y-bearing line.
  distinguishing_features:
  - No Y material, so no dysgenetic testis, no virilization, and no gonadoblastoma risk from the GBY region.
  - Streak gonads are bilateral rather than asymmetric.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotypic presentation of MGD varies from atypical genitalia to typical male or female appearances often associated with Turner stigmata."
    explanation: Records the shared Turner stigmata that make the two overlap clinically.
treatments:
- name: Gonadectomy of Retained Dysgenetic Gonads
  description: >-
    Removal of streak gonads and, where indicated, dysgenetic testes, to remove
    the tissue at risk of gonadoblastoma. Practice has moved away from routine
    early gonadectomy toward shared decision-making, because the operation also
    removes any endogenous hormone production and any fertility potential.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Gonadoblastoma Risk in Retained Dysgenetic Gonads
    description: >-
      Removes the substrate. It does not modify the mechanism; it eliminates the
      tissue in which the mechanism operates.
    evidence:
    - reference: PMID:41208147
      reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Historically, assignment of female sex of rearing following early prophylactic gonadectomy to reduce the risk of gonadoblastoma was common practice"
      explanation: States the intent of the operation and, by describing it as historical practice, the shift away from doing it routinely.
- name: Growth Hormone Therapy
  description: >-
    Recombinant human growth hormone for the SHOX-related short stature, given on
    the Turner syndrome model. Whether it works in MGD is genuinely unsettled -
    see the discussion on this entry.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Turner-Spectrum Somatic Features
    description: >-
      Aimed at the height deficit only; it does nothing for the cardiac, renal or
      gonadal components.
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recombinant human growth hormone (rhGH) therapy has been found to significantly improve growth velocity and final adult height in individuals with MGD, with outcomes similar to those observed in Turner syndrome"
    explanation: The review's positive assessment, which one cohort study directly contradicts.
- name: Sex Steroid Replacement
  description: >-
    Puberty induction and maintenance. Required by essentially all female-raised
    patients, and by male-raised patients as testicular function declines.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Reduced Sertoli and Leydig Cell Output
    description: >-
      Replaces the hormone output the dysgenetic gonad cannot sustain.
  evidence:
  - reference: PMID:37882230
    reference_title: "45,X/46,XY mosaicism: Clinical manifestations and long term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All females required puberty induction in contrast to majority of males."
    explanation: Establishes the near-universal need for induction in female-raised patients.
- name: Multidisciplinary Shared Decision-Making
  description: >-
    Coordinated endocrinology, urology, gynaecology and psychology input, with
    irreversible surgery deferred until a team plan has been made with the family.
    This is a substantive intervention rather than a courtesy: roughly one in
    eight patients later reports gender incongruence, so decisions made in infancy
    can be wrong in a way that surgery cannot undo.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately 12%-15% of patients with MGD may experience gender incongruence later in life."
    explanation: Quantifies the outcome that makes deferring irreversible decisions a clinical rather than merely ethical position.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management has shifted from early surgical intervention to a multidisciplinary, patient-centred, and shared decision making approach."
    explanation: Documents the shift in practice this record describes.
discussions:
- discussion_id: mgd_gh_efficacy_contested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does growth hormone actually increase final height in 45,X/46,XY mixed gonadal
    dysgenesis?
  rationale: >-
    Two sources in this entry disagree, and the disagreement is not a matter of
    emphasis. The 2025 review states that growth hormone significantly improves
    growth velocity and final adult height, with outcomes similar to Turner
    syndrome. A three-centre cohort of 100 patients found no significant height
    difference between treated and untreated groups, p = 0.5. Both are in the
    entry because neither can be dismissed: the review aggregates studies designed
    to measure the effect, while the cohort is the largest single series with
    long-term follow-up and is not randomised, so treated patients may have been
    the shorter ones to begin with. The question matters because growth hormone is
    started at age four to six and carries a theoretical concern about stimulating
    tumour growth in retained gonadal tissue.
  attaches_to:
  - treatments#Growth Hormone Therapy
  - pathophysiology#Turner-Spectrum Somatic Features
  evidence:
  - reference: PMID:37882230
    reference_title: "45,X/46,XY mosaicism: Clinical manifestations and long term follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Growth hormone (GH) treatment did not result in a significant height increase compared to the untreated group (p = 0.5)."
    explanation: The negative cohort result, stated with its p value.
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an improvement in height SDS by 0.42 has been shown among treated patients"
    explanation: The positive effect size the review reports, which is what the cohort failed to reproduce.
- discussion_id: mgd_gonad_position_and_tumour_risk
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does gonadal position predict tumour risk well enough to decide which gonads
    to remove?
  rationale: >-
    The management model in wide use assumes intra-abdominal gonads are the
    dangerous ones and scrotal testes can be retained with surveillance. One
    fourteen-child series supports it strongly: every gonadoblastoma was in an
    intra-abdominal gonad. Another series of twenty-one children does not - of
    four dysgenetic testes with carcinoma in situ, one was intra-abdominal, one
    inguinal and two scrotal. The 2025 review separately notes that Y-chromosomal
    material raises germ cell tumour risk even in apparently normal scrotal
    testes. If position is not protective, then retaining a scrotal testis buys
    fertility potential and hormone production at a real and currently unquantified
    oncological cost, and surveillance rather than position has to carry the
    safety.
  attaches_to:
  - pathophysiology#Gonadoblastoma Risk in Retained Dysgenetic Gonads
  - treatments#Gonadectomy of Retained Dysgenetic Gonads
  evidence:
  - reference: PMID:27052295
    reference_title: "Gonadoblastoma in patients with 45,X/46,XY mosaicism: A 16-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The exclusive presence of GB in intra-abdominal gonads is in keeping with the findings of several other series."
    explanation: The position-dependent view, stated by a series that found it exclusively.
  - reference: PMID:27032613
    reference_title: "Tumor risk of children with 45,X/46,XY gonadal dysgenesis in relation to their clinical presentations: Further insights into the gonadal management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the 4 dysgenetic testes affected by CIS in 3 patients were intraabdominal (n=1), inguinal (n=1) and scrotal (n=2) in positions."
    explanation: "The counter-evidence: half of the affected testes in this series were scrotal."
  - reference: PMID:41208147
    reference_title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increases the risk of germ cell tumours even in apparently normal testes located in the scrotal sac"
    explanation: The review's own caution that scrotal position is not reassuring.
- discussion_id: mgd_no_gonadal_molecular_profile
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the actual mosaic ratio inside a human MGD gonad, and does it explain
    which side became a streak?
  rationale: >-
    The mechanism this entry curates says that regional variation in the
    SRY-bearing lineage across the gonadal ridge decides each side's fate. That
    is a testable claim and it has not been tested. No human MGD gonad has been
    profiled at single-cell resolution, so nobody has measured whether the streak
    side actually carries fewer 46,XY cells than the testicular side. The
    supporting mechanism - the SOX9-FGF9 loop repressing WNT4 - comes entirely
    from mouse gonads that are not mosaic. Human MGD gonadal tissue has been
    examined immunohistochemically for GBY proteins, so the tissue is obtainable;
    what has not been done is to genotype the two lineages within a single gonad
    and relate their distribution to which regions became streak. The finding that
    six patients had a single gonad containing both streak and testicular tissue
    is the strongest available human evidence for the regional model, and it is
    anatomical rather than molecular. Until the measurement is made, the mosaic-ratio explanation
    should be read as the best available account rather than a demonstrated one,
    which is why the two nodes that depend on it are marked PROVISIONAL.
  attaches_to:
  - pathophysiology#Regional SRY Dosage Variation Across the Gonadal Ridge
  evidence:
  - reference: PMID:31883875
    reference_title: "Variation of Gonadal Dysgenesis and Tumor Risk in Patients With 45,X/46,XY Mosaicism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A gonad composed of both streak and dysgenetic testicular portions was observed in 7 gonads of 6 patients."
    explanation: >-
      The anatomical observation that the regional model explains and a
      whole-gonad model does not, and currently the best human evidence for it.
references:
- reference: PMID:41208147
  title: "Mixed Gonadal Dysgenesis: A Comprehensive Review of Clinical Spectrum, Diagnostic Strategies, and Management Approaches."
- reference: PMID:37882230
  title: "45,X/46,XY mosaicism: Clinical manifestations and long term follow-up."
review_notes: >-
  This PR caches more references than the entry cites. Nine are cited; the rest
  were fetched by the deep-research report's own citation-validation pass, which
  resolves every identifier the report mentions, and the report is committed
  alongside the entry. Four were fetched by hand during curation and then set
  aside rather than cited: PMID:34539919 (growth hormone dynamics in MGD, whose
  findings are already carried by the two cohort studies cited), PMID:34566299
  (clinical and reproductive characteristics, superseded by the 2025 review),
  and two included in the GBY search of which PMID:19306348 and PMID:30753444
  were subsequently cited. Nothing was cited without being read.
notes: >-
  Scope and modelling decisions.

  No genetic section. The disease has no causal gene - MONDO records none, and
  the preflight gene-identity check could not run for that reason. SHOX and SRY
  appear inside pathophysiology nodes because the mechanism runs through their
  dosage, but neither is a disease gene here and listing them under genetic would
  misrepresent a chromosomal disorder as a monogenic one.

  No animal models. Mouse gonadal-determination work is cited as evidence for the
  SRY-SOX9-FGF9-WNT4 switch, but those animals are not mosaic and so are not
  models of this disease; they are models of the pathway the mosaicism perturbs.
  Curating them as animal_models would assert a correspondence that does not
  exist.

  No environmental section. Post-zygotic chromosome loss has no established
  environmental contributor.

  No has_subtypes. The phenotypic range is continuous and set by mosaic
  distribution, so any cut point - female-raised versus male-raised, Turner-like
  versus genital-predominant - would be a description of ascertainment rather than
  of biology. The variation is carried by the cohort denominators recorded on
  individual phenotypes instead.

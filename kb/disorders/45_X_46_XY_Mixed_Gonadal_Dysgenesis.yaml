      quote_role: REVIEW_SYNTHESIS
      snippet: Short stature is a common clinical feature in individuals with MGD and is typically attributed to the 45,X cell line, and associated haploinsufficiency of the SHOX gene
      explanation: Supports a growth contribution, not causation of the entire Turner phenotype.
- name: Impaired Spermatogenesis
  biological_scale: CELLULAR
  description: Germ-cell maturation is impaired in some dysgenetic testes. A multicenter male cohort found both focal and arrested spermatogenesis, while some men retained motile sperm. Histologic observations and semen results came from different assessed subsets; neither establishes complete absence of fertility potential throughout the mosaic population.

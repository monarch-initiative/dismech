      An antenatally established connectivity deficit is the developmental half of
      the developmental and epileptic encephalopathy.
  - target: Progressive Brain Atrophy and Leukoencephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same brains that start hypomyelinated go on to shrink, but nothing
      published establishes whether the progressive loss is a continuation of the
      developmental lesion or a separate degenerative process.
- name: Neuronal Hyperexcitability and Hypersynchrony
  description: >-
    Populations of neurons fire excessively and synchronously. In DEE81 the
    signature is electrographic: the founding cohort's phenotype was Ohtahara
    syndrome, defined by a suppression-burst EEG in which high-amplitude
    synchronous bursts alternate with near-flat suppression, from the first weeks
    of life. This node captures the single concept of network hyperexcitability
    and conforms to the shared epilepsy final common pathway.
  role: central_effector
  biological_scale: CELLULAR
  conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
  cell_types:

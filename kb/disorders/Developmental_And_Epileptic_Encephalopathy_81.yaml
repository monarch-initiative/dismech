        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        snippet: "Altered lysosomal homeostasis and defective autophagy were recapitulated in Dmxl2-silenced mouse hippocampal neurons, which exhibited impaired neurite elongation and synaptic loss."

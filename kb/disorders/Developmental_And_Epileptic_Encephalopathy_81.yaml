- name: Brain MRI
  description: >-
    Imaging supports the diagnosis rather than making it, but it is informative
    in both directions. Unlike many DEEs, early MRI in DEE81 is not normal: a
    thin corpus callosum with hypomyelination was present in every patient in the
    first months of life, and repeat imaging shows progressive shrinkage with
    leukoencephalopathy. A normal early scan would therefore argue against DEE81.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT

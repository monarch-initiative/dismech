    explanation: "Connects DMXL2 specifically to getting the V-ATPase onto synaptic vesicles, which is what makes this node a DMXL2 consequence rather than a general statement about the pump. Evidence source is OTHER because this is a review; one of its authors co-authored the founding DEE81 report."
  downstream:
  - target: Neuronal Hyperexcitability and Hypersynchrony

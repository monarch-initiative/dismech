    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Continuous early-life epileptic activity is conventionally held to worsen
      development, and it is the epileptic half of the name, but in DEE81 the
      developmental deficit is already present at birth and no study separates the
      seizure-driven contribution from the antenatal one.

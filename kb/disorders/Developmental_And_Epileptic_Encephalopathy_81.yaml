animal_models:
- name: Dmxl2 heterozygous mouse
  species: Mouse
  genotype: Dmxl2 heterozygous null
  publication: PMID:39273013
  description: >-
    The only viable mouse genotype available for this gene. Complete loss of
    Dmxl2 is embryonic lethal in mice, so the genotype that matches the patients
    - biallelic null - cannot be studied in a whole animal. Heterozygous mice are
    viable and show macrocephaly and corpus callosum dysplasia.
  genes:
  - preferred_term: DMXL2
    term:
      id: hgnc:2938
      label: DMXL2
  evidence:
  - reference: PMID:39273013
    reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Complete loss of Dmxl2 is lethal at the embryonic stage in mice"
    explanation: "The homozygous null, which is the genotype matching the patients, does not survive to birth in mice - which is why the heterozygote is the only viable mouse. Evidence source is OTHER because this is a review reporting other groups' mouse work rather than an original animal study."
  modeled_mechanisms:
  - target: Impaired Prenatal Brain Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Corpus callosum dysplasia in the heterozygous mouse is the one finding that
      lines up with the human disease, where a thin corpus callosum is present on
      the earliest MRI of every patient. It supports the claim that DMXL2 dosage
      matters for commissural development.
    limitations: >-
      The zygosity is wrong. DEE81 is recessive and the heterozygous carriers in
      all three founding families were clinically unaffected, so a mouse that is
      abnormal at half dosage is not modelling the human carrier state either.
      The mouse also has macrocephaly, which the founding cohort does not, and
      none of the defining features of the disease - neonatal seizures,
      suppression-burst EEG, deafness, progressive atrophy - is reported in it.
      The matched homozygous null is embryonic lethal, so the fidelity of this
      model to the human recessive disease is low by construction rather than by
      measurement.
    readouts:
    - name: Corpus callosum morphology
      target: Impaired Prenatal Brain Development
      direction: ALTERED
      interpretation: >-
        Callosal dysplasia at half Dmxl2 dosage is the murine counterpart of the
        thin corpus callosum seen on early human MRI.
      evidence:
      - reference: PMID:39273013
        reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: OTHER
        snippet: "heterozygous DMXL2 mice show macrocephaly and corpus callosum dysplasia"
        explanation: "The reported callosal and head-size findings in the heterozygous mouse."
    evidence:
    - reference: PMID:39273013
      reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "uncovering the relevance of early v-ATPase regulation in brain development and function"
      explanation: "The review's own reading of why the mouse dosage phenotype is informative for brain development, which is the claim that makes this model relevant to this node. Directness is INDIRECT because it is a general statement about v-ATPase regulation rather than about DEE81."
discussions:
- discussion_id: dee81_no_whole_animal_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Every mechanistic result in DEE81 comes from a fibroblast or a dissociated
    neuron culture, and the mouse genotype that matches the patients does not
    survive to birth. How much of the human disease can the available models
    actually speak to?
  attaches_to:
  - animal_models#Mouse
  - experimental_models#Dmxl2-silenced mouse hippocampal neuron culture
  - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
  rationale: >-
    Complete loss of Dmxl2 is embryonic lethal in mice, so no whole-organism
    model of the recessive human genotype exists; the viable heterozygote has the
    wrong zygosity and a phenotype (macrocephaly) the patients do not have. The
    two systems that do carry the human lesion - patient fibroblasts and
    Dmxl2-silenced neurons - are both cultures, and neither can produce a
    seizure, an EEG, myelin, or a progressive atrophy. That is why the edges from
    the cellular defects to network hyperexcitability are marked
    INDIRECT_UNKNOWN_INTERMEDIATES: the gap is not that nobody has looked, it is
    that the systems available cannot look.
  evidence:
  - reference: PMID:39273013
    reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Complete loss of Dmxl2 is lethal at the embryonic stage in mice"
    explanation: "Establishes that the genotype-matched whole-animal model cannot be made by simple knockout."
  proposed_experiments:
  - experiment_id: dee81_hypomorphic_and_conditional_mouse
    name: Conditional or hypomorphic Dmxl2 mouse carrying a human DEE81 allele
    description: >-
      Because the constitutive null is embryonic lethal, a viable model needs
      either a conditional allele deleted after the lethal window or a knock-in of
      a human DEE81 allele that leaves the residual function compatible with
      survival. Phenotyping would need EEG, myelination and serial imaging, since
      those are the features no current model can report.
    would_support:
    - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
    - pathophysiology#Impaired Prenatal Brain Development
    supporting_outcome:
    - >-
      Neonatal-onset seizures with a discontinuous EEG, hypomyelination and
      progressive volume loss in a viable Dmxl2 mouse would put the human
      mechanism chain on whole-organism footing.
    refuting_outcome:
    - >-
      A viable Dmxl2 mouse with the cellular lysosomal phenotype but no seizures
      and normal myelination would argue that the human epilepsy depends on
      something the mouse does not share, and would move the mismatch from
      "untested" to "tested and divergent".
- discussion_id: dmxl2_phenotypic_expansion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the milder DMXL2 phenotype - intellectual disability with epilepsy,
    macrocephaly and dysmorphism, but without neonatal Ohtahara syndrome, deafness
    or early death - part of DEE81, or a separate allelic disorder?
  attaches_to:
  - genetic#DMXL2
  - prevalence#Worldwide
  rationale: >-
    A homozygous DMXL2 truncating variant was reported in a child with
    intellectual disability, epilepsy, macrocephaly and dysmorphism. The reporting
    group classified it as a phenotype different enough from the published DMXL2
    associations to represent a phenotypic expansion or a potentially distinct
    allelic disorder, and contrasted it explicitly with the endocrine phenotype.
    A later review counts the same patient as an additional DMXL2 developmental
    and epileptic encephalopathy case. Both readings are defensible from the
    published text and they give different answers to how many DEE81 patients
    exist, which is why the prevalence record here counts only the seven patients
    described as this disease. Resolving it needs the residual-function question
    answered: the polyendocrine phenotype is reported with a variant retaining
    partial transcript, and whether this child's truncating allele leaves residual
    protein has not been measured.
  evidence:
  - reference: PMID:30237576
    reference_title: "Autozygome and high throughput confirmation of disease genes candidacy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also found that DMXL2 harbors a homozygous truncating variant"
    explanation: "The primary report of the additional homozygous DMXL2 patient at issue."
  - reference: PMID:30237576
    reference_title: "Autozygome and high throughput confirmation of disease genes candidacy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "although the associated phenotypes are sufficiently different from the original reports that they represent phenotypic expansion or potentially distinct allelic disorders"
    explanation: "The reporting group's own classification of this class of finding, which is what makes the assignment genuinely open rather than settled."
  - reference: PMID:39273013
    reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "An additional homozygous variant in DMXL2 has been reported in a patient with consanguineous parents and presenting DEE and macrocephaly"
    explanation: "The later review counts the same patient as a DMXL2 DEE case, which is the competing reading. Evidence source is OTHER because this is a review."
- discussion_id: dee81_seizure_route
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which arm of the V-ATPase assembly failure actually generates the seizures in
    DEE81 - the presynaptic vesicle-filling failure, or the lysosomal and
    autophagic block with its consequences for neurite and synapse development?
  attaches_to:
  - pathophysiology#Neuronal Hyperexcitability and Hypersynchrony
  - pathophysiology#Impaired Synaptic Vesicle Loading
  - pathophysiology#Impaired Neurite Elongation and Synapse Formation
  rationale: >-
    Both routes are supported at the level of cell biology and neither has been
    tested against network excitability. The published patient-cell work
    establishes the lysosomal and autophagic block; the synaptic-vesicle route is
    stated as a suggestion in a review. No electrophysiological recording has been
    reported from a DEE81 neuron or from a Dmxl2-deficient network, so the step
    from either cellular defect to hypersynchronous discharge is unmeasured. This
    matters therapeutically: the two routes imply different intervention points.
  proposed_experiments:
  - experiment_id: dee81_neuron_excitability_phenotyping
    name: Excitability phenotyping of DEE81 patient-derived neurons
    description: >-
      Differentiate neurons from DEE81 patient iPSCs and from isogenic corrected
      controls, plate on multi-electrode arrays, and record spontaneous and evoked
      network activity alongside vesicular pH, vesicular neurotransmitter content,
      autophagic flux, neurite length and synapse density in the same cultures.
      Selective pharmacological or genetic rescue of vesicular acidification
      versus of autophagic flux would then separate the two routes.
    would_support:
    - pathophysiology#Impaired Synaptic Vesicle Loading
    - pathophysiology#Impaired Neurite Elongation and Synapse Formation
    supporting_outcome:
    - >-
      Network hyperexcitability that is corrected by rescuing one arm and not the
      other identifies that arm as the proximate route to the epilepsy.
    refuting_outcome:
    - >-
      Hyperexcitability that persists when both arms are rescued individually, or
      absent network hyperexcitability in a genuinely null neuron, would indicate
      that neither cellular defect is the proximate cause.
- discussion_id: dmxl2_allelic_heterogeneity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does DMXL2 produce three clinically distinct human phenotypes - recessive
    DEE81, dominant non-syndromic deafness DFNA71, and a polyendocrine and
    polyneuropathy syndrome - and what determines which one a given allele causes?
  attaches_to:
  - genetic#DMXL2
  rationale: >-
    Distinguishing these entities is a practical curation and diagnostic problem,
    not only a mechanistic one: a gene-level literature or variant search on DMXL2
    returns all three, and their evidence must not be mixed. Zygosity is the
    obvious axis - DEE81 and the polyendocrine syndrome are biallelic while DFNA71
    is heterozygous - but nothing published explains why one biallelic
    loss-of-function genotype produces a neonatal encephalopathy and another
    produces an endocrine and peripheral-nerve phenotype, and no allelic series
    with matched functional measurements exists. Note also that heterozygous
    DMXL2 deletions occur incidentally in aromatase excess syndrome, where the
    causal lesion is a neighbouring CYP19A1 rearrangement; those carriers are not
    reported to have any DMXL2-attributable phenotype.
  evidence:
  - reference: PMID:34249946
    reference_title: "RAVE and Rabconnectin-3 Complexes as Signal Dependent Regulators of Organelle Acidification."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Mutations in DMXL2 have been connected to Ohtahara Syndrome, nonsyndromic hearing loss, and neuroendocrine dysfunction (Tata et al., 2014; Chen et al., 2017; Esposito et al., 2019)."
    explanation: "Establishes that DMXL2 carries three distinct disease associations, which is the premise of this gap. Evidence source is OTHER because this is a review."
notes: >-
  Scope. Only sources about the biallelic, recessive neurological phenotype are
  cited for disease claims. DMXL2 also causes autosomal dominant non-syndromic
  deafness DFNA71 and a polyendocrine and polyneuropathy syndrome, and the mouse
  and hair-cell literature on Dmxl2 is largely written against the deafness
  phenotype; none of it is used here to support a DEE81 claim. The DMXL2 mentions
  in Aromatase_Excess_Syndrome are a neighbouring-locus artefact - heterozygous
  15q21.2 rearrangements that delete DMXL2 exons while creating a chimeric
  CYP19A1 transcript - and are not coverage of this disease.

  Evidence grading. PMID:31688942 is deliberately graded three ways, because it
  reports three kinds of study: the family genotypes, clinical course and MRI are
  HUMAN_CLINICAL; the fibroblast and cultured-neuron experiments are IN_VITRO;
  and the sentences that summarise DMXL2 function or define Ohtahara syndrome are
  OTHER, because they are background rather than results of this study. The
  Dmxl2-silenced hippocampal neurons are IN_VITRO and not MODEL_ORGANISM: they
  are a dissociated primary culture, not a whole animal.

  Three phenotypes are deliberately left unattached to the pathograph:
  hearing impairment, peripheral neuropathy and dysmorphic features. They are
  well attested clinically - the founding report names all three - but no source
  explains how loss of DMXL2 produces them, and DEE81 has no reported extraneural
  mechanism work at all. Drawing an edge from any existing node to them would be
  asserting a mechanism nobody has shown. The hair-cell work that would speak to
  the deafness is written against DFNA71 and is not used here for the reason
  given above.

  Deep-research cross-check. A falcon deep-research run
  (research/Developmental_And_Epileptic_Encephalopathy_81-deep-research-falcon.md,
  19 citations) passed the NEC gate against MONDO:0032858 with DMXL2 the dominant
  gene at 49 mentions and no competing gene, and its content is DEE81-specific
  throughout - it separates the three DMXL2 diseases explicitly rather than
  blending them. Comparing it against this entry surfaced four things, all
  incorporated: the Falace 2024 V-ATPase review as the source for DMXL2's role in
  getting the pump onto synaptic vesicles, the mouse genetics (embryonic lethal
  null, macrocephalic heterozygote), the additional homozygous DMXL2 patient
  reported by Maddirevula et al., and the model-fidelity problem that follows
  from the lethal null.

  It also surfaced findings that could not be curated, and the reason is a cache
  limit rather than a judgement: the report reads the founding paper's full text,
  while references_cache/PMID_31688942.md is abstract-only. Brain 2019 is not
  deposited in PMC (checked), so there is no route to the full text through the
  reference fetcher, and an evidence item needs an exact quote from cached text.
  The uncurated findings are per-patient seizure semiology (tonic predominant,
  some myoclonic), hypotonia and quadriparesis in 6/6, simplified gyral pattern
  in 2/6, the specification of the deafness as sensorineural in 6/6, and the
  rescue of the fibroblast lysosomal phenotype by wild-type DMXL2 re-expression.
  Each is a real finding from the paper's results section and each should be
  added if the full text ever becomes quotable; none is asserted here on the
  strength of a secondary summary.

  What is not curated. There is no whole-organism model of the human genotype:
  the homozygous Dmxl2 null is embryonic lethal in mice, so the animal_models
  entry is the heterozygote, at low fidelity and with that stated. There are no biochemical markers, no datasets, no
  clinical trials and no environmental factors, because none are described in the
  DEE81 literature. Seizure semiology beyond the founding cohort's Ohtahara
  diagnosis and the one later focal-onset case is not curated, because the
  abstracts do not itemise it.

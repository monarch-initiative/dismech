  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Altered lysosomal homeostasis and defective autophagy were recapitulated in Dmxl2-silenced mouse hippocampal neurons, which exhibited impaired neurite elongation and synaptic loss."
    explanation: "Reproduces the cellular defect in neurons and adds the neurite and synapse phenotype. Evidence source is IN_VITRO because this is a cultured primary neuron preparation, not a whole animal."
  downstream:
  - target: Impaired Prenatal Brain Development
    causal_link_type: DIRECT
    description: >-
      Neurons that cannot extend processes or form synapses cannot build normal
      connectivity in the developing brain.
  - target: Neuronal Hyperexcitability and Hypersynchrony
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - lysosomal_autophagy_route
    description: >-
      Proposed, not demonstrated: abnormally wired networks with reduced synaptic
      density are the route to hypersynchronous discharge on this hypothesis. No
      excitability measurement has been reported in this model or in patient
      neurons.
- name: Impaired Prenatal Brain Development
  description: >-
    Connectivity fails to reach the expected stage by birth. Imaging in the first
    months of life already shows a thin corpus callosum and brain hypomyelination
    in every patient, which is a prenatal rather than a postnatal deficit. This
    node captures the single concept of an antenatally established structural
    brain deficit.
  role: mediator
  biological_scale: TISSUE
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early brain MRI investigations in the first months of life revealed thin corpus callosum with brain hypomyelination in all."
    explanation: "Structural evidence, present from the earliest imaging, that brain development was already abnormal before birth."
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT

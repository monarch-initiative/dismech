name: Developmental and Epileptic Encephalopathy 81
creation_date: "2026-09-02T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 81
  term:
    id: MONDO:0032858
    label: developmental and epileptic encephalopathy, 81
synonyms:
- DEE81
- DEE 81
- EIEE81
- Epileptic encephalopathy, early infantile, 81
- DMXL2-related Ohtahara syndrome
description: >-
  Developmental and epileptic encephalopathy 81 (DEE81) is an autosomal recessive,
  neonatal-onset epileptic encephalopathy caused by biallelic loss-of-function
  variants in DMXL2. It was delineated in three unrelated families, each with an
  affected sibling pair, whose phenotype was Ohtahara syndrome - intractable
  seizures from the first day of life on a suppression-burst EEG background, with
  profound developmental impairment. Deafness, mild peripheral polyneuropathy and
  dysmorphic features accompany the epilepsy, so DEE81 is a syndromic rather than
  an isolated epilepsy.

  The mechanism is not a channelopathy. DMXL2 encodes rabconnectin-3alpha, a very
  large scaffold that, together with WDR7 (rabconnectin-3beta) and the linker
  ROGDI, forms the metazoan RAVE complex - the machine that assembles the V1 and
  VO halves of the vacuolar H+-ATPase on a membrane. Everything downstream of that
  assembly step depends on it: lysosomes and endosomes cannot be acidified,
  synaptic vesicles cannot be loaded with neurotransmitter, and the assembled
  V-ATPase can no longer recruit ATG16L1 for LC3 conjugation. DEE81 is therefore
  an encephalopathy of failed organelle acidification, and the patient-level
  evidence matches: fibroblasts lacking DMXL2 protein show a disturbed
  endolysosomal compartment and blocked autophagic flux, and the same defect in
  cultured mouse hippocampal neurons costs them neurite elongation and synapses.

  The natural history is degenerative as well as developmental. Brain MRI in the
  first months already shows a thin corpus callosum with hypomyelination, and
  follow-up imaging shows progressive brain shrinkage with leukoencephalopathy;
  five of the six patients of the founding cohort died within the first nine years
  of life, and none acquired any developmental, communicative or motor skill after
  birth. That combination - a prenatal developmental deficit followed by a
  progressive course - is what the founding report argues distinguishes this
  entity.

  Two things are deliberately left open. First, which arm of the V-ATPase failure
  actually generates the seizures. The synaptic-vesicle route (failed vesicular
  acidification, so failed neurotransmitter loading) and the lysosomal-autophagy
  route (failed degradation, so failed neurite and synapse development, with
  progressive neuronal loss) are both supported at the level of cell biology, and
  neither has been shown to be the proximate cause of the epilepsy; the two are
  curated as competing hypothesis groups rather than as one asserted chain.
  Second, DMXL2 causes three clinically distinct human phenotypes - this recessive
  encephalopathy, a dominant non-syndromic deafness (DFNA71), and a
  polyendocrine-polyneuropathy syndrome - and no published work explains what
  makes one allele produce one and not another. Only DEE81 sources are cited here.

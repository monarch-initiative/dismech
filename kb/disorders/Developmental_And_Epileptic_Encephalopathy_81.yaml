genetic:
- name: DMXL2
  gene_term:
    preferred_term: DMXL2
    term:
      id: hgnc:2938
      label: DMXL2
  association: Causative
  features: >-
    Biallelic loss-of-function DMXL2 alleles cause DEE81. Reported genotypes are
    homozygous or compound heterozygous and include nonsense (p.Ser1493*),
    splice-acceptor (c.7518-1G>A, predicted p.Trp2507Argfs*4) and missense
    (p.Ala1712Val) substitutions; patient fibroblasts carry no detectable DMXL2
    protein, so the alleles behave as nulls at the protein level. Heterozygous
    carriers in these families were unaffected. DMXL2 encodes
    rabconnectin-3alpha, a subunit of the metazoan RAVE complex that assembles the
    vacuolar H+-ATPase.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Siblings in Family 1 were compound heterozygous for the c.5135C>T (p.Ala1712Val) missense substitution and the c.4478C>G (p.Ser1493*) nonsense substitution; in Family 2 were homozygous for the c.4478C>A (p.Ser1493*) nonsense substitution and in Family 3 were homozygous for the c.7518-1G>A (p.Trp2507Argfs*4) substitution."
    explanation: "The causal genotypes reported across the three founding families."
  - reference: PMID:34249946
    reference_title: "RAVE and Rabconnectin-3 Complexes as Signal Dependent Regulators of Organelle Acidification."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "DMXL2 (Rabconnectin-3α) and WDR7 (Rabconnectin-3β) together comprise a synaptic Rabconnectin-3 complex in an apparent 1:1 ratio (Kawabe et al., 2003)."
    explanation: "Identifies the gene product as rabconnectin-3alpha and its obligate partner. Evidence source is OTHER because this is a review."

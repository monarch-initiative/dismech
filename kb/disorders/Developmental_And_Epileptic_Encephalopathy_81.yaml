- phase: Neonatal presentation
  age_range: First day of life
  notes: >-
    Seizures begin on the first day of life, on a suppression-burst EEG
    background, and are refractory to multiple antiseizure medications from the
    outset.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The severe developmental and epileptic encephalopathy manifested from the first day of life and was associated with deafness, mild peripheral polyneuropathy and dysmorphic features."
    explanation: "Dates the onset of the encephalopathy to the first day of life."
- phase: Developmental arrest from birth
  notes: >-
    Milestones are not merely delayed: no patient of the founding cohort acquired
    any developmental, communicative or motor skill after birth. The structural
    correlate is already visible on the first MRI, as a thin corpus callosum with
    hypomyelination.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients died within the first 9 years of life and none achieved developmental, communicative or motor skills following birth."
    explanation: "Records that no skill was acquired at any point after birth."
- phase: Progressive neurodegenerative course
  notes: >-
    On follow-up imaging the brain shrinks and develops leukoencephalopathy, so
    the course is degenerative as well as developmental. This is the feature the
    founding report treats as distinguishing.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."

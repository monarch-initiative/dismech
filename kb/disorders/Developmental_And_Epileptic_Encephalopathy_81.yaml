- name: Dmxl2-silenced mouse hippocampal neuron culture
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured primary mouse hippocampal neurons in which Dmxl2 is knocked down.
    The only neuronal model reported for this disease, and the only place the
    neurite and synapse phenotype has been observed.
  publication: PMID:31688942
  modeled_mechanisms:
  - target: Impaired Neurite Elongation and Synapse Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Silencing Dmxl2 in neurons reproduces the lysosomal and autophagic defect
      seen in patient cells and adds the neuron-specific consequence: neurites
      fail to elongate and synapses are lost.
    limitations: >-
      This is acute RNA-interference knockdown in mouse neurons, not a
      constitutive biallelic human null, so residual protein and off-target
      effects are not excluded; and it is a dissociated culture, which cannot
      report the network-level excitability that would connect this node to the
      seizures.
    readouts:
    - name: Neurite length and synapse number
      target: Impaired Neurite Elongation and Synapse Formation
      direction: DECREASED
      interpretation: >-
        Reduced neurite elongation and synaptic loss are the measured correlates
        of this node.

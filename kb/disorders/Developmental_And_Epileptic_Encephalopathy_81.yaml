treatments:
- name: Antiseizure Medication
  description: >-
    Multiple antiseizure medications were used in the one DEE81 patient whose
    treatment course is described, and seizures persisted. No disease-modifying
    therapy exists, and no antiseizure agent has been reported to control seizures
    in this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40180340
    reference_title: "Neonate with developmental and epileptic encephalopathy 81 (DEE81): lessons learnt and future implications."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite initial treatment with multiple antiepileptics, seizures persisted, prompting a thorough diagnostic evaluation."
    explanation: "Documents that multiple antiseizure medications were given and did not control the seizures."
  notes: >-
    No specific agent is named as effective in either report, so no
    therapeutic_agent is bound. The evidence here is that antiseizure medication
    was tried and failed, not that it is a recommended therapy.

    No target_mechanisms link is asserted either, and that is deliberate rather
    than an omission. TreatmentEffectEnum offers INHIBITS, ACTIVATES, MODULATES,
    BYPASSES and RESTORES; every one of them would claim an effect on
    Neuronal Hyperexcitability and Hypersynchrony that the only cited evidence
    contradicts, since the seizures persisted. Antiseizure medications do act on
    neuronal excitability as a class, but in this disease that is the intent, not
    the observed outcome, and the enum has no value for an intended target that
    failed. Recording the failure in prose is more accurate than encoding an
    effect that did not occur.
experimental_models:
- name: DEE81 patient-derived skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Primary dermal fibroblasts from affected individuals, which contain no
    detectable DMXL2 protein and reproduce the endolysosomal and autophagic
    defect. The most direct human model of the cellular lesion, but a
    non-neuronal one.

      label: Autosomal recessive inheritance
  description: >-
    DEE81 is autosomal recessive. Affected individuals carry biallelic DMXL2
    loss-of-function alleles, either homozygous or compound heterozygous; the
    founding cohort was three sibling pairs from three unrelated families, and the
    one subsequently reported patient was homozygous and born of a consanguineous
    union.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole exome sequencing, we identified biallelic DMXL2 mutations in three sibling pairs with Ohtahara syndrome, belonging to three unrelated families."
    explanation: "Establishes biallelic DMXL2 variants segregating with the phenotype in three independent families, which is the basis for recessive inheritance."
  - reference: PMID:40180340
    reference_title: "Neonate with developmental and epileptic encephalopathy 81 (DEE81): lessons learnt and future implications."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through advanced genomic testing, a homozygous nonsense variant in the DMXL2 gene was identified, leading to the diagnosis of DEE81."
    explanation: "An independent, consanguineous case homozygous for a DMXL2 nonsense allele, consistent with autosomal recessive inheritance."
mechanistic_hypotheses:
- hypothesis_group_id: synaptic_vesicle_route
  hypothesis_label: Seizures arise from failed synaptic-vesicle acidification and neurotransmitter loading
  status: EMERGING
  description: >-
    DMXL2 is enriched in brain and at synaptic terminals, and the V-ATPases that
    acidify synaptic vesicles - and so drive neurotransmitter loading - depend on
    rabconnectin-3alpha for assembly. On this model the epilepsy is a synaptic
    transmission failure, and the lysosomal and autophagic abnormalities are a
    parallel consequence of the same assembly defect rather than the route to the
    seizures. It is EMERGING rather than canonical because the proposal is
    explicitly framed as a suggestion in the source review, and no
    electrophysiological measurement has been made in a DEE81 neuron.
  notes: >-
    Distinguishing experiment would be a synaptic-vesicle pH and vesicular
    neurotransmitter-filling measurement in DEE81 patient-derived neurons, with
    network excitability recorded in the same preparation.
- hypothesis_group_id: lysosomal_autophagy_route
  hypothesis_label: Seizures arise from lysosomal and autophagic failure with defective neurite and synapse development
  status: EMERGING
  description: >-
    On this model the proximate lesion is the endolysosomal and autophagic block
    that is directly demonstrated in patient fibroblasts, and the epilepsy follows
    from the resulting failure of neurite elongation and synapse formation, which
    was reproduced in Dmxl2-silenced mouse hippocampal neurons. This is the arm
    with the most direct experimental support in patient material, but the step
    from impaired neurite and synapse development to hypersynchronous discharge
    has not been measured.
  notes: >-
    The founding report's own conclusion takes this route, but it argues from
    fibroblast and cultured-neuron data to a clinical syndrome without an
    intervening excitability measurement.
pathophysiology:
- name: Biallelic DMXL2 Loss of Function
  description: >-
    Biallelic DMXL2 variants - nonsense, splice-site and missense alleles - are the
    initiating lesion, and they behave as a null: patient fibroblasts contain no
    detectable DMXL2 protein. This node captures the single concept of the genetic
    lesion.
  role: trigger
  biological_scale: MOLECULAR
  gene:
    preferred_term: DMXL2
    modifier: DECREASED
    term:
      id: hgnc:2938
      label: DMXL2
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Siblings in Family 1 were compound heterozygous for the c.5135C>T (p.Ala1712Val) missense substitution and the c.4478C>G (p.Ser1493*) nonsense substitution; in Family 2 were homozygous for the c.4478C>A (p.Ser1493*) nonsense substitution and in Family 3 were homozygous for the c.7518-1G>A (p.Trp2507Argfs*4) substitution."
    explanation: "Lists the causal biallelic genotypes across the three founding families."
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "Expression analysis in patient-derived skin fibroblasts demonstrated absence of the DMXL2 protein, revealing a loss of function phenotype."
    explanation: "Shows the alleles are functionally null at the protein level in patient cells, which is why this node is modelled as complete loss of function."
  downstream:
  - target: Failed mRAVE-Dependent V-ATPase Assembly
    causal_link_type: DIRECT
    description: >-
      Absence of DMXL2 protein removes the rabconnectin-3alpha subunit of the
      metazoan RAVE complex that assembles the V-ATPase.
- name: Failed mRAVE-Dependent V-ATPase Assembly
  description: >-
    DMXL2 (rabconnectin-3alpha) is one of the two alternative large subunits of the
    metazoan RAVE complex, which also contains WDR7 and the linker ROGDI. mRAVE
    catalyses the joining of the cytosolic V1 and membrane-embedded VO halves of
    the vacuolar H+-ATPase after the proton gradient has been dissipated. Without
    it, the pump cannot be reassembled on demand, and every membrane compartment
    that depends on regulated V-ATPase assembly loses its acidification capacity.
    DMXL2 is the brain-enriched paralogue, which is why loss is tolerated
    elsewhere and not in neurons.
  role: mediator
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: proton-transporting V-ATPase complex assembly
    modifier: DECREASED
    term:
      id: GO:0070071
      label: proton-transporting two-sector ATPase complex assembly
  evidence:
  - reference: PMID:40646309
    reference_title: "A heterotrimeric protein complex assembles the metazoan V-ATPase upon dissipation of proton gradients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "mRAVE consists of DMXL1 or DMXL2, WDR7 and the central linker ROGDI."
    explanation: "Identifies DMXL2 as an alternative core subunit of the metazoan RAVE complex, the assembly factor this node is about."
  - reference: PMID:40646309
    reference_title: "A heterotrimeric protein complex assembles the metazoan V-ATPase upon dissipation of proton gradients."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: "mRAVE then catalyzes V1-VO assembly, enabling lysosomal acidification, neurotransmitter loading into vesicles and ATG16L1 recruitment for LC3/ATG8 conjugation onto single membranes."
    explanation: "States the three downstream functions that depend on mRAVE-catalysed assembly, which are the three branches taken from this node."
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "DMXL2 is highly expressed in the brain and at synaptic terminals, regulates v-ATPase assembly and activity and participates in intracellular signalling pathways"
    explanation: "The founding report's own statement of DMXL2's function; evidence source is OTHER because this sentence is the paper's background summary of prior work, not a result of the study."
  - reference: PMID:34249946
    reference_title: "RAVE and Rabconnectin-3 Complexes as Signal Dependent Regulators of Organelle Acidification."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "DMXL2 expression is highly enriched in brain, although it is also expressed in other tissues."
    explanation: "Explains why loss of the DMXL2 paralogue produces a brain-predominant phenotype while the ubiquitous DMXL1 paralogue continues to serve other tissues. Evidence source is OTHER because this is a review."
  - reference: PMID:39273013
    reference_title: "V-ATPase Dysfunction in the Brain: Genetic Insights and Therapeutic Opportunities."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "The DMXL2 gene encodes for rabconnectin-3α, a member of the WD40 repeat (WDR) protein family that is highly expressed in the brain."
    explanation: "Independent statement of the gene product's identity and its brain enrichment. Evidence source is OTHER because this is a review."
  downstream:
  - target: Defective Endolysosomal Acidification
    causal_link_type: DIRECT
    description: >-
      Without on-demand V1-VO assembly, endosomes and lysosomes cannot maintain
      their acidic lumen.
  - target: Impaired Synaptic Vesicle Loading
    causal_link_type: DIRECT
    description: >-
      Vesicular neurotransmitter transporters run on the proton-motive force the
      V-ATPase generates, so failure to assemble the pump on synaptic vesicles
      leaves them unfilled.
- name: Defective Endolysosomal Acidification
  description: >-
    Patient fibroblasts show a disturbed endolysosomal compartment: an increased
    LysoTracker signal alongside reduced endolysosomal markers and reduced
    degradative capacity. This node captures the single concept of a
    dysfunctional, incorrectly acidified endolysosomal system.

- name: Impaired Synaptic Vesicle Loading
  description: >-
    Loading of neurotransmitter into a synaptic vesicle is driven by the proton
    gradient the vesicular V-ATPase generates. Where the pump cannot be assembled,
    vesicles are not filled. This node captures the single concept of a
    presynaptic vesicle-filling failure and is the entry point of the
    synaptic-vesicle hypothesis for the epilepsy.
  role: mediator
  biological_scale: CELLULAR
  cell_types:

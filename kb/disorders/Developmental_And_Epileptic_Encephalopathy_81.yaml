- name: Developmental Encephalopathy
  description: >-
    Profound, non-progressing-forward developmental impairment: patients acquired no
    developmental, communicative or motor skill after birth. Both the antenatal
    connectivity deficit and the neonatal-onset epilepsy converge here. This node
    captures the single concept of the developmental half of the syndrome.
  role: consequence

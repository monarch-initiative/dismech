- name: Progressive Brain Atrophy and Leukoencephalopathy
  description: >-
    Serial imaging shows the brain losing volume, with white-matter disease, over
    follow-up - a degenerative course superimposed on the developmental deficit.
    This node captures the single concept of progressive structural brain loss and
    is what distinguishes DEE81 from a static encephalopathy.
  role: consequence

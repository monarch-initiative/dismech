      abnormality directly.
    limitations: >-
      Fibroblasts are not neurons and express the ubiquitous DMXL1 paralogue,
      so the magnitude of the defect in a fibroblast is not a guide to its
      magnitude in a brain-enriched, DMXL2-dependent cell.

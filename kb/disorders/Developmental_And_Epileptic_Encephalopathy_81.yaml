differential_diagnoses:
- name: Other genetic causes of Ohtahara syndrome
  description: >-
    Ohtahara syndrome is an electroclinical diagnosis, not an aetiology: the same
    neonatal suppression-burst picture is produced by variants in many different
    genes, so identifying Ohtahara syndrome does not identify DEE81. The founding
    report says exactly this, which is why the cohort needed exome sequencing to
    be resolved.
  distinguishing_features:
  - >-
      Three features separate DEE81 from a typical channelopathy or synaptopathy
      Ohtahara syndrome. It is syndromic - deafness, mild peripheral polyneuropathy
      and dysmorphic features accompany the epilepsy. Its early MRI is abnormal,
      with a thin corpus callosum and hypomyelination in every patient, where many
      other Ohtahara aetiologies have normal early imaging. And it is progressive,
      with brain shrinkage and leukoencephalopathy on follow-up scans. Inheritance
      is recessive, so an affected sibling pair is expected and a de novo variant
      is not.
  evidence:
  - reference: PMID:31688942
    reference_title: "Biallelic DMXL2 mutations impair autophagy and cause Ohtahara syndrome with progressive course."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    snippet: "Ohtahara syndrome, early infantile epileptic encephalopathy with a suppression burst EEG pattern, is an aetiologically heterogeneous condition starting in the first weeks or months of life with intractable seizures and profound developmental disability."
    explanation: "States the aetiological heterogeneity that makes the electroclinical diagnosis insufficient on its own. Evidence source is OTHER because this sentence is the paper's background definition."
  notes: >-
    Individual alternative aetiologies are not enumerated here, because the DEE81
    sources do not list them and inventing a gene list would not be sourced. The
    knowledge base curates several of them separately, including
    STXBP1_Encephalopathy, KCNQ2_Developmental_and_Epileptic_Encephalopathy and
    SCN2A-Related_Developmental_and_Epileptic_Encephalopathy.
- name: STXBP1 encephalopathy
  description: >-
    The best-characterised single-gene cause of Ohtahara syndrome, and the one a
    neonate with refractory seizures on a suppression-burst EEG is most likely to
    be tested for. About a fifth of STXBP1 patients present as Ohtahara syndrome.
  disease_term:
    preferred_term: STXBP1 encephalopathy
    term:
      id: MONDO:0012812
      label: developmental and epileptic encephalopathy, 4
  distinguishing_features:
  - >-
      Zygosity is the cleanest discriminator. STXBP1 encephalopathy is caused by
      heterozygous variants acting through haploinsufficiency, so it is dominant
      and typically de novo; DEE81 is recessive, and in the founding cohort every
      family had two affected siblings. A recurrence in siblings therefore argues
      for DEE81 and against STXBP1.
  - >-
      The DEE81-specific findings are the positive discriminators: deafness, mild
      peripheral polyneuropathy and dysmorphic features accompanying the epilepsy,
      a thin corpus callosum with hypomyelination on the earliest MRI, and
      progressive brain shrinkage with leukoencephalopathy on follow-up. These are
      stated from the DEE81 side; this entry does not assert what STXBP1 imaging
      or extraneural features look like, because its sources do not cover that.
  evidence:
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early infantile epileptic encephalopathy with suppression-burst (EIEE), also known as Ohtahara syndrome, is one of the most severe and earliest forms of epilepsy."
    explanation: "Anchors STXBP1 to the same Ohtahara/suppression-burst presentation DEE81 produces."
  - reference: PMID:26865513
    reference_title: "STXBP1 encephalopathy: A neurodevelopmental disorder including epilepsy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "While one-third of patients presented with Ohtahara syndrome (21%) or West syndrome (9.5%), the majority has a nonsyndromic early-onset epilepsy and encephalopathy (53%) with epileptic spasms or tonic seizures as main seizure type."
    explanation: "Quantifies how often STXBP1 presents as Ohtahara syndrome, which is what makes it the leading differential."
  - reference: PMID:18469812
    reference_title: "De novo mutations in the gene encoding STXBP1 (MUNC18-1) cause early infantile epileptic encephalopathy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest that haploinsufficiency of STXBP1 causes EIEE."
    explanation: "Establishes the dominant, haploinsufficiency mechanism, which is the discriminator against recessive DEE81."

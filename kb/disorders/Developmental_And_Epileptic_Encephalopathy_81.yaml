  - target: Impaired Autophagic Degradation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The autophagic block is demonstrated in the same patient cells by several
      independent assays.
    limitations: >-
      Autophagic flux was assessed in a dividing, non-neuronal cell type; neurons

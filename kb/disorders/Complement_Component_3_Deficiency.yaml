name: Complement Component 3 Deficiency
creation_date: "2026-10-15T00:00:00Z"
category: Mendelian
description: >-
  Complete complement component 3 (C3) deficiency is an extremely rare
  autosomal recessive inborn error of immunity caused by biallelic
  loss-of-function variants in C3. Fewer than 50 cases have been reported since
  the first description in 1972. C3 is the point at which the classical, lectin
  and alternative pathways converge, so its absence removes C3b opsonisation,
  the C5 convertases built on C3b, and C3-dependent solubilisation and
  clearance of immune complexes. The clinical picture follows from these
  losses: recurrent, often severe pyogenic infection with encapsulated
  organisms (Streptococcus pneumoniae, Haemophilus influenzae, Neisseria
  meningitidis) from early childhood, and in roughly a quarter of patients each,
  immune-complex membranoproliferative glomerulonephritis and an SLE-like
  illness. Patients also show defects in adaptive immunity, including impaired
  dendritic-cell differentiation, reduced memory B cells and altered T-helper
  responses. Heterozygous relatives have about half-normal serum C3 and are
  usually asymptomatic.
disease_term:
  preferred_term: complement component 3 deficiency
  term:
    id: MONDO:0013417
    label: complement component 3 deficiency
synonyms:
- C3 deficiency
- complete C3 deficiency
- hereditary C3 deficiency
- C3 classic complement early component deficiency
- classic complement early component deficiency caused by mutation in C3
parents:
- Complement Disorder
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency presenting with pyogenic infection,
      glomerulonephritis and lupus-like disease, placing it in Harrison's
      immune/rheumatologic Part. Assigned to match the sibling
      Complement_Component_2_Deficiency entry.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      Deficiency of the central complement component C3, a row of the IUIS
      complement deficiencies table. Assigned to match the sibling
      Complement_Component_2_Deficiency entry.
inheritance:
- name: Autosomal Recessive
  description: >-
    Complete deficiency requires homozygous or compound heterozygous C3
    loss-of-function alleles. Heterozygous parents and siblings typically have
    about 50% of normal serum C3 and are clinically unaffected, although
    incomplete penetrance of mild findings in carriers has been noted.
    Founder alleles occur in populations with endogamy, such as the Afrikaans
    exon 22-23 deletion and a Moroccan splice-site variant.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:2212005
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His parents had both the normal and abnormal C3 mRNA and were shown to be heterozygous for this mutation by sequence analysis of genomic DNA amplified by PCR."
    explanation: >-
      Homozygous affected child with heterozygous carrier parents, the
      segregation pattern of recessive inheritance.
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nonconsanguineous parents and the two patients' two siblings had 50% normal serum C3 concentration."
    explanation: >-
      Unaffected relatives of a compound heterozygous patient carry about half
      the normal serum C3, consistent with a gene-dosage effect and recessive
      expression of disease.
  - reference: PMID:1350678
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The wide prevalence of this null allele in this population is probably due to the effects of a small founder population."
    explanation: >-
      Documents a founder null allele in the Afrikaans population.
pathophysiology:
- name: C3 Biallelic Loss of Function and Absent Serum C3
  biological_scale: MOLECULAR
  description: >-
    Reported alleles are mostly null: nonsense variants with nonsense-mediated
    mRNA decay, splice-site variants causing exon skipping or frameshift, and
    partial gene deletions. Some in-frame splice or missense alleles allow
    synthesis but block secretion, so the protein is retained in the secretory
    pathway and degraded. In each case serum C3 is undetectable. C3 is made
    mainly by hepatocytes, with a smaller contribution from monocytes and
    kidney.
  genetic_context:
    gene:
      preferred_term: C3
      term:
        id: hgnc:1318
        label: C3
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: Hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:14639503
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results indicate the presence of a premature termination codon in the C3 gene that results in a lack of the protein in patient's serum, which correlates with the acceleration of C3 mRNA decay in the patient's fibroblasts."
    explanation: >-
      A nonsense allele with accelerated mRNA decay in patient fibroblasts and
      no serum C3.
  - reference: PMID:1350678
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of this deletion in the C3 gene is not compatible with production of any functional C3"
    explanation: >-
      A partial gene deletion (exons 22-23) producing a frameshifted, null
      allele.
  - reference: PMID:15781264
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These data indicate that a novel AG-->GG 3'-splice acceptor site mutation in intron 38 caused aberrant splicing of exon 39, resulting in defective secretion of C3."
    explanation: >-
      An in-frame exon-skipping allele whose product is retained intracellularly,
      the secretion-defect class of C3 deficiency.
  - reference: PMID:26847111
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also observed that patient's skin fibroblasts stimulated with Escherichia coli LPS were unable to secrete C3, which might be accumulated within the cells before being intracellularly degraded."
    explanation: >-
      A second secretion-defective allele (exon 27 skipping in the TED domain).
  - reference: PMID:31970896
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As C3 is predominantly synthesized in the liver, with a small proportion of C3 monocyte derived and kidney derived, he proceeded to simultaneous liver-kidney transplantation."
    explanation: >-
      States the hepatic origin of most circulating C3, the basis for the
      hepatocyte binding on this node.
  downstream:
  - target: Failure of Complement Activation at the C3 Convergence Point
    causal_link_type: DIRECT
    description: >-
      Without C3 no pathway can generate C3b, so classical and alternative
      pathway activity are both abolished.
  - target: Decreased circulating complement C3
    causal_link_type: DIRECT
    description: >-
      Absent secretion of C3 is measured directly as undetectable serum C3.
- name: Failure of Complement Activation at the C3 Convergence Point
  biological_scale: MOLECULAR
  description: >-
    The classical, lectin and alternative pathways all converge on cleavage of
    C3. With no C3, no C3b is deposited on targets, the alternative-pathway
    amplification loop cannot run, the C5 convertases (which incorporate C3b)
    cannot assemble, and the C3a anaphylatoxin is not generated. Both classical
    (CH50) and alternative pathway haemolytic activity are absent, and adding
    purified C3 restores them in vitro.
  biological_processes:
  - preferred_term: Complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  - preferred_term: Complement activation, alternative pathway
    term:
      id: GO:0006957
      label: complement activation, alternative pathway
    modifier: DECREASED
  - preferred_term: Complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:20930072
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "C3 is the point at which all complement pathways converge, and complete deficiency of C3 invariably leads to severe infections, including those caused by meningococci and pneumococci."
    explanation: >-
      Review statement of C3's position as the convergence point of all
      complement pathways.
  - reference: PMID:11422912
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The classical and alternative pathway haemolytic activities and the generation of opsonins and chemotactic factors derived from the activation of the complement system were markedly affected in the proband's serum."
    explanation: >-
      Patient serum lacks both classical and alternative pathway activity.
  - reference: PMID:11422912
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "An in vitro addition of purified C3 restored the classical pathway-dependent haemolytic activity of his serum."
    explanation: >-
      Reconstitution with purified C3 shows the pathway failure is due to the
      missing C3 alone.
  downstream:
  - target: Impaired C3b Opsonophagocytosis
    causal_link_type: DIRECT
    description: >-
      No C3b or iC3b is deposited on microbes, so complement-receptor-mediated
      phagocytosis fails.
    evidence:
    - reference: PMID:11422912
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The classical and alternative pathway haemolytic activities and the generation of opsonins and chemotactic factors derived from the activation of the complement system were markedly affected in the proband's serum."
      explanation: >-
        Shows that generation of complement-derived opsonins is impaired in
        C3-deficient serum.
  - target: Defective Immune Complex Solubilization and Clearance
    causal_link_type: DIRECT
    description: >-
      C3 fragments keep immune complexes soluble and route them and apoptotic
      debris to clearance; without them complexes persist and deposit.
  - target: Impaired Complement-Dependent Adaptive Immune Priming
    description: >-
      C3 fragments and C3a act on dendritic cells, B cells and T cells, so
      their absence alters adaptive immune responses.
- name: Impaired C3b Opsonophagocytosis
  biological_scale: CELLULAR
  description: >-
    Phagocytes rely on C3b and iC3b to recognise and ingest encapsulated
    bacteria. In C3 deficiency neither antibody-dependent nor
    antibody-independent complement opsonisation is available, which explains
    the early-onset, often invasive pyogenic infections.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: opsonization
    term:
      id: GO:0008228
      label: opsonization
    modifier: DECREASED
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "reflecting the indispensable role of C3b-mediated opsonization in defense against encapsulated organisms"
    explanation: >-
      Attributes the encapsulated-organism infection phenotype of C3
      deficiency to loss of C3b opsonisation.
  - reference: PMID:14612669
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Antibody- and complement-mediated opsonization, splenic macrophages and interleukin-1 receptor associated kinase-4- and nuclear factor kappaB-mediated immune responses are crucial for protective immunity to S. pneumoniae."
    explanation: >-
      Review establishing complement opsonisation as essential for defence
      against pneumococcus.
  downstream:
  - target: Recurrent Pyogenic Bacterial Infections
    causal_link_type: DIRECT
    description: >-
      Loss of opsonophagocytic killing of encapsulated organisms manifests as
      recurrent pyogenic infection.
    evidence:
    - reference: PMID:14612669
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Patients at high risk for pneumococcal disease include most if not all B-cell defects (whether due to an intrinsic B-cell anomaly or an impaired T-cell help), deficiencies of early components of the classical pathway of complement and C3 deficiency"
      explanation: >-
        Places C3 deficiency among the immunodeficiencies at high risk for
        pneumococcal disease.
  - target: Recurrent Pneumonia
    description: >-
      Pneumonia is among the most frequent serious infections.
  - target: Bacterial Meningitis
    description: >-
      Invasive pneumococcal and meningococcal disease includes recurrent
      meningitis.
  - target: Recurrent Tonsillitis
    description: >-
      Upper respiratory and ENT infections are the common, milder end of the
      infection spectrum.
- name: Defective Immune Complex Solubilization and Clearance
  biological_scale: CELLULAR
  description: >-
    C3 fragments solubilise immune complexes and opsonise them, and apoptotic
    cells, for transport and clearance. In their absence immune complexes
    persist and deposit in glomeruli and vessel walls, and uncleared apoptotic
    material is thought to drive loss of tolerance. This is the accepted
    explanation for the glomerulonephritis and SLE-like disease, but it rests on
    case observations and mechanistic inference rather than on direct
    measurement of clearance in C3-deficient patients.
  biological_processes:
  - preferred_term: immune complex clearance
    term:
      id: GO:0002434
      label: immune complex clearance
    modifier: DECREASED
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: DECREASED
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Impaired clearance of apoptotic cellular debris, which also depends on C3-mediated opsonization, may further contribute to the breach of self-tolerance observed in affected patients"
    explanation: >-
      States the apoptotic-debris clearance mechanism, hedged ("may"), as the
      route to autoimmunity in C3 deficiency.
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Deficiencies in complement proteins, particularly C3, can lead to severe and recurrent infections as well as immune complex disorders."
    explanation: >-
      Links C3 deficiency to immune complex disorders.
  downstream:
  - target: Membranoproliferative Glomerulonephritis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persisting immune complexes deposit in glomeruli and produce a
      membranoproliferative pattern.
    evidence:
    - reference: PMID:42445183
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "approximately 26% develop SLE-like autoimmune illness and around 26% develop membranoproliferative glomerulonephritis, attributable to failure of C3-dependent immune complex solubilization and clearance"
      explanation: >-
        Attributes membranoproliferative glomerulonephritis in C3 deficiency to
        failed immune complex solubilisation and clearance.
  - target: Systemic Lupus Erythematosus-like Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Uncleared immune complexes and apoptotic debris are thought to sustain
      autoantigen exposure and lupus-like disease.
    evidence:
    - reference: PMID:42445183
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "approximately 26% develop SLE-like autoimmune illness and around 26% develop membranoproliferative glomerulonephritis, attributable to failure of C3-dependent immune complex solubilization and clearance"
      explanation: >-
        Attributes the SLE-like illness to the same clearance failure.
  - target: Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Immune complexes that are not cleared deposit in small vessel walls.
    evidence:
    - reference: PMID:42445183
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the absence of C3b, circulating IgA1-containing immune complexes accumulate and deposit in small vessel walls, where they drive vascular inflammation through complement-independent mechanisms including Fc receptor engagement, cellular recruitment, and direct endothelial activation"
      explanation: >-
        The authors' proposed mechanism for IgA vasculitis in their two
        C3-deficient patients; a hypothesis offered in discussion, not a
        measurement.
- name: Impaired Complement-Dependent Adaptive Immune Priming
  biological_scale: CELLULAR
  description: >-
    Cells from C3-deficient patients show impaired monocyte-to-dendritic-cell
    differentiation and maturation, few switched memory B cells, reduced
    regulatory T-cell induction and defective Th1 induction. Antibody
    responses are variable: one patient failed to sustain a vaccine response,
    while a series of eight patients mounted normal toxoid responses with an
    abnormal IgG subclass pattern. The defect is therefore a skewing of
    adaptive immunity rather than a uniform antibody deficiency.
  cell_types:
  - preferred_term: Dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: Memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: dendritic cell differentiation
    term:
      id: GO:0097028
      label: dendritic cell differentiation
    modifier: DECREASED
  - preferred_term: memory B cell differentiation
    term:
      id: GO:0002319
      label: memory B cell differentiation
    modifier: DECREASED
  - preferred_term: T-helper 1 type immune response
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
    modifier: DECREASED
  evidence:
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, switched memory IgD(-)CD27(+) B cells were barely detected, amounting to only 2.3% of peripheral blood CD19(+) cells."
    explanation: >-
      Near-absent switched memory B cells in a C3-deficient patient.
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The in vitro development of immature dendritic cells and their maturation capacity were greatly impaired, with decreased CD1a expression and IL-12p70 secretion ability."
    explanation: >-
      Patient monocytes fail to differentiate and mature normally into
      dendritic cells.
  - reference: PMID:24321396
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, and like in CD46-deficient patients, whilst Th1 induction are impaired in C3-deficient patients in vitro, their Th2 responses are unaffected."
    explanation: >-
      T cells from two C3-deficient patients show selectively impaired Th1
      induction.
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaccination of the child did not induce a long-term Ab response."
    explanation: >-
      A failed durable vaccine antibody response in one patient.
  - reference: PMID:25446578
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients developed normal Ig responses to tetanus and diphtheria toxoids, but IgE levels were low."
    explanation: >-
      In eight patients, toxoid antibody responses were normal, contradicting a
      general failure of antibody production. The same study found an abnormal
      IgG subclass pattern, so adaptive immunity is altered but not uniformly
      deficient.
  - reference: PMID:25446578
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pattern of antigen-specific IgG subclasses was abnormal, with increased Th1-related IgG3 responses, low IgG2, and almost completely undetectable IgG4."
    explanation: >-
      Shows that helper T-cell differentiation is altered in C3 deficiency,
      though here in the direction of increased Th1-related responses, which
      differs from the in vitro Th1 defect reported elsewhere.
  downstream:
  - target: Decreased Memory B Cells
    causal_link_type: DIRECT
    description: >-
      Loss of C3d co-stimulation through CD21 limits generation of memory B
      cells.
    evidence:
    - reference: PMID:39114852
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "This leads to increased B-cell receptor (BCR) signaling when C3d-opsonized antigens are present on the B-cell surface, facilitating the differentiation from naive to antigen-experienced memory B cells"
      explanation: >-
        Background statement of how C3d-opsonised antigen promotes memory B
        cell differentiation.
  - target: Hypogammaglobulinemia
    description: >-
      Reported in some patients alongside reduced memory B cells and poor
      polysaccharide responses; not present in all.
  - target: Recurrent Pyogenic Bacterial Infections
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Impaired memory B-cell generation may contribute to infections that
      persist despite antibiotic prophylaxis.
    evidence:
    - reference: PMID:39114852
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Collectively, these observations reinforce the role of C3 on B-cell memory generation and potentially explain why these patients continued to have recurrent infections despite antimicrobial prophylaxis."
      explanation: >-
        The authors propose, hedged, that the B-cell memory defect contributes
        to ongoing infections in their two patients.
phenotypes:
- category: Immunological
  name: Recurrent Pyogenic Bacterial Infections
  frequency: VERY_FREQUENT
  description: >-
    Recurrent, often severe infections with encapsulated bacteria
    (Streptococcus pneumoniae, Haemophilus influenzae, Neisseria meningitidis)
    beginning in infancy or early childhood, including pneumonia, meningitis,
    sepsis and otorhinolaryngological infections. Severity varies: some recent
    patients have had chronic but non-invasive respiratory and ENT infections
    only.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:20930072
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "C3 is the point at which all complement pathways converge, and complete deficiency of C3 invariably leads to severe infections, including those caused by meningococci and pneumococci."
    explanation: >-
      Review statement that severe infection is a near-universal feature of
      complete C3 deficiency.
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "was identified in a 2-year-old male suffering from recurrent pyogenic infections from early infancy with undetectable total complement hemolytic activity (CH50) and C3 values"
    explanation: >-
      Early-onset recurrent pyogenic infection in a genetically confirmed case.
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both patients presented with chronic and recurrent infections, predominantly affecting the respiratory and otorhinolaryngological systems, without identification of consistent pathogens."
    explanation: >-
      Two recent patients with chronic, non-invasive respiratory and ENT
      infections, the milder end of the spectrum.

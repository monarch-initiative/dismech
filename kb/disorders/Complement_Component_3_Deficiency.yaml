diagnosis:
- name: Complement screening (C3, C4, CH50, AP50)
  description: >-
    Quantitative C3 and C4 together with classical (CH50) and alternative
    (AP50) pathway haemolytic activity. Undetectable C3 with absent CH50 and
    AP50 but a normal C4 separates primary C3 deficiency from classical
    pathway consumption (immune-complex disease such as SLE), where C4 falls
    as well. A normal C4 does not exclude alternative pathway consumption:
    deficiency of factor H or factor I, or a C3 nephritic factor, lowers C3
    and factor B with C4 preserved. In those conditions C3 is usually low
    rather than undetectable, and measuring factor B, factor H and factor I
    separates them from primary C3 deficiency. This is the test that makes
    the diagnosis, and in both patients of the 2026 Moroccan series it was
    done only years after symptom onset.
  diagnosis_term:
    preferred_term: complement screening assay
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  markers: serum C3, serum C4, CH50, AP50

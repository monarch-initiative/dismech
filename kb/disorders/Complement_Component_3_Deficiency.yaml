  - reference: PMID:11422912
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented recurrent bacterial infections, vasculitis and extremely low levels of serum C3 (0.15 microg/ml)"
    explanation: >-
      Vasculitis in a child with hereditary C3 deficiency.
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 6 years of age, he was diagnosed with IgA vasculitis (Henoch-Schonlein purpura), characterized by palpable purpura on the lower extremities, ankle edema, and arthralgia, that was treated with systemic corticosteroids with good clinical response"
    explanation: >-
      IgA vasculitis in a patient with genetically confirmed complete C3
      deficiency.
- category: Hematological
  name: Hemolytic-Uremic Syndrome
  description: >-
    Hemolytic uremic syndrome has been reported in one patient with complete
    C3 deficiency, who also carried risk polymorphisms for atypical HUS. No
    causal edge is drawn: a mechanism connecting absent C3 to HUS is not
    established, and HUS is far more often a consequence of C3
    gain-of-function variants, a different disease.
  phenotype_term:
    preferred_term: Hemolytic-uremic syndrome
    term:
      id: HP:0005575
      label: Hemolytic-uremic syndrome
  evidence:
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both, the index case and her sister, presented a history of recurrent infections since early childhood and one of them developed hemolytic uremic syndrome (HUS)."
    explanation: >-
      Single-case report of HUS in a sibling with complete C3 deficiency.
- category: Immunological
  name: Decreased Memory B Cells
  description: >-
    Reduced switched and non-switched memory B cells.
  phenotype_term:
    preferred_term: Decreased memory B cell proportion
    term:
      id: HP:0030374
      label: Decreased memory B cell proportion
  evidence:
  - reference: PMID:18802120
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Accordingly, switched memory IgD(-)CD27(+) B cells were barely detected, amounting to only 2.3% of peripheral blood CD19(+) cells."
    explanation: >-
      Near-absent switched memory B cells.
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunological evaluation revealed absent plasma C3 levels, decreased memory B cells, hypogammaglobulinemia, and impaired response to polysaccharide antigens."
    explanation: >-
      Decreased memory B cells in two siblings with complete C3 deficiency.
- category: Immunological
  name: Hypogammaglobulinemia
  description: >-
    Hypogammaglobulinemia with impaired polysaccharide responses was reported
    in two siblings and led to immunoglobulin replacement. It is not a
    constant feature: other patients have normal immunoglobulin levels.
  phenotype_term:
    preferred_term: Hypogammaglobulinemia
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration
  evidence:
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunological evaluation revealed absent plasma C3 levels, decreased memory B cells, hypogammaglobulinemia, and impaired response to polysaccharide antigens."
    explanation: >-
      Hypogammaglobulinemia in two siblings with complete C3 deficiency.
  - reference: PMID:42445183
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunological investigations revealed normal lymphocyte subsets, immunoglobulin levels, and neutrophil oxidative burst."
    explanation: >-
      Two other patients had normal immunoglobulin levels, so
      hypogammaglobulinemia is not a consistent feature.
- category: Laboratory
  name: Decreased circulating complement C3
  frequency: VERY_FREQUENT
  description: >-
    Serum C3 is undetectable or below 1% of normal in complete deficiency, with
    absent or markedly reduced CH50.
  phenotype_term:
    preferred_term: Undetectable serum C3
    term:
      id: HP:0005421
      label: Decreased circulating complement C3 concentration
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complement analysis showed undetectable C3 levels and markedly reduced CH50, with normal C4, consistent with isolated complete C3 deficiency"
    explanation: >-
      The defining laboratory pattern: undetectable C3, low CH50, normal C4.
biochemical:
- name: Serum C3
  presence: DECREASED
  notes: >-
    Undetectable in affected individuals; about half of normal in heterozygous
    relatives. Normal C4 helps distinguish primary deficiency from C3
    consumption.
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complement analysis showed undetectable C3 levels and markedly reduced CH50, with normal C4, consistent with isolated complete C3 deficiency"
    explanation: >-
      Undetectable C3 with normal C4 in genetically confirmed patients.
  - reference: PMID:26847111
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complement C3 levels were undetectable in the patient's serum and were reduced by at least 50% in the sera of the patient's parents and brother"
    explanation: >-
      Undetectable C3 in the patient and roughly half-normal C3 in carriers.
- name: Serum CH50 (total classical pathway haemolytic activity)
  presence: DECREASED
  notes: >-
    Absent or markedly reduced, as is alternative pathway haemolytic activity,
    because both pathways require C3.
  evidence:
  - reference: PMID:26847111
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hemolytic assays revealed complete lack of complement-mediated hemolytic activity in the patient's serum."
    explanation: >-
      Complete loss of haemolytic complement activity in a C3-deficient
      patient.
genetic:
- name: C3
  gene_term:
    preferred_term: C3
    term:
      id: hgnc:1318
      label: C3
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic loss-of-function variants (nonsense, frameshift, splice-site,
    partial deletion, and secretion-blocking in-frame or missense alleles)
    cause complete C3 deficiency. Heterozygous gain-of-function C3 variants
    cause a different disease, atypical hemolytic uremic syndrome, and are not
    part of this entry. ClinGen classifies C3 for that aHUS disease
    (MONDO:0013043), not for C3 deficiency, so no gene-disease validity tier is
    recorded here.
  evidence:
  - reference: PMID:2212005
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is sufficient to cause the deficiency of C3 in the patient."
    explanation: >-
      A homozygous C3 splice-site null allele causing deficiency.
  - reference: PMID:12462331
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified the mutations responsible for a complete homozygous C3 deficiency."
    explanation: >-
      A homozygous premature stop codon in C3 in complete deficiency.
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss-of-function (LoF) is the established and predominant disease mechanism for autosomal recessive complete C3 deficiency."
    explanation: >-
      States loss of function as the disease mechanism.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than 50 cases reported worldwide since the first description in
    1972. No population prevalence estimate exists.
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fewer than 50 cases have been reported worldwide"
    explanation: >-
      Case count from a 2026 literature review.
treatments:
- name: Vaccination Against Encapsulated Bacteria
  description: >-
    Conjugate pneumococcal, meningococcal and Haemophilus influenzae type b
    vaccination is a standard part of management. Unlike C2 deficiency, there
    is no alternative pathway to route vaccine antibody through, so benefit is
    expected to come from antibody-mediated, complement-independent
    mechanisms; responses in reported patients were partial.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination against encapsulated bacteria
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regarding the management of complement deficiencies, clinical control, vaccination with protein-polysaccharides conjugate, and antimicrobial prophylaxis are considered cornerstones in treatment"
    explanation: >-
      States conjugate vaccination as a cornerstone of management.
- name: Antibiotic Prophylaxis
  description: >-
    Continuous antibiotic prophylaxis, usually penicillin or amoxicillin, is
    recommended and reduced severe infections in some reports, though not in
    every patient.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Continuous antibiotic prophylaxis, typically with penicillin, significantly reduces infection frequency and is strongly recommended"
    explanation: >-
      States the recommendation for continuous penicillin prophylaxis.
  - reference: PMID:39114852
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite antimicrobial prophylaxis, they continue to suffer from recurrent sinopulmonary infections."
    explanation: >-
      In two siblings prophylaxis did not prevent recurrent infection.
- name: Intravenous Immunoglobulin Replacement
  description: >-
    Considered when C3 deficiency is accompanied by hypogammaglobulinemia or
    poor specific antibody responses; in two siblings it markedly reduced
    infection frequency.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: intravenous immunoglobulin
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_mechanisms:
  - target: Hypogammaglobulinemia
    description: >-
      Replaces the deficient antibody.
  evidence:
  - reference: PMID:39114852
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the failure of antimicrobial prophylaxis to prevent recurrent sinopulmonary infections, as well as the evidence of impaired antibody synthesis or response, led to the decision of initiating intravenous immunoglobulin (IVIG) replacement therapy, leading to a marked decrease in the number of infections."
    explanation: >-
      IVIG reduced infections in two siblings with antibody defects.
- name: Fresh Frozen Plasma
  description: >-
    Plasma infusion supplies C3 temporarily during acute infection or
    perioperatively; the short duration of effect and transfusion risks limit
    routine prophylactic use.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: fresh frozen plasma transfusion
    term:
      id: NCIT:C116475
      label: Fresh Frozen Plasma Transfusion
  target_mechanisms:
  - target: Failure of Complement Activation at the C3 Convergence Point
    description: >-
      Transiently restores circulating C3.
  evidence:
  - reference: PMID:42445183
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Fresh frozen plasma (FFP) infusions can provide temporary complement replacement during acute infections or perioperative periods, though the logistical challenges, risks, and short duration of effect limit its routine prophylactic use"
    explanation: >-
      Describes the role and limits of plasma replacement.
- name: Simultaneous Liver-Kidney Transplantation
  description: >-
    In one adult with end-stage renal failure from glomerulonephritis,
    combined liver-kidney transplantation restored circulating C3, since the
    liver is the main source of C3; isolated kidney transplantation would have
    left him C3 deficient. A single case.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: simultaneous liver-kidney transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: C3 Biallelic Loss of Function and Absent Serum C3
    description: >-
      A donor liver supplies normal C3.
  evidence:
  - reference: PMID:31970896
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The procedure has been successful with restoration of his circulating C3 levels, normal liver and kidney function at 26 months of follow-up."
    explanation: >-
      Restoration of C3 after combined transplantation in one patient.
notes: >-
  No GeneReviews chapter was found for C3 deficiency. Most of the literature is
  single case reports; frequencies for glomerulonephritis and SLE-like disease
  are pooled literature estimates quoted in a 2026 case report.

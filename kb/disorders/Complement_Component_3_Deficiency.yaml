    reference_title: "Successful simultaneous liver-kidney transplantation for renal failure associated with hereditary complement C3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The procedure has been successful with restoration of his circulating C3 levels, normal liver and kidney function at 26 months of follow-up."

- name: Fresh Frozen Plasma
  description: >-
    Plasma infusion supplies C3 temporarily during acute infection or
    perioperatively; the short duration of effect and transfusion risks limit
    routine prophylactic use.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:

    explanation: The assay study explains why substrate and tissue context matter when interpreting GBA2 activity.
  - reference: "url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11076336/fullTextXML"
    reference_title: "Hereditary spastic paraparesis type 46 (SPG46): new GBA2 variants in a large Italian case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      this method of measuring GBA2 activity may lead to underestimating GBA2 activity
    explanation: The contemporary series states the assay's methodological limitation.
- name: Neurologic, ophthalmologic, neurophysiologic, and MRI phenotyping
  description: >-
    Baseline assessment should define pyramidal and cerebellar involvement,
    cognition, eye movements and cataracts, peripheral neuropathy, bladder
    symptoms, skeletal deformity, and brain MRI findings. Normal imaging or
    absence of cataract does not exclude the diagnosis.

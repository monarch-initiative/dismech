    reference_title: "Hereditary spastic paraparesis type 46 (SPG46): new GBA2 variants in a large Italian case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      underwent neurological examination, clinical cognitive assessment, column
      imaging for scoliosis assessment, ophthalmologic examination, brain
      imaging, GBA2 activity in peripheral blood cells and genetic testing.
    explanation: The current multicenter series demonstrates the relevant multidisciplinary diagnostic assessment.
differential_diagnoses:
- name: SIL1-related Marinesco-Sjögren syndrome
  description: >-
    Both disorders can combine cerebellar ataxia, cataracts, cognitive
    impairment, hypogonadism, and skeletal abnormalities. Childhood hypotonia
    and myopathy favor SIL1-related disease, whereas early lower-limb spastic
    paraparesis favors GBA2/SPG46; molecular testing is definitive.
  distinguishing_features:
  - SIL1-related disease classically includes childhood hypotonia and myopathy.
  - GBA2 disease usually develops prominent lower-limb spastic paraparesis.
  evidence:
  - reference: "url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11076336/fullTextXML"
    reference_title: "Hereditary spastic paraparesis type 46 (SPG46): new GBA2 variants in a large Italian case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its clinical hallmarks are child-onset hypotonia and muscle weakness but
      not spasticity in lower limbs
    explanation: The review contrasts SIL1-related Marinesco-Sjögren hallmarks with GBA2-associated early spastic paraparesis.
- name: Other hereditary spastic ataxias and complex hereditary spastic paraplegias
  description: >-
    ARSACS, SPG11, SPG15, SPG7, CYP2U1-, DDHD2-, and other gene-associated
    disorders can share spasticity, ataxia, neuropathy, callosal change, and
    cognitive findings. A broad panel or exome/genome analysis is often more
    appropriate than phenotype-only single-gene selection.
  distinguishing_features:
  - Cataract plus markedly reduced leukocyte GBA2 activity supports GBA2 disease.
  - Gene-specific imaging, retinal, dental, movement, or systemic features can redirect testing.
  evidence:
  - reference: PMID:20301682
    reference_title: Uncomplicated (Pure) Hereditary Spastic Paraplegia Overview.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Review the differential diagnosis of uncomplicated hereditary spastic
      paraplegia, which includes complicated hereditary spastic paraplegia with
      a focus on treatable genetic disorders
    explanation: GeneReviews places complex hereditary spastic paraplegia and treatable mimics in the diagnostic differential.
treatments:
- name: Multidisciplinary supportive care
  description: >-
    No GBA2-directed disease-modifying treatment has been established.
    Management is individualized to preserve function and address spasticity,
    ataxia, neuropathy, bladder symptoms, cognition, cataracts, and orthopedic
    complications through neurology, rehabilitation, ophthalmology, urology,
    orthopedics, and genetics services.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: "url:https://www.ncbi.nlm.nih.gov/books/NBK1509/"
    reference_title: Uncomplicated (Pure) Hereditary Spastic Paraplegia Overview
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At present, no specific treatments can prevent or reverse nerve
      degeneration in uncomplicated HSP. Supportive care to improve quality of
      life, maximize function, and reduce complications is recommended.
    explanation: Current HSP management guidance supports multidisciplinary symptomatic care rather than disease-modifying claims.
- name: Individualized physical and occupational rehabilitation
  description: >-
    Stretching, strengthening, balance and gait training, orthoses, mobility
    aids, and occupational adaptations are selected according to spasticity,
    weakness, ataxia, contracture risk, and daily-living needs.

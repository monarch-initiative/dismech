notes: >-
  This entry represents the MONDO disease term, not only one chronological
  pattern of symptoms. "Late-onset spasticity" describes the
  ataxia-predominant families in which spasticity became prominent after
  cerebellar symptoms; most later reports use SPG46 and describe early-onset
  complex HSP. The HSP-, ARCA-, and Marinesco-Sjögren-like labels are overlapping
  presentations of biallelic GBA2 disease rather than separate established
  molecular disorders. Reduced GBA2 activity and glucosylceramide elevation are
  established. Selective neurodegeneration, mitochondrial fragmentation,
  transcriptomic stress pathways, and systemic manifestations should not be
  collapsed into one proven mechanism. A 2026 report further expands the
  endocrine spectrum with hypogonadotrophic hypogonadism, but its PubMed record
  did not yet contain an abstract at the time of this review.
review_notes: >-
  Full review completed 2026-07-23. Scope was reconciled to the original
  independent GBA2 HSP and ARCA reports and the 2024 synthesis of 67 cases from
  36 families. The entry now distinguishes the MONDO label's
  ataxia-first/late-spasticity presentation from the more common early-onset
  SPG46 presentation and treats HSP, ARCA, and Marinesco-Sjögren-like disease as
  a variable GBA2 spectrum. All causal edges were rebuilt with evidence and
  explicit uncertainty. ClinicalTrials.gov API searches for GBA2, SPG46,
  "spastic paraplegia 46," and the full disease name found no GBA2-specific
  interventional trial; the broad recruiting CoRDS rare-disease registry
  NCT01793168 was retained because its condition list explicitly includes the
  disease. NCBI GEO searches for GBA2 plus spasticity/ataxia, SPG46, and the full
  disease name found no disease-specific accession. The 2022 patient-cell RNA
  sequencing data were reported within the article and supplementary files, so
  the experimental model is represented but datasets remains empty rather than
  inventing a repository accession.

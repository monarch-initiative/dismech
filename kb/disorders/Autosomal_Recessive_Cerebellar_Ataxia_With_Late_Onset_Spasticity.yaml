diagnosis:
- name: Molecular genetic testing for biallelic GBA2 variants
  description: >-
    Diagnosis is established by detecting pathogenic or likely pathogenic
    variants on both GBA2 alleles, generally through a hereditary
    spastic-paraplegia/ataxia panel, exome sequencing, or genome sequencing.
    Segregation and copy-number analysis should be considered where appropriate.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23332917
    reference_title: Mutations in GBA2 cause autosomal-recessive cerebellar ataxia with spasticity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      homozygosity mapping and whole-exome sequencing
    explanation: Exome sequencing identified the causal GBA2 variants in independent ARCA families.
- name: Leukocyte GBA2 enzyme-activity assay
  description: >-
    Markedly reduced GBA2 activity in leukocytes can support a molecular
    diagnosis and provide functional evidence for a variant, but assay methods
    can underestimate activity and testing is not a substitute for biallelic
    molecular confirmation.
  evidence:
  - reference: PMID:23332916
    reference_title: Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      no residual glucocerebrosidase activity of GBA2 could be evidenced in
      blood cells
    explanation: The original report demonstrates absent blood-cell activity in an affected individual.
  - reference: PMID:30864417
    reference_title: Assay of β-glucosidase 2 (GBA2) activity using lithocholic acid β-3-O-glucoside substrate for cultured fibroblasts and glucosylceramide for brain tissue.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

name: Autosomal Recessive Cerebellar Ataxia With Late-Onset Spasticity
creation_date: "2026-06-13T00:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive cerebellar ataxia with late-onset spasticity is one
  presentation of the biallelic GBA2 disease spectrum, most often termed
  hereditary spastic paraplegia 46 (SPG46). Presentations range from
  ataxia-predominant disease in which spasticity emerges later to early-onset
  complex hereditary spastic paraplegia and a Marinesco-Sjögren-like phenotype.
  Across these labels, cerebellar ataxia and lower-limb spasticity coexist, with
  variable peripheral neuropathy, cognitive impairment, cataracts, scoliosis,
  hypogonadism, movement disorders, and characteristic but inconsistent MRI
  abnormalities. Biallelic GBA2 variants severely reduce the nonlysosomal
  glucosylceramidase that hydrolyzes glucosylceramide to glucose and ceramide.
  Glucosylceramide accumulation is established in patient material, but the
  downstream mechanism linking lipid imbalance to selective corticospinal,
  cerebellar, peripheral-nerve, ocular, and endocrine manifestations remains
  incompletely resolved.
synonyms:
- GBA2-related spastic ataxia
- GBA2-related disorder
- hereditary spastic paraplegia 46
- spastic paraplegia 46
- SPG46
- GBA2-related Marinesco-Sjögren-like syndrome

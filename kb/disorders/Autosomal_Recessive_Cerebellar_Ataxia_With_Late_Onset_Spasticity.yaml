clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Burden varies substantially with age at onset, predominant presentation,
    and disease duration. The course is usually slow, but combined spasticity,
    ataxia, neuropathy, cognitive impairment, cataracts, skeletal deformity, and
    bladder symptoms can progressively impair walking, self-care, vision, and
    independence over decades.
  evidence:
  - reference: "url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11076336/fullTextXML"
    reference_title: "Hereditary spastic paraparesis type 46 (SPG46): new GBA2 variants in a large Italian case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease course was slowly progressive (mean 32 years at the time of last
      examination).
    explanation: The contemporary case series documents decades of progressive disease.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Disease results from biallelic pathogenic GBA2 variants; reported families
    are frequently consanguineous, although compound-heterozygous cases also
    occur.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:38334933
    reference_title: "Hereditary spastic paraparesis type 46 (SPG46): new GBA2 variants in a large Italian case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SPG46 is a rare, early-onset and autosomal recessive HSP, linked to
      biallelic GBA2 mutations.
    explanation: The current series and literature review defines biallelic GBA2 disease as autosomal recessive.
mechanistic_hypotheses:
- hypothesis_group_id: gba2_loss_glucosylceramide_model
  hypothesis_label: GBA2 Loss and Glucosylceramide-Dysregulation Model
  status: CANONICAL
  description: >-
    Biallelic disease-associated GBA2 variants cause severe loss of
    nonlysosomal glucosylceramidase activity. Reduced hydrolysis of
    glucosylceramide raises glucosylceramide in patient material and establishes
    the primary biochemical lesion. This does not by itself establish which
    lipid species, membrane compartment, or neural cell population drives the
    clinical syndrome.
  evidence:
  - reference: PMID:26220345
    reference_title: Lack of enzyme activity in GBA2 mutants associated with hereditary spastic paraplegia/cerebellar ataxia (SPG46).
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      none of the GBA2 mutant cDNAs raised the enzyme activity in transfected
      cells, in contrast to the wild-type enzyme.
    explanation: Biochemical testing establishes severe loss of activity across representative disease-associated variants.
  - reference: PMID:28052128
    reference_title: "GBA2 Mutations Cause a Marinesco-Sjögren-Like Syndrome: Genetic and Biochemical Studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our studies show that a reduced activity of GBA2 is sufficient to elevate
      the levels of glucosylceramide to similar levels as seen in Gaucher disease.
    explanation: Patient leukocytes directly connect reduced GBA2 activity to glucosylceramide elevation.
- hypothesis_group_id: gba2_neurite_axon_model
  hypothesis_label: Actin, Neurite-Outgrowth, and Axonal-Development Model
  status: EMERGING
  description: >-
    GBA2 inhibition perturbs F-actin dynamics and neurite outgrowth in isolated
    cerebellar neurons, while zebrafish knockdown shortens and abnormally
    branches motor axons. These models provide a plausible bridge from lipid
    imbalance to long-tract and cerebellar dysfunction, but neither model fully
    reproduces the human phenotype and the intervening molecular steps remain
    uncertain.
  evidence:
  - reference: PMID:30662006
    reference_title: Species-specific differences in nonlysosomal glucosylceramidase GBA2 function underlie locomotor dysfunction arising from loss-of-function mutations.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      inhibition of GBA2 activity in isolated cerebellar neurons dramatically
      affected F-actin dynamics and reduced neurite outgrowth
    explanation: The mammalian neuron experiment supports an actin/neurite mechanism.
  - reference: PMID:23332916
    reference_title: Loss of function of glucocerebrosidase GBA2 is responsible for motor neuron defects in hereditary spastic paraplegia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      led to abnormal motor behavior and axonal shortening/branching of
      motoneurons that were rescued by the human wild-type mRNA
    explanation: Zebrafish rescue experiments support a GBA2-dependent motor-axon phenotype.
- hypothesis_group_id: truncating_variant_mitochondrial_model
  hypothesis_label: Truncating-Variant Mitochondrial Mislocalization Model
  status: EMERGING
  description: >-
    In transfected cells, selected early C-terminal truncations enter the
    mitochondrial matrix and cause fragmentation and membrane-potential loss.
    This is a variant-class-specific cell-model result, not evidence that all
    GBA2 variants cause mitochondrial disease in patients.
  evidence:
  - reference: PMID:32492073
    reference_title: Truncated mutants of beta-glucosidase 2 (GBA2) are localized in the mitochondrial matrix and cause mitochondrial fragmentation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the C-terminally truncated mutants terminating after amino acids 233 and
      339 (GBA2-233 and -339) were present in the mitochondrial matrix, induced
      mitochondrial fragmentation and loss of mitochondrial transmembrane potential.
    explanation: The experiment supports a truncation-specific mitochondrial branch while limiting its generalization.
- hypothesis_group_id: patient_transcriptome_stress_signals
  hypothesis_label: Patient-Cell Stress and Signaling Model
  status: EMERGING
  description: >-
    RNA sequencing of lymphoblasts, fibroblasts, and iPSC-derived neurons from
    patients homozygous for one GBA2 missense variant identified oxidative
    stress, neuroinflammatory, sphingolipid, PI3K-AKT, and MAPK pathway signals.
    The sample size was small and the authors framed these as candidates
    requiring validation rather than demonstrated causal pathways.
  evidence:
  - reference: PMID:35277195
    reference_title: Transcriptomic characterization of tissues from patients and subsequent pathway analyses reveal biological pathways that are implicated in spastic ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Among them are the oxidative stress, neuroinflammation, sphingolipid
      signaling and metabolism, PI3K-Akt and MAPK signaling pathways.
    explanation: The patient-cell transcriptome nominates, but does not causally establish, these pathways.

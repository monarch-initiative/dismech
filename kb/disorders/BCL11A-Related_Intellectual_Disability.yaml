name: BCL11A-Related Intellectual Disability
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous loss-of-function variants in BCL11A, a C2H2
  zinc-finger transcriptional repressor that is also a subunit of the BAF (SWI/SNF) chromatin-remodeling complex. Most
  variants arise de novo; truncating variants predominate, and the recurrent N-terminal missense variants are hypomorphic.
  The core features are developmental delay or intellectual disability of variable severity, hypotonia, postnatal
  microcephaly, behavioral abnormalities and autism, strabismus and joint laxity, with mild and non-specific facial
  features. Persistence of fetal hemoglobin (HbF) is found in every individual tested and is clinically silent: in adult
  erythroid cells BCL11A represses the gamma-globin genes HBG1 and HBG2, and halving its dose leaves gamma-globin partly
  derepressed. Brain MRI most often shows a small cerebellar vermis and a small pons, consistent with BCL11A expression in
  developing Purkinje cells and brainstem. Bcl11a heterozygous mice have smaller brains, impaired social memory and
  abnormal social behavior. ClinGen classifies the gene-disease relationship as Definitive.

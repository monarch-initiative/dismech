    reference_title: BCL11A Haploinsufficiency Causes an Intellectual Disability Syndrome and Dysregulates Transcription.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report an ID syndrome caused by de novo heterozygous missense, nonsense, and frameshift mutations in BCL11A,
      encoding a transcription factor that is a putative member of the BAF swi/snf chromatin-remodeling complex.
    explanation: Founding report of the syndrome and its de novo heterozygous variants.
  - reference: PMID:27453576
    reference_title: BCL11A Haploinsufficiency Causes an Intellectual Disability Syndrome and Dysregulates Transcription.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The etiological missense variants cluster in the amino-terminal region of human BCL11A, and we demonstrate that they
      all disrupt its localization, dimerization, and transcriptional regulatory activity, consistent with a loss of
      function.
    explanation: Cell-based assays show the patient missense variants are loss-of-function alleles.
  - reference: PMID:34634037
    reference_title: Pathogenic BCL11A variants provide insights into the mechanisms of human fetal hemoglobin silencing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find several mutations in an N-terminal C2HC zinc finger that increase proteasomal degradation of BCL11A. We also
      identify a distinct C-terminal missense variant in the fifth zinc finger domain that we demonstrate causes
      loss-of-function through disruption of DNA binding.
    explanation: Two routes by which patient missense variants lose BCL11A function.
  - reference: PMID:23644491
    reference_title: Proteomic and bioinformatic analysis of mammalian SWI/SNF complexes identifies extensive roles in
      human malignancy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we conducted a proteomic analysis of endogenous mSWI/SNF complexes, which identified several new dedicated, stable
      subunits not found in yeast SWI/SNF complexes, including BCL7A, BCL7B and BCL7C, BCL11A and BCL11B, BRD9 and SS18
    explanation: Identifies BCL11A as a stable subunit of mammalian BAF complexes.
  - reference: CGGV:assertion_9630f9a3-3f90-49c6-ae8b-6313c950b1b2-2020-09-01T100000.000Z
    reference_title: BCL11A / Dias-Logan syndrome (Definitive)

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most variants are de novo (83% in the largest cohort). Apparent germline mosaicism has been found in two families, and
    in two families the variant was inherited from an unaffected or mildly affected parent, attributed to variable
    expressivity, reduced penetrance or undetected parental mosaicism.

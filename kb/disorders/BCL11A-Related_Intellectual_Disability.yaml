animal_models:
- name: Bcl11a heterozygous gene-trap mouse
  species: Mouse
  genotype: Bcl11a+/- (LacZ gene trap upstream of exon 4)
  publication: PMID:27453576
  description: >-
    Heterozygous knockout-first gene-trap allele disrupting all major Bcl11a isoforms, the model used in the founding
    report.
  modeled_mechanisms:
  - target: Reduced Brain Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Heterozygous loss reduces brain volume, with regional reductions matching the human MRI findings.
    limitations: >-
      Pons and medulla were not examined, and the study reports brain, skull, behavior and transcriptome phenotypes but
      no erythroid or globin phenotype.
    readouts:
    - name: Whole-brain volume by MRI
      target: Reduced Brain Growth
      direction: DECREASED
      evidence:
      - reference: PMID:27453576
        reference_title: BCL11A Haploinsufficiency Causes an Intellectual Disability Syndrome and Dysregulates
          Transcription.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: Overall brain volume is significantly decreased in Bcl11a+/− mice, affecting both gray and white matter
        explanation: MRI volumetry.
    evidence:
    - reference: PMID:27453576
      reference_title: BCL11A Haploinsufficiency Causes an Intellectual Disability Syndrome and Dysregulates
        Transcription.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We show that haploinsufficiency of Bcl11a alone in a mouse model is sufficient to recapitulate key cognitive,
        behavioral, and neuroanatomical phenotypes present in affected individuals.
      explanation: The authors' statement of model fidelity.
  - target: Dysregulated Neuronal Transcription
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: MOLECULAR
    description: RNA sequencing of cortex and hippocampus of heterozygous mice.
    limitations: >-
      Bulk tissue RNA sequencing of adult male cortex and hippocampus cannot separate direct BCL11A targets from secondary
      changes, and is a molecular readout of a node scored at the cellular scale.
    evidence:
    - reference: PMID:27453576
      reference_title: BCL11A Haploinsufficiency Causes an Intellectual Disability Syndrome and Dysregulates
        Transcription.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In this haploinsufficient mouse model, we identify transcriptional dysregulation of the hippocampus and cortex,
        brain regions that correlate with neuroanatomical and behavioral phenotypes.
      explanation: Transcriptome profiling in the model.
- name: Purkinje cell-specific Bcl11a conditional knockout mouse
  species: Mouse
  genotype: Bcl11a conditional deletion in cerebellar Purkinje cells
  publication: PMID:40855003
  modeled_mechanisms:
  - target: Purkinje Cell Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Loss of Bcl11a in Purkinje cells impairs their survival and firing and causes ataxia and social deficits.
    limitations: >-
      Removes both copies of Bcl11a in one cell type, whereas patients are constitutionally heterozygous in every cell, so
      the severity and cell autonomy of the defect differ from the human disorder.
    evidence:
    - reference: PMID:40855003
      reference_title: Bcl11a deficiency in cerebellar Purkinje cells causes ataxia and autistic-like behavior by altering
        Vav3.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Moreover, we identify Vav3 (guanosine nucleotide exchange factor 3) as a downstream target of Bcl11a in PCs and
        demonstrate that Vav3 overexpression partially rescues both PC dysfunction and abnormal motor and social
        behaviors in Bcl11a-deficient mice.
      explanation: Identifies a downstream effector in Purkinje cells.

- name: Gamma-Globin Derepression in Adult Erythroid Cells
  biological_scale: CELLULAR
  description: >-
    Full-length BCL11A is expressed in adult, not fetal, erythroid cells, occupies sites in the beta-globin cluster and
    silences the gamma-globin genes. In cultured erythroid progenitors from a patient with a truncating variant the HBG1/2
    promoters remained accessible and HBG1/2 were expressed, while genome-wide expression otherwise matched normal adult
    erythropoiesis. Persistence of HbF is the main erythroid consequence; hematologic and immunologic function are
    otherwise normal.

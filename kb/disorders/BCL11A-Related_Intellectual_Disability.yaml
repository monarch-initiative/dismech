biochemical:
- name: Fetal Hemoglobin
  presence: Elevated
  context: >-
    Measured by hemoglobin electrophoresis or HPLC. Not informative in the first 12 to 24 months of life, when HbF is
    physiologically high. Proposed as a functional readout when a BCL11A variant is of uncertain significance.
  readouts:
  - target: Gamma-Globin Derepression in Adult Erythroid Cells
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Elevated HbF reports reduced BCL11A repressor activity in erythroid cells and supports pathogenicity of a candidate
      loss-of-function variant.
  biomarker_term:
    preferred_term: hemoglobin F measurement
    term:
      id: NCIT:C92262
      label: Hemoglobin F Measurement
  evidence:
  - reference: PMID:39448799
    reference_title: "BCL11A intellectual developmental disorder: defining the clinical spectrum and genotype-phenotype
      correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With a median age at last HbF measurement of 10.5 years (range 5–41), the median value of HbF was 15.6% (range
      4.1–35), with an inverse trend between age and HbF
    explanation: HbF levels in the cohort.
  - reference: PMID:39448799
    reference_title: "BCL11A intellectual developmental disorder: defining the clinical spectrum and genotype-phenotype
      correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We suggest using HbF testing by hemoglobin electrophoresis or HPLC as a biomarker for BCL11A-IDD with variants of
      unknown significance, though physiologically elevated HbF in the general population in the first 12–24 months of
      life precludes it as an early infant biomarker.
    explanation: Recommended diagnostic use and its age limit.
  - reference: PMID:33938942
    reference_title: Molecular analysis of the erythroid phenotype of a patient with BCL11A haploinsufficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient displayed high fetal hemoglobin (HbF) levels (12.1-18.7% of total hemoglobin), in contrast to the
      parents who had HbF levels of 0.3%.
    explanation: HbF in a patient compared with unaffected parents.
genetic:
- name: BCL11A
  gene_term:
    preferred_term: BCL11A
    term:
      id: hgnc:13221
      label: BCL11A
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Across 77 individuals, 60 distinct variants (30 frameshift, 17 stop-gain, 7 missense, 6 splice-site) and 8
    BCL11A-confined microdeletions have been reported. Truncating variants tend toward a more severe phenotype than
    missense and splice variants. OMIM 617101.
  variants:
  - name: c.1078dup p.(Leu360Profs*212)
    description: >-
      Recurrent frameshift at leucine 360 of the BCL11A-XL and -L isoforms, seen in three individuals of the largest
      cohort; HbF persistence was confirmed in the two tested.
    evidence:
    - reference: PMID:39448799
      reference_title: "BCL11A intellectual developmental disorder: defining the clinical spectrum and genotype-phenotype
        correlations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        two of the three patients in our cohort (all with a single nucleotide duplication, c.1078dup) had hemoglobin
        isoforms assessed, confirming persistence of HbF and supporting pathogenicity of the alleles inducing frameshift
        at the same locus
      explanation: Recurrent variant with HbF confirmation.
  - name: c.1453G>T p.(Glu485*)
    description: >-
      De novo stop-gain variant truncating BCL11A-XL before its three C-terminal zinc fingers and nuclear localization
      signal; the carrier had HbF of 12.1 to 18.7%.
    evidence:
    - reference: PMID:33938942
      reference_title: Molecular analysis of the erythroid phenotype of a patient with BCL11A haploinsufficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe a patient with a de novo heterozygous variant, c.1453G>T, in the BCL11A gene, resulting in truncation
        of the BCL11A-XL protein (p.Glu485X).
      explanation: Variant and its effect on the protein.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN

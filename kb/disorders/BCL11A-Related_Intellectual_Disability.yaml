- name: Purkinje Cell Dysfunction
  biological_scale: CELLULAR
  description: >-
    BCL11A is highly expressed in Purkinje cells of the developing human and mouse cerebellum. Conditional deletion of
    Bcl11a in mouse Purkinje cells impairs their survival, dendrite morphology, spine density and spontaneous firing,
    acting partly through the downstream target Vav3, and causes ataxia, motor learning deficits and autistic-like
    behavior.

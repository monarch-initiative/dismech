notes: >-
  Naming: the entry is named after the GeneReviews chapter title (BCL11A-Related Intellectual Disability, PMID:31556984),
  which has the same scope as the bound MONDO term; the MONDO and OMIM label, Dias-Logan syndrome, is kept as a synonym.
  Scope: the entry covers intragenic BCL11A variants and deletions confined to BCL11A. Larger 2p15-p16.1 deletions that
  also remove neighbouring genes cause 2p15-p16.1 microdeletion syndrome, which has more congenital anomalies and
  cortical malformations and is treated as a separate condition (PMID:39448799). Older reports of HbF persistence with
  neurodevelopmental impairment in 2p15-p16.1 deletion carriers (PMID:25938782, PMID:26019277) are cited here only for
  findings attributed to BCL11A. A single Wilms tumor has been reported in a child with Dias-Logan syndrome
  (PMID:40772033); its authors state that one case is insufficient to establish a tumor predisposition, and no
  malignancy was found in the 77-person series of PMID:39448799. Erythroid-specific disruption of BCL11A is a strategy
  for raising HbF in sickle cell disease and beta-thalassemia; it is not a treatment for this disorder, whose
  constitutional haploinsufficiency is the natural counterpart of that strategy (PMID:33938942).

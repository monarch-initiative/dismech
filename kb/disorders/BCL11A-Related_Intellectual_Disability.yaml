- name: Impaired Cortical Projection Neuron Development
  biological_scale: CELLULAR
  description: >-
    In the developing mouse neocortex Bcl11a directly represses Sema3c in migrating upper-layer neurons, which is required
    for their multipolar-to-bipolar switch and radial migration; it directly represses Tbr1 in layer 5 to specify
    subcerebral projection neurons; and through Bcl6 it supports survival of upper-layer projection neurons during
    postnatal corticogenesis. These findings come from homozygous or conditional knockouts, not from the heterozygous
    state seen in patients.
  cell_types:

    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Bcl11a-deficient late-born neurons fail to correctly switch from multipolar to bipolar morphology, resulting in
      impaired radial migration.
    explanation: Conditional knockout mouse; supports the developmental role, not the heterozygous patient state.
  - reference: PMID:26182416

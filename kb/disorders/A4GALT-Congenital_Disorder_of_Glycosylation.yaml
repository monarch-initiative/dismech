    snippet: "A4GALT | HGNC:18149 | A4GALT-related congenital disorder of glycosylation | MONDO:0100587 | AR | Definitive"
    explanation: >-
      The ClinGen Congenital Disorders of Glycosylation Gene Curation Expert
      Panel records autosomal recessive inheritance for this gene-disease pair.
prevalence:
- population: Europeans
  measure_type: UNKNOWN
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.58
  notes: >-
    5.8 per million is the only quantitative figure in circulation, and it
    should be read with its provenance. The citing papers trace it to Race and
    Sanger, Blood Groups in Man (1975) - a half-century-old textbook estimate,
    not a modern population study - and they describe it inconsistently as a
    "frequency" and as an "incidence", which is why measure_type is left
    UNKNOWN rather than guessed. The phenotype is reported as commoner in
    northern Sweden, in Japan and among the Amish, where founder alleles
    concentrate it. No carrier frequency has been established in any
    population.
  evidence:
  - reference: PMID:41368234
    reference_title: "Unveiling Novel and Rare Variants in the α-1,4-Galactosyltransferase Gene Leading to Rare p Phenotype in Indian Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The reported frequency is approximately 5.8 per million Europeans
    explanation: >-
      States the only retrievable prevalence figure. The quote is taken from
      the paper's introduction, where it restates an older textbook estimate
      rather than a result of this study, which is why quote_role is BACKGROUND.
pathophysiology:
- name: Biallelic A4GALT Loss-of-Function Variants
  description: >-
    Two null A4GALT alleles - missense changes that abolish catalysis, nonsense
    variants, frameshifts or in-frame deletions - leave no functional
    lactosylceramide 4-alpha-galactosyltransferase. Alleles are highly
    heterogeneous between populations and often homogeneous within one, with
    p.Met183Lys predominant in Sweden, p.Pro251Leu and p.Trp261Ter in Japan and
    p.Ser100Leu among the Amish.
  role: trigger
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  molecular_functions:
  - preferred_term: lactosylceramide 4-alpha-galactosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0050512
      label: lactosylceramide 4-alpha-galactosyltransferase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    gene:
      preferred_term: A4GALT
      term:
        id: hgnc:18149
        label: A4GALT
    description: >-
      Germline biallelic loss of function. Most reported probands are
      homozygous for a population-specific founder allele, but compound
      heterozygosity occurs and is not rare: a genotyping study of both P1PK
      and GLOB loci left eight p alleles unlinked because of it, and
      compound-heterozygous probands are reported. `zygosity` is deliberately
      left unset rather than recorded as HOMOZYGOUS, because the slot is
      single-valued and would otherwise assert the majority architecture as
      the only one.
  evidence:
  - reference: PMID:10993874
    reference_title: "Molecular basis for the p phenotype. Identification of distinct and multiple mutations in the alpha 1,4-galactosyltransferase gene in Swedish and Japanese individuals."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      P251L and M183K mutations showed complete loss of enzyme function
    explanation: >-
      Transfection assays establish that the recurrent p-phenotype missense
      alleles abolish enzyme activity, which is the mechanism of pathogenicity.
  downstream:
  - target: Absent Globotriaosylceramide (Gb3/Pk) Synthesis
    causal_link_type: DIRECT
    description: >-
      Without catalytically competent enzyme, galactose cannot be transferred
      from UDP-alpha-D-galactose to lactosylceramide in an alpha1,4 linkage.
- name: Absent Globotriaosylceramide (Gb3/Pk) Synthesis
  description: >-
    The committed, non-redundant step of globo-series glycosphingolipid
    synthesis fails in the trans-Golgi network, so no Gb3 (Pk antigen, CD77) is
    made from lactosylceramide. No compensating glycosyltransferase exists.
  role: intermediate
  biological_scale: MOLECULAR
  node_class: CATALYTIC_ACTIVITY
  molecular_functions:
  - preferred_term: lactosylceramide 4-alpha-galactosyltransferase activity
    modifier: DECREASED
    term:
      id: GO:0050512
      label: lactosylceramide 4-alpha-galactosyltransferase activity
  biological_processes:
  - preferred_term: glycosphingolipid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0006688
      label: glycosphingolipid biosynthetic process
  cellular_components:
  - preferred_term: trans-Golgi network
    term:
      id: GO:0005802
      label: trans-Golgi network
  chemical_entities:
  - preferred_term: globotriaosylceramide (Gb3)
    modifier: DECREASED
    term:
      id: CHEBI:18313
      label: alpha-D-galactosyl-(1->4)-beta-D-galactosyl-(1->4)-beta-D-glucosylceramide
  evidence:
  - reference: PMID:39511480
    reference_title: "Human Gb3/CD77 synthase: a glycosyltransferase at the crossroads of immunohematology, toxicology, and cancer research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Galabiosylceramide is the precursor of the gala-series, Gb3 initiates the
      globo-series, whereas P1 belongs to the neolacto-series of GSLs.
    explanation: >-
      Establishes that Gb3 is the initiating member of the globo-series, so its
      absence truncates the whole series rather than one antigen.
  downstream:
  - target: Loss of the Entire Globo-Series (p Phenotype)
    causal_link_type: DIRECT
    description: >-
      Gb3 is the obligate substrate from which globoside and the remaining
      globo-series antigens are built, so its absence removes them all.
- name: Loss of the Entire Globo-Series (p Phenotype)
  description: >-
    Absent Gb3 deprives B3GALNT1 of its substrate, so globoside (Gb4, the P
    antigen) cannot be made, and the downstream GLOB-collection antigens are
    lost with it. The enzyme's second acceptor branch is lost in parallel, so
    the P1 antigen on paragloboside is absent too. Erythrocytes and tissues
    therefore display no Pk, no P and no P1 - the serological p phenotype. This
    is substrate-level epistasis on B3GALNT1, not a second mutation.
  role: intermediate
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:39511480
    reference_title: "Human Gb3/CD77 synthase: a glycosyltransferase at the crossroads of immunohematology, toxicology, and cancer research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The P antigen is globotetraosylceramide (Gb4), produced directly from Pk
      (Gb3) (Fig. 2) and hence also absent in p individuals.
    explanation: >-
      States the substrate dependency by which loss of Gb3 also removes the P
      antigen, the step that converts an enzyme defect into a whole-series loss.
  - reference: PMID:41368234
    reference_title: "Unveiling Novel and Rare Variants in the α-1,4-Galactosyltransferase Gene Leading to Rare p Phenotype in Indian Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The rare p phenotype is characterized by the absence of P, P1, and Pk
      antigens
    explanation: >-
      Defines the serological phenotype that results from the loss of the
      globo-series.
  downstream:
  - target: Naturally Occurring Anti-PP1Pk Isoantibody
    causal_link_type: DIRECT
    description: >-
      Absence of the self-antigen permits formation of an isoantibody against
      it.
  - target: Resistance to Parvovirus B19 Infection
    causal_link_type: DIRECT
    description: >-
      Globoside is the parvovirus B19 receptor, so its absence blocks
      productive infection of erythroid progenitors.
  - target: Resistance to Shiga Toxin
    causal_link_type: DIRECT
    description: >-
      Gb3 is the Shiga toxin receptor, so its absence removes the binding site
      the toxin needs.
- name: Naturally Occurring Anti-PP1Pk Isoantibody
  description: >-
    Individuals with the p phenotype form anti-PP1Pk (historically anti-Tj-a),
    with both IgM and IgG components, without prior transfusion or pregnancy.
    The initiating stimulus is not established; cross-reactive environmental
    Gal-alpha1,4-Gal glycans are the usual proposed explanation by analogy with
    the ABO isoagglutinins, but no primary study demonstrating the immunogen
    was found. Titre fluctuates and is boosted by transfusion and pregnancy.
  role: intermediate
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:33326620
    reference_title: "Clinical consequences of the extremely rare anti-PP1Pk isoantibodies in pregnancy: a case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with this phenotype spontaneously form anti-PP1Pk
      isoantibodies, associated with severe haemolytic transfusion reactions,
      recurrent spontaneous abortion and haemolytic disease of the fetus and
      newborn (HDFN).
    explanation: >-
      States both that the antibody arises spontaneously and the three clinical
      consequences that follow from it.
  downstream:
  - target: Haemolytic transfusion reaction
    causal_link_type: DIRECT
    description: >-
      Anti-PP1Pk binds transfused P/P1/Pk-positive red cells and drives
      complement-mediated intravascular haemolysis.
  - target: Recurrent spontaneous abortion
    causal_link_type: DIRECT
    description: >-
      Transplacental IgG anti-PP1Pk is proposed to attack the globoside-rich
      fetal portion of the placenta. The mechanism is the standard explanation
      but is explicitly unproven; the relation between titre and loss risk is
      reported as unclear.
  - target: Haemolytic disease of the fetus and newborn
    causal_link_type: DIRECT
    description: >-
      Where pregnancy continues, transplacental IgG binds fetal red cells,
      giving a positive cord direct antiglobulin test and usually mild
      haemolysis.
- name: Resistance to Parvovirus B19 Infection
  description: >-
    The P antigen (globoside) is the cellular receptor for parvovirus B19.
    Erythroid progenitors of p individuals lack it, and their marrow sustains
    normal erythropoiesis in the presence of very high virus concentrations.
    This is a demonstrated protective consequence of the genotype in humans,
    not an inference.
  role: protective
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  evidence:
  - reference: PMID:8139629
    reference_title: "Resistance to parvovirus B19 infection due to lack of virus receptor (erythrocyte P antigen)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People who do not have P antigen, which is the cellular receptor for
      parvovirus B19, are naturally resistant to infection with this pathogen.
    explanation: >-
      Cross-sectional serology in p individuals plus marrow inoculation
      experiments establish resistance to B19 in humans.
  - reference: PMID:8139629
    reference_title: "Resistance to parvovirus B19 infection due to lack of virus receptor (erythrocyte P antigen)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      bone marrow from donors with the p phenotype maintained normal
      erythropoiesis despite very high concentrations of virus
    explanation: >-
      The ex vivo marrow arm of the same study shows the block is at the level
      of infection of erythroid progenitors.
- name: Resistance to Shiga Toxin
  description: >-
    Globotriaosylceramide is the receptor for Shiga toxin (verotoxin), so cells
    that cannot make it have no receptor to bind. This has been demonstrated in
    the Gb3/CD77 synthase-null mouse, which survives verotoxin doses lethal to
    wild-type animals. It has not been shown in human p individuals: no
    clinical study of Shiga toxin-producing infection in this population was
    found, so the human protection is an inference from the mouse and from the
    receptor biology, not an observation.
  role: protective
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:16476743
    reference_title: "Targeted disruption of Gb3/CD77 synthase gene resulted in the complete deletion of globo-series glycosphingolipids and loss of sensitivity to verotoxins."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Although wild-type mice died after administration of 0.02 microg of VT-2
      or 1.0 microg of VT-1, the mutant mice showed no reaction to doses as
      much as 100 times that administered to wild types.
    explanation: >-
      Demonstrates resistance in the knockout mouse. The evidence is
      MODEL_ORGANISM, and no human counterpart was found.
phenotypes:
- name: Haemolytic transfusion reaction
  category: Clinical
  description: >-
    Transfusion of ABO-compatible but P/P1/Pk-positive red cells into a p
    individual with anti-PP1Pk causes severe, potentially fatal acute
    haemolysis. Only p red cells are compatible, which makes rare-donor registry
    access the central management problem.
  phenotype_term:
    preferred_term: Haemolytic transfusion reaction
    term:
      id: HP:0001878
      label: Hemolytic anemia
  notes: >-
    Bound to the consequence rather than the event. HPO has no term for a
    haemolytic transfusion reaction: searching the HP label cache for
    "transfusion" returns no reaction term, and HP:0001878 Hemolytic anemia is
    the nearest accurate concept for what the reaction produces. The
    event-versus-state gap is carried in `preferred_term` and the description.
  evidence:
  - reference: PMID:41368234
    reference_title: "Unveiling Novel and Rare Variants in the α-1,4-Galactosyltransferase Gene Leading to Rare p Phenotype in Indian Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study underscores the critical need for rare donor registries,
      especially for patients at high risk of severe hemolytic reactions during
      transfusion.
    explanation: >-
      An Indian series of six probands, half of them ascertained through
      crossmatch incompatibility, frames severe haemolytic transfusion reaction
      as the principal transfusion risk.
- name: Recurrent spontaneous abortion
  category: Clinical
  description: >-
    Recurrent, predominantly first-trimester pregnancy loss in women with
    anti-PP1Pk is the dominant reproductive burden and a common route to
    ascertainment. No reliable quantitative loss risk could be sourced; the
    retrievable primary statements are qualitative, and the relationship
    between antibody titre and risk is reported as unclear.
  phenotype_term:
    preferred_term: Recurrent spontaneous abortion
  notes: >-
    Left unbound. HP:0200067 Recurrent spontaneous abortion is rejected by
    `just validate-terms` as outside the PhenotypeTerm dynamic enum, which
    admits only descendants of HP:0000118 Phenotypic abnormality; HP:0005268
    Miscarriage and HP:0003826 Stillbirth are outside it for the same reason.
    kb/disorders/Uterine_Leiomyoma.yaml and
    kb/disorders/Ventriculomegaly_and_Arthrogryposis.yaml leave the same
    phenotype unbound on the same grounds.
  evidence:
  - reference: PMID:39511480
    reference_title: "Human Gb3/CD77 synthase: a glycosyltransferase at the crossroads of immunohematology, toxicology, and cancer research."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Anti-PP1Pk antibodies can induce severe hemolytic transfusion reactions,
      recurrent spontaneous abortions, and sporadically mild hemolytic disease
      of the fetus and newborn
    explanation: >-
      Review statement of the three antibody-driven clinical consequences,
      including recurrent pregnancy loss.
  - reference: PMID:39907038
    reference_title: "Novel A4GALT Variants Cause Rare p Phenotype and Recurrent Pregnancy Loss in a Chinese Individual."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rare p phenotype in the rare PP1Pk blood group system is closely
      associated with spontaneous first-trimester abortions.
    explanation: >-
      Primary case report of a woman with the p phenotype, anti-PP1Pk at an IgG
      titre of 1:32 and recurrent pregnancy loss, stating the association with
      first-trimester loss directly rather than through a review.
- name: Haemolytic disease of the fetus and newborn
  category: Clinical
  description: >-
    Transplacental IgG anti-PP1Pk gives a frequently positive cord blood direct
    antiglobulin test. Clinically significant disease is uncommon and usually
    mild, managed with phototherapy where it occurs.
  phenotype_term:
    preferred_term: Neonatal unconjugated hyperbilirubinemia
    term:
      id: HP:0008176
      label: Neonatal unconjugated hyperbilirubinemia
  notes: >-
    Bound to the manifestation rather than the syndrome. HPO has no term for
    haemolytic disease of the fetus and newborn: searching the HP label cache
    for "hemolytic disease", "erythroblastosis" and "fetus and newborn" returns
    no such term, and HP:0032366 Positive direct antiglobulin test, the other
    candidate, is outside the PhenotypeTerm enum. HP:0008176 captures the
    manifestation that is actually treated.
  evidence:
  - reference: PMID:33326620
    reference_title: "Clinical consequences of the extremely rare anti-PP1Pk isoantibodies in pregnancy: a case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although a positive cord blood direct antiglobulin test is frequently
      noted, clinically significant HDFN appears uncommon, though possible.
    explanation: >-
      Case series plus literature review scoping the severity of HDFN in this
      isoimmunization, and the basis for calling it usually mild.

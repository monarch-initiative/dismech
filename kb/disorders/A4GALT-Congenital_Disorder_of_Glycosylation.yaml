inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Biallelic A4GALT null alleles are required. Penetrance is complete for the
    serological phenotype, which is present from birth and demonstrable on cord
    blood. Penetrance of the clinical complications is neither complete nor
    quantified, because those depend on exposure to antigen-positive red cells
    or to an antigen-positive conceptus rather than on genotype. Most reported
    probands are homozygous, and consanguinity and founder effects dominate the
    reported series.
  evidence:

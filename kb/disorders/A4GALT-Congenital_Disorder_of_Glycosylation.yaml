name: A4GALT-Congenital Disorder of Glycosylation
creation_date: "2026-11-19T16:24:19Z"
category: Mendelian
synonyms:
- A4GALT-CDG
- A4GALT-congenital disorder of glycosylation
- A4GALT-related congenital disorder of glycosylation
- p phenotype
- p-null phenotype
- Tj(a-) phenotype
- Gb3/CD77 synthase deficiency
description: >-
  A4GALT-congenital disorder of glycosylation (A4GALT-CDG) is an autosomal
  recessive glycosphingolipid synthesis defect caused by biallelic
  loss-of-function variants in A4GALT, which encodes lactosylceramide
  4-alpha-galactosyltransferase (Gb3/CD77 synthase, alpha4Gal-T1). The enzyme
  makes the Gal-alpha1,4-Gal linkage that converts lactosylceramide to
  globotriaosylceramide (Gb3, the Pk antigen, CD77) and paragloboside to the P1
  antigen. Because Gb3 is the obligate precursor from which B3GALNT1 builds
  globoside (Gb4, the P antigen), enzyme loss removes the entire globo-series:
  red cells and tissues express no Pk, no P and no P1, which is the serological
  p phenotype. Unlike the N-glycosylation CDGs, the disorder produces no
  multisystem or neurological phenotype and no transferrin glycoform
  abnormality; affected individuals are themselves healthy. The clinical burden
  is immunohaematological and obstetric, and is driven not by the missing
  glycolipid but by the naturally occurring anti-PP1Pk isoantibody that p
  individuals form without prior antigen exposure, which causes severe
  haemolytic transfusion reactions, recurrent first-trimester pregnancy loss
  and usually mild haemolytic disease of the fetus and newborn. The same
  glycolipid loss confers a demonstrated natural resistance to parvovirus B19,
  whose receptor is the P antigen.
notes: >-
  Naming and scope. The entry is named for the gene, following the
  kb/disorders/ convention for congenital disorders of glycosylation, and is
  bound to MONDO:0100587, whose current label is "A4GALT-related congenital
  disorder of glycosylation" (the stub and some secondary sources still carry
  the older "A4GALT-congenital disorder of glycosylation", retained here as a
  synonym). The "CDG" label is the ClinGen Congenital Disorders of
  Glycosylation Gene Curation Expert Panel's, and it is worth stating plainly
  that this disorder does not behave like a classical CDG: there is no
  transferrin isoform abnormality and no CDG biochemical screening marker, so
  the usual CDG diagnostic route does not detect it.

  Three adjacent entities are deliberately kept out of this entry. NOR
  polyagglutination syndrome arises from a different A4GALT allele class
  (p.Gln211Glu, which alters acceptor specificity rather than abolishing
  activity) and was split from this disease by ClinGen; p.Gln211Glu must not be
  recorded here as a pathogenic allele. Fabry disease (GLA) is failure of Gb3
  catabolism, the mirror image of this synthetic defect, and A4GALT is a
  substrate-reduction drug target there rather than a cause. Shiga
  toxin-associated haemolytic uraemic syndrome, curated at
  kb/disorders/Shiga_Toxin-Associated_Hemolytic_Uremic_Syndrome.yaml, involves
  A4GALT only as the synthase of the toxin receptor Gb3, not as a disease gene.
  The P1/P2 polymorphism at this locus is a normal trait governed by intronic
  regulatory variation, not by coding variants, and is not disease.

  No GeneReviews chapter exists for this disorder. Checked with
  `just check-genereviews` against the committed Bookshelf index (snapshot
  2026-09-10, 958 GeneReviews chapters) with the entry's full synonym list
  present; the verdict is NO_CHAPTER on both GeneReviews and StatPearls, and is
  a verified negative rather than an unproven one. MONDO carries no OMIM,
  Orphanet, MedGen, UMLS, DOID or MeSH cross-reference on this term, so no
  Orphanet record was available to cache either.

      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing revealed the presence of two compound novel
        heterozygous variants c.370_371del and c.507C>G in the A4GALT gene,
        which contributed to the p phenotype and pregnancy loss in this woman.
      explanation: >-
        Primary report of a compound-heterozygous proband, and the basis for
        leaving `zygosity` unset on the lesion node.
  - name: p.Ser100Leu
    description: >-
      The Amish founder allele (c.299C>T).
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:18067504
      reference_title: "Expression of a novel missense mutation found in the A4GALT gene of Amish individuals with the p phenotype."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All 20 samples were homozygous for 299C>T changing serine to leucine in
        a region that is highly conserved in homologous genes across species
        borders.
      explanation: >-
        Establishes the Amish founder allele in 19 Amish and one Pakistani p
        individual.
  notes: >-
    A4GALT at 22q13.2 encodes lactosylceramide 4-alpha-galactosyltransferase
    (Gb3/CD77 synthase, alpha4Gal-T1, EC 2.4.1.228). The entire open reading
    frame lies within one exon, which makes single-gene Sanger sequencing a
    straightforward confirmatory test. Reported null alleles are numerous and
    largely private or population-specific.

    p.Gln211Glu (c.631C>G) is deliberately not listed here. It changes the
    enzyme's acceptor specificity rather than abolishing activity, and causes
    NOR polyagglutination syndrome, which ClinGen split from this disease and
    curates separately.
diagnosis:
- name: Red cell antibody screen and antigen typing
  description: >-
    The entry point in essentially every published case is immunohaematological
    rather than metabolic. Antibody screening shows panagglutination against
    all panel cells with a negative direct antiglobulin test and autocontrol in
    the affected individual; P, P1 and Pk typing is negative; and only
    ABO-compatible p red cells are compatible on crossmatch. A positive direct
    antiglobulin test in the proband points elsewhere, whereas a positive cord
    blood test in the neonate of a p mother is expected.
  evidence:
  - reference: PMID:41368234
    reference_title: "Unveiling Novel and Rare Variants in the α-1,4-Galactosyltransferase Gene Leading to Rare p Phenotype in Indian Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      required blood transfusions but experienced difficulty in cross-matching
    explanation: >-
      Half the probands in this series were ascertained through crossmatch
      incompatibility, which is the characteristic presenting route.
- name: A4GALT sequencing
  description: >-
    Molecular confirmation follows serology, and the single-exon open reading
    frame makes direct sequencing of A4GALT practical. Exome sequencing now
    reaches the diagnosis from the genetics rather than the transfusion side,
    in the workup of recurrent pregnancy loss. The P1PK and GLOB loci are
    genotyped together, so B3GALNT1 is sequenced alongside A4GALT to
    distinguish the p phenotype from the P1k/P2k phenotype.
  evidence:
  - reference: PMID:39907038
    reference_title: "Novel A4GALT Variants Cause Rare p Phenotype and Recurrent Pregnancy Loss in a Chinese Individual."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing revealed the presence of two compound novel
      heterozygous variants c.370_371del and c.507C>G in the A4GALT gene
    explanation: >-
      Supports the exome route specifically: this diagnosis was reached from
      the genetics side, in the workup of recurrent pregnancy loss, rather than
      from the transfusion laboratory.
  - reference: PMID:23927681
    reference_title: "P1/P2 genotyping of known and novel null alleles in the P1PK and GLOB histo-blood group systems."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, six previously unknown null mutations were found and
      characterized in A4GALT while four new changes were revealed in
      B3GALNT1.
    explanation: >-
      The study sequenced both loci in the same sample set and found new null
      alleles in each, which is what supports genotyping A4GALT and B3GALNT1
      together rather than A4GALT alone.
treatments:
- name: Rare donor registry sourcing of p red cells
  description: >-
    Only p red cells are compatible, so management of any transfusion need
    depends on advance access to a rare-donor registry, family screening for p
    siblings, and where feasible directed or autologous donation. Elective
    surgery has been conducted without transfusion where compatible units could
    not be guaranteed.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:41368234
    reference_title: "Unveiling Novel and Rare Variants in the α-1,4-Galactosyltransferase Gene Leading to Rare p Phenotype in Indian Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study underscores the critical need for rare donor registries,
      especially for patients at high risk of severe hemolytic reactions during
      transfusion.
    explanation: >-
      States rare-donor registry access as the central transfusion-safety
      intervention for this phenotype.
  target_mechanisms:
  - target: Haemolytic transfusion reaction
    treatment_effect: BYPASSES
    description: >-
      Transfusing only p red cells removes the antigen the isoantibody binds,
      preventing the haemolytic reaction rather than treating it.
- name: Therapeutic plasma exchange in pregnancy
  description: >-
    Plasma exchange, with or without intravenous immunoglobulin, is the
    mainstay of managing anti-PP1Pk isoimmunized pregnancy, aimed at lowering
    antibody titre. The literature is limited to a small number of case
    reports, and early initiation in high-risk women is what is advised rather
    than demonstrated in trials. Pregnancies are managed in a high-risk
    obstetric service with serial middle cerebral artery peak systolic velocity
    Doppler to screen for fetal anaemia.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: therapeutic plasma exchange
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  evidence:
  - reference: PMID:33326620
    reference_title: "Clinical consequences of the extremely rare anti-PP1Pk isoantibodies in pregnancy: a case series and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early initiation of TPE in high risk patients should be strongly
      considered.
    explanation: >-
      Recommendation drawn from a four-pregnancy series plus literature review;
      the supporting evidence is case-report level, which the authors state.
  target_mechanisms:
  - target: Naturally Occurring Anti-PP1Pk Isoantibody
    treatment_effect: INHIBITS
    description: >-
      Plasma exchange removes circulating anti-PP1Pk, lowering the titre
      available to cross the placenta.
- name: Intravenous immunoglobulin in pregnancy
  description: >-
    Intravenous immunoglobulin is given alongside therapeutic plasma exchange
    in anti-PP1Pk isoimmunized pregnancy. In the best-documented case it was
    started with twice-weekly plasma exchange at 9 weeks of gestation at
    1 g/kg, against a threshold titre of 16, and the titre fell from 128 to 8
    by 10 weeks; the pregnancy reached term with an uncomplicated delivery and
    unremarkable newborn haemoglobin and bilirubin. The evidence is
    case-report level and the two treatments were given together, so the
    contribution of immunoglobulin on its own is not separable.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: intravenous immunoglobulin
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  dosing_interval: weekly
  dosing_interval_days: 7
  evidence:
  - reference: PMID:38733134
    reference_title: "Successful management of maternal anti-PP1P(k) alloimmunization in pregnancy with therapeutic plasma exchange and intravenous immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twice-weekly TPE (1.5 plasma volume [PV], 5% albumin replacement) with
      weekly titers and IVIG (1 g/kg) was initiated at 9 weeks of gestation
    explanation: >-
      The regimen as given, including the dose and the gestational age at
      which it was started.
  - reference: PMID:38733134
    reference_title: "Successful management of maternal anti-PP1P(k) alloimmunization in pregnancy with therapeutic plasma exchange and intravenous immunoglobulin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With multidisciplinary care, a successful pregnancy is possible with
      IVIG and TPE adjusted to PV and titers.
    explanation: >-
      The authors' conclusion, which pairs immunoglobulin with plasma exchange
      rather than claiming either alone.
  target_mechanisms:
  - target: Naturally Occurring Anti-PP1Pk Isoantibody
    treatment_effect: INHIBITS
    description: >-
      Given with plasma exchange to hold the anti-PP1Pk titre below the
      treatment threshold.
animal_models:
- name: Gb3/CD77 synthase (A4galt) null mouse
  species: Mouse
  species_term:
    preferred_term: Mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genotype: A4galt targeted disruption, homozygous null
  publication: PMID:16476743
  genes:
  - preferred_term: A4galt
    term:
      id: MGI:3512453
      label: A4galt
  description: >-
    Targeted disruption of the mouse Gb3/CD77 synthase gene deletes the
    globo-series glycosphingolipids completely, which is the same biochemical
    lesion as the human p phenotype. It is the model that demonstrates the
    receptor consequences of that lesion in a whole animal.
  modeled_mechanisms:
  - target: Loss of the Entire Globo-Series (p Phenotype)
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The knockout reproduces the defining biochemical lesion - complete
      absence of the globo-series - in every tissue.
    limitations: >-
      The mouse models the glycolipid loss, not the disease. The human clinical
      burden is driven by the anti-PP1Pk isoantibody, and no murine isoantibody
      counterpart is reported, so the model is silent on haemolytic transfusion
      reactions, pregnancy loss and haemolytic disease of the fetus and newborn
      - which is to say, on everything that makes the human condition a disease.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        The antibody arm of the human disease is outside the model: the mouse
        reproduces the missing antigen but not the immune response to it that
        produces every human clinical event.
    readouts:
    - name: Verotoxin lethality
      target: Loss of the Entire Globo-Series (p Phenotype)
      direction: ABOLISHED
      interpretation: >-
        Loss of toxin sensitivity is the functional readout that the Gb3
        receptor is absent.
      evidence:
      - reference: PMID:16476743
        reference_title: "Targeted disruption of Gb3/CD77 synthase gene resulted in the complete deletion of globo-series glycosphingolipids and loss of sensitivity to verotoxins."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          the mutant mice showed no reaction to doses as much as 100 times that
          administered to wild types
        explanation: >-
          The measured outcome establishing that the receptor is gone.
  evidence:
  - reference: PMID:16476743
    reference_title: "Targeted disruption of Gb3/CD77 synthase gene resulted in the complete deletion of globo-series glycosphingolipids and loss of sensitivity to verotoxins."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To examine whether globotriaosylceramide (Gb3/CD77) is a receptor for
      verotoxins (VTs) in vivo, sensitivity of Gb3/CD77 synthase null mutant
      mice to VT-2 and VT-1 was analyzed.
    explanation: >-
      Establishes the model and what it was built to test.
  notes: >-
    A second study of the same knockout reports reduced femoral cancellous bone
    mass and reduced bone formation, with Gb4 expressed in osteoblasts
    (PMID:31540393). That is a mouse finding with no reported human
    counterpart: no bone phenotype is described in p individuals, and none is
    curated in this entry's phenotypes. It is recorded here rather than as a
    human phenotype, and would be the basis of a HUMAN_MODEL_MISMATCH
    discussion if anyone looks for skeletal findings in p individuals.

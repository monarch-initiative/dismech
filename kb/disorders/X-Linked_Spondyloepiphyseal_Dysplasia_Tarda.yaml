inheritance:
- name: X-Linked Recessive
  description: >-
    X-linked recessive. Hemizygous males are affected; obligate female carriers
    are generally clinically and radiographically indistinguishable from the
    general population, though some show phenotypic changes. Note that TRAPPC2
    escapes X-inactivation, which is worth knowing when reasoning about carrier
    expression.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  evidence:

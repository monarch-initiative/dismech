treatments:
- name: Hip Arthroplasty for End-Stage Hip Osteoarthritis
  description: >-
    Joint replacement for the secondary osteoarthritis. Because the arthritis is
    mechanical rather than a primary cartilage disease, replacing the joint
    addresses the actual problem, and it is the only intervention in this entry
    that changes the natural history of a manifestation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: hip arthroplasty
    term:
      id: NCIT:C51691
      label: Arthroplasty
  target_mechanisms:
  - target: Altered Spinal and Hip Joint Biomechanics
    description: >-
      Replaces the dysplastic articulation whose abnormal loading drives the
      degeneration.
  evidence:
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter usually leads to premature secondary osteoarthritis often requiring hip arthroplasty."
    explanation: >-
      Establishes hip arthroplasty as the usual endpoint of management in this
      disease.
- name: Molecular Carrier Testing and Presymptomatic Diagnosis
  description: >-
    Once the familial TRAPPC2 variant is known, testing identifies carriers and
    diagnoses affected boys before any clinical or radiographic sign appears.
    The clinical value of pre-expression diagnosis is not established: the
    authors who demonstrated it propose joint protection as a possible benefit
    but explicitly frame it as unproven.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11760838
    reference_title: "Preonset studies of spondyloepiphyseal dysplasia tarda caused by a novel 2-base pair deletion in SEDL encoding sedlin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular testing of SEDL enables carrier detection and definitive diagnosis before clinical or radiographic expression of SEDT."
    explanation: >-

diagnosis:
- name: Characteristic radiographs with normal metabolic studies, confirmed by TRAPPC2 sequencing
  description: >-
    The diagnosis is radiographic plus molecular. The finding that does the most
    diagnostic work is a negative one: metabolic laboratory studies are normal,
    which is what separates SEDT from the mucopolysaccharidoses it can resemble
    on film. Clinical diagnosis is nonetheless often delayed, precisely because
    nothing is abnormal until late childhood and no metabolic screen flags it.
  evidence:
  - reference: PMID:32471379
    reference_title: "A novel deletion variant in TRAPPC2 causes spondyloepiphyseal dysplasia tarda in a five-generation Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical diagnosis can be challenging due to the late-onset of the disease and lack of systemic metabolic abnomalites."
    explanation: >-
      States both the diagnostic difficulty and its cause. The source spells
      "abnomalites"; the snippet reproduces the source rather than correcting
      it.
  - reference: PMID:32471379
    reference_title: "A novel deletion variant in TRAPPC2 causes spondyloepiphyseal dysplasia tarda in a five-generation Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic diagnosis is critical in both early diagnosis and management of the disease."
    explanation: >-
      States the role of molecular confirmation.
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This progressive skeletal disorder which manifests in childhood is characterized by disproportionate short stature with short neck and trunk, barrel chest and absence of systemic complications."
    explanation: >-
      The "absence of systemic complications" is the discriminating negative
      this diagnostic entry rests on.
differential_diagnoses:
- name: Mucopolysaccharidoses
  description: >-
    Radiographically similar dysostosis, separated by the systemic and
    biochemical findings that SEDT lacks: normal metabolic studies and no
    abnormal urinary glycosaminoglycan excretion.
  evidence:
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This progressive skeletal disorder which manifests in childhood is characterized by disproportionate short stature with short neck and trunk, barrel chest and absence of systemic complications."
    explanation: >-
      The absence of systemic complications is the discriminator against the
      storage disorders.
- name: Autosomal spondyloepiphyseal dysplasia tarda
  description: >-
    SEDT is genetically heterogeneous and both autosomal and X-linked forms are
    described; only the X-linked form is TRAPPC2-related and only it is this
    entry. Pedigree structure, not radiography, separates them.
  evidence:
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both autosomal and X-linked forms have been described."
    explanation: >-
      States the genetic heterogeneity that makes this differential necessary.
- name: Spondyloepiphyseal dysplasia congenita (COL2A1)
  description: >-
    Present at birth with more severe short stature and frequent ocular
    involvement, where SEDT is normal at birth and skeleton-restricted.
- name: Progressive pseudorheumatoid dysplasia (CCN6/WISP3)
  description: >-
    Also presents in childhood with platyspondyly and progressive joint
    disease, but is autosomal recessive and affects both sexes.
discussions:
- discussion_id: sedt_tissue_restriction_of_a_housekeeping_defect
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Sar1 Cycling and COPII Megacarrier Formation
  - pathophysiology#Defective Growth Plate Chondrogenesis
  prompt: >-
    Why is a defect in a ubiquitous TRAPP subunit confined to the skeleton?
  rationale: >-
    Sedlin is the Trs20 adaptor required for assembly of TRAPP II and TRAPP
    III, and TRAPP serves general secretion and autophagy in every cell. A
    complete loss of that function should not produce a skeleton-restricted,
    late-onset, otherwise-normal phenotype. The standard explanation is
    cargo-specific: only procollagen needs megacarriers, so only cells with an
    exceptional procollagen export load fail. That explanation is plausible and
    fits the data, but it has not been tested against the alternative that
    residual TRAPP function suffices elsewhere, and no tissue-specific
    conditional model has been reported. Whether autophagy is measurably
    affected in SEDT patient cells is, as far as the sources here go, unasked.
  evidence:
  - reference: PMID:27066478
    reference_title: "TRAPP Complexes in Secretion and Autophagy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Another small subunit, Trs20/Sedlin, is an adaptor required for the association of core TRAPP with larger subunits to form TRAPP II and TRAPP III."
    explanation: >-
      Establishes that sedlin's role is general TRAPP assembly rather than
      anything chondrocyte-specific, which is what makes the tissue
      restriction a puzzle.
  proposed_experiments:
  - experiment_id: sedt_autophagy_in_patient_cells
    name: Autophagic flux in TRAPPC2-null patient cells
    description: >-
      Measure autophagic flux in patient fibroblasts or chondrocytes against
      controls, to test whether the TRAPP III arm is functionally spared or
      merely clinically silent.
    readouts:
    - name: Autophagic flux
      target: pathophysiology#Absent or Misfolded Sedlin
      direction: UNCHANGED
      interpretation: >-
        Unchanged flux would support cargo-specific vulnerability; reduced flux
        would mean the tissue restriction needs a different explanation.
- discussion_id: sedt_d47y_distinct_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Absent or Misfolded Sedlin
  prompt: >-
    Does the D47Y allele cause SEDT by the same route as the null alleles?
  rationale: >-
    Every other characterised allele removes sedlin, by truncation, splicing or
    proteasomal degradation. D47Y is expressed at wild-type levels and folds
    normally; what changes is its affinity for Bet3. If it causes the same
    disease, then altered TRAPP dynamics is sufficient, and the entry's single
    loss-of-function chain is an oversimplification for at least one allele.
    The pathophysiology nodes here are written for the loss-of-function
    majority and this allele is flagged rather than modelled separately, since
    no D47Y-specific procollagen-export experiment has been reported.
  evidence:
  - reference: PMID:19650763
    reference_title: "Biochemical consequences of sedlin mutations that cause spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two independent assays showed that the D47Y mutation resulted in an increased affinity for the transport protein particle component Bet3 compared with the wild-type sedlin."
    explanation: >-
      The measurement that separates D47Y from the degradation mechanism.
notes: >-
  On the deep-research report. An openscientist report was generated for this
  entry and passed the Named Entity Confusion preflight (TRAPPC2 mentioned 21
  times, no rival gene). Every PMID used from it was independently checked
  against PubMed before citation and every one resolved to the paper the report
  named, which is not the usual outcome and is worth recording. One
  transcription difference was found and not carried over: the report writes
  the recurrent splice allele as c.93+5G>A, whereas PMID:11326333 writes
  "IVS3+5G-->A at the intron 3 splice-donor site". This entry quotes the source
  and does not assert the HGVS form.

  Report content deliberately not curated. The report cites PMID:33550353 for
  Harris hip scores after arthroplasty and PMID:23043269 for registry
  durability. Both are about spondyloepiphyseal dysplasia or paediatric hip
  disease in general rather than about SEDT specifically, so the arthroplasty
  treatment here is supported from PMID:10431248 instead and the outcome
  figures are left out. The report also proposes GO:0006914 (autophagy) as an
  annotation marked "inferred"; inferred is not evidence, so it appears in the
  knowledge-gap discussion rather than on a node.

  Not curated, and why. No `datasets:`, `clinical_trials:`, `animal_models:` or
  `computational_models:` - no verified accession, trial registration or
  reported model organism for this disease was found. No `biochemical:` - the
  diagnostically important laboratory fact here is that the tests are normal,
  which is curated as a diagnostic and differential claim rather than as a
  biomarker. `directness` is set on six items only, where it was actually
  assessed.

- name: Altered Spinal and Hip Joint Biomechanics
  biological_scale: ORGANISM
  description: >-
    Malformed vertebral bodies and dysplastic, narrow hip joints load abnormally
    and wear early. The osteoarthritis of SEDT is therefore secondary and
    mechanical, not a primary cartilage-degradation disease, which is why joint
    replacement works so well.
  locations:
  - preferred_term: hip joint
    term:
      id: UBERON:0001486
      label: hip joint
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:

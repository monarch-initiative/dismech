    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spondyloepiphyseal dysplasia tarda (SEDL; MIM 313400) is an X-linked recessive osteochondrodysplasia that occurs in approximately two of every one million people."
    explanation: >-
      States the inheritance mode and the OMIM identifier recorded in
      external_assertions.
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Obligate female carriers are generally clinically and radiographically indistinguishable from the general population, although some cases have phenotypic changes consistent with expression of the gene defect."
    explanation: >-
      The carrier-expression claim in this block, including the exception the
      original authors record.
  - reference: PMID:32471379

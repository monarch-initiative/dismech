    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter usually leads to premature secondary osteoarthritis often requiring hip arthroplasty."
    explanation: >-
      States that the epiphyseal dysplasia leads to secondary osteoarthritis,
      which is exactly the causal claim this node makes.
  downstream:

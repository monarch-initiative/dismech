name: X-Linked Spondyloepiphyseal Dysplasia Tarda
creation_date: "2026-09-06T19:15:00Z"
category: Mendelian
description: >-
  X-linked spondyloepiphyseal dysplasia tarda (SEDT) is a late-onset X-linked
  recessive osteochondrodysplasia caused by loss-of-function variants in
  TRAPPC2 (formerly SEDL), which encodes the 140-amino-acid protein sedlin, the
  Trs20 adaptor subunit of the TRAPP tethering complex.

  The mechanism is unusually satisfying for a skeletal dysplasia because it
  explains the tissue restriction. Sedlin binds Sar1 and promotes its GTPase
  cycling at endoplasmic reticulum exit sites, which is what allows COPII
  carriers to enlarge into the megacarriers needed to export procollagen
  prefibrils. Procollagen is simply too bulky for a standard COPII vesicle. Any
  cell that secretes ordinary cargo can manage without sedlin; a growth-plate
  chondrocyte, whose whole job is exporting collagen, cannot. Patient articular
  cartilage shows the predicted secretory bottleneck as dilated rough
  endoplasmic reticulum.

  Affected hemizygous males are normal at birth and present in late childhood
  or adolescence with disproportionate short-trunk short stature, a barrel
  chest and the near-pathognomonic hump-shaped platyspondyly, followed by
  premature osteoarthritis of spine and hips. Because the lesion is confined to
  the skeleton, metabolic laboratory values are normal, which is the finding
  that separates SEDT from the mucopolysaccharidoses it can resemble
  radiographically. Life expectancy is normal. There is no disease-modifying
  therapy; management is orthopaedic, and hip arthroplasty is the definitive
  treatment for end-stage hip disease.

    explanation: >-
      Independent confirmation of the inheritance mode in a large modern
      pedigree.
pathophysiology:
- name: TRAPPC2 Loss of Function
  biological_scale: MOLECULAR
  conforms_to: "growth_plate_chondrocyte_failure#Cartilage Matrix, Signalling or Chondrocyte Biosynthetic Lesion"
  description: >-
    Hemizygous loss-of-function variants in TRAPPC2 at Xp22. The reported
    spectrum includes frameshifting dinucleotide deletions, splice-donor
    variants that skip the exon carrying the start codon, and destabilising
    missense substitutions. The common endpoint is absence of functional
    sedlin.
  genetic_context:
    gene:
      preferred_term: TRAPPC2
      term:
        id: hgnc:23068
        label: TRAPPC2
    zygosity: HEMIZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: protein-macromolecule adaptor activity
    modifier: DECREASED
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
  - preferred_term: small GTPase binding
    modifier: DECREASED
    term:
      id: GO:0031267
      label: small GTPase binding
  evidence:
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one candidate gene we detected three dinucleotide deletions in three Australian families which effect frameshifts causing premature stop codons."
    explanation: >-
      The gene-identifying observation: frameshifting deletions in three
      families, establishing loss of function as the mechanism.
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using reverse transcriptase (RT)-PCR, we demonstrated that the mutation resulted in elimination of the first 31 codons of the open reading frame."
    explanation: >-
      A second loss-of-function route, demonstrated at the transcript level
      rather than inferred from the DNA change.
  downstream:
  - target: Absent or Misfolded Sedlin
    description: >-
      Null and splice alleles abolish the protein; destabilising missense
      alleles are degraded.
- name: Absent or Misfolded Sedlin
  biological_scale: MOLECULAR
  description: >-
    Two distinct routes to the same endpoint. Truncating and splice alleles
    produce no protein. The missense substitutions S73L, F83S and V130D misfold
    and are degraded by the proteasome, which is why proteasome inhibition
    restores their expression. D47Y is the exception that proves the rule: it
    folds normally and is expressed, but binds the TRAPP subunit Bet3 with
    altered affinity, so it disrupts TRAPP dynamics rather than protein
    abundance.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:19650763
    reference_title: "Biochemical consequences of sedlin mutations that cause spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The D47Y mutant was expressed similarly to the wild-type, but the S73L, F83S and V130D mutants showed particularly low levels of expression that were rescued in the presence of the proteasome inhibitor MG132 (benzyloxycarbonyl-leucylleucylleucinal)."
    explanation: >-
      Demonstrates proteasomal degradation of the destabilising mutants, with
      the MG132 rescue that makes the interpretation causal.
  - reference: PMID:19650763
    reference_title: "Biochemical consequences of sedlin mutations that cause spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that the sedlin mutations S73L, F83S and V130D cause SEDT by sedlin misfolding, whereas the D47Y mutation may influence normal TRAPP (transport protein particle) dynamics."
    explanation: >-
      States both routes to loss of function, including the non-degradative one.
  - reference: PMID:19650763
    reference_title: "Biochemical consequences of sedlin mutations that cause spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "In situ hybridization and immunohistochemical experiments in mouse growth plates revealed sedlin to be predominantly expressed in proliferating and hypertrophic chondrocytes."
    explanation: >-
      Localises sedlin to the exact cells where the disease manifests. Indirect
      because the expression data are from mouse growth plate, not human.
  downstream:
  - target: Impaired Sar1 Cycling and COPII Megacarrier Formation
    description: >-
      Sedlin is the subunit that promotes Sar1 cycling at ER exit sites.
- name: Impaired Sar1 Cycling and COPII Megacarrier Formation
  biological_scale: MOLECULAR
  description: >-
    TANGO1 recruits sedlin to ER exit sites; sedlin binds Sar1 and promotes its
    efficient cycling. Sar1 is the GTPase whose membrane constriction limits
    carrier size, so efficient cycling is what lets a nascent COPII carrier
    keep growing into a megacarrier. Without sedlin, carriers cannot enlarge.
  biological_processes:
  - preferred_term: COPII-coated vesicle cargo loading
    term:
      id: GO:0090110
      label: COPII-coated vesicle cargo loading
    modifier: DECREASED
  evidence:
  - reference: PMID:23019651
    reference_title: "Sedlin controls the ER export of procollagen by regulating the Sar1 cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Sedlin bound and promoted efficient cycling of Sar1, a guanosine triphosphatase that can constrict membranes, and thus allowed nascent carriers to grow and incorporate PC prefibrils."
    explanation: >-
      The central molecular result: sedlin acts on Sar1, and the consequence is
      carrier growth sufficient for procollagen.
  - reference: PMID:23019651
    reference_title: "Sedlin controls the ER export of procollagen by regulating the Sar1 cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that TANGO1 recruited Sedlin, a TRAPP component that is defective in spondyloepiphyseal dysplasia tarda (SEDT), and that Sedlin was required for the ER export of PC."
    explanation: >-
      Establishes the recruitment step and that sedlin is required for
      procollagen export, naming SEDT explicitly as the disease context.
  downstream:
  - target: Procollagen Retention in Dilated Rough Endoplasmic Reticulum
    description: >-
      Procollagen prefibrils that cannot be packaged accumulate in the ER
      lumen.
- name: Procollagen Retention in Dilated Rough Endoplasmic Reticulum
  biological_scale: CELLULAR
  description: >-
    The morphological signature of the secretory bottleneck. Articular
    cartilage from an affected adult contained chondrocytes with abundant Golgi
    complexes and dilated rough endoplasmic reticulum. This is the one step in
    the chain observed directly in human tissue rather than in a cell line.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
  locations:
  - preferred_term: cartilage tissue
    term:
      id: UBERON:0002418
      label: cartilage tissue
  evidence:
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Articular cartilage from an adult who had SEDL and carried this mutation contained chondrocytes with abundant Golgi complexes and dilated rough endoplasmic reticulum (ER)."
    explanation: >-
      The human-tissue ultrastructural observation this node records.
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These data suggest that SEDL mutations may perturb an intracellular pathway that is important for cartilage homeostasis."
    explanation: >-
      The authors' own interpretation, offered as a suggestion. Recorded
      indirect because in 2001 the pathway was inferred from yeast homology;
      the procollagen mechanism was not demonstrated until 2012.
  downstream:
  - target: Defective Growth Plate Chondrogenesis
    description: >-
      Reduced delivery of collagen matrix impairs endochondral ossification.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Defective Growth Plate Chondrogenesis
  biological_scale: TISSUE
  conforms_to: "growth_plate_chondrocyte_failure#Reduced Longitudinal Bone Growth"
  description: >-
    Impaired matrix secretion at the vertebral and epiphyseal growth plates.
    Because it is a defect of growth rather than of a formed structure, nothing
    is visible at birth and the phenotype only emerges after years of growth,
    which is what "tarda" records.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  locations:
  - preferred_term: growth plate cartilage
    term:
      id: UBERON:0004129
      label: growth plate cartilage
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  - preferred_term: epiphysis
    term:
      id: UBERON:0001437
      label: epiphysis
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:23019651
    reference_title: "Sedlin controls the ER export of procollagen by regulating the Sar1 cycle."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "This joint action of TANGO1 and Sedlin sustained the ER export of PC, and its derangement may explain the defective chondrogenesis underlying SEDT."
    explanation: >-
      The link from the trafficking defect to chondrogenesis. Graded INDIRECT
      and quoted with the authors' "may explain": the chondrogenesis step is an
      inference from the trafficking result, not a measurement in growth-plate
      tissue.
  downstream:

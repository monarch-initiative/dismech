differential_diagnoses:
- name: Mucopolysaccharidoses
  description: >-
    Radiographically similar dysostosis, separated by the systemic and
    biochemical findings that SEDT lacks: normal metabolic studies and no
    abnormal urinary glycosaminoglycan excretion.
  evidence:
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This progressive skeletal disorder which manifests in childhood is characterized by disproportionate short stature with short neck and trunk, barrel chest and absence of systemic complications."
    explanation: >-
      The absence of systemic complications is the discriminator against the
      storage disorders.
- name: Autosomal spondyloepiphyseal dysplasia tarda
  description: >-
    SEDT is genetically heterogeneous and both autosomal and X-linked forms are
    described; only the X-linked form is TRAPPC2-related and only it is this
    entry. Pedigree structure, not radiography, separates them.
  evidence:
  - reference: PMID:11326333

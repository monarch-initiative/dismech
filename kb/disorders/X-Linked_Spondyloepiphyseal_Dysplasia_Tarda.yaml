genetic:
- name: TRAPPC2
  gene_term:
    preferred_term: TRAPPC2
    term:
      id: hgnc:23068
      label: TRAPPC2
  relationship_type: CAUSATIVE
  notes: >-
    TRAPPC2 (formerly SEDL) is at Xp22, transcribed as a 2.8-kb message in many
    tissues including fetal cartilage, and encodes a 140-amino-acid protein.
    Two features are worth carrying: the gene escapes X-inactivation, and it
    has a transcribed retropseudogene on chromosome 19 that can confound
    sequencing if primers are not chosen to exclude it.
  evidence:
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene designated SEDL is transcribed as a 2.8-kb transcript in many tissues including fetal cartilage."
    explanation: >-
      Gives the transcript size and the expression pattern, including fetal
      cartilage.
  - reference: PMID:10431248
    reference_title: "Identification of the gene (SEDL) causing X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SEDL encodes a 140 amino acid protein with a putative role in endoplasmic reticulum (ER)-to-Golgi vesicular transport."
    explanation: >-
      The protein size and the trafficking role, proposed here and demonstrated
      thirteen years later.
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RT-PCR experiments using mouse/human cell hybrids revealed that the SEDL gene escapes X inactivation."
    explanation: >-
      Supports the X-inactivation-escape claim in these notes.
  - reference: PMID:11326333
    reference_title: "A recurrent RNA-splicing mutation in the SEDL gene causes X-linked spondyloepiphyseal dysplasia tarda."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homologues of the SEDL gene include a transcribed retropseudogene on chromosome 19, as well as expressed genes in mouse, rat, Drosophila melanogaster Caenorhabditis elegans, and Saccharomyces cerevisiae."
    explanation: >-
      Supports the retropseudogene caveat, which matters for assay design.

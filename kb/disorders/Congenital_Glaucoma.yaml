    explanation: >-
      States increased corneal diameter with the conventional 12 mm threshold as
      a consequence of raised intraocular pressure in this disease.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
- category: Ocular
  name: Haab Striae
  description: >-
    Curvilinear horizontal breaks in Descemet membrane produced when the stretching
    cornea exceeds the elastic limit of that layer. They are pathognomonic of
    childhood pressure elevation and persist as a permanent record of it after
    pressure is controlled.
  phenotype_term:
    preferred_term: Haab striae
    term:
      id: HP:6001217
      label: Haab striae
  evidence:
  - reference: PMID:39941238
    reference_title: "Primary Congenital and Childhood Glaucoma-A Complex Clinical Picture and Surgical Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "They present very specific ocular characteristics, such as buphthalmos or progressive myopic shift, corneal modifications such as Haab striae, corneal edema or increased corneal diameter"
    explanation: >-
      Lists Haab striae among the specific corneal findings of childhood
      glaucoma. Evidence source is OTHER because this is a clinical review.
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary congenital glaucoma (PCG) is characterized by elevated intraocular pressure (IOP), enlargement of the globe (buphthalmos), edema, and opacification of the cornea with rupture of Descemet's membrane (Haab's striae), thinning of the anterior sclera and iris atrophy, anomalously deep anterior chamber, and structurally normal posterior segment except for progressive glaucomatous optic atrophy."
    explanation: >-

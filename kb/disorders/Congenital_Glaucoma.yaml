  - reference: PMID:9463332
    reference_title: "Mutations in CYP1B1, the gene for cytochrome P4501B1, are the predominant cause of primary congenital glaucoma in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional clinical and molecular data on some mildly affected relatives showed variable expressivity of PCG in this population."
    explanation: >-

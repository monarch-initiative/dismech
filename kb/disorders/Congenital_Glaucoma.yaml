treatments:
- name: Angle Surgery (Goniotomy or Trabeculotomy)
  description: >-
    Incision of the dysgenetic trabecular meshwork to open a direct route from the
    anterior chamber into Schlemm canal. Goniotomy requires a clear cornea to
    visualise the angle; trabeculotomy ab externo does not, and is therefore
    preferred when the cornea is edematous, which is common at presentation in
    regions where disease is advanced at diagnosis. This is first-line surgery in
    primary congenital glaucoma and is mechanism-directed rather than
    symptomatic -- it addresses the dysgenetic meshwork itself. Note the
    corollary: where the angle is obliterated by adhesions rather than dysgenetic,
    as in some Peters anomaly eyes, angle incision is much less effective.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Trabeculodysgenesis and Congenital Outflow Obstruction
    treatment_effect: BYPASSES
    description: >-
      Angle incision creates a direct outflow channel past the dysgenetic
      meshwork rather than restoring normal meshwork development.
    evidence:
    - reference: PMID:39941238
      reference_title: "Primary Congenital and Childhood Glaucoma-A Complex Clinical Picture and Surgical Management."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Surgical intervention remains the cornerstone of treatment, and initial surgical options include angle surgeries such as goniotomy and trabeculotomy, aimed at improving aqueous outflow."
      explanation: >-
        States that angle surgery acts by improving aqueous outflow, which is the
        mechanism node targeted here. Evidence source is OTHER because this is a
        clinical review.
  evidence:
  - reference: PMID:26886124
    reference_title: "Updates on the Surgical Management of Pediatric Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Angle surgery is usually the first-line treatment in the surgical management of primary congenital glaucoma because it has a relatively good success rate with a low complication rate."
    explanation: >-
      Establishes angle surgery as first-line, with the risk-benefit reasoning.
      Evidence source is OTHER because this is a surgical review.
  - reference: PMID:38249492
    reference_title: "Approach to primary congenital glaucoma: A perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Angle incision surgery such as goniotomy or trabeculotomy ab externo is the preferred choice of surgery in the Caucasian population."
    explanation: >-
      Supports angle incision as the preferred first operation, and flags the
      population qualification carried in the description. Evidence source is
      OTHER because this is an expert clinical perspective.
  - reference: PMID:30846492
    reference_title: "Factors influencing the outcome of goniotomy and trabeculotomy in primary congenital glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trabeculotomy seems to be superior to goniotomy in primary congenital glaucoma."
    explanation: >-
      Compares the two angle procedures in a 452-eye series and favours
      trabeculotomy, supporting the preference stated in the description.
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Surgery (goniotomy, trabeculotomy, trabeculectomy, or deep sclerectomy) as early as possible; use of drainage implants or cyclodestruction if surgery fails"
    explanation: >-
      GeneReviews management recommendation placing surgery first and as early as
      possible. Evidence source is OTHER because GeneReviews is an expert-curated
      synthesis.
- name: Filtering Surgery and Glaucoma Drainage Devices
  description: >-
    Second-line surgery after failed angle incision: trabeculectomy, usually with
    an antifibrotic agent because the pediatric healing response scars a bleb
    aggressively, or implantation of a glaucoma drainage device. Both create an
    outflow route that bypasses the natural drainage pathway entirely rather than
    repairing it. Cyclodestructive procedures, which reduce aqueous production
    instead of improving egress, are reserved for eyes with poor visual potential.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Congenital Intraocular Pressure Elevation
    treatment_effect: BYPASSES
    description: >-
      A filtering bleb or drainage tube lowers intraocular pressure by routing
      aqueous around the diseased angle altogether.
    evidence:
    - reference: PMID:39941238
      reference_title: "Primary Congenital and Childhood Glaucoma-A Complex Clinical Picture and Surgical Management."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "For refractory cases, trabeculectomy and glaucoma drainage devices (GDDs) serve as second-line therapies."
      explanation: >-
        Positions these procedures as second-line pressure-lowering therapy,
        which is the mechanism node targeted. Evidence source is OTHER because
        this is a clinical review.
  evidence:
  - reference: PMID:26886124
    reference_title: "Updates on the Surgical Management of Pediatric Glaucoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "After failed angle surgery or in cases of secondary pediatric glaucoma, options such as trabeculectomy, glaucoma drainage devices, or cyclodestructive procedures can be considered"
    explanation: >-
      Sets out the second-line sequence recorded in the description, including
      the place of cyclodestruction. Evidence source is OTHER because this is a
      surgical review.
- name: Topical and Systemic IOP-Lowering Pharmacotherapy
  description: >-
    Medical therapy has a supportive rather than definitive role in congenital
    glaucoma -- the reverse of adult glaucoma practice. It is used to clear the
    cornea before surgery so the angle can be seen, and as an adjunct
    postoperatively when pressure control is incomplete. Safety caveat carried
    from GeneReviews: alpha-2 agonists must be avoided in infants because of the
    risk of apnea and bradycardia, and echothiophate should be stopped before
    surgery to prevent prolonged apnea.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Congenital Intraocular Pressure Elevation
    treatment_effect: INHIBITS
    description: >-
      Reduces aqueous production or increases outflow to lower intraocular
      pressure pending or supplementing definitive surgery.
    evidence:
    - reference: PMID:38249492
      reference_title: "Approach to primary congenital glaucoma: A perspective."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Medical therapy only serves as a supportive role, and surgical intervention remains the principal therapeutic modality."
      explanation: >-
        States the supportive, pressure-directed role of medical therapy relative
        to surgery. Evidence source is OTHER because this is an expert clinical
        perspective.
  evidence:
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Agents/circumstances to avoid: Alpha-2 agonists because of risk for apnea and bradycardia."
    explanation: >-
      The GeneReviews drug-safety warning reproduced in the description. Evidence
      source is OTHER because GeneReviews is an expert-curated synthesis.
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Discontinuation of medications such as Phospholine Iodide® (echothiophate) before surgery to prevent prolonged apnea."
    explanation: >-
      The second GeneReviews safety instruction reproduced in the description.
      Evidence source is OTHER because GeneReviews is an expert-curated
      synthesis.
  - reference: PMID:38755526
    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Medical management with both topical and oral drugs can be used as a temporary modality or as an adjunct to surgery, but surgery remains the predominant treatment in order to control the IOP"
    explanation: >-
      Independently confirms the temporary/adjunctive role of medical therapy in
      childhood glaucoma.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
- name: Refractive Correction and Amblyopia Therapy
  description: >-
    Spectacles or contact lenses for the myopic and anisometropic shift, together
    with occlusion or other amblyopia therapy during the critical period. This is
    not supportive care around the glaucoma -- it treats a parallel, independently
    sufficient cause of permanent vision loss, and omitting it can leave a child
    with a normal-pressure eye and no useful vision. Low-vision rehabilitation is
    added where impairment is established.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  target_mechanisms:
  - target: Deprivation and Refractive Amblyopia
    treatment_effect: INHIBITS
    description: >-
      Refractive correction removes the defocus and occlusion therapy counters
      the cortical suppression, addressing the amblyogenic branch directly rather
      than the pressure.
    evidence:
    - reference: PMID:38249492
      reference_title: "Approach to primary congenital glaucoma: A perspective."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Myopia is common among children with PCG, and appropriate optical refractive correction in the form of glasses or contact lenses should be provided. Amblyopia therapy should be instituted to ensure overall visual development in the early developmental years."
      explanation: >-
        Prescribes both refractive correction and amblyopia therapy for exactly
        the mechanism node targeted. Evidence source is OTHER because this is an
        expert clinical perspective.
  evidence:
  - reference: PMID:38249492
    reference_title: "Approach to primary congenital glaucoma: A perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Low-vision rehabilitation services should be provided to children with vision impairment."
    explanation: >-
      Supports the low-vision rehabilitation component of this treatment.
      Evidence source is OTHER because this is an expert clinical perspective.
- name: Genetic Counseling
  description: >-
    Counseling must be mode-specific, since recurrence risk is 25% for the
    recessive CYP1B1 and LTBP2 forms but 50% for dominant TEK-related disease.
    Where a familial variant is known, counseling is delivered alongside the
    cascade testing curated under diagnosis:, which is what changes the
    surveillance plan for an at-risk newborn.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "At conception, each sib of an affected individual has a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: >-
      Supports the recessive recurrence risk quoted in the description. Evidence
      source is OTHER because GeneReviews is an expert-curated synthesis.
diagnosis:
- name: Confirmatory molecular genetic testing
  description: >-
    Molecular testing confirms the diagnosis when clinical features are
    inconclusive: biallelic pathogenic variants in CYP1B1 or LTBP2, or a
    heterozygous pathogenic variant in TEK.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Identification of biallelic pathogenic variants in CYP1B1 or LTBP2 or identification of a heterozygous pathogenic variant in TEK confirms the diagnosis if clinical features are inconclusive.
    explanation: >-
      States the confirmatory diagnostic role of molecular testing. Evidence
      source is OTHER because GeneReviews is an expert-curated synthesis rather
      than a primary study.
- name: Cascade testing of at-risk siblings
  description: >-
    Once a familial variant is known, at-risk newborns can be tested directly
    rather than subjected to repeated examinations under anaesthesia. This is
    surveillance triage rather than treatment, and is the practical reason
    molecular diagnosis changes management in this disease.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: molecular genetic testing of at-risk sibs as soon as possible after birth in order to avoid repeated examinations under anesthesia in young children who do not have the pathogenic variant(s).
    explanation: >-
      Gives the sibling-surveillance benefit that makes cascade testing a
      diagnostic and surveillance act. Evidence source is OTHER because
      GeneReviews is an expert-curated synthesis.
- name: Examination Under Anesthesia
  description: >-
    The diagnostic act in congenital glaucoma is a full examination under general
    anaesthesia, because an infant cannot cooperate with tonometry, gonioscopy,
    corneal diameter measurement, axial length measurement, or disc examination
    while awake. The diagnosis rests on the combination -- elevated intraocular
    pressure, globe enlargement, increased corneal diameter, corneal clouding,
    Descemet membrane breaks, and an anomalously deep anterior chamber -- rather
    than on any single measurement, which matters because anaesthesia itself
    perturbs the pressure reading.
  evidence:
  - reference: PMID:38249492
    reference_title: "Approach to primary congenital glaucoma: A perspective."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A proper diagnostic evaluation under anesthesia is advisable for all children who do not cooperate for an office examination."
    explanation: >-
      States the requirement for examination under anaesthesia. Evidence source
      is OTHER because this is an expert clinical perspective.
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of PCG is based on clinical criteria including: elevated IOP in a child typically before age one year, enlargement of the globe, increased corneal diameter, cloudy corneas, breaks in Decsemet"
    explanation: >-
      Enumerates the composite clinical criteria on which diagnosis rests.
      Evidence source is OTHER because GeneReviews is an expert-curated
      synthesis.
  - reference: PMID:39941238
    reference_title: "Primary Congenital and Childhood Glaucoma-A Complex Clinical Picture and Surgical Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In a young child, cooperation is difficult to establish; therefore, the intraocular pressure may read falsely high"
    explanation: >-
      Supports the caveat that a single pressure reading in an uncooperative
      child is unreliable, which is why the composite criteria are used. Evidence
      source is OTHER because this is a clinical review.
animal_models:
- name: Cyp1b1-null mouse
  species: Mouse
  genotype: Cyp1b1-/-
  publication: PMID:12624268
  description: >-
    Constitutive Cyp1b1 knockout producing ocular drainage-structure
    abnormalities that resemble those described in human primary congenital
    glaucoma. Also the system in which tyrosinase was identified as a modifier
    of the drainage phenotype.
  modeled_mechanisms:
  - target: Trabeculodysgenesis and Congenital Outflow Obstruction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the maldeveloped conventional outflow pathway that is the
      proximate lesion in CYP1B1-related disease.
    limitations: >-
      Drainage-structure dysgenesis is reported as resembling the human lesion
      rather than as measured intraocular hypertension in this work, and the
      phenotype is modifier-sensitive: severity depends on Tyr genotype, so the
      model's expressivity is strain-dependent rather than a fixed readout.
    evidence:
    - reference: PMID:12624268
      reference_title: "Modification of ocular defects in mouse developmental glaucoma models by tyrosinase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Here we show that Cyp1b1-/- mice have ocular drainage structure abnormalities resembling those reported in human PCG patients.
      explanation: >-
        States the recapitulation claim and its scope, in the authors' own
        hedged terms.
- name: Angpt1-knockout mouse
  species: Mouse
  genotype: Angpt1 knockout; Angpt1/Angpt2 double knockout
  publication: PMID:29106382
  description: >-
    Angiopoietin-ligand knockouts that fail to develop Schlemm canal normally.
    The double knockout lacks the canal entirely, showing that ANGPT2
    compensates for ANGPT1 loss.
  modeled_mechanisms:
  - target: Angiopoietin-TEK Signaling Insufficiency and Schlemm Canal Hypoplasia
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces both halves of this node: a hypomorphic Schlemm canal and the
      resulting raised intraocular pressure.
    limitations: >-
      Models the ligand side of the axis, whereas the human disease curated here
      is caused by loss-of-function in the TEK receptor; the compensatory
      ANGPT2 relationship is demonstrated in mouse and is not established in
      humans.
    evidence:
    - reference: PMID:29106382
      reference_title: "Angiopoietin-1 is required for Schlemm's canal development in mice and humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: We determined that ANGPT1 is essential for SC development, and that Angpt1-knockout mice form a severely hypomorphic canal with elevated intraocular pressure.
      explanation: >-
        Directly evidences the canal hypoplasia and the intraocular pressure
        elevation this node asserts.
- name: Zebrafish cyp1b1 knockout
  species: Zebrafish
  genotype: cyp1b1 null
  publication: PMID:39890032
  description: >-
    Zebrafish cyp1b1 knockout, the model behind the geo:GSE272589 dataset
    curated in this entry. It is included specifically because it does NOT
    reproduce the glaucoma phenotype, which is the structural counterpart of the
    cyp1b1_mouse_phenotype_fidelity discussion.
  modeled_mechanisms:
  - target: Trabeculodysgenesis and Congenital Outflow Obstruction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Adult mutant eye morphology, including the anterior chamber angle and
      cornea, is indistinguishable from wild type. The model is informative
      about CYP1B1 metabolic function but is not a phenocopy of congenital
      glaucoma, and must not be cited as evidence that CYP1B1 loss produces
      angle dysgenesis.
    limitations: >-
      Species divergence in the Cyp1 family is the authors' own proposed
      explanation: zebrafish carry Cyp1c and Cyp1d enzymes absent from mammals,
      so zebrafish Cyp1b1 may not parallel mammalian CYP1B1 function. The
      negative result therefore bounds what the zebrafish system can be used
      for rather than casting doubt on the human gene-disease relationship.
    evidence:
    - reference: PMID:39890032
      reference_title: "Zebrafish Cyp1b1 knockout alters eye and brain metabolomic profiles, affecting ocular and neurobehavioral function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: However, adult mutant eye morphology, including glaucoma related tissues like the anterior chamber angles and the cornea, was similar to the wildtype (WT).
      explanation: >-
        States plainly that the glaucoma-relevant ocular anatomy is unaffected
        in the knockout, which is what makes this a FAILS_TO_RECAPITULATE link
        rather than a partial one.
    - reference: PMID:39890032
      reference_title: "Zebrafish Cyp1b1 knockout alters eye and brain metabolomic profiles, affecting ocular and neurobehavioral function."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: their Cyp1b1 may not directly parallel the functions of CYP1B1 in rodents or humans
      explanation: >-
        Gives the authors' species-divergence explanation for the negative
        result, which is the limitation recorded on this link.


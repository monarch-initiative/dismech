    consistent with ANGPT2 compensating for ANGPT1 loss.
  gene_term:
    preferred_term: ANGPT1
    term:
      id: hgnc:484
      label: ANGPT1
  evidence:
  - reference: PMID:29106382
    reference_title: "Angiopoietin-1 is required for Schlemm's canal development in mice and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Loss of function in 2 of the 3 patient alleles was observed by functional analysis of ANGPT1 variants in a combined in silico, in vitro, and in vivo approach, supporting a causative role for ANGPT1 in disease."
    explanation: >-
      Reports the functional demonstration of loss of function for the patient
      ANGPT1 alleles and the authors' causality claim.
- name: FOXC1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: ASD Congenital Glaucoma
  notes: >-
    A forkhead transcription factor acting in the neural-crest-derived periocular
    mesenchyme. Causes Axenfeld-Rieger spectrum disease, in which glaucoma tends
    to begin earlier and show broader variability than in the PITX2 form. Curated
    here as a route into congenital glaucoma; the syndrome itself is
    Axenfeld-Rieger_syndrome.yaml.
  gene_term:
    preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  evidence:
  - reference: PMID:35882526
    reference_title: "Axenfeld-Rieger syndrome: more than meets the eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "128 individuals with causative variants in PITX2 or FOXC1, including 81 new cases, were investigated. Ocular anomalies showed significant overlap but with broader variability and earlier onset of glaucoma for FOXC1-related ARS."
    explanation: >-
      Establishes FOXC1 as causative in the largest reported ARS cohort and
      documents the earlier glaucoma onset that distinguishes it from PITX2.
  - reference: PMID:12624268
    reference_title: "Modification of ocular defects in mouse developmental glaucoma models by tyrosinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tyr also modified the drainage structure dysgenesis in mice with a mutant Foxc1 gene, which is also involved in PCG."
    explanation: >-
      Shows Foxc1 mutation produces modifiable drainage-structure dysgenesis in
      mice, linking this gene to the same developmental lesion as CYP1B1.
- name: PITX2
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: ASD Congenital Glaucoma
  notes: >-
    Homeodomain transcription factor of the anterior segment developmental
    programme; the second Axenfeld-Rieger gene, accompanied by the characteristic
    umbilical and dental systemic features. Curated here only as a route into
    congenital glaucoma.
  gene_term:
    preferred_term: PITX2
    term:
      id: hgnc:9005
      label: PITX2
  evidence:
  - reference: PMID:35882526
    reference_title: "Axenfeld-Rieger syndrome: more than meets the eye."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "128 individuals with causative variants in PITX2 or FOXC1, including 81 new cases, were investigated. Ocular anomalies showed significant overlap but with broader variability and earlier onset of glaucoma for FOXC1-related ARS."
    explanation: >-
      Establishes PITX2 as one of the two causative ARS genes in the largest
      reported cohort.
- name: PAX6
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: ASD Congenital Glaucoma
  notes: >-
    The aniridia gene. Glaucoma in PAX6-related congenital aniridia is a major
    cause of blindness in that population, but its mechanism is unsettled --
    congenital trabecular dysfunction, progressive angle closure, and
    postoperative pressure rise have all been proposed, and the choice matters
    because surgery carries particular risk in aniridic eyes.
  gene_term:
    preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  evidence:
  - reference: PMID:39368260
    reference_title: "[Glaucoma in PAX6-related congenital aniridia: A review of the literature]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glaucoma remains, along with limbal insufficiency, one of the major causes of blindness in congenital aniridia."
    explanation: >-
      Establishes the clinical weight of glaucoma within PAX6-related congenital
      aniridia. Evidence source is OTHER because this is a literature review.
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in key transcriptional and structural genes-including PAX6, FOXC1, PITX2, CYP1B1, LTBP2, PXDN, and GJA8-account for the majority of ASD cases."
    explanation: >-
      Places PAX6 with FOXC1 and PITX2 among the genes accounting for most
      anterior segment dysgenesis, the group curated under this subtype. Evidence
      source is OTHER because this is a systematic review.
- name: SVEP1
  association: Candidate modifier of TEK-related penetrance and severity
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  gene_term:
    preferred_term: SVEP1
    term:
      id: hgnc:15985
      label: SVEP1
  notes: >-
    Candidate modifier of TEK-related penetrance and severity rather than an
    independently validated primary PCG gene. It is curated because the TEK
    entry above records incomplete penetrance and variable expressivity without
    naming a mechanism for that variability, and SVEP1 is the proposed
    mechanism. The hedge is deliberate and matches the source: the supporting
    data are a proposal resting on animal-model expression work, not an
    established diagnostic relationship, and SVEP1 should not be reported as a
    cause of congenital glaucoma on that basis.
  evidence:
  - reference: PMID:38386645
    reference_title: "Genetic changes and testing associated with childhood glaucoma: A systematic review."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: one study has proposed that the SVEP1 gene could be a potent genetic modifier as SVEP1 loss of function alleles were demonstrated to reduce TEK expression in vascular endothelial cells in animal models
    explanation: >-
      States the proposed modifier relationship and, importantly, its basis:
      loss-of-function alleles reducing TEK expression in animal models.
      supports is PARTIAL and evidence_source is MODEL_ORGANISM because the
      claim is a proposal grounded in model-organism expression data rather than
      a demonstrated human genotype-phenotype relationship.

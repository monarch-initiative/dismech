      GeneReviews is an expert-curated synthesis.
- category: Ocular
  name: Corneal Opacity and Edema
  description: >-
    Clouding of the cornea from stromal edema, following breaches of the corneal
    endothelial barrier as Descemet membrane tears. Beyond obscuring the view of
    the optic disc for the examiner, it degrades the retinal image during the
    critical period and is a direct cause of deprivation amblyopia.

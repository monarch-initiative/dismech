- name: Secondary Angle Obstruction in Anterior Segment Dysgenesis
  conforms_to: "glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction"
  role: amplifier
  biological_scale: TISSUE
  description: >-
    The parallel route taken by congenital glaucoma arising in a non-acquired
    anterior segment anomaly. Here outflow can fail by two mechanisms that are not
    interchangeable: trabeculodysgenesis of the kind seen in primary congenital
    glaucoma, and adhesional angle closure in which iridocorneal or
    lenticulocorneal adhesions physically obliterate the drainage angle. Which
    operates depends on the anomaly and its severity -- in Peters anomaly the risk
    of glaucoma rises steeply with the degree of anterior segment dysgenesis, from
    none in eyes with an isolated posterior corneal defect to the majority of eyes
    once lens abnormalities are present. In PAX6-related aniridia the mechanism
    remains genuinely unsettled, with congenital trabecular dysfunction,
    progressive angle closure, and postoperative ocular hypertension all
    proposed. This distinction matters therapeutically: angle incision surgery
    addresses a dysgenetic meshwork but not an obliterated angle.

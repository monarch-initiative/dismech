- name: Descemet Membrane Rupture and Corneal Decompensation
  role: effector
  biological_scale: TISSUE
  description: >-
    Stretching of the cornea tears Descemet membrane, producing the curvilinear
    Haab striae, and breaches of that endothelial barrier allow aqueous into the
    stroma, causing the corneal edema and opacification that make the eye
    cloudy. The same corneal irritation drives the classic presenting triad of
    epiphora, photophobia and blepharospasm. This node is why congenital
    glaucoma is recognised by inspection of the eye in infancy rather than by
    perimetry.

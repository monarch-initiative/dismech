phenotypes:
- category: Ocular
  name: Buphthalmos
  description: >-
    Enlargement of the globe from stretching of the still-elastic infant sclera by
    sustained ocular hypertension. The defining sign of glaucoma with onset before
    about three years of age, and the feature that separates congenital from
    juvenile and adult glaucoma.
  phenotype_term:
    preferred_term: Buphthalmos
    term:
      id: HP:0000557
      label: Buphthalmos
  evidence:

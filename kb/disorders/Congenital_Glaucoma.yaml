- name: CYP1B1 Deficiency in the Developing Anterior Segment
  conforms_to: "anterior_segment_dysgenesis#Anterior Segment Developmental Regulator Defect"
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function variants in CYP1B1, a cytochrome P450
    monooxygenase at the GLC3A locus on 2p21, are the single most common
    molecular cause of congenital glaucoma. The reported mutations are frameshift
    and other null alleles predicted to remove domains essential for enzyme
    function, so the mechanism is loss of a metabolic activity rather than a toxic
    gain of function -- which distinguishes CYP1B1 disease from the misfolding
    MYOC mechanism of juvenile open-angle glaucoma. How that metabolic loss
    translates into dysgenesis is not settled; the leading proposal is that
    CYP1B1 generates or clears a diffusible retinoid or other oxygenated
    signalling molecule required for the proliferation and differentiation of the
    developing anterior segment. Cyp1b1-null mice reproduce the human drainage
    structure abnormalities, and the severity of that phenotype is modified by
    tyrosinase, indicating that CYP1B1 acts within a modifiable pathway rather
    than as a deterministic switch -- consistent with the incomplete penetrance
    and variable expressivity seen in human families.
  locations:
  - preferred_term: Anterior Chamber of Eyeball
    term:
      id: UBERON:0001766
      label: anterior chamber of eyeball
  molecular_functions:
  - preferred_term: Monooxygenase Activity
    term:
      id: GO:0004497
      label: monooxygenase activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: Retinoid Metabolic Process
    term:
      id: GO:0001523
      label: retinoid metabolic process
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: CYP1B1
      term:
        id: hgnc:2597
        label: CYP1B1
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  evidence:
  - reference: PMID:9097971
    reference_title: "Identification of three different truncating mutations in cytochrome P4501B1 (CYP1B1) as the principal cause of primary congenital glaucoma (Buphthalmos) in families linked to the GLC3A locus on chromosome 2p21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of these are frameshift mutations that are predicted to remove domains essential for the function of the CYP1B1 protein."
    explanation: >-
      Establishes that the founding CYP1B1 congenital-glaucoma alleles are
      predicted functional nulls, supporting the loss-of-function
      functional_impact_category recorded on this node.
  - reference: PMID:9097971
    reference_title: "Identification of three different truncating mutations in cytochrome P4501B1 (CYP1B1) as the principal cause of primary congenital glaucoma (Buphthalmos) in families linked to the GLC3A locus on chromosome 2p21."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "CYP1B1 gene has previously been mapped within the GLC3A candidate region and its expression in the trabecular meshwork cells has been demonstrated in this study."
    explanation: >-
      Reports CYP1B1 expression in trabecular meshwork cells, which would place

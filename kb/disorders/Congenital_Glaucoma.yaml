    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Children with PCG develop buphthalmos if disease onset is before 3 years of age secondary to the raised intraocular pressure (IOP), increased corneal diameter (> 12 mm), Haab striae, corneal oedema, optic disc cupping and progressive myopia"
    explanation: >-
      Directly attributes buphthalmos to raised intraocular pressure with onset
      before three years, which is the age-dependence recorded in the
      description.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
- category: Ocular
  name: Megalocornea
  description: >-
    Increased corneal diameter, conventionally beyond about 12 mm in an infant,
    produced by pressure-driven corneal stretching rather than by a primary
    corneal size anomaly. Serial corneal diameter measurement under anaesthesia is
    a standard index of disease control.
  phenotype_term:
    preferred_term: Megalocornea
    term:
      id: HP:0000485
      label: Megalocornea
  evidence:

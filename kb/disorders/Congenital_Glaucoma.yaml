- category: Ocular
  name: Ocular Hypertension
  description: >-
    Elevated intraocular pressure, the proximate stressor. Measurement in an
    infant is unreliable without general anaesthesia, and both anaesthetic agent
    and poor cooperation can bias the reading in either direction, so pressure is
    interpreted alongside corneal diameter, axial length, and disc appearance
    rather than alone.

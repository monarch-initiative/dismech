discussions:
- discussion_id: cyp1b1_expression_site
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is CYP1B1 expressed in the trabecular meshwork itself, or does it act on the
    developing outflow apparatus from the ciliary body and neuroepithelium?
  attaches_to:
  - "pathophysiology#CYP1B1 Deficiency in the Developing Anterior Segment"
  rationale: >-
    The two published answers are directly contradictory. The original GLC3A
    mapping paper reports demonstrating CYP1B1 expression in trabecular meshwork
    cells; a later cohort study states expression is found in fetal and adult
    ciliary body and neuroepithelium but not in the trabecular meshwork, and a
    2024 review describes trabecular expression as controversial. The
    disagreement is mechanistically load-bearing rather than a bookkeeping
    detail: cell-autonomous action within the meshwork implies a different
    therapeutic target from a diffusible metabolite generated elsewhere in the
    anterior segment and acting on the meshwork at a distance. This entry
    therefore records the CYP1B1 node's mechanism as an unresolved metabolic
    route rather than asserting a site of action, and the expression evidence is
    marked PARTIAL.
  proposed_experiments:
  - experiment_id: exp_cg_cyp1b1_expression_scrnaseq
    name: Single-cell transcriptomic mapping of CYP1B1 in the developing human anterior segment
    description: >-
      Single-cell or spatial transcriptomic profiling of human fetal iridocorneal
      angle across the developmental window in which the meshwork forms, reporting
      CYP1B1 per annotated cell type, would settle whether trabecular expression
      exists at the developmentally relevant stage. Both conflicting reports rest
      on bulk or adult tissue, where a transient fetal signal in a small cell
      population could be missed.
  evidence:
  - reference: PMID:9097971
    reference_title: "Identification of three different truncating mutations in cytochrome P4501B1 (CYP1B1) as the principal cause of primary congenital glaucoma (Buphthalmos) in families linked to the GLC3A locus on chromosome 2p21."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "CYP1B1 gene has previously been mapped within the GLC3A candidate region and its expression in the trabecular meshwork cells has been demonstrated in this study."
    explanation: >-
      The report of trabecular meshwork expression that forms one side of this
      controversy. Evidence source is IN_VITRO because this is a tissue
      expression experiment.
  - reference: PMID:23218701
    reference_title: "CYP1B1, MYOC, and LTBP2 mutations in primary congenital glaucoma patients in the United States."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "Studies have demonstrated its expression in fetal and adult ciliary body and neuroepithelium, but not in the trabecular meshwork."
    explanation: >-
      The opposing statement, denying trabecular expression and placing CYP1B1 in
      the ciliary body and neuroepithelium instead.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
  - reference: PMID:38755526
    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "its expression in the TM remains controversial"
    explanation: >-
      A contemporary source that characterises the question as still open,
      supporting keeping this discussion OPEN rather than resolving it either
      way.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
- discussion_id: cyp1b1_mouse_phenotype_fidelity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How faithfully does the Cyp1b1-null mouse model the human CYP1B1 congenital
    glaucoma phenotype, given that its severity depends on tyrosinase genotype and
    can be pharmacologically rescued?
  attaches_to:
  - "pathophysiology#CYP1B1 Deficiency in the Developing Anterior Segment"
  rationale: >-
    Cyp1b1-null mice do develop ocular drainage structure abnormalities
    resembling human disease, so the model is informative. But the magnitude of
    that dysgenesis is set by a second locus, Tyr, and the severe phenotype in
    doubly deficient eyes is alleviated by administering the tyrosinase product
    L-DOPA. That makes the mouse phenotype a property of a particular strain
    background as much as of CYP1B1 loss. Whether an analogous modifier axis
    operates in humans is unknown, and it bears directly on how much weight the
    mouse rescue result can carry as a therapeutic lead. Human CYP1B1 disease does
    show incomplete penetrance and variable expressivity, which is consistent with
    modifiers existing but does not identify them or establish that the tyrosinase
    pathway is among them.
  proposed_experiments:
  - experiment_id: exp_cg_tyr_modifier_founder_cohort
    name: Test the tyrosinase/L-DOPA axis as a modifier in human CYP1B1 congenital glaucoma
    description: >-
      Genotype pigmentation-pathway loci, TYR foremost, in a cohort of patients
      homozygous for the same founder CYP1B1 allele but discordant for disease
      severity. A founder population is required so that the CYP1B1 allele is held
      constant while severity varies; the Slovakian Roma and Saudi cohorts are the
      natural settings.
  evidence:
  - reference: PMID:12624268
    reference_title: "Modification of ocular defects in mouse developmental glaucoma models by tyrosinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The severe dysgenesis in eyes lacking both CYP1B1 and TYR was alleviated by administration of the tyrosinase product dihydroxyphenylalanine (l-dopa)."
    explanation: >-
      Documents the pharmacological rescue whose translational validity this
      mismatch discussion questions.
  - reference: PMID:9463332
    reference_title: "Mutations in CYP1B1, the gene for cytochrome P4501B1, are the predominant cause of primary congenital glaucoma in Saudi Arabia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These results should stimulate a study of the genetic and environmental events that modify the effects of CYP1B1 mutations in ocular development."
    explanation: >-
      The human authors' own call for modifier studies, consistent with modifiers
      operating in humans but not identifying them. Marked PARTIAL because it
      motivates rather than answers the question.

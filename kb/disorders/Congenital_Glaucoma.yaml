    snippet: "CYP1B1 has also been implicated in both vitamin A metabolism and transcription induction of genes necessary for the proliferation and differentiation of multiple ocular elements"
    explanation: >-
      Supports the proposed metabolic/retinoid route by which CYP1B1 loss

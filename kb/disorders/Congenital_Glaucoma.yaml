inheritance:
- name: Autosomal Recessive
  description: >-
    The usual pattern for primary congenital glaucoma, covering the CYP1B1
    (GLC3A) and LTBP2 (GLC3C/GLC3D) routes. Penetrance is incomplete and
    expressivity variable, so an obligate homozygote may be only mildly affected.
    Familial cases are strongly associated with consanguinity, but most cases
    worldwide are sporadic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:20301314
    reference_title: "Primary Congenital Glaucoma - RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PCG caused by biallelic pathogenic variants in CYP1B1 or LTBP2 is inherited in an autosomal recessive manner. PCG caused by a heterozygous pathogenic variant in TEK is inherited in an autosomal dominant manner."
    explanation: >-
      States the recessive inheritance of the CYP1B1 and LTBP2 forms, and
      contrasts it with the dominant TEK form recorded separately below.
      Evidence source is OTHER because GeneReviews is an expert-curated
      synthesis.
  - reference: PMID:9463332
    reference_title: "Mutations in CYP1B1, the gene for cytochrome P4501B1, are the predominant cause of primary congenital glaucoma in Saudi Arabia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Formal linkage analysis in 25 Saudi PCG families confirmed both significant linkage to polymorphic markers in this region and incomplete penetrance, but it showed no evidence of genetic heterogeneity."
    explanation: >-
      Documents incomplete penetrance directly in a linkage-confirmed
      GLC3A/CYP1B1 cohort, supporting the penetrance value recorded here.
- name: Autosomal Dominant
  description: >-
    The pattern for TEK-related congenital glaucoma (GLC3E), which acts through
    haploinsufficiency rather than biallelic loss. Expressivity is markedly
    variable, so a heterozygous parent may be unaffected or only mildly affected
    and the pedigree can be mistaken for a sporadic or recessive one.
  inheritance_term:

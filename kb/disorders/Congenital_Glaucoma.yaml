name: Congenital Glaucoma
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
parents:
- Glaucoma
disease_term:
  preferred_term: congenital glaucoma
  term:
    id: MONDO:0020366
    label: congenital glaucoma
description: >-
  Congenital glaucoma is the developmental glaucoma of infancy and early
  childhood, arising from maldevelopment of the aqueous outflow apparatus rather
  than from its acquired degeneration. Neural-crest-derived periocular mesenchyme
  fails to remodel normally into a mature trabecular meshwork and Schlemm canal,
  so aqueous outflow resistance is abnormal from birth and intraocular pressure
  rises within the first weeks to months of life. Because the infant sclera and
  cornea are still distensible, the raised pressure does something it cannot do in
  an adult eye: it stretches the globe. This produces the features that define the
  entity clinically and separate it from every adult glaucoma -- buphthalmos,
  megalocornea, corneal edema with curvilinear breaks in Descemet membrane (Haab
  striae), and a progressive myopic shift -- alongside the classic irritative triad
  of epiphora, photophobia, and blepharospasm. Optic disc cupping in an infant is
  partially reversible once pressure is controlled, another point of divergence
  from adult disease. Corneal opacification and anisometropia during the critical
  period of visual development add a second, non-glaucomatous route to permanent
  vision loss through deprivation and refractive amblyopia, so management must
  address amblyopia as well as pressure. Angle surgery, not topical medication, is
  the primary therapy.

  This entry is the umbrella for the congenital-onset forms. It covers primary
  congenital glaucoma (PCG), the nonsyndromic Mendelian disease of the GLC3A-GLC3E
  loci (CYP1B1, LTBP2, TEK, ANGPT1), together with the secondary congenital
  glaucomas that accompany non-acquired anterior segment anomalies -- the
  Axenfeld-Rieger spectrum, Peters anomaly, and aniridia. It deliberately does not
  re-derive the generic trabecular-outflow to intraocular-pressure to retinal
  ganglion cell chain, which is factored into the glaucoma_optic_neuropathy
  mechanism module and referenced here by conforms_to; nor the adult and
  multifactorial content in Glaucoma.yaml; nor the 3-to-40-year juvenile-onset
  entity in Juvenile_Open_Angle_Glaucoma.yaml. The dysgenesis-bearing syndromes
  themselves are curated separately (Axenfeld-Rieger_syndrome.yaml,
  Peters_Plus_Syndrome.yaml); what this entry adds for those is the shared route by
  which their angle anomaly becomes congenital glaucoma.
notes: >-
  Scope note on nomenclature. MONDO:0020366 congenital glaucoma is an umbrella
  term with no OMIM xref and no single causal gene; it subsumes primary congenital
  glaucoma (MONDO:0000365) and the numbered GLC3A-GLC3E entities. It carries
  "primary congenital glaucoma" only as a NARROW synonym, so this entry is
  deliberately broader than PCG alone and includes the secondary congenital forms
  associated with non-acquired ocular anomalies, following the Childhood Glaucoma
  Research Network (CGRN) primary/secondary split. Where a cited source speaks
  specifically of PCG, the evidence explanation says so.
has_subtypes:
- name: PCG
  display_name: Primary Congenital Glaucoma (nonsyndromic)
  description: >-
    Isolated, nonsyndromic developmental glaucoma with onset from birth to age
    three, caused by an isolated dysgenesis of the trabecular meshwork and
    iridocorneal angle with no other ocular or systemic anomaly. This is the
    parent of the numbered GLC3 subtypes below and the most common childhood
    glaucoma. Inheritance is usually autosomal recessive with incomplete
    penetrance and a strong association with consanguinity, but the majority of
    cases worldwide are sporadic.
  classification: clinical_phenotype
  subtype_term:
    preferred_term: primary congenital glaucoma
    term:
      id: MONDO:0000365
      label: primary congenital glaucoma
  evidence:
  - reference: PMID:28549150
    reference_title: "Primary congenital and developmental glaucomas."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary congenital glaucoma (PCG) is isolated, non-syndromic glaucoma that occurs in the first three years of life and is a major cause of childhood blindness."
    explanation: >-
      Defines PCG as isolated, non-syndromic, and occurring in the first three
      years, which is the boundary this subtype draws against the secondary
      forms. Evidence source is OTHER because this is a genetics review.
  - reference: PMID:39941238
    reference_title: "Primary Congenital and Childhood Glaucoma-A Complex Clinical Picture and Surgical Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PCG is considered the most common glaucoma in children, not associated with other syndromic manifestations. Usually, it is inherited in an autosomal recessive manner, with a positive family history in cases of consanguinity"
    explanation: >-
      Supports the non-syndromic definition and the recessive/consanguinity
      pattern recorded in this subtype. Evidence source is OTHER because this is
      a clinical review.
- name: GLC3A
  display_name: GLC3A - CYP1B1-related Primary Congenital Glaucoma
  description: >-
    Autosomal recessive PCG mapping to 2p21 and caused by biallelic CYP1B1
    variants. CYP1B1 is by far the most frequently implicated gene in congenital
    glaucoma worldwide, though its share of cases is strongly
    population-dependent, being highest in consanguineous and founder populations
    and much lower in outbred cohorts. Penetrance is incomplete and expressivity
    is variable, so mildly affected relatives of a proband can be missed.
  classification: molecular
  subtype_term:
    preferred_term: glaucoma 3A
    term:
      id: MONDO:0009277
      label: glaucoma 3A
  genes:
  - preferred_term: CYP1B1
    term:
      id: hgnc:2597
      label: CYP1B1
  evidence:
  - reference: PMID:9097971
    reference_title: "Identification of three different truncating mutations in cytochrome P4501B1 (CYP1B1) as the principal cause of primary congenital glaucoma (Buphthalmos) in families linked to the GLC3A locus on chromosome 2p21."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations detected in the affected members of these families were not present in 470 chromosomes from randomly selected normal individuals, thus strongly suggesting that CYP1B1 is the gene for the GLC3A locus on 2p21."
    explanation: >-
      Establishes CYP1B1 as the GLC3A gene, which is the definition of this
      subtype.
  - reference: PMID:38386645
    reference_title: "Genetic changes and testing associated with childhood glaucoma: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CYP1B1 variants were associated with region and population-specific prevalence ranging from 5% to 86% among those with primary congenital glaucoma."
    explanation: >-
      Quantifies the population dependence of the CYP1B1 contribution asserted in
      this subtype description.
- name: GLC3B
  display_name: GLC3B - 1p36-linked Primary Congenital Glaucoma
  description: >-
    A second autosomal recessive PCG locus mapped by linkage to 1p36.2-36.1 in
    families unlinked to GLC3A. The GLC3B gene has still not been identified,
    which is why this subtype is defined by locus rather than by gene; the same
    linkage study also showed that families unlinked to both 2p21 and 1p36 exist,
    establishing further locus heterogeneity.
  classification: molecular
  subtype_term:
    preferred_term: glaucoma 3, primary infantile, B
    term:
      id: MONDO:0010968
      label: glaucoma 3, primary infantile, B
  evidence:
  - reference: PMID:8842741
    reference_title: "A second locus (GLC3B) for primary congenital glaucoma (Buphthalmos) maps to the 1p36 region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we describe mapping of a new locus (designated GLC3B) for primary congenital glaucoma to the short arm of chromosome 1 (1p36.2-36.1)"
    explanation: >-
      The original mapping of GLC3B to 1p36, which is what defines this
      locus-based subtype.
  - reference: PMID:8842741
    reference_title: "A second locus (GLC3B) for primary congenital glaucoma (Buphthalmos) maps to the 1p36 region."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the remaining four families are not linked to this part of chromosome 1, thus providing further evidence that at least one more locus for the autosomal recessive form of GLC3 must exist in the genome."
    explanation: >-
      Supports the further locus heterogeneity noted in this subtype's
      description.
- name: GLC3C
  display_name: GLC3C - 14q24-linked Primary Congenital Glaucoma
  description: >-
    A third autosomal recessive PCG locus on 14q24. LTBP2, which lies about 1.3 Mb
    proximal to the documented GLC3C interval, harbours null mutations that cause
    PCG; whether LTBP2 is the GLC3C gene itself or an adjacent second gene at the
    locus was left unresolved by the original report and is recorded here as an
    open question rather than a settled equivalence.
  classification: molecular
  subtype_term:
    preferred_term: glaucoma 3, primary congenital, C
    term:
      id: MONDO:0013121
      label: glaucoma 3, primary congenital, C
  evidence:
  - reference: PMID:19361779
    reference_title: "Null mutations in LTBP2 cause primary congenital glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LTBP2 maps to chromosome 14q24.3 but is around 1.3 Mb proximal to the documented GLC3C locus. Therefore, it remains to be determined whether LTBP2 is the GLC3C gene or whether a second adjacent gene is also implicated in PCG."
    explanation: >-
      States the unresolved relationship between LTBP2 and the GLC3C locus that
      is the reason this subtype is kept separate from GLC3D.
- name: GLC3D
  display_name: GLC3D - LTBP2-related Primary Congenital Glaucoma
  description: >-
    Autosomal recessive PCG caused by biallelic null mutations in LTBP2 at
    14q24.3, reported in consanguineous Pakistani families and in patients of Roma
    ethnicity. LTBP2 is an extracellular matrix protein of the latent TGF-beta
    binding protein family with homology to the fibrillins; its loss appears to be
    a structural rather than a signalling defect of the anterior segment.
  classification: molecular
  subtype_term:
    preferred_term: glaucoma 3, primary congenital, D
    term:
      id: MONDO:0013122
      label: glaucoma 3, primary congenital, D
  genes:
  - preferred_term: LTBP2
    term:
      id: hgnc:6715
      label: LTBP2
  evidence:
  - reference: PMID:19361779
    reference_title: "Null mutations in LTBP2 cause primary congenital glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that null mutations in LTBP2 cause PCG in four consanguineous families from Pakistan and in patients of Gypsy ethnicity."
    explanation: >-
      Establishes biallelic LTBP2 null mutations as the cause of this subtype in
      the populations named.
  - reference: PMID:19361779
    reference_title: "Null mutations in LTBP2 cause primary congenital glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LTBP2 is the largest member of the latent transforming growth factor (TGF)-beta binding protein family, which are extracellular matrix proteins with multidomain structure. It has homology to fibrillins and may have roles in cell adhesion and as a structural component of microfibrils."
    explanation: >-
      Supports the fibrillin-homology and microfibril description given for this
      subtype.
- name: GLC3E
  display_name: GLC3E - TEK-related Primary Congenital Glaucoma
  description: >-
    PCG caused by heterozygous loss-of-function variants in TEK (TIE2), the
    endothelial angiopoietin receptor. Unlike the other GLC3 subtypes this one is
    autosomal dominant, acting through haploinsufficiency with markedly variable
    expressivity, so an obligate carrier parent may be unaffected or only mildly
    affected. The lesion is vascular-developmental: the Schlemm canal, a hybrid
    vessel with lymphatic and venous features, fails to form properly.
  classification: molecular
  subtype_term:
    preferred_term: glaucoma 3, primary congenital, E
    term:
      id: MONDO:0014998
      label: glaucoma 3, primary congenital, E
  genes:
  - preferred_term: TEK
    term:
      id: hgnc:11724
      label: TEK
  evidence:
  - reference: PMID:27270174
    reference_title: "Angiopoietin receptor TEK mutations underlie primary congenital glaucoma with variable expressivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "these results identify TEK mutations in patients with PCG that likely underlie disease and are transmitted in an autosomal dominant pattern with variable expressivity."
    explanation: >-
      Establishes the dominant, variably expressive inheritance that separates
      this subtype from the other GLC3 loci.
  - reference: PMID:29106382
    reference_title: "Angiopoietin-1 is required for Schlemm's canal development in mice and humans."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary congenital glaucoma (PCG) is a leading cause of blindness in children worldwide and is caused by developmental defects in 2 aqueous humor outflow structures, Schlemm's canal (SC) and the trabecular meshwork."
    explanation: >-
      Supports the anatomical premise of this subtype, that congenital glaucoma
      arises from developmental failure of Schlemm canal alongside the trabecular
      meshwork. Evidence source is OTHER because this is the paper's framing
      statement of established etiology rather than its own result.
- name: ANGPT1 PCG
  display_name: ANGPT1-related Primary Congenital Glaucoma
  description: >-
    PCG attributable to rare variants in ANGPT1, the principal ligand of the TEK
    receptor, identified in a small number of subjects within a large
    international PCG cohort. Mechanistically this is the ligand-side counterpart
    of GLC3E and converges on the same Schlemm canal developmental defect;
    ANGPT2 is dispensable on its own but compensates for ANGPT1 loss, which is
    consistent with the rarity of ANGPT1-only disease. No separate numbered GLC3
    locus or MONDO subtype term has been assigned.
  classification: molecular
  genes:
  - preferred_term: ANGPT1
    term:
      id: hgnc:484
      label: ANGPT1
  evidence:
  - reference: PMID:29106382
    reference_title: "Angiopoietin-1 is required for Schlemm's canal development in mice and humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, we identified 3 human subjects with rare ANGPT1 variants within an international cohort of 284 PCG patients."
    explanation: >-
      Gives the human genetic basis and the rarity of this subtype.
  - reference: PMID:29106382
    reference_title: "Angiopoietin-1 is required for Schlemm's canal development in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ANGPT2 was dispensable, although mice deficient in both Angpt1 and Angpt2 completely lacked SC, indicating that ANGPT2 compensates for the loss of ANGPT1"
    explanation: >-
      Supports the ligand-redundancy explanation this subtype gives for its own
      rarity.
- name: ASD Congenital Glaucoma
  display_name: Congenital Glaucoma Secondary to Non-Acquired Anterior Segment Dysgenesis
  description: >-
    Congenital and infantile glaucoma occurring as a complication of a
    non-acquired ocular anomaly of the anterior segment -- principally the
    Axenfeld-Rieger spectrum (PITX2, FOXC1), Peters anomaly (PAX6, FOXC1, PITX2,
    CYP1B1, B3GLCT and others), and PAX6-related aniridia. In the CGRN scheme
    these are secondary rather than primary childhood glaucomas, and in
    genomically characterised childhood-glaucoma cohorts they outnumber PCG. The
    underlying syndromes have their own dismech entries
    (Axenfeld-Rieger_syndrome, Peters_Plus_Syndrome); this subtype exists to hold
    the shared route by which their angle anomaly becomes congenital glaucoma,
    and the mechanism is not always the same as in PCG -- adhesional angle
    closure can operate alongside, or instead of, trabeculodysgenesis.
  classification: clinical_phenotype
  genes:
  - preferred_term: FOXC1
    term:
      id: hgnc:3800
      label: FOXC1
  - preferred_term: PITX2
    term:
      id: hgnc:9005
      label: PITX2
  - preferred_term: PAX6
    term:
      id: hgnc:8620
      label: PAX6
  evidence:
  - reference: PMID:38755526
    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "whereases secondary childhood glaucomas include those associated with non-acquired ocular anomalies (such as Axenfeld-Rieger spectrum (ARS), aniridia, and Peters anomaly)"
    explanation: >-
      Establishes the CGRN secondary category and names the three anomalies this
      subtype covers.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
  - reference: PMID:38755526
    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twenty-five percent (5/20) of the solved families had primary congenital glaucoma (PCG), while 75% (15/20) had secondary CG"
    explanation: >-
      Supports the claim that secondary forms outnumber PCG in a genomically
      characterised childhood-glaucoma cohort.
pathophysiology:
- name: Neural Crest-Derived Periocular Mesenchyme Maldevelopment
  conforms_to: "anterior_segment_dysgenesis#Disrupted Periocular Mesenchyme Migration and Differentiation"
  role: trigger
  biological_scale: CELLULAR
  description: >-
    The trabecular meshwork, corneal endothelium and stroma, iris stroma, and
    ciliary body all derive from cranial neural crest cells that migrate around
    the optic cup as periocular mesenchyme. Congenital glaucoma is at root a
    neurocristopathy of that migration and differentiation programme: when the
    periocular mesenchyme fails to remodel normally into the drainage apparatus,
    the outflow structures are abnormal from the outset rather than degenerating
    later. This is the common developmental origin shared by primary congenital
    glaucoma and the anterior segment dysgenesis syndromes, and it explains why
    the same transcription factors (FOXC1, PITX2, PAX6) recur across both.
  locations:
  - preferred_term: Periocular Mesenchyme
    term:
      id: UBERON:0004017
      label: periocular mesenchyme
  - preferred_term: Iridocorneal Angle
    term:
      id: UBERON:0006206
      label: iridocorneal angle
  cell_types:
  - preferred_term: Migratory Cranial Neural Crest Cell
    term:
      id: CL:0000008
      label: migratory cranial neural crest cell
  biological_processes:
  - preferred_term: Neural Crest Cell Migration
    term:
      id: GO:0001755
      label: neural crest cell migration
    modifier: ABNORMAL
  - preferred_term: Trabecular Meshwork Development
    term:
      id: GO:0002930
      label: trabecular meshwork development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26043871
    reference_title: "Neural crest derivatives in ocular development: discerning the eye of the storm."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Indeed, abnormalities in neural crest development cause craniofacial defects and ocular anomalies, such as Axenfeld-Rieger syndrome and primary congenital glaucoma."
    explanation: >-
      Establishes defective neural crest development as the shared developmental
      origin of both primary congenital glaucoma and the anterior segment
      dysgenesis syndromes, which is the claim this trigger node makes. Evidence
      source is OTHER because this is a developmental-biology review.
  - reference: PMID:26043871
    reference_title: "Neural crest derivatives in ocular development: discerning the eye of the storm."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These cells give rise to portions of the corneal endothelium and stroma, iris stroma, ciliary body stroma and muscles, sclera, and trabecular meshwork of the eye"
    explanation: >-
      Confirms that the trabecular meshwork and the other anterior segment
      structures affected in congenital glaucoma are neural crest derivatives,
      grounding the cell-type annotation on this node. Evidence source is OTHER
      because this is a review.
  - reference: PMID:38755526
    reference_title: "Increasing the diagnostic yield of childhood glaucoma cases recruited into the 100,000 Genomes Project."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Defects in the TM and the iridocorneal angle of the anterior chamber, caused by maldevelopment of neural crest tissues, can hinder the drainage process leading to fluid accumulation in the anterior chamber with resultant raised IOP"
    explanation: >-
      States the causal step from neural crest maldevelopment to obstructed
      drainage and raised intraocular pressure, linking this trigger to the
      downstream outflow node.
      Evidence source is OTHER because this statement is citation-bearing
      review prose in the paper's introduction rather than its own study
      result.
  - reference: PMID:41936534
    reference_title: "Integrating clinical and genetic insights in anterior segment dysgenesis with glaucoma: A contemporary review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Anterior Segment Dysgenesis (ASD) encompasses a heterogeneous group of congenital ocular malformations resulting from disrupted differentiation of neural crest-derived tissues. These disorders frequently lead to developmental glaucoma, a major cause of childhood blindness."
    explanation: >-
      Attributes anterior segment dysgenesis specifically to disrupted
      differentiation of neural-crest-derived tissue and connects it to
      developmental glaucoma. Evidence source is OTHER because this is a
      systematic literature review.
  downstream:
  - target: Trabeculodysgenesis and Congenital Outflow Obstruction

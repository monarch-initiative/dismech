  - reference: PMID:12624268
    reference_title: "Modification of ocular defects in mouse developmental glaucoma models by tyrosinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that Cyp1b1-/- mice have ocular drainage structure abnormalities resembling those reported in human PCG patients."
    explanation: >-
      Shows that CYP1B1 loss is sufficient to produce drainage-structure
      dysgenesis in a mammalian model, supporting the causal direction asserted
      by this node.
  - reference: PMID:12624268
    reference_title: "Modification of ocular defects in mouse developmental glaucoma models by tyrosinase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using Cyp1b1-/- mice, we identified the tyrosinase gene (Tyr) as a modifier of the drainage structure phenotype, with Tyr deficiency increasing the magnitude of dysgenesis."
    explanation: >-

      seen in mice.
  downstream:
  - target: Trabeculodysgenesis and Congenital Outflow Obstruction
- name: Angiopoietin-TEK Signaling Insufficiency and Schlemm Canal Hypoplasia
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A mechanistically distinct route to the same outflow failure runs through the
    vascular development of Schlemm canal rather than through the trabecular
    mesenchyme. Schlemm canal is a hybrid vessel with lymphatic and venous
    features, and its formation depends on angiopoietin ligand signalling through
    the endothelial receptor tyrosine kinase TEK (TIE2). Heterozygous TEK
    loss-of-function variants cause congenital glaucoma by haploinsufficiency,
    with several different cellular routes to that shared endpoint -- absent
    protein production, aggregation, accelerated proteasomal degradation,
    mislocalisation, and blunted ligand responsiveness. Rare variants in the
    ligand ANGPT1 act on the same axis from the other side. Because the defect is

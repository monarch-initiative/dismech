notes: >-
  No GeneReviews chapter covers MEGF10-related myopathy. PubMed searches of
  '"MEGF10-related myopathy"[TI] AND genereviews[book] NOT retired[TI]' and of 'MEGF10[TIAB] AND
  genereviews[book]' both return zero records, so the phenotype baseline here is the primary case literature
  together with the 2018 review of all 20 cases reported by then (PMID:29128256) and the 2026 series
  (PMID:42490466), which tabulates the published reports. No source gives phenotype frequencies as cohort
  percentages, so the frequency bands below are the coarse bands the case series support rather than measured
  proportions. MONDO folds the severe variant into the primary term, whose exact synonym is 'congenital myopathy
  10A, severe variant', so the EMARDD subtype below carries no subtype_term; the mild variant has its own MONDO
  term, MONDO:0859515, with OMIM 620249.
has_subtypes:
- name: EMARDD
  display_name: Early-onset myopathy, areflexia, respiratory distress and dysphagia
  classification: severity
  description: >-
    The severe infantile form, the presentation in which MEGF10 was first implicated. Decreased fetal movements,
    profound neonatal hypotonia, areflexia, diaphragmatic weakness with respiratory failure in the first year of
    life, and dysphagia requiring gastrostomy. Usually associated with at least one null allele, although
    biallelic missense alleles have also produced neonatal disease. Many affected children never walk
    independently and remain ventilator dependent.
  evidence:
  - reference: PMID:22101682
    reference_title: Mutations in MEGF10, a regulator of satellite cell myogenesis, cause early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used phased haplotype analysis with subsequent targeted exome sequencing to identify MEGF10 mutations in a
      previously unidentified type of infantile myopathy with diaphragmatic weakness, areflexia, respiratory
      distress and dysphagia.
    explanation: The original description of the severe infantile presentation that defines this subtype.
  - reference: PMID:36349186
    reference_title: "Congenital myopathy associated with a novel mutation in MEGF10 gene, myofibrillar alteration and progressive course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Phenotypic spectrum of EMARDD is variable, ranging from severe infantile forms in which patients are
      ventilator-dependent and die in childhood, to milder chronic disorders with a more favorable course (mild
      variant, mvEMARDD).
    explanation: States the two poles of the spectrum that the two subtypes here record.
- name: Mild variant
  display_name: Congenital myopathy 10B, mild variant
  classification: severity
  subtype_term:
    preferred_term: congenital myopathy 10b, mild variant
    term:
      id: MONDO:0859515
      label: congenital myopathy 10b, mild variant
  description: >-
    The milder end of the spectrum, usually called mvEMARDD or minicore myopathy with MEGF10 variants. Onset in
    childhood or adulthood with axial and limb weakness, neck weakness, scoliosis and respiratory insufficiency
    that may be the presenting problem in the fifth or sixth decade; muscle biopsy shows multiminicores or, in
    some late-onset patients, rimmed vacuoles and protein aggregates instead. Associated with missense alleles,
    typically substitutions of a conserved cysteine in an EGF-like domain.
  evidence:
  - reference: PMID:26802438
    reference_title: Adult-onset respiratory insufficiency, scoliosis, and distal joint hyperlaxity in patients with multiminicore disease due to novel Megf10 mutations.

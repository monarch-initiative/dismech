- name: Neuromuscular Junction Degeneration
  biological_scale: TISSUE
  description: >-
    A second site of pathology, demonstrated so far only in the mouse. MEGF10 concentrates at the neuromuscular
    junction postnatally and is enriched in perisynaptic Schwann cells; Megf10 knockout mice develop early and
    progressive junctional degeneration with postsynaptic fragmentation, presynaptic regions not covered by
    acetylcholine receptors and perisynaptic Schwann cell processes entering the synaptic cleft, and the diaphragm
    is affected earliest. Deleting Megf10 from Schwann cells alone reduces perisynaptic Schwann cell number and
    endplate innervation by middle age. No human muscle study has looked for these changes.
  cell_types:
  - preferred_term: perisynaptic Schwann cell
    term:
      id: CL:0000692
      label: terminal Schwann cell
  evidence:
  - reference: PMID:38760872
    reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: We also found perisynaptic Schwann cells intruding into the NMJ synaptic cleft.
    explanation: Ultrastructural junctional abnormality in the knockout mouse.
  - reference: PMID:38760872
    reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
    supports: SUPPORT

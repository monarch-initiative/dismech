- name: Premature Myogenic Differentiation and Satellite Cell Pool Depletion
  biological_scale: CELLULAR
  description: >-
    Without MEGF10, satellite cells activate myogenin and differentiate precociously instead of self-renewing, and
    the Pax7-positive, MyoD-negative self-renewing population is depleted. Megf10-null mouse muscle has fewer
    Pax7-stained nuclei and activates fewer satellite cells on overload, and muscle from a patient with the severe
    form shows a reduction of Pax7-positive satellite cells, so the depletion is documented in human tissue as
    well as in the mouse.

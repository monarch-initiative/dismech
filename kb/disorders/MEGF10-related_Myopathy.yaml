genetic:
- name: MEGF10
  gene_term:
    preferred_term: MEGF10
    term:
      id: hgnc:29634
      label: MEGF10
  relationship_type: CAUSATIVE
  notes: >-
    MEGF10 lies at 5q23.2 and encodes a transmembrane protein with 17 atypical EGF-like repeats. Reported alleles
    include nonsense, frameshift and splice-site variants, an intragenic deletion of exon 7, and missense variants
    that mostly substitute a conserved cysteine of an EGF-like repeat. The genotype predicts onset: at least one
    null allele gives respiratory involvement within the first year, whereas biallelic missense alleles usually
    give later onset, with reported exceptions of early-onset biallelic missense disease.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_1d00193c-b0fd-40b4-b5d5-51eecece9669-2020-01-27T170000.000Z
    evidence:
    - reference: CGGV:assertion_1d00193c-b0fd-40b4-b5d5-51eecece9669-2020-01-27T170000.000Z
      reference_title: MEGF10 / MEGF10-related myopathy (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "MEGF10 | HGNC:29634 | MEGF10-related myopathy | MONDO:0013731 | AR | Definitive"
      explanation: ClinGen classifies the MEGF10 to MEGF10-related myopathy relationship, autosomal recessive, as definitive.
  evidence:
  - reference: PMID:22101682
    reference_title: Mutations in MEGF10, a regulator of satellite cell myogenesis, cause early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used phased haplotype analysis with subsequent targeted exome sequencing to identify MEGF10 mutations in a
      previously unidentified type of infantile myopathy with diaphragmatic weakness, areflexia, respiratory
      distress and dysphagia.
    explanation: Identification of MEGF10 as the causal gene.
  - reference: CGGV:assertion_1d00193c-b0fd-40b4-b5d5-51eecece9669-2020-01-27T170000.000Z
    reference_title: MEGF10 / MEGF10-related myopathy (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in this gene have been reported in at least nine probands in four publications (PMIDs: 22101682, 22371254, 23453856, 27460346)."
    explanation: The genetic evidence base behind the definitive classification for this exact disease.
  - reference: PMID:35370044
    reference_title: Identification of a novel mutation and genotype-phenotype relationship in MEGF10 myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Results show that patients with missense mutations in at least one allele had significantly later onset than
      those with biallelic truncation mutations.
    explanation: The genotype to onset relationship stated in the notes.
  - reference: PMID:29128256
    reference_title: "MEGF10 related myopathies: A new case with adult onset disease with prominent respiratory failure and review of reported phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with ≥1 null mutation onset of respiratory dysfunction occurs in the first year of life, whereas with 2
      missense mutations, respiratory dysfunction occurs at 10 years old or much later, as in the patient reported
      here.
    explanation: The allele-class rule for respiratory onset, from a review of all 20 cases reported by 2018.
  variants:
  - name: p.Cys326Arg and p.Cys774Arg
    description: >-
      Compound heterozygous missense alleles in the family in which the minicore presentation was described. Both
      replace a conserved cysteine of an atypical EGF-like repeat and both reduce tyrosine phosphorylation of
      MEGF10 in vitro; p.Cys774Arg also disrupts the interaction with Notch1.
    evidence:
    - reference: PMID:22371254
      reference_title: Mutations in the satellite cell gene MEGF10 cause a recessive congenital myopathy with minicores.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Affected subjects were compound heterozygous for missense mutations c.976T > C (p.C326R) and c.2320T > C
        (p.C774R).
      explanation: The alleles and their co-segregation.
    - reference: PMID:23954233
      reference_title: Cysteine mutations cause defective tyrosine phosphorylation in MEGF10 myopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Two mutations in the extracellular EGF-like domains of MEGF10, C326R and C774R, were associated with
        decreased tyrosine phosphorylation of MEGF10 in vitro.
      explanation: Functional consequence of both alleles.
  - name: Homozygous deletion of exon 7
    description: >-
      A homozygous intragenic deletion of exon 7, the first genomic deletion reported in this disease, in a girl
      with the severe phenotype. It was found by combining SNP array hybridization with exome coverage analysis,
      so sequence-only analysis can miss such alleles.
    evidence:
    - reference: PMID:23453856
      reference_title: "Novel SNP array analysis and exome sequencing detect a homozygous exon 7 deletion of MEGF10 causing early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        By novel analysis of SNP array hybridization and exome sequence coverage, we diagnosed a 10-years old girl
        with EMARDD following identification of a novel homozygous deletion of exon 7 in MEGF10.
      explanation: The allele and how it was detected.
  - name: p.Cys113Arg
    description: >-
      Novel homozygous missense allele at a cysteine of an EGF-like domain in a boy with the severe phenotype
      whose biopsy showed reduced Pax7-positive satellite cells. It is an example of early-onset disease with
      biallelic missense alleles, against the usual genotype to onset rule.
    evidence:
    - reference: PMID:42490466
      reference_title: "Large phenotypic variability with severe respiratory involvement in MEGF10-related myopathies: Description of three cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Genetic studies disclosed the novel homozygous MEGF10 c.337T>C, p.(Cys113Arg) variant.
      explanation: The allele in the severely affected patient of this series.

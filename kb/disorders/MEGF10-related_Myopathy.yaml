    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Since SMARD1 is a largely neuropathic condition ... EMARDD is distinguished by its myopathic features
    explanation: States the distinction between the two disorders.
- name: Multiminicore disease
  description: >-
    Multiminicore disease from SELENON or RYR1 variants shares the minicore biopsy picture, axial weakness,
    scoliosis and respiratory insufficiency with the milder MEGF10 presentations, and MEGF10 patients have been
    diagnosed as multiminicore disease before sequencing.
  evidence:
  - reference: PMID:26802438
    reference_title: Adult-onset respiratory insufficiency, scoliosis, and distal joint hyperlaxity in patients with multiminicore disease due to novel Megf10 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mutations in the selenoprotein N1-encoding gene (SEPN1) and ryanodine receptor 1-encoding gene (RYR1) are
      responsible for half of the reported cases.
    explanation: Names the main genetic causes of the multiminicore phenotype that MEGF10 disease mimics.
treatments:
- name: Assisted Ventilation
  description: >-
    Long-term ventilatory support is the mainstay. In the severe form this means continuous ventilation and
    tracheostomy within the first months or years of life; milder patients start with nocturnal non-invasive
    ventilation and may later need tracheostomy. There is no disease-modifying therapy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: non-invasive and invasive mechanical ventilation
    term:
      id: NCIT:C70909
      label: Mechanical Ventilation
  target_mechanisms:
  - target: Respiratory insufficiency due to muscle weakness
  evidence:
  - reference: PMID:42490466
    reference_title: "Large phenotypic variability with severe respiratory involvement in MEGF10-related myopathies: Description of three cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Severely affected individuals often require ventilatory support within the first months or years of life,
      and in some cases, never achieve independent ambulation.
    explanation: Ventilatory support is the standard of care at the severe end.
  - reference: PMID:22371254
    reference_title: Mutations in the satellite cell gene MEGF10 cause a recessive congenital myopathy with minicores.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      beginning at age 10–11 years, they all developed respiratory problems treated with bilevel positive airway
      pressure ventilation at night
    explanation: Nocturnal non-invasive ventilation in the milder presentation.
  - reference: PMID:31267131
    reference_title: Selective serotonin reuptake inhibitors ameliorate MEGF10 myopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: There are no disease-modifying therapies.
    explanation: Sources the statement that management is supportive only.
- name: Gastrostomy Feeding
  description: >-
    Gastrostomy for the dysphagia and aspiration risk of the severe form, often placed in infancy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  target_mechanisms:
  - target: Dysphagia
  evidence:
  - reference: PMID:23453856
    reference_title: "Novel SNP array analysis and exome sequencing detect a homozygous exon 7 deletion of MEGF10 causing early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: At eight months, she underwent gastrostomy tube placement.
    explanation: Gastrostomy in a molecularly confirmed patient.
  - reference: PMID:34828389
    reference_title: "Phenotypic Variability of MEGF10 Variants Causing Congenital Myopathy: Report of Two Unrelated Patients from a Highly Consanguineous Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Additional features include dysphagia often requiring gastrostomy feeding, generalized muscle weakness
      causing delayed motor development, poor head control, facial weakness, cleft palate, contractures, and
      scoliosis
    explanation: Gastrostomy feeding as the usual response to the dysphagia.
- name: Spinal Fusion
  description: >-
    Surgical stabilization of the neuromuscular scoliosis, needed in childhood in many patients and sometimes
    repeatedly.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: spinal fusion
    term:
      id: NCIT:C157986
      label: Spinal Fusion
  target_mechanisms:
  - target: Scoliosis
  evidence:
  - reference: PMID:22371254
    reference_title: Mutations in the satellite cell gene MEGF10 cause a recessive congenital myopathy with minicores.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All three patients had childhood onset scoliosis and were treated with spinal fusion surgery, and beginning
      at age 10–11 years, they all developed respiratory problems treated with bilevel positive airway pressure
      ventilation at night.
    explanation: Spinal fusion in all three affected siblings.
  - reference: PMID:23453856
    reference_title: "Novel SNP array analysis and exome sequencing detect a homozygous exon 7 deletion of MEGF10 causing early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She has bladder incontinence and progressive scoliosis requiring numerous surgical stabilizations.
    explanation: Repeated spinal stabilization in a severely affected patient.
animal_models:
- name: Megf10 knockout mouse
  species: Mouse
  genotype: Megf10(-/-)
  publication: PMID:33159715
  description: >-
    Germline Megf10-null mouse. Satellite cells show reduced proliferation and migration, regeneration after
    repeated barium chloride injury is impaired, muscles contain fewer fibers and have lower mass, and the
    neuromuscular junctions degenerate progressively from the juvenile period, earliest in the diaphragm. The mice
    do not reproduce the severe respiratory failure of the human disease and their fibers show no morphological
    hallmarks of atrophy.
  modeled_mechanisms:
  - target: Reduced Satellite Cell Proliferation and Migration
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Satellite cells isolated from the knockout show the proliferation and migration defects directly.
    evidence:
    - reference: PMID:33159715
      reference_title: Megf10 deficiency impairs skeletal muscle stem cell migration and muscle regeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Megf10-/- muscle satellite cells showed reduced proliferation and migration, while Megf10-/- mouse skeletal
        muscles showed impaired regeneration.
      explanation: Both halves of this node measured in the knockout.
  - target: Reduced Myofiber Number and Impaired Muscle Regeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      A null allele, whereas most patients carry missense alleles; and the mouse muscle is smaller without the
      atrophic fiber morphology or the respiratory failure that dominate the human disease.
    evidence:
    - reference: PMID:38760872
      reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found fewer muscle fibers in juvenile and adult Megf10 KO mice, supporting published studies that MEGF10
        regulates myogenesis by affecting satellite cell differentiation.
      explanation: The fiber deficit in the knockout.
    readouts:
    - name: Tibialis anterior muscle mass
      target: Reduced Myofiber Number and Impaired Muscle Regeneration
      direction: DECREASED
      interpretation: Whole-muscle correlate of the reduced fiber number.
      evidence:
      - reference: PMID:38760872
        reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Consistent with the TA in young adult Megf10 KO mice having fewer muscle fibers, the TA mass is smaller
          in Megf10 KO mice compared to control mice (Fig. 1D-E).
        explanation: The measurement behind this readout.
  - target: Neuromuscular Junction Degeneration
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    limitations: >-
      The junctional pathology has been shown only in the mouse. No human muscle study has looked for
      postsynaptic fragmentation or perisynaptic Schwann cell intrusion, so its fidelity to the human disease is
      untested.
    evidence:
    - reference: PMID:38760872
      reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings strongly suggest that the NMJ is a site of postnatal pathology in MEGF10-related myopathy.
      explanation: The authors' own reading of the junctional findings.
- name: Megf10 Schwann cell conditional knockout mouse
  species: Mouse
  genotype: Megf10 conditional knockout in Schwann cells (Megf10 SC-KO)
  publication: PMID:40099661
  description: >-
    Megf10 deleted in all Schwann cells including the perisynaptic Schwann cells of the neuromuscular junction.
    Junctions are normal in development and young adulthood but by middle age have fewer perisynaptic Schwann
    cells, less endplate coverage and reduced innervation; axonal debris is cleared faster after nerve injury.
  modeled_mechanisms:
  - target: Neuromuscular Junction Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Megf10 is removed only from Schwann cells, so this is not the biallelic whole-body loss of the human
      disease, and the junctional changes appear in middle age rather than in infancy.
    evidence:
    - reference: PMID:40099661
      reference_title: Loss of MEGF10 Decreases the Number of Perisynaptic Schwann Cells and Innervation of Neuromuscular Junctions in Aging Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        NMJs presented with fewer PSCs, decreased PSC coverage of the endplate, and decreased innervation in
        comparison to control mice.
      explanation: The junctional phenotype of the conditional knockout.
- name: megf10 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: megf10 splice-site morpholino knockdown
  publication: PMID:22371254
  description: >-
    Four independent splice-site morpholinos against megf10, used to corroborate the pathogenicity of the human
    missense alleles. Morphants show curved tails, impaired motility and disorganized muscle tissue.
  modeled_mechanisms:
  - target: Myopathic and Dystrophic Muscle Pathology With Minicores
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    limitations: >-
      Transient morpholino knockdown in the embryo rather than a patient allele, and the readout is disorganized
      embryonic muscle and impaired motility rather than minicores or fiber size variation.
    evidence:
    - reference: PMID:22371254
      reference_title: Mutations in the satellite cell gene MEGF10 cause a recessive congenital myopathy with minicores.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        knockdown of megf10 in zebrafish by four different morpholinos resulted in abnormal phenotypes including
        unhatched eggs, curved tails, impaired motility, and disorganized muscle tissue, corroborating the
        pathogenicity of the human mutations.
      explanation: The morphant phenotype and the use the authors made of it.
experimental_models:
- name: Patient iPSC-derived myoblasts and Megf10-null mouse myoblasts in a small molecule screen
  experimental_model_type: IPSC_DERIVED_MODEL
  publication: PMID:31267131
  description: >-
    A proliferation screen in Megf10-deficient myoblasts followed by secondary testing of the hits in myoblasts
    from Megf10-null mice, induced pluripotent stem cell-derived myoblasts from patients, Drpr-deficient
    Drosophila and megf10 mutant zebrafish. Two selective serotonin reuptake inhibitors came out of the screen,
    and sertraline corrected abnormalities across the models and restored Notch1.
  modeled_mechanisms:
  - target: Reduced Satellite Cell Proliferation and Migration
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: >-
      Patient-derived myoblasts in culture lack the satellite cell niche, and the screen read cellular
      proliferation rather than muscle function.
    evidence:
    - reference: PMID:31267131
      reference_title: Selective serotonin reuptake inhibitors ameliorate MEGF10 myopathy.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: A primary in vitro drug screen assessed cellular proliferation patterns in Megf10-deficient myoblasts.
      explanation: The proliferation defect is the assay this model reads out.
    readouts:
    - name: Myoblast abnormalities after sertraline treatment
      target: Reduced Satellite Cell Proliferation and Migration
      direction: RESTORED
      interpretation: >-
        Sertraline corrected the cellular phenotype across mouse myoblast, patient myoblast, Drosophila and
        zebrafish models. This is preclinical only; no treated patient has been reported.
      evidence:
      - reference: PMID:31267131
        reference_title: Selective serotonin reuptake inhibitors ameliorate MEGF10 myopathy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          sertraline was highly effective in alleviating abnormalities across multiple models of the disease
          including mouse myoblast, human myoblast, Drosophila and zebrafish models.
        explanation: The rescue result behind this readout.
- name: C2C12 myoblasts with Megf10 knockdown or p.Cys774Arg overexpression
  experimental_model_type: CELL_LINE
  publication: PMID:28498977
  description: >-
    Short hairpin knockdown of Megf10 and overexpression of the human p.Cys774Arg allele in C2C12 myoblasts, with
    co-immunoprecipitation of Megf10 and Notch1 to test the interaction and its disruption by the patient allele.
  modeled_mechanisms:
  - target: Impaired MEGF10 and Notch1 Signaling in Satellite Cells
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      An immortalized mouse myoblast line with an overexpressed human allele, so the stoichiometry is not that of
      a patient satellite cell.
    evidence:
    - reference: PMID:28498977
      reference_title: Consequences of MEGF10 deficiency on myoblast function and Notch1 interactions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: These interactions are impaired by the pathogenic p.C774R mutation.
      explanation: The measurement this model makes.
discussions:
- discussion_id: megf10_ssri_translation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does sertraline, or another selective serotonin reuptake inhibitor, improve muscle function in people with
    MEGF10-related myopathy?
  attaches_to:
  - pathophysiology#Impaired MEGF10 and Notch1 Signaling in Satellite Cells
  - treatments#Assisted Ventilation
  rationale: >-
    A small molecule screen identified sertraline and escitalopram, and sertraline corrected the cellular
    phenotype in mouse myoblasts, patient induced pluripotent stem cell-derived myoblasts, Drosophila and
    zebrafish, and restored Notch1. These are repurposing candidates with known human pharmacology, but no trial
    or treated case series in this disease has been published, and the models that responded report proliferation
    and developmental readouts rather than respiratory function, which is what limits survival.
  evidence:
  - reference: PMID:31267131
    reference_title: Selective serotonin reuptake inhibitors ameliorate MEGF10 myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that SSRIs show promise as potential therapeutic compounds for MEGF10 myopathy, especially
      sertraline.
    explanation: The strongest statement the preclinical work supports, and the reason the question is open.
  - reference: PMID:36349186
    reference_title: "Congenital myopathy associated with a novel mutation in MEGF10 gene, myofibrillar alteration and progressive course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis of MEGF10 myopathy is essential in light of recent results from in vivo testing
      demonstrating a potential therapeutic effect of SSRIs compounds.
    explanation: Clinicians treating these patients already frame early diagnosis around this possibility.
- discussion_id: megf10_nmj_human_relevance
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is the neuromuscular junction a site of pathology in human MEGF10-related myopathy, as it is in the Megf10
    knockout mouse?
  attaches_to:
  - pathophysiology#Neuromuscular Junction Degeneration
  rationale: >-
    Junctional degeneration in the mouse is early, progressive and worst in the diaphragm, which would fit the
    human respiratory phenotype better than the fiber findings do, and deleting Megf10 from Schwann cells alone is
    enough to reduce endplate innervation. But no human muscle study has examined the junction in this disease,
    and the same knockout mouse fails to reproduce the human respiratory failure, so the junctional arm may be a
    mouse-specific finding or may be the missing link. Resolving it would change what a therapy should aim at.
  proposed_experiments:
  - experiment_id: megf10_nmj_patient_biopsy_morphology
    name: Neuromuscular junction morphology in patient muscle
    description: >-
      Examine endplates in diagnostic muscle biopsies from patients with biallelic MEGF10 variants, with
      acetylcholine receptor and presynaptic staining and electron microscopy where tissue allows, comparing
      postsynaptic fragmentation and perisynaptic Schwann cell position against age-matched controls.
    would_support:
    - pathophysiology#Neuromuscular Junction Degeneration
  evidence:
  - reference: PMID:38760872
    reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These findings strongly suggest that the NMJ is a site of postnatal pathology in MEGF10-related myopathy.
    explanation: The mouse claim whose human relevance is the open question.
  - reference: PMID:38760872
    reference_title: Cellular and molecular alterations to muscles and neuromuscular synapses in a mouse model of MEGF10-related myopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Interestingly, muscle fibers do not exhibit morphological hallmarks of atrophy in either young adult or
      middle-aged Megf10 KO mice.
    explanation: The same mouse does not reproduce the muscle wasting of the human disease, which is why its junctional finding needs human confirmation.
mechanistic_hypotheses:
- hypothesis_group_id: megf10_phagocytic_function_contribution
  hypothesis_label: >-
    Loss of the engulfment receptor function of MEGF10, rather than its satellite cell signalling function alone,
    contributes to the myopathy
  status: EMERGING
  description: >-
    MEGF10 is also a class F scavenger receptor that binds C1q on apoptotic cells and signals engulfment through
    its intracellular ITAM tyrosines and the kinase Syk, and alleles found in patients impair both apoptotic cell
    clearance and C1q binding. Debris clearance matters in regenerating muscle and at the injured neuromuscular
    junction, where Megf10 in Schwann cells affects removal of axonal debris. Three things keep this a
    hypothesis: the clearance defect has been shown in transfected cells and in glia rather than in patient
    muscle, the same intracellular tyrosines carry the proliferative signal, so a shared residue cannot separate
    the two functions, and no study has connected impaired clearance to any clinical feature of the disease.
  evidence:
  - reference: PMID:27170117
    reference_title: Megf10 Is a Receptor for C1Q That Mediates Clearance of Apoptotic Cells by Astrocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      cells expressing Megf10 with EMARDD mutations have impaired apoptotic cell clearance and impaired binding to
      C1q.
    explanation: Patient alleles impair the engulfment function, which is what makes the hypothesis worth stating.
  - reference: PMID:22993420
    reference_title: Jedi-1 and MEGF10 signal engulfment of apoptotic neurons through the tyrosine kinase Syk.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutation of the ITAM tyrosines of Jedi-1 and MEGF10 prevented engulfment.
    explanation: Identifies the intracellular tyrosines that the engulfment signal depends on.
  - reference: PMID:40099661
    reference_title: Loss of MEGF10 Decreases the Number of Perisynaptic Schwann Cells and Innervation of Neuromuscular Junctions in Aging Mice.
    supports: REFUTE
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following nerve injury-induced damage, axonal debris at the NMJ was cleared faster in Megf10 SC-KO mice; yet,
      the rate of reinnervation was unchanged compared to control mice.
    explanation: >-
      Cuts against the hypothesis at the one site where it has been tested in vivo: removing Megf10 sped debris
      clearance up rather than impairing it, and left reinnervation unchanged. The step is inferential because
      the experiment is in Schwann cells after nerve injury rather than in muscle.

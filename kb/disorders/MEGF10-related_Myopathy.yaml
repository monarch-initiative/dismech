- name: Progressive Axial and Generalized Muscle Weakness
  biological_scale: ORGANISM
  description: >-
    Generalized weakness that is predominantly axial and proximal, beginning with poor head control and neck
    weakness and extending to facial and bulbar muscles. It produces hypotonia and motor delay in infancy,
    dysphagia and hypernasal speech from palatal and pharyngeal weakness, and progressive scoliosis from axial
    weakness, which is sometimes the presenting sign. Distribution varies between patients: some have more
    proximal than distal weakness and legs more than arms.

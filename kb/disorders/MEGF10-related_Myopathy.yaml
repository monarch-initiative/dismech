diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Diagnosis requires biallelic pathogenic MEGF10 variants. Because the clinical picture overlaps the congenital
    myopathies and spinal muscular atrophy with respiratory distress, the gene is usually reached by panel or
    exome sequencing; copy number analysis of exome data is needed to find intragenic deletions that sequence
    analysis misses.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:23453856
    reference_title: "Novel SNP array analysis and exome sequencing detect a homozygous exon 7 deletion of MEGF10 causing early onset myopathy, areflexia, respiratory distress and dysphagia (EMARDD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By novel analysis of SNP array hybridization and exome sequence coverage, we diagnosed a 10-years old girl
      with EMARDD following identification of a novel homozygous deletion of exon 7 in MEGF10.
    explanation: Shows both the molecular criterion and the need for copy number analysis.
  - reference: PMID:39654599

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This case illustrates the heterogeneous phenotype of early onset myopathy, areflexia, respiratory distress,
      and dysphagia (EMARDD), according to the mutations associated, and underscores the importance of early
      genetic testing.
    explanation: Argues for early genetic testing given the variable phenotype.

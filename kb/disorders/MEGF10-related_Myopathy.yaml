name: MEGF10-Related Myopathy
creation_date: "2026-10-31T14:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive congenital myopathy caused by biallelic loss-of-function variants in MEGF10, which encodes a
  transmembrane receptor of quiescent and activated skeletal muscle satellite cells. MEGF10 keeps satellite cells
  proliferative and migratory and holds back their differentiation and fusion, acting at least partly through the
  Notch pathway: it binds Notch1 through its intracellular domain, its own tyrosine phosphorylation at Y1030 is
  needed for the proliferative signal, and silencing it drives myogenin activation, precocious differentiation and
  loss of the self-renewing Pax7-positive pool. Because the lesion sits in the muscle stem cell rather than in the
  contractile apparatus, the disease is grouped with the primary satellite cell disorders, and patient muscle shows
  reduced Pax7-positive satellite cells together with a mixture of myopathic and dystrophic change: minicores,
  marked variation in fiber diameter, increased endomysial connective tissue and fibro-fatty replacement. The
  clinical spectrum runs from the severe infantile form originally named EMARDD, with decreased fetal movements,
  neonatal hypotonia, areflexia, diaphragmatic weakness requiring ventilation and dysphagia, to a milder minicore
  myopathy presenting in childhood or adulthood with scoliosis and late respiratory failure; onset tracks the
  genotype, with at least one null allele giving respiratory involvement in the first year of life and biallelic
  missense alleles usually giving later onset. No disease-modifying treatment exists, and management is
  respiratory support, feeding support, scoliosis surgery and physiotherapy.

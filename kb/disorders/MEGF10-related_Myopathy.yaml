- name: Impaired MEGF10 and Notch1 Signaling in Satellite Cells
  biological_scale: MOLECULAR
  description: >-
    MEGF10 and Notch1 interact through their respective intracellular domains, and the interaction is lost with the
    p.Cys774Arg allele. Silencing Megf10 in MyoD-null myoblasts lowers Notch and Hes1 transcript levels, so the
    receptor acts on Notch signalling that normally restrains terminal myogenic differentiation. Sertraline, which
    corrects the cellular phenotype of several disease models, also restores Notch1 in them. MEGF10 is one of
    three muscle disease genes that act on this pathway, alongside the Notch ligand JAG2 and POGLUT1, which
    glycosylates the Notch receptor ectodomain.

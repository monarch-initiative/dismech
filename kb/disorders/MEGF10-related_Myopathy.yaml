pathophysiology:
- name: Biallelic MEGF10 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous MEGF10 variants cause the disease: nonsense and frameshift alleles, splice
    alleles, an intragenic deletion of exon 7, and missense alleles that mostly substitute one of the eight
    conserved cysteines of an atypical EGF-like repeat. Heterozygous carriers are unaffected. The mechanism
    recorded by the ClinGen congenital myopathies expert panel is homozygous loss of function.

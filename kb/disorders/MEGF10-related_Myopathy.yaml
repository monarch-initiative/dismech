- name: Loss of MEGF10 Receptor Function at the Satellite Cell Surface
  biological_scale: MOLECULAR
  description: >-
    MEGF10 is a transmembrane receptor with 17 atypical EGF-like repeats whose conserved cysteines form disulfide
    bonds; it marks quiescent satellite cells and is expressed in myoblasts but not in differentiated myofibers.
    The pathogenic cysteine substitutions p.Cys326Arg and p.Cys774Arg reduce tyrosine phosphorylation of the
    receptor, and the principal site, Y1030, is required for the proliferative effect of MEGF10 on myoblasts, so
    the receptor loses its signalling output rather than merely being absent from the surface.

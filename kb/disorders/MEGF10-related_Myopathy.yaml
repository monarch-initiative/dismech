- name: Diaphragmatic Weakness
  biological_scale: ORGANISM
  description: >-
    Weakness of the diaphragm is the feature that distinguishes this myopathy clinically and the usual cause of
    death. In the severe form it appears as infantile diaphragmatic paralysis or hemidiaphragmatic eventration
    requiring mechanical ventilation; in the mild variant it appears as restrictive respiratory failure in the
    second decade or much later, sometimes while the patient is still ambulant. Scoliosis adds a secondary
    restrictive load.

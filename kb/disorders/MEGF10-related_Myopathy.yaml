- name: Reduced Myofiber Number and Impaired Muscle Regeneration
  biological_scale: TISSUE
  description: >-
    The consequence of the stem cell defect at tissue level: fewer myofibers are formed and damaged muscle is
    repaired poorly. Megf10 knockout mice have fewer fibers and smaller muscles as juveniles and adults and
    regenerate poorly after repeated barium chloride injury, and the multinucleated myofibers formed by satellite

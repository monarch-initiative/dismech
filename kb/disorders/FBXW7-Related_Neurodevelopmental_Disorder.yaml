- name: Somatic Second Hit in FBXW7
  description: >-
    FBXW7 is a tumor suppressor. In the few carriers who developed Wilms tumor, the
    tumor carried a somatic truncating variant on the other FBXW7 allele, giving
    biallelic inactivation in tumor tissue (a two-hit mechanism).

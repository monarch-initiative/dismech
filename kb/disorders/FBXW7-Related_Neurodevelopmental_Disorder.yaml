    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Protein levels of the Fbw7 substrates Notch1 and N-terminally phosphorylated c-Jun were upregulated in fbw7(∆Cb) mice."
    explanation: Cerebellar Fbxw7 loss raises c-Jun and Notch1 protein levels.

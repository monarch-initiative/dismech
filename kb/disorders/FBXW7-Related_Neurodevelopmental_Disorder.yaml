- name: c-Jun Accumulation in Cerebellum
  description: >-
    N-terminally phosphorylated c-Jun is an SCF(FBXW7) substrate. Deleting both
    Fbxw7 alleles from the developing mouse cerebellum raises its level, together
    with NOTCH1, and this c-Jun excess is responsible for Purkinje cell loss and
    poor arborization.
  biological_scale: CELLULAR
  locations:
  - preferred_term: cerebellum
    term:

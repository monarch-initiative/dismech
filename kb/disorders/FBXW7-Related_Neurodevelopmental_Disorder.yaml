genetic:
- name: FBXW7
  association: Causative
  gene_term:
    preferred_term: FBXW7
    term:
      id: hgnc:16712
      label: FBXW7
  features: >-
    Heterozygous germline or constitutional mosaic FBXW7 variants, mostly de novo
    and sometimes inherited from a mildly affected or apparently unaffected parent.
    The spectrum includes chromosomal deletions, copy number variants of the
    upstream regulatory region, nonsense, frameshift, splice-site and missense
    variants, the missense variants clustering in the WD40 domain.
  evidence:
  - reference: PMID:35395208
    reference_title: "Germline variants in tumor suppressor FBXW7 lead to impaired ubiquitination and a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, the data presented herein provide compelling evidence of an F-Box protein-related, phenotypically variable neurodevelopmental disorder associated with monoallelic variants in FBXW7."
    explanation: Establishes FBXW7 as the causal gene.
  - reference: PMID:42111496
    reference_title: "FBXW7-Related Neurodevelopmental Disorder: Clinical Spectrum, Molecular Mechanisms, and Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Reported germline variants include missense, frameshift, splice-site, and larger structural variants, with the majority clustering in the WD40 domain and disrupting substrate recognition."
    explanation: Summarizes the reported variant spectrum.
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >-
    Autosomal dominant. Most variants are de novo, but inherited variants occur,
    including from a parent reported as unaffected, so parental testing is
    warranted. Expressivity ranges from isolated absence epilepsy with normal
    cognition to severe intellectual disability.
  evidence:
  - reference: PMID:42432493
    reference_title: "Expanding clinical variability in FBXW7-related neurodevelopmental disorder: a multicenter case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case series expands the phenotypic spectrum associated with FBXW7-related neurodevelopmental disorder and highlights variable expressivity and incomplete penetrance, including clinically relevant variants presenting with mild or atypical phenotypes."
    explanation: Supports variable expressivity and incomplete penetrance.
  - reference: PMID:39414990
    reference_title: "Two-hit mutation causes Wilms tumor in an individual with FBXW7-related neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant was derived from his apparently normal mother, and was also detected in his sister who exhibited developmental delay."
    explanation: Inheritance from an apparently unaffected parent.
  - reference: PMID:42111496
    reference_title: "FBXW7-Related Neurodevelopmental Disorder: Clinical Spectrum, Molecular Mechanisms, and Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although most variants appear to occur de novo, cases of parental mosaicism and mildly affected transmitting parents have also been reported"
    explanation: Parental mosaicism and mildly affected transmitting parents are the basis for parental testing.
animal_models:
- name: Nestin-Cre Fbxw7 conditional knockout mouse
  species: Mouse
  genotype: Nestin-Cre/Fbxw7(F/F) brain-specific homozygous deletion
  publication: PMID:21349854
  description: >-
    Brain-specific homozygous Fbxw7 deletion causes neonatal death with brain
    malformation, NOTCH accumulation in neural stem cells and an astrocytic
    differentiation bias.
  modeled_mechanisms:
  - target: NOTCH Accumulation in Neural Stem Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      The mouse is homozygous null in neural lineages, while patients are
      heterozygous. It shows the direction of the substrate defect but exaggerates
      its size and is lethal at birth.
    evidence:
    - reference: PMID:21349854
      reference_title: "Fbxw7-dependent degradation of Notch is required for control of \"stemness\" and neuronal-glial differentiation in neural stem cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The maintenance of neural stem cells was sustained in association with the accumulation of Notch1 and Notch3, as well as up-regulation of Notch target genes in the mutant mice."
      explanation: Model readout of NOTCH accumulation.
- name: Cerebellum-specific Fbxw7 conditional knockout mouse
  species: Mouse
  genotype: fbw7(deltaCb) cerebellar anlage-specific homozygous deletion
  publication: PMID:21827743
  description: >-
    Cerebellum-specific Fbxw7 deletion reduces cerebellar size and Purkinje cell
    number. Removing c-Jun or blocking its N-terminal phosphorylation rescues the
    Purkinje cell defect.
  modeled_mechanisms:
  - target: Impaired Cerebellar Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      Homozygous region-specific deletion rather than the patients' heterozygous
      constitutional loss. The mouse cerebellum is small, whereas the most
      frequent cerebellar finding in patients is enlargement, so the model
      captures the c-Jun-dependent mechanism but not the patient phenotype.
    evidence:
    - reference: PMID:21827743
      reference_title: "The F-box protein Fbw7 is required for cerebellar development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This resulted in decreased cerebellar size, reduced Purkinje cell number and defects in axonal arborisation."
      explanation: Model readout of impaired cerebellar development.

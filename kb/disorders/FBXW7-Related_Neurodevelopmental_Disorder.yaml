name: FBXW7-Related Neurodevelopmental Disorder
creation_date: "2026-10-17T00:58:01Z"
category: Mendelian
synonyms:
- developmental delay, hypotonia, and impaired language
- DEDHIL
- FBXW7-related neurodevelopmental syndrome
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous germline
  or constitutional mosaic FBXW7 variants (deletions, truncating, splice-site and
  WD40-domain missense variants). FBXW7 is the substrate-recognition subunit of
  the SCF(FBXW7) E3 ubiquitin ligase, which marks cyclin E, NOTCH, c-Jun, MYC and
  other phosphorylated regulators for proteasomal degradation. Affected
  individuals have global developmental delay, intellectual disability ranging
  from borderline to severe, language impairment, hypotonia, feeding and
  gastrointestinal problems, and variable structural brain anomalies of the
  corpus callosum, cerebellum and white matter. Expressivity is variable and
  penetrance incomplete. A small number of carriers have developed Wilms tumor
  through a somatic second hit on the other FBXW7 allele.
disease_term:
  preferred_term: developmental delay, hypotonia, and impaired language
  term:
    id: MONDO:0859280
    label: developmental delay, hypotonia, and impaired language
parents:
- Autosomal dominant intellectual disability

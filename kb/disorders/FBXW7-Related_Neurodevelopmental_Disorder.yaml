pathophysiology:
- name: FBXW7 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function FBXW7 variants, including whole-gene and
    regulatory-region copy number variants, nonsense, frameshift and splice-site
    variants, leave a single functional allele. Missense variants cluster at the
    substrate-binding surface of the WD40 propeller and are thought to act through
    loss of substrate recognition. Haploinsufficiency is the favored mechanism.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FBXW7
    term:
      id: hgnc:16712
      label: FBXW7
  molecular_functions:
  - preferred_term: SCF E3 ligase substrate recognition
    modifier: DECREASED
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
  evidence:
  - reference: PMID:42111496
    reference_title: "FBXW7-Related Neurodevelopmental Disorder: Clinical Spectrum, Molecular Mechanisms, and Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "F-box and WD repeat domain-containing 7 (FBXW7) encodes the substrate-recognition subunit of the SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase complex, where it regulates proteasome-mediated degradation of key cell cycle and developmental proteins."
    explanation: >-
      FBXW7 is the substrate adaptor of the SCF ligase; losing one allele
      reduces this adaptor activity.
  - reference: PMID:35395208
    reference_title: "Germline variants in tumor suppressor FBXW7 lead to impaired ubiquitination and a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used a genotype-first approach and global data-sharing platforms to identify 35 individuals harboring de novo and inherited FBXW7 germline monoallelic chromosomal deletions and nonsense, frameshift, splice-site, and missense variants associated with a neurodevelopmental syndrome."
    explanation: >-
      Founding cohort; the variant spectrum includes whole-gene deletions and
      truncating variants, consistent with loss of function of one allele.
  - reference: PMID:42111496
    reference_title: "FBXW7-Related Neurodevelopmental Disorder: Clinical Spectrum, Molecular Mechanisms, and Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Haploinsufficiency or loss of function is currently considered the most likely pathogenic mechanism"
    explanation: Review stating the field's current view of the disease mechanism.
  - reference: PMID:38780184
    reference_title: "Copy number variants at 4q31.3 affecting the regulatory region of FBXW7 associated with neurodevelopmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "We report two patients with a de novo deletion and a duplication in chromosome 4q31, potentially causing FBX-related neurodevelopmental syndrome by affecting the regulatory region of FBXW7."
    explanation: >-
      Regulatory-region copy number variants (one deletion, one duplication) that
      leave the FBXW7 coding sequence intact give an overlapping phenotype,
      implicating altered FBXW7 regulation. Expression was not measured.
  - reference: PMID:39123068
    reference_title: "Reciprocal chromosome translocation t(3;4)(q27;q31.2) with deletion of 3q27 and reduced FBXW7 expression in a patient with developmental delay, hypotonia, and seizures."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "FBXW7 expression in the immortalized lymphoblasts of the patient was reduced compared to that in controls."
    explanation: >-
      A balanced translocation near FBXW7 that disrupts no gene lowered FBXW7
      expression in a patient with overlapping features, again implicating reduced
      dosage.
  downstream:
  - target: Impaired SCF(FBXW7) Substrate Degradation
    causal_link_type: DIRECT
- name: Impaired SCF(FBXW7) Substrate Degradation
  description: >-
    Reduced FBXW7 activity slows ubiquitination and proteasomal turnover of its
    phosphodegron-bearing substrates. Patient missense variants expressed in
    cultured cells fail to clear cyclin E1 and cyclin E2.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: SCF-dependent proteasomal protein catabolism
    modifier: DECREASED
    term:
      id: GO:0031146
      label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  evidence:
  - reference: PMID:35395208
    reference_title: "Germline variants in tumor suppressor FBXW7 lead to impaired ubiquitination and a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of recombinant FBXW7 missense variants in cultured cells demonstrated impaired CYCLIN E1 and CYCLIN E2 turnover."
    explanation: Patient missense variants reduce degradation of a canonical FBXW7 substrate.
  - reference: PMID:35395208
    reference_title: "Germline variants in tumor suppressor FBXW7 lead to impaired ubiquitination and a neurodevelopmental syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "A crystal-structure model of FBXW7 predicted that missense variants were clustered at the substrate-binding surface of the WD40 domain and that these might reduce FBXW7 substrate binding affinity."
    explanation: Structural modeling places the missense variants at the substrate-binding surface.
  - reference: PMID:41685408
    reference_title: "Isolated absence epilepsy associated with a de novo FBXW7 missense variant in the F-box domain."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Structural modeling predicted significant impairment in protein-protein binding affinity, particularly with the SCF complex component SKP1, supporting a potentially disruptive effect of the p.(Arg309Pro) substitution on complex assembly."
    explanation: >-
      An F-box domain variant is predicted to impair SCF complex assembly through
      SKP1 binding rather than substrate recognition, a second route to the same
      loss of ligase activity.

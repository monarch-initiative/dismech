    evidence_source: MODEL_ORGANISM
    snippet: "Positional cloning revealed that the vu56 allele is a mutation of fbxw7, which encodes the substrate recognition component of a ubiquitin ligase that targets Notch and other proteins for degradation."
    explanation: The excess-OPC zebrafish mutant is an fbxw7 allele.
  - reference: PMID:22554084

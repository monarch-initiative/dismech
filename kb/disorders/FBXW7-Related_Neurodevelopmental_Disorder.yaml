  - target: Impaired Neuronal Function
- name: NOTCH Accumulation in Neural Stem Cells
  description: >-
    NOTCH1 and NOTCH3 are degraded by SCF(FBXW7). When Fbxw7 is deleted from the
    mouse brain, NOTCH proteins accumulate in neural stem cells and NOTCH target
    genes are upregulated, prolonging stem-cell maintenance.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  evidence:
  - reference: PMID:21349854
    reference_title: "Fbxw7-dependent degradation of Notch is required for control of \"stemness\" and neuronal-glial differentiation in neural stem cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The maintenance of neural stem cells was sustained in association with the accumulation of Notch1 and Notch3, as well as up-regulation of Notch target genes in the mutant mice."
    explanation: Brain-specific Fbxw7 deletion leads to NOTCH accumulation and pathway activation in neural stem cells.
  downstream:
  - target: Skewed Neural Stem Cell Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21349854
      reference_title: "Fbxw7-dependent degradation of Notch is required for control of \"stemness\" and neuronal-glial differentiation in neural stem cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the differentiation of neural progenitor cells was skewed toward astrocytes rather than neurons in vitro, with the latter effect being reversed by treatment of the cells with a pharmacological inhibitor of the Notch signaling pathway"
      explanation: >-
        Pharmacological Notch inhibition reverses the astrocytic skew, placing NOTCH
        accumulation causally upstream of the differentiation defect.
  - target: Excess Oligodendrocyte Progenitor Specification
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22554084
      reference_title: "Fbxw7 regulates Notch to control specification of neural precursors for oligodendrocyte fate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Notch signaling activity was elevated in spinal cord precursors of fbxw7 mutant zebrafish and inhibition of Notch signaling suppressed formation of excess OPCs."
      explanation: Notch inhibition suppresses the excess progenitors, placing NOTCH upstream.
- name: Excess Oligodendrocyte Progenitor Specification
  description: >-
    In fbxw7 mutant zebrafish, elevated Notch signaling makes spinal cord
    precursors produce too many oligodendrocyte progenitor cells. Whether this
    contributes to the white matter and myelination anomalies seen in patients has
    not been tested.
  biological_scale: CELLULAR
  cell_types:

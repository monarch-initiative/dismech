discussions:
- discussion_id: fbxw7_ndd_heterozygous_vs_null_models
  prompt: >-
    Do the NOTCH, c-Jun and oligodendrocyte-lineage defects seen when Fbxw7 is
    deleted from both alleles also occur, and matter, in the heterozygous human
    brain?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#NOTCH Accumulation in Neural Stem Cells
  - pathophysiology#c-Jun Accumulation in Cerebellum
  - pathophysiology#Impaired Cerebellar Development
  - pathophysiology#Excess Oligodendrocyte Progenitor Specification
  rationale: >-
    Patients carry one functional FBXW7 allele, while the mouse models that place
    NOTCH and c-Jun accumulation upstream of brain malformation delete both alleles
    in neural lineages and are lethal or grossly malformed. The zebrafish allele is
    also studied as a homozygous mutant. Human evidence for the substrate defect is
    limited to cyclin E turnover in transfected cells, so the downstream
    mechanisms are carried over from null models rather than shown at
    heterozygous dosage or in human neural tissue. For the cerebellum the two
    point in opposite directions: the cerebellum-specific knockout mouse has a
    small cerebellum, while the most frequent posterior fossa finding in patients
    is cerebellar enlargement.
  evidence:
  - reference: PMID:42111496
    reference_title: "FBXW7-Related Neurodevelopmental Disorder: Clinical Spectrum, Molecular Mechanisms, and Tumor Predisposition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In a detailed neuroimaging review of 10 MRI scans from seven individuals, cerebellar enlargement or borderline megacerebellum was the most frequent posterior fossa finding"
    explanation: Patient cerebellar finding is enlargement.
  - reference: PMID:21827743
    reference_title: "The F-box protein Fbw7 is required for cerebellar development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This resulted in decreased cerebellar size, reduced Purkinje cell number and defects in axonal arborisation."
    explanation: The mouse cerebellar finding is reduction, the opposite direction.
  - reference: PMID:21349854
    reference_title: "Fbxw7-dependent degradation of Notch is required for control of \"stemness\" and neuronal-glial differentiation in neural stem cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We now show that mice with brain-specific deletion of Fbxw7 (Nestin-Cre/Fbxw7(F/F) mice) die shortly after birth with morphological abnormalities of the brain and the absence of suckling behavior."
    explanation: The central mouse model is a homozygous neural deletion with a perinatal-lethal phenotype far more severe than the human disorder.
  proposed_experiments:
  - name: Patient iPSC neural organoids
    experiment_id: fbxw7_ndd_patient_ipsc_organoids
    description: >-
      Cortical and cerebellar organoids from patient iPSCs (truncating and WD40
      missense variants) and isogenic corrected controls, measuring NOTCH1,
      c-Jun and cyclin E protein levels and neuron/astrocyte/OPC output.
    would_support:
    - pathophysiology#NOTCH Accumulation in Neural Stem Cells
    - pathophysiology#c-Jun Accumulation in Cerebellum
    - pathophysiology#Excess Oligodendrocyte Progenitor Specification
notes: >-
  No GeneReviews chapter covers this disorder (PubMed search "FBXW7 AND
  genereviews[book]" returns only the general Wilms Tumor Predisposition
  chapter, whose abstract does not mention FBXW7).

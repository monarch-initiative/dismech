      explanation: Genetic rescue shows that phosphorylated c-Jun excess causes the Purkinje cell defect.
- name: Impaired Cerebellar Development
  description: >-
    Cerebellum-specific Fbxw7 knockout mice have a small cerebellum, fewer Purkinje
    cells with defective axonal arborization, supernumerary fissures and abnormal
    progenitor migration. Patients show the opposite direction: cerebellar
    enlargement is the most frequent posterior fossa finding on MRI (see the
    model-mismatch discussion), so this node is not linked to the patient
    imaging phenotypes.
  biological_scale: TISSUE

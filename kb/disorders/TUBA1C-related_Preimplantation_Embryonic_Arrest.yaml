discussions:
- discussion_id: tuba1c_heterozygous_contribution
  prompt: >-
    Do heterozygous TUBA1C variants cause or predispose to oocyte and embryo
    defects, or is disease limited to biallelic loss of function?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TUBA1C
  - inheritance#Autosomal recessive inheritance
  rationale: >-
    The founding report describes only homozygous truncating variants, but a
    dominant-model collapsing analysis of 3,627 women with oocyte or embryo
    defects found heterozygous TUBA1C variants enriched in cases and called
    TUBA1C a possible susceptibility gene. The heterozygous variants were not
    functionally tested in that study, and carrier phenotypes ranged from
    oocyte defects to abnormal fertilization and embryo arrest. Segregation
    data and functional assays of the heterozygous variants would decide
    whether the entry needs a dominant or susceptibility inheritance block.
  evidence:
  - reference: PMID:41005306
    reference_title: Genetic landscape of human oocyte/embryo defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a total of 19 heterozygous variants in TUBA1C were strongly enriched with
      the highest contribution rate (0.63%, 19/3,627) in the case cohort
    explanation: Burden-test enrichment of heterozygous TUBA1C variants.
  - reference: PMID:41005306
    reference_title: Genetic landscape of human oocyte/embryo defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results indicate that TUBA1C might be a potential susceptibility
      gene associated with oocyte/embryo defects.
    explanation: The authors frame the heterozygous signal as susceptibility, not causation.
  - reference: PMID:41005306
    reference_title: Genetic landscape of human oocyte/embryo defects.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      may impair oocyte spindle assembly and therefore lead to various
      phenotypes including oocyte defects, abnormal fertilization, and
      embryonic arrest
    explanation: >-
      The subject of the sentence is heterozygous TUBA1C variants. The authors
      propose a spindle mechanism and a range of carrier phenotypes; the
      mechanism is stated as a possibility, not measured.
- discussion_id: tuba1c_oocyte_versus_embryo_division
  prompt: >-
    Does TUBA1C loss arrest embryos by disrupting the oocyte meiotic spindle,
    as for TUBB8, or the mitotic spindles of the cleaving embryo?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Defective Spindle Assembly
  - phenotypes#Embryo Developmental Arrest
  rationale: >-
    TUBB8 variants cause oocyte meiotic arrest and embryo arrest through
    spindle defects, and the burden-test study proposes an oocyte spindle
    mechanism for TUBA1C, but the TUBA1C probands present with embryo arrest
    rather than oocyte maturation arrest, and spindle morphology has not been
    examined in patient oocytes or embryos. Imaging of meiotic spindles in
    patient oocytes, or of mitotic spindles in arrested embryos, would locate
    the failing division.
  evidence:
  - reference: PMID:39209701
    reference_title: Biallelic variants in α-tubulin isotypes cause female infertility characterised as recurrent preimplantation embryo arrest.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants of the β-tubulin subunit gene, TUBB8, cause oocyte meiotic
      arrest and RPEA through a broad spectrum of spindle defects.
    explanation: The beta-tubulin precedent that frames the open question.

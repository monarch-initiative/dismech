pathophysiology:
- name: Biallelic TUBA1C Truncating Variants
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >-
    Homozygous nonsense (p.Gln358Ter) and frameshift (p.Asp444Metfs*42)
    variants truncate or alter the C-terminal part of tubulin alpha-1C.
    TUBA1C is an alpha-tubulin isotype expressed during oogenesis and early
    embryogenesis, where it contributes to the microtubule network alongside
    other tubulins such as TUBB8. The variants are treated as loss of function;
    whether p.Gln358Ter transcripts undergo nonsense-mediated decay is not
    stated in the abstract.
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      One nonsense and one frameshift variant, each homozygous in one proband.

name: TUBA1C-related Preimplantation Embryonic Arrest
creation_date: "2026-10-25T06:00:00Z"
category: Mendelian
disease_term:
  preferred_term: oocyte/zygote/embryo maturation arrest 24
  term:
    id: MONDO:0979232
    label: oocyte/zygote/embryo maturation arrest 24
synonyms:
- oocyte/zygote/embryo maturation arrest 24
- OZEMA24
- TUBA1C-related recurrent preimplantation embryo arrest
description: >-
  TUBA1C-related preimplantation embryonic arrest (oocyte/zygote/embryo
  maturation arrest 24) is an autosomal-recessive form of primary female
  infertility caused by biallelic loss-of-function variants in TUBA1C, which
  encodes tubulin alpha-1C, an alpha-tubulin isotype that forms microtubules
  with beta-tubulin. Affected women present with recurrent preimplantation
  embryo arrest: in repeated IVF/ICSI cycles their embryos stop developing
  before the blastocyst stage. The two reported variants are a nonsense
  variant and a frameshift, each homozygous, and in vitro they impair spindle
  assembly. The disorder is the alpha-tubulin counterpart of TUBB8-related
  oocyte maturation defect, in which variants in the oocyte-specific
  beta-tubulin cause spindle defects, oocyte meiotic arrest and embryo arrest.
  The entity rests on two probands from a single cohort. A separate large
  exome study found heterozygous TUBA1C variants enriched among women with
  oocyte or embryo defects, but whether one allele is enough to cause disease
  is not established. No treatment has been reported.
parents:
- hereditary disease
- female reproductive system disease
notes: >-
  No GeneReviews chapter covers this disorder. MONDO cross-references
  OMIM:621232. A PubMed search for "TUBA1C AND (oocyte OR zygote OR embryo OR
  infertility)" (2026-10-25) returned nine records, and the founding cohort
  (PMID:39209701) is the only one reporting affected women; the others mention
  TUBA1C only in transcriptomic or proteomic lists. A Europe PMC search with
  the same terms added the burden-test study PMID:41005306. A search for
  "(Tuba1c OR TUBA1C) AND (knockout OR mice OR meiosis OR spindle)" returned no
  published Tuba1c animal model. An OpenScientist deep-research report
  (research/) found no further TUBA1C patient report or functional study. It
  states that the IMPC Tuba1c knockout mouse is viable without an infertility
  phenotype, which would be a human-model mismatch; the IMPC record itself was
  not retrieved, so no animal model or discussion records it. The
  donor-oocyte management it
  describes is evidenced only for TUBB8 and KIF11, so no treatment is recorded.
  Only the abstract of PMID:39209701 is available here, so
  the in vitro system used for the spindle assays, the arrest stage, and the
  clinical details of the two TUBA1C probands are not recorded. The same study
  reports homozygous TUBA4A variants in two further women; TUBA4A-related
  embryo arrest is a separate gene-defined disorder and is not covered here.

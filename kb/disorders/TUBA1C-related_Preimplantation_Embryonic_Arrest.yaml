  downstream:
  - target: Defective Spindle Assembly
    description: >-
      Loss of an alpha-tubulin isotype impairs assembly of the microtubule
      spindle.
- name: Defective Spindle Assembly
  biological_scale: CELLULAR
  description: >-
    The TUBA1C variants (together with the TUBA4A variants reported alongside
    them) cause spindle assembly defects of varying severity in in vitro
    functional assays. The abstract does not say whether the assays were done
    in oocytes, embryos, or cultured cells, so the node is not restricted to
    meiotic or mitotic spindles, and no spindle phenotype has been examined in
    patient oocytes or embryos. No cell type is bound for the same reason.
  biological_processes:
  - preferred_term: spindle assembly
    term:
      id: GO:0051225
      label: spindle assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:39209701
    reference_title: Biallelic variants in α-tubulin isotypes cause female infertility characterised as recurrent preimplantation embryo arrest.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These variants cause varying degrees of spindle assembly defects.
    explanation: >-
      In vitro spindle assembly defects; the statement covers all four
      alpha-tubulin variants, including the two in TUBA1C.
  downstream:
  - target: Embryo Developmental Arrest
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Faulty spindles are expected to disturb chromosome segregation in the
      oocyte or early embryo, but which division fails and how this produces
      arrest before the blastocyst stage has not been shown.

    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rocky Mountain spotted fever (RMSF) is a life-threatening disease caused by
      Rickettsia rickettsii, an obligately intracellular bacterium that is spread to
      human beings by ticks.
    explanation: >-
      Names the causative species and the tick route for this member. Evidence source
      is OTHER as this is a review article.
  - reference: PMID:28169507
    reference_title: Predictive Factors for Fatal Tick-Borne Spotted Fever in Brazil.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In Brazil, two pathogenic Rickettsia species have been identified causing
      tick-borne spotted fever (SF).
    explanation: >-

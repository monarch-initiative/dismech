transmission:
- name: Tick bite inoculation
  description: >-
    For every member of the group except rickettsialpox, the organism is inoculated by
    a feeding ixodid tick. Which tick genus is involved varies by rickettsial species
    and therefore by geography — Dermacentor and Rhipicephalus for R. rickettsii,
    Rhipicephalus sanguineus for R. conorii, Amblyomma for R. africae, Ixodes for R.
    australis — but the route is common to the group, and most patients cannot recall
    the bite.
  evidence:
  - reference: PMID:24092850
    reference_title: "Update on tick-borne rickettsioses around the world: a geographic approach."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Tick-borne rickettsioses are caused by obligate intracellular bacteria belonging
      to the spotted fever group of the genus Rickettsia.
    explanation: >-
      Establishes the tick route as definitional for the group. Evidence source is
      OTHER as this is a review article.
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Only a minority of infected travellers can recall a preceding tick bite.
    explanation: >-
      A group-level observation with direct diagnostic consequence: an absent bite
      history does not argue against the diagnosis. Evidence source is OTHER as this is
      a literature-based review.
- name: Mite bite inoculation (rickettsialpox)
  description: >-
    Rickettsialpox is the exception to the tick route: R. akari is transmitted by the
    house mouse mite Liponyssoides sanguineus in an urban rodent cycle. This is the
    reason the group cannot be defined by its arthropod vector.
  evidence:
  - reference: PMID:28846279
    reference_title: Rickettsia akari (Rickettsialpox).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      R. akari is transmitted by the house mouse mite, Liponyssoides sanguineus.
    explanation: >-
      Names the mite vector for the one non-tick-borne member listed here. Evidence
      source is OTHER as this is a reference-text chapter.

pathophysiology:
- name: Arthropod Inoculation of a Spotted Fever Group Rickettsia
  biological_scale: ORGANISM
  role: trigger
  description: >-
    A feeding tick — or, for rickettsialpox, a mite — deposits SFG rickettsiae in the
    dermis at the attachment site. In most members of the group this produces a local
    dermal lesion that necroses into an inoculation eschar; the resulting fever, rash
    and eschar triad is what makes the group clinically recognisable. The vector genus
    and the incubation period are member-specific and are curated on the member
    entries.
  evidence:
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most patients present with a mild-to-moderately severe flu-like illness typically
      accompanied by a cutaneous rash and an inoculation eschar at the site of the tick
      bite, but potentially life-threatening disease with disseminated vaculitis is
      occasionally seen.
    explanation: >-
      States the shared presentation of the group in one sentence — the triad plus the
      severe vasculitic tail — and locates the eschar at the inoculation site. Evidence
      source is OTHER as this is a literature-based review.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and
      Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike some SFG rickettsioses, an inoculation eschar is rarely present with RMSF
    explanation: >-
      Bounds the triad claim: the eschar is characteristic of the group but is
      conspicuously absent in its most dangerous member, so its absence cannot be used
      to exclude the diagnosis. Evidence source is OTHER as this is a national
      recommendations report.
  downstream:
  - target: Obligate Intracytosolic Infection of Microvascular Endothelium
    description: >-
      Inoculated organisms disseminate haematogenously and enter endothelial cells,
      the group's shared target cell.
    causal_link_type: DIRECT

- name: Obligate Intracytosolic Infection of Microvascular Endothelium
  biological_scale: CELLULAR
  role: effector
  description: >-
    The mechanistic core shared by every member of the group. SFG rickettsiae adhere
    to and induce their own uptake by microvascular endothelial cells, escape the
    phagosome into the cytosol, and replicate free in the cytoplasm, exploiting host
    actin for both entry and intracellular movement. This node is the group-level
    statement of endothelial tropism only; the receptor-ligand detail, the
    actin-based motility machinery and the VE-cadherin biology are not re-derived here
    and are curated in `Rocky_Mountain_Spotted_Fever.yaml`.
  cell_types:
  - preferred_term: microvascular endothelial cell
    term:
      id: CL:2000008
      label: microvascular endothelial cell
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
    modifier: INCREASED
  evidence:
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an
      Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Obligately intracytosolic rickettsiae that cycle between arthropod and vertebrate
      hosts cause human diseases with a spectrum of severity, primarily by targeting
      microvascular endothelial cells, resulting in endothelial dysfunction.
    explanation: >-
      The definitive statement of the group-level mechanism: intracytosolic lifestyle,
      microvascular endothelial target, endothelial dysfunction as the outcome — and
      explicitly across a spectrum of severity. Evidence source is OTHER as this is a
      review article.
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an
      Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Rickettsiae interact with host cell actin to effect both cellular entry and
      intracellular actin-based mobility.
    explanation: >-
      Supports the entry-and-spread step of this node. Evidence source is OTHER as this
      is a review article.
  - reference: PMID:26394396
    reference_title: >-
      Rickettsia massiliae and Rickettsia conorii Israeli Spotted Fever Strain
      Differentially Regulate Endothelial Cell Responses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Rickettsiae primarily target microvascular endothelial cells.
    explanation: >-
      Independent confirmation of the target cell type from an experimental study
      comparing two SFG species in human endothelial monolayers.
  downstream:
  - target: Species-Graded Endothelial Inflammatory Response
    description: >-
      Infected endothelium mounts a cytokine, chemokine and adhesion-molecule response
      whose magnitude differs sharply between SFG species.
    causal_link_type: DIRECT
  - target: Disseminated Small-Vessel Vasculitis and Increased Vascular Permeability
    description: >-
      Multifocal infection of the microvasculature produces a disseminated vasculitis
      with barrier failure.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

- name: Species-Graded Endothelial Inflammatory Response
  biological_scale: CELLULAR
  role: modifier
  description: >-
    The node that only a root entry can carry, because it is a statement about the
    differences between members rather than about any one of them. Members of the
    group share a target cell and a route of infection but differ by orders of
    magnitude in severity, from self-limiting African tick-bite fever to frequently
    fatal Rocky Mountain spotted fever. That gradient tracks how strongly the
    particular species drives interleukin-8 and adhesion-molecule expression in
    endothelium and how much endothelial barrier failure and cell death follow: R.
    conorii elicits a markedly stronger response in vitro and in patients than R.
    africae does, and the Israeli spotted fever strain of R. conorii collapses
    endothelial monolayer resistance where the mild pathogen R. massiliae does not.
  cell_types:
  - preferred_term: microvascular endothelial cell
    term:
      id: CL:2000008
      label: microvascular endothelial cell
  biological_processes:
  - preferred_term: interleukin-8 production
    term:
      id: GO:0032637
      label: interleukin-8 production
    modifier: INCREASED
  - preferred_term: leukocyte adhesion to vascular endothelial cell
    term:
      id: GO:0061756
      label: leukocyte adhesion to vascular endothelial cell
    modifier: INCREASED
  evidence:
  - reference: PMID:19091423
    reference_title: >-
      Relative chemokine and adhesion molecule expression in Mediterranean spotted
      fever and African tick bite fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings suggest a superior inflammatory potential of R. conorii as compared
      to R. africae in endothelial cells, potentially related to the more severe
      inflammation in MSF comparing ATBF.
    explanation: >-
      Directly links a species difference in endothelial inflammatory potential to the
      clinical severity difference between two members of the group, using paired in
      vitro and patient-serum measurements.
  - reference: PMID:19091423
    reference_title: >-
      Relative chemokine and adhesion molecule expression in Mediterranean spotted
      fever and African tick bite fever.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R. conorii induced a marked increase in MCP-1, IL-8, and adhesion molecules in
      endothelial cells, involving toll-like receptor 4 activation.
    explanation: >-
      Gives the specific mediators behind this node, supporting the IL-8 and
      leukocyte-adhesion process annotations.
  - reference: PMID:26394396
    reference_title: >-
      Rickettsia massiliae and Rickettsia conorii Israeli Spotted Fever Strain
      Differentially Regulate Endothelial Cell Responses.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Monolayers of endothelial cells infected with R. conorii (ISF) showed a
      statistically significant decrease in electrical resistance across the monolayer
      compared to both R. massiliae-infected and uninfected cells at 72 HPI, suggesting
      increased endothelial permeability.
    explanation: >-
      A second, independent species pair showing the same pattern — a virulent SFG
      species disrupts the endothelial barrier where a mild one does not — measured as
      transendothelial electrical resistance.
  downstream:
  - target: Disseminated Small-Vessel Vasculitis and Increased Vascular Permeability
    description: >-
      The strength of the endothelial inflammatory and barrier response sets how far
      the vasculitic lesion progresses in a given member of the group.
    causal_link_type: DIRECT

- name: Disseminated Small-Vessel Vasculitis and Increased Vascular Permeability
  biological_scale: TISSUE
  role: effector
  description: >-
    Multifocal endothelial infection and injury produce a disseminated small-vessel
    vasculitis with perivascular mononuclear infiltration and loss of endothelial
    barrier integrity. This is the single lesion that explains the group's rash, and
    at its severe end the oedema of the lungs and brain. The downstream haemostatic
    detail — platelet consumption, fibrin thrombi, disseminated intravascular
    coagulation — is member-specific and is curated in
    `Rocky_Mountain_Spotted_Fever.yaml` rather than repeated here.
  cell_types:
  - preferred_term: blood vessel endothelial cell
    term:
      id: CL:0000071
      label: blood vessel endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: positive regulation of vascular permeability
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most patients present with a mild-to-moderately severe flu-like illness typically
      accompanied by a cutaneous rash and an inoculation eschar at the site of the tick
      bite, but potentially life-threatening disease with disseminated vaculitis is
      occasionally seen.
    explanation: >-
      Names disseminated vasculitis as the lesion of severe disease across the group.
      Evidence source is OTHER as this is a literature-based review.
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an
      Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Obligately intracytosolic rickettsiae that cycle between arthropod and vertebrate
      hosts cause human diseases with a spectrum of severity, primarily by targeting
      microvascular endothelial cells, resulting in endothelial dysfunction.
    explanation: >-
      Endothelial dysfunction is stated as the common outcome of infection across the
      group, which is the barrier-failure half of this node. Evidence source is OTHER
      as this is a review article.
  downstream:
  - target: Severe End-Organ Involvement of the Lung and Brain
    description: >-
      Where permeability failure is extensive, plasma leaks into the pulmonary
      interstitium and the brain.
    causal_link_type: DIRECT

- name: Severe End-Organ Involvement of the Lung and Brain
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The severe tail of the group. Vascular leak in the pulmonary microcirculation
    produces non-cardiogenic pulmonary oedema and respiratory failure; in the central
    nervous system it produces meningoencephalitis with seizures and coma. These two
    are the proximate causes of death across the group, and in a large Brazilian
    case-control series seizures and coma were the strongest predictors of a fatal
    outcome. Which members reach this node, and how often, differs by species — that
    dependency is the point of the `Species-Graded Endothelial Inflammatory Response`
    node above.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: positive regulation of vascular permeability
    term:
      id: GO:0043117
      label: positive regulation of vascular permeability
    modifier: INCREASED
  evidence:
  - reference: PMID:28169507
    reference_title: Predictive Factors for Fatal Tick-Borne Spotted Fever in Brazil.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      seizures (OR, 11.24; 95% CI, 6.49-19.45) and coma (OR of 15.16; 95% CI,
      8.51-27.02)
    explanation: >-
      Quantifies the neurological arm of this node as the strongest predictor of death
      in a 386-case, 415-control series of tick-borne spotted fever.
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Most patients present with a mild-to-moderately severe flu-like illness typically
      accompanied by a cutaneous rash and an inoculation eschar at the site of the tick
      bite, but potentially life-threatening disease with disseminated vaculitis is
      occasionally seen.
    explanation: >-
      Establishes that a life-threatening vasculitic course occurs across the group but
      is the exception rather than the rule. Recorded as PARTIAL because it does not
      name the specific pulmonary and neurological end-organs. Evidence source is OTHER
      as this is a literature-based review.
  notes: >-
    Non-cardiogenic pulmonary oedema is named in the description because it is the
    standard characterisation of the severe pulmonary lesion in this group, but no
    cited abstract in this entry states it in those words, so no evidence item claims
    it. The evidenced content of this node is the neurological arm plus the
    group-level statement that a life-threatening vasculitic course occurs. The
    pulmonary arm is curated with its own evidence on
    `Rocky_Mountain_Spotted_Fever.yaml`.

- name: Rickettsial Ribosomal Translation (Doxycycline Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    Every member of the group depends on its own 70S ribosome for protein synthesis,
    and that ribosome — not a cell-wall target — is what doxycycline inhibits. The
    molecular mechanism is held once in the
    `bacterial_protein_synthesis_inhibition` module and is not re-derived here; this
    node exists so the group-level doxycycline recommendation has a mechanism node to
    point at.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Establishes the bacterial ribosome as the target of the tetracyclines and the
      other protein-synthesis inhibitors — the molecular step this node represents. The
      same reference anchors the equivalent node in `Rocky_Mountain_Spotted_Fever.yaml`
      and `Murine_Typhus.yaml`. Evidence source is OTHER as this is a review article.
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Doxycycline is the recommended treatment for tick-borne rickettsioses and
      prevention is based on personal protective measures against tick bites when
      travelling in endemic areas.
    explanation: >-
      Establishes at group level that a tetracycline — a ribosome-targeting agent — is
      the recommended therapy, which is the clinical fact this target node underwrites.
      Evidence source is OTHER as this is a literature-based review.

- name: Obligate Intracytosolic Niche (Cell-Penetrant Drug Requirement)
  biological_scale: CELLULAR
  role: intrinsic_resistance
  conforms_to: "intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials"
  description: >-
    Because SFG rickettsiae replicate free in the host cell cytosol, effective therapy
    is restricted to agents that accumulate intracellularly. Doxycycline does;
    beta-lactams do not reach the organism whatever their in vitro activity. This is
    the pharmacokinetic gate that, together with the ribosomal target above, makes
    doxycycline first-line for every member of the group regardless of species or
    geography. The gating principle itself is held once in the
    `intracellular_pathogen_persistence` module.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:30148688
    reference_title: >-
      Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an
      Endotheliotropic Infection.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Obligately intracytosolic rickettsiae that cycle between arthropod and vertebrate
      hosts cause human diseases with a spectrum of severity, primarily by targeting
      microvascular endothelial cells, resulting in endothelial dysfunction.
    explanation: >-
      Establishes the obligately intracytosolic lifestyle that creates the penetration
      constraint this node represents. Evidence source is OTHER as this is a review
      article.
  - reference: PMID:18611821
    reference_title: Intracellular organisms.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The intracellular location of some microorganisms allow them to resist antibiotics
      with poor ability to penetrate eukaryotic cell membranes, such as the beta-lactam
      compounds.
    explanation: >-
      The exclusion half of the gating principle: the intracellular niche confers
      resistance to poorly cell-penetrant agents such as the beta-lactams. This is the
      same anchor the `intracellular_pathogen_persistence` module uses. Evidence source
      is OTHER as this is a review article.
  - reference: PMID:28639230
    reference_title: >-
      Intracellular Pharmacokinetics of Antibacterials and Their Clinical Implications.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Therapeutic efficacy against intracellular pathogens has been correlated mainly
      with the intracellular concentrations achieved by the different antimicrobial
      agents.
    explanation: >-
      The requirement half of the gating principle, and the evidence the module node
      this entry conforms to is itself built on: efficacy tracks the intracellular
      concentration achieved, not the in vitro MIC. Evidence source is OTHER as this is
      a review article.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and
      Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Doxycycline is the drug of choice for treatment of all tickborne rickettsial
      diseases in patients of all ages, including children aged <8 years
    explanation: >-
      The clinical corollary of the penetration constraint: one cell-penetrant agent is
      recommended across the whole group. Evidence source is OTHER as this is a
      national recommendations report.

phenotypes:
- category: Infectious
  name: Fever
  description: >-
    Fever is present in essentially every member of the group and is the presenting
    complaint. Per-member frequency figures are curated on the member entries.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:12766836
    reference_title: African tick bite fever in travelers to rural sub-Equatorial Africa.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 80% of the patients had fever, headache, and/or myalgia, whereas
      specific clinical features such as inoculation eschars, lymphadenitis, cutaneous
      rash, and aphthous stomatitis were seen in < or = 50% of patients.
    explanation: >-
      Establishes that fever belongs to the dominant early symptom complex, but supports
      the phenotype only PARTIALLY and supports no frequency band. The reported ">80%"
      is a disjunction — it counts patients with fever, headache and/or myalgia, so it
      cannot be distributed across its three disjuncts to give a rate for fever alone.
      The denominator is also a single member (n=38 African tick-bite fever patients,
      the mildest member of the group) rather than the group. `frequency` is therefore
      omitted, on the same grounds as for rash and eschar below, which are bounded by
      the second half of this same sentence.

- category: Dermatological
  name: Skin rash
  description: >-
    A cutaneous eruption — usually maculopapular, sometimes petechial or (in
    rickettsialpox) papulovesicular — is the feature that gives the group its name. Its

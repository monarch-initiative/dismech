name: Spotted fever rickettsiosis
creation_date: '2026-08-19T00:00:00Z'
category: Infectious Disease
description: >
  Spotted fever rickettsiosis is the group of acute febrile illnesses caused by the
  spotted fever group (SFG) of the genus Rickettsia — obligately intracytosolic,
  Gram-negative bacteria acquired from a feeding tick (or, for rickettsialpox, a
  mite). Whatever the species, the mechanism is the same: the organism is inoculated
  at the arthropod attachment site, disseminates haematogenously, and replicates
  inside microvascular endothelial cells, producing a disseminated small-vessel
  vasculitis with increased vascular permeability. That single lesion accounts for
  the group's shared clinical signature — fever, headache and myalgia, a
  centrifugally or centripetally spreading rash, and (in most members, though
  notably not in Rocky Mountain spotted fever) an inoculation eschar at the bite
  site — and, at the severe end, for non-cardiogenic pulmonary oedema and
  encephalitis. Members differ enormously in severity, from the self-limiting
  African tick-bite fever to the frequently fatal Rocky Mountain spotted fever, and
  that gradient tracks the species-specific inflammatory response the organism
  provokes in endothelium rather than any difference in the route of infection.

  This root entry is deliberately thin. It carries only what is defined over the
  group as a whole: the SFG taxon itself and the species-versus-geography naming
  problem, the shared eschar/fever/rash triad and how eschar frequency varies by
  species, the group-level serologic cross-reactivity that makes species-level
  diagnosis hard, the shared doxycycline-first-line logic including its paediatric
  arm, and the SFG-versus-typhus-group boundary. Per-member pathophysiology,
  epidemiology, phenotype frequencies and treatment detail live in the individual
  entries — `Rocky_Mountain_Spotted_Fever.yaml` and `Boutonneuse_Fever.yaml` are
  curated in full — and the antimicrobial mechanism is held once in
  `kb/modules/bacterial_protein_synthesis_inhibition.yaml` and
  `kb/modules/intracellular_pathogen_persistence.yaml`.

- name: MSF
  display_name: Mediterranean spotted fever / boutonneuse fever (Rickettsia conorii)
  classification: etiologic_species
  geography:
  - Mediterranean basin
  - Southern Europe
  - North Africa
  - Sub-Saharan Africa
  - Middle East
  - India
  description: >-
    Caused by Rickettsia conorii and transmitted by the brown dog tick Rhipicephalus
    sanguineus; the inoculation eschar is the classic tache noire. This member is the
    clearest illustration of why the primary axis is the species and not the place:
    one species carries four geographically named diseases — Mediterranean spotted
    fever (subsp. conorii), Indian tick typhus (subsp. indica), Israeli spotted fever
    (subsp. israelensis) and Astrakhan fever (subsp. caspia). Curated in full in

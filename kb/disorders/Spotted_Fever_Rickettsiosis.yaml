    evidence_source: OTHER
    snippet: >-
      Rickettsiae closely related to the Malish strain, the reference Rickettsia conorii
      strain, include Indian tick typhus rickettsia (ITTR), Israeli spotted fever
      rickettsia (ISFR), and Astrakhan fever rickettsia (AFR).
    explanation: >-
      Enumerates the four geographically named diseases that a single species accounts
      for, which is the evidence behind treating species as the primary subtype axis.
- name: ATBF
  display_name: African tick-bite fever (Rickettsia africae)
  classification: etiologic_species
  geography:
  - Sub-Saharan Africa
  - Eastern Caribbean
  description: >-
    Caused by Rickettsia africae and transmitted by Amblyomma ticks. The mildest
    commonly encountered member: a self-limiting flu-like illness in which fever,
    headache and myalgia are near-universal but the specific features — inoculation
    eschars (often multiple), lymphadenitis and rash — are present in only about half
    of patients. The commonest tick-borne rickettsiosis in returning travellers. No
    standalone dismech entry yet.
  subtype_term:
    preferred_term: African tick-bite fever
    term:
      id: MONDO:0000227
      label: African tick-bite fever
  evidence:
  - reference: PMID:12766836
    reference_title: African tick bite fever in travelers to rural sub-Equatorial Africa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 80% of the patients had fever, headache, and/or myalgia, whereas
      specific clinical features such as inoculation eschars, lymphadenitis, cutaneous
      rash, and aphthous stomatitis were seen in < or = 50% of patients.
    explanation: >-
      A prospective cohort of 940 travellers quantifying the ATBF presentation, and
      showing that the eschar is not a constant feature even in a member of the group
      in which it is characteristic.
  - reference: PMID:19091423
    reference_title: >-
      Relative chemokine and adhesion molecule expression in Mediterranean spotted
      fever and African tick bite fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mediterranean spotted fever (MSF) caused by Rickettsia conorii (R. conorii) is a
      potential lethal disease while African tick bite fever (ATBF) caused by
      Rickettsia africae is a self-limiting flu-like illness.
    explanation: >-
      States the severity contrast between two members of the same group, which is what
      makes species rather than geography the discriminating axis.
- name: Rickettsialpox
  display_name: Rickettsialpox (Rickettsia akari)
  classification: etiologic_species
  geography:
  - United States
  - Ukraine
  - Croatia
  - Turkey
  - Republic of Korea
  description: >-
    Caused by Rickettsia akari, and the one member of this list that is not
    tick-borne: it is transmitted by the house mouse mite Liponyssoides sanguineus in
    an urban rodent cycle. An eschar at the mite bite is followed by a papulovesicular
    rash. Its inclusion is deliberate and is what fixes the group's unifying criterion
    as the rickettsial clade rather than the arthropod vector; see the
    `sfr_group_boundary_and_naming_traps` discussion, which also records that R. akari
    has since been reassigned to the transitional group. No standalone dismech entry
    yet.
  subtype_term:
    preferred_term: rickettsialpox
    term:
      id: MONDO:0019360
      label: rickettsialpox
  evidence:
  - reference: PMID:12860597
    reference_title: "Rickettsialpox in New York City: a persistent urban zoonosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IHC staining of biopsy specimens of eschars and papular lesions were positive for
      spotted fever group rickettsiae for 32 patients.
    explanation: >-
      Confirmed rickettsialpox cases staining positive for spotted fever group
      rickettsiae — the serologic and immunohistochemical basis on which the disease is
      classified with this group.
  - reference: PMID:28846279
    reference_title: Rickettsia akari (Rickettsialpox).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      R. akari is transmitted by the house mouse mite, Liponyssoides sanguineus.
    explanation: >-
      States the mite (not tick) vector, the fact that prevents the group from being
      defined by its arthropod. Evidence source is OTHER as this is a reference-text
      chapter rather than a primary study.

discussions:
- discussion_id: sfr_root_disease_vs_grouping
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should spotted fever (MONDO:0001195) be modelled as a root `Disease` with
    `has_subtypes`, or as a `Grouping` over the member entries in `kb/groupings/`?
  rationale: >-
    Resolved in favour of a root `Disease` with `has_subtypes`, on three grounds, the
    second of which is decisive on its own. First, tooling: `build_coverage_index()` in
    `src/dismech/compare/mondo_priority.py` calls `iter_disease_files()`, which globs
    `*.yaml` under the `--kb-dir` default of `kb/disorders` and never reads
    `kb/groupings/`. A `Grouping` alone would leave MONDO:0001195 permanently on the
    MONDO curation queue no matter how well curated it was. This was verified by reading
    `mondo_priority.py`, `compare/support.py` and the `--kb-dir` default in
    `priority_dashboard.py`, not assumed from the thanatophoric-dysplasia precedent.
    Second, and specific to this case:
    `tests/test_data.py::test_grouping_member_foreign_keys` requires every
    `members[].member` of a Grouping to resolve to a real `Disease.name`, module stem or
    grouping name. Only two of the six members curated here — Rocky Mountain spotted
    fever and boutonneuse fever — have standalone `kb/disorders/` entries; African
    tick-bite fever, rickettsialpox, Queensland tick typhus and North Asian tick typhus
    do not. A Grouping could therefore not list four of its six members at all, whereas
    `has_subtypes` carries them with their MONDO bindings and their evidence today and
    loses nothing when they are later promoted to standalone entries. Third, substance:
    several claims here are defined over the union and have no home on any member — the
    SFG taxon itself (NCBITaxon:114277), the group-versus-species resolution limit of
    rickettsial serology (PMID:27172113, PMID:10497980), the species-graded severity
    gradient (PMID:19091423, PMID:26394396), and the single all-ages doxycycline rule
    that is applied before the species is known (PMID:27172113). Note this differs from
    the thanatophoric-dysplasia case in one respect worth recording: there, a
    pre-existing grouping (`FGFR_Related_Skeletal_Dysplasias`) already unioned the
    members, so a second grouping would have been redundant. Here there is no rickettsial
    grouping at all, so the redundancy argument does not apply — the case rests on the
    coverage-index and foreign-key arguments instead. The counter-argument, that a
    Disease root duplicates content already held in the two curated member entries, is
    addressed by keeping this root deliberately thin: seven pathophysiology nodes, two of
    which are module `conforms_to` anchors, and explicit "not re-derived here" pointers
    on the nodes that the member entries carry in depth.
  resolution_note: >-
    Curated as a root `Disease` (this entry). No grouping was created. If African
    tick-bite fever, rickettsialpox, Queensland tick typhus and North Asian tick typhus
    are later curated as standalone entries, a `Grouping` over the six becomes viable
    and could be added alongside this root — it would then carry the auditable
    membership criteria that `has_subtypes` cannot express — but it would still not
    retire MONDO:0001195 from the priority queue, so this entry would remain.
  posed_by: dismech curation (issue #8890)
  posed_date: '2026-08-19T00:00:00Z'
  resolved_date: '2026-08-19T00:00:00Z'

- discussion_id: sfr_subtype_axis_species_not_geography
  kind: INTERPRETATION
  status: RESOLVED
  prompt: >-
    Should the subtypes of this group be organised by causative Rickettsia species or by
    geography? The two largely co-vary, and MONDO's own children mix both conventions
    (Japanese spotted fever and African tick-bite fever are geographic labels;
    Rickettsia parkeri spotted fever is a species label).
  attaches_to:
  - pathophysiology#Species-Graded Endothelial Inflammatory Response
  rationale: >-
    Resolved in favour of the species. Geography is a downstream label set by the range
    of the vector tick, and it fails as an identity criterion in both directions. It is
    not one-to-one downward: a single species, R. conorii, carries four distinct
    geographically named diseases — Mediterranean spotted fever, Indian tick typhus,
    Israeli spotted fever and Astrakhan fever — which are genotypically homogeneous but
    serotypically and epidemio-clinically distinct (PMID:15766388). And it is not
    one-to-one upward: a single species, R. rickettsii, causes Rocky Mountain spotted
    fever in North America and Brazilian spotted fever in South America (PMID:28169507),
    so the geographic name changes while the organism does not. The species axis also
    tracks the thing that actually matters clinically. Severity across this group spans
    from self-limiting to frequently fatal, and that gradient follows the
    species-specific endothelial inflammatory response (PMID:19091423, PMID:26394396)
    rather than the latitude at which the tick bit. Geography is retained, but as the
    secondary descriptor it is: each `has_subtypes` entry carries a `geography` list
    alongside its species-named `display_name`.
  resolution_note: >-
    Subtypes are keyed on the causative species, with `geography` recorded per subtype.
    The list is explicitly non-exhaustive — MONDO:0001195 has seventeen descendants and
    new SFG species of undetermined pathogenicity continue to be described
    (PMID:24092850). The six curated here were chosen to span the severity range (RMSF
    to ATBF), both continents on which one species operates, both vector classes (tick
    and mite), and both naming traps ("tick typhus" that is SFG). Japanese spotted
    fever, Flinders Island spotted fever, Astrakhan spotted fever, Israeli tick typhus,
    Indian tick typhus, Far Eastern spotted fever, R. parkeri spotted fever and R.
    helvetica spotted fever all have MONDO terms and are candidates for a later tranche.
  posed_by: dismech curation (issue #8890)
  posed_date: '2026-08-19T00:00:00Z'
  resolved_date: '2026-08-19T00:00:00Z'

- discussion_id: sfr_group_boundary_and_naming_traps
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    What exactly is the unifying criterion for membership of this group, given that the
    disease grouping, the arthropod vector and the current rickettsial phylogeny do not
    coincide?
  rationale: >-
    Three boundary problems sit under this entry, and they are recorded rather than
    resolved because resolving them is an ontology question, not a curation one.

    First, the vector is not the criterion. MONDO defines MONDO:0001195 as "a type of
    tick-borne disease", yet places rickettsialpox (MONDO:0019360) under it, and
    rickettsialpox is mite-borne (PMID:28846279). Either the definition is too narrow or
    rickettsialpox is misplaced. This entry takes the first reading and treats the
    rickettsial clade, not the arthropod, as the unifying criterion — which is the
    reading that matches how the diseases are diagnosed, since rickettsialpox eschars
    stain positive for spotted fever group rickettsiae (PMID:12860597).

    Second, the clade itself has moved. Gillespie et al. proposed a fourth rickettsial
    lineage, the transitional group, distinct from both the spotted fever and typhus
    groups (PMID:17342200), and both R. akari and R. australis have since been assigned
    to it (PMID:28846279). Two of the six members curated here are therefore, on current
    genomic classification, not spotted fever group organisms — while remaining spotted
    fever group DISEASES clinically, serologically and therapeutically. This entry keeps
    them, on the grounds that a dismech disease entry groups diseases by shared
    pathophysiology and management rather than by the current state of bacterial
    systematics, but a reviewer should know the tension exists and that MONDO has not
    tracked the reclassification.

    Third, the names lie in both directions. Queensland tick typhus and North Asian
    (Siberian) tick typhus are spotted fever group diseases despite the word "typhus"
    (PMID:28719297, PMID:22493192), whereas murine typhus and epidemic typhus are typhus
    group and scrub typhus is not even a Rickettsia (Orientia tsutsugamushi). This is a
    live Named Entity Confusion hazard for anyone curating from a deep-research report:
    a search on "tick typhus" will return both groups. `kb/disorders/Murine_Typhus.yaml`
    is deliberately NOT a member of this group and must not be added to it.
  posed_by: dismech curation (issue #8890)
  posed_date: '2026-08-19T00:00:00Z'

- discussion_id: sfr_root_severity_gradient_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines the severity gradient across spotted fever group species — from
    self-limiting African tick-bite fever to frequently fatal Rocky Mountain spotted
    fever — given that all members share the same endothelial target cell and the same
    intracytosolic lifestyle?
  attaches_to:
  - pathophysiology#Species-Graded Endothelial Inflammatory Response
  rationale: >-
    The evidence curated here establishes that the gradient exists and correlates with
    the strength of the endothelial inflammatory and barrier response the species
    provokes (PMID:19091423, PMID:26394396). It does not establish what makes one
    species provoke that response more strongly than another. The two studies cited
    compare only two species pairs (R. conorii versus R. africae; R. conorii ISF versus
    R. massiliae), both use immortalised or primary human endothelial monolayers rather
    than intact microvasculature, and neither identifies the bacterial determinant
    responsible. Host factors known to worsen individual members — G6PD deficiency in
    RMSF, age and comorbidity in MSF — are curated on the member entries and are a
    separate axis from the species difference modelled here.
  proposed_experiments:
  - experiment_id: exp_sfr_multispecies_endothelial_panel
    name: Matched multi-species endothelial infection panel across the severity range
    description: >-
      Infect a single human microvascular endothelial preparation with a panel of SFG
      species spanning the clinical severity range (R. rickettsii, R. conorii subsp.
      conorii, R. africae, R. akari, R. australis, R. parkeri) at matched multiplicity,
      and measure a common readout set — transendothelial electrical resistance, IL-8
      and adhesion-molecule induction, and cell death — so that severity rank can be
      regressed against endothelial response rather than inferred from separate
      pairwise studies. Pair with comparative genomics across the same panel to nominate
      the bacterial determinants.
  posed_by: dismech curation (issue #8890)
  posed_date: '2026-08-19T00:00:00Z'

notes: >
  Scope. This entry is deliberately thin, in the sense used by
  `kb/disorders/Thanatophoric_Dysplasia.yaml`. It carries only claims that are defined
  over the spotted fever group as a whole and that therefore have no home on any single
  member: the SFG taxon and the species-versus-geography naming problem, the shared
  eschar, fever and rash triad together with the RMSF exception that bounds it, the
  group-versus-species resolution limit of rickettsial serology, the single all-ages
  doxycycline rule and its paediatric arm, and the SFG-versus-typhus-group boundary.
  The endothelial pathophysiology is stated once, at group level, with explicit
  pointers to where it is curated in depth; the VE-cadherin and coagulation arms, the
  cytotoxic T cell clearance arm, the per-member epidemiology, phenotype frequencies,
  differential diagnoses, histopathology and second-line therapy are NOT re-derived
  here. `Rocky_Mountain_Spotted_Fever.yaml` (2,119 lines) and `Boutonneuse_Fever.yaml`
  (1,273 lines) carry those. `Murine_Typhus.yaml` is typhus group, not spotted fever
  group, and is deliberately out of scope; it is a useful contrast and shares the two
  antimicrobial modules, but it is not a member of this group.

  Deep research. No new deep-research provider pass was run for this entry, by
  instruction. `research/Rocky_Mountain_Spotted_Fever-deep-research-claude_code.md` and
  `research/Boutonneuse_Fever-deep-research-fallback.md` were available as leads for the
  two curated members; every claim here was built from primary literature fetched
  directly from PubMed and verified against `references_cache/`. Because no
  deep-research report drives any claim, `just preflight-dr` is not applicable. Named
  Entity Confusion discipline was applied manually and mattered more than usual for this
  family: every cited abstract was checked to confirm which Rickettsia species it
  concerns, no paper about rickettsiosis in general is cited for an SFG-specific claim,
  and the "tick typhus" versus "typhus group" versus "scrub typhus" trap is recorded
  explicitly in the `sfr_group_boundary_and_naming_traps` discussion rather than left
  implicit.

  Sources not usable at curation time. Orphanet ORPHA:102022, which MONDO:0001195 xrefs
  and which would supply a quotable group-level definition and an epidemiology table,
  could not be cached: `just refresh-orphadata` fails a sha256 check against the pinned
  `data/orphadata/MANIFEST.yaml` because upstream Orphadata has drifted, and re-pinning
  the manifest would rebuild every `references_cache/ORPHA_*.md` in the repository. Both
  curated member entries already cite their own ORPHA records from the existing cache.
  No prevalence block is curated here as a result: population occurrence for this group
  is reported per member and per country, not for the union, and inventing a
  group-level figure from the member figures would be a fabricated aggregate.

references:
- reference: PMID:24092850
  title: "Update on tick-borne rickettsioses around the world: a geographic approach."
  findings:
  - statement: >-
      Defines tick-borne rickettsioses as caused by obligate intracellular bacteria of
      the spotted fever group of the genus Rickettsia
  - statement: >-
      Records that the group's membership is open — species once thought nonpathogenic
      are now recognised as human pathogens and novel species continue to be found
- reference: PMID:27172113
  title: >-
    Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain Spotted
    Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and Anaplasmosis -
    United States.
  findings:
  - statement: >-
      Doxycycline is the drug of choice for all tickborne rickettsial diseases in
      patients of all ages, including children under 8
  - statement: >-
      Rickettsial serology is group-specific but not species-specific; a reactive R.
      rickettsii titre can result from any SFG infection
  - statement: >-
      An inoculation eschar is rarely present in RMSF, unlike some other SFG
      rickettsioses
- reference: PMID:25794784
  title: >-
    No visible dental staining in children treated with doxycycline for suspected Rocky
    Mountain Spotted Fever.
  findings:
  - statement: >-
      No dental staining, enamel hypoplasia or tooth-shade difference in 58 children
      given short doxycycline courses before age 8 versus 213 unexposed controls
- reference: PMID:15109588
  title: Tick-borne rickettsioses in international travellers.
  findings:
  - statement: >-
      States the group-level presentation: flu-like illness with cutaneous rash and
      inoculation eschar, occasionally life-threatening disseminated vasculitis
  - statement: Only a minority of infected travellers recall a preceding tick bite
  - statement: Doxycycline is the recommended treatment for tick-borne rickettsioses
- reference: PMID:30148688
  title: >-
    Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an
    Endotheliotropic Infection.
  findings:
  - statement: >-
      Obligately intracytosolic rickettsiae target microvascular endothelial cells,
      producing endothelial dysfunction across a spectrum of disease severity
- reference: PMID:10497980
  title: >-
    Serologic study of the prevalence of rickettsiosis in Yucatán: evidence for a
    prevalent spotted fever group rickettsiosis.
  findings:
  - statement: >-
      The dominant antibody response is against shared SFG lipopolysaccharide rather
      than the OmpA and OmpB proteins carrying species-specific epitopes
- reference: PMID:17342200
  title: "Plasmids and rickettsial evolution: insight from Rickettsia felis."
  findings:
  - statement: >-
      Proposes the transitional group as a fourth rickettsial lineage distinct from the
      spotted fever and typhus groups
- reference: PMID:15766388
  title: >-
    Proposal to create subspecies of Rickettsia conorii based on multi-locus sequence
    typing and an emended description of Rickettsia conorii.
  findings:
  - statement: >-
      One genotypically homogeneous species, R. conorii, underlies four
      epidemio-clinically distinct geographically named diseases
- reference: PMID:26394396
  title: >-
    Rickettsia massiliae and Rickettsia conorii Israeli Spotted Fever Strain
    Differentially Regulate Endothelial Cell Responses.
  findings:
  - statement: >-
      A virulent SFG strain reduces endothelial monolayer electrical resistance while a
      mild one does not, at matched infection
- reference: PMID:19091423
  title: >-
    Relative chemokine and adhesion molecule expression in Mediterranean spotted fever
    and African tick bite fever.
  findings:
  - statement: >-
      R. conorii has a superior endothelial inflammatory potential to R. africae,
      matching the severity difference between MSF and ATBF
- reference: PMID:28169507
  title: Predictive Factors for Fatal Tick-Borne Spotted Fever in Brazil.
  findings:
  - statement: Seizures and coma are the strongest predictors of fatal spotted fever
  - statement: >-
      R. rickettsii causes tick-borne spotted fever in Brazil as well as North America

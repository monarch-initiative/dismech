    Caused by Rickettsia rickettsii and transmitted by Dermacentor and Rhipicephalus
    ticks. The most severe member of the group and the one in which an inoculation
    eschar is characteristically absent. Its range demonstrates that the species axis
    and the geographic axis do not coincide: the same organism causes Rocky Mountain

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mediterranean spotted fever (MSF) is caused by a tick-borne pathogen, Rickettsia
      conorii subsp. conorii, belonging to the spotted fever group (SFG) rickettsiae.
    explanation: >-
      Names the causative subspecies and states its membership of the spotted fever
      group.
  - reference: PMID:15766388
    reference_title: >-
      Proposal to create subspecies of Rickettsia conorii based on multi-locus sequence

diagnosis:
- name: Empiric clinical and epidemiologic diagnosis
  description: >-
    Across the whole group, the diagnosis is made clinically and epidemiologically and
    treatment is started on suspicion. Confirmatory testing is retrospective in
    practice, an absent tick-bite history is common and does not argue against the
    diagnosis, and waiting for a laboratory result costs lives.
  diagnosis_term:
    preferred_term: clinical evaluation
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  evidence:
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Definite microbiological confirmation of tick-borne rickettsioses by isolation or
      antigen detection is only available at reference laboratories and diagnosis must
      in most cases rely on clinical and epidemiological data supported by serology.
    explanation: >-
      States the group-level diagnostic reality: clinical and epidemiological
      assessment, with serology as support rather than as the primary test. Evidence
      source is OTHER as this is a literature-based review.
  - reference: PMID:15109588
    reference_title: Tick-borne rickettsioses in international travellers.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Only a minority of infected travellers can recall a preceding tick bite.
    explanation: >-
      Supports the specific caution that an absent exposure history does not exclude the
      diagnosis. Evidence source is OTHER as this is a literature-based review.
  notes: >-
    `diagnosis_term` is bound to `NCIT:C124351` (Clinical Evaluation) rather than the
    broader laboratory-procedure term used for the same node in
    `Rocky_Mountain_Spotted_Fever.yaml`. The divergence is deliberate: this node's claim
    is that treatment starts on clinical and epidemiologic grounds *without* laboratory
    confirmation, so a laboratory-procedure term would contradict the claim it annotates.
    The specific confirmatory modalities (paired-serum IFA, whole-blood PCR, eschar-swab
    PCR, immunohistochemistry on skin biopsy) are curated with their own terms on the
    member entries.

- name: Group-specific serology and the species-level limit
  description: >-
    Serology is the mainstay of confirmation for the whole group, and it is
    group-specific rather than species-specific. The immunodominant response is against
    spotted fever group lipopolysaccharide, which is shared, rather than against the
    OmpA and OmpB outer-membrane proteins that carry the species-specific epitopes. A
    reactive R. rickettsii titre therefore establishes infection with an SFG rickettsia,
    not with R. rickettsii — which is why species assignment needs cross-adsorption,
    Western blot, PCR or culture, and why the individual member diseases are so often
    reported as an undifferentiated "spotted fever group rickettsiosis". This is a claim
    about the group as a whole and has no home on any member entry.
  diagnosis_term:
    preferred_term: serologic testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and
      Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cross-reactive immune responses to rickettsial antigens result in antibodies that
      are typically group-specific, although perhaps not species-specific, for tickborne
      rickettsial pathogens
    explanation: >-
      The direct statement of the group-versus-species resolution limit of rickettsial
      serology. Evidence source is OTHER as this is a national recommendations report.
  - reference: PMID:27172113
    reference_title: >-
      Diagnosis and Management of Tickborne Rickettsial Diseases: Rocky Mountain
      Spotted Fever and Other Spotted Fever Group Rickettsioses, Ehrlichioses, and
      Anaplasmosis - United States.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      antibodies reactive with R. rickettsii detected by a serologic test could result
      from infection with other SFG rickettsiae
    explanation: >-
      The worked consequence: a positive R. rickettsii serology does not identify the
      species. Evidence source is OTHER as this is a national recommendations report.
  - reference: PMID:10497980
    reference_title: >-
      Serologic study of the prevalence of rickettsiosis in Yucatán: evidence for a
      prevalent spotted fever group rickettsiosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoblotting with antigens of R. akari identified antibodies against antigens of
      spotted fever group lipopolysaccharides and not against rickettsial outer membrane
      proteins A and B, which contain the species-specific epitopes.
    explanation: >-
      Gives the molecular reason for the cross-reactivity: the dominant response is
      against shared group lipopolysaccharide rather than the species-specific OmpA and
      OmpB epitopes.

treatments:
- name: Empiric doxycycline for all patients of all ages
  action_category: THERAPEUTIC
  description: >-
    One recommendation covers the entire group: doxycycline, started immediately on
    clinical suspicion, in patients of every age including children under eight. This
    is a genuinely group-level rule — it does not depend on which SFG species is
    involved, and it is made before the species (or often even the group) is known,
    which is what makes it a root-level claim rather than a per-member one. Its two
    mechanistic legs are the shared rickettsial ribosome and the shared cytosolic
    niche, both modelled above. The historical reluctance to give doxycycline to young
    children has been overturned: the concern derived from older tetracyclines that
    bind calcium more readily, and a CDC cohort of 58 children given short courses
    before age eight showed no dental staining, no enamel hypoplasia and no difference
    in tooth shade against 213 unexposed controls. Per-member specifics — the day-5
    mortality window in RMSF, the sulfonamide contraindication, macrolide alternatives
    in pregnancy — are curated on the member entries.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the bacterial 30S ribosomal subunit and arrests rickettsial
      protein synthesis. The molecular detail is held in the
      `bacterial_protein_synthesis_inhibition` module.
    evidence:
    - reference: PMID:15109588
      reference_title: Tick-borne rickettsioses in international travellers.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Doxycycline is the recommended treatment for tick-borne rickettsioses and
        prevention is based on personal protective measures against tick bites when

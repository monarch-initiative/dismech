name: Lymphogranuloma Venereum
creation_date: '2026-09-25T00:00:00Z'
category: Infectious Disease
description: >-
  Lymphogranuloma venereum is a sexually transmitted invasive chlamydial
  infection caused by Chlamydia trachomatis serovars L1, L2, and L3. The
  organism enters mucosal epithelial cells, can replicate in macrophages, and
  causes genital ulceration, regional lymphadenopathy, and anorectal proctitis.
  Doxycycline is the standard prolonged oral antibiotic therapy.
disease_term:
  preferred_term: lymphogranuloma venereum
  term:
    id: MONDO:0005834
    label: lymphogranuloma venereum
parents:
- Bacterial Infection
- Sexually transmitted infection
synonyms:
- LGV
- Lymphogranuloma inguinale
- Durand-Nicolas-Favre disease
- Climatic bubo
- Tropical bubo
- Poradenitis
- Lymphopathia venereum
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
infectious_agent:
- name: Chlamydia trachomatis L1-L3 serovars
  description: >-
    Invasive C. trachomatis serovars L1, L2, and L3 cause lymphogranuloma
    venereum; recent outbreaks are mostly due to the L2b type.
  infectious_agent_term:
    preferred_term: Chlamydia trachomatis
    term:
      id: NCBITaxon:813
      label: Chlamydia trachomatis
  evidence:
  - reference: PMID:24518282
    reference_title: "Lymphogranuloma venereum: an old, forgotten re-emerging systemic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The etiological agent of LGV is Chlamydia trachomatis serotypes L1, L2 and
      L3, and current outbreaks are mostly sustained by L2b type.
    explanation: >-
      Review identifying C. trachomatis L1-L3 as the causative organisms, with
      L2b predominance in contemporary outbreaks.
transmission:
- name: Sexual transmission
  description: >-
    Chlamydia trachomatis L serovars are transmitted by sexual contact at
    genital, rectal, or oropharyngeal mucosal sites; anorectal transmission
    through genital-anal contact is prominent in the contemporary MSM-associated
    epidemic.
  evidence:
  - reference: PMID:34057249
    reference_title: "2021 European Guideline on the management of proctitis, proctocolitis and enteritis caused by sexually transmissible pathogens."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infectious proctitis can be sexually transmitted via genital-anal mucosal
      contact, but some also via digital contact and toys.
    explanation: >-
      Guideline statement establishing sexual mucosal contact as a route for
      infectious proctitis, the syndrome that includes LGV proctitis.
pathophysiology:
- name: C. trachomatis T3SS-Dependent Epithelial Entry
  description: >-
    C. trachomatis elementary bodies attach to mucosal epithelial cells and use
    type III secretion system effectors to enter host cells, manipulate the
    inclusion membrane, and complete the intracellular developmental cycle.
  role: trigger
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:33512479
    reference_title: "Got mutants? How advances in chlamydial genetics have furthered the study of effector proteins."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      C. trachomatis delivers an arsenal of virulence factors into the eukaryotic
      cell via a type 3 secretion system (T3SS) that facilitates invasion,
      manipulation of host vesicular trafficking, subversion of host defense
      mechanisms and promotes bacteria egress at the conclusion of the
      developmental cycle.
    explanation: >-
      Review tying the T3SS to C. trachomatis invasion, inclusion manipulation,
      immune subversion, and egress.
  downstream:
  - target: L2 Macrophage Replication and Cytokine Skewing
    description: >-
      Intracellular epithelial infection is followed by productive L2 replication
      in macrophages and an L2-skewed cytokine profile.
  - target: Genital ulcers
    description: >-
      Initial inoculation-site lesions can ulcerate before the secondary stage of
      lymphadenopathy or proctitis.
- name: L2 Macrophage Replication and Cytokine Skewing
  description: >-
    Disseminating C. trachomatis serovar L2 can replicate in monocyte-derived
    macrophages and induces a cytokine profile distinct from the
    non-disseminating E serovar, linking intracellular survival to neutrophil and
    macrophage recruitment.
  role: mechanism
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:3759241
    reference_title: Fate of Chlamydia trachomatis in human monocytes and monocyte-derived macrophages.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast to the abortive replication of C. trachomatis in monocytes,
      monocyte-derived macrophages permitted replication as indicated by one-step
      growth experiments and TEM.
    explanation: >-
      Directly demonstrates productive L2 replication in human
      monocyte-derived macrophages.
  - reference: PMID:11207588
    reference_title: Chlamydial infection of polarized HeLa cells induces PMN chemotaxis but the cytokine profile varies between disseminating and non-disseminating strains.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Infection of HeLa cells with C. trachomatis E or L2 induced a strong and
      similar PMN chemotactic response, but larger amounts of interleukin (IL)-8
      and IL-11 were released after infection with serovar L2.
    explanation: >-
      Shows that a disseminating L2 strain elicits a distinct epithelial
      cytokine profile while preserving neutrophil chemotactic signaling.
  downstream:
  - target: Regional Lymphadenitis and Ulcerative Proctitis
    description: >-
      L2 replication in phagocytes and cytokine-biased inflammation precede the
      nodal and anorectal inflammatory syndromes of LGV.
- name: Regional Lymphadenitis and Ulcerative Proctitis
  description: >-
    After a primary inoculation-site papule or ulcer, invasive L-serovar
    infection produces regional lymphadenopathy; contemporary cases often
    manifest as progressive ulcerative proctitis.
  role: consequence
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  evidence:
  - reference: PMID:24518282
    reference_title: "Lymphogranuloma venereum: an old, forgotten re-emerging systemic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical course can be classically divided into three stages: an
      initial papule, which may ulcerate at the site of inoculation, followed by
      regional lymphoadenopathy (second stage, generally unilateral).
    explanation: >-
      Describes the transition from an inoculation-site lesion to secondary
      regional lymphadenopathy.
  - reference: PMID:24518282
    reference_title: "Lymphogranuloma venereum: an old, forgotten re-emerging systemic disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main clinical picture is a relative new entity characterized by
      progressive ulcerative proctitis, the so called anorectal syndrome.
    explanation: >-
      Establishes ulcerative proctitis as the dominant contemporary LGV syndrome.
  downstream:
  - target: Lymphadenopathy
    description: Regional lymph node inflammation produces the secondary-stage lymphadenopathy.
  - target: Tenesmus
    description: Ulcerative proctitis can cause tenesmus.
  - target: Hematochezia
    description: Ulcerative proctitis can cause anorectal bleeding.
  - target: Constipation
    description: Ulcerative proctitis can cause constipation.
- name: Chlamydial Ribosomal Translation (Tetracycline Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  description: >-
    C. trachomatis requires its bacterial 70S ribosome for protein synthesis.
    Doxycycline blocks translation through the 30S subunit, giving LGV a
    tetracycline-vulnerable replication step.
  biological_processes:
  - preferred_term: translation
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review establishing the bacterial ribosome as the shared target of
      tetracyclines and other protein-synthesis inhibitors.

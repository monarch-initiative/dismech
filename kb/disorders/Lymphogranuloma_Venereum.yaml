treatments:
- name: Doxycycline
  description: >-
    Doxycycline 100 mg twice daily for 21 days is the recommended LGV regimen;
    it inhibits chlamydial growth by targeting the bacterial ribosome.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Chlamydial Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the bacterial 30S ribosome and arrests C. trachomatis
      protein synthesis.
  evidence:
  - reference: PMID:31243838
    reference_title: 2019 European guideline on the management of lymphogranuloma venereum.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Doxycycline 100 mg twice a day orally for 21 days is the recommended
      treatment for LGV.
    explanation: Guideline statement of the recommended doxycycline regimen for LGV.
  - reference: PMID:27513890
    reference_title: Systematic Review and Meta-Analysis of Doxycycline Efficacy for Rectal Lymphogranuloma Venereum in Men Who Have Sex with Men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The fixed-effects pooled efficacy for doxycycline was 98.5% (95% CI
      96.3%-100%, I (2)  = 0%; p = 0.993).
    explanation: >-
      Meta-analysis of rectal LGV treatment in MSM measuring a high microbial
      cure rate for the same 21-day doxycycline regimen.

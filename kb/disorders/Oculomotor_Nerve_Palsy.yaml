- name: Endoneurial Microvascular Ischaemia of the Oculomotor Nerve Core
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    In diabetes, hypertension, dyslipidaemia, and smoking, small-vessel disease
    of the nerve's own blood supply produces ischaemic injury concentrated in
    the nerve's interior. Because the somatic motor fibres occupy that interior
    while the pupillomotor fibres lie superficially, the resulting palsy is
    typically diffuse across all cranial nerve III muscles yet leaves the pupil
    working - the pupil-sparing pattern. Sparing is a statistical tendency
    produced by geometry, not a guarantee.

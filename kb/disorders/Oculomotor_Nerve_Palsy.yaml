    evidence:
    - reference: PMID:30592440
      reference_title: "The aetiologies of the unilateral oculomotor nerve palsy: a review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A number of different conditions have been reported to cause ONP, such as diabetes mellitus, aneurysm, tumours, painful ophthalmoplegia, pituitary lesions, cavernous sinus lesions, central nervous system infections, and subarachnoid haemorrhage."
      explanation: "The enumerated causes are neurological and neurovascular disorders of the nervous system, supporting placement in the neurologic chapter."
has_subtypes:
- name: Microvascular
  display_name: Ischaemic microvascular oculomotor nerve palsy
  description: >-
    Acute painful third nerve palsy in an adult with vascular risk factors
    (diabetes mellitus, hypertension, dyslipidaemia, smoking), no causative
    lesion on imaging, and spontaneous recovery. Characteristically, though not
    invariably, pupil-sparing. The most common single aetiology in adults.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common etiology was microvascular (n = 168, 26.5%), followed by vascular anomalies (n = 110, 17.4%), neoplastic (n = 86, 13.6%), inflammatory (n = 79, 12.5%), idiopathic (n = 60, 9.5%) and traumatic (n = 53, 8.4%)."
    explanation: "Establishes microvascular ischaemia as the single largest aetiological category of isolated oculomotor nerve palsy in a 633-patient hospital-wide series."
  - reference: PMID:39510537
    reference_title: "Ocular Motor Mononeuropathies in Diabetes Mellitus: A Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ocular motor mononeuropathies affect cranial nerves III, IV and VI and are more frequent in diabetes mellitus, with oculomotor nerve involvement being predominant."
    explanation: "Supports diabetes mellitus as the paradigmatic vascular risk factor and cranial nerve III as the ocular motor nerve most often affected."
- name: Compressive
  display_name: Compressive and aneurysmal oculomotor nerve palsy
  description: >-
    Third nerve palsy from extrinsic mass effect on the cisternal nerve, most
    urgently by a posterior communicating artery aneurysm, and also by tumour,
    pituitary apoplexy, and uncal herniation. Painful, usually pupil-involving,
    and a neurosurgical emergency because the aneurysm may be about to rupture.
  evidence:
  - reference: PMID:33845117
    reference_title: "Oculomotor nerve palsy due to posterior communicating artery aneurysm: Clipping vs coiling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Posterior communicating artery aneurysms (PCoAA) usually present with brain hemorrhage, but they might present with oculomotor nerve palsy (ONP) in about one out of five patients."
    explanation: "Quantifies how often a posterior communicating artery aneurysm declares itself through third nerve palsy rather than through haemorrhage."
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vascular anomalies included intracranial aneurysm (n = 89, 80.9%), dural arteriovenous fistula (n = 10, 9.1%), cavernous malformation (n = 9, 8.2%) and arteriovenous malformation (n = 2, 1.8%)."
    explanation: "Shows that intracranial aneurysm dominates the vascular-anomaly category that is the second most common cause of isolated oculomotor nerve palsy."
- name: Traumatic
  display_name: Traumatic oculomotor nerve palsy
  description: >-
    Third nerve palsy following head injury, from stretch, contusion, or
    avulsion of the nerve, classically where it is tethered against the
    posterior petroclinoid ligament or the tentorial edge. The leading cause in
    childhood inpatient series and a major cause in young adults.
  evidence:
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Causes were trauma (26%), tumor (12%), diabetes (11%), aneurysm (10%), surgery (10%), stroke (8%), infection (5%), Guillain-Barre and Fisher syndromes (5%), idiopathic cavernous sinusitis (3%), benign self-limited (2%), miscellaneous (4%), and unknown (3%)."
    explanation: "In a large municipal inpatient population trauma was the single most common cause, establishing traumatic palsy as a major aetiological subtype."
  - reference: PMID:16978866
    reference_title: "Traumatic oculomotor nerve palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The suggested mechanism of the oculomotor nerve palsy with pupil sparing in this case is stretching of the oculomotor nerve at the posterior petroclinoid ligament, maintaining an intact pupillomotor nerve."
    explanation: "Describes the stretch-at-a-tether-point mechanism that distinguishes traumatic palsy from compressive and ischaemic palsy."
- name: Congenital
  display_name: Congenital oculomotor nerve palsy
  description: >-
    Third nerve palsy present from infancy, usually unilateral and incomplete,
    associated on high-resolution MRI with hypoplasia, thinning, or frank
    agenesis of the oculomotor nerve and secondary atrophy of the muscles it
    supplies. A developmental nerve deficit, not an acquired lesion, and the
    most frequent presentation of third nerve palsy in childhood.
  evidence:
  - reference: PMID:30997520
    reference_title: "Magnetic Resonance Imaging in 14 Patients with Congenital Oculomotor Nerve Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital oculomotor nerve palsy was mostly incomplete and hypoplasia or aplasia of the oculomotor nerve was apparent in one third of patients showing variable degrees of extraocular muscle atrophy, mostly of the medial rectus and inferior rectus muscles."
    explanation: "Establishes the defining structural correlate of the congenital subtype and its usually incomplete clinical expression."
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital-onset oculomotor nerve palsy was the most frequent presentation, followed by traumatic, neoplastic, vascular, and migrainous or para-infectious etiologies."
    explanation: "Supports congenital onset as the leading category in a paediatric cohort, in contrast with the adult aetiological distribution."
- name: Inflammatory
  display_name: Inflammatory oculomotor nerve palsy
  description: >-
    Third nerve palsy from inflammation of the nerve, its fascicle, or the
    cavernous sinus, with Tolosa-Hunt syndrome as the prototype. Diagnosed on
    an enhancing T2-hyperintense lesion affecting the nerve together with
    steroid responsiveness, it is the third largest aetiological category yet
    has the best recovery of any cause. Curated as an aetiological subtype
    because that category is solidly evidenced, even though the mechanism of
    the inflammation itself is not.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common etiology was microvascular (n = 168, 26.5%), followed by vascular anomalies (n = 110, 17.4%), neoplastic (n = 86, 13.6%), inflammatory (n = 79, 12.5%), idiopathic (n = 60, 9.5%) and traumatic (n = 53, 8.4%)."
    explanation: "Places inflammatory aetiology at 12.5% of 633 cases, ahead of trauma, which is why it earns a subtype."
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and the symptoms responded to steroid treatments"
    explanation: "Steroid responsiveness is part of how the anchoring cohort operationally defined the inflammatory category."
  - reference: PMID:37853245
    reference_title: "Recurrence and long-term outcomes of Tolosa-Hunt syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Isolated ocular motor nerve palsy was the most common (82.4%) finding of ophthalmoplegia, involving the oculomotor nerve in more than half of the cases (52.0%)."
    explanation: "Establishes that the prototypical inflammatory cause, Tolosa-Hunt syndrome, most often presents through the oculomotor nerve specifically."
- name: RPON
  display_name: Recurrent painful ophthalmoplegic neuropathy (formerly ophthalmoplegic migraine)
  description: >-
    Rare disorder of repeated attacks of unilateral headache with ipsilateral
    ocular motor palsy, most often of cranial nerve III, with focal thickening
    and contrast enhancement of the nerve on MRI and usually full recovery.
    Reclassified by the International Headache Society in 2013 away from
    "ophthalmoplegic migraine" because the imaging indicates a neuropathy; the
    underlying mechanism remains unsettled.
  evidence:
  - reference: PMID:35659705
    reference_title: "Diagnostic controversies in recurrent painful ophthalmoplegic neuropathy: single case report with a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmoplegic migraine, renamed \"Recurrent Painful Ophthalmoplegic Neuropathy\" (RPON) in 2013 by the International Headache Society is a rare neurologic disorder characterized by recurrent attacks of ophthalmoplegia associated to ipsilateral headache."
    explanation: "Defines the entity and records the 2013 reclassification that renamed ophthalmoplegic migraine to RPON."
  - reference: PMID:35659705
    reference_title: "Diagnostic controversies in recurrent painful ophthalmoplegic neuropathy: single case report with a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical magnetic resonance imaging findings show a focal nerve thickening and contrast enhancement."
    explanation: "Records the imaging signature that separates RPON from aneurysmal and ischaemic third nerve palsy."

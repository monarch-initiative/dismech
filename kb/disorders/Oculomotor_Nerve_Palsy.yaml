  population: >-
    Patients with isolated oculomotor nerve palsy, referral-based university
    hospital, all departments, South Korea
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Aetiological share, not a population rate: microvascular ischaemia
    accounted for 168/633 (26.5%) of isolated oculomotor nerve palsy cases
    ascertained across all departments over 18 years.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common etiology was microvascular (n = 168, 26.5%), followed by vascular anomalies (n = 110, 17.4%), neoplastic (n = 86, 13.6%), inflammatory (n = 79, 12.5%), idiopathic (n = 60, 9.5%) and traumatic (n = 53, 8.4%)."
    explanation: "Direct source for the aetiological fractions recorded here."
- subtype: Traumatic
  population: >-
    Municipal hospital inpatients with third nerve palsy personally examined by
    a single neuro-ophthalmologist over 37 years
  measure_type: PERIOD_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Aetiological share in an inpatient population, where severe trauma and
    herniation are over-represented relative to outpatient neuro-ophthalmology
    series: trauma 26%, tumour 12%, diabetes 11%, aneurysm 10%.
  evidence:
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Causes were trauma (26%), tumor (12%), diabetes (11%), aneurysm (10%), surgery (10%), stroke (8%), infection (5%), Guillain-Barre and Fisher syndromes (5%), idiopathic cavernous sinusitis (3%), benign self-limited (2%), miscellaneous (4%), and unknown (3%)."
    explanation: "Direct source for the inpatient aetiological distribution, which differs markedly from referral outpatient series."
- population: Korean population
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 3.71
  notes: >-
    Population incidence of third cranial nerve palsy reported as 3.71 per
    100,000 per year, against 5.73 for trochlear and 4.66 for abducens palsy in
    the same population. Incidence rises with age, accelerating after 60.
  evidence:
  - reference: PMID:38352051
    reference_title: "Retrospective Analysis of Cranial Nerve Palsy in Third, Fourth, and Sixth Cranial Nerves: Etiology, Clinical Course, and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent reports have indicated that the incidence rates of third, fourth, and sixth cranial nerve palsy among the Korean population are 3.71, 5.73, and 4.66 per 100,000 per year, respectively."
    explanation: "Gives the population annual incidence of third nerve palsy alongside the other ocular motor nerves for context."
epidemiology:
- name: Setting dependence of the aetiological mix
  description: >-
    The apparent cause distribution of third nerve palsy depends heavily on
    where patients are ascertained. Inpatient and referral populations differ,
    and within one hospital the mix differs by the specialty managing the
    patient, so no single published distribution should be read as the
    population truth.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of etiologies of isolated oculomotor nerve palsy may differ according to the specialties involved in the management."
    explanation: "The authors' own conclusion that ascertainment route biases the measured aetiological distribution."
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral TNPs, multiple cranial neuropathies, and accompanying neurological signs were common among our inpatients, as were causes rare in outpatient settings such as severe trauma, transtentorial herniation, midbrain strokes, and the Guillain-Barre syndrome."
    explanation: "Documents the specific causes enriched in an inpatient setting relative to outpatient neuro-ophthalmology cohorts."
- name: Pain accompanies both the dangerous and the benign cause
  description: >-
    Painful onset is common in aneurysmal third nerve palsy but is also common
    in diabetic microvascular palsy, so pain alone cannot be used to triage
    urgency.
  factors:
  - headache
  - periorbital pain
  evidence:
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "painful onset occurred with 94% of aneurysm and 69% of diabetic cases."
    explanation: "Directly quantifies pain in both aneurysmal and diabetic palsy, showing pain does not discriminate between them."
progression:
- phase: Acute onset
  subtype: Microvascular
  notes: >-
    Microvascular palsy begins abruptly, often with periorbital pain, and
    reaches its deficit over hours to days.
  evidence:
  - reference: PMID:39510537
    reference_title: "Ocular Motor Mononeuropathies in Diabetes Mellitus: A Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical manifestations often include ptosis, diplopia, and periorbital pain."
    explanation: "Records the acute symptom triad with which diabetic ocular motor mononeuropathy presents."
- phase: Spontaneous recovery
  subtype: Microvascular
  notes: >-
    The defining prognostic feature of the microvascular subtype is
    spontaneous resolution, typically within weeks to a few months, without
    directed treatment of the nerve itself.
  evidence:
  - reference: PMID:39510537
    reference_title: "Ocular Motor Mononeuropathies in Diabetes Mellitus: A Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous recovery is seen in many cases."
    explanation: "Supports spontaneous recovery as the expected course of diabetic ocular motor mononeuropathy."
- phase: Post-treatment recovery
  subtype: Compressive
  notes: >-
    After treatment of a posterior communicating artery aneurysm, recovery of
    the nerve depends chiefly on how severe the palsy was and how long it was
    left untreated, which is the mechanistic argument for early intervention.
  evidence:
  - reference: PMID:30455133
    reference_title: "Posterior communicating aneurysm with oculomotor nerve palsy: Predictors of nerve recovery."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "initial palsy severity and preoperative palsy times are important predictors for ONP recovery, early treatment is recommended to achieve complete recovery of ONP, regardless of the presence or absence of SAH"
    explanation: "Identifies severity and delay as the determinants of nerve recovery after aneurysm treatment."
- phase: Attack and remission cycle
  subtype: RPON
  notes: >-
    RPON runs as discrete attacks with full recovery between them in most
    patients, although repeated attacks can leave permanent deficit.
  evidence:
  - reference: PMID:35659705
    reference_title: "Diagnostic controversies in recurrent painful ophthalmoplegic neuropathy: single case report with a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority of cases, there is a full recovery within days or weeks."
    explanation: "Supports the relapsing-remitting course with usual full recovery that characterizes RPON."
- phase: Prognostic determinants of recovery
  notes: >-
    Across aetiologies, the two factors that predict good long-term recovery
    are a short symptom onset (under one week) and involvement of the third
    nerve alone rather than several cranial nerves. Recovery also differs
    sharply by cause, being best for inflammatory and worst for compressive
    palsies in one tertiary series.
  evidence:
  - reference: PMID:38352051
    reference_title: "Retrospective Analysis of Cranial Nerve Palsy in Third, Fourth, and Sixth Cranial Nerves: Etiology, Clinical Course, and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of symptoms in less than 1 week and isolated nerve involvement were associated with better prognosis in subjects with third, fourth, and sixth cranial nerve palsy."
    explanation: "Identifies the two independent prognostic factors for recovery, adjusted for age, sex, and vascular risk factors."
  - reference: PMID:38352051
    reference_title: "Retrospective Analysis of Cranial Nerve Palsy in Third, Fourth, and Sixth Cranial Nerves: Etiology, Clinical Course, and Prognostic Factors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study revealed that ischemic and compressive lesions were the most common etiology of oculomotor nerve palsy, comprising 24.6% each."
    explanation: "Independent tertiary-hospital series confirming ischaemic and compressive causes as the two dominant aetiologies of third nerve palsy."
- phase: Amblyopia risk in childhood
  subtype: Congenital
  notes: >-
    In children the palsy competes with visual development, so the clinically
    dominant late outcome is amblyopia and loss of binocularity rather than the
    ocular motor deficit itself.
  evidence:
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amblyopia developed in 7 (39%) children and was successfully treated in 5 of the 7 (71%)."
    explanation: "Quantifies amblyopia as a frequent and largely treatable sequela of childhood third nerve palsy."
pathophysiology:
- name: Somatotopic Segregation of Pupillomotor and Somatic Motor Fibres
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Cranial nerve III carries two functionally distinct fibre populations that
    are not intermingled. The preganglionic parasympathetic pupillomotor and
    accommodative fibres travel superficially, at the periphery of the nerve;
    the somatic motor fibres to levator palpebrae superioris and the four
    extraocular muscles travel deeper. This anatomical arrangement is the
    single fact from which the entire pupil-involving versus pupil-sparing
    clinical axis follows: an insult applied from outside the nerve reaches the
    superficial fibres first, whereas an insult arising within the nerve's
    substance reaches the deeper fibres first. Nothing about the fibres
    themselves confers differential vulnerability - it is their position.
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parasympathetic fibers, located superficially, innervate the ciliary muscle and sphincter pupillae, mediating lens accommodation and pupillary constriction."
    explanation: "Directly states the superficial peripheral position of the pupillomotor parasympathetic fibres, the anatomical premise of this entry. Classified OTHER because this is a reference-work synthesis of established human neuroanatomy rather than a study reporting its own data."
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Somatic motor fibers, located deeper, innervate the levator palpebrae superioris, which elevates the upper eyelid, and 4 extraocular muscles"
    explanation: "States the complementary deeper position of the somatic motor fibres, completing the segregation on which the pupil axis depends. Classified OTHER for the same reason as the companion quote."
  - reference: PMID:36116851
    reference_title: "The Oculomotor Nerve: Anatomy and Pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It also has parasympathetic pre-ganglionic fibers, responsible for the innervation of sphincter pupillae and ciliary muscles."
    explanation: "Independent anatomical review confirming that the nerve carries a preganglionic parasympathetic component serving the pupil and lens, alongside its motor component."
  cell_types:
  - preferred_term: peripheral nervous system neuron
    term:
      id: CL:2000032
      label: peripheral nervous system neuron
  locations:
  - preferred_term: oculomotor nerve
    term:
      id: UBERON:0001643
      label: oculomotor nerve
  notes: >-
    The peripheral position of the pupillomotor fibres was established
    experimentally by Kerr and Hollowell (PMID:14213479) and by Sunderland and
    Hughes; neither has a retrievable abstract, so neither is cited as evidence
    here. The claim is instead anchored on contemporary reference sources whose
    text can be verified against the reference cache.
  downstream:
  - target: Extrinsic Compression of the Cisternal Oculomotor Nerve
    causal_link_type: DIRECT
    description: >-
      Because the pupillomotor fibres lie at the surface, an extrinsic mass
      contacts them before it reaches the motor core.
    evidence:
    - reference: PMID:6830173
      reference_title: "Pupil sparing in oculomotor palsy: a brief review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical dictum that pupil sparing in oculomotor nerve palsy predicts an extraaxial ischemic lesion while pupil involvement predicts an extraaxial compressive lesion has some important exceptions."
      explanation: "States the compression-takes-the-pupil rule that the fibre arrangement predicts, while flagging that it is a dictum with exceptions."
  - target: Endoneurial Microvascular Ischaemia of the Oculomotor Nerve Core
    causal_link_type: DIRECT
    description: >-
      Because the somatic motor fibres occupy the core, an ischaemic insult to
      the nerve's internal blood supply damages them while the superficially
      placed pupillomotor fibres are relatively protected.
    evidence:

definitions:
- name: Clinical syndrome definition for oculomotor nerve palsy
  definition_type: CASE_DEFINITION
  description: >-
    Oculomotor nerve palsy is diagnosed from weakness of the extraocular
    muscles supplied by cranial nerve III, with or without ptosis and
    pupillary involvement, after mimics such as myasthenia gravis, thyroid
    orbitopathy, and Horner syndrome have been excluded.
  scope: General clinical framing of third cranial nerve palsy
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical presentation includes ptosis, ophthalmoplegia, diplopia, and variable pupillary involvement, resulting in the characteristic down-and-out eye position in complete palsy."
    explanation: "States the defining clinical constellation of third cranial nerve palsy, including the variable pupil, which is what the case definition has to capture."
  - reference: PMID:30592440
    reference_title: "The aetiologies of the unilateral oculomotor nerve palsy: a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oculomotor nerve palsy (ONP) is an important and common clinical diagnosis. Its main features are diplopia and ptosis."
    explanation: "Independent review confirming diplopia and ptosis as the cardinal presenting features on which the clinical diagnosis rests."
- name: Anatomical localization definition
  definition_type: CASE_DEFINITION
  description: >-
    A lesion anywhere from the oculomotor nucleus in the midbrain to the
    terminal branches in the orbit can produce the syndrome, so localization
    along the nerve's course is part of the diagnostic definition rather than
    an afterthought.
  scope: Lesion localization along the course of cranial nerve III
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions affecting the cranial nerve III can occur along its entire course, from the oculomotor nucleus in the midbrain to terminal branches in the orbit."
    explanation: "Establishes that the syndrome is defined by the affected nerve rather than by a single anatomical site, which is why localization is part of the workup."
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Third nerve damage occurred in the subarachnoid space in 32%, the cavernous sinus in 23%, the brainstem in 14%, as a nonlocalized peripheral neuropathy in 18% and at an uncertain location in 13%."
    explanation: "Quantifies how lesion site is distributed across the nerve's course in a large personally-examined inpatient series."

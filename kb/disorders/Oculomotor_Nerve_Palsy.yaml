  - target: Somatic Motor Fibre Conduction Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:35659705
      reference_title: "Diagnostic controversies in recurrent painful ophthalmoplegic neuropathy: single case report with a systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In 80% of cases it involves the third cranial nerve"
      explanation: "Establishes cranial nerve III as the nerve most often affected in RPON attacks."
  - target: Headache
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26021754
      reference_title: "From ophthalmoplegic migraine to cranial neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Ophthalmoplegic migraine (OM)/recurrent painful ophthalmoplegic neuropathy (RPON) is a rare disease consisting of recurrent unilateral headache accompanied or followed by ipsilateral ophthalmoplegia."
      explanation: "Establishes ipsilateral headache as an integral part of the attack rather than an incidental symptom."
- name: Aberrant Regeneration of the Oculomotor Nerve
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    After severe axonal injury, regrowing fibres can reach the wrong target,
    so attempted adduction or downgaze elevates the eyelid or constricts the
    pupil. Clinically this matters twice over: it is a marker of structural
    (usually compressive or traumatic) rather than ischaemic injury, and a
    misdirected pupillomotor fibre can make an involved pupil look normal at
    rest, producing apparent pupil sparing.
  evidence:
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Primary aberrant regeneration was the presenting sign in a child with neurofibromatosis type 2."
    explanation: "Documents aberrant regeneration occurring in a structural (neoplastic) third nerve lesion. Marked PROVISIONAL because the supporting observation here is a single case within a small cohort."
  - reference: PMID:6830173
    reference_title: "Pupil sparing in oculomotor palsy: a brief review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Careful examination is also necessary to separate examples of apparent pupil sparing in cases of aberrant regeneration and in some instances of cavernous sinus compression."
    explanation: "Establishes aberrant regeneration as a source of apparent, rather than true, pupil sparing, which is the reason this node bears on the entry's central axis."
  cell_types:
  - preferred_term: peripheral nervous system neuron
    term:
      id: CL:2000032
      label: peripheral nervous system neuron
  - preferred_term: Schwann cell
    term:
      id: CL:0002573
      label: Schwann cell
  locations:
  - preferred_term: oculomotor nerve
    term:
      id: UBERON:0001643
      label: oculomotor nerve
  downstream:
  - target: Preserved Superficial Pupillomotor Function
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      This is the counterexample to the entry's central axis. A pupillomotor
      fibre that regrows into a somatic motor pathway can hold the pupil at
      near-normal size at rest, so a genuinely pupil-involving structural palsy
      is misread as pupil-sparing. The sparing here is apparent, not true, and
      it is produced by the repair process rather than by the site of the
      original insult.
    evidence:
    - reference: PMID:6830173
      reference_title: "Pupil sparing in oculomotor palsy: a brief review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Careful examination is also necessary to separate examples of apparent pupil sparing in cases of aberrant regeneration and in some instances of cavernous sinus compression."
      explanation: "States directly that aberrant regeneration produces examples of apparent pupil sparing that must be separated from true sparing on careful examination."
phenotypes:
- category: Ocular motor
  name: Ptosis
  description: >-
    Drooping of the upper eyelid from denervation of levator palpebrae
    superioris. May be partial or complete, and in complete palsy can occlude
    the eye and mask the diplopia.
  phenotype_term:
    preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  evidence:
  - reference: PMID:30592440
    reference_title: "The aetiologies of the unilateral oculomotor nerve palsy: a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oculomotor nerve palsy (ONP) is an important and common clinical diagnosis. Its main features are diplopia and ptosis."
    explanation: "Establishes ptosis as one of the two cardinal features of the syndrome."
- category: Ocular motor
  name: Ophthalmoplegia
  description: >-
    Weakness of the extraocular muscles supplied by cranial nerve III, leaving
    the eye deviated down and out under the unopposed lateral rectus and
    superior oblique.
  phenotype_term:
    preferred_term: Ophthalmoplegia
    term:
      id: HP:0000602
      label: Ophthalmoplegia
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical presentation includes ptosis, ophthalmoplegia, diplopia, and variable pupillary involvement, resulting in the characteristic down-and-out eye position in complete palsy."
    explanation: "Names ophthalmoplegia and the down-and-out position as the typical motor presentation."
- category: Visual
  name: Diplopia
  description: >-
    Binocular double vision from ocular misalignment; it resolves when either
    eye is covered and is often the presenting complaint.
  phenotype_term:
    preferred_term: Diplopia
    term:
      id: HP:0000651
      label: Diplopia
  evidence:
  - reference: PMID:30592440
    reference_title: "The aetiologies of the unilateral oculomotor nerve palsy: a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Oculomotor nerve palsy (ONP) is an important and common clinical diagnosis. Its main features are diplopia and ptosis."
    explanation: "Establishes diplopia as the other cardinal feature alongside ptosis."
- category: Pupillary
  name: Mydriasis
  subtype: Compressive
  description: >-
    Dilated, poorly reactive pupil from denervation of the iris sphincter. The
    hallmark of the pupil-involving pattern and of compressive aetiology.
  phenotype_term:
    preferred_term: Mydriasis
    term:
      id: HP:0011499
      label: Mydriasis
  evidence:
  - reference: PMID:39692993
    reference_title: "Oculomotor nerve palsy recovery following microsurgery vs. endovascular treatment of posterior communicating artery aneurysms: a comparative meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete ONP diagnosis is established when the simultaneous occurrence of ptosis, fixed mydriasis, diplopia, and ophthalmoplegia is observed."
    explanation: "Records fixed mydriasis as a defining component of complete aneurysmal third nerve palsy."
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 2% of aneurysms spared the pupil."
    explanation: "Shows how nearly universal pupil involvement is when the cause is an aneurysm."
- category: Pupillary
  name: Anisocoria
  description: >-
    Unequal pupil size when only one third nerve is affected. In the setting of
    rising intracranial pressure it is the "blown pupil" that signals uncal
    herniation.
  phenotype_term:
    preferred_term: Anisocoria
    term:
      id: HP:0009916
      label: Anisocoria
  evidence:
  - reference: PMID:30725793
    reference_title: "Uncal Herniation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Jonathan Hutchinson first described unilateral pupillary dilation (Hutchinson pupil), initially attributed to midbrain involvement."
    explanation: "The eponymous unilateral pupillary dilation of herniation is an anisocoria arising from third nerve compression."
- category: Pupillary
  name: Abnormal pupillary light reflex
  description: >-
    Loss of the efferent limb of the light reflex on the affected side, so the
    pupil fails to constrict to direct or consensual light while the afferent
    pathway is intact.
  phenotype_term:
    preferred_term: Abnormal pupillary light reflex
    term:
      id: HP:0007695
      label: Abnormal pupillary light reflex
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Parasympathetic fibers, located superficially, innervate the ciliary muscle and sphincter pupillae, mediating lens accommodation and pupillary constriction."
    explanation: "Identifies the efferent pathway whose interruption abolishes light-evoked pupillary constriction."
- category: Ocular alignment
  name: Exotropia
  description: >-
    Outward deviation of the affected eye produced by the unopposed lateral
    rectus once medial rectus function is lost.
  phenotype_term:
    preferred_term: Exotropia
    term:
      id: HP:0000577
      label: Exotropia
  evidence:
  - reference: PMID:30252368
    reference_title: "Cranial Nerve III Palsy (Oculomotor Palsy)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typical presentation includes ptosis, ophthalmoplegia, diplopia, and variable pupillary involvement, resulting in the characteristic down-and-out eye position in complete palsy."
    explanation: "The down-and-out position is an exotropia combined with a hypotropia."
- category: Pain
  name: Headache
  description: >-
    Headache or periorbital pain accompanies most aneurysmal palsies and a
    majority of diabetic microvascular palsies, and is integral to the RPON
    attack.
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "painful onset occurred with 94% of aneurysm and 69% of diabetic cases."
    explanation: "Quantifies painful onset in both the compressive and the microvascular subtypes."
  - reference: PMID:26021754
    reference_title: "From ophthalmoplegic migraine to cranial neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmoplegic migraine (OM)/recurrent painful ophthalmoplegic neuropathy (RPON) is a rare disease consisting of recurrent unilateral headache accompanied or followed by ipsilateral ophthalmoplegia."
    explanation: "Supports headache as a defining component of the RPON attack."
- category: Visual development
  name: Amblyopia
  subtype: Congenital
  description: >-
    Failure of normal visual acuity development in the affected eye when the
    palsy occurs during the amblyogenic period, driven by misalignment and by
    lid occlusion from ptosis.
  phenotype_term:
    preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amblyopia developed in 7 (39%) children and was successfully treated in 5 of the 7 (71%)."
    explanation: "Quantifies amblyopia in a paediatric third nerve palsy cohort and its response to occlusion therapy."
- category: Vascular
  name: Posterior communicating artery aneurysm
  subtype: Compressive
  description: >-
    The causative lesion in the archetypal pupil-involving palsy. Its
    proximity to the cisternal third nerve is why it declares itself as an
    ocular motor syndrome, sometimes before it ruptures.
  phenotype_term:
    preferred_term: Posterior communicating artery aneurysm
    term:
      id: HP:0031773
      label: Posterior communicating artery aneurysm
  evidence:
  - reference: PMID:33845117
    reference_title: "Oculomotor nerve palsy due to posterior communicating artery aneurysm: Clipping vs coiling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Posterior communicating artery aneurysms (PCoAA) usually present with brain hemorrhage, but they might present with oculomotor nerve palsy (ONP) in about one out of five patients."
    explanation: "Directly links the aneurysm to third nerve palsy as a presenting syndrome and quantifies how often."
environmental:
- name: Tobacco smoking
  description: >-
    Smoking is one of the vascular risk factors whose presence is required by
    the operational definition of microvascular oculomotor nerve palsy, acting
    through small-vessel disease of the nerve's own blood supply rather than
    through any nerve-specific toxicity.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  influences_mechanisms:
  - target: Endoneurial Microvascular Ischaemia of the Oculomotor Nerve Core
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Smoking predisposes to the endoneurial small-vessel disease that produces
      ischaemic injury to the core of the nerve; it is not itself the injury.
    evidence:
    - reference: PMID:38411317
      reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "with at least one vascular risk factor (hypertension, diabetes mellitus, dyslipidemia or smoking)"
      explanation: "Smoking is one of the vascular risk factors the anchoring cohort required before assigning a microvascular aetiology."
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predilection for men in microvascular etiology may be related to a higher prevalence of vascular risk factors such as diabetes, hypertension and smoking in men in the Republic of Korea"
    explanation: >-
      Names smoking among the vascular risk factors the anchoring cohort ties to
      the microvascular aetiology, which is what makes it a relevant exposure for
      this disease rather than a general health risk.
- name: Head trauma
  description: >-
    Blunt head injury, typically from road traffic collision or fall,
    displaces the brain relative to the skull base and stretches the nerve
    where it is tethered. This is the initiating exposure of the traumatic
    subtype and the leading cause in inpatient and paediatric series.
  influences_mechanisms:
  - target: Traumatic Stretch Injury of the Oculomotor Nerve at Fixed Tether Points
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Head trauma is the direct initiating event of the stretch injury; the
      palsy is dated from it.
    evidence:
    - reference: PMID:38411317
      reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A traumatic cause was defined when there was a documented onset of oculomotor nerve palsy following head trauma and no other disorders to explain the oculomotor nerve palsy better."
      explanation: "States the temporal head-trauma-then-palsy relation that makes this exposure the trigger of the traumatic mechanism."
  notes: >-
    Deliberately left without an exposure_term. ECTO was searched for a head
    injury, traumatic brain injury, and physical trauma exposure concept and
    has none; per the dismech-terms rule that no term beats a bad one, no
    loosely related CURIE was substituted.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Even though microvascular, traumatic and intracranial aneurysms are the most common causes of oculomotor nerve palsy"
    explanation: >-
      Establishes trauma as one of the most common causes of oculomotor nerve
      palsy, which is the disease-level claim this exposure entry makes.
treatments:
- name: Microsurgical Clipping of a Posterior Communicating Artery Aneurysm
  description: >-
    Open neurosurgical clipping of the aneurysm removes the mass compressing
    the cisternal nerve. Because the mechanism of injury is mass effect,
    relieving it early is what gives the nerve a chance to recover, and
    clipping produces faster recovery than endovascular treatment in the first
    year even though long-term rates converge.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: neurosurgical procedure
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  target_mechanisms:
  - target: Extrinsic Compression of the Cisternal Oculomotor Nerve
    treatment_effect: INHIBITS
    description: >-
      Clipping excludes the aneurysm from the circulation and decompresses the
      nerve, acting directly on the compressive node.
    evidence:
    - reference: PMID:33845117
      reference_title: "Oculomotor nerve palsy due to posterior communicating artery aneurysm: Clipping vs coiling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Surgical clipping is superior to endovascular coiling in terms of complete recovery among patients with ONP due to PCoAAs."
      explanation: "Supports clipping as acting on the compressive mechanism with better complete-recovery outcomes."
  evidence:
  - reference: PMID:39692993
    reference_title: "Oculomotor nerve palsy recovery following microsurgery vs. endovascular treatment of posterior communicating artery aneurysms: a comparative meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, microsurgical clipping of PComA aneurysms demonstrated a significantly higher likelihood of ONP recovery compared to EVT at 1,3,6, and 12 months follow-up."
    explanation: "Meta-analytic support for earlier nerve recovery after clipping than after endovascular treatment."
  - reference: PMID:39692993
    reference_title: "Oculomotor nerve palsy recovery following microsurgery vs. endovascular treatment of posterior communicating artery aneurysms: a comparative meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest microsurgery leads to prompt ONP recovery from PComA aneurysms, while EVT shows potential for delayed favorable recovery; both treatments yield short-term recovery when administered early."
    explanation: "Qualifies the advantage as one of speed rather than of ultimate outcome, so the entry does not overstate clipping's superiority."
- name: Endovascular Coiling of a Posterior Communicating Artery Aneurysm
  description: >-
    Endovascular occlusion of the aneurysm sac secures the lesion against
    rupture and, less directly than clipping, reduces the pulsatile mass effect
    on the nerve. Nerve recovery is slower than after clipping but comparable
    by 18 to 24 months, and older patients may do relatively better with it.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: embolization therapy
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_mechanisms:
  - target: Extrinsic Compression of the Cisternal Oculomotor Nerve
    treatment_effect: INHIBITS
    description: >-
      Coil occlusion removes the pulsatile haemodynamic stress transmitted to
      the adjacent nerve, though it leaves the aneurysm sac in place.
    evidence:
    - reference: PMID:39692993
      reference_title: "Oculomotor nerve palsy recovery following microsurgery vs. endovascular treatment of posterior communicating artery aneurysms: a comparative meta-analysis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "However, recent literature has reported favorable ONP recovery outcomes after endovascular treatment (EVT) suggesting other mechanisms associated with ONP occurrence, such as the pulsatile hemodynamic stress (water hammer effect) of cerebral aneurysms"
      explanation: "Supports pulsatile haemodynamic stress, not sac volume alone, as part of the compressive mechanism that endovascular treatment addresses."
  evidence:
  - reference: PMID:30455133
    reference_title: "Posterior communicating aneurysm with oculomotor nerve palsy: Predictors of nerve recovery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the aneurysm treatment modality was not correlated with nerve recovery in either analysis."
    explanation: "A single-centre series in which modality did not predict recovery, tempering the meta-analytic preference for clipping."
- name: Vascular Risk Factor Management in Microvascular Palsy
  description: >-
    There is no treatment directed at the ischaemic nerve itself. Management is
    optimisation of glycaemic control and of the other vascular risk factors,
    plus observation, since the natural history is spontaneous recovery.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Endoneurial Microvascular Ischaemia of the Oculomotor Nerve Core
    treatment_effect: MODULATES
    description: >-
      Risk factor control acts on the small-vessel disease upstream of
      endoneurial ischaemia rather than on the nerve injury already sustained.
    evidence:
    - reference: PMID:39510537
      reference_title: "Ocular Motor Mononeuropathies in Diabetes Mellitus: A Brief Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment includes optimised glycaemic control and management of vascular risk factors."
      explanation: "States the management approach directed at the microvascular mechanism."
  evidence:
  - reference: PMID:39510537
    reference_title: "Ocular Motor Mononeuropathies in Diabetes Mellitus: A Brief Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spontaneous recovery is seen in many cases."
    explanation: "Supports observation as reasonable management because the natural history is favourable."
- name: Botulinum Toxin Injection for Acute Ocular Misalignment
  description: >-
    Chemodenervation of the antagonist muscle reduces the deviation and the
    diplopia during the acute phase. It is symptomatic: it does not act on the
    nerve lesion, and its benefit over expectant management is confined to
    acute palsy.
  therapeutic_modality: OTHER
  notes: >-
    Modality recorded as OTHER deliberately. Botulinum toxin is a bacterial
    protein toxin used as a pharmacological blocking agent, so it is neither a
    SMALL_MOLECULE nor a PROTEIN_REPLACEMENT (nothing deficient is being
    replaced). The machine-readable identity is carried by treatment_term plus
    therapeutic_agent.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  target_phenotypes:
  - preferred_term: Diplopia
    term:
      id: HP:0000651
      label: Diplopia
  evidence:
  - reference: PMID:38112391
    reference_title: "Botulinum Toxin Injection for the Treatment of Third, Fourth, and Sixth Nerve Palsy: A Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall treatment success rate in acute and chronic nerve palsy was 79% and 33%, respectively."
    explanation: "Quantifies the sharp difference in benefit between acute and chronic palsy."
  - reference: PMID:38112391
    reference_title: "Botulinum Toxin Injection for the Treatment of Third, Fourth, and Sixth Nerve Palsy: A Meta-Analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Botulinum toxin can be used for the treatment of acute third, fourth, and sixth nerve palsy, especially in patients with acute palsy and more severe tropia."
    explanation: "Supports use restricted to the acute setting; the meta-analysis pools third, fourth, and sixth nerve palsy rather than isolating cranial nerve III."
- name: Strabismus and Ptosis Surgery for Residual Deficit
  description: >-
    Once recovery has plateaued, surgery addresses the mechanical consequences
    rather than the nerve: muscle shortening or lengthening, transposition,
    globe fixation, and ptosis repair, usually in combination. The aim is
    alignment, field of single vision, and appearance, not reinnervation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Ptosis
    term:
      id: HP:0000508
      label: Ptosis
  - preferred_term: Exotropia
    term:
      id: HP:0000577
      label: Exotropia
  - preferred_term: Diplopia
    term:
      id: HP:0000651
      label: Diplopia
  evidence:
  - reference: PMID:38303488
    reference_title: "Surgical management of oculomotor nerve palsy - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These included: muscle shortening and lengthening procedures, muscle transposition, globe fixation and ptosis surgery."
    explanation: "Enumerates the surgical techniques used for residual third nerve palsy."
  - reference: PMID:38303488
    reference_title: "Surgical management of oculomotor nerve palsy - a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strabismus surgery for OMN palsy can be approached through a variety of different techniques to improve the quality of life, independence and aesthetics for the patient."
    explanation: "States the goals of surgery as functional and aesthetic rehabilitation rather than nerve recovery."
- name: High-Dose Corticosteroid Therapy for Inflammatory Palsy
  description: >-
    In Tolosa-Hunt syndrome and other steroid-responsive inflammatory third
    nerve palsies, high-dose corticosteroids shorten the symptomatic episode
    and the total treatment course. The prognosis is favourable but recurrence
    during or after tapering is common, so response is not the same as cure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:37853245
    reference_title: "Recurrence and long-term outcomes of Tolosa-Hunt syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-dose corticosteroids can be an effective initial treatment and reduce the total treatment duration."
    explanation: "Supports high-dose corticosteroids as effective initial therapy for the prototypical inflammatory cause."
  - reference: PMID:37853245
    reference_title: "Recurrence and long-term outcomes of Tolosa-Hunt syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Recurrence occurred during steroid tapering as part of the initial treatment in seven, while in 18 patients, it happened after the successful termination of the initial treatment."
    explanation: "Qualifies the benefit: a quarter of patients recurred, so steroid responsiveness does not amount to durable cure."
- name: Amblyopia Therapy in Childhood Palsy
  description: >-
    In children within the amblyogenic period, occlusion therapy for the
    sound eye protects visual development, which is a different and often more
    consequential target than the ocular motor deficit itself.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: therapeutic procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_phenotypes:
  - preferred_term: Amblyopia
    term:
      id: HP:0000646
      label: Amblyopia
  evidence:
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Good visual acuity was obtained in children within the amblyogenic age group with appropriate occlusion therapy."
    explanation: "Supports occlusion therapy as effective for the amblyopia that complicates childhood third nerve palsy."
diagnosis:
- name: MRI of the oculomotor nerve with vascular imaging
  description: >-
    Because the syndrome is defined by the affected nerve rather than by a
    single lesion, imaging is what assigns the aetiological subtype. MRI
    evaluates the nerve along its course from midbrain to orbit; vascular
    imaging is directed at the aneurysm that must not be missed. In children,
    where pupillary signs carry no localizing value, imaging is not optional.
  evidence:
  - reference: PMID:36116851
    reference_title: "The Oculomotor Nerve: Anatomy and Pathology."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Magnetic resonance imaging (MRI) is the best imaging exam to evaluate patients with clinical signs of third cranial nerve palsy."
    explanation: "Establishes MRI as the primary imaging modality for evaluating third cranial nerve palsy."
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Children with oculomotor nerve palsy require neuroimaging."
    explanation: "Supports imaging as mandatory in children, where the pupil cannot be used to triage compressive causes."
differential_diagnoses:
- name: Mimics of oculomotor nerve palsy
  description: >-
    Several conditions reproduce parts of the syndrome without a third nerve
    lesion, and each must be excluded before the diagnosis is assigned:
    myasthenia gravis (fatiguable ptosis and ophthalmoplegia, pupil always
    spared), thyroid-associated orbitopathy and orbital myositis (restrictive
    rather than paralytic), Horner syndrome and Adie tonic pupil (anisocoria of
    other origin), congenital ptosis, and Duane retraction syndrome.
  distinguishing_features:
  - >-
    A true third nerve palsy weakens a defined muscle set while sparing the
    superior oblique and lateral rectus.
  - >-
    Thyroid-associated orbitopathy and orbital myositis limit movement
    mechanically rather than by denervation.
  - >-
    Myasthenia gravis fluctuates, is fatiguable, and never dilates the pupil.
  - >-
    Horner syndrome produces a small rather than a large pupil.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Particular attention was paid to exclude disorders that may mimic oculomotor nerve palsy, such as exotropia, blepharoptosis, congenital ptosis, anisocoria of other causes"
    explanation: "The anchoring cohort enumerates the mimics it excluded, which is the differential this entry adopts."
discussions:
- discussion_id: pupil_rule_exceptions
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Preserved Superficial Pupillomotor Function
  prompt: >-
    How far can the pupil-involving versus pupil-sparing distinction be trusted
    to separate compressive from ischaemic third nerve palsy?
  rationale: >-
    The anatomical premise is sound and the statistical association is strong:
    only 2% of aneurysmal palsies spare the pupil, and about three quarters of
    vasculopathic palsies do spare it. But the rule has documented failure modes
    in both directions. Pupil sparing occurs in a minority of compressive
    subarachnoid lesions and in a large proportion of cavernous sinus
    compressive lesions, and aberrant regeneration can manufacture apparent
    sparing. Conversely, about half of diabetic microvascular palsies in one
    large inpatient series did involve the pupil, which the author attributed to
    coexisting autonomic neuropathy. The rule should therefore be curated as a
    likelihood modifier, not a decision rule, and it does not transfer to
    children at all.
  status: OPEN
  evidence:
  - reference: PMID:6830173
    reference_title: "Pupil sparing in oculomotor palsy: a brief review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two case reports and a review of the literature disclose that pupil sparing occurs in a small proportion of intraaxial and compressive subarachnoid oculomotor nerve lesions and in a large proportion of compressive cavernous sinus oculomotor nerve lesions."
    explanation: "Documents the compressive lesions that nevertheless spare the pupil, the first failure mode of the rule."
  - reference: PMID:21059515
    reference_title: "Third nerve palsy: analysis of 1400 personally-examined inpatients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 234 patients with diabetes, microvascular ischemia was the cause of TNP in only two-thirds (five had aneurysms) and 53% of those with diabetic microvascular ischemia had pupillary involvement-often bilateral, suggesting concomitant autonomic neuropathy."
    explanation: "Documents the opposite failure mode - microvascular palsy that does involve the pupil - in a majority of diabetic cases in this inpatient series."
  - reference: PMID:16391633
    reference_title: "Oculomotor nerve palsy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their pupillary signs, unlike those of adults, are not helpful in differentiating compressive etiologies from other causes."
    explanation: "Establishes that the rule does not apply in paediatric practice at all."
- discussion_id: pattern_of_motor_paresis_as_a_second_axis
  kind: EMERGING_HYPOTHESIS
  attaches_to:
  - pathophysiology#Somatic Motor Fibre Conduction Failure
  prompt: >-
    Can the spatial pattern of extraocular muscle weakness discriminate
    vasculopathic from aneurysmal palsy when the pupil is uninformative?
  rationale: >-
    If the pupil rule fails in exactly the cases where it is most needed, a
    second discriminator would be valuable. One series proposed that incomplete
    pupil-sparing vasculopathic palsies show diffuse weakness across all cranial
    nerve III muscles, whereas pupil-sparing aneurysmal palsies show focal
    weakness confined to some of them. The proposal follows naturally from the
    mechanism - diffuse endoneurial ischaemia versus focal external contact -
    but the authors were explicit that it needs confirmation, and no larger
    validation has been curated here.
  status: OPEN
  evidence:
  - reference: PMID:11756854
    reference_title: "Patterns of extraocular muscle weakness in vasculopathic pupil-sparing, incomplete third nerve palsy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that distinguishing these two patterns of EOM paresis may be helpful in differentiating between vasculopathic and aneurysmal 3NP. Future studies will be needed to confirm the clinical utility of this hypothesis."
    explanation: "The authors state the hypothesis and its unvalidated status in their own words, which is why this is curated as EMERGING_HYPOTHESIS rather than as mechanism."
- discussion_id: rpon_mechanism_unresolved
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Focal Oculomotor Nerve Inflammation with Blood-Nerve Barrier Breakdown
  prompt: >-
    What is the primary lesion in recurrent painful ophthalmoplegic neuropathy -
    ischaemia, inflammation, demyelination, or compression?
  rationale: >-
    RPON was renamed away from "ophthalmoplegic migraine" precisely because the
    MRI appearance indicates a neuropathy, but the rename did not settle what
    causes the neuropathy. Competing hypotheses of nerve compression, ischaemia,
    and inflammation or demyelination are all still live, no histology is
    available, and treatment with corticosteroids has never been tested against
    the natural history of spontaneous remission. Because attacks are rare
    (5/633 in a large aetiological series) the gap is unlikely to close without
    a multicentre registry.
  status: OPEN
  proposed_experiments:
  - experiment_id: rpon_prospective_registry
    name: Prospective multicentre RPON registry with standardised acute imaging
    description: >-
      Enrol consecutive RPON attacks across centres with a fixed acute MRI
      protocol covering the cisternal nerve and root entry zone, repeated in
      remission, to establish whether enhancement resolves completely and
      whether it precedes or follows the ophthalmoplegia.
  evidence:
  - reference: PMID:36694449
    reference_title: "Recurrent Painful Ophthalmoplegic Neuropathy: A case report with atypical features and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Several hypotheses have been proposed, including nerve compression, ischemia or inflammation/demyelination, but none has been completely accepted."
    explanation: "States directly that no mechanism for RPON is established."
  - reference: PMID:35659705
    reference_title: "Diagnostic controversies in recurrent painful ophthalmoplegic neuropathy: single case report with a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no evidence supporting a specific treatment."
    explanation: "Confirms the therapeutic corollary of the mechanistic gap."
- discussion_id: scope_boundary_congenital_dysinnervation
  kind: INTERPRETATION
  attaches_to:
  - pathophysiology#Congenital Oculomotor Nerve Hypoplasia or Aplasia
  prompt: >-
    Should congenital fibrosis of the extraocular muscles and the other
    congenital cranial dysinnervation disorders be curated inside this entry?
  rationale: >-
    They should not. CFEOM (KIF21A, TUBB3, TUBA1A, PHOX2A) and the wider CCDD
    group are distinct, separately named genetic entities with their own MONDO
    identifiers, and the large aetiological series that anchors this entry
    explicitly excluded congenital cranial dysinnervation disorders when
    assigning its congenital category. The congenital subtype curated here is
    isolated congenital oculomotor nerve palsy with imaging-demonstrated nerve
    hypoplasia, thinning, or agenesis. The distinction is recorded because a
    deep-research report generated for this entry did bundle CFEOM genetics
    into it, and that content was deliberately not imported.
  status: RESOLVED
  resolution_note: >-
    Scope fixed to acquired and isolated congenital oculomotor nerve palsy;
    CFEOM and CCDD genetics excluded and left to their own entries.
  evidence:
  - reference: PMID:38411317
    reference_title: "Etiological distribution of isolated oculomotor nerve palsy: analysis of 633 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital oculomotor nerve palsy was diagnosed when the patients had an infantile onset of ophthalmoplegia after excluding congenital cranial dysinnervation disorders, such as Duane syndrome and congenital Horner syndrome"
    explanation: "The anchoring series states its own exclusion of congenital cranial dysinnervation disorders, which is the boundary this entry adopts."
notes: >-
  Curation scope. This entry models the oculomotor nerve palsy syndrome
  (MONDO:0001309) as an aetiologically heterogeneous convergence on one motor
  and one autonomic deficit, organised around the somatotopic segregation of
  the nerve's fibres. Related entries in the knowledge base that intersect it
  are Intracranial_Berry_Aneurysm, which carries oculomotor nerve palsy as a
  phenotype of the aneurysm rather than as a disease in its own right, and
  Bells_Palsy, the analogous single-cranial-nerve entry for cranial nerve VII;
  neither is duplicated here. Congenital cranial dysinnervation disorders
  (CFEOM, Duane retraction syndrome) are deliberately out of scope - see the
  scope_boundary_congenital_dysinnervation discussion.

  Deep research. `just research-disorder falcon Oculomotor_Nerve_Palsy` was run
  on 2026-08-20 (research/Oculomotor_Nerve_Palsy-deep-research-falcon.md).
  `just preflight-dr` returned SKIP, as expected for an acquired syndrome for
  which MONDO records no causal gene, so the manual named-entity-confusion
  checks in CLAUDE.md section 2b were performed instead: the MONDO record
  (`runoak -i sqlite:obo:mondo info MONDO:0001309 -O obo`) carries no causal
  gene and no OMIM xref, its synonyms are all plain restatements of "third
  nerve palsy" with no competing eponym, and the report explicitly names
  MONDO:0001309 and the correct clinical entity. The report was judged not to
  be a named-entity confusion, but its top gene mentions (TUBB3, KIF21A,
  TUBA1A, PHOX2A, CHN1) revealed a scope drift into congenital cranial
  dysinnervation disorders; that material was excluded. The report was used as
  leads only, and every PMID and snippet in this entry was independently
  fetched and verified against the local reference cache.

  Clinical trials. No clinical_trials block is curated, and the omission is
  deliberate rather than an oversight. The deep-research run surfaced three
  registrations: NCT03099447 and NCT03461809 are acupuncture studies whose
  registry status is UNKNOWN with no posted results, and NCT03059420 is a
  congenital cranial dysinnervation disorder genetics registry that falls
  inside the scope boundary this entry draws. None of the three would support
  an evidence-bearing claim about this syndrome today.

  Anatomical provenance. The peripheral position of the pupillomotor fibres
  traces to Kerr and Hollowell's experimental work (PMID:14213479) and to
  Sunderland and Hughes. Neither has a retrievable abstract in the reference
  cache, so neither is quoted as evidence; the claim is instead anchored on
  contemporary sources whose text can be verified.

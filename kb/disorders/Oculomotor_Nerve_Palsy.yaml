name: Oculomotor Nerve Palsy
creation_date: "2026-08-20T09:00:00Z"
category: Complex
categories:
- Neurological Disease
- Cranial Neuropathy
description: >-
  Oculomotor (third cranial) nerve palsy is paralysis or paresis of cranial
  nerve III, producing ptosis, ophthalmoplegia with a characteristic
  "down-and-out" eye, diplopia, and variable pupillary involvement. It is a
  syndrome with many causes rather than a single disease: microvascular
  ischaemia, compressive vascular anomalies (above all posterior communicating
  artery aneurysm), neoplasia, inflammation, trauma, congenital nerve
  maldevelopment, and recurrent painful ophthalmoplegic neuropathy each reach
  the same final common deficit. The central mechanistic axis of the entry is
  the somatotopic segregation of the nerve's two fibre populations: the
  preganglionic parasympathetic pupillomotor fibres run superficially at the
  periphery of the nerve, whereas the somatic motor fibres run deeper. Extrinsic
  compression injures the superficial fibres early and takes the pupil, while
  ischaemia of the endoneurial core preferentially damages the deeper somatic
  fibres and characteristically spares it. The rule is powerful but not
  absolute, and the exceptions are curated here alongside it.

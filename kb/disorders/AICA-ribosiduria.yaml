name: AICA-ribosiduria
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  AICA-ribosiduria is an ultra-rare autosomal recessive inborn error of de novo
  purine synthesis caused by biallelic pathogenic variants in ATIC, which
  encodes the bifunctional enzyme 5-aminoimidazole-4-carboxamide ribonucleotide
  (AICAR) formyltransferase / IMP cyclohydrolase that catalyzes the last two
  steps of the pathway. Loss of the transformylase activity blocks conversion
  of AICAR (ZMP) toward IMP, so ZMP and its di- and triphosphates accumulate in
  erythrocytes and its dephosphorylated riboside (AICA-riboside, acadesine) is
  excreted massively in urine. The disorder is defined clinically as the
  syndromic association of severe-to-profound global neurodevelopmental
  impairment, severe visual impairment due to chorioretinal atrophy, ante- and
  postnatal growth impairment, and severe scoliosis, with coarse facies,
  frequent and often pharmacoresistant early-onset epilepsy, and less
  frequently aortic coarctation, chronic hepatic cytolysis, nephrocalcinosis
  and minor genital malformations. A pair of siblings with milder
  neurodevelopmental and visual involvement and no scoliosis widened the
  spectrum. Purine deficiency has not been demonstrated in patients; the
  leading explanation of the phenotype is cytotoxicity of the accumulated
  AICA-riboside and its phosphorylated forms, and a purine-enriched diet that
  suppresses de novo synthesis reduced the metabolite excretion in one patient.
synonyms:
- ATIC deficiency
- AICA-ribosiduria due to ATIC deficiency
- AICAR transformylase/IMP cyclohydrolase deficiency
- 5-amino-4-imidazolecarboxamide ribosiduria
parents:
- inborn error of purine metabolism
- disorder of de novo purine synthesis
disease_term:
  preferred_term: AICA-ribosiduria
  term:
    id: MONDO:0012099
    label: AICA-ribosiduria

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients carry biallelic ATIC variants, either compound
    heterozygous (the index patient: p.Lys426Arg with a frameshift; the Indian
    patient: p.Lys426Arg with a c.1321-2A>G splice variant, each inherited from
    one heterozygous parent) or shared by affected siblings.
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(AICA)-ribosiduria is an exceedingly rare autosomal recessive condition resulting from the disruption of the bifunctional purine biosynthesis protein PURH (ATIC)"
    explanation: The case series defining the phenotype states autosomal recessive inheritance.
  - reference: PMID:35637059
    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis of parents showed the father to be a heterozygous carrier for the splice site variant and the mother, a heterozygous carrier for the missense variant."
    explanation: Parental segregation of the two variants in trans, with unaffected heterozygous parents, is consistent with recessive inheritance.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than ten patients are published. The index case (2004) was followed
    by three patients from two families and a long-term update of the index
    case (2020), a patient from India (2022), two siblings with a milder
    phenotype (2023), and a teenage patient carrying a previously unreported
    p.Gln214His variant (2024). Galli et al. counted six previously reported
    cases before adding their two siblings. No population-based prevalence or
    incidence estimate exists.
  evidence:
  - reference: PMID:36367252
    reference_title: "Expanding the spectrum of clinical severity of AICA-ribosiduria: Report of two siblings with mild phenotype caused by a novel pathogenic variant in ATIC gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only six cases have been reported presenting a severe phenotype"
    explanation: Gives the count of published cases before the two siblings reported in the same paper.
  - reference: PMID:35637059
    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder has been previously reported in only 4 cases worldwide, and herein, we report the first from India."
    explanation: Independent case count at the time of the fifth reported patient.

mechanistic_hypotheses:
- hypothesis_group_id: aicar_riboside_cytotoxicity
  hypothesis_label: >-
    Accumulated AICA-riboside and ZMP are cytotoxic to developing tissues
  status: CANONICAL
  description: >-
    The block at the AICAR transformylase step causes accumulation of ZMP
    (AICAR) and its phosphorylated derivatives inside cells and of
    AICA-riboside in body fluids. The favoured explanation of the
    neurological, retinal, growth and skeletal phenotype is a direct toxic
    effect of these accumulated intermediates. ZMP is an AMP mimetic that
    activates AMP-activated protein kinase, one proposed route of toxicity,
    but no study has measured AMPK activity in patient tissue.
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Data from literature points toward a cytotoxic mechanism of the accumulated AICA-riboside."
    explanation: The phenotype-defining case series summarizes the literature as favouring AICA-riboside cytotoxicity.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "accumulation of AICA-riboside is the biochemical hallmark and presumed pathomechanism of the condition"
    explanation: States AICA-riboside accumulation as the presumed disease mechanism in the background of a treatment report.
- hypothesis_group_id: purine_nucleotide_deficiency
  hypothesis_label: >-
    Insufficient de novo purine supply during development
  status: ALTERNATIVE
  description: >-
    The alternative explanation is a shortage of purine nucleotides in tissues
    that depend on de novo synthesis during embryogenesis and organogenesis.
    It is weakened by the observation that purine deficiency has not been
    found in patients, which is attributed to compensation by the salvage
    pathway.
  evidence:
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pathogenesis of ATIC deficiency may be related to the toxic effects of accumulated intermediate metabolites, or the deficiency of purine synthesis due to the block of de novo purine synthesis pathway"
    explanation: A review names both substrate toxicity and purine deficiency as candidate pathomechanisms.
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The absence of purine is not found in ATIC deficiency, which may be related to the compensatory synthesis of purine by the salvage synthesis pathway."
    explanation: Purine deficiency has not been observed in patients, which argues against this hypothesis as the main mechanism.

pathophysiology:
- name: ATIC Bifunctional Enzyme Deficiency
  description: >-
    Biallelic ATIC variants abolish or severely reduce the AICAR
    formyltransferase (transformylase) activity of the bifunctional enzyme,
    while the IMP cyclohydrolase activity is less affected. In the index
    patient's fibroblasts transformylase activity was profoundly deficient and
    cyclohydrolase activity was 40% of normal, and recombinant enzyme carrying
    the recurrent p.Lys426Arg substitution had no transformylase activity.
    Ramond et al. proposed that loss of transformylase activity causes a more
    severe phenotype than loss of cyclohydrolase activity.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATIC
    term:
      id: hgnc:794
      label: ATIC
  genetic_context:
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Reported alleles include the recurrent missense p.Lys426Arg
      (c.1277A>G), which abolishes transformylase activity of the recombinant
      protein, frameshift and nonsense (p.Arg141Ter) alleles, a canonical
      splice-site variant (c.1321-2A>G), and missense p.Thr585Ala and
      p.Gln214His.
  molecular_functions:
  - preferred_term: AICAR formyltransferase activity
    term:
      id: GO:0004643
      label: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
    modifier: DECREASED
  - preferred_term: IMP cyclohydrolase activity
    term:
      id: GO:0003937
      label: IMP cyclohydrolase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AICAR transformylase was profoundly deficient, whereas the IMP cyclohydrolase level was 40% of normal."
    explanation: Enzyme assays in patient fibroblasts show a severe transformylase defect with partial cyclohydrolase loss.
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant protein carrying mutation K426R completely lacks AICAR transformylase activity."
    explanation: The recombinant mutant protein establishes that the missense allele itself abolishes transformylase activity.
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alteration of the transformylase activity of ATIC might result in a more severe impairment than the alteration of the cyclohydrolase activity."
    explanation: Genotype-phenotype comparison across four patients suggests the transformylase activity is the clinically critical one.
  downstream:
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    causal_link_type: DIRECT
    description: >-
      Loss of transformylase activity stops conversion of AICAR to FAICAR and
      thus to IMP, the terminal product of the pathway.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Incubation of her fibroblasts with AICA-riboside led to accumulation of AICAR, not observed in control cells, suggesting impairment of the final steps of purine biosynthesis"
      explanation: Patient fibroblasts cannot metabolize AICAR onward, showing the pathway is blocked at the ATIC step.
  - target: Failure of Purinosome Assembly
    causal_link_type: DIRECT
    description: >-
      Mutant ATIC destabilizes assembly of the purinosome, the transient
      multienzyme complex of de novo purine synthesis enzymes.
    evidence:
    - reference: PMID:22180458
      reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we proved in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency that various mutations of ATIC and ADSL destabilize to various degrees of purinosome assembly"
      explanation: Immunolabeling of patient fibroblasts shows impaired purinosome assembly with mutant ATIC.

- name: Failure of Purinosome Assembly
  description: >-
    The purinosome is a cytosolic complex of the de novo purine synthesis
    enzymes that cells assemble when purines are depleted. Its assembly
    requires structurally intact ATIC, and patient fibroblasts assemble it
    poorly, so the defect extends beyond the loss of one catalytic step to the
    organization of the whole pathway.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: purine nucleotide biosynthetic process
    term:
      id: GO:0006164
      label: purine nucleotide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22180458
    reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the assembly of functional purinosomes is fully dependent on the presence of structurally unaffected ATIC and ADSL complexes"
    explanation: Establishes that purinosome assembly requires intact ATIC.
  downstream:
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the assembled complex is expected to reduce channelling of
      intermediates through the pathway; the flux consequence has not been
      measured separately in ATIC-deficient cells.

- name: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
  description: >-
    De novo purine synthesis stops at AICAR. Genome-edited HeLa cells lacking
    ATIC accumulate the enzyme substrate, reproducing the metabolic block.
    Purine nucleotide deficiency has not been documented in patients, which is
    attributed to compensation through purine salvage, so the direct
    consequence of the block that is measurable in patients is substrate
    accumulation rather than purine depletion.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: "'de novo' IMP biosynthetic process"
    term:
      id: GO:0006189
      label: "'de novo' IMP biosynthetic process"
    modifier: DECREASED
  evidence:
  - reference: PMID:27590927
    reference_title: "CRISPR-Cas9 induced mutations along de novo purine synthesis in HeLa cells result in accumulation of individual enzyme substrates and affect purinosome formation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In all model cell lines with the exception of one, an accumulation of the substrate(s) for the knocked out enzyme was identified."
    explanation: Knockout cell lines for individual pathway enzymes, including ATIC, accumulate the blocked substrate.
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "When the ATIC gene is varied, the effect on AICAR TF is greater than that on IMP CH, resulting in the accumulation of AICAR and its dephosphorylation product ATIC-riboside."
    explanation: Review summary linking the predominant transformylase defect to AICAR accumulation.
  downstream:
  - target: Accumulation of ZMP and AICA-Riboside
    causal_link_type: DIRECT
    description: >-
      The unconverted substrate AICAR (ZMP) builds up in cells and its
      dephosphorylated riboside is released into body fluids.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ZMP and its di- and triphosphate accumulated in the patient's erythrocytes."
      explanation: Accumulation of the blocked substrate and its phosphorylated derivatives was measured in the index patient's erythrocytes.

- name: Accumulation of ZMP and AICA-Riboside
  description: >-
    ZMP (AICAR) and its di- and triphosphates accumulate intracellularly, and
    AICA-riboside is excreted in large amounts in urine; succinyladenosine, a
    dephosphorylated intermediate from further up the same pathway, is also
    excreted in excess. This metabolite pattern is the biochemical hallmark
    and the diagnostic handle of the disorder.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: ZMP (AICAR)
    term:
      id: CHEBI:18406
      label: AICA ribonucleotide
    modifier: INCREASED
  - preferred_term: AICA-riboside
    term:
      id: CHEBI:28498
      label: acadesine
    modifier: INCREASED
  - preferred_term: succinyladenosine
    term:
      id: CHEBI:71169
      label: succinyladenosine
    modifier: INCREASED
  cell_types:
  - preferred_term: erythrocyte
    term:
      id: CL:0000232
      label: erythrocyte
  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a positive urinary Bratton-Marshall test led to identification of a massive excretion of 5-amino-4-imidazolecarboxamide (AICA)-riboside, the dephosphorylated counterpart of AICAR"
    explanation: Massive urinary AICA-riboside excretion was the finding that identified the disorder.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: Documents excess excretion of both AICA-riboside and succinyladenosine in a further patient.
  downstream:
  - target: ZMP-Mediated AMPK Activation
    causal_link_type: DIRECT
    hypothesis_groups:
    - aicar_riboside_cytotoxicity
    description: >-
      ZMP is an AMP mimetic and allosteric activator of AMP-activated protein
      kinase; this is established pharmacology, not a measurement in patients.
    evidence:
    - reference: PMID:32939338
      reference_title: "The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "ZMP is an adenosine monophosphate (AMP) mimetic and a known activator of AMP-activated protein kinase (AMPK)."
      explanation: States the established ZMP-AMPK relationship that motivates this edge.
  - target: Cytotoxic Injury to Developing Neural, Retinal and Skeletal Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - aicar_riboside_cytotoxicity
    description: >-
      The accumulated intermediates are proposed to be toxic to developing
      tissues; the cellular targets of that toxicity are not established.
    evidence:
    - reference: PMID:32557644
      reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Data from literature points toward a cytotoxic mechanism of the accumulated AICA-riboside."
      explanation: The phenotype-defining case series attributes disease to AICA-riboside cytotoxicity on the basis of prior literature.

- name: ZMP-Mediated AMPK Activation
  description: >-
    ZMP activates AMP-activated protein kinase, a master regulator of cellular
    energy metabolism that suppresses mTOR-driven anabolic growth. ATIC-null
    HeLa cells accumulate ZMP without exogenous AICA-riboside and show
    transcriptome changes in neurodevelopmental, embryogenesis and cell-cycle
    genes. Whether AMPK is chronically activated in patient brain or retina has
    not been measured, so this node is a proposed route of toxicity rather
    than a demonstrated one.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:32939338
    reference_title: "The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutant, crATIC, accumulates ZMP during purine starvation."
    explanation: An ATIC-null human cell line accumulates the AMPK activator endogenously.
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "AICAR is an activator of AMP-activated protein kinase (AMPK)"
    explanation: Review of ATIC deficiency cites AICAR as an AMPK activator when discussing the disease mechanism.
  downstream:
  - target: Cytotoxic Injury to Developing Neural, Retinal and Skeletal Tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - aicar_riboside_cytotoxicity
    description: >-
      Sustained AMPK activation during development is one proposed route from
      ZMP accumulation to tissue injury; it has not been tested in patient
      tissue or in a whole-animal model.

- name: Cytotoxic Injury to Developing Neural, Retinal and Skeletal Tissue
  description: >-
    The tissues most affected are the developing brain, the retina and choroid,
    and the growing skeleton, with prenatal onset of growth restriction and
    congenital visual loss in the most severe patients. How accumulated
    AICA-riboside and ZMP damage these tissues is not known.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: choroid
    term:
      id: UBERON:0001776
      label: optic choroid
  - preferred_term: vertebral column
    term:
      id: UBERON:0001130
      label: vertebral column
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we define AICA-ribosiduria as the syndromic association of severe-to-profound global neurodevelopmental impairment, severe visual impairment due to chorioretinal atrophy, ante-postnatal growth impairment, and severe scoliosis"
    explanation: The core clinical definition locates the disease in brain, retina, somatic growth and spine.
  downstream:
  - target: Severe global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Neurodevelopmental impairment is a core feature; the neural mechanism is not defined.
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Early-onset epilepsy accompanies the neurodevelopmental impairment.
  - target: Chorioretinal atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chorioretinal atrophy is the retinal lesion behind the visual impairment.
  - target: Intrauterine growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Growth restriction begins before birth.
  - target: Postnatal growth retardation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Growth impairment continues after birth.
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Severe scoliosis is part of the core phenotype in the severe patients.
  - target: Coarse facial features
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Dysmorphic features, especially coarse facies, were present in all four severe patients.
  - target: Anteverted nares
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: An upturned nose is part of the recurring facial gestalt.
  - target: Coarctation of aorta
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A less frequent developmental malformation.
  - target: Elevated circulating hepatic transaminase concentration

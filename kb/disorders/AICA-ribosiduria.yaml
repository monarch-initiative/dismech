biochemical:
- name: Increased urinary AICA-riboside
  presence: INCREASED
  biomarker_term:
    preferred_term: AICA-riboside
    term:
      id: CHEBI:28498
      label: acadesine
  context: >-
    Massive urinary excretion of AICA-riboside, first detected with the
    Bratton-Marshall test, is the diagnostic marker. Capillary electrophoresis
    with direct UV detection of AICA and AICA-riboside in untreated urine was
    developed as a screening method.
  readouts:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Urinary AICA-riboside reports the accumulated substrate of the blocked transformylase step.
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: PHARMACODYNAMIC_MARKER_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: Excretion fell after a purine-enriched diet, so it can track response to substrate-reduction treatment.
  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a positive urinary Bratton-Marshall test led to identification of a massive excretion of 5-amino-4-imidazolecarboxamide (AICA)-riboside"
    explanation: Urinary AICA-riboside identified the index patient.
  - reference: PMID:16798121
    reference_title: "Diagnosing AICA-ribosiduria by capillary electrophoresis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The method is based on direct ultraviolet detection of 5-amino-4-imidazolecarboxamide (AICA) and 5-amino-4-imidazolecarboxamide riboside (AICAr) in untreated urine."
    explanation: Describes an analytical screening method validated on cell-line and spiked urine samples, not on patients.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: The marker responded to dietary treatment in one patient.

- name: Increased urinary succinyladenosine
  presence: INCREASED
  biomarker_term:
    preferred_term: succinyladenosine
    term:
      id: CHEBI:71169
      label: succinyladenosine
  context: >-
    Succinyladenosine, better known as a marker of adenylosuccinate lyase
    deficiency, is also excreted in excess in AICA-ribosiduria, so an isolated
    succinylpurine finding does not by itself distinguish the two disorders.
  readouts:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Co-excreted pathway intermediate that fell together with AICA-riboside on treatment.
  evidence:
  - reference: PMID:38244287

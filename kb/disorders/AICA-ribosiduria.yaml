    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early diagnosis lead to early interventional therapy and genetic counselling."
    explanation: Reports genetic counselling following diagnosis.
- name: Orthopedic management of scoliosis
  description: >-

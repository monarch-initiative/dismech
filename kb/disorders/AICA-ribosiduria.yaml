phenotypes:
- category: Neurologic
  name: Global developmental delay
  description: >-
    Developmental delay ranges from severe-to-profound impairment in the early
    case series to later-recognized psychomotor delay in two siblings. The
    siblings acquired early milestones, then showed motor and language delay
    from the second year of life and mild intellectual disability on later
    testing.
  diagnostic: true
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we define AICA-ribosiduria as the syndromic association of severe-to-profound global neurodevelopmental impairment"
    explanation: Neurodevelopmental impairment is part of the phenotype definition shared by four patients.
  - reference: PMID:36367252
    reference_title: 'Expanding the spectrum of clinical severity of AICA-ribosiduria: Report of two siblings with mild phenotype caused by a novel pathogenic variant in ATIC gene.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: psychomotor delay since the second year of life
    explanation: The two siblings broaden the developmental severity and onset spectrum.
- category: Neurologic
  name: Seizure
  description: >-
    Seizures occurred in three of four patients in the 2020 series, with variable treatment response; neither sibling in the milder 2023 report had epilepsy.
  phenotype_contexts:

genetic:
- name: ATIC
  gene_term:
    preferred_term: ATIC
    term:
      id: hgnc:794
      label: ATIC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ATIC lies on chromosome 2q35. Reported alleles include recurrent
    p.Lys426Arg, frameshift, nonsense and splice-site variants. The 2020 series
    identified c.406G>A p.Ala136Thr with c.1654A>T p.Lys552Ter in one child. Two
    sisters had genomic p.Lys426Arg heterozygosity but only that allele detected
    in transcript studies; a second noncoding allele causing RNA instability was
    proposed, not identified or functionally localized. Genotype-severity
    correlations remain provisional.
  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of ATIC showed a K426R change in the transformylase region in one allele and a frameshift in the other."
    explanation: Identifies biallelic ATIC variants in the index patient.
  - reference: PMID:35637059
    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel splice site variant; c.1321-2A > G and a previously reported missense variant; c.1277A > G (p.Lys426Arg) were identified."
    explanation: Recurrence of p.Lys426Arg in an unrelated patient from India.
  - reference: PMID:36367252
    reference_title: "Expanding the spectrum of clinical severity of AICA-ribosiduria: Report of two siblings with mild phenotype caused by a novel pathogenic variant in ATIC gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report two new cases of AICA-ribosiduria carrying new pathogenic variants in ATIC (c.421C>T;p.Arg141Ter and c.1753A>G p.Thr585Ala) associated to a milder phenotype"
    explanation: Further biallelic ATIC variants in two siblings with a milder phenotype.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "compound-heterozygous for the variants c.1277 A > G (p.K426R) and c.642G > C (p.Q214H) in ATIC"
    explanation: A third recurrence of p.Lys426Arg with a previously unreported missense allele.

  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the Lys426Arg variation was found in a homozygous state in transcript studies, suggesting the presence of a non-coding variant responsible for RNA instability on the second allele.
    explanation: Full text of Ramond et al. (2020), PMID:32557644. Allele-specific transcript findings suggest a second defect; they do not identify its sequence or establish a regulatory element.
animal_models:
- name: atic knockout zebrafish
  species: Zebrafish
  genotype: CRISPR/Cas9 atic-/- knockout
  publication: PMID:40623538
  description: >-
    CRISPR/Cas9 atic knockout zebrafish studied alongside Atic knockdown in
    C2C12 myoblasts. The abstract reports AICAR accumulation and impaired IMP
    synthesis across these models. Zebrafish developed muscle dysfunction that
    improved after eight weeks of aerobic training; clinical efficacy in
    inherited human ATIC deficiency is unknown.
  modeled_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Loss of atic interrupts de novo purine synthesis, blocks IMP synthesis and
      causes AICAR accumulation, as in patients.
    limitations: >-
      The study reports skeletal muscle atrophy through reduced oxidative
      phosphorylation, which is not a described feature of the human disease, and
      does not report retinal, neurodevelopmental or spinal phenotypes. Zebrafish
      is a non-mammalian species, and whether the muscle findings bear on the
      human disorder is untested.
    evidence:
    - reference: PMID:40623538
      reference_title: "Aerobic exercise ameliorates skeletal muscle atrophy in atic knockout zebrafish through the oxidative phosphorylation pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "atic/Atic knockout/knockdown led to the interruption of purine de novo synthesis, abnormal 5-aminoimidazole-4-carboxamide ribonucleotide (AICAR) accumulation, and blockage of inosine monophosphate (IMP) synthesis"
      explanation: The abstract reports the shared knockout/knockdown phenotype across zebrafish and C2C12 systems; it does not resolve each assay by model.
  evidence:
  - reference: PMID:40623538
    reference_title: "Aerobic exercise ameliorates skeletal muscle atrophy in atic knockout zebrafish through the oxidative phosphorylation pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study constructed a CRISPR/Cas9-mediated zebrafish atic knockout model"
    explanation: Describes the construction of the model.

experimental_models:
- name: Patient skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured skin fibroblasts from patients, used to measure transformylase and
    cyclohydrolase activity, to show AICAR accumulation after AICA-riboside
    loading, and to score purinosome assembly.
  modeled_mechanisms:
  - target: Impaired Purinosome Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient-derived cells carrying the disease genotype show impaired purinosome assembly.
    limitations: >-
      Fibroblasts are not a disease-relevant tissue, and assembly was scored in
      purine-depleted medium; the cells cannot show how the defect leads to
      retinal or neural injury.
    evidence:
    - reference: PMID:22180458
      reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we proved in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency that various mutations of ATIC and ADSL destabilize to various degrees of purinosome assembly"
      explanation: Directly observed in patient fibroblasts.
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient fibroblasts accumulate AICAR when loaded with AICA-riboside, unlike control cells.
    limitations: >-
      The accumulation requires exogenous AICA-riboside loading, so the assay
      shows the block rather than the endogenous metabolite burden.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Incubation of her fibroblasts with AICA-riboside led to accumulation of AICAR, not observed in control cells"
      explanation: Shows the metabolic block in patient cells.

- name: CRISPR-Cas9 ATIC-null HeLa cells (crATIC)
  experimental_model_type: CELL_LINE
  description: >-
    Engineered ATIC-null HeLa cells accumulate endogenous ZMP during purine
    starvation. Full-text experiments show that adenine supplementation prevents
    ZMP accumulation and permits proliferative growth. RNA sequencing identified
    transcriptional differences under supplemented and depleted conditions;
    these are not direct demonstrations of neural injury or chronic AMPK
    activation.
  modeled_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces endogenous ZMP accumulation behind the ATIC block.
    limitations: >-
      A cancer cell line carrying a complete engineered knockout rather than
      patient alleles; accumulation is conditional on purine starvation, and the
      line cannot model neural, retinal or skeletal development.
    evidence:
    - reference: PMID:32939338
      reference_title: "The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This mutant, crATIC, accumulates ZMP during purine starvation."
      explanation: Endogenous ZMP accumulation in the ATIC-null line.

    - reference: PMID:32939338
      reference_title: 'The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: In addition to its role in rescuing the DNPS KO phenotype, adenine supplementation shuts down DNPS ... and prevents ZMP accumulation in crATIC.
      explanation: Adenine availability modifies the biochemical phenotype in culture.
- name: Atic knockdown C2C12 myoblasts
  experimental_model_type: CELL_LINE
  description: Mouse C2C12 myoblasts subjected to Atic siRNA knockdown were studied alongside atic knockout zebrafish. The abstract reports purine-pathway and mitochondrial effects jointly across the two models, so individual assay results cannot all be assigned specifically to the cultured cells.
  evidence:
  - reference: PMID:40623538
    reference_title: "Aerobic exercise ameliorates skeletal muscle atrophy in atic knockout zebrafish through the oxidative phosphorylation pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: a siRNA-interfered C2C12 myoblast cell model.
    explanation: The cultured mouse-cell experiment is distinct from the zebrafish model-organism evidence.
treatments:
- name: Purine-Enriched Diet
  description: >-
    Increasing dietary purine supply favours purine salvage and suppresses de
    novo purine synthesis, reducing flux into the blocked pathway. In a single
    teenage patient, urinary AICA-riboside and succinyladenosine fell
    significantly after the diet was introduced. Clinical outcomes were not
    reported in the abstract, and no controlled study exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: purine-enriched diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    description: >-
      Suppressing de novo purine synthesis reduces the production of the substrate
      that accumulates behind the ATIC block.
  evidence:
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: Biochemical response to the diet in one patient.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By suppressing de novo purine biosynthesis in favour of purine salvage, exogenous purine substitution represents a promising treatment approach for AICA ribosiduria."
    explanation: States the rationale of the treatment.

- name: Antiseizure Medication
  description: >-
    Symptomatic treatment of epilepsy; response varies between patients and the
    epilepsy is often drug-resistant. In case 2 of the 2020 series, infantile
    spasms resisted vigabatrin, ketogenic diet and corticosteroids until 22
    months; later generalized seizures were controlled with valproate.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseizure medication
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Seizure
    description: Aims to reduce seizures; response is variable and does not establish correction of the metabolic defect.
  evidence:
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "antiseizure medications can be used for the epileptic symptoms of this disease, but the clinical heterogeneity is high"
    explanation: Review recommendation of symptomatic antiseizure treatment with variable response.


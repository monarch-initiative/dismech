    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: Documents excess succinyladenosine excretion in a patient.


animal_models:
- name: atic knockout zebrafish
  species: Zebrafish
  genotype: CRISPR/Cas9 atic-/- knockout
  publication: PMID:40623538
  description: >-
    Germline atic knockout zebrafish, studied together with siRNA knockdown of
    Atic in C2C12 myoblasts. The model reproduces the metabolic block and AICAR
    accumulation and shows skeletal muscle atrophy with mitochondrial
    dysfunction, which was partly reversed by aerobic exercise training.
  modeled_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Loss of atic interrupts de novo purine synthesis, blocks IMP synthesis
      and causes AICAR accumulation, as in patients.
    limitations: >-
      The study reports skeletal muscle atrophy through reduced oxidative
      phosphorylation, which is not a described feature of the human disease,
      and does not report retinal, neurodevelopmental or spinal phenotypes.
      Zebrafish is a non-mammalian species, and whether the muscle findings
      bear on the human disorder is untested.
    evidence:
    - reference: PMID:40623538
      reference_title: "Aerobic exercise ameliorates skeletal muscle atrophy in atic knockout zebrafish through the oxidative phosphorylation pathway."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "atic/Atic knockout/knockdown led to the interruption of purine de novo synthesis, abnormal 5-aminoimidazole-4-carboxamide ribonucleotide (AICAR) accumulation, and blockage of inosine monophosphate (IMP) synthesis"
      explanation: The knockout reproduces the pathway block and substrate accumulation of the human disorder.
  evidence:
  - reference: PMID:40623538
    reference_title: "Aerobic exercise ameliorates skeletal muscle atrophy in atic knockout zebrafish through the oxidative phosphorylation pathway."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This study constructed a CRISPR/Cas9-mediated zebrafish atic knockout model and a siRNA-interfered C2C12 myoblast cell model."
    explanation: Describes the construction of the model.

experimental_models:
- name: Patient skin fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Cultured skin fibroblasts from patients, used to measure transformylase and
    cyclohydrolase activity, to show AICAR accumulation after AICA-riboside
    loading, and to score purinosome assembly.
  modeled_mechanisms:
  - target: Failure of Purinosome Assembly
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient-derived cells carrying the disease genotype show impaired purinosome assembly.
    limitations: >-
      Fibroblasts are not a disease-relevant tissue, and assembly was scored in
      purine-depleted medium; the cells cannot show how the defect leads to
      retinal or neural injury.
    evidence:
    - reference: PMID:22180458
      reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we proved in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency that various mutations of ATIC and ADSL destabilize to various degrees of purinosome assembly"
      explanation: Directly observed in patient fibroblasts.
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Patient fibroblasts accumulate AICAR when loaded with AICA-riboside, unlike control cells.
    limitations: >-
      The accumulation requires exogenous AICA-riboside loading, so the assay
      shows the block rather than the endogenous metabolite burden.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Incubation of her fibroblasts with AICA-riboside led to accumulation of AICAR, not observed in control cells"
      explanation: Shows the metabolic block in patient cells.

- name: CRISPR-Cas9 ATIC-null HeLa cells (crATIC)
  experimental_model_type: CELL_LINE
  description: >-
    HeLa cells made null for ATIC by genome editing, part of a panel of lines
    each deficient in one step of de novo purine synthesis. crATIC accumulates
    ZMP under purine starvation without exogenous AICA-riboside, and its
    transcriptome was profiled in purine-supplemented and purine-depleted
    conditions.
  modeled_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Reproduces endogenous ZMP accumulation behind the ATIC block.
    limitations: >-
      A cancer cell line carrying a complete engineered knockout rather than
      patient alleles; accumulation is conditional on purine starvation, and
      the line cannot model neural, retinal or skeletal development.
    evidence:
    - reference: PMID:32939338
      reference_title: "The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This mutant, crATIC, accumulates ZMP during purine starvation."
      explanation: Endogenous ZMP accumulation in the ATIC-null line.

treatments:
- name: Purine-Enriched Diet
  description: >-
    Increasing dietary purine supply favours purine salvage and suppresses de
    novo purine synthesis, reducing flux into the blocked pathway. In a single
    teenage patient, urinary AICA-riboside and succinyladenosine fell
    significantly after the diet was introduced. Clinical outcomes were not
    reported in the abstract, and no controlled study exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: purine-enriched diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Accumulation of ZMP and AICA-Riboside
    description: >-
      Suppressing de novo purine synthesis reduces the production of the
      substrate that accumulates behind the ATIC block.
  evidence:
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: Biochemical response to the diet in one patient.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By suppressing de novo purine biosynthesis in favour of purine salvage, exogenous purine substitution represents a promising treatment approach for AICA ribosiduria."
    explanation: States the rationale of the treatment.

- name: Antiseizure Medication
  description: >-
    Symptomatic treatment of epilepsy; response varies between patients and
    the epilepsy is often drug-resistant.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiseizure medication
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Seizure
    description: Controls seizures without affecting the metabolic defect.
  evidence:
  - reference: PMID:40217360
    reference_title: "The diagnosis and treatment of disorders of nucleic acid/nucleotide metabolism associated with epilepsy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "antiseizure medications can be used for the epileptic symptoms of this disease, but the clinical heterogeneity is high"
    explanation: Review recommendation of symptomatic antiseizure treatment with variable response.

- name: Genetic Counseling
  description: >-
    Counseling of families with a recurrence risk of one in four for carrier
    parents, following molecular diagnosis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling

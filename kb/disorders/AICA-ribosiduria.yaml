  description: >-
    Genetic counseling follows diagnosis and addresses autosomal recessive
    inheritance and testing of relatives. When both parents are carriers, the
    one-in-four recurrence risk per pregnancy follows Mendelian inheritance; it
    is not an empirically estimated disease-specific recurrence rate.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling

      reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Data from literature points toward a cytotoxic mechanism of the accumulated AICA-riboside."
      explanation: The phenotype-defining case series attributes disease to AICA-riboside cytotoxicity on the basis of prior literature.

- name: Proposed ZMP-Mediated AMPK Activation
  description: >-
    ZMP is an AMP mimetic and AMPK agonist, making altered AMPK signaling a
    plausible consequence of ATIC deficiency. The crATIC study measured
    substrate accumulation and transcriptional changes, not a causal
    AMPK-mediated injury mechanism in patient tissue. Its discussion notes that
    the ten-hour accumulation period might not suffice for full AMPK activation.
    AMPK-independent effects of AICA-riboside and ZMP are also possible.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: AMP-activated protein kinase activity
    term:
      id: GO:0004679
      label: AMP-activated protein kinase activity
    modifier: INCREASED
  evidence:
  - reference: PMID:32939338
    reference_title: 'The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: ZMP is an AMP mimetic and a potent AMPK agonist.
    explanation: Biochemical background motivates the hypothesis; it does not measure activation in patients.
    quote_role: BACKGROUND
  - reference: PMID:32939338
    reference_title: 'The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: It is possible ZMP accumulation during this period may not have been adequate for full AMPK activation.
    explanation: The authors explicitly qualify AMPK activation in their ten-hour culture experiment.
    quote_role: REVIEW_SYNTHESIS
  downstream:
  - target: Proposed Cellular Cytotoxicity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - aicar_riboside_cytotoxicity
    description: >-
      Sustained AMPK activation during development is one proposed route from ZMP
      accumulation to tissue injury; it has not been tested in patient tissue or
      in a whole-animal model.

- name: Proposed Cellular Cytotoxicity
  description: >-
    Cytotoxicity of accumulated AICA-riboside and ZMP is a proposed cellular
    mechanism. Evidence from pharmacologic and cancer-cell experiments motivates
    this model, but does not establish the affected cell types or explain each
    clinical manifestation of inherited ATIC deficiency. The clinical series
    establishes the organ phenotype; the links from cytotoxicity to that
    phenotype remain hypotheses.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS

    description: Chronic hepatic cytolysis is a less frequent feature.
  - target: Nephrocalcinosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: A less frequent renal feature.
  - target: Genital malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Minor genital malformations are a less frequent developmental feature.


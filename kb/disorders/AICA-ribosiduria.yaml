name: AICA-ribosiduria
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  AICA-ribosiduria is an ultra-rare autosomal recessive inborn error of de
  novo purine synthesis caused by ATIC deficiency. ATIC catalyzes conversion
  of AICAR (ZMP) to FAICAR and then IMP. AICA-riboside accumulates in urine,
  with SAICA-riboside and succinyladenosine; ZMP and its di- and triphosphates
  have been measured in patient erythrocytes. The clinical spectrum includes
  developmental delay and intellectual disability ranging from mild to
  profound, hypotonia, progressive retinal disease with variable visual
  impairment, growth impairment, and sometimes severe scoliosis and epilepsy.
  Hepatic, cardiac, renal and genital findings occur in some patients.
  Metabolite cytotoxicity and inadequate purine supply during development
  remain proposed mechanisms, rather than established explanations for each
  organ manifestation. A purine-enriched diet reduced urinary metabolite
  excretion in one reported patient; clinical benefit remains unestablished.
synonyms:
- ATIC deficiency
- AICA-ribosiduria due to ATIC deficiency
- AICAR transformylase/IMP cyclohydrolase deficiency
- 5-amino-4-imidazolecarboxamide ribosiduria
parents:
- inborn error of purine metabolism
- disorder of de novo purine synthesis
disease_term:
  preferred_term: AICA-ribosiduria
  term:
    id: MONDO:0012099
    label: AICA-ribosiduria
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Autosomal recessive ATIC deficiency is supported by compound heterozygous
    variants segregating from unaffected parents. In two sisters reported in
    2020, genomic sequencing identified only p.Lys426Arg, whereas transcript
    analysis detected only the variant allele, suggesting an unidentified second
    allele affecting RNA stability. Two causative DNA variants have therefore
    not been identified in every reported patient.
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(AICA)-ribosiduria is an exceedingly rare autosomal recessive condition resulting from the disruption of the bifunctional purine biosynthesis protein PURH (ATIC)"
    explanation: The case series defining the phenotype states autosomal recessive inheritance.
  - reference: PMID:35637059
    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Segregation analysis of parents showed the father to be a heterozygous carrier for the splice site variant and the mother, a heterozygous carrier for the missense variant."
    explanation: Parental segregation of the two variants in trans, with unaffected heterozygous parents, is consistent with recessive inheritance.

  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No second variant in trans in ATIC was identified despite sequencing of exons and intronic/exonic junctions.
    explanation: Full text of Ramond et al. (2020), PMID:32557644. The 2020 sisters had a characteristic biochemical phenotype but an unresolved second genomic allele.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Published case counts are dated literature counts, not population prevalence
    estimates. Galli et al. (2023) cited six previous patients and added two
    siblings; their review includes the patient detected by untargeted
    metabolomics in Liu et al. (2021). A further teenage patient was reported in
    the 2024 dietary-treatment study. The small, ascertained case series does
    not support precise population phenotype frequencies or penetrance
    estimates.
  evidence:
  - reference: PMID:36367252
    reference_title: "Expanding the spectrum of clinical severity of AICA-ribosiduria: Report of two siblings with mild phenotype caused by a novel pathogenic variant in ATIC gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, only six cases have been reported presenting a severe phenotype"
    explanation: Gives the count of published cases before the two siblings reported in the same paper.
  - reference: PMID:35637059
    reference_title: "Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This disorder has been previously reported in only 4 cases worldwide, and herein, we report the first from India."
    explanation: Independent case count at the time of the fifth reported patient.

mechanistic_hypotheses:
- hypothesis_group_id: aicar_riboside_cytotoxicity
  hypothesis_label: >-
    Accumulated AICA-riboside and ZMP are cytotoxic to developing tissues
  status: CANONICAL
  description: >-
    The block at the AICAR transformylase step causes accumulation of ZMP
    (AICAR) and its phosphorylated derivatives inside cells and of AICA-riboside
    in body fluids. The favoured explanation of the neurological, retinal,
    growth and skeletal phenotype is a direct toxic effect of these accumulated
    intermediates. ZMP is an AMP mimetic that activates AMP-activated protein
    kinase, one proposed route of toxicity, but no study has measured AMPK
    activity in patient tissue.
  evidence:
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Data from literature points toward a cytotoxic mechanism of the accumulated AICA-riboside."
    explanation: The phenotype-defining case series summarizes the literature as favouring AICA-riboside cytotoxicity.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "accumulation of AICA-riboside is the biochemical hallmark and presumed pathomechanism of the condition"
    explanation: States AICA-riboside accumulation as the presumed disease mechanism in the background of a treatment report.
- hypothesis_group_id: purine_nucleotide_deficiency
  hypothesis_label: >-
    Insufficient de novo purine supply during development
  status: ALTERNATIVE
  description: >-
    Purine supply could be inadequate in tissues that depend on de novo
    synthesis during embryogenesis and organogenesis. Salvage may compensate in
    some tissues and conditions, but normal circulating purines do not exclude
    local or developmental shortages. Both this model and substrate cytotoxicity
    remain hypotheses.
  evidence:
  - reference: url:https://research.dial.uclouvain.be/server/api/core/bitstreams/a35e9001-4c84-4a72-a213-c8300ad8af1a/content
    reference_title: 'https://research.dial.uclouvain.be/server/api/core/bitstreams/a35e9001-4c84-4a72-a213-c8300ad8af1a/content'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: since the salvage recycling pathway may not completely compensate for a purine deficiency
    explanation: Full text of Galli et al. (2023), PMID:36367252. The full discussion explicitly retains incomplete salvage compensation during development as an alternative mechanism.
    quote_role: REVIEW_SYNTHESIS
pathophysiology:
- name: ATIC Bifunctional Enzyme Deficiency
  description: >-
    Biallelic ATIC dysfunction impairs the terminal reactions of de novo IMP
    synthesis. In the index patient, fibroblast transformylase activity was
    profoundly deficient and cyclohydrolase activity was 40% of normal;
    recombinant p.Lys426Arg abolished transformylase activity. These
    measurements are allele-specific. The 2020 series also reported p.Ala136Thr
    in the cyclohydrolase domain, but its proposed functional effect and the
    suggested genotype-severity relationship were not established by enzyme
    assays.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ATIC
    term:
      id: hgnc:794
      label: ATIC
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Reported alleles include the recurrent missense p.Lys426Arg (c.1277A>G),
      which abolishes transformylase activity of the recombinant protein,
      frameshift and nonsense (p.Arg141Ter) alleles, a canonical splice-site
      variant (c.1321-2A>G), and missense p.Thr585Ala and p.Gln214His.
  molecular_functions:
  - preferred_term: AICAR formyltransferase activity
    term:
      id: GO:0004643
      label: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
    modifier: DECREASED
  - preferred_term: IMP cyclohydrolase activity
    term:
      id: GO:0003937
      label: IMP cyclohydrolase activity
    modifier: DECREASED
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AICAR transformylase was profoundly deficient, whereas the IMP cyclohydrolase level was 40% of normal."
    explanation: Enzyme assays in patient fibroblasts show a severe transformylase defect with partial cyclohydrolase loss.
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant protein carrying mutation K426R completely lacks AICAR transformylase activity."
    explanation: The recombinant mutant protein establishes that the missense allele itself abolishes transformylase activity.
  - reference: PMID:32557644
    reference_title: "AICA-ribosiduria due to ATIC deficiency: Delineation of the phenotype with three novel cases, and long-term update on the first case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alteration of the transformylase activity of ATIC might result in a more severe impairment than the alteration of the cyclohydrolase activity."
    explanation: A proposed genotype-phenotype relationship from four patients, not a demonstrated domain-specific severity rule.
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: p.(Ala136Thr) from case 1 is located in the cyclohydrolase domain
    explanation: Full text of Ramond et al. (2020), PMID:32557644. The series includes an allele outside the transformylase domain; loss of transformylase activity cannot be assumed for every genotype.
  downstream:
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    causal_link_type: DIRECT
    description: >-
      Loss of transformylase activity stops conversion of AICAR to FAICAR and thus
      to IMP, the terminal product of the pathway.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Incubation of her fibroblasts with AICA-riboside led to accumulation of AICAR, not observed in control cells, suggesting impairment of the final steps of purine biosynthesis"
      explanation: Patient fibroblasts cannot metabolize AICAR onward, showing the pathway is blocked at the ATIC step.
  - target: Impaired Purinosome Assembly
    causal_link_type: DIRECT
    description: >-
      Mutant ATIC destabilizes assembly of the purinosome, the transient
      multienzyme complex of de novo purine synthesis enzymes.
    evidence:
    - reference: PMID:22180458
      reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we proved in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency that various mutations of ATIC and ADSL destabilize to various degrees of purinosome assembly"
      explanation: Immunolabeling of patient fibroblasts shows impaired purinosome assembly with mutant ATIC.

- name: Impaired Purinosome Assembly
  description: >-
    The purinosome is a cytosolic complex of the de novo purine synthesis
    enzymes that cells assemble when purines are depleted. Its assembly requires
    structurally intact ATIC, and patient fibroblasts assemble it poorly, so the
    defect extends beyond the loss of one catalytic step to the organization of
    the whole pathway.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: skin fibroblast
    term:
      id: CL:0002620
      label: skin fibroblast
  biological_processes:
  - preferred_term: purine nucleotide biosynthetic process
    term:
      id: GO:0006164
      label: purine nucleotide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:22180458
    reference_title: "Mutations of ATIC and ADSL affect purinosome assembly in cultured skin fibroblasts from patients with AICA-ribosiduria and ADSL deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the assembly of functional purinosomes is fully dependent on the presence of structurally unaffected ATIC and ADSL complexes"
    explanation: Establishes that purinosome assembly requires intact ATIC.
  downstream:
  - target: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the assembled complex is expected to reduce channelling of
      intermediates through the pathway; the flux consequence has not been
      measured separately in ATIC-deficient cells.

- name: Blocked De Novo Purine Synthesis at the AICAR Transformylase Step
  description: >-
    Loss of ATIC transformylase activity impairs conversion of AICAR to FAICAR.
    Patient fibroblasts and engineered ATIC-null HeLa cells accumulate AICAR. In
    crATIC cells this accumulation occurs during purine starvation; adenine
    supplementation prevents it and supports proliferative growth. These culture
    results demonstrate dependence on purine availability, but do not measure
    purine supply in developing patient tissues.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: "'de novo' IMP biosynthetic process"
    term:
      id: GO:0006189
      label: "'de novo' IMP biosynthetic process"
    modifier: DECREASED
  evidence:
  - reference: PMID:15114530
    reference_title: 'AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Incubation of her fibroblasts with AICA-riboside led to accumulation of AICAR, not observed in control cells
    explanation: Patient fibroblasts demonstrate impaired metabolism of AICAR after riboside loading.
  - reference: PMID:32939338
    reference_title: 'The CRISPR-Cas9 crATIC HeLa transcriptome: Characterization of a novel cellular model of ATIC deficiency and ZMP accumulation.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results demonstrate that crATIC requires purine (adenine) supplementation for proliferative growth, and that ZMP accumulates linearly over a time course of ten hours during purine starvation.
    explanation: Full-text cell experiments link the metabolic phenotype to adenine availability.
  downstream:
  - target: Accumulation of ZMP and AICA-Riboside
    causal_link_type: DIRECT
    description: >-
      The unconverted substrate AICAR (ZMP) builds up in cells and its
      dephosphorylated riboside is released into body fluids.
    evidence:
    - reference: PMID:15114530
      reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "ZMP and its di- and triphosphate accumulated in the patient's erythrocytes."
      explanation: Accumulation of the blocked substrate and its phosphorylated derivatives was measured in the index patient's erythrocytes.

- name: Accumulation of ZMP and AICA-Riboside
  description: >-
    ZMP (AICAR) and its di- and triphosphates accumulate intracellularly, and
    AICA-riboside is excreted in large amounts in urine. SAICA-riboside and
    succinyladenosine are also elevated. Succinyladenosine is the
    dephosphorylated product of adenylosuccinate in the IMP-to-AMP branch,
    rather than an upstream intermediate of the ten-step pathway to IMP. The
    combined urinary profile is diagnostically informative.
  biological_scale: MOLECULAR
  chemical_entities:
  - preferred_term: ZMP (AICAR)
    term:
      id: CHEBI:18406
      label: AICA ribonucleotide
    modifier: INCREASED
  - preferred_term: AICA-riboside
    term:
      id: CHEBI:28498
      label: acadesine
    modifier: INCREASED
  - preferred_term: succinyladenosine

  evidence:
  - reference: PMID:15114530
    reference_title: "AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a positive urinary Bratton-Marshall test led to identification of a massive excretion of 5-amino-4-imidazolecarboxamide (AICA)-riboside, the dephosphorylated counterpart of AICAR"
    explanation: Massive urinary AICA-riboside excretion was the finding that identified the disorder.
  - reference: PMID:38244287
    reference_title: "Treatment of AICA ribosiduria by suppression of de novo purine synthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excessive secretion of AICA-riboside and succinyladenosine was significantly reduced following the introduction of a purine-enriched diet."
    explanation: Documents excess excretion of both AICA-riboside and succinyladenosine in a further patient.
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AICA-riboside along with SAICA-riboside and succinyladenosine, in urine and cerebrospinal fluid.
    explanation: Full text of Ramond et al. (2020), PMID:32557644. The clinical manuscript describes all three accumulated ribosides.
  downstream:
  - target: Proposed ZMP-Mediated AMPK Activation
    causal_link_type: DIRECT
    hypothesis_groups:
    - aicar_riboside_cytotoxicity
    description: >-
      ZMP is an AMP mimetic and allosteric activator of AMP-activated protein
      kinase; this is established pharmacology, not a measurement in patients.
    evidence:

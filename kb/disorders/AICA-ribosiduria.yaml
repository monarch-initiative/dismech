diagnosis:
- name: Urinary purine metabolite analysis
  description: >-
    Targeted chromatography identifies the combination of AICA-riboside,
    SAICA-riboside and succinyladenosine. A positive Bratton-Marshall screen
    indicates aromatic amines and requires metabolite identification; it does
    not independently distinguish ATIC from ADSL deficiency. Routine metabolic
    screens can be normal.
  evidence:
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A positive urinary Bratton-Marshall test in both sisters suggested accumulation of SAICA-riboside and/or AICA-riboside.
    explanation: Full text of Ramond et al. (2020), PMID:32557644. The screen is suggestive rather than analyte-specific.
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Quantification by liquid chromatography coupled with a photo-diode array showed the same profile as the first ATIC-deficient patient
    explanation: Full text of Ramond et al. (2020), PMID:32557644. Chromatographic profiling confirmed the biochemical diagnosis.
- name: ATIC molecular testing
  description: >-
    Exome or targeted sequencing with parental segregation can identify
    biallelic ATIC variants. A characteristic urinary profile can support
    further investigation when only one DNA variant is found, as transcript
    analysis suggested an unresolved second allele in two sisters.
  evidence:
  - reference: PMID:35637059
    reference_title: Case report of a rare purine synthesis disorder due to 5-aminoimidazole-4-carboxamide ribonucleotide formyltransferase (AICAR) deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Whole exome sequencing (WES) identified compound heterozygous pathogenic variants in the ATIC.
    explanation: Clinical application of exome sequencing.
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No second variant in trans in ATIC was identified despite sequencing of exons and intronic/exonic junctions.
    explanation: Full text of Ramond et al. (2020), PMID:32557644. Coding-region testing did not resolve both alleles in every patient.
- name: Fibroblast enzyme analysis
  description: >-
    Transformylase and cyclohydrolase assays can characterize functional
    impairment; the index patient had profound transformylase deficiency with
    partial cyclohydrolase activity.
  evidence:
  - reference: PMID:15114530
    reference_title: 'AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis caused by mutation of ATIC.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: AICAR transformylase was profoundly deficient, whereas the IMP cyclohydrolase level was 40% of normal.
    explanation: Functional characterization in patient fibroblasts.
differential_diagnoses:
- name: Adenylosuccinate lyase deficiency
  description: >-
    Developmental impairment and increased urinary succinylpurines overlap with
    ATIC deficiency.
  distinguishing_features:
  - Identification of marked AICA-riboside accumulation in addition to SAICA-riboside and succinyladenosine supports ATIC deficiency.
  - Molecular testing distinguishes ATIC from ADSL defects.
  evidence:
  - reference: url:https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download
    reference_title: 'https://research.dial.uclouvain.be/bitstreams/67edbfed-0021-4825-a673-f8aa22dde9cb/download'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: revealed an abnormal presence of SAICA-riboside (as observed in adenylosuccinase deficiency)
    explanation: Full text of Ramond et al. (2020), PMID:32557644. The initial metabolite screen overlaps with ADSL deficiency; subsequent chromatography identifies AICA-riboside.
notes: >-
  The published series are too small and heterogeneous for reliable
  phenotype-frequency or penetrance estimates. Severe and milder presentations
  are treated as a clinical spectrum, not distinct mechanistic subtypes. The
  2020 series documents infantile spasms resistant to ketogenic diet in one
  patient. The 2025 conference abstract DOI:10.1016/j.gimo.2025.102875 concerns
  ketogenic treatment of epileptic spasms, but its abstract and full text are
  unavailable in the reference record; no efficacy claim is inferred from its
  title.

- name: Endolysosomal Vacuolation
  biological_scale: CELLULAR
  description: >-
    Large LAMP-2-positive vacuoles derived from the late endosome-lysosome
    compartment fill the cytoplasm of neurons, skeletal muscle, cartilage, heart,
    osteoblasts, and fibroblasts. In patients this presents as a generalized
    vacuolar storage picture with normal lysosomal enzyme activities.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: chondrocyte
    term:

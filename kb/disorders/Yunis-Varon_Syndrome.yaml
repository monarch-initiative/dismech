    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:24610892
    reference_title: "Yunis-varon syndrome: further delineation of cardiovascular and endocrine outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Short stature, successfully treated with growth hormone, and hypertension secondary to bilateral renal artery stenosis expand the phenotype."
    explanation: Single-patient report of successful growth hormone treatment.
animal_models:
- name: Fig4 pale tremor (Fig4 plt/plt) mouse
  species: Mouse
  genotype: Fig4 plt/plt (ETn2beta transposon insertion in intron 18; null)
  publication: PMID:17572665
  description: >-
    Spontaneous Fig4-null mouse with spongiform degeneration of brain and
    peripheral ganglia, defective myelination, diluted pigmentation, and
    juvenile lethality. It reproduces the neuronal vacuolation and the low bone
    mass of YVS.
  modeled_mechanisms:
  - target: Neuronal Vacuolar Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Neurodegeneration with enlarged neuronal vacuoles, as in YVS neuropathology.
    limitations: >-
      The mouse was first characterized as a CMT4J model, and the cited sources
      do not report the structural brain malformations seen in YVS.
    evidence:
    - reference: PMID:23623387
      reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous Fig4-null mice exhibit features of YVS, including neurodegeneration and enlarged vacuoles in neurons."
      explanation: Links the mouse neuropathology to YVS.
  - target: Osteoblast Dysfunction and Reduced Bone Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced bone formation rate with normal osteoclasts in vertebrae.
    limitations: >-
      Histomorphometry was done at day 21 in lumbar vertebrae only; the cited
      sources do not report the digital and clavicular aplasia of YVS in the mouse.
    evidence:
    - reference: PMID:39669591
      reference_title: Exploring the phenotypic spectrum and osteopenia mechanisms in Yunis-Varón syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mineralizing surface and bone formation rate were reduced in Fig4plt/plt mice"
      explanation: Bone formation defect measured in this model.
discussions:
- discussion_id: skeletal-patterning-mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does loss of PI(3,5)P2 produce the patterned aplasia of the thumbs,
    halluces, distal phalanges, and clavicles?
  rationale: >-
    Reduced osteoblast bone formation explains the undermineralization and
    osteopenia, but not the absence of specific skeletal elements, which points
    to a developmental patterning or chondrogenic defect that has not been
    studied.
  attaches_to:
  - pathophysiology#Defective Skeletal Development

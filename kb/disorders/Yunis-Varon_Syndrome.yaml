histopathology:
- name: Generalized intracytoplasmic vacuolation
  description: >-
    Vacuolar myopathy on muscle biopsy, with similar vacuoles in heart,
    cartilage, and central nervous system. The CNS picture resembles infantile
    acid maltase deficiency, but lysosomal enzyme assays are normal.
  evidence:
  - reference: PMID:7496176
    reference_title: Generalized lysosomal storage in Yunis Varón syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar vacuoles were also present in heart, cartilage, central nervous system"
    explanation: Multi-tissue distribution of vacuoles.
  - reference: PMID:7496176
    reference_title: Generalized lysosomal storage in Yunis Varón syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the histologic findings in the central nervous system resembled those of infantile acid maltase deficiency, the essayed lysosomal enzymes were normal."
    explanation: Distinguishes YVS storage from a primary lysosomal enzyme deficiency.
diagnosis:
- name: Clinical and radiographic recognition of the digital pattern
  description: >-
    The hand-and-foot pattern (bilateral thumb aphalangia, aphalangia of at
    least one other finger, and absent or proximally placed hallux) is the most
    diagnostically valuable finding and should prompt FIG4 sequencing. Clavicular
    hypoplasia alone is a less reliable discriminator.
  diagnosis_term:
    preferred_term: X-ray imaging
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:42661261
    reference_title: "Yunis Varon Syndrome: Characteristic Limb Abnormalities and Refining of the Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This review demonstrates that YVS has a highly characteristic and recognizable phenotype, with digital abnormalities representing the most diagnostically valuable finding warranting FIG4 sequencing."
    explanation: The digital pattern is the key diagnostic finding.
- name: FIG4 and VAC14 sequencing
  description: >-
    Exome or genome sequencing confirms biallelic FIG4 variants; genome
    sequencing with RNA analysis can detect deep intronic alleles missed by
    exome sequencing. VAC14 should be tested when FIG4 is normal.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing, we identified frameshift and missense mutations of FIG4 in affected individuals from three unrelated families."
    explanation: Exome sequencing identified the causal gene.
  - reference: PMID:28635952
    reference_title: Yunis-Varón syndrome caused by biallelic VAC14 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present the case of a female neonate with clinical features of YVS and normal FIG4 sequencing; exome sequencing identified biallelic rare coding variants in VAC14."
    explanation: VAC14 testing when FIG4 is normal.
treatments:
- name: Genetic counseling and prenatal diagnosis
  description: >-
    Once the familial variants are known, genetic counseling and prenatal
    diagnosis can be offered to at-risk pregnancies.
  treatment_term:
    preferred_term: Genetic counseling
    term:

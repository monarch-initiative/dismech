      reference_title: Exploring the phenotypic spectrum and osteopenia mechanisms in Yunis-Varón syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we show that although the osteoclasts are normal, there is however reduced bone formation, which is consistent with our previous observation of large vacuoles in mouse osteoblasts."
      explanation: Links the osteoblast vacuoles to reduced bone formation.
- name: Neuronal Vacuolar Degeneration
  biological_scale: TISSUE
  description: >-
    Vacuolar degeneration of neurons with intraneuronal inclusions, most marked
    in the thalamus, dentate nuclei, cerebellar cortex, and inferior olivary
    nuclei at autopsy. In the mouse the spongiform degeneration is
    neuron-autonomous: neuronal Fig4 expression is sufficient to prevent it.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:11078567
    reference_title: "Yunis-Varon syndrome: evidence for a lysosomal storage disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autopsy showed prominent intraneuronal inclusions with vacuolar degeneration, mainly in the thalamic, dentate nuclei, cerebellar cortex, and inferior olivary nuclei."
    explanation: Human neuropathology of the node.
  - reference: PMID:22581779
    reference_title: Neuronal expression of Fig4 is both necessary and sufficient to prevent spongiform neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Neuronal expression of Fig4 was sufficient to rescue cellular and neurological phenotypes including spongiform degeneration, gliosis and juvenile lethality."

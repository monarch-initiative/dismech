    term:
      id: GO:0007040
      label: lysosome organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Enlarged vacuoles are found in neurons, muscle, and cartilage."
    explanation: Tissue distribution of the vacuoles in patients.
  - reference: PMID:17572665
    reference_title: Mutation of FIG4 causes neurodegeneration in the pale tremor mouse and patients with CMT4J.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The cytoplasm of fibroblasts from pale tremor mice is filled with large vacuoles that are immunoreactive for LAMP-2 (lysosomal-associated membrane protein 2), consistent with dysfunction of the late endosome-lysosome axis."
    explanation: Identifies the vacuoles as lysosome-derived.
  - reference: PMID:26662798
    reference_title: FIG4 regulates lysosome membrane homeostasis independent of phosphatase function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These data show that FIG4 plays a critical noncatalytic function in maintaining lysosomal membrane homeostasis, and that this function is disrupted by mutations that cause CMT4J and YVS."
    explanation: Drosophila evidence that FIG4 loss expands the lysosomal compartment.
  downstream:
  - target: Neuronal Vacuolar Degeneration
    causal_link_type: DIRECT
    description: >-
      Neurons of Fig4-null mice contain enlarged endolysosomal vacuoles in the
      same brain regions that degenerate; neuronal Fig4 expression prevents both.
    evidence:
    - reference: PMID:22581779
      reference_title: Neuronal expression of Fig4 is both necessary and sufficient to prevent spongiform neurodegeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neurons from null mice contain enlarged vacuoles derived from the endosome/lysosome pathway, and astrocytes accumulate proteins involved in autophagy."
      explanation: Places endolysosomal vacuoles in the neurons that undergo spongiform degeneration.
  - target: Vacuolar Myopathy
    causal_link_type: DIRECT
  - target: Oligosacchariduria
    causal_link_type: UNKNOWN
    description: >-
      Both case reports that found abnormal urinary oligosaccharides also found
      lysosomal-type storage vacuoles and interpreted the excretion as part of a
      lysosomal storage process; the oligosaccharide has not been identified and
      the link is inferred rather than demonstrated.
  - target: Osteoblast Dysfunction and Reduced Bone Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Fig4-null osteoblasts accumulate large vacuoles, and reduced bone formation

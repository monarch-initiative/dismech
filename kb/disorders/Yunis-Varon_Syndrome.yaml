    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we provided prenatal diagnosis for this family."
    explanation: Prenatal diagnosis offered after molecular diagnosis in one family.
- name: Growth hormone therapy
  description: >-
    Growth hormone was used successfully for short stature in one long-term

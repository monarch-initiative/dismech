name: Yunis-Varon Syndrome
creation_date: "2026-09-24T20:42:38Z"
category: Mendelian
description: >-
  Yunis-Varon syndrome (YVS; OMIM #216340) is an ultra-rare, usually lethal
  autosomal recessive multisystem disorder combining cleidocranial dysplasia,
  a characteristic digital pattern (absent or aphalangic thumbs and halluces,
  distal aphalangia of the other digits), a severely undermineralized skull
  with wide fontanelles, micrognathia, hypotrichosis, and severe central
  nervous system involvement with hypotonia, developmental delay, and brain
  malformations. It is caused by biallelic null variants in FIG4, the
  phosphatidylinositol-3,5-bisphosphate 5-phosphatase subunit of the
  PIKFYVE-VAC14-FIG4 complex; a single patient with biallelic VAC14 variants
  has also been reported. Loss of the complex lowers PI(3,5)P2, which blocks
  lysosome fission and autolysosome recycling and fills neurons, muscle,
  cartilage, osteoblasts, and fibroblasts with enlarged endolysosomal vacuoles.
  Hypomorphic FIG4 genotypes cause the allelic peripheral neuropathy CMT4J,
  so YVS is the complete-loss end of one allelic series.
disease_term:
  preferred_term: Yunis-Varon Syndrome
  term:
    id: MONDO:0008995
    label: Yunis-Varon syndrome
synonyms:
- Yunis-Varón syndrome
- YVS
- Cleidocranial dysplasia with micrognathia, absent thumbs, and distal aphalangia
- Cleidocranial dysplasia-micrognathia-absent thumbs syndrome
parents:
- skeletal dysplasia
- syndromic disease
notes: >-
  No GeneReviews or StatPearls chapter names this disease: `just
  check-genereviews` against the Bookshelf index snapshot of 2026-09-10
  returned NO_CHAPTER for both collections. A 2026 systematic review found that
  a significant proportion of literature cases lacking molecular confirmation
  are likely misdiagnosed, so phenotype frequencies drawn from pre-molecular
  case series should be read with that caveat.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twenty-two published cases had been reviewed by 2008. A 2026 systematic
    review counted 15 cases with biallelic FIG4 variants and a clinical
    diagnosis of YVS, and a further 25 clinical diagnoses without FIG4 variants.
    No population-based prevalence estimate exists.
  evidence:
  - reference: PMID:18203163
    reference_title: "Yunis-Varon syndrome: further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We review clinical data on 22 published cases in order to delineate the phenotype of this condition."
    explanation: Published case count at the time of the review, standing in for an absent population estimate.
  - reference: PMID:42661261
    reference_title: "Yunis Varon Syndrome: Characteristic Limb Abnormalities and Refining of the Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This systematic review analyzes 15 cases with biallelic FIG4 variants and a clinical diagnosis of YVS to refine the clinical phenotype and diagnostic criteria, as well as a further 25 clinical diagnoses without FIG4 variants."
    explanation: The molecularly confirmed caseload is only 15 individuals.
inheritance:
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for FIG4 null
    alleles. Recessive inheritance was inferred at the first description from
    affected sibships in consanguineous families without sex predilection, and
    confirmed when biallelic FIG4 variants were found.
  evidence:
  - reference: PMID:7395825
    reference_title: "Cleidocranial dysostosis, severe micrognathism, bilateral absence of thumbs and first metatarsal bone, and distal aphalangia: a new genetic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The existence of consanguinity in two of the families, both with two affected siblings, as well as the lack of sex predilection, allow us to postulate that this syndrome is inherited in a recessive manner."
    explanation: Original pedigree-based inference of recessive inheritance.
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that homozygosity or compound heterozygosity for null mutations of FIG4 is responsible for YVS, the most severe known human phenotype caused by defective phosphoinositide metabolism."
    explanation: Molecular confirmation of the biallelic, recessive genotype.
genetic:
- name: FIG4
  gene_term:
    preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Reported YVS alleles include frameshift, canonical splice, nonsense and
    missense variants, and a deep intronic variant (c.2097-809A>G) that
    activates a pseudoexon from intron 18. The genotype-phenotype rule is that
    YVS requires two null alleles, whereas CMT4J patients carry at least one
    hypomorphic allele and disease is confined to the peripheral nervous system.
    Intermediate phenotypes with both central and peripheral involvement also
    occur.
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By whole-exome sequencing, we identified frameshift and missense mutations of FIG4 in affected individuals from three unrelated families."
    explanation: Gene discovery in three unrelated families.
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In a functional assay, both missense substitutions failed to correct the vacuolar phenotype of Fig4-null mouse fibroblasts."
    explanation: Functional complementation shows the missense alleles are loss of function.
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, in Charcot-Marie-Tooth disease type 4J (also caused by FIG4 mutations), one of the FIG4 alleles is hypomorphic and disease is limited to the peripheral nervous system."
    explanation: Places YVS at the null end of the FIG4 allelic series relative to CMT4J.
  - reference: PMID:32268254
    reference_title: FIG4 mutations leading to parkinsonism and a phenotypical continuum between CMT4J and Yunis Varón syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study extends the phenotypic spectrum of FIG4-related disease to Parkinsonism as a feature and demonstrates new phenotypes on a continuum between CMT4J and Yunis Varón syndrome."
    explanation: Intermediate FIG4 phenotypes between CMT4J and YVS in five patients.
  - reference: PMID:24088667
    reference_title: Novel FIG4 mutations in Yunis-Varon syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed a YVS patient using whole-exome sequencing, and identified novel biallelic FIG4 mutations: c.1750+1delG and c.2284_2285delCT (p.S762Wfs*3)."
    explanation: Independent replication with two predicted-null alleles.
  - reference: PMID:34899148
    reference_title: "FIG4-Associated Yunis-Varon Syndrome: Identification of a Novel Missense Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using whole-exome sequencing, we identified a novel homozygous missense variant (c.968A>G; p.Gln323Arg) in the FIG4 gene."
    explanation: Further independent family with a homozygous FIG4 variant.
  - reference: PMID:40860339
    reference_title: Identification and splicing analysis of the first deep intronic FIG4 variant causing Yunis-Varon syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-genome sequencing (WGS) identified a compound heterozygous variant in the proband: c.2097-809A>G and c.1141C>T (p.R381*)."
    explanation: Compound heterozygous nonsense plus deep intronic genotype in a family with three affected individuals.
  - reference: PMID:40860339
    reference_title: Identification and splicing analysis of the first deep intronic FIG4 variant causing Yunis-Varon syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The c.2097-809A>G variant generated an aberrant splicing transcript containing a pseudoexon from intron 18, as demonstrated by further RT-PCR and splicing analysis."
    explanation: Splicing analysis shows the deep intronic allele disrupts the transcript.
- name: VAC14
  gene_term:
    preferred_term: VAC14
    term:
      id: hgnc:25507
      label: VAC14
  association: Causal
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    VAC14 is the scaffold that couples FIG4 to the PIKFYVE kinase. Biallelic
    VAC14 variants have been reported in a single neonate with clinical YVS and
    normal FIG4 sequencing; other biallelic VAC14 genotypes cause childhood-onset
    striatonigral degeneration without the YVS skeletal phenotype. MONDO's
    causal-gene annotation for this disease lists FIG4 only.
  evidence:
  - reference: PMID:28635952
    reference_title: Yunis-Varón syndrome caused by biallelic VAC14 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we present the case of a female neonate with clinical features of YVS and normal FIG4 sequencing; exome sequencing identified biallelic rare coding variants in VAC14."
    explanation: Single-patient report establishing VAC14 as a second YVS gene.
pathophysiology:
- name: Biallelic FIG4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two null FIG4 alleles abolish the phosphoinositide 5-phosphatase subunit of
    the PIKFYVE-VAC14-FIG4 complex. Because FIG4 also stabilizes the complex and
    supports PIKFYVE activity, its absence lowers rather than raises PI(3,5)P2.
  genes:
  - preferred_term: FIG4
    term:
      id: hgnc:16873
      label: FIG4
  molecular_functions:
  - preferred_term: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    term:
      id: GO:0043813
      label: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23623387
    reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrate that homozygosity or compound heterozygosity for null mutations of FIG4 is responsible for YVS, the most severe known human phenotype caused by defective phosphoinositide metabolism."
    explanation: Establishes complete FIG4 loss as the initiating lesion.
  - reference: PMID:24088667
    reference_title: Novel FIG4 mutations in Yunis-Varon syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our result supports the idea that biallelic null mutations of FIG4 cause YVS in human"
    explanation: Independent support for biallelic null FIG4 as the lesion.
  downstream:
  - target: PI(3,5)P2 Deficiency
    causal_link_type: DIRECT
    description: >-
      Loss of FIG4 lowers cellular PI(3,5)P2, because FIG4 is needed to hold the
      PI(3,5)P2-synthesizing complex together.
    evidence:
    - reference: PMID:25926456
      reference_title: Reactivation of Lysosomal Ca2+ Efflux Rescues Abnormal Lysosomal Storage in FIG4-Deficient Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "However, the loss of FIG4 decreases PI3,5P2 levels likely due to FIG4's dominant effect in scaffolding a PI3,5P2 synthetic protein complex."
      explanation: States the direction of the change and its scaffolding explanation, drawn from earlier cell studies.
  - target: Central Nervous System Maldevelopment and Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The genotype-phenotype comparison with CMT4J shows that complete absence of
      FIG4 activity, not partial loss, is what produces central nervous system
      disease.
    evidence:
    - reference: PMID:23623387
      reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This genotype-phenotype correlation demonstrates that absence of FIG4 activity leads to central nervous system dysfunction and extensive skeletal anomalies."
      explanation: Links complete FIG4 loss to CNS dysfunction at the genotype level.
  - target: Defective Skeletal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Complete absence of FIG4 activity produces extensive skeletal anomalies;
      the intermediates between PI(3,5)P2 loss and the digital and clavicular
      aplasia are not known.
    evidence:
    - reference: PMID:23623387
      reference_title: "Yunis-Varón syndrome is caused by mutations in FIG4, encoding a phosphoinositide phosphatase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This genotype-phenotype correlation demonstrates that absence of FIG4 activity leads to central nervous system dysfunction and extensive skeletal anomalies."
      explanation: Links complete FIG4 loss to the skeletal phenotype at the genotype level.
- name: Biallelic VAC14 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic VAC14 variants remove the scaffold of the PIKFYVE-VAC14-FIG4
    complex, which is required for PI(3,5)P2 synthesis. Reported in one YVS
    patient.
  genes:
  - preferred_term: VAC14
    term:
      id: hgnc:25507
      label: VAC14
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:28635952
    reference_title: Yunis-Varón syndrome caused by biallelic VAC14 mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report that VAC14 is a second gene for Yunis-Varón syndrome."
    explanation: Identifies VAC14 as an alternative initiating lesion.
  downstream:
  - target: PI(3,5)P2 Deficiency
    causal_link_type: DIRECT
    description: >-
      FIG4 binds PIKFYVE through VAC14, and every subunit of the complex is
      required for PI(3,5)P2 synthesis.
    evidence:
    - reference: PMID:28635952
      reference_title: Yunis-Varón syndrome caused by biallelic VAC14 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "FIG4 interacts with PIKfyve, a lipid kinase, via the adapter protein VAC14; all subunits of the resulting complex are essential for PtdIns(3,5)P2 synthesis in the endolysosomal membrane compartment."
      explanation: Background biochemistry establishing that VAC14 loss removes PI(3,5)P2 synthesis.
- name: PI(3,5)P2 Deficiency
  biological_scale: MOLECULAR
  description: >-
    Reduced synthesis of the low-abundance signalling lipid PI(3,5)P2 on late
    endosome and lysosome membranes. PI(3,5)P2 is the endogenous ligand of the
    lysosomal calcium channel TRPML1.
  genes:
  - preferred_term: PIKFYVE
    term:
      id: hgnc:23785
      label: PIKFYVE
  biological_processes:
  - preferred_term: phosphatidylinositol-3,5-bisphosphate synthesis
    term:
      id: GO:0046854
      label: phosphatidylinositol phosphate biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:17572665
    reference_title: Mutation of FIG4 causes neurodegeneration in the pale tremor mouse and patients with CMT4J.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The abnormal concentration of PtdIns(3,5)P2 in cultured fibroblasts from pale tremor mice demonstrates the conserved biochemical function of mammalian Fig4."
    explanation: PI(3,5)P2 levels are abnormal in Fig4-null fibroblasts; the abstract does not state the direction, which the preceding edge sources.
  downstream:
  - target: Defective Lysosome Fission
    causal_link_type: DIRECT
    description: >-
      With PI(3,5)P2 deficient, TRPML1-mediated lysosomal calcium efflux is
      suppressed, intralysosomal calcium rises, dynamin-1 is downregulated, and
      lysosomes fail to undergo fission.
    evidence:
    - reference: PMID:25926456
      reference_title: Reactivation of Lysosomal Ca2+ Efflux Rescues Abnormal Lysosomal Storage in FIG4-Deficient Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This finding was consistent with a suppressed Ca(2+) efflux of lysosomes because the endogenous ligand of lysosomal Ca(2+) channel TRPML1 is PI3,5P2 that is deficient in Fig4(-/-) cells."
      explanation: Connects PI(3,5)P2 deficiency to the lysosomal calcium efflux defect.
  - target: Impaired Autolysosome Formation or Recycling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      PI(3,5)P2-deficient neurons and astrocytes accumulate LC3-II, p62 and
      LAMP-2, indicating a block in autolysosome formation or recycling.
    evidence:
    - reference: PMID:19793721
      reference_title: "Defective autophagy in neurons and astrocytes from mice deficient in PI(3,5)P2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Co-localization of p62 and LAMP-2 in affected cells indicates that formation or recycling of the autolysosome is impaired."
      explanation: Shows the autophagy block in Fig4- and Vac14-mutant mouse brain.
- name: Defective Lysosome Fission
  biological_scale: CELLULAR
  description: >-
    Fig4-null cells show impaired lysosome fission with normal fusion,
    associated with raised intralysosomal calcium. Reactivating TRPML1 with the
    synthetic agonist ML-SA1 lowers lysosomal calcium and clears the abnormal
    storage in Fig4-null cells and in fibroblasts from the VAC14 YVS patient.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: lysosome fission
    term:
      id: GO:0170064
      label: lysosome fission
    modifier: DECREASED
  evidence:
  - reference: PMID:25926456
    reference_title: Reactivation of Lysosomal Ca2+ Efflux Rescues Abnormal Lysosomal Storage in FIG4-Deficient Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using a flow cytometry technique that rapidly quantifies lysosome sizes, we detected an impaired lysosomal fission, but normal fusion, in Fig4(-/-) cells."
    explanation: Direct measurement of the fission defect.
  - reference: PMID:25926456
    reference_title: Reactivation of Lysosomal Ca2+ Efflux Rescues Abnormal Lysosomal Storage in FIG4-Deficient Cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The fission defect was associated with a robust increase of intralysosomal Ca(2+) in Fig4(-/-) cells, including FIG4-deficient neurons."
    explanation: Associates the fission defect with lysosomal calcium retention.
  downstream:
  - target: Endolysosomal Vacuolation
    causal_link_type: DIRECT
    description: >-
      Restoring lysosomal calcium efflux rescues the abnormal lysosomal storage,
      placing the fission defect upstream of the vacuoles.
    evidence:
    - reference: PMID:25926456
      reference_title: Reactivation of Lysosomal Ca2+ Efflux Rescues Abnormal Lysosomal Storage in FIG4-Deficient Cells.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This treatment reduced the intralysosomal Ca(2+) level and rescued abnormal lysosomal storage in Fig4(-/-) culture cells and ex vivo DRGs."
      explanation: Rescue experiment supporting the edge from the calcium and fission defect to storage.
    - reference: PMID:28635952
      reference_title: Yunis-Varón syndrome caused by biallelic VAC14 mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cultured patient fibroblasts exhibited a YVS-like vacuolation phenotype ameliorated in a dose-dependent fashion by ML-SA1, a pharmacological activator of the lysosomal PtdIns(3,5)P2 effector TRPML1."
      explanation: The same rescue in cells from a YVS patient.

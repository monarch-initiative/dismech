- name: Progressive Deep Tissue Sclerosis
  description: >-
    Rapidly progressive sclerosis involves all layers of the skin and extends circumferentially into
    subcutaneous fat, fascia, muscle and bone, and can involve mucous membranes. Imaging shows deep-tissue
    inflammation and sclerosis from subcutis to muscle. Fibrosis of internal organs is typically absent,
    distinguishing DPM from systemic sclerosis. Deep sclerosis causes contractures, musculoskeletal atrophy
    and articular ankylosis.

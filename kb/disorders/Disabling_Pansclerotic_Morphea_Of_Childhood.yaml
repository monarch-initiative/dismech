name: Disabling Pansclerotic Morphea of Childhood
creation_date: "2026-10-01T20:21:47Z"
category: Mendelian
synonyms:
- disabling pansclerotic morphea
- DPM
- DPMC
- disabling pansclerotic morphoea of childhood
- pansclerotic morphea
description: >-
  A rare, severe systemic inflammatory and fibrosing disorder at the most severe end of the juvenile
  localized scleroderma (morphea) spectrum, with onset usually in early childhood. Rapidly progressive
  sclerosis extends circumferentially from the dermis through subcutaneous fat and fascia into muscle and
  bone, producing joint contractures, musculoskeletal atrophy, articular ankylosis and immobility. Poor
  wound healing with chronic skin and mucosal ulceration is characteristic, and long-standing ulcers carry
  a risk of cutaneous squamous cell carcinoma. Unlike systemic sclerosis, internal organ fibrosis is
  typically absent and scleroderma-associated autoantibodies are usually not detected. Systemic features in
  genetically defined cases include cytopenias, hypogammaglobulinemia, raised inflammatory markers and
  recurrent infections. Heterozygous germline gain-of-function missense variants in the SH2 domain of STAT4
  were identified in three unrelated families with autosomal dominant or de novo disease; they produce
  constitutive STAT4 phosphorylation and an interleukin-6-driven autoinflammatory loop in dermal
  fibroblasts, and the JAK1/2 inhibitor ruxolitinib improved disease in treated patients. The disease is
  otherwise refractory to conventional immunosuppression and carries high morbidity and mortality from
  sepsis, gangrene, restrictive pulmonary disease and squamous cell carcinoma.

      explanation: Interleukin-6 is sufficient to impair fibroblast wound-closure functions.
- name: Impaired Fibroblast Wound Repair
  description: >-
    Patient dermal fibroblasts migrate slowly and fail to close a scratch wound, contract a collagen matrix
    poorly after TGF-beta stimulation, show disorganized F-actin with enlarged cell size, and secrete less
    procollagen alpha-1 while fibronectin secretion is unchanged. Ruxolitinib restored the rate of scratch
    closure in patient fibroblasts. This cellular defect is the proposed basis of the poor wound healing and
    chronic ulceration of DPM.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED

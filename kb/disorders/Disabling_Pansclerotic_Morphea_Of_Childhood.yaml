inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Monoallelic STAT4 gain-of-function variants were inherited in an autosomal dominant pattern or arose
    de novo; p.His623Tyr has recurred de novo in an unrelated Chinese child. Expressivity is variable: in two of three families a first-degree relative carried milder
    disease (oral ulceration, mild skin disease or early-onset progressive swan-neck deformities of the
    hands), which the authors suggest may reflect genetic modifiers.
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We evaluated four patients from three unrelated families with an autosomal dominant pattern of inheritance of DPM."
    explanation: Documents autosomal dominant transmission across the three families.
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our identification of novel, autosomal dominantly inherited or de novo variants in STAT4 appears to be the first description of a gain-of-function variant in this gene and the first genetic link for DPM."
    explanation: States that the variants were either dominantly inherited or de novo.
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "additional genetic modifiers of disease severity could exist, which may account for the presence of a parent with milder disease in two of the three families"
    explanation: Records variable expressivity, with mildly affected parents in two of the three families.
genetic:
- name: STAT4
  gene_term:
    preferred_term: STAT4
    term:
      id: hgnc:11365
      label: STAT4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Three heterozygous missense variants (p.His623Tyr, p.Ala635Val, p.Ala650Asp) were found in three
    unrelated kindreds, all in the region encoding the SH2 domain. They were absent from population
    databases and, in luciferase, phosphorylation and nuclear-localization assays, behaved as
    gain-of-function alleles. H623Y and A635V are predicted to stabilize the activated dimer, whereas A650D
    is predicted to act through a different intramonomer interaction. Clinically diagnosed DPM reported
    before 2023 was not genotyped, so the fraction of DPM explained by STAT4 is not known. No ClinGen
    gene-disease validity classification is cited here.
  evidence:
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genome sequencing revealed three novel heterozygous missense gain-of-function variants in STAT4."
    explanation: Identifies heterozygous STAT4 missense variants in all three affected kindreds.
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each occurs in the region of STAT4 that encodes the SH2 domain"
    explanation: Locates all three variants in the SH2-domain-encoding region.
  - reference: PMID:37256972
    reference_title: "Variant STAT4 and Response to Ruxolitinib in an Autoinflammatory Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gain-of-function variants in STAT4 caused DPM in the families that we studied."
    explanation: The authors' causal conclusion for the gene-disease relationship.
  - reference: PMID:40518164
    reference_title: "[A case of autoinflammatory disease with STAT4 variant and localized scleroderma]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "基因检测结果显示患儿携带STAT4（NM_003151.4）c.1867C>T（p.His623Tyr）新发杂合变异"
    explanation: >-
      Chinese-language abstract: genetic testing showed that a 6-year-old girl carried a de novo
      heterozygous STAT4 c.1867C>T (p.His623Tyr) variant, the same allele as in one of the original
      families. She presented with erythema nodosum, ankle arthritis and fever before localized skin
      depression; the report frames her disease as autoinflammatory disease with localized scleroderma
      rather than full pansclerotic morphea.
pathophysiology:
- name: STAT4 SH2-Domain Gain-of-Function Signaling
  conforms_to: "jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation"
  description: >-
    Heterozygous SH2-domain missense variants make STAT4 constitutively active. Variant STAT4 drives an
    IL6 promoter reporter in the absence of stimulation, shows raised phosphorylated STAT4 at baseline, and
    after interferon-alpha stimulation keeps phosphorylated STAT4 elevated for longer than wild type. Variant
    protein accumulates in the nucleus, and patient dermal fibroblasts show phosphorylated STAT4 at baseline.
    Persistent phosphorylation in the absence of new phosphorylation suggests that mutant dimers are more
    stable than wild-type dimers.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    zygosity: HETEROZYGOUS
    gene:
      preferred_term: STAT4
      term:
        id: hgnc:11365
        label: STAT4
    description: >-
      Monoallelic SH2-domain missense variants (H623Y, A635V, A650D), inherited dominantly or arising de novo.

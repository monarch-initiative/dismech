    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "serum levels of immunoglobulin classes IgG and IgA were reduced in three of the four patients"
    explanation: Reduced IgG in three of four patients.
  - reference: PMID:7356347
    reference_title: "Disabling pansclerotic morphea of children."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory data were characterized by a polyclonal elevation of gamma-globulin level and by peripheral eosinophilia."
    explanation: >-
      The original clinical series reported raised rather than reduced gamma-globulin, so
      hypogammaglobulinemia may be specific to the STAT4-defined cases rather than to all clinically
      defined DPM.
